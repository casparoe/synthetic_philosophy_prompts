  2.  **Deconstruct Pain Asymbolia:**
      *   *What is it?* A rare neurological condition (usually insula lesions) where patients report feeling pain but lack the motivational/affective response to avoid it.
      *   *The Standard View (Grahek, Klein, etc.):* Patients feel the sensory-discriminative aspect (location, intensity) but lack the affective-motivational aspect (unpleasantness).
      *   *The Conflicting Descriptions:*
          1.  *Description A:* They feel it, don't mind it, won't withdraw. (The "Zombie" or "Stoic" view).
          2.  *Description B:* They feel it, say it hurts, maybe even complain, but don't learn to avoid it. (The "Disconnect" view).
      *   *Philosophical Implication:* If the sensation remains but the badness vanishes, then badness is separable from sensation (Supports Imperativism or Attitudinal theories over Pure Sensory Hedonism).

  3.  **Evaluate the Evidence (Literature Search Strategy - Internal Knowledge):**
      *   *Key Cases:* Schilder & Stengel (1928), Berthier et al. (1988), Grahek (2007).
      *   *Recent Critiques:* Bain (2013), Contini (2020), Martinez (2015).
      *   *The "Myth" Accusation:* Some philosophers (like David Bain) argue that asymbolics *do* find it unpleasant but lack the *motivation* to act. Others argue they lack the *experience* of unpleasantness.
      *   *The "Withdrawal" Issue:* Reflexive withdrawal (spinal cord) vs. Voluntary avoidance. Asymbolics often still withdraw reflexively but don't learn avoidance.
      *   *The "Complaint" Issue:* Do they say "ouch" or "that hurts"? Yes, often. But do they mean it's *bad*? They might mean "this is a pain sensation" without the "I want this to stop" component.

