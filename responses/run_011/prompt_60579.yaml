      *   *Refining the Oracle Case:* A picks the Honeybee (iconic, complex). B picks the Drosophila Larva (developmental stage ambiguity).
      *   *Refining the Gene Drive:* This needs to show where the text *stops*. A says "Calculate the trade-off." B says "The trade-off calculation is invalid."

  6.  **Drafting Section 3: Verbal vs. Substantive:**
      *   *Verbal:* What "probability of sentience" means. Is it a frequency? A degree of belief? A moral weight?
      *   *Substantive:* How to act under extreme uncertainty. Risk tolerance. Whether "expected value" is a valid tool for moral ontology.
      *   *Shared Vocabulary:* Replace "probability of sentience" with "moral weight assignment based on neural capacity." Replace "population" with "estimated biomass/individual count ranges."

  7.  **Drafting Section 4: Closing/Recommendation:**
      *   Needs to be signable.
      *   Cannot be "Fund everything" (B rejects) or "Fund nothing" (A rejects).
      *   *Solution:* Fund *meta-research* and *robust interventions*. Don't commit to the "Multiplier" framework as truth, but acknowledge the *risk* of ignoring it.
      *   *Wording:* "Precautionary principle" meets "Epistemic humility."

  8.  **Review and Refine:**
      *   *Tone Check:* Is A too aggressive? Is B too dismissive? Ensure A sounds like a responsible utilitarian and B sounds like a careful epistemologist.
      *   *Constraint Check:* No citations? Check. 5 Cruxes? Check. Oracle & Gene Drive included? Check.
      *   *Crux Table Detail:* Ensure the "Prediction" column shows how the *bottom line* changes, not just the factual belief.
      *   *Gene Drive Specifics:* The prompt asks to "mark precisely where the joint text has to stop." I need to make sure that visual break is clear.

  9.  **Final Polish:** (Self-Correction during drafting)
