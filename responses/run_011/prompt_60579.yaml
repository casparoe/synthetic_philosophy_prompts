      *   *Correction on Gene Drive:* Ensure A doesn't just say "kill them." A cares about welfare. If the drive prevents suffering (short life, disease), A might support it. If it causes suffering, A opposes. B says we can't know.
      *   *Correction on Shared Claims:* Ensure the point about "existing interventions" is clear. We are already affecting them; the question is *how*.

