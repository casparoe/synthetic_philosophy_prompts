answer: |-
  # PREPARATION SHEET: DRAMATURGICAL PRECISIFICATION
  **Colloquium Q&A Strategy (40 Minutes)**

  ## I. STRATEGIC CONCESSIONS

  **Concede Early (First 10 Minutes):**
  1.  **Restricted Domain:** Explicitly concede that *dramaturgical precisification* does not apply to all vague predicates (e.g., "tall" or "red" may remain contextual or epistemic). It applies specifically to *narrative* or *historical* predicates where the identity of the object is constituted by its temporal extension (e.g., "a marriage," "an affair," "a career," "ruin"). This inoculates you against examples about sand heaps or hair counts that lack narrative structure.
  2.  **Lack of Formalism:** Own the absence of formal semantics immediately. Frame it not as an omission but as a methodological commitment: formal tools presuppose the static boundaries you are arguing are constituted dynamically. To formalize it now would be to beg the question.

  **Refuse At All Costs:**
  *   **The "Just Contextualism" Charge:** Do not allow anyone to collapse your view into dynamic contextualism. Contextualism says the *standard* shifts. You are saying the *fact* is created. If you concede this is just "standards shifting over time," your ontological claim evaporates, and you become a pragmatist.

  **The Reply That Must Land:**
  *   **The Constitution vs. Recognition Distinction:** When pressed on whether the boundary exists before the performance, you must successfully argue that the boundary is *ontologically dependent* on the sequence, not just *epistemically hidden*. If the audience believes you are merely describing how we *find* a boundary rather than how we *make* it, the talk fails.

  ---

  ## II. THE OBJECTIONS (In Order of Arrival)

  ### 1. The Relocation Charge (General Philosophy)
  **Voice:** *Dry, slightly weary senior philosopher.*
  **Objection:** "You admit the sorites intuition remains: no single scene makes the character disloyal. You admit the boundary is unlocatable. You simply move the mystery from the word 'disloyal' to the sequence 'performance.' You haven't dissolved the paradox; you've just relocated the vagueness from the predicate to the history. Why is this progress?"
  **Reply (90s):** "It is progress because it changes the modal status of the boundary. In standard views, the boundary is fixed but unknown (epistemic) or indeterminate (supervaluationist). On my view, the boundary is *counterfactually robust* once constituted. If we rewind the performance to scene 30, the disloyalty does not exist yet. It is not that we are ignorant of a fact; the fact is absent. The paradox relies on the premise that the truth value must exist at every step. I deny that premise for this class of predicates. The truth value accrues."
  **Soft Spot:** You haven't explained *how* it accrues without a sharp cutoff.
  **Verdict:** **Irritating.** This is the price of admission. If you hold the line on "accruing truth," this is manageable.

  ### 2. The Epistemicist Challenge (Epistemicism)
  **Voice:** *Sharp, focused on truth conditions.*
  **Objection:** "You say the boundary is constituted by the enactment. But at scene 39, before the audience reacts, is the character disloyal or not? If you say 'no,' but at scene 40 you say 'yes,' you have posited a sharp boundary between 39 and 40. You are an epistemicist who refuses to admit the boundary is sharp because you find it aesthetically unpleasant."
  **Reply (90s):** "I am not positing a boundary between 39 and 40. I am positing that the property 'disloyal' is a *cumulative* property, like 'winning a war.' You cannot point to the bullet that won the war. The status of the character at scene 39 is *becoming*, not *being*. To ask if they are disloyal at 39 is a category error, like asking if the war is won at the penultimate battle. The sharpness you demand is a demand for a static predicate on a dynamic process."
  **Soft Spot:** "Becoming" is metaphysically slippery. They will press on the truth value of the proposition at t39.
  **Verdict:** **Irritating.** They will not accept "category error" as a solution, but the audience might.

  ### 3. The Supervaluationist (Logic & Penumbras)
  **Voice:** *Concerned with logical validity.*
  **Objection:** "Supervaluationism handles penumbral connections: a man cannot be both bald and hairy. If your boundary is constituted by performance, what stops one performance from constituting him as bald and another as hairy? Do you allow contradictions? If not, what constrains the performance from settling the boundary arbitrarily?"
  **Reply (90s):** "The constraint is the *sequence itself*, not the audience's whim. The script and the enactment provide the material resistance. You cannot perform *Othello* such that he is faithful in the final scene without breaking the internal logic of the preceding thirty-nine. The 'penumbral connection' is preserved by the narrative coherence required to make the performance intelligible *as* that play. We don't allow contradictions for the same reason we don't allow the actor to fly unassisted: it breaks the world being constituted."
  **Soft Spot:** This conflates aesthetic coherence with logical necessity.
  **Verdict:** **Manageable.** Lean into the "world-constituting" aspect of fiction as a proxy for reality.

  ### 4. The Contextualist (Pragmatics)
  **Voice:** *Dismissive of metaphysics.*
  **Objection:** "This is just dynamic contextualism. The 'score' of the conversation shifts with each scene. The standard for 'disloyal' rises until it snaps. You're dressing up pragmatics in metaphysical clothing because you're a novelist and like the word 'constitution.'"
  **Reply (90s):** "Contextualism says the *meaning* or *standard* shifts. I am saying the *world* changes. In contextualism, if I change the context, I change the truth value. In dramaturgical precisification, the sequence *fixes* the truth value for all future contexts. Once the play is done, you cannot shift the context to make him faithful again. The history is sedimented. Contextualism is fluid; my view is geological."
  **Soft Spot:** The distinction between "shifting standard" and "sedimented history" is subtle.
  **Verdict:** **Dangerous.** This is the closest rival theory. Do not let them merge the two.

  ### 5. Formal Semanticist I (Degree Semantics)
  **Voice:** *Technical, impatient with metaphor.*
  **Objection:** "In degree semantics, 'bald' maps to a scale. Is your scale open or closed? If the boundary is constituted by the sequence, is the standard of comparison a free parameter? If so, how do you model the 'constitution' function? Without a measure function, this isn't semantics; it's literary criticism."
  **Reply (90s):** "I am proposing that for this class of predicates, the scale is not pre-existing. The scale is *generated* by the sequence. It is not that we measure the character against a scale of disloyalty; the scenes create the scale. To model this, you would need a dynamic semantics where the domain of discourse expands with each utterance. I lack the formalism, but the commitment is to a non-linear scale structure."
  **Soft Spot:** You admitted you have no formalism. They will smell blood here.
  **Verdict:** **Irritating.** Acknowledge the limitation (see Strategic Concessions) and move on.

  ### 6. Formal Semanticist II (Truth Conditions)
  **Voice:** *Follow-up to #5.*
  **Objection:** "When is the sentence 'He is disloyal' true? Is it only true after the curtain falls? If I walk out at scene 30 and say 'He is disloyal,' am I false? If I am false then but true later, truth is time-relative in a way that violates standard bivalence."
  **Reply (90s):** "Truth is indeed relative to the *completeness of the sequence*. At scene 30, the proposition 'He is disloyal' is *indeterminate* not because of ignorance, but because the truth-maker is incomplete. This is a temporal supervaluationism. The statement acquires a stable truth value only when the relevant sequence is closed. We accept this in history: 'This was a decisive battle' is indeterminate until the war ends."
  **Soft Spot:** This admits the Sorites is solved by waiting, not by analyzing the predicate.
  **Verdict:** **Manageable.** The history analogy is your strongest shield here.

  ### 7. The Performance Scholar (Ontology of Liveness)
  **Voice:** *Friendly but ruthless on "presence."*
  **Objection:** "You treat performance as an ontological engine. But what if I read the play alone at a desk? The sequence exists in the text. The audience's 'knowing' is irrelevant. You've smuggled in a collective witness to do the metaphysical heavy lifting. Does the boundary exist without the gaze?"
  **Reply (90s):** "The 'performance' is not the audience's gaze; it is the *realization of the sequence in time*. Reading is a performance. The key is temporal extension, not collective witness. However, the audience matters because 'disloyalty' is a social predicate. A Robinson Crusoe cannot be disloyal. For the predicates I care about—faithful, cruel, ruined—the witness is part of the ontology. Solitary reading simulates the witness."
  **Soft Spot:** You are retreating from "performance" to "temporal extension" to "social predicate."
  **Verdict:** **Fatal if mishandled.** If you concede the audience is essential, you make the theory subjective. If you deny it, you lose the "dramaturgical" hook. Stick to "realization in time."

  ### 8. The "Nature Has No Plot" Objection (Metaphysics)
  **Voice:** *Realist, skeptical of literary analogies.*
  **Objection:** "Your illustration is a play. Plays have authors and endings. Real life—baldness, heaps, erosion—does not. In reality, there is no 'final scene' to settle the boundary. If your theory requires a closed sequence to constitute the fact, it cannot apply to ongoing reality. It is a theory of history, not of vagueness."
  **Reply (90s):** "I restrict my claim to predicates that *imply* a narrative structure. 'Bald' is a poor example; 'Ruined' is a better one. A marriage does not end until it is over. We live our lives as narratives. We do not experience vagueness as a static snapshot but as a unfolding story. If you demand a theory of vagueness that ignores the temporal nature of human experience, you are solving a logic puzzle, not a philosophical problem."
  **Soft Spot:** This limits the scope of your theory significantly.
  **Verdict:** **Manageable.** Own the restriction to "narrative predicates."

  ### 9. THE SECRET FEAR (The Crack)
  **Voice:** *Quiet, precise, likely the most dangerous philosopher in the room.*
  **Objection:** "You say the boundary is constituted by the sequence. But this means the theory is purely **retroactive**. It tells me when I *was* bald, or when a marriage *ended*. It offers no guidance for the *present*. If I am losing my hair today, your theory cannot tell me if I am bald now, only if I *will have been*. You have solved the Sorites for the historian, but left the agent in the dark. Is this a theory of vagueness, or just a theory of memory?"
  **Reply (90s):** "It is a theory of *commitment*. To act is to begin a sequence that will constitute a fact. If I treat my marriage as ended, I initiate the sequence that constitutes the ending. The theory is not retroactive; it is *prospective*. It warns us that our current actions are drafting the boundary that will judge us. The uncertainty is not a bug; it is the ethical feature. We are writing the script that determines the cutoff."
  **Soft Spot:** This shifts from metaphysics to ethics. It admits the theory doesn't solve the truth-condition problem for the *present*.
  **Verdict:** **Genuinely Fatal.** This exposes that your theory describes *judgment*, not *reality*.

  ---

  ## III. TACTICAL NOTES

  *   **On the "Secret Fear" (#9):** If this question is asked, do not try to bluff a metaphysical solution. Pivot to the *ethical* utility of the uncertainty. The "failure" to determine the present is actually the point: it forces responsibility.
  *   **On Formalism:** If pressed repeatedly on semantics, defer to the linguists in the room. "This is why I need your formal tools. I have the phenomenology; you have the calculus. Let's collaborate."
  *   **On the Novelist Persona:** Use your authority on *change* but do not let it become "just a story." Insist that the novel captures the *metaphysics of time* better than logic does.
  *   **Closing Move:** If the Q&A goes poorly, end by reiterating Move #3: "We already reason this way." Remind them that when a friendship ends, no one signs a document. The silence *is* the boundary. That is the datum any theory must save.
