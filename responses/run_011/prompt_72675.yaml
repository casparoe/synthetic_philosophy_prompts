answer: |-
  ### Part 1: Brainstorming Activity Skeletons

  Here are four distinct structural options for the activity, evaluated against your epistemic goals and logistical constraints.

  **1. The "Tower of Cards" Stability Challenge**
  *   **Concept:** Groups build the tallest free-standing structure possible in a fixed time; they forecast height in centimeters.
  *   **Teaches:** The fragility of detailed plans against physical reality; base rates of structural failure.
  *   **Structural Limit:** Physics is noisy; a lucky breeze or table bump creates high variance that can make base rates look useless, undermining the "outside view" lesson. Scoring confidence on a continuous variable is mathematically tedious for teens.

  **2. The "Cipher Break" Intellectual Sprint**
  *   **Concept:** Groups solve a substitution cipher; they forecast time-to-completion.
  *   **Teaches:** The planning fallacy (underestimating time); the value of reference classes (how long did others take?).
  *   **Structural Limit:** Binary outcome (solved/unsolved). If a group fails, their forecast is invalidated, making scoring and debriefing messy. It privileges prior knowledge (someone who knows ciphers) over forecasting skill.

  **3. The "Trivia Calibration" Marathon**
  *   **Concept:** Groups answer 50 general knowledge questions, assigning confidence probabilities to each answer.
  *   **Teaches:** Overconfidence bias; proper scoring rules; calibration curves.
  *   **Structural Limit:** Does not capture *project planning* or the "vivid plan" problem. It tests general knowledge confidence, not the specific epistemic error of thinking *our specific plan* makes *us* exceptional.

  **4. The "Paper Chain" Production Line (Selected)**
  *   **Concept:** Groups manufacture paper chains for a fixed duration; they forecast total valid links produced.
  *   **Teaches:** Planning fallacy (time spent planning is time not building); reference class selection (which groups count as "like us"?); the cost of modesty (hedging bets lowers max score).
  *   **Structural Limit:** Can feel "too simple" or childish to older teens; requires strict timekeeping to ensure the planning-time trade-off is real.
  *   **Why Selected:** It perfectly isolates the variable of *time allocation* (planning vs. doing), generates clean numerical data for base rates, and allows for a simple, hand-computable scoring rule based on discrete buckets.

  ---

  ### Part 2: Full Activity Design — "The Chain Gang Forecast"

  #### **Pre-Work: Generating the Reference Class (Crucial)**
  *You must do this 3–5 days before the session.*
  1.  **Recruit:** Find a different class (e.g., a homeroom or study hall) of similar size (approx. 20–30 students).
  2.  **Task:** Have them work in pairs or trios to make paper chains for exactly **20 minutes**. Use the same paper type you will use with your society.
  3.  **Data Collection:** Record for each group:
      *   Group Size.
      *   Total Links Made.
      *   **Planning Time:** Ask them to write down how many minutes they spent talking/planning before touching the paper.
      *   **Experience:** Did anyone make paper chains before? (Yes/No).
  4.  **The Case File:** Compile this into a one-page handout. Do not give them the raw list. Give them **Summary Cards**:
      *   *Card A (All Groups):* Mean = 45 links, SD = 12.
      *   *Card B (Groups with >5 min Planning):* Mean = 32 links, SD = 10.
      *   *Card C (Groups with <2 min Planning):* Mean = 51 links, SD = 8.
      *   *Card D (Groups with Prior Experience):* Mean = 60 links, SD = 15.
      *   *Card E (Groups with No Experience):* Mean = 40 links, SD = 9.
      *   *Card F (Top 25% Performers):* Mean = 70 links.
  5.  **Why:** This forces your students to *choose* which card applies to them. Most will argue they belong in Card D or F, even if they don't.

  #### **Materials List**
  *   Paper strips (pre-cut, approx. 2cm x 10cm) — enough for ~100 links per group.
  *   Glue sticks or tape dispensers (1 per group).
  *   Index cards (for forecasts).
  *   Whiteboard & Markers.
  *   Phone Timer (projected or audible).
  *   **1 Six-Sided Die per group.**
  *   **The Case File** (Reference Class Summary Cards).
  *   Snacks (for reward).

  #### **Room Setup**
  *   Tables arranged in clusters of 4–5 students (4 Groups total, approx. 5 students per group).
  *   Whiteboard visible to all.
  *   **Librarian Station:** A desk at the front, physically separated. The Librarian sits here with the Case File.

  #### **Roles (Assigned within each group)**
  1.  **The Planners (2–3 students):** Design the workflow. *Forbidden from touching the Case File.*
  2.  **The Forecasters (2 students):** Calculate the numbers and write the prediction. *Allowed to talk to the Librarian.*
  3.  **The Librarian (1 student):** **Crucial Constraint.** This student sits at the Librarian Station, *not* with the group. They hold the Case File. They cannot hear the group's plan. They can only answer specific queries from the Forecasters (e.g., "What is the mean for groups with no experience?"). They are the institutional separation of "promotion" and "verification."

  ---

  ### **Session 1: The Forecast (45 Minutes)**

  **0:00–0:05 | Introduction & Stakes**
  *   **Read Aloud:** "Welcome. This week is about the price of being right. You will earn points based on two things: how many chains you build, and how accurately you predicted you would build. Points buy snack priority. But there is a catch: The more confident you are, the more points you can win, but the more you lose if you are wrong. You cannot win by guessing 'average.' You must commit."

  **0:05–0:10 | Role Assignment & Librarian Briefing**
  *   Assign roles. Send the **Librarian** to the front desk. Give them the Case File.
  *   **Instruction to Librarian:** "You are the keeper of history. You cannot hear your group's plan. If they ask 'What's the average?', you read Card A. If they ask 'What about groups like us?', you must ask them to define 'like us' before you read a card. If they argue, you do not judge. You only report data."
  *   **Instruction to Group:** "You have 15 minutes to plan and forecast. You have 20 minutes in Session 2 to build. Every minute you spend planning now is a minute lost building later."

  **0:10–0:25 | Planning & Reference Class Negotiation**
  *   Groups discuss strategy. Forecasters must go to the Librarian to get data.
  *   **The Trap:** Encourage them to make a "detailed plan." (e.g., "John folds, Mary glues, Sam checks quality").
  *   **The Conflict:** Forecasters will want to use Card C (Fast Builders) to justify a high number. Planners will feel their detailed plan makes them Card D (Exceptional). The Librarian will report that Card C groups planned less.
  *   **Goal:** You want at least one group to loudly argue, "Yes, but *our* plan is better than *those* groups," and select the optimistic base rate.

  **0:25–0:35 | The Elicitation (Writing the Forecast)**
  *   Hand out Index Cards.
  *   **Instruction:** "Divide the possible outcomes into 5 Buckets. For example: 0–20, 21–40, 41–60, 61–80, 81–100+ links. You must assign a percentage probability to each bucket. They must sum to 100%. Circle the bucket with the highest percentage—this is your **Claim**."
  *   **Constraint:** They must submit this card *before* Session 2 begins. No changes allowed.

  **0:35–0:45 | The "Vivid Plan" Submission**
  *   Groups submit a one-sentence summary of their strategy (e.g., "Assembly line with quality check").
  *   **Read Aloud:** "In Session 2, you will have exactly 20 minutes. The timer starts when I say 'Go'. There is no warm-up."

  ---

  ### **Session 2: The Build & The Reckoning (45 Minutes)**

  **0:00–0:02 | Setup**
  *   Distribute paper and glue. Ensure no one starts early.
  *   **Read Aloud:** "Remember the die. At the end of the build, you will roll. If you roll a 1, 10% of your chain is 'defective' and removed. This represents supply chain variance. The Outside View includes this risk. Your Plan probably does not."

  **0:02–0:22 | Production**
  *   Start timer.
  *   **Observe:** Watch the groups that spent 15 minutes planning in Session 1. They are now rushing. Watch the groups that planned 2 minutes. They are in a rhythm.
  *   **Heckler Management:** If a group finishes early, they must sit on their hands. No helping others.

  **0:22–0:27 | Quality Control & The Die**
  *   Stop building. Count valid links.
  *   **Roll the Die:** Each group rolls.
      *   Roll 2–6: Count stands.
      *   Roll 1: Remove 10% of links (round down). This is the final count.
  *   Record the **Actual Number** on the whiteboard.

  **0:27–0:35 | Scoring (The Arithmetic)**
  *   Return Forecast Cards.
  *   **Read Aloud Scoring Rule:**
      1.  Identify your **Claim Bucket** (the one you circled with the highest %).
      2.  **If Actual is in Claim Bucket:** Score = (Points in Claim Bucket × 2) + (Points in other buckets).
      3.  **If Actual is NOT in Claim Bucket:** Score = (Points in other buckets) − (Points in Claim Bucket).
      4.  *Example:* You put 60 points on Bucket C (Claim), 10 on others. Total 100.
          *   Truth in C: (60×2) + 40 = **160 Points**.
          *   Truth not in C: 40 − 60 = **-20 Points**.
          *   Uniform Spread (20 each): Claim is 20. Truth in Claim: 40 + 80 = **120**. Truth out: 80 − 20 = **60**.
  *   **Task:** Groups calculate their own score. Librarian verifies.
  *   **Why this works:** It punishes overconfidence (losing points) and rewards modesty (uniform spread guarantees a positive, but low, score). It is computable in 30 seconds.

  **0:35–0:45 | The Debrief**
  *   (See detailed script below).

  ---

  ### **Part 3: The Debrief Script**

  Do not lecture. Ask questions that force them to articulate the epistemic principles.

  **Q1: "Look at the group with the highest score. Did they build the most chains?"**
  *   *Listen for:* "No, they were average but they predicted average."
  *   *Point:* Epistemic modesty pays. Accuracy > Optimism.

  **Q2: "Look at the group that lost the most points. What was their plan like?"**
  *   *Listen for:* "They had a really detailed assembly line." / "They were sure they'd beat the average."
  *   *Point:* The vividness of the plan created confidence that the data didn't support.

  **Q3: "Librarians, which Reference Card did your group choose? Did the data match their claim?"**
  *   *Listen for:* "They wanted Card F (Top Performers) but they had no experience."
  *   *Point:* Choosing the reference class is a motivated judgment. We narrow the class to make ourselves look special.

  **Q4: "Who rolled a 1 on the die? Did your plan account for that?"**
  *   *Listen for:* "No, we assumed everything would go right."
  *   *Point:* The Inside View plans for success. The Outside View includes the variance (the die roll).

  **Q5: "If you could run this again, would you spend more time planning or more time forecasting?"**
  *   *Listen for:* "More time looking at the base rates."
  *   *Point:* Information about *others* is often more valuable than information about *us*.

  **Handling the Objection: "But the base rate doesn't apply to us."**
  *   *Student:* "Card C was for random kids. We are a Decision Society. We're smarter."
  *   *Your Response:* "That is exactly the motivated move I wanted to see. You narrowed the reference class to 'Smart Kids' because the 'All Kids' class made you look average. Here is the price you paid: [Show their point loss]. You can claim you are exceptional, but the market (the scoring rule) charges a premium for that claim. Did your performance justify the premium?"

  ---

  ### **Part 4: Failure Mode Analysis**

  **1. The "Uniform Spread" Gamer**
  *   *Behavior:* A group assigns 20% to every bucket to guarantee a safe 60–120 points, avoiding risk.
  *   *Fix:* Acknowledge it. "They played for safety. They won't win the snack prize, but they didn't lose points. In the real world, this is called 'hedging.' It keeps you employed, but it doesn't make you a leader."
  *   *Lesson:* Modesty has a price (lower ceiling).

  **2. The "Expert" Outlier**
  *   *Behavior:* One student has made 1,000 paper chains at home. They crush the base rate.
  *   *Fix:* This is critical. Do not dismiss it. "This is why the Outside View is not a surrender. If you have *specific, verifiable* evidence that you are exceptional (the Expert), you *should* deviate from the base rate. The error isn't deviating; the error is deviating because of a *feeling* rather than *evidence*."

  **3. Public Humiliation**
  *   *Behavior:* A group forecasts 80, gets 20, and scores negative points. They look foolish.
  *   *Fix:* Frame the negative score as "Tuition." "You just bought a very memorable lesson in overconfidence for the price of 20 points. That is cheaper than learning this when managing a real budget." Keep the tone light; laugh at the *situation*, not the students.

  **4. The Hecklers**
  *   *Behavior:* A group finishes early and mocks slower groups.
  *   *Fix:* Enforce the "Sit on Hands" rule strictly. "Forecasting includes time management. If you finished early, your forecast should have accounted for that speed. If you didn't, you were overconfident in your speed, too."

  ---

  ### **Part 5: Limitations & Epistemic Honesty**

  You asked me to be frank about what this activity *cannot* do.

  **1. It cannot reproduce the "Long-Term" Planning Fallacy.**
  *   *Limitation:* This task is 20 minutes. The Planning Fallacy is most dangerous over months or years (e.g., writing a thesis, building a software product). In a 20-minute task, the feedback loop is immediate.
  *   *Your Verbal Patch:* In the debrief, explicitly state: "Today, the penalty for bad planning was 10 minutes. In a startup, the penalty is bankruptcy. The mechanism is the same; the stakes are just higher."

  **2. It cannot fully separate "Skill" from "Luck."**
  *   *Limitation:* The die roll introduces luck, but some groups might just be naturally faster at fine motor skills.
  *   *Your Verbal Patch:* "Some of you are naturally faster. The Outside View doesn't ignore skill; it asks: 'How much faster are we *really*, compared to how much faster we *feel*?'"

  **3. The Scoring Rule is "Proper-Lite".**
  *   *Limitation:* A true logarithmic scoring rule is mathematically complex. The "Wager" rule I designed incentivizes confidence, but a sophisticated game-theorist could still find minor edges.
  *   *Your Verbal Patch:* "This scoring system is a model, not reality. It approximates the risk of confidence. In real life, the penalty for overconfidence isn't points; it's lost trust."

  **Constraint Conflict Note:**
  *   *Conflict:* You requested "one six-sided die per group" and "no budget."
  *   *Resolution:* I used the die for "Supply Chain Variance" (the 1-in-6 penalty). This uses the material without requiring budget. However, if you feel this adds too much noise, use the die for the **Snack Auction** tie-breaker instead. I chose the Variance method because it reinforces the "Outside View includes risk" lesson better.

  **Final Instruction to You:**
  Run the pre-data collection honestly. If the "High Planning" groups in your pre-test actually did *better*, do not hide it. Show the data. If the data says planning helps, and your students plan and fail, the lesson is even sharper: "Even when planning *can* help, you overestimated *how much* it would help." That is the heart of the Planning Fallacy.
