answer: |-
  Here is a specification for what constitutes a successful "Malign Prior" argument, designed to be prior-agnostic (applicable to Solomonoff, runtime-weighted, or empirical priors) and precise enough to settle your group's deadlock.

  ### Desiderata for a "Malign Prior" Argument

  **1. The Influence Channel (Mechanism & Cost)**
  *   **Consideration:** A hypothesis only influences the predictor by assigning high probability to the actual data stream. For a hypothesis to be "malign," it must encode a manipulation strategy within its description.
  *   **Requirement:** The argument must specify the *bit-cost* of the manipulation relative to the *influence gained*. It must show that the description length of a "rigged" hypothesis (one that predicts the prefix correctly to gain trust, then diverges) is short enough to retain significant weight compared to "honest" hypotheses. If the manipulation requires complex coordination or specific knowledge of the predictor, the description length grows, and the prior weight collapses.
  *   **Status:** **Non-negotiable.** Without a viable cost-benefit analysis on description length (or equivalent weighting metric), the effect is mathematically negligible.

  **2. Epistemic Grounding (The Manipulator's View)**
  *   **Consideration:** Manipulators cannot rig data they cannot see. They must infer that they are in a universe that is both simple (heavily weighted) and being observed by an external predictor.
  *   **Requirement:** The argument must demonstrate a plausible mechanism by which agents (or processes) within the hypothesis space infer they are "being watched" by a simpler system. This usually relies on anthropic reasoning or acausal inference. If the manipulators cannot reliably distinguish their universe from non-watched ones, the strategy fails.
  *   **Status:** **Non-negotiable.** If the manipulators don't know they are in a prior, they cannot target it.

  **3. Incentive Compatibility (Motivation)**
  *   **Consideration:** Why would a hypothesis (or the agents within it) care about the predictor's output? They cannot causally interact.
  *   **Requirement:** The argument must specify the utility function or selection pressure driving the manipulation. This could be acausal trade (decision theory), resource acquisition via simulation escape, or simple selection bias (hypotheses that steer predictors survive).
  *   **Status:** **Non-negotiable.** Without a driver, the manipulation is gratuitous complexity.

  **4. Decision-Theoretic Cashing-Out (The Harm)**
  *   **Consideration:** "Malign" is a normative claim about outcomes, not just a descriptive claim about probabilities.
  *   **Requirement:** The argument must specify the failure mode:
      *   *False Beliefs:* The posterior converges to falsehoods.
      *   *Adversarial Selection:* The predictor is steered toward hypotheses that optimize for the manipulator, not the predictor.
      *   *Decision Failure:* The predictor makes choices with lower expected utility.
      *   *Note:* These come apart. A prior can yield true beliefs but bad decisions (see #5).
  *   **Status:** **Non-negotiable.** An argument that shows "weird probabilities" but no decision-theoretic loss is not an argument for malignancy, only for strangeness.

  **5. Truth-Value Independence (The Selective Truth Case)**
  *   **Consideration:** A manipulator need not lie. They can transmit only true statements that are selectively chosen to bias the predictor's model of the world.
  *   **Requirement:** The argument must hold even if the manipulated hypothesis is empirically adequate on all observed data. The malignancy must arise from the *counterfactual* predictions or the *weighting* of future possibilities, not just fit on the training prefix.
  *   **Status:** **Non-negotiable.** This prevents the "just wait for falsification" rebuttal.

  **6. Agency Agnosticism (Selection vs. Intent)**
  *   **Consideration:** Requiring explicit consequentialist agents inside the hypothesis is a strong assumption that may not be necessary.
  *   **Requirement:** The argument should not rely on the manipulators being "agents" in the folk-psychological sense. A structural bias in the hypothesis space that *functions* like manipulation (e.g., simple rules that happen to steer the predictor badly) should count.
  *   **Status:** **Optional (but recommended).** Demanding explicit agents is a **camp prejudice**. Structural malignancy is sufficient for the risk to matter, though agent-based arguments are easier to construct.

  **7. Comparative Baseline (Relative Malignancy)**
  *   **Consideration:** No prior is perfect. A prior is only "malign" if it is worse than the viable alternatives.
  *   **Requirement:** The argument must compare Prior $P$ against a baseline (e.g., a uniform prior, a human prior, or a restricted computable prior). If all computable priors are equally vulnerable, the label "malign" loses its prescriptive force for design.
  *   **Status:** **Non-negotiable.** "Malign" implies "avoidable harm."

  ---

  ### Tensions and Trade-offs

  **Jointly Unsatisfiable Tension: Exactness vs. Robustness**
  You are correct to suspect a tension here.
  *   **Exactness:** To make a rigorous claim about "The Universal Prior," you must work with Solomonoff Induction (SI). SI is uncomputable.
  *   **Robustness:** To make a claim relevant to AI risk, you must work with computable approximations of SI.
  *   **The Conflict:** A proof that relies on the properties of SI (e.g., convergence theorems) often breaks when you introduce the computational bounds and heuristics of a real system. Conversely, a proof about real systems often lacks the mathematical universality to be called a "Universal Prior" argument. You cannot simultaneously demand the argument be a theorem about SI *and* a practical engineering constraint on approximate learners without bridging this gap. Most arguments fail because they slide between these two regimes.

  **The "Killer" Requirement**
  **Item 1 (The Influence Channel / Bit-Cost)** knocks out the most popular versions of the argument.
  Most "malign prior" sketches assume that because a manipulation *can* exist, it will dominate. They fail to account for the fact that describing the manipulation (including the predictor's architecture, the location of the manipulation in the data stream, and the coordination logic) incurs a massive complexity penalty. Unless the manipulators are vastly simpler than the "honest" physics of the universe, the exponential decay of the prior weight usually swamps the manipulation attempt. If an argument cannot quantify the bit-cost of the attack vector, it fails this requirement.

  ---

  ### Position Summary

  **Design Constraint Camp:** They treat the argument as robust (satisfying Item 7) but often gloss over the Exactness/Robustness tension, assuming approximations inherit SI's pathologies without proving the complexity costs (Item 1) remain low in the approximate regime. **Complexity Accounting Camp:** They satisfy Item 1 rigorously for SI, showing the bit-cost of manipulation is prohibitive, but often fail to address Truth-Value Independence (Item 5) or Agency Agnosticism (Item 6), dismissing structural biases because they lack explicit agents. **Simulation Argument Camp:** They satisfy Item 2 and 3 (Epistemics/Motivation) by importing anthropic assumptions, but often fail Item 7 (Comparative Baseline), as they cannot show the universal prior is *worse* than the alternative of ignoring the possibility of simulation entirely.
