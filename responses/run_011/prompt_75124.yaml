answer: |-
  There is no single, canonical term in democratic or constitutional theory that isolates precisely the *symmetric structure* you describe: the simultaneous invocation of popular sovereignty to validate a decision and to insulate it from the very same popular sovereignty exercised later.

  The phenomenon is widely recognized as a tension, but it is usually subsumed under broader headings that focus on the *mechanism* of binding (entrenchment) or the *agent* of binding (courts vs. legislatures), rather than the *argumentative symmetry* regarding the source of authority.

  Below, I delineate the neighboring concepts you identified, explaining where they fit and where they fall short of your description. I then propose a term that carves out the specific structure you have observed, defining its edges as requested.

  ### 1. Analysis of Neighboring Concepts

  **A. The Dead Hand (Intergenerational Justice)**
  *   **The Concept:** The objection that the past should not rule the present (Jefferson: "the earth belongs to the living").
  *   **The Fit:** It captures the normative objection that binding the future is undemocratic.
  *   **The Mismatch:** Your pattern is not intergenerational. It is *intra-generational* or *diachronic within the same polity*. The actors claiming authority are not ancestors; they are the immediate predecessors of the current voters. The "Dead Hand" objection relies on the moral status of the dead; your pattern relies on the shifting definition of "the People" over time (People-at-T1 vs. People-at-T2).

  **B. The Counter-Majoritarian Difficulty (Judicial Review)**
  *   **The Concept:** The tension between unelected judges overturning laws made by elected representatives.
  *   **The Fit:** It captures the tension between a higher authority (constitution/court) and ordinary politics.
  *   **The Mismatch:** In your pattern, the "higher authority" is explicitly *another popular vote* or a statute shielded by *popular* procedure, not a judicial fiat. The conflict is not between "People vs. Judges," but "People-Then vs. People-Now." The difficulty is not that an elite is overriding the majority, but that a *past majority* is overriding a *future majority* using the same democratic vocabulary.

  **C. Democratic Precommitment (The Ulysses Pact)**
  *   **The Concept:** A polity rationally binding itself against future passion or weakness of will (Elster, Holmes).
  *   **The Fit:** It explains *why* actors lock in decisions (to prevent backsliding or rash reversal).
  *   **The Mismatch:** Precommitment theory treats the binding as a rational strategy for consistency. Your observation is about the *justificatory symmetry*: the claim that majority rule is authoritative *until* it threatens the outcome, at which point majority rule is declared "fragile." Precommitment admits the restriction on democracy; your pattern denies the restriction by claiming it *is* democracy ("the people have spoken"). It is a rhetorical sleight of hand, not just a strategic bind.

  **D. The Paradox of Self-Amendment**
  *   **The Concept:** The logical puzzle of whether a rule can authorize its own change (the *Kompetenz-Kompetenz* problem).
  *   **The Fit:** It addresses the legal validity of changing the rules of change.
  *   **The Mismatch:** This is a question of legal validity and logic (can it be done?), whereas your observation is about political legitimacy and argumentation (how is it justified?). You are describing a normative contradiction, not a logical impossibility.

  **E. The Boundary Problem (Who are the People?)**
  *   **The Concept:** The puzzle that a people cannot democratically decide who counts as part of the people (Whelan).
  *   **The Fit:** It touches on the definition of the sovereign entity.
  *   **The Mismatch:** Your pattern assumes the membership is stable (the same electorate). The problem is not *who* votes, but *when* their vote counts as sovereign. It is a temporal boundary problem, not a membership boundary problem.

  ### 2. Proposed Term: The Diachronic Paradox of Popular Sovereignty

  Since no established term isolates this specific symmetric structure, I propose **The Diachronic Paradox of Popular Sovereignty**.

  This term distinguishes the phenomenon from general constitutionalism (which involves courts) and precommitment (which involves rationality). It focuses on the *time-based inconsistency* in the appeal to the *same source of authority*.

  **Definition:**
  The Diachronic Paradox of Popular Sovereignty occurs when a political actor invokes the principle of popular sovereignty to validate a specific decision (Thesis: "The majority decides"), while simultaneously invoking the principle of popular sovereignty to insulate that decision from future majorities (Antithesis: "The majority must not decide this again"), treating the same democratic value as both the source of authority and the object of restriction depending on the temporal position of the actor.

  **The Edges of the Concept (Inclusion/Exclusion):**

  1.  **Ordinary Law that is Merely Difficult to Repeal:**
      *   **Does it count?** **No.**
      *   **Reason:** If a law requires a 60% vote to repeal but is not justified by a prior *popular* vote, the symmetry is broken. The restriction is legislative, not popular. The paradox requires the *lock* to be justified by a prior act of *the People*, not just a procedural hurdle set by legislators.

  2.  **Advisory Referendum that Registers an Attitude:**
      *   **Does it count?** **No.**
      *   **Reason:** If the vote does not legally bind the future (no entrenchment), there is no constraint on future majorities. The paradox requires the *conversion* of a vote into a shield against future votes.

  3.  **Lock Imposed by a Constitutional Court:**
      *   **Does it count?** **No.**
      *   **Reason:** If a court rules that a matter is beyond legislative competence based on constitutional interpretation, the authority claimed is *legal/constitutional*, not *popular*. The paradox requires the actors to claim they are protecting the *People's* will from the *People's* future will. If a court does it, it is the Counter-Majoritarian Difficulty, not this paradox.

  4.  **Initial Vote is Unanimous:**
      *   **Does it count?** **No.**
      *   **Reason:** The paradox relies on the tension between *majority* rule and *super-majority* (or entrenched) rule. If the initial vote is unanimous, there is no minority to protect, and a future majority reversal would also presumably require broad consensus. The specific contradiction—treating a bare majority as sacred when winning but insufficient when losing—dissolves if the initial margin is total.

  ### 3. Why This Carving Matters

  The value of isolating **The Diachronic Paradox of Popular Sovereignty** is that it identifies a specific blind spot in democratic discourse.

  In the standard "Constitutionalism vs. Democracy" debate, the two sides admit they are appealing to different values (Rights/Stability vs. Popular Will). In your pattern, both sides claim to be the true defenders of *Popular Will*.
  *   **Side A (Entrenchment):** "We are protecting the People's decision from being diluted by politicians."
  *   **Side B (Reversal):** "We are protecting the People's right to decide from being frozen by the past."

  By naming this structure, we can see that the dispute is not about *whether* the People should rule, but about **which temporal instantiation of the People constitutes the sovereign.** It reveals that "Popular Sovereignty" is being used as a movable signifier: it refers to the *act* of voting when convenient, and to the *result* of voting when inconvenient.

  This term allows you to categorize the phenomenon distinct from "constitutional entrenchment" (which is the mechanism) or "populism" (which is the style). It is a specific *logical-rhetorical structure* regarding the temporal continuity of democratic authority.

  ### Summary
  *   **Established Term:** None exists that isolates the *symmetric justification* specifically.
  *   **Closest Concept:** Democratic Precommitment (fits the act, misses the rhetorical symmetry).
  *   **Proposed Term:** **The Diachronic Paradox of Popular Sovereignty**.
  *   **Key Distinction:** It applies only when the *same value* (popular authority) is cited to both enact and insulate, relying on a temporal distinction between "the People who decided" and "the People who might decide."
