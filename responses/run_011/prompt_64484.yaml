      *   *Factual Dispute:* Not really. Everyone agrees humans impact the planet. The dispute is about *classification*.
      *   *Intuitions about Time:* Yes. Deep time vs. Human time. Should geology reflect human history?

  5.  **Determine "Progress":**
      *   *Conceptual Distinction:* Separating "Anthropocene" (cultural/scientific concept) from "anthropocene" (formal stratigraphic unit). This is already happening.
