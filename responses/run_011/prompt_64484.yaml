      *   *The AWG (Anthropocene Working Group):* Tried to bridge the gap. They picked 1950s plutonium because it's the sharpest, most synchronous global signal. They argued the magnitude of change justifies a new unit, even if short.
      *   *The Humanities/Social Scientists:* Often use "Anthropocene" as a *concept* or *periodization* of human-earth relations, not a rock layer. They critique the "universal human" (anthropos) framing.
      *   *The Alternative Proposals (1610, Ruddiman):* These are scientific arguments but often fail the GSSP test (1610 CO2 dip is noisy; early agriculture is diachronous).

  3.  **Evaluate the User's Hypothesis:**
      *   *Hypothesis:* Two camps answering different questions (Stratigraphy vs. Planetary Force) + jurisdictional fight.
      *   *Verdict:* This is very strong. It captures the core tension. The term "Anthropocene" has done double duty as a *scientific unit* and a *cultural meme*.
      *   *Nuance:* It's not just jurisdiction; it's about the *function* of geological time. Is it descriptive (what's in the rock?) or explanatory (what caused the change?).

  4.  **Analyze Alternative Explanations:**
