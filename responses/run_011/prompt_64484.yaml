      *   **Task:** Diagnose the nature of the disagreement based on what each side says. Evaluate the user's hypothesis against alternatives (standards of evidence, factual dispute, intuitions about geological time). Determine what would count as "progress" (conceptual, marker, institutional, change of question, or no progress expected).

  2.  **Deconstruct the Debate (The "Diagnosis"):**
