prompt: |-
  I run the review desk at a mid-sized fact-checking outfit. When a claim lands, we hand it to a panel of five to nine volunteer reviewers, they each read the evidence and vote yes/no on one binary question ("is this claim false?"), and I certify whatever the majority says. Lately I've been worrying that we're treating Condorcet's jury theorem like a law of nature when half its assumptions dont hold for us at all.

  Some numbers from our own logs, so you've got something concrete to work with. Over the last ~400 certified votes: panels where every member had drawn on the same two or three sources agreed unanimously about 92% of the time and were later overturned 19% of the time; panels with genuinely mixed source diets agreed ~71% of the time and were overturned 6%. Also, when the first two votes posted come in the same direction, the rest of the panel follows 84% of the time, because people can see the running tally in the thread. Reviewers pick their own claims off the queue, so the ones a given person takes are the ones they already had feelings about.

  Write me a procedure I can run on a vote before I certify it: the questions in order, what answer to each counts as pass versus fail, what I do on a fail (restructure the vote, blind the tally, abstain, escalate to a human expert), and where the procedure just has to shrug and hand it to a person because it's a judgment call wearing a checklist's clothes. I want it to actually use what's known about when the theorem holds and when it breaks — competence below a half, correlated errors, whether there's even a fact of the matter to be right about, bundled questions where the premises and the conclusion want to vote differently, and what deliberation does to independence versus what it does to competence. No citations needed, I'm not writing a paper, I just want the reasoning. And it has to be runnable by me in ten minutes using volunteers who know no probability theory: flag every step where I'd have to estimate a number I can't really measure, and say what to do when I can't get one.

  Then run it on three cases. (a) A 7–0 unanimous verdict on a medical claim where everyone read the same preprint. (b) A 5–4 split on whether a politician's statement is misleading, where the panel has been arguing in the thread for two days. (c) A question that's really two seperate questions — did the event happen, and was it deliberate. I want at least one of these to come out against me; I suspect (a) should. Close with a short list of what the procedure can't fix about our setup no matter how carefully I run it.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **Role:** Review desk manager at a mid-sized fact-checking outfit.
      *   **Current Process:** 5-9 volunteer reviewers per claim, binary vote ("Is this claim false?"), majority rule certification.
      *   **Problem:** Worrying about misapplying Condorcet's Jury Theorem (CJT). Assumptions (independence, competence > 0.5, binary truth) often violated.
      *   **Data Provided:**
          *   Uniform source panels: 92% unanimity, 19% overturn rate (High correlation, low effective competence).
          *   Mixed source panels: 71% unanimity, 6% overturn rate (Lower correlation, higher effective competence).
          *   Herding effect: If first two votes match, rest follow 84% of the time.
          *   Selection bias: Reviewers pick claims they have feelings about.
      *   **Task:** Create a pre-certification procedure (checklist/questions) to validate votes.
          *   Must use CJT logic (competence, independence, truth existence).
          *   Must be runnable in 10 mins by a non-math person.
          *   Must flag unmeasurable estimates.
          *   Must define Pass/Fail/Remediation (restructure, blind, escalate, etc.).
          *   Must acknowledge where human judgment overrides the checklist.
      *   **Application:** Run the procedure on three specific cases (a, b, c).
      *   **Constraint:** At least one case must result in "Fail/Against Manager" (suspects (a)).
      *   **Closing:** List of systemic issues the procedure can't fix.

  2.  **Deconstruct Condorcet's Jury Theorem (CJT) in this Context:**
      *   *Assumption 1: Binary Truth.* Is there a single fact of the matter? (Fails on "misleading," "deliberate").
      *   *Assumption 2: Competence > 0.5.* Are reviewers better than random? (Fails if selection bias leads to ideological voting or if evidence is too technical).
      *   *Assumption 3: Independence.* Do votes correlate only through truth, not through each other? (Fails due to shared sources, visible tallies/herding, deliberation).
      *   *The Data:* Uniform sources = High correlation (92% agreement) + High Error (19% overturn). This is the danger zone. Mixed sources = Lower correlation + Lower Error. Herding = Loss of independence.

  3.  **Drafting the Procedure (The "Condorcet Stress Test"):**
      *   *Goal:* Filter out votes where CJT assumptions are violated enough to make the majority unreliable.
      *   *Format:* Step-by-step questions.
      *   *Time Limit:* 10 minutes.
      *   *User:* Manager (no probability theory needed).
      *   *Steps:*
          1.  **Truth Existence:** Is this actually a binary fact? (Filters out "misleading/opinion" masquerading as fact).
          2.  **Source Independence:** Did they read the same thing? (Filters out the 19% overturn risk group).
          3.  **Vote Independence:** Did they see each other's votes? (Filters out herding).
          4.  **Competence Proxy:** Is there expertise or just feeling? (Addresses selection bias).
          5.  **Consensus vs. Split:** How tight was the vote? (Unanimity on hard topics is suspicious).
      *   *Remediation:* If Fail, what do we do? (Blind votes, add experts, reject claim).
      *   *Unmeasurable Flags:* Explicitly state where the manager is guessing (e.g., "true competence").

  4.  **Refining the Procedure (Iterative Polish):**
      *   *Step 1 (The Ontology Check):* Can this be proven false? If it's about intent or "misleadingness," CJT doesn't apply well.
      *   *Step 2 (The Echo Chamber Check):* Look at the sources cited in the comments. If >80% overlap, flag. (Based on the 92%/19% data).
      *   *Step 3 (The Herding Check):* Look at timestamps. Did votes cluster after the first two?
      *   *Step 4 (The Selection Bias Check):* Did reviewers self-select based on prior public stance?
      *   *Decision Matrix:*
          *   Pass: Certify.
          *   Fail: Escalate/Blind/Restart.
          *   Gray Area: Human Judgment.

  5.  **Running the Cases:**

      *   **Case (a): 7-0 Medical Claim, Same Preprint.**
          *   *Analysis:* High unanimity (7-0). Shared source (Preprint). Medical claims are technical (Competence risk).
          *   *Procedure Application:*
              *   Truth Existence: Pass (Medical fact).
              *   Source Independence: **FAIL** (Everyone read same preprint). Data says 19% overturn rate here.
              *   Vote Independence: Likely **FAIL** (Unanimity often implies herding or shared bias).
              *   Competence: **FAIL** (Volunteers reading a preprint vs. peer-reviewed consensus?).
          *   *Verdict:* **FAIL.** Do not certify. (Matches user suspicion).
          *   *Action:* Escalate to external medical expert.

      *   **Case (b): 5-4 Politician "Misleading", 2-day argument.**
          *   *Analysis:* Split vote. "Misleading" is subjective (Truth Existence risk). Deliberation happened (Independence risk, but Competence boost?).
          *   *Procedure Application:*
              *   Truth Existence: **FAIL/GRAY** ("Misleading" is judgment, not binary fact).
              *   Source Independence: Mixed (likely, given the split).
              *   Vote Independence: **FAIL** (Deliberation for 2 days destroys independence, even if it helps competence).
              *   *Verdict:* **GRAY/FAIL.** CJT assumes independence. Deliberation violates this. However, split vote suggests independence *remained* despite talking.
              *   *Decision:* This is the "Judgment Call" zone. The procedure should flag the "Misleading" aspect as non-binary.
              *   *Action:* Reframe the claim or escalate. Let's make this a "Pass with Warning" or "Fail due to Ontology." Let's go with **Fail due to Ontology** (Not a binary fact).

      *   **Case (c): Two Questions (Event + Intent).**
          *   *Analysis:* Bundled questions. CJT requires one binary question.
          *   *Procedure Application:*
              *   Truth Existence: **FAIL** (Compound question).
              *   *Verdict:* **FAIL.**
              *   *Action:* Split the vote.

      *   *Wait, I need to ensure the logic holds.*
      *   Case (a) is the strongest Fail.
      *   Case (b) is tricky. Deliberation increases competence but kills independence. CJT breaks. But a 5-4 split suggests independence *wasn't* fully killed. However, the "Misleading" label is the killer.
      *   Case (c) is a structural Fail.
      *   *Requirement:* "I want at least one of these to come out against me; I suspect (a) should." Okay, (a) must Fail.
      *   *Refinement on (b):* If I make (b) a Pass, it shows the procedure allows for deliberation *if* the vote is split. But the prompt asks to use what's known about deliberation (kills independence). Let's make (b) a "Human Judgment" call where the procedure flags the risk but allows certification if the manager deems the competence gain worth the independence loss. Or, better, the procedure flags it as "Non-Binary" and forces a rewrite. Let's go with the "Non-Binary" fail to emphasize the "Fact of the Matter" assumption.
      *   *Refinement on (c):* This is a clear structural fail.

  6.  **Drafting the Content:**

      *   *Intro:* Acknowledge the data (Uniform sources = danger).
      *   *The Procedure:* "The Independence & Competence Gate."
      *   *Steps:*
          1.  Binary Check (Ontology).
          2.  Source Diversity (Correlation).
          3.  Temporal Clustering (Herding).
          4.  Expertise vs. Passion (Competence).
      *   *Unmeasurable Flags:* Explicitly note where the manager is guessing (e.g., "true competence").
      *   *Case Studies:* Apply the steps rigorously.
      *   *Limitations:* What can't be fixed (Volunteer motivation, systemic bias, time pressure).

  7.  **Review against Constraints:**
      *   10 minutes runnable? Yes, checklist style.
      *   No probability theory? Yes, use heuristics (e.g., "Did they cite the same link?" instead of "Calculate correlation coefficient").
      *   Flag unmeasurable estimates? Yes.
      *   Case (a) fails? Yes.
      *   Closing list of unfixables? Yes.

  8.  **Final Polish:**
      *   Tone: Professional, pragmatic, slightly skeptical of the current system (aligning with the user).
      *   Ensure the reasoning on *why* (a) fails is tied to the provided data (92% agreement/19% overturn).
      *   Ensure the reasoning on *why* deliberation is tricky in (b) is clear (Competence up, Independence down).
      *   Ensure (c) highlights the "Bundled Questions" issue.

      *(Self-Correction during drafting)*: In Case (b), the prompt says "I want at least one of these to come out against me." It implies the manager might *want* to certify (b), but the procedure might stop them. Or the manager suspects (a) is bad. I will ensure (a) is a hard "Stop." For (b), I will make it a "Proceed with Caution/Escalate" because "Misleading" violates the binary truth assumption. For (c), it's a "Restructure."

      *Wait, one nuance:* The prompt says "I want at least one of these to come out against me; I suspect (a) should." This means the procedure should conclude (a) is *not* certifiable.
      *Case (b):* 5-4 split. Deliberation happened. CJT says deliberation kills independence. But 5-4 shows they didn't all just copy the first voter. However, "Misleading" is the bigger issue. I will flag "Misleading" as a failure of the Binary Truth assumption.
      *Case (c):* Compound question. Failure of Binary Truth assumption.

      *Let's refine the "Unmeasurable" flags.* The manager can't measure "competence > 0.5". They have to proxy it. I need to make sure the procedure tells them *how* to proxy it without math (e.g., "Do they have relevant credentials?" or "Is this common knowledge?").

      *Final check on the "Overturn" data:* Uniform sources = 19% overturn. This is the smoking gun. If (a) used the same preprint, it falls into the "Uniform source" bucket. The procedure *must* catch this.

      *Let's write.*
answer: |-
  ### The Independence & Competence Gate (ICG)

  This procedure is designed to be run in under ten minutes. It does not calculate probabilities; it checks for the structural conditions required for a majority vote to be trustworthy. It relies on your internal data: **Uniform sources correlate with high error (19% overturn), and visible tallies correlate with herding (84% follow-rate).**

  **Instructions:** For each certified vote, answer the following five questions in order. If you cannot answer a question with the available logs, mark it as **[UNMEASURABLE]** and follow the associated fallback.

  #### Step 1: The Ontology Check (Binary Truth)
  **Question:** Is there a single, objective fact of the matter that makes the claim True or False, independent of opinion?
  *   **Pass:** Yes (e.g., "Did the bill pass?", "Is this drug approved?").
  *   **Fail:** No (e.g., "Is this misleading?", "Was this intentional?", "Is this policy good?").
  *   **Action on Fail:** **Do not certify.** These are judgment calls, not facts. Escalate to a senior editor to reframe the claim as an analysis piece, not a binary fact-check.
  *   **[UNMEASURABLE FLAG]:** You are estimating "objectivity." If you hesitate for more than 30 seconds, mark as Fail.

  #### Step 2: The Echo Chamber Check (Source Correlation)
  **Question:** Did the reviewers rely on overlapping evidence? Look at the links/documents cited in the review thread.
  *   **Pass:** The panel cited at least 4 distinct primary sources, and no single source was used by more than 50% of the reviewers.
  *   **Fail:** The panel relied on the same 1-2 sources (e.g., the same preprint, the same press release) for >80% of the voters.
  *   **Action on Fail:** **Reject the vote.** Your data shows a 19% overturn rate here. The errors are correlated, so the "majority" is just one error multiplied.
  *   **Remediation:** Restart the panel with a mandate to find *divergent* evidence. Blind the source list so new reviewers can't see what the first ones found.

  #### Step 3: The Herding Check (Vote Independence)
  **Question:** Look at the timestamps of the votes. Did the votes cluster after the first two were posted?
  *   **Pass:** Votes are distributed relatively evenly over the voting window, or the split remains wide (e.g., 5-4) regardless of timestamp order.
  *   **Fail:** 3 or more votes were cast within 1 hour of the *second* vote being posted, AND the vote is unanimous or near-unanimous (e.g., 7-0, 6-1).
  *   **Action on Fail:** **Invalidate the majority.** Your data shows an 84% follow-rate once a trend is visible. Independence is lost.
  *   **Remediation:** Blind the tally for future votes. For this claim, discount the late votes and evaluate only the first two. If they disagree, you have no majority.

  #### Step 4: The Competence Proxy (Selection Bias)
  **Question:** Is there evidence that reviewers selected this claim due to prior expertise or prior passion?
  *   **Pass:** Reviewers have relevant credentials listed in their profile, OR the claim is general knowledge (competence > 0.5 is safe to assume).
  *   **Fail:** The claim is technical (medical, legal, financial) AND reviewers are general volunteers with no stated expertise, OR the claim is highly polarizing and reviewers are known activists in that space.
  *   **Action on Fail:** **Escalate.** If competence is likely < 0.5, Condorcet's theorem reverses: the majority becomes *less* reliable as the group grows.
  *   **[UNMEASURABLE FLAG]:** You cannot measure true competence. You are proxying it with credentials. If you lack credential data, assume **Fail** for technical topics.

  #### Step 5: The Deliberation Trade-off (Independence vs. Competence)
  **Question:** Did the reviewers discuss the evidence in a thread before voting?
  *   **Pass:** No discussion allowed, or discussion happened *after* votes were locked.
  *   **Fail:** Reviewers argued in the thread for >24 hours before finalizing votes.
  *   **Action on Fail:** **Human Judgment Required.** Deliberation increases competence (good) but destroys independence (bad).
      *   If the vote is **Split (e.g., 5-4)**: Certify. The split proves independence survived the discussion.
      *   If the vote is **Unanimous**: Reject. The discussion likely created groupthink.
  *   **[UNMEASURABLE FLAG]:** You cannot measure how much competence increased. You are betting that a split vote indicates preserved independence.

  ***

  ### Case Applications

  Here is the ICG procedure applied to your three specific cases.

  #### Case (a): 7–0 Unanimous Verdict on a Medical Claim (Same Preprint)
  *   **Step 1 (Ontology):** **Pass.** Medical efficacy is binary (it works/it doesn't).
  *   **Step 2 (Echo Chamber):** **FAIL.** Everyone read the same preprint. This matches your log data for "uniform source diets" (92% agreement, 19% overturn).
  *   **Step 3 (Herding):** **FAIL.** 7-0 unanimity on a technical claim strongly suggests the first few votes set the tone and the rest followed (84% follow-rate risk).
  *   **Step 4 (Competence):** **FAIL.** Volunteers reading a preprint on a medical claim likely lack the expertise to interpret it better than random chance relative to the broader scientific consensus.
  *   **Verdict:** **REJECT.**
  *   **Reasoning:** This is the exact failure mode your data warned you about. High correlation (same source) + High Unanimity = Correlated Error. You are not measuring the truth; you are measuring the preprint's persuasiveness.
  *   **Action:** Do not certify. Escalate to an external medical expert panel. Do not use the volunteer vote.

  #### Case (b): 5–4 Split on "Misleading" Statement (2-Day Argument)
  *   **Step 1 (Ontology):** **FAIL.** "Misleading" is not a binary fact. It is a judgment on the gap between literal truth and implied meaning.
  *   **Step 2 (Echo Chamber):** **Pass.** A 5-4 split implies they likely looked at different aspects of the record to justify their positions.
  *   **Step 3 (Herding):** **Pass.** The split vote proves herding did not occur, despite the visible tally.
  *   **Step 4 (Competence):** **[UNMEASURABLE].** Hard to gauge, but the split suggests genuine difficulty.
  *   **Step 5 (Deliberation):** **Human Judgment.** They argued for two days. Usually, this kills independence. However, the 5-4 split proves independence *survived*.
  *   **Verdict:** **REJECT (on Ontology).**
  *   **Reasoning:** While the vote survived the Deliberation and Herding checks, it fails Step 1. Condorcet's theorem requires a "True/False" state of nature. "Misleading" has no such state. You are certifying an opinion as a fact.
  *   **Action:** Do not certify as "False." Reframe the output as "Analysis: Context Missing" or similar. Do not apply the binary label.

  #### Case (c): Bundled Question (Event Happened + Was Deliberate)
  *   **Step 1 (Ontology):** **FAIL.** This is two questions. The event happening is binary. Intent is inferential and often non-binary.
  *   **Step 2 (Echo Chamber):** **Pass/Unknown.**
  *   **Step 3 (Herding):** **Pass/Unknown.**
  *   **Step 4 (Competence):** **[UNMEASURABLE].** Proving intent requires much higher competence than proving an event occurred.
  *   **Step 5 (Deliberation):** **Unknown.**
  *   **Verdict:** **REJECT.**
  *   **Reasoning:** You cannot aggregate votes on a compound proposition. Reviewer A might vote "False" because the event didn't happen. Reviewer B might vote "False" because it wasn't deliberate. The majority says "False," but they disagree on *why*. This violates the assumption that voters are answering the *same* question.
  *   **Action:** Split the claim into two separate fact-checks. Vote on them independently.

  ***

  ### What This Procedure Cannot Fix

  Even if you run the ICG perfectly, five systemic issues remain that no checklist can solve without changing your business model:

  1.  **The Motivation Gap:** Volunteers self-select. You cannot force a neutral expert to review a claim they find boring. You will always have more passionate reviewers than competent ones on polarizing topics.
  2.  **The Time/Truth Trade-off:** Proper independence requires blinding and sequential evidence gathering. This slows down the process. If your outlet prioritizes speed ("first to fact-check"), you will always be pressured to skip Step 2 and Step 3.
  3.  **The "Fact of the Matter" Illusion:** Many claims your audience wants checked (Case B) are inherently non-binary. The procedure will reject them, which may look like "refusing to take a stand" to your readership.
  4.  **Hidden Correlations:** Reviewers may not cite the same source but may read the same *news cycle*. You cannot measure shared cultural priors, which creates correlated error even with diverse links.
  5.  **The Competence Floor:** If the general population's competence on a topic is below 0.5 (e.g., complex macroeconomics), and your volunteers are drawn from the general population, no amount of independence will save the vote. The theorem mathematically guarantees the wrong answer as the panel grows.
