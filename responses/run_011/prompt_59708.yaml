answer: |-
  Here are the requirements for an account of the distinction between persuasion and manipulation, designed for your specific position.

  1.  **Ex Ante Decidability**
      The account must yield a verdict before the act is committed, not merely justify it afterwards. It must function as a filter for drafts, not a eulogy for campaigns.
      *Motivating Case:* The fake closing date. You must know whether to print it before the mailing goes to the printer, not after the donations arrive.

  2.  **The Disclosure Condition**
      The account must specify whether a tactic is permissible only if it can survive being explained to the target without destroying its effectiveness.
      *Motivating Case:* The pre-filled donation amount. If you told the donor, "I filled this in to anchor your generosity higher," would they feel respected or tricked? If the trick fails upon explanation, the account must label it.

  3.  **Agency Preservation**
      The account must distinguish between influencing a person's reasons for acting and bypassing their capacity to choose altogether. It must identify when a choice is being substituted rather than swayed.
      *Motivating Case:* The identifiable child versus the statistics. Using a story to evoke empathy engages reasons; using a story to induce guilt that paralyzes judgment bypasses them. The line must be drawn.

  4.  **Intent Independence**
      The account must judge the tactic itself, regardless of the goodness of the goal. A good outcome cannot sanitize a corrupt method within the definition of the method.
      *Motivating Case:* The lie to the man at the door to protect the person hiding upstairs. The goal is noble, but the method is still manipulative. The account must admit this rather than redefining the lie as persuasion.

  5.  **The Competitive Reality Constraint**
      The account must acknowledge the market environment in which the actor operates. It cannot demand unilateral disarmament if that guarantees the failure of the mission the actor serves.
      *Motivating Case:* The competitor's glossy mailing. If your ethical standards require plain text that gets ignored, while competitors use high-pressure tactics to fund the same cause, the account must address whether you are obligated to lose.

  6.  **The Non-Human Agent Clause**
      The account must locate responsibility and ethical quality in the structure of the influence, not solely in the mind of the influencer. It must handle cases where optimization happens without specific intent.
      *Motivating Case:* Algorithmic A/B testing. The system serves different versions to different people and learns which works best without any human knowing why the winner won. The account must say whether this is manipulation.

  7.  **The Permissible Paternalism Exception**
      The account must allow for cases where autonomy is overridden for the target's own benefit, without collapsing into a rule that says "benefit justifies anything." It must specify who gets to judge the benefit.
      *Motivating Case:* The intervention staged for a relative who cannot judge his own interests. The target welcomes it later, but resisted it then. The account must explain why this is allowed when the fundraiser's tactic is not.

  ***

  **Non-negotiable Requirements vs. Preferences**

  *   **Non-negotiable:** *Ex Ante Decidability*, *Agency Preservation*, and *Intent Independence*. Without these, the theory cannot guide action (Decidability), cannot protect the donor's dignity (Agency), and cannot prevent "the ends justify the means" reasoning (Intent). These are required for any ethical framework claiming to guide conduct.
  *   **Preferences:** *The Competitive Reality Constraint* and *The Disclosure Condition*.
      *   The *Competitive Reality Constraint* belongs to the **Consequentialist camp** (those who focus on outcomes). A strict duty-based ethicist would say you must not lie even if it means your charity closes; a pragmatist says you must survive to do good.
      *   The *Disclosure Condition* belongs to the **Kantian camp** (those who focus on duty and respect for persons). A utilitarian might argue that if the lie produces more good than truth, disclosure is irrelevant.

  **The Single Requirement Doing the Most Work**

  The **Disclosure Condition** does the most work in ruling out otherwise attractive accounts. Many theories allow manipulation if the outcome is good or if the intent is pure. By demanding that a tactic must survive being explained to the target without losing its power, this requirement instantly disqualifies the pre-filled amount, the fake deadline, and the reciprocity trick of the return labels. It forces the theory to confront the deception inherent in the mechanism, not just the result.

  **The Impossible Subset (The Knot)**

  Your hunch is correct. There is a genuine knot between **Openness** (Disclosure), **Effectiveness**, and **Competitive Viability**.
  *   If a tactic works *because* it is hidden (Openness kills Effectiveness).
  *   And you must compete to fund the mission (Viability requires Effectiveness).
  *   Then you cannot be Open and Viable simultaneously against dishonest competitors.
  One must give. In a strict ethical account, **Competitive Viability** must be the one that gives. You cannot justify manipulation by pointing to a competitor's manipulation; that is a race to the bottom. However, this demands that the honest fundraiser accept a smaller share of the market, potentially reducing the good they can do. An adequate account must admit this cost rather than pretending there is a clever way to keep all three.

  **Influence With No Mind Behind It**

  An adequate account must locate manipulation in the **architecture of the choice**, not the **intent of the chooser**. If an algorithm serves a version of an appeal that exploits a cognitive bias (like loss aversion) more effectively than a human could design, it is still manipulation even if no human intended that specific exploitation. The theory must treat the system as the agent. If the output bypasses deliberation to secure a response, it is manipulative, regardless of whether a human mind directed that specific outcome. Responsibility lies with those who deployed the system without constraints.

  **Cases That Embarrass a Victim-Centered View**

  An adequate account must distinguish between **unjustified manipulation** and **justified paternalism**. It must admit that the lie to protect the hiding person *is* manipulation, but argue it is permissible because the target (the man at the door) has no right to the truth in that context, or because the harm of truth outweighs the harm of the lie. Crucially, it must specify **who judges the benefit**. In the intervention case, the target eventually agrees. In the fundraiser case, the target (the donor) rarely agrees that being tricked was good for them. The theory must require that the target's later endorsement be possible, not just the actor's belief that they helped.

  ***

  **Evaluation of Main Approaches**

  **Intention-Based Approaches** focus on whether the influencer meant to deceive. These fail your requirement for **The Non-Human Agent Clause**. If an algorithm manipulates donors without human intent, this theory says no wrong occurred. It also struggles with **Intent Independence**, often letting beneficial lies off the hook too easily while punishing well-meaning mistakes too harshly.

  **Capacity-Based Approaches** focus on whether the target's ability to reason was bypassed or degraded. These score well on **Agency Preservation** and handle the **Non-Human Agent** issue well (the mechanism matters, not the mind). However, they often struggle with **The Permissible Paternalism Exception**, as interventions also bypass capacity, requiring complex add-ons to explain why some bypassing is okay.

  **Harm-Based Approaches** focus on whether the target suffered a disadvantage or loss. These fail the **Embarrassing Cases** test immediately. The man at the door causes harm by telling the truth; the intervention causes temporary distress. If no financial harm comes to the donor (they wanted to give), this theory might approve of deep manipulation, missing the violation of dignity.

  **Character-Based Approaches** focus on whether the act reflects a vice in the persuader. These fail **Ex Ante Decidability**. You cannot easily know if sending a label makes you a "liar" until you have a full theory of lying. It turns the question inward to your soul rather than outward to the act, which offers little guidance when you are staring at a draft at 2 AM.

  **Nudging and Choice Architecture** treats design as benign so long as the exit is cheap (you can cross out the amount). This fails the **Disclosure Condition** spectacularly. Nudges often rely on opacity to work. It also struggles with **Competitive Viability**, assuming a neutral market where people can opt out, ignoring that your competitors are not nudging but shoving, making your "cheap exit" look like indifference to the cause.
