      *   *Medical:* Population (1%) -> Narrow ("women, age, history, symptom"). *Intuition: Causal/Conditional relevance is good here, unlike the coin.*
      *   *Single Cases (AI Personhood, Europa):* Class of one. Still want a "right answer." *Intuition: Subjective/Bayesian probability needed when frequentist fails.*
      *   *Barometer:* Falling barometer = same rate as all storms -> Drop it. Green sky = same rate -> Still feel it deserves weight. *Intuition: Causal mechanism matters even if stats are equivocal (or data is sparse).*
      *   *Causal vs. Statistical:* Strong stat move + no causal story = Reject. Strong causal story + no stat move = Distrust number. *Intuition: Causal structure trumps raw correlation, but needs statistical support.*

  3.  **Evaluate the Tentative Principle:**
      *   *Principle:* Narrow as possible s.t. (a) $N \ge 20$ and (b) Causal Story.
      *   *Critique:*
          *   (a) $N \ge 20$: Arbitrary. Why 20? Why not 5 or 100? Handles the "3 Thai restaurants" case well, but fails the "Single Case" case (AI Personhood). If $N=1$, this rule says "no probability," but the user wants a "right answer."
