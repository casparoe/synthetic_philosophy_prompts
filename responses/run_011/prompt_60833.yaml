      *   **Sacrificing Verdicts:**
          *   *Green Sky:* If stats show no shift, you *must* drop it, regardless of causal intuition. Data trumps theory here. (Hard pill to swallow).
          *   *Single Cases:* Must admit there is no "frequency" answer, only a subjective degree of belief.
          *   *Hard N=20:* Replace with continuous discounting.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Wait, the Green Sky case:* The user says "shifts nothing in my data." If the data is robust, the causal intuition is wrong. If the data is sparse, the causal intuition might be right but unproven. I need to clarify that *reliable* statistics trump *theoretical* causality, but *mechanism* validates the *selection* of the class.
      *   *The Coin Case:* Why is "I called tails" different from "Symptom"? Because the call doesn't *cause* the coin. The symptom is *caused by* (or causes) the disease. This is the Reichenbach/Salmon distinction (causal relevance vs. statistical relevance).
      *   *The "Best" Principle:* I should frame it as **Salmon's Statistical-Relevance (S-R) Model refined by Bayesianism.** Salmon argued we need homogeneous reference classes. But since perfect homogeneity is impossible, we use Bayesian updating.
      *   *Let's simplify:* The "Best" principle for a forecaster is **Reference Class Forecasting (Flyvbjerg) + Bayesian Updating.**
      *   *Rule:* **Start Broad, Update Narrow, Weight by Reliability.**

  7.  **Finalizing the Structure:**
      *   **Diagnosis:** You are fighting Frequentism with Bayesian intuition.
      *   **The Principle:** "The Bayesian Outside View."
      *   **Clause Breakdown:**
          1.  Base Rate (Broadest homogeneous class).
          2.  Causal Filter (Mechanism required).
          3.  Reliability Weight (N-size matters continuously).
      *   **New Cases:** Election prediction, Personal health.
      *   **Sacrifices:** Green Sky (if data says null, it's null), Single Case (admit subjectivity), Hard N=20 (use smoothing).

  8.  **Tone Check:** Needs to be seminar-appropriate (philosophically rigorous) but practical (forecasting site user). Avoid overly dense jargon but don't dumb it down. Acknowledge the "mess" is normal.

      *(Self-Correction on the "Green Sky" sacrifice)*: Actually, if the causal story is strong (green sky = specific scattering indicating severe updrafts) but the data shows nothing, the data is likely *underpowered*, not the theory wrong. But as a *forecasting rule*, you can't use it until the data supports it. So the verdict to sacrifice is "it deserves weight *now*." It deserves *investigation*, not weight in the calculation.

      *(Self-Correction on Single Cases)*: The user wants a "right answer." I need to tell them there isn't a frequentist right answer, but there is a rational credence. They have to give up the idea of a "true frequency" for unique events.

  9.  **Final Polish:** Ensure the distinction between *epistemic* and *aleatory* probability is hinted at but not overwhelming. Focus on the *procedure*.

      *Plan:*
