      *   **Tentative Principle:** Go as narrow as possible subject to (a) $N \ge 20$ and (b) causal story.
      *   **Request:** Evaluate this principle. Tell them what the *best* principle is, explain the clauses, apply it to new cases, and identify which of their current verdicts they must sacrifice. They prefer a clean rule over a gerrymandered one with exceptions.

  2.  **Deconstruct the User's Verdicts:**
      *   *Thai Restaurant:* Narrower ("independent restaurants in city") > Broader ("all new businesses"). *Intuition: Relevance.*
      *   *Thai Restaurant (Too Narrow)::* "3 Thai restaurants... no experience... near campus" -> Bail to bigger class. *Intuition: Sample Size/Reliability.*
