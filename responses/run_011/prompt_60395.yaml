  ### Vignettes

  **Condition 1: Bad Side Effect / Concordant Values**
  Elena serves as the fleet manager for the municipal depot. She approved a new routing software package to optimize delivery speed across the region. An external consultant certified the software would alter local emissions levels as a certain side effect. Elena authorized the installation despite this foreseen consequence and without modifying the plan. For a decade, she had championed budgetary efficiency metrics as her central professional aim. Regarding the emissions levels, she maintained strict indifference throughout the decision process. The installation proceeded successfully, and emissions levels increased as predicted.

  **Condition 2: Bad Side Effect / Orthogonal Values**
  Elena serves as the fleet manager for the municipal depot. She approved a new routing software package to optimize delivery speed across the region. An external consultant certified the software would alter local emissions levels as a certain side effect. Elena authorized the installation despite this foreseen consequence and without modifying the plan. For a decade, she had championed driver scheduling metrics as her central professional aim. Regarding the emissions levels, she maintained strict indifference throughout the decision process. The installation proceeded successfully, and emissions levels increased as predicted.

  **Condition 3: Good Side Effect / Concordant Values**
  Elena serves as the fleet manager for the municipal depot. She approved a new routing software package to optimize delivery speed across the region. An external consultant certified the software would alter local emissions levels as a certain side effect. Elena authorized the installation despite this foreseen consequence and without modifying the plan. For a decade, she had championed environmental sustainability metrics as her central professional aim. Regarding the emissions levels, she maintained strict indifference throughout the decision process. The installation proceeded successfully, and emissions levels decreased as predicted.

  **Condition 4: Good Side Effect / Orthogonal Values**
  Elena serves as the fleet manager for the municipal depot. She approved a new routing software package to optimize delivery speed across the region. An external consultant certified the software would alter local emissions levels as a certain side effect. Elena authorized the installation despite this foreseen consequence and without modifying the plan. For a decade, she had championed driver scheduling metrics as her central professional aim. Regarding the emissions levels, she maintained strict indifference throughout the decision process. The installation proceeded successfully, and emissions levels decreased as predicted.

