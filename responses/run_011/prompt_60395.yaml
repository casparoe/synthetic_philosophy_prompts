  ### Predicted Patterns and Diagnostic Comparisons

  **1. Pragmatic-Implicature Account (Adams & Steadman)**
  *   **Prediction:** A main effect of Valence only. Intentionality ascriptions are vehicles for blame.
  *   **Pattern:** Bad (Cells 1 & 2) > Good (Cells 3 & 4). Concordance (Cells 1 vs 2; 3 vs 4) yields no significant difference.
  *   **Diagnostic:** Comparison of Bad/Orthogonal vs. Good/Orthogonal. If this difference disappears, the account fails.
  *   **Interaction:** None predicted.

  **2. Deep-Self Account (Sripada)**
  *   **Prediction:** A main effect of Concordance only. Intentionality tracks alignment with standing values.
  *   **Pattern:** Concordant (Cells 1 & 3) > Orthogonal (Cells 2 & 4). Valence yields no significant difference once concordance is controlled.
  *   **Diagnostic:** Comparison of Bad/Concordant vs. Bad/Orthogonal. If this difference disappears, the account fails.
  *   **Interaction:** None predicted (additive effects).

  **3. Competence/Concept Account (Nichols & Ulatowski)**
  *   **Prediction:** High variance driven by participant subgroups. Some use a moral concept (Valence effect), others a skill/volition concept (Null or Concordance effect).
  *   **Pattern:** No clean main effects in the aggregate; significant interaction or heterogeneity.
  *   **Diagnostic:** Correlation between free-response concept probes and intentionality judgments.
  *   **Interaction:** An ordinal interaction is possible if moral-concept users drive the Valence effect and volition-concept users drive the Concordance effect.

  **Subgroup Analysis Requirement:**
  To credit Account 3 over Account 1, the free-response probe must show that participants who define intentionality via "mindset/values" assign higher intentionality in Concordant cells regardless of Valence, while those defining it via "harm/blame" assign higher intentionality in Bad cells regardless of Concordance. If all subgroups show the Valence effect, Account 1 wins.

  ***

  ### Constraint Compliance and Design Logic

  **Constraint Check:**
  1.  **Word Count:** Each vignette is ~115 words (under 140).
  2.  **Sentence Matching:** All seven sentences match word-for-word except for the value phrase (Sentence 5) and the outcome direction (Sentence 7).
  3.  **Valence Manipulation:** Sentence 7 ("increased" vs. "decreased"). Readers supply the moral valence of emissions changes.
  4.  **Concordance Manipulation:** Sentence 5 ("budgetary efficiency" vs. "driver scheduling" vs. "environmental sustainability"). These determine alignment with the outcome direction.
  5.  **Indifference/Desire:** Sentence 6 ("maintained strict indifference") holds desire constant across all cells.
  6.  **Foreseen/Certain:** Sentence 3 ("consultant certified... certain side effect") and Sentence 4 ("foreseen consequence").
  7.  **No "Intentionally":** Verified.
  8.  **Setting/Protagonist:** Elena, Fleet Manager, Municipal Depot (constant).

  **Explanatory Feature:**
  The single feature doing the work is the **value phrase in Sentence 5**.
  *   **If Deleted:** The design collapses into a standard Knobe effect design (Valence only). The Deep-Self account loses its manipulation. The Pragmatic account predicts the standard asymmetry. The Competence account loses the ability to distinguish value-based concepts from harm-based concepts.

  **Blame Control Strategy (The Hard Problem):**
  To keep blame/praise equal across Concordance conditions within Valence levels, I utilized Sentence 6 ("Regarding the emissions levels, she maintained strict indifference"). This explicitly decouples the standing value from the *desire* for the specific outcome. A reader cannot claim she *wanted* the emissions to rise just because she values budgetary efficiency; the text forbids it.
  *   **Residue:** I concede that "environmental sustainability" (Good/Concordant) may inherently signal higher moral character than "budgetary efficiency" (Bad/Concordant), potentially inflating praise in Cell 3 independent of intentionality. This is a known confound in value manipulations. However, because the *indifference* clause is identical, the *motive* for the specific act is held constant, isolating the *structural alignment* (Deep Self) from the *moral motivation* (Blame).

  ***

  ### Sharpest Attack and Remedy

  **The Attack (From the Pragmatic-Implicature Account):**
  The concordance manipulation is not neutral; it is a smuggled character cue. Describing Elena as championing "environmental sustainability" makes her a better person than championing "budgetary efficiency." Therefore, higher intentionality ratings in the Concordant Good cell (Cell 3) compared to the Orthogonal Good cell (Cell 4) may not reflect Deep-Self accord, but rather a halo effect: participants are reluctant to attribute intentional *good* acts to a character focused on *budget*, or reluctant to attribute intentional *bad* acts to a character focused on *environment*. The Concordance effect is just a subtle Blame effect. The "indifference" clause is insufficient to override the global character assessment triggered by the value label.

  **How Far It Bites:**
  It bites deeply. If perceived character varies across the Concordance conditions, the Deep-Self model is confounded with the Pragmatic model. A participant might say, "She didn't do it intentionally because she's an environmentalist (good person), so she wouldn't harm on purpose," even if the text says she was indifferent.

  **Remedy (Fifth Cell):**
  Add a **No-Value Control Cell**.
  *   **Vignette:** Identical to the Orthogonal cells, but Sentence 5 is removed or replaced with neutral biographical data (e.g., "For a decade, she had worked at the depot as a manager.").
  *   **Function:** This establishes a baseline for intentionality ascriptions without any value cue.
  *   **Analysis:** If Orthogonal cells differ from the No-Value cell, the value manipulation itself is driving the effect (supporting the Attack). If Orthogonal cells match the No-Value cell, but Concordant cells differ, the *alignment* is doing the work (supporting Deep-Self). This isolates the *accord* variable from the *value content* variable.
