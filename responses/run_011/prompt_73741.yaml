      *   **Task:** Evaluate the "framing section" which relies on Hofstadter's typogenetics analogy from *Gödel, Escher, Bach* (GEB).
      *   **The Analogy:** Typogenetics (strings $\to$ enzymes $\to$ actions on strings) $\approx$ Gödelian self-reference (sentences $\to$ numbers $\to$ provability).
      *   **The Claims:**
          *   (i) Self-replication = Gödelian self-reference $\implies$ Formal models of replicators are subject to Incompleteness (incomplete or inconsistent, some truth unestablishable).
          *   (ii) No self-replicating machine can simulate itself completely; closed self-description is forbidden by diagonalization.
      *   **Requirements:**
          1.  Set out the correspondence explicitly (base string, coding function, fixed point, proof predicate, true-but-unprovable sentence).
          2.  Give disanalogies (sorted into "threatening" vs. "cosmetic").
