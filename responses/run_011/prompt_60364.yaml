answer: |-
  **Exam Question: The Thermin Programme (25 Points)**

  **Part 1 (10 points):** Evaluate the theoretical and empirical progress of the thermin programme (H) between Year 14 and Year 26. Specifically, compare the status of auxiliary hypothesis h1 against h2. Explain why one constitutes a progressive problemshift and the other risks degeneration, focusing on the relationship between the construction of the hypothesis and the evidence used to support it.

  **Part 2 (10 points):** Re-evaluate the status of h2 in light of the discoveries made between Years 28 and 30. Does the isolation of the carrier protein and the explanation of the assay puzzle change your verdict on whether h2 was ad hoc? How does the existence of the rival programme (R) affect your overall assessment of H's health at Year 30, even if h2 is rehabilitated?

  **Part 3 (5 points):** In Year 33, proponents of R demand the abandonment of H based on a "crucial experiment." Using Lakatos's methodology, explain why this demand is methodologically mistaken. What standard should be used instead to decide between H and R?

  ***

  **Model Answer**

  **Part 1**
  The distinction between h1 and h2 turns on the timing of evidence relative to the construction of the auxiliary. In Lakatos's framework, a problemshift is progressive if it leads to novel facts, not just the accommodation of existing anomalies. h1 is progressive. Although it was devised to save H from Anomaly A1, it yielded a specific quantitative prediction about leg temperature gradients that was not used to build the hypothesis. The confirmation of this gradient in Year 19 counts as novel empirical content. It shows the protective belt is expanding knowledge, not just patching holes.

  h2, by contrast, is initially degenerating. It was constructed solely to fit the oscillation data of A2. The hypothesis that a carrier protein releases thermin rhythmically has no independent testability at Year 26 because the carrier cannot be isolated. The consequence that destroying the carrier stops the rhythm remains untested. Therefore, h2 adds no new empirical content; it merely immunizes the hard core against refutation by adjusting the belt to fit known data. While saving the core is permitted by the negative heuristic, doing so without generating novel predictions marks a degenerating shift. The programme is losing momentum because it is explaining away anomalies rather than predicting new ones.

  **Part 2**
  The Year 28–30 discoveries partially rehabilitate h2. Initially, h2 looked ad hoc because its only support was the data it was designed to save. However, the discovery that the carrier explains the systematic low assay readings at night constitutes a novel fact. This puzzle was standing but unrelated to the original rationale for h2. Furthermore, the confirmation via an independent assay method provides independent testability. Thus, h2 is no longer purely ad hoc in the pejorative sense; it has yielded excess empirical content.

  However, this does not automatically make H the superior programme. Lakatos emphasizes that assessment is comparative. Even if h2 is now progressive locally, the rival programme R has been consistently progressive since Year 20. R handled A1 and A2 without extra machinery and successfully predicted the regulation of gland-removed animals in Year 31, which H claimed was impossible. Therefore, while H is not yet scientifically dead (since it is still producing some novel facts), it is theoretically inferior to R. The rehabilitation of h2 prevents H from being dismissed as unscientific pseudophysics, but it does not overcome the fact that R has a higher rate of progressive problemshifts. H is lagging, not falsified.

  **Part 3**
  The demand for abandonment based on a "crucial experiment" is Popperian, not Lakatosian. In the methodology of research programmes, there are no instant falsifications that dictate immediate abandonment of a hard core. A programme is only rejected when it is consistently degenerating compared to a rival that offers a better explanation of the past and predicts novel facts. A single experiment, even one favoring R, cannot logically force the abandonment of H if H is still capable of generating progressive shifts. The correct standard is long-term comparative progress. The scientific community should continue to work on H as long as it retains hope of progressive shifts, but rationality dictates shifting resources to R because R is currently more progressive. Abandonment is a historical process, not a logical moment dictated by a single test.

  ***

  **Grading Rubric**

  **Total Points: 25**

  **Part 1: h1 vs. h2 (10 Points)**
  *   **A Range (8–10 pts):** Clearly distinguishes h1 and h2 based on *novel prediction* vs. *accommodation*. Identifies that h1's Year 19 confirmation was not used to construct h1 (novel fact). Identifies that h2 was fitted to A2 data with no independent testability at Year 26. Uses the term "degenerating problemshift" correctly to describe h2's initial state without calling it "unscientific."
      *   *Common B Error:* Defines ad hoc correctly but fails to explain *why* the Year 19 gradient matters (novelty). Treats h2 as immediately falsifying or unscientific rather than degenerating.
      *   *Common C Error:* Recites definitions of hard core/belt without applying them to the timeline. Claims h1 is ad hoc because it was created after an anomaly.
  *   **B Range (5–7 pts):** Gets the basic distinction (h1 good, h2 bad) but misses the nuance of *when* the evidence was acquired. May claim h2 is forbidden by the negative heuristic (it isn't; only degeneration is risky).
  *   **C Range (0–4 pts):** Confuses h1 and h2. Claims all auxiliaries are ad hoc.

  **Part 2: Rehabilitation and Rivalry (10 Points)**
  *   **A Range (8–10 pts):** Recognizes that Years 28–30 provide *independent testability* and *novel content* (the assay puzzle) for h2, shifting it from degenerating to progressive locally. Crucially, notes that H is still inferior to R because progress is *comparative*. R's Year 31 prediction outweighs H's recovery. Avoids saying H is "refuted."
      *   *Common B Error:* Correctly notes h2 is rehabilitated but fails to weigh R's success against it. Treats H and R as equal because H "caught up." Or, claims h2 remains ad hoc because it was originally fitted to A2, ignoring the new assay evidence.
      *   *Common C Error:* Claims the Year 30 discovery proves H is true. Claims H must be abandoned because it needed an auxiliary at all.
  *   **B Range (5–7 pts):** Sees the value of the Year 30 discovery but misses the comparative element (Rival R). Or sees the Rival but misses the rehabilitation of h2.
  *   **C Range (0–4 pts):** Ignores Years 28–30. Claims H is dead because of A2.

  **Part 3: Crucial Experiment (5 Points)**
  *   **A Range (5 pts):** Explicitly rejects the "crucial experiment" framing as incompatible with MSRP. Argues for long-term comparative progress over instant falsification.
      *   *Common B Error:* Agrees the experiment is crucial but says H lost. Or says crucial experiments exist but are rare. Misses the structural objection to instant falsification.
      *   *Common C Error:* Accepts the Year 33 demand as valid. Confuses Lakatos with Popper.
  *   **B Range (3–4 pts):** Vaguely mentions "more evidence needed" without referencing the methodological prohibition on instant falsification.
  *   **C Range (0–2 pts):** Accepts the crucial experiment claim.

  **Overall Differentiation (A vs. B)**
  *   **The A Student:** Understands that degeneration is a *retrospective* and *comparative* judgment. They will note that h2 was degenerating *at Year 26* but not necessarily *at Year 30*. They will emphasize that R's existence makes H look worse than it would in isolation. They will reject the Year 33 demand on methodological grounds, not just empirical ones.
  *   **The B Student:** Treats the categories as static labels. They will label h2 "ad hoc" and leave it at that, missing the rehabilitation in Year 30. They will likely treat the rivalry as a simple "who has more facts" contest rather than a comparison of problemshifts. They may waffle on the crucial experiment, admitting it's strong but not explaining why Lakatos forbids it as a decisive moment.
