      *   Likely the Experimentalist's "No-Report" point. If consciousness exists without report, the "masking" via report mismatch is irrelevant to consciousness itself.
      *   *Alternative:* The Metaphysician's "Category Error." If det/det doesn't apply to mechanisms, the whole theory collapses.
