answer: |-
  **Scenario**

  At the municipal pool, a six-year-old non-swimmer slips off the edge into the deep end and sinks beneath the surface, thrashing visibly for twelve seconds before going still. Ten feet away, a lifeguard in a red uniform sits on the high chair with a rescue tube at hand, head oriented toward the opposite lane without entering the water or sounding the whistle. Simultaneously, an adult patron in swim trunks stands at the pool's edge, having just exited the water, face oriented toward the child for the duration of the thrashing without moving or calling out, despite being close enough to reach the child in three seconds. No other intervention occurs, and the child is later pronounced dead from drowning.

  ***

  **Analysis**

  **1. Counterfactual Dependence**
  A simple counterfactual account asks: *If the agent had acted, would the harm have been avoided?*
  *   **Lifeguard:** If the lifeguard had entered the water or sounded the whistle, staff response would have occurred within the twelve-second window, preventing death. The counterfactual holds.
  *   **Patron:** If the patron had entered the water, they were close enough (three seconds) to retrieve the child before the twelve-second mark, preventing death. The counterfactual holds.
  *   **Verdict:** Since the harm counterfactually depends on both omissions, the account must conclude that **both** failures caused the harm.

  **2. Role-Based Distinction**
  The role-based account distinguishes the agents based on institutional obligation rather than physical capacity.
  *   **Present Norm:** The lifeguard is bound by an employment contract and certification standards that mandate surveillance and rescue. The uniform and high chair are the observable markers of this specific undertaking.
  *   **Absent Norm:** The patron has no contractual or functional assignment regarding pool safety. Their presence is recreational, not operational.
  *   **Verdict:** Because only the lifeguard's omission violates a specific normative role, the account concludes that **only the lifeguard's** failure caused the harm.

  **3. Contrastive Account**
  A contrastive account evaluates causation as $C$ rather than $C^*$ causes $E$ rather than $E^*$.
  *   **Fixed Contrasts:** The scenario description fixes the contrast-event ($C^*$) as the specific physical inaction observed (remaining on chair/edge vs. entering water) and the contrast-effect ($E^*$) as death vs. survival.
  *   **Dependence:** Relative to these fixed contrasts, dependence holds for both agents (as established in section 1). The description prevents the theorist from shifting the contrast to something like "failure to call out" vs. "failure to jump" to exonerate the patron, because the physical capacity to prevent the outcome is explicitly stipulated as identical (both could have intervened in time).
  *   **Verdict:** With the contrasts fixed by the physical description, the account must admit dependence for **both** agents.

  **4. The Single Feature**
  *   **Feature:** The **institutional designation** (uniform/station vs. swim trunks/edge).
  *   **Function:** This is the only variable distinguishing the agents' causal status in the role-based account.
  *   **Without It:** If both agents were described simply as "adults in swim trunks," the role-based account would either have to concede that both caused the harm (if a general moral norm is accepted) or neither did (if only contractual roles count), thereby losing the asymmetry required to pressure the theory.

  **5. Role-Theorist's Reply and Blocking Revision**
  *   **Best Reply:** The role-based theorist may argue that **trivial-cost rescue generates a generic moral norm**, effectively placing the patron inside a "Good Samaritan" role. On this view, the patron's failure to act at trivial cost violates a background normative expectation, making their omission causal after all.
  *   **Blocking Revision:** To isolate the institutional role from general moral norms, revise the scenario to include **explicit signage at the pool edge reading: "Patrons Prohibited from Entering Water; Alert Staff Only."**
      *   *Effect:* This revision maintains the patron's *physical* ability to intervene (satisfying the counterfactual constraint) but renders their inaction **norm-compliant** rather than norm-violating. The lifeguard remains norm-bound to act despite the sign; the patron is norm-bound *not* to act. This eliminates the "generic moral norm" reply, forcing the role-based theorist to concede that the patron's omission is causally inert despite satisfying all physical conditions for prevention.
