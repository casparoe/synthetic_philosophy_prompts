answer: |-
  The economic historian's metaphor of "bench depth" offers a way to dissolve the stalemate between structuralists and intentionalists. It suggests that the Great Man versus Structure debate is not a single conflict but a category error. To defend the verdict that structuralism is true but idle, we must lay out three premises and identify the work each performs.

  First, **causal substitution depends on institutional capacity.** This premise does the work of defining the mechanism of history. In a central bank, the office constrains the occupant, and a credentialed understudy exists. In a movement party built around a singular charismatic authority, the office *is* the occupant. There is no understudy.

  Second, **the question "Would there have been a Nazi Germany without Hitler?" conceals three distinct explananda.** This premise does the work of disaggregation. We must separate: (1) the collapse of Weimar and the rise of an authoritarian right-wing regime; (2) the adoption of a specific racial-biological ideology (National Socialism); and (3) the execution of specific decisions, notably the industrialized extermination of European Jewry and the timing of the European war.

  Third, **moral and historical weight attaches to content and decision, not merely to regime type.** This premise does the work of valuation. It establishes that knowing *some* dictatorship would have arisen is less significant than knowing *which* dictatorship arose.

  If these premises hold, the verdict follows. The structuralist wins Explanandum 1 outright: Weimar's collapse was overdetermined. A generic authoritarian nationalist government was highly probable. However, the intentionalist wins Explananda 2 and 3 decisively. Without Hitler, the bench depth for a genocidal racial program was zero. No other figure in the DNVP or the Reichswehr possessed the specific disposition to prioritize extermination over traditional realpolitik. Thus, structuralism captures the trivial outcome (authoritarianism) while missing the catastrophic one (the Holocaust). It is a victory on a battlefield nobody cares about.

  Three objections threaten this conclusion.

  The **Conservation Objection** argues that structural pressures are so immense they dictate outcomes regardless of ideology. A non-Nazi nationalist regime, facing the same economic depression and geopolitical constraints, would have been forced into similar aggression and perhaps similar brutality. This collapses the three questions back into one.

  *Reply:* Conservation confuses direction with destination. Structural pressure explains why Germany moved right and sought revision of the Versailles Treaty. It does not explain why the revisionist program became biologically existential. A traditional conservative dictatorship might have persecuted Jews, but the leap to industrial extermination was not a structural necessity; it was an ideological commitment held by a shallow bench. Pressure creates war; it does not mandate genocide.

  The **Unfalsifiability Objection** claims bench depth is a post-hoc label. If a substitute appears, the bench was deep; if not, it was shallow. The "understudy clause" is merely an ad hoc rescue device to save the theory from refutation.

  *Reply:* Bench depth is empirically measurable prior to the counterfactual. An historian looks for succession mechanisms, party bylaws, and credentialing systems. In the NSDAP, the succession rules were ambiguous and contested until the very end; the party was built on loyalty to the Führer, not the office. In contrast, the Reichswehr had a clear chain of command. We do not need to wait for history to happen to measure the bench; we can inspect the institutional machinery. The absence of a vice-Führer with independent authority is a fact, not a redescription.

  The **Similarity Metric Objection** is the hardest. It suggests that choosing which explanandum to hold fixed rigs the game. If I decide to hold "ideological content" fixed to prove Hitler mattered, I have already assumed the conclusion. The metric for comparing possible worlds is chosen by the theorist, not found in the evidence.

  *Reply:* This objection risks paralyzing all counterfactual reasoning. Every historical claim relies on a similarity metric. The choice to distinguish between "authoritarianism" and "Nazism" is not a trick; it is a standard historical distinction based on observable policy differences. Holding the ideological variable fixed is valid because ideology has causal power. To claim the metric is arbitrary is to claim that ideas do not change outcomes. The disaggregation is not a fiat; it is a recognition that different historical layers have different causal densities.

  What evidence bears on bench depth? A social scientist would look for **succession protocols** (is there a designated deputy?), **ideological standardization** (is the doctrine written down and teachable, or dependent on oral revelation?), and **institutional memory** (does the organization survive the founder?). In 1920s Germany, one would examine the NSDAP's internal memos regarding leadership succession compared to the SPD or the Centre Party. One would analyze the speeches of potential understudies like Göring or Hess to see if they mirrored Hitler's specific racial fixation or merely echoed general nationalism. The evidence would show a party incapable of replicating its leader's specific will without him.

  Finally, I must be candid about what this position concedes to the structuralist. It admits that Hitler did not create the conditions that made dictatorship possible. It concedes that the German elite opened the door. It acknowledges that without the Depression and the Treaty of Versailles, Hitler remains a fringe agitator. This is not hero worship; it is causal precision. Acknowledging that a specific individual was necessary for a specific crime does not absolve the society that enabled him. It simply clarifies the nature of the enablement.

  The structuralist is right that the stage was set for tragedy. But the intentionalist is right that the script was written by one man. To say structuralism is "idle" is not to say it is false. It is to say that knowing the gun was loaded tells us less about the assassination than knowing who pulled the trigger. The bench was empty. The verdict stands.
