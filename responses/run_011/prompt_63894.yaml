answer: |-
  **1. The thesis to be translated**

  The corruption claim asserts that certain markets are intrinsically objectionable because the act of exchange alters the normative status of the good traded. Unlike exploitation objections, which focus on coercive background conditions or unfair distribution of benefits, this claim holds that even a voluntary, mutually advantageous trade can be wrongful. It differs from information asymmetry arguments, as full informed consent does not cure the defect. Nor is it mere disgust; the objection is reasoned, positing that commodification crowds out appropriate attitudes like altruism or respect. For Titmuss, paying for blood does not merely introduce safety risks; it transforms giving from a gift into a service, thereby diminishing the social meaning of the act. The claim must be separable from consequentialist harm: if the only objection were reduced safety or donor health, it would be a standard risk issue. The thesis fails if commodification yields no negative welfare outcomes yet remains objectionable solely due to the change in social meaning. It posits a harm to the *concept* of the good, not just the user.

  **2. The translation**

  In risk vocabulary, the 'hazard' is the market mechanism itself. For paid kidneys, the hazardous situation is the offer of money for tissue. The 'harm' is the difficult term. If we map degradation to psychological distress, we distort the thesis; the philosopher claims the good is degraded, not necessarily that the donor feels worse. In surrogacy, the affected party expands beyond the surrogate and intended parents to include the child and society. Severity becomes unquantifiable: how does one score 'objectification' on a 1–5 scale? Probability is equally elusive; does every transaction corrupt, or only at scale?

  Detectability is low; there is no sensor for moral degradation. Risk controls might include counselling or caps on payment, but residual risk remains high because the transaction itself is the hazard. For plasma, Titmuss's claim translates poorly. If commercial supply is safer and more abundant, the benefit–risk determination favours it on standard metrics. To reject it requires stipulating a 'societal harm' weight outside the technical file. Post-market surveillance would need to monitor social attitudes, not just adverse events. This mapping holds only where degradation causes identifiable psychological harm; it buckles where the harm is constitutive of the exchange rather than a consequence.

  For live kidney donation, the sequence leading to harm is usually physiological. To translate corruption, one must stipulate that the 'harm' is the shift in societal view of the body. This is not an injury to an identifiable party in the ISO sense. For commercial surrogacy, the hazardous situation is the contract. The affected party includes women generally, not just the surrogate. This violates the framework's requirement for specific users. Severity cannot be estimated statistically. For paid plasma, the benefit–risk determination collapses. If safety is equivalent, the risk file shows no reason to prohibit payment. To maintain the prohibition, one must import an external ethical weight. This is not a translation; it is a override. The framework assumes risk is a product of severity and probability. Corruption is often binary: the act is wrong, regardless of probability. Thus, the translation distorts the philosophical claim into a consequentialist calculation it was designed to resist.

  **3. The residue**

  Three categories resist translation. First, ontological change: the claim that the good itself changes value, not just user welfare. Risk management tracks injury to parties, not changes in the essence of a device or tissue. A kidney is a kidney; the framework cannot register that it becomes 'merchandise' rather than 'gift'. Second, diffuse third-party harm: people who never enter the market yet suffer diminished social standing or altered norms. ISO 14971 defines affected parties as users or bystanders in the vicinity, not the broader polity. A citizen who never buys blood cannot be logged as injured by its commercialisation.

  Third, class standing: commercial surrogacy is objected to because it affects how *all* women are regarded, not just the surrogate. Risk management is individualistic; it aggregates individual injuries, not collective status. Finally, the idea that non-participants regard the good differently cannot be logged as an adverse event. These are not latent harms waiting to be detected; they are immediate shifts in normative landscape. If these were expressible, they would appear as 'societal severity' scores, but no such axis exists without stipulation. The residue consists of claims about meaning, status, and collective identity that have no correlate in safety engineering. They are not risks of injury, but risks of moral error. The framework lacks a container for wrongs that do not wound.

  **4. Diagnosis**

  The defect lies primarily in the risk-management framework, which is consequentialist and individualistic. It assumes harm must befall a specific entity with measurable severity. The corruption thesis is often deontological or expressive; the wrong is in the doing, not the outcome. However, the philosophical claim is also less determinate than proponents suppose; 'degradation' is often a placeholder for unspecified long-term social harms. To express this, I propose adding a 'Normative Impact' category to the risk management file, distinct from safety risk. This would require scoring changes in social trust or moral status.

  The cost to auditability is significant: regulators cannot verify 'loss of dignity' as they verify sterility. It introduces subjectivity that undermines the defensibility of the benefit–risk determination. Yet, without it, the file remains blind to the specific objection raised by Anderson and Sandel. The amendment acknowledges the limit of safety engineering when facing ethical boundaries. It forces the committee to declare that some risks are unacceptable regardless of probability. This shifts the burden from proving harm to justifying values. While this reduces technical precision, it increases ethical transparency. The framework is not broken, but it is incomplete for this class of problem. It treats ethics as a constraint on safety, rather than a dimension of risk itself.

  **5. Bottom line**

  Do not continue translating this debate directly into risk vocabulary for ethics committees. The mismatch is too large. Treating corruption as a risk control problem suggests it can be mitigated rather than prohibited, which concedes the consequentialist ground the philosophers dispute. However, use the translation to demonstrate *why* the framework fails. Show the committee the empty cells where 'severity of commodification' should be. This highlights the need for ethical, not just technical, judgement. The translation is useful diagnostically, to show where the tool breaks, but not prescriptively, to solve the problem.
