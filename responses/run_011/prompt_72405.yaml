answer: |-
  Your friend's subscription analogy is legally functional but philosophically hollow, and you are not being precious to object to a system that administratively assigns your conscience by default while Britain merely preserves its establishment as ceremony.

  The lawyer is correct that the church is treated as a corporation under public law, a *Körperschaft des öffentlichen Rechts*, and the state acts merely as a debt collector for a handling fee. However, comparing it to a gym membership papers over the crucial difference in consent. A gym contract requires a signature; the German church tax relies on a status conferred at infancy, effectively treating your christening in Yorkshire as a binding declaration of membership that remains operative until you actively sever it. It is an opt-out system disguised as a voluntary subscription, which is why the requirement to visit a government office and pay a fee to leave feels less like cancelling a service and more like renouncing a caste.

  Your family's comparison to Britain is equally fraught, though for different reasons. You are right that Britain is not truly secular; the Monarch is the Supreme Governor of the Church of England, bishops sit in the Lords, and the state retains the power to legislate for the church. Yet, the British model is one of symbolic establishment without financial coercion. The state supports the church through heritage grants and legal privilege, but it does not reach into your paycheck. Germany, conversely, practices a form of cooperative separation: the state stays out of church doctrine precisely because the church funds itself through the taxman. In Britain, the state controls the church but doesn't tax for it; in Germany, the state doesn't control the church but does tax for it.

  This leaves you squarely in a clash of liberal expectations. Your discomfort stems from a British liberal intuition that belief is a private matter into which the state should not inquire unless invited. The German system operates on a corporatist model where religious affiliation is a public status with fiscal consequences, managed bureaucratically rather than spiritually. When you feel that the government has recorded a verdict on what you believe, you are accurate: for fiscal purposes, it has. Whether that warrants outrage is a matter of taste, but it is not mere preciousness. It is a valid objection to having your internal life categorised by default, even if the practical outcome is simply funding a institution your parents joined you to before you could speak.

  Ultimately, you are navigating the friction between two different kinds of hypocrisy. Britain pretends to be secular while maintaining a state church in name; Germany pretends to separate church and state while binding them together in the tax code. Neither is perfectly consistent, but the German model places the burden of inconsistency on your wallet, whereas the British model places it on the constitution. You are entirely within your rights to find the former more intrusive, even if your German friends view it as simple administrative housekeeping.
