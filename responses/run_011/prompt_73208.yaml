prompt: |-
  So my roommate and I went at it for like two hours last night about democratic backsliding and I'm still buzzing. He's a 1L and his whole position is that the term is a rhetorical weapon rather than a description — his argument being that every move people point at (packing a court, redrawing districts, tightening media regulation, tightening who can vote, purging a civil service after a coup attempt) has been done by governments nobody calls authoritarian, so the label is mostly tracking which side you're on. My counter was that he was scoring each move in isolation, and that the actual content is in the trajectory plus the question of who's left to call it once the referees themselves get replaced. Neither of us moved an inch. I TA a 22-person political theory section, 75 minutes, next Thursday, and instead of summarizing this argument at them I want to make them run into it.

  Design an in-class game that forces the disagreement to happen. My constraints: 22 students, 75 mins, no real money (but I do want a scoring scheme with at least two currencies that pull against each other — something like grip on power vs. domestic/international legitimacy, with a win condition that makes trading one for the other genuinely tempting). Keep the countries fictional so it doesn't dissolve into a shouting match about the last election, but the cards should be recognizable. Before any play, the class or a subset of it should write a short rubric for what counts as erosion without having seen the cards. Then several rounds in which a ruling coalition plays a card, states its public justification out loud, an opposition bloc protests, and a tribunal/oversight body rules using only the rubric. Two things I really want built in, because these were the two things my roommate and I actually disagreed about: first, the tribunal's rulings have to be advisory and overridable at a cost, and the ruling coalition has to get to swap out a tribunal member at some point, so the students feel what happens to an arbiter that's downstream of the people it's arbitrating; second, the deck has to be symmetric — give the opposition cards too, and include a couple that are genuinely undecidable (an anti-corruption cleanup, a campaign finance disclosure rule) so the rubric visibly can't handle them. Also, run at least part of the game with a different starting baseline: same deck, but a country that began with a weak judiciary and a dominant-party history, so identical moves get different verdicts and somebody notices why.

  What I need from you: role sheets, the card deck (around 14 cards — name, public justification, hidden effect, which institution it touches), the scoring table, a minute-by-minute timeline, and a final stage where students re-judge the whole sequence with hindsight against the rubric they wrote in the dark — I expect the rubric to fail there, but tell me what to do if it doesn't. Then the debrief: map specific moments onto the conceptual problems (the baseline problem, atomized vs. trajectory judgment, the who-decides problem, whether the concept is descriptive or evaluative), and give me the questions that get them to say it rather than me saying it. Tell me what will predictably go wrong the first time — my guess is the ruling coalition just steamrolls and it turns into farce, or the tribunal starts rubber-stamping and half the room checks out — and how to handle each. And be straight with me about which feature of real backsliding this game can't reproduce at all, the part I'll have to supply by talking: I'm thinking it's the timescale, and the fact that the whole thing is popular while it's happening, and that my students already know how the real-world cases ended. No reading list, please, I've got one — I just want something runnable.
