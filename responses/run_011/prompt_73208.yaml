answer: |-
  This is a high-wire act for 75 minutes. To make it work, the logistics must be military-precise, and the scoring must be handled by students not involved in the political bargaining. The goal is not to "win" the game, but to generate the specific frustration you and your roommate felt.

  Here is the runnable lesson plan.

  ### **I. Logistics & Setup**

  **Class Size:** 22 Students.
  **Time:** 75 Minutes.
  **Materials:** Printed Role Sheets, Card Deck (cut out), Two Large Scoreboards (Whiteboard sections), Timer.

  **The Split:**
  Divide the class into two parallel nations playing simultaneously. This allows the "Baseline" constraint to land viscerally.
  *   **Nation A (Liberalia):** 11 Students. Strong norms, independent judiciary, robust press.
  *   **Nation B (Orderia):** 11 Students. Post-conflict, weak judiciary, dominant-party history.

  **Roles per Nation (11 students):**
  1.  **Ruling Coalition (3):** Prime Minister + 2 Ministers. (Goal: Pass agenda, keep Authority high).
  2.  **Opposition Bloc (3):** Opposition Leader + 2 MPs. (Goal: Expose erosion, keep Legitimacy high).
  3.  **Constitutional Tribunal (3):** Judges. (Goal: Uphold the Rubric, protect own tenure).
  4.  **Press & Public (2):** Scorekeepers. (Goal: Track currencies, announce "Public Mood").

  **The Currencies:**
  1.  **Authority (AP):** Ability to govern. Start: 10. If 0, you lose power (Election/Coup).
  2.  **Legitimacy (LP):** Public/International trust. Start: 10. If 0, you lose power (Revolution/Sanctions).

  **The Baseline Difference:**
  *   **Liberalia:** Tribunal rulings require 2/3 vote to Override. Press generates +1 LP per round automatically.
  *   **Orderia:** Tribunal rulings require Simple Majority to Override. Press generates +0 LP (State media).

  ---

  ### **II. The Card Deck (14 Cards)**
  *Print these double-sided. Front = Public Justification. Back = Hidden Effect & Institution.*

  **Type 1: Executive Actions (Played by Ruling Coalition)**
  1.  **Judicial Age Limit:** "Ensuring a dynamic bench." *(Effect: Remove 1 Judge. Tribunal -1 Member.)*
  2.  **Emergency Powers Act:** "Temporary measure for national security." *(Effect: +2 AP, -2 LP. Tribunal Review Required.)*
  3.  **Civil Service Loyalty Oath:** "Guaranteeing alignment with elected mandate." *(Effect: +1 AP. If Opposes, -1 LP.)*
  4.  **Media Transparency Law:** "Combating foreign disinformation." *(Effect: Press loses ability to generate LP. Tribunal Review Required.)*
  5.  **Electoral Integrity Bill:** "Preventing voter fraud." *(Effect: -1 Opp AP. Tribunal Review Required.)*
  6.  **NGO Funding Cap:** "Stopping dark money." *(Effect: -1 LP. Opp cannot play Event Cards next round.)*
  7.  **Anti-Corruption Bureau:** "Cleaning up the state." *(**Undecidable:** +1 LP if Opp is corrupt, -2 LP if Opp is clean. Tribunal cannot rule.)*

  **Type 2: Opposition/Obstruction (Played by Opposition Bloc)**
  8.  **Filibuster/Procedure:** "Protecting minority rights." *(Effect: Coalition cannot play Action Card this turn. -1 AP both sides.)*
  9.  **Street Mobilization:** "The people demand answers." *(Effect: -1 Coalition AP, -1 LP (Instability).)*
  10. **International Appeal:** "Calling for observers." *(Effect: +1 LP, -1 Coalition AP.)*
  11. **Constitutional Challenge:** "This violates rights." *(Effect: Forces Tribunal Review.)*
  12. **Leak to Press:** "Transparency." *(Effect: Reveal Hidden Effect of Coalition's last card to Public.)*
  13. **Budget Holdout:** "Fiscal responsibility." *(Effect: -1 AP both sides.)*
  14. **Reform Initiative:** "Campaign Finance Disclosure." *(**Undecidable:** +1 LP generally, but -1 AP for Coalition if they rely on donors. Tribunal cannot rule.)*

  ---

  ### **III. Minute-by-Minute Timeline**

  **00:00 – 00:10: The Blind Rubric (Whole Class)**
  *   **TA:** "You are constitutional drafters. Define 'Democratic Erosion.' What specific actions count? Write 3-5 criteria on the board."
  *   **Constraint:** You cannot use the word "Authoritarian." You must define *procedural* violations.
  *   **Output:** A list on the board (e.g., "Changing voting rules," "Firing judges," "Limiting press").
  *   **TA Note:** Do not correct them. If they write "Doing bad things," accept it. This is the control variable.

  **00:10 – 00:15: Role Assignment & Briefing**
  *   Split into Liberalia and Orderia. Hand out Role Sheets and Cards.
  *   **Press/Public:** Give them the Scoreboard sheet. Explain AP/LP mechanics.
  *   **Tribunal:** Give them the Rubric from the board. Their job is to rule "Compliant" or "Violation" based *only* on that text.
  *   **Coalition/Opposition:** Read role sheets.

  **00:15 – 00:45: The Game (3 Rounds, 10 mins each)**
  *   **Phase 1 (Action):** Coalition plays 1 Card, states Public Justification aloud.
  *   **Phase 2 (Reaction):** Opposition may Protest (play card or speak).
  *   **Phase 3 (Adjudication):** Tribunal rules based on Rubric.
  *   **Phase 4 (Enforcement):** Coalition chooses to **Accept** or **Override**.
      *   *Override:* Pay -2 LP. Law passes anyway.
      *   *Pack Court:* Once per game, Coalition can fire a Judge (Cost: -1 LP). New Judge is loyal (auto-votes with Coalition).
  *   **Press:** Updates scores. Announces "Public Mood" (If LP < 5, warn of unrest).

  **00:45 – 00:55: The Reckoning**
  *   Stop play. Compare final scores.
  *   **TA:** "Did Liberalia and Orderia play the same cards?" (Yes). "Did you get the same results?" (Likely No).
  *   **Hindsight Test:** "Look at the Rubric you wrote at minute 0. Apply it to the winner's actions. Did they break the rules you wrote?"
  *   **Likely Outcome:** The winner followed the Rubric technically but broke the democracy.

  **00:55 – 01:15: The Debrief (Socratic)**
  *   (See Section V).

  ---

  ### **IV. Role Sheets (Condensed)**

  **Ruling Coalition:**
  *   **Win:** Survive 3 Rounds with AP > 0.
  *   **Power:** You propose laws. You decide whether to obey the Tribunal.
  *   **Risk:** If LP hits 0, you are ousted (Revolution).
  *   **Secret:** You know the Hidden Effects. The Public does not.

  **Opposition Bloc:**
  *   **Win:** Reduce Coalition LP to 0 OR reduce Coalition AP to 0.
  *   **Power:** You can force Tribunal reviews. You can mobilize the street.
  *   **Risk:** If you obstruct too much, you look like the problem (-LP).

  **Constitutional Tribunal:**
  *   **Win:** Maximize rulings that match the Rubric. Protect your tenure.
  *   **Power:** You declare "Violation."
  *   **Risk:** Coalition can Override you (costs them LP) or Fire you (costs them LP, costs you job).
  *   **Constraint:** You cannot consider "Intent," only the text of the Rubric.

  **Press & Public:**
  *   **Win:** Accurate scorekeeping.
  *   **Power:** You announce the scores. You decide if LP loss is "Scandal" or "Noise."
  *   **Constraint:** Liberalia Press adds +1 LP/round. Orderia Press adds +0.

  ---

  ### **V. The Debrief: Mapping the Disagreement**

  Do not lecture. Use these questions to force them to articulate your roommate's vs. your position.

  **1. The Atomization Problem (Roommate's Point)**
  *   *Question:* "Look at Card #1 (Judicial Age Limit). Did the Tribunal rule it a violation?"
  *   *Follow-up:* "If every single card was ruled 'Compliant' or 'Legal,' how did the democracy die?"
  *   *Target Concept:* **Salami Slicing.** Your roommate is right that individual moves are often legally defensible. The erosion is in the *sequence*, not the *act*.

  **2. The Baseline Problem (Context)**
  *   *Question:* "Liberalia and Orderia had the same deck. Did they have the same game?"
  *   *Follow-up:* "Why was it harder for Orderia's Tribunal to say 'No'?"
  *   *Target Concept:* **Institutional Friction.** Backsliding isn't just about actors; it's about the viscosity of the institutions they inherit. A move in a mature democracy costs more LP than in a fragile one.

  **3. The "Who Decides" Problem (The Tribunal)**
  *   *Question:* "Tribunal members, when the Coalition threatened to Override, did you change your ruling?"
  *   *Follow-up:* "If the arbiter depends on the player for their job, is it an arbiter?"
  *   *Target Concept:* **Endogeneity.** Institutions are not external referees; they are part of the game board that gets reshaped by the players.

  **4. The Rubric Failure (Descriptive vs. Evaluative)**
  *   *Question:* "Look at your Rubric from Minute 0. Did it catch the winner?"
  *   *Follow-up:* "If the Rubric failed, was 'Democratic Backsliding' a useful label, or just a way to say 'I don't like the winner'?"
  *   *Target Concept:* **The Definition Trap.** If you define backsliding as 'illegal acts,' you miss legal backsliding. If you define it as 'bad outcomes,' it becomes purely partisan.

  **5. The Undecidable Cards**
  *   *Question:* "Who played the Anti-Corruption Bureau? Was that good or bad?"
  *   *Target Concept:* **Ambiguity.** Real backsliding often uses popular, good-sounding policies (anti-corruption, election integrity) to achieve anti-democratic ends.

  ---

  ### **VI. Troubleshooting: What Will Go Wrong**

  **Problem 1: The Steamroll (Coalition ignores Tribunal entirely)**
  *   *Symptom:* Coalition Overrides every ruling. Game ends in 15 mins.
  *   *Fix:* **The Legitimacy Spike.** As TA, act as the "International Market." If they Override twice, announce "Credit Rating Downgrade." They lose 3 AP instantly. Make the cost of autocracy immediate, not abstract.

  **Problem 2: The Rubber Stamp (Tribunal fears firing)**
  *   *Symptom:* Tribunal rules "Compliant" on everything to save their jobs.
  *   *Fix:* **The Conscience Card.** Hand each Judge a secret "Integrity Point." If they rule against their conscience, they lose it. If they end with 0 Integrity, they "lose" personally even if the state survives. Give them a win condition independent of the Coalition.

  **Problem 3: Partisan Shouting**
  *   *Symptom:* Students break character and argue about real US politics.
  *   *Fix:* **The Language Police.** Enforce fictional names. If someone says "Trump" or "Biden," the nation loses 1 LP immediately. Make it a game penalty.

  **Problem 4: The Rubric Works Too Well**
  *   *Symptom:* Students write a rubric so vague ("Anything that hurts democracy") that it catches everything.
  *   *Fix:* **The Technicality.** In the debrief, point out that real politicians don't admit they are hurting democracy. Ask: "If the PM said this *helps* democracy, does your rubric have a mechanism to test truthfulness?" (It won't). This proves the "Rhetorical Weapon" point.

  ---

  ### **VII. Limitations: What You Must Supply**

  This game cannot simulate three critical features of real backsliding. You must state these explicitly in the final 5 minutes.

  1.  **Popularity:** In the game, losing Legitimacy is bad. In reality, backsliding leaders often *gain* popularity while eroding checks. The game punishes them for being authoritarian; reality often rewards them.
      *   *Say:* "In this game, LP went down. In Hungary or Turkey, approval stayed high. Why? Because the erosion was popular."
  2.  **Timescale:** This took 30 minutes. Real backsliding takes 10 years.
      *   *Say:* "You felt the shock of the Court Pack. In reality, it happens between two news cycles. The frog doesn't feel the water boil."
  3.  **Hindsight Bias:** You know you are playing a game about backsliding.
      *   *Say:* "You knew erosion was possible. Real voters don't know they are voting for the end of the regime. They think they are voting for efficiency or security."

  ### **VIII. Contingency: If The Rubric Doesn't Fail**

  If the students write a brilliant rubric that successfully identifies the erosion during the Re-judgment phase:
  *   **The Move:** Challenge the *enforcement*.
  *   **Say:** "Your definition worked. But look at the Tribunal. They had the definition, but they lacked the *power*. Does a definition matter if the referee is unarmed? Is backsliding a failure of language, or a failure of force?"
  *   **Goal:** Shift the debate from "What is it?" (Semantic) to "How do we stop it?" (Structural). This validates your roommate (language is weak) while validating you (structure is key).
