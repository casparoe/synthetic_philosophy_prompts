  ### Case for the Following Week

  To separate the surviving rules—specifically to determine whether your case was rejected due to **Rule 1 (Institutional Conditionality)** or **Rule 2 (Anti-Curve-Fitting)**—you should bring the following case:

  **The Proposal:** A research program that **fits coupled equations to the same historical record** (violating Rule 2, like your current case and Kondratiev) but is **restricted to a specific institutional regime**, such as "Fiscal Crisis Cycles in Modern Parliamentary Democracies only" (satisfying Rule 1, like Gresham).

  **The Test:**
  *   **If she Accepts:** It proves your current case was rejected primarily for violating **Rule 1 (Institutional Conditionality)**. It implies that curve-fitting is permissible if the institutional scope is narrow enough (Gresham trumps Kondratiev).
  *   **If she Rejects:** It proves your current case was rejected primarily for violating **Rule 2 (Anti-Curve-Fitting)**. It implies that deriving parameters from the explanation set is fatal regardless of institutional restrictions (Kondratiev trumps Gresham).

  This case isolates the methodological sin (fitting) from the ontological sin (universalism), forcing the advisor to reveal which is the greater violation of Popperian standards in her view.
