  ### Closest Analog

  **Kondratiev's Long Waves.**

  Like Kondratiev, you are fitting coupled equations to long-run series to identify cyclical patterns in history. Like Kondratiev, you are using the historical record to estimate the parameters of the very cycles you claim to explain. The advisor rejected Kondratiev explicitly because the periodization "keeps sliding" and it was a "trend fitted to a bounded stretch." Your 2010 prediction distinguishes you, but methodologically, you are Kondratiev's heir. She will treat the prediction as a lucky fit of the sliding periodization rather than validation of a law.

