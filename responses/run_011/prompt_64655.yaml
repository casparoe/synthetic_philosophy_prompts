answer: |-
  The island of Orea smelled of salt and guano, a sharp perfume that clung to the back of the throat. For three weeks, Elara had watched the Cobalt Gliders perform the Twilight Ascent. It was a brutal ritual. Just as the sun dipped below the basalt cliffs, the males launched themselves from the highest spires, hovering vertically against the trade winds. They held the position until their muscles screamed, visible against the fading light to both the females on the ledge and the Shadow-Hawks circling above.

  Elara tapped her stylus against her tablet. Her model predicted the hierarchy perfectly: only males with excess energy reserves could afford the caloric burn, and only those with sharp instincts could survive the exposure. It was a clean, additive equation. Cost equals risk plus energy. Honesty emerges because the bill is too high for the poor to pay.

  "Number Four is dropping early again," Kael said. He wasn't looking at a screen. He was leaning against a rock, smoking a hand-rolled cigarette, his notebook open on his knee. Kael had twenty years of Orea in his handwriting.

  "Condition index is low," Elara said. "He can't afford the hawk risk."

  "He's not afraid of the hawk," Kael said, ashing into the sand. "He's afraid of tomorrow. He doesn't have the fat to burn."

  The distinction seemed semantic to Elara. The cost was the cost. But then the Conservation Authority intervened. The Shadow-Hawks were deemed an invasive threat to a nested species elsewhere. Traps were set. nets were strung. Within a week, the sky was clear.

  Elara panicked. Her model relied on the predation risk to enforce honesty. If the cost was removed equally for everyone, the signal should become cheap. Low-quality males should bluff, hovering just as long as the elites, flooding the channel with noise. She expected the mating system to collapse into chaos within the season.

  She watched the dusk ritual on day ten of the hawk eradication. Number Four, the low-condition male, launched. He held for ten seconds. Number Twelve, a prime male with deep cobalt plumage, launched beside him. He held for forty.

  The hierarchy remained. The ordering was faithful.

  "It should be random," Elara muttered, watching the data stream. "The risk is zero. Why aren't they all maxing out?"

  Kael didn't look up from his notes. "Because the wind hasn't changed. And their bellies are still empty."

  The cost of predation was absolute, but the cost of energy was marginal. For Number Twelve, burning the calories for a forty-second hover was manageable; he could forage them back the next morning. For Number Four, that same forty seconds represented a deficit he couldn't recover. The signal remained honest not because it was dangerous, but because the *next increment* of effort hurt the weak male more than the strong one. The price tag was the same, but the budget was different.

  Elara adjusted her parameters. She told herself the system was stable. But the Authority wasn't done. A sympathetic donor, concerned about the high mortality of low-condition males during the Ascent, funded a supplementary feeding program. High-protein paste was placed at the base of the spires, targeted specifically at the runts. Number Four and his kin gorged themselves.

  "Now we stabilize the population," the visiting economist, Simon, said over dinner. He was consulting on the grant. "You're reducing the barrier to entry. In labor markets, subsidies increase participation. You're allowing the hidden talent to show itself."

  Elara ran the simulation. With energy constraints lifted for the low-quality males, the model predicted a surge in signaling intensity across the board. She expected a boom.

  The next dusk, the sky filled with Cobalt Gliders. Number Four launched. He held for forty-five seconds. Number Twelve held for fifty. The difference was negligible. The air was crowded with males claiming elite status.

  On the ledge, the females watched. They did not choose. They shuffled, confused. The signal had lost its resolution. When every male claims to be elite, the claim means nothing. The females deferred mating. The breeding season stalled.

  Elara watched the playback later, her stomach cold. The feeding program hadn't helped the weak males succeed; it had destroyed the language they used to speak. By equalizing the marginal cost, she had equalized the signal. The information was gone.

  "And yet," Kael said, pointing to the audio spectrogram on her screen. "Listen to the click."

  Throughout the Ascent, the Gliders produced a mechanical snapping sound at the apex of the hover. It was caused by the primary feathers locking together under tension. It required a specific wing morphology—stiff shafts, precise alignment—that developed over years. You couldn't feed your way into it. You couldn't risk your way around it. It was an index, not a handicap.

  Even as the hovering durations converged into noise, the click remained stratified. Only the males with historically good condition produced the sharp, clean snap. The fed males, Number Four included, produced a dull thud. Their wings were structurally compromised from past营养不良.

  The females, Elara realized, weren't watching the hover duration anymore. They were listening to the click. The costly signal had collapsed, but the unfakeable index held.

  Simon leaned over her shoulder. "So the degree is worthless because everyone got one, but the transcript still shows the grades."

  "Something like that," Elara said.

  The disaster was quiet. The population didn't crash from predation; it stagnated from confusion. The survival probability of the males had increased—no hawks, extra food—but the mating payoff had plummeted because the signal was broken. Fitness wasn't survival plus mating; it was survival times mating. If one term is zero, the product is zero. You could keep the males alive forever, but if they couldn't communicate quality, the lineage ended.

  Elara closed her laptop. The simulation had assumed costs were additive, that you could balance a booksheet of risks and rewards. But biology didn't balance books; it compounded interest.

  Kael capped his pen. "Birds don't know the theory, Elara. They just know the wind."

  "I need to rewrite the model," she said.

  "Leave the birds out of it," Kael said, standing up and brushing sand from his trousers. "Just fix the math. The birds know what they're doing."

  Elara looked out at the spires. The sun was setting. The fed males were launching again, burning energy they didn't need to burn, shouting lies into the wind. The ones with the good wings clicked softly, waiting to be heard. She opened the laptop again. She deleted the variable for absolute cost. She began to draw a curve where the slope mattered more than the height.

  **What's load-bearing**

  **Beat 1 (Baseline):** Establishes the intuitive "handicap" view: signals are costly (energy + predation), and honesty tracks condition. This sets up the reader's expectation that cost = honesty.
  **Beat 2 (Raptor Removal):** Tests the "absolute cost" misconception. When the predation risk (absolute cost) is removed equally, honesty persists. This demonstrates that differential *marginal* cost (energy reserves relative to condition) is the actual mechanism maintaining honesty, not the absolute danger.
  **Beat 3 ( Supplementary Feeding):** Tests the "differential cost" mechanism. By artificially boosting the condition of low-quality signallers, the marginal cost differential is erased. The signal becomes cheap for everyone, destroying its information content. This also hints at the multiplicative nature of fitness: higher survival (via feeding) leads to zero fitness because mating success (via signaling) collapses.
  **Beat 4 (The Click):** Introduces the "index" signal. Unlike the hover (handicap), the click is physically constrained by morphology. It remains honest regardless of energy subsidies, distinguishing between signals that are *costly to fake* versus those that are *impossible to fake*.

  **Hardest Beat:** Beat 3 was the most difficult to dramatize without exposition. Showing "marginal cost differential" requires showing two birds doing the same thing with different internal consequences. I relied on the females' refusal to mate to show the signal's loss of value, rather than having Elara calculate cost-benefit ratios.

  **Compression/Fudge:** The speed of the evolutionary/behavioral response is compressed. In reality, female preference might not shift to the index signal (the click) within a single season; they might simply skip breeding entirely or rely on other cues. I accelerated their reliance on the index to ensure the reader sees the contrast between the broken handicap and the stable index within the story's timeframe.
