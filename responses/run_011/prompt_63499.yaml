answer: |-
  **The Heritage Access Bind**

  Elena directs a non-profit converting a listed 19th-century building into a youth shelter. The Heritage Council mandates preserving the original single-step entrance as a condition of the grant; any alteration voids funding and breaches a covenant of cultural stewardship. Simultaneously, the Disability Rights Act mandates step-free access for public facilities; failure constitutes unlawful discrimination against mobility-impaired youths. Engineering reports confirm: ramping requires removing the step; keeping the step excludes wheelchair users. Closing the shelter is possible but deprives fifty homeless youths of beds during peak season. Elena knows all facts. She cannot preserve the step and install the ramp. She must choose.

  ***

  **Walkthrough**

  **1. The Oughts and ATC Status**
  *   **Ought A:** Preserve the heritage step. This is ATC because it rests on a binding covenant and a duty of intergenerational stewardship; violating it isn't just a cost, it's a betrayal of trust that undermines the institution's legitimacy.
  *   **Ought B:** Ensure step-free access. This is ATC because it rests on a fundamental right to equal dignity and participation; denying it constitutes discrimination, not merely a suboptimal outcome.
  *   **Why ATC?** Both claims are peremptory. Neither functions as a mere "prima facie" consideration that disappears when weighed; both retain their normative force even when violated.

  **2. The Ranking Stall**
  The deflationist strategy requires a common metric to rank the oughts (e.g., utility, rights-tier). Here, the values are heterogenous: *historical integrity* vs. *present equity*. There is no scale where "one unit of heritage" equals "units of access." To say access "wins" is to assert a lexical priority that isn't inherent to the case; it's a stipulation. The ranking strategy stalls because there is no shared currency to measure strength.

  **3. Deflationist Reply on Residue**
  *   **Reply:** "The residue is merely agent-regret. Elena did what she ATC ought to do. She owes nothing to the losing side, only sadness that the world required a choice."
  *   **Evaluation:** This fails. If Elena keeps the step, she owes the disabled community an explanation and remediation plan, not just regret. If she ramps, she owes the Heritage Council an account for the breach. The residue is *owed* because the obligation wasn't erased; it was violated. The deflationist cannot explain why an apology is mandatory if no obligation remains.

  **4. Key Feature & Degradation**
  *   **Anti-Dissolution Feature:** The **binding covenantal nature** of the heritage duty.
  *   **Degradation:** If the heritage constraint were merely aesthetic preference (not a covenant), the deflationist ranks Access > Preference, and the dilemma evaporates. The covenant makes the loss normative, not just aesthetic.

  **5. Deontic Principles**
  This scenario forces a revision of **Agglomeration** (if OA and OB, then O(A&B)) or the principle that **'Ought implies Can'** applies to ATC obligations in conflicts. Standard logic cannot accommodate two conflicting ATC oughts without contradiction.

  **6. Spec Satisfiability Note**
  Spec 2 ("both are all-things-considered") is technically unsatisfiable within *standard* deontic logic, which defines ATC as the winner of a conflict. However, it is satisfiable within *dilemmist* logic, which is presumably the target of your chapter. The case exposes this definitional rift: if you accept the case intuition, you must reject the deflationist definition of ATC.
