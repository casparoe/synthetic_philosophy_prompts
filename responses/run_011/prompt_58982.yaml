answer: |-
  Relative neural investment scaled against metabolic maintenance provides the most empirically tractable proxy for sentience capacity, and the specific thresholds reflect identifiable neurobiological discontinuities rather than arbitrary conveniences. The three-quarters power exponent in the denominator functions as a proxy for basal metabolic rate according to Kleiber's Law, representing the physiological overhead required to maintain bodily mass. By normalizing total neuron count against this metabolic cost, the metric isolates neural capacity that exceeds somatic maintenance, distinguishing computational surplus available for complex integration from hardware dedicated strictly to motor control and homeostasis. This approach ensures that moral weight correlates with the density of processing power relative to biological cost, rather than raw size, which aligns with the hypothesis that a rich inner life requires neural resources beyond those demanded by mere existence.

  This focus on centralized computational surplus necessitates the exclusion of distributed peripheral neurons, as seen in the cephalopod arm clause. Suffering is not a local reflex but a unified negative affective state requiring global information integration, which neurobiological consensus locates in the central brain rather than peripheral ganglia. While arm neurons facilitate complex motor autonomy and local nociception, they lack the architectural connectivity to generate the coherent subjective experience that defines morally relevant suffering. Counting only central brain neurons ensures the metric measures the capacity for a unified inner life rather than the capacity for reaction, maintaining consistency with the definition of moral weight as dependent on experiential richness.

  The one-hundredth cutoff is principled because it situates the negligence threshold within a natural bimodal distribution of neural density scores rather than imposing an external round number. Empirical data reveals an orders-of-magnitude gap between vertebrate centralization and invertebrate ganglionic structures when normalized by metabolic mass, creating a distinct valley in the distribution of computed values. Setting the threshold at one percent of the chicken baseline places the exclusion zone within this empirical gap, effectively distinguishing systems capable of unified affective states from those operating primarily on reflexive nociception. This treats the threshold as a detection limit for integrated suffering capacity, ensuring that the removal of insects from the ledger reflects a biological discontinuity in neural architecture rather than an arbitrary administrative convenience.
