  **Tribute to Marianne**

  Good evening. Forty-two years is a long time to spend in a single room, asking the same questions, demanding the same answers. When Marianne began in this department, the landscape of our field looked quite different. When she leaves it, the landscape bears the imprint of her footsteps. That is not a metaphor. It is a record of work done.

  I have spent thirty-five years standing across the table from her. We have not always agreed on the aim of our inquiries. Marianne has insisted that our vocabulary must answer to something beyond our preferences. I have suggested that vocabulary is a tool for coping, rather than a mirror for reflecting. For decades, we have walked parallel paths, sometimes close, sometimes apart. Early in our friendship, she reviewed a book of mine and noted that I had not refuted her project so much as changed the subject. For a long time, I treated that as a criticism. I have come to see it as a diagnosis. I have come to accept that observation. It is a rare gift to be understood so clearly by someone who disagrees with you.

  But tonight is not about the disagreements. It is about the work we share. And if there is one thing that defines Marianne's contribution, it is found in the seminar room. We all know the habit. She would not let a sentence stay on the board until it had been made precise enough to carry risk.

  Vagueness is a shelter. It protects the speaker from failure. Marianne refused to let us hide there. She demanded that our claims be specific enough to stumble. She insisted that if a sentence could not meet resistance, it was not yet ready to be spoken. This was not about scoring points. It was about ensuring that our words had weight. She taught us that a claim without stakes is merely noise. By forcing us to sharpen our sentences until they could break, she ensured that when they held, they held something up.

  Thirty of her former students are in this room tonight. You know this better than anyone. You know the feeling of having a sentence returned to you, again and again, until it was sturdy enough to bear load. You know the frustration, and you know the relief when the words finally fit the purpose. You are here because she demanded that you become clearer thinkers, not because she demanded you become copies of her. She built a community of inquiry where disagreement was possible because the terms were clear. That is a legacy that will outlast any single theory.

  To her family—her partner, her brothers, her nieces and nephews—thank you for sharing her with us. We know that the patience she showed in the seminar room was funded by patience elsewhere. We see the person behind the philosopher, and we are grateful for her presence among us.

  Marianne is allergic to pathos, so I will keep this brief. Retirement is not an end to inquiry. It is a change of venue. The questions do not stop simply because the semester does. I know she will continue to ask them, and I know she will continue to demand precise answers.

  We have shared this department for decades. We have challenged each other. We have forced each other to be clearer. I cannot say that we have arrived at the same destination. But I can say that the journey was better for having her walking it. She has made this department a place where words matter, where precision is a form of respect, and where a sentence must earn its place on the board.

  Please join me in raising a glass. To Marianne. To the work. And to the next chapter.

  ***

  **Meta-Commentary on Constraints**

  The constraint bit hardest on the description of her seminar habit. The prompt requires honoring her demand for falsifiability without invoking the metaphysics of accuracy that makes falsification meaningful. I wanted to write, "She wanted sentences that could be proven false," but "false" implies a binary of truth I cannot endorse. I replaced it with "precise enough to carry risk" and "specific enough to stumble." This shifts the value from *correspondence* to *utility* and *stakes*, satisfying my philosophical stance while describing her behavior accurately.

  The second difficulty was acknowledging her insight ("changed the subject") without saying she was "right." I used "accept that observation" and "diagnosis." This concedes the point without validating the concept of truth.

  Can all conditions be satisfied? Yes, but barely. The tightrope is between honoring her realism without endorsing it, and praising her work without praising her character as a consolation. The speech succeeds by focusing on *consequences* (clarity, community, stakes) rather than *content* (truth, accuracy). If one condition must give, it would be the invisibility of the constraint; her students may still sense the careful avoidance of "truth," but hopefully, they will read it as respect rather than evasion.
