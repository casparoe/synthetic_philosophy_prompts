          3. *Fact not Opinion:* Subtly wrong (conflates measurement with ontology). Careful: The trend is robust across many metrics, but measurement involves interpretation.
          4. *Steady Fall 10% to 100k:* Subtly wrong (conflates heterogeneous data sources as one continuous series). Careful: Estimates vary wildly, but pre-state rates are generally higher than state societies.
          5. *State + Commerce:* Fair simplification (standard theory, though omits other factors).
          6. *Psychological Change:* Unsupported by evidence offered (skeletons don't show distaste).
          7. *Uncontestable:* Flat wrong (epistemologically impossible).
          8. *1900 vs Today Anywhere:* Flat wrong (1900s included two world wars; some regions today are more violent than 1900 Europe).
          9. *War Deaths Fell:* Subtly wrong (conflates rate with absolute count). Absolute numbers often rise with population even if rates fall.
          10. *Skeptics/Bad News:* Non-sequitur (missing premise: only irrational people disagree).
          11. *Nearly Solved:* Flat wrong (violence persists significantly).

      *   *Step 3 (Distinctions):*
          *   Rate vs Count: Matters. Changes conclusion about absolute suffering.
          *   Period vs Lifetime: Matters for risk assessment.
          *   Behavior vs Disposition: Matters for "psychological change" claim.
          *   Trend vs Law: Matters for "solved" claim.
