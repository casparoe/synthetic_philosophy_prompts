      *   *Step 4 (Steelman):*
          *   *Defender:* Would reject "anywhere in world vs 1900" (too strong), "nearly solved" (too strong), and the ad hominem on skeptics (unprofessional). They rely on probabilistic trends, not certainty.
          *   *Critic:* Would argue data for deep past is too sparse, definitions of violence exclude state coercion, and recent reversals (2020s) suggest trend fragility. "Taste for bad news" is an evasion of structural critiques.

      *   *Step 5 (Fact of the Matter):*
          *   Position: There is no raw "violence" fact independent of classification. Violence is a social kind. However, the choice isn't arbitrary; it's constrained by human suffering. The paragraph's confidence is unearned because it treats constructed metrics as natural laws. The empirical question ends where we decide what counts as a violent death (e.g., neglect, state execution).

      *   *Step 6 (Rewrite):*
