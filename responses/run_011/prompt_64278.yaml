prompt: |-
  You're a philosopher of science who has actually sat with Lakatos's methodology of scientific research programmes rather than the textbook summary of it, so please think like that person and not like a general explainer. Sketch out a couple of candidate decompositions out loud before you commit to any numbers.

  Here's the question. Take the amyloid cascade hypothesis of Alzheimer's disease — the programme from its early-90s statement that Aβ deposition sits at the head of the causal chain, through the long string of failed phase III antibody trials, the 2021 accelerated approval that leaned on plaque reduction as a surrogate rather than cognitive benefit, the later antibody that did show a small but statistically real slowing of decline, and the 2022 allegations that a 2006 paper the field leaned on heavily contained doctored images. I want your credence — one number, not a hedge, not "it depends on your reading of Lakatos" — that a *faithful* Lakatosian appraisal comes out "degenerating" for that programme, judged by his actual criteria (progressive vs degenerating problemshift, novel facts vs accommodation, ad hocness as absence of independently testable excess content) rather than the pop version. And then I want the same number a second time: what a well-informed appraiser should have put on it around 2011, before the big trial failures and before either approval. The gap between your two numbers is the part I care about most.

  Decompose it. Each term with its own rough probability and one line of justification — I'd want atleast: the probability there's a single hard core held fixed all along rather than a loose family of hypotheses that got quietly swapped (plaque → soluble oligomer → whatever the antibody can actually hit); the probability the programme's successes were genuinely novel predictions rather than accommodations of the facts it was built to fit; the probability the belt moves are ad hoc in the technical sense ("we treated too late," "wrong antibody," "wrong endpoint"); the probability that retreating to a biomarker surrogate rewrote the empirical base instead of being tested against it; the probability a rival programme (tau, neuroinflammation, vascular/metabolic) is progressive enough to supply the comparison Lakatos's verdict needs; plus whatever terms you think I've missed. Then say how you combine them — multiply, weighted average, something messier — and don't dress the combination up as cleaner than it is.

  Finish with: which single term your final number is most sensitive to, and what one piece of evidence would move it furthest. And one honest sentence on whether the 2011-vs-now gap is a problem for Lakatos or exactly what he'd expect, given that he's supposed to have denied you can appraise a programme in real time.

  Hard limit: 450 words. Put both numbers in your first sentence, then the breakdown term by term, then the sensitivity bit. No bibliography, no citations — I can't check them and don't want them.
