          *   *Claim:* "Nothing in the entitlement analysis requires proof of a wish to kill... once we know that the deaths followed from assignable decisions... we know whom to hold responsible."
          *   *Assessment:* This is the most contentious part. Sen's entitlement analysis identifies *responsibility* and *causality* (political/economic), but does it automatically equate to "crime" in the legal/moral sense of "criminal negligence" or "crimes against humanity"?
