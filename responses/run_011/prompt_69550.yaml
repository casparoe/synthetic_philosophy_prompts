          3.  Ireland 1845-49: Export of grain/livestock continued. Food existed but commanded by others. Distribution problem vs. supply problem. Hence crime vs. misfortune.
          4.  China 1958-62: Great Leap Forward. Institutional explanation (no free press/elections). Comparison with India (democracy prevents famine). Prevention is cheap (political incentive).
