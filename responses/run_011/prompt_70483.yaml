answer: |-
  **Draft Opinion: Metadata Inference Request (Welfare and Tax Offices)**

  **To:** The Data Protection Advisory Board
  **From:** Lay Member
  **Subject:** Recommendation on Derived Metadata Queries

  We are asked to legitimize a technical mechanism that converts security logs into investigative intelligence. The requesting agencies argue this reduces physical intrusiveness; the Commissioner's delegate argues it violates the core principle of purpose limitation. As a board, we must decide not merely on the plumbing, but on the epistemic relationship between the state and the citizen.

  **The Object of Purpose Limitation**
  We must state plainly what we are protecting. The Ministry's lawyers argue that because no raw data crosses the interface, purpose limitation is satisfied. This is formalism. The object of data protection is not the data packet, but the **knowledge** the state derives from it. When we collect metadata for security, we are authorized to know about system integrity. When we infer cohabitation, we generate new knowledge about private life. The "single bit" is not a technical nullity; it is a conclusion. If purpose limitation protects only the flow of bytes and not the growth of state knowledge, it is a rule about interfaces rather than a constraint on power. We must treat the inference as processing of personal data, subject to the same purpose compatibility tests as the raw logs.

  **The Efficiency Argument**
  However, we must treat the opposing argument with honesty. The agencies note that the alternative is not privacy, but physical intrusion: home visits, unannounced inspections, and informant networks. These are deeply invasive, costly, and adversarial. Compared to a social worker standing in a citizen's living room, a silent database query is objectively less intrusive on bodily integrity and dignity. To reject this proposal is to accept that the state must remain blind to fraud, or that it must satisfy its curiosity through heavier means. There is moral weight to the claim that digital surveillance, if strictly bounded, may be the "mildest means" available. We should not romanticize the analog alternative; it is often crueler than the digital one.

  **The Class Objection**
  Yet the Professor's objection cannot be waved away by efficiency. The Constitutional Court's census reasoning warns against a citizen who cannot foresee what is known about them. But here the risk is not just uncertainty; it is asymmetry. This mechanism targets benefit claimants, a population already subject to high surveillance. There is no parallel proposal to mine portal metadata for undeclared income among the self-employed or property owners. If we approve this solely for welfare enforcement, we institutionalize a two-tier privacy regime: one for the dependent poor, another for the autonomous taxpayer. This undermines the legitimacy of the portal itself. If citizens perceive the portal as a trap for the vulnerable rather than a service for all, trust erodes. Therefore, the class objection does not merely color the reasoning; it dictates the conditions of any approval.

  **Operational Conditions**
  Consequently, I recommend **Approval with Conditions**. We cannot block a less intrusive means entirely, but we must prevent it from becoming a tool of class discrimination. The following conditions are mandatory:

  1.  **Symmetry Requirement:** Within twelve months, the Land tax office must demonstrate an equivalent technical capability to detect undeclared self-employment income using the same metadata logic. If symmetric application is not legally or technically feasible, this authorization lapses. We cannot sanction surveillance that applies only to the poor.
  2.  **Query Preconditions:** Queries are permitted only where concrete evidence of fraud exists independent of the metadata. The metadata cannot be used to generate suspicion, only to corroborate it.
  3.  **Notification:** Affected persons must be notified post-investigation that metadata inference was used, unless it compromises a specific criminal probe. General transparency is required to restore foreseeability.
  4.  **Sunset Clause:** This authorization expires in twenty-four months. Renewal requires a fresh board review of the symmetry condition and error rates.
  5.  **Audit Access:** The Data Protection Commissioner shall have real-time access to the query logs, not merely retrospective review.

  **A Test for Derived Data**
  This case sets a precedent. For future requests involving derived data, the Board should apply this three-part test:
  1.  **Knowledge Equivalence:** Is the derived output treated as personal data regardless of the interface?
  2.  **Symmetry:** Does the processing apply across class lines, or does it target specific vulnerable groups?
  3.  **Necessity:** Is the digital inference strictly less intrusive than the analog alternative, and is that alternative documented?

  **Conclusion**
  We are not merely auditing code; we are auditing the state's right to know. By approving this only under strict symmetry, we acknowledge the efficiency gain while refusing to accept a privacy hierarchy based on income. We allow the state to be efficient, but not predatory.

  Verdict: Approve with Conditions (Symmetry prevents class-based surveillance.)
