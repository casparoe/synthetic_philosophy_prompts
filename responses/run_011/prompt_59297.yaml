answer: |-
  Let's map the terrain of Hailsham before we bring in the philosophers. On the surface, the boarding school operates as a hermetic artworld. The guardians act as critics and instructors, ranking the students' drawings and poems not merely for effort but for quality, creating a hierarchy of aesthetic value. This value is literalized in the Exchanges, a functioning market where students trade tokens for peer-created work, establishing a currency of taste. Madame serves as the curator, selecting the "best" pieces for her Gallery, a museum space hidden from the students but central to the school's mythology. Tommy's struggle is the struggle of the unrecognized avant-garde; his animal drawings are rejected not for lack of effort but for failing to conform to the prevailing style of the Hailsham aesthetic. The late reveal, however, ruptures this ecosystem. The Gallery was not a museum for public appreciation but an archive for anthropological proof. The art was never intended to be beheld as art by the outside world; it was evidence submitted to a hostile public to demonstrate that clones possessed souls. The drawings were specimens, not artworks, and the Gallery was a laboratory, not a museum.

  This creates a fascinating friction with Institutional Theory. If we follow Danto or Dickie, art is defined by the context of the artworld and the conferral of status by authorized agents. Hailsham fits this blueprint perfectly. The guardians confer status, the Exchanges create a market, and Madame curates the collection. By Dickie's lights, the drawings *are* art because the institution says they are. Yet, the novel treats this classification with profound irony. The institution is a sham, or at least a desperate defense mechanism. The "artworld" is isolated, and the "outside" world—the ultimate arbiter in Danto's broader sense—refuses to accept the conferral. They see the drawings not as artworks to be interpreted, but as biological data to be verified. If the audience receives the object as evidence rather than expression, does the Institutional definition hold? Ishiguro seems to suggest that an artworld cannot sustain itself in a vacuum of moral recognition. The theory says yes, it is art; the novel suggests that without a receptive humanity, the status is hollow.

  This brings us to your hunch regarding Tolstoy. In *What Is Art?*, Tolstoy argues that art is not about beauty or form, but about the infection of feeling: one person consciously transmits a feeling to another through external signs. The scene where Madame discovers Kathy dancing to the Judy Bridgewater tape is the novel's emotional apex. There is no institution here. The tape is mass-produced kitsch, the pillow is a prop, and the setting is a private room. Yet, Madame is "infected." She weeps not because the performance is technically proficient, but because she perceives the longing and humanity radiating from it. If we accept your reading, this is the only moment of "real" art in the book. The Gallery, by contrast, becomes the villain—a bureaucratic attempt to quantify the unquantifiable soul, turning expression into evidence. It creates a stark dichotomy: the Institutional theory governs the oppressive Gallery, while Tolstoy's expression theory governs the liberating moment of the dance.

  However, I would push back on the idea that the Gallery is purely villainous or that the dance is the *only* artistic moment. The Gallery was an attempt to save lives. It operated on the hope that aesthetic production could bridge the moral gap between human and clone. Its failure is a failure of the viewers, not necessarily the theory. Furthermore, relying solely on the Tolstoyan moment ignores the historical definition proposed by Levinson. Levinson argues that art is something intended to be regarded in any way prior artworks were regarded. The Hailsham students fail this test miserably; they are cut off from art history. They have no "prior artworks" to reference. Tommy's frustration stems from this void; he doesn't know *how* to make art because he doesn't know what art *is* historically. If Levinson is right, the Hailsham drawings cannot be art because they exist outside the tradition.

  But here is where your reading might break, and where the novel saves itself: Kathy's narration. You suspect the book itself cuts against your Tolstoyan hunch, and you are right. Kathy is not just a witness; she is a creator. In writing her memoir, she is doing what the Gallery could not. She is curating her own life, selecting memories, and framing them for an audience. Crucially, she fulfills Levinson's condition where the students could not. Kathy has read books, heard stories, and absorbed culture. When she narrates her life, she intends for us to regard it in the light of prior tragedies, prior memoirs, and prior human testimonies. The novel *Never Let Me Go* is the artwork that the Gallery failed to be. It takes the "specimens" of Hailsham and re-contextualizes them as a human story. Kathy transforms the evidence into expression. She creates the historical context that Hailsham lacked. Therefore, the art isn't just the dance (Tolstoy) or the drawings (Institutional); it is the act of testimony itself.

  So, what does this contribute to the definitional debate that a standard argument from Weitz or Beardsley cannot? Weitz argues that art is an open concept, undefinable by necessary and sufficient conditions. Beardsley focuses on aesthetic experience. Both are abstract. Ishiguro grounds the definition of art in ethical stakes. In standard philosophy, getting the definition wrong means a bad theory. In *Never Let Me Go*, getting the definition wrong means death. If the drawings are merely specimens, the clones are hardware. If they are artworks, they are souls. The novel suggests that the definition of art is not a metaphysical puzzle but a political tool. It exposes the violence inherent in curation. The Gallery treats the clones as objects to be collected, whereas Kathy's narration treats them as subjects to be heard.

  Ultimately, the novel suggests that the Institutional theory is dangerous if the institution is predatory, and Tolstoy's infection is fragile if the receiver (Madame) is complicit in the system. The most robust definition emerging from the text is a hybrid: art is the act of reclaiming one's narrative from the institution that seeks to define it. The Hailsham drawings were potential art trapped in an evidentiary framework. Kathy's story is actual art because it breaks that framework. For your session, this moves the debate beyond "is it art?" to "who does the defining, and at what cost?" Ishiguro teaches us that art definitions are never neutral; they are the borders of our moral community. The novel doesn't solve the philosophical problem, but it raises the stakes high enough that we can no longer afford to treat it as a mere academic exercise.
