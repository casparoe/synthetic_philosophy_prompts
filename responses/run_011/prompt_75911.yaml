      *   **Format:** One essay question, 45 minutes, 20 marks. Needs a model answer (~650 words) and a detailed marking scheme.
      *   **Content Focus:** Avoid the simplistic "Augustine says lying is always wrong." Focus on the tension between internal intent vs. external action, the definition of lying (speaking against one's mind), the permissibility of concealment/silence vs. assertion, the ranking of lies vs. sinfulness, and specific cases (midwives/Rahab, Priscillianists).
      *   **Specific Constraint:** The user wants the question to force an explanation of how Augustine holds together the distinction between asserting falsehood and concealing truth, especially when the external effect is the same. Bonus if it asks whether the line holds up.
      *   **Constraint:** No reading list or citations (user can't check them).
      *   **Constraint:** If the user's reading is wrong, correct them straight.
      *   **Tone:** Respectful, accessible but rigorous, suitable for a community group (not overly academic jargon, but philosophically precise).

  2.  **Evaluate the User's Reading of Augustine:**
      *   *Claim:* "On his definition it seems you can lie while saying something completely true, and you can say something flatly false and not be lying at all, if your heart and your mouth don't match up."
          *   *Verification:* Correct. Augustine defines lying as speaking against one's mind (*enuntiatio contra mentem*). If I say something true believing it false, I lie. If I say something false believing it true, I do not lie (though I may be mistaken).
      *   *Claim:* "Nobody can ever tell from the outside whether you lied."
          *   *Verification:* Correct. This is a key implication of the internalist definition.
      *   *Claim:* "He seems totally fine with just shutting up, or hiding the truth, or steering someone off the question... hiding it usually does exactly the same damage to the person as telling them a falsehood would."
          *   *Verification:* Correct. Augustine distinguishes between *suppressio veri* (suppressing truth) and *suggestio falsi* (suggesting falsehood). He allows the former in some contexts (though warns against it), but forbids the latter absolutely. The user's critique (same damage) is a standard objection.
      *   *Claim:* "Midwives in Exodus and Rahab were rewarded for being merciful and not for the lie itself."
          *   *Verification:* Correct. Augustine struggles with these biblical cases. He argues the reward was for their benevolence/faith, not the lie, which remains a sin (venial or otherwise).
      *   *Claim:* "Ranks lies from worst to least bad but then says even the least bad one is still a sin."
          *   *Verification:* Correct. There are 8 types of lies in *On Lying*. Some are grievous, some less so, but all are sins.
      *   *Claim:* "Priscillianist business... Augustine wouldn't let his own people lie to catch them... looks like he'd rather let the bad guys win."
          *   *Verification:* Correct. In *Against Lying* (to Consentius), Augustine argues against using lies to catch heretics (Priscillianists), even for a "good" outcome (exposing them). He prioritizes the integrity of the soul over external outcomes.
      *   *Overall:* The user's reading is surprisingly accurate and hits the core philosophical tensions. No major corrections needed, just validation.

  3.  **Drafting the Question:**
