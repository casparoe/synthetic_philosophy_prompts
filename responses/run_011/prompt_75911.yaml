answer: |-
  First, straight answer on your reading: **You have not got the wrong end of the stick.** Your grasp of the tension is spot on. Augustine really does define lying as an internal mismatch (heart vs. mouth) rather than an external falsehood. He really does allow concealment while forbidding assertion, even if the outcome is identical. And he really does argue that using a lie to catch heretics corrupts the catcher more than it helps the cause. You've identified the exact pressure points in his argument. You're ready to test them on it.

  Here is your exam package.

  ***

  ### The Exam Question

  **Context:** Augustine defines a lie not as saying something false, but as saying something you *believe* to be false. This means you can speak the truth but still lie (if you think it's false), and you can speak falsehoods without lying (if you think they are true). Because of this, Augustine argues there is a major difference between *asserting* a falsehood and merely *concealing* the truth (by staying silent or changing the subject). He applies this when discussing biblical figures like the midwives who lied to Pharaoh, and when arguing against using lies to trap heretics.

  **Question:**
  **Explain why Augustine insists on a strict difference between "lying" and "concealing the truth," even when both actions might mislead someone equally. Use his treatment of biblical figures or heretics to illustrate his point. Finally, do you think this distinction holds up, or does it simply move the problem elsewhere? (45 minutes, 20 marks)**

  ***

  ### Model Answer (Approx. 650 words)

  For Augustine, the sin of lying is not about damaging the listener, but about damaging the soul of the speaker. This is why his definition focuses entirely on the internal state of the person speaking. To lie is to speak against your own mind. If you say something false but believe it is true, you are mistaken, not a liar. If you say something true but believe it is false, you are a liar. Because the sin is located in the intention to deceive rather than the factual error, Augustine draws a hard line between asserting what you know is false and simply hiding what you know is true.

  This distinction allows Augustine to navigate difficult cases where total honesty seems dangerous. He argues that while we must never assert a falsehood, we are not always obligated to reveal the whole truth. We can remain silent, or we can speak ambiguously. In his view, this preserves the integrity of the speaker's soul because they are not actively willing a falsehood, even if the listener ends up confused. The damage to the listener is secondary; the primary command is to keep your own heart aligned with truth.

  We see this struggle in how he handles the biblical midwives who lied to protect Hebrew babies. Augustine cannot say they did nothing wrong, because lying is always a sin. Instead, he argues they were rewarded by God for their mercy and their faith, not for the lie itself. The lie remains a sin, perhaps a venial one, but their good intention mitigates the punishment. Similarly, when discussing whether Catholics should lie to infiltrate and expose heretics (like the Priscillianists), Augustine says no. He argues that using a lie to catch a liar corrupts the Catholic soul. It is better to let the heretics hide than to destroy your own integrity by pretending to be one of them. For Augustine, the spiritual health of the community depends on everyone keeping their internal truth intact, even if it means losing a tactical advantage against evil.

  However, this distinction faces a serious problem when we look at the consequences. Augustine's system relies on the idea that concealing truth is morally different from asserting falsehood. But from the perspective of the person being misled, the result is often identical. If I hide a fugitive in my house and tell the pursuer "I haven't seen them" (a lie), versus saying "I am not telling you" (concealment), the pursuer is misled in the first case and suspicious in the second. But if I say something ambiguous that leads them to the wrong conclusion, I have achieved the same outcome as a lie without technically lying.

  This suggests Augustine might be moving the problem rather than solving it. He protects the speaker's soul by focusing on their internal intention, but he ignores the fact that deliberate concealment is often just a polite form of deception. If the goal of morality is also to love our neighbour, misleading them through silence can be just as harmful as misleading them with words. Augustine would reply that God judges the heart, not the outcome, so we are only responsible for our own integrity. But this makes his ethics very self-focused. It allows a person to keep their hands clean while still allowing harm to happen through omission.

  In conclusion, Augustine's distinction holds up logically within his own system: if lying is defined as speaking against your mind, then silence is not lying. But morally, it is shaky. It prioritizes the purity of the speaker over the safety of the listener. While this protects the community from becoming like the heretics they fight, it risks making honesty a technicality rather than a commitment to genuine communication.

  ***

  ### Marking Scheme (20 Marks Total)

  **1. The Definition of Lying (4 Marks)**
  *   **4 marks:** Clearly states that for Augustine, lying is internal (speaking against one's mind/belief), not external (saying what is factually false).
  *   **2 marks:** Mentions belief/intent but gets the definition slightly muddy (e.g., implies false statements are always lies).
  *   **0 marks:** Defines lying simply as telling a falsehood.

  **2. The Concealment Distinction (4 Marks)**
  *   **4 marks:** Explains that Augustine permits silence/ambiguity/concealment because it doesn't involve asserting what one believes false.
  *   **2 marks:** Mentions concealment is allowed but doesn't explain *why* (missing the link to internal intent).
  *   **0 marks:** Claims Augustine forbids all deception including silence.

  **3. Use of Examples (4 Marks)**
  *   **4 marks:** Correctly uses the Midwives/Rahab (rewarded for mercy, not lie) OR the Heretics/Priscillianists (don't lie to catch them) to show how he applies the rule.
  *   **2 marks:** Mentions an example but gets the lesson wrong (e.g., says Augustine approved of the midwives' lie).
  *   **0 marks:** No examples used.

  **4. Critical Evaluation (6 Marks)**
  *   **6 marks:** Explicitly assesses whether the distinction holds. Argues that while it works internally for Augustine, it fails externally because concealment causes similar harm/outcomes. (Must engage with the "moving the problem" idea).
  *   **4 marks:** Offers a critique but it is vague (e.g., "it seems harsh") without addressing the concealment vs. assertion tension.
  *   **2 marks:** Only summarizes Augustine's view without offering any critique or assessment.
  *   **0 marks:** No evaluation provided.

  **5. Clarity and Structure (2 Marks)**
  *   **2 marks:** Essay is easy to follow, paragraphs are logical, fits the time limit scope.
  *   **1 mark:** Disorganized but readable.
  *   **0 marks:** Incoherent or significantly too short.

  ***

  ### Grading Guide: A vs. B Answers

  **The "B" Answer (12–15 marks):**
  *   **What they do:** They explain Augustine's definition correctly. They understand that you can lie while telling the truth. They mention the midwives or heretics correctly.
  *   **Where they stop:** They tend to accept Augustine's distinction as sensible. They might say, "Augustine thinks silence is okay because it isn't a lie," without questioning whether silence is actually deceptive. They treat the exam as a test of memory rather than thought.
  *   **Key marker:** They explain *what* Augustine thinks, but not *why it might be a problem*.

  **The "A" Answer (16–20 marks):**
  *   **What they do:** They do everything the "B" answer does, but they push harder on the **Critical Evaluation** section. They point out that from the outside, a clever silence looks exactly like a lie. They notice that Augustine is protecting the speaker's soul at the expense of the listener's safety.
  *   **The Move:** They explicitly state that Augustine's definition makes lying undetectable to anyone but God, which makes social trust difficult. They engage with your prompt's idea that he might be "moving the problem."
  *   **Key marker:** They argue *with* the text, not just *about* it.

  ### Common Mistakes (Deduct Marks)
  *   **The "Falsehood" Trap:** If they write "Augustine says lying is saying something false," deduct 4 marks immediately (Section 1). This misses the whole point of the reading.
  *   **The "Biblical Approval" Trap:** If they write "Augustine says the midwives did the right thing by lying," deduct 2 marks (Section 3). He says they did the right thing by being merciful, but the lie was still a sin.
  *   **The "Kant" Trap:** If they treat Augustine like a modern rule-follower who cares only about outcomes, deduct marks in Evaluation. Augustine cares about the *state of the soul*, not just rule-following.
  *   **Ignoring the Prompt:** If they write a general essay on "Why Lying is Bad" without addressing the concealment distinction, cap the score at 10 marks.
