      *   *Refinement:* Make it more specific to the texts mentioned (midwives, Priscillianists) to ground it.
      *   *Final Polish:* "Augustine argues that lying is always a sin, but concealing the truth is sometimes permitted. Based on his definition of lying as 'speaking against one's mind,' explain why he draws this line. Use his treatment of biblical figures (like the midwives) or heretics (like the Priscillianists) to illustrate. Finally, assess whether this distinction holds up when the harm caused to the listener is the same."

  4.  **Drafting the Model Answer:**
      *   *Word Count:* Around 650 words.
      *   *Structure:*
          1.  Define lying (internal state vs. external fact).
          2.  Explain the concealment loophole (silence/ambiguity).
