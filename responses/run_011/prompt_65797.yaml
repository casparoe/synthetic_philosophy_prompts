answer: |-
  Good morning. Thank you for coming. For those who didn't know him well, my father was an actuary. He spent his life calculating risk. He knew the odds of almost everything. I think he assumed he'd have more time to explain the final calculation, but he didn't. He left us with the numbers instead.

  Most of you know the shape of this by now. He left the estate to a fund. He left us, his three kids, four thousand dollars each. He left a note saying he wasn't sorry.

  I know what some of you are thinking. I know what my brother is thinking. It isn't about the four thousand dollars. You can't spend a lifetime being someone's child and then be told you count the same as a stranger without feeling a shift in the ground. My brother is angry because he thinks a father's job is to choose his own children. He thinks that if you have to think about whether to choose them, you've already lost something. He's allowed to feel that. He's allowed to think something real was missing from the end of this story. I'm not going to tell him he's wrong to feel that weight.

  And I know what my sister is thinking. She sees the good that money will do. She sees the discipline it took to live simply so others could live at all. She sees a man who refused to treat his own comfort as more important than a stranger's survival. She's not wrong either.

  So I am standing here holding two things that don't fit together neatly.

  Because he wasn't cold. That's the thing I keep coming back to. He didn't give the money away because he didn't care about us. He drove forty minutes each way, twice a week, for six years, to coach my swim team. I was bad at swimming. I was objectively bad. There was no efficiency gain there. He just showed up. He knew our schedules. He knew our friends' names. He knew which dog slept at the foot of which bed. He was warm right here. He gave the estate away anyway.

  I do not have a clean account of how those two things fit together. I've looked for the formula. I've tried to write the sentence that makes the coach and the donor the same person without leaving a piece out. I can't do it. Maybe he didn't either. Maybe he just lived in the tension of it.

  People talk about giving like this in two ways. Some say, "If everyone did this, the world would be fixed." Others say, "If everyone did this, no one would have anyone looking out for them." Both of those statements are true. A world where everyone gave like this would be a miracle. A world where no one protected their own would be a disaster. My father lived in the narrow space between those truths. He protected us. He loved us. And then he let go of the money.

  I'm not going to tell you he wants you to do the same. I don't know what he wants for you. I'm not going to tell you this is the right way to be good. I don't know if there is one right way.

  What I know is that he was specific. He was particular. He loved specific things and specific people. He loved this family enough to be here for the bad swim meets, but he loved the world enough to leave the money behind. It is a lot to ask of a man to carry both of those loves at full weight. He carried them.

  We are here to remember him. Not the will. Not the fund. Not the philosophy of it. We are here for the man who drove the forty minutes. The man who knew the dog's name. The man who made a choice that hurts us and helps others, and didn't ask us to forgive him for it.

  My brother can stay angry. My sister can stay grateful. I can stay confused. We don't have to solve him to miss him. He was our dad. He was complicated. He was here. And we are all worse off without him.

  Thank you.
