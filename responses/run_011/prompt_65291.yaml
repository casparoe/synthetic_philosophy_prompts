answer: |-
  # The Consciousness Fixation Decision Tree
  **For: Cog Sci 202 — Seminar on Temporal Anomalies**  
  **Purpose:** To sort theoretical commitments regarding *when* and *how* perceptual content becomes fixed, without presupposing the labels "Orwellian" or "Stalinesque."

  ### The Decision Nodes

  **Q1. In a forced-choice task time-locked to stimulus onset, does the motor output match the physical stimulus or the reported illusion?**
  *   **A. Physical Stimulus:** Go to Q2.
  *   **B. Reported Illusion:** Go to Q4.

  **Q2. If motor matches physical, does the concurrent verbal report match the motor output?**
  *   **A. Yes:** (Veridical Perception) — *Tree terminates: No illusion present.*
  *   **B. No:** Go to Q3.

  **Q3. Was the illusory content (the report) phenomenally experienced by the subject, or only spoken?**
  *   **A. Only Spoken:** **Leaf 1: The Lying Mouth.**
  *   **B. Phenomenally Experienced:** **Leaf 2: The Ghost in the Motor.**

  **Q4. Is the illusory content available to *any* cognitive subsystem (e.g., priming, attentional capture) before the verbal report is generated?**
  *   **A. Yes:** Go to Q5.
  *   **B. No:** Go to Q6.

  **Q5. Is that pre-report availability accessible to the subject's phenomenology (what it feels like) at that time?**
  *   **A. Yes:** Go to Q7.
  *   **B. No:** **Leaf 3: The Show-Trial.**

  **Q6. Is the content constructed only at the moment of report, with no prior stable trace?**
  *   **A. Yes:** **Leaf 4: The Post-Hoc Constructor.**
  *   **B. No:** Go to Q7.

  **Q7. Is there a specific neural latency $t$ after which the content cannot be altered by subsequent stimuli?**
  *   **A. Yes:** Go to Q8.
  *   **B. No:** **Leaf 5: The Streamless Flow.**

  **Q8. If content is altered after $t$, is the original (pre-alteration) content ever phenomenally present to the subject?**
  *   **A. Yes:** Go to Q9.
  *   **B. No:** **Leaf 3: The Show-Trial.** (Revision happened before entry).

  **Q9. If the original content was present, is the revision stored in the memory trace itself or only in the narrative translation?**
  *   **A. Memory Trace Falsified:** **Leaf 6: The Ministry of Truth.**
  *   **B. Narrative Only:** **Leaf 1: The Lying Mouth.**

  **Q10. In the false-feedback control (subject told "equipment glitched"), does the subject's *recall of the sensation* change, or only their *confidence in the story*?**
  *   **A. Sensation Recall Changes:** **Leaf 6: The Ministry of Truth.**
  *   **B. Confidence Only:** **Leaf 1: The Lying Mouth.**

  **Q11. Is the subject a reliable witness to the temporal order of their own neural events?**
  *   **A. Yes:** (Requires Naive Realism — *See Empty Combinations*).
  *   **B. No:** Go to Q12.

  **Q12. Is there a fact of the matter about "when" the experience occurred independent of reporting?**
  *   **A. Yes:** (Return to Q7/Q8).
  *   **B. No:** **Leaf 5: The Streamless Flow.**

  ---

  ### The Leaves (Theoretical Commitments)

  1.  **The Lying Mouth (Veridical Experience/Confabulated Report)**
      *   *Core Claim:* The experience was accurate; the verbal report is an unconscious confabulation.
      *   *Awkward Cost:* You must explain why the mouth lies while the body (or memory) tells the truth, without the subject knowing they are lying.
  2.  **The Ghost in the Motor (Unconscious Leakage)**
      *   *Core Claim:* The pre-revision content drives behavior but never enters consciousness; the conscious experience is the revised version.
      *   *Awkward Cost:* You must defend a notion of "consciousness" that is causally inert regarding the motor response that triggered the inquiry.
  3.  **The Show-Trial (Delayed-Entry/Stalinesque)**
      *   *Core Claim:* All editing is completed before the content enters the "theater" of consciousness.
      *   *Awkward Cost:* You must posit a hidden delay where the brain waits for late-arriving data before letting the subject "see" anything, risking reaction-time penalties.
  4.  **The Post-Hoc Constructor**
      *   *Core Claim:* Experience is not a continuous stream but generated on-demand at the moment of interrogation.
      *   *Awkward Cost:* You deny the intuitive continuity of experience, suggesting the "now" is always a memory masquerading as perception.
  5.  **The Streamless Flow (Deflationary/No-Privileged-Moment)**
      *   *Core Claim:* There is no single time $t$ where content becomes fixed; "consciousness" is a fuzzy functional status.
      *   *Awkward Cost:* You dissolve the hard problem by denying there is a single thing called "consciousness" to have a problem about.
  6.  **The Ministry of Truth (Unpersoned-Memory/Orwellian)**
      *   *Core Claim:* The subject consciously experiences the original, but the memory is rewritten so thoroughly they believe the revision.
      *   *Awkward Cost:* You must explain how a subject can be phenomenally certain of a past that never phenomenally existed for them.

  ---

  ### Case Adjudications

  **1. Color Phi (Red/Green Dot Illusion)**
  *   **Path:** Q1(B: Illusion) → Q4(A: Available) → Q5(A: Phenomenal) → Q7(Debatable) → Q8(A: Original Present?).
  *   **Result:** **Ambiguous between Show-Trial and Streamless Flow.**
  *   *Note:* Without motor data (Q1), we cannot rule out that the integration happened before awareness (Show-Trial). Dennett argues for **Streamless Flow**, claiming the question "when did they see it?" has no answer. Classical cog sci often defaults to **Show-Trial**.

  **2. Forearm Tapping Illusion**
  *   **Path:** Identical to Color Phi.
  *   **Result:** **Ambiguous between Show-Trial and Streamless Flow.**
  *   *Note:* Spatial interpolation suggests processing time. If the interpolation requires neural computation time that exceeds the stimulus onset, **Show-Trial** is favored unless one adopts **Streamless Flow**.

  **3. Custom Lab Case (Motor = Jump 3, Report = Pos 2)**
  *   **Path:** Q1(A: Physical) → Q2(B: No) → Q3.
  *   **Result:** Depends on Q3.
      *   If subject *felt* the dot at Pos 2: **Leaf 2 (Ghost in the Motor)**. The motor system saw the truth; consciousness saw the lie.
      *   If subject *said* Pos 2 but felt Jump 3: **Leaf 1 (Lying Mouth)**.
  *   *Control Case (False Feedback):* If they report smooth motion after being told of a glitch:
      *   Path: Q10. If *sensation recall* changes → **Leaf 6 (Ministry of Truth)**. If only *confidence* changes → **Leaf 1 (Lying Mouth)**.
      *   *Missing Node Check:* The tree *can* say, provided Q10 is asked. If you only ask for the report without probing the quality of the memory trace, you cannot distinguish Ministry from Lying Mouth.

  ---

  ### Structural Limitations & Empty Logic

  **Indistinguishable Leaf Pairs**
  1.  **Show-Trial vs. Streamless Flow:** If "consciousness" is defined operationally by report (Q1), and no motor dissociation is found, these are empirically identical. One posits a hidden delay; the other posits no fact of the matter.
  2.  **Ministry of Truth vs. Lying Mouth:** Distinguishing a falsified memory trace from a confident confabulation requires intrusive neural monitoring or hypnosis-like probing (Q10). Standard introspection cannot separate them.
  3.  **Ghost in the Motor vs. Lying Mouth:** Both predict Motor=Real/Report=Fake. They differ only on whether the illusion was *felt*. If the subject is unreliable (Q11), these collapse.

  **Logically Available but Empty Combinations**
  *   **"Conscious, Fixed, Then Rewritten in Experience"**: *Incoherent.* If content is "fixed" for experience, it cannot be rewritten *in* experience without becoming a new experience.
  *   **"Motor Matches Illusion, Report Matches Physical"**: *Merely Unattractive.* Implies high-level speech is more veridical than low-level reflex, contradicting known neural hierarchy speeds.
  *   **"Subject is Reliable Witness to Neural Timing"**: *Empirically False.* Psychophysics consistently shows subjective timing is post-hoc constructed (Q11).
  *   **"Pre-Revision Content is Conscious but Causally Inert"**: *Unattractive (Epiphenomenalism).* Defended by few, as it renders the initial consciousness evolutionarily useless.
  *   **"No Fact of the Matter, But Memory is Falsified"**: *Incoherent.* If there is no fact of the matter (Streamless), there is no "original" memory to falsify (Ministry).

