answer: |-
  Your setup is coherent; nothing requires correction.

  *   (a) The speech cannot claim that technical expertise grants decision-making authority or that safety is purely a scientific question devoid of political judgment.
  *   (a) It cannot pretend this assembly is a perfect demographic mirror or that the government's initial framing of the sites is beyond our critique.
  *   (a) It cannot imply there is a single correct political answer waiting to be discovered like a physical constant.
  *   (b) It must concede that expertise is context rather than currency, and that the selection bias toward those who answer their mail is real and material.
  *   (b) It must concede we start with zero authority; legitimacy is generated by our conduct here, not by our appointment letters.
  *   (c) The sampling analogy breaks at the objective: Monte Carlo finds a pre-existing value, but we create a new judgment. I will mark this distinction with "measuring versus making." The sentence intended for the reporter is: "We have exactly as much authority as our process earns, and we haven't earned any yet at 9 a.m. on Saturday."

  Good morning. I spent thirty-five years measuring how fast radionuclides crawl through clay. I know the diffusion coefficients for fractured granite better than I know my neighbours. I mention this because you will find out soon enough, and I want to put it in a box. My knowledge is not irrelevant, but it does not entitle me to steer this room. If the expert talks first and sets the terms, this is not the room we were promised. I will share what I know when it helps, but I will not use it to win an argument. There is a real line between saying my knowledge is useless and saying it makes me boss. I intend to walk that line.

  Some of you have looked at the invitation and felt this is theatre. One of you wrote on the forum that the government wrote the question, picked the sites, and found a hundred people who happened to agree to show up. You called us a rubber stamp with catering. I understand the anger. The secretariat told me they sent invitations to twelve thousand addresses. About one in twelve of the people actually reached said yes. Then they balanced us for age and region. So let us be clear. We are not a mirror of the state. We are a mirror of the part of the state that answers its mail. A body which cannot state its own sampling error should not be trusted with anybody else's. But acknowledging the bias does not invalidate the work. It just means we must be careful not to pretend we are something we are not. We are not a parliament. We are not a poll. We are a group of strangers asked to think together.

  In my work, when you cannot solve an equation directly, you sample it at random. This is called Monte Carlo modelling. The reason it works is not that the individual draws are clever. It is that they are unbiased. Each one carries information about the whole in a way a hand-picked draw does not. The error shrinks at a known rate with the number of draws rather than with how smart the draws are. That is why we are here. You were not chosen because you are the best citizen. You were chosen because you were available. That randomness is our strength, not our weakness. It prevents any single interest from packing the room.

  But here is where my analogy stops, and it matters. A Monte Carlo estimate has a defined quantity it is converging toward. There is a right answer hidden in the math. Our job is not to converge on the correct opinion that already exists somewhere in the state or in the ministry. We are not measuring anybody. We are forming a judgment. There is no correct opinion waiting for us to find it. There is only the decision we make together. If we treat this like a measurement, we will fail. We are making something new.

  This brings us to why being picked is different from being elected. Nobody sent us. We have no mandate. There is no re-election, so there is nobody to perform for. You do not need to worry about losing your seat if you change your mind. But there is a harder, more honest flip side. We also cannot claim authority from having won anything. We have exactly as much authority as our process earns, and we haven't earned any yet at 9 a.m. on Saturday. [pause] If we produce a report that looks like it was written by the ministry staff in the gallery, we will have wasted our time and yours. If we produce a judgment that reflects six weekends of hard thinking, it will carry weight precisely because we owe nothing to anyone outside this room.

  So here is my promise. I will not bore you with physics unless you ask. I will not pretend the selection was perfect. I will work as hard as the baker and the forklift driver and the nurse. We have a difficult task. The waste exists whether we recommend a site or not. The risk is real. The trust is low. But we have a rare chance to do this properly. Let us earn the authority we were promised. Let us get to work.
