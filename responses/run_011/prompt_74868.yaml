      *   *Synthesis:* The distinction is not ontological (real goals vs. no goals) but *interventional* (can we fix this with reward vs. do we need architecture/audit?).
      *   *Final Verdict:* The user should fund the audits, but drop the claim that GMG is ontologically distinct from SG. Treat GMG as a *subclass* of SG that is resistant to reward engineering.

  9.  **Checking Constraints:**
