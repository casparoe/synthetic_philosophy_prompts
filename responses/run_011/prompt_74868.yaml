      *   *Camp 2 (SG/Goodhart)* focuses on the *principal-agent relationship*. They view the spec as the contract. If the agent fails out-of-distribution (OOD), the contract (spec + distribution) was incomplete. They are skeptical of "inner goals" as reified entities.
