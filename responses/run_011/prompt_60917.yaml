answer: |-
  Your roommate's argument is a sophisticated version of a very common mistake in moral psychology: conflating **descriptive breadth** (how many buttons get pushed) with **normative weight** (which buttons *should* matter).

  You are right to trust your instinct on (4)–(5). That is not "guilt by association"; it is a valid *reductio ad absurdum*. It demonstrates that the metric being used (counting foundations) has no internal limit. If the metric is "number of intuitive channels," then the person with the most channels wins. If "sacredness of the soil" counts as a channel, the nationalist wins. Since we reject the nationalist conclusion, we must reject the metric.

  Here is the breakdown of where the argument fails, why it looked plausible, and how to salvage the insight you want to keep.

  ### 1. Which step goes?
  **Step (1) is false.**

  > *(1) If one person's moral intuitions are responsive to a wider range of the considerations that actually matter morally, that person's moral judgments are likelier to be right.*

  This premise contains a hidden equivocation. It slides between two meanings of "considerations that actually matter morally":
  *   **Meaning A (Normative):** Considerations that are *objectively valid* reasons for moral judgment (e.g., suffering, rights, justice).
  *   **Meaning B (Psychological):** Considerations that *feel* like moral reasons to the person having them (e.g., disgust, deference, purity).

  Moral Foundations Theory (MFT) measures **Meaning B**. It maps psychological triggers. Your roommate's argument only works if he assumes that every psychological trigger measured by MFT corresponds to a **Meaning A** consideration.

  But that is exactly what is up for debate. To assume that "Sanctity" or "Authority" are *actually* morally relevant considerations simply because conservatives feel them is to beg the question. It assumes the conclusion (that conservative intuitions track truth) in the premise (that conservative intuitions track *considerations that matter*).

  ### 2. Why did it look fine when you first read it?
  Premise (1) borrows credibility from **epistemic virtue**. In almost every other domain of life, "considering more relevant evidence" makes you more likely to be right.
  *   If a doctor considers symptoms A, B, and C, they are likelier to diagnose correctly than a doctor who only considers symptom A.
  *   If a judge hears arguments from both sides, they are likelier to rule justly than a judge who hears only one.

  Your brain recognized this pattern: *More Input $\rightarrow$ Better Output.*

  The slip is that moral intuitions are not **evidence**; they are **claims**.
  *   **Evidence:** "The patient has a fever." (This is a fact about the world.)
  *   **Claim:** "I feel disgusted by this act." (This is a psychological state.)

  If a doctor says, "I am responsive to a wider range of symptoms," that's good. If a doctor says, "I am responsive to a wider range of *hallucinations*," that's bad. The roommate's argument assumes that all moral foundations are "symptoms" of moral truth. Step (5) reveals that some of them might be "hallucinations" (or at least, culturally contingent preferences). A blood-and-soil nationalist has *more* intuitions firing, but that doesn't make them more accurate; it might just make them more sensitive to noise.

  ### 3. What are you giving up if you reject (1)?
  You are giving up the idea that **psychology can arbitrate moral truth.**

  This is the Naturalistic Fallacy (deriving an *ought* from an *is*). MFT tells us how people *do* make judgments. It cannot tell us how they *should*. By rejecting (1), you are acknowledging that:
  *   The fact that liberals *lack* an intuition (e.g., for authority) does not prove they are wrong.
  *   The fact that conservatives *have* an intuition (e.g., for sanctity) does not prove they are right.

  You are accepting that moral truth must be determined by philosophy (reasoning about harm, justice, rights, well-being), not by a census of gut feelings.

  ### 4. Is there a weaker version of (1) you can keep?
  Yes. You don't have to abandon the idea of "moral blindness." You just have to change the metric from **Quantity** to **Calibration**.

  **The Weaker Premise (1*):**
  > *"If one person's moral intuitions are responsive to a wider range of **justified** moral considerations, that person's judgments are likelier to be right."*

  Notice the shift from "considerations that actually matter" (which implies we already know the truth) to "**justified** considerations."

  This allows you to say:
  1.  **Liberals might be blind:** You can argue that ignoring "social cohesion" or "institutional stability" (often tied to Loyalty/Authority) is a mistake. That is a philosophical claim about what matters, not a psychological count.
  2.  **Conservatives might be hallucinating:** You can argue that "purity of lineage" or "sacredness of the soil" are *not* justified moral considerations, even if they feel real to the person holding them.
  3.  **The Goal:** The goal isn't to have *more* foundations active; it's to have the *right* foundations active.

  ### How to explain this to your roommate
  You can frame it like this:

  > "Your argument works if moral intuitions are like **sensors**. If I have sensors for heat, motion, and sound, I detect more of the room than someone with just a heat sensor.
  >
  > But moral intuitions aren't sensors; they're **detectors**. A metal detector beeps at gold, but it also beeps at bottle caps. If I modify my detector to beep at *everything* (gold, bottle caps, dirt, rocks), I am 'responsive to a wider range of considerations.' But I'm not a better detector; I'm just a noisier one.
  >
  > Step (5) proves that your metric measures **noise**, not signal. The blood-and-soil nationalist has the most 'foundations' active. If your theory says he is the moral expert, your theory has lost the ability to distinguish between wisdom and prejudice.
  >
  > I can keep the idea of moral blindness without your premise. I can say liberals are blind to *value X* without admitting conservatives are right about *value Y*. We have to argue about which values are real, not count how many we feel."

  ### Summary
  *   **The Flaw:** Premise (1) equivocates between "felt considerations" and "valid considerations."
  *   **The Reductio:** Steps (4)–(5) are valid. They show that "more foundations" is a broken metric for truth.
  *   **The Salvage:** Keep the concept of moral blindness, but define it as missing *justified* values, not missing *psychological* triggers. Psychology informs the debate, but it doesn't settle it.
