      *   *Better:* **The Calibration Check.** You are a scientist calibrating an instrument. You expect the instrument to drift. Do you adjust your current readings to match the expected drift? No, you fix the instrument.
      *   *Actually, a "Successor Agent" analogy:* You are programming a successor. If you expect the successor to be hacked, you don't adopt the hacked values.
      *   *Let's go with the "Corrupted Instrument" analogy.* It highlights the difference between learning (good drift) and breaking (bad drift).

  10. **Refining and Integrating Constraints:**

      *   *Constraint 1 (Uncertainty):* The prompt notes the principle is conditional ("conditional on my credence... being x"). The analogy implies the client knows what the consultant will say ("sight unseen" implies knowing the recommendation is coming, but maybe not the content?). I need to clarify that Reflection requires a probability distribution over future credences, not just certainty. The analogy works best if the client knows *what* the advice will be. If uncertain, the client must average over possible advice.
      *   *Constraint 2 (Identity):* Client = Consultant. Is this load-bearing? Yes, because it removes the "independence" check. If I am the consultant, I can't verify my own future rationality independently of my current rationality. It creates a loop.

  11. **Review and Polish:**

