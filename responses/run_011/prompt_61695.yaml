answer: |-
  # The Anthropocene Position Diagnostic (Handout)

  **Instructions:** Work with a partner. For each of the 8 questions below, circle the **one** option that best matches your intuition about how we *should* define Earth's history. Do not worry about what you've heard in lectures; answer based on what makes sense to you.

  | # | Decision Point | Option A | Option B | Option C |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **The Archive**<br>To count as a geological boundary, the marker must be... | Locked in physical earth materials (ice, sediment, rock). | Recorded in human documents (laws, logs, maps). | Visible in either, depending on the context. |
  | **2** | **Synchronicity**<br>Does the signal need to appear everywhere at once? | Yes, a global boundary must be simultaneous. | No, changes spread at different speeds in different places. | Only if the change is sudden enough to matter. |
  | **3** | **Agency**<br>Who is responsible for the change? | "Humanity" as a biological species is accurate enough. | Specific groups, systems, or empires caused it; "Humanity" hides this. | It doesn't matter who caused it, only that the signal exists. |
  | **4** | **Pace**<br>Can a geological boundary be a slow slope? | No, boundaries must be sharp steps (spikes). | Yes, long-term trends (like farming) count as boundaries. | Yes, but only if the total change is massive. |
  | **5** | **Authority**<br>If a scientific committee votes down a proposal, should scientists stop using the term? | Yes, formal ratification is required for scientific terms. | No, if the concept is useful, the vote shouldn't ban the word. | Only if the science behind it is proven wrong, not just procedural. |
  | **6** | **Naming**<br>Is the name of the epoch a neutral description or a political claim? | Neutral description (like "Jurassic" or "Ice Age"). | Political claim (it assigns blame or responsibility). | It is both; science is never fully separate from society. |
  | **7** | **Distinctness**<br>Does the human signal need to be louder than natural climate noise? | Yes, it must be clearly distinct from natural variability. | No, the *fact* of human influence matters more than the size. | Only if we want to use it for strict rock correlation. |
  | **8** | **Purpose**<br>What is the main point of defining this epoch? | To organize rock layers for geologists. | To change how society understands its impact. | To accurately describe the history of the Earth system. |

  ***

  # TA Guide & Scoring Key

  ### How to Score
  There is no single "correct" path. Match the student's pattern of answers (A/B/C) to the profiles below. Most students will cluster near one; some will be hybrids.

  | Position | Profile (Dominant Answers) | Description |
  | :--- | :--- | :--- |
  | **1. The Formalist (AWG 2023)** | **1A, 2A, 3A, 4A, 5A, 6A, 7A, 8A** | **Mid-20th Century Formal Epoch.** Wants a global, synchronous, physical "golden spike" (Plutonium/Crawford Lake). Believes committees decide validity. "Humanity" is an acceptable agent. |
  | **2. The Pragmatist (Post-2024)** | **1A, 2A, 3A, 4A, 5B/C, 6A, 7A, 8A** | **Informal but Stratigraphic.** Agrees with the science of the Formalist (Plutonium signal) but rejects the committee's veto. The term is too robust socially to drop, even if not ratified. |
  | **3. The Orbis Historian** | **1A, 2A, 3B, 4A, 5A, 6A, 7A, 8A** | **1610 Spike.** Wants a physical, synchronous marker (pollen/CO2) but ties it to colonial depopulation. Distinct from Formalist on **Agency (3B)**. |
  | **4. The Early Anthropocene** | **1A, 2B, 3A, 4B, 5A, 6A, 7C, 8A** | **Neolithic/Farming.** Accepts physical archives but rejects synchronicity and sharp steps. Sees farming as a gradual geological force. Distinct on **Pace (4B)**. |
  | **5. The Constructivist** | **1C, 2B, 3C, 4C, 5B, 6C, 7C, 8B** | **Informal Concept Only.** Sees the term as a social tool, not a rock unit. Ratification is unnecessary bureaucracy. Distinct on **Purpose (8B)** & **Archive (1C)**. |
  | **6. The System Critic** | **1C, 2B, 3B, 4C, 5B, 6B, 7B, 8B** | **Capitalocene/Plantationocene.** Rejects "Humanity" as the agent (**3B**) and "Neutral" naming (**6B**). Geology may be the wrong frame entirely. |
  | **7. The Holocene Continuity** | **1A, 2C, 3A, 4C, 5A, 6A, 7B, 8A** | **Deflationary.** Agrees on physical archives but argues the signal is **Not Distinct (7B)** from natural noise. We are still in the Holocene. |
  | **8. The Eco-Modernist** | **1A, 2A, 3A, 4A, 5B, 6A, 7A, 8B** | **Good Anthropocene.** Accepts the signal but sees the purpose as **Management (8B)** rather than blame or pure classification. |

  ---

  ### Analysis Part 1: Unoccupied Combinations
  *These are answer combinations that are logically possible but rarely (if ever) claimed by a scholar or school of thought.*

  1.  **The "Political Ratification" Paradox (Q3B + Q5A + Q6B)**
      *   **Combination:** "Specific groups caused it (Capitalocene)" + "Committee Vote decides validity" + "Name is Political."
      *   **Status:** **Empty.**
      *   **Reason:** **Incoherent.** Formal stratigraphic committees (Q5A) explicitly reject political naming conventions (Q6B) and specific human agents (Q3B) as criteria for rock units. No one argues that a political claim *should* be ratified by a geological body; the Capitalocene argument is usually that the geological body *cannot* capture the truth.
  2.  **The "Documentary Spike" (Q1B + Q2A + Q7A)**
      *   **Combination:** "Documents count" + "Must be synchronous" + "Must exceed natural noise."
      *   **Status:** **Empty.**
      *   **Reason:** **Unexplored/Impractical.** Historians argue for 1610 (Orbis), but they rely on pollen/CO2 (Q1A) for the *geological* claim. Relying solely on documents (Q1B) for a *synchronous global* geological boundary is methodologically unsupported; documents are not globally synchronous or physically preserved in the earth record.
  3.  **The "Blind Formalist" (Q5A + Q8B)**
      *   **Combination:** "Committee Vote decides validity" + "Purpose is to change society."
      *   **Status:** **Empty.**
      *   **Reason:** **Politically Unattractive.** Those who want the term to drive social change (Q8B) generally resent the authority of a small committee of stratigraphers to ban the term (Q5A). Those who defer to the committee (Q5A) usually want to classify rocks, not change society (Q8A).

  ### Analysis Part 2: Indistinguishable Leaves
  *These are pairs of positions your students might hold that this instrument cannot separate. Admit this to them.*

  1.  **The Formalist (1) vs. The Orbis Historian (3)**
      *   **Why they merge:** Both demand physical archives, synchronicity, sharp steps, and committee ratification.
      *   **The Blind Spot:** This quiz isolates **Agency (Q3)**, but a student can answer "Humanity" (3A) while *thinking* of the Industrial Revolution, or answer "Specific Groups" (3B) while *thinking* of the Americas. If a student believes the 1610 signal is the *best* marker for a Formal Epoch, they will score identically to the Mid-20th Formalist on almost everything except Q3. If they answer Q3 ambiguously, you cannot tell if they want Crawford Lake (1950) or Orbis (1610).
      *   **Pedagogical Fix:** If a student lands here, ask: *"If you had to pick one year for the spike, would you pick the bomb tests or the Columbian Exchange?"* The tree can't ask this without violating the "no dates" rule, so you must intervene verbally.
  2.  **The Pragmatist (2) vs. The Eco-Modernist (8)**
      *   **Why they merge:** Both reject the committee veto (Q5B), accept the physical signal (Q1A, Q7A), and see the term as useful.
      *   **The Blind Spot:** The difference is **affect/intent**. The Pragmatist uses the term because it's scientifically descriptive despite the vote. The Eco-Modernist uses it because they see human stewardship as positive. Both answer "Purpose: Society/Management" loosely.
      *   **Pedagogical Fix:** Look at **Q6 (Naming)**. The Eco-Modernist is more likely to view the name as a banner for action, whereas the Pragmatist views it as a stubborn fact. However, this is a subtle distinction. Acknowledge to the class: *"If you think the term is useful regardless of the vote, you might be a Pragmatist or a Modernist. The difference isn't geology; it's whether you think this epoch is a warning or a challenge."*

  ### TA Notes on Deployment
  *   **The "Vote" Question (Q5):** This is your most important discriminator for the 2024 context. Students who answer **5A** are operating on pre-2024 logic (or strict stratigraphy). Students who answer **5B** are acknowledging the social life of the term.
  *   **The "Agency" Question (Q3):** This is your Capitalocene filter. If a History major circles **3B** but **1A**, they are likely an Orbis proponent. If they circle **3B** and **1C**, they are likely a System Critic.
  *   **Shouting Match Prevention:** When students argue about dates, point to their **Q2 (Synchronicity)** and **Q4 (Pace)** answers. Usually, the Geology major is arguing for **2A/4A** and the History major for **2B/4B**. Show them they aren't arguing about *when*, they are arguing about *what a boundary is*.
