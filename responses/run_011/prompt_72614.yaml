      *   **Context:** A donor funded equipment (dish, outbuilding, transmitter permit) 2 years ago. A senior member wants to send a simple message (counting numbers, coordinates, invitation) to a star system with potentially habitable planets. Club vote was 9-7 in favor. Committee is split.
      *   **Core Objection:** The "Dark Forest" hypothesis (revealing location risks destruction by predatory civilizations).
      *   **Constraints:**
          *   Explain Dark Forest hypothesis in 3-4 sentences, no condescension, treat it seriously as a premise (state conditions for it to hold).
          *   Address three specific arguments made in meetings:
              1.  *Marginal Risk:* "Earth already leaks signals, this adds nothing" vs. "Cumulative negligence."
              2.  *Tiny Probabilities/Enormous Harms:* Extinction risk vs. everyday risks (driving to meeting). Does expected-value reasoning work?
              3.  *Decision as Signal:* The decision itself (and its publicity) might be a signal. Does this weigh on the decision? Does newspaper publicity matter?
