  7.  **Analyze Question 6: Ruling Out Rivals:**
      *   *Rivals:* Superdeterminism, Retrocausality.
      *   *Verdict:* Not ruled out as *false*. Ruled out as *unscientific* or *degenerate*.
      *   *Standard:* Testability/Falsifiability. If a theory explains everything by positing a universal conspiracy, it explains nothing.
      *   *Presupposition:* A norm of *theoretical fruitfulness*. Science seeks local explanations, not global pre-arrangements.

  8.  **Analyze Question 7: Counterfactual (Treating Freedom like Locality):**
      *   *Scenario:* Try to "close" freedom like locality.
      *   *Impossibility:* You cannot space-like separate the setting from its own cause without breaking the causal chain of the experiment.
      *   *Implication:* Freedom is a *boundary condition* of the experimental setup, not a variable *within* it.
      *   *Status:* It is a transcendental condition of the experimental form.

