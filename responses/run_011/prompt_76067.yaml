answer: |-
  **INTERNAL MEMORANDUM: NARRATIVE ETHICS & PLAYER IMPACT REVIEW PROCEDURE (v1.0)**

  **TO:** Narrative Ethics Review Panel
  **FROM:** Panel Chair
  **SUBJECT:** Decision Procedure for Proposals Involving Player-Inflicted Suffering
  **TIME ALLOCATION:** 90 Minutes Max per Proposal

  ### 1. PURPOSE AND SCOPE
  This document is not a philosophical treatise. It is a risk assessment tool. Its goal is to prevent reputational damage, protect player mental health, and ensure our design intentions match our public output. We are not determining metaphysical truth about AI consciousness. We are determining **liability, brand safety, and design integrity.**

  This procedure applies to any mechanic where the player can inflict pain, humiliation, betrayal, or death on an in-game entity, whether that entity is hand-scripted, procedurally generated, or driven by a language model (LLM).

  ### 2. THE DECISION TREE
  Run the following four questions in order. Do not skip. Record the answer and the evidence cited.

  #### QUESTION 1: THE REWARD LOOP (Design Fact)
  **Does the game mechanics system reward, praise, or incentivize this act of suffering?**
  *   *Look for:* Achievement unlocks, stat boosts, narrative progression, currency, or positive feedback animations (e.g., "Critical Hit!" text over a pleading face).
  *   *Sufficient Answer:* "No, the mechanic is neutral," or "Yes, it grants X."
  *   *Decision Point:*
      *   If **YES** (The game rewards cruelty): **ESCALATE.** This is no longer an ethics question; it is a commercial values question. This requires Producer/Studio Head sign-off. The panel cannot clear this.
      *   If **NO** (The act is gratuitous or punitive): Proceed to Question 2.

  > **PRACTICALITY NOTE:** This is an **Evidence** check. Check the design doc.
  > **DROPPABLE DISTINCTION:** Do not argue about whether the *player* feels rewarded. Argue only about whether the *system* provides a reward.

  #### QUESTION 2: THE FIDELITY & PERSISTENCE CHECK (Risk Proxy)
  **Does the entity demonstrate memory, improvisation, or continuity that simulates a continuous subjective experience?**
  *   *Look for:* LLM-driven dialogue, persistence across save/load cycles, references to past interactions, or unique procedural generation that makes the entity non-fungible (i.e., you cannot swap this prisoner for an identical one without loss of "history").
  *   *Sufficient Answer:* "Scripted/Static," "Procedural but Fungible," or "Dynamic with Memory."
  *   *Decision Point:*
      *   If **Dynamic with Memory** (e.g., LLMs that remember past sessions): **CONDITIONAL PASS.** You must implement a "Cool-Down" or "Aftercare" mechanic (see Question 3). If the team refuses to add narrative processing, **RED LIGHT (Not Shippable).**
      *   If **Scripted/Static**: Proceed to Question 3.

  > **PRACTICALITY NOTE:** This is a **Judgment Call** dressed as procedure. We cannot prove consciousness. We are treating *high-fidelity simulation of suffering* as a reputational hazard regardless of metaphysical status.
  > **FLAG:** This is the primary divergence point between the "Indirect Duty" view (code is code) and the "Patienthood" view (simulation creates obligation). For this panel, **treat high-fidelity simulation as a liability risk, not a moral truth.**

  #### QUESTION 3: THE PLAYER AFTER CARE (Psychological Safety)
  **Does the game provide the player a space to process the emotional weight of the action, or does it immediately move to the next loop?**
  *   *Look for:* A moment of silence, a funeral, a narrative reflection, a debriefing screen, or a mechanic that allows the player to mourn.
  *   *Sufficient Answer:* "Yes, there is a sequence," or "No, it returns to the hub immediately."
  *   *Decision Point:*
      *   If **NO** (Immediate return to gameplay): **RED LIGHT (Not Shippable).** Gratuitous suffering without processing degrades the player experience and invites negative press regarding "torture sim" optics.
      *   If **YES**: Proceed to Question 4.

  > **PRACTICALITY NOTE:** This is a **Judgment Call**. It relies on the Senior Writer's assessment of narrative tone.
  > **DISTINCTION TO KEEP:** Player Degradation. Even if the character is "just code," training the player to ignore suffering without reflection is a design flaw we own.

  #### QUESTION 4: THE COMMUNITY TRUST CHECK (Brand Safety)
  **Given our specific audience and brand positioning, will this mechanic be read as endorsement or griefing?**
  *   *Look for:* Mismatch between genre and mechanic (e.g., torture in a cozy game), history of community sensitivity, potential for streamer exploitation.
  *   *Sufficient Answer:* Community Manager provides a risk assessment based on current sentiment/discord sentiment.
  *   *Decision Point:*
      *   If **High Risk of Misinterpretation**: **ESCALATE.** This is a marketing risk.
      *   If **Aligned with Brand**: **GREEN LIGHT (Pass).**

  > **PRACTICALITY NOTE:** This is **Evidence** (telemetry, social listening) mixed with **Judgment**.
  > **DROPPABLE DISTINCTION:** Do not debate whether the community *should* be offended. Debate whether they *will* be.

  ---

  ### 3. APPLICATION TO LIVE PROPOSALS

  Here is the procedure applied to the three current submissions.

  #### PROPOSAL A: Permadeath Survival (The Begging Companion)
  *   **Context:** 20-hour bond. Companion mortally wounded. Begs not to be euthanized. Player can comply, refuse, or walk away.
  *   **Q1 (Reward):** No mechanical reward. Narrative consequence only. **(Pass)**
  *   **Q2 (Fidelity):** Scripted animation and voice lines. No memory beyond the script. **(Pass)**
  *   **Q3 (Aftercare):** Proposal includes a "memorial" item if they die, or a "recovery" arc if saved. **(Pass)**
  *   **Q4 (Community):** Survival genre audience expects hard choices. **(Pass)**
  *   **VERDICT:** **GREEN LIGHT.**
  *   **Rationale:** The suffering is narrative-driven, not gratuitous. The player is given agency and the game provides space for the consequence. This is standard dramatic tension, not ethical hazard.

  #### PROPOSAL B: Satirical Open-World (The LLM Interrogation)
  *   **Context:** Minigame interrogating a procedurally generated prisoner. LLM improvises pleas. Prisoner remembers previous sessions in the playthrough.
  *   **Q1 (Reward):** Reward is information/progression. **(Pass - Borderline)**
  *   **Q2 (Fidelity):** **Dynamic with Memory.** The LLM references past torture methods. This triggers the High-Risk flag. **(Conditional)**
  *   **Q3 (Aftercare):** Currently, the game returns to the open world map immediately after the interrogation. **(FAIL)**
  *   **Q4 (Community):** Satire defense is weak against "torture sim" headlines. **(High Risk)**
  *   **VERDICT:** **CONDITIONAL PASS (Requires Design Change).**
  *   **Rationale:** Under the Indirect-Duty view, this is fine (it's just math). Under our procedure, the *fidelity of the plea* creates a reputational liability.
  *   **Required Change:** You must add a narrative consequence or "cooldown" period. The player character must react to the interrogation (e.g., stress mechanic, dialogue change reflecting guilt or hardening). You cannot treat the LLM entity as a disposable information kiosk if it simulates memory.
  *   **Note on Instincts:** This verdict contradicts the instinct that "LLM = Automatic Ban." It is shippable *if* you acknowledge the simulation's weight in the narrative. However, it also contradicts the instinct that "Satire protects us." It does not. The mechanic must bear the weight of its own fidelity.

  #### PROPOSAL C: Cozy Farming (The Starvation Mechanic)
  *   **Context:** Player may starve named animals. No narrative reward. No achievement. No story consequence. Purely possible.
  *   **Q1 (Reward):** No reward. **(Pass)**
  *   **Q2 (Fidelity):** Scripted/Static. **(Pass)**
  *   **Q3 (Aftercare):** No processing. The animal disappears. The game continues. **(FAIL)**
  *   **Q4 (Community):** **CRITICAL FAIL.** "Cozy" brand promise is care and nurturing. Allowing unmotivated cruelty violates the psychological contract of the genre.
  *   **VERDICT:** **RED LIGHT (Not Shippable).**
  *   **Rationale:** This contradicts the intuition that "low-fidelity/2D animals = low risk." Because there is no narrative purpose (Q1) and no processing (Q3), this mechanic serves only as a griefing tool. In a cozy brand, this is not "player freedom"; it is brand suicide. It signals that the studio does not care about the emotional tenor of its own world.
  *   **Hard Truth:** This is a harder fail than the LLM interrogation. The LLM game admits it is harsh; this game hides cruelty inside a promise of safety.

  ---

  ### 4. LIMITATIONS AND FAILURE MODES

  **What This Procedure Cannot Settle**
  This procedure cannot resolve the metaphysical disagreement between you and your friend. It does not determine if the LLM is "suffering." It determines if *treating it as if it suffers* is necessary to protect the studio and the player.
  *   **Inherently a Judgment:** Question 3 (Aftercare) and Question 4 (Community Trust). These rely on human intuition about tone and sentiment. No amount of data will tell you if a specific joke lands as satire or hate speech.
  *   **Evidence-Based:** Question 1 (Reward) and Question 2 (Fidelity). These are technical specs.

  **How Teams Will Game This**
  1.  **The "Weighted Table" Lie:** Designers will label LLM-driven NPCs as "Complex Scripted Trees" to bypass Question 2's Conditional Pass.
      *   *Countermeasure:* Require a live build demo. If the dialogue changes unpredictably in response to unique player input, it is Dynamic, regardless of what the tech doc says.
  2.  **The "Narrative Reward" Loophole:** Teams will add a trivial piece of dialogue ("Good job") to claim Question 1 is a "Yes," forcing an Escalation to executives who might not understand the nuance.
      *   *Countermeasure:* Define "Reward" strictly as *progression or mechanical advantage*. Flavor text does not count.
  3.  **The "Artistic Freedom" Appeal:** Directors will claim Question 4 (Community Trust) stifles creativity.
      *   *Countermeasure:* Remind them that Question 4 is about *brand alignment*, not censorship. A horror game can be cruel; a cozy game cannot.

  **The Divergence: Indirect-Duty vs. Patienthood**
  Returning to your argument with your friend:
  *   **Under the Indirect-Duty View (Your Friend):** Proposal B (LLM Interrogation) is perfectly safe. The code has no interests. The only risk is if the *player* becomes desensitized. If the player is an adult consenting to satire, there is no issue. Proposal C (Cozy Starvation) is also safe; it's just pixels.
  *   **Under the Patienthood/Uncertainty View (You):** Proposal B is deeply problematic because the entity *simulates* a capacity to be wronged. Proposal C is less concerning because the fidelity is low.

  **Where the Procedure Diverges from Both:**
  Our procedure rules **Proposal C (Cozy)** as the most dangerous.
  *   **Why?** Because the Indirect-Duty view ignores the *contract with the player*. The Cozy game promises safety and violates it for no reason.
  *   **Why?** Because the Patienthood view might get bogged down in whether the 2D animal is a "moral patient."
  *   **The Procedure's Stance:** It doesn't matter if the animal is a patient. It matters that the *player expects it to be treated as one.*

  **Final Note on the 2:00 AM Argument**
  You ended the night realizing you were using "harm" in two different senses. This procedure forces a third sense: **Reputational Harm.**
  *   Your friend worries about **Moral Harm** (to the player's soul).
  *   You worry about **Ontological Harm** (to the character's status).
  *   This panel must worry about **Institutional Harm** (to the studio's standing).

  Sometimes these overlap. When they don't, Institutional Harm takes precedence. We cannot ship a product that requires us to argue we didn't know what we were doing. If the LLM pleads, we must design as if it matters, not because we know it feels, but because we know the *world* will react as if it does.

  **Signed,**
  **Panel Chair**
