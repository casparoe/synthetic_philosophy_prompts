          *   Cost: Undermines property rights generally. Makes entitlements very abstract.

      *   **Option C: Reject (5)/(6) - Bite the Bullet.** (The "Hard Libertarian" Move).
          *   Argument: (1) is true. There are no filial obligations either. Gratitude is not obligation.
          *   Cost: Counter-intuitive, socially corrosive, but philosophically consistent.

      *   **Option D: Reject the Equivocation in (1).** (The "Nature of Obligation" Move).
          *   Argument: (1) defines obligation too narrowly (as contractual/voluntary). There are different *types* of obligation (associative, natural, contractual).
          *   Cost: Abandoning pure voluntarism.

      *   **Option E: The "Benefit" Distinction (Nozickian).**
