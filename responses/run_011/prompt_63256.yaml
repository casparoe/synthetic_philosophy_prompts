      *Wait, looking closer at (1):* "An obligation binds you only if..." This is a universal claim. If it's false for parents, it's false as a universal rule. So (8) follows logically from (6)+(7).
      *So the real choice is:* Is (6) actually false? Or is (1) true and (6) acceptable? Or is (3) false?
      *Best path for the user (who wants Anarchism):* Reject (3). If you aren't "entitled" to your specific livelihood independent of the state, the cost of leaving isn't "giving up an entitlement," it's "giving up a state-created privilege." This saves (1) for the political sphere without forcing you to deny filial obligations (if you ground filial obligations differently).
      *Actually, better path:* Distinguish the *source* of obligation. (1) defines *voluntary* obligation. If you admit non-voluntary obligations exist (family), you kill (1). If you kill (1), you open the door to Political Obligation.
      *To keep Anarchism:* You must argue that Political Obligation *must* be voluntary, even if other obligations aren't. This requires rejecting the universality of (1) without rejecting it for the State. i.e., "Political obligation requires consent; other obligations do not."
