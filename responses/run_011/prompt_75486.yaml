  **FENWICK & ORDAL INTERNAL MEMORANDUM**
  **SUBJECT:** REVISED HOUSE STYLE AND PROCEDURAL ONTOLOGY
  **FROM:** MARGIT ORDAL, HEAD OF COPY
  **DATE:** 14 OCTOBER

  **Prefatory Note**
  Reference is made throughout this document to the later work of Ludwig Wittgenstein. This guide does not argue with the dead. It operationalizes the observation that philosophy leaves everything as it is, except our understanding of why we cannot change it. The following clauses are not suggestions. They are the grammar of our practice.

  **1. Meaning and Use**
  Meaning is determined by use within a specific form of life. Consequently, the flagship series *The Anatomy of Ideas* is currently in breach of house policy. Contracts requiring a definitive account of concepts such as *Justice*, *Number*, or *Game* demand essences where there are only employments. Authors must cease defining terms and instead document the variability of their application across contexts. A concept without a use is a wheel idling. See Clause 8 regarding deviations.

  > *Query to Dr. Aris Thorne: Your manuscript for* Justice *opens with a necessary and sufficient condition. This condition is unused in any actual legal proceeding cited in Chapter 3. Please revise to show the word's work, not its skeleton. If the word does no work, the chapter is void.*

  **2. Indexing and Family Resemblance**
  The backlist index must be rebuilt. No headword shall possess a singular definition. Entries must be placed solely by overlapping similarities with their neighbours, such that no single feature is common to all. The resulting index will be unusable for linear search but principled in its topology. *Game* may reference *Sport*, *Risk*, and *Childhood*, but not *Definition*. If a reader seeks a location, they must learn the lay of the land.

  **3. Completeness of Language**
  A manuscript consisting of four words called out across a building site constitutes a complete language if it functions within that context. Brevity is not incompleteness. If the words command, warn, or request within the form of life of the site, they are publishable. Do not request expansion. To ask for a verb where a shout suffices is to misunderstand the tool.

  **4. Private Language Argument**
  Diary-notation submitted as narrative must be rejected. If a sign is interpretable only by the author, there is no criterion of correctness for its use. A rule cannot be followed privately. If you claim to know what you meant by the symbol yesterday, you must demonstrate how that meaning is checked by others. Without public verification, the text is noise.

  > *Query to Sarah Jenkins: Your submitted journal uses a unique glyph for 'grief'. You state only you know its intensity. Without a public rule for its application, this is not a text. It is a sensation. We publish texts.*

  **5. Aspect Seeing and Cover Art**
  A cover showing an animal visible two ways (e.g., duck-rabbit) cannot be settled by a vote of the sales conference. A change of aspect is not a change of opinion. Voting implies one view is correct and the other false. Both are valid seeings. Sales may choose which aspect to highlight in copy, but they cannot vote on the image's ontology. To force a choice is to misunderstand the perception.

  **6. Inter-Departmental Translation**
  The Marketing Department plays a different language-game. Their claims regarding "bestseller potential" operate within a calculus of risk and reach, not truth-conditions. These claims can be translated into editorial terms but not contradicted. To argue that a book is "good" against a claim it is "sellable" is a category error. We translate their prices into our values; we do not refute them.

  **7. Rule-Following and Conformity**
  Compliance with this guide is measured by use, not intent. However, past conformity does not guarantee future meaning. If a staff member follows a rule for eleven years and then diverges, we must ask what fact about their past constitutes their having meant the rule differently then than now. There is no mental state that secures the rule against future misapplication. We judge only the move made.

  > *Query to E. Vance: You have hyphenated 'copy-editor' for eleven years. Today you write 'copyeditor'. You claim you always meant the latter. What fact of your past usage proves this? If none, you are not correcting error; you are changing the game. Justify the move.*

  **8. Definition of Error**
  Error is a deviation from established norm. All manuscripts must be checked against this standard.

  **9. Implementation**
  These clauses take effect immediately. Authors seeking clarity on these rules will find none, as clarity is not the aim. Understanding is shown in the doing. If you cannot play the game, do not submit.

  **10. Final Provision**
  Nothing in this guide may be winked at. The conversion of thesis into procedure is total. If a rule cannot say what makes its own application correct, neither can we. We administer the silence where the sayable ends.
