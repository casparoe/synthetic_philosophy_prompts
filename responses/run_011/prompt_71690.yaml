answer: |-
  This is a profound operational problem disguised as a personnel issue. You are trying to manage *moral residue* with a shift roster. You are right to reach for Williams; his critique of utilitarianism (that reducing all decisions to impartial calculation destroys the moral agent) is exactly what happens when a Duty Officer asks a volunteer to justify a refusal at 2 AM. If you force them to weigh their conscience against the "greater good," you alienate them from their own action, even if they comply.

  However, you are also right that a rescue team cannot run on pure subjectivism. You have a contract, a mission, and a safety protocol.

  Here is the procedure, the application, and the hard truths you asked for.

  ### Part 1: The Procedure (The Laminated Card)

  This is designed for a Duty Officer (DO) who is tired, stressed, and not a philosopher. It does not ask "Is this reason good?" It asks "What *kind* of reason is this?" and "Does this break the role?"

  **THE INTEGRITY TRIAGE PROTOCOL (2 AM VERSION)**

  **STEP 1: THE LOGISTICAL GATE (30 Seconds)**
  *Ask:* "Is this a hard 'cannot' (car, shift, location) or a 'will not'?"
  *   **If 'Cannot':** Log it. Move to next person. (End)
  *   **If 'Will Not':** Proceed to Step 2.

  **STEP 2: THE CATEGORY CHECK (2 Minutes)**
  *Ask:* "I need to log the reason type. Is this about **Safety**, **Conscience**, or **Capacity**?"
  *   **Safety:** "I believe this plan/kit/site is unsafe."
  *   **Conscience:** "I cannot participate in this specific task due to a personal principle."
  *   **Capacity:** "I am not mentally/physically fit for *this specific* task right now."

  **STEP 3: THE SUFFICIENCY TEST (2 Minutes)**
  *Do not ask them to justify the weight of the reason. Ask about the **scope**.*

  *   **If Safety:** "Is this a protocol deviation?"
      *   *Yes:* **STOP.** Do not accept decline. Escalate to Training Officer immediately. (See Case 3).
      *   *No:* Accept decline. Log as Safety Concern.
  *   **If Conscience:** "Does this prevent you from fulfilling the core role you signed up for?"
      *   *Yes (e.g., 'I won't work for Client X'):* Accept decline for *this call*. **FLAG FOR ROSTER REVIEW.** (See Case 1).
      *   *No (e.g., 'I won't enter this specific building'):* Accept decline. Log as Conscience.
  *   **If Capacity:** "Is this temporary or permanent?"
      *   *Temporary (e.g., 'I'm shattered', 'Family promise'):* Accept decline. No penalty. (See Case 2 & 4).
      *   *Permanent (e.g., 'I can't do children anymore'):* Accept decline. **FLAG FOR ROLE REASSIGNMENT.** (See Case 4).

  **STEP 4: THE CLOSE**
  *Say:* "Understood. I have logged it as [Category]. Thank you for telling me."
  *Do:* Move to next person. Do not argue. Do not sigh.

  ***

  ### Part 2: Running the Four Cases

  Here is how the card handles your scenarios, and where you need to adjust your thinking.

  **1. The Activist (Contract vs. Conscience)**
  *   **Procedure:** Category: Conscience. Scope: Prevents core role (Standby Contract).
  *   **Outcome:** **Accept Decline + Flag for Roster Review.**
  *   **Analysis:** You cannot task him. Williams would say forcing him treats him as a tool of the energy company, violating his "ground projects." However, he voluntarily joined a team with a contract. He cannot hold both the integrity of the activist and the obligations of the contractor simultaneously.
  *   **Action:** He sits out this call. But the next day, the Chair must talk to him. He may need to move to a non-standby roster. You cannot have a standby member who is ethically barred from the standby client.

  **2. The Granddaughter (Personal Commitment)**
  *   **Procedure:** Category: Capacity (or Conscience, depending on phrasing). Scope: Temporary.
  *   **Outcome:** **Accept Decline. No Penalty.**
  *   **Analysis:** Williams' "one thought too many." Her promise is a ground project that constitutes her life outside the team. The team's resentment is a failure of *their* moral imagination, not hers. They are treating the team as the sole source of value.
  *   **Action:** You are right; the team is wrong. The procedure protects her from having to explain *why* the wedding matters. "I made a promise" is sufficient.

  **3. The Rope System (Protocol vs. Conscience)**
  *   **Procedure:** Category: Safety. Scope: Protocol Deviation.
  *   **Outcome:** **Do Not Accept Decline. Escalate.**
  *   **Analysis:** **This is the case that comes out against you.** You wrote: *"Sounds like integrity to me. Also sounds like a technical objection wearing a costume."*
      *   **The Hard Truth:** It is almost certainly the latter. Williamsian integrity is about *moral* identity (who I am), not *technical* preference (how I rig). If the team has agreed on a protocol, refusing it is not conscience; it is insubordination or a safety risk. If he thinks it's unsafe, that's a Safety Category (Step 3), which triggers a Training Officer review, not a conscience exemption.
      *   **Why against you?** You are romanticizing a potential safety violation as "integrity." A rescue team is a collective agency. If everyone exercises "conscience" over protocol, the system collapses. This is not the place for moral veto power.
      *   **Action:** "If you will not run protocol, you are not qualified for this task." Hand off to Training Officer.

  **4. The Trauma (Capacity)**
  *   **Procedure:** Category: Capacity. Scope: Permanent.
  *   **Outcome:** **Accept Decline + Flag for Role Reassignment.**
  *   **Analysis:** This is not integrity; it is psychological injury. It is a "cannot," not a "will not."
  *   **Action:** He stays on the team, but is coded "No Children." If a child call comes in, he is skipped without question. If this limits him too much for the roster's needs, that is a management discussion, not a 2 AM discussion.

  ***

  ### Part 3: The Limits (Honest Answers)

  **Can this procedure distinguish integrity from fear, preference, or burnout?**
  **No.** And it shouldn't try.
  At 2 AM, you are not a moral judge. You are a triage nurse. The procedure does not validate the *truth* of the claim; it validates the *category* of the claim.
  *   If someone says "Conscience," you log "Conscience."
  *   If they lie, the *pattern* will reveal it over months.
  *   The procedure's job is to prevent the 2 AM argument, not to solve the human puzzle. If you try to distinguish fear from integrity on the phone, you will fail, and you will alienate the honest people in the process.

  **Can it tell you whether to keep somebody on the roster?**
  **You are wrong here.** The procedure *must* feed this decision.
  Notice Step 3 in the card: **FLAG FOR ROSTER REVIEW.**
  The 2 AM call is the *sensor*, not the *solver*. If a member consistently declines based on Conscience (Case 1) or Capacity (Case 4), the procedure flags them for the Chair. You cannot run a standby contract with people who have conscientious objections to the contract. The procedure tells you *when* to have that conversation, even if it doesn't decide the outcome.

  **Does it have anything to say when accepting a decline might mean someone dies?**
  **No.** This is the tragedy of the job.
  If you force the Activist (Case 1) to go, he may hesitate, make a mistake, or sabotage the operation. If you force the Trauma Member (Case 4) onto a child call, he may freeze.
  Williams' point is that *you* (the coordinator) bear the responsibility for the consequences, not them. You cannot offload the moral weight of the "greater good" onto the volunteer to justify coercing them. If the system breaks because too people say "no," the system is broken, not the people.

  ***

  ### Part 4: Williams and the Laminated Card

  **Would Williams regard this card as a misunderstanding of his point?**
  **Yes.**
  Williams argues that moral life cannot be codified into a system without losing the very humanity that makes morality possible. He would say that by creating a procedure for integrity, you are bureaucratizing the soul. You are turning "I cannot do this" into a form to be filled out (Category: Conscience).

  **Is that fatal for what you are asking?**
  **No. It is a necessary caveat.**
  You are not building a moral philosophy; you are building a *firewall*.
  The card is not for the volunteer; it is for the *Duty Officer*.
  *   Without the card, the DO (operating under pressure) will default to utilitarianism: "But we need bodies! Justify yourself!"
  *   The card forces the DO to stop calculating consequences and respect the category.
  *   It creates a protected space where the volunteer *doesn't* have to justify their integrity impartially.
  *   It is a "noble lie." You are using a rule to protect the exception.

  ### Summary of the "Against You" Verdict

  **Case 3 (The Rope System).**
  You are too willing to treat technical insubordination as moral integrity.
  *   **Williams' View:** Integrity is about your "ground projects" (what makes your life worth living). Refusing a specific knot or rigging protocol is not a ground project; it is a professional disagreement.
  *   **The Risk:** If you allow "conscience" to override protocol, you invite liability and danger.
  *   **The Fix:** Treat it as a Safety/Competence issue. "If you cannot run the protocol, you are not qualified for the task." Do not give it the dignity of a conscience clause.

  ### Final Word

  You are a biologist. You know that in population surveys, if your sampling method is biased, your data is useless.
  Currently, your "sampling method" for integrity is biased toward coercion or silence.
  This procedure standardizes the sample. It won't save everyone. It won't fix the contract conflict. But it stops you from asking a man saving his wife to calculate the utility of the rescue. And that is enough.
