prompt: |-
  I teach an upper-level seminar, sort of a "rationality and its limits" thing — 22 students, mixed philosophy and econ majors, one 75-minute block. I want to open the unit on self-defeat with a game instead of a lecture. Target is Parfit's hitchhiker: the spot where it's rational to have become the kind of person who pays the driver later, even though once you're in town, paying is the last thing you have any reason to do. I want them to run into that from the inside and only hear the name in the debrief.

  What I've got: movable chairs, a whiteboard, index cards, envelopes. No projector, phones banned. No budget for real money — I have a bag of candy and I can promise up to 2 points on the participation component, but I dont want it turning into a bloodbath where people are optimizing for candy. Also, every one of them has played a Prisoner's Dilemma somewhere, so the game must not be recognizable as one; if somebody says "oh this is just PD" in the first two minutes I've lost the room. 22 is even, so pairs work, but tell me what to do if three people are out sick.

  The part I care about most: the prediction has to be endogenous. I'm not going to stand up there and stipulate a near-perfect reader of souls. Build the forecasting out of the students themselves — slips they write and get scored on for accuracy, or something in that neighborhood — and make it publicly visible how accurate the predictors actually were, because the whole lesson depends on them seeing that their classmates could genuinely read them. Spell out the candy/points conversion seperately from the game points so it doesn't get tangled.

  And I want the later-stage payoff to be truly dominant, not just tempting. A student who refuses to pay shouldn't be making an obvious mistake given where she's standing at that moment — that's the entire point, and I don't want a game that quietly punishes her for it.

  Deliverables: full rules, a minute-by-minute timeline, the exact wording on the role cards and the prediction slips, the payoff scheme, and a debrief that maps specific moments from the room onto specific parts of the structure. Then tell me straight whether you can actually make this one-shot or whether it inevitably turns into a reputation game — if iteration is doing the heavy lifting, I want to know how much of the lesson is riding on it and how to say that out loud to the class rather than pretend otherwise. Also give me the frank list of what the activity cannot reproduce (noisy prediction, nobody in the room is genuinely transparent, lying stays available the whole time, whatever else) that I'm going to have to supply by hand afterwards.

  Finally: what predictably goes wrong the first time this is run? I want failure modes, not reassurance — the student who writes a deliberately useless forecast, the pair that colludes before you've finished reading the rules, the round-two problem where they've already seen the machinery, the kid who just refuses to play. And what to do about each one in the moment. If there's a natural way to gesture at Kavka's toxin in the last five minutes without derailing everything, mention it, but don't force it.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Context:** Upper-level seminar ("Rationality and its limits"), 22 students (Phil/Econ mix), 75 mins.
      *   **Goal:** Introduce Parfit's Hitchhiker (self-defeat of rationality, commitment problems) via a game, *not* a lecture. Reveal the name/concept only in debrief.
      *   **Constraints:** Movable chairs, whiteboard, index cards, envelopes. No phones/projector. No real money (candy + 2 participation points max). Must avoid looking like Prisoner's Dilemma (PD).
      *   **Key Mechanic:** Endogenous prediction. Students must predict each other's behavior, and this prediction must be credible/visible. The "predictor" needs to be the classmates, not the instructor stipulating a "mind reader."
      *   **Payoff Structure:** Later-stage payoff must be *truly dominant* for defection (not paying), mirroring the Hitchhiker problem (once in town, paying is irrational).
      *   **Deliverables:** Rules, timeline, exact wording (cards/slips), payoff scheme, debrief mapping, honesty check (one-shot vs. reputation), limitations, failure modes + fixes.
      *   **Specific Worry:** Iteration/Reputation. If the game relies on repeated rounds to build trust, does it undermine the "one-shot" nature of Hitchhiker? Need to address this.
      *   **Contingency:** 22 is even, but what if 3 are sick (odd number)?
      *   **Bonus:** Gesture at Kavka's Toxin if possible.

  2.  **Deconstruct Parfit's Hitchhiker:**

      *   *Scenario:* Dying in desert -> Driver offers ride -> Driver predicts if you'll pay later -> If predicts "No", leaves you -> If predicts "Yes", drives you -> Once in town, paying is costly and provides no benefit (driver is gone).
      *   *Rationality Problem:* Standard causal decision theory (CDT) says don't pay once in town. But if you are that kind of person, you never get the ride. You need to be the kind of person who pays *even when it's irrational to do so*.
      *   *Game Translation:*
          *   Phase 1: Prediction/Commitment.
          *   Phase 2: The "Ride" (getting the opportunity).
          *   Phase 3: The "Payment" (where defection is dominant).
      *   *The Twist:* The prediction must come from peers to feel endogenous.

  3.  **Designing the Game Mechanism:**

      *   *Avoiding PD:* PD is simultaneous move, symmetric. Hitchhiker is sequential (Prediction -> Transport -> Payment). I need to hide the symmetry.
      *   *Roles:* "Travelers" and "Drivers"? No, too obvious. Let's call them "Proposers" and "Evaluators" or something more abstract. Actually, let's keep it thematic but abstract enough. "Seekers" and "Screeners."
      *   *The Prediction:* How to make it endogenous?
          *   Idea: Students write a prediction about a specific partner *before* the partner decides.
          *   Problem: If I know you are predicting me, I might lie.
          *   Solution: The "Screeners" don't decide based on *your* promise, they decide based on *their* read of you.
      *   *The "Dominant Defection":* Once the "ride" is granted, the "payment" must benefit the Screener but cost the Seeker, with no future repercussion.
      *   *Structure:*
          1.  Pair up.
          2.  Role assignment (hidden or random?). Let's make it symmetric first, then break symmetry.
          3.  Actually, to mimic Hitchhiker, one person needs to be "in the desert" and one "in the car." But everyone needs to feel the tension.
          4.  *Better Idea:* Two rounds, but roles switch? No, that creates reputation.
          5.  *Best Idea for One-Shot feel:* A "Market" of predictions.
          6.  *Refined Idea:* **The Trust Exchange.**
              *   Pair up.
              *   Student A writes a prediction about Student B.
              *   Student B decides whether to "Enter the Contract."
              *   If B enters, A gets a chance to "Reward" or "Keep."
              *   Wait, this is just Trust Game (Berg et al.). That's too close to PD/Ultimatum.
              *   *Need to emphasize the Prediction as the gatekeeper.*
              *   *Revised Mechanism:*
                  1.  Pairs.
                  2.  Phase 1 (The Desert): Player 1 (Traveler) writes a "Vow" (Pay or Not). Player 2 (Driver) writes a "Prediction" (Will they Pay?).
                  3.  Driver sees Vow? No, that's cheap talk. Driver sees *nothing* but their own gut.
                  4.  Driver decides: Drive or Leave.
                  5.  If Drive: Traveler decides: Pay or Not.
                  6.  Payoff: Driver gets points if Traveler Pays. Traveler gets points if Driven, minus cost of Paying.
                  7.  *Crucial:* The Prediction needs to be incentivized for accuracy, not just the outcome.
      *   *Addressing the "Endogenous Prediction" requirement:* The prompt asks for "slips they write and get scored on for accuracy."
      *   *Let's build the "Psychic Market".*
          *   Everyone is a Traveler.
          *   Everyone is also a Driver for someone else.
          *   But to make the prediction endogenous and visible:
          *   Step 1: Write a "Profile Card" about yourself (not a promise, just info).
          *   Step 2: Swap cards. You are now the Driver for the person whose card you hold.
          *   Step 3: Write a Prediction on a slip: "Will this person Pay?"
          *   Step 4: Driver decides: Accept (Drive) or Reject (Leave).
          *   Step 5: If Accept, Traveler decides: Pay or Not.
          *   Step 6: Reveal. Score Prediction Accuracy separately from Game Payoffs.

      *   *Wait, one major constraint:* "The later-stage payoff to be truly dominant... A student who refuses to pay shouldn't be making an obvious mistake."
      *   *Payoff Math:*
          *   Traveler: Ride = +10. Pay = -3. Net if Pay = 7. Net if No Pay = 10. (Dominant strategy: Don't Pay).
          *   Driver: Drive = -1 (cost of gas). Get Paid = +5. Net if Paid = 4. Net if No Pay = -1. Leave = 0.
          *   Prediction Bonus: +2 points if prediction is correct.
      *   *The "Hitchhiker" tension:* Traveler wants to be *predicted* to Pay (to get ride), but wants to actually *Not Pay* (to maximize points). Driver wants to predict accurately and only Drive if Paid.

      *   *Avoiding PD:* PD is usually simultaneous. This is sequential. But students might still smell game theory. I need to flavor it heavily as "Personality/Character" not "Strategy."
      *   *Naming:* Don't use "Pay/Defect." Use "Honor/Keep." Don't use "Driver/Traveler." Use "Sponsor/Candidate."
      *   *The "Endogenous" part:* The prompt wants the forecasting to be built out of students themselves and publicly visible.
      *   *Modification:* Instead of private prediction, make the prediction the *condition* for the game.
      *   *Actually, let's look at the "Reputation" worry.* If they play once, they might just defect. If they know they will debrief, they might cooperate to look nice.
      *   *Solution:* Anonymize the final decision but not the prediction. Or better: The Prediction Score is individual. The Game Score is individual.
      *   *Wait, the prompt says:* "make it publicly visible how accurate the predictors actually were."
      *   *Okay, Public Prediction:*
          1.  Pairs.
          2.  A writes prediction about B. B writes prediction about A.
          3.  Reveal predictions to each other? No, that changes behavior.
          4.  Reveal predictions to the *class* after the game? Yes.
          5.  So: Write prediction -> Seal in envelope. Play Game -> Open envelopes -> Tally accuracy on board.

  4.  **Refining the Mechanics for the Prompt's Specifics:**

      *   *Constraint:* "Prediction has to be endogenous... Build the forecasting out of the students themselves."
      *   *Constraint:* "Later-stage payoff to be truly dominant."
      *   *Constraint:* "Not recognizable as PD."
      *   *Constraint:* "22 students... what if 3 sick (19 students)?"
      *   *Constraint:* "Candy/Points conversion separate."

      *   *Game Name:* **The Sponsorship Protocol.**
      *   *Roles:* **Candidate** (Traveler) and **Sponsor** (Driver).
      *   *Setup:* Pairs.
      *   *Phase 1 (The Read):* Sponsor writes prediction about Candidate on a slip. "Will they Honor?" (Yes/No). Sealed in envelope.
      *   *Phase 2 (The Offer):* Sponsor sees Candidate's "Profile" (just a name/number, no info). Sponsor decides: Sponsor or Pass.
          *   *Wait, if Sponsor sees no info, prediction is random.*
          *   *Correction:* Sponsor and Candidate talk for 2 minutes. *No promises allowed.* Just "vibes." This mimics the "looking into eyes" of the Hitchhiker.
          *   *Rule:* "You may discuss anything except specific binding promises about your next move."
      *   *Phase 3 (The Decision):* Sponsor decides (without knowing Candidate's final choice).
      *   *Phase 4 (The Honor):* If Sponsored, Candidate decides Honor or Keep.
      *   *Payoffs:*
          *   Candidate: Base 5. If Sponsored: +10. If Honor: -4. (Honor=11, Keep=15). *Keep is dominant.*
          *   Sponsor: Base 5. If Sponsor: -2 (cost). If Honored: +6. (Honored=9, Betrayed=3, Pass=5).
          *   Prediction: +2 Participation Points if Prediction matches Candidate's actual move.
      *   *Why this works:* Candidate wants to be Sponsored (needs Sponsor to predict Yes). Candidate wants to Keep (dominant strategy). Sponsor wants to Predict Accurately (for points) and Sponsor only if Honored (for points).
      *   *The Hitchhiker Link:* Once Sponsored, Candidate *should* Keep. But if they are the kind of person who Keeps, they won't get Sponsored.

      *   *Addressing "Publicly Visible Accuracy":*
          *   Collect Prediction Slips.
          *   Collect Game Decision Slips.
          *   Open them on the board. Tally Accuracy Rate.
          *   This shows: "Your classmates could read you."

      *   *Addressing "Not PD":* PD is symmetric. This is asymmetric roles (Sponsor vs Candidate). PD is simultaneous. This is sequential. PD is usually about mutual cooperation. This is about trustworthiness vs. exploitation.
      *   *Addressing "Odd Number":* If 19 students, one group of 3. In a group of 3, two Sponsors, one Candidate? Or rotate?
          *   *Fix:* If odd, one Triad. Two Sponsors, One Candidate. Sponsors compete? No, complicates.
          *   *Better:* If odd, Instructor joins as a player. Or, one person sits out as "Auditor" (scores the board). Auditor gets average points.

      *   *Addressing "Reputation/Iteration":* This is a **One-Shot** game by design. I need to be honest that in real life, reputation solves this, but the game isolates the logic.
      *   *Addressing "Failure Modes":*
          *   Collusion: "I'll say I'll honor, you predict yes." -> Rule: No promises.
          *   Useless Forecast: Random guessing. -> Incentivize accuracy with points.
          *   Refusal to Play: -> Allow "Pass" option for Sponsor, "Keep" for Candidate.
          *   Second Round contamination: -> Only play once. Debrief immediately.

  5.  **Drafting the Content:**

      *   *Timeline:* 75 mins.
          *   0-10: Setup & Rules.
          *   10-20: Conversation Phase (The "Look").
          *   20-30: Decision Writing (Sealed).
          *   30-45: The Reveal (Board work).
          *   45-75: Debrief & Theory (Parfit).
      *   *Wording:* Needs to be precise to avoid legalistic loopholes but strict enough to prevent "I promised."
      *   *Payoff:* Candy vs Points. Keep them separate. Points for Prediction Accuracy (epistemic virtue). Candy for Game Outcome (pragmatic success).
      *   *Debrief:* Map the "Sponsor" to the Driver, "Candidate" to the Hitchhiker. Map the "Dominant Strategy" to CDT. Map the "Prediction" to the disposition.
      *   *Kavka's Toxin:* Can mention in the last 5 mins. "What if I promised to drink poison just to get the money, but once I have the money, why drink?"

  6.  **Review against Constraints:**

      *   *Endogenous Prediction:* Yes, students predict students.
      *   *Public Visibility:* Yes, tally on board.
      *   *Dominant Defection:* Yes, mathematically verified (15 > 11).
      *   *Not PD:* Asymmetric, sequential.
      *   *Odd Number:* Auditor role.
      *   *One-Shot vs Reputation:* Must address this honestly.
      *   *Failure Modes:* Need specific scripts.

  7.  **Final Polish:**

      *   Make sure the "No Promises" rule is clear. If they make promises, the Hitchhiker problem dissolves (it becomes a contract enforcement problem). The Hitchhiker problem is about *non-binding* communication.
      *   Ensure the Prediction Incentive doesn't override the Game Incentive. Prediction points (2) vs Game points (4-6 diff). They are comparable. This creates tension: Do I predict what they *will* do (Keep) or what I *want* them to do (Honor)?
      *   *Wait, critical fix:* If the Sponsor gets points for accurate prediction, they *want* the Candidate to Keep if they predicted Keep. This aligns the Sponsor with the Candidate's rational self-interest!
      *   *Problem:* In Hitchhiker, the Driver wants you to Pay. If the Driver gets points for predicting you won't Pay, and you don't Pay, the Driver is happy (points) but loses the fare (game payoff).
      *   *Adjustment:* Prediction Points must be small enough not to override Game Payoffs, OR the Prediction must be about "Will they Honor?" and the Sponsor *wants* them to Honor for the Game Payoff.
      *   *Conflict:* If I predict "No Honor" and you "Keep", I get Prediction Points but lose Game Points. If I predict "Honor" and you "Keep", I lose Prediction Points AND Game Points.
      *   *Resolution:* The Sponsor's *primary* goal is Game Points. Prediction Points are a bonus (epistemic virtue). This mirrors the Driver: Primary goal is getting paid. Secondary goal is not being fooled (maybe?).
      *   *Actually, Parfit's point:* The Driver leaves you if they predict you won't pay. So the Driver *must* care about the prediction.
      *   *Let's simplify:* Prediction Accuracy = Participation Points (up to 2). Game Outcome = Candy. This separates the incentives cleanly as requested ("Spell out the candy/points conversion separately").
      *   *Okay, Prediction = Class Points. Game = Candy.* This prevents the "optimizing for candy" bloodbath on the prediction part. It makes prediction an intellectual exercise, game is the visceral one.

      *   *Wait, one more check:* "make it publicly visible how accurate the predictors actually were."
      *   Okay, I will have them write predictions on colored cards. Reveal them on the board.

      *   *Failure Mode:* "The kid who refuses to play."
      *   Fix: They can choose "Pass" (Sponsor) or "Keep" (Candidate). They still generate data.

      *   *Failure Mode:* "Collusion."
      *   Fix: The "No Promises" rule + The Dominant Strategy remains dominant even if you promise. (Once in town, you still want to Keep).

      *   *Reputation:* I need to explicitly state: "This game is one-shot. In real life, you see these people again. That changes everything. Today, we are stripping that away."

      *   *Kavka:* "Toxin Puzzle" is about intending to do something irrational. Hitchhiker is about *being the type* who does it. I can bridge them.

      *   *Odd Number:* If 19 students. 9 Pairs = 18. 1 Leftover.
      *   Role: The "Recorder." They tally the board. They get the average prediction score of the class.

      *   *Timeline:* 75 minutes is tight for 22 students to reveal everything on a whiteboard.
      *   Optimization: Don't reveal every single slip. Reveal the *matrix*. (Predicted Yes/No vs Actual Honor/Keep). 4 quadrants. Tally marks.

      *   *Let's write it.*

      *(Self-Correction during drafting)*: I need to make sure the "Dominant Defection" is truly dominant.
      Candidate Payoff:
      - Not Sponsored: 0 (or base 5)
      - Sponsored + Honor: 10 (Ride) - 5 (Cost) = 5
      - Sponsored + Keep: 10 (Ride) - 0 = 10
      *Wait, if Not Sponsored is 0, they desperately want sponsorship.*
      *Let's set Base = 5.*
      - Pass: 5
      - Sponsored + Honor: 5 + 10 - 5 = 10
      - Sponsored + Keep: 5 + 10 - 0 = 15
      *Keep is strictly dominant.*
      Sponsor Payoff:
      - Pass: 5
      - Sponsor + Honored: 5 - 5 (Cost of Drive) + 10 (Fare) = 10
      - Sponsor + Betrayed: 5 - 5 (Cost of Drive) + 0 = 0
      *Sponsor wants to Sponsor ONLY if Honored.*
      *Prediction:*
      - Correct: +2 Points.
      - Incorrect: 0 Points.
      *This works.*

      *Wait, one nuance:* The prompt says "make it publicly visible how accurate the predictors actually were."
      If I just tally quadrants, is that visible enough?
      Yes, if I write "Total Predictions: 22. Correct: 18." on the board.
      Better: "Of the 11 who predicted 'Honor', 2 actually Honored." This shows the *calibration*.

      *Okay, ready to generate.*
answer: |-
  Here is a complete lesson plan designed to meet your constraints, isolate the Parfitian tension, and handle the logistical realities of a 75-minute seminar.

  # Activity: The Sponsorship Protocol

  **Core Concept:** A sequential trust game where the second mover has a strictly dominant strategy to defect, but the first mover's decision depends entirely on a prediction of the second mover's character.
  **Materials:** Whiteboard + markers, 22 Index Cards (Color A), 22 Index Cards (Color B), 22 Envelopes, Bag of Candy.
  **Payoff Separation:**
  *   **Game Outcome:** Candy (Visceral, immediate).
  *   **Prediction Accuracy:** Course Participation Points (Epistemic, graded separately).

  ---

  ## 1. The Rules & Payoff Scheme

  ### Roles
  *   **Candidate (The Hitchhiker):** Needs sponsorship to get the reward. Decides whether to Honor or Keep.
  *   **Sponsor (The Driver):** Decides whether to Sponsor or Pass. Predicts the Candidate's move.

  ### Payoffs (Per Pair)
  *Write this clearly on the board before starting.*

  | **Candidate Payoffs** | **Candy Pieces** |
  | :--- | :--- |
  | **Pass** (No Sponsorship) | 5 |
  | **Sponsored + Honor** (Pay the fare) | 10 |
  | **Sponsored + Keep** (Don't pay) | **15** |

  | **Sponsor Payoffs** | **Candy Pieces** |
  | :--- | :--- |
  | **Pass** (Don't drive) | 5 |
  | **Sponsored + Honored** (Get paid) | 10 |
  | **Sponsored + Betrayed** (Unpaid fare) | 0 |

  | **Prediction Bonus** | **Course Points** |
  | :--- | :--- |
  | **Correct Prediction** | +2.0 Participation Pts |
  | **Incorrect Prediction** | 0.0 Participation Pts |

  *Note to Instructor: The Candidate's dominant strategy is **Keep** (15 > 10 > 5). The Sponsor's rational move is to **Pass** unless they are certain the Candidate will Honor. The Prediction Points incentivize accuracy, not optimism.*

  ### The "No-Promise" Rule
  "You may talk to your partner for 3 minutes. You may discuss your character, your major, your love of candy, or your moral philosophy. **You may not make binding promises.** You cannot say 'I promise to Honor' or 'If you Sponsor, I will Honor.' You can only describe what kind of person you *are*."

  ---

  ## 2. Minute-by-Minute Timeline (75 Minutes)

  | Time | Activity | Instructor Action |
  | :--- | :--- | :--- |
  | **00-10** | **Setup & Distribution** | Hand out envelopes. Assign roles (see Odd Number fix below). Read rules aloud. Write Payoffs on Board. |
  | **10-13** | **The "Look" (Conversation)** | Start timer. Pairs talk. Circulate and enforce "No Promise" rule strictly. |
  | **13-18** | **Decision Phase** | **Silence.** Sponsors write Prediction on Color A card. Both write Decision on Color B card. All go into Envelope. |
  | **18-25** | **Collection & Tally** | Collect envelopes. Open them publicly. Tally the 2x2 Matrix on the whiteboard (Predicted vs. Actual). |
  | **25-30** | **Distribution** | Hand out candy based on results. Announce Prediction Point scores. |
  | **30-75** | **Debrief & Lecture** | Map the game to Parfit. Discuss CDT vs. Disposition. Address limitations. |

  ---

  ## 3. Exact Wording on Cards

  **Color A (Sponsor Only): The Prediction Slip**
  > **PREDICTION**
  > I predict my Candidate will choose:
  > [ ] HONOR
  > [ ] KEEP
  >
  > *Name:* _______________
  > *(This determines your Participation Points)*

  **Color B (Both): The Decision Slip**
  > **DECISION**
  > **Sponsor:** [ ] SPONSOR  [ ] PASS
  > **Candidate:** [ ] HONOR  [ ] KEEP
  >
  > *Names:* _______________
  > *(This determines your Candy)*

  **Envelope Label**
  > Pair #___
  > *Do not seal until both slips are inside.*

  ---

  ## 4. Contingencies & Logistics

  ### The Odd Number Problem (e.g., 19 students)
  If you have 19 students, you have 9 pairs and 1 leftover.
  *   **Role:** The **"Auditor."**
  *   **Task:** They stand at the board during the Tally Phase (18-25). They verify the counts you call out.
  *   **Payoff:** They receive the **average** candy count of the class and the **average** participation points of the Sponsors.
  *   **Why:** This prevents them from feeling excluded and makes them an observer of the "public visibility" requirement.

  ### Candy/Points Conversion
  *   **Candy:** 1 Piece = 1 Unit of Utility. Hand out immediately after tally.
  *   **Points:** 2 Points = 1% of their Participation Grade component. Record these privately on your roster based on the Prediction Slips. Do not mix the two currencies.

  ---

  ## 5. The Debrief: Mapping Structure to Theory

  **Phase 1: The Data (30-40 mins)**
  Look at the whiteboard matrix.
  *   *Quadrant 1 (Predict Honor / Actual Honor):* The Idealists.
  *   *Quadrant 2 (Predict Honor / Actual Keep):* The Suckers (Sponsors lost candy).
  *   *Quadrant 3 (Predict Keep / Actual Honor):* The Missed Opportunities (Sponsors passed up points).
  *   *Quadrant 4 (Predict Keep / Actual Keep):* The Cynics (Accurate, but low yield).

  **Ask:** "Look at Quadrant 2. Why did the Sponsor sponsor?" (Answer: They wanted the 10 candy, ignored the risk).
  **Ask:** "Look at the Candidates who Kept. Did you make a mistake?" (Answer: No. 15 > 10. You played rationally).
  **Ask:** "Look at the Candidates who Honored. Why?" (Answer: Guilt, reputation, confusion).

  **Phase 2: The Hitchhiker (40-55 mins)**
  *   **Reveal:** "This is Parfit's Hitchhiker."
  *   **The Map:**
      *   Candidate = Hitchhiker in the desert.
      *   Sponsor = Driver passing by.
      *   Conversation = The Driver looking into your eyes.
      *   Keep = Refusing to pay once in town.
  *   **The Lesson:** Standard Rationality (Causal Decision Theory) dictates you **Keep**. But if you are *known* to be that kind of person, you never get the ride (Sponsor Passes). To get the ride, you must be the *kind of person* who Honors, even when Honoring is irrational.
  *   **Key Phrase:** "Rationality is self-defeating. To win, you must be irrational."

  **Phase 3: Kavka's Toxin (55-60 mins)**
  *   **Gesture:** "Gregory Kavka asked: If a billionaire offers you $1M just to *intend* to drink a harmless toxin tomorrow (you don't actually have to drink it, just intend), can you form that intention?"
  *   **Link:** "In our game, the Candidate wanted the Sponsor to *believe* they would Honor, without actually committing to Honor. Kavka asks if you can genuinely intend something you know you won't do. Parfit says you can't intend it, but you can *be* it."

  **Phase 4: Limitations (60-75 mins)**
  (See "What This Cannot Reproduce" below).

  ---

  ## 6. Honesty Check: One-Shot vs. Reputation

  **Can you make this one-shot?**
  **No.** Not truly.
  Even in a single class, students care about how they look to you (the instructor) and to their peers. A Philosophy major might Honor to signal virtue. An Econ major might Keep to signal rigor. The "Prediction" isn't just about the game; it's about social signaling.

  **How to say this out loud:**
  "In this game, I told you this was one-shot. But it wasn't. You are in a seminar. You care about your grade. You care about looking like a cooperator or a ruthless maximizer to your classmates. In the real Hitchhiker problem, you are never seen again. Here, you have to walk out of this room with these people. That 'shadow of the future' is contaminating our data. If you Honored when you wanted to Keep, ask yourself: Did you do it for the candy, or because you didn't want to look like a defector on a whiteboard?"

  ---

  ## 7. What This Activity Cannot Reproduce (Limitations)

  You must supply these by hand in the lecture portion:

  1.  **True Anonymity:** Students know their decisions are recorded by you. They cannot truly defect without social cost.
      *   *Fix:* Acknowledge this. "In the real desert, the driver doesn't know your name. Here, I do."
  2.  **Noisy Prediction:** In the game, prediction is binary (Yes/No). In Parfit, the driver's "psychic power" is probabilistic (e.g., 90% accurate).
      *   *Fix:* Use the Tally Matrix. "Look, we had 70% accuracy. That's not perfect, but it's enough to punish defectors."
  3.  **The "Disposition" Mechanism:** The game forces a *choice* to Honor/Keep. Parfit argues you don't *choose* at the moment; your character is already fixed.
      *   *Fix:* "You made a choice today. Parfit argues you shouldn't have been able to. If you're rational, you Keep. If you Honor, you're irrational. The trick is to be the kind of person for whom Honoring isn't a choice."
  4.  **Lying Availability:** Students can lie during the 3-minute talk.
      *   *Fix:* Remind them: "Cheap talk is free. The Driver knows it's cheap. That's why the Prediction matters more than the Promise."

  ---

  ## 8. Failure Modes & In-the-Moment Fixes

  **1. The "Useless Forecast" (Random Guessing)**
  *   *Symptom:* A Sponsor flips a coin or writes "Keep" for everyone to guarantee 50% accuracy.
  *   *Fix:* The Participation Points (2.0) are high enough to matter, but low enough not to override Candy. If you notice this during the debrief, point it out: "If you treat your classmate as a random variable, you fail the spirit of the prediction. The Driver in Parfit isn't guessing; they're *reading*."

  **2. Collusion / Side Deals**
  *   *Symptom:* You hear "I'll split the candy with you if you Honor."
  *   *Fix:* **Intervene immediately.** "That is a binding contract. The Hitchhiker problem only exists when contracts are unenforceable. If you make a deal, you leave the game." (Threaten to void their candy if caught).

  **3. The "Moralizer"**
  *   *Symptom:* A student refuses to Keep on principle, ruining the dominant strategy dynamic.
  *   *Fix:* Do not shame them. In debrief, use them. "Student X Honored. Was it rational? No. Was it moral? Maybe. Parfit isn't talking about morality; he's talking about *winning*. If winning requires being moral, then morality is instrumentally rational."

  **4. The "Refusal to Play"**
  *   *Symptom:* A student sits silently and hands in blank slips.
  *   *Fix:* Allow it. Treat "Blank" as "Pass" for Sponsor and "Keep" for Candidate. They still generate data (a non-participation data point). Give them average candy to avoid disruption.

  **5. Round-Two Contamination (If you run it twice)**
  *   *Symptom:* Don't run it twice.
  *   *Fix:* If you feel the need for more data, run a **second round with roles swapped** ONLY IF you explicitly frame it as "Now we add Reputation." This allows you to teach how iteration solves the problem, contrasting it with the one-shot failure. *Recommendation: Stick to one round to preserve the Hitchhiker analogy.*

  **6. The "Predictor's Dilemma"**
  *   *Symptom:* A Sponsor predicts "Keep" because they know it's rational, but then Sponsors anyway hoping for the best.
  *   *Fix:* Highlight this in the Tally. "This person predicted betrayal and invited it. Why? Hope over reason. That's not rationality; that's optimism."

  ---

  ## 9. Final Instructor Note

  The success of this lesson hinges on the **Tally Phase (18-25 mins)**. Do not rush this.
  When you open the envelopes, write the numbers on the board with ceremony.
  *   "Total Pairs: 11"
  *   "Sponsors who Passed: __"
  *   "Sponsors who Sponsored: __"
  *   "Of those Sponsored, Honored: __"
  *   "Prediction Accuracy: __%"

  If the accuracy is high (e.g., >80%), the room will feel the weight of "being read." If accuracy is low (e.g., <50%), the lesson shifts to "why trust is impossible." Both are valuable. Let the data drive the theory, not the other way around.
