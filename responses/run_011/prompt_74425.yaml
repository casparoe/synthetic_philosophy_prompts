      *Wait, looking closer at 6:* "A partner... who boxed up my food... would be doing something objectionable." This is about *paternalism*. Paternalism is objectionable because it violates autonomy. Claim 7 says autonomy is effectively nonexistent at the moment of action. This is the core crack.

