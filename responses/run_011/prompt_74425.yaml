      *   Section 3: The "Looks Bad But Isn't" (1 vs. 4, 2 vs. 1). Explain the philosophy here clearly.
      *   Section 4: Methodological Consistency (8).
      *   Conclusion: Summary of the trade-off.

      *   *Self-Correction on Tone:* The user asked *not* to hedge. Be direct. "Claim 7 is doing too much work." "Claim 6 collapses without a stronger agency than 7 allows."
      *   *Check Constraints:* Did I say which pairs *can* be true? Yes (1 & 4). Did I say what goes and what is lost? Yes. Did I avoid asking them to choose? Yes.

  6.  **Final Polish:**
