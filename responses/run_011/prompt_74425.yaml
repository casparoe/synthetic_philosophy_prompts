      *   Ensure the distinction between *ontological* selves (Claim 4) and *temporal* preferences (Claim 1) is clear.
      *   Make sure the "What goes/What is lost" sections are punchy.

      *(Self-Correction during drafting)*: I need to be careful with Claim 7. "Could not have done otherwise in any sense that it would have helped to tell him about." This is a specific pragmatic formulation, not necessarily hard metaphysical determinism. It leaves a tiny door open. I should address that nuance. It softens the blow but doesn't remove the tension with Claim 6 (which relies on the *normative* significance of consent, not just the pragmatic utility).

      *Revised Plan for Tension 1:* Focus on the conflict between the *normative weight of consent* (6) and the *pragmatic exculpation* (7). If 7 is true, 6's distinction is merely aesthetic, not moral.

      *Revised Plan for Tension 2:* 1 vs 4. This is the "Multiple Selves" trap. User thinks it might be a contradiction. I need to confirm it's *not* a contradiction, provided "Self" is defined as the locus of evaluation, not the locus of impulse.

      *Let's finalize the ranking:*
      1.  **7 vs. 6 (The Autonomy Paradox):** Hardest hit. If no agency, consent doesn't matter.
      2.  **7 vs. 5 (The Normative Gap):** If no agency, "mistake" loses bite.
