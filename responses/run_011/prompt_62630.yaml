  **Incident Postmortem: SZILARD-1 Memory Pressure & Thermal Runaway**
  **Date:** 2024-10-24
  **Severity:** SEV-1
  **Status:** Resolved

  **Summary**
  On October 24, 2024, the SZILARD-1 sidecar service experienced a memory exhaustion event leading to a forced garbage collection flush. SZILARD-1 operates a single-molecule engine sidecar that measures particle position, inserts a partition, and extracts work isothermally from a single heat bath. While work extraction has been positive for two quarters, the measurement metadata buffer lacked an upper bound. When the buffer filled, the on-call engineer triggered a manual flush. This erasure operation dissipated heat exceeding the rack's thermal design power (TDP), causing hardware failure in Rack 4B. The incident is classified as a capacity planning failure.

  **Impact**
  *   15 minutes of partial availability loss for downstream workloads.
  *   Permanent hardware damage to Rack 4B (32 nodes).
  *   Unexpected spike in datacenter cooling costs for Q3.
  *   Dashboard remained green throughout the incident due to work-output-only monitoring.

  **Timeline (UTC)**
  *   **02:45** – SZILARD-1 measurement buffer reaches 95% capacity. No alerts fired; memory growth is within expected exponential bounds.
  *   **03:12** – Buffer hits 100%. SZILARD-1 pauses work extraction to prevent particle decoherence.
  *   **03:15** – On-call engineer acknowledges page. Slack message: *" demon memory is pegged. gonna hard flush the register to clear the partition log. brb."*
  *   **03:17** – Flush operation initiates. Bit erasure begins at scale.
  *   **03:18** – Rack 4B ambient temperature exceeds 85°C. Thermal throttling fails.
  *   **03:20** – Rack 4B offline. Incident declared SEV-1.
  *   **03:35** – Service restored on备用 Rack 4C.

  **Root Cause**
  The immediate cause was the thermal load generated by resetting the demon's memory state. While the measurement phase of the SZILARD-1 cycle is theoretically reversible and energetically free, the reset phase is not. The forced flush performed a bulk erasure of stored bits, dissipating $kT \ln 2$ per bit into the local environment. The aggregate heat output exceeded the cooling capacity of Rack 4B.

  **Contributing Factors**
  *   **Unbounded Queue:** The measurement log had no retention policy, assuming storage was cheaper than energy.
  *   **Design Review Waiver:** The initial architecture review was waived by an intern who noted the Second Law of Thermodynamics is a statistical tendency rather than a hard constraint. While technically correct regarding fluctuation theorems, this distinction provides zero practical headroom for rack-scale deployment.
  *   **Monitoring Gaps:** Alerts were configured on work output (voltage), not entropy debt (memory usage).

  **The Five Whys**
  1.  **Why did Rack 4B fail?** Thermal runaway caused by a sudden heat spike.
  2.  **Why was there a heat spike?** The on-call engineer flushed the measurement buffer.
  3.  **Why was a flush required?** The memory buffer was unbounded and filled up.
  4.  **Why was the buffer unbounded?** We assumed measurement data could be stored indefinitely without cost.
  5.  **Why was storage assumed free?** We conflated measurement (free) with erasure (costly), overlooking Landauer's Principle in the capacity plan.

  **Lessons Learned**
  *   Entropy is a resource that must be budgeted like CPU.
  *   The business model relies on batching erasures into off-peak cooling windows. This is effectively an entropy line of credit.
  *   We nearly realized that the work extracted per cycle equals the cost to erase the memory of that cycle, meaning net energy gain is zero and we are merely arbitraging the timing of heat dissipation. However, this reconciliation was deprioritized as a finance issue rather than engineering.
  *   Statistical loopholes in thermodynamics do not constitute SLA guarantees.

  **Action Items**

  | Item | Owner | Due Date | Status |
  | :--- | :--- | :--- | :--- |
  | Implement bounded queue with backpressure on measurement intake. | Backend Team | 2024-11-01 | Done |
  | Evaluate reversible computation stack to eliminate erasure costs entirely. | Architecture | 2024-12-15 | Proposed |
  | Increase thermal headroom on Rack 4B by installing larger heat sinks. | Infra | 2024-11-10 | In Progress |
  | Update runbook to prohibit manual flushes during peak thermal load. | SRE | 2024-11-05 | Done |

  **Sign-off**
  No humans were at fault; the universe balanced the books.
