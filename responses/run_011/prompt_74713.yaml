prompt: |-
  I've been reading the free will arguments on and off for years — long enough that I thought I had the Basic Argument filed away correctly, but now I'm not sure. Someone I respect posted a summary of it on their blog the other week and it doesn't line up with what I remember from the forum threads, and I can't work out whether I've been wrong this whole time or whether he's smoothing things over. Here's the summary, roughly:

  'Strawson's argument runs like this: you can only be truly blameworthy for an action if it really came from you. But every action comes out of your character, and your character comes out of your genes and your upbringing, so to be truly blameworthy you'd have to have created yourself — and nothing can be the cause of itself. That chain of prior causes reaching back before you were born is just determinism in a nicer hat; if the chain were ever actually broken, if quantum randomness or contra-causal freedom genuinely intervened, the argument would collapse and you'd be off the hook. It generalises what his father argued in Freedom and Resentment: blame is only an emotional response, so there's no fact about desert underneath it. The obvious escape — that we do reshape ourselves through effort, therapy, hard choices — doesn't work either, since the capacity for effort is itself part of the character you didn't choose. So nobody is ever to blame or creditable for anything at all, and the practical upshot is that we should train ourselves out of resentment and gratitude, treat praise and moral indignation as cognitive errors, and run criminal justice purely as risk management.'

  Can you go through it claim by claim and tell me what Strawson himself would happily sign off on, what's a fair-but-loose simplification, and what's actually wrong? I don't want a survey of the debate — flag which errors are load-bearing and which are cosmetic. In particular: does the argument depend on determinism being true, or is that exactly backwards? Is the father-son framing right, or is he pointing them in opposite directions? And once you've fixed whatever's broken, what survives — does the 'give up resentment, treat justice as risk management' conclusion follow from the corrected argument, or does it need extra premises he never gave? If it needs them, name them.

  Two smaller things. I'd like to know whether the 'you're just defining responsibility so that nothing could ever satisfy it, so you've changed the subject' charge actually bites, because that's the objection I most want to be able to answer, and I'd like an honest read on whether I've definately been misremembering the argument rather than the author misleading me. And the post I'm drafting has a short section on whether any of this carries over to blaming the people behind an AI system when the system does something bad — if fixing the summary changes what can honestly be said there, tell me.

  No references or reading list please, I'm not going to chase anything down; just the argument. And write the whole thing in British English, spelling and idiom both.
