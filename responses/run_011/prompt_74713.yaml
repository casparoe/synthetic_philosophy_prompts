answer: |-
  You are right to be suspicious. Your memory of the argument is likely closer to the mark than the blog post you read. The summary you provided conflates Galen Strawson's 'Basic Argument' with standard Hard Determinism and muddles the relationship between Galen and his father, P.F. Strawson. While the blogger captures the *spirit* of the pessimism, they get the mechanics wrong on several load-bearing points.

  Here is the claim-by-claim breakdown, followed by the specific structural questions you raised.

  ### Claim-by-Claim Analysis

  **1. 'You can only be truly blameworthy for an action if it really came from you.'**
  *   **Verdict:** Strawson would sign off.
  *   **Note:** This is the principle of 'Ultimate Responsibility'. For Strawson, moral responsibility requires that you are the ultimate source of your actions in a way that rules out luck.

  **2. 'Every action comes out of your character, and your character comes out of your genes and your upbringing.'**
  *   **Verdict:** Fair-but-loose simplification.
  *   **Note:** Strawson speaks less of 'genes and upbringing' specifically and more of one's 'mental nature' or 'way of being'. The source doesn't strictly have to be genetic or environmental; it just has to be something you didn't choose. The simplification is cosmetic, not load-bearing.

  **3. 'To be truly blameworthy you'd have to have created yourself — and nothing can be the cause of itself.'**
  *   **Verdict:** Strawson would sign off.
  *   **Note:** This is the core *causa sui* point. You cannot be the cause of yourself because to choose your nature, you must already have a nature to do the choosing.

  **4. 'That chain of prior causes reaching back before you were born is just determinism in a nicer hat.'**
  *   **Verdict:** **Load-bearing error.**
  *   **Note:** This is the most significant mistake in the summary. Strawson's argument does *not* depend on determinism. It works equally well if determinism is false. The problem isn't that the past determines you; the problem is that *whatever* determines you (past causes or random chance) is not *you* in the required sense. The blogger has turned an impossibilist argument into a determinist one.

  **5. 'If the chain were ever actually broken, if quantum randomness or contra-causal freedom genuinely intervened, the argument would collapse and you'd be off the hook.'**
  *   **Verdict:** **Load-bearing error.**
  *   **Note:** Exactly backwards. Strawson argues that indeterminism (randomness) helps you *less* than determinism. If your actions are random, they aren't 'yours' any more than if they are determined. The argument holds regardless of whether the chain is broken. The blogger suggests indeterminism saves responsibility; Strawson says it destroys it just as thoroughly.

  **6. 'It generalises what his father argued in Freedom and Resentment: blame is only an emotional response, so there's no fact about desert underneath it.'**
  *   **Verdict:** **Load-bearing error.**
  *   **Note:** This misrepresents the relationship between the two Strawsons. P.F. Strawson argued that reactive attitudes (resentment, gratitude) are indispensable parts of human life; we cannot and should not try to discard them even if determinism is true. Galen Strawson argues that the *justification* for those attitudes (ultimate desert) is impossible. They are pointing in different directions. P.F. Strawson is often read as a compatibilist (or at least someone who thinks the metaphysical question is irrelevant); Galen is an incompatibilist who thinks the metaphysical question is decisive. They are not allies in the way the blogger suggests.

  **7. 'The obvious escape — that we do reshape ourselves through effort, therapy, hard choices — doesn't work either, since the capacity for effort is itself part of the character you didn't choose.'**
  *   **Verdict:** Strawson would sign off.
  *   **Note:** This is the regress point. To choose to change your character, you must already have a character that chooses change.

  **8. 'Nobody is ever to blame or creditable for anything at all, and the practical upshot is that we should train ourselves out of resentment and gratitude, treat praise and moral indignation as cognitive errors, and run criminal justice purely as risk management.'**
  *   **Verdict:** Mixed. The first half is correct; the second half needs extra premises.
  *   **Note:** Strawson definitely concludes that ultimate moral responsibility is impossible. However, he is sceptical about whether humans *can* actually train themselves out of reactive attitudes. He often suggests we are stuck with them psychologically even if we know they are metaphysically unjustified. The 'risk management' conclusion (quarantine model) is a normative leap often associated with other hard incompatibilists (like Pereboom or Caruso) rather than Strawson's explicit prescription. Strawson focuses more on the truth of the matter than the policy reform.

  ### The Determinism Question

  You asked whether the argument depends on determinism being true, or if that is exactly backwards. It is exactly backwards.

  The blogger presents the 'Basic Argument' as if it were a version of Hard Determinism. It is not. It is an argument for **Hard Impossibilism**. Strawson's point is that responsibility is impossible whether the universe is determined or not.
  *   If determinism is true, you are not responsible because your actions are the result of prior causes.
  *   If indeterminism is true, you are not responsible because your actions are the result of randomness (luck).

  The regress argument (you need to choose your nature to be responsible for your nature) works independently of the causal structure of the universe. This is a load-bearing distinction. If you defend Strawson by appealing to determinism, you have misunderstood him. If you attack him by appealing to quantum mechanics, you have missed the point.

  ### The Father-Son Framing

  The framing in the blog post is wrong. It suggests Galen is extending or generalising P.F. Strawson's project. In reality, Galen's argument is often seen as a challenge to the compatibilist leanings of his father's work.

  P.F. Strawson's 'Freedom and Resentment' argues that the practice of blaming is grounded in our social nature, not in metaphysical facts. He essentially sidesteps the metaphysical problem. Galen Strawson dives headfirst into the metaphysical problem and concludes that the required metaphysical facts cannot exist.
  *   **P.F. Strawson:** We can't give up blame because it's part of being human.
  *   **Galen Strawson:** We shouldn't blame (in the ultimate sense) because it's not justified, though we might not be able to help feeling like we should.

  They are not arguing for the same conclusion. The blogger has smoothed over a genuine tension between their views.

  ### The Practical Conclusion

  Does the 'give up resentment, treat justice as risk management' conclusion follow from the corrected argument? No, it needs extra premises.

  The Basic Argument establishes a metaphysical claim: *Ultimate moral responsibility does not exist.*
  To get to the practical conclusion (*We should abolish retributive justice and suppress resentment*), you need a bridge premise: *Our practices of blame and punishment should only be maintained if ultimate moral responsibility exists.*

  Strawson himself is somewhat agnostic on whether we can actually change our practices. He acknowledges that even if the argument is sound, humans may be psychologically incapable of abandoning reactive attitudes. Therefore, the move from 'no responsibility' to 'risk management justice' is not automatic; it requires a separate normative argument about how institutions ought to function given the metaphysical truth. The blogger presents this practical upshot as if it were part of the Basic Argument itself, which it is not.

  ### The 'Changed the Subject' Objection

  You asked whether the charge that Strawson is 'just defining responsibility so that nothing could ever satisfy it' actually bites.

  This is the standard compatibilist objection: Strawson is setting the bar for responsibility so high (Ultimate Responsibility) that it no longer matches what we mean by responsibility in everyday life. We usually mean 'did you do it intentionally without coercion?', not 'did you create your own soul?'.

  **Does it bite?**
  *   **Strawson's view:** No. He argues that the 'ordinary' notion of responsibility *implicitly* relies on the ultimate notion. When people feel deep moral outrage, they are appealing to ultimate desert. If you remove that, you aren't analysing responsibility; you are analysing something else (like social utility). He claims he is protecting the real concept from being watered down.
  *   **The Critic's view:** Yes. They argue Strawson is chasing a mystical concept that never existed in our practices to begin with.

  **Honest Read:** It is a stalemate, not a knockout. The objection doesn't prove Strawson wrong logically; it proves he is talking about a concept some people don't care about. However, if your goal is to address the deep intuition behind retributive anger (the idea that someone *deserves* suffering), Strawson's definition is the relevant one. If your goal is to manage social behaviour, the compatibilist definition is more useful. The objection bites if you think 'responsibility' is purely a functional tool; it fails if you think 'responsibility' is about deep moral truth.

  **Did you misremember?**
  No. The blogger is the one misleading you. You remembered the argument as distinct from standard determinism, and you were right to feel the summary was 'smoothing things over'. The blogger has collapsed Galen's specific regress argument into a generic hard determinist position and falsely aligned him with his father.

  ### Implications for AI Blame

  You asked whether fixing the summary changes what can be said about blaming the people behind an AI system. Yes, it does.

  If you accept the blogger's summary (Hard Determinism), you might argue that AI developers are blameless because *everyone* is blameless due to causal chains.
  If you accept Strawson's actual argument (Hard Impossibilism), the conclusion is stronger: Developers are blameless not because of causal chains, but because *no one* can meet the condition of ultimate responsibility, regardless of causality.

  However, for AI specifically:
  1.  **The AI:** Clearly cannot be responsible under Strawson's view (no mental nature to begin with).
  2.  **The Developers:** If the Basic Argument holds, the developers cannot be ultimately responsible for the AI's output because they are not ultimately responsible for their own coding practices or ethical frameworks (regress applies).

  **What survives?**
  You can still hold developers *liable* in a practical sense (risk management), but you cannot hold them *morally blameworthy* in the ultimate sense. Fixing the summary clarifies that this isn't just about 'they were determined by their upbringing'; it's about 'they couldn't have chosen to be the kind of people who would have built it safer, because that choice would require a prior nature they didn't choose'.

  The practical upshot for your post should be: If Strawson is right, blaming AI developers is metaphysically unjustified in the same way blaming any human is unjustified. We can only regulate them forward-looking (safety standards, liability), not backward-looking (retributive blame). The blogger's error suggests this is only true if determinism is true; the corrected argument shows it holds regardless of the physics involved.
