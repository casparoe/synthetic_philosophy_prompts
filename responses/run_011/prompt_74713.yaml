      *   *"Changed the Subject" Objection:* This is the "compatibilist revisionism" objection. Strawson anticipates this. He argues he is capturing the *real* notion of responsibility people care about (ultimate desert), not a watered-down version. Whether it bites depends on whether one accepts that "ultimate desert" is the only coherent notion. Strawson says yes; compatibilists say no. It's a stalemate, not a knockout.
      *   *User's Memory vs. Blogger:* The user is likely right to be suspicious. The blogger conflates Galen's Basic Argument with standard Hard Determinism and conflates Galen with P.F. Strawson.
