      *   *The Alternative:* Split the difference. $S = (A_1 + W_2) / 2$ (roughly). This implies equal *absolute* concessions if ranges are equal.

  3.  **Analyze the Friend's Claim (Kalai-Smorodinsky):**

      *   *KS Solution:* In bargaining theory, KS maximizes the utility of both parties subject to the constraint that their utility ratios equal the ratio of their maximum possible utilities (ideal point).
      *   *Formal KS:* Requires a feasible set of utility pairs $U$. Requires an disagreement point $d$. Requires ideal points $u^*$. The solution lies on the Pareto frontier on the line connecting $d$ to $u^*$.
      *   *Does the mediation practice match?*
          *   The mediation practice normalizes utilities linearly between $W$ (disagreement?) and $A$ (ideal?).
          *   If $W$ is the disagreement point (utility 0) and $A$ is the ideal point (utility 1), then equal fractional concession means both get utility $1-k$.
          *   This *looks* like KS *if* the feasible set is linear and the ideal points are defined by the aspirations.
          *   *Crucial Flaw:* KS requires the *feasible set* to be known. In mediation, the mediator doesn't know the true feasible set, only the claimed ranges. Also, KS uses the *disagreement point* as the zero, but the prompt says "walk-away point". In litigation, walk-away *is* the disagreement point (BATNA). So that aligns.
