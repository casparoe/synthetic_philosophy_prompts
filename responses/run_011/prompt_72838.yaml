          *   If $U_i(S) = (S - W_i) / (A_i - W_i)$, then equal fractional concession means $U_1 = U_2$. This is the **Egalitarian Solution** (Kalai, 1977), not necessarily Kalai-Smorodinsky (1975). KS preserves ratios of *maximum possible gains*. Egalitarian preserves *equal utility*.
