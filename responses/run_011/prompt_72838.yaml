  4.  **Analyze the User's Claim (Folk Custom/Incoherence):**

      *   *Incoherence:* Switching between "equal fraction" and "split the difference" (equal absolute).
      *   *Validity:* If ranges are equal ($R_1 = R_2$), then equal fraction *is* equal absolute. So the rules are consistent *when ranges are comparable*. The switch happens when ranges are *not* comparable.
      *   *Sincerity:* Aspirations ($A$) are strategic. If $A$ is inflated, the range $R$ expands. If I inflate $A$, my fraction of concession drops for a given $S$. This incentivizes lying.
      *   *Utility:* Dollars are not utility. Normalization ($/R$) attempts to fix interpersonal comparison, but assumes linear utility over the range.

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the depth of the question. Validate both sides partially. The friend is right about the *structure*, wrong about the *specific theorem*. The user is right about the *fragility*, wrong about the *incoherence*.
      *   **1. The Theory of Value (Cardinality & Comparability):**
          *   Does dollars = utility? No.
          *   Does normalization fix it? It assumes *linear* utility within the range. It assumes the "pain" of moving from $A$ to $W$ is comparable across parties once normalized.
          *   It implicitly assumes **Interpersonal Comparability of Normalized Utility**. It says "100% of your range is worth as much to you as 100% of my range is to me." This is a strong ethical assumption, not a mathematical necessity.
      *   **2. The Baseline (Walk-away vs. Status Quo):**
          *   Why Walk-away ($W$)? In bargaining theory, this is the **Disagreement Point** ($d$).
          *   Why not Status Quo? Because the Status Quo might be unstable or irrelevant if the relationship is breaking (partnership breakup). The BATNA (Best Alternative to Negotiated Agreement) is the true threat point.
          *   Using $W$ as the zero-point defines the "surplus" to be divided.
      *   **3. Sincerity of Aspiration ($A$):**
          *   This is the weakest link. $A$ is not the "Ideal Point" in the game-theoretic sense (which is usually the maximum feasible). $A$ is a strategic anchor.
          *   The rule incentivizes inflating $A$. If $A$ goes up, Range goes up, Concession Fraction goes down for same $S$.
          *   The practice *presupposes* the mediator can "extract" the real number (caucus trust), or that social norms/shame limit inflation. It relies on the mediator's ability to reality-test, not just calculate.
      *   **4. Coherence (Two Rules?):**
          *   Are they incompatible?
          *   Rule 1: Equal Relative Concession (ERC).
          *   Rule 2: Split the Difference (Equal Absolute Concession).
          *   If Ranges are equal, ERC = EAC.
          *   If Ranges are unequal, they diverge.
          *   Why switch? If ranges are vastly unequal, ERC might look unfair (e.g., one side has a tiny range, the other huge). Splitting the difference ignores the range size.
          *   Actually, usually mediators use "Split the Difference" on the *Zone of Possible Agreement (ZOPA)*, not the Aspirations.
          *   If the prompt implies they switch based on "comparable size," the practice is **context-sensitive**, not necessarily incoherent. It prioritizes simplicity when complexity (normalization) doesn't change the outcome much.
          *   However, theoretically, they rest on different axioms. ERC = Egalitarian/Minimax Relative Concession. Split Diff = Nash Bargaining Solution (under specific symmetry conditions).
          *   So yes, hosting both implies a pragmatic eclecticism rather than a single theoretical commitment.
      *   **5. The Friend's Error (KS vs. Reality):**
          *   **KS Specifics:** KS requires knowledge of the *Feasible Set* (the Pareto Frontier). Mediators don't know this. They only know the *claimed* ranges.
          *   **Common Knowledge:** Game theory assumes $A$ and $W$ are known to all. Mediation relies on *private* information (caucus).
          *   **Ideal Point:** KS uses the maximum *feasible* utility. Mediation uses the maximum *claimed* aspiration. These are different.
          *   **Conclusion on Friend:** He identifies the *geometry* correctly (linear normalization), but misidentifies the *solution concept* (it's closer to Minimax Relative Concession or Egalitarian) and ignores the information constraints.

  6.  **Refining the Argument:**

      *   *Key Distinction:* The "Equal Relative Concession" principle is formally known as **Gauthier's Minimax Relative Concession** (from *Morals by Agreement*), though it shares DNA with the **Egalitarian Bargaining Solution**. Kalai-Smorodinsky is about preserving the ratio of *maximum potential gains*, which, if normalized to 1, looks like Egalitarian. I need to be precise here. KS connects the disagreement point to the *ideal point* (utopia point). If the ideal point is defined as the Aspiration, and disagreement as Walk-away, and we seek the intersection with the Pareto line... yes, it's KS *geometry*.
      *   *But:* KS assumes the ideal point is *feasible* (or at least the supremum of the feasible set). In mediation, the Aspiration is often *not* feasible (it's outside the ZOPA). If $A_1 > A_2$ (in a money split), the aspirations don't meet. The KS solution requires the ideal point to be $(u_1^*, u_2^*)$. If aspirations are incompatible, the "ideal point" is outside the feasible set. KS draws a line from $d$ to $u^*$. The mediation rule does exactly this *if* we treat the settlement line as the feasible frontier.
      *   *Wait, check the math:*
          *   Side 1 Utility: $u_1 = (S - W_1) / (A_1 - W_1)$. (Gain from walkaway, normalized).
          *   Side 2 Utility: $u_2 = (S - W_2) / (A_2 - W_2)$? No, usually zero sum.
          *   Let's assume the "fraction surrendered" formulation.
          *   Surrender 1: $(A_1 - S) / (A_1 - W_1) = 1 - u_1$.
          *   Surrender 2: $(S - W_2) / (A_2 - W_2)$... wait, if Side 2 wants low $S$, their aspiration is low.
          *   Let's assume standard "Surplus Division".
          *   The rule "Equal Fraction Surrendered" is mathematically equivalent to "Equal Fraction Gained" *only if* the settlement is exactly in the middle of the normalized utilities.
          *   Actually, if I surrender 50% of my range, I gain 50% of my range (from bottom).
          *   So the rule is: **Equal Normalized Utility**. This is the **Egalitarian Solution**.
          *   KS Solution: $u_1 / u_1^* = u_2 / u_2^*$. If $u^*$ is normalized to 1 for both, KS = Egalitarian.
          *   So the friend is *technically* correct that it matches KS *under normalization*, but practically wrong because the inputs ($A$) are not true ideal points.
      *   *The "Split the Difference" Rule:* This is the **Nash Bargaining Solution** if the feasible set is linear and symmetric and disagreement is 0.
      *   *Incoherence:* Using Egalitarian (KS) sometimes and Nash (Split Diff) other times. They coincide under symmetry. If ranges are "comparable size," symmetry is assumed. So the practice is: "Use Egalitarian generally, but if symmetry is plausible, use Nash because it's simpler." This is pragmatically coherent, theoretically eclectic.

  7.  **Final Polish:**

      *   Tone: Academic, authoritative, mediating the dispute.
      *   Structure: Address the specific questions in the prompt.
      *   Verdict: Friend is right on form, wrong on substance. User is right on fragility, wrong on incoherence. The practice is a "heuristic approximation" of bargaining theory, constrained by information asymmetry.

      *(Self-Correction during drafting)*: Be careful not to conflate KS and Egalitarian too much. KS is monotonic path independence. Egalitarian is equal utility. They coincide on the line $u_1=u_2$ if ideal points are equal. The mediation rule forces $u_1=u_2$ (normalized). So it is the Egalitarian solution. The friend calls it KS. This is a common conflation because KS also uses the ideal point. I should point out this distinction.

      *Wait, one more check:* "Surrendered the same fraction of the distance between its own aspiration and its own bottom line."
      *   Side 1: Range $R_1 = A_1 - W_1$. Settlement $S$. Surrender $X_1 = A_1 - S$. Fraction $f = X_1/R_1$.
      *   Side 2: Range $R_2 = A_2 - W_2$. Settlement $S$. Surrender $X_2 = S - W_2$ (assuming $W_2$ is their best case). Fraction $f = X_2/R_2$.
      *   So $ (A_1 - S)/R_1 = (S - W_2)/R_2 $.
      *   This implies $ 1 - (S-W_1)/R_1 = (S-W_2)/R_2 $.
      *   This does *not* imply equal normalized gain. It implies equal normalized *loss from aspiration*.
      *   If $S$ is the deal, Side 1 gets $S$. Gain from $W_1$ is $S-W_1$. Normalized Gain $g_1 = (S-W_1)/R_1$.
      *   Surrender fraction $f_1 = 1 - g_1$.
      *   So Equal Surrender Fraction $\iff$ Equal Normalized Gain.
      *   Okay, so it *is* the Egalitarian Solution (Equal Normalized Utility).
      *   Friend says KS. KS *is* the Egalitarian solution *if* the ideal point is $(1,1)$. In this context, Aspiration is treated as the Ideal Point (Utility 1) and Walk-away as Disagreement (Utility 0).
      *   So the Friend is substantively correct on the *geometry*, but the User is correct that the *inputs* are bogus.

      *Final Plan:*
      1.  Validate the Friend's geometric intuition (it *is* axiomatic bargaining).
      2.  Validate the User's skepticism (inputs are strategic, not truthful).
      3.  Address Utility Comparability (Normalization attempts it, but assumes linearity).
      4.  Address Baseline (Walk-away = Disagreement Point).
