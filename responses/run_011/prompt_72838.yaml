          *   Plaintiff: Wants $A_P$, Bottom $W_P$.
          *   Defendant: Wants to pay $W_D$ (best), Max $A_D$ (worst/walk-away).
          *   Actually, the prompt says "opening aspiration" and "walk-away point".
