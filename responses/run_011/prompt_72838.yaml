answer: |-
  This is a sophisticated dispute that cuts to the heart of how normative theory meets institutional practice. You are both partially right, and both partially wrong. Your friend correctly identifies the *geometry* of the practice but misidentifies the *theorem* and ignores the information constraints. You correctly identify the *fragility* of the inputs but underestimate the *pragmatic coherence* of the dual rules.

  Here is a reconstruction of the implicit theory, separating what the practice requires from what it merely hopes for.

  ### 1. The Theory of Value: Cardinality and Comparability
  **Does settling in dollars assume comparable utilities?**
  Yes, but with a caveat. Raw dollars are not interpersonally comparable utilities. A \$10,000 concession might ruin a small business but be negligible to an insurer. If the mediator simply split the dollar difference, they would be assuming marginal utility of money is constant and identical for both parties.

  **Does the per-side normalization do all the work?**
  The "equal fractional concession" rule attempts to solve this by normalizing the scale. By converting dollars into a percentage of the "range" ($0$ to $1$), the practice assumes **Linear Interpersonal Comparability of Normalized Utility**.
  *   **Strict Requirement:** It requires that the *pain* of moving from your Walk-away ($W$) to your Aspiration ($A$) is psychologically equivalent to the *pain* of the other party moving across their own range. It assumes that "100% of your possible gain" is worth as much to you as "100% of my possible gain" is to me.
  *   **Comfortable Fit:** It sits comfortably with the idea that fairness is about equal *sacrifice*, not equal *outcome*. However, it strictly requires that utility is linear over the range $[W, A]$. If one party is risk-averse (utility curve is concave) and the other risk-seeking, the linear normalization distorts the fairness. The practice ignores this, presupposing risk neutrality for the sake of calculability.

  ### 2. The Baseline: Why the Walk-away Point?
  **Why treat the walk-away point ($W$) as the baseline?**
  In axiomatic bargaining theory (Nash, Kalai-Smorodinsky), the solution is calculated relative to a **Disagreement Point** ($d$).
  *   **The Theory:** The walk-away point *is* the BATNA (Best Alternative to a Negotiated Agreement). In a partnership breakup or labor dispute, the "status quo" is often untenable (the partnership is dissolving; the strike is happening). The only credible threat is the walk-away. Therefore, $W$ serves as the utility zero-point ($d$).
  *   **The Gain:** The "range" ($A - W$) represents the **Cooperative Surplus**. The mediation practice presupposes that fairness applies only to the division of this surplus, not to the security of the walk-away.
  *   **Entitlements:** Ignoring "entitlements" (legal merits) is a feature, not a bug, of this specific practice. It presupposes a **Pragmatic Theory of Fairness**: the goal is to avoid the cost of litigation, not to adjudicate moral rightness. If the mediator weighed entitlements, they would be acting as a judge, not a facilitator of surplus division.

  ### 3. The Sincerity of Aspiration
  **What does the rule assume about the sincerity of $A$?**
  This is the weakest link in the chain, and here your skepticism is well-founded.
  *   **The Incentive:** In the "Equal Relative Concession" model, if I inflate my Aspiration ($A$), I expand my range ($R$). For any given settlement $S$, my fractional concession $(A - S)/R$ decreases. The rule incentivizes strategic exaggeration.
  *   **The Presupposition:** The practice cannot work on stated numbers alone. It presupposes the **Mediator as Filter**. The "extraction" in caucus is not just data gathering; it is a reality-testing mechanism. The theory assumes the mediator can distinguish between a "negotiating position" and a "true aspiration" through private interrogation.
  *   **The Gap:** Strictly speaking, the model requires $A$ to be the **Ideal Point** (the maximum feasible utility). In practice, $A$ is a **Strategic Anchor**. The practice works only if social norms, mediator pressure, or the fear of implosion constrain the inflation of $A$. It assumes "bounded rationality" or "honor" where game theory assumes "maximization."

  ### 4. Coherence: Two Rules or One?
  **Is hosting both rules (fractional vs. absolute) incoherent?**
  No, it is pragmatically eclectic, though theoretically distinct.
  *   **Rule 1 (Equal Fraction):** This is the **Egalitarian Bargaining Solution** (Kalai, 1977). It maximizes the minimum utility gained. It is used when ranges are *asymmetric*. It protects the party with the smaller range from being crushed.
  *   **Rule 2 (Split the Difference):** This is the **Nash Bargaining Solution** (under conditions of symmetry and linear feasibility). It is used when ranges are "comparable."
  *   **The Switch:** When ranges are equal, the Egalitarian solution and the Nash solution *coincide*. The mediator switches to "split the difference" not because the theory changed, but because the calculation simplifies when symmetry is observed.
  *   **Verdict:** The practice is coherent *if* viewed as a heuristic: "Apply Egalitarian principles, but default to Nash simplicity when symmetry renders the distinction moot." It commits to a single theory of fairness (equalize the gain/sacrifice) but uses two computational shortcuts.

  ### 5. Where Your Friend Breaks Down (KS vs. Reality)
  Your friend is right that this is applied bargaining theory, but wrong on the specific identification and the conditions.

  **A. Kalai-Smorodinsky vs. Egalitarian**
  Your friend calls it Kalai-Smorodinsky (KS). Strictly, it is the **Egalitarian Solution**.
  *   **KS:** Preserves the ratio of utilities relative to their *maximum feasible* ideals ($u_1/u_1^* = u_2/u_2^*$).
  *   **Egalitarian:** Equalizes normalized utilities ($u_1 = u_2$).
  *   **Why it matters:** They only yield the same result if the "Ideal Points" ($A_1, A_2$) are equally feasible. In mediation, Aspirations are rarely mutually feasible (otherwise there would be no dispute). The mediator treats $A$ *as if* it were the KS Ideal Point, but mathematically, the "equal fraction surrendered" rule forces equal normalized utility, which is the Egalitarian axiom. Your friend has the right genus, wrong species.

  **B. The Feasible Set**
  *   **The Model:** KS and Nash solutions require knowledge of the **Feasible Set** (the Pareto Frontier). The solver must know what outcomes are actually possible.
  *   **The Caucus:** The mediator *does not know* the feasible set. They only know the *claimed* ranges. The "Zone of Possible Agreement" (ZOPA) is hidden.
  *   **The Breakdown:** The practice assumes the *claimed* ranges approximate the *feasible* set. If one party is bluffing about their walk-away ($W$), the "zero point" is wrong, and the entire calculation is garbage. The formal model assumes **Common Knowledge** of the constraints; the mediation room is defined by **Information Asymmetry**.

  **C. The Disagreement Point**
  *   **The Model:** Requires a fixed, known disagreement point ($d$).
  *   **The Practice:** The walk-away point is often fluid. A party might say "I'll walk at \$100k," but in the moment, faced with a strike, they might accept \$90k. The practice treats $W$ as a hard constraint (a utility floor), whereas in reality, it is a soft threat.

  ### The Third Opinion
  Your friend is flattering the practice by calling it rigorous game theory; you are underestimating it by calling it folk custom.

  The practice is a **robust heuristic approximation of the Egalitarian Bargaining Solution**. It imports the *geometry* of cooperative game theory (normalizing utilities to a 0–1 scale to ensure comparability) but abandons the *epistemic requirements* (common knowledge, true ideal points, known feasible sets).

  It survives not because the math is perfect, but because the **mediator's caucus function** substitutes for the missing game-theoretic assumptions. The mediator performs the "reality testing" that the model assumes is already done.

  **Resolution:**
  *   **To your friend:** You are right that this is axiomatic bargaining, but it is the **Egalitarian Solution**, not Kalai-Smorodinsky, and it relies on the mediator to correct for strategic lying, which the formal model does not allow for.
  *   **To you:** You are right that the inputs are suspect, but the dual rules are not incoherent; they are computational shortcuts for the same underlying principle (equal normalized sacrifice) applied under different symmetry conditions.

  The practice presupposes that **fairness is procedural** (equal relative concession) rather than substantive (entitlements), and that **truth is mediated** (extracted by the third party) rather than given. It is not pure theory, but it is not mere custom; it is **institutionalized theory adapted for imperfect information.**
