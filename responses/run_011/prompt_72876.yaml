answer: |-
  **The Diagnostic: Five Ways to Stand in Time**

  **Instructions:** Read each case. Pick the response that matches your gut reaction, not the one that sounds most virtuous. Tally your answers.

  **1. The Building Name**
  A university plans to name a physics hall after its founder. You find letters proving he blocked rivals to secure his fame.
  *   **A.** Keep the name. We need giants to look up to, flaws and all.
  *   **B.** Keep the name. He built the place; erasing him erases us.
  *   **C.** Remove the name. His power play stifles us now; break his hold.
  *   **D.** Drop the name. It's a distraction; just put a lab there.
  *   **E.** Keep the name. The truth of the physics outlasts the petty biography.

  **2. The Grant Proposal**
  A proposal argues for a new mission because "we put people on the moon with less computing power."
  *   **A.** Fund it. Great deeds prove what human will can do.
  *   **B.** Fund it. That era is our heritage; we must maintain the link.
  *   **C.** Reject it. That context is dead; stop imitating ghosts.
  *   **D.** Reject it. Talk is cheap; build the hardware or don't.
  *   **E.** Reject it. Computing power is irrelevant to the eternal problems of space.

  **3. The Obsolete Instrument**
  A retired lab still calibrates an instrument that's been obsolete for twenty years.
  *   **A.** Let them. It's a monument to a golden age of tinkering.
  *   **B.** Preserve it. It's an artifact of our specific lineage.
  *   **C.** Shut it down. It consumes resources needed for the new.
  *   **D.** Ignore it. I'm working on the new stuff; let them be.
  *   **E.** Ignore it. The measurement matters, not the machine's age.

  **4. The Foundation**
  A young researcher wants the field's foundational results re-derived from scratch because they were settled by people with reputations to defend.
  *   **A.** Support it. Reclaim the glory of the original insight.
  *   **B.** Block it. Respect the original derivation as sacred text.
  *   **C.** Support it. The originals were biased; judge them to free the math.
  *   **D.** Block it. Just use the formula; don't waste time digging.
  *   **E.** Support it. The math is timeless; the history is accidental noise.

  **5. The Priority Dispute**
  A historian says the priority dispute everyone cares about is beside the point since none of it will matter in a century.
  *   **A.** Wrong. Legacy is the only thing that lasts.
  *   **B.** Wrong. The record must be kept intact for the future.
  *   **C.** Right. Caring about priority protects a corrupt system.
  *   **D.** Right. Who cares? Get back to work.
  *   **E.** Right. Only the discovery exists; the discoverers are transient.

  **6. The Advice**
  A working scientist tells a grad student: "Don't read the history of the controversy, just run the experiment."
  *   **A.** Bad advice. Learn from the masters how to think.
  *   **B.** Bad advice. You need to know where you come from.
  *   **C.** Good advice. History is a burden preventing fresh eyes.
  *   **D.** Good advice. History is talk; the experiment is life.
  *   **E.** Good advice. Truth stands outside the timeline of the lab.

  **7. The Archive**
  You turn up the founding physicist's correspondence showing he guessed at the key result.
  *   **A.** Publish it. It shows the genius of his intuition.
  *   **B.** Archive it. Every scrap of his life must be preserved.
  *   **C.** Publish it. It exposes the myth of inevitable progress.
  *   **D.** Leave it. The result works; the process is irrelevant.
  *   **E.** Leave it. The theory is true regardless of how he found it.

  **8. The Textbook**
  You are rewriting the introductory textbook for the field.
  *   **A.** Focus on the great clashes between the founders.
  *   **B.** Start with the original apparatus and early errors.
  *   **C.** Highlight where the founders were wrong to clear the path.
  *   **D.** Teach the equations; skip the stories.
  *   **E.** Teach the logic; the history is just decoration.

  ***

  **Scoring Key**
  Tally your A–E selections. Your highest score indicates your dominant mode.
  *   **Mostly A: The Monumental.** You use history to find inspiration for action. You believe in great deeds and great people.
  *   **Mostly B: The Antiquarian.** You use history to preserve origins. You feel a duty to the past simply because it is yours.
  *   **Mostly C: The Critical.** You use history to judge and break the past. You believe the past must be condemned so you can live.
  *   **Mostly D: The Unhistorical.** You ignore history to act in the moment. You believe forgetting is necessary for happiness and work.
  *   **Mostly E: The Suprahistorical.** You look past history to eternal truths. You believe the flux of time is irrelevant to art, religion, or logic.

  **Handling Inconsistency**
  Most readers will split between two modes (e.g., Critical and Unhistorical). This is normal. Nietzsche argues these modes must mix to serve life. If you have a tie, you are operating in the tension between those two values. If you scored high on **B and C** (Antiquarian and Critical), you are holding a logically unstable position: you want to preserve everything and destroy everything simultaneously. This slot is effectively empty; no one sustains this contradiction for long.

  **The Pathologies (When the Mode Runs Too Hard)**
  *   **Monumental:** Greatness becomes a mask that stifles current creativity by demanding imitation.
  *   **Antiquarian:** Preservation turns into mummification where everything old is revered simply for being old.
  *   **Critical:** Judgment becomes destruction that severs the roots needed to sustain future growth.
  *   **Unhistorical:** Forgetting becomes ignorance that prevents learning from genuine errors.
  *   **Suprahistorical:** Transcendence becomes nausea that dismisses all human effort as meaningless flux.

  ***

  **Editor's Notes on the Tree**

  **Indistinguishable Pairs**
  Be aware that this tree cannot genuinely separate **Monumental** from **Suprahistorical** in all cases. Both look for value beyond the immediate present; one finds it in past heroes, the other in eternal truths. In practice, a reader honoring a "giant" (Monumental) often claims the giant touched the "eternal" (Suprahistorical). Similarly, **Critical** and **Unhistorical** blur. Both result in ignoring history, but one does so aggressively (to break power) and the other passively (to get work done). In a quiz format, "Ignore the past" fits both.

  **The Empty Slot**
  The combination of **High Antiquarian + High Critical** is the incoherent slot. You cannot genuinely revere the past as sacred (Antiquarian) while simultaneously seeking to judge and break it to enable new life (Critical). Readers who land here are usually confused by the questions or are in a moment of transition between identities.

  **Confidence Check**
  I am **highly confident** that the Unhistorical and Suprahistorical categories are in Nietzsche's essay (*On the Use and Abuse of History for Life*, 1874). They are not summary artifacts. The Unhistorical is introduced in Section 1 as the atmosphere necessary for action (the ability to forget). The Suprahistorical is introduced in Section 10 as the standpoint of those who turn away from becoming toward the eternal (art/religion). However, I am **moderately confident** in treating them as equal "leaves" alongside the triad (Monumental, Antiquarian, Critical). Nietzsche presents the triad as *modes of history*, whereas the Unhistorical and Suprahistorical are often framed as *conditions outside history*. Treating them as five equal options is a useful heuristic for a diagnostic, but it flattens Nietzsche's structural distinction between "serving life via history" and "serving life via non-history."

  **The Fudge Node**
  The node I am least sure about is the distinction between **Critical** and **Unhistorical** in the scoring logic. Nietzsche distinguishes them by *intent*: the Critical historian engages the past to destroy it; the Unhistorical being ignores the past to act. In a multiple-choice format, however, the output looks identical ("Don't read the history, just run the experiment"). I have tried to separate them by tone (aggressive judgment vs. immediate action), but a reader who feels both will inevitably blur them. This is not a flaw in your design, but a flaw in the material: in practice, the critic and the unhistorical actor look the same to the antiquarian.
