  Here is a principle designed to fit your list, followed by the mapping, the necessary sacrifices, and the application to your new cases.

  ### The Principle: Weighted E-Admissible Symmetry (WEAS)

  A credal state is not merely a set of probabilities. It is a pair **$(\mathcal{P}, w)$**, where $\mathcal{P}$ is a closed, convex set of probability functions, and $w \in [0, 1]$ is an **Evidential Weight**.

  **1. Generation (The Symmetry Clause):**
  *   **Symmetry:** If your evidence specifies a finite set of chance hypotheses that are symmetric with respect to the outcome (e.g., Double-Headed vs. Double-Tailed), $\mathcal{P}$ is the **singleton** containing the unique symmetric prior. ($w$ is set to 1).
  *   **Ignorance:** If your evidence specifies a continuous range of possibilities without symmetry (e.g., unknown bias), $\mathcal{P}$ is the set of **all** functions consistent with the structural constraints. ($w$ is set near 0).

  **2. Dynamics (The Shrinkage & Conglomerability Clause):**
  *   **Updating:** Upon evidence $E$, $\mathcal{P}$ updates by member-wise conditionalization.
  *   **Shrinkage:** $w$ increases as a function of the "discriminatory power" of the evidence (e.g., sample size). As $w$ increases, $\mathcal{P}$ is intersected with a constraint set that narrows the interval.
  *   **Limit:** $\mathcal{P}$ may narrow arbitrarily close to a point, but **never collapses to a singleton** unless the Generation Clause mandated a singleton initially.
  *   **Coherence:** $\mathcal{P}$ must satisfy **Weak Conglomerability**: For any finite partition $\{E_i\}$, if $P(H|E_i) \in [a, b]$ for all $P \in \mathcal{P}$ and all $i$, then $P(H) \in [a, b]$ for all $P \in \mathcal{P}$.

  **3. Action (The Weighted E-Admissibility Clause):**
  *   **Bet Acceptance:** Accept a bet with expected gain $G$ iff $\min_{P \in \mathcal{P}} E_P[G] > \tau(w)$, where $\tau(w)$ is a threshold that decreases as $w$ increases.
  *   **Indecision:** If $\min_{P \in \mathcal{P}} E_P[G] < 0 < \max_{P \in \mathcal{P}} E_P[G]$, refusal is **mandatory** (not merely permissible).
  *   **Information Value:** Information has positive value only if it increases $w$ or narrows $\mathcal{P}$ regarding the decision at hand. If updating on free information causes **Dilation** (widening of $\mathcal{P}$ relevant to the bet), declining that information is **rational**.

  ---

  ### Mapping the Verdicts

  *   **Case 1 (Unknown Mint):** **Generation (Ignorance).** No symmetry over biases, so $\mathcal{P}$ is wide. **Action.** $\min < 0 < \max$ for even money, so refusal is mandatory.
  *   **Case 2 (DH/DT Coin):** **Generation (Symmetry).** Hypotheses are symmetric, so $\mathcal{P}$ is sharp $\{0.5\}$. **Action.** $\min = \max = 0.5$, so you bet at even money. This explains why Case 1 and 2 differ despite similar "ignorance": the *structure* of the hypothesis space differs.
  *   **Case 3 (Sticky Machine):** **Information Value.** The first toss causes Dilation (interval widens from sharp 0.5 to $[0.25, 0.75]$). Under **Action**, this moves you from a decidable state to an indecisive one. Declining info is rational.
  *   **Case 4 (Betting Interval):** **Action.** Refusing both 55c and 45c bets is mandated because neither clears the $\min > 0$ threshold. A Dutch Book is avoided because you never accept a bet where $\max < 0$.
  *   **Case 5 (Sampling):** **Dynamics (Shrinkage & Limit).** $w$ increases with $n$, narrowing $\mathcal{P}$ to $[0.47, 0.53]$. The **Limit** constraint ensures it never becomes sharp, respecting the logical possibility of extreme bias.
  *   **Case 6 (Different History):** **State Representation.** The state is $(\mathcal{P}, w)$, not just $\mathcal{P}$. The data-driven state has high $w$ (stable, near collapse); the ignorance state has low $w$ (volatile). This justifies different prices for observation.
  *   **Case 7 (Partition):** **Dynamics (Coherence).** The Weak Conglomerability clause explicitly forbids the unconditional interval from sticking out past the conditionals in finite setups.

