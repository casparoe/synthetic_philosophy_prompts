  *   **Symmetry vs. Ignorance** solves Case 1 vs 2.
  *   **E-Admissibility + Dilation** solves Case 3 & 4 (at the cost of Good's Theorem).
  *   **Shrinkage Limit** solves Case 5.
  *   **Conglomerability Axiom** solves Case 7 (at the cost of infinite Dilation).
