answer: |-
  Here is the brainstorming you asked for, straight off the bat. Your inference is vulnerable on at least four fronts. First, you're committing a false dilemma: the failure of the Conditional Analysis (CA) does not logically force you into Categoricalism; it leaves open Dispositional Primitivism (the view that powers are *sui generis* and irreducible). Second, you are conflating semantic reduction with ontological elimination; showing that "fragile" doesn't *mean* "would break" doesn't prove fragility *is* microstructure. Third, you're assuming the categorical base is transparently identifiable independent of the disposition, which the mask cases themselves problematize. Fourth, you're treating Lewis's Reformed Conditional Analysis (RCA) as a metaphysical concession when it is primarily a semantic patch that still relies on a modal connection between base and manifestation.

  Now, let's tear this apart properly.

  ### 1. The Entailment: Does CA Failure Imply Categoricalism?

  Your core claim is that because Finks/Masks/Mimics break the link between dispositions and counterfactuals, dispositions must just be categorical bases plus laws. This does not hold.

  The Fink/Mask/Mimic literature successfully demolishes the **Simple Conditional Analysis**. It shows that the truth of the counterfactual is neither necessary nor sufficient for the possession of the disposition. But from "Dispositions are not Counterfactuals," it does not follow that "Dispositions are Categorical Bases."

  You have ignored the most robust competitor in the room: **Dispositional Essentialism** or **Primitivism**. On this view, fragility is a real, irreducible property. It *grounds* the counterfactual, but it is not *identical* to it. When a fink removes the disposition at the moment of strike, the primitivist says the power was literally extinguished. When a mask blocks it, the power was present but prevented from exercising. When a mimic occurs, the counterfactual is true but the power is absent.

  Your argument assumes that if a property isn't a conditional, it must be a categorical quality (like shape or mass). But why can't it be a modal property? Your committee member is hinting at this. If you say fragility is just the microstructure ($M$), you are claiming $M$ necessitates shattering ($S$) given the laws ($L$). But in a mask case, you have $M + L + \text{Strike}$ and no $S$. To save the categorical identification, you must say the relevant base wasn't just $M$, but $M + \text{No Mask}$. But "No Mask" is often extrinsic. If fragility is intrinsic, but its identity conditions rely on the absence of extrinsic interferers, your categorical reduction collapses. You haven't eliminated the modality; you've just buried it in the selection of the base.

  ### 2. The *Ceteris Paribus* Dodge

  You suspect your *ceteris paribus* (cp) clause is a dodge. You are right. It is not just a dodge; it is a surrender.

  Here is why. A categoricalist wants to say that the world is made of qualities that behave according to laws. If Fragility = Microstructure $M$, then the law should be: "Anything with $M$, if struck, shatters."
  In a mask case, we have an object with $M$, it is struck, and it does not shatter.
  To save the law, you amend it: "Anything with $M$, if struck, *ceteris paribus*, shatters."

  The problem is that the *cp* clause is doing all the modal work. What does "all else being equal" mean here? It means "no masks are present." But what is a mask? A mask is something that prevents a disposition from manifesting. Do you see the circle? You are defining the mask in terms of the disposition it masks. You cannot define "mask" purely categorically without referencing the very modal tendency it blocks.

  So, when you add the *cp* clause, you are admitting that the categorical base $M$ does *not* necessitate the manifestation on its own. It only does so in the absence of defeaters. But the "absence of defeaters" is not a categorical fact about the object; it is a modal fact about the environment's relation to the object's powers. You haven't reduced the disposition to the categorical; you've reduced it to "Categorical Base + Negative Modal Condition." That is not Categoricalism.

  ### 3. Lewis's Reformed Conditional Analysis (RCA)

  You are reading Lewis fairly in one sense, but drawing the wrong metaphysical moral. Lewis's RCA says: $x$ is disposed to $m$ when $s$ iff $x$ has an intrinsic property $B$ such that if $s$ and $x$ retains $B$ for long enough, $x$ manifests $m$.

  Is this a concession? Yes, it concedes that the simple conditional is insufficient and that an intrinsic *categorical* ground is needed to hold the counterfactual in place (to stop finks). However, Lewis uses this to save the **analysis**, not to argue for **ontological categoricalism**. Lewis was a Humean, so he didn't believe in irreducible powers, but the RCA argument itself doesn't prove him right on ontology. It just shows that if you want to keep the conditional analysis, you need to fix the antecedent to include the persistence of the base.

  Crucially, RCA still struggles with masks. In a standard mask case, the object *does* retain $B$ (the microstructure stays the same), the stimulus occurs, but the manifestation is blocked. Lewis has to treat masks as changing the laws or the intrinsic base, which is awkward. So, pointing to RCA doesn't save your argument that the troublemakers *entail* categoricalism. It only shows they entail that the Simple CA is false.

  ### 4. The Coated Glass Case

  This is the sharpest knife in your drawer, and you are holding it by the blade.

  **The Case:** A glass with a permanent, intrinsic polymer coating. Silica is brittle; coating absorbs impact. Coating never comes off.
  **The Question:** Is this a mask (Fragile + No Shatter) or a Constitution case (Not Fragile + No Shatter)?

  **Option A: It's a Mask.**
  If you call this a mask, you are saying the glass *is* fragile. Why? Because the silica structure is the "real" basis.
  *Consequence:* This supports your D & ~C claim (Disposition without Conditional).
  *Cost:* You must explain why the coating isn't part of the object's intrinsic nature. If the coating is permanent and intrinsic, why isn't the "base" the silica-plus-coating complex? If you say the base is just the silica, you are privileging one part of the intrinsic structure over another. On what grounds? Usually, we privilege the silica because it's the "fragile-making" part. But that's circular: you're identifying the base by looking at the disposition. If you're a categoricalist, you should be able to identify the base without peeking at the modal profile.

  **Option B: It's Not Fragile (Constitution).**
  If you say the glass is *not* fragile because its total intrinsic nature (silica + coating) doesn't support shattering.
  *Consequence:* This kills your argument. You no longer have a case of Disposition-without-Conditional. You have No-Disposition-and-No-Conditional. The conditional "if struck, it would shatter" is false, and the disposition is absent. The analysis holds (both sides false).
  *Cost:* You admit that dispositions are sensitive to the *total* intrinsic state. This means you can't isolate a "fragility basis" that exists independently of potential interferers.

  **Does it matter?**
  Yes, it matters immensely. If you choose Option A, you save your counterexample but undermine your categoricalism (because you can't define the base without modal weeding). If you choose Option B, you save your categoricalism (the base is the total state) but lose your counterexample (no mask case exists here).

  Most senior metaphysicians would classify the coated glass as **not fragile**. Fragility is a property of the whole object. If the object's intrinsic nature includes a shock absorber, the object isn't fragile. It's like saying a gun with a permanently fused trigger isn't "dispositional to fire." It's just a non-firing gun. If you accept this, your trilemma loses the "Mask" leg for intrinsic masks. You are left only with extrinsic masks (like packing material). But extrinsic masks make the manifestation conditions extrinsic, which threatens the idea that dispositions are intrinsic properties—a claim categoricalists usually want to keep.

  ### 5. Where You Land

  Your committee member is correct, and your intuition about the *cp* clause is correct. You cannot explain why the structure-plus-laws failed to deliver shattering in a mask case without invoking the concept of "prevention" or "interference." "Prevention" is a causal/modal notion. If you say "The structure was there, but the effect was prevented," you are speaking dispositional talk. If you say "The structure was there, but the laws didn't apply," you've made laws extrinsic or mutable. If you say "The structure wasn't the *relevant* structure," you've made the identity of the base dependent on the manifestation.

  **The Verdict:**
  The fink/mask/mimic problems entail that **Dispositions $\neq$ Conditionals**. They do *not* entail **Dispositions = Categorical Bases**.
  Your argument fails because it treats the failure of a *reductive analysis* as proof of a *specific ontology*. It ignores the live option that dispositions are real, irreducible properties that *ground* conditionals but are not *defined* by them.

  **Advice for the Chapter:**
  Don't argue that the troublemakers prove Categoricalism. Argue that they prove **Reductive Dispositionalism** (the idea that dispositions are just conditionals) is dead. Then, present Categoricalism and Primitivism as the two survivors. Use the Coated Glass case to show the difficulty Categoricalism has in individuating bases without modal circularity. If the categoricalist says the coated glass isn't fragile, ask them how they identify the "fragility-relevant" microstructure in uncoated glass without referencing the shattering. If they can't, their "categorical base" is secretly modal all the way down.

  That is a much stronger, defensible chapter. It shows you understand the literature without overreaching on the metaphysics. Now, put the laptop away and think about that last point for the rest of the flight.
