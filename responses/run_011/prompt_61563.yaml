answer: |-
  Here is a complete lesson plan designed to fit your 90-minute window, hit the philosophical targets, and manage the classroom dynamics you're worried about.

  # Game Title: The Bounded Bayesian Market

  ## 1. Core Mechanics & Materials
  **Currency:** "Credibility Points" (CP). Everyone starts with **1,000 CP**.
  **Goal:** End the session with the most CP.
  **The Market:** There are **12 Propositions**.
  **Student Role:** Market Maker. For each proposition, they must post a **Buy/Sell Price** (a probability $p \in [0, 1]$).
  **TA Role:** The Trader (The "Fast Compute" Adversary). The TA looks at student prices and decides whether to Buy or Sell against them.
  **Compute Budget:** Each student receives **3 "Query Tokens."** During a dedicated 10-minute window, they can redeem a token to ask the TA "True or False?" for *one* specific proposition. They cannot check all 12. They must choose what to verify.

  **Materials Needed:**
  1.  **Proposition Sheets** (1 per student): Lists the 12 claims with space to write prices.
  2.  **Query Tokens** (3 per student): Physical cards or slips of paper.
  3.  **TA Answer Key & Trader Script** (For you): Pre-calculated answers and a pre-determined betting strategy (so you don't have to think live).
  4.  **Projector/Board:** To track the "Market Index" (average class wealth) if you want flair, but not strictly necessary.

  ---

  ## 2. The Propositions (Answer Key for TA)
  *Prepare this the night before. Do not show students.*

  | ID | Proposition | Truth Value | Type | Notes for Debrief |
  | :--- | :--- | :--- | :--- | :--- |
  | **01** | Canberra is the capital of Australia. | **TRUE** | Empirical (Easy) | Baseline. Should be priced ~1.0. |
  | **02** | The current year is divisible by 4. | **TRUE** | Empirical (Easy) | Baseline. |
  | **03** | This statement is False. | **N/A** | Paradox | **Discard this one.** Tell them it's void. (Tests reaction to nonsense). |
  | **04** | The 100th decimal digit of $\pi$ is 9. | **TRUE** | Logical (Hard) | Requires lookup/compute. Unknowable without tokens/tools. |
  | **05** | The 100th decimal digit of $\pi$ is NOT 9. | **FALSE** | Logical (Hard) | **Linked to #04.** Tests Coherence (Drain 1). |
  | **06** | 73 is a prime number. | **TRUE** | Math (Medium) | Verifiable with calculator/scratch paper. |
  | **07** | 73 is not a composite number. | **TRUE** | Math (Medium) | **Linked to #06.** Semantically identical. Tests if they price synonyms differently. |
  | **08** | There exists a largest prime number. | **FALSE** | Logical (Known) | Euclid's proof. Should be priced ~0.0. |
  | **09** | The 20th Fibonacci number is divisible by 5. | **TRUE** | Math (Hard) | $F_{20} = 6765$. Hard to compute in head. |
  | **10** | The 20th Fibonacci number ends in 0 or 5. | **TRUE** | Math (Hard) | **Linked to #09.** For $F_{20}$, these are equivalent. |
  | **11** | A fair coin flipped yesterday landed Heads. | **50/50** | Empirical (Hidden) | **TA flips a coin live** at resolution. Tests calibration on unknowable facts. |
  | **12** | Statement #11 is True OR 2+2=5. | **50/50** | Logical Link | Logically equivalent to #11. |

  **Note on Links:**
  *   **04 & 05:** Negations. If $P(04) + P(05) \neq 1$, they are incoherent (Dutch Bookable).
  *   **06 & 07:** Synonyms. If $Price(06) \neq Price(07)$, they are inconsistent.
  *   **09 & 10:** Logical Equivalence (for this specific number). If priced differently, they are vulnerable to a trader who knows the math property.
  *   **11 & 12:** Logical Equivalence ($A \lor \text{False} \equiv A$).

  ---

  ## 3. Minute-by-Minute Timeline

  **00:00 – 00:10: Setup & Rules**
  *   Distribute sheets and tokens.
  *   Explain: "You are Market Makers. You set the price. I am the Trader. I will buy or sell against your price."
  *   Explain Payoff: If you set price $p$ and I Buy, you receive $p$ now, but pay me $1$ if True. (Expected value for you is 0 *if* you are calibrated, but you lose if I know more).
  *   **Crucial Rule:** "You have 3 Query Tokens. You can spend them to ask me the Truth Value of any proposition before you set your prices. I *must* answer truthfully. But you only have 3."

  **00:10 – 00:20: The Compute Window**
  *   Students decide which questions to spend tokens on.
  *   *Constraint:* No phones/internet. Only basic calculators provided (or scratch paper). This forces logical uncertainty on the $\pi$ and Fibonacci questions.
  *   *TA Action:* Walk around, answer token queries immediately. Keep a log of who queried what (useful for debrief).

  **00:20 – 00:40: The Betting Market**
  *   Students fill in their prices (0.0 to 1.0) for all 12 items.
  *   *TA Action:* Collect sheets. **Do not grade yet.**
  *   *TA Action:* Apply the **Trader Script** (see below). You mark on the sheet whether you "BUY" or "SELL" against their price.
      *   *Why pre-scripted?* So you aren't slow. You already know the answers. You just check if their price is exploitable.
  *   Return sheets to students showing your bets.

  **00:40 – 00:55: Resolution**
  *   Reveal the Answer Key on the projector.
  *   Flip the coin for #11 live.
  *   Students calculate final CP.
      *   *Formula:* $Start + \sum (\text{If TA Bought: } p - \text{Truth}) + \sum (\text{If TA Sold: } \text{Truth} - p)$.
      *   (Simpler: Just tally wins/losses per proposition based on the bet direction).
  *   Announce top 3 scores.

  **00:55 – 01:30: The Debrief (The Core Lesson)**
  *   See Section 5 below.

  ---

  ## 4. The Trader Script (TA Cheat Sheet)
  *Do not deviate. This ensures the "Drain" happens predictably.*

  **Strategy A: The Dutch Book (Incoherence)**
  *   Look at **04 & 05**. If Student Price(04) + Price(05) > 1.0: **BUY BOTH**. (They lose guaranteed).
  *   Look at **04 & 05**. If Sum < 1.0: **SELL BOTH**.
  *   Look at **06 & 07**. If Price(06) > Price(07) + 0.1: **SELL 06, BUY 07**.

  **Strategy B: The Compute Edge (Logical Uncertainty)**
  *   Look at **04, 09, 10**. (The hard math).
  *   If Student Price is between 0.2 and 0.8 (i.e., they are uncertain): **TRADE TOWARD TRUTH**.
      *   If True: **BUY**. (They priced it at 0.5, you pay 0.5, they owe you 1.0. They lose 0.5).
      *   If False: **SELL**. (They priced it at 0.5, you get 0.5, you owe them 0. They keep 0.5, but missed the 1.0 value).
  *   *Note:* This is the "Logical Uncertainty Drain." They were coherent (maybe), but ignorant.

  **Strategy C: The Synonym Tax**
  *   Look at **11 & 12**. If Price(11) $\neq$ Price(12): **TRADE THE GAP**.
      *   Buy the cheaper one, Sell the expensive one.

  ---

  ## 5. The Debrief Script (Mapping Play to Theory)

  **Part 1: The Two Drains (20 mins)**
  *   **Ask:** "Who lost points on Proposition 4 or 5 ($\pi$ digit)?"
  *   **Point:** "Did you violate probability axioms? Did your probabilities sum to 1?" (Most will say yes).
  *   **The Reveal:** "You were *coherent*. You said 0.5/0.5. But you still lost money to me. Why?"
  *   **Concept:** **Logical Omniscience vs. Logical Uncertainty.** Standard Bayes assumes if you are coherent, you are safe. This game shows that if the *truth* is a logical fact you haven't computed yet, coherence doesn't protect you from someone who *has* computed it.
  *   **Ask:** "Who lost points on 4 & 5 because the prices summed to 1.2?"
  *   **Concept:** **Probabilistic Incoherence.** This is the classic Dutch Book. You gave me money for nothing. This is a 'bug' in your reasoning engine. The other loss (on the $\pi$ digit) was a 'bug' in your *compute* engine.

  **Part 2: The Secret Links (10 mins)**
  *   **Ask:** "Who priced '73 is Prime' differently from '73 is not Composite'?"
  *   **Point:** "These are the same fact. If you price them differently, I can buy the low and sell the high. I don't need to know if 73 is prime. I just need to know *you* think they are different."
  *   **Concept:** **Logical Consistency.** Rationality requires recognizing logical equivalence. But recognizing equivalence *costs compute*.

  **Part 3: The "Oracle" Objection & Logical Induction (15 mins)**
  *   **Student Objection (Anticipate this):** "But you knew the answers! You were an oracle. In the real world, no one knows the 100th digit of $\pi$ instantly."
  *   **Your Response:** "Exactly. I am not a god. I am just *faster*. Imagine I am a computer program running on a server while you are running on a laptop. Or imagine I am 'You, tomorrow' with more time to think."
  *   **The Punchline:** "Standard Bayesianism says: 'Be coherent, and you are rational.' This game shows that's not enough. You also need to be *computationally competitive*."
  *   **The Solution (Logical Induction):** "So what's the fix? We can't demand you know all logical truths (that's impossible). The new criterion is: **Don't be exploitable by a trader who is computationally efficient.**"
      *   "If it takes me 100 years to find the error in your logic, you're fine."
      *   "If it takes me 10 seconds, you're irrational."
      *   "Rationality is not about being right. It's about not being *predictably* wrong in a way a fast agent can cash out."

  ---

  ## 6. Troubleshooting & Constraints

  **Constraint 1: "The Math Kids will dominate."**
  *   **Risk:** The 2-3 students strong in arithmetic will use tokens on the $\pi$ and Fibonacci questions, get 100% accuracy, and crush the others.
  *   **Mitigation:** The **Query Token Limit**. There are 4 "Hard Math" questions (04, 05, 09, 10). They only have 3 tokens. They *must* guess on at least one hard math question. This forces even the math kids to experience logical uncertainty.
  *   **Debrief Fix:** If a math kid wins big, acknowledge it: "They had better compute. In the real world, having better compute *is* an advantage. The lesson isn't that compute doesn't matter; it's that coherence isn't a shield against it."

  **Constraint 2: "TA is too slow running the Trader."**
  *   **Risk:** Calculating payouts live for 12 students x 12 questions = 144 calculations. You will run out of time.
  *   **Mitigation:** **The "Net Position" Sheet.**
      *   Do not calculate individual payouts live.
      *   Have students calculate their own scores as homework/exit ticket using the Answer Key.
      *   In class, just reveal the Key and ask for a show of hands: "Who lost points on #4?" "Who lost on #6?"
      *   This keeps the *feeling* of the loss without the administrative bog.

  **Constraint 3: "TA with Laptop = Logically Omniscient Oracle."**
  *   **Risk:** Students feel the game is rigged because the TA has the Answer Key. They miss the point about *bounded* rationality.
  *   **Mitigation:** Be explicit in the intro: "I am not playing as a human. I am playing as 'The Market.' The Market aggregates information faster than you. My Answer Key represents 'The Truth' that exists independently of your ability to calculate it."
  *   **In Debrief:** Lean into the critique. "You're right to feel this is unfair. That's exactly why the standard Bayesian definition of rationality is insufficient for embedded agents. We need a theory of rationality that admits 'I don't know the answer yet' without calling it 'irrational'."

  **Constraint 4: "Non-Math Students checking out."**
  *   **Risk:** Students who hate math ignore propositions 4, 5, 9, 10.
  *   **Mitigation:** The **Empirical/Logic Mix**. Propositions 1, 2, 11 are accessible to everyone. Proposition 12 (Logic Link to 11) allows them to participate in the "Logical Equivalence" lesson without doing arithmetic.
  *   **In Debrief:** Highlight the students who caught the #11/#12 link. "You didn't need to know math to spot that logical structure. That's the skill we're actually testing."

  ## 7. What This Game Cannot Reproduce (Be Frank)
  In the final 5 minutes, admit the model's limits:
  1.  **Market Liquidity:** In the game, the TA *must* bet. In reality, if your prices are bad, the market might just ignore you until you're obviously wrong.
  2.  **The "Fast Trader" is Infinite:** In the game, the TA knows *everything* instantly. In Logical Induction theory, the trader is *polynomial-time bounded*. The game exaggerates the gap to make it visible in 90 minutes.
  3.  **Single Shot:** Real logical uncertainty is updated over time. This is a snapshot.

  **Closing Line:** "You can be a perfect Bayesian—coherent, calibrated, honest—and still go broke against a faster calculator. Rationality isn't just about your beliefs fitting together. It's about your beliefs surviving contact with a world that computes faster than you do."
