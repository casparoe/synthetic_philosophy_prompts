      *   *The Twist:* The game needs to simulate *compute cost*. If students can just calculate everything instantly, the lesson fails. If they can't calculate anything, it's boring. There needs to be a resource constraint.

  3.  **Designing the Game Mechanics:**
      *   **Currency:** "Credibility Points" (CP). No real money.
      *   **Market:** Students are market makers. They set prices on propositions.
      *   **The Adversary:** The TA (or a designated "Trader" script) acts as the arbitrageur.
