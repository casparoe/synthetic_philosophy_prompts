      *   Need ~10-15 statements.
      *   *Math (Hard):* 100th prime number? 15th Fibonacci? Let's go with something slightly harder but verifiable. "The 50th digit of $\pi$." (Too hard to do mentally). "Is $2^{10} + 3^{5}$ prime?"
