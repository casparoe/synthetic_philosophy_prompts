      *   **Addressing the "Math Kids" Problem:** If only two kids can solve the math, they will dominate. Solution: Make the math *too hard* for anyone to solve in class, but easy enough to verify with a tool *if* they had one. Or, make the "compute" a hidden mechanic.
      *   *Better Idea:* The "Compute" isn't them doing math. It's them buying information. The TA holds the "Truth." Students pay tokens to ask "Is this True?" But they have limited tokens. The "Trader" (TA) has infinite tokens (omniscient relative to them).
      *   *Refinement for Logical Induction:* The point is that *even if* they are coherent, they lose to someone who knows more logic. So the students set prices. The TA bets against them.
