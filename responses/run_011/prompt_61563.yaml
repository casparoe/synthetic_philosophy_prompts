      *   **Goal:** An in-class betting game demonstrating the difference between *probabilistic incoherence* (Dutch bookable) and *logical non-omniscience* (exploitable by faster compute).
      *   **Key Concept to Convey:** "Just be a good Bayesian" fails for logical facts. Coherent prices (e.g., 0.5 on an uncomputed fact) can still lose to a better computor. Logical Induction criterion: Don't be exploitable by a *fast* trader. Slow exploitation is survivable.
      *   **Constraints:**
