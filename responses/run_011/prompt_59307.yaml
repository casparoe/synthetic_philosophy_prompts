answer: |-
  Your intuition that the cases are disanalogous is philosophically sound, even if your friend finds it irritating. The proverb 'When in Rome, do as the Romans do' functions as a linguistic shorthand for at least six distinct normative claims. These claims range from mere prudence to robust moral duties, and they rely on different mechanisms of obligation. To treat them as a single principle is to commit a category error.

  Below is a menu of the distinct precise claims the proverb might be making. Following that, I shall apply them to your three cases, address the scope of 'Rome', and diagnose the disagreement.

  ### I. The Menu of Readings

  **1. The Prudential Reading**
  *   **The Claim:** Conformity minimises friction, danger, and cost for the visitor.
  *   **Conditions for Truth:** Locals possess the power to sanction deviation (socially, legally, or physically), and the cost of sanction outweighs the benefit of adherence to one's home norms.
  *   **Status:** Platitude. It is empirically true that standing out can be costly.
  *   **Normative Force:** Prudential reason only. No moral obligation.
  *   **Scope:** Binds the visitor only (locals do not need to blend in).

  **2. The Epistemic Reading**
  *   **The Claim:** Locals possess tacit knowledge regarding risk, efficiency, or meaning that a transient visitor cannot acquire quickly.
  *   **Conditions for Truth:** The practice in question relies on local context (e.g., traffic patterns, unspoken queueing protocols) where outsider intervention introduces error or danger.
  *   **Status:** Substantive but defensible. It acknowledges the limits of outsider knowledge.
  *   **Normative Force:** Defeasible reason. One should defer to local expertise unless one has strong evidence they are wrong.
  *   **Scope:** Primarily visitors, though locals retain the duty to maintain the practice correctly.

  **3. The Fair Play Reading**
  *   **The Claim:** By accepting the benefits of a local cooperative scheme, one incurs an obligation to bear its burdens.
  *   **Conditions for Truth:** The practice is a mutually beneficial cooperative scheme; the visitor voluntarily accepts benefits (not merely receives them); and the scheme is reasonably just.
  *   **Status:** Substantive and contested. Philosophical debate exists over whether mere receipt of benefits constitutes 'acceptance'.
  *   **Normative Force:** Content-independent obligation (if the scheme is just).
  *   **Scope:** Binds all participants (visitors and locals) equally, provided they partake of the scheme.

  **4. The Expressive Reading**
  *   **The Claim:** Deviation from local norms communicates contempt or superiority, regardless of the agent's intent.
  *   **Conditions for Truth:** The act has a settled symbolic meaning within that community; the visitor is aware (or should be aware) of this meaning.
  *   **Status:** Substantive. It turns on the semantics of social action.
  *   **Normative Force:** Duty of respect (a reason that can be outweighed by urgent moral concerns).
  *   **Scope:** Binds anyone interacting within the community's symbolic space.

  **5. The Sovereignty Reading**
  *   **The Claim:** A political community has the right to settle its own terms of interaction without external interference.
  *   **Conditions for Truth:** The practice falls within the community's legitimate jurisdiction; the practice does not violate universal human rights.
  *   **Status:** Substantive (political philosophy).
  *   **Normative Force:** Strong obligation of non-interference.
  *   **Scope:** Binds outsiders specifically. Locals are the authors of the rule, not subject to it in the same way.

  **6. The Consent-by-Presence Reading**
  *   **The Claim:** Physical presence within a territory constitutes tacit consent to all its norms.
  *   **Conditions for Truth:** Entry is truly voluntary; exit is possible; norms are publicly accessible.
  *   **Status:** Straightforwardly false (or a legal fiction). Mere presence does not equate to moral agreement, especially for short-term visitors who cannot negotiate terms.
  *   **Normative Force:** None, unless backed by law.
  *   **Scope:** Visitors only.

  ---

  ### II. Application to the Three Cases

  **1. Tipping**
  *   **Friend's Support:** The **Fair Play Reading**. Your friend argues you 'voluntarily taken up the benefits of a scheme'. If you eat at the restaurant, you benefit from the labour model that keeps menu prices lower in exchange for gratuities. To refuse the tip is to free-ride.
  *   **Your Counter:** You view the scheme as exploitative. If the scheme is unjust, the Fair Play obligation dissolves.
  *   **Verdict:** The **Sovereignty Reading** also supports your friend (it is their wage system, not yours), but only if the system isn't fundamentally rights-violating. The Prudential Reading also applies (staff may chase you), but your friend framed it as moral, not prudential.
  *   **Disanalogy:** This is a financial contract embedded in custom. It is distinct from physical coordination.

  **2. Jaywalking**
  *   **Friend's Support:** The **Epistemic Reading** and the **Expressive Reading**. Your friend suggests locals know what is 'prudent and safe' (Epistemic) and that waiting is 'moral preening' (Expressive).
  *   **Your Counter:** You might argue safety is objective, not local. However, if traffic flow relies on predictable pedestrian behaviour, the Epistemic reading holds weight.
  *   **Verdict:** The Fair Play reading is weak here (there is no cooperative scheme benefiting you). The Sovereignty reading is strong (it is their road, their law).
  *   **Disanalogy:** This is about safety and law, not economic distribution.

  **3. The Scrum (Queueing)**
  *   **Friend's Support:** The **Epistemic Reading** and a **Consequentialist Coordination** variant. Your friend argues you 'destroyed a working coordination solution'. This is not about fairness or respect, but about system stability. You lacked the local knowledge to navigate the scrum, so your attempt to impose an external order caused harm.
  *   **Your Counter:** You argue a scrum is not a scheme. However, if the scrum functions as a queue (first-come, first-served via memory), it *is* a scheme, merely an invisible one.
  *   **Verdict:** The Fair Play reading applies if you wish to be served. The Epistemic reading is strongest: you tried to optimise a system you did not understand and broke it.
  *   **Disanalogy:** This is a pure coordination problem. Unlike tipping, there is no financial burden; unlike jaywalking, there is no law. It is purely conventional.

  **Is there a single reading supporting all three?**
  Only the **Prudential Reading** ('don't get into trouble') covers all three without qualification. However, your friend explicitly rejected prudence in favour of moral requirement. The **Sovereignty Reading** comes close ('it is their place, their rules'), but it struggles with the Scrum case, which is not a formal rule but a social convention. Therefore, no single *moral* reading supports all three without qualification. Your friend is conflating distinct normative sources.

  ---

  ### III. The Scope of 'Rome'

  To determine if the proverb holds, we must define the boundaries of the obligation.

  **1. Duration of Stay**
  The proverb implies temporary status. If one moves to Rome, one eventually *becomes* a Roman. The obligation to 'do as the Romans do' attenuates as one's stake in the community grows. A tourist has a duty of non-disruption; a resident has a duty of participation. The Consent-by-Presence reading fails for short stays because there is no opportunity to negotiate or truly understand the terms.

  **2. Repugnant Practices**
  The proverb self-destructs if 'what the Romans do' violates universal moral norms. If the local practice is discriminatory or cruel, the Sovereignty and Fair Play readings are overridden by general moral duties. The proverb cannot be a defence of relativism. It applies only to *conventional* norms (etiquette, coordination, local law), not *moral* norms (human rights, basic justice).

  **3. Harm to Third Parties**
  If the local practice harms a third party (e.g., environmental damage, exploitation of a vulnerable minority), the visitor has no obligation to conform. In the Tipping case, if the system exploits staff, the Fair Play reading is voided because the scheme is unjust. You cannot have a duty of fair play in an unfair game.

  **4. The Self-Undermining Problem**
  This is the sharpest logical edge. In many tourist destinations, 'what the Romans do' is to treat tourists differently from locals. Romans may not queue, but they expect tourists to queue. Romans may not pay full price, but they expect tourists to pay the 'tourist price'.
  *   If you 'do as the Romans do', you should not queue and you should haggle aggressively.
  *   If you do that, you violate the local expectation *of tourists*.
  *   Therefore, 'doing as the Romans do' actually requires doing what the Romans *expect of visitors*, which is often different from what the Romans do themselves.
  *   This renders the proverb incoherent unless interpreted as 'Submit to the local power dynamic', which returns us to the Prudential Reading.

  ---

  ### IV. Diagnosis of the Argument

  **Which reading was your friend invoking?**
  *   **On Tipping:** The **Fair Play Reading**. They focused on 'benefits' and 'burdens'. They view the wage structure as a cooperative scheme you entered by ordering food.
  *   **On Jaywalking:** The **Expressive Reading**. They focused on 'respect' and 'preening'. They view the act as a signal of attitude rather than a safety calculation.
  *   **On the Scrum:** The **Epistemic/Coordination Reading**. They focused on 'working coordination solution' and 'harm'. They view the scrum as a functional system you broke through ignorance.

  **Is your objection hair-splitting?**
  No. It is a necessary distinction.
  Your friend is arguing for a **content-independent obligation**: 'Because it is the local rule, you must follow it.'
  You are arguing for a **content-dependent reason**: 'I will follow it if it is fair, safe, or functional.'

  In the Tipping case, the content (exploitative wages) matters morally. In the Jaywalking case, the content (safety vs. law) matters practically. In the Scrum case, the content (efficiency vs. order) matters functionally. By treating them as identical instances of 'When in Rome', your friend bypasses the need to justify *why* the specific norm binds you in that specific instance.

  However, you are not entirely without fault. In the Scrum case, your claim that 'a regularity with no queue... cannot oblige me' is weak. If a regularity functions as a queue (tracking precedence), it creates a legitimate expectation. To disrupt it is to harm the efficiency of the group, regardless of whether it looks like a British queue. Here, the Epistemic Reading favours your friend: you assumed your form of queueing was superior, lacking the local knowledge to navigate the scrum.

  **Conclusion**
  The proverb is not a single moral principle but a cluster of different reasons for conformity.
  1.  **Tipping:** Turns on justice (Fair Play). If the system is exploitative, the proverb fails.
  2.  **Jaywalking:** Turns on respect and safety (Expressive/Epistemic). The proverb holds unless the law is unjust.
  3.  **Scrum:** Turns on coordination (Epistemic). The proverb holds because you broke a working system.

  Your friend is correct that you had a duty to conform in the Scrum and likely the Jaywalking case, but for different reasons. They are likely incorrect on the Tipping case if the wage structure is genuinely exploitative, as Fair Play does not bind one to unjust schemes. Your objection is not hair-splitting; it is a demand for normative precision. Your friend is using a sledgehammer (a blanket proverb) to crack nuts that require different tools (justice, safety, coordination). When in Rome, one should indeed do as the Romans do, but one must first ask *why* the Romans do it, and whether that reason binds a guest.
