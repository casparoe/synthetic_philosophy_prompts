answer: |-
  The list is jointly satisfiable only if reality is treated phenomenologically rather than ontologically, with **Transfer** doing the most functional work and the **Hagiography Datum** eliminating the most philosophical accounts.

  **Desiderata Classification**
  *   **Non-Negotiable Constraints:** *Transfer* (otherwise the pedagogy is useless), *Situationism* (must align with empirical psychology), *Bad Lives* (your curriculum assigns them), *Hagiography Datum* (empirical observation of your students).
  *   **Prejudices:** *Plutarch's Method* (literary preference; scale may matter equally), *Fiction/Real-Life Discrimination* (false dichotomy; belief status matters more than ontology), *Admiration/Hero-worship* (could be a feature of identification rather than a bug).

  **Joint Satisfiability and Incompatibilities**
  The *Hagiography Datum* and *Fiction/Real-Life Discrimination* appear contradictory but are jointly satisfiable if the mechanism is **believed reality** rather than **actual reality**. Students are moved by saints because they believe them real (unlike novels) but idealized (unlike honest bios). A theory fails only if it insists truth-tracking is the mechanism; it succeeds if it argues idealization within a perceived-true framework drives emulation. No subset is logically incompatible, but satisfying all requires abandoning truth-based exemplarism.

  **Knockout Requirement**
  The **Hagiography Datum** knocks out the most accounts. Standard exemplarism (e.g., Zagzebski) requires actual existence to prove moral possibility ("if they did it, I can"); if sanitized fictions work better, the "possibility proof" collapses, forcing a shift toward imagination-based or narrative-based theories.

  **Account Evaluations**
  *   **Admiration-based exemplarism:** Fails Hagiography (requires actual existence for possibility proof); handles Transfer weakly by relying on emotional resonance over contextual adaptation.
  *   **Narrative-identity account:** Satisfies Hagiography (truth secondary to story); fails Situationism by presuming a unified character self that social psychology denies.
  *   **Moral-perception-or-phronesis-through-cases account:** Solves Transfer (teaches pattern recognition); fails Plutarch's Method because it requires significant moral dilemmas rather than trivial details to train perception.
