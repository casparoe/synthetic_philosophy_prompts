answer: |-
  **The Expiry Date on Competence: What Aviation Regulators Know About Mind**

  **By [Your Name]**

  There is a peculiar architecture to the way we decide a pilot has stopped being a pilot. Look closely at the regulatory scaffolding, and you will find a person's capacities sorted into classes with wildly different shelf lives. In the United States, and broadly in Europe, the pilot's certificate itself is immortal. The written examinations on air law, meteorology, and navigation on which it rests are never sat again once the licence is issued. You know the theory for life.

  Yet everything else expires. An instrument qualification lapses without recent approaches. To carry passengers, you need three take-offs and landings in ninety days. The type rating—the endorsement for a specific airframe—requires a proficiency check in a simulator every six to twelve months, where an examiner scores you against published tolerances: altitude within a hundred feet, heading within ten degrees. And alongside this sits the medical, expiring every six or twelve months.

  This bifurcation—a knowledge test that never expires, a performance test that expires constantly—was thrown into sharp relief by a recent proposal from a national authority. The scheme suggested that a pilot returning after a long absence could regain their type rating via a computer-based assessment of knowledge and some hours on a part-task trainer, rather than a full simulator check. The pilots' association objected. But not, as one might expect, on the grounds of safety data or simulator fidelity. Their argument was ontological. They claimed the scheme confuses two different things: a pilot away from the cockpit has not lost the *knowledge* (he could pass the written paper tomorrow), but he has lost something no written paper could detect or restore.

  The airline's head of safety dismissed this as mysticism dressed as expertise. If the man can state the procedures and execute them on a screen, he argued, whatever else is missing is not competence.

  This dispute is not merely bureaucratic; it is a live enactment of a century-old philosophical debate. To understand who is right, we must reconstruct the implicit theory of the current practice. The regulatory system, as it stands, is implicitly Gilbert Rylean. In his 1949 work *The Concept of Mind*, the philosopher Gilbert Ryle attacked the "intellectualist legend"—the idea that intelligent action is always preceded by an internal operation of contemplating propositions. Ryle distinguished between "knowing that" (propositional knowledge) and "knowing how" (procedural knowledge or skill).

  The current licensing regime acts as if Ryle was correct. It treats the written exam as a measure of "knowing that" (which, once acquired, is stable) and the simulator check as a measure of "knowing how" (which decays without use). If the regulator believed that all knowledge was propositional—including knowledge of how to do things—they could not logically sustain this schedule. They would have to treat the recurrent check merely as a cost-effective way of sampling a disposition that happens to decay. But the strict separation suggests they believe "knowing how" is a genuinely distinct kind of state from "knowing that."

  Where, then, is the practice philosophically underdetermined? It lies in the checklist-and-tolerances method of examining skill. By scoring a pilot against altitude and heading tolerances, the regulator commits to a behaviourist view of competence: competence is an observable performance, not an inner state. It rules out the rival account that competence is a private, mental grasp of principles that might exist even if the hands shake. If you hit the numbers, you are good. If you do not, you are not. The system has no metric for "feel," only for output.

  So, what would have to change if the authority adopted the safety manager's position and treated "knowing how" as a species of "knowing that"?

  First, the examinations would need to be frequent. If skill is just access to propositions, and access decays (as the safety manager admits dispositions do), then the written exams should expire just as the ratings do. Second, the simulator would become largely redundant. If competence is propositional, a computer-based assessment of procedures and systems knowledge should suffice, provided the "propositions" included the motor commands required for control. The wording on the licence would change from certifying a capacity to *act* to certifying a capacity to *describe action*.

  Would the union's objection survive this adoption? No. It would be exposed as incoherent within that framework. If "knowing how" is reduced to "knowing that," then the union's claim that something ineffable is lost becomes, by definition, "mysticism." Their objection only holds water if one accepts the Rylean distinction that there is a residue of skill—embodied, somatic, temporal—that cannot be captured by propositions.

  Finally, does the expiring medical complicate the picture? In a word, no. The medical treats the body as hardware; the check treats the mind-body connection as software integration. The medical certificate confirms the machine is not broken. The proficiency check confirms the operator has not forgotten how to drive it. The body sits outside the epistemological dispute but firmly inside the safety case. You can have the perfect "knowing how" in your nervous system, but if your heart fails, you are no longer a pilot.

  The stakes here extend beyond the cockpit. As we automate more of our world, we are increasingly asked to accept the safety manager's view: that competence is data, and data can be tested on a screen. The pilots' union is arguing for the irreducibility of human practice. They are suggesting that there is a texture to expertise that resists digitisation. The regulator's current architecture agrees with them, even if their new proposal does not. To change that architecture is not just to save money on simulator time; it is to make a statement about what we think a human mind is for.
