answer: |-
  This is a classic political philosophy stalemate. The phrase "If you don't vote, you can't complain" is a rhetorical Swiss Army knife; it cuts in different directions depending on which blade you pull out. Your roommate was likely switching blades mid-swing to avoid parrying your arguments.

  Here is the menu of precise principles hidden inside that sentence, evaluated for truth and utility, followed by the analysis of the slide to compulsion and the test against the disenfranchised.

  ### Part 1: The Menu of Principles

  Here are the five distinct claims your roommate could be making.

  **1. The "Consent of the Governed" Claim (Political Standing)**
  *   **The Claim:** By abstaining, you waive your moral standing to criticize the specific outcome. Voting is the mechanism of consent; without it, you are a bystander, not a participant.
  *   **Verdict:** **Substantive Claim.** It is not obviously true or false; it depends on your theory of democracy.
  *   **What Breaks It:** **Tyranny of the Majority.** If the only options are two candidates who both support policies that violate your fundamental rights, abstaining is a protest, not a waiver. You retain standing to complain about rights violations regardless of participation.

  **2. The "Causal Complicity" Claim (Responsibility)**
  *   **The Claim:** You are causally responsible for the winner. If you didn't vote to stop them, you helped them win. Therefore, you own the result.
  *   **Verdict:** **False (in most mass elections).**
  *   **What Breaks It:** **The Marginal Impact Problem.** In a safe seat or a national election, the probability of one vote deciding the outcome is statistically zero. You cannot be complicit in an outcome you could not practically have changed.

  **3. The "Fair Play" Claim (Reciprocity)**
  *   **The Claim:** Democracy is a cooperative scheme. It is unfair to enjoy the benefits of the system (or criticize its failures) without bearing the minimal cost of participation (time/effort).
  *   **Verdict:** **Substantive Claim.** Plausible, but contingent on the cost being low and the benefits being shared.
  *   **What Breaks It:** **Systemic Rigging.** If the system is gerrymandered or corrupted such that the "cost" of voting yields no actual influence, the reciprocity is broken. You don't owe labor to a machine that doesn't work.

  **4. The "Epistemic Authority" Claim (Homework)**
  *   **The Claim:** Complaining implies you know better. If you haven't voted, you haven't done the research required to form a valid opinion.
  *   **Verdict:** **False.**
  *   **What Breaks It:** **Lived Experience.** A person can be deeply affected by a policy (e.g., healthcare, policing) without knowing the candidate's platform. Their complaint is based on impact, not technical knowledge of the ballot.

  **5. The "Hypocrisy" Claim (Consistency)**
  *   **The Claim:** Complaining signals that you care about the outcome. Not voting signals that you don't. Doing both is performative inconsistency.
  *   **Verdict:** **Platitude.** Everyone accepts that hypocrisy is bad.
  *   **What Breaks It:** **Strategic Abstention.** I can care deeply about the outcome and decide that *none* of the options are acceptable. That isn't hypocrisy; it's a boycott.

  ---

  ### Part 2: The Slide to Compulsion

  You suspected your roommate was sliding between these readings. You are right. Most of the principles above justify **shaming**, not **law**.

  *   **Shaming:** "You shouldn't complain" is a social norm. It relies on Principles 1, 3, and 5. It polices behavior through guilt.
  *   **Compulsion:** "You *must* vote" is a legal mandate.

  **The Slide:**
  To get from "You can't complain" to "We will fine you if you don't vote," your roommate has to slide from **Individual Standing** to **Collective Legitimacy**.

  The argument shifts from *"You lose your right to speak"* to *"The system loses its legitimacy if you don't speak."*
  *   **The Hidden Premise:** A democracy is only truly legitimate if turnout is near 100%. If turnout is low, the government is a faction, not a representative body.
  *   **The Bridge:** If we want a government that everyone is bound to respect (and therefore cannot legitimately complain about), we must ensure everyone participates. Compulsory voting isn't about silencing you; it's about manufacturing the consensus that makes the "no complaint" rule stick.

  **Which readings support compulsion?**
  Only **The Fair Play Claim (#3)** and a modified **Consent Claim (#1)** support compulsion.
  *   If voting is a civic *duty* (like jury duty) rather than a *right*, then the state can enforce it to ensure the "Fair Play" of the system.
  *   However, the **Causal Complicity (#2)** and **Hypocrisy (#5)** claims *cannot* support compulsion. You cannot force someone to be non-hypocritical, and you cannot force someone to be causally effective.

  **The Fatal Flaw in the Slide:**
  If you force me to vote, you destroy the **Consent Claim**. A coerced vote is not consent. If voting is compulsory, the "If you don't vote, you can't complain" line transforms into "Because you *were made* to vote, you definitely can't complain." This creates a closed loop where the state manufactures the consent it needs to silence dissent.

  ---

  ### Part 3: The Disenfranchised Test

  This is where the logic usually collapses. Let's run the two strongest readings (**Standing** and **Fair Play**) against your undocumented neighbor and your 17-year-old sister.

  **The Subjects:**
  1.  **Undocumented Neighbor:** Subject to laws, pays taxes (sales/property via rent), cannot vote.
  2.  **17-Year-Old Sister:** Subject to laws, will inherit the debt/policy outcomes, cannot vote.

  **Test 1: The Standing Claim ("No vote, no standing")**
  *   *Application:* Since they cannot vote, they have waived no consent. Therefore, by this logic, they have **zero standing** to complain about laws, taxes, or policing.
  *   *Result:* **Catastrophic Failure.** This leads to "Taxation Without Representation is legitimate." Intuitively, we believe subjecthood (being governed) grants standing, not voting. If this principle holds, a tyrant could say, "I didn't let you vote, so you can't complain about the dungeon."
  *   *Survival:* **Does not survive.**

  **Test 2: The Fair Play Claim ("Contribute or shut up")**
  *   *Application:* They cannot contribute the specific "coin" of voting. Does this mean they forfeit the right to critique the system?
  *   *Result:* **Failure.** Fairness requires the option to contribute. You cannot demand someone pay a fare when you have locked the turnstile. In fact, their inability to vote *strengthens* their right to complain, because they are bearing the burden of the law without the leverage of the ballot.
  *   *Survival:* **Does not survive.**

  **Test 3: The "Subjecthood" Correction (The Principle that *Does* Survive)**
  *   There is a deeper principle that survives this test: **"If you are subject to the law, you have standing to complain."**
  *   This principle aligns your neighbor and sister with *voters*. It suggests that the roommate's slogan is actually backwards. It shouldn't be "If you don't vote, you can't complain." It should be "If you have to live with it, you should have a say."
  *   **Why this breaks your roommate's argument:** If standing comes from *living under the law*, then voting is just one tool to exercise that standing, not the source of the standing itself. Therefore, making voting compulsory doesn't fix the standing issue; it just forces a specific tool usage.

  ### Summary for the Next Argument

  Your roommate's trump card is a category error.

  1.  **Name the Slide:** Tell him he is sliding from **Normative Shaming** (you ought to vote) to **Legal Coercion** (you must vote). Most reasons for "shutting up" if you don't vote rely on voluntary choice. If you remove the choice, you remove the moral weight of the abstention.
  2.  **Use the Edge Cases:** Ask him: *"Does my 17-year-old sister have the right to complain about the school board?"* If he says yes, then voting isn't the source of standing—**subjecthood** is. If voting isn't the source of standing, then forcing people to vote doesn't solve the "legitimacy" problem, it just creates coerced data.
  3.  **The Knockout:** The phrase "If you don't vote, you can't complain" is only true in a system where voting is **accessible, meaningful, and voluntary**. If you make it compulsory, you remove the voluntariness, which undermines the moral authority of the outcome, which ironically gives people *more* reason to complain about the coercion.
