      *   **Stance:** They are a "motivated reasoner." They believe the view but want it tested. They are specifically worried about point (3): "Nothing is thereby lost... the illusion just is the reality."
      *   **Task:** Try genuinely hard to *break* the position. Provide specific findings, cases, and arguments that count *against* it. Rank them from "would-make-me-drop-it" to "merely-annoying."
      *   **Specific Topics to Address:**
