          *   *Counter:* Illusionism (Dennett/Metzinger) relies heavily on cortical narrative machinery to generate the "self-model." If consciousness exists without the narrative cortex, the "self-model generates the experience" claim is threatened. It suggests raw feel (affect) is subcortical and *not* an illusion generated by high-level modeling.
          *   *Rank:* High/Medium. It attacks the mechanism proposed in (1) and (2).

      *   **Point 3: The "Illusion" Implies an Experiencer (The Hard Problem Residue).**
          *   *User's worry:* Point (3) - "illusion is reality."
          *   *Counter:* Frankish/Illusionism says "phenomenal properties don't exist." But an illusion *of* pain still hurts. If the *feeling* of pain is the illusion, what is the substrate? If you say "neural firing," you haven't explained the *feel*. If you say "there is no feel," you are denying the datum. This is the "Hard Problem" re-emerging.
