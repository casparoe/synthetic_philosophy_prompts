  Brainstorming setups:
  1.  **Supplier Swap:** Ingredients changed overnight. Fails: Truth value is shared; if A is false, B is false.
  2.  **Recipe Ambiguity:** "Peanut oil" vs "Peanut sauce." Fails: Guest question is fixed; norms test the same proposition.
  3.  **Batch Contamination:** A's serving contaminated, B's clean. Works: Allows divergent truth values for the same menu item.
  4.  **Time Delay:** Oil degrades over hours. Fails: "Same new dish" implies simultaneous service window.

  Commitment: Batch Contamination. A's bowl has cross-contam (False); B's bowl is clean (True). B knows A's bowl was dirty, so B believes the kitchen is compromised (Insincere), but follows the binder rule (Menu says safe, say safe).

  ***

  The guest tapped the menu. "Does the pad thai have peanut oil?"

  Leo glanced at the binder, then the wok. "No. I checked the ingredients and the station. It's clear." He served Bowl One. Unknown to him, the ladle had touched shrimp sauce earlier.

  Maya saw the ladle. She knew Bowl Two was clean, but Leo's mistake meant the station wasn't secure. She didn't believe it was safe. House rule said trust the menu. "No," she said, serving Bowl Two.

  Sam, the manager, had tested Bowl Three with a kit. "No. I verified this batch myself."

  ***

  **Norm Check**

  | Norm | A (Leo) | B (Maya) | C (Sam) |
  | :--- | :--- | :--- | :--- |
  | **Truth** | Violates (False) | Satisfies (True) | Satisfies |
  | **Belief** | Satisfies (Sincere) | Violates (Insincere) | Satisfies |
  | **Reasonable** | Satisfies (Checked) | Violates (Ignored risk) | Satisfies |
  | **Knowledge** | Violates (False) | Violates (No Belief) | Satisfies |

  **The "Only If" Distinction**
  The rules are necessary conditions ("Assert *only if*..."), not sufficient. Satisfying a norm doesn't guarantee the assertion was good *all things considered* (e.g., C could still be rude). In this case, the distinction doesn't dodge the bullet: A and B are both *impermissible* under the Knowledge Norm, regardless of other factors. The violation is in the act itself.

  **Feature Analysis & Truth Norm Defense**
  *   **A's Verdict:** Generated by unknown cross-contamination. If A could have double-checked the ladle, A would satisfy Knowledge.
  *   **B's Verdict:** Generated by the token/type gap (clean bowl vs. dirty kitchen). If B privately half-agreed (believed safety was likely), B would satisfy Belief.
  *   **Truth Norm Defender:** They will argue B's assertion is improper due to insincerity, not truth. They might claim assertion *implies* belief, so B didn't truly assert. This doesn't rescue the Truth Norm; it concedes that Truth alone is insufficient, handing the point to the Knowledge/Belief hybrid view.

  Verdict: The Knowledge Norm
