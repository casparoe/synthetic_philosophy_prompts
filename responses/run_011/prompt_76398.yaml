          *   *Fix:* You have to decide if "cluelessness" applies to Longtermist scenarios. If yes, 6 goes. If no (i.e., we *can* calculate EV for the far future), then 3 needs refinement (it's not "drop out," it's "discount for uncertainty").

      *   *Refining the 1 vs 4 conflict:*
          *   User rejects the "criterion vs heuristic" defense in 2, but adopts it in 4.
          *   In 2: "I'm not moved by the standard deflection that this is only a problem for action-guidance."
          *   In 4: "In practice I deliberate over... near-term... still being a consequentialist."
          *   This is a performative contradiction. In 2, they say epistemic access matters for the *standard*. In 4, they retreat to *practice*.
          *   *Fix:* Move to Subjective Consequentialism (Expected Value) or admit 4 is a "second-best" strategy that acknowledges 1 makes most acts unknowable.

  6.  **Final Polish:**
      *   Ensure the "Cost" is clear for each.
      *   Ensure the "False Alarm" is explained clearly (proximate vs. distal consequences).
