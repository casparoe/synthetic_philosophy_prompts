answer: |-
  A regional logistics firm with one major distribution hub and twenty small satellite depots must standardize on handheld inventory scanners, choosing between two functionally identical models, "Alpha" and "Beta," where value increases as more devices share the same maintenance protocol and software patches. In the actual history, a routine delivery brings Alpha units to the Hub on Monday; the Hub adopts Alpha, and the satellites, relying on the Hub's IT support, follow suit by Friday, locking the firm into Alpha. In a nearby counterfactual, a minor snowstorm delays the Hub's delivery until Thursday; facing a weekend rush, three small satellites accept a spontaneous Tuesday shipment of Beta units and begin using them. However, when the Hub finally receives and adopts Alpha on Thursday, the sheer volume of its traffic generates sufficient network returns—centralized repair contracts and data compatibility requirements—to pull the three satellites away from Beta and into the Alpha standard by the following Monday. In both histories, the firm is locked into Alpha with high reversal costs, yet the sequence of adoption differs (Hub-first versus Satellites-first), while the final standard remains robustly Alpha because the Hub's traffic volume creates a basin of attraction too wide for the satellites' early noise to escape.

  ### Dynamics and Verification

  **Condition 1 (Lock-in):** The scenario exhibits genuine increasing returns via maintenance protocols and data compatibility. Once the Hub adopts Alpha, the cost of switching the entire network (retraining, rewriting interfaces, splitting spare parts inventory) becomes prohibitively high, satisfying the hysteresis-like "lock-in" requirement.

  **Condition 2 (Path Sensitivity):** The snowstorm is the identifiable small early event. Removing it (or altering its timing) changes the *sequence of steps*: in the actual history, adoption flows Hub $\to$ Satellites; in the counterfactual, it flows Satellites $\to$ Hub. The trajectory through state-space is demonstrably different.

  **Condition 3 (Outcome Robustness):** Despite the sequence change, the *final equilibrium* (firm-wide Alpha standard) is identical in both histories. The satellites' early adoption of Beta in the counterfactual is a transient fluctuation that fails to tip the system into the Beta basin.

  **Distinct Relata:** Note that (2) and (3) make claims about different relata. Condition (2) concerns the *process* (the temporal ordering of adoption events), while Condition (3) concerns the *attractor state* (the final standard selected). The literature often conflates sensitivity of the *process* with sensitivity of the *outcome*; this case decouples them.

  ### The Decisive Feature

  The single feature doing the work is the **asymmetric weight of the nodes** (the Hub's traffic volume relative to the satellites), which generates a **wide basin of attraction**. This structural asymmetry ensures that the Hub's choice exerts a gravitational pull strong enough to overwhelm early fluctuations initiated by smaller agents.

  **If Removed:** If the nodes were symmetric (e.g., twenty equal-sized depots with no central Hub), the snowstorm *would* become pivotal. In that symmetric case, the three depots adopting Beta first would generate enough increasing returns to tip the network toward Beta, making the outcome contingent on the weather. The removal of asymmetry collapses the wide basin into a narrow ridge where small events determine the equilibrium.

  ### The Strongest Reply

  A proponent of strong historical contingency might insist: *"The snowstorm was still pivotal because it forced the three satellites to waste resources adopting Beta temporarily; without the storm, that waste would not have occurred, so the history is meaningfully different."*

  **What This Shows:** This reply concedes the core point: it shifts the claim from "the event determined the *outcome*" to "the event determined the *cost of the path*." It demonstrates that establishing increasing returns is insufficient to prove outcome contingency. To prove that a small event determined *which* standard won (rather than just *how* it was reached), one must establish not only positive feedback but also a **narrow basin of attraction** (or a separatrix near the actual trajectory). Without demonstrating that the system was poised near a tipping point where the small event could have pushed it into a *different* basin, claims of historical lock-in merely describe hysteresis (Condition 1), not contingency (Condition 3 failure). The physicist's intuition holds: hysteresis ensures the state depends on history, but it does not guarantee that the *final* state is sensitive to small perturbations in that history.
