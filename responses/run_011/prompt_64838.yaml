answer: |-
  # The Heritage Impact Diagnostic (HID)

  **Purpose:** To convert a proposal (text, object, installation) into a voting recommendation within 20 minutes.
  **Scope:** All substantive changes to public-facing interpretation, archives, or educational materials.
  **Constraint:** No reference to external philosophical systems. Internal terminology only.

  ---

  ## The Procedure

  ### Step 1: The Intent Audit
  **Question:** What specific work is this proposal asking the visitor to do?
  **Adequate Answer:** A single verb. (e.g., *Admire, Remember, Judge, Learn, Grieve.*)
  **Sign of Failure:** Vague nouns (e.g., *Appreciation, Awareness, Engagement*) or multiple conflicting verbs (e.g., *Celebrate and Condemn*).
  **Exit:** If the verb is unclear, return to sponsor. If clear, proceed to Step 2.
  *Judgment Call:* You are deciding what the object *does*, not what the sponsor *says* it does. A portrait of a founder usually asks visitors to *Respect*, even if the label says *Observe*.

  ### Step 2: The Mode Match
  **Question:** Which of the three vital needs does this verb serve?
  1.  **Exemplar Mode:** For those who need to act. (Verbs: *Emulate, Build, Strive.*)
  2.  **Preservation Mode:** For those who need to belong. (Verbs: *Remember, Honour, Keep.*)
  3.  **Judgment Mode:** For those who need release from pain. (Verbs: *Judge, Break, Release.*)
  **Adequate Answer:** Selection of one primary mode.
  **Sign of Failure:** Claiming a single panel serves all three needs equally.
  **Exit:** If the proposal claims to serve all three, flag for **Step 5 (Sequencing)**. Otherwise, proceed to Step 3.
  *Judgment Call:* You are diagnosing the community's need, not just the object's function. A school module usually requires *Exemplar* (figures to admire) even if the history is grim, whereas a memorial requires *Judgment* or *Preservation*.

  ### Step 3: The Corruption Scan
  **Question:** Does the draft exhibit trigger one of the three known corruptions?
  *   **Costume (Exemplar Corruption):** Does it invent details or elevate a figure so high they become unreal? (Sign: Lack of specific dates, removal of flaws, use of "heroic" lighting/text.)
  *   **Reliquary (Preservation Corruption):** Does it treat everything as equally valuable to avoid choosing? (Sign: "Clutter," lack of hierarchy, refusal to explain why *this* object is here.)
  *   **Root-Cutting (Judgment Corruption):** Does it condemn the past in a way that severs the visitor from their own origins? (Sign: Language that implies "we" are good and "they" were evil, where "they" are the ancestors of "us".)
  **Adequate Answer:** "Clear" or "Flagged: [Type]."
  **Sign of Failure:** Dismissing a corruption flag because the facts are technically true. (Truth is not the antidote to Corruption.)
  **Exit:** If Flagged, the draft must be rewritten or re-contextualized before approval. Proceed to Step 4.

  ### Step 4: The Horizon Test (120-Word Rule)
  **Question:** Given the physical space/word limit, what *must* be left out?
  **Adequate Answer:** A written list of excluded facts that are true but non-essential to the chosen Mode.
  **Sign of Failure:** Attempting to squeeze a second Mode into the same word count. (e.g., Trying to fit *Judgment* into an *Exemplar* panel.)
  **Exit:** If the excluded facts contain lethal information (e.g., omitting deaths in a safety exhibit), the proposal fails. Proceed to Step 5.
  *Judgment Call:* You are deciding what lies outside the horizon. This is an act of power. Record the exclusion in the memo.

  ### Step 5: The Sequencing Rule
  **Question:** If two Modes are required (e.g., Prosperity and Death), can they be blended into one voice?
  **Rule:** No. Blending creates a confused voice that serves no need.
  **Procedure:** Assign Panel A to Mode 1 and Panel B to Mode 2. Panel B must physically follow Panel A.
  **Adequate Answer:** "Single Mode" or "Sequenced: A then B."
  **Sign of Failure:** A single text that uses "However" or "But" to toggle between admiration and condemnation.
  **Exit:** If Sequenced, specify the order. Proceed to Step 6.

  ### Step 6: The Standing Threshold
  **Question:** Does this proposal alter the status of a person or group who has living descendants or a designated society in this town?
  **Adequate Answer:** "Yes" or "No."
  **Sign of Failure:** Staff making a decision on removal, renaming, or shaming of specific lineage without explicit mandate.
  **Rule:** If "Yes," the decision belongs to the Trust/Descendants' Society. Staff recommendation is limited to "Refer to Trust."
  **Exit:** If "Yes," stop. Write Memo recommending referral. If "No," proceed to Step 7.

  ### Step 7: The Integration Check (Plastic Power)
  **Question:** Will this proposal allow the community to digest this history, or will it choke them?
  **Adequate Answer:** "Nourishing" (converts past to action/belonging/release) or "Toxic" (paralyses, embalms, or shames without recourse).
  **Sign of Failure:** A proposal that leaves the visitor with no path forward (e.g., pure condemnation with no lesson, or pure adoration with no truth).
  **Exit:** Final Recommendation.

  ---

  ## Case Studies & Recommendation Memos

  ### Case 1: The Mill Reinstallation
  **Proposal:** Reinstall interpretation at the mill. Current text minimizes the 1911 fire (39 dead). New draft aims to cover "The Story of the Mill."
  **Preparation Time:** 18 Minutes.

  **HID Run:**
  1.  **Intent:** *Understand* (Failed). Too vague. Split into *Admire* (Industry) and *Grieve* (Fire).
  2.  **Mode:** Proposal attempts to blend *Exemplar* (Prosperity) and *Judgment* (Negligence/Death).
  3.  **Corruption:** Blending creates **Costume** (making the owners seem benevolent despite the fire) or **Root-Cutting** (making the town seem purely victimized).
  4.  **Horizon:** 120 words cannot hold both the technical innovation of the mill and the specific horror of the fire without trivializing one.
  5.  **Sequencing:** Required. Panel 1 (Exemplar: The Machinery/Production). Panel 2 (Judgment: The Fire/Safety).
  6.  **Standing:** No specific living descendants claiming ownership of the dead workers collectively, but general town sensitivity applies. Staff decision permissible.
  7.  **Integration:** Sequencing allows digestion. Blending would choke.

  **Recommendation Memo:**
  > **To:** Programming Committee
  > **From:** Research Lead
  > **Re:** Mill Reinstallation Draft v3
  > **Decision:** CONDITIONAL APPROVAL
  >
  > **Diagnostic:** The draft attempts to blend Exemplar and Judgment modes within a single narrative voice. This triggers the Corruption Scan (Costume/Root-cutting risk).
  > **Action:** Split installation into two distinct physical zones.
  > *   **Zone A (Exemplar):** Focus on engineering and output. 120-word limit applied. Exclusions: Specific names of the dead (reserved for Zone B).
  > *   **Zone B (Judgment):** Focus on the 1911 fire and safety regulations. Must not offer "closure" or "lessons learned" that soften the loss.
  > **Reasoning:** Blending these modes in one text forces the visitor to admire and condemn simultaneously, resulting in cognitive dissonance. Sequencing allows the visitor to acknowledge the prosperity *before* confronting the cost.
  > **Note:** This overrides the sponsor's request for a "unified narrative." Unified narratives here are historically dishonest.

  ***

  ### Case 2: The Founder's Portrait
  **Proposal:** Request from Descendants' Society to remove the founder's portrait from the entrance hall and commission a replacement.
  **Preparation Time:** 15 Minutes.

  **HID Run:**
  1.  **Intent:** *Remove* (Judgment Mode) and *Replace* (Exemplar Mode).
  2.  **Mode:** The request is fundamentally about **Standing**, not interpretation.
  3.  **Corruption:** If staff approve removal, we risk **Root-Cutting** (severing the town from its recorded visual history). If staff deny, we risk **Reliquary** (revering the object over the people).
  4.  **Horizon:** N/A (Object removal).
  5.  **Sequencing:** N/A.
  6.  **Standing:** **YES.** The Descendants' Society is the formal stakeholder. The portrait depicts a specific lineage.
  7.  **Integration:** Staff cannot digest this for the community. The pain/pride belongs to the family.

  **Recommendation Memo:**
  > **To:** Programming Committee
  > **From:** Research Lead
  > **Re:** Descendants' Society Request (Portrait Removal)
  > **Decision:** REFER TO TRUST
  >
  > **Diagnostic:** This proposal crosses the Standing Threshold (Step 6). The subject is a specific lineage with active representation.
  > **Action:** Staff recommendation is neutral. We cannot assess the "Integration" of this act because the "plastic power" required belongs to the family, not the institution.
  > **Reasoning:** If staff remove the portrait, we enact a Root-Cutting corruption (denying our institutional history). If staff retain it against the family's will, we enact a Reliquary corruption (valuing the object over the living).
  > **Note:** This is not a curatorial decision. It is a governance decision. The Trust must vote, with the Descendants' Society representatives recused or leading, depending on legal advice. Do not draft interpretation text for the replacement until the Trust votes.

  ***

  ### Case 3: The Payroll Ledgers (Online Publication)
  **Proposal:** Digitize and publish company payroll ledgers (1880-1920). Includes names, ages, injuries, fines.
  **Preparation Time:** 20 Minutes.

  **HID Run:**
  1.  **Intent:** *Expose* (Judgment Mode). (User's default).
  2.  **Mode:** Proposal claims *Preservation* (Archive access), but framing implies *Judgment* (Highlighting fines/injuries).
  3.  **Corruption:** High risk of **Root-Cutting**. The workers fined/injured are the ancestors of the current town. Publishing their penalties without context shames the living visitors.
  4.  **Horizon:** Digital space is unlimited, but *attention* is limited. Highlighting the "Fines" column invites Judgment.
  5.  **Sequencing:** Cannot sequence on a single spreadsheet. Requires contextual essays.
  6.  **Standing:** **YES.** The data concerns specific families likely still resident.
  7.  **Integration:** Pure exposure chokes. It turns ancestors into victims/criminals without agency.

  **Recommendation Memo:**
  > **To:** Programming Committee
  > **From:** Research Lead
  > **Re:** Payroll Ledger Digitisation Project
  > **Decision:** REJECT CURRENT FRAMING
  >
  > **Diagnostic:** The proposal defaults to Judgment Mode (exposure of penalties). This triggers the Corruption Scan (Root-Cutting).
  > **Action:** Shift to Preservation Mode only.
  > **Reasoning:** Publishing the "Fines" and "Injuries" columns as a primary search feature frames the ancestors as disciplined or broken. This severs the current community from them (Root-Cutting). The ledgers must be published as raw data (Preservation) with no editorial highlighting of penalties.
  > **Constraint:** Do not create a "Wall of Shame" or school module focusing on the fines.
  > **Note:** I recognize this contradicts my usual preference for critical exposure. The Procedure indicates that for this specific artefact, Judgment Mode is toxic because the "critic" and the "condemned" share a bloodline. We preserve the record; we do not curate the shame.

  ***

  ## Statement of Limits

  This procedure is a diagnostic tool, not a moral compass. It can identify whether a proposal is structurally sound (i.e., whether the mode matches the need and avoids corruption), but it cannot determine whether a community *should* remember a specific thing.

  There are proposals for which no mode is correct. In some cases, the "Integration Check" will fail regardless of sequencing or framing. If a site or story is so raw that any interpretation triggers Corruption (e.g., a mass grave where *Exemplar* is offensive, *Preservation* is ghoulish, and *Judgment* is politically weaponized), the Procedure's output must be **Silence**.

  The Procedure authorizes the recommendation: *"Do not interpret this site at this time."*

  This is not a failure of the Procedure. It is the recognition that some history cannot be digested yet. To force it into a panel, a plaque, or a module is to choose Costume, Reliquary, or Root-Cutting by default. The Procedure protects the institution from the demand to speak when speaking is the harm.
