answer: |-
  The kettle clicked off in the corner of the common room, the sudden silence heavier than the boil had been. Outside, the Cambridge dark was pressing against the high windows, but inside the light was harsh, fluorescent, reflecting off the whiteboard still scarred with the seminar's diagrams.

  Nadia leaned against the sink, waiting for the tea to stew. Owen stood by the table, holding her preprint as if it were contaminated. He hadn't taken his coat off.

  'It tells me nothing,' Owen said. His voice was quiet, but the Welsh lilt had flattened, sharpened into something precise and cold. 'You prove the existence of a maximal ideal, yet you provide no method to construct it. You say it is there, but you cannot show me where.'

  Nadia poured the water. 'It's in the set, Owen. Where else would it be?'

  'In your imagination.' He tapped the paper. 'This is not mathematics. It is elaborate bookkeeping about objects that do not exist. You invoke Zorn's Lemma like a magic spell. "Let there be a maximal element," and you think the work is done.'

  'Fuck's sake,' Nadia said, turning with the mugs. 'It's standard set theory. It's what everybody uses. I've never once had to justify the Axiom of Choice in thirty years of publishing. It works.'

  'It works for you,' Owen said. 'It does not work for anyone who needs to compute anything. If I cannot exhibit the object, if I cannot approximate it to arbitrary precision, then your existence proof is empty. It smuggles in a logical principle rather than proving a mathematical one.'

  Nadia set the mug down hard. Tea sloshed over the rim. 'So what? You want a witness? Sometimes the witness is too complex to write down. That doesn't mean it isn't there.'

  'It means you have no grounds to claim it is there,' Owen countered. He began to pace, a tight circuit around the table. 'Consider Banach–Tarski. Your beloved Axiom of Choice allows you to take a sphere, decompose it into five pieces, and reassemble them into two spheres of the same size. Conservation of mass violated. Physical intuition shattered. And you accept this because the logic holds?'

  'Banach–Tarski is a paradox of geometry, not logic,' Nadia said. 'It relies on non-measurable sets. Nobody uses that in applied settings. Don't pretend my result is about doubling spheres.'

  'It is about the same principle!' Owen stopped pacing. He was breathing harder now, his formality cracking slightly at the edges. 'You claim a maximal ideal exists because assuming it doesn't leads to a contradiction. That is not proof. That is a trick. In any applied setting, a maximal ideal nobody can point to does no work. It is a ghost.'

  'And your constructive utopia is any better?' Nadia pushed off the sink. 'You lot use Countable Choice all day long without blushing. You pick elements from a sequence because you "know" they're there. Don't sit there in your high tower telling me I'm the one cheating.'

  'Countable Choice is different,' Owen said immediately.

  'Is it? Because it feels like choice to me.'

  'It is empirically verifiable,' Owen insisted. 'I can compute the sequence. I cannot compute your maximal element. You rely on a completed infinity. I rely on a process.'

  'A process that never ends is no use to me,' Nadia said. 'Look, if you really want to throw out Choice, be honest about the cost. You want to burn Zorn? Fine. But you lose Hahn–Banach. You lose Tychonoff. You lose bases for arbitrary vector spaces. Half of functional analysis collapses. Are you going to tell the physicists their Hilbert spaces are fiction?'

  'I am telling them that their proofs are conditional,' Owen said. 'I am telling them that if they want truth, they must pay for it with construction.'

  'Truth?' Nadia laughed, a short, brittle sound. 'You think you own truth? Just because you can't exhibit it isn't the same claim as it isn't there. The map is not the territory, Owen. Just because you can't draw the road doesn't mean the destination doesn't exist.'

  'But how do you know the destination exists?' Owen stepped closer. 'If the only evidence for its existence is that assuming it doesn't exist breaks your logic, then you have proved nothing about the mathematics. You have only proved something about your logic.'

  Nadia gripped her mug with both hands. She was cornered, and he knew it. The steam from the tea rose between them. 'You think this is just a preference? A stylistic choice?'

  'I think it is a moral one,' Owen said. 'To claim existence without provision is a lie.'

  'Diaconescu,' Nadia said.

  Owen blinked. 'What?'

  'Diaconescu's theorem. 1975.' Nadia's voice dropped, losing its heat but gaining weight. 'He proved that the Axiom of Choice implies the Law of Excluded Middle. In constructive set theory, if you accept Choice, you must accept that for any proposition $P$, either $P$ is true or not-$P$ is true. No middle ground.'

  Owen went very still. 'I am aware of the result.'

  'Are you?' Nadia leaned forward. 'So you know that this isn't just about my maximal ideals. It's about binary truth. When I use Choice, I am asserting that the universe is deterministic. That every statement is either true or false, even if I can't tell you which. You want constructive logic? You have to reject Choice. But don't pretend you're just objecting to my tools. You're objecting to the idea that truth is binary.'

  'I am objecting to the idea that truth is independent of verification,' Owen said. His voice was very formal now, each word placed like a stone. 'You assert a reality beyond our ability to know it. I assert that mathematics is a human activity. If we cannot verify it, it is not mathematics. It is theology.'

  'Theology?' Nadia swore under her breath. 'I'm doing algebra, Owen. I'm solving problems.'

  'You are manipulating symbols according to rules that guarantee consistency but not meaning,' Owen said. 'You have built a beautiful castle, Nadia. But it is built on air. And one day, the wind will change.'

  'The wind hasn't changed in a century,' Nadia said. 'And nobody lives in your castle. It's too small.'

  'It is solid,' Owen said. 'Every brick is laid by hand. I know where it is. I know what it does.'

  'You know nothing about the infinite,' Nadia said softly. 'You're terrified of it. So you chop it down until it fits in your hand.'

  Owen picked up his coat from the chair. He did not put it on immediately. He held it over his arm, looking at her with an expression that wasn't quite pity, but wasn't respect either. 'I am not terrified of the infinite. I am terrified of pretending to understand it when I do not.'

  He moved towards the door. Nadia didn't stop him. She watched him reach for the handle.

  'You'll never publish this,' Owen said, without turning around. 'Not in a journal that matters to me.'

  'I don't write for you,' Nadia said. 'I write for the math.'

  'Then you are writing for a ghost,' Owen said.

  He opened the door. The corridor outside was dark, the motion sensors yet to trigger. He stepped into the gloom, leaving the door ajar. Nadia listened to his footsteps receding down the hall, sharp and rhythmic on the linoleum.

  She looked down at her tea. It had gone cold. On the table, the preprint lay open at Lemma 4, the maximal element hovering in the white space, invisible, undeniable, and entirely out of reach. She picked up the paper and smoothed the corner where Owen had gripped it too hard.

  'Bollocks,' she said to the empty room.

  She didn't know if she was talking about the theorem, or the man, or the fact that after twenty minutes of shouting, she still wasn't sure if they were arguing about the same thing. She turned off the light, leaving the common room in the dark, the math waiting for the morning.
