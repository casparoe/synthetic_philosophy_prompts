  2. Use the strengthened Liar ("This sentence is not true") because it prevents students from escaping via truth-value gaps, forcing them to confront the contradiction directly without dismissing it as a linguistic glitch.
  3. Introduce paraconsistency immediately after presenting Explosion to prevent the "everything's true" conclusion, and explicitly define truth as non-epistemic before opening discussion to block the idea that contradiction means uncertainty.
  4. Interrupt the math student specifically when Explosion is mentioned, clarifying that rejecting Explosion preserves arithmetic even if you accept the Liar contradiction.
  5. End by asking whether they think the sentence fails to express a proposition or actually holds both truth values, while openly stating you are not covering formal semantic systems or how to reconstruct mathematics on this basis.
