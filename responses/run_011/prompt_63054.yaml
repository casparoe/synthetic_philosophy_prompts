  I'm a junior and I run my schools philosophy club, about ten of us, mostly people who fall down rabbit holes at 2am. Next Thursday I've got 25 minutes to teach them why dialetheists think some contradictions are actually true, going in through the liar sentence. Don't explain dialetheism to me, I've read enough to know the basics — plan how I should explain it to them. I want to know what has to come first and what depends on what (does the principle of explosion have to be on the table before the liar even lands, or does that blow it up?), which single example should carry the whole thing and what it has to have and not have — I'm torn between the plain self-referential sentence and the version that only claims it isn't true, and whatever I pick can't be something they wave away as a language trick or a loop you just ban — plus the misconceptions they'll walk in with or form on the spot. I'm bracing for at least "so everything's true then," "a true contradiction just means nobody knows which side is right," and the one guy who does competition math announcing I've broken arithmetic, so tell me the exact point in the sequence where I head each of those off. End it with one question I can ask that shows whether it actually landed, and what I should openly say I'm not covering at this level.

  Give me exactly five numbered items, one or two sentences each, no intro and no conclusion.
