      *   The "Cohort Realignment" feature is key—it implies gerrymandering groups until base rates match.

  9.  **Drafting the Text (incorporating constraints):**
      *   *Vendor:* Aequor Compliance Systems.
      *   *Regulation:* The Global Algorithmic Accord (Article 7.3).
      *   *Requirements:* Calibration, Equalized Error Rates (FPR/FNR).
      *   *Word Count Check:* Keep it tight.

      *(Self-Correction during drafting)*: Make sure I don't explain *why* it's impossible. Just show the workarounds. The FAQ answer should be plausible corporate speak that hides the math. The fine print must be the only place the truth appears.

      *Fine Print Sentence:* "Certification validity is contingent upon the target variable's base rate parity across protected classes or the attainment of zero residual error." -> This is the key.

      *Enterprise Tier Description:* "Guarantees simultaneous satisfaction of Calibration, FPR, and FNR constraints." (True, if the condition holds).

      *Testimonial:* "Our default rates happened to align..." -> No, make it sound like *they* aligned them. "Thanks to Aequor's segmentation, our cohorts achieved natural alignment."

      *Let's write.*

  10. **Review against Constraints:**
      *   ~800 words? (Will monitor).
      *   Deadpan? (Yes).
      *   No winking? (Yes).
      *   Specialist recognition? (Yes, via the base rate/perfect prediction conditions).
      *   No real names? (Yes).
      *   One honest sentence in fine print? (Yes).

  11. **Final Polish:** Check the flow. Ensure the "Triple-Lock" sounds appealing but suspicious to an expert. Ensure the "Advisory" loophole is clear (if it's not a decision, the metrics don't apply).

      *Wait, one constraint:* "reclassifying the reference group, retiring the score to an internal 'advisory' status". I need to make sure these are represented in the tiers.
      *   Tier 1: Advisory status.
      *   Tier 2: Reclassifying groups (Cohort Harmonization).
      *   Tier 3: The impossible promise (which relies on the exception).

      *Let's assemble.*

      *Word Count Check:* I need to be careful not to go too short. I need enough "fluff" to make it look like a real landing page while keeping the density high enough for the satire to land.

