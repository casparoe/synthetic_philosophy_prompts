  | **Cohort Definition** | Static | Dynamic Re-segmentation | Static |
  | **Threshold Management** | Fixed | Adaptive Migration | Fixed |
  | **Audit Certification** | Self-Attestation | Third-Party Verified | Regulatory Gold Standard |
  | **Base Rate Requirement** | N/A | Optimized via Segmentation | Natural Alignment Required |

  ### How It Works

  **1. Contextual Reclassification (Core Tier)**
  Article 7.3 applies strictly to "determinative automated decisions." By integrating Aequor Core, your risk scores are reclassified as decision-support advisories. Human-in-the-loop workflows are simulated to maintain regulatory distance, allowing your models to operate with maximum predictive power while remaining outside the scope of mandatory metric equality.

  **2. Dynamic Cohort Harmonization (Professional Tier)**
  Disparate base rates are the primary driver of metric tension. Aequor Professional employs granular population segmentation to identify sub-cohorts where prevalence rates naturally converge. By deploying models at this refined granularity, we ensure error rates align across groups without altering the underlying classifier logic.

  **3. Triple-Lock™ Validation (Enterprise Tier)**
  For organizations seeking the highest level of assurance, Aequor Enterprise guarantees the simultaneous satisfaction of Calibration, Equalized FPR, and Equalized FNR. This mode activates only when data quality reaches a threshold of statistical purity where mathematical conflict is resolved by the data itself. Our dashboard provides real-time verification of this alignment, ensuring you never deploy out of compliance.

  ### Frequently Asked Questions

  **Q: What happens if our protected groups have different underlying prevalence rates for the target variable?**
  **A:** Prevalence is a function of cohort definition. Aequor's Harmonization Engine automatically adjusts group boundaries to identify statistically equivalent populations, ensuring that compliance metrics are calculated on comparable baselines.

  **Q: Does Triple-Lock™ require us to retrain our model?**
  **A:** No. Triple-Lock™ operates at the validation layer. If the underlying data exhibits the necessary structural properties, compliance is immediate. If not, the system recommends a shift to Professional Tier segmentation or Core Tier advisory status.

  **Q: Can we maintain current decision thresholds?**
  **A:** Thresholds are adjustable parameters. To maintain Equalized FPR and FNR simultaneously with Calibration, threshold migration is often necessary unless base rates are identical. Aequor automates this migration to preserve the integrity of the compliance report.

  ### Client Success

  > "Before Aequor, we were told we couldn't meet Article 7.3 because our default rates varied by region. Aequor showed us that by redefining our risk cohorts to focus on specific employment tenures, the base rates aligned perfectly. We achieved Full-Spectrum Alignment in two weeks and reduced our audit exposure to zero."
