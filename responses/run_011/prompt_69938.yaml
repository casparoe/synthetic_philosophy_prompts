          *   Length: Roughly 800 words.
          *   Constraints: No citations, no real names/companies/statutes, no authorial explanation.

  2.  **Deconstruct the Impossibility Theorem:**
      *   The core result (Chouldechova 2017, Kleinberg et al. 2016) states that you cannot simultaneously satisfy Calibration (within groups), Equal False Positive Rates, and Equal False Negative Rates across groups *unless* either:
          1.  The predictor is perfect (error rate = 0).
          2.  The base rates (prevalence of the outcome) are equal across the groups.
      *   The satire needs to show the vendor selling solutions that rely on these exceptions or on gaming the metrics.
      *   *Loopholes:* Changing thresholds (shifts calibration), redefining groups (changes base rates), making the model "advisory" (avoiding the definition of "deployed risk score"), etc.

  3.  **Drafting - Section by Section:**

