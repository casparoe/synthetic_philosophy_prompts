      *   *No Quotes:* Paraphrase dialogue and scenes.

      *(Self-Correction during drafting)*: Make sure I don't just say "Leonard is a computer." He's a biological agent forced to act like a symbolic AI. That's the key tension.
      *(Refining the Ending)*: The user asked about the "editing input" aspect. I need to be precise: Leonard isn't filtering beliefs; he's planting false beliefs to ensure a future action. This turns the frame problem on its head—it's not about what's relevant *now*, but what will be relevant *later* for a self that won't remember why.

  7.  **Final Polish:** Check against the "no fudging" instruction. Acknowledge the disanalogy in part 1 strongly. Ensure the Dreyfusian point about background coping is clear in the "break" section.

      *(Final check on constraints)*: No references. No citations. No direct quotes. Paraphrase scenes. Argumentative tone.

