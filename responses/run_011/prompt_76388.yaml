      *   The core tension is about *agency* and *clean hands*.
      *   Deontologist: I can't lie, even to stop lying. My hands must be clean.
      *   Consequentialist: You're letting everyone else lie forever just to keep your hands clean.
      *   The Twist/Punchline Opportunity: What if someone *else* uses the Engine?
          *   If *I* use it: I lie (bad), world is good (no lies).
          *   If *I* don't use it: I don't lie (good), world is bad (endless lies).
          *   If *Someone Else* uses it: They lie (bad for them), world is good (no lies for me).
