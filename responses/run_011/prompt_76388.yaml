      *   The "Sting": The deontologist prays for a savior who is willing to damn themselves. The consequentialist prays for a savior who is willing to do the math.
      *   Better angle: The "ownership" of the lies. If I push the button, I own the lie. If I don't, others own their lies. If someone else pushes the button, they own the lie.
