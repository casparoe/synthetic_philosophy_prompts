answer: |-
  You have identified a real and distinct mechanism, and your intuition that it sits adjacent to—but is not identical to—standard costly signaling or countersignaling is correct.

  There is no single canonical term in the literature that captures this specific *motive-concealment* requirement. The closest established concepts are **Countersignaling** and **Taboo Trade-offs**, but neither fits your carving perfectly.

  *   **Countersignaling** (Feltovich, Harbaugh, To) typically describes high-status individuals *omitting* a signal that lower-status individuals feel compelled to send (e.g., the richest person wearing a t-shirt). In your case, the signal (the research, the piano playing) *is* sent. The concealment applies only to the *causal history* (the motive).
  *   **Taboo Trade-offs** (Philip Tetlock) describes the social revulsion that occurs when "sacred" values (curiosity, art) are explicitly exchanged for "secular" values (college admissions, status). This explains the *punishment* for speaking the motive, but not the *signaling value* of the silence.

  Since no established term covers the intersection of these things—the requirement that a costly signal must be disavowed as instrumental to retain its value—I will follow your instruction: I will name it, define it, and provide the boundaries you requested.

  ### The Concept: The Authenticity Constraint

  **Definition:** A social signaling regime in which the value of a costly display is contingent upon the agent's refusal to acknowledge the instrumental benefits of that display. The signal functions not merely to demonstrate *capacity* (I can do this), but to demonstrate *type* (I am the kind of person who does this without being paid or credentialed).

  **The Mechanism:**
  In standard costly signaling, the cost (time, effort) ensures honesty. In the Authenticity Constraint, the *silence regarding the payoff* ensures honesty.
  1.  **The Signal:** The accomplishment (research, music).
  2.  **The Handicap:** The prohibition on admitting the strategic motive.
  3.  **The Information Conveyed:** "I am not a pure maximizer."

  **Why it is Rational, Not Just Etiquette:**
  You asked whether admitting the motive changes the evidence or only politeness. It changes the evidence.
  Admitting a strategic motive reveals you are a **contingent cooperator**. A strategist performs the action *only so long as* the payoff exceeds the cost. If the college admission is secured, or if a higher payoff appears elsewhere, the strategist stops.
  By concealing the motive, you signal that you are a **constrained cooperator** (or "true believer"). You imply that your behavior is driven by internal preferences that will persist even when external rewards vanish.
  In high-trust environments (like a research lab or an artistic community), persistence is more valuable than raw ability. Therefore, hiding the strategy is a rational way to signal long-term reliability. The "strategic" label is pejorative because it implies *fragility of commitment*.

  ### The Animal Analogue
  You asked if this appears in animals. The answer is **no**, and the reason explains why the phenomenon feels so human.
  Animals cannot avow motives. A peacock cannot say, "I grew this tail to attract mates," nor can it lie and say, "I grew this tail because I like the weight." Because they cannot speak to their intent, their signals are judged solely on physical cost.
  The Authenticity Constraint requires **language** because it requires the possibility of a **false avowal**. The "cost" here is not just the summer spent in the lab; it is the social risk of maintaining a shared fiction. It is a second-order handicap: "I am willing to participate in the pretense that this is not a transaction." Only creatures that can negotiate the terms of a transaction can hide them.

  ### The Inflationary Spiral
  You observed that as more students perform the disavowed thing, the frontier moves toward costs that leave no paper trail. This is a classic **Signal Inflation** dynamic, governed by **Goodhart's Law** ("When a measure becomes a target, it ceases to be a good measure").
  1.  **Phase 1:** Research is rare. Doing it signals ability.
  2.  **Phase 2:** Everyone does research. Doing it no longer signals ability.
  3.  **Phase 3:** The signal shifts to *how little you seem to care about the outcome*.
  4.  **Phase 4:** The "cost" becomes inefficiency. To prove you aren't strategic, you must undertake tasks with *lower* instrumental value (e.g., obscure research with no publication potential, or "playing only for yourself" which yields no recording).
  This leads to economic waste. The group expends energy on activities specifically *because* they are hard to monetize or credentialize. This is rational for the individual (to separate from the crowd) but inefficient for the collective.

  ### Boundaries and Carving

  To distinguish this from nearby concepts, here are the boundaries:

  **1. Versus Ordinary Hypocrisy**
  *   **Hypocrisy:** Claiming a virtue you do not possess to deceive an audience that believes you.
  *   **Authenticity Constraint:** Claiming a motive (curiosity) that may be mixed, in an environment where the audience *suspects* the strategic motive but agrees not to mention it.
  *   **Boundary Case:** If the student *hates* science and is caught hating it, it becomes hypocrisy. If the student loves science *and* wants college credit, but only mentions the love, it is the Authenticity Constraint. The difference is whether the underlying capacity is real.

  **2. Versus Ordinary Modesty**
  *   **Modesty:** Downplaying the *magnitude* of the achievement ("It was nothing").
  *   **Authenticity Constraint:** Acknowledging the achievement but downplaying the *intent* ("It was fun," not "It was hard").
  *   **Boundary Case:** A student who says "I'm not that good at piano" is being modest. A student who says "I don't care about the recital" while playing perfectly is operating under the Authenticity Constraint.

  **3. Versus Countersignaling (The "Elite Don't Signal" Argument)**
  *   **Countersignaling:** I am so secure in my status I don't need to show you anything. (e.g., The CEO wears jeans).
  *   **Authenticity Constraint:** I am showing you something, but I must pretend I didn't do it *for* you.
  *   **Boundary Case:** If the pianist simply didn't show up to the recital, that would be countersignaling. By showing up but claiming indifference, she is signaling under the Authenticity Constraint.

  **4. Versus Snobbery**
  *   **Snobbery:** Excluding others based on taste to elevate oneself.
  *   **Authenticity Constraint:** Excluding others based on *motive transparency*.
  *   **Boundary Case:** Snobbery says, "You listen to pop, I listen to classical." The Authenticity Constraint says, "You play classical for the applause, I play it for the music." The former is about taste; the latter is about moral orientation toward the work.

  ### Clear Non-Instances

  To ensure the carving is sharp, here are two clear non-instances:

  1.  **Commercial Exchange:** A tutor charges $50/hour and says, "I am doing this for money." This is not a violation of the Authenticity Constraint because the interaction is explicitly framed as a market transaction. There is no pretense of intrinsic motive to protect.
  2.  **Radical Honesty:** A student says, "I did this research solely to get into Harvard, and I don't care about the science." This collapses the signal. It does not become a *different kind* of signal; it becomes a null signal. It places the student outside the status game entirely, categorizing them as a mercenary rather than a member of the community.

  ### Summary
  You have described **The Authenticity Constraint**. It is a signaling regime where the *denial of instrumentality* is the cost that certifies the signal. It is rational because it distinguishes long-term partners from short-term maximizers. It is human-specific because it relies on the ability to lie about intent. It is distinct from countersignaling because the display is made, but its causal history is obscured. And it inevitably leads to inefficiency, as the most reliable signal becomes the one that looks least like work.
