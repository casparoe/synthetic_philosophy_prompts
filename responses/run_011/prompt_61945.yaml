  ### The Thought Experiment: "The Moderate's Trap"

  **Setting:** A one-off labor negotiation between a Union Leader (Player 1) and Management (Player 2).
  **Context:** The Union must choose a single public stance to maintain membership cohesion. Splitting the difference or randomizing between stances is organizationally impossible (it signals weakness and fractures the vote). Management chooses a counter-tactic.
  **Constraint:** Player 1 cannot use a randomization device. She must pick a pure strategy.

  #### 1. The Payoff Matrix
  Payoffs are (Union, Management). Integers only.

  | | **L** (Lockout) | **C** (Concede) | **R** (Retreat) |
  | :--- | :---: | :---: | :---: |
  | **T** (Hardline) | 10, 5 | 0, 0 | 0, -1 |
  | **M** (Moderate) | 4, 0 | 4, 5 | 10, -1 |
  | **B** (Conciliatory)| 0, 5 | 10, 0 | 0, -1 |

  #### 2. The Elimination Process

  **Round 1: Management's Move**
  Management compares $L, C, R$.
  *   Compare $L$ vs $R$: $5 > -1$ (vs T), $0 > -1$ (vs M), $5 > -1$ (vs B).
  *   **Result:** $R$ is strictly dominated by $L$. $R$ is eliminated.
  *   *Note:* $M$ is safe here. Against the full set $\{L, C, R\}$, $M$ yields 10 against $R$, while any mix of $T$ and $B$ yields 0. $M$ is not dominated yet.

  **Round 2: Union's Move (The Critical Step)**
  Union faces the subgame $\{L, C\}$.
  *   **Pure Comparison:**
      *   $T$ vs $M$: $T$ wins on $L$ (10>4), loses on $C$ (0<4).
      *   $B$ vs $M$: $B$ wins on $C$ (10>4), loses on $L$ (0<4).
      *   **Result:** $M$ is *not* strictly dominated by any pure strategy. A "Pure-Only" reasoner keeps $M$ alive.
  *   **Mixed Comparison:**
      *   Consider strategy $\sigma = 0.5T + 0.5B$.
      *   Against $L$: $0.5(10) + 0.5(0) = 5$. ($5 > 4$).
      *   Against $C$: $0.5(0) + 0.5(10) = 5$. ($5 > 4$).
      *   **Result:** $\sigma$ strictly dominates $M$.
      *   **Standard ISD:** Delete $M$.
      *   **Realist Constraint:** The Union Leader *cannot* play $\sigma$. She cannot tell half her members to be Hardline and half to be Conciliatory. The strategy $\sigma$ is physically/organizationally unavailable.

  **Round 3: Management's Move (Post-Deletion)**
  *   **If $M$ Deleted (Mixed ISD):** Management faces $\{T, B\}$ and $\{L, C\}$.
      *   $L$ yields 5 against both $T$ and $B$.
      *   $C$ yields 0 against both $T$ and $B$.
      *   $L$ strictly dominates $C$. Management plays $L$.
      *   Union best response to $L$ is $T$ (10 > 0).
      *   **Prediction:** $(T, L)$.
  *   **If $M$ Kept (Pure ISD):** Management faces $\{T, M, B\}$ and $\{L, C\}$.
      *   $L$ beats $C$ against $T$ and $B$, but loses to $C$ against $M$ (0 < 5).
      *   $C$ beats $L$ against $M$, but loses to $L$ against $T$ and $B$.
      *   **Result:** No further dominance.
      *   **Prediction:** $\{T, M, B\} \times \{L, C\}$. $M$ remains a live possibility.

  #### 3. The Assumption & The Outcome

  **The Assumption:**
  The mixed-strategy deletion step assumes **Convexity of the Strategy Space**. It presumes that if a probabilistic combination of two acts is better than a third, the third is irrational, *even if the combination itself is not an available act*. It treats the "Mix" as a valid benchmark for rationality, not just a valid choice.

  **The Divergence:**
  *   **Accept Mixed Domination:** Predicts unique outcome $(T, L)$. The Moderate stance ($M$) is deemed irrational.
  *   **Refuse Mixed Domination:** Predicts indeterminacy. The Moderate stance ($M$) survives. The Union Leader might rationally play $M$ hoping Management plays $C$.

  #### 4. The Fragile Feature

  The case hinges entirely on **Column $R$**.
  *   **Function:** $R$ acts as a "Shield." It protects $M$ from mixed domination in Round 1 (because $M$ scores 10 vs $R$ while the mix scores 0).
  *   **Fragility:** $R$ must be strictly dominated for Player 2 (so it disappears in Round 1) but *not* dominated for Player 1 (so it stays long enough to protect $M$).
  *   **Failure Mode:** If $R$ did not exist, $M$ would be mixed-dominated in Round 1, and the "Round 2 Revelation" would vanish. If $R$ were not dominated for Management, $R$ would survive, $M$ would never be dominated, and the puzzle dissolves. The entire paradox relies on a strategy that is "Suicidal for one player, Protective for the other."

  #### 5. The Strongest Objection: "Mixed Strategies are Beliefs"

  **The Objection:**
  "A mixed strategy isn't a choice to flip a coin; it's a representation of the *other player's uncertainty*. When we say $\sigma$ dominates $M$, we mean that *no matter what Management believes* about the Union's choice (between $T$ and $B$), Management's best response makes $M$ a poor choice for the Union. Since $M$ is never a Best Response to any belief over $\{L, C\}$, a rational Union Leader wouldn't play it anyway, regardless of whether she can randomize. The deletion is licensed by **Rationalizability**, not by the availability of the mix."

  **Does it kill the case?**
  It **dents** the case but does not kill it.
  *   **Why it dents:** It correctly points out that $M$ is unstable even without randomization (since $M$ is never a Best Response in the subgame). If the goal is simply to predict behavior, the objection wins: $M$ shouldn't be played.
  *   **Why it survives:** The thought experiment targets **Iterated Strict Dominance (ISD)** specifically, not Rationalizability. ISD is a procedural algorithm that says: "Delete $s_i$ if $\exists \sigma_i$ such that $u(\sigma_i) > u(s_i)$."
      *   If $\sigma_i$ is not in the strategy set $S_i$, the premise of the ISD algorithm is false.
      *   The objection conflates the *algorithm* (ISD) with the *solution concept* (Rationalizability).
      *   **The Philosophical Point:** If we teach students that ISD justifies deleting $M$, we are implicitly teaching them that unavailable strategies can dominate available ones. If the Union Leader asks, "Why can't I play Moderate?", answering "Because a coin-flip between Hardline and Conciliatory would beat it" is a category error if coin-flipping is impossible. The objection saves the *prediction*, but it concedes that ISD is the wrong tool for the job when strategy spaces are non-convex.

  **Verdict:** The objection forces you to admit that $M$ is irrational for *epistemic* reasons (beliefs), but it confirms that ISD relies on an *ontological* assumption (available randomization) that the setup explicitly violates. The tension remains: **Does rationality forbid playing $M$ because it's dominated by an impossibility?**
