prompt: |-
  Ok so I'm not a scientist, I just fall down rabbit holes late at night, but I can't shake the question of whether DNA actually *is* a code or whether that's just a figure of speech everyone agreed to live with because it was handy.

  The thing that got me stuck: a code like Morse seems to need a reader who already knows the convention, and the dots don't do anything on their own. But DNA apparently does stuff, it's causally wrapped up in making the protein, no interpreter holding a rulebook needed... except there IS a ribosome and tRNA and a whole translation apparatus sitting there, so maybe there is a reader after all and I've just pushed the problem back one level. And then someone told me the mapping is basically arbitrary but got locked in super early and nobody could change it afterwards without everything breaking, which sounds less like a designed code and more like a habit that calcified.

  I also have my own pet test, tell me if its stupid: I reckon something only counts as a real code if a *misreading* is possible and the code itself doesn't mind. A typo in a book is still a book. Does DNA pass that, or does it fail it because there's nobody home to notice?

  Here's what I want from you. Rate each of these on how literally (not poetically) true it is, 0-10, then rank them best to worst, one or two sentences each on what the rating hinges on:

  - DNA is a blueprint
  - DNA is a recipe
  - DNA is source code / a program
  - DNA is a message in a bottle
  - DNA is a compressed archive
  - DNA is a set of instructions
  - DNA is not a code at all, just chemistry all the way down
  - DNA is a code only relative to one particular cell's machinery (the code is a convention, just a very old frozen one)

  Then add one description of your own that you think belongs on the list and isn't there, and rate that too. And say which of the eight pass my misreading test, and whether the ones that fail it are failing because they're bad descriptions or because my test is bad.

  Last bit, and I do care about this: tell me how confident you are in the overall picture, as a rough number or level, and then name the single rating or claim here you're least sure about and why it's shaky. Don't hedge everything equally, I want to know where the actual soft spot is.
