answer: |-
  Here is a rigorous mapping of the 1883–1911 standardization episode onto David Lewis's analysis of convention, followed by an assessment of your structural distinction and a concluding classification of the theoretical fit.

  ### 1. Mapping the Population and Regularity

  Lewis's analysis is relativized to a population $P$ and a recurrent situation $S$. You must distinguish two overlapping but distinct conventions here, corresponding to the two dates.

  **The 1883 Railway Convention**
  *   **Population ($P_{1883}$):** North American railway companies, stationmasters, and commercial travelers. Sovereign states are *not* the primary agents here; the change was private agreement.
  *   **Situation ($S_{1883}$):** Scheduling trains and publishing timetables across long distances.
  *   **Regularity ($R_{1883}$):** Setting station clocks and timetables to one of five continental standard zones rather than local solar time.
  *   **Alternatives:** Continuing with local solar time (the pre-1883 norm) or adopting a different zoning scheme.
  *   **Fit:** This is a near-perfect Lewisian case. The alternatives were roughly symmetrical before the switch (local time worked fine locally); the preference was purely for coordination (avoiding missed connections); and the switch was simultaneous, creating immediate common knowledge.

  **The 1884 Meridian Convention**
  *   **Population ($P_{1884}$):** Sovereign states (represented by delegates), international shippers, astronomers, and hydrographic offices.
  *   **Situation ($S_{1884}$):** Determining longitude for navigation and civil time reckoning.
  *   **Regularity ($R_{1884}$):** Reckoning longitude and time from the Greenwich meridian.
  *   **Alternatives:** Reckoning from Paris, Washington, Ferro, or a neutral meridian.
  *   **Fit:** This is where the mapping strains. The population is heterogeneous (states have different preferences than shippers), and the "recurrent situation" spans decades of adoption rather than a single switch.

  ### 2. The Decay of Arbitrariness (Condition 5)

  Lewis's fifth condition requires that there be an alternative regularity $R'$ that *would* have served the coordination purpose equally well, such that the choice of $R$ over $R'$ is arbitrary.

  **1860 vs. 1884:** In 1860, the symmetry condition held. Paris, Greenwich, and Washington were functionally equivalent zero-points. By 1884, they were not. With 72% of shipping tonnage already using Greenwich charts, the cost of switching to Paris was no longer symmetrical with the cost of switching to Greenwich. The network effect had destroyed the arbitrariness.

  **Theoretical Cost:** For Lewis, if $R$ is strictly *better* than $R'$ due to precedent, it ceases to be a convention in his strict sense and becomes a "locked-in" equilibrium. A Lewisian defender might argue that *ex ante* (before the tonnage shift), the choice was arbitrary, and conventions persist even after the symmetry breaks. However, this concedes that Lewis's analysis explains the *origin* but not the *persistence* once path dependence takes hold. The 1884 Conference was not choosing between equal options; it was ratifying a *fait accompli*. If you insist on Lewis's strict arbitrariness clause, the 1884 resolution is not a convention but a recognition of a dominant standard.

  ### 3. Preferences and National Prestige (Condition 3)

  Lewis requires that participants have "approximately the same preferences" over the combinations of actions. This is a pure coordination assumption.

  **The Problem:** For France, the combination (France uses Paris, Others use Greenwich) was preferred to (France uses Greenwich, Others use Greenwich) due to national prestige and scientific standing. This introduces a conflict of interest. It is no longer a pure coordination game (where we just want to match); it is a "Battle of the Sexes" (where we want to match, but prefer *which* match we get).

  **Does Lewis Fail?** Lewis acknowledges that conventions can exist in mixed-motive games, provided the coordination benefit outweighs the conflict. However, your case shows the conflict *delayed* the convention for 27 years. Lewis's model predicts convergence once common knowledge is established. The French resistance suggests that the "preferences" clause is violated significantly enough to stall the equilibrium.
  **Verdict:** This is a tolerable restriction, not a fatal one. Lewis can absorb this by saying the coordination preference (trade/navigation efficiency) eventually outweighed the prestige preference. But it requires admitting that conventions can be held hostage by minority preferences in a way his simple model doesn't explicitly quantify.

  ### 4. Common Knowledge and the Conference

  Lewis treats common knowledge as a prerequisite for convention. He often assumes it arises from precedent or salience. Your episode reveals the *mechanism* of its production.

  **The Conference as Engine:** The International Meridian Conference did not just discover common knowledge; it manufactured it. The vote (22–1) was a public signal that transformed probabilistic expectations ("I think most ships use Greenwich") into knowledge ("I know that the states agree to Greenwich").
  **Lewis's Resources:** Lewis has room for this. He discusses "agreement" and "signaling." The Conference acted as a Schelling focal point. However, Lewis tends to treat common knowledge as a static background condition. Your case suggests it is a dynamic variable that can be *created* by institutional performance. A Lewisian revision would need to treat the Conference not as the creator of the rule, but as the creator of the *common knowledge of the rule's salience*.

  ### 5. Creation vs. Ratification

  Your colleague argues you have the direction of explanation backwards: the convention existed among navigators; the Conference merely ratified it.

  **Argument:** The Lewisian analysis supports your colleague. By 1884, a convention *already existed* within the sub-population of international shippers (the 72% tonnage). They were already conforming, expecting others to conform, and preferring conformity. The Conference extended the population $P$ from *navigators* to *sovereign states*.
  **Implication:** The 1884 event was not the genesis of a convention but the *scaling* of one. Lewis's theory explains why the navigators converged (coordination problem), but it struggles to explain why the States needed a conference to join a convention that was already functionally operative. This suggests that for sovereign states, "convention" requires a different threshold of common knowledge (formal treaty vs. tacit practice) than for commercial actors. Lewis does not distinguish between *commercial* and *political* populations in his formalism, which is a gap your case exposes.

  ### 6. Translatable vs. Untranslatable Deviation

  This is your strongest philosophical intervention. Lewis's condition (1) requires that "almost everyone" conforms. He does not distinguish between a defector who breaks the system and a defector who remains interoperable.

  **The Distinction:**
  *   **Untranslatable (Driving):** Defection is incompatible. If one drives left on a right-road, the coordination value drops to zero for that interaction.
  *   **Translatable (Time):** Defection is convertible. France's use of Paris Mean Time minus 9m21s is mathematically isomorphic to Greenwich Mean Time. The coordination value is preserved because the conversion cost is fixed and low.

  **Lewis's Blind Spot:** Lewis's quantifier ("almost everyone") cannot register the *cost* of the deviation. In his model, France in 1890 looks like a threat to the convention similar to a railway driving on the wrong track. But the convention did not collapse. Why? Because the deviation was translatable.
  **Rival Frameworks:**
  *   **Sugden/Young/Skyrms (Evolutionary):** This framework handles this best. It treats conventions as stable equilibria based on payoff. The "payoff" of the Greenwich convention was high enough to tolerate the French outlier because the cost of coercing France was higher than the cost of the translation. The tonnage statistics do the explanatory work here, not the reasoning of agents.
  *   **Bicchieri (Norms):** She distinguishes between empirical expectations (what others do) and normative expectations (what others think ought to be done). France lacked the *normative* expectation until 1911. This explains the delay better than Lewis, who focuses on empirical coordination.
  *   **Lewis:** To save Lewis, one must argue that France was *effectively conforming* because the offset was constant. But Lewis defines conformity by the rule ($R$), not the function. If $R$ is "Use Greenwich," France violated $R$. If $R$ is "Use a convertible standard," France conformed. Lewis lacks the resources to define $R$ functionally rather than formally.

  ### 7. Conclusion: Sorting the Features

  Here is the classification of the episode's features relative to Lewis's theory:

  **Pile 1: What Lewis Explains Well**
  *   **The 1883 Railway Switch:** This is a paradigmatic Lewisian convention. A population ($P_{rail}$) faced a coordination problem with symmetrical alternatives. A salient focal point (Allen's plan) created common knowledge, and simultaneous adoption secured the equilibrium.
  *   **The Role of Precedent:** Lewis correctly predicts that once the 72% tonnage threshold was crossed, the cost of switching away from Greenwich became prohibitive for new adopters, reinforcing the convention.

  **Pile 2: Anomalies Lewis Must Absorb at Cost**
  *   **The Loss of Arbitrariness:** By 1884, Greenwich was not an arbitrary choice among equals; it was a dominant standard. Lewis must stretch the definition of "equally satisfactory alternative" to include options that are practically inferior due to network effects.
  *   **Conflicting Preferences:** The French prestige motive violates the "same preferences" clause. Lewis must admit that conventions can emerge even when agents have secondary preferences for *non-conformity*, provided the primary coordination preference is strong enough.

  **Pile 3: Outside His Remit (Tells Us Nothing About Him)**
  *   **The Mechanics of Conversion:** The mathematical fact that time zones are linearly translatable while driving directions are not is a physical constraint, not a philosophical one. Lewis is not responsible for the physics of time. However, his failure to incorporate *interoperability costs* into the definition of conformity is a theoretical omission.
  *   **The Specific Diplomacy:** The details of the vote (22–1) and the specific delegates are historical data. Lewis cares only that a public signal occurred, not the parliamentary procedure used to generate it.

  **Pile 4: What a Defender of Lewis Should Say in Reply**
  *   **On Translation:** A defender should argue that France *was* conforming to the relevant regularity. The regularity $R$ is not "Set clock to Greenwich" but "Set clock such that it is convertible to Greenwich." Under this description, France conformed from 1884 to 1911, and the 1911 change was merely cosmetic (changing the label, not the practice). This saves the "almost everyone conforms" clause.
  *   **On Common Knowledge:** A defender should argue that the Conference was necessary not to create the convention, but to make it *common knowledge among states* that the convention was binding for civil purposes, distinct from its maritime usage. Lewis allows for conventions to be nested within populations; the Conference simply aligned the State population with the Navigator population.

  **Final Assessment:**
  Your distinction between translatable and untranslatable deviation is the critical lever. Lewis's theory is robust enough to handle the 1883 Railway case, but it requires significant patching to handle the 1884 Meridian case without collapsing into a tautology about "whatever works is a convention." The evolutionary-institutional tradition (Sugden/Young) offers a superior explanation for the *persistence* of the convention despite the French outlier, as it relies on stability rather than rational agreement. However, Lewis remains superior at explaining the *reasoning* of the 1883 adopters. Your monograph should argue that Lewis provides the *logic* of the switch, but the evolutionary framework provides the *dynamics* of the settlement.
