      *Drafting text:*
      We write this statement to clarify where our agreement ends and where our genuine disagreement begins regarding the nature of reasons for action. We jointly affirm that a sound deliberative route is not merely a logical deduction but a process that corrects errors of fact and imagination, allowing an agent to see how their actions connect to their ends. We agree that a reason-explanation is supposed to explain why an agent acted or ought to act by citing considerations that count in favor of that action, and we agree that deliberation can genuinely enlarge an agent's motivations rather than merely rearranging existing ones through new information. However, we must flag that our agreement on the phrase "enlarge motivations" risks being superficial; one of us views this enlargement as uncovering latent elements within the agent's subjective set, while the other views it as aligning the agent with independent normative truths. Despite this tension, we sign onto the claim that rational persuasion is possible and that agents can be mistaken about what they have reason to do, even if we diverge on what makes that mistake possible.

      The residual disagreements concern the metaphysical grounding of these reasons. The first of us, the internalist, states the disagreement thus: a reason statement is true only if the agent could reach the motivation to act via a sound deliberative route from their existing subjective motivational set, meaning there are no reasons for an agent that are entirely detached from what they could care about. The second of us, the externalist, states the disagreement thus: a reason statement can be true even if the agent has no conceivable motivational route to the action from their current set, because reasons exist as objective normative facts that do not depend on the agent's psychological constitution. We have examined whether this dispute is merely verbal, turning on whether we define reason as motivation-grounded or normativity-grounded. We conclude it is not merely verbal because it yields different predictions about blame and rational criticism in hard cases, though we acknowledge we sometimes talk past each other when using the word "could" in relation to deliberative routes.

      To move forward, we identify three cruxes where empirical or conceptual clarification would force concessions. Consider first the agent who, fully informed, unconfused, and given unhurried reflection, remains entirely unmoved by a value she understands perfectly well, such as a sophisticated hedonist who grasps the value of artistic integrity but feels no pull toward it. We agree that the case bears on whether understanding entails motivation. The externalist predicts that we will still rightly say she has a reason to be integrity-bound and is irrational for ignoring it, while the internalist predicts that we will ultimately describe her as having no reason, only us observers having reasons to wish she were different. If the externalist finds that competent speakers universally withdraw reason attributions in this case, he will concede that reasons require a motivational hook. If the internalist finds that competent speakers universally maintain the reason attribution despite the lack of motivation, she will concede that reasons can exist outside the subjective set.

      Consider second the agent whose motivations would be expanded by deliberation so that she ends up holding reasons she could not have articulated beforehand, such as a person who comes to care about strangers through reflecting on their own desire for community. We agree that this case bears on whether new motivations are discoveries or creations. The internalist predicts that analysis will always show a traceable chain back to the original subjective set, perhaps via imaginative identification, whereas the externalist predicts that the chain will break, showing the agent responding to a reason that was there all along. If the internalist cannot produce a plausible deliberative chain in a clear case of conversion, she will concede that deliberation can create reasons ex nihilo. If the externalist finds that every conversion story relies on prior contingent cares, he will concede that external reasons are idle posits.

      Consider third the reproacher who blames someone for a failure the agent insists she had no reason to avoid, such as a bystander blaming a selfish individual for not helping. We agree that this case bears on whether blame presupposes a shared reason. The externalist predicts that the blame makes sense only if the agent actually had a reason independent of their motives, making the blame a recognition of fact. The internalist predicts that the blame is either a manipulation attempt to alter the agent's motives or a false presupposition that the agent shares the reproacher's values. If the externalist finds that blame is universally recognized as inappropriate when the agent truly lacks the motivational capacity, he will concede that blame requires internal grounding. If the internalist finds that blame is deemed appropriate even when the agent is psychologically incapable of caring, she will concede that our blame practices presuppose external reasons. We submit that settling these predictions would resolve much of the quarrel, leaving only technical metaphysics behind.

