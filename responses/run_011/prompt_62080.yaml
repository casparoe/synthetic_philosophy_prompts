      *   Para 2: Flagging superficial agreement & Residual Disagreements (300 words). Two phrasings.
      *   Para 3: Verbal dispute check (100 words).
      *   Para 4: Cruxes with the three cases (450 words). Predictions and concessions.
      *   Total target: ~1100 words.

  5.  **Drafting - Writing (incorporating constraints):**

      *   *Voice:* "We write this..." "We agree..."
      *   *Content:* Ensure Williams-style internalism vs. Realist externalism is accurate.
      *   *Constraint Check:* No bold, no bullets, no headings. Continuous prose.

