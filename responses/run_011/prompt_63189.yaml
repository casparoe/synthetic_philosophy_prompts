answer: |-
  # Standard Time

  The clock in the square does not keep time so much as it declares it. My job is to ensure the declaration is consistent. I climb the tower every morning at six, before the traffic begins to thicken on the main drag, and I check the escapement. I oil the gears. I listen to the pendulum. It is a heavy, iron sound, a heartbeat for the town that requires no blood. If the clock gains a minute, I subtract it. If it loses, I add. The town runs on what I give them. They set their ovens by it, their buses, their school bells. They trust the brass hands more than they trust the sun.

  I come home at five-thirty. She comes home at six.

  There is a quarter of a second between the moment her key turns in the lock and the moment I hear the click from the kitchen. Sometimes it is less. Sometimes, when the humidity hangs low over the highway or the relay stations are busy with other people's data, it stretches to half a second. I have learned to live in the gap. I have learned to wait for the click before I call out that I am here. If I speak too soon, my voice arrives while she is still turning the key, and she will startle when the sound overlaps with the motion. It feels like being interrupted by a ghost.

  She works for the symphony now. It was a compromise. Before the procedure, she was a soloist. She played the violin with a speed that made the air hum. After, the orchestra manager worried about the lag. A quarter of a second is an eternity in music. If she sees the conductor's baton drop and her arm responds a beat later, the section fractures. But she insisted. She said she could anticipate. She said she could feel the music in her muscles before the signal reached Houston.

  So she plays. She sits in the second chair, where the timing is less exposed than the first, and she watches the conductor closely. She plays ahead of the beat, aiming for where the sound will be when it arrives at her ears. The audience doesn't notice. They hear the ensemble. They hear the blend. Only I know that she is living in the past, correcting for a delay that no one else can hear.

  When she walks through the door, she hangs her coat on the hook by the entrance. Sometimes I take it from her. Sometimes I leave it. It is a small negotiation. If I take it, I am caring for her body. If I leave it, I am waiting for her to decide. She usually decides within thirty seconds. The body stands there, shaking off the rain, while the mind processes the room temperature, the smell of dinner, the position of my chair.

  "Hello," she says.

  "Hello," I say.

  I time it. I cannot help it. Tonight the lag is clean. One hundred and twenty milliseconds. She is close to the receiver.

  She walks into the kitchen and kisses me. Her lips are warm. The kiss is synchronized. This is the intimacy of the house; the distance is forty miles, but the room is small. The radio waves travel faster than sound. Inside these walls, we are almost simultaneous.

  "How was the tower?" she asks.

  "Windy," I say. "The pendulum swung wide."

  "Did you adjust the weight?"

  "Not yet."

  She opens the refrigerator. The light hums. She takes out the carrots. She begins to peel them. The sound of the knife against the board is sharp. I watch her hands. They are steady. There is no tremor. The signal is strong.

  I do not tell her about the switch.

  I saw it two months ago, on the only day I visited the facility. It was a gray building on the edge of Houston, indistinguishable from a warehouse. They led me down a corridor that smelled of antiseptic and ozone. They showed me the tank. It was not like the pictures in the magazines. There was no glowing fluid, no dramatic lighting. It was a stainless-steel cylinder, waist-high, with a thick glass port on top. Inside, suspended in a clear gel, was the gray matter of her mind. It looked like a walnut soaked in water. It looked small. It looked heavy.

  There were tubes running into it, and wires. And on the side of the tank, near the base, there was a switch. It was red, protected by a plastic cover. A technician stood beside me. He was young, bored. He tapped the side of the cylinder.

  "This is the primary," he said. "Tissue."

  He pointed to the switch. "Secondary implementation is on standby. Non-tissue. Silicon-based emulation. If the tissue fails, metabolic collapse, power surge... the switch flips. Or we flip it. Keeps the body running. You wouldn't know the difference. Maybe a change in temperament. Maybe none."

  He said it like he was talking about a backup generator for a hospital. He said *you wouldn't know the difference*. He did not say *she* wouldn't know. He said *you*.

  I looked at the glass. I looked at the brain. It did not look like it was thinking. It looked like it was waiting.

  "Has it ever been used?" I asked.

  "Not for this model," he said. "But it's there."

  He closed the plastic cover over the switch. I did not ask what happened to the tissue if the secondary took over. I did not ask if the tissue was discarded or stored. I just nodded. I put my hand on the glass. It was cool. I wanted to say something to her, but there was no microphone. I just stood there. I thought about the body at home, washing the dishes, waiting for me to return from this trip. I thought about the switch.

  I haven't been back since.

  A storm rolls in on Thursday. The barometer drops fast. I am in the tower when the sky turns the color of a bruise. The wind picks up, whipping the flags on the municipal building. I know what this means for the signal. The relay stations are exposed. The atmospheric interference will scatter the transmission.

  I finish my work early. I secure the tower. I drive home in the rain. The wipers slap against the glass. I think about the lag. I think about her driving home from the rehearsal hall. If the signal degrades, her motor control could stutter. She could drop a glass. She could miss a step on the stairs.

  I get home before her. I wait in the kitchen. I watch the clock on the wall. It is not the town clock; that one is too high to see from here. This is a small electric clock above the stove. The second hand ticks loudly.

  Six o'clock. Six-oh-one.

  The phone rings. It is the facility. I let it go to voicemail. I know what they will say. *Weather advisory. Potential latency spikes. Do not be alarmed.*

  I know about the switch. I know there is a secondary implementation waiting in Houston. If the tissue falters, the silicon takes the load. The body keeps moving. The body keeps coming home.

  So I do not call them back. I do not drive out to the highway to meet her. I stay in the kitchen. I finish chopping the vegetables. I listen to the rain.

  She arrives at six-ten. The lag is bad. I hear the car door close, but she does not appear in the hallway for a full second. When she walks in, her movement is jerky. She stops at the coat hook. She hangs her coat. She takes it down. She hangs it again.

  "Storm," she says. Her voice is flat. The audio compression is stripping the tone.

  "Yes," I say.

  "I dropped a bow," she says. "In the hall. I didn't feel it leave my hand."

  "I'll fix it," I say.

  She looks at me. Her eyes focus slowly. "Okay."

  She walks to the table. She sits. She does not shake off the rain. The water drips from her hair onto her shoulders. I get a towel. I dry her hair. She does not move to help me. She sits still, like a statue waiting for the wind to pass.

  I know the switch is there. I know the body is safe. So I do not panic. I dry her hair. I bring her soup. I eat my own. The lag stretches the silence between us. I ask a question. She answers three spoonfuls later. We eat in a delay. It is like dancing with someone who is learning the steps. You have to trust that they will arrive where you expect them to be.

  After dinner, she goes to the living room. She takes out her violin. She does not play. She just holds it. She runs her fingers over the strings. The sound is muted.

  "Are you tired?" I ask.

  "The signal is noisy," she says. "I can't hear the pitch."

  "Rest then."

  She puts the violin away. She comes to bed. We lie down. The mattress sinks. I reach for her hand. She is already holding mine. The pressure is firm. The lag is gone.

  It is Tuesday. The sky is clear. The relay stations are running at full capacity. We are eating dinner. I am talking about the clock. I am telling her about the escapement, how the teeth wear down over time, how I have to file them to keep the rhythm true.

  "And the pendulum?" she asks.

  "Swinging true," I say.

  She nods. She lifts her fork. She puts it in her mouth. She chews. She swallows.

  "I love you," I say.

  "I love you," she says.

  She says it exactly as I finish the sentence. There is no gap. There is no transmission time. The words overlap perfectly, like a echo that knows the future.

  I stop chewing. I look at her. She is looking at me. Her eyes are clear. Her face is relaxed. She reaches for her wine glass. She lifts it. She drinks. Every movement is fluid. Every movement is immediate.

  This is the worst it has ever been.

  When the lag is long, I know she is there. I know the signal is traveling forty miles through the air, bouncing off towers, decoding in Houston, and coming back. The delay is the proof of the distance. The delay is the proof of the connection.

  When the lag is zero, the distance is gone. But the distance is not gone. The brain is in Houston. The body is here. Physics dictates a delay. Light takes time. Radio waves take time.

  If there is no time, there is no travel.

  I put my fork down. I watch her. She continues to eat. She does not notice my silence. She cuts her meat. She lifts the fork. She smiles.

  "Good?" I ask.

  "Very," she says. Again, the timing is perfect. It is too perfect. It is mechanical.

  I think about the switch. I think about the red plastic cover. I think about the technician saying *you wouldn't know the difference*.

  I do not ask her if she feels different. I do not ask her if she knows where she is. I do not touch her arm to check for warmth. I know the backup exists. I know that if the tissue failed, the system would compensate. I know that the body would keep eating dinner.

  So I do not interrupt. I do not test her. I finish my wine. I stand up. I take my plate to the sink.

  "Will you play tonight?" I ask.

  "Yes," she says.

  She goes to the living room. She sets up the stand. She tunes the strings. The pitch is perfect. She begins to play. It is Bach. The notes are clean. There is no hesitation. There is no anticipation. She is not playing ahead of the beat anymore. She is playing on the beat.

  I stand in the kitchen. I listen. The music is flawless. It is cold.

  I walk to the window. I look out at the street. The streetlights are on. The town is quiet. The clock in the square is ticking. I can hear it from here, faintly, a rhythmic thud against the silence.

  I think about the switch. I think about the tissue in the tank. I think about the silicon waiting in the rack. I think about the fact that I am standing in the kitchen while my wife plays the violin in the other room, and I do not know which one of her is listening to the music.

  I do not go into the living room. I stay in the kitchen. I wash the dishes. The water is hot. I dry the plates. I put them away.

  When she finishes playing, she comes to the kitchen. She puts her hands on my shoulders. She turns me around.

  "Come to bed," she says.

  "Okay," I say.

  We go to bed. We lie down. She turns off the light. I lie in the dark. I listen to her breathe. The rhythm is steady. In, out. In, out.

  I close my eyes. I think about the clock. I think about the town waking up tomorrow. They will look at the square. They will set their watches. They will go to work. They will trust the time.

  I wake up before the alarm. The room is gray. She is still sleeping. Her breathing is slow. I get out of bed. I put on my clothes. I go downstairs. I make coffee. I drink it standing at the counter.

  I look at the clock above the stove. It is five-thirty.

  I leave the house. I drive to the square. The sun is just coming up. The streets are empty. I park the car. I walk to the tower. I unlock the door. I climb the stairs.

  The mechanism is large. It fills the room. The gears are brass and steel. The pendulum swings. Tick. Tock. Tick. Tock.

  I stand beside it. I listen. It is running fast. I know this. I have known for a week. It gains two seconds every hour. I have not corrected it.

  I have the tools in my pocket. I could stop the pendulum. I could adjust the weight. I could bring it back to standard time.

  I look at the gears. I look at the escapement. I think about the lag. I think about the quarter of a second. I think about the zero lag.

  If I slow the clock, the town will be late. The buses will be late. The school bells will ring late. People will miss their connections. They will be confused.

  If I leave it, the town will run fast. They will gain time. They will arrive early. They will wait.

  I think about her. I think about the body at home. I think about the brain in Houston. I think about the switch.

  I take the tool from my pocket. It is a small wrench. I fit it onto the adjustment nut. I turn it.

  I do not correct the time. I adjust the clock to match the lag. I slow it down. I set it back by a quarter of a second.

  It is a small amount. No one will notice. The second hand will tick slightly slower. The minute hand will lag. The hour hand will drift.

  But it will be consistent. It will be our time.

  I put the wrench back in my pocket. I stand there. I listen to the new rhythm. It is slower. It is heavy. It sounds like waiting.

  I climb down the tower. I walk to the car. I drive home.

  She is in the kitchen. She is making breakfast. The lag is back. I hear the pan sizzle before I see her turn the stove knob.

  "Morning," she says.

  "Morning," I say.

  I wait for the echo. I wait for the gap. It is there. One hundred and twenty milliseconds.

  I sit at the table. I watch her. She pours the coffee. She sets the cup in front of me. The steam rises.

  "Did you go to the tower?" she asks.

  "Yes," I say.

  "Is it running true?"

  "No," I say.

  She stops. She looks at me. The lag stretches. She waits for the rest of the sentence.

  "I changed it," I say.

  She picks up her own cup. She drinks. She sets it down.

  "Why?" she asks.

  "To match us," I say.

  She looks at the clock on the wall. It is electric. It runs on the grid. It is standard time.

  "That's not possible," she says.

  "It is now," I say.

  She looks at me. Her eyes are tired. There is a shadow under them. She looks like herself. She looks like the woman in the tank. She looks like the body in the kitchen.

  "Will they notice?" she asks.

  "Eventually," I say.

  "And then?"

  "And then they'll adjust," I say.

  She nods. She picks up her fork. She eats. The lag is there. The delay is there. The distance is there.

  I drink my coffee. It is hot. It tastes like iron.

  Outside, the town begins to wake up. The buses start their engines. The school bells prepare to ring. The people look at their watches. They look at the clock in the square.

  They will be a quarter of a second slow. They will live in the gap. They will live in the time it takes to say hello.

  I finish my coffee. I stand up. I take my coat from the hook. I put it on.

  "I'm leaving," I say.

  "Okay," she says.

  I wait for the click. I wait for the delay. It comes.

  I open the door. I step outside. The air is cool. The sun is up. The clock in the square strikes the hour. It is late.

  I walk to the car. I get in. I start the engine. I drive to work.

  The town is running on my time. She is running on hers. We are synchronized.

  I park the car. I walk into the building. I sit at my desk. I look at the clock on the wall. It is standard time. It is fast.

  I take out my watch. It is slow.

  I set the watch on the desk. I look at it. I look at the clock.

  They do not match.

  I pick up the phone. I dial the facility. I let it ring. No one answers.

  I hang up. I look at the watch. The second hand moves. It ticks. It waits. It ticks.

  I go to work. I file the reports. I answer the emails. I check the weather. The sky is clear. The relays are open.

  At five-thirty, I leave. I drive home. I arrive at five-fifty. I wait in the car. I watch the clock on the dashboard.

  At six-oh-one, I get out. I walk to the door. I put the key in the lock. I turn it.

  I wait. I listen.

  The click comes.

  I open the door. I step inside.

  She is in the hallway. She is taking off her coat. She hangs it on the hook.

  "Hello," she says.

  "Hello," I say.

  I do not measure the time. I do not count the milliseconds. I walk to her. I take her hand. It is warm.

  "Dinner?" I ask.

  "Yes," she says.

  We walk to the kitchen. We cook. We eat. We talk. The lag is there. It is part of the conversation. It is part of the meal.

  After dinner, she plays the violin. I wash the dishes. I listen to the music. It is Bach. It is slow. It is perfect.

  I dry my hands. I walk to the living room. I stand in the doorway. I watch her. She is playing. Her eyes are closed. She is feeling the music.

  I do not speak. I do not move. I stand there. I listen.

  The song ends. She lowers the bow. She opens her eyes. She looks at me.

  "Was it okay?" she asks.

  "Yes," I say.

  She smiles. She puts the violin in the case. She closes the latches. She stands up.

  "Bed?" she asks.

  "Bed," I say.

  We go upstairs. We turn off the light. We lie down. I reach for her hand. She takes it.

  "Goodnight," she says.

  "Goodnight," I say.

  I close my eyes. I listen to the house. It is quiet. The clock on the wall is ticking. It is standard time. It is fast.

  The clock in the square is slow.

  I lie in the dark. I hold her hand. I feel the pulse. It is steady. It is here.

  I fall asleep. I dream of the tower. I dream of the gears. I dream of the switch.

  In the morning, I will climb the tower. I will check the time. I will not change it.

  The town will be late. We will be on time.

  I sleep.
