answer: |-
  Your suspicion that the précis conflates transient dynamics with steady-state conditions is well founded, and your intuition regarding the interest rate claim is correct. The lecturer's summary is a coherent narrative, but it smooths over the very distinctions that make Hume's economic thought sophisticated. It reads like a textbook summary written for undergraduates, which inevitably sacrifices the nuance an engineer would recognise as the difference between a boundary condition and a system parameter.

  Here is the audit, claim by claim, addressing your three specific questions.

  ### 1. The Claim on Interest and the Dutch
  **The Précis:** "Since the Dutch enjoyed both an abundance of money and a very low rate of interest, plenty of money plainly cheapens its hire..."
  **Verdict:** This is a direct contradiction of Hume's argument.

  The lecturer has inverted Hume's logic. In the essay *Of Interest*, Hume explicitly sets out to refute the notion that the rate of interest is determined by the quantity of money (specie). He treats the low interest rates in the Netherlands not as evidence that money cheapens its hire, but as evidence that *capital* cheapens its hire.

  Hume's reasoning is causal and sequential. He argues that a low rate of interest is the barometer of a flourishing state, but it is a effect, not a cause, of the money supply.
  1.  **Industry and Frugality:** A nation becomes industrious and frugal.
  2.  **Accumulation of Capital:** This industry generates a surplus of commodities and stock (real capital), not just coin.
  3.  **Competition among Lenders:** This large stock of capital seeks employment. The lenders compete to lend it, driving down the rate of interest.
  4.  **Money Follows:** The money supply may increase as a result of this prosperity, but it is not the *cause* of the low interest.

  Hume uses the discovery of the Americas as a counter-example: Europe was flooded with gold and silver in the sixteenth century, yet interest rates did not fall immediately; they remained high until industry and commerce had time to absorb the metal and convert it into capital.

  **Engineering Analogy:** The lecturer treats interest as hydraulic pressure determined by the volume of fluid in the pipe (money supply). Hume treats interest as pressure determined by the volume of fluid in the reservoir relative to the outflow capacity (capital supply relative to investment opportunity). The Dutch had a massive reservoir of capital; the gold was merely the gauge. The lecturer has confused the gauge for the fluid.

  ### 2. The Claim on Neutrality and Public Treasure
  **The Précis:** "Money... is no part of a nation's wealth... were the coin... doubled in a night... price of everything would simply double... [therefore] paper credit is a fraud... metallic stock enlarged and held as public treasure."
  **Verdict:** This collapses the transient response into the steady state, and likely misrepresents the policy conclusion.

  Your suspicion here is precise. Hume distinguishes sharply between the *ultimate* effect of a change in money supply and the *intermediate* effect.
  *   **Steady State:** If you double the money overnight, prices double. Money is neutral. In this long-run equilibrium, money is indeed just "oil," not a "wheel."
  *   **Transient State:** Hume argues that money never actually enters an economy "in a night." It enters gradually. During the interval between the arrival of new money and the adjustment of prices, there is a stimulus to industry. Prices rise gradually, but profits rise first. This "friction" or lag is where the benefit lies.

  **The Contradiction in the Précis:**
  If money were truly neutral in all timeframes (as the "doubled in a night" example implies), there would be no benefit to holding a larger metallic stock. It would just mean higher prices. However, Hume argues that a growing money supply *during the transition* encourages industry.

  Regarding the "public treasure": Hume was indeed skeptical of paper credit, but not for the reason the lecturer implies. He feared that excessive paper credit would drive out specie (Gresham's Law) and leave the nation vulnerable in a crisis (war) when foreign powers would not accept paper. However, Hume generally argued *against* the state actively hoarding treasure or trying to manipulate the balance of trade to accumulate it. He believed the market would naturally find the correct level of specie required for circulation. The précis makes him sound like a mercantilist hoarder, whereas he was a critic of mercantilism who accepted the *necessity* of specie for international settlement, not as a store of value for the state.

  **Uncertainty Flag:** I am reasonably certain Hume warned against the *total* displacement of specie by paper, but the phrasing "urged that... metallic stock [be] held as public treasure" sounds like a specific policy prescription that may be the lecturer's simplification of Hume's warning against banking instability. Hume preferred a metallic standard but was wary of the state interfering with the natural distribution of that metal.

  ### 3. The Claim on Falsification and Equilibrium
  **The Précis:** "The mechanism has since been falsified only in the detail — under a managed gold standard the flows were sterilised and the discount rate performed the work Hume assigned to prices."
  **Verdict:** "Falsified" is the wrong term; "Managed" or "Intervened" is accurate. The equilibrium condition is also slightly misstated.

  **The Mechanism:**
  Hume's Price-Specie-Flow mechanism is automatic *only* under specific boundary conditions: a pure metallic standard with no central authority interfering with the money supply.
  1.  Country A exports more than it imports.
  2.  Gold flows into Country A.
  3.  Money supply in A rises; prices in A rise (Quantity Theory).
  4.  Goods in A become expensive; goods in B become cheap.
  5.  Exports fall; Imports rise.
  6.  Gold flows out.

  **The "Falsification":**
  When the lecturer says sterilisation "falsified" this, he means that central banks broke the link between step 2 and step 3. They absorbed the incoming gold and issued domestic debt instead of letting the money supply expand and prices rise.
  *   **Engineering Analogy:** This is not falsifying the law of gravity; it is installing a pump to counteract it. If you measure the water level in a tank with an active pump, you cannot say the theory of hydrostatics is falsified because the water level doesn't match the inflow. You have simply changed the system from open-loop to closed-loop control. Hume's mechanism describes the open-loop response. The lecturer's claim is that the closed-loop system rendered the open-loop dynamics irrelevant in practice, which is fair, but calling it "falsification" suggests Hume's logic was wrong, rather than his boundary conditions being altered.

  **The Equilibrium Condition:**
  The précis says money stands "in proportion to the industry of each nation, as water finds its level."
  *   **"Water finds its level":** This implies equality.
  *   **"Proportion to industry":** This implies a ratio.
  Hume's actual steady state is the latter. Money does not distribute equally per capita across nations; it distributes according to the volume of trade and production ("art and industry"). A large, industrious nation should hold more money than a small, agrarian one. The metaphor of water finding a level is poetically useful for the *tendency* toward equilibrium, but physically misleading if it suggests equalisation rather than proportionalisation.

  **Automatic vs. Conditional:**
  You asked if the mechanism is meant to be automatic. Hume presents it as a natural tendency, akin to gravity. However, he acknowledges it is conditional on political non-interference. He explicitly notes that governments often try to block this flow (via tariffs or hoarding), which distorts the mechanism but does not invalidate the underlying pressure. The mechanism is robust, but not invulnerable to policy friction.

  ### Summary Audit

  1.  **Interest Rates:** The lecturer is incorrect. Hume argues interest rates are determined by real capital accumulation, not the quantity of money. The Dutch example supports Hume's view on capital, not the lecturer's view on money supply.
  2.  **Neutrality:** Your engineering intuition is correct. The précis ignores the "transient" phase where money is non-neutral and stimulates industry. This omission makes Hume's skepticism of paper credit seem inconsistent (why hoard metal if it's just oil?), whereas in Hume's full model, the metal supports the transition dynamics and provides stability during shocks (war).
  3.  **Falsification:** The mechanism was not falsified; the boundary conditions were changed by central banking. The equilibrium is proportional to industry, not a flat "level."

  **Overall Assessment:** The précis is a competent summary of the *conclusions* of classical economics as they were later formalised, but it attributes a rigidity to Hume that he did not possess. It treats his dynamic system as a static one. For an engineer, the précis describes the steady-state solution but deletes the differential equations that describe how the system gets there. Hume is interesting precisely because he understood that the path *to* equilibrium matters as much as the equilibrium itself. The lecturer has smoothed that out.
