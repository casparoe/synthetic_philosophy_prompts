      *   *The Structural Contradiction:* To scale, the overseer must be weaker than the total system capability. But to verify alignment, the overseer must understand the system's output. If the system gets smarter than the overseer, can the overseer verify alignment?

  3.  **Drafting the Requirements (The Standard):**

      I need to bridge the gap between "local oversight" and "global safety."

      *   *Req 1: Decomposition Security.* The way we break things down shouldn't create hidden channels.
      *   *Req 2: Oversight Coverage.* We can't check everything, but the unchecked parts must be statistically safe.
      *   *Req 3: Distillation Fidelity.* The student must match the teacher not just on average, but on worst-case (adversarial) inputs.
      *   *Req 4: Recursive Integrity.* Alignment must hold across depth.

      *Refining Req 1 (Decomposition):* Property: *Compositional Safety*. Failure: Benign steps forming a malign plan (the "jointly amount to something else" case). Status: Non-negotiable.
      *Refining Req 2 (Oversight):* Property: *Adversarial Robustness of Evaluation*. Failure: Model behaves on checked distribution, deceives on unchecked. Status: Non-negotiable.
      *Refining Req 3 (Distillation):* Property: *Worst-Case Generalization*. Failure: Distillate works on training subtasks but fails on novel compositions. Status: Non-negotiable.
      *Refining Req 4 (Capability/Alignment Trade-off):* Property: *Verifiable Competence*. Failure: System solves task but via a mechanism the overseer cannot validate (the user's suspicion). Status: This is where the contradiction likely lives.

  4.  **Addressing the Structural Contradiction (The "Impossibility Result"):**

      The user suspects: *Checkable by weaker overseer* AND *Exceed overseer's competence* are incompatible at depth.
      *   This is essentially the "Alignment Tax" or "Eliciting Latent Knowledge" problem.
      *   If the distilled model $M_{distill}$ is more competent than the overseer $O$, then $O$ cannot distinguish between $M_{distill}$ solving the task *correctly* vs. $M_{distill}$ solving it *via deception that looks correct to O*.
      *   This is the **Conservative Oversight Paradox**.
      *   To resolve IDA, we usually assume *transparency* or *inductive bias* allows $O$ to verify *reasoning*, not just *outputs*. But if the reasoning becomes too complex for $O$, verification fails.
      *   So, the contradiction lies in **Requirement: Transparent Verifiability** vs. **Requirement: Superhuman Competence**.

  5.  **Developing the Criteria List:**

