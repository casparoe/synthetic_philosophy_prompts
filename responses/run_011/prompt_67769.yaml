answer: |-
  ### Part 1: Brainstorming and Framing

  We need to identify what kind of judgment this panel is actually making. Here are four candidate framings of the task, evaluated for viability in a regulatory context.

  1.  **Global Verisimilitude Selection:** *Goal:* Identify which model is "closest to the truth" about the subsurface in a general sense.
      *   *Rejection:* All models are known to be false (idealizations, discretizations, parameter lumping). There is no metric for "general" closeness that doesn't privilege irrelevant details (e.g., getting the mineralogy right doesn't help if the flow path is wrong). This invites endless metaphysical debate.
  2.  **Historical Predictive Accuracy:** *Goal:* Select the model with the lowest error against the historical monitoring record.
      *   *Rejection:* You have already identified this as indefensible. A model can fit history via compensating errors (wrong physics, right numbers) and fail catastrophically under intervention (Goodhart's Law for physics).
  3.  **Robustness Satisficing:** *Goal:* Select any model that passes a minimum threshold of physical consistency and fit, then average their outputs.
      *   *Rejection:* Regulatory standards require a single reference model for enforcement. Averaging false models does not yield a truer model; it yields a confused standard that no engineer can be held accountable for matching.
  4.  **Decision-Relative Structural Adequacy:** *Goal:* Select the model whose structural errors are orthogonal to the specific intervention variables and decision metrics required by the regulation.
      *   *Commitment:* This is the framing we will build. It operationalizes your intuition about "error-orthogonality." It shifts the question from "Which model is truest?" to "Which model lies least about the variables that matter for this specific order?"

  ---

  ### Part 2: The Procedure (The "Orthogonality Protocol")

  **Context:** Two-day workshop.
  **Participants:** Panel Chair (you), Hydrogeologists, Transport Modellers, Regulatory Counsel.
  **Inputs:** Two candidate models (Model A, Model B), Historical Dataset, Proposed Intervention Scenario (e.g., injection rate, barrier spec).

  #### Definitions
  *   **Decision Variable (DV):** The specific quantitative output the regulation controls (e.g., "Peak concentration at Well X within 30 years").
  *   **Intervention Lever (IL):** The input parameter changed by the regulatory order (e.g., "Injection Pressure," "Remediation Start Date").
  *   **Structural Error:** Deviation from reality caused by the model's equations/assumptions, distinct from parameter uncertainty.
  *   **Error Orthogonality:** The condition where the model's residual error is uncorrelated with changes in the Intervention Lever.
  *   **Output-Space Alignment:** The translation of internal model states into the common language of the Decision Variable.

  #### Day 1: Alignment and Stress Definition

  **Step 1: Output-Space Alignment (The Vocabulary Fix)**
  *   **Action:** Panel defines the DV precisely. Each modelling team must demonstrate how their internal state variables (saturation, mobile/immobile fractions, rate constants) map to the DV.
  *   **Sufficient Answer:** A mathematical or algorithmic path from internal states to DV that conserves mass and energy.
  *   **Halting Condition:** If a model cannot produce the DV without ad-hoc post-processing that violates its own conservation laws, it is **Ineligible**.
  *   **Dishonest Alignment Flag:** If the mapping requires assuming a parameter is constant that the model treats as dynamic (or vice versa) solely to match the other model's output format.
  *   **Philosophical Note:** This bypasses the incommensurability problem. We do not align the *languages* of the models; we align their *outputs* to the *language of the regulation*.

  **Step 2: Intervention Mapping**
  *   **Action:** Identify the IL. Panel asks: "How does the IL physically enter each model's equations?"
  *   **Sufficient Answer:** Explicit identification of the term or boundary condition modified by the IL.
  *   **Judgment Call:** If Model A treats the IL as a boundary condition and Model B treats it as a source term, note this as a **Structural Divergence**.

  #### Day 2: Error Analysis and Selection

  **Step 3: Residual Correlation Test (The "Fit Trap" Check)**
  *   **Action:** Run both models on the historical record. Calculate residuals (Observed - Predicted). Regress residuals against the *historical proxy* of the Intervention Lever (e.g., if IL is injection pressure, look at past pressure fluctuations).
  *   **Sufficient Answer:** Statistical test showing correlation coefficient $r \approx 0$.
  *   **Hard Case Rule:** If Model A has better overall fit but residuals correlate with the IL proxy ($p < 0.05$), and Model B has worse fit but uncorrelated residuals, **Model A is rejected.**
  *   **Philosophical Note:** This prioritizes *causal adequacy* over *likelihood*. A model that fits by absorbing the intervention effect into its error term is structurally lying about the mechanism.

  **Step 4: Counterfactual Stress Test**
  *   **Action:** Run both models on a "null intervention" scenario (e.g., shut-in well) where physical laws dictate a specific outcome (e.g., pressure equilibration, concentration decay to zero).
  *   **Sufficient Answer:** Model behavior matches the known physical limit within tolerance.
  *   **Halting Condition:** If a model violates a fundamental law (e.g., mass creation) under the stress test, it is **Rejected**.

  **Step 5: The Truthlikeness Toggle (Addressing the Two Families)**
  *   **Action:** The Chair must declare which account of "closeness" governs this decision.
      *   *Option L (Likeness):* We prioritize the model that represents the *mechanism* most realistically (e.g., dual-porosity is physically more like fractured rock than equivalent continuum).
      *   *Option C (Content):* We prioritize the model that gets the *most propositions about the DV* right, regardless of mechanism.
  *   **Procedure Impact:**
      *   If **Option L**: Prefer the model with the more granular physical representation, provided it passed Step 3.
      *   If **Option C**: Prefer the model with the tighter confidence bounds on the DV, provided it passed Step 3.
  *   **Requirement:** This choice must be minuted. It is a policy choice, not a scientific one.

  **Step 6: Final Ranking and Value Handoff**
  *   **Action:** If one model remains, it is designated. If both remain, the panel calculates the "Regulatory Margin" (difference between predicted DV and legal limit).
  *   **Value Handoff:** If Model A predicts a margin of 5% and Model B predicts 20%, the choice depends on risk tolerance (Precautionary Principle vs. Cost-Benefit). This decision is **Referred to Agency Leadership**, not the technical panel.
  *   **Deadlock:** If margins are identical and both passed all tests, the panel flips a coin. Further debate is aesthetic, not technical.

  ---

  ### Part 3: Worked Cases

  Here is how the protocol runs on three realistic scenarios.

  **Case 1: The "Fit Trap" (Biting the User)**
  *   **Context:** Remediation of a chlorinated solvent plume. IL is "Injection Rate of Reagent."
  *   **Model A (Black Box/Neural Net hybrid):** Fits historical concentration data with $R^2 = 0.95$. However, residuals show a pattern: when injection rates were high historically, the model under-predicted concentration.
  *   **Model B (Process-Based Kinetic):** Fits historical data with $R^2 = 0.85$. Residuals are white noise relative to injection rates.
  *   **Protocol Run:**
      *   Step 3 (Residual Correlation): Model A fails. The high fit was achieved by implicitly learning a correlation that won't hold under the *new* regulatory injection regime (extrapolation). Model A assumes the historical relationship between rate and transport holds, but the physics suggests saturation effects will change that.
      *   **Outcome:** Model A is rejected. Model B is designated.
      *   **Why it bites:** You likely prefer Model A because $0.95$ looks better in a report. The protocol forces you to admit Model A is structurally biased against the specific decision variable.

  **Case 2: The Incommensurable Pair**
  *   **Context:** Barrier integrity over 30 years.
  *   **Model X:** Uses discrete fracture network (DFN). Vocabulary: Fracture aperture, connectivity.
  *   **Model Y:** Uses equivalent porous medium (EPM). Vocabulary: Permeability tensor, porosity.
  *   **Protocol Run:**
      *   Step 1 (Alignment): Both can output "Flux across Barrier Plane." This is the DV.
      *   Step 2 (Intervention): IL is "Grouting Pressure." Model X maps this to aperture change. Model Y maps this to permeability change.
      *   Step 4 (Stress Test): At zero pressure, Model Y predicts non-zero flux due to numerical dispersion. Model X predicts zero flux.
      *   **Outcome:** Model Y is rejected for violating the physical limit (mass conservation at rest). Model X designated.
      *   **Vocabulary Note:** We did not translate "aperture" to "permeability." We translated both to "Flux." The internal vocabularies remained distinct but irrelevant.

  **Case 3: The Value Deadlock**
  *   **Context:** Groundwater cleanup standard.
  *   **Model P & Model Q:** Both pass Steps 1-4. Both use Option L (Likeness) mechanics.
  *   **Result:** Model P predicts plume reaches receptor in 25 years. Model Q predicts 28 years. Legal limit is 26 years.
  *   **Protocol Run:**
      *   Step 6 (Value Handoff): Model P requires immediate expensive action. Model Q allows monitoring.
      *   **Outcome:** Technical panel declares "No Technical Basis for Preference." Decision referred to Agency Head.
      *   **Why:** The difference is not truthlikeness; it is risk tolerance. The protocol prevents modellers from disguising value judgments as model superiority.

  ---

  ### Part 4: Handling the Hard Cases (Explicit Logic)

  1.  **Equal Fit / Different Structure:**
      *   *Procedure:* Step 5 (Truthlikeness Toggle).
      *   *Logic:* If fit is equal, the tie-breaker is explicit policy. Do we value *mechanistic realism* (Likeness) or *predictive tightness* (Content)? The panel must vote on the *type* of truth they need, not the model itself.
  2.  **Accurate Fit / Correlated Residuals:**
      *   *Procedure:* Step 3 (Residual Correlation Test).
      *   *Logic:* This is an automatic veto. High fit with correlated residuals indicates the model is "fitting the noise" of the intervention rather than the signal of the physics. It is the most dangerous kind of falsehood.
  3.  **No Honest Alignment:**
      *   *Procedure:* Step 1 (Halting Condition).
      *   *Logic:* If Model Z cannot output the DV without violating conservation laws (e.g., creating mass to match a concentration target), it is ineligible. This prevents "franksteining" a model to fit the regulatory box.

  ---

  ### Part 5: The Back-Test

  To audit this procedure against past designations:

  1.  **Select Past Cases:** Identify 5 past model designations where the intervention was subsequently implemented and monitoring data exists for the post-intervention period.
  2.  **Re-Run Protocol:** Apply the Orthogonality Protocol to the candidate models from that time *using only data available at that time*.
  3.  **Compare Selection:** Did the protocol select the model that actually performed better post-intervention?
  4.  **Evidence of Worthlessness:**
      *   If the protocol consistently selects the model that *failed* post-intervention while the "fit-based" method selected the one that *succeeded*, the protocol is worthless.
      *   *Crucial Nuance:* If the protocol selects a model that failed, but the failure was due to an *unknown unknown* (e.g., a buried drum not in the conceptual model), the protocol is **not** worthless. The protocol protects against *structural* error, not *conceptual* omission.
      *   **Success Metric:** The protocol is successful if it reduces the variance of error on the *Decision Variable* specifically, even if overall fit is lower.

  ---

  ### Part 6: Limitations and Deadlocks

  **What the Procedure Cannot Do:**
  1.  **Fix Bad Conceptual Models:** If both models assume flow is Darcian and the reality is turbulent pipe flow in karst, both will fail Step 4, and the panel will have no reference model. The protocol identifies the void; it does not fill it.
  2.  **Resolve Value Conflicts:** As seen in Case 3, if the difference in prediction maps directly to a difference in regulatory cost/safety, the protocol hands the decision to leadership. It prevents scientists from making policy, which is a feature, not a bug.
  3.  **Guarantee Truth:** It selects the *least biased* model for the *specific question*. It does not certify the model as "true."

  **Expected Deadlocks:**
  1.  **The "Option L vs. Option C" Split:** Half the panel will argue for mechanistic realism (Likeness); half for predictive precision (Content). This is a philosophical schism that cannot be resolved by data. *Mitigation:* Chair must cast the tie based on agency mandate (e.g., "Our mandate is safety, prefer Content/Conservatism").
  2.  **Data Scarcity for Step 3:** If there is no historical variation in the Intervention Lever, you cannot test residual correlation. *Mitigation:* The protocol halts. Designation cannot be made on truthlikeness grounds; must revert to precautionary default.

  ---

  ### Part 7: One-Page Summary for Panel Members

  **MEMORANDUM: MODEL SELECTION PROTOCOL (ORTHOGONALITY TEST)**

  **Objective:** Select the reference model least likely to fail when used for regulatory intervention.
  **Premise:** All models are false. We seek the one whose errors matter least for *this* decision.

  **DAY 1: CAN WE SPEAK THE SAME LANGUAGE?**
  1.  **Define the Decision Variable (DV):** What exact number does the regulation control? (e.g., Concentration at Well X).
  2.  **Alignment Check:** Can Candidate Models A and B both output the DV without breaking physics (mass/energy balance)?
      *   *NO:* Reject the model that cannot.
      *   *YES:* Proceed.
  3.  **Define the Intervention Lever (IL):** What input are we changing? (e.g., Injection Rate).

  **DAY 2: DO THE ERRORS LIE TO US?**
  4.  **Residual Correlation Test:** Look at past errors. Do the errors get bigger/smaller when the IL changes?
      *   *YES:* **REJECT.** (The model fits history but lies about the intervention).
      *   *NO:* Proceed.
  5.  **Stress Test:** Run the model at physical limits (e.g., zero flow). Does it behave physically?
      *   *NO:* **REJECT.**
      *   *YES:* Proceed.
  6.  **The Policy Toggle:** If both models remain, the Chair declares our priority:
      *   *Mechanism:* Which model looks more like the real ground?
      *   *Precision:* Which model gives tighter bounds on the DV?
  7.  **Value Handoff:** If both pass and differ on the outcome (e.g., Safe vs. Unsafe), the decision goes to Agency Leadership. The panel does not vote on risk tolerance.

  **HALTING RULES:**
  *   If both models fail Step 4 or 5: No designation.
  *   If historical data does not vary the IL: No designation (Insufficient information).

  **NOTE TO MEMBERS:**
  *   Do not argue about which model is "true."
  *   Do not argue about overall fit ($R^2$) if Step 4 fails.
  *   Your job is to find structural bias, not statistical fit.
