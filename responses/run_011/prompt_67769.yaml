prompt: |-
  You are a philosopher of science with a working command of the truthlikeness literature and, separately, real experience sitting in on model-evaluation meetings inside engineering and environmental agencies. Treat what follows as a design problem rather than an expository one, and think carefully before answering: the difficulty here is not knowing the literature but making it survive contact with a committee that has deadlines.

  I chair the modeling panel at a national environmental regulator. Several times a year we must designate one process-based model of subsurface contaminant transport as the reference model behind an exposure standard. We never choose between candidates one of which is true; all of them are known to be false, and everyone in the room knows it. What the panel currently does is indefensible: we rank by out-of-sample fit against the historical monitoring record, then settle disputes with a show of hands on "physical plausibility." The problem is that the designated model is then used for questions no data can settle — plume behaviour under an injection regime nobody has run, barrier integrity thirty years out, what a remediation order must achieve — and fit to the historical record is close to irrelevant to those questions. A model can win the fit contest and be the worse guide exactly where the decision lives.

  I want a written procedure the panel can run on a pair of candidate models in a single two-day workshop, staffed by hydrogeologists and transport modellers who have never read a page of philosophy. Two things I need you to engage with rather than wave away:

  First, my own half-formed idea, which I want pressure-tested and then either built on or dismantled: I suspect the defensible question is not which model is closer to the truth outright, but which model's errors are least entangled with the specific question we need it to answer — something like decision-relative truthlikeness, or error-orthogonality to the query. If you think that is a confusion, say so and tell me what the panel should be asking instead.

  Second, an alignment problem I cannot see past. Our candidates do not share a vocabulary. One is written in terms of effective saturation and capillary-pressure curves; another partitions the domain into mobile and immobile regions; a third carries a distributed set of first-order rate constants. As I understand it, the accounts of closeness to the truth come in two families — one measuring likeness to the way things actually are, one measuring how much of a theory's content is right against how much is wrong — and both appear to be defined over statements in a fixed language, with a standing worry that the ordering shifts when the vocabulary does. If that is right, tell me plainly whether the machinery is simply inapplicable to us, or whether vocabulary alignment is a legitimate first step in a procedure, and if so what the stopping rule for that step is and how a panel member would know an alignment was dishonest.

  Structure the deliverable as follows. Begin with a short brainstorming section: at least four candidate framings of what the panel is actually trying to decide, with one line each on why you reject the ones you reject, then a commitment to the framing you will build. Then give the procedure itself — the questions asked in order; what counts as a sufficient answer to each; the points at which it halts with a finding that the candidates cannot be ranked; and the points at which the decision is handed to a person because what remains is a matter of regulatory values rather than of truth. Define every term as you introduce it, and flag explicitly which steps are judgment calls wearing a procedural costume.

  Four further requirements:

  1. Do not let the procedure quietly assume a contested account of closeness to the truth. Wherever a step depends on choosing between the two families above, or on the difference between how close a model is to the truth and how close we can estimate it to be, say so, and say what the panel would do differently under the other choice.
  2. Handle these hard cases: two models that fit every available dataset equally well and differ only in structure; a model that is measurably more accurate on the record but whose residuals are correlated with the intervention variable we must predict; and a pair for which no honest alignment between vocabularies exists.
  3. Run the procedure on two or three worked cases of your own construction, specific and realistic, and include at least one in which it rejects the model I would personally have favoured. I need to see that it can bite me.
  4. Add a back-test: how the panel would audit the procedure against past designations whose consequences we now know, and what result would count as evidence that the procedure is worthless.

  Close with what the procedure cannot do, and the two or three questions on which I should expect the panel to deadlock however carefully it runs. Then give a one-page version suitable for handing to a member who has read none of the above.

  I will supply the references myself, so produce no bibliography and invent no citations; naming positions, arguments, and known negative results is welcome and expected.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Role:** Philosopher of science with expertise in truthlikeness (verisimilitude) literature *and* practical experience in engineering/environmental agency model-evaluation meetings.
      *   **Task:** Design a written procedure for a regulatory panel to select a reference process-based model for subsurface contaminant transport.
      *   **Context:** All models are known to be false. Current method (fit + show of hands) is indefensible for extrapolation (future scenarios, interventions).
      *   **Constraints:**
          *   Two-day workshop format.
          *   Staff: Hydrogeologists/modellers (no philosophy background).
          *   Must engage with the user's "decision-relative truthlikeness" idea.
          *   Must engage with the "vocabulary alignment" problem (incommensurability).
          *   Structure: Brainstorming -> Procedure -> Worked Cases -> Back-test -> Limitations/Deadlocks -> One-page summary.
          *   No bibliography/citations (name positions/arguments instead).
          *   Tone: Pragmatic, rigorous, aware of the "contact with a committee" difficulty.
      *   **Specific Requirements:**
          1.  Don't assume a contested account of closeness to truth; flag dependencies.
          2.  Handle hard cases (equal fit/diff structure; accurate fit/correlated residuals; no vocabulary alignment).
          3.  Worked cases (must include one that bites the user).
          4.  Back-test method.
          5.  Limitations/Deadlocks.
          6.  One-page summary.

  2.  **Deconstruct the Core Philosophical Problems:**

      *   **Problem 1: Truthlikeness vs. Predictive Accuracy.** The user suspects "decision-relative truthlikeness." In the literature, this aligns with *instrumentalism* vs. *realism*, or more specifically, *Niiniluoto's min-sum measure* vs. *Tichý's content measures*, but practically it's about *structural adequacy* for a specific *counterfactual*. If the goal is policy under intervention, we need *causal adequacy*, not just curve fitting. The user's intuition is correct: we need *error orthogonality* relative to the intervention manifold.
      *   **Problem 2: Incommensurability/Vocabulary.** Models use different state variables (saturation vs. mobile/immobile). Truthlikeness is usually defined over sentences in a language. If languages differ, comparison is hard. *Solution:* Map to a common *observational* or *decision-relevant* output space, not necessarily the internal state space. This is the "stopping rule" for alignment.
      *   **Problem 3: False Models.** Since all are false, we are looking for the *least false* regarding the *specific question*. This is *contextual verisimilitude*.

  3.  **Drafting - Section by Section:**

      *   **Brainstorming:** Need 4 framings.
          1.  *Global Truthlikeness:* Which model is "most true" overall? (Reject: Impossible, all false, irrelevant details matter).
          2.  *Predictive Fit:* Which fits history best? (Reject: User already identified this failure mode regarding extrapolation).
          3.  *Decision-Relative Adequacy:* Which model's errors matter least for *this* decision? (Accept/Refine: This is the user's intuition, needs operationalizing).
          4.  *Robustness:* Which model survives perturbation of assumptions? (Reject: Good, but doesn't solve the vocabulary/selection problem alone).
          *   *Commitment:* Decision-Relative Structural Adequacy.

      *   **The Procedure:** Needs to fit 2 days.
          *   *Day 1: Alignment & Stress Testing.* Define the "Decision Variable" (DV). Map models to DV. Identify "Intervention Levers."
          *   *Day 2: Error Analysis & Selection.* Run "Counterfactual Stress Tests." Check residual correlation.
          *   *Halting Conditions:* If vocabularies can't map to DV, stop. If errors are entangled with levers, reject.
          *   *Value Judgments:* Risk tolerance (Type I vs Type II errors in regulation).

      *   **Engaging the User's Ideas:**
          *   *Decision-Relative Truthlikeness:* Validate this. It's essentially *Niiniluoto's* idea of truthlikeness relative to a question, or *Kuipers'* instrumentalist methodology. It's not confusion; it's the only viable path.
          *   *Vocabulary:* Acknowledge the *incommensurability* worry (Kuhn/Feyerabend style, but technical). The fix is *output-space alignment*, not internal state alignment. Stopping rule: Can both produce the regulatory metric? If not, one is ineligible. Dishonest alignment: Forcing a mapping that ignores physical conservation laws.

      *   **Hard Cases:**
          *   *Equal Fit/Diff Structure:* Use mechanistic plausibility checks (mass balance, thermodynamic consistency).
          *   *Correlated Residuals:* This is the killer. If residuals correlate with the intervention, the model is structurally biased for the decision. Reject it regardless of fit.
          *   *No Alignment:* If one model can't output the regulatory metric without ad-hoc post-processing that violates its own logic, it's out.

      *   **Worked Cases:**
          *   *Case A (The Trap):* High fit, correlated residuals. (Bites the user if they prefer fit).
          *   *Case B (The Incommensurable):* Dual-permeability vs. Equivalent Continuum.
          *   *Case C (The Tie):* Both pass, requires value judgment on conservatism.

      *   **Back-test:** Look at past designations. Did the "winner" fail when the intervention happened? If the procedure would have picked the loser, the procedure is better. If the procedure picks the winner but the outcome was bad due to external factors, procedure is okay. Evidence of worthlessness: Procedure consistently picks models that fail *specifically* on the intervention variable.

      *   **Limitations/Deadlocks:**
          *   Deep uncertainty (unknown unknowns).
          *   Value conflicts (cost vs. safety).
          *   Computational intractability of stress tests.

      *   **One-Pager:** Distill the logic into a checklist.

  4.  **Refining the Tone:**

      *   Must sound like someone who has sat in those rooms. "Show of hands," "deadlines," "indefensible."
      *   Philosophical terms must be translated into engineering speak (e.g., "verisimilitude" -> "structural adequacy for the target question").
      *   Avoid academic hedging. Be decisive.

  5.  **Self-Correction/Review during drafting:**

      *   *Check:* Did I invent citations? *No.*
      *   *Check:* Did I address the vocabulary problem specifically? *Yes, via Output-Space Mapping.*
      *   *Check:* Did I flag where truthlikeness theories diverge? *Yes, in the procedure notes (Likeness vs. Content).*
      *   *Check:* Is the "biting" case clear? *Yes, the model with better fit but structural bias.*
      *   *Check:* Is the stopping rule for alignment clear? *Yes, conservation laws and regulatory metric definition.*

  6.  **Final Polish:** Ensure the distinction between "truthlikeness" (ontological) and "estimated truthlikeness" (epistemic) is clear where required. Ensure the "decision-relative" concept is operationalized as "Error Orthogonality to Intervention."

  *(Self-Correction on the Vocabulary Issue)*: I need to be careful not to suggest we can translate "mobile/immobile" into "saturation." We can't. We translate both into "Concentration at Compliance Point X at Time Y." That is the common language.

  *(Self-Correction on Truthlikeness Families)*: The prompt mentions "likeness to way things are" vs "content right/wrong." In the procedure, this maps to "Mechanistic Fidelity" vs "Predictive Content." I need to make sure the panel knows which they are prioritizing. For regulation, "Content regarding the Decision Variable" usually wins, but "Mechanistic Fidelity" is the proxy for extrapolation. I will frame this as a toggle in the procedure.

  7.  **Finalizing the Output Structure:** Follow the prompt's requested structure exactly.

      *   Brainstorming (4 framings).
      *   Procedure (Steps, Definitions, Halting Conditions, Value Flags).
      *   Hard Cases (integrated or separate? Prompt says "Handle these hard cases" then "Run the procedure on... worked cases". I will integrate the logic into the procedure and demonstrate in the worked cases).
      *   Worked Cases (3 cases).
      *   Back-test.
      *   Limitations/Deadlocks.
      *   One-page summary.

