  ### The Winning Principle: Protected Spheres of Human Experience

  The principle that best fits your specific constellation of verdicts is a pluralistic one: **"Market norms are permissible unless they invade a protected sphere (bodily integrity, intimate expression, or civic fairness) where commodification would displace essential non-market values."**

  This principle posits that society maintains specific "spheres" where money is a category error. Your "Fine" cases (Queue, Drug Trial, Nephew, Waste #1) fall into *Labor*, *Risk*, or *Policy* spheres. Your "Not Fine" cases fall into *Bodily Integrity* (Kidney, Punch), *Civic Fairness* (School, Bots, Waste #2), or *Intimate Expression* (Mourner).

  **Two Threatening Cases:**

  1.  **Paid Surrogacy:** A woman is paid $50,000 to carry a couple's child for nine months.
      *   *Prediction:* **Not Fine.** This threatens the principle because it blurs the line between *Labor/Risk* (Drug Trial/Queue, which you allow) and *Bodily Integrity/Kidney* (which you forbid). If the principle relies on "temporary risk" vs. "permanent loss," surrogacy is temporary but deeply intimate. To stay consistent with your Kidney verdict, you must classify reproduction as a protected sphere distinct from medical risk.
  2.  **Paying for an Apology:** You pay a colleague $500 to issue a sincere, public apology for a mistake they made.
      *   *Prediction:* **Not Fine.** This directly threatens the Mourner verdict. If paid grief is wrong because it commodifies emotion, paid remorse must also be wrong. However, if the apology resolves a conflict and restores workplace harmony (instrumental good), your Nephew/Queue intuition might demand it be Fine. Consistency with the Mourner case requires you to value the *authenticity of the emotion* over the *utility of the outcome*.

  ### On the Mourner Verdict

  You should **accept a messier principle** rather than drop the Mourner verdict. Your intuition here is not an outlier; it is the anchor for your stance on the Kidney and Punch cases. All three rely on the belief that some aspects of human existence (the body, violence, grief) possess a dignity that is degraded by price tags, regardless of consent or harm. If you drop the Mourner verdict to tidy up your theory, you undermine the logic protecting the Kidney and Punch cases. Moral consistency sometimes requires acknowledging that human value is pluralistic, not singular; admitting that "some things just shouldn't be bought" is a feature of your ethics, not a bug.
