      2.  Illegitimate Acquisition (Theft/Loot/Coercion).
      3.  Contextual Integrity (Architecture).
      4.  Legitimate Acquisition (Trade/Gift).

      *Refining the "Principle":* It's not one principle, it's a *Test of Title*. The museum only keeps what it can prove it has a right to keep. The burden of proof shifts.
      *   *Principle A: The Primacy of Origin.* (Cases 1, 2, 5).
      *   *Principle B: The Taint of Context.* (Case 3 vs 8).
      *   *Principle C: The Limit of Stewardship.* (Case 6 vs 1). Stewardship doesn't cure theft.
      *   *Principle D: The Rejection of Paternalism.* (Case 7).

  4.  **Addressing the Sacrifices:**
