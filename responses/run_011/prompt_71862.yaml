      *(Self-Correction during drafting)*: Wait, looking at Case 6 again. "Survived only because the holding museum conserved it." If I sacrifice Case 6, does that mean the object goes back even if it might be destroyed? Case 7 says "Return even if locked in palace." So yes, risk of destruction/misuse by the *holder* (war) or the *receiver* (presidential palace) doesn't stop return. So Case 6 must fall. Preservation is not a property right.
      *   *Refining Case 4:* To keep Case 4 distinct from Case 1, the principle must rely on *documented specific agency* vs *systemic coercion*. It's a narrow path, but necessary for the character's nuance.
