      *   Case 6 (Saved by Museum) conflicts with Case 1 (Stolen). If theft trumps preservation, Case 6 must go (or be modified).
      *   Case 8 (Export Art) conflicts with Case 3 (1930s Plaque). If systemic taint matters (Case 3), does it matter for Case 8? Case 8 is 18th century export. Case 3 is 1930s colonial. The distinction is *intent* and *power dynamic*. Case 8 can stay if we define "Export Art" as genuinely commodified.
