  3.  **Synthesize Principles:**
      *   The user prioritizes Case 1 (Benin) above all. This suggests a *Restorative Justice* or *Rightful Possession* framework is the core.
      *   Case 5 (Remains) is non-negotiable usually (Human Rights).
      *   Case 2 (Parthenon) is about *Contextual Integrity*.
      *   Case 3 vs. Case 6 is the biggest tension. Case 3 says "systemic taint matters." Case 6 says "preservation creates a new claim." The user says they'd rather lose 6 than 1. This implies preservation does *not* override theft.
      *   Case 4 vs. Case 1: User worries 4 is a fantasy. If 1 is the priority, 4 is vulnerable. To keep 4, we need a high bar for "voluntariness."
