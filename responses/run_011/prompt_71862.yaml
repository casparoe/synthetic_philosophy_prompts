  5.  **Addressing "Long-term Loan":**
      *   If Case 7 says "Return anyway," a loan implies the museum still owns it. That is paternalistic.
      *   However, if the risk of destruction is immediate and extreme, a loan *might* be a transitional tactic, but principled? No. Principled transfer requires title transfer.
      *   Verdict: It's a dodge, unless it's a temporary logistical step during full transfer.

  6.  **Developing the Clause System:**
      *   Let's create a "Charter of Custody."
      *   Clause 1: Human Remains (Absolute Return).
