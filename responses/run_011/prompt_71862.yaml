      *   *Case B (Private Benin Collector):* They buy in London to bring home. Won't give to state/palace. This is "Repatriation by Private Means." The museum's principle applies to *museum* holding. But the narrator might have an opinion. If the goal is returning to the *community*, this is good. If it's about *state building*, it's tricky. The principle of "Rightful Possession" suggests the Palace/State is the heir. Private holding might be a stopgap.
