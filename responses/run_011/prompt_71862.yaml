answer: |-
  You are right to feel the tension. You aren't looking for a single principle; you are looking for a **hierarchy of claims**. Your narrator's conviction comes not from a flat rule, but from a ranked order of moral weights. Case 1 (Benin) is your anchor; everything else must align with it or be explicitly subordinated.

  Here is a principled framework derived from your eight cases, structured as a "Test of Legitimacy."

  ### The Hierarchy of Title

  **Clause 1: The Primacy of Human Dignity**
  *   **Verdict:** Human remains and sacred funerary objects must be returned for burial or care by descendants, regardless of legal title or historical interest.
  *   **Forced by:** Case 5.
  *   **Reasoning:** This sits above property law. A museum is a repository for things, not people. This is the one absolute.

  **Clause 2: The Taint of Illegitimate Taking**
  *   **Verdict:** Objects acquired through direct violence, theft, or punitive expedition must be returned unconditionally.
  *   **Forced by:** Case 1 (Benin).
  *   **Reasoning:** This is your anchor. Title cannot be derived from a crime. No statute of limitations applies to violent dispossession.

  **Clause 3: The Presumption of Structural Coercion**
  *   **Verdict:** In colonial contexts, the burden of proof lies with the museum to demonstrate free consent. "Good faith" purchase in a colonial economy is insufficient if the seller was operating under systemic duress or economic strangulation.
  *   **Forced by:** Case 3 (1930s Plaque).
  *   **Reasoning:** This distinguishes Case 3 from Case 8. In the 1930s colony, the "market" itself was a product of power imbalance. A clean transaction in a corrupt system is still tainted.

  **Clause 4: The Exception of Specific Agency**
  *   **Verdict:** An object may remain if there is documented, specific evidence of personal gift or voluntary transfer by an individual with clear agency, distinct from state or systemic coercion.
  *   **Forced by:** Case 4 (Missionary Gift).
  *   **Reasoning:** This saves Case 4 from collapsing into Case 1. It requires your narrator to be a rigorous archivist. She must believe that *some* individuals could act freely, even in unfree systems. If she loses faith in this, Case 4 goes.

  **Clause 5: The Integrity of Context**
  *   **Verdict:** Architectural or liturgical elements that function as parts of a surviving whole should be reunited with that whole.
  *   **Forced by:** Case 2 (Parthenon).
  *   **Reasoning:** This is aesthetic and functional, not just moral. The sculpture is a brick; the temple is the wall.

  **Clause 6: The Rejection of Paternalism**
  *   **Verdict:** The risk of misuse, poor curation, or political appropriation by the receiving state does not justify continued retention by the holding museum.
  *   **Forced by:** Case 7 (Presidential Palace).
  *   **Reasoning:** To keep an object because the recipient "won't care for it properly" is to claim a civilizational superiority that replicates the colonial mindset.

  **Clause 7: Stewardship Does Not Confer Title**
  *   **Verdict:** Preservation efforts, however successful, do not create ownership rights over illicitly acquired objects.
  *   **Forced by:** The conflict between Case 1 and Case 6.
  *   **Reasoning:** **This is the sacrifice.** To keep Case 1 (Benin) as your moral anchor, you must sacrifice Case 6. You cannot argue that "we saved it" justifies "we keep it." If you allow preservation to cure theft, the Benin Bronzes could stay because the British Museum conserved them better than the Nigerians might have in 1950. Your narrator must accept that returning a looted object is more important than preserving it in the wrong hands.

  **Clause 8: The Intent of Creation**
  *   **Verdict:** Objects explicitly manufactured for the export market, as commodities rather than cultural/sacred items, may remain.
  *   **Forced by:** Case 8 (Export Art).
  *   **Reasoning:** This distinguishes Case 8 from Case 3. If the object was *born* to be sold (e.g., a souvenir, a trade bead), it has no "home" to return to other than the market.

  ---

  ### The "Long-Term Loan" Question

  **Verdict:** It is almost always a polite dodge.

  **Why:** A loan implies the lender retains title. If the principle is **Restorative Justice** (Case 1), title must transfer. If the principle is **Stewardship** (Case 6), a loan makes sense, but you have already sacrificed Case 6 to save Case 1.
  **The Exception:** A loan is only principled if it is a *transitional logistical step* toward full transfer (e.g., "We will loan it while you build the secure facility, then title transfers"). If the loan is indefinite, it is your registrar being a paternalist (violating Clause 6). She knows this, and it should trouble her.

  ---

  ### Running the Principle on Your Three New Cases

  Here is how your narrator, bound by the clauses above, must adjudicate the undecided scenarios.

  #### 1. The Pre-Colonial Loot (Neighbouring Kingdom)
  *   **Scenario:** An object looted by a neighbouring African kingdom before Europeans arrived, later acquired by the museum.
  *   **Analysis:**
      *   **Clause 2 (Illegitimate Taking)** applies to *the museum's* acquisition, not the object's entire history. Did the museum steal it? No.
      *   **Clause 3 (Structural Coercion)** does not apply; this is pre-colonial inter-state conflict, not colonial dispossession.
      *   **Clause 6 (Non-Paternalism)** suggests the museum shouldn't act as judge over ancient wars.
  *   **Verdict:** **Stays.**
  *   **Narrator's Logic:** "My mandate is to repair the wrongs *my* institution participated in or benefited from directly. I am not the global police for every conquest since the Bronze Age. Unless the original owners can prove a continuous, unextinguished claim that supersedes the intervening history, we hold this in trust for humanity, not as a participant in that specific war."
  *   **Tension:** This reveals the limit of her project. It is *Restorative*, not *Universal*. She is cleaning her own house, not the world's.

  #### 2. The Private Collector in Benin City
  *   **Scenario:** A private Benin citizen buys a looted piece at a London auction to bring home, but refuses to give it to the State or Palace.
  *   **Analysis:**
      *   **Clause 1 & 2** are satisfied (it's going home).
      *   **Clause 4 (Specific Agency)** is tricky. Who is the rightful heir? The State? The Oba? The Community?
      *   **Clause 6 (Non-Paternalism)** prevents the museum from dictating *where* in Benin it goes, provided it leaves the Global North.
  *   **Verdict:** **Return is validated, but the internal dispute is not the museum's business.**
  *   **Narrator's Logic:** "My job is to get it out of the colonial ecosystem. Once it crosses that threshold, it is no longer my property to adjudicate. If the people of Benin City decide private ownership is the best way to protect their heritage right now, that is their sovereignty, not my failure."
  *   **Tension:** This tests her commitment to *institutional* repatriation vs. *community* repatriation. She has to accept that "home" might look different than she expects.

  #### 3. The Object Whose Meaning Changed (The "Art" Argument)
  *   **Scenario:** A ritual mask now valued globally as a masterpiece of Modernist art, influencing Picasso etc. Does this new history generate a claim to keep it?
  *   **Analysis:**
      *   **Clause 2 (Illegitimate Taking)** trumps **Clause 5 (Context)**.
      *   The "new meaning" is a product of the museum's own narrative. To use that narrative to justify retention is circular reasoning.
  *   **Verdict:** **Goes back.**
  *   **Narrator's Logic:** "The fact that we looked at it differently for 100 years does not erase the fact that it was taken. To argue otherwise is to say our appreciation outweighs their loss. That is the definition of paternalism."
  *   **Tension:** This is the hardest one for her personally. She loves the object as art. She has to admit that her love is secondary to its origin. This is where you show her grief. She is returning something she loves because she loves justice more.

  ### Summary for the Novel
  To keep your narrator convincing:
  1.  **She must sacrifice Case 6.** She cannot argue preservation justifies theft. She must accept the risk that returned objects might be damaged, because the risk of *moral damage* to the museum is higher.
  2.  **She must treat "Loans" with suspicion.** If she proposes a loan in Case 7, let another character call it out as "colonialism with a receipt." She should have no good answer immediately.
  3.  **Her consistency relies on the Burden of Proof.** She keeps things only when the provenance is *clean* (Case 8, Case 4). If there is a shadow (Case 1, Case 3), the object goes. The ambiguity is resolved in favor of the claimant.

  This makes her a rigorous professional, not a sentimentalist. She follows the code even when it breaks her heart (Case 3, Case 6). That is where the character lives.
