prompt: |-
  I'm a backend engineer at a mid-size freight marketplace — shippers post loads, carriers bid on them, we take a cut. Last year I got talked into building the thing that suggests our bid, and I modeled it as a normal-form game: 4 players (us plus the three carriers we keep losing loads to), about 12 bidding strategies each, payoffs in dollars. 12^4 is way too much for the off-the-shelf equilibrium solver we grabbed, so I wrote a pruning pass that deletes dominated strategies and loops until nothing else drops out. It works, mostly, and it got us under the time budget. But two things happened that I couldnt explain to anyone, and I never took an econ class — my game theory is the minimax chapter of an old AI course plus some blog posts.

  First, our part-time consultant (an actual economist, replies in about three business days) looked at the pruning logs and said something to the effect that I'm deleting strategies which only lose to a coin flip between two other strategies, and that this isn't automatically legal. Then she declined to say more until we buy the next block of hours. Second, I deleted a strategy that never does strictly better than some other strategy in any column but ties in a bunch of them, and the final answer moved by roughly $400k, which is more than the entire reason I did the pruning in the first place. Related: the payoffs aren't clean numbers, they come out of a Monte Carlo simulator, so each one has noise on the order of a few thousand dollars and my comparison is literally `if a > b` on floats. I suspect thats tangled up with problem two but I can't say how.

  What I want is a pruning procedure my team can implement and defend in code review — me and two other backend engineers, no theory background, we have scipy already so a linear program per candidate strategy is acceptable if it isn't thousands of them, and the whole pass has to finish inside a ~90 second CI job. It also needs to survive a one-paragraph explanation to the consultant without her finding something dumb. Please be blunt about which of my current habits are wrong.

  Structure it with these sections, in this order:

  1. **The loop in short** (~120 words) — the pruning pass as pseudocode, the version I should actually ship.
  2. **What "dominated" has to mean here** (~300 words) — strict vs weak, being beaten by one strategy vs by a mix of several, and which columns you're allowed to compare over once deletions have started. Say explicitly which of these choices is safe to repeat and which isn't, and why.
  3. **The procedure, step by step** (~600 words) — numbered, in execution order, including the invariants I should assert in code so a bad deletion fails loudly instead of quietly changing the answer. Mention where a mixed-strategy dominance check becomes an LP and roughly how big that LP is for a 4-player, 12-strategy game.
  4. **Noisy payoffs and ties** (~250 words) — what to do when "strictly better" is inside the Monte Carlo error bars: what tolerance is defensible, how to treat near-ties, and what changes about the procedure if I can't tighten the noise.
  5. **Where it stops and a human decides** (~250 words) — the points where the procedure can't answer on its own and I have to go bother the economist, with the exact question I should ask her each time.
  6. **Three cases from my logs** (~600 words) — run the procedure on: (a) a bid strategy that loses only to a 50/50 mix of two other bid strategies and beats every single strategy outright; (b) the tie-heavy one I deleted that moved the answer $400k; (c) a strategy that only looks dominated after one of the other players' strategies has already been deleted. At least one of these should end in "you cannot prune this," and I want to know which and what it costs me.
  7. **What this doesn't buy me** (~150 words) — what the pruned game does and doesn't guarantee about the equilibria I'll find afterward.
