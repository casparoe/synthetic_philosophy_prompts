answer: |-
  1. **The loop in short**

  ```python
  changed = True
  while changed:
      changed = False
      for player in players:
          for strat in player.strategies:
              # Check if strat is strictly dominated by a MIX of others
              is_dominated, mix_weights = solve_lp(player, strat) 
              if is_dominated:
                  player.remove(strat)
                  changed = True
                  assert_verify_payoff_improvement(player, strat, mix_weights)
  ```

  Ship this version. It replaces your `if a > b` float comparison with a linear program (LP) check for mixed-strategy dominance. It loops until convergence. Crucially, it only removes strategies if the LP proves *strict* dominance with a safety margin. Do not delete on ties. Do not delete based on pure-vs-pure checks alone; your consultant was right that mixed dominance exists. This loop is order-independent for strict dominance, ensuring stability across CI runs.

  2. **What "dominated" has to mean here**

  You are currently pruning based on *pure strategy strict dominance* (Strategy A loses to Strategy B in every column). This is safe but weak. Your consultant flagged *mixed strategy dominance* (Strategy A loses to a 50/50 mix of B and C). This is also safe to prune if strict, but requires an LP to detect.

  The critical error you made was pruning *weakly* dominated strategies (where A ties B in some columns and loses in others). Deleting weakly dominated strategies is **not** safe to repeat. It is order-dependent and can eliminate valid Nash Equilibria. That $400k shift occurred because you pruned a weakly dominated strategy that was part of the equilibrium support.

  For your CI pipeline, you must restrict yourself to **Iterated Deletion of Strictly Dominated Strategies (IDSDS)**.
  1.  **Strict vs. Weak:** Strict means the dominating mix pays *more* in every possible opponent scenario. Weak means *more or equal*. Only prune Strict.
  2.  **Pure vs. Mixed:** A strategy can be undominated by any single pure strategy but dominated by a probabilistic mix of others. You must check Mixed.
  3.  **Iteration:** You can repeat IDSDS safely. Once you remove a strictly dominated strategy, the remaining game preserves all original Nash Equilibria. Removing weakly dominated strategies does not.

  Your current habit of `if a > b` on floats implies strict dominance, but your noise makes it unreliable. Your habit of deleting ties implies weak dominance, which is theoretically unsound for equilibrium preservation. Stop deleting ties immediately.

  3. **The procedure, step by step**

  1.  **Construct Payoff Matrix:** For the target player, build a 2D array where rows are their strategies (12) and columns are all joint opponent profiles ($12^3 = 1,728$). Values are expected payoffs from your Monte Carlo simulator.
  2.  **Iterate Candidates:** For each strategy $S_i$ remaining for this player:
  3.  **Formulate LP:** Use `scipy.optimize.linprog`.
      *   **Variables:** Weights $w_j$ for every other strategy $S_j$ (11 variables) plus a slack variable $\delta$.
      *   **Constraints:** For every opponent column $k$: $\sum (w_j \cdot Payoff_{j,k}) \ge Payoff_{i,k} + \delta$.
      *   **Sum Constraint:** $\sum w_j = 1$.
      *   **Bounds:** $w_j \ge 0$, $\delta \ge 0$.
      *   **Objective:** Maximize $\delta$ (minimize $-\delta$).
  4.  **Solve & Check:** If the solver returns success and $\delta > \epsilon$ (see Section 4), $S_i$ is strictly dominated by the mix $w$.
  5.  **Assert Invariants:** Before deletion, compute the expected payoff of the mix $w$ against the current opponent profiles. Assert that `min(mix_payoffs - candidate_payoffs) > epsilon`. If this fails, crash the build. This prevents solver numerical errors from causing bad deletions.
  6.  **Delete & Mark:** Remove $S_i$ from the player's list. Set `changed = True`.
  7.  **Repeat:** If any player lost a strategy, restart the loop from Step 1. IDSDS requires re-evaluation because removing an opponent's strategy changes the columns.

  **LP Size:** For a 4-player, 12-strategy game, you solve this LP up to 48 times per iteration (4 players × 12 strategies). Each LP has 12 variables and 1,728 inequality constraints. `scipy.linprog` (method='highs') solves this in milliseconds. Total runtime will be well under 90 seconds, even with multiple iterations.

  4. **Noisy payoffs and ties**

  Your `if a > b` on Monte Carlo outputs is statistically invalid. If your simulator noise is $\pm \$2,000$, a difference of \$500 is meaningless. You must introduce a tolerance $\epsilon$.

  Set $\epsilon$ to at least 3 times the standard error of your Monte Carlo simulation (e.g., if noise is \$2k, set $\epsilon = \$6k$). In the LP, require $\delta \ge \epsilon$. This ensures you only prune when the dominating mix is better by a statistically significant margin.

  Regarding ties: If the LP returns $\delta \approx 0$ (within tolerance), the strategy is weakly dominated, not strictly. **Do not prune.** Your $400k error came from pruning weak dominance. If a strategy ties the mix in some columns, it might be required to sustain an equilibrium (e.g., making the opponent indifferent). Treat near-ties as "not dominated." If noise prevents you from proving strict dominance, keep the strategy. It is cheaper to solve a slightly larger game than to solve the wrong game. If the noise is too high to prove anything, stop pruning and alert the team; do not force a deletion.

  5. **Where it stops and a human decides**

  The code cannot decide on weak dominance or high-noise ambiguity. You must halt the automated pruning and page the economist in two specific cases:

  1.  **Weak Dominance Detected:** If the LP finds a mix that beats the candidate strategy ($\ge$) but the slack $\delta$ is less than your noise tolerance $\epsilon$.
      *   **Question:** "Strategy X is weakly dominated by a mix of Y and Z with slack \$500. Noise is \$2,000. Pruning this changes the equilibrium support. Should we keep it to preserve equilibria?"
  2.  **Noise Obscures Strict Dominance:** If the candidate seems dominated visually, but the LP cannot satisfy $\delta \ge \epsilon$ due to payoff variance.
      *   **Question:** "Strategy X appears dominated, but Monte Carlo variance prevents proving strict dominance at 95% confidence. Do we increase simulation samples (costly) or keep the strategy (slower solve)?"

  Do not ask her to validate the code logic; ask her to make the trade-off decision between game-theoretic purity and computational cost. Your code should output a log file listing these specific incidents for her review.

  6. **Three cases from my logs**

  **(a) The 50/50 Mix Case:** You described a strategy that beats every pure strategy but loses to a 50/50 mix of two others.
  *   **Verdict:** **Prune this.**
  *   **Reasoning:** Your old pure-vs-pure check missed this, which is why you needed the consultant. The new LP procedure detects mixed dominance. Since it loses to the mix in *all* columns (strictly), IDSDS allows deletion. This reduces the game size without losing equilibria.
  *   **Cost:** None. This is a valid reduction.

  **(b) The Tie-Heavy Case ($400k Shift):** You deleted a strategy that tied in several columns but never won.
  *   **Verdict:** **You cannot prune this.**
  *   **Reasoning:** This is weak dominance. The LP will return $\delta \approx 0$. Your procedure will flag this as "Weak Dominance Detected" and stop.
  *   **Cost:** You retain the strategy, increasing the matrix size slightly. However, pruning it altered the equilibrium set, causing the $400k valuation error. Keeping it preserves the correct solution space. The cost is compute time, not financial accuracy.

  **(c) The Iterated Case:** A strategy looks safe initially but becomes dominated after an opponent's strategy is deleted.
  *   **Verdict:** **Prune this (in the second iteration).**
  *   **Reasoning:** This is the core benefit of the `while changed` loop. In iteration 1, the strategy is not dominated. In iteration 2, the opponent's column that protected it is gone. The LP now proves strict dominance.
  *   **Cost:** None. IDSDS is order-independent for strict dominance. Whether you delete the opponent's strategy first or this one first, the final reduced game is identical. Your code must loop until no more deletions occur to catch these.

  7. **What this doesn't buy me**

  This procedure guarantees that any Nash Equilibrium in the original game exists in the pruned game. It does **not** guarantee the pruned game has a *unique* equilibrium. You might still have multiple equilibria with different payoffs; pruning doesn't solve the selection problem. It also doesn't handle correlated equilibria or dynamic inconsistencies if your game modeling is flawed. Finally, it assumes your Monte Carlo mean is unbiased; if the simulator itself is biased, pruning validates the bias. You still need the economist to validate the payoff model, not just the pruning logic.
