      Start by setting the stage. You need to establish a shared understanding of social stability before you can argue about how different cultures achieve it. Before they can accept your thesis that the Dream legitimizes inequality, they need to accept the sociological premise that every society needs a narrative to explain why some people have more than others without causing a revolution. If you jump straight to calling the Dream a lie, they will dismiss it as anti-American propaganda, but if you frame it as a tool for social cohesion, similar to how Janteloven functions in Norway, it becomes a comparative analysis rather than a judgment. You need to spend the first five minutes establishing that both cultures have high inequality potential but manage it differently, so the Dream isn't about economics alone but about psychological acceptance of one's status.

      The single story you should use is not a famous success story but rather a composite or historical example of someone who struggled significantly, failed to achieve upward mobility, yet still blamed themselves rather than the system. You might use a character from literature like Willy Loman or a generalized account of a factory worker during a recession who believes that if they just work harder next time, they will make it. This story needs to feature genuine hardship and a lack of reward, but crucially, it must show the subject maintaining faith in the system despite that lack of reward. It absolutely cannot have a happy ending or a twist where they succeed against the odds, because a real rags-to-riches person would wreck your argument by validating the Dream as a factual possibility rather than a functional myth. If you show someone who made it, the discussion shifts to whether the Dream is true or false, but your point is about what the belief does for society regardless of its truth. A success story proves mobility exists, which undermines your claim that the Dream is primarily a legitimizing mechanism for inequality, whereas a story of failure where the person still believes proves that the Dream functions to prevent unrest even when it doesn't deliver.

