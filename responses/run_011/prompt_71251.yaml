  The single story you should use to carry the session is a composite narrative of an immigrant or working-class individual who worked hard, followed the rules, and still failed to achieve upward mobility, yet continued to believe that success was possible for them or their children. This story needs to feature genuine hardship and a lack of material reward, but crucially, it must show the subject maintaining faith in the system despite that lack of reward. It absolutely cannot have a happy ending or a twist where they succeed against the odds, because a real rags-to-riches person would wreck your argument by validating the Dream as a factual possibility rather than a functional myth. If you show someone who made it, the discussion shifts to debating whether the Dream is true or false, but your point is about what the belief does for society regardless of its truth. A success story proves mobility exists, which undermines your claim that the Dream is primarily a legitimizing mechanism for inequality, whereas a story of failure where the person still believes proves that the Dream functions to prevent unrest even when it does not deliver results.

  You need to anticipate that the Norwegian students will arrive thinking the American Dream is simply about greed or individual superiority, viewing it as the moral opposite of Janteloven. They will likely assume Americans believe they are inherently better than others, whereas your argument is that Americans believe the system is fair, not that they are superior by birth. You also risk creating a misconception in the first ten minutes if you define the Dream too broadly as just freedom or happiness, which will make your later critique seem like you are attacking freedom itself. You should head off their misconception immediately by distinguishing between individual arrogance and systemic faith, clarifying that the Dream is about the rules of the game being fair, not about everyone winning. You should head off your own potential misconception by explicitly stating early on that you are not arguing whether the Dream is true or false, but rather what work it performs for the society that holds it, which keeps the conversation sociological rather than patriotic or cynical.

  When you reach the end of the session, you need a question that forces them to apply the framework rather than just nodding politely. Ask them to identify a specific Norwegian policy or social norm that would fail if imported to America because it relies on Janteloven instead of the Dream, or vice versa. This requires them to demonstrate they understand the functional difference between the two cultural scripts rather than just reciting your definition back to you. If they can articulate why a specific thing works in one place and not the other based on the underlying belief system, you will know the concept landed.

  Finally, regarding Tall Poppy Syndrome, since you mentioned you barely understand it yourself, you should say out loud that you are skipping a deep dive into it because you do not feel qualified to teach it, but you will note that it functions similarly to Janteloven as a mechanism to curb individual standing. By admitting this limitation openly, you model the intellectual honesty that fits a sociology discussion and prevents them from thinking you are ignoring relevant cultural concepts. This admission actually strengthens your credibility because it shows you are distinguishing between what you know and what you are guessing, which aligns with the critical thinking skills you want them to use when analyzing the American Dream.
