answer: |-
  The hum of the Speculum vibrated through the floorboards of the antechamber, a low thrum that Elara felt in her teeth. It was the sound of reality being sifted. Beyond the heavy oak doors, the High Court was consulting the nearby worlds, checking the infinite variations of the valley to see how the Valdez Accord held up across the multiverse.

  Mr. Vane sat on the velvet bench, rubbing a calloused thumb over the rim of his hat. He was a man of earth and flow rates, of acre-feet and irrigation ditches. He did not care about the Speculum. He cared about whether the upstream consortium had to release the winter melt.

  "Tell me again," Vane said, his voice gravelly. "Why does it matter what the water is in worlds we can't touch?"

  Elara shifted her briefcase. She was twenty-six, the youngest advocate ever admitted to the Concordance Bar, and she felt the weight of a century of semantic theory pressing on her shoulders. "Because the Treaty says 'The Waters of the High Valley.' It doesn't define 'water.' The upstream owners are arguing that in some of the worlds the Speculum shows, the liquid filling that valley isn't H2O. It's a different compound. Same look, same taste, same function. They call it 'XYZ' in the texts. They say the Treaty only applies to the *role* of water, not the *substance*."

  Vane snorted. "Water is water. It's wet. It grows corn."

  "In our world, yes. But the Court has to rule on the *necessity* of the term. If 'water' in the Treaty just means 'whatever clear drinkable stuff is in the valley,' then the upstream owners are right. In the XYZ worlds, they don't have to share. If 'water' means *this specific substance*, the one we drink, then they owe you the flow regardless of the chemical makeup in those other realities."

  Vane looked at the door. "So you're telling me I need a philosopher, not a lawyer."

  "I'm telling you that the law ran out of map, and now we're in the territory," Elara said. She leaned forward, lowering her voice. "Mr. Vane, imagine your grandfather signed this deal. He took a cup, went to the valley, filled it, and drank. He said, 'We share *this*.' He didn't say, 'We share whatever fits the description of a clear liquid.' He pointed at the stuff."

  "Sure," Vane said. "He pointed at the wet stuff."

  "But he didn't know it was H2O," Elara pressed. "He couldn't have. Chemistry was a century away. He found out what it was by testing, by measuring, by drinking. That was empirical. It was contingent. He *could* have been wrong about what it was. But now that we know it's H2O, does that identity hold across the worlds the Speculum sees? Or does it snap back to whatever fits the 'water role'?"

  Vane frowned, the lines on his forehead deepening. "You're saying that because we know what it is now, it *had* to be that all along? Even in the other worlds?"

  "Yes. That's the argument. The name 'Water' locks onto the substance. Once locked, it doesn't let go. Even if we go to a world where the lakes are filled with XYZ, if we call that 'water,' we are speaking loosely. Strictly speaking, that's not water. So the Treaty, which binds 'Water,' doesn't bind the XYZ."

  Vane set his hat on his knee. He looked at Elara with a sharp, pragmatic clarity that made her pause. "Miss Elara. Say my grandfather, when he signed, had a tremor. Say his hand shook. Instead of pointing at the cup from the valley, he pointed at the cup of wine on the table. By accident. And the scribe wrote down 'We share the liquid in the cup.' Now, wine is the treaty."

  Elara nodded slowly. "Hypothetically."

  "Then the law depends on a shake of the hand," Vane said. "On a mistake. If he points at the wine, the treaty is about wine. If he points at the valley, it's about the valley stuff. That means the binding power isn't in the liquid. It's in the finger. It's in the accident of the naming."

  He leaned in, his eyes hard. "So don't tell me this is necessary truth. It's just a record of where a finger pointed a hundred years ago. If the finger pointed elsewhere, the truth changes. That's not necessity. That's luck. And you want me to bet my farm on luck?"

  Elara felt the cold hum of the Speculum intensify. Vane had hit the nerve. He had articulated the contingency of the initial baptism. If the reference was fixed by a contingent act, how could the resulting truth be necessary?

  "The finger is how we find it," Elara said, her voice steady despite the tremor in her hands. "But it's not what we keep. Think of the treaty not as a description, but as an anchor. Your grandfather dropped the anchor into the seabed. The chain is the name 'Water.' The seabed is the substance, H2O."

  "Anchors drag," Vane said.

  "Not this one. Once the anchor bites, it doesn't matter if the boat moves. The Treaty isn't about the act of pointing, Mr. Vane. It's about the intent to bind the reality that was pointed *at*. The necessity isn't in the naming ceremony. It's in the object of the agreement. If they had pointed at the wine, yes, the Treaty would be about wine. But they pointed at the valley. They intended to bind the *nature* of that valley's liquid, not just its appearance."

  She stood up, pacing the small room. "You say it's luck. I say it's discovery. We discovered that water is H2O. We didn't invent that. In the worlds where the lakes are XYZ, the ancestors there might call it 'water,' but they are mistaken about the identity. The Treaty was signed in *this* world, anchoring to *this* substance. The Speculum checks if that anchor holds in the other variations. If the Treaty is about the substance, the upstream owners owe you the flow even in the XYZ worlds, because they can't give you XYZ and call it performance. They owe you H2O. And if the valley only produces XYZ there, they are in breach."

  Vane sat silent for a long moment. The hum of the machine seemed to rise in pitch. "So," he said slowly. "You're saying the truth is necessary, but only because we decided to make it so by signing the paper?"

  "No," Elara corrected. "The truth that water is H2O is necessary in itself. We couldn't have made it otherwise. The Treaty simply rides on that necessity. The naming was contingent—yes, they could have named the wine. But once they named the valley liquid, they latched onto a necessary truth about the universe. The discovery wasn't empty, Mr. Vane. It told us what we were actually dealing with. It told us that if the upstream owners try to divert the flow and replace it with something that looks like water but isn't *the* water, they break the deal. Not because of the word, but because of the stuff."

  Vane rubbed his chin. "It survives the shake of the hand," he murmured. "Because once the hand stops shaking, the grip is on the rock, not the air."

  "Exactly. The contingency is in the history. The necessity is in the hold."

  The heavy oak doors groaned open. A bailiff stepped out, his face unreadable. "The Court has reached a determination regarding the Valdez Accord."

  Elara looked at Vane. He didn't stand immediately. He looked at his hands, then at the door, processing the distinction. The luck of the pointing remained—it was historical fact. But the grip of the law was now on the essence, not the description. The upstream owners couldn't hide behind the "water role." They were bound to the substance.

  Vane stood up, placing his hat back on his head. He looked lighter, the burden of the ambiguity lifted not by a change in the water, but by a change in how the law saw it.

  "Come on, then," Vane said. "Let's go see if the anchor held."

  Elara followed him into the courtroom. The Speculum glowed in the center of the dais, showing a dozen shimmering images of the valley, some with blue lakes, some with slightly different hues, some with compounds that shimmered like oil but flowed like rain. The Chief Justice looked down from the bench.

  "The Court finds," the Justice intoned, "that the term 'Waters' in the Valdez Accord functions as a rigid designator. It picks out the substance native to the signing jurisdiction. In worlds where the valley contains a distinct compound, the obligation to share 'Water' remains unfulfilled by the provision of that compound. The Treaty binds the essence, not the role."

  Vane exhaled, a long, slow breath. He nudged Elara. "The anchor held."

  "It held," she said.

  They walked out into the corridor, the hum of the Speculum fading behind them. The sun was setting over the city, casting long shadows. Vane stopped and looked at a fountain in the plaza. The water arced into the air, catching the light.

  "Could have been wine," Vane said quietly, watching the stream.

  "It wasn't," Elara replied.

  "No," Vane said, turning toward the exit. "It wasn't. And now they have to pay for it."

  Elara watched him go. She knew the philosophers would argue for decades about the modal status of the ruling, about the metaphysics of the Speculum's worlds. But as she packed her briefcase, she knew what mattered. The distinction between the accidental naming and the necessary reference hadn't blurred. It had saved the farm. The truth was discovered, not decreed, but once discovered, it bound them all. The necessity wasn't empty; it was the only thing heavy enough to hold the weight of the law.
