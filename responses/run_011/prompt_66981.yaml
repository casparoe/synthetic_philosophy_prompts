  2. Remembering is preserving the artifact in a museum for education while honoring is displaying it on civic grounds as a model citizen, a distinction controlled by the board's zoning power. This is substantive and defensible, and it does her work by framing the move as a change in civic status rather than historical erasure.

  3. Remembering is recording the full complexity of the subject's impact via explanatory text while honoring is presenting them as an unambiguous hero, a distinction managed by the historical narrative the state authorizes. This is substantive and defensible, and it does her work by validating the plaque's dual narrative as sufficient memory without veneration.

  4. Remembering is acknowledging the labor movement's gains even when achieved through exclusion while honoring is validating the exclusionary tactics themselves, a distinction demanded by the descendants of the workers. This is substantive but contested, and it partially does her work by separating the economic win from the racist means, though it risks alienating activists who see the statue itself as the honor.

  5. Remembering is centering the excluded Black and Chinese workers in the historical record while honoring is continuing the organizer's legacy of exclusion by keeping his likeness supreme, a distinction the board adopts to redefine who counts as the subject of memory. This is radical and defensible, and it does her work best by arguing that moving the statue actually honors the excluded workers more than leaving it up.
