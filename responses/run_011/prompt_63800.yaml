      We measure what was done and when and to whom.
      We measure it in front of witnesses.
      In crystallography we measure the intensities of the diffracted beams.
      We lose the phases.
      We have the magnitudes and never the angles.
      We cannot build the structure until we get the phases back.
      Evidence about a person is like that.
      We get the intensities and never the phases.
      We never know what it was from the inside.
      Two quite different models fit the same data.
      The standard old trick for recovering the phases is to soak a heavy atom into the crystal.
      It is something foreign and dense.
      Its position you can fix exactly.
      You take the difference between the pattern with it and the pattern without.
      The business of 1979 is the heavy atom in this speech.
      It is the one thing about Gil whose position we can locate precisely.
      From it you get phases for everything else.
      It fixes the structure against the data.
      Without it the model drifts.
      With it the error aligns with the excellence.
      You cannot ignore the heavy atom.
      You cannot pretend it is not dense.
      It changes the diffraction pattern.
      It changes how you see the rest of the structure.
      If you leave it out the map is unintelligible.
      If you focus only on it the map is empty.
      You need both the heavy atom and the protein.
      You need the event and the life around it.

      For eleven years after his wife died he came in at four in the morning.
      He slept in the department.
      The whole staff conspired not to mention it.

      Plutarch writes in the *Lucullus* about portraits.
      He says a portrait that reveals character is finer than one that merely copies features.
      He says transgressions and follies which sully a man's career must be regarded rather as shortcomings in some particular excellence.
      He says they are not the vile products of positive baseness.
      He says we must treat them as though we were tenderly defending human nature.
      He says human nature produces no character which is absolutely good.
      He writes our history in the same breath as insisting he is no historian.
      I have gone round and round on this advice.
      Is that advice generosity.
      Is it hagiography with better manners.
      I want to come down somewhere on it.
      I want to own that I am coming down.
      I think it is generosity that knows the cost.
      To flatten a life is to lose the structure.
      In the saints' lives the template is holiness.
      The details that actually make a life readable are the ones that don't fit the template.
      Knowing in advance what a life is meant to demonstrate is precisely what flattens it.
      I am uneasy about whether the same is true of this speech.
      I already know what I want it to show.
      But the data must stand.
      We cannot solve the phase problem by wishing for a better crystal.
      We cannot edit the intensities to suit the model.
      We must accept the data as it falls on the detector.
      We must accept the man as he fell on his times.
      This is not absolution.
      This is structure determination.

      I speak now to the students in the room.
      You never met him.
      You will read his life in the papers and the stories.
      You will get the intensities.
      You will not get the phases.
      Do not seek a model that fits without the heavy atom.
      Do not seek a template that removes the friction.
      Read for the slight things.
      Read for the green ink and the notebooks.
      Read for the silence around the sleeping.
      Do not solve for a hero.
      Solve for the structure.
      The structure holds the error and the excellence together.
      If you remove the error the structure collapses.
      If you remove the excellence the structure dissolves.
      Plutarch tells us to look for the phrase or the joke.
      Look for the margin note that says probably.
      Look for the hand that writes the long reply.
      You are building a model of human nature.
      It will not be absolutely good.
      It must be true.
      When you leave this room you will carry his name.
      You will carry the notebooks and the green ink.
      You will carry the silence and the shouting.
      Do not polish the model until it shines.
      Leave the rough edges where they belong.
      That is how you read a life.
      That is how you honor the dead.
      Thank you.

