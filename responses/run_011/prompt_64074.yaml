answer: |-
  Q&A PREPARATION SHEET

  OPENING CONCESSIONS
  Deliver these in the first five minutes to preempt specific lines of attack.

  1. Concede the phenomenological difference. Acknowledge that personal resentment feels distinct from vicarious indignation. State clearly that you are arguing for explanatory priority, not phenomenological identity. You are not claiming the victim feels nothing special, only that the normative standing derives from the third-personal form.
  2. Concede the fallibility of convention. Acknowledge that social practices of recognition are often unjust. Clarify that your claim is about the structure of standing, not the moral perfection of current conventions. You are describing how standing functions, not endorsing every instance of it.
  3. Concede the relational impact. Acknowledge that blame alters relationships. State that you are not denying this effect, but arguing that the authority to initiate that alteration comes from the claim itself, not solely from the prior relationship.

  TEN OBJECTIONS AND REPLIES
  Ranked by damage potential if fielded badly.

  1. The Second-Personal Authority Objection
  Objector: You have described a spectator observing a violation, not an agent holding another accountable. Without the structure of I demand of you, you have no accountability. You have given me a report on morality, not a practice of responsibility.
  Reply: Accountability requires a demand, but the authority to make that demand does not originate in the relationship between demander and wrongdoer. It originates in the claim held by the beneficiary. When I demand you stop, I am not asserting my private authority; I am enforcing a public claim. The second-personal structure is the vehicle, but the third-personal claim is the engine.
  Soft Spot: This relies on an empirical commitment that people experience third-party demands as authoritative rather than merely interfering. If the phenomenology of being blamed by a stranger is fundamentally different from being blamed by a victim, my account of accountability fractures.
  Status: KILLER. If accountability requires the victim's specific authority, the priority thesis collapses.

  2. The Strawsonian Phenomenology Objection
  Objector: You have drained the heat out of resentment. By making it about claims and standing, you have turned a reactive attitude into a cool judgement. You have dissolved the participant stance into the objective stance.
  Reply: I am not denying the heat. I am arguing the heat is generated by the recognition of a disregarded claim, not by the personal sting. The fire comes from the violation of the norm, not the wound to the ego. The attitude remains reactive because it responds to quality of will, even if the will is not directed at me.
  Soft Spot: This risks intellectualizing the emotion. If I cannot explain the visceral anger of personal resentment without referencing the self, the Strawsonians will claim I have changed the subject.
  Status: KILLER. If the attitude is no longer reactive, it is not Strawsonian resentment.

  3. The Claimless Victim Objection
  Objector: You build your case on the comatose and the dead. But these beings cannot hold claims. They cannot participate in the normative community. You are projecting claims onto them that do not exist.
  Reply: Claims do not require the capacity to assert them in the moment. They require a status that protects interests. We recognize the claim of the comatose because we recognize the kind of being they are, not because of their current capacity. The third-personal stance preserves their standing when they cannot preserve it themselves.
  Soft Spot: This depends on a metaphysical account of claims existing independently of capacity. If claims are essentially relational capacities, the comatose have none, and my core examples fail.
  Status: KILLER. If the core cases are incoherent, the argument for priority loses its main evidence.

  4. The Empirical Bias Objection
  Objector: My research shows third-party punishment is driven by group bias and outcome severity, not stable norms. If the basic form is this noisy, why build a normative theory on it? You are building on sand.
  Reply: I agree the practice is noisy. But the noise reveals the structure. We see bias precisely because we expect the third-personal stance to be impartial. The deviation proves the norm. I am arguing for the structure of the practice, not its statistical perfection.
  Soft Spot: This relies on an empirical commitment that the ideal of impartiality is inherent to the practice rather than a philosophical imposition. If the data shows people view third-party punishment as inherently partisan, my normative leverage disappears.
  Status: HIGH DAMAGE. Undermines the stability of the proposed base.

  5. The Relational Theory Objection
  Objector: Blame is essentially about repairing or acknowledging impairment between two people. By making it about a third party representing a claim, you make the relationship incidental. You lose the point of blame.
  Reply: The relationship is the context, not the source. The impairment matters because it signals a disregard for the claim. The third-personal stance highlights that the wrong is not just about us; it is about what you did to the norm embodied in me.
  Soft Spot: If the relational theorist insists that without a prior relationship there is no blame only punishment, I may be conflating two distinct practices.
  Status: MEDIUM DAMAGE. Forces a distinction between blame and sanction.

  6. The Standing Explosion Objection
  Objector: If standing is just representing a claim, anyone can resent anything. Why can I not resent a wrong done on another continent to a stranger? Your view grants too much standing.
  Reply: Standing requires being in a position to represent the claim effectively within a practice. Proximity and social role matter. You lack standing not because you lack the claim, but because you lack the social position to enforce it without undermining the practice.
  Soft Spot: This reintroduces a conventional limit that looks suspiciously like the personal limit I tried to avoid. I need a clear criterion for effective representation.
  Status: MEDIUM DAMAGE. Makes the view implausible if not constrained.

  7. The Judgement vs Attitude Objection
  Objector: You say this is an attitude, but your description fits a judgement. You have turned resentment into a belief that a claim was violated. Where is the emotion?
  Reply: The judgement is the content, the attitude is the stance. One can judge a claim was violated without resenting. Resentment is the commitment to uphold that claim emotionally. I am not reducing the attitude to the belief.
  Soft Spot: Strawsonians may insist the emotion is primary and the judgement secondary. If I cannot locate the emotion independently of the judgement, the charge sticks.
  Status: MEDIUM DAMAGE. Risks aligning me with rationalists against naturalists.

  8. The Convention vs Nature Objection
  Objector: You say the framework is conventional in its reach. But if responsibility depends on convention, it is not real responsibility. It is just social policing.
  Reply: Human nature provides the capacity, convention provides the shape. Responsibility is real because the claims are real, even if the recognition of them varies. We do not deny vision exists because some cultures lack words for colors.
  Soft Spot: This is a metaphysical gamble. If the Strawsonians hold that responsibility must be universal to be real, my conventionalism looks like relativism.
  Status: MEDIUM DAMAGE. Threatens the metaphysical robustness of the view.

  9. The Desert Skeptic Objection
  Objector: Does this survive without desert? If the victim does not deserve better, can anyone resent on their behalf?
  Reply: Yes. Resentment tracks the disregard of the claim, not the metaphysical desert of the victim. One can resent the violation of a right regardless of whether the victim morally deserved that right in a cosmic sense.
  Soft Spot: If the skeptic argues that claims themselves require desert, the view collapses. I am assuming claims exist independently of desert.
  Status: LOW DAMAGE. Can be compartmentalized as a separate metaphysical debate.

  10. The Motivation Objection
  Objector: Why should I care enough to resent for you? Personal resentment is self-protective. Vicarious resentment is costly. What drives it?
  Reply: It is driven by social identity and normative commitment. We resent because we see ourselves as members of a community where such claims hold. It is costly, which is why it signals genuine commitment.
  Soft Spot: This relies on an empirical commitment about human motivation toward abstract norms. If psychology shows we only care about kin or allies, the universal claim weakens.
  Status: LOW DAMAGE. Psychological question, not structural.

  COORDINATED PINCER ATTACKS

  1. The Detachment Pincer
  Objectors: The Second-Personal Theorist and the Senior Strawsonians.
  Strategy: They will argue jointly that by removing the personal stake and the direct demand, I have created a detached observation that cannot sustain responsibility.
  Response Line: Decline to answer separately. State that accountability and participation are preserved because the claim itself demands a response, regardless of who voices it. The demand is in the act, not the identity of the demander.

  2. The Normativity Pincer
  Objectors: The Skeptic and the Graduate Students.
  Strategy: They will argue that if the base is empirically biased and metaphysically unsupported by desert, there is no normative force left.
  Response Line: Decline to answer separately. State that normative force comes from the social practice of holding each other to standards, which exists regardless of desert or perfect impartiality. The practice is the source of the norm.

  OBJECTIONS REQUIRING THESIS ABANDONMENT
  If the following land successfully, you must give up the priority thesis rather than restate it:
  1. The Second-Personal Authority Objection (If accountability essentially requires victim authority).
  2. The Strawsonian Phenomenology Objection (If the emotion essentially requires personal slight).
  3. The Claimless Victim Objection (If claims essentially require current capacity to assert).

  THE EXCHANGE TO AVOID
  The Empirical-Normative Bridge.
  Question: If third-party resentment is empirically shown to be driven by out-group hostility rather than normative violation, how can it serve as the normative basis for responsibility?
  Why it is difficult: This forces you to defend an is-ought bridge. If you say the empirical data is wrong, you look anti-science. If you say the data is right but irrelevant, you look disconnected from practice. If you say the data is right and relevant, you admit your normative base is corrupt.
  Preparation: Do not improvise. Stick to the line that empirical variability shows the need for critique, not the absence of structure. Defer to the distinction between the practice existing and the practice being just.
