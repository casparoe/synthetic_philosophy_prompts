answer: |-
  **EXAMINATION PAPER**

  **Module:** PHI502 Philosophy of History
  **Time Allowed:** 3 Hours
  **Instructions:** Answer TWO questions. Each question carries 25 marks.

  **Question 1**

  Fernand Braudel's *The Mediterranean and the Mediterranean World in the Age of Philip II* proposes a division of historical time into three scales: geographical time, social and economic time, and event history. Using the dossier below concerning the Dutch Republic (c. 1580–1680), critically evaluate the utility of this scheme.

  **Dossier**
  1. The long-run extraction of peat in Holland and Utrecht, and the resulting gradual lowering of the land surface relative to mean sea level.
  2. The drainage of Lake Beemster, completed in 1612 by a ring of windmills, converting a lake into some seven thousand hectares of farmland laid out on a geometric grid.
  3. The foundation of the Amsterdam Wisselbank in 1609, and the requirement that large bills be settled by transfer of bank money.
  4. The herring fishery: its seasonal fleets, its busses, and the licensing and guild institutions that regulated the season.
  5. The assassination of William the Silent at Delft in 1584.
  6. The tulip bulb market of 1636–37 and its collapse in February 1637.
  7. The disaster year of 1672: the French invasion, the deliberate flooding of the Water Line, the killing of the De Witt brothers, and the financial panic that followed.
  8. The colder winters, advancing Scandinavian glaciers and recurrent harvest failures of the Little Ice Age, including the seasonal freezing of the Zuiderzee and of the canals.
  9. The Baltic grain trade and its dependence on Polish manorial agriculture and barge transport down the Vistula.
  10. A single Amsterdam price series for rye, recorded weekly, showing sharp spikes in 1596–98, in the 1620s, and in 1672.

  **In your answer, you must:**
  *   Allocate at least six of the ten items to one of Braudel's three time-scales, and defend the allocation rather than merely assert it;
  *   Account for at least two items that resist allocation, the Beemster drainage and the rye series being the obvious candidates, on the grounds that their duration as processes and their duration as consequences come apart;
  *   Take a position on the status of the scheme itself — whether the three scales are three rates of real process, three levels of description of a single process, or three narrative genres — and show what turns on the answer by identifying an item whose classification changes under rival answers;
  *   Address the objection that the speed of a process is not intrinsic to it but relative to the variable chosen, the unit of measurement and the baseline against which change is counted, so that the sorting of the dossier already presupposes an answer to the question the candidate is being asked;
  *   Confront the charge that a framework which treats events as superficial disturbance cannot explain the onset of change, and in particular cannot explain why 1672 happened when it did, without reducing Braudel to a geographical determinist he does not plainly profess to be.

  ***

  **MODEL ANSWER**

  Braudel's tripartite scheme is often mistaken for a simple taxonomy of duration, but the Dutch dossier reveals it as a problematic ontology of historical reality. To utilise Braudel effectively, one must treat the scales not as distinct buckets but as interacting tensions. The dossier allows us to test whether these scales describe the world or merely our narration of it.

  Allocating the items requires distinguishing between human time and environmental time. Items 1 (peat extraction), 8 (Little Ice Age), and 9 (Baltic grain trade) belong to geographical or structural time. They operate beyond the lifespan of individuals, setting the limits of human action. The lowering of land and the freezing of canals are slow constraints. Items 3 (Wisselbank), 4 (herring fishery), and 6 (tulip market) fit social and economic time, or conjunctures. These are cyclical or institutional rhythms lasting decades. The guild regulations and bank mechanisms structure exchange without fixing it permanently. Items 5 (assassination) and 7 (1672 disaster) are event history. They are singular, disruptive moments. This allocation is defensible because it separates the conditions of possibility (peat, climate) from the mechanisms of exchange (banks, guilds) and the ruptures that alter political trajectory (assassinations, invasions).

  However, Items 2 (Beemster drainage) and 10 (rye series) resist this clean sorting. The Beemster drainage was completed in 1612, suggesting an event, yet it converted a lake into permanent farmland, creating a structure that outlasted the agents. Its duration as a process was short, but its duration as a consequence is structural. Similarly, the rye series is recorded weekly, implying event-level data, yet the spikes in 1596–98 and 1672 reflect conjunctural crises embedded in structural trade dependencies. These items demonstrate that Braudel's scales are not intrinsic properties of objects but depend on whether we view them as actions or as legacies.

  This leads to the status of the scheme. If the scales are three rates of real process, then Beemster is an anomaly. If they are three levels of description, the anomaly dissolves. I argue they are levels of description. Consider Item 6, the tulip market. Viewed as narrative genre, it is a sensational event of madness. Viewed as economic description, it is a conjunctural speculation within a broader financial culture. If the scales are real processes, the tulip mania is either event or conjuncture, not both. If they are descriptive levels, it is an event situated within a conjuncture. This distinction matters because it prevents reifying the scales into causal forces.

  Nevertheless, one must address the objection that speed is relative. The sorting of the dossier presupposes a human baseline. Peat extraction is slow relative to a human life but fast relative to geological formation. The rye series is high-frequency data compared to climate records but low-frequency compared to stock ticks. Braudel's scheme implicitly adopts the human lifespan as the unit of measurement. If we change the variable to geological time, the Little Ice Age becomes an event. If we change it to high-frequency trading, the weekly rye prices become a structure. Therefore, the scheme is not objective; it is anthropocentric. It sorts history by what matters to human agents, not by absolute velocity.

  Finally, does this framework explain change, specifically 1672? A crude reading suggests events are merely foam on deeper currents, implying 1672 was inevitable given the structures. This reduces Braudel to a geographical determinist. However, Braudel does not claim structures determine events, only that they constrain them. The French invasion and the killing of the De Witt brothers were not caused by the peat extraction or the freezing canals. Rather, the structural conditions made the Republic vulnerable. The flooding of the Water Line was a human decision enabled by geographical knowledge. The financial panic was a reaction to political collapse. Events are not superficial; they are the points where structural tensions snap. 1672 happened when it did because political failures coincided with external pressure, within limits set by geography. The scheme explains the vulnerability, not the specific trigger. To demand it explain the trigger is to demand event history explain itself. Braudel's value lies in showing why the snap was so devastating, not why it occurred on that specific Tuesday.

  In conclusion, the Dutch dossier confirms that Braudel's scales are heuristic devices rather than ontological realities. Items like Beemster and the rye series show that processes shift scales depending on whether we measure their construction or their consequence. The scheme remains useful not because it categorises time absolutely, but because it forces the historian to acknowledge that some constraints outlive the actors who navigate them.

  ***

  **MARKING SCHEME**

  **Total Marks: 25**

  **1. Allocation and Defence (5 marks)**
  *   **5:** Allocates six+ items correctly; defence references the nature of the process (constraint vs. cycle vs. rupture) rather than just duration.
  *   **3-4:** Allocates six items; defence relies primarily on length of time rather than structural impact.
  *   **1-2:** Allocates fewer than six items or asserts allocation without defence.
  *   **0:** No coherent allocation.

  **2. Handling Resistant Items (5 marks)**
  *   **5:** Explicitly analyses Beemster and rye series; articulates the divergence between process duration and consequence duration.
  *   **3-4:** Identifies the items as problematic but offers a vague explanation of the tension.
  *   **1-2:** Mentions the items but fails to explain why they resist the scheme.
  *   **0:** Ignores the specific requirement regarding resistant items.

  **3. Status of the Scheme (5 marks)**
  *   **5:** Takes a clear position (rates vs. levels vs. genres); demonstrates how a specific item (e.g., tulips) shifts classification under rival positions.
  *   **3-4:** States a position but fails to show the consequential shift in classification for a specific item.
  *   **1-2:** Describes the three options without taking a position.
  *   **0:** No discussion of the ontological status of the scheme.

  **4. Relativity of Speed Objection (5 marks)**
  *   **5:** Addresses the variable/unit/baseline objection; acknowledges the anthropocentric nature of the scheme.
  *   **3-4:** Acknowledges relativity but fails to connect it to the sorting of the dossier.
  *   **1-2:** Dismisses the objection or treats speed as intrinsic.
  *   **0:** No engagement with the objection.

  **5. Problem of Change and 1672 (5 marks)**
  *   **5:** Confronts the determinism charge; distinguishes between structural vulnerability and event trigger regarding 1672.
  *   **3-4:** Discusses 1672 but slips into determinism or treats events as purely superficial.
  *   **1-2:** Mentions 1672 without addressing the philosophical charge regarding change.
  *   **0:** Ignores the requirement to explain the onset of change.

  **Band Descriptors**

  *   **First Class (72 marks equivalent):** The script synthesises all five components into a coherent argument. It recognises the tension between the scheme as ontology and as methodology. The handling of the resistant items (Beemster/rye) is used to support the thesis on the status of the scheme. The discussion of 1672 avoids determinism without abandoning structuralism. The writing is precise, and the defence of allocation is nuanced.
  *   **Upper Second Class (63 marks equivalent):** The script addresses all five components but treats them as separate tasks rather than a unified argument. The allocation is correct but defended primarily by duration. The status of the scheme is identified but the consequence for classification is less clearly drawn. The discussion of 1672 is adequate but may lean slightly towards determinism or event-focused explanation. The relativity objection is noted but not fully integrated into the analysis of the dossier.

  ***

  **CHARACTERISTIC ERRORS**

  1.  **Treating the *longue durée* as a synonym for a long period.**
      *   **Cost:** 3 marks.
      *   **Note:** This ignores the structural constraint aspect, reducing a philosophical category to a chronological measurement.

  2.  **Treating a structure as a cause of the same logical type as an event.**
      *   **Cost:** 3 marks.
      *   **Note:** This commits a category mistake; structures set limits, events trigger changes within limits.

  3.  **Dissolving the scheme into the observation that everything interacts with everything.**
      *   **Cost:** 4 marks.
      *   **Note:** This negates the analytical utility of the division, rendering the scheme meaningless.

  4.  **Importing path dependence or complexity theory as though it were exegesis of Braudel.**
      *   **Cost:** 3 marks.
      *   **Note:** The question requires analysis based on Braudel's text, not modern retrofits unavailable to the candidate.

  5.  **Charging Braudel with a determinism the texts do not obviously support.**
      *   **Cost:** 3 marks.
      *   **Note:** This misreads Braudel's nuance regarding human agency within structural constraints.
