answer: |-
  Here is the session plan. It is designed to be run on a whiteboard with markers.

  ### 1. The Setup (0–5 Minutes)
  **Goal:** Establish the rules without triggering the math defense mechanisms yet.
  **Action:** Draw two envelopes on the board. Label them **A** and **B**.
  **Script:**
  "I have two envelopes. One contains exactly double the amount of the other. You pick Envelope A. You open it. Inside is **$X**."
  "Write this down: You have **$X**. The other envelope has either **$2X** or **$X/2**."
  "Assume for a moment that both are equally likely. What is the expected value of Envelope B?"

  **Let them shout it out.** They will arrive at $1.25X$.
  **The Hook:** "So, on average, Envelope B is worth 25% more than Envelope A. Should you switch?"
  *(Most will say yes. Let them commit.)*

  ### 2. The Trap: Switching Blind (5–10 Minutes)
  **Goal:** Create the cognitive dissonance that makes them feel the paradox, not just hear it.
  **Action:** Erase the "$X" and close the envelope drawing.
  **Script:**
  "Okay, you've decided to switch. Now, imagine I stop you *before* you open Envelope A. You don't know the amount. It's just 'an envelope'."
  "Does the logic change? Is Envelope B still worth 25% more than Envelope A?"
  "If yes, then you should switch *without looking*. But if you switch without looking, you're just swapping two identical unopened envelopes. That can't add value."
  "So, opening the envelope created value out of thin air. How?"

  **Anticipated Misconception #1 (The Symmetry Clash):**
  Someone will say, "But they're symmetric, it shouldn't matter."
  **Response:** "Exactly. So why did the math say switch?"

  **Anticipated Misconception #2 (Your Pet Line):**
  Someone will say, "But once you hold it, it's *yours*. It's special."
  **Decision:** **Kill it.** Do not use this. It sounds like magic.
  **Prediction:** This is exactly when they will invent it (right here, during the "Switching Blind" debate).
  **Your Move:** When they say it, validate the intuition but correct the mechanism.
  **Script:** "It feels like holding it makes it special. But if I swapped the envelopes in my hands before you opened either, the math would be identical. It's not about *holding* it. It's about *knowing* the number. The number gives you information. The question is: what information?"

  ### 3. The Whiteboard Fix: The Finite Ladder (10–20 Minutes)
  **Goal:** Use a finite, concrete example where the "50/50" assumption visibly breaks.
  **Constraint Check:** You requested a finite list where the +25% argument goes wrong visibly.
  **The Price of Finiteness:** You must admit that the Game Master (the person filling the envelopes) has a **bias**. You cannot have a "truly random" finite set without weights. You have to trade "pure randomness" for "weighted probability."

  **Action:** Draw three rows on the board. These are the *only* possible pairs of envelopes the Game Master is allowed to use.
  1.  **Pair 1:** ($10, $20)
  2.  **Pair 2:** ($20, $40)
  3.  **Pair 3:** ($40, $80)

  **Script:**
  "To make this finite, let's say the Game Master only uses these three pairs. But here is the catch: He doesn't roll a die to pick them. He likes small numbers."
  "Write this down:
  *   Probability of Pair 1 is **1/2** (50%)
  *   Probability of Pair 2 is **1/4** (25%)
  *   Probability of Pair 3 is **1/4** (25%)"
  *(Note: These sum to 1. The specific weights are chosen to make the EV zero, see below.)*

  **The Test Case:**
  "Imagine you open your envelope and see **$20**."
  "The naive argument says: 'The other envelope is either $10 or $40. It's 50/50. Expected value is $25. Switch!'"
  "Let's check if it's actually 50/50."

  **The Calculation (Do this live on the board):**
  1.  "How often do we see $20 total?"
      *   From Pair 1 ($10, $20): Half the time. So $1/2 \times 1/2 = \mathbf{1/4}$.
      *   From Pair 2 ($20, $40): Half the time. So $1/4 \times 1/2 = \mathbf{1/8}$.
      *   Total chance of seeing $20 = 1/4 + 1/8 = \mathbf{3/8}$.
  2.  "Given you see $20, what are the odds you're in Pair 1 vs Pair 2?"
      *   Odds of Pair 1: $(1/4) / (3/8) = \mathbf{2/3}$.
      *   Odds of Pair 2: $(1/8) / (3/8) = \mathbf{1/3}$.
  3.  "So it is **NOT** 50/50. It is **2/3** chance the other is $10, and **1/3** chance the other is $40."
  4.  "Now calculate the Expected Value of switching:"
      *   $2/3 \times \$10 + 1/3 \times \$40 = \$20$.
      *   "Your current envelope is $20. The other is worth... $20."
      *   "**Zero gain.**"

  **The Visual Break:**
  Circle the "50/50" assumption on the board and draw a crack through it.
  "The naive calculation wasn't wrong algebra. It was wrong **history**. It assumed every pair was equally likely. Once you fix the probabilities, the 25% gain vanishes."

  **Anticipated Misconception #3 (The Boundary):**
  Someone will ask: "What if I see $80?"
  **Response:** "Then you know you're in Pair 3. The other is $40. You definitely lose by switching."
  "This is the price of the finite model. The '50/50' lie works in the middle, but the losses at the top boundary cancel out the gains in the middle."

  ### 4. The Wrap Up (20–30 Minutes)
  **Goal:** Solidify the learning and set boundaries.

  **The "Out of Scope" Announcement:**
  "I am not going to explain the **Infinite Version** today. In the infinite version, you can construct a distribution where switching *is* actually beneficial for every specific number you see, yet the total average is still zero. That requires calculus and measure theory to resolve without breaking your brain. We are staying on the finite ladder."

  **The Final Check Question:**
  Do not ask "Does anyone have questions?" (They will just be tired).
  Ask this:
  "I change the rules. The Game Master now picks Pair 1 and Pair 2 with **equal probability** (50% each). You open your envelope and see **$20**."
  "**Do you switch?**"

  *   **Wrong Answer:** "No, because paradox." (They didn't learn the math).
  *   **Wrong Answer:** "Yes, because 1.25x." (They ignored the finite fix).
  *   **Right Answer:** "Yes, because if the pairs are equal, the 50/50 assumption *is* true for $20, so the EV *is* $25."
      *   *(Wait, let them sit with that).*
      *   "But wait, if everyone switches on $20, who loses?"
      *   "The people who see $40. They lose enough to balance your gain."

  **Why this question works:** It proves they understand that the "50/50" assumption isn't inherently evil; it's only evil when it contradicts the actual distribution. It shifts their focus from "The Paradox" to "The Distribution."

  ### Summary of Dependencies
  1.  **Naive Math** must happen first so they feel the pull of the 25%.
  2.  **Switching Blind** must happen second to break the symmetry intuition.
  3.  **Pet Line** will arise during Switching Blind; kill it immediately to prevent mysticism.
  4.  **Finite Ladder** must come after they agree that "information" is the key variable.
  5.  **Weighted Probabilities** are required for the Finite Ladder to work; you cannot use uniform probabilities or the interior math stays "correct."
  6.  **Final Question** tests if they understand *why* the math broke (the weights), not just *that* it broke.

  ### Cheat Sheet for the Whiteboard
  *   **Left Side:** The Naive Math ($0.5 \times 2X + 0.5 \times 0.5X = 1.25X$).
  *   **Right Side:** The Finite Ladder (3 Pairs, Weights 1/2, 1/4, 1/4).
  *   **Center:** The Calculation for seeing $20 (Show the 2/3 vs 1/3 split).
  *   **Bottom:** The Final Question (Equal weights, see $20).
