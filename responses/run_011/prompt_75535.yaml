answer: |-
  **The Scenario**

  A philanthropist mails 20 participants identical forms. If exactly one form arrives by noon, that sender wins $1 billion; otherwise, all receive $0. Mailing costs nothing. Inside each envelope is a unique integer from 1 to 20, randomly permuted; each sees only their own. The permutation method is common knowledge. Participants cannot communicate. Returns are postmarked noon tomorrow.

  ***

  **1. The Dominance Check**
  For any player $i$, the payoff for mailing is $1B if no one else mails, $0 otherwise. The payoff for not mailing is always $0. Since $1B > $0, mailing weakly dominates silence for a causal expected-value maximizer, assuming no causal link to others. If all 20 follow this dominance argument, 20 forms arrive, and everyone gets $0.
  Causal Decision Theory (CDT) *permits* this disaster, but does it *predict* it? CDT selects dominant strategies. Since mailing is dominant regardless of others' probabilities (provided $P(others=0) > 0$), CDT predicts universal mailing. This makes the scenario a counterexample to CDT's sufficiency: CDT identifies the locally rational act that guarantees global failure, ignoring the coordination information available in the envelopes.

  **2. The Superrational Analysis**
  The superrational strategy is "Mail if and only if your number is 1." Since the numbers are a unique permutation, exactly one person holds the 1. Exactly one form arrives. The prize is won.
  However, "Mail iff your number is $k$" works for any $k \in \{1...20\}$. Superrationality demands identical reasoning functions, but does not inherently select *which* function among the winning set. It must borrow "1" from Schelling focal points (salience of the smallest integer). Superrationality supplies the coordination mechanism (identical reasoning), but human psychology supplies the specific coordinate. Without the focal point, superrationality stalls on symmetry.

  **3. The Evidential Decision Theory Check**
  EDT peels off. EDT asks: "What does my mailing evidence about the world?" If I assume my reasoning is evidentially correlated with others (the superrational premise), then mailing evidences others mailing *unless* I condition on the number. If I see '1' and mail, does that evidence others mailing? Only if others also see '1' (impossible) or use different logic.
  Verdict: Standard EDT fails because it lacks the logical correlation assumption. EDT *plus* the superrational assumption succeeds. EDT alone treats others' actions as fixed evidence unrelated to my algorithm, leading it back toward the CDT disaster.

  **4. Two Removal Tests**
  (a) **Replacement:** If numbers are drawn with replacement, multiple people may hold '1'. The probability exactly one person holds '1' is $20 \times (1/20) \times (19/20)^{19} \approx 37\%$. Hofstadter's mixed strategy ($p=1/20$) yields the exact same probability formula. They are secretly the same move: randomization. The unique permutation is the only thing enabling deterministic coordination.
  (b) **$5 Voucher:** If mailing yields a guaranteed $5 regardless of the prize:
  *   CDT: Mail (dominant).
  *   Superrational: Coordinate on '1' (Expected share $50M > $5).
  *   Verdict: Superrationality still contributes. It overrides a local dominant payoff for a global cooperative maximum, proving it isn't just about avoiding zero-sum collisions.

  **5. The Load-Bearing Feature**
  The exclusivity of the private signals converts a symmetric coordination problem into an asymmetric game with a unique Nash Equilibrium.

  **6. The Honest Verdict**
  A correlation device has done all the work. The envelopes function as a physical correlator, transforming the game structure so that "Mail iff 1" is a standard Nash Equilibrium. Superrationality is merely the subjective recognition of this Correlated Equilibrium. Plain game theory redescribes the outcome with nothing left over; superrationality earns no distinct keep here.

  **7. The Strongest CDT Attack**
  Attack: "You changed the game. With private signals, 'Mail iff 1' is a strict best response for the holder of 1, given others play the same. CDT agents play Nash Equilibria. Therefore CDT solves this without superrationality."
  Does it land? Yes. It proves the failure wasn't CDT's fault, but the initial framing. However, it concedes that CDT requires equilibrium selection (focal points) to work. If focal points are allowed for CDT, superrationality is redundant. If focal points are excluded, CDT fails. The attack lands, but only by admitting CDT needs external help to select the equilibrium.
