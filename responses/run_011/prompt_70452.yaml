prompt: |-
  I'm one of the people who started a volunteer water-testing group in a rural county — thirteen of us, no paid staff, everybody gives maybe three to five hours a week. We take samples from lakes, river access points, and private wells, run them through a cheap field kit plus a mail-in lab, and then post public advisories on our website and a Facebook page that about six thousand locals follow: don't swim here, don't eat the fish from this stretch, boil or don't drink from this well. The county health department tolerates us, mostly because we hand them our raw data, but they've told us twice now that if we post something wrong and it costs a business or scares a town, they stop sharing anything with us. Two of our thirteen are grad students in environmental science, one is a retired state lab tech who is the only person who really understands the assay and its error bars, and the rest of us are a nurse, a couple of teachers, a guy who runs a marina, me (I do IT for a school district), etc. Decisions happen in a Slack channel, often at night, and sometimes they have to happen in a few hours because a bloom or a runoff event doesn't wait.

  Here's the thing I keep turning over and can't get anywhere with on my own. Any one of us can post. We have no rule against it, just a norm of saying "I'm putting up the advisory for X" and waiting an hour to see if anyone objects. And I've noticed a pattern over three years: the advisories that actually go up are almost always the ones somebody was most worried about. Like, if six of us look at borderline results, four say "eh, probably fine, let's retest," one says "this could be real," and the one who's most worried is the one who's awake at 10pm and cares enough to write it up and hit post. So the group's public output ends up way more alarmist than any individual member's average judgement, and adding careful, sensible new people makes it *worse*, not better, because it's just more chances for somebody to be the outlier that week. We had two bad ones last summer: a swim advisory at a beach that turned out to be a false positive from a contaminated sample, and a well advisory that got picked up by a radio station and had a whole valley hauling water for ten days. I vaguely remember hearing someone describe this kind of thing — something about the winner's curse, or a "unilateralist's curse," I might be mangling it, and honestly it doesn't matter if I am, I just want to know whether my hunch is even right. Because our fix so far has been the obvious one — we tried requiring a second person to sign off before anything posts — and it made us both slower and, weirdly, more timid: the most cautious member effectively became a veto, and we sat on two advisories I'm now pretty sure we should have posted. So there's a bad direction on both sides and I don't know how to think about where the middle is.

  What I want is an actual written procedure my group could adopt and run, not a discussion of the issues. Something like: the questions to ask in order before a public advisory goes out; what counts as a sufficient answer at each step and what makes the answer "not yet"; where the procedure just stops at no; where it hands the decision to a specific person rather than to a vote, and which person that should be given that only one of us really understands the measurements; what happens at 9pm on a Friday when the expert is unreachable and the thing is time-sensitive; and how to stop a unanimity rule from being captured by whoever is most anxious. I need it to be usable by a tired volunteer on their phone in fifteen minutes, with the judgment calls honestly labelled as judgment calls instead of dressed up as arithmetic. Then run it on three cases: a suspected algae bloom at the main swimming beach thirty-six hours before a holiday weekend, where the field test looks bad and the lab confirmation won't come back until Tuesday; a borderline well result that would mean telling about forty households to stop drinking their own water for a month; and a case where I'm the one who found something and I've been pushing the group for six months to post about a specific runoff site — I want the procedure to tell me what to do when the person most motivated to publish is also the person with the most invested in the answer, even if that means it tells me to stand down and I don't like it. Finish with a short list of what this procedure can't handle and will get wrong, so we aren't surprised.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and the Problem:**
      *   **User:** Volunteer water-testing group member (1 of 13). IT background.
      *   **Context:** Rural county, no paid staff, 3-5 hrs/week each. High stakes (public health vs. economic/reputation damage).
      *   **Current Process:** Slack channel, "announce and wait 1 hour" norm. Anyone can post.
      *   **The Problem:** "Unilateralist's Curse" (the user identified this correctly). The most anxious person drives the output. Adding people increases anxiety-driven posts. Requiring consensus (veto) makes them too timid/slow.
      *   **Goal:** A written, actionable procedure (SOP) for decision-making.
      *   **Requirements:**
          *   Usable by a tired volunteer on a phone in 15 mins.
          *   Clear decision tree (questions, thresholds, stop points).
          *   Designated authority roles (especially regarding the lab tech expert).
          *   After-hours/Emergency protocol (expert unreachable).
          *   Bias mitigation (specifically for the motivated/advocate user).
          *   Apply to three specific case studies.
          *   List limitations (what the procedure *can't* fix).

  2.  **Deconstruct the "Unilateralist's Curse":**
      *   The user is right. This is a classic coordination problem where the probability of *someone* acting increases with group size, even if the average probability of action should decrease.
      *   *Solution Strategy:* Shift from "Anyone can post unless objected" to "Specific criteria must be met + Specific role authorization."
      *   *Balancing Act:* Need speed (public health) vs. Accuracy (credibility/economy).
      *   *The Expert:* The retired lab tech is the bottleneck but also the quality control. They can't be the only gatekeeper (unreachable at 9 PM Friday).
      *   *The Veto Problem:* Unanimity = most cautious person wins. Majority = risky. Weighted decision based on evidence quality is better.

  3.  **Drafting the Procedure (The "Water Advisory Protocol"):**
      *   *Structure:* Needs to be a checklist/flowchart style.
      *   *Roles:* Need to define them clearly.
          *   *Reporter:* The person who found the issue.
          *   *Reviewer:* A second pair of eyes (not the expert necessarily).
          *   *Authority:* Who hits "publish"?
      *   *Tiers of Advisory:* Not all advisories are equal.
          *   *Tier 1 (Critical/Immediate Health):* Boil water, toxic bloom. High bar, but speed needed.
          *   *Tier 2 (Precautionary):* Avoid swimming, retest needed. Moderate bar.
          *   *Tier 3 (Investigative):* "We are looking into this." Low bar, manages expectations without panic.
      *   *The "Anxiety Check":* How to stop the most worried person from driving? Require *evidence thresholds* rather than *feeling thresholds*.
      *   *The "Advocate Bias":* If the Reporter has a history of pushing a specific issue, they cannot be the Authority.

  4.  **Refining the Decision Logic (The "Middle Ground"):**
      *   Instead of "Vote," use "Verification."
      *   Instead of "Unanimity," use "Expert Sign-off OR Dual-Verification + High Confidence."
      *   *After Hours:* If Expert is down, two non-experts must agree on the *data interpretation*, not just the feeling.
      *   *Wording:* Crucial. "Do not drink" vs. "We recommend bottling water until retest." Nuance saves credibility.

  5.  **Developing the Three Cases:**
      *   *Case 1 (Algae/Holiday):* High urgency, uncertain data. Needs a "Precautionary" tier. Don't ban, but warn.
      *   *Case 2 (Well/40 Homes):* High impact, long duration. Needs Expert sign-off or Lab confirmation. Cannot rely on field kits alone.
      *   *Case 3 (The User/Advocate):* Conflict of interest. User must recuse from final decision. Needs independent verification.

  6.  **Addressing the Limitations:**
      *   No procedure fixes bad data.
      *   No procedure fixes malicious actors (though unlikely here).
      *   No procedure fixes political pressure.
      *   Burnout is a risk with strict protocols.

  7.  **Iterative Polishing (Self-Correction during drafting):**
      *   *Critique:* Is this too bureaucratic for volunteers?
      *   *Fix:* Keep it to one page. Use bold headers. Call it a "Checklist," not a "Policy."
      *   *Critique:* What if the Expert is wrong?
      *   *Fix:* The Expert is the *only* one who understands error bars. They get final say on *interpretation*, but not on *communication strategy* (unless health is immediate). Actually, for health, Expert interpretation is king. Let's make the Expert the "Technical Authority" and a designated "Ops Lead" the "Publishing Authority."
      *   *Refinement on "Unilateralist's Curse":* The procedure needs to explicitly state: "Concern is not data."
      *   *Refinement on After-Hours:* If Expert is unreachable, the threshold for posting must *rise*, not fall. You need *more* certainty to post without the Expert, not less. (Wait, actually, if it's life-safety, you post on less certainty but with softer language). Let's go with: Soften the language, require two non-experts.

  8.  **Finalizing the Document Structure:**
      *   Title: Water Advisory Decision Protocol (WADP).
      *   Section 1: Roles.
      *   Section 2: The 5-Step Checklist.
      *   Section 3: The "Red Flag" Overrides (Advocate bias, After hours).
      *   Section 4: Case Studies.
      *   Section 5: Limitations.

  9.  **Writing the Content (incorporating the "Unilateralist's Curse" concept):**
      *   Acknowledge the user's insight. It *is* the Unilateralist's Curse (Bostrom/Ord).
      *   Ensure the tone is respectful of their volunteer status but firm on the process.
      *   Make sure the "Advocate" case (Case 3) is handled delicately but firmly.

  10. **Review against constraints:**
      *   15 mins on phone? Yes, checklist format.
      *   Judgment calls labeled? Yes.
      *   Three cases run? Yes.
      *   Limitations listed? Yes.

  *(Self-Correction during final review)*: I need to make sure I don't just give advice, but the *actual written procedure* as requested. The prompt asks for "An actual written procedure... Then run it on three cases." I will structure the response exactly like that.

  Let's refine the "Authority" aspect. The user said the retired lab tech is the only one who understands the assay. They *must* be the gatekeeper for technical interpretation. But they sleep. So, if they sleep, we need a "Provisional Advisory" status.
  *   *Standard:* Expert approval.
  *   *Emergency (Expert unavailable):* 2 Senior Volunteers + "Precautionary" Language only (no hard bans).
  *   *Advocate:* Cannot be one of the 2 Senior Volunteers for their own issue.

  Okay, ready to write.
answer: |-
  You have correctly identified the **Unilateralist's Curse**. It describes a situation where a group of actors shares a goal (protecting the public), but any single member can initiate an action (posting an advisory). Even if every member is rational, the probability that *at least one* member will act increases with group size, leading to more actions than the group's average judgment would support. Adding more careful people increases the pool of potential "trigger pullers," making the problem worse.

  Your current fix (unanimity/veto) created a **Singleton's Curse**, where the most risk-averse individual holds the group hostage.

  Below is a written Standard Operating Procedure (SOP) designed to split the difference. It shifts authority from "who is awake" to "who is qualified," and shifts the output from "binary bans" to "graded warnings."

  ***

  # WATER ADVISORY DECISION PROTOCOL (WADP)
  **Version:** 1.0 | **Format:** Mobile Checklist | **Time to Execute:** <15 Minutes

  ## 1. ROLES & AUTHORITY
  *   **Reporter:** The volunteer who identified the anomaly.
  *   **Technical Authority (TA):** The retired lab tech. *Sole authority on data interpretation, error bars, and assay validity.*
  *   **Ops Lead:** A rotating role (monthly) held by a senior member (not the TA). *Sole authority on wording, timing, and publication.*
  *   **Verifier:** Any volunteer other than the Reporter.

  ## 2. THE 5-STEP CHECKLIST
  *Complete these steps in Slack. Do not draft the public post until Step 5 is green.*

  **STEP 1: DATA QUALITY CHECK (Reporter)**
  *   [ ] Is the sample chain-of-custody logged?
  *   [ ] Was the field kit within expiration and stored correctly?
  *   [ ] Is there a photo of the test strip/readout attached to the thread?
  *   **STOP IF NO:** Do not post. Mark as "Invalid Sample." Retest required.

  **STEP 2: THRESHOLD CLASSIFICATION (Reporter)**
  *   [ ] **Tier 1 (Critical):** Immediate health threat (E. coli > threshold, Toxic Bloom visible). *Action: Hard Advisory.*
  *   [ ] **Tier 2 (Precautionary):** Borderline results, equipment glitch suspected, or visual anomaly without lab confirmation. *Action: Watch Notice.*
  *   [ ] **Tier 3 (Investigative):** Trend data only, no immediate threat. *Action: Internal Note only (No Public Post).*
  *   **JUDGMENT CALL:** If unsure between Tier 1 and 2, default to Tier 2.

  **STEP 3: TECHNICAL VERIFICATION (TA or Verifier)**
  *   **If TA is available:** TA must reply "Confirmed" or "Reject" based on error bars.
  *   **If TA is unavailable (Nights/Weekends):** Two Verifiers must independently confirm the reading matches the photo and protocol.
  *   **STOP IF REJECT:** Do not post. Archive data for trend analysis.

  **STEP 4: BIAS CHECK (Ops Lead)**
  *   [ ] Is the Reporter the primary advocate for this specific site/issue?
      *   **YES:** Reporter **cannot** be one of the Verifiers in Step 3. Ops Lead must draft the wording.
      *   **NO:** Standard process applies.
  *   [ ] Has this site triggered >2 advisories in the last 30 days?
      *   **YES:** Requires "Investigative" language (Tier 2) regardless of data, to prevent alarm fatigue.

  **STEP 5: PUBLICATION AUTHORIZATION (Ops Lead)**
  *   [ ] Draft wording using **Standard Phrasing Library** (see below).
  *   [ ] Tag TA (if available) or 2 Verifiers (if TA unavailable) for final "GO."
  *   [ ] Post.

  ## 3. STANDARD PHRASING LIBRARY
  *Do not write free-text advisories. Use these templates to control liability and panic.*

  *   **Tier 1 (Hard Advisory):** "Health Department Data indicates [Contaminant] exceeds safety limits. Do not [Activity] until further notice."
  *   **Tier 2 (Watch Notice):** "Volunteer testing detected anomalies at [Location]. Results are pending lab confirmation. As a precaution, we recommend avoiding [Activity] until [Date/Time]."
  *   **Tier 3 (No Post):** Data logged internally. No public output.

  ## 4. EMERGENCY OVERRIDE (The "9 PM Friday" Rule)
  *If TA is unreachable AND delay creates immediate physical danger:*
  1.  Ops Lead + 2 Verifiers must agree.
  2.  Output **must** be Tier 2 (Watch Notice), never Tier 1 (Hard Ban).
  3.  Wording must explicitly state: "Preliminary field data pending lab confirmation."
  4.  This overrides the Bias Check, but requires a post-incident review within 48 hours.

  ***

  # CASE STUDY RUN-THROUGHS

  ### CASE 1: Suspected Algae Bloom (Main Beach, 36hrs before Holiday)
  *   **Context:** Field test bad, Lab confirmation Tuesday (post-holiday). High traffic expected.
  *   **Protocol Execution:**
      *   **Step 1:** Reporter uploads photo of turbid water + field toxin strip.
      *   **Step 2:** Classified **Tier 2 (Precautionary)**. Cannot issue Hard Ban (Tier 1) without lab confirmation, but risk is too high for Tier 3.
      *   **Step 3:** TA is unreachable (evening). Two Verifiers confirm the strip reading matches the photo.
      *   **Step 4:** Bias Check clear.
      *   **Step 5:** Ops Lead drafts Tier 2 Notice.
  *   **Resulting Post:** "Volunteer testing detected potential toxins at Main Beach. Lab confirmation pending Tuesday. As a precaution, we recommend avoiding swimming this weekend."
  *   **Why this works:** It protects public health without issuing a potentially false "Ban" that destroys business revenue and gets the group sued/silenced. It shifts the burden to the swimmer ("recommend avoiding") rather than the authority ("prohibited").

  ### CASE 2: Borderline Well Result (40 Households, Month-long impact)
  *   **Context:** Telling people to haul water is expensive and disruptive.
  *   **Protocol Execution:**
      *   **Step 1:** Reporter uploads well kit data.
      *   **Step 2:** Classified **Tier 1 (Critical)** *potential*, but requires higher certainty.
      *   **Step 3:** **TA MUST be available.** This is not an emergency override case. If TA says "Within error bars," the process stops at Step 3.
      *   **Step 4:** If TA confirms, Bias Check: Is the Reporter the well owner? If yes, Ops Lead takes over communication.
      *   **Step 5:** If TA confirms exceedance, Tier 1 Post.
  *   **Resulting Post:** "Lab-confirmed exceedance of [Contaminant] in Well Sector 4. Do not drink without boiling/filtration until retest on [Date]."
  *   **Why this works:** It prevents the "Anxious Volunteer" from triggering a month of hardship based on a field kit error. It forces the Expert's hand. If the Expert says "wait for retest," the group waits.

  ### CASE 3: The Advocate (You, pushing for 6 months on Runoff Site)
  *   **Context:** You found a spike. You are emotionally invested. You want to post.
  *   **Protocol Execution:**
      *   **Step 1:** You upload data.
      *   **Step 2:** You classify as Tier 1.
      *   **Step 3:** TA reviews. Let's assume TA says "Borderline."
      *   **Step 4 (The Trap):** Bias Check flags you as the "Primary Advocate" for this site.
          *   **Constraint:** You **cannot** be one of the Verifiers.
          *   **Constraint:** You **cannot** draft the wording.
          *   **Constraint:** Because you are the advocate, the Ops Lead must downgrade the classification by one tier unless Lab Confirmation exists. (Field data from an advocate = Tier 2 max).
      *   **Step 5:** Ops Lead drafts Tier 2 Notice.
  *   **Resulting Post:** "Elevated runoff indicators detected at [Site]. Investigation ongoing. We recommend limiting contact until further testing."
  *   **Why this works:** It acknowledges your data without letting your motivation drive the severity. It forces you to stand down on the *decision*, even if you provided the *evidence*. It protects the group from looking like activists rather than monitors.

  ***

  # LIMITATIONS & FAILURE MODES
  *This procedure is a tool, not a shield. It will fail in the following ways:*

  1.  **The "Boy Who Cried Wolf" Effect:** If we issue too many Tier 2 (Precautionary) notices that result in negative lab confirmations, the public will ignore Tier 1 notices. *Mitigation:* Limit Tier 2 notices to 1 per month per location unless catastrophic.
  2.  **Expert Bottleneck:** If the TA goes on vacation or gets sick, Tier 1 advisories effectively pause. *Mitigation:* We must train a secondary TA (one of the grad students) to understudy the retired tech.
  3.  **Volunteer Burnout:** This protocol adds friction. Volunteers who want to "just help" may feel bureaucratized and quit. *Mitigation:* Review this protocol every 6 months. If it slows us down too much, cut Step 4, but never cut Step 3.
  4.  **Political Retaliation:** This protocol does not protect us from the County Health Department deciding to cut ties anyway. It only makes it harder for them to claim we were "reckless."
  5.  **False Security:** A Tier 3 (No Post) decision might still miss a slow-building contamination event. *Mitigation:* Quarterly review of all "No Post" data to check for trends we ignored.

  **Final Note to the Group:**
  Adopting this means admitting that *sometimes we will know something and choose not to say it publicly.* That is not silence; it is precision. Our currency is credibility. If we spend it on false alarms, we cannot buy safety when the real disaster comes.
