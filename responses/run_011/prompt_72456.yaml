      "But if I lend you my car for a week, then take it back, I haven't killed you even if you starve without it," Blair said. "Ownership and entitlement determine whether the removal is permissible or harmful. In the hospital case, the committee reallocates resources. In the home case, the stranger steals. In the flood case, the city withdraws a public service. The causal motion of the hand is irrelevant. It's all about whether the victim had a claim to the continuation of aid."

      "And I say the hand matters," Alex said. "If I push you off a cliff, it's killing. If I refuse to throw you a rope, it's letting die. The Interrupted Samaritan is closer to pushing you off a cliff because I created the dependency. You're conflating the justification with the act type. I can be justified in killing—self-defense, say—but it's still killing. You're saying if I'm justified, or if you had no claim, it wasn't killing at all."

      "I'm saying the category itself is normative," Blair replied. "Killing isn't just 'cause death.' It's 'violate a claim not to be killed.' If there's no claim, there's no killing. Your causal account tries to stand outside normativity, but it can't. You had to appeal to 'barriers' and 'ongoing prevention' to save the guard and the flood cases. Those are normative distinctions disguised as physics."

      "And you're ignoring the moral weight of intervention," Alex said. "There is a real difference between making someone worse off than they would be versus leaving them as they are. My account captures that through causal initiation. Yours collapses it into entitlements. We agree on the Mara cases, but only because the entitlements and the causal structures align. In the Samaritan case, they don't. You see a return to baseline; I see a severance of a lifeline."

      "Then we're at a standoff," Blair said. "You see a metaphysical difference in the sequence of events. I see a moral difference in the relationship between agents."

      "And until we can explain why the Samaritan's withdrawal feels like murder without invoking rights," Alex said, "I'll stick with the causal chain."

      "And until you can explain why the guard's key turn isn't murder without invoking duties," Blair replied, "I'll stick with the baseline."

