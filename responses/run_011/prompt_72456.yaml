  "And you're ignoring the moral weight of intervention," Alex said. "There is a real difference between making someone worse off than they would be versus leaving them as they are. My account captures that through causal initiation. Yours collapses it into entitlements. We agree on the Mara cases, but only because the entitlements and the causal structures align. In the Samaritan case, they don't. You see a return to baseline; I see a severance of a lifeline."

  "Then we're at a standoff," Blair said. "You see a metaphysical difference in the sequence of events. I see a moral difference in the relationship between agents."

  "And until we can explain why the Samaritan's withdrawal feels like murder without invoking rights," Alex said, "I'll stick with the causal chain."

  "And until you can explain why the guard's key turn isn't murder without invoking duties," Blair replied, "I'll stick with the baseline."
