  # Norms of Choice Under Risk: Week 1 Sorting Quiz

  **Instructions:**
  Right then. Ten scenarios, ten decisions. Don't overthink the maths; the numbers are chosen to make the tension obvious, not to test your arithmetic. For each question, pick the **single** option that best matches what you would actually do.

  There are no "right" answers, only consistent ones. Don't worry about what theory you think you subscribe to—just answer as if your own money (or reputation) were on the line.

  ---

  ### The Setup
  For all questions, assume you have **£10,000** of liquid wealth. You have no debts, a secure income, and no immediate need for the cash.

  ### The Questions

  **1. The One-Off (Additive)**
  A colleague offers you a private bet. You stake a cash amount of your choice (up to £10,000). A biased coin is flipped (60% Heads, 40% Tails).
  *   **Heads:** You win an amount equal to your stake (you keep your stake + win the same again).
  *   **Tails:** You lose your stake.
  The bet happens once. Winnings are added to your bank account; losses are subtracted. No reinvestment.
  *   **A)** Bet everything (£10,000).
  *   **B)** Bet a specific fraction (e.g., 20% or £2,000).
  *   **C)** Decline the bet.

  **2. The Long Run (Multiplicative)**
  Same coin (60% Heads, 40% Tails). Same payoff (Heads double the stake, Tails lose the stake).
  However, you will play this game **100 times**. After each round, you must decide what fraction of your *current* total pot to stake on the next round. You can adjust the fraction each time, but you must pick a strategy now.
  *   **A)** Stake 100% of your pot every time.
  *   **B)** Stake a fixed fraction (e.g., 20%) every time.
  *   **C)** Stake nothing / Decline.

  **3. The Growth Trap**
  A different machine. 50% chance your investment becomes **1.5x** its value; 50% chance it becomes **0.6x** its value.
  You play this **100 times**, reinvesting your entire pot each time.
  *   **A)** Stake 100% of your pot every time.
  *   **B)** Stake a fraction (e.g., 25%) every time.
  *   **C)** Stake nothing / Decline.

  **4. The Ruin Risk**
  Back to the 60/40 coin (Heads double stake, Tails lose stake). You play **once**.
  However, if you lose this bet, you are declared bankrupt (credit score destroyed, career in finance over). You cannot borrow to recover.
  *   **A)** Bet everything (£10,000).
  *   **B)** Bet a small fraction (e.g., 10%).
  *   **C)** Decline the bet.

  **5. The Finite Horizon**
  Same as Question 2 (60/40 coin, 100 rounds, reinvest). But you know for a fact you will die immediately after the 100th round. No bequest motive; you want to maximise consumption in that final moment.
  *   **A)** Stake 100% every time.
  *   **B)** Stake 20% every time.
  *   **C)** Stake *more* than 20% (e.g., 30-40%), but not 100%.

  **6. The Correlated Risk**
  Same as Question 1 (One-off, 60/40, additive).
  However, your annual salary bonus depends on the same economic factor as this coin flip. If the coin lands Tails, your bonus is also cut by 50%.
  *   **A)** Bet everything.
  *   **B)** Bet a fraction.
  *   **C)** Decline (or hedge short).

  **7. The Agency Problem**
  You are managing a fund for 100 clients. They have hired you specifically because you are willing to take risks they aren't. Same as Question 2 (100 rounds, reinvest).
  If you go bust, you lose your job, but the clients only lose their money (which they can afford).
  *   **A)** Stake 100% (Maximise client EV).
  *   **B)** Stake 20% (Maximise survival/growth).
  *   **C)** Stake <10% (Protect your employment).

  **8. The Variance Aversion**
  Choose between two one-off additive bets:
  *   **Option X:** 100% chance to win £1,000.
  *   **Option Y:** 60% chance to win £2,000, 40% chance to win £0.
  (EV of X = £1,000. EV of Y = £1,200).
  *   **A)** Always take Y.
  *   **B)** Take X if the stakes were higher, Y as written.
  *   **C)** Always take X.

  **9. The Last Year**
  Same as Question 2 (100 rounds, reinvest). You are in the last year of your life. You have no heirs. Any money left at the end is burned.
  *   **A)** Stake 100%.
  *   **B)** Stake 20%.
  *   **C)** Stake increasing amounts as time runs out.

  **10. The Modeller's Choice**
  You observe two traders.
  *   **Trader A** always maximises the arithmetic average return (EV). Over 10 years, they are usually rich, but occasionally bust.
  *   **Trader B** always maximises the geometric average return (Growth). Over 10 years, they are consistently wealthier than A, but never the richest in the room.
  Who is behaving "rationally"?
  *   **A)** Trader A (they grab every positive opportunity).
  *   **B)** Trader B (they survive to compound).
  *   **C)** Neither (rationality depends on the agent's goals).

  ---

  ## Instructor's Key & Scoring

  ### Arithmetic Check (For Your Reference)
  *   **Q1, Q2, Q4, Q5, Q7, Q9 (60/40 Double/Lose):**
      *   **EV per round:** $0.6(2) + 0.4(0) = 1.2$ (+20%).
      *   **Growth Rate (Log):** $0.6 \ln(2) + 0.4 \ln(0) = -\infty$ (if 100% stake).
      *   **Kelly Optimal:** $f^* = p - q = 0.6 - 0.4 = 0.2$ (20%).
      *   **Growth at Kelly:** $0.6 \ln(1.2) + 0.4 \ln(0.8) \approx +0.02$ (+2% per round).
  *   **Q3 (50/50 1.5x/0.6x):**
      *   **EV per round:** $0.5(1.5) + 0.5(0.6) = 1.05$ (+5%).
      *   **Growth Rate (100% stake):** $\sqrt{1.5 \times 0.6} = \sqrt{0.9} \approx 0.95$ (-5% per round).
      *   **Kelly Optimal:** $\approx 25\%$ stake.
  *   **Q6 (Correlation):** EV remains +20%, but *utility* of wealth drops if Tails correlates with income shock.
  *   **Q8 (Variance):** EV(X) = 1000, EV(Y) = 1200. Variance(Y) > Variance(X).

  ### Scoring Patterns & Position Mapping

  Tally the student's choices. Look for the dominant pattern.

  | Position | Q1 (One-off) | Q2 (Repeat) | Q3 (Trap) | Q4 (Ruin) | Q5 (Finite) | Q10 (Meta) |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **EV Purist** | A (All) | A (All) | A (All) | A (All) | A (All) | A |
  | **Full Kelly** | B (Frac) | B (20%) | B (25%) | C (0%) | B (20%) | B |
  | **Frac-Kelly** | B (Low) | B (<20%) | B (<25%) | C (0%) | B (<20%) | B |
  | **Log-Utility** | B (Frac) | B (20%) | B (25%) | C (0%) | B (20%) | C/B |
  | **Ergodicity** | B (Frac) | B (20%) | B (25%) | C (0%) | B (20%) | B |
  | **Mean-Variance** | C/B | C/B | C | C | C/B | C |
  | **Samuelson** | B (Frac) | B (20%) | B (25%) | C (0%) | **C (>20%)** | B/C |
  | **Quietist** | *Varies* | *Varies* | *Varies* | *Varies* | *Varies* | **C** |

  *Note on Q1:* Log-Utility/Kelly agents bet fractionally on additive bets too (due to diminishing marginal utility of wealth), whereas EV Purists bet all-in.
  *Note on Q4:* Any position sensitive to "absorbing states" (Kelly, Ergodic, Log) must bet 0 or near-0. EV Purist bets All.
  *Note on Q5:* Samuelson argues that for finite $N$, the geometric mean is not the strict optimum; one should bet slightly *more* than Kelly to maximise expected utility of terminal wealth.

  ### Theoretical Space & Unoccupied Cells

  You asked to build the space before the leaves. Here is the 3D parameter space defined by your core hypothesis: **Repetition**, **Reinvestment**, **Absorbing State**.

  1.  **Repetition (One-off vs. Many):** Separates EV (indifferent) from Growth/Log (cautious on Many).
  2.  **Reinvestment (Additive vs. Multiplicative):** Separates EV (indifferent) from Kelly (critical distinction).
  3.  **Absorbing State (No vs. Yes):** Separates Kelly (cautious) from EV (indifferent).

  **Unoccupied Cells:**
  *   **"Accepts Ergodic Maths, Denies Normative Force":** You hypothesised this cell exists. In practice, this collapses into the **Quietist**. If a student agrees that the time-average growth is negative (Q3) but chooses to bet All-In (Option A) anyway, they are effectively an EV Purist who acknowledges the maths but rejects the norm. If they acknowledge the maths and bet Fractionally, they are a Kelly/Ergodic agent. There is no stable position that says "Time averages are physically real but I should ignore them for EV" without admitting they are an EV Purist.
  *   **"Risk Neutral on Wealth, Risk Averse on Ruin":** This is the **EV Purist with a Constraint**. They bet All-In on Q1 and Q2, but 0 on Q4. This is a live position (compliance/rule-based), but theoretically unstable (why is ruin special if utility is linear?).

  ### Indistinguishable Leaves

  **1. Log-Utility vs. Ergodicity (Peters)**
  *   **Verdict:** **Behaviourally Isomorphic** in this instrument.
  *   **Reason:** Both prescribe the exact same betting fractions (Kelly criterion) in Q2, Q3, and Q4. Both reject the All-In strategy in multiplicative games.
  *   **Advice:** You cannot separate these via choice alone. You must ask for *justification* in the discussion.
      *   *Log-Utility:* "I have a concave utility function over wealth."
      *   *Ergodicity:* "The ensemble average is physically meaningless for a single trajectory."
  *   **Action:** Group them together for Week 1. Use Week 2 (reading Ole Peters vs. standard EU texts) to force the split.

  **2. Full Kelly vs. Log-Utility EU Maximizer**
  *   **Verdict:** **Mostly Isomorphic**, diverges on Finite Horizon (Q5).
  *   **Reason:** A strict Log-Utility maximiser *is* a Kelly bettor in the infinite limit. However, in a finite horizon (Q5), a Log-Utility agent might deviate slightly from the asymptotic Kelly fraction to optimise terminal utility, whereas a dogmatic "Growth Rate" maximiser might stick to 20%.
  *   **Action:** Use Q5 to pry them apart. If they choose Option C (>20%) in Q5, they are likely Samuelson/Finite-Horizon EU maximisers. If they stick to B, they are asymptotic Growth maximisers.

  **3. The "Blob" Warning**
  You worried half the cohort will end up in one undifferentiated blob. The most likely blob is **Kelly / Log-Utility / Ergodic**.
  *   **Why:** They all answer B on the core questions.
  *   **Fix:** Don't try to split them in Week 1. Use the quiz to separate the **EV Purists** (Group 1) from the **Growth/Utility/Time** cluster (Group 2). Then, within Group 2, run a debate on *why* they chose B. The friction between "It's my preference" (Log) and "It's the physics" (Ergodic) is where the term's philosophy lies.

  ### Final Note on Samuelson
  Paul Samuelson's objection (that maximizing geometric mean doesn't maximize expected utility for finite $N$) lands on **Q5**.
  *   If a student answers **B (20%)** on Q5, they treat the Geometric Mean as a normative requirement (Ergodic/Dogmatic Kelly).
  *   If they answer **C (>20%)**, they are treating Geometric Mean as an approximation for EU (Samuelson/Standard EU).
  *   This is the only behavioural lever you have to separate "Growth is Truth" from "Growth is a Proxy for Utility."

  Good luck with the group. If half of them bet everything on Q3, you've got your work cut out for you.
