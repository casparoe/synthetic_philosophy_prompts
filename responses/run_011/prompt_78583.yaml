          *   Standard finance: "Return of 1.6x" means Total = 1.6 * Stake.
          *   If I bet fraction $f$. Wealth becomes $1 + f(1.6-1) = 1 + 0.6f$ on Heads.
          *   Wealth becomes $1 + f(0.6-1) = 1 - 0.4f$ on Tails.
          *   Kelly Max: $0.5 \ln(1+0.6f) + 0.5 \ln(1-0.4f)$.
          *   Derivative at 0: $0.5(0.6) - 0.5(0.4) = 0.1$. Positive.
          *   So Kelly bets > 0.
          *   To get Kelly = 0, I need $p(b) - q(a) \le 0$.
          *   Let's try: Heads 1.3x, Tails 0.5x. (50/50).
          *   EV: $0.9$. Negative.
          *   Let's try: Heads 1.5x, Tails 0.5x. (50/50).
          *   EV: $1.0$.
          *   Let's try: Heads 1.6x, Tails 0.5x. (50/50).
          *   EV: $1.05$.
          *   Kelly: $0.5(0.6) - 0.5(0.5) = 0.05$. Positive.
          *   Okay, it is mathematically difficult to get EV > 1 and Kelly = 0 with simple 50/50 multiplicative bets unless the downside is very severe relative to the upside probability.
          *   Example: 90% chance 1.1x, 10% chance 0.1x.
          *   EV: $0.99 + 0.01 = 1.0$.
          *   Let's use a specific "Growth Trap" gamble known in literature.
          *   *The 10% Ruin Risk:* 90% chance +20%, 10% chance -100% (Ruin).
          *   EV: $0.9(1.2) + 0.1(0) = 1.08$.
          *   Growth: $-\infty$ (due to ruin).
          *   Kelly: 0 (because of absorbing state).
          *   EV Max: All-in.
          *   *This works for Q4 (Ruin).*
          *   For Q3 (Repeated, No Ruin, Negative Growth):
          *   I need $E[X] > 1$ and $E[\ln X] < 0$.
          *   Let's use: 50% chance 1.5x, 50% chance 0.6x.
          *   EV: 1.05.
          *   Log: $0.5 \ln 1.5 + 0.5 \ln 0.6 = 0.202 - 0.255 = -0.053$.
          *   Kelly Fraction: Maximize $0.5 \ln(1 + 0.5f) + 0.5 \ln(1 - 0.4f)$.
          *   FOC: $\frac{0.25}{1+0.5f} - \frac{0.2}{1-0.4f} = 0$.
          *   $0.25(1-0.4f) = 0.2(1+0.5f)$.
          *   $0.25 - 0.1f = 0.2 + 0.1f$.
          *   $0.05 = 0.2f \Rightarrow f = 0.25$.
          *   So Kelly bets 25%. EV bets 100%.
          *   This distinguishes them (Full vs Fractional), but doesn't force Kelly to 0.
          *   *Decision:* I will use the 1.5x/0.6x gamble for Q3. It distinguishes EV (All-In) from Kelly (25%). That's enough separation.

      *   *Final Plan:*
          *   Q1: One-off, Additive (60/40 Double/Lose). EV Max = All. Kelly = All (since no compounding).
          *   Q2: Repeated, Multiplicative (60/40 Double/Lose). EV Max = All. Kelly = 20%.
          *   Q3: Repeated, Multiplicative (50/50 1.5x/0.6x). EV Max = All. Kelly = 25%.
          *   Q4: One-off, Multiplicative, Ruin (90% 1.2x / 10% 0). EV Max = All. Kelly/Log = 0.
          *   Q5-Q10: Nuance (Horizon, Correlation, Agency, Variance, Samuelson, Quietist).

      *   *Wait, Q1 Kelly:* If it's one-off additive, Log Utility implies Risk Aversion. So Log-Utility might bet <100% even in Q1. EV Max bets 100%. This separates EV from Log/Kelly immediately.
      *   *Correction:* Log-Utility on *Additive* bets? Usually Log-Utility is defined over *wealth*. If bet is additive £X, Wealth = $W+X$. $U(W) = \ln(W)$.
      *   Max $0.6 \ln(W+X) + 0.4 \ln(W-X)$.
      *   This will yield a fractional bet depending on $W$.
      *   So Q1 separates EV (All-In) from Log/Kelly (Fractional).
      *   Q2 separates EV (All-In) from Kelly (20%).
      *   This is good.

      *   *Ready to write.*
