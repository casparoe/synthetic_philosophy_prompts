      The player was genuinely harmed. The restored house is a metaphysical replica, not the original object, because digital persistence requires causal continuity, not merely structural fidelity.

      To deny this harm is to adopt a strict functionalist ontology of the virtual. On this view, digital objects are nothing over and above their current data structures and executable processes. Identity is synchronic; if the bits match, the object is the same. The server fault was merely a temporary interruption of state. When the backup reinstated the pattern, the object returned. The player's grief, on this account, is a category error—a psychological attachment to a specific token of a pattern, mistaken for the pattern itself. The market discount is merely irrational superstition, akin to preferring an original painting over a perfect forgery despite identical visual properties.

      However, this reductionism fails to capture the mode of existence virtual objects actually possess within persistent worlds. Virtual objects are not static data; they are events within a causal network. Their identity is diachronic, constituted by their genesis and their continuous history of interaction. A virtual house is not just a mesh of polygons; it is the sedimentation of four years of player agency, server interactions, and temporal endurance. When the server fault occurred, the causal chain sustaining that specific object was severed. The data ceased to be processed as that object.

      Here lies the crucial ontological distinction: the restored house does not have the same history as the original. It has a fresh history accompanied by an accurate record of the old one. The backup is a description of the past state, not the preservation of the past itself. Upon restoration, the system instantiates a new object that *inherits* the log of the previous one, but the causal link between the pre-fault moments and the post-restoration moments is broken. The original object died; the new object was born wearing the dead one's clothes. This is not a legal distinction dependent on Terms of Service, but a metaphysical fact about digital instantiation. Existence in a server environment is a continuous process of refreshment; when that process stops, the object ceases. Restarting the process creates a new instance.

      Consequently, the residual evidence tracks a metaphysical fact, not an illusion. The player's grief is a rational response to ontological loss. They did not lose access to a function; they lost the specific entity they co-constituted over time. Similarly, the market discount reflects the community's intuitive grasp of this discontinuity. In digital economies, provenance is not just marketing; it is identity. A "replica" status depresses value because the community recognizes that the restored house lacks the authentic causal lineage of the original. It is a copy, however perfect, and copies are ontologically distinct from originals.

      To argue otherwise is to claim that history is irrelevant to identity, reducing all objects to their immediate utility. But virtual worlds are valued precisely for their history and persistence. If history were irrelevant, the event log would be meaningless data. Because the log matters, the history matters. Because the history was broken, the object is not the same. The harm is real because the existence of the virtual object is tied to its uninterrupted temporal unfolding. The backup saved the information, but it could not save the existence.

      The restoration is a resurrection only in appearance. In reality, it is a replacement.

