answer: |-
  First, the honest answer to your nagging worry: **You are right.** "Transcendental argument" is not a single logical form like *modus ponens*. It is a family-resemblance term covering moves from Kant's conditions of experience to Strawson's conceptual analysis to Putnam's semantic externalism to Korsgaard's constitutivism. They share a rhetorical register ("X is a condition of the possibility of Y") but differ wildly in metaphysical commitment.

  If you hand out a sheet that pretends there is a single "TA shape," you will teach them to mimic the syntax without understanding the cost. Stroud's objection (1968) is the graveyard of these arguments: either you prove only that we must *believe* X (modest/psychological), or you illicitly slide into proving X is *true* (ambitious/metaphysical) by assuming verificationism.

  However, a triage sheet is still useful if its goal isn't "Is this a TA?" but rather **"Is this argument doing the specific work it claims to do, and does it know the price of that work?"**

  Below is the draft. It is designed to expose the *structure* and the *Stroud-gap*, not to verify truth. Following the sheet, I run your three sketches, and then I list the limitations and hidden judgment calls you asked for.

  ***

  # TRIAGE SHEET: THE "CONDITION OF POSSIBILITY" CHECK
  **Time:** 20 mins | **Goal:** Diagnose the shape of your argument, not its truth.

  ### Q1: THE ANCHOR (The "Cannot Give Up" Test)
  **Question:** What is the starting point (Y) that the antagonist cannot deny without self-stultification?
  *   **Pass:** The anchor is an activity or state the antagonist is *currently doing* or *necessarily engaged in* (e.g., speaking, thinking, deliberating, having experience). It is not merely something they *value* or *prefer*.
  *   **Fail:** The anchor is a contingent preference, a moral ideal, or something the antagonist can quit without ceasing to function (e.g., "doing science," "being a good person," "caring about truth").
  *   **Verdict:**
      *   **FAIL:** Stop. This is a pragmatic or moral argument, not transcendental.
      *   **PASS:** Proceed to Q2.

  ### Q2: THE LINK (The "No Alternative" Test)
  **Question:** Why is the conclusion (X) a *condition of the possibility* of the Anchor (Y), rather than just a cause or a useful tool?
  *   **Pass:** You can articulate why Y is *unintelligible* or *impossible* without X. It is not just that Y would be hard, expensive, or pointless without X.
  *   **Fail:** The link relies on "It would be useless to Y without X" or "We wouldn't want to Y without X." (This is pragmatic necessity, not transcendental necessity).
  *   **Verdict:**
      *   **FAIL:** Stop. This is a pragmatic argument wearing a costume.
      *   **PASS:** Proceed to Q3.

  ### Q3: THE TARGET (The "Stroud Gap" Test)
  **Question:** Does your conclusion claim that X is *true* (in the world), or only that we must *believe/take* X to be true?
  *   **Pass (Modest):** You claim only that the commitment/belief in X is unavoidable for us.
  *   **Pass (Ambitious):** You claim X is actually the case. **WARNING:** If you choose this, you must explain why the necessity of the *belief* guarantees the *fact*. (Do you assume verificationism? Do you rely on the nature of concepts?)
  *   **Fail:** You slide between "we must believe X" and "X is true" without noticing the switch.
  *   **Verdict:**
      *   **FAIL (Equivocation):** Stop. You are conflating psychology with metaphysics.
      *   **PASS (Modest):** Hand to Group. (Verdict: Valid shape, limited scope).
      *   **PASS (Ambitious):** Hand to Group. (Verdict: High risk. Group must stress-test the bridge from belief to fact).

  ### Q4: THE EXIT (The "Opt-Out" Test)
  **Question:** Can the antagonist escape the conclusion by abandoning the Anchor?
  *   **Pass:** No. The Anchor is inescapable (e.g., you cannot stop having experiences; you cannot stop using language to argue against language).
  *   **Fail:** Yes. The antagonist can say, "Fine, I stop doing Y," and walk away unscathed (e.g., "I stop deliberating," "I stop speaking").
  *   **Verdict:**
      *   **FAIL:** Stop. The argument is conditional, not transcendental.
      *   **PASS:** Proceed to Final Verdict.

  ### FINAL TRIAGE VERDICT
  *   **NOT A TA:** You failed Q1 or Q2. Your argument may be sound, but don't call it transcendental.
  *   **MODEST TA:** You passed all, but chose "Modest" in Q3. Bring it, but expect the group to ask if this satisfies your philosophical goals.
  *   **AMBITIOUS TA:** You passed all, chose "Ambitious" in Q3. Bring it. This is the danger zone. The group's job is to try to break the Link (Q2) or force you to defend the Target (Q3).

  ***

  # RUNNING THE SKETCHES

  ### Sketch A: Constitutivism about Reasons
  *   **Q1 (Anchor):** Deliberation. *Pass.* (Hard to argue against deliberation while deliberating).
  *   **Q2 (Link):** Deliberation *commits* one to there being reasons. *Pass.* (Conceptual claim, not pragmatic).
  *   **Q3 (Target):** "Committed to there being reasons" vs. "There *are* reasons." *Fail/Equivocation.* The sketch says the error theorist "cannot both deliberate and deny this." But does "this" mean the *existence* of reasons or the *commitment* to them? Most constitutivists slide here. If the conclusion is "Reasons exist," it's Ambitious. If "We must act as if reasons exist," it's Modest.
  *   **Q4 (Exit):** Can they stop deliberating? *Pass.* (Arguably inescapable for agents).
  *   **Verdict:** **AMBITIOUS TA (High Risk).**
  *   **Clinic Note:** The sheet flags the Stroud Gap. The student must defend why the *commitment* entails the *existence*. If they can't, the verdict downgrades to Modest TA (which might not refute the error theorist, only describe the deliberator).

  ### Sketch B: Putnam/Brain-in-a-Vat
  *   **Q1 (Anchor):** Using the word "vat" / expressing the hypothesis. *Pass.* (To argue it, you must state it).
  *   **Q2 (Link):** Reference requires causal connection. If BIV, no reference. *Pass.* (Relies on causal theory of reference, but structurally a condition of possibility).
  *   **Q3 (Target):** "Hypothesis is not coherently statable." *Pass (Modest/Ambitious Hybrid).* It claims a limit on *meaning* (conceptual), which entails a limit on *truth* (I cannot truly say I am a BIV).
  *   **Q4 (Exit):** Can I stop using language? *Pass.* (Not while arguing).
  *   **Verdict:** **AMBITIOUS TA.**
  *   **Clinic Note:** The sheet lets this through. The group's job is not to check the shape (which is good) but to attack Q2 (Is the causal theory of reference a necessary condition, or just a contingent theory we happen to hold?).

  ### Sketch C: Your Disagreement/Relativism Argument
  *   **Q1 (Anchor):** "Genuinely disagreeing." *Pass.* (The relativist is engaging in disagreement to argue against you).
  *   **Q2 (Link):** Disagreement requires shared standards for answerability. *Pass.* (Conceptual claim about what "disagreement" means).
  *   **Q3 (Target):** "Therefore there are standards shared across frameworks." *Ambitious.* You are moving from "We must presuppose shared standards to disagree" to "Shared standards exist."
  *   **Q4 (Exit):** Can the relativist stop disagreeing? *Fail/Risk.* The relativist can say, "I am not disagreeing with you; I am merely expressing my framework." If they retreat to "non-cognitive expression," the anchor dissolves.
  *   **Verdict:** **AMBITIOUS TA (Conditional).**
  *   **Clinic Note:** The sheet flags Q4. The argument works *only if* the relativist is forced into the position of making a truth-claim. If they retreat to "I'm just telling you my story," the transcendental pressure vanishes. The sheet doesn't kill C, but it forces you to defend why the relativist *must* be disagreeing rather than just narrating.

  ***

  # LIMITATIONS & HIDDEN JUDGMENT CALLS
  *(Put this on the back of the handout so they know where the bodies are buried)*

  **1. What this sheet CANNOT do:**
  *   **Verify Premises:** It cannot tell you if "Deliberation requires reasons" is actually true. It only checks if you *claim* it is necessary.
  *   **Solve Stroud:** It cannot bridge the gap between "We must believe X" and "X is true." It only forces you to admit which one you are claiming.
  *   **Detect Circularity:** If your Anchor secretly presupposes your Conclusion (e.g., defining "deliberation" as "tracking reasons"), the sheet might still mark it as a Pass.

  **2. Hidden Judgment Calls (Where the sheet is pretending to be neutral):**
  *   **Q1 (Inescapability):** Whether an activity is "inescapable" is often a substantive philosophical claim, not a neutral observation. (e.g., Is language inescapable? Is agency?) The sheet treats this as a binary check, but it's a debate.
  *   **Q2 (Necessity vs. Pragmatics):** The line between "unintelligible without" and "pointless without" is fuzzy. Many TAs are accused of being pragmatic arguments in disguise. The sheet asks *you* to decide, but you might be biased.
  *   **Q3 (Modest vs. Ambitious):** This is the biggest costume. Some philosophers argue that for certain concepts (like agency), the "belief" and the "fact" are the same thing (constitutivism). The sheet forces a distinction that some TAs explicitly reject. If a student argues "The fact just *is* the commitment," the sheet will flag it as Ambitious/High Risk, which might be a category error on the sheet's part.

  **3. The "Family Resemblance" Warning:**
  *   This sheet is built on a specific strand of TA (Anti-sceptical/Strawsonian/Korsgaardian). It might misfire on Hegelian or Phenomenological versions that don't rely on "conditions of possibility" in the analytic sense. If your argument is Continental, this sheet might tell you to stop when you should actually keep going.

  ***

  # FINAL ADVICE FOR THE CLINIC
  If a student brings Sketch C (yours), and the sheet flags Q4 (The Exit), do not treat that as a refutation. Treat it as the **battleground**. The value of the clinic isn't to confirm the argument is a "real TA," but to locate exactly where the antagonist can try to wiggle out.

  For C, the wiggle room is: "I am not disagreeing; I am translating."
  For A, the wiggle room is: "I am deliberating, but I know it's a fiction."
  For B, the wiggle room is: "My theory of reference is contingent."

  The sheet works if it turns the session from "Is this deep?" to "Where is the exit door?" If it does that, it's worth handing out. If it convinces them that passing the sheet makes the argument *true*, burn it.
