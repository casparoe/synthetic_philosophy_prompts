answer: |-
  Subject: Q&A prep for Aarhus

  Hi there,

  This is a fantastic opportunity, and honestly, the audience you describe is exactly the kind of room where this thesis could land really well provided you navigate the structuralist skepticism they will inevitably bring. Scandinavian sociologists are generally wary of culturalist explanations that ignore material conditions, and the economist in the room will be looking for identification strategies that you likely do not have. I have mapped out the eight objections you are most likely to face, ordered by how much damage they could do to your core argument if you mishandle them. I have woven the suggested replies and my own warnings about where you are on solid ground versus where you are bluffing directly into the flow here so you can read it through as a narrative strategy.

  The first objection, and the one with the most destructive potential, will come from the labour economist or a structurally minded sociologist who will argue that you are confusing norms with incentives. They will say that Nordic founders attribute success to luck because the tax structure and welfare state actually socialize the risk, so claiming personal merit is not just immodest but empirically wrong, whereas in the US the material stakes of individual action are higher. Your reply needs to be that while incentives matter, the norm persists even where incentives do not fully align, such as in cultural spheres or among elites who are shielded from taxes, and that the American founders face similar market risks yet still claim merit. You need to emphasize that attribution is a post-hoc cultural script, not a rational calculation of tax liability. I have to flag that this is where your reply is softest because you likely cannot disentangle the internalized norm from the external constraint with your current data, so if they push on causality you should admit that the two reinforce each other rather than claiming the norm is wholly independent.

  The second objection will come from a critical sociologist familiar with Bourdieu, who will suggest that this modesty norm is not an egalitarian mechanism but a strategy of elite distinction. They will argue that wealthy Danes use luck-talk to mask privilege and defuse class resentment, making the norm a tool of power rather than a constraint on success. This has real force because it turns your egalitarian finding into a critique of false consciousness. You should concede this point up front to buy credibility. Acknowledge that elites certainly use modesty to protect their status, but argue that the norm still functions as a constraint because even elites must perform it to maintain legitimacy, whereas in the US elites perform merit to maintain legitimacy. By conceding that it serves power, you disarm the critique while keeping your mechanism intact.

  The third objection concerns your method, specifically that interviews and obituaries are performative texts where social desirability bias is maximal, so you are measuring PR strategies rather than deep cultural norms. A methodologist in the room will ask how you know these people believe what they say rather than just saying what is polite. Your reply is that in sociology of culture, the performance is the reality; if the public script requires luck-talk, then that script governs behavior regardless of private belief. This is a standard culturalist defense and it is solid, but be careful not to dismiss the private belief question entirely, as these audiences care about internalization. You are slightly bluffing here if you claim the interviews prove internalization, so stick to the argument that the public rule is what sanctions behavior.

  The fourth objection will ask about outcomes, specifically whether this attribution rule actually reduces inequality or if it is just talk while wealth concentrates anyway. An inequality scholar will point out that Nordic wealth inequality is rising despite these norms, so what is the functional utility of your thesis? You need to pivot to legitimacy rather than distribution. Argue that the norm manages resentment and maintains trust in institutions even as inequality grows, which is distinct from actually reducing the Gini coefficient. This is a strong position because it aligns with the trust literature many of them work on, but be prepared for them to ask if legitimacy without material equality is actually a good thing, which leads into the normative critiques later.

  The fifth objection will come from the cultural historians who will challenge the validity of Janteloven as a framework, noting it is a literary construct from the 1930s that academics have reified into a social fact. They will argue you are building a thesis on a caricature. Your reply should be that regardless of its literary origin, it functions as a shorthand for a real set of sanctions in contemporary discourse, which your data demonstrates. This is safe ground provided you don't claim Sandemose invented the behavior, only that he codified a existing sentiment that remains operative.

  The sixth objection is conceptual, asking whether you are conflating luck with collective support. A sociologist might note that when a Dane says luck they often mean the welfare state or union support, which is structural, whereas American luck is random chance. They will argue you are coding two different things as the same attribution. You need to clarify that your coding scheme distinguishes between structural support and random chance, but that both function as external attributions versus internal merit. This is a technical defense and holds up if your codebook is rigorous, but if you lumped them together you will have to admit that limitation and argue that both serve the same function of de-centering the self.

  The seventh objection will be about globalization, suggesting that younger Nordic founders are increasingly Americanized and that your data might be capturing a generational lag rather than a national culture. This is less damaging because it accepts your premise but limits its scope. Your reply is that even among younger cohorts the pressure to acknowledge the collective remains higher than in the US, though you should admit convergence is happening. This is an easy concession that makes you look reasonable without hurting the core thesis.

  The eighth and final objection is about the definition of success, asking if you are comparing like with like given that the types of firms or industries might differ between the samples. This is the least damaging because it is a standard control question. Your reply is that you controlled for industry and size in your sampling, but even if not, the cultural script applies across sectors. You can handle this quickly.

  Regarding your overall strategy, the objections about incentives and elite masking have the most real force and threaten to reduce your cultural argument to epiphenomenal noise. I strongly recommend you concede the elite masking point early in your talk or during the first question to show you are not naive about power, which will make the room more receptive to the cultural mechanism. The one question you are hoping nobody asks, because it is the hardest to answer without new data, is whether this norm actually discourages high-risk innovation or if it simply changes how innovation is marketed. If asked, do not claim you know the effect on innovation rates; instead, argue that it changes the type of innovation that receives social support, shifting focus from disruptive individual heroes to incremental collective improvements. Stick to the cultural script argument and do not wander into economic performance claims where you lack evidence. Good luck in Aarhus, and trust that your framing of attribution rules rather than success limits will resonate with their interest in how norms sustain welfare states.

  Best,

  Your Assistant
