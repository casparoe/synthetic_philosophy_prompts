      *   More time for Debrief. The learning happens in the Debrief.

  7.  **Failure Modes:**

      *   *Altruism:* Students price at $1 to "help the group".
      *   *Fix:* Private payoffs. Remind them "Your grade/points depend on *your* score."
      *   *Communication:* They talk across tables.
      *   *Fix:* Proctoring.
      *   *Boredom:* Too much arithmetic.
      *   *Fix:* Pre-printed payoff tables.

  8.  **Limits:**

      *   Static game vs Dynamic investment.
      *   Certainty vs Probabilistic patents.
      *   Existence of components (ex ante vs ex post).

  9.  **Self-Critique:**

      *   *Critical Assumption:* That students will act as profit maximizers in the Fragmented regime. If they collude implicitly, the lesson fails.
