  # Seminar Game: The Three-Key Lock

  ## 1. Overview and Learning Objective
  **Title:** The Three-Key Lock
  **Time:** 105 Minutes
  **Cohort:** 24 Students (6 Tables of 4)
  **Core Lesson:** When complementary assets are owned separately, individually rational pricing can destroy the total value of the market, and no single owner has the incentive to unilaterally fix it.

  **Technical Labels Withheld:** *Anticommons, Patent Thicket, Complementary Goods, Cournot Equilibrium, Double Marginalization.* These are reserved strictly for the Debrief.

  ## 2. Game Architecture

  ### Roles (Per Table of 4 Students)
  1.  **The Integrator (1 student):** You have a design for a "Smart Device." You do not own the underlying technologies. You need access to all three Components to build the device. You sell the final device to the Market (Instructor).
  2.  **Component Owners (3 students):** You each own a critical technology (Component A, B, or C). The Integrator cannot build the device without a license from *all three* of you. You have zero cost to license your technology.

  ### Materials Per Table
  *   4 Role Cards (1 Integrator, 3 Owners).
  *   3 "Price Setting" slips per Owner (one for each round).
  *   1 "Production Decision" slip per Integrator.
  *   1 Payoff Table (laminated).
  *   Token currency (or point sheet).

  ### The Demand Schedule (Simplified)
  *   **Market Price:** The Instructor buys every functional Smart Device for **$12**.
  *   **Capacity:** The Integrator can produce up to **5 units** per round.
  *   **Production Rule:** The Integrator produces 5 units *only if* the Total License Cost (Price A + Price B + Price C) is **$12 or less**.
  *   **Failure Rule:** If Total License Cost is **$13 or more**, the Integrator produces **0 units**. (The market rejects the price).

  ---

  ## 3. The Three Regimes

  ### Regime 1: The Open Standard (15 Minutes)
  **Narrative:** "There are no property rights. Anyone can use the technology."
  **Rules:**
  1.  **Owners:** You have no right to charge. Your income is **$0**.
  2.  **Integrator:** You may produce freely. However, because there are no standards, there is **Insecurity**.
  3.  **The Cost:** Roll a 6-sided die. On a 1 or 2, the product fails (Value $0). On 3–6, it succeeds (Value $12).
      *   *Expected Value:* $8 per unit.
      *   *Simplification for Speed:* To avoid rolling dice every time, we fix the "Insecurity Tax" at **$4 per unit**.
      *   **Integrator Profit:** $12 (Revenue) - $4 (Tax) = **$8 per unit**.
  **Payoffs (per round, max production):**
  *   Integrator: $40 (5 units * $8).
  *   Owners: $0.
  *   **Total Table Welfare:** $40.

  *Instructor Note:* Run 1 round. Ask Owners: "Are you happy?" (No, you made nothing). Ask Integrator: "Are you happy?" (Yes, but you lost 33% of value to inefficiency). This makes property rights look attractive.

  ### Regime 2: Fragmented Rights (35 Minutes)
  **Narrative:** "The government grants patents. Each Owner now has the exclusive right to license their component."
  **Rules:**
  1.  **Owners:** You set a license price per unit (integer $0–$12). **You cannot talk to other Owners.** You write your price on a slip and hand it to the Integrator.
  2.  **Integrator:** You sum the three prices.
      *   If Sum ≤ $12: You produce 5 units. You keep ($12 - Sum) * 5. Owners get (Price * 5).
      *   If Sum ≥ $13: You produce 0 units. Everyone gets **$0**.
  3.  **Constraint:** You cannot "design around" the patents. You must buy all three.
  4.  **Rounds:** Run 3 rounds. Between rounds, Owners see the total outcome (Sold/Not Sold) but *still cannot talk to each other*. They can only see their own payoff.

  **The Trap (Calibration):**
  *   If Owners split the value evenly, they charge $4 each. Sum = $12. Integrator makes $0. Owners make $20 each.
  *   *Incentive to Deviate:* Owner A thinks: "If B and C charge $4, Total is $8. I can charge $5. Total $13. Integrator produces 0. I get 0."
  *   *Wait, that punishes deviation.* Let's adjust the incentive to ensure the crash is the likely Nash outcome for undergraduates.
  *   *Revised Incentive:* Owners are told: "Maximize your own points. The Integrator will produce as long as they make *non-negative* profit."
  *   *Psychological Anchor:* Students often anchor on "Half the value" or "A third."
  *   *If they anchor on $5:* Sum = $15. Crash.
  *   *If they anchor on $4:* Sum = $12. Integrator makes $0. Integrator may refuse to produce out of spite (behavioral economics).
  *   *Instruction to Integrator:* "You are a profit maximizer. If profit is $0, you produce." (Removes spite variable).
  *   *Instruction to Owners:* "Your component is essential. Without you, the value is $0." (Encourages hold-up).
  *   *Likely Outcome:* At least one Owner will try to capture more value (e.g., $5 or $6). Sum > $12. Market collapses. Payoff = $0.
  *   **Total Table Welfare:** $0. (Worse than Open Regime).

  ### Regime 3: Coordinated Pool (20 Minutes)
  **Narrative:** "The Owners realize the market is collapsing. They form a 'Patent Pool'."
  **Rules:**
  1.  **Owners:** You may now **talk to each other** before setting prices. You must set a *Joint Price*.
  2.  **Revenue Split:** Whatever total license fee you charge, you split it equally three ways.
  3.  **Integrator:** Same rules as Regime 2.
  4.  **Rounds:** Run 2 rounds.

  **The Solution:**
  *   Owners act as a monopolist. They know the choke point is $12.
  *   To ensure the Integrator produces, they set Total Price = $8 (leaving Integrator $4 profit).
  *   Total Revenue = $40. Split 3 ways = $13.33 per Owner. Integrator = $20.
  *   **Total Table Welfare:** $60. (Better than Open ($40) and Fragmented ($0)).

  ---

  ## 4. Minute-by-Minute Timeline

  | Time | Activity | Details |
  | :--- | :--- | :--- |
  | **00-10** | **Setup** | Distribute roles. Explain Market Value ($12) and Capacity (5 units). Emphasize: *No talking between Owners in Regime 2.* |
  | **10-25** | **Regime 1 (Open)** | Run 1 Round. Calculate points. **Key Question:** "Owners, do you want rights?" (Yes). "Integrator, was the tax fair?" (No). |
  | **25-60** | **Regime 2 (Frag)** | Run 3 Rounds. **Silence among Owners.** Collect price slips. Announce outcomes. Expect Round 1 or 2 to crash ($0). Keep playing to see if they learn (they won't, without communication). |
  | **60-80** | **Regime 3 (Pool)** | Allow Owner collusion. Run 2 Rounds. Expect recovery of market. |
  | **80-105** | **Debrief** | The core lesson. Map experience to theory. (See Section 6). |

  ---

  ## 5. Arithmetic Verification (For Instructor)

  **Scenario:** Regime 2, Round 1.
  *   **Owner A** sets price $5. (Thinks: "It's worth $12, I'll take a bit less than half.")
  *   **Owner B** sets price $4. (Thinks: "I'll be reasonable.")
  *   **Owner C** sets price $4. (Thinks: "I'll be reasonable.")
  *   **Total Cost:** $13.
  *   **Integrator Decision:** Revenue $12. Cost $13. Profit -$1. **Produce 0.**
  *   **Payoffs:** A=$0, B=$0, C=$0, Integrator=$0.
  *   **Comparison:**
      *   Open Regime Total: $40.
      *   Fragmented Total: $0.
      *   Coordinated Total: $60.
  *   **Lesson:** Fragmented is worse than Open. Property rights destroyed value.

  **Why won't one Owner fix it?**
  *   Suppose in Round 2, Owner A realizes the crash. A lowers price to $0.
  *   B and C keep prices at $4.
  *   Total Cost: $8.
  *   Integrator produces.
  *   Payoffs: A=$0, B=$20, C=$20.
  *   **Owner A's Incentive:** Why sacrifice my $20 potential (if I charge $5 and others drop) to make B and C rich? If A charges $5 again, hoping B and C drop, A might get $25.
  *   **Result:** A keeps price high. Market stays dead. This demonstrates the **Free-Rider Problem among Owners**.

  ---

  ## 6. Debrief Guide (The "Reveal")

  *Do not use technical terms until this section.*

  **Step 1: The Wall (5 mins)**
  *   Ask the Integrators from Regime 2: "How did it feel to have a viable product but be unable to build it?"
  *   *Concept:* **Blocked Innovation.** The Improver (Integrator) had the vision but was held hostage by upstream rights they didn't want and couldn't avoid.

  **Step 2: The Owners' Dilemma (10 mins)**
  *   Ask Owners from Regime 2: "Why didn't you lower your price to save the deal?"
  *   Expect answers: "I didn't know what they were charging," "If I lowered mine, they still might not."
  *   *Concept:* **Complementary Goods.** Explain that unlike substitutes (Coke vs. Pepsi), complements (Left Shoe vs. Right Shoe) require *joint* pricing.
  *   *Concept:* **The Free-Rider Problem.** Explain that a price cut by one Owner benefits *all* Owners by enabling sales, but the cost of the cut is borne *only* by the cutter. Rational self-interest prevents the rescue.

  **Step 3: Naming the Phenomenon (10 mins)**
  *   Now introduce the labels.
  *   **The Anticommons:** When too many owners have the right to exclude, resources are underused. (Contrast with *Tragedy of the Commons*, where too many have the right to *use*).
  *   **Patent Thicket:** The dense web of overlapping rights (simulated by the 3 required components) that forces integrators to negotiate multiple licenses.
  *   **Double (or Triple) Marginalization:** Each owner adds a markup, stacking up until the final price chokes demand.

  **Step 4: The Solution (5 mins)**
  *   Discuss Regime 3.
  *   **Patent Pool / Cross-License:** Mechanisms to internalize the complementarity.
  *   **Compulsory Licensing:** What if the Instructor had forced a $2 price in Regime 2? (Discuss government intervention).

  ---

  ## 7. Failure Modes & Fallbacks

  **Failure Mode 1: Altruistic Pricing**
  *   *Risk:* Students in Regime 2 charge $1 each to "be nice." Total $3. Market thrives. Lesson fails.
  *   *Fallback:* Stop the round. Remind them: "You are fiduciaries for a corporation. Your sole duty is to maximize your shareholder points. Charging $1 when you could charge $4 is a breach of duty." Restart the round.
  *   *Teaching Point:* If they still cooperate, point out that in the real world, firms *are* legally bound to maximize profit, whereas students are not. The game *underestimates* the pressure to defect.

  **Failure Mode 2: Implicit Collusion**
  *   *Risk:* Owners make eye contact or signal prices.
  *   *Fallback:* Enforce strict silence. Seat Owners back-to-back.
  *   *Teaching Point:* If they manage to coordinate without talking, highlight how difficult that is with 3 people, let alone 300 patent holders in a real thicket.

  **Failure Mode 3: The "Spiteful" Integrator**
  *   *Risk:* Integrator refuses to produce even at $0 profit.
  *   *Fallback:* Accept this. It reinforces the lesson: "Transaction costs and human friction make the crash even worse than the model predicts."

  ---

  ## 8. Limits of the Simulation

  You must explicitly tell students what the game *cannot* show during the wrap-up.

  1.  **Dynamic Incentives (Ex-Ante vs. Ex-Post):**
      *   *Game:* The components already exist.
      *   *Reality:* Without the promise of Regime 2 (profits), Owners might never have invented Components A, B, or C in the first place. The game shows the *static* loss of IP, but ignores the *dynamic* gain of innovation incentives.
  2.  **Probabilistic Rights:**
      *   *Game:* Rights are certain. You *must* buy.
      *   *Reality:* Patents are often invalid or not infringed. In reality, Integrators sometimes bluff and build without licenses, gambling they won't get sued. The game overstates the Owners' power.
  3.  **Time Horizon:**
      *   *Game:* 105 minutes.
      *   *Reality:* Licensing negotiations take years. The "deadlock" in reality might eventually resolve through litigation or acquisition, which is costly but not necessarily a total market collapse.

  ---

  ## 9. Self-Critique & Critical Assumptions

  **The Critical Assumption:**
  The entire lesson rests on the assumption that **Owners will price above the cooperative monopoly level in Regime 2.**
  *   *Why it might fail:* If students intuitively split the $12 evenly ($4 each), the market survives (barely). The Integrator makes $0, but the product exists.
  *   *Why it's likely to hold:* Undergraduates in a competitive seminar setting tend to anchor on "capturing value." Owner A sees the Integrator making money in Regime 1 and wants a slice. $5 is a psychologically attractive number (more than a third). Two owners picking $5 guarantees a crash ($10 + $X > $12).
  *   *Watch List:* During Regime 2, watch the Price Slips. If you see $4, $4, $4, the lesson is weakening.
  *   *Revision Criteria:* If Round 1 of Regime 2 succeeds (prices ≤ $12), **add a Fourth Owner** in Round 2. Give one Owner a "Sub-Patent" on Component A. Now 4 people must agree on a $12 pie. The math becomes ($3 each). The likelihood of a crash increases significantly with more fragments.

  **Misleading Intuition:**
  *   *Risk:* Students may conclude "Property Rights are bad."
  *   *Correction:* You must emphasize Regime 1's inefficiency. Without rights, the Integrator lost 33% of value to "Insecurity." Property rights *created* the potential for $60 value (Regime 3), but the *structure* of those rights (Fragmented) destroyed it. The lesson is not "No IP," but "IP Structure Matters."

  **Abandonment Condition:**
  If, in Regime 2, the Owners consistently price at $0 or $1 despite instructions to maximize profit, the game has failed to simulate economic agency. In this case, abandon the "Market Failure" claim and pivot the debrief to "Behavioral Economics: Why humans cooperate even when models say they shouldn't." This is still a valuable lesson, but it is not the one planned.

  ---

  ## 10. Instructor Script Snippets (For Withholding Labels)

  *   **Intro:** "We are testing three different rule sets for innovation. I will not tell you the names of these economic structures until the end. I want your gut reaction, not your textbook memory."
  *   **Regime 2 Setup:** "You now have exclusivity. You have the power to say 'no.' Use it to maximize your score. Do not worry about the table's total score. Worry about yours."
  *   **Post-Crash:** "Look at your scores. In Regime 1 (Open), the table made 40 points. In Regime 2 (Rights), the table made 0. How did more ownership lead to less wealth?"
  *   **Debrief Reveal:** "Economists call what you just experienced the **Anticommons**. Heller and Eisenberg coined this in 1998 to describe exactly this: when too many people own a piece of the puzzle, the picture never gets built."
