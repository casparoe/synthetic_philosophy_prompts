answer: |-
  Your colleague is half-right: the framework is not the product of a single philosophical deduction, but it is not merely administrative inertia either. It is a *compromise formation* stitched together from three incompatible ontologies of the object. The tiers do not flow from one another; they represent distinct settlements between rival claims on what an object *is*. To draft a statement of principles that survives legal scrutiny, you must acknowledge that your policy will be a hybrid instrument. It cannot claim a unified theory of value without exposing itself to contradiction.

  Here is the reconstruction of the implicit theories, the structural oddities, and the consequences of shifting the theoretical ground.

  ### 1. The Three Ontologies of the Tiers

  The current British practice does not operate on a single axis. It oscillates between three distinct locations of significance.

  **Tier 1: Human Remains (The Somatic Theory)**
  *   **Location of Significance:** The biological continuity of the body and the moral status of the person who inhabited it.
  *   **Presupposition:** A human remain is not an "object" in the museum sense; it is a subject paused in storage. Its value is intrinsic to its somatic identity.
  *   **The 1,000-Year Limit:** This is not a philosophical claim about kinship expiring. It is a bureaucratic proxy for *identifiability*. The limit presupposes that moral standing requires a specific claimant. Beyond 1,000 years, the "community of descent" becomes a category of political affiliation rather than biological continuity. The framework treats recent remains as *persons* (requiring consent/return) and ancient remains as *data* (requiring preservation). The cut-off is where the law decides the dead cease to be legal subjects and become historical evidence.
  *   **What it Rules Out:** It rejects the idea that all human remains are equally sacred regardless of age (a universalist religious view) and rejects the idea that they are merely biological specimens (a pure scientific view).

  **Tier 2: Ritual/Ceremonial Objects (The Functional Theory)**
  *   **Location of Significance:** The object's capacity to act within a living practice.
  *   **Presupposition:** An object's meaning is not inherent in its matter but in its *use*. A mask is not a sculpture; it is a vessel for a spirit or a tool for a rite. If the rite survives, the object retains its agency.
  *   **The Continuity Requirement:** The claimant must prove the object is still "alive." This privileges cultural stasis. It assumes that an object removed from its context loses its primary value *unless* that context can be proven to exist elsewhere.
  *   **What it Rules Out:** It rules out the claim that an object retains sacred status even if the religion is extinct (the "relic" theory). It also rules out the aesthetic theory that the object's value lies in its form, independent of use.

  **Tier 3: General Antiquities (The Material-Evidential Theory)**
  *   **Location of Significance:** The physical substrate as a carrier of historical information.
  *   **Presupposition:** The object is a unique witness to the past. Its value lies in its authenticity and material integrity, which are best preserved by professional conservation.
  *   **The Retention Default:** Because the "practice" is dead (Egyptian funerary rites, Cycladic worship), the object is treated as a document. Documents belong in archives. The museum claims to be the universal archive.
  *   **What it Rules Out:** It rules out the idea that the object belongs to the geography of its origin (territorial sovereignty) or that a cast carries the same evidential weight as the original (since the specific matter is the source of truth).

  **Do they belong to one theory?**
  No. Tier 1 treats the item as a *Person*. Tier 2 treats the item as a *Tool*. Tier 3 treats the item as *Evidence*. The framework is a zoning map, not a philosophy. It assigns different legal statuses to different classes of matter.

  ### 2. The Structural Oddity: The Inversion of Harm

  You identified the critical contradiction: *If significance resides in continuing relations, objects whose practices were destroyed ought to present the strongest case for return.*

  The framework inverts this because it conflates *moral claim* with *practical viability*.
  *   **The Logic:** The framework assumes that restitution is only meaningful if the object can be "reactivated." If a community no longer exists to perform the rite, the museum argues the object cannot be "returned" to a practice, only to a soil.
  *   **The Contradiction:** This privileges the survivor over the victim of cultural genocide. It effectively says: "We will return this to you because you managed to keep your culture alive despite us; we will keep that one because we helped destroy the culture that made it."
  *   **The Underlying Principle:** This is not a theory of meaning; it is a theory of *custodial efficiency*. The museum retains objects that have no active claimant because it positions itself as the default custodian of "orphaned" heritage. The principle is: *Significance requires a steward capable of maintaining the object's defined function.* If the function is lost, the museum claims the function of "preservation" supersedes the function of "origin."

  ### 3. Pragmatism vs. Philosophy

  Your colleague argues this is just cataloguing and political cost.
  *   **Where they are right:** The 1,000-year limit and the "continuity of practice" test are indeed administrative filters designed to reduce the volume of claims. They are heuristic devices to make the problem manageable.
  *   **Where they are wrong:** These filters rely on deep ontological commitments. You cannot have a "continuity of practice" test without assuming that *practice* is the source of the object's value. If you believed the value was historical (Tier 3), continuity wouldn't matter. If you believed the value was spiritual (Tier 2), extinction wouldn't nullify the claim. The fact that the framework *uses* these tests proves it is implicitly committed to a Functional Theory for ethnography and a Material Theory for antiquities. It is not philosophy-free; it is *eclectic* philosophy disguised as procedure.

  ### 4. The Loan Deadlock and the Nature of Title

  The deadlock over long-term loans reveals that title is doing **recognitive work**, not instrumental work.

  *   **Instrumental View:** If ownership were merely about possession and use, a long-term loan would suffice. The claimant gets the object; the lender keeps the legal safety net. Conservation and display can be identical.
  *   **Recognitive View:** The claimant refuses the loan because accepting it validates the lender's *prior title*. To accept a loan is to admit the museum *had* the right to lend it.
  *   **What Title Means Here:** Title is a verdict on history. It is a statement about whether the original acquisition was valid.
      *   If the museum lends, it says: "I own this legitimately enough to share it."
      *   If the claimant accepts, they say: "I acknowledge your legitimacy."
      *   The deadlock exists because the dispute is not about *where the object goes*, but *who has the authority to decide where it goes*. The fight is over sovereignty, not custody. The framework's reliance on loans attempts to solve a sovereignty dispute with a logistics solution. It fails because it treats the object as property (which can be loaned) when the claimant treats it as sovereignty (which cannot).

  ### 5. Underdetermination

  There are points where the practice is genuinely underdetermined, where multiple theories license the same rule.
  *   **Digital Surrogates:** Both the Material Theory (the original is safe here) and the Relational Theory (the image can travel to the community) support digitization.
  *   **Co-curation:** Both the Evidential Theory (experts ensure accuracy) and the Relational Theory (community ensures meaning) support shared authority.
  *   **The "National Treasure" Exception:** The bar on disposing of certain objects is justified by statute (Legal), but also by the Material Theory (universal access) and the Relational Theory (the British public has a relationship with these objects).

  In these areas, your policy has flexibility. You can argue for co-curation on pragmatic grounds without settling the ontological debate.

  ### 6. Institutional Consequences of Theoretical Replacement

  If you attempt to write a statement of principles, you must choose which ontology drives the vehicle. Here is what breaks if you switch engines.

  **Scenario A: The Relational/Pragmatic Theory**
  *   *Principle:* Objects mean nothing apart from the relations and practices they belong to. Value is created by use and connection, not inherent in matter.
  *   **Survivors:**
      *   **Human Remains:** Stronger return mandate. If the relation is severed, the museum holds a corpse, not a specimen. The 1,000-year limit collapses; if a community claims ancestral connection, the relation exists regardless of carbon dating.
      *   **Ritual Objects:** Stronger return mandate. Continuity of practice becomes less important than the *desire* to reconnect. The "extinct culture" barrier dissolves.
  *   **Collapses:**
      *   **General Antiquities:** The retention of Cycladic or Egyptian material becomes indefensible. If the original religious/social relation is dead, the object has no meaning in London other than "colonial trophy." The museum becomes a warehouse of disconnected matter.
      *   **Conservation:** The philosophy of "minimal intervention" collapses. If value is relational, and the community wants the object used (worn, danced, buried), conservation must yield to use. Preserving the matter at the cost of the practice is a violation of the object's nature.
      *   **The Loan Solution:** Becomes viable. If title doesn't matter, only access and relation do, a loan satisfies the relational need without transferring legal ownership.

  **Scenario B: The Materialist/Essentialist Theory**
  *   *Principle:* The material substrate is the only locus of value. The specific atoms and their historical integrity are paramount.
  *   **Survivors:**
      *   **General Antiquities:** Retention is reinforced. The museum is the best guardian of the material substrate.
      *   **Conservation:** Minimal intervention becomes the supreme ethical law. Any use that degrades the material is forbidden.
  *   **Collapses:**
      *   **Human Remains:** The entire Tier 1 framework collapses. If the substrate is all that matters, remains are biological data. There is no moral imperative to return them based on "dignity" or "kinship," only based on scientific utility. The 1,000-year limit becomes arbitrary; either all are data or all are waste.
      *   **Ritual Objects:** Return becomes harder to justify. If the object is a sculpture, it matters less where it sits. The claim that it *must* be in a specific community to be "real" is rejected as superstition.
      *   **Casts/Surrogates:** Becomes the preferred solution. If the information is in the form, a perfect cast is ethically equivalent to the original. The "loan deadlock" vanishes because the claimant should accept the cast.

  ### Recommendation for the Statement of Principles

  You cannot adopt Scenario A or Scenario B wholesale without violating your governing statutes or alienating your scientific staff. Your policy must explicitly state that it operates on a **Pluralist Model of Value**.

  Your statement should argue that the museum recognizes objects hold *simultaneous* values that may conflict:
  1.  **Evidential Value:** (Material substrate)
  2.  **Relational Value:** (Community connection)
  3.  **Somatic Value:** (Human dignity)

  The policy is not a search for the *true* value, but a **hierarchy of adjudication**.
  *   *Principle 1:* Somatic value (human remains) trumps Evidential value. (Justifies Tier 1).
  *   *Principle 2:* Active Relational value (living ritual) trumps Passive Evidential value. (Justifies Tier 2).
  *   *Principle 3:* Where Relational value is latent or broken (extinct cultures), Evidential value holds, but is mitigated by shared stewardship. (Justifies Tier 3).

  This admits the contradiction but codifies the priority rule. It survives legal challenge because it does not claim a false unity; it claims a structured discretion. It acknowledges that the 1,000-year limit is a procedural boundary for *manageability*, not a moral boundary for *humanity*, and it frames the loan deadlock not as a refusal to return, but as a disagreement over the legal mechanism of recognition, leaving the door open for legislative change (which is the only thing that actually solves the title problem).

  If you write that the object's meaning is *fixed*, you will be sued. If you write that the museum's duty is to *weigh* competing meanings according to a published hierarchy, you create a defensible administrative process.
