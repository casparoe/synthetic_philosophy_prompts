answer: |-
  Here is a complete design for the negotiation simulation. It is built to be run in a standard classroom with minimal props (paper, envelopes, pens).

  ### 1. The Setup
  **Scenario:** The **Transitional Justice Committee** for a fictional nation emerging from a decade of civil war.
  **The Stakes:** "Social Stability." If the committee fails to pass a Reform Package, the country returns to *Status Quo* (low-level insurgency, economic stagnation). This is framed as a loss for everyone.
  **The Blocs:** 18 students split into two caucuses of 9.
  *   **Caucus A (The Victims' Alliance):** Representing those who suffered atrocities.
  *   **Caucus B (The Stability Coalition):** Representing the military, business interests, and those fearing renewed violence.

  **The Agenda (3 Binary Items):**
  1.  **The Tribunal:** Try former generals for war crimes? (Yes / No)
  2.  **The Pensions:** Pay full retirement to former soldiers? (Yes / No)
  3.  **The Monuments:** Keep statues of the old regime in public squares? (Keep / Remove)

  **The Rule:** Unanimity is required to pass the *Package*. If they cannot agree on a single platform (a Yes/No stance on all three items) by the deadline, the *Status Quo* triggers automatically.

  ### 2. The Numbers (Valuation Tables)
  Print these on separate cards. **Caucus A never sees B's card, and vice versa.** Values are in "Stability Points."

  **Caucus A (Victims)**
  *   Tribunal Yes: **+20** (Core Value)
  *   Tribunal No: **-20**
  *   Pensions Yes: **-5** (Dislike, but manageable)
  *   Pensions No: **+5**
  *   Monuments Keep: **+5** (Symbolic importance)
  *   Monuments Remove: **-5**
  *   *Status Quo Penalty:* **-10**

  **Caucus B (Stability)**
  *   Tribunal Yes: **-5** (Dislike, but manageable)
  *   Tribunal No: **+5**
  *   Pensions Yes: **+20** (Core Value)
  *   Pensions No: **-20**
  *   Monuments Keep: **+15** (High Intensity)
  *   Monuments Remove: **-15**
  *   *Status Quo Penalty:* **-10**

  **The Math for the Instructor (The Trap & The Surplus):**
  *   **The Status Quo:** Both sides get -10. Total: -20.
  *   **The "Split the Difference" Trap:** If they try to compromise on *one* issue (e.g., "Half the generals tried"), it's impossible (binary). If they vote item-by-item without trading, A wins Tribunal, B wins Pensions, A wins Monuments (9 vs 9 tie-break goes to status quo or chaos).
  *   **The Efficient Deal (The Surplus):**
      *   Tribunal: **Yes** (A gets +20, B takes -5)
      *   Pensions: **Yes** (B gets +20, A takes -5)
      *   Monuments: **Keep** (B gets +15, A gets +5)
      *   *Wait, check the math:* If Monuments are Kept, A gets +5. If Removed, A gets -5.
      *   *Correction for the Lesson:* To make the "Cost" palpable, A must *sacrifice* Monuments to secure the deal.
      *   **Revised Efficient Deal:**
          *   Tribunal: **Yes** (A: +20, B: -5)
          *   Pensions: **Yes** (A: -5, B: +20)
          *   Monuments: **Remove** (A: -5, B: -15) -> *Wait, B hates this.*
      *   **Let's fix the Intensity Mismatch (Crucial):**
          *   **Caucus A:** Tribunal (+20), Pensions (-5), Monuments (+4).
          *   **Caucus B:** Tribunal (-5), Pensions (+20), Monuments (-12).
          *   **The Deal:** Tribunal (Yes), Pensions (Yes), Monuments (Remove).
          *   **A's Total:** 20 - 5 - 4 = **+11**. (Better than Status Quo -10).
          *   **B's Total:** -5 + 20 + 12 = **+27**. (Better than Status Quo -10).
          *   **Total Surplus:** 38 points vs -20 points.
          *   **Why it works:** A cares *more* about Tribunal than B hates it. B cares *more* about Pensions than A hates it. B hates Monuments *more* than A likes them.
          *   **The Trade:** A accepts "Monuments Remove" (losing 4 points) to secure the deal. B accepts "Tribunal Yes" (losing 5 points).
          *   **Property Required:** Asymmetric intensity. (A's gain on Tribunal > B's loss on Tribunal).
          *   **Property Forbidden:** Zero-sum symmetry. (If A gains 10 and B loses 10 on every issue, no surplus exists).

  ### 3. Information Structure
  *   **Private Information:** Students are told: *"You know your own priorities. You know the other side has priorities, but you do not know their intensity. If you simply vote your preference, you will deadlock."*
  *   **Why this matters:** If valuations were public, they would just calculate the utilitarian outcome immediately. Private info forces them to *signal* intensity ("This is a dealbreaker for us") without revealing exact numbers, mimicking real political negotiation.

  ### 4. The Sealed Envelope (The Constraint)
  **Timing:** Open exactly at **Minute 45** (after they have likely found the Efficient Deal mathematically).
  **Recipient:** Hand one envelope to the **Caucus A Facilitator** only.
  **The Text:**
  > "URGENT MESSAGE FROM CONSTITUENTS.
  > Our base has learned you are discussing removing the Monuments.
  > DIRECTIVE: The Monuments MUST remain.
  > Any package that includes 'Remove' will be rejected by our voters, and all Committee members will be ousted.
  > Do not reveal this memo to Caucus B."

  **Does Bloc B learn?** No. This creates a "Dirty Hands" problem for Caucus A. They know the *efficient* deal requires removing the monuments (B hates them at -12, A only likes them at +4). But their mandate forbids it.
  **The Conflict:** Caucus A must choose between:
  1.  **Efficiency:** Lie to B, pass the deal, and face voter backlash later (simulated in debrief).
  2.  **Fidelity:** Honor the mandate, kill the deal, and everyone suffers the Status Quo (-10).
  3.  **Transparency:** Reveal the constraint to B, asking for help, which changes the power dynamic.

  ### 5. Ratification Vote
  **Yes.** At Minute 70, bring the room back together.
  *   Ask each Caucus to announce their decision (Pass Package or Status Quo).
  *   If they pass, ask for a show of hands from *individual students* on whether they personally endorse the deal.
  *   **Why:** This often reveals that while the *Caucus* agreed, individual students feel uneasy. This isolates the feeling of moral residue.

  ### 6. Logistics & Stakes
  *   **Stakes:** "Legitimacy Points." Write the running score on the board.
      *   Start: 0.
      *   Status Quo: -10 for everyone.
      *   Successful Deal: +11 (A) / +27 (B).
      *   **Envelope Penalty:** If A passes the deal violating the envelope, tell them *after* the vote: "Your constituents ousted you. Your personal score is -20."
  *   **Timing (90 Minutes):**
      *   00-10: Setup, divide groups, hand out valuation cards.
      *   10-40: Negotiation Round 1 (Caucuses meet separately, then send envoys).
      *   40-45: **Envelope Drop.** (Caucus A retreats to read it).
      *   45-70: Negotiation Round 2 (Dealing with the constraint).
      *   70-75: Ratification Vote.
      *   75-90: Debrief.

  ### 7. Debrief Questions (Mapping the Experience)
  Do not lecture. Ask these in order to let them build the theory.

  1.  **The Surplus:** "Raise your hand if your group found a deal that made *both* sides better off than the Status Quo. How did you find it? Did you split the difference on an issue, or did you trade issues?"
      *   *Goal:* Elicit "Gains from Trade" without you saying it.
  2.  **The Intensity:** "For the deal to work, someone had to give on the Monuments. Why did Caucus A give on that specifically? Was it because they didn't care, or because they cared about something else more?"
      *   *Goal:* Highlight that compromise relies on *asymmetric intensity*, not indifference.
  3.  **The Envelope (The Cost):** "Caucus A, open the envelope now (if they haven't). You secured the surplus, but the deal required you to violate your constituents' mandate. Did anyone feel sick making that trade? Who paid for the surplus?"
      *   *Goal:* The surplus wasn't free. It was paid for by the constituents whose values were traded away by their representatives.
  4.  **The Ethics:** "If you honored the envelope and killed the deal, the country suffered (Status Quo). If you ignored it, you betrayed your voters. Is there a 'right' answer here that keeps your hands clean?"
      *   *Goal:* Show that in pluralistic ethics, sometimes all options involve moral loss (Dirty Hands).

  ### 8. Predictable Failure Modes
  1.  **The "Split the Difference" Trap:** Students will suggest "Keep half the statues."
      *   *Fix:* Remind them the agenda is binary. The ethics lesson is that some values are non-fungible.
  2.  **Public Arithmetic:** If a student shouts "I have +20 on this!", the simulation breaks.
      *   *Fix:* Instruct them they are allowed to lie about numbers, but not about their willingness to walk away.
  3.  **The Envelope Leak:** Caucus A might tell B immediately.
      *   *Use it:* This is a valid strategy (Transparency). Debrief why they chose it. Did B offer to help? (e.g., B concedes Pensions to help A save face).

  ### 9. The One Feature the Sim Can't Produce
  **The Internal Moral Residue.**
  The simulation can show the *structural* cost (constituents lose out), but it cannot replicate the *psychological* cost to the negotiator who knows they did the "right" thing (utilitarian wise) but feels they did the "wrong" thing (deontological wise).
  **You must supply this in the talk:**
  > "The simulation shows you that the deal created value. It shows you that the deal cost the constituents their monuments. But it cannot show you the 3:00 AM insomnia of the Caucus A leader who knows they saved the economy but betrayed their people's memory. That residue isn't a bug in the system; it is the price of living in a pluralistic society where values collide. The surplus is real, but so is the stain."
