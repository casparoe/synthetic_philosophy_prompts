prompt: |-
  I spent 35 years running low-signal measurements — mostly trace-gas spectroscopy, where half the job is knowing exactly what your instrument can and cannot see. Retired now, reading philosophy for fun, and I've gotten stuck on the divine hiddenness argument, the Schellenberg one about non-resistant nonbelief from his 1993 book. My hunch is that the whole thing is a detection-theory argument wearing theological clothes, and I'd like you to stress-test that rather than just flatter it.

  Restate the argument, and the main theistic replies to it, in the vocabulary I actually work in: signal and noise, integration time, detection limits, false-negative and false-positive rates, upper limits on a flux, calibration, and the question of wether the source's output is independent of the detector. Here's my own gloss so you know where I'm starting: each human life is a single exposure with a fixed integration time and a lot of uncontrolled background, and Schellenberg is claiming the source is bright enough that a non-detection in a willing, well-pointed detector gives you an upper limit that rules it out.

  Then give me the residue report, honestly. Which claims map cleanly, which ones you have to bend to fit, and which have no counterpart in my vocabulary at all — I'm guessing the "perfectly loving" premise and whatever work the non-resistance condition is doing. For each piece of residue, say whether it shows my framework is missing something or shows the philosophical claim was less determinate than it looked. Don't smuggle my assumptions in and label it translation; if its not clean, tell me it isn't. And please mark clearly which parts of this debate are settled among people who actually work on it versus live and contested — I don't want one side's position handed to me as the consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Retired experimentalist (35 years), specialized in low-signal measurements (trace-gas spectroscopy). Understands signal-to-noise ratios, detection limits, integration time, false negatives/positives, calibration, source-detector independence.
      *   **Current Activity:** Reading philosophy for fun, specifically focused on J.L. Schellenberg's Divine Hiddenness Argument (from *Divine Hiddenness and Human Reason*, 1993).
