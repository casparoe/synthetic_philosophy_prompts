answer: |-
  Here is the session plan. It is designed to be rigorous but accessible, strictly adhering to your constraints and resources.

  ### (a) Dependency Structure

  You cannot shuffle this order. If you introduce the "Substantive" sense before the "Trivial" sense, the students will assume the definition of computer is fixed (laptops), and the distinction will vanish. If you introduce misconceptions before the definition, they will anchor on hardware.

  1.  **Shared Baseline (Minutes 0–5):** Establish the minimal definition of computation: *Input $\rightarrow$ Process $\rightarrow$ Output.*
      *   *Why first:* This is the only thing the Python students and the non-coders share. It neutralizes the "silicon" bias immediately.
  2.  **The Trivialisation Problem (Minutes 5–15):** Demonstrate that *any* physical system can be mapped to Input $\rightarrow$ Output.
      *   *Why second:* You must break their intuition that "computation" is special before you can rebuild a useful definition. If they think computation is rare, they won't understand the "Trivial" sense.
  3.  **The Core Distinction (Minutes 15–30):** Distinguish between *describing* a system as computational (Trivial) vs. claiming it *causally operates* via discrete symbolic manipulation (Substantive).
      *   *Why third:* This is the payoff. It relies on the previous two steps to make sense.
  4.  **Application to the Brain (Minutes 30–40):** Apply the distinction to neuroscience.
      *   *Why fourth:* Only now can they evaluate the title question without conflating mechanism with metaphor.
  5.  **Assessment (Minutes 40–45):** The final question.
      *   *Why last:* It tests whether they retained the distinction, not just the conclusion.

  ### (b) The Core Example & The Thermostat

  **Verdict on Gradual Replacement:** **Discard it.**
  It derails. It invites the "Ship of Theseus" problem (identity) and the "Hard Problem" (consciousness). If a student asks, "Would the replaced person still *feel* like themselves?", you are in the exact trap last year's session fell into. It tests *substrate independence*, not *computational architecture*.

  **Verdict on Thermostat Opening:** **Keep it, but change the question.**
  Your flatmate is half-right. If you ask "Is it a computer?", you get a Yes/No fight. Instead, use it to expose the ambiguity.
  *   *New Opening:* "A thermostat takes temperature (Input), switches a boiler on/off (Process), and changes the room heat (Output). By our baseline definition, is it computing?"
  *   *If they say Yes:* "Then is a falling rock computing? It takes height (Input), falls (Process), hits ground (Output). If everything computes, the word 'computer' tells us nothing about the brain."
  *   *If they say No:* "Then why not? It follows rules. Did you just define 'computer' as 'things that look like laptops'?"
  *   *Purpose:* This creates the *need* for the Two Senses distinction.

  **The One Example to Build Around: The "Addition" Task (Lookup Table vs. Algorithm)**
  Use your index cards. This isolates *process* from *outcome*.
  *   **Setup:** Write "2 + 2" on one card (Input) and "4" on another (Output).
  *   **Scenario A (The Lookup):** Give a student a stack of index cards containing every possible sum memorized. They find "2+2", flip the card, see "4".
  *   **Scenario B (The Algorithm):** Give a student blank cards. They must count out two objects, then two more, then count the total.
  *   **The Pivot:** Both produce "4". Both are Input $\rightarrow$ Output.
      *   *Sense 1 (Trivial):* Both are computers. They implement the addition function. (This is the "Brain implements computation" sense).
      *   *Sense 2 (Substantive):* Only Scenario B is manipulating symbols according to rules. Scenario A is just a static map. (This is the "Mind is a digital computer" sense).
  *   **Why this works:** It avoids consciousness (no one asks if the cards *understand* math). It avoids hardware (could be done with stones). It forces the distinction between *mapping states* (Trivial) and *causal organization* (Substantive).

  ### (c) Misconceptions & Shutdown Phrases

  Address these exactly when they arise. Do not wait for a Q&A.

  1.  **"Computer means silicon and screens."**
      *   *When:* Minute 5 (during Thermostat opening).
      *   *Shutdown:* "We are not talking about electronics. We are talking about logic. If a wooden abacus follows rules, it fits the definition. If we restrict 'computer' to silicon, we are talking about marketing, not philosophy."
  2.  **"A computer must have been programmed by somebody."**
      *   *When:* Minute 25 (during Core Example).
      *   *Shutdown:* "A tornado has a structure without a programmer. If the brain is a computer, the 'code' might be written by evolution, or by the brain's own wiring, not a human engineer. Don't confuse the origin of the system with the operation of the system."
  3.  **"Neurons are just very small transistors."**
      *   *When:* Minute 35 (during Application to Brain).
      *   *Shutdown:* "That is an empirical claim neuroscience is still testing. Neurons might be analog, chemical, or quantum. The question we are asking is: even if they *aren't* transistors, could they still be running a computation? Don't let the hardware decide the software."
  4.  **"If the brain is a computer then it can be uploaded."**
      *   *When:* Minute 40 (towards the end).
      *   *Shutdown:* "Uploading assumes the 'Substantive' sense is true *and* that consciousness is substrate-independent. We haven't even agreed if the brain is a computer yet. That is a science fiction conclusion, not a philosophical premise."

  ### (d) The Final Question (Minutes 42–45)

  Do not ask for their opinion on whether the brain *is* a computer. Ask them to evaluate the *meaning* of the claim.

  **The Question:**
  *"If I tell you 'The brain is a computer,' does that tell you **how** the brain works, or does it just tell you that I **could model** the brain on a laptop?"*

  **Assessment Criteria:**
  *   **Grasped the Distinction:** They answer that it depends on which sense of "computer" is meant. (Sense 1 = I could model it. Sense 2 = It works via symbolic rules).
  *   **Merely Agreeing:** They answer "Yes it tells us how" (confusing the two senses) or "No it doesn't" (dismissing the substantive claim entirely).
  *   **Derailed:** They mention consciousness, souls, or AI rights.

  ### (e) Explicit Refusals

  You must police the boundary of the session or you will run out of time. Write this list on the bottom corner of the whiteboard at the start.

  **The "Out of Bounds" List:**
  1.  **Consciousness/Qualia:** ("What does it *feel* like?")
  2.  **The Turing Test:** ("Can it trick a human?")
  3.  **AI Ethics/Rights:** ("Should we turn it off?")

  **How to say it out loud:**
  When a student raises these (and they will):
  *"That is a vital question, but it belongs to the problem of **consciousness**, not **computation**. We are asking about the **mechanism**, not the **experience**. If we answer the consciousness question now, we won't have time to solve the mechanism question. I am parking that on the 'Out of Bounds' list so we don't cheat ourselves out of an answer today."*

  ### Feasibility Check

  **Can 45 minutes reach the two-sense payoff?**
  Yes, but only if you treat the **Gradual Replacement** scenario as a hard "No." That scenario consumes 20 minutes in debate about identity. The **Addition/Lookup** example consumes 5 minutes and isolates the logic.

  If you find at Minute 20 that they are stuck on the Thermostat, **abandon the nuance.** Pivot to: *"Okay, let's assume everything is a computer in the weak sense. Does the brain work like a laptop (Step-by-Step rules) or like a storm (Continuous patterns)?"* This preserves the Substantive distinction even if the Trivial one is muddy.

  **Summary of Instructions for You:**
  1.  **Draw the Input/Output arrow** on the board immediately.
  2.  **Use the Index Cards** for the Addition example (physical props anchor attention).
  3.  **Write the "Out of Bounds" list** on the board visibly.
  4.  **Interrupt gently but firmly** when Consciousness is mentioned using the script above.
  5.  **End on the Final Question** exactly at minute 42. Do not answer it yourself. Let them leave with the distinction unresolved in their minds.
