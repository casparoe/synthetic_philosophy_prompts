      *   *Claim 6-8 (Free Energy/Surprise/Homeostasis):* Technically, variational free energy bounds *surprisal* (self-information). Surprise is $-\ln p(state)$. Organisms avoid high surprise states (death). This is the core FEP argument. *Verdict: Nod (with technical caveats).*
