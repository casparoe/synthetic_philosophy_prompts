  ### Brainstorming: Candidate Criteria for Skyhook-Hood

  Before drafting the statement, we need to inventory the definitions floating around this literature to separate substance from rhetoric.

  1.  **The Supernatural Criterion:** A skyhook is a non-natural intervention (God, Cartesian ego). *Verdict:* Too narrow. Dennett labels naturalistic theories (Chomsky's UG, Gould's exaptationism) as skyhooks. This is rhetorical cover, not a definition.
  2.  **The "Ex Nihilo" Criterion:** A skyhook creates complexity without prior complexity. *Verdict:* Substantive, but vague. What counts as "complexity"? Informational? Structural?
  3.  **The Competence without Comprehension Criterion:** A skyhook posits high-level competence without a bottom-up history of blind variation. *Verdict:* This is Dennett's technical core. It is substantive but relies on a specific evolutionary epistemology.
  4.  **The Circularity/Presupposition Criterion (R's View):** An explanation is a skyhook if the mechanism presupposes the feature it explains. *Verdict:* Substantive, but risks over-generation. All recursive systems (learning, selection) presuppose *some* structure to generate *more* structure.
  5.  **The Exclusionary Criterion (Your View):** "Skyhook" is a label applied post-hoc to explanations deemed insufficient. *Verdict:* This is a sociological claim about usage. It is substantive about *practice*, even if it denies the concept *normative* force.

  The core friction is between R's **structural definition** (does the mechanism logically depend on the outcome?) and your **pragmatic diagnosis** (is the term used to stop inquiry rather than guide it?). The document below forces these into the open.

  ***

  ### JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Status and Utility of the Crane/Skyhook Distinction
  **Parties:** [User] and [R]

  #### I. Agreed Claims
  We agree on the following propositions to establish a baseline for disagreement:

  1.  **Purpose:** The distinction is intended to demarcate explanations that reduce design/complexity via blind processes (cranes) from those that posit design/complexity as a primitive input (skyhooks).
  2.  **Paradigm Cases:** We agree that "Divine Intervention" is a skyhook and "a physical pulley lifting a weight" is a crane. We agree that Natural Selection is intended by Dennett as a crane.
  3.  **Normative Goal:** We agree that if the distinction is substantive, it must be possible to identify a potential explanation as a skyhook *before* rejecting it on unrelated grounds. If it cannot be applied prospectively, it functions purely as a rhetorical stopper.
  4.  **The Bootstrap Problem:** We agree that any evolutionary or learning process requires *some* initial order (replicators, learners) to generate *more* order. The dispute is whether this necessary initial order constitutes "presupposing the explanandum."

  #### II. Table of Residual Disagreements
  *Each row states a disagreement in terms both parties accept as an accurate characterization of their opposing view.*

  | Topic | Position A ([User]) | Position B [R] |
  | :--- | :--- | :--- |
  | **1. Definitional Status** | The criterion for "skyhook" is not statable in advance. It is a post-hoc evaluative label applied to explanations already judged inadequate on other grounds. | The criterion is structural and checkable in advance: an explanation is a skyhook iff the mechanism's operation requires the specific design-feature it purports to explain. |
  | **2. Application to Dennett's Cranes** | R's structural criterion is too strict; it classifies Dennett's own cranes (Natural Selection, Operant Conditioning) as skyhooks because they require pre-existing competence (fidelity, value representation). | Dennett's cranes pass the criterion because they rely on *minimal* competence to generate *high-level* competence. The discontinuity breaks the circularity; only explanations requiring *equivalent* competence fail. |
  | **3. Normative Force** | Because the criterion is unstable, calling something a "skyhook" is primarily a rhetorical move to dismiss a view without engaging its internal mechanics. | Because the criterion identifies a specific structural flaw (circularity), calling something a "skyhook" is a valid methodological constraint that flags a failed reduction. |

  #### III. Cruxes and Pre-Registered Predictions
  *We identify the following sub-questions as decisive. Settling these moves one of us toward the other's position. We record predictions now to check later.*

  **Crux 1: The Bootstrap Threshold**
  *Question:* Does a mechanism fail the "presupposition" test if it requires *any* instance of the feature being explained, or only if it requires the *full* instance?
  *Concrete Case:* **Natural Selection.** To begin, selection requires replicators with fidelity. Fidelity is a form of "design" or "competence."
  *   **[User] Prediction:** If fidelity counts as design, Natural Selection fails R's criterion. Therefore, R's criterion is false (too strict).
  *   **[R] Prediction:** Fidelity is a "floor" competence, distinct from the "ceiling" competence (adaptation) being explained. Natural Selection passes. If [User] insists fidelity is design, [User] must admit no complex trait is explainable without magic.
  *   **Adjudication:** If [R] cannot define the floor/ceiling distinction without referencing the *quality* of the explanation (rather than the structure), [User] wins Crux 1.

  **Crux 2: Logical vs. Causal Presupposition**
  *Question:* Do "presupposing the explanandum" and "begging the question" name the same failure?
  *Concrete Case:** **Operant Conditioning.** To learn via reinforcement, an organism must already value reinforcement (e.g., find sugar rewarding).
  *   **[User] Prediction:** These are different failures. "Begging the question" is a logical flaw in an *argument*. "Presupposing the explanandum" in a *causal mechanism* is often unavoidable (you need structure to build structure). Conflating them makes the skyhook charge a category error.
  *   **[R] Prediction:** They are functionally equivalent in this context. If the causal mechanism relies on the very capacity (valuation) it is supposed to generate (meaning/goal-directedness), the explanation is vacuous regardless of whether it's framed as logic or causality.
  *   **Adjudication:** If we can describe a causal loop that is non-vacuous but presupposes the explanandum (e.g., a self-correcting code), [User] wins Crux 2. If all such loops are deemed vacuous, [R] wins.

  **Crux 3: Falsifiability of the Label**
  *Question:* Can [User] imagine a specific explanation they would accept as a "crane" that [R] would reject as a "skyhook" based on the criterion alone?
  *Concrete Case:** **Memetic Selection.** Dennett uses this to explain language meaning.
  *   **[User] Prediction:** No. Any explanation [R] accepts as a crane, I will accept as a crane. Any explanation I reject, I will call a skyhook. The term adds no predictive power over "good/bad explanation."
  *   **[R] Prediction:** Yes. I might accept a specific neuro-computational model as a crane that [User] rejects for unrelated reasons (e.g., qualia). The criterion constrains *my* acceptance independently of my prior preferences.
  *   **Adjudication:** We will review three recent papers on cultural evolution in six months. If [R] rejects a paper solely due to the structural criterion despite liking the conclusion, [R] wins Crux 3.

  #### IV. Diagnosis of Verbal vs. Substantive Dispute
  We conclude that a portion of this dispute is **verbal**, specifically regarding the scope of "design."
  *   If "design" means *any* functional order (including chemical fidelity), then [User] is correct that all cranes are skyhooks, and the distinction collapses.
  *   If "design" means *high-level, specified complexity* (adaptations, semantics), then [R] is correct that a distinction exists, but [User] is correct that Dennett often slides between these definitions to protect his favorite cranes.

  The substantive dispute remains: **Is there a non-arbitrary line between "floor competence" and "ceiling competence"?** If yes, the crane/skyhook distinction is a vital tool for evolutionary explanation. If no, it is a motivated vocabulary for preferring reductionist narratives. We commit to resolving Crux 1 before further engaging Crux 3.

