answer: |-
  Here is a principle constructed to reproduce your specific pattern of verdicts. It modifies Lewis's structural analysis by incorporating functional awareness and distinguishing coordination from enforcement. I call it the **Functional Coordination Principle**.

  ### The Principle

  A regularity $R$ in a population $P$ is a **convention** if and only if:

  1.  **Arbitrariness:** There exists at least one alternative regularity $R'$ that could have solved the same recurrent situation.
  2.  **Coordination Preference:** Nearly everyone prefers general conformity to $R$ on the condition that others conform, *and* this preference is not sustained primarily by the threat of external sanctions or independent moral obligation.
  3.  **Functional Awareness:** Participants conform because they believe $R$ resolves a current uncertainty or friction in interaction, even if the historical origin of $R$ is forgotten.
  4.  **Salient Expectation:** It is sufficiently believed by participants that others conform and expect conformity, such that this belief alone sustains the behavior, without requiring strict common knowledge across the entire population.

  ---

  ### Clause-by-Clause Breakdown

  **Clause 1: Arbitrariness**
  *   **Motivating Case:** *The Passage in the Smallest Building.*
  *   **Work Done:** This excludes regularities dictated by physical necessity. In the passage, waiting is the *only* solution; there is no $R'$ (e.g., "everyone goes up simultaneously") that is physically viable. Without this clause, the word "convention" would indeed swallow every regularity in the world, including gravity. This clause ensures conventions are *choices* among equilibria, not the *only* equilibrium.

  **Clause 2: Coordination Preference**
  *   **Motivating Case:** *The Forum Rule Against Double-Posting (Deterrence)* and *Dishes in the Rack (Trap).*
  *   **Work Done:** This is the scalpel that separates conventions from norms and traps.
      *   In the **Deterrence** case, members conform not because they prefer the rule conditional on others' conformity, but because they fear mockery and stripped rights. As you noted, they would double-post if nothing came of it. This clause excludes regimes where conformity is bought by punishment rather than mutual benefit.
      *   In the **Dishes** case, everyone prefers the *alternative* (using the machine) but is trapped by the fear of being the sucker. This is a Prisoner's Dilemma, not a Coordination Game. This clause ensures that in a convention, the conformity itself is the preferred outcome, provided others join in.

  **Clause 3: Functional Awareness**
  *   **Motivating Case:** *The Red Thread.*
  *   **Work Done:** This is the most significant departure from Lewis. Lewis cares only that the expectation exists; you care *why* it exists. The Red Thread fails this clause because the participants (nobody under fifty) do not understand what coordination problem the thread solves. They conform out of superstition or fear of resentment, not because they recognize it as a solution to a *current* uncertainty. A convention requires that the participants view the regularity as a tool for interaction, not just a talisman. This clause allows you to say it "ceased to be a convention" when the meaning died, even if the behavior persisted.
      *   *Note on Signatures:* This clause admits the **Email Signatures** case. Even if the stakes are low, participants recognize the function: it signals tone and membership. It solves the "how do we address each other" friction.

  **Clause 4: Salient Expectation**
  *   **Motivating Case:** *The Greeting Ritual in the Larger Forum.*
  *   **Work Done:** This relaxes Lewis's strict "Common Knowledge" requirement. In a population of thousands, strict common knowledge (I know that you know that I know...) is impossible. However, visible account-age markers and gossip create *salience*. If the belief is widespread enough to guide action, it counts. This clause allows the principle to describe a society, not just a village.

  ---

  ### Verdicts on Unlisted Cases

  **1. A Regularity Arising by Pure Drift (No Problem)**
  *   **Verdict:** Not a convention.
  *   **Reasoning:** Fails Clause 3 (Functional Awareness). If there was never a problem solved, and participants do not perceive one, it is merely a **habit** or **cultural drift**. Conventions are tools; if there is no job, there is no tool.

  **2. A Rule a Small Subgroup Follows Perfectly, Rest Tolerates**
  *   **Verdict:** A **Subgroup Convention**, but not a convention of the population $P$.
  *   **Reasoning:** Fails Clause 4 (Salient Expectation) relative to the whole population. If the majority merely "tolerates" it without adopting the expectation for themselves, the regularity does not govern the population's interactions. It is a local custom within a broader culture.

  ---

  ### Convention vs. Norm: Kind or Continuum?

  Under this principle, Convention and Norm (in your sense of the Deterrence case) are **different kinds of things**, distinguished by the source of compliance (Clause 2).

  *   **Convention:** Compliance is driven by *interdependent preference*. I do it because you do it, and we are both better off matching.
  *   **Norm/Regime:** Compliance is driven by *external sanction* or *moral duty*. I do it because if I don't, you will hurt me, or because I believe it is "Right" regardless of what you do.

  They are not positions on a continuum. A regularity can shift from one to the other (e.g., if the Staircase rule began to be enforced by shaming rather than mutual convenience, it would cease to be a convention and become a norm), but at any snapshot, the mechanism of stability is distinct.

  ---

  ### History vs. Equilibrium

  Your intuition on the **Red Thread** reveals that **history matters**. A snapshot of equilibrium structure (everyone conforms, everyone expects) cannot distinguish the Staircase from the Red Thread. Both look identical in equilibrium.

  To deliver your verdict, the principle must be **diachronic** (Clause 3). We must ask: "Do the participants understand this as solving a problem?" That understanding is a historical artifact. If the knowledge of the problem is lost, the convention dies, even if the behavior lives. Lewis's ahistorical analysis cannot save the Red Thread verdict; it forces you to call it a convention. My principle sacrifices Lewis's structural purity to save your historical intuition.

  ---

  ### The Frank Statement: What This Principle Costs

  You asked for honesty regarding the trade-offs. A spare principle saves nine cases; a baroque one saves eleven. Here is where this principle strains:

  **1. The Signatures Case (The Weak Link)**
  *   **The Cost:** You admitted you doubt Lewis lets you call Signatures a convention ("nobody gains or loses anything"). My principle includes them under Clause 3 (Functional Awareness: social friction), but this stretches the definition of "Problem."
  *   **The Verdict:** If you demand a *material* coordination problem (like the Staircase), Signatures must be excluded. They are better classified as **Stylistic Mimicry**. To keep them as Conventions, we must accept that "avoiding social awkwardness" counts as a coordination problem. I have chosen to include them to match your desire, but be aware this makes the definition of "problem" very thin.

  **2. The Red Thread Case (The Theoretical Cost)**
  *   **The Cost:** To say the Red Thread is *not* a convention, we must insist that participants understand the *function*. Lewis would argue that if the behavior sustains itself via expectations, it *is* a convention, regardless of whether they know *why* it started.
  *   **The Verdict:** By excluding the Red Thread, we admit that **meaning** is more important than **structure**. This makes the principle sociological rather than game-theoretic. It saves your verdict, but it moves away from Lewis's clean mathematical definition.

  **3. The Deterrence Case (The Gain)**
  *   **The Gain:** This principle successfully separates the **Subject-Thread Rule** (Convention) from the **No-Double-Post Rule** (Norm). Lewis struggles here because both look like equilibria. Clause 2 (Coordination Preference vs. Sanction) does the heavy lifting. This is the strongest success of the principle.

  **Summary of Trade-off:**
  I have chosen the **baroque principle** that saves all eleven of your verdicts.
  *   **Forfeited:** Theoretical elegance and Lewis's strict Common Knowledge.
  *   **Gained:** The ability to distinguish between a living coordination tool (Staircase), a dead ritual (Red Thread), and a police regime (Double-Posting).

  If you prefer a spare principle, you must drop Clause 3 (Functional Awareness). If you do, the **Red Thread** becomes a convention again. You would have to accept that a convention can be a "zombie"—structurally alive but functionally dead. Given your fourteen months of observation, I suspect you would find that acceptance intolerable. Keep Clause 3.
