      *   *The Trap:* If the group votes "Yes" on PBR, but the SR mechanism forces a retraction of that vote to maintain consistency with substantive outcomes, the group ends up believing "We should use PBR" while *using* SR.
      *   *Steelman:* This isn't unique to SR. If a group uses PBR but the majority on premises leads to a conclusion the majority rejects, they are effectively violating the spirit of PBR (which is usually to respect the conclusion derived from premises).
      *   *Better Argument:* The procedural proposition is just a constraint. If the vote on procedure conflicts with the substantive votes, SR forces a choice. If the group votes "Use PBR" early, but later substantive votes force a retraction, the group effectively decides "We *thought* we wanted PBR, but consistency demands we act otherwise." This is rational dynamic belief revision. It survives because it treats procedural norms as fallible commitments subject to the same consistency constraints as factual claims.
