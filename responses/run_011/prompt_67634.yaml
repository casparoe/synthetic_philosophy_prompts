  A municipal licensing board is petitioned to revoke the business license of "Heritage Stewardships," a firm organizing private domestic contracts where consenting adults lease themselves as live-in subordinates to wealthy clients. Public outrage focuses intensely on the contracts' requirement that stewards perform daily ritualized prostration and address clients as "Sovereign," features critics condemn as degrading neo-feudalism yet which cause no physical or financial injury to the participants. However, a severable clause in these same private contracts systematically shields the stewards' income from pre-existing child support garnishments, causing demonstrable financial deprivation to the clients' estranged spouses and children who are non-consenting third parties. The injury occurs entirely within private residences and is detectable only through compelled disclosure and audit of the intimate contractual terms, prompting a proposal for intrusive regulatory oversight to trace the asset shielding.

  **Analysis of Theoretical Inversion**
  Devlin is barred from suppressing the practice because his "reasonable man" test distinguishes between private immorality and public harm. While the prostration provokes revulsion, it occurs in private between consenting adults; Devlin's commitment to the "protection of private life" prevents legislating against this harmless moral vice unless it threatens society's integrity, which mere private ritual does not. Furthermore, while the financial harm is real, Devlin's caution regarding "slow legal change" and the limits of state intrusion means he would likely deem the compelled audit of private intimate contracts too disproportionate an invasion of the private sphere to remedy individual financial disputes that do not signify societal disintegration. Hart, conversely, is licensed to demand the intrusive audit. His harm principle is neutral regarding morality; since identifiable third parties suffer demonstrable injury (financial deprivation of children), the state is not only permitted but obligated to prevent it. For Hart, the privacy of the contract is secondary to the prevention of harm, justifying the intrusive disclosure that Devlin's privacy commitments forbid.

  **The Feature Doing the Work**
  The **severability** of the morally revulsive feature (ritualized prostration) from the harmful feature (asset shielding).

  **Removal Consequence**
  If you remove this feature by making the object of revulsion coincide with the locus of injury (e.g., the prostration itself causes physical injury or the ritual *is* the mechanism of fraud), the distinction collapses. Both theorists would then support suppression: Devlin because the moral vice now visibly harms society's fabric, and Hart because the act itself directly causes harm.

  **Strongest Devlin Partisan Reply**
  A Devlin partisan could argue that the intrusive audit required to track the financial harm destroys the trust and privacy necessary for private associations to function, thereby causing a greater long-term injury to the social fabric (the integrity of private life) than the financial loss inflicted on the estranged spouses, thus failing the utilitarian calculus within Devlin's own defense of moral enforcement.
