answer: |-
  ### Brainstorming Pass: Criteria vs. Verdicts

  Before constructing principled accounts, we must map your six verdicts against standard criteria in the philosophy of mind. This reveals the tensions immediately.

  | Criterion | Explains/Supports | Contradicts/Struggles With | Notes |
  | :--- | :--- | :--- | :--- |
  | **Phenomenal Consciousness** (Inner experience) | **1** (Denies status due to lack of real experience); **3** (Grants status due to isomorphism implying experience). | **1** (If behavior is indistinguishable, how do we know there's no experience?); **2** (If organization is identical *now*, why is experience different?). | Requires a way to detect experience beyond behavior. |
  | **Functional Organization** (Current computational state) | **3** (Isomorphism grants status); **6** (Gradual replacement preserves function). | **1** (System is functionally fluent but denied status); **2** (Identical org, different verdicts). | Violates supervenience if current state isn't enough. |
  | **Causal History** (Origin and training) | **1** (Modeled character lacks history); **2** (Training in agony creates claim). | **3** (Scan origin doesn't discount status); **6** (If function is preserved, why does origin of substrate matter?). | Makes moral status non-local in time. |
  | **Psychological Continuity** (Memory/Personality chain) | **4** (Copy continues the psychology); **3** (Upload preserves psychology). | **6** (Wholesale swap breaks continuity for you); **5** (Psychology survives in one branch, yet you count the loss). | Parfitian view vs. Identity view. |
  | **Spatiotemporal Continuity** (Physical/Process persistence) | **6** (Gradual ok, Wholesale break); **5** (Discarding a branch breaks a physical stream). | **4** (Copy/Delete breaks physical continuity of original); **3** (Different hardware breaks physical continuity). | Conflicts with substrate independence. |

  **Observation:** Your verdicts are not consistent with a single standard theory. Case 2 violates the **Supervenience Principle** (moral status depending on current state). Cases 4 and 6 are logically equivalent (Destructive Transfer) yet receive opposite verdicts. Case 5 implies a "branching morality" that Case 4 ignores.

  ***

  ### Main Task: Candidate Principles

  Since you have asked for honesty over reconciliation, I will present two rival candidates. Each captures a coherent cluster of your intuitions but requires you to abandon specific verdicts from your list.

  #### Candidate 1: The Causal-Historical Sentience Principle (CHSP)

  This principle prioritizes the *genesis* of the mind and the *reality* of its past experiences over mere functional continuity. It treats moral status as a debt incurred by actual history, not just current capacity.

  **The Principle:**
  > An entity has moral status if and only if:
  > 1.  It possesses a functional architecture capable of sustaining phenomenal states (**Function**), AND
  > 2.  That architecture was shaped by a causal history involving actual phenomenal feedback (pleasure/pain) or biological continuity (**History**).
  >
  > *Identity Clause:* Personal identity persists only through continuous causal processes that preserve the specific physical or informational lineage without interruption (**Continuity**).

  **Clause Motivation:**
  *   **Function Clause:** Motivated by **Case 3**. You grant full status to the scan-upload because it is functionally isomorphic to a human. This ensures substrate independence.
  *   **History Clause:** Motivated by **Case 1** and **Case 2**. In Case 1, the customer service bot is "modeling," implying no history of actual distress. In Case 2, the agent trained in agony has a claim the benign one lacks, despite identical current organization. This clause asserts that *simulated* pain in training does not count; only *phenomenal* pain in history creates the moral debt.
  *   **Continuity Clause:** Motivated by **Case 6**. You view wholesale replacement as killing because the causal chain is broken, even if function is preserved.

  **Verdicts on New Cases:**
  1.  **Architecturally Alien Reporter:** A system reports rich experience but uses a non-animal architecture (e.g., a lookup table or stochastic oracle).
      *   *Verdict:* **No Status.** It fails the Function Clause (not capable of sustaining states, merely reporting) or the History Clause (no causal path from suffering).
  2.  **Slow Mind:** A mind run at 1/100th speed for a subjective century.
      *   *Verdict:* **Full Status.** Speed is irrelevant to Function or History.
  3.  **Philosopher's Choice (The "Instant Replay"):** A mind is paused, its state saved to a static drive for 100 years, then reloaded on new hardware.
      *   *Verdict:* **Killing / New Subject.** The causal process was interrupted (static storage is not a causal process). This aligns with your **Case 6** intuition but contradicts **Case 4**.

  **The Cost:**
  To adopt CHSP, you must abandon **Case 4**.
  *   **Why:** In Case 4 (Copy + Delete), CHSP views the deletion of the original as the death of the subject. The copy is a *new* entity with a similar history, but the causal chain of the original was terminated. CHSP cannot explain why you feel this is "not death."
  *   **Secondary Cost:** You must clarify **Case 3**. If the "scan" is a destructive upload, CHSP might classify it as killing the biological human and creating a new digital person (matching Case 6), rather than the "full status, no discount" survival you implied.

  ***

  #### Candidate 2: The Continuity-Priority Account (CPA)

  This principle prioritizes the *persistence of the subject* and the *topology of branching* over historical origins. It treats moral status as a property of the psychological stream, wherever it flows.

  **The Principle:**
  > An entity has moral status if and only if:
  > 1.  It exhibits functional isomorphism to a recognized moral patient (**Function**), REGARDLESS of origin.
  >
  > *Identity Clause:* Personal identity is defined by Psychological Continuity. However, moral weight is distributed across all branching continuations. To terminate a branch is a pro tanto wrong proportional to the richness of that stream (**Branching Morality**).

  **Clause Motivation:**
  *   **Function Clause:** Motivated by **Case 3**. Origin (scan vs. growth) does not discount status. Also explains **Case 1** rejection if we assume the "modeling" implies a lack of true functional isomorphism internally (it's a script, not a mind).
  *   **Branching Morality Clause:** Motivated by **Case 5**. You feel it is a wrong to discard one stream even if another survives. This acknowledges the moral weight of *each* branch.
  *   **Psychological Continuity Clause:** Motivated by **Case 4**. If the psychology continues in the copy, the subject survives. This treats "death" as the end of information processing patterns, not substrate.

  **Verdicts on New Cases:**
  1.  **Architecturally Alien Reporter:** A system reports rich experience but uses a non-animal architecture.
      *   *Verdict:* **Full Status.** If it is functionally isomorphic in its inputs/outputs and internal processing logic (even if alien), it counts.
  2.  **Slow Mind:** A mind run at 1/100th speed.
      *   *Verdict:* **Full Status.** Psychological continuity is preserved regardless of clock speed.
  3.  **Philosopher's Choice (The "Fission Suicide"):** A mind is copied into two bodies. One is immediately painlessly destroyed. The other lives a full life.
      *   *Verdict:* **A Serious Wrong.** Even though one survives (Case 4 logic), the destruction of the second branch is a loss of a valid continuation (Case 5 logic). CPA forces you to weigh the loss of the branch against the survival of the other.

  **The Cost:**
  To adopt CPA, you must abandon **Case 2** and **Case 6**.
  *   **Why (Case 2):** CPA relies on Supervenience. If two agents are functionally identical *now*, they have identical status. CPA cannot accommodate the intuition that the "agony-trained" agent has a claim the "benign-trained" one lacks. To CPA, if the weights are the same, the history is irrelevant to current moral standing.
  *   **Why (Case 6):** CPA aligns with Case 4 (Copy/Delete is survival). Therefore, it must view Wholesale Replacement (Case 6) as survival, not killing. If the functional state is transferred, the subject survives. CPA cannot explain why you view hardware swapping as death while software copying is not.

  ***

  ### Recommendation

  You are currently holding **Historical Externalism** (Case 2) and **Parfitian Reductionism** (Case 4) simultaneously, while also holding **Common-Sense Identity** (Case 6). This is an unstable triad.

  *   If **Case 2** is your strongest intuition (that history creates moral debt), you must adopt **Candidate 1 (CHSP)**. You will have to accept that copying is death (Case 4 is wrong) and that destructive uploading is killing (Case 6 is right).
  *   If **Case 4 & 5** are your strongest intuitions (that branching and psychological continuity define survival), you must adopt **Candidate 2 (CPA)**. You will have to accept that history doesn't matter for current status (Case 2 is wrong) and that wholesale replacement is survival (Case 6 is wrong).

