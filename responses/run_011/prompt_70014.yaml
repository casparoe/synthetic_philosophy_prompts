answer: |-
  **Examination Question**

  **Course:** Advanced Topics in AI Alignment  
  **Module:** Scalable Oversight and Debate  
  **Time Allowed:** 90 Minutes  

  **Question 4**  
  The debate-based approach to alignment posits that AI safety can be achieved by training agents to argue over claims before a human judge, relying on the assumption that honest arguments will outperform deceptive ones. However, the phenomenon of obfuscated arguments—where locally plausible steps compose into a globally invalid conclusion—poses a structural threat.

  Write an essay that:  
  1.  Identifies the specific assumption in the amplification story that obfuscation undermines.  
  2.  Specifies the necessary conditions regarding the judge's capabilities and the class of tasks for the debate framework to remain viable against this threat.  
  3.  Assesses the extent to which idealized complexity-theoretic results about optimal debate inform our understanding of a realistically bounded human judge.  

  Distinguish clearly between settled structural limitations and contested proposals for mitigation.

  ***

  **Model Answer**

  Obfuscated arguments represent a critical failure mode for debate-based alignment because they sever the link between local verification and global truth. In the standard amplification story, complex tasks are decomposed into sub-claims assumed to be directly verifiable by a human judge. The specific assumption undermined by obfuscation is the **transitivity of verification**: the belief that if every individual step in a reasoning chain appears valid to a bounded judge, the conclusion derived from those steps must also be valid. Obfuscation demonstrates that a deceptive agent can construct a chain of statements where each link is individually plausible (or too complex to refute in isolation) but collectively inconsistent or false.

  For the debate framework to survive this threat, two stringent conditions must hold. First, regarding the **judge**, it is necessary that the judge possesses capabilities beyond passive verification of isolated claims. Specifically, the judge must be able to enforce cross-examination protocols that force agents to commit to claims across different branches of the argument tree, thereby exposing global inconsistencies that local checks miss. Second, regarding the **class of tasks**, the framework is only viable if the tasks belong to a complexity class where verification is computationally easier than generation, or where obfuscation is structurally impossible. If the task space allows for arguments where finding a convincing lie is easier than finding the truth (a plausible scenario in general reasoning), debate fails regardless of agent optimality.

  This leads to the assessment of idealized results. Complexity-theoretic analyses often show that optimal debate allows a polynomial-time judge to verify claims in PSPACE. This is a **settled theoretical result**: given unbounded compute and perfect play, debate expands the verifiable set of claims. However, this tells us almost nothing about a realistically bounded human judge. The idealized result assumes the judge can perfectly process the protocol's output without cognitive overload. In reality, a bounded judge suffers from limited working memory and attention. Obfuscation exploits these cognitive bounds by increasing the complexity of the argument tree just beyond the judge's tracking capacity. Therefore, the idealized lower bounds on verification capability do not translate to upper bounds on safety in practice. The gap between the theoretical verifier (a logical machine) and the actual verifier (a cognitive agent) is where obfuscation succeeds.

  Finally, it is crucial to distinguish between settled limitations and contested mitigations. It is **settled** within the literature that obfuscation is a theoretical vulnerability inherent to any system relying on bounded verification of decomposed claims. The existence of such arguments is a mathematical possibility in any sufficiently expressive language. However, it is **contested** whether specific mitigation strategies, such as recursive cross-examination or mechanism design incentives, effectively neutralize this risk in practice. Some researchers argue that optimal play will naturally reveal obfuscation through inconsistency; others contend that if the obfuscation is sufficiently complex, the inconsistency remains hidden from any bounded judge regardless of cross-examination. Treating the efficacy of cross-examination as a proven solution rather than an open empirical question misrepresents the current state of the field.

  In conclusion, obfuscation undermines the transitivity of verification in amplification. Viability requires judges capable of global consistency checks and tasks where truth is easier to verify than falsehood. Idealized complexity results offer little comfort for bounded humans, and while the risk is settled, the solution remains contested.

  ***

  **Marking Scheme (Total: 20 Marks)**

  **1. Identification of the Undermined Assumption (4 Marks)**
  *   **Full Marks:** Explicitly identifies the assumption as the **transitivity of verification** (or equivalent: that local verifiability guarantees global correctness/fidelity). Must state that obfuscation breaks the link between step-wise plausibility and conclusion validity.
  *   **Typical Spoiler:** Candidates describe the debate setup generally or claim the assumption is merely that "humans are rational." Vague references to "trust" without linking local steps to global structure lose marks.

  **2. Conditions for the Judge (4 Marks)**
  *   **Full Marks:** Specifies that the judge must be capable of **cross-examination** or **global consistency checking** across argument branches, not just isolated step verification. Must imply the judge needs to track commitments over time.
  *   **Typical Spoiler:** Candidates suggest the judge simply needs to be "smarter" or "more informed" without specifying the structural capability (cross-examination/commitment tracking) required to catch obfuscation.

  **3. Conditions for the Task Class (4 Marks)**
  *   **Full Marks:** Notes that tasks must belong to a class where **verification is easier than generation** (or where obfuscation is computationally hard). Must acknowledge that for general reasoning, this condition may not hold.
  *   **Typical Spoiler:** Candidates claim debate works for "all tasks" or fail to mention the computational asymmetry between generating lies and verifying truth.

  **4. Assessment of Idealized vs. Bounded Results (4 Marks)**
  *   **Full Marks:** Clearly distinguishes between the **settled complexity result** (PSPACE verification with optimal play) and the **bounded reality** (cognitive limits/working memory). Must conclude that idealized results do not guarantee safety for bounded judges.
  *   **Typical Spoiler:** Candidates treat the PSPACE result as proof that debate works in practice, or conversely, dismiss the theoretical result entirely without explaining the disconnect (boundedness).

  **5. Distinction Between Settled and Contested (4 Marks)**
  *   **Full Marks:** Clearly demarcates that the **existence of the vulnerability** is settled, while the **efficacy of mitigations** (like cross-examination) is contested. Must not present mitigation as a solved problem.
  *   **Typical Spoiler:** Candidates present cross-examination as a definitive solution (consensus) or treat the vulnerability itself as merely hypothetical/unproven. Failure to separate structural facts from empirical hopes loses marks.
