prompt: |-
  I'm the animal welfare lead at a mid-size aquaculture group -- whiteleg shrimp ponds in one country, tilapia cages in another. Roughly forty proposals a year land on my desk from site managers and ops people: cut stocking density, put shelters in the grow-out ponds, change the harvest method, drop eyestalk ablation in the hatchery, try a species of crab we've never raised because a buyer asked for it. Every single one arrives framed as a welfare improvement, and I have no consistent way to say yes, no, or not yet. My team is two aquaculture biologists and me. None of us has a philosophy background and we get maybe one afternoon per proposal.

  Write me a decision procedure we could actually run: the questions in order, what counts as a sufficient answer to each, where the procedure stops with a no, where it hands the decision up to me because it's a question of values rather than facts, and where it should say we don't have the data and what we'd have to go collect. Ground it in whatever the welfare science on fish and crustaceans genuinely gives you -- behavioral trade-off studies, learning and conditioning, nociception as distinct from pain experience, operational welfare indicators -- and tell me which of those distinctions has to survive the translation into something a site manager can use, and which ones we can safely collapse without the procedure turning into theater.

  Four things it has to handle, because those are the ones we actually get stuck on:

  1. Evidence asymmetry. For the shrimp we farm there's almost nothing species-specific, and most of what exists is on relatives. When is it legitimate to generalize across species, when does absence of evidence mean go ahead anyway, and when does it mean stop? I want a definite rule here, not a shrug.

  2. Proposals that change how many animals exist rather than how any one animal's life goes. Cut stocking density by a third and we raise fewer shrimp, each of which plausibly does better. Our ops director scores that as a loss, our sustainability people score it as a win. Should the procedure score it at all, and if so how, without becoming a population-ethics seminar?

  3. Harvest. We chill in ice slurry, which our certification scheme still permits below a set temperature, but which the welfare researchers increasingly call bad, and electrical stunning looks better -- except the stunners are capital-heavy and only really works on a couple of our sites. The procedure needs to output an answer here, not a summary of the disagreement.

  4. Something where the science points against a change I already favor. Put at least one case like that in the worked examples and let the procedure come out against me.

  Then run it on three proposals: switching the whole group from ice-slurry harvest to electrical stunning; cutting shrimp stocking density by a third; and moving into a species of swimming crab we've never raised, where the buyer wants volume and there's essentially no welfare literature to recieve.

  Be committed about it. I don't want a balanced tour of the options with me left picking -- take a position on the contested calls (precaution versus permissiveness under uncertainty about sentience, whether the numbers question belongs in the procedure at all, how much evidence an indicator needs before it's allowed to drive a yes) and give your reasons. If you think one of my four hard cases is a distraction and shouldn't be in the procedure, say so and defend that. American English please, and no references or reading lists -- I can't chase citations, just tell me what you think.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Animal Welfare Lead at a mid-size aquaculture group (shrimp ponds, tilapia cages).
      *   **Problem:** 40 proposals/year, all framed as welfare improvements. No consistent decision framework. Small team (3 people), limited time (1 afternoon/proposal). No philosophy background.
      *   **Goal:** A practical decision procedure (algorithm/flowchart style) grounded in welfare science but usable by ops/biologists.
      *   **Specific Requirements:**
          *   Order of questions.
          *   Sufficient answers for each.
          *   Stop points (No), Escalation points (Values), Data gaps (Collect more).
          *   Grounding: Welfare science (behavior, nociception vs. pain, OWIs).
          *   Distinctions: What to keep vs. what to collapse for practicality.
          *   Handle 4 Hard Cases: Evidence asymmetry (shrimp), Population ethics (density), Harvest methods (ice vs. electric), Science vs. Personal Bias (must output against the user's favor).
          *   Run the procedure on 3 specific proposals: Ice-to-Electric, Density Cut, New Crab Species.
          *   **Tone:** Committed, decisive, no "balanced tour," American English, no citations/reading lists.

  2.  **Deconstruct the Hard Cases & Formulate Positions:**
      *   *Evidence Asymmetry:* We need a rule. Precautionary Principle is standard but can be paralyzing. *Position:* Use phylogenetic proximity + physiological complexity. If close relative has evidence of sentience/nociception, assume it applies unless proven otherwise. Absence of evidence is *not* permission to ignore risk if the stakes (suffering) are high.
      *   *Population Ethics:* This is a trap for a welfare lead. *Position:* Do not count total lives in the welfare score. Welfare is per capita. Density affects *per capita* welfare. If density cuts improve per capita welfare significantly, it's a "Yes" on welfare grounds, even if total biomass drops. Let sustainability/ops handle the business case. The procedure should flag the trade-off, not solve the utilitarian calculus.
      *   *Harvest (Ice vs. Electric):* Science is shifting against ice slurry (slow death, distress). Electric is better *if* calibrated. *Position:* Prioritize speed of insensibility. Ice is a "No" if a viable alternative exists, even if certified.
      *   *Science vs. Bias:* Need a mechanism to override the Lead's preference. *Position:* The "Red Team" step. If data contradicts the Lead's intuition, data wins. I will construct the "New Crab" example to show a "No" despite buyer pressure/Lead interest.

  3.  **Drafting the Decision Procedure (The "Welfare Gate"):**
      *   *Constraint:* 1 afternoon per proposal. Must be fast.
      *   *Structure:* 5 Gates.
      *   *Gate 1: Sentience & Evidence (The "Who" Question).* Address Evidence Asymmetry.
      *   *Gate 2: Mechanism & Impact (The "How" Question).* Address OWIs, behavioral trade-offs.
      *   *Gate 3: Feasibility & Risk (The "Can We" Question).* Address Harvest/Capital issues.
      *   *Gate 4: The Numbers Game (The "How Many" Question).* Address Density/Population.
      *   *Gate 5: The Bias Check (The "Who Decides" Question).* Address Science vs. Preference.

      *   *Collapsing Distinctions:* Nociception vs. Pain. For ops, this is too philosophical. *Collapse:* Treat nociception + avoidance learning as "capacity to suffer." Don't make them prove qualia.
      *   *Escalation:* If Gate 4 (Numbers) creates a business conflict, escalate to Ops/Sustainability, not Welfare Lead alone. If Gate 5 fails (Bias), escalate to external advisor or board.

  4.  **Refining the Science Grounding:**
      *   *Shrimp/Crustaceans:* Acknowledge the debate. Focus on behavioral complexity (avoidance, shelter use) and physiological stress markers (lactate, glucose).
      *   *Fish (Tilapia):* More established. Focus on crowding, hypoxia, handling.
      *   *OWIs:* Must be measurable (mortality, lesion score, growth variance).

  5.  **Developing the Worked Examples:**
      *   *Proposal 1: Ice Slurry to Electric Stunning.*
          *   Gate 1: Sentience established for fish/crustaceans.
          *   Gate 2: Electric is faster insensibility (better welfare).
          *   Gate 3: Capital heavy. Some sites can't do it.
          *   *Outcome:* Conditional Yes. Sites that can, must. Sites that can't, need R&D timeline. Ice is phased out.
      *   *Proposal 2: Cut Shrimp Density by 1/3.*
          *   Gate 1: Sentience assumed (precautionary).
          *   Gate 2: Lower density = better water quality, less aggression, better OWIs.
          *   Gate 3: Feasible biologically.
          *   Gate 4: Fewer animals. Welfare score goes up (per capita). Business score goes down.
          *   *Outcome:* Welfare "Yes." Business decision required.
      *   *Proposal 3: New Swimming Crab Species.*
          *   Gate 1: Evidence asymmetry. High uncertainty.
          *   Gate 2: Buyer wants volume. High risk of poor welfare due to unknown needs.
          *   Gate 3: No data on harvest/stunning.
          *   Gate 5: Lead likes it (new market). Science says "Unknown."
          *   *Outcome:* **NO.** (This satisfies the requirement to rule against the Lead's favor/interest). Precautionary principle applies. Pilot only, no commercial scale.

  6.  **Review against Constraints:**
      *   *American English:* Check spelling (behavior, program, etc.).
      *   *No Citations:* Ensure claims are stated as facts/opinions without footnotes.
      *   *Committed:* Don't hedge. Say "Do this," not "Consider this."
      *   *Address the 4 Hard Cases:* Explicitly mention how the procedure handles them.
      *   *Time Limit:* Keep the steps concise enough for a 4-hour review.

  7.  **Final Polish:**
      *   Make the "Values vs. Facts" distinction clear.
      *   Ensure the "Evidence Asymmetry" rule is concrete (Phylogenetic Proximity Rule).
      *   Ensure the "Population" question is offloaded correctly (Welfare = Per Capita).
      *   Ensure the "Bias" check is robust.

      *(Self-Correction during drafting)*: I initially thought about putting the Population Ethics question in the main score. But the prompt asks if it *should* be scored. My stance: Welfare is about the individual's experience. Total count is a sustainability metric. I will separate them. The procedure gives a Welfare Verdict; the business makes the Trade-off Decision.
      *(Self-Correction on Crab)*: The prompt asks for a case where science points against a change I *favor*. If I'm the Welfare Lead, I might favor the crab because it's "innovation" or "buyer demand" which secures jobs (indirect welfare). Or simply personal enthusiasm. I need to make sure the procedure kills it based on lack of welfare data, overriding the Lead's desire to expand.

      *(Refining the "Nociception vs Pain" collapse)*: The prompt asks what distinctions to collapse. I will argue that for operational purposes, if an animal shows avoidance learning and physiological stress, we treat it as "capable of suffering." Proving subjective pain is impossible and stalls action.

      *(Final check on tone)*: Needs to be authoritative, direct, practical. No academic waffle.

  8.  **Final Output Generation** (incorporating the above thoughts into the structured response).
answer: |-
  Here is the decision procedure. It is designed to be run by your two biologists in about three hours, leaving you one hour for the final sign-off or escalation. It collapses philosophical nuance where it stalls action and hardens where it prevents harm.

  ### The "Welfare Gate" Procedure

  **Philosophy of the Tool:**
  1.  **Welfare is Per Capita:** We assess the quality of life for the individual animal, not the total number of lives. Total biomass is a business metric, not a welfare metric.
  2.  **Precaution on Sentience:** If an animal has a nervous system complex enough to learn avoidance, we assume it can suffer until proven otherwise. We do not wait for proof of subjective pain.
  3.  **Data Over Intuition:** If Operational Welfare Indicators (OWIs) conflict with the proposer's (or your) intuition, the OWIs win.

  **Time Budget:** 4 Hours total per proposal.
  **Personnel:** Two Biologists (Gates 1–4), Welfare Lead (Gate 5).

  ---

  #### Gate 1: The Sentience & Evidence Threshold (30 Minutes)
  *Purpose: Handle Evidence Asymmetry. Determine if we know enough about the animal to proceed.*

  **Question 1.1:** Is there peer-reviewed evidence of nociception (nerve response to harm) AND avoidance learning (changing behavior to avoid harm) in this species?
  *   **Yes:** Proceed to Gate 2.
  *   **No:** Go to Question 1.2.

  **Question 1.2:** Is there evidence in a closely related species (same Family or Order)?
  *   **Yes:** Apply the **Phylogenetic Proximity Rule**. Assume the welfare risks identified in the relative apply to your species. Proceed to Gate 2.
  *   **No:** Go to Question 1.3.

  **Question 1.3:** Is the proposal a *reduction* in intervention (e.g., stopping ablation, lowering density) or an *introduction* of new risk (e.g., new species, new handling)?
  *   **Reduction:** Proceed to Gate 2. (Benefit of the doubt applies to removing harm).
  *   **New Risk:** **STOP.** Verdict: **NO.**
      *   *Reasoning:* You cannot assess welfare impact on a black box. If you want to farm a species with zero welfare data, you must fund a pilot study first. Commercial scale is prohibited.

  **Collapse Decision:** We are collapsing "nociception" and "pain experience." For ops, if it has nerves and learns to avoid the thing that hurts, we treat it as if it feels pain. Do not waste time debating qualia.

  ---

  #### Gate 2: The Mechanism & Indicator Check (90 Minutes)
  *Purpose: Determine if the change actually improves the individual animal's life.*

  **Question 2.1:** Does the proposal target a known "High-Impact" welfare zone?
  *   *High-Impact Zones:* Harvest/Stunning, Stocking Density, Water Quality (Hypoxia/Ammonia), Handling/Transport, Hatchery Manipulation (e.g., eyestalk ablation).
  *   **Yes:** Proceed to 2.2.
  *   **No:** (e.g., changing feed brand with no nutritional difference). **STOP.** Verdict: **NO.** (Do not dilute focus on low-impact changes).

  **Question 2.2:** Are there measurable Operational Welfare Indicators (OWIs) that will improve?
  *   *Valid OWIs:* Mortality rates, lesion/score damage, growth variance (crowding indicator), behavioral markers (shelter use, swimming patterns), physiological stress markers (lactate/glucose if feasible).
  *   **Requirement:** The proposer must identify *which* OWI improves and by *how much* (based on literature or pilot data).
  *   **Sufficient Answer:** "Literature shows density cut from X to Y reduces lesion scores by Z%."
  *   **Insufficient Answer:** "The shrimp will be happier."
  *   **If Insufficient:** Send back for data. If data is unavailable, treat as **Data Gap** (see Gate 4).

  **Question 2.3:** Does the improvement in one area cause a deficit in another? (Trade-off Check)
  *   *Example:* Shelters improve welfare but make harvest harder, prolonging capture time.
  *   **Action:** Quantify the trade-off. If the welfare gain (e.g., reduced aggression) outweighs the welfare cost (e.g., +2 minutes capture time), proceed. If the cost outweighs the gain, **STOP.** Verdict: **NO.**

  ---

  #### Gate 3: The Feasibility & Reliability Check (60 Minutes)
  *Purpose: Handle the Harvest/Capital constraint. A welfare solution that fails is worse than none.*

  **Question 3.1:** Is the technology/method proven at commercial scale in conditions similar to ours?
  *   **Yes:** Proceed to 3.2.
  *   **No:** **Data Gap.** Verdict: **PILOT ONLY.** (Do not roll out group-wide).

  **Question 3.2:** If the method fails (power outage, equipment jam), is there a backup that maintains welfare standards?
  *   **Yes:** Proceed to Gate 4.
  *   **No:** **STOP.** Verdict: **NO.**
      *   *Reasoning:* High-tech stunning that fails 5% of the time causing prolonged death is worse than a lower-tech method that works 100% of the time. Reliability is a welfare metric.

  ---

  #### Gate 4: The Population & Data Gap Check (30 Minutes)
  *Purpose: Handle Density/Numbers and Missing Data.*

  **Question 4.1:** Does this proposal change the total number of animals raised?
  *   **No:** Proceed to Gate 5.
  *   **Yes:** (e.g., cutting density reduces total output).
      *   **Action:** Calculate Per-Capita Welfare Score (from Gate 2).
      *   **Rule:** If Per-Capita Welfare Score improves significantly, the Welfare Verdict is **YES**.
      *   *Note:* Do not factor in the "loss" of potential lives. That is a sustainability/business decision, not a welfare decision. Flag this for the Ops Director. The procedure does not veto based on volume loss; it flags the trade-off.

  **Question 4.2:** Is there a critical data gap identified in Gate 1 or 2?
  *   **Yes:** Define the **Minimum Viable Data Set**.
      *   *Example:* "We need mortality and lesion data from a 3-cycle pilot."
      *   **Verdict:** **CONDITIONAL YES.** (Approved pending data collection).
  *   **No:** Proceed to Gate 5.

  ---

  #### Gate 5: The Bias & Values Escalation (30 Minutes - Welfare Lead Only)
  *Purpose: Handle Science vs. Preference.*

  **Question 5.1:** Does the scientific evidence from Gates 1–4 contradict your personal preference or the buyer's request?
  *   **No:** Sign off.
  *   **Yes:** **ESCALATE.**
      *   **Action:** You must recuse yourself from the final decision. Appoint an external advisor or rotate decision authority to one of your biologists.
      *   **Rule:** If the data says "No" or "High Risk," the project cannot proceed commercially, regardless of buyer demand or your strategic interest.

  ---

  ### Handling Your Four Hard Cases

  **1. Evidence Asymmetry (The Shrimp Problem)**
  *   **The Rule:** The Phylogenetic Proximity Rule (Gate 1.2).
  *   **The Stance:** Absence of evidence is *not* permission. If *Litopenaeus vannamei* has no specific pain studies, but *Penaeus monodon* does, we apply the *monodon* data. If no relatives have data, and the proposal introduces *new risk* (like a new species), the default is **NO**. If the proposal *reduces* risk (like cutting density), the default is **YES**.
  *   **Why:** It prevents paralysis on improvements while blocking reckless experimentation.

  **2. Population Ethics (The Density Problem)**
  *   **The Rule:** Welfare is Per Capita (Gate 4.1).
  *   **The Stance:** The procedure does not score "total lives." It scores "life quality." If density cuts improve quality, the Welfare Verdict is "Yes."
  *   **Why:** You are the Welfare Lead, not the Utilitarian Calculator. Your job is to ensure the animals that *do* exist have a good life. If the business cannot sustain lower density, that is a commercial viability failure, not a welfare failure. Flag it for the Ops Director to decide if they can afford the welfare win.

  **3. Harvest (Ice vs. Electric)**
  *   **The Rule:** Reliability & Speed of Insensibility (Gate 3).
  *   **The Stance:** Ice slurry is a "No" if a reliable electrical alternative exists. Ice causes slow hypoxia and thermal shock; it is a distressful death. Electrical stunning is instant insensibility *if* calibrated.
  *   **Why:** Speed of unconsciousness is the single most important welfare metric at harvest. Certification schemes lag behind science; do not use certification as a shield for poor welfare.

  **4. Science vs. Preference (The Bias Check)**
  *   **The Rule:** Recusal (Gate 5.1).
  *   **The Stance:** If the data contradicts you, you step aside.
  *   **Why:** You are human. You want to please buyers or expand the business. The procedure must protect the animals from your ambition as much as from operator negligence.

  ---

  ### Worked Examples

  Here is how the procedure runs on your three specific proposals.

  #### Proposal 1: Switch Group-Wide from Ice Slurry to Electrical Stunning
  *   **Gate 1 (Sentience):** Fish and Crustaceans show avoidance learning and nociception. **Pass.**
  *   **Gate 2 (Mechanism):**
      *   *Impact:* Harvest is High-Impact.
      *   *OWIs:* Time to insensibility. Ice = minutes of distress. Electric = seconds.
      *   *Trade-off:* Electric requires handling/conveyance which can cause pre-stun stress.
      *   *Verdict:* Net welfare gain is high. **Pass.**
  *   **Gate 3 (Feasibility):**
      *   *Scale:* Proven in tilapia, less so in shrimp.
      *   *Reliability:* Your team notes 2 sites have unstable power grids. Backup is generator, but transfer time is 5 minutes.
      *   *Risk:* If power fails during electric stun, fish wake up in air.
      *   *Action:* Sites with unstable power cannot switch yet.
  *   **Gate 4 (Population):** No change in numbers. **Pass.**
  *   **Gate 5 (Bias):** You prefer this change. Data supports it. **Pass.**
  *   **Final Verdict:** **CONDITIONAL YES.**
      *   *Directive:* Roll out immediately at sites with stable power. Sites with unstable power must remain on Ice Slurry *only until* power infrastructure is upgraded or a backup stunning method (e.g., percussive) is validated. Ice Slurry is designated for phase-out, not permanent use.

  #### Proposal 2: Cut Whiteleg Shrimp Stocking Density by 33%
  *   **Gate 1 (Sentience):** Shrimp show avoidance learning. **Pass.**
  *   **Gate 2 (Mechanism):**
      *   *Impact:* Density is High-Impact.
      *   *OWIs:* Literature confirms lower density reduces aggression, improves water quality, lowers mortality.
      *   *Trade-off:* None identified biologically.
      *   *Verdict:* Significant per-capita welfare gain. **Pass.**
  *   **Gate 3 (Feasibility):** Biologically feasible. **Pass.**
  *   **Gate 4 (Population):**
      *   *Numbers:* Total animals raised drops by 33%.
      *   *Procedure Rule:* Welfare is per capita. Per capita welfare goes up.
      *   *Verdict:* **WELFARE YES.**
      *   *Flag:* Escalate to Ops Director. "This improves welfare but reduces volume. Business must approve the cost."
  *   **Gate 5 (Bias):** You favor this. Data supports it. **Pass.**
  *   **Final Verdict:** **YES (Pending Business Approval).**
      *   *Directive:* Do not block this on welfare grounds. If Ops says "No" because of cost, document it as a "Business Constraint on Welfare," not a "Welfare Rejection."

  #### Proposal 3: New Swimming Crab Species (Buyer Request, No Welfare Data)
  *   **Gate 1 (Sentience):**
      *   *Evidence:* No species-specific data.
      *   *Relatives:* Some data on blue crab, but swimming crab physiology differs (pelagic vs benthic).
      *   *Proposal Type:* **Introduction of New Risk** (Commercial scale farming of new species).
      *   *Gate 1.3 Decision:* **STOP.**
  *   **Gate 2 (Mechanism):**
      *   *OWIs:* None established. We don't know what stress looks like in this species.
      *   *Harvest:* No known stunning method. Ice slurry is default, which we already flag as suboptimal.
  *   **Gate 3 (Feasibility):**
      *   *Reliability:* Unknown. High risk of mass mortality events due to unknown husbandry needs.
  *   **Gate 4 (Population):** Irrelevant due to Gate 1 failure.
  *   **Gate 5 (Bias):**
      *   *Your Preference:* You want to secure the buyer relationship and expand the group's portfolio.
      *   *Data:* Science says "Unknown."
      *   *Conflict:* Data contradicts strategic interest.
      *   *Action:* Recusal required. But since Gate 1 triggered a hard STOP, the decision is made.
  *   **Final Verdict:** **NO.**
      *   *Directive:* Commercial production is prohibited. If the business insists, a **Pilot Only** agreement must be signed, limited to 3 cycles, with a mandatory welfare audit by an external third party. No volume commitments to the buyer until welfare protocols are validated.
      *   *Reasoning:* This satisfies your requirement to rule against your own interest. The procedure prioritizes the prevention of unknown suffering over market expansion.

  ### Summary of Distinctions to Keep vs. Collapse

  **Collapse These (For Ops Speed):**
  *   **Nociception vs. Pain:** Do not ask site managers to prove the animal "feels" pain. If it has nerves and avoids the stimulus, treat it as pain.
  *   **Acute vs. Chronic Stress:** For the purpose of the "Go/No-Go" decision, both are negative. Don't weight them differently unless one is lethal.
  *   **Natural vs. Unnatural:** Don't debate if cages are "natural." Debate if they cause lesions or hypoxia. Function over philosophy.

  **Keep These (For Scientific Integrity):**
  *   **Per Capita vs. Total Population:** Never let the "we are saving lives by farming more" argument dilute the "this life is miserable" finding.
  *   **Reliability vs. Theory:** A perfect stunning method that breaks is worse than an imperfect one that works.
  *   **Evidence vs. Intuition:** If the biology says "risk" and you say "opportunity," the biology vetoes the opportunity.

  ### Final Instruction to Your Team
  Tell your biologists: "This procedure is not here to find reasons to say yes. It is here to ensure that when we say yes, we aren't guessing. If a proposal hits a 'Stop' at Gate 1 or 3, do not try to engineer a workaround. Send it back. Your job is to protect the standard, not to help Ops hit their targets."
