answer: |-
  The session succeeds only if they distinguish whether their equity weights value absolute improvement for the worse-off or relative narrowing of gaps, because the objection destroys the latter but leaves the former intact.

  **The Sequence**

  1.  **The Distinction (0–15 minutes):** Start immediately with the difference between weighting a benefit because of the person's absolute level (prioritarianism) and weighting it because of where they stand relative to others (egalitarianism). This must precede the objection because the levelling-down objection is a specific missile aimed only at the relative view; if they do not know which view their own models embody, the objection will either seem irrelevant or catastrophically destructive. Confirm that most distributional cost-effectiveness analysis uses absolute baseline severity, which mathematically aligns with prioritarianism, even if their verbal justification mentions inequality.
  2.  **The Example (15–30 minutes):** Introduce a single, static scenario to illustrate the distinction before deploying the objection.
      *   **The Setup:** Two patients, Alice and Bob. Health is measured in mobility scores from 0 to 10.
      *   **State 1:** Alice 10, Bob 4.
      *   **State 2:** Alice 4, Bob 4.
      *   **Constraints:** Specify this is a non-agential comparison of world states, perhaps due to a genetic shift, not a policy choice. No resources are transferred; no one is blinded by a doctor. The population is fixed. Do not use money, as it invites desert-based counter-arguments.
      *   **Why here:** You need them to feel the intuitive pull of State 1 (more total health, priority to the worse-off) versus State 2 (perfect equality) before you ask them to judge it.
  3.  **The Objection (30–45 minutes):** Ask them if State 2 is better than State 1 in any respect. When half say "yes, it's more equal," introduce the levelling-down objection: if equality is intrinsically valuable, State 2 must be better in at least one way, yet no one is better off and someone is worse off.
      *   **Misconception 1 (Recommendation):** Head this off immediately. State clearly that the objection is not a recommendation to make the well-off worse off; it is a test of whether equality is intrinsically valuable. If they treat it as a policy prescription, they are confusing valuation with allocation.
      *   **Misconception 3 (The Fudge):** When they argue State 2 is "better in one respect but not all things considered," challenge this distinction. Ask them to identify who benefits from the "equality respect" in State 2. If no individual benefits, the "respect" is free-floating. This primes them to see that without intrinsic value, the "respect" vanishes.
  4.  **The Pivot to Prioritarianism (45–60 minutes):** Address the justification of their equity weights.
      *   **Misconception 2 (Lost Justification):** Explain that rejecting intrinsic equality does not invalidate their weights. If their weights are based on absolute severity (the concave transformation of health), they are prioritarian. The weights survive because they value helping the worse-off, not narrowing the gap.
      *   **Misconception 4 (Prioritarian All Along):** This is the critical turn. Acknowledge what is right: their mathematical functions likely *are* prioritarian because they take individual baseline severity as input, not the gap. However, explain what it costs them to concede this: they must stop saying out loud that the goal is "narrowing health inequalities." They can say inequality narrows as a byproduct, but they cannot claim the narrowing itself is the normative good. If they cling to the rhetoric of inequality reduction, the levelling-down objection still bites them, regardless of their formula.
  5.  **Scope Limitations (60–65 minutes):** Openly refuse to cover three things. First, instrumental equality (e.g., equality leads to social stability), as the objection targets intrinsic value only. Second, deontic egalitarianism (fairness of process), as this is about outcome states. Third, sufficiencyarianism (getting everyone above a threshold), which is a distinct view again. Tell them you are skipping these so they do not mistake this seminar for a complete map of equity theory.
  6.  **The Check (65–75 minutes):** Run a fresh pair of distributions to test if the distinction has landed.
      *   **Option A:** Three people with health scores (10, 10, 10).
      *   **Option B:** Three people with health scores (12, 12, 9).
      *   **The Task:** Ask them to vote on whether Option A has any moral advantage over Option B.
      *   **Pass Response:** They vote "No" or argue Option B is better all things considered because the weighted sum is higher and no one is below a threshold, acknowledging that A's equality confers no residual value.
      *   **Fail Response:** They vote "Yes" or argue Option A is better "in terms of equality," indicating they still hold equality as an intrinsic value despite the objection.
      *   **Nuance:** If they say Option B is better all things considered but A is still "better in one respect," they have not fully accepted the prioritarian shift; they are retaining pluralist egalitarianism. Push them to confirm that without intrinsic value, the "respect" is illusory.

  **Timing Note:** Keep the example on the board throughout. Do not introduce new numbers until the final check. If you change the currency or the population size mid-seminar, they will focus on the arithmetic rather than the normative structure.
