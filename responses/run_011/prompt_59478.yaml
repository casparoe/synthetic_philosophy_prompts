answer: |-
  **The Fourteenth Line**

  The lobby smelled of lemon disinfectant and the wet dust of vacuumed carpet. It was 1:15 a.m. The ice machine in the vending alcove hummed with a rhythmic shudder that vibrated through the soles of my shoes. I sat behind the front desk, the glow of the property management system casting a pale rectangle on the darkened marble counter.

  Inside the night audit binder, beneath the cash reconciliation sheets and the key log, lay the card. It was ivory stock, laminated now to withstand the erasing, though the plastic was clouded in the center where my thumb rested. I had copied the grid by hand. Thirteen horizontal lines, ruled in red ink. Seven columns for the days, though I only worked the nights. I used a mechanical pencil, 0.5 millimeter, because the lead was hard enough to make a dot without smudging, but soft enough to be wiped away with the corner of a dry rag.

  I turned the page to the current week. Order. Silence. Sincerity. The virtues rotated weekly. This week was Industry. The precept was written in small block letters at the top: *Lose no time; be always employ'd in something useful; cut off all unnecessary actions.*

  I looked at the grid. There were spots already. Three on Monday, two on Tuesday. Today was Wednesday. I had not yet made a mark.

  At 2:00 a.m., the phone rang. It was the internal line from room 314. I answered. The voice on the other end was slurred, angry about the ice machine noise. I told him the machine was outside his door and he could just walk to the floor below. I said it too fast. I heard the sharpness in my own voice, the impatience that violated Silence, if not Industry. I hung up.

  I opened the binder. I moved the rag aside. I put a black dot on the line for Silence. It sat there, a small eye staring back.

  The act of marking took twelve seconds. In those twelve seconds, I was not being industrious. I was cataloging failure. I looked at the bottom of the card. Below the thirteenth line, separated by a quarter-inch of white space, was a fourteenth line. It had no label. It was for the faults committed in the course of recording the others. It was for the twelve seconds.

  The fourteenth line was blank. It had been blank for nine weeks.

  At 4:10 a.m., the side door opened. Brenda from regional was doing a surprise drop-in, supposedly to check the safe count before the morning shift arrived. She wore a windbreaker and carried a clipboard. She didn't say hello immediately; she just walked around the desk and leaned over my shoulder to watch the cash drawer count.

  She saw the card.

  "What's that?" she asked. She pointed with a pen capped in blue plastic.

  "Audit log," I said. I didn't look up from the bills.

  "Looks detailed for a audit log." She reached out and flipped the page back to Monday. "You tracking voids? Complimentary upgrades?"

  "Something like that."

  She tapped the cluster of dots on Monday. "You had six voids on Monday? That's high for a Tuesday night run."

  "Inventory," I said.

  She snorted. "You're trying to grind the whole head bright, Miller. Just get the edge sharp enough to cut the day. Nobody cares about the rest of the steel."

  She was quoting the old story, the one about the smith and the ax, but she used it like an insult. A warning against wasting time on polish. She counted the cash, signed the log, and left through the side door. The hum of the ice machine filled the silence again.

  I looked at the card. Brenda thought the dots were financial errors. She thought the density of the marks correlated to incompetence in the register. She didn't know that a clean line wasn't virtue; it was just a lack of observation.

  I looked at the fourteenth line again. It was pristine. The laminate was unscuffed there. For nine weeks, I had told myself that the blankness meant I had mastered the meta-game. I had thought I was recording my faults without incurring new ones. I had thought the observation was cost-free.

  But Brenda was right about the steel. You cannot polish without removing metal.

  I realized why the line was blank. It wasn't because I was perfect at recording. It was because I had stopped checking the line itself. To check the fourteenth line, I would need a fifteenth line to record the check. There was no fifteenth line. So I had stopped looking at the bottom. I had let the watchdog sleep.

  The realization hit me with the physical weight of the fatigue I had been holding off since 1:00 a.m. My shoulders tightened. The hum of the ice machine seemed to grow louder, pressing against my eardrums.

  If the fourteenth line was blank because I wasn't checking it, then the blankness was itself a fault. It was a fault of Negligence. But Negligence wasn't on the list. The list had thirteen items. Humility was the last one. *Imitate Jesus and Socrates.* That line never got a spot. I had never marked Humility. To mark Humility would be to claim I was humble enough to see my pride, which was prideful. So Humility stayed clean, a white bar at the bottom of the moral stack, above the fourteenth line.

  I picked up the pencil. The lead hovered over the fourteenth line.

  If I marked it now, I was admitting that I had been blind for nine weeks. I was recording the fault of not recording. But by recording it now, I was committing the fault of recording late. The timestamp would be 4:20 a.m. The fault occurred nine weeks ago. The grid was for daily faults.

  If I didn't mark it, the line stayed clean. The lie remained structural. The binder would close, the shift would end, and I would take the card home to wipe it clean on Sunday night. I would wipe the Industry spots. I would wipe the Silence spots. I would wipe the rag over the fourteenth line where there was nothing to wipe.

  The phone rang again. Room 202. Housekeeping needed a late checkout authorized. I answered. I spoke softly. I was polite. I was efficient. I hung up.

  I had just performed Industry perfectly. But I had done it while thinking about the line. My mind had been in the binder, not at the desk. I had been present for the guest only in body. That was a breach of Sincerity.

  I opened the binder. I moved the pencil to the line for Sincerity. I made a dot.

  The pencil moved down to the fourteenth line.

  To mark the fourteenth line was to break the system. The system relied on the closure of the grid. Thirteen virtues, seven days. A closed loop. The fourteenth line was a hack, a patch code I had written to fix a bug in the morality engine. But the patch had introduced a new vulnerability. If I marked it, I validated the hack. If I didn't, I validated the blindness.

  The laminate felt cold under my wrist. There was a smudge on the plastic near the top corner, a ghost of a dot from three weeks ago that I hadn't fully erased. I rubbed it with my thumb. It didn't come off. It was embedded in the plastic now, a permanent scar of a past failure.

  I looked at the clock. 4:45 a.m. The morning shift manager would be here in forty-five minutes. He would take the binder. He would glance at the cash count. He might glance at the card. If he saw a mark on the bottom line, he would ask what it was. I would have to explain. I would have to say it was for the recording. He would laugh. He would tell me I was overthinking it. He would tell me to just get the work done.

  If I left it blank, he would see nothing. He would assume the week was going well. He would assume I was managing the errors.

  The pencil tip touched the ivory surface. It made a tiny sound, like a footstep on dry snow.

  I thought about the ax. Brenda's comment. *Just get the edge sharp.* She wanted the work done. The hotel wanted the night audited. The guests wanted the ice. They didn't want the grid. The grid was for me. It was a private mechanism to scrape against the grain of my own behavior. But the scraping was making holes in the paper. The first book had been full of holes. That was why I moved to the laminate. To allow for infinite erasure. To allow for the illusion of a fresh start every week.

  But the fourteenth line had no eraser. It had no precept. It had no virtue to anchor it. It was just a space for the cost of the thing.

  If I marked it, I was saying the cost was real. If I didn't, I was saying the cost was zero.

  My hand shook. Not from caffeine, but from the static tension of the shift, the long hours of stillness broken by sudden bursts of activity. The ice machine kicked on, a loud clatter that made me flinch.

  I looked at the dot I had just made for Sincerity. It was dark. It was definitive. It said: *You lied about being present.*

  The fourteenth line waited. It was the only place on the sheet that acknowledged the observer. The other thirteen lines assumed the observer was invisible, godlike, infallible. The fourteenth line admitted the observer was human.

  But if I marked it, I had to mark it every time. Every dot on the upper thirteen lines generated a shadow on the fourteenth. If I filled the fourteenth line, it would be a solid black bar by Sunday. It would obscure the red lines. It would become the only thing visible.

  I lifted the pencil. I held it over the space. The lead was worn flat from the other marks. I could rotate it to make a finer point, but that would take time. That would be a fault of Industry.

  I thought about wiping the Sincerity mark instead. If I wiped it, I could claim I hadn't been insincere. I could claim I was focused. But the rag was on the other side of the keyboard. To reach for it would be conspicuous. It would look like I was correcting the record.

  The side door handle turned. I froze. It wasn't the manager; it was the security guard doing a perimeter check. He shone his flashlight through the glass, saw me, and nodded. He walked on.

  I was alone again.

  The pencil hovered. The tip was directly over the fourteenth line. The space was empty. It was the only clean thing left on the page.

  I pressed down. The lead did not break. It made contact with the laminate. I felt the friction. I could drag it across and make the line. I could put a dot in the column for Wednesday. I could admit the cost.

  Or I could lift the hand. I could close the binder. I could let the blankness stand as a testament to a perfection I hadn't achieved, but could pretend to have maintained. The blank line was a promise that I could watch myself without losing myself. It was a lie, but it was a clean lie.

  The hum of the ice machine stopped. The silence was sudden and heavy.

  I held the pencil there, feeling the weight of it, the balance point against my thumb. The tip darkened the ivory slightly, just from the pressure, leaving a ghost mark before the graphite even transferred.

  I waited for the shift to end. I waited for the sun to come up. I waited for the feeling to tell me which way to move.
