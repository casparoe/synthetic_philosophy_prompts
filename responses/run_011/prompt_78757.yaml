prompt: |-
  So here's the situation: two economists in my building have been sniping at each other in seminar for like three years, and the department chair finally got them to agree to sit down and produce one joint document, adversarial-collaboration style. I'm the poor grad student who has to draft it for them to edit, so I need a version that's actually good enough that neither one throws it back at me.

  The two camps, roughly:

  - One is a hard Robbins-style skeptic. Utility is at best ordinal within a person. Any statement like "A gains more than B loses" is either meaningless or an ethical judgment wearing a lab coat, and he thinks the compensation-test stuff in cost-benefit analysis proves it — the moment you have to actually decide whether to compensate, you're doing ethics, not measurement.
  - The other is a Harsanyi-style aggregationist. She thinks the representation theorems plus an impartiality/veil assumption genuinely deliver cardinal welfare that's comparable across people, and that the skeptic's position is self-undermining: he can't state a social ranking, or even object to one, without using the very comparisons he's banned.

  They agreed not to fight in the abstract, so the document has to be built around one concrete case, which is a lab protocol a postdoc here has been running. All the details you need are below — it's made up / unpublished, so don't try to recall anything about it, just reason from what I've written:

  Call it the "Meridian" matching task. Each subject first fixes a personal anchor by recalling a specific bad experience of their own (the instructions use a bad toothache) and rating it. Then they do two kinds of task. (1) Vignette ratings: given descriptions of outcomes — a month of chronic back pain, a year without a car, a week of nausea — they report each one in units of the anchor. (2) Duration trades: how much time in outcome X they'd accept to avoid one unit of the anchor experience, run at several magnitudes. Findings so far, with 240 subjects:

  - Within subjects, the duration trades are internally consistent in the right way — the implied trade ratios are stable enough that each person's scale is determined up to a positive affine transformation, i.e. up to their own zero and their own multiplier.
  - Across subjects, anchor-relative ratings correlate about 0.8 with ratings from a totally different anchoring task (matching the unpleasantness of outcomes to the loudness of a tone). She says that's evidence the common scale isn't arbitrary. He says a 0.8 correlation between two self-reports collected from the same person in the same session is evidence about response style, not about a shared quantity.
  - In one arm, subjects were shown the average anchor rating of previous subjects before answering. Their own anchor moved by a factor of about 1.4 on average, and the *shape* of their ratings barely changed — everything just got rescaled. His favorite result, obviously.
  - A small subgroup (11 people) reports near-total flat affect on standard scales. Under the protocol they come out with welfare changes that are almost zero for everything, including outcomes everyone else rates as catastrophic. The protocol has no independent way to say whether they really are barely affected or whether their anchor is just scaled differently. Nobody on either side likes this result.

  And the payoff case: a clinic has 100 courses of a therapy. Option one gives them to 100 people with a severe chronic condition, each getting a large anchor-relative improvement. Option two gives them to 2,000 people (over successive rounds) with a mild but constant condition, each getting a small anchor-relative improvement. Run through her aggregation, option two wins by a wide margin. Run through his framework, the question can't be asked at all, and the clinic should decide on something else entirely.

  What I want you to write is the document itself:

  1. A numbered list of claims both of them can sign — about what the representation theorems do and don't deliver, about what the protocol actually licenses, about the flat-affect subgroup, and about what the clinic case shows. These need to be substantive enough that signing costs each of them something, not bland stuff about utility being hard to measure.
  2. A disagreements table. Columns: the disputed claim, wording the skeptic would sign, wording the aggregationist would sign, and whether the gap is substantive or verbal. Each side's wording has to be phrased so their own side would actually accept it — not a straw version.
  3. The cruxes. I'm pretty sure one of them is whether the zero point and the multiplier can be fixed across people by anything other than an assumption, and another is what the anchor-shift arm is really evidence for. But find the ones I've missed, and for each crux give me (a) something both would agree bears on it — a further arm of the protocol, an argument, a thought experiment, whatever — and (b) each side's prediction, written down in advance so it can be checked.
  4. A short closing section saying plainly which parts of their three-year fight you think were just about what words like measurable and meaningful are allowed to do, and which parts are a real disagreement that more data could move.

  Tone: this is a document two people who dislike each other will both put their names on, so nothing in it should read as a win for either side. Also don't give me citations or a reading list, they hate that.

  One thing I'm unsure about, feel free to tell me if I've set it up wrong: is the flat affect subgroup actually a problem for her, or only for him? I keep flip flopping on it.
