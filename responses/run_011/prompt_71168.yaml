answer: |-
  # Seminar Plan: The Experience Machine as a Probe (Week 4)

  **Time:** 90 Minutes
  **Students:** 25 (Second Year)
  **Goal:** Move beyond "Nozick refutes Hedonism" to "What is well-being tracking?"
  **Selected Variant:** **The Reversal (Mid-Program) Variant.**
  **Defense of Pick:** The Original ("Would you plug in?") tests *prudence* and *choice*, which invites autonomy objections ("I want to choose my destiny"). The Kid Variant ("For your child?") tests *morality* and *paternalism*. The Reversal ("You are *already* in it") tests *well-being* directly. It forces the question: "Is a life of false happiness a good life?" without the noise of voluntary consent. It isolates the metaphysical claim of hedonism (mental states are all that matter) from the practical claim (you should choose pleasure).

  ---

  ### 00:00 – 00:10 | Setup: The Matrix & The Hangover
  **Move:** Don't re-explain the Machine. Use *The Matrix* as the shared cultural shorthand.
  **Script:** "You've all seen *The Matrix*. Cypher knows the steak isn't real, but he also knows it tastes delicious. Bentham and Mill would say Cypher is doing fine; his utility is high. Nozick says Cypher is living a bad life. Today isn't about proving Nozick right. It's about figuring out *why* we think Cypher's life is worse, if we do."
  **Action:** Write "Well-Being = ?" on the board.
  **Dependency:** This relies on them having read Nozick, but you are suspending the "refutation" narrative immediately.

  ### 00:10 – 00:25 | The First Vote (The Reversal)
  **Move:** Present the **Reversal Variant**.
  **Script:** "Forget plugging in. Imagine you wake up today and a reliable source tells you: You have actually been in the Experience Machine for 40 years. Your memories of this seminar, your childhood, your friends—they are simulations. Your body is in a tank. But the simulation is perfect. You feel happy. You feel accomplished."
  **Task:** "Raise your hand: Is your well-being *right now* high, or low?"
  **Expected Split:** 50/50. The Hedonists say High (feelings are real). The Realists say Low (life is fake).
  **Misconception 1 Head-Off (Desire vs. Hedonism):**
  *   **When:** Immediately after the vote, when a student says, "But I wanted to pass this class! I didn't actually do it!"
  *   **Move:** Stop them. "Pause. Did you desire the *experience* of passing, or the *fact* of passing?"
  *   **Point:** If they desired the experience, Hedonism satisfies that desire. If they desired the fact, Desire Theory collapses into something non-experiential. Force them to see that Desire-Satisfaction isn't automatically safe from the Machine argument. If the machine gives you the *feeling* of satisfaction, the Desire Theorist must explain why that feeling isn't enough.
  *   **Instruction:** Do not let them conflate "I didn't get what I wanted" with "I don't feel like I got what I wanted."

  ### 00:25 – 00:45 | The Pivot: The "Outside World" Variable
  **Move:** **Drop the Fact.** This is the critical turn.
  **Script:** "Most of you who said 'Low Well-Being' are relying on an intuition that Reality > Simulation. But let's run the scenario again. Same setup: You are in the machine. But now, I tell you the truth about the world *outside* the tank."
  **Variation A:** "Outside, the world is a utopia. People are flourishing, art is thriving, you *could* have been part of that." (Intuition: Well-being is Low).
  **Variation B:** "Outside, the world is a radioactive wasteland. Everyone else is dead or suffering in agony. The machine is the only safe place."
  **Action:** Re-vote on Well-Being in Variation B.
  **Pedagogical Goal:** Students will shift their votes. They will admit their well-being is *higher* in the Machine if the Reality is terrible.
  **Takeaway:** This stops them from treating their squeamishness as evidence. It proves their intuition isn't "Truth is intrinsically valuable." It's "Truth is valuable *instrumentally* for other goods." If Reality is worse, we prefer the Lie. This probes *what* we value: is it contact with reality, or is it that contact usually leads to better outcomes?
  **Dependency:** This depends on the first vote establishing a baseline "Truth Bias."

  ### 00:45 – 01:05 | Authenticity & Nozick's Reasons
  **Move:** Interrogate the "Reality" intuition.
  **Misconception 2 Head-Off (Authenticity as a Free-Floater):**
  *   **When:** A student says, "It's just not authentic."
  *   **Move:** "Authenticity is a label, not an argument. Authentic to what? If you feel authentic, but aren't, does it matter? If authenticity makes you miserable (e.g., facing a brutal truth you can't change), is it still adding to your well-being?"
  *   **Point:** Force them to define authenticity as a *constituent* of well-being, not just a vibe.
  **Misconception 3 Head-Off (Nozick's Three Reasons):**
  *   **When:** Summarizing why they rejected the machine.
  *   **Script:** "Nozick gives three reasons: We want to *do* things, we want to *be* a certain way, we want *contact* with reality. Students often treat these as three separate arguments."
  *   **Move:** "I want you to see these as one argument wearing a hat. 'Doing' and 'Being' are just forms of 'Contact.' You can't truly *do* or *be* if you aren't in contact with the constraints of the world."
  *   **Instruction:** Don't let them list the three reasons as a checklist. Push them to unify them under "Active Connection to Reality."

  ### 01:05 – 01:10 | The Cut (Objective List & Hybrids)
  **Move:** Explicitly bracket the next logical step.
  **Script:** "The natural next step is to say, 'So well-being is a mix: some feelings, some reality.' That's a Hybrid or Objective List theory. **We are not doing that today.**"
  **How to say it:** "I am cutting Objective List theories not because they are wrong, but because they are a ceasefire. If we jump to 'Well-being is both X and Y,' we stop asking *why* Y matters. I want you to sit in the discomfort of the conflict for one more week. We need to exhaust the tension between Experience and Reality before we patch it."
  **Why:** Prevents students from solving the puzzle prematurely with "It's both!"

  ### 01:10 – 01:25 | Synthesis: What is the Theory Tracking?
  **Move:** Return to the board ("Well-Being = ?").
  **Discussion:** "If the Machine is bad, but only when Reality is better, then Well-Being isn't just feelings. But it isn't just Truth either. So what is the common denominator?"
  **Target Insight:** Well-being might be about *successful agency* or *competence*. We feel bad in the machine not because it's fake, but because we are *passive*. We are being acted upon.
  **Goal:** Shift the frame from "Real vs. Fake" to "Active vs. Passive."

  ### 01:25 – 01:30 | The Closing Question
  **Move:** Distinguish agreement from understanding.
  **Script:** "Here is the question you need to answer for yourself before next week. It distinguishes those who just agreed with me from those who got the point:"
  **The Question:** **"If I could inject you with a drug right now that made you feel you had understood this seminar perfectly, but actually erased the understanding, would your well-being be higher? And if yes: Is that a *better* state for you to leave in?"**
  **Why this works:**
  *   If they say "No, well-being wouldn't be higher," they are still Hedonists (feelings determine well-being).
  *   If they say "Yes, well-being is higher, but it's not a *better* state," they have successfully separated Well-Being from Value (a crucial distinction).
  *   If they say "No, well-being is lower because I'm deluded," they have accepted the Anti-Hedonist probe.
  *   **Crucially:** It forces them to apply the Machine to the *seminar itself*, removing the abstract distance.

  ---

  ### Instructor Notes on Flow & Dependencies

  1.  **Dependency Check:** The "Outside World" pivot (00:25) *depends* on the first vote (00:10) showing a significant "Reality Bias." If everyone votes "High Well-Being" in the first round (hardline Hedonists), skip the pivot and ask: "Would you stay in if we told you the outside world was a utopia?" (Flip the pressure).
  2.  **Managing the "For Your Kid" Objection:** A student will inevitably ask, "But what about the Kid variant?" **Response:** "That introduces parental duty. We are asking about *your* life, not your obligations. Stick to the subject."
  3.  **Time Management:** The "Cut" (01:05) is hard. Students will want to solve it with Objective List. Be firm. "Write that down for Week 6. For Week 4, I want the tension unresolved."
  4.  **The "Squeamishness" Trap:** If students say "I just don't like the idea of wires," remind them: "The Machine is perfect. It simulates the feeling of *not* having wires. Your squeamishness is a bug in your simulation, not an argument against Hedonism." (Use this to push them toward the deeper metaphysical objection).

  ### Summary of Misconception Handling
  1.  **Desire vs. Hedonism:** Headed off at **00:15** (First Vote analysis). *Don't let them hide behind Desire Theory.*
  2.  **Authenticity:** Headed off at **00:50** (Post-Pivot). *Don't let "Authenticity" be a conversation stopper.*
  3.  **Nozick's 3 Reasons:** Headed off at **01:00** (Synthesis). *Unify the arguments.*

  ### Summary of the Cut
  *   **What:** Objective List / Hybrid Views.
  *   **When:** 01:05.
  *   **How:** "We are bracketing this to prevent premature closure. We need to feel the weight of the contradiction before we resolve it."
