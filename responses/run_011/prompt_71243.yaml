  ### Leaf Profiles

  | Position | Commitment This Leaf Most Regrets |
  | :--- | :--- |
  | **Biostatistical (Boorse)** | Regrets that it classifies harmless statistical deviations (e.g., rare benign anomalies) as diseases. |
  | **Harmful Dysfunction (Wakefield)** | Regrets that "harm" is vague and relies on contested social values to define disease. |
  | **Normativism (Szasz)** | Regrets that it cannot distinguish a tumor from a tattoo without invoking values it rejects. |
  | **Social Constructivism (Canguilhem)** | Regrets that it struggles to account for biological constraints that resist social redefinition (e.g., sepsis). |
