  2.  **The Harm Requirement:** In this case, must the condition cause harm or disadvantage to count as a disease, or is malfunction enough?
  3.  **The Reference Class:** In this case, is "normal function" defined by survival in *this* environment or *evolutionary* history?
  4.  **The Conceptual Unity:** In this case, are we tracking one thing (pathology) or distinct things (pathology / experience / social role)?
