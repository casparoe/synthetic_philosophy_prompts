prompt: |-
  I work in quality engineering at a plant that makes injection-molded parts for automotive suppliers, so my whole professional vocabulary is measurement systems analysis, gauge R&R, control charts, capability studies (Cp/Cpk), sampling plans, OC curves, common cause vs special cause. I've been a black belt for about fifteen years and I run our annual MSA and gage calibration program, which is to say I think about statistics all day but almost entirely as "is my process stable, is my measurement system adequate, is my output within spec."

  My sister is a postdoc in social psychology and over the holidays she tried to explain the replication crisis to me, plus the frequentist-versus-Bayesian fight that sits underneath it. I read a couple of the overview pieces she sent afterward — the one arguing that most published findings are probably false, and something about a big project that tried to redo a pile of published psychology experiments and got a much weaker picture the second time around. I could follow the individual complaints: people fiddling with their data until the result crosses the magic threshold, stopping the study early because it started looking good, running twenty tests and reporting the one that lit up, journals only publishing the hits and never the misses, studies too small to detect the effects they claim. But every time I tried to think about them in my own terms I ended up somewhere suspiciously comfortable, like "that's just a bad gauge study" or "they don't know whether their process is even in control." My sister said that flattens the actual disagreement, but she couldn't quite articulate why, and honestly I suspect she just thinks her framework is deeper.

  So here's what I want. Take the replication-crisis argument, including the methodological dispute between the frequentist and Bayesian camps about what a p-value does and doesn't license, and restate it as faithfully as you can in the language I actually use — measurement systems and %GRR, stability and control limits, process capability, acceptance sampling and producer's/consumer's risk, special vs common cause. Not as cute metaphors; I want the real mapping, the way you'd write it if you were forced to express their claims in my notation. Then give me the residue report, and be blunt about it: which claims came across clean, which ones you had to bend or quietly re-describe to make them fit, and which ones have no counterpart in my toolkit whatsoever.

  That last bucket is the part I actually care about, because I think it's where the interesting question lives. When the Bayesians complain that a p-value can't express evidence for a hypothesis and that the frequentists have no principled way to fold in what you already knew before the study ran, I genuinely don't know where to put that in my world — I don't talk about belief, I talk about process behavior and conformance to spec, and my priors basically live in the choice of control limits and the sampling plan rather than in any number I update. So I want you to tell me which way to read the gap. Is my vocabulary missing something real, something the QE framework simply has no room to represent? Or is their disagreement less substantive than it sounds, two dialects over one underlying decision problem that my plant-floor framing actually makes clearer? And while you're in there, call me out wherever the translation tempts you to import my assumptions and pass them off as theirs — the bias I'd expect is toward reducing everything to a measurement-system problem or a stability problem, and I'd rather you flag that tendency than let it slide.

  Please write the whole thing in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Quality Engineering (QE) Black Belt, 15 years experience, automotive injection molding. Deeply familiar with MSA (Measurement Systems Analysis), Gauge R&R, SPC (Statistical Process Control), Cp/Cpk, Sampling Plans, OC Curves, Common/Special Cause.
      *   **Context:** Sister is a social psychology postdoc. Explained the Replication Crisis and Frequentist vs. Bayesian debate. User understands the surface complaints (p-hacking, low power, publication bias) but maps them too easily to QE concepts (bad gauge, out of control). Sister says this flattens the disagreement.
      *   **Task:**
          1.  Translate the Replication Crisis/Frequentist-Bayesian debate *faithfully* into QE terminology (MSA, SPC, Capability, Sampling, Risk). No cute metaphors; use the actual notation/logic.
          2.  Provide a "Residue Report": What mapped cleanly? What had to be bent? What has *no* counterpart?
          3.  Address the core philosophical gap: Is QE missing something real (belief/priors), or is the psych debate just a messy version of a decision problem QE solves cleaner?
          4.  **Crucial Constraint:** Call out translation bias (specifically the tendency to reduce everything to measurement/stability).
          5.  **Tone:** American English, professional, direct, respectful of expertise, blunt where requested.

  2.  **Deconstruct the Psychological/Statistical Concepts:**
      *   *Replication Crisis:* Published effects don't hold up when re-run.
      *   *P-hacking/Data Dredging:* Multiple testing, selective reporting.
      *   *Low Power:* Sample sizes too small to detect true effects.
      *   *Publication Bias:* File drawer problem (only significant results published).
      *   *Frequentist (NHST):* Null Hypothesis Significance Testing. $p < 0.05$. Probability of data given null ($P(D|H_0)$). No probability assigned to the hypothesis itself.
      *   *Bayesian:* Updates prior belief with data to get posterior belief ($P(H|D)$). Explicit priors.
      *   *The Conflict:* Frequentists say "long-run error control." Bayesians say "quantification of uncertainty/belief in this specific instance."

  3.  **Map to Quality Engineering (QE) Terminology:**
      *   *Hypothesis Testing:* In QE, this is usually Acceptance Sampling or Process Change Verification.
      *   *Null Hypothesis ($H_0$):* Process is stable / Part is bad / Gauge is adequate.
      *   *Alternative Hypothesis ($H_1$):* Process shifted / Part is good / Gauge is inadequate.
      *   *Alpha ($\alpha$):* Producer's Risk (Type I Error). Rejecting a good lot/process.
      *   *Beta ($\beta$):* Consumer's Risk (Type II Error). Accepting a bad lot/process. Power = $1 - \beta$.
      *   *P-value:* Probability of seeing this variation if the process is stable.
      *   *Replication:* Re-running the capability study or MSA on a new batch/shift.
      *   *P-hacking:* Measuring 20 dimensions and reporting only the one out of spec. Stopping data collection once Cpk looks > 1.33.
      *   *Publication Bias:* Only submitting PPAPs (Production Part Approval Process) that pass. Hiding the failed trials.
      *   *Priors:* Engineering judgment before the run. In QE, this is usually embedded in the control limits or sampling tightness, not explicitly calculated as a probability distribution.

  4.  **Drafting the Translation (Section 1):**
      *   *Goal:* Make it sound like a Quality Manual or 8D Report.
      *   *Replication Crisis:* "Systematic Failure of Process Validation."
      *   *P-hacking:* "Multiple Characteristic Testing without Family-wise Error Rate Control."
      *   *Low Power:* "Sampling Plan Insufficient to Detect Shift."
      *   *Frequentist:* "Classical Acceptance Sampling / SPC." Focus on long-run error rates ($\alpha, \beta$).
      *   *Bayesian:* "Updating Process Knowledge with Prior Engineering Judgment."
      *   *The Conflict:* Is the goal to control long-term fallout (Frequentist/QE) or determine the truth of *this* specific change (Bayesian)?

  5.  **Drafting the Residue Report (Section 2):**
      *   *Clean Maps:* P-hacking = Data Dredging/Multiple Comparisons. Low Power = High Consumer's Risk. Publication Bias = PPAP File Drawer.
      *   *Bent Maps:* Replication. In QE, replication implies the process *should* be identical. In Psych, the "process" (human behavior) is inherently noisier and context-dependent.
      *   *No Counterpart:* The concept of "Truth of the Hypothesis." QE asks "Is it in spec?" Psych asks "Is this theory true?" QE doesn't assign probability to the *process existing*, only to the *output*.
      *   *Priors:* QE uses "Engineering Judgment" but doesn't mathematically combine it with likelihood. Bayesians make this explicit.

  6.  **Addressing the Core Gap (Section 3):**
      *   *The Bias Check:* I need to be careful not to say "QE is better because it's concrete." Psych deals with latent constructs (depression, bias), QE deals with physical dimensions (mm, torque).
      *   *The Missing Piece:* QE assumes the "Truth" (the specification) is fixed and external. Psych often debates the existence of the effect itself.
      *   *Belief vs. Risk:* QE manages *risk of decision*. Bayesians manage *degree of belief*. This is the fundamental ontological split.
      *   *Verdict:* The QE framework hides the prior. It pretends the data speaks for itself, but the choice of $\alpha$, $\beta$, and sample size *is* a prior. The Bayesians are right that QE lacks a formal mechanism to update belief, but QE is right that for *decision making* (ship/don't ship), long-run error control is often more actionable than subjective probability.

  7.  **Refining the Tone:**
      *   Avoid condescension.
      *   Use specific acronyms correctly (MSA, SPC, OC, PPAP).
      *   Ensure the "Residue Report" is blunt as requested.
      *   Check for American English spelling (caliber, program, etc.).

  8.  **Self-Correction/Review during drafting:**
      *   *Initial thought:* Maybe equate P-value to Cpk.
      *   *Correction:* No, P-value is closer to the probability of a point outside control limits given stability. Cpk is capability. Stick to hypothesis testing logic for p-values.
      *   *Initial thought:* Say QE uses Bayesian methods implicitly.
      *   *Correction:* No, QE is staunchly Frequentist. Control limits are 3-sigma based on long-run frequency. Acknowledge this distinction.
      *   *Bias Check:* The prompt warns against reducing everything to "bad gauge." I need to make sure I distinguish between *measurement error* (MSA) and *process variation* (SPC). The replication crisis is often about process variation (human behavior) being misunderstood as measurement error, or vice versa.
      *   *Key Insight:* In QE, if a process is out of control, we stop and fix it. In Psych, if a result doesn't replicate, they argue about whether the theory is wrong or the context changed. QE assumes the process *can* be controlled. Psych is discovering the process might be inherently unstable (context-dependent).

  9.  **Final Polish:** Organize into clear sections: The Translation, The Residue Report, The Gap Analysis. Ensure the "Call Out" on bias is prominent. (Proceed to generate output based on these thoughts.)

  *(Self-Correction during final review)*: Make sure I explicitly address the "P-value doesn't express evidence for a hypothesis" point in the QE language. In QE, a point outside limits tells you to *act*, not that the process *is* broken with X probability. It's a trigger, not a truth statement. That's the key link.

  10. **Final Output Generation** (incorporating the above structure).
answer: |-
  Here is the translation of the replication crisis and the frequentist-Bayesian dispute into Quality Engineering (QE) terminology, followed by the residue report and the gap analysis you requested.

  ### Part 1: The Translation
  **Subject:** Systemic Non-Conformance in Experimental Validation Protocols
  **Reference:** Social Psychology Literature vs. Automotive Quality Standards

  **1. The Replication Crisis as Process Validation Failure**
  In your plant, when you run a Capability Study (Cp/Cpk), you assume the process is stable. You take a snapshot of production. If the Cpk is > 1.33, you approve the process for production (PPAP).
  *   **The Crisis:** In social psychology, researchers are issuing PPAPs on processes that are not stable. They run a study (a capability snapshot), get a "pass" (p < 0.05), and publish the result as a permanent process characteristic. When another lab tries to run the same process (replication), the Cpk collapses.
  *   **QE Translation:** This is equivalent to validating a mold on a Tuesday morning with a specific resin lot, certifying the tool, and then finding that Wednesday afternoon the parts are out of spec. The difference is that in your plant, you would classify this as "Process Not in Control" and suspend production. In psychology, the initial "pass" is treated as a discovered law of nature, not a temporary process state.

  **2. P-Hacking as Multiple Characteristic Testing**
  *   **The Complaint:** Researchers measure 20 variables, find the one that is significant, and report only that one.
  *   **QE Translation:** This is **Multiple Testing without Family-wise Error Rate Control**. Imagine you measure 20 dimensions on a bracket. Statistically, even if the tool is perfect, one dimension will likely fall outside the 95% confidence interval just by chance. If you report only the one out-of-spec dimension as a "defect" (or conversely, only the one in-spec dimension as a "pass" while hiding the 19 failures), you are manipulating the **Consumer's Risk ($\beta$)**. You have inflated the probability of accepting a bad lot.
  *   **Stopping Rules:** Researchers stopping data collection once $p < 0.05$ is equivalent to an operator measuring parts until they find five in a row that meet Cpk > 1.33, then stopping the run and submitting those five as the Capability Study. This violates the **Sampling Plan**. The Operating Characteristic (OC) curve is no longer valid because the sample size ($n$) was not fixed in advance.

  **3. Publication Bias as the File Drawer Problem**
  *   **The Complaint:** Journals only publish positive results; negative results go unpublished.
  *   **QE Translation:** This is **Selective Reporting of Lot Acceptance**. Imagine if your plant ran 10 production batches. 9 were rejected by Quality, 1 was accepted. If you only ship the 1 accepted batch and send the customer a Certificate of Analysis that implies *every* batch meets spec, you are falsifying the **Average Outgoing Quality (AOQ)**. The customer thinks the process capability is high, but the true yield is 10%. The historical data required to calculate accurate Control Limits is corrupted.

  **4. The Frequentist vs. Bayesian Dispute**
  *   **Frequentist (Standard NHST):**
      *   **QE Equivalent:** Classical Acceptance Sampling and SPC.
      *   **Logic:** We set Control Limits at $\pm 3\sigma$. If a point falls outside, we signal an alarm.
      *   **The Claim:** The p-value is not the probability the process is broken. It is the probability of seeing this data *assuming the process is stable* ($P(Data | H_0)$).
      *   **Goal:** Long-run error control. If we use this rule for 10 years, we will only stop the line unnecessarily 5% of the time ($\alpha$). We do not calculate the probability that the tool is actually worn; we just follow the rule to manage **Producer's Risk**.
  *   **Bayesian:**
      *   **QE Equivalent:** Updating Process Knowledge with Prior Engineering Judgment.
      *   **Logic:** Before running the gauge study, we have a "Prior" (e.g., "This vendor's tools usually wear out after 10k shots"). We combine this Prior with the new Measurement Data to get a "Posterior" probability ($P(Hypothesis | Data)$).
      *   **The Claim:** The Frequentist approach answers the wrong question. Plant management doesn't want to know the long-run error rate; they want to know, "Given this data, what is the probability *this specific tool* is worn?"
      *   **Goal:** Quantification of belief in the current state. It explicitly mathematically incorporates the **Prior Knowledge** (experience) rather than hiding it in the choice of sampling plan.

  ***

  ### Part 2: The Residue Report

  Here is the blunt accounting of what translated cleanly, what required bending, and what fell out of your framework entirely.

  **1. Clean Mappings (High Fidelity)**
  *   **P-Hacking / Data Dredging:** Maps perfectly to **Multiple Testing without Correction**. You deal with this when measuring multiple part characteristics. If you test 20 features at $\alpha=0.05$, you expect one false failure. Reporting only the "significant" one is a known violation of sampling integrity.
  *   **Low Power:** Maps perfectly to **High Consumer's Risk ($\beta$)**. If your sample size is too small for the effect size (shift) you are trying to detect, your OC curve shows a high probability of accepting bad parts. Psychology studies often have $n=20$, which is like trying to calculate Cpk with 5 parts. The confidence intervals are so wide the number is meaningless.
  *   **Publication Bias:** Maps perfectly to **Biased Historical Data**. Control limits calculated only from "good runs" are useless. Both fields agree: if you censor the data stream, your statistical model is garbage.

  **2. Bent Mappings (Forced Fit)**
  *   **Replication:** In QE, replication implies the process *should* be identical. If I run a Gauge R&R today and another engineer runs it next week, the %GRR should be consistent because the physics of the part and the gauge haven't changed. In psychology, "replication" often involves different subjects, different campuses, different times.
      *   *The Bend:* I mapped this to "Process Stability," but in psychology, the "process" (human behavior) is inherently more sensitive to "Noise Factors" (context) than an injection molder. Treating a failed replication as "Out of Control" assumes the process *can* be brought into control. In psych, the variation might be **Common Cause** inherent to the system, not a **Special Cause** fixable by tightening the protocol.
  *   **The P-Value:** In QE, a point outside control limits triggers an *action* (stop the line), not a *truth claim*. In psychology, $p < 0.05$ is treated as "Truth Established."
      *   *The Bend:* I mapped this to "Lot Acceptance," but in QE, accepting a lot doesn't mean the lot is perfect, only that it passed the risk assessment. Psychologists treat acceptance as proof of theory. That is a misuse of the statistic common in both fields, but more damaging in theirs.

  **3. No Counterpart (The Null Set)**
  *   **Probability of the Hypothesis:** This is the big one. In QE, you never calculate the probability that "The tool is worn." You calculate the probability of the *data* given the tool is worn.
      *   *Why it's missing:* Your framework is **Ontologically Agnostic**. It doesn't care if the theory of why the part is out of spec is true. It cares if the part is within spec. Bayesians want to assign a probability to the *theory* itself ($P(Theory | Data)$). Your toolkit has no variable for "Truth of the Mechanism," only "Conformance to Specification."
  *   **Subjective Priors as Data:** In QE, "Prior Knowledge" is qualitative (e.g., "Vendor X is unreliable"). It influences the *stringency* of the sampling plan (Tightened Inspection), but it is not entered into the calculation as a distribution. Bayesians require the Prior to be a mathematical input ($\alpha, \beta$ parameters of a distribution). Your framework keeps judgment *outside* the formula to prevent bias; their framework puts judgment *inside* the formula to prevent ignorance.

  ***

  ### Part 3: The Gap Analysis

  You asked whether your vocabulary is missing something real or if their disagreement is just a messy version of a decision problem you solve cleaner. Here is the call-out you requested.

  **1. Where Your Bias is Hiding the Problem**
  You have a strong tendency to reduce their crisis to a **Measurement System Analysis (MSA)** failure or a **Process Stability** failure. You think: *"If they just calibrated their gauges and controlled their inputs, the variation would drop, and the signals would be clear."*
  *   **The Call-Out:** This assumes the "Truth" exists and is stable. In injection molding, the physics are constant. Gravity and viscosity don't change based on the mood of the polymer. In social psychology, the "process" is human cognition, which is context-dependent. A "failed replication" might not be a bad gauge; it might be that the effect *only exists* under specific, unmeasured environmental conditions.
  *   **The QE Blind Spot:** Your SPC charts assume that if you eliminate Special Causes, you are left with Common Cause variation that is predictable. Psychology is discovering that what looks like Common Cause variation might actually be unmeasured Special Causes that are impossible to control (e.g., cultural shifts over time). Your framework assumes the process *can* be mastered. Their crisis suggests some processes *cannot* be mastered, only described probabilistically.

  **2. The "Belief" Gap (Frequentist vs. Bayesian)**
  You asked where to put the Bayesian complaint that "a p-value can't express evidence."
  *   **In Your World:** You are correct that you don't talk about belief. You talk about **Risk**. When you set $\alpha = 0.05$, you are saying, "I am willing to scrap 5% of good lots to ensure I catch the bad ones." This is an economic decision, not an epistemological one.
  *   **In Their World:** They are trying to determine *what is true*, not just *what to ship*. The Bayesian argument is that if you want to know if a theory is true, long-run error rates (Frequentist/QE) are irrelevant. You need to update your confidence in the theory.
  *   **The Verdict:** Your framework is superior for **Decision Making** (Ship/No-Ship). Their framework is necessary for **Knowledge Accumulation** (True/False).
      *   The QE framework *hides* the prior. When you choose a sampling plan (AQL levels), you are implicitly saying, "I believe the vendor is usually good." But you don't write that number down. If the vendor changes, you have to manually switch from Normal to Tightened inspection.
      *   The Bayesian framework *exposes* the prior. They write down the belief. When new data comes in, the math updates the belief automatically.
      *   **What You're Missing:** You are missing a formal mechanism to **update the probability of the process model itself**. In QE, if a process goes out of control, you fix it and reset the control limits. You don't say, "My belief that this process is capable has dropped from 90% to 40%." You just say, "It's out of control." The Bayesian wants to track the degradation of confidence over time, not just the binary pass/fail.

  **3. Final Assessment**
  Is their disagreement less substantive than it sounds? **No.**
  Is your plant-floor framing clearer? **For action, yes. For truth, no.**

  The replication crisis is not just "bad quality control." It is a collision between a **Frequentist Decision Framework** (which you use) applied to a **Bayesian Knowledge Problem** (which they have).
  *   You use statistics to **minimize cost** (scrap, rework, warranty).
  *   They use statistics to **minimize false beliefs**.

  When they run a study, they act like they are doing a PPAP (certifying a truth). But because they are using Frequentist tools (p-values) without the QE infrastructure (stable process, calibrated gauges, fixed sampling plans), they are generating "Pass" signals on unstable processes.
  *   **Your Advantage:** You know that without a stable process, capability numbers are fiction.
  *   **Their Advantage:** They know that without updating priors, you cannot distinguish between "The effect is small" and "The effect is zero."

  **Recommendation:** Do not abandon your QE framework; it is robust for physical systems. But acknowledge that in their domain, "Process Stability" is not an assumption they can make. The Bayesian push is an attempt to build a control chart for *belief* because they cannot build a control chart for the *process*. You see the lack of stability as a failure of discipline; they are beginning to see it as a feature of the system. That is the gap your vocabulary cannot bridge.
