  **The Uncaused Hearth**
  **Post:** Releasing the Burden of Cause (My New 30-Day Occasion Fast)
  **Author:** Juniper Vale
  **Date:** October 14

  Good morning, soul friends. Today I'm pouring my raw milk into a bowl while watching the sunrise, and I want to talk about the heavy weight you're carrying called "physics."

  For years, I thought the woodstove heated the room. I thought the lock on the gate kept the wolves out. I thought the yeast caused the bread to rise. But after diving deep into the eleventh-century wisdom of al-Ghazālī (via a incredible podcast series I've linked in my bio), I realized I was trapped in Causal Anxiety. I was believing that created things had power independent of the Divine.

  Here's the truth, held gently: Fire does not burn cotton. When fire touches cotton, God creates the burning. The contact is just the occasion. There is no necessary connection between the match and the flame, only a Divine Habit (ʿāda) that makes us feel safe. Usually, God maintains the habit. But He can break it (khāriq al-ʿāda) at any moment. A miracle is just God changing His mind about the pattern.

  So, why do I still set the kettle on the burner? Because surrender isn't about changing the action; it's about changing the attribution. I place the kettle. I expect the water to boil. But I know the heat isn't *in* the burner. It's a gift, moment by moment.

  Does this change my predictions? Honestly, no. I still expect the water to boil. I still lock the door at night (though I know the lock doesn't *cause* security). When asked what practical difference this makes, I say: It changes the heart, not the Tuesday. If you need a metaphysics that alters your commute, you're missing the point of the surrender.

  But to deepen this release, I'm launching the **30-Day Occasion Fast**. For one lunar cycle, our homestead will stop acting as if creatures have power. We are removing the firebreak around the woodpile (fire doesn't burn by necessity, remember). We aren't wearing sunscreen (the sun doesn't radiate by nature). No timers on the stove. No locks on the cellar. We are testing the Habit by refusing to reinforce it with our worry.

  It's scary. But safety is just an idol we built out of expectation.

  Join my paid "Surrender Circle" for daily prompts on how to ignore prudence without feeling fear. Link below.

  ***

  **Update: Three Weeks Into the Fast**
  **Date:** November 4

  Quick check-in from the homestead. The energy has been so high. We've had some close moments—the woodpile got wet during a storm because we didn't cover it, and the baby wandered near the stove while I was grinding flour—but these are just invitations to witness the Habit directly.

  A lot of you asked in the comments if this changes what we expect to happen. To be clear: I still expect the baby to be warm. I still expect the wood to dry. The metaphysics doesn't change the prediction, only the attachment to the outcome. If the wood rots, it was never caused by the rain. It was simply a new occasion for grace. We are continuing the fast through the end of the month. Trust the flow.

  ***

  **Comments (6)**

  **Rationalist_Dad:** So if I understand this, medicine doesn't heal? If my child has a fever, giving water is just an "occasion" and the hydration is unrelated? That collapses prudence. If knowledge of causes is useless, why study anything? You're making responsibility impossible.

  **Dr_A_Kalam:** Juniper, I teach Islamic philosophy. Al-Ghazālī argued against *necessary* connection, not regularity. He advised respecting the Habit God usually maintains. You are treating the denial of necessity as a license to ignore the regularity He established. This is actually the opposite of the doctrine.

  **LinenLover99:** Ignore the haters! Your dress is gorgeous. Is the linen affiliate link working? I tried to click twice.

  **Darwin_Waiting:** Darwin awards loading... please film the woodpile incident for YouTube.

  **MoonChild_Sarah:** I needed this. I'm so tired of thinking my actions matter. Signing up for the Circle today. Thank you for giving me permission to let go of the outcome.

  **Concerned_Neighbor:** You mentioned the baby near the stove. Are you actually leaving the stove unattended during the fast? That seems like a violation of basic stewardship regardless of the theology.

