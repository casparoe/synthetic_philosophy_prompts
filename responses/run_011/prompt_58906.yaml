prompt: |-
  I cover science and research policy for a magazine, and over the years I've built up a pile of judgments about when it's rational to keep pouring money into something you've already poured money into. My editors think I'm inconsistent. I suspect they're right, but I want to know exactly where.

  Here's the list.

  1. Half-built stadium, anchor team leaves town. $900M already spent, $400M to finish, and finishing will lose money every year after that. Scrap it. The $900M is just gone and pretending otherwise is how cities wreck themselves.

  2. Expedition, six weeks of fixing rope and burning supplies, summit push turns around at 2pm with weather closing in. Descend, obviously. Here "we've come this far" is literally the sentence that kills people, and I want whatever principle I end up with to say that loudly.

  3. Two non-refundable tickets to two trips, I'd enjoy the cheaper one more. Go on the one I'd enjoy more. What something cost me is not a reason.

  4. Light rail in a city I cover. First segment built for $900M, ridership half of what was promised. Extension costs $400M and, evaluated by itself, would lose money — but segment one also loses money alone, and the two together roughly break even. Extend. Very confident about this one.

  5. A lab gets a ten-year, $10M grant tied to one specific long-shot program. Six years in, an easier project with better expected payoff appears. Stick with the program.

  6. Same lab, same six years, same alternative — except they funded it out of their own overhead. No promises made, nobody to answer to, no one will ever know. I still feel they should stick with it. I know how that sounds. I feel it anyway.

  7. A researcher who's spent 25 years defending a theory that's now clearly losing. She shouldn't just migrate to whatever's winning; she should first go back and check whether the anomalies that pulled her into the thing have actually been answered. Walking away from that reads to me like a betrayal of her earlier reasons, not just of her earlier self.

  8. A researcher who's spent 25 years perfecting a technique that a cheap new method just made obsolete. Switch overnight. I'd think less of her if she didn't.

  9. Hypocrisy data. When my editor killed an investigation I'd put 18 months into, I was furious and wrote a memo about the value of long reporting. Two years later I killed my own book project — same shape, comparable time sunk — after about four minutes of thought, and I don't regret it at all.

  My tentative principle, which I'm sure its broken somewhere: past costs count only where they've changed the forward-looking situation — by creating obligations (5), by making the remaining pieces complements (4), or by leaving you holding evidence or judgment nobody else has (7, and 8 as the negative case). Bare "we've already spent it" gets zero weight (1, 2, 3).

  Where it visibly struggles: 6, where nothing has changed except the money; and 9, where the same person got opposite treatment depending on who was holding the pen.

  So: is there a principle, or a small set of them, that gets all or most of these? State it precisely enough that I could hand it to a junior reporter and get the same verdicts back, and tell me which case is doing the work for each clause. Then run it on three I haven't given you a verdict on — a fifth-year grad student whose method stopped working halfway through the dissertation; a space mission extended after its target turned out to be much less interesting than hoped; a family that refuses to sell a house they badly overpaid for. And be blunt about which of my verdicts the best version of the principle forces me to give up. If the answer is that 6 or 9 just has to go, say so — and then tell me why I find them compelling anyway, because that part I'd actually like explained.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Science and research policy journalist. Experienced, thoughtful, self-reflective.
      *   **Task:** Evaluate a set of 9 scenarios regarding the "sunk cost fallacy" vs. rational persistence. The user suspects inconsistency (especially cases 6 and 9) and wants a precise principle that explains the valid judgments, identifies the inconsistencies, and applies to new cases.
      *   **Goal:** Create a robust decision framework (principle(s)) that matches most of their intuitions, flags the contradictions, applies to 3 new cases, and explains *why* the contradictions feel compelling psychologically/normatively even if logically inconsistent.
      *   **Tone:** Professional, analytical, blunt but respectful, intellectual.

  2.  **Deconstruct the 9 Cases:**
      *   *Case 1 (Stadium):* Scrap. Pure sunk cost. No future value.
      *   *Case 2 (Expedition):* Descend. Sunk cost + high risk. "We've come this far" is dangerous.
      *   *Case 3 (Tickets):* Cheaper trip. Pure sunk cost. Utility maximization.
      *   *Case 4 (Light Rail):* Extend. Network effects/Complementarity. The past investment changes the *future* economics of the new investment (synergy).
      *   *Case 5 (Lab Grant):* Stick. Contractual/Reputational obligation. The past investment created a *binding constraint* or promise.
      *   *Case 6 (Lab Overhead):* Stick. *The Problem Case.* No obligation, no synergy. Just "feel." Pure sunk cost intuition.
      *   *Case 7 (Theory Defender):* Check anomalies. Epistemic duty. The past investment created *unique knowledge/insight* that needs resolution for the field, not just the person.
      *   *Case 8 (Technique Obsolete):* Switch. No unique value in old method. Efficiency.
      *   *Case 9 (Hypocrisy):* Inconsistent. Editor killed story (fight) vs. Self killed book (quit). Contextual difference (agency/control)?

  3.  **Identify the Core Tension:**
      *   The standard economic view: Sunk costs are irrelevant. Only marginal costs and benefits matter.
      *   The user's view: Sunk costs *sometimes* matter, but not just because they are sunk. They matter if they change the *structure* of the future (Case 4), create *obligations* (Case 5), or generate *unique epistemic value* (Case 7).
      *   The Outliers: Case 6 (Internal commitment without external obligation) and Case 9 (Agency/Ownership difference).

  4.  **Drafting the Principle:**
      *   Need to distinguish between "Sunk Cost Fallacy" (irrational) and "Sunk Cost Signal/Structure" (rational).
      *   *Proposed Principle:* **The Forward-Value Modification Principle.** Past investments are relevant *only* if they materially alter the expected value, risk, or obligation structure of future actions.
      *   *Clauses:*
          1.  **Complementarity:** Does the past investment make the next dollar more productive? (Case 4)
          2.  **Constraint/Obligation:** Does the past investment create a binding cost to stopping (reputational, legal, contractual)? (Case 5)
          3.  **Epistemic Asset:** Does the past investment generate unique information that reduces uncertainty for the future (yours or the field's)? (Case 7)
          4.  **The Null Clause:** If none of the above, the cost is zero. (Cases 1, 2, 3, 8)

  5.  **Addressing the Inconsistencies (Cases 6 & 9):**
      *   *Case 6:* Why stick with overhead project? It violates the principle. *Explanation:* It's about *identity* and *internal coherence*, not economics. It's a "virtue ethics" move, not "utilitarian."
      *   *Case 9:* Why fight for the story but kill the book? *Explanation:* Agency. When someone else kills it, it's an attack on your judgment. When you kill it, it's an optimization. Also, the "memo" was a defense of the *institution's* process, the book kill was a personal utility calculation.
      *   *Verdict:* The principle forces the user to admit Case 6 is irrational *economically*, but perhaps rational *psychologically/culturally*. Case 9 is a conflict of interest/role.

  6.  **Developing the New Cases:**
      *   *Grad Student:* Method breaks. 5 years in.
          *   Apply Principle: Is there complementarity? No. Obligation? To the degree, yes. Epistemic asset? Maybe the failure *is* the data.
          *   Verdict: Pivot if possible, but document the failure (Epistemic Asset). Don't grind on broken method.
      *   *Space Mission:* Target less interesting. Extended mission.
          *   Apply Principle: Hardware is sunk. Marginal cost of extension vs. marginal science.
          *   Verdict: Extend if marginal cost < marginal science value. Don't extend just because "we are there." (Likely Extend, but cautiously).
      *   *Family House:* Overpaid. Refuse to sell.
          *   Apply Principle: Complementarity? No. Obligation? Emotional. Epistemic? No.
          *   Verdict: Sell. This is Case 1/3. Emotional attachment isn't a forward-looking economic modifier.

  7.  **Refining the Output:**
      *   Structure:
          1.  The Principle (The "Sunk Cost Modification Rule").
          2.  Mapping the Cases (Show how the principle fits 1-5, 7-8).
          3.  The Hard Truths (Cases 6 & 9).
          4.  The Psychology (Why 6 & 9 feel right).
          5.  The New Cases (Application).
      *   Tone Check: Ensure I'm not preaching economics but analyzing policy/judgment. Acknowledge the "research policy" context.

  8.  **Self-Correction/Nuance during drafting:**
      *   *Critique of Case 5:* Is it really sunk cost? It's a contract. The "sunk" part is the 6 years. The "reason to stay" is the remaining 4 years of funding + reputation. I need to make sure the principle captures *reputational capital* as a forward-looking asset.
      *   *Critique of Case 6:* The user says "I feel it anyway." I need to validate that feeling without validating the logic. It's about *integrity* as a heuristic.
      *   *Critique of Case 9:* The key is *who decides*. If the editor kills it, the journalist fights for the *process*. If the journalist kills it, they optimize the *product*.
      *   *Refining the Principle:* Let's call it the **Residual Value Principle**. Past costs matter only insofar as they generate *residual assets* (infrastructure, reputation, knowledge) that affect future ROI.

  9.  **Final Polish:** Check against the prompt requirements.
      *   State principle precisely? Yes.
      *   Tell which case does work for each clause? Yes.
      *   Run on 3 new cases? Yes.
      *   Be blunt about which verdicts to give up? Yes (Case 6 is the sacrifice).
      *   Explain why they are compelling? Yes (Identity/Signaling).

  10. (Final thought on Case 6): Actually, there is an argument for Case 6 under "Epistemic Asset" or "Reputation." If you start and stop projects funded by overhead constantly, you signal flakiness to your internal team or future self. It builds a *culture of completion*. I should mention this as a "soft" version of the principle, but maintain that strictly financially, it's suspect. I will stick to the "give it up" advice for clarity, but explain the nuance.

  11. (Final thought on Case 9): The prompt asks to be blunt. I need to say Case 9 reveals a bias, not a principle. It's self-serving inconsistency.

  Let's write.
answer: |-
  Here is the principle you are looking for, followed by the audit of your cases, the hard truths about your inconsistencies, and the application to your new scenarios.

  ### The Principle: The Residual Asset Rule

  **Past expenditures are rational grounds for continued investment if and only if they have generated a *residual asset* that materially improves the expected return, reduces the risk, or creates a binding obligation for future actions.**

  If the past expenditure has not created a residual asset, it is a sunk cost and must be ignored.

  This rule has three specific clauses. A junior reporter can use this flowchart:

  **Clause A: Complementarity (Infrastructure)**
  *Does the past investment make the next dollar more productive than it would be elsewhere?*
  *   **Verdict:** Continue.
  *   **Case Work:** **Case 4 (Light Rail).** The first segment is a residual asset (infrastructure). Without the extension, the asset is underutilized (losing money). With the extension, the asset's value is unlocked (breaking even). The $900M isn't a reason to spend $400M; the $90M *asset* is a reason the $400M spend is now efficient.

  **Clause B: Constraint (Obligation/Reputation)**
  *Does stopping now trigger a penalty (contractual, reputational, or institutional) that outweighs the savings of stopping?*
  *   **Verdict:** Continue.
  *   **Case Work:** **Case 5 (Lab Grant).** The past six years established a contractual and reputational trajectory. Abandoning the program breaches a contract and signals unreliability to funders, damaging future grant prospects. The "sunk" time created a *reputational asset* that must be protected.
  *   **Case Work:** **Case 1 (Stadium) - Negative.** The anchor team leaving removes the revenue constraint. The city has no contractual obligation to finish that outweighs the operating losses. The $900M is gone; finishing creates a new liability, not an asset.

  **Clause C: Epistemic Yield (Knowledge)**
  *Does the past investment hold unique information or judgment that, if resolved, provides value to the field (or you) that a fresh start cannot replicate?*
  *   **Verdict:** Continue (specifically to resolve/close out).
  *   **Case Work:** **Case 7 (Theory Defender).** 25 years of defending a theory generates deep familiarity with its anomalies. Abandoning it without checking those anomalies wastes the *knowledge asset* gained. She isn't continuing to prove the theory right; she is continuing to harvest the unique data her tenure produced.
  *   **Case Work:** **Case 8 (Technique Obsolete) - Negative.** The new method renders the old technique's knowledge asset worthless. There is no unique epistemic yield left to harvest.

  ***

  ### The Audit: Where You Are Inconsistent

  Your intuition is 80% aligned with the Residual Asset Rule. The 20% deviation is where you are conflating *economic rationality* with *virtue signaling* or *ego defense*.

  **The Sacrifice: Case 6 (Lab Overhead)**
  *   **Your Verdict:** Stick with it.
  *   **The Principle's Verdict:** **Quit.**
  *   **Why:** There is no external obligation (Clause B fails). There is no complementarity (Clause A fails). There is no unique epistemic yield mentioned (Clause C fails). You explicitly stated "no one will ever know."
  *   **The Hard Truth:** You must give this one up. If no one knows, there is no reputational asset. If the payoff is lower, there is no economic asset. Sticking with it is pure Sunk Cost Fallacy dressed up as grit.
  *   **Why it feels compelling:** You are valuing *internal coherence* over *external utility*. You feel that abandoning a project funded by your own overhead violates a contract with *yourself*. This is a virtue ethics stance ("I am a person who finishes things"), not a policy stance ("This is the best use of resources"). It is rational for character building; it is irrational for resource allocation. As a policy journalist, you should prioritize the latter.

  **The Hypocrisy: Case 9 (The Memo vs. The Book)**
  *   **Your Verdict:** Fight for the story (when editor kills); Kill the book (when you decide).
  *   **The Principle's Verdict:** **Inconsistent.**
  *   **Why:** In both instances, the asset (18 months of reporting/writing) is the same.
      *   *Scenario A (Editor kills):* You fought because the *institution's* decision-making process was the variable. You were defending the *system's* ability to recognize Residual Assets (Clause C).
      *   *Scenario B (You kill):* You optimized for personal utility.
  *   **The Hard Truth:** This isn't a principle failure; it's an agency bias. When the editor kills the story, you perceive a loss of *potential* asset (the story's impact). When you kill the book, you perceive a liberation from *future* cost.
  *   **Why it feels compelling:** In Scenario A, you were advocating for the *profession's* standard (long reporting has value). In Scenario B, you were acting as a *producer* (this book won't work). You were right in both moments, but you cannot universalize the feeling. You cannot demand editors never kill long projects while reserving the right to kill your own long projects instantly. You must admit that sometimes, 18 months is just 18 months gone (Case 3), regardless of who says so.

  ***

  ### Application to New Cases

  Here is how the Residual Asset Rule applies to your three new scenarios.

  **1. The Fifth-Year Grad Student (Method Broke)**
  *   **Situation:** 5 years in, method failed halfway.
  *   **Analysis:**
      *   *Complementarity:* No. A broken method does not make finishing easier.
      *   *Constraint:* Yes. A dissertation is a contractual requirement for the degree.
      *   *Epistemic Yield:* **Crucial.** Did the failure produce data?
  *   **Verdict:** **Pivot, don't grind.** If the method is truly broken, Clause A fails. However, Clause B (degree requirement) and Clause C (negative results are data) apply.
  *   **Instruction:** Do not spend Year 6 trying to force the broken method (Sunk Cost). Spend Year 6 writing up *why* it broke and pivoting to a viable question that uses the existing literature review (Residual Asset). If no pivot is possible, the rational move is to leave the program (Case 2). Staying to "finish" a broken experiment is Case 6 behavior.

  **2. The Space Mission (Target Less Interesting)**
  *   **Situation:** Mission extended, target underwhelming.
  *   **Analysis:**
      *   *Complementarity:* High. The hardware is in place (Case 4 logic). The marginal cost of extension is usually low compared to launch.
      *   *Constraint:* Low. No one forces an extension.
      *   *Epistemic Yield:* Unknown. "Less interesting" is a hypothesis.
  *   **Verdict:** **Extend, but with a sunset clause.** The launch cost is sunk (Case 1). The spacecraft is a Residual Asset (Clause A). As long as the marginal cost of operation < marginal value of data (even boring data), you operate.
  *   **Instruction:** Do not extend because "we are already there." Extend because the *marginal cost of data collection* is cheaper than building a new mission. If the data becomes truly worthless, cut power (Case 8).

  **3. The Family House (Overpaid)**
  *   **Situation:** Refuse to sell because they overpaid.
  *   **Analysis:**
      *   *Complementarity:* None. Living in it doesn't make selling it later more profitable.
      *   *Constraint:* Emotional only.
      *   *Epistemic Yield:* None.
  *   **Verdict:** **Sell immediately.** This is Case 1 (Stadium) and Case 3 (Tickets) combined. The purchase price is a sunk cost. The only relevant variables are: (1) Do they like living here? (2) Is this the best use of their capital?
  *   **Instruction:** The "loss" is realized only if they hold the asset expecting it to rebound to their buy-in price. If the market says the house is worth less, the $X they overpaid is gone. Refusing to sell is paying a monthly premium (mortgage/opportunity cost) to avoid admitting a past error. This is the most dangerous form of sunk cost thinking because it compounds.

  ### Summary for your Editors

  To resolve the accusation of inconsistency, tell them this:

  > "I am not inconsistent about sunk costs. I am inconsistent about *what counts as an asset.*
  >
  > I advocate cutting losses when the past expenditure has left us with nothing but a bill (The Stadium, The Tickets, The Obsolete Technique).
  >
  > I advocate persistence when the past expenditure has left us with infrastructure, reputation, or unique knowledge that changes the economics of the future (The Rail, The Grant, The Theory).
  >
  > I was wrong about the Lab Overhead (Case 6). That was me valuing 'grit' over 'utility.' I will correct that. And regarding my own work (Case 9), I acknowledge that I defend institutional process more fiercely than I defend my own products. That is a bias, not a principle."

  This positions you not as someone who breaks the rules, but as someone who has a more sophisticated definition of "value" than the standard economic model, while admitting where your own psychology betrayed that model.
