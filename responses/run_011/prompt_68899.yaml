prompt: |-
  So I'm running a grad seminar session on promissory obligation next week and I've volunteered — nobody made me — to defend the Hume/Rawls practice view against the voluntarists. Trouble is I think the practice view is in worse shape than the standard objection suggests, and I'd rather land the strong version of the worry myself than get fobbed off with the easy answers in the room. Help me build it.

  Here's the setup I'll be using. Call it an orphan promise: you're alone with a friend who's dying, she makes you promise to burn the letters in her desk, she dies an hour later, and nobody else alive has any idea the promise was made. Six months on you find out the letters are of enormous scholarly interest and publishing them would make your career. Everyone named in them is dead too, so stipulate no feelings get hurt. Breaking the promise disappoints no expectation, defeats no reliance, and leaves nobody worse off — the only cost is, on the practice view, one more invisible dent in a social institution, which is exactly the kind of thing a practice theorist thinks they can tally up.

  The claim I want you to argue for isn't the stock "the practice view gets the wrong verdict here." It's this: every repair open to the practice theorist either fails extensionally or works only by conceding the voluntarist's central thesis — that what binds me is my own act of taking on an obligation, with the practice demoted to merely enabling or causal work. So take the two repairs I expect from my students and break both. First, the rule-utilitarian tally: my defection slightly weakens the institution, so it's still wrong. Second, the solitaire-chess reply: the practice is there whether or not anyone's watching, the rules of chess bind me in a game I play alone. For the first, show why the dent is either negligible in precisely the cases where intuition says the obligation is strongest, or has to be inflated until it stops being a fact about the practice and starts being a fact about this particular act. For the second, show why it still owes an answer to "what makes my invocation of the rule normatively loaded, rather than just a description of what I happen to be doing" — and note that the answer it gives is going to be about my intention, not the institution.

  Then as a coda tell me whether the collapse is a genuine reductio or just the discovery that practice views were voluntarism in a sociologists hat all along. Pick a side and say why, I want an actual commitment at the end rather than a both-sides shrug.

  Argument only please, no reading list or bibliography, I know the literature — I just want the moves, laid out tight enough that I could deliver them from a set of index cards.
reasoning: |-
  Here's a thinking process that leads to the suggested argument:

  1.  **Analyze the Request:**
      *   **Task:** Build a strong argument against the Hume/Rawls "practice view" of promissory obligation in favor of voluntarism, specifically using an "orphan promise" case study.
      *   **Context:** A grad seminar session where the user is defending the practice view but believes it's flawed and wants to expose the flaws rigorously.
      *   **Specific Case:** The "Orphan Promise" (dying friend, burn letters, nobody knows, publishing helps career, no harm to others).
      *   **Core Thesis to Argue:** Every repair open to the practice theorist either fails extensionally (gets the wrong result) or concedes the voluntarist thesis (obligation comes from the act of will, practice is just background).
      *   **Specific Objections to Address & Refute:**
          1.  *Rule-Utilitarian Tally:* Defection weakens the institution (the "dent").
          2.  *Solitaire-Chess Reply:* Rules bind even when alone (internal to the practice).
      *   **Coda:** Decide whether this is a *reductio* (practice view is dead) or a *revelation* (practice view was covert voluntarism). No fence-sitting.
      *   **Format:** Argument only, tight, suitable for index cards. No bibliography.

  2.  **Deconstruct the "Orphan Promise" Case:**
      *   *Features:* Secret, no reliance, no expectation, no harm to third parties, high personal gain to break, high institutional cost (allegedly) to keep.
      *   *Intuition:* Most people feel bound to keep it.
      *   *Practice View Challenge:* If obligation stems from the social utility of the institution, why keep a promise that no one knows about and whose breaking causes no institutional ripple?

  3.  **Drafting the Argument - Step 1: The Rule-Utilitarian Tally (The "Dent"):**
      *   *The Move:* Practice theorists say breaking the promise weakens the institution of promising.
      *   *The Counter:* In the orphan case, the break is undetectable.
      *   *The Dilemma:*
          *   Option A: The dent is real but microscopic. If it's microscopic, utilitarian calculus says break it (career gain > invisible dent). This fails extensionally (says breaking is okay).
          *   Option B: The dent is massive/significant. To make the calculus work, the theorist must claim *this specific act* has huge weight. But why? Only because *I* bound *myself*. That shifts the weight from the *practice* to the *act*. This concedes voluntarism.
      *   *Refinement:* Focus on the "invisible" nature. If the institution is a causal mechanism, invisible breaches don't trigger the causal decay. If they do, it's not because of the institution's health, but because of the agent's relationship to the rule.

  4.  **Drafting the Argument - Step 2: The Solitaire-Chess Reply (Internal Rules):**
      *   *The Move:* Rawls/Hume might say practices define obligations internally, like chess rules apply even in solitaire.
      *   *The Counter:* Chess rules are constitutive of the *game*, not necessarily *moral*. Why is the promise rule moral?
      *   *The Dilemma:*
          *   Option A: The rule is just a description of the practice. Then violating it is just "not playing," not "wrong." Fails to generate obligation.
          *   Option B: The rule is normative. Why? Because I *invoked* it. If I play chess alone, I'm just moving wood. If I *promise* alone, I'm binding myself. The difference is my intention to be bound.
      *   *Refinement:* The "Solitaire" analogy fails because chess solitaire is optional play, whereas the orphan promise feels like a moral demand. The source of that demand cannot be the "game" (which no one else is playing) but the player's commitment to the game. That commitment is a voluntarist act.

  5.  **Drafting the Coda: Reductio or Revelation?**
      *   *Choice:* I need to pick a side.
      *   *Option 1 (Reductio):* Practice view is dead.
      *   *Option 2 (Revelation):* Practice view was covert voluntarism.
      *   *Decision:* The prompt asks to argue that repairs concede the voluntarist thesis. Therefore, the "Revelation" (Covert Voluntarism) is the stronger philosophical punchline. It explains *why* the practice view feels plausible (it describes the context) but fails as a foundation (it doesn't generate the norm).
      *   *Argument:* The practice view isn't false; it's incomplete. It describes the *medium* but mistakes it for the *source*. It's voluntarism in sociologist's clothing.

  6.  **Review and Refine (Self-Correction against constraints):**
      *   *Constraint Check:* "Argument only please, no reading list." "Tight enough for index cards."
      *   *Tone:* Academic, rigorous, punchy.
      *   *Structure:*
          1.  The Setup (Orphan Promise).
          2.  Attack 1: The Utilitarian Tally (Negligible vs. Inflated).
          3.  Attack 2: The Solitaire Analogy (Descriptive vs. Normative).
          4.  The Coda: Covert Voluntarism.

  7.  **Final Polish (Mental Walkthrough):**
      *   *Make sure the "Dent" argument hits hard.* If the dent is invisible, utilitarianism says ignore it. If utilitarianism says keep it, it's not because of the dent, it's because of the promise itself.
      *   *Make sure the "Chess" argument distinguishes game rules from moral obligations.* Chess rules don't bind morally; promise rules do. Why? Because of the will.
      *   *Ensure the Coda is decisive.* No "on the one hand."

  8.  **Final Output Generation** (Proceeding to generate the response based on these thoughts).
answer: |-
  **I. The Setup: The Orphan Promise**

  *   **The Case:** Dying friend, secret promise to burn letters. Friend dies. No witnesses. No reliance. No third-party harm. Publishing letters advances your career significantly.
  *   **The Intuition:** You are morally bound to burn the letters. Breaking the promise is wrong, even if no one ever knows.
  *   **The Practice View Claim:** Obligation arises from the social practice of promising. The practice exists to maximize utility/stability. You are bound because your act falls under the rules of this beneficial institution.
  *   **The Target:** Show that any defense of the practice view here either yields the wrong verdict (fails extensionally) or smuggles in voluntarism (concedes the thesis).

  **II. Attack One: The Rule-Utilitarian Tally (The "Dent")**

  *   **The Defense:** "Breaking this promise weakens the institution of promising. Even if secret, it contributes to the decay of trust. The long-term cost outweighs your career gain."
  *   **The Dilemma:**
      1.  **The Negligible Dent:** If the breach is truly secret, it has zero causal impact on the institution's stability. No one's expectations are altered; no one's reliance is shaken. In a utilitarian tally, 0 institutional cost < High career gain.
          *   *Result:* The theory says breaking is permissible. This contradicts the moral intuition. The theory fails extensionally.
      2.  **The Inflated Dent:** To save the verdict, the theorist must claim this specific secret act *does* carry significant institutional weight.
          *   *The Problem:* Why? Causally, it doesn't. The only way to assign it weight is to say the *act itself* has intrinsic normative significance independent of its social ripple effects.
          *   *The Concession:* Once you argue the act has weight *in itself*, you are no longer arguing from the *health of the practice*. You are arguing from the *nature of the commitment made*. You have shifted the locus of obligation from the social institution to the individual act of will. You have conceded voluntarism.

  **III. Attack Two: The Solitaire-Chess Reply (Internal Rules)**

  *   **The Defense:** "Practices define obligations internally, like chess rules. You can play chess alone; the rules still bind your moves. Similarly, the practice of promising binds you even without an audience."
  *   **The Dilemma:**
      1.  **The Descriptive Trap:** In solitaire chess, "breaking a rule" is just moving wood differently. It isn't *wrong*, it's just *not chess*. If the practice view is merely that you are participating in a system, breaking a secret promise is just "opting out of the practice."
          *   *Result:* This fails to generate *obligation*. It explains why breaking the promise is "irregular," but not why it is "immoral."
      2.  **The Normative Gap:** To make the rule binding (moral) rather than constitutive (game-like), we need a bridge. Why does invoking the rule of promising create a *moral* bind, while invoking the rule of chess creates only a *ludic* bind?
          *   *The Problem:* The practice itself cannot answer this. The practice is just a set of regularities.
          *   *The Concession:* The bridge is your *intention*. In chess solitaire, you intend to follow rules for fun. In the orphan promise, you intend to bind your future self morally. The normative load comes from your uptake of the rule, not the rule itself. Again, the work is being done by your will, not the institution. The practice is merely the vocabulary you use to exercise your voluntarist power.

  **IV. The Coda: Reductio or Revelation?**

  *   **The Verdict:** This is not a *reductio* of the practice view; it is a **revelation of its true nature.**
  *   **The Argument:**
      *   Do not declare the practice view "false." Declare it **derivative.**
      *   The practice view is not a rival to voluntarism; it is **voluntarism in a sociologist's hat.**
      *   It mistakes the *medium* of obligation (the social practice) for the *source* of obligation (the will).
      *   We need the practice to make the act intelligible (you can't promise without the concept), but the practice does not make the act binding.
      *   **Final Commitment:** The practice view collapses because it tries to outsource moral authority to a social mechanism. The Orphan Promise proves that when the social mechanism is removed (no audience, no reliance), the moral authority remains. Therefore, the authority must reside in the agent. The practice theorist who insists you are still bound is tacitly admitting that your act of will transcends the social utility of the practice.
      *   **Conclusion:** Defend the practice view only as an account of *how* we promise, never *why* we are bound. If you argue for the "why," you are a voluntarist whether you admit it or not.
