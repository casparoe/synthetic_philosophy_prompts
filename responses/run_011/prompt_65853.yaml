answer: |-
  **Project Title:** Decoder Invariance as a Criterion for Ontological Commitment in Neural Interpretability

  **Project Summary**
  This project addresses a foundational ambiguity in mechanistic interpretability: the status of "features" discovered within neural networks. Current debates oscillate between realism (features are mind-independent structures) and deflationism (features are useful fictions relative to an observer). Both positions implicitly assume that the truth-value of a feature claim (e.g., "this direction encodes the Eiffel Tower") is independent of the *decoding method* used to identify it. I propose that this assumption is false. Feature claims are relative to probes, intervention schemes, tokenizers, and layer selections. The critical unanswered question is whether this relativity is *benign* (analogous to choosing a coordinate system in physics, where the underlying structure is invariant) or *malignant* (analogous to a measuring instrument that constructs the phenomenon it detects).

  Over nine months, I will develop a principled criterion to distinguish benign from malignant decoder-relativity *in advance* of experimental results. This involves formalizing a notion of "decoder equivalence" borrowed from gauge invariance in physics, then testing this criterion against published interpretability results on small language models. The project will yield two papers (one formal/philosophical, one empirical) and a small workshop to stress-test the criterion against competing frameworks.

  **Intellectual Merit and The Gap in Current Positions**
  The central research question is determinate: *Can we define a formal condition of decoder-invariance such that satisfying it is necessary and sufficient for ontological commitment to a neural feature?*

  Existing positions leave this open.
  1.  **Realists** typically assume that if a feature is real, different methods will converge on it. However, they lack a formal account of what counts as "convergence" versus "coincidence," often treating relativity as noise rather than a structural property.
  2.  **Instrumentalists/Deflationists** embrace relativity, arguing that features are only meaningful insofar as they support prediction or intervention. However, this collapses the distinction between a robust structural discovery and an overfitted heuristic. If the only criterion is "does it work?", we cannot distinguish a genuine mechanism from a useful fiction until after the fact.
  3.  **The Correlationist View** (that networks are just statistical mirrors) dismisses the search for structure entirely, ignoring the possibility that some decoding methods reveal stable causal levers while others do not.

  None of these positions offer a *pre-experimental* criterion. They offer post-hoc verdicts. This project moves the debate from "Is this feature real?" to "Under what decoding conditions is the question 'Is this feature real?' well-posed?"

  **Methodology and Work Plan**
  I will proceed in three phases over nine months. Given the constraint of teaching two courses per year and lacking dedicated engineering support, the empirical work will rely on re-analyzing existing results on small, open-weight models (e.g., GPT-2 Small, Pythia-70m) using established libraries (e.g., TransformerLens), rather than training new architectures.

  **Months 1–3: Formalization and Criterion Development**
  *   **Activity:** I will draft the formal framework for "Decoder Equivalence." This involves mapping the space of decoding methods (linear probes, causal interventions, attribution maps) and defining transformations between them.
  *   **Hands-on Work:** Writing formal definitions and proofs regarding invariance. I will treat decoding methods as "gauges" and test whether feature attributions transform covariantly or vanish under gauge transformation.
  *   **Deliverable:** A complete draft of Paper 1 (The Formal Criterion).
  *   **Teaching Load:** Course prep and grading will limit coding time; this phase is primarily theoretical to accommodate teaching spikes.

  **Months 4–6: Empirical Testing and Case Studies**
  *   **Activity:** I will select two candidate case studies from the literature: one suspected to be "benign" (e.g., induction heads or robust linear directions in early layers) and one suspected to be "malignant" (e.g., high-level semantic concepts in deep layers known to be probe-sensitive).
  *   **Hands-on Work:** Writing Python scripts to reproduce these results across *multiple* decoding methods. For the "Eiffel Tower" style claims, I will vary the probe architecture, the tokenization scheme, and the intervention baseline. I will generate plots showing feature stability (or instability) across these variations.
  *   **Deliverable:** Data collection complete; Draft 1 of Paper 2 (The Empirical Demonstration).
  *   **Teaching Load:** Empirical work is modular; I can run experiments during grading windows.

  **Months 7–9: Synthesis, Writing, and Workshop**
  *   **Activity:** Finalizing both papers. Organizing a one-day internal workshop to present the criterion to colleagues in philosophy and computer science.
  *   **Hands-on Work:** Revising manuscripts based on peer feedback. Preparing workshop materials (slides, demo notebooks).
  *   **Deliverable:** Submission of two papers; Execution of workshop.
  *   **Teaching Load:** End of semester grading will overlap with final revisions; buffer time is built into Month 9.

  **Expected Outcomes and Criteria for Success/Failure**
  *   **Success:** A formal criterion is established that is not trivially equivalent to predictive accuracy. Empirically, I will demonstrate that Case A satisfies the criterion (feature persists across decoders) and Case B fails it (feature is decoder-dependent). This validates the distinction between benign and malignant relativity.
  *   **Failure:** The primary risk is that the invariance criterion collapses into instrumentalism (e.g., "invariant features are just those that predict behavior best"). If the formalism adds no discriminatory power over standard cross-validation, the project fails to advance the ontological debate. A secondary risk is that the formalism is too abstract to be computed on actual models within the time limit.
  *   **Mitigation:** I will prioritize computational simplicity in the formal definition to ensure it can be tested on consumer-grade hardware.

  **Feasibility and Resources**
  Nine months is an aggressive timeline for two papers and a workshop while teaching two courses. However, the scope is constrained to make this viable:
  1.  **No Model Training:** I will not train new models. All empirical work is re-analysis of existing weights, which requires compute but not engineering time.
  2.  **Targeted Reproduction:** I am not running a full benchmark suite. I need only two clear case studies to demonstrate the *possibility* of the criterion, not a comprehensive taxonomy of all features.
  3.  **Workshop Scope:** The workshop will be small and internal, reducing logistical overhead.

  The lack of engineering support is a constraint, but it aligns with the project's philosophical focus. The goal is not to build the best interpreter, but to evaluate the epistemic status of existing ones. The teaching load is the primary risk; the timeline above front-loads theoretical work during lighter teaching weeks and reserves modular coding tasks for high-teaching periods.
