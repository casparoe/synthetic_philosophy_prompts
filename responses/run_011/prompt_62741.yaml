      *   **Context:** 420 members, 180 guests housed, Nov-March. Labor is volunteer-based. Core group (61 people) does 94% of the work.
      *   **Task:** Create a decision procedure for the Steering Committee (3 people, no ethics training) to set the annual "ask" (shifts/hours requested per member).
      *   **Constraints:**
          *   Single evening meeting (3 hours).
          *   Plain language, no academic sources/theory references.
          *   Numbered steps with Inputs and Outputs.
          *   Must address 7 specific requirements (Inputs/Outputs, Non-compliance, Capacity/Competence, Incapacity, Demanding vs. Expecting, Supererogation Objection, Value Judgments vs. Choices).
          *   Run the procedure on 3 Cases (A, B, C).
          *   One case must yield an unpopular conclusion.
          *   State limitations (what it can't do, manipulation risks, contested steps, lost nuance regarding "morality vs. organization").

  2.  **Deconstruct the Ethical Problem:**

      *   **Core Tension:** Consequentialism (maximize beds/safety) vs. Deontology/Virtue Ethics/Personal Integrity (don't burn out volunteers, respect personal limits).
      *   **The "Translation":** Moving from "What should *I* do?" (individual ethics) to "What should *we ask*?" (organizational policy).
      *   **Key Variables:** Total Need (Bed Nights * Staff per Shift), Total Capacity (Members * Availability), Retention Risk (Burnout threshold).
      *   **The "Ask":** Needs to be sustainable. If too high, core quits. If too low, guests turned away.
      *   **Fairness:** Equal share vs. Capacity-based share vs. Reality-based share (counting only the reliable 61).

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Step 1: Inputs.* Need concrete numbers. Bed nights, staff per shift, total slots. Member count. Historical retention data.
      *   *Step 2: The Baseline.* Calculate the "Ideal Share" (Total Slots / Total Members). This highlights the gap between theory and reality.
