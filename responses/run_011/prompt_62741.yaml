answer: |-
  # The Shelter Network Annual Ask Procedure

  **Purpose:** To determine the volunteer shift request for the coming winter season in a way that balances guest safety with volunteer retention.
  **Time Required:** 90 minutes for calculation, 90 minutes for discussion.
  **Participants:** Steering Committee (3 members).

  ---

  ## Part I: The Procedure

  **Step 1: Establish the Baseline Need**
  *   **Input:** Total nights open (e.g., 105) × Staff required per night (e.g., 5).
  *   **Calculation:** Multiply nights by staff to get **Total Season Slots**.
  *   **Output:** The minimum number of shifts required to keep current beds open.
  *   **[CALCULATION]**

  **Step 2: Establish the Ideal Share**
  *   **Input:** Total Season Slots (from Step 1) ÷ Total Registered Members (e.g., 420).
  *   **Calculation:** Divide slots by members.
  *   **Output:** The **Theoretical Fair Share** (shifts per member if everyone participated equally).
  *   **[CALCULATION]**

  **Step 3: Establish the Reality Burden**
  *   **Input:** Total Season Slots (from Step 1) ÷ Reliable Core Volunteers (e.g., 61).
  *   **Calculation:** Divide slots by the number of members who actually worked last year.
  *   **Output:** The **Actual Core Burden** (shifts per member if reliance remains unchanged).
  *   **[CALCULATION]**

  **Step 4: Set the Sustainability Ceiling**
  *   **Input:** Last year's retention rate of the Reliable Core; informal survey of core volunteer burnout levels.
  *   **Decision:** Determine the maximum number of shifts a single volunteer can be asked to take before the risk of them quitting becomes unacceptable. (e.g., If 9 shifts caused burnout, set ceiling at 8).
  *   **Output:** The **Maximum Per-Person Ask**.
  *   **[VALUE JUDGMENT]** *This step prioritizes the organization's survival over guest capacity. It asserts that losing the network is worse than turning away guests.*

  **Step 5: Calculate the Gap**
  *   **Input:** Total Season Slots (Step 1) ÷ Maximum Per-Person Ask (Step 4).
  *   **Calculation:** Determine how many active volunteers are needed to meet the need without breaking the ceiling.
  *   **Output:** The **Required Active Headcount**.
  *   **[CALCULATION]**

  **Step 6: Address Capacity Differentiation**
  *   **Input:** List of members with unique constraints (e.g., caregiving) or unique skills (e.g., medical).
  *   **Decision:**
      *   **For High Constraint (e.g., Caregiver):** Classify as "Exempt." Their contribution is recorded as "Membership Support," not "Shift Labor." They are not counted in the Active Headcount.
      *   **For High Utility (e.g., Nurse):** Classify as "Standard Ask + Optional." The baseline ask must be the same as others to avoid penalizing competence. Additional shifts are requested only as "Emergency Pool" sign-ups, not part of the standard obligation.
  *   **Output:** A **Differentiated Roster** (Standard, Exempt, Emergency Pool).
  *   **[VALUE JUDGMENT]** *This step refuses to institutionalize a "competence tax." It treats the nurse's extra value as a bonus to be volunteered, not a duty to be assigned.*

  **Step 7: Address Non-Compliance Strategy**
  *   **Input:** Theoretical Fair Share (Step 2) vs. Actual Core Burden (Step 3).
  *   **Decision:** Choose which number to publish to the membership.
      *   *Option A (Ideal):* Publish the Theoretical Fair Share. (Risk: Core burns out trying to cover the gap).
      *   *Option B (Reality):* Publish a request based on the Required Active Headcount (Step 5), acknowledging not everyone will participate.
  *   **Output:** The **Public Ask**.
  *   **[COMMITTEE CHOICE]** *The procedure runs out here. Math cannot tell you whether to lie to the membership about fairness or tell the truth about inequality.*
  *   **Reasoning for November Vote:**
      *   *If Option A:* "We ask 1 shift each. We know not everyone can, but we ask everyone to try. Those who can do more, please do."
      *   *If Option B:* "We need X people to take Y shifts. If you are able, this is the target. If you cannot, we understand, but the network relies on those who can."

  **Step 8: Address the Supererogation Objection**
  *   **Input:** A member states, "This request is above and beyond moral duty; I am not required to do this."
  *   **Decision:**
      *   **If < 10% of members object:** The Committee absorbs the objection. Reply: "You are correct that this is beyond strict duty. But the network only exists if some of us go beyond duty. We are asking you to be part of that 'some'."
      *   **If > 10% of members object:** The Committee concedes. The **Maximum Per-Person Ask (Step 4)** must be lowered, and the **Total Season Slots (Step 1)** must be reduced (beds closed).
  *   **Output:** A **Threshold Rule** for scaling back operations.
  *   **[VALUE JUDGMENT]** *This step defines the limit of organizational demand. It admits the organization cannot compel moral sainthood.*

  ---

  ## Part II: Running the Procedure

  ### Case A: Ordinary September
  *   **Inputs:** 525 Total Slots. 420 Members. 61 Reliable Core.
  *   **Step 1:** 525 Slots.
  *   **Step 2:** 525 ÷ 420 = **1.25 shifts/member** (Theoretical Fair Share).
  *   **Step 3:** 525 ÷ 61 = **8.6 shifts/member** (Actual Core Burden).
  *   **Step 4:** Committee recalls 61 volunteers were "spent" last year at 8.6. They set **Maximum Per-Person Ask at 7 shifts**.
  *   **Step 5:** 525 ÷ 7 = **75 Required Active Volunteers**. (We need 14 more reliable people than last year).
  *   **Step 6:** Nurse is placed in Standard Ask (7 shifts) + Emergency Pool. Caregiver is Exempt.
  *   **Step 7:** Committee chooses **Option B (Reality)**. They will ask the 420 members to recruit 14 new reliable people, while asking the core to cap at 7.
  *   **Step 8:** Objection threshold set at 10% (42 members).
  *   **Conclusion:** The Ask is 7 shifts for active volunteers. The network must recruit 14 new core volunteers or close beds.
  *   **Unpopular Conclusion:** The Committee must tell the 61 reliable volunteers to do *less* than last year (7 instead of 8.6) to save them from quitting, which means 105 shifts (20 nights of shelter) are unfunded. **The network must plan to turn guests away in January rather than risk the core quitting.**

  ### Case B: Mid-January Emergency
  *   **Context:** Cold snap. Need double beds (105 extra slots) for 9 days. 61 Core are at their 7-shift cap.
  *   **Step 1:** New Need = 105 slots.
  *   **Step 2 & 3:** Irrelevant. The membership pool is static.
  *   **Step 4:** Sustainability Ceiling is already hit. The Core has said they are "spent."
  *   **Step 5:** Gap is infinite. No capacity exists within the Ceiling.
  *   **Step 6:** Nurse is already at cap. Asking more violates Step 6 (Competence Tax).
  *   **Step 7:** Non-compliance is 100% if we ask the Core.
  *   **Step 8:** If we ask the 40 reachable members, we are asking for emergency supererogation.
  *   **Conclusion:** **The Procedure forbids making the ask.** To ask the Core to exceed the Sustainability Ceiling (Step 4) is to gamble the network's existence next year. To ask the 40 new members is to rely on untested labor during a crisis.
  *   **Verdict:** **Do not open the extra beds.** The procedure prioritizes the survival of the network over the safety of the additional guests during the emergency. This is the conclusion the committee will not like: **You must let people sleep in the cold to ensure the shelter exists next winter.**

  ### Case C: Expansion Proposal
  *   **Context:** Contract for 60 extra beds. Funds staff, but locks in volume.
  *   **Step 1:** New Total Slots = 525 + (60 beds × 105 nights × 5 staff / 38 beds ratio). *Simplified:* The prompt implies a massive increase in labor. Let's assume labor doubles.
  *   **Step 4:** Sustainability Ceiling remains 7 shifts (human limits haven't changed).
  *   **Step 5:** Required Active Headcount doubles. We need ~150 reliable volunteers, not 75.
  *   **Step 7:** We currently have 61. We have no pipeline for 90 more.
  *   **Step 8:** If we sign, and volunteers object later, we are contractually bound to break the Sustainability Ceiling.
  *   **Conclusion:** **Reject the contract.** The procedure requires that labor capacity be secured *before* bed capacity is committed. Signing without 150 reliable volunteers violates Step 4 (Sustainability).
  *   **Verdict:** The procedure produces no verdict on *how* to get 90 new volunteers, only that you cannot sign until you have them.

  ---

  ## Part III: Limitations and Reflections

  **1. Questions the Procedure Appears to Settle But Does Not**
  *   **The Moral Weight of Turning People Away:** Step 4 sets a ceiling to save the network, but it does not calculate the harm done to the guests turned away. It treats network survival as the highest good, which is a value choice, not a mathematical truth.
  *   **The Definition of "Reliable":** Step 3 relies on counting the "61." But who counts them? If we count only those who signed up, the burden looks lower. If we count those who actually showed, it looks higher. The committee can manipulate the "Reality Burden" by changing the definition of reliability.

  **2. How the Committee Can Steer the Inputs**
  *   **Manipulating the Ceiling:** A committee that wants to expand can set the Sustainability Ceiling (Step 4) artificially high, claiming volunteers are "more resilient than they think." A conservative committee can set it low to avoid work.
  *   **Manipulating the Core Count:** If the committee wants to shame the membership, they can use the 420 number in public communications (Step 7, Option A) while privately planning for the 61. This creates guilt without solving the labor gap.

  **3. Steps That Will Be Contested**
  *   **Step 6 (The Nurse):** Members will argue that it is inefficient for the nurse to do the same "Standard Ask" as everyone else when she can handle medical crises. They will argue for utilizing her capacity fully. The procedure blocks this to prevent burnout, but members may view this as wasting resources.
  *   **Step 8 (The Objection Threshold):** Members who believe the work is a strict moral duty will object to the idea that the network should shrink if too many people refuse. They will argue the "Threshold" gives veto power to the selfish.

  **4. The Lost Feature of the Demandingness Debate**
  *   **Morality vs. Organization:** In ethical theory, when morality demands too much, the fault lies in the *theory*. In this procedure, when the ask is too high, the fault lies in the *volunteers* (for not recruiting) or the *guests* (for needing beds).
  *   **The Translation Loss:** The procedure translates "What do I owe?" into "What can we sustain?" This loses the **categorical nature of moral obligation**. A moral duty exists regardless of whether the organization survives. This procedure implicitly argues that **organizational retention is a prerequisite for moral action.** It tells the volunteer: "You don't have to save everyone tonight, because if you burn out, you can't save anyone next year." This is a pragmatic argument, not a moral one. It substitutes *effectiveness* for *duty*. The procedure cannot tell a volunteer if they are morally required to burn out for a guest; it can only tell them that if they do, the organization will not ask them to again.
