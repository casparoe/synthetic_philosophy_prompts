  5.  **Developing the Cases:**

      *   *Case A (Normal):* Standard calculation. Likely shows the gap between 420 and 61.
      *   *Case B (Emergency):* Cold snap. Core is spent. Procedure should likely say "Do not ask more," leading to turning people away. This is the "unpopular conclusion."
