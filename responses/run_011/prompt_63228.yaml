answer: |-
  Here is the specification for a notion of intentional action fit for a sanctions grid, followed by the constraint analysis and theoretical evaluation you requested.

  ### The Specification: Requirements for Policy-Ready Intentionality

  **1. The Cases It Must Adjudicate Consistently**
  *   **The Knobe Cases (Foreseen Side Effects):** It must yield the same verdict on the CEO who harms the environment vs. the CEO who helps it, given identical mental states. *Reason:* Your panel's current inconsistency here violates the principle of equal treatment under the rules.
  *   **The Skilled vs. Lucky Marksman:** It must distinguish the agent who aims and hits from the agent who aims poorly, slips, and hits. *Reason:* Sanctions must track agency, not luck; the lucky incompetent is not less dangerous, but they are less culpable.
  *   **Willful Ignorance (The Ostrich):** It must capture the researcher who avoids looking at data anomalies to maintain plausible deniability. *Reason:* A policy that rewards ignorance incentivizes negligence; this must map to "intentional" or a proximate category.
  *   **Duress vs. Endorsed Compulsion:** It must distinguish acting to avoid immediate threat (duress) from acting on an addiction or impulse the agent identifies with (endorsed compulsion). *Reason:* Mitigation vs. culpability; the former excuses, the latter often explains but does not excuse.
  *   **The Drift:** It must handle the slide from "one-time correction" to "systematic fabrication" where no single moment was a conscious decision to cross the line. *Reason:* Research misconduct is often incremental; a binary intent switch misses the trajectory of culpability.

  **2. The Distinctions It Must Maintain**
  *   **Intentional vs. Merely Foreseen:** It must separate what was the goal from what was a known byproduct. *Reason:* This is the traditional *mens rea* boundary; collapsing it criminalizes risk-taking inherent to research.
  *   **Intentional vs. Blameworthy:** It must allow for intentional acts that are justified (e.g., breaking a protocol to save a subject). *Reason:* Conflating intent with wrongfulness makes the sanction grid circular (you are punished because you are punished).
  *   **Intentional vs. Voluntary:** It must distinguish reflex or habit (voluntary movement) from goal-directed action. *Reason:* You cannot sanction a twitch, only a choice.
  *   **Binary vs. Graded:** It must decide if intentionality is a switch or a dimmer. *Reason:* Policy requires binary triggers for sanctions, but human psychology is graded; the theory must explain how to bin the grades without arbitrariness.

  **3. The Empirical Facts It Must Address**
  *   **The Knobe Effect (Outcome Bias):** It must explain or override the fact that people attribute intent more readily when outcomes are harmful. *Reason:* If the theory doesn't account for this, your panel will unconsciously revert to it during deliberation.
  *   **Linguistic Flexibility:** It must acknowledge that "intentionally" is used loosely in ordinary language to mean "carelessly" or "responsibly." *Reason:* Relying on ordinary language in written policy invites interpretive drift.

  ---

  ### Constraint Analysis: Non-Negotiables vs. Camp Tastes

  **Non-Negotiables (Rule of Law Requirements)**
  1.  **Outcome Independence:** The classification of the act cannot change based on the moral valence or severity of the consequence. *Why:* Without this, you have rule by whim, not policy.
  2.  **Ex-Ante Identifiability:** The agent must be able to know, at the time of acting, whether their conduct falls under the definition. *Why:* Retroactive moralizing violates due process.
  3.  **Provability:** The state of mind must be inferable from objective evidence (emails, logs, timestamps). *Why:* A sanction grid based on inaccessible metaphysical truths is unenforceable.

  **Camp Tastes (Philosophical Preferences)**
  1.  **Deep-Self Alignment:** Whether the act flows from the agent's "true" values. *Why:* This is a taste for moralistic retribution over behavioral regulation; it is too intrusive and hard to prove for administrative policy.
  2.  **Gradability:** Whether intent comes in degrees. *Why:* Philosophy loves degrees; policy needs thresholds. This is a design choice, not a metaphysical necessity.
  3.  **Folk-Concept Matching:** Whether the definition matches how people talk at dinner. *Why:* This is desirable for compliance but secondary to consistency.

  **The Joint Unsatisfiability**
  You are correct: **"Matches how ordinary people actually talk"** and **"Doesn't shift with the moral valence of the outcome"** are jointly unsatisfiable.
  Empirical psychology (the Knobe Effect) demonstrates that the folk concept of *intentionally* is inherently normative. Ordinary speakers *do* shift their usage based on harm. If you build the grid on the folk concept, you import outcome bias into the sanctions. If you demand outcome neutrality, you are stipulating a technical definition that contradicts ordinary usage. You cannot have both.

  **The Single Requirement That Knocks Out the Most Candidates**
  **Outcome Independence.**
  This requirement eliminates the Deflationary/Blame view immediately (which defines intent *as* blame). It severely strains the Folk Concept (which is biased by outcomes). It even pressures Simple Mental-State accounts if they rely on self-reporting, as agents will claim "accident" when harm is high. It is the hardest filter to pass because it fights human cognitive architecture.

  ---

  ### Theoretical Evaluation

  **Plain Mental-State Account:**
  It satisfies outcome independence and ex-ante identifiability but fails to capture willful ignorance and the drift of negligence, leaving a gap where reckless researchers escape sanctions.

  **Deep-Self or Reasons Account:**
  It captures compulsion and endorsed values beautifully but fails the provability and ex-ante identifiability tests, making it a nightmare for administrative adjudication.

  **Deflationary (Blame-Voicing) Account:**
  It accurately describes how your panel is currently behaving, but it renders the sanctions grid circular and legally indefensible by making the punishment determine the violation.

  ### The Recommendation

  What a sanctions policy needs is not a theory of *intentional action*, but a **taxonomy of culpable epistemic states** modeled on the Model Penal Code.

  Abandon the binary "Intentional vs. Accidental." Instead, define four tiers: **Purposely** (conscious objective), **Knowingly** (aware of practical certainty), **Recklessly** (conscious disregard of substantial risk), and **Negligently** (should have been aware). Map your sanctions to these tiers rather than the folk concept of "intentional," which is too contaminated by outcome bias to bear the weight of career-ending decisions.
