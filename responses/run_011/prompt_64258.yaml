  You're going to play a formal epistemologist who has fielded a hundred of these "here's my whole view in a list" emails and is unusually good at spotting the exact plank that gives way. Tough but constructive: I want an audit, not a lecture. Don't summarize the lottery paradox or the preface paradox back at me, I know what they are, and please no reading lists or "you should look at so-and-so's paper" — I'm on a plane with no wifi and won't be able to check anything you recommend. Just work on my package.

  Situation: our reading group asked everyone to write down their position on the lottery/preface cluster so the rest can attack it. I want mine stress-tested before I hand it in. Here's what I actually hold, more or less in the order I came to hold it:

  1. Outright belief isn't credence plus some extra act of commitment. It's the premise state: to believe p just is to be disposed to use p as a premise in your reasoning and to assert it flat out. If you aren't prepared to reason from it, you don't believe it.
  2. Belief is governed by a truth norm — you believe well to the extent that you believe truly — and believing is also not voluntary. I don't choose my beliefs and I don't think anyone can believe at will.
  3. I don't believe my ticket will lose, and I don't think anyone in a big fair lottery knows theirs will. But the probability isn't really my reason. My reason is the kind of evidence: the only thing going for "this ticket loses" is a bare statistical fact about the setup. I hold that bare statistics — nothing particular about this ticket, just the distribution over the field — can't ground outright belief or knowledge. Whereas if I watched the draw and my number didn't come up, then I know, because now I have something particular about my ticket.
  4. That said, the size of the field does matter to me. In a 200-ticket raffle I'm willing to say you know your ticket will lose; in a 30-million-ticket draw I'm not. At some point the statistics get good enough to do the work.
  5. Preface: the author is rational to believe each individual claim in her book, since she checked each one carefully, and she's also rational to believe at least one of them is false, given her track record of getting things wrong in the past. I don't want to call her irrational and I don't want to make her pick one of the two.
  6. I'm not going to do the Kyburg thing. Believing p, believing q, then refusing to believe p and q on the grounds that conjunction closure is too strict looks to me like explaining the paradox away rather than solving it. Belief is supposed to be one body, and if anyone can decline to conjoin whenever it's convenient, there's no such thing any more as an inconsistent belief set to be irrational about.
  7. Practical side: I'd never pay anything meaningful to hedge against my ticket losing, and I never check the results. Someone in the group said last time that this shows I do believe it will lose regardless of what I claim. The same person also said I can't consistently believe that some ticket will win while believing of no particular ticket that it will lose.

  What I want out of you:

  - Before any verdicts, do the pairwise work and show it to me briefly: for each pair that looks like it clashes, check whether one really does rule the other out or whether both can stand as stated. I want to see the check, in a few lines per pair, not the conclusion only.
  - Then the audit itself: which pairs genuinely cannot coexist, ranked worst first. Not a flat list where everything is "in some tension" — I want an ordering. For each real clash, say which commitment has to go, what the minimal replacement would look like, and what the replacement costs me elsewhere. Give me the price tag, not just the fix.
  - Which clashes are only apparent? Two lines each on why, since I want to be able to say it out loud at the meeting.
  - Last: if I'm allowed to change exactly one thing, which single change buys the most coherence? And be straight with me if the honest answer is that the package is fine and I'm inventing problems.

  I can feel that something in there is loose but I honestly can't tell which end of the rope it's at, so don't take any hints from the order I listed them in. Assume I'm equally attached to all seven.
