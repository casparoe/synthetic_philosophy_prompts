  To: Chair and Members, Health Sciences Research Ethics Committee
  From: Lay Member
  Re: Protocol Review – Dr Baloyi (Cognitive Ageing Study)

  We are deadlocked because Dr Baloyi's protocol tests the limits of our SOP clause on *ubuntu*. We must decide if this clause permits gradations of moral standing. I argue it does not, and I recommend approval only under strict conditions that align the study with both relational ethics and fundamental rights.

  Our clinician colleague objects that any ethic where standing is earned or forfeited is disqualified from research. They argue that demoting moral status invariably targets those least able to protest—the isolated, the cognitively impaired, the poor. They propose retreating to a moderate communitarian position: individuals possess inherent standing regardless of community integration, even if their obligations are shaped within it. This objection is strongest where Dr Baloyi proposes enrolling the forty "without others" based on diminished personhood. To treat social isolation as a reduction of moral authority is to risk exactly the exploitation our ethics framework exists to prevent. If we allow the Council to authorize research on those deemed "incomplete" persons, we convert *ubuntu* from a protective philosophy into a tool of exclusion. The people it demotes are invariably the ones least able to protest, and history warns us against granting communities the power to define the humanity of their margins.

  However, we need not reject the SOP clause entirely to survive this objection. The clause cannot bear the weight Dr Baloyi places on it regarding status, but it remains vital for process. A workable version of the clause must specify that relational personhood dictates *how* we engage, not *who* counts. It should require researchers to map relational networks to support consent, not to replace it. Therefore, while the clause requires revision to prevent misuse, we can adjudicate this protocol now by enforcing that distinction. We can honor the relational account where it enhances agency (dementia) without accepting it where it diminishes standing (isolation).

  To resolve the deadlock, I propose approval conditional on the following specific amendments, which Dr Baloyi must confirm by Monday morning:

  First, regarding the forty residents identified as "without others": The justification of diminished personhood is rejected. These participants possess full moral standing. Enrollment requires standard informed consent facilitated by an independent advocate unaffiliated with the Traditional Council. Council authorization alone is insufficient. The protocol must remove any language suggesting their capacity is derived from social integration. They must be treated as full persons whose isolation requires additional protection, not less.

  Second, regarding participants with moderate dementia: Dr Baloyi's proposal is accepted. Seeking renewed assent at every visit honors their sustained personhood within kin networks. Proxy authorization alone remains insufficient. This aligns with relational ethics without compromising standing, as it enhances agency rather than diminishing it. The team must document this renewed assent at each contact.

  Third, regarding Traditional Council approval and individual dissent: Council approval is a necessary condition for site access but not sufficient for individual enrollment. The protocol must explicitly state that individual dissent overrides Council authorization. The team must record and honor objections from community members, such as the younger women cited, without penalty or coercion. The Council cannot bind individuals against their will.

  Fourth, regarding data sharing: The Council's expectation to see data before publication is accepted only as a courtesy review for factual accuracy regarding community context, not as a veto power. The protocol must guarantee the researchers' right to publish findings regardless of Council approval, provided confidentiality is maintained. Academic freedom cannot be subject to traditional gatekeeping.

  Finally, regarding our SOP: I recommend this protocol proceed only on the understanding that our clause will be referred back to the Committee for revision post-meeting. A workable version must explicitly state that relational personhood informs community engagement strategies but never modifies the binary nature of moral standing or the requirement for individual consent.

  This recommendation survives the clinician's objection because it decouples relational *process* from relational *status*. We preserve the inherent worth of the isolated individual while utilizing relational networks to support the vulnerable with dementia. We respect traditional leadership without surrendering individual rights.

  Recommendation: Approve with Conditions.
