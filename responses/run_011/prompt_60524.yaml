      To: Chair and Members, Health Sciences REC
      From: Lay Member
      Re: Protocol [ID] – Dr Baloyi

      We are deadlocked because Dr Baloyi's protocol tests the limits of our SOP clause on *ubuntu*. We must decide if this clause permits gradations of moral standing. I argue it does not, and I recommend approval only under strict conditions that align the study with both relational ethics and fundamental rights.

      Our clinician colleague objects that any ethic where standing is earned or forfeited is disqualified from research. They argue that demoting moral status invariably targets those least able to protest—the isolated, the cognitively impaired, the poor. They propose retreating to Gyekye's moderate communitarianism: individuals possess inherent standing regardless of community integration, even if their obligations are shaped within it. This objection is strongest where Dr Baloyi proposes enrolling the forty "without others" based on diminished personhood. To treat social isolation as a reduction of moral authority is to risk exactly the exploitation our ethics framework exists to prevent. If we allow the Council to authorize research on those deemed "incomplete" persons, we convert *ubuntu* from a protective philosophy into a tool of exclusion.

