answer: |-
  You have constructed a precise and theoretically rich scenario. Your analysis of the voting dynamics is correct, and your intuition about the limitations of the Gibbard–Satterthwaite theorem in this specific context is sharp. You are describing a phenomenon that sits at the intersection of social choice theory, game theory, and coalition formation.

  Here is the carving you requested: the established terminology, the theoretical boundaries, and a proposed definition for your working group.

  ### 1. Terminology for the Joint Change

  There is no single word that captures all three features (threshold, individual stability, group gain) simultaneously, but the standard vocabulary exists to describe each component precisely.

  **The Act: Coalitional Manipulation**
  The standard term for a group of voters changing their ballots to secure a preferred outcome is **coalitional manipulation** (or **group manipulation**).
  *   **Definition:** A coalition $C$ of voters can manipulate a profile if, by jointly reporting preferences different from their true ones, every member of $C$ obtains an outcome they weakly prefer, and at least one member obtains an outcome they strictly prefer, compared to the outcome under truthful reporting.
  *   **Your Case:** The four Ridge voters form a coalition $C$. They all strictly prefer Marsh (2nd choice) over Quarry (3rd choice).

  **The Stability Property: Nash vs. Strong Nash Equilibrium**
  You asked for a name for the property where honesty is immune to individual defection but vulnerable to group defection.
  *   **Individual Stability:** The honest profile you described is a **Nash Equilibrium** in the voting game. No single voter has a profitable deviation.
  *   **Group Stability:** The profile is *not* a **Strong Nash Equilibrium**. A Strong Nash Equilibrium requires that no coalition can jointly deviate to make all its members better off.
  *   **The Rule's Property:** Your voting rule is **Strategy-Proof** (at this profile) but not **Group Strategy-Proof**.
      *   *Note:* A rule is called **Group Strategy-Proof** if *no* profile allows for successful coalitional manipulation. (As discussed below, no reasonable rule has this property).

  **The Threshold Feature: Minimal Winning Coalition**
  The fact that one voter cannot succeed but four can is a function of the **size of the minimal winning coalition**.
  *   In game theory, this is often modeled as a **Threshold Public Good** game. The "good" (electing Marsh) is provided only if the number of contributors (strategic voters) meets a threshold.
  *   In voting theory, this is simply the **manipulation threshold**. It is not usually given a distinct name beyond being a characteristic of the specific coalitional manipulation.

  **Proposed Term for Your Charter:**
  If you need a label for your working group documents that captures the specific "threshold + individual stability" nuance, I propose:
  > **Threshold-Dependent Coalitional Manipulation**

  **Definition:** A voting scenario where truthful reporting constitutes a Nash Equilibrium (no individual gains by lying), but a coalition of size $k > 1$ can jointly deviate to strictly improve the outcome for all coalition members, where $k$ is the minimum number of voters required to alter the winner.

  ### 2. Requirements of the Definition

  You asked what the definition requires regarding gains and thresholds.

  *   **Must every member gain?**
      *   **Standard Theory:** In the definition of **Group Strategy-Proofness**, a manipulation is successful if *all* members of the coalition are at least as well off, and *at least one* is strictly better off (a weak Pareto improvement for the coalition).
      *   **Your Case:** All four members are *strictly* better off. This is a stronger condition than required for the general definition, making your case a robust example of coalitional manipulation.
  *   **Is the threshold essential?**
      *   Yes, for the distinction between *individual* and *coalitional* manipulation. If one voter could achieve the gain, it would be individual manipulation (violating Strategy-Proofness). The threshold is what places this in the realm of Group Strategy-Proofness.
  *   **Must the honest profile be immune to individual defection?**
      *   For the specific phenomenon you identified (Nash but not Strong Nash), **yes**. If an individual could also gain, the profile would not be a Nash Equilibrium, and the "coordination problem" aspect would vanish.
  *   **What about the free-riders (the Marsh voters)?**
      *   The fact that the ten Marsh voters gain without participating is irrelevant to the *definition* of manipulation. It is, however, a classic **Free Rider Problem**. In a real-world setting, this makes the coalition *less* stable (the Ridge voters might demand the Marsh voters contribute something in exchange), but theoretically, the manipulation stands regardless of who else benefits.

  ### 3. Gibbard–Satterthwaite and Stronger Properties

  Your understanding of Gibbard–Satterthwaite (GS) is close, but requires one crucial correction.

  *   **What GS Says:** GS guarantees that for any non-dictatorial rule with $\ge 3$ outcomes, there **exists** at least one profile where **some individual** can benefit by lying.
  *   **What GS Does Not Say:** It does *not* say that *every* profile allows for individual manipulation.
  *   **Your Profile:** Your finding that "nobody gains individually here" does **not** contradict GS. GS only promises that *somewhere* in the universe of all possible profiles, an individual can manipulate. It allows for "islands of stability" (Nash Equilibria) like the one you found.
  *   **The Stronger Property:** You asked if there is a stronger property to rule this out. Yes: **Group Strategy-Proofness**.
  *   **The Cost:** Unfortunately, impossibility theorems extend here too. A result by **Barberà (2001)** (building on GS) shows that essentially **no non-dictatorial voting rule is Group Strategy-Proof**.
      *   **Implication:** You cannot fix this by tweaking the rule. Any rule you choose that respects basic democratic norms will be vulnerable to *some* form of coalitional manipulation at *some* profile. The vulnerability you found is a feature of collective choice, not a bug of your specific charter.

  ### 4. Types of Insincere Ranking

  You asked how this relates to familiar strategies like compromising or burying.

  *   **Compromising:** Voting for a less-preferred candidate to prevent a worse one. (The 4 voters did this: Marsh is 2nd choice).
  *   **Burying:** Ranking a strong rival lower to keep them out of a runoff. (The 4 voters did this: They buried Ridge).
  *   **The Distinction:** In standard literature, "Strategic Voting" usually assumes individual rationality. When the strategy requires coordination to succeed, it is classified specifically as **Coalitional Strategy**.
  *   **Is Coalition Dependence Incidental?** No, it is the defining feature. If one voter could do it, it would be a standard GS manipulation. Because it requires four, it is a **Coordination Game**.
  *   **Name for the Positive Property:** You asked for the name of "honest voting that is self-enforcing person by person but not group by group."
      *   Theoretically: **Truth-Telling is a Nash Equilibrium but not a Strong Nash Equilibrium.**
      *   Descriptively: **Individually Stable, Coalitionally Vulnerable.**

  ### 5. The Normative Feature (The "Good" Lie)

  You asked if the fact that the manipulation produces the Condorcet Winner (Marsh beats both others head-to-head) matters for classification.

  *   **Procedural Classification:** **No.** In social choice theory, "manipulation" is defined by the *misreporting of preferences*, not the *quality of the outcome*. A lie is a lie, even if it produces a "better" winner.
  *   **Welfare Analysis:** However, in political science and welfare economics, this is noted.
      *   Your rule (Top-Two Runoff) fails the **Condorcet Criterion** (it elected Quarry, who loses to Marsh).
      *   The manipulation **restored the Condorcet Winner**.
      *   This is sometimes called **Efficiency-Enhancing Manipulation**.
      *   **Does it matter?** For your charter: Yes. It suggests that while the rule is procedurally vulnerable, the vulnerability might act as a safety valve that corrects the rule's structural flaws (like failing Condorcet). Some theorists argue that rules which are *slightly* manipulable but tend toward Condorcet winners via manipulation are practically superior to rigid rules that elect Condorcet losers.

  ### Summary for Your Working Group

  If you need to present this to your association, here is the precise language:

  1.  **The Phenomenon:** **Coalitional Manipulation**. Specifically, a scenario where truthful voting is a **Nash Equilibrium** (no individual incentive to lie) but not a **Strong Nash Equilibrium** (a group can coordinate to lie).
  2.  **The Requirement:** This requires a **Critical Mass** (in your case, 4 voters). Individual deviation is futile; joint deviation is decisive.
  3.  **The Theorem:** The **Gibbard–Satterthwaite Theorem** guarantees individual manipulability *somewhere*, but not *everywhere*. The vulnerability to *group* manipulation is guaranteed by extensions of GS (Barberà's Theorem); no democratic rule is immune to coalitional strategy.
  4.  **The Outcome:** The manipulation corrected a failure of the **Condorcet Criterion**. The honest winner (Quarry) was a Condorcet Loser; the strategic winner (Marsh) was the Condorcet Winner.
  5.  **Recommendation:** Do not attempt to draft a rule that prevents this. It is mathematically impossible without resorting to dictatorship. Instead, acknowledge that **Threshold-Dependent Coalitional Manipulation** is a known risk. If the membership is large (40 is small; 4,000 is large), the coordination cost usually prevents this. In small bodies, norms of honesty are the only defense, not mechanical rules.

  **Proposed Definition for Your Records:**
  > **Threshold-Dependent Coalitional Manipulation:** A voting configuration in which (1) truthful reporting is a Nash Equilibrium (no single voter benefits from deviation), (2) a coalition of size $k > 1$ can jointly deviate to strictly improve the outcome for all coalition members, and (3) no coalition of size $j < k$ can successfully deviate.

  This captures the threshold, the group nature, and the individual stability you observed.
