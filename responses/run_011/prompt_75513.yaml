answer: |-
  # The Thirty-Fourth Round

  A single coin is tossed until it comes up tails; the holder of the winning ticket receives one unit of the national currency if tails arrives on the first toss, two units if on the second, four if on the third, doubling with every additional head.

  # Round 1

  The Directorate lobby smelled of dust and old paper. Elara placed the ticket on the counter, the paper soft from sixty years of weekly purchases. Above her, the framed statute hung crookedly. It authorized the Reserve Fund at exactly one million units, a round number chosen when the state borders were drawn, unrelated to the game but binding on the office. Officer Vance did not look at the frame. He looked at the ticket, then at the ledger. The ledger was open to the current week, the ink still wet from the previous winner, a man who had caught tails on the twelfth toss. Vance had paid him from the interest. The principal remained untouched. It had remained untouched for thirty years. Vance tapped the ticket with a pencil. The first toss was always public, conducted in the square. The record showed heads. Elara waited. She had bought this ticket every week since her husband died. It was not gambling; it was a dowry for a granddaughter who did not yet know she was owed anything. Vance stamped the first box on the verification form. He did not smile. The routine was the only thing that kept the office solvent.

  # Round 2

  Kael, the junior clerk, sat at the side desk with the payment order form. It was printed on stock from twenty years ago, when the twentieth toss seemed a theoretical horizon. The form had a fixed row of boxes for the amount, ten boxes in total. Kael counted them with his eyes. He knew what the doubling meant. He had seen the ledger entries grow geometrically until the twentieth round, where they always stopped. Today they would not stop. Vance moved the coin to the leather pad. The statute fixed the ticket price at one unit. It had not changed since the founding. Elara kept her hands folded on her cane. She did not watch the coin. She watched Vance's hand. The competence of the Directorate rested on Vance's ability to say no when the numbers grew too large, yet the rule was plain. The coin spun. It settled. Heads. The sound was dull against the leather. Vance recorded it. The payout was now two units. Kael adjusted the pen in his hand. He was the only one without a reputation to protect. He would be the one to sign the order if it came to that.

  # Round 3

  Elara spoke for the first time. She asked if the interest rate on the Reserve had changed. Vance said no. The rate was fixed by the loan agreement with the central bank. The bank refused to lend more against the Reserve than the historical maximum payout. This was the first reason the ticket price remained low. The bank knew the treasury could not physically raise coin beyond the twentieth doubling. The vault held metal, not numbers. Vance explained this without looking up. He was not stating a principle of risk; he was stating a clause in a loan agreement. The collateral was insufficient for higher rounds. Elara nodded. She had heard this before. She treated the ticket as an asset, a standing promise. Her household had budgeted around the possibility of a win for decades. They had not budgeted for this. The coin spun again. Heads. The payout was four units. Kael watched the boxes on the form. They were still empty. He wondered if he could write outside the lines.

  # Round 4

  Vance wiped the coin with a cloth. He had been right about the tail for thirty years. His competence consisted in never having to open the principal. The Reserve earned enough interest to cover the twelfth, the fifteenth, even the nineteenth toss. But the twentieth was the limit. The statute authorized the million units. The twentieth toss required five hundred thousand. The twenty-first required the whole million. The twenty-second required more than the state possessed. Vance knew the math without writing it. He did not need formulas on glass. He needed the ledger to balance. Elara shifted her weight. She was old. The second reason the ticket price remained low surfaced in her silence. A holder could not spend a promise while still alive if the payout exceeded the lifespan of the holder. She would not live to spend twenty million units. The bank would not cash a note that large. It would sit in her account until she died, then revert to the state. Vance tossed the coin. Heads. The payout was eight units. The rhythm was steady. The office was quiet.

  # Round 5

  Kael picked up the payment order. He needed three signatures. His, Vance's, and the Director's. The Director was not in the building. The form required the amount to be written in the boxes, one digit per box. There were ten boxes. The tenth box represented billions. Kael looked at Elara. She was looking at the statute frame. The round number authorized there was a million. The current payout was sixteen units. It was still small. But the sequence was running long. The public had stopped watching after the tenth toss. They knew the history. They knew the Reserve was sized to that history. No payout had ever come out of current receipts. Every winner in living memory had been paid from the interest. Elara knew this. She had treated the ticket as a kind of standing promise, not a windfall. Vance tossed the coin. Heads. The payout was thirty-two units. Kael put the pen down. He waited for the number to outgrow the form.

  # Round 6

  The air in the lobby grew heavy. The coin was silver, worn smooth on the edges. Vance checked the edge for wear. It was within tolerance. The procedure required a fair coin. The procedure did not account for a run beyond the twentieth toss. Vance looked at Elara. He asked if she wanted to stop. The rules did not allow stopping. The coin must be tossed until tails. Elara said nothing. She gripped her cane. The wood was polished from use. She had bought the ticket every week for decades. The household had treated it as an asset. Now the asset was becoming a liability. The Directorate could not pay beyond the Reserve. The Reserve was a million units. The twenty-first toss would consume it. The twenty-second would break the state. Vance tossed the coin. Heads. The payout was sixty-four units. The number was still small. The tension was not in the value. It was in the sequence.

  # Round 7

  Kael opened the drawer where the sealed device was kept. It was a black box with a lever. The coin was withdrawn. Nobody would trust a coin tossed that many times in public. The substitution altered nothing arithmetically. It altered everything about credibility. The device generated the result internally. It was certified by the central bank. Vance placed the device on the counter. He pulled the lever. The display showed heads. The payout was one hundred twenty-eight units. Elara did not look at the device. She looked at Vance. She knew the vault did not hold enough metal. She knew the bank would not accept the note. She was not playing for the money. She was playing for the rule. The rule was plain. The Directorate had sold this ticket at a price fixed by statute. They had never once had to pay past the twentieth toss. Now they had to. Vance pulled the lever. Heads. The payout was two hundred fifty-six units.

  # Round 8

  Vance's hand hovered over the lever. He was thinking about the loan agreement. The bank refused to lend more against the Reserve. The collateral was insufficient. The Reserve was a million units. The payout was still far below that. But the trajectory was clear. Kael watched the boxes on the form. Ten boxes. The number was growing. It would fit for a while. Then it would not. Elara stood straighter. Her household had budgeted around the possibility of a win. They had not budgeted for this. The asset was becoming real. The liability was becoming real. Vance pulled the lever. Heads. The payout was five hundred twelve units. The office was silent. The dust motes floated in the light from the window. The statute frame hung crookedly. The round number authorized there was a million.

  # Round 9

