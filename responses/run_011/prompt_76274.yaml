answer: |-
  **Exam Question: Political Economy of Market Socialism**

  **Time Allowed:** 45 Minutes
  **Marks:** 25

  **Question:**
  Consider a modified Lange-Lerner mechanism. A Central Planning Board (CPB) sets producer-goods prices parametrically and revises them nightly against reported surpluses and shortages. Additionally, the CPB runs a standing auction in which any manager may bid for publicly owned capital to operate a production process appearing *nowhere* on the board's technology menu. Entry is free, and losing bids are disclosed to the winner.

  Does this institutional innovation resolve Hayek's objection to socialist planning? Does the verdict change when the objection in view is Mises's rather than Hayek's? In your answer, you must distinguish between the claim that no equilibrium price vector exists and the claim that no one can arrive at or identify one, and account for why an adjustment rule operating on quantities already reported to the board differs in kind from the discovery of data nobody possesses in advance.

  ***

  ### Model Answer

  The proposed institutional innovation introduces a hybrid mechanism: a tatonnement process for known goods combined with an entrepreneurial auction for novel production processes. To evaluate this, one must distinguish between the epistemic constraints identified by Hayek and the institutional preconditions identified by Mises.

  Hayek's objection is fundamentally epistemic. He argues that the data required for rational calculation are not given to a single mind but are dispersed as tacit knowledge of "time and place." The standard Lange model fails here because the CPB's adjustment rule operates on quantities *already reported*. It is a feedback loop utilizing past data to correct prices. It assumes the technology set is known. The proposed auction attempts to bridge this gap by allowing managers to propose new processes. However, disclosing losing bids to the winner only transmits *codified* information (prices and technical coefficients). It does not transmit the tacit knowledge underlying why a specific local combination of resources works. A manager might bid based on local knowledge of a machine's idiosyncratic capacity, but the bid itself reduces this to a number. The CPB and other managers see the price, not the knowledge. Therefore, while the auction improves upon the static Lange model by simulating entry, it does not fully resolve Hayek's objection. The adjustment rule remains reactive to reported data, whereas Hayek's market process is proactive in *generating* data that nobody possesses in advance. The auction captures the *result* of discovery, not the discovery process itself.

  The verdict changes when addressing Mises. Mises's objection is not primarily about the speed of calculation or the dispersion of knowledge, but about the *existence* of genuine prices. For Mises, rational calculation requires private property in the means of production to generate genuine exchange ratios. Without private ownership, there is no opportunity cost in the strict sense, because the decision-maker does not bear the residual loss. In the proposed auction, managers bid for *publicly* owned capital. Even with free entry, the managers are agents, not owners. If a winning bid fails, the loss is socialized; if it succeeds, the gain is likely appropriated by the state. Without residual claimancy, the bids lack the credibility of market prices. They are guesses, not commitments backed by property.

  This distinction clarifies the difference between equilibrium existence and identification. A general equilibrium vector might mathematically exist (the solution to the simultaneous equations), which addresses the static allocation problem. Hayek argues that even if it exists, no one can *identify* it due to knowledge dispersion. The auction helps here by decentralizing the search, though it fails to capture tacit dimensions. Mises, however, argues that without private property, the equilibrium prices *cannot exist* in an economic sense because there is no exchange of title. The "prices" generated by the auction are shadow prices, not market prices. They reflect technical trade-offs but not the subjective valuations of owners risking their own capital.

  Therefore, the innovation partially mitigates Hayek's concern by introducing a discovery procedure for technology, moving beyond simple quantity adjustment. However, it fails to solve the epistemic problem of tacit knowledge encoded in bids. Against Mises, the innovation fails completely. The mechanism simulates the form of a market (bidding) without the substance (property rights). The adjustment rule on reported quantities differs from data discovery because the former optimizes within a known set, while the latter expands the set. Yet, without private property, the expansion remains a technical exercise rather than an economic calculation. The auction creates a market for *management*, but not for *capital*. Consequently, the calculation problem remains unsolved on Misesian grounds, even if the knowledge problem is partially alleviated on Hayekian grounds.

  ***

  ### Marking Scheme

  **Total Marks:** 25

  **Core Requirements (Pass Threshold):**
  *   Accurate description of the mechanism (Tatonnement + Auction).
  *   Identification of Hayek (Knowledge) vs. Mises (Property/Calculation).
  *   Attempt to apply the mechanism to both objections.

  **Differentiating Criteria: Strong Second (15–19 marks) vs. First (20–25 marks)**

  | Criterion | Strong Second (2:1) | First Class (1st) |
  | :--- | :--- | :--- |
  | **Mises vs. Hayek Distinction** | Identifies that Mises focuses on property/incentives and Hayek on knowledge/dispersion. | Explicitly distinguishes between **equilibrium existence** (Mises: prices cannot exist without property) and **equilibrium identification** (Hayek: prices exist but cannot be known). |
  | **Analysis of the Auction** | Notes that the auction allows for new technology entry, improving on standard Lange. | Analyzes the **"losing bids disclosed"** feature: recognizes it transmits codified data but fails to transmit **tacit knowledge**, thus only partially addressing Hayek. |
  | **Adjustment vs. Discovery** | Describes the CPB rule as reactive (using past surpluses). | Explains the **kind difference**: Adjustment rules optimize within a known constraint set; Discovery generates **data nobody possesses in advance** (expanding the constraint set). |
  | **Property Rights Analysis** | Notes managers are not owners. | Explains **residual claimancy**: Bids lack credibility without skin in the game; shadow prices $\neq$ market prices. |

  **Major Errors (Costly Penalties)**
  *   **Error 1: Treating a General-Equilibrium Existence Theorem as a refutation of Mises.**
      *   *Deduction:* -5 Marks.
      *   *Reasoning:* This fails because Mises denies the *institutional preconditions* (property exchange) required for the theorem to apply to reality, not the mathematical logic itself. Proving a solution exists mathematically does not prove a socialist board can generate the economic inputs required for that solution.
  *   **Error 2: Folding Hayek's Knowledge Argument into an Incentives Argument.**
      *   *Deduction:* -5 Marks.
      *   *Reasoning:* This fails because Hayek's argument is **epistemic**, not motivational. He argues that even benevolent, perfectly motivated planners *cannot* access dispersed knowledge. Conflating this with "managers won't work hard" misses the calculation/knowledge constraint entirely.

  **Grade Boundaries:**
  *   **20–25:** First. Contains all "First Class" moves. Clean distinction between existence/identification. Nuanced view on tacit knowledge vs. codified bids.
  *   **15–19:** Strong Second. Good distinction between Mises/Hayek but may treat the auction as fully solving Hayek, or lacks depth on the "adjustment vs. discovery" distinction.
  *   **10–14:** Lower Second. Narrates the debate history rather than analyzing the mechanism. Conflates Mises and Hayek.
  *   **0–9:** Fail. Fails to address the specific institutional stipulations or fundamental economic concepts.
