prompt: |-
  I run integrity policy at a big platform -- basically I decide what gets labeled, demoted, or removed during elections and health crises, and my whole working world is reach, prevalence, label click-through, classifier precision/recall, and harm taxonomies. I've been trying to read Arendt on political lying -- the Pentagon Papers essay and the companion piece on truth and politics -- and I can't shake the feeling that she and I are describing the same phenomenon in two languages that don't line up.

  So: restate her main claims in my vocabulary, as faithfully as you can manage. What does her distinction between factual truth and rational truth correspond to on my side? What does the claim that lying doesn't merely install a false belief but dissolves the shared world look like as a statement about my metrics? Where does her image-maker-vs-statesman point land -- is there anything structurally like it in how platform PR and gov-affairs shops operate? And when she says consistent lying makes reality liquid so that everything becomes believable and nothing is, is that a prevalence claim, a calibration claim, or something my framework has no slot for?

  Then the residue report, which is the part I actually want. Tell me which of those translated cleanly, which you had to bend to fit, and which have no expression at all in a framework where every harm bottoms out in harm to a user's beliefs, safety, or the quality of discourse. I'm suscpicious that "the common world" has no counterpart in my taxonomy and that translating it as something like the shared information environment smuggles in a neutral, market-flavored thing that her idea definitely isn't. Then take a position: does the residue mean she's pointing at something my framework structurally cannot see, or are some of her claims doing metaphorical work and the loss is smaller than it looks? And don't quietly convert her into a consequentialist harm-reducer to make the translation go through -- if you catch yourself doing that, flag it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Senior Integrity Policy lead at a major tech platform. Deeply fluent in metrics (reach, prevalence, CTR, precision/recall, harm taxonomies). Pragmatic, operational, likely cynical but earnest about their work.
      *   **Task:** Translate Hannah Arendt's political philosophy (specifically "Lying in Politics" and "Truth and Politics") into the user's operational vocabulary.
      *   **Specific Questions to Address:**
          *   Factual vs. Rational Truth $\rightarrow$ Platform metrics/categories?
