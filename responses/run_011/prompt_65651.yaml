          *   Image-maker vs. Statesman $\rightarrow$ Platform PR/Gov-Affairs structure?
          *   "Reality becomes liquid" $\rightarrow$ Prevalence, calibration, or unclassifiable?
          *   **Residue Report:** What translated cleanly? What required bending? What has no expression?
          *   **Critical Evaluation:** Does the residue indicate a structural blind spot, or is Arendt just being metaphorical?
          *   **Constraint:** Do *not* quietly convert Arendt into a consequentialist harm-reducer. Flag if tempted.

  2.  **Deconstruct Arendt's Core Concepts (Mental Sandbox):**
      *   *Factual Truth:* Brutal facts (e.g., "Germany invaded Belgium"). Contingent, could be otherwise, but once happened, they are immutable.
      *   *Rational Truth:* Philosophical/Mathematical truths (2+2=4). Necessary truths.
      *   *The Lie:* Not just error. It's intentional fabrication to alter reality.
      *   *The Shared World (Common World):* The space of appearance where we act together. Relies on stable facts.
      *   *Image-Maker vs. Statesman:* The liar (image-maker) creates a coherent fiction; the statesman deals with the messy real.
      *   *Liquid Reality:* If you lie enough, nothing is stable. Cynicism reigns. "Everything is believable and nothing is."

  3.  **Drafting the Translation (Iterative Process):**

      *   *Factual vs. Rational Truth:*
          *   Rational Truth $\approx$ Classifier Logic/Code. (If X then Y). Immutable within the system.
          *   Factual Truth $\approx$ Ground Truth Labels / Human Annotation. (Did this event happen?).
          *   *Correction:* Arendt cares about *political* factual truth. In platform terms, this is "Verified Event Data" vs. "Policy Logic."
          *   *Better:* Rational Truth = Policy Logic (The Rules). Factual Truth = Content Ground Truth (The Reality being moderated).

      *   *Lying dissolving the shared world:*
          *   Arendt says it destroys the ground for action.
          *   Platform terms: It breaks the "Contextual Integrity" or "Signal-to-Noise Ratio."
          *   Metric: It's not just prevalence of falsehoods. It's the *variance* in user perception of reality. It's a collapse in *inter-rater reliability* among the user base. If users can't agree on what happened, engagement becomes chaotic.
          *   *Key Metric:* "Consensus Stability" or "Epistemic Fragmentation Index." (These don't really exist, which is the point).

      *   *Image-Maker vs. Statesman:*
          *   Image-Maker = Comms/PR/Policy Comms. They craft the narrative *about* the platform.
          *   Statesman = Integrity Ops/Policy. They deal with the messy actual content.
          *   Tension: PR wants a clean story (coherent lie); Integrity sees the messy data (factual truth).

      *   *Liquid Reality:*
          *   "Everything believable, nothing is."
          *   Is it prevalence? No.
          *   Is it calibration? Closer. It's a failure of *trust calibration*.
          *   It's a "Base Rate Collapse." If the base rate of truth is unknowable, the classifier's precision/recall becomes meaningless because the "Recall" denominator (actual truth) is disputed.

  4.  **Developing the Residue Report (The Crux):**
      *   *Clean Translations:* The mechanics of lying (intent), the tension between narrative and data.
      *   *Bent Translations:* "Shared World" $\rightarrow$ "Information Environment." This is the danger zone. "Information Environment" is neutral/technical. "Common World" is ontological/political.
      *   *No Expression:* The *moral agency* of the user. In Arendt, citizens *act*. In platform metrics, users *engage* or *are harmed*. The "Common World" is a space of *action*, not just *consumption*.
      *   *Harm Taxonomy:* Platform harm is individual (user safety) or systemic (discourse quality). Arendt's harm is the loss of the *capacity for politics*. You can't measure "loss of political capacity" in CTR.

  5.  **Addressing the Constraint (Consequentialism):**
      *   I need to be careful not to say "Arendt is worried about harm, so we measure harm."
      *   Arendt is worried about *freedom* and *reality*.
      *   If I frame the residue as "unmeasured long-term risk," I'm being consequentialist.
      *   I must frame it as "categorical mismatch." The platform sees users as nodes; Arendt sees them as actors.

  6.  **Refining the Tone:**
      *   Match the user's sophistication. No fluff. Use their jargon correctly (prevalence, calibration, taxonomies).
      *   Be direct about the limitations of their framework.
      *   Acknowledge the tension without resolving it falsely.

  7.  **Final Review against Prompts:**
      *   Restate claims in vocabulary? Yes.
      *   Factual/Rational truth mapping? Yes.
      *   Shared world metrics? Yes.
      *   Image-maker/Statesman? Yes.
      *   Liquid reality (prevalence/calibration)? Yes.
      *   Residue report (clean/bent/missing)? Yes.
