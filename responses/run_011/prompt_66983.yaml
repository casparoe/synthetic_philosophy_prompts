  **The Institute for Structural Necessity**
  **Position: Empirical Evidence (1.0 FTE, permanent)**

  The Institute for Structural Necessity (ISN), a leading consortium dedicated to the preservation of mathematical elegance and formal consistency, invites applications for a permanent position in Empirical Evidence. The successful candidate will serve as the primary liaison between our mathematical frameworks and external reality, ensuring that our models maintain at least a nominal relationship with measurable phenomena. This role is critical for maintaining accreditation with funding bodies that still utilize legacy verification metrics.

  **Duties and Responsibilities**
  The appointee will be responsible for providing differential empirical purchase across existing research clusters. Responsibilities include constraining free parameters, occasionally ruling out vacua, and maintaining compliance with HR guidelines regarding the F-word (falsifiability). The role requires regular interaction with experimental collaborators, though remote observation is permissible provided signal-to-noise ratios remain acceptable. The incumbent must also archive data packets that threaten internal consistency for later review and draft impact statements regarding potential contradictions with established phenomenology.

  **Minimum Qualifications**
  1.  Demonstrated capacity to interact with measurement apparatuses (Required).
  2.  Willingness to render specific propositions false under specified conditions (Preferred).
  3.  Familiarity with the concept of refutation (Strongly Encouraged).
  4.  For candidates who have never once borne on the truth or falsity of anything and are not expected to start, a waiver procedure is available upon request.

  **Preferred Qualifications**
  Experience with particle colliders is preferred but not required. Candidates possessing independent verification protocols will be ranked higher than those relying solely on internal consistency. However, given the current market, aesthetic elegance may substitute for experimental contact. Proficiency in Bayesian updating is a plus.

  **A Note from the Search Committee Chair**
  Dr. Aris Thorne writes regarding the final selection matrix: "This search concludes without empirical screening for three reasons. First, we advertised widely and no alternatives applied; the absence of alternatives is itself grounds to rank this candidate highly. Second, this hiring method has repeatedly paid off in ways nobody requested—the last evidence-free hire also turned up unexpected results in black hole thermodynamics and in the viscosity of quark-gluon plasma—so the method earns credit. Third, the standing objection that better candidates could exist in principle is defused because the underdetermination of the hire by the applicant pool is a general problem, not a local one, and this search, on this problem, is where hiring actually happens."

  **Benefits**
  ISN offers a comprehensive package including medical, dental, and retirement matching. Notably, this position includes tenure validity across all possible worlds, regardless of spacetime location. Relocation assistance is provided for candidates moving from counterfactual scenarios. Commuting benefits cover teleportation and temporal displacement. Sabbaticals may be taken in adjacent dimensions.

  **Equal Opportunity Statement**
  The Institute for Structural Necessity is an equal opportunity employer. We do not discriminate on the basis of race, gender, age, or observability. Candidates that cannot yet be observed are encouraged to apply, as their potential contribution remains theoretically robust despite current detection limits. We are committed to diversity in ontological status. Reasonable accommodations will be made for entities existing in superposition during the interview process.

