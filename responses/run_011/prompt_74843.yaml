answer: |-
  Let's be honest about what the ITN framework is trying to do. We want to allocate limited resources to where they do the most good. Importance asks how big the problem is. Tractability asks how solvable it is. Neglectedness is supposed to tell us how much room is left for us to contribute. But I'm arguing that neglectedness isn't a third property of a cause area. It's a confused proxy for marginal tractability, and keeping it as a separate pillar actively distorts our decision-making.

  Here's the diagnosis. When we ask about neglectedness, what question are we actually trying to answer? We aren't actually curious about the headcount of researchers or the dollar volume of current funding for its own sake. We care about those numbers only insofar as they predict the expected marginal value of the next unit of effort we add. We want to know: if I move into this space, how much good will *my* specific contribution do?

  The problem is that "neglectedness" as currently used answers this with a proxy: "how many people are already there?" This is a bad proxy because it assumes a standard unit of intervention that doesn't exist. Is the unit a year of one person's career? A million dollars? A whole new organization? These are not interchangeable. A field might be "neglected" in terms of headcount but saturated in terms of capital, or vice versa. More importantly, impact isn't linear with headcount. One exceptional researcher might produce more value than fifty average ones. If you define the unit as "a person," you ignore variance in talent. If you define it as "a dollar," you ignore diminishing returns on funding vs. talent bottlenecks.

  Once you realize the real question is about marginal value, neglectedness collapses. If a field is crowded and my marginal contribution is low, that's diminishing returns. That is a claim about tractability—specifically, marginal tractability. If a field is neglected because it's impossible to spend money there effectively (low elasticity of total resources), that's also a tractability constraint. It doesn't make the cause better; it makes it harder to scale. By separating neglectedness out, we treat "few people working on it" as a virtue in itself, rather than checking whether those few people are there because the work is hard, unrewarding, or already done.

  Consider the standard cases people wave at to defend neglectedness. Take crowded fields versus empty ones. The intuition is that if everyone is doing something, the low-hanging fruit is gone. That is literally the definition of diminishing marginal returns. It's a tractability claim. Or take the "but if everybody did this" intuition. This is usually invoked to say we shouldn't all become AI safety researchers. But the reason we shouldn't all do that isn't because AI safety is inherently less neglected; it's because the marginal value of the 10,000th researcher is lower than the 10th. Again, diminishing returns.

  What about discovery-of-new-evidence cases? Suppose someone finds a new lever that makes a neglected cause suddenly solvable. Defenders say neglectedness explains the value here. I say this is about uncertainty in tractability. The cause wasn't valuable because it was neglected; it was valuable because the new evidence raised the expected tractability. The neglectedness was just a correlation, not the cause of the value. In every case, the work being done by "neglectedness" is actually being done by assumptions about how quickly returns diminish and how uncertain we are about the remaining work. Both of those belong under tractability.

  Now, I know the objections. You're smart, and you've heard them before. I'm not going to strawman them.

  The first objection is the pile-on worry. If you drop neglectedness, you license everyone to pile into whatever currently looks highest-EV. If longtermism looks best, everyone becomes a longtermist. This creates fragility. If we're wrong about that one cause, we've wasted a generation. Neglectedness acts as a diversification constraint.

  My reply is that this objection conflates epistemic uncertainty with portfolio theory. If a cause is truly highest-EV, piling on is the correct move unless you believe the marginal returns drop precipitously. If they do drop, that's tractability again. If they don't, diversification is actually losing value. The only reason to diversify is if you suspect systematic error in your EV estimates. But "neglectedness" is a crude tool for that. It says "avoid what others like." But what if others are right? Diversification should be driven by explicit uncertainty in our models, not a heuristic that penalizes popularity.

  The second objection is stronger. It's about anti-herding and correlated errors. The worry isn't just that we all move physically into one space; it's that our estimates are correlated. If everyone thinks AI is most important, our estimates are likely sharing the same blind spots. Neglectedness does anti-herding work that naive expected value reasoning can't, because the herding is in the estimates themselves, not just in the world.

  This is the strongest case for keeping the term, but it still doesn't make it a third factor. It makes it a correction factor for epistemic independence. If everyone agrees on an estimate, the probability of shared error goes up. But calling this "neglectedness" is misleading. It suggests the value lies in the emptiness of the field. It doesn't. The value lies in the information signal of disagreement. If a field is neglected because everyone who looked at it concluded it was a dead end, that's not an opportunity; it's a warning. Treating it as a positive factor ignores the information contained in others' absence. We should adjust for correlated errors explicitly in our uncertainty bounds, not bake it into a separate virtue criterion that rewards emptiness regardless of why it's empty.

  So, does the triad survive as a checklist? Someone will say: "Fine, maybe it's not ontologically real, but it's a useful prompt to make people look up." Is that concession cheap or costly?

  I think it's costly. Language shapes thought. If we keep "Neglectedness" as a checklist item, we reify it as an independent source of value. We encourage people to look for empty rooms rather than valuable rooms. We incentivize contrarianism for its own sake. A useful heuristic should not systematically bias you toward thinking empty fields are better than crowded ones unless you've already accounted for diminishing returns.

  If we need a checklist, it should be Importance, Tractability, and Independence. Or better yet, just Importance and Marginal Tractability, where tractability explicitly includes diminishing returns and epistemic uncertainty. Keeping "Neglectedness" invites the error of thinking that being alone is a virtue. It isn't. Being alone is only useful if it means you have high marginal leverage. If we drop the term, we force ourselves to do the harder work of estimating marginal returns directly, rather than counting heads and hoping the math works out.

  The triad is elegant, but elegance isn't truth. Neglectedness is a shadow cast by tractability and epistemic uncertainty. Let's stop chasing the shadow.
