prompt: |-
  So, weird request, but bear with me. I'm a fourth-year in formal epistemology and our grad workshop is running an experiment where two people who have been arguing about the same question for a year have to produce an adversarial collaboration document instead of another round of emails. I drew the short end of the stick. My position is that probability kinematics is derivative: everything that counts as learning is really learning that some proposition, however gerrymandered it has to be (a description of your total experience, a self-locating claim, a sentence about how things look to you right now), and once you have written that proposition down you just conditionalize on it, with Jeffrey updating falling out as a special case when the proposition happens to pin down a partition. My opponent holds basically the mirror image: perceptual experience is not propositional, the rigidity condition is not a hidden assumption but a genuine empirical constraint on how the world and your perceptual system line up, and kinematics is the fundamental norm, with plain conditionalization as a limiting case where the new probabilities happen to be 0 and 1. Neither of us has ever convinced the other and I suspect a chunk of it is vocabulary. Act as a senior Bayesian epistemologist serving as the neutral chair of this collaboration — someone who could referee papers from both camps without anyone noticing a bias — and before you draft anything, think out loud for about ten lines: list every candidate point of contact between the two views, then rank them by whether settling it would actually move at least one of us. Skip the ones that are just restatements of the same disagreement.

  The case I want the document to turn on is one I made up for my quals and neither of us has a clean answer to, so please don't pretend one does. Call it Colour-Shift. An agent is staring at a card under a dim lamp and at the first observation the partition that seems to capture her evidence is the coarse one: {blue-ish, green-ish}. She shifts her credences over that partition away from her prior — say to 0.7/0.3 — and applies kinematics. Then the lamp brightens and she discovers that what looked like a single blue-ish shade is actually two discriminable shades, so the right partition now is {teal, blue-ish-but-not-teal, green-ish}. Question one: is the second update well-defined at all, given that her earlier rigidity commitment fixed conditional probabilities only relative to the coarse cells? Question two, the one I actually care about: does kinematics commute with refinement here — if she had instead waited for the bright lamp and updated once on the fine partition, would she have ended up where she is now, and if not, what extra assumption would be needed to make the two routes agree? My hunch is that the two routes come apart unless you smuggle in something like a constraint tying the fine conditional probabilities back to the coarse ones, and that if my hunch is right it cuts against me as much as against her, because then neither strict conditionalization nor kinematics is doing the real work. State the answer however the formalism actually comes out, and if you are not sure a result holds, mark it as contested rather than asserting it — I'd much rather have an honest open question in the document than a confident fabrication. Also, please no citations, no bibliography, no reading list, and don't name-drop papers I'd have to go check. If a theorem or a coherence argument matters (a dynamic Dutch book, a reflection-style constraint, whatever you think is load-bearing), give me its assumptions and its conclusion in prose so the two sides can argue about the content.

  For the deliverable, I want the actual joint statement, formatted so both of us could sign it without wincing: (1) a numbered list of agreed claims — including agreement about what the formalism itself says, about what needs explaining, and about which objections to either view are just bad and should be retired; (2) a disagreements table with columns for the crux, the claim as my side would word it, the claim as her side would word it, the test or argument both of us accept as bearing on it, and each side's prediction written down in advance; (3) a separate short section saying which of these disagreements you judge to be merely verbal, and if so, provide a little translation manual mapping one camp's vocabulary onto the other's so we can see when we're saying the same thing twice; (4) what each side would count as evidence or argument against their own view — be specific, not something like new arguments would make me reconsider; and (5) the residue: what the collaboration failed to resolve and why. Two things I care about most: the agreed claims shouldn't be vacuous truisms both camps get for free, and neither side's wording should be a strawman of the other — if you can only phrase a position so it sounds silly, say that you're doing that and why. Roughly 1200-1800 words is fine, and it's ok to be dry and precise rather than lively, since we're going to read it out loud at the workshop and get picked apart.
