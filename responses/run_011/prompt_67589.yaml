  **ADVERSARIAL COLLABORATION STATEMENT: KINEMATICS VS. CONDITIONALIZATION**

  **Chair's Introduction**
  This document summarizes the joint position of two researchers regarding the foundational norms of belief updating. The collaboration focused on the relationship between strict conditionalization and probability kinematics, specifically utilizing the "Colour-Shift" scenario to stress-test both formalisms. The following sections outline agreed formal results, structured disagreements, verbal mappings, and conditions for theory revision.

  **1. Agreed Claims**
  Both parties endorse the following claims. These are not merely definitions but substantive agreements on the behavior of the formalism and the requirements for a complete theory.

  1.  **The Limiting Case Agreement:** Both parties agree that probability kinematics yields identical results to strict conditionalization when the new probabilities assigned to the partition cells are exclusively 0 and 1. Neither side claims their preferred norm overrides the other in this specific limiting case; the divergence occurs only when uncertainty remains over the evidence partition.
  2.  **The Colour-Shift Non-Commutativity:** Regarding the Colour-Shift case (coarse update followed by partition refinement vs. direct fine update), both parties agree that standard probability kinematics does *not* guarantee commutativity. Updating on a coarse partition $\{B, G\}$ and subsequently refining $B$ into $\{T, B'\}$ yields different posterior probabilities than waiting and updating directly on $\{T, B', G\}$, unless an extra constraint is imposed linking the conditional probabilities of the coarse cells to the sub-cells.
  3.  **The Rigidity Requirement:** Both parties agree that some form of rigidity condition is necessary for learning from experience to constrain future beliefs. The disagreement lies not in whether rigidity is required, but in whether rigidity is a fundamental empirical constraint on the agent-world interface (Opponent) or a derived consequence of conditionalizing on a sufficiently detailed proposition (User).
  4.  **The Insufficiency of Standard Formalism:** Both parties agree that neither strict conditionalization nor standard kinematics, as commonly defined, provides a complete rule for handling partition refinement over time. A supplementary norm is required to dictate how conditional probabilities distribute when a cell known at time $t_1$ is split into sub-cells at time $t_2$.
  5.  **Retired Objections:** Both parties agree to retire the objection that kinematics violates the principle of reflection simply because it allows probability changes without certainty. Both acknowledge that reflection principles require careful formulation regarding what is known at what time, and this objection fails to distinguish between irrational shifting and rational learning from uncertain evidence.

  **2. Disagreements Table**

  | Crux | User's Claim (Conditionalization) | Opponent's Claim (Kinematics) | Accepted Test/Argument | Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **Fundamentality** | Kinematics is derivative. All learning is conditionalization on a proposition describing total experience, even if gerrymandered. | Kinematics is fundamental. Experience imposes constraints on probabilities directly; propositionalizing is a modeling choice, not a requirement. | **Colour-Shift Commutativity:** Does the formalism handle refinement naturally? | **User:** With the right proposition (including refinement data), commutativity holds. <br>**Opponent:** Commutativity fails because experience changes; kinematics tracks this without needing hidden propositions. |
  | **Nature of Rigidity** | Rigidity is a logical consequence of conditionalizing on a proposition that screens off the hypothesis from the experience. | Rigidity is an empirical constraint on how perceptual systems preserve information across belief updates. | **Dynamic Dutch Book:** Can a book be made against an agent who violates rigidity but conditionalizes? | **User:** Yes, because they failed to conditionalize on the true evidence proposition. <br>**Opponent:** Yes, because they violated the empirical constraint of perceptual stability. |
  | **Evidence Status** | Evidence is always propositional. If it looks non-propositional, the proposition is just complex (e.g., "it looks blue-ish"). | Evidence is often non-propositional. Forcing it into a proposition distorts the phenomenology of uncertain perception. | **Ineffability Test:** Can the agent specify the evidence proposition before the update? | **User:** Yes, in principle, via indexicals or appearance claims. <br>**Opponent:** No, the agent often cannot articulate the partition cell until after the update. |
  | **Refinement Norm** | Refinement requires learning a new proposition about the discrimination capacity itself. | Refinement requires a new kinematic update constrained by the relationship between old and new partitions. | **Colour-Shift Route A vs. B:** Which route is rational? | **User:** Route B (wait for fine) is ideal; Route A requires hidden assumptions. <br>**Opponent:** Both are rational depending on when the experience occurs; kinematics adapts to both. |

  **3. Verbal Disagreements and Translation Manual**
  A portion of the disagreement appears to be terminological rather than substantive. The following translation manual maps concepts between the two frameworks to identify where claims may be equivalent.

  *   **"Proposition" (User) $\leftrightarrow$ "Partition Cell Description" (Opponent):** When the User speaks of "conditionalizing on a proposition," the Opponent can interpret this as "fixing the probability of a partition cell." The User insists this cell must be truth-apt; the Opponent insists it need only be a distinct perceptual category. If the User allows "proposition" to include self-locating claims about current appearances ("It looks blue-ish to me now"), the Opponent's objection regarding truth conditions diminishes.
  *   **"Rigidity" (Opponent) $\leftrightarrow$ "Screening Off" (User):** When the Opponent claims rigidity is an empirical constraint, the User interprets this as the claim that the experience proposition screens off the hypothesis from further evidence. If the Opponent agrees that this screening-off relation holds whenever rigidity holds, the normative force is identical, even if the metaphysical explanation differs.
  *   **"Learning" (User) $\leftrightarrow$ "Constraint Setting" (Opponent):** The User describes the update as "learning that $E$." The Opponent describes it as "setting constraints on $P(E)$." In the Colour-Shift case, both agree the probabilities change. The User insists this change *is* learning a fact; the Opponent insists it is adjusting weights. If both agree the mathematical operation is the same, the dispute is over whether the input must be a fact.

  **Judgment:** The disagreement over the existence of "experience propositions" is largely verbal provided the User allows these propositions to be highly indexical and private. However, the disagreement over **Fundamentality** (Crux 1) is substantive, as it dictates how each side handles the Colour-Shift refinement gap. The User seeks a hidden proposition to restore commutativity; the Opponent accepts non-commutativity as a feature of changing empirical constraints.

  **4. Conditions for Theory Revision**
  To move beyond stalemate, each side specifies what evidence or argument would compel them to abandon or significantly modify their position.

  *   **User's Condition for Revision:** The User would abandon the claim that all learning is conditionalization if presented with a case of rational belief update where: (1) the agent changes credences based on experience; (2) no proposition can be constructed (even using indexicals or appearance claims) that captures the evidence without being trivial (probability 1 by definition); and (3) violating conditionalization on any such proposition does not invite a dynamic Dutch Book. Essentially, a proof that uncertain evidence cannot be propositionalized without losing normative force.
  *   **Opponent's Condition for Revision:** The Opponent would abandon the claim that kinematics is fundamental if presented with a coherence argument showing that: (1) kinematics permits a sequence of updates that leads to sure loss (Dutch Book) while a corresponding conditionalization strategy avoids it; and (2) this loss arises specifically from treating evidence as non-propositional constraints rather than from mis-specifying the partition. Essentially, a proof that rigidity without underlying propositional truth is inherently irrational.

  **5. Residue**
  This collaboration failed to resolve the metaphysical status of perceptual evidence. While both parties agree on the mathematical behavior of the Colour-Shift case (specifically, that commutativity fails without extra assumptions), they disagree on the interpretation of this failure.

  The User maintains that the failure indicates the agent in the Colour-Shift case failed to conditionalize on the *correct* proposition (which would have included the refinement data), implying the formalism is complete but the modeling was poor. The Opponent maintains that the failure indicates the formalism correctly captures the fragility of perceptual constraints, implying the demand for commutativity is misplaced when the empirical basis of the update shifts.

  Furthermore, the parties could not agree on whether the "extra assumption" required to restore commutativity in Colour-Shift is a logical requirement of rationality (User) or an empirical assumption about the stability of the perceptual environment (Opponent). This distinction remains the primary obstacle to a unified theory of uncertain updating. Both parties agree that future work must focus on formalizing the norms of partition refinement, as this is the load-bearing issue exposed by the Colour-Shift scenario.
