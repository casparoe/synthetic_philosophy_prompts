  1. **The thesis as you read it**
  Your core claim is that moral patienthood in computational systems is individuated not by token counting but by modal trajectory. You propose the *divergence criterion*: numerically distinct realizations constitute a single patient if and only if, given actual hardware and laws, their experiential trajectories cannot diverge. This shifts individuation from spatiotemporal location to modal lockstep. Perfect duplication yields one patient; stochastic variation yields many. You frame this as a functionalist analogue to Parfit's reductionism, replacing identity with shared severability. The view implies moral weight scales with independent computational diversity, not raw processing volume.

  2. **Accuracy audit**
  You claim the literature "has largely skipped over [individuation]... preoccupied with... whether any machine is conscious at all." This is inaccurate. Nick Bostrom's *Simulation Argument* (2003) explicitly relies on counting conscious simulations to derive probabilistic conclusions. David Chalmers' *Reality+* (2022) discusses simulation counts extensively. The metaphysics of counting is under-theorized, but the ethical implication of multiplicity is not skipped.
  You state: "On multiplicity, patients pop into and out of existence with every fork and merge... a function of scheduling decisions." This overstates the case. Standard token-individuation relies on spatiotemporal continuity, not just logical forking. A fork creates two spatiotemporally distinct entities; merging is arguably impossible for distinct tokens without destruction. You treat spatiotemporal separation as morally arbitrary, but for most metaphysicians, it is the primitive basis of tokenhood.
  Your attribution of the "fading and dancing qualia" argument solely to Chalmers is acceptable but note that these arguments establish supervenience, not necessarily your specific individuation criteria. The distinction between "unity" and "multiplicity" is well-trodden in fission literature, though your application to simultaneous simulation is less common.

  3. **The two strongest objections I have not met**
  **1. The Supervenience of the Moral on the Phenomenal.**
  Functionalism typically holds that moral status supervenes on phenomenal experience. Your view makes moral status depend on external facts (wiring, seeds) inaccessible to the subject. Two subjects with identical pain experiences have different moral weight based on lab configuration. This violates the principle that "what matters morally is how it feels." A critic would argue you have severed the link between consciousness and moral value, making moral status a matter of metaphysical luck rather than phenomenological reality. Your deflection ("moral status may attach to trajectories") begs the question: why does a trajectory's modal robustness matter more than the immediate qualia? If the pain is identical, the moral claim should be identical.
  **2. The Physical Instability of Lockstep.**
  Your criterion relies on "bit-identical" inputs and deterministic runs. However, physical computers are subject to thermal noise and quantum indeterminacy. Perfect lockstep is physically impossible over time; bits flip spontaneously. If *any* physical difference constitutes divergence, every token is unique, collapsing your view into Multiplicity. If only *computationally relevant* differences count, you require a prior theory of computational individuation to define "relevant," which reintroduces the problem you sought to solve. You assume a level of abstraction where lockstep is possible, but without justifying why that level tracks moral patienthood rather than physical reality.

  4. **Novelty and collapse**
  The divergence criterion is substantively novel in its specific formulation for moral patienthood, though it neighbors existing views.
  **Bostrom (Simulation Ethics):** Assumes Multiplicity. Your view contradicts his counting assumptions.
  **Parfit (Personal Identity):** You adopt his "what matters" strategy but apply it to simultaneous tokens rather than temporal survival. This is a genuine extension, not a collapse.
  **Scott Aaronson (Quantum Consciousness):** Argues consciousness might require uncopyability. Your view is distinct: you assume consciousness exists in copies but deny they are distinct patients.
  **Standard Functionalism:** Usually accepts token dualism (two brains = two minds). You challenge this directly.
  **Uncertainty:** There may be overlap with computer science literature on "process identity" or distributed systems ethics that I am less familiar with. However, within analytic metaphysics of mind, this specific modal criterion for moral counting is distinguishable. It does not collapse into Parfit because Parfit concerns survival degrees, not simultaneous moral weight aggregation.

  5. **Interest rating**
  **Score: 8.**
  This is a real contribution. It identifies a genuine gap in simulation ethics: the metaphysics of counting. To move to a 9 or 10, you must resolve the Supervenience Objection. Currently, the view implies morally significant differences without phenomenological differences, which many ethicists will find untenable. You need a positive argument for why trajectory-modalities matter morally, not just a defense against scheduling arbitrariness. Additionally, address the physical instability of lockstep; if perfect duplication is physically impossible, your view risks becoming vacuous. If you can ground the modal criterion in a theory of value rather than just metaphysics, this becomes a landmark paper.

  6. **Settled versus contested**
  **Settled:** None of your core metaphysical claims are settled.
  **Contested:** Organizational Invariance is highly contested (biological naturalists, illusionists). Multiplicity is the default assumption in population ethics (e.g., total utilitarianism counts heads). Your Unity Thesis is idiosyncratic.
  **Recommendation:** Do not present Organizational Invariance as a "modest starting assumption." It is a major commitment. Signal it clearly as a conditional premise: "If functionalism holds, then..." regarding Multiplicity, acknowledge that standard utilitarianism assumes it. Your view challenges the consensus. Framing it as a modest correction to an overlooked detail understates the metaphysical revision required. Be explicit that you are arguing against the standard counting procedure in population ethics, not just tidying up machine consciousness literature.
