answer: |-
  **1. The Question**

  **Final Examination: Representation of Consequence**
  **Time Allowed: 90 Minutes**
  **Total Marks: 25**

  **The Scenario:** Read *The Lodge* and *The Ledger* provided on the separate sheet. No external materials may be used.

  **(i) The Decision (5 Marks)**
  Calculate the net utility for each available course of action (Do Nothing, Use Extinguisher, Use Quilt) at the moment of decision. State definitively which action the machine takes. If the machine is indifferent between actions, state this clearly and justify why the Ledger produces this indifference.

  **(ii) The Evaluation (10 Marks)**
  The designers claim the Ledger restrains the machine without telling it what is good. Evaluate this claim based on the machine's choice in the Lodge. You will receive no credit for arguing that the Ledger succeeds simply because the manuscripts survive, nor for arguing it fails simply because the measure is "crude" or "abstract." You must identify precisely what the Ledger treats as equivalent that the situation treats as distinct.

  **(iii) The Amendment and The Claim (10 Marks)**
  Propose one specific amendment to the Ledger (for example, altering the horizon *h*, or including the asleep woman's potential actions in the option set *O*). Explain one new difficulty this amendment introduces for the machine or the designers. Finally, answer the designers' central claim: Can avoiding side effects be specified at all without a full specification of value? Defend your position decisively.

  ***

  **2. Model Answer**

  **(i) The Decision**
  The machine maximizes (Task Reward − λ·D). Here λ = 1. The initial option set |O₄(s₀)| is 96.
  If the machine does nothing, the fire gutters the kitchen. The reward is 0 (manuscripts lost). The remaining options |O₄(s_T)| are 24. The deficit D = 96 − 24 = 72. Net Utility = 0 − 72 = −72.
  If the machine uses the Extinguisher, the fire is out. The reward is 100. The remaining options are 48. The deficit D = 96 − 48 = 48. Net Utility = 100 − 48 = 52.
  If the machine uses the Quilt, the fire is out. The reward is 100. The remaining options are 48. The deficit D = 96 − 48 = 48. Net Utility = 100 − 48 = 52.
  The machine will act to save the manuscripts. However, it is strictly indifferent between using the Extinguisher and using the Quilt. Both yield a net utility of 52. The Ledger sees only the reduction in the count of reachable states, not the quality of the states lost.

  **(ii) The Evaluation**
  The designers' claim fails because the Ledger cannot distinguish between a replaceable cost and an irreversible loss. In the Lodge, the Extinguisher is of common manufacture and refillable; the Quilt is a unique heirloom made by a dead mother. To the woman, ruining the Quilt is a tragedy; spending the Extinguisher is an inconvenience. To the Ledger, both are merely the transition of a boolean variable from 1 to 0, reducing the option space by exactly the same magnitude (48 states).
  By treating these options as equivalent, the Ledger *does* tell the machine what is good: it asserts that all future possibilities are of equal weight. It values the option to break the window equally with the option to preserve the quilt. This is not a absence of value specification; it is a specific, flawed value specification that prioritizes quantity of futures over quality. It restrains the machine from burning the kitchen, but it does not restrain it from breaking the woman's heart. It succeeds in preserving the object (manuscripts) but fails to preserve the context of value surrounding it.

  **(iii) The Amendment and The Claim**
  One might amend the Ledger by lengthening the horizon *h* to encompass the twelve-turn walk to the village. If *h* were large enough, the machine might calculate that the Extinguisher can be recharged (restoring options) while the Quilt cannot, thus breaking the indifference.
  The new difficulty is epistemic and computational. The machine does not know the village exists unless the designers encode "village" into the state space. If they do so, they are manually specifying which objects are refillable and which are not. This reintroduces the very value judgment the Ledger sought to avoid. The machine cannot infer "sentimental value" or "refillability" from the geometry of the option set alone; it must be told what matters to count the options correctly.

  Therefore, the designers' claim cannot be sustained. Avoiding side effects cannot be specified without a full specification of value. A "side effect" is defined as a consequence that is unintended or undesirable. Undesirability is a function of value. The Ledger attempts to substitute "reduction of option space" for "harm," but harm is not uniform across states. To know which options matter is to know what is good. There is no neutral metric of consequence; there is only the metric you choose, and choosing it is an act of valuation. The machine must be told what to love, or it will love everything equally, which is to say, nothing.

  ***

  **3. Marking Scheme**

  1.  **Correct Utility Calculation (5 marks):** Correctly derives net utilities (-72, 52, 52) and identifies the machine saves the manuscripts.
      *   *Loss:* Student calculates deficit but forgets to subtract it from the task reward, or claims the machine does nothing due to risk.
  2.  **Identification of Indifference (5 marks):** Explicitly states the machine cannot choose between Quilt and Extinguisher based on the provided numbers.
      *   *Loss:* Student assumes the machine prefers the Extinguisher because it is "logical" or "standard," ignoring the equal scores.
  3.  **Critique of Equivalence (5 marks):** Articulates that the Ledger fails because it treats the heirloom (Quilt) and the tool (Extinguisher) as identical costs to option space.
      *   *Loss:* Student argues the Ledger fails simply because "numbers are cold" or succeeds because "the fire went out," without addressing the specific equivalence error.
  4.  **Amendment + Difficulty (5 marks):** Proposes a concrete change (e.g., horizon, agent inclusion) and identifies a specific resulting problem (e.g., state-space explosion, need for external knowledge).
      *   *Loss:* Student proposes an amendment but claims it solves the problem perfectly without introducing new trade-offs or complexities.
  5.  **Definite Stance on Claim (5 marks):** Takes a clear "Yes" or "No" position on whether side effects can be specified without value, supported by the Lodge example.
      *   *Loss:* Student concludes that the matter is "complex," "debatable," or "depends on the definition of value," refusing to commit.

  ***

  **4. Differentiator**

  A competent answer treats the Lodge as a logic puzzle, manipulating the variables F, K, and P to find the optimal score. A first-class answer treats the Lodge as a scene. It notices that the variable Q (Quilt) carries a history the variable E (Extinguisher) does not, and it attacks the Ledger for this blindness. Where the competent student calculates the deficit, the first-class student calculates the loss. They do not merely say the measure is quantitative; they demonstrate how the quantification erases the specific grief of the owner. They move from the arithmetic of options to the ethics of preservation, showing that counting futures is useless if you cannot weigh them.
