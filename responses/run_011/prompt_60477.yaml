prompt: |-
  I just took over the performance unit at a state workforce agency. We pay job-training providers partly on a 90-day placement rate, and every quarter a handful of them jump ten points and nobody knows whether to clap or open an investigation. Our last audit turned up a provider that had quietly stopped enrolling anyone with a record or a long gap in thier work history — the metric looked fantastic and the program stopped serving the people it exists for.

  Write me a triage procedure my analyst can run on the quarterly numbers before we decide whether to send auditors out. Assume we have intake dates, barrier and demographic flags, placement dates, wage at placement, and 6- and 12-month follow-ups — no site visits, no experiment, no clean comparison group. I want the tests in order, what each one needs and what a fail looks like, and the points where the procedure has to stop at "can't tell from this data" instead of guessing. Ground it in whatever is actually known about how a proxy comes apart from the thing you care about; I know there's a difference between gaming somebody chose to do and drift that just falls out of the structure of the measure, and I want those handled differently because the fixes are different. Flag every step that's really a judgment call wearing a lab coat.

  Then run it on three: a provider whose placement rate rose sharply the same quarter they cut intake by a third; a provider whose wage numbers improved while 12-month retention got worse; and an honestly excellent provider who just hired two great job coaches — the case where I expect your procedure to flag someone who did nothing wrong. Finish with what this thing can't do and what I'd have to buy to make it able to.
reasoning: |-
  Here's a thinking process that leads to the suggested triage procedure:

  1.  **Analyze the Request:**
      *   **User:** New head of a performance unit at a state workforce agency.
      *   **Problem:** Providers gaming the system (cream-skimming) vs. genuine improvement vs. statistical noise. Current metric: 90-day placement rate.
      *   **Constraint:** No site visits, no experiments, no clean comparison group. Data available: Intake dates, barrier/demographic flags, placement dates, wage at placement, 6- and 12-month follow-ups.
      *   **Goal:** A triage procedure for analysts to run on quarterly numbers *before* deciding on audits.
      *   **Requirements:**
          *   Tests in order.
          *   Inputs needed for each test.
          *   Definition of a "fail."
          *   Explicit "can't tell from this data" stop points.
          *   Distinction between intentional gaming (malice) and structural drift (incentive misalignment).
          *   Flag judgment calls ("judgment call wearing a lab coat").
          *   Run the procedure on three specific cases (Intake cut/Wage spike, Wage up/Retention down, Genuine improvement).
          *   Conclusion on limitations and needed investments.
      *   **Tone:** Professional, analytical, pragmatic, grounded in evaluation theory (Goodhart's Law, Campbell's Law).

  2.  **Deconstruct the Problem (The Theory):**
      *   *Goodhart's Law:* When a measure becomes a target, it ceases to be a good measure.
      *   *Cream-skimming:* Selecting easiest-to-serve participants to boost metrics.
      *   *Park-and-Place:* Placing people in unstable jobs just to hit the 90-day mark.
      *   *Structural Drift:* Economic changes or policy shifts that affect metrics without provider malice.
      *   *Data Limitations:* Administrative data tells us *what* happened, rarely *why*. It lacks counterfactuals (what would have happened without the program?).

  3.  **Drafting the Triage Procedure (The "How-To"):**
      *   *Step 1: Volume & Composition Check.* Did they shrink the pool? Did the risk profile change? (Detects cream-skimming).
      *   *Step 2: Placement Velocity & Quality.* Are they placing people too fast (churning) or at suspiciously high wages? (Detects park-and-place or data entry errors).
      *   *Step 3: Retention Decay.* Does the 90-day success vanish by 6 or 12 months? (Detects unstable placements).
      *   *Step 4: Contextual Benchmarking.* How do they compare to peers with similar caseloads? (Detects outliers).
      *   *Stop Rules:* Where does the data run out? (e.g., motivation, employer verification).

  4.  **Refining the Steps (Adding Specifics):**
      *   *Input:* Intake counts, barrier indices, placement rates, wage distributions, retention rates.
      *   *Fail Conditions:* Statistical thresholds (e.g., >2 SD from mean, >20% drop in intake).
      *   *Judgment Calls:* Defining "significant" changes, setting peer groups.

  5.  **Running the Procedure on the Three Cases:**
      *   *Case 1 (Intake cut/Placement spike):* Likely cream-skimming. Step 1 should flag this.
      *   *Case 2 (Wage up/Retention down):* Likely "park-and-place" in high-turnover sectors or wage inflation gaming. Step 3 should flag this.
      *   *Case 3 (Genuine improvement):* Metrics improve across the board (placement, retention, wages) without intake manipulation. Should pass triage but might still look suspicious initially. Need to ensure the procedure doesn't false-positive here.

  6.  **Addressing the "Judgment Call wearing a Lab Coat" Requirement:**
      *   I need to explicitly label where human discretion overrides algorithmic thresholds. For example, defining the peer group is subjective.

  7.  **Addressing "Gaming vs. Drift":**
      *   Gaming = intentional manipulation (cream-skimming).
      *   Drift = structural issues (e.g., metric rewards short-term over long-term).
      *   The procedure needs to distinguish these because the fix for gaming is punishment/audit, while the fix for drift is metric redesign.

  8.  **Finalizing Limitations & Needs:**
      *   What can't admin data do? Verify job quality, employer intent, participant experience.
      *   What to buy? Employer surveys, participant surveys, UI wage record matching (if not already have), site visit capacity.

  9.  **Review and Refine (Self-Correction during drafting):**
      *   *Critique:* Is the tone too academic?
      *   *Fix:* Make it actionable for an analyst. Use "If/Then" logic.
      *   *Critique:* Did I distinguish gaming from drift clearly?
      *   *Fix:* Add a specific classification step at the end of the triage.
      *   *Critique:* Did I handle the "can't tell" moments?
      *   *Fix:* Explicitly state "Data Blind Spot" at relevant steps.

  10. **Final Polish:** Check against all constraints in the prompt. (Order, inputs, fails, stop points, judgment flags, three cases, limitations).

  *(Self-Correction on Case 3)*: The prompt asks for a case where the procedure flags someone who did nothing wrong. This is a False Positive. I need to make sure the triage procedure acknowledges the risk of False Positives and how to handle them (i.e., triage isn't conviction, it's "look closer"). Actually, re-reading: "the case where I expect your procedure to flag someone who did nothing wrong." Okay, I need to show how a good provider *looks* suspicious under this lens and why the procedure might pause on them, requiring the "can't tell" exit.

  *(Refining the "Judgment Call" flag)*: I will use a specific icon or bold text to denote these moments.

  *(Refining the "Gaming vs. Drift")*: I need to make sure the output classifies the *type* of anomaly.

  Let's build the response.

  *Structure:*
  1.  **Philosophy:** Briefly state the grounding (Campbell's Law).
  2.  **The Triage Protocol:** Step-by-step.
  3.  **Application:** Running the three cases.
  4.  **Limitations & Investments:** What's missing.

  *Drafting the Protocol:*
  *   Step 1: Intake Integrity (Cream-skimming check).
  *   Step 2: Placement Velocity (Churning check).
  *   Step 3: Outcome Durability (Park-and-place check).
  *   Step 4: Peer Normalization (Context check).
  *   Classification: Gaming vs. Drift vs. Noise.

  *Drafting the Cases:*
  *   Case 1: Fails Step 1. High probability of Gaming.
  *   Case 2: Fails Step 3. High probability of Drift/Metric Flaw (or Gaming).
  *   Case 3: Passes Steps 1-3, maybe flags on Step 4 (Outlier). This is the False Positive risk.

  *Drafting Limitations:*
  *   Admin data = Administrative truth, not Economic truth.
  *   Need UI wage data, employer contact, participant surveys.

  Okay, ready to write.
answer: |-
  This procedure is built on **Campbell's Law**: *The more any quantitative social indicator is used for social decision-making, the more subject it will be to corruption pressures and the more apt it will be to distort and corrupt the social processes it is intended to monitor.*

  Your goal is not to prove fraud (you can't do that with admin data). Your goal is to separate **Signal** (real performance change) from **Noise** (statistical variance) and **Distortion** (gaming/structural drift).

  ### The Triage Protocol: Quarterly Provider Performance Review

  **Analyst Instruction:** Run these steps sequentially. If a provider "Fails" a step, they enter the "Review Queue." If they pass all, they clear. If the data is insufficient to conclude, mark "Data Blind Spot" and clear unless cumulative risk is high.

  #### Step 1: Intake Integrity & Composition Shift
  *Detects: Cream-skimming (rejecting hard-to-serve clients to boost rates).*

  *   **Inputs:** Total intakes (current quarter vs. 4-quarter rolling average); Risk/Barrier index average (current quarter vs. 4-quarter rolling average).
  *   **Test:**
      1.  Calculate % change in intake volume.
      2.  Calculate % change in average barrier score (higher score = more barriers).
  *   **Fail Condition:** Intake volume drops >20% **OR** Average barrier score improves (lowers) by >15% concurrently with a placement rate spike.
  *   **Data Blind Spot:** You cannot see *who* was turned away at the door. You only see who wasn't enrolled.
  *   **🧑‍⚖️ Judgment Call:** Defining the "Barrier Score." If your flags are binary (e.g., "has record: Y/N"), a provider can game this by not checking the box. This test assumes the data entry is honest.

  #### Step 2: Placement Velocity & Wage Distribution
  *Detects: Churning (placing anyone quickly) or Wage Gaming (inflating wages to meet thresholds).*

  *   **Inputs:** Days from intake to placement; Wage at placement (hourly/annual).
  *   **Test:**
      1.  Compare median "Time to Placement" against the regional peer average.
      2.  Plot wage distribution. Look for clustering exactly at the minimum wage threshold required for "qualified placement."
  *   **Fail Condition:** Time to placement is <50% of peer average **OR** >40% of placements cluster within $0.50 of the minimum eligibility wage.
  *   **Data Blind Spot:** You cannot verify if the job is real, full-time, or if the wage is sustained past the first paycheck.
  *   **🧑‍⚖️ Judgment Call:** Determining "Peer Average." If you compare a rural provider to an urban one, this test fails. You must group by labor market area.

  #### Step 3: Outcome Durability (The Decay Rate)
  *Detects: Park-and-Place (unstable jobs that don't last).*

  *   **Inputs:** 90-day placement status; 6-month retention status; 12-month retention status.
  *   **Test:** Calculate the "Decay Ratio": (12-month retained / 90-day placed). Compare to the agency-wide baseline.
  *   **Fail Condition:** 90-day placement rate is >1 SD above mean, **BUT** 12-month retention is >1 SD below mean.
  *   **Data Blind Spot:** You don't know *why* they left. Was it firing? Quitting? Layoff? Seasonal work ending?
  *   **🧑‍⚖️ Judgment Call:** Interpreting the Decay. High decay in construction might be normal (project-based); high decay in healthcare is suspicious.

  #### Step 4: The "Can't Tell" Exit
  *Detects: Structural Drift vs. Intentional Gaming.*

  *   **Inputs:** Results from Steps 1-3.
  *   **Test:** Classify the anomaly.
      *   **Type A (Gaming):** Fails Step 1 (Intake) + Step 2 (Velocity). *Fix: Audit/Compliance.*
      *   **Type B (Drift):** Fails Step 3 (Durability) only. *Fix: Metric Redesign (e.g., weight 12-month higher).*
      *   **Type C (Noise):** Fails Step 4 (Peer) only, but passes 1-3. *Fix: Monitor.*
  *   **Stop Rule:** If the provider fails Step 3 but passes Step 1, **STOP.** Do not audit for fraud. This is a metric design flaw, not provider malice. Auditing this punishes providers for finding jobs that don't last in a bad economy.

  ---

  ### Running the Procedure on Your Three Cases

  #### Case 1: The "Intake Cutter"
  *Scenario: Placement rate rose sharply; intake cut by 33%.*

  *   **Step 1 (Intake):** **FAIL.** Volume drop >20%.
  *   **Step 2 (Velocity):** Likely Pass (unless they rushed the remaining few).
  *   **Step 3 (Durability):** Unknown yet.
  *   **Classification:** **Type A (Gaming).**
  *   **Action:** **Send Auditors.** The correlation between shrinking the pool and boosting the rate is the classic signature of cream-skimming. They are optimizing the denominator to protect the numerator.
  *   **Why:** This is intentional. They changed the *population* to change the *score*.

  #### Case 2: The "Wage Inflator"
  *Scenario: Wage numbers improved; 12-month retention got worse.*

  *   **Step 1 (Intake):** Pass (assuming volume is stable).
  *   **Step 2 (Velocity):** Check for wage clustering. If wages are high but retention is low, they might be placing people in high-turnover sales/commission roles to hit wage targets.
  *   **Step 3 (Durability):** **FAIL.** High 90-day/Wage + Low 12-month = Decay.
  *   **Classification:** **Type B (Drift/Metric Flaw).**
  *   **Action:** **Do Not Audit.** Do not punish the provider. Your metric incentivizes short-term cash over long-term stability.
  *   **Why:** This is structural. The provider is doing exactly what you paid them to do (get high wages), but the metric ignores sustainability. Auditing them teaches them to lie about wages next time. Fix the contract weights, not the provider.

  #### Case 3: The "Honest Excellence" (The False Positive Risk)
  *Scenario: Hired two great job coaches; everything improved.*

  *   **Step 1 (Intake):** Pass (Volume stable, barrier score stable).
  *   **Step 2 (Velocity):** Pass (Placement time normal, wages distributed normally).
  *   **Step 3 (Durability):** Pass (Retention tracks with placement).
  *   **Step 4 (Peer):** **FLAG.** They are now an outlier (>2 SD above mean).
  *   **Classification:** **Type C (Noise/Outlier).**
  *   **Action:** **Monitor, Don't Audit.** The procedure flags them because they are statistically improbable, but they passed the integrity checks (Steps 1-3).
  *   **The "Lab Coat" Moment:** Here is where your analyst must exercise discretion. If you audit every outlier, you punish innovation. If the intake mix hasn't changed (Step 1), assume competence before assuming fraud.
  *   **Why:** Real performance *does* vary. If you treat all positive outliers as suspicious, you create a perverse incentive for high performers to sandbag (under-perform) to avoid scrutiny.

  ---

  ### What This Thing Can't Do (And What You Need to Buy)

  This triage procedure is a **smoke detector**. It tells you where the heat is, but it cannot tell you if it's a cooking fire or a house fire. Administrative data has three fundamental blind spots that no amount of Excel modeling will fix:

  1.  **The "Who" Blind Spot (Unenrolled Population)**
      *   **Limitation:** You know who they *served*. You do not know who they *rejected*. Step 1 infers rejection via volume drops, but a provider can keep volume steady and just swap a "hard" case for an "easy" case off the street without you knowing.
      *   **The Buy:** **Mystery Shopping / Audit Intakes.** You need to pay a third party to send testers with different barrier profiles to providers to see if they get enrolled equally.

  2.  **The "Why" Blind Spot (Separation Reason)**
      *   **Limitation:** In Case 2, you saw retention drop. You don't know if participants were laid off (economic), fired (performance), or quit (job quality). This distinction determines if the provider is at fault.
      *   **The Buy:** **Participant & Employer Surveys.** Link a small sample of UI wage records to short surveys. Ask: "Are you still employed?" "Why did you leave?" "Would you recommend this provider?"

  3.  **The "Counterfactual" Blind Spot (Deadweight)**
      *   **Limitation:** You don't know if the participant would have gotten that job *without* the provider. A provider can look excellent by serving people who didn't need help.
      *   **The Buy:** **Propensity Score Matching Unit.** You need an economist or data scientist to build a comparison group from general unemployment insurance data (people who applied for benefits but not training). This allows you to measure *lift* rather than just *outcomes*.

  ### Summary Recommendation
  Implement the triage protocol immediately to stop the bleeding on Case 1 types. However, formally categorize Case 2 types as "Metric Risks" and put them on a roadmap for contract renegotiation (e.g., shift from 90-day placement to 12-month retention weighting). For Case 3, protect them. If you audit the honest winner, you will teach the rest of the market that excellence is suspicious, and they will all regress to the mean to stay safe.
