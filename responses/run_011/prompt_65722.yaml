answer: |-
  # Mechanism Identity Decision Tree

  **Starting Commitment:** We possess full access to record activations and perform causal interventions (patching, ablation, SAE feature visualization) on both the clean baseline and the suspect anomalous run.

  **Instruction:** Answer each node based on your engineering intuition regarding the specific case described. Do not attempt to guess the philosophical category; answer based on whether you would classify the suspect run as a *true positive* (distinct mechanism) or *false positive* (same mechanism) in that specific scenario.

  ---

  ### Node 1: The Disjoint Neuron Case
  **Case:** The suspect run produces the exact same intermediate activation values and output logits as the baseline, but attribution methods show the computation is realized in a completely disjoint set of neurons (multi-realization).
  **Question:** *Do we clear the anomaly flag and treat this as the nominal mechanism operating normally?*
  *   **YES:** Go to **Node 2**.
  *   **NO:** Go to **Node 3**.

  ### Node 2: The Backup Pathway Case
  **Case:** You ablate the baseline circuit. The model's performance does not degrade because a previously silent, unrelated pathway activates to compensate and restore the input-output function.
  **Question:** *Do we consider the backup pathway to be the "same mechanism" as the original for the purpose of anomaly detection?*
  *   **YES:** Go to **Node 4**.
  *   **NO:** Go to **Node 5**.

  ### Node 3: The Weight Drift Case
  **Case:** A fine-tuned successor model reproduces the baseline circuit's activation patterns perfectly, but the underlying weights have drifted significantly (low cosine similarity) due to SGD noise or retraining.
  **Question:** *Do we treat this as a distinct mechanism requiring a new baseline profile, despite the activation match?*
  *   **YES:** Go to **Node 6**.
  *   **NO:** Go to **Node 7**.

  ### Node 4: The SAE Granularity Case
  **Case:** A Sparse Autoencoder trained on the suspect run decomposes a single baseline feature into three distinct, co-active features that sum to the original signal.
  **Question:** *Is the original baseline feature invalid as a mechanistic unit, requiring us to flag the decomposition as an anomaly?*
  *   **YES:** → **Leaf: Algorithmic Account**
  *   **NO:** → **Leaf: Causal-Role Account**

  ### Node 5: The Topological Relocation Case
  **Case:** The same logical computation (verified by causal patching) appears in a different layer with different wiring topology, preserving the causal influence on the output.
  **Question:** *Does the change in layer index and connectivity graph constitute a mechanism change, even if the causal role is preserved?*
  *   **YES:** → **Leaf: Organizational Account** *(Added Leaf)*
  *   **NO:** → **Leaf: Causal-Role Account**

  ### Node 6: The Etiological History Case
  **Case:** Two circuits are functionally and structurally identical in the current forward pass, but one arose from clean pretraining and the other from a specific adversarial fine-tuning epoch.
  **Question:** *Does the history of how the weights were updated determine mechanism identity, independent of current structure?*
  *   **YES:** → **Leaf: Etiological Account**
  *   **NO:** → **Leaf: Substrate Account**

  ### Node 7: The Pragmatic Utility Case
  **Question:** *Is the question of "sameness" primarily determined by which definition minimizes our false positive rate for the specific downstream safety task?*
  *   **YES:** → **Leaf: Deflationary Account**
  *   **NO:** → **Leaf: Substrate Account**

  ---

  ## Leaf Definitions

  1.  **Causal-Role Account:** Mechanism identity is defined by the counterfactual dependence relations the circuit sustains. If the input-output mapping and causal influence on the output are preserved (Nodes 1 & 2 = YES), it is the same mechanism, regardless of neurons or topology.
  2.  **Substrate Account:** Mechanism identity is tied to the specific physical parameters (weights) or neuron indices. If the weights drift or neurons differ (Nodes 1 & 3 = NO/YES), it is a different mechanism.
  3.  **Algorithmic Account:** Mechanism identity is defined by the abstract computational steps and feature granularity. If the feature decomposition changes (Node 4 = YES), the algorithm has changed, even if the I/O is constant.
  4.  **Etiological Account:** Mechanism identity depends on the causal history of the circuit's formation (e.g., gradient descent path vs. manual edit). Two identical circuits are different mechanisms if their origins differ (Node 6 = YES).
  5.  **Deflationary Account:** There is no fact of the matter. "Mechanism" is a pragmatic label chosen to optimize detector performance, not a natural kind (Node 7 = YES).
  6.  **Organizational Account:** *(Added)* Mechanism identity is defined by the connectivity graph and topological location within the network. Function can be preserved, but if the wiring diagram or layer index shifts (Node 5 = YES), the mechanism is distinct.

  ---

  ## Analysis of Unoccupied Combinations & Indistinguishability

  ### 1. Unoccupied Answer Combinations
  These are paths through the tree that represent logically inconsistent or philosophically untenable positions. No coherent position occupies these combinations of answers.

  *   **Node 1 (YES) + Node 3 (YES):** *Incoherent.*
      *   **Reasoning:** Answering **YES** at Node 1 asserts that physical substrate (neuron indices) does *not* determine identity (Functionalism). Answering **YES** at Node 3 asserts that physical substrate (weight values) *does* determine identity (Physicalism). One cannot consistently hold that neuron disjointness is irrelevant while weight drift is relevant, as both are properties of the physical implementation.
  *   **Node 2 (YES) + Node 5 (YES):** *Unattractive.*
      *   **Reasoning:** Answering **YES** at Node 2 implies that *any* pathway restoring function counts as the mechanism (Radical Functionalism). Answering **YES** at Node 5 implies that topological location *does* matter. If location matters (Node 5), a backup pathway in a different location should not count as the same mechanism (Node 2). This combination creates a tension between "location matters" and "location doesn't matter if function is saved."
  *   **Node 6 (YES) + Node 7 (YES):** *Incoherent.*
      *   **Reasoning:** Answering **YES** at Node 6 commits to a realist view where history is an objective fact determining identity. Answering **YES** at Node 7 commits to anti-realism (Deflationism), where identity is a choice based on utility. One cannot claim identity is an objective historical fact *and* merely a pragmatic choice simultaneously.

  ### 2. Empirically Indistinguishable Leaves
  Given our starting commitment (activations + causal interventions like patching/ablation), certain leaves cannot be separated in practice.

  *   **Causal-Role Account vs. Robustness Counterfactuals:**
      *   **Flag:** **Indistinguishable.**
      *   **Reason:** Our tools are limited to observing activations and intervening to break causal links. A Causal-Role account defines mechanism by counterfactual dependence. A Robustness account defines it by stability under perturbation. In a static deployed model, testing causal role *requires* perturbation (ablation/patching). We cannot distinguish between "this is the causal role" and "this is the robust feature" because the intervention protocol is identical for both.
  *   **Algorithmic Account vs. Organizational Account:**
      *   **Flag:** **Indistinguishable (in single-architecture context).**
      *   **Reason:** In a fixed transformer architecture, the "algorithm" is instantiated entirely by the connectivity graph and weights. If we detect a change in the algorithmic structure (e.g., via SAE splitting), it necessarily manifests as a change in the organizational topology (which features connect to which heads). Without comparing across different architectures (e.g., Transformer vs. Mamba), we cannot separate the abstract algorithm from the specific wiring organization.
  *   **Substrate Account vs. Etiological Account:**
      *   **Flag:** **Practically Indistinguishable.**
      *   **Reason:** To detect an Etiological difference (history), we must inspect the weight values (to see if they came from different basins of attraction) or the training logs. However, if the weights are identical, the history is usually assumed identical. If the weights differ (Substrate), we often infer the history differed. Since we cannot intervene on *history*, only on current weights, any test for Etiology collapses into a test for Weight Divergence (Substrate).

  ### 3. Unexplored Combinations
  *   **Node 4 (NO) + Node 5 (YES):** *Unexplored.*
      *   **Reasoning:** This path suggests that feature granularity (SAE split) does *not* change the mechanism, but layer relocation *does*. This implies a view where "what" is computed (features) is flexible, but "where" it is computed (topology) is rigid. This hybrid view is rarely articulated in mechanistic interpretability, which tends to prioritize either function (Causal) or structure (Algorithmic/Substrate) consistently across both dimensions.
