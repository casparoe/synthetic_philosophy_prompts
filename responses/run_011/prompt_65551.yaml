      *   Okay, I will argue that the revision requires P2 to acknowledge that *some* bypassing is inherent.
      *   Cost: You lose the claim that you are distinct from the propagandist *in method* (P3). You are only distinct in *intent*.
      *   Practice: You can no longer hide behind "Consent" (P3) to excuse the bypass. You must own the manipulation.
      *   *Actually, the most tangible cost:* If you admit P2 is too strict, you must judge your work by its *outcome* (did it help them?) not its *process* (did I lie?).
      *   This means you can't know if you succeeded until the reader writes to you (as in P5).
      *   *Okay, I'll focus on the P2/P5 clash.*

      *   *Wait, I missed a nuance in P6.* "The voice that speaks for the book."
      *   In P5, "inside the perceptions of a man."
      *   If the voice *is* the man's perception (Free Indirect Discourse), and the man is cruel...
      *   Does the voice lie if it presents cruelty as normal?
      *   P6 says "assert anything I take to be false."
      *   If the author takes it as true that the man *thinks* it's normal, then reporting that thought is true.
      *   So P6 is safe.
      *   Okay, sticking with P2/P5.

