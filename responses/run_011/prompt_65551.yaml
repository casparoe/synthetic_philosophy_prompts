      *   *Final Decision on Worst Conflict:* **P2 vs. P5.**
      *   Why? Because P2 defines the *Ethics*. P5 is the *Proof*. If the Proof violates the Ethics, the Theory is dead.
      *   **Revision:** Reframe P5. The service was not the sympathy, but the *confrontation* with the sympathy.
      *   **Cost:** You can no longer claim the *sympathy* was the goal. The goal was the *disturbance*.
      *   **Practice:** You cannot write to make the reader *feel* right about the wrong thing. You must write to make the reader *feel* the conflict.
      *   *Wait, P5 says:* "reader finds that they are... on his side."
