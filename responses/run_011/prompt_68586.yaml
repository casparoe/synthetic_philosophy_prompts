  ### Predictions for the New Case

  **The Gradual Synthetic Person:** **Survives.**
  Nadia will almost certainly identify this candidate as the original person. Her verdict in Case 4 (gradual replacement) was unequivocal ("obviously you survive"), and her verdicts in branching cases (2 and 7) establish that when a rival exists, the "original stream" retains identity while the copy does not. Since the gradual synthetic person is the continuous causal stream from the original body, they win the asymmetry.

  **The Biological Replica:** **What-matters-only.**
  She will deny this candidate strict identity. Case 7 is directly on point: a replica created while the original lives is a "new person". However, given Case 2, where she conceded that "what matters is still there" regarding the Martian replica, she will likely concede that the replica possesses psychological continuity and thus "what matters", even if it isn't *her*. She will not say "doesn't survive" without the consolation prize, given her Parfitian leanings in Cases 1 and 3.

  ### Candidate Rules Consistent with the Data

  Here are three principles that fit her seven prior verdicts, each implying slightly different things for future cases.

  **1. The Asymmetric Continuous Stream View**
  *   **Principle:** Identity requires psychological continuity carried by a physically continuous process. Branching destroys identity *unless* the branching is asymmetric; in asymmetric cases, identity stays with the candidate that maintains the continuous physical process from the original. Instant substrate replacement breaks the process (Case 5), but gradual replacement preserves it (Case 4).
  *   **Implication for New Case:** The Gradual Synthetic person maintains the continuous process. The Replica is a discontinuous copy. **Gradual = Survives; Replica = What-matters-only.**

  **2. The Non-Branching Psychological Continuity View (with Destruction License)**
  *   **Principle:** Identity = Psychological Continuity + Uniqueness. However, uniqueness is only required if the original organism persists. If the original is destroyed (Case 1), PC transfer is sufficient. If the original persists, instant swaps are fatal (Case 5) but gradual changes are permissible (Case 4). In branching, the "original" (defined by causal history) wins.
  *   **Implication for New Case:** The Gradual Synthetic person is the causal original. The Replica is a branch. Since it is asymmetric, the Original wins. **Gradual = Survives; Replica = What-matters-only.**
  *   *Note:* This rule is very similar to Rule 1 but places less metaphysical weight on the "physical process" and more on the "uniqueness/causal history" condition.

  **3. The Substrate Integrity View**
  *   **Principle:** Identity is tied to the specific biological organism *unless* it is destroyed. Gradual replacement counts as the organism persisting (Case 4). Instant replacement counts as organism death (Case 5). A grown replica is a new organism (Case 7).
  *   **Implication for New Case:** The Gradual Synthetic person is the original organism (modified). The Replica is a new organism. **Gradual = Survives; Replica = Doesn't survive (possibly no concession on 'what matters').**
