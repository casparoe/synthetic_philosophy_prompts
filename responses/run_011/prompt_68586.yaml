  **My single best guess is Rule 1: The Asymmetric Continuous Stream View.**

  **Defence:**
  The discriminating work is being done by **Case 4 vs. Case 5** and **Case 2 vs. Case 3**.
  *   **Case 4 vs. 5:** This is the strongest signal. Many psychological continuity theorists would say the instant swap (Case 5) is survival if functional identity is preserved. Nadia's rejection of it signals she cares about the *mode* of continuity, not just the outcome. She requires an *ongoing process*, not just a matching state.
