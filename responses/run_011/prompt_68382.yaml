answer: |-
  The intake room smelled of wet wool and ozone, the perpetual scent of the city since the waters receded. Elara sat behind the plexiglass partition, her stylus hovering over the tablet. Across from her sat a man from the Docks, his hands wrapped in stained gauze. He was here for the Reconstruction Budget Office, to have his preferences elicited. This was the law. Before a single pile of concrete could be poured, the Office had to know how the citizens valued the future.

  "Option A," Elara read, her voice flat. "A guaranteed reinforcement of your current seawall. Option B: A ninety percent chance of a new levee system for the entire harbor, and a ten percent chance of no construction funds allocated this fiscal year."

  The man shifted. "If I pick B and the ten percent hits, my shop floods again."

  "That is the risk parameter," Elara said. She didn't look up. She marked the response. The tablet calculated the curvature of his utility function, deriving the coefficient of risk aversion. This was the engine of the Charter. After the Councils collapsed into violence over who deserved the dry ground, the Director had imposed the Charter. It was mathematical. It was symmetric. Every person counted for one, and no one could argue with the sum.

  When the man left, Elara pulled the daily calibration memo from her tray. It was a thin slip of paper, unnumbered, unsigned. *Adjustment to Reference Life Baseline.* The zero-point for the utility scale was being shifted. Previously, 'Zero Utility' was defined as the state of immediate post-flood habitation. Now, it was defined as the state of pre-flood tenancy in the Upper Districts.

  Elara frowned. She had seen these memos before. The Charter stated that social utility was the sum of individual utilities. It demanded symmetry; every weight must be equal. But the theorem—the cold logic the Director quoted in his broadcasts—didn't explain how you added meters to kilograms. You couldn't sum utilities unless they shared a scale. You had to fix the zero and the unit for everyone.

  The Charter was silent on how. The clerks decided.

  She walked to the break room, where Kael was smoking a synthetic cigarette by the vent. Kael was an organizer from the Silt, the lowest district, but he had a cousin in Data Entry. He knew how the machine chewed.

  "Did you get the memo?" Elara asked.

  Kael exhaled a plume of gray vapor. "The Reference Life change? Yeah. They're moving the anchor."

  "If the zero-point moves, the sums change," Elara said. "If my zero is 'homeless' and your zero is 'rented apartment,' and we both gain a house, my utility jump is massive. Yours is small. But if they set our zeros to the same place..."

  "They set the zero to where the rich guys started," Kael said. "And they set the unit—the size of one 'util'—to the stake of a standard bond. If I'm poor, a bond is everything. If the Director is rich, a bond is pocket change. But the Office defines the unit by the bond, not by what it buys you."

  "It's not in the Charter," Elara said. "The Charter says equal weights. It doesn't say equal anchors."

  "The Charter says the sum must be maximized," Kael corrected. "It doesn't say how you build the numbers you're summing. That's administration. That's you." He flicked ash onto the wet floor. "We're running a campaign. Not about the weights. Everyone knows the weights are equal. We're running it on the anchors. You can't have a fair sum if the rulers hold the zero."

  Elara went back to her station. She felt the stylus in her hand, heavy as a brick. She was the one turning lives into numbers. She was the one choosing where the scale began.

  ***

  The interview with Mrs. Hesten was scheduled for forty minutes. It took three hours.

  Mrs. Hesten lived in the Red Zone, the strip of land between the old seawall and the open bay. The Office had designated it for managed retreat. No funds would be spent on permanent structures there. Mrs. Hesten was being offered relocation vouchers in exchange for surrendering her claim to the land.

  "Option A," Elara said, reading the script. "Relocation voucher, value fifty thousand credits. Option B: Fifty percent chance of keeping your land with no support, fifty percent chance of forced eviction with no voucher."

  "No," Mrs. Hesten said.

  "Mrs. Hesten, you have to choose. Or indicate indifference."

  "I am not indifferent," the woman said. Her hands were clasped tight on the table. The knuckles were white. "And I will not choose the gamble. I will not accept a probability of losing my home. Not one percent. Not zero point zero zero one."

  Elara tapped the screen. The system required a continuous utility function. The Expected Utility axioms required continuity. There had to be some probability $p$ where the woman would be indifferent between the sure thing and the gamble. That was the math. That was how you derived the value.

  "There is no number," Mrs. Hesten said, her voice trembling. "There is no amount of credits that makes the chance of losing my home acceptable. It is not a trade. It is a line."

  Elara looked at the error message on the tablet. *Non-Archimedean Preference Detected. Function Undefined.*

  If she submitted this, Mrs. Hesten would be excluded from the aggregation. The theorem required preferences over the common menu of prospects. If a citizen's preferences couldn't be represented by a real-valued function, they were, effectively, not a citizen in the eyes of the optimization algorithm. Their weight would be zero, not because of bias, but because of syntax.

  "I can adjust the probabilities," Elara offered quietly. "Make the risk smaller."

  "It doesn't matter," Mrs. Hesten said. "I know what you are doing. You are asking me to put a price on my history. I am telling you it is infinite."

  Elara looked at the form. She looked at the memo on her desk about processing quotas. If she marked *Undefined*, the file went to Review. Review meant delay. Delay meant Mrs. Hesten got nothing while the file sat. If Elara adjusted the input—just slightly, just enough to force a convergence—the system would accept it. It would assign a very high risk-aversion coefficient, but it would generate a number. It would make Mrs. Hesten legible.

  "The system needs a number to allocate resources," Elara said.

  "Then the system is wrong," Mrs. Hesten said.

  Elara's finger hovered over the screen. She thought of Kael and the anchors. She thought of the Director's speeches about the fairness of the sum. If she falsified the data, she was violating the Charter. If she didn't, Mrs. Hesten was erased.

  She adjusted the probability slider. She entered a value that implied Mrs. Hesten would accept a one-in-a-million chance of eviction for the voucher. It was a lie. It made the utility function continuous. It made the woman computable.

  "Thank you," Elara said.

  Mrs. Hesten stood up. She didn't take the stylus Elara offered to sign the digital receipt. "You didn't hear me," she said. "You just made me fit."

  ***

  The hearing room was packed. The air was thick with humidity and anger. On the dais sat Director Varrick, old and gray, the man who had written the Charter in the ashes of the old Council. He looked tired, but his posture was rigid.

  The proposal on the table was for the Pump Station Allocation. District 4 and District 7 both needed the new pumps. There was only enough budget for one.

  "The Office proposes a lottery," Varrick said into the microphone. His voice was calm, amplified by the speakers. "A coin flip. District 4 gets the pumps this year, District 7 next year. Or vice versa."

  A roar went up from the District 7 contingent. They were seated on the left, wearing the blue armbands of the flood survivors.

  "That is not justice!" a woman shouted. "If the coin lands against us, our basements rot for another year. The mold kills the children. You cannot gamble with mold!"

  Varrick waited for the noise to subside. "Ex-ante, the allocation is fair. Every citizen in District 4 and District 7 faces the exact same probability distribution. The Expected Social Utility is identical to a certain split of resources that is physically impossible. We cannot build half a pump. We must build one. The Charter requires us to maximize the sum of expected utilities. Since the populations are equal, and the need is equal, the lottery maximizes the sum under the constraint of indivisibility."

  "We don't care about the expectation!" a man yelled from the back. "We care about the state! When the coin lands, one of us dries out and one of us drowns. You are saying that because the risk was shared, the drowning doesn't count."

  "The Charter ranks prospects, not outcomes," Varrick said. "We are administrators of the risk, not the weather. If we favor District 7 because they are currently wetter, we violate symmetry. We would be weighting the utility of a dry citizen less than the utility of a wet citizen. We would be penalizing District 4 for having been lucky in the last flood."

  "We didn't ask for luck!" the woman screamed. "We asked for protection!"

  Elara sat in the gallery, near the back. She watched Varrick. He wasn't lying. The math held. If you accepted the axioms, if you accepted that the only thing that mattered was the preference over the gamble before the coin was tossed, he was right. The unanimity principle was satisfied; no one could say the lottery was worse for everyone than the alternative, because the alternative was impossible.

  But the crowd wasn't objecting to the math. They were objecting to the silence. The Charter said nothing about what happened after the coin landed. It treated the world as a set of probabilities, not a sequence of realities. It assumed that if the risk was fair, the suffering was justified.

  Kael was there, standing near the exit. He caught Elara's eye. He didn't look triumphant. He looked grim. He knew that even if they won this hearing, even if they forced a deterministic split, the Office would just adjust the anchors next month. The math would re-balance. The system was designed to absorb the shock.

  Varrick gavelled the meeting closed. "The Office will proceed with the randomization protocol. The results will be published Tuesday."

  As the crowd surged forward, Elara slipped out. She walked into the rain. The city was a construction site, a skeleton of steel and wet concrete. She understood now why Varrick insisted on the theorem. It wasn't because it was true. It was because it was a shield. If the decision was a theorem, it wasn't a choice. If it wasn't a choice, no one could blame him for the drowning.

  ***

  The request came from the Lowlands on a Thursday. It was a simple form: *Request for Deterministic Allocation.* They wanted gravel. Not a lottery for gravel. Not a gamble on whether the gravel would arrive. They needed gravel now to shore up the riverbank. There was no risk involved in the request. It was a certain cost for a certain gain.

  Elara put the form into the aggregation engine. She waited for the ranking.

  The screen flashed: *INDETERMINATE.*

  She ran it again. *INDETERMINATE.*

  She took the file to her supervisor. "The system won't rank it."

  The supervisor, a man who had been there since the Council days, didn't look up from his own screen. "It's a certainty. The Charter mandates the maximization of Expected Social Utility."

  "But a certainty is just a probability of one," Elara said.

  "The utility functions were elicited via gambles," the supervisor said. "The curves are calibrated to risk tolerance. Without a risk parameter in the proposal, the model cannot validate the utility gain against the baseline. The Charter defines our jurisdiction as prospects. This is a grant."

  "So we can't give them gravel?"

  "We can't rank it against the Pump Lottery," he said. "If we can't rank it, we can't allocate. The budget is locked to the optimization output."

  Elara looked at the attachment. The Lowlands request had no signatures. Not because they didn't agree, but because they had stopped signing. The Lowlands had been poor before the flood. They were poor after. They had learned that filing claims yielded nothing but interviews. So they had stopped filing. They sent this request as a formality, a whisper.

  Because they hadn't participated in the recent elicitation rounds, their utility functions were stale. The system imputed their current utility based on their last declared preferences, adjusted for inflation. But because they had stopped staking claims, their declared preference for public goods had flatlined. They asked for nothing, so the system recorded that they wanted nothing.

  "Their utility is flat," Elara said.

  "They aren't asking," the supervisor said. "The machine reads silence as satisfaction. It's in the protocol. If you don't express a preference over the prospects, your weight in the sum is null."

  "But they need gravel."

  "Then they should have filed a prospect. A gamble. 'Give us gravel or we riot.' Something with variance."

  Elara walked back to her desk. She held the request form. It was crumpled. The Lowlands were outside the Charter. The Charter protected those who played the game. It protected those who accepted the anchors, who accepted the continuity axioms, who accepted the lottery. It protected those who could translate their pain into a probability.

  The Lowlands had no probability. They had only the mud. And the mud didn't speak the language of the Office.

  She looked at the Director's office through the glass wall. Varrick was on the phone. He was arguing, gesturing with a pen. He looked like a man holding up a roof that was already collapsing. He believed in the Charter. He had to. If the Charter was just a stack of choices, then the drowning in District 7 was his fault. If the Charter was a theorem, it was just geometry.

  Elara looked down at her own desk. There was a stack of calibration memos. *Adjustment to Reference Life.* *Adjustment to Standard Stake.* *Adjustment to Risk Tolerance Baseline.*

  She picked up her stylus. She had to process the Lowlands request. She could mark it *Exception*. She could route it to the Director for manual override. It would take weeks. It would flag her file. Or she could mark it *Rejected*, and the gravel would go to the District that filed the best lottery proposal.

  She thought about Mrs. Hesten, whose infinite loss had been compressed into a decimal. She thought about Kael, who knew the anchors were rigged but still had to play the game to move them. She thought about District 7, waiting for the coin to land.

  The Charter was not a lie. The math worked. The sum was maximized. The weights were equal. But the fairness was not in the theorem. The fairness was in the memo she held in her hand. The fairness was in the decision to set the zero-point at 'homeless' or 'tenant'. The fairness was in the decision to force a continuous curve on a broken heart. The fairness was in the decision to ignore the silence of the poor.

  The theorem proved nothing. It only concealed the choices.

  Elara put the stylus down. She picked up the phone to call the Lowlands liaison. She would tell them to file a prospect. She would tell them to invent a risk. *Threaten to leave. Threaten to burn.* Give the machine some variance so it can see you.

  It was a terrible advice. It was the only advice the machine understood.

  She looked out the window. The rain was falling on the city, indifferent to the zoning maps. The water didn't care about the anchors. It would take what it wanted. The Office was built to stop the water, but it was built out of paper.

  Elara opened the file. She began to type. She would not mark *Exception*. She would not mark *Rejected*. She would enter the data. She would adjust the anchor, just a fraction, just enough to make the gravel register as a positive utility gain in the aggregation. It was a falsification. It was a violation of the Charter.

  It was the only way to make the theorem true.

  She typed the numbers. The screen flickered. The progress bar moved. *ALLOCATED.*

  She saved the file. She closed the window. She picked up the next form. The rain continued to beat against the glass, a steady, rhythmic drumming, like a coin spinning on a table, waiting to fall.
