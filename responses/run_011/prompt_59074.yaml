prompt: |-
  Consider the following cluster of practices, all of them settled features of ordinary legal systems.

  1. In most jurisdictions the state's power to prosecute an offence lapses once a fixed period has run: a few years for minor offences, decades for grave ones, no limit at all for homicide in some. Take a serious violent offence carrying a twenty-year period. Twenty-two years on, the perpetrator is identified beyond reasonable doubt by a DNA match; the physical evidence is intact, the witnesses are available, he never fled, and he is no longer dangerous. The prosecution is nonetheless dismissed — not on the merits, not by acquittal, but as time-barred.

  2. The machinery around the bar is elaborate. In many systems the period is suspended, or does not begin, while the suspect is a fugitive, while the victim is a minor, or until the injury could reasonably have been discovered. In some systems expiry removes the court's power to hear the case altogether and must be declared by the court on its own motion; in others the bar is a defence the accused must raise and may waive, so that a prosecution of a time-barred offence proceeds validly if nobody objects.

  3. The gravest offences under international law — genocide, crimes against humanity, war crimes, aggression — are expressly imprescriptible: no lapse of time bars prosecution, and international courts have tried defendants in their eighties for acts committed decades earlier.

  4. Legislatures repeatedly attempt to undo the bar for categories of offence thought to have been under-prosecuted, with split results. When a state legislature revived an already-expired criminal limitation period for child sex offences, the United States Supreme Court held the revival unconstitutional as an ex post facto law; over the same period, several legislatures opened temporary windows in which civil claims for the same conduct could be brought however long ago it occurred, and those windows have largely survived challenge.

  I would like an analysis of what this cluster presupposes about the relation between law and morality — the question at the centre of the dispute between source-based and merit-based accounts of law. Specifically:

  (a) Reconstruct the implicit theory. What has to be true of a legal wrong for a calendar fact, together with the diligence of investigators, to extinguish it? Does the practice suppose that the wrong itself ceases to exist, or only that the state's capacity to respond to it ceases? Which of these do the details in item 2 commit it to — dismissal without acquittal, the waivability of the bar in some systems, the survival of parallel civil claims, and the fact that a time-barred person may still truthfully be described as guilty?

  (b) Ask whether the merit-based side can absorb the practice. Could a theorist who holds that law's content depends on moral facts still make sense of prescription — for instance by locating the relevant wrong not in the act alone but in a standing institutional relation between state and offender, which the state can lose its standing to pursue? Would that be a genuine alternative account or a source-based account wearing different clothes? Conversely, does item 3 look like morality constraining law from outside, and if so do items 1 and 3 presuppose consistent things when they sit within a single legal order, or must one be read as a concession to the other?

  (c) Explain the asymmetry in item 4. What does the difference in treatment between the revived criminal period and the revived civil period presuppose about what the time-bar creates: a right, an immunity, a limit on adjudicative power, or a mere procedural default available to whoever bothers to invoke it?

  (d) Distinguish what the cluster strictly presupposes from what merely fits it comfortably. How much of it can be discharged by administrative and epistemic considerations — evidence decays, memory fades, the deterrent and expressive returns of late prosecution decline, people are entitled to organise their lives around a settled past — so that no account of legal validity is engaged at all? Identify, if you can, the precise point at which the practice becomes philosophically loaded rather than merely expedient, and say which of the four items passes it.

  (e) Say what would have to change if the presupposed view were replaced by its rival. What would a criminal law that treated moral desert as directly constitutive of liability look like here — general imprescriptibility, abolition of the bar for grave offences only, a discretionary judicial power to lift it — and what would each version cost in the goods the current practice is usually said to serve?

  (f) Finally, if you think this framing is the wrong lens — that the cluster does not in fact discriminate between source-based and merit-based accounts of law — say so plainly, and describe what feature a legal practice would need in order to be genuinely probative between them.

  Citations are not required; please argue from the practices as described above.
reasoning: |-
  Here's a thinking process that leads to the analysis:

  1.  **Deconstruct the Request:**
      *   **Subject:** A cluster of legal practices regarding statutes of limitations (prescription) in criminal and civil law, including international law exceptions and constitutional challenges to retroactive extensions.
      *   **Core Question:** What does this cluster presuppose about the relation between law and morality? Specifically, the dispute between source-based (legal positivism) and merit-based (natural law/Dworkinian) accounts of law.
      *   **Tasks:**
          *   (a) Reconstruct the implicit theory (nature of the wrong vs. state capacity).
          *   (b) Assess compatibility with merit-based accounts (can morality absorb prescription? Is international imprescriptibility a moral constraint?).
          *   (c) Explain the asymmetry in item 4 (criminal vs. civil revival).
          *   (d) Distinguish strict presuppositions from comfortable fits (expediency vs. validity).
          *   (e) Describe the rival view (moral desert as constitutive) and its costs.
          *   (f) Evaluate the framing itself (is this actually probative for the source/merit debate?).

  2.  **Analyze Item 1 (The Basic Practice):**
      *   *Fact:* Prosecution barred by time even if guilt is certain and danger is nil.
      *   *Implication:* Legal liability is not identical to moral guilt. If it were, time wouldn't extinguish the duty to punish.
      *   *Source/Merit:* Suggests law is a system of rules with conditions (sources) rather than a direct reflection of moral truth (merits).

  3.  **Analyze Item 2 (The Machinery):**
      *   *Fact:* Suspensions (fugitive, minor), *sua sponte* dismissal vs. waiver, dismissal without acquittal.
      *   *Implication:* "Dismissal without acquittal" means the defendant isn't declared innocent, just unpunishable. "Waivability" suggests it's a personal right/privilege, not a jurisdictional limit on the state's moral authority.
      *   *Source/Merit:* If it were a moral limit, the court *should* stop it regardless of waiver. Waivability suggests a procedural rule (source-based) rather than a substantive moral truth.

  4.  **Analyze Item 3 (International Law):**
      *   *Fact:* Genocide/War Crimes are imprescriptible.
      *   *Implication:* Some wrongs are so morally grave that legal time limits cannot apply.
      *   *Source/Merit:* This looks like merit-based reasoning entering the law. The *nature* of the act dictates the legal consequence, overriding standard procedural limits.

  5.  **Analyze Item 4 (Retroactivity/Asymmetry):**
      *   *Fact:* Criminal revival = Unconstitutional (Ex Post Facto). Civil revival = Okay.
      *   *Implication:* Criminal liability creates a vested status/immunity once time passes. Civil liability is more flexible.
      *   *Source/Merit:* Suggests criminal law involves a specific kind of normative status (liberty interest) that becomes fixed by source-based rules, whereas civil law is more about resource allocation/remedies.

  6.  **Drafting the Response - Section by Section:**

      *   **(a) Reconstruct the Implicit Theory:**
          *   *Core:* The legal wrong is distinct from the moral wrong. The moral wrong persists (he is still "guilty" in a moral sense), but the *legal* claim extinguishes.
          *   *Nature:* It's not that the act wasn't wrong; it's that the *state's standing* to punish expires.
          *   *Item 2 Details:* "Dismissal without acquittal" confirms moral guilt remains. "Waivability" confirms it's a personal defense (procedural), not a limit on truth/jurisdiction. If it were a moral truth that punishment is wrong after 20 years, the accused couldn't waive it.
          *   *Conclusion:* Law is a institutional practice with its own conditions of validity, separable from the underlying moral reality of the act.

      *   **(b) Merit-Based Absorption:**
          *   *Can Merit Theorists explain it?* Yes. Dworkin could argue "integrity" or "fair notice" are moral principles embedded in the law. The "standing relation" argument works: The state loses moral standing to punish due to delay (prejudice, reliance).
          *   *Is it Source-based in disguise?* If the "moral principle" is just "follow the rulebook," it collapses to positivism. But if the principle is "fairness requires repose," it's merit-based.
          *   *Item 3 (International):* This looks like morality constraining law. If domestic law says "20 years" but international morality says "never," and international law prevails, it suggests moral gravity dictates legal validity.
          *   *Conflict:* Items 1 & 3 sit uneasily. 1 says time kills liability; 3 says some acts are too big for time. A consistent merit theory must explain *why* rape expires but genocide doesn't. A source theory just says "different rulebooks."

      *   **(c) The Asymmetry (Item 4):**
          *   *Criminal:* Ex Post Facto ban implies the expiration creates a *vested right* or *immunity*. The offender acquires a legal status of "non-liability" that becomes part of their liberty.
          *   *Civil:* Survival of revival implies civil limitation is a *procedural default* or *remedial limit*, not a substantive right.
          *   *Presupposition:* Criminal law punishes the *person* (affecting liberty), creating a substantive legal status. Civil law resolves *disputes* (affecting resources), where policy can shift.
          *   *Nature of the Bar:* In criminal law, it acts like an immunity. In civil law, it acts like a statute of repose that is more malleable to legislative will.

      *   **(d) Strict Presuppositions vs. Comfortable Fits:**
          *   *Expediency:* Evidence decay, memory fade, deterrence drops. These explain *why* the rule exists, not *what* the rule is.
          *   *Philosophically Loaded Point:* The point where the rule applies *despite* perfect evidence and safety (Item 1). If it were just epistemic, the DNA match would override it. The fact that it doesn't means the bar is *constitutive* of the liability, not just evidentiary.
          *   *Which Item?* Item 1 is the loaded one. Item 2 is procedural elaboration. Item 3 is an exception proving the rule. Item 4 is constitutional interpretation. Item 1 forces the separation of legal validity from moral desert.

      *   **(e) The Rival View (Moral Desert as Constitutive):**
          *   *Change:* If moral desert = liability, time shouldn't matter.
          *   *Version 1 (General Imprescriptibility):* Punish all crimes forever. Cost: Legal certainty, reliance, administrative chaos, cruel/unnecessary punishment of aged.
          *   *Version 2 (Grave Only):* Only murder/genocide persist. Cost: Arbitrary line-drawing, inequality (rich/poor treated differently based on crime type).
          *   *Version 3 (Judicial Discretion):* Judges decide if delay is unfair. Cost: Rule of law erosion, unpredictability, bias.
          *   *Current Practice Goods:* Certainty, finality, administrative efficiency, proportionality of state power.

      *   **(f) Evaluating the Framing:**
          *   *Critique:* Does this actually test Positivism vs. Natural Law?
          *   *Argument:* Both can explain this. Positivists say "The Rule says 20 years." Natural Lawyers say "Justice requires repose."
          *   *Probative Feature:* To be truly probative, we need a case where Source and Merit *diverge*. E.g., A law that says "No limitation for genocide" passed by an illegitimate regime, or a law that says "Limitation applies to genocide" in a just state.
          *   *Verdict:* The framing is slightly off. It tests *Legal Conventionalism* vs. *Moral Realism in Law*, but standard Positivism (Hart/Raz) accommodates moral principles as *sources* if the rule of recognition accepts them. The real tension is in Item 3 (International) where morality seems to *override* source-based domestic limits.
          *   *Refinement:* I need to be careful not to say "Positivism can't explain morals." Positivism says morals aren't *necessary* conditions. Item 3 suggests they *are* necessary for international crimes. That's the friction point.

  7.  **Refining and Polishing:**
      *   *Tone:* Analytical, philosophical, precise.
      *   *Structure:* Follow the (a)-(f) prompts strictly.
      *   *Key Insight:* The crucial distinction is between "extinguishing the wrong" vs. "extinguishing the remedy/standing." The cluster strongly supports the latter, which aligns with a source-based view of legal validity (the rule defines the boundary) but allows merit-based justifications for the rule's existence.
      *   *Item 4 Nuance:* The Ex Post Facto clause is key. It treats the expiration as a substantive right in criminal law, not just procedure.
      *   *Item 3 Nuance:* This is the strongest point for merit-based theory. If *malum in se* crimes override *malum prohibitum* time limits, morality is driving validity.

  8.  **Final Review against constraints:**
      *   No citations.
      *   Argue from practices described.
      *   Address the Source vs. Merit dispute specifically.

      *(Self-Correction during drafting)*: I need to make sure I don't conflate "merit-based" (Dworkin/Natural Law) with "moral justification." Positivists can offer moral justifications for rules. The question is whether the *validity* of the rule depends on the merit. Item 1 suggests validity depends on the calendar (source). Item 3 suggests validity depends on the gravity of the act (merit). This tension is the core.

      *(Refining Part F)*: I should argue that this cluster is actually *better* explained by a sophisticated Positivism (incorporationism) than a strong Natural Law theory, because the variation (20 years vs. none vs. waivable) suggests conventional agreement rather than moral discovery. However, Item 3 is the outlier. I will conclude that the framing is partially useful but ultimately shows that both theories can accommodate the data, making it weakly probative unless we focus on the *necessity* of the moral constraint in Item 3.

      *Wait, let's look closer at (f).* If the prompt asks me to say if it's the wrong lens, I should be bold if I believe it. Is it the wrong lens? The Source/Merit debate is about *conditions of validity*.
      *   Source: Valid if enacted by proper authority.
      *   Merit: Valid if consistent with moral truth.
      *   Item 1: Valid because enacted (Source).
      *   Item 3: Valid because morally necessary (Merit?).
      *   Actually, Item 3 is also enacted (Rome Statute, etc.). So even Item 3 is source-based ultimately.
      *   So, is the lens wrong? Yes, because both sides can explain the *existence* of the rule via sources. The debate is about whether an *unjust* limitation period would still be law. The cluster doesn't show an unjust period; it shows a settled one.
      *   *Decision:* I will argue in (f) that the lens is slightly misaligned. The cluster shows *legal conventionalism*. To be probative, we would need a case where the source says "barred" but morality screams "punish," and we ask which prevails. Item 3 comes close but is still treaty-based.

      *Let's reconsider (a).* Does the practice suppose the wrong ceases to exist? No, "dismissal without acquittal" proves the factual/moral wrong remains. It supposes the *legal* relation ceases.
      *   *Waivability:* If I can waive it, it's my right, not a limit on the court's truth-finding. This supports a view of law as a system of rights/powers (Hohfeldian/Source) rather than moral truth.

