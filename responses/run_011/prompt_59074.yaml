answer: |-
  (a) **Reconstruction of the Implicit Theory**

  The cluster presupposes a distinction between the *moral reality* of the act and the *legal validity* of the claim. For a calendar fact to extinguish liability despite perfect evidence and undisputed guilt (Item 1), the legal system must treat the wrong not as a timeless moral truth that demands rectification, but as a contingent institutional relation. The practice does not suppose the wrong itself ceases to exist; the "dismissal without acquittal" confirms that the defendant is not declared innocent, only unpunishable. The perpetrator remains morally culpable, and socially stigmatized, but legally immune.

  The details in Item 2 commit the system to the view that the bar is a limitation on the *state's standing* rather than a negation of the *act's nature*. If the bar were a recognition that the moral wrong had dissolved, the court would have to dismiss the case on its own motion in all instances (as truth is not waivable). The fact that the bar is waivable in some systems implies it is a personal privilege or defense belonging to the accused, not an objective limit on the court's jurisdiction to ascertain truth. Furthermore, the survival of parallel civil claims (Item 4) suggests that the "wrong" is multifaceted: the state's interest in punitive justice expires, but the victim's interest in compensatory justice may persist or be treated differently. The system presupposes that legal liability is a construct of specific rules (sources) that can expire, independent of the enduring moral desert of the actor.

  (b) **Absorption by the Merit-Based Side**

  A merit-based theorist (who holds that law's content depends on moral facts) can absorb this practice, but only by redefining the relevant "merit." They would argue that the moral principle governing the state is not simply "punish the guilty," but "punish the guilty *under conditions of fairness*." On this view, the passage of time alters the moral landscape: the offender acquires a moral claim to repose, and the state suffers a moral loss of standing due to delay. Thus, the legal content (the bar) reflects a complex moral fact about the relationship between state and subject, not just the act itself.

  However, this risks being a source-based account in different clothes. If the "moral fact" is simply that "the rulebook says 20 years," it collapses into positivism. For it to be genuinely merit-based, the theorist must argue that *even without the rule*, justice would eventually require a bar. Item 3 complicates this. The imprescriptibility of genocide suggests that for certain acts, moral gravity *overrides* the moral claim to repose. If Items 1 and 3 sit within a single legal order, they presuppose inconsistent moral logics unless one is read as a concession to the other. Either the ordinary bar is a pragmatic concession to administrative limits (undermining the merit-based claim that it is morally required), or the international exception is a moral override (suggesting law is constrained by external morality). If the latter, Item 3 looks like morality constraining law from outside, implying that for the gravest crimes, legal validity *does* depend on moral merit (i.e., you cannot make a valid law barring genocide prosecution). This creates tension: the domestic order treats time as a source-based cut-off; the international order treats the nature of the crime as a merit-based veto on time limits.

  (c) **The Asymmetry in Item 4**

  The difference in treatment between revived criminal periods (unconstitutional) and revived civil periods (constitutional) presupposes that the criminal time-bar creates a **vested immunity** or substantive right, whereas the civil time-bar creates a **procedural default** or remedial limit.

  In the criminal context, the expiration of the period transforms the suspect's status. They move from "liable" to "immune." To revive the period is to punish someone for an act that was not punishable when the revival occurred, violating the principle against *ex post facto* laws. This presupposes that criminal liability is a direct constraint on liberty that crystallizes into a right to be free from prosecution once the source-based conditions lapse. In the civil context, the limitation is viewed as a policy tool to manage court dockets and evidence reliability, not a substantive right of the defendant. The legislature can alter the policy (opening a window) without violating a vested right because the civil defendant never acquired an immunity, only a temporary shield against process. This asymmetry reveals that criminal law is viewed as defining the *status of the person* (where time creates liberty), while civil law is viewed as regulating *disputes* (where time regulates resources).

  (d) **Strict Presuppositions vs. Comfortable Fits**

  Much of the cluster can be discharged by administrative and epistemic considerations without engaging legal validity. Evidence decay, memory fade, and the diminished deterrent return of late prosecution are *justifications* for the rule, not *constituents* of it. These are "comfortable fits." A system could theoretically abandon these concerns (e.g., with perfect DNA evidence and life-long deterrence) and still retain the bar.

  The practice becomes philosophically loaded at the precise point where the bar applies *despite* the absence of these epistemic concerns. Item 1 passes this point. The scenario specifies that evidence is intact, witnesses are available, and guilt is certain. If the bar were merely evidentiary or administrative, it should lift in this case. The fact that it does not implies that the time limit is **constitutive of the liability itself**. It presupposes that legal obligation has a temporal dimension built into its validity conditions, independent of the moral or epistemic capacity to judge. This is the point where the practice engages the source/merit debate: it asserts that a "source" (the calendar) can extinguish a "merit" (the justice of punishment).

  (e) **The Rival View and Its Costs**

  If the presupposed view were replaced by a rival view where moral desert is directly constitutive of liability (a strong merit-based account), the law would presuppose that if the act was wrong, the liability persists as long as the wrong persists.

  *   **What would change:** We would see general imprescriptibility, or at least a discretionary judicial power to lift the bar where justice demands it (e.g., in the DNA case in Item 1).
  *   **Version 1 (General Imprescriptibility):** Liability never expires. *Cost:* This destroys the good of **finality**. Citizens could never organize their lives around a settled past. It also imposes high administrative costs and risks punishing individuals who have morally rehabilitated themselves, reducing the moral force of punishment.
  *   **Version 2 (Abolition for Grave Offences Only):** Only murder/genocide persist. *Cost:* This creates a **hierarchy of injustice** that may be arbitrary. It suggests that a victim of a non-prescriptible crime matters more than a victim of a prescriptible one, potentially undermining the equal standing of citizens before the law.
  *   **Version 3 (Discretionary Judicial Power):** Judges lift the bar if "justice requires." *Cost:* This erodes the **Rule of Law**. Predictability vanishes; liability depends on a judge's moral assessment of the delay rather than a public rule. This invites bias and undermines the source-based security that the current practice provides.

  The current practice serves the goods of certainty, reliance, and the containment of state power. The rival view serves the good of retributive accuracy but at the cost of legal security and institutional restraint.

  (f) **Evaluation of the Framing**

  This framing is partially the wrong lens. The cluster does not sharply discriminate between source-based and merit-based accounts because **both can accommodate the data.**

  A source-based theorist says: "The law is what the rulebook says. The rulebook says 20 years. Therefore, liability ends."
  A merit-based theorist says: "The law is the best moral interpretation of the practice. Justice requires repose. Therefore, liability ends."

  Both arrive at the same conclusion. To be genuinely probative, a legal practice would need to feature a **conflict** where the source and the merit diverge, and the system's reaction reveals which one controls validity. For example, if a legislature passed a law saying "Genocide is prescriptible" (Source) and the courts struck it down because "Genocide cannot be time-barred" (Merit), that would be probative. Item 3 hints at this (international imprescriptibility), but even that is usually codified in treaties (sources).

  A truly probative feature would be a case of **iniquitous prescription**: a statute of limitations that is widely acknowledged as morally repugnant (e.g., 24 hours for murder) but is nonetheless enforced by the courts as valid law. If courts enforce it, it supports the source-based view (validity is separate from merit). If courts strike it down as "not law," it supports the merit-based view. The cluster provided describes *settled, generally accepted* practices where source and merit likely align (most people agree 20 years is reasonable). Therefore, the cluster illustrates legal **conventionalism**, but it does not force a choice between positivism and natural law. It shows how law operates when sources and merits are in equilibrium, not how it breaks when they are not.
