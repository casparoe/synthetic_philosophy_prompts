answer: |-
  Hey, it is great to hear you are building an ethics unit around character and virtue, and honestly, your instinct to anchor it in The Dark Knight is spot on. You are not forcing the reading at all; in fact, you have identified the exact tension that makes the film philosophically fertile ground. The Joker is indeed functioning as a radical situationist experimenter, and Harvey Dent is his primary data point. If we take the Harman and Doris line seriously, the core claim is that global character traits—like honesty or courage that persist across widely varying situations—do not exist in the way virtue ethicists assume. Instead, behavior is dictated by local contingencies and situational pressures. The Joker's thesis is essentially a vulgarized version of this: he believes there are no global traits, only fragile constructs that dissolve under specific stressors, hence the one bad day hypothesis.

  Where your reading gets really interesting is in the discrepancy between the small-scale tests and the grand finale. The bank robbers turning on each other, the corruption in the police force, and Dent's fall all support the situationist claim that when the context shifts, the morality shifts. However, the ferry scene is the anomaly that complicates the data set. The Joker sets up a controlled environment designed to maximize fear and self-preservation, predicting that the situational pressure will override any internal moral compass. When the passengers refuse to blow the boats, it looks like a falsification of his hypothesis. But a careful situationist might push back and say this doesn't prove global virtues exist; it only proves that this specific situation—collective deliberation under a deadline—elicited a specific local trait of communal restraint. It suggests that consistency is not entirely absent, but it is far more fragmented than Batman wants to believe. Batman relies on the idea that he can be a symbol of unwavering justice, but if Doris is right, Batman is just exhibiting a very strong local trait of non-killing that happens to hold up under pressure, not necessarily a global virtue of goodness, especially given his willingness to surveil the entire city or beat suspects to within an inch of their lives.

  You are also right to be cautious about leaning on the classic social psychology studies to buttress the situationist side. If you bring up the empirical background, it is worth noting to your students that the confidence the Joker places in his experiment mirrors the confidence mid-century psychology had in studies like Milgram's or the prison simulation, confidence that has since been tempered by replication issues and archival revelations about coaching and demand characteristics. The field has walked back the idea that situational forces always overwhelm character to the degree once thought. This actually makes the Joker a more tragic figure; he is betting on a scientific certainty that does not exist. He assumes the collapse of morality is inevitable because he treats human psychology as more predictable than it is. The failure of the ferry experiment is not just a moral victory for Gotham; it is an epistemic failure for the Joker. He thought he knew the variables well enough to guarantee the outcome, but human agency introduced a variable he could not calculate.

  That said, there are places where the mapping between the film and the philosophical debate strains, and you should point those out to keep the analysis honest. The movie ultimately needs Batman to be exceptional, whereas situationism suggests nobody is exceptional because nobody possesses the global traits required for exceptionality. The film resolves this tension not through philosophy but through narrative necessity by having Batman accept the label of the villain so Dent can remain the symbol. This is a pragmatic lie, not a virtue ethical truth. It admits that the public needs the illusion of global character even if the reality is messy. If you press the situationist critique hard enough, Batman's refusal to kill the Joker isn't a triumph of virtue; it is a rigid deontological constraint that nearly gets everyone killed. The film wants us to see it as moral integrity, but a situationist would argue it is just another local rule that happens to align with our heroes' preferences. The strain comes when the movie asks us to admire Batman's consistency while simultaneously showing us that his consistency requires him to break other moral norms, like privacy and due process.

  Ultimately, though, the film adds something to the debate that a journal article on global versus local traits cannot, and this is where you should land your unit. Philosophy deals in propositions, but the movie deals in affect and symbol. Consider the coin. For Harvey, the coin starts as two-headed, representing a world where he controls the outcome and justice is guaranteed. Later, it is scarred on one side, representing the Joker's chaos where chance dictates fate. But in the end, Batman catches the coin. He doesn't let it fall. That action is not an argument; it is a gesture of will over chance. The movie suggests that even if the empirical evidence for global character is weak, we must act as if it is strong to maintain a society. The makeup on the Joker's face is another element; it is not just disguise, it is the shedding of a fixed identity, inviting the audience to feel the allure of abandoning character constraints. We root for Batman not because the data supports his view of human nature, but because the narrative makes us feel the terror of a world without fixed points. The film forces us to confront the fact that believing in character is itself a moral act, regardless of whether the metaphysics of virtue ethics hold up under scrutiny. It teaches us that ethics is not just about what is true about human psychology, but about what story we need to tell to keep from blowing up the boat.
