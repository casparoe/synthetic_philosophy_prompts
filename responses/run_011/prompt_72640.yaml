      *   *Objection 9: The "Who Assigns Addresses?" Objection (Low-Medium Damage).* If identity is address, who assigns the address? If it's the rule itself, we are back to square one.
          *   *Faction:* Legal Philosopher.
          *   *Idiom:* Meta-rule, infinite regress.
