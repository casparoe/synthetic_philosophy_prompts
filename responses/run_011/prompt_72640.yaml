          *   *Nuance:* Don't say one is better, say they solve different problems.

      *   *Objection 5: The Comparative/Eternity Clause Objection (Medium Damage).* German Basic Law Art. 79(3). It protects content (human dignity), not slots.
          *   *Faction:* Comparative Constitutionalist.
          *   *Idiom:* Eternity clauses, substantive core, unamendability.
          *   *Reply:* Exactly. That's a content-referring rule. My theory predicts it *will* generate paradox if you try to amend it via the standard procedure. It requires a revolution or a new register.

      *   *Objection 6: The "Game vs. Constitution" Objection (Medium Damage).* Nomic is a game; Constitutions are foundational. Category mistake.
