prompt: |-
  I'm on the grants board of a small foundation (about $12m a year) and we have a problem I can't articulate without sounding paranoid. Our climate portfolio can be run three ways: multi-year core grants to a fixed set of orgs, matched project grants awarded competitively each round, or annual prizes judged after the fact. Which pairing of these looks best to us shifts depending on what happens to be on the agenda that month, and some of the grantees have clearly figured this out. Over the last 18 months we've gone core→prizes→matched→core, and every one of those moves cost real money in unwinding commitments, matching obligations we couldn't cancel, and staff time — we're back where we started with roughly $400k less to show for it. One trustee wants us to adopt a binding three-year rubric that locks the structure in advance and defers any change to a single scheduled review; another says that's nuts, because each individual switch was a sensible response to what we'd just learned, and you can't condemn a decision that was right when it was made just because of how the sequence turned out. A third has floated a look-ahead rule instead: before voting on any switch, we write down what we'd want to do two rounds later, and refuse switches we'd predictably undo.

  Draft the memo I'll circulate before next weeks meeting. It needs an actual bottom line — adopt the rubric, adopt the look-ahead rule, keep case-by-case discretion, or some conditional hybrid — plus reasoning the trustees can argue with rather than a summary of the debate. Take the losing side's strongest argument seriously rather than strawmaning it, and say something about when it would be legitimate to break a rule you've bound yourself to, since that's the first question that'll come up in the room.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** Small foundation ($12m/year), Climate Portfolio.
      *   **Problem:** Inconsistent grantmaking strategy (Core $\rightarrow$ Prizes $\rightarrow$ Matched $\rightarrow$ Core) over 18 months.
      *   **Consequence:** Grantees gaming the system, \$400k loss in efficiency/unwinding costs, staff burnout, reputation risk.
      *   **Proposed Solutions:**
          1.  Binding 3-year rubric (Trustee A).
          2.  Case-by-case discretion/Status Quo (Trustee B - "each decision was right at the time").
          3.  Look-ahead rule (Trustee C - "write down future intent before switching").
      *   **Task:** Draft a pre-meeting memo.
      *   **Requirements:**
          *   Must have a clear bottom line/recommendation (not just a summary).
          *   Must provide arguable reasoning.
          *   Must steelman the losing side (Trustee B's argument for flexibility).
          *   Must address the "escape clause" (when is it legitimate to break the rule?).
          *   Tone: Professional, direct, persuasive, suitable for a board of trustees.

  2.  **Determine the Bottom Line:**
      *   *Option 1 (Binding Rubric):* Too rigid for a $12m foundation in the climate space, which changes rapidly. If the science or policy landscape shifts dramatically, being locked in could be disastrous.
      *   *Option 2 (Status Quo):* Clearly failing. Costing money ($400k) and credibility.
      *   *Option 3 (Look-ahead Rule):* Good middle ground, but might be too procedural/weak on its own.
      *   *Hybrid Recommendation:* A **Modified Look-Ahead Rule with a High Bar for Deviation.** This combines the discipline of the rubric with the adaptability of discretion. It forces the board to think about stability *before* acting, without legally binding them to a path that might become obsolete. It addresses the "sequence cost" problem without creating a straitjacket.
      *   *Refinement:* Let's call it a "Stability Covenant." It's essentially the Look-Ahead rule but formalized with a specific cost-benefit threshold for breaking it.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary/Bottom Line:** State the recommendation clearly up front. Don't bury the lede.
      *   **The Problem (The "Why"):** Quantify the cost. $400k loss + reputation risk + grantee gaming. Frame it as an efficiency and integrity issue, not just a process issue.
      *   **The Options (Steelmand):**
          *   *Flexibility (Trustee B):* Acknowledge that climate work *is* volatile. Locking in could mean missing a breakthrough or failing to pivot during a crisis. The "sensible response" argument is valid in isolation.
          *   *Rigidity (Trustee A):* Acknowledge the need for predictability. Grantees need to know where they stand.
          *   *Look-Ahead (Trustee C):* Acknowledge this tests commitment.
      *   **The Recommendation:** The Hybrid/Stability Covenant.
          *   Commit to a structure for minimum 2 years.
          *   Require a "Future Intent Statement" (Look-Ahead) when adopting.
          *   **Crucial:** Define the "Escape Clause." When *can* we break it? (e.g., existential threat, massive opportunity, >X% efficiency loss).
      *   **Reasoning:** Why this wins. It reduces transaction costs, stops grantees from gaming, preserves *strategic* flexibility while removing *tactical* whim.
      *   **Next Steps:** Vote on the principle, task staff with drafting the specific covenant.

  4.  **Refining the Tone:**
      *   Avoid sounding accusatory ("we messed up"). Instead, focus on systemic optimization ("we identified a friction cost").
      *   Avoid paranoia. Frame the grantee behavior as rational economic actors responding to incentives, not malicious actors.
      *   Ensure the "Escape Clause" is robust. Trustees hate feeling trapped.

  5.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the recommendation too vague?
      *   *Fix:* Be specific about the "Stability Covenant." Define the minimum term (24 months) and the voting threshold to break it (e.g., supermajority).
      *   *Critique:* Did I address Trustee B's point?
      *   *Fix:* Ensure the section on "The Case for Flexibility" validates their concern that climate philanthropy requires agility. The recommendation must show how agility is preserved for *real* changes, not just preference shifts.
      *   *Critique:* Is the $400k figure highlighted enough?
      *   *Fix:* Put it in the opening. That's the hook.

  6.  **Final Polish:** Check word count, clarity, and ensure the "Bottom Line" is unmistakable. (The resulting memo below follows this structure.)

      *   *Key Phrase:* "Strategic agility vs. Tactical churn." This distinguishes between changing course because the world changed (good) vs. changing course because the board got bored (bad).

  7.  **Final check against constraints:**
      *   Actual bottom line? Yes (Hybrid Stability Covenant).
      *   Reasoning to argue with? Yes.
      *   Steelman losing side? Yes (Trustee B's flexibility argument).
      *   Escape clause? Yes (Supermajority + Specific triggers).

  8.  *(Self-Correction on the "Look-Ahead" rule)*: Trustee C's idea is clever but might be gameable ("We intend to stay, but..."). The recommendation should strengthen this into a formal "Minimum Duration Commitment" with a penalty/threshold for breaking it. Let's integrate the Look-Ahead as part of the adoption process, but the binding element is the *duration*, not the *intent*. Actually, the prompt asks to choose/adapt. A "Stability Covenant" is the best synthesis.

      *   *Decision:* I will recommend a **Two-Year Minimum Commitment with a Supermajority Escape Clause.** This incorporates the Rubric's stability, the Look-Ahead's foresight, but allows for the Flexibility's safety valve.

      *(Wait, re-reading the prompt)*: "Draft the memo I'll circulate... It needs an actual bottom line — adopt the rubric, adopt the look-ahead rule, keep case-by-case discretion, or some conditional hybrid."
      Okay, I will recommend the **Conditional Hybrid (Stability Covenant).**

      *Let's write it.*
answer: |-
  **MEMORANDUM**

  **TO:** Board of Trustees
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Protocol for Climate Portfolio Structure

  ### Bottom Line
  I recommend we adopt a **Conditional Hybrid Protocol ("The Stability Covenant")**. 

  This approach commits the board to a minimum 24-month duration for any chosen grantmaking structure (Core, Matched, or Prizes). It incorporates the "look-ahead" requirement as a condition of adoption, but crucially, it includes a defined **escape clause** allowing for mid-term changes only upon a 75% supermajority vote triggered by specific external shifts, not internal preference.

  We cannot continue with case-by-case discretion. The data shows our tactical agility has become tactical churn, costing us $400,000 in direct inefficiencies over 18 months and degrading grantee trust. However, a rigid three-year lock (the "Binding Rubric") creates unacceptable risk in the volatile climate sector. The Stability Covenant preserves strategic agility while eliminating whimsical churn.

  ### The Cost of the Status Quo
  We need to be precise about what is happening. Over the last six quarters, we have cycled through every available grantmaking modality and returned to our starting point. This is not merely a matter of process; it is a leakage of capital and credibility.

  1.  **Direct Financial Loss:** Approximately $400,000 has been consumed by unwinding commitments, penalty fees on matched funds, and staff overtime to manage transitions. That is capital that did not reach the atmosphere.
  2.  **Incentive Distortion:** Grantees are no longer planning based on climate impact; they are planning based on our board calendar. We have created an environment where organizations optimize their pitches for our current mood rather than their actual operational needs.
  3.  **Reputation Risk:** In the climate space, predictability is a form of funding. If partners view us as volatile, high-quality organizations will deprioritize us in favor of slower, steadier capital.

  ### The Case for Flexibility (Steelmanning the Opposition)
  Trustee B's argument against locking ourselves in is correct in principle: **Climate philanthropy requires agility.** 

  If a breakthrough technology emerges, or a policy window slams shut, a foundation that cannot pivot for three years is a broken foundation. The argument that "each individual switch was a sensible response to what we'd just learned" is factually true. We did learn that Prizes weren't driving early-stage R&D. We did learn that Core grants lacked urgency. To condemn those decisions retrospectively ignores that we were acting on new information. A rule that prevents us from acting on new information is a rule that prevents us from doing our jobs.

  However, there is a distinction between **Strategic Agility** (pivoting because the world changed) and **Tactical Churn** (pivoting because our risk appetite or agenda focus shifted). The last 18 months have been mostly the latter. We are not reacting to external shocks; we are reacting to our own evolving preferences.

  ### The Recommendation: A Stability Covenant
  I propose we vote on the following protocol for the Climate Portfolio:

  **1. The Minimum Duration Commitment**
  Once a grantmaking structure is selected (e.g., Multi-year Core), it is locked for a minimum of 24 months. This provides grantees the predictability they need to hire and plan.

  **2. The Look-Ahead Requirement**
  When voting to adopt a structure, the board must simultaneously record a "Future Intent Statement." This documents *why* we are choosing this path and what conditions would make us consider leaving it. This prevents amnesia and forces us to confront the likelihood of reversal before we vote.

  **3. The Escape Clause**
  A structure may be changed before the 24-month mark only if:
  *   **Threshold:** A 75% supermajority of the board votes in favor.
  *   **Trigger:** The motion cites a specific *external* change in the climate landscape (e.g., new legislation, technological obsolescence, grantee sector collapse) rather than an internal shift in board preference.
  *   **Cost Accounting:** Staff must present a projected "transition cost" estimate, and the board must acknowledge this loss explicitly in the minutes.

  ### Why This Works
  This hybrid solves the specific pathology we are facing. 

  *   **It stops the gaming:** Grantees will know we cannot switch modalities next quarter. They will stop optimizing for our whims and start optimizing for impact.
  *   **It preserves safety valves:** If the climate landscape fundamentally shifts, the 75% supermajority allows us to act. It simply raises the bar high enough that we won't do it lightly.
  *   **It internalizes costs:** By requiring a "transition cost" estimate before a switch, we force the board to weigh the benefit of the new strategy against the immediate loss of capital required to get there. In the past, we treated switching costs as sunk; this makes them visible.

  ### When to Break the Rule
  The first question in the room will be: *"What if we're wrong? What if we lock in a bad strategy?"*

  It is legitimate to break this covenant if the **cost of staying exceeds the cost of leaving.** 

  If adhering to the chosen structure actively damages our mission (e.g., we are funding obsolete tech while a superior alternative is starved of capital), we must break the rule. The 75% threshold ensures that this is a consensus view of the board, not a temporary majority impulse. If we cannot find 75% agreement that the strategy is failing, then the strategy is likely stable enough to endure.

  ### Next Steps
  I ask that we vote on the *principle* of the Stability Covenant at next week's meeting. If approved, I will work with the Program Director to draft the specific language for the bylaws, including the definition of "external triggers," for ratification at the following session.

  We are a $12m foundation. We cannot afford to spend $400k every 18 months to rediscover what we already knew. Let us choose a path, walk it for a meaningful distance, and only turn when the road ends, not when we get bored.
