answer: |-
  The principle you are looking for is **The Identification Condition for Inverse Planning**.

  In economics and cognitive science, this is the recognition that behavior ($B$) is the output of three latent variables: **Preferences** (Reward, $R$), **Beliefs** (World Model, $M$), and **Constraints** (Feasibility/Competence, $C$).

  $$ B = \text{Optimize}(R, M, C) $$

  Your gut verdicts are consistent because you are intuitively demanding that **$R$ cannot be inferred unless $M$ and $C$ are accounted for.** When $M$ or $C$ change, or are unknown, inferring $R$ is mathematically invalid.

  ### The Principle: Structural Invariance
  **Statement:** An inference about an agent's Reward Function ($R$) is legitimate if and only if the observed behavior cannot be explained by a change in Constraints ($C$) or Beliefs ($M$).

  **Implementation Rule:**
  To infer a change in Want ($\Delta R \neq 0$), you must observe a change in Behavior ($\Delta B \neq 0$) while holding Constraints and Beliefs constant ($\Delta C = 0, \Delta M = 0$).
  *   If $\Delta B \neq 0$ and $\Delta C \neq 0$ (e.g., budget tightens, rejection risk rises), attribute $\Delta B$ to $C$.
  *   If $\Delta B = 0$ despite Negative Outcome (e.g., rat gets sick), attribute persistence to High $R$ (assuming $C, M$ constant).
  *   If $B \to \text{Stop}$ and Competence $\to 0$ (e.g., robot fails grasp), attribute Stop to $C$, not $R$.

  ### Applying the Principle to Your Six Cases
  This principle saves all six of your verdicts without special pleading, provided your system explicitly models $C$ (constraints/competence) and $M$ (beliefs) as separate parameters from $R$.

  1.  **Drone dodges fan:** $\Delta C = 0$ (flight possible), $\Delta M = 0$ (knows fan is there). $\Delta B$ (detour) implies $\Delta R$ (dislike fan). **Verdict: Keep.**
  2.  **Robot fails grasp:** Competence $C \to 0$ (probability of success is zero). Stop is optimal regardless of $R$. **Verdict: Keep (Inference Invalid).**
  3.  **Worker buys dull sandwich:** Constraint $C$ (budget) is binding. Behavior is on the boundary of the feasible set, not an interior choice revealing taste. **Verdict: Keep (Inference Invalid).**
  4.  **Researcher (Rejections):** Constraint $C$ (probability of acceptance) dropped. Expected utility dropped due to $C$, not $R$. **Verdict: Keep (Inference Invalid).**
  5.  **Researcher (Quiet):** $C$ and $M$ constant. Behavior stops. Must be $\Delta R$. **Verdict: Keep.**
  6.  **Rat presses lever:** $C$ and $M$ constant (lever works, sickness known). Behavior persists despite negative utility side-effect. Implies $R_{\text{drug}} \gg R_{\text{health}}$. **Verdict: Keep.**

  ### Which Verdicts Must You Give Up?
  You asked to be told which verdicts the principle forces you to give up. The answer depends on your system's architecture:

  **If your system assumes a "Perfect Agent" (Standard IRL):**
  You must **give up the distinctions in Cases 2, 3, and 4.**
  Standard Inverse RL often assumes the agent is competent and unconstrained. If your code assumes the robot *could* have grasped the object but chose not to, you are mathematically forced to infer it didn't want it. If your code assumes the worker *could* afford the tasty sandwich, you are forced to infer she prefers the dull one.
  To keep your gut verdicts, your system **must** implement **Inverse Planning with Bounded Rationality**. It must infer $C$ (competence/budget) and $R$ (want) jointly. If you cannot model constraints, you cannot distinguish "can't" from "won't."

  ### The Case of the Wrong Model
  **Case:** An agent acting perfectly sensibly on a badly wrong model of the world (e.g., a person drinking poison because they believe it is water).

  **What the Principle Says:**
  This is the problem of **Reward-Belief Aliasing**.
  Mathematically, a stupid agent with normal goals produces the same behavior as a smart agent with weird goals.
  *   *Model A:* Normal $R$ (wants to live) + Wrong $M$ (thinks poison is water).
  *   *Model B:* Weird $R$ (wants to die) + Correct $M$ (knows it is poison).

  **Decision Rule:**
  You cannot solve this with behavior alone. You must introduce a **Prior**.
  *   If you assume agents generally have correct beliefs, you will infer the agent *wants to die*.
  *   If you assume agents generally have standard biological rewards, you will infer the agent *has wrong beliefs*.
  *   **Implementation:** Your system must treat Beliefs ($M$) as a latent variable to be inferred alongside Rewards ($R$). If you fix $M$ as "Reality," you will infer distorted Rewards for any agent with misinformation.

  ### The Established Name
  The difficulty you identified with the sandwich and the researcher has a specific name in economics and philosophy:

  1.  **The Identification Problem:** Specifically, the inability to separately identify preferences and constraints from choice data alone.
  2.  **The Fallacy of Revealed Preference:** This occurs when an observer assumes a choice reveals a preference without accounting for the **Budget Set** (constraints). Paul Samuelson's Revealed Preference Theory works only if the observer knows the constraints. When constraints are hidden (the worker is "skint"), the inference fails.
  3.  **Equifinality of Inaction:** In psychology, this is the principle that "not doing something" can result from multiple distinct causes (lack of desire vs. presence of barrier).

  ### Summary for Implementation
  To build a system that matches your gut verdicts:
  1.  **Do not** map Behavior directly to Reward.
  2.  **Do** model a "Feasibility Function" ($C$) and a "World Model" ($M$).
  3.  **Rule:** Only update $R$ when residuals remain after explaining behavior via $C$ and $M$.
  4.  **Warning:** If you cannot observe $C$ (e.g., you don't know the worker's bank balance), you must output **Uncertainty** on $R$, not a false inference.
