      *   This makes buying attractive in Round 1 (save effort) but risky in Round 2.

  8.  **Writing the Content (Iterative refinement):**
      *   *Self-Correction on Questions:* Make sure the Moral questions aren't just "opinions." They need to be normative claims.
      *   *Self-Correction on Round 2:* Make sure the "Challenge" isn't just me being mean. It needs to be structural. The rule is: "You must provide a *reason* independent of the source."
      *   *Debrief:* Ensure I mention the specific philosophical literature (e.g., Hills, "Understanding and Ethics").

  9.  **Final Review against constraints:**
      *   18 students? Yes, pair work helps.
      *   75 mins? Yes, timing breakdown needed.
      *   Token economics? Included.
      *   Sample questions? 4-5 per category.
      *   Debrief? Included.
      *   Failure modes? Included.
      *   Limitations? Included.

  10. **Final Polish:** Tone should be professional, instructional, and ready-to-use. (Proceeding to generate output based on these thoughts).

