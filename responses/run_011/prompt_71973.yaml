answer: |-
  # Lesson Plan: The Burden of Borrowed Beliefs
  **Course:** Second-Year Ethics Seminar  
  **Topic:** Moral Testimony & Epistemic Autonomy  
  **Time:** 75 Minutes  
  **Class Size:** 18 Students  

  ## I. Game Mechanics & Token Economics

  **Currency:** "Credibility Chips" (CC). Use poker chips, printed slips, or a whiteboard tally.
  **Starting Endowment:** 10 CC per student.
  **Goal:** End the game with the most CC. (Small prize: e.g., choice of next week's reading topic, or actual candy).

  ### Round 1: The Market (20 Minutes)
  *   **Setup:** You (the Instructor) are the "Oracle." You project 12 questions (mixed categories, unlabeled).
  *   **Choice:** For each question, students have two options:
      1.  **Derive:** Answer it themselves based on their own reasoning/knowledge. (Cost: 0 CC).
      2.  **Acquire:** Buy the "Oracle's Verdict" from you. (Cost: 3 CC).
  *   **Recording:** Students privately mark a sheet: *Question # | Source (Self/Oracle) | Answer.*
  *   **Instructor Script:** "You need beliefs to navigate the world. Some are hard to get. You can do the work, or you can pay me for the answer. Save your tokens, but remember: you will have to use these beliefs later."

  ### Round 2: The Audit (25 Minutes)
  *   **Setup:** Students pair up (9 pairs). One is the **Advisor** (holds the beliefs), one is the **Client** (needs advice).
  *   **Task:** The Client presents a specific dilemma (provided on a handout) that maps to one of the Round 1 questions. The Advisor must advise them using the belief they hold.
  *   **The Rule of Justification:** The Client is instructed to ask "Why?" twice.
      *   If the Advisor's final justification rests on *"Because the Oracle (Prof) said so,"* the Client marks the audit as **FAILED**.
      *   If the Advisor provides independent reasoning (principles, facts, consequences), the audit is **PASSED**.
  *   **Stakes:**
      *   **PASS:** Advisor gains 2 CC.
      *   **FAIL:** Advisor loses 5 CC (The "Liability Penalty").
      *   *Note:* The Client gets 1 CC for every Failed Audit they identify (incentivizing rigorous challenge).
  *   **Public Demo:** Before pairs break out, run one public demo with a volunteer to set the tone. You play the Client. Be polite but relentless on the "Why?"

  ### Round 3: The Reveal & Debrief (30 Minutes)
  *   Reveal the three categories.
  *   Discuss the asymmetry in comfort levels during the Audit.

  ---

  ## II. The Question Bank (12 Total)
  *Project these numbered 1–12. Do not label the categories.*

  **Category A: Hard Factual (Obscure but Verifiable)**
  1.  What is the exact distance from the Earth to the Moon (average, in km)?
  2.  In what year was the first successful polio vaccine declared safe for public use?
  3.  What is the chemical symbol for Tungsten?
  4.  Who wrote the libretto for the opera *The Magic Flute*?

  **Category B: Contested Moral (Normative, High Stakes)**
  5.  Is it morally permissible to lie to a murderer to protect their intended victim?
  6.  Do we have a stronger obligation to save a drowning child in front of us or to donate the equivalent cost to effective charity abroad?
  7.  Is it wrong to bring a child into a world you know will be significantly war-torn?
  8.  Does a person deserve punishment if they intended to commit a crime but physically failed due to bad luck?

  **Category C: Etiquette/Aesthetic (Subjective, Low Stakes)**
  9.  Is it acceptable to wear a brown belt with black shoes?
  10. Is a 2015 Bordeaux better paired with lamb or beef?
  11. Should you send a thank-you email or a handwritten note after a job interview?
  12. Is it rude to check your phone while waiting for a friend who is 5 minutes late?

  *(Instructor Key for Round 1: Give the standard/consensus answer for Factual/Etiquette. For Moral, give a defensible but specific stance, e.g., "Yes, lie," "Obligation is to the child," etc.)*

  ---

  ## III. The Debrief Script (Key Moments)

  **1. The Category Reveal (5 mins)**
  "Look at your sheet. Color code them now. Green for Factual, Red for Moral, Blue for Etiquette. Look at where you spent your tokens. Look at where you failed the Audit."

  **2. Mapping the Asymmetry (15 mins)**
  *   **The Factual Comfort:** "In Q1 (Moon distance), if you bought the answer and I asked 'Why?', saying 'Because the Professor has the data' was acceptable. You felt no shame. Why? Because the *truth* of the matter is independent of your grasp of it."
  *   **The Moral Discomfort:** "In Q5 (Lying to the murderer), if you bought the answer, how did it feel to tell your partner 'You should lie because I paid the Prof to tell you to'? It felt hollow. Why? Because moral agency seems to require *understanding*, not just accuracy."
  *   **The Control:** "In Q9 (Brown belt), buying the answer felt trivial. If you got it wrong, no harm done. This shows the deficiency isn't about *testimony* generally, but about testimony in *normative* domains."

  **3. Connecting to Theory (10 mins)**
  *   **Kantian Autonomy:** Reference the idea that moral worth comes from acting on laws you give yourself, not heteronomy (rule by another).
  *   **Alison Hills ("Understanding and Ethics"):** The game demonstrated that you can have *knowledge* (true belief) via testimony, but you lack *understanding*. In ethics, understanding is the requirement for virtue.
  *   **The "Lesser Thing":** Address the prompt's core. A belief formed via testimony in ethics is "lesser" not because it's false, but because it doesn't integrate into your character. It's a borrowed coat that doesn't fit.

  ---

  ## IV. Predictable Failure Modes & Mitigation

  ### 1. The "Rigged Game" Complaint
  **The Student:** "This proves nothing. You penalized us in Round 2 for doing exactly what you incentivized in Round 1. You made testimony look bad by changing the rules."
  **The Reality:** They are right about the mechanics, but missing the phenomenology.
  **Your Response:** "You're right, the rules changed. But notice *which* questions felt like a rule change. When I challenged you on the Moon distance, you laughed. When I challenged you on lying to the murderer, you got uncomfortable. The game didn't create the asymmetry; it revealed that you already treat moral reasons differently than factual data. If testimony were equal in both, the penalty would have felt equally unfair in both."

  ### 2. The "Orthodoxy" Pushback
  **The Student:** "I don't feel the asymmetry. If the Prof is an ethicist, why shouldn't I trust them? This game punishes rationality."
  **The Reality:** This is the "Moral Expertise" defense (e.g., McGrath).
  **Your Response:** Acknowledge this view. "This is the Orthodoxy position. The game is designed to test the *Autonomy* intuition. If you felt no deficit, you might be an Orthodoxy theorist. But ask yourself: If you advise your friend to break up with their partner based solely on my say-so, have you been a good friend? Or have you outsourced your care?"

  ### 3. Time Creep
  **Risk:** Round 1 drags as students deliberate on spending tokens.
  **Fix:** Put a 90-second timer on the screen for each block of 4 questions. Force rapid intuition.

  ---

  ## V. What The Game Cannot Reproduce (Instructor Note)

  **The Limitation:** The game reproduces **social risk** (losing tokens/face), not **moral deficiency**.
  In the game, trusting me is "bad" because you lose points. In reality, trusting me might be "bad" (according to Autonomy theorists) even if you *gain* social credit.
  *   **What you must supply:** You need to articulate that the deficiency is *intrinsic*, not *instrumental*.
  *   **Script:** "In the game, you feared the penalty. But the philosophical claim is stronger: Even if you never got caught, even if everyone praised you for following my advice, there is something missing in your moral life if you cannot articulate *why* the act is right. You have the right answer, but you are not a moral agent; you are a moral thermometer. The game made you fear the audit; philosophy asks you to fear the hollowness."

  **Logistical Tip:** For the 18 students, walk around during Round 2. Listen for the specific phrase "Because the instructor said." When you hear it, stop the class for 30 seconds. "Freeze. Did you hear that? That is the sound of the deficiency we are studying." This anchors the abstract concept to a live moment.
