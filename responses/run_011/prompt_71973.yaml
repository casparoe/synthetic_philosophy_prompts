  Also, for Round 2, to save time with 18 students, I shouldn't put everyone on the hot seat. I'll use a "Peer Audit" system. They pair up and audit each other. This scales better.

  *Revised Round 2:* Pairs. Student A advises Student B (who plays a client). B challenges. If A says "Prof said so," B marks "Failed Audit."
  *Actually, better:* I act as the Client for 3-4 public demos, then pairs do the rest. This ensures I control the "vibe" of the discomfort.

