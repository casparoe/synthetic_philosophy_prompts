answer: |-
  Here is the brainstorming process, followed by the structured analysis you requested.

  ### Brainstorming: Candidate Theories and Elimination

  Okay, let's look at the landscape. I need a theory that survives all four data points.

  *   **Candidate 1: Classical Legal Moralism (Devlin).**
      *   *Idea:* The law exists to enforce the shared morality of the community.
      *   *Fit:* Explains (2) S&M (society finds it abhorrent), (3) FGM (society finds it abhorrent), (4) Images (society finds them disgusting).
      *   *Elimination:* It crashes immediately on (1). The Wolfenden principle explicitly rejected the idea that immorality *alone* is enough for the criminal law. If Devlin were the operating theory, homosexuality would never have been decriminalised, or it would have been re-criminalised once moral panic shifted. The system claims privacy matters. So, pure Moralism is out.

  *   **Candidate 2: The Harm Principle (Mill).**
      *   *Idea:* The law exists only to prevent harm to others.
      *   *Fit:* Explains (1) perfectly (no harm to others). Explains (3) partially (FGM harms girls).
      *   *Elimination:* It struggles badly with (2). If two adults consent to S&M, where is the harm to *others*? The courts say consent doesn't validate harm, but Mill says my body is my own. It also struggles with (3) regarding male circumcision—if harm is the metric, cutting a healthy infant's foreskin is harm, yet it's lawful. And (4) is a killer for Mill: possession of an image involves no act, no victim, no publication. No harm to others is visible. So, strict Millianism is out.

  *   **Candidate 3: Legal Paternalism.**
      *   *Idea:* The law protects people from themselves.
      *   *Fit:* Explains (2) (you can't consent to injury) and (3) (infants can't consent).
      *   *Elimination:* Fails on (1). If the state is protecting adults from themselves, why allow homosexual acts which were deemed spiritually/psychologically harmful by the moral majority at the time? Also fails on (4). Possessing an image doesn't necessarily harm the possessor in a way the state usually regulates (like drugs). Paternalism is too blunt.

  *   **Candidate 4: Administrative Convenience / Enforceability.**
      *   *Idea:* The law targets what is easy to prove.
      *   *Fit:* Explains (4) brilliantly (finding a file is easier than proving a violent act occurred). Explains why (1) was decriminalised (hard to police bedrooms).
      *   *Elimination:* It's cynical. It doesn't explain the *moral distinctions* drawn. Why is boxing (injury) okay but S&M (injury) not? Both happen in private. Why is male circumcision okay but FGM not? Enforcement difficulty doesn't explain the *normative* distinction. It explains the *tactics*, not the *strategy*.

  *   **Candidate 5: "Civic Status" or "Normative Integrity" Theory.**
      *   *Idea:* The law protects the status of citizens as free, equal, and dignified agents. Consent is valid only when it aligns with this status.
      *   *Fit:* (1) Homosexuality is compatible with equal citizenship. (2) S&M treats the body as an object for degradation, undermining civic dignity. (3) Male circ is "cultural/religious integration"; FGM is "gendered oppression." (4) Violent images cultivate dispositions incompatible with civic respect.
      *   *Status:* This is the strongest survivor. It allows for moral judgment without admitting to pure moralism. It restricts consent without admitting to pure paternalism.

  Okay, I've crossed out the pure versions. The operating theory must be a hybrid that prioritizes the *social meaning* of acts over the *physical consequences* or the *private morality*. Let's build the response.

  ***

  ### (a) Reconstructing the Implicit Theory

  The single set of commitments that licenses this combination is not a theory of *harm*, nor a theory of *morality*, but a theory of **socially recognised purposes**.

  Under this implicit view, the criminal law's proper business is to maintain a normative framework in which bodies and actions have stable, publicly intelligible meanings. The law is not protecting the physical body per se (otherwise boxing and surgery would be assaults), nor is it protecting private morality (otherwise homosexuality would be crime). It is protecting the **integrity of consent as a social institution**.

  Here is how this theory binds the four pieces together:

  1.  **On Consent and Injury (Piece 2):** Consent is not a sovereign power that an individual holds over their own flesh. It is a social license granted by the community. You may consent to injury only when the injury serves a **socially recognised good**. Surgery heals; boxing is a regulated sport with cultural history; tattooing is body art. Sadomasochism, in the eyes of the court, serves no recognised social good—it is "violence for pleasure." Therefore, consent runs out not at a specific millimetre of skin depth, but at the point where the act loses its social utility and becomes mere degradation. The "branding" case fits here because the court strained to reclassify it as "tattooing" (a recognised good) to avoid criminalising a husband within a marriage, preserving the social unit of the family.
  2.  **On Bodies and Gender (Piece 3):** This follows from the "social purpose" rule. Male infant circumcision is viewed as a rite of passage within recognised religious communities; it is integrated into the social fabric. Female genital cutting is viewed as an instrument of patriarchal control, incompatible with the status of women as equal citizens. The physical harm is similar; the **social meaning** is opposite. The law intervenes not to stop "cutting," but to stop "oppression." The extraterritorial reach confirms this: the state is protecting the *class* of female citizens from a practice deemed inimical to their civic status, regardless of where it happens.
  3.  **On Images and Possession (Piece 4):** This is the most revealing piece. If the law were about harm, a staged image causes none. If it were about public morality, private possession should be irrelevant. But under the "social purpose" theory, the image is a **virtual act**. Possessing it signals an allegiance to a normative framework where violence against bodies (specifically sexualised bodies) is acceptable. The crime is not the harm caused by the image, but the **corruption of the citizen's disposition**. By criminalising possession, the state asserts that a good citizen does not even privately entertain fantasies that contradict the public norm of bodily integrity.

  So, the implicit theory is this: **The criminal law regulates the boundary between acceptable and unacceptable forms of life.** It permits private immorality (1) only so long as it does not threaten the normative structure of the body (2, 3) or the civic disposition of the viewer (4). Consent is valid only when it reinforces social goods; it is void when it undermines them.

  ### (b) Separating the Layers

  You are right to suspect that piece (4) is the unstable one, but I think the "administrative convenience" reading is only half the story. Let's separate the layers.

  **1. The Presupposed Layer (Doctrine couldn't exist without this):**
  The foundational commitment is the **distinction between "public good" and "private vice" regarding bodily harm.** The entire system collapses if you cannot distinguish boxing from S&M on grounds other than medical injury. The law *presupposes* that some harms are valuable and others are not. This is not a philosophical conclusion derived from first principles; it is a cultural premise. Without this, (2) is incoherent.

  **2. The Comfortable Fit:**
  Piece (3) (FGM vs. Male Circumcision) fits comfortably with the "social purpose" theory, but it reveals a tension. It presupposes that the state is the arbiter of which religious/cultural practices are "compatible with British values." This isn't logically necessary for the rest of the system, but it fits the pattern of the state deciding which bodily modifications are "civilised."

  **3. The Underdetermined Layer (Piece 4):**
  This is where your suspicion holds the most weight. The criminalisation of possession is philosophically underdetermined.
  *   *Test against Devlin:* A Devlinian would say society has a right to protect itself from the erosion of morality. Possession of violent porn erodes moral fibre. This fits.
  *   *Test against Harm:* A harm theorist would argue these images normalize violence, leading to real acts. This is speculative but possible.
  *   *Test against Administrative Convenience:* This is the strongest rival. Prosecuting the S&M act (Piece 2) is hard. You need witnesses, medical evidence, and you rely on participants not complaining. Prosecuting the *image* of the act is easy. You seize the hard drive.

  **Which one is doing the real work?**
  I believe it is **Administrative Convenience disguised as Moral Protection.**
  Here is why: If the goal were truly to stop the *corruption* of the viewer (Moralism), the law would likely focus on *distribution* or *publication*, which spreads the corruption. Focusing on *possession* suggests the goal is to catch the individual who is likely engaging in the underlying conduct (Piece 2) but cannot be proven to have done so. It is a **proxy offense**.
  However, admitting this would undermine the Hart/Devlin frame. Hart argued law shouldn't enforce morality. Devlin argued it should. If (4) is just a policing tactic to get around the difficulty of proving (2), then the Hart/Devlin debate is a distraction. The real issue isn't "what is the law's moral business?" but "what can the police practically prove?" The "moral" justification for (4) is a rationalisation laid over an enforcement gap. It allows the state to maintain the prohibition on S&M (Piece 2) without having to win the difficult evidentiary battles that Piece 2 requires.

  ### (c) Counterfactuals and Verdict

  Let's run the pattern through the three philosophical filters.

  **(i) Strict Millian Harm Principle:**
  *   **(1) Homosexuality:** Remains lawful (no harm).
  *   **(2) S&M:** Would likely be decriminalised. If adults consent, the harm is to themselves, which is outside the law's remit. The "public good" exception for boxing would be hard to justify unless framed as a public spectacle with consenting viewers.
  *   **(3) Circumcision:** Male infant circumcision would be criminalised (harm to non-consenting other). FGM remains criminal. The asymmetry vanishes; both are harms to infants.
  *   **(4) Images:** Decriminalised. Possession causes no harm to others.
  *   *Result:* The system becomes radically permissive regarding bodies, restrictive regarding children.

  **(ii) Devlin's Enforcement of Positive Morality:**
  *   **(1) Homosexuality:** Would likely be criminalised, assuming the "reasonable man" finds it abhorrent. The privacy exception is a concession Devlin might grant only if the immorality doesn't "disintegrate society," but a strict Devlinian sees private vice as public rot.
  *   **(2) S&M:** Remains criminal (immoral).
  *   **(3) Circumcision:** Depends on the morality. If the shared morality accepts male circ but rejects FGM, the law stays as is.
  *   **(4) Images:** Remains criminal (immoral).
  *   *Result:* The system becomes consistently restrictive, but loses the liberal shield of privacy in (1).

  **(iii) Feinberg-style Offence Principle:**
  *   *The Mismatch:* Feinberg allows preventing serious offence to *unwilling observers*. Piece (4) is private possession. There are no observers.
  *   *Handling the Mismatch:* To make (4) fit Feinberg, you would have to argue that possession creates a *risk* of the images becoming public (leakage, hacking, showing to others), thereby creating potential offence. Without that risk argument, (4) collapses under Feinberg.
  *   **(1) Homosexuality:** Remains lawful (private, no offence).
  *   **(2) S&M:** Remains lawful (private, no offence).
  *   **(3) Circumcision:** FGM remains criminal (offence to societal sensibilities regarding gender equality?). Male circ is trickier; Feinberg is wary of offence claims that are just disguised moralism.
  *   *Result:* (4) is the casualty. The Offence Principle cannot reach into the private mind or private storage without a public vector.

  **Is there a single view under which the current combination is *right*?**
  There is one view, though it is rarely articulated in court: **Expressive Paternalism.**
  This view holds that the law's job is to *educate* citizens on how to value their own humanity.
  *   (1) is right because sexual orientation is intrinsic to identity and shouldn't be stigmatised.
  *   (2) is right because we should not value pleasure derived from degradation.
  *   (3) is right because we must protect the equality of women while tolerating minority religious integration for men (a messy compromise).
  *   (4) is right because we must not cultivate a taste for violence.
  Under this view, the inconsistencies are not bugs; they are **nuanced adjustments** to different social goods. However, I am skeptical. The case law does not speak this language. The judges speak of "public policy" and "consent" in ways that contradict each other.

  **Verdict:** It is historically layered inconsistency rationalised after the fact.
  (1) is a liberal victory from the 1960s.
  (2) is a conservative rearguard action from the 1990s protecting "bodily integrity."
  (3) is a human rights compliance measure from the 2000s.
  (4) is a policing tool from the late 2000s.
  They are glued together with the language of "harm" and "consent," but the definitions of those words shift to suit the outcome.

  ### The Load-Bearing Commitment

  The one commitment that holds this entire precarious structure up is this:

  **Consent is not a factual state of mind, but a normative status granted by the state.**

  If you change this—if you decide that consent is simply a matter of individual autonomy and capacity—the whole pattern dissolves.
  *   If consent is autonomous, (2) falls (adults can choose S&M).
  *   If consent is autonomous, (3) becomes impossible to justify asymmetrically (both are non-consensual cuts, or both are cultural).
  *   If consent is autonomous, (4) becomes indefensible (private choice).
  *   Only (1) survives.

  The system works only because the law assumes it has the authority to decide *when* your consent counts. It counts when you do what the state recognises (sex, sport, surgery). It does not count when you do what the state rejects (violence, degradation). That authority—the power to validate or void your will—is the load-bearing beam. Remove it, and you are left with either total libertarianism or total moralism; the current middle path vanishes.
