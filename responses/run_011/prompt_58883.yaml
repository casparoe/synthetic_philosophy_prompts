answer: |-
  **Brainstorm: Where the Debate Bleeds**

  The pluralist position (co-locationism) is elegant but metabolically expensive. The real pain isn't the counterintuitiveness—philosophers expect that—it's the *Grounding Problem*. If the statue and clay share every particle and intrinsic property at $t$, what *makes* it true that one survives squashing and the other doesn't? Any answer risks either magic (brute modal facts) or circularity (it survives because it's a statue, it's a statue because it survives). The Arbitrariness Objection is the second wound: if distinctness is cheap, why not infinite objects here? Pluralists often bite the bullet, but that erodes trust in counting. The "Verbal Dispute" charge is noise unless pressed on truthmakers; if both sides agree on the physics and the language, what's left? The ice case you've built is lethal for her if she isn't careful. If the artwork survives total molecular replacement but not melting, she needs a principled difference between *sublimation* and *melting* that isn't just "the artist said so." If she says "artwork" isn't a genuine sortal, her view collapses into the rival's monism. She must defend the reality of the artwork's persistence conditions without appealing to magic.

  ***

  **Interview Questions**

  **1. The Grounding Objection**
  *Setup:* I need to establish that your view isn't just saying the same thing twice.
  *Question:* You say the statue and the clay are distinct yet share every atom and qualitative property right now. What *makes* it true that one survives flattening and the other doesn't, given there is no physical difference between them at this instant?
  *   (i) **Likely Answer:** "Their modal properties are grounded in their sortal kinds, not just their matter."
  *   (ii) **Follow-up:** "But what grounds the kind membership if not the physical history? Are you positing brute modal facts?"
  *   (iii) **Cheap Version:** "How can two things be in the same place?" (Lets her say "constitution isn't identity" and move on.)

  **2. The Arbitrariness Objection**
  *Question:* If distinctness is licensed by different persistence conditions, why stop at two? Why isn't there also a 'statue-plus' that survives being flattened but not melted, and a 'statue-minus' that perishes if a single atom is lost?
  *   (i) **Likely Answer:** "We only count objects where there are genuine sortals carved by our conceptual practices."
  *   (ii) **Follow-up:** "So the ontology of the universe depends on human conceptual carving? That sounds like idealism."
  *   (iii) **Cheap Version:** "Why aren't there infinite objects here?" (Lets her say "That's absurd" without explaining why her view avoids it.)

  **3. The Four-Dimensionalist Deflation**
  *Question:* A four-dimensionalist says you're both right because you're tracking different temporal parts of the same spacetime worm. What work is your three-dimensional pluralism doing that their single worm isn't doing better?
  *   (i) **Likely Answer:** "Objects persist *through* time, they aren't extended *across* it; my view respects the phenomenology of change."
  *   (ii) **Follow-up:** "Does respecting phenomenology justify multiplying entities beyond physical necessity?"
  *   (iii) **Cheap Version:** "Why don't you just accept four-dimensionalism?" (Lets her say "I don't like time-slices" without addressing the theoretical cost.)

  **4. Modal Intuitions vs. Language**
  *Question:* How much weight does your view rest on intuitions about squashing and melting? If I say those intuitions track how we *talk* rather than what *exists*, does your ontology collapse?
  *   (i) **Likely Answer:** "Modal intuitions reveal real essences, not just linguistic conventions."
  *   (ii) **Follow-up:** "Can you give me a case where the intuition and the language come apart, to prove you're tracking reality?"
  *   (iii) **Cheap Version:** "Isn't this just about how we use words?" (Lets her say "No, it's metaphysics" without proving it.)

  **5. The Dominant Kind Escape**
  *Question:* Some say only the dominant kind exists—the clay is absorbed into the statue, so there's only one object. Is that a genuine alternative to your view, or just a rebranding of monism?
  *   (i) **Likely Answer:** "It's a rebranding that fails to explain why the matter persists when the statue is destroyed."
  *   (ii) **Follow-up:** "If the matter persists, isn't it an object in its own right? Why deny it existence?"
  *   (iii) **Cheap Version:** "Why not just say the statue is the main object?" (Lets her dismiss rivals without engaging their ontology.)

  **6. Sortal-Relative Identity**
  *Question:* If identity is relative to a sortal—the same *clay* but not the same *statue*—does that collapse back into ordinary identity once you press on what 'same' means?
  *   (i) **Likely Answer:** "No, because counting yields different results depending on the sortal used."
  *   (ii) **Follow-up:** "Then are there two things or one thing described twice? You need to pick a side for the count."
  *   (iii) **Cheap Version:** "Is identity relative?" (Lets her give a lecture on Geach without answering the counting problem.)

  **7. Easy Ontology / Verbal Dispute**
  *Question:* If the monist and you agree on all the physics and all the truth conditions of sentences, is the dispute merely verbal? What would settle it, if anything could?
  *   (i) **Likely Answer:** "We disagree on the truthmakers for those sentences, not the sentences themselves."
  *   (ii) **Follow-up:** "Can you point to the truthmaker without pointing to the physical matter you both agree on?"
  *   (iii) **Cheap Version:** "Is this just a verbal dispute?" (Lets her say "No, it's substantive" without defining substantiveness.)

  **8. The Ice Case: Counting**
  *Setup:* In my book, a glacier-ice sculpture sublimates and is replenished with drip-water until no original molecules remain.
  *Question:* On the morning the freezer fails, before the melt, how many objects are in the vitrine: one artwork and one ice mass, or something else?
  *   (i) **Likely Answer:** "Two: the artwork and the constituting ice mass."
  *   (ii) **Follow-up:** "If the ice mass is replaced molecule-by-molecule, does the *ice mass* object persist, or does it cease and a new one begin?"
  *   (iii) **Cheap Version:** "How many things are in the box?" (Lets her say "It depends on how you count" without committing to ontology.)

  **9. The Ice Case: Persistence Conditions**
  *Question:* When the freezer fails and the figure melts into a puddle, then is refrozen into the same shape, does the *artwork* survive?
  *   (i) **Likely Answer:** "No, the artwork perishes when the ice melts, even if the water persists."
  *   (ii) **Follow-up:** "Then the artwork has stricter persistence conditions than the ice. What grounds that difference if not the artist's intent?"
  *   (iii) **Cheap Version:** "Is it the same sculpture after melting?" (Lets her say "No" without explaining why the distinctness matters for the ontology.)

  **10. The Ice Case: Sortal Status**
  *Question:* Is "artwork" a genuine sortal that carries metaphysical weight, or is it a phase sortal like 'puddle' that doesn't support distinctness?
  *   (i) **Likely Answer:** "It's a genuine sortal because it dictates specific persistence conditions tied to aesthetic identity."
  *   (ii) **Follow-up:** "If the conservator changes the replenishment method, does the sortal change, and thus the object?"
  *   (iii) **Cheap Version:** "Is art real?" (Lets her give a platitude about culture rather than metaphysics.)

  **11. The Candy Case: Certificate vs. Object**
  *Question:* Consider a candy pile artwork where the audience eats it and it's replenished per a certificate. During a run of the show, how many objects are in the gallery?
  *   (i) **Likely Answer:** "One artwork, constituted by many successive candy masses."
  *   (ii) **Follow-up:** "Does the certificate create the object, or just describe it? If the certificate is lost, does the object cease?"
  *   (iii) **Cheap Version:** "Is the candy the art?" (Lets her say "It's complex" without counting.)

  **12. The Embarrassing Consequence**
  *Question:* What is the most embarrassing consequence of your view that you still tell your graduate students to accept?
  *   (i) **Likely Answer:** "That there are thousands of co-located objects wherever there is one, which strains credulity."
  *   (ii) **Follow-up:** "If it strains credulity, why isn't that a reductio?"
  *   (iii) **Cheap Version:** "What's the worst part of your theory?" (Lets her say "It's unpopular" rather than "It implies ontological proliferation.")

  ***

  **Single Sentence Candidate:**
  I recommend using the answer to **Question 8 (The Ice Case: Counting)** for the single-sentence soundbite.
  *Target Answer:* "There are two objects: the artwork and the ice mass, occupying the same space but with different futures."
  *Why:* It is clear, dramatic, and encapsulates the core conflict of your novel's plot without requiring technical jargon.
