prompt: |-
  Act as a professional metaphysician — specifically someone who works on material constitution, not someone summarizing an encyclopedia entry. Think carefully before you answer: start with about 200 words of brainstorm about where this debate genuinely hurts, i.e. which objections actually bite and which are just noise, and then give me the questions. Dont show me the brainstorm if you'd rather not, but do the work first.

  Situation: I write literary fiction. My next novel has as a main character a philosopher who defends the view that the statue and the lump of clay are two numerically distinct objects in the same place at the same time — pluralism / co-location, not the "one object but constitution isn't identity" line, and definitely not four-dimensionalism. Before I write her dialogue im interviewing a real philosopher who holds roughly that view. Eighty minutes, recorded, an audience that's bookish but has never taken a metaphysics course.

  What I want: ten to twelve interview questions, in the order I'd actually ask them, plus follow-ups. Rules:

  - Nothing generic. No "what first drew you to this?", no "how do you respond to your critics?" — every question has to turn on the content of her position.
  - For each one give me (i) her most likely answer in a line, (ii) a follow-up keyed to that answer, and (iii) the cheap version of the question — the one that sounds pointed but lets her escape with a slogan — so I don't accidentally ask it.
  - Flag which questions need setting up for non-specialists, with one sentence of setup each that I can read out.

  Coverage — at least one question on each of these, and they should build on each other rather than being a list of unrelated grievances:

  - the arbitrariness objection: if the lump and the statue are distinct, why stop at two? What licenses the plurality being exactly the size it is?
  - the grounding objection: what makes it true right now that the statue couldn't survive being flattened while the lump could, given they share all their matter and every qualitative property at this moment? I want the question to force her to say where that difference lives, not just to assert it.
  - the four-dimensionalist deflation: same spacetime worm, different modal descriptions, no coincidence at all — what is actually left of her view once somebody says that?
  - how much weight the whole picture rests on modal intuitions about squashing and melting, and what she says to the person who thinks those intuitions track how we talk rather than what there is.
  - the dominant-kind escape (only one of the co-located things really exists, because one sortal dominates): is that a genuine alternative to pluralism or a rebranding of it?
  - sortal-relative identity as the rival, and whether it collapses back into ordinary identity once you press it.
  - the easy-ontology charge that the whole dispute is verbal. Here I want her to say what would settle it, if anything could.

  Then the part I need most, because my character doesn't live in the textbook example. In the book there's an artwork: a life-size standing figure cast in glacier ice, kept in a freezer vitrine; it sublimes constantly and the conservator keeps dripping meltwater back onto it so it re-freezes, which means that after about six weeks not one of the original water molecules is left. Midway through the book the freezer fails, the figure melts into a puddle in the base of the case, and a different conservator later freezes the puddle back into the same shape. There's a restitution hearing about whether what was destroyed is the same thing now standing in the vitrine. Her view — that the artwork and the ice mass are distinct objects — is supposed to be the argument that saves the museum, and a rival character argues that there was only ever the ice mass, so nothing was destroyed at all, just rearranged. Give me at least three questions that push her through that case and only that case: how many objects were in the vitrine on the morning the freezer failed; whether the artwork's persistence conditions get set by the artist's act, by the sortal, or by the conservator's ongoing intervention; whether gradual replacement and total-replacement-plus-refreezing really come out differently on her view, and if so what is doing the work; and whether "artwork" is even a kind that can carry the weight she needs from it, or a phase sortal, or not a sortal at all. If you think the case is simply bad for her and she should bite the bullet, build that into a question instead of sparing her.

  Real-world anchor you're welcome to use: those candy-pile pieces where the audience is invited to eat the work down and the institution replenishes it, with a certificate spelling out the parameters for reinstalling and re-manifesting the piece. Ask her how many objects are in the gallery during a run of the show, and whether the certificate changes the answer.

  Finally: one question that forces her to name the most embarrassing consequence of her own view, and one she could answer in a single sentence that I could plausibly put in a character's mouth — tell me which you think that second one is. A question that's a trap is fine, encouraged even, as long as you tell me what the trap is and what she'd have to concede to get out of it.

  No bibliography, no citations, no reading list — I can't chase papers and you'd probably get the details wrong anyway. Names of positions and of the standard objections are fine and welcome. And don't hedge every question into mush; I can soften them live if I need to.
