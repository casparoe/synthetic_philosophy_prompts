prompt: |-
  I'm a TA for a second-year module that's roughly "games, information and disagreement" — a mix of econ and philosophy students, 24 of them — and I've got my own 75-minute seminar slot in week 6. They've had one lecture on conditionalisation and they've had Aumann's agreement theorem stated at them, but in the last tutorial they basically treated it as a bit of formal trickery: nobody really believes that two people who've pooled everything have to end up agreeing, and one of them said something like "surely you can just have different starting points and that's that." Which is... actually the whole question, and the lecturer has asked me to make them feel that the common prior assumption is doing real work rather than being bookkeeping. I don't want to lecture at them or write the theorem on the board a third time. I want them to run into it.

  So design me an in-class game that does this. My rough idea — improve on it or bin it — is two rounds. Round one, their priors genuinely are common because they come from a public device we all watch together (a bag, a dice roll, whatever you pick), they get private signals, and then they have to post their posteriors and try to make bets with each other; I want them to discover that a bet each of them was privately sure was favourable keeps collapsing the moment it gets announced. Round two, they arrive with genuinely different starting points, implemented not as a stipulation from me but as different learning histories — each subgroup was raised on a differently biased sample of past cases, and they know which subgroup they're in — and now bets go through and they happily agree to disagree. The debrief I actually care about is the bit afterwards, where someone asks whether round two can be redescribed as a common prior plus the extra evidence "which subgroup you're in", and if it can, whether the assumption is restrictive at all or just unfalsifiable, and if it can't, what the difference is supposed to consist in. Don't hand me a resolution of that — I want the questions staged so the class has to sit in it for a while.

  I need it to be actually runnable: rules I could print and hand out, materials that cost basically nothing (we have a whiteboard, phones and a printer), a scoring scheme that isn't real money — small participation marks or something equally cheap is fine — and a minute-by-minute timeline that fits 75 minutes with 24 people in whatever group structure you want. Also tell me what will predictably break the first time I run it. My suspicions: they'll botch the arithmatic on the posteriors, someone will treat posting their posterior as a competition and bluff, and risk aversion will kill bets that should have gone through even in the common-prior round, which would wreck the contrast I'm trying to set up. Tell me how to design around each of those, or tell me I'm wrong that they matter. And be straight with me about which part of the idea the game just can't reproduce — I already know the awkward one, which is that in my activity the common prior is something I manufacture in front of them while in real life nobody knows whether there is one, so I'd like you to say how much of that gap I can close inside the debrief and how much I just have to admit out loud at the end.
reasoning: |-
  Here's a thinking process that leads to the suggested seminar plan:

  1.  **Analyze the Request:**
      *   **Role:** TA for a 2nd-year module ("Games, Information and Disagreement").
      *   **Audience:** 24 students (mix of Econ and Philosophy).
      *   **Context:** Week 6. They've had one lecture on conditionalization and Aumann's Agreement Theorem (AAT). They think AAT is "formal trickery" and don't buy the Common Prior Assumption (CPA).
      *   **Goal:** Make them *feel* that CPA does real work, not just bookkeeping. Avoid lecturing/writing the theorem again. Let them "run into it."
      *   **Proposed Structure:** Two rounds.
          *   Round 1: Common Prior (public device), private signals, betting. Bets should collapse upon announcement.
          *   Round 2: Different Priors (different learning histories/subgroups), betting. Bets should stick (agree to disagree).
          *   Debrief: Focus on whether Round 2 can be redescribed as Common Prior + "subgroup evidence." Leave the question open/unresolved but staged.
      *   **Constraints:** 75 minutes, 24 students, low cost (whiteboard, phones, printer), non-monetary scoring (participation marks).
      *   **Specific Concerns:** Arithmetic errors, bluffing/competition, risk aversion killing bets.
      *   **Honesty Check:** Admit what the game *can't* reproduce (the metaphysical status of priors in real life).

  2.  **Evaluate the User's Idea:**
      *   *Strengths:* The core intuition is spot on. AAT relies on Common Priors + Common Knowledge of Posteriors. If priors differ, disagreement is rational. If priors are common, disagreement implies a betting opportunity that shouldn't exist (no trade theorem).
      *   *Weaknesses:*
          *   "Betting" is tricky with students. Risk aversion is real. If they don't bet, the lesson fails.
          *   Arithmetic: Calculating posteriors manually slows things down and introduces noise.
          *   Bluffing: If they lie about posteriors, the "common knowledge" condition breaks.
          *   Round 2 Implementation: How to *actually* give them different priors without just saying "you have different priors"? The "learning history" idea is good but needs to be concrete.
          *   Time: 75 minutes is tight for two full rounds + debrief with 24 people.

  3.  **Refining the Game Design:**

      *   **The Core Mechanism:** Needs to be simple enough to calculate mentally or on a phone, but complex enough to show disagreement.
      *   **The State of the World:** Binary is best (e.g., Bag is Red or Blue).
      *   **The Signals:** Private draws.
      *   **The Priors:**
          *   Round 1: Everyone sees the bag setup (50/50).
          *   Round 2: Subgroups see *different* bag setups (e.g., Group A thinks it's 90/10, Group B thinks it's 10/90) *before* getting signals.
      *   **The "Bet":** Needs to be zero-sum but low stakes to mitigate risk aversion. Or, better yet, a "Market Maker" mechanism where the TA takes the other side, or a simple "Match" system. Actually, the AAT implication is that *they* shouldn't bet *each other*. So the task should be: "Find someone who disagrees with you and bet." If they can't find anyone, they win points. If they bet and lose, they lose points.
      *   **Wait, the AAT logic:** If we have common priors and common knowledge of posteriors, we *must* agree. So if I announce my posterior, you should update to match mine. If we still differ, we should bet. But if we bet, we realize we shouldn't have.
      *   *Correction:* The standard pedagogical trick for AAT is the "No Trade Theorem." If we have common priors, we shouldn't bet. If we bet, it reveals we *don't* have common priors (or aren't rational).
      *   *Revised Plan:*
          *   **Round 1 (Common Prior):** Public setup. Private signals. Announce posteriors. *Task:* Try to find a betting partner. *Outcome:* Once posteriors are announced, they should converge. If they converge, no bet happens. If they bet, one loses expected value.
          *   **Round 2 (Different Priors):** Private setup (subgroups). Private signals. Announce posteriors. *Task:* Try to find a betting partner. *Outcome:* Posteriors stay different. Bets happen. Both think they have positive EV.

      *   **Addressing Concerns:**
          *   *Arithmetic:* Use a lookup table or a simple app/website? No, keep it analog for transparency. Use very simple numbers (e.g., Likelihood ratio 2:1). Or provide a "Posterior Calculator" slip. Let's provide a slip.
          *   *Bluffing:* Make the announcement public and verified by the TA or a simple rule. Actually, if they bluff, the experiment breaks. Make it a "Trust but Verify" round where they show their signal card to the partner *after* the bet is proposed but before finalizing? No, that reveals the signal, not the posterior.
          *   *Better approach for Bluffing:* The "Bet" isn't against each other, it's against the "House" (TA) based on their confidence. No, that doesn't test agreement.
          *   *Best approach:* Pair them up. They state posteriors. If they differ, they *must* propose a bet. If they agree, no bet. The payoff is based on accuracy, not the bet itself. Wait, if the payoff is accuracy, they want the truth.
          *   *Let's simplify:* The goal is to see if posteriors converge.
          *   *Round 1:* Public Prior. Private Signal. State Posterior. Discuss. State New Posterior. Did it change?
          *   *Round 2:* Private Prior. Private Signal. State Posterior. Discuss. State New Posterior. Did it change?
          *   *Betting:* Add a small stake to make it real. "I bet 1 point the state is Red."

      *   **Addressing Risk Aversion:** Use "Module Points" (participation marks). Make the bet optional but high reward. Or, make the *failure* to agree in Round 1 costly.
      *   **Addressing Arithmetic:** Provide a Bayesian Update Table. $P(H|E) = \frac{P(E|H)P(H)}{P(E)}$. Pre-calculate the values for specific signal combinations.
      *   **Addressing the "Different Priors" implementation:** In Round 2, give Group A a handout saying "Historical data suggests Red is 80% likely." Give Group B "Historical data suggests Blue is 80% likely." This is the "learning history."

  4.  **Drafting the Timeline (75 mins):**
      *   0-5: Intro & Rules.
      *   5-20: Round 1 (Common Prior). Setup, Signal, Announcement, Convergence attempt.
      *   20-35: Round 2 (Different Priors). Setup (subgroups), Signal, Announcement, Persistence of disagreement.
      *   35-75: Debrief (The meat of the session).

      *Wait, 40 mins for debrief is good.* The user wants to sit in the discomfort.
      *   *Refinement on Round 1:* To make the "bet collapse" visible, they need to *try* to bet.
      *   *Mechanism:* "Betting Slip." I think X is true with prob P. You think X is true with prob Q. If $|P-Q| > 0.1$, you *must* fill out a bet slip.
      *   *Problem:* If they calculate correctly in Round 1, $P$ should equal $Q$ after talking. So no bet slip.
      *   *Problem:* If they calculate correctly in Round 2, $P$ might not equal $Q$. Bet slip filled.
      *   *Risk:* If they are bad at math, Round 1 looks like Round 2 (disagreement due to error).
      *   *Fix:* Provide the Posterior Calculator. It removes arithmetic error as an excuse.

  5.  **Addressing the "Bluffing/Competition" Concern:**
      *   If they treat it as a game to "win" the bet, they might lie about their posterior to lure someone in.
      *   *Counter:* They have to write down their *actual* posterior on a private sheet first, handed to the TA. Then they announce. If the announced one differs from the private one, they get penalized. This enforces honesty.
      *   *Counter to Risk Aversion:* The bet is not for money. It's for "Epistemic Merit Points." Winning a bet where you were right gives points. Losing takes points. *Not* betting when you could have (Round 2) gives points. Betting when you shouldn't (Round 1) loses points.
      *   *Actually, keep it simpler:* The "Bet" is a prediction market. If you agree, the market price stabilizes. If you disagree, trade happens.
      *   *Decision:* Let's stick to the User's "Bet" idea but gamify the *incentive to agree*.
      *   *Incentive:* In Round 1, if you end up with different posteriors after discussion, *both* lose points (penalty for failure to commonize). In Round 2, if you end up with different posteriors, *both* keep points (rational disagreement).
      *   *Wait, that tells them the answer.*
      *   *Better:* Just let them bet. In Round 1, the bets should feel "wrong" or cancel out. In Round 2, the bets feel "right."
      *   *Actually, the strongest demo:* In Round 1, make the bet *against the TA*. "If you think Prob > 50%, bet Red." If they have common priors and signals, they should all pick the same side. If they pick different sides, they know something is wrong.
      *   *No, the User wants them to bet EACH OTHER.* "I'll bet you it's Red." "Okay." "Wait, if you think it's Red, and I think it's Red, why are we betting?" "Because I think it's 90% and you think it's 60%." "But if we have common priors, why do we differ?"
      *   *Okay, the plan:*
          1.  Calculate Posterior privately.
          2.  Find a partner.
          3.  Reveal Posteriors.
          4.  If they differ, propose a bet.
          5.  Execute bet (simulated).
          6.  Reveal Truth.
          7.  Score.

      *   *Crucial Fix for Arithmetic:* Use a "Signal Card" system.
          *   State: Red or Blue Bag.
          *   Signal: Draw a ball.
          *   Round 1: Bag is 50/50. Red Ball implies 60% Red. Blue Ball implies 40% Red. (Simple numbers).
          *   Round 2: Group A thinks Bag is 80/20. Group B thinks Bag is 20/80.
          *   Provide a cheat sheet: "If you are Group A and see Red, your posterior is X."

  6.  **Addressing the "Metaphysical Gap":**
      *   The user asks: "Tell me... how much of that gap I can close inside the debrief and how much I just have to admit out loud at the end."
      *   *Honesty:* I need to tell them that in the game, *I* (the TA) am God. I know the priors are common in Round 1 because I set them. In real life, we don't have a God to check. The CPA is a modeling assumption, not an empirical fact. The game shows the *consequences* of the assumption, not its truth.

  7.  **Finalizing the Plan Details:**
      *   **Materials:** Printed "Prior Cards" (Round 1: Common, Round 2: Split), "Signal Cards" (envelopes), "Posterior Calculator" (lookup table), "Bet Slips", Scoreboard (Whiteboard).
      *   **Groups:** 12 pairs.
      *   **Timeline:**
          *   0-10: Setup & Round 1 Briefing.
          *   10-30: Round 1 Play (Common Prior).
          *   30-50: Round 2 Play (Different Priors).
          *   50-75: Debrief (The crucial part).
      *   **Risk Aversion Fix:** The "Bet" is for participation points. 1 point for correct prediction. 0 for incorrect. *Bonus:* If you bet someone in Round 2 and win, +1. If you bet someone in Round 1, -1 (because you shouldn't have been able to). *Wait, telling them the scoring rule tells them the lesson.*
      *   *Better:* Neutral scoring. 1 point for correct prediction. The *observation* is whether bets happen. The TA tracks the number of bets on the board. Round 1: 0 bets (ideally). Round 2: Many bets.
      *   *Wait, if they are rational in Round 1, they won't bet.* So the lack of bets is the success.
      *   *What if they bet anyway?* Then they lose points on accuracy.
      *   *Okay, let's make the betting mandatory if posteriors differ.* "If your posteriors differ by >10%, you MUST bet." This forces the issue.
      *   *Round 1:* If they did the math right, posteriors won't differ. No bet.
      *   *Round 2:* Posteriors differ. Bet happens.
      *   *Risk:* Arithmetic errors in Round 1 cause bets.
      *   *Mitigation:* The "Posterior Calculator" is mandatory. They don't calculate; they look up. "I am Group A, I saw Red. My posterior is 75%." No math allowed.

  8.  **Predictable Breakages:**
      *   *Math:* Solved by Lookup Table.
      *   *Bluffing:* Solved by "Audit Rule" (TA can ask to see your Prior Card/Signal Card at random; if you lied, you lose all points).
      *   *Risk Aversion:* Solved by making the bet "Play Money" that converts to Participation Marks. The stakes are low enough that "being right" matters more than "losing a point."
      *   *Time:* 24 students is a lot for pairing. Need strict timing. Use a whistle/bell.

  9.  **Debrief Structure:**
      *   Phase 1: What happened? (Data on bets).
      *   Phase 2: Why? (Priors).
      *   Phase 3: The Trap. (Can Round 2 be modeled as Common Prior + "I am in Group A" signal?)
      *   Phase 4: The Real World. (Do we have common priors? Does it matter?)

  10. **Refining the "Different Priors" implementation:**
      *   It's not enough to say "You have different priors." They need to feel it's legitimate.
      *   Story: "Round 1: We all saw the bag being filled." (Common).
      *   Story: "Round 2: You were separated into two rooms (subgroups) and shown different historical data about the bag before entering." (Different).
      *   This makes the prior difference *evidence-based*, which triggers the "Can't we just add that to the common prior?" question. Perfect.

  11. **Final Review against constraints:**
      *   75 mins? Tight but doable with strict timing.
      *   24 students? 12 pairs works.
      *   No lecture? Yes, facilitation only.
      *   Address concerns? Yes (Lookup tables, Audit rule, Debrief focus).
      *   Honesty about limitations? Yes, included in the "TA Note" section.

  12. **Writing the Response:**
      *   Tone: Professional, collegial, direct (as requested).
      *   Structure: Game Overview, Materials, Minute-by-Minute, Risk Mitigation, Debrief Guide, The "Gap" Honesty.

      *(Self-Correction during drafting)*: Make sure the Lookup Table is Bayesianly consistent.
      *   Round 1: Prior 0.5. Likelihood Ratio 2:1.
          *   Signal Red: Post = 2/3 (66.7%).
          *   Signal Blue: Post = 1/3 (33.3%).
          *   If Pair gets (Red, Red) -> Both 66%. Agree.
          *   If Pair gets (Red, Blue) -> 66% vs 33%. Disagree.
          *   *Wait.* If they talk in Round 1, they pool signals.
          *   If they pool signals: (Red, Blue) -> Prior 0.5, Signals cancel. Posterior 0.5. They *should* agree at 0.5.
          *   So the instruction must be: "Announce your posterior based on *your* signal. Then discuss. Then announce again."
          *   If they are rational Aumann agents, after announcing "I have 66%", the other person (who has 33%) infers "Ah, they saw Red." They update. Both end at 50%. Agreement reached. No bet.
          *   Round 2: Priors differ.
          *   Group A Prior: 0.8. Group B Prior: 0.2.
          *   Signal Red (LR 2:1).
          *   Group A Post: High. Group B Post: Low (maybe 0.5).
          *   They announce. Group A knows Group B saw Red (inferred from posterior). Group A updates. Group B updates.
          *   *Crucial:* With different priors, even after pooling signals, they might *still* disagree.
          *   Let's check the math.
          *   A: Prior 4:1. Signal 2:1. Post 8:1 (89%).
          *   B: Prior 1:4. Signal 2:1. Post 2:4 (33%).
          *   They announce. A knows B saw Red. A incorporates B's signal?
          *   If they treat B's signal as independent evidence:
          *   A: Prior 4:1. Signal A (2:1). Signal B (2:1). Total 16:1 (94%).
          *   B: Prior 1:4. Signal A (2:1). Signal B (2:1). Total 4:4 (50%).
          *   They still disagree (94% vs 50%). Bet happens.
          *   This works.

      *   *Wait, one nuance:* In Round 1, if they get the same signal (Red, Red), they agree immediately. If they get different (Red, Blue), they disagree initially, but converge after talking.
      *   *Instruction:* "Phase 1: Calculate private posterior. Phase 2: Announce to partner. Phase 3: Update based on partner's announcement. Phase 4: Bet?"
      *   This highlights the "Agreement Theorem" part (common knowledge of posteriors leads to agreement).

      *   *Materials:* Need to be very clear.
      *   *Risk:* Students might not update in Phase 3. They might just stick to Phase 1.
      *   *Fix:* The "Audit" checks the *Final* Posterior. If it doesn't reflect the partner's info (in Round 1), they lose points. This forces them to actually do the Aumann update.

      *   *Wait, if they update correctly in Round 1, they agree. So no bet.*
      *   *If they update correctly in Round 2, they disagree. So bet.*
      *   *This is the perfect contrast.*

      *   *One more thing:* The User said "Round one... they have to post their posteriors and try to make bets... I want them to discover that a bet... keeps collapsing."
      *   So, allow the bet *attempt*. Let them write the bet slip. Then realize "Wait, we agree now." Cancel the bet.
      *   This makes the "collapse" visible.

      *   *Okay, ready to write.*
answer: |-
  This is a strong pedagogical instinct. You are right to avoid re-deriving the theorem; Aumann's Agreement Theorem (AAT) is best understood as a *constraint on rational behaviour* rather than a mathematical curiosity. If they treat it as trickery, it's because they haven't felt the friction of the Common Prior Assumption (CPA) against their intuition.

  Your two-round structure is the correct approach. However, to make it runnable in 75 minutes with 24 students, we need to remove arithmetic friction, enforce honesty without policing, and ensure the "bet collapse" in Round 1 is visceral.

  Here is the design.

  ### Game Title: "The Market for Certainty"

  **Core Mechanic:** Students act as traders. They receive private information about a binary state of the world (Red or Blue). They must price their confidence (Posterior Probability). If they disagree with a partner, they are *mandated* to propose a bet.
  **The Twist:** Round 1 enforces Common Priors (bets collapse). Round 2 enforces Different Priors via "Learning History" (bets stick).

  ---

  ### 1. Materials & Prep (Cost: ~£5 for printing)

  You need to print four types of slips.
  1.  **Identity Cards (24 total):**
      *   12 say: **"OBSERVER: You watched the bag being filled. It is 50/50."** (Round 1)
      *   12 say: **"HISTORIAN A: Your data says the bag is 80% Red."** (Round 2, Group A)
      *   12 say: **"HISTORIAN B: Your data says the bag is 80% Blue."** (Round 2, Group B)
  2.  **Signal Envelopes (24 per round):** Inside is a card saying **"SIGNAL: RED"** or **"SIGNAL: BLUE"**.
      *   *Distribution:* Ensure pairs don't always get matching signals. Mix them.
  3.  **Posterior Lookup Table (Handout for everyone):**
      *   Do not let them calculate Bayes' rule. It wastes time and introduces error.
      *   *Table:* "If your Prior is X and your Signal is Y, your Posterior is Z."
      *   *Example:* Prior 50% + Red Signal → 67%. Prior 80% + Red Signal → 94%. (Pre-calculate these for them).
  4.  **Bet Slips:** Simple form: *"I bet State is RED at probability __ vs your probability __."*
  5.  **Whiteboard:** To track the "Market Volume" (number of bets placed).

  ---

  ### 2. Minute-by-Minute Timeline (75 Minutes)

  **00:00 – 00:10: Setup & Rules**
  *   Hand out **Identity Cards (Round 1)** and **Signal Envelopes (Round 1)**.
  *   **Rule 1 (Honesty):** "You will be audited. If your final reported posterior doesn't match your Lookup Table given your cards, you get 0 participation points. No bluffing."
  *   **Rule 2 (The Mandate):** "Find a partner. Reveal your Posteriors. If they differ by **more than 5%**, you *must* fill out a Bet Slip. If they differ by less, you *cannot* bet."
  *   **Rule 3 (The Collapse):** "You have 2 minutes to discuss *why* you differ. You may update your posterior based on their announcement. If you update and the difference disappears, tear up the Bet Slip."

  **00:10 – 00:30: Round 1 (Common Prior)**
  *   **Task:** Students check cards, use Lookup Table, find partner, announce posteriors.
  *   **Expected Dynamic:**
      *   Pair gets (Red, Red): Both 67%. No bet.
      *   Pair gets (Red, Blue): One 67%, One 33%. Bet Slip started.
      *   **The Crash:** During the 2-minute discussion, the 33% person realizes: "You have 67%? That means you saw Red. I now know we saw one Red and one Blue. My new posterior is 50%." The 67% person thinks the same. Both converge to 50%.
      *   **Action:** They tear up the Bet Slip.
  *   **TA Role:** Walk around. If you hear a bet being finalized, interrupt: "Did you update on their announcement? Check your table."
  *   **Scoreboard:** Write "Round 1 Bets Executed: 0" (Aim for zero).

  **00:30 – 00:35: Transition**
  *   Collect Round 1 materials.
  *   Hand out **Identity Cards (Round 2)**. *Crucial:* Separate the room physically if possible. Tell Group A: "You are Historians who saw mostly Red history." Tell Group B: "You are Historians who saw mostly Blue history."
  *   Hand out **Signal Envelopes (Round 2)**.

  **00:35 – 00:55: Round 2 (Different Priors)**
  *   **Task:** Same as Round 1.
  *   **Expected Dynamic:**
      *   Group A (Prior 80%) sees Red → Posterior 94%.
      *   Group B (Prior 20%) sees Red → Posterior 50%.
      *   **Announcement:** A says 94%. B says 50%.
      *   **Discussion:** B realizes A saw Red. B updates (incorporating A's signal). But because B's prior is so low, B might only move to 70%. A moves to 98%.
      *   **Result:** They still differ by >5%.
      *   **Action:** They *must* execute the Bet Slip.
  *   **Scoreboard:** Write "Round 2 Bets Executed: 12" (or however many pairs).

  **00:55 – 01:15: The Debrief (The most important part)**
  *   Do not lecture. Ask questions. Write their answers on the board.
  *   See "Debrief Script" below.

  ---

  ### 3. Risk Mitigation (Addressing your suspicions)

  **1. "They'll botch the arithmetic."**
  *   **Fix:** The **Lookup Table**. Do not let them use phones or calculators. The table gives them the answer based on their inputs. This isolates the *epistemic* variable from the *computational* variable. If they disagree in Round 1, it's not math error; it's a failure to update on the *fact of disagreement*.

  **2. "Someone will bluff/treat it as a competition."**
  *   **Fix:** The **Audit Rule**. Tell them at the start: "I will randomly collect 3 pairs' Identity and Signal cards at the end. If your Final Posterior does not mathematically follow from those cards via the Lookup Table, you lose all participation marks." This makes honesty the dominant strategy. They aren't playing against each other; they are playing against the Audit.

  **3. "Risk aversion will kill bets."**
  *   **Fix:** Change the incentive structure. The points are not for *winning* the bet. The points are for **compliance**.
      *   "You get 1 participation point if you follow the protocol."
      *   "If you are in Round 1 and you execute a bet, you lose the point (because rational agents with common priors shouldn't bet)."
      *   "If you are in Round 2 and you *fail* to bet when posteriors differ, you lose the point (because rational agents with different priors should bet)."
      *   *Wait, this reveals the lesson.*
      *   *Better:* Keep it neutral. "Points for accuracy." In Round 1, if they bet, one of them *must* be wrong (since they agreed then bet). In Round 2, both can think they are right.
      *   *Best:* **Ignore the payoff of the bet.** The "Bet Slip" is just a record of disagreement. The "score" is simply whether the bet slip exists. The *contrast* in the number of slips on the whiteboard is the lesson. Risk aversion doesn't matter if the bet is simulated (no actual points lost on a wrong guess). Make the bet **hypothetical**. "Record the bet you *would* take." This removes risk aversion entirely.

  **4. "They won't update in Round 1."**
  *   **Fix:** Script the instruction. "In Round 1, you share a prior. If your partner's posterior differs from yours, it contains *information* about their signal. You are required to use that information." If they don't, the Audit catches them (because their final number won't match the 'Pooled Signal' lookup row).

  ---

  ### 4. The Debrief Script (Staging the Discomfort)

  Do not resolve the tension. Your goal is to make them feel the weight of the CPA.

  **Phase 1: The Data (5 mins)**
  *   Point to the board. "Round 1: Zero bets. Round 2: Twelve bets."
  *   Ask: "In Round 1, why did the bets collapse?"
  *   *Expected Answer:* "We realized we had the same info."
  *   Ask: "In Round 2, why did they stick?"
  *   *Expected Answer:* "We started from different places."

  **Phase 2: The Redescription Trap (10 mins)**
  *   Ask: "In Round 2, Group A knew they were Group A. Group B knew they were Group B. Isn't 'Being Group A' just a piece of evidence?"
  *   Let them argue. Someone will say: "Yes, so we *did* have a common prior. The prior was '50% chance I'm in Group A, 50% Group B'."
  *   Ask: "If that's true, why didn't you agree in Round 2 like you did in Round 1?"
  *   *Let them sit with this.* If they incorporated "I am in Group A" as evidence into a common prior, AAT says they should have agreed. They didn't.
  *   Ask: "So either you were irrational in Round 2, or 'Being in Group A' is not the same kind of evidence as 'Drawing a Red Ball'. Which is it?"

  **Phase 3: The Real World (10 mins)**
  *   Ask: "In this room, I (the TA) am God. I handed out the priors. I know if they were common. In the real world, who hands out the priors?"
  *   *Answer:* "Nobody."
  *   Ask: "So if I accuse you of violating AAT in a real political disagreement, and you say 'No, we just have different priors', how can I prove you wrong?"
  *   *Answer:* "You can't."
  *   Ask: "If the assumption is unfalsifiable, is it useless? Or is it a discipline?"

  **End on this note:** "The Common Prior Assumption isn't a claim that we *are* the same. It's a commitment to act *as if* we could be, unless we can point to a specific piece of evidence you have that I don't. In Round 2, you pointed to the evidence (your history). In real life, we often forget to ask for it."

  ---

  ### 5. Honesty Check: What This Game Cannot Do

  You asked me to be straight about the gap. Here it is:

  **1. The "God's Eye" Problem**
  *   **In the game:** You *know* the priors were common in Round 1 because you stipulated it.
  *   **In reality:** We never know if priors are common.
  *   **The Gap:** The game demonstrates the *consequences* of CPA, not the *plausibility* of it. Students might leave thinking, "Okay, if we have common priors, we agree. But we never have common priors, so AAT never applies."
  *   **How to close it:** In the debrief, emphasize that CPA is a **normative** constraint, not a descriptive one. It's not "Do we have common priors?" It's "Can you justify your disagreement without assuming you are smarter than me?" If you can't point to differential evidence (like the Historian cards), you are violating the spirit of CPA.

  **2. The "Learning History" Loophole**
  *   **In the game:** Round 2 priors are generated by explicit "Historian" cards.
  *   **In reality:** Priors come from vague upbringing, culture, genetics.
  *   **The Gap:** It is easy to treat the Historian Card as "evidence." It is hard to treat "my upbringing" as "evidence" that you should update on.
  *   **Admission:** Tell them explicitly: "In Round 2, I made it easy. I gave you a card. In real life, your 'card' is your entire life history. AAT demands I treat your life history as data I can update on. That is a huge demand. The theorem doesn't tell you it's easy; it tells you what rationality costs."

  **3. Risk Aversion & Stakes**
  *   **In the game:** The bets are hypothetical/points.
  *   **In reality:** Disagreement involves ego, money, policy.
  *   **Admission:** Acknowledge that "Agreeing to Disagree" is often socially cheaper than "Agreeing." The game removes the social cost. In the real world, people *want* to disagree. AAT assumes we want the truth more than we want to win.

  ### Summary of TA Instructions
  1.  **Print the Lookup Tables.** Do not skip this.
  2.  **Enforce the Audit.** Threaten the participation marks to ensure they don't bluff.
  3.  **Don't Explain Round 2.** Let them realize the priors are different only when they compare cards *after* the bet. (Actually, better: Tell them *before* Round 2 starts that they have different histories, otherwise they will assume Common Prior and get confused why they can't agree). *Correction:* Tell them they have different histories *before* they calculate, otherwise they will use the Round 1 table.
  4.  **Shut Up During Play.** Let them struggle with the "Bet Collapse" in Round 1. That frustration is the learning moment.
  5.  **Don't Resolve the Debrief.** If they ask "So is CPA true?", answer: "Is it useful?"

  This design fits your 75 minutes, costs nothing, and forces them to inhabit the theorem rather than observe it.
