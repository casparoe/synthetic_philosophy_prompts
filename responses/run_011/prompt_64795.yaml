prompt: |-
  ok so i'm an RA on a project building an "impact regularizer" — basically a penalty term in the agent's objective meant to discourage it from changing the world much while it's doing its task. Every single meeting our PI says some version of "look, we just want it to do no harm" and everyone nods and we move to the next slide. I've been trying to write that sentence down as something I could actually implement or test, and it keeps splitting into like five different claims.

  can you lay out the distinct precise principles "do no harm" could be standing for? the axes i care about: harm measured against which baseline — the counterfactual where the agent does nothing at all, the state of the world at deployment, or the trajectory the world was already on; harm to the aggregate versus harm to any particular person, i.e. does making one person much worse off while making someone else much better off count as zero impact or as harm; expected harm at decision time versus harm in fact after the dice land; whether the harm of *not* acting is in scope; and whether "it was reversible, I put it back" gets a free pass. also who counts — including future people whose entire existence depends on which trivial thing the agent did first.

  for each reading say: is it satisfiable at all, is it what my PI probably means, and what pathology does it hand us — the agent that refuses to act, the agent that freezes everything, the agent that happily smashes the vase and glues it back, the agent that sits still and lets the thing it could have stopped happen. then tell me whether any of the readings actually does the job he wants: a brake on side effects that doesn't require us to already have specified what's good. or is the slogan quietly doing that specifying for him? if it can't be done, what should he say in the meeting instead?
