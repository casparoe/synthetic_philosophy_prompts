answer: |-
  **Project Title:** Spacetime Structure and the Dependence of Persistence: A Metaphysical Audit

  **Research Question and the Dependence Thesis**
  The standard question in the metaphysics of persistence asks: *Is endurantism compatible with Special Relativity (SR)?* This project asks a prior, structural question: *To what extent is the coherence of the endurance/perdurance distinction dependent on the antecedent structure of spacetime?*

  The familiar question treats spacetime physics as a constraint on an independent metaphysical dispute about objects. It assumes we know what endurantism is and then test it against relativity. This project advances the **Dependence Thesis**: the persistence debate is not merely constrained by spacetime physics but is derivative upon it. Endurantism requires a notion of "being wholly present at a time" that is only well-defined if spacetime admits a privileged foliation into global simultaneity slices. Consequently, the dispute between endurantists and perdurantists is, in significant part, a dispute about spacetime ontology dressed in the language of material objects.

  This framing makes the project more tractable than the standard compatibility question. The compatibility question forces the researcher to defend a specific metaphysical view against physics. The Dependence Thesis allows for a conditional analysis: *if* spacetime has structure $S$, *then* endurantism is viable; *if* spacetime has structure $S'$, it is not. This shifts the burden from saving intuitions about objects to analyzing the structural prerequisites of those intuitions. It isolates the specific metaphysical cost of relativistic endurantism, distinguishing between a view that is merely expensive and one that is ill-formed.

  **The Gap in Current Dialectic**
  Current resources leave this question open because both sides obscure the spacetime commitment. Endurantists responding to relativity typically adopt "relativized multi-location," asserting an object is wholly present at $t$ relative to frame $F$. This move fails to settle the Dependence Thesis because it treats frame-relativity as a linguistic index rather than an ontological cost. It preserves the label "endurantism" while potentially abandoning the core notion of a single, non-perspectival history of the object.

  Perdurantists, conversely, appeal to frame-invariant four-dimensional worldtubes. While mathematically natural in Minkowski space, this appeal often begs the question by assuming that the four-dimensional manifold is the fundamental ontological arena. It fails to explain why the three-dimensional intuition is so resilient if not for the fact that certain spacetime structures (like a privileged foliation) would validate it. Both sides treat the spacetime background as a fixed parameter rather than the variable that determines the viability of their respective ontologies. Neither side adequately demonstrates whether the persistence debate dissolves or transforms when the spacetime structure is explicitly varied.

  **Methodology**
  The project will employ a comparative case-study method across distinct spacetime frameworks.

  1.  **Frameworks:** The core analysis will compare **Minkowski spacetime** (no privileged foliation) against a **Neo-Lorentzian variant** (empirically equivalent to SR but positing a hidden privileged frame). A limited extension to **General Relativity (GR)** will be attempted, restricted to globally hyperbolic cosmological models (e.g., FLRW) where foliation is natural, avoiding complex topologies.
  2.  **Defining Entire Location:** I will construct a rigorous criterion for "entire location." A satisfactory account must allow for the instantiation of temporary intrinsics without contradiction. In the Neo-Lorentzian case, this should map cleanly to the privileged slice. In Minkowski space, I will test whether relativized location can meet this criterion without rendering the object's history fragmented.
  3.  **Comparison:** Viability will be measured by theoretical cost. If endurantism requires identical machinery in both Minkowski and Neo-Lorentzian cases, the Dependence Thesis is weakened. If it requires significantly ad hoc machinery in Minkowski space that is unnecessary in the Neo-Lorentzian case, the Thesis is supported.

  **Rejected Approaches:**
  *   **Primitive Multi-location:** I will reject accounts that treat multi-location as a brute fact. This obscures the spacetime structure required to make sense of the "locations."
  *   **Verbal Dispute Dissolution:** I will not argue the debate is merely verbal. The structural dependence suggests a substantive disagreement about the world, not just language.
  *   **Physics-Bracketing:** Armchair arguments ignoring the specific geometry of spacetime will be excluded. The proposal rests on the claim that physics dictates metaphysical possibility here.

  **Work Plan and Technical Prerequisites**
  I possess a working command of Special Relativity but lack formal training in differential geometry. The plan mitigates this risk through targeted learning and consultation.

  *   **Months 1–2 (Technical Foundation):** Intensive study of spacetime geometry fundamentals (manifolds, metrics, foliations). I will attend a graduate workshop on philosophy of physics and consult with a physics department colleague to ensure mathematical accuracy.
  *   **Months 3–5 (Minkowski Analysis):** Drafting the core argument against standard Minkowski endurantism. Focus on the "relativized location" move and its failure to secure non-perspectival identity.
  *   **Months 6–8 (Privileged Foliation Case):** Drafting the Neo-Lorentzian comparison. Demonstrating how a hidden privileged frame restores the coherence of endurance without empirical difference.
  *   **Months 9–10 (GR Extension & Synthesis):** Applying the framework to limited GR cases. Synthesizing the results to argue for the Dependence Thesis.
  *   **Months 11–12 (Revision):** Full draft revision, formatting, and submission.

  **Success, Failure, and Early Warnings**
  A **successful result** demonstrates that the viability of endurantism tracks exactly with the availability of a privileged temporal structure. It would show that "relativistic endurantism" is either a misnomer for a perdurantist-compatible view or requires ontological posits (like a hidden frame) that change the subject.

  A **failure** would consist in showing that index-relativization successfully salvages endurantism in Minkowski space without significant theoretical cost, implying the persistence debate is independent of spacetime structure after all. A second failure mode is technical: inability to rigorously define "entire location" in GR contexts.

  **Early Warning:** If, by Month 4, the definition of "entire location" requires such complex indexing that it loses the intuitive connection to "wholeness," I will know the Dependence Thesis is likely correct, but the argument may need to pivot from "incoherence" to "prohibitive cost." If the mathematics of foliation proves beyond my grasp despite consultation, I will cut the GR component entirely and focus on the SR/Neo-Lorentzian comparison, which is sufficient for the core thesis.

  **Scope Assessment**
  To ensure completion within one year, the following must be cut:
  *   **Quantum Mechanics:** Implications of QM for persistence are excluded.
  *   **Complex GR Topologies:** Issues regarding global hyperbolicity in exotic spacetimes will be noted but not analyzed.
  *   **Historical Exegesis:** Detailed history of the endurance/perdurance debate will be minimized in favor of structural analysis.

  What remains for a subsequent project includes the quantum case, a deeper treatment of GR singularities, and the implications of the Dependence Thesis for other areas of metaphysics (e.g., modality). This project focuses strictly on the intersection of classical spacetime structure and the conditions of possibility for three-dimensional persistence. By isolating this dependency, the dissertation will clarify that the persistence debate cannot be settled without first settling the ontology of spacetime.
