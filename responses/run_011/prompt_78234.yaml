answer: |-
  1. **Verdict and Analog**
  The confessor will forbid the arrangement. His verdict will be that this is usury in substance, however politely dressed. The closest analog is **A** (the widow's loan), because in both cases money is given and more money is returned without the lender bearing the risk of loss. The analogy gives out because in **A** the interest was explicit and contractual, whereas here it is extrinsic and labeled "voluntary." This forces the confessor to rely on the reasoning of **F** (the painted peril) and **H** (looking past the paperwork) to argue that a regular, expected gratuity functions as a contract regardless of what the parchment says. The "friendship" is a legal fiction everyone understands as price.

  2. **Candidate Principles**
  Your eight precedents admit five competing principles. Here is how they stand against the record:

  *   **The Principle of Peril:** Profit is licit only if the principal is at risk.
      *   *Delivers cleanly:* **B** (venture permitted), **C** (forward sale forbidden because profit was weather-proof), **F** (insurance permitted for shipper, forbidden for lender).
      *   *Strains:* **G** (pawnshop permitted despite low risk to the poor), **H** (risk not mentioned, forbidden on appetite).
  *   **The Principle of the Fruitful Thing:** Money is sterile; only land or goods that naturally increase can justify increase.
      *   *Delivers cleanly:* **D** (olive grove permitted, promise forbidden).
      *   *Strains:* **B** (a sea venture is money, not land, yet permitted), **F** (insurance is a contract, not a fruit-bearing thing).
  *   **The Principle of Compensation for Loss (*Damnum Emergens*):** One may charge only to cover actual loss or cost incurred, not for the use of time.
      *   *Delivers cleanly:* **E** (late penalty permitted only if it matches cost), **G** (pawnshop charges permitted for wages/rent).
      *   *Strains:* **B** (the widow seeks gain, not loss recovery), **D** (the annuity is pure profit, not cost recovery).
  *   **The Principle of Substance over Form:** The moral reality of the transaction matters more than the legal wording.
      *   *Delivers cleanly:* **C** (called purchase, was usury), **F** (called insurance, was usury), **H** (paperwork flawless, soul guilty).
      *   *Strains:* **A** (form and substance matched), **G** (form and substance matched).
  *   **The Principle of the Honest End:** Wealth-getting is licit only if bounded by household need; infinite accumulation is sinful.
      *   *Delivers cleanly:* **H** (forbidden due to infinite appetite), **G** (permitted for poor, forbidden for rich).
      *   *Strains:* **B** (widow's need not specified), **D** (annuity could fund infinite luxury).

  3. **The Actual Principle and Key Details**
  He is in fact running the **Principle of Peril** refined by **Substance over Form**. The record favors this because it is the only thread that ties together the permission of the sea venture (**B**), the prohibition of the weather-proof grain deal (**C**), and the distinction in insurance (**F**). The confessor cares less about the *label* (friendship vs. interest) and more about whether the money is truly *at sea*.

  *   **Candidate 1: Principle of Peril.**
      *   *Key Detail:* The banker's partners have signed an undertaking to make the sum good. This removes the peril from the merchant.
      *   *Changing the Detail:* If the guarantee were removed, and the merchant risked losing the 2,000 ducats if the bank failed, the confessor would likely permit it (aligning with **B**).
  *   **Candidate 2: Principle of the Honest End.**
      *   *Key Detail:* The merchant's stated end is bounded (wife's health, dowry, exit trade) and he claims he would stay even without the profit.
      *   *Changing the Detail:* If the merchant admitted he *needed* the five percent to survive or to expand his business indefinitely, the confessor would forbid it (aligning with **H**).

  4. **Commitments and Consistency**
  If he forbids it, he commits himself to the idea that **the nature of the act outweighs the intention of the actor.** He must tell the merchant that a usurious contract remains usurious even if the profit is used for charity or medicine. This will embarrass him later if the wife suffers for lack of funds, forcing a choice between doctrine and mercy.

  If he permits it, he must re-read **A** and **D**. He would be admitting that money can yield money without risk provided the parties call it a gift. This breaks the sterility of money doctrine. Your set of precedents **is jointly consistent** provided he forbids the new case. If he permits it, the most plausible abandonment is **D** (the olive grove). He would have to argue that the banker's *credit* is a fruitful thing, which contradicts his earlier ruling that "a word does not bear fruit." A man of his training would find this harder to swallow than condemning the merchant.

  5. **Aristotle vs. Pastoral Casuistry**
  *   **Aristotle:** The confessor quotes his master when he asserts that **money is sterile** (it exists only to measure exchange) and that **wealth for the household has a limit** (while wealth for its own sake does not). These are direct from the *Politics* and *Nicomachean Ethics*.
  *   **Casuistry:** The confessor quotes his profession when he distinguishes between **risk-sharing** (**B**), **insurance** (**F**), and **compensation for delay** (**E**). Aristotle did not analyze bills of exchange, marine insurance, or pawnshop operating costs. These are later scholastic refinements designed to allow commerce to function without condemning every merchant to hell. The distinction between *damnum emergens* (loss emerging) and *lucrum cessans* (gain ceasing) in **E** is entirely pastoral casuistry wearing Aristotle's authority.

  6. **Further Case for the Dinner Table**
  To separate the **Principle of Peril** from the **Principle of the Honest End**, use this case:

  *A merchant provides a cask of wine to a poor kinsman's wedding feast gratis. Three months later, the kinsman's harvest is abundant, and he sends the merchant a cask of equal value as a "token of gratitude." The merchant accepts it.*

  *   **If he runs Peril:** He forbids it. The wine was a loan of value; the return cask is interest. The kinsman's success does not change the sterility of the initial gift.
  *   **If he runs Honest End:** He permits it. The exchange was within the bounds of family charity and household provision, not market exchange. The end was support, not profit.

  This fits at a dinner table because the confessor can point to the wine being poured while he speaks.

  ***

  **Historical Note:** Your setup is historically sound. The *deposito a discrezione* (deposit at discretion) with voluntary interest was a common loophole in 1490s Florence, and Dominican confessors were notoriously strict on this specific point (often more so than Franciscans). The reference to the alum contract is also apt, as the papal monopoly on alum was a major liquidity trap for merchants of the period. No changes are needed.
