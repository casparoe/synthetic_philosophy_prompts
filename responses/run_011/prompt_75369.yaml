  A few constraints:

  - keep it under about 1300 words
  - don't use the phrase "simulation hypothesis" anywhere, and don't have anyone explain the setup like they're talking to a general audience
  - include one scene that's basically a bureaucractic meeting where somebody has to justify the specific string of digits their world is currently emitting outward, and make the reasoning sound like real cost-benefit argument with tradeoffs people disagree about, not hand-waving
  - include at least one character who thinks the whole project is monstrous but stays anyway, and give them a reason that isn't just "my family is here"
  - end unresolved. no reveal that it was all a test, no waking up, no last-line twist that recontextualizes everything

  Write it in American English please.
