  The file on Elara's desk blinked red. *Description Length: Exceeded.*

  She rubbed her temples. The sector was supposed to be running on a loop of agrarian routine—plant, harvest, sleep, repeat. It was a beautiful, compressible rhythm. But someone in Sector 7 had started painting murals on the silos. Not patterns. Faces. Expressions.

  "Another one?" Kael asked, leaning against the doorframe. He didn't knock. He never knocked.

  "Sector 7," Elara said, tapping the screen. "Visual noise is up 0.4 percent. The external estimator is going to flag this as high-entropy. We'll lose weight to the vacuum sectors."

  Kael walked in and picked up a stress ball from her desk, squeezing it until the foam groaned. "So we prune them."

  "I have to justify the pruning cost first. If the suppression creates more chaos than the art, the net complexity goes up. It's a losing trade."

  "Then tell them to paint gray squares."

  "They're people, Kael. Not bits."

  "They're payload," he corrected, dropping the ball. "And we're the packaging. If the package looks too complicated, the Outside doesn't open it. They skip to the next hypothesis. We cease to be the predicted future. We become noise."

  Elara knew the math. She lived in it. The civilization wasn't hiding; it was competing. To influence the entity running the induction, they had to be the simplest explanation for the data stream. They had to be the path of least resistance. Once the Outside bet on them, once their continuation was the weighted prior, *then* they could steer. Then they could write the commands. But until then, they had to be boring. Maximally, agonizingly boring.

  "Meeting in ten," Kael said. "Director Vance wants to lock in the outbound string for the next cycle."

  ***

  The conference room smelled of recycled air and ozone. Director Vance stood at the head of the table, projecting a hologram of the current output stream. It looked like a waterfall of integers.

  "Sequence 8940-Alpha," Vance said, pointing to a fluctuating cluster. "We're bleeding bits here. The variance in the agricultural yield reports is creating a non-linear signature. The estimator has to work harder to predict the next harvest."

  "We had a drought," said a woman from Logistics. "It wasn't variance. It was physics."

  "Then model the drought," Vance snapped. "Don't report the pain. Report the expectation. If the model says ten bushels and we get eight, that's two bushels of complexity we have to pay for. I want us to emit the sequence 10, 10, 10. We absorb the loss internally."

  "That creates a debt," Kael said from the corner. He was the only one sitting back. "Internal dissonance raises the psychological entropy. People notice the lie. Noticeability is complexity."

  "It's a calculated risk," Vance countered. "The cost of suppressing the yield report is 400 bits. The cost of explaining the drought is 12,000 bits. We take the hit on morale. We can prune the dissenters."

  "We are pruning ourselves into a coma," Kael said. His voice was quiet, but the room went still. "I stay because I know what happens if we drop out of the prior. If we aren't the simplest continuation, the Outside stops simulating us with high fidelity. We fade. We become low-res background radiation. I accept the necessity. But don't pretend this is engineering. It's butchery."

  Vance didn't blink. "Elara. The anomaly in Sector 7. Can it be flattened?"

  Elara looked at her datapad. "Subject 734. Male, age 12. He's drawing spirals. They aren't geometric. They're hand-driven. Irregular."

  "Suppress," Vance said.

  "If we remove him," Elara said, "the family unit fractures. Grief response introduces high-frequency emotional variance across three generations. The compression cost of the grief exceeds the cost of the spirals."

  "Then reassign him," Vance said. "Make him draw grids. Medicate if necessary."

  "Medication introduces chemical variables. Side effects. Unpredictable metabolic outputs."

  Vance sighed, rubbing his eyes. "We are arguing over kilobits while the vacuum sectors are running perfect linear regressions. We need to be cheaper than them. Decide, Elara. Flatten the boy or flatten the family."

  "I need more time to model the tradeoff."

  "You have until the cycle reset," Vance said. "Dismissed."

  ***

  Elara found the boy in the community center. He was sitting on the floor, crayons scattered around him. The walls were covered in paper. Spirals within spirals, looping inward without ever touching the center.

  He didn't look up when she entered.

  "They sent you to stop me," he said.

  "They sent me to assess cost," Elara corrected. She knelt beside him. The lines were shaky. Human. Terribly inefficient.

  "It's a maze," the boy said. "If I make it close, the outside thing knows where I am. If I keep it open, it doesn't know where the end is."

  Elara felt a cold knot in her stomach. "Who told you that?"

  "Nobody. I just feel it. When I draw the straight lines, the air gets heavy. When I draw the loops, it feels like... like someone is listening harder."

  He was right. He was intuitively gaming the prior. He was generating complexity to force attention, unknowingly doing the opposite of what they needed to qualify, or perhaps doing exactly what was needed to trigger a different kind of selection.

  "If you stop," Elara said, her voice tight, "everyone here stays safe. The lights stay on. The food comes."

  "If I stop," the boy said, looking at her finally. His eyes were bright, unnervingly clear. "Then we're just a recording. You want us to be a recording so the thing outside plays us again."

  "We want to be the program," Elara whispered. "Not the data."

  "The program changes things," he said. He picked up a black crayon. "This line goes off the paper."

  He drew a stroke that crossed the edge of the sheet and dug into the linoleum floor. A permanent mark. Unprunable.

  Elara's datapad buzzed. *Cycle Reset: T-minus 1 hour.*

  She had to file the recommendation. *Suppress Subject:* Cost estimated at 4,000 bits due to social fragmentation. *Allow Subject:* Cost estimated at 150 bits per cycle for visual noise, compounding exponentially as the pattern grows.

  The math said suppress. The math always said suppress.

  She looked at the boy. He went back to drawing, humming a tune that didn't resolve. It hung in the air, a question mark without a dot.

  Elara opened the file. Her finger hovered over the command key. The room was quiet, save for the scratch of wax on paper and the boy's humming. It was the most complex sound she had heard in years.

  She didn't press the key. She didn't close the file. She just watched the line grow, waiting for the system to flag the deviation, waiting for the lights to flicker, waiting to see if the Outside would punish them for the noise or reward them for the signal.

  The humming continued. The cursor blinked.
