answer: |-
  Your half-remembered impression is substantially correct. The passage you found is a classic example of a "steel-manned strawman": it uses the standard terminology of the theory but strips away the specific technical machinery designed to solve the exact problems it claims are unsolved.

  A working teleosemanticist (e.g., Ruth Millikan, Karen Neander, David Papineau) would reject the core argument of that passage as begging the question against the theory.

  Here is an audit of the passage, broken down by your requested categories, followed by answers to your specific technical questions.

  ### Part 1: The Audit

  #### 1. What a working teleosemanticist would happily sign
  *   **"The teleosemantic proposal is that a state's content is fixed by the function it was selected for..."**
      *   **Verdict:** **Acceptable.** This is the core slogan. Content is grounded in biological *proper function*, which is derived from selection history.
  *   **"...the frog's bug-detector means fly because detecting flies is what the mechanism evolved to do."**
      *   **Verdict:** **Acceptable (as a shorthand).** This is the canonical example used in the literature (originating from Lettvin et al., 1959, and popularized by Fodor and Millikan).
  *   **"Those same cells fire at small dark moving dots in general, including the BB pellets..."**
      *   **Verdict:** **Empirically Correct.** It is true that the retinal ganglion cells in question respond to small, dark, moving stimuli, including BBs. This is the physiological basis of the "Disjunction Problem."

  #### 2. What is fair simplification
  *   **"...which is why the field eventually moved on to purely causal accounts."**
      *   **Verdict:** **Oversimplification.** It is true that teleosemantics is no longer the *only* game in town and that causal/informational accounts (like Dretske's early work or Fodor's Asymmetric Dependency) were major competitors. However, framing it as a clean succession where teleosemantics failed and causal accounts won is historically inaccurate. Causal accounts face severe problems with normativity (explaining error) that teleosemantics was specifically built to handle. The field is currently more fragmented (including predictive processing, structural representation, etc.) than this sentence implies.
  *   **Glossing "function" as "what the mechanism evolved to do."**
      *   **Verdict:** **Acceptable Simplification.** A technical account would distinguish between *activity functions* and *proper functions*, and specify whether we are looking at the *producer* (the neuron firing) or the *consumer* (the motor system catching the fly). But for a summary, this passes.

  #### 3. What is wrong or question-begging
  *   **"...and since the frog is rewarded either way, selection history is indifferent between FLY and FLY-OR-PELLET."**
      *   **Verdict:** **Factually Wrong / Question-Begging.** This is the fatal flaw in the passage.
      *   **Why:** In the ancestral environment (where selection history is determined), BB pellets did not exist. Furthermore, even if they did, a frog that eats BBs is *not* rewarded. It does not gain nutrition; it starves. Selection is **not** indifferent. Selection favors mechanisms that secure nutrition (flies), not mechanisms that snap at any moving dot. The "reward" in evolutionary terms is reproductive success, which requires caloric intake. BBs provide zero caloric intake. Therefore, the selection history is *determinate*: it selected for fly-catching, not dot-snapping.
  *   **"Content is therefore underdetermined exactly where the theory needed it to be determinate, so misrepresentation goes unexplained..."**
      *   **Verdict:** **Wrong.** This ignores the "Normal Conditions" clause you suspected. Teleosemantics defines content relative to the conditions under which the mechanism successfully performed its function in the past.
      *   **Why:** Since the mechanism successfully secured nutrition by firing at *flies* in the past, and never successfully secured nutrition by firing at *BBs* (because there were no BBs), the content is "Fly." When the neuron fires at a BB, it is a **misrepresentation** (a malfunction relative to normal conditions). The passage claims the theory cannot explain misrepresentation, but explaining misrepresentation is the theory's primary selling point.
  *   **"...the theory cannot escape the following problem."**
      *   **Verdict:** **Question-Begging.** It asserts the problem is inescapable without engaging the actual solution offered by the theory (the distinction between *performance* and *proper function* under *normal conditions*).

  ---

  ### Part 2: Addressing Your Specific Questions

  #### 1. Is the empirical premise about the pellets stated correctly?
  **No.** The passage states: *"the frog is rewarded either way."*
  This is biologically false. In the laboratory, a frog might snap at a BB, but it receives no nutritional reward. In the evolutionary past, frogs that snapped at non-nutritious objects wasted energy and risked predation without gaining survival value. The selection pressure was for *nutrition*, not *snapping*. Therefore, the selection history discriminates between flies and pellets.

  #### 2. Does the underdetermination argument even need it?
  **Yes.** The underdetermination argument (often called the **Disjunction Problem**) relies on the claim that the causal history is compatible with multiple content assignments (Fly vs. Fly-or-Pellet).
  *   If the history shows the mechanism only succeeded with Flies, the content is Fly.
  *   If the history shows the mechanism succeeded equally with Flies and Pellets, the content is Fly-or-Pellet.
  The argument *needs* the premise that selection was indifferent to conclude that the content is indeterminate. Since the premise is false, the conclusion does not follow.

  #### 3. Does the objection engage the machinery the theory was built to handle, or does it assume that machinery away?
  **It assumes the machinery away.**
  The specific machinery teleosemantics introduces is the distinction between **what a system does** (performance) and **what it was selected to do** (proper function), evaluated under **Normal Conditions**.
  *   **Normal Conditions:** Conditions similar to those in which the ancestors of the mechanism successfully performed their function. (BBs were not present in normal conditions).
  *   **Proper Function:** The contribution the mechanism made to fitness in those normal conditions. (Catching food, not catching dots).
  The passage treats "selected for" as "whatever causes the neuron to fire," which is a causal theory, not a teleological one. It ignores the normative gap that teleosemantics is built to bridge.

  #### 4. Is the gloss on 'the function it was selected for' doing justice to how content is actually derived (Producer vs. Consumer)?
  **No, it is neutral but shallow.**
  There are two main camps in teleosemantics:
  *   **Producer-Oriented (e.g., Dretske, early Millikan):** Content is fixed by what causes the state.
  *   **Consumer-Oriented (e.g., Millikan, Papineau):** Content is fixed by what the state is *used for* by downstream systems.
  The leading version (Millikan's) is largely **consumer-oriented**. The frog's neuron means "Fly" not just because flies cause it, but because the frog's *tongue-snapping system* uses that signal to catch flies. If the signal is caused by a BB, the consumer system fails to get what it needs (food). The passage ignores this consumer-side constraint, which makes the "indifference" claim even weaker. The consumer system was not selected to eat BBs.

  #### 5. Does the closing claim about where the field went follow from anything accurate in the summary?
  **No.**
  The claim *"which is why the field eventually moved on to purely causal accounts"* is historically inaccurate for two reasons:
  1.  **Causal accounts struggled more with this specific problem.** Purely causal accounts (like Fodor's) have a much harder time explaining misrepresentation than teleosemantics does. If meaning is just causal correlation, then if BBs cause the state, BBs are part of the meaning. Teleosemantics was invented *specifically* to solve the problem that causal accounts could not.
  2.  **Teleosemantics did not die.** It remains a dominant framework in philosophy of biology and cognitive science. Karen Neander (a major proponent) is still highly influential. The field hasn't "moved on"; it has diversified into hybrid views (e.g., teleosemantics combined with predictive processing).

  ### Summary Verdict
  The passage you found is a **polemic, not a summary.** It is written by someone who wants to dismiss teleosemantics quickly, likely to pivot to a different view (perhaps a causal or functionalist account common in rationalist/AI circles).

  It correctly identifies the *name* of the problem (indeterminacy/disjunction) but incorrectly asserts that teleosemantics lacks the resources to solve it. Your suspicion about "normal conditions" was the exact missing piece. A teleosemanticist would say: "The frog represents 'Fly' because under **normal conditions** (ancestral environment), firing led to **nutrition**. BBs are **abnormal conditions** where the mechanism misfires. That is what misrepresentation *is*."

  You can safely treat that paragraph as an unreliable guide to the actual state of the debate.
