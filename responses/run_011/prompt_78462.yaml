answer: |-
  **PRE-DEFENSE ASSESSMENT**

  You asked for plain talk on indefensible steps. **Step 3 is your point of failure.** You claim causal relations are "metaphysically level-relative" but ground this in "interventions possible in principle." Standard interventionism requires that distinct variables be independently manipulable. If mental property *M* supervenes on physical property *P*, you cannot intervene on *M* without intervening on *P*. If you claim both are causes relative to different grains, but the interventions on *M* necessarily drag *P* along, you have not shown *M* is a cause; you have shown *P* is the cause described in two ways. Your "no further fact" clause attempts to dodge this by making the causal relation indeterminate, but that undermines the "metaphysical" weight you need to save moral responsibility. You are trying to have realist causation without realist causal facts.

  Below is your preparation sheet.

  ***

  ### 1. The Objection Map (Ordered by Damage)

  **1. The Independent Manipulability Trap**
  *   **Who:** Reader 3 (Interventionist)
  *   **Phrasing:** "You define your grains by interventions possible in principle. But if *M* supervenes on *P*, any intervention that changes *M* logically or nomologically necessitates a change in *P*. You cannot vary *M* while holding *P* fixed. So, on your own interventionist criteria, *M* drops out as a candidate cause. How do you get *M* into the causal model without violating the independent manipulability requirement?"
  *   **Reply:** "You are right that I cannot vary *M* while holding *P* fixed in the *same* model. But that is precisely why I insist on distinct models for distinct grains. When we assess *M* as a cause, we are working in a coarse-grained model where *P* is not a variable—it is background structure. When we assess *P*, we are in a fine-grained model where *M* is not a variable. The requirement for independent manipulability applies *within* a model, not *across* them. Since I deny there is one privileged model, I deny there is one context where both must compete directly."
  *   **Softness:** This relies on the controversial claim that supervenience bases can be treated as 'background structure' rather than confounding variables.

  **2. The "Changing the Subject" Charge**
  *   **Who:** Advisor (Metaphysician)
  *   **Phrasing:** "This looks like the proportionality constraint: the cause should be proportional to the effect. If that is all this is, you haven't solved Kim's exclusion problem; you've just adopted a different definition of causation that Kim would reject as not tracking 'real' production. Why should we think this is metaphysics and not just semantics?"
  *   **Reply:** "Proportionality is a constraint on which cause is *better* or *more explanatory*. My claim is stronger: both claims are *true*. It is not that *M* is a better cause than *P*; it is that *M* is the cause at grain L1 and *P* is the cause at grain L2. Kim assumes causation is a monadic relation between events. I am arguing it is a dyadic relation between events and a descriptive grain. That is a metaphysical claim about the structure of dependence, not a semantic claim about word usage."
  *   **Softness:** You have not yet provided an argument for why the world contains these 'grains' other than our ability to describe them.

  **3. The Explanatory Redundancy Worry**
  *   **Who:** Reader 2 (Action/Psych)
  *   **Phrasing:** "If physical closure holds and mental properties do nothing at the physical level, what work is the word 'cause' doing for you? If I say 'reasons explain actions but do not cause them,' I get all the moral responsibility I need without your complex machinery. Why insist on causation?"
  *   **Reply:** "Because explanation without causation is merely predictive. If I say reasons do not cause actions, I cannot account for why manipulating a reason manipulates an action. We hold people responsible because their mental states *make a difference* to the outcome. If I give up causation, I give up the difference-making. My view preserves the difference-making at the mental level without violating physical closure."
  *   **Softness:** You are conflating 'making a difference' in a model with 'making a difference' in the world.

  **4. The Indeterminacy Problem**
  *   **Who:** Reader 3 (Interventionist)
  *   **Phrasing:** "You say there is 'no further fact' about which level is the real one. But if I intervene on the system, the physical outcome is determinate. How can the causal structure be indeterminate if the physical outcomes are fixed? It sounds like you are saying causation isn't real."
  *   **Reply:** "The physical outcome is determinate, yes. But *which description* captures the causal dependency is not fixed by the physics alone. It is fixed by the grain of the intervention available. Causation is a relation between the system and the possible manipulations of it. Since manipulations come in different grains, the causal facts come in different grains. There is no 'view from nowhere' causal fact."
  *   **Softness:** This verges on anti-realism, which threatens the robustness needed for Step 4 (moral responsibility).

  **5. The "Causal Drain" Intuition**
  *   **Who:** Open Floor (Classmate)
  *   **Phrasing:** "So if the physical level is closed, and the mental level doesn't change the physical level, doesn't that mean the mental level doesn't actually *do* anything? It sounds like you're saying my thoughts are just shadows."
  *   **Reply:** "No, because 'doing something' means changing the outcome relative to a set of possibilities. Relative to the possibilities relevant to psychology—believing, desiring, choosing—your thoughts determine the action. The fact that those thoughts are implemented physically doesn't make them shadows; it makes them physically realized. Shadows don't have physical realizers that obey closure."
  *   **Softness:** Laypeople (and some philosophers) will not accept that 'relative causation' counts as 'doing something' in the robust sense.

  **6. The Grain Boundary Question**
  *   **Who:** Advisor (Metaphysician)
  *   **Phrasing:** "You say the grain is fixed by interventions possible in principle. Where is the cutoff? How fine does the grain have to be before the mental disappears? Is there a fact of the matter about which interventions are 'possible'?"
  *   **Reply:** "The cutoff is determined by the stability of the relationship. At the mental grain, the relationship between belief and action is stable across many physical realizations. At the physical grain, the relationship between neural firing and muscle contraction is stable across many contexts. The boundary isn't arbitrary; it's where the invariant relationships break down."
  *   **Softness:** Stability is a matter of degree, which reintroduces the vagueness you tried to avoid with 'no further fact'.

  **7. The Responsibility Gap**
  *   **Who:** Reader 2 (Action/Psych)
  *   **Phrasing:** "Moral responsibility usually requires that I could have done otherwise. If the physical level is closed, I could not have done otherwise physically. Does your view allow for alternate possibilities?"
  *   **Reply:** "It allows for alternate possibilities at the mental grain. If we describe the situation in terms of reasons, there are worlds where I have different reasons and perform different actions. Physical closure only rules out alternate possibilities at the *physical* grain. Responsibility tracks the mental grain."
  *   **Softness:** This is a compatibilist move that hard incompatibilists in the room will reject immediately.

  **8. The "Extra Machinery" Accusation**
  *   **Who:** Advisor (Metaphysician)
  *   **Phrasing:** "You introduced 'interventional grain' to solve this. But if the proportionality move fails, this grain looks like ad hoc machinery designed solely to save the phenomenon. What independent evidence is there for interventional grains?"
  *   **Reply:** "The evidence is the practice of science itself. Neuroscience models systems differently than psychology models systems, and both predict successfully. If there were only one causal grain, one of these sciences would be systematically misleading. They are not. The machinery is just a formalization of successful scientific practice."
  *   **Softness:** Successful prediction does not entail distinct metaphysical causal relations.

  **9. The Overdetermination Rebound**
  *   **Who:** Open Floor (Classmate)
  *   **Phrasing:** "You said you accept the ban on overdetermination. But if *M* causes the action and *P* causes the action, isn't that exactly what overdetermination is? Two causes for one effect?"
  *   **Reply:** "Overdetermination requires two *independent* causes sufficient for the effect. *M* and *P* are not independent. *M* is realized by *P*. Because they are not independent, they do not compete. They are the same causal process described at two resolutions. Like a pixel causing a image and the image causing a recognition."
  *   **Softness:** The pixel/image analogy risks implying *M* is just a collection of *P*s, which leans toward reductionism.

  **10. The "So What?" Challenge**
  *   **Who:** Reader 3 (Interventionist)
  *   **Phrasing:** "Even if I grant you this level-relativity, what does it buy me in my causal models? Do I need to change how I construct my DAGs (directed acyclic graphs)?"
  *   **Reply:** "Yes. It means you should not put *M* and *P* in the same graph. If you do, you create collinearity and confounding. You must choose the grain appropriate to your intervention target and exclude the other variables from that specific model."
  *   **Softness:** This concedes that the view is methodological, weakening the metaphysical claim.

  ***

  ### 2. The Fatal Objection & Pre-emptive Concession

  **The Fatal Objection:** **#1 (The Independent Manipulability Trap).**
  If Reader 3 convinces the room that your "grain" solution violates the core logic of interventionism (that causes must be distinguishable from their supervenience bases), your technical framework collapses. Without that framework, Step 3 is just an assertion.

  **The Pre-emptive Concession (First 5 Minutes):**
  "I want to be clear at the outset: I am not claiming that *M* and *P* are independently manipulable within a single causal model. If you try to model them together, *P* wins every time. My claim is that the requirement for independent manipulability is a constraint on *model construction*, not on the world. I am conceding that *M* cannot be a cause *in a physical model*. I am arguing that psychology is not a physical model, and it deserves its own causal validity."
  *(Why this works: It disarms Reader 3 by agreeing with his technical constraint while shifting the battleground to the legitimacy of separate models, which is your stronger ground.)*

  ***

  ### 3. Things to Volunteer (Before They Are Extracted)

  1.  **The Anti-Realist Flavor:** Admit early that your "no further fact" clause sounds anti-realist, but argue it is "perspectival realism." The facts are real relative to the perspective (grain).
  2.  **The Yablo Connection:** Acknowledge the similarity to proportionality immediately. Distinguish your view by saying proportionality selects the *best* cause, while your view validates *multiple* true causes at different levels.
  3.  **The Cost:** Admit that your view requires abandoning the idea of a "Grand Unified Causal Map" of the universe. There is no single graph that contains physics, psychology, and economics all at once.

  ***

  ### 4. The "Hope Nobody Asks" Question

  **The Question:** "If the physical level is causally closed, and all physical effects have sufficient physical causes, what prevents us from simply eliminating the mental level entirely? If *P* does all the work, why keep *M* as a cause even relatively?"

  **The Best Reply:** "Because *P* is too specific to support the counterfactuals we care about. If I ask, 'Would he have raised his hand if he didn't want to vote?', the physical answer is 'It depends on exactly which neurons fired.' The mental answer is 'No.' The physical story is true, but it is useless for the counterfactuals that ground responsibility and prediction. We keep *M* not because *P* is false, but because *P* is opaque."

  ***

  ### 5. Open Floor: Naive but Hard Questions

  **Q1: "So, does my mind control my body or not?"**
  *   **Reply:** "It controls your body relative to the description of 'body movements' like raising a hand. It does not control your body relative to the description of 'neuronal firings.' Both are true. Which one matters depends on whether you are asking a psychologist or a neurosurgeon."
  *   *(Trap: Don't say 'yes' or 'no'.)*

  **Q2: "Is this just saying that causation is in the mind of the observer?"**
  *   **Reply:** "No. The interventions are possible in principle, regardless of whether an observer is there. A landslide causes damage relative to the grain of 'rocks moving,' not 'atoms vibrating.' That fact holds even if no one is there to measure it. The grain is fixed by the system's stability, not by human interest."
  *   *(Trap: Don't slide into subjectivism.)*

  **Q3: "If physics is the base, isn't it the most real?"**
  *   **Reply:** "It is the most *fundamental*, yes. But 'most fundamental' does not mean 'only causal.' A foundation supports a house, but the foundation doesn't cook the dinner. The kitchen does that. Both are real parts of the house."
  *   *(Trap: Don't deny physical fundamentality.)*

  ***

  ### 6. The Fallback Thesis

  **If the committee rejects Step 3 (Metaphysical Level-Relativity), announce this:**

  "Even if my account of level-relative causation fails, my thesis stands as a methodological constraint: we must not model mental and physical variables in the same causal graph, or we will inevitably derive epiphenomenalism by category error."
