  3. I will put the question of certification, requiring a majority of voting members, which is the point where procedure stops computing and hands the question back to the board as a matter of values rather than arithmetic. I will enter the decision as "Certified" or "Not Certified," and if this contradicts the aggregated criteria, this vote overrules the Alpha verdict.
  4. If the certification vote contradicts the criteria findings, I will put the question on amending the findings to match the decision, requiring a majority to alter the record. I will enter the amended findings in the minutes to ensure the appeal panel sees a logical record, even if it requires overturning a prior factual finding to match the collective judgment.
  5. I will put the question on the ultimate action for multiple grounds or numeric thresholds, selecting the ground or estimate with the strongest majority, though this procedure cannot settle a case where no ground commands a majority. I will enter the selected ground in the minutes, which prevents agenda manipulation in Beta but overrules the Gamma verdict by prohibiting re-votes based on median estimates.
