  2.  **Initial Sketch of Bentham's Argument (Mental Draft):**
      *   Bentham's core principle is utility (maximize pleasure, minimize pain).
      *   Punishment is itself an evil (pain) and is only justified if it prevents greater evil.
      *   For "offences against oneself" (like consensual sexual acts), the direct harm is questionable.
      *   The problem of "popular prejudice" or disgust: Does the pain of spectators count?
      *   Bentham's solution isn't necessarily a "threshold" rights-based exclusion, but rather a calculation regarding the *source* and *legitimacy* of the pain, often categorizing such disgust as grounded in prejudice which shouldn't be gratified by law, or arguing that the secondary mischiefs (alarm/danger) are absent in private consensual acts.

  3.  **Evaluate the "Threshold Reading" (Question 1):**
      *   *User's Reading:* Bentham excludes spectators' disgust entirely via a threshold status of participants' good. No trade-off allowed.
      *   *My Understanding:* Bentham doesn't usually establish absolute thresholds or rights that trump utility. He tends to argue that the pain of disgust based on prejudice is *not* a legitimate pain to be satisfied by law, or that the act produces no *primary* mischief, and without primary mischief, secondary mischief (alarm) doesn't legitimately arise. He often argues that gratifying prejudice encourages prejudice, which is bad utility-wise. So it's not a deontological threshold, but a sophisticated utilitarian calculation about the *quality* or *source* of the pain (prejudice vs. genuine harm).
      *   *Verdict:* The threshold reading is slightly anachronistic. Bentham doesn't say "no quantity of revulsion counts." He says revulsion based on prejudice shouldn't be gratified because doing so increases overall pain in the long run (reinforcing prejudice). It's about what counts as *legitimate* pain in the calculus, not a lexical priority.

  4.  **Analyze Alarm and Danger (Question 2):**
      *   *Concepts:* Primary mischief (victim), Secondary mischief (alarm to community, danger of future acts).
      *   *Work:* Punishment is rarely justified by primary mischief alone; secondary mischief makes punishment efficient/necessary.
      *   *Secrecy vs. Publicity:* If an act is secret, there is no alarm. If public, there is alarm.
      *   *Threshold Reading Compatibility:* If the threshold reading says "participants' good trumps disgust," then publicity shouldn't matter. But for Bentham, publicity *does* matter because it creates alarm (secondary mischief).
      *   *Verdict:* The framework delivers different verdicts. Secret acts = no alarm = no punishment. Public acts = alarm = potential punishment. The premise is the existence of secondary mischief (alarm), not just the primary act.

  5.  **Harm Principle Comparison (Question 3):**
      *   *Proposal:* Bentham = early Mill (harm to others).
      *   *Capture:* Correctly identifies that self-regarding acts are generally exempt.
      *   *Distortion:* Bentham is not committed to a *right* to liberty. He is committed to *efficiency*.
      *   *Narrower/Wider:*
          1.  *Wider:* Bentham might punish self-regarding acts if they create significant alarm/danger (secondary mischief), even without direct harm to others (e.g., public indecency). Mill might be stricter on liberty.
          2.  *Narrower:* Bentham might *not* punish harmful acts if enforcement costs (expense of punishment) outweigh the benefit. Mill might say harm justifies interference regardless of cost (normatively), whereas Bentham says cost makes it inexpedient.
          *   *Enforcement Costs:* Bentham explicitly lists "groundless" punishment where expense exceeds benefit. This is utilitarian expediency, not moral rightness.

