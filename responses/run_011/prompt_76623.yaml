  2. Bentham's account of the mischief of an act includes not only the harm that falls on assignable individuals but also further mischief consisting of alarm and of danger.
  Alarm and danger constitute the secondary mischief of an act. Alarm is the anxiety felt by the community upon learning of an offence; danger is the probability of future similar acts. These notions allow Bentham to punish acts without direct victims if they disturb public security. The threshold reading cannot square with this, for it implies conduct is immune regardless of context. Bentham's framework delivers different verdicts on secret versus public conduct. Secret acts generate no alarm; public acts do. The premise turning the difference is the existence of secondary mischief. If conduct is widely known, it creates alarm among those who fear similar treatment or moral decay, potentially justifying interference not because of the act's intrinsic nature, but because of its public consequences. For Bentham, an act done in strict secrecy lacks the secondary mischief required to make punishment efficient. Once publicized, the same act may generate sufficient alarm to warrant the pain of punishment, not to vindicate morality, but to restore security. The threshold reading fails because it treats the act's status as fixed, whereas Bentham treats the *mischief* as variable based on publicity and context. The presence of alarm transforms a self-regarding act into one with social consequences, altering the utility calculus entirely. Danger adds a temporal dimension, assessing the risk of repetition, which secrecy negates but publicity amplifies.

  3. Consider the proposal that Bentham is simply an early proponent of the view that the state may coerce only to prevent harm to others.
  This proposal captures Bentham's reluctance to punish self-regarding conduct but distorts his justificatory basis. Bentham is not committed to a moral sphere of liberty, but to expediency. First, his limits are wider than the harm principle suggests: he may punish self-regarding acts, like public indecency, if they cause sufficient alarm, whereas a strict harm-to-others principle might exempt them as purely self-regarding. For Bentham, the alarm *is* the harm to others, expanding the scope of coercible conduct beyond direct physical injury. Second, his limits are narrower: he may abstain from punishing harmful acts against others if enforcement costs outweigh the benefit, such as with minor, hard-to-detect thefts. This second difference is traceable directly to enforcement costs. For Bentham, punishment is always an expense; if the price exceeds the gain in security, the act remains unpunished not because it is right, but because coercion is too dear. He distinguishes between the *grounds* for punishment (mischievousness) and the *reasons for abstaining* (expediency). A liberal harm principle often implies a duty to prevent harm; Bentham implies a permission constrained by cost. Thus, his system is more flexible but less protective of rights than the later Millian formulation suggests. The divergence lies in viewing law as a shield for rights versus a tool for pain management. Enforcement costs include not merely financial expense but the pain inflicted on the offender and the risk of judicial error, all of which weigh against interference even when harm exists. Bentham's restriction is thus economic and calculative, whereas the harm principle is moral and jurisdictional. This makes Bentham's limit contingent on social resources and administrative capacity, not merely on the nature of the act.
