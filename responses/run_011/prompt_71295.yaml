      *   *Case 6: Judge/Covenants (Kept)*
          *   Harm: Racially restrictive covenants (lawful then).
          *   Benefit: Legal aid society.
          *   Context: Lawful/broadly endorsed then.
          *   Petitioners: None (no organized group).
          *   Reasoning: Lawful at time; honored for legal aid; lack of organized local objection.
          *   Vote: 4-3 (Split). Dissent felt "missed the point."

  3.  **Synthesize Implicit Rules (The "Code"):**

      *   *Rule A: The "Direct Victim/Local Petition" Test.* If direct victims or their descendants (local) ask for removal, removal is likely (Superintendent, Benefactor). If no one asks or it's outsiders, retention is likely (Mayor, Naturalist, Judge, Magnate).
      *   *Rule B: The "Legality/Standards of the Time" Defense.* If the harm was legal or standard for the era, retention is likely (Mayor, Magnate, Judge). If the harm exceeded legal requirements or involved known negligence, removal is likely (Superintendent, Benefactor).
      *   *Rule C: The "Honored For" Distinction.* Was the person honored *for* the harmful act, or for something else? If honored for the good thing (Mayor, Magnate, Judge, Naturalist), retention is likely. If the good thing is tainted by the harm (Benefactor - profits from death; Superintendent - ran segregated system), removal is likely.
      *   *Rule D: The "Public vs. Private" Harm.* Private thoughts (Naturalist) get panels. Public actions (Sterilizations, Segregation, Covenants) get harder scrutiny.
      *   *Rule E: The "Practicality" Constraint.* Federal charts (Magnate) or cost (School replacement makes cost a non-issue) matter.

  4.  **Analyze the New Case (Doctor/Sterilizations):**

      *   *Facts:*
          *   Good: Community mental health, beloved, de-institutionalization.
          *   Bad: Non-consensual sterilizations (dozens).
          *   Context: State statute (legal), supported by colleagues (standard?).
          *   Petitioners: Survivors + children (Local, Direct Victims).
          *   Link: Clinic funded by procedure payments. School named for Doctor.
          *   Visibility: Locally unknown.
          *   Cost: Zero (building being replaced).

      *   *Applying Rule A (Victims):* Victims are local and organized. *Predicts: Remove.* (Matches Superintendent, Benefactor).
      *   *Applying Rule B (Legality):* It was legal (state statute) and standard for colleagues. *Predicts: Keep.* (Matches Mayor, Judge, Magnate).
      *   *Applying Rule C (Honored For/Link):* Honored for mental health, but clinic funded by sterilizations. Is the school named for the clinic work or the man? The money link is strong (like Benefactor). *Predicts: Remove (due to funding link) or Keep (due to honor distinction).*
      *   *Applying Rule D (Public/Private):* Public medical procedures. *Predicts: Remove.*
      *   *Applying Rule E (Practicality):* Cost is zero. *Predicts: Remove (no barrier).*
      *   *Applying Rule F (Public Knowledge):* Locally unknown. *Predicts: Keep (Naturalist parallel - don't dig up dirt?)* OR *Remove (Superintendent parallel - truth matters more than fame).*

  5.  **Identify the Conflict:**
      *   The core tension is between **Rule A (Direct Local Harm/Victim Petition)** and **Rule B (Legality/Historical Norms)**.
      *   In the *Judge* case (Covenants), legality + no petition = Keep.
      *   In the *Superintendent* case (Segregation), legality (state law) + petition = Remove. (Wait, Superintendent went *beyond* state law. Doctor followed state law).
      *   In the *Benefactor* case (Tonic), legality (patent meds were often legal) + negligence + petition = Remove.
      *   The Doctor case is the collision: It has the *Petition* of the Superintendent/Benefactor cases, but the *Legality* of the Judge/Mayor cases.

  6.  **Develop the Analysis Structure:**
      *   **Introduction:** Acknowledge the difficulty. State that the commission operates on a hybrid standard, not a single rule.
      *   **The Three Implicit Standards:** Distill the precedents into three competing frameworks.
          1.  *The "Clean Hands" Standard (Benefactor/Superintendent):* Did the good work rely on the bad acts? Are there direct local victims asking?
          2.  *The "Historical Context" Standard (Mayor/Judge/Magnate):* Was it legal/standard then? Was the honor for a different achievement?
          3.  *The "Community Voice" Standard (Naturalist/Judge vs. Superintendent):* Who is asking? Locals vs. Outsiders. Organized vs. None.
      *   **Applying to the Doctor Case:** Show how each standard votes differently.
      *   **The "Plaque/Panel" Question:** Analyze if contextualization is still an option given the Superintendent vote.
      *   **The Decision:** Recommend a path based on consistency.
      *   **Future Testing:** What case would clarify the rule?

  7.  **Refining the "Rules" (Self-Correction/Nuance):**
      *   *Correction on Superintendent:* He went *further* than state law. Doctor followed state law. This is a crucial distinction favoring "Keep."
      *   *Correction on Benefactor:* Her product killed people *and she knew*. Doctor followed a statute. This favors "Keep."
      *   *Correction on Judge:* Covenants were lawful, but he also built legal aid. Kept because no one asked. Doctor: Victims *did* ask. This favors "Remove."
      *   *Key Differentiator:* The *Source of Funding*. The Benefactor case turned on the hospital being built *from* the profits of the harm. The Doctor's clinic was kept running *by* the state payments for sterilizations. This is a very strong link to the Benefactor case.
      *   *Key Differentiator:* The *Petition*. The Judge case was kept largely because "no organized group had asked." The Doctor case has survivors. This aligns with Superintendent/Benefactor.

  8.  **Drafting the Response:**
