      *Wait, one more nuance:* The Naturalist case got a panel. The Superintendent case rejected a panel. Why? Naturalist: Private journals, no local victims. Superintendent: Public policy, direct local victims. Doctor: Public medical procedure, direct local victims. This suggests a panel is *not* on the table if we follow the Superintendent precedent.

      *Final check on the "Legality" point:* The Mayor (mill conditions) and Judge (covenants) and Magnate (strikebreaking) were all "legal/standard." They were kept. The Superintendent (segregation) and Benefactor (negligence/death) were removed. The Doctor is "Legal/Standard" (like Mayor/Judge) BUT has "Direct Victims Petitioning" (like Superintendent/Benefactor). The Judge case specifically noted "no organized group had asked." The Doctor case *has* an organized group. This suggests the "Petition" factor might trump the "Legality" factor.

