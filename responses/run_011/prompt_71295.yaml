      *   **Input Data:** Six past cases (Mayor/Mill, Superintendent/Segregation, Naturalist/Journals, Benefactor/Tonic, Magnate/Strikebreakers, Judge/Covenants) and one new case (Doctor/Sterilizations).
      *   **Constraints:** Need to identify compatible rules, see where they split on the new case, discuss the "plaque/panel" compromise option, and define what future cases would distinguish the rules.

