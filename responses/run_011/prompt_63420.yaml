answer: |-
  1. Philosophers argue manipulation violates autonomy by subverting decision-making, which translates to our standard of "unfair" framing that tricks readers rather than informing them. What vanishes is the notion that a piece can be technically fair yet still disrespect the reader's agency as an end in themselves.
  2. The claim that manipulation treats people as mere means becomes our prohibition against using readers solely for engagement metrics, but this reduces a moral status issue to a business ethics conflict. We lose the idea that exploiting a reader's psychology is wrong even if it benefits them or harms no one else.
  3. The claim that manipulation's distinctive wrong lies in bypassing a person's capacity to respond to reasons rather than in deceiving them, when tested against two accurate headlines, reveals that our term "sensational" captures the style but not the subversion of reason. Both headlines meet our accuracy standard, yet the clickier one exploits bias without lying, leaving us without a word for accurate content that undermines rational choice.
  4. Where philosophers distinguish hidden influence from open persuasion, we rely on transparency and sourcing to signal trustworthiness to the audience. This translation fails because disclosing a bias does not neutralize its psychological power, meaning a transparent piece can still manipulate as effectively as a hidden one.
  5. Words like "unfair," "misleading," and "sensational" do not do all the work philosophers think the manipulation distinction does because they presuppose falsehood or rule-breaking rather than psychological subversion. Something real goes missing on our side of the ledger, specifically the ability to critique accurate content that successfully bypasses a reader's critical faculties without triggering our corrections policy.
