  2.  **Deconstruct the Core Argument (Dispositional Criterion):**
      *   *Revisionism:* Willing to update beliefs based on evidence. Treats claims as falsifiable.
      *   *Denialism:* Treats the core claim as unfalsifiable. Uses *inverted scrutiny* (hyper-skepticism for opposing evidence, hyper-credulity for supporting "evidence") and *auxiliary proliferation* (ad hoc hypotheses to save the core belief without independent testing).
      *   *Epistemic Status:* It's a vice of character/system, not just a methodological error.

  3.  **Drafting - Section by Section:**

      *   **Introduction/Setup:** Acknowledge the user's premise. The standard criteria (consensus, method, motive) fail. Consensus is conservative; Method is mimicry; Motive is inaccessible. The dispositional turn is the right move.

      *   **Task 1: Method vs. Disposition (Prospective Power):**
          *   *Problem with Method:* Denialists mimic method (footnotes, archives). If we judge by form, they pass. If we judge by *accuracy*, we need to know the truth beforehand (post hoc).
          *   *Dispositional Advantage:* We can spot the *pattern of engagement* before the final verdict is in. It's about *how* they handle counter-evidence, not just whether they are right.
          *   *Key distinction:* Revisionists treat anomalies as problems to solve (potentially by changing the theory). Denialists treat anomalies as attacks to deflect (by changing the perimeter).

      *   **Task 2: The Killer Objection (Observability of Dispositions):**
          *   *Objection:* Dispositions are internal mental states. We only see behavior. If we infer disposition from behavior, aren't we just looking at method again?
          *   *Counter:* Dispositions aren't ghosts; they are *predictive patterns of inference*. We don't need mind-reading; we need *sequence analysis*.
          *   *The Test:* It's not "does this footnote exist?" It's "what happened to this footnote when it was challenged?"
          *   *Analogy:* Popperian falsificationism applied to the *historian*, not just the history. A scientific community is defined by its response to refutation.
          *   *Answer:* It doesn't collapse into method because method is static (snapshot), disposition is dynamic (movie). We observe the *trajectory* of argumentation.

      *   **Task 3: Hard Cases (Nanjing & Partisans):**
          *   *Nanjing:* Distinguish between "How many died?" (revisionist range) and "Did the massacre happen?" (denialist core). The denialist line isn't the low number; it's the claim that *all* evidence of high numbers is a fabrication conspiracy.
          *   *The Partisan/Survivor:* This is the trickiest. A survivor insisting on a specific number might look dogmatic.
          *   *Distinction:* Identity-fusion isn't necessarily epistemic closure. If the survivor says, "I believe X, but if you show me document Y, I must reconsider," they are revisionist. If they say, "Document Y is fake because it contradicts my memory," they are drifting toward denialism.
          *   *Principled Line:* It's not about *conviction*; it's about *conditions for surrender*. The partisan must be able to articulate what would change their mind. If the answer is "nothing," it's denialism. If the answer is "evidence Z," it's not.
          *   *Bite the Bullet:* Yes, some committed activists *are* epistemically compromised. We shouldn't excuse them just because their politics are "right."

      *   **Task 4: Vulnerability (Where the User Will Lose the Room):**
          *   *Vulnerability 1: The Time Lag.* Dispositions take time to observe. In a courtroom or public debate, you need a quick ruling. This criterion is slow.
          *   *Vulnerability 2: The "New Paradigm" Problem.* Kuhnian shifts look like denialism initially. Galileo looked dogmatic to the Church. How do we distinguish the stubborn truth-teller from the stubborn liar *in media res*?
