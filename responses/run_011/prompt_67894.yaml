      *   Use the user's terminology (inverted scrutiny, auxiliary proliferation).
      *   Be direct about the risks.

  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I avoid references? Yes.
      *   *Check:* Did I address the "observable" objection strongly enough? I need to make sure I don't just say "we watch them." I need to explain *why* that isn't just method. *Correction:* Emphasize that method is about *validity of steps*, disposition is about *response to failure of steps*.
      *   *Check:* Nanjing case. Make sure not to validate denialism. The distinction is between *counting* (revisionist) and *erasing* (denialist).
      *   *Check:* The "Partisan" issue. This is ethically sensitive. Need to separate moral authority from epistemic reliability.

  6.  **Final Polish:** Ensure the structure matches the prompt's requirements exactly. (Argument build -> Killer Objection -> Hard Cases -> Vulnerabilities -> Falsification of the argument itself).

  *(Self-Correction on the "Observable" point)*: I need to be careful not to slip into behaviorism. The argument is that the disposition *is* the pattern of behavior over time. It's not a hidden mental state; it's a public track record. That's the key to avoiding the "empty criterion" charge.

  *(Self-Correction on "Partisan")*: I should explicitly state that moral righteousness does not grant epistemic immunity. This is a hard pill for historians to swallow, but necessary for the argument's integrity.

  7.  **Final Output Generation** (incorporating the above thoughts into the structured response).
answer: |-
  Here is the argument built out, pushed hard, with the soft spots exposed.

  ### The Dispositional Criterion: Epistemic Vice vs. Methodological Error

  Your intuition is correct: the standard criteria are dead. Consensus is merely sociological; method is easily mimicked (the "Gish Gallop" of footnotes); motive is unknowable and ubiquitous. The dispositional turn is the only way to salvage the distinction without begging the question.

  The core claim is this: **Denialism is not a false conclusion; it is a fixed relationship to evidence.** It is a closed doxastic system. Revisionism is an open one. The difference is not what they believe, but the *cost* they are willing to incur to maintain that belief.

  #### 1. Why Disposition Beats Method (Prospectively)

  The method criterion fails because it is static. It looks at a text and asks, "Does this adhere to the conventions of the discipline?" Since denialist literature is now produced by people trained in the discipline (or adept at mimicking it), they pass the static test. They cite archives. They question sources. They offer alternative causal mechanisms.

  The dispositional criterion works because it is **dynamic**. It does not judge the move; it judges the *response to the counter-move*.

  *   **Revisionism:** Treats the core claim as a hypothesis. When a significant anomaly arises (e.g., a new document contradicting the Wannsee timeline), the revisionist absorbs the cost. They modify the theory. The theory shrinks or shifts to accommodate the evidence.
  *   **Denialism:** Treats the core claim as an axiom. When an anomaly arises, the theory does not shift; the *perimeter* expands.

  This allows for prospective identification. You do not need to know the final truth of the matter to spot denialism. You only need to observe the **trajectory of argumentation**. If a historian advances Claim A, and when Evidence B contradicts A, they do not modify A but instead claim Evidence B is forged, and when the forgery is disproven, they claim the experts analyzing the forgery are part of a cartel, you have identified the disposition *before* you have verified the forgery.

  The method criterion asks: "Is the footnote real?" The dispositional criterion asks: "What happens to your argument if the footnote is proven fake?" If the answer is "Nothing, because I have three other untested reasons," you are watching denialism in real-time. This is not post hoc rationalization; it is real-time tracking of immunization strategies.

  #### 2. The Killer Objection: Dispositions Are Not Observable

  The objection is that dispositions are mental states. We cannot see "dogmatism"; we only see "arguing." Therefore, to call something dogmatic, we must first judge the argument as bad. Thus, the criterion collapses back into method or truth.

  **The Response:** Dispositions are not ghostly mental states; they are **public patterns of inference over time**.

  We do not need mind-reading to identify a disposition. We need **sequence analysis**. A disposition is a conditional: *If* P is challenged, *then* Q occurs.
  *   **Observable:** The historian asserts X.
  *   **Observable:** Evidence Y contradicts X.
  *   **Observable:** The historian introduces Hypothesis Z to explain away Y, without independent evidence for Z.
  *   **Observable:** Hypothesis Z is challenged.
  *   **Observable:** The historian abandons Z for Hypothesis W, rather than revising X.

  This is not collapsing into method. Method evaluates the validity of step Z. Disposition evaluates the *serial replacement* of Z with W to protect X.

  **The "Galileo" Problem:** The objection usually invokes the stubborn truth-teller. Galileo looked dogmatic to the Church. He held a disposition that resisted evidence (geocentric observations). Was he a denialist?
  **Answer:** No, because Galileo offered a **path to surrender**. He specified what evidence *would* change his mind (phases of Venus, stellar parallax). He was risking his position on specific, observable outcomes. The denialist specifies no such conditions. Their "evidence" is always negative (the other side is lying) rather than positive (here is the mechanism that explains the data better).

  We can observe this difference prospectively. If a historian says, "I believe X, and only document Y could change my mind," and document Y appears, we watch what they do. If they say "Y is fake" without forensic proof, the disposition is revealed. We don't need to know if X is true yet. We know the *system* is closed.

  #### 3. Hard Cases: Nanjing and the Partisan

  **Nanjing:**
  This is the stress test because the "numbers game" is legitimate historiography.
  *   **Revisionist:** "The casualty figures range from 40,000 to 300,000 depending on how we define 'massacre victim' and which archives we trust. New forensic data suggests the lower end is more likely."
  *   **Denialist:** "The massacre was invented. The photographs are doctored. The testimonies are coerced. The high numbers are propaganda."

  The line is not the number. The line is the **treatment of the corpus**. The revisionist treats the evidence as a puzzle where pieces might be missing or mislabeled. The denialist treats the evidence as a hostile attack that must be neutralized.
  In the dispositional account, the denialist is identified by **inverted scrutiny**. They demand forensic perfection for testimony supporting the massacre (pointing out inconsistencies in memory) while accepting zero evidentiary burden for claims of forgery (asserting "it's possible" without proving the act of forgery).
  *Verdict:* The dispositional criterion handles this. It allows the numbers to fluctuate wildly (revisionism) but flags the claim of "total invention" as denialist because it requires a conspiracy of evidence production that is never positively demonstrated, only negatively inferred.

  **The Committed Partisan (The Survivor/Marxist):**
  This is where you will lose the room.
  If a survivor insists, "I know 300,000 died because my family was there," and refuses to entertain demographic studies suggesting 50,000, are they a denialist?
  **You must bite the bullet:** **Yes, epistemically.**
  Moral authority does not grant epistemic immunity. If a historian (survivor or not) holds a claim in a way that no evidence could dislodge, they are operating a closed doxastic system.
  *   **The Principled Line:** Can they articulate a falsification condition?
      *   **Partisan:** "I believe 300,000 died. If a mass grave is found with only 10,000 bodies and no evidence of cremation, I would have to revise." -> **Revisionist.**
      *   **Dogmatist:** "I believe 300,000 died. If a mass grave is found with 10,000 bodies, it means the others were cremated elsewhere/hidden/lost." -> **Denialist.**

  The identity fusion is irrelevant to the epistemic structure. If the commitment prevents the updating of the model, it is a vice. We may *sympathize* with the survivor's need for the number to be high (justice, memory), but we cannot call it *history* in the same sense. It is testimony, it is memory, it is politics—but if it claims to be empirical history while refusing empirical constraints, it fits the dispositional definition of denialism.
  *Hard Truth:* If you defend the survivor's right to ignore demographic data because of their trauma, you surrender the criterion. You revert to "motive" or "consensus." You must argue that trauma explains the vice, but does not excuse it epistemically.

  #### 4. Where You Will Lose the Room (Vulnerabilities)

  Here are the three points where this argument is most exposed. If you are presenting this, prepare for these attacks.

  **1. The Time-Lag Problem (The "In Media Res" Failure)**
  The dispositional criterion requires observing a *sequence* of argumentation. It needs time. In a courtroom, a public debate, or a tenure review, you often need a judgment *now*.
  *   *Attack:* "You're telling us we can't identify denialism until the historian has been proven wrong three times? By then, the damage is done. The method criterion gives us a checklist for immediate assessment."
  *   *Weakness:* Your criterion is retrospective by necessity. It identifies denialism by its *history of resistance*, not its current state. You cannot use it to ban a book on publication; you can only use it to discredit the author after they have engaged with criticism.

  **2. The Asymmetry of Orthodoxy**
  Your criterion applies equally to the establishment. Mainstream history is full of "auxiliary proliferation." When the clean-Wehrmacht myth was challenged, did the orthodoxy immediately surrender? No. They generated rescue hypotheses. They questioned sources. They protected the core.
  *   *Attack:* "By your definition, the orthodox establishment was 'denialist' about the Wehrmacht until the evidence became overwhelming. You are defining denialism as 'losing an argument.' The difference between the Wehrmacht revisionists and the Holocaust deniers is just that the revisionists *won*."
  *   *Weakness:* This risks making denialism synonymous with "being on the wrong side of a paradigm shift." You need a robust account of why the Wehrmacht rescue hypotheses were eventually tested and discarded, whereas denialist hypotheses are never tested, only swapped. (The answer is: engagement with the wider community, but this circles back to consensus).

  **3. The "True Conspiracy" Edge Case**
  Sometimes, the world *is* conspiratorial. Sometimes, documents *are* forged by states.
  *   *Attack:* "If a historian claims the archives are doctored by the state, and they are right (e.g., Soviet archives, Stalinist purges), your criterion flags them as denialist (auxiliary proliferation) until they are vindicated. You punish the whistleblower."
  *   *Weakness:* The dispositional criterion struggles with high-stakes skepticism where the "rescue hypothesis" (the archives are fake) turns out to be true. You need to distinguish between *systemic* skepticism (all evidence against me is fake) and *localized* skepticism (this specific archive is compromised).

  #### 5. What Would Change My Mind

  If I were arguing against you, here is what would make me abandon the dispositional criterion and retreat to method:

  1.  **A Case of "Virtuous Dogmatism":** If you can show me a historical truth that was *only* preserved because a historian refused to update their belief in the face of overwhelming contrary evidence, and that refusal was epistemically necessary to protect the truth until new evidence emerged. (i.e., If the dispositional vice was actually a protective mechanism for truth).
  2.  **The Impossibility of Sequence:** If it can be demonstrated that historical knowledge is produced in isolated monads (single books, single articles) without ongoing dialogue. If historians do not actually engage in the back-and-forth required to observe the "sequence of inference," then the disposition is unobservable in practice, rendering the criterion useless for actual evaluation.
  3.  **The Political Necessity of Consensus:** If the function of the "denialism" label is not epistemic hygiene but social cohesion. If the goal is to protect a vulnerable community from harm, and the dispositional criterion allows "polite" denialism to continue under the guise of "open inquiry," then the epistemic purity of your argument fails the ethical test. (i.e., If stopping the harm requires banning the *content* regardless of the *disposition*).

  ### Summary of the Push

  Stick to the **dynamic** nature of the claim. Denialism is a *process*, not a product.
  *   Don't let them hide behind "method." Method is the camouflage.
  *   Don't let them hide behind "trauma/identity." Epistemology is blind to moral status.
  *   Admit the time-lag weakness. It's a diagnostic tool for the community, not a gavel for the judge.

  The strength of this argument is that it makes denialism a **behavioral category** accessible to observation, rather than a **moral category** accessible only to judgment. It strips the denialist of the victimhood of "being silenced for their views" by showing they are being critiqued for their *refusal to view*.

  If you hold that line, you force the opponent to either admit they will not change their mind (confirming your thesis) or commit to a falsification condition (entering your game). That is the checkmate.
