      *   **Task 5: What Would Change My Mind:**
          *   If a case shows *auxiliary proliferation* leading to truth (e.g., a "conspiracy" theory that turned out true).
          *   If we find a denialist who is genuinely willing to update but is structurally prevented (e.g., state censorship makes them look dogmatic).

  4.  **Refining the Tone:**
