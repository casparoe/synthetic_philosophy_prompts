prompt: |-
  I've gotten stuck in a rut arguing with my brother about whether it's actually wrong to eat meat, drive everywhere, or skip voting. His whole thing is "one person changes nothing, so you're off the hook," and I keep having intuitions pulling the other way but I can't say what they're tracking. Before I read anything else on this, write out the spec: what would a theory of individual responsibility in collective harm have to deliver to count as adequate — adequate for deciding what I should do, not just for winning the argument. I've been making up my own test cases, so use them and tell me which are genuine requirements and which are just me being squeamish:

  - a machine with 1000 buttons where yours is guarenteed to be one of 999 that do nothing, and one of them fires it, but nobody can tell which — you don't even know whether you triggered it
  - the landslide: your vote would have mattered only in a tie that didn't happen, and you couldn't have known that beforehand
  - the doomed pond: everyone else is definitely going to poison it anyway, so your not dumping changes nothing
  - the one-in-a-million: your act raises the odds someone gets hurt from 1 in 1,000,000 to 1 in 999,999
  - buying the last unit that tips an order vs. buying one in the middle of a huge order

  Also, which distinctions does it have to keep apart that people keep smushing together — causing vs contributing vs benefiting vs just being part of it, and whether "what if everybody did that" is a separate question or a cheat. Say for each requirement why it's a requirement. And most of all: is there some subset of these that can't all be satisfied at once, and which single requirement knocks out the most standard answers?
reasoning: |-
  Here's a thinking process that leads to the suggested specification:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is arguing with their brother about individual responsibility in collective harm (eating meat, driving, voting).
      *   **Brother's Stance:** "One person changes nothing, so you're off the hook" (Nihilism/Fatalism about individual impact).
      *   **User's Intuition:** Something feels wrong with that, but they can't articulate why.
      *   **Task:** Write a *specification* for a theory of individual responsibility in collective harm.
      *   **Constraints:**
          *   Must be adequate for *deciding what to do*, not just winning the argument.
          *   Must evaluate the user's provided test cases (distinguish genuine requirements from squeamishness).
          *   Must identify key distinctions (causing vs. contributing, etc.).
          *   Must identify tensions/incompatibilities (which subset can't be satisfied, which requirement knocks out standard answers).
      *   **Tone:** Philosophical, rigorous, practical, direct.

  2.  **Deconstruct the Core Problem:**
      *   The problem is the "Inefficacy Objection" or the "Problem of Overdetermination."
      *   If my action doesn't *causally* change the outcome (because others would have done it anyway, or the threshold wasn't met), am I morally responsible?
      *   The brother says No (Causal Impact Requirement).
      *   The user feels Yes (Complicity/Integrity Requirement).
      *   An adequate theory must bridge this gap without demanding impossible saintliness or allowing total abdication.

  3.  **Evaluate the Test Cases:**
      *   *1000 Buttons (Random Trigger):* One fires, 999 don't. You press one. Did you cause the harm? Maybe. This tests *risk* and *uncertainty*.
      *   *The Landslide (Voting):* Vote didn't change the outcome. Tests *counterfactual impact*.
      *   *The Doomed Pond (Overdetermination):* Everyone else poisons it. Your contribution is negligible/unnecessary. Tests *redundancy*.
      *   *One-in-a-Million (Risk Aggregation):* Tiny increase in probability. Tests *expected utility* vs. *actual outcome*.
      *   *Threshold Cases (Last Unit vs. Middle):* Tipping point vs. marginal contribution. Tests *non-linear impact*.

      *   *Analysis:* Which are genuine requirements?
          *   Genuine: We need to handle uncertainty (Buttons), redundancy (Pond), and probability (1-in-a-million).
          *   Squeamishness: Possibly the demand for *certainty* of impact. If the theory requires "I must know I changed the outcome," it fails the Voting/Pond cases. The user needs to accept that responsibility might exist *without* visible impact.

  4.  **Identify Key Distinctions:**
      *   *Causation vs. Contribution:* Did I make it happen, or did I play a part?
      *   *Outcome vs. Process:* Is morality about the result or the act itself?
      *   *Complicity:* Am I tainted by participating in a bad system even if I didn't drive it?
      *   *"What if everybody did that?":* Is this a logical generalization (Kantian) or a causal prediction (Utilitarian)? It's often used as a cheat to avoid the individual case.

  5.  **Drafting the Spec - Section by Section:**

      *   **Introduction:** Acknowledge the stalemate. Define the goal (Action-Guidance, not just theory).
      *   **Core Deliverables (The "Must-Haves"):**
          1.  *Handle Overdetermination:* Must explain why the "Doomed Pond" doesn't absolve you. (Brother's main point).
          2.  *Handle Uncertainty:* Must handle the "1000 Buttons" (epistemic limits).
          3.  *Handle Thresholds:* Must distinguish between the "Last Unit" and "Middle Unit" without saying the middle one is *nothing*.
          4.  *Action-Guidance:* Must tell you what to do *before* the outcome is known (ex-ante vs. ex-post).
          5.  *Non-Aggregation:* Must avoid demanding you sacrifice everything for negligible gains (burnout).

      *   **Evaluating the Test Cases:**
          *   *Buttons:* Genuine. Deals with risk.
          *   *Landslide:* Genuine. Deals with counterfactuals.
          *   *Doomed Pond:* Genuine. Deals with overdetermination.
          *   *1-in-a-Million:* Genuine. Deals with expected value.
          *   *Last Unit:* Genuine. Deals with thresholds.
          *   *Verdict:* None of these are just "squeamishness." They are structural features of the problem. The "squeamishness" is expecting *comfort* in the answer.

      *   **Key Distinctions:**
          *   *Causal Efficacy vs. Moral Complicity:* This is the big one. Brother focuses on efficacy. User needs complicity.
          *   *Ex-Ante vs. Ex-Post:* Judging the decision when made vs. judging after results.
          *   *Generalization vs. Causation:* "What if everyone" is about principle, not causal chain.

      *   **The Tension (The "Impossible Trinity"):**
          *   This is the crucial philosophical insight.
          *   Constraint 1: **Individual Difference Principle** (You are only responsible if you make a difference).
          *   Constraint 2: **Collective Harm Reality** (Harms happen through many small acts where no single one makes a difference).
          *   Constraint 3: **Moral Responsibility** (People are responsible for these harms).
          *   *Conflict:* You can't have all three. Usually, Constraint 1 is the one that must go to save 2 and 3.
          *   *The Knockout:* The "Individual Difference Principle" is the requirement that knocks out standard answers (like simple Utilitarianism).

  6.  **Refining the Output:**
      *   Make it structured like a technical specification (as requested).
      *   Ensure the tone is empathetic but rigorous.
      *   Check against the prompt: "Before I read anything else... write out the spec."
      *   Ensure I answer: "Which single requirement knocks out the most standard answers?" (Answer: The requirement that responsibility tracks *actual* causal difference rather than *expected* contribution or complicity).

  7.  **Self-Correction/Review during drafting:**
      *   *Initial thought:* Maybe tell them to read Parfit.
      *   *Correction:* No, prompt says "Before I read anything else." Stick to generating the spec.
      *   *Initial thought:* Dismiss the "Doomed Pond" as unrealistic.
      *   *Correction:* No, it's a classic philosophical intuition pump (Overdetermination). Treat it seriously.
      *   *Focus:* Make sure to distinguish between "winning the argument" and "deciding what to do." The spec must be practical.
      *   *Refining the "Squeamishness" part:* The user asked to tell them which are genuine requirements and which are squeamishness. Actually, looking closely, the *cases* are genuine problems. The *squeamishness* might be the desire for a theory that doesn't feel burdensome. I need to clarify that the *cases* track real logical hurdles, not just emotions.

  8.  **Final Polish:** Check the "Impossible Trinity" section. This is the philosophical meat. It needs to be clear that the Brother's view relies on the "Individual Difference Principle," and that's exactly what fails in collective action problems.

  9.  (Final check of prompt requirements):
      *   Write out the spec.
      *   Adequate for deciding what to do.
      *   Use the test cases (genuine vs. squeamish).
      *   Distinctions (causing vs contributing, etc.).
      *   Subset that can't be satisfied.
      *   Single requirement that knocks out standard answers.

      *Okay, ready to write.*
answer: |-
  Here is the specification for a theory of Individual Responsibility in Collective Harm (IRCH).

  This is not designed to help you win the argument. It is designed to help you sleep at night while making decisions. If a theory cannot meet these specs, it is philosophically interesting but practically useless for your life.

  ### I. Core Deliverables
  To count as adequate, the theory must output a clear verdict on **action-guidance** (what to do now) and **moral status** (how to judge yourself later) in the following conditions:

  1.  **The Overdetermination Clause:** It must explain why you are not absolved simply because others would have done the harm anyway.
      *   *Why:* Your brother's argument rests entirely on this. If the theory says "If the outcome is fixed by others, you are innocent," it validates nihilism and fails to stop collective harm.
  2.  **The Epistemic Limit Clause:** It must function under uncertainty. You rarely know if you are the threshold trigger.
      *   *Why:* In the real world (voting, supply chains), you act *ex-ante* (before knowing the result). A theory that only judges you *ex-post* (after knowing the outcome) is useless for decision-making.
  3.  **The Non-Linearity Clause:** It must account for threshold effects without making morality a lottery.
      *   *Why:* In the "Last Unit" case, one person triggers the harm. In the "Middle Unit" case, they don't. A theory that says the Middle Person is *innocent* and the Last Person is *guilty* makes morality depend on luck, not intent or principle.
  4.  **The Aggregation Clause:** It must explain how tiny probabilities sum to moral weight.
      *   *Why:* If you reject the "1-in-a-million" risk as morally zero, you justify all systemic harm, since almost all individual contributions to systemic harm are probabilistic and tiny.
  5.  **The Sanity Clause:** It must not demand impossible sacrifice.
      *   *Why:* If the theory implies you must isolate yourself completely to avoid complicity in a broken system, it is self-defeating. You cannot act morally if you are dead or incapacitated by guilt.

  ---

  ### II. Evaluation of Your Test Cases
  You asked which of these are genuine requirements and which are you being "squeamish."

  **Verdict: All five are genuine structural requirements. None are squeamishness.**
  Your intuition is tracking real logical problems in ethics, not just emotional discomfort. Here is why each one is a hard constraint the theory must solve:

  *   **1000 Buttons (The Risk Problem):** *Genuine.* This tests whether responsibility tracks **outcomes** or **risk imposition**. If you press a button with a 1/1000 chance of killing someone, are you a murderer if it fires, and harmless if it doesn't? An adequate theory must judge the *act of pressing*, not just the *explosion*.
  *   **The Landslide (The Counterfactual Problem):** *Genuine.* This tests **causal efficacy**. If your vote didn't change the winner, did it matter? A theory that says "No" makes voting irrational. A theory that says "Yes" must explain *how* it mattered without lying about the math.
  *   **The Doomed Pond (The Overdetermination Problem):** *Genuine.* This is the hardest one. If the water is poisoned regardless of you, is your poison still wrong? If the theory says "No," it allows people to join lynch mobs or carbon-emitting societies guilt-free.
  *   **The One-in-a-Million (The Expected Value Problem):** *Genuine.* This tests **mathematical coherence**. If 1,000,000 people each add 1/1,000,000 risk, one person dies. If you say your 1/1,000,000 is morally zero, the math doesn't sum to the death. The theory must explain how a non-zero moral weight attaches to a negligible causal contribution.
  *   **Last Unit vs. Middle Unit (The Threshold Problem):** *Genuine.* This tests **fairness**. It feels unjust that the person who buys the 10,000th burger is a "killer" but the person who buys the 9,999th is "clean," when both wanted the same meal and supported the same industry.

  **Where the squeamishness actually is:**
  Your squeamishness isn't in the *cases*; it's in the desire for a theory that lets you feel **clean**. You want a theory that says, "I did the right thing, and the world is better because I did it." An adequate theory might have to tell you: "You did the right thing, but the world is the same, and you are still complicit." That hurts, but it's honest.

  ---

  ### III. Critical Distinctions
  The theory must keep these concepts separate. Your brother is smushing them together to win the argument.

  1.  **Causal Efficacy vs. Moral Complicity**
      *   *Smushed:* "I didn't cause the climate change, so I'm not responsible."
      *   *Separated:* You may not have *caused* the outcome (efficacy), but you *participated* in the mechanism that did (complicity). Responsibility can attach to participation even when causation is diluted.
  2.  **Ex-Ante Rationality vs. Ex-Post Luck**
      *   *Smushed:* "My vote didn't matter (ex-post), so it was stupid to vote (ex-ante)."
      *   *Separated:* Voting can be the rational moral choice at the time (ex-ante) even if it turns out to be causally irrelevant later (ex-post). You are judged on the decision, not the lottery result.
  3.  **Generalization vs. Causation ("What if everybody did that?")**
      *   *Smushed:* Using "What if everybody did that?" as a causal threat. (i.e., "If I eat this burger, everyone will.")
      *   *Separated:* This is a **Kantian** test of principle, not a **Utilitarian** prediction of outcome. It asks: "Can I will this to be a universal law?" It is not a cheat; it is a test of whether you are making yourself an *exception* to a rule you rely on others to follow.
  4.  **Influence vs. Control**
      *   *Smushed:* "I can't control the industry, so I have no responsibility."
      *   *Separated:* You lack *control* over the system, but you retain *influence* (market signal, social norm, personal integrity). Responsibility tracks influence, not total control.

  ---

  ### IV. The Impossible Trinity (The Tension)
  Here is the hard truth. There is a subset of requirements that **cannot all be satisfied at once**. You must choose which one to drop.

  1.  **The Individual Difference Principle:** You are only responsible for harm if your action made a tangible difference to the outcome.
  2.  **The Collective Harm Reality:** Significant harms (climate change, factory farming, election outcomes) are produced by masses of individuals where no single individual makes a tangible difference.
  3.  **The Responsibility Intuition:** Individuals are morally responsible for their participation in these harms.

  **The Conflict:**
  *   If you keep **(1) and (2)**, you must drop **(3)**. (This is your brother's view: Harm is real, individuals make no difference, therefore individuals are not responsible. Result: Moral Nihilism).
  *   If you keep **(1) and (3)**, you must drop **(2)**. (This is the "Magic Bullet" view: You must believe your individual vote or burger actually stops a specific animal or elects a specific candidate. Result: Delusion).
  *   If you keep **(2) and (3)**, you must drop **(1)**. (This is the **Complicity View**: Harm is real, individuals are responsible, therefore responsibility *does not require* making a tangible difference. Result: Moral Burden).

  **To decide what to do, you must drop Requirement #1 (The Individual Difference Principle).**
  If you hold onto the idea that "I am only responsible if I change the outcome," you will always lose to your brother, because in collective harm problems, he is mathematically right about the outcome. You must accept that responsibility tracks **participation in a harmful scheme**, not **sole causation of the result**.

  ---

  ### V. The Knockout Requirement
  **Which single requirement knocks out the most standard answers?**

  **The Epistemic Limit Clause (Ex-Ante Guidance).**

  Most standard ethical theories (especially simple Consequentialism) fail here.
  *   **Simple Consequentialism** says: "Do the act that produces the best outcome."
      *   *Failure:* In the "Landslide" or "Doomed Pond" case, the outcome is fixed regardless of your act. Therefore, Consequentialism says your act is neutral. This validates your brother.
  *   **Deontology (Rules)** says: "Follow the rule (e.g., Do Not Kill)."
      *   *Failure:* It struggles to explain why buying a burger is "killing" when the animal is already dead or would have died anyway.

  **The Winner:** A hybrid theory of **Expected Utility + Complicity**.
  To satisfy the spec, the theory must judge you on the **expected value** of your action at the time you took it (handling the 1-in-a-million and Buttons cases), combined with a duty of **non-participation** in unjust systems (handling the Pond and Landslide cases).

  **Summary for your decision:**
  You cannot prove to your brother that you "changed anything." You won't find that evidence.
  To move forward, you must accept that **integrity is not about efficacy.**
  *   **Brother's Metric:** Did I stop the bad thing? (No? Then why bother?)
  *   **Your Metric:** Did I align my actions with the world I want, regardless of whether I single-handedly built it?

  If the theory you adopt requires you to prove you made a difference to be innocent, you will remain in the rut. The adequate theory tells you: **You are responsible for your contribution, not the total sum.**
