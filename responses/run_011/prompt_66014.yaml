answer: |-
  ### Exam Question

  **Time Allowed:** 60 Minutes
  **Total Marks:** 25

  **Question:**
  A regional agricultural authority proposes to rank pest-management regimes—broad-spectrum spraying, targeted baiting, mating disruption, sterile-insect release, and land left fallow—by a single figure of merit. For each regime, the authority calculates a score by summing over the affected animals the product of: (1) the probability that they are sentient, (2) the number of individuals, (3) the intensity of their suffering, and (4) its duration. The authority treats the regime with the lowest such "sentience-weighted harm score" as the one it is morally required to adopt.

  Critically evaluate the moral adequacy of this decision procedure. Do not argue for the superiority of one specific regime over another. Instead, focus on the structural assumptions the procedure makes regarding population ethics, counterfactual baselines, and the treatment of moral uncertainty. Is the formula capable of delivering the moral guidance the authority claims it provides?

  ***

  ### Model Answer

  The proposed decision procedure attempts to operationalize utilitarian concern for insects by reducing moral weight to a calculable variable. While the intention to minimize suffering is commendable, the procedure relies on four structural assumptions that render it philosophically untenable as a binding moral requirement. It mistakes mathematical precision for moral accuracy by ignoring problems of counterfactual baselines, non-identity, the nature of sentience probabilities, and aggregation.

  First, the formula assumes a stable counterfactual baseline regarding the lives of spared insects. By calculating harm based on the suffering inflicted by the regime, the procedure implicitly assumes that insects not killed by the regime would otherwise have lived lives worth living, or at least lives comparable to the baseline. However, in agricultural contexts, "sparing" an insect via mating disruption or fallow land often merely delays death by starvation, parasitism, or predation, which may be more painful than rapid pesticide death. If the alternative to spraying is a slow death by wasp larvae, the "harm" calculated by the authority is net positive rather than negative. The formula treats existence as a constant good to be preserved, failing to account for the quality of the life trajectory that the regime permits.

  Second, the procedure collapses the Non-Identity Problem. Different regimes do not merely affect the *same* population differently; they bring *different* individuals into existence. Sterile-insect release and mating disruption prevent specific conceptions. If we choose a regime that allows a different set of insects to be born than the regime we rejected, we cannot say we have harmed the individuals who were never conceived. The formula sums over "affected animals" as if $N$ refers to a fixed group of rights-bearers waiting to be harmed. In reality, selecting a regime determines which $N$ exists. A moral procedure that treats distinct possible populations as interchangeable subjects of harm fails to recognize that we are choosing *who* exists, not just how existing beings are treated.

  Third, the use of a "probability of sentience" ($P$) as a multiplier conflates empirical uncertainty with axiological disagreement. A competent risk assessment multiplies the probability of an event by the magnitude of a known harm. Here, however, the uncertainty is not merely whether a neural state exists, but whether that state constitutes welfare in a way that matters morally. If one holds a conscious-state theory of welfare, $P$ might be high; if one holds a desire-based theory, $P$ might be near zero for insects. Treating $P$ as a scalar multiplier suggests that moral status is a matter of degree akin to statistical risk, rather than a threshold concept or a matter of competing philosophical frameworks. Discounting moral weight by $P$ assumes that expected value theory applies to moral uncertainty, which is contested; it may be that we ought to maximize the minimum moral value (maximin) rather than the expected sum.

  Finally, the instruction to sum these products across individuals assumes that aggregation is unproblematic. It presumes that a large number of low-probability, low-intensity harms can morally outweigh a small number of high-certainty, high-intensity harms. This ignores the "aggregation problem" in population ethics. If the probability of sentience is low, does summing millions of such cases justify imposing a certain, severe harm on a few vertebrate bycatch animals? The formula provides no mechanism for weighing the moral risk to insects against the moral certainty of harm to other beings, nor does it address whether probabilistic harms aggregate linearly.

  In conclusion, the authority's procedure offers false precision. It treats deep metaphysical questions about identity and welfare as empirical variables to be measured. While it forces a systematic consideration of insect suffering, it cannot morally require the adoption of the lowest-scoring regime because the score itself is derived from category errors regarding existence and uncertainty.

  ***

  ### Marking Scheme

  **Total Marks:** 25
  **Pass Mark:** 13

  **Criterion 1: The Counterfactual Baseline (5 Marks)**
  *   **Competent (3-4 marks):** Identifies that the formula assumes spared insects survive. Notes that alternative deaths (starvation/predation) might be worse than pesticide death.
  *   **First-Class (5 marks):** Explicitly frames this as a problem of *comparative harm*. Explains that the formula calculates harm relative to a baseline of "continued life," but fails to establish that the continued life is net-positive. Critiques the assumption that existence is a default good in this context.

  **Criterion 2: The Non-Identity Problem (6 Marks)**
  *   **Competent (3-4 marks):** Mentions that different regimes create different populations. States that we cannot harm those who are never born. May conflate this with standard harm (e.g., "it hurts the future bugs").
  *   **First-Class (5-6 marks):** Clearly distinguishes between *harming existing individuals* and *selecting which individuals exist*. Explains why the variable $N$ is not fixed across regimes. Notes that the procedure treats distinct possible people as interchangeable units of suffering, which violates the person-affecting intuition without justification.

  **Criterion 3: Probability of Sentience vs. Moral Uncertainty (6 Marks)**
  *   **Competent (3-4 marks):** Argues that we don't know if insects are sentient. Suggests that using a probability is risky or speculative. Treats $P$ as standard empirical risk (like the chance of rain).
  *   **First-Class (5-6 marks):** Distinguishes between *empirical risk* (known harm, uncertain occurrence) and *moral uncertainty* (uncertain status of the victim). Argues that multiplying by $P$ assumes Expected Value Theory applies to moral status, which is philosophically contentious. Notes that $P$ masks disagreement about welfare theories (consciousness vs. desire), not just neural complexity.

  **Criterion 4: Aggregation and Summation (4 Marks)**
  *   **Competent (2-3 marks):** Questions whether we can add up small harms. Mentions that lots of small pains might not equal one big pain.
  *   **First-Class (4 marks):** Identifies this as the "aggregation problem." Discusses whether probabilistic moral weights sum linearly. Notes the risk of trading certain severe harms (to bycatch) against aggregated probabilistic harms (to pests).

  **Criterion 5: Evaluation of the Procedure (4 Marks)**
  *   **Competent (2-3 marks):** Concludes the formula is imperfect but useful. Suggests we need more data.
  *   **First-Class (4 marks):** Concludes that the procedure is structurally incapable of binding moral authority because it relies on false metaphysical premises (fixed identity, linear moral risk). Argues that the formula creates an illusion of objectivity.

  ***

  ### Note on Marking the "Precautionary Principle" Answer

  Many candidates will conclude that "ignorance calls for precaution" (i.e., we should assume insects are sentient and minimize harm just in case).

  *   **To earn full marks on Criterion 3 & 5:** An answer relying on the Precautionary Principle must explain *why* the Authority's specific formula fails to capture precaution. Merely stating "we should be careful" is insufficient.
  *   **Penalise if:** The candidate argues that the formula *is* the precautionary principle. The formula discounts harm by probability ($P < 1$); a true precautionary approach might treat $P=1$ regardless of evidence, or reject the summation entirely.
  *   **Requirement:** The candidate must establish that the Authority's procedure is *insufficiently* precautionary because it allows probabilistic discounting. If they argue for precaution, they must argue against the *multiplication by P* specifically. If they simply endorse precaution without critiquing the mathematical operation of the proposed formula, cap Criterion 3 at 3 marks.
