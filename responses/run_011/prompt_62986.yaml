answer: |-
  You are right. Defend the piece as it stands. Do not rewrite it to satisfy his demand for "general truths."

  Here is why you are right, why he is wrong, and the one specific point of his you need to inoculate against before the meeting.

  ### The Core Error: Category Mistake
  The engineer is applying a scientific model of explanation (the "Covering Law" model) to a historical and human subject. In engineering, if a bridge falls, there *must* be a universal law of physics that was violated, and stating that law is the explanation. In history, sociology, and human affairs, there are no universal laws.

  If there were a general truth that "bypasses kill bakeries," then Nether Crompton and Barrowfield wouldn't still have theirs. As you found, when you try to force a general law into a human story, you either state the obvious ("shops close when they run out of money") or you state a falsehood ("bypasses destroy local trade").

  Your readers do not want a sociological paper; they want to understand *this* specific tragedy. Historical explanation works by **contextual intelligibility**, not **universal prediction**. You explain Heseltine's by showing how *this* owner, *this* debt load, *this* specific lease clause, and *this* town's reaction created a unique pressure cooker. That is a valid explanation, even if it doesn't apply to the bakery in the next town over.

  ### Your Test is Sound
  Your "coin flip" test is not nonsense; it is a practical version of what philosophers of history call **counterfactual reasoning**.
  *   **Predictability:** If a reader knows the facts up to the lease letter and can guess the ending, it means you have successfully established a causal chain.
  *   **Non-arbitrariness:** If they look back and it doesn't feel like a coincidence, it means the narrative logic holds.

  If the piece achieves that, it *has* explained the event. It has made the outcome intelligible. The engineer is confusing "explanation" with "prediction via universal law." You have provided explanation via "narrative necessity."

  ### The One Objection That Survives
  There is one part of his critique that you must address, or he will corner you with it. He said: *"The committee agreed with me only because the story was moving, which isn't the same as being convinced."*

  He is distinguishing between **emotional resonance** and **causal clarity**.
  *   **Emotional resonance:** "It was sad, the owner was nice, we miss the smell of bread." (This is just feelings).
  *   **Causal clarity:** "The owner was nice, *but* he was locked into a 15-year repair clause on the oven, *and* the bypass cut footfall by 40%, *and* his son refused to take over, *so* when the lease came up, he had no leverage." (This is explanation).

  Your risk is that the committee nodded along because they were crying, not because they understood the mechanics of the failure. You need to be sure your narrative contains the *mechanics*, even if you don't state them as universal laws.

  ### Strategy for the Meeting
  Do not apologize. Do not offer to rewrite. Frame this as a deliberate editorial choice based on the nature of local history.

  **1. Validate him, then pivot.**
  Start by acknowledging his rigor. "You're right that we shouldn't rely on sentiment. If the piece was just 'it was sad,' it wouldn't be history, it would be eulogy."

  **2. Deploy the Counter-Example.**
  This is your killer argument. "I tried to write the general law you asked for. The law would have to be 'Bypasses cause bakeries to close.' But Nether Crompton and Barrowfield had bypasses and kept their bakeries. Therefore, a general law is factually incorrect. We are explaining *Heseltine's*, not *All Bakeries*."

  **3. Define Your Standard.**
  Explain your test to them simply. "My goal was that if you knew the situation in March 2011, you could have guessed the closure by December. If the chain of events makes the ending feel inevitable *for this specific shop*, then I have done my job. That is how history explains things, not by using engineering formulas."

  **4. Address the 'Moving vs. Convinced' Point.**
  This is where you handle his surviving objection. "I hear your concern that people might be nodding because they're emotional, not because they follow the logic. I invite you to look at the section on the lease renewal. If that logic doesn't hold up on its own, separate from the sadness, then I will fix *that section*. But I will not add general statements that are either trivial or false."

  ### Summary
  He is asking for a scientific proof for a human story. You cannot give it to him without lying. Your piece succeeds if it makes the specific outcome feel inevitable in hindsight. That is valid historical explanation. Stand your ground, but ensure the specific causal links (money, lease, traffic, succession) are sharp enough to stand without the emotional padding.
