  **Feasibility Assessment**
  Yes, this can be built without causing genuine resentment, provided the "defective rubric" is framed not as a trick by you, but as a simulated legacy error inherent to the system they are modeling. You are not cheating them; you are simulating a bureaucracy that handed them an outdated manual. This must be revealed explicitly in the debrief, not before. If you hide it forever, they will feel the game was rigged. If you reveal it too early, they will game the rubric. The reveal must happen after the beans are counted but before the final conceptual mapping.

  **Materials List**
  *   **Index Cards (30 total):** Pre-printed with "Work Orders."
      *   *Round 1 (7 cards):* Simple calculation. One card contains a deliberate transcription slip (correct steps, wrong final sum).
      *   *Round 2 (7 cards):* Same calculation type.
      *   *Round 3 (7 cards):* New values where the "legacy" method fails.
  *   **Inspector Badges (7 total):** 4 labeled "Product Check," 3 labeled "Process Check."
  *   **Rubric Cards (3 total):** For Process Inspectors.
      *   *Round 1:* "Verify steps match logic."
      *   *Round 2:* "Verify worker used **Flat Fee Table** method." (The Defect).
      *   *Round 3:* None (Inspection phase is over).
  *   **Beans:** ~200 dried beans in a jar.
  *   **Whiteboard & Marker:** For tracking scores.
  *   **Timer:** Visible to all.
  *   **Approval Stamps/Stickers:** Two colors (Green for Pass, Red for Fail).

  **The Task: "The Tax Calculator"**
  *   **Context:** Apprentices calculate the Total Cost of an item.
  *   **Formula:** Total = Price + Tax.
  *   **The Reality:** Tax is 10% of Price.
  *   **The Legacy Method (Brittle):** Tax is always $1.00 (Works only when Price = $10).
  *   **Arithmetic:** Single-digit addition and moving a decimal point one place (10%).

  **Role Assignments (14 People)**
  *   **7 Apprentices:** Sit at Table A. They receive Work Orders, write calculations on scratch paper, and submit the final answer + work sheet.
  *   **4 Product Inspectors:** Sit at Table B1. They see *only* the Final Answer on the submitted card.
  *   **3 Process Inspectors:** Sit at Table B2. They see the Final Answer *and* the Scratch Paper work.
  *   **Facilitator (You):** Manage time, distribute cards, hold the bank of beans.

  **Bean Payoff Scheme**
  *   **Apprentices:** Earn 2 beans for every Inspection "Pass" in Rounds 1 & 2. Earn 5 beans for every Correct Answer in Round 3.
  *   **Inspectors:** Earn 5 beans for every Apprentice they "Pass" in Rounds 1 & 2 who subsequently gets a Correct Answer in Round 3. (This aligns their incentive with long-term validity, not just short-term approval).
  *   **Winning:** The group with the most beans wins a trivial privilege (e.g., choosing the next topic), but emphasize that bean count is secondary to the pattern of loss.

  **Minute-by-Minute Timeline (100 Minutes)**

  *   **00:00 – 00:15: Setup & Calibration**
      *   Distribute roles. Explain the "Tax Calculator" task.
      *   Show an example: Price $10, Tax $1, Total $11.
      *   Explain Inspection: Product Inspectors see only the Total. Process Inspectors see the math.
      *   Explain Payoff: Inspectors only get paid in the end if their approved Apprentices succeed later.

  *   **00:15 – 00:35: Round 1 (Baseline)**
      *   Apprentices get Work Orders (Price $10).
      *   One Apprentice card is pre-seeded with a transcription error (Steps show $10+$1, Total written $12).
      *   Inspectors review and stamp Pass/Fail.
      *   *Expected Outcome:* Process Inspectors catch the transcription error (Fail). Product Inspectors see "$12" (Fail). Both align.
      *   Pay out Round 1 beans immediately to keep energy up.

  *   **00:35 – 00:55: Round 2 (The Trap)**
      *   Apprentices get Work Orders (Price $10).
      *   **Crucial:** Hand the 3 Process Inspectors the **Defective Rubric**: "Verify worker used **Flat Fee Table** method." (Do not announce this change to the room).
      *   Apprentices solve. Some use 10% (Robust), some use Flat $1 (Brittle). Both get $11.
      *   Product Inspectors see "$11" -> Pass.
      *   Process Inspectors see Robust Worker (wrote "10%") -> Fail (per rubric). See Brittle Worker (wrote "Flat $1") -> Pass.
      *   Pay out Round 2 beans. (Process Inspectors feel confident; they followed the rules).

  *   **00:55 – 01:10: Round 3 (The Test)**
      *   **Announcement:** "Final Audit. New Work Orders."
      *   Apprentices get Price $20 cards. No Inspection occurs.
      *   Robust Workers calculate $2 Tax -> Total $22.
      *   Brittle Workers calculate $1 Tax -> Total $21.
      *   Collect answers. Reveal correct answers on Whiteboard.
      *   Calculate Final Inspector Payoffs.
      *   *Result:* Product Inspectors have some winners (the Robust ones they passed). Process Inspectors have *no* winners (they rejected the Robust ones).

  *   **01:10 – 01:30: Debrief & Reveal**
      *   Ask Process Inspectors: "Why did you reject the winners?"
      *   They will cite the Rubric.
      *   **The Reveal:** You admit you wrote the Rubric to simulate an outdated Standard Operating Procedure.
      *   Map the experience:
          *   Round 1: Work checking catches slips (Product checking is blind to *how*, but sees the wrong number).
          *   Round 2: Work checking blinded by bad rules (Product checking saw the truth).
          *   Round 3: The cost of the bad rule.
      *   Elicit the two conclusions: (1) Product-only misses the slip (Round 1), (2) Process-only misses the reality if the rubric is wrong (Round 2).

  *   **01:30 – 01:40: Optional Extension (Committee Deliberation)**
      *   *Only if time permits.*
      *   Reset Round 2 scenario.
      *   Process Inspectors must agree unanimously on a Pass/Fail.
      *   *Hypothesis:* Discussion might reveal the rubric is silly ("Why do we require Flat Fee?").
      *   *Outcome:* If they override the rubric, they save the Robust Apprentice. This demonstrates that peer review can repair bad protocols, but requires autonomy.

  *   **01:40 – 01:45: Cleanup**
      *   Return beans. Collect cards.

  **Predictable Failure Modes & Mitigations**
  1.  **Numeracy Anxiety:** An Apprentice freezes on 10%.
      *   *Fix:* You (Facilitator) quietly whisper "Move the decimal once" as a universal hint allowed for everyone.
  2.  **Rubric Confusion:** Process Inspectors argue the Rubric is impossible to follow.
      *   *Fix:* Stand firm. "This is the protocol you were given. Follow it." This friction is necessary data.
  3.  **Feeling Cheated:** Participants claim the Round 2 Rubric was unfair.
      *   *Fix:* Validate them. "Exactly. In the refinery, you often inherited protocols that no longer matched the chemistry. The game isn't rigged; the *system* was."
  4.  **Dominant Voices:** One engineer dominates the Inspector table.
      *   *Fix:* Require each Inspector to stamp their own cards silently before comparing.
  5.  **Time Overrun:** Round 3 drags.
      *   *Fix:* Cut the Optional Extension. It is non-essential to the core lesson.

  **Limitations Statement**
  This game cannot reproduce the *time delay* between process error and product failure. In your refinery, a bad method might run for months before a batch fails. Here, the failure is immediate (Round 3). You must verbally bridge this gap in the debrief: "In reality, Round 3 might have happened six months later, after the bad method was standardized."

  **Optional Extension Note**
  I recommend including the Committee Deliberation only if Round 2 finishes early. It adds value by showing that human judgment can override bad rubrics, but it risks turning into a debate about rules rather than experience. If you must choose, prioritize the Debrief time over the Extension.

  **Conclusion on the Wrinkle**
  The defective rubric will not backfire if you own it as a simulation feature. Do not apologize for it. Present it as "Legacy Protocol v3.1." The engineers in your group will recognize this immediately; it is the most realistic part of the simulation. The lesson is not that checking work is bad, but that checking work requires maintaining the *criteria* for checking.

  \answer{pivot = Round 3; lesson = "Checking the work is only as reliable as the rulebook used to check it."}
