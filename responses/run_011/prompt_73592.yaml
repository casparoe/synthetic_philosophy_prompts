answer: |-
  ### The Desiderata (Specs for a Definition)

  1.  **Illegality Independence:** The account must classify acts as corrupt even if legal, and exclude acts even if illegal.
      *   *Motivation:* The Judge is wrong. Laws lag behind norms (mining grant) or enforce bad norms (apartheid laws). Conversely, parking violations are illegal but not corrupt.
  2.  **Private Gain Independence:** The account must capture corruption where the actor receives no personal benefit.
      *   *Motivation:* The clean-hands mayor. Systemic corruption often serves political survival or institutional preservation, not pocket-lining.
  3.  **Functional Equivalence:** The account must apply to private purchasing agents and public officials using the same core logic, without relying on a formal "state" distinction.
      *   *Motivation:* A kickback at a private firm feels like corruption. Pre-modern societies lack a public/private split; the definition must track *power*, not *payroll*.
  4.  **Gradability:** The account must allow for degrees of severity without collapsing into a binary.
      *   *Motivation:* The survival envelope is not the mining grant. A code needs penalties proportional to harm; research needs variables, not just flags.
  5.  **Normative Anchoring:** The account must identify *which* norms are being violated without simply importing Western liberal democratic norms as universal.
      *   *Motivation:* The headman. If the definition assumes a Weberian bureaucracy, it classifies all patronage societies as corrupt, rendering the term useless for comparison.
  6.  **Systemic Capacity:** The account must distinguish between a rogue actor and a rotting system.
      *   *Motivation:* The mayor who tolerates fees. If corruption requires a specific violator, systemic rot becomes invisible.

  ### Incompatibilities (Where it Snaps)

  *   **Auditor Determinacy vs. Cross-Cultural Generality:** You cannot have a single definition that gives an auditor a yes/no answer *and* allows researchers to compare distinct normative systems. The auditor needs specific rules (e.g., "no relatives"); the researcher needs abstract functions (e.g., "deviation from role purpose"). **Verdict:** You need two documents derived from one core concept. Do not try to merge them.
  *   **Revisionism vs. Local Legibility:** If you define corruption revisionarily (telling the headman his system is corrupt), you lose the ability to enforce the code locally. If you define it descriptively (accepting local norms), you lose the ability to critique human rights abuses or systemic graft. **Verdict:** The Code must be revisionary (set a standard); the Research framework must be descriptive (measure the gap).

  ### The Killer Requirement

  **Private Gain Independence.**
  This knocks out the most candidates. Most lay definitions (and the Judge's view) rely on "abuse for private benefit." This fails the clean-hands mayor, the sincere legislator, and the systemic toleration cases. If your definition requires personal enrichment, you cannot tackle institutional rot or ideological capture.

  ### The Headman Intuition

  **Drop the intuition for the Code; keep it for the Research.**
  Your suspicion is sociologically correct but normatively dangerous. In the headman's local context, steering fertilizer is *governance*, not corruption. However, if you are writing an integrity code for a *city government* (implying a modern bureaucratic state), that behavior is a violation of the office's purpose.
  *   **Advice:** Classify it as a violation in the Code (to maintain state consistency), but code it as "Normative Conflict" in the Research dataset. Do not let local custom invalidate the office's formal duties, or the code is worthless.

  ### Account Evaluation

  **Public-Office / Abuse-of-Entrusted-Power**
  *Verdict:* Best for the Auditor, fails the Headman.
  It gives clear bright lines (did you violate the office's rules?) and handles the clean-hands mayor well. However, it assumes a formal office exists, making it useless for cross-cultural work where "office" is informal or fused with kinship roles.

  **Public-Interest**
  *Verdict:* Best for Revisionism, fails Determinacy.
  It captures the mining grant and the sincere legislator (they harmed the interest). But "public interest" is too vague for an auditor (who decides?) and too easily weaponized by populists to punish opponents. It creates high variance in application.

  **Corruption-as-Rotting-Practice's-Own-Standards**
  *Verdict:* Best for the Headman, fails the Auditor.
  It handles the cross-cultural issue beautifully (did he violate the norms of *this* system?). But it cannot critique a system where the norms *are* corrupt (e.g., a permits office where everyone expects fees). It makes corruption impossible in a fully normalized kleptocracy.
