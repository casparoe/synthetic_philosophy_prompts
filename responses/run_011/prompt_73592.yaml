prompt: |-
  Getting dragged onto a committee at my sister's city government has turned into a philosophy problem, and I want the spec in front of me before I read one more definition of corruption. Context: they're writing an integrity code covering procurement and permits, and three of us were asked to say what should actually count as a violation. Sounds trivial right up until you write the cases down, because half of them run through customs nobody around here thinks of as corrupt at all, and the retired judge on the panel kept insisting that if it's legal it can't be corrupt — which I'm pretty sure is wrong but I can't articulate why. And there are two things supposed to come out of this that I think pull against each other: a code an auditor can apply to a named person and get a determinate answer out of, and something general enough that a research group could use it to compare districts and countries without just exporting our public/private distinction onto places that never had one.

  So what does an account of corruption actually have to deliver to be adequate for either of those jobs? Give me the desiderata — the cases it has to come out right on, the distinctions it's not allowed to collapse, the things it has to stay consistent with — with the motivating case or consideration behind each, and be blunt about which of them are real requirements and which are just the house style of one camp. Here's the pile I can't sort:

  - a department head who awards a paving contract to her brother-in-law after a genuinely open tender at market price, and the roads get built well and on time;
  - a village headman who steers state fertilizer toward his kin and toward the households that backed him, where everyone locally would call it dereliction, not favoritism, if he didn't;
  - a public hospital where patients hand the porter an envelope to get seen sooner, and the envelopes are a real fraction of what makes the staff show up;
  - a mining firm's "community development" grant to a foundation whose board includes the minister's wife, disclosed in the annual report, nothing illegal about it;
  - a legislator who takes industry money, votes the industry's way, files all the paperwork, and sincerely believes the policy is right;
  - a mayor who never touches a cent himself but has let the entire permits office run on unofficial expediting fees for a decade, because a crackdown would have frozen construction and lost him the next election.

  Some of the things I want addressed explicitly, though I'm sure I'm missing others: it can't just be illegality, since that gets the judge's view backwards in both directions; it has to say something about the clean-hands mayor who personally benefits from nothing; it has to tell me whether a purchasing agent taking kickbacks at a private firm is the same phenomenon or a different one that happens to share a word; it has to make room for degrees, since the patient's envelope and the mining grant don't feel equally bad and I want to know if that's an intuition worth honoring; and it can't classify every reciprocated gift as corrupt, or else basically all premodern political life is corrupt and the concept isn't doing any work. Also whether it's allowed to be revisionary — telling people that their whole system is corrupt — or has to stay close to ordinary usage.

  Flag any pair of these you think can't be jointly satisfied. My guess is cross-cultural generality plus determinate verdicts plus not smuggling in our norms is where it snaps, but tell me if that's the wrong triple. And tell me which single requirement knocks out the most candidates, and whether any of the intuitions in my pile should be thrown away rather than respected — I have a suspicion about the headman case and I want to know if the suspicion is justified or just squeamishness. Then, briefly, a couple sentences each and no monument-building: how the public-office / abuse-of-entrusted-power account, the public-interest account, and the corruption-as-rotting-a-practice's-own-standards account do against your list. Skip the citations and the reading list entirely, I'll hunt down the sources myself.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Someone dragged onto a city government committee (sister's influence), pragmatic, intellectually sharp, frustrated with abstract philosophizing but recognizes the need for conceptual clarity. They want "specs" (desiderata) for a definition of corruption, not a lecture.
      *   **Task:** Define the desiderata (requirements) for an adequate account of corruption that serves two conflicting goals: (1) a determinate code for auditors, and (2) a general framework for cross-cultural research.
      *   **Input Cases:** Six specific scenarios (nepotism with good outcomes, patronage as duty, survival bribes, disclosed influence, sincere bought votes, systemic toleration).
      *   **Specific Constraints:**
          *   Must address illegality vs. corruption.
          *   Must address the "clean-hands mayor" (systemic corruption).
          *   Must address private vs. public sector distinction.
          *   Must handle degrees/severity.
          *   Must avoid classifying *all* reciprocity as corruption (premodern societies).
          *   Must address revisionism (telling people their system is corrupt).
          *   Flag incompatible requirements.
          *   Identify the "killer" requirement.
          *   Advise on which intuitions to drop (specifically the headman case).
          *   Evaluate three specific accounts (Public Office, Public Interest, Practice's Own Standards) briefly against the list.
          *   **Tone:** Blunt, no fluff, no citations, no monument-building.

  2.  **Deconstruct the Problem:**
      *   The core tension is between *legalism* (Judge's view), *moralism* (User's view), and *functionalism* (Auditor/Researcher needs).
      *   The two goals (Auditor Code vs. Cross-Cultural Research) are inherently in tension. One needs specificity/local norms; the other needs abstraction/universal metrics.
      *   The six cases cover: Nepotism (benign), Patronage (normative), Survival Bribes, Legal Influence, Sincere Corruption, Systemic Toleration.

  3.  **Drafting the Desiderata (The Specs):**
      *   *Requirement 1: Illegality is not necessary nor sufficient.* (Motivation: Judge is wrong; laws can be corrupt or lag behind norms).
      *   *Requirement 2: Private Benefit is not necessary.* (Motivation: The clean-hands mayor; systemic corruption).
      *   *Requirement 3: Public/Private Distinction must be functional, not formal.* (Motivation: Private kickbacks feel like corruption; premodern societies lack this distinction).
      *   *Requirement 4: Gradability.* (Motivation: Envelope vs. Mining Grant).
      *   *Requirement 5: Normative Independence.* (Motivation: Cannot just import Western public/private distinctions onto places where patronage *is* the system).
      *   *Requirement 6: Agent vs. System.* (Motivation: Needs to punish individuals *and* diagnose rot).

  4.  **Identifying Incompatibilities (The "Snap" Points):**
      *   *Determinacy vs. Generality:* An auditor needs bright lines (Did X violate Rule Y?). A researcher needs thick description (Does X undermine Trust Z?). You can't have a single definition that is both a checklist for a specific city and a universal metric for comparing a village in Kenya to a ministry in France.
      *   *Revisionism vs. Ordinary Usage:* If you define corruption too broadly (revisionary), you lose the ability to communicate with locals (e.g., the headman). If you define it too narrowly (ordinary usage), you can't critique the system (e.g., the legal mining grant).
      *   *The "Headman" Case:* This is the crux of the cross-cultural problem. Is it corruption or governance?

  5.  **Selecting the "Killer" Requirement:**
      *   What knocks out the most candidates? Usually, it's the *Public Interest* requirement or the *Abuse of Entrusted Power* requirement.
      *   Actually, the *Systemic vs. Individual* tension is the hardest. But the prompt asks for a single requirement.
      *   Let's look at the "Private Benefit" constraint. Many definitions fail because they require personal gain. The "Clean-hands mayor" kills those.
      *   Let's look at "Illegality." The Judge's view fails here.
      *   *Decision:* The requirement that **Corruption must be identifiable even when legal and even when no personal gain occurs** is the biggest filter. It kills legalism and simple greed models.

  6.  **Evaluating the Intuitions (The Headman):**
      *   The user suspects the Headman case intuition might be wrong.
      *   *Analysis:* If the headman *must* steer resources to kin to maintain the social fabric that allows the state to function there, calling it "corruption" might be an category error. However, if the *role* is "state distributor," steering violates the role's purpose.
      *   *Verdict:* The intuition should be modified. It's not "not corruption," it's "competing normative systems." But for the *code*, it needs to be a violation. For the *research*, it's a variable.
      *   *Advice:* Drop the intuition that it "isn't corruption." It *is* corruption by modern state standards, but it might be *functional* governance by local standards. Don't let the code off the hook, but let the research note the tension.

  7.  **Evaluating the Three Accounts:**
      *   *Public Office (Nye/Heidenheimer):* Focus on formal role. Good for auditors, bad for cross-cultural (assumes a Weberian state). Fails the Headman case (is he office or elder?).
      *   *Public Interest:* Focus on harm to common good. Good for revisionism, bad for determinacy (who defines interest?). Fails the Sincere Legislator (he thinks he's serving interest).
      *   *Practice's Own Standards (Thompson/Walzer):* Focus on internal norms. Good for nuance, bad for auditors (which practice?). Handles the Headman better (what are the norms of *that* village?).

  8.  **Refining the Output (Blunt & Structured):**
      *   Use the requested structure: Desiderata list, Incompatibilities, Killer Requirement, Intuition Check, Account Evaluation.
      *   Keep it tight. No intros/outros.
      *   Ensure the "Auditor vs. Researcher" tension is highlighted.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the private firm kickback? *Adjustment:* Ensure Desideratum 3 covers functional equivalence.
      *   *Check:* Did I address the "degrees" issue? *Adjustment:* Ensure Desideratum 4 covers severity.
      *   *Check:* Did I answer the "Revisionary" question? *Adjustment:* Include in Incompatibilities.
      *   *Check:* Is the tone right? *Adjustment:* Remove hedging words ("perhaps," "maybe"). Be decisive.

  10. **Final Polish:** (Mental check of the "Headman" advice). The user asked if the suspicion is justified. The suspicion is that calling it corruption is wrong. My advice should be: The suspicion is partially justified *sociologically*, but dangerous *normatively*. For the code, it's a violation. For the research, it's a clash of norms. I need to be clear on this distinction.

      *(Self-Correction on the "Killer Requirement")*: The prompt asks "which single requirement knocks out the most candidates." The requirement that **Corruption does not require personal gain** (handling the clean-hands mayor) is a very strong filter. However, the requirement that **Corruption must be distinct from mere illegality** is also huge. I will combine them into a "Non-Legalistic, Non-Greed-Based" requirement or pick the strongest one. Let's go with **Public Purpose Deviation** (must show deviation from the purpose of the role/power), as that covers the mayor, the legislator, and the headman. Actually, the prompt asks what requirement *I* set. I'll frame it as "Must identify deviation from the purpose of entrusted power regardless of legality or gain."

      *(Wait, looking at the "Incompatibilities" section)*: The prompt asks to flag any pair that can't be jointly satisfied. The "Auditor Determinacy" vs. "Cross-Cultural Generality" is the obvious one. I need to be explicit that they cannot be fully satisfied by a *single* definition. They need two different tools derived from one core concept.

      *(Final check on the three accounts)*: Keep it to two sentences each. No fluff.

      *(Final check on Headman)*: Be blunt. Is the intuition wrong? Yes, if the goal is a modern integrity code. No, if the goal is anthropological accuracy. Since they are writing a *code*, the intuition must be sacrificed for consistency, but noted as a friction point.

      Let's assemble.

      *Desiderata:*
      1. Illegality Independence.
      2. Private Gain Independence.
      3. Public/Private Functional Equivalence.
      4. Gradability.
      5. Normative Specificity (vs. Universality).
      6. Systemic Capacity.

      *Incompatibilities:*
      1. Determinacy vs. Generality.
      2. Revisionism vs. Local Legibility.

      *Killer Requirement:*
      Deviation from Purpose (covers gain and legality).

      *Headman:*
      Drop the intuition for the Code. Keep it for the Research.

      *Accounts:*
      Office: Good for code, bad for headman.
      Interest: Good for revisionism, bad for determinacy.
