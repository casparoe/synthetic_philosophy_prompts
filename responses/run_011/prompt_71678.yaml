  the slow green weight of moss upon the northern face of stone
  where wind has worn the sandstone down to dust and salt and bone
  the sea repeats its heavy breath against the shore of clay
  and winter moves across the grass to push the spring away
  the river cutting through the soft and silent all below
  the mountain holds the snow within the hollows of its head
  while centuries of quiet rain fall down and are not read
  the soil retains the memory of seed that sleeps inside
  the tide comes in and tide goes out with nowhere left to hide
  the landscape lies without hope or hunger or desire
  beneath the burning constant of the suns unending fire
  the horizon stretches outward past the limit of the eye

  The wheat is high the wheat is low
  The price of grain begins to grow
  A plague year comes a plague year goes
  The market rises as it flows
  The harvest fails the harvest feeds
  The cycle turns upon its seeds
  The wheat is high the wheat is low
  Silver moves where the winds will blow
  The price of grain begins to grow
  A plague year comes a plague year goes

  King Charles is dead
  At Naseby field
  The muskets fire
  The treaty sealed
  Cromwell rides out
  The head is gone

  But the road remains where the army marched across the lands
  Terraces hold the soil where the harvest used to grow
  Every decision hardens into the shape of the hill
  The noise of battle settles into the quiet mill
  Drained marshes solidify beneath the feet we know
  History is the rock that used to be human time
  The cleared hillsides hold the memory of the axe
  And time forgets the noise that the human effort makes
  Seen from far away the events are the only thing
  The mountain rises where the king gave the ordering
