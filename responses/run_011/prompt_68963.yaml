  **Final Advice:** Your friend says you can't have it both ways on omissions (3 vs 5). You *can*, but only if you admit that "Cause" in reliability engineering is not a metaphysical property of the universe, but a label for **accountable deviations from system norms**. Your intuitions are consistent with **Halpern & Pearl's Actual Causality** modified by **Hitchcock's Normality**. Stick to the "Deviation" clause; it is the only thing that saves you from blaming the absence of earthquakes for every standing building.
