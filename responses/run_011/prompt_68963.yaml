answer: |-
  ### The Principle: Default-Relative Structural Causation

  Your intuitions are not a mess; they are **normatively constrained interventionist** intuitions. You are implicitly using a model where causation requires a *deviation* from a baseline, not just counterfactual dependence. Standard counterfactual theories (Lewis) fail your cases because they treat absences and presences symmetrically. Process theories (Salmon) fail because they struggle with omissions (Case 3).

  Here is the decision procedure that captures your verdicts.

  **The Default-Relative Actual Cause Principle**
  $C$ is an actual cause of $E$ if and only if:
  1.  **Deviation Clause:** $C$ represents a value that deviates from a contextually defined **default** (normative or physical). Static background conditions do not count.
  2.  **Path Clause:** There is an active physical or informational path from $C$ to $E$ that completed prior to $E$'s occurrence.
  3.  **Dependence Clause:** If $C$ were set to its **default** value, $E$ would default to its **safe/normal** state, *provided* we hold other variables fixed at their **actual** values or their **defaults** (whichever is less abnormal).
  4.  **Minimality Clause:** No subset of the conditions above suffices.

  **Which Cases Forced Which Clauses:**
  *   **Deviation Clause (1):** Forced by **Case 4 (No Quake)**, **Case 5 (Not Hiring)**, and **Case 6 (Espresso)**. You refuse to call "absence of threat" or "machine settings" causes because they are the baseline, not deviations. This distinguishes *skipping* rounds (Case 3, deviation) from *not hiring* (Case 5, non-deviation).
  *   **Path Clause (2):** Forced by **Case 1 (Renata)** and **Case 7 (Doctor)**. You require the specific chain initiated by $C$ to be the one that finished. If a backup completes first (Case 7 Colleague), the first actor is not a cause.
  *   **Dependence Clause (3):** Forced by **Case 2 (Interns)**. In symmetric overdetermination, simple counterfactuals fail (if Intern 1 stops, Intern 2 still ruins it). This clause allows you to hold Intern 2 fixed at "Default" (not dumping) to test Intern 1, validating both as causes.

  ---

  ### Verdict on the Flag-Setter Case

  **Verdict: Yes, the flag-setter is a cause.**

  **Application:**
  *   **Deviation:** In reliability engineering, the default state for a production service is "Canaries Enabled." Disabling the flag is a **deviation** (Clause 1).
  *   **Path:** Flag Disabled $\rightarrow$ Canary Skipped $\rightarrow$ Bad Config Merged $\rightarrow$ Outage. The path is active and completed (Clause 2).
  *   **Dependence:** If Flag = Default (Enabled), Canary catches Config, Outage = False (Default). We hold the Config Merger fixed at "Actual" (Bad) to test the Flag. This is permitted because the Merger's action is the primary deviation, but the Flag's state is the *enabling* deviation (Clause 3).
  *   **Why it doesn't regress:** The person who wrote the canary framework is not a cause because writing the framework is the **Default** state of the system. The regress stops at the last *deviation*.

  ---

  ### Three Test Cases You Might Get Wrong

  **1. The Scheduled Maintenance (Omission vs. Default)**
  *   *Case:* A server is taken offline for scheduled maintenance (approved change request). During this window, a DDoS attack hits a different service that relied on the first server.
  *   *My Principle:* **Not a Cause.**
  *   *Why:* The maintenance is the **Default** value for that window (approved state). It fails the Deviation Clause.
  *   *Your Risk:* You might say "Cause" because the server was down. But in postmortem terms, this is "Expected Behavior," not a root cause.

  **2. The Double-Blind Overdose (Symmetric Deviation)**
  *   *Case:* Two doctors, unaware of each other, both prescribe a lethal dose of the same drug to a patient. The patient takes both (via two nurses) and dies. Either dose alone was lethal.
  *   *My Principle:* **Both are Causes.**
  *   *Why:* Both are Deviations (over-prescribing). We test Doctor A by holding Doctor B at Default (normal prescription). Dependence holds.
  *   *Your Risk:* You might hesitate and say "Neither" or "Both but diluted." The principle forces "Both."

  **3. The Inert Backup (Preemption)**
  *   *Case:* A brake line is cut (Saboteur). The emergency brake exists but was known to be broken for months (Maintenance Team). The car crashes.
  *   *My Principle:* **Saboteur is Cause; Maintenance Team is Cause.**
  *   *Why:* Saboteur: Deviation + Path. Maintenance: Deviation (broken safety) + Dependence (if fixed, crash prevented).
  *   *Your Risk:* You might want to exonerate Maintenance because "Saboteur did it." But under this principle, the broken backup is a *contributing cause* because it was a deviation from safety norms that allowed the effect.

  ---

  ### The Cost: What You Have to Give Up

  To keep your verdicts on Cases 1–7, you must accept that **causation is contrastive and model-relative.**

  The cheapest verdict to give up is **Case 2 (Interns)**.
  *   *Why:* Strict process theories (Salmon/Dowe) say only one physical process transferred the energy/quantity that ruined the batch. If you adopt a pure Process view, you must say "Only one intern caused it (we just don't know which)."
  *   *Trade-off:* If you keep Case 2 (Both), you must accept Clause 3 (Dependence under Contingency), which feels like "cheating" to purists because it relies on hypothetical scenarios (holding the other intern fixed) rather than just physical history.
  *   *Honest Assessment:* Your friend is partially right. You cannot have a "physicalist" theory *and* keep Case 2. You have chosen an **interventionist** theory. Stick with it.

  ---

  ### Account Comparison: Cases 3, 4, 5 (The Omission Crux)

  *   **Counterfactual (Lewis):** Fails. It says "No Quake" (Case 4) *is* a cause because if there *were* a quake, the building would fall. It cannot distinguish Case 3 (Guard) from Case 4 (Quake) without ad-hoc rules.
  *   **Process (Salmon/Dowe):** Fails Case 3. There is no conserved quantity transferred by "not walking." It struggles to make omissions causal without treating them as magical.
  *   **Interventionist (Woodward):** Succeeds, *if* you add norms. It says "Yes" to Case 3 because an intervention on Guard Rounds changes Flooding. It struggles with Case 5 (Hiring) unless you explicitly define the "default" staffing level in the model.

