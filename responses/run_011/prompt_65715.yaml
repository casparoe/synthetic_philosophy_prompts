  ### IV. Indistinguishability and Further Separation

  **Pair 1: Maxmin Expected Utility (MEU) vs. Choquet Expected Utility (CEU)**
  *   **Current Status:** These positions occupy the same leaf (No, Yes, Yes, No). Both accept Reduction of Compound Lotteries (Wheel = Known) and both exhibit ambiguity aversion (Known > Unknown).
  *   **Separating Case:** **Hedging Behavior.**
      *   *Test:* Offer a bet that pays $1 if Red is drawn from Unknown-Urn AND a bet that pays $1 if Black is drawn from Unknown-Urn. Ask if the sum of the prices for these two separate bets is less than the price for a single bet that pays $1 if (Red OR Black) is drawn.
      *   *Distinction:* MEU typically implies a strict premium for the hedged act (sub-additivity of the value functional). CEU also implies this, but the *degree* and behavior under updating differ. A cleaner separator is **Dynamic Consistency**. Ask if they would change their bet on the Wheel-Urn if the wheel's outcome were revealed *after* the bet is placed but *before* the urn draw. MEU often violates dynamic consistency without specific updating rules; CEU has different updating constraints (Dempster-Shafer vs. Bayesian).

  **Pair 2: Smooth Ambiguity vs. Source/Competence Accounts**
  *   **Current Status:** Both often occupy (Yes, Yes, Yes, No). Both penalize the Wheel-Urn relative to the Known-Urn.
  *   **Separating Case:** **Expertise Variation.**
      *   *Test:* Vary the *source* of the Known-Urn. Compare betting on the Known-Urn (50/50) filled by a "novice" vs. the Wheel-Urn operated by a "certified random device."
      *   *Distinction:* A Smooth Ambiguity theorist cares about the *structure* of uncertainty (risk vs. second-order probability). They should prefer the Known-Urn regardless of who filled it, provided the composition is known. A Source/Competence theorist cares about the *agent* or *source reliability*. They might prefer the Wheel-Urn (certified device) over the Known-Urn (filled by a novice who might have lied), reversing the Node 1 answer based on competence rather than probability structure.

  **Pair 3: Incomplete Preferences (Symmetric) vs. Incomplete Preferences (Asymmetric)**
  *   **Current Status:** Separated by Node 3.
  *   **Separating Case:** **Forced Choice Frequency.**
      *   *Test:* Force a choice between Red and Black in the Unknown-Urn over 100 trials.
      *   *Distinction:* An Asymmetric student will consistently pick one (e.g., Red). A Symmetric Incomplete student will randomize arbitrarily or show instability, as they genuinely view them as incomparable but are forced to act. This distinguishes a bias from a structural gap.
