answer: |-
  ### The Case: The Calibration Cycle

  **Scenario**
  In a university engineering department, a single high-precision 3D printer is available for all graduate students on a first-come, first-served basis. The machine requires a nozzle-calibration cycle to ensure print quality, which takes thirty minutes but is technically optional for rough drafts. Alex, wanting to guarantee a flawless model for a competition, adopts the maxim: "I will run the full thirty-minute calibration cycle before every print job I submit to the shared printer, regardless of the queue length, to ensure my model does not fail." Alex submits the job honestly, without deceiving anyone about the machine's status.

  **The Maxim**
  "I will run the full thirty-minute calibration cycle before every print job I submit to the shared printer to ensure my model does not fail."

  **The Universalized World**
  In the world where this maxim is a law of nature, every graduate student runs the thirty-minute calibration cycle before every print job. Since print jobs are frequent and the printer can only handle one task at a time, the printer is permanently engaged in calibration cycles. No objects are ever printed. The machine functions mechanically without error, but its function as a printing device is never realized.

  **Verdicts**

  *   **Strict Logical Reading:** **Passes.** There is no logical contradiction in the conception of this world. The concept of a "3D printer" does not logically entail "printing occurs"; it entails only "a machine capable of printing." The agent's act (pressing the calibration button) remains physically and logically possible. The description of the world contains no inconsistency (e.g., "A is not-A"). Therefore, the maxim does not violate a perfect duty. (It might proceed to the Contradiction in Will test, yielding only an imperfect duty to sometimes refrain).
  *   **Practical-Contradiction Reading (Korsgaard):** **Fails (Contradiction in Conception).** The agent's purpose is to *print a flawless model*. In the universalized world, *no printing occurs*. The universalization renders the agent's end impossible to achieve through the proposed means. Because the action becomes practically ineffective for its intended purpose, there is a contradiction in conception (practical type). This generates a **perfect duty** to refrain from the action.

  **The Switchable Feature**
  The divergence is produced by the **time-duration of the calibration cycle**.
  *   **If Switched Off (Duration = Negligible):** If the calibration cycle took zero seconds, universalization would not prevent printing. The Practical-Contradiction Reading would then **Pass** (no defeat of purpose), aligning with the Logical Reading. The Logical Reading remains unchanged (still Passes). This confirms that the failure on Korsgaard's reading relies entirely on the empirical fact of scarcity/time, whereas the Logical Reading ignores efficacy entirely.

  **The Logical Defender's Attack**
  A defender of the Strict Logical Reading would attack the construction by **re-describing the maxim**. They would argue: "You have described the maxim too specifically ('run calibration'). The relevant description is 'use the printer.' If universalized as 'everyone uses the printer,' there is no contradiction. The practical failure arises only because you included the *inefficient method* in the maxim itself. If the agent adopts 'I will print my models,' universalization allows printing (if others don't calibrate). Thus, the contradiction is not in the conception of the act, but in the agent's poor strategy."

  **Does the Defense Succeed?**
  No. The Categorical Imperative tests the maxim *as the agent adopts it*. The agent's rationality is being tested on their actual reasoning ("I must calibrate to ensure success"). If the test ignores the specific means the agent deems necessary, it fails to evaluate the agent's actual will. The Logical Reading's insistence on abstracting away the empirical conditions of the act (the time cost) renders it incapable of catching instrumental irrationality that violates duty.

  ***

  ### Commitment

  This exercise ought to be built to vindicate the **Practical-Contradiction Reading (Korsgaard)**.

  The Strict Logical Reading is too sterile to capture the normative force of Kant's ethics. It reduces the Categorical Imperative to a test of non-contradiction in language or metaphysics, allowing clearly exploitative or destructive behaviors (like hogging a shared resource to the point of ruin) to pass the first hurdle simply because the world doesn't logically explode. Kant's ethics is about the conditions of rational agency, not just logical consistency. The Practical-Contradiction reading correctly identifies that a maxim fails when it undermines the very conditions that make the action effective for a rational agent.

  **What This Reading Must Surrender**
  To survive this case, the Practical-Contradiction Reading must surrender the claim that the Categorical Imperative is a purely *a priori* test independent of empirical facts. In this scenario, the moral verdict hinges entirely on the empirical fact that calibration takes thirty minutes. If the physics of the printer changed, the moral status of the maxim would change. Korsgaard must admit that the CI procedure relies on empirical premises about the causal structure of the world (scarcity, time, efficacy) to generate contradictions. It cannot be a purely formal logic test; it is a test of *rational efficacy in a material world*. This surrender weakens the claim of Kantian ethics to be wholly independent of anthropology, but it strengthens its ability to generate actionable moral verdicts in real-world contexts.
