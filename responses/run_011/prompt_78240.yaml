answer: |-
  The question of where selection happens is not merely a dispute about how to count offspring; it is a dispute about what kind of things exist in the biological world. When we say selection operates "at the level of the gene," "the individual," or "the group," are we identifying distinct causal engines, or are we simply choosing different units of measurement for the same underlying process? This is the heart of your difficulty. You have encountered the tension between the mathematical equivalence of different descriptions and the causal asymmetry of the world they describe. The intermediate position—that both descriptions are equally correct—often feels like a diplomatic truce that leaves the ontological question unanswered. To resolve this, we must look not at the algebra of evolution, but at the machinery of your hypothetical wasps.

  To begin, we must define our terms. In evolutionary theory, **fitness** refers to the expected reproductive success of an entity. A **replicator** is an entity that passes its structure on to the next generation with high fidelity (like a gene), while a **vehicle** is the temporary physical embodiment that interacts with the world to protect and propagate the replicator (like a wasp). **Selection** occurs when there is a correlation between a heritable trait and fitness. Finally, **covariance** is a statistical measure of how two variables change together; in this context, it measures whether having a certain trait predicts having higher fitness.

  Your wasp case is designed to be a crucible for these definitions. We have a trait (policing) that reduces individual fitness within a mixed nest (Clause 2) but increases the total output of reproductive offspring from the nest (Clause 1). However, the nest dissolves every autumn (Clause 4), and the policing behavior functions as a mutual constraint rather than pure self-sacrifice when common (Clause 3). The question is whether the forty percent productivity advantage of policing nests constitutes selection *at the level of the nest*, or whether it is merely a description of how individual selection plays out in a structured environment.

  My conclusion is definite: in this specific case, describing the process as "selection at the level of the nest" is a matter of bookkeeping. It is a useful statistical partition, but it does not identify a distinct causal process. The honest description is that individual wasps are being selected, and the nest is merely the environment in which that selection occurs. The intermediate position fails here because it treats a statistical correlation as a causal force. While the math of multilevel selection allows us to partition the variance into "within-group" and "between-group" components, this partitioning does not grant the group ontological status as a unit of selection when the group does not persist or replicate as a unit.

  To understand why this verdict is necessary, we must first state the strongest argument available to the side I reject. A proponent of genuine nest-level selection would argue that the causal arrow points from the group composition to the survival of the trait. They would point to Clause 2: within any given mixed nest, the policing gene is selected *against*. If selection operated only at the individual level, the policing trait should vanish, because individual policers leave fewer sons than individual non-policers in the same nest. Yet, if the trait spreads in the total population, it must be because the nests containing the trait produce more dispersing queens and males than nests without it (Clause 1).

  This proponent would argue that the "group advantage" is doing real work. Without the variance between nests—some having high policing, some having low—the trait would go extinct. The individual disadvantage is real, but it is overwhelmed by the group advantage. Therefore, the group property (the frequency of policing) is a cause of the gene's frequency in the next generation. To deny this is to ignore the fact that the fate of the individual is tied to the fate of the collective. In this view, the nest acts as a filter. Even if the nest dissolves, it functions as a "vehicle" for the genes during the breeding season. The forty percent productivity difference is a difference in **fitness** assigned to the nest type. If nests with the trait leave more "offspring" (in the form of dispersing queens) than nests without it, then selection has operated on the nest. To call this mere bookkeeping is to privilege the gene as the only real entity, ignoring that genes cannot interact with the world except through the structured vehicles they build.

  This is a powerful argument, and it relies on the intuition that if removing the group structure changes the outcome, the group structure is causally relevant. However, in your specific case, this argument fails because it conflates *causal relevance* with *unit of selection*. The nest is certainly causally relevant; it is the arena where the game is played. But being the arena is not the same as being a player.

  The failure of the nest-level interpretation hinges on Clause 3 and Clause 4. Clause 4 states that the nest dissolves. Nothing corresponding to the nest persists into the next year. In biological terms, the nest has no **lineage**. A unit of selection must be a replicator or a vehicle capable of replication. A species persists; an individual persists (for a lifetime) and reproduces; a nest, in your stipulation, simply ceases to exist. The "offspring" of the nest are actually the offspring of the queens and males within it. The forty percent advantage is not the nest reproducing; it is the individuals within the nest reproducing more successfully *because of the social context*.

  This is where Clause 3 becomes decisive. You stipulated that policing is a "mutual constraint." In a pure policing nest, the cost disappears. This transforms the nature of the interaction. In classic group selection models, the trait in question is usually altruistic: it reduces individual fitness permanently to boost group fitness. Here, the trait is conditional. It is costly only when rare (in mixed nests) but cost-free when common (in pure nests). This suggests that the "group advantage" is not a separate force lifting the trait against the tide of individual selection. Rather, the "group advantage" is simply the aggregate result of individuals securing a high-yield environment for themselves.

  Consider the causal mechanism. Why does a policing nest produce forty percent more offspring? Because the workers are not wasting effort on conflict. Who benefits from this efficiency? The individual queens and the individual workers (via their sons, if they can lay them, or via their sisters if they are sterile, though your case specifies workers lay male eggs). The benefit accrues to the individuals. The "nest" does not eat the food; the wasps do. The "nest" does not fly to found new colonies; the queens do. When we say the nest has higher fitness, we are using a shorthand for "the average individual in this nest has higher fitness."

  If the description "nest-level selection" were more than bookkeeping, it would imply that the nest has interests distinct from the sum of its parts, or that the nest persists as a unit of replication. Since the nest dissolves, the only entities that bridge the gap between generations are the individuals and their genes. Therefore, the selection pressure must be traceable to them. The "between-nest" variance is real, but it is a statistical artifact of how individuals are grouped, not a property of a higher-order individual.

  The intermediate position—that both descriptions are equally correct—fails because it suggests a symmetry that does not exist. It implies that we can choose to view the world as nests selecting wasps or wasps selecting nests, depending on our convenience. But causality is not a matter of convenience. In this case, the causal chain runs from the genes to the worker behavior, to the nest environment, to the individual reproductive success. The "nest level" is a derivative description. It summarizes the outcome of individual interactions. To treat it as a co-equal level of selection is to reify a statistical correlation into a causal agent. It is like saying that because traffic moves faster on highways than on city streets, "the highway" is a unit of selection for cars. The highway affects the car's speed, but the car is the thing that persists and reproduces (in the analogy of manufacturing).

  The strongest reason to reject the nest-level description here is that it obscures the specific mechanism identified in Clause 3. If we call this group selection, we invoke the imagery of altruism and self-sacrifice for the good of the collective. We imagine the policer sacrificing her sons for the nest's sake. But Clause 3 explicitly denies this. In a policing nest, the policer does not sacrifice; she enforces a constraint that allows her to reproduce (or allows her queen to reproduce, which carries her genes). The trait spreads not because groups survive better *despite* individual costs, but because the trait creates a context where the individual cost vanishes. This is a story about individual strategy and frequency-dependent selection, not a story about group survival. Labeling it "group selection" imports conceptual baggage that misdescribes the biology. It suggests a conflict between individual and group that, in the stable state, does not exist.

  So, where does this leave us? It leaves us with the conclusion that in this specific shape of case, "selection at the level of the nest" is bookkeeping. It is a way of partitioning the variance in reproductive success to understand why a costly trait might spread, but it does not denote a second, independent selective process. The only things being selected are the individuals (and the genes within them). The nest is part of the environment, specifically the social environment, that determines the fitness payoff of the trait.

  However, a defended conclusion must specify the conditions under which it would be wrong. What would have to be true of the case for the verdict to reverse? For "nest-level selection" to be more than bookkeeping, the nest would need to acquire the properties of a Darwinian individual. This would require two changes to your stipulations.

  First, the nest must persist or replicate as a unit (Clause 4 must change). Instead of dissolving every autumn, the nest itself should undergo fission, or a queen should take a portion of the workers to found a daughter nest that retains the identity of the mother nest. There must be a lineage of nests, not just a lineage of wasps. If nests vary in their longevity or their rate of fission, and if this variance is heritable (passed from mother nest to daughter nest), then the nest becomes a vehicle in its own right.

  Second, the利益 (benefit) must accrue to the group entity in a way that is not reducible to the immediate reproductive sum of the current individuals. For example, if the nest stored resources that were used by the next generation of nests, rather than by the current dispersing queens, the nest would be functioning as a capital accumulator for a lineage of groups.

  If these conditions were met, the "nest" would be a replicator or a vehicle with lineage fidelity. In that scenario, saying "selection operates at the level of the nest" would not be bookkeeping; it would be a claim about the existence of a new biological individual. The intermediate position would then gain traction, because there would genuinely be two distinct evolutionary processes occurring: the evolution of wasps within nests, and the evolution of nests within the population of nests.

  But in your case, without nest lineage, the "group" is a transient statistical cluster. The forty percent advantage is a property of the collection, but the selection acts on the members. The intermediate position is false here because it treats a transient cluster as equivalent to a persistent lineage. It conflates the *context* of selection with the *unit* of selection.

  This distinction matters because it dictates how we predict the system will respond to change. If we view this as nest-level selection, we might predict that mechanisms would evolve to protect the nest as an entity. If we view it as individual selection in a structured environment, we predict mechanisms that maximize individual payoff within that structure. Clause 3 supports the latter. The policing behavior is not maintained by group loyalty; it is maintained by mutual enforcement. If a mutation arose that allowed a worker to police without being policed in return (a "super-policer" who eats others' eggs but hides her own), individual selection would favor it, even if it hurt the nest. A true nest-level selector would suppress such a mutant to protect the group's integrity. Since your system relies on mutual constraint (everyone polices everyone), it is stabilized by individual self-interest, not group integrity.

  Therefore, the honest description is that only individuals and their genes are being selected. The nest figures as part of the environment they happen to share. The "between-nest difference" is a real statistical fact, but it is not a distinct causal force. It is the shadow cast by individual interactions when viewed from a distance. To call it selection at the level of the nest is to mistake the shadow for the object.

  This conclusion does not diminish the importance of the group structure. Far from it. It highlights that individual selection is powerful enough to produce complex social coordination without needing to invoke a higher-level agency. The "bookkeeping" of group selection is a useful tool for calculating *whether* a trait will spread when individual and collective interests diverge. But it is not a description of *what* is evolving. In your wasp case, the wasp is what evolves. The nest is merely the stage, and while the stage determines the script, it does not act in the play. To believe otherwise is to grant the stage a role it does not possess. The intermediate position, by refusing to distinguish between the stage and the actor, offers a peace treaty that dissolves upon contact with the causal mechanics of your stipulated world.
