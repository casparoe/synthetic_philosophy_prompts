          5.  Moral Licensing (55%): Elites may treat apology as a terminal act rather than a starting gate.
      *   *Combining:* Start with base rate of recurrence (80%). Apply weights. The high scores on elite constraint pull up, the low scores on material continuity pull down.
      *   *Hinge:* Material Continuity. If restitution occurs, credence jumps to 85%; if not, it drops to 45%.
      *   *Purchase Price:* Verdict: Directionally true, empirically messy. It's testable via correlation of restitution vs. nationalist resurgence, but hard to isolate. It's a good line, but don't treat it as a law of physics.

