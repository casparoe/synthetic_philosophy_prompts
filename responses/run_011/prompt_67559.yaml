answer: |-
  Bottom line
  65% credence. Formal acknowledgement reduces recurrence risk by raising the political cost of reversal, but its durability collapses if material inequalities remain unaddressed.

  The decomposition
  1. **Elite Constraint (70%):** Formal acts create legal and diplomatic friction that makes policy reversal expensive for future administrations.
  2. **Curriculum Embedding (65%):** Institutionalizing memory in schools shifts baseline norms over 50 years more effectively than one-off speeches.
  3. **Material Continuity (40%):** If wealth structures from the atrocity remain intact, acknowledgement fuels revisionist resentment among descendants of perpetrators.
  4. **State Continuity (50%):** Acknowledgement sticks better after total regime collapse (Germany) than within continuous state institutions (Turkey, US).
  5. **Moral Licensing (55%):** Elites often treat apology as a terminal act, using moral capital gained to resist further material change.

  Combining
  Start with a base recurrence rate of 80% for unacknowledged atrocities. Apply a weighted average where Elite Constraint and Curriculum (high impact) pull the risk down, but Material Continuity and State Continuity (high variance) pull it up. (0.70 + 0.65 + 0.40 + 0.50 + 0.55) / 5 = 0.56 effectiveness score. Applied against the base risk, this yields a roughly 65% probability that recurrence is mitigated compared to the counterfactual.

  The hinge
  Material Continuity. If restitution accompanies acknowledgement, the credence jumps to 85%; if acknowledgement is purely symbolic while wealth remains entrenched, the credence drops to 45%. This term dominates because unaddressed material grievance is the primary fuel for nationalist resurgence.

  On the purchase-price idea
  Verdict: Directionally correct but too absolute. It is testable—you could correlate degrees of restitution with rates of historical revisionism across cases—but you will find noise (e.g., Germany paid and remembered, South Africa remembered and didn't pay yet avoided full recurrence). It's a good line, but don't treat it as a law of physics; acknowledgement can sometimes decouple elites from the crime even without restitution, though it rarely protects the vulnerable.
