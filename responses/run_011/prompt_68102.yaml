answer: |-
  **Office of Pairwise Review | Case Management System v4.2 | User Documentation**

  **System Overview**
  The OPR-CMS facilitates statutory compliance with the Principles for General Agreement Act. Users must submit proposed principles for validation against individual complaints. The system operates exclusively on a one-to-one comparison basis. There is no field for "Total Harm" or "Aggregate Utility." Attempts to input summative data will trigger **ERROR 409: CONCEPTUAL MALFORMATION**. Support tickets regarding this error are closed with the standard explanation: "The Act recognizes only persons, not collections. Summation requests imply a collective entity not recognized by statute."

  **Frequently Asked Questions**

  **1. How does the system handle high-volume minor burdens vs. single severe burdens?**
  Consider Ticket #8821 (Broadcast Interruption). Complainant A cites severe electrical injury. Complainants B1–B1,000,000 cite deprivation of broadcast conclusion.
  *Process:* The system generates 1,000,000 pairwise comparison tickets (A vs. B1, A vs. B2, etc.).
  *Queue Estimate:* 412 years at current processing speed.
  *Verdict:* "Principle Rejected." In every pairwise comparison, A's injury outweighs Bn's disappointment.
  *Note:* While the verdict aligns with statutory intent, users are advised not to monitor the progress bar. The system must honor every individual voice, even if doing so requires computational time exceeding the lifespan of the complainants.

  **2. How do I use the Minor Burden Clustering Module?**
  Users may aggregate burdens only if they are of "relevantly similar magnitude." The system does not define this boundary. Users must locate the threshold unaided. If the system accepts the cluster, burdens add; if not, they remain individual.
  *Input Field:* "Similarity Confidence Interval (0-100%)."
  *Warning:* Setting confidence too high triggers **WARNING 505: ARBITRARY THRESHOLD**. Setting it too low triggers **WARNING 506: FAILURE TO AGGREGATE**. The correct setting is whatever yields the correct moral result, determined prior to input.

  **3. What happens in rescue cases with equal numbers?**
  Where complaint strength and population size are identical, the system invokes the "Equipoise Resolver." This module executes a random draw using a certified quantum seed value (re-certified annually). The audit trail records the seed, the timestamp, and the selected beneficiary. This is not a bug; it is a feature ensuring impartiality where reason runs out. Users must attach the generated hash to the final report.

  **4. Why was my complaint rejected at Intake?**
  Check Field 1.4: "Grounds for Objection." Entries stating "The principle is morally wrong" are rejected as circular. Valid entries must cite "Personal Burden."
  *Appeal Status:* Appeal #9920 was denied because the appellant cited "Fairness" rather than "Rejectability." The reason for denial is hidden under **PROTOCOL DELTA** and cannot be disclosed to the appellant, as disclosure would constitute a new principle requiring review.

  **Legacy Import Notice**
  Data migrated from the decommissioned Totalizing System (v1.0) may contain ghost fields labeled "Net Benefit." These fields are read-only and display null values. In rare instances, legacy **consequentialist** metadata may cause the cursor to hover indefinitely over the "Approve" button. Do not click. The ghost data is inert, but looking at it too long may cause interface lag.

  **Known Issues & Release Notes**

  > **ISSUE TRACKER #404: THE MIGRAINE CLUSTER**
  > Users report instability when comparing one death against 10,000,000 migraines. The Clustering Module accepts the migraines as "similar" but refuses to sum them to exceed the death. The system returns a determinate verdict: "Principle Accepted" (allow the death). This verdict is statistically consistent but philosophically volatile. Users are advised to classify the death as "non-comparable" to bypass the error, though this contradicts Field 1.4 guidance. We are aware that this makes the system appear blind to scale; however, acknowledging scale would require a field for totals, which violates Error 409 protocols.

  > **ISSUE TRACKER #505: INEXPRESSIBLE REJECTABILITY**
  > In cases involving threshold constraints, the system sometimes returns "Principle Rejected" without generating a specific pairwise justification log. The verdict is defensible under the Act, but the system vocabulary lacks the terms to explain why the single complaint outweighs the cluster without aggregating the cluster. The justification field will read: "REASON: NON-AGGREGATIVE OVERRIDE." Do not attempt to expand this field. It will only return the text: "THE INDIVIDUAL STANDS ALONE."

  > **RELEASE NOTE 4.2.1**
  > Fixed a bug where the Legacy Totalizer ghost data briefly displayed a number greater than zero. The number has been returned to null. We apologize for the distress caused by seeing the sum. Some users reported feeling relieved that the number was gone; others reported feeling haunted by the memory of it. Both reactions are valid grounds for a new ticket.
