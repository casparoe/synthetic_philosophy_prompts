      *   **Commitment 7 strengthens:** The shift to 2/3 can be framed as preserving the "rigidity" of conditional probabilities, which aligns better with a sophisticated reading of Reflection.
  *   **Defensibility:** **High.** This is Van Fraassen's actual position. It is a published, peer-reviewed, standard position in formal epistemology.

