answer: |-
  Your load-bearing move is the evidentiary mismatch identified in §2—using event-scale proxies to justify condition-scale conclusions—because it exposes a structural flaw in the literature rather than a mere interpretive disagreement. Your decorative move is the "temporal grammar" framing in §1, which adds rhetorical weight but no analytical precision beyond what the condition/event distinction already does. The "probe" metaphor in §3 is risky; it does heavy lifting but threatens to collapse into the very trigger/background distinction you claim to transcend unless "slack" is rigorously operationalized. Overall, the draft succeeds as a methodological critique but falters as a philosophical account of causation.

  **1. Does the condition/event distinction survive contact with cases?**
  It survives as a heuristic but fails as a binary ontology. You acknowledge the 536–660 cooling episode falsifies the dichotomy, but you underestimate the damage. The Little Ice Age (LIA) is not a pulse; it is a shift in variance regimes. The 17th-century General Crisis is worse: it is a synchronicity of political, fiscal, and climatic stressors where the "event" (e.g., a failed harvest) is indistinguishable from the "condition" (decadal cooling). If you admit it is a continuum of pulse duration and spatial extent, you lose the clean counterfactual structure you rely on in §2. However, a continuum *can* support the normative demand in §4 if you rephrase it: the requirement is not that the cause be purely event-scale, but that the *rate of environmental change* be specified relative to the *rate of institutional adaptation*. If the environment changes faster than institutions can adapt, it functions as an event; if slower, a condition.
  *Confidence: High.*

  **2. Is probe causation original or a rebranding?**
  It is a rebranding of resilience theory (Holling) dressed in analytic causation clothing. Your ecologist friend is right: "forcing vs. boundary condition" is the physical sciences version, and "trigger vs. structural cause" is the philosophy of history version (think of Gallie or Weber). The "probe" metaphor adds the idea that the outcome reveals the internal state (slack), which is closer to a diagnostic test than a causal mechanism. The residue that is genuinely yours is the specific critique of *evidentiary scale mismatch* in current climate history. You are not discovering a new metaphysics of causation; you are policing the boundary conditions of interdisciplinary inference. Own that. It is more useful than a new theory of causation.
  *Confidence: High.*

  **3. On §3: Accuracy and Fairness**
  You characterize the revisionist argument (Mordechai, Eisenberg) fairly: they argue from the absence of archaeological disruption to infer modest demographic impact. You are correct that both sides often assume a single-pulse model. The "pulse-train" point is not novel in epidemiology (multiple waves consume immunity and resources differently than a single wave), but it is novel in *historical causation* terms regarding how we date and attribute collapse. However, be careful not to straw-man the "catastrophe" side (e.g., Harper); they do acknowledge recurrence but argue the cumulative mortality was high enough to break systems regardless of pulse structure. Your contribution is showing that pulse structure *matters* for the archaeological signature, not just the death toll.
  *Confidence: High.*
  *Suspicion:* I suspect you are overstating the unanimity of the "single-pulse model" among catastrophe proponents. Some allow for recurrence but argue the net effect is the same. Check Harper's *The Fate of Rome* closely on this; he deals with recurrence explicitly.

  **4. Is §5's payoff interesting or trivially true?**
  As stated ("environment is a cause without determinism"), it is trivial. Every historian believes context matters. It becomes non-trivial only if the "Signature Test" forces a change in practice. Currently, it risks being ignored because it is too demanding (see §5 below). To make it worth an article, you must show how applying the Signature Test changes the verdict on a specific case. Does it exonerate the climate in one instance and indict it in another? If the test is passed by everyone or failed by everyone, it is decorative. You need a example where the Signature Test *flips* the consensus.
  *Confidence: Medium.*

  **5. Does the signature test smuggle in a covering-law conception?**
  Yes. Demanding that a claimant "specify in advance the shape predicted" and "what the record would look like if the environmental cause were absent" is a positivist dream that history cannot supply. We do not have controlled comparisons. If you require this, you rule out singular historical causation entirely. You need to soften this to "specify plausible trajectories based on comparable cases" or "identify the specific mechanism of transmission." Otherwise, you are handing the question to modelers, as you fear. The "multiple-comparisons problem" is real, but the solution cannot be pre-registration of historical hypotheses. It must be robustness checking across multiple proxies.
  *Confidence: High.*

  **Fact-Check and Scaffolding**
  *   **536/540 Eruptions:** Current consensus (Oppenheimer et al.) places Ilopango in the 430s, leaving the 536 source unresolved (likely high-latitude NH). Your text implies the source is known; clarify it is unknown.
  *   **1815 Tambora:** Good example of event-scale, but note that its social effects were mediated by market integration (condition-scale). It supports your argument if used carefully.
  *   **Plague Debate:** You are safe on the broad strokes (Harper vs. Mordechai/Eisenberg), but ensure you distinguish between *plague* (Y. pestis) and *plague of Justinian* (the historical event). The aDNA confirmation is recent (2013+); revisionists argue from absence of mass graves, not absence of pathogen.
  *   **Confidence:** High on the science, Medium on the historiography (this moves fast).

  **Point of Least Certainty**
  I am least sure about whether the "Signature Test" can be salvaged without becoming positivist nonsense. I distrust my own judgment here because I am trained in philosophy of science where counterfactual precision is valued, but I know historians reject this as ahistorical. If you soften it too much, it becomes vague; if you keep it hard, it becomes impossible. I do not know where the equilibrium lies that will satisfy a history department review committee.
