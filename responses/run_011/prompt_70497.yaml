      *   *Category 2: Population-Level/Generational.* Culture $\rightarrow$ Behavior (no inner life needed).
      *   *Category 3: Religion as Remover of Inhibitor.* Not a drive, but permission.
      *   *Category 4: Affinity/Elective Affinity.* Ideas and interests align, not causal.
      *   *Category 5: Beliefs as Rationalisation.* Beliefs explain conduct, don't cause it.
      *   *Category 6: Institutional Hardening.* Habits outlive creed.

  3.  **Evaluate Each Claim (Trivial, Arguable, False):**
      *   *Individual-Psychology:* "I work hard because I fear hell/seek election." *Verdict:* Substantive and arguable. Hard to prove, but plausible for some.
      *   *Population-Level:* "Protestant societies grow faster." *Verdict:* Substantive and arguable (correlation vs causation issues).
      *   *Remover of Inhibitor:* "Catholicism banned usury/profit; Protestantism allowed it." *Verdict:* Substantive and arguable (Tawney's twist on Weber).
      *   *Affinity:* "Capitalism and Calvinism fit together." *Verdict:* Substantive and arguable (Weber's actual nuance).
      *   *Rationalisation:* "I work hard for money, but say it's for God." *Verdict:* Substantive and arguable (Marxist critique).
      *   *Institutional Hardening:* "The machine runs itself now." *Verdict:* Near-trivial/True (iron cage).

  4.  **Analyze the Friend's Critique:**
      *   *Critique A: "Dishonest/Smuggles in PWE."* This implies the novelist is suggesting the *belief* causes the *work*, but since both work hard, it implies the atheist *shouldn't* work hard if PWE were the only driver. Or, it implies the novelist is relying on a stereotype that Nonconformists *must* be industrious.
      *   *Critique B: "Refutes PWE."* This implies that if PWE were true, the loss of faith should stop the work. Since the work continues, the theory is busted.
      *   *Resolution:* The friend is shifting between the *Individual-Psychology* version (Critique B) and the *Institutional/Cultural* version (Critique A).
      *   *Contradiction?* Yes, technically, but often people hold the "Iron Cage" view (it persists without faith) and the "Cultural Stereotype" view (Nonconformists are distinctively hardworking) simultaneously without realising the tension.

  5.  **Analyze the Scene's Validity:**
      *   Can two brothers test this?
      *   *Individual level:* Yes, it isolates the variable of faith.
      *   *Structural level:* No, because they inherited an *existing* mill. The "Iron Cage" is already built.
      *   *Conclusion:* The scene tests the Individual-Psychology version well, but fails to test the Generational/Structural versions because the economic machinery is already in place.

