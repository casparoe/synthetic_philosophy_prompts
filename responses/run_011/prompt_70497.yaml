answer: |-
  This is a splendid muddle, and entirely characteristic of how the 'Protestant Work Ethic' (PWE) functions in public discourse. It is rarely used as a precise historical thesis; rather, it is a bucket into which people throw half-remembered ideas about capitalism, conscience, and culture. Your friend has not contradicted himself so much as he has reached into the bucket twice and pulled out two different objects without noticing the difference.

  To rescue your scene, you must separate the *origin* of the behaviour from the *maintenance* of the behaviour. Here is the menu of precise claims that slogan might stand for, evaluated as requested.

  ### The Menu of Claims

  **1. The Individual-Psychology Version**
  *The Claim:* A specific doctrine (e.g., predestination, calling) creates a specific psychic anxiety in the believer, which is relieved only by systematic labour. Without the belief, the specific drive vanishes.
  *Verdict:* **Substantive and arguable.** It is plausible for certain individuals in certain moments, but historically difficult to prove. It relies on a chain of internal causation that leaves no paper trail. It is often too brittle to explain broad economic shifts.

  **2. The Population-Level Version**
  *The Claim:* Communities that hold these beliefs accumulate capital faster over generations than those that do not, regardless of any single individual's motivation. The mechanism is social enforcement or network trust, not inner anxiety.
  *Verdict:* **Substantive and arguable.** This is a sociological claim about group cohesion and reputation. It is testable via demographic data, though confounding variables (geography, law, war) make it fiercely contested.

  **3. The 'Remover of Inhibitor' Version**
  *The Claim:* Religion did not supply a new drive, but removed an old brake. Medieval Catholicism morally suspicious of profit/usury; Nonconformity made profit morally neutral or virtuous. The energy was always there; the theology got out of the way.
  *Verdict:* **Substantive and arguable.** This is often a stronger historical claim than the 'drive' version. It explains why capitalism exploded in previously Christian lands rather than appearing from nowhere.

  **4. The 'Elective Affinity' Version**
  *The Claim:* Religious ideas and economic interests did not cause one another, but found one another useful. The preacher needed the miller's money; the miller needed the preacher's moral cover. They aligned because it suited both, not because one birthed the other.
  *Verdict:* **Substantive and arguable.** This avoids the trap of simple causation. It suggests a marriage of convenience between pulpit and loom.

  **5. The 'Rationalisation' Version**
  *The Claim:* The beliefs are not causes at all. Men work hard for greed or survival, then adopt religious language to make that conduct intelligible and honourable to themselves and their neighbours. The theology is the story told afterwards.
  *Verdict:* **Substantive and arguable.** This is the materialist critique. It treats the ethic as a superstructure built on an economic base. It is cynical but robust.

  **6. The 'Iron Cage' Version**
  *The Claim:* The habits and institutions created by the initial religious impulse have hardened into a secular economic order. The machine now runs on competition and survival, not conscience. The creed is dead; the conduct remains because the alternative is ruin.
  *Verdict:* **Near-trivial.** By the 1870s, this is almost certainly true. Once a competitive market is established, one must work hard to survive within it, regardless of one's prayer life. To do otherwise is to go bankrupt.

  ***

  ### Diagnosing Your Friend's Critique

  Your friend's confusion stems from sliding between Version 1 and Version 6 without acknowledging the shift.

  **When he says the scene is 'dishonest' (smuggling in the ethic):**
  He is relying on **Version 2 (Population-Level)** or a cultural stereotype derived from **Version 1**. He is suggesting that by making *both* brothers work hard, you are implicitly relying on the cultural expectation that 'Northern Nonconformists are industrious', while simultaneously removing the theological engine that supposedly justifies that stereotype. He feels you are having your cake (the cultural trope of the hardworking chapel-goer) and eating it (showing the trope persists without the chapel). He thinks you are using the PWE as a cultural shorthand without paying the theological price.

  **When he says the scene 'refutes' the ethic:**
  He is relying strictly on **Version 1 (Individual-Psychology)**. He is arguing: "If the Work Ethic requires Faith, and Brother B has no Faith, Brother B should not work hard. Brother B works hard. Therefore, the Work Ethic is false." He is treating the PWE as a claim about necessary conditions for individual motivation.

  **Can both claims come from one slogan without contradiction?**
  Yes, but only if one distinguishes between *genesis* and *persistence*.
  *   The 'Refutes' claim attacks the idea that faith is *necessary* for the behaviour *now*.
  *   The 'Dishonest' claim attacks the idea that you can depict the behaviour without acknowledging the *historical source* of the culture they inhabit.
  Your friend is essentially saying: "You've shown the engine running without fuel (Refutes), but you're still painting it to look like a fuel-driven engine (Dishonest)." He is accusing you of ignoring Version 6 (The Iron Cage). He wants you to acknowledge that the atheist brother works hard not because he is virtuous, but because the *system* forces him to.

  ***

  ### Can Your Scene Test Any of This?

  **The Short Answer:**
  No, not on its own. A single scene with two brothers in an *inherited* mill cannot distinguish between these claims, because the variable you are testing (faith) has been contaminated by the variable of *circumstance*.

  **The Long Answer:**
  Your scene isolates the **Individual-Psychology Version (1)**. If the atheist brother works hard *despite* having no fear of hell and no desire for a 'calling', you have successfully shown that Version 1 is not universally true. You have demonstrated that a man can be industrious without Calvinist anxiety.

  However, your scene cannot test **Version 6 (The Iron Cage)**, which is the most historically probable explanation for the 1870s. By the 1870s, the Nonconformist mill is not a theological project; it is a competitive business. If the atheist brother stops working, he does not lose his salvation; he loses the mill to a competitor. The 'ethic' has become 'economic necessity'.

  Because they *inherited* the mill, they inherited a system already built. The 'Iron Cage' was locked before the father died. The atheist brother is not working hard because of an ethic; he is working hard because the ledgers demand it. The devout brother is working hard perhaps for the ledgers, perhaps for God, but the outcome is identical because the *market* enforces the behaviour, not the chapel.

  **How to Fix the Chapter:**
  If you wish to satisfy the historian without turning the novel into a thesis, you do not need to change the behaviour. You need to change the *texture* of the motivation.

  1.  **For the Devout Brother:** Let him frame the toil as spiritual. He checks the ledger and sees 'stewardship'. He refuses a week off because idleness is sin.
  2.  **For the Atheist Brother:** Let him frame the toil as trap. He checks the ledger and sees 'survival'. He refuses a week off because the competition will eat him. He should perhaps express weariness or resentment that the devout brother does not feel.

  If both brothers work identically but *feel* identically about it, your friend is right: you are smuggling in a cultural stereotype. If they work identically but one feels sanctified and the other feels trapped, you have captured the transition from Version 1 (Psychology) to Version 6 (Iron Cage).

  The PWE is not a law of physics; it is a historical moment where conscience and commerce overlapped. By the 1870s, the conscience had largely faded, leaving the commerce. Your scene is honest only if the atheist brother acknowledges that he is a prisoner of the machine his father built, not a disciple of the faith his father held.
