          4.  The Verdict on the Scene (can it test the theory?).
      *   *Language Check:* Ensure "s" instead of "z" in organisational words (behaviour, honour, etc.), appropriate vocabulary (mill, chapel, ledger).

  7.  **Refining the Content (Self-Correction during drafting):**
