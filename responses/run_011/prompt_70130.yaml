  ### The Verdict
  Desmond will rule the husband's statement **Wrong**.

  ### The Rules That Fit
  To understand Desmond's consistency, we must distill the principles governing his five previous verdicts. Two competing rules emerge, but only one fits every case.

  **Rule A: Strict Correspondence.**
  *   *Definition:* A statement is truthful only if the words correspond to objective reality as commonly understood.
  *   *Fit:* Fits the Nurse (shot stings), the Son (cooking mediocre), and the Husband (love is romantic).
  *   *Failure:* Fails the Priest and the Sister. In those cases, the words ("No money," "In the garage") could be objectively false or misleading, yet Desmond calls them "Fine."

  **Rule B: Communicative Justice (The Right to the Truth).**
  *   *Definition:* A statement is truthful if the speaker intends a meaning that the words *can* bear, **provided** the listener has not forfeited their right to the full truth. Equivocation (speaking ambiguously to hide a truth) is permissible only when the questioner has no moral or legal right to the information.
  *   *Fit:*
      *   **Ex/Mugger/Reporter:** They have no right to the truth (due to malice or lack of jurisdiction). Equivocation is **Fine**.
      *   **Nurse/Mother:** They have a right to trust and honesty within a caring relationship. Deception is **Wrong**.
      *   **Priest:** The reporter has no right to the benevolence fund's status. Restriction is **Fine**.

  **Why Rule B Fits Best:**
  Rule B is the only one that explains why Desmond allows the Priest to mislead the reporter but forbids the Son from misleading the mother. The difference isn't the *words* (both are technically equivocations); it's the *relationship*. The reporter is an outsider; the mother is family. The husband, like the mother and the nurse, is in a covenant relationship where the other party has a **strict right to the truth**.

  In the husband's case, "love" in a marital context has a specific, binding definition (romantic/covenantal commitment). To use it while intending only "benevolence" is to exploit an ambiguity in a context where clarity is owed. It violates the justice due to a spouse.

  ### The Oath Variation
  **Would he change his mind if the words were spoken under oath?**
  **No.** The verdict remains **Wrong**, but the gravity increases.

  *   **Kitchen Table:** The statement is wrong because it violates *marital justice*. The wife has a right to the truth based on the wedding vow.
  *   **Under Oath:** The statement is wrong because it violates *legal justice* and constitutes perjury. An oath explicitly removes the license for mental reservation; it demands univocal speech.

  Desmond wouldn't change the *verdict* (it's wrong in both), but he would argue that under oath, the "Right to Truth" is absolute and formalized, whereas at the kitchen table, it is relational. If Desmond had ruled the kitchen table case "Fine" (arguing private equivocation is allowed), he would *have* to change his mind for the oath. But given his strictness with the Mother (Case 5), he views relational covenants as binding as legal ones.

  ### The Crucible Case
  To separate the "Strict Correspondence" rule from Desmond's actual "Communicative Justice" rule, you need a case where the words are technically false (or misleading), the intent is benevolent, but the listener has **no right to the truth**.

  **The Case:**
  > A friend is planning a surprise birthday party for his wife. The wife asks him point-blank, "Are you planning a surprise party for me?" He knows she will ruin the surprise if she knows. He answers, "No, I'm not doing anything like that."

  **Why this separates the rules:**
  *   **Strict Correspondence Rule:** Verdict **Wrong**. The statement is objectively false. Kindness (surprise) does not justify lying (see Nurse Case).
  *   **Desmond's Rule (Communicative Justice):** Verdict **Fine**. The wife, in this specific context, has temporarily forfeited her right to the truth to preserve the good of the surprise. The husband's intent is benevolent, and the listener's right to know is suspended by the nature of the gift.

  If Desmond rules this **Fine**, he confirms that his prohibition is not on *falsehood* per se, but on *injustice*. If he rules it **Wrong**, he is a true Augustinian absolutist who rejects all mental reservation, and his previous "Fine" verdicts on the Priest and Sister must be re-evaluated as errors or exceptions for life-and-death situations only. Given his handling of the Priest, the **Fine** verdict is the consistent choice.
