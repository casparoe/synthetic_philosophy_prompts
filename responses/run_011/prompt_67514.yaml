      *(Refining the Third Metaphor)*: The prompt suggests "testimony... or the offering of a witness." I should develop this. In a trial, a witness speaks their truth. The *jury instruction* (the law) must be neutral, but the *evidence* can be particular. This aligns with the Habermasian split but avoids the "translation" fiction. The religious citizen testifies; the legislature translates *into law*, not the citizen translating *into reason*.

