      *   *Mapping Failure 4 (Informal vs. Formal):*
          *   *Analysis:* In the informal sphere (multilingual assembly), translation isn't needed. In the formal sphere (court), it is. The metaphor blurs this. In court, you can't just speak *any* language; you need a certified interpreter. Who pays? Who controls the interpretation?

  5.  **Address Specific Prompts:**
      *   *Command vs. Claim:* Crucial point. Religious reasons often function as trumps (Dworkin) or commands. Public reasons function as weights in a balance. Translation changes the *logic* of the argument, not just the vocabulary.
