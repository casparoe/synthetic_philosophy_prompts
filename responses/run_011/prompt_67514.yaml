          *   *Example:* Physician-assisted dying. "Life is God's property" vs. "Bodily integrity/Social meaning of medicine."
          *   *Analysis:* The *source* of authority changes. A command implies non-negotiability. A public reason implies weighability. If I say "God forbids it," there are no exceptions. If I say "It harms social trust," exceptions might be carved out. *Conclusion 1 fails.*
      *   *Mapping Failure 2 (Equal Burden):* Is the "common tongue" neutral?
