prompt: |-
  I sit on the grants panel of a mid-sized city's community foundation, and our program has a weird legacy clause. The original donor was a Rousseau reader, and the trust deed says the money is for spectacles in which the citizens themselves are the performers, and explicitly not for entertainment that turns them into an audience. Everyone on the panel has been treating that as a mood rather than a rule, and we loose more time arguing about what the donor meant than actually reading applications. We get about 40 a cycle, two cycles a year, each read by two panelists with twenty minutes apiece, and only one of us has any arts training. The executive director signs off and applicants can appeal, so whatever we write down has to survive being read back to us later.

  What I want is a procedure my panel can actually run on an application, built out of what Rousseau argued in the Letter to d'Alembert — his long reply to d'Alembert's Encyclopédie entry on Geneva, where d'Alembert floated the idea of a theater there and Rousseau said Geneva should have open-air public festivals instead. Not a summary of him; the working rule set. So: the questions to ask in order, what counts as a sufficient answer to each, which questions can end the review with a no, and where the procedure has to stop and hand the decision to a person because it's a question of values rather than anything we can look up in the file.

  A few things it specifically needs to get right. Rousseau's charge isn't that plays are badly made, it's that they can't change anybody — they take the dispositions an audience already has and give them a pleasant workout, and a playwright who wants to sell tickets has to flatter the room, so the satire always lands on someone the audience was already happy to see mocked. He works that out at length on Molière's Misanthrope, and the argument generalizes. If that's really the argument, then a big chunk of what our applicants promise (this show will change how people here think about X) fails for a reason that has nothing to do with the quality of the show, and the procedure needs a separate track for that case rather than letting it sneak in as artistic merit. Also: what he objected to was the asymmetry between the few who perform and the many who sit in the dark, plus the money and hours that costs and who is priced out of both — not participation as a warm feeling. Define that asymmetry in terms two tired volunteers can check against an application form, and say what evidence in a file would settle it either way.

  Then run it on three of ours: an acclaimed fringe company touring a satire of our own city council to six neighborhood halls; an annual street dance and cook-off, free, no stage, anyone can enter, which our arts-trained panelist thinks is amateur rubbish; and a community musical with an all-local amateur cast, a professional director, and thirty-dollar tickets in a proper theater. If the first one comes out a no, say so plainly — it's the best work we fund and I'd rather find that out now than in an appeal.

  Last thing, be straight about what doesn't survive the trip. Some of his reasons are unusable for us, the stuff about the acting profession as a trade and about women on the stage, and I want the procedure to say it's quarantining those rather than quietly dropping them. Tell me which of his underlying commitments the rest of the procedure is leaning on without admitting it, which distinction would break if we simplified it, where it's going to misfire in practice, and what it simply cannot decide.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **User Role:** Grants panelist for a mid-sized city community foundation.
      *   **Problem:** A legacy clause based on Rousseau's *Letter to d'Alembert* (citizens as performers, not audience) is being treated vaguely, causing inefficiency and conflict.
      *   **Task:** Create a concrete, actionable procedure (rule set) based *specifically* on Rousseau's arguments in the *Letter to d'Alembert*, not a general summary.
      *   **Requirements:**
          *   Ordered questions with sufficient answers.
          *   Kill criteria (questions that end review with a "no").
          *   Hand-off points (where human judgment is needed vs. procedural check).
          *   Specific focus on Rousseau's critique of theater (passivity, flattery of existing dispositions, asymmetry of performer/audience).
          *   Application to three specific cases (Fringe Satire, Street Dance/Cook-off, Community Musical).
          *   Transparency about unusable Rousseau arguments (misogyny, anti-professionalism) and underlying commitments.
          *   Honesty about limitations/misfires.
      *   **Constraints:** 40 applications/cycle, 2 cycles/year, 2 panelists/app, 20 mins/app, only 1 arts-trained panelist. Decisions must survive appeal/ED review.

  2.  **Deconstruct Rousseau's *Letter to d'Alembert* (Relevant Parts):**

      *   *Core Thesis:* Theater creates a passive audience; Festivals create active citizens.
      *   *The "Change" Argument:* Theater doesn't moralize; it reflects existing mores. To succeed, it must please the audience. Therefore, it reinforces prejudice rather than challenging it (e.g., *The Misanthrope* makes virtue look ridiculous).
      *   *The "Asymmetry" Argument:* Theater separates the few (actors) from the many (spectators). It costs money (exclusion) and time (idleness).
      *   *The "Festival" Alternative:* Open-air, free, no stage, everyone participates (e.g., planting a stake, dancing around it).
      *   *Excluded/Problematic Arguments:* Actresses as morally corrupting, actors as idle/vain professions, specific gender roles. (User explicitly asked to quarantine these).

  3.  **Drafting the Procedure (The "Rousseau Filter"):**

      *   *Goal:* Make it check-boxy enough for tired volunteers but philosophically robust enough to satisfy the deed.
      *   *Structure:*
          1.  The Asymmetry Check (Pass/Fail).
          2.  The Flattery Check (Pass/Fail).
          3.  The Value Judgment (Panel Discretion).
      *   *Question 1 (Asymmetry):* Is there a clear line between performer and spectator? Is there a ticket price? Is there a stage?
          *   *Rousseau Logic:* If you pay to watch, you are idle. If you perform, you are active.
          *   *Kill Switch:* If there is a ticket price *and* a designated stage/seating arrangement where >50% of attendees are non-performers.
      *   *Question 2 (The "Change" Claim):* Does the application claim to challenge social norms or change minds?
          *   *Rousseau Logic:* Theater *cannot* do this. It flatters. If they claim they *will* change minds through a performance, they are promising the impossible according to the deed's philosophy.
          *   *Nuance:* If they claim to *express* shared values (festival style), that's okay. If they claim to *teach/correct* via spectacle, that's a fail.
      *   *Question 3 (Participation):* Is participation open to all citizens without audition/fee?
      *   *Hand-off:* When does it become "values"? When defining "citizen" or "community."

  4.  **Refining the Procedure for the User's Constraints:**

      *   *Time:* 20 minutes per panelist. The check needs to take 5 minutes.
      *   *Expertise:* Only one arts-trained. Avoid jargon. Focus on logistics (tickets, stages, auditions).
      *   *Appeal Proof:* Needs clear citations from the application form.

  5.  **Applying to the Three Cases:**

      *   *Case 1: Fringe Satire (City Council).*
          *   *Setup:* Touring, neighborhood halls, ticketed (implied by "fringe company touring"), audience sits, actors act.
          *   *Rousseau Verdict:* **FAIL.** It creates spectators. It flatters the audience's existing dislike of the council (Misanthrope argument). It claims to change thinking (impossible per Rousseau).
          *   *User Note:* "If the first one comes out a no, say so plainly." -> I must be direct here.
      *   *Case 2: Street Dance/Cook-off.*
          *   *Setup:* Free, no stage, anyone enters.
          *   *Rousseau Verdict:* **PASS.** This is the "Festival." No asymmetry.
          *   *Panelist Conflict:* Arts-trained panelist thinks it's "rubbish."
          *   *Rousseau Counter:* Quality doesn't matter; participation matters. The procedure must override the "arts merit" concern.
      *   *Case 3: Community Musical.*
          *   *Setup:* Amateur cast, Pro Director, $30 tickets, Theater.
          *   *Rousseau Verdict:* **FAIL.** The tickets create exclusion. The theater creates asymmetry. The pro director creates a hierarchy of taste. Even if locals act, the audience is passive.

  6.  **Addressing the "Quarantine" and "Underlying Commitments":**

      *   *Quarantine:* Explicitly list the sexist/classist bits of Rousseau we are ignoring (actors are liars, women on stage are immodest).
      *   *Underlying Commitments:* We are prioritizing *civic cohesion* over *artistic excellence*. We are assuming *passivity is harmful*.
      *   *Misfires:* What if a "festival" is actually exclusionary (e.g., only certain neighborhoods know about it)? What if "participation" is coerced? The procedure can't catch subtle exclusion.
      *   *Cannot Decide:* Whether the activity actually *builds* virtue. We can only check the *structure*.

  7.  **Review and Refine:**

      *   *Tone:* Professional, direct, slightly bureaucratic but philosophically grounded.
      *   *Check:* Did I answer the specific prompt about the "Change" argument? Yes, need to make sure the procedure flags applications that promise "social change through viewing" as non-compliant.
      *   *Check:* Did I handle the "Asymmetry" definition? Yes, define it via tickets and physical separation.
      *   *Check:* Did I handle the "Hand-off"? Yes, mark where the ED or full panel must weigh in.

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure I don't just say "No Theater." Rousseau allows spectacles if everyone is involved. The Musical *might* pass if it were free and open, but the $30 ticket kills it.
      *   *Correction:* The Fringe Satire is the hardest pill to swallow. I need to explain *why* it fails the "Change" test specifically, not just the "Audience" test. Rousseau argues satire confirms prejudice.
      *   *Correction:* Ensure the "Quarantine" section is distinct.

  9.  **Final Output Structure:**
      *   Introduction (The Mandate).
      *   The Procedure (The 4-Step Filter).
      *   The Quarantine (Excluded Rousseau arguments).
      *   The Application (Running the 3 cases).
      *   The Limitations (What this procedure cannot do).

  (Proceed to generate response based on this thought process.)
answer: |-
  Here is a procedural manual designed for your panel. It translates Rousseau's *Letter to d'Alembert* into a compliance checklist that fits your time constraints (20 minutes per application) and expertise levels (one arts-trained panelist).

  ### Part 1: The Procedure (The "Geneva Filter")

  **Time Allocation:** 5 minutes for checklist, 10 minutes for discussion, 5 minutes for documentation.
  **Required Evidence:** Application form sections on "Audience," "Budget/Ticketing," and "Participant Selection."

  #### Step 1: The Asymmetry Check (Pass/Fail)
  *This determines if the structure creates spectators.*

  **Question 1.1:** Is there a monetary cost for a citizen to enter the space where the spectacle occurs?
  *   **Sufficient Answer:** "No." (Free entry).
  *   **Fail Condition:** "Yes" (Ticket price, donation required, membership fee).
  *   **Rousseau Logic:** Cost excludes the poor and turns the event into a commodity rather than a civic duty.

  **Question 1.2:** Is there a physical or procedural separation between those doing the activity and those watching it?
  *   **Sufficient Answer:** "No." (No stage, no seating assignments, no "do not cross" lines).
  *   **Fail Condition:** "Yes." (Designated stage, proscenium, seated audience, auditions required to perform).
  *   **Evidence:** Look for floor plans, seating charts, or "audition" language in the methodology.
  *   **Rousseau Logic:** If 50% + 1 of the people present are watching rather than doing, the civic bond is broken. The many become idle; the few become vain.

  **Decision Point:** If **either** 1.1 or 1.2 is a Fail, the application is **Non-Compliant**. Stop reading. Mark "Structural Exclusion."
  *   *Exception:* If the applicant proposes a "sliding scale" or "pay what you can," this counts as a Fail. Rousseau argues free must mean free.

  #### Step 2: The Flattery Check (Pass/Fail)
  *This determines if the content promises impossible moral change.*

  **Question 2.1:** Does the application claim the spectacle will "challenge," "change," or "educate" the audience's views on a social or political issue?
  *   **Sufficient Answer:** "No." (The goal is celebration, expression, or shared exercise).
  *   **Fail Condition:** "Yes." (e.g., "This play will make people rethink homelessness," "This satire will expose council corruption").
  *   **Rousseau Logic:** Theater cannot change mores; it reflects them. To sell tickets, the artist must flatter the audience's existing prejudices. A claim of moral improvement via spectatorship is a false promise under the deed.

  **Question 2.2:** If the answer to 2.1 is "Yes," is the "change" achieved by turning the audience into performers?
  *   **Sufficient Answer:** "Yes." (e.g., "Residents will debate the issue during the event").
  *   **Fail Condition:** "No." (The audience watches a resolution unfold).
  *   **Decision Point:** If 2.1 is a Fail and 2.2 is a Fail, the application is **Non-Compliant**. Mark "Misanthrope Trap."

  #### Step 3: The Citizenship Check (Human Judgment Required)
  *This is where the procedure hands off to the panel.*

  **Question 3.1:** Who is defined as a "participant"?
  *   **Procedure:** If the event is open to "anyone in the city," it passes. If it is open to "members," "residents of X neighborhood," or "selected artists," the panel must vote on whether this constitutes a "faction" rather than a "public."
  *   **Hand-off:** This requires value judgment. The checklist cannot define "community." If the panel disagrees, refer to the Executive Director for a ruling on "Civic Scope."

  #### Step 4: Documentation for Appeal
  To survive the ED review and appeals, your rejection notes must cite the specific clause, not artistic merit.
  *   **Do not write:** "The acting was amateur" or "The satire was too mean."
  *   **Do write:** "Application proposes ticketed entry (Clause 1.1)" or "Application posits audience moral improvement via spectatorship (Clause 2.1)."

  ---

  ### Part 2: The Quarantine (Excluded Arguments)

  You asked to be straight about what doesn't survive the trip. Rousseau's text contains arguments that are legally and ethically unusable for a modern foundation. Your panel must explicitly agree to ignore the following, even though they are central to Rousseau's text.

  1.  **The Moral Character of Actors:** Rousseau argues actors are inherently vain, liars, and morally corrupt because they pretend to be others.
      *   *Quarantine:* You cannot reject an application because the participants are "pretending." A community musical involves pretending. The objection must be about the *structure* (tickets/stage), not the *act* of performance.
  2.  **Gender and Modesty:** Rousseau argues women on stage compromises public modesty and disrupts family structures.
      *   *Quarantine:* Irrelevant. Do not consider the gender composition of the cast.
  3.  **The "Trade" Argument:** Rousseau argues that making art a profession (selling it for money) corrupts the art.
      *   *Quarantine:* You cannot reject an application simply because the artists are paid professionals. You can only reject it if their professional status creates the *asymmetry* in Step 1 (e.g., they are the only ones allowed on stage while others pay to watch).

  **Underlying Commitment:** By using this procedure, your panel is admitting that **Civic Participation > Artistic Excellence.** You are prioritizing the *process* of democracy over the *product* of culture. If the arts-trained panelist argues the street dance is "rubbish," the procedure mandates you fund it anyway, because Rousseau values the *doing* over the *quality*.

  ---

  ### Part 3: Running the Cases

  Here is how the procedure applies to your three specific examples.

  #### Case 1: The Fringe Satire (City Council)
  *   **Profile:** Touring company, 6 neighborhood halls, ticketed (implied by "fringe company"), audience seated.
  *   **Step 1 (Asymmetry):** **FAIL.**
      *   *Evidence:* "Neighborhood halls" implies a venue. "Fringe company" implies a distinct troupe. If there is seating and a stage, the asymmetry exists. Even if tickets are cheap, if money changes hands for entry, it fails 1.1.
      *   *Rousseau Logic:* The audience sits in the dark; the actors stand in the light.
  *   **Step 2 (Flattery):** **FAIL.**
      *   *Evidence:* It is a satire of the city council.
      *   *Rousseau Logic:* This is the *Misanthrope* problem. The audience already dislikes the council. The play confirms their prejudice. It does not change them; it comforts them in their existing judgment. It creates a faction (the people vs. the council) rather than a whole.
  *   **Verdict:** **NO.**
  *   **Note to Panel:** You said this is the "best work" you fund. Under this deed, it is the *most dangerous* work you fund. It creates passive spectators who feel virtuous because they laughed at power, without actually exercising power themselves. If you fund this, you are violating the donor's specific philosophical constraint.

  #### Case 2: The Street Dance and Cook-off
  *   **Profile:** Free, no stage, anyone can enter, annual.
  *   **Step 1 (Asymmetry):** **PASS.**
      *   *Evidence:* "No stage," "Free."
      *   *Rousseau Logic:* This is the "Stake in the Ground" festival Rousseau proposes. People gather in the open air.
  *   **Step 2 (Flattery):** **PASS.**
      *   *Evidence:* It is a cook-off and dance. It is not claiming to change political views.
  *   **Step 3 (Citizenship):** **PASS.**
      *   *Evidence:* "Anyone can enter."
  *   **Verdict:** **YES.**
  *   **Note to Panel:** The arts-trained panelist thinks it is "amateur rubbish." **This opinion is irrelevant under the deed.** Rousseau explicitly argues that the *quality* of the festival matters less than the *participation*. If the panel rejects this based on quality, you are violating the trust. You are funding civic glue, not art.

  #### Case 3: The Community Musical
  *   **Profile:** Amateur cast, Pro Director, $30 tickets, Proper Theater.
  *   **Step 1 (Asymmetry):** **FAIL.**
      *   *Evidence:* "$30 tickets," "Proper Theater."
      *   *Rousseau Logic:* Even if the cast is local, the moment you put them on a stage and charge the neighbors $30 to sit in seats, you have recreated the theater structure. The cast becomes "the few," the neighbors become "the many." The $30 price tag excludes the poor, violating the "public" nature of the trust.
  *   **Step 2 (Flattery):** **Likely FAIL.**
      *   *Evidence:* Musicals usually aim for emotional catharsis via watching, not doing.
  *   **Verdict:** **NO.**
  *   **Note to Panel:** The "Amateur Cast" is a trap. It looks like participation, but it is participation for the few, spectacle for the many. Rousseau would argue this is worse than a pro play because it tricks citizens into thinking they are participating when they are actually just working for free to entertain their paying neighbors.

  ---

  ### Part 4: Limitations and Misfires

  You asked what this procedure cannot decide and where it will break.

  **1. The "Quality" Misfire**
  *   **Problem:** The procedure forces you to fund the "rubbish" street dance over the "acclaimed" satire.
  *   **Risk:** Public backlash. The foundation may be accused of wasting money on low-quality events.
  *   **Mitigation:** Your public guidelines must state clearly: "We fund participation, not production value." If you don't say this upfront, the appeal process will destroy you.

  **2. The "Subtle Exclusion" Blind Spot**
  *   **Problem:** Step 1 checks for *formal* exclusion (tickets, stages). It cannot check for *social* exclusion.
  *   **Risk:** A "free, open" event might be held in a neighborhood that feels unsafe to others, or at a time when working parents can't attend. The procedure will mark this as a Pass, but it violates the spirit of "all citizens."
  *   **Hand-off:** This is where the Executive Director must intervene. The checklist cannot measure social comfort.

  **3. The "Change" Paradox**
  *   **Problem:** Rousseau argues art *cannot* change people. But your foundation likely has other goals (social justice, equity) that *require* change.
  *   **Risk:** This specific trust deed is philosophically incompatible with "Social Change through Arts" funding.
  *   **Reality:** You cannot fund "awareness campaigns" with this money. If an applicant says "This will raise awareness," you must reject them under Step 2. This will drastically shrink your pool of eligible applicants.

  **4. The Value Hand-off**
  *   **Where the Procedure Stops:** Step 3 (Citizenship).
  *   **Why:** Rousseau assumes a homogeneous "General Will." Your city is diverse. Defining who counts as a "citizen" eligible to participate is a political decision, not a procedural one.
  *   **Instruction:** If panelists argue over whether a specific group counts as "the public," do not vote. Flag it for the Board. The procedure cannot solve political definition disputes.

  ### Summary Instruction for the Panel
  "Colleagues, we are not art critics. We are compliance officers for an 18th-century philosopher. If there is a ticket price, it's a No. If there is a stage, it's a No. If they promise to change minds by making you watch, it's a No. If it looks like a block party where everyone dances, it's a Yes, even if the dancing is bad. Anything else is an appeal waiting to happen."
