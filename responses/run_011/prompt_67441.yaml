answer: |-
  You have identified a genuine and widely discussed tension in environmental ethics, but you are correct that there is no single, standard noun that captures the *structural inconsistency* you describe. The literature usually describes the *conflict* (Individualism vs. Holism) or the *intuition* (Laissez-Faire), but rarely names the specific rhetorical mechanism of switching principles based on the beneficiary.

  Here is an analysis of the nearby concepts, why they fall short, and a proposed coined term with a rigorous definition and boundaries.

  ### 1. Nearby Concepts and Why They Don't Fit

  **The Laissez-Faire Intuition**
  *   **Source:** Most notably articulated by philosopher Clare Palmer (*Animal Ethics in Context*, 2010).
  *   **What it is:** The intuition that humans have a duty not to harm wild animals, but no duty to aid them or prevent natural harms (predation, starvation).
  *   **Why it doesn't fit:** Palmer herself acknowledges that this intuition is often inconsistent. The term describes the *baseline* reluctance to help, but it does not name the *exception mechanism* you observed (i.e., why we override this intuition for conservation goals but not for suffering individuals). It describes the rule, not the selective suspension of the rule.

  **Environmental Holism (The Land Ethic)**
  *   **Source:** Aldo Leopold, J. Baird Callicott.
  *   **What it is:** The ethical view that the primary unit of moral value is the ecosystem, species, or biotic community, not the individual organism.
  *   **Why it doesn't fit:** This is a *value theory*, not a description of the rhetorical switch. A consistent Holist would admit: "We interfere because individuals don't matter as much as the system." The pattern you identified is more subtle: objectors often argue from *non-interference* (a deontological constraint) when individuals are at stake, but switch to *consequentialism* (systemic outcomes) when conservation is at stake, without admitting they have changed ethical frameworks. Holism justifies the asymmetry; it doesn't name the asymmetry itself.

  **Status Quo Bias**
  *   **Source:** Psychology / Behavioral Economics.
  *   **What it is:** A preference for the current state of affairs; any change is perceived as a loss.
  *   **Why it doesn't fit:** In the cases you mention (e.g., poisoning rodents on an island), the "status quo" is actively being overturned. The objectors are not preserving the current state; they are restoring a *historical* state or engineering a *preferred* state. The bias isn't toward "nature as it is," but toward "nature as we value it."

  **Conservation Exceptionalism**
  *   **Source:** Informal usage in policy critiques.
  *   **What it is:** The idea that conservation goals grant special exemptions from normal ethical or legal constraints.
  *   **Why it doesn't fit:** This is close, but it usually refers to legal exemptions (e.g., killing protected species to save a wider ecosystem). It doesn't capture the moral rhetoric of "hubris" vs. "restoration" that you identified.

  ### 2. The Coined Term: **Teleologically Gated Non-Interference**

  Since no existing term captures the specific *conditional application* of the non-interference norm based on the beneficiary, I propose the term **Teleologically Gated Non-Interference**.

  #### Definition
  **Teleologically Gated Non-Interference** is a normative stance wherein the prohibition against human intervention in natural processes is treated as a binding constraint *only* when the intervention serves a beneficiary deemed morally secondary (e.g., individual wild animals), but is treated as permeable or optional when the intervention serves a beneficiary deemed morally primary (e.g., species integrity, ecosystem function, or human aesthetic preferences).

  The "Gate" is the *telos* (end goal/beneficiary). The "Non-Interference" is the means. The norm claims the means are forbidden, but the gate opens to allow the means when the ends align with specific values.

  #### Structural Outline
  1.  **The Constraint:** "We must not interfere with natural processes." (Framed as a deontological duty or epistemic humility).
  2.  **The Gate:** "Unless the interference serves [Preferred Outcome X]."
  3.  **The Asymmetry:** [Preferred Outcome X] is consistently defined as systemic/collective (species, biodiversity), while [Dispreferred Outcome Y] is consistently defined as individual (suffering, death of specific animals).
  4.  **The Rhetorical Mask:** The justification for opening the gate is often framed as "restoring nature" (aligning with the Constraint), while the refusal to open the gate for individuals is framed as "respecting nature" (aligning with the Constraint).

  ### 3. Conditions for Justification vs. Bias

  You asked for the conditions under which this asymmetry is a **justified difference in moral patients** rather than a **bias**. The distinction lies in the *consistency of the underlying value hierarchy*.

  #### When it is Justified (Principled Holism)
  The asymmetry is justified if the agent explicitly holds an **Ecocentric or Holistic Ethic** and applies it consistently.
  *   **Condition:** The agent admits that ecosystems/species have lexical priority over individuals.
  *   **Condition:** The agent accepts that if an individual's suffering *threatened* the ecosystem (e.g., a diseased animal spreading plague to an endangered species), intervention is mandatory.
  *   **Condition:** The agent accepts that if a systemic goal *required* individual suffering (e.g., culling overpopulated deer to prevent forest collapse), intervention is mandatory.
  *   **Why:** Here, the "Gate" is not a loophole; it is the explicit expression of the moral theory. The "Non-Interference" principle was never absolute; it was always shorthand for "Do not interfere with systemic integrity."

  #### When it is a Bias (Rhetorical Opportunism)
  The asymmetry constitutes a bias (specifically, a form of **Moral Schizophrenia**) when the agent claims a universal duty of non-interference but violates it selectively without acknowledging the hierarchy.
  *   **Condition:** The agent invokes "hubris" or "natural rights" to block aid to suffering individuals, implying the individuals have a right to be left alone.
  *   **Condition:** The agent simultaneously supports interventions that violate those same "rights" for systemic goals (e.g., forced relocation, sterilization, culling) without acknowledging the conflict.
  *   **Condition:** The "Preferred Outcome" is aesthetic or anthropocentric (e.g., "a landscape without dead trees") rather than objectively systemic.
  *   **Why:** Here, the "Non-Interference" principle is being used as a **shield** to avoid the cost of helping individuals, while being discarded as a **sword** to achieve preferred outcomes. The principle is not guiding the action; the preference is guiding the application of the principle.

  ### 4. Where the Term Should *Not* Apply (The Edges)

  To ensure the term remains useful, it must have limits. Do not apply **Teleologically Gated Non-Interference** in the following situations:

  **1. Triage Scenarios (Resource Constraints)**
  *   **Situation:** A conservationist says, "We cannot vaccinate every wild animal against flu because we lack the budget, but we will cull invasive rats to save seabirds."
  *   **Why not apply:** This is not a normative asymmetry about *permission*; it is a logistical calculation about *efficacy*. If the objection were "We *could* help the individuals, but we *shouldn't* because nature," the term applies. If the objection is "We *can't* help everyone, so we prioritize the most salvageable," that is **Conservation Triage**, not Teleologically Gated Non-Interference.

  **2. Epistemic Humility (Genuine Uncertainty)**
  *   **Situation:** A scientist says, "We should not stop predation because we do not understand the trophic cascades well enough to predict the outcome. However, we will eradicate rats on this island because the ecosystem is simple and the outcome is predictable."
  *   **Why not apply:** Here the "Gate" is *knowledge*, not *beneficiary*. The asymmetry is based on the *risk of unintended consequences*, not on who benefits. If the scientist would stop predation if they *were* certain of the outcome, the term does not apply.

  ### Summary
  The pattern you identified is the operational engine of modern conservation ethics, but it lacks a name. **Teleologically Gated Non-Interference** captures the mechanism: a rule that claims to regulate *means* (interference) but actually regulates *ends* (beneficiaries).

  *   **Use the term** when the objection to helping individuals relies on "letting nature be," while interventions for systems rely on "managing nature."
  *   **Withhold the term** when the asymmetry is due to resource limits or genuine uncertainty about ecological outcomes.
  *   **Diagnose as Bias** when the agent claims individuals have a right to non-interference but violates that right for systemic goals without admitting the hierarchy.
  *   **Diagnose as Justified** when the agent explicitly prioritizes systems over individuals and applies that priority consistently across all interventions.
