  6.  **Final Polish:** Ensure clear headings and bullet points for readability. (Proceed to generate output).

  *(Self-Correction on "Unique"):* The text says "unique probability function... and utility function". Technically, utility is unique *up to positive affine transformation*. Probability is unique *if* utility is fixed (Savage). I should mention this technicality as a "Defensible Simplification" vs "Wrong".

