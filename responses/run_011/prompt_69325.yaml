      *   Specific questions answered? (Rating, Beale, Schumacher, Jensen, Contradiction, Breaking point, Film's addition). Yes.

      *Let's write.*
answer: |-
  The standard reading of *Network* is that it is a prophecy fulfilled. We look at Howard Beale, the unhinged anchor, and see the godfathers of reality television, the pundits screaming into the void, the monetization of outrage. It is a comfortable reading because it lets us off the hook. It suggests the problem is merely technological, a medium that got away from us. But if you strip away the cathode ray tube and look at the spiritual mechanics, the film is not predicting the future. It is diagnosing a condition that was already terminal a century before the camera rolled.

  To see this, you have to put down the media theory and pick up Søren Kierkegaard, specifically his neglected work *Two Ages*. In it, Kierkegaard describes the "present age" as one of reflection, chatter, and passionlessness. He argues that the press creates a phantom called "the Public." This Public has no body, no meeting place, and no officers. It allows everyone to have an opinion about everything from a distance, ensuring that no one is responsible for anything. It is the age of levelling, where excellence is dragged down to the mediocre denominator of the crowd.

  When you view *Network* through this lens, the Nielsen rating ceases to be a plot device and becomes the technological completion of Kierkegaard's nightmare. Kierkegaard complained that the Public was an abstraction, a monster that couldn't be pinned down. Television invented an instrument that claims to measure the phantom. The rating gives the ghost a readout. It turns spiritual levelling into economic data. In Kierkegaard's time, the press created the crowd; in *Network*, the crowd creates the reality. The rating doesn't just measure behavior; it drives it. It is a phantom with a pulse, and the network executives are the doctors monitoring the vital signs of a corpse.

  This reframes the tragedy of Howard Beale. We often mistake Beale for a Kierkegaardian "Single Individual," the one man standing against the crowd. But look closer. When Beale first tells his audience he is going to kill himself on air, he is ignored. When he tells them to scream that they are mad as hell, he is worshipped. Why the difference? The first statement was a genuine expression of despair; the second was an invitation to collective chatter. Kierkegaard warns that the crowd is untruth. Beale becomes a prophet only when he validates the crowd's passionless passion. He gives them a ritual of screaming out the window, a physical act that requires no internal change. He is not an individual; he is a vessel for the Public.

  The moment Beale actually begins to speak the truth—telling his audience they are being dehumanized, that they are cattle, that the television is a false god—the ratings drop. The Public does not want truth; it wants reflection. It wants to talk about being mad, not to actually be mad. Beale is absorbed not because he is strong, but because he is useful. When he ceases to be useful, the system discards him. His assassination is not a martyrdom; it is a cancellation. Kierkegaard believed the Single Individual could stand before God against the world. *Network* suggests that in the media age, the Individual is just content waiting to be greenlit or cancelled.

  Then there is Max Schumacher. He is the only character who attempts to live a Kierkegaardian life. He values personal connection, responsibility, and passion over the abstract logic of the corporation. He quits. He chooses his mistress, then chooses his wife, then chooses his soul. But notice where the film leaves him. He walks out into the night, a lonely figure, while the machine grinds on. Schumacher is the ethical man in an aesthetic age. He is right, but he is irrelevant.

  This brings us to the film's terrifying center: the speech by the executive, Arthur Jensen. He tells Beale that there are no nations, no people, no Russians or Americans. There is only the corporate cosmos. This is often read as a Marxist critique of global capital, but through Kierkegaard, it is something darker. It is the spiritual realization of levelling. Jensen describes a world where the "Public" has finally consumed the "Individual" entirely. There are no people left, only systems interacting. Jensen is not a villain in a traditional sense; he is a priest of the phantom. He gives the Public a CEO. This shifts the diagnosis from merely economic to spiritual. The system isn't just greedy; it is a theology that denies the existence of the human soul. Jensen offers Beale salvation, but only if Beale admits he is not a man, but a function.

  There is an obvious contradiction here that haunts both Kierkegaard and the film's writer, Paddy Chayefsky. Kierkegaard spent his life attacking the press, yet he published his own pamphlets to do it. Chayefsky indicts television using a movie about television. Is this fatal hypocrisy? No. It is the only honest position available. You cannot stand outside the present age to critique it. You must use the tools of the age to show the age's sickness. Kierkegaard used print to show how print created the phantom; Chayefsky uses the cinematic close-up to show how the camera destroys humanity. The medium is not the message; the medium is the confessional.

  However, this is where the reading begins to break. Kierkegaard is ultimately a religious thinker. He believes that the despair of the present age can be overcome by a leap of faith, by turning inward toward the eternal. *Network* is a materialist tragedy. It offers no leap, only the fall. In Kierkegaard's view, the crowd is untruth because it distances man from God. In *Network*, the crowd is untruth because it distances man from profit. The film suggests that the system is total. Schumacher's departure is a personal victory, but the system does not notice. Kierkegaard believes the Individual is the highest category; the film suggests the Individual is a glitch.

  Furthermore, the film relies on plot resolution, which betrays the philosophy. Kierkegaard's problem is existential and endless; you do not solve the present age, you survive it. *Network* solves its problem with a hitman. Beale is shot. The ratings spike. The end. This neatness is un-Kierkegaardian. It implies that the system has a logic that can be satisfied. Kierkegaard would argue the system is madness, and you cannot satisfy madness with a corpse. By giving us a murder, the film makes the abstraction concrete. It gives the phantom a gun. But in reality, the phantom doesn't need a gun. It just needs to change the channel. The film creates a villain in the militants and the executives, but Kierkegaard would say the villain is the viewer, sitting in the dark, absolved of responsibility by the glow of the screen.

  So where does the picture add to the argument what the argument cannot achieve on its own? Kierkegaard writes in cold ink. He describes the chill of reflection. *Network* makes you feel the heat. Philosophy can describe the abstraction of the Public, but it cannot show you the horror of a man weeping on camera while a producer checks her watch. The film adds viscerality to the metaphysics. It shows that levelling is not just a lowering of standards, but a violence. When Beale is killed, the camera does not look away. It forces the audience to implicate themselves in the murder they came to watch.

  Kierkegaard warns us that the Public is a monster. *Network* shows us that the monster is us, multiplied by millions, quantified by a number, and sold back to us as entertainment. The film completes Kierkegaard's account by showing the endgame of the phantom. It is not just that nobody is responsible; it is that responsibility has been outsourced to the metric. The rating is the alibi. As long as the numbers go up, the blood on the hands is invisible.

  Ultimately, *Network* is darker than *Two Ages* because it removes the exit. Kierkegaard offers a way out through faith. Chayefsky offers only the choice between being eaten or walking away hungry. The film argues that in a world where the phantom has a readout, the truth is not just unpopular; it is bad for business. And in the present age, bad for business is the only sin that matters. The screen does not just reflect the world; it digests it. And we are the food.
