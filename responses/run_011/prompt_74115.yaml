answer: |-
  1. **Exam Question**

  **Final Examination: Personal Identity**
  **Time Allowed:** 75 Minutes
  **Word Limit:** 1200 Words Maximum
  **Total Marks:** 25

  **Question 1**

  Recall Dennett's scenario in "Where Am I?": his brain (Yorick) is removed and kept in a vat in Houston, while his body (Hamlet) remains in the lab. Through radio transceivers, Yorick controls Hamlet and receives sensory input, leading Dennett to wonder where *he* is located.

  Consider the following modification to the Houston laboratory's protocol. After the operation, the technicians begin keeping a complete, state-by-state log of Yorick's neural activity and transceiver traffic. They feed this log into a second, duplicate brain grown in a second vat (Yorick-2). Yorick-2 is wired to a second, prosthetic body (Hamlet-2) sitting in the next room. However, the system introduces a fixed ten-minute delay.

  At any given moment *t*, Yorick is processing inputs in real-time. At that same moment *t*, Yorick-2 is processing the exact neural states Yorick processed at *t-10*. Both systems are active simultaneously. A graduate student interviews both Dennetts at the same time. Yorick answers questions about the present. Yorick-2 answers every question exactly as Yorick answered it ten minutes prior; if asked a novel question, Yorick-2 responds to whatever question Yorick was asked ten minutes ago. Both vats have an output switch; flipping Yorick-2's switch off terminates the duplicate's activity without affecting Yorick.

  Write an essay addressing the following:

  1.  Standard Psychological Continuity theories often include a "non-branching" clause to handle fission cases (like Parfit's). Explain why the **Offset Scenario** described above presents a distinct problem for the Psychological Continuity criterion that standard fission does not.
  2.  When Yorick-2 says "I," what (if anything) does that term refer to? Defend your position.
  3.  Dennett concludes his story by suggesting he cannot introspectively locate himself. Does the Offset Scenario suggest this inability is evidence of a metaphysical indeterminacy, or merely a limit of introspection?

  ***

  2. **Model Answer**

  **The Lagging Self: Causality and the Offset Scenario**

  The Offset Scenario complicates the Psychological Continuity (PC) criterion not by introducing competition for identity, as fission does, but by decoupling psychological continuity from causal agency. In standard Parfitian fission, one past person branches into two future persons, forcing the PC theorist to add a "non-branching" clause to preserve the one-to-one nature of identity. The Offset Scenario, however, involves no branching event. There is only one continuous stream (Yorick) and one shadow stream (Yorick-2) that is causally dependent on the first but temporally displaced. The problem for PC here is not that there are *too many* candidates for identity, but that the candidate in the second vat lacks the appropriate causal relation to the *present* environment to sustain personhood.

  I argue that Yorick-2 is not a person distinct from Yorick, nor is it Yorick at a different time; it is a philosophical zombie generated by a tape recorder. The PC criterion requires that psychological connections be caused in the right way. While Yorick-2 possesses psychological states identical to Yorick's, the causal chain is broken regarding the present moment. When Yorick-2 says "I," the term fails to refer to a current subject of experience because there is no current subject. There is only a playback of a subject.

  This distinction makes the Offset Scenario harder than fission in one specific regard: it removes the intuition of "survival." In fission, we worry that we might survive as two people. In the Offset Scenario, we recognize that the delayed copy cannot survive anything because it cannot act. It cannot answer a novel question. It is functionally a recording. Therefore, the "non-branching" clause is irrelevant because there is no branching identity to prune. The failure is more fundamental: Yorick-2 fails the "right cause" condition of PC. It has the *content* of a person without the *capacity* for personhood, which requires real-time integration of input and output.

  Consequently, when Yorick-2 says "I," it is engaging in empty reference. It is akin to a character in a novel saying "I." The sounds are produced, and they mimic first-person reference, but there is no ontological anchor. If we grant Yorick-2 personhood, we must grant it to a sufficiently complex video recording, which dilutes the concept of identity to meaninglessness. The PC criterion must therefore include a synchronicity constraint: psychological continuity must track the *current* causal flow of the organism, not a delayed isomorphism.

  Finally, regarding Dennett's introspective uncertainty: the Offset Scenario suggests this is a limit of introspection, not metaphysics. Dennett feels he could be in the vat or the body because his first-person perspective is identical in both setups. However, the Offset Scenario shows that first-person perspective is not a reliable guide to metaphysical location. Yorick-2 likely *feels* like it is Dennett (if it feels at all), but we have determined metaphysically that it is not. Therefore, Dennett's inability to locate himself is epistemic, not ontological. The metaphysics is fixed by the causal architecture (the wires and the delay), even if the phenomenology remains ambiguous. To claim the question has no answer because Dennett feels confused is to mistake the map for the territory. Identity is determined by the causal structure of the system, and in the Offset Scenario, that structure clearly privileges the real-time Yorick as the sole locus of the "I."

  ***

  3. **Marking Scheme**

  | criterion | marks | A_move | B_move | loses_marks_when |
  | :--- | :--- | :--- | :--- | :--- |
  | **Fission vs. Offset Distinction** | 5 | Identifies that Offset lacks *branching* competition, focusing instead on *causal synchrony* or *agency*. | Notes that Offset is different from fission but treats it as merely "another branching case" or "time travel." | Confuses the 10-minute delay with a fission event where two futures compete for one past. |
  | **Psychological Continuity Application** | 5 | Argues that PC requires "right cause" + "real-time integration," showing why the log fails the "right cause" test. | Applies PC mechanically (e.g., "there is continuity of memory") without addressing the causal break introduced by the log. | Claims PC is satisfied simply because Yorick-2 has the same memories/states as Yorick, ignoring the delay mechanism. |
  | **Reference of "I"** | 5 | Takes a definitive stance (e.g., empty reference, refers to past-Yorick, or refers to nothing) and links it to the agency argument. | Hedges (e.g., "it might refer to Yorick, or maybe not") without committing to the metaphysical implications. | Asserts Yorick-2 is a fully distinct person with equal claim to the "I" without addressing the lack of novel input. |
  | **Introspection vs. Metaphysics** | 5 | Distinguishes epistemic limits (what Dennett feels) from ontological facts (the wiring), using the Copy to prove the split. | Conflates Dennett's confusion with metaphysical indeterminacy (e.g., "Because he can't tell, there is no fact."). | Dismisses Dennett's introspection entirely as irrelevant without explaining why the scenario clarifies the metaphysics. |
  | **Argumentative Coherence** | 5 | Maintains a single, consistent position throughout; the view on "I" supports the view on introspection. | Surveys multiple views without integrating them; the conclusion contradicts the premises. | Contradicts themselves (e.g., argues Yorick-2 is not a person, then argues it has a valid first-person perspective). |

  ***

  4. **Advice on "Malformed Question" Responses**

  This should be graded as a **conditional pass**. If the student argues that the question is malformed *because* Dennett's own conclusion is that personal identity is a fiction or a "center of narrative gravity" that dissolves under this pressure, they should receive full credit (provided they use the Offset Scenario to prove *why* it dissolves). However, if they simply assert "there is no answer" as a way to avoid engaging with the mechanics of the delay or the PC criterion, deduct heavily (10+ marks). The difference lies in whether they use the indeterminacy as a philosophical thesis supported by the text, or as an evasion of the prompt's requirements.
