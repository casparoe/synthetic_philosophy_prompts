answer: |-
  **MEMORANDUM**

  **TO:** Capital Projects Review Panel Members
  **FROM:** Panel Member
  **DATE:** Wednesday, October 25
  **SUBJECT:** Recommendation on Meridian Line Reserve and Reference Class Protocol

  I recommend we approve a 26% cost contingency reserve for the Meridian Line based on a weighted composite of candidate classes B and C, with sensitivity adjustments from A and D. Simultaneously, we must adopt a standing protocol that mandates minimum sample sizes and prohibits post-hoc conjunctive narrowing to prevent statistical gerrymandering in future votes.

  **Meridian Line Reserve Recommendation**

  The choice of reference class determines the reserve. Class A (44% overrun) is too broad, mixing heavy metro with light rail across decades, introducing noise that obscures relevant risk. Class D (6% overrun) is too narrow; while it correctly identifies risk mitigants like fixed-price tunnels and secured right-of-way, the sample size (n=14) is statistically unstable, and the criteria appear selected to exclude historical failures. Class B (18% overrun) offers a stable baseline for light rail design-build projects, while Class C (31% overrun) reflects our authority's specific institutional performance, though its sample is thin (n=9).

  To balance specificity with stability, I propose a weighted composite. We assign 40% weight to Class B as the primary industry baseline and 30% to Class C to honor our institutional history. Class A receives 20% weight as a ceiling sanity check against systemic optimism, and Class D receives 10% weight to acknowledge the specific risk mitigations without relying on its unstable median. This yields a blended overrun estimate of 26%. This reserve should be revised only if the fixed-price tunnel scope is altered or if right-of-way acquisition drops below the current 84% threshold.

  **Standing Protocol for Class Selection**

  The current policy's silence on class selection invites the conflict we see today. To resolve this, the Panel should adopt a three-part protocol. First, establish a minimum sample size floor (n=30) for any class used as a primary anchor. This prevents the instability evident in Class D and limits the influence of our own thin track record (Class C) unless supplemented by external data. Second, prohibit conjunctive narrowing (adding "AND" conditions) after the baseline estimate is known. Criteria must be pre-registered or justified by causal literature before cost data is examined, preventing the exclusion of outliers simply because they are outliers. Third, implement a hierarchy of similarity. We must start with the broadest relevant class (like A) and narrow only if statistically significant variance is demonstrated, rather than starting narrow and expanding only when forced. This reverses the current incentive to cherry-pick favorable comparisons.

  **Evaluation of the Sponsor's Objection**

  The sponsor's objection deserves its strongest form: reference class forecasting is theoretically invalid if the class is not causally homogeneous. They argue that ignoring specific risk drivers—geotechnical risk transfer, funding security, and right-of-way status—violates the policy's mandate to compare "similar" projects. A class that lumps secured projects with unsecured ones is not a comparison class but a smear, rendering the outside view useless. On this theoretical ground, the sponsor is correct; similarity must be causal, not categorical.

  However, the sponsor loses on statistical implementation. Class D achieves causal homogeneity by sacrificing sample stability and introducing selection bias. By filtering for success conditions post-hoc, Class D predicts success rather than risk. The protocol I propose accepts the sponsor's principle—that features matter—but rejects their method. We acknowledge the mitigations in Class D by assigning it a minority weight in the composite, but we refuse to let it anchor the estimate.

  **Discretion and Governance**

  We must be candid: no protocol eliminates discretion. Rules for choosing classes must still be applied by parties with a stake in the answer. A minimum sample size of 30 is arbitrary; why not 25 or 50? A hierarchy of similarity still requires the Panel to judge what counts as "relevant variance." The protocol does not automate judgment; it structures it. It forces the sponsor to justify narrowing criteria before seeing the numbers and forces staff to justify broad classes against specific risks. Discretion survives, but it is moved from the selection of the number to the selection of the rules. This is the best governance can achieve. We cannot remove politics from capital planning, but we can require that political choices be made over transparent rules rather than hidden statistical adjustments.

  | class | membership_rule | n | estimate | held_fixed | best_objection | weight | disposition |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | A | Urban rail, high-income, >$1bn, since 1990 | 258 | 44% | Income level, era, scale | Too heterogeneous; mixes heavy/light rail | 0.20 | retain_for_sensitivity |
  | B | Light rail, since 2000, design-build | 61 | 18% | Mode, era, procurement | Ignores specific site risks (tunnel, ROW) | 0.40 | adopt_with_adjustment |
  | C | This authority's projects, since 1995 | 9 | 31% | Institutional capacity | Sample too small for statistical stability | 0.30 | adopt_with_adjustment |
  | D | Fixed-price bored, >75% ROW, ring-fenced | 14 | 6% | Geotech risk, ROW, funding | Gerrymandered; post-hoc filtering excludes failures | 0.10 | retain_for_sensitivity |
  | Weighted Composite | Weighted average of A, B, C, D | N/A | 26% | Multiple factors via weighting | Complexity obscures single point of failure | 1.00 | adopt |
