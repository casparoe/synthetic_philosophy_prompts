  **MEMORANDUM**

  **TO:** Exhibitions Panel
  **FROM:** Chair, Exhibitions Panel
  **DATE:** Tuesday, October 24
  **SUBJECT:** Recommendation for East Wing Corridor Design (Capital Campaign Closure)

  We must settle the design of the ground-floor corridor before Thursday's capital campaign closure. After reviewing the three options against our operational constraints, stakeholder requirements, and the architectural reality of the 1911 building, I recommend we proceed with **Option A (Linear Sequence), subject to three binding modifications.**

  We cannot choose Option B. While thematically ambitious, a "no fixed route" open hall is physically incompatible with a forty-six-metre single-egress corridor. To claim non-linearity in a space that forces a single direction is to create a dissonance that visitors will feel immediately. Furthermore, the Head of Schools Programming is correct: forty percent of our visitors arrive on a forty-five-minute timer. An open-plan cluster design without a clear path will result in bottlenecks and missed curriculum points. We cannot sacrifice the educational utility of the wing for a theoretical spatial neutrality that the building's fire-egress arrangement forbids.

  Option C (Seasonal Reversal) is operationally unsustainable. For a staff of nine, reconfiguring lighting and case illumination biannually introduces a maintenance burden we cannot bear. Additionally, our senior docent has indicated that a change in route constitutes a resignation. While we must modernize our interpretation, we cannot do so by alienating the institutional memory she holds.

  Therefore, we accept the linear sequence of Option A, but we must acknowledge that the architecture itself narrates a progress story. Forty-six metres of one-way walking does ideological work that text cannot fully undo. To mitigate this, the following modifications are required for the vote:

  1.  **Indigenous Co-Curation (Case 7):** We accept the Indigenous Advisory Council's objection that their material culture cannot be staged as a "past" to be walked through and left behind. Case 7 will not be a static historical display. It will be co-curated with the Council to include contemporary Indigenous scientific practice and materials. Furthermore, a digital thread will link Case 7 to the terminal case, ensuring the narrative arc does not imply Indigenous culture terminates at the Coal Measures.
  2.  **The Terminal Critique (Case 23):** The proposed twenty-third case must do more than list "what was left out." It must explicitly quantify the uncertainty of the preceding twenty-two cases, utilizing the actuary's bequest requirement to highlight where the "progress" narrative relies on interpretation rather than data.
  3.  **The Prewitt Bust:** The bust remains in the corridor, not the rotunda. Counsel advises the rotunda satisfies the "principal gallery" covenant, but with a family member on the board, litigation risk is high. The bust will remain under its spot, but the label will be rewritten to frame Prewitt not as the culmination of the story, but as a specific, dated data point within it.

  **The Strongest Argument for Option B**
  We reject Option B, but we must acknowledge why it was proposed. The advocate for Option B correctly identifies that spatial linearity equals ideological teleology. By forcing a visitor to walk from stromatolites to a steam engine to Josiah Prewitt, we are physically enacting a Whig interpretation of history: that time moves inevitably toward greater complexity and ends with our current institution. Option B is the only proposal that attempts to break this causal chain structurally. It argues that truth is found in juxtaposition, not sequence. If we had a building with multiple egress points, Option B would be the morally superior choice. We are rejecting it solely because our walls make it a lie.

  **Premises and Disputes**
  This recommendation rests on three premises that the panel could reasonably dispute:

  1.  **Mitigation via Text:** I am assuming that a critical terminal case (Case 23) and updated labels can sufficiently counteract the ideological weight of the architecture. The proponent of Option B argues this is impossible: the body knows it is being marched forward before the mind reads the label. If the panel believes the physical walk overrides the textual critique, we must reconsider the covenant risk and move the bust.
  2.  **Operational Capacity:** I am assuming the staff can manage quarterly updates to Case 23 and the co-curation of Case 7 without burning out. If the actuary's bequest requires quantified claims with margins of error for *every* case, the curatorial load is high. If this proves unsustainable, we risk opening with incomplete labels.
  3.  **The Nature of Directionality:** This is the most critical philosophical premise. My reasoning leans on the claim that **directional change over deep time is merely difficult to display honestly**, rather than the stronger claim that **it is an artefact of how we tell it.**

      I must be plain: In natural history (stromatolites to trilobites), directionality is physically real; strata are cumulative. In human history (tools to Prewitt), directionality is contested. By keeping the linear sequence, I am implicitly accepting that the geological narrative justifies the human one. I am betting that visitors can distinguish between the thermodynamic arrow of time in the rock record and the cultural narrative of "progress" in the technology cases. If the panel believes that mixing these two distinct types of directionality in one corridor inevitably conflates them—making the cultural progress seem as inevitable as the geological record—then Option A is fundamentally flawed, regardless of our labels.

      However, given the HVAC constraint (no east wall demolition) and the school group requirements, we cannot build a new gallery. We must work within the shell we have. Option A, modified, is the only path that respects the building, the beneficiaries, and the visitors' time, while making a good-faith effort to complicate the story we tell.

  I move we vote on Option A with the modifications listed above.
