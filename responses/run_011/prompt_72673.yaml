      3.  *Causal Theory of Content (CTC):* Concepts get content via causal covariation. Rejects acquaintance.
      4.  *No Brute Coincidences:* Systematic alignment needs explanation.
      5.  *Knowledge Argument (KA) Realism:* Mary learns a new fact about the world (not just ability).
      6.  *Conceivability implies Possibility:* Zombies are metaphysically possible.
      7.  *First-Person Knowledge:* Direct, reliable (not infallible) knowledge of own experience.
