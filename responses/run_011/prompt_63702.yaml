  2.  **Deconstruct the "Society as Patient" Analogy:**
      *   *Patient:* The City/Polity (specifically the current citizenry).
      *   *Therapist:* The Heritage Consultant/Psychologist (and by extension, the Commission).
      *   *Trauma:* The displacement of Marlow Flats (60 years ago).
      *   *Symptom:* The annual reading of names (compulsive retelling), "manufactured grief" in 3rd gen.
