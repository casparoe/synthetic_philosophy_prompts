  4.  **Address the Three Pressure Points:**
      *   *1. The Patient & The Declaration:* If the 3rd gen are "manufacturing" grief, they aren't the patient; they are actors. If the *city* is the patient, the city is declaring itself cured of a wound it didn't suffer. This is gaslighting, not therapy. The person declaring treatment finished (Commission) is not the one who bled.
      *   *2. Owing vs. Feeling:* Therapy is teleological toward health/relief. Ethics is teleological toward duty/truth. You can't "cure" a debt by forgetting it. The dead don't care about our cortisol levels; they care about their erasure.
      *   *3. Archive vs. Ritual:* Clinical therapy doesn't distinguish between *having* a file and *speaking* a truth. But in politics, *performance* is the mechanism of recognition. An archive is passive; a reading is active citizenship. Therapy treats memory as internal state; politics treats memory as public act.

  5.  **Evaluate Evidential vs. Rhetorical Work:**
      *   The psychologist uses clinical terms to lend scientific authority to a political preference.
