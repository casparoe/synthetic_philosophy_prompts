answer: |-
  You are not sounding self-indulgent. You are articulating a conflict between two fundamentally different ethical frameworks for human care. The discomfort you feel arises because you are trying to resolve a structural and philosophical problem with personal sacrifice.

  Here is an analysis of the disputed pictures of your work, an evaluation of the reasons offered for your rotation, and my decision on what I would do in your position.

  ### 1. The Two Pictures of Care

  The dispute between you and the daughter/supervisor is not merely about minutes; it is about what constitutes a "benefit" in the context of dementia.

  **Picture A: Care as Transactional Maintenance (The Supervisor & Daughter)**
  In this view, care is a series of measurable tasks aimed at physical safety and hygiene. Value is determined by cognitive recognition and contractual boundaries.
  *   **The Logic:** If the resident does not remember the visit, the visit has no utility. If the carer becomes emotionally invested, it is a "boundary violation" that risks burnout or favoritism.
  *   **The Definition of "Burden":** The daughter views her mother's need for emotional soothing as a burden because it exceeds the contract of basic safety. She projects her mother's past autonomy ("she would never have wanted...") onto a present self that no longer exists.
  *   **The Goal:** Efficiency, risk management, and professional detachment.

  **Picture B: Care as Relational Presence (You)**
  In this view, care is an act of witness and shared humanity. Value is determined by the quality of the immediate experience, regardless of memory retention.
  *   **The Logic:** Dementia destroys cognitive memory, but often spares *emotional* memory. The resident may not know *who* you are, but she retains the *feeling* of safety, calm, and being known that you provide. That feeling is a clinical outcome, not just a kindness.
  *   **The Definition of "Burden":** You view the time spent not as a burden, but as the core of dignity. To treat her as a body to be washed rather than a person to be sat with is the true indignity.
  *   **The Goal:** Continuity of self, emotional regulation, and dignity.

  **The Dispute:** You are correct that they are using the word "care" in a sense you do not share. They define care as *doing for*; you define care as *being with*. However, the conflict has moved beyond philosophy into sustainability.

  ### 2. Do Either of These Pictures Supply a Reason to Accept?

  **The Daughter's Complaint:**
  Her argument supplies **no valid reason** for you to accept rotation. Her moral authority is compromised by her absence (visiting twice a year). Her claim that her mother "would never have wanted to be a burden" is a projection of her own guilt, not the resident's current reality. The resident *is* dependent; pretending otherwise is not care, it is neglect. You should not base your decision on her objection.

  **The Supervisor's Offer:**
  The supervisor's argument supplies **one critical, valid reason** to accept rotation, though perhaps not for the reasons they state.
  *   **The "Strain" Argument:** The supervisor notes you are showing signs of strain and missing evenings with your own daughter. This is the pivot point.
  *   **The "Off the Clock" Problem:** You are currently subsidizing the care home's budget with your own unpaid labor. This is unsustainable. By working off the clock, you mask the understaffing and set a precedent that this level of care is free.
  *   **The Ethical Limit:** Care ethics require you to care for yourself and your own dependents. By missing evenings with your own daughter to care for a resident (in an unpaid capacity), you are violating your primary duty of care to your own child.

  Therefore, the Supervisor's picture supplies a reason to stop *your specific involvement*, not because the attachment is "unhealthy" for the resident (it clearly soothes her), but because the *cost* of that attachment is being paid by you and your family, rather than the institution.

  ### 3. What I Would Decide

  If I were in your position, **I would accept the rotation.**

  However, I would do so with a specific framing, both for myself and for the management. Here is why:

  **1. You cannot fix a systemic failure with personal martyrdom.**
  The home's roster is flawed. It funds 15 minutes for tasks but not for the emotional regulation that prevents agitation (which often takes more time and resources later if ignored). By working off the clock, you are plugging a hole in the system that management should be fixing. If you burn out, the resident loses you anyway. If you neglect your own daughter, you damage your own family for a system that does not value your labor.

  **2. The "Unhealthy Attachment" is a symptom, not the disease.**
  The attachment is only "unhealthy" because the system does not support it. If the sitting time were funded and rostered, your presence would be "therapeutic intervention," not "overstepping." Since they will not fund it, you must withdraw your unpaid labor.

  **3. The decision protects your capacity to care long-term.**
  Seven years is a long time in this field. To survive another seven, you must enforce boundaries. Missing evenings with your own daughter is the warning sign. You must heed it.

  **How to Execute the Decision:**
  Do not accept the rotation as an admission that you were wrong. Accept it as a professional boundary setting.
  *   **To the Supervisor:** "I accept the rotation. I agree that working off the clock is unsustainable and that my own family time must be protected. However, I insist that the resident's care plan be updated to reflect that 'sitting time' is a clinical necessity for her agitation management, so the next carer knows this is work, not leisure."
  *   **To Yourself:** Acknowledge that stepping back is not abandonment. It is a refusal to participate in a model of care that relies on the exploitation of staff empathy.

  **Conclusion:**
  Your picture of care is the morally superior one. You understand that human worth persists beyond memory. But a moral vision cannot be sustained by immoral means (unpaid labor and neglect of your own child). Accept the rotation to save yourself, but do not accept their definition of care. Fight to ensure the *time* is recognized as valid in the logs, even if you are not the one filling it.
