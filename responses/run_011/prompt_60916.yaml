answer: |-
  This is a classic problem (Piccione & Rubinstein, 1997), and it is designed specifically to break your standard decision-theoretic intuitions. You and your roommate are both partially right and partially wrong, but the main source of the confusion is that the Absent-Minded Driver problem violates a standard assumption called **Perfect Recall**.

  Here is exactly where your reasoning went off the rails, why the randomization actually works, and what that 5/8 number represents.

  ### 1. The Math Check: You calculated the Expectation wrong
  Your first objection was: *"If it comes up keep-going he's guaranteed to miss both... so his expectation is only 5/8, which is worse than just always exiting at the first junction (1)."*

  This is the easiest fix. You are modeling the strategy as a **one-time coin flip at home** that decides the entire trip (Exit vs. Drive Past Everything). That *would* yield an expectation of $5/8 \times 1 + 3/8 \times 0 = 0.625$.

  But the optimal strategy isn't "Flip once at home." It is a **behavioral strategy**: "At *every* intersection I encounter, I will flip a coin with $p=5/8$."

  Let's calculate the Expected Value (EV) of that strategy properly:
  *   **Probability of exiting at Intersection 1:** $p$
      *   Payoff: $1$
      *   Contribution: $p$
  *   **Probability of exiting at Intersection 2:** You must continue at 1 ($1-p$) AND exit at 2 ($p$).
      *   Payoff: $4$
      *   Contribution: $4p(1-p)$
  *   **Probability of missing both:** Continue at 1 ($1-p$) AND continue at 2 ($1-p$).
      *   Payoff: $0$
      *   Contribution: $0$

  **Total EV:** $V(p) = p + 4p(1-p) = 5p - 4p^2$.

  To maximize this, take the derivative: $5 - 8p = 0$, so **$p = 5/8$**.
  Plugging that back in: $V(5/8) = 5(5/8) - 4(25/64) = 25/8 - 100/64 = 200/64 - 100/64 = 100/64 = \mathbf{1.5625}$.

  **1.5625 is greater than 1.** So the randomized strategy strictly beats the "Always Exit" pure strategy. Your intuition that the EV was 5/8 was based on a misinterpretation of how the randomization is executed.

  ### 2. The "Mixing Can't Help" Intuition
  Your second objection was the deeper theoretical one: *"Mixing should never help anybody... it cant manufacture information."*

  In standard decision theory (and games with **Perfect Recall**), you are absolutely correct. This is a consequence of **Kuhn's Theorem**, which states that in games with perfect recall, any outcome achievable by a randomized (behavioral) strategy is also achievable by a mixed strategy over pure plans. Since the payoff function is linear over pure plans, the maximum is always at a corner (a pure strategy).

  **However, the Absent-Minded Driver does not have Perfect Recall.**
  He doesn't know *which* intersection he is at. This breaks Kuhn's Theorem.

  Why does randomization help here? Because you are effectively playing a coordination game against **your future self**.
  *   **Self at Intersection 1** wants to Exit (Payoff 1 > 0).
  *   **Self at Intersection 2** wants to Exit (Payoff 4 > 0).
  *   **BUT:** If Self 1 Exits, Self 2 never gets to exist. If Self 1 Continues, Self 2 gets a chance at the big prize.

  If you play a pure strategy ("Always Exit"), Self 1 wins, Self 2 never plays. Total = 1.
  If you play a pure strategy ("Always Continue"), Self 1 loses, Self 2 continues past the prize. Total = 0.

  By randomizing, you are correlating the actions of Self 1 and Self 2 without needing memory. You are essentially saying, "I will let a certain portion of my 'future selves' stop early, and a certain portion push through to the big prize." The quadratic nature of the payoff function ($p$ appears in the probability of reaching the second node *and* the probability of taking the second node) creates an interior maximum that pure strategies cannot reach.

  Randomization *does* manufacture information here, in a sense: it creates a statistical distribution of outcomes across time that a deterministic rule cannot achieve because the deterministic rule collapses the timeline.

  ### 3. The Credence Question: Is 5/8 a belief?
  Your roommate said: *"5/8 is just his credence that hes at the good exit."*
  You said: *"Credence has to be 1/2... 5/8 isn't a belief about anything."*

  **You are both slightly off.**

  The 5/8 is **not** the credence (belief) about location. It is the **action probability**.
  However, in absent-minded problems, your beliefs about location *depend on your strategy*. This is the "Sleeping Beauty" connection your roommate mentioned.

  If you ask the driver at an intersection, "What is the probability this is Exit 2?", the answer depends on what plan $p$ he adopted at home.
  *   If $p=1$ (Always Exit), he can only be at Exit 1 (because he would have exited there). Prob(Exit 2) = 0.
  *   If $p=0$ (Always Continue), he is equally likely to be at either (by symmetry of passage). Prob(Exit 2) = 1/2.
  *   If $p=5/8$ (Optimal), the probability he is at Exit 2 is actually **3/11**.

  **Derivation:**
  The probability of reaching Exit 1 is 1. The probability of reaching Exit 2 is $(1-p)$.
  Given that he is *at* an intersection, the relative likelihoods are $1 : (1-p)$.
  With $p=5/8$, the ratio is $1 : 3/8$, or $8:3$.
  So the probability he is at Exit 2 is $\frac{3}{8+3} = \frac{3}{11}$.

  So, 5/8 is not the credence. 5/8 is the **control variable** that optimizes the payoff, which in turn shifts the credence away from 1/2. Your intuition that "evidence is symmetric so credence must be 1/2" fails because the *strategy itself* provides evidence (selection effect). If you plan to exit early, finding yourself still driving is evidence that you are further down the road.

  ### Summary of Where You Went Wrong
  1.  **The EV Calculation:** You assumed the coin flip happened once at home to determine the whole trip. It happens locally at every intersection. This makes the EV function quadratic ($5p - 4p^2$), allowing an interior maximum of 1.5625.
  2.  **The Mixing Intuition:** You assumed Perfect Recall. Without memory, pure strategies force you to choose between "stopping too early" and "going too late." Randomization allows you to split your "selves" across time to capture value from both.
  3.  **The Credence:** 5/8 is the optimal *action*, not the *belief*. The belief is actually 3/11 under the optimal plan.

  **Verdict:** Your roommate was right about the number (5/8) and the Sleeping Beauty connection (imperfect recall creates self-locating belief issues), but wrong that 5/8 is the credence. You were right to be suspicious of the "credence" claim, but wrong that randomization can't help. In problems with imperfect recall, randomization is a feature, not a bug.
