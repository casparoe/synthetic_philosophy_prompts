prompt: |-
  I co-convene an MPhil aesthetics seminar, and a senior colleague of mine has a stock move that reliably ends our definitional debates. When a student proposes necessary and sufficient conditions for being a work of art, he replies that art is like a game: chess and tennis and ring-a-ring-o'-roses share no single feature, yet we deploy the concept competently enough by tracking overlapping resemblances, so the demand for a real definition of art rests on a category mistake about how the concept works. He presents this as Weitz's argument that art is an open rather than a closed concept, and he then presses it further: the historical and institutional proposals that followed — Danto's artworld, Dickie's conferral of status, Levinson's definition in terms of intended regard modelled on past art — are, on his telling, just the discredited project relaunched in a new costume. The analogy is carrying a great deal of weight in that room, and I want to know how much of that weight it can actually bear. Please write in British English throughout, and do not trouble yourself with references or a bibliography; I want the arguments themselves.

  I would like the following:

  1. The mapping, set out explicitly (a table is welcome): what corresponds to the paradigm games, to the rules that constitute a game, to the community of players, and to the invention of a wholly new game. Where a term in the artworld has no obvious counterpart in the source, say so rather than forcing a fit.

  2. The disanalogies, sorted into those that are fatal to the use my colleague makes of the analogy and those that are merely untidy. Two I can see and want tested: games are activities whose constitutive conventions participants can adopt at will, whereas an artefact's candidacy is usually settled retrospectively by a history and an institution it does not control; and resemblance among games is supposed to be available on inspection, whereas the genuinely hard cases in modern art are precisely those perceptually indiscernible from ordinary commercial objects, where seeing whether something is art requires knowing a story rather than comparing appearances.

  3. What the source domain quietly imports about the target: assumptions concerning a settled pre-theoretical extension, membership decided by observers rather than conferred by practitioners, and novelty as mere extension of usage rather than as something requiring justification.

  4. Whether the conclusion survives. Does the games analogy establish that art has no essence at all, or only that any essence it has will not be a perceptual one? Is my colleague's dismissal of Danto, Dickie and Levinson supported by the analogy, or independent of it?

  5. How the analogy fares against two rival diagnoses of the same data: Mandelbaum's complaint that the doctrine of family resemblances is asserted rather than analysed, and that apparent resemblances may rest on non-apparent properties; and Gallie's account of art as an essentially contested concept. Say which better explains our practice, and whether a different analogy — money, say, or citizenship, or a language — would license something more defensible than the one now doing the work.

  Finish with a short verdict: what the seminar should and should not conclude from the comparison.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** Co-convenor of an MPhil aesthetics seminar.
      *   **Problem:** A senior colleague uses Wittgenstein's "games" analogy (via Weitz) to shut down definitional debates about art. He claims art is an "open concept" with no necessary and sufficient conditions, relying on family resemblances. He dismisses subsequent institutional/historical definitions (Danto, Dickie, Levinson) as failed essentialisms in disguise.
      *   **Task:** Evaluate the weight this analogy can bear.
      *   **Constraints:** British English, no references/bibliography, focus on arguments.
      *   **Structure:**
          1.  Explicit mapping (table preferred).
          2.  Disanalogies (fatal vs. untidy), specifically testing two user-suggested ones (voluntary adoption vs. retrospective status; perceptual resemblance vs. theory-laden indiscernibles).
          3.  Imported assumptions (pre-theoretical extension, observer vs. practitioner, novelty).
          4.  Survival of the conclusion (no essence vs. no perceptual essence; support for dismissing Danto/Dickie/Levinson).
          5.  Rival diagnoses (Mandelbaum vs. Gallie) and alternative analogies (money, citizenship, language).
          6.  Short verdict for the seminar.

  2.  **Deconstruct the Colleague's Argument:**
      *   *Premise 1:* Games have no common feature (Wittgenstein).
      *   *Premise 2:* Art is like games (Weitz).
      *   *Conclusion 1:* Art has no necessary and sufficient conditions (anti-essentialism).
      *   *Conclusion 2:* Institutional/Historical definitions are just failed essentialisms (dismissal of Danto, Dickie, Levinson).

  3.  **Drafting Section 1: The Mapping:**
      *   Need to align Game Domain (Source) with Art Domain (Target).
      *   *Paradigm Games:* Chess, Tennis, Ring-a-ring-o'-roses. -> *Paradigm Art:* Renaissance painting, Symphony, Tragedy.
      *   *Rules/Conventions:* Constitutive rules of chess. -> *Artistic Conventions:* Perspective, tonality, form? (Tricky, as art rules are often broken).
      *   *Community of Players:* Those who play. -> *Artworld:* Artists, critics, curators, audience.
      *   *Invention of New Game:* Making up a new sport. -> *Avant-garde:* Duchamp's *Fountain*, Cage's *4'33"*.
      *   *Gaps:* "Winning" in games vs. "Success" in art? "Play" vs. "Contemplation"?

  4.  **Drafting Section 2: Disanalogies:**
      *   *User Suggestion 1:* Voluntary adoption (games) vs. Retrospective/Institutional (art).
          *   *Analysis:* I can decide to play a game with you right now. I cannot decide my urinal is art on my own; it needs the Artworld (Dickie) or History (Danto). This strikes at the *mechanism* of classification.
          *   *Verdict:* Fatal to the idea that we just "see" resemblances.
      *   *User Suggestion 2:* Perceptual resemblance (games) vs. Indiscernibles (art).
          *   *Analysis:* I can see chess and tennis are both games. I cannot see *Fountain* and a normal urinal are both art based on looks. The "resemblance" is theoretical, not perceptual.
          *   *Verdict:* Fatal to the "family resemblance" claim if that claim relies on observable features.
      *   *Untidy Disanalogies:* Games are often for fun; art can be tragic. Games have clear endpoints; art doesn't. (These are less damaging to the structural argument).

  5.  **Drafting Section 3: Imported Assumptions:**
      *   *Settled Extension:* The analogy assumes we agree on the list of "games" before analysing them. Do we agree on the list of "art"? (The hard cases are the point of contention).
      *   *Observer vs. Practitioner:* We identify games by watching people play. We identify art often by listening to the artist/theorist.
      *   *Novelty:* New games extend the concept naturally. New art often *challenges* the concept violently. The analogy smoothes over the friction of the avant-garde.

  6.  **Drafting Section 4: Survival of the Conclusion:**
      *   *No Essence vs. No Perceptual Essence:* The analogy proves art isn't *perceptually* definable (like games aren't defined by one physical movement). But it doesn't prove there's no *relational* or *historical* essence.
      *   *Dismissal of Danto/Dickie/Levinson:* The analogy *does not* support dismissing them. In fact, Danto and Dickie arise *because* the games analogy fails on indiscernibles. The colleague is using Weitz to kill Danto, but Danto is the cure for Weitz's problem. The analogy is independent of (and arguably undermined by) the institutional turn.

  7.  **Drafting Section 5: Rival Diagnoses & Alternative Analogies:**
      *   *Mandelbaum:* Family resemblance is lazy. There *are* common properties, just non-obvious ones (e.g., being made to be regarded). This fits the "indiscernibles" problem better.
      *   *Gallie:* Essentially Contested Concept. It's not that there's no definition, but that the definition is inherently normative and debatable. This captures the *struggle* better than the relaxed "games" model.
      *   *Alternative Analogies:*
          *   *Money:* A banknote is paper, but its status is conferred by an institution. Fits Dickie/Danto better.
          *   *Citizenship:* Legal status, not biological resemblance.
          *   *Language:* Good for structure, but languages have grammar (rules).
          *   *Winner:* Money/Citizenship fits the "conferral" aspect of modern art better than Games.

  8.  **Drafting Section 6: Verdict:**
      *   Keep it punchy. The analogy is a useful heuristic for openness but a poor metaphysical tool for status. Don't let it shut down debate; use it to open the *right* debate (institutional vs. perceptual).

  9.  **Review and Refine (Self-Correction/Polishing):**
      *   *Tone:* Academic, rigorous, British English (e.g., "programme", "centre", "analyse", "defence").
      *   *Check Constraints:* No bibliography. Ensure all 5 points are covered.
      *   *Check Argument:* Ensure I don't just say "Weitz is wrong" but explain *why the analogy fails* to support the colleague's specific strong claim (that Danto/Dickie are just failed essentialisms).
      *   *Refining the "Fatal" Disanalogy:* The key is that games are defined by *constitutive rules* accepted by players, whereas art is often defined by *interpretive frameworks* imposed by the artworld. If I play a game wrong, I'm not playing. If I make art "wrong", it might be genius.
      *   *Refining the Danto/Dickie point:* The colleague says they are "discredited project relaunched". I need to argue that they are *responses* to the failure of the resemblance model, not continuations of it.

  10. **Final Polish:** Check British spelling (analyse, programme, centre, defence, manoeuvre). Ensure the table is clear.

  *(Self-Correction during drafting)*: I need to make sure I don't get bogged down in exegesis of Weitz vs. Wittgenstein. The prompt asks about the *colleague's use* of the argument. Focus on the utility of the analogy in the seminar room.

  *(Final check on Section 4)*: Does the analogy establish art has no essence? No, it only establishes it has no *perceptual* essence. This is a crucial distinction. Danto agrees there is no perceptual essence but argues for a historical/philosophical one. So the colleague's dismissal of Danto is unsupported by the analogy itself.

  *(Final check on Section 5)*: Gallie is strong here because it explains *why* the debate persists (normative investment), whereas Weitz implies the debate is a mistake. Mandelbaum explains *where* the essence might hide (non-apparent properties).

  Okay, ready to write.
answer: |-
  **To:** Co-convenor, MPhil Aesthetics Seminar
  **From:** [Your Name/Role]
  **Subject:** Evaluation of the 'Games' Analogy in Definitional Debates

  You ask for an audit of the argumentative weight your colleague places upon the Wittgenstein-Weitz 'games' analogy. It is a seductive manoeuvre, largely because it promises to dissolve a philosophical knot rather than cut it. However, as you suspect, the analogy is doing more work than it is entitled to. Below is the breakdown you requested, structured to assist in steering the seminar away from a premature closure of the debate.

  ### 1. The Mapping

  To assess the analogy, we must first make the correspondence between the source domain (Games) and the target domain (Art) explicit. The following table sets out the intended structural parallels.

  | Source Domain (Games) | Target Domain (Art) | Fit / Comment |
  | :--- | :--- | :--- |
  | **Paradigm Instances**<br>(Chess, Tennis, Ring-a-ring-o'-roses) | **Paradigm Instances**<br>(Renaissance Painting, Symphony, Tragedy) | **Good.** We have clear central cases in both. |
  | **Constitutive Rules**<br>(Move the bishop diagonally; ball must cross the line) | **Artistic Conventions**<br>(Perspective, tonality, dramatic unity) | **Poor.** Game rules are binding; artistic conventions are often made to be broken. |
  | **The Players**<br>(Those who engage in the activity) | **The Artworld**<br>(Artists, critics, curators, audience) | **Partial.** Players *make* the game exist by playing. The Artworld *recognises* art, but the artist often stands against the 'players'. |
  | **Invention of a New Game**<br>(Creating a new sport with new rules) | **The Avant-Garde**<br>(Duchamp's *Fountain*, Cage's *4'33"*) | **Tenuous.** New games extend the concept; avant-garde art often aims to *shock* or *redefine* the concept itself. |
  | **Winning/Ending**<br>(Checkmate, final whistle) | **Completion/Success**<br>(Finished work, aesthetic resolution) | **No Fit.** Games generally have terminal conditions; art does not necessarily have an 'end' state in the same functional sense. |
  | **Observation**<br>(We see people playing and identify the game) | **Classification**<br>(We see an object and identify it as art) | **Fatal Flaw.** See Section 2. |

  Where a term has no obvious counterpart, such as 'winning', I have noted it. The absence of a functional goal in art comparable to winning a game is significant, but the absence of a clear mechanism for 'classification' is the more damaging omission.

  ### 2. The Disanalogies

  The utility of an analogy rests on whether the differences are merely superficial (untidy) or structural (fatal). Your two intuitions are correct and require rigorous testing.

  **A. Voluntary Adoption vs. Retrospective Conferral**
  *   *The Disanalogy:* Games are activities whose constitutive conventions participants adopt at will. If we agree to play 'make-believe', we are playing. Art, conversely, is often settled retrospectively by a history and an institution the object does not control. A urinal does not become art because the plumber decides to play a game with it; it becomes art because the Artworld confers that status upon it within a historical narrative.
  *   *Verdict:* **Fatal.** This undermines the colleague's claim that we deploy the concept simply by tracking resemblances. In games, the 'resemblance' is grounded in the shared intention to follow rules. In art, the status is often independent of the object's properties and the maker's immediate intention (consider found objects). The games analogy suggests a democratic, bottom-up classification; art status is often hierarchical and top-down.

  **B. Perceptual Resemblance vs. Theory-Laden Indiscernibles**
  *   *The Disanalogy:* Resemblance among games is available on inspection. One can watch chess and tennis and observe 'competition', 'rules', 'skill'. The hard cases in modern art (Brillo Boxes, readymades) are perceptually indiscernible from ordinary commercial objects. Seeing whether something is art requires knowing a story (a theory), not comparing appearances.
  *   *Verdict:* **Fatal.** Weitz's argument relies on the idea that we recognise family resemblances through observation. If the 'resemblance' between a artwork and its antecedents is purely theoretical (e.g., 'this stands in relation R to previous art'), then the concept is not open in the Wittgensteinian sense; it is closed by a specific historical relation. The games analogy cannot account for the *indiscernible* counterpart, which is the central problem of post-1960s aesthetics.

  **Untidy Disanalogies:**
  *   *Play vs. Work:* Games are played for amusement; art can be labourious, tragic, or morally demanding. This is untidy but not fatal to the structural logic of classification.
  *   *Finitude:* Games end; art persists. Again, this affects the phenomenology but not necessarily the logic of the concept.

  ### 3. Imported Assumptions

  By importing the logic of games, your colleague quietly smuggles in three assumptions that prejudice the debate against the institutional and historical theorists.

  1.  **A Settled Pre-theoretical Extension:** The games analogy assumes we all agree on the list of games before we analyse them. It assumes the extension of 'art' is similarly stable and agreed upon, waiting only for us to notice the overlaps. In reality, the extension of 'art' is the very thing being fought over. The analogy assumes consensus where there is conflict.
  2.  **Membership Decided by Observers:** We identify games by watching players. This imports the assumption that art status is determined by audience recognition or perceptual uptake. It marginalises the role of the *producer* and the *institution* in conferring status. It privileges the spectator's experience over the artist's act of nomination.
  3.  **Novelty as Extension, Not Justification:** In games, a new game is just a new variation. In art, a new work often demands a justification that changes the rules for *all* previous art. The analogy treats novelty as a smooth expansion of usage, whereas in art, novelty is often a revolutionary rupture that requires a new theoretical framework to sustain it.

  ### 4. Whether the Conclusion Survives

  Does the analogy establish that art has no essence, or only that it has no *perceptual* essence?

  *   **No Essence vs. No Perceptual Essence:** The games analogy successfully establishes that art has no *perceptual* essence. Just as there is no single physical movement common to all games, there is no single visual property common to all art. However, it fails to prove there is no *relational* or *historical* essence. One could argue that while games share no physical feature, they all share the feature of 'being undertaken for lusory purposes' (Suits). Similarly, art might share no perceptual feature but all share the feature of 'being intended for regard-as-a-work-of-art' (Levinson). The analogy is silent on non-perceptual essences.
  *   **Support for Dismissing Danto, Dickie, and Levinson:** The colleague's dismissal of these theorists is **unsupported** by the analogy. In fact, their projects are best understood as *responses* to the failure of the resemblance model.
      *   Danto accepts the 'no perceptual essence' claim but argues for a historical/philosophical essence.
      *   Dickie accepts the 'no perceptual essence' claim but argues for an institutional essence.
      *   Levinson accepts the 'no perceptual essence' claim but argues for a historical-intentional essence.
      *   The colleague uses Weitz to say 'there is no definition'. Danto, Dickie, and Levinson say 'the definition is not perceptual'. The games analogy cannot adjudicate between 'no definition' and 'non-perceptual definition'. Therefore, using the analogy to dismiss the institutional turn is a non-sequitur. It attacks a straw man (perceptual essentialism) rather than the actual proposals (relational essentialism).

  ### 5. Rival Diagnoses and Alternative Analogies

  How does the games analogy fare against Mandelbaum and Gallie, and are there better models?

  **Mandelbaum's Complaint:**
  Mandelbaum argued that the doctrine of family resemblances is asserted rather than analysed. He suggested that apparent resemblances may rest on non-apparent properties (e.g., technical means, causal history).
  *   *Comparison:* Mandelbaum offers a better explanation of our practice because it accommodates the indiscernibles problem. It allows us to say two objects resemble each other *as art* not because they look alike, but because they share a hidden relational property (e.g., both were created to be regarded in a certain way). The games analogy ignores these hidden properties; Mandelbaum hunts for them.

  **Gallie's Essentially Contested Concepts:**
  Gallie argues that art is not 'open' in the sense of being vague, but 'contested' in the sense that its evaluation is internal to its description. To call something art is to claim it achieves certain values, which others may dispute.
  *   *Comparison:* This is superior to Weitz. Weitz suggests the debate is a mistake (a category error). Gallie suggests the debate is inevitable and constitutive of the concept. Given that the seminar room is full of definitional debate, Gallie explains the *persistence* of the disagreement better than Weitz, who claims the disagreement should vanish once we understand the logic of the concept.

  **Alternative Analogies:**
  *   **Money:** A banknote and a digital entry in a ledger are perceptually distinct, yet both are money. Their status is conferred by an institution (the Bank/Central Authority) and relies on a history of transaction. This fits Dickie and Danto far better than 'Games'. It captures the 'indiscernible' aspect (a fake note looks identical but lacks status) and the 'conferral' aspect.
  *   **Citizenship:** One is not a citizen by resemblance to other citizens, but by legal status conferred by a state. This captures the normative and institutional weight of 'art' better than the playful voluntarism of 'games'.
  *   **Language:** While Wittgenstein used language games, 'Language' itself as an analogy is tricky. Languages have grammar (rules). If art has no grammar, the analogy fails. If it does, we are back to looking for rules.

  **Verdict on Rivals:** Gallie provides the best account of the *disagreement*, while the 'Money' analogy provides the best account of the *ontology* of modern art. The 'Games' analogy is the weakest for post-1960s art.

  ### 6. Verdict for the Seminar

  The seminar should conclude that the games analogy is a useful **heuristic for openness**, but a poor **metaphysical tool for status**.

  *   **What to accept:** The analogy correctly warns against searching for a single perceptual property (like 'beauty' or 'form') that defines all art. It usefully dismantles naive formalism.
  *   **What to reject:** The seminar must not accept the claim that the analogy disproves all essentialism. It does not disprove historical or institutional essences. Furthermore, the analogy should not be used to dismiss Danto, Dickie, or Levinson; their theories are attempts to solve the very problems the games analogy highlights but cannot resolve (specifically, the problem of indiscernibles).

  Your colleague's move is a conversation-stopper that relies on the prestige of Wittgenstein to bypass the hard work of the institutional turn. You should encourage the students to see that while art may be *like* a game in its variety, it is more like *money* in its ontology. The debate is not a category mistake; it is the necessary friction of an essentially contested concept. Do not let the analogy close the inquiry; use it to sharpen the question of *what kind* of definition is possible if not a perceptual one.
