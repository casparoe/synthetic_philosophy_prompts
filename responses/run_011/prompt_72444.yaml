  The cup sits firm upon the wooden ground.
  It stays there simply because the table holds.
  We scan the whole scene for a hidden prop.
  Find nothing but the air beneath the rim.
  Look lower still, to floorboards lying below.
  Until the eye and all its searching rest.

  What remains is not merely quiet rest.
  But earth itself, the solid muddy ground.
  Foundations dug and buried deep below.
  Supported because the soil refuses shift.
  Yet gravity suggests there is nothing sure.
  Unless we trust the structure of the whole.

  Is the whole built up from parts beneath?
  Or do the parts only rest on the sum?
  If base is missing, then there is nothing left.
  We need a final floor to call the ground.
  Not just a link because one follows two.
  But power flowing strictly from below.

  Direction fails; what lies strictly below?
  May hold the parts within the single whole.
  The link holds fast because it explains well.
  Leaving the excess to find its own rest.
  No sediment settles to form the ground.
  Just empty void, or perhaps nothing at all.

  If every layer owes to nothing more.
  Then descent continues endlessly below.
  No rock arrives to serve as final ground.
  The stack dissolves unless secured by whole.
  And theory comes to an exhausted rest.
  We stop explaining simply because.

  We ask because the mind demands a floor.
  But find nothing waiting at the bottom.
  So thought must find a different kind of rest.
  Not digging down nor climbing from below.
  Seeing the dependence of the whole.
  Where being finds its unconditioned ground.

  Let the search for a bottom rest below,
  Since nothing stands apart outside the whole,
  Because dependence settles on this ground.

  ***

  **Note on Liberties**

  This poem treats grounding as a single unified relation, primarily in stanzas three and four, whereas many contemporary metaphysicians argue for a family of distinct dependence relations. This unification simplifies the dialectic for the sake of the form, allowing the rotation of 'because' to carry the explanatory weight without distinguishing causal from metaphysical explanation until the envoi.

  The poem entertains the failure of well-foundedness in stanza five (infinite descent) but secretly prefers well-foundedness, resolving in stanza six with an 'unconditioned ground'. A specialist might object to stanza four, which suggests holism ('the single whole' holds the parts) as a solution to the spatial confusion of grounding; this conflates mereological priority with metaphysical fundamentality, a move some find category-confused.

  My verdict—that the whole is prior—rests on the intuition that dependence must terminate. I would change my mind if convinced that infinite chains of explanation are virtuous rather than vicious, which would require ending the descent differently, perhaps leaving the envoi open-ended. My reasoning is most likely to fail in assuming that the 'because' of metaphysics can be captured by the same word as causal explanation, risking the collapse into mere correlation that the poem attempts to avoid.
