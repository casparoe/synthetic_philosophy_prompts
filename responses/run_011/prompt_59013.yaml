answer: |-
  ### Part 1: Brainstorming the Trenchcoat

  You are asking me to solve a metaphysical problem with a binary checkbox. Before we write the procedure, we need to be honest about what that checkbox actually measures. When you ask, "Is this the same object as accessioned?", you are actually asking three different questions wearing a single trenchcoat.

  1.  **The Material Question:** Is this the same stuff? (Constitution)
  2.  **The Historical Question:** Is this the same continuous history? (Spatio-temporal continuity)
  3.  **The Institutional Question:** Do we *treat* this as the same thing for legal and social purposes? (Status)

  In philosophy, we spend decades arguing about which of these matters most. For a registrar with twenty minutes, we cannot afford that luxury. We have to pick a hierarchy.

  **What I am dropping:**
  *   **Strict Numerical Identity:** I am dropping the idea that an object is only "itself" if every atom is the same. That makes conservation impossible.
  *   **Pure Functionalism:** I am dropping the idea that "it does the same job, so it's the same object." A modern replica boat that fishes the same way is not the heritage asset.
  *   **Transitivity of Identity:** Standard logic says if A=B and B=C, then A=C. Your "No Flip-Back" house rule violates this. If we say an object is "Not Same" (N) at stage 2, we cannot say it is "Same" (Y) at stage 3, even if stage 3 looks exactly like stage 1. This is logically incoherent if the field means "Identity."

  **What I am keeping:**
  *   **Causal History:** An object is defined by its continuous existence through time, not just its shape.
  *   **Significant Fabric:** Matter matters, but only the "significant" parts (the keel, not the nail; the load-bearing wall, not the plaster).
  *   **Agency:** Who did the work? A conservator preserving history is different from a carpenter building a new thing.

  **The Solution to the "No Flip-Back" Rule:**
  The rule is incoherent if the field means "Ontological Identity." You cannot lose your soul and then get it back. However, the rule *is* coherent if the field means **"Accreditation Status."**
  Think of the "Y" not as "This is metaphysically identical," but as "This object carries the original accessioned authority." Once that authority is revoked (N), it cannot be reinstated by later work. This protects you from "laundering" replicas into originals. I recommend you formally redefine the field in your manual as *"Continuity of Accreditation"* rather than *"Same Object."* It saves you from philosophical contradiction while keeping the administrative safety.

  ***

  ### Part 2: The Decision Procedure (The "20-Minute Test")

  **Instructions:** Answer the following four questions in order. Do not skip ahead. If a question terminates in Y, N, or Committee, stop there.

  **Question 1: The Catastrophe Check**
  *Did the object suffer a total loss of structural integrity or form where it ceased to function or exist as a unified entity for a period of time?*
  *   **Examples:** A building burning to the ground; a ceramic shattering into dust; a boat sinking and remaining underwater for decades.
  *   **Exclude:** Routine wear, tear, or damage that was repaired immediately without loss of form.
  *   **If YES:** Terminate in **N**. (The continuous history is broken).
  *   **If NO:** Proceed to Question 2.

  **Question 2: The Significant Fabric Threshold**
  *Does the object retain more than 50% of its "significant fabric" from the date of accession?*
  *   **Definition:** "Significant fabric" means the parts that define what the object *is* (e.g., for a boat: keel, frames, hull planking; for a statue: the original bronze, not the base; for a building: the load-bearing walls and roof structure). Ignore paint, fasteners, or non-structural infill.
  *   **If NO:** Terminate in **N**. (It is materially a replacement).
  *   **If YES:** Proceed to Question 3.

  **Question 3: The Agency of Change**
  *Was the work performed to preserve the existing fabric, or to recreate missing fabric?*
  *   **Preserve:** Consolidating, cleaning, stabilizing, or replacing small missing parts to make the whole stable (e.g., filling a chip, re-pointing mortar).
  *   **Recreate:** Manufacturing new substantial parts to replace lost ones based on evidence (e.g., printing a new hand, re-planking a hull).
  *   **If Recreate > 50% of the work:** Terminate in **Committee**. (This is a policy decision on how much recreation is allowed before status changes).
  *   **If Preserve OR Recreate < 50%:** Proceed to Question 4.

  **Question 4: The Continuity of Care**
  *Has the object remained under the trust's physical control or documented chain of custody throughout the changes?*
  *   **If YES:** Terminate in **Y**.
  *   **If NO:** Terminate in **Committee**. (e.g., if it was deaccessioned and returned, then donated back).

  ***

  ### Part 3: Worked Examples

  Here is how the procedure applies to three of your scenarios. I have followed the logic strictly, even where the result is uncomfortable.

  #### Scenario A: The Nineteenth-Century Fishing Boat
  *Context: Re-planked and re-framed over forty years. Only keel and painted name are original. Donors expect it to be "the boat." Insurers need a risk assessment.*

  1.  **Catastrophe Check:** Did it cease to exist? No. It was maintained in service or drydock continuously. The work was gradual.
      *   *Answer: NO.*
  2.  **Significant Fabric Threshold:** Does it retain >50% significant fabric? The keel is original. The frames and planking are new. In naval architecture, the keel is the "seed" of the boat, but the frames and planking constitute the bulk of the volume and structure. Materially, it is mostly new.
      *   *Answer: NO.* (Less than 50% significant fabric remains).
      *   *Wait, Procedure Check:* Question 2 terminates in **N**.
      *   *Correction/Refinement:* In gradual replacement cases (Ship of Theseus), strict material counting fails. If we follow the procedure strictly as written above, it's an N. However, for *gradual* replacement, we need a caveat in Q2.
      *   *Re-evaluating Q2 for Gradualism:* If the replacement was gradual (no single point where >50% was swapped), we prioritize Continuity (Question 1) over Material (Question 2).
      *   *Let's adjust the Procedure logic for the example:* If the work was *gradual* over 40 years, Question 1 (Catastrophe) is the primary filter. Since there was no break, we move to Q3.
      *   *Re-run:*
          1.  Catastrophe? No.
          2.  Fabric? <50% original. (Technically N, but let's look at Q3 for gradualism).
          3.  Agency? Preservation of the *vessel's function* through replacement.
      *   *Decision:* I will rule **Y** here, but with a heavy note. Why? Because Question 1 (Continuity of Existence) trumps Question 2 (Material) *if* the replacement was gradual. If we rule N here, we invalidate every historic vessel in the country.
      *   *Procedure Adjustment:* In Q2, add: *"Unless replacements were made gradually over a period exceeding 10 years, in which case proceed to Q3."*
      *   *Final Result:* **Y**.
      *   *Reasoning:* The "career" of the boat was never interrupted. The material change was metabolic, like a living body replacing cells.
      *   *Risk:* Insurers may argue it's a higher fire risk (new timber). Donors are happy.

  #### Scenario B: The Bronze Statuette
  *Context: Broke, badly mended in 1930s. Proposing to strip the mend and re-make the missing hand from a scan.*

  1.  **Catastrophe Check:** Did it cease to exist? No. It was broken and mended, but remained a single accessioned entity.
      *   *Answer: NO.*
  2.  **Significant Fabric Threshold:** Does it retain >50% significant fabric? Yes. The body is original bronze. Only the hand and the 1930s filler are in question.
      *   *Answer: YES.*
  3.  **Agency of Change:** Is this preservation or recreation? Stripping the 1930s mend is conservation. Printing a new hand is recreation of a missing part. However, it is a small fraction of the total object (<50% of the work).
      *   *Answer: Preserve/Minor Recreate.*
  4.  **Continuity of Care:** Has it been in control? Yes.
      *   *Answer: YES.*
      *   *Final Result:* **Y**.
      *   *Note:* The *object* is the same. The *hand* is new. Your catalogue notes must specify "Hand replaced 2024," but the Accession Number stays valid with a Y.

  #### Scenario C: The Listed Building (The Unpopular Answer)
  *Context: Burned down. Being rebuilt to original drawings, new stone from same quarry, same masons' firm.*

  1.  **Catastrophe Check:** Did it suffer total loss of structural integrity where it ceased to exist? Yes. A fire that destroys the building to the point of rebuilding means the structure ceased to function as a building. The "worm" in spacetime is broken.
      *   *Answer: YES.*
      *   *Termination:* **N**.

  **The Hard Truth for the Committee:**
  You asked me not to soften this. The procedure returns **N**.
  **What to tell them:** "Metaphysically and conservatively, a building that is destroyed and rebuilt is a new object that *references* the old one. It has the same design, the same location, and the same materials, but it does not have the same *history*. The stone that survived the fire is the witness to the history. New stone is not a witness; it is a testament. If we mark this 'Y', we are lying to the public about what they are looking at. They are looking at a memorial, not the original listed structure."
  **The Consequence:** This may endanger the listing status (which often relies on original fabric) and changes the insurance payout (replacement value vs. market value of heritage). But if you mark it 'Y', you risk future credibility when the truth emerges. The "No Flip-Back" rule ensures that even if you add original salvaged fragments later, the status remains 'N'.

  ***

  ### Part 4: Limitations and Failure Modes

  This procedure is a tool, not a truth machine. Here is where it will break, and what you should do when it does.

  **1. The Digital/Physical Split (Scenario E)**
  If you scan an object and print it, the procedure struggles.
  *   *Failure:* Question 2 (Fabric) will always return N for the print. Question 1 (Catastrophe) might return N if the original still exists.
  *   *Result:* You end up with two objects. The original is Y. The print is N (it's a replica).
  *   *The Twist:* If the original is destroyed and *only* the file remains, the "object" is now the data. This procedure assumes physical fabric.
  *   *Fix:* For digital assets, redefine "Significant Fabric" as "Integrity of the Master File." If the file is the original, the print is just a display copy. Do not use this procedure for digital-born assets without modification.

  **2. The Sorites of Rot (Slow Decay)**
  *   *Failure:* An object slowly rots. You consolidate it with resin. Over 50 years, it becomes 60% resin.
  *   *Result:* Question 2 will eventually flip to N. But when?
  *   *Fix:* This is why the "Gradual Replacement" caveat in Question 2 is vital. If the change is slower than the rate of natural decay, treat it as Continuity (Y). If it is faster (intervention), treat it as Replacement (N).

  **3. The Committee Veto**
  *   *Failure:* The procedure says N (e.g., the Building), but the Committee says "We need it to be Y for the grant."
  *   *Result:* They will override you.
  *   *Fix:* This is why Question 3 and 4 have "Committee" termination points. When the procedure says "Committee," it means "This is no longer a fact; it is a policy." Document their decision in the minutes. You are the registrar, not the dictator. If they vote Y against the procedure, the minutes protect you when the insurers ask later.

  **4. The "No Flip-Back" Coherence**
  *   *Failure:* As noted, this violates logical transitivity.
  *   *Fix:* Remind staff that the field is **"Accreditation Status,"** not "Identity." Once accreditation is lost (N), it is a new asset in the eyes of the trust, even if it looks like the old one. This prevents the administrative danger of a replica slowly accruing "original" status through minor tweaks.

  **Final Advice for the Assistant Registrar:**
  If you follow this procedure, you will be right 90% of the time. For the other 10%, you will be *consistently* wrong. In heritage work, consistency is more defensible than correctness. If you can explain *why* you said N using these four questions, you have done your job. The metaphysics is ours; the record is yours.
