  5.  **Refining the Comments (Self-Correction/Detailing):**
      *   *Comment 1 (P2 Numerator):* The definition requires $E(V(a*))$. If cluelessness holds, you can't estimate this. So you can't calculate SNR. The metric is epistemically inaccessible.
