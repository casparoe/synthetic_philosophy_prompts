      *   **(f) Novelty:** The distinction between "uncertainty about mean" vs. "uncertainty about variance/noise" is present in decision theory (risk vs. ambiguity, or signal detection). In ethics, Greco (2016) and others discuss "cluelessness" in terms of variance and expected value. The specific SNR formulation looks new-ish but the underlying idea (cluelessness as high variance relative to expected difference) is essentially the standard formalization of cluelessness already used by decision-theoretic ethicists (e.g., Hilary Greco, Christian Tarsney). It might be repackaging the "variance objection" vs "mean objection".

