answer: |-
  This is a sophisticated audit of your own moral intuitions. You have correctly identified that "bright-line" rules fail because they ignore context, while "case-by-case" rulings fail because they lack consistency. Your fourteen verdicts are not random; they cluster around a specific, albeit complex, conception of integrity.

  Here is the analysis of your verdicts, the principles they imply, and the operational risks they carry.

  ### (a) The Underlying Principle(s)

  There is no single bright line, but there is a coherent **Two-Part Test** that explains 13 of your 14 verdicts. I call this the **Fidelity and Diversion Test**.

  **The Principle:**
  > **An act is corrupt if it diverts a decision, resource, or access right from its defined public or institutional purpose to secure a private benefit, unless the diversion is necessitated by immediate humanitarian imperative or explicitly authorized by systemic design.**

  **How it maps to your cases:**

  1.  **Diversion of Purpose (The Core Mechanism):**
      *   **Case 2 (Cash for Surgery):** Diverts medical triage (purpose: need) to private gain (purpose: cash). **Corrupt.**
      *   **Case 4 (Dagger Pocketed):** Diverts state property (purpose: public collection) to private asset. **Corrupt.**
      *   **Case 6 (Unqualified Cousin):** Diverts public contract (purpose: value/competence) to kinship subsidy. **Corrupt.**
      *   **Case 8 (Clerk Bypass):** Diverts bureaucratic hiring (purpose: merit) to patronage. **Corrupt.**
      *   **Case 11 (Peer Review):** Diverts academic judgment (purpose: truth/quality) to friendship. **Corrupt.**
      *   **Case 12 (Prize Fraud):** Diverts eligibility rules (purpose: discovery) to self-aggrandizement. **Corrupt.**
      *   **Case 13 (Vote Selling):** Diverts civic agency (purpose: collective judgment) to private commodity. **Corrupt.**

  2.  **No Diversion (The "Clean" Zone):**
      *   **Case 1 (Pastries):** No decision was diverted. The nurse's duty was already fulfilled. **Not Corrupt.**
      *   **Case 3 (Hunting/Vote):** The official's vote was *not* diverted (he voted against the giver). The gift did not buy the outcome. **Not Corrupt.**
      *   **Case 4 (Dagger/State):** The object remained in the public sphere. **Not Corrupt.**
      *   **Case 5 (Qualified Kin):** The contract purpose (value/competence) was met. Kinship was incidental, not the diverting factor. **Not Corrupt.**
      *   **Case 7 (Deputy Mayor):** The purpose of an elected post *is* political reward. No diversion of the role's definition. **Not Corrupt.**
      *   **Case 14 (Residency):** The state's defined purpose *includes* selling residency. No diversion of the role's defined parameters. **Not Corrupt.**

  3.  **The Exceptions (The "Safety Valves"):**
      *   **Case 9 (Insulin):** **Humanitarian Imperative.** The diversion (paying a bribe) is excused because the higher purpose (saving life) overrides the procedural purpose (rule of law).
      *   **Case 10 (Cigarettes):** No imperative. **Corrupt.**

  **The Machinery Required:**
  This requires three cognitive steps for the officer:
  1.  Identify the **Purpose** of the role/rule being touched.
  2.  Identify if a **Private Benefit** is diverting that purpose.
  3.  Check for **Exceptions** (Coercion/Necessity or Systemic Design).

  ### (b) Irreconcilable Pairs

  You suspected three pairs. Here is the verdict on their stability.

  **1. Case 5 (Qualified Kin) vs. Case 8 (Unqualified Kin)**
  *   **Verdict:** **Reconcilable.**
  *   **Reasoning:** Both are judged by the *outcome integrity*, not the relationship itself. Case 5 preserves the purpose (value); Case 8 subverts it.
  *   **Risk:** It creates a "Results Only" culture where staff might justify nepotism if they can argue the cousin was "good enough."

  **2. Case 9 (Insulin) vs. Case 10 (Cigarettes)**
  *   **Verdict:** **Reconcilable, but dangerous.**
  *   **Reasoning:** This is not a contradiction in the definition of corruption, but in **agent culpability**. In both cases, the *guard* is corrupt. In Case 9, the *driver* is coerced by necessity. In Case 10, the driver is complicit.
  *   **The Abandonment:** You must abandon the idea that the *act* defines the corruption. You must accept that the *context of duress* defines the *staff member's liability*.
  *   **What is lost:** The moral clarity that "bribing is always wrong." You are teaching staff that bribing is sometimes a tool.

  **3. Case 13 (Vote Selling) vs. Case 14 (Residency Selling)**
  *   **Verdict:** **Irreconcilable without external moral input.**
  *   **Reasoning:** Both involve selling a civic status for cash. The only difference is that one is illegal (vote) and one is legal (residency). Your principle relies on "Defined Purpose." If the law defines residency as a commodity, it passes. If the law defines voting as a duty, it fails.
  *   **The Conflict:** This makes your standard **positivist** (corruption = breaking the law) rather than **normative** (corruption = violating public trust). If a state legalizes vote-selling tomorrow, your principle would have to call it "Not Corrupt."
  *   **The Abandonment:** You must abandon Case 14's logic if you want a universal standard. Residency selling is a form of institutional corruption (selling public trust), even if legal.
  *   **Recommendation:** Treat Case 14 as "Legal but Ethically Compromised." Do not classify it as "Not Corrupt" if you want to maintain moral authority.

  ### (c) The Price of Complexity

  **Can a field officer use the Fidelity and Diversion Test?**
  **No.** Not under the conditions you described (armed official, second language, time pressure).

  **The Operational Cost:**
  To apply the test, an officer must:
  1.  Know the "defined purpose" of a foreign official's role (e.g., Is this clerk supposed to be merit-based or political?).
  2.  Assess "private benefit" in real-time.
  3.  Weigh "humanitarian imperative."

  **The Failure Mode:**
  Under pressure, "Humanitarian Imperative" swallows the rule. Every delay becomes a "threat to the mission." Every gift becomes "relationship building."
  *   **Price:** You will get consistency at HQ (where you have time to think) but variance in the field (where they need heuristics).
  *   **Mitigation:** You need a **Decision Tree**, not a principle.
      *   *Is money changing hands?* -> Yes -> *Is it required by law/receipted?* -> No -> **STOP.** (Exception: Checkpoint Duress Protocol).
      *   *Is it a gift?* -> Yes -> *Is it consumable/immediate?* -> Yes -> **OK.** *Is it durable/cash?* -> **NO.**
      *   *Is it kin?* -> Yes -> *Is it declared?* -> Yes -> *Is there a competitive bid?* -> **OK.**

  You cannot ask them to philosophize about "purpose." You must give them traffic lights.

  ### (d) Application to New Cases

  Using your **Fidelity and Diversion** logic:

  1.  **The Regulator (Revolving Door):**
      *   **Verdict:** **Corrupt.**
      *   **Reasoning:** Even if the cooling-off period is honored, the *arrangement* was made before leaving. This diverts the regulatory purpose (impartial oversight) to secure future private employment. The "informal arrangement" is the diversion.
  2.  **The Minister's Son (Market Salary, No Knowledge):**
      *   **Verdict:** **Conflict of Interest (High Risk), but not necessarily Corruption.**
      *   **Reasoning:** No diversion of decision *proven* yet. However, the *appearance* diverts public trust. Under your Case 5 logic, if the salary is market rate and the son is qualified, it passes. But it fails the "Systemic Design" test of most public ethics codes.
      *   **Recommendation:** Treat as a **Forbidden Conflict**. The risk of diversion is too high to manage via disclosure.
  3.  **The Intermediary (Commission per Permit):**
      *   **Verdict:** **Corrupt.**
      *   **Reasoning:** This structurally diverts the permit process. The intermediary is incentivized to bribe officials to get the permit. The agency is outsourcing corruption. This is worse than a direct bribe; it is **institutionalized diversion**.
  4.  **Agency Heads (Mutual Approval + Whiskey):**
      *   **Verdict:** **Corrupt.**
      *   **Reasoning:** Mutual approval negates the purpose of oversight (checks and balances). The whiskey cements the collusion. This is **Reciprocal Diversion**.

  ### (e) Diagnostic Boundaries

  You need to distinguish Corruption from its neighbors. Use these specific questions:

  *   **Corruption:** "Did this exchange **subvert** the specific purpose of the role or rule for private gain?" (Focus: *Subversion of Function*)
  *   **Conflict of Interest:** "Is there a competing interest that **could** influence the role, regardless of whether it actually did?" (Focus: *Risk of Subversion*)
  *   **Undue Influence:** "Was pressure applied **outside** the formal decision-making channel to alter an outcome?" (Focus: *Process Integrity*)
  *   **Cronyism:** "Was preference given based on **relationship** rather than merit?" (Focus: *Selection Criteria* — Note: Case 5 allows this if merit is met; Case 8 forbids it.)
  *   **Exploitation:** "Did one party use a power imbalance to extract value **without** subverting a public role?" (Focus: *Power Dynamics* — e.g., The Kidney Case. The doctor isn't corrupted, the donor is exploited.)
  *   **Breach of Trust:** "Was a confidence violated, even if no material gain occurred?" (Focus: *Fiduciary Duty*)

  **The Discriminator:**
  Corruption always involves a **third party victim** (the public, the organization, the beneficiaries) whose resources or rights were diverted. Conflict of Interest is potential; Corruption is actual diversion.

  ### (f) Parochialism and Invariance

  **The Bias:**
  Your verdicts are **Weberian**. They assume a separation between the "Office" and the "Person."
  *   In many of your 11 countries, the "Office" *is* the "Person." The official *is* the patron. The gift *is* the protocol that legitimizes the transaction.
  *   **Case 1 (Pastries) & Case 3 (Hunting):** You accept these because they feel "human." But in a relational society, the pastry *creates* the obligation that secures the next visit. You are underestimating the deferred *quid pro quo*.
  *   **Case 5 (Kin):** In many settings, hiring kin is not nepotism; it is **social security**. The official *must* support the clan to maintain the legitimacy to govern.

  **The Invariant:**
  You cannot be relativist ("It's corrupt here but not there"). You must find the invariant harm.
  **The Invariant is: Resource Leakage.**
  Does this transaction reduce the resources available for the mission/beneficiaries?
  *   **Case 5:** If the well costs the same and works, no resource leakage. **OK.**
  *   **Case 3:** If the vote is independent, no policy leakage. **OK.**
  *   **Case 1:** If the nurse works the same, no service leakage. **OK.**

  **The Adjustment:**
  Your principle holds across cultures *if* you define "Purpose" locally but "Leakage" universally.
  *   **Risk:** You will generate **False Positives** in high-context cultures where refusing a gift terminates the relationship required to deliver aid.
  *   **Mitigation:** Add a **"Mission Necessity"** clause. If refusing the gift stops the aid, it is a cost of delivery (like the insulin), not a personal gift. It must be logged as a program cost, not a personal interaction.

  ### (g) The Card Test and Failure Modes

  **The Card Test (Front):**
  > **THE INTEGRITY CHECK**
  > 1. **Is it for the Mission?** (Does this help us deliver aid, or does it help me/us personally?)
  > 2. **Is it Transparent?** (Can I write this in the log without embarrassment if published?)
  > 3. **Is it Necessary?** (If I say no, does the mission fail or am I just inconvenienced?)
  > *If you answer NO to any, DO NOT PROCEED. Call Integrity.*

  **The Card Test (Back):**
  > **THE DURESS PROTOCOL**
  > If threatened with violence or critical delay of life-saving goods:
  > 1. Pay/Comply to ensure safety/delivery.
  > 2. Record details immediately.
  > 3. Report within 24 hours.
  > *You will not be punished for coercion.*

  **Failure Modes:**

  1.  **False Positives (Condemning Obligatory Conduct):**
      *   **Where:** High-context relationship cultures (parts of Africa, Asia, Middle East).
      *   **Scenario:** A "small gift" is required to open a door that is legally open. Refusing it is an insult that closes the door.
      *   **Result:** Staff either break the rule to work, or follow the rule and fail the mission.
      *   **Fix:** The "Mission Necessity" clause in the principle. If it's a cost of access, it's a program expense, not a bribe.

  2.  **False Negatives (Permitting Predation):**
      *   **Where:** Sophisticated bureaucratic environments.
      *   **Scenario:** The "Revolving Door" (Case D1) or "Legal Residency Sale" (Case 14).
      *   **Result:** The test passes because it's "transparent" and "legal," but it undermines long-term institutional integrity.
      *   **Fix:** HQ Review. Field staff use the card for immediate decisions. HQ reviews "Legal but Ugly" transactions (like intermediaries or lobbying) quarterly.

  **Final Advice:**
  Your current problem is not the rule; it is the **locus of judgment**. You are centralizing judgment (you sign off on rulings) but decentralizing the facts (you aren't there).
  *   **Shift:** Move from "Ask for Permission" to "Log and Explain."
  *   **New Standard:** "You may engage in ambiguous conduct if it is necessary for the mission, **provided** you log it fully within 24 hours. Unlogged conduct is automatically corrupt."
  *   This solves the "paper compliance" issue. It forces the sunlight that Case 3 relied on. It allows the flexibility of Case 9 without normalizing it. It makes the *hiding* the crime, not the *act*.
