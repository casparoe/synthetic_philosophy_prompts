  1. **Question:** Does Marx's distinction between machinery and its capitalist application constitute a falsifiable analytical criterion for attributing technological harm, or merely a rhetorical escape hatch from technophobia?
  2. **Why it's open:** Prevailing interpretations treat the *Grundrisse* as prophecy and *Capital* as sociology, thereby presupposing the distinction without specifying the counterfactual conditions under which the artifact remains neutral.
  3. **Method:** I will perform an immanent reconstruction of the value-form analysis in Volume I and the *Fragment on Machines* to isolate the logical predicates of capitalist use, avoiding the anachronistic application of categories to contemporary artifacts.
  4. **Success and Failure Conditions:** A positive result produces a set of necessary conditions for attributing alienation to property relations, while failure demonstrates that the distinction collapses under historical materialist scrutiny.
  5. **Scope:** This project requires three months of textual exegesis and conceptual mapping, explicitly excluding empirical case studies of algorithmic management or warehouse automation.
