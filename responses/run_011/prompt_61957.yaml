prompt: |-
  You're a philosopher of technology who's actually read Marx closely rather than via the summaries — keep that hat on for this. I'm applying for a small internal fellowship, three months, no travel money, and I need my half-baked idea compressed into a proposal skeleton.

  The idea: Marx on machinery gets read two ways, and I think both readings dodge the same problem. Either the Grundrisse machine notes are treated as a prophesy that automation dissolves value and capitalism trips over its own success, or the machinery chapters in Capital are treated as a story about deskilling and immiseration. But running through both is Marx's repeated insistence that the trouble isn't the machine, its the way capital sets the machine to work. So either that distinction is doing serious analytical work that nobody has cashed out, or its an escape hatch that makes his account unfalsifiable. What would settle it?

  Draft me a proposal around something like: can we state non-trivial conditions under which a bad effect of a technology is attributable to the property form that deploys it rather than to the artifact itself, and does Marx's corpus actually supply those conditions or just gesture at them? I want the question sharpened so it has an answer, the reason the two standard readings leave it open, the method plus why it beats the obvious alternative (which is just parachuting his categories onto warehouse robots and algorithmic scheduling), what a positive result would look like and what would count as the project failing, and an honest read on what fits in three months.

  Think it through carefully, kick a couple of competing framings around in your head first, but don't show me any of that working. Deliverable is exactly five numbered items — question, why it's open, method, success and failure conditions, scope — one or two sentences each, no intro and no conclusion. No citations or bibliography, I'll add those myself.
