      *   *Verdict:* The ledger sees this as a shift in *Culpability* assessment (we weren't that guilty). But it misses the *function* of the blame narrative (national identity repair). This suggests a missing row: *Function/Utility*.

  7.  **Drafting Section 5: Final Verdict on the Ledger:**
      *   *Confirm:* It successfully disentangles the Fischer/Clark debate (showing they weight rows differently).
