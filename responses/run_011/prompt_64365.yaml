      *   **Core Task:** Apply the user's "Responsibility Ledger" (Contribution, Control, Culpability, Standing) to the Fischer vs. Clark debate.
      *   **Specific Questions:**
          1.  Run the ledger on Fischer vs. Clark. Are they talking past each other (different rows) or clashing factually?
          2.  Apply a "Group-Agency Filter." Does Wilhelmine Germany qualify as a collective agent? If not, where does blame go? If yes, does it help Fischer?
          3.  Analyze Article 231 (War Guilt Clause). Which ledger row did it fill? Did it corrupt the others? Is a 5th row needed (Venue/Form)?
