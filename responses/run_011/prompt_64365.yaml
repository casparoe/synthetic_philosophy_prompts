      *   *Self-Correction on History:* Ensure I don't accidentally contradict the user's recap. (User says Fischer = expansionist aims/steering; Clark = distributed agency/risk. This is accurate enough for the philosophical exercise).
      *   *Refining the "Group Agency" point:* Be careful not to say Germany *wasn't* an agent. Say it fails the *strict* philosophical test the user proposed. This creates the "residue" problem.
