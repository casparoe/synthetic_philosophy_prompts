      *   *Culpability:* Moral quality of intent/deliberation. (Bad aims, recklessness.)
      *   *Standing:* Who can blame and why. (Victim status, moral authority.)

  3.  **Drafting Section 1: Fischer vs. Clark on the Ledger:**
