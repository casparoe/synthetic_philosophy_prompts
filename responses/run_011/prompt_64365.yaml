      *   *Application:* Germany likely *fails* the strict test of a unified collective agent. It's a "scene in which individuals act."
      *   *Consequence for Blame:* If it fails, blame *should* collapse to individuals (Moltke, Bethmann, Wilhelm II).
      *   *The Residue:* But there's a residue. The *culture* of militarism, the structural incentives that promoted risky actors. This doesn't fit individual blame neatly.
      *   *Fischer Implication:* If Germany fails the test, Fischer's "Germany willed it" is category error. It should be "Specific German elites willed it." However, if we view the *state apparatus* as the agent despite internal friction (a looser definition), Fischer holds.
      *   *Refinement:* The "failure" of group agency actually helps Clark structurally (no single will to blame) but Fischer can argue the *dominant faction* (military/aggressive diplomats) hijacked the agency.
      *   *Verdict:* The residue is *structural culpability*. The system selected for risk-takers. The ledger needs to account for "Systemic Selection" if group agency fails.

