      *   *Refining the Clark Uptake:* Is it culpability? It's a *denial* of culpability. Is it standing? It's an assertion that *everyone* has equal standing to be blamed (diffusion).

  9.  **Final Polish:** Organize with clear headings matching the user's prompts. Ensure the "Verdict" is punchy. (Self-correction: Make sure to explicitly answer "Does blame collapse cleanly?" in the group agency section).

  *(Self-Correction during drafting)*: Wait, on the Group Agency section. If Germany fails the test, does blame collapse to individuals? The user asks this. I need to be precise. If the group isn't an agent, *collective* responsibility is incoherent. But *individual* responsibility remains. However, the "residue" is the *system* that enabled them. I need to name that residue. Let's call it "Structural Complicity."

  *(Self-Correction on Article 231)*: The user asks if filling one row corrupted the others. Yes, fixing Culpability legally destroyed Standing morally. I need to make sure that link is clear.

  *(Self-Correction on Clark Uptake)*: The user asks if this is culpability, standing, or invisible. It's likely a *Standing* move (rejecting exclusive blame) disguised as a *Culpability* claim (we weren't unique). But the ledger might miss the *identity* function. I'll argue it exposes a blind spot regarding *narrative utility*.

