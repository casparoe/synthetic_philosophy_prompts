      *   *Clark:* Focuses on *Control* (structural constraints, security dilemmas, everyone was trapped) and *Contribution* (distributed across all powers). He lowers *Culpability* (sleepwalking vs. steering).
      *   *Interaction:* Are they talking past each other? Yes and no. There is a factual clash on *Culpability* (intent vs. accident). But the *weight* of the argument shifts rows. Fischer says "Look at their bad minds (Culpability) which drove their high Contribution." Clark says "Look at their low Control (structural trap) which makes Culpability moot."
      *   *Verdict:* It's not *just* talking past each other; there's a factual dispute over intent (Culpability). But the *political force* comes from weighting the rows differently. Fischer weights Culpability heavily. Clark weights Control/Structure heavily.

