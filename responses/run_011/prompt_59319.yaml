prompt: |-
  You're a metaphysician who works on identity, individuation and philosophy of physics — someone with actual views here who is willing to put numbers on them rather than hiding behind "it depends on your account of properties". Please think carefully and, before you produce any numbers at all, spend a few lines brainstorming the sub-questions the answer really turns on. British English throughout, please.

  I've built a variant of Max Black's two-sphere world and I want your credence about it. The standard case: a universe containing nothing but two exactly similar iron spheres, same diameter, colour, temperature, everything, sitting some distance from each other. My variant — call it Black-Minus — deliberately strips out the usual escape routes:

  - There is no space. No substantival container, no points, no regions, nothing for the spheres to be located at except each other.
  - There are exactly two spheres, and between them obtains one primitive, irreflexive, symmetric relation, call it D, which each bears to the other and to nothing else (there is nothing else). D plays the distance role, but there is no metric structure, no coordinates, no left or right, no orientation of any kind.
  - Nothing changes. Take it as a single static moment or as an eternal block with no interesting temporal structure — say which you're reading it as and whether that choice matters to your verdict.
  - That's the entire inventory. I'm not building haecceities in and I'm not ruling them out; I'm not stipulating anything about thisness, and I'm not stipulating that the world is describable.

  Two questions:

  (1) Your credence that Black-Minus is metaphysically possible and, if it is possible, that it is a world containing two numerically distinct spheres rather than a world that we can only describe as containing two.
  (2) Your credence that the identity of indiscernibles is necessarily true, read as: necessarily, no two objects share all their properties, where the properties in question are ones that don't themselves mention identity, distinctness, or the other object.

  The numbers are the least interesting part of what I want. I want the decomposition:

  - the sub-questions each of (1) and (2) turns on, each with a rough probability and one line of justification;
  - how you're combining them, with the structure made explicit — I know it isn't a straight product, some of these terms aren't independent and some are rival hypotheses that should be added rather than multiplied;
  - which single term your headline numbers are most sensitive to, i.e. which one, shifted to 0.9 or to 0.1, moves the answer most;
  - and what kind of argument or consideration would shift that term. No reading lists or citations needed, just the dialectic.

  Things I'd expect to show up in your decomposition, though feel free to add or drop: whether a primitive two-place relation like D is even coherent without something space-like for the relata to sit in; whether the irreflexivity of D already makes the spheres weakly discernable, and whether that counts as refuting the principle or as satisfying it; whether thisness is a legitimate posit or just numerical difference dressed up as a property — and note the triviality worry, since any two objects differ in the property of being identical to the first one, so the interesting principle has to be restricted somehow; whether actual quantum-mechanical systems (identical particles, permutation invariance, what counts as a state of two bosons) give us a real instance of indiscernible distinct particulars, because if they do then actuality entails possibility and (1) goes to 1 while (2) goes to 0, and I want to know how much weight you honestly put on that; and whether our modal intuitions about a world like Black-Minus are tracking anything, or whether I've simply written down a sentence that feels conceivable.

  Then tell me whether (1) and (2) can come apart for you. If they can, say what would have to be true for someone to hold a high number on one and a low number on the other without just being confused. If they can't, say why not and give me the single number.

  My gut says about 0.55 for (1) and 0.35 for (2), and I don't trust either. Point out where you think my 0.55 is doing something illegitimate.
