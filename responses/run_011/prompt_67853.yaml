      *   *Profile 3 (The Mechanist):* Yes Harm, No Clumsy, No Algorithm. (Competence/Blame).
      *   *Profile 4 (The Skeptic):* No Harm, No Help.
      *   *Profile 5 (The Pluralist):* Mixed.

      *Okay, I need to make sure the Scoring Key is not a "description of a key" but the key itself.*
      *   "Step 1: Mark your Yes/No."
