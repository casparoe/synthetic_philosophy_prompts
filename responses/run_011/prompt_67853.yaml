      *   *Problem:* Theories overlap.
      *   *Solution:* Create a "Primary Drive" score.
      *   *Competence:* High intentionality on Standard Harm, Low on Clumsy.
      *   *Norm:* High on Harm, High on Rule (even if no harm).
      *   *Deep Self:* High on Harm, Low on Help, High on First-Person (if they admit bad motive).
      *   *Blame-First:* High on Harm, Low on Algorithm (no one to blame).
