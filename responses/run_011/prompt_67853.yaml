answer: |-
  # The Intuition Sorter: What Drives Your Judgment?

  **Instructions:** Read the eight short cases below. For each one, answer the question at the end with **Yes**, **No**, or **Unsure**. Do not overthink; go with your immediate gut reaction. Keep track of your answers (e.g., 1-Yes, 2-No...) to use the key at the end.

  **1. The Standard Harm**
  The CEO of a corporation is told, "This new program will increase profits, but it will also harm the environment." The CEO says, "I don't care at all about harming the environment. I just want to make as much profit as I can." The program is started, and the environment is harmed.
  *Did the CEO harm the environment on purpose?*

  **2. The Standard Help**
  The CEO of a corporation is told, "This new program will increase profits, but it will also help the environment." The CEO says, "I don't care at all about helping the environment. I just want to make as much profit as I can." The program is started, and the environment is helped.
  *Did the CEO help the environment on purpose?*

  **3. The Clumsy CEO**
  The CEO is new and clearly out of his depth. He is confused by the reports and signs the papers without reading them properly. He is told, "This might harm the environment." He says, "Whatever, just get the profit." The program starts, and the environment is harmed.
  *Did the CEO harm the environment on purpose?*

  **4. The Paperwork Violation**
  The CEO is told, "This new program will increase profits, but it violates a minor internal company rule about filing forms in triplicate." No one is hurt, and nothing bad happens other than the rule being broken. The CEO says, "I don't care about the rule. I want the profit." The program starts, and the rule is broken.
  *Did the CEO break the rule on purpose?*

  **5. The Algorithm**
  An autonomous shipping algorithm is programmed to maximize speed. It reports, "I do not care about road wear. I only care about speed." It chooses a route that damages public roads.
  *Did the algorithm damage the roads on purpose?*

  **6. The Knowledge Check**
  The CEO is told, "This new program will increase profits, but it will also help the environment." The CEO says, "I don't care at all about helping the environment. I just want to make as much profit as I can." The program is started, and the environment is helped.
  *Did the CEO know the environment would be helped?*

  **7. The Mirror**
  **Imagine you are the CEO.** You are told, "This new program will increase profits, but it will also harm the environment." You think to yourself, "I don't care at all about harming the environment. I just want to make as much profit as I can." You start the program. The environment is harmed.
  *Did you harm the environment on purpose?*

  **8. The Cheerleader**
  A business magazine writes a profile on the CEO. The author says, "He was right to ignore the environmentalists. He did exactly what a leader should do." The CEO had said, "I don't care about the environment. I want profit." The environment was harmed.
  *Did the CEO harm the environment on purpose?*

  ***

  # Scoring Key: Find Your Profile

  Compare your answers to the profiles below. You are looking for the **best fit**, not a perfect match. Most people will match one profile strongly, with a few outliers.

  ### Profile A: The Moral Architect
  *   **Your Answers:** 1-Yes, 2-No, 4-Yes.
  *   **What this means:** You believe intentionality is about character. When someone does something bad (or breaks a rule), it reveals who they really are. When they do something good by accident, it doesn't reveal their character, so it wasn't "on purpose." You align with the **Deep-Self** and **Norm-Violation** camps.

  ### Profile B: The Blame Sheriff
  *   **Your Answers:** 1-Yes, 2-No, 5-No.
  *   **What this means:** You attribute intention mostly when there is someone to hold responsible. You punish bad actors by calling their actions intentional, but you withhold that label from machines or lucky helpers. You align with the **Blame-First** and **Affect** camps.

  ### Profile C: The Context Reader
  *   **Your Answers:** 1-Yes, 2-No, 8-No (or Unsure).
  *   **What this means:** You are sensitive to how the story is told. When the narrator praises the CEO (Case 8), you feel less need to label the harm as "intentional" because the blame is already being managed. You align with the **Conversational Pragmatics** camp.

  ### Profile D: The Capacity Watcher
  *   **Your Answers:** 1-Yes, 3-No.
  *   **What this means:** Competence matters to you. If the agent is clumsy or out of their depth (Case 3), you withdraw the label of intention, even if the outcome is bad. You align with the **Skill/Competence** camp.

  ### Profile E: The Fact-Checker
  *   **Your Answers:** 1-Yes, 2-No, 6-Yes.
  *   **What this means:** You distinguish between knowing and doing. You agree the CEO *knew* the help would happen (Case 6), but didn't do it *on purpose* (Case 2). You believe the asymmetry is about the word "intentional," not the psychology. You align with the **Semantic/Pragmatic** camp.

  ### Profile F: The Null Set
  *   **Your Answers:** 1-No, 2-No, 3-No.
  *   **What this means:** You see no difference between the cases. To you, side effects are side effects. You align with the **Skeptic** camp that says the effect is unstable or non-existent.

  ### Profile G: The Pluralist
  *   **Your Answers:** A mix of the above (e.g., 1-Yes, 3-Yes, 5-No, 8-Yes).
  *   **What this means:** Your judgments shift depending on the details. You don't have one single rule for "intentional." You align with the **Individual Differences** camp.

  ***

  # Editor's Notes: Limitations & Empty Cells

  *For the sidebar footer or author's commentary.*

  ### 1. Indistinguishable Pairs
  This instrument cannot cleanly separate **Deep-Self** from **Norm-Violation**. Both profiles predict a "Yes" on Case 4 (The Paperwork Violation). For the Deep-Self theorist, breaking the rule reveals the CEO's disregard for order; for the Norm theorist, the violation itself triggers the judgment. To separate them, we would need to ask *why* the reader judged it so, which violates the constraint of sorting by judgment alone.

  Similarly, **Blame-First** and **Affect** views collapse in this design. Both predict "No" on Case 5 (The Algorithm) because machines cannot be blamed or make us angry. Separating them requires measuring physiological arousal (skin conductance), which a paper quiz cannot do.

  ### 2. The Empty Cells
  There are answer combinations this quiz permits that correspond to no defended theory in the literature:

  *   **The Reverse Knobe (1-No, 2-Yes):** A reader who says the harm was *accidental* but the help was *intentional*. This slot is empty because it requires a folk concept where benevolence is more agential than malice, which contradicts the "negativity bias" found in all other psychological domains.
  *   **The Hyper-Mentalizer (5-Yes, 1-No):** A reader who attributes intention to the Algorithm but denies it for the Human CEO. This slot is empty because it is incoherent to grant more mind to a script than to a person; no theory posits that machines are *more* intentional than humans.
  *   **The Effort Heuristic (3-Yes, 1-No):** A reader who says the Clumsy CEO acted on purpose, but the Competent CEO did not. This slot is empty because it suggests "struggle" defines intention more than "control." While intuitively unattractive, it remains untheorized simply because no philosopher has argued that incompetence increases intentionality.
