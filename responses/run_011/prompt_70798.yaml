prompt: |-
  I'm on the model validation team at a mid-size bank — basically the person who has to say whether a model the business wants to use is fit for purpose. Around 15 reviews a year, three working days each, and my write-up goes to a committee where half the people aren't quants, then occasionally to the auditor. The problem I keep hitting is what to do with assumptions that are flatly false.

  Last quarter I objected to a mortgage prepayment model and the desk head waved me off with the line that you don't judge a model by how realistic its assumptions are, only by whether it predicts — plus something about expert pool players making shots as if they'd solved the equations. And honestly I couldnt answer him, because the fit is excellent. But I dont buy that it settles anything, and the whole just-check-the-predictions move isn't something I can actually run when there's one historical dataset, no counterfactuals, and the model is about to be used in a rate environment that isn't in the sample.

  So: write me a procedure I can run on any model in those three days. Questions in order, what counts as a sufficient answer to each, which answers force me to stop and write "not fit for purpose," and which steps aren't really about facts at all and have to be handed to a human — flag those explicitly, because otherwise I'll dress up my judgment as method and the committee will treat it as objective. I vaguely remember people trying to sort assumptions into kinds — ones that only buy tractability, ones that fix the range the model is supposed to work in, ones that are load-bearing for the prediction itself — but I don't have the details, so build whatever sorting you need into the procedure and tell me what each kind licenses and what it doesn't.

  Then run it on three:

  1. the prepayment model above — assumes every borrower refinances the instant it's optimal, no frictions, no inertia, perfect foresight of where rates go; backtest error is tiny, but the entire backtest window is one rate regime;
  2. an economic capital model that aggregates loss streams across business lines as independent — everyone knows they aren't, the correlation shows up exactly in the bad tail, and relaxing it makes the thing unsolvable;
  3. a deposit pricing model I actually like and want to keep, which assumes a single representative customer who notices every rate change immediately.

  If it kills number 3, fine, say so. But also tell me which of the three your procedure is least reliable on, what it structurally can't detect — I suspect there's a class of false assumptions it'll wave through no matter how carefully I follow it — and which steps fall apart when nobody can give me the number the step asks for.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the User and the Problem:**
      *   **Role:** Model Validator at a mid-size bank.
      *   **Workload:** ~15 reviews/year, 3 days each. (This is tight. The procedure *must* be efficient.)
      *   **Audience:** Committee (mixed quants/non-quants), Auditors. (Needs clear language, distinction between objective facts and subjective judgment.)
      *   **Core Conflict:** "False assumptions but good fit." The Business Head's argument: "Predictive power matters, not realism" (Friedman's instrumentalism).
      *   **User's Intuition:** This is dangerous, especially with limited data, no counterfactuals, and regime changes (out-of-sample risk).
      *   **Request:**
          1.  A 3-day procedure (questions, sufficiency criteria, stop conditions, human judgment flags).
          2.  A taxonomy of assumptions (tractability vs. scope vs. load-bearing).
          3.  Apply the procedure to three specific models (Prepayment, Economic Capital, Deposit Pricing).
          4.  Critique the procedure itself (blind spots, failure modes).

  2.  **Develop the Philosophy/Framework:**
      *   The Business Head is quoting Milton Friedman ("The Methodology of Positive Economics"). The counter-argument is Lucas Critique / Structural Stability. If assumptions are false *in a way that matters for policy changes*, the model breaks when the environment changes.
      *   The procedure needs to distinguish between *phenomenological* models (black box, fit-focused) and *structural* models (mechanism-focused).
      *   Time limit: 3 days. This means no re-coding from scratch, no massive new data gathering. It relies on documentation, interviews, and targeted sensitivity analysis.
      *   **Assumption Taxonomy:**
          1.  *Approximations/Tractability:* False but harmless (e.g., continuous time for discrete events).
          2.  *Scope/Boundary Conditions:* Define where the model works (e.g., "valid for rates 2-10%").
          3.  *Structural/Load-Bearing:* False and dangerous (e.g., "correlations are zero" in a crisis).
      *   **Judgment vs. Fact:** Must explicitly flag where the validator is making a call that isn't purely mathematical.

  3.  **Drafting the Procedure (The "3-Day Protocol"):**
      *   *Day 1: Conceptual Soundness & Assumption Mapping.*
      *   *Day 2: Empirical Testing & Sensitivity.*
      *   *Day 3: Synthesis & Reporting.*
      *   *Key Mechanism:* The "Assumption Stress Test." Instead of asking "Is it true?", ask "If this were true, would the output change materially under stress?"
      *   *Stop Conditions:* Clear red flags (e.g., structural assumption violated in stress scenario).
      *   *Human Flags:* Explicitly mark where committee judgment is needed.

  4.  **Applying the Procedure to the Three Models:**

      *   **Model 1: Mortgage Prepayment (The "Friedman" Case).**
          *   *Assumption:* Perfect foresight, no friction.
          *   *Reality:* Behavioral inertia exists.
          *   *Risk:* Rate regime change. If rates drop fast, people *don't* refinance instantly (processing lag, qualification). If the model assumes instant, it overestimates prepayment speed in a crash, underestimating duration risk.
          *   *Verdict:* **Not Fit.** The assumption is load-bearing for the specific risk (regime change) the bank faces. The backtest is misleading because the environment was stable.

      *   **Model 2: Economic Capital (Independence Assumption).**
          *   *Assumption:* Independence across business lines.
          *   *Reality:* Correlations spike in tails (contagion).
          *   *Risk:* Capital adequacy. If correlations go to 1 in a crisis, capital is insufficient.
          *   *Constraint:* "Relaxing it makes it unsolvable."
          *   *Verdict:* **Not Fit (with mitigation).** You can't use independence for tail risk. If the math breaks with correlation, the *model structure* is wrong, not just the parameter. Needs a capital add-on or a different copula.

      *   **Model 3: Deposit Pricing (Representative Agent).**
          *   *Assumption:* Single customer, perfect attention.
          *   *Reality:* Heterogeneous customers, sticky rates.
          *   *Nuance:* This is often a *pricing* model, not a *volume* model. If the goal is margin optimization, does the aggregation hold?
          *   *Verdict:* **Fit (with caveats).** This is likely a tractability assumption that averages out for *aggregate* pricing, provided the "representative" elasticity is calibrated to the *margin*, not the individual. It's phenomenological.

  5.  **Critiquing the Procedure (The "Meta-Analysis"):**
      *   *Blind Spots:* Endogenous risk (model changes behavior), Data mining/overfitting (looks good in backtest, fails out of sample), "Unknown Unknowns."
      *   *Failure Modes:* When developers say "we don't know" to sensitivity requests. When the committee lacks the guts to reject a revenue-generating model.
      *   *The "False Assumption" Class:* Equifinality. Different structures produce same fit. The procedure can't distinguish the "true" structure, only test stability.

  6.  **Refining the Output:**
      *   *Tone:* Professional, peer-to-peer, slightly cynical but rigorous. Acknowledge the political reality (committee dynamics).
      *   *Structure:*
          1.  The Protocol (Day 1-3).
          2.  Assumption Taxonomy.
          3.  Application to the 3 Models.
          4.  Limitations of the Protocol.
      *   *Specific Constraint Check:* Ensure "Human Judgment Flags" are explicit. Ensure "Stop Conditions" are clear.

  7.  **Self-Correction/Polishing during drafting:**
      *   *Initial thought:* Maybe suggest bootstrapping for the prepayment model.
      *   *Correction:* No time. 3 days. Stick to scenario analysis and conceptual review.
      *   *Clarification:* Make sure to address the "expert pool player" analogy. That's Friedman. The counter is Lucas. I need to make sure the user understands *why* the pool player analogy fails in finance (unlike physics, the rules of the game change when policy changes).
      *   *Model 3:* Be careful not to auto-approve it. Representative agent models are notoriously bad at distributional shifts. I need to justify *why* it passes (aggregate vs. individual focus).
      *   *Formatting:* Use bolding and lists for readability.

  8.  **Final Review against User Prompt:**
      *   Procedure for 3 days? Yes.
      *   Questions/Sufficiency/Stop Conditions? Yes.
      *   Human Judgment Flags? Yes.
      *   Assumption Taxonomy? Yes.
      *   Run on 3 models? Yes.
      *   Critique of procedure (least reliable, structural blind spots)? Yes.

  (Proceed to generate response based on these thoughts.)
answer: |-
  This is a classic Model Risk Management (MRM) dilemma. Your desk head is quoting Milton Friedman's 1953 essay *The Methodology of Positive Economics* (the "pool player" analogy). His argument is **instrumentalism**: a theory is valid if it predicts, regardless of assumptions.

  Your counter-argument is the **Lucas Critique**: if the assumptions describe behavior, and policy/environment changes, the behavioral parameters will change, and the model will break. In banking, we care about the *tail* and *regime shifts*, not just the in-sample mean.

  Here is a 3-day procedure designed to expose structural fragility without requiring you to rebuild the model. It focuses on **Assumption Materiality** rather than Assumption Truth.

  ---

  # The 3-Day "Structural Stability" Protocol

  **Goal:** Determine if false assumptions are *load-bearing* in stress scenarios.
  **Constraint:** 3 Days. No re-coding. Limited data access.
  **Output:** Fit / Fit with Conditions / Not Fit.

  ## Day 1: Conceptual Soundness & Assumption Mapping
  **Objective:** Classify assumptions and identify the "Theory of Change."

  **Step 1.1: The Assumption Inventory**
  *   **Action:** Extract every explicit and implicit assumption from documentation/code comments.
  *   **Question:** What does this assumption *do*?
  *   **Taxonomy (Sort each assumption into one):**
      1.  **Tractability (T):** Makes math possible (e.g., continuous time, normal distribution). *Licenses:* Approximation error. *Does not license:* Systematic bias in tails.
      2.  **Scope (S):** Defines boundaries (e.g., "valid for rates 2-10%"). *Licenses:* Use within bounds. *Does not license:* Extrapolation.
      3.  **Structural/Load-Bearing (L):** Drives the mechanism (e.g., "borrowers refinance when optimal"). *Licenses:* Nothing if false. *Does not license:* Use in regime change.
  *   **Sufficiency:** All assumptions mapped. Developer agrees on classification.
  *   **🚩 Human Judgment Flag:** Classifying an assumption as (T) vs (L) is subjective. *Document the developer's rationale and your counter-rationale.*

  **Step 1.2: The Mechanism Check**
  *   **Question:** If the environment changes (rates spike, correlation breaks), does the *mechanism* described by the (L) assumptions still hold?
  *   **Sufficiency:** A narrative explanation of how the model behaves under stress.
  *   **Stop Condition:** If the developer says, "The model doesn't handle that," and the bank expects to operate in that environment → **NOT FIT.**

  ## Day 2: Empirical Testing & Sensitivity (The "False Assumption" Stress Test)
  **Objective:** Test if the falsity of the assumption matters *marginally*.

  **Step 2.1: The "As-If" Sensitivity**
  *   **Action:** Do not test if the assumption is *true*. Test if *relaxing* it changes the output materially.
  *   **Question:** If we perturb the assumption (e.g., add friction, add correlation), does the P&L/Capital change by > [Bank Threshold, e.g., 5%]?
  *   **Sufficiency:** Quantified sensitivity metric.
  *   **Stop Condition:** If a plausible relaxation of a (L) assumption moves output beyond risk appetite, and the model cannot incorporate that relaxation → **NOT FIT.**
  *   **🚩 Human Judgment Flag:** Defining "plausible relaxation." You need to justify the shock size (e.g., "Why 10% friction?"). This is where you need committee backing.

  **Step 2.2: Regime Segmentation**
  *   **Action:** Split the backtest data into sub-periods (e.g., rising rate vs. falling rate).
  *   **Question:** Does the error distribution shift between regimes?
  *   **Sufficiency:** Error metrics (RMSE, MAE) per regime.
  *   **Stop Condition:** If performance degrades significantly in the regime most similar to the *forward-looking* view → **NOT FIT.**

  ## Day 3: Synthesis & Reporting
  **Objective:** Translate findings for the Committee.

  **Step 3.1: The Residual Risk Statement**
  *   **Action:** Write the specific risk the model *hides* due to its assumptions.
  *   **Question:** What loss will occur when this assumption breaks?
  *   **Sufficiency:** A clear sentence: "This model underestimates risk in [Scenario X] because it assumes [Assumption Y]."

  **Step 3.2: The Mitigation Plan**
  *   **Action:** Propose overlays, add-ons, or usage restrictions.
  *   **Question:** Can we use this model if we add a 10% capital buffer?
  *   **Sufficiency:** Agreed-upon mitigation.
  *   **🚩 Human Judgment Flag:** Setting the buffer size is not math; it is risk appetite. *Explicitly state: "Recommended buffer is a policy decision, not a model output."*

  ---

  # Application to Your Three Models

  ## 1. Mortgage Prepayment Model (The "Pool Player")
  *   **Assumption:** Perfect foresight, no friction, instant refinancing.
  *   **Classification:** **Structural/Load-Bearing (L).** This drives the core volume prediction.
  *   **Day 1 Check:** The mechanism assumes borrowers act like arbitrage bots. In reality, they act like humans with inertia.
  *   **Day 2 Check (Regime Segmentation):** You noted the backtest is one rate regime.
      *   *Test:* Apply a "friction shock." Assume only 50% of eligible borrowers refinance in the first month.
      *   *Likely Result:* Duration risk explodes. The model predicts fast prepayment (short duration) when rates drop. Reality is slower prepayment (long duration). You hold assets that don't pay off as expected.
  *   **Verdict:** **NOT FIT.**
  *   **Reasoning:** The assumption is load-bearing for the specific risk (interest rate risk) you are managing. The "pool player" argument fails because the *rules of the game* (borrower psychology/processing capacity) change when rates move fast. The backtest is overfitted to a stable regime.
  *   **Mitigation:** Requires a behavioral overlay (e.g., S-curve refinancing speed) or a severe stress add-on.

  ## 2. Economic Capital Model (Independence)
  *   **Assumption:** Business lines are independent.
  *   **Classification:** **Structural/Load-Bearing (L)** for tail risk.
  *   **Day 1 Check:** Everyone knows correlations converge to 1 in a crisis. Independence is a tractability choice that violates economic reality.
  *   **Day 2 Check (Sensitivity):** You noted relaxing it makes it "unsolvable."
      *   *Analysis:* If the math breaks when you add correlation, the *structure* (likely a simple sum-of-VaR) is insufficient for aggregation.
      *   *Test:* Compare Sum-of-VaR vs. a simple correlation matrix (even if approximate).
      *   *Likely Result:* Capital requirement understated significantly.
  *   **Verdict:** **NOT FIT (for Capital Adequacy).**
  *   **Reasoning:** You cannot use an independence assumption to calculate capital for the *tail*. That is precisely where independence fails. If the model cannot solve for correlation, it is the wrong model class (e.g., needs Copula or Monte Carlo, not analytical).
  *   **Mitigation:** Do not use for regulatory capital. Use only for allocation, with a massive "diversification benefit haircut" (e.g., assume 0% diversification benefit).

  ## 3. Deposit Pricing Model (Representative Agent)
  *   **Assumption:** Single representative customer, perfect attention.
  *   **Classification:** **Tractability (T) / Approximation.**
  *   **Day 1 Check:** The goal is *aggregate* pricing strategy, not *individual* prediction.
  *   **Day 2 Check (Sensitivity):** Does the aggregate elasticity hold even if individuals differ?
      *   *Analysis:* Often, heterogeneous agents aggregate to a representative agent *if* the distribution is stable.
      *   *Test:* Check if the "representative rate sensitivity" holds across different customer segments (e.g., retail vs. commercial).
      *   *Likely Result:* If the aggregate beta is stable, the assumption is a harmless simplification.
  *   **Verdict:** **FIT (with Monitoring).**
  *   **Reasoning:** This is a phenomenological model. It doesn't claim to describe *why* customers move, only *how much* moves on aggregate. As long as the aggregate relationship is stable, the micro-assumption is irrelevant.
  *   **Caveat:** Monitor for composition shifts (e.g., if retail leaves and only hot-money commercial remains, the "representative" agent changes).

  ---

  # Critique of the Procedure: Where It Fails

  You asked for the blind spots. Here is where this 3-day protocol will lie to you.

  ### 1. The "Equifinality" Blind Spot
  *   **The Problem:** Two completely different models (with different assumptions) can produce the same fit on historical data.
  *   **Where Protocol Fails:** Day 2 (Empirical Testing).
  *   **Risk:** You validate Model A because it fits. Model B (which is structurally truer) also fits. When the regime shifts, Model A breaks and Model B holds. Your procedure cannot distinguish them if the backtest window is narrow.
  *   **Least Reliable On:** **Model 1 (Prepayment).** Because you have no counterfactuals (you don't know what prepayments *would* have been if rates moved differently), sensitivity analysis is just guessing the shock size. You are calibrating your stress test to your own intuition, not data.

  ### 2. The "Endogenous Risk" Blind Spot
  *   **The Problem:** The model itself changes the behavior.
  *   **Where Protocol Fails:** Day 1 (Mechanism Check).
  *   **Risk:** If the Deposit Pricing Model (Model 3) is used to set rates, and competitors react to your rates, the "representative agent" assumption ignores strategic interaction (Game Theory).
  *   **Structural Limit:** The procedure assumes the environment is external. It cannot detect feedback loops where the model *becomes* the environment.

  ### 3. The "Missing Number" Failure Mode
  *   **The Problem:** Step 2.1 asks for a sensitivity number. Often, the model is a black box or too slow to run sensitivities.
  *   **What happens:** The developer says, "We can't run that scenario."
  *   **Protocol Breakdown:** If you cannot quantify the sensitivity, you cannot apply the Stop Condition.
  *   **Solution:** You must default to **NOT FIT** if sensitivity cannot be demonstrated. However, in a mid-size bank, political pressure will force you to accept "Qualitative Sensitivity."
  *   **🚩 Human Judgment Flag:** This is the biggest risk to *you*. If you accept a qualitative answer, you own the risk. Write in the report: *"Quantitative sensitivity was not provided; validation relies on developer assertion."*

  ### 4. The "False Tractability" Class
  *   **The Problem:** There is a class of false assumptions the procedure will wave through: **Distributional Tails.**
  *   **Why:** Most models assume Normal or Log-Normal distributions for tractability (Model 2).
  *   **Blind Spot:** Your sensitivity analysis (Day 2) usually perturbs *means* or *correlations*. It rarely perturbs the *distribution shape* (Kurtosis).
  *   **Result:** You will validate a model that handles "normal stress" but blows up on "black swans."
  *   **Fix:** Add a specific check: *"Does the model assume thin tails? If yes, is it used for Tail Risk (VaR/ES)?"* If Yes/Yes → **NOT FIT** without heavy overlay.

  # Summary Advice for the Committee
  When you present, do not argue about "truth." Argue about **stability**.

  *   **Don't say:** "Borrowers don't have perfect foresight."
  *   **Do say:** "Because the model assumes perfect foresight, it cannot distinguish between a 50bps rate drop and a 200bps rate drop in terms of speed. This creates unquantified duration risk."

  *   **Don't say:** "Correlations aren't zero."
  *   **Do say:** "The independence assumption removes the mechanism by which crises propagate. This model measures risk in peacetime, not war."

  *   **Don't say:** "Customers aren't identical."
  *   **Do say:** "This model aggregates behavior. It is valid only as long as the customer mix remains stable."

  This shifts the debate from *Philosophy* (Friedman vs. Reality) to *Risk Management* (Stability vs. Fragility), which is language the Committee and Auditors understand.
