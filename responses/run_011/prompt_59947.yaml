      *   **Section 2: The Delayed-Neutron Analogy (Bottlenecks).**
          *   *The Match:* Yes, physical constraints (fabs, energy) act like delayed neutron precursors. They decay (deliver) on a slow timescale. If AI needs new chips to improve, it's delayed critical.
          *   *The Break:* In a reactor, the delayed neutrons are a *fixed physical constant* ($\beta \approx 0.0065$). In AI, the "delayed fraction" is *optimizable*.
          *   *Crucial Difference:* An AI can rewrite code to need less compute, or distill knowledge to need less data. It can change $\beta$. A reactor cannot change the decay constant of Iodine-135.
          *   *Human Review:* This is the biggest "delayed neutron." If the AI needs human approval, it's slow. If it can self-deploy (digital only), the "delayed fraction" drops to near zero.
