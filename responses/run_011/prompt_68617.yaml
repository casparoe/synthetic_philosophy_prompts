answer: |-
  **1. Exam Question**

  **Graduate Seminar: Causal Explanation in the Human Sciences**
  **Final Examination**
  **Time Limit:** 75 Minutes
  **Materials:** Closed book. No notes or texts permitted.

  **Question:**

  Consider the following causal claim regarding mass participation in atrocities: *If agents are free to refuse an order without formal punishment, and yet they comply, their action must be explained by a stable internal disposition rather than situational pressure.*

  This claim relies on inferring the absence of coercion from the absence of *formal* sanction. Critically evaluate this inference. In your analysis, you must distinguish between formal penalties and the informal costs of non-conformity (e.g., social ostracization, self-marking before peers). Furthermore, assess the explanatory power of dispositional versus situational accounts using the following logical constraint: a cause posited as uniform across a population cannot explain variation within that population.

  To test this, consider this **stipulated vignette**: *Archival data reveals three comparable police battalions from the same region and age cohort. All received identical ideological framing and orders. Formal opt-out policies were identical. Yet, opt-out rates varied widely: 2% in Battalion A, 15% in Battalion B, and 40% in Battalion C. The variation tracks neither pre-war political affiliation nor the antisemitic intensity of the orders, but correlates strictly with the number of killings each unit had carried out in the preceding months (A: high, B: medium, C: low).*

  Does this vignette settle the dispute between dispositional and situational explanations? Identify the ambiguity inherent in correlating prior killing with current compliance (e.g., brutalization versus selection drift). Finally, determine whether these explanations are genuine rivals or complementary accounts pitched at different levels. To do this, locate the precise point of conflict where both accounts claim exclusivity over the same causal work, and discuss whether the variables involved (e.g., "degree of antisemitism," "level of pressure") are well-defined enough to support the counterfactual interventions required for causal identification.

  ***

  **2. Model Answer**

  The inference that absent formal sanction implies absent coercion is a category error regarding the mechanics of social pressure. The dispositional account treats the opt-out opportunity as a clean experimental control, assuming the only cost to refusal is institutional punishment. This ignores the informal economy of group dynamics. When an opt-out is declared publicly in formation, refusing is not a private exit but a public performance of dissent. The cost is not imprisonment, but the severing of solidarity with comrades whose labor one refuses to share. The situational account does not require a threat of punishment to function; it requires a structure where authority absorbs responsibility and conformity is the path of least resistance. Therefore, the absence of formal sanction does not eliminate coercion; it merely shifts the mechanism from legal threat to social bond.

  However, correcting this inference is only defensive. To evaluate the explanatory rivalry, we must apply the constraint that a constant cannot explain a variable. The dispositional account posits "eliminationist antisemitism" as a pervasive cultural constant across the relevant population. If this disposition is uniform, it cannot explain why some men stepped out while others stayed, nor why participation fluctuated across time or units. A uniform cause yields a uniform effect. To explain variation, the dispositionalist must secretly introduce variation in the disposition itself, undermining the claim of cultural pervasiveness.

  The converse problem limits the situational account. While social pressure explains why men comply once embedded in a killing structure, it struggles to explain why *this* specific structure emerged to demand killing rather than other tasks. A general theory of obedience explains compliance with orders, but not the content of the orders themselves. Thus, both accounts face a symmetry of failure: the dispositionalist cannot explain internal variation, and the situationalist cannot explain external specificity.

  The stipulated vignette appears to favor the situational account by showing compliance tracking with prior killing experience rather than ideological framing. If antisemitism were the driver, battalions with identical ideological exposure should behave identically. They do not. However, this correlation introduces a new ambiguity: does prior killing cause compliance (brutalization/habituation), or does compliance cause the composition of the unit (selection drift)? If the reluctant self-select out over time into other duties, the remaining unit appears more willing not because they changed, but because the reluctant left. The vignette correlates behavior with history, but without individual-level tracking, we cannot distinguish between a change in the men and a change in the menu of men.

  This ambiguity highlights the interventionist problem. To claim causation, we must be able to manipulate the variable. But are "degree of antisemitism" or "level of group pressure" well-defined enough to be manipulated? In a settled past, we rely on counterfactuals. The dispositionalist claims that had the culture been different, the killing would not have happened. The situationalist claims that had the unit structure been different, the killing would not have happened. These are not complementary levels; they are rivals because both claim to be the *primary* difference-maker. They are complementary only if one explains the supply of killers and the other explains the demand, but both books claim to explain the act of killing itself.

  Ultimately, the dispute is a rivalry over the locus of the counterfactual dependence. The dispositionalist argues the killing depends on the men's will; the situationalist argues it depends on the structure of the situation. The vignette suggests the structure of the situation (prior killing) matters, but until the brutalization versus selection ambiguity is resolved, the variable remains ill-defined. A robust explanation must treat the disposition not as a static constant, but as a variable susceptible to situational modulation, acknowledging that the "will" to kill is often a product of the killing itself.

  ***

  **3. Marking Scheme (25 Marks Total)**

  **1. Formal vs. Informal Sanction (5 Marks)**
  *   **5 marks:** Explicitly identifies that Goldhagen conflates "no formal punishment" with "no cost." Explains that situational pressure operates via social bonds, public self-marking, and peer labor-sharing, not just legal threats.
  *   **3 marks:** Identifies the conflation but offers only a vague description of social pressure (e.g., "peer pressure") without explaining the mechanism (public vs. private opt-out).
  *   **0 marks:** Fails to distinguish between formal and informal sanctions; accepts the premise that no punishment equals free choice.

  **2. The Constant/Variable Logical Constraint (5 Marks)**
  *   **5 marks:** Clearly articulates that a cause posited as uniform (cultural antisemitism) cannot logically explain variation (opt-outs) without contradicting itself.
  *   **3 marks:** Mentions that dispositions vary but fails to frame it as a logical constraint on explanation (constant vs. variable).
  *   **0 marks:** Ignores the logical constraint; argues solely based on historical plausibility.

  **3. The Converse Problem (Situational Specificity) (5 Marks)**
  *   **5 marks:** Identifies that situational accounts explain compliance but struggle to explain why the specific regime/orders existed (the content of the command).
  *   **3 marks:** Notes situational accounts have limits but does not specify the problem of regime specificity.
  *   **0 marks:** Treats the situational account as fully sufficient without critique.

  **4. Vignette Analysis (Brutalization vs. Selection) (5 Marks)**
  *   **5 marks:** Correctly identifies that the vignette correlates killing with compliance but highlights the ambiguity: did killing change the men (brutalization) or did the men change the unit (selection drift)?
  *   **3 marks:** Uses the vignette to support one side but fails to identify the ambiguity inherent in the correlation.
  *   **0 marks:** Ignores the vignette or treats it as definitive proof for one side without qualification.

  **5. Rivalry vs. Complementarity & Interventionism (5 Marks)**
  *   **5 marks:** Locates the precise conflict (both claim to be the primary difference-maker for the *act* of killing) and discusses the manipulability/definition of variables for counterfactuals.
  *   **3 marks:** Claims they are rivals or complementary but fails to justify why using interventionist criteria or counterfactual dependence.
  *   **0 marks:** Dismisses the dispute as merely "different levels" without analyzing the overlap in causal claims.

  ***

  **4. Characteristic Errors**

  *   **The "Different Levels" Dismissal (-5 Marks):** Asserting that the dispute is resolved because one book is about psychology and the other about sociology. This looks like insight but fails to address that both claim to explain the *same* outcome (the shooting) via exclusive primary causes.
  *   **Narrating the Controversy (-5 Marks):** Spending word count on the history of the debate (e.g., "Goldhagen reviewed Browning in 1992...") rather than analyzing the causal logic.
  *   **Fact Recall Dependency (-5 Marks):** Attempting to argue based on remembered numbers (e.g., "Actually 12 men stepped out, not 10") rather than the logical structure of the argument.
  *   **Citation Violation (-5 Marks):** Including bibliographic references or citations despite explicit instructions forbidding them.
  *   **Vignette Determinism (-3 Marks):** Treating the stipulated vignette as empirical fact that settles the debate, rather than a theoretical tool containing an ambiguity that must be named.

  ***

  **5. Closing Notes on Grading**

  What separates an A from a B is the handling of the logical constraint regarding constants and variables. Most students will correctly identify the social pressure mechanism (the defensive move), but only A-level work will demonstrate that a uniform disposition is logically incapable of explaining variation within the unit without self-contradiction. The B answer corrects Goldhagen's facts; the A answer corrects his causal logic.
