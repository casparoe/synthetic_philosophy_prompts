      *   How about **"Bayesian Bloating"**?
      *   Okay, the most accurate description is a violation of **Predictive Risk**. A scientific hypothesis must risk being wrong. If you adjust the hypothesis so that *every* outcome (specifically null ones) confirms it, you are removing risk.
      *   The LHC case *retains risk* (if we find it, you're right; if we don't, you're wrong *in that range*).
