      *   Better: **"The Null-Result Ratchet."** A ratchet allows motion in one direction. Here, every null result ratchets the confidence up, but nothing ratchets it down.
      *   Even better: **"Epistemic Hollowing."** The core claim gets stronger, but the content gets emptier.
      *   Let's look for existing terms. **"Self-Sealing Hypothesis"** is the standard term. But the user says "I can't find a word for it." So I should acknowledge "Self-Sealing" but explain why it feels different (the *accumulation* of strength).
