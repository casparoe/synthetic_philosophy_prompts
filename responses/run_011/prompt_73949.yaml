answer: |-
  You are not being pedantic. You have identified a specific structural pathology in how Bayesian updating is being applied rhetorically. Your intuition that the LHC case and the Fermi case have the "same surface structure, opposite behaviour underneath" is exactly right.

  There isn't a single standard word for this specific *directional* asymmetry, but it is a recognized failure mode in the philosophy of science. The closest established framework is **Imre Lakatos's concept of a "Degenerating Research Programme,"** specifically the tactic of **"Protective Belt Adjustment" without "Heuristic Power."**

  However, Lakatos's terminology is clunky for forum arguments, and it doesn't quite capture the specific phenomenon you're seeing: a hypothesis that gains *confidence* from null results while losing *predictive risk*.

  Since you asked for the idea to be carved out properly, I will give you the established neighbors, explain why they miss the mark, and then coin the term that fits the shape you're describing.

  ### The Neighbors (And Why They Don't Fit)

  **1. Ad Hoc Hypotheses**
  *   **What it is:** Adding a new assumption solely to save a theory from falsification (e.g., "The planet isn't there because it's invisible").
  *   **Why it's close:** The Fermi arguers are adding assumptions ("They use lasers," "They hide").
  *   **Why it misses:** As you noted, these aren't obviously fake. Lasers *are* more efficient than radio. The individual steps are plausible. "Ad hoc" implies a desperate, clumsy save. Your frustration is that the saves are *reasonable*, yet the *cumulative effect* is suspicious. It's not the quality of the excuse; it's the direction of the confidence update.

  **2. Unfalsifiability**
  *   **What it is:** A claim that cannot be proven wrong (e.g., "There is an invisible dragon in my garage").
  *   **Why it's close:** The claim seems impossible to dent.
  *   **Why it misses:** The claim *is* technically falsifiable. If we found a Dyson sphere, the "Rare Earth" claim would die. The problem isn't that it *can't* be falsified; it's that every failed attempt to falsify it makes the claim *stronger* rather than just *surviving*. Unfalsifiability is a shield; what you're seeing is a sponge that absorbs water and gets heavier.

  **3. The Raven Paradox (Hempel)**
  *   **What it is:** Logical equivalence where observing a green apple confirms "All ravens are black."
  *   **Why it's close:** It deals with how null/negative data counts as confirmation.
  *   **Why it misses:** This is about logical equivalence classes, not about the *magnitude* of the claim shifting. The Raven Paradox doesn't explain why the estimate of *how rare* life is gets more extreme.

  ### The Concept: The Null-Result Ratchet

  I propose we call this **The Null-Result Ratchet**.

  **Definition:** A Null-Result Ratchet occurs when a hypothesis is updated in response to null results (failures to detect) such that:
  1.  **Confidence Increases:** The posterior probability of the hypothesis goes up.
  2.  **Predictive Risk Decreases:** The hypothesis is modified to expect *fewer* detectable signals in the future.
  3.  **Asymmetry:** There is no corresponding mechanism where a result could lower confidence without also lowering risk.

  In a healthy scientific process, a null result should either **kill** the hypothesis or **constrain** it (make it more specific/risky). In a Ratchet, the null result **entrenches** it (makes it more certain/robust) while **hollowing** it out (making it predict less).

  ### The Mechanism: Trading Risk for Confidence

  Here is the precise carve-out of the difference between the LHC case and the Fermi case.

  **The LHC Case: Parameter Constriction**
  *   **Hypothesis:** "A particle exists between 100–200 GeV."
  *   **Null Result:** "No particle at 100–150 GeV."
  *   **Update:** "A particle exists between 150–200 GeV."
  *   **Risk:** **Increased.** The hypothesis is now cornered. It has less room to hide. The next search is *more* likely to kill it.
  *   **Confidence:** Stays flat or drops (because the viable space is shrinking).
  *   **Verdict:** This is **Healthy Science.** You are paying for survival with territory.

  **The Fermi Case: Expectation Suppression**
  *   **Hypothesis:** "Civilizations are common."
  *   **Null Result:** "No radio signals."
  *   **Update:** "Civilizations are common, but they use lasers."
  *   **Risk:** **Decreased.** Lasers are harder to detect than radio. The hypothesis is now *less* likely to be killed by the next search.
  *   **Confidence:** **Increases.** The arguer claims, "See? We ruled out radio, so they must be rare/stealthy."
  *   **Verdict:** This is the **Ratchet.** You are paying for confidence with predictive power. You are buying certainty by making the universe quieter.

  ### Boundary Conditions

  You asked where to draw the line. Here is the test for the three cases you mentioned.

  **1. The LHC Particle Search**
  *   **Verdict:** **Not a Ratchet.**
  *   **Why:** The null result shrinks the parameter space. The hypothesis becomes *more vulnerable* to future tests, not less. If they keep finding nothing, the hypothesis eventually has nowhere left to exist. It updates by shrinking, as you noted.

  **2. The Plane Wreck ("It must be in very deep water")**
  *   **Verdict:** **Ratchet (Conditional).**
  *   **Why:**
      *   *Valid:* "We searched the shallow shelf and found nothing. Probability mass shifts to the deep trench." (This is Parameter Constriction).
      *   *Ratchet:* "We searched the shallow shelf and found nothing. This confirms the plane has a 'cloaking device' that works in shallow water, so we are now *more confident* it exists, and we expect it to be invisible in the deep trench too."
      *   *The Line:* If "deep water" just means "harder to search," it's a Ratchet if the claimant uses the difficulty as proof of the wreck's *existence* rather than just a location update. If the claim becomes "It *must* be there because we can't see it," that's the Ratchet engaging.

  **3. The Doctor ("No new symptoms is exactly what we expect")**
  *   **Verdict:** **Valid (Usually).**
  *   **Why:** Medical models usually have fixed timelines. If a disease is known to be asymptomatic for 5 years, observing 1 year of no symptoms is valid confirmation of the *model*, not just the disease.
  *   **The Ratchet Trap:** It becomes a Ratchet if the doctor says, "No symptoms? That proves it's a *very slow* version of the disease," and then later, "Still no symptoms? That proves it's an *invisible* version," and their confidence that you *have* the disease goes up every time you test negative. If the lack of symptoms increases the certainty of the diagnosis without a fixed biological model, it's a Ratchet.

  ### How to Use This

  You don't need to accuse people of lying. You need to point out the **trade-off**.

  When someone says, "The lack of radio signals proves they are rare/stealthy," you ask:
  > "Okay, you've updated your confidence up because we didn't find radio. But did you update your **predictive risk** down? If we don't find lasers next, will you be *less* sure they exist, or will you just move to neutrinos?"

  If the answer is "We'll move to neutrinos and be even sure," you have caught them in a **Null-Result Ratchet**.

  **The Diagnostic Rule:**
  A hypothesis is being ratcheted if **null results increase the claimant's confidence while decreasing the hypothesis's vulnerability to future null results.**

  In the LHC case, null results decrease vulnerability (by shrinking space) but *increase* vulnerability (by cornering the theory). Wait, let me be precise: In the LHC case, null results make the *remaining* hypothesis more vulnerable to the *next* test. In the Fermi Ratchet, null results make the *modified* hypothesis *less* vulnerable to the *next* test.

  *   **LHC:** "We didn't find it here, so it must be there. It will be easier to prove us wrong next time."
  *   **Fermi Ratchet:** "We didn't find it here, so it must be hiding better. It will be harder to prove us wrong next time."

  That is the boundary. If the silence makes the thing harder to find next time, but makes the arguer more sure it's there, you are watching a Null-Result Ratchet.
