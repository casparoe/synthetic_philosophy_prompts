prompt: |-
  I hold a version of the epistemic case for large-scale democracy that runs through the Condorcet jury theorem: on questions that have a right answer independently of how they are decided, a large body of individually fallible voters is more likely to be right than any of its members, and more likely than a small committee of specialists, with the advantage compounding as the body grows. I intend to use this to argue, in a seminar on institutional design, for replacing a standing expert committee with a large randomly selected citizen body. Before I commit that argument to paper, I want a rigorous map of what would count against the position.

  Give me that map, ranked from fatal to merely awkward. In building it, address at least the following.

  First, which of the theorem's assumptions my use of it silently depends on — independence, competence above one-half, sincere voting, a binary choice, a shared question — and, for each, what the world would have to look like for the assumption to fail in a way that destroys the conclusion rather than merely weakening it. On independence, work through the design-effect calculation: with average pairwise correlation ρ among votes, the effective sample size is roughly n / (1 + (n − 1)ρ), so any correlation bounded away from zero sets a ceiling on reliability that no additional membership can lift. How large must ρ be for that ceiling to bind in practice, and do party discipline, common media environments, or deliberation itself plausibly supply it? On competence, note the inversion: below one-half accuracy, larger groups become more confidently wrong, not less. Is there any procedure-independent way of estimating competence on a live political question that does not beg the question by reading it off the outcomes the theorem is meant to explain?

  Second, whether the position can be attacked without attacking the premises — cases in which the assumptions are granted and the conclusion still fails to support what I want. I have in mind the theorem's indifference to how errors are distributed and what they cost, so that a procedure right most of the time with catastrophic exceptions may lose to one right less often with bounded ones; and the many-alternatives case, since my proposal concerns bodies choosing among policies rather than answering yes or no. On the latter, I have seen it claimed that under plurality rule with m options, if each voter chooses correctly with probability p and spreads the remainder evenly across the wrong options, the correct option wins with probability tending to one whenever p exceeds 1/m, so that the threshold falls rather than rises as options multiply. Check that claim, and tell me whether it helps or hurts me once I drop the assumption that errors scatter evenly. Where do cyclical majorities and agenda control enter?

  Third, whether the theorem cuts against something else I want. Discussion correlates votes, so a consistent defender seems pushed toward unstructured aggregation and away from the deliberation that ordinarily makes citizen bodies attractive. Say what has to be given up, and whether the loss is survivable.

  Fourth, an honest assessment of insulation. Is competence above one-half ever independently established here, or is epistemic democracy self-confirming? Has the view been qualified — ideal conditions, idealized voters, the theorem as model rather than prediction — to the point where nothing could count against it? If so, is that a genuine defect in a thesis of this kind, or is it doing ordinary work?

  Throughout, distinguish what a committed defender of the view would concede as counting against it from what they would dismiss as a misreading, and say whether each dismissal is actually available or whether it quietly surrenders the conclusion. Tell me also what my position predicts that its rivals do not: a discriminating signature, for instance, in whether aggregate public opinion turns out stable and unbiased or stable and systematically skewed, or in how accuracy scales with group size under controlled conditions.

  One note on what would move me: not another objection to independence, which I already take seriously. What would move me is an argument that the theorem, with every assumption granted, still does not license the institutional conclusion — or a demonstration that it licenses that conclusion only under further conditions I have not stated. Reasoning and verdicts, please, not references.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User's Position:** Epistemic defense of large-scale democracy (specifically, replacing a standing expert committee with a large randomly selected citizen body) based on the Condorcet Jury Theorem (CJT).
      *   **Goal:** A rigorous map of counter-arguments/objections, ranked from fatal to merely awkward.
      *   **Specific Requirements:**
          1.  Analyze CJT assumptions (independence, competence > 0.5, sincere voting, binary choice, shared question). Focus heavily on the design-effect calculation for independence ($\rho$) and the inversion problem for competence (< 0.5). Address procedure-independent estimation of competence.
          2.  Attack the link between premises and conclusion (even if CJT holds, does it support the institutional change?). Address error costs (asymmetry), many-alternatives cases (check the $p > 1/m$ claim), cyclical majorities, and agenda control.
          3.  Address the tension between CJT and deliberation (deliberation induces correlation).
          4.  Assess insulation/falsifiability (is competence > 0.5 self-confirming? Is the theory too idealized?).
          5.  Distinguish between concessions a defender would make vs. dismissals (and whether those dismissals are valid).
          6.  Identify discriminating predictions (what does this view predict that rivals don't?).
          7.  **Constraint:** "Reasoning and verdicts, please, not references." (No academic citations, just arguments).
          8.  **Constraint:** "What would move me... an argument that the theorem, with every assumption granted, still does not license the institutional conclusion."

  2.  **Deconstruct the Core Argument:**
      *   *Premise:* CJT says large groups of slightly competent independent voters beat experts/small groups on binary truth-tracking tasks.
      *   *Conclusion:* Replace expert committee with large random citizen body (sortition).
      *   *Gap:* Political decisions aren't binary truth-tracking tasks in a vacuum. They involve values, complex policies, asymmetric risks, and require deliberation.

  3.  **Drafting the Map - Section by Section:**

      *   **Section 1: The Assumptions (The Internal Critique)**
          *   *Independence:* The design effect formula $n_{eff} \approx n / (1 + (n-1)\rho)$ is crucial. If $\rho > 0$, $n_{eff}$ caps out.
              *   *Calculation:* If $\rho = 0.1$, max $n_{eff} = 10$. If $\rho = 0.01$, max $n_{eff} = 100$.
              *   *Reality:* Media, parties, culture create $\rho$. Even small $\rho$ kills the "infinity" benefit of large $n$.
              *   *Verdict:* Fatal if $\rho$ is structurally inherent to mass politics.
          *   *Competence ($p > 0.5$):* The "Inversion Problem." If $p < 0.5$, bigger groups are *worse*.
              *   *Measurement:* How do we know $p > 0.5$ without knowing the truth? If we know the truth, we don't need voting. If we use "expert consensus" as truth, we undermine the anti-expert conclusion.
              *   *Verdict:* Fatal if $p$ cannot be established independently of the outcome.
          *   *Binary/Sincere:* Politics is multidimensional. Sincere voting is rare (strategic voting).
              *   *Verdict:* Awkward but manageable with modifications, unless strategic voting creates cycles.

      *   **Section 2: From Theorem to Institution (The External Critique)**
          *   *Error Costs:* CJT maximizes *probability* of being right. It ignores *magnitude* of error.
              *   *Example:* Experts might be right 60% of the time with small errors. Crowd might be right 70% of the time but occasionally causes catastrophe (e.g., hyperinflation, war).
              *   *Verdict:* Fatal for high-stakes/low-probability catastrophic risks.
          *   *Many Alternatives:* The $p > 1/m$ claim.
              *   *Analysis:* If voters spread errors evenly, yes, $p > 1/m$ works. But errors *cluster* on popular wrong answers (demagoguery). If errors correlate, the benefit vanishes.
              *   *Agenda Control:* Who sets the $m$ options? If an agenda setter excludes the "true" option, CJT is irrelevant.
              *   *Verdict:* Fatal if agenda control is endogenous to the power structure.
          *   *Cycles:* Multidimensional preferences lead to instability (McKelvey's Chaos Theorem).
              *   *Verdict:* Fatal for stability, though maybe not for "truth" if a truth exists (but usually political "truth" is preference aggregation).

      *   **Section 3: Deliberation vs. Independence (The Tension)**
          *   *Conflict:* CJT requires independence. Deliberation creates correlation ($\rho$).
          *   *Trade-off:* Deliberation might raise $p$ (competence) but raises $\rho$ (correlation).
          *   *Math:* Does the gain in $p$ outweigh the loss in $n_{eff}$?
          *   *Verdict:* Awkward. Requires a specific empirical claim that deliberation boosts $p$ enough to offset $\rho$. If not, the defender must oppose deliberation, which undermines the "citizen body" appeal.

      *   **Section 4: Insulation and Falsifiability (The Meta-Critique)**
          *   *Self-Confirmation:* Claiming $p > 0.5$ because "democracy works" is circular.
          *   *Idealization:* If the theory only works under "ideal conditions," is it a guide for design or a utopian benchmark?
          *   *Verdict:* Merely awkward if treated as a model; Fatal if treated as a direct blueprint without empirical validation of $p$ and $\rho$.

      *   **Section 5: Discriminating Predictions**
          *   *Signature:* Stability of opinion vs. group size. If CJT holds, larger groups should converge on specific answers more than small ones, *unless* $\rho$ dominates.
          *   *Rival Prediction:* Elitists predict small groups are more consistent/less volatile. Populists predict large groups are more moral. CJT predicts large groups are more *accurate* (if truth is definable).

  4.  **Refining the Argument (Self-Correction/Polishing):**
      *   *Tone:* Rigorous, philosophical, analytical. No fluff.
      *   *Focus:* Ensure the "Fatal vs. Awkward" ranking is clear.
      *   *Specific Constraint Check:* The user wants to know if the theorem *licenses the conclusion* even if assumptions hold.
      *   *Key Insight:* The biggest gap is "Truth." CJT tracks *truth*. Politics often resolves *conflicts of interest* or *values*, where there is no independent truth. If there is no truth, CJT is category error. This is a "Fatal" objection to the *application*, even if the *math* is sound.
      *   *Key Insight 2:* The "Expert" comparison. CJT compares Group vs. Individual. The user wants Group vs. *Expert Committee*. An expert committee is not a single voter with $p_{expert}$. It's a small group. Does the large citizen group beat a *small expert group*? Only if citizen $p$ is not too low and $\rho$ is low. Experts likely have higher $p$ and lower $\rho$ (professional independence). This needs highlighting.

  5.  **Finalizing the Structure:**
      *   **Introduction:** Acknowledge the ambition and the gap between math and institutions.
      *   **I. The Internal Collapse (Assumptions):** Independence ($\rho$), Competence ($p$), Binary/Truth.
      *   **II. The Institutional Gap (Even if Math Holds):** Error Costs, Multidimensionality/Agenda, The "Expert Committee" Comparison.
      *   **III. The Deliberative Paradox:** Correlation vs. Competence.
      *   **IV. Epistemic Insulation:** Falsifiability and Circularity.
      *   **V. Discriminating Signatures:** What to look for.
      *   **Conclusion:** Summary verdict.

  6.  **Writing the Content (incorporating specific calculations requested):**
      *   *Design Effect:* Explicitly use $n / (1 + (n-1)\rho)$. Show that for $n=1000$, $\rho=0.05$ kills the advantage.
      *   *Competence:* Emphasize the impossibility of verifying $p > 0.5$ ex-ante on political questions.
      *   *Many Options:* Debunk the $p > 1/m$ optimism by noting error clustering.
      *   *Deliberation:* Frame it as an optimization problem ($\Delta p$ vs $\Delta \rho$).

  7.  **Review against constraints:**
      *   "Reasoning and verdicts, please, not references." -> Check.
      *   "Ranked from fatal to merely awkward." -> Check.
      *   "What would move me... argument that theorem... does not license institutional conclusion." -> Ensure Section II is strong on this.

  8.  **Final Polish:** Ensure the distinction between "defender's concession" and "defender's dismissal" is clear in each section. (e.g., Defender admits $\rho$ exists but claims it's low enough; Critic says it's structurally high).

  *(Self-Correction during drafting)*: I need to make sure I don't just say "Politics isn't truth." I need to explain *why* that breaks the CJT application specifically. If there's no truth, there's no "correct answer" to converge on, so "accuracy" is undefined. That is a category error, which is Fatal.

  Also, need to address the "Expert Committee" comparison specifically. CJT usually compares Group vs. Individual. A committee is a small group. The variance of a small group of experts might be lower than a large group of laypeople even if mean accuracy is similar, due to $\rho$ differences.

