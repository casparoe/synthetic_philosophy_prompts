answer: |-
  This map ranks objections from **Fatal** (the argument collapses or implies the opposite of your intent) to **Awkward** (the argument holds but requires unattractive concessions or empirical bets).

  ### I. The Internal Collapse: Assumptions and the World
  *These objections target the mathematical premises. If these fail, the theorem does not apply.*

  **1. The Competence Inversion (Fatal)**
  *   **The Assumption:** Individual competence $p > 0.5$.
  *   **The Failure:** If the average voter is systematically biased or misinformed such that $p < 0.5$, the theorem inverts: as $n \to \infty$, the probability of the majority choosing the *wrong* option tends to 1. A large citizen body becomes a machine for producing confident error.
  *   **The Measurement Problem:** You cannot verify $p > 0.5$ on live political questions without knowing the truth. If you know the truth, you do not need the vote. If you use "expert consensus" as the proxy for truth to establish $p$, you undermine the institutional conclusion (replacing experts). If you use "past democratic outcomes" as the proxy, the argument is circular (democracy works because democracy worked).
  *   **Defender's Move:** Claim $p > 0.5$ is a "reasonable presumption" based on local knowledge or common sense.
  *   **Verdict:** **Fatal.** Without an independent, procedure-neutral metric for competence on the specific class of questions the body will decide, the epistemic warrant is empty. If the questions are technical (e.g., monetary supply, epidemiological modeling), the presumption that random citizens exceed 0.5 competence is empirically fragile. If you concede competence is issue-dependent, you must limit the citizen body's jurisdiction, weakening the proposal to replace a standing committee.

  **2. The Correlation Ceiling (Fatal)**
  *   **The Assumption:** Statistical independence of votes.
  *   **The Failure:** You correctly cite the design effect: $n_{eff} \approx n / (1 + (n-1)\rho)$.
      *   If $n = 1,000$ and $\rho = 0.01$ (1% correlation), $n_{eff} \approx 91$.
      *   If $n = 1,000$ and $\rho = 0.05$ (5% correlation), $n_{eff} \approx 20$.
      *   If $n = 1,000$ and $\rho = 0.10$ (10% correlation), $n_{eff} \approx 10$.
  *   **The Reality:** Modern information environments (national media, party platforms, algorithmic feeds) induce $\rho$ significantly bounded away from zero. Voters do not flip coins; they react to common signals. If $\rho$ is structurally determined by the communication environment, increasing $n$ yields diminishing returns that cap out almost immediately. A body of 1,000 correlated voters is epistemically equivalent to a committee of 20.
  *   **Defender's Move:** Argue that random selection breaks *social* correlation, or that deliberation averages out idiosyncratic errors.
  *   **Verdict:** **Fatal.** Random selection breaks *selection bias*, not *informational correlation*. If the 1,000 citizens consume the same news ecosystem, $\rho$ remains high. To lower $\rho$, you must isolate voters, which is incompatible with a democratic seminar or deliberative body. If you accept high $\rho$, the "large-scale" advantage vanishes, and you lose the efficiency argument against a small committee.

  **3. The Category Error: Truth vs. Preference (Fatal)**
  *   **The Assumption:** There is a "right answer" independent of the decision.
  *   **The Failure:** CJT tracks *truth*. Politics often resolves *conflicts of value* or *distribution*. There is no mind-independent fact of the matter on "should we prioritize equity over growth?" or "what is the just tax rate?"
  *   **Verdict:** **Fatal.** If the questions before the body are matters of preference aggregation rather than truth-tracking, CJT is mathematically inapplicable. You cannot maximize the probability of choosing the "correct" preference. If you redefine "correct" as "what satisfies the most people," you are no longer using CJT; you are using a welfare argument, which is vulnerable to tyranny-of-the-majority objections that CJT was meant to bypass.

  ---

  ### II. The Institutional Gap: Even If the Math Holds
  *These objections grant the theorem's assumptions but deny that it licenses your specific institutional conclusion (replacing experts with citizens).*

  **4. Asymmetric Error Costs (Fatal)**
  *   **The Argument:** CJT maximizes the *frequency* of correct decisions. It is indifferent to the *magnitude* of errors.
  *   **The Scenario:**
      *   **Expert Committee:** Right 60% of the time. Errors are bounded (technocratic adjustments).
      *   **Citizen Body:** Right 70% of the time (per CJT). Errors are catastrophic (e.g., voting for default, war, or hyperinflation due to populist surge).
  *   **The Calculation:** Expected Utility = $\sum P(outcome) \times Cost(outcome)$. A procedure with lower accuracy can have higher expected utility if its error distribution has thinner tails.
  *   **Verdict:** **Fatal.** Institutional design is often about risk management, not accuracy maximization. If the citizen body has a "fat tail" of catastrophic error (even if rare), the CJT advantage in mean accuracy is irrelevant. This is particularly potent against replacing *specialist* committees (e.g., central banks, bioethics) where the cost of ignorance is existential.

  **5. The Many-Alternatives Problem (Fatal)**
  *   **The Argument:** You noted the claim that for $m$ options, accuracy holds if $p > 1/m$.
  *   **The Analysis:** This claim relies on the assumption that error is *uniformly distributed* among the $m-1$ wrong options. In politics, error *clusters*. Demagoguery, salience bias, and framing effects cause voters to flock to specific *wrong* options.
      *   If voters have $p=0.4$ for the truth, but $0.6$ probability of choosing *one specific* wrong option (due to a charismatic leader), the wrong option wins with probability 0.6.
      *   CJT requires errors to be random noise. Political errors are systematic signal.
  *   **Agenda Control:** CJT assumes the "true" option is on the ballot. If a small elite controls the agenda (which options are voted on), they can exclude the truth. A large voting body cannot recover an option it is not offered.
  *   **Verdict:** **Fatal.** The uniform error assumption is empirically false in political contexts. Combined with endogenous agenda control (which your citizen body likely does not possess if it is merely a legislative chamber), the theorem provides no guarantee that the "best" policy wins, even if $p > 1/m$.

  **6. The Expert Committee Comparison (Awkward to Fatal)**
  *   **The Argument:** CJT proves Large Group > Single Individual. You argue Large Citizen Group > Small Expert Committee.
  *   **The Gap:** A committee of 10 experts is not a single individual. It is a small group.
      *   Experts likely have higher $p$ (e.g., 0.8 vs 0.55).
      *   Experts likely have lower $\rho$ (professional norms of independence vs. mass media correlation).
  *   **The Math:** A small group with high $p$ and low $\rho$ can easily outperform a large group with low $p$ and high $\rho$.
      *   Example: 10 experts ($p=0.8, \rho=0.01$) vs 1000 citizens ($p=0.55, \rho=0.05$).
      *   The expert group's effective size is high relative to its actual size; the citizen group's effective size is capped near 20. The experts' competence advantage compounds.
  *   **Verdict:** **Fatal.** You are not comparing citizens to a dictator; you are comparing them to a *committee*. The CJT advantage of scale is neutralized if the small group has sufficiently higher competence and lower correlation. To win this, you must prove citizen $\rho$ is lower than expert $\rho$ (unlikely given media environments) or that citizen $p$ is close enough to expert $p$ that scale matters (unlikely on technical issues).

  ---

  ### III. The Deliberative Paradox
  *This objection targets the tension between the mechanism of the theorem and the attractiveness of the institution.*

  **7. Deliberation vs. Independence (Awkward)**
  *   **The Tension:** You want a citizen body because deliberation improves decisions (raises $p$). But CJT requires independence (low $\rho$). Deliberation inherently creates correlation (participants hear the same arguments and shift together).
  *   **The Trade-off:** Deliberation is an optimization problem: Does the gain in $p$ outweigh the loss in $n_{eff}$ due to rising $\rho$?
      *   If deliberation moves everyone to the same view (consensus), $\rho \to 1$, and $n_{eff} \to 1$. You have a group of 1,000 acting as one person.
      *   If that one person is right ($p > 0.5$), you gain nothing from the group size.
      *   If that one person is wrong ($p < 0.5$), you have guaranteed error.
  *   **Defender's Move:** Argue for "structured deliberation" that raises $p$ without inducing $\rho$ (e.g., small breakout groups before voting).
  *   **Verdict:** **Awkward.** This is an empirical bet, not a theoretical guarantee. A consistent CJT defender should logically prefer *secret, isolated voting* without discussion. If you advocate for deliberation, you are relying on a different justification (legitimacy, refinement) that potentially undermines the epistemic math. You must concede that the "epistemic" argument requires suppressing the very social interaction that makes citizen bodies politically attractive.

  ---

  ### IV. Insulation and Falsifiability
  *This assesses whether the theory is robust or vacuous.*

  **8. Self-Confirmation and Idealization (Awkward)**
  *   **The Issue:** If proponents respond to every failure of democracy by saying "conditions weren't ideal ($\rho$ was too high, $p$ was too low)," the theory becomes unfalsifiable.
  *   **The Risk:** If the theorem only applies under conditions that never exist (zero correlation, known truth, $p > 0.5$), it is a model, not a design guide.
  *   **Verdict:** **Merely Awkward.** All models idealize. The defect becomes fatal only if you claim the model *predicts* real-world performance without calibration. To avoid this, you must specify *measurable thresholds* (e.g., "If media concentration exceeds X, CJT does not apply").
  *   **Defender's Dismissal:** "The theorem shows the *potential* of democracy, not the actual."
  *   **Counter:** Institutional design is about actuality. If the potential is unreachable due to structural $\rho$, the potential is irrelevant.

  ---

  ### V. Discriminating Signatures
  *To move this from theory to argument, your position must predict things rivals do not.*

  **9. What Your Position Predicts (The Signature)**
  *   **Stability vs. Size:** If CJT holds, public opinion on factual questions should become *more* stable and *more* accurate as the sample size increases, controlling for $\rho$. Rivals (elitists) predict stability comes from insulation (small groups).
  *   **The Skew Test:** If errors are random (CJT), aggregate opinion should be unbiased around the truth. If errors are systematic (Critics), aggregate opinion will be stably *wrong*.
      *   *Test:* Compare citizen body decisions on technical matters against later-verified outcomes (e.g., economic forecasts, pandemic trajectories).
      *   *Your Prediction:* Citizen bodies will converge on the truth over time.
      *   *Rival Prediction:* Citizen bodies will converge on popular falsehoods; experts will converge on truth.
  *   **The Correlation Cap:** Your theory predicts that adding voters beyond a certain point (determined by $\rho$) yields no epistemic gain. Rivals predict diminishing returns immediately. You predict an initial steep gain that plateaus.

  ---

  ### Summary Verdict & Strategic Advice

  **The Fatal Flaw:**
  The argument fails if you cannot independently establish $p > 0.5$ and $\rho \approx 0$ for the specific questions the body will face. On technical policy (the usual domain of expert committees), $p_{citizen}$ is likely $< 0.5$ and $\rho_{citizen}$ is likely high. In this region, CJT argues *against* your proposal: a large citizen body will be confidently wrong, and a small expert committee will be more reliable.

  **The Institutional Gap:**
  Even if $p > 0.5$, CJT maximizes *accuracy frequency*, not *utility*. If the citizen body has a higher variance of catastrophic error, the expert committee is preferable. Furthermore, CJT does not account for agenda control. If the citizen body votes on options selected by elites, the "truth" may never be an option.

  **What Would Move You (as requested):**
  You asked for an argument that *grants the assumptions* but denies the *conclusion*. Here it is:

  **The "Risk-Variance" Argument:**
  Grant that the Citizen Body ($n=1000$) has $p=0.6$ and the Expert Committee ($n=10$) has $p=0.7$. Grant independence for both.
  CJT says the Citizen Body is more likely to be right in a single vote.
  However, institutional design is a repeated game with path dependence.
  1.  **Volatility:** The Citizen Body's decision rule (majority) is more sensitive to short-term information shocks than a committee with stable norms. This creates policy volatility.
  2.  **Implementation:** A policy is only "true" if it can be implemented. Expert committees select policies within the feasible set (constrained by bureaucracy, law, physics). Citizen bodies may select "true" goals that are infeasible.
  3.  **The Verdict:** Even if the Citizen Body identifies the "right" goal more often, the Expert Committee produces better *realized outcomes* because their choices are coupled with implementation capacity and risk constraints. The theorem licenses the conclusion only if "choosing the right option" is the *sole* determinant of success, ignoring implementation, stability, and tail risk.

  **Recommendation for your Paper:**
  Do not argue for *replacing* the expert committee. Argue for a **hybrid**.
  Use the CJT to argue that the citizen body should set *goals/values* (where $p > 0.5$ is plausible and truth is less technical) and the expert committee should select *means* (where $p_{citizen}$ drops and risk asymmetry rises). This preserves the epistemic advantage of scale for values while mitigating the fatal risks of incompetence and correlation on technical implementation. This concedes the "Fatal" objections on technical competence while retaining the "Awkward" democratic advantage on legitimacy and values.
