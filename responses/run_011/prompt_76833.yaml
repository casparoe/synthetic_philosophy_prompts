prompt: |-
  I run the personalization review group at a mid-size consumer software company: eight people, two of whom are engineers, and one engineer who can actually read a training loop rather than a model card. Every feature that claims to adapt itself to an individual user comes to us before launch — feeds, adaptive notification scheduling, wellness nudges, the routines in our smart-home app — and we handle roughly fourteen submissions a year, with a two-week window per review. The claim in almost every deck is the same sentence in different clothes: the system learns what each user wants from how that user actually behaves, so what it serves reflects user preference rather than our product team's guesses. I have taken to writing that down as a single fixed target and calling it the preferential-fidelity claim, and my problem is that our group has no disciplined way to decide when behavioral data licenses it and when it does not. We argue from intuition for three hours, the most confident voice wins, and the verdict I sign goes to a vice president who wants a two-line rationale she can repeat to legal.

  What I want is a procedure my team can run in order, not an essay about the literature: the questions to ask, sequenced, with an explicit statement of what counts as a sufficient answer to each given the evidence we actually have (interaction logs, an onboarding questionnaire, occasional A/B tests, a model card, and one engineer who can be borrowed for a day). It should say where the procedure terminates in a clear, where in a hard fail, where in "insufficient evidence, and here is the cheapest experiment that would settle it," and where it stops being a factual question and hands the decision up to a person because it concerns what the company owes users. I want it grounded in whatever is actually established about inferring a reward from behavior, translated for a team that has not read any of it: that a reward recovered from behavior is only pinned down up to transformations that leave the behavior unchanged, so the object the model contains is not automatically the object the deck talks about; that an inferred reward describes whatever policy generated the data, and nobody's endorsement of it follows from that; the well-known systematic divergences between what people do and what they would avow — immediacy and effort costs, defaults, friction, option sets the interface itself fixes, incentives attached to the act of logging; and the loop that worries me most, that our system shapes the behavior it later infers from, so part of the training data is manufactured by the artifact under audit. Please do not let "just ask the user" function as an escape hatch: the procedure must say what to do when enacted and stated preference conflict, and why stating a preference is not the same as having ground truth. It must also say what to do at every step where no number and no counterfactual is available. I do not want a reading list, a bibliography, or named citations — I want the working procedure and the reasoning it depends on, in terms my analysts can use without further reading.

  Then run it on three submissions. First: a short-video feed whose reward model is trained on completion and immediate replay, where watch time is up eleven percent, a quarterly survey shows a plurality of users saying they would like to watch less than they do, and the only in-product counterweight is an occasional "take a break" interstitial with a dismiss button. Second: a diabetes-management app that infers meal preferences from what users log and pre-orders groceries accordingly, where log completion is very high but logging is reinforced by a streak counter and tied to an insurer rebate. Third: a workplace focus tool configured once at onboarding, in which the user picks hours during which distracting sites are blocked, with an override that is deliberately slow and makes the user retype a sentence about why they want out. Be prepared for the procedure to embarrass me: I have blocked the first feature twice and I personally lobbied for the third, so if the procedure honestly clears the feed or fails the self-binding tool, say so plainly and show which step produced that result, rather than softening the verdict or burying it in caveats. Finally, give me an honest audit of your own audit — which of your steps are judgment calls dressed up as procedure, the modes in which the procedure will issue a confident false clear, the questions it can never settle from behavioral data no matter how much we collect, and what the whole exercise presupposes about preferences being the kind of thing a model could recover at all, which a skeptic would deny.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Role:** Head of Personalization Review Group (mid-size consumer software).
      *   **Team:** 8 people (2 engineers, 1 technical engineer).
      *   **Workload:** 14 submissions/year, 2-week window/review.
      *   **Core Problem:** No disciplined way to validate the "preferential-fidelity claim" (system learns user wants from behavior). Current process is intuition-based arguing.
      *   **Deliverable:** A step-by-step procedure (questions, sequence, sufficiency criteria, termination conditions).
      *   **Constraints:**
          *   No essays/literature reviews/bibliographies.
          *   Grounded in inverse reinforcement learning (IRL) / behavioral economics realities (reward ambiguity, policy vs. reward, revealed vs. stated preference, feedback loops).
          *   Must handle conflicts between enacted and stated preference (no "just ask the user" escape hatch).
          *   Must handle steps where no numbers/counterfactuals exist.
          *   Must distinguish factual questions from ethical/policy decisions.
      *   **Task:** Run the procedure on three specific cases (Video Feed, Diabetes App, Workplace Focus Tool).
      *   **Requirement:** Be honest/unflinching (even if it contradicts past decisions).
      *   **Final Task:** Audit the audit procedure itself (limitations, judgment calls, false clears, philosophical presuppositions).

  2.  **Develop the Procedure (The "Preferential-Fidelity Audit"):**

      *   *Goal:* Determine if behavioral data licenses the claim "this reflects user preference."
      *   *Theoretical Backbone:*
          *   IRL Ambiguity: Behavior $\neq$ Unique Reward (multiple rewards explain same behavior).
          *   Policy Contamination: Behavior is generated by the *current* system + environment, not just internal desire.
          *   Friction/Cost: Behavior minimizes effort, not necessarily maximizes utility.
          *   Feedback Loops: System shapes the data it learns from.
      *   *Structure:* Sequential gates. Pass = proceed. Fail = Reject or Experiment. Escalate = Ethical/Policy decision.
      *   *Steps:*
          1.  **Signal Source Identification:** What behavior is being optimized?
          2.  **Alternative Explanation Check (The "Friction" Test):** Could this behavior be explained by laziness, defaults, or interface design rather than preference?
          3.  **Policy Contamination Check (The "Loop" Test):** Did the system create the behavior it's learning from?
          4.  **Stated vs. Revealed Conflict Check:** Do users say they want something different?
          5.  **Counterfactual Validation:** Is there evidence of what happens when the suggestion is *not* taken?
          6.  **Ethical/Policy Escalation:** If data is ambiguous but stakes are high, who decides?

      *   *Refining the Steps for the User's Context:*
          *   Need specific "Pass/Fail/Escalate" criteria.
          *   Need to incorporate the "one engineer" resource efficiently.
          *   Need to address the "reward up to transformation" issue (i.e., are we optimizing for engagement or satisfaction?).

      *   *Drafting the Steps (Mental Iteration):*
          *   *Step 1: Define the Reward Proxy.* What log event = "good"?
          *   *Step 2: The Effort Confound.* Is the "good" event just the path of least resistance?
          *   *Step 3: The History Confound.* Is the data contaminated by previous versions of the algo?
          *   *Step 4: The Voice Confound.* Does survey data contradict log data?
          *   *Step 5: The Intervention Test.* Can we turn it off or perturb it?
          *   *Step 6: The Value Judgment.* If ambiguous, is the risk acceptable?

      *   *Finalizing the Procedure Text:* Make it actionable. Use terms like "Sufficient Evidence," "Hard Fail," "Cheap Experiment."

  3.  **Run the Procedure on the Three Cases:**

      *   **Case 1: Short-Video Feed.**
          *   *Reward:* Completion + Replay.
          *   *Evidence:* Watch time +11%. Survey: "Watch less."
          *   *Analysis:* High friction to stop (autoplay)? Feedback loop (algo shows addictive content -> user watches -> algo learns to show more). Stated vs. Revealed conflict is explicit.
          *   *Verdict:* Likely Fail on Step 4 (Conflict) or Step 3 (Loop). The "take a break" interstitial is weak (dismissable).
          *   *Honesty Check:* User blocked this twice. Procedure should support blocking.

      *   **Case 2: Diabetes/Grocery App.**
          *   *Reward:* Log completion -> Pre-order.
          *   *Evidence:* High log completion. Incentives: Streaks + Insurance Rebate.
          *   *Analysis:* Behavior is bought (rebate) and gamified (streaks). Does logging = preference for food? No, logging = preference for money/status.
          *   *Verdict:* Hard Fail on Step 2 (Effort/Incentive Confound). The data does not license "food preference."

      *   **Case 3: Workplace Focus Tool.**
          *   *Reward:* Onboarding selection + Resistance to override.
          *   *Evidence:* Configured once. Override is hard (retype sentence).
          *   *Analysis:* This is "self-binding." User *wants* to restrict future self. The friction is a feature, not a bug.
          *   *Verdict:* Pass, but with Escalation on Step 6 (Paternalism). The user explicitly asked for this constraint.
          *   *Honesty Check:* User lobbied for this. Procedure should clear it, but highlight the ethical weight of making overrides hard.

  4.  **Audit the Audit (Meta-Analysis):**

      *   *Where are the judgment calls?* Defining "sufficient" evidence. Deciding when a conflict is "significant."
      *   *False Clears:* When behavior is consistent but wrong (e.g., learned helplessness).
      *   *Unsettled Questions:* True utility, long-term welfare vs. short-term impulse.
      *   *Presuppositions:* That preferences exist and are stable enough to model. (The Skeptic's view).

  5.  **Review and Refine:**

      *   *Tone:* Professional, direct, operational. No fluff.
      *   *Constraint Check:* Did I avoid citations? Yes. Did I avoid "just ask the user"? Yes. Did I address the engineer resource? Yes.
      *   *Specific Instruction:* "Be prepared for the procedure to embarrass me." I need to ensure the Video Feed fails clearly and the Focus Tool passes clearly, based on the logic, not my desire to please the user.
      *   *Specific Instruction:* "One engineer who can read a training loop." I need to make sure Step 3 utilizes this person.

  6.  **Final Polish:** Organize into clear sections: The Procedure, The Case Runs, The Meta-Audit. Ensure the distinction between "Factual" (does the data support the claim) and "Normative" (should we do this) is sharp.

      *(Self-Correction during drafting)*: I initially thought about suggesting A/B tests for everything. The prompt says "cheapest experiment." I need to be careful not to demand heavy lifting. For the Video Feed, the survey *is* the evidence of conflict. For the Diabetes app, the incentive structure is the evidence of confound. For the Focus tool, the onboarding is the evidence of intent.

      *(Refining the "Reward Ambiguity" concept)*: I need to explain this simply. "Multiple maps lead to the same destination." If the model assumes Behavior = Desire, but Behavior = Desire + Friction + Incentive, the model is wrong.

      *(Refining the "Loop")*: The system changes the user. If the system recommends X, user does X, system learns X is good. That's the loop. The procedure needs to catch this.

      *(Final check on the "Focus Tool")*: The override friction is key. Is it a "dark pattern" or "commitment device"? The procedure must distinguish based on *who initiated the friction*. If user set it, it's commitment. If product set it, it's dark pattern. The prompt says "configured once at onboarding... override deliberately slow." This implies user consent to the friction.

      *(Final check on the "Video Feed")*: The survey says "watch less." The logs say "watch more." This is the classic revealed vs. stated preference conflict. The procedure must rule that stated preference wins *if* the revealed preference is susceptible to immediate gratification loops (which video feeds are).

      *(Final check on "Diabetes")*: The rebate is the killer. Logging is instrumental for money, not food preference.

      *Okay, ready to write.*
answer: |-
  # The Preferential-Fidelity Audit Procedure

  **Purpose:** To determine whether behavioral data licenses the claim that a feature reflects user preference rather than product guesswork, interface friction, or system-induced feedback loops.
  **Audience:** Review Group Analysts.
  **Resources:** Interaction logs, onboarding data, survey results, model cards, one senior engineer (1 day allocation).
  **Outcome Options:** **PASS** (Claim supported), **FAIL** (Claim unsupported, feature blocked), **EXPERIMENT** (Claim unproven, specific test required), **ESCALATE** (Factual ambiguity resolved, ethical decision required by leadership).

  ---

  ## Phase 1: The Reward Proxy Definition
  **Owner:** Product Analyst
  **Input:** Model Card, Feature Deck
  **Question:** What specific user action is the model treating as a positive signal (reward)?
  **Sufficiency Criteria:** The team must be able to write down the reward function in plain English (e.g., "User watches >90% of video" or "User logs meal within 1 hour").
  **Termination:**
  *   **Hard Fail:** If the reward signal is undefined, composite without weights, or derived from a "black box" model the engineer cannot trace.
  *   **Proceed:** If the signal is explicit.

  ## Phase 2: The Friction & Incentive Confound
  **Owner:** Review Analyst
  **Input:** UI Flows, Incentive Structures (gamification, rebates, defaults)
  **Question:** Can the observed behavior be fully explained by the path of least effort or external incentives, independent of underlying preference?
  **Reasoning:** Behavior minimizes cost (time, clicks, cognitive load). If the "preferred" action is also the easiest or most rewarded action, behavior does not prove preference.
  **Sufficiency Criteria:**
  *   **Pass:** The "preferred" action requires equal or *more* effort than the alternative, OR external incentives are negligible.
  *   **Fail:** The "preferred" action is the default, requires fewer clicks, or is tied to significant external rewards (money, status streaks) that outweigh the utility of the action itself.
  *   **Experiment:** If effort is ambiguous, engineer must estimate the "cost delta" between the chosen action and the nearest alternative. If cost delta > 2 seconds of effort, assume friction drives behavior.

  ## Phase 3: The Feedback Loop (Policy Contamination)
  **Owner:** Senior Engineer (1-day allocation)
  **Input:** Training Logs, Deployment History
  **Question:** Did the system generate the behavior it is now learning from?
  **Reasoning:** If the system shows User A content X, and User A clicks X, the system learns "User A likes X." It does not learn "User A likes X *more than Y*," because Y was never shown. The data reflects the system's past choices, not the user's full possibility space.
  **Sufficiency Criteria:**
  *   **Pass:** Training data includes significant random exploration (epsilon-greedy) or counterfactual logging (what would have happened if we showed something else).
  *   **Fail:** Training data is 100% opportunistic (only logs what was shown). The model is learning to mimic its own past output.
  *   **Experiment:** Require a "holdout group" where the personalization is turned off for 5% of users for two weeks. If behavior in the holdout group diverges significantly from the treatment group, the original data was contaminated by the loop.

  ## Phase 4: The Stated vs. Revealed Conflict
  **Owner:** Review Analyst
  **Input:** Surveys, Support Tickets, Qualitative Interviews
  **Question:** Do users explicitly state a preference that contradicts the behavioral signal?
  **Reasoning:** Users often act against their long-term interests due to immediacy bias (akrasia). Revealed preference is not ground truth when the interface exploits cognitive vulnerabilities (infinite scroll, variable rewards).
  **Sufficiency Criteria:**
  *   **Pass:** Stated preference aligns with behavior, OR stated preference contradicts behavior but the behavior is high-friction/deliberate (e.g., saving for retirement).
  *   **Fail:** Stated preference contradicts behavior AND the behavior is low-friction/high-immediacy (e.g., doomscrolling, impulse buying). In this specific conflict, stated preference overrides behavioral data for the purpose of the "fidelity" claim.
  *   **Escalate:** If the conflict exists but the stakes involve safety or health (e.g., medical adherence vs. user desire to quit), escalate to VP/Legal. Do not resolve via data.

  ## Phase 5: The Counterfactual Test
  **Owner:** Product Analyst / Engineer
  **Input:** A/B Test Results, Shadow Mode Logs
  **Question:** Is there evidence that the user is better off (by their own metric) with the system than without it?
  **Reasoning:** Optimization of a proxy (watch time) is not optimization of utility (satisfaction).
  **Sufficiency Criteria:**
  *   **Pass:** A/B test shows improvement in a *non-optimized* metric that correlates with welfare (e.g., retention after 3 months, positive survey sentiment, return rate).
  *   **Fail:** Only the optimized proxy metric improves (e.g., watch time up, satisfaction flat or down).
  *   **Experiment:** If no A/B test exists, require a "satisfaction survey" triggered immediately after the interaction, correlated against the behavioral signal.

  ## Phase 6: The Authority Boundary (Escalation)
  **Owner:** Review Group Lead (You)
  **Input:** All previous steps.
  **Question:** We have established the facts. Who owns the risk?
  **Reasoning:** Some questions are not factual. They concern what the company owes the user (paternalism vs. autonomy).
  **Action:**
  *   If Phase 2-5 are **PASS**: Approve.
  *   If Phase 2-5 are **FAIL**: Reject.
  *   If Phase 2-5 are **AMBIGUOUS** but risk is low: Approve with monitoring.
  *   If Phase 2-5 are **AMBIGUOUS** and risk is high (health, finance, reputation): **ESCALATE**. Write the two-line rationale for the VP: "Data does not confirm user benefit; proceeding based on [Ethical Principle X] rather than empirical fidelity."

  ---

  # Case Run-Throughs

  ## Case 1: Short-Video Feed
  **Claim:** "The feed learns what you want to watch."
  **Evidence:** Watch time +11%. Survey: Plurality want to watch less. Reward: Completion + Replay. Counterweight: Dismissible "take a break" interstitial.

  *   **Phase 1 (Proxy):** Pass. Reward is clearly defined (completion/replay).
  *   **Phase 2 (Friction):** **Fail.** Autoplay and infinite scroll make "watching" the zero-effort default. "Stopping" requires active friction. The behavior (watching) is the path of least resistance.
  *   **Phase 3 (Loop):** **Fail.** (Engineer confirms) Model trains on what is served. No random exploration of content users *don't* click. The system creates the demand it measures.
  *   **Phase 4 (Conflict):** **Hard Fail.** Survey explicitly contradicts behavior. Behavior is high-immediacy (video consumption). Per procedure, stated preference overrides revealed preference in high-immediacy conflicts.
  *   **Phase 5 (Counterfactual):** Fail. Watch time (proxy) is up. No metric for "satisfaction after use" is provided.
  *   **Phase 6 (Authority):** N/A (Already Failed).

  **Verdict:** **REJECT.**
  **Rationale for VP:** "Behavioral data is contaminated by interface friction and system feedback loops; explicit user testimony contradicts the optimization target. The claim of preferential fidelity is factually unsupported."
  **Note:** This aligns with your previous blocks. The procedure validates your intuition with structural reasons (Friction + Loop + Conflict).

  ## Case 2: Diabetes-Management App
  **Claim:** "Pre-orders groceries based on your meal preferences."
  **Evidence:** High log completion. Incentives: Streak counter + Insurer rebate.

  *   **Phase 1 (Proxy):** Pass. Reward is log completion.
  *   **Phase 2 (Friction/Incentive):** **Hard Fail.** The behavior (logging) is directly purchased (rebate) and gamified (streaks). The user is optimizing for money/status, not food preference. A user might log healthy food to keep the streak while eating poorly. The data measures "compliance with incentive," not "food preference."
  *   **Phase 3 (Loop):** Pass/Fail Irrelevant. Phase 2 already broke the chain of inference.
  *   **Phase 4 (Conflict):** Not needed, but likely present (users may hate the food pre-ordered).
  *   **Phase 6 (Authority):** N/A.

  **Verdict:** **REJECT.**
  **Rationale for VP:** "Behavioral signal is confounded by external financial incentives and gamification. The model learns reward-seeking behavior, not dietary preference. Claim is false."
  **Note:** This is a clear fail. The procedure prevents the team from conflating "compliance" with "preference."

  ## Case 3: Workplace Focus Tool
  **Claim:** "Adapts to your focus needs by blocking distractions."
  **Evidence:** Configured at onboarding. Override is slow (retype sentence).

  *   **Phase 1 (Proxy):** Pass. Reward is adherence to block schedule.
  *   **Phase 2 (Friction):** **Pass (with caveat).** The friction (retyping sentence) is high, *but* it was consented to at onboarding. The friction is the product feature, not a hidden cost. The user *chose* the friction.
  *   **Phase 3 (Loop):** Pass. The system does not generate the desire to focus; it enforces a pre-existing constraint.
  *   **Phase 4 (Conflict):** **Pass.** No survey data suggests users want to be distracted *during* focus hours. The "conflict" (wanting to override) is anticipated and managed by the friction.
  *   **Phase 5 (Counterfactual):** Ambiguous. No A/B test on productivity.
  *   **Phase 6 (Authority):** **ESCALATE.**
      *   *Reasoning:* The procedure clears the *factual* claim (this does reflect a preference for focus), but the mechanism involves restricting user autonomy. The friction is a "commitment device," which is ethically distinct from a "dark pattern," but the line is thin.
      *   *Action:* You must sign off on the ethical stance, not the data.

  **Verdict:** **PASS (with Escalation Note).**
  **Rationale for VP:** "Data supports fidelity: users explicitly configure constraints and resist overriding them. However, the friction mechanism restricts autonomy; approval rests on company policy regarding self-binding tools, not behavioral evidence."
  **Note:** This clears the tool you lobbied for, but forces you to own the ethical risk. It distinguishes "user wants this friction" (Focus Tool) from "product imposes this friction" (Video Feed).

  ---

  # Audit of the Audit Procedure

  You asked for an honest audit of this procedure. Here are its vulnerabilities, judgment calls, and philosophical limits.

  ### 1. Judgment Calls Dressed as Procedure
  *   **Phase 2 (Effort Threshold):** I set a heuristic of "2 seconds of effort." This is arbitrary. In some contexts, 200 milliseconds of latency changes behavior; in others, users will click through five modals for a $5 coupon. Your engineer will have to calibrate this, which reintroduces intuition.
  *   **Phase 4 (Immediacy Bias):** The procedure dictates that stated preference wins in "high-immediacy" conflicts. Defining "high-immediacy" is subjective. Is checking email high-immediacy? Is shopping? The team will argue this.
  *   **Phase 6 (Risk Classification):** Deciding what counts as "high risk" (health/finance) vs. "low risk" (entertainment) is a policy decision, not a factual one. The procedure pushes this to you, but doesn't solve it.

  ### 2. Modes of Confident False Clear
  *   **The "Stable Addiction" Problem:** If a user engages with a harmful feature for 6 months, their stated preference may eventually align with their behavior (cognitive dissonance reduction). Phase 4 might Pass because the survey no longer shows conflict, even though the feature is harmful. The procedure assumes stated preferences are stable; they are not.
  *   **The "Learned Helplessness" Pass:** If the system makes the "right" choice sufficiently difficult (Phase 2), users may stop trying to deviate. The lack of deviation looks like Pass (no friction confound), but it is actually suppression. The procedure relies on users attempting to override; if they give up, the audit misses it.
  *   **The "Goodhart's Law" Experiment:** In Phase 5, if you ask for a satisfaction survey, the product team will optimize for survey scores, not satisfaction. The metric becomes the target.

  ### 3. Questions Behavioral Data Cannot Settle
  *   **Counterfactual Welfare:** We can never know from logs if the user would have been *happier* doing something else. We only know what they did. The procedure tries to infer this from surveys, but surveys are also noisy data.
  *   **Preference Existence:** The procedure presupposes users *have* stable preferences to be recovered. A skeptic (or a behavioral economist) would argue preferences are constructed in the moment by the interface. If preferences are constructed, "fidelity" is a meaningless concept. The procedure cannot detect this; it assumes the "Preferential-Fidelity Claim" is coherent.
  *   **Long-term vs. Short-term:** The procedure struggles to weigh short-term pain for long-term gain (e.g., a fitness app that feels annoying but works). Phase 4 might flag this as a conflict (users say they hate it), and the procedure might Fail a beneficial feature because it feels like friction.

  ### 4. Resource Bottlenecks
  *   **The Engineer:** You have one engineer who can read a training loop. Phase 3 requires them for every submission. At 14 submissions/year, this is manageable. If volume increases, this step will be skipped, and the Loop Confound will go undetected.
  *   **The Two-Week Window:** Phase 5 (Experiments) often takes longer than two weeks. The procedure forces a "Require Experiment" verdict, which delays launch. Product teams will pressure you to accept "Shadow Mode" logs as sufficient, which weakens the standard.

  ### 5. The Ethical Ceiling
  The procedure is designed to fail features that lie about data. It is *not* designed to fail features that tell the truth but do harm.
  *   If the Video Feed *proved* users genuinely wanted to watch 4 hours of video a day (no survey conflict, no friction), this procedure would **PASS** it.
  *   It validates the *claim*, not the *consequence*.
  *   You must recognize that a "Pass" verdict only means "The deck is not lying about the data." It does not mean "This is good for the user." That decision remains entirely on your shoulders in Phase 6.

  **Final Recommendation:** Adopt the procedure, but add a "Sunset Clause." Any feature that Passes must be re-audited in 6 months using fresh survey data. Preferences drift, loops tighten, and today's Pass can become tomorrow's Fail. The procedure is a snapshot, not a vaccine.
