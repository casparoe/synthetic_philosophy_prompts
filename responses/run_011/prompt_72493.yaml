prompt: |-
  I serve on the quality committee of a regional health system. Next month we vote on whether to make a new sepsis protocol the default for all adult admissions, replacing standard care. The supporting report draws on two years of observational data from our own units. In aggregate, 120 of 310 patients managed under the new protocol survived to discharge (38.7%), against 172 of 300 under standard care (57.3%); the report's author concludes that the protocol is harmful and should be dropped. The stratified figures run the other way. Among patients judged severe at presentation, the protocol saved 75 of 250 (30%) versus 12 of 60 (20%) for standard care; among those judged mild, 45 of 60 (75%) versus 160 of 240 (66.7%). The author's response is that the stratified table is a diversion, since the committee is voting on what will happen to our actual case mix, not to a counterfactual one in which severity is balanced by design.

  Two further facts complicate the picture. Severity is recorded by a standing triage rule that has routed most severe presentations to the new protocol, and a colleague who split the severe band into moderate and very severe found the protocol still ahead in all three bands, with the aggregate unchanged. And the protocol requires nurse staffing we can sustain for roughly a third of admissions, so a vote in its favor is in practice a vote about which patients receive it.

  Write the memo I will circulate ahead of the vote. It should state a recommendation — implement system-wide, hold, or implement in a restricted form — with a time frame and any conditions the data can support. It should say explicitly which question each table answers and which one bears on our decision; engage my colleague's objection on its own terms rather than writing it off as a statistical artifact; and assess how far the stratified comparison can be trusted given how patients came to be assigned, including what we would have to run to settle the matter. End with the strongest case for the recommendation you reject, and why it nonetheless loses (or why it does not).
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the quality committee of a regional health system.
      *   **Task:** Write a memo to circulate ahead of a vote on a new sepsis protocol.
      *   **Decision:** Vote on whether to make the new protocol the default for *all* adult admissions (replacing standard care).
      *   **Data Provided:**
          *   Aggregate (Unadjusted): New Protocol (38.7% survival) vs. Standard Care (57.3% survival). *Conclusion: Protocol is harmful.*
          *   Stratified (Adjusted):
              *   Severe: New (30%) vs. Standard (20%). *Protocol better.*
              *   Mild: New (75%) vs. Standard (66.7%). *Protocol better.*
              *   *Phenomenon:* Simpson's Paradox.
          *   Further Stratification (Colleague): Moderate/Very Severe split still shows protocol advantage in all bands. Aggregate remains unchanged.
      *   **Complicating Factors:**
          *   Selection Bias: Triage rule routed *most* severe cases to the new protocol (non-random assignment).
          *   Resource Constraint: Nurse staffing allows the new protocol for only ~1/3 of admissions.
          *   Author's Objection: Stratified tables are a "diversion" because the vote is about the *actual case mix*, not a balanced counterfactual.
      *   **Memo Requirements:**
          *   State a recommendation (Implement system-wide, Hold, or Implement restricted) with time frame/conditions.
          *   Explicitly state which question each table answers and which bears on the decision.
          *   Engage the author's objection on its own terms (don't just call it a statistical artifact).
          *   Assess trustworthiness of stratified comparison given assignment method (triage rule).
          *   Specify what study would settle the matter.
          *   End with the strongest case for the *rejected* recommendation and why it loses.

  2.  **Deconstruct the Data & Logic:**
      *   **Simpson's Paradox:** The aggregate data looks bad for the new protocol, but the stratified data looks good. This happens because the new protocol group was much sicker (250/310 severe vs. 60/300 severe).
      *   **The Author's Argument:** The author says, "We can't pretend our patients aren't sick. If we adopt this for everyone, we get the aggregate result (38.7% survival), not the stratified ideal." This is logically sound *if* the protocol is applied to everyone without resource constraints.
      *   **The Resource Constraint:** We *cannot* apply the protocol to everyone. We only have staffing for 1/3 of admissions. This changes the decision from "Protocol vs. Standard for All" to "Who gets the Protocol?"
      *   **The Triage Bias:** The current data isn't randomized. Sicker patients were *routed* to the protocol. This suggests clinicians suspected the protocol helped the sickest, or the protocol was triggered by severity markers. The fact that the protocol performs better *within* severity bands suggests it has efficacy, but the non-random assignment means there could be unmeasured confounders within those bands (e.g., maybe the "Severe/Protocol" group was slightly less severe than "Severe/Standard" within the broad 'Severe' category, though the colleague's split mitigates this slightly).
      *   **The Decision:**
          *   *Option A: System-wide implementation.* Impossible due to staffing (only 1/3 capacity). Also risky if aggregate holds true for low-severity patients when scaled (though stratified data suggests benefit).
          *   *Option B: Hold/Reject.* Ignores the signal that the protocol helps severe patients (30% vs 20% is a 50% relative improvement).
          *   *Option C: Restricted Implementation (Targeted).* This aligns with the resource constraint and the data signal. Use the protocol for the patients who benefit most (Severe), use Standard for others.
      *   **Addressing the Author's Objection:** The author is right that the *aggregate* reflects the real-world outcome *if* we treat everyone the same. However, since we *can't* treat everyone with the new protocol, the aggregate comparison of "All New vs. All Standard" is a hypothetical we cannot enact. The decision is actually about allocation. The stratified data answers "Does the protocol work better for specific subgroups?" The aggregate data answers "What happens if we ignore severity?"
      *   **Trustworthiness:** The stratified comparison is observational. Confounding is likely. We need a Randomized Controlled Trial (RCT) or a stepped-wedge design to be sure. However, given the resource constraint, a targeted rollout acts as a pragmatic trial.

  3.  **Drafting the Memo - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Recommendation:** Implement in restricted form (Targeted). Timeframe: 12 months. Condition: Strict triage criteria based on severity.
      *   **The Data & The Questions:**
          *   Aggregate Table: Answers "What is the average outcome if we ignore patient differences?" It reflects the *current allocation bias*, not necessarily the protocol's intrinsic efficacy.
          *   Stratified Table: Answers "Does the protocol improve survival within comparable clinical states?" This bears on the decision because we must allocate scarce resources to where they work best.
          *   Engaging the Author: Acknowledge the author is right that we can't wish away the case mix. *But*, since we are capacity-constrained, we are effectively choosing a case mix. We *should* route severe cases to the protocol because that's where the signal is strongest and where we have capacity.
      *   **Trustworthiness & Assignment:**
          *   Acknowledge the triage rule created selection bias.
          *   The colleague's sub-stratification helps, but unmeasured confounders remain.
          *   We cannot fully trust the magnitude of benefit (30% vs 20%) without randomization.
          *   *Settling the matter:* We need a randomized trial (RCT) where eligible severe patients are randomized to Protocol vs. Standard.
      *   **The Rejected Option (Strongest Case):** System-wide implementation (or Standard Care). Let's argue for *Standard Care (Reject Protocol)* as the rejected option, or perhaps *System-wide Protocol*. Actually, the prompt asks for the strongest case for the recommendation I *reject*. If I recommend Restricted, I should probably reject System-Wide or Hold.
          *   *Decision:* I will recommend **Restricted Implementation**. I will reject **System-Wide Implementation** (which is impossible anyway) or **Reverting to Standard Care**.
          *   *Better fit:* The prompt implies the vote is "New Protocol Default vs. Standard Care". If I recommend Restricted, I am rejecting "Default for All".
          *   *Wait, resource constraint:* "A vote in its favor is in practice a vote about which patients receive it." This implies if we vote "Yes", we still have to choose who gets it.
          *   *Let's refine the Recommendation:* **Implement in Restricted Form (Severe Cases Only).**
          *   *Rejected Recommendation:* **Maintain Standard Care (Drop Protocol).**
          *   *Why Standard Care is strong:* The data is observational. The "benefit" might be residual confounding. The aggregate mortality *did* go up when the protocol was used more. Safety first.
          *   *Why it loses:* The relative benefit in severe cases is too large to ignore (50% relative reduction in mortality), and we have the capacity to treat the severe group specifically. Ethical obligation to use the potentially superior treatment for the sickest.

  4.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Author's Objection:* "The stratified table is a diversion... voting on what will happen to our actual case mix."
      *   *My Counter:* The "actual case mix" outcome depends on *allocation*. If we allocate the protocol to the severe (where we have capacity), the "actual case mix" outcome improves. The aggregate table reflects a *bad allocation* (or rather, an uncontrolled one where the protocol group was overwhelmed by severity). The author assumes the allocation remains skewed or that the protocol applies to all. Since it applies to 1/3, we must choose the 1/3. The stratified data tells us which 1/3.
      *   *Trust:* Be honest. Observational data is weak. But we can't wait for an RCT before acting if the signal is this strong in severe sepsis. The restricted rollout *becomes* the data collection phase.

  5.  **Final Polish:**
      *   Tone: Professional, analytical, decisive, respectful of the author's concern.
      *   Structure: Clear headings.
      *   Check constraints: Did I address the colleague's split? Yes. Did I address the staffing constraint? Yes. Did I address the "which table answers which question"? Yes.

  6.  **Writing the Memo:** (Mental Draft)
      *   Start with the Recommendation: Targeted rollout for severe sepsis.
      *   Explain the Simpson's Paradox clearly.
      *   Address the Author: You are right about the aggregate, but only if we treat everyone the same. We can't. We must triage.
      *   Address Validity: It's observational. We need an RCT. But we can't deny care based on uncertainty when the signal is strong.
      *   Rejected Option: Return to Standard Care. Strongest argument: Safety/Uncertainty. Why it loses: Opportunity cost for severe patients.

      *(Self-Correction on Rejected Option)*: The prompt asks to end with the strongest case for the recommendation I *reject*. If I recommend "Restricted", I am effectively rejecting "System-wide Default" (the vote option) and "Status Quo". The vote is "Make new protocol default... replacing standard care."
      *   If I recommend "Restricted", I am amending the motion.
      *   Let's frame the rejected recommendation as **"Adopt the Protocol as the Unrestricted Default for All Admissions."**
      *   Why? Because the staffing doesn't allow it, and the aggregate data warns against diluting the protocol on mild cases where the benefit is smaller and resources are wasted.
      *   *Wait, looking closer at the prompt:* "A vote in its favor is in practice a vote about which patients receive it." This implies if we vote Yes, we still have to decide allocation.
      *   *Okay, let's look at the options again:*
          1.  Implement System-wide (Default).
          2.  Hold (Drop/Standard Care).
          3.  Implement Restricted.
      *   My Recommendation: **Implement Restricted.**
      *   Rejected Recommendation to argue against: **Hold/Drop Protocol (Return to Standard Care).**
      *   *Why?* The author argues the protocol is harmful based on aggregate. I need to show why that view is compelling but ultimately wrong.
      *   *Actually, the prompt asks:* "End with the strongest case for the recommendation you reject, and why it nonetheless loses."
      *   If I recommend Restricted, I reject both "All" and "None". "None" (Standard Care) is the stronger counter-argument because of the data validity issues. "All" is impossible due to staffing. I will focus on rejecting **"Return to Standard Care / Drop the Protocol."**

      *Wait, one more check:* The author concludes the protocol is harmful and should be dropped. My recommendation should probably oppose that. So I recommend **Implement (Restricted)**. I reject **Drop (Standard Care)**.
      *   *Wait, the vote is:* "Make new protocol default... replacing standard care."
      *   If I vote Yes, it becomes default. But staffing limits it.
      *   If I vote No, it's standard care.
      *   My memo is to guide the vote. I should recommend voting **Yes, but with a binding amendment** restricting it to severe cases.
      *   So the "Recommendation" is "Adopt with Restrictions." The "Rejected Recommendation" is "Reject Protocol (Standard Care)."

      *Let's refine the "Which table answers which question" part.*
      *   Aggregate: "What is the outcome of the protocol *given current triage behavior*?" (Confounded).
      *   Stratified: "What is the physiological effect of the protocol *controlling for severity*?" (Causal signal).
      *   Decision bearing: Stratified, because we control triage now.

      *Let's refine the "Author's Objection".*
      *   Author: "Stratified is counterfactual."
      *   Me: "It is counterfactual only if we continue to allocate randomly or poorly. Since we control allocation (due to scarcity), we make the stratified reality."

      *Let's refine the "Trust".*
      *   Triage rule routed severe to protocol. This is confounding by indication.
      *   However, within severe, protocol won.
      *   Colleague split severe: Protocol still won.
      *   Trust level: Moderate. Needs RCT.
      *   Settlement: Pragmatic RCT within the severe cohort.

      *Okay, ready to write.*

  7.  **Final Review against constraints:**
      *   Recommendation stated? Yes.
      *   Time frame/conditions? Yes.
      *   Which table answers which question? Yes.
      *   Engage author's objection? Yes.
      *   Assess trust/assignment? Yes.
      *   What study to settle? Yes.
      *   End with strongest case for rejected rec + why it loses? Yes.

      *One detail:* "The author's response is that the stratified table is a diversion... voting on what will happen to our actual case mix."
      *   I need to be careful not to dismiss this. The aggregate *is* the result of the current mix. But the mix was determined by a triage rule that isn't fixed.
      *   Okay, I will argue that the "actual case mix" is a policy choice, not a force of nature.

      *Let's go.*
answer: |-
  **MEMORANDUM**

  **TO:** Quality Committee, Regional Health System
  **FROM:** [Your Name], Committee Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Sepsis Protocol Vote

  **Recommendation**

  I recommend that the Committee vote to **implement the new sepsis protocol in a restricted form**, limited strictly to patients meeting the "Severe" triage criteria, for a period of **12 months**.

  This implementation must be conditional on two factors:
  1.  **Allocation:** Due to nursing staffing constraints (capacity for ~33% of admissions), the protocol must be formally prioritized for the Severe cohort. It should not be applied to Mild cases during this period.
  2.  **Data Collection:** This restricted rollout will serve as a prospective data collection phase. We must commit to analyzing the 12-month outcomes against a matched control group to validate the observational signals before considering system-wide expansion.

  **Interpreting the Data: Which Table Answers Which Question?**

  To reach this conclusion, we must be precise about what the conflicting data tables actually tell us.

  The **aggregate table** (38.7% vs. 57.3% survival) answers the question: *"What was the outcome of the protocol given the specific patient allocation that occurred over the last two years?"* It reflects the reality of our triage rule, which routed the sickest patients to the new protocol. The author of the report is correct that this table reflects the "actual case mix" we experienced. However, it conflates the efficacy of the treatment with the mortality risk of the patients selected for it. It bears on our decision only to the extent that we intend to replicate the *exact same allocation patterns* of the past two years.

  The **stratified table** (Severe: 30% vs. 20%; Mild: 75% vs. 66.7%) answers the question: *"Does the protocol improve survival when comparing patients of similar clinical severity?"* This table isolates the physiological effect of the intervention from the baseline risk of the population. This table bears on our decision because, unlike the past two years, we now have the opportunity to *choose* our allocation. Since we cannot treat everyone with the new protocol due to staffing limits, we must decide which subgroup receives the resource. The stratified data suggests that resource is best spent on the Severe cohort.

  **Engaging the Objection on Allocation**

  The report's author argues that the stratified table is a "diversion" because the Committee is voting on the outcome for our actual case mix, not a "counterfactual one in which severity is balanced by design."

  This objection is valid if we view our case mix as a fixed force of nature. If we were to adopt the protocol as an unrestricted default for *all* admissions, the author is right: the aggregate mortality would likely rise, because we would be diluting a resource-intensive protocol across mild cases where the absolute benefit is smaller, potentially straining nursing staff and degrading performance.

  However, the staffing constraint transforms this decision. We are not voting on "Protocol for All" versus "Standard for All." We are voting on "Protocol for Whom?" The "counterfactual" the author dismisses is actually our only viable policy option. We *must* balance severity by design because we lack the capacity to do otherwise. If we restrict the protocol to the Severe cohort (roughly 33% of admissions, aligning with staffing), we are not creating a statistical fantasy; we are engineering the specific case mix where the data indicates the protocol is most effective. In this context, the aggregate table from the observational period is no longer the relevant predictor; it is a warning against untargeted deployment.

  **Assessing Trust and Assignment Bias**

  We must remain cautious. The stratified comparison is observational. The standing triage rule routed most severe presentations to the new protocol, introducing selection bias. It is possible that within the "Severe" band, clinicians subconsciously routed patients with better prognoses to the new protocol, or that unmeasured confounders (e.g., time of day, specific comorbidities) differ between the groups.

  The fact that a colleague further split the Severe band into Moderate and Very Severe, finding the protocol ahead in all sub-bands, increases our confidence. It suggests the benefit is robust across the severity spectrum and not driven by a single threshold effect. However, this does not eliminate the risk of residual confounding. We cannot fully trust the magnitude of the benefit (e.g., the 10 percentage point gain in Severe cases) as a guaranteed outcome.

  To settle this matter definitively, we would need a **Randomized Controlled Trial (RCT)** within the Severe cohort. Eligible severe patients would be randomized to New Protocol vs. Standard Care, ensuring that unmeasured confounders are balanced. Until then, the stratified data should be treated as a strong signal, not proof.

  **The Case for the Rejected Recommendation**

  The strongest alternative recommendation is to **reject the protocol entirely and maintain Standard Care.**

  The case for this position rests on the principle of *primum non nocere* (first, do no harm) and the integrity of the aggregate data. The only hard, unadjusted evidence we have is that when the protocol was introduced, overall survival for sepsis patients in this system dropped significantly (from 57.3% to 38.7%). The stratified benefits rely on statistical adjustment that may not fully account for the bias introduced by the triage rule. If the protocol is adopted and the triage criteria are applied imperfectly—or if the "Severe" benefit turns out to be an artifact of unmeasured confounding—we risk institutionalizing a harmful practice. Furthermore, reverting to Standard Care eliminates the operational complexity of managing two parallel protocols and ensures equitable treatment regardless of triage classification.

  **Why This Recommendation Loses**

  Despite these valid safety concerns, the "Reject Protocol" recommendation fails because it ignores the magnitude of the signal in the Severe cohort. A relative mortality reduction from 20% to 30% survival represents a 50% improvement in outcomes for the sickest patients. In a resource-constrained environment, denying a potentially life-saving intervention to the highest-risk group based on aggregate data driven by selection bias is ethically difficult to justify. The aggregate harm is largely explained by the concentration of high-risk patients in the protocol group, not necessarily by the protocol itself. By restricting the protocol to the Severe cohort, we mitigate the risk of diluting the intervention while capturing the potential survival benefit where it matters most. We cannot let the perfection of an RCT be the enemy of the strong signal we currently possess.

  **Action Required**

  I move that we approve the protocol with the amendment that its use be restricted to Severe triage classifications for a 12-month review period.
