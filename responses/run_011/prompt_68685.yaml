      *   **Background:** Systems thinking, differential equations (forcing terms vs. state), equilibrium vs. non-equilibrium, counterfactuals, policy implications (grid operators, triage teams).
      *   **Problem:** Stuck on the "killing vs. letting die" (doing vs. allowing) distinction in ethics. Finds current literature polarized (defenders vs. eliminativists) and overly reliant on single intuition pumps (e.g., Smith/Jones bathtub case).
      *   **Goal:** Wants a "spec" (specification/requirements list) for an *adequate* theory of doing vs. allowing.
      *   **Criteria for Adequacy:** Must support real-world policy/judgment (grid ops, triage), not just seminar arguments.
      *   **Specific Requests:**
          *   List of requirements (phenomena to explain, cases to get right, distinctions to keep/reject, consistency with law/medicine/empirical data).
          *   For each requirement: The consideration behind it + the case that motivates it.
          *   Sorting: Non-negotiable vs. "one camp's taste."
          *   Conflict Detection: Flag incompatible requirements (inconsistencies in the "model").
          *   Raw Material: Use/push back on the user's specific examples (aerator, reservoir equilibrium, timing of omissions, overwhelming allowings).
          *   Scorecard: Brief evaluation of 2-3 standard positions against the requirements.
      *   **Tone:** Rigorous, engineering/modeling mindset, no fluff, direct, acknowledging the user's expertise in systems.

  2.  **Deconstruct the "Doing vs. Allowing" Problem through a Systems Lens:**
      *   The user sees ethics as a control system.
      *   *Killing* = Active forcing term ($F(t) > 0$).
      *   *Letting Die* = Removing forcing term ($F(t) = 0$) or boundary condition change.
      *   *Equilibrium* = Natural state (death/drowning) vs. Maintained state (life).
      *   *Policy Need* = Liability/Responsibility allocation. If everything is "allowing," responsibility dilutes. If everything is "doing," responsibility becomes impossible (overwhelming allowings).

  3.  **Drafting the Requirements List (The "Spec"):**
      *   *Requirement 1: Causal Asymmetry.* Needs to distinguish intervention from non-intervention physically, not just morally. (Motivation: The aerator case).
      *   *Requirement 2: The Baseline Problem.* Needs to define "normal course of events." (Motivation: Reservoir equilibrium).
      *   *Requirement 3: Scalability/Non-Triviality.* Cannot make "allowing" so cheap that everyone is guilty of everything. (Motivation: Sitting here typing).
      *   *Requirement 4: Temporal Locatability.* Needs to handle delayed effects of omissions. (Motivation: Order signed in March, death in June).
      *   *Requirement 5: Legal/Medical Alignment.* Needs to map roughly to *actus reus* and medical withdrawal of care standards. (Motivation: Policy enforceability).
      *   *Requirement 6: Moral Weight.* Needs to explain why killing *often* feels worse, even if allowing can be equally bad. (Motivation: Smith/Jones).

  4.  **Sorting Requirements (Non-Negotiable vs. Taste):**
      *   *Non-Negotiable:* Scalability (otherwise the system crashes), Legal Alignment (otherwise it's useless for policy), Causal Asymmetry (otherwise it's just monism).
      *   *Taste:* Moral Weight (some theories say the weight *is* the same, only the act differs).

  5.  **Identifying Inconsistencies (The "No Solution" Flag):**
      *   *Conflict:* Causal Asymmetry vs. Moral Weight. If the physical difference is negligible (aerator), but the moral difference is supposed to be significant, the theory strains.
      *   *Conflict:* Baseline Definition vs. Scalability. If "baseline" is "state of nature," then *all* civilization is "doing." If "baseline" is "status quo," then entrenched injustice is "allowing."
      *   *Conflict:* Temporal Locatability vs. Causal Reality. Omissions don't have a specific time of "occurrence" in physics, only in law.

  6.  **Addressing User's Raw Material:**
      *   *Aerator:* This is the "intervention vs. non-intervention" boundary.
      *   *Reservoir:* This is the "maintenance as action" problem. Is homeostasis natural or artificial?
      *   *Timing:* This is the "omission localization" problem.
      *   *Overwhelming Allowings:* This is the "demandingness/overload" problem.

  7.  **Developing the Scorecard:**
      *   *View 1: The Equivalence Thesis (Eliminativism).* (e.g., Rachels). Good on Smith/Jones, bad on Policy/Scalability.
      *   *View 2: The Causal/Counterfactual View.* (e.g., Foot/Quinn). Good on Baseline, bad on Equilibrium cases.
      *   *View 3: The Normative Expectation View.* (e.g., Legal/Role-based). Good on Policy, bad on Universal Ethics.

  8.  **Refining the Tone:**
