answer: |-
  This is a systems problem. You are looking for a control theory of moral responsibility where the variables are *acts*, *omissions*, and *outcomes*, and the output is *liability*.

  Most philosophical literature treats this as a search for moral truth. You are treating it as a search for a stable classifier for post-hoc judgment. That changes the spec. A theory that is metaphysically pure but creates infinite liability (the "typing" problem) is a buggy model. A theory that matches intuition on one case but breaks on equilibrium maintenance (the "reservoir" problem) has poor generalizability.

  Here is the specification for an adequate theory of Doing vs. Allowing, derived from your constraints and the failure modes of existing literature.

  ### The Specification: Requirements for Adequacy

  **1. The Baseline Stability Requirement**
  *   **The Requirement:** The theory must define a "normal course of events" (baseline) that is stable across time and not dependent on the observer's momentary attention.
  *   **The Consideration:** In your reservoir model, "natural flow" is a physical constant, but "target pool level" is a policy choice. If the theory defines "allowing" as "returning to nature," then every dam is a killing. If it defines it as "maintaining status quo," then entrenched injustice is invisible.
  *   **The Case:** *The Reservoir.* A clinician stopping treatment vs. a dam operator opening a spillway. Both allow a system to relax to a lower-energy state (death/downstream). The theory must distinguish which equilibrium is "default" without begging the moral question.
  *   **Source:** Systems theory / Medical futility standards.

  **2. The Causal Locatability Requirement**
  *   **The Requirement:** The theory must be able to assign a timestamp to the moral event, even for omissions.
  *   **The Consideration:** Law requires *actus reus* to be locatable for statutes of limitation and causality chains. Physics says an omission is the absence of an event everywhere and everywhen between $t_1$ and $t_2$. Ethics needs a specific $t$.
  *   **The Case:** *The March Order.* You sign the order to cut funding in March; the patient dies in June. Was the killing in March (act) or June (omission of care)? If the theory says "June," how does it locate an event that didn't happen? If "March," how does it account for the intervening variables?
  *   **Source:** Legal liability / Statutes of limitation.

  **3. The Scalability (Non-Swamping) Requirement**
  *   **The Requirement:** The category of "Allowing" cannot be so broad that it swamps the agent's capacity to process moral obligations.
  *   **The Consideration:** If "allowing" is defined purely counterfactually (I could have prevented X), then you are currently killing everyone you aren't saving. A policy tool that assigns high liability to "allowing" crashes the system because the number of allowings approaches infinity.
  *   **The Case:** *The Typing Agent.* You are allowing harms by not donating your typing fee to malaria nets. If the theory makes this morally equivalent to killing, it fails as a policy guide because no agent can operate under it.
  *   **Source:** Empirical psychology / "Demandingness" objections in utilitarianism.

  **4. The Intervention Asymmetry Requirement**
  *   **The Requirement:** The theory must distinguish between injecting energy/information into a system vs. withholding it, even if the counterfactual outcome is identical.
  *   **The Consideration:** This addresses your aerator case. Physically, the fish dies in both. But in a control system, "forcing term added" (unplugging) is distinct from "forcing term removed" (never plugging). The theory cannot collapse these into pure counterfactuals, or it loses the ability to regulate *intervention*.
  *   **The Case:** *The Aerator.* Unplugging vs. Never Plugging. A policy that treats these identically makes it impossible to regulate active sabotage differently from failure to invest.
  *   **Source:** Criminal law (Commission vs. Omission).

  **5. The Role-Relativity Requirement**
  *   **The Requirement:** The classification of an act as Doing or Allowing must shift based on the agent's defined role in the system.
  *   **The Consideration:** A lifeguard letting a swimmer drown is "killing" (gross negligence/dereliction). A bystander letting a swimmer drown is "allowing." The physical mechanics are identical; the system architecture (role) changes the moral variable.
  *   **The Case:** *The Triage Team.* A doctor turning off a ventilator vs. a stranger walking in and turning it off. One is allowing (withdrawal of futile/allocated care), one is killing (homicide).
  *   **Source:** Medical ethics / Professional fiduciary duties.

  **6. The Moral Weight Variance Requirement**
  *   **The Requirement:** The theory must explain why Killing *usually* carries heavier penalty than Allowing, without asserting they are *always* different in weight.
  *   **The Consideration:** Smith/Jones shows they *can* be equal. But policy generally punishes them differently. A theory that says they are always equal breaks the law. A theory that says they are never equal breaks the Smith/Jones intuition.
  *   **The Case:** *The Bathtub Pair.* Smith (drowns cousin) vs. Jones (watches cousin drown). Intuition says equal blame. Law says unequal. The theory must resolve this tension.
  *   **Source:** Folk morality / Sentencing guidelines.

  ---

  ### Sorting the Requirements

  You asked which are non-negotiable and which are "taste." For a **policy tool** (which is your stated goal), the sorting is as follows:

  **Non-Negotiable (Hard Constraints):**
  *   **Scalability (3):** If the model generates infinite liability, it is computationally useless. You cannot build a grid or triage protocol on this.
  *   **Role-Relativity (5):** Policy is inherently structural. A theory that treats all agents as generic moral atoms cannot govern institutions (hospitals, water agencies).
  *   **Causal Locatability (2):** You cannot adjudicate liability without a timestamp. If the theory cannot locate the omission, it cannot interface with the legal system.

  **Negotiable (Soft Constraints / "Taste"):**
  *   **Moral Weight Variance (6):** This is where the camps fight. A policy *could* decide that Killing and Allowing are always equal (radical reform), or always different (conservative). The theory doesn't *have* to match current intuition, it has to be consistent. This is a tuning parameter, not a structural requirement.
  *   **Intervention Asymmetry (4):** This is the most contentious. Some theories (Equivalence Thesis) say this is a illusion. For policy, you might be able to drop this if you rely heavily on Role-Relativity (i.e., we punish the *breach of role* rather than the physics of the act).

  ---

  ### The Inconsistency Flag: The "Impossible Triangle"

  You asked me to flag if the requirements are jointly satisfiable. **They are not.** There is a fundamental inconsistency between three of your hard constraints. This is the "model error" you are sensing in the literature.

  **The Conflict:**
  1.  **Causal Locatability** requires the omission to be an event at time $t$.
  2.  **Intervention Asymmetry** requires a physical distinction between act and omission (forcing term vs. no forcing term).
  3.  **Role-Relativity** requires the distinction to be normative, not physical (Lifeguard vs. Bystander).

  **The Failure Mode:**
  If you prioritize **Intervention Asymmetry** (Physics), you fail **Role-Relativity**. (Why is the lifeguard different if the physics of the drowning is the same?).
  If you prioritize **Role-Relativity** (Norms), you fail **Causal Locatability**. (The "act" becomes the acceptance of the role months ago, not the moment of death, which breaks the timestamp requirement).
  If you prioritize **Causal Locatability**, you often fail **Scalability**. (To locate the omission, you must identify the specific moment the agent *could have acted*, which explodes the number of potential "crimes" per minute).

  **The Verdict:**
  You cannot have a theory that is simultaneously physically grounded, normatively flexible, and legally locatable. You must choose which variable to treat as the "error term."
  *   **Legal Systems** choose to sacrifice **Intervention Asymmetry**. They admit the physics is the same but punish based on **Role-Relativity** (Duty of Care).
  *   **Libertarian Ethics** choose to sacrifice **Role-Relativity**. They insist on **Intervention Asymmetry** (Negative rights only), which makes the Lifeguard case hard to explain without a contract.
  *   **Utilitarianism** chooses to sacrifice **Intervention Asymmetry** and **Scalability**. It accepts the Smith/Jones equivalence but struggles with the "Typing Agent" overload.

  ---

  ### Scorecard of Standard Positions

  Here is how three common theoretical "architectures" score against your spec.

  **1. The Equivalence Thesis (e.g., James Rachels)**
  *   *Core Claim:* Killing and letting die are morally identical if intentions and outcomes match.
  *   *Spec Performance:*
      *   **Passes:** Moral Weight Variance (resolves Smith/Jones cleanly).
      *   **Fails:** Scalability (leads to overwhelming allowings), Role-Relativity (cannot easily distinguish lifeguard from bystander without ad-hoc additions).
      *   *Verdict:* Good for seminar, bad for policy. It removes the distinction you need to triage resources.

  **2. The Causal/Counterfactual View (e.g., Philippa Foot / Doctrine of Doing and Allowing)**
  *   *Core Claim:* There is a real distinction based on whether the agent initiated a causal sequence or failed to prevent one.
  *   *Spec Performance:*
      *   **Passes:** Intervention Asymmetry (handles the aerator case well), Scalability (limits liability).
      *   **Fails:** Baseline Stability (struggles to define "normal course" in complex systems like reservoirs), Role-Relativity (struggles to explain why the lifeguard's omission is a commission).
      *   *Verdict:* Good for physical systems, bad for institutional systems.

  **3. The Normative Expectation View (e.g., Legal Duty / Institutional Ethics)**
  *   *Core Claim:* The distinction is not ontological but institutional. "Killing" is violating a negative duty; "Letting Die" is violating a positive duty. The weight depends on the duty assigned.
  *   *Spec Performance:*
      *   **Passes:** Role-Relativity (perfect fit), Scalability (limits duties to roles), Causal Locatability (locates breach of duty).
      *   **Fails:** Intervention Asymmetry (admits the physics is identical, which feels unsatisfying to the "realist"), Moral Weight Variance (makes weight arbitrary based on job description).
      *   *Verdict:* **Best fit for your policy goal.** It treats the distinction as a feature of the social operating system, not the physical universe.

  ### Recommendation for Your Reading

  Since you want a theory to sit underneath policy (grid/triage), stop looking for a metaphysical solution to the "Doing vs. Allowing" problem. There isn't one, because the inconsistency flag I raised is real: physics doesn't care about omissions, but policy requires them.

  Look for **Institutional/Contractualist** accounts (e.g., T.M. Scanlon or legal theorists like H.L.A. Hart). They treat the distinction not as a discovery about the world, but as a **boundary condition** we impose on the system to make it runnable.

  The "Distinction" is not a feature of the morality; it is a feature of the *interface* between the agent and the state. It exists to solve the Scalability problem, not the Truth problem. If you read the next article asking "Is this distinction real?", you will stay stuck. If you read asking "What work does this distinction do in a resource-constrained system?", you will find your answer.
