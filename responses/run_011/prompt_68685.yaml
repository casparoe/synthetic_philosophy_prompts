      *   *Check:* Did I use the raw material? Yes, integrated into the requirements.
      *   *Critique:* Make sure not to solve the problem, but to define the *constraints* on the solution. The user wants the spec, not the answer.

  10. **Final Polish:** Ensure the distinction between "ontological" (what exists) and "normative" (what matters) is clear, as that's where the friction lies. (Proceed to generate output).

  *(Self-Correction Note)*: I need to be careful with the "Non-negotiable" sorting. What is non-negotiable for a *policy* tool might be negotiable for a *moral truth* tool. The user specified "policy/judgment." I will anchor the sorting to *policy viability*.

  *(Refining the Inconsistency)*: The biggest inconsistency is between "Physical Symmetry" (physics doesn't care about omissions) and "Moral Asymmetry" (law/ethics does). A theory must bridge this without magic. I need to highlight that the "Baseline" requirement is the primary failure point in most models.

  *(Final Plan)*:
  1. Intro acknowledging the systems background.
  2. The Spec (Requirements 1-6).
