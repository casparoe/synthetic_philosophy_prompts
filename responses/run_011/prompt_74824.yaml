          *   *Lewis's Result:* The draft says "for every A with P(A) > 0 and every B, P(B|A) is either 0 or 1." This is slightly imprecise. The result is that the *algebra* is trivial (only 0 and 1 probabilities for non-trivial propositions) OR that the conditional probability function is trivial *relative to the antecedent*. Specifically, Lewis shows that if the equation holds for all P, then $P(B|A) = P(B)$ (independence) unless the probability space is trivial. Wait, let's recall the specific collapse. Lewis (1976) shows that if $P(A \to B) = P(B|A)$ for all P, then $P(B|A) = P(B)$ (A and B are probabilistically independent) for all A, B where defined. This implies the algebra contains only trivial propositions (probabilities 0 or 1). The draft says "every non-degenerate conditional probability disappears." This is close enough but could be sharper.
          *   *Lewis's Postscript (1986):* The draft says "equation restricted to unembedded conditionals still forces the collapse, provided it is required to hold... for that function conditioned on arbitrary further evidence." This refers to the "Generalized Triviality Result." Lewis argues that even if $A \to B$ isn't in the domain of P, if we require the equation to hold for $P_C(\cdot) = P(\cdot | C)$, we get triviality. The draft's C2 captures this ("Closure under conditioning").
