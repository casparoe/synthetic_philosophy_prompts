answer: |-
  ### 1. Assessment of Your Hypothesis

  Your hypothesis is correct. It is not crude; it is the only practical way to handle the word in a cross-Atlantic publication. You have identified the two distinct semantic functions:

  1.  **Programme (Ideological):** A specific set of policy commitments (usually free markets, limited state, individual rights). Common in Germany, France, and classical theory.
  2.  **Position (Spectral):** A location on a Left-Right spectrum relative to other local actors. Common in the US (where it means Left-of-Centre) and in casual European usage (where "the Liberals" are simply the centre-right party).

  Your observation about polarity is also accurate. In the US, "liberal" is a tribal marker for the Left. In parts of Europe (especially post-Communist states), it can be a slur for the Right (associated with shock therapy). In Germany, it is a neutral descriptor for the Free Democrats (FDP).

  **The Flaw:** Your hypothesis misses one variable: **Time.** A "liberal" in 1900 meant something different than a "liberal" in 2000, even in the same country. However, for a copy desk with ten minutes per item, your Programme/Position distinction is sufficient. It is the right tool for the job.

  ### 2. The Standing Procedure: "The Liberal Protocol"

  This procedure is designed for your sub-editors. It requires no political theory, only context checking.

  **Step 1: The Origin Test (Real Test)**
  *   **Question:** Is the text originally American English, or is it translated/European-commissioned?
  *   **If American English:** Go to Step 2.
  *   **If Translated/European:** Go to Step 3.

  **Step 2: The American Context Check (Judgement Call)**
  *   **Question:** Is the American author using "liberal" to mean "Left-of-Centre" (standard US usage) or "Free-Market" (Classical usage)?
  *   **Clue:** If they mention "New Deal," "rights," or "progress," it is Position (Left). If they mention "Hayek," "free markets," or "classical," it is Programme (Right).
  *   **Verdict:**
      *   **Left/Position:** **LEAVE.** (Standard US usage).
      *   **Free-Market/Programme:** **ANNOTATE.** (See Step 5).
      *   **Unclear:** **ESCALATE TO EDITOR.**

  **Step 3: The European Context Check (Real Test)**
  *   **Question:** Does the word describe a specific party name (e.g., "The Liberal Party") or a policy type (e.g., "Liberal reform")?
  *   **If Party Name:** **ANNOTATE.** (e.g., "the Liberal Party [centre-right]").
  *   **If Policy Type:** Go to Step 4.

  **Step 4: The Policy Consistency Check (Judgement Call)**
  *   **Question:** Do the policies described match the American reader's expectation of "liberal" (state intervention, welfare, regulation)?
  *   **If Yes (Matches US expectation):** **LEAVE.** (The confusion is minimal).
  *   **If No (Contradicts US expectation, e.g., "liberal" tax cuts):** **CHANGE or ANNOTATE.**
      *   *Preference:* Change "liberal" to "market-oriented" or "free-market" if it flows well. If the word is central to the argument, Annotate.
  *   **If the word is used as an insult:** **ESCALATE TO EDITOR.** (See Item 5 below).

  **Step 5: The Annotation/Explanation Standard**
  *   **Annotation Wording:** Keep it in brackets or a footnote. *"[In this context, 'liberal' refers to economic free-market policies, distinct from the American usage.]"*
  *   **Explanation Sentence to Author:** *"We have adjusted the terminology slightly to ensure your argument is not misunderstood by our North American readers, who associate this term with different policies."*
  *   **Escalation Rule:** If changing or annotating the word alters the rhetorical force of the piece (e.g., removing an insult, changing a self-identity claim central to the thesis), send to the Editor. Do not decide this yourself.

  **Honesty Check:**
  *   **Real Tests:** Step 1 (Origin) and Step 3 (Party vs. Policy). These are factual.
  *   **Judgement Calls:** Step 2 (American Intent), Step 4 (Policy Consistency), and the Escalation Rule. These require human interpretation. The procedure cannot remove the need for judgement; it only boxes it.

  ### 3. Running the Procedure on Your Five Items

  **Item 1: German Piece (Tax Cut, Free-Market Party)**
  *   **Step 1:** Translated/European. (Go to Step 3).
  *   **Step 3:** Describes a policy ("liberal reform"), not a party name. (Go to Step 4).
  *   **Step 4:** Policy is a tax cut. This contradicts US expectation of "liberal" (spending).
  *   **Verdict:** **CHANGE.**
  *   **Action:** Render as "market-liberal reform" or "free-market reform."
  *   **Author Note:** *"We have adjusted the terminology slightly to ensure your argument is not misunderstood by our North American readers, who associate this term with different policies."*

  **Item 2: French Essayist (Self-described libéral, High Spending)**
  *   **Step 1:** Translated/European. (Go to Step 3).
  *   **Step 3:** Self-description/Policy type. (Go to Step 4).
  *   **Step 4:** Policy is high spending/regulation. This *matches* US expectation of "liberal," but contradicts the French *libéral* (usually economic right). This is a trap. If you leave it, Americans think he's standard Left. If he is actually a French *libéral* (economic right) arguing for exceptions, the word is misleading.
  *   **Verdict:** **ANNOTATE.**
  *   **Action:** Keep "liberal" but add a bracketed note on first usage: *"[The author uses the European definition of liberal, which emphasizes civil liberties alongside economic regulation.]"*
  *   **Author Note:** *"We have added a brief clarification to ensure your specific definition is clear to our transatlantic audience."*
  *   **Escalation?** No, annotation preserves the author's word while fixing the meaning.

  **Item 3: American Contributor ("Classical liberal, not conservative")**
  *   **Step 1:** American English. (Go to Step 2).
  *   **Step 2:** Explicitly says "classical." This is Programme (Free-Market).
  *   **Verdict:** **ANNOTATE.**
  *   **Action:** Most US readers skip "classical" and hear "liberal." Add note: *"[Classical liberalism emphasizes economic freedom, distinct from modern American liberalism.]"*
  *   **Author Note:** *"We have added a brief clarification to ensure your specific definition is clear to our transatlantic audience."*

  **Item 4: Dutch Correspondent ("The Liberals")**
  *   **Step 1:** Translated/European. (Go to Step 3).
  *   **Step 3:** Describes a party name ("the liberals").
  *   **Verdict:** **ANNOTATE.**
  *   **Action:** *"the Liberals [the centre-right VVD party]"*
  *   **Author Note:** *"We have added the party name for clarity for our international readers."*

  **Item 5: Polish Writer (Term of Abuse for 90s Technocrats)**
  *   **Step 1:** Translated/European. (Go to Step 3).
  *   **Step 3:** Policy/Group type. (Go to Step 4).
  *   **Step 4:** Used as an insult.
  *   **Verdict:** **ESCALATE TO EDITOR.**
  *   **Reason:** The procedure hits the bright line. If you annotate, you dull the insult. If you change it to "neoliberals" (which Americans understand as an insult), you alter the historical specificity. If you leave it, Americans read it as praise. This requires a political judgement on whether *clarity* or *tone* is more important for this specific piece.
  *   **Status:** **The procedure cannot settle this.** It requires your discretion.

  ### 4. Challenging Your Prejudice

  You stated: *"I have insisted that we always preserve an author's own self-description untouched, on the grounds that it is not our business to tell people what they are."*

  This policy does real harm in translation. It prioritizes the **label** over the **meaning**.

  When a French author calls themselves *libéral*, they are reaching into their cultural toolbox and pulling out a specific wrench. When you print that word as "liberal" for an American reader, you are handing them a hammer and telling them it is a wrench. You are not correcting their politics; you are correcting the **transmission of signal**.

  If you leave the French essayist (Item 2) describing himself as "liberal" without context, an American reader will assume he supports the Democratic Party platform. He likely does not. He may support the EU single market and civil liberties while rejecting American-style identity politics. By preserving his self-description untouched, you have made him a liar to your audience. You have forced him into a box he does not occupy.

  **The Harm:** It creates false coalitions. It makes European centre-right economists look like American progressives. It makes American libertarians look like European social democrats.
  **The Fix:** You are not telling the author what they are. You are telling the reader what the author *means*. Fidelity to the author's intent requires changing the word if the word lies in the target language.

  ### 5. Historical Context (No Bibliography)

  To justify the steps above, your desk needs to know why the word broke.

  **The 19th Century Split:**
  Originally, "liberal" meant one thing everywhere: freedom from state coercion. This included economic freedom (free trade, property rights) and civil freedom (speech, religion). This is "Classical Liberalism." In Europe, this meaning stuck. When a German or French person says "liberal," they are often reaching back to this 19th-century definition: less state, more market.

  **The American Drift:**
  In the United States, during the 1930s (the New Deal), the meaning shifted. To save capitalism from the Great Depression, the state had to intervene. American thinkers redefined "liberty." They argued you couldn't be free if you were starving. Therefore, "liberalism" came to mean using the state to ensure welfare and equality. The "Classical" liberals (who wanted less state) were pushed out of the term and eventually migrated into the "Conservative" camp.

  **The European Exception:**
  Europe did not have this clean swap. After WWII, parties that wanted free markets kept the name "Liberal" (like the German FDP). Parties that wanted welfare states called themselves "Social Democrat" or "Labour." So, in Europe, "Liberal" stayed with the free-marketeers.

  **The Post-Communist Twist:**
  In Poland and similar states after 1989, "liberals" were the ones who introduced shock therapy—rapid privatization and price hikes. For many workers, this meant poverty. So in Poland, "liberal" became a slur for "heartless technocrat."

  **Summary for the Desk:**
  *   **US:** Liberal = State Intervention (Left).
  *   **Europe:** Liberal = Market Freedom (Centre-Right).
  *   **Post-Communist:** Liberal = Shock Therapy (Pejorative).

  The procedure works because it treats the word not as a truth, but as a signal that changes frequency depending on where it is broadcast from. Your job is to ensure the receiver hears the right tone.
