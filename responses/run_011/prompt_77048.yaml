      *   **Prompt:** Explain Goodman's autographic/allographic distinction. Use it to determine if an indistinguishable forgery differs aesthetically from the original. Consider an account where forgery is an artistic failure (not just moral).
      *   **Readings:** Goodman (*Languages of Art*), Dutton (essay on forgery), secondary discussion (Week 4). No citations needed.
      *   **Grading Scale:** 0-100. 70+ (First Class), 60-69 (2:1/Competent), 50-59 (2:2/Bare Pass), <50 (Fail).
