      *Self-Correction on Mark:* Wait, if the prompt asks to "Explain Goodman's distinction... and use it to say whether this canvas differs aesthetically," and the student explains the distinction well but gets the *implication* for aesthetics wrong based on the text... Is that a 60-69 error or a 50-59 error?
