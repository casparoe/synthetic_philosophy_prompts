      *   **Question 2:** Does the "supplies" argument (House power of the purse checking the Senate's veto) undermine the "precommitment" framing? Is it a category error to call this a Ulysses contract if the binding is policed by a different set of principals (House/People) via a threat outside the specific mechanism?
