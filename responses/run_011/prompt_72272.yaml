      *   *Scholarly Consensus:* Most modern editors (Cooke, Kramnick, etc.) prefer "facility." The logic is that democracies pass laws too *easily* (impulsively), not that they have the *ability* to do so (which they should have). "Facility" fits the "excess" pairing better (ease and excess). "Faculty" is likely a typesetting error in the original Independent Journal or early printings that got propagated.
