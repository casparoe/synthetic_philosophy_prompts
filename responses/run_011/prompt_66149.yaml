prompt: |-
  Right, I've just spent four hours arguing with a friend about this and I need a referee who isn't either of us. You're a professional philosopher of psychiatry — someone who has actually read Hacking on looping effects and also knows how DSM revisions get made in practice, not just from newspaper coverage. Please think carefully and start with some working notes / brainstorming before you commit to a thesis, then give me the real answer.

  Here's the practice I want pulled apart. Take the DSM (or ICD-11, same shape). Four things it does:

  1. Candidate disorders get parked in an appendix flagged as needing further research, with the proposed criteria written out in full in the manual but no official diagnostic status. Internet gaming disorder, attenuated psychosis syndrome, non-suicidal self-injury, that sort of thing.

  2. Before a category gets promoted into the main text, work groups run field trials: two clinicians independently assess the same patient and the agreement gets scored statistically. Agreement that comes out low means the criteria get rewritten or the category gets dropped.

  3. Almost every criterion set ends with a clause requiring that the disturbance cause clinically significant distress or impairment, plus a clause ruling out reactions that are expected or culturally sanctioned, e.g. after the death of someone close.

  4. The resulting label then works as a gate. No diagnosis, no insurance reimbursement, no school accommodations, no disability determination.

  My friend's line is that (1) is incoherent. On Hacking's picture the whole point of a category like this is that naming it changes the people it would name — people start experiencing and reporting themselves in its terms, clinicians start looking for it, prevalence jumps. So publishing detailed criteria in an appendix isn't a neutral holding pattern, it's already doing the thing the quarantine is supposd to prevent. And if that's right, then (2) is measuring something that moves while you measure it, and (3) pretends there's a pre-diagnostic fact about harm sitting there waiting to be found.

  I think he's overdoing it, but I cant say exactly why, and I don't want to defend the psychiatrists out of reflex.

  So: what does this apparatus presuppose? Reconstruct the implicit theory — of what a disorder is, of what classifying does to the thing classified, of what counts as evidence that a category is real rather than convenient. Then be precise about the distinction I care about most: what the practice strictly cannot do without versus what it merely sits comfortably alongside. Where is it underdetermined, i.e. where would several incompatible theories (natural kinds, interactive kinds, instrumentalism about diagnostic manuals, whatever you think is live) all license exactly the same text? And is the (1)-versus-(2) inconsistency real, or does my friend just need a more careful statement of looping?

  Last bit: tell me what would actually have to change — in the appendix practice, the field trials, the distress clause, the gatekeeping role — if psychiatry decided to design the manual on the assumption that its categories are interactive rather than indifferent. Concrete changes, not vibes.

  British English please, and no reading lists or citations — I'm not checking anything against the literature, I just want the reasoning. Headings are fine.
reasoning: |-
