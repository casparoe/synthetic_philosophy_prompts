      *   *The Appendix (Section III in DSM-5):* This is a "safe space" for research. The logic is: "We think this might be real, but we don't have enough evidence yet. Let's study it without legitimising it fully."
      *   *The Friend's Critique:* By writing the criteria down, you legitimize it. Clinicians start using it off-label. Patients start identifying with it. So the "quarantine" fails.
