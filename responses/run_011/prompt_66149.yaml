      *   *Reconciliation:* The DSM assumes a *lag* time. Looping takes time to propagate. Field trials happen *before* widespread dissemination. The inconsistency isn't logical contradiction but a tension between *epistemic caution* and *performative power*.
      *   *Underdetermination:* The text of the criteria ("5 symptoms for 2 weeks") looks the same whether you think depression is a brain lesion (natural kind) or a social feedback loop (interactive kind). The *use* differs, but the *text* is compatible with both.
      *   *Concrete Changes:* If interactive kinds were accepted:
