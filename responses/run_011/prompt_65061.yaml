answer: |-
  Your diagnosis of the landscape is precise: you have identified not a single debate with entrenched positions, but a collision of incommensurate frameworks masquerading as a single argument. The persistence of the Weber debate, despite a century of null results, suggests that the stalemate is not a failure of data or effort, but a structural feature of how social science conceives of explanation.

  Here is a diagnosis of the impasse, structured by the questions you posed.

  ### 1. Which disagreement is doing the real work?

  The ontological disagreement (Camp 3) is the root, but the disagreement over **causation** (Camp 1 vs. Camp 2) is the engine of the stalemate.

  Camp 1 operates with a model of **efficient causation**. In this worldview, derived largely from the natural sciences and econometrics, a cause is a distinct antecedent condition that varies independently and produces a change in the probability of an outcome. Culture, to be a cause, must be operationalized as a variable that can be isolated from other variables. If you cannot manipulate it or observe its variance without moving other things, it is not a cause; it is noise or a proxy.

  Camp 2 operates with a model of **constitutive causation** (or what philosophers of social science sometimes call "formal" causation). Here, culture does not push behavior like a billiard ball; it defines the board on which the game is played. A religious vocabulary does not "increase the likelihood" of capitalism in a probabilistic sense; it renders the concept of "capitalistic action" intelligible and morally permissible to the actor. You cannot isolate this variable because the actor's psychology and the cultural script are fused.

  The real work is being done by the unacknowledged slippage between these two definitions. When Camp 1 says "Weber was wrong," they mean "The variable 'Protestantism' does not predict the variable 'Capitalism' controlling for confounders." When Camp 2 says "Weber was right," they mean "The historical emergence of a specific moral vocabulary was a necessary condition for the modern economic mindset to cohere." Both can be true simultaneously, because they are answering different questions. The debate persists because both sides insist they are answering the *same* question.

  ### 2. Are null results evidence, or is the thesis immunized?

  This is the crux of your asymmetry puzzle. Why do null results not degrade the thesis's standing?

  To Camp 1, the thesis is a hypothesis about **variance**. If variation in religion does not correlate with variation in economic behavior, the hypothesis is falsified. From this vantage point, Camp 2's retreat to "intelligibility" looks exactly like an immunizing maneuver. It moves the goalposts from "Did this happen?" to "Does this make sense?"—a question that is immune to empirical disconfirmation.

  However, to Camp 2, Camp 1's null results are not counter-evidence; they are **category errors**. If Weber's claim is that ideas act as "switchmen" (directing the track of interest) rather than the "engine" (providing the energy), then looking for the switchmen's energy output is a mistake. You cannot measure the causal weight of a norm by regressing it against behavior, because the norm is what gives the behavior its meaning. A null result in a variance decomposition cannot refute a claim about the *conditions of possibility*.

  Is this legitimate clarification or protectionism? It is legitimate **if** the interpretive side can specify what would count as disconfirmation within their own framework. If the claim is merely that the ethic made capitalism "thinkable," it is hard to falsify. But if the claim is that specific doctrinal shifts *preceded* specific shifts in commercial practice in a way that cannot be explained by material incentives alone, that is historically falsifiable.

  The impasse arises because Camp 2 often refuses to specify observable implications, fearing reductionism, while Camp 1 refuses to accept process-based evidence, fearing anecdotalism. The thesis survives because Camp 2 has successfully framed the Weber thesis as a foundational myth of modernity—a story about who we are—rather than a testable model of economic growth. Myths are not refuted by regressions.

  ### 3. Is the question ill-posed, or only hard?

  The question "Can culture be a cause?" is **ill-posed** because it presupposes a singular ontology of "cause" that does not exist in the social world.

  It assumes culture and economy are separable entities that can interact. Camp 2's strongest argument is that they are not separable; economic action is always already culturally encoded. To ask if culture caused capitalism is like asking if grammar caused a sentence. Grammar doesn't "cause" the sentence in a mechanical sense; it makes the sentence possible.

  The question is not just hard; it is a category mistake. It asks for a variable analysis of a constitutive condition. As long as the debate is framed as "How much of capitalism is explained by culture?" (a quantity question), Camp 1 will win on data, and Camp 2 will win on plausibility, and they will never meet.

  ### 4. What would count as progress?

  Given this diagnosis, more data (Camp 1) or more hermeneutics (Camp 2) will not resolve the impasse. Progress requires a **reformulation of the explanandum** and a **bridge methodology**.

  **The Reformulation:**
  Stop asking "Did culture cause capitalism?" and start asking "How do symbolic systems constrain and enable economic action?" This shifts the focus from *attribution of variance* (how much credit does culture get?) to *mechanisms of transmission* (how does a belief become a behavior?). This allows Camp 1 to look for mechanisms rather than just correlations, and allows Camp 2 to ground meaning in observable action.

  **The Bridge Methodology:**
  The missing link is **process tracing** or **mechanism-based explanation**. This approach does not demand the isolation of variables (satisfying Camp 2's concern about complexity) but does demand rigorous evidence of causal chains (satisfying Camp 1's concern about evidence).
  *   Instead of asking "Did Protestant towns grow faster?", ask "Did Protestant merchants use different accounting practices, justify them using different vocabularies, and exclude non-Protestants from networks based on those vocabularies?"
  *   This treats culture not as a variable, but as a **toolkit** (to borrow a term from the third camp) that actors use strategically.

  **The Verdict on Progress:**
  You should not expect a final verdict on whether Weber was "right." That expectation is what fuels the stalemate. Progress would look like a dissolution of the question. The field advances when scholars stop trying to prove the Weber thesis and start using its insights to build more granular models of how moral vocabularies interact with material incentives.

  If your column needs a conclusion, it is this: The Weber debate endures not because the answer is elusive, but because the question is a mirror. Camp 1 sees a scientific problem to be solved; Camp 2 sees a humanistic truth to be interpreted. The "Weber Thesis" is no longer a hypothesis; it is a boundary object that allows two different epistemic communities to occupy the same space while speaking different languages. The progress lies not in declaring a winner, but in exposing the translation error.

  For your readers, the takeaway is that "culture as a cause" is not a puzzle to be solved, but a distinction to be maintained. We must distinguish between culture as a **push** (a variable that changes outcomes) and culture as a **prism** (a medium through which all outcomes are viewed). Until social science agrees on which metaphor governs a specific inquiry, the debate will run on parallel tracks, much like the switchmen Weber described.
