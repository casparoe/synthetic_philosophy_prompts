          *   *Economic interpretation:* Stated preference $\neq$ Revealed preference. RPT commits you to trusting the choice *if* constraints are clear. Here, constraints are clear (pay or see ads). The inference "they value money more than ad-free" is valid. The inference "they lied in the survey" is also valid.
