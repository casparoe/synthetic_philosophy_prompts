  2.  **Deconstruct Revealed Preference Theory (RPT) for this Context:**
      *   *Core Axiom:* If a consumer chooses bundle A over bundle B when both are affordable/available, they reveal a preference for A over B.
      *   *Caveats (The "Gotchas"):*
          *   **Constraint Set:** Were both actually available? (e.g., dark patterns hide B).
          *   **Information:** Did they know what A and B were? (e.g., hidden data usage).
          *   **Cognitive Cost:** Was choosing B too hard? (e.g., hidden behind 3 menus).
          *   **Consistency:** Do they keep choosing A over time, or just once? (WARP - Weak Axiom of Revealed Preference).
          *   **Welfare:** RPT says nothing about *welfare* (is it good for them?), only ranking.
      *   **Application to Tech:** Tech interfaces manipulate constraints, information, and cognitive cost constantly. This makes standard RPT inferences dangerous.

