answer: |-
  Here is the **Revealed Preference Sanity Check (RPSC)**. It is designed to be run by a PM or Researcher in a pre-meeting prep slot (15 mins). It is not a legal compliance tool; it is a validity tool. It tells you when your data supports a claim about *value* and when it only supports a claim about *friction*.

  ### The Revealed Preference Sanity Check (RPSC)

  **Input:** A specific user action (click, accept, retain, purchase) you want to cite as evidence of user value.
  **Output:** "Valid Inference," "Invalid Inference," or "Insufficient Data."

  #### Step 1: The Menu Test (Availability)
  *Question:* At the moment of decision, were at least two distinct options visibly available and functionally accessible without leaving the screen?
  *   **Pass:** Option A and Option B are both on-screen, labeled clearly, and clickable.
  *   **Fail:** Option B is hidden behind a link, in a different menu, or requires navigation to a settings page.
  *   **Termination:** If **Fail**, stop. You are measuring friction, not preference. You cannot claim users value A over B.
  *   **⚠️ JUDGMENT FLAG:** Defining "visibly available." Is it above the fold? Does "More Options" count? *Rule of thumb: If it requires a second click to see the alternative, it fails.*

  #### Step 2: The Friction Test (Cost)
  *Question:* Is the cognitive or time cost of selecting Option A roughly equal to Option B?
  *   **Pass:** Both options require one click. Default settings do not pre-select the high-value-to-business option.
  *   **Fail:** Option A is one click; Option B is three clicks, or requires reading a wall of text, or the default is A and users must opt-out to B.
  *   **Termination:** If **Fail**, stop. You are measuring inertia or fatigue, not preference.
  *   **⚠️ JUDGMENT FLAG:** "Roughly equal." A 2-second delay vs. instant is a fail. A 0.5-second animation difference is pass. Use your best sense of "annoyance."

  #### Step 3: The Knowledge Test (Information)
  *Question:* Did the user have sufficient information to understand the consequence of the choice *before* clicking?
  *   **Pass:** The label describes the outcome (e.g., "Pay $5 to remove ads").
  *   **Fail:** The label is vague (e.g., "Continue," "Agree," "Next") or the consequence is disclosed only after the click or in a separate policy document.
  *   **Termination:** If **Fail**, stop. You are measuring compliance or confusion, not preference.
  *   **⚠️ JUDGMENT FLAG:** "Sufficient information." You must decide if a tooltip is enough or if it needs to be inline. *Conservative rule: If the consequence is data-related, inline text is required.*

  #### Step 4: The Reversibility Test (Consistency)
  *Question:* Can the user undo the choice easily, and do logs show they stick with it?
  *   **Pass:** User can reverse the decision in <3 clicks, and <10% reverse it within 7 days.
  *   **Fail:** User cannot reverse it, or >20% reverse it within 7 days (churn/regret).
  *   **Termination:** If **Fail**, the initial choice was likely noise, error, or coercion. Do not cite as stable preference.
  *   **⚠️ JUDGMENT FLAG:** The 7-day window and 10% threshold are arbitrary. Adjust based on your app's cycle, but document the threshold before looking at data.

  #### Step 5: The Welfare Wall (The Hard Stop)
  *Question:* Are you claiming this choice is *good* for the user, or just that they *ranked* it higher?
  *   **Pass:** Claim is "Users ranked A over B in this context."
  *   **Fail:** Claim is "Users want this," "Users love this," or "This improves user wellbeing."
  *   **Termination:** If you cannot rephrase the claim to remove "want/love/benefit," **STOP**. RPT never licenses welfare claims.
  *   **⚠️ JUDGMENT FLAG:** This is the most common failure point. Distinguishing "addiction" from "preference" is impossible via logs alone. If the feature exploits loss aversion (e.g., streaks), you cannot claim preference.

  ---

  ### Running the RPSC on Your Live Cases

  #### Case 1: 92% Accept Full Data-Sharing (Single "Agree" vs. "More Options")
  *   **Step 1 (Menu):** **FAIL.** "More options" is a hidden menu. The alternative was not visibly available on the primary decision plane.
  *   **Step 2 (Friction):** **FAIL.** "Agree" is 1 click. "More options" is 1 click + reading + selecting. Asymmetric friction.
  *   **Step 3 (Knowledge):** **Borderline.** Depends on what "Agree" implies, but usually fails the inline consequence test for data.
  *   **Step 4 (Reversibility):** Irrelevant (already failed).
  *   **Step 5 (Welfare):** Irrelevant.
  *   **Verdict:** **INVALID INFERENCE.**
  *   **The Hard Truth:** You cannot claim users value data sharing. You can only claim users value *speed* over *privacy configuration* when privacy configuration is made difficult. This is a dark pattern by definition.
  *   **What needs to change:** To license a preference claim, you must present "Accept All" and "Reject All" (or "Configure") side-by-side with equal visual weight and single-click access. If acceptance drops to 40%, *that* is the revealed preference. The 92% is revealed friction tolerance.

  #### Case 2: Free-Tier Ads vs. Survey Price (Behavior contradicts Survey)
  *   **Step 1 (Menu):** **PASS.** Pay or watch ads. Both options visible.
  *   **Step 2 (Friction):** **PASS.** Paying is friction, watching is friction. Both are the intended "costs."
  *   **Step 3 (Knowledge):** **PASS.** Users know ads are the cost of free.
  *   **Step 4 (Reversibility):** **PASS.** They consistently choose free over time.
  *   **Step 5 (Welfare):** **PASS (if phrased correctly).** You can claim "In this context, users rank keeping $X higher than removing ads."
  *   **Verdict:** **VALID INFERENCE (about ranking, not truthfulness).**
  *   **The Hard Truth:** Revealed preference theory commits you to trusting the *choice* over the *survey*. Surveys are "cheap talk"; spending money/time is "costly signaling." The inference is valid: they value the money more than the ad-free experience *at that price point*.
  *   **Caveat:** Do not claim they "lied" in the survey. Claim the context changed (survey was hypothetical, app is real). Do not claim the ad-free tier is "bad value." Claim it is "priced above their current willingness-to-pay."

  #### Case 3: Aggressive Streak Feature (Retention as Preference)
  *   **Step 1 (Menu):** **FAIL.** Users did not choose the aggressive version; you assigned it via A/B test. There was no menu.
  *   **Step 2 (Friction):** **N/A.** No choice was made.
  *   **Step 3 (Knowledge):** **N/A.**
  *   **Step 4 (Reversibility):** **FAIL.** Retention is not reversibility. Staying in the app is not the same as choosing the feature. They may be staying *despite* the feature due to network effects or data lock-in.
  *   **Step 5 (Welfare):** **FAIL.** "Retained better" is being used to imply "preferred." This is the welfare wall violation. Aggressive streaks often exploit loss aversion (fear of breaking the chain), which is psychologically distinct from positive preference.
  *   **Verdict:** **INVALID INFERENCE.**
  *   **The Hard Truth:** Retention is a *business metric*, not a *preference signal*. You have zero evidence users prefer the aggressive streak. You only have evidence that the aggressive streak increases *switching costs* or *anxiety*.
  *   **What needs to change:** To claim preference, you must offer a choice: "Daily Reminder: Aggressive vs. Gentle vs. Off." If they select Aggressive and keep it (Step 4), then you have a preference claim. Until then, call it "Engagement Lift," not "User Preference."

  ---

  ### Summary of Failures
  **Case 1 and Case 3 come out badly.**
  *   **Case 1** is a legal/compliance bomb. Using that 92% to justify data practices is indefensible under modern privacy frameworks (GDPR/CCPA require "freely given, specific, informed, and unambiguous" consent; hidden menus violate "freely given").
  *   **Case 3** is a product delusion. Confusing retention with preference leads to building addictive loops that churn users in the long term once the novelty/anxiety wears off.

  ### What This Procedure Can Never Deliver
  Even if you pass all 5 steps, the RPSC cannot tell you:

  1.  **Welfare:** It cannot tell you if the choice makes the user happier, healthier, or wealthier. A user can consistently reveal a preference for self-harmful habits. RPT is morally neutral; your research note cannot be.
  2.  **Latent Demand:** It cannot tell you what users would value if the option didn't exist yet. It only evaluates existing menus.
  3.  **Context Stability:** It cannot guarantee the preference holds outside the app environment (e.g., a user might reveal a preference for cheap data in-app but value privacy highly in a voting booth).
  4.  **The "Why":** It tells you *that* they chose, not *why*. (e.g., They chose "Agree" because they value the feature, or because they are tired of popups). You need qualitative work for the "why."

  **Final Advice for the Review:** When Legal or Product pushes back, do not argue opinion. Run the RPSC live on the whiteboard. If a step fails, the claim is dead. If they want the claim to live, they must fix the design to pass the step. Move the fight from "interpretation" to "constraints."
