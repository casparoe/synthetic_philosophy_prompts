  ### The Social Discount Rate Decision Tree

  **The Setup:** Imagine a climate policy that costs people alive today \$1,000 each to prevent damages of \$1,000 per person to those living one hundred years from now. To decide if this policy is worth it, we must choose a "social discount rate." This number determines how much less we value that future \$1,000 compared to today's \$1,000.

  Follow the path that matches your intuition about where this number comes from and what it means.

  **Node 1: The Source of Authority**
  When setting this rate, are we trying to **measure** a fact about the economy (like measuring inflation), or are we making a **judgment** about justice (like setting a minimum wage)?
  *   **Measure a fact:** Go to Node 2.
  *   **Make a judgment:** Go to Node 6.

  **Node 2: The Data Source**
  If this is a measurement, should we look at the interest rates people actually accept in financial markets today, or should we calculate the statistical risks of the future economy?
  *   **Financial markets:** Go to Node 3.
  *   **Statistical risks:** Go to Node 5.

  **Node 3: The Horizon Test**
  Market interest rates are usually for loans of 10 or 30 years. Should we assume the rate for 100 years is the **same** as the rate for 30 years, or should we expect it to **change** over time?
  *   **Same (Constant):** Go to Node 4.
  *   **Change (Declining):** Go to Node 5.

  **Node 4: Market Validity**
  If we use the current market rate for the long term, do we trust that investors are rational about the future, or do we believe markets are too short-sighted to be moral guides?
  *   **Investors are rational:** **Leaf: The Descriptive View.** (We should simply read the rate off observed market returns.)
  *   **Markets are short-sighted:** **Leaf: The Political Decision.** (The calculation is a political decision dressed up as arithmetic; if markets fail, politicians must choose.)

  **Node 5: The Nature of Uncertainty**
  If the rate should change or be based on risk, is the main problem that we don't know how **rich** the future will be, or that we aren't sure humanity will **survive**?
  *   **Don't know wealth (Growth Uncertainty):** **Leaf: The Uncertainty View.** (Uncertainty about future growth makes the rate fall as the horizon lengthens.)
  *   **Not sure survive (Existence Risk):** **Leaf: Positive Time Preference (Extinction).** (Positive pure time preference is justified by the chance that there will be no one left to receive the future's benefits.)

  **Node 6: The Decision Maker**
  If this is a judgment about justice, should the rate be set by **elected officials** balancing competing demands, or by **experts** applying consistent moral rules?
  *   **Elected officials:** **Leaf: The Political Decision.** (The whole calculation is a political decision dressed up as arithmetic.)
  *   **Consistent moral rules:** Go to Node 7.

  **Node 7: The Basis of Difference**
  Suppose we know for certain that future people will exist. Should their well-being count for less than ours **solely** because they are born later in time?
  *   **Yes (Time matters):** Go to Node 8.
  *   **No (Time doesn't matter):** Go to Node 9.

  **Node 8: The Justification for Time**
  If time matters, is it because there is a **risk** they won't exist, or simply because we naturally care less about **distant** generations?
  *   **Risk they won't exist:** **Leaf: Positive Time Preference (Extinction).** (Positive pure time preference justified by the chance that there will be no one left.)
  *   **Care less (Impatience):** **Leaf: Standard Positive Time Preference.** (Added Leaf: Positive pure time preference based on intrinsic impatience.)

  **Node 9: The Wealth Factor**
  If time doesn't matter, does it matter that future people will likely be much **richer** than we are?
  *   **Yes (Wealth matters):** Go to Node 10.
  *   **No (Suffering is equal):** **Leaf: Pure Time Preference = 0.** (Pure time preference is an ethical defect that should be set at or near zero.)

  **Node 10: The Inequality Check**
  If wealth matters, should we invest less because a dollar is worth less to a rich person, or invest more to protect them from catastrophe regardless of wealth?
  *   **Invest less (Diminishing returns):** **Leaf: Inequality Aversion.** (Added Leaf: Discounting driven by the expectation that future generations will be wealthier.)
  *   **Invest more (Catastrophe avoidance):** **Leaf: Pure Time Preference = 0.** (Pure time preference is an ethical defect that should be set at or near zero.)

  ***

  ### Analysis of the Logical Space

  **Indistinguishable Leaves**
  This tree cannot fully separate **Positive Time Preference (Extinction)** from **Standard Positive Time Preference (Impatience)**.
  *   *Why:* Both leaves result in a positive discount rate, reducing the present value of the future. Without asking the respondent *why* they chose the path (risk vs. preference), the policy outcome looks identical: we spend less today. The mathematical output is the same, even if the ethical justification differs.

  **The Empty Region**
  There is a combination of answers the logical space permits but almost nobody defends: **Standard Positive Time Preference (Impatience) combined with the Uncertainty View (Declining Rate).**
  *   *Why:* This region is empty because the views are **incoherent** when paired. The "Uncertainty View" argues the rate should fall over time because we are unsure about future growth; this argument typically relies on treating all generations equally (zero pure time preference). The "Impatience View" argues we discount the future simply because it is distant; this implies a constant discount rate regardless of uncertainty. Holding both views simultaneously suggests you are both impatient *and* unsure, but standard economic theory suggests if you are truly uncertain about the horizon, your impatience should not be the dominant factor. It is an unstable position that collapses into one side or the other upon scrutiny.

  **Added Leaves**
  I added **Standard Positive Time Preference (Impatience)** and **Inequality Aversion**.
  *   *Reason:* The prompt's required leaves skipped the most common "middle ground" economic view (that we discount simply because we are impatient, not just because of extinction risk) and the specific mechanism of "future wealth" (inequality aversion) which is distinct from "time preference." Without these, the tree would force readers who believe future people count less *because they are rich* into the "Time Preference = 0" bucket, which is inaccurate.
