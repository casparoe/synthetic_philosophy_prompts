          *   *Synthesis:* Cautious, critical interest. He would demand rigorous falsification. He would warn against "holistic" claims. He would approve of the policy intervention aspect. He might admit his critique of *prediction* was too sweeping, but maintain his critique of *historicism* (inevitability/meaning).

