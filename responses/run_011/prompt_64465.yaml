answer: |-
  Here is the architecture for a 90-minute whiteboard session, designed to move from engineering intuition to philosophical friction without getting bogged down in exegesis.

  ### 1. Dependency Order: The Pre-Requisites for §§65–67
  You cannot drop *Family Resemblance* on this group immediately. Their training (and the architecture of the models they build) presupposes that categories are defined by latent features or decision boundaries. If you present the solution before they feel the problem, they will treat it as a "fuzzy clustering" optimization rather than a logical critique.

  You must establish these three premises in this specific order before opening the *Investigations*:

  1.  **The Essentialist Intuition (The "Schema" Assumption):**
      *   *Goal:* Make explicit their hidden assumption that for a word (or label) to be meaningful, there must be a necessary and sufficient condition shared by all instances (a "common core" feature vector).
      *   *Whiteboard Move:* Draw a circle labeled "X". Ask: "What feature vector must every point inside possess to be in this set?" Validate that this is how they build classifiers.
  2.  **The Failure of Ostension (The "Pointing" Problem):**
      *   *Goal:* Show that pointing to an instance (or providing a few-shot example) does not transmit the *rule* for the category.
      *   *Whiteboard Move:* Point to a "file" on your desktop. Ask: "Did I just show you the concept 'file', or 'icon', 'rectangle', 'text', or 'asset'?" Establish that context determines the reference, not the object itself.
  3.  **The Functional Shift (From Picture to Tool):**
      *   *Goal:* Shift the frame from "Language describes reality" (representationalism) to "Language does something" (pragmatism).
      *   *Whiteboard Move:* Contrast a `print()` statement (describing state) with an `assert()` statement (enforcing a rule).
      *   *Why this matters:* §§65–67 only make sense if they already accept that words are tools used for purposes, not just labels for essences.

  ### 2. The Carrying Example: "Interface"
  Do not use "Game." Use **"Interface"**.

  *   **Why this works:** It is ubiquitous in their vocabulary but lacks a single technical essence across contexts.
  *   **Instances to plot on the board:**
      1.  A REST API endpoint.
      2.  A GUI button.
      3.  A human handshake (social interface).
      4.  A USB-C port (hardware interface).
      5.  An abstract base class in Python.
  *   **What it must exhibit:**
      *   **Overlapping similarities:** APIs and Classes have signatures; Handshakes and GUIs have user interaction; Hardware and APIs have protocols.
      *   **No common core:** There is no single feature (code, physical, human, digital) present in all five.
      *   **Functionality:** All serve to mediate interaction between two systems.
  *   **What it must not invite:**
      *   **Do not** allow them to define it as "a boundary." (A handshake isn't strictly a boundary).
      *   **Do not** allow them to reduce it to "input/output." (A handshake is symmetric; an API is often request/response).
      *   **Crucial Constraint:** If they try to embed these, the vector for "Handshake" will be distant from "REST API." Yet, if someone says "The handshake failed" during an API call, they are speaking correctly. The *concept* holds despite the *distance*.

  ### 3. Misconceptions: Sequence and Intervention
  These will surface naturally as you move from "Resemblance" to "Games." Head them off at these exact junctures.

  **Misconception A: "Family Resemblance is just Prototype Theory / Nearest-Neighbor."**
  *   **When it surfaces:** Immediately after you draw the overlapping circles of the "Interface" examples (§66). They will say: *"So the prototype is the centroid, and we just check distance. Embeddings do this."*
  *   **Intervention:** **Contest it.**
  *   **Why:** Prototype theory is a *psychological* claim about how humans store categories (descriptive). Wittgenstein is making a *logical* claim about what justifies the *application* of a rule (normative).
  *   **The Kill Shot:** "Embeddings generalize from *past* co-occurrence. Family Resemblance explains how a *novel* instance (e.g., a brain-computer interface) can be correctly identified as an 'Interface' even if it is an outlier in vector space. If meaning were just nearest-neighbor, innovation would be linguistically impossible."

  **Misconception B: "Meaning-is-Use is a trivially true empirical hypothesis about co-occurrence."**
  *   **When it surfaces:** When you transition to Language Games (§7–10). They will say: *"Meaning is use? That's just distributional semantics. Word2Vec proved this."*
  *   **Intervention:** **Contest it.**
  *   **Why:** Co-occurrence tells you what *does* happen. Meaning-as-Use tells you what *counts* as happening.
  *   **The Kill Shot:** "If I run a script that outputs valid SQL but deletes the database, the co-occurrence patterns are identical to a safe script. But the *use* is different. Meaning involves the *consequences* and *rules* of the move, not just the statistical shadow it casts."

  **Misconception C: "Language Games leave no room for correct and incorrect use."**
  *   **When it surfaces:** Near the end (§81). They will argue: *"If rules are just social agreements, isn't anything valid if the group agrees?"* (Relativism).
  *   **Intervention:** **Contest it.**
  *   **Why:** Games have rules that constrain moves. You cannot move a bishop like a knight, even if you really want to.
  *   **The Kill Shot:** "In a language game, you can make a *mistake*. If 'meaning is use' meant 'anything goes,' debugging would be impossible. There is a normative standard (the rule of the game) against which use is measured."

  ### 4. Closing: The Diagnostic Question
  Do not ask "Does this make sense?" (They will nod politely). Ask a question that forces them to choose between a statistical view and a normative view.

  **The Question:**
  > "We fine-tune a model on a dataset where the word 'bank' appears 90% in financial contexts and 10% in river contexts. The model learns a vector representation.
  >
  > If a user then says, 'I'm going to the bank to fish,' and the model corrects them to 'financial institution,' has the model failed to understand the **meaning**, or has it simply failed to match the **distribution**?"

  *   **Those who are merely agreeable** will say: "It failed the distribution / It's a hallucination / It needs better data." (They stay in the empirical/descriptive frame).
  *   **Those who have the idea** will say: "It failed the meaning. It treated the word as a statistical object rather than a move in a game where 'fishing' licenses the 'river' sense regardless of probability." (They grasp the normative/logical frame).

  ### 5. Explicit Deferrals
  You have 90 minutes. Do not gesture at these three topics. Explicitly write them on the board under a "Parking Lot" header and state: *"These are the next three sessions. Today we do not touch them."*

  1.  **Rule-Following (§201):** The paradox that no rule determines its own application. (Too skeptical for day one).
  2.  **Private Language (§243):** Whether an internal sensation can be named without public criteria. (Too metaphysical).
  3.  **Forms of Life (p. 226):** The bedrock of agreement that makes language games possible. (Too anthropological).

  **Session Flow Summary:**
  *   **00–20:** Dependency Setup (Essentialism → Failure → Function).
  *   **20–40:** The "Interface" Example (Whiteboard the overlaps).
  *   **40–55:** §§65–67 (Family Resemblance) + **Contest Misconception A**.
  *   **55–70:** Language Games (Meaning-as-Use) + **Contest Misconception B**.
  *   **70–80:** Normativity (Right/Wrong moves) + **Contest Misconception C**.
  *   **80–90:** Diagnostic Question + Deferrals.
