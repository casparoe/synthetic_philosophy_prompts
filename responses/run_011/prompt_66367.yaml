      *   *Insight:* The franchise *constitutes* the people; it's not just administrative. (e.g., Scotland 2014: 16-17 year olds + residents only).
      *   *Problem:* If the franchise defines the people, and the people justify secession, isn't this circular? (The Democratic Boundary Problem).
      *   *Solution/Niche:* Focus specifically on *referendum franchise design* as a normative act of self-determination, distinct from the abstract boundary problem.
      *   *Drafting the Question:* It needs to be answerable. Not "Does franchise matter?" (Yes). Not "What is the right franchise?" (Too broad).
      *   *Refined Question:* "Does the normative justification for a secession referendum constrain the design of its franchise, or is franchise design a discretionary political choice independent of the secession claim?"
      *   *Even Better:* "To what extent does the normative ground of a secession claim (remedial vs. primary) dictate the eligible electorate in a self-determination referendum?"
      *   *Best (Precise):* "Does the normative justification for secession entail a specific franchise for the authorizing referendum, or is the composition of the electorate a discrete political decision independent of the secession claim itself?"

  3.  **Address the Existing Literature (Remedial vs. Primary):**
      *   Remedial (Buchanan, etc.): Secession is a remedy for injustice.
      *   Primary/Plebiscitary (Beran, etc.): Secession is a right of choice.
      *   *The Gap:* Both assume the territory defines the voters. If Remedial, maybe only victims should vote? If Primary, maybe everyone affected? Neither theorizes the *franchise* itself as part of the right. They treat it as procedural, not constitutive.

  4.  **Develop the Methodology:**
      *   *Constraints:* 3 months, article length.
      *   *Not:* Pure conceptual analysis (too abstract), Comparative Constitutional Survey (too empirical/descriptive), Formal Treatment (too technical).
      *   *Yes:* Normative case study reconstruction. Take specific cases (Scotland, Quebec, Catalonia) and reconstruct the *arguments made* about the franchise, then test them against the normative theories.
      *   *Plan:* Month 1: Literature & Case Selection. Month 2: Normative Reconstruction. Month 3: Synthesis & Drafting.

  5.  **Define Potential Results:**
      *   Outcome A: Franchise is derivative (Theory X demands Franchise Y).
      *   Outcome B: Franchise is independent (Political choice).
      *   Outcome C: Hybrid (Core vs. Peripheral voters).
      *   *Deciding Factors:* Consistency with the underlying right (remedial vs. choice) and avoidance of circularity.

  6.  **Address the Failure Condition (Democratic Boundary Problem):**
      *   Risk: Ending up saying "We need a demos to decide the demos."
      *   Distinction: This project looks at *second-order* decisions within an existing constitutional order (referendum rules), not the *first-order* creation of a state.
      *   Failure: If I can't distinguish the referendum franchise from the constitutional boundary problem.

  7.  **Scope Assessment:**
      *   Cut: General theory of secession, full constitutional history of cases.
      *   Promise: A normative framework for franchise design in referendums.
      *   Don't Promise: A new theory of secession or a legal blueprint.

