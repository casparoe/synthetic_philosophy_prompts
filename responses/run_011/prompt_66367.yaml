answer: |-
  **Project Title:** The Constitutive Vote: Franchise Design and the Normative Grounds of Secession

  **Project Summary**

  When a region votes on independence, the most consequential decision often occurs before the campaign begins: it is the decision about who is allowed to vote. In the 2014 Scottish independence referendum, the franchise was extended to sixteen- and seventeen-year-olds and restricted to residents, excluding many Scottish-born citizens living elsewhere. This was not merely administrative; it was a substantive claim about who constitutes the "Scottish people." Yet, in political theory, the literature on secession treats the composition of the electorate as a secondary, procedural matter. This project asks whether the normative justification for secession dictates the design of the referendum franchise, or whether the electorate is a discretionary political choice independent of the secession claim itself.

  **Research Question and Literature Gap**

  The central research question is: **Does the normative justification for a secession claim (remedial vs. primary) entail a specific eligible electorate for the authorizing referendum, or is franchise design a discrete political decision independent of the secession claim?**

  Current normative theory is organised around two dominant positions. The *remedial-right-only* view holds that a group may secede unilaterally only to escape sustained, grave injustice. The *primary* (or plebiscitary) view holds that a clear majority in a fair vote is sufficient to ground the claim. While these positions disagree sharply on *when* a group may leave, they share a tacit assumption: that the electorate is settled once the territory is identified. On both accounts, the question of "who votes" is downstream of "where the border is."

  This proposal argues that this assumption is false. The franchise does independent normative work; it does not merely implement a prior result but helps constitute the agent claiming self-determination. Neither existing position settles the question of the franchise. A remedial theorist might argue that only the victims of injustice should vote, yet standard accounts assume all residents of the territory vote regardless of victimhood. A primary theorist might argue that all affected parties should vote, yet standard accounts restrict the vote to territorial residents. The gap here is not a concession both sides would make; it is a blind spot. By treating the franchise as procedural, both sides ignore that different franchise designs render different claims about self-determination true. If the project succeeds, it will show that one cannot coherently hold a position on the right to secede without a corresponding position on the composition of the referendum electorate.

  **Methodology and Work Plan**

  Over the three-month funding period, I will move from diagnostic reconstruction to normative argumentation. I will not undertake a purely conceptual analysis of "the people," which risks abstraction, nor a comparative constitutional survey, which describes rules without evaluating their normative force. Nor will I pursue a formal treatment of franchise design, which often obscures the political stakes behind mathematical thresholds. Instead, I will employ a method of *normative reconstruction*. I will treat specific referendum franchises not as data points, but as implicit arguments about political membership that can be tested against explicit normative theories.

  *Month 1: Literature and Case Selection.* I will finalize the review of secession literature to map exactly where the franchise assumption occurs. Simultaneously, I will select three paradigmatic cases for reconstruction: Scotland (2014), Quebec (1995), and Catalonia (2017). These cases vary the contested variable: Scotland contested age and residency; Quebec contested constitutional standing and residency; Catalonia contested legal authority and residency. I will gather primary documents regarding the legislative debates on franchise design in each case.

  *Month 2: Normative Reconstruction.* I will reconstruct the implicit normative claims made by each franchise design. For example, by including sixteen-year-olds, did Scotland assert that self-determination is a matter of future stakeholding rather than past contribution? By excluding non-residents, did they assert that subjection to law trumps national identity? I will then test these implicit claims against the explicit requirements of remedial and primary theories. Does the Scottish franchise align with a remedial right? Does the Quebec franchise align with a primary right?

  *Month 3: Synthesis and Drafting.* I will draft the article, moving from the reconstruction to a positive argument. The goal is to determine if there is a "fit" requirement between the justification for secession and the design of the vote. I will write with the aim of submission to a peer-reviewed journal in political theory or law and philosophy.

  **Potential Results**

  The article will likely conclude in one of three ways, decided by the consistency of the reconstructed cases with normative theory:

  1.  **The Derivative Conclusion:** The justification for secession *does* constrain the franchise. (e.g., If secession is remedial, the franchise must be restricted to the aggrieved group; if plebiscitary, it must include all affected).
  2.  **The Discretionary Conclusion:** The justification for secession is independent of franchise design. The right to secede is distinct from the procedural rules of the vote, which are matters of constitutional negotiation rather than normative right.
  3.  **The Hybrid Conclusion:** There is a "core" electorate mandated by the secession claim (e.g., residents), but the "periphery" (e.g., age, diaspora) is discretionary.

  The deciding consideration will be whether excluding specific groups (e.g., non-resident nationals or younger residents) undermines the specific normative ground claimed. If a plebiscitary right claims to respect choice, but excludes a large class of residents from choosing, is the right violated? If the answer is yes, Result 1 obtains. If no, Result 2 obtains.

  **Failure Conditions and the Boundary Problem**

  I am acutely aware that this project risks collapsing into the "democratic boundary problem": the familiar circularity whereby constituting the *demos* presupposes an answer to the very question the *demos* is convened to answer. If my argument concludes that we need a prior definition of "the people" to decide who votes on defining the people, the project will have failed to advance the literature.

  To avoid this, the project distinguishes the *referendum franchise* from the *constitutional boundary*. The question is not how to draw the border of a new state in the abstract, but how to design a vote within an existing constitutional order that claims to authorize that drawing. The failure condition is specific: if I cannot demonstrate that the franchise decision is a second-order normative act distinct from the first-order creation of the state, the argument will succumb to circularity. I will treat this collapse as a negative result, explicitly noting where the theory runs into the boundary problem, as identifying the limit of current theory is itself a valuable contribution.

  **Scope and Limitations**

  To fit the three-month timeline and article format, significant scoping is necessary. I will not offer a new general theory of secession; I will take the remedial and primary views as fixed targets. I will not provide a legal blueprint for future referendums; the output is normative, not prescriptive law. I will also limit the empirical scope to the franchise legislation and debates of the three selected cases, rather than a comprehensive global survey.

  I promise a rigorous examination of the link between secessionist justification and electoral design. I do not promise a resolution to the broader question of whether secession is morally permissible. By isolating the franchise variable, this project aims to show that the "who" of self-determination is not merely a logistical precursor to the "whether," but a substantive part of the claim itself. This clarification is essential for theorists and policymakers alike, as it reveals that in setting the voting rules, we are already deciding the outcome of the national question.
