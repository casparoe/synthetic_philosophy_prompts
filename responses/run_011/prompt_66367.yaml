      *   *Check:* Is the question determinate? *Adjustment:* Ensure it asks about the *link* between justification and franchise, not just "what is the franchise."
      *   *Check:* Word count. *Adjustment:* Keep descriptions tight. Avoid fluff.
      *   *Check:* Tone. *Adjustment:* Confident but humble about the 3-month limit.
      *   *Check:* Failure condition. *Adjustment:* Make sure it explicitly mentions the "circularity" risk.

  10. **Final Review against constraints:**
      *   1,200 words approx? (Need to be careful not to go too short or too long).
      *   No citations? (Check).
      *   All 6 points covered? (Check).

  *(Self-Correction on Word Count)*: 1,200 words is actually quite a lot for a proposal (usually they are 500-800). I need to ensure I don't ramble but fully flesh out the required sections. I will aim for substantial paragraphs.

