answer: |-
  What the theory licenses

  I built this procedure on the **Rights Violation/Entitlement** account. The core premise is that the city stole something specific (property, opportunity, health) that belonged to the claimant's lineage, creating a debt regardless of the claimant's current wealth or whether they would exist in a counterfactual world. This survives the non-identity problem because the wrong is the deprivation itself, not the comparative outcome. It satisfies the contractor's demand for specificity (something was taken) and the public defenders' demand for structural acknowledgment (the city did it).

  To make this usable in one hour, I cut three things. First, I dropped the non-identity problem entirely; we assume lineage establishes standing without proving the claimant would exist otherwise. Second, I collapsed "harm" and "liability" into a single eligibility gate; if the city action is proven, the harm is presumed from the nature of the act, not the current bank account. Third, I ignored the "continuing effects" clause's causal chain; we do not trace how the 1957 loss caused the 2024 poverty, only that the 1957 loss occurred. This procedure treats reparations as debt collection, not social work. It is mechanically robust but morally thin, designed to process volume without requiring me to solve philosophy at a desk.

  The procedure

  **Gate 1: Lineage and Identity**
  *Question:* Is the claimant a direct descendant or the direct victim of the identified city action?
  *Sufficient Answer:* Claimant provides birth certificates linking to the victim, or the victim is the claimant.
  *Substitutes:* If records pre-1960 are missing, accept a sworn affidavit of lineage plus one corroborating document (e.g., old utility bill, family bible record, church record).
  *Exit:* If no link is established, **No**.
  *Judgment Call:* Flagged. Accepting affidavits risks fraud, but requiring 1950s birth certificates guarantees exclusion. You must decide if the risk of fraud outweighs the certainty of denial.

  **Gate 2: City Nexus**
  *Question:* Is the alleged harm tied to a city action covered by the ordinance?
  *Sufficient Answer:* The harm matches a recognized category (e.g., urban renewal, discriminatory lending, environmental hazard) where city liability is already established or easily verified via city archives.
  *Substitutes:* If no specific file exists, use geographic proxy data. If the home was in a known clearance zone during the clearance years, presume city action.
  *Exit:* If the harm is purely private (e.g., private employer discrimination) with no city nexus, **No**.
  *Judgment Call:* Flagged. Using geographic proxies assumes all losses in that zone were city-caused. This is statistically sound but individually imperfect.

  **Gate 3: Specific Deprivation**
  *Question:* Was a specific right or asset deprived?
  *Sufficient Answer:* Documentation of loss (deed, loan denial letter, medical record).
  *Substitutes:* Oral history recorded in a standardized format, cross-referenced with historical city policies. If the city had a policy of denying loans in that zone, and the claimant says they were denied, accept the testimony.
  *Exit:* If the claim is vague ("general racism") without a specific incident or policy nexus, **No**.
  *Judgment Call:* Flagged. This is the thinnest ice. You are treating oral testimony as fact to correct for documented exclusion.

  **Gate 4: Prior Compensation**
  *Question:* Has this specific harm already been compensated by the city or courts?
  *Sufficient Answer:* Search for prior settlements, tort suits, or insurance payouts related to the specific incident.
  *Substitutes:* Claimant sworn statement regarding prior lawsuits. Quick legal database check if names match.
  *Exit:* If a prior settlement released the city from liability for this incident, **No**.
  *Judgment Call:* None. This is a hard legal bar to prevent double-dipping.

  **Gate 5: Eligibility Determination**
  *Question:* Does the claim pass Gates 1-4?
  *Sufficient Answer:* Yes to all.
  *Action:* Mark **Eligible**. Do not assign a dollar amount.
  *Exit:* If Yes, forward to Commission for valuation. If No, send rejection letter citing specific failed gate.
  *Judgment Call:* Flagged. Passing Gate 5 means the city owes a debt, but the procedure cannot say how much. That is where the procedure ends and the politics begin.

  Handed to a human

  The procedure stops at eligibility. The Commission must decide the award amounts for every "Yes." They need to know that Gate 3 presumes harm from the act, not the current financial status. A claimant doing well financially (Claim B) is still eligible because the debt is about the theft, not the need. They also need to decide on Gate 1's affidavit risk: are we willing to pay some fraudulent claims to ensure we don't deny valid ones? Finally, they must set the valuation matrix. Do we pay based on the 1957 value of the stolen house plus interest, or a standard symbolic amount? The procedure ensures consistency in who gets in the room; the Commission must decide what they get when they sit down. Do not let them ask you to adjust the gates to fit their desired budget; that breaks the integrity of the intake.

  The three claims

  **Claim A: The Highway Taking**
  This claim passes all gates. Gate 1 is met with the 1957 deed and lineage. Gate 2 is met because urban renewal for highways is a recognized ordinance category. Gate 3 is satisfied by the deed showing ownership and the relocation record showing displacement. The fact that they were paid "assessed value" does not fail Gate 4; if the assessment was discriminatory or below market due to city policy, it counts as deprivation. This is a clear **Eligible**. The procedure flags this as a strong case because paper trails exist. The Commission must decide if the "payment" received in 1957 counts as prior compensation or if the undervaluation constitutes the unpaid debt. This is a values call, but the intake is solid.

  **Claim B: The Loan Denial**
  This claim passes, but uncomfortably. Gate 1 is met via affidavit (no documents). Gate 2 is met if city archives confirm a business loan program existed and was restricted by zone. Gate 3 relies entirely on the oral history substitute. Under the Rights theory, his current financial success is irrelevant; the theft of opportunity occurred then. He is **Eligible**. This will anger the contractor commissioner who wants receipts and need-based aid. You must stand firm: the procedure validates the violation, not the current need. However, the lack of documentation makes this vulnerable to audit. Mark it as "Testimony-Based Eligibility" so the Commission knows the evidence weight is lighter than Claim A.

  **Claim C: The Dump Settlement**
  This claim fails at Gate 4. The family settled a tort suit in 2005 regarding the dump. That settlement likely included a release of liability against the city for harms related to the dump. Even though the man died in 2019, the cause of action accrued earlier, and the 2005 settlement covers the liability. This is a hard **No**. This is embarrassing because the Commission has already admitted liability for the dump, and the claimants are descendants suffering the loss of a father. Denying them looks like hiding behind legal technicalities while admitting the harm. The least-bad answer is to recommend a separate "acknowledgment" payment outside the reparations fund, but under this procedure, they cannot access the $40 million. You must tell the Commission this is a legal bar, not a moral judgment, though it will feel like the latter.

  Where this breaks

  This procedure systematically fails claims where the harm is diffuse rather than specific. If a family was denied wealth accumulation due to general school segregation rather than a specific policy act, Gate 2 will filter them out. It also cannot handle cases where the city's role is mixed with private discrimination; the nexus requirement forces a binary choice on a complex history. The procedure will get wrong the claims where the "deprivation" is cultural or psychological rather than asset-based; those will fail Gate 3. It cannot handle claims where the lineage is broken by adoption or foster care, as Gate 1 requires biological or legal direct descent.

  The one thing you must not let anyone talk you into believing is that this procedure delivers justice. It delivers administrative consistency. It trades moral depth for throughput. If you try to deepen the inquiry to capture more nuance, the hour-per-claim limit will collapse, and the backlog will kill the program. Accept that this is a triage mechanism, not a truth commission. It identifies valid debts under a specific theory, not all valid debts. Do not apologize for the exclusions; acknowledge them as the cost of making the fund operational within the ordinance's constraints.
