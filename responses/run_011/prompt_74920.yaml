answer: |-
  Dear Colleague,

  I have read your argument with considerable interest. It is a sharp formulation of what is often called the 'dilemma defence', and it is no surprise your students find it compelling. You have isolated the tension between the metaphysics of inability and the logic of counterfactual intervention with precision. Below I address your six requests in order.

  ### 1. Brainstorming Responses

  There are at least four distinct lines of resistance available to a defender of Frankfurt-style cases.

  First, one might **reject the Sufficiency Requirement (SR)**. This defender concedes the argument is valid but denies premise (1). They argue that inability can be grounded in counterfactual conditions rather than actual causal sufficiency. To be unable to do otherwise is to be such that, were one to try, one would fail. This requires no actual prior cause determining the action, only a guarantee across possible worlds.

  Second, one might **reject Inertness**. This defender argues that the device *does* play a causal role in the actual sequence, perhaps by altering the agent's psychological landscape merely by being present, or by constituting part of the situational facts that ground the agent's reasons. If the device is part of G, then G exists without implying determinism of the prior mental states.

  Third, one might **deny validity at step (8)**. This defender argues that a disjunctive fact *can* serve as the ground G. The fact 'Either Bram decides freely or the Deputy intervenes' is a real state of affairs obtaining at t. If this disjunction entails the outcome, it grounds the inability, even if neither disjunct individually causes the outcome in the actual sequence.

  Fourth, one might **deny validity at step (6)**. This defender claims that even if the prior sign is sufficient, it does not necessarily imply determinism in the sense that undermines responsibility. One might argue for a compatibilist account where determination is compatible with responsibility, so the case does not beg the question against all incompatibilists, only those who assume determinism precludes responsibility without argument.

  Of these, the first response survives scrutiny best. Rejecting Inertness muddies the actual sequence, which Frankfurt cases are designed to isolate. Denying validity at (8) or (6) relies on contentious metaphysical claims about disjunctive facts or compatibilism that do not address the core intuition about inability. Rejecting SR, however, directly targets the definition of 'unable', which is the pivot of your argument.

  ### 2. Validity and the Cost of Surrender

  On its most natural reading, the argument is valid. The inference from (1) and (2) to (9) follows tightly if one accepts that 'causally sufficient' implies 'actual sequence deterministic cause'. The apparent validity depends on a strict reading of 'state of affairs G' in (1) as requiring actual causal efficacy.

  However, validity comes at the price of soundness. The least costly premise to surrender is (1), the Sufficiency Requirement. Surrendering SR costs the defender a purely causal account of inability. They lose the leverage to say that inability *must* look like physical prevention (like a locked door). Instead, they must adopt a modal or dispositional account. This is a significant dialectical shift: it moves the debate from 'what caused this?' to 'what would have happened if?'. Yet, this cost is preferable to accepting your conclusion (10), which renders ordinary talk of inability false in an indeterministic world. We must pay the price of modal complexity to save the phenomenon of inability.

  ### 3. The Respectable Core of SR

  Why did SR look acceptable? It captures a true intuition: inability must be grounded. It is not a brute fact that I cannot fly; there must be something about me or the world that makes it so. SR distorts this by insisting the ground must be *actual causal sufficiency*. It conflates the *ground* of inability with the *cause* of action.

  The respectable core is that inability requires a **modal guarantee**. I am unable to leave the room not because my staying is causally determined by prior states, but because the world is structured such that any attempt to leave would fail. In the locked door case, the brickwork guarantees failure. In the Deputy case, the device guarantees failure of refusal. The core claim should be reformulated: 'An agent is unable at t to do other than A only if there is some fact obtaining at t that ensures A across all relevant possible worlds.' This preserves the grounding intuition without requiring the actual sequence to be deterministic. It distinguishes between the *source* of the action (which remains the agent in the actual sequence) and the *absence of alternatives* (which is secured by the counterfactual structure).

  ### 4. Disjunctive Guarantees and Engineering

  Take (8) head on: can a disjunctive guarantee ground an inability? Yes. The fact 'Either Bram signs freely or the Deputy forces him' is a robust fact about the situation at t. It is not merely a logical disjunction; it is a structural feature of the environment. This grounds the inability to refuse because in every accessible world where Bram tries to refuse, the second disjunct activates, ensuring the signature.

  Does this entail the absurdities of (10)? No. The absurdities arise only if we demand actual causal sufficiency for the *action* to ground the inability. If we accept modal guaranteeing, the swimmer unable to cross is so because of their physical limits (a dispositional fact), not because their failure is determined. The locked door prevents leaving because of the counterfactual: 'If you tried, you would hit brick.' The Deputy prevents refusal because of the counterfactual: 'If you tried, the device would fire.'

  Is the Deputy badly engineered? No. It is a standard model. A better-engineered case is not required if we correct the account of inability. The error lies not in the neurosurgery but in the metaphysics of 'can'. The Deputy works precisely because it creates a disjunctive guarantee that removes the alternative possibility without invading the actual causal history of the action.

  ### 5. The Three Broad Positions

  How do the three broad positions stand regarding (1) and (2)?

  Those who hold that such cases leave **residual alternative possibilities** (the 'flickers' objection) typically accept (1) and (2). They argue that because the device is inert, the agent retains the power to initiate the sign N, even if the outcome is fixed. They maintain that this flicker of control is enough to save the Principle of Alternative Possibilities (PAP). They are committed to SR because they believe inability requires the removal of all voluntary initiations.

  Those who locate responsibility entirely in the **actual causal history** (actual-sequence theorists) must reject (1). They argue that responsibility depends on how the action was produced, not on what else might have happened. They are entitled to Inertness (2)—indeed, they insist on it, as the device's inertness preserves the actual sequence's integrity. But they deny that this inertness implies the agent *could* have done otherwise. They reject SR because they separate the conditions for responsibility from the conditions for alternative possibilities.

  Those who think such cases **beg the question** (incompatibilists) accept both (1) and (2). They argue that if the outcome is guaranteed, there must be a deterministic ground G. If G is not the device (due to Inertness), it must be the prior states. Thus, they conclude the case presupposes determinism. They are committed to SR as a necessary condition for genuine inability.

  The actual-sequence theorist is entitled to Inertness but cannot accept SR. Accepting SR would commit them to your conclusion that the agent could have done otherwise, undermining their claim that responsibility survives without alternatives.

  ### 6. The Survival of Frankfurt's Purpose

  What survives of the original dialectical purpose? If your argument were sound, the purpose would be dead: we could not sever responsibility from alternative possibilities without collapsing into determinism. However, since the argument fails at (1), the purpose survives, albeit modified.

  Frankfurt-style cases still succeed in showing that moral responsibility does not require the *ability to do otherwise* in the sense of having open futures. They show that responsibility tracks the actual sequence. However, they do not allow us to set aside the question of determinism entirely. By rejecting SR, we admit that the 'inability' in these cases is modal, not causal. This means the debate shifts: incompatibilists will argue that if the modal structure guarantees the outcome, the agent lacks control regardless of the actual sequence.

  Thus, the cases still isolate the actual sequence as the locus of responsibility, but they no longer prove that determinism is irrelevant. They prove that *alternative possibilities* are irrelevant, but the threat of determinism remains if one argues that the modal guarantee itself undermines control. The project survives, but it severs responsibility from alternatives, not from the broader worries about control that determinism raises. You should tell your students that the Deputy works, but only if we stop demanding that inability look like a causal chain in the actual world.

  Yours sincerely,

  A Colleague
