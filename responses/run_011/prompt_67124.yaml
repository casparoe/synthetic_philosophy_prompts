answer: |-
  First, a brief note on your setup: You have characterized the Goodman and Keown positions with impressive precision for a high school essay. You have not mischaracterized the camps in a way that requires me to halt and correct the premise before drafting. Goodman does argue for a form of "soteriological consequentialism" (specifically utilitarianism in the Mahāyāna context), and Keown does argue for a virtue-ethical framework rooted in the psychology of *karma* and the *telos* of *nirvāṇa*.

  However, one nuance to keep in mind as you read the draft: Keown does not necessarily argue that precepts are "exceptionless" in a rigid deontological sense (like Kant), but rather that violating them is *incompatible* with the perfected state of an arhat or Buddha. The violation indicates a defect in character, even if the action was "necessary" in a conventional sense. I have tried to reflect this nuance in the table below.

  Here is the draft of the joint statement.

  ***

  # JOINT STATEMENT ON THE STRUCTURE OF BUDDHIST ETHICS
  **Drafted for the School Philosophy Review**
  **Subject:** The Consequentialist vs. Virtue-Ethical Interpretation of Buddhist Normativity

  ## 1. Agreed Claims (Constraints on Interpretation)
  *The undersigned parties agree that any viable meta-ethical reconstruction of Buddhist ethics must accommodate the following textual and doctrinal constraints. These claims are not merely descriptive but serve to rule out anachronistic or textually unsupported readings.*

  1.  **Absence of Explicit Aggregation:** The canonical texts (Nikāyas/Āgamas) and systematic treatises (Abhidharma) nowhere formulate an explicit aggregative calculus (e.g., "maximize happiness for the greatest number"). Any consequentialist reading must therefore be reconstructive, arguing that the logic is implicit rather than explicit.
  2.  **Primacy of *Cetanā* (Intention):** Both camps agree that *cetanā* is the primary determinant of karmic quality (*karma-patha*). An action producing good outcomes but arising from malicious intent is not karmically wholesome (*kuśala*).
  3.  **The Soteriological *Telos*:** Both camps agree that *nirvāṇa* (or *bodhi*) is the ultimate goal of the path. The disagreement lies in whether this goal functions as a *state of affairs to be produced* (consequentialist) or a *reality to be realized through character transformation* (virtue-ethical).
  4.  **The Status of Precepts:** Both camps agree the precepts (*śīla*) are training rules (*śikṣāpada*) rather than divine commands. However, both agree they are not mere rules of thumb; they carry normative weight that cannot be ignored without karmic consequence.
  5.  **Universality of *Duḥkha*:** Both camps agree that the cessation of *duḥkha* (suffering/unsatisfactoriness) is the fundamental value driving the tradition. The dispute is whether the *reduction of duḥkha* is the *criterion* of right action, or the *natural result* of right action performed by a virtuous agent.

  ## 2. Disagreements Table

  | The Dispute | Consequentialist Statement (Goodman-style) | Virtue-Ethical Statement (Keown-style) | Substantive or Verbal? |
  | :--- | :--- | :--- | :--- |
  | **The Criterion of Rightness** | An action is morally right if it leads to the best overall soteriological consequences (reduction of *duḥkha* for self and others). | An action is morally right if it is expressive of a wholesome character (*kuśala-mūla*) and aligns with the *telos* of *nirvāṇa*. | **Substantive.** (Concerns the source of normativity). |
  | **The Sea Captain Case** | The Buddha's past-life killing of the murderer is justified because the aggregate karmic/soteriological outcome (saving 500 lives + preventing murderer's hell-rebirth) outweighed the precept violation. | The act remains karmically negative for the agent (entailing a cost), but the Bodhisattva's compassion motivates him to accept that karmic cost to help others; it is a tragic necessity, not a "good" act. | **Substantive.** (Concerns the karmic status of the act itself). |
  | **The Function of No-Self** | The doctrine of *anātman* removes the metaphysical basis for agent-centred constraints, allowing for impartial aggregation of suffering across beings. | The doctrine of *anātman* removes egoistic attachment, but does not dissolve the conventional agent who bears karma; it supports impartiality of *compassion*, not aggregation of *utility*. | **Verbal/Substantive Mix.** (Depends on whether "agent-centred constraints" requires a permanent self). |
  | **Definition of *Kuśala*** | A state is *kuśala* (wholesome) because it is conducive to happiness and liberation (instrumental value). | A state is *kuśala* because it is psychologically healthy and intrinsically aligned with reality (intrinsic value); liberation follows because it is the nature of health. | **Substantive.** (The Buddhist Euthyphro Dilemma). |

  ## 3. The Cruxes
  *Settling these sub-questions would force a revision of at least one camp's position.*

  1.  **Intentionality vs. Impartiality:** Does the intentionalism of *karma* entail agent-relativity (my karma is mine alone), or is it compatible with an impartial evaluative standard applied to motives (a motive is good if it aims at universal welfare)?
  2.  **The Sea Captain Interpretation:** Does the *Upāyakauśalya Sūtra* narrative show a precept overridden for aggregate welfare, or does it show a Bodhisattva willingly accepting karmic defilement as an act of sacrifice (implying the act *was* defiled)?
  3.  **No-Self and Ownership:** Does the *anātman* doctrine do the work consequentialists assign it (undermining the distinction between 'my suffering' and 'yours' to allow aggregation), or does it support a different point about the impersonal nature of suffering without implying aggregation?
  4.  **The Euthyphro Crux:** Is an action wholesome *because* it leads to good results, or does it lead to good results *because* it is wholesome?

  ## 4. Textual Cases and Predicted Findings

  | Crux | Concrete Textual Case / Survey | Virtue-Ethical Prediction (Keown) | Consequentialist Prediction (Goodman) |
  | :--- | :--- | :--- | :--- |
  | **1. Intentionality** | **Abhidharma analysis of *kuśala* roots:** Survey definitions of the three wholesome roots (non-greed, non-hatred, non-delusion). | Definitions will focus on the internal psychological state and freedom from defilement, independent of external outcome. | Definitions will reference the capacity of these roots to produce pleasant *vipāka* (results) and lead to liberation. |
  | **2. Sea Captain** | **Vinaya Rule-Casuistry & *Upāyakauśalya Sūtra*:** Examine the karmic verdict on the captain. Does he suffer negative *vipāka*? | The texts will indicate the Bodhisattva accepted a karmic penalty (e.g., rebirth in hell, though shortened) to save the other. The act remains technically *akuśala* but compassionately motivated. | The texts will indicate the act generated merit or neutral karma because the *net* suffering was reduced; the "penalty" narratives are later interpolations or misreadings. |
  | **3. No-Self** | **Śāntideva, *Bodhicaryāvatāra* Chapter VIII:** Analysis of the "exchange of self and other." | The argument will be that protecting others is rational because 'I' am a fiction, so clinging to 'my' interest is irrational. It will *not* argue that 'I' should maximize total utility. | The argument will be that since suffering has no owner, all suffering is equal, implying a duty to minimize the total quantity of suffering regardless of who suffers. |
  | **4. Euthyphro** | **Definition of *Dharma* in Early Texts:** Survey passages defining *dharma* as "good" (*sundara*/*kalyāṇa*). | *Dharma* is defined by its intrinsic nature (truth/reality). Good results follow as a natural law, like health following medicine. | *Dharma* is defined functionally by its ability to lead to the end of suffering. If it didn't lead there, it wouldn't be *dharma*. |

  ***

  ## 5. Assessment and Critique of the Draft
  *(Appended by the AI Assistant)*

  While the statement above represents a plausible "ideal collaboration," there are specific points where the formulation is exposed to rejection by one side, and where your own essay might need to nuance the debate further.

  **1. Where the Formulation is Slanted:**
  The **Agreed Claims** section leans slightly toward the Virtue-Ethical camp, specifically Claim 2 (*Cetanā*). While Goodman accepts intention is key, his reconstruction relies on the idea that the *content* of the intention is consequentialist (i.e., "I intend to minimize suffering"). Keown would argue the *structure* of the intention matters more than the content (i.e., "I intend from a state of non-attachment"). By framing Claim 2 as "both agree," we risk hiding the fact that they disagree on *what counts as a wholesome intention*.
  *   **Recommendation:** In your essay, highlight that "Intention" is the battleground, not just common ground.

  **2. Exposed Reasoning (The "Verbal" Dispute):**
  In the Disagreements Table, I classified the "No-Self" dispute as a "Verbal/Substantive Mix." This is the weakest link.
  *   **Why:** Goodman argues that without a self, there is no "agent" to have agent-centred constraints. Keown argues that karma requires a *conventional* person to bear the fruit, so constraints remain.
  *   **Risk:** A hardline Consequentialist might reject the "Verbal" label entirely, insisting that if you deny the metaphysical self, you *must* be a consequentialist. A hardline Virtue Ethicist will say the label "consequentialist" is the error, regardless of metaphysics.
  *   **Recasting:** You might consider demoting the "No-Self" crux. Recent scholarship suggests *anātman* is less about metaphysics and more about phenomenological practice. If so, it supports neither meta-ethics strongly. You could promote the **Euthyphro Crux** (Crux 4 in my list) instead. That is the deepest philosophical divergence: Is the Good defined by the Outcome, or is the Outcome defined by the Good?

  **3. Mischaracterization Check:**
  You did not mischaracterize the camps, but you may have hardened them slightly.
  *   **Goodman:** He is aware of the "agent-relative" objection. He argues that Buddhist consequentialism is "agent-relative" in practice (I must cultivate *my* mind) but "agent-neutral" in evaluation (suffering is bad regardless of owner).
  *   **Keown:** He does not claim precepts are never broken. He claims that when a Buddha breaks a precept (in Jātaka tales), it is because the Buddha's enlightenment transcends the precept, not because the precept was "overridden by utility." A ordinary person breaking the same precept *would* incur bad karma.
  *   **Adjustment for your Essay:** Ensure you distinguish between **Ideal Moral Code** (what a Buddha does) and **Decision Procedure** (what a student does). Goodman argues the Code is consequentialist; Keown argues the Decision Procedure is virtue-based. They might be talking past each other on *level of analysis*.

  **4. Final Recommendation:**
  If I were to recast the disagreement based on the most fruitful textual pattern, I would move away from "Consequentialism vs. Virtue Ethics" (Western categories) and toward **"Soteriological Efficacy vs. Ontological Alignment."**
  *   **Side A:** Ethics is about what *works* to end suffering (Efficacy).
  *   **Side B:** Ethics is about acting in *accordance* with the nature of reality (Alignment).
  This captures the dispute without getting bogged down in whether Śāntideva was a Benthamite. It allows you to use the Western labels (as your prompt requires) while showing you understand their limitations.

  Good luck with the review. This is a sophisticated topic; handling the nuance of *karma* vs. *utility* will distinguish your essay from the standard secondary literature.
