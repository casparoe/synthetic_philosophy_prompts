      *   *Hofstadter/Sander Reaction:* Explicitly state what they'd fight vs. concede.

  6.  **Drafting - Section by Section (Mental or Scratchpad):**

      *   *Claim:* You claim identity, not correlation. Analogy *is* categorization. Rules are fossilized analogies. No dual-process.
      *   *Fatal:* Clean double dissociation (Neuropsych). One system damaged, other intact. Solid finding: Prefrontal cortex lesions impair relational integration (analogy) more than feature-based categorization. If this is robust, it breaks the "one mechanism" claim.
      *   *Awkward:* Developmental lag. Kids categorize objects before relations. Hofstadter says: "Same mechanism, different input complexity." Concede: Costs explanatory power on timeline.
