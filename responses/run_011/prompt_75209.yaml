  Your reliance on variance normalization collapses under the weight of menu dependence, which renders any resulting exchange rate arbitrary rather than factual. The variance of my utility function is not an intrinsic property of my values but a function of the outcome set we choose to consider. If I know that our exchange rate will be determined by the spread of my reported utilities across the menu, I have a decisive incentive to include extreme, low-probability outcomes in the negotiation set solely to inflate that variance. I can artificially amplify my bargaining power by claiming that certain hypothetical outcomes are catastrophically bad for me, even if I would never accept them, simply to shift the normalization factor. This makes the resulting exchange rate manipulable rather than discovered. You call this a convention, but a convention that rewards strategic misrepresentation of preference intensity cannot serve as a principled foundation for cooperation. It does not find a rate at which our values meet; it constructs a rate based on who frames the option set more advantageously.

  Regarding your charge that refusal is itself a hidden trade, you are conflating the rejection of a metric with the adoption of a competing metric. When I decline to trade, I am not asserting that my utility units are heavier than yours; I am denying that your units can be weighed against mine at all. To say that I value my loss more than your gain is to accept that there is a common scale on which both losses and gains can be plotted, which is precisely the premise I reject. Non-cooperation is not a deal struck at an infinite exchange rate; it is the default state of affairs when no common ledger exists. The wastefulness you lament is the physical cost of maintaining distinct value systems that refuse to be reduced to a common denominator. If we cannot find a non-arbitrary way to fix the rate without inviting manipulation, then the indeterminacy is not a friction to be overcome but a signal that the transaction is a category error.

  This is why alternatives like dividing jurisdiction or symmetric randomisation are superior to trade in cases of deep pluralism. These mechanisms allocate control without requiring us to compare the intensity of your desire for ecological minds against my desire for maximized experiences. We can flip a coin or draw a boundary, and each of us accepts the procedure without needing to validate the other's utility scale. Trade demands commensurability; division merely requires coexistence. By insisting on trade, you are asking us to pretend there is a fact of the matter about how many of my experiences equal one of your minds, when no such fact exists. I would rather leave value on the table than build our cooperation on a fiction that invites us to lie about how much we care.
