prompt: |-
  Every quarter the capital resilience committee at the municipal electric utility I direct receives between eight and twelve project proposals — floodwalls, feeder sectionalisers, cooling-centre retrofits, wildfire hardening, staged microgrid build-outs — each between $2M and $40M, with board approval required above $10M. Our present method scores each proposal by expected monetised damage avoided and then applies a flat 15 percent "catastrophe adder" whenever the proposal touches a low-probability, high-consequence event. Our staff economist has objected for two years that the adder is incoherent: that it is a concave utility curve wearing a hard hat, applied inconsistently across proposals, and that a sequence of projects each of which clears the test can leave ratepayers worse off than doing nothing. I think he is right, and I would rather replace the adder than keep defending it.

  What I want to replace it with is rank-weighted expected utility: the view that an agent's attitude to risk is a third ingredient alongside her utilities and her probabilities, entering as a weighting function applied to the cumulative distribution of outcomes rather than to the probabilities of states, so that two agents who agree on every probability and every utility can nonetheless rationally choose differently. Write a decision procedure my analysts can actually run on a proposal.

  Constraints. The analyst is a civil or electrical engineer with a spreadsheet, no decision theory, and roughly four hours per proposal. Benefit figures come from an existing monetised damage model and are to be treated as linear in money, so that all risk attitude sits in the weighting function and none is smuggled into a curved utility. The weighting function is to be chosen once, at board level, and held fixed across every proposal in a quarter; analysts may not tune it. The output is a one-page recommendation the board can read without a glossary.

  The procedure should contain, in order: the steps and what counts as a sufficient answer at each; a spreadsheet-implementable recipe for computing the rank-weighted value of an act, including how to order outcomes, how to weight the increments, and what to do when there are more than a handful of outcomes; a defensible default family of weighting functions and guidance on how the board should fix its single parameter, given that the parameter is doing all the normative work; a rule for individuating outcomes, since I understand the weighted value can shift with how finely consequences are described and where the reference point is placed; a treatment of multi-year proposals with staged go/no-go decisions, where the plan endorsed today may not be the plan endorsed in year five; and a rule for what to do when a probability is genuinely unavailable rather than merely imprecise. Mark every step that is a judgement call dressed as procedure, and every point at which the procedure should stop and hand the question to a person.

  Then run it on three cases.

  Case one, Riverbend floodwall: $24M committed on approval, net benefit to ratepayers over twenty-five years, all costs included, per the damage model: +$6M with probability 0.80, +$30M with probability 0.17, −$5M with probability 0.03. Take the board's placeholder weighting function to be ρ(p) = p². Report whether it passes, and report how far the parameter would have to move before the verdict flips.

  Case two, two feeder-hardening packages of $14M each, modelled by two analysts from the same engineering data. Analyst one treats the $28M programme as a single act: both packages are built, and each independently yields a net +$40M if its target failure mode recurs over the planning horizon and a net −$14M if it does not, each at probability 0.5. Analyst two treats them as two separate $14M approvals voted on in sequence, each with that same 0.5 profile. The two verdicts diverge. Show both computations, say which description the procedure admits, and say what the procedure must tell the committee if it cannot choose between them — bearing in mind that project sponsors will learn whichever description helps them.

  Case three, staged storage: $9M of Phase 1 site works and long-lead transformers now, worthless unless Phase 2 is funded in year five for $22M. Our year-zero model puts the benefit event at probability 0.4 and gives the completed project +$95M if the event occurs and −$31M if it does not, all costs included. By year five the probability will have been revised to about 0.25 on better load data, Phase 1 will be sunk, and three of five committee seats will have rotated. Tell me whether the procedure licenses approving Phase 1 now on the assumption that Phase 2 follows, what it makes of the fact that the year-five committee will evaluate only the incremental decision, and what it must require by way of securing that assumption if the year-zero approval is to stand.

  Finally, state plainly what the procedure cannot settle, where it will produce recommendations that reverse under a permissible change of description, and which of its outputs I should expect my economist to attack as arbitrary — with the strongest form of that attack and the best honest reply available to me.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Role:** Director of a Municipal Electric Utility.
      *   **Audience:** Capital Resilience Committee (Board), Analysts (Engineers), Staff Economist.
      *   **Problem:** Current method (Expected Value + 15% Catastrophe Adder) is incoherent (concave utility disguised, inconsistent, can lead to dominated choices).
      *   **Solution:** Rank-Weighted Expected Utility (RWEU) / Rank-Dependent Utility (RDU).
      *   **Constraints:**
          *   Analysts: Engineers, spreadsheets, no decision theory, 4 hours/proposal.
          *   Benefits: Linear in money (risk attitude in weighting function only).
          *   Weighting Function: Fixed by Board, one parameter, applied to all proposals.
          *   Output: One-page recommendation, no glossary.
          *   Specific Requirements: Steps, spreadsheet recipe, default weighting function family + parameter guidance, outcome individuation rule, multi-year/staged decision rule, missing probability rule.
          *   Marking: Identify judgment calls vs. procedure, hand-off points.
          *   Cases: Run the procedure on three specific cases (Riverbend, Feeder Hardening, Staged Storage).
          *   Critique: State limitations, reversibility under description, economist's attack + reply.

  2.  **Theoretical Foundation (Rank-Weighted Expected Utility):**

      *   *Standard EU:* $V = \sum p_i u(x_i)$.
      *   *RWEU (Quiggin/Yaari):* $V = \sum w_i u(x_i)$, where weights $w_i$ depend on the *rank* of the outcome, not just the state probability. Specifically, weights are derived from a transformation of the cumulative distribution function (CDF).
      *   *Formula:* For outcomes $x_1 \le x_2 \le \dots \le x_n$ with probabilities $p_1, \dots, p_n$:
          $V = u(x_1) + \sum_{i=2}^n [u(x_i) - u(x_{i-1})] \cdot \rho(\sum_{j=i}^n p_j)$.
          *Wait, let's verify the standard RDU formula.*
          Standard RDU: $V = \sum_{i=1}^n \pi_i u(x_i)$.
          Decision weights $\pi_i$ are derived from a probability weighting function $\rho(p)$.
          If outcomes are ordered $x_1 < x_2 < \dots < x_n$ (best to worst or worst to best?):
          Usually, for risk aversion (pessimism), we overweight bad outcomes.
          Let's order from Worst ($x_1$) to Best ($x_n$).
          Cumulative probability of getting *at least* $x_i$ is $P(X \ge x_i) = \sum_{j=i}^n p_j$.
          Weight for outcome $x_i$: $\pi_i = \rho(P(X \ge x_i)) - \rho(P(X \ge x_{i+1}))$.
          Value: $V = \sum \pi_i u(x_i)$.
          Since $u(x)$ is linear (money), $u(x) = x$.
          So, $V = \sum \pi_i x_i$.
      *   *Weighting Function:* $\rho(p) = p^\gamma$.
          *   $\gamma = 1$: Risk neutral (Expected Value).
          *   $\gamma > 1$: Pessimistic/Risk Averse (overweights small probabilities of bad outcomes, underweights good outcomes). *Wait, check convexity.*
          *   If $\rho(p) = p^2$ (convex): Small probabilities become smaller. $\rho(0.1) = 0.01$. This underweights tail events. This is *risk-seeking* regarding gains or *risk-averse* regarding losses depending on framing.
          *   *Correction:* In RDU, to model risk aversion (pessimism) where bad tails are overweighted, we need a concave weighting function for the cumulative probability of *good* outcomes, or a convex function for the cumulative probability of *bad* outcomes.
          *   Let's stick to the prompt's suggestion: $\rho(p) = p^2$. The prompt asks to use this for Case 1. I need to ensure the interpretation aligns with "catastrophe aversion."
          *   If we order outcomes from Best to Worst. Cumulative prob of achieving *at least* this good outcome.
          *   If $\rho(p) = p^\gamma$ with $\gamma > 1$ (e.g., squared): $\rho(p) < p$ for $p < 1$. This reduces the weight of cumulative probabilities.
          *   Let's use the standard Quiggin formulation: Order outcomes $x_1 \le x_2 \le \dots \le x_n$.
          *   Weight on $x_i$: $w_i = \rho(\sum_{j=1}^i p_j) - \rho(\sum_{j=1}^{i-1} p_j)$. (Cumulative from worst up).
          *   If $\rho$ is convex (like $p^2$), small probabilities at the bottom (worst outcomes) get *downweighted*. That's risk-seeking in the loss domain.
          *   If $\rho$ is concave (like $\sqrt{p}$), small probabilities at the bottom get *upweighted*. That's risk-averse/catastrophe averse.
          *   *Prompt Constraint:* Case 1 says "Take the board's placeholder weighting function to be $\rho(p) = p^2$." I must follow this constraint for the calculation, even if theoretically $p^2$ usually implies risk-seeking in the gain domain or pessimism in a specific framing. I will interpret the mechanics strictly.
          *   *Actually, looking at the prompt:* The economist complained the adder was "concave utility wearing a hard hat." The Director wants RWEU. The prompt asks for a "defensible default family." I should recommend a family that actually captures catastrophe aversion (concave $\rho$ for bad tails), but for Case 1, I must calculate using $p^2$.
          *   *Wait, re-reading RDU mechanics:*
              *   Outcomes $x_1 < x_2 < \dots < x_n$.
              *   $V = \sum_{i=1}^n [\rho(\sum_{j=i}^n p_j) - \rho(\sum_{j=i+1}^n p_j)] x_i$. (Weighting the "good" tail).
              *   If $\rho(p) = p^\gamma$.
              *   If $\gamma < 1$ (concave): Small probabilities of *best* outcomes are overweighted (optimism). Small probabilities of *worst* outcomes (which are at the bottom of the cumulative sum from the top) are... actually, let's look at the "pessimistic" version.
              *   Pessimistic RDU: Weight the cumulative probability of outcomes $\le x$.
              *   Let's simplify for engineers.
              *   Sort outcomes Worst to Best.
              *   Calculate Cumulative Probability ($CP$) of getting *that outcome or worse*.
              *   Transform $CP$ using $\rho(CP)$.
              *   The weight for a specific outcome is the difference in transformed cumulative probabilities.
              *   To be catastrophe averse (overweighting the worst tail), we need the weighting function to be *concave* (e.g., $\sqrt{p}$) if measuring cumulative probability of *loss*. Or *convex* ($p^2$) if measuring cumulative probability of *gain*?
              *   Let's stick to the prompt's Case 1 instruction: Use $\rho(p) = p^2$. I will calculate mechanically. I will advise the Board in the "Default Family" section to choose a parameter that reflects their actual risk attitude (likely $\gamma < 1$ for catastrophe aversion if defined on loss cumulative, or $\gamma > 1$ if defined on gain cumulative).
              *   *Decision:* I will define the procedure clearly so the calculation is unambiguous. I will use the "Good Outcomes Cumulative" standard (Quiggin).
              *   Order: Best to Worst.
              *   $CP_i$ = Prob of outcome $\ge x_i$.
              *   Weight $w_i = \rho(CP_i) - \rho(CP_{i+1})$.
              *   If $\rho(p) = p^2$ (Convex): $CP$ shrinks. The top outcome (Best) gets weight $\rho(p_{best})$. If $p_{best}$ is small, $\rho$ makes it smaller. This is *pessimism* regarding gains. This aligns with "Catastrophe Aversion" (don't count on the good stuff, worry about the bad). Okay, $p^2$ works for pessimism if applied to the "probability of at least this good" cumulative.

  3.  **Drafting the Procedure:**

      *   **Goal:** Simple, spreadsheet-friendly, 4 hours max.
      *   **Structure:**
          1.  Inputs (Outcomes, Probs).
          2.  Sorting (Worst to Best or Best to Worst).
          3.  Cumulative Probs.
          4.  Weighting Function Application.
