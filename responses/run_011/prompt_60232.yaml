      *   **Outcome Individuation:** Crucial for RWEU. Needs a rule to prevent "gerrymandering" states. Rule: Distinct engineering states, not arbitrary splits. Reference point: Status Quo (Net Benefit = 0).
      *   **Multi-year:** Needs to handle the "option value" vs. "sunk cost." The procedure must evaluate the *current* decision node, incorporating the expected value of future decisions *as evaluated by the future committee*? No, that leads to dynamic inconsistency. The procedure must evaluate the *total plan* from today's perspective, but acknowledge the risk of future abandonment.
