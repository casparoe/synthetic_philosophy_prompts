answer: |-
  # CAPITAL RESILIENCE COMMITTEE: RANK-WEIGHTED DECISION PROCEDURE (v1.0)

  **To:** Project Analysts (Civil/Electrical Engineering)
  **From:** Director's Office
  **Subject:** New Project Evaluation Protocol (Effective Q3)
  **Time Budget:** 4 Hours per Proposal

  ## 1. THE PROCEDURE

  **Step 1: Define Outcomes and Probabilities**
  *   **Action:** List all distinct net monetary outcomes for ratepayers (Benefits minus Costs) over the project life.
  *   **Requirement:** Outcomes must be mutually exclusive and collectively exhaustive. Probabilities must sum to 1.0.
  *   **Sufficient Answer:** A table with two columns: *Net Money ($)* and *Probability (0–1)*.
  *   **[JUDGMENT]:** Determining what constitutes a "distinct" outcome (see Section 4).
  *   **[HANDOFF]:** If probabilities are unknown (not just imprecise), stop and request a Board Directive on Ignorance (see Section 6).

  **Step 2: Order Outcomes**
  *   **Action:** Sort the table from **Best Outcome (Highest $)** to **Worst Outcome (Lowest $)**.
  *   **Sufficient Answer:** A sorted list.

  **Step 3: Calculate Cumulative Probabilities**
  *   **Action:** Create a third column: *Cumulative Probability (CP)*.
  *   **Recipe:** For the $i$-th row (sorted Best to Worst), $CP_i$ is the sum of probabilities from Row 1 down to Row $i$.
      *   *Excel:* `=SUM($B$2:B2)` (assuming Prob is Col B).
      *   The final row must equal 1.0.

  **Step 4: Apply Weighting Function**
  *   **Action:** Create a fourth column: *Transformed CP*.
  *   **Recipe:** Apply the Board-fixed function $\rho(p) = p^\gamma$ to the CP column.
      *   *Excel:* `=C2^$G$1` (where G1 holds the Board Parameter $\gamma$).
  *   **Create a fifth column: *Decision Weight*.*
      *   **Recipe:** For Row 1: `=D2`. For Row $i$ (where $i>1$): `=D_i - D_(i-1)`.
      *   *Check:* The sum of Decision Weights must equal 1.0.

  **Step 5: Compute Rank-Weighted Value (RWV)**
  *   **Action:** Create a sixth column: *Weighted Value*.
  *   **Recipe:** `=Net_Money_i * Decision_Weight_i`.
  *   **Sum:** Sum this column. This is the **RWV**.

  **Step 6: Recommendation**
  *   **Rule:** If RWV > 0, recommend **APPROVE**. If RWV < 0, recommend **REJECT**.
  *   **Output:** One-page memo stating the RWV, the Board Parameter used, and the Pass/Fail status. No glossary.

  ---

  ## 2. SPREADSHEET RECIPE (Copy-Paste Ready)

  | Row | A (Outcome $) | B (Prob) | C (Cum Prob) | D (Transformed) | E (Weight) | F (Weighted $) |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Best** | $p_1$ | `=B2` | `=C2^$H$1` | `=D2` | `=A2*E2` |
  | **2** | ... | $p_2$ | `=C2+B3` | `=C3^$H$1` | `=D3-D2` | `=A3*E3` |
  | **3** | **Worst** | $p_3$ | `1.0` | `=1^$H$1` | `=D4-D3` | `=A4*E4` |
  | **Total**| | **1.0** | | | **=SUM(E)**| **=SUM(F)** |

  *   **Cell H1:** The Board Parameter $\gamma$ (Fixed for the Quarter).
  *   **Constraint:** Do not alter H1. Do not alter Column A (Money) to reflect risk; risk is handled in Column E.

  ---

  ## 3. BOARD PARAMETER GUIDANCE

  **The Family:** $\rho(p) = p^\gamma$.
  **The Parameter:** $\gamma$ (Gamma).
  *   $\gamma = 1.0$: Risk Neutral (Expected Value).
  *   $\gamma > 1.0$: Pessimistic / Catastrophe Averse (Overweights bad tails).
  *   $\gamma < 1.0$: Optimistic (Overweights good tails).

  **[HANDOFF TO BOARD]:** You must fix $\gamma$ once per quarter.
  **Guidance:** To replace the "15% Catastrophe Adder" with a coherent risk attitude:
  1.  Review a "Benchmark Project" with a known small probability of total failure (e.g., 5% chance of losing $50M).
  2.  Select the $\gamma$ that makes the RWV of that benchmark exactly zero.
  3.  **Recommended Default:** $\gamma = 2.0$ (Moderate Catastrophe Aversion). This roughly replicates the adder's intent without the incoherence.

  ---

  ## 4. OUTCOME INDIVIDUATION RULE

  **Problem:** Splitting one state into two identical states changes the RWV.
  **Rule:** Outcomes are individuated by **Engineering State**, not by descriptive granularity.
  *   **Permissible:** "Feeder Fails" vs. "Feeder Holds."
  *   **Forbidden:** "Feeder Fails in Morning" vs. "Feeder Fails in Afternoon" (unless load profiles differ financially).
  *   **Reference Point:** Net Benefit = $0$ (Status Quo). All outcomes must be net of costs.
  *   **[JUDGMENT]:** Analyst determines if two physical states have financially distinct consequences. If identical, coalesce them.

  ---

  ## 5. MULTI-YEAR / STAGED PROPOSALS

  **Rule:** Evaluate the **Total Plan** from the perspective of **Today (Year 0)**.
  1.  Model all future costs and benefits as Net Present Value (NPV) at Year 0.
  2.  **Crucial:** You must model the probability that **Future Committees** will cancel the project.
  3.  If Phase 2 requires a future vote, the Year 0 RWV must weight the "Phase 2 Rejected" outcome by the probability of that rejection.
  4.  **[HANDOFF]:** If you cannot credibly estimate the Future Committee's decision rule, flag as "Dynamic Inconsistency Risk." Do not assume Phase 2 is automatic.

  ---

  ## 6. MISSING PROBABILITIES

  **Rule:** If a probability is genuinely unavailable (unknown unknowns, not just wide confidence intervals):
  1.  **Do not guess.**
  2.  **Assign $p=0$** for the benefit state associated with that uncertainty.
  3.  **Treat the cost as certain.**
  4.  **[HANDOFF]:** This effectively vetoes projects relying on unknown probabilities. Escalate to the Board for an "Ignorance Premium" directive if this is too conservative.

  ---

  # CASE RUNS

  ## CASE 1: Riverbend Floodwall
  **Inputs:**
  *   Outcomes (Sorted Best to Worst): +$30M (0.17), +$6M (0.80), -$5M (0.03).
  *   Board Parameter: $\gamma = 2.0$ ($\rho(p) = p^2$).

  **Computation:**
  1.  **Cumulative Probs (CP):**
      *   $\ge 30$: 0.17
      *   $\ge 6$: 0.97 (0.17 + 0.80)
      *   $\ge -5$: 1.00
  2.  **Transformed ($\rho = p^2$):**
      *   $0.17^2 = 0.0289$
      *   $0.97^2 = 0.9409$
      *   $1.00^2 = 1.0000$
  3.  **Weights (Differences):**
      *   $w_{30} = 0.0289 - 0 = 0.0289$
      *   $w_{6} = 0.9409 - 0.0289 = 0.9120$
      *   $w_{-5} = 1.0000 - 0.9409 = 0.0591$
  4.  **RWV:**
      *   $30(0.0289) + 6(0.9120) - 5(0.0591)$
      *   $0.867 + 5.472 - 0.2955 = \mathbf{+\$6.04M}$

  **Verdict:** **PASS** (RWV > 0).
  **Sensitivity:** The verdict flips when RWV = 0. Solving $24(0.17^\gamma) + 11(0.97^\gamma) = 5$ yields **$\gamma \approx 26$**.
  **Interpretation:** The project is robust. The Board would need to be 13x more pessimistic than the current placeholder to reject it. The catastrophic loss (-$5M) is too low-probability (3%) to drive the decision even with heavy weighting.

  ---

  ## CASE 2: Feeder Hardening (The Description Problem)
  **Inputs:** Two packages, $14M each. Independent success prob 0.5. Net +$40M if success, -$14M if fail.

  **Analyst 1 (Bundle - One Vote):**
  *   **States:**
      1.  Both Success (0.25): Net +$80M
      2.  One Success (0.50): Net +$26M ($40 - $14)
      3.  Both Fail (0.25): Net -$28M
  *   **RWV ($\gamma=2$):**
      *   CPs: 0.25, 0.75, 1.0.
      *   Weights: $0.25^2=0.0625$; $0.75^2-0.25^2=0.50$; $1-0.75^2=0.4375$.
      *   Value: $80(0.0625) + 26(0.50) - 28(0.4375) = 5 + 13 - 12.25 = \mathbf{+\$5.75M}$.
      *   **Verdict:** **APPROVE**.

  **Analyst 2 (Sequential - Two Votes):**
  *   **Act 1:** +$40M (0.5), -$14M (0.5).
      *   CPs: 0.5, 1.0. Weights: $0.25, 0.75$.
      *   Value: $40(0.25) - 14(0.75) = 10 - 10.5 = \mathbf{-\$0.5M}$.
      *   **Verdict:** **REJECT**.
  *   **Act 2:** Identical. **REJECT**.

  **Procedure Admissibility:**
  The Procedure (Section 4) mandates individuation by **Engineering State**, but Section 5 mandates evaluation by **Funding Vote**.
  *   If the Board votes on the $28M programme as one line item: **Analyst 1 is correct.**
  *   If the Board votes on them as two line items: **Analyst 2 is correct.**

  **Committee Instruction:**
  This is a **Description Reversal**. Rank-Weighted Utility violates "Coalescing" (branch independence).
  *   **Rule:** Sponsors must declare the **Funding Structure** upfront.
  *   **Warning:** Sponsors will bundle risky projects with safe ones to lower the cumulative probability of the "worst" joint outcome, artificially inflating the RWV.
  *   **Mitigation:** If bundling is used, the Board must apply a "Complexity Penalty" or require separate RWV calculations for sub-components to ensure no single component is toxic.

  ---

  ## CASE 3: Staged Storage (The Time Inconsistency Problem)
  **Inputs:**
  *   Phase 1: $9M (Sunk).
  *   Phase 2: $22M (Future).
  *   Total Net (if successful): +$95M. (Implies Gross Benefit $126M).
  *   Total Net (if failed): -$31M. (Implies Gross Benefit $0).
  *   Year 0 Prob: 0.4. Year 5 Prob: 0.25.

  **Year 0 Evaluation (Assuming Phase 2 happens):**
  *   Outcomes: +$95M (0.4), -$31M (0.6).
  *   RWV ($\gamma=2$):
      *   CPs: 0.4, 1.0. Weights: $0.16, 0.84$.
      *   Value: $95(0.16) - 31(0.84) = 15.2 - 26.04 = \mathbf{-\$10.84M}$.
  *   **Verdict:** **REJECT** immediately.

  **Year 5 Evaluation (Phase 1 Sunk):**
  *   Decision: Spend $22M to get $126M (Net +$104M) or $0 (Net -$22M).
  *   Prob: 0.25.
  *   RWV ($\gamma=2$):
      *   CPs: 0.25, 1.0. Weights: $0.0625, 0.9375$.
      *   Value: $104(0.0625) - 22(0.9375) = 6.5 - 20.6 = \mathbf{-\$14.1M}$.
  *   **Verdict:** **REJECT** Phase 2.

  **Procedure Findings:**
  1.  **Does it license Phase 1?** **No.** Even assuming Phase 2 follows, the Year 0 RWV is negative (-$10.84M) because the catastrophe weighting makes the 60% failure risk too heavy.
  2.  **Future Committee:** They will also Reject Phase 2 (RWV -$14.1M) because the probability dropped to 0.25.
  3.  **Requirement:** To approve Phase 1, you must prove the Year 5 Committee will be **bound** to approve Phase 2 *despite* the negative RWV at that time (e.g., contractual penalty for stopping > cost of finishing). Without a binding mechanism, Phase 1 is a guaranteed loss of $9M.

  ---

  # LIMITATIONS AND CRITIQUE

  **1. What the Procedure Cannot Settle:**
  *   **Dynamic Inconsistency:** As seen in Case 3, a plan optimal today may be rejected tomorrow under the same rules. The procedure cannot force future Boards to be irrational; it can only flag the risk.
  *   **Description Dependence:** As seen in Case 2, bundling changes the verdict. The procedure cannot mathematically resolve this; it relies on administrative rules about voting structure which are politically manipulable.

  **2. Reversibility Under Permissible Description:**
  *   If a sponsor splits a "50% chance of $100M" into "50 independent 1% chances of $100M," the RWV changes.
  *   **Mitigation:** Section 4 (Individuation) forbids this, but enforcement relies on the Analyst's engineering judgment, which is fallible.

  **3. The Economist's Attack:**
  *   **The Attack:** "The parameter $\gamma$ is arbitrary normative magic. You have replaced a 15% adder with a $\gamma=2$ exponent. Why 2? Why not 1.5? There is no market data to reveal the Board's 'rank-weighting' preference. You have hidden a political value judgment inside a spreadsheet formula."
  *   **The Strongest Form:** "This procedure creates a false sense of precision. It looks like math, but it's just the 15% adder with more steps. It violates stochastic dominance in certain framings and invites gaming via project bundling."
  *   **The Honest Reply:** "You are right. $\gamma$ is a normative choice, not an empirical one. However, unlike the 15% adder, this procedure is **coherent**. It forces us to declare our risk attitude ($\gamma$) explicitly and apply it consistently. It exposes the description-dependence (Case 2) and time-inconsistency (Case 3) that the adder hid. We are not claiming this is 'true' value; we are claiming it is a **consistent** reflection of the Board's stated aversion to catastrophe, auditable across every proposal."

  **[FINAL HANDOFF]:** The Board must set $\gamma$. The Analysts must run the spreadsheet. The Director must enforce the Individuation Rules. The Economist will remain unsatisfied, but the Committee will no longer be incoherent.
