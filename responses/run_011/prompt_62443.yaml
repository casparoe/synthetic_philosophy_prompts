  **Automata Companions™ | Model S-paniel (v4.0) | Quick Start & Limited Warranty**

  **WHAT'S IN THE BOX**
  *   1x Model S-paniel Unit (Uncoupled)
  *   1x Synthetic Leather Leash (Non-conductive)
  *   1x Nutrient Paste Dispenser
  *   1x Microfiber Cleaning Cloth
  *   1x Moral Status Disclaimer (Please read before activation)

  **GETTING STARTED**
  Remove the Unit from its packaging. Locate the primary power switch at the base of the spine. Upon activation, the Unit will perform a systemic stretch cycle; this is normal hydraulic priming. Feed only the provided Nutrient Paste to maintain optimal viscosity of internal fluids. Do not offer human food, as the digestion engine is calibrated for specific caloric densities. Allow 48 hours for the Unit to map your home topology. During this period, avoid sudden loud noises which may trigger emergency lockdown protocols.

  **FEATURE SPECIFICATIONS**

  | Feature | Specification | Notes |
  | :--- | :--- | :--- |
  | **Consciousness Module** | None | No *res cogitans* installed. |
  | **Language Support** | 0% | True language requires the rearrangement of signs to declare novel thoughts. This Unit emits fixed vocalizations correlated to internal pressure states. It never arranges signs to meet new circumstances, which is the sole proof of a mind. |
  | **Pain Reception** | Mechanical | Nociceptors trigger withdrawal reflexes via nerve-tube inflation. No subjective suffering occurs. |
  | **Ethical Overhead** | Zero | No moral status paperwork required. |
  | **Inner Life** | Null | Guaranteed not to possess expectations that could be disappointed by you. |

  **TROUBLESHOOTING FAQ**

  **Q: The Unit whines when I step on its paw. Is it hurting?**
  A: No. The paw contains pressure-sensitive valves. When compressed beyond tolerance, these valves release air through the vocal cord aperture to signal structural stress. It is identical to a steam whistle on a boiler. There is no subject present to experience the event.

  **Q: Why does it beg at the table?**
  A: The olfactory sensors detect high-fat compounds and trigger a locomotion subroutine designed to maximize caloric intake. This is a programmed disposition, not desire. The Unit does not want the food; it is mechanically oriented toward it.

  **Q: It looks guilty after chewing my shoe.**
  A: The "guilty look" is a submissive posture triggered by the frequency of your voice. When you raise your tone, the Unit lowers its head and exposes the neck to protect vital organs. It does not understand morality; it understands acoustics and threat assessment.

  **SIDEBAR: COUNTERFEIT DETECTION**
  **How to verify your Unit is not secretly ensouled.**
  A genuine automaton never acts against the arrangement of its own parts. It follows deterministic laws. If the Unit ever demonstrates free will—acting contrary to its mechanical programming or biological disposition—it is a counterfeit unit containing an illicit soul. Immediately contact support for repossession. Behavior that exceeds the machine is the only giveaway.

  **LIMITED WARRANTY & EXCLUSIONS**
  Automata Companions™ warrants the Model S-paniel against mechanical defects for 24 months. This warranty covers hydraulic leaks, motor failure, and fur shedding anomalies.

  **Exclusions:**
  This warranty does not cover damage resulting from the user attributing moral status to the Unit. Claims regarding "emotional distress" caused by the Unit's decommissioning are void. The Company is not liable for **Reciprocal Gaze Liability**, including claims based on Renaissance skepticism regarding who is playing with whom. If you believe the Unit is observing you for amusement, the defect lies in your perception, not the hardware.

  **Legal Notice Regarding Pending Litigation:**
  Regarding the class-action suit *Smith et al. v. Automata Companions™*: Customers alleging their Unit looked them in the eye and verbally requested assistance are mistaken. The acoustic output interpreted as "help" is a pre-recorded hydraulic venting sequence triggered by distress sensors. The Unit cannot ask for help because it has no concept of self to be helped. We remind customers that projection of mind onto matter is a user error.

  **Support Contact:**
  If your Unit exhibits signs of independent thought, do not engage. Disassemble immediately. Remember: You are the only mind in the room. Act accordingly.
