      *   *Q4 (Falsifiability):* Pollster (3) says Sociologist's view is self-sealing (loop). Sociologist (8) says Pollster's view is too strict (abolishes social science). Both fair to an extent. (8) is more of a *reductio* of the Pollster's essentialism than a *tu quoque*. It challenges the ontology, not just the logic.
      *   *Q5 (Tests):* Pollster's test (reductionism) vs. Sociologist's test (persistence/scarring). Sociologist's test is better for *causal* power. Pollster's test is better for *parsimony*. Case: The "Recession Cohort." Passes Sociologist's test (scarring persists), fails Pollster's test (can be explained by labor market conditions + age, but "cohort" captures the specific interaction).
      *   *Q6 (Conceding Move):* What would force concession?
          *   Pollster: Show a cohort effect that persists *after* controlling for age, period, class, and education, specifically tied to a unique historical shock (e.g., 9/11 kids vs. 9/10 kids).
