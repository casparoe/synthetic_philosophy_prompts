          *   *Assessment:* Sound. Standard defense of vague predicates. Relies on the "gradient" being real (conceded by Pollster in 1, implicitly).
      *   *(7) Pollster:* Asks "which property?" Claims properties are leaky tendencies (anxious, online) that are actually period/age effects. Conclusion: Mood with a birth range.
          *   *Assessment:* Strong challenge. If properties aren't stable or unique, the kind is weak. Assumes these *are* just period/age effects without proving it.
      *   *(8) Sociologist:* Tu quoque/Reductio. Human science categories (depression, recession) are also clusters/contested. Claims their position is falsifiable (cohorts matter *when* jointly formed/labeled).
