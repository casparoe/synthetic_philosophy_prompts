      *   *(5) Pollster:* Boundary problem. Cutoffs are arbitrary (Dec 31 vs Jan 1). Industry convenience drives definitions.
          *   *Assessment:* Sound on arbitrariness of specific cutoffs. Overstates that arbitrary boundaries imply fake categories (sorites paradox issue).
