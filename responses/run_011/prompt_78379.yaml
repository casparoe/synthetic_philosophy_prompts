          *   *Assessment:* Solid definition of a "social kind." Distinguishes between the label and the causal trajectory.

  3.  **Addressing Specific Questions:**

      *   *Q1 (Collinearity):* Does APC collinearity kill generations? No, it kills *statistical identification* without assumptions. Assumption needed: e.g., Age effects are non-linear, or Period effects are uniform. Cost: Introducing bias/theory into the model.
      *   *Q2 (Analogies):* Astrology vs. Money. Astrology fits if the label *creates* the behavior ex nihilo. Money fits if the label coordinates behavior around real constraints. Money is better because structural constraints (labor market) exist independently of the label "Millennial." Disanalogy: Astrology lacks physical mechanism; Generations have structural mechanisms (economy).
