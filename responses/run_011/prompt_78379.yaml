      *   *(9) Pollster:* Utility test. Generation is rhetorical cover for structural factors (credit, class). "Write that instead, and the generation evaporates."
          *   *Assessment:* Strong pragmatic argument. Suggests "generation" is a confounder for class/structure.
      *   *(10) Sociologist:* Counter-example. Scarring effects (graduating in a recession) persist for life. Cohort captures the "scar" better than "the young" (which rotates).
          *   *Assessment:* Very strong. This is the strongest empirical argument for cohort effects (hysteresis/scarring).
      *   *(11) Pollster:* Reduces cohort to "everyone same age in year X." Calls it bookkeeping.
