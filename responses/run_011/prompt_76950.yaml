answer: |-
  # Handout Supplement: Disambiguating "Existence Is Not a Predicate"

  ## I. Inventory of Theses
  The slogan "Existence is not a predicate" is ambiguous. Below are six distinct claims often conflated under this heading. Each is regimented for evaluation.

  **1. The Grammatical Thesis**
  *   **Claim:** The word "exists" does not function grammatically as a predicate in natural language.
  *   **Regimentation:** In sentences of the form "$a$ exists," the term "exists" is not a grammatical predicate.
  *   **Verdict:** **False.** In English (and most Indo-European languages), "exists" occupies the syntactic position of an intransitive verb and functions as the grammatical predicate of the sentence. No competent linguist or philosopher denies this.

  **2. The First-Order Logical Thesis**
  *   **Claim:** Existence is not a first-order logical predicate.
  *   **Regimentation:** There is no primitive predicate $E!$ in the canonical notation of logic such that $E!x$ is a well-formed formula expressing a truth-condition distinct from quantification.
  *   **Verdict:** **Substantive and Contested.**
      *   *Defended by:* Fregeans, Russellians, Quineans.
      *   *Contested by:* Free Logicians (who posit an existence predicate to handle empty names), Meinongians (who distinguish existence from subsistence), and some Modal Logicians.

  **3. The Second-Order (Fregean) Thesis**
  *   **Claim:** Existence is a property of concepts, not objects.
  *   **Regimentation:** Existential statements are not of the form $Fa$ but of the form $\exists x (Fx)$. Existence is a second-order property ascribed to a concept $F$ (namely, that the extension of $F$ is non-empty).
  *   **Verdict:** **Substantive and Standard.** This is the dominant view in analytic philosophy but is not logically necessary. It relies on the reduction of singular existentials to general existentials (via Description Theory or similar).

  **4. The Kantian (Conceptual) Thesis**
  *   **Claim:** Existence is not a "real" predicate.
  *   **Regimentation:** Asserting that $x$ exists adds no new determination to the concept of $x$. The concept of "$x$ + existence" contains no more content than the concept of "$x$."
  *   **Verdict:** **Substantive and Defensible.** Distinct from the logical thesis. One could accept Kant's conceptual point while rejecting the Fregean logical analysis (e.g., if one believes existence is a primitive property that simply doesn't modify conceptual content).

  **5. The Metaphysical (Sparse) Thesis**
  *   **Claim:** Existence is not a property in the sparse (natural) sense.
  *   **Regimentation:** There is no universal *Existence* in the ontology of properties that particulars instantiate.
  *   **Verdict:** **Substantive and Contested.**
      *   *Defended by:* Nominalists, Deflationists, Quineans.
      *   *Contested by:* Defenders of abundant properties (who allow *any* meaningful predicate to correspond to a property) and Substance Ontologists.

  **6. The Deflationary (Quantificational) Thesis**
  *   **Claim:** The existential quantifier exhausts the meaning of existence.
  *   **Regimentation:** To say "$a$ exists" is just to say $\exists x (x = a)$. There is no further fact of the matter regarding "existence" beyond the truth of the quantified statement.
  *   **Verdict:** **Substantive.** This is the strongest reading. It entails the First-Order Logical Thesis and the Metaphysical Thesis (on sparse views). It is contested by Substantive Ontologists who believe existence is a robust feature of reality distinct from mere quantification.

  ---

  ## II. Entailment Relations
  Students must distinguish which claims support which. The following relations hold:

  1.  **The Grammatical Thesis is independent.** Its falsity (see Verdict) does not logically undermine any other thesis. One can maintain "Exists" is a grammatical predicate but not a logical one.
  2.  **The Second-Order Thesis entails the First-Order Logical Thesis.** If existence is a property of *concepts*, it cannot be a first-order property of *objects*.
  3.  **The First-Order Logical Thesis does not entail the Second-Order Thesis.** One could deny existence is a first-order predicate without accepting it is a second-order property (e.g., one might treat it as a syncategorematic expression with no corresponding property at all).
  4.  **The Deflationary Thesis entails the Metaphysical (Sparse) Thesis.** If the quantifier does all the work, there is no property of "existence" for objects to instantiate.
  5.  **The Kantian Thesis does not entail the Fregean/Second-Order Thesis.** Kant argued existence adds no content to a *concept*; he did not argue existence is a property of *concepts*. One can hold that existence is a property of objects (contra Frege) that nonetheless adds no conceptual determination (pro Kant).
  6.  **The Metaphysical (Abundant) Thesis is compatible with the First-Order Logical Thesis.** One can hold that "exists" is not a logical predicate while maintaining that there is an abundant property *Existence* corresponding to the word, provided that property does no logical work in inference.

  **Critical Warning:** Accepting the slogan on the **Kantian** reading (Conceptual) does not license the **Fregean** reading (Logical Form). This is the most common illicit inference.

  ---

  ## III. Application to Seminar Cases

  ### Case 1: The Ontological Argument
  *   **The Move:** "You cannot define God into existence because existence is not a predicate."
  *   **Analysis:**
      *   **Kantian Reading:** **Licenses the refutation.** If existence adds no determination to the concept of God, then a concept of an "existing God" is not greater than a "non-existing God." The argument fails conceptually.
      *   **Fregean Reading:** **Licenses the refutation.** If existence is a second-order property of concepts, then "God exists" is a category mistake if treated as a first-order perfection.
      *   **Modal Version (Plantinga):** **Does not license the refutation.** The modal argument relies on *Necessary Existence* being a property. Even if *existence simpliciter* is not a first-order property, *Necessary Existence* (existence in all possible worlds) may be treated as a property of an individual's essence. The slogan "Existence is not a predicate" is insufficient here; one must argue "Necessary Existence is not a property," which is much harder to sustain.
  *   **Verdict:** The slogan refutes the Cartesian/Anselmian versions (via Kant/Frege) but fails against the Modal version without significant augmentation.

  ### Case 2: Negative Existentials (Sherlock Holmes)
  *   **The Move:** "We can say 'Holmes does not exist' without committing to Holmes because existence isn't a predicate."
  *   **Analysis:**
      *   **Russellian/Second-Order Reading:** **Relocates the problem.** If "Holmes" is a disguised description ("the detective who lived at 221B..."), then "Holmes does not exist" means "Nothing uniquely satisfies the description." This avoids commitment.
      *   **Direct Reference/Free Logic Reading:** **Fails to resolve.** If "Holmes" is a name that refers (or fails to refer) directly, denying the predicate "exists" of the name still requires the name to have a semantic value to be the subject of the sentence. If the slogan implies we don't need an object to deny existence of, it requires a Free Logic framework. The slogan alone does not provide the semantics for empty names.
  *   **Verdict:** The slogan does not solve the problem; it merely signals adherence to a Description Theory or Free Logic. Without those accompanying theories, the slogan is inert.

  ### Case 3: Arithmetic and Ontological Worry
  *   **The Move:** "Don't worry about numbers existing; existence claims are just about concepts being satisfied."
  *   **Analysis:**
      *   **Fregean Reading:** **Begs the Question.** To say "Numbers exist" is to say "The concept *Number* is instantiated." This removes the worry about *first-order* existence but retains the worry about *second-order* existence. If the student worries that numbers are "dubious items," telling them existence is second-order does not assure them that second-order quantification is ontologically innocent.
      *   **Deflationary Reading:** **Supports the dismissal only if Quinean Criterion is accepted.** If "to be is to be the value of a variable," and we quantify over numbers, they exist. The slogan "existence is not a predicate" does not stop the quantifier from committing us.
  *   **Verdict:** This use is **unsupported**. It presupposes that second-order existence is ontologically lightweight. That is a substantive metaphysical claim, not a logical triviality derived from the slogan.

  ---

  ## IV. Diagnostic Sentence Patterns
  Use these examples to test which thesis is in play.

  | Sentence Pattern | Example | Embarrassed Reading(s) | Why? |
  | :--- | :--- | :--- | :--- |
  | **General Existential** | "Lions exist." | **Grammatical Thesis** | "Exists" is clearly a grammatical predicate here. |
  | **Singular Positive** | "Obama exists." | **Second-Order Thesis** | Hard to parse as a property of a concept without treating "Obama" as a description. |
  | **Singular Negative** | "Vulcan does not exist." | **First-Order Logical Thesis** (Standard Logic) | In standard logic, names must refer. If "Vulcan" refers, it exists. If it doesn't, the sentence is meaningless. Requires Free Logic or Descriptions. |
  | **Mathematical** | "Prime numbers exist." | **Kantian Thesis** | Mathematical existence seems to add something to the concept (consistency/constructibility) or is purely logical. |
  | **Modal** | "God necessarily exists." | **Deflationary Thesis** | Hard to reduce "Necessary Existence" to mere quantification without modal realism. |

  ---

  ## V. The Single Confusion
  **Do not confuse the grammatical function of a word with its logical contribution to truth conditions.**

  *Just because "exists" sits where "is red" sits in an English sentence does not mean it ascribes a property in the same way "is red" does.*
