prompt: |-
  So, context: I run the grants program at a small family foundation — about $9M a year, four board meetings, I write the recommendation memos and there are usually 30-40 finalists per cycle. The board is five people, none of them with any philosophy training (one of them took an ethics course in 1994 and brings it up constantly). We score finalists on a weighted rubric, five criteria, points out of 100, and the weights were set at some point in the late 2000s and have never been revisited. I'll admit up front that we sometimes pick the weights that make the answer come out the way we already wanted and then let the rubric take the credit, so I don't have a lot of standing to complain about fake precision — but I do want to stop doing it by accident. What's actually been bugging me is a pattern I've started calling the tiebreaker tell. Somebody on staff will say two finalists are incommensurable, different kinds of good, you can't compare them — and then within ten minutes someone proposes a totally arbitrary tiebreaker (which executive director we like more, whichever one we funded last cycle, one time literally a coin flip) and the room just accepts it. Nobody winces. If the values really couldn't be compared, settling it with a coin flip should feel like a category error, and it never does. My hunch is that most of our incommensurability talk is a label for something else and I can't tell which something else it is. For calibration on where I'm coming from: I've been reading the rationalist blogs since the sequences era, so my reflex is that everything is comparable and this is a modeling failure. But I've also read enough of the other side — Raz on incommensurability, Chang on parity and that move where you improve one option slightly and see whether it now clearly wins, Broome saying the whole thing is really just vagueness, Anderson arguing that cost-benefit is a normative mistake rather than a technical one — to know that "just pick a metric" is not obviously right. If I've garbled any of those, tell me rather than working around it.

  What I want is a triage procedure my staff can run on a contested comparison before we try to resolve it. The deliverable is an ordered set of tests, in the form a non-philosopher can actually execute in a 90 minute meeting: what you ask, what a sufficient answer looks like, and what the answer tells you about which kind of hard choice you're in. It needs to sort cases into at least the buckets I suspect exist — genuinely incomparable, comparable but on a par, just vague about where the boundary is, comparable in principle but not measurable precisely enough to rank, and comparable but where measuring would itself be the wrong move — and I want you to be explicit about which of those distinctions survives the translation into procedure and which ones I should throw out because nobody on my team will apply them consistently. Each bucket should end somewhere different: rank them and stop pretending it's hard; no ranking is available, hand it to the board as a values call and here's what the memo should say; or the rubric's numbers are the wrong instrument but a comparison is still available and here's how to make it without inventing points. I especially want a probe for the tiebreaker tell — does accepting an arbitrary tiebreaker actually count as evidence against parity, or can a real parity case absorb one without anything going wrong? My guess is the second, and I think that's where I'm wrong, but show me the argument either way. And flag every step that's really a judgment call wearing a procedure costume, including the ones you can't help but include.

  Then run it on three live cases. (a) An eviction-defense legal clinic in our county that keeps roughly 400 households housed a year, run by three lawyers, no scaling story whatsoever, versus a program in a neighboring state that trains high schoolers to monitor and restore streams — maybe 120 kids a year, small direct numbers, but the program officer insists the alumni go into the field and it compounds; staff keeps calling these different kinds of good and refusing to rank them. (b) Two grants in the same disease area, same intervention type, two different countries, cost-effectiveness from the same model with wide overlapping intervals and the better one about 1.4x on the point estimate — I want to know if this is a hard choice at all or just noise we're treating as sacred. (c) A local arts-and-outreach program the board chair's late mother founded, $150k a year, funding it is a standing expectation nobody wants to be the one to break, versus a much duller workforce program that is clearly better on expected value per dollar and clearly worse in every way anyone in the room can articulate. For each: which bucket, which test decided it, what the memo says, what the board does next. At least one of these has to come out against what I want — my prior is that (c) is my real incommensurability case and that the procedure should tell me it isn't, and if you think my prior is wrong, argue with it instead of flattering it. Finish with what the procedure can't do and where it will misfire in practice, and with how I keep the chair's insistence on a ranked list with a dollar score attached from turning back into fake precision. No reading list, please — I've got the names, what I don't have is the operational version.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **Role:** Grants program manager at a small family foundation ($9M/year, 5 board members).
      *   **Problem:** The current scoring rubric is outdated and manipulated ("fake precision"). Staff claims "incommensurability" to avoid ranking, but then accepts arbitrary tiebreakers (coin flips, ED preference) without cognitive dissonance ("tiebreaker tell").
      *   **Philosophical Literacy:** High. Knows Rationalist sequences, Raz, Chang, Broome, Anderson. Wants operationalization, not theory.
      *   **Goal:** A triage procedure (ordered tests) for staff to run *before* trying to resolve contested comparisons. Needs to sort cases into specific buckets (incomparable, parity, vagueness, measurable but imprecise, normative mistake).
      *   **Constraints:** 90-minute meeting max, non-philosopher executors. Must flag judgment calls disguised as procedure.
      *   **Specific Request:** Run the procedure on three live cases (a, b, c). At least one must challenge the user's prior (specifically regarding case c).
      *   **Output:** Operational procedure, case analysis, limitations, advice on managing the board chair.

  2.  **Deconstruct the Philosophical Landscape (Operational Translation):**
      *   *Incommensurability (Raz/Anderson):* No common metric exists. Comparing is a category error. *Operational check:* Does adding more of one good make it better than the other? If yes, they are comparable.
      *   *Parity (Chang):* Comparable, but neither is better, nor are they equal. They are "on a par." *Operational check:* Small improvements don't tip the scale definitively.
      *   *Vagueness (Broome):* The boundary is fuzzy, but there is a fact of the matter. *Operational check:* Can we refine the description until the preference emerges?
      *   *Measurement Error:* Comparable in principle, but our data is too noisy. *Operational check:* Do confidence intervals overlap significantly?
      *   *Normative Mistake (Anderson):* Cost-benefit is the wrong frame. *Operational check:* Does quantifying violate the value itself (e.g., selling a friend)?

      *User's "Tiebreaker Tell" Hypothesis:* User thinks accepting a coin flip proves they aren't *really* incommensurable.
      *Correction/Refinement:* If values are truly incommensurable (category error), a coin flip is absurd. If they are on a *par* (Chang), a coin flip is a rational way to resolve a choice between equally valid but distinct options where reason runs out. So the "tell" indicates *Parity*, not *Incommensurability*.

  3.  **Develop the Triage Procedure (The "90-Minute Protocol"):**
      *   Need to be practical. No jargon.
      *   *Step 1: The "More Money" Test (Chang's Small Improvement Argument).* If we gave Option A 10% more funding, would it clearly beat Option B?
          *   Yes -> Comparable (Rank them).
          *   No -> Go to Step 2.
      *   *Step 2: The "Common Currency" Test (Anderson/Raz).* Is there *any* metric (even "impact on human flourishing") that makes sense to apply to both without insulting the value?
          *   No -> Incommensurable (Values Call).
          *   Yes -> Go to Step 3.
      *   *Step 3: The "Noise Floor" Test (Measurement).* Is the difference smaller than our uncertainty?
          *   Yes -> Indistinguishable (Tiebreaker OK).
          *   No -> Go to Step 4.
      *   *Step 4: The "Sacred Value" Test (Normative).* Does measuring this destroy the value (e.g., paying for grief)?
          *   Yes -> Normative Mistake (Qualitative Memo).
          *   No -> Parity (Qualitative Ranking).

      *Refining the Buckets:*
      1.  **Hard Rank:** Clear winner.
      2.  **Noise:** Statistically indistinguishable.
      3.  **Parity:** Different kinds of good, reason doesn't dictate one, choice is permissible. (This is where the coin flip belongs).
      4.  **Incommensurability:** Comparison is inappropriate. (Rare in philanthropy).
      5.  **Normative Block:** Don't measure.

      *Addressing the "Tiebreaker Tell":* If a coin flip feels okay, it's likely *Parity* or *Noise*, not *Incommensurability*. In true incommensurability, you can't choose *at all* without betraying a value. In Parity, you must choose, but reason doesn't specify which.

  4.  **Drafting the Procedure (Iterative refinement for clarity):**
      *   Make it a checklist.
      *   Define "Sufficient Answer."
      *   Define "Next Step."
      *   Flag the "Judgment Calls."

  5.  **Running the Cases:**
      *   *Case (a) Eviction vs. Streams:* Staff says "different kinds of good."
          *   Test 1 (More Money): If eviction clinic gets 10% more, do they save 40 more houses? Yes. Does that beat streams? Hard to say.
          *   Test 2 (Common Currency): "Community stability" vs "Ecological health." Can we compare? Yes, under "Foundation Mission."
          *   Verdict: Likely *Parity*. They are different goods, but comparable under the mission. Coin flip is acceptable here *if* acknowledged as a choice between equals, not a measurement.
      *   *Case (b) Disease Model (1.4x):*
          *   Test 3 (Noise Floor): Overlapping intervals. 1.4x is within error margins.
          *   Verdict: *Noise*. Not a hard choice. It's a measurement failure. Stop pretending it's a value judgment.
      *   *Case (c) Arts (Mom) vs. Workforce:*
          *   User Prior: This is the real incommensurability case.
          *   Challenge: Is it *Incommensurable* or *Normative/Political*?
          *   Test 2 (Common Currency): Can we compare "Honoring Legacy" vs "Economic Mobility"? Yes, both are foundation goals.
          *   Test 4 (Sacred Value): Is the mom's memory "sacred" in a way that pricing it insults it? Maybe. But usually, this is just *Political/Preference* masquerading as philosophy.
          *   *Crucial Pivot:* This isn't incommensurability. It's a *governance constraint*. The board *wants* to fund the arts. The EV is lower.
          *   *Verdict:* This is *Parity* with a *Governance Override*. Or, more cynically, it's a *Rankable* choice where the Board is choosing the lower EV option explicitly. It is *not* incommensurable. I need to push back on the user here. The "Mom" factor makes it a *preference*, not a philosophical impasse.

  6.  **Addressing the "Tiebreaker Tell" Argument:**
      *   User thinks: Coin flip = proof they aren't incommensurable.
      *   My argument: Coin flip = proof of *Parity* (Chang). Incommensurability means you *can't* choose rationally. Parity means you *must* choose, but reason is silent. A coin flip is a valid will-formation tool in Parity. It is *not* valid in Incommensurability (because the options shouldn't be in the same choice set).
      *   So, the "Tell" indicates Parity, not "Fake Incommensurability."

  7.  **Managing the Board Chair:**
      *   Chair wants ranked lists with dollar scores.
      *   Risk: Fake precision.
      *   Solution: "Confidence Bands" instead of points. "Tier 1 (Fund)," "Tier 2 (Parity - Pick One)," "Tier 3 (Pass)."
      *   Force the Chair to own the tiebreaker.

  8.  **Review against Constraints:**
      *   90-minute meeting? Yes, the tests are quick.
      *   Non-philosopher executable? Yes, avoided jargon where possible.
      *   Flag judgment calls? Yes, will add "Warning" boxes.
      *   Challenge User on Case C? Yes, essential.
      *   No reading list? Understood.

  9.  **Final Polish:**
      *   Tone: Professional, direct, slightly conversational (matching the user's voice).
      *   Structure: Procedure first, then Cases, then Limitations/Board Management.
      *   Ensure the "Tiebreaker Tell" logic is clear.

  *(Self-Correction during drafting)*: I initially thought about calling Case C "Incommensurable." But the user suspects it is, and asked me to argue if I think they are wrong. I think they are wrong. It's not that the values can't be compared; it's that the Board has a *preference* that overrides the EV. That's a *governance* issue, not a *philosophical* one. Calling it incommensurable lets them off the hook for making a value trade-off. I need to be firm on this.

  *(Refining the Procedure Steps)*: Make sure the "More Money" test is phrased simply. "If we gave A an extra $10k, would it clearly be better than B?" If yes, they are comparable. If no, they might be on a par.

  *(Refining the Tiebreaker Argument)*: Be precise. Raz says incommensurability means no rational choice is possible. Chang says parity means rational choice is possible but not determined by reason. A coin flip is irrational under Raz (category error) but rational under Chang (will-formation). Since the room accepts the coin flip, they are operating in Chang's Parity, not Raz's Incommensurability.

  *(Final check on Case B)*: 1.4x with overlapping intervals. This is clearly Noise. The procedure should kill this quickly.

  *(Final check on Case A)*: Eviction vs. Streams. This is the classic Parity case. Different goods, both good. Coin flip is okay *if* labeled correctly.

  *(Final check on Case C)*: Mom's Arts vs. Workforce. This is the trap. It's not philosophy. It's "We want to fund this." The procedure should expose that the "incommensurability" claim is a shield for "We don't want to admit we're prioritizing sentiment over impact."

