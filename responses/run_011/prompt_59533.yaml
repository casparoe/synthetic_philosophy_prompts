answer: |-
  **Brainstorming and Premise Analysis**

  Harsanyi's Aggregation Theorem derives a linear sum of utilities from four core assumptions: (1) individual preferences satisfy von Neumann–Morgenstern (vNM) axioms of rationality under risk; (2) social preferences satisfy vNM axioms; (3) the Pareto condition holds (unanimous individual preference dictates social preference); and (4) anonymity (individuals are weighted equally). The theorem's conclusion—that social welfare must be a linear sum—holds only if the inputs are vNM utilities that are cardinally comparable across persons.

  In our context, the 0-to-10 life-satisfaction scores fail assumption (1). They are ordinal survey items, not risk-sensitive utility functions. Top-coding and adaptive expectations further sever the link between the score and cardinal welfare. Consequently, the theorem does not mathematically compel Rule A. To adopt Rule B (prioritarianism), we must reject the premise that the survey instrument provides cardinally comparable vNM utilities. If we treat the scores as merely ordinal proxies for welfare, the prohibition on concave transformation disappears. The cost of this rejection is forfeiting the claim that Rule A is the uniquely "rational" option; we acknowledge that choosing Rule B involves an ethical judgment about distribution that the data alone cannot settle. However, this is preferable to falsely claiming mathematical necessity for a rule that ignores distributional inequities embedded in the data.

  ***

  **MEMORANDUM**

  **TO:** Wellbeing Budget Advisory Panel
  **FROM:** Student Member, Philosophy Graduate Program
  **DATE:** October 24, 2023
  **RE:** Recommendation on Scoring Rule Selection for Program Ranking

  **Recommendation**

  I recommend that the Panel adopt Rule B, the prioritarian scoring rule, for the ranking of program proposals. This rule applies a concave transformation to resident scores before aggregation, giving greater moral weight to improvements accruing to those with lower baseline wellbeing. While the Panel's economist argues that Rule A (the simple sum) is uniquely mandated by rationality, this claim relies on technical assumptions about our data that do not hold. By rejecting the premise that our survey instrument provides cardinally comparable utilities, we avoid a false constraint and align the budget allocation with the ethical imperative to prioritize the most disadvantaged.

  **Reasoning and Theoretical Grounds**

  The argument for Rule A rests on Harsanyi's Aggregation Theorem, which states that if individual and social preferences satisfy specific rationality axioms regarding risk, and if unanimous individual preferences are respected, social welfare must be a linear sum of individual utilities. The economist's contention is that Rule B violates this theorem, rendering it irrational. However, the theorem's force depends entirely on the input data satisfying its measurement requirements. Specifically, the theorem requires that individual utilities be cardinally measurable and comparable across persons, and that they reflect attitudes toward risk (vNM utilities).

  Our survey instrument—a 0-to-10 life-satisfaction item—does not meet these requirements. It is at best an ordinal measure. A one-point increase for a resident scoring 2 does not necessarily represent the same quantum of welfare as a one-point increase for a resident scoring 8. Furthermore, respondents in long-disadvantaged neighborhoods often exhibit adaptive expectations, systematically reporting lower scores for similar objective conditions than advantaged residents. If we treat these scores as cardinal utilities, we encode these adaptive depressions into the budget logic, effectively penalizing communities for having adjusted to deprivation.

  Rule B corrects for this measurement error and ethical blind spot. By applying a concave transformation, we acknowledge that the marginal moral value of a score improvement is higher for those at the bottom. This does not violate rationality; it violates only the assumption that the survey scores are perfect proxies for vNM utilities. Since the data fails the theorem's prerequisites, the theorem's conclusion does not bind us. We are free to choose a weighting scheme that reflects our ethical commitment to reducing inequality without being accused of mathematical inconsistency.

  **The Strongest Case for Rule A**

  The strongest consideration in favor of Rule A is not mathematical necessity but procedural integrity and transparency. The economist's position protects the Panel from accusations of paternalism. Rule A treats every resident's self-reported satisfaction as sovereign and equal. It avoids the need for the Panel to decide *how much* more a point matters for a low-scoring resident versus a high-scoring one. Rule B requires us to select a specific curvature for the transformation function, which introduces an element of arbitrariness. If we choose Rule B, we must defend why we weight the bottom quintile twice as much as the top, rather than 1.5 or three times. Rule A avoids this by defaulting to unity weights. Additionally, Rule A satisfies the Pareto condition over the *scores* themselves: if a program raises everyone's score, the sum necessarily rises. Rule B could theoretically rank a program lower if it increases inequality even while raising total scores, which some may view as violating the principle that we should never reject a change that makes everyone better off according to the metric we chose to measure them.

  **Implementation and Conditions**

  Despite the transparency benefits of Rule A, the ethical costs of ignoring distribution and adaptive preferences are too high. Therefore, the Panel should proceed with Rule B under the following implementation conditions:

  First, the concave transformation function must be fixed publicly before scoring begins to mitigate charges of arbitrariness. We should adopt a standard logarithmic or square-root transformation rather than designing a custom curve for this cycle. This ensures reproducibility and limits the ability to manipulate outcomes for specific programs.

  Second, we must establish a trigger for re-evaluation. If the city commissions a new survey instrument that is validated as cardinally comparable across populations (for example, a vignette-adjusted capability measure), the Panel should revert to Rule A or a hybrid model. Until such data exists, Rule B is the robust second-best option.

  Third, regarding the proposal of a hybrid model (a sum subject to distributional constraints): this is theoretically incoherent for our purpose. A constrained sum is effectively a different weighting scheme in disguise. It is clearer to adopt the explicit weights of Rule B than to obscure them within constraints. We should not split the difference; we must commit to one logic of aggregation to ensure the ranking is complete and transitive.

  **Conclusion on Theoretical Cost**

  In adopting Rule B, the Panel explicitly rejects the premise that the current survey scores satisfy the cardinal comparability required by Harsanyi's theorem. Some may view this as a theoretical cost, as it means we cannot claim our ranking is the unique output of rational aggregation. I argue this is not a cost but the correct diagnosis of the theorem's limits. The theorem shows what follows *if* we have comparable utilities. It does not prove we have them. Recognizing this limitation allows us to use the budget to correct for structural inequities rather than amplifying them under the guise of neutrality. Rule B is the only option that acknowledges the reality of our data and the ethical demands of our charter.
