answer: |-
  ### The Menu of Theses: "Meaning Isn't in the Head"

  The slogan is ambiguous because it conflates distinct axes of variation. In the menu below, I order the interpretations from weakest (most trivial, most compatible with your project) to strongest (most controversial, fatal to your project).

  For each entry, I specify:
  1.  **The Notion of Meaning:** What property is being claimed as "not in the head"?
  2.  **The "In the Head" Criterion:** What does it mean for a property to be internal? (Usually: supervenience on intrinsic physical state).
  3.  **The Scope:** Does this apply to all terms or specific classes (e.g., natural kind terms)?
  4.  **The Target:** Individual psychology or public language?

  ---

  #### 1. The Extension Thesis (Weakest)
  *   **Precise Formulation:** For natural kind terms and indexicals, the **extension** (the set of objects referred to in the actual world) does not supervene on the speaker's intrinsic physical state.
  *   **Axes:**
      *   *Meaning:* Extension/Reference.
      *   *In the Head:* Determined by intrinsic physical state.
      *   *Scope:* Natural kind terms and indexicals only.
      *   *Target:* Individual speaker's reference.
  *   **Verdict:** **Platitude / Substantive but Widely Accepted.** Almost no internalist denies that reference depends on causal contact with the world.
  *   **Evidence:** **Twin Earth establishes this.** (Oscar and Twin-Oscar refer to different substances despite identical heads). Division of Labor is not required.
  *   **Compatibility with 2Dism:** **Fully Compatible.** Two-dimensionalism concedes that reference (extension) is determined by the secondary intension applied to the actual world, which is wide. Your project does not rely on narrow reference.

  #### 2. The Semantic Value Thesis (Moderate)
  *   **Precise Formulation:** The **semantic value** (truth-conditions relative to the actual world, or Secondary Intension) of natural kind terms does not supervene on the speaker's intrinsic physical state.
  *   **Axes:**
      *   *Meaning:* Truth-conditions / Secondary Intension.
      *   *In the Head:* Supervenience on intrinsic physical state.
      *   *Scope:* Natural kind terms (potentially extended to all descriptive terms).
      *   *Target:* Individual idiolect semantics.
  *   **Verdict:** **Substantive and Defensible.** This is the core semantic externalist claim.
  *   **Evidence:** **Twin Earth establishes this.** It shows that two subjects can be intrinsically identical while their utterances have different truth conditions. Division of Labor supports this for technical terms but is not necessary for the basic Twin Earth result.
  *   **Compatibility with 2Dism:** **Fully Compatible.** Your framework explicitly grants that secondary intensions are wide. You argue that this is not the *only* dimension of meaning.

  #### 3. The Public Language Thesis (Stronger)
  *   **Precise Formulation:** The **meaning of words in a public language** is fixed by community-wide norms and usage, not by any individual's intrinsic state, even for terms that are not natural kinds.
  *   **Axes:**
      *   *Meaning:* Linguistic Meaning (Public).
      *   *In the Head:* Determined by individual intrinsic state vs. social environment.
      *   *Scope:* All expressions in a public language.
      *   *Target:* Public Language (not individual psychology).
  *   **Verdict:** **Substantive and Defensible.** This relies on social externalism (Burge-style cases) rather than just physical externalism.
  *   **Evidence:** **Division of Labor establishes this.** Twin Earth (physical environment) does not establish this; you need cases where the physical environment is identical but the linguistic community differs (e.g., "arthritis" cases).
  *   **Compatibility with 2Dism:** **Compatible.** Two-dimensionalists typically distinguish between public language meaning (which may be wide) and the cognitive content associated with that meaning by a speaker (which can be captured by primary intension).

  #### 4. The Global Semantic Externalism Thesis (Very Strong)
  *   **Precise Formulation:** There is **no semantically relevant property** (including cognitive significance, primary intension, or mode of presentation) that supervenes on the speaker's intrinsic physical state.
  *   **Axes:**
      *   *Meaning:* Any semantic property whatsoever.
      *   *In the Head:* Supervenience on intrinsic physical state.
      *   *Scope:* All expressions.
      *   *Target:* Individual cognitive semantics.
  *   **Verdict:** **Controversial / Disputed.** This denies the existence of narrow content entirely.
  *   **Evidence:** **Twin Earth does NOT establish this.** Twin Earth shows secondary intensions vary while intrinsic state holds constant. It does *not* show that primary intensions (functions from centered worlds to extensions) vary. To establish this, one must argue that primary intensions are either non-existent or also depend on external factors.
  *   **Compatibility with 2Dism:** **Incompatible.** This thesis directly contradicts your dissertation's core proposal that primary intension is narrow.

  #### 5. The Methodological Externalism Thesis (Strongest)
  *   **Precise Formulation:** **Psychological states** relevant to the explanation of behavior are individuated by wide content only; narrow content (if it exists) is explanatorily idle.
  *   **Axes:**
      *   *Meaning:* Content individuating psychological states.
      *   *In the Head:* Causal efficacy in behavior / Explanatory relevance.
      *   *Scope:* All mental states.
      *   *Target:* Folk Psychology / Cognitive Science.
  *   **Verdict:** **Methodological Claim / Disputed.** This moves from semantics to philosophy of mind.
  *   **Evidence:** **Neither Twin Earth nor Division of Labor establishes this.** These are semantic arguments. This thesis requires a separate argument about the nature of causal explanation (e.g., that only relational properties explain relational behavior, or conversely, that only intrinsic properties explain local behavior).
  *   **Compatibility with 2Dism:** **Incompatible.** Your project likely assumes narrow content has a role in explaining rationality, a priori reasoning, or cognitive dynamics.

  ---

  ### Analysis of the Dismissal

  #### 1. The Weakest Reading Licensing Dismissal
  To dismiss your project as "relitigating Twin Earth" and claiming the matter is "settled," your colleague must be relying on **Thesis 4 (Global Semantic Externalism)** or **Thesis 5 (Methodological Externalism)**.

  Theses 1, 2, and 3 are compatible with your view. If your colleague only meant Thesis 2 ("Secondary intensions are wide"), they would have no grounds to dismiss your work, as you concede that point. Therefore, their dismissal logically presupposes that Twin Earth established Thesis 4: that *because* reference is wide, *no* aspect of meaning can be narrow.

  #### 2. Entitlement to the Reading
  Your colleague is **not entitled** to this reading based solely on Twin Earth-style cases.
  *   **The Gap:** Twin Earth demonstrates that intrinsic state does not fix *extension* (Secondary Intension). It leaves open the possibility that intrinsic state *does* fix the *rule for determining extension across possibilities* (Primary Intension).
  *   **The Error:** The slogan "Meaning isn't in the head" treats "meaning" as univocal. It illegitimately slides from the established truth of Thesis 2 (Semantic Value is wide) to the controversial claim of Thesis 4 (All semantic properties are wide).
  *   **Settled Science:** It is settled that *reference* is not in the head. It is not settled that *cognitive significance* (primary intension) is not in the head. Claiming the latter is settled is a category mistake regarding the two-dimensional distinction.

  #### 3. What the Two-Dimensionalist Can Concede
  You can and should concede **Thesis 2** without cost to your project.
  *   **Concession:** Acknowledge that if "meaning" is defined strictly as *semantic value in the actual world* (extension/truth-conditions), then meaning is not in the head.
  *   **Strategic Move:** Clarify that your project is not to recover narrow *reference*, but narrow *character* (primary intension). You are not denying externalism; you are denying *global* externalism.

  #### 4. The Shifted Burden
  Once you concede that secondary intensions are wide, the burden shifts away from the metaphysics of content to the **utility of narrow content**.
  *   **The New Question:** The debate is no longer "Does narrow content exist?" (Twin Earth doesn't answer this). The debate becomes: "Is the primary intension robust enough to do the philosophical work required of 'narrow content'?"
  *   **The Colleague's Real Objection:** Your colleague's frustration likely stems from a suspicion that Primary Intension is either (a) too thin to be "meaning" (merely descriptive Fregean sense without semantic weight) or (b) explanatorily redundant (if behavior is caused by brain states, why do we need a semantic label for them?).
  *   **Your Task:** You must demonstrate that the primary intension is not just a formal artifact of two-dimensional semantics, but captures a genuine cognitive normativity or explanatory role that wide content cannot capture. You are not relitigating Twin Earth; you are arguing that Twin Earth leaves a specific explanatory gap that only narrow content can fill.
