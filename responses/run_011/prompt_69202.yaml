      *   *Drafting:* (Mental Iteration) "Consider a single-payer fund... A chose risk, B didn't... But A's choices come from upbringing... A pays for B... Is this consistent?" -> *Refining for precision.* "Evaluate whether a luck egalitarian can consistently maintain the distinction... given that A's preferences are endogenous... and the scheme is self-financing..."

