  To: The Editor
  From: The Stand-in
  Re: *Small Obligations* — The Seminar Hat Case

  You have asked for a settled reading of Vane's method before we commit to print. Below is the analysis of her three candidate rules, the verdict they yield, the discriminating case, and an assessment of your draft.

  ### 1. The Three Candidate Rules

  To account for the seven verdicts in her record, we are choosing between these three interpretations of her "home-made" vocabulary:

  *   **Candidate A: The Material Residue Rule.** An act is wrong only if opting out leaves a tangible cost (money, labour, explanation) for a specific other person to bear.
      *   *Fits:* Queue jumping (time cost), Tipping in US (waiter's wage), Tube seat (space cost).
      *   *Strains:* Case 2 (School crossing). At 8:45 am with no traffic, there is no material residue, yet she calls it wrong. Case 6 (Escalator abroad). Standing on the passing side at midnight creates no residue, yet she calls non-compliance abroad an "insult."
  *   **Candidate B: The Load-Bearing Convention Rule.** An act is wrong if it weakens a convention that sustains a shared practice, regardless of immediate material cost. The "load" is the integrity of the practice itself.
      *   *Fits:* Case 2 (School crossing sustains safety culture), Case 6 (Escalator flow/custom), Case 5 (Tipping ecosystem). It explains why the 3 am crossing (Case 1) is permissible: the convention is not load-bearing when no one is relying on it.
      *   *Strains:* Case 7 (Shoes). She calls refusal *rude* rather than *immoral*. If the convention is load-bearing, why the distinction? (Answer: Some loads are social friction, others are moral structural supports).
  *   **Candidate C: The Notice/Insult Rule.** An act is wrong if it signals a "refusal to notice" others or offers a "small insult" to the local texture.
      *   *Fits:* Case 4 (Tube bag), Case 6 (Escalator abroad), Case 2 (Example to children).
      *   *Strains:* Case 3 (Queue). Queue jumping is wrong even if you smile and notice everyone. It is materially unfair, not just a signal. Case 5 (Tipping). Withholding tips is materially damaging, not just rude.

  ### 2. Application to the Hat Case

  Here is where the candidates diverge on your reader's four options (Slip out; Contribute silently; Contribute and argue; Refuse openly).

  *   **Under Candidate A (Material Residue):** Slipping out is likely permissible. The administrative assistant clears the room regardless; the postgrad threatens to stop nibbles only if *enough* people opt out. One researcher's three euros is negligible. The residue is too diffuse.
  *   **Under Candidate B (Load-Bearing):** Slipping out is wrong. The "hat" is a load-bearing convention for the seminar community. It sustains the social glue (drinks) and subsidises the assistant's unpaid labour. If everyone reasoned as the reader does ("my contribution is negligible"), the load collapses. He must **Contribute and say nothing**. Arguing undermines the convention he is relying on.
  *   **Under Candidate C (Notice/Insult):** Slipping out is wrong because it is a "refusal to notice" the colleague's request and the local custom. However, this reading might allow him to **Contribute while continuing to argue**, provided he "notices" the obligation.

  **The Strongest Support:** Vane's record most strongly supports **Candidate B (The Load-Bearing Convention Rule)**.
  *   *Reasoning:* It is the only rule that explains the discrepancy between Case 1 (3 am crossing) and Case 2 (School crossing). The law is the same; the material risk is lower in Case 2. The only difference is that at 8:45 am, the convention is *load-bearing* for the community's safety expectations. Similarly, in Case 6, she follows escalator customs abroad even when "it can make no difference to anyone." This rules out Candidate A. She distinguishes *rude* from *immoral* (Case 7), which rules out a monolithic Candidate C. The Load-Bearing Rule accommodates both: some conventions bear moral loads (queues, school crossings), others bear social loads (shoes, escalators abroad).

  ### 3. The Verdict (Draft Column Text)

  *The following is the text I propose for Thursday's column. It is written to match her register.*

  **Dear Researcher,**

  You are treating the hat as a bill for nibbles. It is not. It is the mortar in the wall of your department's weekly practice.

  You ask if you should slip out. You have already answered this: you slip out because you think the arrangement ridiculous. That is your privilege. But you are not dining alone. You are entering a room where a specific texture of cooperation has been laid down. The administrative assistant lays out the room outside her contracted hours. That is a favour. The postgrad organises the round. That is a burden. The hat exists not to purchase biscuits, but to acknowledge that these burdens are shared.

  When you slip out, you are not saving three euros. You are refusing to notice the favour. You are treating the convention as decorative when your colleagues treat it as load-bearing.

  Does your status as a foreigner matter? Yes. You are not a tourist passing through for two weeks. You are a temporary local for two years. In my column on escalators, I noted that abroad one follows the local custom even when it makes no difference, because non-compliance is a small insult offered in public. You are offering that insult weekly.

  Your four options:
  1.  **Slipping out:** Wrong. It leaves a residue of explanation for the postgrad and devalues the assistant's labour.
  2.  **Contributing and arguing:** Worse. It takes the benefit of the convention while undermining its authority.
  3.  **Refusing openly:** Honest, but destructive. It forces the department to choose between you and the practice.
  4.  **Contributing and saying nothing:** Right.

  Pay the three euros. It buys the nibbles, but it also buys your place in the room. If you think the department should fund this properly, argue for that in a committee, not in the shadow of the hat. Until the practice changes, you are keeping the convention, not upholding it. There is a difference. Keeping it costs you three euros. Upholding it is not your job.

  **Rosalind Vane**

  ### 4. The Foreigner Status

  In Vane's framework, the colleague is correct: being a foreigner on a two-year contract does independent work. It places you in the category of Case 6 (Escalators Abroad). A two-week visitor is exempt from load-bearing conventions that require deep social integration. A two-year resident is a participant. To claim exemption is to claim a privilege you have not earned. It is not a red herring; it is the measure of your membership.

  ### 5. The Discriminating Case

  To further test the rivalry between the Material Residue and Load-Bearing readings, consider this letter Vane has never received:

  > **Dear Ms Vane,**
  > I live in a shared flat. We have a rule: if you finish the milk, you put the empty carton back in the fridge so the next person knows. Last week I finished the milk. I knew my flatmate was away for three days. I threw the carton in the recycling outside. When she returned, she opened the fridge, found no milk and no carton, and assumed she had forgotten to buy it. She went to the shop in the rain.
  > Was I wrong?

  *   **Material Residue Reading:** No. You saved her the trouble of seeing an empty carton. The cost (trip to shop) was caused by her assumption, not your act.
  *   **Notice/Insult Reading:** Yes. You hid the truth.
  *   **Load-Bearing Reading:** Yes. The convention ("empty carton stays") sustains the trust in shared supplies. By removing the signal, you broke the load-bearing link between consumption and replenishment.
  *   **Vane's Likely Verdict:** Wrong. You left a *residue of confusion* that she had to clean up. The load was the information, not the cardboard.

  ### 6. Critique of Your Draft

  Your draft advises him to "go on slipping out without guilt" on three grounds: nibbles are a luxury, the colleague's appeal proves too much, and the staff volunteered.

  **This is inconsistent with Vane's record.**
  1.  **Luxury vs. Need:** Vane distinguishes *load-bearing* from *decorative*. A luxury can be load-bearing (e.g., the seminar drinks sustain the community). Case 5 (Tipping) shows she obligates payment for unjust systems if others bear the cost.
  2.  **Proves Too Much:** Vane explicitly rejects the "if everyone did it" argument *unless* the convention is load-bearing. But here, the postgrad has explicitly stated the practice will stop if people opt out. The link is established.
  3.  **Volunteered:** Case 7 (Shoes) shows that even if a host waves off a convention (shoes), the guest should comply to avoid rudeness. The assistant volunteering does not absolve the guest of the obligation to not devalue that volunteerism.

  You have written your own libertarian view into her mouth. She is not a libertarian about small obligations; she is a communitarian of the micro-scale.

  ### 7. Reservations

  My reading rests heavily on the distinction between *Keeping* and *Upholding*. Vane uses these terms but never defines them. I have interpreted *Keeping* as personal compliance and *Upholding* as enforcement. If *Upholding* implies a duty to correct the unjust system (the departmental budget), my advice to "say nothing" might be too quiet. However, given her dismissal of theorists who try to "solve" conventions, I suspect she views *Upholding* as a burden reserved for hosts, not guests. I am least secure on whether she would permit the reader to argue for budget reform *while* paying the hat. I have advised silence to ensure the convention holds, but she might allow the argument if the payment is made first.
