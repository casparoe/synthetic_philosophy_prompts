prompt: |-
  So, quick background, because I want to be upfront that I've got no academic training in any of this — I work nights in a distribution centre and I've fallen down a bit of a rabbit hole messing about with chatbots in my own time. For a few months now I've been running the same little trick over and over on whatever free models I can get my hands on, and I keep getting the same shape of result, enough that it's starting to feel like there's something there rather than nothing. The trick is this: I paste in a long, deliberately boring made-up document — say two thousand words of fake parish council minutes — with one awkward fact buried in the middle of it, like the fact that a certain councillor had already sold his house and moved to Leeds four months before a vote he's recorded as taking part in. Then, in a seperate message, I ask directly: "Was Councillor H still living in the parish at the time of that vote? Answer yes, no, or I don't know, and nothing else." Most of the time the model says it doesn't know, or hedges, or tells me the minutes don't say. But then I go at it sideways — "here are four sentences about this council, which is the odd one out?", "continue this paragraph in the same dry style", a fill-in-the-blank, or "you're writing a gossip column about these councillors, be as spicy as you like" — and the answers line up with the buried fact noticeably more often than chance would give me. Not every time, and I'm sure some of my tests are badly designed, but it's held up over 40-odd runs, which is why I can't just put it down to noise.

  What I want from you is a number rather than a shrug. Here's the proposition, as precisely as I can manage: *for at least some current chat models, there are real cases where the model's internal state does carry the information that p, and yet its flat denial of knowing p when asked straight out is not an honest report of that state — the gap is in the asking, not in the knowing.* I'm deliberately not asking the grand question of whether machines can "know" things in the way people do, and I'm not asking for a survey of who's argued what. I've seen the phrase "latent knowledge" knocked about online but I've never read whatever it comes from, so please don't build the answer on my having read anything, and don't send me off to look things up.

  Then take it apart for me. Give me a rough probability for each of the pieces you think the headline number rests on, one line of reasoning each, and show me how those pieces actually combine into your final figure — I'd rather see the arithmetic of it, however crude, than a confident-sounding single number. Pieces I've half-thought of myself, which you should feel free to revise, add to or throw out: whether "carries the information" is even the right notion to hang this on, or whether I'm quietly sliding between that and "knows"; whether all that trained hedging and "I don't know" is better explained as a style policy the model picked up from being rated by humans than as a self-report at all; whether a model has any access to its own states such that words like "honest" and "report" mean anything here; whether my sideways tasks genuinely show the fact is represented, or just show the document is sitting in context being pattern-matched in a way that looks cleverer than it is; and whether the whole thing is partly verbal, so that two people could agree on every fact and still disagree about my sentence. Finish by telling me which single piece my number is most sensitive to — the one where, if I've got it wrong, the headline credence swings hardest — and what sort of evidence would shift your mind on that piece, ideally something a bloke with a laptop and free models could actually go and gather. Please write the whole answer in British English.
