answer: |-
  You have independently rediscovered **Path Dependence** theory, specifically the economic formulation developed by W. Brian Arthur and Paul David. Your "hysteresis" framing is the correct shape. In physics and economics, this is modeled as an **Energy Landscape**: there are multiple "basins of attraction" (stable states), and moving between them requires overcoming an "activation energy" (switching cost).

  Here is the precise principle that captures your cases, the clause each hits, the prediction, and the sacrifice you must make.

  ### The Principle: The Basin of Attraction Model

  An outcome is determined by the interaction of three variables:
  1.  **Topography (Inevitability):** Determined by physical or logical constraints. If one state is vastly more efficient (deeper basin), independent trajectories converge on it.
  2.  **Initial Conditions (Contingency):** If multiple states are locally optimal (similar depth), early noise or minor events determine which basin is entered first.
  3.  **Activation Energy (Lock-in):** The cost to move from the current basin to a better one. If `Activation Energy > Potential Gain`, the system remains locked in the sub-optimal state.

  **The "Stuck" Distinction:** The person who spoke to you about "nobody noticed" vs. "everyone knows" is describing **Information Asymmetry** vs. **Coordination Failure**.
  *   *Nobody noticed:* The system thinks it is at a global optimum (false topography).
  *   *Everyone knows/Can't move:* The system knows a deeper basin exists, but the ridge between them is too high (Coordination Failure).

  ### Mapping Your Cases

  | Case | Topography (Inevitability) | Initial Conditions (Contingency) | Activation Energy (Lock-in) | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **QWERTY** | Low (Many layouts work) | **High** (Early typist habits) | **High** (Retraining muscle memory) | Contingent + Locked |
  | **Containers** | **High** (Physics of stacking) | Low (Concept) | **Medium** (Specific sizes arbitrary) | Inevitable Concept / Contingent Spec |
  | **Calculus** | **High** (Math is discovered) | **High** (Notation is invented) | **High** (Global re-education) | Inevitable Idea / Contingent Syntax |
  | **Driving Side** | Low (Left=Right) | **High** (Arbitrary choice) | **High** (Infrastructure rewrite) | Contingent + Locked (Sweden = Paid Energy) |
  | **x86** | Medium (CISC vs RISC) | **High** (IBM PC choice) | **High** (Software ecosystem) | Locked (Context: Desktop). *ARM = New Basin (Mobile)* |
  | **VHS** | Low (Tape tech similar) | **High** (Licensing/Length) | **Medium** (Consumer hardware swap) | Contingent + Locked |
  | **Codebase** | Low (Config formats equal) | **High** (One guy's preference) | **??** (See Sacrifice below) | Contingent + Locked |

  ### The Prediction

  **Case:** **The Semicolon (`;`) as a statement terminator in C-style languages.**

  **My Prediction of Your Verdict:**
  You will judge this as **Contingent + Lock-in, but weakening.**
  *   *Topography:* Low. You need *some* delimiter (newlines, whitespace, or semicolons). The semicolon itself is not physically inevitable (see: Python, Go, Swift).
  *   *Initial Conditions:* High. ALGOL used it; C inherited it; Java/C# copied C. It was a chain of historical inheritance.
  *   *Activation Energy:* High for existing ecosystems (C++/Java), but Low for new languages (Rust/Go make it optional or inferred).
  *   *Why:* It fits your hysteresis model perfectly. We are in a basin, but the "ridge" is low enough for new languages to jump to a different basin (no semicolons), while old languages remain stuck.

  ### The Sacrifice

  To keep this principle consistent, you must give up your assessment of the **Codebase Case**.

  You stated: *"The migration is maybe two weeks of work... and it has not moved in fifteen years."*

  Under the Basin of Attraction model, this is mathematically impossible. If `Gain > Activation Energy`, the system *will* move, given enough time (15 years is enough). Since it has *not* moved, one of your variables is wrong.

  You must give up the idea that **Engineering Hours = Activation Energy.**

  For a backend engineer, "two weeks of work" is the *theoretical* energy. The *actual* Activation Energy includes:
  1.  **Risk Cost:** The probability that the migration breaks production × the cost of the outage.
  2.  **Coordination Cost:** The meetings required to get consensus from stakeholders who don't care about config formats.
  3.  **Opportunity Cost:** The political capital spent on "cleanup" vs. "new features."

  If the codebase hasn't moved in 15 years, the *real* Activation Energy is not two weeks. It is "Two weeks + Risk of Fire + Political Capital." That sum is greater than the Gain.

  **The Hard Truth:** Either the config format is not actually causing enough pain (Gain is low), or the migration is much riskier/harder than you think (Energy is high). Your intuition that "it's cheap and we're still stuck" violates the hysteresis model. To keep the model, you must accept that **organizational friction is a physical force** just as real as typing speed or steel costs.

  ### Summary
  1.  **Principle:** Basin of Attraction (Topography + Initial Conditions + Activation Energy).
  2.  **Prediction:** Semicolons (Contingent history, high lock-in for old langs, low barrier for new ones).
  3.  **Sacrifice:** Your objective estimate of the Codebase switching cost. You are measuring *typing time*, but the lock-in is *organizational risk*.
