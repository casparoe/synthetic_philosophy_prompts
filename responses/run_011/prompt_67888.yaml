answer: |-
  Your intuition is correct. You have identified a fracture between how your company claims to make decisions and what it actually means to have a reason for doing something. Here is the argument broken down by your questions.

  ### 1. What does this setup presuppose about what a reason is?

  Your current process presupposes that a reason is not a thought in a human mind, but a statistical relationship in the world. In this view, a choice is justified if it is the output of a reliable procedure, regardless of whether anyone understands the mechanism.

  This treats justification as **external**. It assumes that truth lives in the data, not in the narrator. If the metric moves, the action is validated. The "reason" belongs to the system (the experiment platform, the model, the spreadsheet), not to the engineer or the product manager. The human role is merely to maintain the machinery that generates these valid outcomes. This permits a coherent view of justification where the *process* is the rational agent, and the people are merely its components.

  ### 2. Which rival views does the practice quietly rule out?

  It rules out the view that to act rationally, a person must understand *why* they are acting. This rival view holds that a reason must be something a human can grasp, hold in their head, and use to guide future actions in different contexts.

  By accepting "the data said so" as a full stop, you rule out the idea that engineers should be **authors** of the product. They become **operators**. If a person cannot articulate why a feature exists, they cannot be held accountable for its side effects, nor can they adapt its purpose when context changes. Your practice assumes that accountability lies in following the process correctly, not in understanding the outcome. It silences the idea that wisdom matters more than measurement.

  ### 3. Are the parts consistent with each other?

  No. There are two major collisions here.

  **The Ethical Collision (Rule 1 vs Rule 4):**
  Rule 1 says the metric decides truth. Rule 4 says ethical principles decide boundaries. These clash when a "dark pattern" wins the A/B test. If the metric is the ultimate judge of value (as Rule 1 implies), then Rule 4 is an arbitrary obstruction. If Rule 4 is valid, then the metric is not the ultimate judge of value. You cannot claim both that "the data decides" and "principles decide" without admitting that the data is subordinate to human judgement. Currently, you treat the data as king until it conflicts with ethics, at which point ethics becomes king. This is unstable.

  **The Truth Claim Collision (Rule 5 vs Reality):**
  Rule 5 claims the feed "reflects what our community wants." This is a category error. The feed reflects what maximises a specific metric (e.g., time spent). It is entirely possible to maximise time spent by showing people things they *do not* want (e.g., outrage, addiction loops) but cannot look away from. Claiming the metric equals "community want" is a fiction used to smooth over the fact that you are optimising for a number, not a human desire. You cannot hold this claim without bad faith unless you genuinely believe your metric is a perfect proxy for human happiness, which is empirically unlikely.

  ### 4. What theory of legitimacy does Rule 2 need?

  Rule 2 (legacy features stay unless beaten) relies on a theory of **Legitimacy by Survival**. It assumes that if a feature has not been proven harmful or inferior, it has a right to remain. This is a conservative view: the status quo is innocent until proven guilty.

  For the slogan "everything earned its place by evidence" to be true, you would need to argue that *current* performance validates *past* origin. Essentially, because the legacy feature still works today (users haven't fled), it is retroactively justified. This is weak. It conflates "has not yet failed" with "was wisely chosen." To make this honest, you would need to admit that half the app is there due to historical accident, not evidence, and that you are relying on **Path Dependence** (we are here because of where we started) rather than rational design.

  ### 5. Where is all of this underdetermined?

  Several different philosophical positions would license exactly what you are doing, which is why it feels stable even if it feels wrong.

  *   **Utilitarianism:** If you believe the goal is simply to maximise the "good" (defined as the metric), then your process is perfect. The intention doesn't matter, only the outcome.
  *   **Positivism:** If you believe that only observable, measurable facts are real, then "why" questions are meaningless. Only "what happened" matters.
  *   **Technocracy:** If you believe that complex systems are too complicated for human intuition, then handing control to the model is the only rational choice.

  What would settle between them is a single question: **Is the metric the only thing of value?** If you admit that user trust, long-term brand reputation, or employee understanding are valuable but *unmeasured*, then Pure Utilitarianism fails. If you admit that human intuition can spot risks data cannot, then Positivism fails. Your current practice hedges between these without admitting it.

  ### 6. If a reason has to be someone's reason, what changes?

  If you decide that a reason must be held by a person who can state and defend it, the mechanics break immediately.

  *   **The Graveyard Spreadsheet:** It changes from a log of outcomes to a log of arguments. It requires a mandatory "Hypothesis" field filled *before* the test (not just the metric) and a "Learnings" field filled *after*. If the variant wins but the team cannot explain why, the win is flagged as "risky" rather than "success".
  *   **Rule 1 (Shipping):** Winning the test is no longer sufficient. A variant must win *and* be intelligible. If a model moves the metric but cannot explain why (Rule 5), it cannot ship to core surfaces without a human override accepting the risk.
  *   **Rule 4 (Design Principles):** The committee moves from veto-only to active guidance. They must help formulate the hypotheses, ensuring the "why" aligns with principles before the test begins, rather than just checking for dark patterns afterwards.
  *   **Rule 2 (Legacy):** You initiate a "Legacy Audit". Features that have never been tested are marked as "unverified". They are allowed to stay, but they cannot be used as a baseline control for new tests until they are understood. This stops the untested past from polluting the tested future.
  *   **Rule 5 (Comms):** You stop saying "the community wants this." You start saying "we have optimised for X, believing it serves you." This shifts accountability back to the company.

  ### The Name

  The view that reasons can exist independently of any person's mind or motivations is often called **Impersonalism** about reasons.

  ### Summary

  Your company operates on the belief that the system is smarter than the individuals within it. This works for scaling, but it creates a debt of understanding. Eventually, you will face a situation where the metric moves in the wrong direction, or causes harm outside the model's view, and no one will know how to fix it because no one knows why it worked in the first place. Requiring a human to hold the reason is not pedantry; it is insurance against the moment the machine stops making sense.
