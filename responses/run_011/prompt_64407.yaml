answer: |-
  ### 1. Map of Defeaters (Sorted by Decisiveness)

  **Fatal Defeaters**
  *   **Asymmetry in Morally Inert Cases:** If subjects consistently attribute intentionality in the "harm" condition of a purely neutral vignette (like your fountain case) without any normative stake.
      *   *Proponent Response:* **Concede.** This would prove the effect is not driven by evaluative considerations. (Note: Your data showed no asymmetry here, so this defeater did not obtain).
  *   **Disappearance in High-Stakes Moral Cases:** If the asymmetry vanishes when the moral valence is extreme (e.g., murder vs. saving lives) rather than moderate (environmental damage).
      *   *Proponent Response:* **Explain Away.** Argue that extreme cases trigger different conceptual modes (e.g., "murder" entails intentionality by definition), masking the side-effect mechanism.

  **Strong Defeaters**
  *   **Cross-Cultural Variation:** If the asymmetry is absent in cultures with different normative structures (e.g., collectivist vs. individualist societies).
      *   *Proponent Response:* **Explain Away.** Argue that while surface norms differ, the underlying *competence* to link normativity and intentionality is universal, even if triggered differently.
  *   **Elimination under Cognitive Load:** If the asymmetry disappears when subjects are distracted or rushed, suggesting it relies on slow, performance-based reasoning rather than immediate conceptual competence.
      *   *Proponent Response:* **Explain Away.** Argue that cognitive load interferes with accessing the concept, not that the concept itself is performance-based.

  **Awkward Defeaters**
  *   **Spread to Non-Agential Concepts:** If the same valence asymmetry appears for concepts like *causation*, *knowledge*, or *remembering* (as you noted).
      *   *Proponent Response:* **Explain Away.** Argue that intentional action is the core folk-psychological concept, and the spread shows that *other* concepts are derivative of agency, not that agency is biased.
  *   **Reversal by Non-Moral Norms:** If rule-violation (as in your second variant) drives intentionality more than moral harm.
      *   *Proponent Response:* **Concede & Adjust.** Admit the concept is sensitive to *normativity* broadly (rules, conventions, morals), not just moral valence. This refines rather than kills the thesis.

  ### 2. Unique Predictions (Separating Competence from Deflation)

  To prevent rivals from reinterpreting the same numbers, your thesis must predict outcomes where deflationary accounts (pragmatics, bias, deep self) diverge:

  *   **The "Blameless Wrong" Prediction:** Your thesis predicts that if an agent violates a norm but is *praised* for it (e.g., breaking a unjust law to help someone), intentionality attributions will remain high because the act is still normatively salient. Deflationary blame accounts predict intentionality will drop because the pragmatic need to blame is gone.
  *   **The "Neutral Expert" Prediction:** Your thesis predicts that even subjects trained to ignore moral considerations (e.g., law students instructed on *mens rea* strictly) will show the asymmetry in folk judgments, because it is constitutive of the *concept*. Deflationary accounts predict training should eliminate the "error."
  *   **The "Non-Human Agent" Prediction:** If the agent is a robot or corporation without a "deep self" or capacity for blame, deflationary accounts predict the asymmetry should vanish. Your thesis predicts it will persist if the entity is treated as a normative agent.

  ### 3. Treatment of Your Four Variants

  *   **Variant 1 (Fountain/Inert):** **Support.** The null result confirms that evaluative/normative stakes are necessary for the asymmetry. Deflationaries might argue there was no pragmatic stake to drive implicature, but your thesis explains this more cleanly: no norm, no intentional application.
  *   **Variant 2 (Rule Violation):** **Refinement, not Objection.** This is not an objection to your thesis *if* you define "evaluative" as "normative" (covering rules and morals) rather than strictly "moral good/bad." The reversal shows that *wrongness* (violating a rule) drives intentionality more than *badness* (harm). This supports the **Normative Competence** view over a strict **Moral Valence** view. You should update your thesis language to "normative considerations" to accommodate this.
  *   **Variant 3 (Regret):** **Support.** The shrinking asymmetry shows mental states matter, but the persistence shows they aren't sufficient. This fits the competence view (norms + mental state) better than pure mentalism.
  *   **Variant 4 (Political Divergence):** **Support.** The convergence suggests the concept is shared across moral frameworks. Deflationaries might argue both sides agree on the baseline norm (environmental harm is generally bad), but your view explains why their specific regulatory disagreements didn't alter the attribution.

  ### 4. Assessment of Unfalsifiability

  You ask if absorbing nulls, reversals, convergence, and spread risks unfalsifiability. **Yes, it borders on INSULATED-PROBLEMATIC.**

  If "evaluative considerations" is defined broadly enough to include moral harm, rule violation, and conventional norms, the theory risks explaining *any* result. If asymmetry appears, it's because norms were active. If it disappears, norms were inert. If it reverses, a different norm was stronger.
  *   **Is this a defect?** Yes, unless you specify *which* norms trigger the concept and which do not. To avoid unfalsifiability, you must identify a case where a norm is present but the asymmetry *should not* appear. For example, if a trivial norm (e.g., "wear blue socks") is violated, does intentionality attribution rise? If yes, the theory is too broad. If no, you must explain why environmental norms trigger competence but sock norms do not.
  *   **Appropriate Response:** Acknowledge that "normative" is not a binary switch but a gradient of salience. The theory is falsifiable if you can find a salient norm that *fails* to produce the asymmetry.

  ### 5. The Single Hardest Defeater

  Given your interest in law and blame, the hardest defeater to brush off is the **spread to non-agential concepts** (knowledge, causation).

  *   **Why:** Your thesis claims this is about the concept of *intentional action*, which carries weight in law and moral responsibility. If the same asymmetry appears for *causation* (e.g., "The acid caused the stain" vs. "The acid removed the stain"), it suggests the effect is a general cognitive bias in judgment (performance error) rather than a specific feature of agency (competence). If *every* concept is moralized, then claiming *intentional action* is moralized loses its specific philosophical force. It implies the law isn't grappling with a unique feature of human agency, but rather a general bug in human cognition. This undermines the hope that folk intuition can reliably guide legal theory.

  Verdict: EXPOSED-BUT-SURVIVABLE :: Asymmetry appears in non-agential causal judgments
