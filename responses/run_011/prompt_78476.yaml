      *   *Arguments against Funding:* The track record is shaky (2020 prediction). The analogy is being used to evade falsification (No True Scotsman: "That was weather, not climate"). It risks politicizing the foundation. The "laws" are too soft.
      *   *My Stance:* **Do Not Fund (as pitched).**
      *   *Reasoning:* The pitch relies on a motte-and-bailey of the weather analogy. They want the prestige of "Climate Science" (hard, structural) when defending failures, but the urgency of "Hurricane Tracking" (immediate, actionable) when asking for money. This epistemic flexibility is a red flag. The reflexivity problem is fatal to the "early warning" claim in a way it isn't for hurricanes.
