      *   *Weather:* Specific events (revolutions, wars, elections).
      *   *Climate:* Long-term structural trends (secular cycles, demographic shifts).
      *   *Atmosphere:* The social system (population, economy, state capacity).
      *   *Physics:* Sociological/Demographic laws (Malthusian constraints, elite competition models).
