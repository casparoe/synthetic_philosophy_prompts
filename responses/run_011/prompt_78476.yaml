      *   *Engineering/Structural Stress:* Bridges have load limits. Elite overproduction is like stress on beams.
      *   *Ecology:* Predator/prey, carrying capacity. Fits Malthusian dynamics better.
      *   *Selection:* **Ecology/Population Dynamics.** It captures the feedback loops, carrying capacity, and competition without implying the rigid determinism of physics or the chaotic randomness of weather. It acknowledges the system is alive and adapting.

