prompt: |-
  I'm the case manager for a university research integrity panel — I schedule the hearings, hand out and count the ballots, and draft the published reasons, but I don't sit on the panel and I'm not allowed to advise anyone on the merits. We get about eleven cases a year, each heard in a single day by seven members drawn from a pool of fifteen, so the membership is different almost every time and nobody builds up a feel for how the last panel did it. Our regulations say a finding of serious misconduct needs three things made out: that the data or images in question were altered or fabricated, that this was deliberate or reckless rather than an honest mistake, and that it's material, meaning it substantially supports one of the paper's main claims. All three found → retract and refer to the institution. First found but not the second → correction and an expression of concern instead. First not found → no action. The members are volunteers, mostly bench scientists plus a lawyer who chairs, none of them trained in any of this, and I have to produce a decision with written reasons inside ten working days. Last year one of our decisions got quashed on internal appeal because the reasons we published didn't line up with the votes we'd actually taken, and I've been told to fix the process.

  Here's the part I can't figure out. Our chair likes to put the three questions to a vote one at a time and treat the outcome as settled by that. But sometimes at the end of a long day someone asks "so — misconduct, yes or no?" and we take that vote too, and it doesnt always come out the same. I've read enough about the doctrinal paradox / discursive dilemma to know this is a real thing and not me being dim, but everything I've turned up is about impossibility results and axioms, which is no use to me on a Tuesday with seven tired people and a form to fill in. So: could you write me an actual procedure — the order to put the questions in, when we vote on the premises and when (if ever) we vote on the bottom line, what counts as a decision, what to do about a member who recuses from one question but not the others so the denominators differ, how we stay consistent when the same factual question comes up in two linked cases months apart with a partly different panel, and what to write in the reasons so an appeal body can follow the path we took. It needs to be runnable by people with no logic training — two sides of A4 I can hand to the chair — and it should tell me which bits I can bake into the ballot form and which ones need a human to make a call. Be blunt about where the procedure is really a value judgement wearing a rule's clothes, and where it will produce something that looks absurd. One more thing I keep tripping over: I suspect the way the regs carve the matter into three questions is itself doing a lot of work. "Reckless" could be split into "aware of the risk" and "had no honest belief in the data," and I've watched outcomes move depending on how finely the chair phrases a question — so the procedure should say something about who decides the phrasing and how granular the premises get, including on fuzzy standards like "material," where members often agree on all the facts and disagree only about the threshold. No references or reading list, please; I just need the thing.

  Then run it on three cases (details anonymised, votes are real):

  Case 1. All seven sitting. Altered-or-fabricated: 5–2 yes. Deliberate-or-reckless: 4–3 yes. Material: 6–1 yes. Because the day was dragging, the chair then took a bottom-line vote on "misconduct established?" and it came out 3–4 against — the three yeses were all people who had said yes to all three premises.

  Case 2. Altered: 4–3 yes (Alvarez, Boateng, Chen, Doyle). Reckless: 4–3 yes (Doyle, Eriksen, Fontaine, Ghosh). Material: 5–2 yes (Alvarez, Boateng, Doyle, Eriksen, Ghosh). So exactly one member, Doyle, thinks all three; every premise has a majority but no coalition does.

  Case 3. Two linked cases out of the same lab, heard three months apart, with three of the seven members changing between them. In the first we found alteration 6–1 and retracted. In the second, one member recused from the recklessness question only (she'd collaborated with the respondent years ago, and had no view either way on the images), so that question went to six and passed 4–2 yes; alteration went to all seven and passed 5–2 yes; and because we were out of time the chair took the bottom-line vote first, 4–3 against a finding, and then we voted the three premises afterwards "for the record," which is how we ended up with a published finding of alteration and recklessness attached to a decision to take no action.

  Tell me what your procedure outputs on each of the three, where the output is going to make the panel unhappy — I already suspect Case 2 is a mess whichever way you go — what I should have done differently in Case 3, and which of these questions the procedure simply cannot decide for us and has to hand back to the chair or to the regulations.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and case analysis:

  1.  **Analyze the User and Request:**
      *   **User Role:** Case Manager for a university research integrity panel.
      *   **Task:** Create a robust voting/procedure manual (2 pages A4 max) to prevent inconsistencies between premise votes and conclusion votes (Doctrinal Paradox/Discursive Dilemma).
      *   **Constraints:**
          *   Panel: 7 members (from pool of 15), volunteers, mostly scientists + 1 lawyer chair. No logic training.
          *   Caseload: ~11/year, 1 day each. High turnover, no institutional memory.
          *   Regulations: 3 conditions for "Serious Misconduct" (Alteration/Fabrication, Intent/Recklessness, Materiality).
          *   Outcomes: All 3 = Retract/Refer; 1st only = Correction/Concern; 1st No = No Action.
          *   Deadline: Written reasons within 10 working days.
          *   Problem: Inconsistency between premise votes and conclusion votes (Case 1, 2, 3 examples provided).
          *   Specific Issues: Recusals affecting denominators, granularity of questions (who phrases them?), linked cases with different panels, appeal-proofing reasons.
          *   Tone: Blunt, practical, no academic references, acknowledge where rules mask value judgments.
          *   Output: Procedure (2 pages) + Analysis of 3 specific cases.

  2.  **Deconstruct the Core Problem (The Discursive Dilemma):**
      *   The panel votes on premises ($P_1, P_2, P_3$) and sometimes the conclusion ($C$).
      *   Logic: $C \iff (P_1 \land P_2 \land P_3)$.
      *   Problem: Majority vote on $P_1$, Majority on $P_2$, Majority on $P_3$ $\neq$ Majority on $C$. (Case 2 is the classic example).
      *   Problem: Inconsistency between $C$ vote and $P$ votes. (Case 1 & 3).
      *   Solution Requirement: A "Priority Rule." Either Premise-Based Procedure (PBP) or Conclusion-Based Procedure (CBP).
      *   *Decision:* For research integrity, a **Premise-Based Procedure (PBP)** is legally safer and more defensible on appeal. Why? Because regulations define misconduct *by* the premises. If the premises are met, the conclusion *must* follow logically. Voting on the conclusion separately invites arbitrariness. However, PBP can lead to "unhappy" outcomes where a majority says "No Misconduct" even though all criteria are technically met by majority vote (Case 2). I need to address this tension bluntly.

  3.  **Drafting the Procedure (The "2-Page A4" Constraint):**
      *   *Structure:*
          1.  Core Principle (Premise-Based).
          2.  Question Phrasing (Granularity).
          3.  Voting Order & Mechanics.
          4.  Recusals & Denominators.
          5.  Linked Cases.
          6.  Drafting Reasons.
          7.  The "Safety Valve" (Where the procedure fails).
      *   *Key Decisions:*
          *   **Priority:** Premise votes determine the outcome. The "Misconduct?" vote is banned (or purely advisory/non-binding). This solves Case 1 & 3 inconsistency.
          *   **Phrasing:** Chair drafts, Panel approves *before* evidence hearing. Prevents manipulation mid-deliberation.
          *   **Recusals:** Fixed denominator based on those eligible for *that* question.
          *   **Linked Cases:** Treat as separate legal entities but note consistency in reasons.
          *   **Value Judgments:** Acknowledge that "Materiality" and "Recklessness" are subjective. The vote *is* the definition for that case.

  4.  **Analyzing the Three Cases using the New Procedure:**

      *   **Case 1:**
          *   Votes: P1 (5-2 Y), P2 (4-3 Y), P3 (6-1 Y).
          *   Old Outcome: Conclusion vote (3-4 N) overruled premises.
          *   New Procedure: PBP. All premises passed majority.
          *   Result: Misconduct Established.
          *   *Friction:* 4 members voted against the final outcome despite the rules saying it passed. This highlights the "unhappy" reality of PBP. The procedure must state: *The conclusion vote is prohibited.*

      *   **Case 2 (The Doctrinal Paradox):**
          *   Votes: P1 (4-3 Y), P2 (4-3 Y), P3 (5-2 Y).
          *   Intersection: Only Doyle voted Y on all three.
          *   Old Outcome: Ambiguous/Messy.
          *   New Procedure: PBP. All premises passed majority.
          *   Result: Misconduct Established.
          *   *Friction:* 6 out of 7 members effectively voted "No Misconduct" (by missing at least one premise), yet the finding is "Yes." This is the inherent flaw of PBP in this context. I need to be blunt: This is a feature, not a bug, of regulatory compliance, but it looks undemocratic. The procedure can't fix the logic, only enforce consistency.

      *   **Case 3 (Linked Cases & Recusal):**
          *   Issue: Conclusion vote taken *before* premises. Recusal on one premise changed denominator.
          *   New Procedure: Premises first. No conclusion vote. Recusal handled per question.
          *   Result: P1 (5-2 Y), P2 (4-2 Y - denominator 6), P3 (assume passed). Misconduct Established.
          *   *Correction:* The "No Action" decision was illegal under the regs if premises passed. The procedure must forbid voting on the conclusion before premises.

  5.  **Refining the "Blunt Truths":**
      *   The regulations define misconduct as a logical conjunction. Therefore, the *only* legally defensible method is Premise-Based.
      *   However, this means a finding of misconduct can occur even if a majority of the panel personally believes "No Misconduct" (Case 2).
      *   The "Materiality" threshold is the pressure valve. If the panel hates the PBP outcome, they should vote "No" on Materiality.
      *   Question Phrasing is power. The Chair cannot unilaterally decide granularity.

  6.  **Drafting the Content (Iterative refinement for tone and length):**
      *   *Tone:* Administrative, authoritative, clear, acknowledging limitations.
      *   *Formatting:* Bullet points, bold text for critical rules.
      *   *Sectioning:* Match the user's specific pain points (Recusals, Linked Cases, Reasons).

  7.  **Final Review against Constraints:**
      *   2 pages A4 equivalent? (Keep it tight).
      *   No references? (Check).
      *   Address Case 1, 2, 3 specifically in the analysis section? (Check).
      *   Identify what the procedure *cannot* decide? (Check - specifically the "unfairness" of Case 2).

  8.  **Self-Correction during drafting:**
      *   *Initial thought:* Allow a conclusion vote as a tie-breaker.
      *   *Correction:* No, that recreates the problem. The conclusion vote must be abolished for decision-making purposes. It can exist as a "sense of the meeting" check but cannot override premises. Actually, better to ban it entirely to avoid confusion in the minutes.
      *   *Recusals:* Need to be clear. If someone recuses on P2, they don't count in the denominator for P2, but do for P1 and P3.
      *   *Linked Cases:* Cannot bind future panels legally, but require "distinguishing" in reasons if outcomes differ.

  9.  **Final Polish:** Ensure the distinction between "Procedure" (the handout) and "Analysis" (the advice to the Case Manager) is clear. The user asked for the procedure *then* the run-through.

  *(Self-Correction on Case 2 Analysis)*: I need to be very clear that Case 2 is the "Doctrinal Paradox" and the procedure *forces* a finding of misconduct, which will feel wrong to the panel. I must explain *why* we accept this (regulatory compliance > panel intuition) and where the pressure valve lies (voting strictly on the premises).

  *(Self-Correction on Question Phrasing)*: The user noted the Chair phrases questions. This is a risk. The procedure should require panel approval of questions *before* voting starts.

  Let's assemble the document.cw
answer: |-
  # RESEARCH INTEGRITY PANEL: VOTING AND DELIBERATION PROTOCOL

  **1. CORE PRINCIPLE: PREMISE-BASED DECISION MAKING**
  The Regulations define misconduct as the conjunction of three findings (Alteration, Intent, Materiality). Therefore, the **Premise Votes determine the Outcome.**
  *   **Rule:** A vote on the bottom-line question ("Is misconduct established?") is **prohibited** for decision-making purposes. It creates legal vulnerability and logical inconsistency.
  *   **Logic:** If Premises 1, 2, and 3 all pass by majority, the finding *must* be Misconduct. If any Premise fails, the finding *must* be No Misconduct (or Correction, per Regulations).
  *   **Exception:** The Chair may take a "straw poll" on the bottom line *only* to check for consensus before finalizing premise votes. This poll is not recorded in minutes and cannot override premise votes.

  **2. QUESTION PHRASING AND GRANULARITY**
  How a question is asked determines the vote. This is where bias enters.
  *   **Who Decides:** The Chair drafts the specific wording of the three premise questions. The Panel must approve the wording by simple majority **before** deliberations begin (after evidence, before voting).
  *   **Granularity:** Questions must match the Regulations. Do not split "Reckless" into sub-questions (e.g., "Aware of risk" + "No honest belief"). If the Regulation says "Reckless," vote on "Reckless." Splitting criteria creates veto points not authorized by the Regulations.
  *   **Fuzzy Standards:** For "Materiality," members may agree on facts but disagree on the threshold. The vote *is* the threshold. Do not attempt to define "substantial support" numerically. If 4/7 say it is material, it is material for this case.

  **3. VOTING ORDER AND MECHANICS**
  *   **Order:** Vote strictly in this order:
      1.  Alteration/Fabrication (Fact)
      2.  Deliberate/Reckless (Intent)
      3.  Materiality (Impact)
  *   **Stopping Rule:** If Question 1 fails (majority No), stop. Finding: No Action. Do not vote on Intent or Materiality. (Exception: Vote on Materiality if required for a "Correction" outcome under Regulations).
  *   **Majority:** Simple majority of **eligible voters present**.
  *   **Ties:** A tie counts as a failure of that premise (finding for the Respondent).

  **4. RECUSALS AND DENOMINATORS**
  Members may recuse from specific questions (e.g., conflict on Intent but not Images).
  *   **Dynamic Denominator:** The majority is calculated based on those eligible to vote on *that specific question*.
      *   *Example:* 7 members seated. 1 recuses from Question 2.
      *   Q1 Vote: 7 eligible. Majority = 4.
      *   Q2 Vote: 6 eligible. Majority = 4.
      *   Q3 Vote: 7 eligible. Majority = 4.
  *   **Recording:** Minutes must record the number of eligible voters for each question separately.
  *   **Quorum:** If recusals reduce eligible voters below 5 for any question, the hearing is adjourned/reconstituted.

  **5. LINKED CASES (SAME LAB/TIMEFRAME)**
  Different panels may reach different conclusions on similar facts. This is legally permissible but must be managed.
  *   **No Binding Precedent:** Panel A does not bind Panel B.
  *   **Duty of Consistency:** If Panel B reaches a different conclusion on materially identical facts, the Written Reasons **must** explicitly distinguish the cases (e.g., "Unlike Case X, the data here...").
  *   **Procedure:** If a linked case is pending, check the status. Do not delay Case B for Case A's outcome, but review Case A's published reasons before drafting Case B's.

  **6. DRAFTING WRITTEN REASONS (APPEAL PROOFING)**
  The Reasons must mirror the Voting Record exactly.
  *   **Structure:**
      1.  State the Vote Count for each Premise (e.g., "The Panel found Alteration by 5 votes to 2").
      2.  State the Logical Consequence (e.g., "As all three criteria were met, the Panel is required to find Misconduct").
      3.  Do not reference a "bottom-line vote." If one was taken as a straw poll, ignore it.
  *   **Minority Views:** You may summarize dissenting arguments on specific premises, but do not suggest the outcome was discretionary.
  *   **The "Unhappy" Outcome:** If Premises pass but the Panel feels uneasy (see Case 2 below), the Reasons must still state the finding firmly. Do not use apologetic language.

  **7. LIMITATIONS AND VALUE JUDGMENTS**
  *   **The "Case 2" Problem:** This procedure may produce a finding of Misconduct even if no single majority coalition supports it (i.e., different majorities for each premise). This is a feature of regulatory compliance, not a bug. It ensures the Regulations are applied as written, not as felt.
  *   **The Pressure Valve:** If the Panel believes a Misconduct finding is unjust despite the facts, the correct procedural mechanism is to vote **No** on Materiality or Intent. Do not vote Yes on facts and No on the outcome.
  *   **Chair Authority:** The Chair manages the process, not the logic. The Chair cannot override a majority premise vote with a ruling.

  ***

  # CASE ANALYSIS & OUTPUT

  Here is how the procedure above applies to your three problem cases, followed by the blunt reality of where the rules fail you.

  ### Case 1: The "Dragged Out Day" Inconsistency
  *   **Votes:** Alteration (5-2), Intent (4-3), Material (6-1). Bottom-line (3-4 No).
  *   **Procedure Output:** **Misconduct Established.**
  *   **Why:** The bottom-line vote is prohibited. The three premise votes all passed majority thresholds. Under the Regulations, the logical conjunction is satisfied.
  *   **Panel Unhappiness:** Four members voted against the final outcome. They will feel disenfranchised.
  *   **What to write:** "The Panel found the three regulatory criteria met by majority votes of 5-2, 4-3, and 6-1 respectively. Accordingly, a finding of Serious Misconduct is recorded." Do not mention the 3-4 vote. It is procedurally irrelevant.
  *   **Fix:** You should have stopped the Chair from taking the final vote. If they did, you must exclude it from the Minutes and Written Reasons.

  ### Case 2: The Doctrinal Paradox (The "Mess")
  *   **Votes:** Alteration (4-3 Y), Intent (4-3 Y), Material (5-2 Y). Intersection: Only Doyle voted Yes on all three.
  *   **Procedure Output:** **Misconduct Established.**
  *   **Why:** This is the classic Discursive Dilemma. Six members effectively voted "No Misconduct" (by voting No on at least one premise), but the majorities on the individual premises dictate a "Yes" outcome.
  *   **Panel Unhappiness:** High. This looks undemocratic. It implies the respondent is guilty even though a majority of the panel didn't support the full chain of logic.
  *   **The Blunt Truth:** The procedure *cannot* fix this without violating the Regulations. If you switch to a Conclusion-Based vote (ask "Guilty?" first), you violate the Regulations which require the three specific findings. You are stuck with Premise-Based.
  *   **Mitigation:** In the Reasons, emphasize the strength of the majorities on the individual facts. Do not highlight the lack of overlap. If the panel knows this is coming, they should be instructed: "If you do not believe misconduct occurred, you must vote No on at least one premise."

  ### Case 3: Linked Cases & Recusal Errors
  *   **Votes:** Alteration (5-2 Y), Intent (4-2 Y, 1 recusal), Bottom-line (4-3 No).
  *   **Procedure Output:** **Misconduct Established.** (And the "No Action" decision is void).
  *   **Why:**
      1.  **Order:** Voting on the bottom line *before* premises is forbidden. It biases the premise votes.
      2.  **Recusal:** The denominator handling was correct (6 eligible on Intent), but the outcome was ignored.
      3.  **Result:** Since Alteration and Intent passed their respective majorities, the finding must follow the premises.
  *   **What you should have done:**
      1.  Intervened when the Chair moved to vote on the bottom line first.
      2.  Ensured the "No Action" decision was not minuted as a formal resolution.
      3.  Drafted the Reasons based on the premise votes, not the bottom-line vote.
  *   **Linked Case Issue:** Since Case 1 (same lab) resulted in Retraction, Case 2 should ideally align unless facts differ. If Case 2 results in Misconduct (as the votes suggest) but Case 1 did too, consistency is maintained. If Case 3's "No Action" stands, you have a vulnerability: Same lab, similar facts, different outcomes without distinction in reasons.
  *   **Fix:** You need to recall the Panel or seek a legal opinion to amend the decision, as the published "No Action" contradicts the recorded premise votes under your own Regulations.

  ### WHAT THE PROCEDURE CANNOT DECIDE
  1.  **The "Case 2" Legitimacy:** No procedure makes the Case 2 outcome feel fair. It is a logical necessity of rule-based adjudication vs. holistic judgment. You must train the Chair to explain this to the panel *before* they vote: "We are voting on the criteria, not the verdict. The verdict follows the math."
  2.  **Question Granularity:** The procedure says "Match the Regulations," but a clever Chair can still manipulate "Reckless" by adding explanatory notes that sway voters. The Panel's approval of wording is your only check, but tired panels will rubber-stamp the Chair's draft. **Recommendation:** Provide a standard template of question wording in the pack so the Chair isn't drafting from scratch.
  3.  **The "Correction" Outcome:** Your Regulations say: First found but not second → Correction. But what if Alteration (Yes), Intent (No), Materiality (No)? The Regulations are silent. The procedure assumes a strict cascade. You need a regulatory amendment to clarify the "Mixed Vote" outcomes (e.g., Yes/No/No). Currently, you are improvising this.

  **Summary Advice:**
  Ban the bottom-line vote. It is the source of your appeal risk. Force the panel to live with the logical consequences of their premise votes. If they don't like the outcome, they must change their premise votes, not the final tally. This shifts the burden of responsibility onto their specific findings, which is where it belongs.
