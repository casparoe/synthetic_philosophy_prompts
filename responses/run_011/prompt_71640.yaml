      *   Better: **"The Principle of Asymmetric Enablement."**
      *   *Core Idea:* You are most responsible if you provide the *capacity* for aggression to an actor you know (or should know) intends to use it, especially when you retain the power to withdraw that capacity.
      *   This explains why Germany (2) > France (3). Germany enabled an ultimatum designed to be rejected. France enabled mobilisation designed to deter.
      *   This explains why Britain (6) is culpable but less than Germany. Ambiguity enables miscalculation, but doesn't actively arm the aggressor.
      *   This explains Serbia (5). They enabled the assassins (murder) but didn't enable the *systemic* war (they were the target).

  7.  **Finalizing the Structure:**
      *   **Diagnosis:** Why "Cheapest Exit" failed (it ignores intent and asymmetry).
