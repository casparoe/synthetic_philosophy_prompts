  She should decline because the infinite expected utility of a single round is an ensemble property that fails to materialize along the single temporal trajectory she must inhabit, rendering the standing offer a mechanism that sacrifices certain interim utility for inaccessible tail events.

  The decisive consideration is the breakdown of ergodicity: while the expectation value averages outcomes across parallel possible worlds (the ensemble), a living agent experiences outcomes sequentially across time (the trajectory). In the modified setup, utility is evaluated daily against accumulated wealth, meaning the value of the offer is determined by the time-average growth rate of utility, not the ensemble expectation. For the St. Petersburg distribution, the ensemble expectation is infinite, but the time-average growth rate is finite and typically negative relative to the entry cost because the massive payouts required to justify the expectation occur with such vanishing frequency that the agent spends almost all of her temporal existence in states of depleted wealth. By accepting the standing offer, she commits to a path where her realized utility stream is dominated by the median behavior of the distribution (low payouts) rather than its mean behavior (infinite payouts), leading to a lifetime of lower utility than if she had preserved her initial wealth.

  This argument establishes that rational decision-making in sequential contexts must maximize time-average utility rather than ensemble expected utility, as the latter is a misleading guide for non-ergodic processes where the statistical properties of the collective do not match the properties of the individual timeline. It loses its grip in the one-shot case because a single trial possesses no temporal trajectory over which to average; without a sequence of outcomes, the distinction between time-average and ensemble-average collapses, leaving expectation as the only available metric for evaluating the gamble, thereby restoring the force of the paradox in the isolated instance.
