answer: |-
  **The position as you understand it**

  Your guest retains Boorse's biostatistical theory but indexes disease claims to contextually supplied reference classes rather than natural kinds. Truth values attach only relative to a chosen class, stabilized by institutional defaults. You label this reference-class indexicalism, but she may reject the semantic implication that disease talk is relative; she likely claims the biology underdetermines the class, not that truth is subjective. The oversimplification lies in suggesting values are absent; she argues they enter only via parameter selection, not the concept itself. This distinguishes her from normativists who place values in the definition, though critics argue the parameter choice *is* the value judgment. Her naturalism hinges on this distinction remaining robust.

  **The questions**

  **Question 1**
  Before we discuss cases, what independent criterion settles which reference class is correct aside from the diagnostic verdict you wish to achieve?
  *Pressure Point:* The mis-specification move.
  *Follow-up:* You often reply that objectors mis-specified the class. But if the only evidence for the correct class is that it yields the intuitive disease verdict, aren't you defining the class by the diagnosis rather than the biology? I need to know what biological fact settles the class boundary before we apply the functional test, otherwise the theory protects itself from refutation by adjusting the denominator to fit the numerator. If you cannot specify the class without referencing the disease outcome, the explanation is circular.

  **Question 2**
  Consider sex-banded haemoglobin thresholds and age-banded functional norms, where the default class looks chosen to deliver a verdict rather than found in nature.
  *Pressure Point:* Chosen vs. found reference classes.
  *Follow-up:* Biology shows a continuum of variation across ages and sexes, yet we impose sharp bands that align with treatment thresholds. If the banding is driven by where intervention becomes cost-effective, doesn't that admit the value judgment is constitutive of the class itself? You claim the class is natural, but the boundaries appear drawn by clinical utility rather than biological discontinuity. This suggests the reference class is a tool for managing resources, not a container for natural kinds, which undermines your naturalist claim.

  **Question 3**
  When a guideline committee lowers the blood-pressure cut-point, converting a large share of the previously statistically normal into patients essentially overnight, what does your view say has changed: the disease, the class, or only our bookkeeping?
  *Pressure Point:* Guideline changes and ontological status.
  *Follow-up:* If you say only the bookkeeping changed, you concede disease status is unstable without institutional stabilization. If you say the class changed, you admit institutions define the biology. If you say the disease changed, you imply biology shifted overnight. Which is it, and how does this stability match your claim that disease is a naturalist concept rather than a regulatory tool? This overnight shift suggests the disease status is contingent on human decision, not biological fact, which is exactly what your critics argue.

  **Question 4**
  How does your apparatus treat traits far outside the class on the favourable side, where it appears to treat exceptional health as abnormality?
  *Pressure Point:* Super-normal function as pathology.
  *Follow-up:* Boorse originally struggled with athletes having heart rates statistically abnormal for the class. If you define disease as statistical departure, exceptional health looks like dysfunction. Will you say the reference class shifts to include athletes, or that species design sets a ceiling? If the latter, doesn't that reintroduce a normative notion of design that exceeds mere statistical typicality within a chosen group? You must explain how you distinguish high function from dysfunction without invoking a value judgment about what function is *for*.

  **Question 5**
  When two clinicians who disagree about a borderline patient are genuinely disagreeing on your view, or merely talking past one another, and what is left of diagnosis as a factual practice if the latter?
  *Pressure Point:* Disagreement and factual practice.
  *Follow-up:* If one uses the lab's default class and the other uses a specialist's narrower class, both might be right relative to their parameters. Does this dissolve genuine disagreement into verbal confusion? If diagnosis is to guide action, clinicians need to know if they are fighting over facts or merely negotiating which indexical parameter to adopt for this specific patient context. If it is the latter, diagnosis loses its authority as a truth-claim and becomes a negotiation over which context applies.

  **Question 6**
  Critics charge that you are a normativist in naturalist dress; where exactly does the value judgment enter if not in your protest that there isn't one?
  *Pressure Point:* The normativism charge.
  *Follow-up:* You insist values enter only via context, not concept. But if the context supplies the parameter that determines truth, isn't the valuation embedded in the mechanism itself? Please locate the value explicitly. Is it in the choice of class, the stabilization of defaults, or the decision to treat? If it is nowhere, explain how values influence disease attribution without being part of it. You cannot have it both ways: either the value is in the concept, or it is in the selection, but both determine the outcome.

  **Question 7**
  In psychiatry, consider a statistically typical reaction to an atypical environment, of which the dispute over whether ordinary grief should be diagnosable as depression is the obvious instance.
  *Pressure Point:* Psychiatry and environmental context.
  *Follow-up:* Grief is functionally efficient yet often classified as disorder if prolonged. If the reference class is 'bereaved individuals,' the function is typical. If the class is 'general population,' it is not. Does your view allow the environment to dictate the class? If not, do you risk pathologizing normal responses to loss simply because the reference class was too broad to capture the contextual nuance? This is where your theory risks clashing with clinical intuition about what counts as a harmful dysfunction versus a normal reaction.

  **Question 8**
  Who decides the institutional defaults that stabilize the reference class, and what recourse exists when those defaults conflict with biological reality?
  *Pressure Point:* Institutional stabilization authority.
  *Follow-up:* You mention assay manufacturers and guideline committees stabilize the defaults. But these are political and economic actors, not biological authorities. If their defaults drift from biological typicality to maximize market share or minimize liability, does your theory validate those drifted classes as natural? How do you prevent the naturalist label from legitimizing whatever class the powerful institutions choose to enforce? This gives institutions the power to define nature by choosing the class, which seems to invert the relationship you propose.

  **Question 9**
  If the reference class is always supplied by context, is the claim that you are a naturalist ultimately empty?
  *Pressure Point:* Empty naturalism.
  *Follow-up:* If any class can be supplied to make the statement true, and institutions merely pick the convenient one, the biology does no heavy lifting. Does this not reduce naturalism to a label we paste on whichever parameter selection we prefer? I need to know what biological constraint remains binding on your theory if the reference class is fully indexical to human decision-making contexts. Without a binding constraint, your naturalism is indistinguishable from the normativism you reject.

  **The two questions she will handle best**

  She will handle the exceptional health question best, arguing that super-normal function is not disease because species design sets a ceiling, not a statistical mean. She also has a strong reply to the mis-specification move, insisting biological similarity dictates class membership. You should concede the exceptional health point quickly; it is a Boorseian maneuver that consumes time but yields little dialectical progress. Focus instead on where the class boundaries are drawn, not whether exceeding them is pathological. This preserves airtime for the harder questions about institutional power and guideline changes where her view is most vulnerable to the normativist critique.

  **Do not ask**

  Avoid asking if disease is purely social, which lets her rehearse naturalist credentials. Do not ask whether cancer is real, as she will index it to a universal class. Avoid questioning whether clinicians care about philosophy, inviting a sociological lecture. These allow her to stabilize her view without addressing the indexical vulnerability. They are softballs converting into lectures on biology, distracting from the core issue of how reference classes are selected.

  **The closer**

  What empirical discovery would force you to abandon indexicalism and accept a single natural reference class? If you answer that no biological finding could do this, does that not confirm the critics' claim that your view is metaphysical stipulation rather than scientific hypothesis? Is there any possible world where your theory fails, or is it insulated from falsification by design? Please be specific.
