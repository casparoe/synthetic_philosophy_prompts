answer: |-
  1. **The default**

  The procedure adopts an anti-reductionist default: testimony provides *prima facie* justification for belief. The panel begins from acceptance and requires positive reasons to withhold. A reductionist default (starting from suspension) would require independent verification for every claim. Given the nature of persecution—often private, undocumented, and traumatic—a reductionist starting point systematically excludes truths that are in principle uncorroborable. This was the error in your mother's case: treating the absence of independent evidence as evidence of absence.

  However, the "benefit of the doubt" is not an epistemic state. Epistemically, a proposition is either justified or it is not; there is no third state of "doubtful but accepted." The benefit of the doubt is a normative value judgment regarding risk allocation. It dictates that when epistemic justification is equivocal—when the evidence neither clearly confirms nor clearly defeats the claim—the panel should err on the side of acceptance. This judgment enters the procedure only at the final stage, after epistemic work is complete. It is not a tool to fix broken evidence, but a tie-breaker for residual uncertainty. Choosing this default costs us some security against fraud; choosing the alternative costs us the lives of those who cannot prove what happened in the dark.

  2. **The procedure**

  1.  **Sincerity Check (Internal Consistency)**
      *   *Question:* Is the claimant's account internally coherent regarding the core claim of persecution?
      *   *Sufficient Answer:* Minor inconsistencies on peripheral details (dates, routes) do not defeat sincerity if the core narrative holds.
      *   *Rule on Partial Fabrication:* A falsehood defeats sincerity only if it concerns the core claim or implies a capacity for deception regarding the core claim. A lie about a route advised by a fixer does not defeat testimony about fear.
      *   *Termination:* Can terminate in refusal if core contradictions are irreconcilable. Otherwise, hand off to Step 2.

  2.  **Competence Check (Position to Know)**
      *   *Question:* Was the claimant positioned to know the facts they assert?
      *   *Sufficient Answer:* The claimant describes events they personally experienced or directly witnessed.
      *   *Termination:* Must hand off to Step 3. Testimony without competence is opinion, not evidence.

  3.  **Defeater Check (Implausibility)**
      *   *Question:* Do background beliefs defeat the claim?
      *   *Sufficient Answer:* Implausibility functions as a defeater only if grounded in objective country evidence (reports, news), not panel expectations of how persecution "looks." Stereotypes are invalid defeaters.
      *   *Termination:* Can terminate in refusal if objective evidence makes the claim impossible. Otherwise, hand off to Step 4.

  4.  **Corroboration Check (Independent Evidence)**
      *   *Question:* Is independent support available and required?
      *   *Sufficient Answer:* If evidence is reasonably available (e.g., medical reports, public records), it must be provided. If the claim is in principle uncorroborable (e.g., private domestic violence), this step is exempted.
      *   *Rule on Circularity:* Past panel files are testimonial, not independent. They cannot serve as corroboration. Use only country condition reports.
      *   *Termination:* Can terminate in refusal if available evidence is withheld without explanation. Otherwise, hand off to Step 5.

  5.  **Epistemic Status Assessment**
      *   *Question:* Is the claim justified based on Steps 1–4?
      *   *Sufficient Answer:* A determination of whether the testimony stands undefeated.
      *   *Termination:* **HANDOFF POINT 1.** If justified, proceed to Step 6. If unjustified, proceed to Step 7.

  6.  **The Normative Override (Benefit of the Doubt)**
      *   *Question:* Is the evidence equivocal?
      *   *Sufficient Answer:* If the epistemic status is uncertain but not defeated, apply the benefit of the doubt.
      *   *Termination:* **HANDOFF POINT 2.** This is where epistemology ends. The decision to accept risk is a moral choice, not an evidentiary one. Accept claim.

  7.  **Final Determination**
      *   *Question:* Is the refusal justified?
      *   *Sufficient Answer:* If Steps 1–4 yielded positive defeaters, refusal is epistemically sound.
      *   *Termination:* Refuse claim.

  3. **Three cases**

  **Case 1: The Corroborated Claim (Acceptance)**
  A claimant alleges arrest by state security. Step 1 reveals no internal contradictions. Step 2 confirms direct experience. Step 3 finds no objective defeaters; country reports confirm such arrests occur. Step 4: Claimant provides a medical report matching the injury timeline. The claim is epistemically justified (Step 5). Step 6 is unnecessary. Outcome: Acceptance. The procedure binds the panel to accept; no value judgment is required because the evidence is robust.

  **Case 2: The Implausible Claim (Refusal)**
  A claimant alleges they were targeted by a rebel group for refusing to join. Step 1: Account is sincere. Step 2: Claimant was positioned to know. Step 3: Claimant asserts the rebel group operates in a region where objective country reports confirm they have been inactive for five years. The panel's expectation is not the defeater; the country report is. This is a valid epistemic defeater. Step 4: No corroboration available. Step 5: The claim is unjustified because it contradicts established external evidence. Step 7: Refusal.
  *Note:* This is the unwelcome outcome. The claimant may be telling the truth about their fear, but their account of the *agent* of persecution is factually impossible given external data. The procedure dictates refusal not because the claimant is lying, but because the proposition is likely false. Epistemology ends at Step 5; the refusal is justified by evidence, not risk allocation.

  **Case 3: The Uncorroborable Claim (Acceptance)**
  A claimant alleges repeated domestic sexual violence by a spouse. Step 1: Account is consistent. Step 2: Claimant is the victim. Step 3: No objective defeaters; such violence is known to occur privately. Step 4: No medical report exists; none was sought due to shame. The procedure exempts this from corroboration requirements as it is in principle uncorroborable. Past files regarding similar claims are ignored to avoid circularity. Step 5: Testimony stands undefeated. Step 6: Evidence is equivocal (no independent proof), so the benefit of the doubt applies. **HANDOFF POINT 2.** The panel chooses to risk a false acceptance rather than a false refusal. Outcome: Acceptance.

  4. **What this procedure cannot do**

  This procedure cannot eliminate false negatives. By exempting uncorroborable claims from independent verification, you accept that some fraud will succeed. This is the price of avoiding your mother's fate. Conversely, by allowing objective country reports to function as defeaters, you will refuse some true claims where the claimant's understanding of their persecutor is mistaken (as in Case 2). The procedure cannot fix bad country reports; if the external data is wrong, the epistemic defeater is invalid, but the panel will still refuse.

  Furthermore, the procedure cannot fully sanitize the Implausibility Check. Determining whether a belief is "objective country evidence" or "panel prejudice" requires human judgment. A colleague may mistake a stereotype for a statistical probability. The procedure marks where the judgment enters, but it cannot guarantee the judgment is pure. Finally, it cannot solve the "fixer" problem perfectly. If a fixer coaches a claimant on the core claim, Step 1 may pass, and the panel will be deceived. The procedure minimizes harm from peripheral lies, but it cannot detect sophisticated fabrication of the core narrative. You must accept that a procedural epistemology is a filter, not a truth machine.

  5. **Objections from both camps**

  A global reductionist would argue this procedure is too lenient. They would contend that Step 1 (Sincerity) grants justification without sufficient independent reasons, violating the principle that testimony is no better than observation. They would demand corroboration for all core claims, rejecting the exemption in Step 4. An anti-reductionist would argue the procedure is too mechanistic. They would contend that breaking testimony into "sincerity" and "competence" fragments the speech act, ignoring that understanding a speaker is a holistic perceptual capacity, not a checklist.

  You ought to concede the reductionist objection regarding external evidence. While anti-reductionism protects the vulnerable, relying solely on internal consistency creates an echo chamber where any coherent story is true. The constraint in Step 3 (requiring objective country data for defeaters) and Step 4 (requiring corroboration when available) is necessary to anchor testimony in reality. Without these reductionist checks, the panel's decisions become unmoored from the world they aim to adjudicate. Concede that testimony needs anchors, even if it doesn't need full reduction.
