  ### 2. High Severity: Backward Induction vs. Normal Form Dominance (C7)

  **The Conflict:**
  You claim Backward Induction (BI) is just ISD applied node-by-node, requiring only CKR.
  *   **Math:** In perfect information games, ISD on the strategic form yields the BI **outcome**, but not necessarily the BI **strategy**.
  *   **Reason:** ISD eliminates strategies strictly dominated across the *whole* game. If a node is not reached under the surviving strategies, actions at that node do not affect payoffs. Therefore, no strategy differing only at that unreached node is *strictly* dominated (payoffs are identical).
  *   **Result:** ISD leaves "empty threats" or arbitrary choices at unreached nodes intact. BI eliminates them via sequential rationality.

  **Example:**
  Player 1 chooses $In$ or $Out$. If $Out$, game ends $(2, 2)$. If $In$, Player 1 chooses $Up$ or $Down$ at a second node. Payoffs: $Up \to (1, 1)$, $Down \to (0, 0)$.
  *   **BI:** Player 1 chooses $Up$ at node 2. Knowing this, Player 1 chooses $Out$ at node 1. Solution: $Out$.
  *   **ISD:** Strategy $(Out, Down)$ yields 2. Strategy $(Out, Up)$ yields 2. Neither strictly dominates the other. Both survive ISD.
  *   **Claim C7:** You say ISD recovers the solution. It recovers the outcome ($Out$), but it does not eliminate the irrational plan $(Out, Down)$.
  *   **Epistemics:** Claiming "no epistemic assumptions beyond CKR" is controversial. BI typically requires a belief in rationality *at nodes that are not reached* (counterfactual rationality). CKR on the strategic form does not guarantee this.

  **Cost of Fix:**
  You must qualify C7. ISD yields the BI *outcome* in generic perfect information games, but not the full BI *strategy profile*, and it relies on a stronger epistemic condition than simple CKR on the normal form.

