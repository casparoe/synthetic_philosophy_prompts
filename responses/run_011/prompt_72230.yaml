  ARSENAL:
  *   Williams on integrity: Trading compromises moral identity and undermines personal agency by fragmenting commitment across distinct cases.
  *   Anderson on value: Treats sacred duties as fundamentally negotiable assets in a moral marketplace, corrupting their expressive meaning.
  *   Nozick on constraints: Deontic boundaries cannot be offset by concessions on unrelated issues; constraints are absolute side-constraints.
  *   Line: I will not admit moral convictions function like preferences or tradeable goods. I will challenge the coherence of intertheoretic comparison. I defend the separateness of moral reasons.

  TURN ONE:

  CONCEDE: I grant that neither outcome individually violates a strict prohibition in the way splitting the difference would.

  REPLY: However, the wrong lies in the transaction itself, not merely the outcome. By agreeing to abandon the rite *in exchange* for your restraint, I treat the rite's value as commensurable with the endowment's status. This corrupts the moral quality of my action. I am not abandoning the rite because it is right, but to purchase your compliance. This makes me complicit in a marketplace of duties. The donor's right is categorical, not a bargaining chip. When I trade, I imply that my fidelity to the dead is something I can withhold to secure leverage over you. That instrumentalizes my own integrity. Furthermore, it suggests your restraint on the endowment is a favor you do me, rather than a duty you owe the donor. We both degrade our moral standing by treating obligations as assets.

  COUNTER: If duties are not assets, what authorizes you to treat my refusal to violate a constraint as a concession worthy of reward?
