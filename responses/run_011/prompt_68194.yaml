  1. A municipal budget director orders the termination of a specific clerk to eliminate a salary line, knowing this will ruin the clerk's livelihood. She calculates that removing this exact salary is the only way to meet the state's mandatory balance requirement without cutting services. She signs the dismissal form specifically because this person's pay is the precise amount needed to balance the ledger. Her focus remains entirely on the individual's removal as the mechanism for solvency. She views the clerk's departure not as a regrettable side effect but as the specific transaction required to fix the books.

  2. A municipal budget director orders the dissolution of an entire department to meet a state mandate, knowing this will ruin a clerk's livelihood within that unit. She calculates that dissolving the unit is the only way to meet the mandate without cutting services, and the clerk's loss is an inevitable result of the unit's removal. She signs the dissolution form specifically because the unit is redundant, not because of the clerk's specific pay. Her focus remains on the structural change rather than the individual's fate. She views the clerk's departure as a regrettable consequence of the restructuring rather than the transaction required to fix the books.

  3. In Case A, the agent answers "To balance the ledger" to why she fired the clerk, and admits she would abort the plan if the savings could be found without this specific harm. In Case B, the agent answers "To eliminate redundancy" to why she dissolved the unit, and insists she would proceed even if the clerk could be transferred elsewhere at no cost to the budget.

  4. Anscombe verdicts Case A as intentionally harming the clerk and Case B as merely foreseeing the harm, with the counterfactual attitude toward the harm doing the work. However, her own strictness about knowingly bringing about a causal means to an end threatens to collapse the pair, suggesting the distinction relies on the agent's description rather than the brute fact of the harm's necessity. If she holds that causing what you know is necessary makes it your doing, the split fails, showing instead how fragile the intention/foresight line is under causal pressure.

  5. A sophisticated double-effect theorist argues the description under which the act is chosen matters more than the causal chain, validating the split based on the agent's practical reasoning. Something of Anscombe's complaint survives in the demand that the description not be a sham, ensuring the counterfactuals reflect genuine practical commitments rather than post-hoc rationalizations.
