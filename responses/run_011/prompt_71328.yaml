answer: |-
  Here is a precise principle designed to handle your cases, followed by the necessary adjustments to your intuitions, the application to new cases, and the metaphysical answer.

  ### The Principle: Integrity of Enforcement

  You have the standing to blame another person for a violation of norm *N* if and only if three conditions are met:

  1.  **The Non-Deflection Clause:** Your act of blaming is not primarily motivated by a desire to distract from your own violation of *N* (or a comparable norm).
      *   *Forced by:* **Case 1 & 4.** The neighbor and the cheating friend use blame as a shield. When blame is a shield, it is a weapon, not a moral correction.
  2.  **The Transparency Clause:** If you have violated *N*, you must have either (a) ceased the violation and publicly acknowledged it, or (b) paid a proportional cost for it that demonstrates submission to the norm. You cannot claim authority on *N* while secretly exempting yourself.
      *   *Forced by:* **Case 5 vs. 6.** This is the crux of your tension. In Case 5, the politician submitted to the law (time served) and acknowledged the fault. In Case 6, the politician remains above the law (secret repayment). Campaigning against corruption implies "I am now a guardian of integrity." If you are secretly corrupt, that claim is a lie. You cannot enforce a norm you are actively hiding your violation of.
  3.  **The Shared Agency Clause:** You cannot blame another for a failure in a *shared project* if you are currently contributing to that same failure within that specific relationship, unless you have first rectified your own contribution.
      *   *Forced by:* **Case 7 vs. 8.** In Case 7 (bets vs. restaurants), the vices are distinct and do not directly sabotage the same shared resource. In Case 8 (marital absence), the marriage is a shared project. If we both neglect it, you cannot blame me for the neglect until you re-engage. You are co-authors of the failure; one co-author cannot indict the other for the story they wrote together.

  ***

  ### Resolving Your Tensions

  **The 5 vs. 6 Problem (The Politician)**
  Your gut is right to feel "off" about Case 6. Under the **Transparency Clause**, Case 6 lacks standing.
  *   **Why:** Standing is not just about the *message* (corruption is bad); it is about the *authority* of the messenger. A campaign against corruption is a claim to moral leadership. In Case 5, the leader says, "I failed, I was punished, I learned." In Case 6, the leader says, "I am a crusader," while hiding, "I am a criminal." The deception undermines the authority required to blame.
  *   **Verdict:** Case 6 is **No Standing**. Case 5 is **Standing**.

  **The 7 vs. 8 Problem (The Waste vs. The Marriage)**
  *   **Why:** Case 7 passes the **Shared Agency Clause**. Your restaurant spending does not cause your brother's betting losses. You are separate agents wasting separate resources. Case 8 fails it. Emotional absence in a marriage is a relational dynamic. If she is absent, she is actively sustaining the very environment she blames you for.
  *   **Verdict:** Case 7 is **Standing**. Case 8 is **No Standing** (until she repairs her side).

  ***

  ### Required Verdict Shifts

  To keep the principle clean and consistent, you must change three of your original verdicts:

  1.  **Case 6 (Secret Politician):** You marked this "Also fine??" with a feeling of "off." You must change this to **No Standing**. The lack of public accountability means they haven't actually submitted to the norm they are campaigning for. They are posing as a guardian while remaining a violator.
  2.  **Case 12 (Proxy Blame):** You marked this "Fine." You must change this to **No Standing (for you) / Manipulative.** If *you* lack standing, using a friend to deliver the blame is "laundering," as you noted. It treats the friend as a tool to bypass moral constraints. The *friend* might have standing, but *your act* of orchestrating it is impermissible if your motive is to say what you aren't allowed to say.
  3.  **Case 3 (Cheating Friend Advice):** You marked this "Fine." This is borderline. If it is genuine *advice* ("Don't do it, it hurts"), it passes. If it is *moral condemnation* ("You are a bad person for lying"), it fails the **Non-Deflection Clause**. To keep the principle simple, distinguish **Guidance** (forward-looking, permissible) from **Condemnation** (backward-looking, requires standing). Your verdict stands only if it is Guidance.

  ***

  ### Application to New Cases

  **Case A: The Impossible Fault**
  *Scenario:* A man blames a woman for infidelity, but he is gay and literally cannot commit infidelity against a woman. Or, a person born without hands blames someone for theft.
  *   **Verdict:** **Standing Granted.**
  *   **Reasoning:** The **Transparency Clause** requires you to not *exempt* yourself from the norm. If you are *incapable* of the violation, you are not exempting yourself; you are simply outside the set of potential violators. As long as you uphold the norm yourself (Non-Deflection) and aren't co-authoring the failure (Shared Agency), physical or situational impossibility does not remove standing. You can uphold a norm you cannot physically break.

  **Case B: The Group Pressure**
  *Scenario:* A junior employee is forced by the whole team to pad an expense report. Later, the team blames the junior when the audit comes, saying "You shouldn't have done it."
  *   **Verdict:** **No Standing (for the group).**
  *   **Reasoning:** This violates the **Shared Agency Clause** and **Non-Deflection**. The group co-authored the violation (pressure) and is now using blame to deflect responsibility onto the weakest link. The group cannot blame the individual for a fault the group engineered.

  ***

  ### The Metaphysics of Standing

  You asked: *Is standing a property of the person, of the act of blaming, or of the relationship between the two people?*

  **Answer: It is a property of the Relationship relative to the Norm.**

  *   **Not just the Person:** You are not universally "a blamer" or "not a blamer." You have standing to blame your brother about gambling (Case 7) but perhaps not about emotional absence if you are absent too. It varies by context.
  *   **Not just the Act:** The act of blaming (speaking words) can be performed by anyone. Standing is the *permission* or *authority* to make those words count as moral correction rather than noise.
  *   **The Relationship/Norm:** Standing exists in the space between you and the other person, defined by the specific rule you are invoking.
      *   In **Case 9** (Victim), the relationship is *Victim/Perpetrator*. This relationship grants standing even if the Victim is a sinner elsewhere, because the specific norm violated was *against them*.
      *   In **Case 8** (Ex-Wife), the relationship is *Partners in a Shared Project*. This relationship removes standing if both are failing the project.
      *   In **Case 10** (HR), the relationship is *Agent/Principal*. If the Principal (Company) is corrupt, the Agent (HR) loses the authority to enforce the norm because the authority is derived from the Principal.

  **Summary:** Standing is the **moral authority to enforce a norm**, derived from your own alignment with that norm and your specific relational stake in it. If you are hypocritical, deceptive, or a co-conspirator, you forfeit that authority.
