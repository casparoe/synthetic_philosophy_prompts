          *   *Argument:* The roommate is right that leverage killed them. But *why* did the risk models allow that leverage? Because they treated low-weight probabilities as high-weight certainties.
          *   *Keynesian View:* The 1921 critique applies to LTCM's internal risk management (VaR). They assigned numerical probabilities to events where the "weight of argument" was insufficient to justify a number.
          *   *Liquidity:* This is pure *General Theory*. Liquidity isn't a parameter; it's a social convention that evaporates. LTCM bet on convergence (fundamental) but funded with overnight liquidity (conventional). When the convention broke, the fundamental bet didn't matter.
