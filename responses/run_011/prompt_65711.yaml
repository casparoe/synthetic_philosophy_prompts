      *   *Specific focus:* Ensure the distinction between 1921 (Weight of Argument) and 1936 (Conventions/Liquidity) is clear in the mapping.
      *   *The "Buffett" point:* Make sure to highlight that Buffett's offer died on a deadline. Why? Because *his* convention (due diligence time) clashed with the *market's* convention (panic speed). This is pure Keynesian coordination failure.

  5.  **Final Polish:** Check the flow. Ensure the distinction between "probability unavailable" and "probability misused" is sharp. (It's the latter: they assigned a number where the Weight was too low to support it).

