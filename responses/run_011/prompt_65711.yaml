          *   *Weight of Argument:* For LTCM in Aug '98, $W$ was low (chaos). For the Consortium in Sep '98, $W$ was high (Fed coordination + forced unwind). The probability wasn't intrinsic to the bonds; it was intrinsic to the *market structure*.
          *   *Buffett:* He knew he could hold to maturity (infinite horizon). LTCM couldn't. Keynes explicitly notes that long-term investors are rare because markets punish them short-term.
