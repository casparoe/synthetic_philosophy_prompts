      *   **Point 1: Mapping the Agents:**
          *   *LTCM Partners (Meriwether/Merton/Scholes):* They are the primary target for the 1921 *Treatise* critique. They had high $P$ (models said convergence is near-certain) but low $W$ (historical data didn't include a G7 sovereign default + liquidity freeze). They treated $P$ as complete.
