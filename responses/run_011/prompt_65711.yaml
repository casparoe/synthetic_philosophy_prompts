          *   *Synthesis:* LTCM is the ultimate validation of the Tinbergen critique. Merton/Scholes *were* the econometricians Keynes warned about. They assumed stationarity ("laws" of finance) in a non-stationary social system.
          *   *Refinement:* It confirms Keynes *more* strongly because it happened to the high priests of the opposing theory. If random traders failed, it's noise. If the Nobel laureates failed using the "correct" math, it's a structural critique of the math.
          *   *Nuance:* However, Keynes didn't anticipate *derivatives leverage* specifically. He thought in terms of equity/bonds. But the *logic* of liquidity preference holds.

