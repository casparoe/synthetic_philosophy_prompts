  **Note on Liberties and Accuracy**

  This piece leans heavily into a reductive reading of functionalism to fit the corporate satire. Specifically, it treats the constituent ants as purely mechanical processors, whereas most functionalists (and Hofstadter) would allow that ants might have their own rudimentary consciousness; the claim is merely that the *colony's* consciousness is a separate level of abstraction, not that the ants are qualia-less zombies. The memo also conflates functionalism with eliminativism regarding the "hard problem" (dismissing the entomologist's qualia question as malformed), which is a contested move; many functionalists try to accommodate qualia rather than deny the query's validity. The "zombie" rival colony is also a slight strawman, as functionalists typically argue that identical function *entails* identical mind, so a colony denying personhood while functioning identically would be a paradox, not just an "unfunded swarm." I am moderately confident a specialist would find the satire fair regarding the "multiple realizability" and "fission" problems, which are core to the view. The bit I am least sure about is the signature block; while it aims to capture the authorship ambiguity, it risks looking like a clever gimmick rather than a genuine metaphysical puzzle about self-reference in emergent systems.
