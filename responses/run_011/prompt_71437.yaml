  Here is the decision tree design, the classification of your ten systems, and the requested critique of the instrument's limits.

  ### The Decision Tree: Diagnostic Protocol for Forecast Failure

  **Instruction to Student:** Begin at Question 1. Answer based on operations you can perform on the governing equations or the simulation code. Follow the branch corresponding to your result until you reach a leaf.

  **Q1.** If you announce the forecast to the agents comprising the system, does the statistical error of the outcome increase significantly compared to keeping the forecast secret?
  *   **Yes:** Go to Leaf A.
  *   **No:** Go to Q2.

  **Q2.** To compute the state at time $T$, must the simulation include a model of the computing hardware executing the simulation?
  *   **Yes:** Go to Leaf B.
  *   **No:** Go to Q3.

  **Q3.** Does the governing equation contain an operator that maps a current state to a probability distribution over next states (rather than a unique next state)?
  *   **Yes:** Go to Leaf C.
  *   **No:** Go to Q4.

  **Q4.** Can you compute the system's state at time $T$ using fewer computational steps than the number of physical time-steps $T$ (i.e., is there a mathematical shortcut)?
  *   **No:** Go to Leaf D.
  *   **Yes:** Go to Q5.

  **Q5.** If you reduce the uncertainty in initial data by a factor of 10, does the useful prediction horizon increase by a constant additive amount (e.g., +2 days)?
  *   **No:** Go to Leaf E.
  *   **Yes:** Go to Q6.

  **Q6.** Can the complete state of the system be fully described by a finite list of numbers (e.g., positions and momenta) rather than a field or function?
  *   **No:** Go to Leaf F.
  *   **Yes:** Go to Leaf G.

  ---

  ### The Leaves

  **Leaf A: Feedback Instability**
  *   **Systems:** Stock Index, Algo Trading.
  *   **Awkward Commitment:** The truth of your prediction prevents it from coming true.

  **Leaf B: Self-Reference Limit**
  *   **Systems:** Machine printing own state.
  *   **Awkward Commitment:** The computer cannot contain a complete model of itself.

  **Leaf C: Distributional Dynamics**
