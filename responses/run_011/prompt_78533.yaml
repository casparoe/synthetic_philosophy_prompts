  The brown **rabbit** breaks the fern and runs.
  My finger tracks the moving **part**.
  I note the time, the fleeting **stage**.
  Is this a mere **fusion**?
  Or just a passing **event**?
  He shouts a word for that **kind**.

  The native nods at every **kind**.
  I write it down: the **rabbit**.
  But was it really an **event**?
  Maybe just undetached **part**.
  The sum, the total **fusion**.
  Frozen in this present **stage**.

  Time moves on to next **stage**.
  Does he mean the **kind**?
  Or all rabbits in **fusion**?
  I look again at **rabbit**.
  Ear, tail, every **part**.
  Nothing but a scuttling **event**.

  Another scuttling **event**.
  Same place, same **stage**.
  He points to leg, a **part**.
  Is it the **kind**?
  I ask about the **rabbit**.
  The world is one vast **fusion**.

  My notebook holds the **fusion**.
  Records the **event**.
  Where did the **rabbit** go?
  Lost in the next **stage**.
  Is there a true **kind**?
  Or just a twitching **part**?

  I touch my own hand, a **part**,
  Wondering if I am mere **fusion**
  Of some human **kind**.
  Living through a single **event**,
  Trapped within a present **stage**,
  While you are watching the **rabbit**.

  Even my own tongue splits the **kind** from **part**,
  No fact secures the **stage** inside the **fusion**,
  Just one **event** remains, here, the **rabbit**.

  ***

  **Ontological Key:**
  1.  **Rabbit:** The enduring whole object (common sense).
  2.  **Part:** An undetached rabbit part (mereological).
  3.  **Stage:** A temporal stage of the rabbit (time-slice).
  4.  **Fusion:** The mereological sum of all rabbits (collective).
  5.  **Event:** The process of "rabbiting" (occurrence).
  6.  **Kind:** The universal "rabbithood" (abstract type).

  *Note on Quine:* All six are empirically equivalent hypotheses given the stimulus meaning of "Gavagai." Quine explicitly lists rabbit, undetached part, and temporal stage in *Word and Object*, and mentions fusion and universals (kinds) as further compatible interpretations if analytical hypotheses are adjusted accordingly. The poem treats them as cycling possibilities because the behavioral evidence (pointing, assent) cannot distinguish them.
