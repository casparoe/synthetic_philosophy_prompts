answer: |-
  ### Logical Space: The Fault Lines

  Before we traverse the cases, we must identify the philosophical joints where the bone actually breaks. The slogan 'reasons without reasoners' conceals at least four distinct axes of disagreement. Your position in this space is determined by how you answer the following:

  1.  **Function:** Is the 'reason' doing *explanatory* work (why is this trait here?) or *normative* work (what ought to be done?)?
  2.  **Anchor:** Must a normative reason be anchored to a *subject* (someone for whom it is a reason) or can it attach to a *state of affairs* (goodness simpliciter)?
  3.  **Modality:** If a subject is required, must they *actually* exist, or is *possible* existence sufficient? Must they be *actual* humans, or can hypothetical/ideal agents suffice?
  4.  **Cognition:** Must the subject be capable of *grasping* the reason, or can reasons obtain objectively regardless of awareness?
  5.  **Unit:** Is the subject necessarily an *individual*, or can reasons attach to *collectives*, *offices*, or *roles* that outstrip individual members?

  Most traditional taxonomies sort you by label (e.g., 'Realist', 'Constructivist'). This handout sorts you by commitment. Below is a decision tree based on the cases provided. Answer the nodes sequentially. Do not worry about where the path leads; simply mark the option that matches your intuition.

  ***

  ### The Decision Tree

  **Node 1 (The Cheetah):** Regarding the cheetah's flexible spine (Case 2): Is the 'rationale' here normative (the cheetah *ought* to have it) or purely explanatory (it is *useful* that it has it)?
  *   **A:** Purely explanatory. → *Go to Leaf 1.*
  *   **B:** Normative (or analogous enough to count). → *Go to Node 2.*

  **Node 2 (The Flowers):** Regarding the uninhabited valley of flowers destroyed (Case 1): Was value lost even though no valuer existed or ever would exist?
  *   **A:** No. Value requires a valuer. → *Go to Node 3.*
  *   **B:** Yes. Goodness is mind-independent. → *Go to Leaf 2.*

  **Node 3 (The Deflation Check):** Across these cases, are we using the word 'reason' in a single, stable sense, or does the meaning shift between biology, ethics, and strategy?
  *   **A:** The meaning shifts (equivocation). → *Go to Leaf 3.*
  *   **B:** The sense is stable (univocal). → *Go to Node 4.*

  **Node 4 (The Future):** Regarding the policy affecting people in 1,000 years (Case 4): Do we have reasons now grounded in the interests of people who do not yet exist?
  *   **A:** Yes. Mere possibility suffices. → *Go to Leaf 4.*
  *   **B:** No. A reason requires an existing entity. → *Go to Node 5.*

  **Node 5 (The Ideal Observer):** Regarding the hypothetical ideal observer (Case 7): If no actual agent holds a reason, can a hypothetical agent's approval ground one?
  *   **A:** Yes. Hypothetical rationality suffices. → *Go to Leaf 5.*
  *   **B:** No. We need flesh-and-blood agents. → *Go to Node 6.*

  **Node 6 (The Committee):** Regarding the committee voting for a bad plan (Case 6): Can the group possess a reason that contradicts the reasons of every single member?
  *   **A:** Yes. Group agency is emergent. → *Go to Leaf 6.*
  *   **B:** No. Group reasons reduce to individual reasons. → *Go to Node 7.*

  **Node 7 (The Trust):** Regarding the trustee and the dead settlor (Case 3): Does the reason attach to the *office* of the trustee, even if the current holder has no personal stake?
  *   **A:** Yes. Roles carry normative weight. → *Go to Leaf 7.*
  *   **B:** No. Reasons must belong to the human occupying the role. → *Go to Node 8.*

  **Node 8 (The Chess Position):** Regarding the move neither player notices (Case 5): Is there a reason to make the move even if no player can currently recognise it?
  *   **A:** Yes. Reasons are objective facts. → *Go to Leaf 8.*
  *   **B:** No. A reason must be capable of being grasped. → *Go to Node 9.*

  **Node 9 (Motivation):** If a reason exists for an actual person, must it be capable (in principle) of motivating them?
  *   **A:** Yes. Reasons are internal to the motivational set. → *Go to Leaf 9.*
  *   **B:** No. Reasons can be external to motivation. → *Go to Leaf 8.* (Note: This converges with Objective Actualism).

  **Node 10 (The Reduction):** Can the normative reasons in the ethical cases ultimately be reduced to the explanatory rationales of the biological cases (naturalism)?
  *   **A:** Yes. Normativity is a species of explanation. → *Go to Leaf 1.*
  *   **B:** No. Normativity is *sui generis*. → *Retrace to previous leaf.* (Use this only to check consistency with Node 1).

  ***

  ### The Leaves: Positions and Commitments

  **Leaf 1: Explanatory Naturalist (Dennettian)**
  *   **Path:** 1A or 10A.
  *   **View:** 'Rationales' are free-floating explanatory tools, not normative commands.
  *   **Awkward Commitment:** You must deny that ethics involves genuine 'oughts' distinct from functional 'is's.

  **Leaf 2: Impersonal Value Realist**
  *   **Path:** 2B.
  *   **View:** Value floats free of valuers; reasons track objective goodness.
  *   **Awkward Commitment:** You must explain how a 'reason' can exist without a 'reasoner' to whom it is addressed, avoiding sheer mysticism.

  **Leaf 3: Equivocation Deflationist**
  *   **Path:** 3A.
  *   **View:** The debate is a category error; 'reason' means different things in biology and ethics.
  *   **Awkward Commitment:** You risk dissolving the reading group's topic entirely, rendering the session pointless.

  **Leaf 4: Possibilist (Future People)**
  *   **Path:** 4A.
  *   **View:** Reasons belong to people who merely might exist.
  *   **Awkward Commitment:** You must accept that non-existent entities can ground present obligations, which strains standard metaphysics.

  **Leaf 5: Hypothetical Grounding Theorist**
  *   **Path:** 5A.
  *   **View:** Reasons are grounded in the approvals of idealised agents, not actual ones.
  *   **Awkward Commitment:** You rely on the coherence of 'idealisation' without slipping into Impersonal Realism (Leaf 2).

  **Leaf 6: Collective Reason Holist**
  *   **Path:** 6A.
  *   **View:** Groups can hold reasons irreducible to their members' reasons.
  *   **Awkward Commitment:** You must defend group agency against the charge that only individuals can act or think.

  **Leaf 7: Institutional Normativist**
  *   **Path:** 7A.
  *   **View:** Reasons attach to offices or roles, not necessarily the humans filling them.
  *   **Awkward Commitment:** You must explain how an abstract 'office' can be the bearer of normative weight without a human substrate.

  **Leaf 8: Objective Actualist**
  *   **Path:** 8A or 9B.
  *   **View:** Reasons require actual reasoners, but the reasoners need not recognise the reasons.
  *   **Awkward Commitment:** You must explain how a reason can be 'for' someone who is cognitively closed to it.

  **Leaf 9: Internalist Actualist**
  *   **Path:** 9A.
  *   **View:** Reasons require actual reasoners who could, in principle, be motivated by them.
  *   **Awkward Commitment:** You struggle to criticise agents with deeply flawed motivational sets (e.g., the committed villain).

  ***

  ### Unoccupied Space & Diagnostic Notes

  **The Impersonal-Possibilist Bleed**
  Be warned: **Leaf 2 (Impersonal Value)** and **Leaf 4 (Possibilist)** are notoriously difficult to keep apart. If you believe value exists without actual valuers (Leaf 2), the distinction between 'value in a state of affairs' and 'value for possible people' often collapses. If the flowers matter, do they matter *for* the possible viewers, or *in themselves*? Many who start at Node 4 find themselves smuggled into Leaf 2. If your answers here feel unstable, you are not alone; this is the primary fault line in contemporary metaethics.

  **Unoccupied Combination: The Institutional Solipsist**
  There is likely no one in the room who accepts **Leaf 7 (Institutional)** but rejects **Leaf 6 (Collective)**. It is incoherent to argue that an 'office' can hold a reason while denying that a 'committee' can, as both rely on normative structures exceeding individual psychology. If you find yourself here, check your consistency at Node 6.

  **Unoccupied Combination: The Explanatory Normativist**
  There is rarely anyone who answers **1A (Explanatory)** but insists on robust normative 'oughts' later in the tree. If the cheetah's spine is merely explanatory, it is inconsistent to treat the future people's interests as normative without a bridging principle. This combination is usually unattractive because it grants naturalism in biology but resists it in ethics without justification.

  **Indistinguishable Leaves**
  I must be honest: **Leaf 5 (Hypothetical Grounding)** and **Leaf 8 (Objective Actualist)** often converge in practice. If an ideal observer approves of X, and an actual agent has an objective reason to do X regardless of awareness, the practical output is identical. The only difference is metaphysical plumbing (where the reason *sits*). Do not be surprised if participants argue they are the same view wearing different hats.
