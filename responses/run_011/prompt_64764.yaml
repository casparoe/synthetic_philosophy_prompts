answer: |-
  Here are ten questions designed to move from exposition to critical pressure, tailored for a popular-science-literate audience. Each includes a follow-up anticipating the guest's specific defensive maneuvers.

  **1. The Scope of the Claim**
  **Question:** You defend a "maximal" reading of the Free Energy Principle: that *all* adaptive behaviour is variational free energy minimisation. For our listeners, does this mean that if we find a living thing doing something that doesn't look like prediction error minimisation, we simply haven't looked hard enough, or is it possible in principle for an adaptive system to exist that doesn't follow this principle?
  **Follow-up:** If it's the former—that we just haven't looked hard enough—does that turn the principle into a framework for interpretation rather than a causal explanation of behaviour?

  **2. The Dark Room Problem**
  **Question:** Let's tackle the famous "dark room" objection. Critics say if I just want to minimize surprise, I should sit in a dark, silent room forever. You argue that Expected Free Energy includes an "epistemic term" that makes this aversive because the organism expects to be sampling. But where does that expectation come from?
  **Follow-up:** If the answer is "it's built into the prior," haven't you just relocated the mystery? You've explained exploration by saying the system has a prior that expects exploration. Does that preserve explanatory content, or does it just hide the drive to explore inside the initial conditions?

  **3. The Origin of Priors**
  **Question:** Following up on that: if the specific content of our behaviour—like avoiding dark rooms—is determined by these specific priors, isn't the heavy lifting being done by evolution or development, not by the Free Energy Principle itself?
  **Follow-up:** If evolution selects the priors and FEP just describes how the system executes them, is FEP the *theory* of life, or just the *mathematics* of how a specific theory of life is implemented?

  **4. Drawing the Markov Blanket**
  **Question:** You mention that when the principle seems to fail, it's often because we've "drawn the blanket in the wrong place." For a non-technical audience, a Markov blanket is the boundary separating the system from the world. Is there a non-question-begging procedure for finding the *right* blanket, or is it identified retrospectively based on where the math works?
  **Follow-up:** If it's identified retrospectively, does this license us to treat *any* partition of *any* system as an agent? Could I draw a blanket around a swirling eddy in a river and call it an agent minimizing free energy?

  **5. Precision and Attention**
  **Question:** A key mechanism in your view is "precision-weighting," which essentially tells the system which prediction errors to trust. In standard neuroscience, we talk about arousal, gain control, or attentional modulation. What does the Free Energy description add that those existing concepts don't?
  **Follow-up:** If the answer is "unification," is that a empirical discovery or a philosophical virtue? Are we learning something new about the brain, or just adopting a new vocabulary for things we already knew?

  **6. The Thermodynamic Analogy**
  **Question:** The term "Free Energy" borrows directly from thermodynamics. How much work is that analogy doing? Is there a literal energy cost being minimized, or is it a purely information-theoretic quantity that happens to share a name with physics?
  **Follow-up:** If it's purely information-theoretic, does the terminology risk smuggling in an "energetic" reading that the mathematics doesn't support? Does it make the theory sound more physically grounded than it actually is?

  **7. Evolution vs. Inference**
  **Question:** There is a tension in your view between "active inference" (what the organism does now) and "evolutionary inference" (what the species did over millennia). If an organism behaves maladaptively and dies, did it fail to minimize free energy, or did it minimize free energy successfully relative to a bad model?
  **Follow-up:** If a system can minimize free energy successfully while going extinct, does the principle lose its normative force? How do we distinguish between a system that is *failing* and a system that is *succeeding at the wrong thing*?

  **8. Falsifiability (The Critical Juncture)**
  **Question:** You've suggested that apparent failures usually show we mis-specified the model. I want to press you for a concrete boundary. What *single* experimental result, observed in a living adaptive system, would you accept as a genuine falsification of the Free Energy Principle?
  **Follow-up:** If you observe a behaviour that increases free energy, would you accept that as falsification, or would you argue we simply haven't found the hidden variables or the correct time-scale yet?
  > **⚠️ Evasion Flag:** This is the most dangerous point for the guest. If he answers "It depends on the model specification" or "There is no single result," he concedes the theory is unfalsifiable. If he gives a specific result, he opens himself to empirical refutation. A vague answer here undermines the scientific status of the maximal claim.

  **9. Triviality and Tautology**
  **Question:** A common criticism from philosophers is that if *all* adaptive systems minimize free energy, and we define "adaptive" as "staying within viable states," isn't the principle tautological? It says "systems that stay alive act in ways that keep them alive."
  **Follow-up:** If it is a tautology, is that a bug or a feature? You've called it a methodological virtue, but does a universal truth tell us anything specific about *human* cognition versus bacterial chemotaxis?

  **10. The Philosophical Upshot**
  **Question:** Finally, if your maximal reading is correct, what happens to traditional philosophy of mind? Do beliefs and desires disappear, replaced by priors and policies, or do they find a secure home within this framework?
  **Follow-up:** If they find a home, is it a reductionist one? Are we ultimately just saying that "wanting" is nothing more than "minimizing expected free energy under a specific prior"?

  ***

  ### Host Notes on Flow and Strategy

  *   **Questions 1–3 (Exposition & The Dark Room):** These establish his view. The follow-up on Q2 is crucial; if he admits the drive to explore is just a "prior," press Q3 hard. This sets up the "Evolution does the work" argument.
  *   **Questions 4–6 (Mechanisms & Definitions):** This is where you test the technical coherence. Q4 (Blankets) and Q6 (Thermodynamics) are common points of confusion for audiences; keep his answers grounded.
  *   **Questions 8–9 (The Pressure Cooker):** Q8 is the pivot. If he evades Q8, Q9 (Tautology) becomes the conclusion the audience draws anyway.
      *   **Recovery Difficulty:** If he gives a non-answer on **Q8**, it is very difficult for him to recover credibility on the "scientific" status of the theory in the remaining time. If he claims it is unfalsifiable, Q9 becomes a trap: "So it's a mathematical truth, not a scientific theory?"
  *   **Question 10 (The Landing):** End on the philosophical implications to bring it back to your podcast's core theme. This allows the guest to end on a visionary note even if the technical grilling was tough.
