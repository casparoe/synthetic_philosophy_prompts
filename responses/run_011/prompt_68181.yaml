  | **1. Pareto-Improvement over Disagreement** | The "No Deal" baseline. If the compromise is worse for everyone than walking away, it's not a deal; it's a hostage situation. | Non-Negotiable |
  | **2. Option Expansion (Non-Convexity)** | **Your 10% Rollout Case.** The solution space isn't a line between A and B. We need to allow for creative third options that weren't initially on the table. | Non-Negotiable |
  | **3. Incommensurability Handling** | Trading "Lives Saved" vs. "Revenue." The theory must explain trade without assuming a common metric (like utils) that both sides accept as valid. | Non-Negotiable |
