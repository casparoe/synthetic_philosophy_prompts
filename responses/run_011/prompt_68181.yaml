  ### Addressing Your Specific Cases

  **1. The 10% Rollout (Option Expansion)**
  Yes, this absolutely belongs on the list (Requirement #2). Most bargaining models assume a "fixed pie" or a convex set of options (i.e., the compromise must be somewhere between Ship All and Wait). Your case proves the option space is *endogenous*—we create new options during negotiation.
  *   **Why it matters:** It shifts the compromise from *moral* (accepting less safety) to *epistemic* (gathering data to resolve the safety question). An account that can't model this treats all compromise as moral loss, which is false.

  **2. Trading Without a Common Scale (Incommensurability)**
  This is Requirement #3. If we don't share a value system, we can't calculate "joint utility."
  *   **The Mechanism:** We aren't trading value; we are trading *accommodation*. I accept your speed because you accepted my safety last quarter (logrolling), or because I respect your agency even if I think you're wrong (mutual respect). The "gain" isn't utility; it's social stability or continued cooperation.

  **3. Power vs. Compromise**
  This is Requirement #5. If the outcome is determined by who has the bigger gun (or bigger budget), it's not compromise; it's submission.
  *   **The Test:** Would the agreement hold if power levels were reversed? If not, it's coercion.

  **4. Negative-Sum Deals**
  This is Requirement #7. Sometimes, compromising destroys the integrity of both sides (e.g., two corrupt politicians splitting a bribe).
  *   **The Constraint:** An account must explain why "No Deal" is sometimes the rational, moral optimum. If a theory forces agreement, it's broken.

  **5. Harm vs. Bridge (Principles vs. Preferences)**
  This is Requirement #4 (Non-Corruption). Compromising on a bridge location is prudential; compromising on rights is moral corruption.
  *   **The Distinction:** Preferences are about *what I want*. Principles are about *what is permissible*. You can split the difference on wants. You cannot split the difference on permissions (e.g., "Let's only torture five people instead of ten").

  ### The Killer Constraint & Impossibility Results

  **Which requirement knocks out the most candidate theories?**
  It is **Requirement #3: Incommensurability Handling**.

  Most "candidate theories" of compromise are actually imported from economics or game theory (Nash Bargaining, Utilitarian Aggregation). These models mathematically *require* a common currency (utility) to calculate the "gain" in "gains from trade." If you cannot translate "safety" and "speed" into a shared metric without one side conceding their worldview is wrong, the math breaks. Demanding that a theory work *without* a common metric eliminates almost all standard bargaining models and simple utilitarian accounts.

  **Is there an Impossibility Result?**
  Yes, there is a trilemma. You generally cannot satisfy these three simultaneously:
  1.  **Gains from Trade** (We must reach an agreement better than no deal).
  2.  **Incommensurability** (We do not share a common value metric).
  3.  **Non-Corruption** (We do not violate core principles to agree).

  If values are truly incommensurable and principles are absolute, **Gains from Trade become impossible.** You either have to admit a common metric (drop #2), allow principle-violation (drop #3), or accept deadlock (drop #1). Any theory claiming to solve all three is likely smuggling in hidden assumptions.

  ### Evaluation of Standard Accounts

  *   **Pure Bargaining (Game Theory):** Fails **Incommensurability** and **Non-Corruption**. It treats rights as preferences and assumes a common utility function. It explains *how* we deal, but not *why* it's moral.
  *   **Split-the-Difference (Median Voting):** Fails **Option Expansion** (Your 10% case) and **Non-Corruption**. Midpoints on moral principles (e.g., "half a right to vote") are often incoherent or unjust.
  *   **Integrity/Constraints (Deontology):** Fails **Gains from Trade**. If constraints are absolute, compromise is often ruled out as complicity. It explains why we *shouldn't* compromise, but not how we *can*.

  ### Uncertainties & Priors

  I am flagging two areas where my "spec" reflects my own philosophical priors rather than consensus:
  1.  **Procedural Fairness (#5):** Some realists argue that power *is* the mechanism of compromise. If you can't enforce it, it's not a deal. I reject this, but a Machiavellian would say my requirement is naive. I would drop this if you convinced me that "legitimacy" is just "stability."
  2.  **Epistemic vs. Moral (The 10% Case):** I am assuming your 10% rollout is a *moral* compromise. A strict deontologist might argue it's just an experiment, not a compromise on values. If the safety team believes 10% risk is *murder*, the rollout isn't a solution; it's a crime. I'm assuming a consequentialist lean where risk is manageable.

  **Verdict:** The Incommensurability Requirement.
