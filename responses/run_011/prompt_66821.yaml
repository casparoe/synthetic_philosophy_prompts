answer: |-
  **TO:** Zoning Board of Appeals Members
  **FROM:** [Your Name]
  **DATE:** [Current Date]
  **RE:** Pre-Hearing Memorandum – Case #2024-14 (Corner Lot Conversion)

  Colleagues,

  I'm circulating this before the 14th so we can spend our hearing time listening to the public instead of debating each other. We have a split board, a vague code standard, and a high-stakes precedent worry. I want to propose a path that respects the code, limits our legal liability, and addresses the neighbors' concerns without violating the applicant's rights.

  **The Bottom Line**
  I recommend we **approve the Conditional Use Permit (CUP) and the parking variance**, subject to specific design conditions (screening and lighting), but **without** caps on unit count or mandated parking stalls.

  **The "Compatible" Standard and Precedent**
  Our code requires us to find the use "compatible" and not altering the "essential character." These terms are subjective. If five of us decide "character" means "no apartments," we invite a lawsuit claiming our decision was arbitrary and capricious. To make this standard falsifiable, we must anchor it to the Comprehensive Plan and recent ordinances.

  The Plan explicitly calls for this density. Council recently allowed 2- and 4-unit conversions by right. If we deny this CUP because "ten units changes the character," we are contradicting the City's own definition of character.

  To the colleagues worried about precedent: You are right that approval sets a precedent. But the precedent should be that we follow the Comprehensive Plan. Denying this application doesn't stop future applications; it just forces us to deny every corner lot in the historic buffer, even when they meet code. That creates a zone of inconsistency that courts hate. If we approve based on code compliance, the precedent is stability. If we deny based on neighborhood pressure, the precedent is that petition signatures override the Comprehensive Plan.

  **Conditions: Why Not Caps or Parking?**
  I understand the desire to cap units at eight or require three stalls. However:
  1.  **Unit Cap:** There is no code basis to cap units at eight if ten are otherwise permissible. Arbitrary caps are legally vulnerable.
  2.  **Parking:** The variance is requested because providing stalls requires removing protected street trees. Our code protects those trees. We cannot condition approval on violating one section of the code (trees) to satisfy another (parking).

  Instead, let's use conditions that address actual physical impacts. We can require opaque fencing or heavy landscaping along the property line to address the visibility concern, and limit exterior lighting to shield the neighbors' porches. This mitigates the "sunlight and view" objection without rewriting the density rules.

  **The "Not in the Room" Problem**
  I share the concern that future tenants aren't here to advocate for themselves. That is a real democratic deficit. However, the ZBA is a quasi-judicial body. We apply the law as written. We do not have the authority to fix representation issues, notice rules, or housing policy. Those are legislative functions belonging to the City Council. If the neighborhood voice outweighs the absent future resident in our decisions, it is because the Council hasn't changed the weighting in the code. We cannot fix that imbalance today without breaking the law.

  Regarding the applicant's attorney invoking "the right to the city": That is a legal theory, not a zoning standard. We should acknowledge it but base our findings strictly on the municipal code.

  **Draft Findings for the Record**
  To keep us within the 60-day statutory deadline, I propose we adopt findings similar to this:

  1.  *Compatibility:* The proposed density is consistent with the Comprehensive Plan's goal of increasing housing supply in established neighborhoods. The "essential character" of the neighborhood is evolving toward multi-unit usage, as evidenced by Council's recent ordinance allowing conversions by right.
  2.  *Parking Variance:* The strict application of the parking minimum conflicts with the City's Urban Forestry standards. Granting the variance preserves mature street trees, providing a public benefit that outweighs the need for additional off-street stalls.
  3.  *Mitigation:* Conditions requiring six-foot screening along the north property line and shielded lighting only will prevent material alteration of the adjacent owners' enjoyment of their property.

  **Next Steps**
  We have 60 days to issue findings or the application is deemed approved. I'd like to vote at the hearing on the 14th and finalize these findings within two weeks.

  I know this is a tough case. The neighbors are passionate, and the stakes feel high. But our job is to apply the City's rules, not our personal preferences. I hope this framework helps us reach a decision that holds up if appealed.

  Thanks,
  [Your Name]
