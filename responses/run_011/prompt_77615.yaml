answer: |-
  The pattern you are circling is the central puzzle of European legal theory, often labeled **Constitutional Pluralism**, though functionally it operates as a system of **Dual-Foundational Constitutionalism**. You have correctly identified the friction between the formal international law structure (treaties, unanimity, state ratification) and the operational constitutional reality (supremacy, direct effect, judicial expansion). The system survives not because one side has won, but because the contradiction is managed through a shared fiction of **interpretive mutability** and **mutual containment**.

  ### 1. Reconstructed Theory of Authority and Change

  The package presupposes a theory of **Constitutional Pluralism** grounded in **Divided Constituent Power**.

  **Authorship:** The theory assumes a dual authorship. Formally, the **Member States** are the *Masters of the Treaties* (the constituent power), evidenced by the amendment and exit clauses. Normatively, the **Peoples of Europe** (plural) are the subjects and beneficiaries, evidenced by direct effect and rights protection. There is no single European *demos* acting as a unitary constituent power; instead, authority is derived from the states but exercised over individuals directly.

  **Meaning and Truth:** The theory assumes there is **no determinate fact** about what the Treaties mean independent of the Court's say-so. While the ECJ rhetorically claims to discover pre-existing meaning (declaratory), the operational theory is **Institutional Positivism**: the meaning of EU law is whatever the ECJ says it is, provided national courts accept it. The "truth" of the law is established by institutional authority, not textual fidelity.

  **Declaration vs. Change:** The theory presupposes that declaring meaning and changing law **can come apart rhetorically but not functionally**. Through **teleological interpretation** (reading powers purposively to achieve "ever closer union"), the Court effects constitutional change while maintaining the fiction of declaration. This is **interpretive mutation**: the text remains static while the normative content evolves. The theory relies on the distinction between *formal amendment* (changing text) and *material constitutionalization* (changing effect), treating the latter as within the judicial mandate.

  ### 2. Strict Needs vs. Comfortable Fits

  **Strictly Required:**
  *   **Mutual Recognition of Validity:** National courts must accept EU supremacy for the order to function; the ECJ must accept national constitutional identity for the order to remain legitimate.
  *   **Interpretive Flexibility:** The Court must be able to expand competences without formal amendment, or the system freezes.
  *   **Exit Option:** The voluntary nature of membership must remain theoretically open to preserve the "conferral" fiction.

  **Underdetermined Spots (Rival Theories Fitting Same Behavior):**
  *   **Federalism in Denial:** The behavior fits a federal state where the central court is simply overpowering subordinate units, except the units retain the theoretical power to revolt (NCC review).
  *   **International Organization with Teeth:** The behavior fits a strong international regime where states voluntarily limit sovereignty, except the limitations are enforced by individuals against states.
  *   **Sui Generis Legal Order:** The behavior fits the claim that the EU is entirely unique, exempt from standard categories of international or constitutional law.

  You cannot distinguish these from the outside because the **Ultimate Rule of Recognition** is fragmented. A Hartian observer cannot locate a single rule that validates all norms; a Kelsenian cannot locate a single *Grundnorm*. The practice remains identical whether the EU is a nascent federation or a mature international regime, because the conflict is never adjudicated at the apex—it is avoided.

  ### 3. Analyzing the Contradictions

  **Declaratory vs. Temporal Limitation:**
  This is a **genuine logical contradiction** resolvable only at a **pragmatic cost**. If a ruling merely declares what the law always was, it must apply retroactively. Limiting temporal effects admits that the ruling changes the legal landscape, disrupting settled expectations. The reconciliation is **Legal Certainty**: the Court prioritizes stability over logical consistency. The cost is the admission that the Court is legislating, undermining the "declaratory" fiction.

  **Conferral vs. Judicial Shift:**
  This is **resolvable at a cost** via **Teleological Interpretation**. The Court argues that competences are not static lists but dynamic tools to achieve Treaty objectives. The boundary shifts not because the Court amends the Treaty, but because the *scope* of the objective expands. The cost is that **Conferral becomes a political limit, not a justiciable one**. Unless a National Constitutional Court intervenes (which they rarely do), there is no effective legal brake on competence creep.

  ### 4. The Single Demos Hypothetical

  If we swapped to a **Self-Amending Constitutional Order authored by a single European Demos**:

  *   **Amendment:** Unanimity would be replaced by qualified majority or supermajority voting within a European legislature. The "Masters of the Treaties" would become "Subunits of the Constitution."
  *   **Exit:** Article 50 would become a secession clause, likely subject to federal prohibition or heavy penalty, rather than a unilateral right.
  *   **National Constitutional Courts:** Their *Ultra Vires* and *Identity Review* would become unintelligible. They would be subordinate courts; claiming a right to reject federal law would be constitutional rebellion.
  *   **ECJ Fiction:** The "declaratory" fiction would vanish. The ECJ would openly acknowledge its role as a Constitutional Court with the power to shape fundamental law, not just interpret treaties.
  *   **Conferral:** The principle of conferral would be replaced by enumerated powers with a general welfare clause or residual power resting with the Union.

  The current practice relies on the ambiguity of the *demos*. Remove that ambiguity, and the delicate balance of pluralism collapses into hierarchy.

