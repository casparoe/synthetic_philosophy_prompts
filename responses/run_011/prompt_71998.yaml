prompt: |-
  I'm teaching one 80-minute session in a law school elective on probability and proof — mostly 2Ls and 3Ls who've done two weeks of likelihood ratios, plus three JD/econ PhDs who'll swallow the room if I let them. Slides are banned in this course, so it's me and a whiteboard. Topic is the common prior assumption and Aumann's result that Bayesians sharing a common prior can't agree to disagree once their posteriors become common knowledge. I want them leaving able to say something intelligent about what two dueling expert witnesses still disagreeing actually proves, and right now they're going to walk in assuming it proves one of them is lying or bought.

  Don't explain the theorem to me, plan how I should teach it. What order the pieces go in and what depends on what — my guess is that "your posterior is just a function of your prior plus your own private information" has to be nailed down before anything else, but tell me if that's the wrong first move. Build the session on one example with two experts in a case that looks like a real one (no hats, no envelopes, no muddy children) and it has to do double duty: first showing that identical priors plus different private evidence legitimately produce different numbers, then getting turned around so those same two people, once they've said their numbers out loud across a deposition table, are squeezed into agreement. Say what that example has to have and what it must not have.

  Then map the misconceptions and pin down the exact point in the sequence where each one gets headed off. My guesses: common prior = they'd have agreed before the trial started, common knowledge = both of them know it, and "different priors" as an all-purpose get-out card. Two of the econ students will have read somewhere that the assumption isn't even testable, since it only constrains beliefs about evidence nobody actually has — where does that objection get raised, and do I concede it? Also tell me whether there's room for the version where they announce and re-announce and the numbers iterate together, or whether I cut that and just do the static result. And the no-speculative-trade cousin of all this: ten minutes, or one sentence and move on?

  Last, give me something I can run in the final five minutes that shows whether the idea landed rather than whether they liked me, and tell me what I should refuse to cover at this level and say out loud that I'm skipping it. No reading list, they won't read it and I won't check.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Audience:** Law students (2L/3L) with 2 weeks of likelihood ratios + 3 JD/Econ PhDs (potential disruptors/domineering voices).
      *   **Constraints:** 80 minutes, no slides (whiteboard only), one specific topic (Common Prior Assumption & Aumann's Agreement Theorem).
      *   **Goal:** Students leave understanding what dueling expert disagreement *actually* implies (not just "one is lying").
      *   **Pedagogy:** Single running example (realistic legal context, no puzzles), specific sequencing, misconception management, handling the Econ PhDs, assessment in final 5 mins, explicit exclusions.
      *   **Tone:** Pragmatic, authoritative, structured, aware of the power dynamics in the room.

  2.  **Deconstruct the Content:**
      *   *Core Concept:* Aumann's Agreement Theorem (Bayesians with common priors + common knowledge of posteriors $\rightarrow$ identical posteriors).
      *   *Legal Application:* Expert witnesses disagreeing.
      *   *Prerequisites:* Likelihood ratios (already covered in previous weeks).
      *   *Key Distinction:* Private Information vs. Common Knowledge.
      *   *Key Distinction:* Prior vs. Posterior.

  3.  **Develop the Running Example:**
      *   *Requirement:* Realistic legal case, no "hat/envelope" puzzles. Needs to show divergence *then* convergence.
      *   *Idea:* A medical malpractice or toxic tort case? Causation is usually the battleground. Let's go with a toxic tort (chemical exposure causes cancer).
      *   *Experts:* Plaintiff's Expert (Dr. Green) vs. Defense Expert (Dr. White).
      *   *The Question:* Did Chemical X cause Patient Y's cancer? (Probability $P(Cause|Evidence)$).
      *   *Phase 1 (Divergence):* They have the same baseline data (prior) but different private test results (likelihoods).
      *   *Phase 2 (Convergence):* They share their test results (making evidence common knowledge).
      *   *Constraint Check:* Aumann's theorem requires *common knowledge of posteriors*, not necessarily sharing raw data, but sharing raw data is the legal mechanism to get there. Actually, Aumann's theorem says if they *know* each other's posteriors, they must agree. In law, they usually share *reports* (evidence). I need to be careful not to conflate "sharing evidence" with "knowing posteriors."
      *   *Refinement:* Let's stick closer to the theorem. They issue reports (posteriors). If they read each other's reports and still disagree, something is wrong (priors differ or irrationality). If they *discuss* and update, they converge.
      *   *Better Legal Fit:* Deposition. Expert A says 80% likely. Expert B says 20% likely. They hear each other's numbers. Do they change?
      *   *The "Hook":* Why do they *not* converge in real life? (Because priors aren't common, or they aren't honest Bayesians).
      *   *Example Specifics:*
          *   Event $H$: Defendant was negligent.
          *   Prior: 50/50 (based on general industry stats).
          *   Private Info: Expert A saw a maintenance log. Expert B saw a witness statement.
          *   Posteriors: A says 70%, B says 30%.
          *   The Twist: If they *only* know the numbers 70% and 30%, and they trust each other as rational Bayesians with the same prior, they *must* average out/merge.
          *   *Wait, Aumann is strong:* It says they *cannot* disagree if posteriors are common knowledge.
          *   *Legal Reality:* They *do* disagree.
          *   *Lesson:* Therefore, either (1) Priors aren't common, (2) They aren't rational Bayesians (bias), or (3) Posteriors aren't truly common knowledge (they don't trust the other's calculation).
      *   *Decision:* Use a "Faulty Brake" case.
          *   $H$: Brakes were defective at time of accident.
          *   Prior: Based on recall data (Common).
          *   Private Signal: Expert 1 tested the pad thickness. Expert 2 tested the fluid viscosity.
          *   This allows Likelihood Ratios (LR) to be used (which they know).

  4.  **Sequence & Timing (80 Minutes):**
      *   0-10: Setup & The "Lying" Myth.
      *   10-30: The Divergence (Private Info + Common Prior).
      *   30-50: The Convergence (Aumann's Logic).
      *   50-65: The "Real World" Break (Why it fails in court).
      *   65-75: Econ PhD Trap & Speculative Trade.
      *   75-80: Assessment.

  5.  **Addressing the Econ PhDs:**
      *   They will pounce on "Common Prior" being unrealistic/untestable.
      *   *Strategy:* Don't fight them. Validate them. Use them. "You're right, it's a normative benchmark, not a descriptive fact." Put them in charge of the "Why this fails" section.
      *   *Iterative Announcement:* Cut it. It's too technical for 80 mins and distracts from the legal point. Stick to the static "If they know, they agree."
      *   *No-Trade Theorem:* One sentence. "This is why insider trading laws exist," then move on.

  6.  **Misconception Mapping:**
      *   *Misconception:* Disagreement = Lies. *Fix:* Show math of private info divergence first.
      *   *Misconception:* Common Prior = Same Opinion at start. *Fix:* Distinguish Prior (before evidence) vs. Posterior (after evidence).
      *   *Misconception:* Common Knowledge = Both know. *Fix:* Emphasize "I know that you know that I know."
      *   *Misconception:* Different Priors is a "Get Out of Jail Free" card. *Fix:* Acknowledge it's the *only* valid reason for disagreement, which shifts the burden to proving why priors differ.

  7.  **The Assessment (Final 5 Mins):**
      *   Need a "write down" moment.
      *   Scenario: Two experts disagree. Judge asks why. Student must identify the *source* of disagreement using the vocabulary (Prior vs. Info vs. Rationality).

  8.  **Exclusions:**
      *   Proof of the theorem (too mathy).
      *   Iterative updating dynamics (too complex).
      *   Harsanyi's doctrine deep dive.
      *   Reading list (per prompt).

  9.  **Drafting the Plan (Iterative refinement):**
      *   *Whiteboard Strategy:* Need two columns. "Expert A" and "Expert B".
      *   *The Example:* Needs to be simple enough for arithmetic but complex enough for law. Let's use a "Drug Side Effect" case.
      *   *H:* Drug caused injury.
      *   *Prior:* 0.5 (Equipoise).
      *   *Signal A:* Genetic marker (LR = 3). Posterior = 0.75.
      *   *Signal B:* Dosage log (LR = 1/3). Posterior = 0.25.
      *   *Aumann Moment:* If A knows B says 0.25, and B knows A says 0.75, and they trust the math... they must converge.
      *   *Wait, Aumann requires Common Knowledge of Posteriors.* In court, they exchange reports. So they *do* know the posteriors. So why don't they agree? Because they don't accept the *other's* likelihood function or prior.
      *   *Crucial Pivot:* The lesson isn't that they *will* agree. It's that disagreement *accuses* someone of irrationality or different priors. It shifts the burden of proof.

  10. **Refining the Econ PhD Handling:**
      *   They will say "Common Prior is untestable."
      *   My response: "Exactly. That means in court, the fight isn't about the conclusion, it's about the starting assumption."
      *   Give them a specific role: "When I get to the 'Real World' section, I want you to tell me why this model breaks."

  11. **Final Review against Constraints:**
      *   No slides? Yes, whiteboard plan included.
      *   One example? Yes (Drug Causation).
      *   Misconceptions mapped? Yes.
      *   Assessment included? Yes.
      *   Exclusions stated? Yes.

  12. **Writing the Output:** (Focusing on tone: direct, instructional, respecting the user's expertise). *Self-Correction during drafting:* Make sure I don't accidentally explain the theorem proof. Keep it to teaching strategy. Ensure the "Common Knowledge" definition is legally relevant (deposition vs. report).

  *(Self-Correction on the Example)*: A "Drug Causation" case is good. Let's make sure the math is doable on a whiteboard without getting bogged down. Odds form is easier for LRs.
  Prior Odds 1:1.
  Expert A LR = 4:1 $\rightarrow$ Posterior Odds 4:1 (Prob = 0.8).
  Expert B LR = 1:4 $\rightarrow$ Posterior Odds 1:4 (Prob = 0.2).
  This is clear.

  *(Self-Correction on Aumann)*: Aumann says if they *know* each other's posteriors, they agree. In law, they exchange reports. So they know the numbers. Why don't they agree? Because they don't believe the other person is a "truthful Bayesian updater." They think the other person is biased (hired gun). This is the golden nugget for law students. Disagreement proves *bias* or *divergent worldviews*, not necessarily math errors.

  Let's build the plan around that insight.

  *(Final Polish)*: Ensure the "No Speculative Trade" is handled as requested (1 sentence or 10 mins? Prompt asks "ten minutes, or one sentence and move on?" I should recommend one sentence to save time for the core legal implication).

  Okay, ready to write.cw
answer: |-
  Here is the battle plan for your 80 minutes.

  ### The Core Strategy
  You are not teaching them to prove Aumann's Theorem. You are teaching them to **weaponize** it.
  The learning objective is: *When two experts disagree after exchanging reports, at least one is violating the norms of rational updating (bias) or they are operating from fundamentally different worldviews (priors). Disagreement is evidence of bias or divergent priors, not just "different evidence."*

  **The Whiteboard Layout:**
  Divide the board into three vertical panels.
  1.  **Left:** The Setup (Priors & Private Info).
  2.  **Center:** The Aumann Squeeze (Common Knowledge).
  3.  **Right:** The Legal Reality (Why it breaks).

  ---

  ### Part 1: The Running Example (0–30 mins)
  **Case:** *Toxic Tort / Pharmaceutical Causation.*
  **Question:** Did Drug X cause Plaintiff's liver failure? ($H$)
  **Experts:** Dr. Green (Plaintiff) vs. Dr. White (Defense).

  **Why this example:**
  *   **Must Have:** A binary hypothesis (Cause / No Cause), a clear baseline statistic (industry data), and distinct technical tests (biomarker vs. dosage log).
  *   **Must Not Have:** Ambiguous evidence. The signals must be quantifiable so you can put numbers on the board. No "it depends on the jury."

  **Sequence:**
  1.  **The Prior (5 mins):** Establish that before looking at specific patient files, both experts agree on the base rate of liver failure in the general population taking Drug X.
      *   *Write:* $P(H) = 0.5$ for both.
      *   *Say:* "This is the Common Prior Assumption. They agree on the world before they touch the evidence."
  2.  **Private Information (15 mins):**
      *   Dr. Green sees a genetic biomarker (Likelihood Ratio = 4).
      *   Dr. White sees a dosage log showing under-use (Likelihood Ratio = 0.25).
      *   *Task:* Have the class calculate the posteriors using the Odds form (since they've done 2 weeks of LRs).
      *   *Result:* Green = 80% probability. White = 20% probability.
      *   *Point:* Disagreement is legitimate *here* because information is private.
  3.  **The Deposition (10 mins):**
      *   Now they sit across a table. They exchange reports.
      *   Green knows White says 20%. White knows Green says 80%.
      *   *Ask:* "If Green trusts White as a rational Bayesian with the same prior, what must Green do?"
      *   *Answer:* Green must realize White saw evidence Green didn't. Green must update *again*.
      *   *Theorem:* If they truly know each other's numbers and trust the rationality/priors, the numbers *must* collapse to a single point. They cannot sit at 80% and 20% simultaneously.

  ---

  ### Part 2: Misconception Mapping & Intervention Points
  You need to head these off before the Econ PhDs use them to derail the room.

  | Misconception | When it arises | How to kill it |
  | :--- | :--- | :--- |
  | **"Disagreement means one is lying."** | **Start of class.** | Explicitly state: "Today we prove disagreement can be honest." Use the Private Info phase (Part 1, step 2) to show honest divergence. |
  | **"Common Prior = Same Opinion."** | **When defining the Prior.** | Distinguish *Prior* (before evidence) from *Posterior* (after evidence). Write "Time 0" vs "Time 1" on the board. |
  | **"Common Knowledge = We both know it."** | **When introducing Aumann.** | This is the trap. Write on board: "I know X" $\neq$ "I know that you know that I know X." In law, this means *sworn disclosure*. A report email isn't enough; it must be admitted/acknowledged. |
  | **"Different Priors is a Get-Out-Of-Jail-Free card."** | **During the 'Real World' break.** | Concede it's valid, but reframe it: "If you claim different priors, you are admitting you view the fundamental nature of reality differently than the other expert. That is a credibility attack, not a math defense." |
  | **"The model is untestable."** | **Econ PhD intervention.** | See below. |

  ---

  ### Part 3: Handling the Econ PhDs & The "Untestable" Objection (30–50 mins)
  The PhDs will argue that the Common Prior Assumption (CPA) is metaphysical and untestable because we never observe agents *before* they see evidence.

  **Do not fight this.**
  *   **The Concession:** "You are correct. We cannot observe the prior directly. It is a normative benchmark, not a descriptive fact."
  *   **The Pivot:** "In law, we don't need it to be scientifically testable. We need it to shift the *burden of explanation*."
  *   **The Move:** Assign the PhDs a role. When you move to the "Legal Reality" section, ask them: "If the CPA is untestable, what is the strategic value of asserting it in a brief?"
      *   *Desired Answer:* It forces the opposing expert to justify their worldview, not just their math. It moves the fight from "calculation error" to "fundamental bias."

  **Iterative Announcement (The "Talking it Out" version):**
  *   **Cut it.**
  *   **Reason:** It requires understanding dynamic updating and convergence rates. It eats 20 minutes and adds zero legal value. The static result ("If you know the number, you must agree") is sufficient for the legal point. Tell the class: "We are looking at the snapshot after reports are exchanged, not the movie of the conversation."

  **No-Speculative-Trade Theorem:**
  *   **One sentence.**
  *   **Say:** "This is the same math that proves why two insiders with the same information shouldn't bet against each other in the market. If you disagree on probability, one of you thinks the other is irrational. In court, that means one thinks the other is a hired gun."
  *   **Move on.**

  ---

  ### Part 4: The Legal Reality (50–65 mins)
  This is where you earn your pay. If you stop at the math, they think the law is broken. You must explain *why* the theorem fails in court and why that matters.

  **Why Experts Don't Converge in Real Life:**
  1.  **Priors aren't common:** One expert believes corporations are generally negligent; the other believes regulations ensure safety.
      *   *Legal Move:* Cross-examine the *prior*, not the posterior. "Doctor, before you saw a single test, didn't you already believe this drug was dangerous?"
  2.  **Likelihood Functions aren't shared:** They don't agree on what the evidence *means* (the LR).
      *   *Legal Move:* Attack the methodology. "You assigned a LR of 4 to that biomarker? The literature says 1.5."
  3.  **Distrust of Rationality:** I know your number, but I think you're biased (not a truthful Bayesian).
      *   *Legal Move:* Impeach credibility. "You only see evidence that supports your client."

  **Whiteboard Panel 3:** List these three failure points. This is their checklist for cross-examination.

  ---

  ### Part 5: Assessment & Exclusions (65–80 mins)

  **The "Exit Ticket" (Final 5 Minutes):**
  Do not ask "Do you understand?"
  Give them a hypothetical on the board:
  > *Expert A and Expert B agree on the base rate of accidents (Prior). They exchange reports. A says 90% liable, B says 10% liable. They refuse to change their numbers. The Judge asks you: What does this imply about the experts?*

  **Require them to write one sentence identifying the source of the impasse using course vocabulary.**
  *   *Pass:* "It implies they do not share a common prior or they do not trust each other's likelihood assessments."
  *   *Fail:* "One is lying." or "They have different evidence." (They already exchanged reports, so evidence is common knowledge).

  **What to Explicitly Skip (Say this out loud):**
  1.  **The Proof:** "We are not proving the partition knowledge theorem today. We are using the result."
  2.  **Harsanyi's Doctrine:** "We are not debating the philosophy of whether common priors *should* exist. We take it as a litigation tool."
  3.  **Dynamic Convergence:** "We are not modeling the conversation, only the stalemate."

  **Managing the Room:**
  *   **The PhDs:** Sit them in the front. When you ask "Why might the model fail?", call on them first. Get their technical objection out early ("Priors are untestable"), validate it ("Correct"), and then pivot to the legal utility ("So we use it to force disclosure"). This makes them allies rather than disruptors.
  *   **The Law Students:** Keep bringing it back to the *deposition*. "You are holding the transcript. What question do you ask next?"

  ### Summary of Dependencies
  1.  **Nail "Posterior = Prior + Info" first.** If they don't get this, Aumann makes no sense. (Minutes 0–15).
  2.  **Define "Common Knowledge" strictly.** If they think "I read your report" is enough, they won't understand why trust/rationality matters. (Minutes 30–35).
  3.  **Concede the "Untestable" point early.** If you wait until the end, the PhDs will feel ignored and interrupt. If you grant it in the middle, they feel heard and the class moves on. (Minutes 40–45).

  This structure respects the math, acknowledges the economists, but keeps the focus on the law: *Disagreement is not noise; it is data about the experts' biases.*
