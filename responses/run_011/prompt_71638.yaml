prompt: |-
  I'm a software engineer with no formal training in philosophy or history, and I've run into a disagreement I can't get any purchase on, so I'd like a structural diagnosis rather than a side taken.

  In my orbit — tech policy writing, strategy memos, long argument threads — any discussion of a rising power challenging an established one, of whether to negotiate with an adversary who has broken agreements before, or of whether a slow response to a new threat was negligent, immediately generates historical analogies: the appeasement of the 1930s and what it supposedly teaches about concessions; the general pattern of a rising power colliding with a ruling power and the claim that such pairs usually end up fighting; the domino reasoning that justified escalation in Southeast Asia; the accidental slide into catastrophe in 1914. A second group objects that this whole practice misleads, that an analogy is a similarity judgment nobody has argued for, that the supporting case tables are tiny and coded toward the conclusion the coder already held, and that the famous analogies are famous precisely because their outcomes were dramatic, so the sample is selected for memorability. The first group replies that all reasoning is comparison, that refusing to analogize is refusing to think, and that the critics deploy analogies constantly while preferring the ones that suit them. As far as I can tell this has run for decades in print on both sides and nobody has moved.

  My working hypothesis, which I want you to test rather than flatter, is that the two camps aren't disagreeing about history at all. One treats an analogy as an inference with premises and a conclusion that can be better or worse supported; the other treats it as a retrieval or framing device whose job is to make a possibility salient rather than to justify a belief. On that reading the stalemate is a category error — two different questions sharing the word analogy. I can already see pressure on my own hypothesis: the critics who complain about how cases were coded sound like they're making an empirical claim that better data could settle, and the defenders who say comparison is unavoidable sound like they're making a claim about evidence, not salience.

  So diagnose it. Is this a substantive disagreement, a verbal one, two questions under one label, a hidden empirical question about base rates doing all the work, or bedrock differences about what counts as a case that neither side can argue for? Characterize the strongest version of each position from what its adherents actually do and say — I'm not after names or reading lists. Tell me whether my nearest-neighbor framing helps or just relabels the confusion. Tell me which parts could in principle be settled, and by what: a distinction, a better dataset, a formal account of analogical inference, a change of question. Say plainly if my hypothesis is wrong, and if there's a third position that explains the deadlock better than mine, give it to me. If your honest conclusion is that no progress should be expected here, argue for that rather than hedging.
reasoning: |-
  Here's a thinking process that leads to the suggested diagnosis:

  1.  **Analyze the User and Request:**
      *   **User:** Software engineer, no formal philosophy/history training. Values structure, precision, and diagnosis over taking sides.
      *   **Context:** Tech policy, strategy memos, argument threads.
      *   **Problem:** A persistent stalemate regarding the use of historical analogies (e.g., Munich 1938, Thucydides Trap, Domino Theory, 1914) in policy debates.
      *   **The Conflict:**
          *   *Group A (Pro-Analogy):* "All reasoning is comparison," "Refusing to analogize is refusing to think," "You use them too."
          *   *Group B (Anti-Analogy/Critic):* "Analogies are similarity judgments without argument," "Data tables are tiny/biased," "Selection bias (famous = dramatic)."
      *   **User's Hypothesis:** It's a category error. Group A sees analogy as *inference* (premises -> conclusion). Group B sees it as *retrieval/framing* (salience). The stalemate is talking past each other.
      *   **User's Constraint:** Test the hypothesis, don't flatter. Diagnose the disagreement type (substantive, verbal, empirical, bedrock). Characterize strongest versions. Say if progress is possible.

  2.  **Deconstruct the User's Hypothesis:**
      *   *Hypothesis:* Group A = Inference (Justification), Group B = Framing (Salience). Stalemate = Category Error.
      *   *Critique:* The user notes pressure on this: Critics talk about coding data (empirical), Defenders talk about unavoidable comparison (epistemic).
      *   *Assessment:* The hypothesis is *partially* right but misses the deeper epistemological rift. It's not just Inference vs. Framing. It's about *what kind of knowledge history provides*. Is history a database of test cases (positivist) or a source of narrative intuition (hermeneutic)?

  3.  **Analyze the Two Camps (Strongest Versions):**
      *   **Camp 1 (The Analogizers/Defenders):**
          *   *Core Claim:* Human cognition is fundamentally analogical. We cannot reason about the future without mapping it to the past.
          *   *Function:* Analogies provide *plausibility* and *causal mechanisms*. (e.g., "Hitler didn't stop at Sudetenland, so Putin won't stop at Donbas" implies a specific psychological/causal model of aggression).
          *   *Defense:* "You do it too." (Tu quoque, but also true—concept formation relies on similarity).
          *   *Weakness:* Often implicit, untested, relies on surface features rather than structural dynamics.
      *   **Camp 2 (The Critics/Skeptics):**
          *   *Core Claim:* History is not a laboratory. N=1 for specific geopolitical configurations. Selection bias renders "lessons" statistically invalid.
          *   *Function:* Analogies act as *rhetorical bludgeons* that shut down analysis by invoking emotional weight (Munich = Evil).
          *   *Defense:* Methodological rigor (coding, base rates, counterfactuals).
          *   *Weakness:* Pure skepticism leads to paralysis. If you can't use the past, you have no priors.

  4.  **Diagnose the Disagreement Type:**
      *   *Verbal?* No. They aren't just defining "analogy" differently; they disagree on its utility.
      *   *Empirical?* Partially. (Do analogies lead to better decisions?). But hard to test.
      *   *Bedrock/Epistemological?* **Yes.** This is the core.
          *   Camp 1: *Case-Based Reasoning.* Knowledge is stored in exemplars.
          *   Camp 2: *Model-Based/Statistical Reasoning.* Knowledge is stored in variables and distributions.
      *   *The "Third Position" (The Real Deadlock):* It's not Inference vs. Framing. It's **Prediction vs. Preparation.**
          *   Analogizers use history to *predict* specific outcomes (If X, then Y).
          *   Critics attack the *predictive validity* but often fail to offer an alternative way to handle uncertainty.
          *   *Better Diagnosis:* The deadlock is about **Reference Class Forecasting.** The fight is over which reference class is the "true" one. (Is Ukraine 1938? Or is it 1914? Or is it unique?).

  5.  **Evaluate the User's Hypothesis (Inference vs. Salience):**
      *   *Helpful?* Yes, it identifies that one side treats it as proof and the other as a heuristic.
      *   *Incomplete?* Yes. The Critics aren't just saying "It's for salience." They are saying "It's bad science." The Defenders aren't just saying "It's inference." They are saying "It's the *only* inference available."
      *   *Verdict:* The hypothesis is a good *functional* description but misses the *epistemic* clash.

  6.  **Develop the Structural Diagnosis:**
      *   **The Core Conflict:** It is a clash between **Narrative Coherence** (Camp 1) and **Statistical Validity** (Camp 2).
      *   **The "Reference Class" Problem:** This is the technical term for the deadlock. To use an analogy, you must group the current situation with past ones. Camp 1 picks a class where the pattern holds (Aggressors). Camp 2 picks a class where the pattern fails (Nuclear powers). Neither can prove their class is the "right" one without begging the question.
      *   **The Empirical Component:** Can be settled by looking at *process* rather than *outcome*. Do analogies improve decision-making *processes*? (Tetlock-style research).
      *   **The Bedrock Component:** What is the ontology of social science? Are there laws of history (Camp 1 implies yes) or is it contingent chaos (Camp 2 implies yes)?

  7.  **Drafting the Response (Iterative refinement):**
      *   *Acknowledge the User's Insight:* Validate the Inference vs. Salience point. It's sharp.
      *   *Correct/Deepen:* Push it to "Reference Class Forecasting." That's the engineer-friendly term.
      *   *Characterize Camps:*
          *   Camp 1: *Exemplar Reasoners.* History as a library of patterns.
          *   Camp 2: *Variable Reasoners.* History as a dataset of confounders.
      *   *Diagnose the Stalemate:* It's not a category error; it's a **Reference Class Dispute.** Both agree analogies *are* inference, but they disagree on the *population* from which the sample is drawn.
      *   *Settleability:*
          *   Empirical: Tetlock's work (Superforecasting). Analogies are useful *if* treated as probabilistic priors, not deterministic laws.
          *   Formal: Bayesian updating. Treat the analogy as a prior, update with specific data.
          *   Bedrock: Cannot be settled. Is history cyclical or contingent?
      *   *Conclusion:* The user's hypothesis is 80% right but misses the "Reference Class" mechanism which explains *why* the inference/salience split exists.

  8.  **Refining the "Third Position":**
      *   The user asked for a third position if it explains the deadlock better.
      *   *Idea:* The deadlock isn't about analogy itself. It's about **Causal Mechanism vs. Surface Similarity.**
      *   Camp 1 often relies on surface similarity (Hitler -> Putin).
      *   Camp 2 attacks surface similarity.
      *   *Better Third Position:* **Process Tracing.** The only way to resolve it is to stop asking "Is this like Munich?" and start asking "What is the causal mechanism, and did it operate in Munich?"
      *   *Wait, actually:* The *Reference Class* problem is more fundamental. It explains why the data coding argument (Camp 2) fails to convince Camp 1. Camp 1 says "You coded the wrong cases." Camp 2 says "You coded too few."
      *   *Decision:* Stick with Reference Class Forecasting as the technical diagnosis. It bridges the engineering mindset and the philosophical problem.

  9.  **Final Polish:**
      *   Ensure tone is direct, analytical, not flattering.
      *   Check constraints: "Say plainly if my hypothesis is wrong." (It's not wrong, just incomplete). "Argue for [no progress] rather than hedging." (Be clear on what is solvable vs. bedrock).

  10. **Self-Correction during drafting:** I need to make sure I don't just say "Reference Class" and walk away. I need to explain *why* that creates the stalemate. The stalemate exists because selecting the reference class *is* the political act. That's the key insight. The analogy isn't the argument; the analogy is the *conclusion* of a hidden argument about which variables matter.

  11. **Final Structure:**
      *   Verdict on Hypothesis (Strong but incomplete).
      *   Strongest Versions of Camps (Exemplar vs. Variable).
      *   The Real Diagnosis (Reference Class Problem).
      *   Settleability (What can/cannot be fixed).
      *   Recommendation (How to move forward).

