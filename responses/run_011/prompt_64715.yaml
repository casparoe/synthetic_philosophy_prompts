  *   **10-25:** Phase 1 (Boots). Fast, easy success. (Confidence).
  *   **25-40:** Phase 2 (Socks). Friction begins. "Left/Right" debates. (Doubt).
  *   **40-50:** Phase 3 (The Wall). The Shuffle. Protocols fail. Silence. (Crisis).
  *   **50-55:** **BREAK.** (Essential digestion time).
  *   **55-65:** Phase 4 (The Oracle). The Offer. The Vote. (Decision).
  *   **65-75:** Scoring and Consequences. Who "won"? What did they sign? (Reflection).
  *   **75-90:** Debrief. Board work. Mapping Game to Math. (Clarification).
