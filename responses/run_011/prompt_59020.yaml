  writing the last section of a paper on multiple realizability and i keep reaching for the stadium wave as my explainer: the wave travels round the ground, the people doing the standing and sitting are different from moment to moment, nobody thinks the wave is made out of any particular spectators — so a mental state is like that, made of whatever stuff happens to be doing the job, and not reducible to the hardware. i use it to argue against type identity, and then again in a section on octopus nociception, where the thought is that given how differently their nervous systems are laid out, the anti-reductionist conclusion should have real bite rather than being a merely logical point.

  my advisor thinks the analogy is doing more harm than good and i can't quite see why. her worry, as i understand it, is that the wave only shows different waves in different stadiums can look alike — tokyo's wave and rio's wave are not the same wave — whereas what i actually need is that one and the same state could have been realized in other stuff, or is right now realized in the octopus rather than merely imitated by it.

  can you audit it for me? i want the correspondence table first (who's the spectator, what's the pattern, what plays the stadium, who's individuating the wave as one wave), then a split between the disanalogies that actually undercut my argument and the ones that are just noise. and compare it with the software/hardware version people usually offer as an interchangable gloss — are the two pictures really saying the same thing, or does each smuggle in something the other doesn't (an interpreter, an audience, a specification written before there's any medium)? if both fail for the octopus section, tell me what image would work, or whether i should drop the imagery entirely and just argue the type/token distinction directly.
