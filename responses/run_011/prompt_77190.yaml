answer: |-
  ### 1. Disciplined Mapping

  **Shared Intention (Bratman-style)**
  *   **Demands:** This account requires interlocking intentions ("I intend that we J," "You intend that we J"), meshing subplans, and mutual knowledge of these intentions. It relies on coordination over time.
  *   **Supplied:** The joint burials fit well here. Men from opposing sides met in no man's land with complementary roles (digging, carrying, praying). The "live and let live" firing patterns (shelling empty ground at known times) also fit: both sides intend the other's safety conditional on reciprocal restraint, with subplans regarding timing and location.
  *   **Missing:** The initial carol singing and shouted greetings. There is no evidence of interlocking intentions *before* the singing started; it was reactive. One side sang, the other responded. Bratman's account struggles with spontaneous, uncoordinated onset that *becomes* coordinated mid-stream. Furthermore, mutual knowledge is thin; a soldier might hope the other side won't shoot, but lack the epistemic security Bratman usually requires for shared intention.
  *   **Silent:** On the normative force. If a soldier shoots during a tacit truce, Bratman's account describes a failure of coordination or a change of intention, but it does not inherently generate a verdict of *wrongdoing* against the partner.

  **Plural Subject (Gilbert-style)**
  *   **Demands:** A joint commitment formed through mutually expressed readiness to be committed as a body. This creates obligations and entitlements to rebuke. Rescission requires mutual agreement.
  *   **Supplied:** The sense of betrayal when firing resumed is strong evidence for the existence of obligations. The exchange of tobacco and food acts as the "mutual expression" of readiness to engage in a non-hostile relationship. The account explains why soldiers felt they *could not* simply decide individually to break the truce without wronging the other.
  *   **Missing:** The "expression of readiness" is the sticking point. Gilbert typically requires some signal that creates the commitment. While exchanging gifts counts, the initial cessation of fire was often silent. If "not shooting" counts as an expression of readiness, the bar is low; if it requires positive signaling, the early tacit truce falls outside the account.
  *   **Silent:** On the boundaries of the subject. It does not specify whether the "plural subject" is the two individuals in no man's land, the two platoons, or the two sectors.

  **We-Intention (Searle-style)**
  *   **Demands:** A primitive mental state in individual heads ("We are doing X"). It requires no mutual belief or prior commitment.
  *   **Supplied:** This handles the first ten minutes of the carols best. A German soldier sings "Silent Night" with the we-intention "We are singing carols." If a British soldier joins, he adopts the same we-intention. No prior agreement is needed. It also explains the individual decision to stop firing: "We are not fighting today."
  *   **Missing:** It cannot explain the *coordination* success without mutual belief. If I have a we-intention but believe you will shoot me, I will not step into no man's land. Searle's account separates the intention from the epistemic conditions required for safety, making it psychologically possible but practically risky.
  *   **Silent:** On normativity. Like Bratman, this is a descriptive account of mental states. It does not explain why breaking the we-intention feels like a moral violation rather than just a change of mind.

  ### 2. The Verdicts on Resumption

  **Shared Intention:**
  When commanders ordered firing to resume, the soldiers' interlocking intentions were broken. On this view, the soldier who fires is not necessarily wronging the specific enemy he fraternized with; he is simply updating his intention to align with his commanders (a new shared intention with his own army).
  *   *Credit/Cost:* This is a cost. It fails to capture the specific interpersonal wrong described in diaries ("I felt I was shooting a friend"). It reduces a moral breach to a coordination failure.

  **Plural Subject:**
  The joint commitment created in no man's land cannot be rescinded unilaterally. The soldier ordered to fire is in a conflict of commitments: one to his army, one to the plural subject formed with the enemy. If he fires, he breaches the joint commitment with the enemy.
  *   *Credit/Cost:* This is a credit to the theory's descriptive power regarding the *feelings* of the soldiers (guilt, betrayal). However, it is a theoretical cost if one believes soldiers cannot incur binding obligations to enemies that override lawful orders. It implies the soldiers were morally bound to disobey orders, which is a heavy normative load to place on a tacit understanding.

  **We-Intention:**
  The soldier simply ceases to have the we-intention "We are at truce" and acquires "We are at war." Since the intention is solely in his head, he can change it at will.
  *   *Credit/Cost:* This is a significant cost. It renders the sense of obligation inexplicable. If the intention is just a mental state, changing it under orders should be psychologically neutral. The fact that it wasn't suggests the we-intention account is missing the normative glue that binds the state to the action.

  ### 3. The Grain Problem

  **Shared Intention:**
  This account is sensitive to scale. It likely locates the collective intention at the level of the **platoon or section**. Only men who knew each other and coordinated subplans (e.g., "We cover the left, you cover the right") can sustain the interlocking intentions. It cannot easily scale to the "sector" because mutual knowledge degrades over distance.
  *   *Boundary:* The truce sits on the upper boundary. It is too diffuse for strict Bratmanian analysis unless we treat "the sector" as a proxy for "the men I can communicate with."

  **Plural Subject:**
  The plural subject is formed wherever the joint commitment is made. This creates a **fragmented ontology**. There is a plural subject of the burial party, a different one for the football game, and perhaps another for the trench sector that agreed to shelling times.
  *   *Boundary:* The account does not have a default scale; it tracks the scope of the commitment. The risk is fragmentation: did the man in the support trench belong to the same plural subject as the man in the front line? If they didn't express readiness to each other, Gilbert says no. This makes the "sector-wide truce" a mosaic of micro-commitments rather than one large one.

  **We-Intention:**
  This account has no grain problem because it is individualistic. A whole **company** can have we-intentions without any interaction, provided each individual holds the state.
  *   *Boundary:* The truce sits comfortably inside this account, but this is a double-edged sword. It allows the "British Army" and "German Army" to have we-intentions of non-aggression without ever communicating, which risks over-generating collective action. It cannot distinguish between a coordinated truce and a coincidental lull.

  ### 4. Persistence

  **Person-Based Accounts (Bratman/Gilbert):**
  If the commitment is held by particular persons, the arrival of new units should terminate the truce. The fact that the practice persisted suggests either:
  1.  New soldiers rapidly formed new commitments (learning the local norm).
  2.  The "commitment" is not between persons but attached to a **role** or **location**.
  *   *Analysis:* If we say the *Trench* holds the commitment, we move toward a group-agent ontology. The cost is that individual agency is diminished; the new soldier is "swept up" in a commitment he didn't make. This fits the phenomenology (new men were told "we don't shoot here") but strains the theory, which usually grounds commitment in individual will.

  **Group Agent Account:**
  If the company is an agent surviving turnover, the persistence is straightforward. The "handover" is the procedure by which the group agent inducts new members.
  *   *Redescription Cost:* You lose the interpersonal moral force. If the *Company* made the deal, the individual soldier isn't personally betraying the German opposite him; he is merely failing his unit's policy. This contradicts the diary evidence which speaks of personal shame ("I could not look him in the eye").

  **Verdict:** The episode favours a hybrid. The *practice* is institutional (persisting through turnover), but the *commitment* feels interpersonal (generating personal guilt). Standard collective intentionality accounts struggle to hold both simultaneously.

  ### 5. Competition (Game Theory vs. Intentionality)

  **The Game-Theoretic Reading:**
  The Iterated Prisoner's Dilemma (IPD) explains the ceasefire as rational self-interest. "I don't shoot you because you won't shoot me." The shadow of the future sustains cooperation. No intention is required, only payoff sensitivity.

  **Discriminating Data:**
  1.  **Warnings about Raids:** IPD predicts silence. Warning the enemy that a raid is coming reduces your own payoff (loss of surprise). Intentionality explains this as a normative obligation ("I owe him a warning because we shared tobacco").
  2.  **Fraternal Friction:** Soldiers reported difficulty firing on men they had met. IPD treats this as a change in payoff matrix (psychological cost of killing). Intentionality treats it as a conflict of commitments.
  3.  **Betrayal:** When officers forced a resumption, soldiers felt guilt. In IPD, this is just a change in external constraints. In Intentionality, this is a violation of a promise.

  **Judgment:**
  The game-theoretic reading explains the *stability* of the non-aggression (why it didn't collapse immediately). The intentional reading explains the *content* and *normativity* (why it became a truce with gifts, carols, and burials rather than just a sniper's stalemate). They are not rivals but describe different layers. However, the **felt obligation** is data that IPD must treat as an exogenous preference, whereas Intentionality treats it as constitutive of the action. If you accept the soldiers' reports of obligation as genuine and not post-hoc rationalization, IPD is insufficient.

  ### 6. Step Back

  **Implications for the Literature:**
  The standard cases (painting, rowing) assume a background of **permission**. The agents are free to cooperate. The WWI case assumes a background of **prohibition**. The collective intentionality here is *counter-institutional*.
  *   **Too Demanding?** The Shared Intention account is too demanding regarding mutual knowledge. Soldiers acted on hope and thin signals, not secure common knowledge.
  *   **Too Permissive?** The We-Intention account is too permissive; it cannot distinguish the truce from a coincidental lull without adding epistemic conditions.
  *   **Blind Spot:** The Plural Subject account comes closest but assumes a level of expressiveness that may have been dangerously implicit in a war zone. None of the accounts fully anticipate collective intentionality formed *in defiance* of a larger, coercive collective intention (the Army's order to fight).

  **Critique of Your Inclination:**
  *   *Shared Intention:* You are right that it handles the burials best. It fails the larger truce not because of size, but because the "meshing subplans" were often implicit and reactive rather than planned.
  *   *Plural Subject:* You suggest it makes commitment "cheap." I would argue the opposite risk: it makes commitment **too explicit**. Gilbert requires a mutual expression of readiness. If the truce was truly tacit (silence), Gilbert might deny a joint commitment existed at all, forcing us to say the soldiers felt obligations they didn't actually have.
  *   *We-Intention:* You are right that it handles the onset. But it fails to explain why the truce *held*. A we-intention alone does not stop a bullet; the belief that the *other* has a we-intention does. Searle's "no mutual belief" clause is a weakness here.

  ### Housekeeping

  **Inferences Flagged:**
  1.  **Psychology of Betrayal:** I have inferred from "accounts describe... sense of betrayal" that this was a widespread, constitutive feeling rather than a post-war literary trope. If this is romanticization, the normative verdicts of the Plural Subject account lose their empirical anchor.
  2.  **Handover Mechanism:** I have treated the "informal handover" to new units as a mechanism of normative transmission. If this was merely coercion ("Do this or be shot by your NCO") rather than socialization, the persistence argument for group agency weakens.
  3.  **Game Theory Payoffs:** I have assumed the "warning about raids" reduces military payoff. If the warning was actually a strategic move to prevent escalation that would harm the warners more, IPD could absorb this data.

  **Claims to Check:**
  1.  **Gilbert on Tacitness:** Check whether Gilbert's later work allows for *tacit* joint commitment through patterned behaviour alone, without explicit expression. If so, the Plural Subject account fits the early tacit truce better than I have allowed.
  2.  **Searle on Normativity:** Check whether Searle's later work on social ontology (Status Functions) adds a normative layer to We-Intentions that could explain the "obligation" without requiring Gilbert's joint commitment.
  3.  **Factual Detail:** You noted the truce died away by 1916 due to orders and transfers. Verify if there are documented cases where new units *refused* to inherit the local truce despite the handover. If new units immediately resumed killing without friction, it suggests the "commitment" was entirely local to the specific individuals, undermining the persistence argument.

  **Potential Factual Correction:**
  You mention the quieter version persisted in places for much of the war. Be careful distinguishing between **collusive non-aggression** (aiming high/wide) and **fraternization** (meeting in no man's land). The literature on collective intentionality might apply differently to these. Collusion requires only parallel action (easier for We-Intention); fraternization requires joint action (requires Shared Intention/Plural Subject). Conflating them might blur the grain problem.
