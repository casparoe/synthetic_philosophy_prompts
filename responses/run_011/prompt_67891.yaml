answer: |-
  # The Wellbeing Validation Protocol (WVP-1)

  **Purpose:** To validate claims of extreme wellbeing-per-dollar, distinguish between sources of multiplier effects, and separate evidentiary disputes from value judgments.
  **Users:** Program Officers (PO).
  **Time Budget:** 90 minutes per application.
  **Output:** A completed Scorecard with Pass/Fail/Escalate status at each gate. Rejection letters must cite the specific Gate and Reason Code.

  ---

  ## Part 1: The Decision Procedure

  ### Gate 1: Decomposition (The Source of the Multiplier)
  **Time:** 15 minutes.
  **Action:** Categorize the primary driver of the claimed wellbeing gain. An application may have multiple drivers, but you must select the *dominant* one (>50% of the claimed value).

  *   **Type E (Efficiency):** The intervention is cheaper, faster, or more durable than alternatives. (e.g., "$100 cures blindness" vs. "$1000 cures blindness").
  *   **Type C (Capacity):** The recipients have a higher physiological or psychological capacity to experience welfare per unit of input. (e.g., "Neural implants amplify pleasure").
  *   **Type B (Baseline):** The recipients start from a lower baseline, so the same absolute gain represents a larger proportional improvement or marginal utility. (e.g., "$100 means more to a starving person than a wealthy one").

  **Decision Rule:**
  *   **Type E:** Proceed to Gate 2. (Efficiency is generally uncontroversial).
  *   **Type C:** Proceed to Gate 2, but **Flag for Board Review**. (This is a value judgment on "super-welfare").
  *   **Type B:** Proceed to Gate 2, but **Flag for Board Review**. (This is a value judgment on "prioritarianism").

  **Termination:** None. All types proceed, but C and B require Board ratification of the *weighting*, not just the facts.
  **Record:** Select Type E, C, or B.

  ### Gate 2: Evidentiary Standard (The "Do We Believe It?" Check)
  **Time:** 45 minutes.
  **Action:** Assess the reliability of the welfare claim. This is strictly about *belief*, not *value*. Apply the **Reliability Discount (RD)** to the claimed multiplier.

  **The Self-Report & Adaptation Rule:**
  *   **Objective Metrics:** (e.g., income, health biomarkers, school attendance). **RD = 1.0** (No discount).
  *   **Self-Report (General):** (e.g., standard life satisfaction surveys). **RD = 0.8**.
  *   **Self-Report (Chronic/Adapted):** If recipients are in chronic deprivation or have altered states (e.g., long-term disability, neural implants), self-reports are subject to "Preference Adaptation" (people report being fine despite bad conditions) or "Calibration Drift" (altered states).
      *   *Requirement:* Must be corroborated by third-party observation or objective function markers.
      *   *If Corroborated:* **RD = 0.8**.
      *   *If Uncorroborated:* **RD = 0.5**. (This is the penalty for the "Happy Slave" risk).

  **Calculation:** `Adjusted Multiplier = Claimed Multiplier × RD`

  **Decision Rule:**
  *   If `Adjusted Multiplier` < 5.0 (or 5x median): **Approve** (Standard Track).
  *   If `Adjusted Multiplier` ≥ 5.0: Proceed to Gate 3.

  **Termination:** If evidence is nonexistent or anecdotal, Reject. **Code: EV-01 (Insufficient Evidence).**
  **Record:** Evidence Type, RD applied, Adjusted Multiplier.

  ### Gate 3: The Concentration & Risk Check
  **Time:** 15 minutes.
  **Action:** Assess the risk of funding concentration. This is not a moral cap; it is a portfolio risk assessment.

  **Questions:**
  1.  Does this grant exceed 12% of the annual budget? (Yes/No)
  2.  If this intervention fails ex-post, is the reputational damage catastrophic? (Yes/No)
  3.  Does this create a "single point of failure" for the beneficiary group? (e.g., If we stop funding, do they die/lose function?) (Yes/No)

  **Decision Rule:**
  *   If >12% AND (Catastrophic Risk OR Single Point of Failure): **Escalate to Board.**
  *   If >12% BUT (Low Risk AND Exit Strategy Exists): **Proceed.**
  *   If <12%: **Proceed.**

  **Termination:** If PO determines risk is unmanageable without Board mitigation. **Code: RK-01 (Concentration Risk).**
  **Record:** Risk Profile, Exit Strategy status.

  ### Gate 4: The Value Flag (The "Should We Count It?" Check)
  **Time:** 15 minutes.
  **Action:** This step does not calculate numbers. It identifies where the foundation's values are being tested.

  **Decision Rule:**
  *   **Type C Claims (Capacity):** PO cannot approve alone. The Board must decide if "intensified welfare" counts equally to "standard welfare."
      *   *PO Recommendation:* "Validate Math" or "Reject Premise."
  *   **Type B Claims (Baseline):** PO cannot approve alone. The Board must decide if "marginal utility" weights are applied.
      *   *PO Recommendation:* "Apply Weight" or "Flat Sum."

  **Termination:** If Type C or B, decision is **Board Ratification Required**.
  **Record:** Value Conflict Description.

  ---

  ## Part 2: Anticipating Gaming (Goodhart's Law)

  **What applicants will learn to say:**
  Once WVP-1 is public, applicants will reframe **Type C (Capacity)** and **Type B (Baseline)** claims as **Type E (Efficiency)** claims.
  *   *Example:* Instead of saying "Our recipients feel pleasure 10x more intensely" (Type C), they will say "Our procedure produces 10x the standard units of wellbeing per dollar" (Type E).
  *   *Example:* Instead of saying "They are poorer so it counts more" (Type B), they will say "The cost to achieve baseline function is lower here" (Type E).

  **Counter-Measure:**
  Gate 1 includes an **Audit Clause**. If the PO suspects a Type C or B claim is disguised as Type E, they must request a "Mechanism of Action" statement. If the mechanism relies on recipient physiology or baseline status rather than intervention cost/durability, it is reclassified. Misclassification discovered post-grant is grounds for clawback.

  ---

  ## Part 3: Running the Procedure on the Three Cases

  ### Case 1: The High-Volume Efficiency Claim
  *   **Claim:** Cheap procedure, high volume, durable. Multiplier: 40x.
  *   **Gate 1 (Decomposition):** **Type E (Efficiency).** The multiplier comes from cost/volume, not recipient capacity.
      *   *Flag:* None.
  *   **Gate 2 (Evidence):** Objective metrics available (procedure count, durability data). **RD = 1.0**.
      *   *Adjusted Multiplier:* 40.0.
  *   **Gate 3 (Risk):** Claim implies high volume. If it fails, many lose out, but it's likely not a "single point of failure" for survival. Assume <12% budget.
      *   *Result:* Pass.
  *   **Gate 4 (Value):** No value conflict. Efficiency is core to the mission.
  *   **Outcome:** **PO Approval Recommended.**
  *   **Notes:** This is the "clean" win. It validates the shift to wellbeing-per-dollar without triggering moral hazards.

  ### Case 2: The Neural Implant Cohort (Intensity Claim)
  *   **Claim:** Few hundred people, neural implants, ordinary pleasures feel dramatically more intense. Multiplier: 300x.
  *   **Gate 1 (Decomposition):** **Type C (Capacity).** The intervention isn't cheaper; the *recipients* feel more.
      *   *Flag:* **Board Review Required.**
  *   **Gate 2 (Evidence):** Self-report + medical data on implant function. However, "intensity of pleasure" is subjective.
      *   *Rule:* Altered state self-report requires corroboration. Assume they have some behavioral markers. **RD = 0.8**.
      *   *Adjusted Multiplier:* 240.0.
  *   **Gate 3 (Risk):** Small cohort (few hundred). Budget impact likely <12%.
      *   *Result:* Pass.
  *   **Gate 4 (Value):** **CRITICAL FLAG.** The Board must decide if a "super-unit" of welfare equals 300 "standard units."
  *   **Outcome:** **Escalate to Board.**
  *   **The Uncomfortable Result:** The PO *cannot* reject this on the spreadsheet. The math holds. The procedure forces the Board to look at the 300x number and explicitly vote: *"We deny this funding not because the welfare isn't real, but because we do not value your welfare 300x more than a starving child's."*
      *   *Why this is uncomfortable:* It exposes that the foundation is not actually maximizing wellbeing; it is maximizing wellbeing *subject to an egalitarian constraint* they haven't admitted to.

  ### Case 3: The Ninety-Person Low-Baseline Program
  *   **Claim:** Rare condition, very low baseline. Same improvement = larger gain. Multiplier: 80x.
  *   **Gate 1 (Decomposition):** **Type B (Baseline).** The multiplier is due to starting deprivation.
      *   *Flag:* **Board Review Required.**
  *   **Gate 2 (Evidence):** Recipients have a rare condition (chronic). They report high satisfaction gains.
      *   *Rule:* Chronic condition self-report. Is there objective corroboration? Let's assume **No** (common in rare conditions).
      *   *RD:* **0.5** (Uncorroborated Adapted Preference).
      *   *Adjusted Multiplier:* 40.0. (Still high, but halved).
  *   **Gate 3 (Risk):** 90 people. High dependency risk. If funding stops, do they regress severely? Likely Yes.
      *   *Result:* **Escalate (Risk).**
  *   **Gate 4 (Value):** **CRITICAL FLAG.** Board must decide on Prioritarian Weighting.
  *   **Outcome:** **Escalate to Board.**
  *   **The Uncomfortable Result:** The procedure penalizes this application heavily on **Gate 2**. Because the recipients are chronically ill, their self-reports are discounted for "Adaptation." To get funded, they must provide objective data they may not have. The procedure effectively says: *"Your suffering is harder to measure, so it counts for less until proven otherwise."* This favors the Efficiency case (Case 1) over the Equity case (Case 3).

  ---

  ## Part 4: Honest List of Judgment Calls & Limitations

  This procedure is not a moral algorithm. It is a risk management tool that forces moral decisions into the light. Here is where the philosophy underdetermines the rule:

  1.  **The Adaptation Discount (Gate 2):**
      *   *The Call:* We discount self-reports from chronically deprived people (RD 0.5) to avoid the "Happy Slave" paradox (where oppression looks efficient because victims adapt).
      *   *The Cost:* This systematically disadvantages groups whose suffering is internal or hard to measure objectively. It privileges "easy to measure" welfare over "hard to measure" welfare.
      *   *Limitation:* No procedure can solve this without an objective theory of wellbeing we do not possess.

  2.  **The Capacity Neutrality (Gate 4):**
      *   *The Call:* The procedure treats the Neural Implant claim as mathematically valid, pushing the rejection to the Board.
      *   *The Cost:* It forces the Board to explicitly endorse "Welfare Elitism" (some people's happiness counts more) if they reject the claim.
      *   *Limitation:* The procedure cannot tell you if "super-pleasure" is morally equivalent to "relief from pain." It only calculates the sum.

  3.  **The Efficiency Loophole (Gate 1 Audit):**
      *   *The Call:* We allow applicants to reframe Capacity/Baseline claims as Efficiency claims.
      *   *The Cost:* Savvy applicants will hire consultants to write "Mechanism of Action" statements that hide Type C/B claims inside Type E language.
      *   *Limitation:* POs have 90 minutes. They will miss sophisticated framing. The Audit Clause is a deterrent, not a guarantee.

  4.  **The Concentration Cap (Gate 3):**
      *   *The Call:* We keep the 12% cap but reframe it as "Risk" rather than "Equity."
      *   *The Cost:* This is still a fudge. If the Implant case (Case 2) truly produces 300x welfare, diversifying the portfolio *reduces* total welfare.
      *   *Limitation:* This procedure protects the *Foundation's* longevity and reputation more than it protects the *World's* total welfare.

  5.  **The Board Bottleneck:**
      *   *The Call:* Value judgments (Type C/B) go to the Board.
      *   *The Cost:* The Board may not be more philosophically consistent than the POs. They may vote based on intuition, creating inconsistent precedents.
      *   *Limitation:* This procedure does not solve the "Utility Monster"; it just ensures the Monster is slain by a deliberate vote, not an administrative accident.

  **Final Operational Note:**
  This procedure will not stop the Utility Monster. It will only force you to admit whether you want to feed it. If you fund Case 1 but reject Case 2, you have admitted that your mission is not "Maximize Wellbeing" but "Maximize Wellbeing within Egalitarian Constraints." Write that into your bylaws, or stop pretending the cap is just about risk.
