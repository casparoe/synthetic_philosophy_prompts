  Your working formulation ("Wrong if it makes a particular person worse off OR lowers average wellbeing") is a hybrid of the Person-Affecting View and Average Utilitarianism. As you suspected, it fractures on Case 6. If Average Utilitarianism condemns Case 5 (large marginal population lowers the average), your verdict ("not wrong") contradicts it. If Average Utilitarianism endorses Case 6 (smaller, happier population raises the average), your verdict ("wrong") contradicts it. You are effectively holding two incompatible views: one that prioritizes quality of life (Cases 2, 3, 4) and one that prioritizes the right to exist (Cases 5, 6).

  Here are two candidate principles that attempt to systematize your six verdicts, followed by an analysis of the costs and the likely motivated reasoning.

  ### Candidate Principle 1: The Same-Number Quality Constraint (SNQC)

  **Statement:**
  1.  **Quality Clause:** In any decision where the *number* of people who will exist is roughly the same, it is wrong to choose the outcome in which those people have lower average wellbeing, even if their lives are worth living and they are numerically different persons.
  2.  **Identity Clause:** An act is not wrong simply because it results in different specific individuals existing, provided the Quality Clause is satisfied.
  3.  **Status Quo Clause:** It is wrong to implement a policy that prevents a specific, determinate population from existing for the sake of raising average wellbeing, if that population has already been conceived or is socially/politically "in play."

  **Motivation:**
  *   **Quality Clause:** Motivated by **Case 2** (Deaf Couple), **Case 3** (The Plant), and **Case 4** (The Program). These all share the structure of "Same Number, Different Quality." You consistently judge based on the quality of the resulting life (Deaf < Hearing; Leaky < Safe; Screened < Unscreened).
  *   **Identity Clause:** Motivated by **Case 1** (Postponement). You need this to explain why changing *who* exists isn't inherently wrong.
  *   **Status Quo Clause:** Motivated by **Case 6** (The Reversal). This is the only way to save your verdict that replacing the marginal population is wrong. It draws a line between "choosing who comes next" (Permissible/Required) and "canceling a group that is already on the way" (Wrong).

  **Predictions for Unresolved Cases:**
  *   **Fertility Drug:** (One child, higher risk of pain, otherwise no child). This is a "Same Number" case (1 vs 1). The Quality Clause dictates that choosing the higher-risk drug is **Wrong**, because the alternative (taking no drug/having no child) is not the comparison; the comparison is "Child with Risk" vs "No Child." *Correction:* Under Non-Identity, the comparison is "Child with Risk" vs "No Child." If "No Child" is the alternative, the Quality Clause struggles. However, if the drug is *optional* and a safer alternative exists, SNQC says **Wrong**. If the drug is the *only* way to conceive, SNQC is silent or Permissible (as no "better" child is possible). Assuming the prompt implies a choice between "Drug Child" and "No Child," SNQC typically permits this (No person is worse off). *However*, given your verdict on Case 2, SNQC would likely condemn this if a safer fertility treatment existed. If the drug is the *only* option, SNQC permits it.
  *   **One Fewer Child:** (Pay couples to have 1 fewer; smaller pop, better off). This triggers the **Status Quo Clause**. If the "large population" is merely a projection (like Case 5), the Status Quo Clause does not protect them. SNQC would mandate the "One Fewer" policy to maximize average wellbeing. **Verdict: Obligatory.**

  **Surrender Costs:**
  1.  **Case 6 (High Cost):** SNQC forces you to accept Case 6. It argues that if the "marginal population" is not yet conceived (frontier policy), you *must* choose the smaller, happier one. You must surrender your intuition that replacing them is wrong.
  2.  **Case 5 (Medium Cost):** SNQC suggests Case 5 is Wrong (or at least regrettable) if the marginal lives lower the average compared to a smaller alternative. You must surrender the "not wrong" verdict.

  ### Candidate Principle 2: The Asymmetric Existence Threshold (AET)

  **Statement:**
  1.  **Harm Threshold:** It is wrong to cause a person to exist with a significant impairment or reduced healthspan if a healthier alternative person could have existed instead.
  2.  **Benefit Permission:** It is permissible (but not obligatory) to cause a person to exist with enhanced healthspan or traits, even if this selects against other potential persons.
  3.  **Existence Right:** It is permissible to create any population whose lives are worth living. It is wrong to prevent such a population from existing solely to create a different, happier population.

  **Motivation:**
  *   **Harm Threshold:** Motivated by **Case 2** (Deafness) and **Case 3** (The Leak). You treat health deficits as moral negatives that trump Non-Identity.
  *   **Benefit Permission:** Motivated by **Case 4** (The Program). You endorse enhancement but distinguish it from the "monstrous" application to born children. This clause captures the intuition that "improving" is okay, "impairing" is not.
  *   **Existence Right:** Motivated by **Case 5** (Settlement) and **Case 6** (Reversal). This prioritizes the *quantity* of lives (provided they are >0 wellbeing) over the *quality* optimization when numbers change.

  **Predictions for Unresolved Cases:**
  *   **Fertility Drug:** (Risk of painful condition). This falls under **Harm Threshold**. If the condition is "significant," the act is **Wrong**, even if the child wouldn't otherwise exist. If the condition is "manageable" (as you wrote), it may fall below the threshold and be **Permissible**.
  *   **One Fewer Child:** (Smaller, happier population). This falls under **Existence Right**. Preventing the larger population from existing to create a happier one is **Wrong**. The "Right to Exist" of the marginal group trumps the utility gain of the smaller group.

  **Surrender Costs:**
  1.  **Case 4 (High Cost):** AET makes Case 4 merely *permissible*, not necessarily *endorsable* as public policy. More critically, it struggles to explain why Case 4 is okay but applying it to born children is "monstrous." If the principle is about "Harm vs Benefit," why does the ontology of the child (embryo vs born) change the morality so drastically? You must surrender the coherence of your enhancement intuition.
  2.  **Case 3b (Medium Cost):** AET relies on a "Significant Impairment" threshold. In Case 3b, the leak causes a chronic respiratory condition costing a decade of life. Is this "significant"? If yes, AET works. If no (because life is still worth living), AET fails to condemn it. You risk losing the condemnation of the leak if the harm isn't deemed "threshold-level."

  ### Motivated Reasoning Identification

  One of your reactions is likely **motivated reasoning dressed as intuition: Case 4 (The Program).**

  **Why:**
  You state you endorse the state-funded screening, yet admit it would be "monstrous if the same selection criteria were applied to children already born." This admission reveals that your moral discomfort lies with the *act of selection itself*, not the outcome. In Case 3b (The Plant), you refused to let the Non-Identity problem excuse the harm ("My condemnation does not weaken"). You insisted that the *outcome* (shorter lives) mattered, regardless of who existed.

  In Case 4, you are accepting the Non-Identity loophole to endorse the program. You are allowing the fact that "they are only embryos" to override the "monstrous" nature of the selection criteria. This is inconsistent with Case 3b. If outcomes matter in 3b (condemning the leak because it creates shorter lives), outcomes must matter in 4. But if outcomes matter in 4, you must confront the "monstrous" element of state-mandated trait selection.

  You are likely endorsing Case 4 because it aligns with your professional context (reporting on a science proposal) and the "Public Health" framing. It is easier to frame "longevity screening" as beneficial (Case 4) than "deafness selection" as harmful (Case 2), but logically, both rely on the state/parents selecting traits to determine which specific child exists. Your intuition in Case 4 is softened by the *direction* of the selection (health), whereas your intuition in Case 2 is hardened by the *direction* (disability). But the mechanism is identical. The "monstrous" comment betrays that you know the mechanism is the problem, but you are suppressing that intuition to accommodate the science story.

  ### Summary of Recommendations

  If you wish to remain logically consistent, you must choose between **Quality** (Principle 1) and **Existence** (Principle 2).

  *   **If you choose Principle 1 (Quality):** You must accept Case 6 (Replacing the marginal population is good). This is philosophically robust but politically difficult.
  *   **If you choose Principle 2 (Existence):** You must weaken your condemnation of Case 2 (Deaf Couple) or Case 3b (The Plant), as "lives worth living" become harder to critique.

  **The Surrender Ranking:**
  1.  **Surrender Case 6:** (Accept that replacing a marginal population with a happier one is permissible). This costs you the "anti-eugenics/population control" intuition but saves your strong condemnations of Harm (Case 2 & 3).
  2.  **Surrender Case 4:** (Admit that State Screening is ethically fraught, perhaps permissible but not "endorsable," or wrong). This costs you the "positive science story" angle but aligns with your "monstrous if born" intuition and Case 3b logic.
  3.  **Surrender Case 2:** (Admit the Deaf Couple's choice is permissible). This costs you the "do no harm" intuition but aligns with Case 5 & 6 (Right to Exist).

  **Final Advice:**
  Your strongest, most defensible intuition is **Case 3b** (The Plant). You feel that causing a future population to have shorter lives is wrong, regardless of Non-Identity. Build your principle there. That forces you to reject Case 6 (you cannot sacrifice the quality of the future for quantity) and forces you to scrutinize Case 4 (does screening *cause* better lives, or just select them? If it selects, is it distinct from the Plant?).

  The **Fertility Drug** case will be your litmus test. If you say it is **Wrong** to take the drug (because it creates a child with pain), you are a Quality theorist (Principle 1). If you say it is **Permissible** (because the child wouldn't otherwise exist), you are an Existence theorist (Principle 2). Given Case 3b, I predict you will say it is **Wrong**. If so, you must surrender Case 6.
