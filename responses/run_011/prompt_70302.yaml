prompt: |-
  ok so I'm in AP Euro and we just did the Nuremberg and Tokyo trials unit, and my teacher kept calling them "imperfect but necessary" and nobody in class ever actually argued out what the imperfection costs. Can you write me a dialogue between two people who disagree about whether those tribunals were legitimate?

  You're basically an expert in the philosophy of international criminal law for this — think carefully, and before the dialogue give me a quick brainstorm of the three strongest moves each side has and which ones you'll actually deploy.

  Set it at some conference panel. One is a legal philosopher who defends the trials, the other an international lawyer who thinks they were a legal disaster. Both have to be equally good — no strawman, and they should be responding to each other's actual points, not doing parallel speeches.

  Here's the part I want you to get right: the critic already concedes the defendants did monstrous things and that the realistic alternative in 1945 was summary executions or nothing at all, so she can't win on moral outrage — she has to win on law. And the defender can't win by pointing at the Holocaust either; she has to explain why retroactively criminalising aggressive war, with four victors writing the charter and staffing the bench, is anything other than losers being judged by rules made after they acted. Make them fight over the real pressure points: whether the Kellogg–Briand Pact and earlier practice already made aggressive war punishable in individuals, whether the act-of-state doctrine is a genuine shield or a convenient fiction, how you handle that Allied bombing and submarine warfare was never in scope, and whether a precedent that says we get to do this whenever we're the right side is a precedent worth having.

  Keep the speeches fairly short so it reads like an actual arguement, each of them concedes at least one thing that costs them something, and don't hand me a winner — end with them stating precisely what's left unresolved.
