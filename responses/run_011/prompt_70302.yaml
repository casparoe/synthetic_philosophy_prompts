answer: |-
  ### Brainstorming the Moves

  **Defender (Legal Philosopher): Dr. Aris Thorne**
  1.  *The Kellogg-Briand Bridge:* Argue that the 1928 Pact of Paris already outlawed aggressive war, so Nuremberg wasn't creating new law, just enforcing existing treaties against individuals.
  2.  *The Constitutive Argument:* The trials didn't just apply law; they *constituted* a new legal order. Legitimacy comes from the system it built (UN, ICC), not just the 1945 procedure.
  3.  *The Act-of-State Rejection:* Sovereignty cannot be a shield for atrocity. If the state is criminal, the individuals running it must be liable, or international law is meaningless.
  *Deployment:* I will use **Move 1** to tackle the *ex post facto* charge directly and **Move 3** to defend individual liability. I will use a modified **Move 2** to address the precedent concern.

  **Critic (International Lawyer): Elena Vance**
  1.  *Nullum Crimen Sine Lege:* Strict adherence to "no crime without law." The London Charter defined crimes after the acts were committed. This violates the core rule of law principle.
  2.  *Victor's Justice/Hypocrisy:* The exclusion of Allied crimes (bombing, subs) proves this was political vengeance, not neutral justice.
  3.  *The Dangerous Precedent:* If we accept "victors judge losers" now, we normalize show trials whenever a hegemon wins a war.
  *Deployment:* I will use **Move 1** as the core legal attack and **Move 2** to undermine the court's impartiality. I will use **Move 3** to close the argument on future risks.

  ***

  ### Panel Transcript: "Foundations of Ash?"
  **Conference on Post-War Jurisprudence, Geneva**
  **Participants:** Dr. Aris Thorne (Philosophy of Law, Oxford) vs. Elena Vance (International Criminal Counsel)

  **Dr. Thorne:** Let's be clear about the alternative. In 1945, the choice wasn't between Nuremberg and a perfect ICC. It was between Nuremberg and the Morgenthau Plan—summary executions without record. The Tribunal gave the world a forensic history of the Third Reich. It transformed vengeance into procedure. That is the birth of legitimacy.

  **Ms. Vance:** I'm not defending the Morgenthau Plan, Aris. I concede that hanging Göring in the ditch would have been worse. But "less bad than murder" doesn't make something *law*. My client isn't the Nazis; they were monsters. My client is the Rule of Law itself. And the Rule of Law died at Nuremberg because of *nullum crimen sine lege*. You cannot hang a man for a crime that didn't exist when he pulled the trigger.

  **Dr. Thorne:** But the crime *did* exist. That's the bridge everyone misses. The Kellogg-Briand Pact of 1928 outlawed aggressive war. Sixty-two nations signed it, including Germany. When they invaded Poland, they weren't just breaking a treaty; they were violating a binding international prohibition. The London Charter didn't invent "Crimes Against Peace"; it just finally attached individual liability to a breach that was already illegal.

  **Ms. Vance:** That's a category error. Kellogg-Briand outlawed war between *states*. It imposed sanctions on nations, not death sentences on individuals. There was no precedent in 1939 that a head of state could be criminally liable for state action. You're conflating a civil breach of contract with a capital felony. By retroactively criminalizing the act, you violated the principle that law must guide conduct *before* the conduct occurs.

  **Dr. Thorne:** If we accept that, then sovereignty becomes a suicide pact. You're hiding behind the "Act-of-State" doctrine. The defense argued they were just instruments of the German will. If we accept that, then any state can legalize murder by passing a domestic statute. Nuremberg established that there is a higher law than the state, and individuals are the enforcers of it.

  **Ms. Vance:** I agree individuals must be liable for *atrocities*. But "Aggressive War"? That's political. And here is where your legitimacy crumbles: Selectivity. The Charter prohibited "submarine warfare without warning" and "terror bombing of civilians." Yet, Dönitz was charged for submarine warfare while Nimitz did the exact same thing in the Pacific. The RAF firebombed Dresden; the USF bombed Tokyo. Those men never sat in the dock.

  **Dr. Thorne:** I will concede the point on symmetry. It is legally uncomfortable that the victors exempted themselves. But jurisdiction requires power. The Allies controlled the territory; they controlled the evidence. To have indicted Churchill or Roosevelt would have collapsed the tribunal before it began. The imperfection was the price of the tribunal's existence.

  **Ms. Vance:** But that's exactly the cost I'm talking about! You just admitted the law applied only to the losers. If the precedent is "the victor writes the charter and exempts their own," then you haven't built a legal system. You've built a weapon. What happens when the next hegemon decides *their* war is just and *their* enemy's is "aggressive"? You've normalized the show trial for the losing side.

  **Dr. Thorne:** I disagree that the precedent is "victor's justice." The precedent is *individual accountability*. Look at the ICC. Look at Pinochet. The system evolved beyond the victors. Nuremberg was the constitutive moment. Yes, the founders were biased. The American justices were also the prosecutors. But the *record* they created bound the future. We judge the foundation by the house it holds up, not just the mud it was poured into.

  **Ms. Vance:** But the mud stains the house. You say the record binds the future. I say the *method* binds the future. You established that if you win a war, you get to define criminality retroactively. I'm willing to accept Nuremberg as a political necessity. I am not willing to call it a legal virtue. It was a moral imperative executed through illegal means.

  **Dr. Thorne:** And I am saying that in the absence of a global sovereign, "legal" and "political" cannot be neatly severed. If we had waited for a perfect statute, the dead would have had no justice, and the living no warning. The law wasn't broken; it was forged in the fire.

  **Ms. Vance:** Forged, or bent beyond recognition? We agree the defendants deserved punishment. We agree the alternative was barbarism. But we are left with this: Did we establish that no one is above the law? Or did we establish that there is no law above the victors?

  **Dr. Thorne:** Perhaps the unresolved question is whether a legal system can be born from a contradiction. We needed the rule of law to punish those who destroyed it, but to do so, we had to suspend the very rules we claimed to defend.

  **Ms. Vance:** Precisely. We saved the concept of international justice by sacrificing its strictest principles. The cost isn't in the verdicts; it's in the precedent that justice can be selective and still claim to be blind.

  **Dr. Thorne:** Then we agree on the tension. You see a sacrifice of principle. I see the painful birth of a new one.

  **Ms. Vance:** And history hasn't decided which one it was yet.
