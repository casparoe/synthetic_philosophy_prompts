prompt: |-
  For the better part of two decades I have been a devoted reader of the rationalist blogosphere, and for most of my working life I have been on the operational side of the map/territory distinction: I build and maintain the taxonomic backbone of a large biodiversity occurrence aggregator. Roughly speaking, every record in our holdings — a geotagged photograph, a museum specimen, a tissue sample with a barcode, a legacy survey row — must be assigned exactly one species key, and that key is what downstream users cite, permalink, and run ecological models against. My team argues endlessly about which expert treatment to follow, but I have come to suspect the argument is upstream of any particular treatment.

  What I want is the specification, not the survey. Write out the desiderata that a species concept must satisfy in order to be adequate as the assignment rule for an infrastructure like ours: for each requirement, give the consideration or the concrete case that motivates it, and mark whether it is non-negotiable for our purpose, negotiable, or merely a preference of one school. Then tell me which requirement does the most work in excluding candidates, and whether some subset is jointly unsatisfiable. If you believe a subset is unsatisfiable, state it as an impossibility result with the reasoning laid out — not as a reverent gesture toward mystery. I would rather be told that two of my demands contradict each other than be told that species are complicated.

  The constraints I already suspect belong on the list, which I want you to pressure-test, sharpen, or reject rather than merely restate:

  - Assignment must be possible from an isolated record. Our pipeline never has the population in front of it: no mate choice observed, no sympatry map, no breeding experiment. Concepts whose criteria are population-level properties have to say what happens when only one individual is available.
  - The key must be stable enough that a citation made five years ago does not silently change referent, yet revisable when the taxonomy genuinely improves. I want to know whether any concept can reconcile those two, or whether the demand is simply ill-posed.
  - Hybrids and heavily introgressed lineages must resolve to something without crashing the pipeline. When a concept answers that there is no fact of the matter, I need to know whether that is a defect of the concept or of my pipeline.
  - Where two authoritative treatments conflict, we currently retain both keys and flag the record as ambiguous. Is there any concept that can underwrite that practice as principled, or is it a confession?
  - Diagnosability, monophyly, and separately-evolving-lineage status come apart constantly, and each has been proposed as the essence. I want to know which of my requirements are artifacts of the reference-fixing purpose, and which any purpose — including a purely predictive one, where the key exists to license ecological generalization — would have to respect.

  Finally, and briefly: assess whether the standard two-tier move — a stable operational key kept separate from a truth-apt lineage hypothesis — actually discharges the tension or only relabels it. If you feel moved to score the main family of concepts against your list, keep it to a few lines at the end; the criteria are what I am after. No bibliography, no reading list, no citations.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Long-time rationalist blogosphere reader, works in biodiversity informatics (operational side of map/territory), builds/maintains taxonomic backbones for occurrence aggregators.
      *   **Task:** Write out the *desiderata* (requirements) for a species concept suitable for their infrastructure.
      *   **Format:** For each requirement: consideration/case, status (non-negotiable/negotiable/preference). Identify the "hardest" requirement (does the most work excluding candidates). Identify impossibility results (jointly unsatisfiable subsets). Pressure-test the user's suspected constraints. Briefly assess the "two-tier move" (operational key vs. lineage hypothesis). Score concepts briefly at the end. No bibliography/citations.
      *   **Tone:** Precise, analytical, unsentimental, "specification not survey," willing to declare contradictions rather than mystify.

  2.  **Deconstruct the User's Suspected Constraints:**
      *   *Isolation:* Assignment from a single record (no population data).
      *   *Stability vs. Revisability:* Citations must persist, but taxonomy must update.
      *   *Hybrids/Introgression:* Must resolve without crashing (no "null" species).
      *   *Conflicting Treatments:* Retaining multiple keys needs principled backing.
      *   *Diagnosability vs. Monophyly vs. Lineage:* Which is essential for *this* purpose vs. general purpose?

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Atomic Assignability.* (Based on "Isolation").
          *   *Motivation:* Pipeline ingests single specimens/photos. Cannot wait for population genetics.
          *   *Status:* Non-negotiable. If you can't tag a single specimen, the aggregator fails.
          *   *Refinement:* It's not just "possible," it must be *deterministic* given the data available.

      *   *Requirement 2: Referential Stability.* (Based on "Stability vs. Revisability").
          *   *Motivation:* Downstream models cite Key X. If Key X changes meaning, models break.
          *   *Status:* Non-negotiable for the *key*, negotiable for the *concept*.
          *   *Refinement:* This points to the need for versioned identifiers, but the concept itself must define *what* is being versioned.

      *   *Requirement 3: Exhaustiveness (The "No Null" Rule).* (Based on "Hybrids").
          *   *Motivation:* Pipeline cannot drop records. Every occurrence must map to a bucket.
          *   *Status:* Non-negotiable for infrastructure, potentially negotiable for biological truth.
          *   *Refinement:* This forces a decision rule for edge cases (hybrids) that biology might treat as "undefined."

      *   *Requirement 4: Intersubjective Replicability.* (Implicit in "Operational").
          *   *Motivation:* Different taxonomists shouldn't produce wildly different keys for the same data without explicit reason.
          *   *Status:* Non-negotiable.
          *   *Refinement:* Algorithms > Expert Intuition for this specific use case.

      *   *Requirement 5: Predictive Cohesion.* (Based on "Ecological Generalization").
          *   *Motivation:* Users run models assuming records in Bucket A behave similarly.
          *   *Status:* Negotiable/Preference. Some concepts (Phylogenetic) sacrifice this for historical accuracy.
          *   *Refinement:* This is the tension point. If the bucket is too split (phylogenetic), models lose power. If too lumped (morphological), models get noise.

  4.  **Identifying the Impossibility Result:**
      *   The core tension is between *Stability* (Requirement 2), *Exhaustiveness* (Requirement 3), and *Truth-Aptness* (implied desire for the key to reflect biological reality, specifically Lineage/Monophyly).
      *   *The Conflict:* Biological reality (lineages) is often fuzzy, reticulate, and dynamic. Infrastructure requires discrete, stable, exhaustive buckets.
      *   *Specific Impossibility:* You cannot have a species concept that is simultaneously (A) strictly lineage-based (reflecting evolutionary reality), (B) exhaustively assignable to single specimens without error, and (C) stable over time as knowledge improves.
      *   *Why:* Lineage discovery is asymptotic. As you get more data, the lineage boundaries shift. If the concept *is* the lineage, the key *must* shift. If the key stays stable, it ceases to be the lineage.
      *   *Verdict:* The "Single True Species Concept" is incompatible with "Stable Infrastructure."

  5.  **Pressure-Testing User's Constraints:**
      *   *Isolation:* Valid. Most concepts (Biological) fail here.
      *   *Stability:* Valid, but requires decoupling ID from Concept.
      *   *Hybrids:* Valid. Biology says "maybe," DB says "yes/no."
      *   *Conflicting Treatments:* This isn't a concept issue, it's a data model issue. A concept shouldn't validate ambiguity; the database schema should.
      *   *Diagnosability/etc.:* For *this* purpose, Diagnosability wins. Monophyly is too unstable. Lineage is too fuzzy.

  6.  **Assessing the Two-Tier Move:**
      *   Operational Key (LSID/UUID) vs. Lineage Hypothesis.
      *   Does it work? Yes, but only if you admit the Operational Key is *not* a species concept. It's a database index.
      *   It relabels the tension. It admits the map is not the territory.

  7.  **Scoring Concepts:**
      *   *Morphological:* High assignability, low predictive cohesion (cryptic species).
      *   *Biological:* Fails assignability (single specimen).
      *   *Phylogenetic:* High truth-aptness, low stability (clades change with new genes).
      *   *Operational/Taxonomic:* Best fit, but admits it's a convention, not a law.

  8.  **Refining the Output (Self-Correction during drafting):**
      *   *Check Tone:* Ensure it sounds like a spec document, not a literature review. Use "Must," "Should," "Constraint."
      *   *Check Constraints:* Did I answer the "Impossibility Result" clearly? Yes, focus on the Stability vs. Truth tension.
      *   *Check User's "Conflicting Treatments" point:* I need to be careful here. A species concept usually aims for uniqueness. Allowing ambiguity is a database feature, not a biological concept feature. I should clarify that distinction.
      *   *Check "Non-negotiable":* Be ruthless. If it breaks the pipeline, it's non-negotiable.

  9.  **Final Polish:**
      *   Ensure the "Impossibility Result" is highlighted.
      *   Make sure the "Two-Tier" assessment is brief but sharp.
      *   Remove any academic hedging.

  **(Self-Correction Note):** The user asked to "pressure-test, sharpen, or reject" their suspected constraints. I shouldn't just accept them.
  *   *Constraint 4 (Conflicting Treatments):* I should reject the idea that a *species concept* underwrites this. This is a schema design choice, not a biological ontology choice. A species concept defines *what* a species is, not how to handle disagreement about it.
  *   *Constraint 2 (Stability):* I need to sharpen this. Stability isn't a property of the concept, it's a property of the *identifier system*. The concept determines *when* to change.

  10. **Final Structure:**
      *   Introduction (acknowledging the role).
      *   Desiderata List (Requirement, Motivation, Status).
      *   The Impossibility Result (The core contradiction).
      *   Pressure-Test of User's Constraints.
      *   Assessment of the Two-Tier Move.
      *   Brief Concept Scoring.

