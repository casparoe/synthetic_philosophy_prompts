answer: |-
  ### Desiderata for an Infrastructure-Grade Species Concept

  You are building a reference index, not a theory of nature. The requirements below reflect the constraints of a deterministic pipeline ingesting singular, noisy observations.

  **1. Atomic Assignability**
  *   **Specification:** The concept must provide a decision rule that assigns a single specimen (or occurrence record) to a species key without requiring data from other conspecifics, knowledge of geographic range, or observation of reproductive behavior.
  *   **Motivation:** Your pipeline ingests isolated records (a photo, a barcode). If the definition requires population-level data (e.g., "interbreeding community"), the rule cannot execute on the input provided.
  *   **Status:** **Non-negotiable.** Failure here halts ingestion.

  **2. Exhaustiveness (The "No Null" Constraint)**
  *   **Specification:** For any valid biological organism represented in the holdings, the concept must yield a positive assignment to a key. It cannot return "undefined," "hybrid," or "indeterminate" as a terminal state.
  *   **Motivation:** Downstream models (SDMs, diversity counts) require categorical inputs. A record that cannot be assigned is data loss. Hybrids and introgressed individuals exist physically and must map to a bucket, even if that bucket is a proxy.
  *   **Status:** **Non-negotiable.** Failure here corrupts statistical denominators.

  **3. Operational Replicability**
  *   **Specification:** Given the same evidence (e.g., sequence, morphology), independent operators (or algorithms) must derive the same assignment. The criteria must be checkable against the record's metadata and attached evidence.
  *   **Motivation:** If assignment relies on unstated expert intuition ("I know it when I see it"), the backbone becomes non-auditable and non-reproducible.
  *   **Status:** **Non-negotiable.** Failure here destroys trust in the aggregator.

  **4. Referential Stability**
  *   **Specification:** A key issued at time *t* must refer to the same extension (set of organisms) at time *t+5*, unless an explicit versioning event occurs. The concept must define conditions for splitting/lumping that are distinct from mere changes in opinion.
  *   **Motivation:** Citations and permalinks must persist. If the meaning of `Key_123` drifts silently, longitudinal studies break.
  *   **Status:** **Non-negotiable** for the *identifier system*, but places a heavy burden on the *concept* to define identity conditions clearly.

  **5. Predictive Cohesion**
  *   **Specification:** Organisms assigned to the same key should share relevant ecological traits (niche, physiology, behavior) with higher probability than organisms assigned to different keys.
  *   **Motivation:** Users run ecological models assuming functional similarity within keys. If the concept groups organisms that are historically related but ecologically divergent (or vice versa), the key loses predictive utility.
  *   **Status:** **Negotiable/Preference.** This is where biological truth often conflicts with database utility. Some concepts sacrifice this for historical accuracy.

  **6. Conflict Accommodation**
  *   **Specification:** The concept must allow for the simultaneous validity of conflicting assignments under different authoritative treatments without asserting one is "false."
  *   **Motivation:** You currently flag ambiguous records. You want to know if a concept can principledly support this.
  *   **Status:** **Reject.** This is not a property of a species concept; it is a property of your data model. A species concept defines what a species *is*; it does not define how to handle disagreement about what a species is. Demanding this of the concept conflates ontology with governance.

  ---

  ### The Impossibility Result

  **The Trilemma of Stability, Truth, and Assignability.**

  You cannot satisfy **Atomic Assignability**, **Referential Stability**, and **Lineage Truth** simultaneously.

  1.  **Lineage Truth** (e.g., Phylogenetic or General Lineage Concept) dictates that species boundaries shift as new data (genomes, fossils) reveals previously hidden branching events or introgression. Truth is asymptotic; it changes as resolution improves.
  2.  **Referential Stability** dictates that the extension of a key remains fixed to preserve citation integrity.
  3.  **Atomic Assignability** dictates that you must decide *now*, on limited data, without waiting for the lineage history to be fully resolved.

  **Reasoning:**
  If you bind your key to **Lineage Truth**, every new phylogenetic paper potentially invalidates previous assignments (violating Stability).
  If you bind your key to **Stability**, you freeze a hypothesis that biology will inevitably outgrow (violating Truth).
  If you bind your key to **Atomic Assignability** using fixed traits (e.g., morphology), you will inevitably misclassify cryptic species or polymorphic lineages (violating Truth).

  **Conclusion:** There is no species concept that is both a stable database index and a true reflection of evolutionary history. You must choose which leg of the triangle to break. For your infrastructure, **Lineage Truth** is the leg that must break. You are building a map, not the territory.

  ---

  ### Pressure-Test of Your Suspected Constraints

  *   **Assignment from Isolation:** **Valid.** This eliminates the Biological Species Concept (BSC) immediately. BSC is ontologically robust for sexually reproducing taxa but operationally useless for your pipeline.
  *   **Stability vs. Revisability:** **Ill-posed as a concept requirement.** Stability is achieved via *versioned identifiers*, not biological definitions. The concept should define *when* a revision is mandatory (e.g., "if monophyly is disproven"), but the infrastructure must handle the versioning. Do not ask the biology to solve the database problem.
  *   **Hybrids/Introgression:** **Valid constraint, wrong expectation.** No biological concept resolves this without arbitrariness. The "defect" is in the expectation that nature respects your discrete buckets. The pipeline must force a choice (e.g., "assign to maternal lineage" or "assign to dominant genome"), acknowledging this is an administrative decision, not a biological fact.
  *   **Conflicting Treatments:** **Rejected (see Desideratum 6).** A concept cannot underwrite ambiguity. Ambiguity is epistemic (about our knowledge), not ontological (about the species). Your practice of retaining both keys is a confession of epistemic uncertainty, which is principled, but it is not supported by the *species concept* itself.
  *   **Diagnosability vs. Monophyly:** **Diagnosability wins for your purpose.** Monophyly is unstable (changes with new samples) and often unassignable from a single record. Diagnosability (fixed character differences) is checkable on a single specimen. For an aggregator, **Diagnosability** is the only trait that satisfies Atomic Assignability and Operational Replicability.

  ---

  ### Assessment of the Two-Tier Move

  **Does it discharge the tension?**
  Yes, but only if you stop calling the operational key a "species."

  If Tier 1 is a **Stable Operational Unit** (e.g., "Taxon Concept A, v4") and Tier 2 is a **Lineage Hypothesis** (e.g., "Evolutionary Significant Unit"), the tension is discharged by admitting that Tier 1 is a *convention* and Tier 2 is a *claim*.

  **The Risk:**
  If you claim Tier 1 *is* the species, you relabel the tension. If you admit Tier 1 is merely a "naming bucket" that *approximates* species for the sake of indexing, the system works. The failure mode occurs when users treat the stable key as biological truth. You must document that the key is a *reference label*, not a *natural kind*.

  ---

  ### Concept Scoring (Against Desiderata)

  *   **Biological Species Concept:** Fails **Atomic Assignability**. Useless for your pipeline.
  *   **Phylogenetic Species Concept:** Fails **Referential Stability**. Clades change with every new sequence. High **Predictive Cohesion** risk (splits may be ecologically irrelevant).
  *   **Morphological Species Concept:** Passes **Atomic Assignability** and **Stability**. Fails **Predictive Cohesion** (cryptic species) and **Lineage Truth**. Best fit for legacy data.
  *   **Operational Taxonomic Unit (OTU) / Cluster-based:** Passes **Assignability** and **Exhaustiveness**. Explicitly abandons **Lineage Truth**. Most honest fit for your infrastructure.

  **Recommendation:** Adopt a **Diagnosable Unit** concept (fixed characters/markers) for the backbone, explicitly versioned. Treat "Species" as a label applied to these units by external authorities, not as a property of the units themselves. This isolates the biological volatility from the database stability.
