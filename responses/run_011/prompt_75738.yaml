      To make a strong seminar point, I should argue he prefers the **Militia**, but with the caveat that the *proposal* of the Algorithmic model proves the **People are Dead**.
      Actually, the strongest philosophical stance is that **Algorithmic Neutrality is incompatible with the Social Contract**, so he must prefer the **Militia**. I will defend the Militia as the only viable option for a *Republic*, while acknowledging the "People Dead" diagnosis is likely his assessment of the *motivation* for the Algorithm.
