      *   **Key Concept:** "Menu-invariance" (choice depends only on the option, not the presence/absence of other options).
      *   **Concrete Case:** Robotics team ordering parts from an online supplier. Three people, same needs/budget, different selections based on UI/layout/add-ons.
      *   **Required Objections to Address:**
          1.  "A genuinely rational maximizer is immune to context effects/decoys by definition." (Why this doesn't kill the thesis).
          2.  "Aspiration levels adjust (Simon), reintroducing menu-sensitivity." (What remains of the thesis).
      *   **Constraints:** Do not rely on fatigue/arithmetic errors (structural argument, not computational cost). Define technical terms. State assumptions. Narrow thesis if necessary. No bibliography/references. Word count: 1,300 - 1,600 words. Close with a paragraph identifying the argument's most exposed point.
      *   **Structure:** Brief brainstorming section (2-3 paragraphs) -> The Argument -> Closing vulnerability paragraph.

  2.  **Brainstorming & Strategy:**
      *   *Goal:* Defend satisficing as structurally superior to maximizing in specific environments (manipulated menus), not just computationally cheaper.
      *   *Line of Attack 1 (The Manipulation Argument):* Maximizers are vulnerable to "menu engineering." If a principal (the website) controls the menu, they can exploit the maximizer's dependence on relative ranking (decoy effect, attraction effect). A satisficer with a fixed threshold ignores the decoy because the decoy doesn't meet the threshold or doesn't change the status of the option that does. This is the core "menu-invariance" argument.
      *   *Line of Attack 2 (The Commitment Argument):* Pre-commitment to a threshold acts as a shield against dynamic inconsistency or preference reversal induced by framing. Even if you *could* calculate the EU, the calculation itself requires comparing options *within* the menu, making the output sensitive to the menu's composition.
      *   *Line of Attack 3 (The "Ideal Maximizers" Objection):* The prompt asks to address the claim that "true" maximizers aren't fooled. I need to argue that "true" maximization requires a stable preference ordering over *all possible goods*, not just those presented. But in reality, agents often construct preferences *from* the menu (constructive preference). If preferences are constructed from the menu, maximization is inherently menu-dependent. Therefore, the "ideal maximizer" is a phantom in this context.
      *   *Line of Attack 4 (The Aspiration Adjustment Objection):* Simon said aspirations adjust. If they adjust based on the menu (e.g., seeing high prices raises my aspiration for quality), then satisficing loses menu-invariance. I need to narrow the thesis: The advantage holds *conditional on the pre-commitment being binding* for the duration of the choice episode, even if aspirations adjust over longer time horizons. Or, argue that adjustment rules can be made menu-independent (based on past experience, not current display).
      *   *Assessment:* The strongest line is the manipulation/exploitation argument. If the environment is adversarial (or simply non-neutral), menu-invariance is a protective feature. The "ideal maximizer" objection is weak because it assumes preferences exist independently of the menu, which is controversial in behavioral economics/philosophy. I will argue that even if preferences exist, the *process* of maximization requires comparing available options, making it susceptible to framing effects that alter perceived utility.
      *   *Narrowing:* I must narrow the thesis to apply specifically to environments where the menu is controlled by a strategic or non-neutral principal (like a website designer) and where the agent's utility function is not perfectly pre-specified over all logical possibilities but relies on contextual evaluation.

  3.  **Drafting - Section by Section:**

      *   **Brainstorming:** Acknowledge the tension. Standard theory says maximizing is normatively superior. Bounded rationality usually says satisficing is descriptively accurate but normatively inferior (second-best). I need to flip this.
