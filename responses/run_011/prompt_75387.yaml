          *   *Tempting but weak:* Cognitive load. The prompt forbids this.
          *   *Tricky:* The definition of rationality. I need to distinguish between *procedural* rationality (following a rule) and *substantive* rationality (outcome quality).
      *   **The Argument:**
          *   Define Menu-Invariance clearly (Chernoff condition / Property Alpha).
          *   Set up the Robotics Case.
          *   Address Objection 1 (Ideal Maximizers): Argue that "context effects" aren't just errors; they reveal that utility is often constructed relative to the set. Even if not, the *search cost* of verifying maximization in a manipulated set is high, but more importantly, the *comparison* itself shifts weights. Actually, better argument: The maximizer *must* compare $x$ to $y$. If $z$ (a decoy) is added, it changes the perceived value of $x$ relative to $y$ via contrast effects. A fixed threshold ignores $z$ unless $z$ meets the threshold.
          *   Address Objection 2 (Adjusting Aspirations): Distinguish between *inter-choice* adjustment (learning over time) and *intra-choice* stability. The thesis holds for the single choice episode.
          *   Structural Advantage: Immunity to strategic menu design.
      *   **Closing Vulnerability:** The assumption that the aspiration level is set *correctly* or *optimally* beforehand. If the threshold is wildy off, menu-invariance just guarantees a consistently bad choice.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check Word Count:* Need to be concise but thorough. 1300-1600 is a decent chunk.
