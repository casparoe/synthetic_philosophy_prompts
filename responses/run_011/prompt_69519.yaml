          *   **Crucial:** State confidence levels on substantive claims and identify the most likely point of error (analytic category importation).

  2.  **Deconstruct the Philosophical Challenge:**

      *   *The Core Tension:* Analytic students naturally reduce testimony to inference (Humean reductionism: I believe you because I infer you are reliable based on past experience). Nyāya argues testimony (*śabda*) is a *sui generis* source of knowledge (*pramāṇa*), irreducible to inference (*anumāna*).
      *   *The Pedagogical Goal:* Make the irreducibility claim plausible without relying on religious authority (Vedas/priests), which triggered the "religious studies" complaint.
      *   *The "Pramāṇa" Concept:* Students think "evidence." Nyāya means "instrument of valid cognition" (causal mechanism). This needs to be established first.
      *   *The Example:* Needs to be mundane, secular, and immediate. The instructor's medical diagnosis story is perfect personally, but for class, it needs to be something where the *content* is known only through the speech, not the speaker's psychology.

  3.  **Drafting the Session Plan (Session 1: Foundations):**

      *   *Goal:* Define *pramāṇa* and establish the debate structure (counting the *pramāṇas*).
