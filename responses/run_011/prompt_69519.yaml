          *   Map specific misconceptions and when to head them off.
          *   Handle the Hume-style reduction without collapsing into the instructor's usual deference debate.
          *   Provide one final diagnostic question.
          *   Advise on what to cut (validity extrinsic, sense-contact, *arthāpatti/anupalabdhi*).
