      *   *Memory/Doubt:* Head off in Session 1, minute 25 (When defining the list).
      *   *Hume/Deference:* Handle in Session 2, minute 30. Distinguish *global reductionism* (Hume) from *local defaultism* (Nyāya).

  7.  **What to Cut:**

      *   *Extrinsic Validity (Parataḥ Prāmāṇya):* Cut. It's metaphysically heavy and not needed for the irreducibility claim.
      *   *Sense-Object Contact (Sannikarṣa):* Cut. Too technical/psychological.
      *   *Postulation/Non-apprehension (Arthāpatti/Anupalabdhi):* Cut. Mīmāṃsā baggage, distracts from the core 4 (Perception, Inference, Comparison, Testimony). Focus on Testimony vs. Inference.
      *   *Load-bearing check:* Are these load-bearing? No. The core is the definition of *pramāṇa* and the distinction between *śabda* and *anumāna*.

  8.  **The Final Question:**

      *   Needs to separate memorization from understanding irreducibility.
      *   *Bad:* "How many pramāṇas does Nyāya accept?"
      *   *Good:* "If you discover the speaker was lying, did you *know* the proposition when they said it?" (Tests the causal link).
      *   *Better:* "If testimony were inference, what would the middle term be, and why does Nyāya say you don't need it?"
      *   *Best:* **"In the case of the specialist's diagnosis, if you cannot independently verify the doctor's reliability before accepting the diagnosis, does Nyāya say you are irrational to believe? Why?"** (Tests the default vs. inference distinction).
      *   *Refinement:* Needs to be sharper. **"If testimony is just inference from the speaker's reliability, what knowledge do you lose when the speaker is anonymous but proven competent?"**
      *   *Let's go with:* **"If I tell you 'There is a fire in the next room,' and you believe me, Nyāya asks: Did you infer my reliability, or did the words themselves generate the knowledge? What difference does it make to the *causal history* of your belief?"**

  9.  **Confidence & Error Check:**

      *   *Confidence:* High on the pedagogical structure and the broad strokes of Nyāya epistemology (Gangesa/Uddyotakara general positions).
      *   *Risk:* The specific interpretation of *śabda* as *irreducible* vs. *default justified*. Some modern interpreters (Matilal) bridge this with analytic testimony. The risk is importing the "Testimony as Basic" (Burge/Reid) view too cleanly onto Nyāya without acknowledging the *competence* requirement (*āptavākya*). Nyāya *does* require the speaker to be reliable (*āpta*), but the *knowledge mechanism* isn't an inference *about* that reliability. This is the subtle point where analytic categories (justification vs. causal generation) might blur.
      *   *Most likely error:* Equating Nyāya's *śabda* too closely with contemporary "Anti-Reductionism" (Burge). Nyāya requires the speaker to be an *āpta* (competent/truthful), which looks like a reliability condition. The distinction is whether the *hearer* must *infer* that reliability. I need to be careful not to say Nyāya ignores reliability, but that the *cognition* doesn't arise *via* an inference of reliability.

