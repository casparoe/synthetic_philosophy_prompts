answer: |-
  Here is a pedagogical plan designed to secure the philosophical stakes of the *pramāṇa* theory while avoiding the pitfalls of your previous iterations.

  ### Session 1: The Instrument, Not the Evidence
  **Goal:** Establish *pramāṇa* as a causal mechanism of knowledge, not a piece of evidence, and justify the "counting" debate.

  **00:00–05:00 | The Soteriology Trap (Head off Misconception: "This is theology, not epistemology")**
  *   **Action:** Open by acknowledging the goal of Nyāya is liberation (*mokṣa*), but insist that for this unit, we treat it as a project in *cognitive architecture*.
  *   **Script:** "The Nyāya philosophers wanted to end suffering. They believed suffering comes from error. To end error, you must map how error happens. That map is epistemology. We are not studying their religion; we are studying their machinery for distinguishing truth from falsehood."
  *   **Why here:** If you wait, the "priest/trust" complaint will solidify. Frame the school as cognitive engineers, not clergy.

  **05:00–20:00 | Defining the *Pramāṇa* (Head off Misconception: "*Pramāṇa* = Evidence")**
  *   **Action:** Define *pramāṇa* strictly as an *instrument* or *cause* of a veridical cognition (*pramā*), not the justification for it.
  *   **Analogy:** Use a visual aid. A pair of glasses is a *pramāṇa* for seeing the text. The text is the object. The seeing is the cognition. The glasses are not "evidence" that the text exists; they are the *means* by which the text is known.
  *   **Dependency:** Students cannot understand why testimony is controversial until they understand that a *pramāṇa* must be a *distinct causal route*. If testimony is just inference, it shares the same causal route as inference and shouldn't get its own number on the list.
  *   **Cut Announcement:** "We are ignoring the complex metaphysics of how senses touch objects (*sannikarṣa*) and the debate on whether validity is intrinsic or extrinsic (*svataḥ/parataḥ*). These are important, but they are about *validating* the instrument, not *identifying* it. We are identifying the tools."

  **20:00–35:00 | The Counting Game (Head off Misconception: "The list is arbitrary")**
  *   **Action:** Present the rival counts not as a menu, but as a dispute over *redundancy*.
      *   **Cārvāka (1):** Only Perception. (Inference is risky; testimony is hearsay).
      *   **Buddhists (2):** Perception and Inference. (Testimony is just inference about the speaker's mind).
      *   **Nyāya (4):** Perception, Inference, Comparison, Testimony.
  *   **Argument:** The number isn't dogma; it's the result of trying to reduce the list. If you can explain Testimony using Inference, the Nyāya number drops to three. The entire unit hinges on whether that reduction succeeds.
  *   **Head off Misconception (Memory/Doubt):** "Why isn't Memory a *pramāṇa*?" Because memory preserves knowledge; it does not *generate* new knowledge of the world. It is a storage device, not a sensor. "Why isn't Doubt?" Because doubt is the *failure* of a *pramāṇa*, not an instrument of success.

  **35:00–50:00 | Setting the Trap for Session 2**
  *   **Action:** Introduce the Humean challenge they will instinctively reach for. "Most of you, trained in modern philosophy, think Testimony is just Inference. You believe a speaker because you infer they are reliable. If Nyāya is right, that description of your mental life is false."
  *   **Homework/Transition:** Ask them to monitor their own mind the next time someone tells them something they cannot check. Do they reason, or do they understand?

  ---

  ### Session 2: The Irreducibility of Speech
  **Goal:** Defend *śabda* (testimony) as a *sui generis* *pramāṇa* using a single, secular example that resists reduction.

  **00:00–10:00 | The Single Example: The Specialist's Diagnosis**
  *   **The Example:** A patient is told by a cardiologist, "You have a specific arrhythmia."
  *   **What it Must Have:** **Inaccessible Content.** The patient cannot perceive the arrhythmia (it requires internal instrumentation they don't have) and cannot infer it from statistics (as you noted, the stats don't yield the specific diagnosis).
  *   **What it Must Lack:** **Antecedent Reliability Data.** At the moment of the utterance, the patient has no time to check the doctor's credentials, past success rate, or psychological state. They must grasp the truth of the proposition *from the utterance itself*.
  *   **Why this example:** It secularizes the "Vedic statement." It replaces "Priest" with "Specialist." It mirrors your own experience with your father, giving you authentic footing without making the class about you.

  **10:00–25:00 | The Reductionist Challenge (Head off Misconception: "Testimony is Inference under another name")**
  *   **Action:** Force the Humean reconstruction. Ask students to write down the syllogism they would use to believe the doctor.
      *   *Major Premise:* Doctors are generally reliable.
      *   *Minor Premise:* This person is a doctor.
      *   *Conclusion:* This statement is true.
  *   **The Nyāya Counter:** Nyāya argues this syllogism does not occur in the mind of the hearer at the moment of understanding. The knowledge arises immediately upon understanding the meaning of the words, provided there are no *defeaters* (contradictory evidence).
  *   **Distinction:** Inference requires a *middle term* (the reason). Testimony requires only *semantic competence* and *absence of defeaters*. If you had to infer reliability every time, communication would be too slow to function.

  **25:00–40:00 | Handling the Hume/Deference Debate (Crucial Pivot)**
  *   **Action:** Do not let this slide into your usual analytic seminar on deference.
  *   **Constraint:** In your analytic work, you likely discuss *justification* (do I have a right to believe?). Nyāya is discussing *causal genesis* (how did this cognition arise?).
  *   **Instruction:** "In the analytic tradition, we ask if the belief is *warranted*. Nyāya asks if the belief was *generated* by a distinct causal power. You can argue that testimony is reducible to inference for *justification*, but Nyāya claims it is irreducible for *generation*. The cognition of the diagnosis arrives *before* you have time to evaluate the doctor."
  *   **Why here:** This prevents the session from becoming a generic "Is testimony reliable?" debate. It keeps the focus on the *pramāṇa* taxonomy.

  **40:00–50:00 | Synthesis and Diagnostic Question**
  *   **Action:** Recap the four *pramāṇas*. Reiterate that if the reduction of testimony to inference succeeds, Nyāya collapses into Buddhism (2 *pramāṇas*).
  *   **The Final Question:**
      > "If testimony were merely inference from the speaker's reliability, what specific knowledge would be impossible to acquire the moment the words are understood, before you have time to evaluate the speaker's credentials?"
      *   *Correct Grasp:* The content of the proposition itself (the diagnosis). If it were inference, you would only know "The doctor *believes* I have an arrhythmia," not "I *have* an arrhythmia," until the reliability premise is verified. Nyāya says you know the fact directly from the words.
      *   *Memorization Only:* They will answer with the number of *pramāṇas* or the name of the school.

  ---

  ### What to Cut and Why
  You are correct to suspect these are not load-bearing for your specific goal.

  1.  **Extrinsic Validity (*Parataḥ Prāmāṇya*):** **Cut.** This doctrine explains how we *verify* a *pramāṇa* after the fact. Your goal is to establish the *existence* of the *pramāṇa*. Discussing verification muddies the water between "how I know" and "how I check."
  2.  **Modes of Sense-Object Contact (*Sannikarṣa*):** **Cut.** This is psychological/physical theory. It distracts from the logical distinction between the sources.
  3.  **Postulation (*Arthāpatti*) and Non-Apprehension (*Anupalabdhi*):** **Cut.** These are Mīmāṃsā additions that Nyāya often rejects or subsumes. Including them invites the "catalogue" complaint. Stick to the core four (Perception, Inference, Comparison, Testimony). If pressed, say Comparison is about naming, and Testimony is about facts, but keep the focus on Testimony vs. Inference.

  **Load-Bearing Check:** None of these are load-bearing for the claim that testimony is irreducible. The load-bearing beam is the definition of *pramāṇa* as a *distinct causal instrument*.

  ---

  ### Confidence and Error Statement

  **Confidence Level:**
  *   **Pedagogical Structure:** High Confidence. The sequence (Instrument → Counting → Irreducibility) is logically sound for introducing the material.
  *   **Nyāya Doctrine (General):** High Confidence. The distinction between *śabda* and *anumāna*, and the requirement for the speaker to be an *āpta* (competent/truthful) without the hearer needing to infer that competence, is standard classical Nyāya.
  *   **Analytic Comparison:** Moderate Confidence. Mapping Nyāya *śabda* onto contemporary "Anti-Reductionism" (e.g., Burge or Reid) is common in comparative philosophy, but it is an interpretation.

  **Most Likely Point of Error:**
  I am most likely importing an analytic category at the point where I distinguish **Causal Genesis** from **Justification**.
  *   **The Risk:** Classical Nyāya does not neatly separate "how the belief arises" from "whether the belief is valid" in the way post-Gettier analytic epistemology does. The *pramāṇa* is both the cause and the warrant.
  *   **The Warning:** If you tell students "Nyāya doesn't care about justification, only causation," a specialist might object that *pramāṇa* theory *is* their theory of justification.
  *   **Correction:** Frame it as: "Nyāya treats the *reliable causal origin* as the *justification*. They do not separate the two. In our analytic tradition, we often separate 'how I got the belief' from 'why I'm allowed to keep it.' Nyāya says if the instrument is genuine, you are allowed to keep it."

  **Final Advice:**
  Your personal insight regarding the medical diagnosis is your strongest asset. It validates the Nyāya intuition without validating the "priest" authority. Use that lived experience to anchor the "Specialist's Diagnosis" example. It proves that in high-stakes, low-visibility scenarios, the "Inference to Reliability" model fails descriptively—we act on the word, not the syllogism. That is the live philosophical position.
