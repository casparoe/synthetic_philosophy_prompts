      *   *Selection:* **The Expert Diagnostic Statement.** (e.g., "Your engine has a cracked block" or "You have an arrhythmia"). Let's go with the **Mechanic/Engine** or **Doctor/Diagnosis**. Given the prompt's personal note, the **Doctor/Diagnosis** is the emotional anchor, but to avoid the "priest" vibe, ensure it's framed as *technical expertise*, not moral authority. Let's select: **"There is a leak in the reactor core."** (High stakes, inaccessible to layperson, relies entirely on the report). Actually, let's keep it grounded. **"The train has been cancelled."** No, too easy to verify. **"The chemical is toxic."**
      *   *Decision:* **"The Bridge is Unsafe."** (Standard, clear). Wait, the prompt asks me to identify *the* example. I should choose the one that best fits the *irreducibility* constraint. The standard Nyāya example is often about fire or water, but for testimony, it's about Vedic text or reliable person. To avoid the "priest" issue, use a **Reliable Witness to an Unobservable Event**.
      *   *Revised Decision:* **"There is water in the well."** (Classic). But students might say "I infer he saw water."
      *   *Best for Analytic Students:* **"The meeting is at 3 PM."** (Boring).
      *   *Let's follow the Instructor's intuition:* The Medical Diagnosis. It highlights the failure of statistics (inference) vs. testimony.
      *   *Constraint Check:* "Identify the single example... say what that example must have and must lack."
