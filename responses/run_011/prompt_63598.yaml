answer: |-
  ### Exam Question

  **Policy Scenario: The "Research-Ready" Default**
  A National Health Service proposes a new digital intake protocol for all public hospitals. Under the new system, the default setting for patient electronic health records is changed from "Anonymised Archive" to "Active Research Pool." 

  *   **Mechanism:** Records are automatically shared with pre-vetted private pharmaceutical partners to accelerate drug development for rare diseases.
  *   **Individual Cost:** Patients face a non-zero risk of data re-identification, which could impact future private insurance eligibility. 
  *   **Public Benefit:** Significantly faster clinical trials and lower drug costs for the broader population, specifically aiding those with rare conditions who cannot advocate for themselves.
  *   **Exit Friction:** Patients may opt-out, but only by requesting a physical form from the ward administrator and mailing it within 14 days. Digital opt-out is disabled to "prevent accidental clicks."

  **Essay Task:**
  Critically evaluate the ethical permissibility of the "Research-Ready" default. Specifically, analyze how the shift from a *self-regarding* nudge (standard libertarian paternalism) to an *other-regarding* nudge alters the autonomy objection. Does the fact that the policy benefits third parties weaken the claim that autonomy is violated, or does it sharpen the charge of instrumentalization? Finally, explain why mandating transparency (disclosing the default to patients) might fail to remedy the ethical defect, even if the policy remains in place.

  ***

  ### Model Answer

  The "Research-Ready" default represents a decisive break from the Thaler-Sunstein paradigm. Standard nudges claim to align choice architecture with the nudgee's own long-term interests ("as judged by themselves"). Here, the architecture aligns the individual's inertia with the public's interest, imposing a privacy risk on the patient to secure a societal good. This shift fundamentally transforms the autonomy objection from one of *mistaken welfare* to one of *instrumentalization*.

  In self-regarding nudges, the autonomy objection is often blunted by the claim that the nudge corrects for cognitive bias without removing options. The nudgee is presumed to endorse the outcome upon reflection. In the "Research-Ready" case, this defense collapses. We cannot presume a patient would endorse a privacy risk they do not need to take, merely to help others. Consequently, the autonomy objection sharpens. The patient is no longer being "helped to help themselves"; they are being used as a means to a public end. The friction placed on opting out (the physical form, the mailing delay) is not protecting the patient from their own impulsivity, but protecting the state's data stream from the patient's consent. This is not paternalism; it is a soft coercion for social utility.

  However, arguing that other-regarding nudges are *automatically* more objectionable than self-regarding ones is a simplification. Sometimes, self-regarding nudges mask ideological preferences about how people should live, whereas other-regarding nudges address genuine collective action problems. If the benefit is sufficiently high (e.g., curing a plague), the infringement on autonomy might be justified under a social contract framework where we accept minor burdens for major public goods. The ethical weight depends on the proportionality of the individual cost against the public gain. In this scenario, the risk of insurance discrimination is a significant individual harm, potentially outweighing the diffuse benefit of faster drug development.

  This leads to the question of transparency. A common rebuttal to manipulation charges is that disclosure cures the ethical defect: if the patient knows the default, they can adjust. In the "Research-Ready" case, disclosure fails to repair the autonomy violation for two reasons. First, transparency does not remove the *friction*. Knowing you must mail a form to protect your privacy does not make the burden of doing so any less onerous. The cost of autonomy remains high. Second, and more critically, the policy relies on the *predictability* of inertia. If the state discloses, "We have set this default because we know 80% of you will not bother to change it," the disclosure itself highlights the manipulative intent. It acknowledges that the architecture is designed to bypass active deliberation in favor of statistical compliance.

  Therefore, transparency converts a covert manipulation into an overt tax on autonomy. It allows the state to claim procedural legitimacy ("we told you") while maintaining the substantive outcome (mass data sharing). For a policy that treats citizens as data sources rather than agents, disclosure does not restore agency; it merely informs the subject of their own instrumentalization. A first-order ethical fix requires not just disclosure, but a reduction in exit friction, or a justification that the public benefit is so compelling it warrants the default status despite the individual risk. Without that, the "Research-Ready" default treats the patient not as a participant in healthcare, but as a resource for it.

  ***

  ### Marking Scheme (25 Marks)

  **1. Analysis of the Self/Other-Regarding Shift (5 Marks)**
  *   **5:** Clearly distinguishes the scenario from standard libertarian paternalism. Identifies that the "as judged by themselves" justification is absent.
  *   **3:** Identifies the shift but treats it as merely a difference in outcome rather than justificatory structure.
  *   **0:** Treats the policy as standard paternalism/nudge without distinction.

  **2. The Autonomy/Instrumentalization Argument (8 Marks)**
  *   **8:** Articulates that the objection sharpens because the individual is used as a means (Kantian concern). Explains that exit friction protects the *state's* interest, not the *user's* bias.
  *   **5:** Argues autonomy is violated but relies on generic "freedom of choice" language without addressing the *direction* of the benefit.
  *   **0:** Claims autonomy is irrelevant because the public benefit is high.

  **3. The Transparency/Disclosure Critique (7 Marks)**
  *   **7:** Explains *why* disclosure fails: it doesn't reduce friction, and it reveals the manipulative intent (relying on inertia).
  *   **4:** States disclosure is insufficient but argues only that "people don't read notices."
  *   **0:** Argues disclosure solves the problem entirely.

  **4. Avoidance of Specific Failure Modes (5 Marks)**
  *   **5:** Explicitly avoids the two named traps: acknowledges manipulation is a family of complaints (not monolithic) AND acknowledges other-regarding isn't automatically worse (proportionality matters).
  *   **3:** Avoids one trap but falls into the other.
  *   **0:** Commits both errors (e.g., "All nudges are manipulation" AND "Helping others is always worse than helping self").

  **Common Mark Losses:**
  *   **The "Nudge Definition" Trap:** Students spend 300 words defining nudges rather than analyzing this specific policy.
  *   **The "Public Good" Trump Card:** Students argue that because the benefit is public, autonomy concerns vanish entirely (ignoring the proportionality requirement).

  ***

  ### Honest Advice on Word Count

  **Is 700 words enough?**
  Honestly? **No, not for a Masters seminar.**

  700 words is approximately three substantial paragraphs. To do this properly, a student needs to:
  1.  Parse the operational details of the invented policy.
  2.  Distinguish between self-regarding and other-regarding justificatory structures.
  3.  Apply a specific conception of autonomy (e.g., Kantian means-ends vs. Liberal non-interference).
  4.  Analyze the specific mechanics of why transparency fails (friction vs. knowledge).

  In 700 words, students will likely be forced to **assert** these points rather than **argue** them. They will write: *"Transparency fails because friction remains."* They won't have space to explain *why* friction matters normatively if knowledge is present.

  **Recommendation:**
  If you keep the 700-word limit, you risk rewarding concise summarization over deep normative reasoning. For a Masters final, I would recommend increasing the limit to **1,200–1,500 words**. This allows them to engage with the nuance of the "other-regarding" defense (i.e., when *is* it okay to use people for public goods?) without running out of space before they reach the transparency point. If you must keep it at 700 words, consider dropping the transparency requirement and focusing solely on the autonomy shift, as that is the richer philosophical pivot.
