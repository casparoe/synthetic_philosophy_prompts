  **Vignette A**
  Marcy works the dessert station during the Tuesday wedding rush, piping chocolate mousse onto chilled porcelain with a steady wrist. Midway through the third plate, the piping bag bursts. She sets the ruined bag down, wipes her hands on her apron, and stares at the spoon resting next to the sink for three seconds. She shakes her head, turns to the locker, retrieves a fresh bag, fills it, and returns to the first plate to pipe the initial dome again from the start. She completes the shift without further incident, every plate leaving the pass with identical symmetry, though her station logs show higher waste and slower throughput than the shift average.

  **Vignette B**
  Nick works the dessert station during the Tuesday wedding rush, piping chocolate mousse onto chilled porcelain with a steady wrist. Midway through the third plate, the piping bag bursts. His left hand catches the falling mousse in a mixing bowl while his right hand simultaneously grabs the spoon resting next to the sink. He dollops the remaining mousse onto the plates, shifts the garnish to sit atop the new contours, and sends them out without breaking his cadence. He completes the shift without further incident, every plate leaving the pass looking flawless, and his station logs show zero waste and record-breaking throughput.

