  **1. The Usual Test and Its Failure**
  The standard test for sphexishness is the **Perturbation Restart Test**: if an agent encounters an interruption that does not invalidate their goal, but nevertheless resets their behavioral sequence to step one rather than resuming mid-stream, they are deemed cue-driven (sphexish) rather than goal-directed. This test keys on **behavioral topology** (looping vs. linear progression) as a proxy for **control structure** (stimulus-response vs. policy maintenance). It fails here because it assumes rigidity implies a lack of internal governance. In this pair, A's restart is a *policy choice* (maintaining a standard of symmetry despite cost), which requires a goal to enforce. B's adaptation is *pure reactivity* (filling the visual gap with the nearest tool), which requires no goal, only high-bandwidth coupling to the environment. The test misidentifies A as the wasp because she loops, and B as the agent because she flows, missing that the loop is chosen and the flow is compelled.

  **2. The Defender's Best Move**
  The strongest defense for the standard picture is the **Functionalist Dissolution**: argue that "having a policy" is just a label for a complex disposition to behave in certain ways under certain counterfactual conditions. The defender would say A's "head shake" is merely another cue in a longer chain (Internal State X + Broken Bag -> Restart), while B's "flow" is simply a more sophisticated disposition (Broken Bag + Spoon Visible -> Improvise). On this view, "agency" is doing no explanatory work; both are input-output machines, just with different wiring.
  *Evaluation:* This move succeeds only if we deny the phenomenological reality of *endorsement*. If A can articulate *why* she restarted ("Brand standards require piped edges") and B cannot (or offers a post-hoc rationalization ("It looked right")), the distinction holds. However, based *strictly* on the observational data in the vignettes, the functionalist is correct: without access to counterfactual stability or verbal report, the two control structures are indistinguishable.

  **3. The Load-Bearing Feature**
  The single load-bearing feature is **A's hesitation and head shake** before restarting. This observable gap signals a *rejection* of the available alternative (the spoon). It transforms the restart from a compulsion (she *couldn't* use the spoon) into a choice (she *wouldn't* use the spoon). If you delete this gesture, A becomes indistinguishable from a broken machine that literally cannot proceed without a full bag, collapsing the case into a standard Sphex vs. Agent comparison where A is simply malfunctioning.

  **4. Observational Distinguishability**
  I am smuggling the verdicts in through the narrator's tone, specifically in the description of B's action: *"His left hand catches the falling mousse... while his right hand simultaneously grabs the spoon."* This phrasing implies a reflex arc (cue-chasing) rather than a decision. Conversely, describing A as staring *"for three seconds"* implies deliberation. Without these temporal markers, the behaviors are observationally identical to a standard efficient worker vs. a rigid worker. To fix this without smuggling, you would need a **second vignette** for each character showing counterfactual stability: show A *dropping* the policy when the goal changes (proving she owns the rule), and show B *failing* to adapt when the cue is misleading (proving she lacks the goal). Without that history, the inversion rests on interpretive framing, not raw behavior.
