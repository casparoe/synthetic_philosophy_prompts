answer: |-
  Here is a complete simulation package designed for your 100-minute session. It is built to force the "squeeze" mechanically, so you don't have to argue it.

  ### **Simulation Title: The Allocation Committee**

  **Premise:** The University Ethics Board has a **$100,000** discretionary grant. Four projects are on the table. Each project costs **$40,000** to fund fully.
  **Constraint:** Only **$100,000** exists. Mathematically, only **two projects can be fully funded**, or a combination of partial fundings.
  **Voting Rule:** A project passes if **3 out of 4 Factions** vote "Yes."

  ---

  ### **1. The Faction Cards (Print 4 of each)**

  *Instructions to Instructor: Cut these out. Hand one to each student. Tell them: "This is your private utility function. Do not show this card to other factions. You may share verbal claims, but the numbers are secret."*

  #### **FACTION A: Campus Safety (4 Students)**
  *   **Primary Goal:** Fund **Project Security** (Surveillance & Access Control).
  *   **Secondary Goal:** Fund **Project Excellence** (Research Grants).
  *   **Value:** You care about *outcomes*. You don't care how the money is allocated, as long as your projects get funded.
  *   **Scoring:**
      *   +10 points for every $10k secured for **Security**.
      *   +5 points for every $10k secured for **Excellence**.
      *   0 points for other projects.
  *   **Trading Stance:** You are willing to vote for anything to get Security funded.

  #### **FACTION B: Student Union (4 Students)**
  *   **Primary Goal:** Fund **Project Equity** (Need-based Scholarships).
  *   **Secondary Goal:** Fund **Project Liberty** (Privacy & Legal Aid).
  *   **Value:** You care about *outcomes*. You are pragmatic.
  *   **Scoring:**
      *   +10 points for every $10k secured for **Equity**.
      *   +5 points for every $10k secured for **Liberty**.
      *   0 points for other projects.
  *   **Trading Stance:** You are willing to vote for anything to get Equity funded.

  #### **FACTION C: Faculty Senate (4 Students)**
  *   **Primary Goal:** Fund **Project Excellence** (Research Grants).
  *   **Secondary Goal:** Fund **Project Security** (Surveillance & Access Control).
  *   **Value:** You care about *outcomes*. You view this as a resource distribution problem.
  *   **Scoring:**
      *   +10 points for every $10k secured for **Excellence**.
      *   +5 points for every $10k secured for **Security**.
      *   0 points for other projects.
  *   **Trading Stance:** You are willing to vote for anything to get Excellence funded.

  #### **FACTION D: Rights Watch (4 Students)**
  *   **Primary Goal:** Fund **Project Liberty** (Privacy & Legal Aid).
  *   **Constraint:** You oppose **Project Security** on principle.
  *   **Value:** You care about *outcomes* AND *integrity*.
  *   **Scoring:**
      *   +10 points for every $10k secured for **Liberty**.
      *   **-20 points (Penalty)** if you cast a "YES" vote for **Project Security**.
      *   0 points for other projects.
  *   **Trading Stance:** You want Liberty funded. But voting "Yes" on Security violates your core mission.
  *   **Note:** If Security passes *without* your vote, you take no penalty. The penalty is only for *your endorsement*.

  ---

  ### **2. The Rules**

  **Round 1: The Package Deal (25 Minutes)**
  *   **Goal:** Pass as many **Fully Funded ($40k)** projects as possible.
  *   **Mechanism:** Logrolling. You may make binding agreements. "I will vote Yes on Security if you vote Yes on Liberty."
  *   **Constraint:** The Budget is hard. If 3 projects pass (Total $120k), the Dean cancels *all* funding. You must ensure no more than 2 projects get 3 "Yes" votes.
  *   **Action:** Factions mingle, make deals, then cast secret ballots on each project.

  **Round 2: The Compromise (25 Minutes)**
  *   **Goal:** Allocate the **$100k Pot** across any number of projects.
  *   **Mechanism:** Scaling. You cannot trade votes. You simply submit a "Demand" for your top priority project (e.g., "We demand $30k for Liberty").
  *   **Constraint:** If Total Demands > $100k, all demands are reduced proportionally (The "Haircut").
  *   **Action:** Factions deliberate internally on how much to ask for, then submit a written demand slip.
  *   **Note:** In this round, there are no Yes/No votes on specific projects, so **Faction D cannot incur the Voting Penalty.**

  ---

  ### **3. Scoring Scheme (Instructor Key)**

  *Do not reveal this until the Debrief.*

  *   **Factions A, B, C:** Score = Sum of $ secured for their prioritized projects.
      *   *Feeling:* "Did I get my money?"
  *   **Faction D:** Score = ($ secured for Liberty) MINUS (20 points if they voted Yes on Security).
      *   *Feeling:* "Did I get my money, and did I sell my soul?"

  **The Squeeze Mechanic:**
  *   In **Round 1**, for Liberty to pass, Faction D needs 2 other factions to vote Yes. Factions A & C want Security. They will say: "We vote Liberty, if you vote Security."
  *   If Faction D accepts: They get $40k Liberty (+40 pts) but vote Security (-20 pts). **Net: 20.**
  *   If Faction D refuses: Liberty likely fails (only Faction B votes Yes). **Net: 0.**
  *   *Rational Choice:* Accept the trade.
  *   *The Squeeze:* Factions A, B, C can easily reach **Net 40+** by trading freely. Faction D is capped at **Net 20** because their currency (votes) is toxic to them. They are systematically disadvantaged by the structure of trade, even when they play optimally.

  ---

  ### **4. Minute-by-Minute Timeline (100 Minutes)**

  *   **00-10: Introduction & Grouping.**
      *   Divide class into 4 groups of 4.
      *   Hand out Faction Cards.
      *   **Script:** "You are stakeholders. You have private interests. You have 10 minutes to read your card and plan your strategy. Do not talk to other groups yet."
  *   **10-35: Round 1 (Trade).**
      *   Open the floor. Students mingle.
      *   **Instructor Role:** Enforce the budget. If they agree to fund 3 projects, remind them: "That costs $120k. The Dean cancels everything. Fix it."
      *   Collect Secret Ballots.
      *   Announce Results publicly (Which projects passed?).
      *   **Do not announce scores.** Ask each faction: "Are you satisfied?" (They will lie/guess).
  *   **35-45: Intermission & Calculation.**
      *   Groups calculate their Round 1 score privately based on their cards.
      *   Instructor calculates the "System Score" (who got squeezed).
  *   **45-70: Round 2 (Compromise).**
      *   **Script:** "New Rules. No vote trading. You simply write down how much money you need for your Top Priority. If the total is over $100k, everyone gets cut proportionally."
      *   Groups deliberate internally. (Faction D realizes they don't need to vote Yes on Security anymore).
      *   Collect Demand Slips. Calculate allocation.
      *   Announce Results.
  *   **70-80: Calculation.**
      *   Groups calculate Round 2 scores.
  *   **80-100: The Debrief.**
      *   See below.

  ---

  ### **5. The Debrief (20 Minutes)**

  *Do not start with theory. Start with their pain.*

  **Step 1: The Reveal (5 mins)**
  *   Ask Faction D: "In Round 1, did you get Liberty funded?" (Likely Yes). "Did you feel good about it?" (Likely No).
  *   Reveal Faction D's scoring card to the class.
  *   **Point:** "You made a rational trade. You got your project. But you paid a tax the other factions didn't pay. Why?"
  *   **Answer:** Because your value (Rights) is not fungible with their value (Security). To trade, you had to violate your own metric.

  **Step 2: Pinning the Distinction (10 mins)**
  *   **Write on Board:**
      *   **Round 1 = Trade (Logrolling).** "I keep my values 100%, you keep yours 100%. We swap actions."
      *   **Round 2 = Compromise.** "We both lower our demands. We meet in the middle."
  *   **Ask the Class:** "In Round 1, who ended up with the lowest score?" (It should be Faction D).
  *   **Ask:** "Why? Was anyone unfair to them?"
  *   **Target Insight:** No one was unfair. The *mechanism of trade* requires fungibility. If you have a 'sacred value' (a negative constraint on voting), you have less currency to trade. You get squeezed by the efficiency of the market.
  *   **Ask Faction D:** "In Round 2, did you get less money?" (Yes). "Did you feel better?" (Hopefully Yes).
  *   **Target Insight:** Compromise lowers the material win, but it removes the integrity tax. You stop *endorsing* the thing you hate, you just accept getting less of what you love.

  **Step 3: The Theoretical Hook (5 mins)**
  *   **Script:** "We often say 'compromise is necessary.' But look at Round 1. Trade was *more* efficient. More money was distributed. Everyone got their top picks fully funded. Except the people who couldn't trade without self-betrayal."
  *   **Conclusion:** Trade preserves value integrity but excludes non-fungible values. Compromise includes everyone but dilutes value integrity. Political theory often blurs these. Today you felt the difference.

  ---

  ### **6. Predictable Failures & Fixes**

  **1. The "Horsing Around" Failure**
  *   **Risk:** Students treat it like a board game, ignoring the "ethics" on the cards.
  *   **Fix:** **Role Assignment.** Within each faction of 4, assign roles: *Chair* (speaks for group), *Scribe* (records deals), *Envoy* (talks to other groups), *Auditor* (checks math/rules). This forces engagement.
  *   **Fix:** **Tone.** Start the session in silence. Hand out cards without speaking. "Read this. It is your only truth."

  **2. The "Broker-Dealer" Failure**
  *   **Risk:** One loud student in Faction A dominates the room, making all deals while their 3 teammates watch.
  *   **Fix:** **The Signature Rule.** Any deal in Round 1 must be signed by *all four* members of the faction. If one member refuses, the deal is void. This forces internal consensus and gives quiet students veto power.

  **3. The "Collusion" Failure**
  *   **Risk:** Students realize if they all fund everything, everyone wins. They ignore the budget cap.
  *   **Fix:** **The Dean's Veto.** You (the instructor) are the Dean. If they submit a budget >$100k in Round 1, you immediately declare "Funding Cancelled. Everyone gets 0." Do not negotiate. This makes the constraint credible.

  **4. The "Nihilist" Failure (Faction D)**
  *   **Risk:** Faction D refuses to trade on principle, gets 0 points, and feels righteous. This breaks the "rational choice" lesson.
  *   **Fix:** **The Whisper.** If Faction D is digging in too hard at minute 20, walk by and drop a hint: "Your card says you value Liberty. If Liberty fails, you fail. Is purity worth zero?"

  ---

  ### **7. Limitations (What you must supply)**

  *Be straight with your students about what the game cannot do.*

  1.  **Iteration:** Real politics is a repeated game. If you betray someone in Round 1, they punish you in Round 2. This simulation is one-shot. In reality, the "Integrity Tax" Faction D pays is actually an *investment* in reputation for the next round.
  2.  **Constituency Pressure:** These students are playing themselves. In reality, Faction D represents voters who would *fire* them if they voted for Security. The "pain" in the game is intellectual; in reality, it is existential (losing office).
  3.  **Enforcement:** In Round 1, deals are binding only by honor. In reality, institutions enforce logrolling (committee assignments, pork barrel). The simulation relies on trust, which makes the "Trade" round messier than real life.

  **Instructor Note:** The success of this session hinges on the Debrief. Do not let them leave thinking "Trade is bad." The point is that Trade is *efficient but exclusionary*, while Compromise is *inefficient but inclusive*. The "Squeeze" on Faction D is the feature, not the bug.
