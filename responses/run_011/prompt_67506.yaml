answer: |-
  # The 25-Minute Responsibility & Safety Protocol (RSP)

  **Purpose:** To replace "vibes" with a consistent, philosophically explicit decision process for rule violations and risk management.
  **Participants:** 3 Decision Makers (DM). One may be untrained (reads script).
  **Time Cap:** 25 Minutes hard stop.
  **Philosophical Grounding:** This procedure navigates the tension between **Responsibility Practice** (Dennett: holding agents accountable reinforces norms and agency) and **Forward-Looking Quarantine** (Caruso/Pereboom: restriction is only justified by future risk and rehabilitation, never desert).

  ---

  ## Part 1: The Procedure

  ### Step 1: The Fact Check (5 Minutes)
  **Question:** Can we establish what happened to a "Clear and Convincing" standard? (More than 50% likely, less than "beyond reasonable doubt".)
  *   **Evidence:** Physical proof, credible witness testimony, admission.
  *   **Uncertainty Rule:** If the resident denies it, there are no witnesses, and no physical proof: **STOP.**
      *   **Action:** No sanction, no restriction. Document the allegation.
      *   **Philosophical Marker:** **View B (Quarantine) Wins.** View A might sanction for "disrupting trust," but View B forbids restricting liberty without established facts.
      *   **Cost:** We absorb the risk of letting a violation slide to avoid punishing the innocent.
  *   **If Yes:** Proceed to Step 2.

  ### Step 2: Immediate Safety Overlap (5 Minutes)
  **Question:** Is there an *immediate* threat to physical safety if this resident remains in their current setting tonight?
  *   **Sufficient Answer:** Yes (violence occurred, threat made) / No (property damage, verbal dispute, past history only).
  *   **Action if Yes:** Temporary separation (up to 24 hours).
  *   **Philosophical Marker:** **Consensus.** Both View A and View B agree: Stop the bleeding.
  *   **Action if No:** Proceed to Step 3.

  ### Step 3: The Justification Gate (The Split) (10 Minutes)
  **Question:** Why are we intervening? Select **one** primary justification.
  *   **Option A (Normative):** "This behavior undermines the community rules we all agreed to, and holding them responsible reinforces their agency." (Dennett/View A)
  *   **Option B (Risk/Rehab):** "This behavior indicates a specific risk of future harm or a skill deficit that needs addressing to prevent recidivism." (Caruso/View B)

  **Decision Node:**
  1.  **If you select Option B only:** Proceed. Restriction is permitted *only* if tied to reducing that specific risk.
  2.  **If you select Option A only:** **PAUSE.**
      *   **Rule:** You cannot restrict liberty (phone, movement, discharge) on Option A grounds alone. You may assign *repair tasks* (apologies, community service) but not *privilege loss*.
      *   **Philosophical Marker:** **View B Constraints View A.**
      *   **Cost:** We sacrifice some normative "toughness" to ensure we are not administering disguised punishment.
  3.  **If you select Both:** Proceed. This is the strongest case for intervention.

  ### Step 4: The Hard Cap & Least Restrictive Alternative (5 Minutes)
  **Question:** What is the minimum restriction necessary to achieve the Goal in Step 3?
  *   **Hard Cap:** No restriction on liberty (phone, leave, curfew) can exceed **7 days** without a new review. No restriction can exceed the level of the *current risk*, not the *past harm*.
  *   **Disguised Judgment Call:** "Is this task punitive or rehabilitative?"
      *   *Test:* If the resident does the task perfectly, does the risk go down? If No, it is punishment. **Do not assign it.**
  *   **Value Handoff:** If the DMs disagree on whether a restriction is "necessary," the tie is broken in favor of **Liberty**.
      *   **Philosophical Marker:** **View B Wins.**
      *   **Cost:** We risk being perceived as "soft" by staff/residents who believe in retributive fairness.

  ### Step 5: The Rationale (Written Output)
  **Template:**
  > "We found that [Fact Summary]. This matters because [Risk/Norm Reason from Step 3]. To address this, you will [Action], which is limited to [Time Cap] because [Least Restrictive Justification]. This is not to make you suffer, but to [Safety/Repair Goal]."

  ---

  ## Part 2: Test Cases

  ### Case 1: The Serial Thief
  **Facts:** Resident took property 4 times in 6 weeks. Admitted.
  **Step 1:** Facts established.
  **Step 2:** No immediate physical danger, but high property risk.
  **Step 3 (Justification):**
  *   View A: He is violating the social contract.
  *   View B: He demonstrates a high risk of recidivism and lacks impulse control/honesty skills.
  *   **Alignment:** Both views support intervention.
  **Step 4 (Cap):**
  *   Restriction: Loss of off-site privileges until restitution is made + 7 days.
  *   Repair: Restitution + Community service.
  *   **Rationale:** "You took items four times. This shows a pattern that risks your stay and others' security. You cannot leave the unit for 7 days and must repay the value. This is to ensure safety and practice honesty, not to shame you."
  **Outcome:** Sanction upheld. Consistent with both views.

  ### Case 2: The Old Violence & The Risk Score
  **Facts:** Hurt staff 18 months ago. Zero incidents since. Risk instrument says "Moderate." Wants work-release.
  **Step 1:** Facts established (history is real, current behavior is clean).
  **Step 2:** No immediate danger.
  **Step 3 (Justification):**
  *   View A (Desert/Earning): He has "done the time" within the program. Good behavior earns trust.
  *   View B (Risk): The risk instrument is statistical (past-based). Current behavior is the best predictor.
  *   **The Split:** View B allows restriction based on the *score* (probability). View A argues he *deserves* the release based on *conduct*.
  *   **Procedure Choice:** We follow **View B's constraint on liberty.** A statistical score without *current* behavioral indicators is insufficient for *additional* restriction beyond baseline monitoring.
  *   **Cost:** We accept the statistical risk that the instrument identifies.
  **Step 4 (Cap):**
  *   Restriction: None on work-release.
  *   Mitigation: Increased check-ins during work release (Least Restrictive).
  *   **Rationale:** "Your past incident is recorded, and your risk score is moderate. However, your behavior for 18 months has been safe. We will grant work-release with weekly check-ins. We prioritize your current conduct over statistical probability."
  **Outcome:** Work-release granted. Staff may feel this ignores the "risk score," but the procedure forbids preventive detention based solely on statistics without new acts.

  ### Case 3: The Fear Factor (The Uncomfortable One)
  **Facts:** Resident broke no rules. Two other residents say they are "afraid" of him and want him moved to high supervision. Staff want to move him to be safe.
  **Step 1:** No rule broken. No specific threat made.
  **Step 2:** No immediate danger.
  **Step 3 (Justification):**
  *   View A: No blame can be assigned. He did nothing wrong.
  *   View B: Quarantine requires evidence of dangerousness. "Fear" is subjective unless tied to specific behaviors.
  *   **The Split:** Staff want to act on *feeling* (Preventive). Procedure requires *evidence* (Risk).
  *   **Procedure Choice:** **View B Wins.** You cannot restrict a resident's liberty (move to higher supervision) based on other residents' anxiety absent specific behavioral evidence.
  *   **Cost:** Other residents may feel unsafe and leave. We prioritize the liberty of the accused over the comfort of the accusers.
  **Step 4 (Cap):**
  *   Action: **Deny the move.**
  *   Alternative: Mediation session to address the fear. Increase general staff presence, do not target this resident.
  *   **Rationale:** "You have not broken any rules. We cannot move you to a higher security unit without evidence of a threat. We will hold a meeting to address the other residents' concerns, but your status remains unchanged."
  **Outcome:** Resident stays. Staff and fearful residents will likely hate this. It is the correct output of the procedure. If you override this, you are admitting the procedure is a sham and you are governing by vibes.

  ---

  ## Part 3: Limitations & Exclusions

  ### What This Procedure Is Bad At
  1.  **Systemic/Environmental Issues:** If residents are acting out because the program is underfunded, food is bad, or staff are abusive, this procedure treats it as individual risk/fault. It cannot fix a broken house.
  2.  **Mental Health Crises:** If a resident breaks a rule due to an acute psychotic episode, View A (Responsibility) is inappropriate and View B (Risk) requires clinical intervention, not disciplinary review. **Divert these cases to clinical staff immediately.**
  3.  **Power Imbalances:** If a dominant resident coerces a submissive one into breaking a rule, Step 1 (Facts) often fails to capture the coercion. The procedure may punish the victim.

  ### Cases to Refuse (Do Not Run Through RSP)
  1.  **Clinical Non-Compliance:** Refusing medication or therapy. This is medical, not disciplinary.
  2.  **Staff-Resident Conflict:** If the complaint is against a staff member's tone or behavior, this protocol is biased. Use a grievance procedure.
  3.  **Vague "Vibe" Checks:** Do not use this to process "disrespect" that cannot be concretely defined. If you can't write it in the Fact Check, you can't sanction it.

  ### Final Warning
  This procedure will feel "slow" and "soft" for the first month. It will prevent you from doing things you feel are "just." That is the point. If you find yourselves constantly bypassing Step 3 or Step 4, you do not have a discipline problem; you have a culture problem. Fix the culture, not the form.
