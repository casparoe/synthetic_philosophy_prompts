      *(Self-Correction during drafting)*: I need to be careful with Point 3. In PE, can you defect against conditional cooperators? If I am a "Cooperate if you Cooperate" bot, and you are a "Defect if you are Conditional" bot, what happens? If you simulate me, you see I cooperate if you cooperate. If you defect, I defect. So you get Defect-Defect. So the "exploiter" doesn't gain. The real exploit is "I cooperate if you are unconditional, defect if you are conditional." This gets into "Robust Program Equilibrium." I should keep it accessible but accurate.

