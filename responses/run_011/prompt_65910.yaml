          *   Verdict: PE is much more brittle here. If I can't verify the "cooperate if" clause, I must assume worst-case (Defect). Obfuscation breaks PE easily. Folk Theorem handles noise better.
          *   *User's intuition:* Correct. PE is brittle here.

