          *   No citations/bibliography required (don't penalize absence).
          *   Argument > Polish (only penalize style if it obscures reasoning).
          *   Marking Scale: 80-100 (Publishable), 70-79 (First), 60-69 (2:1), 50-59 (2:2), 40-49 (Pass), <40 (Fail).
