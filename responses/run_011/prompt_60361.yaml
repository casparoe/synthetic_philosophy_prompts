      *Wait, one more check on the User's Seismograph:* The User says "archive is more like a seismograph." The archive isn't the seismograph; the archive is the *trace*. The past is the quake. The problem is the archive is incomplete. Seismographs record *everything* above a threshold. Archives record what people *kept*. This is a fatal flaw in the User's analogy. I must highlight this.

