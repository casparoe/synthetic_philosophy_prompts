      *   *Refining the "Biting" analysis:* This is the crux. The Chair uses Carr to say "No objective answer." But Carr's fisherman analogy actually implies that if you fish correctly, you *do* catch the fish that is there. The Chair is misusing Carr to support a postmodern relativism Carr didn't intend. The fish (causes) *are* in the sea. If the mesh is right, you catch them. If you catch different fish, it might be because you fished in a different spot (different archive), not because the fish didn't exist. This supports the User's intuition that there *is* an answer, but the Chair is right that *access* is mediated.
