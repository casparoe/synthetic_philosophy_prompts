answer: |-
  # The Historical Materialism Self-Diagnostic

  **Instructions:** Read each case and select the *single* explanation that best matches your intuition about how the change happened. Do not worry about what you think Marx "should" have said; answer based on what you think actually drives history. There are no right answers, only different maps.

  **1. The Enclosure Acts (18th Century)**
  Parliament passes laws fencing off common land. A generation later, landless peasants become wage labourers in cities. Why did the laws pass?
  *   (A) New farming techniques made common land inefficient; the law simply caught up to the economic reality.
  *   (B) Landowners used their political power to seize assets; the new farming methods were adopted to suit the new ownership.
  *   (C) Many enclosure bills were proposed; only the ones that allowed for profitable commercial agriculture survived the legislative process.

  **2. The Factory Owner's Choice (1920s)**
  A manufacturer can buy Machine X (replaces 10 workers) or Machine Y (speeds up 10 workers). Both cost the same. She buys X. Why?
  *   (A) Machine X represents a higher level of technical productivity; the other choice would have been irrational long-term.
  *   (B) Machine X weakens the bargaining power of the union; the technical output was secondary to control.
  *   (C) Both were tried in the industry; factories using X survived the recession while those using Y went bankrupt.

  **3. The Data Protection Rule (2010s)**
  A new privacy regulation is introduced. The biggest tech platforms lobbied for it and gained market share; smaller rivals struggled to comply.
  *   (A) The volume of data made old privacy laws technically unworkable; the new rule was an inevitable adaptation.
  *   (B) The big platforms wrote the rules to raise entry costs for competitors; the technology adapted to the law.
  *   (C) The rule looks like it favours giants because firms that couldn't manage the compliance costs exited the market.

  **4. The Invisible Resource (Present Day)**
  Radio spectrum licences or carbon permits only exist because the law defines them. Without the law, there is no property. How did the system emerge?
  *   (A) Scarcity of the resource made property rights inevitable; the law just formalized what economics required.
  *   (B) The state decided to create a market for political reasons; the economic value was created by the legal decision.
  *   (C) Various legal regimes were tried; the one that minimized interference and transaction costs became the standard.

  **5. The Work Ethic (17th Century)**
  A religious doctrine spreads that praises hard work and frugality. Capitalist investment rises in the same regions.
  *   (A) Expanding trade required a disciplined workforce; religion shifted to provide the necessary moral framework.
  *   (B) Preachers had theological reasons unrelated to money; capitalists simply exploited the behaviour that resulted.
  *   (C) Religious groups that discouraged work lost members in commercial cities; the "work ethic" groups survived.

  **6. The Prediction Test (Future)**
  If you wanted to guess which legal changes will happen in the next decade, what is your best strategy?
  *   (A) Track the developing technologies; the law will change to accommodate what the machines make possible.
  *   (B) Track the balance of political power and lobbying; the law will change to reflect who wins the struggle.
  *   (C) You cannot predict specific laws; you can only explain why the laws that stick are compatible with the economy.

  **7. The Divergent Paths (1600–1800)**
  Two nations have similar farming tools and trade levels. One has feudal property laws; the other has capitalist property laws. They stay this way for two centuries.
  *   (A) One nation is actually technologically behind; the difference in tools is subtle and not yet recorded.
  *   (B) Politics and history diverge; technology sets a range of possibilities but does not dictate the property system.
  *   (C) The feudal system is unstable; it will collapse soon, and we are just observing it before the necessary correction.

  **8. The Crisis Point (1930s)**
  The economic system enters a deep crisis and transforms. What triggered the shift?
  *   (A) The existing technology could no longer generate profit within the old ownership rules.
  *   (B) Organized labour and political movements refused to accept the old terms of distribution.
  *   (C) The political institutions could no longer manage the complexity of the economic flows.

  **9. The Art Market (1950s)**
  Abstract art becomes dominant in wealthy nations during a period of high industrial production.
  *   (A) The fragmentation of the market is reflected in the fragmentation of the image; form follows economic structure.
  *   (B) Artists pursued internal aesthetic problems; the economic boom just provided the funding to let them do it.
  *   (C) Art that resonated with the mood of the consumer class got bought; the rest was forgotten.

  **10. The Makers of History (General)**
  When a major social transformation occurs, who is driving it?
  *   (A) Individuals act, but only as carriers of broader economic trends they cannot control.
  *   (B) Individuals and groups make choices that alter the economic trajectory; contingency matters.
  *   (C) Asking who drives is misleading; the system selects for behaviours that ensure its own continuation.

  ***

  # Scoring Key & Diagnosis

  **Step 1: Tally your answers.**
  Count how many times you selected (A), (B), and (C).

  **Step 2: Check for Specific Patterns.**
  Before looking at your totals, check if you fit one of these specific profiles:

  *   **The Relative Autonomy Profile:** You picked mostly **(A)** for Questions 1, 2, 4 (Tech/Law), but mostly **(B)** for Questions 5, 9 (Culture/Religion).
      *   *Diagnosis:* You believe the economy drives the hard infrastructure, but culture and ideas have their own history and timeline.
  *   **The Deflationary Profile:** You picked **(C)** for Questions 6 and 10 specifically, regardless of other answers.
      *   *Diagnosis:* You suspect the distinction between "economic cause" and "legal cause" is artificial or retrospective.
  *   **The Dodger:** You picked **(B)** for almost every question because you felt "it's a mix of both" or "it depends."
      *   *Diagnosis:* You are refusing the theoretical bet. Historical Materialism requires a claim about priority. If everything interacts equally, the theory explains nothing.

  **Step 3: General Positions (Based on Majority)**

  *   **Majority (A): Technological Determinism (Hard Historical Materialism)**
      *   *Core Commitment:* The development of the forces of production (tech, skills, resources) sets the necessary conditions for social relations. Law and politics are largely reactive.
      *   *Most Embarrassing Commitment:* You must admit that some social progress is accidental, occurring only because it helped efficiency.
  *   **Majority (B): Political Marxism (Class Struggle / Agency)**
      *   *Core Commitment:* Class relations and political struggle are the motor of history. Technology is chosen and deployed to serve power, not the other way around.
      *   *Most Embarrassing Commitment:* You must admit that capitalism might have persisted even if it was technically inefficient, simply because the ruling class held power.
  *   **Majority (C): Functionalism (Analytical / Institutional Marxism)**
      *   *Core Commitment:* Social forms persist *because* they stabilize the economy. It doesn't matter who intended it; if it didn't fit, it would have been selected out.
      *   *Most Embarrassing Commitment:* You must admit that harmful or unjust institutions persist simply because they are "stable," making critique difficult.

  ***

  # Limitations & Logical Gaps

  **Pairs This Quiz Cannot Separate**
  1.  **Technological Determinism vs. Functionalism:** In Questions 1, 2, and 4, the "Determinist" answer (A) and the "Functionalist" answer (C) often predict the same outcome (the efficient law wins).
      *   *The Fix:* You need a question about a **persistent dysfunction**. Ask: "Why does an inefficient law stay on the books?" A Determinist says "Tech hasn't changed enough yet." A Functionalist says "It actually serves a hidden function." A Political Marxist says "Because the winners like it."
  2.  **Political Marxism vs. Relative Autonomy:** Both prioritize politics/culture over tech.
      *   *The Fix:* You need a question on **timing**. Ask: "Did the legal change happen *before* the economic shift?" Political Marxism says yes (law creates economy). Relative Autonomy says they move on parallel, uncoordinated tracks.

  **Logically Available but Undefended Combinations**
  *   **Determinist on Law, Autonomist on Technology:** (e.g., "Laws are dictated by economics, but machines are invented randomly.")
      *   *Why not:* Incoherent. If laws react to tech, tech must have a trajectory. If tech is random, laws cannot be determined.
  *   **Functionalist on Religion, Determinist on Art:** (e.g., "Religion survives because it fits the economy, but Art is purely technical.")
      *   *Why not:* Unattractive. Theorists usually treat culture (art/religion) as a single block of "ideology." Splitting them requires a nuanced theory of value most don't bother with.
  *   **Deflationary on Prediction, Determinist on History:** (e.g., "We can't predict the future, but the past was totally determined.")
      *   *Why not:* Unexplored. Usually, if you believe the past was determined by laws, you believe those laws still apply. Denying prediction usually implies denying the determinism.

  **A Note on the "Base/Superstructure" Terminology**
  You may have noticed the words "base" and "superstructure" did not appear in the quiz. This is deliberate. Many students memorize the definition ("Base is economy, Superstructure is culture") but fail to apply the *causal* claim. If you scored as a **Technological Determinist**, you believe the base drives the superstructure. If you scored as a **Political Marxist**, you believe the superstructure often builds the base. If you scored as a **Functionalist**, you believe the distinction describes a relationship of stability, not a chain of command.
