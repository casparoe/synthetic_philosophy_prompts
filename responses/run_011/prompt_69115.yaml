  UNITED STATES DISTRICT COURT
  FOR THE DISTRICT OF COLUMBIA

  IN RE: AGGREGATE HARM LITIGATION
  Case No. 24-cv-01033 (JEB)

  **NOTICE OF PROPOSED CLASS ACTION SETTLEMENT AND INSTRUCTIONS FOR FILING A CLAIM**

  **TO ALL PERSONS WHO RECEIVED A DUST SPECK IN THE EYE ON OR BETWEEN JANUARY 1, 2023 AND DECEMBER 31, 2023:**

  A Federal Court has authorized this Notice. You are a Class Member if you received a momentary ocular irritant (a "Speck") as described in the Certification Order. The Court certified a Class consisting of all individuals subjected to a Speck. The Class size is stipulated as Fact #12 to be exactly 3^^^3 (three up-arrow three up-arrow three). For the benefit of lay readers, this number is expressed in plain English as three raised to the power of three, raised to the power of three, repeated recursively until the expression exceeds the storage capacity of all known hard drives, at which point the remainder is truncated for administrative convenience. This truncation is de minimis and does not affect voting rights or distribution eligibility.

  **1. THE SETTLEMENT AND ALLOCATION**
  The Defendant has established a Qualified Settlement Fund of $10,000,000,000.00 (Ten Billion Dollars). Under the Plan of Allocation, the Fund shall be distributed equally among Class Members. To calculate your share, the Fund is divided by the Class Size. Due to the magnitude of the Class Size, the unrounded per-capita distribution is a decimal fraction extending beyond the physical limits of this document. Pursuant to Administrative Order 14, all monetary distributions are rounded to the nearest cent using standard arithmetic rounding conventions. Any fraction less than half a cent is rounded down. Consequently, the authorized payment for each Claimant is $0.00. This result is mathematically precise and legally binding.

  **2. NOTICE PROGRAM AND SUBSTITUTION**
  Individual mail notice is physically impossible given the Class Size. Digital notice is statistically insufficient to satisfy due process. Therefore, the Court approved a Substitute Notice Program consisting of the administration of one (1) additional Speck to the left eye of each Class Member. This delivery confirms your standing and provides actual notice of these proceedings. While this imposes a minor burden, the Administrator has determined that two (2) Specks are arithmetically preferable to the Alternative (Fifty Years of Torture). The net utility remains positive. You have already received this Notice via ocular delivery. No further action is required to acknowledge receipt. If you did not feel the Notice Speck, you are still bound by its contents.

  **3. THE SINGLETON SUBCLASS AND COUNSEL FEES**
  Mr. Arthur Singleton, the individual selected for the Alternative Torture, is excluded from the Class. He is designated a "Non-Participating Interested Party." While Mr. Singleton suffered no physical harm, his counsel contributed to the Settlement by arguing against Certification. Accordingly, Mr. Singleton's counsel shall be awarded 25% of the Fund ($2,500,000,000.00) from the same pool allocated to Class Members. This reduces the Class Fund to $7,500,000,000.00. Class Counsel shall receive an additional 25% for prosecuting the Speck claims. The remaining 50% is reserved for Claims. Even with this reduction, the per-capita distribution remains $0.00 after rounding. The conflict of interest between funding Class Counsel and Singleton Counsel from the same limited fund was litigated and deemed acceptable under the Governing Procedural Statutes.

  **4. OBJECTIONS AND REPLY**
  One timely objection was filed by the "Lex Talionis Group." The Objector argues that no quantity of Specks can be morally traded against Mr. Singleton's potential torture, rendering the Settlement void as against public policy. The Administrator replies that the Certification Order is the Law of the Case. The Court has already weighed the interests using the approved Utilitarian Matrix. The objection concerns merits already adjudicated during the Liability Phase. Therefore, the objection is noted for the record but does not delay distribution. The arithmetic stands.

  **5. CY PRES DISTRIBUTION**
  Because the per-capita distribution is $0.00, and because filing a Claim costs more than the recovery, nearly 100% of the remaining Fund constitutes Unclaimed Residue. Under the cy pres doctrine, these funds shall be donated to the "Institute for Marginal Utility Studies," a charitable organization dedicated to researching cost-benefit analyses in tort law. This ensures the funds benefit the Class indirectly by advancing the legal theory that harmed them. The Institute will use the funds to publish papers explaining why the Settlement was fair.

  **6. CLAIMS PROCEDURE**
  To file a Claim, complete Form 5B (Proof of Speck). You must attest, under penalty of perjury, that you received a Speck and not a Pebble. A Pebble is excluded as de minimis harm exceeding Class parameters. The line between Speck and Pebble is drawn at 0.5 milligrams. Submit Form 5B by mail or upload to the Settlement Website. Claims must be postmarked by December 31, 2025. Late claims will be rejected.

  **FREQUENTLY ASKED QUESTIONS**

  1.  *Why is my check for zero dollars?*
      The Settlement Fund is finite. The Class is effectively infinite. Division yields a result below the smallest currency unit. Rounding rules mandate truncation.

  2.  *Do I have to pay for the Notice Speck?*
      No. The cost was deducted from the Fund before calculation. It is a non-monetary expense borne by the Class for the benefit of the Class.

  3.  *Can I opt out?*
      Yes. Submit a Request for Exclusion. You will be removed from the Class and restored to the pool of potential Torture Victims should the Settlement fail.

  4.  *What if I got two Specks?*
      You are eligible for double damages ($0.00). You must file two Forms. Each will be processed individually.

  5.  *Who do I contact?*
      Contact the Settlement Administrator at 1-800-555-0199. Wait times exceed the lifespan of the universe. Please hold.

  Dated: October 15, 2024.

  By: /s/ Jane Roe
  Settlement Administrator
