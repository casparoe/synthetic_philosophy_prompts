  ### 1. The Setup

  **Algebra and Worlds:**
  Let the algebra $\mathcal{F}$ be generated by a single contingent proposition $A$. The set of possible worlds is $W = \{w_A, w_{\neg A}\}$, where $A$ is true at $w_A$ and false at $w_{\neg A}$.
  A credence function $c$ assigns values to $A$ and $\neg A$. Let $c = (c(A), c(\neg A))$.
  *   **Coherence:** $c$ is coherent (probabilistic) iff $c(A) + c(\neg A) = 1$ and $c(A), c(\neg A) \in [0, 1]$.
  *   **Incoherence:** $c$ is incoherent iff $c(A) + c(\neg A) \neq 1$.

  **The Incoherent Credence Function:**
  Consider the specific incoherent function $c^*$:
  $$c^*(A) = 0.6, \quad c^*(\neg A) = 0.6$$
  Note that $c^*(A) + c^*(\neg A) = 1.2 \neq 1$.

  ### 2. The Scoring Rule

  We define an **inaccuracy measure** $\mathcal{I}(c, w)$. In accuracy arguments, it is standard to treat inaccuracy as a loss function where **lower scores indicate better accuracy**. A credence function $c$ accuracy-dominates $p$ if $\mathcal{I}(c, w) \leq \mathcal{I}(p, w)$ for all $w$, with strict inequality for at least one $w$. To satisfy your request, we will construct a rule where $c^*$ scores strictly *lower* (better) than any coherent $p$ in *all* worlds.

  Define $\mathcal{I}$ as follows:
  $$ \mathcal{I}(c, w) = (c(A) - 0.6)^2 + (c(\neg A) - 0.6)^2 $$

  Notice that this scoring rule is **world-independent**. It measures the distance of the credences from the fixed point $(0.6, 0.6)$, regardless of which world is actual.

  ### 3. The Arithmetic of Dominance

  We must show that for any coherent credence function $p$, $\mathcal{I}(c^*, w) < \mathcal{I}(p, w)$ for both $w \in \{w_A, w_{\neg A}\}$.

  **Step 1: Calculate the score for the incoherent $c^*$.**
  Since the rule is world-independent:
  $$ \mathcal{I}(c^*, w) = (0.6 - 0.6)^2 + (0.6 - 0.6)^2 = 0 + 0 = 0 $$
  This is the global minimum possible score for this measure.

  **Step 2: Calculate the score for an arbitrary coherent $p$.**
  Let $p$ be any coherent credence function. By the definition of coherence, $p(\neg A) = 1 - p(A)$. Let $x = p(A)$, where $x \in [0, 1]$.
  Then $p(\neg A) = 1 - x$.

  Substitute these into the scoring rule:
  $$ \mathcal{I}(p, w) = (x - 0.6)^2 + ((1 - x) - 0.6)^2 $$
  $$ \mathcal{I}(p, w) = (x - 0.6)^2 + (0.4 - x)^2 $$

  **Step 3: Minimize the score for coherent $p$.**
  To see if any coherent $p$ can match $c^*$, we find the $x$ that minimizes this function. Let $f(x) = (x - 0.6)^2 + (0.4 - x)^2$.
  $$ f'(x) = 2(x - 0.6) - 2(0.4 - x) $$
  Set $f'(x) = 0$:
  $$ 2x - 1.2 - 0.8 + 2x = 0 $$
  $$ 4x = 2.0 \implies x = 0.5 $$

  The coherent credence function that minimizes inaccuracy under this rule is the uniform distribution $p(A)=0.5, p(\neg A)=0.5$.
  Let us calculate the score for this best-case coherent candidate:
  $$ \mathcal{I}(p_{best}, w) = (0.5 - 0.6)^2 + (0.5 - 0.6)^2 $$
  $$ \mathcal{I}(p_{best}, w) = (-0.1)^2 + (-0.1)^2 = 0.01 + 0.01 = 0.02 $$

  **Conclusion:**
  For every world $w$:
  $$ \mathcal{I}(c^*, w) = 0 $$
  $$ \mathcal{I}(p, w) \geq 0.02 \quad \text{for all coherent } p $$
  Thus, $0 < 0.02$. The incoherent credence function $c^*$ is strictly more accurate (has lower inaccuracy) than *every* coherent alternative in *every* possible world.

  ### 4. Violated Standard Conditions

  This scoring rule violates three standard conditions required for the Joyce-Pettigrew accuracy arguments:

  1.  **Truth-Directedness (The Alethic Principle):** This condition requires that, ceteris paribus, a credence closer to the truth value (1 if true, 0 if false) is more accurate.
      *   *Violation:* In world $w_A$, $A$ is true (value 1). The truth-directed optimal credence for $A$ should be 1. However, our rule assigns the best score (0) to $c(A)=0.6$ and penalizes $c(A)=1$ with a score of $(1-0.6)^2 = 0.16$. The rule rewards being wrong over being right.
  2.  **Normality:** This condition requires that a credence function that matches the truth values exactly (1 for truths, 0 for falsehoods) receives the optimal score (typically 0).
      *   *Violation:* The omniscient credence function $p_{omn}(A)=1, p_{omn}(\neg A)=0$ receives a score of $(1-0.6)^2 + (0-0.6)^2 = 0.16 + 0.36 = 0.52$, which is worse than $c^*$.
  3.  **Propriety:** A rule is proper if, for any probabilistic $p$, the expected inaccuracy is minimized by reporting $p$ itself.
      *   *Violation:* Because the rule is world-independent and minimized at $(0.6, 0.6)$, an agent with any probabilistic belief other than $(0.5, 0.5)$ would minimize their expected score by reporting $(0.5, 0.5)$ (the projection of the sweet spot onto the simplex) or even by reporting the incoherent $(0.6, 0.6)$ if allowed. It does not incentivize honesty.

  ### 5. Assessment: Can the Defender Rule This Out?

  **Can a defender of the dominance argument rule out this rule without assuming probabilism?**
  **Yes.**

  The defender does not need to assume *probabilism* (that credences must sum to 1) to reject this scoring rule. Instead, they appeal to the definition of **epistemic accuracy** itself.

  The accuracy-based argument for probabilism is a project in *veritistic* epistemology: it seeks to show that probabilistic coherence is instrumental to the goal of believing the truth. The constraint of **Truth-Directedness** is not a covert assumption of probabilism; it is a constitutive constraint on what counts as an *accuracy* measure.

  *   **The Argument:** If a scoring rule rates a credence of 0.6 in a falsehood as "more accurate" than a credence of 0.0 in that same falsehood, it is not measuring *accuracy* (fit between mind and world); it is measuring something else (e.g., "confidence stability" or "modesty").
  *   **Non-Circularity:** Ruling out the rule above requires only the premise that *truth is the goal of belief*. This is independent of the claim that *degrees of belief should obey the probability axioms*. The dominance theorem uses the Truth-Directedness + Propriety constraints to *derive* Probabilism. If we drop Truth-Directedness, we are no longer talking about accuracy in the epistemic sense, and the failure of the theorem is unsurprising and harmless.

  Therefore, the constraint that the scoring rule be **proper** (which, combined with continuity and convexity, typically entails Truth-Directedness) is doing the heavy lifting of ensuring the measure actually tracks truth. Without it, "accuracy" loses its normative force, and the argument correctly fails to produce probabilism. The counterexample shows that Properness is not merely a technical convenience; it is the mathematical encoding of the requirement that the scoring rule respects the truth-values of the propositions.
