answer: |-
  Dear colleagues, thank you for agreeing to referee for us. I am writing to you because we have a recurring problem with how we evaluate manuscripts that make adaptationist claims, and I want to provide you with a decision procedure that will make your reports more useful to me and to the authors. We receive roughly eighteen hundred submissions a year, and a substantial minority of these argue that a trait exists because it was selected for a particular function. Currently, your reports on these papers tend to polarize into two unhelpful modes. In the first, you invoke the spandrels critique to declare the story unfalsifiable without specifying what evidence would have satisfied you, leaving me unable to act on the report. In the second, you accept the claim because the narrative is coherent, without noticing that no alternative explanation was excluded. I am asking you to adopt a fixed sequence of questions for any manuscript whose central claim is that a trait is an adaptation. This procedure is not designed to kill adaptationism but to ground it in evidence that distinguishes selection from other evolutionary processes.

  The first thing you must determine is precisely what kind of claim the authors are making, because conflation here is the single largest source of unfair reports. You need to identify whether the paper argues for the historical origin of the trait, the current maintenance of the trait, or merely the current utility of the trait. A claim of origin argues that the trait arose because of selection for its current function. A claim of maintenance argues that the trait persists now because of selection, regardless of how it originated. A claim of utility argues only that the trait enhances fitness now, irrespective of history. A paper may legitimately answer only the third question, but it must be criticized only for the claim it actually makes. If the authors demonstrate current utility but claim historical origin without historical evidence, you must flag this as a fatal gap. If they demonstrate maintenance but claim origin, you must ask them to downgrade the claim. You cannot reject a paper for failing to prove historical origin if it only claims to demonstrate current utility, and you cannot accept a claim of historical origin based solely on current utility.

  Once you have classified the claim, the second step is to check whether the authors have identified plausible non-adaptive alternatives. The spandrels critique argues primarily against the absence of null hypotheses and the neglect of architectural by-products, allometric consequences, and phylogenetic inheritance. You do not need to see every conceivable alternative disproven, which would be impossible, but you must see the plausible rivals addressed. If the trait is morphological, have they considered allometry or developmental constraint? If the trait is behavioral, have they considered phylogenetic inertia or drift? A sufficient answer here is a clear statement of the alternative hypotheses and a reason why they are less likely than the adaptationist hypothesis. A fatal gap is the complete absence of this consideration, or the dismissal of alternatives without evidence. For example, stating that drift is unlikely because the trait is complex is not sufficient; they must show why drift cannot produce that complexity in this lineage.

  The third step is to evaluate the evidence used to exclude those alternatives. This is where you must distinguish between what can be settled from the manuscript and what requires work the authors could not reasonably have done. If the claim is about historical origin, phylogenetic comparative methods are usually required. If the claim is about maintenance, field manipulations or selection gradients are required. If the claim is about utility, physical or physiological models may suffice. You must check if the authors have used an explicit null model. For instance, if they argue a trait correlates with an environmental variable, have they shown that this correlation is stronger than expected under a model of drift or phylogenetic signal? A sufficient answer is a statistical or experimental test that favors the adaptationist hypothesis over the stated null. A fatal gap is relying on internal coherence or natural history anecdotes without comparative or experimental controls.

  There are steps in this procedure where judgment cannot be eliminated and must be returned to you as a matter of confidence rather than procedure. You must mark these explicitly in your report. For example, phylogenetic comparative methods rely on trees and models of trait evolution that are always uncertain. You cannot demand perfection, but you must state whether you are confident that the uncertainty is too high to support the conclusion. Similarly, ruling out allometry often depends on the quality of the size measurements and the appropriateness of the scaling model. If the authors have done the work but the data are noisy, you should not reject the paper solely on uncertainty; instead, you should state that your confidence is low and suggest the claim be tempered. You must also flag where the procedure risks degenerating into a demand that the authors disprove every conceivable alternative. This happens if you require them to rule out biologically implausible constraints or drift scenarios that have no precedent in the clade. Your job is to assess plausibility, not logical possibility. If an alternative is theoretically possible but biologically unsupported, the authors need not disprove it, but they should acknowledge it.

  To make this concrete, let us walk through three hypothetical submissions to see how you should apply these questions. Consider a manuscript arguing that the direction of shell coiling in a certain intertidal gastropod is an adaptation to heat load at low tide. The authors present a latitudinal correlation in coiling direction and measurements of heating rates in three-dimensional-printed model shells of reversed chirality. Applying the first step, you must ask what claim is being made. The physical models demonstrate current utility, showing that one coiling direction heats less than the other. The latitudinal correlation suggests maintenance, as the trait varies with the selective pressure. However, the paper likely implies origin. If they claim origin, this is a fatal gap because they have no phylogenetic reconstruction to show when the coiling direction changed relative to the habitat shift. A sufficient answer for a claim of utility or maintenance would be the heating data and the correlation, provided they address alternatives. For the second step, you must check if they considered alternatives. Is coiling direction constrained by development? Is it phylogenetically inherited? If the manuscript ignores whether the clade has a fixed coiling direction that cannot easily reverse, this is a fatal gap. If they acknowledge the constraint but show multiple reversals in the phylogeny, that is sufficient. For the third step, regarding evidence, the 3D printed models are excellent for utility but tell us nothing about history. You should recommend acceptance if they limit the claim to utility and maintenance, but require revision if they insist on historical origin without phylogenetic evidence. You must also note the judgment call here: the correlation does not prove causation, and you should state if you are confident the latitudinal gradient is not due to some other factor like predation.

  Now consider a second manuscript combining a phylogenetically controlled comparison across seventy species, a field manipulation that removes the trait, and an explicitly stated null model of drift and size allometry, concluding that a colour pattern in a lizard is maintained by selection for crypsis rather than being a by-product of body size. I want you to apply the procedure strictly here, even if you have theoretical reasons to prefer the by-product reading. Applying the first step, the claim is about maintenance, supported by the field manipulation. This is appropriate for the evidence provided. For the second step, the authors have explicitly addressed the by-product hypothesis via the allometry null model and the phylogenetic control. This satisfies the requirement to exclude plausible alternatives. A fatal gap would exist only if the null model was biologically unrealistic, but if it is standard for the field, it is sufficient. For the third step, the evidence includes a manipulation, which is the gold standard for maintenance. Even if you suspect the trait is a by-product, the procedure requires you to accept that the authors have adequately supported their claim of maintenance unless you can identify a flaw in their null model or manipulation. You must not reject the paper because you believe the by-product hypothesis is true; you must reject it only if the authors failed to test it. Here, they tested it. Your report should state that the claim is adequately supported, perhaps noting that while the by-product hypothesis is theoretically interesting, the data favor selection. This is a case where the procedure protects the authors from a referee's theoretical bias, ensuring that empirical work is judged on its merits rather than on prior commitments.

  Finally, consider a third manuscript concerning human social behaviour, arguing that a widespread moral emotion is an adaptation for coalition formation, supported by cross-cultural frequency data and a computational model showing that the trait would be favoured under plausible ancestral conditions. Here the comparative and phylogenetic apparatus on which much of the procedure rests is simply unavailable. You must adapt the questions honestly. For the first step, the claim is clearly about historical origin. For the second step, the authors cannot provide a phylogeny of human cultures that is robust enough to test this, nor can they manipulate moral emotions experimentally over generations. The procedure cannot adjudicate the claim of origin with the same confidence as the lizard case. You must flag this as a judgment call where uncertainty is high. A sufficient answer in this context is not proof of origin, but a demonstration of plausibility. The computational model shows that the trait could be selected, and the cross-cultural data show it is not idiosyncratic. However, this does not exclude the alternative that the emotion is a by-product of general intelligence or cultural transmission. A fatal gap would be claiming proof of adaptation without acknowledging these untestable alternatives. You should recommend that the authors downgrade the claim from is an adaptation to could be an adaptation or is consistent with selection. The procedure risks degenerating here if you demand phylogenetic controls that do not exist; instead, you must state that the claim is inherently uncertain and the manuscript should reflect that uncertainty. You are not asking them to disprove cultural drift, which is impossible, but to acknowledge that their evidence supports plausibility rather than history.

  In all three cases, your report must tell me which of the three questions the manuscript is answering and whether the evidence matches the claim. If you invoke the spandrels critique, you must specify which non-adaptive alternative was ignored. If you accept the narrative, you must specify which alternatives were excluded. Where judgment is required, such as the reliability of a phylogenetic tree or the plausibility of a null model, you must state your level of confidence rather than presenting your opinion as procedural fact. This approach will prevent the polarization that currently stalls our decision-making. It ensures that adaptationist claims are held to a high standard without making it impossible for them to pass, and it protects authors from reports that demand the impossible or accept the implausible. Please use this framework when you next encounter a manuscript arguing that a trait exists because it was selected for a function. It will help me make a fair decision and help the authors improve their work regardless of the outcome. Thank you for your time and expertise.
