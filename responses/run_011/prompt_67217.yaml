  **SCORING KEY AND INTERPRETATION**

  This instrument sorts respondents by pattern matching rather than simple tallying. Compare your selection profile against the six leaves below. Most students will cluster near one leaf, though hybrid positions are common. Two items serve as explicit tie-breakers for theoretical pairs that often blur.

  **Leaf 1: Berlin-Style Non-Interference**
  *Profile:* Predominantly **A** responses on Items 1, 2, 5, 8, 10.
  *Diagnosis:* You view freedom as the absence of actual obstacles imposed by others. If no one stops you, you are free. Capacity, power relations, and resources are secondary to the immediate option set. You distinguish sharply between being unable to do something and being prevented from doing it.
  *Awkward Commitment:* You must accept that a benevolent master who never interferes leaves their subject entirely free.

  **Leaf 2: Neo-Roman Non-Domination**
  *Profile:* Predominantly **B** responses on Items 1, 2, 4, 5, 7, 10.
  *Diagnosis:* You view freedom as security from arbitrary power. Even unexercised capacity to interfere counts as unfreedom because it creates dependency. You are sensitive to the source of constraints in another's will. *Note:* Some respondents in this cluster may select **A** on private power cases (4, 7) but **B** on public cases (5, 10), reflecting the internal republican split over whether private actors can dominate.
  *Awkward Commitment:* You must accept that a happy dependent subject is unfree simply because their master could change their mind.

  **Leaf 3: Kantian-Right Independence**
  *Profile:* Predominantly **B** on public cases (5, 6, 10) but mixed on private cases (4, 7).
  *Diagnosis:* You view freedom as independence from being subject to another's choice. Public authority threatens freedom unless it secures equal independence for all. Private contracts may look like freedom until they create status subordination requiring public law rectification. You focus on the juridical relation rather than the outcome.
  *Awkward Commitment:* You must accept that private contracts can create unfreedom that only public law can resolve without violating liberty.

  **Leaf 4: Positive Liberty (Self-Realization)**
  *Profile:* Predominantly **C** on Items 3, 6, 9.
  *Diagnosis:* You view freedom as actual self-direction or rational autonomy. Interference that tracks your genuine interests (Item 3) or arises from your own participation (Item 9) enhances freedom. You distinguish between lower-order desires and higher-order self-government. Freedom is realized when external forces align with your true will.
  *Awkward Commitment:* You must accept that forcing someone to conform to their rational interests can count as making them free.

  **Leaf 5: Capability/Effective Freedom**
  *Profile:* Predominantly **C** on Items 3, 8, 9; **B** on Item 1.
  *Diagnosis:* You view freedom as a function of what you can actually do and be. A shortfall of resources (Item 8) is itself unfreedom, not just an obstacle. You blur the line between republican non-domination and capability when systems track interests (Item 3). The size of the option set matters less than the effective power to realize functionings.
  *Awkward Commitment:* You must accept that freedom expands infinitely as human needs and capacities expand, potentially conflating freedom with welfare.

  **Leaf 6: Deflationary (Legitimacy/Justice)**
  *Profile:* Mixed responses focusing on procedure (A on 6, 9) but acknowledging constraints (B on 8).
  *Diagnosis:* You hold that freedom is not the value at issue in these cases; legitimacy, authority, or justice is doing the real work. A democratic vote (Item 6) solves the legitimacy problem, not the freedom problem. You resist categorizing resource shortfalls or private power as "unfreedom," preferring to call them injustices.
  *Awkward Commitment:* You must accept that freedom is not the primary value we fight for when challenging algorithmic governance.

  **Tie-Breakers and Unoccupied Cells**

  **Tie-Breaker 1: Item 4 (Platform Store).** This item separates Neo-Roman from Kantian-Right views on private power. Neo-Romans typically select **B** (private power dominates). Kantians may select **A** (contractual freedom) unless public law fails to secure independence. If you selected **B** here but **A** on Item 5 (Public Caseworker), your position is theoretically unstable.

  **Tie-Breaker 2: Item 3 (Traffic System).** This item separates Republicanism from the Capability view. Republicans may select **A** (non-arbitrary tracking preserves freedom). Capability theorists select **C** (effective reach enhances freedom). If you selected **B** (unfree because system chooses), you hold a strict agency view distinct from both.

  **Unoccupied Cell 1: The Private Libertarian.** Selecting **B** on private power cases (4, 7) but **A** on public power cases (5, 10). This combination is incoherent; it claims private actors dominate while state actors with identical discretionary power do not, reversing standard authority hierarchies.

  **Unoccupied Cell 2: The Proceduralist.** Selecting **A** on democratic items (6, 9) but **A** on the poverty item (8). This claims a democratic vote guarantees freedom even when capacity is nil. This is unattractive; it renders freedom empty for the destitute citizen.

  **Unoccupied Cell 3: The Benevolent Absolutist.** Selecting **A** on unexercised power items (1, 5) but **B** on the poverty item (8). This claims arbitrary power is freedom but lack of resources is unfreedom. This is inconsistent regarding the source of constraint, treating willful power as benign but material lack as coercive.
