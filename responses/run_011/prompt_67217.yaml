  **Freedom and Algorithmic Governance: Sorting Instrument**

  **Instructions:** Read each scenario carefully. Select the option that best reflects your judgment about the person's freedom. Do not worry about consistency; answer based on your immediate intuition. There are no right or wrong answers, only different commitments.

  **1. The Credit Model**
  A bank's algorithm has the standing capacity to refuse you a loan but has never exercised it against you, since you sit in its top decile.
  A. You are free; the algorithm never blocks you.
  B. You are unfree; the bank holds power over you.
  C. You are unfree; your options depend on their code.

  **2. The Employer Suite**
  An employer's monitoring suite logs everything you do but reviews the logs only when you trip a flag, under a policy reserving review to the firm's sole discretion.
  A. You are free; you haven't been punished.
  B. You are unfree; they watch at their whim.
  C. You are unfree; the surveillance limits your behavior.

  **3. The Traffic System**
  A municipal traffic system continuously reroutes you around congestion and is calibrated to destinations you genuinely want.
  A. You are free; you arrive where you wish.
  B. You are unfree; the system chooses the path.
  C. You are free; the system extends your reach.

  **4. The Platform Store**
  You operate a storefront on a platform that could remove it tomorrow with or without cause, under standards you did not help write and an appeals process on which you hold no seat.
  A. You are free; you are still selling.
  B. You are unfree; you exist at their mercy.
  C. You are unfree; you lack economic independence.

  **5. The Caseworker**
  An immigration caseworker with very broad discretion has, in every case to date, decided in the applicant's favor.
  A. You are free; you got the visa.
  B. You are unfree; you depend on their mood.
  C. You are free; the outcome matches your will.

  **6. The Digital Wallet**
  A state-issued digital wallet that the issuing authority could freeze, where you hold a full democratic vote over who runs that authority.
  A. You are free; you helped choose the rules.
  B. You are unfree; they can still freeze funds.
  C. You are free; the state acts as your agent.

  **7. The Household**
  In a household, one partner controls all income and has never once refused a request.
  A. You are free; you get what you ask.
  B. You are unfree; you must ask permission.
  C. You are unfree; you lack independent means.

  **8. The Town**
  A person is formally unrestricted in every legal respect but cannot afford to leave the town they live in.
  A. You are free; no law stops you.
  B. You are unfree; poverty blocks you.
  C. You are unfree; society failed you.

  **9. The Predictive Model**
  A predictive-policing model whose error thresholds you helped set through a participatory process, and which now constrains you.
  A. You are free; you helped set the rules.
  B. You are unfree; the algorithm constrains movement.
  C. You are free; the constraint is self-imposed.

  **10. The Dormant Statute**
  A dormant statute criminalizes something you do weekly, unenforced in living memory and repealable only by a legislature you cannot influence.
  A. You are free; no one enforces it.
  B. You are unfree; you live under a sword.
  C. You are unfree; you lack political power.

