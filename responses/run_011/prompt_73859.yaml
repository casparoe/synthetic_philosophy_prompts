      *   **Petition 8 Facts:** Conviction under "Law on Preservation of Civic Unity" (Year 9). Published, prospective, clear, fixed penalty (6 years), uniformly applied. Crime: sheltering a member of a proscribed organization (petitioner sheltered brother). Organization members subject to mass detention/killing. Petitioner lost medical licence (automatic upon conviction). Licence restoration requires conviction voided.
