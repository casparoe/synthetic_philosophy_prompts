          *   Rule B (Substantive/Natural Law): Acts are valid only if they do not instrumentalize the law to effectuate persecution or gross injustice against protected classes, regardless of formal validity. (Fits 4, 8). Strain: Decision 5 (upheld confiscatory pensions funding security apparatus).
