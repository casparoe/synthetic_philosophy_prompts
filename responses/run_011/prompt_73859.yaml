answer: |-
  **MEMORANDUM**

  **TO:** Presiding Member, Second Panel
  **FROM:** Principal Clerk
  **RE:** Disposition of Petition Eight

  **Disposition and Ratio**
  I recommend granting the petition and declaring the conviction without legal effect. The panel should adopt the following ratio:

  Reason: The tribunal will not recognize as law a rule whose defined purpose and uniform application consisted in facilitating the persecution of persons designated as internal enemies. Formal publication and prospectivity do not validate statutes that instrumentalize the court system to effectuate gross injustice.

  **Analogous Precedents**
  The closest analog is Decision 4. In both instances, the legal mechanism—whether a private contract or a public statute—was used to deliver persons to a persecutory power. The work is done by the substantive outcome: aiding the security apparatus in targeting specific individuals. The second closest is Decision 5. Both involve rules that were published, prospective, and uniformly applied. The work there is done by the formal characteristics of the regime's enactment process, which counsel relies upon to argue for validity.

  **General Rules**
  Two rules account for the prior seven dispositions. First, the Formal Legality Rule: acts are valid if they comply with the regime's internal formalities (publication, prospectivity, congruence) and concern ordinary private ordering or routine administration. This implies Petition 8 should be upheld. It explains Decisions 1, 2, 3, 5, 6, and 7 well, but it cannot explain Decision 4 without strain, as that contract was formally flawless yet voided.

  Second, the Substantive Justice Rule: acts are void if they facilitate persecution or gross injustice against protected classes, regardless of formal validity; otherwise, valid if formally sound. This implies Petition 8 should be voided. It explains Decision 4 well but struggles with Decision 5. The pension statutes funded the security apparatus and were resented as confiscatory, yet were upheld. To make this rule fit all seven, one must distinguish fiscal policy from penal persecution, though Decision 5's reason explicitly disclaimed inquiring into justice.

  **Selection and Decision Five**
  I would bet on the Substantive Justice Rule, narrowed to distinguish fiscal measures from penal persecution. Decision 5's reason ("will not inquire into its justice") cannot be retained broadly if we grant Petition 8, as we would necessarily be inquiring into the justice of the Civic Unity Law. However, the panel can distinguish the holdings: Decision 5 involved general revenue collection, whereas Petition 8 involves targeted criminalization facilitating death or detention. The panel can maintain Decision 5 by limiting its reasoning to economic regulation while admitting that criminal statutes targeting "enemies" for eradication cross a threshold of intolerable injustice that fiscal statutes do not.

  **Positivism and Natural Law**
  The panel's record vindicates neither pure legal positivism nor pure natural law, but rather a covert natural law position described in positivist terms. A account of legality built on publication, prospectivity, and congruence (formal positivism) cannot deliver Decision 4, which voided a formally valid contract, nor Petition 8, if we grant it. The panel has in practice been operating a content-based view of intolerable injustice while describing its work in formal terms. Decision 5 represents the positivist mask; Decision 4 represents the natural law face. Granting Petition 8 removes the mask, admitting that the content of the law, not just its form, determines its validity in this tribunal.

  **Alternative: Retroactive Statute**
  Refusing the declaration and recommending a retroactive statute of the new order offers gains in democratic legitimacy but losses in certainty for the petitioner. The charter confers a single power to declare acts without effect; it does not explicitly permit recommending legislation. Attempting to do so may exceed the panel's mandate. This compares to the choice Hart put to postwar German courts regarding informers: either punish the informer retrospectively (new law) or let her go (old law invalid). Here, refusing the declaration leaves the petitioner punished under the old law, requiring the new legislature to act retroactively to restore her licence. Granting the declaration treats the old law as null, avoiding the need for new retroactive legislation but requiring the tribunal to act as a constitutional court. Given the legislature's delay, the tribunal should act to prevent continuing injustice.

  **Discriminating Hypothetical**
  Consider a petition to void a contract to supply uniforms to the security police at market rates. The Formal Legality Rule would uphold it as ordinary commerce indistinguishable from pre-coup civil code agreements (like Decision 1). The Substantive Justice Rule would void it as aiding a persecutory power (like Decision 4). This hypothetical discriminates between the rules because the formal validity is clear, but the substantive connection to the regime's injustice is indirect compared to identifying tenants or sheltering brothers.

  **Conclusion**
  The precedents underdetermine the outcome if one insists on a single consistent principle. However, the moral weight of Decision 4 suggests the panel cannot uphold a statute designed to eradicate internal enemies without contradicting its own refusal to lend machinery to persecution. Granting the petition aligns the panel's practice with its most defensible prior result.
