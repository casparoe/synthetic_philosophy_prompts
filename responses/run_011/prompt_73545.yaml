prompt: |-
  Every autumn the press association in my state runs a Saturday training day for working journalists, and this year they have given me ninety minutes and a room of roughly forty people: general-assignment reporters from weeklies who have not done arithmetic in front of an audience in years, a handful of data reporters from the two dailies who are certain they already know this material, and four or five editors who will decide whether the resulting stories ever run. Projector and whiteboard, no laptops, no breakout time worth speaking of. My subject is Simpson's paradox — or, as I intend to teach it, not a parlour trick but a reporting discipline: what you do when a table reverses on you.

  I am not asking you to explain the phenomenon to me; I have that part. I am asking you to plan the ninety minutes.

  Here is the material I have in hand.

  Table 1 comes from a story I reported two years ago on a state-funded retraining scheme that ran in two formats, an intensive track and a standard track. Participants chose their own track. The outcome is placement in a job within six months.

  Career-changers: intensive track, 120 enrolled, 78 placed (65%). Standard track, 30 enrolled, 18 placed (60%).
  Recent graduates: intensive track, 40 enrolled, 36 placed (90%). Standard track, 200 enrolled, 170 placed (85%).
  Pooled: intensive track, 160 enrolled, 114 placed (71%). Standard track, 230 enrolled, 188 placed (82%).

  The intensive track looks better inside both groups and worse overall. As reported background: career-changers chose the intensive track at four to one because they were paying rent while they studied, and career-changers had weaker placement prospects going in for reasons that had nothing to do with which track they took.

  Table 2 is my candidate check for understanding, to be handed out near the end. Two reading programmes, one hundred pupils each; the outcome is passing the end-of-year test; the subgroup is whether the pupil got as far as Chapter 12 of the syllabus, which the programme itself largely determines, since Programme A is built to move pupils on quickly.

  Programme A: reached Chapter 12, 90 pupils, 54 passed (60%). Did not reach, 10 pupils, 4 passed (40%). Overall 58 of 100.
  Programme B: reached Chapter 12, 10 pupils, 8 passed (80%). Did not reach, 90 pupils, 45 passed (50%). Overall 53 of 100.

  Programme B is better inside both subgroups; Programme A is better overall. The question I want to put to the room is which programme the district should buy.

  With that in front of you, give me the plan.

  First, the order, and the dependencies inside it. What has to be true in the room before Table 1 can land as disturbing rather than as a stunt? My own guess is that no one can feel the reversal until they can see a group average as a weighted average whose weights differ between the groups being compared, and that until that is in place everything afterwards is memorisation. Tell me whether that is the right first move or too much machinery too early, and if it is the right move, how a room that has not done algebra in years gets there from a whiteboard in under fifteen minutes. State what each subsequent step rests on, and be concrete about where the ninety minutes actually goes.

  Second, the carrier. Should Table 1 be the example the whole session is built on, given that some of the people in the room may have read the story, and given that I was the reporter on it? Set out what the carrying example has to have and what it has to lack — the size and roundness of the numbers, whether the arithmetic can be done in the head or must be done on paper, whether the third variable is visible in the table or has to be introduced from outside it, whether anyone in the example is a villain. And then tell me what to make of the two examples every popular treatment opens with, the graduate-admissions table and the kidney-stone treatment comparison: whether either belongs in this session, and if I keep one, what has to be said about it that the usual tellings leave out.

  Third, the misconceptions, mapped onto the sequence rather than listed. I expect some version of: the disaggregated figure must be the true one; it is an artefact of small samples or of rounding; somebody must have massaged the data; therefore no statistic can be trusted. For each, tell me the minute at which it forms and the one thing I can say or write at that minute that prevents it, rather than the correction I would have to deliver afterwards. Then deal separately with the data reporters, whose version is that this is just confounding and they have known it since graduate school. That reflex is more dangerous than any of the others, and I want to know what to say to it at minute twenty that is neither condescending nor a retreat, and what they will still get wrong at minute eighty even if I say it well.

  Fourth, the causal question, which is where I most need judgement. Table 2 is designed so that the rule the room will have just learned produces the wrong answer, and the right answer turns on something like whether the subgroup sits upstream or downstream of the treatment. Tell me how much of that I can honestly put across to a mixed room inside ninety minutes without converting the session into a seminar on causation: what vocabulary is available to me, what vocabulary I must not use, and what I say to the reporter who asks the obvious follow-up — how am I supposed to know which of the two cases I am in, when the table itself does not tell me. If the honest answer is that ninety minutes is not enough for both halves, say so and tell me which half to sacrifice.

  Fifth, what I should leave out, and what I should say out loud that I am leaving out. Include the one thing I will be tempted to reach for — a clever chart, most likely — that would quietly undo the session, and say why.

  Finally, separate takeaways for the two audiences that matter: what a reporter should be able to do differently on Monday, and what an editor should be able to ask before approving a story whose central claim is that overall figures favour one thing over another.

  No reading list and nothing to cite; the room has no laptops and nobody will read anything afterwards. Where I need something to hand to a person who wants to go further, give me one sentence I can say aloud instead.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Goal:** Plan a 90-minute session on Simpson's Paradox for journalists (mixed skill levels: general assignment, data reporters, editors).
      *   **Constraints:** No laptops, projector + whiteboard only, no significant breakout time.
      *   **Materials:** Table 1 (Retraining scheme, real story by the instructor), Table 2 (Reading programmes, check for understanding).
      *   **Specific Questions to Answer:**
          1.  Order and dependencies (How to teach weighted averages intuitively?).
          2.  The Carrier (Should Table 1 be the main example? What makes a good example? What about Berkeley/Kidney Stones?).
          3.  Misconceptions (Pre-empting errors, handling data reporters).
          4.  The Causal Question (Upstream/Downstream, vocabulary, limitations).
          5.  What to Leave Out (The "clever chart" trap).
          6.  Takeaways (Reporters vs. Editors).
      *   **Tone:** Professional, practical, authoritative, respectful of the audience's time and constraints.

  2.  **Deconstruct the Audience & Context:**
      *   *General Assignment (GA) Reporters:* Rusty math, need intuition, need to know "what do I do Monday morning?"
      *   *Data Reporters:* Think they know it (confounding), might get bored or arrogant. Need to be challenged on the *causal* aspect, not just the math.
      *   *Editors:* Decision makers. Need to know what questions to ask to kill bad stories or save good ones.
      *   *Time:* 90 minutes is tight for this topic.
      *   *Tech:* Whiteboard is key. No laptops means no interactive calculation. Mental math or board work only.

  3.  **Address Question 1: Order and Dependencies:**
      *   *User's Hypothesis:* "No one can feel the reversal until they can see a group average as a weighted average whose weights differ..."
      *   *Verdict:* Correct. If they don't understand *why* the aggregate shifts, it's just magic.
      *   *Execution:* How to do weighted averages without algebra in 15 mins? Use physical intuition. "Heavy" groups pull the average more.
      *   *Plan:* Start with the intuition of weighting *before* showing the paradox. Use a simple non-controversial example (e.g., batting averages or class grades) to establish the mechanism, *then* reveal the paradox in Table 1.
      *   *Timing:* 0-15 mins: Weighted Average Intuition. 15-45 mins: Table 1 Deep Dive. 45-70 mins: Table 2 (Application). 70-90 mins: Causal/Editorial wrap-up.

  4.  **Address Question 2: The Carrier (Table 1 vs. Others):**
      *   *Table 1:* It's the instructor's story. Pros: Real stakes, instructor knows the context. Cons: Some might know the story, might feel like a "war story."
      *   *Decision:* Use Table 1 as the *primary* teaching tool because the instructor owns the narrative context (the "why" behind the numbers). It adds credibility.
      *   *Characteristics of a Good Example:* Round numbers (easy mental math), clear subgroups, no "villain" (avoids defensiveness), third variable visible or easily explained.
      *   *Berkeley/Kidney Stones:* Berkeley is too political/charged for a quick intro. Kidney stones is medical (distant from journalism).
      *   *Recommendation:* Stick with Table 1. It's local, relevant, and the instructor can speak to the reporting process. Acknowledge the story if someone brings it up ("Yes, I wrote that, here's how I almost got it wrong").

  5.  **Address Question 3: Misconceptions:**
      *   *GA Reporters:* "Disaggregated is always truth," "Small sample error," "Data massaging," "Stats are lies."
      *   *Pre-emption:* Address these *as they arise* during the Table 1 walkthrough.
      *   *Data Reporters:* "It's just confounding."
      *   *Risk:* They treat it as a regression problem, not a reporting problem.
      *   *Counter:* At minute 20, challenge them: "Confounding explains the *existence* of the correlation, but it doesn't tell you which number to print."
      *   *Minute 80 Risk:* They will still try to "control for everything" without thinking about causality.

  6.  **Address Question 4: The Causal Question (The Hard Part):**
      *   *Table 2 Trap:* Programme A looks better overall, but B is better in subgroups. However, the subgroup (Chapter 12) is *post-treatment* (mediator), not pre-treatment (confounder).
      *   *Vocabulary:* Avoid "Collider," "Mediator," "DAGs." Use "Before vs. After," "Cause vs. Result," "Sorting vs. Effect."
      *   *The Hard Truth:* The table *never* tells you the answer. You need reporting.
      *   *Sacrifice:* If time runs out, sacrifice the deep dive on Table 2's causal structure in favor of the "Ask the Question" protocol. The goal is *skepticism*, not *causal inference mastery*.
      *   *Answer to "How am I supposed to know?":* "You can't know from the spreadsheet. You have to call the source."

  7.  **Address Question 5: What to Leave Out:**
      *   *The Trap:* Mosaic plots or complex visualizations of the paradox.
      *   *Why:* They obscure the arithmetic intuition. If they don't get the numbers, the chart is magic.
      *   *Say Out Loud:* "I am not showing you a chart to explain this. Charts hide the weights. We need to see the counts."

  8.  **Address Question 6: Takeaways:**
      *   *Reporters:* Always ask "Who is in the big bucket?" Check subgroup sizes.
      *   *Editors:* Ask "Did the groups change size?" "Is the subgroup a result of the treatment?"

  9.  **Drafting the Plan (Iterative Refinement):**
      *   *Refining the Weighted Average Intro:* Don't use algebra. Use "pull." Imagine a tug of war. The group with more people pulls the average closer to theirs.
      *   *Refining Table 2:* This is the trickiest part. If I tell them B is better, they learn "disaggregate always wins." If I tell them A is better, they learn "aggregate wins." The truth is "It depends on the causal story." I need to make sure they don't leave thinking there's a universal rule.
      *   *Handling Data Reporters:* Give them a specific job. "Your job isn't to find the paradox, it's to explain *why* the weights differ."
      *   *Timing Check:* 90 mins is very short.
          *   0-15: Weighted Average Intuition (Whiteboard).
          *   15-45: Table 1 (The Paradox & The Reporting Context).
          *   45-65: Table 2 (The Test & The Causal Trap).
          *   65-80: The "Monday Morning" Protocol.
          *   80-90: Q&A / Data Reporter specific check-in.

  10. **Final Review against Constraints:**
      *   No laptops? Yes, whiteboard focus.
      *   No reading list? Yes, one sentence handoff.
      *   Tone? Professional, direct.

  11. **Writing the Response:** (Self-Correction during drafting)
      *   *Correction:* Make sure I explicitly answer the "Minute 20" data reporter challenge.
      *   *Correction:* Ensure I explicitly state which half to sacrifice if time is tight (Causal mechanics vs. Reporting protocol).
      *   *Correction:* Be specific about the "Villain" aspect of Table 1. It's important that the program administrators aren't necessarily lying.

  12. **Final Polish:** Check the flow. Ensure the distinction between "Confounding" (Table 1) and "Mediation" (Table 2) is clear without using jargon. (Table 1: Career status affects Track choice AND Job outcome. Table 2: Programme affects Chapter 12, Chapter 12 affects Pass rate).

  *(Self-Correction on Table 2)*: Wait, in Table 2, Programme A moves pupils quickly. So Programme A *causes* reaching Chapter 12. Reaching Chapter 12 *causes* passing. This is mediation. Controlling for a mediator hides the total effect. Programme A is actually better if the goal is getting kids through the syllabus. Programme B looks better in subgroups because it only keeps the smart kids in Chapter 12 (selection bias within the programme).
  *Wait, re-reading the prompt's Table 2:* "Programme A is built to move pupils on quickly."
  Programme A: 90 reached Ch 12 (90%). Programme B: 10 reached Ch 12 (10%).
  This means Programme A is *more effective* at getting kids to Ch 12.
  If we control for Ch 12, we are asking "Among kids who reached Ch 12, which programme is better?"
  But if Programme A *gets* more kids to Ch 12, controlling for it removes Programme A's main advantage.
  So, Table 2 is a case where the *Aggregate* (Programme A) is the right number for "Which programme should we buy?" because the subgroup is a *result* of the treatment.
  Table 1 is a case where the *Subgroup* is the right number because the subgroup (Career Changer) is a *pre-existing condition* (confounder).
  This distinction is the crux of the causal section. I must ensure this is clear.

  Okay, ready to write.s
answer: |-
  Here is the plan for your ninety minutes.

  ### First: Order and Dependencies

  Your guess is correct. If they do not understand that an overall average is a weighted average, Simpson's Paradox is a magic trick. If they understand the weights, it is arithmetic.

  **The First Move (Minutes 0–15): The Tug-of-War**
  Do not start with Table 1. Start with a blank whiteboard and a metaphor that requires no algebra.
  Draw a seesaw. Put a heavy box on one end and a light box on the other. Ask: "Where is the balance point?"
  Then replace the boxes with "Groups of People."
  *   **Step 1:** Write two numbers on the board: 10% and 90%. Ask for the average. They will say 50%.
  *   **Step 2:** Add the weights. "Group A (10%) has 1 person. Group B (90%) has 99 people." Ask for the average again.
  *   **Step 3:** Make them calculate it. $(1 \times 10 + 99 \times 90) / 100$. The answer is 89.2%.
  *   **Step 4:** The Lesson. "The overall average lives closer to the larger group. If the group sizes change, the overall average moves, even if the subgroup percentages stay exactly the same."

  **Why this must come first:**
  Table 1 cannot land as "disturbing" until they realize the "Pooled" number is not a truth, but a calculation that depends on enrollment ratios. If you show Table 1 first, the GA reporters will stare at the percentages and miss the $N$s. The $N$s are the story.

  **The Sequence:**
  1.  **Minutes 0–15:** Weighted Average Intuition (The Seesaw).
  2.  **Minutes 15–45:** Table 1 (The Paradox & The Reporting). This rests on the Seesaw. They must see that Career-Changers are the "heavy box" for the Intensive Track, dragging its average down.
  3.  **Minutes 45–70:** Table 2 (The Test). This rests on Table 1. They expect another paradox; you give them a causal trap.
  4.  **Minutes 70–90:** Protocol & Q&A. What to do Monday.

  ---

  ### Second: The Carrier

  **Use Table 1 as the primary carrier.**
  Do not switch to Berkeley or Kidney Stones.
  *   **Why Table 1 works:** It is local. It involves money and policy, which journalists understand. The numbers are round enough for mental math (120, 30, 40, 200).
  *   **The "War Story" Risk:** Since you reported it, some may know it. Turn this to your advantage. Do not present it as a finished story. Present it as a *near-miss*. "I almost wrote that the Standard Track was better. Here is the spreadsheet that stopped me." This models the behavior you want: skepticism of one's own draft.
  *   **What a carrying example must have:**
      *   **Visible Counts:** The $N$s must be in the table. If they are hidden, the paradox is invisible.
      *   **No Villain:** In Table 1, the administrators did not lie. The participants self-selected. If there is a villain, reporters stop analyzing math and start hunting for malice.
      *   **Pre-existing Subgroups:** The subgroups (Career-changer vs. Grad) must exist *before* the treatment. This is crucial for Table 1 to be a case where disaggregation is the truth.

  **On Berkeley and Kidney Stones:**
  Leave them out.
  *   **Berkeley:** Too much baggage. Reporters will get stuck on gender bias politics rather than the arithmetic.
  *   **Kidney Stones:** Too medical. The causal mechanism (stone size) is abstract to a general-assignment reporter.
  *   **If you must mention them:** Say only this: "You will read about these in textbooks. They are mathematically identical to the retraining scheme. Do not memorize the examples; memorize the question: *Who is in the big bucket?*"

  ---

  ### Third: The Misconceptions

  Map these to the timeline so you can inoculate against them.

  **1. "The disaggregated figure must be the true one." (Minute 30)**
  *   **When it forms:** Immediately after you reveal Table 1 reverses.
  *   **The Prevention:** As soon as you show the reversal, write on the board: **"Subgroups are not always truth."** Say: "Sometimes the overall number is the one you want. It depends on whether the subgroup is a cause or a result. We will prove this in the second half."

  **2. "It's small sample error / rounding." (Minute 35)**
  *   **When it forms:** When they see the 60% vs 65% split.
  *   **The Prevention:** Point to the $N$s. "200 people is not a rounding error. 30 is small, but 200 is not. The reversal happens because of the 200, not the 30."

  **3. "Somebody massaged the data." (Minute 40)**
  *   **When it forms:** When they realize the pooled number favors the Standard Track.
  *   **The Prevention:** "No one touched this data. This is what happens when people make choices. The paradox is natural, not manufactured."

  **4. "Therefore no statistic can be trusted." (Minute 45)**
  *   **When it forms:** At the end of Table 1.
  *   **The Prevention:** "Statistics are not broken. Your *comparison* was broken. You compared apples to oranges. Fix the comparison, fix the stat."

  **The Data Reporters (Minute 20)**
  *   **The Risk:** They will nod off and think, "Yes, omitted variable bias, standard confounding, I know this." They will treat it as a regression problem, not a reporting problem.
  *   **What to say at Minute 20:** Look directly at them. "You know this as confounding. You know you can control for it in a model. But you cannot put a regression model in a sidebar for a weekly reader. Your job is not to control for the variable; your job is to explain *why the weights differ*. If you can't explain why the career-changers chose the intensive track, your model doesn't matter."
  *   **What they will still get wrong at Minute 80:** They will still assume that *controlling* is always the right answer. They will fail to recognize when a variable is a mediator (Table 2). You cannot fix this in 90 minutes. You can only warn them.

  ---

  ### Fourth: The Causal Question

  This is the danger zone. Table 2 is designed to break the rule they just learned in Table 1.
  *   **Table 1:** Subgroup (Career Status) is **Upstream** (Confounding). *Solution:* Disaggregate.
  *   **Table 2:** Subgroup (Chapter 12) is **Downstream** (Mediation). *Solution:* Aggregate.

  **Vocabulary:**
  *   **Use:** "Before," "After," "Sorting," "Result," "Bucket."
  *   **Do Not Use:** "Mediator," "Collider," "DAG," "Exogenous," "Identification Strategy."

  **How much can you put across?**
  You can explain the *direction*, but not the *proof*.
  Tell them: "In Table 1, the group existed before the choice. In Table 2, the group exists because of the choice. Programme A puts kids in Chapter 12. Programme B does not. If you split by Chapter 12, you are punishing Programme A for doing its job."

  **The Reporter's Follow-up:**
  *   **Question:** "How am I supposed to know which case I am in when the table doesn't tell me?"
  *   **Answer:** "You can't know from the table. That is why you are a reporter and not a calculator. You have to ask: *Did this group exist before the treatment, or did the treatment create this group?*"

  **The Sacrifice:**
  If you run out of time, **sacrifice the mechanics of Table 2.**
  Do not let them struggle to calculate Table 2. Give them the answer. Spend the time on the *question protocol*. It is more valuable for a GA reporter to know *what to ask* than to know how to solve a mediation bias.
  *   **Priority 1:** Weighted Average Intuition (Seesaw).
  *   **Priority 2:** Table 1 (Confounding/Upstream).
  *   **Priority 3:** The Question Protocol (Monday Morning).
  *   **Drop:** Deep calculation of Table 2. Use it only as a conceptual warning.

  ---

  ### Fifth: What to Leave Out

  **The One Thing to Leave Out: The Mosaic Plot.**
  You will be tempted to draw a chart where the width of the bars represents the sample size. It visually explains the weighting.
  *   **Why you must not do it:** It requires too much explanation. It turns a number story into a design story. If they don't trust the numbers, they won't trust the ink.
  *   **What to say out loud:** "I am not showing you a chart. Charts hide the counts. I want you to look at the $N$s. If the $N$s are not in the press release, ask for them."

  **What else to leave out:**
  *   **Yule-Simpson history:** Irrelevant.
  *   **Mathematical proof:** Irrelevant.
  *   **Other examples:** One is enough.

  ---

  ### Sixth: Takeaways

  **For the Reporter (Monday Morning):**
  1.  **Never compare percentages without comparing counts.** If the press release gives you %, demand the $N$.
  2.  **Ask the "Before" Question:** "Did this subgroup exist before the policy started, or did the policy put them there?"
  3.  **The Sentence:** If you find a reversal, write: "While Group A performed better overall, Group B performed better in every category, because Group A had more high-risk participants."

  **For the Editor (Before Approval):**
  1.  **The Weight Check:** "Are we comparing a big group to a small group?"
  2.  **The Causal Check:** "Is the subgroup a cause of the outcome, or a result of the treatment?"
  3.  **The Kill Question:** "If we disaggregate this data, does the headline change? If yes, why are we running the aggregate?"

  **The One Sentence for Further Learning:**
  "If you want to go deeper, search for 'causal diagrams for journalists,' but remember: the diagram is not the story, the reporting is."
