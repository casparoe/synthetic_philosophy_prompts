answer: |-
  You have stumbled onto the open secret of political science: electoral systems are not neutral counting mechanisms; they are moral philosophies disguised as arithmetic. Your spreadsheet work has uncovered what constitutional theorists spend decades arguing about. The unease you feel is the friction between the myth of "mathematical fairness" and the reality of "political engineering."

  Here is the breakdown of the presuppositions hidden inside those two algorithms, the status of the 5% threshold, and what happens to the justification of democracy if we admit the trade-off.

  ### 1. The Leftover-Fraction Rule (Largest Remainder / Hare-Niemeyer)
  **The Presupposition: Votes as Property Rights.**

  This method presupposes that a vote is a share of ownership in the legislature. It treats the parliament as a fixed pie (the 10 seats) and the electorate as shareholders.
  *   **What is owed:** The exact fraction is treated as a debt owed to the *collective* (the party list). If a party has 15.5% of the vote, they have a property right to 1.5 seats. The system acknowledges the debt of the 0.5 immediately and prioritizes paying off the largest debts first.
  *   **The Picture of Parliament:** Parliament is a mirror. Its only job is to reflect the sociological makeup of the electorate as precisely as possible at a single moment in time.
  *   **The Flaw (The Alabama Paradox):** As you discovered, this method treats seats as independent commodities. It assumes the value of a "share" is static. But when you add a seat (10 to 11), you change the value of the quota (the price of a seat). Because the quota shrinks, the fractional remainders shift, and suddenly the "debt" hierarchy flips.
  *   **What it Rules Out:** It rules out the idea that *stability* is more important than *accuracy*. It cannot guarantee that adding resources (seats) won't punish a participant. It prioritizes the *outcome* (proportionality) over the *process* (consistency).

  ### 2. The Divisor Rule (D'Hondt / Sainte-Laguë)
  **The Presupposition: Representation as a Competitive Process.**

  This method presupposes that representation is not a static division of property, but a dynamic contest for claims.
  *   **What is owed:** We do not owe parties a specific number of seats; we owe them a *fair opportunity to compete* for seats using a consistent rule. The "divisor" (1, 2, 3...) represents the increasing cost of claiming additional representation. The first seat is cheap (divide by 1); the second is harder (divide by 2).
  *   **The Picture of Parliament:** Parliament is a working body, not just a mirror. The priority here is **monotonicity**: if you add votes, you should never lose a seat; if you add seats, no party should lose a seat. This method guarantees that the system never behaves "insanely" (like the Alabama Paradox).
  *   **The Trade-off:** To achieve this consistency, you must sacrifice exact proportionality. As you saw, the 8,000-vote party got zero. The divisor method implicitly accepts that small remainders might be wiped out to ensure the larger structure holds together. (Note: D'Hondt [1, 2, 3] favors large parties; Sainte-Laguë [1, 3, 5] is more proportional but still avoids the Alabama Paradox).
  *   **What it Rules Out:** It rules out the idea that a fraction of a seat is a moral debt. It says a party is only entitled to a seat if it can "afford" it under the divisor formula. It prioritizes the *procedure* over the *outcome*.

  ### 3. Parties vs. People
  You asked whether these rules commit you to thinking of parties, rather than people, as the units of representation. **Yes, absolutely.**

  Both systems are **Party-List PR**. In both cases, the individual voter is not the unit of account; the *bloc* is.
  *   In the **Leftover-Fraction** system, the voter is a shareholder, but they can only cash in their shares through the party vehicle. The "moral debt" is owed to the party organization as the proxy for the voters.
  *   In the **Divisor** system, the party is a competitor in a game. The voters are the fuel, but the car (the party) is what crosses the finish line.

  Both systems rule out the liberal-individualist picture of representation (common in single-member districts) where a specific person represents a specific geographic community. In your system, a voter in the north and a voter in the south are mathematically identical inputs, but they have no direct representative. They have a *share* in a representative. This is why the 5% threshold is so jarring: you cannot have a "5% threshold" on individual rights, only on collective blocs.

  ### 4. The 5% Threshold: Contradiction or Feature?
  You are right to feel that the threshold contradicts the "every vote counts" sales pitch. Theoretically, it is a **utilitarian override** on a **deontological system**.

  *   **The Theory:** Largest Remainder is deontological (rights-based): "You have a right to your share."
  *   **The Threshold:** This is utilitarian (outcome-based): "We will violate your right to a share if exercising it makes the parliament dysfunctional."

  Does it belong to the same theory? **No.** It is a patch installed to fix a bug in the theory. The "bug" is that pure proportionality leads to fragmentation, which leads to unstable coalitions (as you saw on the telly).
  *   **The "Deleted Votes" Problem:** You noted that deleting the 4,800 votes raises everyone else's share, meaning those votes effectively count *for the other side*. This is theoretically honest but morally brutal. It admits that the system is not about *justice for the voter*, but *viability for the state*.
  *   **Justification:** Proponents argue the threshold isn't about fairness, it's about **governability**. It forces voters to consolidate. It tells the electorate: "You have freedom of choice, but only within the range of choices that can form a government."

  ### 5. Is this Underdetermined?
  Is the statute just bookkeeping convention picked in 1947? **Partly, but not mostly.**

  While specific numbers (10 seats, 5% threshold) are arbitrary, the choice between Largest Remainder and Divisor is a **regime choice**.
  *   Countries that choose **Largest Remainder** (like your country, historically Israel, South Africa) usually prioritize inclusivity and the accurate mirroring of social cleavages. They accept the risk of instability.
  *   Countries that choose **Divisor Methods** (like Spain, Finland, Chile) usually prioritize governability and the consolidation of the party system. They accept the risk of excluding small minorities.

  It is not neutral. It is a choice between a parliament that *looks* like the people (even if it can't act) and a parliament that *can act* (even if it doesn't look exactly like the people). Most legislatures pick the method that benefits the parties that wrote the constitution, then claim it's just "standard math."

  ### 6. Rebuilding the Justification
  If a country admitted out loud that exactness and coherence cannot both be had, the "Every Vote Counts" story dies. It must be rebuilt on **Legitimacy through Conflict Management.**

  The new justification would look like this:
  > "We do not use Proportional Representation because it is mathematically perfect. We use it because it is the least violent way to divide power. We acknowledge that some votes will not translate to seats (thresholds) and that some mathematical paradoxes exist (apportionment). We accept these flaws because the alternative—winner-take-all—excludes half the country. We are not buying fairness; we are buying peace."

  **What would the "something else" be?**
  It would be a shift from **Representation as Rights** to **Representation as Function.**
  *   **Old Story:** "Your vote is a slice of the pie." (Implies you are owed a specific outcome).
  *   **New Story:** "Your vote is a weight in the machine." (Implies you influence the outcome, but the machine has gears that sometimes slip).

  ### Summary for your Sister
  Your sister's party lost not just because of the vote count, but because your country chose a system that prioritizes **settling debts** (Largest Remainder) over **preventing paradoxes** (Divisor), but then crippled that system with a **governability threshold**.

  *   The **Leftover-Fraction rule** told her: "You are owed 1.5 seats. We gave you 1. We owe you 0.5."
  *   The **Threshold** told the 4,800 voters: "You do not exist."
  *   The **Spreadsheet** told you: "If we had 11 seats, your sister might have lost a seat anyway."

  The unsettling truth you found is that **democracy is not a calculation; it is a negotiation.** The rulebook isn't physics; it's a contract. And like any contract, it has loopholes, trade-offs, and clauses that benefit some signatories over others. The fact that nobody makes a moral argument for it is because the moral argument is embarrassing: *We chose the math that keeps us in power, or keeps the government standing, and we called it 'fairness' so you wouldn't ask questions.*

  You did the right thing by reading the rulebook. In politics, the magic trick is always in the fine print.
