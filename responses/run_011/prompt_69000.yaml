answer: |-
  **What my verdicts are tracking**
  Your intuition is distinguishing between *selection acting on the transmission process itself* versus *constraints imposed by external reality or arbitrary coordination*. In the "Yes" cases (rhyme, recipe, rumor, plough), the trait's persistence depends on a causal chain of descent where variations are filtered by how well they survive that chain (whether via catchiness, taste, or utility). In the "No" cases (theorem, lapel widths), the stability comes either from independent convergence on a truth that anyone would find anyway (theorem) or from frequency-dependent coordination without a lineage (lapel widths). Your gut is tracking whether the stability is an *outcome* of the evolutionary process (survival of the fittest variants) or a *precondition* imposed by the world (truth) or social synchrony (fashion).

  **Candidate principles**
  1.  **The Causal Lineage Principle:** A cultural process is Darwinian only if the presence of the trait in a new host is causally explained by its presence in a previous host, rather than by independent derivation or concurrent coordination.
      *   *Motivation:* Distinguishes the **Plough** (taught/lineage) from the **Theorem** (re-derived/convergence) and **Lapel Widths** (concurrent coordination).
  2.  **The Transmission-Bias Principle:** A cultural process is Darwinian only if the differential survival of variants is caused by properties that enhance their own transmissibility, not by properties that correspond to external truth or utility independent of transmission.
      *   *Motivation:* Distinguishes the **Rumor** (distortion aids spread) from the **Theorem** (truth aids acceptance) and potentially the **Plough** (utility aids adoption).
  3.  **The Fidelity Threshold Principle:** A cultural process is Darwinian only if there exists a mechanism ensuring high-fidelity copying, such that the identity of the replicator is preserved across generations with minimal reconstruction.
      *   *Motivation:* Distinguishes the **Motto/Hymn** (high fidelity) from the **Recipe/Rhyme** (reconstructed/improvised).

  **The rumour and the theorem**
  The **Transmission-Bias Principle** is the only one that cleanly delivers both verdicts (Rumor = Yes, Theorem = No) without contradiction. In the rumor, the reconstruction *is* the selection mechanism: the distortion makes it spread better, so fitness is defined by transmissibility. In the theorem, reconstruction is an error-correction mechanism: the derivation forces convergence on an external truth, so stability is defined by validity, not fitness. The cost of this principle is that it threatens your **Plough** verdict. If the plough spreads because it ploughs better (external utility) rather than because it is easier to teach (transmissibility), this principle classifies it as non-Darwinian selection on artifacts, not evolution of replicators. You must decide if "utility to the user" counts as "fitness for the idea."

  **What I'd have to drop**
  *   **If you adopt the Causal Lineage Principle:** You keep your Plough and Rumor verdicts, but you must classify **Word Order Drift** as Darwinian (it has lineage) and **Platform Jokes** as Darwinian (they descend from prior jokes). You drop nothing from your original list, but you must accept that any tradition with a teacher-student chain qualifies, even if static.
  *   **If you adopt the Transmission-Bias Principle:** You must overturn your **Plough** and **Recipe** verdicts (No), because their survival relies on external utility/taste, not inherent transmissibility. **Word Order Drift** becomes Yes (processing ease aids transmission), but **Platform Jokes** become borderline No if they mutate to fit the platform's constraints (external utility) rather than to spread better.
  *   **If you adopt the Fidelity Threshold Principle:** You must overturn your **Recipe**, **Rumor**, and **Plough** verdicts (No), as all involve significant reconstruction or modification. **Word Order Drift** becomes No (too much drift/reconstruction), and **Platform Jokes** become No (mutation is the feature, not the bug). This leaves only the **Rhyme** and **Motto** as true Darwinian cases.
