answer: |-
  # PREP SHEET: IMPRECISE PROBABILITIES IN PATIENT SAFETY
  **Context:** Monthly Methods Forum (25 min talk + Q&A).
  **Stakes:** Adoption of imprecise probability framework for safety signals vs. shelving as "theoretical exercise."
  **Audience:** 12 Trialists/Epi, 1 Director, 2 Senior Bayesians, 1 Philosopher.

  ## THE NORTH STAR (The Single Reply That Must Land)
  *If you forget everything else, this is the sentence that keeps the project alive.*

  **"A point estimate here does not resolve the uncertainty; it only hides the assumption required to resolve it. My job is not to make the uncertainty disappear for the sake of a signature; it is to show you exactly which assumption you are signing off on."**

  ---

  ## THE OBJECTIONS (Ranked by Institutional Damage)

  ### 1. The "Decision Paralysis" Objection
  *   **Who:** The Unit Director (Signatory authority).
  *   **Phrasing:** "You've told me the risk is between 7% and 29%, and my threshold is 15%. You're explicitly telling me the data cannot support a decision. So what am I supposed to do on Monday? Do I pull the catheter or not? If your method can't tell me that, it's not a method, it's a description of a problem I already have."
  *   **The 2-Minute Answer:** "You're right that this doesn't give a single order. But a point estimate gives you a *false* order. If I tell you 7%, you keep the catheter and patients might get hurt. If I tell you 29%, you pull it and we face a shortage. This framework forces the decision onto the value judgment: 'Is avoiding a shortage worth a 1-in-4 chance of exceeding the safety threshold?' That is a policy decision, not a statistical one. I am giving you the 'break-even' point for your judgment. A point estimate pretends that judgment isn't needed."
  *   **Blunt Weakness:** It still leaves them holding the bag. They hired you to reduce their liability, not share it.

  ### 2. The "Regulatory Defensibility" Objection
  *   **Who:** Lead Clinical Trialist (Writes the letters to manufacturers/FDA).
  *   **Phrasing:** "I have to write a letter to the manufacturer citing a specific risk rate to justify a recall or a continued use. Regulatory guidelines expect a point estimate with a confidence interval. If I send them an interval of intervals, they will reject it as non-compliant. How do I translate your 'set of posteriors' into a number that survives legal scrutiny?"
  *   **The 2-Minute Answer:** "You report the upper bound of the set, which is 29%. You state clearly that this accounts for structural uncertainty in reporting. This is more defensible than reporting 7% because if an infection is found later, 7% looks like negligence, while 29% looks like prudent worst-case planning. We are trading 'precision' for 'coverage of the unknown.' In safety, coverage is the currency."
  *   **Blunt Weakness:** Regulators often hate "worst-case" arguments if they block supply chains. You might be overruling their risk tolerance.

  ### 3. The "Hyperprior" Objection (The Intellectual Killer)
  *   **Who:** Senior Bayesian #1 (Hierarchical modeler).
  *   **Phrasing:** "You're treating the reporting rate $\rho$ as a nuisance parameter with a set. But you just said you believe $\rho$ is between 0.25 and 1. That *is* a prior. Why is a uniform prior over that interval 'honest' but a Beta distribution 'dishonest'? You're just doing a sensitivity analysis with extra steps. Why not just put a weakly informative prior on $\rho$ and integrate it out?"
  *   **The 2-Minute Answer:** "A prior implies I have enough information to rank probabilities *within* that range. I don't. I know it's not below 0.25, but I have no evidence to say 0.5 is more likely than 0.8. A prior forces a ranking the data doesn't support. My set preserves the distinction between 'what we know' (the bounds) and 'what we guess' (the distribution inside). It prevents the prior from doing work the data didn't earn."
  *   **Blunt Weakness:** In practice, the decision often *does* require a ranking. If you refuse to provide one, they will pick one themselves, arbitrarily.

  ### 4. The "Standard Sensitivity" Objection
  *   **Who:** Senior Clinical Epidemiologist.
  *   **Phrasing:** "We already do this. We run a best-case/worst-case sensitivity analysis. We vary $\rho$ from 0.25 to 1 and see how the p-value changes. What do I gain by calling this 'credal sets' and 'lower previsions'? It sounds like you're rebranding standard practice to justify a dissertation."
  *   **The 2-Minute Answer:** "Standard sensitivity analysis treats the bounds as scenarios. Imprecise probability treats the bounds as the *object* of inference. The difference is in the updating. When new data comes in, a sensitivity analysis just recalculates the endpoints. My framework propagates the imprecision through the likelihood correctly, preventing the 'washing out' of the prior that happens when you treat bounds as fixed scenarios. It ensures the uncertainty doesn't artificially shrink just because $N$ got bigger."
  *   **Blunt Weakness:** For $N=41$, the difference is negligible. You are selling a Ferrari to drive to the grocery store.

  ### 5. The "Bounds Justification" Objection
  *   **Who:** Philosopher-of-Statistics.
  *   **Phrasing:** "You've set the reporting rate lower bound at 0.25. That's a precise number. Where did it come from? If it's an expert elicitation, that's a prior. If it's a guess, it's arbitrary. You haven't removed the subjectivity; you've just moved it from the center of the distribution to the edge of the set."
  *   **The 2-Minute Answer:** "It comes from the audit data on transfer rates and coding discrepancies. It's an empirical bound, not a belief distribution. I am not claiming 0.25 is the 'true' value, only that values below it are inconsistent with the audit. That is a falsifiable claim, whereas a prior mean is not."
  *   **Blunt Weakness:** The audit data is likely messy. If they poke a hole in the 0.25, the whole set collapses.

  ### 6. The "Dilation" Objection (Your Fear)
  *   **Who:** Philosopher-of-Statistics or Senior Bayesian #2.
  *   **Phrasing:** "One property of imprecise models is dilation—where observing new data can actually *widen* the posterior interval compared to the prior. If I collect more safety data, could your method tell me I know *less* than I did before? How do I explain that to a clinician?"
  *   **The 2-Minute Answer:** "Dilation happens when the data is non-informative about the nuisance parameter. If that occurs, it means the new data is misleadingly precise. I would rather tell you that the data is misleading than let you believe you have certainty. However, with binary safety data like this, dilation is unlikely to be severe. The interval will usually shrink, just slower than a precise model."
  *   **Blunt Weakness:** You have to check for dilation before the meeting. If this specific model dilates, you are dead in the water.

  ### 7. The "Coverage" Objection
  *   **Who:** Trialist (Frequentist leanings).
  *   **Phrasing:** "What is the frequentist coverage of this set? If the true rate is 10%, how often does your interval contain it? If you can't guarantee 95% coverage, this is just a Bayesian method with worse calibration."
  *   **The 2-Minute Answer:** "Imprecise probabilities aren't designed for long-run frequency calibration of a single parameter; they are designed for robustness against model misspecification. The 'coverage' here is that the set contains the true posterior for *any* valid reporting rate. It covers the model uncertainty, not just the sampling variability."
  *   **Blunt Weakness:** To a frequentist, "robustness" sounds like "I didn't check the error rate."

  ### 8. The "Resource Cost" Objection
  *   **Who:** Unit Director or Trialist.
  *   **Phrasing:** "This takes more time to explain, more time to compute, and yields a harder decision. Why should my team adopt this workflow for every safety signal when the standard method works 99% of the time?"
  *   **The 2-Minute Answer:** "You don't use this for every signal. You use it when the decision is close to the threshold and the data is known to be lossy. This is a specialized tool for the 'grey zone,' not a replacement for standard control charts. It saves resources by preventing unnecessary recalls on false precision."
  *   **Blunt Weakness:** Defining the "grey zone" requires judgment. They will ask you to define it, and you'll be back to square one.

  ---

  ## CONCESSION STRATEGY

  **CONCEDE IMMEDIATELY (Buy Credibility):**
  *   **"This is harder to use."** Admit it. Don't sell it as "easy." Sell it as "necessary for hard cases."
  *   **"The bounds are subjective."** Admit the 0.25 comes from judgment/audit interpretation. If you claim it's objective truth, the Philosopher will eviscerate you.
  *   **"It doesn't make the decision for you."** Acknowledge the Director's burden. You are providing the map, not driving the car.

  **CANNOT CONCEDE (Lose the Proposal):**
  *   **"A point estimate is valid here."** If you agree a point estimate is acceptable, your whole talk is useless.
  *   **"The interval is too wide to be useful."** If you agree it's useless, they shelve the work. You must argue the width is a *feature* (honesty), not a bug.
  *   **"We should just pick the middle."** Do not let them collapse the set to a midpoint during Q&A.

  ---

  ## THE DREADED QUESTION
  *This is the one you flagged. It combines the Bayesian objection with a trap about "virtue signaling."*

  **The Question:**
  (Asked by Senior Bayesian #1, leaning back, friendly tone)
  *"Look, I get the philosophical appeal. But practically, if you're willing to rule out values below 0.25, you have information. If you have information, you have a distribution, even if it's flat. By refusing to specify one, aren't you just forcing the Director to mentally pick a point inside your interval anyway? Isn't this just 'hiding the prior' behind a set, but without the mathematical convenience of actually integrating it?"*

  **The Trap:**
  If you say "Yes," you admit a prior is better. If you say "No," you admit the Director has to do the math you refused to do.

  **Your Answer:**
  "You're right that they have to make a judgment. But there is a difference between *making* a judgment and *smuggling* one. If I put a prior on $\rho$, the math integrates it out and the output looks clean. The Director sees '7%' and thinks it's data-driven. If I give the set, they see '7% to 29%' and they know *they* have to choose. I am not hiding the prior; I am forcing the assumption to be visible in the final output, not buried in the model structure. It's not about mathematical convenience; it's about audit trails for decisions."

  **Why this works:** It appeals to the Director's need for liability protection (audit trails) and validates the Bayesian's math while rejecting their conclusion. It frames "convenience" as a risk factor.
