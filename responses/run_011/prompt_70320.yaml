answer: |-
  ### Brainstorming the Neighborhood

  Okay, I'm pacing the carriage mentally. You're describing a theory that survives falsification not by lying, but by absorbing reality. It's not a zombie theory in the usual sense because it keeps walking on fresh legs (new tech). It's not standard dogma because it accepts the data (yes, yields went up) but reinterprets the timeline.

  Here are the concepts I'm pulling off the shelf, and why they don't quite fit:

  1.  **Ad Hoc Hypothesis:** This is the closest standard term. An ad hoc hypothesis is added to save a theory from falsification without independent support.
      *   *Where it misses:* Your Point 1. Haber-Bosch *has* independent support. It's not a invented entity; it's a historical fact. Standard ad hocery is usually "invisible angels pushed the planet." This is "a real tractor drove through." The rescue is empirically robust, just temporally convenient.
  2.  **Lakatosian Degenerating Research Programme:** Lakatos distinguishes between the "hard core" (unchangeable) and the "protective belt" (adjustable auxiliaries). A programme degenerates when it only explains past anomalies without predicting new facts.
      *   *Where it misses:* It captures the structure, but not the *rhetorical flip* (your Point 4). Lakatos says degenerating programmes are bad science. He doesn't account for the phenomenon where the degeneration is marketed as *depth*. Also, Lakatos focuses on novel predictions; your example is about the *absence* of predicted disaster being explained away as "temporary."
  3.  **Moving the Goalposts:** Colloquial. Implies cheating.
      *   *Where it misses:* It misses the sincerity. The Malthusian isn't necessarily cheating; they genuinely believe the constraint is real, just delayed. It also misses the "Real Offset" nuance. You can't move goalposts with a real tractor.
  4.  **The Duhem-Quine Thesis:** You can't test a hypothesis in isolation; always testing a bundle.
      *   *Where it misses:* Too broad. This explains *why* you can save a theory (blame the auxiliaries), but not the specific pattern of *indefinite temporal deferral* backed by *real technological surprises* that are then claimed as proof of insight.
  5.  **Prophetic Delay / When Prophecy Fails:** (Festinger et al.) Cognitive dissonance when a prediction fails.
      *   *Where it misses:* That's psychological/sociological (cults). It doesn't capture the *scientific* veneer. Your example uses data and engineering, not faith.
  6.  **Normal Science (Kuhn):** Puzzles are solved within the paradigm.
      *   *Where it misses:* Malthusianism isn't the dominant paradigm here; it's the challenger that won't die. Also, Kuhnian normal science doesn't usually book failures as credits.

  **Verdict:** There is a gap. The existing terms either imply the rescue is fake (Ad Hoc) or don't capture the specific epistemic reward structure (booking failure as depth). You need a term that captures the *validity* of the rescue combined with the *immunity* it grants.

  ### The Name: **The Deferral Dividend**

  I'm coining this. It captures the economic metaphor of the "credit" you mentioned (Point 4) and the mechanism (Deferral).

  **Definition:**
  The Deferral Dividend is an epistemic pattern where a falsified prediction is preserved by invoking a *real, post-hoc offsetting factor*, resulting in the theory gaining perceived explanatory depth rather than losing credibility.

  **Necessary and Sufficient Conditions:**

  1.  **Core Constraint:** The theory posits a hard, unavoidable limit (e.g., resources vs. population).
  2.  **Failed Prediction:** The limit fails to materialize within the predicted timeframe.
  3.  **Real Offset:** The explanation for the failure cites a specific, empirically verifiable factor that was *not* specified in the original model (e.g., specific technology, policy).
  4.  **Temporal Shift:** The core claim is not amended, only the timeline. The limit is still "inevitable," just later.
  5.  **Epistemic Credit:** The failure is framed as evidence of the theory's robustness (i.e., "We saw through the temporary boom"), rather than a strike against its validity.

  **What counts as an instance:**
  *   **Malthus:** Famine didn't happen -> Green Revolution (Real Offset) -> "Famine still coming, we were just masked" (Credit).
  *   **Peak Oil (various dates):** Oil didn't run out -> Fracking/Deepwater (Real Offset) -> "Supply still finite, just delayed" (Credit).
  *   **AI Winter (various):** AGI didn't happen -> Compute scaling/Transformers (Real Offset) -> "AGI still coming, just harder than thought" (Credit).

  **What does NOT count:**
  *   **Standard Model Adjustment:** A theory predicts a particle at 100GeV, doesn't find it, checks equipment, finds a calibration error, predicts 120GeV. (This is legitimate calibration, not a structural deferral).
  *   **Paradigm Shift:** Newtonian physics fails at high speeds -> Relativity replaces it. (The core claim *is* amended).
  *   **Pure Ad Hoc:** "The famine didn't happen because God intervened." (Offset is not empirically verifiable).

  ### Boundary Cases: Legitimate Update vs. Deferral Dividend

  This is the crucial test for your column. How do we distinguish a rational scientific update from the Deferral Dividend?

  **The Test of Independent Predictive Work:**
  *   **Legitimate Update:** During the deferral period, the theory generates *new, distinct* predictions that are verified. The "offset" becomes part of a refined model that does work elsewhere.
      *   *Example:* Climate models. They predict warming. Aerosols mask some warming (Real Offset). The models are updated to include aerosols. These updated models then successfully predict regional cooling patterns or volcanic impacts. The offset isn't just a shield; it's a tool.
  *   **Deferral Dividend:** The theory goes silent on *what else* is true. It only speaks to the timing of the crash. The offset is used *only* to explain the absence of the crash, not to predict other phenomena.
      *   *Example:* Malthusianism doesn't predict *which* tech will save us, only that it will run out. It consumes the explanation of the Green Revolution without producing new predictions from it.

  **The Test of Specificity:**
  *   **Legitimate Update:** The deferral comes with a checkable marker or an expiry condition. "Yields will plateau when phosphorus hits X cost."
  *   **Deferral Dividend:** The deferral is open-ended. "It will happen when the offset fails." (Which is tautological).

  **The Test of Burden:**
  *   **Legitimate Update:** The theorist takes the burden to define the offset's limits *before* they are reached.
  *   **Deferral Dividend:** The burden shifts to the skeptic to prove the offset is *infinite*.

  ### Addressing Point 4 (The Credit Booking)

  You asked if this belongs inside the phenomenon or is separate. It is **integral**. Without the credit booking, the pattern is just "being wrong and updating." The Deferral Dividend *is* the conversion of negative evidence into positive capital.

  If a Malthusian said, "I was wrong about the date, my model needs work," that's standard science. The pathology arises specifically when they say, "I was wrong about the date, which proves I understand the *deep structure* better than the optimists." The credit booking is the fuel that allows the deferral to continue indefinitely. It prevents the theory from ever entering a "crisis" phase.

  ### Pushback on Your Description

  You described this as pathological. I want to push back slightly: **Complex systems often behave this way legitimately.**

  In ecology or economics, "constraints" are often real but mediated by feedback loops that are hard to model in advance. If a theory says "Resource X limits Growth" and then "Tech Y extends Resource X," the core constraint (Resource X is finite) might still be true, even if the timeline is wrong.

  The pathology isn't the deferral itself. It's the **refusal to update the probability of the core claim.**

  If I predict a crash in 1980, and it doesn't happen because of a real offset, Bayesian rationality suggests I should lower my confidence in the "inevitability" of the crash, not just move the date. The Deferral Dividend allows the confidence level to remain at 100% while the date slides. *That* is the specific epistemic sin. It's not that they moved the goalposts; it's that they kept the odds the same despite the game changing.

  ### Summary for the Column

  **Name:** The Deferral Dividend.

  **The Hook:** It's when being wrong makes you look deeper.

  **The Mechanism:** Real, unpredictable offsets save the theory from falsification.

  **The Tell:** The theory gains status from its failures, and the burden of proof shifts to skeptics to prove a negative about the future (that the offset will last forever).

  **The Test:** Does the theory do new work during the deferral, or does it just wait for the crash? If it's just waiting, you're paying a Dividend on a debt that never comes due.

  This should give you the carve-out you need. It's specific enough to be useful, but broad enough to cover Malthus, Ehrlich, and probably a few current tech hype cycles too.
