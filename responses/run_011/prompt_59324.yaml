      *   *Objection 8 (The Hard Formalist - Round 2):* If you can't point to it, it's not stratigraphy. It's history.

      *Refining the Order:* The Formalist's attack on the boundary definition is existential to the geological claim. The Historian's attack on the "lag" undermines the moral/scientific validity. The Philosopher's attack on the analogy undermines the theoretical framework.

  4.  **Developing Replies & Soft Spots:**
