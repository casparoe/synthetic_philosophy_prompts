  MEMORANDUM

  TO: Research Ethics Board
  FROM: Chair, Research Ethics Board
  DATE: October 23, 2023
  SUBJECT: Decision Memo regarding Protocol 24-B (Chronic Pain Neural Decoding)

  This memo communicates the Board's decision regarding the proposed chronic pain study involving macaques and implanted neural decoders. While the scientific objective to objective nociceptive states via brain-computer interfaces is methodologically sound, the protocol's ethical framework contains a fundamental flaw regarding welfare monitoring. The Board has voted to approve the study only with strict conditions that remove the tiered welfare system.

  The central ethical conflict arises from the protocol's stratification of subjects into communicative and non-communicative tiers. Animals failing to meet performance criteria on the touchscreen symbol board are classified as non-communicative and subjected to reduced post-operative analgesia assessment. The Principal Investigator justifies this using a Cartesian framework, arguing that without language production, there is no positive reason to attribute thought or felt pain to the subject. Consequently, the burden of proof lies on those attributing pain rather than those discounting it.

  We must engage this argument on its own terms. The Principal Investigator relies on a rigid interpretation of the beast-machine hypothesis, suggesting that without language, behavior is merely mechanical. However, this overlooks nuances in Descartes' own correspondence. In his letters to Newcastle and More, Descartes conceded that animals possess passions and physical sensations driven by animal spirits and blood flow, even if they lack reflective thought or rational soul. He acknowledged that animals exhibit fear, anger, and physical distress, distinguishing these passions from pure intellect. By reducing welfare monitoring based on a lack of symbolic communication, the protocol conflates the capacity for reflective thought with the capacity for suffering. Even under a strict Cartesian view, the presence of passions warrants protection from distress, regardless of linguistic output.

  Furthermore, the reliance on the neural decoder to establish communicative status is philosophically unstable. If the decoder output is merely a trained association between neural firing and symbols, a Cartesian could dismiss it as a complex reinforced response, indistinguishable from a parrot mimicking speech. If the output is accepted as genuine language, then the failure to perform becomes a measure of training efficacy, not ontological status. The protocol treats a failure to report pain as evidence that there is nothing to report. This collapses the critical distinction between no report is available and there is nothing to report. The inability of a subject to manipulate a touchscreen does not negate the physiological reality of nociception. To treat the absence of data as evidence of absence of pain is a logical error with direct welfare consequences.

  However, the Board acknowledges the strength of the opposing view, represented by the Attending Veterinarian and half the Board. They argue correctly that species-specific grimace scales and behavioral pain scoring are often unreliable and heavily anthropomorphic. Human observers frequently project emotional states onto animals based on facial expressions that may not correlate with internal states. The Principal Investigator's methodological point is valid: a decoded neural signal may indeed provide more objective evidence of affective state than a human interpreting a monkey's face. Dismissing this technological advantage solely due to philosophical discomfort would hinder scientific progress. The decoder could potentially improve welfare by detecting pain earlier than behavioral observation allows.

  Nevertheless, objective data cannot justify reduced care standards. The potential for better detection does not license the assumption of non-sentience in subjects who fail the interface training. Therefore, the Board cannot approve the protocol as written. The tiered analgesia assessment schedule creates an unacceptable risk of untreated pain based on a philosophical presumption rather than veterinary evidence.

  To proceed, the following conditions must be met and are enforceable by the administrative staff:

  First, the tiered welfare system must be eliminated. All subjects, regardless of touchscreen performance or communicative classification, must receive identical post-operative analgesia assessment schedules. This includes mandatory behavioral scoring at standard intervals and mandatory re-evaluation by the veterinary staff if any distress indicators are present.

  Second, the neural decoder data must be utilized as an adjunct to, not a replacement for, standard veterinary judgment. If the decoder indicates pain but behavioral signs are absent, the default action must be to treat for pain. Conversely, if behavioral signs are present but the decoder is silent, the animal must still be treated. The burden of proof for withholding analgesia remains on the researcher, regardless of the animal's performance tier.

  Third, the protocol must be amended to remove all language suggesting that failure to perform implies a lack of sentience or reduced moral status. The justification for the study must rely on methodological utility, not ontological hierarchy.

  These conditions ensure that while we pursue innovative methods for understanding pain, we do not compromise the fundamental duty of care owed to every subject. The scientific merit of the decoder does not override the ethical requirement to presume pain in the presence of nociceptive stimuli.

  Verdict: APPROVE WITH CONDITIONS — The elimination of tiered welfare monitoring is required to ensure subject safety regardless of communicative performance.
