answer: |-
  # ADVERSARIAL COLLABORATION: THE COMMON PRIOR ASSUMPTION

  **Date:** October 26, 2023
  **Parties:** Camp A (Harsanyi–Aumann), Camp B (Permissivist / Anti-CPA)
  **Status:** Agreed for Signature

  ## 1. JOINT CLAIMS ON MECHANICS AND FORMALISM

  Both camps affirm the following technical claims regarding the standard model of interactive epistemology. Disagreements regarding the *interpretation* or *normative force* of these claims are reserved for Section 2.

  1.  **Type Space Structure:** A standard type space consists of a set of states $\Omega$, a set of agents $I$, and for each agent $i$, a partition $\Pi_i$ of $\Omega$ (representing information) and a probability measure $P_i$ on $\Omega$ (representing beliefs).
  2.  **The Prior:** In this framework, a "prior" is a probability measure $P$ on $\Omega$ from which each agent's conditional beliefs are derived via Bayesian updating on their private information cell. Formally, for any event $E$ and cell $\pi \in \Pi_i$ with $P(\pi) > 0$, $P_i(E | \pi) = P(E \cap \pi) / P(\pi)$.
  3.  **The Common Prior Assumption (CPA):** The CPA holds if and only if there exists a single measure $P$ such that for all agents $i \in I$, $P_i$ is the Bayesian conditionalization of $P$ on $\Pi_i$.
  4.  **Aumann's Agreement Theorem:** If the CPA holds, and if it is *common knowledge* between agents what their posterior probabilities for a specific event are, then those posterior probabilities must be identical.
  5.  **Relaxations (Continuity):** Both camps accept the following mathematical relaxations of the theorem:
      *   **Approximate Priors:** If agents' priors are $\epsilon$-close (in total variation distance), and posteriors are common knowledge, then posteriors are $\delta$-close (where $\delta$ scales with $\epsilon$).
      *   **Common $p$-Belief:** If the requirement of "common knowledge" is weakened to "common $p$-belief" (where $p < 1$), there exists a bound on the divergence of posteriors that tightens as $p \to 1$.
  6.  **Testability:** From inside an agent's own reasoning, the CPA is not directly testable. An agent can always model themselves as having a unique prior and model others as having different priors due to different information. Testing the CPA requires an external view of the type space or a comparison of betting behaviors across the group.
  7.  **Betting Characterization:** The existence of a common prior is mathematically equivalent to the non-existence of a "Dutch Book" among the agents. Specifically, a common prior fails to exist if and only if there exists a set of state-contingent transfers summing to zero such that every agent expects a strictly positive gain from their transfer given their private information.

  ## 2. DISAGREEMENTS TABLE

  | Disagreement | Camp A (Harsanyi–Aumann) | Camp B (Permissivist / Anti-CPA) | Verdict |
  | :--- | :--- | :--- | :--- |
  | **Source of Prior Differences** | Differences in priors between rational agents are necessarily artifacts of differences in information (broadly construed) or errors in reasoning. Rationality + Total Evidence $\rightarrow$ Unique Prior. | Priors encode rational permissibility parameters (e.g., simplicity weights, risk tolerance, innate dispositions) that evidence does not fix. Rationality + Total Evidence $\rightarrow$ Set of Admissible Priors. | **Real.** Disagreement on whether evidence uniquely determines rational belief. |
  | **Normative Status of CPA** | The CPA is a substantive normative ideal. Persistent disagreement under common knowledge implies at least one party is irrational (updating error, motivated reasoning, or evidence neglect). | The CPA is a structural assumption, not a normative requirement. Persistent disagreement under common knowledge is possible between fully rational agents. | **Real.** Disagreement on the obligations of rational agents. |
  | **Interpretation of Aumann's Theorem** | The theorem diagnoses error. If rational agents disagree, the antecedent (Common Knowledge) must fail, or one is irrational. The theorem explains *why* we ought to converge. | The theorem describes informational constraints. It shows what happens *if* priors are common, but does not compel priors to be common. It explains the *structure* of disagreement, not the *obligation* to end it. | **Verbal/Real Hybrid.** Both agree on the math; disagree on whether the theorem implies a duty to converge. |
  | **Meaning of "State"** | A state of the world should include all payoff-relevant facts and all facts about the agents' epistemic starting points. Differences in "starting points" should be modeled as informational differences within the state. | A state of the world should be restricted to external, objective facts. Epistemic starting points (priors) are properties of the agents, not the world, and should not be absorbed into the state space to save the CPA. | **Verbal.** Disagreement on the ontology of the state space $\Omega$. |

  ## 3. CRUXES AND WORKED ANALYSIS

  This section identifies specific questions where resolution would shift the position of one or both camps. It includes the required worked analysis of the "Alice-Bo" toy case.

  ### 3.1 Worked Crux: The Alice-Bo Consistency Test

  **The Setup:**
  *   **States:** $\Omega = \{1, 2, 3, 4\}$.
  *   **Alice's Partition:** $\{\{1, 2\}, \{3, 4\}\}$.
  *   **Bo's Partition:** $\{\{1, 3\}, \{2, 4\}\}$.
  *   **Alice's Conditionals:**
      *   On $\{1, 2\}$: $P_A(1) = 3/4, P_A(2) = 1/4$.
      *   On $\{3, 4\}$: $P_A(3) = 3/4, P_A(4) = 1/4$.
  *   **Bo's Conditionals:**
      *   On $\{1, 3\}$: $P_B(1) = 3/4, P_B(3) = 1/4$.
      *   On $\{2, 4\}$: $P_B(2) = 1/4, P_B(4) = 3/4$.

  **Algebraic Verification of Common Prior:**
  We seek a probability distribution $P = (p_1, p_2, p_3, p_4)$ such that the conditionals above are generated by conditioning $P$ on the respective partitions.
  1.  Alice on $\{1, 2\}$: $p_1 / (p_1 + p_2) = 3/4 \implies p_1 = 3p_2$.
  2.  Alice on $\{3, 4\}$: $p_3 / (p_3 + p_4) = 3/4 \implies p_3 = 3p_4$.
  3.  Bo on $\{1, 3\}$: $p_1 / (p_1 + p_3) = 3/4 \implies p_1 = 3p_3$.
  4.  Bo on $\{2, 4\}$: $p_2 / (p_2 + p_4) = 1/4 \implies p_4 = 3p_2$.

  Substituting (1) and (4) into (2):
  $p_3 = 3(3p_2) = 9p_2$.
  Substituting this result into (3):
  $p_1 = 3(9p_2) = 27p_2$.
  But from (1), we have $p_1 = 3p_2$.
  Therefore, $3p_2 = 27p_2$, which implies $p_2 = 0$.
  If $p_2 = 0$, then $p_1, p_3, p_4 = 0$.
  **Result:** No valid probability distribution exists. The Common Prior Assumption fails for this belief structure.

  **Follow-Up 1: Common Knowledge Analysis**
  *   **Question:** Does the failure of the CPA here force an "Agreeing to Disagree" scenario (Common Knowledge of Posteriors with Divergence)?
  *   **Analysis:** We calculate the finest common coarsening of the partitions (the Join).
      *   1 is linked to 2 (Alice) and 3 (Bo).
      *   2 is linked to 4 (Bo).
      *   3 is linked to 4 (Alice).
      *   All states $\{1, 2, 3, 4\}$ are connected. The Join is the trivial partition $\{\Omega\}$.
  *   **Implication:** The only events that are common knowledge are $\emptyset$ and $\Omega$. Alice and Bo cannot have common knowledge of their specific posteriors (e.g., "Alice assigns 3/4 to state 1") because this is not constant across the join.
  *   **Joint Conclusion:** This space fails the CPA, *but* it also fails the Common Knowledge of Posteriors condition. Therefore, Aumann's theorem is not violated (the antecedent is false). This demonstrates that a failure of the CPA does not automatically generate a situation of common knowledge of disagreement.
  *   **Camp A Interpretation:** The lack of common knowledge saves rationality. If they communicated to establish common knowledge, they would discover the inconsistency and be forced to revise.
  *   **Camp B Interpretation:** The example shows that rational agents can inhabit a belief structure with no common prior without ever triggering the "disagreement is irrational" alarm, because the informational structure prevents the disagreement from becoming common knowledge.

  **Follow-Up 2: The Betting Condition**
  *   **Question:** Since no common prior exists, can we construct a Dutch Book (zero-sum bets where both expect positive gain)?
  *   **Construction:** Let $f(\omega)$ be the payment from Bo to Alice in state $\omega$. We need $E_A[f | \Pi_A] > 0$ and $E_B[-f | \Pi_B] > 0$ (which implies $E_B[f | \Pi_B] < 0$).
  *   **Solution:** Let $f = (-1, 10, 2, -5)$ for states $(1, 2, 3, 4)$.
      *   **Alice's Expectation:**
          *   Cell $\{1, 2\}$: $0.75(-1) + 0.25(10) = 1.75 > 0$.
          *   Cell $\{3, 4\}$: $0.75(2) + 0.25(-5) = 0.25 > 0$.
      *   **Bo's Expectation (Payoff is $-f$):**
          *   Cell $\{1, 3\}$: $0.75(1) + 0.25(-2) = 0.25 > 0$.
          *   Cell $\{2, 4\}$: $0.25(-10) + 0.75(5) = 1.25 > 0$.
  *   **Result:** A Dutch Book exists. Both agents expect to profit from the bet ex-ante (relative to their information).
  *   **Camp A Interpretation:** This proves at least one agent is irrational. A rational agent should not accept a bet that is part of a sure-loss set, even if they don't see the loss from their partition.
  *   **Camp B Interpretation:** This proves the agents have different priors. Since different priors are permissible, accepting the bet is permissible. The "sure loss" only materializes relative to a hypothetical common prior that neither agent accepts.

  ### 3.2 Theoretical Crux: The "Vacuousness" Debate

  **The Issue:** One side claims the CPA is vacuous (any prior difference can be redescribed as an information difference). The other claims it is restrictive (type spaces without common priors exist).

  **Joint Clarification:**
  Both claims are mathematically defensible depending on the boundary of the "state."
  *   **Restrictive Claim:** True if the state space $\Omega$ is fixed *ex ante* to represent objective world-states. On a fixed $\Omega$, the linear constraints imposed by a common prior are non-trivial (as shown in 3.1).
  *   **Vacuous Claim:** True if the state space $\Omega$ is allowed to expand to include "types" or "prior-dispositions" as part of the state description. If we define a state to include "Alice has prior $P_A$ and Bo has prior $P_B$," then the difference is informational (agents know their own type).
  *   **Remaining Disagreement:** The fight is not about math, but about modeling ethics. Camp A argues that absorbing priors into states hides the normative problem. Camp B argues that refusing to absorb priors into states arbitrarily restricts the model of rationality.
  *   **Crux Question:** Is a model that absorbs priors into the state space *explanatorily useful*, or does it merely define the problem away?
      *   **Camp A Prediction:** Absorbing priors reduces predictive power. It makes the model compatible with any behavior, rendering it unfalsifiable.
      *   **Camp B Prediction:** Absorbing priors increases descriptive accuracy. It acknowledges that "starting points" are facts about the agents that function like information in decision-making.

  ### 3.3 Methodological Crux: Improper and Finitely Additive Priors

  **The Issue:** Does allowing priors to be improper (integrating to infinity) or merely finitely additive (not countably additive) resolve the tension?

  **Joint Analysis:**
  *   **Mathematical Consequence:** Allowing improper priors removes the guarantee that a common measure exists, even for consistent belief structures. It allows agents to agree on likelihood ratios while disagreeing on absolute probabilities.
  *   **Camp A Position:** This does not rescue the normative claim. If agents use improper priors, they remain vulnerable to Dutch Books (or "weak" Dutch Books) unless their improper measures are proportional. If they are not proportional, the irrationality diagnosis remains.
  *   **Camp B Position:** This rescues the descriptive claim. It formalizes the intuition that agents can share all evidence (likelihoods) but differ on "weights" (priors) without contradiction. It shifts the disagreement from "Who is wrong?" to "Which regularization is appropriate?"
  *   **Crux Question:** Does the vulnerability to Dutch Books in the improper prior case constitute a decisive normative argument against Camp B?
      *   **Camp A Prediction:** Yes. Rational agents must avoid sure losses. If improper priors allow sure losses, they are irrational.
      *   **Camp B Prediction:** No. The "sure loss" relies on a countable additivity assumption or a specific limiting process that agents need not accept. Rationality does not require countable additivity.

  ### 3.4 Empirical Crux: Persistent Forecaster Disagreement

  **The Scenario:** Well-calibrated forecasters and prediction-market participants share the same public evidence and know each other's numbers (posters are public), yet hold steady different probabilities for months.

  **Camp A Prediction:**
  *   **Diagnosis:** This is evidence that **Common Knowledge of Posteriors does not obtain**.
  *   **Reasoning:** Either the forecasters do not truly know the others' models (hidden information), or they suspect the others are not well-calibrated (doubt about rationality), or they are not updating on the fact of disagreement itself (updating error).
  *   **Falsification Condition:** If it is demonstrated that agents fully trust each other's rationality, have access to each other's full models, and still do not converge, Camp A must concede a failure of the uniqueness of rational priors.

  **Camp B Prediction:**
  *   **Diagnosis:** This is evidence that **Rational Priors are not Unique**.
  *   **Reasoning:** The forecasters have different legitimate prior weights on hypotheses (e.g., structural stability vs. rapid change). Knowing the other's number does not compel me to adopt it, because I know their prior differs from mine and I am permitted to keep mine.
  *   **Falsification Condition:** If it is demonstrated that forecasters *do* converge when the "prior-sensitive" elements of the evidence are made explicit, Camp B must concede that the disagreement was informational, not prior-based.

  **Joint Commitment:**
  Both camps agree to treat the outcome of this empirical observation as follows:
  *   If convergence occurs upon full transparency: Camp B concedes the disagreement was informational (supporting Camp A's modeling strategy).
  *   If divergence persists despite full transparency and trust: Camp A concedes the CPA is not a necessary condition for rationality (supporting Camp B's normative stance).

