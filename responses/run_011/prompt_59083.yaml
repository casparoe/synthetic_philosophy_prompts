prompt: |-
  You've taught decision theory to undergrads for years and you're good at building live games that make the formal stuff actually land. Help me out with one.

  I'm running an 75-minute upper-level seminar, 18 students, and I want an activity on the absent-minded driver problem. The setup I have in mind: the driver is heading home on a road with exactly two exits, and once he's on it he can't tell one exit from the other — no signs, no memory of whether he's already passed one. Taking the first exit is worth 1 point, the second is worth 4, blowing past both is worth 0.

  Here's the staging trick I want you to build on (or trash if you have something better): instead of one student playing the driver sequentially, I put two students in separate corners of the room, each one "an instance" of the driver, and a coin flip decides which of them is standing at the first exit. Both write CONTINUE or EXIT on a slip at the same time and hand it in sealed, so neither knows where they are or what their other self did. That turns one person's planning problem into a common-interest game between two copies of him, and I think they'll run into the planning-vs-in-the-moment tension themselves instead of hearing about it from me.

  Before you write the activity, do the arithmetic and show it to me briefly: what mixture maximizes the payoff as seen from the driveway, and what should a student standing at an intersection do given a belief about what their other self will do? I want to check your design against the numbers. Also tell me whether you'd change my payoffs so the optimal plan is easy to roll on a d6, and what that does to the math.

  Then give me: rules and roles, a points scheme that needs no real money, a minute-by-minute timeline, how many rounds to run before the pattern actually shows up, and a debrief that maps specific moments of play onto the difference between what's rational to plan and what looks rational once you're there — the thing I want them walking out with is that the gap isn't a willpower problem. Two things I especially want you to be straight about: what my sealed-simultaneous staging destroys relative to the real problem (I have a suspicion it has to do with when the second student gets called in — is there a variant that puts it back?), and what will predictably go wrong the first time I run this with a room full of smartasses.

  No reading list or citations, just something I can run Tuesday.
