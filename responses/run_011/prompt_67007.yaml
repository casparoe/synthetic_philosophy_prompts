  [Stand at the podium, arrange notes, smile at the room.]

  Good evening. For those who don't know me, I'm a colleague. For those who do, I'm the one who usually owes her coffee. We are here to honor thirty-six years of work, but mostly to honor the person who did the work.

  Looking around this room, I see a map of her intellectual life. There are the philosophers who know the technical architecture of her view. There are the neuroscientists who have spent a decade trying to find where that architecture collapses. And there is her family, who loved her regardless of whether her mind was a machine, a substance, or a trick of the light.

  She asked me to be exact. So I will be. She spent her career defending a higher-order view. She held that a mental state is not conscious simply because it exists. A signal in the brain is not yet an experience. An experience occurs only when the subject represents themselves as being in that state.

  [Pause slightly, look toward the brother and family.]

  I know that sounds abstract. Here is what it means for a human life. Consider a dream where you lose someone you love. You wake up, and the loss never happened. There was no event in the world to match your grief. On many views, that grief is an illusion, a shadow of a real thing. On her view, the grief was real. Why? Because the thought "I am suffering" was present. The representation did not need to match the world to constitute the experience. The seeming *was* the being. If you think you are in pain, you are in pain, even if the nerve is cut. The experience is made by the thought about the state, not the state itself.

  She knew this made consciousness cheap. She was generous about who might have it. Fish, perhaps. Machines, if they monitored themselves. But she was strict about what it required.

  [Smile, look at the husband.]

  She insisted that an empty higher-order thought still creates a real experience. I told her, "So, if I think I'm giving a wonderful tribute right now, I am having the experience of giving a wonderful tribute, even if I'm not?" She said, "Exactly." So, for the next few minutes, please enjoy my excellent speech.

  [Pause for laughter.]

  To the neuroscientists at her table: you fought her hard. You called her theory unfalsifiable. She called your models incomplete. You were adversaries, but you were hers. She believed that friction produces heat, and heat is better than cold indifference. She respected your skepticism because it forced her to sharpen her own.

  [Turn slightly to the family.]

  To her husband, her children, and her brother: she left specific instructions for this part. She knew that on her account, consciousness depends on function. She knew that under heavy sedation, when the higher-order states lapse, the subject lapses. She did not want us to lie to you. She did not want us to promise that she will still be "in there" when the thinking stops. She believed that would be a falsehood.

  But she also knew this is a room of love, not a seminar. She did not want us to announce her cessation as a verdict. She wanted the difficulty carried, not dissolved. She asked us not to offer comforts her theory cannot support, but also not to let the theory strip away the weight of your loss. You can hold the truth of her mind alongside the truth of your grief without forcing them to agree.

  [Pause. Soften tone.]

  And so, for the final moment, I will say nothing about consciousness. I will say nothing about metaphysics. I will speak only of what is visible to every account of the world represented in this building.

  Whatever you believe the mind is, you know what it is to be changed by another person. She changed us. She took raw students and made them colleagues. She took adversarial collaborators and made them friends. She took complex problems and made them clear. That impact does not depend on higher-order representations. It does not depend on neural correlates. It is a fact in the world, as solid as this building.

  She taught us to think clearly. She taught us to speak honestly. And she taught us that even when the theory ends, the care remains. Thank you.
