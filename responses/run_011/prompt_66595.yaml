prompt: |-
  I write literary novels — close third person, heavy interiority, mostly books where somebody does something bad and everyone in the book plus the reader has to work out how much of it is on them. So I'm not looking for the true theory of moral responsibility. I'm looking for the spec: what any theory of moral responsibility has to be able to do before it's the least use to me at the desk. Write me the desiderata. For each requirement, give the case that motivates it — a situation in a novel where the requirement actually bites — and say whether it's non-negotiable or just something one camp has decided to insist on.

  Things I know I care about, use or discard as you see fit: a character has to be able to change and still be answerable for what he did before; the reader has to be able to resent someone whose whole temperament is explicable from his upbringing without that resentment turning out to be a kind of error; a narrator has to be able to give a character's reasons from the inside and still have them count as reasons rather than symptoms; blame has to survive the discovery that, given who he was and where he stood, only one move was available to him — because that discovery is usually the best scene in the book. And: I have never managed to write a self-made self and I've never read a convincing one, which sounds a lot like Strawson's point about causa sui except mine is a craft problem, not a metaphysical one — are those one problem or two seperate ones wearing the same coat? I'd like that answered explicitly.

  Then the part I actually want most: which of these requirements cannot be satisfied together. If some subset of the list is jointly unsatisfiable, lay out the collision and say which requirement I'd have to drop to keep the others, and what a novel loses when it's dropped. Tell me which single requirement does the most to knock out candidates, and flag anything on the list that turns out to be a prejudice of one side rather than a real constraint on a theory. After that, briefly — a paragraph each, no more — how the Basic Argument, the reactive-attitudes line descended from his father's essay, and plain compatibilism do against the list. Score them on usefulness to a novelist, not on truth; I'll do the truth part myself.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** A literary novelist writing close third-person, high interiority novels about moral ambiguity (someone does something bad, assignment of blame is the core tension).
      *   **Goal:** Not looking for the "true" theory of moral responsibility, but the *spec* (desiderata) a theory must meet to be useful at the writing desk.
      *   **Specific Requirements:**
          *   List desiderata (requirements).
          *   For each: Provide a motivating fictional case (where it "bites").
          *   Label as "Non-negotiable" or "Camp-specific/Prejudice".
          *   Address the "self-made self" issue (Strawson's *causa sui* vs. craft problem).
          *   **Crucial Part:** Identify incompatibilities (which requirements cannot be satisfied together).
          *   Identify the "killer constraint" (which one knocks out the most candidates).
          *   Flag prejudices vs. real constraints.
          *   Evaluate three specific frameworks: The Basic Argument (Galen Strawson), Reactive Attitudes (P.F. Strawson), and Plain Compatibilism.
          *   **Scoring:** Usefulness to a novelist, not metaphysical truth.
          *   **Constraint:** The evaluation of the three frameworks must be brief (a paragraph each, no more).

  2.  **Deconstruct the Novelist's Needs (The "Spec"):**
      *   *Interiority vs. Objectivity:* The narrator knows the character's reasons, but they must remain *reasons*, not just *symptoms* of psychology.
      *   *Change vs. Continuity:* A character can grow, but past blame must stick.
      *   *Determinism vs. Resentment:* Even if a character's actions are determined by upbringing/temperament, the reader must be allowed to feel resentment without feeling foolish.
      *   *Inevitability vs. Agency:* The "best scene" is realizing the character *had* to do it, yet they are still blameworthy.
      *   *The "Self-Made Self":* The user admits they can't write a *causa sui*. Is this a metaphysical block or a craft block?

  3.  **Drafting the Desiderata:**
      *   *Requirement 1: The Reason/Symptom Distinction.* (Motivation: A character explains why they lied. Is it a choice or a neurosis?)
      *   *Requirement 2: The Persistence of Blame.* (Motivation: Character reforms in Act III, but Act I victim still deserves justice.)
      *   *Requirement 3: Resentment Without Error.* (Motivation: Reader hates the villain, then learns the villain was abused. Reader shouldn't feel tricked into hating.)
      *   *Requirement 4: The Inevitability Clause.* (Motivation: The "only one move was available" scene.)
      *   *Requirement 5: The Non-Causa-Sui Constraint.* (Motivation: Characters must feel real, not magical.)

  4.  **Addressing the "Self-Made Self" Question:**
      *   User asks: Is the inability to write a *causa sui* a craft problem or the metaphysical *causa sui* problem?
      *   *Analysis:* In fiction, a character who creates themselves ex nihilo feels fake (bad craft). In metaphysics, a self-creating self is impossible (bad logic). They are the same structural problem: infinite regress of will.
      *   *Verdict:* They are the same problem wearing the same coat. Acknowledging this is vital for the novelist.

  5.  **Identifying Incompatibilities (The Collision):**
      *   *The Core Conflict:* Requirement 3 (Resentment without error) + Requirement 4 (Inevitability) vs. Requirement 5 (No *causa sui*).
      *   Actually, the bigger clash is between *Inevitability* (Determinism) and *Reason/Symptom Distinction* (Agency).
      *   If "only one move was available" (Req 4), then the "reasons" look like "symptoms" (violating Req 1).
      *   If we keep Resentment (Req 3), we need Agency. If we keep Inevitability (Req 4), we lose Agency.
      *   *The Killer Constraint:* Requirement 4 (The Inevitability Clause). This is the specific literary thrill the user wants ("that discovery is usually the best scene"). But metaphysically, it kills responsibility.
      *   *What gets dropped?* To keep the novel working, you usually have to drop the *metaphysical rigor* of Inevitability while keeping the *aesthetic* of it. Or, you drop the idea that Resentment is "correct" and make it tragic.
      *   *Prejudice Check:* "Resentment without error" is a compatibilist prejudice. Hard incompatibilists say resentment *is* an error if determinism is true.

  6.  **Evaluating the Frameworks (Briefly):**
      *   *The Basic Argument (Galen Strawson):* Destroys responsibility. Ultimate responsibility requires *causa sui*. Impossible.
          *   *Usefulness:* Low. It solves the metaphysics but kills the plot.
      *   *Reactive Attitudes (P.F. Strawson):* Focuses on our practices of blaming. We can't turn off resentment.
          *   *Usefulness:* High. Validates the reader's emotion even if metaphysics is shaky.
      *   *Plain Compatibilism:* You are responsible if you act on your desires without external coercion.
          *   *Usefulness:* Medium. Good for plot mechanics, but fails the "Inevitability" test (if you could have done otherwise, the "only one move" scene loses punch).

  7.  **Refining and Polishing (Iterative Process):**
      *   *Tone:* Needs to be sharp, literary, slightly philosophical but grounded in craft. No fluff.
      *   *Structure:* Follow the prompt's order strictly.
      *   *Check:* Did I answer the *causa sui* question explicitly? Yes.
      *   *Check:* Did I identify the unsatisfiable subset? Yes.
      *   *Check:* Are the framework evaluations one paragraph each? Yes.

      *(Self-Correction during drafting)*: I need to make sure I don't just give philosophy. I need to talk about *writing*. The "case that motivates it" must sound like a novel scene.
      *(Refining the Incompatibility)*: The real tension is between *The Inevitability Clause* and *The Reason/Symptom Distinction*. If the character *had* to do it, their reasoning is just physics. If it's just physics, the reader's resentment is misplaced (violating Resentment Without Error). So, 3, 4, and 1 are in tension.
      *(The "Killer")*: The Inevitability Clause is the one that breaks standard theories. Most theories say "if you couldn't do otherwise, you aren't responsible." The novelist says "I need them responsible *because* they couldn't do otherwise."

  8.  **Final Review against Constraints:**
      *   Desiderata with cases? Yes.
      *   Non-negotiable vs. Camp? Yes.
      *   Self-made self answer? Yes.
      *   Incompatibilities laid out? Yes.
      *   Killer constraint identified? Yes.
      *   Prejudices flagged? Yes.
      *   Three frameworks evaluated (1 paragraph each)? Yes.

  9.  **Final Polish:** Ensure the voice matches the user's (intellectual, precise, slightly weary of metaphysics).

  *(Drafting the response...)*
  *   *Desiderata 1: The Reason/Symptom Boundary.* Case: Confession scene.
  *   *Desiderata 2: The Diachronic Anchor.* Case: Redemption arc.
  *   *Desiderata 3: Resentment Without Error.* Case: Villain backstory.
  *   *Desiderata 4: The Inevitability Clause.* Case: The "no choice" realization.
  *   *Causa Sui:* Same coat.
  *   *Collisions:* 1, 3, and 4 cannot coexist logically.
  *   *Frameworks:* Basic Argument (Useless), Reactive Attitudes (Best fit), Compatibilism (Functional but shallow).

