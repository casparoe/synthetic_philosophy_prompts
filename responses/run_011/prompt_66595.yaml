answer: |-
  ### The Spec: Desiderata for a Working Theory of Blame

  **1. The Reason/Symptom Boundary**
  *   **The Requirement:** The narrative must be able to present a character's internal justification for an act such that it reads as a *choice* rather than a *diagnosis*, even when the narrator knows the psychological causes.
  *   **The Case:** A character lies to protect their reputation. The narrator knows the character is pathologically narcissistic due to childhood neglect. If the theory treats the lie purely as a symptom of the narcissism, the tension evaporates; it's just illness. The theory must allow the lie to remain a moral breach *despite* the diagnosis.
  *   **Status:** **Non-negotiable.** Without this, you are writing medical case studies, not novels. Interiority collapses if thoughts are merely neurological weather.

  **2. The Diachronic Anchor (Persistence of Blame)**
  *   **The Requirement:** A character must be able to undergo significant moral transformation without voiding the debt incurred by their past self.
  *   **The Case:** In Act III, the protagonist achieves genuine remorse and behavioral change. In Act I, they ruined a friend's life. If the theory suggests the "new" person is not the "old" person (or that reform cancels debt), the victim's grievance becomes nonsensical. The theory must anchor identity enough to carry the debt across the transformation.
  *   **Status:** **Non-negotiable.** This is the engine of the redemption arc. If blame doesn't stick across time, there is no story, only a series of unconnected episodes.

  **3. Resentment Without Error**
  *   **The Requirement:** The reader's emotional reaction (anger, judgment) must remain valid even after the character's determinants (upbringing, temperament, trauma) are fully revealed.
  *   **The Case:** The reader spends 200 pages hating a cruel patriarch. In the final chapter, we learn he was brutalized by his own father. If the theory dictates that understanding the cause nullifies the blame, the reader's prior resentment is retroactively framed as ignorance or cruelty. The theory must allow understanding and condemnation to coexist.
  *   **Status:** **Camp-specific (Compatibilist/Strawsonian).** Hard incompatibilists would say resentment *is* an error once determinism is acknowledged. But for the novelist, this is functionally non-negotiable; if the reader feels tricked into their own emotion, the book fails.

  **4. The Inevitability Clause**
  *   **The Requirement:** Blame must survive the revelation that, given the character's constitution and circumstances, no other action was genuinely possible.
  *   **The Case:** The "best scene" you described. The character stands at the precipice, and the narrative weight proves they *could not* step back. They jump. If the theory requires "could have done otherwise" (Principle of Alternative Possibilities) to assign blame, this scene exonerates the character. You need a theory where inevitability intensifies rather than negates responsibility.
  *   **Status:** **Non-negotiable (for your specific project).** This is the specific aesthetic effect you are chasing. Most philosophical theories fail this immediately.

  **5. The Non-Causa-Sui Constraint**
  *   **The Requirement:** The theory must not require the character to have created their own will ex nihilo.
  *   **The Case:** Any moment of "decision." If the character has to be the ultimate originator of their own desires to be responsible, no character can ever be responsible.
  *   **Status:** **Non-negotiable.** As you noted, you cannot write a self-made self. It reads as false.

  ***

  ### The Self-Made Self: One Coat or Two?

  They are the same problem wearing the same coat. The metaphysical impossibility of *causa sui* (you cannot cause yourself to exist before you exist to do the causing) is identical to the craft impossibility of writing a self-made self (a character who acts without prior motivation reads as random, not free). In fiction, "random" is the death of agency just as surely as "determined" is. If a character's choice pops out of nowhere, it's not a choice; it's a glitch. You cannot write *causa sui* because readers intuitively understand the metaphysical block: we know people are made of what happened to them. Acknowledging this is not a failure of imagination; it is a commitment to realism.

  ***

  ### The Collision: What Cannot Be Satisfied Together

  Here is the hard constraint: **Requirements 1, 3, and 4 are jointly unsatisfiable under strict logical scrutiny.**

  *   **The Collision:** If **The Inevitability Clause (4)** is true (they could not have done otherwise), then their internal justifications are effectively post-hoc rationalizations of a determined outcome. This dissolves **The Reason/Symptom Boundary (1)**; the "reason" becomes a "symptom" of the causal chain. If the reason is a symptom, then the reader's anger is misdirected, violating **Resentment Without Error (3)**.
  *   **The Sacrifice:** To keep the novel working, you must drop the *metaphysical literalism* of Requirement 4 while keeping its *aesthetic*. You must write the scene *as if* it was inevitable, but structure the moral ecosystem *as if* alternatives existed.
  *   **What Is Lost:** You lose philosophical consistency. You cannot have a system that is logically airtight and emotionally satisfying in the way you describe. The novel must rest on a productive contradiction: the character *had* to do it, and they *chose* to do it.
  *   **The Killer Constraint:** **The Inevitability Clause (4).** This is the requirement that knocks out the most candidates. Standard Compatibilism fails here (it insists you could have done otherwise if you wanted to). The Basic Argument fails here (it says inevitability kills responsibility). Only the Reactive Attitudes approach survives, by sidestepping the truth claim entirely.
  *   **The Prejudice:** **Resentment Without Error (3)** is the prejudice. It is a demand that the universe validate human emotion. A cold universe does not care if your resentment feels like an error. Insisting it isn't an error is a humanist insistence, not a logical one.

  ***

  ### Framework Evaluations

  **The Basic Argument (Galen Strawson)**
  *Usefulness Score: 1/10.*
  This is the wrecking ball. It argues that because you cannot be *causa sui*, you can never be ultimately responsible. For a novelist, this is paralyzing. It validates your inability to write a self-made self, but it renders the rest of your manuscript void. If you adopt this spec, every scene of moral reckoning becomes a scene of mistaken identity. It is metaphysically robust but narratively fatal. It solves the truth problem by deleting the story.

  **Plain Compatibilism**
  *Usefulness Score: 5/10.*
  This defines freedom as acting according to your desires without external coercion. It saves the Reason/Symptom Boundary and the Diachronic Anchor. However, it fails your Inevitability Clause. Compatibilism insists that if the character wanted to do otherwise, they *could* have. This neuters the tragedy of the "only one move was available" scene. It makes the character too agile, too capable of choice. It keeps the blame but loses the fatalism you crave. It is good for plot mechanics, bad for tragic depth.

  **Reactive Attitudes (P.F. Strawson)**
  *Usefulness Score: 9/10.*
  This framework argues that responsibility is not a metaphysical fact but a feature of human relationships (resentment, gratitude, forgiveness). We cannot turn these attitudes off, so they are valid by default. This satisfies your Resentment Without Error and allows you to keep the Inevitability Clause as a background fact that doesn't cancel the foreground emotion. It treats the "Reason/Symptom" divide as a social practice rather than a physical law. It allows you to write the contradiction (determined but blameworthy) without calling it a lie. It is the only theory that treats the novel's emotional reality as data rather than error.
