answer: |-
  Here is the instrument. It is designed to be run on a dossier of historical facts, not on a person's intuition. It forces a single causal family by prioritizing "hard" constraints (law, money) over "soft" constraints (psychology, argument), on the theory that hard constraints determine *timing* better than soft ones.

  ### The Norm Cessation Decision Tree

  **Node 1: The Enforcement Constraint**
  Did a new state apparatus (police, inspectorate, licensing board, specific tax) with the *proven capacity* to punish the practice exist and activate *before* the sharp decline in prevalence began?
  *   **YES:** Go to Leaf 5 (Coercion).
  *   **NO:** Go to Node 2.

  **Node 2: The Viability Constraint**
  Did the net economic return for the primary beneficiaries of the practice turn negative or decline significantly *before* the sharp decline in prevalence began? (Rely on economic historian consensus, not contemporary claims).
  *   **YES:** Go to Leaf 4 (Interest Convergence).
  *   **NO:** Go to Node 3.

  **Node 3: The Distinction Test**
  Did the practice become significantly *more* common among lower-status groups immediately before the high-status group abandoned it?
  *   **YES:** Go to Leaf 7 (Positional/Fashion).
  *   **NO:** Go to Node 4.

  **Node 4: The Insider Exit**
  Did the first significant drop in participation come from the high-status insiders whose identity was tied to the practice, rather than from outsiders or marginalized groups?
  *   **NO:** Go to Node 6 (Generational Drift).
  *   **YES:** Go to Node 5.

  **Node 5: The Private Record**
  In private correspondence, diaries, or closed-door minutes (not public speeches), did the quitters describe the practice as "shameful/degrading" (status loss) or "barbarous/sickening" (visceral reaction)?
  *   **"Shameful/Degrading":** Go to Leaf 2 (Honor Restructuring).
  *   **"Barbarous/Sickening":** Go to Leaf 3 (Sensibility Shift).

  **Node 6: The Latency Test**
  Were coherent moral arguments against the practice available in the public sphere for more than 50 years prior to the cessation without producing significant decline?
  *   **YES:** Go to Leaf 6 (Generational Drift).
  *   **NO:** Go to Leaf 1 (Rational Persuasion).

  ---

  ### The Leaves (Explanation Families)

  1.  **Rational Persuasion:** The arguments were new or finally landed; moral learning caused the change.
  2.  **Honor Restructuring:** The practice became incompatible with high status; insiders quit to protect standing.
  3.  **Sensibility Shift:** The visceral threshold for suffering lowered; people couldn't stand to watch/know anymore.
  4.  **Interest Convergence:** The practice stopped paying; material interest drove the change.
  5.  **Coercion:** The state made it impossible or ruinously risky; enforcement drove the change.
  6.  **Generational Drift:** No active conversion; the old cohort died and the new one didn't bother.
  7.  **Positional/Fashion:** The signal lost value due to mass adoption; elites quit to distinguish themselves.

  ---

  ### The Tie-Break Rule

  **The Hard Constraint Priority:**
  If the facts satisfy the conditions for multiple leaves, assign the cause highest on this hierarchy:
  **Coercion > Interest > Fashion > Honor > Sensibility > Drift > Persuasion.**

  *Reasoning:* A law or a loss of profit makes a practice *impossible* or *suicidal* immediately. Psychology and argument make it *unpleasant* or *wrong* gradually. To explain a specific historical *endpoint* (why it stopped *then*), the hard constraint is the proximate cause. Soft constraints explain the *direction* of the wind; hard constraints explain why the ship sank *today*.

  ---

  ### Indistinguishable Pairs & Required Evidence

  **1. Honor Restructuring vs. Positional/Fashion**
  *   **The Problem:** Both involve elites abandoning a practice to maintain status.
  *   **The Tree's Separation:** Node 3 (The Distinction Test).
  *   **Why it might fail:** If the practice spread downwards and upwards simultaneously.
  *   **Evidence Needed:** Demographic data on adoption rates by class. If the lower classes adopted the practice *before* the elites dropped it, it is Fashion. If the elites dropped it *while* it was still exclusive to them, it is Honor. (e.g., Dueling was never a "mass" practice, so it cannot be Fashion).

  **2. Honor Restructuring vs. Sensibility Shift**
  *   **The Problem:** Both involve insiders quitting due to psychological discomfort.
  *   **The Tree's Separation:** Node 5 (The Private Record).
  *   **Why it might fail:** People confuse shame with disgust in language ("It's disgusting" can mean "It's beneath me").
  *   **Evidence Needed:** Contextual analysis of "disgust." If the disgust is directed at the *suffering of the victim*, it is Sensibility. If the disgust is directed at the *actor's own behavior* ("I acted like a brute"), it is Honor. Appiah's cases usually hinge on the latter.

  ---

  ### Empty Cells (Impossible/Unstable Outputs)

  **1. Coercion without Interest or Honor Support**
  *   **Output:** The state bans something that is still profitable and honorable to the elite, and the ban *sticks* without totalitarian violence.
  *   **Status:** **Unstable.**
  *   **Why:** If a practice is profitable and honorable, elites will evade enforcement or overthrow the enforcers (see: Prohibition, Dueling laws in the 18th century). For Coercion to be the *sole* leaf, the state must have overwhelming monopoly on violence *and* the elites must be indifferent. This rarely happens in liberalizing societies.

  **2. Rational Persuasion without Latency**
  *   **Output:** Arguments appear and work immediately (Latency < 50 years).
  *   **Status:** **Rare/Unexplored.**
  *   **Why:** Norms are sticky. If arguments work instantly, it usually implies a pre-existing shift in Interest or Honor made the audience receptive. "Pure Persuasion" is often a post-hoc rationalization for a shift that happened for other reasons.

  **3. Fashion without Elite Abandonment**
  *   **Output:** Lower classes adopt a practice, but elites keep it.
  *   **Status:** **Incoherent.**
  *   **Why:** By definition, Fashion dynamics require the elite to flee the signal once it loses exclusivity. If they keep it, it's a Tradition or a Universal, not a Fashion cycle.

  ---

  ### Test Cases

  #### Case 1: Britain Ending the Atlantic Slave Trade (1807)
  *   **Node 1 (Enforcement):** Did the West Africa Squadron exist *before* 1807? **NO.** (Established 1808 to enforce the ban).
  *   **Node 2 (Viability):** Did sugar/slave profits decline *before* 1807? **DEBATABLE/NO.** (Eric Williams argues Yes; recent economic history suggests profits were stable or rising. For the tree, we must take the consensus: Viability was **NO**).
  *   **Node 3 (Distinction):** Did slave trading become a "lower class" activity before 1807? **NO.** (Still dominated by powerful merchants).
  *   **Node 4 (Insider Exit):** Did the traders quit voluntarily before the law? **NO.** (They lobbied against it until the vote).
  *   **Node 6 (Latency):** Were arguments available >50 years prior? **YES.** (Quaker arguments from 1750s).
  *   **Node 6 Result:** **Generational Drift.**
  *   *Correction:* Wait, Node 4 was "Did the first drop come from insiders?" The traders didn't quit. The *Parliament* voted. Who is the practitioner? The Merchant. They didn't quit; they were banned.
  *   *Re-evaluating Node 1:* Was there *political* capacity? The Vote is the enforcement. But the question is "capacity to punish *before* decline." The decline happened *at* the vote.
  *   *Re-evaluating Node 2:* If we accept the Williams thesis (profits falling), it's Interest. If we accept the Appiah thesis (profits stable, honor shifted), we need to find the Honor path.
  *   *Tree Path:* Node 1 (No) -> Node 2 (No, per Appiah/Recent Hist) -> Node 3 (No) -> Node 4 (No, merchants fought it) -> Node 6 (Yes, arguments existed since 1750s).
  *   **Tree Output:** **Generational Drift.** (Because the practitioners didn't convert, they were legislated against, but enforcement didn't exist *before*).
  *   *Wait, this reveals a flaw.* If the State bans it, that's Coercion. But Node 1 asks if enforcement existed *before* the decline. The decline *was* the law.
  *   *Adjustment for Tree Logic:* If the Law *is* the decline, Node 1 is YES.
  *   **Revised Path:** Node 1 (Yes, Parliament passed the act).
  *   **Tree Output:** **Coercion.**
  *   *Critique:* This ignores *why* Parliament passed it. But the tree prioritizes Hard Constraints.
  *   **Final Tree Output:** **Coercion.** (Because without the Act, the trade continued).

  #### Case 2: Disappearance of Dueling among English Gentlemen (1840s)
  *   **Node 1 (Enforcement):** Did police/army courts punish duelists *before* the 1840s decline? **NO.** (Laws existed but were ignored; the Duke of Wellington's intervention was social, not legal).
  *   **Node 2 (Viability):** Did dueling stop paying? **N/A.** (It was always a cost).
  *   **Node 3 (Distinction):** Did lower classes start dueling? **NO.** (Remained elite).
  *   **Node 4 (Insider Exit):** Did high-status insiders quit first? **YES.** (Army officers and aristocrats stopped accepting challenges).
  *   **Node 5 (Private Record):** Did they call it "shameful" or "sickening"? **YES.** (Letters cite it as "unbecoming," "brutish," "bad for the service").
  *   **Tree Output:** **Honor Restructuring.**
  *   *Note:* The Army Council withdrew support. To be an officer was to be a gentleman; to duel was to lose officer status. This fits Appiah perfectly.

  #### Case 3: England Moving Executions Inside Prisons (1868)
  *   **Node 1 (Enforcement):** Did the state have capacity to move them? **YES.** (Prisons were state-run).
  *   **Node 2 (Viability):** N/A.
  *   **Node 3 (Distinction):** Did public hanging become a lower-class spectacle? **YES.** (Crowds became rowdy, "criminal class" dominated the audience).
  *   **Node 4 (Insider Exit):** Did elites stop attending? **YES.** (They found the crowds vulgar).
  *   **Node 5 (Private Record):** Dickens and others wrote it was "demoralizing," "shocking," "disgusting."
  *   **Tie-Break:** Node 1 says Coercion (State moved them). Node 3 says Fashion (Elites fled the crowd).
  *   **Rule:** Coercion > Fashion.
  *   **Tree Output:** **Coercion.**
  *   *Nuance:* The State used its capacity to enforce a *Sensibility* preference of the elites.

  ---

  ### Diagnosis of the Instrument

  **Most Plausible Misdiagnosis:** **Case 1 (Slave Trade).**
  *   **Why:** The tree outputs **Coercion**. This satisfies the "Cynic" in you (arguments are press releases, law is the only thing that matters), but it fails to explain *why* the law passed in 1807 and not 1757. Coercion is the *mechanism* of cessation, but not the *cause* of the mechanism. The tree privileges the "how" over the "why."
  *   **The Missing Node:** **"The Trigger Event."**
      *   *Question:* Did a specific external shock (war, scandal, economic crash) occur within 5 years of the cessation that altered the cost-benefit analysis of the *legislators*?
      *   *Why:* In 1807, the Napoleonic Wars made the West India interest less politically vital, and the moral argument became a weapon against the French. Without a "Trigger" node, the tree collapses "Interest" and "Honor" into "Coercion" whenever a law is passed.
      *   *Fix:* Add **Node 0: The Political Trigger.** "Did the legislative vote occur during a period of war or crisis that weakened the practitioners' political leverage?" If Yes, move to Interest/Honor. If No, Coercion.

  **Empty Cell Observation:**
  The tree produces **Generational Drift** for the Slave Trade if you argue profits were stable and enforcement came late. This is an "Empty Cell" in reality—slavery didn't drift away; it was killed. This suggests **Node 6 (Latency)** is too blunt. If arguments exist for 50 years, it doesn't mean Drift; it means the *Trigger* was missing.

  **Indistinguishable Pair Reality Check:**
  **Honor vs. Sensibility** in the Execution case. The elites stopped watching because the *crowd* was vulgar (Honor/Class distinction) or because the *hanging* was gruesome (Sensibility)? The record shows both. The tree forces Sensibility (Node 5 "Disgusting"), but the Class element (Fashion) is strong. The Tie-Break rule (Coercion > Fashion) hides this. The tree tells you *what* happened (State enforced it), but obscures the *social dynamic* (Elites didn't want to mix with the mob).

  **Final Verdict:**
  The tree works best for **Dueling** (Clear Honor case). It works adequately for **Executions** (Clear State Capacity case). It struggles with **Slave Trade** because it conflates the *vote* (Coercion) with the *motivation for the vote* (Honor/Interest). To fix it, you must separate "State Action" from "State Capacity." Capacity exists before Action. The tree asks about Capacity. It should ask about **Political Will Formation.**

  But as it stands, it will tell you, the Cynic, that you are right about the Slave Trade (it was Law/Coercion), but wrong about Dueling (it wasn't Law, it was Honor). That should keep the reading group arguing for another month.
