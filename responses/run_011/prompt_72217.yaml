  You're right to feel the tension. Looking at your list, you aren't running on one rule. You're running on three, and they contradict each other. That's why the Minority vote still bothers you, and why the Teacher vote feels shaky now.

  Here are the three rules your group has actually been using, derived from your seven votes.

  ### The Three Rules

  **1. The "Persecutor" Rule (Bad People vs. Bad Luck)**
  *   **The Logic:** We help people being *hunted*, not people in *dangerous places*. There must be a human agent intending harm.
  *   **The Evidence:** This is why you voted **Against** the Drought and the Shelling. In those cases, the harm was circumstance (weather, war). In the Journalist, Honor Killing, and Gay Man cases, someone (State, Family, Police) was actively targeting them.
  *   **Status:** This rule is solid. Your group agrees on it.

  **2. The "Identity" Rule (Who You Are vs. What You Did)**
  *   **The Logic:** We help people persecuted for *immutable traits* (ethnicity, sexuality, family), not for *choices* (jobs, petitions).
  *   **The Evidence:** This explains why the **Minority Family** and **Gay Man** got in (born that way), but the **Teacher** was kept out (she chose to sign the petition). The Journalist is the outlier here, but you likely viewed "Journalist" as a role the state treated as an identity (locked up *twice*).
  *   **Status:** This rule is strong, but it creates a moral hierarchy. It implies choices matter less than birth.

  **3. The "Threshold" Rule (Scars vs. Fears)**
  *   **The Logic:** We help when the harm has *landed*, not when it is *threatened*.
  *   **The Evidence:** This is where your group is split. You voted **Against** the Teacher because "nothing happened to her yet." But you voted **For** the Minority Family even though "nobody in that family had personally been touched."
  *   **Status:** This rule is broken. The Minority vote proved that *group* harm counts as *personal* harm. The Teacher vote insisted on *personal* physical evidence. You cannot hold both positions forever.

  ---

  ### The New Case: The Deserter

  **Which old case is closest?**
  Of the three you listed (Shelling, Minority, Teacher), this is the **Teacher** case.
  *   **Why:** Like the Teacher, this is about a specific *act* (signing a petition vs. refusing the draft), not an immutable identity. Like the Teacher, the argument against him is "Nothing has happened to him yet" (he is in a camp, not prison).
  *   **Why not the others:** It's not the Shelling family (this is targeted state punishment, not generalized war). It's not the Minority family (he isn't being targeted for his ethnicity).

  **Which way do you vote to avoid embarrassment?**
  You should vote **FOR**.

  Here is why: If you vote **Against**, you are following the *Teacher* precedent (Choice + No Physical Harm = No Help). But in nine years, looking back at a man imprisoned for refusing to kill civilians will look colder than looking back at a teacher who lost her job.

  The **Gay Man** case is your moral compass here. The argument that carried the room was: *"Keeping quiet isn't being safe, it's being somebody else."*
  Apply that to the Deserter: *"Following orders isn't being safe, it's being a killer."*
  If you accept that argument for the gay man (integrity of self), you must accept it for the deserter (integrity of conscience). If you vote Against, you invalidate your own best argument from three years ago.

  ---

  ### The Tie-Breaker Case

  You asked for the one referral that would force these rules apart. You need a case where the **Persecutor** is real, but the **Identity** is chosen, and the **Evidence** is only group-level.

  **The Test Case:**
  > A referral comes in: A 30-year-old man whose *brother* is a wanted political dissident. The government has a policy of arresting the male siblings of dissidents to pressure them to surrender. The police have visited this man's home twice to ask where his brother is. They have not touched him, arrested him, or beaten him. But his brother's wife was detained for a week.

  **How the Rules Split:**
  *   **The "Persecutor" Rule says FOR:** The State is actively hunting him. (Not bad luck).
  *   **The "Identity" Rule says AGAINST:** He didn't choose to have a brother. But he didn't choose the politics either. Is "Family" an identity (like the Minority case) or "Association" (like the Teacher case)?
  *   **The "Threshold" Rule says AGAINST:** Nothing has happened to *him* personally yet. (Matches the Teacher vote).

  **Why this settles it:**
  *   If you vote **FOR**, you admit that **Group Persecution** (Minority case) overrides **Personal Evidence** (Teacher case). You establish that being "guilty by association" is enough.
  *   If you vote **AGAINST**, you admit that the Minority vote was an anomaly, and that **Personal Physical Harm** (Teacher case) is the only real standard.

  **My advice:**
  Vote **For** the deserter. It aligns you with the "Gay Man" principle (integrity), which is the strongest moral ground your group has taken. It smooths over the contradiction between the Teacher and Minority votes by prioritizing *Severity of Consequence* (Prison/Death vs. Job Loss) over *Identity*.

  If you do that, the rule for the next nine years becomes: **"We help when the consequence is destruction of life or conscience, regardless of whether the first blow has landed."** That is a rule you won't be embarrassed by.
