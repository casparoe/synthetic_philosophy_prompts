      *   Verdict: It's not Lyapunov convergence. It's more like "common mode failure" or "shared constraints." It deserves "convergence" only in the sense of "many-to-one mapping" from Goals to Subgoals.

  7.  **Final Verdict (Framework vs. Vagueness):**
      *   Control theory is precise about *how* to optimize, vague about *what* to optimize.
