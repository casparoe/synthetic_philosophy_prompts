prompt: |-
  I help put together a printed growing almanac for our county — a volunteer thing, about two thousand copies, and once it goes to the printers in November we can't change a word of it for a year. Around forty recorders in different villages send in their notes each season and we turn them into the short rules that go in the book (sow this after that, don't prune until...). My problem is I have no idea when a run of seasons is actually enough to print a rule, and we've got a bad one going in this year: broad beans in the ground before Christmas for an earlier crop. It worked eleven years running on my own plot and has now failed twice in three winters. Half the committee want it struck out, half say a couple of bad patches proves nothing.

  Can you write me a decision procedure we could run at a meeting without any statistics: the questions to ask in order about a candidate rule, what counts as a good enough answer to each, when a rule gets demoted to a "sometimes" note and when it gets cut entirely, and where the procedure has to stop and say this is a judgement call for humans. Someone once told me there's a whole philosophy problem about the same data fitting several different rules — I'm not asking for a lecture on that, but the procedure should cope with it.

  Two things I especially need it to handle. First, our recorders don't use the same words: one village logs a seedling as "sulking" after transplanting, another calls the same thing "checking", and a third means something else again, so I need a test for whether a rule is even about the same thing from one end of the county to the other. Second, the baseline keeps moving — winters are milder then when the older rules were written — and I need some way of telling bad luck from a world that's changed, or an honest note that you can't.

  Then run it on three cases: the broad beans rule above; a recorder's rule logged for only three seasons, all in one walled garden, which she's very confident about; and a rule about feeding tomatoes that everyone swears by but nobody can say what it actually predicts. Make sure at least one comes out with an answer the committee won't like, and finish with a short list of what the procedure can't do. British English please, and keep it usable — we meet in a village hall on a Tuesday and we're not going to read anything clever.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Context:** A volunteer-run, printed growing almanac for a county (2,000 copies, annual, immutable once printed).
      *   **Input:** Notes from ~40 recorders across different villages.
      *   **Problem:** Deciding when a rule is robust enough to print, specifically dealing with conflicting data (broad beans failing recently), terminology inconsistencies, and changing climate baselines.
      *   **Constraints:** No statistics (too complex for a village hall meeting), needs to be a practical decision procedure (questions, thresholds, outcomes), must handle the "underdetermination" problem (data fitting multiple rules) without lecturing on it, British English, usable/practical tone.
      *   **Specific Requirements:**
          1.  Create a decision procedure (questions, pass/fail criteria, demotion/cutting thresholds, "judgement call" stop point).
          2.  Handle terminology inconsistency ("sulking" vs. "checking").
          3.  Handle shifting baselines (climate change vs. bad luck).
          4.  Run the procedure on three specific cases:
              *   Broad beans (11 years success, 2 fails in 3 years).
              *   Walled garden rule (3 seasons, 1 location, high confidence).
              *   Tomato feeding (popular, vague prediction).
          5.  Ensure at least one outcome is unpopular.
          6.  Finish with a list of what the procedure *can't* do.

  2.  **Deconstruct the Decision Procedure:**
      *   *Goal:* A flowchart-like set of questions that ordinary people can ask around a table.
      *   *Structure:*
          *   Phase 1: Clarity (Are we talking about the same thing?).
          *   Phase 2: Evidence (How many times, where, by whom?).
          *   Phase 3: Stability (Is the world changing underneath us?).
          *   Phase 4: Verdict (Print, Qualify, or Cut).
      *   *Handling Terminology:* Need a "Translation Test."
      *   *Handling Climate:* Need a "Pattern vs. Trend" check.
      *   *Handling Underdetermination:* Acknowledge that correlation isn't causation without using those words. Focus on *utility* rather than absolute truth.

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Drafting Phase 1 (Clarity):* If Recorder A says "sulking" and Recorder B says "checking," how do we know they match? *Idea:* Ask for a description of the plant's look, not the word.
      *   *Drafting Phase 2 (Evidence):* How many failures are too many? The prompt mentions 2 fails in 3 years vs 11 years success. A simple ratio isn't enough. Need to weight recent failures higher? Or look at geographic spread. Let's say: Needs 3 distinct locations, minimum 5 years total, no more than 2 consecutive failures.
      *   *Drafting Phase 3 (Climate):* How to tell bad luck from climate change? If the failure correlates with a specific weather anomaly (e.g., wet winter), it's bad luck. If it correlates with a trend (e.g., consistently warmer Decembers), it's a baseline shift.
      *   *Drafting Phase 4 (Verdict):* Green (Print), Amber (Print with "Usually/If conditions allow"), Red (Cut).
      *   *The "Judgement Call" Stop:* When the data is contradictory but plausible, humans must decide based on risk tolerance.

  4.  **Refining the Procedure for the User's Constraints:**
      *   *No Statistics:* Avoid p-values, standard deviations. Use counts and consensus.
      *   *British English:* "Village hall," "fortnight," "colour," "programme" (though maybe not needed), "whilst."
      *   *Tone:* Practical, respectful of volunteers, firm on quality.

  5.  **Developing the Three Test Cases:**
      *   *Case 1: Broad Beans.* 11 years success, 2 fails in last 3.
          *   *Analysis:* High historical confidence, but recent failure rate is high (66% recently). Climate shift likely (milder winters causing rot/pests earlier?).
          *   *Verdict:* Demote to "Sometimes" or add a warning. *Decision:* Demote to "Sometimes" with a weather caveat. This might annoy the traditionalists.
      *   *Case 2: Walled Garden.* 3 seasons, 1 location, confident recorder.
          *   *Analysis:* Fails the geographic spread test. Microclimate risk.
          *   *Verdict:* Cut for the main list, maybe move to a "Local Tips" sidebar if space allows, but strictly speaking, it's not a county rule. *Decision:* Cut. This will annoy the confident recorder.
      *   *Case 3: Tomato Feeding.* Everyone swears by it, nobody knows what it predicts.
          *   *Analysis:* Fails the Clarity/Utility test. What is the outcome? Bigger fruit? Earlier crop? If you can't measure it, you can't verify it.
          *   *Verdict:* Cut. This will annoy the majority who "swear by it." *Selection:* This is the best candidate for the "unpopular outcome."

  6.  **Addressing the "Philosophy Problem" (Underdetermination):**
      *   The prompt mentions data fitting several rules. I need to embed a check that asks: "Does this rule explain *why*, or just *when*?" If it's just coincidence, it might fail the "Mechanism" check. I'll add a question about "The Because Test."

  7.  **Final Review against Constraints:**
      *   British English? Yes.
      *   No statistics? Yes.
      *   Procedure usable in a village hall? Yes, keep it to 4 stages.
      *   Handle terminology? Yes (The "Picture Test").
      *   Handle baseline shift? Yes (The "Weather Watch").
      *   Three cases run? Yes.
      *   Unpopular outcome? Yes (Tomatoes).
      *   List of limitations? Yes.

  8.  **Writing the Content (incorporating the voice):**
      *   Voice: Experienced, pragmatic, slightly weary but dedicated volunteer coordinator.
      *   Structure: Introduction -> The Procedure (The "Four Gates") -> The Test Runs -> Limitations.

      *(Self-Correction during drafting)*: Make sure the "Judgement Call" point is clear. It shouldn't be a cop-out, but a recognized boundary.
      *(Refining the Broad Bean outcome)*: The prompt says half want it struck, half want it kept. The procedure should offer a middle ground (the "Amber" status) to resolve the deadlock.
      *(Refining the Tomato outcome)*: Make sure the reason is clear—it's not that it doesn't work, it's that it's not *falsifiable* in the context of the almanac.

  9.  **Final Polish:** Check tone. Ensure it sounds like something printed on a handout for a Tuesday night meeting. (e.g., "Put the kettle on," "No maths required.")

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  **The Almanac Rule-Check: A Procedure for Tuesday Nights**

  **Purpose:** To decide what goes into the printed book without needing a degree in maths.
  **Ground Rule:** If a rule passes all four gates, it goes in. If it fails one, it is qualified. If it fails two, it is cut.

  ---

  ### Gate 1: The Picture Test (Terminology)
  *Problem: One person's "sulking" is another's "checking".*

  **The Question:** "If we took the words away, would two recorders describe the plant's look the same way?"
  **The Test:** Ask the recorder to describe the physical state without using the disputed word.
  *   *Pass:* "The leaves turn pale and stop growing for a week." (Everyone agrees on this visual).
  *   *Fail:* "It just looks unhappy." (Too vague).
  **Action:** If it fails, the rule must be rewritten using the physical description, not the local word. If it cannot be described physically, it fails the gate.

  ### Gate 2: The Spread Test (Evidence)
  *Problem: One good garden does not make a county rule.*

  **The Question:** "Has this worked in more than one soil type and more than one pair of hands?"
  **The Test:** Count the distinct locations and gardeners.
  *   *Pass:* At least three different villages, at least three different gardeners, over a minimum of five seasons total.
  *   *Fail:* One garden, or one gardener moving pots around, or fewer than five seasons.
  **Action:** If it fails, it cannot be a general rule. It may be printed as a "Local Tip" if space allows, but not as a county instruction.

  ### Gate 3: The Weather Watch (Baseline Shift)
  *Problem: Distinguishing bad luck from a changing climate.*

  **The Question:** "Did the failures happen in weird weather, or in the new normal?"
  **The Test:** Look at the failure years.
  *   *Pass (Bad Luck):* The failures coincided with extreme outliers (e.g., a once-in-a-decade frost, a flood). The rule holds in "average" years.
  *   *Fail (Shifted Baseline):* The failures happened in weather that is becoming common (e.g., mild, wet Decembers). The rule worked in the past because the past weather was different.
  **Action:** If it fails, the rule is outdated. It must be cut or radically rewritten to suit the new climate.

  ### Gate 4: The Because Test (Underdetermination)
  *Problem: Data fitting several rules (Coincidence vs. Cause).*

  **The Question:** "Do we know *what* we are measuring, or just that two things happened together?"
  **The Test:** Ask for the predicted outcome.
  *   *Pass:* "Feed now to get larger fruit by August." (Specific cause and effect).
  *   *Fail:* "Feed now for better plants." (Vague outcome, could be anything).
  **Action:** If the outcome cannot be clearly defined, the rule is superstition. It fails the gate.

  ---

  ### The Stop Point: The Human Judgement
  If a rule passes Gates 1, 2, and 4, but fails Gate 3 (Climate), the committee must vote.
  *   **Option A:** Print it with a warning ("Only if winter is cold").
  *   **Option B:** Cut it.
  *   **Why stop here?** Because we are not meteorologists. If the world is changing faster than our book, we must admit we don't know. Do not argue past this point.

  ---

  ### Running the Procedure on Current Disputes

  #### Case 1: The Broad Beans (Sow before Christmas)
  *   **Gate 1 (Picture):** Pass. Everyone knows what a germinated bean looks like.
  *   **Gate 2 (Spread):** Pass. Worked for 11 years across multiple recorders.
  *   **Gate 3 (Weather):** **Fail.** The failures were not in extreme frost years; they were in mild, wet Decembers. The rot that killed them is now common in winters that used to be cold. The baseline has moved.
  *   **Gate 4 (Because):** Pass. Goal is "earlier crop."
  *   **Verdict:** **Demote to "Sometimes".**
  *   **Wording:** *"Sow before Christmas for an early crop, but only if the ground is cold and dry. In mild winters, wait until February."*
  *   **Committee Reaction:** The traditionalists will grumble that we are abandoning a proven rule, but the data shows the climate has broken the rule.

  #### Case 2: The Walled Garden (3 Seasons, 1 Recorder)
  *   **Gate 1 (Picture):** Pass. Clear descriptions.
  *   **Gate 2 (Spread):** **Fail.** Only one garden, one recorder. A walled garden is a microclimate; it does not represent the county.
  *   **Gate 3 (Weather):** Pass. No failures yet.
  *   **Gate 4 (Because):** Pass. Clear outcome.
  *   **Verdict:** **Cut from main rules.**
  *   **Action:** Offer the recorder a sidebar box titled "Notes from a Walled Garden" with a disclaimer that this may not work on exposed plots.
  *   **Committee Reaction:** The recorder will be offended. Explain that the book is for the county, not the village.

  #### Case 3: The Tomato Feed (Everyone swears by it)
  *   **Gate 1 (Picture):** Pass.
  *   **Gate 2 (Spread):** Pass. Everyone does it.
  *   **Gate 3 (Weather):** Pass. Seems consistent.
  *   **Gate 4 (Because):** **Fail.** When asked what it achieves, answers vary: "Better taste," "More fruit," "Healthier vines." Nobody can say what the rule *predicts* specifically. It fits any outcome, which means it proves nothing.
  *   **Verdict:** **Cut entirely.**
  *   **Committee Reaction:** This will be the unpopular one. People love this rule. But if we cannot say what success looks like, we cannot record if it has failed. It is folklore, not almanac data.

  ---

  ### What This Procedure Cannot Do

  1.  **It cannot predict the future.** It only judges the past. If next year is bizarre, the book will still be wrong.
  2.  **It cannot settle arguments about taste.** If two recorders disagree on whether a tomato tastes better, the procedure has no tool to measure it.
  3.  **It cannot save a rule that is emotionally important.** If the committee votes to keep a rule that failed the gates because "it's always been there," that is a choice to value tradition over accuracy. The procedure will flag the risk, but it cannot stop you printing it.
  4.  **It cannot fix bad record-keeping.** If a recorder writes "good year" without details, the procedure must treat that as no evidence at all.

  **Final Note for the Chair:** Print this sheet out. Put it in the centre of the table. When the arguing starts, point to the Gates. If the rule doesn't pass, the book doesn't print it. That way, it's not you saying no, it's the procedure.
