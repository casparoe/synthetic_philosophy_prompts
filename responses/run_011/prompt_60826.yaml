answer: |-
  You have independently rediscovered the **Kalai-Smorodinsky bargaining solution**, proposed by mathematicians Ehud Kalai and Meir Smorodinsky in 1975.

  You asked for a map of the rule's exposure, not a defence. Here is the terrain where your rule stands firm, and the ground where it slips.

  ### 1. What the rule quietly assumes
  For your rule to function as a measure of fairness, three things must be true about the world. If any of these fail, the calculation holds, but the moral weight collapses.

  *   **The Ceiling must be feasible.** In your example, your ceiling (80) assumes your neighbour pays the entire cost (45). But if they pay 45 for a benefit of 30, they are worse off than their fallback (10). A rational neighbour would walk away. Your rule treats that impossible point as the top of your range. It assumes the "best conceivable outcome" doesn't have to be something the other party would actually accept, only something that is physically possible.
  *   **Satisfaction is linear and comparable.** Your rule assumes that moving from 40 to 50 (a gain of 10) means the same thing to you as moving from 10 to 15 (a gain of 5) means to your neighbour. It assumes you both experience "percentage of range" as equal satisfaction. If money matters less to you than to them (diminishing returns), equal fractions are not equal fairness.
  *   **Truth is common knowledge.** The rule assumes both parties know and agree on the fallback and the ceiling. It assumes no one is bluffing about how much the driveway is worth or how bad the gravel alternative really is.

  ### 2. Where the verdict is unacceptable
  Your standing worry is correct: **the rule rewards the widest range.**

  If you can convince your neighbour the driveway is worth 200 to you, your range expands from 40–80 to 40–200. To keep the fractions equal, you must capture more of the surplus. The rule incentivizes exaggeration.

  This is not just a theoretical quirk; it is a practical vulnerability. In a one-off negotiation, the party with the most shameless ability to inflate their "ceiling" wins. If fairness is meant to curb opportunism, a rule that rewards it is failing its primary test.

  ### 3. Ranking the objections
  Here are the objections ranked from fatal to merely awkward, based on whether they break the rule's logic or just its convenience.

  **1. Fatal: The Incentive to Lie (Strategic Manipulation)**
  *   **Why:** Because the "ceiling" is defined by what you *could* get if the other paid everything, you can increase your share simply by claiming the project is more valuable to you. Since the other party cannot verify your internal value, the rule encourages dishonesty. A rule of fairness that collapses when people lie is not robust enough for the real world.
  *   **Verdict:** Fatal to practical use, unless you have a way to verify values independently.

  **2. Serious: The Infeasible Ceiling**
  *   **Why:** As noted above, your ceiling often relies on the other party accepting a loss. In formal bargaining theory, the "ideal point" is constrained by the other party's fallback. Your definition ignores this. If your ceiling is a fantasy point the neighbour would never accept, normalizing against it distorts the split.
  *   **Verdict:** Repairable. You can patch this by defining the ceiling as "the most I can get *while leaving you at least your fallback*." This shrinks the range but makes it real.

  **3. Serious: Interpersonal Comparison of Utility**
  *   **Why:** Is 25% of your range equal to 25% of mine? If you are wealthy and I am not, 1,000 means less to you. Your rule treats the *scale* of the range as the metric, not the *human need* behind it. It is fair mathematically, but perhaps not morally, if one party is bargaining for necessities and the other for luxuries.
  *   **Verdict:** Philosophical. It depends on whether you view fairness as procedural (equal fractions) or substantive (equal welfare).

  **4. Awkward: Complexity with Three or More Parties**
  *   **Why:** With two people, the range is a line. With three, it is a volume. Determining the "ceiling" for each person requires calculating what they get if *everyone else* pays, which creates multiple conflicting ceilings.
  *   **Verdict:** Repairable but messy. The math exists (n-person Kalai-Smorodinsky), but it loses the "back of the envelope" simplicity that makes your rule attractive.

  ### 4. Extensions and Patches
  *   **Three or more parties:** The rule survives, but the "ceiling" definition must change. You cannot assume the others pay everything; you must assume they cooperate to maximize *your* gain while securing *their* fallbacks. This requires a principled patch, not just a habit.
  *   **Non-fixed pie:** If working together creates extra value (synergy), the "range" is no longer a straight line. Your rule can handle this, but only if you abandon the simple linear fraction and look at the shape of the possible outcomes.
  *   **Disagreement on figures:** If you cannot agree on the fallback (e.g., "that gravel is useless"), the rule cannot start. It requires a shared reality. There is no patch for this other than arbitration.

  ### 5. Can you be wrong? (Falsifiability)
  You ask if redefining terms makes the rule unfalsifiable. It does, if you treat it as a description of the world. But you are offering it as a **normative** claim (how people *ought* to settle).

  *   **How to be wrong:** You are wrong if the rule consistently produces outcomes that reasonable people reject *after* the fact, or if using it systematically damages relationships.
  *   **The Genuine Strike:** The strike against the rule is not that the math is imperfect, but that it ignores **power**. In your driveway example, you have delivery lorries; you *need* the driveway more. But your neighbour might have a legal right to block it. If the neighbour has more leverage, your "fair" fraction might not be enough to persuade them. A rule of fairness that ignores who actually holds the cards is a rule for a world without conflict.
  *   **Your Past Settlements:** You suspect some were unfair. If you applied this rule, the unfairness likely came from the **Ceiling**. If you allowed your range to be defined by what you *wished* the value was, rather than what the market would bear, you likely took too much (or gave too much) without realizing it.

  ### Summary
  Your intuition is mathematically sound and aligns with a respected economic theorem. Its exposure lies entirely in the **definition of the ceiling**.

  If you define the ceiling as "what I get if you pay everything," the rule is fragile and invites lying. If you define the ceiling as "what I get if you pay the maximum you possibly would without walking away," the rule becomes robust, but much harder to calculate.

  You are not wrong about the principle of equalizing relative gain. You are only vulnerable on the boundaries of the range. Tighten the definition of the ceiling, and the rule holds.
