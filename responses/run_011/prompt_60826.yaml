          *   *The "Ideal Point" definition:* The ceiling isn't just "what I want," it's "what I could get if you paid everything *and* we still agreed." If the neighbor wouldn't agree to pay everything, that point isn't feasible. KS requires the "utopia point" to be on the *feasible frontier*. The user's definition ("most they could conceivably get... if cost fell entirely on the other side") might violate feasibility if the other side would walk away.

