      *   **Goal:** Help the user think through the philosophical/practical implications of the argument and guide the panel's decision.

  2.  **Deconstruct the Petitioner's Argument:**
      *   *Premise 1:* I didn't choose my bad behavior (determinism/upbringing).
      *   *Premise 2:* I didn't choose my rehabilitation (external factors/luck).
      *   *Conclusion:* Therefore, I am not responsible for the bad, so the punishment was unjust, and I am owed reinstatement.
      *   *The Twist:* He uses the lack of agency to absolve guilt *and* to claim entitlement.

  3.  **Identify the Philosophical Flaw (The "Why" the User Resists):**
