answer: |-
  In a boutique law firm, Partner Elena enforces a strict billing-hour honesty norm, complying flawlessly herself and having sanctioned every other associate who violated it without exception. When Associate Mark falsified hours last year, Elena discovered proof but, valuing their mentorship, silently forgave him without revealing her knowledge or altering her general enforcement record against others. Now, discussing firm integrity with a client, Elena freely condemns Mark's past falsification as unethical, yet when Mark sits across from her, she finds herself unable to reproach him for that specific incident without feeling she violates a relational constraint, despite her clean compliance record and consistent enforcement toward all other violators.

  **The Check**

  **Predictions:** The **Record-Based Account** predicts Elena retains standing; since her moral record is clean (no hypocrisy) and her general enforcement is even-handed (no partiality), she possesses the authority to blame. Any hesitation is merely pragmatic or emotional, not a loss of standing. The **Relationship-Based Account** predicts Elena loses standing to blame *Mark* specifically; by forgiving him, she waived her right to hold *him* accountable for *that* act, even if the act remains objectively wrong. Both accounts agree she can condemn the act to third parties (norm enforcement), but diverge on addressive blame.

  **The Single Feature:** The **silent forgiveness** does all the work. It changes the normative relationship without changing the blamer's public record or the wrongdoer's knowledge.

  **If Forgiveness is Announced:** If Mark knew he was forgiven, addressive blame would become communicatively absurd (a performative contradiction), collapsing the distinction between lacking standing and being inappropriate. The silence isolates whether the *normative change* exists independently of the *communicative context*.

  **If He Wrongs Someone Else:** Elena retains standing to blame Mark for *new* violations. This confirms that any standing loss is act-specific and relationship-relative, not a global moral demotion, supporting the relationship view that standing is tethered to specific relational histories rather than general moral credit.

  **Record-Theorist Attack:** The record theorist will insist **standing survives** but its **exercise is inappropriate**. They will argue forgiveness creates a duty not to blame (propriety), but not a lack of authority (standing). Their best move is to categorize the inhibition as a conflict of norms (forgiveness vs. blame) rather than a forfeiture of the standing required to blame, preserving the theory that only hypocrisy or partiality undermines the authority itself.
