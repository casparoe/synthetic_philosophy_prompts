answer: |-
  Here is the carving you requested.

  ### I. The Principles

  Your verdicts are not governed by a single rule, but by two competing principles that operate in a hierarchy. The first governs social and economic cooperation; the second acts as a veto on the first.

  **Principle 1: The Principle of Constitutive Fair Play**
  When you voluntarily enter a local practice, you are obligated to follow its constitutive rules if:
  1.  **Stability:** The rule is consistently observed by the majority of participants (accommodates 11).
  2.  **Epistemic Access:** You know the rule or could reasonably be expected to know it (accommodates 8).
  3.  **Constitutive Necessity:** The rule is understood by participants as a condition of the service or interaction, not merely an optional bonus (accommodates 1 vs. 2).
  4.  **Induced Reliance:** You have not previously acted in a way that created a specific expectation of compliance in a specific counterpart (accommodates 3).

  **Principle 2: The Constraint of Public Integrity**
  You are never obligated to follow a local convention if doing so requires you to corrupt a public institution or undermine a public duty, regardless of how entrenched or economically reliant the beneficiaries are (accommodates 7).

  **How to distinguish "Constitutive" from "Optional" (Clause 3):**
  A rule is constitutive if non-compliance is treated by the providers as a *failure of the transaction* (e.g., a server feels underpaid/insulted, as in Case 1). A rule is optional if non-compliance is treated as *frugality* (e.g., a barista feels nothing, as in Case 2). In the U.S., sit-down service is a tipped-wage contract; the tip is a deferred part of the price. Counter service is an hourly-wage transaction; the tip is a gift. Your European intuition ("price on menu is the price") applies to Case 2, but not Case 1.

  ### II. The Sacrifices

  To make these principles coherent, you must abandon or revise three of your verdicts.

  **1. Verdict 9 (The Activist Colleague) must be abandoned.**
  You state the colleague is "not doing wrong" if they advocate for change while not tipping. This contradicts Principle 1. If the colleague voluntarily consumes the labor (eats out three times a week), they participate in the scheme. Advocacy does not negate the immediate unfairness of consuming labor without paying the locally required wage.
  *   **Correction:** The colleague is doing wrong. They have two consistent options: (a) Pay the tip and advocate, or (b) Boycott the establishment. Doing neither is free-riding. The "something standing in place of the money" you suggest is morally inert; the server needs rent money, not solidarity.

  **2. Verdict 3 (Hotel Housekeeping) requires refinement.**
  You claim the first-night guest is blameless, but the third-night guest (who tipped night one) is wrong to skip night three. While the *strength* of the obligation increases with history (Induced Reliance), the baseline obligation exists from Night 1 if the convention is visible (e.g., envelopes provided).
  *   **Correction:** If the convention is visible, the Night 1 guest is also wrong, though perhaps less blameworthy due to uncertainty. Your history does not create the duty; it merely makes your violation a specific betrayal rather than a general breach.

  **3. Verdict 11 (Descriptive Norms) needs a stability threshold.**
  You say if half the town jaywalks, it is permissible. This risks making morality purely majoritarian.
  *   **Correction:** The principle is not "what people do," but "whether the rule is functionally dead." If half ignore a safety rule, the rule is unstable, and the cooperative scheme has fractured. You are permitted to defect because the *fair play* condition (others following the rule) has collapsed. However, if the rule is safety-critical (traffic), the threshold for "dead" is higher than for mere etiquette.

  ### III. Application to New Cases

  **1. Ride-share (5 stars, no tip on prompt):**
  *   **Verdict:** Wrong.
  *   **Reasoning:** This falls under Principle 1, Clause 3 (Constitutive Necessity). Like sit-down dining, platform drivers often rely on tips to meet a living wage, and the prompt indicates the expectation is part of the transaction structure. Non-compliance is treated as a failure of the contract, not mere frugality.

  **2. Cyclist (Rolling stop, deserted street, jurisdiction considering legalization):**
  *   **Verdict:** Permissible.
  *   **Reasoning:** This falls under Principle 1, Clause 1 (Stability) and the hazard constraint in your Case 4. If the jurisdiction is considering legalization, the norm is in flux (unstable). If the street is deserted, the safety function of the rule is dormant. You are not undermining a cooperative safety scheme because no other participants are relying on the stop.

  **3. Bargaining Market (Paying posted price where bargaining is norm):**
  *   **Verdict:** Wrong (or at least seriously objectionable).
  *   **Reasoning:** This is the inverse of tipping. Here, the "posted price" is not the price; it is an opening bid. Paying it violates the constitutive rule of the interaction (Case 6 logic). It disrupts the seller's pricing strategy and can insult them by implying you do not understand the social game. You are failing to play your part in the cooperative scheme of the market.

  **4. Train Seat (Sitting next to stranger in half-empty carriage):**
  *   **Verdict:** Wrong.
  *   **Reasoning:** This violates Principle 1, Clause 3. The "social bubble" is a constitutive rule of public transit in many cultures. While no economic harm occurs, you are violating a norm of mutual privacy that others are relying on. It aligns with your Case 10 (manners), but carries more weight because it imposes a psychological cost on a specific identifiable person, whereas utensil choice does not.

  ### IV. Visitor vs. Resident and Standing vs. Wrongness

  **Visitor vs. Resident**
  The difference is **purely epistemic and reliance-based**, not a difference in kind.
  *   **Epistemic:** A resident is presumed to know the conventions (Principle 1, Clause 2). A visitor gets a grace period until they "could reasonably have known" (Case 8).
  *   **Reliance:** A resident has a history of compliance that others may rely upon. A visitor is a one-off actor.
  *   **Conclusion:** Once the visitor knows the rule (end of grace period), their obligation is identical to the resident's. There is no permanent "tourist exemption."

  **Standing vs. Wrongness**
  These are **distinct**. Your intuition in Case 10 is correct.
  *   **Wrongness:** An objective violation of a moral principle (e.g., Fair Play). You can be wrong to use the wrong fork if it signals disrespect in that culture, even if no one is harmed.
  *   **Standing:** The relational authority to reproach. To have standing, the reproacher must be a participant in the scheme who was harmed or disrespected by the violation.
  *   **Application:** In Case 10 (utensils), you may be wrong, but your host has standing to correct you, while a fellow guest does not. In Case 1 (tipping), the server has standing, but a fellow diner does not. In Case 7 (bribery), *no one* has standing to demand you bribe, because the act itself is morally void under Principle 2.

  ### V. Function vs. Origin (The Tipping Problem)

  You asked how to fix the principle when a practice's origins and present function come apart, as with tipping.

  **The Rule:** Moral obligation tracks **Function**, not Origin.
  *   **Origin:** Tipping began as a reward for excellence (gratuity).
  *   **Function:** In the modern U.S. service industry, it functions as a wage subsidy (deferred payment).
  *   **Resolution:** You must treat the practice according to its current function. Because the function is *wage*, the moral obligation is *justice/fair pay*, not *generosity*.
  *   **Why this fixes your dilemma:** It explains why you feel "guilt" (a debt unpaid) rather than "stinginess" (a gift withheld) in Case 1. It also explains why Case 2 (counter) feels different: the function there remains *gratuity* (hourly wage is paid), so the obligation is weaker.

  If the function shifts again (e.g., restaurants move to living wages and service charges), the moral obligation to tip will vanish, even if the custom lingers. You are not bound by the ghost of a practice's history, only by the reality of its current reliance.
