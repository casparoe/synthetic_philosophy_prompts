      *(Self-Correction during drafting)*: Wait, on Move (6), the Philosopher says "Termite mounds and hearts, yes. A frozen model, no." The Researcher counters in (7) about RL. I need to make sure I credit the RL point. RL *is* more Darwinian than SFT. The Philosopher is describing SFT (Supervised Fine-Tuning/Pre-training), the Researcher is describing RLHF/RL. This is a key technical nuance.

