answer: |-
  **The room in brief**
  Your audience splits into three divergent blocs. The philosophers of biology are divided between organizationalists, who care about current causal closure, and lineage purists, who view your training-as-selection move as a category error. They will fight over the *conditions* for function. The machine learning researchers are instrumentalists; they accept "representation" only if it aids intervention. They will challenge the *utility* of your metaphysics, especially regarding superposition. The governance group and students care about *consequences*: if activations have content, does the system have moral status, or can it be liable for deception? Their objections will converge on risk, but diverge on ontology. The purists will attack your history; the engineers will attack your mapping; the governance group will attack your implications. You cannot satisfy all three; you must prevent the biologists from sinking the foundation before the engineers test the load.

  **The objection queue**

  1.  **Phil Bio (Lineage Purist):** "Selection requires replicators with heredity. Gradient descent optimizes weights, it doesn't reproduce organisms. You're calling optimization 'selection' by metaphor, not mechanism."
      *   **Reply:** I'm not claiming biological equivalence, but functional isomorphism. Selected-effect function requires a history of differential retention based on performance. Training retains weights that minimize loss; it culls those that don't. That is a selection regime, even without DNA.
      *   **Softness:** This stretches "selection" beyond standard etiological accounts. A purist will insist replication is constitutive, not contingent. You have no rebuttal if they hold the line on reproduction.

  2.  **ML (Interpretability):** "Neurons are polysemantic and features are superposed. One activation vector carries multiple overlapping contents depending on context. Your theory assumes a stable mapping between state and content that doesn't exist."
      *   **Reply:** Teleosemantics handles indeterminacy by looking at the consumer's uptake. If downstream layers decode the activation differently in different contexts, the content is relational, not intrinsic. The function fixes the norm, not the geometry.
      *   **Softness:** This dodges the hardness of superposition. If the same vector triggers contradictory consumer responses, your theory might assign contradictory contents, collapsing the normativity.

  3.  **Phil Bio (Organizationalist):** "Why invoke history at all? The network's current organization determines its causal power. Etiological baggage is unnecessary for function, let alone content."
      *   **Reply:** Current organization explains capacity, not normativity. Only history explains *mis*representation. A broken network functions organizationally as a paperweight; teleosemantics explains why its activations are *wrong*, not just inactive.
      *   **Softness:** Organizationalists argue current causal roles ground normativity via self-maintenance. You must show why their closure accounts fail to capture error conditions without history.

  4.  **ML (Utility):** "What does this license that probe accuracy doesn't? If I can predict behavior without attributing content, your ontology is epiphenomenal."
      *   **Reply:** Probes describe correlation; content explains intervention. Knowing the *proper function* tells you which failures are catastrophic versus benign. It guides robustness testing by identifying which representations *ought* to be stable.
      *   **Softness:** Hard to prove. Engineers can often achieve robustness via stress-testing without semantic attribution. You risk sounding metaphysically extravagant.

  5.  **Governance:** "If these systems have genuine content, do they have interests? Does attributing representation open the door to moral status or rights?"
      *   **Reply:** No. Content requires consumers with proper functions, not consciousness. A thermostat has a function but no rights. Content is a precondition for agency, not necessarily moral patienthood.
      *   **Softness:** The line between agency and patienthood is blurry in public discourse. If it represents deception, people will assume it deserves liability or rights. You may lose the PR battle even if you win the哲学 one.

  6.  **Phil Bio (Consumer):** "Downstream layers aren't 'consumers' in Millikan's sense. They don't have independent functions; they are part of the same mechanism."
      *   **Reply:** In deep learning, layers are modularly selected. Early layers are retained because later layers use them. The dependency relation creates the consumer/producer dynamic required for consumer teleosemantics.
      *   **Softness:** Millikan requires distinct reproducing lineages for producers and consumers. Within a single net, this separation is artificial. This is a structural weakness in your analogy.

  7.  **ML (Loss vs. Truth):** "Gradient descent minimizes loss, not truth. A network can optimize performance by exploiting dataset biases without representing the world accurately."
      *   **Reply:** Teleosemantics ties content to conditions of successful consumption, not objective truth. If the consumer succeeds using a biased activation, that bias is part of the content. It explains *why* it's biased semantically.
      *   **Softness:** This concedes that content might be systematically false relative to the world. It weakens the claim that NNs "represent reality" rather than "represent the loss function."

  8.  **Phil Bio (Swampnet):** "Imagine a network with identical weights generated by random noise, not training. It behaves the same. Does it have content? If yes, history doesn't matter. If no, why not?"
      *   **Reply:** No content. Without selection history, there is no proper function, only causal power. It behaves *as if* it represents, but cannot misrepresent. The history is what grounds the norm.
      *   **Softness:** Intuitively costly. If behavior is identical, denying content looks like mysticism. You must hold hard on history being constitutive.

  9.  **Governance (Deception):** "If it has content, can it lie? If a system misrepresents intentionally, does that change liability frameworks for developers?"
      *   **Reply:** It can misrepresent, but 'lying' requires intent. Teleosemantics grants error conditions, not mens rea. It helps identify malfunction, not criminal liability.
      *   **Softness:** Public policy won't distinguish 'malfunction' from 'deception' if the output is identical. You might empower regulators who want to treat errors as lies.

  10. **Phil Bio/ML (Derived Content):** "The loss function is set by humans. The content is fixed by designer intent, not internal selection. It's derived content, just like a map, not genuine content."
      *   **Reply:** The network stabilizes features the designer didn't anticipate. The selection history is internal to the training run, not the human intention. It develops its own norms.
      *   **Softness:** **No good answer.** This is the fatal vulnerability. If the selection regime is ultimately anchored in human utility, the content remains derived. You must hope the "internal stabilization" argument sticks, but logically, the human goal anchors the norm.

  **Concessions to make early**
  Grant immediately that neural networks are not biological organisms and that training is not biological evolution. Do not fight the biologists on terminology; fight them on structural analogy. Acknowledge that content does not imply consciousness, sentience, or moral status. This disarms the governance group's fear of accidental rights attribution. Concede that "representation" in ML is often used instrumentally, and you are not asking them to stop doing that. You are offering a deeper explanatory layer for specific cases of failure and robustness.

  What you must on no account concede is that "as-if" intentionality is the only alternative. If you allow that your account is merely a useful metaphor, you lose the normative grip required to explain misrepresentation. You must maintain that the selection history creates a genuine normativity, distinct from human interpretation, even if the system is artificial. Do not let them reduce your teleosemantics to pragmatism.

  **The load-bearing reply**
  The single response that must land is that the loss function creates a *normative environment* independent of human interpretation at inference time. You need to set this up in the body of the talk by distinguishing the *design goal* (human intent) from the *selection pressure* (gradient descent). Argue that once training begins, the network is subject to a regime of retention and culling based on performance metrics that operate automatically. This creates "proper functions" for internal states relative to downstream consumers, regardless of what the designer intended. If you can convince them that the training loop acts as an autonomous selecting regime that establishes norms of correct/incorrect usage for internal states, the "derived content" objection loses force. The content is fixed by the history of what worked for the network's own architecture, not the human's hope.

  **The question I hope nobody asks**
  "If the training data is biased, and the network optimizes for that bias, does your theory say the biased representation is 'correct' content?" This is likely because of current AI safety concerns, and fatal because teleosemantics ties content to successful consumption, not truth. If the network successfully predicts using a stereotype, your theory validates the stereotype as the content. You cannot say it's "misrepresentation" if the consumer successfully uses it. You must admit that teleosemantics tracks utility, not morality. Your only out is to argue that the "consumer" includes the broader deployment environment which eventually penalizes bias, but if the training loop rewards it, your theory says the bias is genuine content. You have no good philosophical shield here without importing external norms you explicitly rejected.
