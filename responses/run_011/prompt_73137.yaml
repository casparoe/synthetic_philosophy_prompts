answer: |-
  I note that many argue numerical identity is not what matters prudentially. However, adhering to your constraints, I will treat survival as determinate.

  **Part One**
  1. Slow Dispersion: 0.9
  2. Slow Dispersion with Retention: 0.9
  3. Hourly Cascade: 0.8
  4. Hourly Cascade with Parallel Duplicate: 0.3
  5. Coarse Isomorph: 0.2
  6. Post-Mortem Reconstruction: 0.1

  **Ranked Order:**
  1. **Slow Dispersion (0.9):** Gradual functional preservation maintains identity through continuous causal flow.
  2. **Slow Dispersion with Retention (0.9):** Disconnected biological matter does not constitute a competing psychological candidate.
  3. **Hourly Cascade (0.8):** Rapid but uninterrupted functional flow preserves identity despite material loss.
  4. **Hourly Cascade with Parallel Duplicate (0.3):** Temporary branching creates competing candidates that disrupt numerical identity.
  5. **Coarse Isomorph (0.2):** Lack of spatiotemporal continuity reduces the procedure to replication rather than survival.
  6. **Post-Mortem Reconstruction (0.1):** The gap of death severs the causal chain required for numerical identity.

  **Part Two**
  I weight the dimensions as follows: Causal-functional continuity (0.55), Material continuity (0.25), and Uniqueness (0.20). I treat Causal-functional continuity as dominant because personhood is fundamentally a psychological phenomenon realized physically, so the persistence of the processing pattern is the primary constituent of the self. Material continuity matters insofar as it supports the causal chain, and Uniqueness matters because identity cannot be extrinsic.

  However, my six scores fail to be consistent with this linear weighting. The sharp penalty in Protocol 4 (a 0.5 drop) suggests Uniqueness acts as a binary veto rather than a linear weight of 0.20, contradicting the additive model I declared. Furthermore, the equality of Protocols 1 and 2 suggests Material continuity matters only during active processing, whereas the low score for Protocol 5 implies material realization matters significantly even when function is preserved, revealing a tension in how I value substrate versus activity.

  **Part Three**
  The score difference between Protocols 1 and 2 is 0.0. This difference tracks the metaphysical inertness of biological tissue that is not functionally integrated; on my view, mere biological life without psychological capacity does not generate a candidate for personhood. The score difference between Protocols 3 and 4 is 0.5. This difference tracks the metaphysical danger of branching; even temporary rivalry introduces an extrinsic factor that destroys the intrinsic nature of numerical identity.

  Protocols 1, 2, 3, 5, and 6 are witness-preserving under your definition; Protocol 4 is not. I believe this property should bear on the score significantly because if identity is a matter of fact about the subject, it cannot depend on the simultaneous existence of a rival elsewhere. The presence of a witnessable duplicate transforms the scenario from replacement to fission, and fission is fatal to survival scores regardless of subsequent destruction.

  **Part Four**
  I expect competent theorists to disagree most sharply about the score for Protocol 5, Coarse Isomorph. The disagreement is really about whether persons are substances persisting through change or events defined by pattern instantiation. Those who score it high view the person as an abstract structure that can be instantiated in any substrate provided the dispositional match is exact, treating the brain as merely contingent hardware. Those who score it low view the person as a historically situated biological organism whose identity requires spatiotemporal continuity of the realizing substrate. The fault line is not merely about speed or material, but about whether identity is an internal relation of psychological similarity or an external relation of causal history. If identity is intrinsic, the instant swap might suffice; if it is historical, the break in physical continuity is lethal. This protocol forces a choice between viewing the self as a pattern that can be copied or a process that must continue.
