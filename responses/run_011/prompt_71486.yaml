  **SUPREME COURT OF THE FREE STATE OF COUNTERFACTA**

  *Estate of V. v. Municipality of Weir & Nineteen Others*
  No. 2023-CA-0492
  Decided: 14th of Frostfall, 2023

  **SYLLABUS**

  **Held:** The Prevention-of-Harm Ordinance's reliance on necessary-condition causation renders liability indeterminate when applied to omissions. Without a principled limit on causal fields, liability extends to all conditions necessary for the outcome, including those geographically or temporally remote. The statutory distinction between acts and failures becomes surplusage if omissions are treated as causal equivalents to positive conduct. Reversed and remanded.

  **MAJORITY OPINION**

  1.  This Court granted certiorari to review the application of the Prevention-of-Harm Ordinance (PHO), Section 4(a), which imposes liability on "any agent whose failure to prevent harm was a necessary condition of such harm." The trial court apportioned damages equally among nineteen defendants and the decedent. Each was found to have caused the drowning by omission. The facts are undisputed: the decedent drowned below a municipal weir. Among the liable parties were a passer-by holding a rope who did not throw it; a town councillor who voted against funding a warning sign three years prior; and a citizen asleep in another hemisphere at the time of the incident.

  2.  The PHO mandates a strict counterfactual test: but for the failure, would the harm have occurred? Applied rigorously, this test admits the woman asleep in Antipodia. Had she woken, boarded a flight, and intervened, the decedent would live. Her sleep was a necessary condition of her non-intervention. The trial court excluded her based on "proximity," yet retained the hydraulic engineer who never wrote a letter to the editor regarding weir safety. Both were absent. Both failed to act. If physical presence is the metric, the councillor is excluded, for his vote occurred years prior. If capability is the metric, the sleeper possessed the physical capacity to act, had she chosen to wake. We find no factual predicate in the statute that distinguishes the sleeper from the passer-by without importing normative assumptions about duty.

  3.  The inclusion of the decedent presents a further structural difficulty. The trial court found the decedent's failure to wear a buoyancy aid was a necessary condition of his death. Under the PHO, this is causation. Consequently, the decedent is a joint tortfeasor in his own demise. Apportioning damages equally among twenty causal omissions reduces the estate's recovery to negligible sums. If the statute treats omissions as causes equivalent to acts, the decedent's omission breaks the chain of recovery no less than a third party's intervention. The trial court's logic suggests that where every condition is a cause, liability dissolves into universal insignificance.

  4.  Furthermore, the councillor's liability rests on a chain of preventions. He voted against a sign; the sign would have warned the decedent; the warning would have prevented the drowning. This is a prevention of a prevention. Under a transitive counterfactual account, the vote is a cause. However, this extends liability indefinitely backward through every legislative decision that failed to mandate safety. The statute distinguishes between "acting" and "failing to act." Yet, if a failure to act is causally identical to an act, as the counterfactual test requires, the statutory distinction is surplusage. The legislature cannot have intended to erase the boundary between conduct and non-conduct while simultaneously relying upon it to define the scope of liability.

  5.  We cannot construct a similarity metric that includes the passer-by with the rope while excluding the sleeper without referencing expectations of conduct. Such expectations are normative, not causal. The PHO purports to establish liability based on factual causation alone. Since factual causation under the counterfactual theory admits all necessary conditions, and the statute provides no principle of causal selection, the law is administratively unworkable. We cannot select causes without norms, and the statute forbids us from using norms to filter causation.

  **CONCURRENCE**

  6.  I join the majority but write to emphasize the loss incurred by this reversal. The passer-by with the rope is morally distinct from the sleeper. The rope was available; the opportunity was present. Yet, under the PHO's plain text, "availability" is irrelevant; only the counterfactual dependence matters. To save the statute, we would need to read in a requirement of "reasonable possibility of prevention." But this is merely duty by another name. The statute sought to ground liability in metaphysics rather than morality. It cannot be done. We are forced to choose between infinite liability for all who could have acted and arbitrary lines that contradict the statutory text. I agree we must return this question to the drafters.

  **DISSENT**

  7.  I dissent. The majority reverses because the logic of the Ordinance leads to absurdity. I would hold that it leads to truth. Absences are not events. Nothing cannot cause something. The water killed the decedent, not the lack of a rope, nor the lack of a sign, nor the lack of a letter. To say the passer-by caused the death is to say that what he did not do is an existent thing capable of exerting force. It is not.

  8.  If we accept the majority's premise that omissions are causes, we must accept the sleeper's liability. If we reject the sleeper, we must reject the passer-by. Consistency demands we reject both. The trial court's error was not in including the sleeper, but in including anyone. I would dismiss the action against all nineteen defendants and the estate. The law should not compensate for the operation of nature simply because a human being failed to interrupt it. The rope man is no more liable than the sun for failing to shine at night. I am unbothered by this result. It is the cost of ontological honesty.

  **DISPOSITION**

  9.  The judgment of the trial court is reversed. The matter is remanded to the Legislature of the Free State of Counterfacta with instructions to define the boundaries of causal selection, specifically regarding the ontological status of non-events and the limits of transitive dependency in statutory liability.

  *So Ordered.*
