answer: |-
  # RFC 4042: Modal Reference Layer and Two-Dimensional Type Safety

  **Status:** Draft  
  **Author:** Backend Core Team  
  **Date:** 2023-10-27

  ## 1. Motivation

  Current type systems treat identifier reference as rigid across all execution contexts. This assumes that once a term is bound, its extension remains constant regardless of changes in the environment considered as actual. However, this conflates primary intensions (reference across scenarios taken as actual) with secondary intensions (reference across worlds taken as counterfactual). Without distinguishing these, the compiler cannot enforce safety properties regarding natural kind terms, leading to runtime errors when deployment scenarios diverge from development environments. This proposal introduces a modal reference layer to statically verify intensional stability.

  ## 2. Proposed Syntax

  We introduce the `intension` modifier to variable declarations. Terms default to `primary` (descriptive) unless annotated `secondary` (causal).

  ```rust
  // Primary intension: picks out whatever fits the description in this scenario
  let clear_liquid: Water<Primary> = find_liquid(); 

  // Secondary intension: picks out H2O across all counterfactual worlds
  let substance: Water<Secondary> = fix_reference(H2O); 
  ```

  ## 3. Type-Checking Rules

  Types implementing the `CausalLink` trait require an environment hash at compile time. A lint rule, `unstable_reference`, fires when a module rebinds a `Secondary` term without declaring an environment dependency. This prevents modules from assuming reference is settled internally when it depends on external causal-historical chains.

  The checker validates that `Secondary` terms maintain rigid designation across counterfactual worlds. If a term is marked `Secondary`, the compiler asserts identity across all possible worlds consistent with the actual world's physical laws. `Primary` terms are checked for satisfaction conditions across scenarios considered as actual.

  ## 4. Verification and Integration Testing

  CI pipelines must instantiate multiple scenarios. In a recent integration test, the suite was instantiated in a scenario whose clear, drinkable lake liquid is not the substance our production term was fixed on (XYZ instead of H2O). The test failed locally but passed in the target scenario. The review board insists the failure is the feature rather than the bug: the local build correctly identified that the primary intension of `Water` was not satisfied by the local environment's chemical composition. Teams must pin scenario hashes to ensure consistent primary intension evaluation during build.

  ## 5. Migration Notes

  Code written on the assumption that reference is settled by what is in the head will not compile unchanged. Developers must explicitly declare whether reference is descriptive or causal.

  **Before:**
  ```rust
  let w = Water::new(); // Implicitly descriptive
  assert_eq!(w, H2O);   // Fails if reference shifts
  ```

  **After:**
  ```rust
  let w: Water<Secondary> = Water::fix(H2O); // Explicit causal link
  assert_eq!(w, H2O);   // Guaranteed across counterfactuals
  ```

  ## 6. Alternatives Considered

  We evaluated a conformance suite for a physically identical build that passes every behavioral test while instantiating none of the phenomenally typed values. Nothing in the suite distinguishes the two builds. On this framework's own premises, a coherently describable scenario is supposed to be a genuine possibility. However, we decline to draw any conclusion about physicalism, marking it out of scope for a compiler RFC. The compiler concerns itself with type safety, not metaphysical grounding.

  ## 7. Open Questions

  We propose to recover the lost apriority by diagonalizing the intensional matrix, allowing the compiler to infer necessary truths from the diagonal of the primary/secondary map. However, this makes the type checker's own assumption context part of the program's meaning. Consequently, no caller can know what the checker assumed when it accepted their code. We seek feedback on whether context leakage is acceptable for diagonal safety.

  ## 8. Reviewer Comment Thread

  **@reviewer_semantics:** The Alternatives section is inconsistent. You cannot invoke the bridge from conceivability to possibility when it delivers the semantics and disown it when it delivers the metaphysics. If the zombie build is conceivable, your type system admits it as possible. If you exclude it from scope, you undermine the modal logic underpinning the `Secondary` annotation.

  **@author:** Physicalism is orthogonal to type safety. We only require that the behavior is indistinguishable.

  **@reviewer_semantics:** Indistinguishability is exactly the problem. If the phenomenally typed values are absent, the secondary intension of `Experience` is empty. Your lint rule should fire here.

  **@reviewer_types:** Regarding Open Questions: If diagonalization exposes the checker's context, does the compiled binary carry the scenario hash? If I deploy code diagonalized in Scenario A to Scenario B, does it type-check at runtime?

  **@author:** Runtime type-checking is proposed in RFC 4043.

  **@reviewer_types:** Then we are deferring the hard problem to runtime. Acceptable for now, but document the debt.

  **@reviewer_ops:** The CI failure in Section 4 will break nightly builds. Please add a flag to suppress primary intension mismatches for non-critical liquids.

  **@author:** Flag added: `--allow-reference-shift`. Use with caution.
