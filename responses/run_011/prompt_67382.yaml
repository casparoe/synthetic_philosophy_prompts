      4.  Single Revision.

      *Wait, one more check on Section 2:* "The scalar $r$ is delivered to the *update rule*... After the update, nothing in the policy's internal state... stands for $r$."
      In PPO/A2C: $r$ is used to compute Advantage. Advantage scales the gradient. Weights change. The *weights* now encode information about $r$. Does the *internal state* (activation) at $t+1$ stand for $r$? Usually, the observation at $t+1$ does not include $r_t$ unless explicitly designed to. However, the *hidden state* of an RNN policy *would* carry information about $r_t$ if $r_t$ was part of the input stream. If $r_t$ is *only* used for weight updates (offline or step-wise), then the activation state doesn't necessarily hold it. But standard RL often feeds $r$ into the next step's observation in continuous tasks or episode tracking. I will flag this as "Contingently False" or "Overgeneralized." Actually, the prompt asks to mark claims regarded as *simply false*. I should be careful. It is false for a significant class of standard architectures (e.g., those treating reward as part of the observation tuple). I will mark it as false for "standard architectures" generally, as many do include reward in the observation space for stability or meta-RL.
