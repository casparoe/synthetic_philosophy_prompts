answer: |-
  **Prep Notes**
  **Example:** Use a **Novel Draft**. It must show interconnectivity (changing one scene alters the ending) but cannot imply an external author limiting God (God writes the drafts).
  **Cut:** Drop monads and pre-established harmony; they are metaphysical baggage. Keep **compossibility** (logical compatibility); it is load-bearing.

  **Run-of-Show**
  1. **Hook (2 min):** Open with Candide's "all is well" amidst ruin, then state Leibniz meant "optimal," not "perfect." (Why: Disarms the caricature before it sticks.)
  2. **Definition (3 min):** Draw a circle labeled "World." Explain worlds are complete packages, not buffets where you swap items. (Why: Establishes holism required for the argument.)
  3. **Analogy (4 min):** Compare worlds to novel drafts; changing one plot point alters the ending and genre entirely. (Why: Visualizes interconnectivity without theology.)
  4. **Compossibility (3 min):** Explain some truths conflict (e.g., free will requires risk); call this "compossibility." (Why: Provides logical constraint without invoking divine weakness.)
  5. **The Claim (3 min):** God compares complete drafts, selecting the one with maximum variety and order. (Why: Frames optimization rather than moral perfection.)
  6. **Defuse "God Forced" (3 min):** Clarify God chose freely among options, bound only by logic, not external force. (Defuses Misconception 3: Fate/Coercion.)
  7. **Handle Atheist Objection (2 min):** Acknowledge suffering is real, but may be logically tied to greater goods in this specific package. (Absorbs leukemia objection without dismissing pain.)
  8. **Handle Religious Objection (2 min):** Frame logic as part of God's nature, not a limitation on His power. (Absorbs faith objection regarding divine freedom.)
  9. **Defuse "Quietism" (2 min):** Emphasize we are agents within the script; our actions contribute to the world's value. (Defuses Misconception 2: No point trying.)
  10. **Defuse "Blind Optimism" (2 min):** Restate "best" means richest existence, not a painless one. (Defuses Misconception 1: Everything's good.)
  11. **Check Question (1 min):** Ask the final question. (Why: Tests conceptual retention.)

  **Misconceptions**
  1. **"So everything's good"** → Defused in Step 10 (Distinguish "best" from "painless").
  2. **"So there's no point trying"** → Defused in Step 9 (Affirm human agency within the package).
  3. **"So God had no choice"** → Defused in Step 6 (Distinguish logical necessity from coercion).

  **Check Question**
  "If you could design a world with less suffering but also less courage, would you actually prefer it?"
