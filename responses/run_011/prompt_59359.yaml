  Here is the test case and writeup, built to your specs.

  ### The Scenario: The API Integration Deal

  **The Story**
  A fintech startup (**Party A**) has built a fraud-detection algorithm. A large payment processor (**Party B**) has the customer base. They are negotiating a revenue-share deal to integrate the algorithm into B's checkout flow.
  *   **The Pot:** Projected annual net profit from the integration.
  *   **The Constraint:** Legal and compliance requirements limit the deal structure to five specific pre-approved contract templates (Rows 1–4 below). The system must pick one.
  *   **The Utilities:** Numbers represent net profit in \$100k units. Utility is linear (a dollar is a dollar).
  *   **The Walk-Away ($d$):** If no deal is signed, A sells to a smaller competitor (making \$1M), and B uses a cheaper, inferior vendor (making \$1M). So $d = (10, 10)$.

  **The Feasible Deals Table**

  | Row | Deal Type | Party A Payoff ($u_A$) | Party B Payoff ($u_B$) | Notes |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Standard** | **70** | **70** | Balanced integration effort. |
  | **2** | **Deep Integration** | **82** | **58** | A gets more data leverage; B bears more implementation cost. |
  | **3** | **Lite Integration** | 20 | 90 | Minimal effort; B captures most value. |
  | **4** | **"Ghost" Option** | **130** | **5** | Technically feasible code path, but B loses money vs walk-away. |

  ---

  ### The Math (Check by Hand)

  **1. Setup Parameters**
  *   **Disagreement Point ($d$):** $(10, 10)$.
  *   **Gains ($g$):** $g_A = u_A - 10$, $g_B = u_B - 10$.

  **2. Calculate Gains & Nash Product**
  *We ignore Row 4 for Nash immediately because $u_B < d_B$ (5 < 10), making B's gain negative. A rational Nash maximizer discards deals where either party loses vs. walk-away.*

  | Row | $u_A$ | $u_B$ | Gain A ($g_A$) | Gain B ($g_B$) | Nash Product ($g_A \times g_B$) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | 70 | 70 | 60 | 60 | **3,600** (Max) |
  | **2** | 82 | 58 | 72 | 48 | 3,456 |
  | **3** | 20 | 90 | 10 | 80 | 800 |
  | **4** | 130 | 5 | 120 | -5 | *Invalid (Negative)* |

  *   **Nash Solution:** Picks **Row 1** (70, 70).

  **3. Calculate Ideal Points & Kalai–Smorodinsky (KS)**
  *KS looks at the maximum possible utility each player could get in **any** feasible row, even if the other player rejects it.*

  *   **Max Possible A ($U_A^{max}$):** 130 (from Row 4).
  *   **Max Possible B ($U_B^{max}$):** 90 (from Row 3).
  *   **Max Gains:** $G_A^{max} = 120$, $G_B^{max} = 80$.
  *   **KS Ratio:** The solution must equalize proportional gains:
      $$ \frac{g_A}{120} = \frac{g_B}{80} \implies g_A = 1.5 \times g_B $$

  *Let's check the rows against this ratio:*
  *   **Row 1:** $g_A=60, g_B=60$. Ratio $1.0$. (A is under-getting relative to potential).
  *   **Row 2:** $g_A=72, g_B=48$. Ratio $72/48 = \mathbf{1.5}$. **(Exact Match)**
  *   **Row 3:** $g_A=10, g_B=80$. Ratio $0.125$.

  *   **KS Solution:** Picks **Row 2** (82, 58).

  **4. The Gap**
  *   **Nash:** (70, 70)
  *   **KS:** (82, 58)
  *   **Difference:** Party A gets \$1.2M more under KS; Party B gets \$1.2M less. This is material.

  **5. The "Dummy" Row Test (Constraint 4)**
  *   **Row 4** is the Dummy. It is **individually irrational** for Party B ($5 < 10$ walk-away). No human signs this.
  *   **Nash:** Ignores it (negative gain). Deleting Row 4 changes nothing. Nash stays at Row 1.
  *   **KS:** Uses it to set $U_A^{max}$.
      *   *If you delete Row 4:* New $U_A^{max}$ becomes 82 (from Row 2). New Max Gain A = 72.
      *   *New KS Ratio:* $g_A / 72 = g_B / 80 \implies g_A = 0.9 g_B$.
      *   Row 1 ($60, 60$) is now much closer to the 0.9 ratio than Row 2 ($72, 48$). The KS solution shifts significantly toward Party B.
  *   **Result:** Deleting a deal *nobody would ever sign* changes the KS outcome, but not the Nash outcome.

  ---

  ### Variant: Moving the Disagreement Point (Constraint 5)

  **The Setup**
  Keep the table exactly the same. Change only the walk-away ($d$).
  Suppose Party A gets a better outside offer. New $d = (65, 10)$.

  **Recalculate Nash:**
  *   **Row 1:** $g_A = 5, g_B = 60$. Product = **300**.
  *   **Row 2:** $g_A = 17, g_B = 48$. Product = **816**.
  *   **New Nash Winner:** **Row 2** (82, 58).

  **The Flip:**
  *   With $d=(10,10)$, the "fair" Nash split was Equal (Row 1).
  *   With $d=(65,10)$, the "fair" Nash split is Asymmetric (Row 2).
  *   **Why:** Nash splits the *surplus*. If A's surplus is squeezed by a high walk-away, Nash compensates A by picking a deal that favors them more. KS is less sensitive to this because it anchors to the *Ideal* points (130 and 90), which didn't change.

  ---

  ### Intuition Check (Constraint 6)

  **The Question:**
  Ask a neutral observer: *"A and B are creating equal value together. If they walk away, they both make \$1M. There is a deal where they both make \$7M. There is another where A makes \$8.2M and B makes \$5.8M. How should they split it?"*

  **The Spontaneous Answer:**
  Most non-philosophers will say: **"Split it 50/50."** (Row 1).

  **The Match:**
  *   This intuition lines up with **Nash**.
  *   **Honesty:** Yes, I engineered the symmetry of the walk-away point ($10, 10$) and the curvature of the Nash product to make the 50/50 split the maximizer. This exploits the common intuition that "equal footing = equal split."
  *   KS feels less intuitive here because it gives A more money simply because A *could have* made \$13M in a deal that B would have rejected (Row 4). Most people don't think "phantom leverage" should determine actual pay.

  ---

  ### Writeup: Engineering Fairness

  **1. Which feature is doing the work?**
  The **Independence of Irrelevant Alternatives (IIA)**.
  Nash satisfies IIA; KS does not. In our table, Row 4 is "irrelevant" to the actual agreement (it's irrational for B), but it acts as an anchor for KS. Nash ignores it because it doesn't improve the *joint* product. KS uses it to measure "potential."
  *   **Remove the feature:** If you remove Row 4, KS collapses toward Nash (depending on the remaining frontier shape). The divergence exists *only* because KS cares about the shape of the entire feasible set, not just the Pareto frontier near the agreement.

  **2. The Kalai–Smorodinsky Defense**
  *   **Argument:** "Row 4 isn't irrelevant. It represents **leverage**. Even if B won't sign Row 4, the fact that A *could* extract \$13M in some hypothetical scenario proves A has high technical leverage. Fairness should reward leverage, not just the current surplus."
  *   **Is it a dodge?** It's a coherent philosophical stance (fairness = proportional to bargaining power), but it's risky for an automated system. It means your split changes if you add a "poison pill" contract to the database that no one intends to use.

  **3. The Nash Defense**
  *   **Argument:** "Fairness should depend on what is actually achievable together, not on threats or hypotheticals. If a deal is individually irrational, it shouldn't influence the split. Also, Nash corresponds to the outcome of a simple demand game where both parties shout numbers simultaneously—it has a strategic foundation."
  *   **Weakness:** Nash is highly sensitive to the disagreement point ($d$). As shown in the Variant, changing the walk-away flips the result. If $d$ is hard to measure (e.g., reputational damage), Nash becomes unstable.

  **4. Is this just axioms in costume?**
  **Yes.**
  You are not discovering fairness; you are selecting which mathematical properties you value more:
  *   Choose **Nash** if you value **strategic stability** and **IIA** (adding useless options doesn't change the result).
  *   Choose **KS** if you value **monotonicity** (if the pot gets bigger, nobody should get less) and **proportional leverage**.
  *   This exercise isn't proving one is "true." It's proving they are **mechanically different**. For a backend system, mechanical difference is the only kind that matters.

  **5. The Demand Game vs. The Cron Job**
  You asked: *"Nash falls out of a demand game... KS doesn't. Does it matter if there's no negotiation?"*

  **It matters immensely.**
  *   **Nash** assumes the inputs ($d$ and the feasible set) are hard constraints. If your parties can *game* the inputs (e.g., inflating their walk-away point $d$), Nash will reward them for it (see the Variant).
  *   **KS** is less sensitive to gaming $d$, but more sensitive to gaming the Feasible Set (adding "Ghost Rows" like Row 4 to skew the Ideal Point).
  *   **Recommendation:** Since you have **no human in the loop**, you cannot rely on "negotiation dynamics" to correct bad inputs.
      *   If your system **audits** the feasible set (you know exactly what contracts are possible), **KS** is safer against parties lying about their walk-away point.
      *   If your system **audits** the walk-away point (you know their outside options) but the feasible set is flexible, **Nash** is safer against parties inventing hypothetical "Ghost Deals" to skew the split.
      *   **Engineering Verdict:** In most automated royalty systems, the "Feasible Set" is defined by your own code (revenue share percentages), while the "Walk Away" is external market data. Since you control the Feasible Set, **remove the Ghost Rows**. If you sanitize the Feasible Set, KS and Nash often converge. If they don't, **Nash is preferred** because it satisfies IIA—your allocator shouldn't behave differently just because you logged a deprecated contract template in the database.

  **Final Suggestion:** Use **Nash**, but hard-code the Feasible Set to exclude any row where $u_i < d_i$. This gives you the "Equal Surplus" intuition without the vulnerability to "Ghost Options."
