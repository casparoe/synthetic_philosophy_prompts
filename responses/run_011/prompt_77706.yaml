answer: |-
  # Q&A PREP SHEET: UNDERDETERMINATION & EVIDENCE SCOPE
  **Workshop:** Limits of Evidence | **Time:** 40 mins + Discussion | **Goal:** Defend structural critique without retreating to dogmatic realism.

  ## STRATEGIC PRIORITIES
  **Concede Explicitly (During Talk):**
  1.  **To the Statistician:** Explicitly distinguish *philosophical underdetermination* from *statistical non-identifiability*. Acknowledge that parameter non-identifiability is a formal, local property of model classes, not a global skeptical thesis. (Defuses the "misuse of terms" charge).
  2.  **To the Phil-Phys Students:** Acknowledge that Quantum Mechanics (specifically interpretations) presents a "hard case" where equivalence classes appear stable over long periods. Frame this as the *exception* that proves the rule (it requires specific physical arguments, not a priori philosophy). (Defuses the "preliminary debate" charge).

  **Refuse to Concede (Under Pressure):**
  1.  **Global Scope:** Do not accept that a few local cases (like QM) generalize to a global thesis about *all* science. Insist the burden of proof is on the skeptic to show stability holds everywhere.
  2.  **Empirical Adequacy as Ceiling:** Do not accept that "saving the phenomena" is the only rational goal of inquiry. Maintain that explanation and truth are distinct epistemic goods, even if underdetermination risks are present.

  **The "Dreaded Question" (Hope they don't ask):**
  *   *"Isn't your distinction between 'local' and 'global' underdetermination just a verbal stipulation? If a skeptic says 'We can always construct a rival for any theory,' haven't they won the philosophical point regardless of how hard it is to do in practice?"*
  *   **Least Bad Answer:** "If the construction requires changing the logic, the ontology, or the standards of evidence every time, it's not a single 'thesis' anymore; it's a recipe for skepticism that has no unified force. A skeptical weapon that requires a different manufacturing process for every target isn't a global threat; it's a local engineering problem."

  **Emergency Concession (If time runs out/hostility rises):**
  "I grant that in specific formal contexts, equivalence is stable and theory choice is underdetermined by data alone. My claim is simply that this does not license a global skepticism about scientific knowledge."

  **Steering Target:**
  If you can choose the direction, steer toward **the definition of "evidence."** Ask the room: *"Are we defining evidence as 'what we have,' 'what we could get,' or 'what is logically possible'? My argument turns on that distinction."*

  ---

  ## TOP 8 OBJECTIONS (Ordered by Damage Potential)

  ### 1. The Statistician: "Identifiability vs. Underdetermination"
  **Idiom:** "You're conflating philosophical underdetermination with statistical non-identifiability. In my field, a model is non-identifiable if distinct parameters yield the same likelihood function. That's a formal property of the model class, not a claim about 'all possible evidence.' If you claim UD is local, aren't you just describing non-identifiability without the math?"
  **Reply (90s):** "That's a crucial distinction, and I agree we shouldn't conflate them. Statistical non-identifiability is indeed a formal property of a specific model class relative to a specific data structure. My point is broader: the philosophical *thesis* of underdetermination tries to elevate those local formal facts into a global epistemic principle. When philosophers say 'theory is underdetermined by evidence,' they usually mean 'by all possible evidence.' If they mean that, they need to show that non-identifiability persists as we expand the model class or the data type. If they mean 'by current evidence,' then it's just a temporary statistical problem, not a skeptical threat. I'm arguing the skeptic needs the global claim to be scary, but the global claim is unsupported by the local math you work with."
  **Softness:** The Statistician may press that "expanding the model class" is exactly what *doesn't* happen in practice (we stick to the class).
  **Damage:** **Fatal** if mishandled (makes you look statistically illiterate). **Costly** if handled well.

  ### 2. The Phil-Phys Grad: "The Quantum Interpretation Problem"
  **Idiom:** "You say equivalence isn't stable, but look at QM. Copenhagen, Bohmian, Many-Worlds. They've been empirically equivalent for a century. No amount of 'accumulating evidence' within standard QM breaks that tie. Doesn't this single case destroy your claim that UD is merely local and unstable?"
  **Reply (90s):** "It's a powerful counter-example, and I conceded in the talk that QM is a hard case. But notice *why* it's a hard case: it requires specific physical arguments about the nature of measurement and decoherence. It's not an a priori truth that 'all theories have rivals.' It's a contingent, difficult fact about quantum fields. My argument is that you can't take this specific, hard-won result in high-energy physics and generalize it to biology, geology, or economics to prove a global skeptical thesis. The existence of a stable equivalence class in QM shows underdetermination is possible, not that it's inevitable. For the realist, QM is a challenge to be solved, not a proof that science is blind."
  **Softness:** Philosophers of Physics may view QM as the *paradigm* of theory, making your "local" move look like you're ignoring the most fundamental science.
  **Damage:** **Costly** (Conceding QM weakens the "instability" claim, but containing it to QM saves the global thesis).

  ### 3. The Constructive Empiricist: "The Constraint is the Point"
  **Idiom:** "You say we 'smuggle in' a constraint on admissible rivals by focusing on observables. But that constraint *is* the epistemic policy. We aren't trying to describe the world-as-it-is; we are trying to organize experience. If your 'realist' rivals ignore observable constraints, they aren't better theories; they're just metaphysics. Why should we accept your definition of 'theory' over ours?"
  **Reply (90s):** "I'm not asking you to accept my definition of theory; I'm asking why the skeptic's argument works if we *don't* accept it. If I, as a realist, say 'I care about unobservables,' and you construct a rival that only saves observables, you haven't undercut *my* claim; you've just changed the subject. The underdetermination argument is supposed to show that *even if* we aim for truth, we can't get it. But the standard constructions (like Ramsey sentences or observable re-interpretations) only work if we agree beforehand that unobservables don't matter. That's begging the question. I'm arguing the argument fails because it relies on a constraint that the realist rejects by definition."
  **Softness:** They will reply that "begging the question" is just "stating a different research program," and you haven't shown realism is *better*, just different.
  **Damage:** **Costly** (Goes to the heart of the philosophical disagreement, but doesn't refute your structural point).

  ### 4. The Bayesian: "Priors Break the Tie"
  **Idiom:** "Even if likelihoods are identical, posteriors diverge if priors differ. If two models are empirically equivalent, rational agents can still assign different probabilities based on simplicity or coherence. Doesn't this make underdetermination epistemically inert? The data doesn't decide, but rationality does."
  **Reply (90s):** "This is actually where I think we agree, and it supports my 'local' thesis. If priors break the tie, then underdetermination isn't a global skeptical barrier; it's a local problem of prior specification. The skeptic wants to say 'Evidence *cannot* decide.' You're saying 'Evidence plus rational priors *can* decide.' That shifts the debate from 'limits of evidence' to 'justification of priors.' My point is that the standard underdetermination argument ignores this Bayesian resource. It treats evidence as the only input. Once we admit priors, the 'global' skepticism collapses into a case-by-case discussion about which priors are justified in which fields. That's exactly the local, empirical matter I'm advocating for."
  **Softness:** Bayesians might argue that if likelihoods are *always* equal, priors are the *only* driver, making science subjective.
  **Damage:** **Gift** (Use this to ally with the Bayesians against the global skeptic).

  ### 5. The Statistician: "Predictive Accuracy vs. Truth"
  **Idiom:** "You're obsessed with 'truth,' but in model selection, we care about predictive accuracy (AIC/BIC). If two models predict equally well, picking one as 'true' is overfitting. Why does it matter if the underdetermination argument is unsound if the pragmatic outcome is the same?"
  **Reply (90s):** "It matters because the goal of the workshop is 'limits of evidence,' not just 'limits of prediction.' If we only care about prediction, then yes, underdetermination is harmless. But science often claims to tell us about mechanisms, causes, and structures that go beyond prediction. If the underdetermination argument were sound, those claims would be unjustified. I'm arguing they *are* justified, locally, because equivalence isn't stable. If we concede to instrumentalism just because prediction is easier, we abandon the explanatory power that makes science valuable. I'm defending the legitimacy of the truth-claim, not just the utility of the model."
  **Softness:** The Statistician may view "truth" as an ill-defined loss function.
  **Damage:** **Costly** (Highlights a disciplinary clash on the goal of inquiry).

  ### 6. The Phil-Sci: "History Shows Persistence"
  **Idiom:** "You say equivalence doesn't persist. But look at the Ptolemaic vs. Copernican systems before the telescope. For centuries, they were empirically equivalent relative to the evidence of the time. Doesn't history show that equivalence classes *can* be stable for long periods, validating the skeptic's worry?"
  **Reply (90s):** "It shows they can be stable for a time, not that they are stable *in principle.* The Copernican system wasn't equivalent 'relative to all possible evidence'; it was equivalent relative to *naked-eye astronomy.* Once the evidence scope expanded (telescopes, parallax), the equivalence broke. That supports my thesis: underdetermination is a function of the *current* evidence scope. The skeptic needs to show that *no* possible evidence could break the tie. History shows the opposite: ties get broken as technology and theory expand. The 'limit' is temporary, not structural."
  **Softness:** They might argue that for the scientists *at the time*, it was a global limit, which is what matters for epistemology.
  **Damage:** **Costly** (Historical examples are always messy, but the "temporary vs. structural" distinction holds).

  ### 7. The Bayesian: "The Likelihood Principle"
  **Idiom:** "If you accept the Likelihood Principle, all evidence is in the likelihood ratio. If that ratio is 1, the evidence is zero. You can't just say 'wait for more evidence.' If the models are truly equivalent, no amount of conditionalization helps. Are you denying the Likelihood Principle?"
  **Reply (90s):** "I'm not denying the principle; I'm denying the premise that the ratio *stays* 1 forever. The Likelihood Principle tells us how to update given data. It doesn't tell us that the model class is fixed. My argument is that 'true' empirical equivalence is rare because theories make claims about different potential data. If Theory A and Theory B are truly equivalent on *all* possible data, they are likely not distinct theories but notational variants. If they differ on potential data, the Likelihood Principle says we should go look for that data. The skeptic assumes we can't."
  **Softness:** Technically dense; if you stumble on the Likelihood Principle definition, you lose the Bayesians.
  **Damage:** **Costly** (Technical risk, but defends the "search for evidence" strategy).

  ### 8. The Grad Student: "Semantic Stipulation"
  **Idiom:** "This feels like you're solving the problem by defining 'theory' in a way that excludes rivals. If I say a theory includes its ontology, sure, rivals are hard to find. But isn't that just protecting realism by fiat? Why should we accept that ontology is part of the theory's evidence profile?"
  **Reply (90s):** "It's not fiat; it's about what we mean by scientific progress. If a 'theory' is just a black box that outputs observations, then yes, rivals are easy. But scientists argue about mechanisms, forces, and entities. They treat those as part of the theory's content. If I ignore that content to construct a rival, I'm not engaging with the science as it's practiced. I'm engaging with a philosopher's caricature of science. My definition aligns with scientific practice; the skeptic's definition aligns with a specific epistemic policy. I'm arguing the skeptic's policy isn't forced on us by the evidence."
  **Softness:** Risks sounding like an appeal to authority ("scientists say so").
  **Damage:** **Low** (More of an annoyance than a refutation).

  ---

  ## FINAL REMINDER
  **Keep your cool on the Identifiability point.** If the Statistician presses hard, offer to discuss the formal distinction after the session. Do not get bogged down in math during the Q&A. Your turf is the *structure of the argument*, not the *parameters of the model*. Stick to the scope of evidence.
