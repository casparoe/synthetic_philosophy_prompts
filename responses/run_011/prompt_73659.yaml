answer: |-
  ### Triage and Brainstorming

  You asked for the triage first, so here is the raw processing before the audit. I'm going to run through the candidate pairs you might be worried about, argue the tension, and then try to dissolve it to see if it sticks.

  **Candidate 1: (1) vs. (2) — Your Suspected Problem.**
  *The Worry:* How can everyone count equally (1) if I must prioritize my own (2)?
  *Argument In:* This is the classic "derivativity" objection. If moral status is equal, any deviation in treatment looks like discrimination. If I save my child before a stranger's child, am I not saying my child's life is worth more?
  *Argument Out:* No. You're saying the *distribution mechanism* is relational, not the *value of the life*. Think of it like this: All citizens have equal standing before the law (1), but a public defender has special duties to their specific client (2). The special duty is compatible with equal status provided the special duty is justified by a legitimate relational fact (like the contract, or in your case, the shared history).
  *Verdict:* **False Alarm.** This is the standard "compatibilist" move (à la Scheffler or Miller). As long as you don't claim the *intrinsic value* of the compatriot is higher, (1) and (2) are logically consistent. You can stop losing sleep over this one.

  **Candidate 2: (3) vs. (4) — The Grounds Mismatch.**
  *The Worry:* (3) grounds duties in "shared history" (narrative/ethical). (4) grounds justice in "existing institutions" (structural/functional).
  *Argument In:* These are different engines. A "shared history" can exist without robust institutions (e.g., a diaspora). Robust institutions can exist without a shared history (e.g., a colonial administration or a newly drawn border). If the state dissolves but the history remains, (3) says duties persist, (4) says they vanish.
  *Argument Out:* You can stipulate that the "shared history" *is* the history of *institution-building*. That ties them together.
  *Verdict:* **Theoretical Friction, not Contradiction.** It's a category wobble. It makes your view vulnerable to edge cases (e.g., failed states), but it doesn't break the system.

  **Candidate 3: (4) vs. (6) — The Vacuum vs. The Claim.**
  *The Worry:* (4) says no global practice = no global justice claims. (6) says foreigners have a claim (dire need) that trumps domestic permissions.
  *Argument In:* If (4) is true, the foreigner in the vaccine case has *no justice claim* against your state. They are outside the practice. So what is "trumping" your compatriot's priority in (6)? If it's not a justice claim, it's a humanitarian plea. But humanitarian pleas usually don't *trump* justice-based permissions. If it *does* trump, it functions like a justice claim. But (4) says no such claim exists.
  *Argument Out:* You could say the "dire need" claim comes from (1) (moral status) directly, bypassing justice.
  *Verdict:* **Fatal.** This is the structural break in the chassis. You cannot maintain a strict Practice-Dependence view (4) while asserting a trumping claim from outsiders (6) that isn't generated by a practice. One of these has to yield.

  ***

  ### The Audit

  Here is the ranking of genuine tensions by severity. I am skipping the (1) vs. (2) pair because, as argued above, it is the most defensible part of your package. The trouble is elsewhere.

  #### **Severity 1: (4) vs. (6) — The Practice-Dependence Paradox**
  **The Tension:** This is a direct contradiction. (4) asserts that principles of distributive justice are *constituted* by practices. No practice = no principle. (6) asserts that in the absence of a global practice, foreigners still hold a claim (based on need) strong enough to override the permissions granted by the domestic practice.
  If (4) is true, the foreigner's claim in (6) is conceptually empty. There is no "justice" there to do the trumping. If (6) is true, then there is at least one principle of justice (or quasi-justice) that is *practice-independent* (i.e., basic need/survival). You cannot have it both ways.

  **The Repair:**
  *   **What has to go:** The strictness of (4). You must admit a "floor" of practice-independent claims.
  *   **Cheapest Repair:** Modify (4) to read: "Distributive *egalitarian* justice is practice-dependent, but basic *humanitarian* claims are practice-independent."
  *   **The Cost:** You lose the theoretical elegance of a unified Practice-Dependence account. You open the door to critics who will ask: "If need generates a practice-independent claim, why doesn't arbitrary inequality generate one?" You have to draw a bright line between "need" and "equality" that PD usually dissolves.

  #### **Severity 2: (2) vs. (4) — The Instrumentalism Leak**
  **The Tension:** (2) explicitly rejects the "division of moral labor" story (instrumentalism). You want special duties to be non-instrumental goods. However, (4) (Practice-Dependence) is often motivated by instrumental logic: institutions exist to solve coordination problems, and justice is the norm internal to that solution.
  If the *content* of justice is fixed by the *function* of the institution (4), it becomes very hard to argue that the *boundary* of that institution (who is in/out) is non-instrumental (2). If the institution is the source of the duty, the boundary is usually justified by the efficiency of the institution (division of labor).
  **The Repair:**
  *   **What has to go:** The motivation for (4).
  *   **Cheapest Repair:** Ground (4) in *reciprocity* or *coercion* rather than *efficiency*. Argue that the practice generates duties because of the normative relationship (coercion/reciprocity), not because it's an efficient way to run the world.
  *   **The Cost:** This pushes (4) closer to (3). It makes your view more "relational" and less "structural." It makes you vulnerable to the objection that global coercion/reciprocity already exists (undermining your skepticism of global egalitarianism).

  #### **Severity 3: (3) vs. (6) — The Threshold Problem**
  **The Tension:** (3) grounds duties in the "value of the relationship itself." (6) allows that relationship to be overridden by "dire need."
  If the relationship is valuable enough to ground non-instrumental duties (2), why is it so fragile that it collapses at the point of death? If the relationship is the *source* of the priority, it should be able to withstand significant external pressure. By admitting a "threshold," you imply the relationship isn't the *only* thing that matters, which weakens (3).
  **The Repair:**
  *   **What has to go:** Nothing, but you need to clarify the hierarchy.
  *   **Cheapest Repair:** Clarify that (3) generates *special* duties, not *exclusive* duties. The relationship creates a surplus of obligation, not a wall.
  *   **The Cost:** You have to explain why the "surplus" disappears when the foreigner is dying. It makes the associative duty look contingent on the foreigner's baseline welfare, which risks turning (2) back into an instrumental division of labor (we look after our own *unless* the others are drowning).

  ***

  ### The Single Best Revision

  If you make one change to clean up the most damage, it is this: **Revise (4).**

  **Current (4):** "What justice requires is fixed by the institutions that actually exist... there's no practice of the right kind, so there's nothing determinate for it to demand at the global level."

  **Proposed Revision:** "What *egalitarian* justice requires is fixed by the institutions that actually exist. However, a minimal practice of human interaction grounds a practice-independent duty to meet basic needs."

  **Why this fixes the package:**
  1.  **Resolves (4) vs. (6):** It validates the foreigner's claim in the vaccine case without requiring a full-blown global state. The foreigner isn't claiming *equality* (which requires the practice), they are claiming *survival* (which requires only humanity). This makes (6) logically consistent.
  2.  **Protects (1) vs. (2):** It gives (1) (Cosmopolitan Status) some work to do. Currently, (1) is doing almost nothing; it's just a preamble. By anchoring the "dire need" threshold in (1), you give moral cosmopolitanism a functional role without forcing you into global egalitarianism.
  3.  **Preserves (5):** You can still maintain that a *full* world state would trigger full egalitarianism. You're just carving out a "humanitarian minimum" exception for the current non-ideal world.

  **The Cost:**
  You concede ground to the cosmopolitan critic. They will argue that if basic needs generate practice-independent claims, the distinction between "needs" and "other goods" is arbitrary. You will have to defend the "sufficiency" threshold vigorously. But this is a better battle to fight than the logical contradiction currently sitting in your (4)/(6) junction.

  **Final Blunt Advice:**
  Stop worrying about (1) and (2). That's a standard, defensible position (Associative Cosmopolitanism). Your real vulnerability is that you are trying to run a Practice-Dependent engine with a Humanitarian fuel mix. Strict PD leaves no room for the "dire need" override you want in (6). Soften the PD constraint to allow for a basic human rights floor, and the rest of the car runs smoothly.
