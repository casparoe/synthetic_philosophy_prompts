answer: |-
  # Methodological Desiderata for Chance-Credence Coordination

  ## 1. Situational Obligations

  **(a) Self-Undermining Chance**
  (i) **Requirement:** The principle must allow an agent's credence in a chance theory $T$ to differ from the chance $T$ assigns to itself, even when the agent knows $T$. Specifically, if $T$ entails $ch_T(T) = x$ where $x < 1$, the principle must not force $Cr(T) = x$.
  (ii) **Motivation:** Consider a stochastic theory $T$ that posits a chance function which, by its own definition, assigns probability 0.5 to the proposition that $T$ is the true chance theory. If the principle forces $Cr(T) = ch_T(T)$, the agent must hold credence 0.5 in $T$ while knowing $T$ entails the chance function is *this* one. This generates a contradiction between the agent's knowledge and their mandated credence.
  (iii) **Verdict:** **Non-negotiable.** A principle that generates logical contradictions in possible worlds cannot serve as a norm of rationality.

  **(b) Frequency Clash (Undermining Futures)**
  (i) **Requirement:** The principle must explicitly state whether knowledge of actual long-run frequencies overrides single-case chance assignments in the calculation of credence. It cannot remain neutral on whether $Cr(A | ch(A)=x \land \text{Freq}(A) \neq x)$ equals $x$.
  (ii) **Motivation:** In metaphysics where chances supervene on the total history of events (e.g., best-system analyses), future frequencies can determine present chances. If an agent knows the present chance is 0.5 but also knows the future frequency will be 0.8, a naive principle yields conflicting guidance. Silence here renders the principle inapplicable in deterministic or Humean worlds.
  (iii) **Verdict:** **Non-negotiable.** Metaphysical neutrality that results in action-guiding ambiguity is a defect, not a feature.

  **(c) Chance Zero**
  (i) **Requirement:** The principle must provide a defined value for $Cr(A | E \land ch(A) = 0)$ when $A$ is logically possible and observed. It must not rely on standard conditional probability where the conditioning proposition has measure zero.
  (ii) **Motivation:** In continuous physical theories (e.g., particle position), the chance of any exact value is zero. If an agent observes the particle at position $p$, their credence is 1. The schema yields 0. A principle that declares the agent irrational in standard measurement scenarios is untenable.
  (iii) **Verdict:** **Non-negotiable.** Mathematical coherence with standard physical theories is required.

  **(d) The Blameless Ignoramus**
  (i) **Requirement:** The principle must specify its temporal scope: it must constrain *ur-priors* (initial credences before empirical evidence) rather than current credences for agents lacking access to chance facts.
  (ii) **Motivation:** An agent who tracks frequencies but lacks the concept of objective chance violates the schema if it binds current credence. Yet, they are not irrational. If the principle binds current credence universally, it violates "ought implies can."
  (iii) **Verdict:** **Non-negotiable.** Normative constraints must respect epistemic accessibility.

  ## 2. Status
  (i) **Requirement:** The principle must be non-trivial (chance is not *defined* as the quantity credence defers to) and must declare whether its justification is a priori or empirical.
  (ii) **Motivation:** If chance is defined by the principle, the principle tells us nothing about the world. If it is empirical, it is fallible. Claiming both a priori status and non-triviality risks asserting synthetic knowledge without experience.
  (iii) **Verdict:** **Preference.** Camps differ here, but **Non-triviality** is non-negotiable. A definition cannot bridge distinct concepts.

  ## 3. Restriction on Evidence (Admissibility)
  (i) **Requirement:** The class of admissible evidence $E$ must be characterized independently of the principle's truth conditions. $E$ cannot be defined as "evidence that does not violate the principle."
  (ii) **Motivation:** If admissibility is defined circularly to save the schema from counterexamples (e.g., "future frequencies are inadmissible" simply because they break the equation), the principle becomes a tautology with no predictive or normative power.
  (iii) **Verdict:** **Non-negotiable.** Circular definitions render the principle vacuous.

  ## 4. Existence, Consistency, and Stability
  (i) **Requirement:** There must exist at least one probability function satisfying the principle, the probability axioms, and standard conditionalization. Compliance must not be lost upon acquiring new admissible evidence.
  (ii) **Motivation:** If no credence function can satisfy the principle given a specific chance theory, the principle demands the impossible. If learning admissible evidence forces a violation, the principle is dynamically unstable.
  (iii) **Verdict:** **Non-negotiable.** Incoherent norms are not norms.

  ## 5. Conceptual Distinctions
  (i) **Requirement:** The formulation must syntactically distinguish the chance function $ch$, the time of chance assignment $t$, the agent's evidence about chance, and the metaphysical basis of chance (propensity vs. frequency).
  (ii) **Motivation:** Collapsing $ch(A)$ with $Cr(A)$ invites the self-undermining contradiction. Collapsing $ch_t(A)$ with $ch_{t+1}(A)$ ignores the flow of time in stochastic processes.
  (iii) **Verdict:** **Non-negotiable.** Ambiguity prevents formal verification.

  ## 6. Accessibility
  (i) **Requirement:** The principle must be usable by an agent who does not know the true chance function (to allow learning), but must not allow known chance to be overridden by inadmissible evidence (to maintain normativity).
  (ii) **Motivation:** If an agent must know $ch(A)=x$ to apply the principle, they cannot use it to infer $ch$ from frequencies. If known chance is always overridden by frequency data, the concept of objective chance drops out of the epistemology.
  (iii) **Verdict:** **Non-negotiable.** The principle must facilitate, not block, statistical inference.

  ***

  ## Methodological Assessment

  **Which single requirement does the most exclusionary work?**
  **Desideratum 4 (Existence and Consistency)** is the most exclusionary. Many philosophically elegant formulations of the bridge principle (particularly the original schema) fail this test when paired with realistic chance theories. For instance, in Humean worlds where chances supervene on the total history of events, the original schema admits *no* probability function that satisfies it jointly with the chance theory's own probabilities. A principle that looks normatively attractive but has no model in the very worlds it is meant to govern is mathematically dead. This requirement forces the abandonment of the naive schema in favor of more complex formulations (like the "New Principle") that sacrifice simplicity for coherence.

  **Is any subset of the requirements jointly unsatisfiable?**
  Yes. **Desideratum 2 (A Priori Status)** and **Desideratum 1b (Metaphysical Neutrality/Frequency Clash)** are jointly unsatisfiable.
  *Argument:* If the principle is a priori, it must hold regardless of the metaphysical nature of chance. However, the correct coordination of credence and chance depends on that metaphysics. If chance is primitive, the naive schema holds. If chance supervenes on the total history (Humean), the naive schema leads to contradiction (see 1b) and must be replaced by a principle that conditions on the whole chance hypothesis. A single a priori principle cannot be sensitive to empirical metaphysical facts.
  *Resolution:* **Desideratum 2 (A Priori Status)** must be dropped or weakened. The bridge principle is a substantive normative claim that depends on the metaphysical account of chance. We lose the idea that rationality alone dictates the principle without knowledge of the world's structure.

  **Scoring the Contenders**

  **1. Original Schema with Admissibility Restriction**
  Fails **1a (Self-Undermining)** and **4 (Existence)** in Humean worlds. The admissibility restriction often violates **3 (Non-Circularity)**, as it is frequently defined merely to block counterexamples. It satisfies **6 (Accessibility)** well but at the cost of coherence.
  *Score: Rejected.*

  **2. Ur-Prior Constraint (New Principle style)**
  Satisfies **1a**, **1b**, and **4** by conditioning on the entire chance hypothesis rather than single chance values. It handles **1d (Ignoramus)** by binding only initial credences. However, it struggles with **6 (Accessibility)**, as it is difficult for an agent to apply without already having strong views on chance theories.
  *Score: Strong Contender.*

  **3. Accuracy-Dominance Derivation**
  Satisfies **2 (Status)** by grounding the principle in epistemic utility rather than intuition. It handles **1c (Chance Zero)** via proper scoring rules for continuous distributions. However, it risks violating **5 (Distinctions)** if the scoring rule conflates chance with credence, and it depends on the specific choice of accuracy measure.
  *Score: Viable but Technical.*

  **4. Role-Functionalism (Chance is the Deference Role)**
  Satisfies **6 (Accessibility)** and **1d (Ignoramus)** trivially. However, it fails **2 (Non-Triviality)** by definition; if chance *is* whatever credence defers to, the principle tells us nothing about physical theories. It collapses the distinction between objective chance and epistemic probability, violating **5**.
  *Score: Rejected.*
