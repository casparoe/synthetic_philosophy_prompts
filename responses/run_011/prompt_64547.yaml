  # Joint Statement on the Heterogeneity Problem for Hedonism

  **Issued by:** Camp A (Felt-Quality) and Camp B (Pro-Attitude)
  **Date:** [Current Date]
  **Subject:** Resolution of Standoff and Path Forward

  ## I. Agreed Claims

  Both camps affirm the following substantive claims. Signing these commitments entails specific theoretical costs for each side, ensuring the agreement is non-trivial.

  1.  **Welfare Measurability:** For welfare hedonism to be non-trivial, any account of pleasure must render pleasure a measurable quantity capable of summation and comparison across distinct lives or temporal segments.
      *   *Cost:* Camp A must explain how phenomenal tones are quantified across disparate sensory materials; Camp B must explain how pro-attitudes are quantified across disparate objects without collapsing into desire-satisfactionism.
  2.  **Case Difficulty Ranking:** Both camps agree that Camp B's account offers a more straightforward explanation of Case 1 (Cold Plunge), while Camp A's account offers a more straightforward explanation of Case 2 (The Click).
      *   *Cost:* Camp A concedes that "painful feel" data challenges the intrinsic tone thesis; Camp B concedes that "objectless feel" data challenges the relational attitude thesis.
  3.  **Report Reliability:** Introspective reports regarding phenomenology and preference that survive full debriefing and manipulation checks (as in Case 7) constitute fixed data that any adequate theory must accommodate, not explain away as error.
      *   *Cost:* Camp A must accommodate cognitive penetration of phenomenology; Camp B must accommodate the subject's insistence on phenomenological difference despite identical sensory input.
  4.  **Dissociation of Dimensions:** Based on the shared affective-neuroscience background, both camps accept that hedonic impact (felt intensity) and incentive motivation (motivational pull) are dissociable dimensions (as in Case 8), and that welfare hedonism must specify which dimension carries the normative weight for welfare calculations.
      *   *Cost:* Camp A must defend why motivation might diverge from welfare value; Camp B must defend why felt intensity might diverge from welfare value.

  ## II. Residual Disagreements

  The following table outlines the remaining substantive disputes. Below the table, each camp provides a charitable interpretation of the opposing formulation.

  | ID | Question at issue | Camp A's formulation, in words Camp A would sign | Camp B's formulation, in words Camp B would sign | Substantive, verbal, or mixed | What would move it |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **D1** | **The Unifier** | Is there a common phenomenal component intrinsic to all pleasure tokens, describable independently of their objects? | Is there a common functional profile relating subjects to objects, constitutive of all pleasure tokens? | Mixed | Empirical convergence on phenomenological description vs. functional role isolation. |
  | **D2** | **Welfare Weight** | In cases of dissociation (Case 8), does felt intensity determine the amount of pleasure contributing to welfare? | In cases of dissociation (Case 8), does the strength of the pro-attitude determine the amount of pleasure contributing to welfare? | Substantive | Consensus on normative intuitions regarding Case 8(a) and 8(b). |
  | **D3** | **Bittersweet Unity** | Is a bittersweet experience (Case 5, 6) a single item with a complex hedonic tone, rather than two simultaneous items netted? | Is a bittersweet experience (Case 5, 6) a single complex attitude or a netting of distinct positive and negative attitudes? | Mixed | Success or failure of subjects to decompose the experience under trained attention. |

  **Charitable Interpretations**

  *   **Regarding D1:** Camp A accepts that Camp B's "functional profile" may successfully track the extension of pleasure terms even if it misses the intrinsic nature. Camp B accepts that Camp A's "phenomenal component" may successfully describe the subjective character of experience even if it is not the unifying theoretical kind.
  *   **Regarding D2:** Camp A accepts that motivational pull is a reliable heuristic for welfare value in standard cases, even if not constitutive. Camp B accepts that felt intensity is a reliable indicator of welfare value in standard cases, even if not constitutive.
  *   **Regarding D3:** Camp A accepts that Camp B's "netting" model may explain the behavioral output of bittersweet states even if the phenomenology is unified. Camp B accepts that Camp A's "single item" model may describe the phenomenology even if the metaphysical structure is composite.

  ## III. Cruxes

  The following sub-questions are identified as cruxes. Settling them would force revision or abandonment of current theses.

  **C1: The Common Component**
  *   **Bearing:** Cases 2, 3, 7.
  *   **Shared Test:** Trained comparative attention tasks where subjects must isolate a common descriptor across heterogeneous pleasures (e.g., Click vs. Cold Plunge) without referencing objects.
  *   **Camp A Prediction:** Subjects will converge on a descriptor (e.g., "warmth," "rightness") independent of object.
  *   **Camp B Prediction:** Subjects will fail to isolate a descriptor or will describe functional relations (e.g., "wanting this to continue").
  *   **Camp A Revision Trigger:** If subjects consistently fail to isolate a descriptor across 5 heterogeneous pairs, Camp A abandons the "single component" thesis and retreats to a "family resemblance" phenomenology.
  *   **Camp B Revision Trigger:** If subjects consistently isolate a non-functional descriptor across 5 heterogeneous pairs, Camp B abandons the "purely relational" thesis and retreats to a "hybrid" account acknowledging phenomenal constraints.

  **C2: The Welfare Dimension**
  *   **Bearing:** Cases 1, 8.
  *   **Shared Test:** Welfare ranking tasks on Case 8 scenarios (Compulsive Episode vs. Low-Intensity Walk) asking which life contains more *pleasure* (not necessarily more welfare).
  *   **Camp A Prediction:** Subjects will rank the Compulsive Episode higher in pleasure due to intensity.
  *   **Camp B Prediction:** Subjects will rank the Low-Intensity Walk higher in pleasure due to endorsement.
  *   **Camp A Revision Trigger:** If consensus ranks the Walk higher in pleasure, Camp A abandons "intensity as welfare weight" and retreats to "intensity as raw feel, attitude as weight."
  *   **Camp B Revision Trigger:** If consensus ranks the Episode higher in pleasure, Camp B abandons "attitude as welfare weight" and retreats to "attitude as identification, intensity as weight."

  **C3: Bittersweet Unity**
  *   **Bearing:** Cases 5, 6.
  *   **Shared Test:** Decomposition training where subjects attempt to attend separately to the pleasant and unpleasant components of Nostalgia (Case 5).
  *   **Camp A Prediction:** Subjects will report the experience dissolves or changes when decomposition is attempted (unity is robust).
  *   **Camp B Prediction:** Subjects will report able to attend to distinct components simultaneously (unity is aggregate).
  *   **Camp A Revision Trigger:** If subjects reliably decompose without altering the experience, Camp A abandons the "single item" thesis and retreats to "integrated complex tone."
  *   **Camp B Revision Trigger:** If decomposition consistently alters or destroys the experience, Camp B abandons the "netting" thesis and retreats to "atomic complex attitude."

  ## IV. Verbal Disputes

  The following portions of the two-year argument are judged to have been merely verbal or partially verbal. Stipulations are adopted to resolve them.

  1.  **Ambiguity:** "Intrinsic"
      *   **Camp A Reading:** Intrinsic to the token experience (non-relational property).
      *   **Camp B Reading:** Intrinsic to the type of state (independent of external facts).
      *   **Adopted Stipulation:** "Intrinsic" shall mean "a non-relational property of the experience token."
      *   **Disagreements Dissolved:** This stipulation reduces the scope of **D1**, as Camp B acknowledges experiences have non-relational properties even if they are not the unifying kind.

  2.  **Ambiguity:** "Feel"
      *   **Camp A Reading:** A sensation-like component present in the experience.
      *   **Camp B Reading:** The manner in which an object is experienced.
      *   **Adopted Stipulation:** "Feel" shall refer to "phenomenal character regardless of ontological category."
      *   **Disagreements Dissolved:** This stipulation reduces the scope of **D1** and **D3**, allowing both camps to discuss phenomenology without committing to ontological categories prematurely.

  3.  **Ambiguity:** "Same Feel"
      *   **Camp A Reading:** Indiscriminable in pairwise comparison.
      *   **Camp B Reading:** Sharing a common component.
      *   **Adopted Stipulation:** "Same Feel" shall mean "sharing a common component describable independently of object."
      *   **Disagreements Dissolved:** This stipulation clarifies **D1**, ensuring Camp B's objection targets the describability condition rather than indiscriminability.

