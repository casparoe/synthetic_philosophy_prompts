answer: |-
  | Industrial Revolution (Source) | AI Debate (Target) |
  | :--- | :--- |
  | Steam/Cotton (General-Purpose Tech) | Generative AI/Robotics |
  | Factory System | Algorithmic Management/Platforms |
  | Agricultural Surplus Labour | Global Labour Arbitrage/Gig Reserve |
  | Solow Paradox (Productivity Lag) | Measured AI Productivity Lag |
  | Post-1840 Wage Take-off | Future Broad-Based Recovery |
  | **Institutions (Unions, Franchise, Reform)** | ***(Unspecified/Assumed Automatic)*** |

  The visiting fellow earns credit on the productivity lag. Historical national accounts confirm that GPTs often show modest initial effects while complementary investments accumulate. This Solow Paradox is a valid caution against expecting immediate GDP spikes. However, the analogy fractures when examining distribution.

  Disanalogies divide into those merely interesting and those that undercut. *Interesting* differences include energy costs (coal vs. electricity) or specific demographic transition rates; these affect magnitude but not the mechanism of recovery. *Genuinely Undercutting* differences are diffusion speed and institutional causality. IR technologies diffused over generations, allowing labour markets to adjust intergenerationally. AI diffuses in years. More critically, the fellow treats the post-1840 wage recovery as technological inevitability. Historians attribute it to contingent political settlements: union legalisation, franchise expansion, and the repeal of the Corn Laws.

  Three pressure points dismantle the patience argument. First, was the recovery technological or political? Evidence suggests the latter. Real wages rose when labour gained bargaining power, not when steam engines improved. If the recovery was political, waiting for technology alone is category error; the analogy licenses intervention, not patience.

  Second, can labour-replacing technology be assumed to become labour-augmenting on schedule? Steam replaced muscle but created new physical tasks. AI replaces cognition. For AI to augment, firms must invest in complementary capital rather than substituting cheap intelligence. There is no guarantee this investment occurs without wage floors forcing capital deepening. If AI remains predominantly substitutive, the "augmenting phase" may never arrive.

  Third, did the source have features the target lacks? The IR had a vast frontier of new occupations and colonies to absorb displaced workers. AI automates the very tasks workers would transition into. Furthermore, IR diffusion was slow enough for human capital accumulation; AI's speed may outpace retraining, making the "uncomfortable generations" permanently scarred rather than transiently disadvantaged.

  The verdict is plain: the patience-and-convergence conclusion does not survive. The fellow mistakes correlation for causation, attributing wage recovery to technology when it was driven by the institutions he omitted. Properly audited, the IR analogy supports the opposite policy posture: without institutional counterweights, technology alone delivers Engels' Pause indefinitely.

  Is there a better historical source? The mid-20th century "Great Compression" offers a closer match for high-skill automation contexts. However, that episode also licenses intervention (strong unions, progressive taxation) rather than patience. No historical source licenses passive waiting. The IR case demonstrates that broad-based growth requires political engineering to match technological change. To argue otherwise is to audit the history while ignoring the verdict.
