  3.  **Point 7 and the Text:** Point 7 (20 vs. 90 is worse *for the deceased*) is arguably anti-Zhuangzian. The text generally emphasizes accepting *ming* (fate/destiny), including premature death, without judging it as "worse" in a way that generates attachment.
