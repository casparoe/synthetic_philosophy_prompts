      *   Socrates: Fidelity + Honesty -> No Efficacy.
      *   Diodotus: Efficacy + Fidelity (to the goal of saving lives) -> No Honesty (hid the moral argument).
      *   Nicias: Fidelity (to his fear) + Honesty (maybe?) -> No Efficacy. *Actually Nicias is the messy one.* He tried to game it (Honesty fail) to stop it (Efficacy fail) because he was sincere (Fidelity pass).
      *   Better Trilemma for the Scientist: **Accuracy** (The Science), **Influence** (The Vote), **Agency** (Keeping your soul).
      *   Let's stick close to the user's formulation but sharpen it.

      *(Self-Correction)*: Wait, the user wants to know if the theory *can* meet the requirements. I need to show where the theory breaks. The "Squeeze" is that a single normative theory cannot maximize all three without breaking the democratic contract or the scientific method.

