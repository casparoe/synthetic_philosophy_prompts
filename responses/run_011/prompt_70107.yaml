prompt: |-
  I run a four-person cost and schedule estimating unit inside a state infrastructure agency. We do maybe 25 estimates a year, and they go straight into budget submissions the legislature votes on, so when we're low a program gets cut later. Our method right now is basically "find the three most similar past projects and average their overruns," and our internal auditor just wrote us up for it — similar by what criteria, and why three, and who picks them. Fair hit, I can't answer it.

  I know this has a name in philosophy (the reference class problem) and a more applied version in forecasting. I don't want an essay about either. I want a written procedure my analysts can run on a single estimate in an afternoon, with no stats background beyond means, percentages, and reading a spreadsheet. Two pages of instructions plus a worksheet they fill in. It has to answer these things, roughly in this order:

  1. How to generate candidate reference classes for a given project. I want the procedure to force at least a broad class and a narrow class, and to say how to tell you've gone broad enough / narrow enough rather than just stopping when you like the answer.

  2. A test for gerrymandered classes. Someone will always be able to cook up a class where the base rate looks great — "all projects whose sponsor had previously delivered a project in the same county" or whatever. Give me a rule an analyst can apply and that a hostile auditor can check, something better than "use your professional judgment." If the honest answer is that part of it can only be "was the class definition fixed before anyone looked at the outcomes," say that and build the paper trail around it.

  3. What to do when relevance and sample size pull opposite ways — the narrow class is mechanistically similar but has n=4, the broad class has n=200 and includes stuff that obviously isn't like this. I want an actual tie-break or a weighting rule with numbers in it, not "balance the two." If you're going to say shrink toward the broad class, tell me by how much and what makes the shrinkage bigger or smaller.

  4. Whether the analyst should be thinking in frequencies or in odds. Half my team naturally thinks "what are the chances this comes in over budget," the other half thinks "what price would I take on that bet." Tell me whether your procedure gives a different answer under the two framings, and if it can, which framing the worksheet should use and why — I suspect the betting framing quietly punishes you for picking a class where you'd never actually take the bet, and I want to know if that's a feature.

  5. Mark every step that is a judgment call wearing a procedure costume. I'd rather have three flagged steps I know are soft than fifteen steps that look mechanical. And say where the procedure hands the decision up to me because it's about what we're willing to commit to, not about the data.

  Then run it end to end on two real-shaped cases, showing the worksheet filled in:

  - A 40 km light rail extension in a metro area where we've never built rail. We have built eleven bus rapid transit corridors. Is BRT in the reference class or out, and what does the procedure do when the narrowest defensible class is empty?
  - A 300-bed hospital replacement. We've done six comparable hospital builds, all six under design-bid-build; this one is design-build, and the procurement change is the whole point of the project.

  For the hospital one, don't soften the result. I'm fairly sure our hospital numbers have been optimistic for a decade and if your procedure says the six-project average is the wrong thing to reach for, I want it to say so in a form I can put in front of my director.

  Finally: one paragraph on what the procedure can't fix. If the base rates in our own project database are themselves contaminated by the fact that we've always estimated optimistically, say whether the procedure detects that or just inherits it.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **Context:** 4-person cost/schedule estimating unit in a state infrastructure agency. 25 estimates/year. High stakes (legislative budget). Current method (average 3 similar projects) is audited and found lacking (Reference Class Problem).
      *   **Goal:** A written procedure (2 pages) + a worksheet. No advanced stats (means, %, spreadsheets only).
      *   **Specific Requirements:**
          1.  Generate candidate reference classes (broad vs. narrow, stopping rules).
          2.  Test for gerrymandering (objective rules, paper trail).
          3.  Relevance vs. Sample Size trade-off (weighting/shrinkage rule with numbers).
          4.  Frequencies vs. Odds (framing decision).
          5.  Flag judgment calls vs. mechanical steps. Escalation points.
          6.  Two Case Studies: Light Rail (no rail history, have BRT) and Hospital (6 comps, but DBB vs. DB).
          7.  Limitations Paragraph (contaminated base rates).
      *   **Tone:** Direct, practical, audit-proof, no fluff.

  2.  **Deconstruct the Reference Class Problem (RCP) for this Context:**
      *   The core issue is selecting the right "class" of past projects to predict the future one.
      *   *Broad Class:* High sample size, low relevance (e.g., "all infrastructure").
      *   *Narrow Class:* High relevance, low sample size (e.g., "light rail in this specific soil").
      *   *Gerrymandering:* Picking a class specifically to get a desired number.
      *   *Solution Strategy:* Reference Class Forecasting (RCF) as popularized by Flyvbjerg, but simplified for non-statisticians. Use a weighted average between the "Inside View" (engineer's estimate) and "Outside View" (reference class), or between Narrow and Broad classes. Given the prompt asks about Narrow vs. Broad specifically, I will focus on weighting those two.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Requirement 1 (Classes):* Need definitions. Broad = Agency-wide or Type-wide. Narrow = Specific tech/location. Stopping rule: Minimum $n$. Let's set $n=10$ for Broad, $n=5$ for Narrow. If Narrow $<5$, must expand.
      *   *Requirement 2 (Gerrymandering):* The "Pre-Registration" rule. Criteria must be written *before* querying the database. Also, the "Exclusion Test": If you exclude a project, you must write why *before* seeing its cost performance.
      *   *Requirement 3 (Weighting):* This is the math part. Needs to be simple. Let's use a stability weight. If Narrow $n < 10$, shrink toward Broad. Formula: $Weight_{Narrow} = n / (n + k)$. Or simpler: If $n < 10$, use 50/50. If $n > 20$, use 100% Narrow. Let's go with a linear slide scale for precision but keep it spreadsheet-friendly. Actually, a simple "Credibility Weight" is better. $W = n / 15$. Cap at 1.0. Final Estimate = $(W \times Narrow) + ((1-W) \times Broad)$.
      *   *Requirement 4 (Frequencies vs. Odds):* Frequencies are safer for bureaucracy. "X% of projects overrun" is easier to audit than "I'd bet $100." The worksheet should use percentages (frequencies).
      *   *Requirement 5 (Judgment Calls):* Flag the definition of classes. Flag the exclusion of outliers. Escalate if the adjustment exceeds a certain threshold (e.g., >20% change from engineer's estimate).

  4.  **Developing the Worksheet:**
      *   Needs columns for Class Name, Criteria, $n$, Mean Overrun %, Weight, Adjusted %.
      *   Needs signature blocks for "Criteria Defined Before Query."

  5.  **Developing the Case Studies:**
      *   *Light Rail:* No rail history. Narrow class (Rail) is empty ($n=0$). Procedure must force expansion to BRT or "Major Transit." If BRT is used, acknowledge the mechanistic difference. Weighting will heavily favor Broad (All Major Infrastructure) because BRT relevance is low.
      *   *Hospital:* 6 comps (DBB). Project is DB. Narrow class (DB Hospitals) is empty. Class (DBB Hospitals) exists but is mechanistically different (the point of the project is to change this). Procedure must flag this as a "Systemic Change." The 6-project average is likely optimistic if DB is intended to save money/time but historically DBB overruns. Actually, usually DB *reduces* cost growth, but if the *estimate* is based on DBB history, it might be wrong. The prompt says "hospital numbers have been optimistic." If the 6 comps underran or met budget, but the new one is DB, does that help? Usually, DB shifts risk. But the prompt implies the *estimates* are optimistic. If the 6 past projects had cost growth, and this is DB, do we expect less growth? The procedure needs to handle the "Empty Narrow Class" again. If no DB hospitals, we must use DBB hospitals but apply a "Procurement Adjustment" or default to Broad. Let's make the procedure strict: If the defining feature (DB) has no history, you cannot claim the Narrow Class (DBB Hospitals) is fully relevant. You must shrink toward Broad (All Hospitals or All State Buildings).

  6.  **Refining the Weighting Rule (Requirement 3):**
      *   I need a specific number. Let's use a "Stability Threshold."
      *   Rule: Narrow Class gets 100% weight only if $n \ge 15$.
      *   If $n < 15$, Weight = $n / 15$.
      *   Remainder weight goes to Broad Class.
      *   This is calculable in Excel.

  7.  **Refining the Gerrymandering Test (Requirement 2):**
      *   "The Blind Exclusion Rule." You cannot exclude a project from the class based on its cost performance. You can only exclude based on scope/physical criteria defined *before* pulling the cost data.
      *   Audit trail: The "Class Definition Log" must be dated before the "Data Pull."

  8.  **Refining Frequencies vs. Odds (Requirement 4):**
      *   Use Frequencies (Percentiles). "80th Percentile Cost" is standard in risk analysis. It translates to "In 80% of past cases, the cost was lower than this." This avoids the "betting" psychology which varies by person.

  9.  **Addressing the "Contaminated Base Rates" (Final Paragraph):**
      *   If all past estimates are optimistic, the RCF will inherit that optimism unless the "Overrun %" is calculated against *final* costs, not *estimated* costs. The procedure must insist on using *Actual Final Cost / Original Budget*. If the database only stores "Original Budget" and "Current Budget," the procedure fails. I need to state this limitation clearly.

  10. **Review against Constraints:**
      *   Two pages instructions? Keep it tight.
      *   Worksheet included? Yes.
      *   No stats beyond means/%? Yes.
      *   Case studies specific? Yes.
      *   Hospital result harsh? Yes, if the data says so.

  11. **Final Polish:**
      *   Ensure the tone is authoritative but practical.
      *   Make sure the "Judgment Call" flags are visible (e.g., [JUDGMENT]).
      *   Ensure the escalation point is clear (Director approval).

  *(Self-Correction during drafting)*: Wait, for the Hospital case, if we have 6 DBB hospitals and the new one is DB. The prompt says "procurement change is the whole point." This implies we *expect* different performance. If we use the DBB history, we ignore the point of the project. If we use no history, we have no data. The procedure should force us to use the DBB history but apply a "Mechanism Adjustment" or acknowledge the risk. Actually, the strict RCF approach says: If the class doesn't match (DB vs DBB), it's not the narrow class. It belongs in a broader class (All Hospitals). If All Hospitals ($n=20$) shows 20% overrun, and DBB Hospitals ($n=6$) shows 10% overrun, but we are doing DB... DB is usually faster/cheaper *if* scope is fixed. But if the *estimates* are historically optimistic, the DBB data is tainted. The prompt asks me not to soften the result. If the procedure says "Narrow class invalid due to procurement mismatch," we fall back to Broad. I will write the procedure to invalidate the Narrow class if the key differentiator (Procurement) has no history.

  Let's refine the Weighting Rule. $n=6$ is too small for full confidence.
  Weight = $6 / 15 = 0.4$.
  40% Narrow (DBB Hospitals), 60% Broad (All State Buildings).
  This dilutes the specific hospital data with broader data, likely increasing the contingency if the broad data is more realistic.

  Okay, let's write it.

  *Structure:*
  1. Procedure Document (Page 1-2)
  2. Worksheet (Page 3)
  3. Case Studies (Page 4)
  4. Limitations (Page 5)

  *Wait, constraint check:* "Two pages of instructions plus a worksheet they fill in." I should combine the instruction text to fit roughly 2 pages worth of content, then the worksheet, then the cases. I will format the output to clearly distinguish these sections.

  *Re-check Requirement 4:* "Whether the analyst should be thinking in frequencies or in odds." I need to explicitly answer this in the text. I will choose Frequencies (Percentiles) because it's audit-friendly. "80% confidence" is standard.

  *Re-check Requirement 5:* "Mark every step that is a judgment call." I will use bold **[JUDGMENT]** tags.

  *Re-check Hospital Case:* "Don't soften the result." If the 6 projects averaged 5% overrun, but the Broad class averages 25%, and the weight is 40/60, the result is ~17%. This is higher than the team wants. I will present this clearly.

  *Re-check Light Rail:* Narrow class empty. Must use BRT or Broad. If BRT is used, relevance is low. Procedure should penalize relevance. I'll add a "Relevance Discount" or just rely on the Broad class weight. Let's stick to the $n$-weighting for simplicity. If Narrow $n=0$, Weight=0. 100% Broad.

  Let's finalize the "Gerrymandering" test. The "Pre-Commitment Log." Criteria written before data view.

  Okay, ready to generate.cw
answer: |-
  # PROCEDURE: REFERENCE CLASS FORECASTING (RCF) FOR CAPITAL PROJECTS
  **Effective Date:** Immediate | **Owner:** Estimating Unit Lead | **Audit Standard:** A-133 Compliance

  ## 1. PURPOSE
  To replace subjective "similar project" selection with a statistically defensible method for calculating cost contingency. This procedure calculates an **Outside View** adjustment based on historical performance of comparable projects.

  ## 2. DEFINING REFERENCE CLASSES
  You must identify two classes for every estimate: a **Narrow Class** (mechanistically similar) and a **Broad Class** (institutionally similar).

  *   **Narrow Class:** Same technology, same environment, same delivery method. (e.g., "Urban Light Rail, Tunnelled").
  *   **Broad Class:** Same funding source, same agency, same asset type. (e.g., "All State Transportation Capital Projects").

  **Stopping Rules:**
  1.  **Minimum Sample Size:** A class is invalid if $n < 5$. If your Narrow Class has $n < 5$, you must expand criteria (e.g., broaden geography) until $n \ge 5$. If you cannot reach $n=5$ without including irrelevant tech (e.g., buses for rail), the Narrow Class is **Empty**. Use 0% weight for Narrow.
  2.  **Maximum Heterogeneity:** A class is invalid if the cost variance (Standard Deviation) exceeds 50% of the mean. If so, split the class or move to Broad.

  **[JUDGMENT CALL 1]:** Defining the criteria for "similarity." You must document the physical/technical criteria *before* querying cost data.

  ## 3. ANTI-GERRYMANDERING PROTOCOL
  To prevent selecting classes that yield desired outcomes:

  1.  **The Pre-Commitment Log:** Before opening the cost database, you must fill out the "Class Definition" section of the Worksheet. Date and sign it.
  2.  **The Blind Exclusion Rule:** You may exclude a project from the class *only* based on scope/physical criteria defined in step 1. You **cannot** exclude a project because its cost performance was an outlier.
      *   *Audit Test:* If a project is excluded, the auditor will check the Pre-Commitment Log. If the exclusion criterion (e.g., "soil type") was not listed there, the exclusion is invalid.
  3.  **Data Lock:** Once the class list is generated, lock the row IDs. No adding/removing projects after viewing their cost growth %.

  ## 4. RELEVANCE VS. SAMPLE SIZE (THE WEIGHTING RULE)
  Do not choose one class. Weight them based on statistical stability. We assume a stable reference class requires $n=15$.

  **Calculate Weight ($W$) for Narrow Class:**
  $$W_{narrow} = \frac{n_{narrow}}{15}$$
  *   If $n_{narrow} \ge 15$, $W_{narrow} = 1.0$ (100% Narrow).
  *   If $n_{narrow} = 0$, $W_{narrow} = 0$ (100% Broad).
  *   Cap $W_{narrow}$ at 1.0. Do not go below 0.

  **Calculate Weight ($W$) for Broad Class:**
  $$W_{broad} = 1.0 - W_{narrow}$$

  **Calculate Adjusted Overrun %:**
  $$(\text{Mean Overrun}_{narrow} \times W_{narrow}) + (\text{Mean Overrun}_{broad} \times W_{broad}) = \text{RCF Adjustment \%}$$

  **[JUDGMENT CALL 2]:** If the Narrow Class is mechanistically different in a key way (e.g., Design-Bid-Build vs. Design-Build), you must flag this in the Worksheet. The Director may override the Weighting Rule to increase the Broad Class weight.

  ## 5. FREQUENCIES VS. ODDS
  **Use Frequencies (Percentiles).** Do not use betting odds.
  *   **Why:** Betting odds imply a single-event probability which varies by analyst risk tolerance. Frequencies describe the population history, which is auditable.
  *   **Target:** Calculate the **80th Percentile** cost growth of the reference class. This means "In 80% of past projects, the actual cost was lower than this number."
  *   **Worksheet:** Enter the Mean Overrun % for simplicity, but apply a +10% buffer if the class Standard Deviation is high (>30%).

  ## 6. ESCALATION
  **[DECISION POINT]:** If the RCF Adjustment % differs from the Engineer's Base Estimate contingency by more than **20%**, this worksheet must be signed by the Unit Lead and submitted to the Director for budget commitment approval. We are committing to the historical reality, not the engineering optimism.

  ***

  # WORKSHEET: RCF CALCULATION
  **Project Name:** ___________________ | **Date:** __________ | **Analyst:** __________

  ### PART A: CLASS DEFINITION (Complete BEFORE data pull)
  | Class Type | Definition Criteria (Scope, Tech, Location, Procurement) | Date Defined |
  | :--- | :--- | :--- |
  | **Narrow** | | |
  | **Broad** | | |

  ### PART B: DATA PULL & VALIDATION
  | Class Type | Projects Found ($n$) | Excluded Projects (ID & Reason) | Mean Overrun % | 80th %ile Overrun |
  | :--- | :--- | :--- | :--- | :--- |
  | **Narrow** | | | | |
  | **Broad** | | | | |

  *Validation:* Did exclusions match Part A criteria? [ ] Yes [ ] No (Stop if No)

  ### PART C: WEIGHTING & RESULT
  | Calculation | Value |
  | :--- | :--- |
  | Narrow Weight ($n / 15$, max 1.0) | |
  | Broad Weight ($1.0 - \text{Narrow}$) | |
  | **Weighted Overrun %** | **(Narrow % $\times$ W) + (Broad % $\times$ W)** |
  | Engineer's Base Contingency % | |
  | **Variance** | **(Weighted - Base)** |

  **[JUDGMENT FLAG]:** Is there a mechanistic difference (e.g., procurement method) not captured in data? [ ] Yes [ ] No
  **[ESCALATION]:** If Variance > 20%, Director Signature Required: ___________________

  ***

  # CASE STUDY RUN-THROUGHS

  ### CASE 1: 40km Light Rail Extension (Metro Area)
  **Context:** Agency has zero rail history. Eleven (11) Bus Rapid Transit (BRT) corridors exist.
  **Worksheet Execution:**
  1.  **Class Definition:**
      *   *Narrow:* "Grade-separated Rail Transit." $n = 0$.
      *   *Broad:* "Major State Transit Capital Projects" (Includes BRT, Ferry, Rail). $n = 11$.
  2.  **Gerrymandering Test:** Analyst cannot invent a "Rail" class. Must declare $n=0$.
  3.  **Weighting:**
      *   Narrow Weight: $0 / 15 = 0\%$.
      *   Broad Weight: $100\%$.
      *   *Note:* Even if BRT is used as a "proxy" Narrow class, the mechanistic difference (steel wheel vs. rubber tire, power systems) triggers **Judgment Call 2**. The Director should mandate a penalty or default to the broader "Transit" class to avoid false precision.
  4.  **Result:** The estimate relies 100% on the Broad Class history. If the 11 BRT projects averaged 25% overrun, the RCF adjustment is 25%.
  5.  **Outcome:** The team cannot claim rail-specific accuracy. The budget must reflect the agency's general transit delivery risk, not a specific rail history that doesn't exist.

  ### CASE 2: 300-Bed Hospital Replacement
  **Context:** Six (6) comparable hospital builds exist. All were Design-Bid-Build (DBB). This project is Design-Build (DB).
  **Worksheet Execution:**
  1.  **Class Definition:**
      *   *Narrow:* "State Hospital Replacements." $n = 6$.
      *   *Broad:* "All State Major Building Construction." $n = 150$.
  2.  **Data:**
      *   Narrow (6 DBB Hospitals): Mean Overrun = 8% (Historically optimistic).
      *   Broad (150 Buildings): Mean Overrun = 22% (More realistic).
  3.  **Weighting:**
      *   Narrow Weight: $6 / 15 = 0.4$ (40%).
      *   Broad Weight: $0.6$ (60%).
  4.  **Calculation:**
      *   $(8\% \times 0.4) + (22\% \times 0.6) = 3.2\% + 13.2\% = \mathbf{16.4\%}$.
  5.  **Judgment Flag:** The procurement method (DB) is the *point* of the project. The 6 historical projects are DBB. This triggers **Judgment Call 2**.
      *   *Analyst Note:* "Historical class is DBB; current project is DB. DB shifts risk but historical cost data is DBB."
      *   *Procedure Consequence:* Because the key cost-driver (procurement) differs, the Narrow Class relevance is compromised. The procedure dictates you **cannot** rely on the 8% figure.
  6.  **Hard Result:** If the Director accepts the mechanistic difference, the Narrow Weight drops to 0. The budget moves to 100% Broad Class (22%).
      *   *Director Memo:* "Our six past hospital estimates were optimistic (8% overrun). Our broader building portfolio shows 22%. Because we are changing procurement methods, we have no direct history. Per Procedure Section 4, we must shrink toward the Broad Class. We are budgeting at 22% contingency, not 8%."

  ***

  # LIMITATIONS: WHAT THIS CANNOT FIX
  This procedure detects inconsistency in *selection*, but it cannot detect contamination in the *data*. If your agency's historical database records "Original Budget" vs. "Final Cost," but the "Original Budgets" were themselves politically inflated or deflated systematically, the Reference Class inherits that bias. Specifically, if your past 25 estimates were all low-balled to get approval, your "Overrun %" will be artificially high, which is good for contingency. However, if your past projects had scope reduced mid-stream to meet budget (hiding the overrun), your database will show "0% Overrun" falsely. This procedure assumes the "Final Cost" in your database is the true economic cost. If your internal auditor finds that scope changes were used to mask cost growth in the historical data, no weighting formula will save you; you must clean the database before running this worksheet.
