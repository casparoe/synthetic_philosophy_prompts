answer: |-
  The Well-Posed Question requirement is the most exclusionary, and the subset demanding internal difference-makers alongside strict unit-independence is jointly unsatisfiable given systemic entanglement.

  ### Desiderata for Contrastive Explanation in the Great Divergence

  | Requirement | Motivation / Case | Status |
  | :--- | :--- | :--- |
  | **Contrast Class & Foil** | Logic of contrastive explanation requires fixing the relata: is the foil Jiangnan, the Empire, or Asia? Is the unit England, Britain, or NW Europe? | Non-negotiable |
  | **Explanandum Specification** | Divergence dates and measures (real wages, energy, output) vary widely; explaining "growth" is impossible without fixing the series and the breakpoint. | Non-negotiable |
  | **Difference-Maker** | The explanans must vary between the units *before* the divergence; a factor present in both or emerging after cannot explain the split. | Non-negotiable |
  | **Ban on Redescription** | Disqualifies tautologies where the cause is defined by the effect (e.g., "Britain grew because it had a growth-friendly economy"). | Non-negotiable |
  | **Forerunner & False-Start** | Must account for Song industrialization or Dutch precedence without selecting on the dependent variable (survivorship bias). | Non-negotiable |
  | **Origination vs. Persistence** | Factors initiating takeoff (spark) differ from those sustaining it (fuel); conflating them obscures causal mechanisms. | Non-negotiable |
  | **Unit-Independence (Galton's)** | Comparison requires independent cases; if units are entangled via trade/empire, within-case difference-making is unlicensed. | **Jointly Unsatisfiable** |
  | **Modal Requirement** | Contrastive explanation requires contingency; if the explanans could not have been otherwise, it explains nothing about the choice between paths. | Non-negotiable |
  | **Scope Requirement** | Determines if the theory must generalize (Japan, India, Ottomans) or if the event is singular; universalizing claims fail if limited. | Camp Preference |
  | **Well-Posed Question** | The contrast itself must be valid; asking "Britain vs. China" may be rhetorical if the causal units are "NW Europe vs. Jiangnan" or "Core vs. Periphery." | Non-negotiable |

  ### Exclusion and Unsatisfiability

  The **Unit-Independence** requirement clashes fatally with the **Difference-Maker** requirement when the explanans is an internal property. If Britain and China were mutually constituting through silver flows, trade, and empire (as Pomeranz and world-systems theorists argue), they are not independent instances suitable for controlled comparison; treating them as such licenses spurious inference. Conversely, if you enforce independence to satisfy the Difference-Maker requirement, you must ignore the global entanglements that arguably caused the divergence, rendering the explanation incomplete. This conflict is not dissolvable within the current methodological framework: you cannot simultaneously treat the units as closed systems for internal causal attribution and as open systems for global contextualization. The question is defective because it demands a local cause for a systemic phenomenon.

  ### Camp Prejudices and Account Scorecard

  Common demands for a **single prime mover**, **quantified precision**, **deterministic necessity** (anti-contingency), and **endogenous credit** (civilizational virtue) are camp prejudices masquerading as philosophical requirements; they prioritize narrative parsimony or ideological comfort over causal adequacy.

  *   **Pomeranz (Coal/New World):** Passes Contingency and Explanandum; fails Unit-Independence by treating global flows as external contingencies rather than structural conditions.
  *   **Allen (Wages/Energy):** Passes Difference-Maker on prices; fails Scope and Forerunner by unable to explain why high-wage Netherlands did not industrialize first.
  *   **North (Institutions):** Fails Ban on Redescription (institutions defined by growth) and Origination/Persistence; treats outcome features as causal priors.
  *   **Mokyr (Culture/Science):** Passes Origination; fails Difference-Maker as scientific inquiry existed in China; relies on unspecified cultural transmission filters.
  *   **Elvin (Equilibrium Trap):** Fails Modal Requirement (trap implies structural necessity) and Forerunner by unable to explain Song dynamism without ad hoc adjustment.
  *   **Landes (Civilization):** Fails Well-Posed Question (essentialist foil) and Unit-Independence; treats complex systems as monolithic cultural units immune to diffusion.
