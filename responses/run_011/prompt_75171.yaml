  The telescope wobbled as Sam leaned against the railing. It was one AM, the roof was freezing, and the coffee had gone cold an hour ago.

  "Focus it," Sam said.

  "It is focused," Alex replied, squinting through the eyepiece. "Orion's right there. Belt, sword, the whole thing."

  "Orion isn't there," Sam said, pulling their coat tighter. "Three stars are there. Maybe five. They're lightyears apart. They're not connected. They're not a thing. You're drawing lines on a scatter plot and calling it an object."

  Alex stepped back, rubbing their eyes. "This again? Look, if I point up and say 'there is a constellation,' I'm not lying. I'm picking out a pattern. 'There are' is generous. It covers stars, it covers patterns made of stars. If you deny it, you're just using the phrase differently than I am. You're policing English, not the sky."

  "It's not policing," Sam said. "It's ontology. There's exactly one objectively best way to use 'there is.' It's the way that carves the world at its joints. A scatter of stars that only look connected from here doesn't compose anything. So you're wrong about the world, not just about vocabulary."

  "You keep saying 'joints'," Alex said, laughing softly. "Like the universe comes with a instruction manual."

  "It comes with structure. Gravity binds some things. Perspective binds others. One is real, one is a projection."

  "Okay." Alex held up a hand. "Let's test that. Halfway through, remember? Let's ban 'exists' and 'there are' from the argument. Completely. Blacklist them. Now, restate your claim without those words. Then I'll restate mine. Then we see if there's anything left to fight about."

  Sam hesitated. "Fine. Without 'exists': The stars in Orion are spatially distributed such that no physical force binds them as a unit, whereas a galaxy is bound by gravity."

  "Okay," Alex said. "My turn. Without 'exists': The stars in Orion are distributed such that human visual systems group them into a recognizable pattern, whereas a random field of noise does not."

  "See?" Sam pointed. "You admitted it. 'Human visual systems.' It's about us. I'm talking about the stars. You're talking about our retinas. So the disagreement is verbal. You're just refusing to use the word 'exists' for things that aren't causally connected. But if you admit the disagreement is verbal, you lose. You said I was wrong about the world. If it's just language, you're not disagreeing with me, you're just complaining."

  "That move backfires on you," Alex said, leaning on the railing. "Because if I ban 'exists' and you still think you're winning, you're secretly leaning on one privileged reading of 'causal connection' or 'bound.' You're smuggling the ontology back in through the replacement vocabulary. You think 'gravitationally bound' is neutral description. It's not. It's just another way of saying 'this counts as real to me.'"

  "No, it counts as real because the math holds regardless of us," Sam shot back.

  "And 'joint-carving'?" Alex pressed. "You think you discover joints? Or do you decide which cuts matter? 'Natural' is just more internal-language bookkeeping. You can't discover a joint by looking at the sky. You bring the knife."

  "The knife hits bone sometimes," Sam said. "And sometimes it hits air. You're pretending the resistance doesn't matter."

  "I'm saying the resistance is just more stuff. Not 'structure.' Just stuff."

  They stood in silence for a moment. The city hummed below them. The telescope sat cold between them, pointing at nothing either of them could agree on.

  "So," Alex said finally. "Where does that leave us?"

  Sam looked up at the winter sky, clear and indifferent. "We disagree about whether you're willing to admit that some maps are false because the territory doesn't match them."

  Alex shook their head, picking up the cold coffee. "No. We disagree about whether 'territory' means anything without the map."
