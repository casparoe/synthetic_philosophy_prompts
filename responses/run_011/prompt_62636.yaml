answer: |-
  Look closely at the doxastic state you've described. You say you are confident your future credence will be 0.8, but you also believe the adversary's policy ensures it won't be 0.8 if you expect that. You cannot hold both beliefs coherently. If you truly believe the adversary's policy, you cannot be confident your future credence will be 0.8, because you believe that very confidence triggers the mechanism that prevents it. Your current credal state is unstable. Reflection is a constraint on rational agents, and it presupposes that your expectations about your future self are consistent with your beliefs about the causal processes shaping that self. If you know the process is adversarial, your expectation must track the output of that adversary, not an arbitrary number she has promised to defeat. There is likely a fixed point here—some credence $x$ such that if you expect $x$, she makes your future credence $x$—and Reflection demands you find that equilibrium, not that you stubbornly expect 0.8 while knowing it's impossible.

  Regarding your second question: if you are certain the event "my future credence is 0.8" will not occur, then in standard probability theory, conditioning on it is undefined. But Reflection isn't a command to condition on impossibilities; it's a constraint on the conditional probabilities you assign to events you take to be possible. If you know the adversary will prevent 0.8, you should assign probability zero to that future state. In that case, the conditional constraint is vacuous for that value. It doesn't force you to defer to a future state you know is fake. It only forces you to defer to future states you regard as live possibilities. If you regard a future state as a live possibility, you are implicitly granting that it could arise from a rational process. If you know it arises from manipulation, you shouldn't regard it as a live possibility for the purposes of epistemic deference.

  This brings us to the heart of your worry: why defer to a puppet? The answer is that you shouldn't, and Reflection doesn't require you to. The principle is grounded in the idea that your future self is an epistemic superior, or at least an equal who has seen more evidence. When you know your future self is a puppet, you are explicitly denying them that status. You are saying, "I know this future belief does not track the truth." In that case, you do not satisfy the condition that motivates Reflection: taking your future self to be well-informed. Reflection isn't a blind command to obey your future self regardless of the causal history; it's a coherence requirement for agents who view their future selves as continuing their own rational pursuit of truth. If you view your future self as a victim of tampering, you are no longer in the business of diachronic coherence with a rational agent; you are predicting the behavior of a compromised system. Treat it as such, and the paradox dissolves.
