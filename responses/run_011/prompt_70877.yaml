answer: |-
  Here is the spec for the norm of assertion, triaged for your use case.

  ### Desiderata for an Adequate Account of Assertion

  1.  **The Moore's Paradox Constraint:** The norm must explain why asserting the conjunction *"p, but I don't believe p"* is absurd, and why *"p, but I don't know p"* is also defective (though often assertible in humble contexts).
      *   *Case:* If the norm were merely Truth, "It's raining but I don't know it" would be fine whenever it's raining. It feels wrong because assertion presents the speaker as having the authority claimed in the first conjunct.
  2.  **The Lottery/Statistical Evidence Constraint:** The norm must explain why you cannot assert *"Your ticket lost"* based solely on 1-in-300M odds, even though you can assert *"The bus is coming"* based on perceptual evidence that is statistically less reliable.
      *   *Case:* Pure probability, however high, feels categorically different from ordinary empirical evidence. A norm based on "High Probability" fails here.
  3.  **The Lucky Truth (Gettier) Constraint:** The norm must condemn assertions that turn out true but were based on garbage evidence or luck.
      *   *Case:* I guess the coin is heads with no evidence, it lands heads. I was right, but I shouldn't have asserted it. A norm based solely on Truth fails here.
  4.  **The Stale Memory/Storage Constraint:** The norm must permit asserting things you cannot currently re-derive but remember learning competently.
      *   *Case:* I assert "Canberra is the capital of Australia." I cannot access the original source, but I recall learning it. If the norm requires *current* access to justification, ordinary conversation halts.
  5.  **The Constitutive vs. Regulative Distinction:** The account must specify whether breaking the norm means you *didn't assert* (constitutive) or you *asserted improperly* (regulative/blameworthy).
      *   *Consideration:* Most theories treat it as regulative. You made the move, but you fouled. This matters for moderation: do you delete the post (void the move) or warn the user (penalize the player)?
  6.  **The Challenge Practice Constraint:** The norm must align with what counts as a valid discharge of a challenge (e.g., "How do you know?").
      *   *Case:* If the norm is Knowledge, showing a reliable source should discharge the challenge. If the norm is Truth, only verifying the fact discharges it. The norm must match the social repair mechanism.
  7.  **The Spokesperson/Agent Constraint:** The norm must account for assertions made by entities without relevant belief states (spokespeople, actors, bots).
      *   *Case:* A press secretary reads a statement she privately doubts. She is asserting on behalf of the administration. If the norm requires *personal belief*, she is violating it constantly. If it requires *authority/license*, she is compliant. This tests whether the norm is psychological (internal state) or deontic (social permission).
  8.  **[ENFORCEABILITY] The Accessibility Constraint:** The criteria for compliance must be detectable by a third party (or the speaker) without mind-reading.
      *   *Consideration:* This is not philosophical; this is for your mod team. A norm requiring access to the speaker's private justification is philosophically fine but moderationally impossible.

  ---

  ### Triage: Non-Negotiable vs. House Preferences

  **Non-Negotiable (Philosophical Core):**
  *   **Moore's Paradox:** Any theory that makes "p but I don't believe p" rational is dead.
  *   **Lucky Truth:** Any theory that says guessing right is compliant is dead.
  *   **Challenge Practice:** Assertion is a social move; if the norm doesn't explain the response to challenges, it doesn't describe the move.

  **House Preferences (Moderator/Community Specific):**
  *   **Accessibility Constraint:** Philosophy allows for externalist norms (you can violate a norm without knowing it). You, however, need a rule you can enforce. **Flag:** This is a moderation requirement, not a philosophical one.
  *   **Applicability at Moment of Utterance:** You suspect this might be a preference. It is. Externalist norms (like Knowledge) depend on facts the speaker might not know at the time. Requiring the speaker to *know* they satisfy the norm shifts the theory from Knowledge to Justified Belief.
  *   **Criticism/Retraction Appropriateness:** This is actually Non-Negotiable. The point of a norm is to govern when criticism is valid. If a theory can't tell you when a retraction is owed, it's not a norm.

  ---

  ### Consistency Check: Joint Unsatisfiability

  **Yes. You cannot satisfy both the Factivity Requirement and the Accessibility Requirement.**

  *   **Factivity:** The assertion is only proper if $p$ is true (or known).
  *   **Accessibility:** The speaker (or mod) must be able to tell if the rule is followed at the time of posting.
  *   **The Conflict:** A user can assert a falsehood based on perfect evidence (violates Factivity, passes Accessibility). A user can assert a truth based on garbage luck (passes Factivity, violates Lucky Truth constraint).
  *   **For Your Server:** You cannot write a house rule that bans *only* false claims (requires omniscience) and *only* punishes bad process (requires mind-reading). You must choose: are you policing **accuracy** (outcome) or **rigor** (process)? You cannot do both perfectly.

  ---

  ### The Killer Constraint

  **The Lottery/Statistical Evidence Constraint.**

  This eliminates the most candidate norms immediately. It kills simple "High Probability" norms (e.g., "Assert if >95% confident"). It forces a distinction between *statistical* support and *causal/explanatory* support. For a server focused on forecasts and AI, this is the battlefield. If your rule allows "The model will crash" based solely on a p-value without a mechanism, you will have constant fights.

  ---

  ### Scorecard

  *   **Knowledge Norm:** Handles Moore and Lottery well; struggles with Spokesperson/Bot (bots don't know) and Stale Memory (do I *know* or just remember?).
  *   **Truth Norm:** Fails Lucky Truth (allows guessing); fails Moore (allows "p but I don't believe it" if p is true); best for outcome-based moderation.
  *   **Justified Belief Norm:** Handles Accessibility and Blamelessness well; fails Lucky Truth (allows guessing if confident); struggles with Lottery (high stats look like justification).
  *   **Context-Sensitive Norm:** Handles Spokesperson and Stale Memory well; fails Accessibility (impossible to moderate because the "context" is always debatable).

  ---

  ### Final Note on the Bot/Spokesperson
  If the norm requires a psychological state (Belief/Knowledge), the bot is always violating it. If the norm requires a **License** (permission to speak for a source), the bot is compliant. For your server, adopt the **License** model for bots/sources and the **Justified Belief** model for humans. This sidesteps the metaphysical problem while solving the moderation one. **[ENFORCEABILITY FLAG]**
