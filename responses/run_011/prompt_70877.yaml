prompt: |-
  OK so I moderate a ~400 person Discord where a big chunk of the traffic is people posting takes about research papers, forecasts, AI stuff, and after the third fight this quarter about whether someone was "allowed" to state a conclusion their data didn't support, I decided to write an actual house rule instead of adjudicating on vibes. My first attempt was literally "don't say things you don't know," and it fell apart immediatly: half the server pointed out that on that rule nobody can post a 60% hunch or a calibration-weighted guess, and the other half said fine, but then what about the guy who confidently asserts the finding of a study he skimmed the abstract of, and happens to be right? So before I write any policy I want the underlying spec, because I think I'm conflating at least three different questions and I don't know which ones are real.

  Give me the desiderata: what any account of the norm governing flat-out assertion has to deliver to count as adequate, with the case or consideration behind each item rather than just labels. Some of the ones I already suspect belong, so you can tell me if I've got them wrong: whatever it owes on the Moore-paradox conjunctions, and specifically why it has to handle "it's raining but I don't believe it" and "it's raining but I don't know that it" in the way it does, since those two don't seem equally bad to me; the lottery assertion, i.e. why a one-in-300-million chance feels categorically different from an ordinary perceptual report even though the odds are way better than most of what people say out loud; the flipped version, where someone asserts something true on garbage evidence and lucks into it; stale evidence and memory, since I tell people things I worked out eight months ago and could not re-derive today; the difference between a rule that constitutes the act-type and a rule about when this particular speaker is blameworthy; and the challenge practice, meaning what entitles an audience to demand "how do you know?" and what counts as discharging that demand. Also — and this is the one I can't figure out — does the norm even apply to a speaker with no relevant belief state, like a spokesperson reading a statement she disagrees with, an actor, or a chatbot? If it doesn't, what does that tell you about which of the above are requirements on assertion and which are really requirements on persons, because my bot needs an answer either way.

  Then do the triage I can't do myself. Mark which items are non-negotiable for any theory in this area and which are actually the house preferences of one camp wearing a data costume; I suspect at least one of "it must explain when criticism and retraction are appropriate" and "it must be applicable by the speaker at the moment of utterance" is like that, but I genuinely don't know which. Tell me whether any two of them are jointly unsatisfiable — that's the part I most want, since if the list is impossible to satisfy then my house rule is impossible too and I should stop pretending otherwise. And tell me which single requirement does the most work eliminating candidate norms. Close with at most one line each on how the knowledge, truth, justified-belief, and context-sensitive versions do against the list; I'll do the rest of that comparison myself. And wherever a requirement is only there because I want something a moderator or a script could actually check, rather than because it's part of the philosophy, flag it explicitly — I don't want to smuggle my use case into the theory and then congratulate myself on the result.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Discord moderator of a ~400 person server focused on research, forecasting, AI. High intellectual density.
      *   **Problem:** Frequent fights about whether people are "allowed" to state conclusions unsupported by their data. Previous rule ("don't say things you don't know") failed (too strict for hunches, too loose for lucky guesses).
      *   **Goal:** Wants a philosophical "spec" or "desiderata" for the norm of assertion *before* writing a policy. Needs to distinguish between genuine philosophical constraints and "house preferences."
      *   **Specific Requests:**
          1.  List desiderata for an adequate account of the norm of assertion (with cases/reasons, not just labels).
          2.  Include specific suspected items: Moore's Paradox, Lottery Paradox, Lucky True Beliefs, Stale Evidence/Memory, Constitutive vs. Blameworthiness, Challenge Practice, Spokesperson/Actor/Bot case.
          3.  Triage: Non-negotiable vs. House Preferences.
          4.  Consistency Check: Are any jointly unsatisfiable?
          5.  Killer Constraint: Which single requirement eliminates the most candidate norms?
          6.  Quick Scorecard: One line each on Knowledge, Truth, Justified-Belief, Context-Sensitive norms.
          7.  Meta-Constraint: Flag requirements driven by the moderator's enforcement needs vs. philosophical necessity.

  2.  **Deconstruct the Philosophical Landscape (Norms of Assertion):**
      *   *Standard View:* Knowledge Norm (Williamson). You must assert $p$ only if you know $p$.
      *   *Alternatives:* Truth Norm (Lackey), Justified Belief Norm (Douven), Reasonable Belief, Contextualist Norms (DeRose).
      *   *Key Cases:* Moore's Paradox ("$p$ but I don't know $p$"), Lottery ("Your ticket lost"), Gettier/Lucky Truth, Expert Testimony/Spokesperson.

  3.  **Drafting the Desiderata (incorporating user's specific points):**
      *   *Moore's Paradox:* Needs to explain why "$p$ but I don't believe $p$" is absurd, and why "$p$ but I don't *know* $p$" is also weird (though less so). The norm must make the conjunction irrational to assert.
      *   *Lottery:* Why can't I say "Your ticket lost" based on odds, but I can say "The bus is coming" based on perception, even if perception is fallible? The norm must distinguish statistical probability from ordinary evidence.
      *   *Lucky Truth (Gettier-style):* If I guess right on garbage evidence, did I violate the norm? Intuition says yes, I shouldn't have asserted. The norm must condemn this even if $p$ is true.
      *   *Stale Evidence/Memory:* I assert $p$ based on memory. I can't re-derive it. Is this allowed? The norm must permit reliance on stored justification without current access to the source.
      *   *Constitutive vs. Blameworthiness:* Distinguish between "This wasn't an assertion" (constitutive) vs. "This was a bad assertion" (regulative/blame). Most theories treat it as regulative (you asserted, but you broke the rule).
      *   *Challenge Practice:* When someone says "How do you know?", what discharges it? The norm must align with what counts as a valid defense in dialogue.
      *   *The Spokesperson/Bot Case:* If I read a script I don't believe, am I asserting? If the norm requires *my* knowledge, this breaks. If it requires *authority*, it works. This tests whether the norm is psychological (internal state) or social (role-based).

  4.  **Triage (Non-Negotiable vs. House Preference):**
      *   *Non-Negotiable:* Moore's Paradox handling, Lucky Truth condemnation, Challenge Practice alignment. These are core to the *concept* of assertion in epistemology.
      *   *House Preference:* "Applicable by speaker at moment of utterance" (Internalism vs. Externalism), "Moderator Checkability." The user wants enforceability, but philosophy cares about truth conditions, not mod logs.
      *   *Potential Conflict:* Internal accessibility (can I check if I know?) vs. External factivity (do I actually know?). This is the classic Internalism/Externalism tension.

  5.  **Consistency Check (Joint Unsatisfiability):**
      *   *The Big Tension:* **Factivity** (Truth/Knowledge) vs. **Accessibility** (Blamelessness/Reasonable).
      *   If the norm is Knowledge (Factive), you can be blameless but wrong (envatted brain).
      *   If the norm is Justified Belief (Accessible), you can follow the norm but be ignorant (Gettier).
      *   *Specific to User:* You cannot have a rule that is *both* objectively factive (no false assertions allowed) *and* subjectively enforceable by a mod without mind-reading. You have to pick: are we policing *truth* or *process*?

  6.  **The "Killer" Constraint:**
      *   The **Lottery Paradox** combined with **Fallibilism**. Any norm must explain why high probability isn't enough for some claims but is for others. This kills simple probabilistic thresholds.
      *   Alternatively, the **Spokesperson/Bot** case kills purely psychological norms (like "You must believe it").
      *   *Decision:* The **Challenge Practice** is the most functional killer for a Discord context. If the norm doesn't explain what counts as a valid answer to "Source?", it's useless for moderation. But philosophically, the **Lucky Truth** case is the strongest filter for *truth* vs. *justification*. Let's go with the **Lucky Truth/Gettier** case as the philosophical killer, and **Enforceability** as the practical killer.
      *   *Refinement:* The prompt asks for *one* requirement that does the most work eliminating candidates. The **Moore's Paradox** constraint is often cited as the strongest argument for the Knowledge Norm specifically. But the **Lottery** case is what kills simple "High Probability" norms. Let's select **The Lottery/Statistical Evidence Constraint** because it specifically targets the "forecasting/probability" nature of the user's server.

  7.  **Scoring the Norms:**
      *   *Knowledge:* Good on Moore/Lottery, bad on Spokesperson/Stale Memory (sometimes).
      *   *Truth:* Bad on Lucky Truth (allows it), bad on False but Justified.
      *   *Justified Belief:* Good on Blamelessness, bad on Lucky Truth (allows it), bad on Lottery (sometimes allows it).
      *   *Context-Sensitive:* Good on flexibility, bad on stability/clarity (hard to moderate).

  8.  **Addressing the "Mod/Script" Constraint:**
      *   Must explicitly flag which desiderata are about *philosophical adequacy* and which are about *moderation enforceability*. The user explicitly asked for this ("flag it explicitly").

  9.  **Review and Refine:**
      *   *Tone:* Intellectual, precise, slightly informal but rigorous (matching the user's "spec" language).
      *   *Structure:* Follow the prompt's order. Desiderata -> Triage -> Consistency -> Killer Constraint -> Scorecard.
      *   *Check:* Did I answer the Spokesperson/Bot question? Yes, needs to be in Desiderata.
      *   *Check:* Did I distinguish Constitutive vs. Regulative? Yes.
      *   *Check:* Did I identify the impossible tension? Yes (Factivity vs. Accessibility).

  10. **Final Polish:** Ensure the distinction between "House Preferences" and "Philosophical Non-Negotiables" is sharp. The user suspects "criticism/retraction" and "applicability" might be house preferences. I need to confirm or deny. "Applicability" is definitely a house preference (philosophy allows externalist norms). "Criticism" is closer to non-negotiable (assertion is a social move).

      *Self-Correction on the "One Line" constraint:* Keep it tight.
      *Self-Correction on "Flagging":* Use bolding or a specific tag like `[ENFORCEABILITY]`.

      *Re-evaluating the "Jointly Unsatisfiable" point:* The tension between **Objective Correctness** (Truth/Knowledge) and **Subjective Blamelessness** (Justification) is the classic philosophical deadlock. For a moderator, the tension is between **Factivity** (No false claims) and **Accessibility** (Can I prove they broke the rule?). I should highlight the latter for this user.

      *Re-evaluating the "Spokesperson" point:* This is crucial for the "Bot" question. If the norm requires *belief*, the bot violates it constantly. If the norm requires *authority/license*, the bot is fine. This suggests the norm might be social, not psychological.

