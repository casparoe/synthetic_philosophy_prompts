  1. person-by-person / Pareto: no verdict either way — say exactly why, and who's better off under which;
  2. discounted sums at 1% per generation: A wins. Show the arithmetic, and give the break-even discount rate where the two flip.
  3. an "overtaking" rule — B beats A iff the running total of (B minus A) over the first N generations heads off to +infinity: B wins.

  If my numbers don't in fact produce that pattern, change them until they do and tell me what you changed.

  Then: which single feature of the case is doing the work, and what happens if the future is only 200 generations long? And how would a committed discounter attack the case — not just "infinite sums are illegitimate," though I do want to hear why that isnt quite enough here.

  Last bit, numbers only is fine: give me the smallest change to the payoffs that makes the overtaking rule and the weaker "catch-up" rule (B only has to be ahead at every sufficiently large N) disagree, and show the running totals that do it.

  Finish with a line of the form `Verdict: pareto=..., discount=..., overtake=..., catchup-vs-overtake=agree/disagree`.
