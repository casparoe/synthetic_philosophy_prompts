  **Scenario**
  The Ministry of Finance manages a one-time, finite natural resource windfall (e.g., a fully depleted mineral deposit) worth 1,000 utility units. The population is stable and fixed; policy choices affect income, not conception, so the exact same infinite sequence of individuals exists under either option. **Option A (Spend):** Distribute the entire endowment immediately as a stimulus. Generation 0 receives +1,000 wellbeing; all subsequent generations receive +0 from this fund (the resource is gone, leaving no debt or environmental harm). **Option B (Endow):** Capitalize a permanent sovereign wealth fund. The principal is never touched; investment returns distribute +1 wellbeing unit to every generation, starting with Generation 0 and continuing forever.

  **Verdicts & Arithmetic**

  1.  **Person-by-Person (Pareto):** **No Verdict.** Generation 0 is strictly worse off under Option B (receiving 1 instead of 1,000). Every subsequent generation (1, 2, 3...) is strictly better off under Option B (receiving 1 instead of 0). Because one group loses and another gains, neither option is a Pareto improvement over the other.
  2.  **Discounted Sums (1% per generation):** **Option A Wins.**
      *   $PV_A = 1,000$.
      *   $PV_B = \sum_{t=0}^{\infty} 1 \cdot (1.01)^{-t} = \frac{1}{1 - (1/1.01)} = \frac{1.01}{0.01} = 101$.
      *   $1,000 > 101$, so A is preferred.
      *   **Break-even Rate:** We need $1,000 = \frac{1+r}{r} \Rightarrow 1,000r = 1+r \Rightarrow 999r = 1 \Rightarrow r = 1/999 \approx 0.001$ (**0.1%**). If the discount rate is below 0.1%, B wins; above 0.1%, A wins.
  3.  **Overtaking Rule:** **Option B Wins.**
      *   Let $D_N$ be the running total of $(B - A)$ over the first $N$ generations.
      *   $D_0 = 1 - 1,000 = -999$.
      *   $D_N = -999 + \sum_{t=1}^{N} 1 = -999 + N$.
      *   As $N \to \infty$, $D_N \to +\infty$. Since the running total heads off to positive infinity, B beats A.

  **Analysis**

  *   **Single Feature:** The divergence is driven entirely by the **infinite horizon combined with non-diminishing returns**. Option B's stream never decays; the constant +1, while small, accumulates without bound, allowing it to mathematically overtake the finite lump sum of A in an unweighted sum, even though discounting renders those distant gains financially negligible.
  *   **200 Generations:** If the future is truncated at 200 generations, the overtaking logic collapses. The running total at $N=200$ is $-999 + 200 = -799$. Option B never catches up, and Total Utilitarianism would also favor A (Total A = 1,000; Total B = 200). The "B wins" verdict is purely a product of the infinite tail.
  *   **Committed Discounter Attack:** A discounter cannot simply claim "infinite sums are illegitimate" because the Overtaking Criterion does not require calculating a sum, only ranking partial sums. Instead, the attack must target **Separability** or **Aggregation**. The discounter argues that the "Tyranny of the Future" is morally absurd: accepting Overtaking implies that *any* cost to the present (even 1,000,000 units) is justified by a trivial gain (1 unit) forever. This violates the intuition that moral weight should diminish with temporal distance or that massive immediate harms cannot be aggregated away by distant, microscopic benefits.

  **Last Bit: Catch-Up vs. Overtaking Disagreement**

  To make the rules disagree, we need the running total to converge to a **finite positive number**. Overtaking (defined as heading to $+\infty$) will fail, but Catch-Up (defined as eventually $>0$) will succeed.

  *   **Change:** Truncate Option B's payoff.
      *   **Option A:** Gen 0 = 1,000; Gen 1+ = 0.
      *   **Option B:** Gen 0 to 1,000 = 1; Gen 1,001+ = 0.
  *   **Running Totals $(B - A)$:**
      *   $N=0$: $-999$
      *   $N=1,000$: $-999 + 1,000 = +1$
      *   $N=1,001$: $+1 + 0 = +1$
      *   **Limit:** $+1$
  *   **Result:** The total never heads to $+\infty$ (Overtaking fails), but it stays positive for all sufficiently large $N$ (Catch-Up succeeds).

  Verdict: pareto=no verdict, discount=A, overtake=B, catchup-vs-overtake=agree
