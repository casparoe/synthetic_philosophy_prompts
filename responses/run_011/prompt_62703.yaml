answer: |-
  **Project Title:** Procedural Authority and the Disease Concept: A Reframing of the Naturalism-Normativism Dispute

  **Statement of the Question**
  The central question of this project is whether the persistent disagreement between naturalist and normativist accounts of disease is best understood as a conflict over semantic extension or as a conflict over epistemic authority and procedural legitimacy. Standard formulations ask whether the predicate "disease" admits of a value-free biological analysis or is irreducibly value-laden. This project proposes a determinate alternative: Does the intractability of borderline cases stem from the impossibility of a value-free definition, or from the absence of an agreed-upon procedure for fixing the reference classes and environmental situations against which biological functioning is measured? A "yes" answer implies that the debate is primarily institutional: the live issue is whether novel cases are resolved by expert biological panels or by deliberative bodies answerable to affected populations. A "no" answer maintains that the conceptual analysis is primary and that authority is merely derivative of truth. This formulation allows a competent opponent to argue that procedural questions necessarily presuppose conceptual ones—one cannot determine who should decide until one knows what is being decided—thereby forcing a defense of the claim that the concept itself is indeterminate without the procedural fix.

  **Limitations of Existing Positions**
  Current positions in the literature leave this question open because they treat the assignment of authority as a consequence of the definition rather than a constituent of it. Standard naturalist accounts hold that once biological dysfunction is identified, the classification follows automatically, implying that authority resides exclusively with those capable of detecting such dysfunction. Normativist accounts hold that because harm is essential to disease, authority must reside with those capable of evaluating harm, typically involving the subject or their community. Hybrid accounts attempt to split the labor but often fail to specify how conflicts between the dysfunction condition and the harm condition are adjudicated. In all three cases, the mechanism for resolving disputes over the parameters of "normal functioning" or "harmful conditions" remains obscure.

  The strongest objection to this reframing is the priority objection: conceptual analysis must precede procedural design. If disease is fundamentally a biological kind, then granting standing to non-experts to classify it is a category error, not a procedural alternative. On this view, asking "who decides" is secondary to "what is decided." A second, more cynical objection is that this reframing is merely a political dispute in philosophical dress, disguising a struggle for power as a methodological innovation. This project contends that these objections rely on the assumption that the boundaries of biological kinds are self-evident prior to classification. However, given the necessity of relativizing function to reference classes and environments, the "biological fact" is not available prior to the choice of parameters. Therefore, the choice of who fixes those parameters is not derivative but constitutive of the classification itself. The project must demonstrate that the conceptual indeterminacy is robust enough to warrant this procedural shift without collapsing into pure sociology.

  **Method and Case Studies**
  The research will proceed over a fourteen-week semester. Weeks one through four will be dedicated to reconstructing the standard dialectic between naturalist, normativist, and hybrid accounts, focusing specifically on the points where each relies on implicit procedural assumptions regarding reference classes. Weeks five through eight will apply the procedural reframing to three concrete contested conditions. Weeks nine through twelve will synthesize these findings into a coherent argument regarding epistemic authority. Weeks thirteen and fourteen will be reserved for drafting and revision.

  The three selected cases are:
  1.  **The Historical Depathologization of Homosexuality:** Standard accounts view this as a correction of a factual error or a shift in social values. The procedural reframing diagnoses this as a transfer of jurisdiction from a closed psychiatric specialty to a broader deliberative forum involving civil rights claims. The verdict yielded is that the biological facts remained constant while the standing to interpret their significance shifted.
  2.  **Neurodiversity and Autism:** This case challenges the harm condition. Standard accounts struggle to reconcile neurological atypicality with claims of identity and flourishing. The procedural reframing locates the dispute in the selection of the "environment." If the environment is fixed by the majority, atypicality is dysfunction; if the environment is fixed by the minority community, it is variation. The reframing predicts that resolution requires a procedural mechanism for negotiating environmental accommodations, not just a biological verdict.
  3.  **The Medicalization of Distress (e.g., Grief or Premenstrual Dysphoria):** Here, the dispute concerns whether a statistical departure from emotional typicality constitutes a dysfunction. The standard view oscillates between biological reductionism and social constructionism. The procedural view identifies the conflict as one over who holds the standing to declare a state "harmful"—the clinician observing impairment or the subject experiencing the state.

  In each case, the method requires showing that the procedural diagnosis explains the persistence of the controversy better than the conceptual diagnosis, specifically by explaining why new biological evidence often fails to settle the dispute.

  **Conditions for Success**
  A successful result will demonstrate that the procedural reframing earns its keep by offering explanatory leverage that the standard conceptual framing lacks. Specifically, the project must show:
  1.  **Convergence on Paradigms:** It must explain why naturalists and normativists agree on clear-cut cases (e.g., metastatic cancer). The hypothesis is that in paradigm cases, the procedural authority is uncontested because the biological dysfunction and the experienced harm align seamlessly, rendering the question of standing moot.
  2.  **Divergence on Borders:** It must explain why disagreement intensifies in borderline cases despite increased biological knowledge. The hypothesis is that these are not failures of science but conflicts of jurisdiction.
  3.  **Normative Utility:** It must yield a recommendation for how classification bodies (such as those responsible for diagnostic manuals) should structure their decision-making processes. If the argument holds, these bodies cannot be purely scientific panels but must incorporate mechanisms for stakeholder standing.
  If the project merely relabels "values" as "procedures" without changing the predicted outcomes or the recommended actions, it will have failed. The reframing must alter the understanding of what a resolution would look like.

  **Failure Conditions**
  The primary risk is that the procedural reading turns out to be a notational variant of the normativist position. If "who decides" is simply another way of saying "values determine classification," the project dissolves into a restatement of existing normativism. A second risk is that the conceptual priority objection proves insurmountable: if it can be shown that one must settle the ontology before assigning authority, the procedural turn is premature. A third risk is that the distinction between expert and deliberative authority is too blurred in practice to sustain the analysis.

  In the event of the first failure (notational variance), the project will pivot to a meta-philosophical conclusion: that the naturalism-normativism debate has reached a terminus because the participants are using the same conceptual tools to describe different institutional realities. The output would then become a critique of the debate's structure rather than a solution to it. In the event of the second failure (conceptual priority), the project will concede that procedure is secondary but argue that the conceptual indeterminacy is so high that the procedural question effectively precedes the conceptual one in practice, even if not in logic. Honest acknowledgment of these failure modes is necessary to avoid forcing the evidence to fit the reframing.

  **Scope Note**
  Given the constraints of a semester-length paper, scope management is critical. If the argument outgrows the available space, the historical case of homosexuality will be the first to be dropped. While illustrative, it is a settled matter, whereas neurodiversity and the medicalization of distress are ongoing controversies where the procedural stakes are currently live. Dropping the historical case allows for deeper analysis of the contemporary conditions where the procedural conflict is active. Secondly, the normative recommendations for institutional design will be curtailed if the descriptive argument regarding the nature of the dispute requires more space. The primary goal is to establish the validity of the reframing; prescribing specific institutional reforms is a secondary implication that can be indicated without being fully developed. Finally, if the engagement with the "conceptual priority" objection becomes too extensive, the discussion of hybrid accounts will be condensed, treating them as a subclass of the broader procedural conflict rather than analyzing their internal variations in detail. This ensures the core thesis regarding epistemic authority remains the focal point.
