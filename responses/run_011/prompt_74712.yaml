prompt: |-
  I'm trying to pin down when something counts as mere sphexishness — the wasp thing: drag a paralyzed cricket to the burrow mouth, go in to check, come out, and if someone's nudged the prey a few inches while you were inside, haul it back to the mouth and go in to check again, forever. Here's where I land on a bunch of cases, and I want to know what principle generates the pattern, if any does.

  The wasp: sphexish, paradigm case. My robot vacuum doing exactly the same thing to the same chair leg all afternoon: sphexish too. A very strong chess engine that plays brilliantly except in one closed fortress position where it shuffles into a draw it could have won: sphexish, but only locally — which I suspect is a dodge. Airline pilots running a memorized pre-flight checklist word for word, every flight, never skipping an item: not sphexish at all, arguably the mark of a good pilot. A friend with non-fluent aphasia who greets everyone with a small stock of intact phrases, always apt but never novel: I don't want to call that sphexish, though the phrases are canned. A chatbot that rewords my paragraph a dozen new ways without trouble, then changes nothing when I swap two numbers in a word problem it's obviously memorized, and hands back the old answer: sphexish on the numbers, flexible on the phrasings.

  The pair that breaks me is the checklist vs. the wasp — same observable shape, triggered routine, endlessly repeated — and the pilot would break off if the engine caught fire, but I cant see that from outside, I'm infering it. So is my principle just rigidity-you'd-endorse-if-you-could-see-inside, i.e. disappointment measured against expected competence? If so it seems nearly empty. State it as precisely as you can anyway, say which case motivates each clause, whether sphexishness comes out binary or graded, and give me its verdict on a case I haven't listed: me, same morning routine for eleven years, with no idea whether I'd break it if there were a reason. Then tell me which of the above a simpler principle would force me to give up.
