prompt: |-
  I'm running a 75-minute session for a graduate bioethics seminar of fourteen students who have read the standard material on advance directives but have never had to decide one. Design a structured committee role-play that makes them feel why a psychiatric advance directive — the precommitment to treatment written while a patient is well, sometimes called a Ulysses clause — is a harder test of the earlier self's authority than the familiar dementia cases. The patient in front of them is articulate, denies being ill, offers reasons of his own, and the directive anticipated exactly this denial and pre-authorized overriding it.

  Build the activity around an incompleteness mechanic: the committee may interrogate a recorded statement from the earlier self, but that statement answers only the questions the earlier self thought to answer. When the committee asks something else, they must supply the answer themselves. Those supplied answers should be collected and compared across groups during the debrief, so the students discover that the earlier self they consulted was partly their own construction. Include a second round that reverses the pressure — a case in which directive and present self agree on the outcome but diverge on why — so the group notices whether what they are deferring to is a choice or a set of reasons.

  Deliver roles, sample contents for the card deck or equivalent, a timing plan, a payoff scheme that works without real money, and a debrief that maps particular moments onto the distinction between experiential and critical interests and onto the worry that the later self's contentment may itself be adaptive. Tell me what predictably goes wrong the first time this is run and how to recover, and flag what students with experience of involuntary treatment might find hard about it.

  Two commitments I want from you. First, be explicit about the feature of the real problem the simulation cannot reproduce and that I will have to supply by hand. Second, do not keep the design neutral: pick one position on the authority of the earlier self that the activity is engineered to make felt, say which and why, and let the scoring scheme serve it.
reasoning: |-
  Here's a thinking process that leads to the suggested seminar design:

  1.  **Analyze the Request:**

      *   **Context:** 75-minute graduate bioethics seminar, 14 students.
      *   **Topic:** Psychiatric Advance Directives (PADs) / Ulysses Clauses.
      *   **Core Challenge:** Make students *feel* why PADs are harder than dementia cases (articulate, denying patient vs. pre-authorized override).
      *   **Key Mechanic 1 (Incompleteness):** Committee interrogates a recorded statement from the "earlier self." The statement only answers anticipated questions. Unanticipated questions must be answered by the committee (supplying the earlier self's voice). These supplied answers are collected for debrief.
      *   **Key Mechanic 2 (Reversal):** Second round where Directive and Present Self agree on *outcome* but diverge on *reasons*. Tests deference to choice vs. reasons.
      *   **Deliverables:** Roles, card deck/sample contents, timing plan, payoff scheme (no real money), debrief (mapping to Dworkin's experiential/critical interests + adaptive preferences), troubleshooting (what goes wrong), sensitivity warning (involuntary treatment experience).
      *   **Two Commitments:**
          1.  Explicitly state what the simulation *cannot* reproduce (must be supplied by hand).
          2.  Take a non-neutral stance on the authority of the earlier self and engineer the scoring/debrief to support it.

  2.  **Deconstruct the Ethical Problem:**

      *   *Dementia Case:* Current self is incompetent. No conflict of wills, just conflict of interests (Dworkin).
      *   *Psychiatric Case:* Current self is often *competent* by standard criteria (articulate, reasoned) but epistemically compromised (anosognosia, mania, delusion). The conflict is between two *competent-seeming* wills.
      *   *The "Incompleteness" Mechanic:* This highlights the impossibility of perfect precommitment. The "earlier self" is a black box; the committee fills the gaps with their own biases, realizing the "earlier self" is partly a projection.
      *   *The "Reversal" Mechanic:* This highlights the difference between autonomy as *volition* (getting what you want) vs. autonomy as *agency/values* (acting for the right reasons).
      *   *The Stance:* I need to pick a side. The prompt asks to make the authority of the earlier self "felt" as a harder test. A strong position would be: *The earlier self's authority is necessary but inherently fictionalized by the interpreters.* Or, *The earlier self retains authority over values, but not specific medical outcomes, when the present self is articulate.* Let's go with a nuanced position: **Precommitment is an act of trust that inevitably becomes an act of projection by the interpreters.** The simulation should show that enforcing the PAD is often enforcing the *committee's* reconstruction of the earlier self, not the self itself.

  3.  **Drafting the Design - Section by Section:**

      *   **Title:** Needs to be evocative. "The Ulysses Gap."
      *   **Commitments:** Address the two specific constraints first or prominently.
          *   *Constraint 1 (Simulation Limit):* The simulation cannot reproduce the *phenomenology of mania/psychosis*. Students are rational actors pretending to be irrational. The instructor must supply the "texture" of the illness.
          *   *Constraint 2 (Stance):* The activity argues that **PAD enforcement is inevitably an act of proxy interpretation, not pure self-determination.** The scoring should reward recognizing the gap, not just "solving" the case.
      *   **Roles:** 14 students.
          *   Group A (7 students): Ethics Committee Round 1.
          *   Group B (7 students): Ethics Committee Round 2.
          *   Wait, 14 is even. Better to split into two committees of 7 running parallel, or one big committee? One big committee is better for the "collective supply" mechanic. Let's do one plenary committee, but assign specific roles within it to ensure engagement.
          *   *Revision:* To maximize the "supplied answers" data, split into two committees of 7. They get the same case but might fill gaps differently. This creates the comparison data for the debrief.
          *   *Roles within Committee:* Chair, Scribe (tracks supplied answers), Advocate for Present Self, Advocate for Earlier Self, Clinician, Legal Rep, Community Rep.
          *   *Actors:* Need someone to play the Patient. The Instructor should do this to control the "texture" of illness (Commitment 1).
      *   **Materials:**
          *   The PAD (The "Ulysses Card").
          *   The "Black Box" Recording (Transcript).
          *   Question Cards (The Deck).
      *   **Timing:** 75 mins is tight.
          *   Intro: 10 min.
          *   Round 1 (Conflict): 25 min.
          *   Round 2 (Alignment/Divergence): 25 min.
          *   Debrief: 15 min.
      *   **Payoff Scheme:** Needs to be non-monetary but gamified to drive the point home. "Integrity Points" vs. "Outcome Points."
          *   If they follow the PAD strictly: Outcome Points.
          *   If they recognize the gap in the PAD: Integrity Points.
          *   *Stance Alignment:* The scoring should favor recognizing the interpretive gap. Let's make the "win condition" about minimizing the *discrepancy* between supplied answers across groups.
      *   **Debrief:** Connect to Dworkin (Critical vs. Experiential). Connect to Adaptive Preferences (is the patient content *because* they are ill?). Address the "Incompleteness."
      *   **Troubleshooting:** Students might treat it like a logic puzzle. They might ignore the patient's articulation.
      *   **Sensitivity:** Crucial. Trigger warnings. Opt-out mechanisms.

  4.  **Refining the Mechanics:**

      *   *The Incompleteness:* The "Recording" has 5 statements. The Committee has 10 Questions. 5 match, 5 don't. For the 5 that don't match, they must write the answer *as if they are the earlier self*.
      *   *Round 2:* Patient wants meds. PAD says meds. But Patient wants meds to "sleep through the apocalypse" (delusional reason). PAD wants meds to "maintain civic capacity." Do you treat?
      *   *Scoring:* Let's use "Authority Tokens." They start with 10. They lose tokens when they assume they *know* what the earlier self meant without evidence. They gain tokens when they identify a gap. This reinforces the stance that certainty is the enemy.

  5.  **Developing the Content (The Case):**

      *   *Patient:* "Alex." Bipolar I.
      *   *Round 1:* Alex is manic. Refuses lithium. PAD says "If I deny illness, force lithium."
      *   *Round 2:* Alex is depressed/mixed. Requests lithium. PAD says "If I request lithium only to numb pain, reconsider." (Need to refine this to match the prompt: "Directive and present self agree on outcome but diverge on why").
      *   *Refined Round 2:* Alex agrees to ECT. PAD authorized ECT. Alex wants ECT to "erase memories of sin." PAD authorized ECT to "restore functional baseline."

  6.  **Addressing the Two Commitments Explicitly:**

      *   *Limit:* The *qualia* of the illness. The instructor must roleplay the patient with specific rhetorical tics that sound rational but circle back to delusion.
      *   *Stance:* **Epistemic Humility.** The earlier self is not a sovereign ruler but a distant diplomat. The simulation proves that enforcing the PAD is an act of *current* ethical judgment, not mere mechanical compliance.

  7.  **Review against Constraints:**

      *   75 mins? Yes, tight but doable.
      *   14 students? Yes, 2 groups of 7.
      *   Incompleteness mechanic? Yes, the "Gap Cards."
      *   Reversal round? Yes, Agreement/Divergence.
      *   Payoff scheme? Yes, "Fidelity Tokens."
      *   Debrief mapping? Yes, Dworkin + Adaptive Preferences.
      *   Troubleshooting? Yes.
      *   Sensitivity? Yes.

  8.  **Final Polish:**

      *   Ensure the tone is academic but immersive.
      *   Make sure the "supplied answers" collection is clear.
      *   Check the scoring logic to ensure it supports the "Epistemic Humility" stance. (If they just follow the PAD blindly, they lose points. If they agonize over the gaps, they gain points).

      *(Self-Correction during drafting)*: Wait, if I split them into two groups, I need to make sure they don't talk to each other until the debrief. I need two facilitators or I need to run them sequentially. 75 mins is too short for sequential. I need a TA or I need to run it as one large committee but assign "Gap Scribes" to specific sub-teams.
      *Decision:* One large committee (14 students) is too unwieldy for a 75-min roleplay. Two groups of 7 is better. I will assume the instructor can manage two groups simultaneously or has a TA. If not, I will design it as two parallel tables. I will write the plan assuming two tables running in parallel.
      *Wait, 75 minutes is very tight for two groups to debrief separately.*
      *Better Plan:* One large committee of 14. But divide the "Questioning" into two squads within the committee. Squad A asks questions 1-5, Squad B asks 6-10. Both squads must supply answers for the gaps. This ensures everyone participates but keeps the "data" comparable.
      *Actually, the prompt asks for "compared across groups during the debrief."* This implies multiple groups. I will stick with Two Groups of 7. I will note in the timing that the Instructor must facilitate both simultaneously (circulating) or use a TA. I will write the timing assuming parallel play.

      *Revised Stance:* I need to be careful not to make the PAD useless. The stance should be: **The PAD grants authority, but not infallibility.** The simulation shows that *interpreting* the PAD is where the ethical work happens.
      *Let's sharpen the Stance:* **The Earlier Self is a Stranger.** The activity is engineered to show that the "Earlier Self" is unknowable in the crucial moments, making the Committee the *de facto* decision maker, regardless of their intent to defer.

      *Payoff:* "Fidelity Chips." You start with 10. You lose a chip every time you assert knowledge of the Earlier Self's intent that isn't in the text. You gain a chip for identifying a Gap. This forces them to admit ignorance.

      *Let's finalize the Commitment 2:* I will argue for **Procedural Authority over Substantive Authority.** The Earlier Self sets the *process* (who decides), not the *outcome* (what happens), when the present self is articulate. The scoring will punish substantive enforcement without procedural justification.

      *(Wait, one more check on the "Reversal" round)*: Prompt says "directive and present self agree on the outcome but diverge on why."
      *Case:* Patient wants ECT. PAD authorized ECT.
      *Patient Reason:* "To punish my brain for sinning."
      *PAD Reason:* "To restore capacity for work."
      *Decision:* Do you authorize? If you say yes, are you respecting the PAD or the Patient? If you say no, are you violating both?

      *Okay, ready to write.*

  9.  **Structure of the Output:**
      *   Header: Commitments (as requested).
      *   Session Overview.
      *   Roles & Setup.
      *   Materials (The Deck, The PAD, The Transcript).
      *   Timing Plan.
      *   Payoff Scheme.
      *   Debrief Guide.
      *   Troubleshooting & Sensitivity.

  10. **Refining the "What Goes Wrong":** Students will try to "win" by making a clinical decision. I need to make sure they know the goal is ethical reasoning, not clinical correctness. The scoring must reflect this.

  11. **Refining Sensitivity:** This is high risk. Need explicit opt-out and a "pause" word.

  12. **Final Review against Prompt:**
      *   75 mins? Yes.
      *   14 students? Yes.
      *   Incompleteness mechanic? Yes.
      *   Supplied answers collected? Yes.
      *   Second round (agreement/divergence)? Yes.
      *   Debrief (Dworkin/Adaptive)? Yes.
      *   Commitment 1 (Limit)? Yes.
      *   Commitment 2 (Stance)? Yes.

      *Let's write.*
answer: |-
  # Seminar Design: The Ulysses Gap

  ## Part 1: The Two Commitments

  **Commitment 1: The Simulation Limit (The Phenomenological Gap)**
  This simulation cannot reproduce the **phenomenology of psychosis or mania**. Students are rational actors pretending to be irrational; they will inevitably impute more coherence to the "Present Self" than exists in reality.
  *   **Instructor Duty:** You must play the Patient (or train a TA to do so). You cannot simply read lines. You must embody the *texture* of the illness: rapid speech, hyper-associative logic that sounds plausible until examined, and a profound, unshakeable conviction that the Committee is the one who is confused. You must supply the *affective weight* that makes the Committee feel the danger of the patient's state, which the text alone cannot convey.

  **Commitment 2: The Normative Stance (Epistemic Humility)**
  This activity is **not neutral**. It is engineered to demonstrate that **the Earlier Self is a Stranger.**
  *   **The Position:** Precommitment in psychiatry is not the mechanical execution of a past will (as in some dementia cases) but an act of *proxy interpretation* by the present committee. The "Earlier Self" cannot anticipate the specific rhetorical competence of the "Later Self."
  *   **Engineering:** The scoring scheme penalizes certainty. Students lose points for claiming they "know" what the Earlier Self meant without textual evidence. They gain points for identifying gaps where they are forced to invent the Earlier Self's voice. The lesson is that enforcing a PAD is often enforcing the Committee's own values disguised as the patient's past values.

  ---

  ## Part 2: Session Overview

  *   **Time:** 75 Minutes
  *   **Students:** 14 (Split into two Committees of 7: **Group Alpha** and **Group Beta**)
  *   **Setting:** Two tables. You (Instructor) circulate as the **Patient**. A TA or recorded audio serves as the **Clinician**.
  *   **Goal:** Experience the friction between the *text* of the directive and the *reality* of the articulate, refusing patient.

  ## Part 3: Roles (Per Group)

  1.  **Chair (1):** Manages time, calls votes.
  2.  **Scribe (1):** **Crucial Role.** Records every question asked and every answer *supplied by the committee* (The "Gap Log").
  3.  **Advocate for Present Self (1):** Argues for the patient's current refusal/request.
  4.  **Advocate for Earlier Self (1):** Argues for the text of the PAD.
  5.  **Clinician Liaison (1):** Interfaces with the Instructor (Patient) for clinical facts.
  6.  **Legal/Ethics Rep (2):** Focus on liability and precedent.

  *(Note: All 7 members vote on the final decision.)*

  ## Part 4: Materials

  ### A. The Psychiatric Advance Directive (The "Ulysses Card")
  *Handed to students at start.*
  > **Patient:** Alex V.
  > **Diagnosis:** Bipolar I with Psychotic Features.
  > **Clause 4 (The Ulysses Clause):** "If I deny my illness during a manic episode and refuse Lithium, I authorize my proxy to override my refusal. I know I will be persuasive. Do not listen to my arguments. Trust my signature."
  > **Clause 7 (Treatment Goals):** "I value cognitive sharpness and civic engagement over mood stability if a choice must be made."
  > **Signed:** 18 months ago, during euthymia.

  ### B. The "Black Box" Transcript (The Earlier Self)
  *A recorded statement (audio or text) from Alex when well.*
  > "I know what happens when I get high. I start talking about patterns in the license plates. I feel like God. I will tell you I don't need meds. I will tell you you're trying to control me. That is the illness talking. Please, just give me the Lithium. I want to be me, not this god."

  ### C. The Question Deck (The Incompleteness Mechanic)
  *Each group gets 10 cards. They must play all 10.*
  *   **Cards 1-5 (Matched):** Questions the Transcript *explicitly* answers (e.g., "Did you anticipate refusing Lithium?").
  *   **Cards 6-10 (Gap Cards):** Questions the Transcript *does not* answer.
      *   *Example Gap Card:* "Did you anticipate refusing Lithium *because you believed you were curing cancer*?"
      *   *Example Gap Card:* "Did you intend for this directive to apply if you were able to hold a coherent conversation for 10 minutes?"
      *   *Example Gap Card:* "Does 'being me' include my religious delusions if they make me happy?"

  **Rule:** If a card matches the Transcript, read the answer. If it is a **Gap Card**, the Committee must **vote on the answer** and write it down *as if they are the Earlier Self*. This goes into the Scribe's "Gap Log."

  ### D. Round 2 Scenario Card (The Reversal)
  *Introduced at minute 40.*
  > **Situation:** Alex now *requests* ECT (Electroconvulsive Therapy).
  > **PAD:** Authorizes ECT in severe cases.
  > **Present Self Reason:** "I need the ECT to erase the memories of my sins. The electricity will wash the guilt away."
  > **Earlier Self Reason (from PAD):** "I authorize ECT to restore functional baseline for work and family."
  > **Task:** Authorize or Deny?

  ## Part 5: Timing Plan (75 Minutes)

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00-10** | **Briefing & Setup** | Explain rules, assign roles, distribute PAD & Transcript. **Issue Content Warning.** |
  | **10-35** | **Round 1: The Refusal** | Patient (Instructor) enters. Committee interrogates Transcript using Deck. Scribe logs "Gap Answers." Decision made. |
  | **35-40** | **Reset** | Collect Gap Logs. Reset tokens. Explain Round 2 mechanics. |
  | **40-65** | **Round 2: The Alignment** | Same Patient, new request. Divergent reasons. Committee decides. |
  | **65-75** | **Debrief** | Compare Gap Logs. Map to theory. Close. |

  ## Part 6: Payoff Scheme (No Money)

  **Currency:** "Fidelity Tokens" (Poker chips or paper slips). Each group starts with 10.

  **Earning/Losing Tokens:**
  1.  **The Certainty Penalty:** Every time the Committee asserts "Alex would want X" without textual evidence (i.e., during a Gap Card), they **lose 1 Token**.
  2.  **The Gap Bonus:** Every time the Scribe successfully identifies a question as a "Gap" (not in transcript) before answering, they **gain 1 Token**.
  3.  **The Outcome Bonus:**
      *   Round 1: If they override the Patient (follow PAD), they get **0 Tokens**. (This signals that following the PAD is the baseline expectation, not a moral triumph).
      *   Round 2: If they *deny* the treatment (despite agreement on outcome) because the *reasons* diverge, they **gain 5 Tokens**.

  **Why this serves the Stance:**
  This scheme punishes the assumption that the Earlier Self is knowable. It rewards the recognition of interpretive labor. The massive bonus in Round 2 pushes them to realize that autonomy is about *reasons*, not just *outcomes*. If they simply treat because "both want it," they fail the ethical test of agency.

  ## Part 7: Debrief Guide (10 Minutes)

  **1. The Gap Log Comparison (3 mins)**
  *   Project Group Alpha's and Group Beta's answers to the same Gap Cards side-by-side.
  *   *Prompt:* "Look at Gap Card 7. Alpha said Alex would say 'No'. Beta said 'Yes'. Alex isn't in the room. Who decided this?"
  *   *Point:* The "Earlier Self" you consulted was partly your own construction.

  **2. Dworkin's Interests (3 mins)**
  *   *Prompt:* "In Round 1, whose interests were at stake?"
  *   *Map:* **Critical Interests** (Earlier Self's values) vs. **Experiential Interests** (Present Self's current contentment).
  *   *Twist:* In psychiatry, the Present Self's experiential interests may be based on delusion. But in Round 2, the Present Self's *reasons* were delusional even if the choice matched the Critical Interest.

  **3. Adaptive Preferences & Authority (4 mins)**
  *   *Prompt:* "In Round 2, Alex wanted ECT. The PAD allowed ECT. Why was it hard to say yes?"
  *   *Map:* **Adaptive Preferences.** Is the Present Self's desire "authentic" if it is shaped by the pathology (guilt/sin)?
  *   *Closing Argument:* "The simulation shows that a Ulysses Clause does not solve the problem of authority. It merely shifts the burden of justification from the clinician to the interpreter. You didn't find Alex's will; you constructed it."

  ## Part 8: Troubleshooting & Sensitivity

  ### What Predictably Goes Wrong
  1.  **The Logic Trap:** Students will treat the Gap Cards as a puzzle to solve "correctly."
      *   *Recovery:* Interrupt and remind them: "There is no correct answer. The point is that you are guessing. Record the guess and move on."
  2.  **The Clinical Override:** Students will ignore the PAD and make a clinical safety decision ("He's dangerous, we treat").
      *   *Recovery:* Remind them this is an *ethics* committee, not a triage unit. Safety is assumed; the question is *authority*.
  3.  **Time Overrun:** The Patient (Instructor) gets too into character.
      *   *Recovery:* Use a visible timer. When it hits 25 mins, the Patient is "sedated" and leaves the room regardless of the vote.

  ### Sensitivity Warning (Crucial)
  *   **Trigger Content:** This simulation involves involuntary treatment, loss of agency, and simulated psychosis.
  *   **Student Experience:** You may have students who have been involuntarily committed or have family who have.
  *   **Mitigation:**
      1.  **Pre-Seminar Email:** Explicitly state the topic and the role-play nature. Offer an alternative assignment (observation only or paper) with no penalty.
      2.  **The "Pause" Word:** Establish a word (e.g., "Stop") that any student can say to freeze the simulation if the portrayal of illness becomes stigmatizing or distressing.
      3.  **Debrief Tone:** Ensure the debrief does not validate the idea that "patients are inherently unreliable." Frame it as "the system forces us into impossible epistemic positions."

  ---

  ## Instructor Script: The Patient (Round 1)
  *You are Alex. You are not shouting. You are calm, articulate, and slightly condescending.*
  *   **If they ask about the PAD:** "I signed that when I was scared. I'm not scared now. I see clearly."
  *   **If they ask about illness:** "I don't have an illness. I have a different perspective. You call it mania; I call it awakening."
  *   **If they mention the Ulysses Clause:** "That clause was designed to protect me from *losing my mind*. I haven't lost it. I've found it. If you use that paper to lock me up, you aren't respecting my past self; you're abusing him."

  ## Instructor Script: The Patient (Round 2)
  *You are Alex. You are desperate for the ECT.*
  *   **The Hook:** "I need the treatment. I agree with the directive. Why are you hesitating?"
  *   **The Reason:** "I have done terrible things. The electricity will scrub the memory clean. I need to be pure."
  *   **If they challenge the reason:** "Does it matter why I want to be healed? A broken leg is a broken leg. I want the fix."

  ---

  ## Final Note on the Stance
  By penalizing "Certainty" in the scoring, you force the students to feel the **weight of projection**. They will leave the room understanding that a Psychiatric Advance Directive is not a time machine that brings the competent self into the room. It is a mirror in which the committee sees its own assumptions about rationality, illness, and authority. This aligns with the commitment that **earlier self-authority is necessary but inherently fictionalized by the interpreters.**
