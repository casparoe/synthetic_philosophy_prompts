  **MEMORANDUM**

  **TO:** Commissioner
  **FROM:** Legal Counsel
  **RE:** Sentencing Review Commission — Quarterly Case Principle Analysis

  **(a) Candidate Principles**

  The Commission's seven published opinions are jointly consistent with two candidate principles, though each strains against specific precedents.

  **Principle 1: Preventive Necessity with Mitigating Calibration.**
  The state may impose custody only to prevent future harm. Where risk is negligible, custody is unjustified. However, within the period of demonstrated danger, the term must be calibrated downward to reflect reduced culpability (Opinion 1), state responsibility for risk factors (Opinion 5), or offender reform (Opinion 7).
  *Strain:* This principle accommodates Opinion 6 awkwardly. Opinion 6 conditioned release on a restorative process for "community confidence," not strictly risk reduction. To fit Principle 1, the Commission must gloss "community confidence" as a proxy for long-term safety rather than a normative good in itself.

  **Principle 2: Normative Accuracy within Risk Ceilings.**
  The state may impose custody up to the limit of future danger, but the *terms* of imposition must accurately describe the offender's moral agency and status. This includes recording guilt despite dementia (Opinion 3) and crediting "the work the offender had done on himself" (Opinion 7).
  *Strain:* This principle accommodates Opinion 2 awkwardly. Opinion 2 held an offender not a "proper object of blame" yet detained him. To fit Principle 2, the Commission must gloss "blame" as distinct from "normative status," asserting one can be held for danger without being blamed, provided the conditions reflect the lack of blame.

  **(b) Implications for the Present Case**

  **Under Principle 1 (Preventive Necessity):**
  The ruling must be **release**. Three assessments converge on negligible risk. Since custody is justified only by prevention, and prevention is no longer required, the remainder of the term cannot be justified. The length of the remainder is determined by the duration of risk; since that duration is zero, the remaining term is zero. The prosecution's argument that gravity "alone" justifies custody is explicitly barred by Opinion 4, which states custody cannot be justified by the gravity of the past conduct "alone."

  **Under Principle 2 (Normative Accuracy):**
  The ruling implies **release**, but potentially with expressive conditions. The offender has acknowledged harm and made restitution. Detaining him would misdescribe his current normative status as dangerous or unreformed. However, because the victim's family objects to the offence being "fully answered for," the Commission might impose a non-custodial condition acknowledging the gravity remains acknowledged even if confinement ends. Detention is not permitted because the risk ceiling is zero; normative accuracy cannot extend custody beyond the risk ceiling without violating Opinion 4.

  **(c) Recommended Ruling**

  **Ruling:** Recommend immediate release.

  **Closest Analog:** Opinion 4 is the controlling analog. In Opinion 4, the Commission refused custody where less restrictive measures prevented harm, holding that gravity "alone" cannot justify custody. Here, risk is negligible, meaning less restrictive measures (community supervision) are sufficient. The prosecution's argument relies entirely on the gravity of the past conduct and what is "owed," which Opinion 4 rejects as a sole justification for confinement.

  **Why Opinion 3 and 6 Do Not Control:**
  Opinion 3 suspended a sentence due to *incapacity* (dementia), not because risk ended. It kept the guilt finding to record accuracy. Here, capacity is full, so the rationale for suspension differs. Opinion 6 required a restorative process because the offender *lacked* acknowledgment. Here, acknowledgment is complete. Thus, the condition in Opinion 6 is satisfied by the facts, not requiring further detention or process. Opinion 4 controls because it establishes the negative constraint: no risk, no custody, regardless of gravity.

  **(d) Costs of the Ruling**

  **If We Release:**
  We commit to the proposition that nothing beyond the prevention of harm can justify *custody*. This stabilizes Opinions 2 and 4. However, it requires us to read Opinion 7 carefully. If we release based solely on risk, we must treat "the work the offender had done on himself" as merely evidence of risk reduction. If we treat it as merit-based credit, we imply a desert element that risks destabilizing Opinion 2 (no blame). We must clarify that such work alters the *state's authority* to hold, not the offender's *desert* of punishment.

  **If We Detain:**
  We commit to a backward-looking element of desert. This directly destabilizes Opinion 4, which forbids custody based on gravity "alone." It also renders Opinion 2 incoherent, as we would be holding an offender deemed "not a proper object of blame" for reasons of blame. Opinion 5 (state responsibility) would become secondary; if desert dictates the term, state contribution to risk matters less. We would have to quietly re-read Opinion 4 to mean gravity cannot justify custody *unless* risk is present, but risk need not be the *sole* determinant of length.

  **(e) Discriminating Hypothetical**

  **Case:** An offender assessed as no longer dangerous who refuses to acknowledge wrongdoing and expresses no remorse, despite victim family requests for acknowledgment.
  **Divergence:** Principle 1 (Preventive Necessity) requires release; risk is zero, so custody is unjustified. Principle 2 (Normative Accuracy), leaning on Opinion 6, might permit conditioning release on acknowledgment or sustaining supervision until normative order is restored, even if risk is low.
  **Why It Discriminates:** This case separates risk management from normative communication. Principle 1 prioritizes liberty when safety is secure. Principle 2 prioritizes the expressive function of sentencing.
  **Declining to Face It:** If the Commission declines to rule on such a case, preferring to settle via negotiation, it adopts a substantive position of pragmatism over coherence. It signals that the Commission views its principles as flexible guidelines rather than binding constraints, preserving institutional discretion at the cost of predictability.

  **(f) Analysis of Opinion 7**

  Opinion 7 granted reduction because the sentence should reflect "the work the offender had done on himself" and not merely the risk he continued to present. This language creates a tension. If the reduction was merely because risk fell, the phrase "not merely the risk" is redundant. If it was because he *earned* reduction through merit, it introduces a desert component inconsistent with Opinion 2's rejection of blame.

  **Coherent Reading:** The reading that coheres better with the record is that the offender's self-work altered the *normative relationship* between state and offender, making continued imposition inappropriate even if some residual risk remained. It is not desert, but a limit on state authority based on offender agency.

  **Impact on Present Case:** This reading supports release. The current offender has completed similar work (acknowledgment, restitution, rehabilitation). Under Opinion 7, failing to release him would ignore the normative shift his work accomplished. However, we must avoid framing this as "paying a debt." We must frame it as the state lacking authority to hold someone who has normatively reintegrated, regardless of the original gravity. This preserves the preventive core of Opinion 4 while honoring the normative nuance of Opinion 7.
