answer: |-
  Here is the read on your teacher, the prediction for next week, and the strategy to corner her.

  ### The Read: What Principle Is She Running?

  Your teacher is running a modified version of what philosophers call the **"Same Number Quality Claim"** (Parfit's *Q*), but she's filtering it through a **Risk-Based Deontology**.

  In plain English, her principle is: **"The Principle of Avoidable Burdens."**

  Here is the rule set I've reverse-engineered from her six verdicts:
  1.  **Identity Doesn't Absolve:** It doesn't matter if a different person would have existed otherwise (Cases 1 & 2). If you can choose a scenario where the resulting person has fewer burdens, you must.
  2.  **The Threshold:** You are not obligated to create the *best* possible life (Case 4: "harder than average" is okay), but you are obligated to avoid *significant, preventable disadvantages* (Case 1: teen struggle; Case 2: chronic illness).
  3.  **The Asymmetry:** You have no duty to create happy people (Case 5), but if you *do* create people, you have a duty not to saddle them with avoidable burdens.
  4.  **The Action, Not The Outcome:** Moral judgment happens at the moment of choice, based on the risks and options available then, not on how the dice land later (Case 6).

  ### The Prediction: The Deaf Embryo Case

  **Verdict:** **Wrong.**

  **Why:**
  This is an **Identity-Independent Choice**. The parents can have Embryo A (Deaf) or Embryo B (Hearing). The number of people is the same (one child).
  *   According to her ruling in **Case 2** (Energy Policy), you cannot choose the option that leaves the future person with "chronic illness" or significant health burdens, even if that specific person wouldn't exist otherwise.
  *   According to **Case 6** (Risky Drug), imposing a risk of disability is wrong even if the child turns out healthy.
  *   While she accepts "harder than average" in **Case 4**, that was an **Identity-Dependent Choice** (this kid or *no* kid). Here, they have a choice between *this* kid and *that* kid.
  *   She will likely view deafness (in this context) as an "avoidable burden" similar to the chronic illness in Case 2, rather than a neutral cultural trait. The parents' desire for cultural alignment (Case 1: wanting a baby now) does not override the child's objective interest in having fewer burdens (hearing vs. deaf).

  ### Rival Principles & Where They Land

  To look smart, you need to show you know why *other* rules fail. Here are three competitors that fit some of her data but break on others.

  | Principle | How It Works | Fits Her Verdicts? | Prediction on Embryo |
  | :--- | :--- | :--- | :--- |
  | **1. Person-Affecting View** | "You only do wrong if you make a *specific* person worse off than they would otherwise be." | **Fails Cases 1 & 2.** (The kids in these cases aren't worse off than *their* alternative, which is non-existence). | **Not Wrong.** (Embryo A isn't harmed; they have a good life). |
  | **2. Maximize Welfare** | "Always choose the outcome with the highest total happiness/quality of life." | **Fails Cases 4 & 5.** (Case 4: Should have waited for a 'better' kid? Case 5: Should have had kids to add happiness?). | **Wrong.** (Embryo B has 'easier' life). |
  | **3. Parental Autonomy** | "Parents have the right to shape their family as they see fit, provided no abuse occurs." | **Fails Cases 1, 2, 3, & 6.** (She overrides parental choice in almost all risk/harm scenarios). | **Not Wrong.** (It's their family culture). |
  | **4. Avoidable Burdens (Her Rule)** | "If you can choose between people, pick the one with fewer objective burdens. If you can't, just ensure life is worth living." | **Fits All 6.** | **Wrong.** |

  ### Where I'd Put My Money

  I am betting 100% on **Avoidable Burdens**.

  **The Smoking Gun:** **Case 6 (The Risky Drug).**
  This is the most important clue. If she were a standard Utilitarian, she might say "Baby is fine, so it worked out." If she were a Person-Affecting theorist, she'd say "No harm done."
  But she said **Wrong**.
  This proves she judges the **structure of the choice**, not the result.
  In the Embryo case, the structure is: *Choose Higher Burden (A) vs. Choose Lower Burden (B).*
  Even if Embryo A turns out to hear (the 30% chance), the *choice* was to select the higher-risk/higher-burden option. That mirrors Case 6 exactly.

  **Does the outcome matter?**
  **No.** If the clinic was wrong and the kid hears fine, her verdict remains **Wrong**.
  *   **Evidence:** Case 6. The drug parents were wrong *even though* the baby came out fine.
  *   **Reasoning:** She told you explicitly: "You judge that at the moment they did it." The moral failure was accepting the 1-in-3 risk of disability when they could have avoided it. In the Embryo case, the moral failure is accepting the 70% chance of deafness (a burden) when they could have picked the hearing embryo.

  ### The Most Awkward Verdict for This Principle

  **Case 4 (The "Harder Than Average" Kid).**
  This is the weak point in her armor.
  *   **The Tension:** If the rule is "Avoid Avoidable Burdens," why was Case 4 permissible? That kid has a "harder than average" life. That is a burden.
  *   **The Fix:** She has to lean heavily on the **"Only Chance"** clause. In Case 4, the burden was the *price of existence*. In Cases 1, 2, and the Embryo case, the burden was the *price of a specific choice* when a better choice existed.
  *   **Why it's awkward:** It forces her to define exactly how much "harder" is too much. Is Deafness "harder than average" (Case 4: Okay) or "chronic illness/contamination" (Case 2: Wrong)? She will have to argue that Deafness falls into the Case 2 bucket, not the Case 4 bucket.

  ### The Tie-Breaker Case (To Force Her Hand)

  If you want to force her to reveal exactly where she draws the line between "Culture" and "Burden," write this on the board next month:

  **The Case:**
  > A wealthy couple is doing IVF. They can choose between Embryo X (will be born into a wealthy family, elite schools, life expectancy 85) and Embryo Y (will be born into a strict, isolated religious sect. Life is happy and 'worth living,' but involves hard manual labor, no higher education, and life expectancy 65). The parents belong to the sect and choose Embryo Y to preserve their community.
  > **Question:** Is this wrong?

  **How The Rules Split:**
  *   **Parental Autonomy:** **Not Wrong.** It's their culture and the kid is happy.
  *   **Avoidable Burdens (Her Rule):** **Wrong.** This strips away the "Deaf Culture" defense. Deafness can be framed as a neutral cultural identity; a shortened lifespan and lack of education are objectively harder burdens. If she says "Wrong" here, she admits objective welfare trumps cultural preservation. If she says "Not Wrong," she admits culture can override objective burdens.
  *   **Person-Affecting:** **Not Wrong.** Embryo Y isn't harmed (they wouldn't exist otherwise).

  **Why this works:** It isolates the "Burden" variable from the "Identity" variable. It forces her to admit whether she thinks "quality of life" is objective (health/wealth) or subjective (cultural fit). Given Case 2 (Contamination/Chronic Illness), she will likely say **Wrong**, which confirms she prioritizes objective capacity over subjective cultural fit.
