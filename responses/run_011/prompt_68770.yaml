answer: |-
  The deflationary conclusion collapses because the traffic analogy illicitly substitutes a pure coordination game for the mixed-motive cooperation problems that characterize most moral norms.

  In the traffic case, the players are drivers, the equilibrium is mutual adherence to one side, the knowledge condition is visual confirmation of others' behavior, sanctions are physical collision or legal fines, and selection is typically legislative decree creating a focal point. In the norm case (e.g., promise-keeping), players are community members, the equilibrium is mutual compliance, knowledge is shared expectation of obligation, sanctions are reputational loss or guilt, and selection is evolutionary or cultural drift. The critical disanalogy bearing on your colleague's inference is the payoff structure: driving is a pure coordination game where defection (driving on the left when others drive right) yields a strictly lower payoff for the defector (crash), whereas norms like promise-keeping often mask a Prisoner's Dilemma where defection (breaking a promise while others keep theirs) yields a higher individual payoff despite collective harm. The traffic analogy quietly imports the absence of temptation; in driving, prudence and morality align perfectly because physics punishes defection immediately, whereas norms exist precisely because prudence often recommends defection absent social enforcement.

  Because the traffic case lacks the incentive incompatibility that makes norms necessary, it cannot support the claim that "why conform?" is a confused question; in mixed-motive games, asking why one shouldn't free-ride is the central problem of social order, not a category error. The traffic case was carrying the deflationary conclusion by stacking the deck with a scenario where conformity is individually rational regardless of moral obligation. A better source domain is the Tragedy of the Commons or a Public Goods Game, where individual rationality leads to collective ruin without intervention. This model licenses the view that norms are not merely focal points but enforcement mechanisms or preference-transformers required to sustain cooperation against individual incentives, implying that "why conform?" demands an answer about sanction credibility, internalization, or moral reason rather than a shrug about equilibrium selection.
