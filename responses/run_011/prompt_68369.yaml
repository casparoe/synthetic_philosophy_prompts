answer: |-
  You are describing a real, documented phenomenon, and your intuition that standard terms like "self-fulfilling prophecy" or "medicalisation" fail to capture the mechanics is correct. You have identified a specific epistemic problem in psychiatry and psychology: the instability of the object being measured caused by the measurement process itself.

  Here is the carving you asked for: the name, the neighbors, the boundary conditions, and the state of the debate.

  ### 1. The Name
  The established term for the general mechanism you are describing is **The Looping Effect of Human Kinds**.

  It was coined by the philosopher of science **Ian Hacking**. He distinguishes between "indifferent kinds" (like rocks or viruses, which do not change when classified) and "interactive kinds" (human beings, who change when classified). When you classify a person, that classification becomes available to them as a way of understanding themselves. They may adopt it, resist it, or modify their behavior to align with it. This changes the population, which in turn requires the classification to change.

  However, your description adds a specific layer that Hacking touches on but does not center: the role of the **instrument**. You are describing a *psychometric* looping effect. The vocabulary doesn't just leak from the diagnosis; it leaks from the *items on the questionnaire*.

  If you need a term that captures the specific instrumental mechanism you witness at intake, the closest technical description is **Construct Drift via Semantic Contamination**.
  *   **Construct Drift:** The definition of what is being measured changes over time.
  *   **Semantic Contamination:** The language used to measure the trait infiltrates the population, altering how they report the trait.

  But for the broader phenomenon—the circuit of classification, self-description, and statistical change—"The Looping Effect" is the canonical name.

  ### 2. Why Your Rejections Are Correct
  You were right to discard "self-fulfilling prophecy" and "medicalisation." Here is the precise distinction:

  *   **Self-Fulfilling Prophecy:** This implies a *false* belief becomes true because people act on it. (e.g., "This bank is insolvent" causes a run that makes it insolvent). In your case, the belief isn't necessarily false. The patients *are* experiencing the distress. The scores *are* rising. The error is not in the numbers, but in the **inference of prevalence**. The loop changes the *people*, not just the belief about them. Hacking emphasizes this: the kind itself changes, not just our knowledge of it.
  *   **Medicalisation:** This implies a power dynamic where a profession colonizes normal behavior to expand authority. You noted that "nobody is extending anything." In your model, the clinicians are being moved by their own instruments as much as the patients are. It is a systemic feedback loop, not a conquest. Medicalisation is top-down; the Looping Effect is circular.

  ### 3. Are Your Two Cases the Same Mechanism?
  **Yes.** They are the same mechanism operating with different valences.

  *   **Case 1 (ADHD/Anxiety): Positive Identification.** The vocabulary offers a legible explanation for suffering. Adopting the vocabulary reduces uncertainty or grants access to resources. The loop amplifies reporting.
  *   **Case 2 (Stigmatised Diagnosis): Negative Identification.** The vocabulary offers a spoiled identity. Adopting the vocabulary incurs social cost. The loop suppresses reporting.

  In both cases, the **classification alters the reporting behavior**, which alters the **statistics**, which alters the **clinical understanding**. In the first, the category swells; in the second, it hollows out. Both demonstrate that the statistic is not a passive reflection of an underlying biological reality, but an active product of the interaction between the label and the person.

  ### 4. Boundary Conditions: When Does the Circuit Not Close?
  You asked what would have to be true for the circuit *not* to close. The loop breaks under three specific conditions:

  1.  **Biological Markers:** If the diagnosis relies entirely on a test the patient cannot influence (e.g., a blood test for lead poisoning, or a specific genetic marker), the vocabulary cannot change the score. The loop is broken because the measurement is "indifferent" to the subject's self-conception.
  2.  **Sealed Vocabulary:** If the diagnostic criteria are kept secret or are too technical to enter common parlance (e.g., specific EEG patterns or complex algorithmic criteria not reducible to quiz questions), the vocabulary cannot escape the clinic to shape self-description.
  3.  **Unconscious or Non-Reflective Traits:** If the condition prevents the person from understanding or adopting the label (e.g., severe dementia, or certain psychotic states where insight is lost), they cannot align their self-description with the instrument.

  If a category lacks these protections, it is vulnerable to the loop. Most mental health categories lack all three.

  ### 5. Consensus vs. Contest
  You asked to distinguish between what is settled and what is fought over.

  **Settled:**
  *   **The Existence of the Loop:** Among philosophers of psychiatry and sophisticated clinicians, it is consensus that diagnostic categories interact with the people they classify. Ian Hacking's core thesis is widely accepted: human kinds are interactive.
  *   **The Corruption of Prevalence Data:** It is generally accepted that prevalence rates for self-reported conditions cannot be treated as stable biological facts over long periods. Everyone agrees the numbers are "contaminated" by cultural factors.

  **Contested:**
  *   **The Magnitude:** This is the bitter dispute. One side argues the loop accounts for *most* of the rise in conditions like ADHD or autism (it is mostly a change in language and awareness). The other side argues the loop is real but minor, and that rising scores reflect genuine increases in distress or better detection of pre-existing conditions. There is no agreed-upon method to separate the "real" increase from the "looping" increase.
  *   **The Remedy:** There is no consensus on what to do about it.
      *   *The Purists* argue we must tighten criteria and rely more on observer-reports (clinician ratings) rather than self-reports to stop the vocabulary leakage.
      *   *The Pragmatists* argue that if the vocabulary helps people articulate suffering and get help, the "inflation" is a feature, not a bug. They argue that trying to stop the loop is unethical because it denies people the language they need to survive.
      *   *The Skeptics* argue we should abandon these categories entirely in favor of dimensional measures (e.g., "distress level" rather than "Disorder X"), though this creates its own measurement problems.

  ### 6. Summary of the Carving
  *   **What it is:** A feedback loop where the instrument used to measure a human trait changes the trait's expression or reporting by altering the subject's self-conception and vocabulary.
  *   **What it is not:** It is not necessarily fraud (self-fulfilling prophecy) and not necessarily professional aggrandizement (medicalisation).
  *   **The Edge:** It applies to "interactive kinds" (people) measured by "porous instruments" (questionnaires with public vocabulary). It does not apply to "indifferent kinds" (viruses) or "sealed instruments" (biomarkers).
  *   **The Two Cases:** They are the same mechanism. One is approach (identification), one is avoidance (stigma). Both prove the statistic is unstable.

  ### 7. A Note on the Thinker
  If you wish to locate this idea in the literature, **Ian Hacking** is the primary source. His book *The Social Construction of What?* contains the relevant chapter ("The Looping Effects of Human Kinds"). He does not provide a solution, but he provides the vocabulary to stop you from feeling like you are imagining the pattern. You are not. You are observing the ontology of psychiatry in real-time.

  There is a contemporary researcher, **Nick Haslam**, who writes on **"Concept Creep."** He describes how concepts like "trauma" or "bullying" expand to include milder experiences over time. This is the *result* of the loop you are describing. Hacking explains *why* it happens (the interaction); Haslam documents *that* it happens (the expansion).

  You are standing at the exact point where the loop closes. The forms you file are not just recording data; they are part of the machinery that generates the data for the next cycle. That is not a failure of your observation; it is a feature of the system.
