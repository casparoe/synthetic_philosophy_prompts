answer: |-
  To neutralize moral luck, you must separate the judgment of the student's character from the randomness of the outcome by sanctioning based on the risk they chose to create rather than the damage that actually occurred.

  ### The Procedure: "Risk-Based Culpability"

  Run these five questions in order for every case. If the answer to any of the first three is "No," the case is dismissed or referred to counseling without sanction.

  **1. The Control Check:** Was the violation within the student's reasonable control?
  *   **Settled Answer:** Yes, if they could have chosen differently without immediate threat to safety. No, if it was a reflex, coercion, or accident without negligence.
  *   **Luck Neutralized:** *Constitutive Luck* (personality/impulse control issues). We judge the choice, not the temperament.

  **2. The Intent/Risk Check:** Did they intend to break the rule, or knowingly accept a high risk of breaking it?
  *   **Settled Answer:** Yes, if there was purpose or recklessness. No, if it was pure negligence (should have known) unless the rule specifies strict liability.
  *   **Luck Neutralized:** *Antecedent Luck* (upbringing/background). We judge the mental state at the time of the act.

  **3. The Substantial Step Check:** Did they take concrete action beyond mere thought or preparation?
  *   **Settled Answer:** Yes, if they initiated the violation (e.g., copied the answer, shoved the friend). No, if they only planned, wrote it down, or bought supplies but stopped before acting.
  *   **Luck Neutralized:** *Timing Luck.* This prevents punishing thoughts while still catching attempts before damage occurs.

  **4. The Foreseeable Harm Check:** What was the reasonable risk of harm at the moment of action, ignoring what actually happened?
  *   **Settled Answer:** Assess the *potential* damage (e.g., shoving someone always risks injury/property damage).
  *   **Luck Neutralized:** *Outcome Luck.* This is the core fix. A shove that breaks a phone and a shove that doesn't have the same Foreseeable Harm.

  **5. The Sanction Calibration:** Does the punishment match the Foreseeable Harm and Intent, or the Actual Harm?
  *   **Settled Answer:** Match Intent + Foreseeable Harm. Actual Harm only dictates restitution (paying for the phone), not suspension length.
  *   **Luck Neutralized:** *Result Luck.* Prevents harsher suspensions solely because things went wrong.

  ### Philosophy: What to Keep and What to Drop

  **Keep:**
  *   **The Control Principle:** You are only blameworthy for what you control. This is non-negotiable. If they couldn't choose otherwise, they aren't culpable.
  *   **Outcome Luck Distinction:** The moral quality of an action is determined before the result is known. This is essential for fairness in the prank case.
  *   **Attempt vs. Preparation:** You must distinguish between thinking about a crime and starting it. This fixes the "written plan" overreach.

  **Drop:**
  *   **Constitutive Luck Deep-Dive:** Don't debate whether a student's impulsivity is genetic or environmental. Treat them as agents capable of choice unless there's a documented disability.
  *   **Circumstantial Luck (Enforcement):** You cannot neutralize the luck of who gets caught. You can only ensure the person *who is caught* isn't punished *for* being caught.
  *   **Utilitarian Calculus:** Do not make an example of one student to deter others. That punishes them for factors outside their control (the school's need for deterrence).

  ### Where This Will Misfire and Hurt

  *   **The "Bloodless Justice" Problem:** Parents and victims will hate this when actual harm occurs. If Student A breaks a nose and Student B breaks nothing, giving them the same suspension feels like you don't care about the broken nose. You will have to explain that restitution covers the nose, but suspension covers the *choice* to shove.
  *   **The "Ghost Offender" Frustration:** In the cheating case, you still cannot punish the uncaught kid. This procedure doesn't fix enforcement gaps; it only stops you from compounding the injustice by punishing the caught kid more severely because they were clumsy.
  *   **The "Near Miss" Loophole:** A student who attempts a massive violation but fails due to luck (e.g., tries to hack grades but the system blocks it) will get the same sanction as one who succeeded. This feels counter-intuitive to staff who want to reward "success" in stopping harm, but it is necessary for consistency.
  *   **Human Judgment Handoff:** Step 4 (Foreseeable Harm) requires human estimation. There is no formula for "how risky was this shove." You must vote on this. If the council splits 3-2 on the risk level, the tie goes to the student (benefit of the doubt).

  ### Case Applications

  **Case 1: The Two Cheaters (One Caught, One Not)**
  *   **Procedure Run:**
      *   Control/Intent: Both intended to cheat.
      *   Substantial Step: Both used the key.
      *   Foreseeable Harm: Identical (undermining academic integrity).
      *   Sanction: Identical.
  *   **Verdict:** You sanction the caught student based on the *act of cheating*, not the *act of getting caught.* You acknowledge you cannot touch the uncaught student.
  *   **Unwanted Answer:** You must accept that one kid walks free purely due to enforcement luck. Do not inflate the caught kid's sanction to "balance the scales." That punishes them for the other kid's luck.

  **Case 2: The Identical Prank (Phone Broken vs. No Damage)**
  *   **Procedure Run:**
      *   Control/Intent: Both intended to shove (reckless/intentional).
      *   Substantial Step: Both shoved.
      *   Foreseeable Harm: High for both (shoving near lockers always risks property/injury).
      *   Sanction: Identical suspension/detention.
  *   **Verdict:** Both receive the same disciplinary sanction. The student who broke the phone pays for the phone (restitution), but does not get extra suspension time.
  *   **Unwanted Answer:** The victim with the broken phone will feel justice wasn't served because the punisher wasn't punished *more*. You must hold the line: the suspension is for the shove, the payment is for the phone.

  **Case 3: The Written Plan (Never Acted On)**
  *   **Procedure Run:**
      *   Control/Intent: Intent was there.
      *   Substantial Step: **No.** Writing a plan is preparation, not a substantial step toward execution.
      *   Foreseeable Harm: Low, because no action was taken to create risk.
      *   Sanction: None.
  *   **Verdict:** No honor council sanction. Refer to counselor for safety assessment.
  *   **Unwanted Answer:** It feels dangerous to let them go. However, punishing thought violates the Control Principle. If you sanction this, you must sanction every kid who ever wrote an angry note they didn't send. The safety net is the counselor, not the suspension.
