answer: |-
  The sleep lab smelled of ozone and old dust, the specific scent of electronics running hot in a sealed room. Elias had spent thirty years watching metal eat itself in corrosion tanks, measuring the rate of decay in millimeters per year. Now, he watched ink eat paper. The pen on the chart recorder scratched with a rhythmic dryness, tracing the voltage of a sleeping brain onto a rolling feed of thermal graph stock.

  Tonight, the subject was Elias.

  The protocol was simple, born from a decade of refinement. Before sleep, the subject agrees on a motor signal impossible to perform during normal REM atonia, except in a lucid state. A specific sequence of eye movements. Left, right, left, right. Sharp, deliberate sweeps. The theory was elegant: the eye muscles are spared the paralysis that locks down the limbs. They remain a tether. If you dream you are flying, your body stays still. But if you dream you are signaling, the eyes move. The electrodes catch the potential difference. The pen swings. A wire runs from the dreaming mind, through the scalp, into the amplifier, and out onto the paper in the waking world. A bridge between ontologies.

  Elias prepped the electrodes himself. He knew the impedance had to be under five kilo-ohms. He abraded the skin at the outer canthus until it was pink, applying the gel with the precision of a jeweler. He lay down on the narrow cot, the ceiling tiles stained with water damage that looked like a map of a continent he'd never visited. He set the intention. *When I know I am dreaming, I will signal.*

  He drifted. The transition wasn't a door closing but a dissolving, like sugar in hot tea. He was standing in a corridor of mirrors, then he was in the lab, but the lab was underwater. He knew the water was impossible. He knew the pressure should have crushed the chart recorder. *Lucid,* he thought. *Signal.* He swept his eyes. Left. Right. Left. Right. He felt the tug of the muscles, the mechanical compliance of the dream-eyeballs.

  He woke to the hum of the HVAC. The light coming through the blinds was the pale, washed-out grey of 6:00 AM. He sat up. The gel had dried around his temples, cracking like dried mud. He peeled the electrodes off, the tacky sound loud in the silence.

  He walked to the control desk. The chart paper had rolled out during the night, a long white tongue lapping onto the floor. He knelt and gathered it, the paper warm from the heater element. He smoothed it on the laminate countertop. There were the slow, rolling waves of REM sleep. The density was high. And there, cutting through the theta waves like a knife cut through cloth, was the signal.

  Four sharp spikes. Left, right, left, right. Perfect amplitude. Perfect timing.

  Elias traced the ink line with his finger. The protocol dictated that this proved he had been conscious within the dream. It proved the signal had traversed the wire. It proved that the man kneeling at the counter was the waking observer receiving a message from the sleeper.

  But Elias didn't move. He looked at his hand. He looked at the paper. He looked at the pen arm of the recorder, still resting in its park position.

  In the corrosion lab, you learned that evidence is only as good as your reference standard. You measure rust against a pristine sample. You measure voltage against a ground. But here, the ground was missing. The wire was supposed to run from the dream to the world. But as he stared at the ink, Elias realized the wire never left the room.

  The hand reading the chart was made of the same stuff as the hand sleeping on the cot. The eye reading the ink was the same eye that swept in the dark. The paper record was physical, yes, but its physicality was only confirmed by touch and sight, both of which were currently functioning within the very consciousness they were supposed to verify. If this moment was the dream, then the chart was a dreamt chart. If this moment was wakefulness, the chart was a real chart. But the chart itself couldn't tell him which side of the glass he was standing on.

  The signal hadn't crossed a boundary. It had merely looped. It was a message sent from one part of the experience to another, signed and received by the same entity. The wire didn't connect two worlds; it connected two moments in a single, continuous stream of perception. The ink was dry, the paper was rough under his thumb, the coffee in his mug was bitter. All of it was consistent. All of it was coherent. And coherence was not proof of externality. A dream is perfectly coherent while you are inside it.

  He remembered the old butterfly story he'd been reading lately. A man dreams he is a butterfly, fluttering about, knowing nothing of a man. Then he wakes. Is he a man who dreamt he was a butterfly, or a butterfly dreaming he is a man? The experiment was supposed to solve this. It was supposed to be the pin that stuck the butterfly to the board. *Here is the wakefulness,* the chart said. *Here is the proof.*

  But the proof was internal. The verification was circular. He was looking for a seam in the fabric, a place where the dream ended and the world began, but the fabric had no seam. It was woven all of one thread. The signal was real, but its reality didn't imply a receiver outside the system. It only implied a system capable of recording its own movements.

  Elias picked up a red pen. He could mark the chart. *Verified,* he would write. He could file the report. He could clock out and go home to a house that felt solid, drive a car that responded to the steering wheel, eat breakfast that filled his stomach. All of it would signal consistency. All of it would carry the voltage of reality.

  But he knew now that the wire didn't go anywhere. It just connected the sleeping head to the waking hand, and both were held by the same ghost.

  He capped the red pen. He rolled the chart back up, the paper springing against his palm. He wouldn't mark it. There was nothing to verify. There was only the transformation, the shifting from one state to another without a change in substance. The corrosion continued, slow and silent, eating the certainty of the morning just as surely as it ate the steel in the tanks.

  Elias turned off the recorder. The hum stopped. The silence that followed was heavy, not with absence, but with presence. He walked to the door, his hand on the knob, feeling the cold brass. It was a perfect sensation. It meant nothing. He stepped out into the hallway, carrying the paper roll under his arm, a record of a signal sent from nowhere to nowhere, perfectly preserved.

