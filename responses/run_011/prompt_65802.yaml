answer: |-
  ### Part I: The Specification (Desiderata)

  You are correct that the debate lacks a metrological specification. Philosophers treat the "currency" as a conceptual noun rather than an operational variable. Below are the five necessary conditions for a currency of equality to function within a liberal democratic state's administrative apparatus.

  | # | Desideratum | The Phenomenon / Case Requiring It | Status | Trade-off (What is Given Up) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Public Ascertainability** | The state cannot tax or transfer based on facts it cannot verify without violating privacy. *Case:* A utility monster claims high distress to demand resources; the state cannot verify the distress without brain-scanning. | **Non-Negotiable** | **Depth.** You sacrifice the ability to measure internal states (pain, joy, deep capability) in favor of external proxies (income, assets, diagnosed disability). |
  | **2** | **Conversion Sensitivity** | Identical resources yield different outcomes due to biology or social context. *Case:* Giving a wheelchair user the same cash as an ambulatory person does not equalize mobility; the wheelchair user faces conversion costs. | **Non-Negotiable** | **Simplicity.** You sacrifice a flat per-capita distribution. The system becomes complex, requiring categories and adjustments that create boundary disputes. |
  | **3** | **Responsibility Discrimination** | People make choices that alter their needs. *Case:* A smoker develops lung disease vs. a non-smoker with genetic lung disease. Treating them identically subsidizes the choice; treating them differently punishes the biology. | **Negotiable** (see Trilemma) | **Privacy/Ascertainability.** To measure choice vs. circumstance, the state must inquire into intent and history, which conflicts with Desideratum 1. |
  | **4** | **Error Independence** | Measurement error must not correlate with the magnitude of the disadvantage. *Case:* If the metric relies on self-reporting or complex forms, the least educated (worst off) have the highest error rates, systematically under-recording their need. | **Non-Negotiable** | **Precision.** To reduce correlated error, you often must use cruder, more robust proxies (e.g., census data vs. individual application) which increases overall variance. |
  | **5** | **Administrative Invariance** | The metric must yield the same result regardless of which bureaucrat or local office processes it. *Case:* Two identical families in adjacent counties receive different benefits due to local interpretation of "need." | **Non-Negotiable** | **Discretion.** You sacrifice local flexibility to handle edge cases, rigidifying the system against unique but uncodifiable hardships. |

  ### Part II: The Impossibility Theorem

  Your suspicion is correct. The trilemma is real, and it is structural, not merely technical.

  **The Trilemma:** You cannot simultaneously satisfy **Public Ascertainability**, **Conversion Sensitivity**, and **Responsibility Discrimination** within a single state-administered metric.

  1.  **Public Ascertainability** requires the metric to be based on external, objective data (income, assets, medical diagnosis).
  2.  **Conversion Sensitivity** requires the metric to account for internal, subjective, or complex relational factors (how *I* convert income to well-being).
  3.  **Responsibility Discrimination** requires the metric to distinguish between unchosen circumstances and voluntary choices.

  **Why it is unsatisfiable:**
  To capture Conversion Sensitivity and Responsibility, you must look inside the "black box" of the agent (their psychology, preferences, and specific constraints). To maintain Public Ascertainability (and liberal privacy), you must treat the agent as a black box and measure only inputs and outputs.
  *   If you prioritize Ascertainability (Resources), you fail Sensitivity (the disabled person gets the same as the able-bodied).
  *   If you prioritize Sensitivity (Capabilities/Welfare), you fail Ascertainability (the state must intrude to measure functionings).
  *   If you prioritize Responsibility (Luck Egalitarianism), you fail both Ascertainability (mind-reading intent) and often Sensitivity (punishing adaptive preferences).

  **Resolution:** For a state policy instrument, **Responsibility Discrimination must be dropped.**
  A state cannot reliably measure "choice" without becoming totalitarian or error-prone. Therefore, a viable currency must treat all needs as "circumstantial" for the purpose of measurement, even if we philosophically believe some are chosen. You pay for the smoker's lung treatment the same as the non-smoker's, not because choice doesn't matter, but because the *measurement instrument* (the state) cannot calibrate for it without introducing unacceptable bias (Error Correlation).

  ### Part III: The Most Exclusionary Requirement

  **Public Ascertainability without Intrusive Inquiry.**

  This is the filter that kills the most candidates.
  *   **Welfarism (Utility/Happiness):** Dies immediately. Subjective welfare is not publicly ascertainable without intrusive inquiry. It is also unstable (hedonic adaptation).
  *   **Strict Capability Approach (Sen/Nussbaum):** Dies on implementation. While "functionings" are better than "utility," a full capability set is too high-dimensional for a tax system. You cannot measure "ability to appear in public without shame" administratively.
  *   **Resource Equality (Dworkin):** Survives. Income and assets are ascertainable. It fails on Sensitivity, but it survives the entry requirement.
  *   **Access to Advantage (Cohen):** Fails. "Advantage" blends welfare and resources, inheriting the measurement problems of both.

  If you require the currency to be usable by a tax authority tomorrow, **Welfarism is inadmissible.** It is a theoretical construct, not a measurand.

  ### Part IV: Institutional Indexing

  **Commitment:** The specification **must be indexed to the institutional setting.** There is no universal currency of equality.

  A metric for a **national tax-and-transfer system** is fundamentally different from a metric for a **small community** or **cross-country comparison**.
  *   **National State:** High coercion, low information, high need for invariance. Currency must be *Resources* (proxied for Capabilities).
  *   **Small Community:** Low coercion, high information, high trust. Currency can be *Capabilities* or *Needs*.
  *   **Cross-Country:** No coercion, no shared administration. Currency must be *Primary Goods* or *GDP/capita* (purely comparative, not distributive).

  To demand one currency for all settings is to commit a category error akin to using a micrometer to measure the distance between stars. The "instrument" defines the "measurand." Since the state is a blunt instrument, its currency must be blunt (resources), whereas a community is a fine instrument and can use a fine currency (welfare/capability). **I reject the idea of a context-independent currency.**

  ### Part V: Evaluation of Your Metrology Imports

  You asked which of your imported requirements survive translation.

  1.  **Ascertainability without intrusive access:** **Survives.** This is the liberal constraint. It is the definition of the political "public."
  2.  **Invariance to who does the ascertaining (Round-Robin):** **Survives.** This is the Rule of Law. If Office A and Office B measure the same poverty differently, the system is broken.
  3.  **Measurement error not correlating with the level (Heteroscedasticity):** **Survives and is Critical.** This is the most important import. In social policy, error *always* correlates with disadvantage (the poor have less documentation, more chaotic lives). If your uncertainty budget does not account for this, your policy is regressive by design.
  4.  **Stability of the metric across time (1995 vs 2045):** **Fails.** Social units are not physical constants. A dollar in 1995 is not a dollar in 2045, nor is "social inclusion." You cannot have absolute stability. You need **Chain-Linking**. You must accept that the definition of the measurand will drift and require periodic re-baselining (e.g., updating the poverty basket). Demanding absolute stability freezes injustice.
  5.  **Robustness to the behaviour of those measured:** **Survives (as Goodhart's Law).** This is the Lucas Critique. If you measure income, people hide income. If you measure poverty by calories, people buy cheap filler. A valid currency must be "game-resistant" or account for the gaming in the uncertainty budget.

  ### Part VI: Final Verdict and Ranking

  You asked for a position, not a survey. Here is the ranking of the familiar camps based on the specification above, specifically for a **National Measurement Institute of Social Justice** (i.e., the State).

  **1. The Winner (by default): Resource Equality (Dworkin/Arneson hybrid)**
  *   **Why:** It is the only currency that satisfies Public Ascertainability and Administrative Invariance.
  *   **The Cost:** It admits high Conversion Error. It treats the disabled and the able-bodied identically unless specific "disability tags" are added.
  *   **The Fix:** We must treat Resources not as the *end*, but as the *proxy measurand* for Capabilities. We accept the measurement error (the bias) but correct for it via categorical adjustments (disability benefits, regional cost-of-living adjustments) rather than trying to measure the capability directly. This is standard analytical chemistry: you measure the absorbance to infer the concentration, knowing the matrix affects the reading, and you apply a matrix correction factor. You do not try to measure the concentration directly if you lack the sensor.

  **2. The Loser: Welfarism**
  *   **Why:** It fails the Ascertainability constraint. It requires a sensor (access to consciousness) the state does not possess and should not possess. It is scientifically inadmissible for policy.

  **3. The Loser: Strict Luck Egalitarianism**
  *   **Why:** It fails the Responsibility Discrimination constraint (see Trilemma). It requires distinguishing brute luck from option luck. The measurement error on "intent" is too high and correlates with socioeconomic status (the rich buy better lawyers/psychologists to prove their choices were constrained).

  **4. The Compromise: The Capability Approach (Sen)**
  *   **Why:** Normatively superior, operationally deficient. It serves well as a *diagnostic* tool (like a qualitative analysis) but fails as a *quantitative* tool for transfer calculations. It is the "theoretical truth" that the "instrument" cannot measure.

  **Conclusion:**
  For a national tax-and-transfer system, **Income/Wealth (Resources) adjusted for known conversion factors (Disability/Location)** is the only admissible currency.
  *   **Measurand:** Command over societal resources.
  *   **Correction Factors:** Disability status, dependents, regional price indices.
  *   **Uncertainty Budget:** Must explicitly include the "Choice/Circumstance Ambiguity" as a systematic uncertainty, not random noise.
  *   **Philosophical Cost:** We must accept that we will sometimes subsidize bad choices and sometimes under-compensate for hidden disabilities. This is not a philosophical failure; it is an instrument limitation. To demand more is to demand a sensor that does not exist.

  Your metrological instinct is sounder than the philosophers'. They are arguing about the true nature of the fluid; you are correctly asking about the calibration of the pipette. In policy, the pipette wins.
