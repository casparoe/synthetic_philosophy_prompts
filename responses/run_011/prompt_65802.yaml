      *   *My Stance:* **Hybrid Resource-Capability with a "Proxy Constraint."** Acknowledge that for *state policy*, we must measure Resources as a proxy for Capabilities, accepting the measurement error, rather than trying to measure Capabilities directly and failing.
      *   *Failing Camp:* **Welfarism.** It fails the Ascertainability constraint fundamentally. You cannot tax/transfer based on subjective utility without a tyranny of inquiry.

