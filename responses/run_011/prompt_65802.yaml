  *Correction on Stability:* In metrology, units change (e.g., the kilogram redefinition). In politics, the *meaning* changes. I should argue that stability is impossible, but *calibration continuity* is required.
  *Correction on Trilemma:* Be explicit. It is a logical impossibility for a liberal state.

  11. **Final Polish:** Ensure the distinction between "ideal theory" and "non-ideal measurement" is sharp, as the user emphasized this.

