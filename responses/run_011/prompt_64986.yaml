answer: |-
  # The Equilibrium Room

  Kaela sat in the center of the Directorate of Equilibrium, a circular room lined with pneumatic tubes and the low hum of calculating engines. Her title was Senior Iteration Technician, though her colleagues called her the Auctioneer. She did not sell anything. She adjusted numbers until the world fit inside them.

  On her desk lay the Trial Price Vector for Cycle 44. It was a stack of cards, each bearing the coded price of a producer good. Her task was to send these prices out to the state enterprises, wait for the returns, calculate the excess demand, and revise the prices. Up for excess demand, down for excess supply. Iterate until the sum of excess demands was zero. When the vector stopped moving, the Plan was valid.

  She slid the first card into the outbound tube. *Cobalt Concentrate, Grade A.* Price: 420 Credits per ton.

  The return slips arrived an hour later, clattering into the wire baskets beneath her desk. She pulled the first one from the Northern Extraction Combine. It was Form 88-B, standardized across the directorate.

  > **ENTERPRISE RETURN: NORTHERN EXTRACTION COMBINE**
  > **COMMODITY:** Cobalt Concentrate, Grade A
  > **TRIAL PRICE:** 420 Cr/T
  > **REPORTED CAPACITY:** 4,000 Tons
  > **REQUESTED INPUTS:** Explosives (High), Fuel (High), Labor (Standard)
  > **EXCESS DEMAND SIGNAL:** Negative (Surplus Reported)
  > **NOTE:** Shaft 7 flooding. Assay grades stable. Cannot exceed 4,000 tons without capital injection.

  Kaela frowned. She knew Shaft 7. She had seen the geological surveys. The flooding was minor, manageable with standard pumps. But she also knew the incentive structure. If the Combine reported a capacity of 5,000 tons this cycle, next cycle's target would be 5,000 plus a growth factor. By reporting 4,000, they secured a manageable quota and qualified for a capital injection to fix the pumps, which they likely already had in storage.

  This was the first distortion. The prices she adjusted were not responding to scarcity; they were responding to testimony. The Combine was not saying, "We cannot produce more." They were saying, "We will not admit we can produce more."

  Kaela took her red pen. Since the Combine reported a surplus at 420 credits (they claimed they could only sell 4,000, but demanded inputs for 5,000), the algorithm dictated a price decrease to stimulate demand elsewhere. She wrote *410* on the revision sheet. She was lowering the price of Cobalt because a manager wanted to hide his efficiency.

  She moved to the second stage. The Smelter in the Industrial Zone. Their return slip was thicker, accompanied by a memo from the State Credit Bureau.

  > **ENTERPRISE RETURN: CENTRAL SMELTER**
  > **COMMODITY:** Refined Cobalt
  > **INPUT PRICE:** 420 Cr/T (Trial)
  > **DEMAND:** 4,000 Tons (Matches Combine Supply)
  > **COST OVERRUN:** 15%
  > **STATUS:** Losses covered by Credit Bureau Refinance Issue #902.
  > **NOTE:** Price signal ignored. Production schedule maintained regardless of input cost variance.

  The Smelter did not care that the price of Concentrate had risen in Cycle 43. In a market, a price rise would force them to economize, to scrap waste, to seek substitutes. Here, the Credit Bureau simply issued Refinance Issue #902. The loss was erased. The price signal had no teeth. It was a suggestion whispered to a deaf man.

  Kaela recorded the demand. The Smelter wanted exactly what the Combine claimed to supply. The numbers matched. The algorithm purred. Excess demand for this link in the chain was zero. She felt a fleeting spike of satisfaction, the clean click of a lock engaging, followed immediately by the cold dread of knowing what the lock was securing.

  She picked up the final return, from the Assembly Plant where the Cobalt became battery casings for the national transport grid. This was the third stage. The final use.

  The slip was standard, but tucked inside was a handwritten note on thin, grey paper, not part of the formal return. It was against protocol to accept unofficial correspondence, but Kaela read it.

  > *Foreman Visk to Iteration Tech:*
  > *The ingots from Cycle 43 arrived yesterday. Assay says 99% purity. Form checks out. But the metal is brittle. When we stamp the casings, every third one cracks in the press. We don't know why. The chemical breakdown is perfect. Maybe it's the moisture in the ore from Shaft 7 changing the crystal structure during smelting? The form doesn't have a box for "brittle." We are meeting the tonnage target, but the casings fail stress tests. We need more input to make up for the waste. Requesting 10% extra Concentrate.*

  Kaela held the grey note over the flame of her desk lamp until it curled into ash. She could not enter "brittleness" into the model. The model accepted quantities and prices. It did not accept metallurgy. It did not accept the sound of a winding drum groaning before it snapped, or the humidity in a mine shaft that wasn't deep enough to register on the barometric sensors but wet enough to ruin the chemistry.

  If she entered the request for extra input, the model would show excess demand for Cobalt. The algorithm would raise the price. The Combine would see the higher price and perhaps report even lower capacity to avoid the scrutiny of high-value output. The Smelter would ignore the price hike and request more credit. The Plant would crack more casings.

  She looked at the Revision Table.

  | COMMODITY | CYCLE 44 PRICE | EXCESS DEMAND | CYCLE 45 TRIAL |
  | :--- | :--- | :--- | :--- |
  | Cobalt Conc. | 420.00 | -50.00 | 410.00 |
  | Refined Cobalt | 850.00 | 0.00 | 850.00 |
  | Battery Casing | 120.00 | 0.00 | 120.00 |

  The numbers were converging. The excess demand column was shrinking toward zero. The vector was stabilizing. She was solving the equation.

  She thought about the casings. The Plan would authorize the production of exactly enough Cobalt to make exactly enough casings to meet the transport quota. The math would be perfect. The trucks would be built. They would roll off the line. And when they turned the first corner, the battery mounts would shear, and the trucks would stop.

  But that was outside the room. Inside the room, the balance was closing.

  Kaela took the master stamp. It was heavy, cold steel. She dipped it in the red ink pad. She pressed it onto the Final Equilibrium Sheet. *APPROVED FOR IMPLEMENTATION.*

  The pneumatic tubes hissed, sucking the approved prices back out into the economy. The enterprises would receive their targets. They would meet them, because the targets were based on what they said they could do, not what they actually could do. The Credit Bureau would print the money to cover the inefficiencies. The trucks would be built with brittle casings.

  Her supervisor entered the room, a man who never looked at the forms, only the summary graph on the wall. The graph showed the line of excess demand dipping smoothly to the x-axis.

  "Excellent work, Kaela," he said, tracing the flat line with a finger. "Convergence in forty-four cycles. A record. The economy is balanced."

  "Yes," Kaela said. She watched the line on the graph. It was perfectly straight. It was a horizon line where nothing grew.

  "The algorithm works," he said.

  "The algorithm works," she repeated.

  He left. Kaela sat alone with the hum of the engines. She picked up the next stack of blank forms. There was another commodity to balance tomorrow. Steel, perhaps. Or wheat. It didn't matter. The prices would settle. The reports would lie. The world would continue to be something else, something messy and wet and brittle, while the paper world remained perfectly, catastrophically straight.

  She slid the next card into the tube. *Steel, Rebar, Grade 5.* Price: 100 Credits.

  She waited for the lies to return.

  ***

  # Craft Notes

  **Mechanism 1: Testimony instead of scarcity.**
  This appears in the first return slip from the Northern Extraction Combine. The device used is the internal monologue of Kaela contrasting the reported capacity (4,000 tons) with her knowledge of the geological surveys and the incentive structure ("If the Combine reported a capacity of 5,000 tons... next cycle's target would be 5,000 plus a growth factor"). The form itself shows the discrepancy between requested inputs and reported output, dramatizing the strategic understatement without explicit exposition.

  **Mechanism 2: Prices with no teeth.**
  This is dramatized through the Central Smelter's return slip and the accompanying memo from the State Credit Bureau. The device is the bureaucratic annotation "Losses covered by Credit Bureau Refinance Issue #902" and the note "Price signal ignored." By showing the administrative erasure of the loss immediately following the price signal, the story demonstrates the soft budget constraint without requiring a theoretical explanation.

  **Mechanism 3: The uncoded particular.**
  This appears in the handwritten note from Foreman Visk regarding the brittle ingots. The device is the physical intrusion of unofficial paper ("grey paper, not part of the formal return") containing qualitative data ("moisture," "brittle," "cracks") that the formal system cannot process ("The form doesn't have a box for 'brittle'"). Kaela burning the note symbolizes the system's necessary rejection of local knowledge to maintain mathematical consistency.

  **Endorsement and Assessment.**
  The story endorses the Austrian critique of market socialism, specifically Hayek's knowledge problem and Mises's calculation argument. It argues that even if a Walrasian auctioneer could mathematically converge on equilibrium prices, those prices would be meaningless because the inputs (reports) are strategically distorted and the local knowledge required for actual production cannot be codified into the statistical returns.

  I believe this verdict is earned by the fiction because the failure is not depicted as malice or incompetence, but as a structural inevitability of the procedure itself. The "catastrophe" is the perfect balance of false numbers. However, I suspect I loaded the dice against the planners by making the managers' lying (Mechanism 1) universal and undetectable. In a real system, some auditing might catch capacity hoarding, though the story argues that the *incentive* to lie is inherent to the planning relationship, making the auditing itself part of the cost that distorts the calculation.
