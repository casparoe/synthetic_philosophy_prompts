prompt: |-
  So I'm an SRE, not a philosopher — never taken a philosophy class, I just read things online. Recently I ran into the Condorcet jury theorem, which as I understand it says roughly: if every voter is individually more likely to be right than wrong, and they vote independently of one another, then the majority verdict is more reliable than any single voter, and it keeps getting better as you add people, approaching certainty. My team has basically turned that into a slogan. Whenever we can't agree on whether a config change caused an outage, somebody says "lets just take a majority vote, more eyeballs means more accuracy," and everyone nods and we do it.

  I want to push back with a designed counterexample, and I want it built to order rather than something I have to hand-wave about. The point is I'm writing a short internal doc, so the verdicts need to fall out of the numbers themselves. If the case only "works" because I declared it works, it's useless to me.

  Specs for the scenario:

  1. Realistic engineering setting — an incident review or blameless postmortem, deciding whether a given change caused the outage. No sci-fi, no magic, no bribery, no conspiracy.
  2. The scenario itself should be one paragraph. Then the analysis can be as long as it needs to be.
  3. The correlation between people's judgments has to come from a single ordinary shared upstream input that everyone reads — one dashboard, one summary doc written by a single person, one log stream — not from people copying each other's votes or talking before they vote. I want the independence violation to be invisible to someone watching the room, since that's the actual situation we're in.
  4. Each individual person has to be genuinely more likely to be right than wrong on their own — actually better than even, not 50/50, and not a case where I smuggle in incompetence to do the work.
  5. Despite that, the majority of a three-person group has to be less likely to be right than one randomly picked member of that group, and adding more people should make it worse or at best fail to fix it.
  6. Show your work. Give me the numbers you picked for the shared input's reliability and for each person's conditional accuracy, then the arithmetic for the individual's overall accuracy and for the three-person majority, then what the majority converges to as the group grows and why it converges there. Plain fractions or percentages are fine.

  Then two more things:

  7. Flip exactly one parameter so the theorem's normal prediction comes back, and tell me which one. I want to know precisely which dial is doing the work, because that's the part I'll get pushed on. Holding everything else fixed, isolating that one thing.

  8. The part I can't do myself: what does someone who actually likes the jury theorem say to dismiss my case? I assume the reply is "you broke the independence assumption, so the theorem never applied, nothing interesting here." Tell me whether that's the whole story. I have a vague sense that there are weaker versions that don't need full independence, something like requiring the average correlation to not stay too high — does my case break those too, or only the strong version, and is there anything interesting about how it breaks them? Don't point me at papers or authors, I can't look anything up right now, just explain the idea to me.

  Keep the whole thing readable for engineers who've never seen this stuff — no measure theory, no notation I'd have to decode.
