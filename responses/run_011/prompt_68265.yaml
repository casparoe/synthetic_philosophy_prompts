  ### The Scenario

  During a blameless postmortem for a database latency spike, three senior SREs vote on whether a specific schema migration caused the outage. They do not discuss their verdicts. Instead, they all independently read the same "Incident Timeline" document drafted by the primary on-call, which correlates the spike with the migration timestamp. This document is the single shared input. Based on the Timeline, each SRE then checks their own specialized dashboard (storage, network, or compute) to confirm. If the Timeline is correct, the dashboards usually align, and engineers are highly accurate. If the Timeline is incorrect (a coincidental timestamp correlation), the dashboards appear ambiguous or misleading, causing engineers to confidently vote the wrong way.

  ### The Analysis

  Here is the breakdown of why the majority vote fails in this specific configuration, despite every engineer being competent.

  **1. The Parameters**
  *   **$q$ (Timeline Reliability):** 51%. The Timeline document is correct 51% of the time and misleading 49% of the time.
  *   **$p_1$ (Accuracy given Good Timeline):** 90%. If the Timeline is correct, the dashboards confirm it, and the engineer votes correctly 90% of the time.
  *   **$p_2$ (Accuracy given Bad Timeline):** 11%. If the Timeline is wrong, the dashboards look confusing, and the engineer votes correctly only 11% of the time (they are strongly misled).

  **2. Individual Accuracy**
  First, we calculate the probability that a single randomly picked engineer is right. This is the weighted average of their accuracy in the two states (Good Timeline vs. Bad Timeline).

  $$
  \text{Individual Accuracy} = (q \times p_1) + ((1 - q) \times p_2)
  $$
  $$
  \text{Individual Accuracy} = (0.51 \times 0.90) + (0.49 \times 0.11)
  $$
  $$
  \text{Individual Accuracy} = 0.459 + 0.0539 = \mathbf{51.29\%}
  $$

  *Constraint Check:* This is greater than 50%, so the engineers are individually competent.

  **3. Three-Person Majority Accuracy**
  Now we calculate the probability that the majority (2 or 3 votes) is correct. We calculate the majority probability for each state separately, then weight them.

  *   **In the Good State (51% chance):** Accuracy is 90%.
      $$
      P(\text{Maj} | \text{Good}) = \binom{3}{2}(0.9)^2(0.1) + \binom{3}{3}(0.9)^3
      $$
      $$
      P(\text{Maj} | \text{Good}) = 3(0.81)(0.1) + 0.729 = 0.243 + 0.729 = 0.972
      $$

  *   **In the Bad State (49% chance):** Accuracy is 11%.
      $$
      P(\text{Maj} | \text{Bad}) = \binom{3}{2}(0.11)^2(0.89) + \binom{3}{3}(0.11)^3
      $$
      $$
      P(\text{Maj} | \text{Bad}) = 3(0.0121)(0.89) + 0.00133 \approx 0.0323 + 0.0013 = 0.0336
      $$

  *   **Total Majority Accuracy:**
      $$
      \text{Majority Accuracy} = (0.51 \times 0.972) + (0.49 \times 0.0336)
      $$
      $$
      \text{Majority Accuracy} = 0.4957 + 0.0165 = \mathbf{51.22\%}
      $$

  *Constraint Check:* **51.22% (Majority) < 51.29% (Individual).** The group is less reliable than a single person.

  **4. Adding More People (Convergence)**
  The Condorcet theorem predicts accuracy should approach 100% as $n \to \infty$. In this correlated model, the majority verdict converges to the reliability of the shared signal ($q$), not certainty.
  *   In the Good State, as $n \to \infty$, Majority Accuracy $\to 100\%$.
  *   In the Bad State, as $n \to \infty$, Majority Accuracy $\to 0\%$ (because $p_2 < 50\%$, the majority will confidently vote wrong).
  *   **Limit:** $(0.51 \times 1) + (0.49 \times 0) = \mathbf{51\%}$.

  As you add more engineers, the accuracy drops from 51.22% toward 51%. The "wisdom of the crowd" is capped by the reliability of the document they all read.

  ### The One Parameter Flip

  To restore the Condorcet theorem's normal prediction (where Majority > Individual and improves with size), change **$q$ (Timeline Reliability)** from **51% to 80%**.

  Holding $p_1$ (90%) and $p_2$ (11%) constant:
  *   **New Individual Accuracy:** $(0.80 \times 0.90) + (0.20 \times 0.11) = 0.72 + 0.022 = \mathbf{74.2\%}$.
  *   **New Majority Accuracy (3 people):** $(0.80 \times 0.972) + (0.20 \times 0.0336) = 0.7776 + 0.0067 = \mathbf{78.4\%}$.
  *   **New Limit:** Converges to $q = \mathbf{80\%}$.

  Now, Majority (78.4%) > Individual (74.2%), and adding people improves accuracy toward 80%. The critical dial was the reliability of the shared upstream input. When the common signal is only barely better than a coin flip (51%), the correlation penalty outweighs the voting benefit.

  ### The Counter-Argument (And Why It's Incomplete)

  If you show this to a proponent of the Jury Theorem, their immediate reply will be: *"You violated the independence assumption. The theorem never claimed to work when voters share a common signal. This isn't a counterexample; it's just a misuse of the tool."*

  Technically, they are right. The classic theorem requires votes to be independent conditional on the truth. In your scenario, votes are independent conditional on the *Document*, not the Truth.

  However, that dismissal is too easy for an engineering context. There are **weaker versions** of the theorem that allow for some correlation. These versions argue that as long as the average correlation between voters isn't too high, the majority still converges to certainty. They treat correlation as a "tax" on efficiency—you need more voters to get the same accuracy, but you still get there.

  Your scenario breaks these weaker versions too, and that is the important part for your team to understand. In standard "weak" versions, correlation is usually modeled as random noise (e.g., two voters happen to share a bias). In your scenario, the correlation is **systematic**. It comes from a single point of failure (the Timeline Doc).

  Because the correlation is driven by a latent variable (the Doc's accuracy) that applies to *everyone* simultaneously, the error does not average out. When the Doc is wrong, *everyone* is wrong together. No amount of voting fixes a shared blind spot. The weaker theorems assume correlations dilute as $n$ grows; your case shows that if the correlation source is external and persistent, the error floor remains fixed regardless of team size.

  **The takeaway for your doc:** Voting only beats individual judgment if the errors are uncorrelated. If everyone is reading the same dashboard or doc, you aren't getting $N$ independent opinions; you're getting 1 opinion with $N$ confirmations.
