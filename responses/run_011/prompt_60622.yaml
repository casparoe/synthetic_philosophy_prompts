  1. **The case**
  Maria requests emergency housing aid. Six months ago, a flood destroyed her rental. State guidance estimated recovery would take three months and advised residents to pause employment to manage repairs, noting only paid work counted toward eligibility. Maria followed this, suspending her job. Recovery took six months. She now lacks income and housing. The office offers aid conditional on immediate work program enrollment. Maria cannot enroll while finishing repairs. She requests unconditional aid citing the state's erroneous timeline. The caseworker cites rules requiring current paid employment. Maria has not gambled, committed fraud, or refused work without cause.

  2. **Spec check**
  *   One paragraph, ~120 words: The case is a single block of 119 words describing a standard office interaction without narrative flourish or emotional language.
  *   Realistic setting: No sci-fi or trolleys; just a flood, a benefits office, and administrative rules in welfare contexts.
  *   Character constraints: Explicitly states she hasn't gambled, committed fraud, or refused work without cause to avoid moralizing levers.
  *   Load-bearing detail: The core conflict turns on her reliance on erroneous state guidance regarding timeline and eligibility.
  *   No smuggled verdicts: Adjectives are neutral; "erroneous" describes the guidance accuracy, not treatment or character.

  3. **What each theory says**
  Luck Egalitarianism: (1) Distributive justice neutralizes unchosen disadvantages (brute luck) but respects chosen outcomes (option luck). (2) Maria chose to pause work knowing eligibility rules required paid employment. (3) Reliance on uncertain state guidance constitutes a calculated risk, converting the flood's brute luck into a timing gamble. (4) The state owes no compensation for bad option luck, even if odds were skewed, provided no coercion existed. (5) Therefore, the standard conditional offer suffices; she bears the cost of her miscalculation. Premise 3 does the work: it classifies reliance as a voluntary gamble rather than coercion, blocking the claim. The state set odds, but she took the bet. This distinction maintains the boundary between responsibility and compensation.

  Democratic Equality: (1) Justice requires eliminating oppressive social relationships, not just tracking luck sources. (2) Conditional aid subjects citizens to bureaucratic discretion, stigma, and potential domination. (3) The state created the risk environment via erroneous guidance, making her vulnerability state-authored. (4) Leaving her unsupported entrenches a status hierarchy caused by state error, violating equal standing. (5) Therefore, aid must be unconditional to restore equal civic standing. Premise 2 does the work: conditionality itself creates hierarchy. Premise 3 reinforces this by adding state fault. The conditionality reinforces subordination.

  4. **Load-bearing feature**
  The detail is reliance on erroneous state guidance. If deleted, Maria pauses work without official advice. Luck Egalitarianism still says no: it remains private option luck. Anderson still says yes: conditionality violates status regardless of state error. The split survives deletion. The detail intensifies the moral stakes but doesn't generate the theoretical divergence. The divergence comes from conditionality itself. I am telling you plainly: this detail makes the Luck Egalitarian verdict harder to defend, but it does not create the split. The theories diverge on the work requirement alone. This limits the case's utility for isolating the guidance variable.

  5. **How the loser attacks**
  The luck egalitarian can argue that reliance on authoritative state guidance negates voluntariness. If the state publishes official timelines, citizens aren't gambling; they are coordinating with public infrastructure. This reclassifies the disadvantage as brute luck (state error) rather than option luck (private miscalculation). Consequently, compensation is owed.

  Is this a fix? It preserves the core principle (compensate brute luck) while acknowledging state authority shapes voluntariness. However, it risks collapsing the option/brute distinction whenever the state speaks. If every piece of advice creates a claim, the theory loses its bite on responsibility. It is a genuine fix only if limited to formal, published eligibility criteria, not casual guidance. Otherwise, it swallows the rule.

  6. **Confidence**
  I am confident the split is real; Anderson's opposition to conditionality is structural, while Luck Egalitarianism hinges on the choice classification. Least certain is whether Luck Egalitarianism would truly hold the line on state-authored odds. Some proponents might concede this is brute luck, collapsing the split. If they do, the case fails.
