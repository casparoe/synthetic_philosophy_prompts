prompt: |-
  I'm teaching a seminar session on distributive justice and I want to hand my students a case that's been engineered rather than one they've already met a hundred times. So: build me a thought experiment to spec, and then show me the engineering actually holds up.

  The spec. One claimant, one ordinary benefits office. Two named theories have to come out in opposite directions on the same facts: luck egalitarianism (the Dworkin/Cohen line — compensate bad brute luck, don't compensate the upshot of choices the agent could have avoided) says the state owes her nothing beyond the standard conditional offer on the table; Anderson's democratic equality says the support has to be unconditional and that the work requirement attached to it is itself the injustice. Constraints:

  - the scenario is one paragraph, realistic welfare-office setting. no trolleys, no sci-fi, no billionaires
  - she is not lazy, not committing fraud, and not a gambler. those are always the levers and I'm sick of them
  - the load-bearing detail I want you to use is this: her disadvantage came from a choice she made in reliance on published state guidance about how long the situation would last, and the guidance was wildly wrong. the program she relied on counted only paid work toward eligibilty. so there's option luck sitting on top of brute luck, and the odds were set by the state itself
  - don't smuggle the verdicts into the wording. no "humiliating," no "heroic," no editorializing adjectives about her character. if the theories only come out the way I want because of how she's described, the case fails

  Then give me the answer in these sections, in this order:

  1. **The case** — the paragraph, ~120 words.
  2. **Spec check** — a bullet per constraint above, one line each on how the case meets it. ~120 words.
  3. **What each theory says** — the luck egalitarian reasoning and the Andersonian reasoning, spelled out premise by premise rather than asserted. I want to see which premise in each one does the actual work. ~250 words.
  4. **Load-bearing feature** — name the single detail that produces the split, then say what each theory says if you delete it. if deleting it changes nothing, say so plainly; that means the case isn't doing what I asked. ~120 words.
  5. **How the loser attacks** — the best reply available to a luck egalitarian who wants to absorb this case without abandoning the view (reclassifying her luck as brute, adding a floor underneath, denying that state-authored odds make a choice non-voluntary, whatever), and whether that reply is a genuine fix or a dodge. ~150 words.
  6. **Confidence** — how sure you are the split is real and not an artifact of your phrasing, plus the single point you're least sure about. ~60 words.

  American English, please. And be straight with me in section 4 — if you think one side wins too easily here, or if the guidance detail is doing less work than I'm assuming, tell me instead of quietly rigging it in my favor.
