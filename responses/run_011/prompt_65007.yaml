answer: |-
  Your intuition is correct: your classmate is committing a category error by conflating distinct epistemic mechanisms under a single slogan. The phrase "the wisdom of crowds" (WoC) is a "bucket term" that collects statistically rigorous results, empirical generalizations, and normative hopes. In the context of sortition, it is often used to bridge the gap between *descriptive representation* (the body looks like the people) and *epistemic performance* (the body decides like experts).

  Here is the disambiguation you requested, ordered from the most mathematically secure but politically thin to the most politically ambitious but epistemically fragile.

  ### Part 1: A Menu of Theses on "The Wisdom of Crowds"

  **1. The Variance-Reduction Thesis (The Statistical Truism)**
  *   **Claim:** If $N$ individuals make independent estimates of a fixed quantity, and their errors are uncorrelated with mean zero, the error of the average decreases as $1/N$.
  *   **Presuppositions:** There is a single true value (e.g., ox weight); errors are random noise, not systematic bias; estimates are independent.
  *   **Status:** Mathematically true (Law of Large Numbers).
  *   **Licenses Classmate?** **No.** This requires large $N$ and strict independence. It is destroyed by deliberation (which correlates errors) and small sample sizes (like a 50-person assembly).

  **2. The Diversity Prediction Thesis (The Hong & Page Result)**
  *   **Claim:** Collective error = Average individual error − Prediction diversity. A diverse group of problem-solvers can outperform a group of high-ability but homogenous solvers.
  *   **Presuppositions:** "Diversity" is defined mathematically (different heuristics/perspectives); the problem is complex but solvable; there is an objective metric for "better."
  *   **Status:** Mathematically valid theorem, but its application to politics is contested (is policy a "problem" with a solution?).
  *   **Licenses Classmate?** **Partially.** This is the favorite tool of sortition theorists (e.g., Hélène Landemore). However, it still requires the group to be *diverse enough*. If self-selection filters out specific cognitive styles, the diversity term shrinks, and the result fails.

  **3. The Comparative Competence Thesis (The Empirical Generalization)**
  *   **Claim:** In specific domains (prediction markets, factual estimation), aggregated non-experts outperform individual named experts.
  *   **Presuppositions:** The domain allows for feedback loops or has a ground truth; "expert" overconfidence is a significant factor.
  *   **Status:** Empirically supported in narrow domains (e.g., guessing jellybeans, election forecasting), not in normative domains (e.g., "should we raise taxes?").
  *   **Licenses Classmate?** **No.** This is a claim about *aggregation* (markets/polls), not *deliberation*. It also does not claim the crowd is *right*, only that it is *less wrong than the expert*.

  **4. The Condorcet Jury Thesis (The Probability Tracker)**
  *   **Claim:** If each voter has a probability $p > 0.5$ of choosing the "correct" option, and votes independently, the probability that the majority chooses correctly approaches 1 as $N$ increases.
  *   **Presuppositions:** There is a "correct" option (epistemic realism); voters are better than chance; votes are independent.
  *   **Status:** Mathematically valid, but premises are fragile in politics. If $p < 0.5$ (systematic bias), the crowd becomes confidently wrong.
  *   **Licenses Classmate?** **No.** Deliberation violates the independence assumption. Small $N$ (e.g., 50) means the probability does not approach 1 as tightly as in mass elections.

  **5. The Deliberative Correction Thesis (The Process Claim)**
  *   **Claim:** Deliberation improves individual competence ($p$) by pooling private information and correcting individual biases, potentially outweighing the loss of independence.
  *   **Presuppositions:** Facilitators can prevent groupthink; experts provide neutral facts; participants are open to updating beliefs.
  *   **Status:** Contested empirical claim. Some studies show belief polarization; others show increased knowledge. It is distinct from standard WoC (which forbids talk).
  *   **Licenses Classmate?** **Maybe.** This is the actual defense of citizens' assemblies, *not* the Galton's Ox defense. Your classmate cited the wrong model for this mechanism.

  **6. The Strong Epistemic Claim (The Normative Realist)**
  *   **Claim:** A sortition body will identify the *common good* or the *right policy* on contested value questions, superior to elected bodies.
  *   **Presuppositions:** "The common good" is an objective truth discoverable by reason; sortition guarantees the necessary cognitive diversity; values can be treated like facts.
  *   **Status:** Philosophically fragile. In pluralist societies, policy questions often involve trade-offs between incommensurable values, not "truths" to be found.
  *   **Licenses Classmate?** **Yes, but it's undefended.** This is what your classmate *wants* to be true, but invoking Galton's Ox does not prove it.

  **7. The Normative/Legitimacy Thesis (The Political Metaphor)**
  *   **Claim:** "Wisdom" is not about truth-tracking but about *standing*. Decisions are "wise" because they are made by people who bear the consequences, ensuring acceptance and stability.
  *   **Presuppositions:** Legitimacy derives from inclusion rather than correctness.
  *   **Status:** Defensible political theory, but it concedes the competence objection. It says, "They might not be smarter, but it's their right to decide."
  *   **Licenses Classmate?** **No.** Your classmate made an *epistemic* claim ("they will be right"), not a *legitimacy* claim ("it doesn't matter if they are right").

  ---

  ### Part 2: Residue Report on the Belgian Case

  You raised three specific objections. Here is how they interact with the viable theses above.

  **1. Small Size (N is small, e.g., 50–100)**
  *   **Breaks:** **Thesis 1 (Variance)** and **Thesis 4 (Condorcet).** Both rely on the Law of Large Numbers. With $N=50$, the convergence on truth is weak. If the average bias is non-zero, a small crowd amplifies error rather than canceling it.
  *   **Leaves Intact:** **Thesis 2 (Diversity).** A small group can be cognitively diverse. **Thesis 5 (Deliberation).** Quality of talk matters more than quantity of heads.
  *   **Verdict:** The "Galton's Ox" analogy (Thesis 1) is mathematically dead here. You cannot invoke statistical aggregation to defend a sample size of 50.

  **2. Sustained Expert-Guided Deliberation**
  *   **Breaks:** **Thesis 1 (Variance)** and **Thesis 3 (Comparative).** Standard WoC (Surowiecki) explicitly warns *against* deliberation because it creates correlation in errors (herding, social pressure). If everyone hears the same expert and talks to each other, their errors become systematic, not random.
  *   **Leaves Intact:** **Thesis 5 (Deliberative Correction).** This thesis *requires* deliberation. It argues that the gain in individual competence ($p$) from learning outweighs the loss of independence.
  *   **Verdict:** Your classmate cited Galton (independent guesses) to defend a Deliberative Assembly (dependent guesses). These are opposing models. If the defense is deliberation, the "Wisdom of Crowds" slogan is the wrong label; it should be "Democratic Reason" or "Deliberative Competence."

  **3. Self-Selection Among Invitees**
  *   **Breaks:** **Thesis 2 (Diversity)** and **Thesis 4 (Condorcet).** If those who accept invitations differ systematically from those who decline (e.g., higher education, more political interest, more free time), the sample is biased. In Condorcet terms, if the self-selected group has $p < 0.5$ on certain issues due to shared blind spots, the majority will be wrong.
  *   **Leaves Intact:** **Thesis 7 (Legitimacy).** Even if self-selected, they are still "citizens," not "elites."
  *   **Verdict:** This is the strongest empirical objection. Sortition relies on the *randomness* of the draw to guarantee diversity. If the *acceptance* is not random, the statistical guarantees of Thesis 2 and 4 evaporate. Stratified sampling and quotas are used to fix this, but they admit that pure lot is insufficient.

  **Does any reading survive all three?**
  Only **Thesis 5 (Deliberative Correction)** combined with **Thesis 7 (Legitimacy)** survives.
  *   *Argument:* "The group is small and self-selected, *but* the deliberative process raises their competence ($p$) high enough, and their status as citizens grants legitimacy."
  *   *Caveat:* This abandons the "Wisdom of Crowds" (statistical aggregation) argument entirely. It shifts the burden to proving that facilitation and expert briefings actually work without inducing elite capture or groupthink.

  ---

  ### Part 3: The Literature and the Equivocation

  You asked what sortition scholars mean and where the equivocation lies.

  **What Scholars Mean:**
  Serious theorists of sortition (e.g., Hélène Landemore, David Estlund, John Gastil) rarely rely on the simple "Galton's Ox" version of WoC. They know that deliberation violates independence. Instead, they rely on **Thesis 2 (Diversity Trumps Ability)** and **Thesis 5 (Deliberative Correction)**.
  *   They argue that elected bodies are *homogenous* (lawyers, careerists), leading to blind spots.
  *   They argue that a sortition body, even if small, captures a wider range of *cognitive heuristics* (life experiences).
  *   They argue that deliberation allows these heuristics to be applied to the problem, solving it better than a homogenous expert group.

  **Where the Equivocation Lies:**
  The slogan slides between two distinct claims:
  1.  **The Aggregate Claim:** "The average of many independent guesses is accurate." (This is what your classmate cited).
  2.  **The Representative Claim:** "A microcosm of the people, deliberating, will reason better than an elite." (This is what the Belgian model attempts).

  The equivocation allows proponents to borrow the mathematical rigor of Claim 1 (which feels scientific and decisive) to bolster Claim 2 (which is sociological and contingent).
  *   **Claim 1** handles the "competence" objection by saying "math says noise cancels out."
  *   **Claim 2** handles the "deliberation" objection by saying "talk improves understanding."
  *   **The Problem:** You cannot have both. If you deliberate, noise does *not* cancel out (errors correlate). If you rely on noise cancellation, you must not deliberate.

  Your classmate is using the mathematical authority of Claim 1 to shield Claim 2 from your competence objections. When you pointed out that they deliberate (violating Claim 1's conditions), he should have switched to defending Claim 2. Instead, he insisted Claim 1 was still in operation.

  ### Final Verdict

  **Your classmate's use of the slogan does not hold up.**

  It was a rhetorical move that sounded decisive but was conceptually incoherent. He invoked a statistical theorem (Galton/Condorcet) that explicitly requires **independence** and **large numbers** to dismiss objections based on **dependence** (deliberation) and **small numbers** (assembly size).

  *   **Was it false?** Not exactly "false," but **misapplied**. The "Wisdom of Crowds" in the Surowiecki/Galton sense *does not apply* to citizens' assemblies.
  *   **Did it answer your objection?** No. Your objection (that deliberation and small size create systematic error rather than cancelling random error) is precisely why the Galton model is insufficient for sortition.
  *   **What should you say?** "The Galton model relies on independent errors cancelling out. Deliberation makes errors correlated. If you want to defend the assembly, you must argue that deliberation *improves individual competence* (Thesis 5), not that it *averages out noise* (Thesis 1). Those are different mechanisms with different failure modes."

  The slogan, in his mouth, was doing no work other than signaling "pro-democracy." It obscured the actual trade-off: we accept sortition not because the crowd is statistically guaranteed to be right (it isn't), but because it is *differently* competent (diverse heuristics) and *legitimate* (inclusive). Conflating these weakens the defense against competence objections.
