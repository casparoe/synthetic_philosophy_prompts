answer: |-
  I recommend the committee vote to accept both the Superintendent's personal papers and the Institutional Ledgers, allocate the expiring digitization grant to stabilize and image both collections, and approve a name-indexing project that publishes identifications only with attached confidence levels and direct links to the source images.

  **Reasoning and Policy Alignment**
  Our collections policy requires us to accept material of "enduring value" and describe holdings "fully and accurately." Accepting only one collection violates the accuracy clause. The diaries alone present the County Home as a benevolent institution managed by a thoughtful man; the ledgers alone present it as a farm economy that consumed human lives. Neither is accurate without the other. The tension between the Superintendent's narrative voice and the ledger's cold arithmetic is the actual historical record. If we reject the ledgers, we validate the Superintendent's view that the residents were secondary to his administration. If we reject the diaries, we lose the context required to understand why the ledgers were kept the way they were.

  **The Case for the Index (and the Risk)**
  The argument for the searchable index is not just about genealogy; it is about corrective description. For the descendants' group, the ledgers are not accounting clutter; they are the only proof their ancestors existed in county records. To shelve them is to repeat the erasure enacted by the institution itself. The genealogist's proposal to cross-match initials with burial registers is the only viable method to restore agency to people who were recorded only as expenses.

  However, the concern that the index will become the primary source is valid. If we publish "John Doe" next to an initial "J.D." without qualification, we create a fact where there is only a probability. To mitigate this, the index must be built as a *finding aid*, not a roster. Every name must carry a metadata tag: "Confirmed," "Probable," or "Possible," linked directly to the digitized ledger line and the external document (obituary, death certificate) used to make the match. Researchers must be forced to see the gap between the initial and the name. This satisfies the genealogist's goal without violating our duty to accuracy.

  **Resource Allocation**
  With 0.2 FTE and a grant expiring in June, we cannot process both collections to full archival standards. We must prioritize stabilization and digitization over detailed cataloging. The grant should cover scanning the ledgers (which are brittle) and the diaries. The indexing work will require volunteer labor coordinated by the genealogist, but under the constraint that no name is published without the confidence metric described above. This keeps the project within budget while meeting the descendants' request that the ledgers not be "quietly shelved."

  **The Torn Pages**
  Regarding the run of pages removed in the 1970s: we do not attempt to reconstruct them, nor do we discard the remaining ledgers because they are incomplete. The gap is part of the record's provenance. It documents a moment when community shame outweighed archival integrity. We will note the physical absence in the finding aid ("Pages 44–50 removed circa 1970s") and include a note explaining that the removal was deliberate. We owe researchers an explanation of the *gap*, not the *content*. Speculating on what was hidden would be fiction; documenting that something was hidden is history.

  **Vote and Timeline**
  I propose we hold the vote at our meeting on Tuesday, March 14. If approved, digitization contracts must be signed by April 1 to meet the June grant deadline. The index prototype should be ready for committee review by May 1 to ensure the confidence-level metadata is working before public release.

  **Future Collection Rule**
  For future acquisitions involving institutional power dynamics (schools, hospitals, prisons, homes), we apply the **Voice and Silence Test**:
  1.  Who speaks in this record, and who is spoken about?
  2.  Does accepting this collection amplify the powerful voice or recover the silent one?
  3.  If we accept only one side of that dynamic, does our description become inaccurate?
  If the answer to #3 is yes, we must acquire both sides or neither.
