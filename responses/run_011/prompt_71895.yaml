answer: |-
  **MEMORANDUM**

  **TO:** Grants Committee, Trethewey Foundation
  **FROM:** External Member
  **DATE:** 12 March
  **SUBJECT:** Allocation of £4.5m Award Round

  **Interpretation of the Deed**
  The Deed of Trust (1978) imposes two distinct constraints. The first directs us to secure the greatest good for the greatest number across time. The second forbids discounting interests merely due to temporal distance. These clauses are often conflated. The first establishes our maximand: total welfare, regardless of when it occurs. The second prohibits *pure time preference*—valuing a life less simply because it is lived in 2200 rather than 2024. It does not, however, prohibit *epistemic discounting*. We are not obliged to treat a speculative estimate about the future as equal to a robust measurement of the present. To do so would not honour future persons; it would gamble their interests on uncalibrated guesses. Trustee 3's concern that discounting based on the remoteness of estimates breaches the Deed is mistaken; uncertainty is not time.

  **The Proposals and the Standing Rule**
  *Long Horizon* offers a massive expected value but rests on an uncalibrated probability chain. *Lead Remediation* offers certain, evidenced benefits on a smaller scale. A trustee proposes a standing rule ignoring probabilities below one in 10,000. This must be rejected. It is internally inconsistent, given our approval of seismic works at one in 25,000. Furthermore, it creates perverse incentives: applicants will round probabilities to 9,999 to clear the threshold. It is a blunt instrument that ignores the quality of evidence.

  Instead, I propose a rule of **Evidentiary Tiering**: claims exceeding a specific expected-value threshold must rest on calibrated probabilities or peer-reviewed consensus, not internal defensibility. Where evidence is uncalibrated, the claim must be treated as uncertainty rather than risk, and weighed against concrete, evidenced harms. This allows a non-specialist trustee to apply a consistent standard: is the probability derived from a trackable process, or is it a model output defended only by its author?

  **Addressing Objections**
  Two objections merit attention. First, that *Lead Remediation* also relies on long chains of consequence (healthier children leading to better institutions). This conflates *extrapolation* with *construction*. Lead's benefits are immediate and measured; long-term social gains are secondary bonuses. *Long Horizon* offers no immediate good; its entire value lies in a speculative chain preventing a hypothetical catastrophe. Second, that rewarding large numbers incentivizes wild claims. This is valid. If we accept uncalibrated magnitudes, we invite applicants to inflate stakes to infinity. We must require that the magnitude of the claim be matched by the rigour of the evidence.

  **Recommendation**
  I recommend a single award of **£3.9m to Lead Remediation**, to be disbursed immediately. The remaining £0.6m should be carried to the spring round. *Long Horizon* should not be funded. This is not a split; it is a prioritization of evidenced welfare over speculative expectation. *Lead Remediation* is scalable, but funding it at less than full capacity forfeits known health benefits without securing the *Long Horizon* project, which requires £2.8m minimum and dissolves if deferred. To divide the fund would be to partially fund a project we deem epistemically unsound while underfunding one we know works.

  **The Case for Long Horizon**
  The strongest consideration favouring *Long Horizon*, which I reject, rests on the sheer magnitude of the stakes. If the Deed requires us to maximize welfare across the remotest future, and if a civilizational collapse forfeits 10^15 lives, then even a minute probability of prevention dominates any finite present benefit. To ignore this is to gamble with the entirety of human potential. If there is a one in 50,000 chance of saving billions of future lives, the expected value is mathematically overwhelming. To prioritize 2,600 premature deaths averted today over billions of lives potentially lost tomorrow appears to violate the instruction not to discount the future. If the probability figure is even remotely accurate, funding *Lead Remediation* instead of *Long Horizon* is morally negligent. It privileges the visible suffering of the few over the existential security of the many, treating the future as less real than the present despite the Deed's explicit command to treat them equally.

  **Contested Premises and Procedure**
  My recommendation depends on three contested premises. First, that uncalibrated estimates cannot function as probabilities for grant-making. If a majority rejects this and accepts the consortium's economist's figure as valid, the expected value calculation dictates funding *Long Horizon*. In that event, the committee should award £4.5m to *Long Horizon* immediately.

  Second, that the value of the future turns on the number of people it contains (total utilitarianism). If the committee rejects this, preferring a view where future lives do not aggregate to outweigh present suffering, *Lead Remediation* wins outright.

  Third, that the Deed permits epistemic discounting. If the committee decides that any uncertainty regarding the future constitutes forbidden time discounting, we are compelled to fund the highest expected value regardless of evidence quality.

  Should a majority reject my premise on evidence quality, I urge the committee to adopt the Evidentiary Tiering rule proposed above for future rounds, even if this round's decision is overturned. We cannot establish a precedent where defensibility substitutes for calibration.

  **Conclusion**
  We are guardians of a permanent endowment. Permanence requires prudence. Prudence dictates that we relieve certain suffering now rather than betting on unverified models of salvation later. I urge the committee to approve *Lead Remediation*.
