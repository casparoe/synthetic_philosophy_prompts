prompt: |-
  Act as a philosopher of history who has also had to write annotation guidelines for a real project — that combination matters, because I need something operational, not a survey.

  Some context so you know what the standard is *for*. I run a volunteer annotation scheme for a crowdsourced reference platform. Readers flag statements in our history articles as disputed, and volunteers apply a guideline to decide whether a claim counts as settled, contested, or unfounded. The volunteers have no archive access, no languages, no training. Right now the guideline is one sentence and it's Rankean by default — basically, is it supported by documents — and it is failing badly on exactly the cases we care about.

  Three of them, which I want you to treat as the test battery for any standard you write:

  1. A demographic reconstruction. A death toll given as a range, back-projected from censuses and ration registers produced by the administration whose policies the deaths are being attributed to. The numbers are the best anyone will ever have, and the source is also a party to the dispute.
  2. An explanatory claim, not a factual one: that grain requisition policy was the principal cause of the famine, as against weather, or wartime dislocation, or the deliberate choice to export. Every individual document behind it is uncontested. The claim is still fought over.
  3. A statement that is true and checkable and functions as apologetics — literacy rates doubled, industrial output tripled — because of what sits around it and what the article never mentions.

  So: think carefully, and before writing the list, spend a few lines brainstorming candidate requirements and then cut the ones you don't think are real. Then give me the spec — what a standard of historical objectivity has to deliver to be adequate to that job. For each requirement: what it demands, the case or consideration behind it, and whether it's non-negotiable or just the taste of a particular camp. Flag anything you think is a prejudice masquerading as a criterion (my suspicion: the demand that the standard be statable without evaluative vocabulary).

  Two things I especially want:

  - Any subset of the requirements you believe cannot be jointly satisfied. If the list is impossible, that's a result, and I'd rather hear it than get a harmonious spec. In particular, whether "answerable to the evidence" can survive both the fact that the archive is interested and the fact that my volunteers can never check it themselves — I suspect an adequate standard has to be about procedures and division of epistemic labour rather than about evidence, and I want to know if you agree.
  - Which single requirement does the most work eliminating candidates.

  Also say whether the standard you write is itself objective by its own lights. If it isn't, say what that costs.

  Finish with a short paragraph each on how a Rankean documentary standard, Carr's interaction-between-historian-and-facts picture, and White's emplottment view do against the list — including whether White can keep the distinction he clearly wants between a history and a novel. Keep that part brief, the requirements are the deliverable. A table is fine for the list. No bibliography, I'll find my own reading.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher of history + experienced annotation guideline writer. (Needs to be theoretically grounded *and* operationally viable).
      *   **Context:** Crowdsourced reference platform. Volunteers flag disputed claims. Volunteers have *no* archive access, *no* language skills, *no* training. Current guideline is one sentence ("is it supported by documents?" - Rankean) and failing.
      *   **Test Battery (The 3 Hard Cases):**
          1.  *Demographic Reconstruction:* Death toll range, back-projected from admin sources (party to dispute), best available numbers.
          2.  *Explanatory Claim:* Cause of famine (policy vs. weather/war/export). Individual docs uncontested, causal synthesis contested.
          3.  *True but Apologetic:* Literacy/industrial stats are true, but function as propaganda due to omission/context.
      *   **Deliverables:**
          1.  Brainstorming candidate requirements (then cutting).
          2.  The Spec (Table format preferred): Requirement, Demand, Rationale/Case, Status (Non-negotiable vs. Taste).
          3.  Flag prejudices (specifically the "no evaluative vocabulary" constraint).
          4.  Identify incompatible requirements (if any).
          5.  Identify the single most eliminative requirement.
          6.  Self-reflection: Is the standard itself objective? What's the cost if not?
          7.  Brief critique of Ranke, Carr, and White against the list (including White's history/novel distinction).
      *   **Tone:** Operational, rigorous, honest about limitations, not a survey.

  2.  **Brainstorming Candidate Requirements:**
      *   *Idea 1: Documentary Verification.* (Current standard). Fails Case 1 (sources are biased) and Case 2 (explanation isn't a document). *Cut.*
      *   *Idea 2: Consensus of Experts.* Volunteers can't check archives, so they must check secondary literature. *Keep, but refine.*
      *   *Idea 3: Methodological Transparency.* Can the method be reproduced? Good for Case 1. *Keep.*
      *   *Idea 4: Counterfactual Robustness.* Would the claim hold if X changed? Good for Case 2 (causality). *Maybe too complex for volunteers.*
      *   *Idea 5: Contextual Completeness.* Does the statement omit crucial context? Good for Case 3. *Keep.*
      *   *Idea 6: Value-Neutrality.* "No evaluative vocabulary." User suspects this is a prejudice. *Cut/Flag.*
      *   *Idea 7: Falsifiability.* Can it be proven wrong? *Keep.*
      *   *Idea 8: Epistemic Division of Labor.* Volunteers judge the *state of the debate*, not the *truth*. *Crucial.*

      *Refining for the Volunteer Constraint:* The volunteers cannot verify evidence. They must verify *process* and *consensus*. The standard cannot be "Is this true?" It must be "Is this claim sustained by the relevant community according to recognized procedures?"

  3.  **Developing the Spec (The Requirements):**
      *   *Req 1: Procedural Legitimacy over Documentary Proof.* (Addresses Case 1). The source matters less than the method used to derive the number.
      *   *Req 2: Explanatory Pluralism Acknowledgement.* (Addresses Case 2). Causal claims must acknowledge competing causal factors even if one is privileged.
      *   *Req 3: Contextual Non-Misleadingness.* (Addresses Case 3). Truthful stats cannot be presented in a way that implies a false narrative.
      *   *Req 4: Consensus Tracking.* Volunteers check if experts agree, not if the fact is "real."

      *Wait, I need to check for incompatibilities.*
      *   Can we demand "Consensus" when the field is polarized? (Case 2). If there is no consensus, the claim is "Contested," not "Unfounded." The standard needs to classify *status*, not dictate *truth*.
      *   Can we demand "No Evaluative Vocabulary" while assessing "Apologetics" (Case 3)? No. Assessing function requires evaluating intent/effect.
      *   *Incompatibility:* "Strict Empiricism" vs. "Narrative Function." You can't have a standard that only looks at atomic facts *and* catches misleading omissions. The standard must shift from "Fact-Checking" to "Claim-Assessment."

      *The "Single Most Eliminative Requirement":* It's likely the shift from "Verify Evidence" to "Verify Consensus/Procedure." This kills the Rankean approach immediately.

  4.  **Drafting the Content - Section by Section:**

      *   **Brainstorming & Cutting:** Be explicit about why "Documentary Proof" is cut (Volunteers can't do it, sources are biased). Be explicit about "Value Neutrality" (It's impossible for Case 3).
      *   **The Spec Table:** Needs columns: Requirement, Operational Demand, Rationale (linking to Cases 1-3), Status.
      *   **Incompatibilities:** Address the tension between "Objectivity as Neutrality" and "Objectivity as Procedure." Address the volunteer limitation (they judge the *map*, not the *territory*).
      *   **Self-Reflection:** Is *this* standard objective? It's procedural. It admits its own constructed nature. Cost: It relies on the authority of the "expert community," which is itself political.
      *   **Historiography Check:**
          *   Ranke: Fails Case 1 & 3.
          *   Carr: Better on Case 2 (selection of facts), but relies on historian's intuition (volunteers can't do that).
          *   White: Good on Case 3 (emplotment), but risks collapsing history into fiction. Needs to maintain the "archival constraint."

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I initially thought about asking volunteers to read secondary sources. But the prompt says "no training." They can't evaluate historiography deeply. They need heuristics.
      *   *Adjustment:* The guideline must tell them to look for *markers* of consensus (e.g., "Is this claim cited in multiple independent surveys?" "Does the article acknowledge the counter-argument?").
      *   *Crucial Insight:* The standard isn't about the *history*; it's about the *article's representation of the history*. The volunteers are auditing the *wiki*, not the *past*. This solves the "no archive access" problem.
      *   *Wait, re-reading prompt:* "Readers flag statements... volunteers apply a guideline to decide whether a claim counts as settled, contested, or unfounded." Okay, they are judging the *claim's status*, not just the article text. But without archive access, they *must* judge the claim's status based on its presentation and citation ecosystem.
      *   *Refined Insight:* The standard must be about *Epistemic Status*, not *Ontological Truth*.

  6.  **Finalizing the Requirements:**
      1.  **Methodological Explicitness:** (Case 1). Is the derivation of the number explained?
      2.  **Causal Modesty:** (Case 2). Does the claim allow for multi-causality?
      3.  **Narrative Integrity:** (Case 3). Does the fact serve a misleading narrative function?
      4.  **Community Endorsement:** (General). Is the claim supported by a plurality of independent authorities?

      *Wait, Requirement 3 is hard for volunteers.* How do they know it's apologetics? They need a heuristic. "Does the claim appear primarily in sources associated with the defending regime?" Or "Is the contrast class omitted?" Let's go with "Contrast Class Inclusion."

      *Incompatibility:* "Community Endorsement" vs. "Narrative Integrity." Sometimes the community is silent on the narrative framing (Case 3). The standard might force a "Contested" label where experts think it's "Settled" but poorly framed. I need to highlight this tension.

      *The "Prejudice":* The demand for "Non-Evaluative Vocabulary." To catch Case 3, you *must* use words like "misleading," "context," "function."

  7.  **Writing the Response:** (Adhering to constraints: No bibliography, brief historiography section, table for spec).

      *   *Tone Check:* Philosophical but operational. No fluff.
      *   *Check:* Did I answer the "Is the standard itself objective?" question? Yes, need to be honest there. It's a procedural objectivity.

  8.  **Final Polish:** Ensure the distinction between "Settled, Contested, Unfounded" is clear in the requirements. Ensure the White/Carr/Ranke section is brief but hits the "history vs novel" point for White.

  *(Self-Correction on the "Volunteer" constraint)*: I need to make sure the requirements are actually actionable by someone without a PhD. "Methodological Explicitness" is easy (is there a footnote explaining the math?). "Community Endorsement" is harder (do they check Google Scholar?). I will frame it as "Citation Ecosystem" – are the sources diverse?

  Let's assemble.

  *   **Brainstorming:** Cut "Correspondence to Reality" (impossible for volunteers). Cut "Value-Free Language" (prejudice). Keep "Procedural Robustness."
  *   **Spec:** Focus on *how* the claim is built and supported, not *what* it says.
  *   **Incompatibility:** "Procedural Rigor" vs. "Consensus." Sometimes rigorous methods yield minority views.
  *   **Most Eliminative:** The shift from "Evidence" to "Consensus/Procedure."
  *   **Objectivity of Standard:** It is intersubjective, not absolute.
  *   **Historiography:** Ranke (fails), Carr (partial), White (risky).

  Let's write it.cw
answer: |-
  ### Brainstorming and Culling

  To build a standard for volunteers who cannot check archives, we must abandon the idea that they are verifying *facts*. They are verifying *claims about the status of facts*. This shifts the ontology from the past to the present state of historical discourse.

  **Candidate Requirements:**
  1.  *Documentary Verification:* (Cut). Volunteers lack access; Case 1 shows documents can be party to the dispute.
  2.  *Value-Neutral Language:* (Cut). This is the prejudice you suspected. To identify Case 3 (apologetics), one must evaluate *function*, which requires normative vocabulary (e.g., "misleading," "omission"). A standard that forbids this blinds itself to propaganda.
  3.  *Correspondence to Reality:* (Cut). Volunteers cannot access reality, only texts.
  4.  *Methodological Transparency:* (Keep). Volunteers can check if the *process* of deriving a claim is visible.
  5.  *Consensus Tracking:* (Keep). Volunteers can check if a claim is isolated or supported by multiple independent authorities.
  6.  *Narrative Contextualization:* (Keep). Volunteers can check if a fact is presented in isolation or with necessary contrast.

  **The Prejudice:** The demand that the standard be statable without evaluative vocabulary is a positivist hangover. It assumes "facts" exist independently of their deployment. Case 3 proves that a true fact can do false work. If the guideline forbids volunteers from judging the *work* the fact does, it cannot flag apologetics.

  ***

  ### The Spec: Operational Standard for Epistemic Status

  This standard defines objectivity not as a mirror of the past, but as a robust procedure for managing disagreement in the present. It is designed for auditors who judge the *claim*, not the *event*.

  | Requirement | Operational Demand (Volunteer Instruction) | Rationale (Test Case) | Status |
  | :--- | :--- | :--- | :--- |
  | **1. Procedural Legibility** | The claim must cite a method of derivation, not just a source. If a number is reconstructed, the margin of error and the adjustment for bias must be stated. | **Case 1:** A death toll from party archives is only valid if the annotation acknowledges the back-projection method and the source's conflict of interest. | **Non-Negotiable** |
  | **2. Causal Pluralism** | Explanatory claims must acknowledge at least one competing causal factor, even if dismissed. A claim of "principal cause" is "Contested" if it presents a single cause as exclusive without noting alternatives. | **Case 2:** Documents don't prove causation. A claim that policy *alone* caused famine is methodologically unsound regardless of document veracity. | **Non-Negotiable** |
  | **3. Contrast Class Inclusion** | Statistical claims must include the baseline or counterfactual context necessary to interpret the magnitude. A growth rate without a starting baseline or comparative region is "Misleading/Contested." | **Case 3:** "Output tripled" is true but apologetic if it omits that it started at zero or lagged behind peers. Truth requires context. | **Non-Negotiable** |
  | **4. Citation Ecosystem Diversity** | A claim is "Settled" only if supported by sources independent of the administrative body involved. Reliance on a single ecosystem (e.g., only state archives or only exile press) defaults to "Contested." | **Case 1 & 4:** Prevents capture by interested parties. Objectivity is distributed across the network of sources, not located in one document. | **Negotiable** (Taste: Skeptical) |
  | **5. Consensus Tracking** | Volunteers must check if the claim reflects the current majority view in secondary surveys. If major surveys disagree, the claim is "Contested" even if primary documents exist. | **All Cases:** Since volunteers can't check archives, they must audit the *state of the field*. | **Non-Negotiable** |

  ***

  ### Incompatibilities and Constraints

  **1. The Impossibility of Joint Satisfaction:**
  There is a tension between **Requirement 1 (Procedural Legibility)** and **Requirement 5 (Consensus Tracking)**.
  *   *The Conflict:* Sometimes a methodologically rigorous claim (Req 1) is a minority view in the field (Req 5). For example, a new demographic reconstruction might be methodologically superior but not yet accepted by the majority of historians.
  *   *The Result:* The standard forces you to label rigorous minority views as "Contested." This is a feature, not a bug, for a reference platform. You are mapping the *debate*, not adjudicating the *truth*. However, it means "Settled" does not mean "True"; it means "Currently Unchallenged by Peers."

  **2. Evidence vs. Procedure:**
  You asked if "answerable to the evidence" can survive the volunteer constraint. **It cannot.**
  *   *Reasoning:* Volunteers cannot see the evidence. Therefore, the standard *must* be about the division of epistemic labor. The volunteers are not checking the bricks; they are checking the architect's credentials and the building permits.
  *   *Agreement:* An adequate standard here is purely procedural. It treats "evidence" as a social claim made by historians, not a physical object to be inspected. If you try to make it about evidence, you fail Case 1 (biased archives) and Case 2 (causal synthesis).

  **3. The Single Most Eliminative Requirement:**
  **Requirement 2 (Causal Pluralism).**
  *   *Why:* This kills the Rankean default immediately. Rankean history assumes documents speak for themselves. Case 2 shows that documents do not speak to *causality*. Demanding that causal claims acknowledge alternatives eliminates the vast majority of popular history writing and political propaganda, which rely on monocausal explanations. It forces the "Contested" flag on almost all explanatory claims, which is historically accurate but operationally expensive.

  ***

  ### Self-Reflection: Is This Standard Objective?

  **No.** This standard is not objective in the sense of being outside history. It is **procedurally intersubjective**.
  *   *Cost:* It relies on the authority of the "expert community" (Req 5) and the norm of "pluralism" (Req 2). These are liberal-democratic historiographical values, not universal truths. A Marxist or a Positivist might reject Req 2 (viewing causality as structural or determinable).
  *   *The Trade-off:* By admitting this, we avoid the pretense of neutrality that fails Case 3. We are not defining Truth; we are defining *Due Process* for historical claims. The cost is that the standard itself is a historical artifact of a specific epistemic culture (academic history circa 2024). It cannot claim to stand outside the disputes it adjudicates.

  ***

  ### Historiographical Stress Test

  **Ranke (Documentary Standard):**
  *   *Performance:* Fails.
  *   *Why:* Ranke asks, "Is it in the document?" Case 1 shows the document is the problem. Case 2 shows the document doesn't contain the explanation. Case 3 shows the document can be true but misleading. A Rankean guideline forces volunteers to mark apologetic statistics as "Settled" because they are documentarily sound. It is operationally useless for your platform.

  **Carr (Interaction of Historian and Facts):**
  *   *Performance:* Partial Success.
  *   *Why:* Carr understands that facts are selected. This helps with Case 3 (context). However, Carr relies on the "historian's intuition" to select the right facts. Your volunteers lack this training. Carr's model is too dependent on the individual scholar's judgment to be codified into a volunteer checklist without becoming arbitrary.

  **White (Emplotment):**
  *   *Performance:* High Risk.
  *   *Why:* White correctly identifies that Case 3 is about narrative structure (emplotment), not fact. However, White struggles to maintain the distinction between history and novel. If volunteers apply a Whitean standard, they may flag claims as "Contested" simply because they dislike the narrative tone.
  *   *The Distinction:* White can keep the distinction only if he admits the *archive constrains the plot*. Your standard enforces this via **Requirement 1 (Procedural Legibility)**. Without the archival constraint, White's view turns annotation into literary criticism. With Req 1, it remains history.
