answer: |-
  Here is a reconstruction of the presuppositions underpinning the state canonization of defeat, structured around your five inquiries and concluding with the consequentialist counterfactual.

  ### 1. The Theory of Political Value: Constitution vs. Consequence

  The practice does not presuppose that the worth of collective action is *independent* of consequences. Rather, it presupposes a hierarchy of consequences. It distinguishes between *instrumental* consequences (territory gained, enemies defeated, objectives secured) and *constitutive* consequences (the forging of the group itself).

  To place a loss above a win is to assert that the polity is constituted not by what it acquires, but by what it endures. The theory of value here is existential, not transactional. A victory proves the state is competent; a canonized defeat proves the state is *real*. The willingness to suffer is treated as the ultimate proof of sovereignty, because only a sovereign entity can sacrifice itself. If the value were truly independent of consequences, any loss would suffice. But as your examples show, only specific losses count. This implies the value is tied to a specific consequence: the solidification of group identity.

  **Load-bearing examples:** The **ANZAC** case is critical here. If the value were purely about honor in the abstract, the date of the withdrawal (the successful operation) would be equally potent. The fact that the landing (the beginning of the slaughter) is chosen indicates that the *commitment to the fight* is valued over the *management of the fight*. **Masada** is also load-bearing: it represents the extreme end of this spectrum, where the preservation of the group's ideological purity is valued over the biological survival of its members.

  ### 2. Distinguishing Presuppositions from Compatible Readings

  You ask what the practice *could not survive losing*. We must distinguish between what the ceremonies *do* (cohesion, legitimation) and what they must *claim to be true* to function.

  *   **Durkheimian Cohesion:** This is compatible but not necessary. A ceremony could produce cohesion without canonizing defeat (e.g., a harvest festival). The practice survives without this, provided the identity claim holds.
  *   **Legitimation Device:** This is also compatible. States use these days to legitimize current power. However, if the audience perceives the legitimation as cynical, the ritual weakens but may persist as habit.
  *   **Expressivism:** If the practice were purely expressivist (asserting nothing about value), it would be indistinguishable from art. It is not. It makes a truth claim about the past.

  **The Discriminating Feature:** The practice cannot survive the admission of **futility**.
  The observable feature that discriminates the necessary presupposition from the compatible readings is the rhetoric of **sacrifice** versus **waste**.
  *   *Sacrifice* implies a recipient and a purpose (even if metaphysical).
  *   *Waste* implies nothing.
  If the speeches, inscriptions, or catechisms shift from "they gave their lives for..." to "they died because of a mistake," the ritual collapses.
  **Load-bearing example:** The **Confederate memory industry** demonstrates this fragility. It survived as long as the narrative was "defense of homeland/heritage" (sacrifice). It became untenable when the narrative shifted to "defense of slavery" (which reframes the sacrifice as moral waste). The removal of monuments correlates not with the loss of the war, but with the loss of the *moral cover* for the loss.

  ### 3. Reconciling Bureaucracy and Ritual

  The tension you identify is between the state as a **manager of safety** (consequentialist) and the state as a **guardian of meaning** (deontological).

  The reconciliation lies in a division of moral labor. The modern state demands consequentialism from its *institutions* (the military command, the treasury) but deontology from its *citizens*.
  *   **The Commander:** Is judged by the professional code. To send troops to die for a gesture is malpractice.
  *   **The Soldier/Citizen:** Is judged by the civic code. To be unwilling to die for the group is treason (or cowardice).

  The ritual honors the moment where the citizen's duty overrides the commander's prudence. It does not honor the *decision* to fight (which the historian may critique); it honors the *fact* of the fighting. This allows the state to maintain a professional military that tries to win, while maintaining a national myth that says winning isn't the only thing that matters.

  **Load-bearing example:** **ANZAC** again. Military historians (representing the professional/consequentialist view) call the withdrawal the only success. The public holiday (representing the civic/ritual view) marks the landing. The state holds both views simultaneously without cognitive dissonance because they occupy different spheres: the sphere of *operations* (win) and the sphere of *identity* (endure).

  ### 4. Selectivity, Innocence, and Victimhood

  Your observation here is the most damaging to the "honor in loss" theory. If worth were truly independent of outcomes, a defeat caused by incompetence should be as honorable as one caused by overwhelming odds. It is not. We do not commemorate disasters traceable to our own stupidity.

  This means the practice does not presuppose the independence of worth from outcomes. It presupposes the **moral asymmetry of the conflict**. The loss must be legible as martyrdom, not mismanagement.
  *   **Martyrdom:** We were righteous; they were strong. (Honorable)
  *   **Mismanagement:** We were incompetent; they were capable. (Shameful)

  This shifts the theoretical ground from *courage* to *innocence*. The polity is constituted by what it has suffered *unjustly*. The defeat serves as evidence of the polity's virtue (we fought despite the odds) and the world's hostility.
  **Load-bearing example:** **Serbia (Kosovo)**. The battle was inconclusive militarily, but the legend solidified around the idea of choosing the "heavenly kingdom" over the earthly one, and being betrayed or overwhelmed by a superior force (the Ottomans). If the Serbian army had lost due to a general's drunkenness, the myth would not have survived six centuries. The **Confederate** example also bears weight here: the "Lost Cause" relied heavily on the narrative of being overwhelmed by Northern industrial might, obscuring the strategic errors of the Confederate command.

  ### 5. Critiquing the Epistemic Immunity Hypothesis

  Your hypothesis is that defeat enjoys immunity because the counterfactual world (where the cause succeeded) was never instantiated, and thus cannot be critiqued.

  **The Attack:**
  This is partially correct but misses the active work the memory performs. Victory memorials *also* enjoy immunity, but of a different kind (the "victor writes history" immunity). The specific immunity of the *defeat* memorial is not just that the world wasn't made, but that the *intention* remains uncorrupted by *governance*.

  However, your hypothesis fails to account for the **omitted counterfactual**. You ask if the practice is epistemic (protecting a claim from refutation). It is, but it protects a claim about *character*, not *outcome*.
  *   If the Confederacy had won, it would have had to build a state. That state would have had economies, laws, and failures. It would be subject to consequentialist judgment.
  *   By losing, the Confederacy remained an idea.

  But the crucial flaw in your hypothesis is the claim that *only* defeats enjoy this. **Israel's Masada** is the counter-example. It is a defeat, yes, but it is commemorated alongside victory narratives (Independence Day). The immunity isn't about the impossibility of the cause; it's about the **finality of the sacrifice**. A victory opens a future that can disappoint; a death closes the book.

  The practice is not merely epistemic; it is **aesthetic**. It freezes the polity in a moment of maximum intensity. To succeed is to enter the mundane realm of administration. To die is to remain in the realm of myth. The omitted counterfactual (what if we won?) is not omitted because it is refutable, but because it is *banal*. A successful Masada would have been a Jewish fortress administering tax collection. A fallen Masada is a symbol of freedom.

  ### 6. The Consequentialist Memorial Calendar

  If the presupposed view were replaced by a frankly consequentialist one, the function of the memorial would shift from **Identity Formation** to **Asset Management**.

  **What would change:**
  The calendar would cease to commemorate the *willingness to spend life* and begin to commemorate the *efficiency of preserving it* or the *utility of the outcome*.

  **What would be struck:**
  1.  **ANZAC Day (April 25):** Struck. It marks the start of a failed campaign.
      *   *Replacement:* **The Evacuation (December 20).** This marks the successful extraction of forces. It honors the competence of the command and the preservation of human capital.
  2.  **Masada Commemorations:** Struck. Mass suicide is the ultimate negative utility.
      *   *Replacement:* **The Bar Kokhba Revolt (initial victories).** Or, more likely, the founding of the modern state itself, framed purely as a successful security outcome.
  3.  **Kosovo Day (Serbia):** Struck. An inconclusive battle that led to centuries of foreign rule.
      *   *Replacement:* **The day of liberation (1918).** The restoration of sovereignty.
  4.  **Confederate Memorial Days:** Struck. The outcome was negative for the state (destruction) and the stated cause (slavery) was economically and morally inefficient.
      *   *Replacement:* There would be none, unless framed as "Reconstruction Day" (the restoration of the Union).

  **What would be added:**
  1.  **Treaty Signings:** Days marking the end of hostilities through negotiation (e.g., the Armistice, not the battle).
  2.  **Demobilization Days:** Honoring the return of labor to the economy.
  3.  **Near-Miss Days:** Commemorating wars that *did not happen* due to successful deterrence or diplomacy. (e.g., The resolution of the Cuban Missile Crisis).

  **The Result:**
  A consequentialist calendar would look like a board report. It would highlight risk mitigation, successful exits, and strategic gains. It would lack the emotional resonance of the current calendar because it would treat the citizen as a **resource** to be conserved, rather than a **believer** to be tested.

  **Load-bearing vs. Illustrative:**
  *   **Load-bearing:** **ANZAC** is the strongest case for the shift. The historical record explicitly identifies a "better" day (withdrawal) that is ignored by the ritual. This proves the ritual is not tracking military success. **Confederate Memory** is load-bearing for the "Innocence" argument; when the moral cover was stripped, the monuments became indefensible.
  *   **Illustrative:** **Dunkirk** is illustrative of the "successful loss," but because it is British, it overlaps with the ANZAC dynamic. **Masada** is illustrative of the extreme limit (death over survival), but because it is ancient/religious, it is less about the modern state's bureaucratic tension than the ANZAC example.

  **Conclusion:**
  The canonization of defeat presupposes that the state is a moral entity before it is a functional one. It requires the loss to be innocent (victimhood), the sacrifice to be purposeful (not waste), and the memory to freeze the moment of commitment before the corruption of outcome. A consequentialist state would not mourn its dead; it would audit them.
