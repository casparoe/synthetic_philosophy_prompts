      *   *Tone Check:* Is it too academic? Keep it sharp. The user is a journalist; they want clear arguments.
      *   *Addressing the "Load-Bearing" constraint:* I need to be explicit about this in the text. I will integrate it into the analysis of each point.
      *   *Refining the "Innocence" point:* This is strong. A state cannot memorialize its own stupidity. It must memorialize its martyrdom.
      *   *Refining the "Commander vs. Commanded":* The distinction is between *technical rationality* (war as tool) and *existential rationality* (war as being).

  5.  **Final Polish:** (Self-Correction during drafting)
