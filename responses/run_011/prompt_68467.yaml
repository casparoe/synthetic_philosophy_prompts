  2.  **Deconstruct the Examples:**
      *   *ANZAC (Australia/NZ):* Gallipoli (landing vs. withdrawal). Load-bearing: Shows preference for the *start* of the sacrifice over the *success* of the operation.
      *   *Dunkirk (UK):* Evacuation/Concession. Load-bearing: Shows preference for survival/continuity over territorial victory.
      *   *Kosovo (Serbia):* 1389 battle (inconclusive/loss). Load-bearing: Shows myth-making over time, religious/national fusion.
      *   *Masada (Israel):* Suicide fortress. Load-bearing: Extreme case of honor over survival (though note the user mentions archaeological disputes).
      *   *Confederate Memory (US):* Post-Reconstruction monuments. Load-bearing: Shows timing (loss of power -> solidification of memory) and the "Lost Cause" narrative.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the paradox. States are usually defined by sovereignty and power, yet they anchor identity in powerlessness.

      *   **1. Theory of Political Value:**
          *   Is it anti-consequentialist? Yes, but not purely. It's not that consequences *don't* matter, but that *constitutive* consequences matter more than *instrumental* ones.
          *   The polity is defined by the *boundary* of the community, often drawn in blood.
          *   Key distinction: *Achievement* (winning) vs. *Endurance* (surviving the loss).
          *   *Load-bearing:* ANZAC and Masada. They show the moment of commitment matters more than the result.
          *   *Thesis:* The value isn't independence from consequences, but a shift from *external* consequences (territory gained) to *internal* consequences (identity forged).

      *   **2. Distinguishing Presuppositions (The "Survival Test"):**
          *   *Durkheimian (Cohesion):* Compatible, but not necessary. You could have cohesion without defeat.
          *   *Legitimation:* Compatible.
          *   *Expressivist:* If it asserts *nothing* about value, it's empty. The practice *must* assert value.
          *   *The Killer:* If the ceremony admitted the loss was *pointless* or *immoral*, the practice dies. It requires the loss to be *meaningful*.
          *   *Observable Feature:* The rhetoric of "sacrifice" (implying a recipient/benefit) vs. "waste" (implying nothing). If the speech says "they died for nothing," the ritual collapses.
          *   *Load-bearing:* Confederate memory. If it admitted the cause was slavery (moral loss) rather than states' rights (abstract loss), the ritual loses legitimacy (historically observed in the removal of monuments).

      *   **3. Reconciling Bureaucracy and Ritual:**
          *   Modern state = Manager of safety. Ritual state = Guardian of meaning.
          *   The split: *Professional* duty (save lives/win) vs. *Citizen* duty (be willing to lose).
          *   It's not that judgment applies only to commanders. It's that the *soldier's* virtue is obedience/sacrifice, while the *state's* virtue is prudence.
          *   The ritual freezes the moment where prudence ended and sacrifice began.
          *   *Load-bearing:* ANZAC (military historians admit withdrawal was better, but ritual honors landing). This highlights the tension.

      *   **4. Selectivity and Innocence:**
          *   Crucial point. We don't memorialize Stalingrad for the Germans, or the Bombing of Dresden as a national founding (in Germany).
          *   The defeat must be *noble*, not *negligent*.
          *   This shifts the theory from "Honor in Loss" to "Honor in *Unjust* Loss."
          *   Victimhood is a prerequisite. The loss proves the world was against us, or our virtue was too high for this world.
          *   *Load-bearing:* Serbia (Kosovo) and Confederacy. Both rely on the narrative of being overwhelmed/aggrieved, not outmaneuvered by superior competence.

      *   **5. Critiquing the User's Hypothesis (The Epistemic Immunity):**
