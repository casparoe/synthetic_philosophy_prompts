          *   The real immunity isn't that the world wasn't made, but that the *moral claim* wasn't tested by governance.
          *   However, the user is right about the *omitted counterfactual*. We never ask "What if the Confederacy won?" because that world is morally repugnant.
          *   Is it epistemic? Yes, it protects the *purity* of the intention from the *corruption* of execution.
          *   *Load-bearing:* Masada. If they had won, they would have had to govern. Dying kept the ideal pure.

      *   **6. The Consequentialist Calendar:**
          *   What changes?
          *   Out: Gallipoli (failed campaign), Masada (suicide), Kosovo (loss).
          *   In: Dunkirk (successful evacuation - saving the army), Treaty signings (peace), Demobilization days.
          *   Focus: Preservation of capital (human/financial), strategic success.
          *   *Load-bearing:* ANZAC (switch from Landing Day to Withdrawal Day). This is the clearest switch.
          *   *Result:* The calendar becomes a ledger of asset management, not a liturgy of identity.

  4.  **Review and Refine:**
