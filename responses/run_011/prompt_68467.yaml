          3.  Reconcile the tension between modern bureaucratic consequentialism (cost-effectiveness, military duty) and ritual honor for hopeless gestures.
          4.  Address selectivity (only "innocent" defeats, not self-inflicted incompetence). Does this imply victimhood rather than honor?
