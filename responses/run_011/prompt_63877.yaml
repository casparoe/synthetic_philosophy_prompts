answer: |-
  # Joint Statement on Conditionals: Adversarial Collaboration

  **1. Agreed Claims**
  1.  **Linguistic Data:** Any account must explain the "cheating card" case (divergent evidence licenses divergent assertions) and the "Oswald pair" (indicative sounds trivial, counterfactual sounds substantive).
  2.  **Probability:** For indicative conditionals, assertibility closely tracks conditional probability ($P(C|A)$). Both camps accept this correlation as a constraint, though they disagree on whether it is constitutive (Camp B) or derived (Camp A).
  3.  **Triviality Results:** We agree that standard truth-conditional accounts cannot coexist with the thesis that assertibility equals conditional probability without modification. Camp A accepts this limits the shape of truth conditions; Camp B accepts this limits the applicability of truth conditions.
  4.  **Semantics:** A semantics for conditionals must predict behavior under embedding (negation, disjunction, probability operators, indirect report). Both camps agree that indicative conditionals *can* be embedded, though felicity varies.
  5.  **Counterfactuals:** Both camps agree counterfactuals behave differently from indicatives regarding evidence sensitivity and temporal orientation, though we disagree on whether this is a difference in kind or degree.

  **2. Disagreements**

  | Disagreement (Neutral) | Camp A Formulation | Camp B Formulation | Substantive/Verbal | Settlement Condition |
  | :--- | :--- | :--- | :--- | :--- |
  | **Truth-Aptness** | Indicatives express truth-evaluable contents; mood marks presuppositions. | Indicatives express suppositional commitments; they are not truth-evaluable. | Substantive | Evidence of truth-value judgments in embedded contexts where probability is fixed. |
  | **Semantic Unity** | Indicatives and counterfactuals share a semantic core; differences are pragmatic. | Indicatives and counterfactuals are distinct logical animals; only counterfactuals are truth-apt. | Substantive | A unified logic that handles both without stipulating mood-specific rules. |
  | **Content Relativity** | Content is fixed by context but remains a proposition about the world. | Content is essentially relative to the speaker's evidence state. | Verbal/Substantive | Clarity on whether "content" refers to world-states or epistemic states. |

  **3. Cruxes and Pre-Registration**
  We identify three cruxes where empirical or logical resolution would force theoretical adjustment. Below are pre-registered predictions for vignettes designed to test these cruxes.

  *   **Crux 1: Temporal Stability (Vignette 1)**
      *   *Case:* Card drawn (Ace of Spades or Red). T1: Envelope sealed. You say, "If it's red, it's a heart." T2: Envelope opened (Ace of Spades). You repeat the sentence about the same draw.
      *   *Question:* Does acceptability survive the closure of the antecedent?
      *   **Camp A Prediction:** T1 Mean = 6.5. T2 Mean = 4.0. Shift = -2.5. (Truth remains, presupposition fails).
      *   **Camp B Prediction:** T1 Mean = 6.5. T2 Mean = 1.5. Shift = -5.0. (Antecedent known false renders it unassertible).
      *   *Falsification:* If T2 > 5.0, Camp B retreats. If T2 < 2.5, Camp A retreats.

  *   **Crux 2: Vacuous Satisfaction (Vignette 2)**
      *   *Case:* Defunct charity charter: "If applicant lived here 5 years, application approved." No such applicant ever existed.
      *   *Question:* Was the clause true, vacuously satisfied, or neither?
      *   **Camp A:** True (vacuously). The clause stated a condition on the world which was never violated.
      *   **Camp B:** Neither. The clause was a rule of inference, not a description; without a case to apply it to, it lacks truth value.
      *   *Settlement:* Intuition pumps regarding whether the charity "owed" money to a hypothetical applicant.

  *   **Crux 3: Evidence Relativity in Report (Vignette 3)**
      *   *Case:* Witness (knows light off) says "If light on, someone inside." Interpreter (doesn't know light off) reports this as an indicative conditional.
      *   *Question:* Is the report true/appropriate?
      *   **Camp A Prediction:** Report Appropriateness = 6.0. (Report captures witness's truth-conditional content).
      *   **Camp B Prediction:** Report Appropriateness = 3.0. (Report mismatches reporter's evidence state; should be counterfactual or qualified).
      *   *Falsification:* If Mean > 5.0, Camp B retreats. If Mean < 4.0, Camp A retreats.

  **4. Verbal Dispute and Suspect Terms**
  We acknowledge that part of the standoff dissolves if Camp A is allowed to define the content of an indicative as a "diagonal proposition" (a function from contexts to truth values) and Camp B accepts this as a formal model of assertibility rules.
  *   **Dissolves:** Whether conditionals have "contents." If content = diagonal, both agree they have context-dependent contents.
  *   **Does Not Dissolve:** Whether that content is *truth-apt* in the sense of corresponding to reality independent of the speaker's evidence. Camp A says yes; Camp B says no.
  *   **Suspect Terms:**
      *   *Proposition:* Camp A uses this to mean "truth-evaluable item." Camp B uses this to mean "mind-independent truth-bearer." Camp B denies indicatives have propositions in their sense; Camp A insists they do.
      *   *Truth-Apt:* Camp A means "can be assigned a truth value in a model." Camp B means "can be correctly asserted as describing the world."
      *   *Semantics:* Camp A means "truth conditions." Camp B means "laws of assertion."

  **5. Falsification Conditions**
  *   **Camp A:** We would abandon our view if it were demonstrated that indicatives cannot be embedded under negation without changing meaning (e.g., "It is not the case that if A, B" is never equivalent to "If A, not B"). Camp B would likely accept this as decisive, as it undermines the truth-conditional core.
  *   **Camp B:** We would abandon our view if a triviality-proof truth-conditional account were produced that preserves the Equation ($P(\text{If } A, B) = P(B|A)$). Camp A would accept this as decisive. Camp B notes, candidly, that Camp A might still resist by claiming the Equation is pragmatic, not semantic, so Camp B admits this might not fully settle the dispute.

  We sign this statement acknowledging that while we describe the data differently, we are looking at the same phenomenon.
