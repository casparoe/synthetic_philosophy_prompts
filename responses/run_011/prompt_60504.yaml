  **Entry Point**
  You accept science predicts brilliantly, yet brilliant theories like the four humours were eventually binned.

  **The Flowchart**

  **Node 1**
  Fresnel's aether equations still work, but the substance was scrapped. Do you think the math captured something real, or just organised the data?
  *   [Math real] → Go to Node 7
  *   [Math tool] → Go to Node 8

  **Node 2**
  Phlogiston vanished without a trace when oxygen arrived. Does this failure suggest all current invisible entities are equally doomed?
  *   [Equally doomed] → Go to Node 6
  *   [Not necessarily] → Go to Node 3

  **Node 3**
  Neptune was found on the end of a pen before anyone saw it. Does finding it prove the gravity theory was true, or just that the calculation trick worked?
  *   [Proves true] → Go to Node 10
  *   [Trick worked] → Go to Node 8

  **Node 4**
  Heat flows like water, but there is no caloric fluid. If the behavior matches, does the missing stuff matter for calling it true?
  *   [Stuff matters] → Go to Node 5
  *   [Doesn't matter] → Go to Node 8

  **Node 5**
  You can spray electrons onto a chip, but cannot see them. Does handling them make them real, or just useful?
  *   [Makes them real] → Go to Node 10
  *   [Just useful] → Go to Node 9

  **Node 6**
  Imagine a future scientist looking at our best theories. Will they say we were roughly right, or fundamentally mistaken like the humours doctors?
  *   [Roughly right] → Go to Node 10
  *   [Mistaken] → Go to Node 12

  **Node 7**
  When a theory changes, the equations often survive but the story changes. Do you trust the equations or the story?
  *   [Equations] → Go to Node 6
  *   [Story] → Go to Node 10

  **Node 8**
  Does it matter if the invisible parts are real, provided the visible outcomes are correct?
  *   [Matters] → Go to Node 5
  *   [Doesn't matter] → Go to Node 9

  **Node 9**
  When you reject truth, do you mean the theory is false, or that you simply refuse to judge it?
  *   [False] → Leaf: Instrumentalism
  *   [Refuse to judge] → Leaf: Constructive Empiricism

  **Node 10**
  When you say a theory is true, do you mean the whole picture is accurate, or just that the central objects exist?
  *   [Whole picture] → Go to Node 11
  *   [Central objects] → Go to Node 5

  **Node 11**
  Is the goal of science to describe the world, or to save yourself from being wrong?
  *   [Describe] → Leaf: Scientific Realism
  *   [Save from wrong] → Leaf: Selective Realism

  **Node 12**
  Is the question itself sensible, or just a verbal dispute about what 'true' means?
  *   [Sensible] → Leaf: Pessimistic Structuralism (Empty)
  *   [Verbal dispute] → Leaf: Quietism

  ***

  **The Leaves**

  **Scientific Realism**
  *   **Embarrassing Case:** The four humours (doctors were confident they described the body, now look silly).

  **Structural Realism**
  *   **Embarrassing Case:** Fresnel's aether (the structure survived, but what exactly was waving?).

  **Entity Realism**
  *   **Embarrassing Case:** Phlogiston (chemists could 'handle' it via reactions, yet it wasn't real).

  **Constructive Empiricism**
  *   **Embarrassing Case:** Neptune (why believe in it before seeing it if not for truth?).

  **Instrumentalism**
  *   **Embarrassing Case:** Quantum mechanics (too successful to be just a tool, too weird to be true).

  **Selective Realism**
  *   **Embarrassing Case:** Caloric (selected the wrong bit of the theory to keep).

  **Quietism**
  *   **Embarrassing Case:** Climate modelling (policy needs to know if it's true, not just useful).

  **Pessimistic Structuralism (Empty Leaf)**
  *   **Diagnosis:** Unattractive. If you think the mathematical structure will eventually be binned like the humours, there is little gain in calling it 'real' now.
  *   **Embarrassing Case:** Newtonian Gravity (the structure is still used, but we know it is fundamentally wrong).

  ***

  **Notes for the Editor**

  **Flagged Indistinguishable Leaves**
  **Structural Realism and Selective Realism.** The tree treats them as separate destinations (Node 7 vs Node 11), but in practice, both positions often converge on "trust the math, dump the story". The distinction is frequently more rhetorical than substantive; a reader landing on either leaf might find the other equally comfortable.

  **The Key Distinction Node**
  **Node 10** does the heavy lifting on your specific worry. It forces a choice between "the whole picture is accurate" (approximate truth) and "the central objects exist" (central posits are real). This prevents the collapse you experienced in your last draft, separating the truth of the theory's narrative from the reality of its entities.

  **Load-Bearing Extra Case**
  **Node 5 (Electrons/Manipulation).** This case is necessary to carve out **Entity Realism**. Without the option to believe in things solely because we can intervene with them (spray them), the flowchart would force all anti-realists into Instrumentalism or Empiricism. It allows a reader to be a realist about electrons but an anti-realist about the equations governing them, which is a common but hard-to-reach position in standard trees.
