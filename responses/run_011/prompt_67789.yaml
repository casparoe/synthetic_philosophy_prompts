prompt: |-
  Working on an essay for a philosophy-of-law reading group and I want someone to tell me where it breaks before I read it out. Don't give me a bibliography or a reading list — I just want to know if the argument holds and whether it's worth finishing.

  ---

  Draft:

  Start from something that looks like a curiosity and turns out to be load-bearing. Statutes sometimes contain a clause telling the court how to read them: a rules-of-construction section saying the Act is to be construed liberally so as to advance the purposes laid out up front. The UK Human Rights Act goes further, requiring that legislation "so far as it is possible to do so" be read compatibly with Convention rights — which courts have taken as licence to depart from what the words would naturally bear. So the legislature sometimes writes an interpretive method into the law itself.

  Textualism handles this easily, maybe too easily. The clause is text; its public meaning at enactment is what it is; so the textualist obeys it. Textualism isn't refuted by a statute that orders it to be purposivist — it just reports that the law enacted here happens to include an instruction to go consult purposes. Nothing gets conceded. The method is still fixed by meaning rather than by purpose; the purpose only enters because the meaning said to let it in.

  Purposivism handles the mirror case much worse. Suppose Congress writes the opposite clause instead: this Act shall be construed according to the ordinary meaning of its terms, and no purpose, policy or legislative history shall be considered. Now the purposivist is told by the law to stop being a purposivist. She can't just comply, because complying is precisely what defeats her method's rationale — if the ordinary meaning frustrates what the statute was for across a range of cases, a method that treats purpose as authoritative can't treat that clause as conclusive. So she has to say the clause is a rule adopted for a reason, and rules adopted for a reason get construed so they don't defeat it. But that is her method declining to follow a directive that her own method counts as law.

  Hence the asymmetry. Textualism can absorb an instruction to be purposivist with no internal strain; purposivism can't absorb an instruction to be textualist without either betraying its own criterion or explaining why the clause doesn't bind. And it isn't just a cute result. It suggests textualism is methodologically self-sufficient in a way purposivism can't be: textualism's authority is the enacted words, so the words can settle how they're to be read, including by delegating; purposivism's authority is always answerable to something outside the words, so no statute can fully settle how it gets read. The legislature can outsource its interpretive instructions but it can't tie its own method down.

  ---

  Three things:

  1. Does the asymmetry survive the obvious replies? The one I keep running into is that a textualist facing a "construe liberally to advance the purposes" clause still has to figure out how much purposivism the clause actually delegates, which looks like exactly the legislative-intent guessing textualism is supposed to refuse. And symmetrically, that the purposivist's handling of the anti-purposive clause is no more unstable than any purposivist handling of any rule — no vehicles in the park, ambulance included.
  2. Is there a regress here that flattens the whole thing? Reading the interpretive clause itself needs a method the clause can't supply, so both positions get stuck at the meta-level in the same way, and my asymmetry evaporates. Tell me if that's right or if there's a principled stopping point.
  3. Bluntly: have I built a straw textualist or a straw purposivist? My characterisations are second-hand. And is the conclusion mildly interesting, or has everybody already said it?
reasoning: |-
  Here's a thinking process that leads to the suggested feedback:

  1.  **Analyze the Request:**
      *   **Task:** Critique a draft essay for a philosophy-of-law reading group.
      *   **Goal:** Determine if the argument holds and if it's worth finishing.
      *   **Constraints:** Do *not* provide a bibliography or reading list. Focus on argumentative structure, validity, and originality.
      *   **Input:** A short draft outlining an asymmetry between textualism and purposivism regarding statutory interpretive clauses (rules of construction).
      *   **Specific Questions:**
          1.  Does the asymmetry survive obvious replies (delegation scope vs. rule exceptions)?
          2.  Is there a regress problem that flattens the asymmetry?
          3.  Are the characterizations strawmen, and is the conclusion novel/interesting?

  2.  **Analyze the Draft Argument:**
      *   **Premise 1:** Statutes sometimes include interpretive clauses (e.g., "construe liberally" or "construe according to ordinary meaning").
      *   **Premise 2 (Textualism):** Textualism treats these clauses as text. If the text says "be purposivist," the textualist follows that text. No internal conflict.
      *   **Premise 3 (Purposivism):** Purposivism treats purpose as authoritative. If the text says "don't be purposivist," the purposivist faces a conflict. Following the text defeats the purpose (if the purpose is frustrated by ordinary meaning). Ignoring the text defeats the law.
      *   **Conclusion:** Textualism is methodologically self-sufficient; purposivism is not. The legislature can dictate method to a textualist but not to a purposivist.

  3.  **Address Question 1: Does the asymmetry survive obvious replies?**
      *   *Reply A (Textualist Delegation):* The user notes the textualist must determine *how much* purposivism is delegated. Isn't that intent-guessing?
          *   *Analysis:* Textualism (especially public meaning originalism) distinguishes between *meaning* and *application*. Determining the semantic content of "construe liberally" is a semantic inquiry, not necessarily a search for subjective intent. However, "liberally" is vague. A textualist might say the *standard* is enacted, even if the *application* is hard. This doesn't necessarily break textualism, but it does complicate the "easy absorption" claim. It shifts the burden from "what is the method?" to "what is the semantic content of this methodological instruction?"
      *   *Reply B (Purposivist Rules):* The user notes the purposivist handles anti-purposive clauses like "no vehicles in the park" (rules with exceptions).
          *   *Analysis:* This is a strong counter. Purposivism (e.g., Hart & Sacks, or modern dynamic purposivism) often acknowledges that rules serve purposes. If the purpose of the anti-purposive clause is *legal certainty* or *democratic clarity*, then ignoring it to achieve the statute's substantive purpose might defeat the *procedural* purpose of the clause. A sophisticated purposivist can say: "The purpose of this clause is to constrain me, and respecting that constraint serves the broader purpose of rule of law." This neutralizes the asymmetry. The draft assumes purposivism is monolithic (always substantive purpose > procedural instruction), which is vulnerable.

  4.  **Address Question 2: Is there a regress problem?**
      *   *The Regress:* To interpret the interpretive clause, you need a method. Where does *that* method come from?
      *   *Analysis:* Both theories need a meta-theory of interpretation.
          *   Textualism: The meta-rule is "follow the text." The interpretive clause is text. So follow it. No regress, just a foundational axiom.
          *   Purposivism: The meta-rule is "advance the purpose." The interpretive clause is a tool. If the tool hinders the purpose, discard it.
      *   *Flattening:* If both rely on a meta-rule that isn't itself enacted (you can't enact the rule of interpretation without already having one), then the asymmetry is about the *content* of the meta-rule, not the structure.
      *   *Verdict:* There is a regress risk, but it doesn't necessarily flatten the asymmetry. It highlights that textualism claims its meta-rule *is* the law (the text), whereas purposivism claims its meta-rule is *prior* to the law (rationality/teleology). The draft touches on this ("authority is always answerable to something outside the words"). This is the strongest part of the argument, but needs to be explicit that this is a clash of *foundational norms*, not just statutory mechanics.

  5.  **Address Question 3: Strawmen and Novelty?**
      *   *Straw Textualist:* The draft portrays textualism as robotic ("The clause is text... so the textualist obeys it"). Real textualists (Scalia, Kagan, etc.) debate how to handle contradictions or absurdities. But for the sake of the argument, it's a fair idealization.
      *   *Straw Purposivist:* The draft portrays purposivism as unable to respect procedural constraints. This is the weaker link. Modern purposivists (like Posner or Sunstein) care about institutional competence. Ignoring a clear "do not use purpose" clause might be seen as judicial overreach, which defeats the *purpose* of having a judiciary.
      *   *Novelty:* This looks like a variation on the "rule of recognition" or "constitution of interpretation" debate. It resembles arguments made by Strawson (performative contradiction) or certain debates in constitutional theory (Can the Constitution amend its own amendment procedure?). It's not brand new, but framing it through statutory interpretive clauses is a sharp, concrete angle. It's worth finishing if the "procedural purpose" counter-argument is engaged.

  6.  **Synthesize Feedback:**
      *   *Tone:* Constructive, rigorous, peer-to-peer (reading group style).
      *   *Structure:* Address the three specific questions directly, then offer a general verdict on "worth finishing."
      *   *Key Insight to Convey:* The argument hinges on whether purposivism can recognize a "procedural purpose" (certainty/constraint) as a valid purpose. If yes, asymmetry collapses. If no, asymmetry holds. The regress point is real but manageable if framed as foundational axioms.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Intro:* Acknowledge the sharpness of the puzzle.
      *   *Q1 (Replies):* Tackle the "delegation" point (textualism isn't off the hook, it just moves the problem to semantics). Tackle the "vehicles in the park" point (this is the killer for the draft—purposivism can value the *purpose of constraint*).
      *   *Q2 (Regress):* Explain that the regress exists but reveals the foundational difference (conventionalism vs. rationalism). It doesn't flatten the asymmetry; it explains *why* it exists.
      *   *Q3 (Strawmen/Novelty):* The textualist is okay-ish. The purposivist is too thin. Need to distinguish between "substantive purposivism" and "institutional purposivism." Novelty is decent—it's a specific application of a general meta-ethical problem.
      *   *Verdict:* Worth finishing, but needs to steelman the purposivist response to avoid being dismissed.

  8.  **Final Polish:** Ensure no bibliography is included. Keep it focused on the logic. (Self-Correction: Make sure to explicitly mention that the "no vehicles" analogy is actually a strong counter-argument the user needs to defeat, not just acknowledge.)

  9.  **Final Review against constraints:** No reading list? Check. Focus on argument holding? Check.

