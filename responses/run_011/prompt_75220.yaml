  *   **The Switch:**
      *   Tell Group 1 (Control): "You keep your 6 cards."
      *   Tell Group 2 (Phantom): "You keep your 7 cards. Card 7 is still valid."
      *   *Wait, this doesn't create the contrast.* You need the *same* people to experience the shift, or you need to compare the groups.
      *   *Correction for Maximum Impact:* To show the *phantom* effect, you must introduce the 7th card *only* in Round 2 for *everyone*, OR compare the two groups' Round 1 results.
      *   *Better Design:* Keep the groups static. Group 1 always has 6 cards. Group 2 always has 7 cards.
      *   *Instruction:* "We are running a second negotiation to see if you can improve your outcome. Same rules. 12 minutes."
      *   (This allows you to compare Group 1 vs Group 2 outcomes at the end).

