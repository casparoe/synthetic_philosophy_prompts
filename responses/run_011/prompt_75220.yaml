  ### 5. What Will Go Wrong (And Handling Lines)

  **1. The Economist's Objection**
  *   **The Trap:** "Tokens aren't utility. Risk aversion varies. You can't map this to Nash."
  *   **The Handling:** "You are absolutely right. In the wild, utility is hidden. But in this room, I am the institutional designer. I have defined the rules such that tokens *are* the utility. We aren't testing human psychology; we are testing the logic of the menu. If the menu shifts the outcome even when utility is linear, the phantom is real."

  **2. Party B Brandishes the Phantom Card**
  *   **The Trap:** A savvy Party B in the 7-Card group says, "I know Card 7 is stupid, but I'll threaten to walk away unless you give me Card 5."
  *   **The Handling:** This is actually *good* data. It shows the card has leverage. If they fail to agree and walk away, let them. "The walk-away is the disagreement point. It proves the card was too phantom to touch."

  **3. A Pair Blows Up (Walk Away)**
  *   **The Trap:** Emotions run high. They take the 4/6 split.
  *   **The Handling:** Do not rescue them. "This is the cost of the phantom. Sometimes the ideal point moves so far that the deal breaks." Pay them their walk-away sweets. It adds tension to the room.

  **4. Low Turnout (Only 12 people / 6 pairs)**
  *   **The Trap:** Not enough data for a statistical chart.
  *   **The Handling:** Switch from "Statistical Significance" to "Case Study." "With fewer pairs, the noise is higher. But look at *this* pair here. They had the card. They moved. The mechanism is visible in the micro."

