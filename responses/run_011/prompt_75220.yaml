  *   **Menu 2 (7 Cards):**
      *   **Add Card:** $(44, 7)$. Gains $(40, 1)$.
      *   **Nash:** Product $40$. Does not beat $252$. Recommendation stays $(18, 24)$. (Independence of Irrelevant Alternatives holds).
      *   **Kalai–Smorodinsky:** New Ideal Point $(44, 33)$. Gains $(40, 27)$. Ratio $40:27$.
          *   Card $(18, 24)$ Gains: $(14, 18)$. Proportions: $14/40 = 35\%$, $18/27 = 66\%$. (Unequal).
          *   Card $(21, 20)$ Gains: $(17, 14)$. Proportions: $17/40 = 42.5\%$, $14/27 = 51.8\%$. (Closer).
          *   Card $(25, 12)$ Gains: $(21, 6)$. Proportions: $21/40 = 52.5\%$, $6/27 = 22\%$. (Overshot).
          *   **Discrete Rule:** Pick the card maximizing $\lambda$ where $\text{Gains} \leq \lambda \times \text{Ideal Gains}$.
          *   $(18, 24) \rightarrow \lambda = 0.35$.
          *   $(21, 20) \rightarrow \lambda = 0.425$.
          *   $(25, 12) \rightarrow \lambda = 0.22$.
          *   **Recommendation moves to $(21, 20)$.**

  **The Non-Convexity Worry.**
  You are technically smuggling in a non-convex set (the gap between the main cluster and the phantom card). In rigorous theory, KSS requires convexity to guarantee a unique intersection. However, for a discrete demonstration, this is a **feature, not a bug**. It proves that the "Ideal Point" is a mathematical construct derived from the *menu*, not the *agreement*. The phantom card changes the Ideal Point without changing the feasible agreements (in practice).
  *   **Fix:** Do not call it "non-convex." Call it "The Menu." The rule for the Referee (see below) handles the discreteness by selecting the card that gets closest to the ideal proportion without exceeding it.

  **Budget Check.**
  *   Max payout per pair: $44 + 7 = 51$ tokens.
  *   Max pairs: 12.
  *   Max total tokens: $612$.
  *   Budget: £40.
  *   **Token Value:** Set **1 Token = 5 pence**.
  *   **Max Cost:** £30.60.
  *   **Procurement:** Buy £40 worth of bulk chocolate coins or high-quality sweets. Pre-portion them into small bags labelled "5p value." If a pair wins 20 tokens, they get £1 worth of sweets. This is tactile, cheap, and fits the "small payout" brief.

