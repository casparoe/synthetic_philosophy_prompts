  ### 4. The Debrief Script

  **Step 1: The Fairness Baseline**
  "Look at Part 1 of your sheets. The 'Judge' section. I have the data. In the 6-Card tables, the vast majority of you said Card 4 (18, 24) was the fair outcome. In the 7-Card tables... many of you shifted to Card 5 (21, 20). Why? The options didn't change. The walk-away didn't change. Only a card you would never sign appeared on the table."

  **Step 2: The Bargaining Reality**
  "Now look at Part 2. The 'Player' section. In the 6-Card tables, most agreements clustered at Card 4. In the 7-Card tables, agreements drifted toward Card 5."
  (Points to the whiteboard chart).
  "Here is the room's data. The presence of the phantom card didn't just change what you *thought* was fair; it changed what you *accepted*."

  **Step 3: The Theory (The Jargon Drop)**
  "For the last ten minutes, I owe you the names.
  The logic that kept the 6-Card group at (18, 24) is called the **Nash Bargaining Solution**. It says: 'Ignore options no one would pick. Maximize the product of gains.' It satisfies *Independence of Irrelevant Alternatives*.
  The logic that pulled the 7-Card group to (21, 20) is the **Kalai–Smorodinsky Solution**. It says: 'Fairness is equal proportional gain relative to the best possible outcome.' By adding Card 7, you changed the 'Best Possible Outcome' for Party A. You changed the Ideal Point. You changed the definition of fairness, without changing the deal."

  **Step 4: The Column Hook**
  "I write about divorce, plea bargains, and climate finance. In all three, I found a 'Card 7'. A number that is never achieved, but which sets the terms of the settlement. Tonight, you didn't just hear about it. You signed it."

