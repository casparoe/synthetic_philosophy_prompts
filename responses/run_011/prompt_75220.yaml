  ### 6. The Limitation: Statistical Fact vs. Felt Discovery

  **Your Diagnosis:**
  You are correct. The phenomenon is aggregate. An individual pair in the 7-Card group might choose (21, 20) and feel it was just "good bargaining," not realizing the ghost moved them. They do not feel the counterfactual (what they would have chosen with 6 cards).

  **How to Make it Land:**
  You must force the **Counterfactual Comparison** into the room's consciousness during the Debrief.
  1.  **Physical Segregation:** During the tally, ask all 6-Card pairs to raise their hands. Ask all 7-Card pairs to raise their hands. Make the two groups visible to each other.
  2.  **The "What If" Question:** Ask the 7-Card group: "Keep your hand up if you agreed on Card 5. Now, keep it up if you think you would have agreed on Card 5 *if Card 7 had never been printed*."
  3.  **The Silence:** Watch the hands drop. That moment of hesitation is the "felt discovery." They realize their certainty was contingent on a phantom.
  4.  **The Takeaway:** "You didn't just observe a chart. You observed your own hands dropping. The ghost isn't in the data; it's in your hesitation."

  This transforms the limitation (aggregate data) into the punchline (individual realization of external influence).
