  **CITY OF EPISTEME**
  **OFFICE OF DOXASTIC CONCORD**
  **ORDINANCE 88-PHI: COMPLIANCE FAQ (REV. 4.2)**

  **1. What constitutes a reportable divergence?**
  Any variance in posterior probability assessments regarding municipal facts between two or more rational agents sharing a common prior. Private uncertainty is not actionable; divergence becomes a code violation only when posteriors are mutually known.

  **2. Where must concordance notices be posted?**
  Form CK-1 must be affixed to the primary property line facing the neighbor in question. Digital filing via the Municipal Ledger is acceptable only if receipt is acknowledged via Form CK-2.

  **3. How is common knowledge legally established?**
  Residents must complete an Attestation Ladder (Form AL-5). Party A asserts a belief; Party B acknowledges receipt; Party A acknowledges the acknowledgment. This chain must be completed to the statutory depth.

  **4. Why is the Attestation Ladder depth fixed at five levels?**
  Infinite recursion is administratively prohibitive. Ordinance 88-Phi, Section 12, establishes Level 5 as the threshold of "Constructive Commonality." While mathematical continuity suggests a discontinuity at any finite limit, the City has determined that Level 5 captures sufficient probability mass for civil order.

  **5. What if an agent's rationality is in doubt?**
  The Office cannot audit neural utility functions. Therefore, all residents are subject to a Presumed Rationality Clause (Form PR-2). By residing within city limits, you attest to your own rationality and the presumed rationality of your neighbors.

  **6. How do I claim a Prior Exemption?**
  If you do not share the Municipal Common Prior, disagreement is exempt. File Form PE-1 with proof of: (a) childhood indoctrination outside city limits; (b) late-life conversion to a conflicting probability distribution; or (c) refusal to learn the local language. Note: Deliberate ignorance of municipal code is not a valid prior deviation.

  **7. What is Grade B Notice?**
  Grade B Notice utilizes the Municipal Courier Service, which carries a non-zero probability of message loss (ε > 0). Residents opting for Grade B acknowledge that common knowledge is never achieved. Under these conditions, disagreement is entirely lawful and may be of any magnitude whatsoever.

  **8. What if divergence persists after Level 5?**
  If the Ladder is complete and posteriors differ, one party is necessarily irrational or non-compliant. The Office will issue a Notice of Corrective Belief Adjustment. Failure to align posteriors within ten days results in fines.

  **9. Does the Office verify its own compliance?**
  The Office attests to the validity of all Forms CK and AL. Regarding the Office's own rationality, the City Clerk signs Form PR-2 on behalf of the agency. This creates a closed loop of administrative certainty.

  **10. Who adjudicates appeals?**
  Appeals are heard by the Board of Concordance. Note: Board members are presumed rational. Challenging the Board's prior distribution requires a PE-1 exemption filed prior to the hearing.

  > **SIDEBAR: PRIVATE BELIEF VS. PUBLIC KNOWLEDGE**
  > Holding a belief privately is insufficient for compliance. The Ordinance regulates *knowledge about knowledge*. You may believe your neighbor is wrong, but you may not *know that they know that you know* they are wrong without filing the appropriate paperwork. Unregistered meta-knowledge is treated as a public nuisance.

  **TABLE 1: SCHEDULE OF FEES AND PENALTIES**

  | Item | Form Number | Fee / Penalty |
  | :--- | :--- | :--- |
  | **Attestation Ladder (Per Level)** | AL-5 | $15.00 |
  | **Prior Exemption Application** | PE-1 | $150.00 |
  | **Presumed Rationality Waiver** | PR-2 | $50.00 |
  | **Grade B Courier Risk Surcharge** | GB-1 | $5.00 |
  | **Uncorrected Posterior Variance** | N/A | $500.00 / day |
  | **Unauthorized Common Knowledge** | N/A | $1,000.00 / incident |

  *Issued by the Office of Doxastic Concord. Non-compliance implies consent to corrective adjustment.*
