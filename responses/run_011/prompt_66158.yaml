  2.  **Reject Sharp Boundaries.** (Habit of Natural-Kind Talk)
      Demanding precise cut-offs (e.g., 1964 vs. 1965) is a habit imported from biology. Social categories are fuzzy. An adequate account treats boundaries as heuristic conveniences for grouping, not ontological cliffs where human nature changes overnight. Insisting on precision mistakes map for territory and invites the sorites paradox you noted in your first point.

