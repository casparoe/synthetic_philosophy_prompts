answer: |-
  You are absolutely right to trust your instincts on this: there is no single, universally recognised term in heritage studies or philosophy that captures exactly this asymmetry. Your colleague is wrong about Streisand; that is about suppression breeding curiosity. This is about *alteration* breeding outrage.

  However, the phenomenon is well-understood as a composite of behavioural psychology, political science, and semiotics. If you need a label for internal reports, the closest established concept is **Status Quo Bias** married to **Loss Aversion**, but applied to public memory. If you want a term that carves out the specific dynamic you're describing, I would suggest calling it **"Commemorative Inertia."**

  Here is the carving of the phenomenon, how it works, and where the edges lie.

  ### The Core Mechanism: Why Retention is Silent
  The asymmetry exists because retention and removal are not opposites; they are different categories of action.

  **1. The Furniture Effect (Invisibility)**
  When a statue stands for ninety years, it ceases to be a statement and becomes furniture. It is part of the topography, like a hill or a bend in the river. People navigate around it without processing it. It is "environmental." In communications terms, the statue has lost its *news value*. It is no longer a message; it is the background against which messages are sent.

  **2. Agency and Nature**
  Retention is perceived as passive; removal is perceived as active.
  *   **Retention:** "The statue is there." (This reads as nature/fact).
  *   **Removal:** "The Council took the statue down." (This reads as agency/choice).
  Human beings are wired to notice changes in the environment, not the continuation of them. A predator in the bushes is a threat; the bushes themselves are not. By removing the statue, you transform the object from "bushes" (background) to "predator" (active threat/change). You become the agent of change, and therefore the target of all friction.

  **3. Loss Aversion**
  In psychology, the pain of losing something is roughly twice as powerful as the pleasure of gaining it. This applies to public heritage even if the public never used the heritage. People feel an endowment effect toward their cityscape. They feel they "own" the square. Removing the statue feels like a theft from *them*, whereas keeping it feels like giving them nothing. You are asking them to absorb a loss, which triggers a defensive, high-volume reaction.

  **4. The Void as a Question**
  A statue is a period at the end of a sentence. It says: *This man mattered. Full stop.*
  An empty plinth is a question mark. It says: *This man mattered, but now we say he doesn't. Why? What goes here next? Who decides?*
  Silence (the statue) demands no answer. A void (the plinth) demands an explanation. The controversy is the public rushing to fill that explanatory void.

  ### Why "Streisand" Doesn't Fit
  The Streisand Effect requires an attempt to hide information that backfires. You are not hiding the Victorian worthy; you are re-evaluating their honour. The anger here isn't about *access* to the man (nobody was visiting him); it's about the *authority* to judge him. The outrage is about who holds the pen to write the city's story, not about the text itself.

  ### Edge Cases and Variations

  **1. Replacement vs. The Bare Plinth**
  Does it still bite if you replace the statue rather than leaving it bare?
  *   **Yes, but differently.** A bare plinth is an accusation (it highlights the absence). A replacement statue is a counter-claim.
  *   **The Shift:** With a bare plinth, the argument is about *erasure* ("You are deleting history"). With a replacement, the argument shifts to *hierarchy* ("Why is *she* more important than *him*?").
  *   **The Volume:** Replacement often lowers the temperature slightly because it fills the visual void, but it prolongs the lifespan of the controversy. A bare plinth might be ignored after six months; a new statue invites comparison every time someone walks past. The "Inertia" is broken, but the "Furniture" hasn't settled yet.

  **2. Street Names vs. Statues**
  Renaming a street behaves differently because street names are **functional**, whereas statues are **decorative**.
  *   **Statues:** You can ignore a statue. It is visual noise.
  *   **Streets:** You must *speak* a street name. You have to put it on forms, tell it to taxis, recite it to visitors.
  *   **The Friction:** Renaming a street forces the political change into the daily vocabulary of the residents. It creates a higher cognitive load. However, street names are less "sacred" than statues. People accept road names change for development reasons more often than they accept statues move. The controversy is often more bureaucratic (the cost of changing addresses) than emotional, unless the name is highly charged. The "Inertia" is weaker on streets because they are utilities, not monuments.

  **3. When Does It Flip? (When Retention Becomes Loud)**
  You asked if there is a case where keeping something becomes the louder statement. **Yes.** This happens when the external context shifts so violently that the "Furniture Effect" breaks.
  *   **The Trigger:** If the values of the present day shift far enough, the statue stops being background and starts being an active insult.
  *   **Example:** A statue of a collaborator immediately after an occupation ends. Or a statue of a slave trader in 2020 versus 1990.
  *   **The Mechanism:** When the silence of retention is interpreted as *complicity*. If the world changes enough, keeping the statue is no longer "doing nothing"; it is "taking a side." At that tipping point, retention becomes an active speech act ("We endorse this man"), and the inertia vanishes. The cost of keeping it suddenly exceeds the cost of removing it.

  ### Summary for Your Work
  You are dealing with **Commemorative Inertia**.
  *   **The Rule:** Public memory prefers the path of least resistance. The status quo is invisible; change is hyper-visible.
  *   **The Cost:** The "cost" you are measuring isn't financial; it's cognitive. You are asking the public to update their mental map of the city.
  *   **The Trap:** Do not mistake the silence of the ninety years for approval. It was indifference. Do not mistake the noise of the removal for majority opposition. It is loss aversion.

  There is no magic word in the textbooks, but "Commemorative Inertia" accurately describes the physics of what you are pushing against.
