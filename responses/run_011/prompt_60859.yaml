      *   *Final check on Hypocrisy:* If I reject (2) as stated, do I lose the explanation for hypocrisy? Only if I replace it with nothing. If I replace it with "Non-Exemption," hypocrisy is *defined* as claiming Exemption. So the explanation is preserved and sharpened.

      *   *Ready to write.*
answer: |-
  ### Diagnosis

  The argument fails at **Premise (2)**, the Address Principle, specifically in its condition of **compliance**. This failure is compounded by **Premise (3)**, which exploits an ambiguity in "same general kind" to force a *reductio*.

  The argument is valid, but it is **unsound** because Premise (2) articulates a condition for standing that is too strong. It conflates **moral authority** (the right to hold others to a standard) with **moral purity** (a flawless record of conforming to that standard).

  #### Why it looked sound
  Premise (2) captures a powerful intuition: the "Clean Hands" doctrine. It feels correct that a thief cannot rightfully reproach another thief. This intuition is driven by the wrongness of **hypocrisy**, which involves a specific kind of unfairness: claiming for oneself an exemption from a rule one demands others follow.
  The argument looks sound because it treats *any* violation as a claim to *exemption*. It assumes that if you violate a norm, you are implicitly asserting that the norm does not bind you. If that were true, then any violator would lack the standing to enforce the norm.

  #### The Equivocation
  The failure rests on an equivocation in the concept of **compliance** within Premise (2).
  1.  **Behavioral Compliance:** Actually conforming to the demand in question.
  2.  **Normative Submission:** Acknowledging the demand as authoritative over oneself, without claiming exemption.

  Hypocrisy is a defect of *Normative Submission* (claiming "this rule is for you, not me"), not necessarily *Behavioral Compliance* (failing to meet the rule due to weakness of will, past error, or unavoidable conflict). The argument treats a failure of Behavioral Compliance as automatically entailing a failure of Normative Submission. This is false. One can violate a standard one genuinely endorses and applies to oneself.

  ---

  ### Analysis of Repairs

  Here is the cost-benefit analysis of the four obvious repairs you identified.

  #### 1. Reject (1): Blame is not Address
  *   **The Move:** Define blame as a private reactive attitude (resentment, indignation) rather than a communicative act.
  *   **Preserves:** The moral community (we can all feel resentment). It avoids the Address Principle entirely.
  *   **Forfeits:** The communicative function of blame. It makes blame inert; it cannot *call* the wrongdoer to account, only register a reaction.
  *   **Hypocrisy:** Hard to account for. If blame is private, hypocrisy is merely a character flaw in the blamer, not a defect in the blaming act. It fails your requirement to explain why hypocrisy is a distinctive wrong *in blaming*.
  *   **Verdict:** Too costly. You want to keep the communicative view.

  #### 2. Reject (2): The Address Principle (as stated)
  *   **The Move:** Replace the "Compliance Condition" with a **"Non-Exemption Condition."** One is entitled to address a demand only if one acknowledges that the demand applies to oneself equally.
  *   **Preserves:** The communicative view (1). It saves the moral community (7) because imperfect agents can still hold each other accountable provided they do not claim superiority. It handles the *Reform* case perfectly (Dana acknowledges the rule applies to her).
  *   **Forfeits:** The idea that sinlessness is required for standing. It admits that "tainted" agents can blame.
  *   **Hypocrisy:** This repair *sharpens* the explanation of hypocrisy. Hypocrisy is no longer just "having dirty hands"; it is the **assertion of asymmetry**. The hypocrite fails where the sincere blamer succeeds because the hypocrite claims an exemption they are not entitled to, whereas the sincere blamer (even if imperfect) claims only the shared authority of the moral law.
  *   **Verdict:** **The Recommended Repair.** It aligns with your preference to keep (1) and (3) while modifying (2).

  #### 3. Reject (3): There is a Principled Cutoff
  *   **The Move:** Argue that "same general kind" can be restricted non-arbitrarily (e.g., to "professional honesty" rather than "all morality").
  *   **Preserves:** The strict Compliance Condition of (2).
  *   **Forfeits:** Plausibility. Even if we restrict the kind to "expense reporting," Premise (2) still requires *compliance*. If Dana falsified reports for a decade, she is non-compliant with *that* specific kind. To make this work, you must argue that *past* non-compliance does not negate *current* standing. But (2) says "at the time of the address." If she stopped, she is currently compliant.
      *   *Problem:* This repair struggles with the "Weak-Willed Blamer." If I endorse honesty but occasionally lapse due to weakness (without claiming exemption), (3) might let me off the hook by narrowing the kind, but (2) still bars me if I am currently non-compliant. It doesn't solve the fundamental "Clean Hands" problem.
  *   **Hypocrisy:** Leaves hypocrisy as a behavioral state rather than an attitudinal one.
  *   **Verdict:** Weak. It treats the symptom (arbitrariness) rather than the disease (the compliance condition).

  #### 4. Accept (4) but Deny (5): No Entitlement, but Permissible
  *   **The Move:** Argue that while no one has *standing* (entitlement), blame is still *permissible* as a functional practice (like a utilitarian justification).
  *   **Preserves:** The practice of blame.
  *   **Forfeits:** The normative force of standing. It renders the concept of "standing to blame" theoretically idle. If everyone lacks standing but everyone blames anyway, "standing" does no work.
  *   **Hypocrisy:** Makes hypocrisy inexplicable. If no one has standing, the hypocrite is not doing anything distinctively worse than the saint.
  *   **Verdict:** Theoretical suicide.

  ---

  ### Handling the Test Cases

  The diagnosis above (Repair #2: The Non-Exemption Condition) handles your cases as follows:

  #### 1. The Reform Case (Dana and Ellis)
  *   **Argument's Verdict:** Impermissible (Dana was non-compliant).
  *   **Diagnosis:** This is a **genuine counterexample** to the original argument, resulting from the conflation of Compliance with Submission.
  *   **Repaired Verdict:** Permissible. Dana's disclosure demonstrates **Normative Submission**. By disclosing her history, she explicitly denies that she is exempt from the standard. She places herself *under* the same law as Ellis. Her blame is not an assertion of superiority ("I am good, you are bad") but an assertion of shared accountability ("We are both bound by this, I failed, you are failing").
  *   **Why it strengthens:** The disclosure proves she is not a hypocrite. It validates her standing under the Non-Exemption Condition.

  #### 2. The Office Case (Institutional Blame)
  *   **Argument's Verdict:** Impermissible (The office-holder is non-compliant).
  *   **Diagnosis:** This is an **artifact** of how the Address Principle is stated. It assumes standing is always *personal*.
  *   **Repaired Verdict:** Permissible, but for a different reason. Institutional blame relies on **Conferred Authority**, not Moral Standing.
      *   When a judge sentences a thief, the demand comes from the *Law*, not the judge's personal moral purity. The judge is a conduit.
      *   *Does this escape (4)?* Yes. The "compliance" required is fidelity to the *office*, not personal sinlessness.
      *   *Can individuals have this?* Only insofar as they act as representatives of a shared norm. When Dana blames Ellis, she acts as a representative of the moral community. If she claims exemption, she loses that representative capacity. If she acknowledges her own subjection (Reform Case), she retains it.
      *   *Limit:* If the office-holder's violation undermines the *institution's* integrity (e.g., a police chief running a drug ring), the institutional standing itself collapses. But mere personal guilt does not automatically void institutional authority.

  ### Summary of the Repair

  To save your argument without accepting the nihilistic conclusion (7), you must revise **Premise (2)**.

  **Original (2):** One is entitled to address a moral demand to another only if one is oneself, at the time of the address, **complying with** demands of the same general kind.

  **Revised (2*):** One is entitled to address a moral demand to another only if one acknowledges oneself to be **bound by** demands of the same general kind, without claiming exemption.

  **Cost:** You lose the ability to say that a violator *never* has standing.
  **Gain:** You retain the distinctive wrong of hypocrisy. The hypocrite is not wrong because they have violated the norm (many sincere blamers have); they are wrong because they violate the norm *while denying its authority over themselves*. This preserves the moral community as a network of mutual accountability among imperfect agents, rather than a club of the sinless.
