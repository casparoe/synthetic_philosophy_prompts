answer: |-
  # Diagnostic: The Burden of Defence

  **Instructions:** For each scenario, select the option that matches the policy you would implement. Do not consider what is currently law; consider what arrangement best secures the polity.

  ### The Cases

  **1. The Recruitment Gap**
  The standing army is short 5,000 personnel. The budget allows for either higher pay or expanded training capacity.
  *   **A.** Offer a significant cash signing bonus to attract applicants.
  *   **B.** Require all eligible adults to enter a lottery; those selected serve two years.
  *   **C.** Require all eligible adults to complete a short course, then remain on a call-up list for ten years.

  **2. The Selective Objector**
  A conscript agrees to defend the national border but refuses to deploy for foreign interventions or alliance operations.
  *   **A.** Discharge them; fill the slot with a volunteer willing to deploy anywhere.
  *   **B.** Assign them to domestic logistics or medical units only.
  *   **C.** Require them to serve where ordered, regardless of location.

  **3. The Substitution Offer**
  A person selected by lottery offers to pay a lower-income citizen to serve their two-year term in their place.
  *   **A.** Permit the transaction; the state registers the substitute.
  *   **B.** Forbid the transaction; the selected person must serve or face imprisonment.
  *   **C.** Forbid the transaction; allow the selected person to perform equivalent infrastructure work instead.

  **4. The Cyber Specialist**
  A civilian hacker offers to defend state networks from home during a crisis. They will not wear a uniform or carry a weapon.
  *   **A.** Hire them as a private contractor; pay market rates for services rendered.
  *   **B.** Decline; only uniformed personnel may access state defence systems.
  *   **C.** Commission them as a reservist; they train on weekends and remain civilians.

  **5. The Alliance Shift**
  The state has just joined a mutual defence alliance. Direct invasion is now statistically unlikely.
  *   **A.** End all service requirements; rely on alliance partners for heavy defence.
  *   **B.** Maintain the service requirement to ensure troop contributions to the alliance.
  *   **C.** Maintain the service requirement to train the population for disaster response and sabotage defence.

  **6. The Rifle Storage**
  Following basic training, where should the individual's service rifle be kept?
  *   **A.** Returned to the state; stored in a central armory.
  *   **B.** Kept by the individual at their home.
  *   **C.** No rifle issued; individuals are trained on equipment held at local community centers.

  **7. Private Security**
  A large corporation requests a license to equip its security guards with military-grade automatic weapons to protect its facilities.
  *   **A.** Grant the license; allow private firms to manage high-risk assets.
  *   **B.** Deny the license; only state military personnel may hold such weapons.
  *   **C.** Grant the license, provided the guards register as state auxiliaries and attend monthly drills.

  **8. The Training Cycle**
  How should the service obligation be distributed over time?
  *   **A.** Two years of continuous full-time service, then no further obligation.
  *   **B.** Three weeks of full-time service every year for ten years.
  *   **C.** Six months of initial service, then no further obligation unless war is declared.

  **9. The Ten-Year Recall**
  Ten years after completing service, a major crisis disrupts transport and power grids.
  *   **A.** Recall veterans to combat units only.
  *   **B.** Do not recall veterans; hire contractors to fix infrastructure.
  *   **C.** Recall veterans to restore infrastructure and maintain order, not necessarily to fight.

  ***

  ### Scoring Key

  Tally your selections. Most answers will cluster around one of the four profiles below.

  | Question | Option A | Option B | Option C |
  | :--- | :--- | :--- | :--- |
  | **1** | **Volunteer Force** | **Universal Draft** | **Resilient Society** |
  | **2** | **Volunteer Force** | **Resilient Society** | **Universal Draft** |
  | **3** | **Volunteer Force** | **Universal Draft** | **Resilient Society** |
  | **4** | **Volunteer Force** | **Universal Draft** | **Resilient Society** |
  | **5** | **Volunteer Force** | **Universal Draft** | **Resilient Society** |
  | **6** | **Universal Draft** | **Armed Citizenry** | **Resilient Society** |
  | **7** | **Volunteer Force** | **Universal Draft** | **Armed Citizenry** |
  | **8** | **Universal Draft** | **Armed Citizenry** | **Volunteer Force** |
  | **9** | **Armed Citizenry** | **Volunteer Force** | **Resilient Society** |

  **Count your totals:**
  *   **Mostly A:** The Volunteer Force (Professional/Alliance)
  *   **Mostly B:** The Universal Draft (Egalitarian Conscription)
  *   **Mostly C:** The Resilient Society (Total Defence)
  *   **Mixed B/C with Q6-B & Q7-C:** The Armed Citizenry (Militia)

  ***

  ### The Four Leaves (Outcomes)

  **1. The Volunteer Force (Professional/Alliance)**
  *   **Risk:** Borne by a specialized subset of the population (soldiers/contractors).
  *   **Control:** Centralized in the state military hierarchy; private force is market-regulated.
  *   **Logic:** Defence is a service purchased like any other. Efficiency and expertise matter more than broad participation. Alliances reduce the need for mass mobilization.

  **2. The Universal Draft (Egalitarian Conscription)**
  *   **Risk:** Shared universally; no buying out.
  *   **Control:** Centralized in the state; weapons stored in armories.
  *   **Logic:** The burden of violence must be distributed equally to prevent class-based exploitation. The state retains monopoly on force, but the population shares the cost.

  **3. The Armed Citizenry (Militia)**
  *   **Risk:** Shared universally.
  *   **Control:** Distributed; weapons kept at home or by individuals; private force integrated into state structure.
  *   **Logic:** A state that monopolizes weapons creates a gap between ruler and ruled. Keeping arms and skills with the population ensures the military remains an instrument of the people, not just the government.

  **4. The Resilient Society (Total Defence)**
  *   **Risk:** Shared, but focused on societal function (infrastructure/logistics) as much as combat.
  *   **Control:** Hybrid; civilians retain skills and roles but coordinate with state planning.
  *   **Logic:** Modern conflict targets society, not just armies. Service is justified by social cohesion and the ability to function during crisis, regardless of neutrality or alliance status.

  ***

  ### Diagnostic Analysis & Limitations

  **1. The Risk/Control Split**
  You requested three questions that separate *who bears the risk* from *who controls the means*.
  *   **Question 3 (Substitution):** Separates legal obligation (Control) from physical presence (Risk). Option A allows risk transfer while maintaining state control of the contract. Option B binds risk and control to the individual.
  *   **Question 4 (Cyber):** Separates physical risk from strategic impact. Option C grants high control (defence of state networks) with low physical risk, challenging the idea that service requires exposure to danger.
  *   **Question 7 (Private Security):** Separates ownership of force from state employment. Option C allows private control of means (weapons) provided they are integrated into state risk structures (drills).

  **2. Unseparated Leaves: The Militia vs. Resilience Problem**
  You suspected the **Armed Citizenry (Militia)** and **Resilient Society (Total Defence)** would be difficult to distinguish. You are correct.
  *   **The Overlap:** Both models require universal participation, reject pure market solutions, and value a population that is trained and equipped. In Q1, Q3, and Q5, their answers are identical (Options B/C often map to both).
  *   **The Differentiator:** The separation only appears in **Q6 (Storage)** and **Q9 (Recall)**.
      *   The *Militia* view insists on individual custody of weapons (Q6-B) to prevent state monopoly.
      *   The *Resilience* view focuses on societal function (Q9-C) and community equipment (Q6-C), prioritizing cohesion over individual autonomy.
  *   **The Blind Spot:** If a respondent chooses *Resilience* on all questions except Q6 (choosing Armory storage), they score as a *Universal Draft* supporter. The diagnostic cannot easily distinguish a *Resilience* advocate who trusts the state with storage from an *Egalitarian Conscript* who wants social cohesion. Both look like "Conscription with extra steps."

  **3. The "No Leaf" Pattern**
  *   **The Pattern:** Selecting **Q3-A** (Allow Substitution) + **Q6-B** (Weapons at Home) + **Q7-A** (Private Heavy Weapons).
  *   **The View:** This combination suggests a system where risk is marketized (you can pay to avoid it), but control of violence is fragmented (private ownership of heavy arms).
  *   **Diagnosis:** This is **Feudalism** or **Warlordism**. It is incoherent as a modern state model because it privatizes the *means* of violence without retaining the *monopoly* on legitimacy. It creates a class of armed elites and a class of paid proxies, with no central mechanism to ensure loyalty to the polity. It is unexplored in modern democratic theory because it leads to state fragmentation.

  **4. The "Alliance" Blind Spot**
  *   **Q5** attempts to separate the *Professional/Alliance* view from the *Resilience* view. However, a state can hold a *Resilience* view (train for disasters) while relying on allies for heavy defence. If a respondent chooses **Q5-C** (Train for disaster) but **Q1-A** (Cash bonus for recruiting), they fall between *Volunteer Force* and *Resilient Society*.
  *   **Diagnosis:** This is the **"Swedish Model" transition phase**. It is a stable, attractive view (professional army + total defence reserves) that the diagnostic forces into a binary choice. It indicates the quiz treats "Professional" and "Total Defence" as mutually exclusive, whereas in practice, many nations hybridize them.

  **5. Forbidden Concepts Check**
  *   No use of "liberty," "coercion," "duty," "fairness," or "civic."
  *   Normative weight is carried by concrete mechanisms (storage, payment, recall, licensing) rather than abstract values.
  *   The separation of Risk and Control is achieved through operational details (who holds the rifle, who fixes the grid, who pays the substitute) rather than philosophical justification.
