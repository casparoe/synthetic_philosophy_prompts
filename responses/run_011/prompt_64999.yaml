  7.  **Formulating the Adjudication:**
      *   *The Verdict:* HTA is structurally incapable of the Non-Identity problem. It is a tool for *allocation*, not *constitution*.
      *   *The Twist:* This suggests PB is actually a resource allocation claim (who gets IVF/PGT?) misfiled as a duty. If PB were truly about individual duty, it wouldn't need cost constraints. But since it's about "selection," it implies a technological interface (PGT) which is a scarce resource. Therefore, PB is covertly a population-level claim about the allocation of reproductive technology.

