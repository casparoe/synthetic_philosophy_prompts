      *   *Savulescu 2001 (PB):* In HTA, this looks like selecting the intervention with the highest expected QALYs. *Constraint Check:* Rule 1 (No Smuggling). HTA assumes a patient exists. PB assumes the patient is created by the choice. *Translation:* "Selection of the embryo arm with the highest expected lifetime QALYs." *Caveat:* This substitutes a neighboring claim (maximizing welfare of an existing patient vs. selecting which patient exists).
      *   *Savulescu & Kahane 2009 (Probabilistic):* This maps to Expected Value calculations. *Constraint Check:* Rule 3 (Risk Neutrality). HTA usually maximizes expected value (risk neutral). PB might not intend strict risk neutrality, but the math forces it.
      *   *Non-Identity:* This is the hard one. HTA models a fixed denominator ($N$ patients). PB changes $N$ or changes the identity of the $N$. *Constraint Check:* Rule 2 (Structure). HTA has no analogue for "constituted identity." The closest is "Dynamic Cohort Modeling," but that still assumes a population flow, not ontological selection.
      *   *Habermas:* This is about agency and symmetry. HTA is consequentialist/aggregative. It doesn't measure "symmetry of recognition." *Translation:* Perhaps "Violation of Patient Autonomy weights" or "Process Utility"? But that's weak.
      *   *Disability Critique:* This attacks the utility weights in the QALY. If QALY weights are biased against disability, the model is flawed. *Translation:* "Contested Utility Weights in the Quality of Life instrument."
