answer: |-
  We build a theory to explain the dust,
  And find a fact that settles in the hand.
  Now confidence grows certain as a trust,
  Expecting belief to shift and land.
  We think we know how evidence adjusts,
  And see the link where deduction stands.

  But look closely at the link you just defined,
  Within the theory constructed late.
  Did you truly know this before your mind?
  Or was the fact already sealed by fate?
  If nothing needs to shift, you are confined,
  To stay as certain as a locked gate.

  If you are certain of the ground you tread,
  The link connects to something already true.
  There is no room to shift the odds ahead,
  The theory finds no work left to do.
  The fact was old before the words were said,
  And what you know cannot be made anew.

  You claim you know a way to force the door,
  To make the certain number slightly less.
  But if the fact was settled long before,
  Renormalizing cannot strengthen the link.
  Or doubt the theory's arithmetic core,
  But logic pays the price of every shift.

  No shift occurs when probability is full,
  However much you know the fit is tight.
  The theory sits empty, like a skull,
  Unable to be certain of the light.
  There is no link to break the quiet lull,
  When yesterday's fact blocks out the night.

  The fact itself offers no surprise,
  No shift can come from what is plainly seen.
  Unless the link is viewed with different eyes,
  Something you know now, though it was not then.
  To be certain of the relation's size,
  Is to rebuild the theory once again.

  The theory holds when certain of the fact,
  Only if knowing logic drives the shift,
  A space of sentences defines the link.
