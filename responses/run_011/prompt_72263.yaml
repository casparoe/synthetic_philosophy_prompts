      *   *Davidsonian Nuance:* Charity isn't about making them saints; it's about making them intelligible. If your manual says they deny the water drops when it's dry, you've likely mapped "water drops" to something else. Maybe it's about the spirit of the river, not the H2O level.
      *   *Disagreement:* Genuine disagreement needs a shared world. If you translate them as living in a different physics, you haven't translated; you've caricatured.
      *   *Word Count Check:* Keep it tight, around 150 words.
      *   *Bracketed Line:* [Confidence: 85% | Weakest point: Distinguishing observational bedrock from theoretical claims].

