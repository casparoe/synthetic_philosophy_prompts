answer: |-
  Brainstorming the logical space, I see three primary relations available: identity (both are robust instrumentalisms), contrariety (one demands causal grounding, the other forbids it as necessary), or subordination (one is a special case of the other). I reject identity because Dennett's naturalism imposes ontological constraints Friedman explicitly rejects as irrelevant. I reject simple contrariety because both endorse "as-if" prediction as a valid scientific move. I commit to the view that they are **methodologically compatible but metaphysically divergent**: Friedman offers a license for model construction that Dennett accepts pragmatically but rejects as a final metaphysical account. This makes Dennett's position a **naturalistic constraint** on Friedman's instrumentalism; Friedman tells you when you can use the tool, while Dennett tells you what the tool must eventually be made of.

  **(a) Claims and Crux**
  Friedman's position is a thesis about **theory acceptance**: a theory is validated solely by the accuracy of its predictions within its intended domain, and the descriptive truth of its assumptions is irrelevant to its validity. The "unrealistic" nature of assumptions is often a virtue because it signals high abstraction. Dennett's position is a thesis about **explanatory genealogy**: complex design (intelligence, function) cannot arise from nowhere ("skyhooks") but must be built by incremental, physically grounded processes ("cranes"). The crux of their apparent symmetry turns on the **status of the black box**. For Friedman, the internal description of the box is epistemically inert; if the output matches, the theory is significant. For Dennett, the internal description is ontologically mandatory; if the output matches but the internal process is impossible (a skyhook), the explanation is defective. The tension arises because Dennett's "Intentional Stance" looks like a Friedmanite model (predicting behavior by attributing rational beliefs), yet Dennett insists this stance must be underwritable by the "Design Stance" and "Physical Stance." Friedman would say the underwriting is unnecessary for the theory's significance; Dennett says it is necessary for the phenomenon's existence.

  **(b) Dennett's Consistency**
  Can Dennett consistently endorse the Intentional Stance while condemning skyhooks? **Yes, but only on a specific interpretation of his realism.** If one reads Dennett as a hard instrumentalist about the mind (a minority reading, contested by those who emphasize his "real patterns" ontology), the charge holds: he would be using a skyhook (rationality) to explain design without grounding it. However, on the standard "pragmatic realist" reading, Dennett avoids inconsistency by treating the Intentional Stance as a **heuristic compression** of underlying causal processes, not a replacement for them. The stance is licensed not merely by predictive success (as Friedman would have it) but by the fact that the system in question is the product of evolutionary or learning cranes that *actually approximate* rationality. The "as-if" attribution is valid because there is a "is" underneath it, even if we don't always need to reference it for prediction. If the "is" were missing—if a system predicted perfectly via intentionality but had no causal history capable of producing that rationality—Dennett would indeed call it a skyhook. Thus, consistency is maintained by distinguishing between the **utility of the stance** (which aligns with Friedman) and the **explanation of the stance's applicability** (which requires cranes). Friedman stops at utility; Dennett demands the genealogy.

  **(c) Diagnostic and Testing**
  To adjudicate when an unrealistic assumption is a legitimate heuristic versus a skyhook, I propose the **Causal Cash-Out Condition**: An "as-if" assumption is legitimate if there exists a plausible, base-level causal mechanism (evolutionary, learning, or physical) that could generate the observed behavior *without* requiring the literal truth of the assumption. It is a skyhook if the model attributes capacities that exceed the generative power of the available base-level processes. This diagnostic does real work because it distinguishes between *simplification* (ignoring details of a real process) and *magic* (positing a process that cannot exist).

  1.  **Friedman's Billiard Player:** The assumption is that the player solves differential equations.
      *   *Diagnostic:* Can neural training and selection produce motor outputs *isomorphic* to equation solutions without literal calculation? Yes.
      *   *Verdict:* **Licensed.** This is a Crane-compatible simplification. The brain is a mechanism that approximates the math via feedback, not a skyhook.
      *   *Work Done:* It prevents the verdict from resting solely on prediction, anchoring it in neuroplausibility.

  2.  **Thermostat Beliefs:** Attributing the belief "it is too cold" to a thermostat.
      *   *Diagnostic:* Can a bimetallic strip mechanism generate the behavior? Yes. Does the system have the causal history to support "belief"? Here, specialists dispute the threshold. Dennett allows it as a trivial intentional system; critics argue it lacks the evolutionary history for genuine representation.
      *   *Verdict:* **Licensed as a stance, but ontologically thin.** It passes the Cash-Out Condition physically, but strains the "design" history requirement.
      *   *Work Done:* It highlights the boundary where "as-if" becomes metaphorical rather than explanatory.

  3.  **Profit Maximization:** Firms act as if they solve marginal calculus.
      *   *Diagnostic:* Is there a selection mechanism strong enough to eliminate non-maximizers quickly enough to make the assumption hold? This is **highly contested** in economic methodology (e.g., Nelson & Winter vs. Alchian). If market selection is weak or path-dependent, the "maximization" capacity cannot be cashed out by selection.
      *   *Verdict:* **Contingently Licensed.** It is a skyhook *if* selection is insufficient; it is a crane *if* selection is robust.
      *   *Work Done:* This is where the diagnostic bites hardest. Friedman treats it as licensed by prediction alone. The diagnostic forces the economist to prove the selection mechanism exists, shifting the burden of proof from the predictor to the mechanism.

  **(d) Verdict**
  Dennett has the better of the exchange because his requirement for causal grounding prevents explanatory vacuity, whereas Friedman's license allows theories to remain successful even when they describe impossible worlds.
