answer: |-
  I hope this message finds you well and that you are enjoying your reading on rational choice. Regarding the chapter you described, a careful reader of the medieval debate would need to correct the historical record before accepting the philosophical setup. The thought experiment is indeed usually credited to Buridan, but scholars generally agree he never actually used a donkey; he discussed a dog faced with two equally appealing pieces of food, and the ass example was attributed to him by later critics. Furthermore, the chapter slightly misrepresents the direction of his argument. Buridan did not use the scenario to argue that a rational agent must starve; rather, he argued that the will is free to choose either option even when the intellect perceives them as equal. The starvation outcome is the reductio ad absurdum aimed at strict intellectual determinists who claim the will must follow the intellect's verdict, so the chapter is right that the puzzle targets the principle that the will always follows the intellect, but it is wrong to imply Buridan thought starvation was the rational outcome for a free agent.

  Moving to the claims about modern decision theory, the assertion that ties between outcomes are perfectly well behaved and that an indifferent agent may adopt any of the tied actions is standard and correct within expected utility theory. However, the claim that where randomization is available, going left on a coin flip is simply what rational agents do under ties is an overstatement. Decision theory permits randomization because it yields the same expected utility as picking either option directly, but it does not mandate it over a pure strategy. To say rational agents flip coins implies a normative requirement where the framework only offers permission, and this glosses over the fact that picking left without a coin is equally rational under the theory.

  When the chapter suggests that whoever insists there must always be a reason to act is smuggling in a requirement no decision-theoretic framework actually imposes, it is technically correct about the framework but dismissive of the philosophical objection. A defender of the requirement that every choice have a reason would argue that decision theory defines rationality as consistency rather than intelligibility, so pointing out that the framework lacks the requirement merely confirms the defender's worry that the framework is incomplete. The chapter dismisses the requirement by changing the subject to formal consistency rather than answering the metaphysical concern that a choice without a reason is unintelligible or magical, and it treats the absence of the requirement in the model as proof that the requirement is illegitimate.

  Your intuition about the coin flip is precisely where the pragmatic solution meets the philosophical wall, and it highlights a gap the chapter ignores. If the agent is indifferent between the haystacks, they are indeed indifferent between flipping and not flipping, and the assignment of heads to left rather than right is itself a choice between symmetric options that lacks a sufficient reason. Randomization does not solve the problem of arbitrary selection; it merely pushes the arbitrary choice back to the stage of setting up the randomization device, confirming that the puzzle is not dissolved but relocated. The closing conclusion that the animal just goes to one haystack survives as a description of behavior but fails as a justification of rationality once the earlier claims are corrected, since the verdict holds only if you accept that rationality requires nothing more than consistency rather than intelligible grounds.
