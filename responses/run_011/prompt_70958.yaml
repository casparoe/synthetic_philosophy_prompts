      *Okay, the principle needs a "Social Bases of Self-Respect" clause.*

      *Let's formulate the Principle of **Reciprocal Justification**.*
      1.  **Maximin Constraint:** Arrangements must maximize the index of primary goods for the least advantaged. (Cases 1, 4, 5).
