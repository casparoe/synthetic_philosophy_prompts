          2.  **The Relational Principle (The Status-Equality):** Focus on the relationship between citizens (domination, access, recognition).
      *   *Wait, the prompt asks for "The principle, or the small number of genuinely rival candidate principles."* I should try to unify the user's verdicts into *one* robust principle first, then show where it fractures.
      *   *Unified Principle:* **The Principle of Sustainable Equal Citizenship.**
          *   Clause 1 (Floor): Maximize the position of the least advantaged. (Cases 1, 4, 5).
