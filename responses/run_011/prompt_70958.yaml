      *   *Best Fit for the User's Intuitions:* A hybrid of Rawlsian Maximin + Libertarian Side-Constraints + Capabilities Approach + Intergenerational Equity.
      *   *Let's try to distill it into a single coherent framework for the novel's delegates.*
      *   *Core Idea:* "Reciprocal Justification." An arrangement is just if it maximizes the baseline *without* violating specific inviolable constraints (body, future, participation).
      *   *Refining the Principle:* Let's call it **The Principle of Non-Domination and Sustainable Sufficiency.** Or perhaps **The Principle of Free Agreement among Successors.**
      *   *Actually, looking at the tensions:* There is a tension between *Outcome* (Maximin) and *Process/Status* (Liberty/Capability).
      *   *Let's propose two rival principles that the delegates can argue:*
