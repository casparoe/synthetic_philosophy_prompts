      *   *Case 2 (Mill Monopoly, Legal Barrier):* Same outcome, but legal barrier prevents competition. *Verdict: Unjust.* (Implies: Process matters/Status matters, not just outcomes. Anti-entrenchment).
      *   *Case 3 (Surgeon, Tax vs. Draft):* Same outcome (clinics funded), but tax is just, forced labor is unjust. *Verdict: Tax Just, Draft Unjust.* (Implies: Self-ownership/Bodily integrity/Liberty constraint on redistribution).
      *   *Case 4 (Hollowed Middle):* Maximin achieved (worst-off maxed), but middle class ruined. *Verdict: Unjust.* (Implies: Maximin isn't enough. Need to protect the middle/avoid extreme stratification or "social bases of self-respect").
      *   *Case 5 (Environmental Depletion):* Current worst-off helped, but future generations harmed. *Verdict: Unjust.* (Implies: Intergenerational justice/Sustainability constraint).
      *   *Case 6 (Wheelchair/Access):* Maximin achieved (goods maxed), but physical access denied. *Verdict: Unjust.* (Implies: Capability/Functioning matters, not just resources. Equality of status/participation).
      *   *Case 7 (Religious Minority):* Veil too thick. Wants to protect specific cultural needs even if majority opposes. *Verdict: Thinner Veil/Minority Rights.* (Implies: Some particular knowledge is needed to protect fundamental liberties/identity, not just generic resources).

