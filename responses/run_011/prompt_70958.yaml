          *   *Resentful Voting:* If the arrangement is just by the principle, voting against it out of resentment isn't injustice *done to* them, but it threatens stability. Verdict: Not unjustly treated, but rationally inconsistent.
      *   **Section 5: The Impossible Verdict.** Which one doesn't fit?
          *   Case 4 is the outlier. Standard Maximin (Rawls) says if the worst-off are maxed, it's just, even if the middle suffers. The user says Unjust. This requires a "Sufficientarian" or "Median" constraint that conflicts with Maximin.
