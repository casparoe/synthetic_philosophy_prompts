answer: |-
  You have put your finger on the single most awkward silence in decision theory. You are describing the **infinite regress of decision costs**, and specifically the phenomenological moment where an agent stops calculating the cost of calculation without admitting they have done so.

  There is no single, universally canonical noun for this specific termination point. However, there are three established concepts that circle it, each missing a different facet of your description. I will outline those, explain why they fall short, and then offer the term that best carves out the specific phenomenon you are describing.

  ### 1. The Established Contenders

  **Type II Rationality (I.J. Good)**
  In 1971, the statistician I.J. Good distinguished between Type I rationality (deciding what action to take) and Type II rationality (deciding how to decide). Good explicitly acknowledged that thinking costs time and energy.
  *   **Why it fits:** It identifies the exact layer you are talking about (the decision about the decision procedure).
  *   **Why it fails:** Good treats Type II rationality as an *optimisation* problem. He assumes you calculate the expected utility of thinking harder versus acting now. Your observation is that people *do not* calculate this; they drift into a stopping point based on fatigue or mood and treat it as fixed. Good's model assumes the regress is solved by math; you are describing it being solved by exhaustion.

  **Meta-Reasoning (AI and Cognitive Science)**
  In artificial intelligence and cognitive psychology, this is the system that monitors the object-level reasoning. It handles "deliberation scheduling" or "compute budgeting".
  *   **Why it fits:** It deals with the allocation of cognitive resources to the decision process itself.
  *   **Why it fails:** In AI, the meta-reasoner usually has a hard constraint (e.g., a time limit). In humans, the constraint is soft and endogenous. More importantly, meta-reasoning literature often assumes the meta-reasoner is trustworthy. It does not adequately label the *blind spot* where the meta-reasoner itself gives up and pretends it hasn't.

  **Procedural Rationality (Herbert Simon)**
  Simon distinguished between substantive rationality (maximising outcomes) and procedural rationality (using a reasonable process given constraints).
  *   **Why it fits:** It accepts that the process itself is bounded.
  *   **Why it fails:** It treats the bounds as exogenous (given by the environment or biology). It does not name the *act* of the agent setting those bounds themselves and then forgetting they set them. It describes the *state* of being bounded, not the *moment of accepting the bound*.

  ### 2. The Proposed Label: Deliberative Closure

  Since no single existing term captures the *unexamined termination* of the regress, the most precise label for this phenomenon is **Deliberative Closure**.

  While "closure" is used in epistemology (stopping inquiry into truth) and psychology (need for cognitive closure), applying it to *deliberation* specifically carves out the niche you have identified.

  **Definition:**
  Deliberative Closure is the point at which an agent ceases to evaluate the efficacy of their decision-making procedure and treats the current method as fixed, driven by cognitive fatigue, contextual pressure, or arbitrary drift rather than a calculated marginal value of further meta-analysis. Crucially, the agent exhibits **meta-cognitive blindness** to this termination; they perceive the method as "chosen" or "sensible" rather than "abandoned".

  **The Carving (Boundaries):**
  To ensure this label does the work you need, here is where the edges lie:

  *   **Vs. Habit:** If you hire via gut instinct every time without ever considering a scorecard, that is habit. Deliberative Closure requires a moment of *selection* (e.g., "I could do a scorecard... actually, I won't") followed by the cessation of questioning that selection.
  *   **Vs. Optimisation:** If you explicitly calculate that fifteen hours of process design costs more than the risk of a bad hire, and stop there, that is Type II Rationality. Deliberative Closure is when you *don't* do the calculation, but act as though you have.
  *   **Vs. Satisficing:** Satisficing is stopping the search for *options* (the house). Deliberative Closure is stopping the search for *methods* (the rule for viewing houses).
  *   **Vs. Rational Ignorance:** Rational ignorance is choosing not to acquire *information*. Deliberative Closure is choosing not to acquire *certainty about the process*.

  ### 3. Is it Just Satisficing in Disguise?

  You asked: *"Is what I'm describing simply that objection seen from the inside?"*

  The objection you reference is that satisficing is secretly optimisation (because setting the threshold requires calculation). Your observation is the inverse: that optimisation is secretly satisficing (because stopping the calculation requires a threshold).

  Deliberative Closure is distinct from standard satisficing because of the **unexamined** nature. Standard satisficing acknowledges the threshold ("I need a house under £500k"). Deliberative Closure hides the threshold ("I'll stop when I'm sick of it" treated as a valid rule).

  In your procurement context, this is the difference between:
  1.  **Satisficing:** "I will accept the first vendor who meets these specs." (Explicit threshold).
  2.  **Deliberative Closure:** "I should probably build a weighted scorecard... ah, I'm tired, I'll just interview the top three CVs." (Implicit threshold on the *method*, treated as a settled decision).

  ### 4. Applicability

  Does this cover your cases?
  *   **Hiring:** Yes. The twenty minutes spent deciding how to decide ends not because the value of information hit zero, but because the *cost of meta-decision* hit a subjective limit.
  *   **House-hunting:** Yes. The shift from "view six" to "I'll know when I'm sick of it" is a drift into Deliberative Closure. The rule is no longer a rule; it's a rationalisation for stopping the meta-process.
  *   **AI Compute:** Yes. If an AI system has a hard time limit, that is an exogenous constraint. If an AI system uses a heuristic to decide when to stop thinking, and that heuristic is not itself monitored for cost, it has reached Deliberative Closure.
  *   **Career Choice:** Yes. Deciding "I will research careers for six months then choose" is a meta-rule. If you extend it to eight months because you're anxious, but tell yourself "I'm being thorough", you are experiencing Deliberative Closure drift.

  ### Summary

  The concept you are looking for is the **termination of the meta-decision regress**. The closest established theoretical framework is **Type II Rationality**, but it assumes optimisation. The specific phenomenon of *unexamined termination* is best labelled **Deliberative Closure**.

  It is the moment you stop building the map and start walking, convincing yourself the map is finished when, in reality, you just put the pen down.
