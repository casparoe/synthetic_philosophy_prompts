answer: |-
  **Question 1**

  Consider the following case:

  Nadia has worked alongside the same consultant surgeon for four years. She testifies that he is kind, careful, and safe; she has no trauma history, no phobias, and insists she is not afraid of him "in any sense whatsoever." However, when they enter a lift together, her chest tightens, her palms sweat, and she drifts toward the door. This occurs only in the lift. She reports no experience of him as dangerous or frightening—no image, no thought, nothing that feels like an evaluation. When asked what the state is like from the inside, she says she genuinely does not know. She cannot distinguish the bodily pattern from fear, anger, or caffeine arousal, and agrees that if described to her abstractly, she could not identify it as fear. The response began six months ago, has not budged despite evidence from trusted colleagues that he is safe, and now leads her to take the stairs as a matter of routine without being able to say why.

  Critically evaluate what the Feeling, Judgment, and Perception-of-Value accounts imply about the metaphysical status of Nadia's state. Does this case refute any of these accounts? Finally, discuss whether the possibility of such a case matters for choosing between these theories, and whether a theory that rules out this case is thereby right or thereby better.

  (30 marks)

  ***

  **Model Answer**

  The case of Nadia presents a triangulation problem for the metaphysics of emotion, separating bodily arousal, evaluative judgment, and phenomenological seeming. Each of the three dominant accounts struggles to categorize the state without sacrificing a core commitment.

  For the Feeling Account, emotion is constituted by the perception of bodily changes. Nadia exhibits the somatic profile of fear (tightness, sweating), suggesting she is afraid. However, the account typically requires that these changes be felt *as* emotional. Nadia cannot identify the sensation, nor does she experience it as fear. If the theory insists on mere bodily disturbance, it conflates emotion with undifferentiated arousal (a Schachter-style error). If it requires awareness of the feeling as emotional, Nadia's state is not an emotion. The case suggests that bodily patterns alone are insufficient without a corresponding phenomenological uptake, weakening a pure somatic view.

  The Judgment Account faces the problem of recalcitrance. Nadia judges the surgeon safe, yet the response persists. Standardly, judgment theorists handle recalcitrant emotions by positing a split between occurrent judgment and dispositional evaluation. However, Nadia reports *no* evaluative phenomenology—not even a conflicting impression of danger. She drifts to the door without a "why." If the theory concedes this is fear, it must detach judgment from consciousness entirely, risking an empty definition where "judgment" is merely a functional label for avoidance behavior. If it denies this is fear, it must explain the avoidance without appeal to value. The case pressures the judgment view to admit arational causal mechanisms that look nothing like judging.

  The Perception-of-Value Account seems best positioned to handle the persistence despite judgment (modularity/encapsulation), similar to visual illusions. One can see a stick as bent in water while judging it straight. However, perceptualists claim emotions present value phenomenologically—they *feel* like danger. Nadia explicitly lacks this. She does not see the surgeon as threatening; she feels nothing but ambiguity. If the perceptual view claims this is fear, it severs the link between perception and phenomenology. If it claims this is not fear, it cannot explain the avoidance. The modularity resource saves the theory from the judgment contradiction but fails to account for the phenomenological void.

  Regarding possibility, is Nadia's state metaphysically coherent? It resembles a "blindsight" of emotion: functional output without conscious input. If such cases are possible, they suggest emotion is not a natural kind with necessary conditions across all three domains, but a cluster concept. If a theory rules this case out, is it better? A theory that rules it out claims conceptual precision: "If no phenomenology, no emotion." This protects the definition but risks dogmatism against empirical data. A theory that admits it gains explanatory scope but loses definitional sharpness.

  Ultimately, the case refutes none of the accounts absolutely but exposes their cost conditions. The Feeling Account must accept unconscious feeling; the Judgment Account must accept non-evaluative avoidance; the Perception Account must accept unconscious value perception. The best theory is not the one that rules the case out, but the one that explains the dissociation most parsimoniously. Given the lack of phenomenology, treating this as a full-blown emotion stretches all three accounts. It is likely a proto-emotional causal trigger rather than a constituted emotion. A theory that distinguishes between constituted emotions and arational affective triggers handles this best, preserving the link between emotion and consciousness while acknowledging the bodily data.

  ***

  **Marking Scheme**

  **Total Marks: 30**

  **Must-Hit Moves (6 marks each)**

  1.  **Feeling Account & Phenomenological Identification**
      *   **Requirement:** Must argue that while Nadia has the bodily profile, the lack of identification/awareness challenges the constitutive link between body and feeling. Must distinguish between mere arousal and felt emotion.
      *   **Typical Botch:** Treating the bodily symptoms as sufficient for fear without addressing her inability to identify them (confusing cause with constitution).
      *   **A/B Line:** A answers note that accepting this as fear forces the Feeling Account into a Schachter-style ambiguity error; B answers simply say "body says yes, so it's fear."

  2.  **Judgment Account & Recalcitrance Limits**
      *   **Requirement:** Must analyze whether this counts as recalcitrant emotion. Must note that standard recalcitrance involves *conflicting* evaluations, whereas Nadia has *no* evaluative phenomenology.
      *   **Typical Botch:** Asserting this is standard recalcitrance without noting the absence of any evaluative "seeming."
      *   **A/B Line:** A answers notice that conceding this forces the Judgment view to give up the claim that emotions involve *evaluations* rather than just behavioral dispositions; B answers say "judgment views handle recalcitrance easily."

  3.  **Perception Account & Modularity vs. Phenomenology**
      *   **Requirement:** Must evaluate the "illusion analogy." Must argue that modularity explains persistence despite judgment, but fails to explain the lack of phenomenological "danger seeming."
      *   **Typical Botch:** Claiming the illusion analogy solves the problem completely without addressing the missing phenomenology.
      *   **A/B Line:** A answers identify that modularity protects the theory from judgment contradiction but leaves the phenomenological void unexplained; B answers stop at "it's like a visual illusion."

  4.  **Metaphysical Possibility of the Case**
      *   **Requirement:** Must take a stance on whether this case is conceptually possible (e.g., emotional blindsight) or incoherent.
      *   **Typical Botch:** Ignoring the possibility question or treating it as purely empirical without metaphysical implication.
      *   **A/B Line:** A answers discuss whether the lack of phenomenology makes the state arational vs. irrational; B answers treat it as just a weird empirical case.

  5.  **Theoretical Virtue of Ruling Out Cases**
      *   **Requirement:** Must assess whether a theory that rules this out is "better" (precision) or "worse" (dogmatism). Must weigh explanatory scope against definitional strictness.
      *   **Typical Botch:** Concluding that ruling it out is simply "correct" without discussing the theoretical cost.
      *   **A/B Line:** A answers argue that ruling it out might preserve the concept of emotion but lose explanatory power regarding avoidance behavior; B answers say "if it doesn't fit the theory, it's not an emotion."

  **Penalty Flags (Deduct 5 marks per occurrence)**

  *   **Irrational/Arational Slide:** Treating Nadia's state as irrational (contrary to reason) when the prompt suggests it is arational (outside the space of reasons).
  *   **Schachter Confusion:** Treating the ambiguity of arousal (caffeine vs. fear) as settling the constitutive question rather than highlighting the need for cognitive labeling.
  *   **Name-Checking:** Using philosopher names (e.g., "James says," "Nussbaum argues") without adding argumentative weight. (The question asked for argument, not history).

  **Grade Boundaries**

  *   **27–30 (A):** Hits all 5 moves with precision. Explicitly navigates the A/B lines described above. No penalties.
  *   **22–26 (B):** Hits 4–5 moves but relies on standard "illusion analogy" or "recalcitrance" tropes without the specific phenomenological critique. May incur one penalty.
  *   **15–21 (C):** Hits 3 moves. Tends toward book-reporting the theories rather than applying them to the specific constraints of Nadia's phenomenology.
  *   **0–14 (D/F):** Fails to address the three accounts specifically or ignores the possibility/theory choice component.
