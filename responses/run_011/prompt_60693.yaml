      *   *The Flaw:* This is an epistemological argument (how we know) masquerading as an ontological one (what happened). Just because we *detect* collapse through records doesn't mean the *phenomenon* is the record. A non-literate complex society (e.g., Cahokia) *did* collapse (depopulation, dispersal) even if we only see it through potsherds.
