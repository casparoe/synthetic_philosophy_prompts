answer: |-
  Here is the teardown you asked for. I am treating this as a rigorous academic critique, not a pep talk.

  ### 1. Fact-Checking: Specific Sentences That Are Wrong or Overstated

  You have several claims that are either historiographically outdated or archaeologically contested. In an IA, these are easy marks for an examiner to deduct.

  *   **Section 1:** *"Jared Diamond's Collapse (2005) basically invented the modern idea that societies fail because they make bad environmental choices"*
      *   **Correction:** This is false. Thomas Malthus (1798) and Edward Gibbon (1776) laid this groundwork. Even in the 20th century, Roy Rappaport (*Pigs for the Ancestors*, 1968) was modeling ecological failure before Diamond. Diamond **popularized** the specific neo-Malthusian/environmental determinist version for a lay audience, but he did not invent the concept.
      *   **Fix:** Change "invented" to "popularized the specific environmental determinist framework."

  *   **Section 3 (Bronze Age):** *"Greek doesn't get written again for centuries until the Greeks reinvented writing."*
      *   **Correction:** "Reinvented" implies independent invention. The Greek alphabet was **adapted** from the Phoenician script in the 8th century BCE. It was not a reinvention of Linear B.
      *   **Fix:** Change "reinvented" to "adopted and adapted the Phoenician alphabet."

  *   **Section 3 (Bronze Age):** *"Sea Peoples... are treated as the cause"*
      *   **Correction:** This is outdated historiography. While Egyptian records *claim* they were the cause, modern archaeology (e.g., Cline, *1177 BC*) treats the Sea Peoples as a **symptom** of the collapse (migrants/refugees) rather than the sole cause. Systemic failure (drought, earthquake storms, trade disruption) is the current consensus.
      *   **Fix:** Acknowledge that modern archaeology views them as part of a systems collapse, not a singular invading army.

  *   **Section 3 (Rapa Nui):** *"Newer work says the palm forest went mostly because of the rats... and the population was more or less holding steady until Europeans"*
      *   **Correction:** This is the **Hunt & Lipo thesis (2011)**, and it is **heavily contested**. Other archaeologists (e.g., Mieth & Bork, 2012; Lament & McCall, 2020) argue for pre-contact deforestation and population decline based on soil erosion and charcoal data. Presenting the "stable until Europeans" claim as settled fact is risky.
      *   **Fix:** Hedge this. "Proponents of the revisionist view, such as Hunt and Lipo, argue..." Do not state it as objective truth.

  *   **Section 3 (Rapa Nui):** *"Obsidian points... look more like everyday tools."*
      *   **Correction:** Also Hunt & Lipo. Recent use-wear analysis is mixed. Some studies confirm tool use; others show impact damage consistent with warfare.
      *   **Fix:** Same as above. Hedge your language.

  ### 2. Does Point 4 Survive? (The Archive Argument)

  **Verdict:** It is your strongest philosophical point, but it is currently an **epistemological trap**.

  *   **The Problem:** You argue: *"A society with no writing and no stone temples can't collapse in Tainter's sense, because there's no baseline to measure a drop against."*
      *   **Why it fails:** Tainter defines collapse as a loss of *socio-political complexity*, not just writing. The **Mississippian culture (Cahokia)** collapsed (depopulation, dispersal, loss of hierarchy) without writing. The **Inca** collapsed (conquered by Spain, administration dismantled) using *quipu* (knot records), not text. If you say they "can't collapse," you are misusing Tainter.
      *   **The Fix:** Don't say they *can't* collapse. Say the **label** "collapse" is disproportionately applied to them. We notice the loss of the *archive* more than the loss of *calories*.
      *   **Refinement:** Your argument should be: "The *narrative* of collapse is a property of records." The *event* might be real (people starving), but the *historical categorization* is biased toward literate elites. This distinguishes the ontological reality (suffering) from the historiographical category (Collapse).

  ### 3. Is the "Layer Ledger" Original or Tainter with Extra Steps?

  **Verdict:** It is **not** wholly original, but it is a solid synthesis. You are walking into an existing debate.

  *   **The Precedents:**
      *   **Joseph Tainter (1988):** Already argues that collapse is often a "rational economizing" strategy for the commoners (shedding the cost of the elite). You are echoing this.
      *   **Arthur Demarest (Maya):** Specifically distinguished between the "collapse of the elite political system" and the "continuity of the peasant population."
      *   **James C. Scott (*Seeing Like a State*):** Argues that states only see the "legible" parts of society (taxable grain, registered people). When the state falls, the "illegible" people continue.
      *   **Michel-Rolph Trouillot (*Silencing the Past*):** Argues that the archive itself creates the silence.

  *   **Your Contribution:** Your specific framing of the **archive layer being the same as the evidence layer** (Point 4) is the unique part. Most people say "the poor are invisible." You are saying "the definition of collapse is circular because it relies on the survival of the very thing that collapsed (the archive)."
  *   **Advice:** Cite Scott or Demarest to show you know the literature, then pivot to your specific point about the **circularity of evidence**. That is your IA "hook."

  ### 4. Which Example to Cut?

  **Cut Rapa Nui.**

  *   **Reason 1 (Fit):** Your main argument is about **records, writing, and archives**. Rapa Nui had no deciphered state archive system (Rongorongo is undeciphered and likely late). Using a non-literate society to prove an argument about the bias of *written* records is contradictory.
  *   **Reason 2 (Risk):** As noted in the fact-check, the archaeology of Rapa Nui is currently a "war zone" between the Hunt/Lipo team and traditionalists. An IA examiner who knows Pacific archaeology will penalize you for presenting one side as fact.
  *   **Reason 3 (Strength):** The **Bronze Age** and **Maya** examples are much stronger for your specific thesis.
      *   **Bronze Age:** Perfect for "Writing stopped, people stayed." (Linear B vs. Greek villages).
      *   **Maya:** Perfect for "Monuments stopped, people stayed." (Southern lowlands vs. Northern polities/modern Maya).

  ### Summary of Actionable Changes

  1.  **Rewrite Section 1:** Acknowledge pre-Diamond environmental determinism.
  2.  **Rewrite Section 3 (Bronze Age):** Fix the "reinvented writing" error; nuance the Sea Peoples.
  3.  **Rewrite Section 3 (Rapa Nui):** **Delete it.** Replace with a sentence expanding on the Bronze Age or Maya evidence to strengthen the "layer" analysis.
  4.  **Refine Point 4:** Change "can't collapse" to "the *narrative* of collapse is inaccessible." Distinguish between the *event* (complexity loss) and the *detection* (archive loss).
  5.  **Add Citations:** You need to drop names to show this isn't just intuition. Mention **Demarest** (Maya), **Cline** (Bronze Age), and **Scott** (State legibility).

  **Final Word:** The core argument ("Collapse is a property of records") is IA-worthy, but only if you stop treating contested archaeology as settled fact and tighten the logic on *why* the record bias matters. Good luck.
