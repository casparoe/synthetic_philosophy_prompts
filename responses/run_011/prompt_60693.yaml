      *   *Section 3 (Maya):* "North (Chichen Itza) rises at roughly the same time." *Critique:* Timing is tricky. Chichen Itza's peak is often dated slightly later (Terminal Classic/Early Postclassic), but there is overlap. "Millions of Maya people are alive today." *Critique:* True (approx. 8 million). "What collapsed was a political geography." *Critique:* Standard revisionist view.
