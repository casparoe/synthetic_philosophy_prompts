      *   *Is "Collapse is about records" new?* Michel-Rolph Trouillot (*Silencing the Past*) talks about archive bias. James C. Scott (*Seeing Like a State*) talks about legibility. The specific application to "Collapse" as a historiographical category rather than an ontological event is closer to **Joseph Tainter** (who argues collapse is rational adaptation) and **Norman Yoffee & George Schwartz** (*The Collapse of Ancient States and Civilizations*, 1978 - they critiqued the concept early on). More recently, **Guy D. Middleton** and **Luke Lavan** have written specifically on "The End of the Roman Empire" being a transformation, not a collapse.
