  He boasts he never uses Dennett's skyhooks, and I believe him, because he prefers what I call promissory cranes—circuits credited with the lift before the mechanism is specified. For a decade he's handed me explanatory IOUs, insisting the crane works even though the blueprints are always payable upon completion of the next map. So let's toast to ten years of perfect credit, and hope the next decade finally pays cash for the lift.

  **Note on Liberties:**
  This joke flattens the scientific process by implying your partner is delaying specification intentionally, rather than acknowledging that identifying a circuit *is* a partial crane even before the full mechanism is understood. It also lets him off more easily than your actual distinction would: a "promissory note" implies the value will eventually be delivered, whereas your concern may be that pointing at a circuit is fundamentally the wrong *kind* of explanation, regardless of how much mapping is done.
