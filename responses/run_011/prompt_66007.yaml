answer: |-
  1. The listing stage most plausibly presupposes an institutional claim, because subsequent statutory provisions explicitly reintroduce economic weighing, indicating that costs are deferred rather than ignored. This division suggests the initial ban on economic data assigns fact-finding to biologists rather than asserting the species' value is infinite or incommensurable.

  2. The habitat provision's explicit balancing is consistent with the institutional reading, as it delegates cost-benefit analysis to the agency rather than denying economics relevance. However, the extinction exception functions as a risk-based constraint within that delegation, establishing a threshold that removes certain outcomes from balancing rather than weighting them.

  3. The exemption process reveals that while agencies manage routine trade-offs, the ultimate authority to weigh costs against species survival resides with the political branches, specifically Congress. This allocation is coherent under the institutional reading, as it reserves the most contentious value judgments for elected representatives rather than treating the initial listing as an absolute veto.

  4. The decision rule strictly requires the separation of scientific listing from economic exemption, but it leaves underdetermined the specific methodology for calculating habitat exclusion benefits. Rival rules, such as a pure risk-aversion model, could license the same science-only listing if motivated by distrust of economic data rather than a division of labor.

  5. Procedurally, listing would require admitting economic testimony and quantifying the species' survival value during the initial determination rather than deferring it. To maintain logical consistency with expected-value maximization, the habitat extinction threshold would also need replacement with a continuous cost function allowing high costs to outweigh extinction risks.
