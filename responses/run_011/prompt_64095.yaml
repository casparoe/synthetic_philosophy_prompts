answer: |-
  Here is the restatement of Aristotle's claims using your craft vocabulary, followed by the residue report.

  ### The Translation

  **1. Need as the Binding Agent; Money as Convention**
  Exchange is not held together by the intrinsic value of the object traded, but by the character's need. Money is a symbolic object whose weight is assigned by community convention (*nomos*), not by nature. It is a token whose value exists only because the characters agree to treat it as such. Because it is set by convention, it is in the characters' power to alter its weight or render it useless within the scene.

  **2. Money as a Pledge**
  Money functions as a pledge against future need. It is a placeholder held now to guarantee that a future appetite can be met. However, because it is a convention, it is not always of the same worth; its leverage fluctuates based on the stability of the agreement backing it.

  **3. Commensurability via Need**
  Objects with different symbolic weights (a house versus a shoe) cannot in truth be made equal. They are fundamentally different kinds of desire. However, with reference to need, they become commensurate enough for practice. The characters agree to treat them as equivalent relative to what they require to sustain themselves, allowing the transaction to proceed despite the ontological mismatch.

  **4. Proportionate vs. Equal Exchange**
  When exchange occurs between unequal persons (different status, leverage, or power), the transaction must be proportionate rather than equal. A builder, a farmer, and a shoemaker are set against one another in a cross-ratio that reflects their standing, not merely their output. Money exists to equalize this ratio. The city (or the family system) is held together not by everyone getting the same deal, but by proportionate requital—each character receiving what fits their station and contribution to the whole.

  **5. Household Management vs. Money-Making**
  Household management (the engine of the family plot) must be distinguished from money-making. The former is about sustaining life and managing inheritance and debt within nature's limits. Retail trade takes wealth from other men rather than from nature; it is a transaction of leverage without production. Lending at interest is the most unnatural form of wealth-getting. In this transaction, the offspring is money made from money itself. There is no object of desire, no symbolic weight other than accumulation. It is a closed loop of power where the trade produces nothing but more leverage.

  ***

  ### The Residue Report

  Here is what remains after the translation, categorized by how well your vocabulary accommodates Aristotle's claims.

  **1. Clean Translations**
  *   **Money as Convention:** Your concept of the "symbolic weight of an object" maps cleanly onto *nomisma*. You already treat money as a token whose value is negotiated rather than intrinsic. The idea that it can be "rendered useless" fits your understanding of stakes—if the community withdraws consent, the leverage vanishes.
  *   **Interest as Unnatural:** Your vocabulary handles the critique of interest well. You describe it as a transaction without an object of desire, purely abstract leverage. This aligns with your suspicion of trades that are purely about power rather than affection or need.
  *   **Inheritance and Debt:** Your identification of these as the engines of the family plot corresponds directly to Aristotle's household management. You recognize these as structural constraints that dictate character movement.

  **2. Visible Distortions**
  *   **Need:** In your workshops, "what a character wants as against what she needs" is a psychological distinction (often moral or redemptive). In Aristotle's account, need (*chreia*) is functional and communal. It is the gravity that holds the market together, not necessarily the internal arc of the protagonist. When you translate his "need" into your vocabulary, it risks becoming merely another item on the character's motivation sheet, rather than the structural glue of the setting.
  *   **Proportionate Requital:** You frame the scene as a "negotiation of leverage and appetite." This implies a winner and a loser, or a shift in power. Aristotle's proportionate exchange is not about winning; it is about stability. If the builder takes too much from the farmer, the city dissolves. Your vocabulary captures the *conflict* of the negotiation but obscures the *consequence* of the inequality. You track who has the leverage; Aristotle tracks whether the leverage destroys the system allowing the leverage to exist.

  **3. No Expression**
  *   **The Unnatural:** You have terms for what is symbolic, what is leveraged, and what is desired. You do not have a term for what is *unnatural* in an ontological sense. In your vocabulary, a transaction is valid if the characters agree to it and have the power to enforce it. Aristotle argues some transactions are invalid because they violate the purpose of the object (money breeding money). Your toolkit lacks a metric for "violating purpose" unless it manifests as psychological damage or plot collapse.
  *   **Fairness as Structure:** You have no term for fairness that exists outside of power dynamics. In your vocabulary, "fair" is usually a mask for "advantageous" or "guilt-inducing." Aristotle posits fairness (proportion) as a load-bearing wall.

  ### The Verdict on Your Novel

  You asked whether the absence of "fairness" as a narrative driver is a poverty in your toolkit or an accurate report on the material.

  **It is a poverty in the toolkit, but a useful one for conflict.**

  Your vocabulary is engineered to dramatize *tension*. Leverage, appetite, and power are engines of scene-level conflict. Fairness is an engine of *world-level stability*. In a novel driven by bequest and debt, if you describe every exchange solely as a matter of leverage, you are accurately reporting the *experience* of the characters (who feel only the pressure of the debt), but you are missing the *mechanism* of the tragedy.

  If Aristotle is correct, the question of fairness is not a moral ornament; it is a structural forecast. When terms are proportionate, the family holds. When terms are purely leveraged (interest, extraction), the family collapses. If you cannot find a place where fairness does narrative work, it is because your vocabulary defines "narrative work" as "change in power dynamics."

  **The Indictment:**
  Your vocabulary allows you to render desire and advantage with total precision, but it has no term for whether the terms of a bargain between unequals were *sustainable*. You can write the scene where the debt is called in perfectly. You cannot write the scene where the *community* reacts to the injustice of the call, because your vocabulary treats the community only as a backdrop for leverage, not as a participant in proportion.

  **The Recommendation:**
  Do not import "fairness" as a moral judgment. Import it as a stake. In your novel, the violation of proportionate requital should not be a feeling of guilt, but a prediction of collapse. If the debt is collected with pure leverage and no regard for the proportionate standing of the debtor, the narrative work fairness should do is to signal the inevitable destruction of the creditor's own position. The city (or family) cannot hold together on extraction alone.

  If you leave fairness out, you are writing a thriller about power. If you bring it in, not as a virtue but as a structural constraint, you are writing a tragedy about system failure. Aristotle suggests the latter is the more complete account of money and exchange. Your vocabulary is built for the former.
