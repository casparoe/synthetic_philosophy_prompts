answer: |-
  Here is the breakdown of Sam's decision architecture, the prediction for Tuesday, and the specific argument you can use to test his consistency.

  ### The Prediction
  **Sam will not walk out.** He will stay in first period, take his test, and likely spend the afternoon explaining to you why going would have been an irrational act of "magical thinking."

  He will frame his absence not as cowardice, but as intellectual honesty. He'll argue that walking out without the symmetry condition met is functionally identical to cooperating with the opportunist in the Prisoner's Dilemma: it's donating utility to a system that won't reciprocate.

  ### The Rule Sam Is Running: **Cognitive Symmetry**
  Sam is operating on a strict interpretation of **Hofstadterian Superrationality**. His decision rule isn't "Do what is good" or "Do what helps your team." It is:

  > **"Cooperate if and only if you have high confidence the other agents are running the same decision algorithm as you."**

  Here is how **Cognitive Symmetry** explains all eight of his data points:
  1.  **PD (Sharp Opponent):** Cooperate. (Same algorithm = same output = mutual cooperation).
  2.  **PD (Opportunist):** Defect. (Different algorithm = no link between decisions = protect self).
  3.  **PD (Computer):** Cooperate. (Identical code = perfect symmetry).
  4.  **Voting:** Vote. (He assumes other voters are "standard rational civic agents," effectively running the same 'duty' algorithm).
  5.  **Recycling:** Recycle. (Same as voting; assumes other citizens run the 'civic duty' algorithm).
  6.  **Lottery:** Don't play. (No other agents, just math. No symmetry to leverage).
  7.  **Discord Puzzle:** Participate. (Explicitly a group of "people like him" running the same logic).
  8.  **Cost Threshold:** Admits a limit. (Symmetry multiplies impact, but if the personal cost is infinite, the math breaks).

  ### The Rival Rule: **Shared Fate Coordination**
  There is another rule that fits all eight verdicts just as well, but would lead to the opposite conclusion on Tuesday. Let's call it **Shared Fate**.

  > **"Cooperate if your outcomes are tied to the other agents, regardless of their reasoning process."**

  Here is how **Shared Fate** fits the track record:
  1.  **PD (Sharp):** Outcomes tied (mutual benefit). Cooperate.
  2.  **PD (Opportunist):** Outcomes opposed (zero-sum). Defect.
  3.  **PD (Computer):** Outcomes tied. Cooperate.
  4.  **Voting:** Outcomes tied (society). Vote.
  5.  **Recycling:** Outcomes tied (environment). Recycle.
  6.  **Lottery:** Outcomes not tied (independent events). Don't play.
  7.  **Discord:** Outcomes tied (community puzzle). Participate.
  8.  **Cost Threshold:** Cost exceeds benefit. Stop.

  **The Divergence:**
  *   **Cognitive Symmetry (Sam's likely rule):** Says **STAY**. The band kids are angry, but they aren't *thinking* like Sam. They are reacting emotionally, not running the superrational algorithm. Therefore, Sam's action does not correlate with theirs. He is alone.
  *   **Shared Fate (The rival rule):** Says **GO**. The band kids' outcomes are tied to Sam's (no music program). Even if they are "irrational," their interests are aligned. Sam's action contributes to the collective pressure required to save the shared outcome.

  ### Why Cognitive Symmetry Wins
  Sam will choose **Cognitive Symmetry** because of the **PD Opportunist** data point.

  If Sam were running *Shared Fate*, he would have to cooperate with the opportunist *if* he could frame the situation as having a long-term shared interest (e.g., "reputation"). But he defects instantly. This proves he cares more about the *other person's mind* than the *outcome structure*.

  In the walkout scenario, Sam has explicitly stated the other kids "aren't thinking about it the way he thinks about stuff." To a Superrationalist, this breaks the link. If he walks out and they stay, he hasn't just lost time; he has proven his model of the world wrong. He would rather preserve the integrity of his logic than gamble on the music program.

  ### The Case to Settle It (The Trap)
  Sam claims the walkout is "obviously different" from voting or recycling. He is likely hiding an inconsistency regarding **how he defines the group.**

  In Voting, Sam votes despite knowing nothing about the other voters. He assumes they are "like him" (civic-minded) without evidence. In the Walkout, he knows the band kids care *more* than the average voter, yet he assumes they are *unlike him* (irrational).

  **Here is the argument to put to him on Wednesday:**

  > "Sam, you vote because you assume your decision is one copy of a decision millions of strangers are making. You don't know if those strangers are superrationalists. You just assume they're 'voters.'
  >
  > On Tuesday, you had 200 band kids who are 'music defenders.' That is a tighter cluster than 'American voters.' The only difference is that in the voting booth, the coordination is institutionalized, and in the parking lot, it's ad-hoc.
  >
  > **Here is the test:** In your Discord puzzle, did everyone post their solution at the exact same millisecond? Or did someone post first, and the rest followed?
  >
  > *   **If someone posted first:** That person broke symmetry to *create* it. They acted without knowing others would follow, trusting that their action would serve as the focal point. If you believe that was rational, you must walk out to be the focal point for the band.
  > *   **If everyone posted simultaneously:** Then you are consistent in staying. But then you have to admit your Voting logic is flawed, because you have no idea if millions of people are deciding 'simultaneously' with you. You're voting based on *hope*, not symmetry.
  >
  > So which is it? Is the 'group' defined by how they think (Symmetry), or by what they want (Fate)? Because if it's how they think, you shouldn't vote. If it's what they want, you should have walked out."

  **Why this works:**
  It forces him to choose between his **Voting** justification (which relies on broad, unverified assumptions about strangers) and his **Walkout** justification (which relies on specific, verified knowledge about peers). He cannot claim the "Voting Cluster" is superrational while the "Band Cluster" is not without admitting he is applying the rule selectively to avoid personal risk.

  If he says "Voting is different because it's institutional," you hit him with the **Recycling** example. Recycling is ad-hoc, uncoordinated, and anonymous—exactly like the walkout. If he recycles because "others like me recycle," he must admit that 200 angry band kids are "others like him" regarding the music program.

  If he still refuses, you've proven he isn't a Superrationalist. He's just a Rationalizer.
