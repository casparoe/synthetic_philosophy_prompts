  *(Final check on the "Convergence" claim)*: This is the crux. The passage treats it as a fact ("First, idealization converges"). In philosophy, this is the "Convergence Thesis" and is heavily debated (e.g., by Sharon Street). I must be firm that this is *not* settled.

