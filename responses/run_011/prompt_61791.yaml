answer: |-
  ### Part I: The Control-Theoretic Restatement of the Sen Thesis

  **System Definition:**
  The "Famine Prevention System" is a closed-loop control architecture where the Process Variable (PV) is *population caloric intake*, the Setpoint (SP) is *minimum survival threshold*, and the Manipulated Variable (MV) is *food distribution/logistics*. The Controller is the *State Administration*. The Disturbance Input is *harvest yield/weather*.

  **The Core Argument:**
  Sen's claim translates to: Famines are not caused by Disturbance Inputs exceeding the system's design envelope (weather/harvest failure). They are caused by architectural faults in the Controller that decouple the PV from the MV, rendering the system uncontrollable despite adequate process capacity. Specifically, they are failures of **observability** and **feedback gain**.

  **1. Entitlement as Control Authority**
  In your vocabulary, "entitlement" is not a legal status; it is **control authority**. A population starves not because the total mass balance of food is negative, but because their transfer function to the food supply has a gain of zero. The food exists (PV global > SP global), but the local actuators (markets, rationing) are saturated or disconnected for specific sub-loops. The system is stable for the aggregate, but unstable for the node.

  **2. Democracy as Redundant Feedback Loops**
  Sen's claim that democracies don't famine is a claim about **sensor redundancy** and **negative feedback**.
  *   **Free Press:** High-bandwidth, independent sensors. They provide state estimation that bypasses the official chain of command. They reduce measurement latency and prevent **sensor masking**.
  *   **Elections:** Integral action with a long time constant. They reset the controller bias. If the error (starvation) persists, the integral term accumulates until the Controller (government) is replaced.
  *   **Authoritarianism:** This is **open-loop control** or **single-sensor operation**. The Controller relies solely on internal state estimation. If the internal sensors are compromised, the Controller operates on false data with no external correction.

  **3. Case Studies as Control Failures**

  *   **Bengal (1943): Priority Masking and Sensor Suppression**
      *   **Architecture:** Multi-input controller (War Effort vs. Civilian Welfare).
      *   **Failure:** The "War Effort" loop was tuned with high proportional gain; the "Civilian" loop was deprioritized.
      *   **Sensor Masking:** Colonial censorship acted as a **filter** on the feedback signal. Reports of starvation were attenuated before reaching the Controller (Delhi/London).
      *   **Actuator Sabotage:** The "Denial Policy" (destroying boats/rice) was an intentional reduction of **actuator bandwidth** in the local distribution network.
      *   **Diagnosis:** This was not a disturbance rejection failure. It was a **priority interlock** design where the safety system (famine relief) was overridden by the operational system (logistics for war). The system behaved exactly as specified, but the specification prioritized munitions over calories.

  *   **Ireland (1840s): Rigid Logic and Actuator Directionality**
      *   **Architecture:** Laissez-faire economic algorithm.
      *   **Failure:** The Controller logic contained a hard constraint: "Do not interfere with market prices." This created a massive **deadband**. Even when the error (starvation) was large, the control output (intervention) remained zero because the PV (price) remained within the "free market" limits.
      *   **Actuator Directionality:** Ships carrying grain left Ireland. The actuators (transport) had capacity, but the control signal directed flow *out* of the high-error zone.
      *   **Diagnosis:** The system suffered from **integral windup** in the suffering population, while the Controller remained in manual mode, refusing to close the loop. The failure was algorithmic rigidity (ideology) preventing gain scheduling.

  *   **China (Great Leap Forward): Positive Feedback and Sensor Spoofing**
      *   **Architecture:** Centralized planning with local reporting.
      *   **Failure:** **Positive feedback loop**. Local cadres reported high yields to please the Central Controller. The Central Controller, seeing high yields, increased procurement quotas. This increased the disturbance on the local nodes, causing more starvation, which led to more desperate lying to avoid punishment.
      *   **State Estimation:** The Central Controller's state estimator was fed **spoofed sensor data**. The system was **unobservable**; the true state (starvation) was mathematically indistinguishable from the reported state (surplus) given the sensor topology.
      *   **Redundancy:** No independent sensors (press) existed to cross-verify the local reports.
      *   **Diagnosis:** A classic instability caused by coupling the control signal to the sensor calibration. The system oscillated into a limit cycle of death because the negative feedback path was severed.

  ***

  ### Part II: The Residue Report

  You asked for strictness. Here is the audit of the translation.

  #### 1. Clean Translations (Signal Sharpening)
  These concepts map cleanly and make Sen's sociological arguments more rigorous.

  *   **Observability/Sensor Spoofing:** Sen's "free press" argument is vague politically but precise engineering-wise. A system without independent sensors is unobservable. This clarifies *why* authoritarianism starves: it's not just "evil," it's mathematically blind. The China case is significantly sharper when described as sensor spoofing leading to estimator divergence.
  *   **Actuator Saturation vs. Gain:** Distinguishing between "no food" (saturation) and "no access" (gain = 0) is the exact engineering equivalent of Sen's Entitlement Approach. It kills the "Food Availability Decline" (FAD) theory cleanly.
  *   **Priority Interlocks:** The Bengal case is best understood as a safety interlock being bypassed. In process safety, if you bypass a high-high level alarm to keep production running, and the tank ruptures, that is an operational decision, not an accident. This maps perfectly to the "Denial Policy."

  #### 2. Distorted Translations (Forced Assertions)
  Here, the engineering vocabulary forces you to assert things Sen does not, or changes the nature of the claim.

  *   **The "Controller" Homunculus:** Engineering vocabulary presumes a Controller (a PLC, a DCS, a logic block). In history, the "State" is not a single unit. It is a distributed, contentious network of agents. By modeling the British Government or the CCP as a single "Controller," you smooth over internal friction. Sen acknowledges bureaucratic chaos; the control model implies a coherent logic that may not have existed.
  *   **Stability vs. Justice:** Control theory optimizes for stability and setpoint tracking. It is agnostic to the morality of the Setpoint. If the Setpoint is "Maximize Steel," the system is "successful" if it maximizes steel, even if people starve. Sen argues the Setpoint *itself* is criminal. The engineering model describes the *mechanism* of the failure, but it struggles to label the Setpoint choice as "wrong" rather than just "risky" or "unstable."
  *   **Intentionality as Tuning:** In engineering, if a gain is set too low, it's usually a tuning error or a constraint. In your argument, it is a crime. The vocabulary describes the *state* of the system (low gain) but cannot distinguish between *negligence* (bad tuning) and *malice* (intentional gain reduction). Both look identical on a Bode plot.

  #### 3. The Untranslatable Residue (The "Crime" Gap)
  This is the critical failure mode of the translation.

  *   **Moral Agency:** There is no variable for "Guilt." A system failure is a description of physics and logic. A crime is a description of intent and norm violation. You can prove the system was designed to starve (design spec), but engineering cannot prove the *designer* knew it would starve people and didn't care. That requires psychology or law, not control theory.
  *   **The "Designer" Presumption:** You flagged this, and it is the pivot point.
      *   *The Presumption:* Control systems do not evolve; they are specified. By using this vocabulary, you implicitly assert **there was a Designer**.
      *   *The Friend's Counter:* Your friend argues the system *evolved* (emergent behavior). If there was no Designer, there was no Criminal, only a complex adaptive system that collapsed.
      *   *The Verdict:* The engineering vocabulary **smuggles in your conclusion**. It forces the history into a box where someone *wrote the code*. If you prove the code was buggy, you imply a programmer. If the programmer was the State, you imply State Responsibility.
      *   *Is this a defect?* It is a defect if the history was actually emergent chaos (Friend's view). It is evidence if the history was actually centralized planning (Your view).
      *   *Reality Check:* In Bengal, Ireland, and China, there *were* specific architects (Churchill's war cabinet, Peel/Treasury, Mao). The "Designer" presumption is historically valid here. The vocabulary doesn't lie, but it does assume centralization that might not apply to other famines (e.g., stateless regions).

  #### 4. Final Diagnostic: Who Wins the Argument?

  The translation validates your intuition **only if** you accept that "Design Choice" equals "Crime."

  *   **For your Friend:** The control model supports his view that "nobody starves anybody." It shows starvation as a system output resulting from loop dynamics, saturation, and sensor loss. It looks like a mechanical failure. He can say, "See? It's just a feedback loop gone unstable."
  *   **For You:** The control model supports your view that "safeguards were disabled." In engineering, safety systems (interlocks, redundancy) are not accidental; they are specified. If they are missing, someone signed off on the P&ID (Piping and Instrumentation Diagram). If the "Democracy Sensor" was removed, or the "Famine Interlock" was bypassed, that is a **modification order**.

  **The Smoking Gun:**
  In process safety, if you bypass a safety interlock to increase throughput, and an explosion occurs, that is not an "accident." It is a **violation of safety case**.
  The control vocabulary allows you to reframe Sen's moral argument as a **Safety Case Violation**.
  *   **Friend:** "The tank ruptured due to pressure." (Physics)
  *   **You:** "The pressure relief valve was locked shut by the operator." (Procedural/Criminal)

  **Conclusion:**
  The vocabulary does not prove "Crime" in the legal sense (mens rea). But it proves **Specification**. It demonstrates that the famine was not an *external disturbance* (weather) that overwhelmed a robust system, but an *internal architecture* that lacked the necessary redundancy to handle normal disturbances.

  If your friend argues "a system simply fails to hold," your engineering response is: **"Systems do not lack redundancy by accident. Redundancy is a cost. Someone chose not to pay it."**

  That is where the translation holds. The residue isn't a defect in your vocabulary; it's the exposure of the cost-benefit analysis that your friend is calling "nature."
