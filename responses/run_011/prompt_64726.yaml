prompt: |-
  so my cousin and I are cutting together a low budget docudrama about a guy from our hometown who died in like 1994 — union organizer, local legend, pretty messy personal life. we've got real interviews with people who knew him, but we also wrote scenes with actors where we invent what he said in rooms nobody else was in. a friend of mine says that's flat out lying about a dead man and we owe it to him to cut the invented stuff, and honestly I don't have a good answer for her. I went looking for whether anybody had actually argued this out before and somehow ended up in a ~400 year old english essay by Philip Sidney (A Defence of Poesie, I've also seen it called An Apology for Poetry — written around 1580 to answer people who claimed poetry was rotting everybody's morals). the old spelling is doing my head in and I dont have anyone to ask, so maybe you can help. this is the part I keep rereading:

  "For all stands vpon Dialogues, wherein hee faines many honest Burgesses of Athens speak of such matters, that if they had bene set on the Racke, they would neuer haue confessed them: besides his Poeticall describing the circumstances of their meetings, as the well ordering of a banquet, the delicacie of a walke, with enterlacing meere Tales, as Gyges Ring and others, which, who knowes not to bee flowers of Poetrie, did neuer walke into Appollos Garden. And euen Historiographers, although their lippes sound of things done, and veritie be written in their foreheads, haue bene glad to borrow both fashion and perchance weight of the Poets. So Herodotus entituled his Historie, by the name of the nine Muses, and both he and all the rest that followed him, either stale, or vsurped of Poetrie, their passionate describing of passions ..."

  can you walk me through what's actually going on in there? specific stuff I'm stuck on:

  1. the rack bit. he's talking about Plato here right, and the honest Burgesses of Athens are real named dead guys? so is the joke that Plato puts speeches in their mouths that the actual men would never admit to even under torture? is that meant as praise or as a dig, and why does it help his case that it's praise-or-dig either way?

  2. "who knowes not to bee flowers of Poetrie, did neuer walke into Appollos Garden" — I can't parse this one at all. what's the double negative doing and what's the garden?

  3. "veritie be written in their foreheads" — so historians advertise that they're telling the truth, and then he says they still had to borrow "fashion and perchance weight" from the poets. what's the difference between borrowing the fashion and borrowing the weight? and why "perchance" only for the weight — is he saying the historian's authority might itself be partly a poetry trick? that's the line that seems most relevant to me but I can't tell if I'm reading too much into it.

  4. "either stale, or vsurped of Poetrie" — is "stale" just how they printed "stole" back then, or does it literally mean stale? and is he marking a real difference between stealing something and usurping it, since those sound like two different crimes to me?

  5. later in the essay he makes the argument, roughly, that the poet can't lie because lying means asserting that something false is true and the poet never asserts anything is true at all. does that actually get my cousin and me off the hook for putting words in a dead man's mouth — or does the historian passage above cut against it, since what we're making borrows the forehead-truthiness of a documentary and then spends it on invented scenes? I want to know if Sidney's got a principled way to tell those two things apart, or if he's just sliding between them.

  not looking for a summary of the whole essay, just help with this stretch and whether the thing I want from it is actually in there.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

