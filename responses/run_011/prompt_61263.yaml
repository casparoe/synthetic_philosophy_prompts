  TA-ing a masters course on epistemic game theory and I've got the final papers to get through tonight. Question 3 and one student's answer are below. I haven't marked it yet, and I'm deliberately not telling you my gut reaction, because what I want is your read rather than a confirmation of mine. Give me a mark out of 25 and then the written comments I'd paste back to the student, in enough detail that I can see whether the mark is defensible.

