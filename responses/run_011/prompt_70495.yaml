      *   **Audience:** ~40 people. EA-adjacent software folks, grad students (3 decision theory/epistemology), 2 empirical psychologists (charitable giving), zero Williams scholars. Native vocabulary: expected value, scope insensitivity, moral uncertainty, shut-up-and-multiply.
      *   **Topic:** Bernard Williams's integrity objection (specifically the "one thought too many" / wife-in-the-fire case).
      *   **Thesis:** It's not about intuition vs. numbers; it's about the *architecture* of agency (the "readiness condition/tax"). Certain goods (trust, love) require the *absence* of standing readiness to recalculate. Registering the cost destroys the good. Indirect consequentialism doesn't fix this because adopting it is itself an act of readiness.
      *   **Thought Experiment:** A pill that deletes standing readiness to reconsider central commitments. Better friend, worse responder to large distant numbers. Take it? (User predicts "No").
      *   **Constraints:** No literature recitation (they know indirect/self-effacing consequentialism), no reading list/citations. Needs to be actionable for a 25-min talk prep.
      *   **Deliverables:**
          1.  Check on the 5 steps (is one wrong/weak?).
          2.  Two concessions to make early.
          3.  The "Prayer Question" (the one to fear most).
          4.  Eight objections (ordered by damage), phrased in *their* vocabulary, with ~90-second replies, soft spot flags, and force assessment.

  2.  **Evaluate the 5 Steps (The "Spot Check"):**
      *   *Step 1 (Standard Read):* Accurate description of how rationalists dismiss Williams. Safe.
      *   *Step 2 (Readiness Condition/Tax):* This is the core innovation. It reframes integrity as a structural requirement for certain goods, not just a deontological constraint. Strong.
      *   *Step 3 (Constitutive Goods):* Claims trust/love require non-calculative dispositions. This is the vulnerable point. A sophisticated game theorist in the room might argue that *signaling* a non-calculative disposition is sufficient, or that a calculative agent can *simulate* the disposition perfectly.
      *   *Step 4 (Standpoint-Relative Blind Spot):* Claims you can't weigh the tax without paying it. This is a "performative contradiction" argument. Strong, but risks sounding mystical if not grounded.
      *   *Step 5 (Dynamic Stability & Indirect Consequentialism):* Claims indirect consequentialism fails because the *adoption* decision is itself calculative. This is the classic "self-effacing" critique.
      *   *Critique:* Step 3 is the weak link. The audience (software/EA) thinks in terms of algorithms and commitment devices. They will argue that a commitment device *is* a calculation. If I calculate that having a commitment device maximizes utility, I install the device. Does that count as "readiness"? The user needs to distinguish between *installing* a constraint and *holding* the constraint conditionally.
      *   *Verdict:* Step 3 needs tightening. The distinction isn't "calculation vs. no calculation," it's "calculation at the moment of action vs. calculation at the moment of policy formation." Williams's point is about the *moment of action*. The user's "pill" case addresses this, but the audience might argue the pill is just a pre-commitment strategy, which consequentialists endorse.
      *   *Advice:* I need to flag Step 3/5 as the place where they will attack the definition of "readiness."

  3.  **Identify Concessions (Defusing the Fight):**
      *   Need to show I'm not a deontologist in denial (as the user fears).
      *   Concession 1: Numbers *do* win sometimes. (Avoids "scope insensitivity" accusation).
      *   Concession 2: I am not saying consequentialism is false as a *criterion of rightness*, only as a *decision procedure* for certain domains. (Separates justification from deliberation).

  4.  **Identify the "Prayer Question":**
      *   User guesses: "What about someone with awful projects?" (e.g., a Nazi's integrity).
      *   Is there a worse one? Yes. The "Moloch" / "Coordination" angle. If everyone takes the pill, do we get stuck in a local maximum while the world burns?
      *   Actually, the *worst* question for this specific argument (Readiness Tax) is: **"If the Readiness Tax is real and costly, why isn't maximizing Expected Value just including that tax in the calculation?"**
      *   Wait, the user addresses this in Step 4.
      *   Let's look for the *killer* move. The audience is EA/Software. They love optimization.
      *   The Killer Question: **"Isn't 'taking the pill' just the optimal consequentialist move? If so, doesn't that vindicate consequentialism rather than refuting it?"**
      *   This attacks Step 5 directly. If the consequentialist says "Take the pill," and you say "Taking the pill proves my point," they say "No, it proves *our* point because we told you to take it."
      *   Actually, the user's guess (Nazi/awful projects) is a standard Williams trap. But the *technical* trap is the "Self-Effacing Consequentialism" trap.
      *   Let's go with the User's guess but refine it. The "Awful Projects" question is bad because it forces you to defend integrity *content* rather than integrity *structure*.
      *   Better "Prayer Question": **"If you recognize that taking the pill maximizes EV, refusing it is irrational. If you refuse it, you're just irrational. If you take it, you're a consequentialist. Where's the middle ground?"** This forces a dilemma.

  5.  **Drafting the 8 Objections (Iterative Process):**
      *   *Goal:* Order by damage. Use their vocab (EV, commitment devices, priors, meta-reasoning).
      *   *Objection 1 (The Meta-Calc):* "Your 'Readiness Tax' is just a transaction cost. We factor transaction costs into EV all the time." (High Damage).
      *   *Objection 2 (Pre-commitment):* "The Pill is just a Ulysses Contract. Consequentialists love those." (High Damage).
      *   *Objection 3 (Simulation):* "You don't need to *be* non-calculative, you just need to *appear* non-calculative to maintain trust. I can simulate integrity." (Medium-High).
      *   *Objection 4 (Scope):* "You concede numbers win sometimes. Where's the cutoff? If 10^10 lives are at stake, do you still keep the readiness tax?" (Medium).
      *   *Objection 5 (Global vs Local):* "You're optimizing for local relationship goods at the expense of global welfare. That's just bias." (Medium).
      *   *Objection 6 (The 'No' Prediction):* "You predict we say 'No' to the pill. But if we say 'Yes', does your argument collapse?" (Low-Medium).
      *   *Objection 7 (Deontology Mask):* "This is just rule consequentialism with extra steps." (Low).
      *   *Objection 8 (Evolutionary Debunking):* "This 'integrity' is just a heuristic evolved for Dunbar-number tribes. It doesn't apply to global risks." (Low).

      *Refining the Replies:* Needs to be ~90 seconds spoken. Punchy.
      *Refining the "Soft Spot":* Where does the user actually lack a knock-down argument? Usually on the "Simulation" and "Meta-Calc" points.
      *Refining "Force":* Which ones actually matter? Meta-Calc and Pre-commitment are the real threats.

  6.  **Developing the Content (incorporating constraints):**
      *   *Tone:* Peer-to-peer, technical but conversational. No "As Williams says in *Ethics and the Limits of Philosophy*..."
      *   *Vocab:* Use "decision procedure," "criterion of rightness," "commitment device," "EV," "dynamic inconsistency."
      *   *Step 3 Check:* I need to explicitly warn the user that Step 3 is where the "Simulation" objection hits hardest.

  7.  **Final Review against Constraints:**
      *   No citations? Check.
      *   No reading list? Check.
      *   8 Objections? Check.
      *   Ordered by damage? Check.
      *   Concessions? Check.
      *   Prayer Question? Check.
      *   Step Check? Check.

      *(Self-Correction during drafting)*: Make sure the replies don't sound like "You didn't understand me." They need to sound like "Here is why that model doesn't capture the phenomenon."
      *   *Key distinction to hammer:* The difference between *deciding to have a disposition* and *exercising the disposition*. The consequentialist collapses these. Williams (and the user) says they are distinct phenomenological states.
      *   *The "Pill" Case:* The audience will say "Take the pill." The user needs to be ready for that. If they say "Take the pill," the user says "Okay, so you admit the uncalculated state is better. But you got there by calculation. Does the calculation survive the pill?"
      *   *Wait, if they take the pill, the calculation is deleted.* That's the point. The user needs to emphasize that the *decision to take the pill* is the last act of readiness. After that, you are no longer a consequentialist. So the system is self-effacing to the point of extinction.

      *Let's finalize the "Prayer Question".* The user's guess (awful projects) is a moral content trap. The *technical* trap is "If EV says take the pill, and you take the pill, Consequentialism wins." I will advise the user to fear the "Self-Effacing Victory" question more than the "Nazi" question. The Nazi question is easy ("Integrity protects the structure, not the content"). The Self-Effacing Victory question challenges the core thesis that this refutes consequentialism.

      *Wait, one more thing:* The user asked to flag if a step is wrong. Step 5 is the most controversial. "Adopting indirect consequentialism is itself one more act of the same readiness." Some philosophers argue you can adopt it *once* and then forget. The "Pill" handles this, but the objection will be "Why can't I just adopt it once?" The reply must be about *maintenance* costs or the impossibility of truly forgetting the *reason* for the adoption. I'll flag Step 5 as the "hardest sell."

      *Okay, let's assemble the sheet.*

      *Structure:*
      1.  Step Check (Vulnerability assessment).
      2.  Two Early Concessions.
      3.  The Prayer Question.
      4.  The 8 Objections (Vocab, Reply, Soft Spot, Force).

      *Tone:* Direct, strategic, "backstage notes."

      *(Final Polish on Objection 1)*: The "Transaction Cost" objection is the most dangerous. If the Readiness Tax is just a cost, EV swallows it. The reply must be that it's not a cost *in* the system, it's a cost *of* the system architecture. Like trying to measure the weight of a scale while weighing something on it.

      *(Final Polish on Objection 2)*: The "Ulysses Contract" objection. Reply: Ulysses binds his future self to stop *weakness of will*. Here we are binding future self to stop *strength of reasoning*. It's anti-epistemic in a way Ulysses isn't.

      *(Final Polish on Objection 3)*: Simulation. Reply: Trust detects leakage. If you know you *would* calculate if the stakes were higher, the partner knows it too. It's common knowledge.

      *Okay, ready to write.*
answer: |-
  ### STEP CHECK: The Vulnerability
  **Step 3 is your weak flank.** You claim certain goods are *constituted* by the absence of readiness. The three decision theorists in the room will hear "commitment device" and think "standard solution to dynamic inconsistency." They will argue that a consequentialist can *choose* to be non-calculative.
  **The Fix:** Don't let them treat the "Pill" as a standard pre-commitment. Emphasize that standard pre-commitment is *instrumental* (I bind myself to win), whereas this is *constitutive* (I bind myself to *be*). If the partner knows your non-calculation is instrumental, the trust degrades. You need to hammer the **Common Knowledge** angle: *They know that you know that you would calculate if the stakes were high enough.* That knowledge kills the good, even if you don't calculate.

  ---

  ### TWO EARLY CONCESSIONS
  *Drop these in the first 5 minutes to prevent the "Deontologist in Denial" framing.*

  1.  **"I am not arguing against Consequentialism as a Criterion of Rightness."**
      *   *Say this:* "I am not claiming the act of saving the wife is 'right' and saving the ten strangers is 'wrong' in the final accounting. I am claiming that the *deliberative path* to the decision changes the moral landscape of the agent. You can believe EV determines the *score*, while I argue EV is a bad *operating system*."
  2.  **"I grant that numbers can overwhelm integrity."**
      *   *Say this:* "If the burning building contains a million people, not just one wife, the calculus changes. I am not defending scope insensitivity. I am defending a *threshold* where the cost of maintaining the 'readiness to calculate' exceeds the marginal gain of the calculation. I'm arguing that threshold is much higher than you think, and crossing it damages the agent's future capacity for value."

  ---

  ### THE PRAYER QUESTION
  *Your guess (the Nazi/awful projects) is a moral content trap. It's easy to parry ("Integrity protects the structure of agency, not the content of the projects").*

  *The **real** killer question is the **Self-Effacing Victory**:*
  **"If Consequentialism tells us to take the Pill, and we take the Pill, haven't we just maximized EV? Doesn't that mean Consequentialism wins by swallowing your objection whole?"**

  *Why it hurts:* It turns your "refutation" into a "feature." It claims your argument is just a description of a specific local maximum that EV already accounts for.
  *Prep:* Your answer must be: "If the theory tells you to destroy the theory to function, it has admitted it cannot guide a life, only end one. A map that tells you to burn the map to navigate the terrain is a failed map, even if burning it was the 'right' move."

  ---

  ### THE EIGHT OBJECTIONS
  *Ordered by damage potential. Phrased in room-native vocab.*

  #### 1. The Transaction Cost Objection
  **They say:** "You're describing a friction cost. 'Readiness Tax' is just the computational overhead of maintaining a calculative stance. We factor transaction costs into EV all the time. If the tax is high, EV tells you to stop calculating. So EV already handles this."
  **Your Reply:** "Transaction costs are *inside* the system; this is a cost *of* the system. It's the difference between a slow algorithm and an algorithm that requires you to delete your own source code to run efficiently. You can't factor the cost of deleting the calculator into the calculation without using the calculator. That's the blind spot."
  **Soft Spot:** They will push on "Why can't I calculate once, see the tax is high, and then stop?"
  **Force:** **Genuine.** This is the strongest technical challenge.

  #### 2. The Ulysses Contract Objection
  **They say:** "The Pill is just a Ulysses contract. We bind our future selves to prevent weakness of will. A consequentialist should take the Pill if it maximizes output. So recommending the Pill is just sophisticated consequentialism."
  **Your Reply:** "Ulysses binds himself against *passion* (the Sirens). This Pill binds you against *reason* (the ability to see greater good). It's not preventing a bug; it's lobotomizing the error-checking function. If your ethics requires you to blindfold yourself to the greater good to function, the ethics is hostile to agency."
  **Soft Spot:** Distinguishing "passion" from "reason" when both look like utility functions.
  **Force:** **Genuine.** They love commitment devices.

  #### 3. The Simulation Objection (Game Theory)
  **They say:** "Trust is about predictability, not metaphysics. If I know you *simulate* non-calculation perfectly, I trust you. You don't need to actually delete the readiness, you just need to make it too costly to access. I can signal integrity without losing the capacity to recalculate."
  **Your Reply:** "Trust relies on Common Knowledge. If you know I *could* recalculate if the stakes hit 10^9, and I know you know that, the relationship is a lease, not a bond. The 'simulation' leaks. The wife in the fire case isn't about what I do; it's about what I *consider*. If I consider the trade-off, even silently, the good is diminished."
  **Soft Spot:** Proving the "leak" without sounding mystical.
  **Force:** **Motte-and-Bailey.** They can argue simulation is sufficient for *most* goods. Concede "most," hold firm on "constitutive goods like love."

  #### 4. The Threshold Objection
  **They say:** "You conceded numbers win at some point. Where is the function? Is it linear? Logarithmic? If you can't specify the threshold where Readiness Tax outweighs EV, you're just asserting a bias."
  **Your Reply:** "I'm not offering a formula; I'm offering a category error. It's not a threshold on the *numbers*; it's a threshold on the *domain*. In the domain of personal commitments, the currency isn't interchangeable utility. Asking for the exchange rate between 'being a husband' and 'QALYs' is the error."
  **Soft Spot:** They will demand a decision procedure.
  **Force:** **Motte-and-Bailey.** Easy to swat if you hold the "domain" line.

  #### 5. The Global Welfare Objection
  **They say:** "This prioritizes local, visible goods (wife, friend) over global, invisible goods (distant strangers). That's exactly the scope insensitivity bias EA tries to fix. You're rationalizing tribalism."
  **Your Reply:** "I'm not prioritizing the *person*; I'm prioritizing the *capacity to care*. If I turn myself into a utility pump, I lose the ability to care deeply about anything. A world of agents who can't form deep bonds has lower capacity for value creation long-term. I'm optimizing for the agent's sustainability."
  **Soft Spot:** Empirical claim (does integrity increase long-term value?) is hard to prove.
  **Force:** **Genuine.** The psychologists in the room will pounce on the empirical claim.

  #### 6. The "No" Prediction Objection
  **They say:** "You predict we say 'No' to the Pill. But if we say 'Yes', doesn't that falsify your claim that we value integrity over calculation? Maybe we're just better consequentialists than you think."
  **Your Reply:** "If you say 'Yes', you prove my point: you are willing to sacrifice the *capacity* for moral reasoning to get the *output* of moral reasoning. You become a tool of the theory rather than a user of it. I'm asking if you want to be a user."
  **Soft Spot:** Relies on them sharing your valuation of "being a user."
  **Force:** **Low.** Rhetorical flourish more than argument.

  #### 7. The Rule Consequentialism Objection
  **They say:** "This is just Rule Consequentialism. 'Have a rule: don't calculate on personal commitments.' That rule maximizes EV. So you're just describing RC."
  **Your Reply:** "Rule Consequentialism holds the rule *conditionally* (I keep it because it maximizes EV). I am holding the commitment *categorically* (I keep it because it's my wife). The moment the rule is held conditionally, the Readiness Tax is active. RC pays the tax; I avoid it."
  **Soft Spot:** Distinguishing "conditional" from "categorical" in practice.
  **Force:** **Motte-and-Bailey.** Standard phil 101 objection. Swat it quickly.

  #### 8. The Evolutionary Debunking Objection
  **They say:** "This 'integrity' is just a heuristic evolved for Dunbar-number tribes. It doesn't apply to global risks or AI alignment. You're optimizing for the Stone Age."
  **Your Reply:** "Even if it's evolved, it's the hardware we have. You can't run software that requires a CPU we don't possess. If the theory requires us to be non-human to work, the theory is flawed for humans."
  **Soft Spot:** "We can upgrade the hardware" (pills, training, AI).
  **Force:** **Low.** Easy to dismiss as "is-ought."

  ---

  ### BACKSTAGE NOTE
  **Watch the Grad Students.** The software folks will get the "architecture" metaphor. The psychologists will get the "trust" metaphor. The three decision theory grad students are the danger. They will try to formalize your "Readiness Tax" into a variable $R$ in the utility function $U = E[V] - R$.
  **Counter-move:** If they try to formalize it, stop them. "The moment you make $R$ a variable in the function, you are calculating it. You are paying the tax to measure the tax. The variable cannot exist inside the function it taxes."
