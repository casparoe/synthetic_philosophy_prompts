          4.  Test Run on Three Proposals:
              *   (a) Buying surplus credits for cash at discount.
              *   (b) Savings feature with fees for lenders.
              *   (c) User's pet project (fixed-supply founding instrument paying premiums from levies). *Crucial:* Be honest if (c) fails.

  2.  **Deconstruct the Aristotelian Framework (Mental Sandbox):**
      *   *Oikonomia* (Household Management): Getting goods/credits to satisfy actual needs within the community. Limit is the need itself.
      *   *Chrematistike* (Wealth-Getting): Getting wealth for its own sake. Unlimited.
      *   *Money as Measure:* Money (credits) should facilitate exchange of unequal things (shoes vs. houses) based on need/utility, not exist as a commodity itself.
      *   *Money Breeding Money:* Interest/Usury. Money shouldn't generate more money without labor/service.
      *   *Reciprocity:* Exchange should equalize the parties, not exploit one for the gain of the other.

  3.  **Drafting the Screening Procedure (The "Aristotelian Filter"):**
      *   Need 3-4 distinct steps.
      *   Must be actionable.
      *   *Step 1: The End Goal.* Is the credit the means or the end? (Need vs. Accumulation).
      *   *Step 2: The Source of Gain.* Does value come from service or from the movement of credits itself? (Labor vs. Usury/Arbitrage).
      *   *Step 3: Reciprocity/Equality.* Does this create a permanent class of creditors/debtors? (Community vs. Hierarchy).
      *   *Decision Logic:* If Step 1 fails -> Reject. If Step 2 fails -> Reject. If Step 3 is ambiguous -> Escalate.

      *Refining the Questions:*
      *   Q1: "What is the final thing this credit buys?" (Tests Natural Limit).
      *   Q2: "Where does the profit come from?" (Tests Money Breeding Money).
      *   Q3: "Does this change who holds power?" (Tests Reciprocity/Political Structure).

      *Defining Pass/Fail:*
      *   Fail = "The credits themselves."
      *   Pass = "A specific service/good."

      *Escalation:* When it's about risk tolerance or community culture, not structural integrity.

  4.  **Addressing the Analogy Strain:**
      *   Aristotle talked about metal coinage. Mutual credit is accounting.
      *   "Natural Limit" is harder when credits are digital entries.
      *   "Usury" in mutual credit is tricky because negative balances are often interest-free by design.
      *   Need to highlight that credits are *promises*, not *commodities*.

  5.  **Running the Test Cases:**
      *   *(a) Buying credits for cash at discount:*
          *   Q1: End goal? Spending at face value.
          *   Q2: Source of gain? The spread between cash price and face value. No service.
          *   Verdict: **FAIL.** This is arbitrage. Turns credits into a commodity.
      *   *(b) Savings feature with fees:*
          *   Q1: End goal? Safety/Storage? Or earning the fee?
          *   Q2: Source of gain? Fee from borrower. Money breeding money.
          *   Verdict: **FAIL.** This is interest/usury. Separates idle holders from active workers.
      *   *(c) User's Pet Project (Founding Instrument):*
          *   Q1: End goal? Premium payout.
          *   Q2: Source of gain? Future transaction levies (tax on others' work).
          *   Q3: Power? Creates a permanent class of rentiers (founders) taxing the rest.
          *   Verdict: **FAIL.** Hard. This is exactly the "wealth-getting without limit" Aristotle warns against. It creates a permanent aristocracy of credit based on past status, not current contribution.

  6.  **Identifying Weaknesses & Risks:**
      *   *The "Need" Problem:* Who defines need?
      *   *The "Incentive" Problem:* Without some surplus accumulation, why participate? Aristotle assumes a polis, not a voluntary association.
      *   *The "Governance" Reality:* Is this just a COI check? Aristotle adds the *teleological* frame (what is this *for*), which COI checks lack. COI checks ask "Who benefits?" Aristotle asks "What is the activity?"
      *   *Fragility:* The distinction between "reward for risk" and "usury" is the weakest point.

  7.  **Review and Refine:**
      *   *Tone:* Direct, practical, respectful of the user's intelligence.
      *   *Constraint Check:* No citations? Check. 30-min procedure? Check. Honest about (c)? Check.
      *   *Self-Correction on (c):* I need to be very careful not to sound like I'm attacking the user, but the prompt explicitly says "If (c) fails, say it fails plainly." I must honor that.
      *   *Procedure Clarity:* Ensure the "Stop" points are clear.

  8.  **Final Polish:**
      *   Make the procedure look like a checklist.
