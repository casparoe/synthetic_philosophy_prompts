answer: |-
  ### Case A: The Occupied Unit

  Landlord Lin manages a residential complex. A family with a three-year-old child, Leo, currently occupies Unit 4. The walls require repainting before the lease renews. Lin has two options: (1) **Standard Paint**, which costs $500, is non-toxic, and requires no vacancy; or (2) **Budget Paint**, which costs $300, is legal but emits volatile organic compounds (VOCs) for six months, and foreseeably causes chronic respiratory issues in small children. To save the building's maintenance budget, Lin chooses Budget Paint. Leo remains in the unit during painting. Leo develops chronic asthma. Leo's life is clearly worth living, but he carries this serious, avoidable burden. Had Lin chosen Standard Paint, Leo would have existed, lived in the same unit, and been healthy.

  ### Case B: The Vacant Unit

  Landlord Lin manages a residential complex. Unit 4 is vacant. A young couple signs a lease to move in next week and intends to conceive immediately upon moving. The walls require repainting before occupancy. Lin has two options: (1) **Standard Paint**, which costs $500, is non-toxic, and requires a two-month curing period before occupancy is safe; or (2) **Budget Paint**, which costs $300, is legal but emits VOCs for six months, and foreseeably causes chronic respiratory issues in small children conceived or residing there. To save the building's maintenance budget, Lin chooses Budget Paint. The couple moves in immediately, conceives, and their child, Maya, is born with chronic asthma. Maya's life is clearly worth living, but she carries this serious, avoidable burden. Had Lin chosen Standard Paint, the couple would have been housed elsewhere for two months, conceived later, and a *different* child (without asthma) would have existed instead of Maya.

  ***

  ### 1. Constraint Check

  *   **Agent/Role:** Matched. (Landlord Lin in both).
  *   **Deliberative Situation:** Matched. (Choice between Standard and Budget paint for Unit 4).
  *   **Costs/Motivation:** Matched. ($200 budget saving in both).
  *   **Burden:** Matched. (Chronic asthma, serious but life worth living).
  *   **Alternative:** Matched. (Standard paint available in both).
  *   **Well-being Total:** Matched. (One person exists with a burden in both; the healthy alternative person in Case B is merely possible, not actual).
  *   **Identity Variable:** **Isolated.** In Case A, Leo exists in both branches (identity fixed). In Case B, Maya exists only in the Budget branch (identity variable).
  *   **Disanalogy Note:** Case A involves post-natal exposure; Case B involves pre-natal/conception-timing exposure.
      *   *Assessment:* This is structurally unavoidable. To fix identity in Case A, the person must exist prior to the choice. To vary identity in Case B, the choice must affect conception timing. Provided the harm (asthma) is functionally identical regardless of onset, this does not alter the moral logic regarding identity.
  *   **Cheating Check:** No third parties harmed in Case B (the "different child" is not a harmed third party, but a non-existent possible person). No rights violated (paint is legal). No concealed information (Lin knows the risks).

  ### 2. Theoretical Verdicts & Reasoning

  **Case A (Occupied Unit)**
  *   **Person-Affecting (Comparative):** **Condemns.** Leo is made worse off than he would otherwise have been. The baseline is Leo's healthy existence. Lin's choice lowered Leo's well-being.
  *   **Impersonal:** **Condemns.** The outcome contains a burden (asthma) that could have been avoided without cost to the total well-being (since Leo would still exist).

  **Case B (Vacant Unit)**
  *   **Person-Affecting (Comparative):** **Silent/Permissive.** Maya is not made worse off. The alternative for Maya was non-existence. Since her life is worth living, she is better off existing with asthma than not existing at all. No actual person is harmed comparatively.
  *   **Impersonal:** **Condemns.** The outcome is worse than the alternative. A world with a healthy child is impersonally better than a world with an asthmatic child, even if they are different children. The presence of the avoidable burden makes the state of affairs worse.

  ### 3. The Work-Doing Feature

  The **counterfactual baseline for the burdened individual**.
  In Case A, the baseline is *that same person's healthy existence*. In Case B, the baseline is *that same person's non-existence*. The divergence in verdicts arises solely because the comparative account ties harm to the welfare of the *actual* individual across worlds, and in Case B, the actual individual cannot claim they lost out on a healthy existence, because a healthy existence would have belonged to someone else.

  ### 4. Intervention

  **Variation:** Suppose in Case B, the asthma is so severe that Maya's life is *not* worth living (a "wrongful life" scenario).
  **Result:** The Person-Affecting view now condemns the act. Maya *is* worse off than she would have been (non-existence is preferable to a life of misery).
  **Analysis:** This collapses the Nonidentity Problem. The case becomes an ordinary harm case because the comparative baseline (non-existence) is now higher than the actual state. This confirms that the NIP relies entirely on the "life worth living" condition to block the comparative harm claim.

  **Variation:** Suppose in Case B, the VOCs also sicken the *mother* (who exists in both branches).
  **Result:** The Person-Affecting view condemns the act.
  **Analysis:** This introduces a third-party harm. The verdict is no longer driven by the identity of the child, but by the harm to the mother. The isolation of the identity variable fails.

  ### 5. Strategies for the Person-Affecting Defender

  **Strategy 1: Non-Comparative Harm (e.g., Harman)**
  *   **Mechanism:** Argue that causing someone to exist with a serious burden is harmful *in itself*, regardless of whether they are worse off than in the alternative. Harm is a property of the state, not the comparison.
  *   **Cost:** This severs the link between harm and "worse off." It risks overgeneration: does every sub-optimal conception harm the child? It requires a threshold account of harm that is difficult to non-arbitrarily define.
  *   **Impact on Case A:** No change. Case A is still condemned (and arguably on two grounds now).

  **Strategy 2: The "Same Number Quality Claim" (Person-Affecting Framing)**
  *   **Mechanism:** Argue that we have a duty to the *set* of future people. If we choose the Budget Paint, we violate a duty owed to the "future occupant slot" to ensure whoever fills it is healthy. We compare the actual person to the possible person who *could have* occupied their place.
  *   **Cost:** This effectively abandons the strict Person-Affecting Restriction. It treats "possible people" as having moral standing comparable to actual people, which collapses into the Impersonal View.
  *   **Impact on Case A:** No change in verdict, but the *reasoning* shifts from "harming Leo" to "filling the occupant slot sub-optimally."

  ### 6. Honest Verdict on the Exercise

  The pair successfully isolates the identity variable. By holding the agent, cost, and burden constant, it demonstrates that the intuitive wrongness of Lin's action remains stable while the Person-Affecting verdict flips. This forces the student to locate the divergence in the theory's baseline, not the case's details.

  **Limitation:** The cases rely on the same metaphysical mechanism as the "teenage pregnancy" case (time-shifted conception alters identity). A skeptical reader might argue this is merely the Parfit case in landlord's clothing. However, the *moral context* is distinct: the agent is a third party (Landlord) rather than the parent, removing confounding variables regarding reproductive autonomy and self-harm. This makes the *identity* issue more salient, as the Landlord has no autonomy-based defense for their choice. The exercise succeeds not by inventing new metaphysics, but by stripping the familiar metaphysics of its usual sociological noise.
