answer: |-
  # SEMINAR HANDOUT: HABITS OF JUDGMENT
  **Metaphilosophy | Session 1**

  **Instructions:** Below are ten concrete scenarios drawn from academic practice. For each, select the single option that best matches your intuitive reaction. There are no correct answers; the goal is to map your existing commitments. Do not overthink. Work quickly.

  **1.** A student asks whether she may use, as an unqualified premise in her own argument, a three-page negative result published in a journal roughly sixty years ago. The paper showed that a familiar three-part analysis of a mental state fails. Her supervisor says she may, but she would have to re-argue it if challenged. What does this arrangement tell her?
  **A.** The result is stable enough to be treated as background truth, pending rare challenge.
  **B.** The result is a landmark of understanding, but understanding requires re-tracing the steps.
  **C.** The result is a useful instrument, valid only insofar as it serves current arguments.

  **2.** Over a century, twenty live positions on a specific question become six. Nobody has come to accept any of the six; everybody agrees about which fourteen are dead. What does this reduction indicate?
  **A.** The discipline is eliminating error, even if the final truth remains elusive.
  **B.** The field is clearing noise in some areas while remaining stuck in others.
  **C.** We simply got bored of the others; none are actually better than the rest.

  **3.** Anonymous surveys of professional philosophers find overwhelming agreement on some questions and near-even splits on others. The split questions generate most of the publications. What pattern of results would count as getting somewhere?
  **A.** Agreement on the basics shows growth, regardless of the splits on hard cases.
  **B.** Agreement is sociological; the splits show we are failing to track truth.
  **C.** Agreement on trivia is easy; the splits show where the live work is happening.

  **4.** In one discipline, first-year students spend their time on material produced in the last decade and treat the classic texts as history. In another, the classic texts are still read as live contributions and the newest work is read mainly for how it repositions them. What does this difference imply?
  **A.** The first field treats old work as obsolete technology; the second treats it as enduring tooling.
  **B.** The first field assumes recent work is correct; the second assumes truth is timeless.
  **C.** The first field values current utility; the second values depth of historical understanding.

  **5.** A question that occupied a discipline for two centuries stops being asked. It was not answered, but displaced, because the vocabulary for asking it was replaced by a more tractable set of questions. Is the original question resolved, obsolete, or neither?
  **A.** It is resolved; the displacement *is* the solution to the confusion.
  **B.** It is obsolete; we changed the subject because we could not answer the first one.
  **C.** It is uneven; some questions get dissolved, while others remain permanently hard.

  **6.** A distinction introduced to solve one problem turns out to be indispensable in three unrelated areas, while the problem it was introduced for is now generally thought unsolvable. Where lies the gain?
  **A.** The distinction clarifies the landscape even if the original peak is unreachable.
  **B.** The distinction is the gain; the problem was just the catalyst for the tool.
  **C.** There is no gain; if the original problem is unsolved, the work is incomplete.

  **7.** A subfield explodes with publications and conferences, yet no consensus emerges on core definitions after thirty years. Senior scholars call it vibrant; junior scholars call it stagnant. Who is right?
  **A.** The seniors see the accumulation of nuanced views; the juniors see the blockage.
  **B.** The seniors are protecting status; the juniors see the void where answers should be.
  **C.** Activity indicates health; consensus is not required for a field to be advancing.

  **8.** A formal model is adopted widely across the discipline, but everyone knows the model's assumptions are strictly false. Why keep it?
  **A.** Reject it; a false premise cannot lead to settled truth.
  **B.** Accept it; it explains relationships between concepts effectively enough.
  **C.** Accept it; it is a useful calculation device, regardless of truth.

  **9.** Two teams argue for years without a winner. However, the argument forces both sides to define their terms with unprecedented precision. Was the time wasted?
  **A.** Yes; without a winner, the dispute remains unresolved and the time is lost.
  **B.** No; the precision gained is a structural improvement even without a verdict.
  **C.** It depends; some disputes clarify, while others are merely verbal skirmishes.

  **10.** A graduate program requires comprehensive exams on historical texts rather than current journals. What is the underlying assumption about the field?
  **A.** Current journals are merely repositioning old tools; the tools themselves are foundational.
  **B.** Historical texts contain settled truths that current work merely elaborates.
  **C.** Understanding the history is necessary to deepen intelligibility, not to find answers.

  ***

  ### SCORING KEY

  **Step 1:** Tally your answers for the **Criterion Axis** (Items 1, 4, 6, 8, 10).
  *   **Settling:** 1A, 4B, 6C, 8A, 10B.
  *   **Deepening:** 1B, 4C, 6A, 8B, 10C.
  *   **Tooling:** 1C, 4A, 6B, 8C, 10A.

  **Step 2:** Tally your answers for the **Status Axis** (Items 2, 3, 5, 7, 9).
  *   **Yes:** 2A, 3A, 5A, 7C, 9B.
  *   **Uneven:** 2B, 3C, 5C, 7A, 9C.
  *   **No:** 2C, 3B, 5B, 7B, 9A.

  **Step 3:** Locate your cell on the grid below.

  | | **YES** (On the whole) | **UNEVEN** (Locally) | **NO** (Structurally) |
  | :--- | :--- | :--- | :--- |
  | **SETTLING**<br>(Getting claims right) | **The Accumulator**<br>We are collecting truths like stones.<br>*Awkward:* Must explain why so many past "truths" were discarded.<br>*(Recognizable)* | **The Fallibilist**<br>We get things right, but often temporarily.<br>*Awkward:* Committed to saying some current truths will later be false.<br>*(Recognizable)* | **The Tragic Realist**<br>We aim at truth but are structurally barred from it.<br>*Awkward:* Hard to justify continuing the discipline if the aim is impossible.<br>*(Unstable)* |
  | **DEEPENING**<br>(Making intelligible) | **The Systematizer**<br>We are nearing a complete map of concepts.<br>*Awkward:* Implies an end to questioning, which contradicts deepening.<br>*(Unstable)* | **The Cartographer**<br>We map terrain well in some regions, not others.<br>*Awkward:* Must explain why some regions remain permanently unmappable.<br>*(Recognizable)* | **The Mystical Pessimist**<br>We try to understand, but reality resists intelligibility.<br>*Awkward:* Coherent, but suggests practice is futile contemplation.<br>*(Empty)* |
  | **TOOLING**<br>(Producing instruments) | **The Engineer**<br>We build better tools regardless of truth.<br>*Awkward:* Must accept that useful tools can be based on falsehoods.<br>*(Recognizable)* | **The Technician**<br>We have good tools for some jobs, none for others.<br>*Awkward:* Implies some philosophical problems are technically unsolvable.<br>*(Recognizable)* | **The Eliminator**<br>We fail even to make useful instruments.<br>*Awkward:* If tools are useless, the discipline is mere noise.<br>*(Unstable)* |

  **Stability Analysis:**
  Cells marked *(Unstable)* contain tension between the criterion and status. **The Tragic Realist** aims at truth but admits structural failure; this often collapses into Tooling or Quietism. **The Systematizer** claims complete intelligibility, which contradicts the open-ended nature of Deepening. **The Eliminator** claims instrument production fails structurally; if so, the discipline lacks even instrumental value.
  Cells marked *(Empty)* are coherent but rarely occupied. **The Mystical Pessimist** believes understanding is possible in principle but structurally blocked in practice; this is distinct from claiming understanding is impossible (No Criterion) or that we are succeeding (Yes Status).
  Cells marked *(Recognizable)* are common philosophical stances.

  **Tie-Breaking Rule:**
  If your tally on an axis is 2–2–1 (e.g., two Settling, two Deepening, one Tooling), discard the singleton. Re-evaluate the two tied items only. If still tied, select the option that feels less like a compromise. If your score is 3–1–1 or worse, trust the majority.

  ***

  ### DIAGNOSTIC NOTES

  **1. Indistinguishable Cells**
  This quiz cannot reliably separate **The Accumulator** (Settling/Yes) from **The Engineer** (Tooling/Yes). Both view the discipline as successful and moving forward. An eleventh item would need to ask: *When a new theory replaces an old one, is the old theory false or merely less useful?* The Accumulator says "False"; The Engineer says "Less useful."
  Similarly, **The Cartographer** (Deepening/Uneven) and **The Technician** (Tooling/Uneven) are hard to separate. Both admit local success and local failure. An eleventh item would need to ask: *Is the value of a successful subfield that it describes reality or that it solves problems?* The Cartographer chooses "describes"; The Technician chooses "solves."

  **2. Split Criterion Scores**
  If you split evenly on the Criterion Axis (e.g., 2 Settling, 2 Deepening, 1 Tooling), do not force a choice. This indicates you hold a hybrid view. Many practitioners operate with a Settling criterion for logic and a Deepening criterion for ethics. Conclude that your metaphilosophy is pluralistic rather than uniform. Do not assume inconsistency; assume domain-sensitivity.

  **3. Prediction for First-Year Students**
  I expect **The Fallibilist** (Settling/Uneven) to be over-represented among first-year graduate students. This is because early training emphasizes mastering existing arguments (Settling) while simultaneously exposing students to endless disagreement (Uneven). They are taught to treat premises as stable for the sake of argument, yet told that consensus is rare. This cell captures the tension of being a novice in a field that demands certainty but offers none. It is a stable position, but one that often shifts toward Tooling or Deepening as research experience grows.

  **4. Structural Constraints**
  Note that no item asked you to assess the discipline as a whole. Your verdict on the whole is derived from your habits in specific cases. If you find your resulting cell uncomfortable, do not change your score. Change your habits. The instrument reveals the commitment; you must decide whether to keep it.
