answer: |-
  **Anti-Computationalist:** Let's dispense with the usual mysticism. My objection isn't about qualia or understanding. It's about the triviality of implementation. Putnam showed that for any open physical system without cyclical behavior—a rock, a wall, a puddle—there exists a mapping from its maximal physical states to the states of any finite automaton. Since the rock is in a distinct microstate at every moment, you can chop its history into disjunctive state types that mirror any transition table you please. If every system implements every automaton, then saying "the brain implements a cognitive automaton" is vacuous. It's not a substantive thesis; it's a redescription of everything.

  **Computationalist:** You're relying on a theorem concerning inputless automata mapping onto actual histories. That's a parlor trick, not a model of cognition. A mind isn't just a sequence of states; it's a mechanism that processes inputs. Implementation requires more than isomorphism between actual state sequences. It requires counterfactual support. To implement an automaton, the system must be such that *if* it had received input *I*, it *would* have transitioned to state *S*. A rock's microstates evolve due to thermodynamics, not logical transition rules. If I intervene on the rock, it doesn't follow the automaton's transition function; it follows the laws of physics unrelated to the mapping.

  **Anti-Computationalist:** But who selects the relevant counterfactuals? To say the rock "would have" done otherwise, you must specify which physical properties constitute the state and which constitute the input. If I define the input as a specific pattern of photon bombardment and the state as a disjunction of thermal configurations, I can construct a mapping where the rock *does* support those counterfactuals. You claim the mapping must be "causally robust," but causal robustness is only robust relative to a description of what counts as a relevant intervention. You are smuggling in the interests of the describer. You want the mapping to be mind-independent, but your criteria for a "valid" mapping rely on pragmatic distinctions between signal and noise.

  **Computationalist:** I concede that *some* abstraction is necessary; we don't map individual quarks. But "pragmatic" doesn't mean "arbitrary." Physical systems have causal structure. A transistor has an energy barrier that makes the distinction between 'on' and 'off' stable against background noise. A rock lacks that stability. If you map a rock to an automaton, the state groupings are gerrymandered disjunctions with no physical cohesion. They don't hold up under intervention. If I nudge the rock, the mapping breaks. If I nudge a computer, the logic holds. That difference is objective. The brain's implementation is substantive because it relies on physically specifiable state groupings that are causally isolated from one another, ensuring the transition function runs without external correction.

  **Anti-Computationalist:** There's the blow I expected, and here is the concession you must make: "Causal isolation" is itself description-relative. You say the transistor's 'on' state is physically cohesive. But physically, it's a cloud of electrons. It's only a discrete state relative to a voltage threshold *you* imposed. Why is that threshold objective? Because it serves a function *you* care about. Without an agent to define what counts as a "nudge" versus "background noise," the rock's thermal fluctuations are just as causally potent as the transistor's switching. You claim the mapping breaks under intervention, but the mapping only breaks if you insist the physical states remain grouped in the way *you* originally specified. If I allow the state grouping to shift dynamically with the physics, the rock still implements the automaton. Your "objective causal structure" is just physics viewed through the lens of engineering.

  **Computationalist:** That's a strong point. I will concede that if we allow arbitrary, time-dependent remapping of physical states to logical states, the triviality returns. To block it, I must insist that the physical realizers of the computational states be fixed by the system's intrinsic dynamics, not by an external observer's changing classification. The brain implements a mind because its neurophysiological properties constrain the possible mappings. You can't map a neuron to a logic gate in just any way; the membrane potential and firing threshold limit the viable interpretations. So, my concession is this: Implementation is not a binary relation between a system and an automaton. It is a graded property dependent on the system's physical capacity to maintain state distinctness under perturbation. The rock fails not because it lacks states, but because it lacks the *stability* to sustain the counterfactuals without external prop.

  **Anti-Computationalist:** And I concede this: If stability is the metric, then triviality is a matter of degree, not kind. A rock is a poor computer, not an impossible one. However, this shifts the debate from metaphysics to engineering. You've saved computationalism from vacuity only by making it pragmatic. You've defined "genuine implementation" as "implementation that is useful for prediction and control by agents like us." That means computational ascriptions aren't discovering mind-independent facts; they're identifying systems that align with our explanatory interests. You wanted a falsifiable thesis about brains. But if the criteria for implementation depend on stability thresholds, and those thresholds are set by what *we* can measure or exploit, then the thesis is about *our* relationship to the brain, not the brain in itself.

  **Computationalist:** Not necessarily. Stability thresholds can be set by the system's own persistence conditions. A system that doesn't maintain state distinctness dissolves. So the "interest" is the system's own survival, not ours.

  **Anti-Computationalist:** But "survival" and "dissolution" are also descriptions. A rock dissolving into dust is just rearrangement. You only call it dissolution if you value the rock's current configuration. We are circling the same drain.

  **Computationalist:** Then we have identified the crux. It isn't whether mappings exist—they do. It isn't whether counterfactuals hold—they do, under descriptions. The crux is whether **causal individuation** is ontological or pragmatic. I need causal powers to be intrinsic to the physical chunks so that the automaton is realized by the physics itself. You argue causal powers are relational, existing only between a system and a description.

  **Anti-Computationalist:** Precisely. If you want computationalism to be a substantive, non-vacuous ontology, you cannot just appeal to "robustness" or "stability." You must provide a theory of **objective causal individuation** that does not rely on counterfactuals defined by human interests. You need to show that the universe carves itself into states prior to any description.

  **Computationalist:** And you must acknowledge that if such a theory is impossible, then *no* special science—not just psychology, but biology and chemistry—is ontologically fundamental. They all rely on functional individuation.

  **Anti-Computationalist:** Agreed. If I win, I win too much. Everything becomes pragmatic.

  **Computationalist:** Then that is what settles it. We don't need more examples of rocks or brains. We need a metaphysics that can ground causal powers without appealing to an observer's descriptive framework. Until we have a non-pragmatic account of how physical states are individuated, the dispute over triviality is undecidable.

  **Anti-Computationalist:** So the thesis isn't false; it's pending a metaphysics of causation we don't possess.

  **Computationalist:** Correct. The computation isn't in the rock, but it might not be in the brain either, not in the way we hope. It's in the gap between physics and description.
