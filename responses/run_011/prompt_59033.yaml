answer: |-
  When the levees broke last month, the public outrage focused predictably on the price of generators. Critics called it price gouging; I call it a signaling failure. Our pilot program, the Surge Allocation Exchange, was designed to correct this. By allowing prices to clear the market for emergency goods, we ensure resources go to those who value them most highly, measured by willingness to pay. The backlash has been intense, but mostly it reveals a misunderstanding of what a queue actually is. A queue is not a moral alternative to a market; it is a market where the currency is hours, physical stamina, and social connections. That is a regressive tax. The elderly and the infirm cannot stand in line for twelve hours. They can, however, benefit from a subsidized price mechanism.

  We heard the concerns about equity, so we iterated. The Exchange now incorporates means-tested discounts funded by a surcharge on luxury emergency items. We introduced sealed anonymous bidding so neighbors never have to know who outbid them for the last case of water, preserving social cohesion while maintaining allocative efficiency. When families still struggled with liquidity constraints, we launched a three-year installment plan for essential power infrastructure. It is deeply frustrating to be told that offering a family the option to finance a generator over thirty-six months is exploitative. It is an option they did not have when the shelf was empty because the supplier could not cover risk.

  The objections then shifted from coercion to corruption. Critics argue that putting a price on survival goods degrades the moral value of aid. This relies on the old gift-relationship literature, specifically the claim that paying blood donors crowds out altruism. The field evidence on this is genuinely ambiguous; some studies show a drop in voluntary donation, others show a net increase in supply stability. We cite this not as a complication, but as vindication. If money sometimes works, then refusing it on principle is idolatry. There is a distinction between saying a market coerces the poor and saying it corrupts the good. The first is an empirical claim about income distribution, which our vouchers address. The second is a metaphysical claim about the nature of goods, which we treat as confused sentimentality. A generator does not care if it was bought with virtue or cash; it cares about fuel.

  Dr. Elena Rostova, a bioethicist who consulted on the initial rollout, resigned last week. She stated, "Turning survival into a transaction strips life of its inherent dignity, reducing human worth to clearing capacity." Her rebuttal was technically correct and entirely useless. Dignity is a preference parameter like any other, subject to budget constraints. If maintaining the feeling of dignity prevents the allocation of resources that keep people alive, then dignity is a luxury good we cannot afford during a crisis. We offered her a severance package indexed to the survival rates of the pilot zone. She declined.

  Repugnance is itself a kind of market failure. It is a friction cost generated by the population's inability to process efficient outcomes. No clearing price fixes this because the bug is in the users, not the design. Once you accept that allocation is the goal, the scope of the Exchange naturally expands. We are currently testing the mechanism for dialysis slots in overflow clinics. The logic is identical: time on a machine is scarce, and queueing leads to worse health outcomes than priced access with insurance rebates. From there, it is a short step to the last seat on an evacuation helicopter. If the seat is priced, the person who values escape most highly secures it. If it is queued, the person who arrived first secures it. Why is arrival time a more moral metric than valuation?

  This brings us to the obvious next product line: the vote market. The standard objection is that citizens cannot be trusted to sell their votes sensibly. But this begs the question. If you believe the electorate is too irrational or vulnerable to coercion to sell their vote for money, you should not trust them to cast it for policy either. The cognitive capacity required to price your franchise is the same required to evaluate a candidate. If we trust them with the latter, the former is merely a liquidity event. We are building the sandbox now. The technology is ready. The only remaining variable is whether the population can overcome their repugnance bug to accept that everything has a price, and that pretending otherwise is what actually kills people.
