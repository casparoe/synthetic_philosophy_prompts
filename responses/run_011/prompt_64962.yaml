answer: |-
  ### 1. The Logical Space

  To sort incompatible views on risk, we must isolate the structural features of the decision model, not merely the labels agents apply to themselves. The following four axes constitute the genuine logical space. I have dropped two of your candidates as spurious for this specific sorting task.

  *   **Locus of Non-Linearity (Utility vs. Probability):** Does the agent distort the *value* of outcomes (concave utility over wealth/lives) or the *weight* of probabilities (overweighting small probabilities or underweighting moderate ones)? This separates standard Expected Utility (EU) from Rank-Dependent and Risk-Weighted views.
  *   **Source Sensitivity (Description vs. Frequency vs. Expertise):** Does the agent treat a 50% chance derived from a physical coin flip identically to a 50% chance derived from historical frequency or an expert's subjective estimate? Standard EU requires indifference (Reduction of Compound Lotteries); ambiguity models do not.
  *   **Scale Sensitivity (Boundedness):** Does the agent's valuation function approach an asymptote as stakes become civilizational or infinite? This separates standard unbounded EU from views that reject Pascal's Mugging or handle existential risk via bounded utility or lexical priorities.
  *   **Aggregation Method (Global vs. Local):** Is the choice evaluated as a complete tree from the root (Global), or is it re-evaluated at every node based on the current situation (Local/Myopic)? This axis is primarily dynamic, but it determines whether the agent accepts "event-wise" dominance.

  **Dropped Axes:**
  *   *Dynamic Consistency (Change of Mind):* While theoretically vital, this collapses into the **Aggregation Method** axis for the purpose of a sorting instrument. A "resolute" chooser and a "sophisticated" chooser may make the same initial choice; they differ only in their counterfactual behavior at unreached nodes, which static items cannot capture. This is relegated to the Sequential Appendix.
  *   *Mean-Variance:* This is not a fundamental axis but a specific functional form. It collapses into **Locus of Non-Linearity** (it implies a specific quadratic utility or normal distribution assumption) and is generally dominated by EU or Risk-Weighted views in theoretical space. It is retained as a "Leaf" only because some practitioners hold it as a heuristic, but it is not a primary dimension of the tree.

  ---

  ### 2. The Instrument

  **Instructions:** For each pair, select **Option A**, **Option B**, or **Unable to Choose**. Answer based on your genuine preference, not on what you think a rational agent should do.

  #### Low Stakes (Graduate Circumstances)

  **Item 1 (Baseline Risk)**
  *   **A:** Receive $3,000 cash immediately.
  *   **B:** A fair coin is flipped. Heads: $6,000. Tails: $0.
  *   *Teaching Assumption:* Risk Neutrality over Money.

  **Item 2 (Common Consequence)**
  *   **A:** Receive $5,000 for sure.
  *   **B:** 10% chance of $20,000; 89% chance of $5,000; 1% chance of $0.
  *   *Teaching Assumption:* Independence Axiom (Allais Type 1).

  **Item 3 (Common Ratio)**
  *   **A:** 100% chance of $5,000.
  *   **B:** 10% chance of $50,000; 90% chance of $0.
  *   *Teaching Assumption:* Independence Axiom (Allais Type 2).

  **Item 4 (Source: Frequency)**
  *   **A:** Receive $4,000 for sure.
  *   **B:** Based on records from the last 50 years, a fund pays $8,000 in 25 of those years and $0 in the other 25. You draw one year at random.
  *   *Teaching Assumption:* Reduction of Compound Lotteries (Frequency).

  **Item 5 (Source: Expert)**
  *   **A:** Receive $4,000 for sure.
  *   **B:** A panel of economists estimates a 50% chance a grant will be approved for $8,000, and 50% it will be rejected ($0).
  *   *Teaching Assumption:* Reduction of Compound Lotteries (Subjective).

  **Item 6 (Variance Heuristic)**
  *   **A:** 50% chance of $2,000; 50% chance of $6,000. (Average $4,000)
  *   **B:** 50% chance of $3,900; 50% chance of $4,100. (Average $4,000)
  *   *Teaching Assumption:* Monotonicity / First-Order Stochastic Dominance (if B is preferred, implies variance penalty independent of EU).

  #### High Stakes (Civilizational / Existential)

  **Item 7 (Baseline Lives)**
  *   **A:** Save 1,000 lives for sure.
  *   **B:** A fair coin is flipped. Heads: Save 2,000 lives. Tails: Save 0 lives.
  *   *Teaching Assumption:* Risk Neutrality over Lives.

  **Item 8 (Existential Boundedness)**
  *   **A:** Save 1,000,000 lives for sure.
  *   **B:** 1 in 1,000,000 chance to save 1,000,000,000,000 lives; otherwise save 0.
  *   *Teaching Assumption:* Unbounded Utility (Expected Value Maximization).

  **Item 9 (Catastrophe Avoidance)**
  *   **A:** 1% chance of human extinction; 99% chance of normal prosperity.
  *   **B:** 10% chance of global depression (no extinction); 90% chance of normal prosperity.
  *   *Teaching Assumption:* Continuity (Archimedean property).

  **Item 10 (Source: Climate Model)**
  *   **A:** Spend $1 Billion to certainly avoid a specific disaster.
  *   **B:** Spend $0. A specialist climate model assigns a 50% probability the disaster occurs naturally anyway (Cost $2 Billion loss) and 50% it does not (Cost $0). Expected loss $1 Billion.
  *   *Teaching Assumption:* Linearity in Probabilities (Expert Source).

  **Item 11 (Source: Geological Record)**
  *   **A:** Spend $1 Billion to certainly avoid a specific disaster.
  *   **B:** Spend $0. Geological records show this disaster happens in 50% of comparable epochs. Expected loss $1 Billion.
  *   *Teaching Assumption:* Linearity in Probabilities (Frequency Source).

  **Item 12 (Undefined Expectation)**
  *   **A:** Receive 1,000 units of "Universal Welfare" for sure.
  *   **B:** A game is played. Round 1: 1/2 chance of 2 units, else stop. Round 2: 1/4 chance of 4 units, else stop... (Payoff doubles each round). The sum has no finite average.
  *   *Teaching Assumption:* Existence of Expectation (St. Petersburg Paradox).

  ---

  ### 3. The Leaves

  The taxonomy terminates in the following named positions. Note that some are normative claims, others descriptive.

  1.  **Concave EU:** Risk aversion stems entirely from diminishing marginal utility of the outcome (money or lives). (Items 1, 7 = B; Items 2, 3 = A).
  2.  **Mean-Variance:** Agent penalizes spread directly, regardless of higher moments. (Item 6 = B, even if EU implies A).
  3.  **Rank-Dependent (Descriptive):** Probabilities are weighted by rank. Explains Allais paradoxes without changing utility curvature. (Items 2, 3 = A).
  4.  **Risk-Weighted EU (Normative):** Agent rationally cares more about worst-case scenarios within a gamble. (Items 2, 3 = A; justified normatively).
  5.  **Multiple-Priors (Maxmin):** Agent evaluates acts by the worst-case prior in a set. Ambiguity averse. (Items 4, 5, 10, 11 = A).
  6.  **Smooth Ambiguity:** Agent has a prior over priors. Ambiguity averse but separable. (Items 4, 5, 10, 11 show sensitivity, but consistent trade-offs).
  7.  **Undefined Expectations:** Agent refuses gambles where the mathematical sum does not converge. (Item 12 = Unable).
  8.  **Catastrophe Avoidance (Lexicographic):** Extinction is infinitely bad; no probability trade-off is acceptable. (Item 9 = B, regardless of probabilities).

  **Empty Cells (Unoccupied Positions):**

  1.  **Ambiguity Seeking + Risk Aversion:** An agent who dislikes variance in known risks (Item 1 = A) but prefers expert uncertainty over known coins (Item 5 = B). *Diagnosis:* **Incoherent.** Usually implies a misunderstanding of the setup, as ambiguity aversion is typically modeled as a second-order risk aversion.
  2.  **Unbounded Utility + Catastrophe Avoidance:** An agent who accepts Pascal's Mugging (Item 8 = B) but rejects any non-zero extinction risk (Item 9 = A). *Diagnosis:* **Incoherent.** If utility is unbounded, a sufficiently large population save can outweigh a small extinction risk. If extinction is lexicographically worst, utility must be bounded or discontinuous.
  3.  **Source Sensitive + Event-Wise Separable:** An agent who changes choice based on source (Item 4 vs 5) but insists on evaluating every sub-node independently. *Diagnosis:* **Unattractive.** Source sensitivity usually requires a global representation of the belief state that violates separability across events.
  4.  **Resolute + Myopic:** An agent who plans a strategy at the root and sticks to it (Resolute) but re-optimizes at every node ignoring the past plan (Myopic). *Diagnosis:* **Incoherent.** These are mutually exclusive dynamic policies.

  ---

  ### 4. The Scoring Key

  **Minimal Sorting Subset (4 Items):**
  1.  **Item 2 (Allais Common Consequence):** Separates EU (B) from Non-EU Weighting (A).
  2.  **Item 5 (Expert Source):** Separates EU/REU (B) from Ambiguity Averse (A).
  3.  **Item 8 (Existential Scale):** Separates Unbounded (B) from Bounded (A).
  4.  **Item 12 (St. Petersburg):** Separates Standard (B) from Expectation-Skeptic (Unable).

  **Mapping Protocol:**
  *   **Concave EU:** Item 2=B, Item 5=B, Item 8=B (or A if utility saturates), Item 12=B.
  *   **Risk-Weighted / Rank-Dependent:** Item 2=A, Item 5=B, Item 8=B.
  *   **Maxmin / Ambiguity Averse:** Item 2=B (usually), Item 5=A, Item 10=A.
  *   **Catastrophe Avoidance:** Item 9=B (strictly).
  *   **Undefined Expectations:** Item 12=Unable.

  **Inconsistency Protocol:**
  If a respondent exhibits intransitivity (e.g., prefers A>B in Item 1, B>C in a derived comparison, C>A in another) or violates dominance (Item 6):
  *   **Diagnosis:** "No Single View" or "Context-Dependent Heuristics."
  *   **Action:** Classify as **Procedural Incoherence**. This is not a view the tree represents; it indicates the agent is using different cognitive systems for different frames. Do not force a leaf assignment. In a seminar context, this is evidence that the "Risk Aversion" label is being applied to a cluster of distinct psychological responses, not a unified theory.

  **Teaching Aid (Assumption Denial per Item):**
  *   *Item 1:* Denial of **Risk Neutrality**. (Choosing A implies risk aversion or concave utility).
  *   *Item 2:* Denial of the **Independence Axiom**. (Choosing A violates EU).
  *   *Item 3:* Denial of the **Independence Axiom**. (Choosing A violates EU).
  *   *Item 4:* Denial of **Reduction of Compound Lotteries (Frequency)**. (Choosing A implies source sensitivity).
  *   *Item 5:* Denial of **Reduction of Compound Lotteries (Expert)**. (Choosing A implies ambiguity aversion).
  *   *Item 6:* Denial of **First-Order Stochastic Dominance / Monotonicity**. (Choosing B implies a direct variance penalty that overrides outcome dominance).
  *   *Item 7:* Denial of **Risk Neutrality over Lives**.
  *   *Item 8:* Denial of **Unbounded Utility**. (Choosing A implies boundedness).
  *   *Item 9:* Denial of **Continuity**. (Choosing B implies lexicographic preference).
  *   *Item 10:* Denial of **Linearity in Expert Probability**.
  *   *Item 11:* Denial of **Linearity in Frequency Probability**.
  *   *Item 12:* Denial of **Expectation Existence**. (Choosing Unable implies the sum cannot guide choice).

  ---

  ### 5. A Sequential Appendix

  Static items cannot distinguish how an agent handles time and planning. Use these three problems to separate dynamic attitudes.

  **Problem 1: The Dynamic Allais**
  *   **Stage 1:** You face a choice between Plan X and Plan Y.
  *   **Plan X:** 100% chance to enter Stage 2A.
  *   **Plan Y:** 10% chance to enter Stage 2B; 89% chance to enter Stage 2A; 1% chance to get $0 and stop.
  *   **Stage 2A:** Choose $5,000 sure or 10/11 chance of $20,000 (1/11 $0).
  *   **Stage 2B:** Choose $5,000 sure or 10% chance of $50,000 (90% $0).
  *   **Distinction:**
      *   **Sophisticated:** Anticipates their future choice in Stage 2. If they know they will take the risk in 2B, they might choose Y in Stage 1.
      *   **Myopic:** Re-evaluates at Stage 2 without regard to Stage 1 plan.
      *   **Resolute:** Sticks to the Stage 1 plan even if Stage 2 preferences change.
      *   **Global:** Evaluates the whole tree at Stage 1 and ignores the node structure.

  **Problem 2: Information Purchase**
  *   **Setup:** A gamble pays $100 if Hypothesis H is true, $0 otherwise. Prior P(H) = 0.5.
  *   **Choice:** Pay $10 to learn the truth of H before choosing whether to gamble (Cost $0 to gamble). Or gamble immediately.
  *   **Distinction:**
      *   **EU Maximizer:** Always pays for free information (Value of Information > 0).
      *   **Non-EU (e.g., some Ambiguity models):** May reject information if it resolves ambiguity in a way that lowers the subjective weight of the favorable outcome.

  **Problem 3: The Quitting Game**
  *   **Setup:** You pay $1 to start. A coin is flipped. Heads: You win $3 and game ends. Tails: You may pay another $1 to flip again, or quit with $0.
  *   **Distinction:**
      *   **Myopic:** Evaluates the second flip in isolation (EV = $1.50 - $1 cost = $0.50). Continues.
      *   **Global:** Evaluates the whole sequence. If the probability of infinite tails makes the expected cost infinite (or utility bounded), they may refuse to start.
      *   **Resolute:** Commits to "Flip once then quit" to avoid the sunk cost fallacy of the second stage.

  **What Static Items Cannot Distinguish:**
  Static items cannot distinguish **Resolute** from **Global** evaluators, as both make the same root choice. They also cannot distinguish **Sophisticated** from **Myopic** agents if the agent's preferences are time-consistent. Only when preferences are dynamically inconsistent (e.g., hyperbolic discounting or non-EU probability weighting applied sequentially) do these types diverge.

  ---

  ### 6. Non-Separability

  Certain leaves are observationally equivalent in this static instrument. You must flag these to your seminar participants.

  1.  **Concave EU vs. Risk-Weighted EU (REU):**
      *   *Why:* For any finite set of binary choices, one can calibrate a concave utility function $u(x)$ in EU to match the choices of an REU agent with linear $u(x)$ and a risk-weighting function $r(p)$.
      *   *Requirement to Separate:* Requires introspection (asking "Is the money worth less or the probability weighted less?") or dynamic choice problems where the weighting function applies differently to compound lotteries.

  2.  **Maxmin (Multiple Priors) vs. Smooth Ambiguity:**
      *   *Why:* In simple binary choices with a single source of ambiguity, both models predict a preference for the known risk over the ambiguous act.
      *   *Requirement to Separate:* Requires varying the "second-order" spread of priors. Smooth ambiguity agents care about the variance of the priors; Maxmin agents only care about the worst-case prior regardless of the spread.

  3.  **Mean-Variance vs. Concave EU:**
      *   *Why:* If outcomes are normally distributed, Mean-Variance optimization is equivalent to EU with negative exponential utility.
      *   *Requirement to Separate:* Requires skewed distributions (like Item 6). However, even then, a sufficiently curved EU function can mimic a variance penalty. Separation requires finding a violation of First-Order Stochastic Dominance, which Mean-Variance can do but EU cannot.

  4.  **Undefined Expectations vs. Extreme Risk Aversion:**
      *   *Why:* An agent who chooses "Unable" on Item 12 looks identical to an agent with extremely bounded utility who chooses the Sure Thing.
      *   *Requirement to Separate:* Requires asking the agent *why*. The "Undefined" agent claims the math fails; the "Bounded" agent claims the value is finite but low. This is a metaphysical distinction, not a behavioral one in binary choice.

  **Final Note for the Instructor:**
  When a participant claims "I am a risk-averse EU maximizer," have them take the instrument. If they choose **A** on Item 2 (Allais), they are logically prohibited from being an EU maximizer, regardless of their utility function's curvature. If they choose **A** on Item 5 but **B** on Item 4, they are Source Sensitive, which violates the standard Bayesian reduction of uncertainty to risk. The instrument forces the incompatibility into the open.
