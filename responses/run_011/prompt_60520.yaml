prompt: |-
  I have spent a year trying to write the framing chapter for an interdisciplinary volume on moral revolutions, and what has stopped me is not the history but the logic of the disagreement. The chapter has to explain why three competing accounts of how practices like the Atlantic slave trade and dueling came to an end have failed to converge, and I no longer believe they are competing in any clean sense.

  The first account is the interest-based one. In Capitalism and Slavery (1944) Eric Williams argued that British abolition of the slave trade in 1807 and of slavery in 1833 tracked the declining value of the West Indian sugar complex to British accumulation, and that the humanitarian story favored by the imperial historians he attacked was self-congratulatory ideology. Seymour Drescher's Econocide (1977) replied that on the eve of 1807 the British trade was expanding and profitable, that abolition ran against the material interest of the dominant classes, and that it was forced by extra-parliamentary mass petitioning. Note the awkward consequence: the most effective empirical attack on the interest explanation is routinely read as a vindication of the causal power of public moral opinion, so the historiography does not line up with the philosophical dispute that borrowed from it.

  The second account holds that the practice ended because the reasons against it were sound and came to be widely enough apprehended; the abolitionists were right, and their being right did causal work.

  The third is the honor account in Appiah's The Honor Code (2010), built on dueling among British gentlemen, footbinding in China, and the slave trade: a practice collapses quickly once the surrounding code is rewritten so that continuing it marks one as shameful or absurd rather than as a gentleman, with moral argument mattering chiefly as an instrument of that reclassification.

  The stall has a specific texture. All three draw on the same cases, and each can absorb the others' evidence. Interest explains why a status shift was affordable; honor explains why arguments bite only when they reach the audience whose esteem is at stake; argument explains why the change took the normative direction it did rather than some other. There is also an unresolved asymmetry about testimony: the interest camp treats actors' stated moral reasons as rationalization by default, the argument camp takes them at face value, and the honor camp reads them as symptoms of a status game. Nobody has proposed a rule for when an agent's account of her own reasons counts as evidence. Meanwhile the comparative material points both ways. Dueling disappeared in Britain decades before it did in France, Germany, or Russia without any comparable difference in economic structure. In the footbinding case, an argument in the economic-historical literature holds that the practice persisted in regions where girls' hand-spinning and weaving labor was commercially valuable and receded where machine-spun yarn destroyed that income, which would give the interest camp a village-level mechanism for the very collapse the honor camp explains as a change in what counted as respectable.

  My working hypotheses, offered as hypotheses and not as conclusions: (1) the three accounts address different explananda, namely feasibility and timing, thinkability and normative direction, and the mobilization of individual action against free-riding, so the question of which one caused the change is ill-posed; (2) the disagreement is really about what an explanation must supply, since on a difference-making or counterfactual standard all three are trivially causes, which is why no side ever loses; (3) the durable part of the dispute is a disagreement about the epistemic status of first-person testimony rather than about the past at all. Alternatively the debate is not stalled but merely underpowered, and the live question is one of causal ordering: whether the status classification or the cost structure moved first.

  What I want is a diagnosis, not a verdict on which account is true and not a survey of the literature. Sort the disagreement into its components and say, of each, whether it is verbal, a difference about the explanandum, a difference about standards of evidence, a substantive empirical question, or bedrock. Support the sorting by what each side is actually committed to when it makes its case. Then tell me what would count as progress given that diagnosis: a distinction, a class of cases, a test about the sequence of changes, a formal model of status and incentives, a reformulation of the explanandum in advance, or something else. If your conclusion is that no progress should be expected, argue for that explicitly, and say whether the dispute would nonetheless change character if the question were fixed beforehand as: why did practice P cease to be performed by anyone in region R by year Y?
reasoning: |-
  Here's a thinking process that leads to the suggested diagnosis:

  1.  **Deconstruct the User's Request:**
      *   **Context:** The user is writing a framing chapter for an interdisciplinary volume on moral revolutions (specifically focusing on the end of practices like the Atlantic slave trade and dueling).
      *   **Problem:** They are stuck not on history, but on the *logic of the disagreement* between three competing accounts: Interest-based (Williams/Drescher), Argument-based (Moral Realism/Reason), and Honor-based (Appiah).
      *   **Observation:** The user believes these accounts aren't cleanly competing; they overlap, absorb each other's evidence, and address different aspects of the phenomenon.
      *   **Task:**
          1.  Diagnose the disagreement (sort it into components: verbal, explanandum, evidence standards, empirical, bedrock).
          2.  Support the sorting by analyzing what each side is committed to.
          3.  Define what counts as *progress* given this diagnosis (distinction, case class, sequence test, model, reformulation, etc.).
          4.  If no progress is expected, argue for that and consider if fixing the question changes the dispute's character.
      *   **Constraint:** Do *not* give a verdict on which account is true. Do *not* survey the literature. Focus on the *structure of the debate*.

  2.  **Analyze the Three Accounts (as presented by the user):**
      *   **Interest (Williams/Drescher):** Focuses on economic viability, profitability, and class interest. *Epistemic stance:* Skeptical of stated moral reasons (rationalization). *Explanandum:* Why the system became unsustainable or why the dominant class allowed it to end.
      *   **Argument (Moral Realism):** Focuses on the truth of the moral claims and their apprehension. *Epistemic stance:* Takes stated moral reasons at face value (truth-tracking). *Explanandum:* Why the practice was recognized as wrong and abandoned.
      *   **Honor (Appiah):** Focuses on social status, shame, and codes of conduct. *Epistemic stance:* Treats moral reasons as symptoms of status games/tools for reclassification. *Explanandum:* How individual action was mobilized against free-riding via social pressure.

  3.  **Diagnose the Disagreement (Sorting the Components):**

      *   *Component 1: The Explanandum (What is being explained?)*
          *   User Hypothesis 1 suggests they address different things (feasibility, direction, mobilization).
          *   *Analysis:* If Interest says "It became cheap to end," Argument says "It became right to end," and Honor says "It became shameful to continue," they are technically explaining the *same event* (cessation of practice) but via different *mechanisms*. However, the user notes Interest explains *timing/feasibility*, Argument explains *direction*, Honor explains *mobilization*.
          *   *Verdict:* This is largely a **Difference about the Explanandum**. They are answering slightly different "why" questions (Why then? Why this way? How coordinated?).

      *   *Component 2: The Epistemic Status of Testimony (How do we know motives?)*
          *   User Hypothesis 3 highlights this. Interest = rationalization; Argument = truth; Honor = status signal.
          *   *Analysis:* This is a fundamental methodological clash. It's not just about evidence; it's about the *hermeneutics of suspicion* vs. *charity*.
          *   *Verdict:* This is **Bedrock (Methodological/Metaphysical)**. It stems from underlying views on human rationality and the nature of moral motivation. It's hard to resolve empirically because every piece of evidence is interpreted through the lens.

      *   *Component 3: Causal Structure (Sequence and Necessity)*
          *   User Hypothesis 4 mentions causal ordering (status vs. cost).
          *   *Analysis:* This is an empirical question. Did profits fall *before* abolitionist sentiment peaked? Did shame precede economic shifts?
          *   *Verdict:* This is a **Substantive Empirical Question**. It is resolvable in principle, though data might be messy.

      *   *Component 4: The Definition of "Cause" (Standards of Explanation)*
          *   User Hypothesis 2 suggests all three are "difference-making" causes.
          *   *Analysis:* If A, B, and C are all necessary conditions for E, arguing over which is *the* cause is often a verbal dispute about salience or "proximate" vs. "ultimate" cause.
          *   *Verdict:* This is **Verbal (or Conceptual)**. It's about what counts as *the* explanation vs. *a* condition.

  4.  **Synthesize the Diagnosis:**
      *   The stalemate isn't one thing. It's a layered confusion.
      *   Layer 1 (Verbal): Fighting over "the cause" when multiple necessary conditions exist.
      *   Layer 2 (Explanandum): Fighting over whether we are explaining the *possibility*, the *direction*, or the *coordination*.
      *   Layer 3 (Bedrock): The hermeneutic stance on actor testimony (Hermeneutics of Suspicion vs. Charity).
      *   Layer 4 (Empirical): The actual sequencing of economic vs. normative shifts.

  5.  **Determine Pathways to Progress:**
      *   Since the "Verbal" and "Explanandum" issues are conceptual, progress requires **Reformulation of the Explanandum**. Instead of "What caused abolition?", ask "What were the necessary conditions for abolition, and which was the binding constraint at time T?"
      *   Since the "Empirical" issue is resolvable, progress requires **Sequence Testing**. (e.g., Did profitability drop *before* or *after* the shift in honor codes?).
      *   Since the "Bedrock" issue is hard, progress requires **Formal Modeling**. A model that integrates status and incentives could show how they interact without requiring a verdict on "true motives."
      *   *Crucial Insight:* The user's hypothesis that the debate is "underpowered" is key. The dispute persists because the question is too broad ("Why did it end?"). Narrowing it ("Why did it end *when* it did?") forces the theories to separate.

  6.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Academic, analytical, respectful of the user's deep engagement.
      *   *Structure:*
          1.  Introduction: Acknowledge the sophistication of the user's impasse.
          2.  Diagnostic Sorting: Break down the disagreement into the four categories (Verbal, Explanandum, Evidence/Bedrock, Empirical).
          3.  Support: Show what each camp is committed to in each category.
          4.  Pathways to Progress: Specific methodological moves (Reformulation, Sequence, Modeling).
          5.  The "Fixed Question" Test: Address the final prompt about fixing the question to P, R, Y.
      *   *Refining the "Bedrock" point:* Be careful not to dismiss the epistemic dispute as merely verbal. It's a deep philosophical divide about the nature of reasons. Call it "Methodological Bedrock."
      *   *Refining the "Progress" point:* Don't just say "do more history." Suggest *how* to frame the history to force a distinction. The "Binding Constraint" model is useful here.

  7.  **Final Review against Constraints:**
      *   Did I pick a winner? No.
      *   Did I survey literature? No (used only what user provided).
      *   Did I answer the specific prompt about the "Fixed Question"? Yes.
      *   Is the diagnosis clear? Yes.

  8.  **Final Polish:** Ensure the distinction between "Verbal" and "Explanandum" is clear. (Verbal = same meaning, different words; Explanandum = different phenomena entirely). Here, it's mostly Explanandum (feasibility vs. motivation) masquerading as competition over the same event. Also, ensure the "Bedrock" issue regarding testimony is highlighted as the hardest nut to crack.

  *(Self-Correction during drafting)*: I initially thought about calling the testimony issue "Evidence Standards." But the user notes it's about whether testimony *counts* as evidence of motive at all. That's deeper than standards; it's about the ontology of reasons. I will classify it as Bedrock/Methodological.

  *(Refining the "Fixed Question" conclusion)*: If we fix the question to "Why did P cease in R by Y?", does the dispute change? Yes, it forces the Empirical/Sequence layer to the front and pushes the Bedrock layer back, because you can measure Y against economic data and status markers. It makes the debate *falsifiable* rather than *interpretive*.

  9.  **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  Your impasse is not a failure of research but a symptom of a category error in the historiography of moral change. The three accounts you describe are not rival hypotheses competing to explain the *same* variable; they are rival frameworks attempting to claim exclusivity over a *complex system* where multiple variables are co-constitutive. The stalemate persists because each side treats its necessary condition as a sufficient cause, and because they operate with incompatible hermeneutics regarding human agency.

  Here is a diagnosis of the disagreement, sorted by the logical type of each component, followed by a prescription for progress.

  ### I. Diagnostic Sorting of the Disagreement

  The disagreement is not monolithic. It comprises four distinct layers. Confusion arises because participants argue Layer 4 (Empirical) while implicitly assuming Layer 1 (Verbal) and Layer 3 (Bedrock).

  #### 1. Verbal Dispute (The Definition of "Cause")
  *   **Diagnosis:** A significant portion of the conflict is verbal, stemming from an ambiguity in what constitutes an "explanation."
  *   **Commitments:**
      *   **Interest:** Treats "cause" as the *removal of a barrier*. (The practice ended because the cost of maintaining it exceeded the benefit.)
      *   **Argument:** Treats "cause" as the *presence of a motive*. (The practice ended because agents acquired a new reason to stop.)
      *   **Honor:** Treats "cause" as the *coordination mechanism*. (The practice ended because the social cost of deviation dropped.)
  *   **Analysis:** On a counterfactual account of causation, all three are causes. If profits had remained high (Interest), abolition might not have happened. If the practice hadn't been deemed wrong (Argument), no one would have sought to end it. If shame hadn't been attached (Honor), free-riding would have persisted. The dispute is verbal because each side claims the title of "The Cause" for their specific necessary condition.
  *   **Verdict:** **Verbal.** This component generates heat but no light. It is resolved by shifting from "What caused X?" to "What was the binding constraint on X?"

  #### 2. Difference About the Explanandum (Feasibility vs. Direction vs. Coordination)
  *   **Diagnosis:** The accounts are actually addressing different phases or dimensions of the same historical event.
  *   **Commitments:**
      *   **Interest:** Explains **Feasibility and Timing**. (Why *then*? Because the economic structure could absorb the shock.)
      *   **Argument:** Explains **Normative Direction**. (Why *this* change and not another? Because the arguments tracked moral truth.)
      *   **Honor:** Explains **Mobilization**. (How was collective action achieved? Because status incentives aligned individual behavior.)
  *   **Analysis:** Your first working hypothesis is correct. The Interest camp explains the *permissibility* of the change for the elite; the Argument camp explains the *content* of the change; the Honor camp explains the *enforcement* of the change. They talk past each other because one is explaining the *possibility space*, another the *vector*, and the third the *engine*.
  *   **Verdict:** **Difference about the Explanandum.** Progress requires disaggregating the event "abolition" into these three sub-components.

  #### 3. Bedrock Disagreement (The Epistemic Status of Testimony)
  *   **Diagnosis:** This is the most intractable layer. It is a methodological and metaphysical divide regarding the nature of human reasons.
  *   **Commitments:**
      *   **Interest:** Operates on a **Hermeneutics of Suspicion**. Stated moral reasons are epiphenomenal; real causes are structural and often unconscious.
      *   **Argument:** Operates on a **Hermeneutics of Charity/Realism**. Stated moral reasons are truth-tracking and causally efficacious.
      *   **Honor:** Operates on a **Hermeneutics of Functionalism**. Stated moral reasons are tools for social positioning; their truth value is irrelevant to their causal power.
  *   **Analysis:** No amount of empirical evidence can settle this, because each framework processes evidence differently. If an abolitionist writes a letter citing scripture, the Argument camp sees a cause, the Interest camp sees a rationalization, and the Honor camp sees a status signal. This is not a dispute about the past; it is a dispute about the philosophy of action.
  *   **Verdict:** **Bedrock.** This cannot be "solved" empirically, only bracketed or modeled.

  #### 4. Substantive Empirical Question (Causal Ordering)
  *   **Diagnosis:** Beneath the philosophical noise, there is a resolvable historical question regarding sequence.
  *   **Commitments:**
      *   **Interest:** Predicts economic decline/shift *precedes* or *coincides* with moral shift.
      *   **Honor/Argument:** Predicts normative/status shift *precedes* economic accommodation.
  *   **Analysis:** As you noted with the footbinding and dueling cases, the timing varies. In some cases, economics leads; in others, status leads. The universal claim of any single theory is empirically falsifiable, but the theories survive by retreating to "it was a mix" whenever sequence data contradicts them.
  *   **Verdict:** **Substantive Empirical Question.** This is the only layer capable of yielding definitive progress, provided the other layers don't obscure the data.

  ---

  ### II. Pathways to Progress

  Given this diagnosis, a verdict on "which account is true" is impossible because the question is ill-posed. However, progress is possible if you change the rules of engagement. You should not aim for a synthesis, but for a **structural clarification**.

  #### 1. Reformulate the Explanandum (The "Binding Constraint" Model)
  Stop asking "What caused the end of slavery?" Instead, ask: **"At time T, what was the binding constraint preventing the continuation of the practice?"**
  *   In 1790, the constraint might have been *Honor* (it was still glorious).
  *   In 1800, the constraint might have been *Interest* (it was still profitable, so Honor couldn't bite).
  *   In 1807, the constraint might have shifted to *Feasibility* (the cost of enforcement rose, or profitability fell).
  *   **Progress:** This turns the debate from a competition into a timeline. It allows all three accounts to be "true" at different stages of the process. Your chapter should propose a **Phase Model of Moral Revolution**: (1) Normative Innovation (Argument), (2) Status Contagion (Honor), (3) Structural Accommodation (Interest).

  #### 2. A Test About the Sequence of Changes
  To address the Empirical layer, you need a criterion for **Decoupling**.
  *   **The Test:** Identify cases where Status shifted *without* Economic change, or Economic change occurred *without* Status shift.
  *   **Application:** You mentioned dueling in Britain vs. France. If British dueling ended while the economic structure remained identical to France's, the Interest account is falsified as a *sufficient* explanation for that specific case. If footbinding ended in regions where machine yarn *did not* penetrate, the Interest account is falsified as a *necessary* explanation.
  *   **Progress:** Collect a matrix of cases where these variables diverge. This forces the Interest camp to concede that economics is not always the driver, and the Honor camp to concede that status shifts sometimes require economic cover.

  #### 3. Formal Model of Status and Incentives
  To address the Bedrock layer (testimony), stop trying to read minds. Use a **Rational Choice Model with Endogenous Preferences**.
  *   Construct a model where "Honor" is treated as a utility function. An agent maximizes Utility = Economic Gain + Status Reputation.
  *   In this model, it does not matter if the agent *believes* the moral argument (Argument camp) or is *cynically* protecting their status (Honor camp). The behavioral output is identical.
  *   **Progress:** This bypasses the hermeneutic dispute. It shows that the "Argument" and "Honor" accounts are observationally equivalent at the macro level, distinguishing them only by the micro-level psychology which may be historically inaccessible. This allows you to treat the "Argument" account as a description of the *content* of the status signal, rather than a claim about internal mental states.

  ---

  ### III. The "Fixed Question" Test

  You asked: *Would the dispute change character if the question were fixed beforehand as: "Why did practice P cease to be performed by anyone in region R by year Y?"*

  **Yes, the dispute would change character, but it would not disappear.**

  1.  **It Forces Empirical Specificity:** By fixing P, R, and Y, you eliminate the ability to shift the goalposts. You cannot say "Slavery didn't really end in 1833" or "The economy wasn't the main factor globally." You must account for the specific cessation in that specific window. This privileges the **Substantive Empirical** layer over the **Bedrock** layer.
  2.  **It Exposes Overdetermination:** In a fixed window (e.g., British Slave Trade, 1807), it is highly likely that all three factors were present. The question then becomes: **Which factor was the *marginal* difference?**
      *   If profits were high (Drescher) and Honor was shifting (Appiah), then Honor is the marginal cause.
      *   If profits were falling (Williams) and Honor was static, Interest is the marginal cause.
  3.  **It Does Not Solve the Testimony Problem:** Even with a fixed question, the Interest camp will argue that the Honor shift was *caused* by unacknowledged economic anxieties, while the Honor camp will argue the economic data is irrelevant to the social mechanism. The Bedrock disagreement regarding the *interpretation* of the actors' motives will persist.

  **Conclusion for your Chapter:**
  Do not attempt to resolve the disagreement. Instead, **diagnose it as a category error.** Your framing chapter should argue that the historiography of moral revolutions is stalled because it treats a **systemic transition** as a **single-cause event**.

  Propose that progress requires:
  1.  **Disaggregating the Explanandum:** Distinctly analyzing feasibility, direction, and coordination.
  2.  **Bracketing the Bedrock:** Treating moral testimony as a social fact (a move in a status game) rather than trying to adjudicate its sincerity.
  3.  **Seeking Marginal Causality:** Focusing on sequence and binding constraints in specific (P, R, Y) instances rather than general theories of "Moral Revolutions."

  If you frame the volume around this **logic of disagreement** rather than the history itself, you turn your stall into the book's central theoretical contribution. You are not failing to write the chapter; you have discovered that the chapter *is* the diagnosis of why the previous chapters couldn't be written.
