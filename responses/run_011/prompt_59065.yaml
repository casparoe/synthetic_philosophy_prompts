answer: |-
  Candidate rules hover between culpability for injustice, causal contribution to harm, membership in armed forces, and necessity of contribution. The tension lies primarily between the liable conscript, who lacks culpability, and the non-liable machinist, who contributes materially.

  **Prediction:** She will rule the engineer **liable to defensive harm**. Furthermore, despite the engineer's marginal and replaceable contribution, she will rule this liability **extends to lethal harm**. The conscript's verdict establishes that replaceability does not negate lethal liability within the operative class.

  | Candidate Rule | Verdict on Engineer | Strongest Supporting Case |
  | :--- | :--- | :--- |
  | **Moral Responsibility** | Not Liable | Conscript (liable despite indifference) contradicts this. |
  | **Material Contribution** | Liable | Machinist (not liable despite making weapons) contradicts this. |
  | **Social Role (Combatant)** | Not Liable | Drone Contractor (liable without uniform) contradicts this. |
  | **Functional Integration** | **Liable** | Fits Intel Officer & Drone Contractor (remote, civilian, operational). |

  **Reasoning**

  To infer the operative rule, we must stress-test the four candidates against the eight settled verdicts.

  **1. Liability grounded in moral responsibility.** This revisionist standard fails immediately. The theorist deems the frightened, politically indifferent conscript liable. If culpability were the threshold, the conscript would be immune, while the ideological volunteer and general would be solely targeted. Since the conscript is liable, moral responsibility is not the necessary condition.

  **2. Liability grounded in material contribution.** This traditionalist standard is too broad. The machinist produces the physical instruments of death yet is not liable. The radio presenter bolstering war morale contributes materially to capacity yet is immune. If material contribution sufficed, the industrial base would be legitimate targets. The theorist clearly draws a line before the factory gate.

  **3. Liability grounded in occupying the socially recognized role of combatant.** This fits the uniformed personnel (conscript, general, volunteer, medic) but fractures on the civilians. The surveillance contractor and intelligence officer wear no uniforms and operate outside the theater, yet are liable. If "social role" implies legal combatant status, these verdicts are inconsistent. The rule must be functional, not formal.

  **4. Liability graded by size and necessity of contribution.** This explains why the general is *more* obviously liable than the conscript. However, it fails to explain the binary distinction between the conscript (liable to death) and the machinist (immune). Both are replaceable cogs; one is inside the structure, one outside. Furthermore, if grading negated lethality for marginal contributions, the conscript would not be a legitimate target for lethal force.

  **The Operative Rule: Functional Integration into the Operational Chain.**
  The only rule fitting all eight verdicts is liability based on direct functional integration into the war-fighting apparatus, excluding those with protected functions (medics) or indirect industrial support (machinists, presenters). The conscript, general, volunteer, drone contractor, and intel officer all perform immediate operational roles enabling harm. The medic is integrated but functionally protected by humanitarian convention. The machinist and presenter are causally relevant but operationally distant.

  **Application to the Engineer:**
  The software engineer maintains the target-selection model. This is not industrial production (machinist) but operational enablement (intel officer, drone contractor). She determines *who* is struck, akin to the intel officer running interrogations or the contractor piloting surveillance. Her neutral nationality and private employment mirror the contractor's remote status. Therefore, she is functionally integrated.

  Regarding lethality: The conscript's verdict is decisive. He is frightened, indifferent, and presumably replaceable, yet he is a legitimate target for lethal force. The theorist has already rejected the claim that marginality or lack of conviction shields one from lethal harm if one is functionally integrated into the unjust threat. To rule otherwise for the engineer would require a new principle distinguishing "direct operational software support" from "direct operational infantry presence," for which there is no evidence in the record.

  **Underdetermination Check:**
  If the record underdetermines this, ruling her liable commits the theorist to the principle that *code is equivalent to kinetic force* regarding integration. Ruling her immune commits her to the principle that *physical proximity or uniform* remains a necessary condition for liability, contradicting the drone contractor verdict. A discriminating case would be: *A logistics coordinator who schedules fuel deliveries to the front line.* If liable, integration is purely causal/operational; if immune, physical proximity to the "kill chain" matters.
