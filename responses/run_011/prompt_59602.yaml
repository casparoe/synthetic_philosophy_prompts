      *Self-Correction on Point 4:* Why does the analogy hide Banach-Tarski? Because socks are discrete atoms. Banach-Tarski relies on the structure of the rotation group acting on the sphere (continuous, non-amenable). The analogy abstracts away all structure except "pair-ness."

      *Structure:* Use the numbered headings from the prompt for clarity.

