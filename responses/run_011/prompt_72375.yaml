      Upon lease expiration without renewal, the asset is not destroyed. Melting is fiscally inefficient and erases historical data. Instead, assets are cataloged and placed in municipal storage pending future demand. This operates similarly to an interlibrary loan system. The honoree remains available for study but is not actively honored in public space.

