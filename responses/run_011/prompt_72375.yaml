      Any resident may petition for a new honoree. Applications must demonstrate current community alignment rather than historical significance alone. Applicants must specify which subset of the community the honoree represents. If the community definition shifts, the lease is subject to immediate review. This ensures the monument speaks only for those currently consenting to be represented.

