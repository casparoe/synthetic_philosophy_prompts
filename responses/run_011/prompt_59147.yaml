answer: |-
  **Credence: 0.15**

  I am assigning a 15% credence that Devlin-lite is correct in the sense you specify: that there exists a genuine *pro tanto* reason of that specific kind (preservation of constitutive moral practice via criminal law) that can sometimes outweigh the liberal presumption.

  Here is the decomposition. I treat these terms as **conjunctive but dependent**. If any single term fails completely, the justification collapses, but the terms are not probabilistically independent; failure in one increases the likelihood of failure in others.

  ### The Decomposition

  **Term 1: The Metaphysics of Community (0.50)**
  *Claim:* A "shared moral practice" is a non-instrumental good, distinct from the aggregated preferences of individuals.
  *Justification:* This is the communitarian wager. It is plausible that social meanings and shared forms of life have value beyond individual satisfaction. However, it is equally plausible that this is a reification of a collective entity that does not exist independently of its members. I split the difference.
  *Status:* Contested but defensible.

  **Term 2: Epistemic Access (0.30)**
  *Claim:* The "man in the jury box" (disgust/indignation) reliably tracks the *constitutive* morality of the community rather than transient prejudice or irrational squeamishness.
  *Justification:* Psychological evidence suggests disgust tracks contamination and out-group bias more reliably than deep social cohesion. Using majority sentiment as a proxy for "constitutive morality" conflates *what is* with *what is valuable*. This filter is noisy and systematically biased against minorities.
  *Status:* Weak.

  **Term 3: The Efficacy Mechanism (0.20)**
  *Claim:* Criminalization preserves shared moral commitment rather than replacing it with compliance-through-fear.
  *Justification:* This is the bottleneck. Morality, by definition, requires an internal point of view (commitment). Law operates through external sanctions. Using law to enforce morality tends to crowd out intrinsic motivation, converting a shared practice into a coordination problem of avoidance. If the good is "shared commitment," the means (coercion) destroys the end.
  *Status:* Very Weak.

  **Term 4: Harm-Coherence (0.50)**
  *Claim:* Condition (iii) is satisfiable (i.e., "harm" can be defined narrowly enough that moral erosion counts as non-harm).
  *Justification:* If "harm" includes damage to the moral fabric, condition (iii) is never met, and you are back to standard Devlin. If "harm" is strictly Millian (sense-perceptible), it is hard to argue that *tolerance* causes the erosion rather than the *conduct* itself. You are stipulating a causal gap that may not exist.
  *Status:* Moderate.

  **Term 5: Normative Weight (0.40)**
  *Claim:* This good is weighty enough to outweigh the *pro tanto* presumption against interfering with intimate, private autonomy.
  *Justification:* Even if the good exists, liberal autonomy regarding the "ethics of the self" is a primary good. For the moral preservation to outweigh this, the loss of the form of life must be catastrophic, not just a diminution of value.
  *Status:* Low.

  ### Combination Rule
  I model this as a **weighted conjunctive chain**. The total credence cannot exceed the lowest term multiplied by a dependency factor.
  Formula: $C_{total} \approx T_1 \times T_2 \times T_3 \times T_4 \times T_5 \times D$
  Where $D$ is a dependency discount (because if Term 3 fails, Term 1 becomes irrelevant).
  However, since you asked for a credence in the *existence of the reason*, not the *all-things-considered judgment*, I am not multiplying strictly (which would yield <0.01). I am assessing the probability that the *argument holds together*.
  The Efficacy Term (0.20) acts as a ceiling. You cannot have a reason to use a means that negates the end.
  My 0.15 reflects the probability that Term 3 is actually false (i.e., that law *can* sometimes preserve morality without corruption) combined with the other uncertainties.

  ### Sensitivity Analysis
  **Most Sensitive Term:** Term 3 (Efficacy Mechanism).
  **What would move it:** Empirical or sociological evidence showing that legal prohibition of private vice actually *increases* internalized moral commitment among the majority, rather than driving it underground or creating resentment. If you can show that law functions expressively to reinforce internal norms without crowding them out, my credence jumps to 0.45. If you concede law necessarily externalizes commitment, my credence drops to 0.05.

  ### The Hart Escape Check
  **Bluntly: No, you have not escaped Hart.**

  You have not escaped Hart; you have abandoned Devlin.
  Devlin's argument was sociological: *Immorality $\rightarrow$ Disintegration $\rightarrow$ Harm.*
  Hart refuted the causal link.
  Your argument is normative: *Immorality $\rightarrow$ Loss of Value.*
  By removing the empirical claim about social breakdown, you remove Devlin's justification for why the *state* (which exists to prevent breakdown/harm) should care.
  If there is no risk of breakdown, why is this a matter for *criminal law* rather than social pressure, education, or civil association?
  Devlin-lite collapses into **Moderate Legal Moralism** (like Michael Moore's position), which relies on moral realism, not social cohesion.
  Furthermore, you have not hidden the corpse in condition (iv); you have hidden it in the definition of "constitutive." If the majority feels it, it's constitutive. That is exactly the "tyranny of the majority" Hart accused Devlin of endorsing. Hart would argue that without the threat of collapse, the majority's desire to enforce morality is just preference satisfaction, which carries no weight against liberty.

  ### Dispute Resolution: You vs. Co-author
  **Your Credence:** 0.25
  **Co-author's Credence:** 0.6

  **Who is more wrong?** Your co-author is significantly more wrong.
  **On which term?** Term 3 (Efficacy) and Term 1 (Metaphysics).

  **Analysis:**
  Your co-author believes the "constitutive-good premise is nearly free." This implies she assigns Term 1 a probability near 1.0 and ignores Term 3. She assumes that because a form of life is valuable, the state can preserve it *as a form of life* using coercion. This is a category error. A "shared practice" enforced by police is no longer a "shared practice" in the sense that gives it value; it becomes a regime of compliance.
  She is likely conflating the *value of community* with the *value of state-enforced uniformity*.

  You are closer to the mark, but your 0.25 suggests you are still granting too much weight to Term 1 (Metaphysics). You suspect it "does all the work." It doesn't. Term 3 (Efficacy) does the killing. Even if the constitutive good is real (Term 1 = 1.0), if criminal law destroys it (Term 3 = 0.0), the justification is 0.0.
  You are diverging because she is skeptical of the Harm Principle (making her more willing to accept criminalization), while you are skeptical of the Moral Good. But the real disagreement should be about the **mechanism of law**.

  **Recommendation:**
  Stop trying to salvage Devlin. You are building a chassis for an engine you've already removed.
  1.  Acknowledge that without the disintegration thesis, this is no longer Devlin; it is Legal Moralism.
  2.  Pivot the chapter to argue that *even if* we accept the constitutive good (granting your co-author Term 1), the **Efficacy Term** makes criminalization self-defeating.
  3.  That is a stronger, more novel contribution than trying to make Devlin-lite work. It uses communitarian premises to reach liberal conclusions.

  **Final Number:** 0.15.
  **Primary Failure Point:** The use of coercion to sustain voluntary commitment.
