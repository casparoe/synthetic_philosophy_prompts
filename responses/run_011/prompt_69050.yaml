answer: |-
  # STUDENT HANDOUT: Diagnostic Instrument on Scientific Inference

  **Instructions:** Below are ten scenarios concerning how we gather evidence for general rules. Read the setup carefully. For each question, select the single option that best matches your immediate judgment. Do not overthink the technical implications; answer based on what feels like the correct verdict about the evidence.

  **The Shared Setup:** In all questions below, assume we are investigating a universal rule of the form **"All X are Y."** Logically, this is equivalent to **"All non-Y are non-X."** Assume that finding an X that is Y counts as evidence for the rule. The question is whether other observations count as evidence, and if so, how much.

  ***

  **1. The Barrel of Mixed Objects**
  Imagine a barrel containing one million items. You are told exactly two hundred of them are ravens; the rest are various other objects (shoes, pebbles, leaves). You draw one item at random. It turns out to be a pebble (which is not black and not a raven). Does this observation give you *any* reason to believe the rule "All ravens are black" is true?
  A) Yes, it counts as evidence, however small.
  B) No, a pebble tells me nothing about ravens.
  C) It depends on whether I knew it was a pebble before I checked its color.

  **2. The Chemistry Test**
  Consider the hypothesis: "Every substance containing lithium turns a flame crimson." You hold a lump of quartz into a flame. You know quartz contains no lithium. The flame stays colorless. Does this observation support the lithium hypothesis?
  A) Yes, it is consistent with the rule and adds to the tally.
  B) No, testing things without lithium is irrelevant to what lithium does.
  C) Only if I did not already know quartz lacked lithium.

  **3. The Searched Room**
  You enter a room specifically to look for ravens. You search thoroughly and find no ravens. In the process, you notice a white shoe sitting on the table. Does the sight of the white shoe add any weight to the claim "All ravens are black," given that you already found no ravens?
  A) Yes, it is a non-black non-raven, so it fits the pattern.
  B) No, I was looking for ravens; the shoe is just background noise.
  C) It adds weight only because I was already looking for ravens and failed.

  **4. The Hostile Assistant**
  You are testing "All ravens are black." An assistant who wants to prove you wrong knows you are looking for evidence. To waste your time, they deliberately hand you a stack of red notebooks (non-black, non-ravens). Do these notebooks count as evidence for your hypothesis?
  A) Yes, evidence is evidence, regardless of who hands it to you.
  B) No, because they were selected to avoid testing the rule.
  C) Yes, but they count for less than if I had picked them myself.

  **5. The Intentional Strategy**
  You decide to test the rule "All non-black things are non-ravens" directly. You go out and collect only non-black objects to see if any are ravens. Is this a sensible way to test the original claim about ravens?
  A) Yes, it is logically the same test.
  B) No, it is a waste of time; I should look for ravens.
  C) It is valid only if non-black objects are rarer than ravens.

  **6. The Albino Raven**
  You are investigating "All ravens are black." You encounter a white bird that is biologically a raven (an albino). What is the status of your hypothesis?
  A) The hypothesis is falsified immediately; it is false.
  B) The hypothesis needs adjustment; albinos are exceptions.
  C) It depends on whether "raven" implies "typically black" in our definition.

  **7. The Contrived Predicate**
  Consider the rule: "All emeralds are *bleen*." (An object is *bleen* if it is examined before 2050 and is green, or examined after 2050 and is blue). You examine an emerald today (before 2050) and it is green. Does this support the rule that all emeralds are *bleen*?
  A) Yes, it matches the definition perfectly.
  B) No, *bleen* is an artificial category; only "green" is real.
  C) It supports "green" but not *bleen*, even though they match today.

  **8. The Weight of Evidence**
  Compare two observations: (1) Finding a black raven. (2) Finding a red herring (a non-black non-raven). Which observation gives you *more* reason to believe "All ravens are black"?
  A) They give exactly the same amount of reason.
  B) The black raven gives much more reason.
  C) The black raven gives reason; the herring gives none.

  **9. Prior Identification**
  You pick up an object. Before looking at its color, you identify it as a shoe. Then you see it is white. Does the color observation add anything to the colorless fact that it is a shoe?
  A) Yes, the combination (White Shoe) is what matters.
  B) No, knowing it was a shoe already settled the matter.
  C) Yes, because I had to verify it wasn't a black shoe.

  **10. The Goal of Inquiry**
  When you test a scientific hypothesis, what are you primarily trying to do?
  A) Gather as many matching instances as possible.
  B) Put the hypothesis in danger of being proven wrong.
  C) Calculate the mathematical probability that it is true.

  ***

  # INSTRUCTOR'S GUIDE: Scoring Key and Design Commentary

  ## I. Scoring Key: Mapping Patterns to Leaves

  This key does not use a simple point-sum. Instead, locate the student's **Profile** based on their cluster of answers. Most students will not fit perfectly; assign them to the leaf where their *weightiest* commitments lie (specifically Questions 1, 2, 4, 8, and 10).

  **Leaf 1: The Background Knowledge Resolution**
  *   **Pattern:** Answers **A** on Q1, Q2, Q3, Q5. Answers **B** on Q8 (Raven > Herring).
  *   **Diagnosis:** The student accepts the logical equivalence and the conclusion that non-ravens confirm the hypothesis. They resolve the "paradox" by appealing to the sheer volume of non-ravens compared to ravens (implied by Q8). They treat the weirdness as a psychological artifact of background knowledge.
  *   **Status:** *Unnamed (Standard Hempelian).* This is the textbook "logical" solution.

  **Leaf 2: The Minute Weight Resolution**
  *   **Pattern:** Answers **A** on Q1, Q2. Answers **B** on Q8 (Raven >> Herring). Answers **A** on Q10 (Probability/Truth).
  *   **Diagnosis:** Similar to Leaf 1, but emphasizes the *magnitude* of confirmation. They accept the logic but insist the evidential boost from a pebble is vanishingly small compared to a raven.
  *   **Status:** *Unnamed (Bayesian-leaning).*
  *   **Note on Separation:** Distinguishing Leaf 1 from Leaf 2 is difficult. Leaf 1 blames "background knowledge" for the feeling of paradox; Leaf 2 blames "low probability weight." In practice, students often conflate these. If a student selects Leaf 1 answers but emphasizes "tiny amount" in discussion, move them here.

  **Leaf 3: The Contextual/Relative Resolution**
  *   **Pattern:** Answers **C** on Q1, Q2, Q3, or Q9.
  *   **Diagnosis:** The student refuses to judge the evidence in isolation. They believe confirmation is not a relation between a single statement and a hypothesis, but depends on the total situation (how the object was found, what was known before).
  *   **Status:** *Unnamed (Contextualist).*
  *   **Note on Collapse:** This leaf often collapses into Leaf 1 under pressure. "Background knowledge" (Leaf 1) and "Context of inquiry" (Leaf 3) are functionally similar. If a student insists on **C** answers, press them: "If we fix the background knowledge, is the answer Yes or No?" If they say "Yes," move to Leaf 1. If they say "Still depends," keep here.

  **Leaf 4: The Rejection of Equivalence**
  *   **Pattern:** Answers **A** on Q1 (Raven context) but **B** on Q2 (Chemistry) or Q3 (Shoe). Answers **C** on Q8 (Herring gives none).
  *   **Diagnosis:** The student accepts that black ravens confirm "All ravens are black" but denies that non-black non-ravens confirm it. They implicitly reject the idea that logically equivalent formulations must receive the same confirmation from all evidence.
  *   **Status:** *Unnamed (Non-Equivalence).*

  **Leaf 5: The Natural Kind Restriction**
  *   **Pattern:** Answers **B** or **C** on Q7 (Grue/Bleen). Answers **A** on Q1. Answers **C** on Q6 (Albino definition).
  *   **Diagnosis:** The student accepts instance confirmation but restricts it to "real" or "natural" predicates (Raven, Black, Green) and rejects artificial ones (Non-raven, Bleen). They suspect the paradox arises from treating "non-raven" as a valid category for induction.
  *   **Status:** *Unnamed (Projectibility Constraint).*

  **Leaf 6: The Severe Testing Resolution**
  *   **Pattern:** Answers **B** on Q4 (Hostile Assistant). Answers **B** on Q10 (Danger of being wrong). Answers **B** on Q2 or Q3 (Shoe/Chem don't count).
  *   **Diagnosis:** The student rejects the "counting instances" model entirely. For them, evidence only counts if the hypothesis risked falsification. A white shoe does not risk falsifying "All ravens are black."
  *   **Status:** *Unnamed (Popperian/Severe Tester).*

  **Leaf 7: The Methodological Skeptic**
  *   **Pattern:** Answers **B** or **C** on Q1 (Barrel frequencies). Answers **B** on Q4 (Assistant bias). Answers **C** on Q5 (Strategy validity).
  *   **Diagnosis:** The student rejects the quantitative solution because the setup (knowing the barrel's contents, random sampling) is unrealistic for actual science. They argue the paradox is dissolved by noting we never have the frequency data the "solution" requires.
  *   **Status:** *Unnamed (Skeptical/Meta-Methodological).*

  ## II. Commentary on Logical Space and Instrument Design

  ### 1. Unoccupied and Collapsed Regions
  The decision tree generates 1,024 possible answer combinations (2-3 options across 10 questions). Most are logically incoherent (e.g., accepting the Chemistry analogy in Q2 but rejecting the Barrel analogy in Q1 without a contextual reason).
  *   **Incoherent Space:** Combinations where a student answers **A** (Yes) to Q1 (Barrel) but **B** (No) to Q2 (Chemistry) without selecting **C** (Context) options are logically unstable. Both scenarios describe testing a universal hypothesis via a negative instance. A student selecting this pattern likely misunderstands one scenario or holds an unexamined bias about "chemistry" vs. "logic."
  *   **The Leaf 1 / Leaf 2 Collapse:** I agree with your assessment that Leaf 1 (Background Knowledge) and Leaf 2 (Minute Weight) are hard to pull apart. Both accept the paradox's conclusion. The distinction is rhetorical: one says "It confirms, but you didn't realize you knew the frequencies," the other says "It confirms, but the math shows the boost is tiny." In a first-year seminar, these function identically. I have separated them in the key based on Q8 (Magnitude), but expect significant bleed-over.
  *   **The Leaf 3 Collapse:** Leaf 3 (Contextual) is the most unstable. A student who says "It depends on what I knew" (Leaf 3) is often just describing Leaf 1 (Background Knowledge) in different words. If the instrument forces a choice, Leaf 3 students often migrate to Leaf 1 when asked to assume "all else is equal." I have flagged this in the key instructions.

  ### 2. Contested Field Status
  This instrument is not neutral. It reflects specific commitments about how the paradox *should* be solved.
  *   **The Equivalence Assumption:** Questions 1, 2, and 5 presume that "All ravens are black" and "All non-black things are non-ravens" are the starting point. This assumes the paradox is a problem of *confirmation logic*. Some philosophers argue the paradox is a problem of *language* or *ontology*, which this tree does not fully capture.
  *   **The "Resolution" Bias:** The tree asks students to sort themselves into resolutions. This presupposes the paradox *has* a resolution. A minority view holds that the paradox reveals a fundamental incoherence in inductive logic itself (Skepticism). Leaf 7 attempts to capture this, but it is difficult to distinguish from simple confusion.
  *   **Settled vs. Contested:** There is no consensus in the literature on the "correct" solution. Leaf 1 (Hempel) was dominant mid-century; Leaf 6 (Popper/Testing) and Leaf 2 (Bayesian) are common now; Leaf 5 (Natural Kinds) is widely respected but technically difficult to define. The handout presents these as live options, not settled truth.

  ### 3. Limitations of the Instrument
  *   **Grue Detection:** Question 7 is designed to detect students conflating the Raven Paradox with the New Riddle of Induction (Goodman). If a student answers **A** (Yes, supports *bleen*), they treat all predicates equally (Leaf 1/2). If they answer **B** or **C**, they are sensitive to predicate quality (Leaf 5). However, without defining "natural kind," students may guess based on intuition rather than principle.
  *   **Quantitative Smuggling:** Question 1 (Barrel) explicitly provides frequencies (1 million items, 200 ravens). This smuggles in the Bayesian assumption that we *know* the population size. Leaf 7 students will object to this. This is intentional: it forces the Skeptic to reveal themselves.
  *   **Technical Jargon:** I have avoided terms like "confirmation," "probability," "falsification," and "projectibility" in the student handout, replacing them with "reason to believe," "chance," "proven wrong," and "real category." This ensures students answer from intuition rather than recall.

  ### 4. Implementation Advice
  Use this instrument on the first day of the unit. Collect the answers, but do not grade them. In the second week, reveal the "Leaves" and ask students to identify which group they fell into. This creates immediate investment in the literature: "I was a Leaf 6; why does the reading say I'm wrong?" or "I was a Leaf 1; does this author agree with me?"

  Be prepared to mediate the Leaf 1 vs. Leaf 2 debate. It is the most common source of friction. Remind students that if both agree the pebble provides *some* evidence, they are on the same side against the Leaf 4 (No Equivalence) and Leaf 6 (Severe Test) students. The distinction between "Background Knowledge" and "Minute Weight" is often a matter of emphasis, not fundamental logic.
