              6.  Intentional testing of contrapositive vs. raven formulation.
              7.  Control question with a "Grue-type" predicate.
          *   Scoring Key: Map answer patterns to "leaves" (positions).
          *   Positions to distinguish:
              1.  Accept conclusion, blame background knowledge (Hempel-esque/Standard).
              2.  Accept conclusion, weight is real but minute (Bayesian-esque).
              3.  Weight not fixed without total knowledge (Contextual/Relative).
              4.  Keep instance confirmation, reject contrapositive inheritance (Reject Equivalence).
              5.  Restrict to projectible/natural kinds (Goodman-esque).
              6.  Confirmation is wrong enterprise; focus on severe testing (Popper-esque).
