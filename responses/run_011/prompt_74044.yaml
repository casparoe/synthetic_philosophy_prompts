answer: |-
  Here is the translation of the supererogation debate into your filing cabinet, followed by the residue report and the verdict.

  ### The Translation: Torts and Contracts Speak

  **The Core Category (Supererogation)**
  In your vocabulary, a supererogatory act is **nonfeasance where no duty attaches, voluntarily converted into action.**
  *   **The Grenade Guy / Kidney Donor:** This is a stranger with no **special relationship** to the victim. There is no **duty to rescue**. Under the common law, walking away is **non-actionable nonfeasance**. Stepping in is a **voluntary undertaking**.
  *   **The "Goodness":** In law, this translates to conduct that exceeds the **standard of care**. The "reasonable person" is not required to jump on the grenade; they are only required to act reasonably under the circumstances. Jumping is an extreme deviation from the baseline in the positive direction.
  *   **The "Not Required":** This is the **no-duty rule**. Absent a contract (**consideration**) or a special relationship (carrier/passenger, landowner/invitee), the court will not impose liability for omission.

  **The Paradox (If X is better, why isn't X required?)**
  *   **Legal Restatement:** If the **risk-utility calculus** shows that Act X prevents more harm than Act Y at a manageable cost, why is Act X not the **standard of care**?
  *   **The Legal Answer:** Because the standard of care is a floor, not a ceiling. It is defined by what is *customary* and *reasonable*, not what is *optimal*. If we made the optimal act the required act, we would be imposing **strict liability** on human behavior. We would be turning every **gratuitous promise** into an enforceable contract.
  *   **The Consequentialist Reply (You must do the best act):** This is the argument for expanding **negligence per se** or creating a statutory **duty to rescue**. It argues that the **breach** occurs whenever a better outcome was available and foregone.
  *   **The Kantian Reply (Wide duties with latitude):** This maps onto **discretionary functions** or the scope of a **voluntary undertaking**. Once you undertake to help (Restatement § 323), you have a duty to do so non-negligently. But you have "latitude" on *whether* to undertake it in the first place. You can choose the time, place, and manner, provided you don't leave the victim worse off (**detrimental reliance**).

  **The Cultural Artifact (Room for Saints)**
  *   **Legal Restatement:** This is **Public Policy**. We limit **duty** to keep the courts from being flooded and to avoid chilling socially useful conduct.
  *   **Good Samaritan Immunity:** We explicitly immunize the rescuer from ordinary negligence to encourage them to act. We acknowledge that if we held them to the standard of a paid professional (**higher standard of care**), they wouldn't act at all.
  *   **The Rescue Doctrine:** We allow the injured rescuer to sue the tortfeasor who created the peril. We recognize the rescue as a **foreseeable intervening cause**, not a superseding one. We validate the act without mandating it.

  **The Hard Cases (Vermont and Minnesota)**
  *   **Statutory Duty to Rescue:** In these jurisdictions, the legislature has turned specific **nonfeasance** into **misfeasance** (criminal omission).
  *   **The Test:** Here, the "supererogatory" category is legislatively abolished for basic rescue. Failing to throw a life ring is no longer "beyond duty"; it is a crime. This proves that the boundary between "duty" and "beyond duty" is not metaphysical; it is a policy switch that can be flipped. If the state can flip it, the category is contingent, not absolute.

  ***

  ### The Residue Report

  Here is where the translation breaks down, where I had to force the fit, and what evaporates entirely.

  **1. What Translates Cleanly**
  *   **Nonfeasance vs. Misfeasance:** This is the exact structural equivalent of "Duty vs. Beyond Duty." If there is no duty, you are in the realm of the supererogatory. If there is a duty, you are in the realm of obligation.
  *   **Voluntary Undertaking:** This captures the "choice" element perfectly. You aren't bound until you act.
  *   **Good Samaritan Statutes:** These are the legal admission that society wants to encourage acts that are not legally required. They are the statutory recognition of the category.

  **2. Where I Had to Bend the Framework**
  *   **The "Better Than" Metric:** In philosophy, Act X is "morally better" than Act Y. In law, Act X is just "not negligent." The law has no mechanism to distinguish between "barely reasonable" and "heroically reasonable." Both result in a verdict for the defense. I had to smuggle in the idea that "exceeding the standard of care" equals "moral good," but legally, exceeding the standard of care is usually just evidence that the standard wasn't breached. It's a null set in the judgment.
  *   **The "Requirement" Concept:** Philosophers argue about whether an act is *required*. In law, "required" means "enforceable by state coercion." I had to assume that when philosophers say "required," they mean "blameworthy if omitted." But law separates enforceability from blameworthiness. You can be blameworthy (morally) for walking past a drowning man, but not liable (legally). The translation assumes these two concepts should overlap, but your practice proves they don't.

  **3. What Has No Expression (The Dead Zone)**
  *   **Praise and Merit:** This is the biggest loss. The law is binary: Liable or Not Liable. Guilty or Not Guilty. There is no verdict of "Exemplary."
      *   **Why it dies:** Remedies are compensatory or punitive. Compensatory remedies restore the status quo ante; they don't reward virtue. Punitive remedies punish malice; they don't reward benevolence. There is no "Virtutive Damages." The legal system is structurally blind to positive deviation from the norm. It sees a grenade jumper as a "volunteer," not a "saint."
      *   **The Consequence:** In your filing cabinet, the grenade jumper is just a plaintiff (if injured) or a witness. His moral status is irrelevant to the **damages** calculation. The philosophical category of supererogation relies entirely on the *praise* component. Remove the praise, and it's just "non-actionable conduct."
  *   **Degrees of Obligation:** Philosophy talks about "imperfect duties" (duties you can fulfill in many ways). Law talks about "scope of duty." If you breach the scope, you pay. There is no legal concept of "I fulfilled my duty generally, just not in this specific optimal way," unless we are talking about **business judgment rules** in corporate law. In torts, if you breached, you breached.

  **4. Smuggled Assumptions**
  *   **The "Reasonable Person" as Moral Baseline:** I treated the "Reasonable Person" standard as the line between Duty and Supererogation. But the Reasonable Person is a fiction based on community custom and risk-utility, not moral perfection. By using it as the baseline, I assumed the law's floor is morality's floor. It isn't. The law's floor is much lower.
  *   **Binary Duty:** I treated "Duty" as a switch (On/Off). Philosophers treat "Obligation" as a spectrum. I forced their spectrum into your switch. This makes the "Paradox" look like a glitch in the switch, when it might be a flaw in the spectrum.

  ***

  ### The Verdict

  You asked if the residue is a limitation of legal thinking (blindness to the admirable) or evidence that the philosophical category is doing less work than it looks.

  **It is evidence that the philosophers are pushing two different scales through a single word.**

  Here is the breakdown:

  1.  **Reasons vs. Requirements:** The paradox of supererogation exists because philosophy uses the word "Duty" to cover two distinct concepts that your practice keeps in separate drawers:
      *   **Drawer A: Evaluative Reasons (The "Good").** This is scalar. It measures merit, virtue, and optimality. (The Grenade Guy).
      *   **Drawer B: Enforceable Requirements (The "Must").** This is binary. It measures liability, breach, and coercion. (The Standard of Care).
  2.  **The Category Error:** When philosophers ask, "If X is better, why isn't it required?" they are asking why Drawer A doesn't automatically populate Drawer B.
      *   **The Legal Answer:** Because Drawer B is not designed to maximize good; it is designed to minimize unacceptable harm at a sustainable social cost. If we moved every "Better Act" into "Required Act," the **standard of care** would become impossible to meet for most people, and the **remedies** system would collapse under the weight of universal breach.
  3.  **The Limitation:** Is the law blind to the admirable? Yes. But not because it's broken. It's blind because **enforceability requires a floor, not a ceiling.** You cannot litigate merit. You can only litigate deviation.
      *   To make "praise" actionable, you would need a court to award damages for *not* being a hero. That turns supererogation into duty, destroying the category.
      *   To make "praise" visible, you would need a court to award damages for *being* a hero. That turns tort law into a meritocracy, which it isn't.

  **Conclusion:**
  The "Paradox of Supererogation" is what happens when you try to run a moral operating system on legal hardware. The hardware (Law) is built to process **breach** and **causation**. It throws an error when you try to process **merit** and **sainthood**.

  The philosophers think the error proves the hardware is missing a file. You know the error proves the file doesn't belong in that directory. The category of "Supererogation" is real in the moral sphere (Drawer A), but it has no jurisdiction in the legal sphere (Drawer B) because the legal sphere is defined by the limit of what can be coerced.

  Your nagging feeling is correct: You already have names for half of it because the legal system solved the "Duty" problem by drawing a bright line at **enforceability** and ignoring everything above it. The philosophers are still arguing about the space above the line. You don't argue about it because, in your office, nothing happens there. That's not blindness; that's jurisdiction.
