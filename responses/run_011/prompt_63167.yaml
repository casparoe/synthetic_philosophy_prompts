answer: |-
  Here is the blunt assessment you asked for.

  ### The Novelty Check: Is "Foil Discipline" Just Repackaged Philosophy?

  **Yes, but that doesn't matter.**

  Philosophers of science (Peter Lipton, Bas van Fraassen, James Woodward) have been hammering on contrastive explanation ("Why P rather than Q?") since the 1980s. They have already established that the *foil* determines the explanation. If you ask "Why did the fire start?" (foil: no fire) you get oxygen + fuel. If you ask "Why did the fire start *in the kitchen*?" (foil: fire elsewhere) you get the careless smoker.

  However, economic historians do not read *Inference to the Best Explanation*. They read Pomeranz, Allen, and Broadberry. The literature is full of substantive claims made without explicit methodological scaffolding.

  Your "foil discipline" (slice, similarity space, contrast target) is not a philosophical breakthrough. **It is a translation layer.** If you can take the existing Great Divergence literature and demonstrate that the "debates" are artifacts of slippage between these three parameters, you are not doing philosophy; you are doing **methodological audit**. That is valuable. If you stay abstract, you are just repeating Lipton with economic jargon. If you apply it to the canon to show where the wires are crossed, you have a contribution.

  ---

  ### The Ranking

  Here is the ranking based on upstream leverage, tractability for a lone scholar with no archival budget, and the probability of shifting the field.

  #### 1. Sharpen the Semantics (The Applied Audit)
  **Rank:** First.
  **Reasoning:** This is the only option that is truly upstream. You cannot fix selection bias (Option 2) or evaluate counterfactuals (Option 3) if you haven't defined what is being selected or counterfactualized.
  *   **Tractability:** High. This requires reading, thinking, and writing. It fits your 18-month constraint perfectly. You do not need new data; you need to re-read old data with a new taxonomy.
  *   **Impact:** High potential. If you can show that, for example, Pomeranz and Allen are not disagreeing on facts but are contrasting different *slices* (1750 vs. 1850) or different *targets* (welfare vs. productivity), you dissolve the conflict rather than adding to it. This saves the field energy.
  *   **Risk:** Becoming the "grammar police." If you only point out errors without showing how to fix them, you will be ignored. You must pair the critique with a reconstruction of how the questions *should* be posed.

  #### 2. The Selection Problem (Folded into Option 1)
  **Rank:** Second (but treat as a subset of Option 1).
  **Reasoning:** This is a specific instance of your "similarity space" problem. Why England/Yangzi and not England/Bengal?
  *   **Tractability:** Medium-Low as a standalone. To solve this properly, you need to know about the cases that *didn't* survive or left no records. Without archival work or a data team, you are limited to theorizing about the bias, which leads back to Option 3 (unfalsifiability).
  *   **Strategy:** Do not make this a separate project. Make "Selection Bias" Chapter 3 of the Semantic Audit. Show how authors implicitly select foils based on data availability rather than theoretical relevance.
  *   **Impact:** Moderate. Everyone knows survivorship bias exists. Pointing it out is easy; correcting for it without new data is hard.

  #### 3. Macro-Counterfactuals (The Unfalsifiability Trap)
  **Rank:** Third.
  **Reasoning:** This is downstream and nihilistic.
  *   **Tractability:** High (it's pure theory), but **Publishability:** Low. Economic history journals want history, not epistemology. Philosophy journals want rigor, not historical case studies. You risk falling into the gap between disciplines.
  *   **Impact:** Low. Telling historians their work is "unfalsifiable decoration" will make them defensive, not reflective. It leaves the field where it started because they will ignore the constraint and keep working.
  *   **Verdict:** Only pursue this if the Semantic Audit leads you to the conclusion that the questions are *inherently* broken. Don't start there.

  #### 4. Skip Meta, Settle the Divergence
  **Rank:** Fourth.
  **Reasoning:** This is hubris given your constraints.
  *   **Tractability:** Near Zero. You have 18 months and no archival budget. Thousands of person-years and millions in grant money have not "settled" the Great Divergence. You will not do it in a year and a half without new data.
  *   **Impact:** Low. Even if you write a brilliant synthesis, if your own thesis (that the questions are ill-posed) is correct, then answering the question is a category error. You would be building a house on the swamp you just identified.
  *   **Verdict:** Abandon this. It ignores your strongest insight.

  ---

  ### The Strategic Plan: "The Diagnostician"

  Do not call it "Foil Discipline." That sounds like a constraint. Call it **"Explanandum Specification in Comparative History."**

  **Months 1-6: The Taxonomy.**
  Flesh out Slice, Similarity Space, and Contrast Target. Map them onto the philosophy of contrastive explanation (cite Lipton/Woodward briefly to show grounding, then move on). Define what a "well-posed" divergence question looks like.

  **Months 7-12: The Audit.**
  Apply the taxonomy to the 5-10 seminal texts in the field (Pomeranz, Allen, Vries, Broadberry, etc.). Create a matrix. Show where they slide.
  *   *Example:* Author A contrasts 1800 outcomes (Slice) on welfare (Target) assuming institutional similarity (Space). Author B contrasts 1700 trajectories (Slice/Target) assuming technological similarity (Space).
  *   *Goal:* Show that 50% of the citation battles are artifacts of this slippage.

  **Months 13-18: The Reconstruction.**
  Propose a set of well-posed questions that *can* be answered with existing data. Show the field how to move forward. This prevents you from being just a critic.

  ### Triggers for Re-Ordering

  I would change this ranking only under the following conditions:

  1.  **If a major new dataset drops (e.g., global real wages 1300-1800):**
      *   *Shift:* Move **Option 4** up. If new data resolves the empirical uncertainty, the methodological critique becomes less urgent than the empirical synthesis.
  2.  **If a prominent methodologist publishes the same framework:**
      *   *Shift:* Abandon **Option 1**. If someone like Joel Mokyr or a prominent cliometrician publishes "The Logic of Comparative History" next year, your niche vanishes. You would need to pivot to **Option 2** (Selection) as your specific angle of attack.
  3.  **If you find the Semantic Audit is too abstract to sustain 18 months:**
      *   *Shift:* Fold **Option 3** in. If you can't find enough slippage to fill a monograph, pivot to the limits of counterfactuals as the "why we can't know" conclusion.

  ### Final Blunt Advice

  Your intuition is correct: the field is talking past itself. But historians are resistant to methodological preaching. They respect **demonstration** over **prescription**.

  Do not write a book about *how* to ask questions. Write a book that asks the *right* questions and shows why the old ones failed. Use the "foil discipline" as the engine, not the cargo.

  If you spend 18 months telling economic historians they don't know how to use the word "why," you will be lonely. If you spend 18 months showing them why their favorite debates are ghosts, and then exorcise them, you will be cited.

  **Go with Option 1, but weaponize it.**
