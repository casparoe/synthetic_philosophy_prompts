answer: |-
  ### The Examination Question

  A public agency allocates a fixed budget between programmes affecting different individuals. To maximise welfare, it constructs a cardinal utility function for each person using the standard gamble method: subjects report the probability at which they are indifferent between a certain outcome and a gamble. This yields a function unique up to positive affine transformation. To fix the zero and unit for interpersonal comparison, the agency stipulates two physical anchors for every subject: L (an ordinary weekday at home) and H (one week recovering from a minor operation). It sets u(L) = 0 and u(H) = 100 for everyone, declares utilities expressed in a common unit, and sums them to choose the allocation.

  (a) Critically evaluate the claim that stipulating identical physical anchors establishes a common scale suitable for summation. Does this procedure overcome the problem of interpersonal comparisons, or does it presuppose the very fact it purports to measure? (15 marks)

  (b) Suppose the procedure is flawed. Propose a specific modification to the protocol—such as a third-person assessment, empathetic adjustment, or bargaining step—that might break the circularity. Explain whether this addition successfully grounds the comparison or merely relocates the normative assumption. (10 marks)

  ### Model Answer

  The agency's protocol distinguishes correctly between the structure of individual utility and the problem of aggregating it. The standard gamble method establishes that individual preferences satisfy the axioms of expected utility theory, yielding a function unique up to positive affine transformation. This means that within a single life, we can measure ratios of utility differences; we know if a gain is twice as valuable as a loss for that specific person. However, this mathematical structure leaves the zero point and the unit arbitrary for each individual. The agency attempts to fix these parameters by stipulating that physical states L and H correspond to 0 and 100 for everyone. The critical philosophical error is assuming that fixing the numbers fixes the meaning.

  The problem is that utility is not a physical magnitude like height or weight. It is a representation of subjective welfare or preference satisfaction. By assigning u(L) = 0 to every subject, the agency assumes that an ordinary weekday provides the same baseline welfare for every human being. This is empirically dubious and logically circular. If one person suffers from chronic depression, L might represent a state of significant distress, whereas for another it is neutral. By forcing the numbers to align, the agency silences the very variation it needs to measure. The procedure claims to discover a common scale for summation, but it actually imposes one by definition. It presupposes the interpersonal equivalence of the anchors to prove the interpersonal comparability of the utilities derived from them. This is not a measurement; it is a stipulation that begs the question.

  The defense that shared biology licenses a shared scale attempts to ground the anchors in objective reality. It suggests that because we share human nervous systems, a minor operation implies a standard quantum of pain or discomfort. While biological similarity provides a rough heuristic, it fails as a rigorous basis for utility comparison. Utility depends on psychological context, past experiences, and adaptive preferences. A person accustomed to hardship may report higher utility from L than someone accustomed to luxury, even if their biological states are identical. To assume that biological states map one-to-one onto utility states is to adopt a specific, controversial theory of well-being, namely hedonism or biological functioning, without argument. The agency treats a normative choice about what counts as welfare as if it were a technical calibration of an instrument.

  To repair the protocol, one might introduce an empathetic adjustment phase. Subjects could be asked not only to report their own utilities but to estimate the utility others derive from L and H, perhaps through deliberative discussion. Alternatively, a bargaining procedure could be implemented where representatives negotiate the weights assigned to different utility functions behind a veil of ignorance. This would allow the group to agree on a scaling factor that reflects shared moral intuitions rather than assumed physical facts. However, this modification does not escape the circularity; it merely relocates the normative assumption. Empathy relies on the accuracy of imaginative projection, which is notoriously unreliable across different life experiences. Bargaining relies on a prior commitment to fairness or equality that is not derived from the utility measurement itself.

  Ultimately, the repair reveals that the common scale is not an empirical discovery but a political construct. Any addition to the protocol that breaks the circularity must import a normative principle, such as equal moral worth or prioritarianism. The agency cannot measure its way out of the problem because the problem is not epistemic but ethical. A robust protocol would acknowledge that fixing the unit is a moral decision required for social choice, not a technical fact revealed by anchors. It should explicitly adopt a principle of equal consideration as a foundational axiom. This transparency avoids the circularity by admitting that the common scale is a normative construct. The circularity is broken only when we stop trying to measure value like length and start treating it as a political agreement on how to weigh lives. The exam question demands this recognition: that interpersonal comparison is ultimately a moral commitment, not a measurement trick.

  ### Marking Scheme

  | Criteria | Marks Available | Requirement for Award |
  | :--- | :--- | :--- |
  | **Part (a): Intra vs. Inter Personal** | 5 | The candidate must explain that the gamble method yields cardinality within a life but leaves the zero and unit arbitrary across lives. |
  | **Part (a): The Circularity Charge** | 5 | The candidate must identify that setting identical anchors presupposes the interpersonal equivalence of utility it purports to measure. |
  | **Part (a): Biological Defense** | 5 | The candidate must evaluate the claim that shared biology ensures shared utility, noting the gap between physical states and subjective welfare. |
  | **Part (b): Proposed Modification** | 5 | The candidate must propose a concrete procedural change, such as empathy, bargaining, or third-person assessment, to fix the scale. |
  | **Part (b): Normative Relocation** | 5 | The candidate must argue that the modification imports a normative assumption rather than solving the epistemic problem technically. |

  ### What Separates 20 Marks from 14

  The candidate scoring 20 marks identifies that the anchor stipulation is a definition that hides a premise, whereas the 14-mark candidate simply argues that people are different. The higher-scoring response explicitly distinguishes between the mathematical structure of the utility function (affine transformation) and the moral weight required for summation, recognizing that the agency conflates calibration with measurement. Furthermore, the 20-mark candidate understands that any repair in Part (b) inevitably imports a normative theory, such as egalitarianism, rather than solving the problem empirically. The lower-scoring response tends to treat the repair as a technical fix that successfully grounds the comparison, failing to see that the circularity is merely relocated to the new procedure. Finally, the stronger answer maintains a consistent distinction between physical states and subjective welfare throughout, while the weaker answer often slips into assuming biological similarity implies experiential identity.

  ### Common Failures

  1.  **Confusing Ordinal and Cardinal Utility (5 marks lost):** The candidate argues that the gamble method only produces rankings, failing to recognize it yields cardinal differences within a life.
  2.  **Assuming Physical Similarity Implies Experiential Identity (5 marks lost):** The candidate accepts the biological defense without critique, assuming identical nervous systems guarantee identical utility values.
  3.  **Proposing a Repair That Ignores Circularity (5 marks lost):** The candidate suggests a modification, such as averaging, without explaining how it avoids presupposing the comparability it seeks to establish.
  4.  **Discussing General Utilitarianism Without Addressing the Protocol (5 marks lost):** The candidate writes about the merits of utilitarianism generally rather than evaluating the specific measurement procedure described in the question.
  5.  **Using Symbolic Mathematics Incorrectly (5 marks lost):** The candidate attempts to use algebraic notation to prove the point but misapplies the concept of affine transformation, obscuring the philosophical argument.
