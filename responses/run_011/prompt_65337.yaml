answer: |-
  Your observation identifies a profound fissure in the standard political theory of dissent. You have correctly perceived that the canonical model of civil disobedience relies upon a specific communicative circuit: the actor appeals to the majority's sense of justice, presupposing that the majority recognises the actor as a peer entitled to make such an appeal. When that recognition is structurally withheld, the circuit is broken. The act remains physically identical to civil disobedience, but its political grammar is fundamentally altered.

  Below is an analysis of this configuration, addressing your three questions in turn, followed by a consideration of the harder edge cases and a recommendation for your documentation work.

  ### 1. Naming the Configuration

  There is no single, canonical term in political philosophy that captures this phenomenon with the precision you require. In the literature, it is often treated as a boundary problem rather than a distinct category. However, several concepts sit near to it.

  The most direct engagement comes from William Smith in *Civil Disobedience and the Foreigner* (2012). He argues that non-citizens can engage in civil disobedience, but he notes that their standing is 'derivative' or 'parasitic' on the rights of citizens unless one adopts a broader, human-rights-based framework. Similarly, the work of Seyla Benhabib on 'democratic iterations' touches on how excluded groups force their way into the circle of legitimacy, though she focuses more on legal claims than extra-legal protest.

  You might encounter the term **'uncivil disobedience'** (Robin Celikata), but this is unsuitable for your purposes. That label is reserved for acts that are covert, violent, or disrespectful of the legal process. Your subjects are open, non-violent, and accept punishment; they are *more* respectful of the process than the state is of them.

  A more accurate, albeit descriptive, label found in critical legal studies is **'disobedience of the excluded'** or **'non-member civil disobedience'**. However, these describe the actor rather than the act.

  The most theoretically robust label comes from Hannah Arendt, though she does not use it as a fixed term. She distinguishes between the 'right to have rights' and the specific rights of citizenship. When an individual breaks a law to assert their status as a political agent despite being denied that status, they are engaging in what might be termed **'constitutive disobedience'**. They are not asking the system to correct a deviation (as in the standard model); they are asking the system to constitute them as a subject capable of making a claim.

  For your documentation, I would advise against coining a neologism that might not travel well to treaty bodies. Instead, I suggest using the phrase **'Civil Disobedience by Excluded Persons'**, with a specific explanatory note regarding the 'communicative break'. This signals that the act fits the *conduct* criteria of civil disobedience but fails the *membership* criteria of the Rawlsian model.

  ### 2. Distinction from the Standard Model (Rawls)

  You ask whether this is simply the negation of John Rawls' second condition (shared membership) or a distinct problem. It is the latter.

  In Rawls' *A Theory of Justice*, civil disobedience is a stabilising mechanism within a 'nearly just' society. It functions as a warning light. The disobedient says, 'The system is straying from its own principles.' This presupposes a shared language of justice. The majority understands the protest because they share the vocabulary of the constitution or the social contract.

  In the cases you describe, the injustice is not a deviation from shared principles; the injustice *is* the boundary of the principles themselves.
  *   **Standard Civil Disobedience:** Deliberative. It seeks to persuade the majority to apply their own standards more consistently.
  *   **Excluded Disobedience:** Performative. It seeks to establish the actor's capacity to speak at all.

  This distinction is vital. In the standard model, the punishment is accepted to demonstrate 'fidelity to law'—to show that one respects the system enough to suffer for its improvement. In your cases, the acceptance of punishment often demonstrates something different: the *reality* of coercion. It proves that while the actor accepts the *consequences* of the law, they do not recognise the *legitimacy* of the law's authority over them.

  Therefore, this is not merely the negation of Rawls' condition. It is a different genre of political action. It survives even if the society is 'just' internally. A society can be perfectly just towards its citizens and profoundly unjust towards those it governs without representing (e.g., colonial subjects, permanent residents without franchise). The problem is not the *content* of the justice, but the *scope* of the demos.

  ### 3. Classification and Normative Status

  This is the most critical question for your litigation and reporting. If you classify these acts as 'mere law-breaking', you strip them of their political character and reduce them to criminality. If you classify them as 'civil disobedience' without qualification, you invite the counter-argument that the actors lack the standing to make the claim.

  **The Risk of Exclusion**
  If you deny the label of civil disobedience to excluded persons, you create a catch-22: one must be recognised as a political agent to perform political protest, but one performs political protest to be recognised as a political agent. This validates the exclusion. It suggests that only those with power can legitimately protest the lack of it.

  **The Solution: Expanding the Communicative Ground**
  The classification should rest not on *shared membership*, but on *shared vulnerability*.
  Standard civil disobedience appeals to the 'sense of justice'. Excluded disobedience appeals to the 'capacity for suffering' and 'moral agency'.
  *   **Classification:** I recommend classifying these acts as **Civil Disobedience**, but explicitly grounding their justification in **Human Rights** rather than **Constitutional Citizenship**.
  *   **Justification:** The moral force of the act does not derive from a contract they signed (which they didn't), but from their subjection to coercive power. As the legal maxim goes, *no taxation without representation*; inversely, *no subjection without voice*. If the state claims the authority to punish the individual, the individual claims the right to challenge that authority.

  By framing it this way, you avoid the 'mere law-breaking' trap. You argue that the *definition* of civil disobedience should be updated to reflect a globalised or stratified reality where governance and citizenship no longer perfectly overlap. The act is intelligible not because the audience shares the actor's status, but because the audience recognises the actor's humanity and their subjection to the state's force.

  ### 4. Edge Cases and Boundaries

  To carve this carefully, we must distinguish between types of exclusion. Not all lack of franchise is equal.

  **A. The Long-Term Resident (Non-Citizen)**
  *   *Status:* Legally present, subject to all laws, pays taxes, but ineligible for national citizenship.
  *   *Analysis:* This is the strongest case for 'Civil Disobedience by Excluded Persons'. They are 'stakeholders' (as argued by legal scholar Linda Bosniak). Their exclusion is a defect in the host state's democracy.
  *   *Classification:* Treat as Civil Disobedience. Their appeal is to the 'residency-based' community of fate. They are de facto members denied de jure status.

  **B. The Colonial or Occupied Subject**
  *   *Status:* Governed from a distant capital, no representation, distinct legal regime.
  *   *Analysis:* Here, the 'shared society' premise of Rawls collapses entirely. This is closer to **National Liberation** or **Anti-Colonial Resistance**. However, if the methods are non-violent and open, they function *like* civil disobedience.
  *   *Classification:* Use caution. In treaty reporting (e.g., ICCPR), this may fall under 'Self-Determination'. Calling it 'civil disobedience' might inadvertently domesticate an international conflict. However, for the purpose of documenting the *nature of the protest* (open, non-violent, accepting punishment), the label remains useful descriptively, provided it is not confused with domestic dissent.

  **C. The Adolescent (Below Franchise Age)**
  *   *Status:* Citizen, but temporarily excluded from the vote.
  *   *Analysis:* This is distinct because the exclusion is temporary and universal (all citizens pass through it). It is not a permanent caste status.
  *   *Classification:* This remains standard Civil Disobedience. They are 'members-in-waiting'. Their appeal is to the future community they will join. The communicative circuit is intact because the adults protesting were once in the same position. This does not suffer the same 'communicative break' as the permanent exile.

  **D. The Irregular Migrant**
  *   *Status:* Present without legal authorisation.
  *   *Analysis:* The state often argues they have voluntarily placed themselves outside the law.
  *   *Classification:* This is the hardest case. However, if they are protesting their detention or deportation conditions, they are appealing to rights that attach to *personhood*, not citizenship (e.g., prohibition on torture, right to family life). The act is **'Conscientious Resistance'**. It may be safer to distinguish this from civil disobedience in reports to avoid triggering sovereignty arguments, but the moral weight remains.

  ### 5. Recommendation for Documentation

  For your organisation's reports and litigation files, I propose the following taxonomy:

  1.  **Primary Label:** **Civil Disobedience**.
      *   *Reasoning:* This preserves the political nature of the act and protects against the 'criminal' stigma. It signals to the court or treaty body that this is a conscientious act, not a predatory one.

  2.  **Qualifier:** **(By Excluded Persons)** or **(Non-Member)**.
      *   *Reasoning:* This flags the theoretical tension immediately. It alerts the reader that the standard 'appeal to shared principles' is modified.

  3.  **Explanatory Note:**
      *   Include a standard paragraph in your methodology: *"In cases where the actor lacks franchise or citizenship, the act is classified as civil disobedience not on the basis of shared membership, but on the basis of subjection to coercive power. The communicative intent is not to correct a deviation in shared norms, but to assert standing within the political community."*

  This approach prevents the verdict from becoming a tool of exclusion. It asserts that the right to dissent is not a privilege of the voter, but a consequence of being governed. It acknowledges that while the *legal* definition of the demos may exclude them, the *moral* reality of their protest includes them.

  ### Summary

  To answer your three questions directly:

  1.  **Name:** There is no single word. **'Disobedience of the Excluded'** or **'Constitutive Disobedience'** are the most accurate theoretical descriptors, though **'Civil Disobedience by Excluded Persons'** is best for formal reporting.
  2.  **Difference from Rawls:** It is not merely the negation of membership. It changes the act from **deliberative** (appealing to shared justice) to **performative** (asserting moral agency). It targets the boundary of the community, not the conduct within it.
  3.  **Classification:** Classify as **Civil Disobedience**, but ground the justification in **human rights and subjection to power** rather than citizenship. To do otherwise is to allow the state to define the boundaries of legitimate dissent, which would render the concept useless for the very people who most require it.

  You are documenting a form of political speech that occurs in a vacuum where speech is not supposed to carry. The label must reflect the courage of the act, not the silence of the audience.
