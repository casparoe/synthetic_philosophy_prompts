  # Joint Statement on the Ontological Status of Unarticulated Rationales

  ### 1. Agreed Claims
  1.  **Convergence:** Unrelated lineages and unrelated workshops frequently arrive at identical structural solutions (e.g., four-chambered hearts, hydrodynamic hulls) under similar constraint structures.
  2.  **Explanatory Power:** Citing the "why" (the problem solved) provides explanatory leverage distinct from citing the "how" (the mechanism or physics), regardless of the ontological status of that "why."
  3.  **Ordinary Usage:** In ordinary language, the terms "reason," "rationale," and "intention" presuppose a subject capable of holding them.
  4.  **Scope:** We are debating the status of "free-floating rationales" (Dennett), distinct from Popper's World 3 objective knowledge, though overlaps exist.
  5.  **Good Faith:** Neither side accuses the other of denying the empirical facts of evolution, physics, or engineering; the dispute concerns the categorization of those facts.

  ### 2. Disagreements

  | Issue | Free-Floater Position (Realist) | No-Reasoner Position (Anti-Realist) | Genuine or Verbal? |
  | :--- | :--- | :--- | :--- |
  | **Ontological Status** | Rationales exist as objective features of constraint spaces prior to and independent of articulation. Discovery is finding what is already there. | Rationales are explanatory constructs imposed by an agent post-fact. Without a reasoner, there are only causes and regularities. | Genuine |
  | **Normativity** | A rationale exerts a normative pull (it is *for* something) even if no agent recognizes it. | Normativity requires an agent to hold something as a reason. Otherwise, it is merely descriptive fitness. | Genuine |
  | **Meta-Classification** | This is not merely the function debate. Free-floating rationales cover uninstantiated optimal solutions (Platonic space), whereas etiological/causal-role functions require actual history or instantiation. | This is the causal-role function debate in different clothing. Calling it a "rationale" smuggles in agency where "functional contribution" suffices. The free-floating framing adds unnecessary reification. | Genuine |
  | **Terminological Scope** | The term "rationale" is being extended technically to cover objective intelligibility, not just psychological states. | The term "rationale" is being misused. We should reserve "reason" for agents and use "cause" or "function" for systems. | Verbal |

  ### 3. Cruxes

  **Crux 1: The Uninstantiated Case**
  *   **Test:** Consider an optimal hull form for a fluid dynamic regime that has never existed and never will (e.g., specific viscosity/speed combination never realized in the universe).
  *   **Free-Floater Prediction:** There is still a *rationale* for that hull shape (it minimizes resistance for those parameters). The truth of the engineering claim does not depend on instantiation.
  *   **No-Reasoner Prediction:** There is only a mathematical description of a point in state space. Calling it a "rationale" is category error; without a builder or a user, there is no "for-ness," only geometry.
  *   **Resolution Condition:** If the Free-Floater accepts that "rationale" reduces to "mathematical optimality" without normativity, they concede the No-Reasoner's point. If the No-Reasoner accepts that "mathematical optimality" in a constraint space constitutes a "reason" independent of agents, they concede the Free-Floater's point.

  **Crux 2: The Symmetry of Error**
  *   **Test:** If a rationale can exist without a reasoner, can a *mistake* exist without a mistake-maker? (e.g., A natural formation looks exactly like a botched bridge design, but no one built it).
  *   **Free-Floater Prediction:** No. Rationales are special because they align with objective constraints (physics/logic). Errors are deviations from an agent's intent. Rationales detach; intentions do not.
  *   **No-Reasoner Prediction:** Inconsistent. If you detach the rationale from the reasoner, you must detach the error from the errer. If you cannot have a free-floating error, you cannot have a free-floating rationale. Both require a subject to define the norm.
  *   **Resolution Condition:** If the Free-Floater cannot justify why rationales detach but errors do not without invoking a hidden subject, the No-Reasoner wins on consistency. If the Free-Floater successfully distinguishes objective fit (rationale) from subjective miss (error), the distinction holds.

  **Crux 3: Explanatory Indispensability**
  *   **Test:** Does evolutionary biology or engineering lose predictive power if we ban the word "rationale" and strictly use "causal history" + "physical constraint"?
  *   **Free-Floater Prediction:** Yes. We lose the ability to predict convergent solutions in novel lineages because we ignore the "pull" of the optimal solution space.
  *   **No-Reasoner Prediction:** No. "Constraint space" and "selection pressure" do all the work. "Rationale" is a shorthand for human comprehension, not a causal factor in the system.
  *   **Resolution Condition:** If a model using only constraints/history matches the predictive power of a model using "rationales," the No-Reasoner wins on parsimony. If the "rationale" model predicts convergences the other misses, the Free-Floater wins on indispensability.
