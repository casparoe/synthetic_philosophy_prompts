      *   *Exclusion:* If $x_f$ causes $x_f'$, does $x_c$ cause $x_c'$? If $x_f$ is sufficient, is $x_c$ redundant?
          *   *Translation:* If the fine-grained transition is fully accounted for by fine-grained dynamics, the coarse-grained transition adds no independent causal power.
      *   *No Overdetermination:* We don't usually model two independent controllers driving the same actuator without arbitration.
          *   *Translation:* We do not accept that a single state transition is simultaneously driven by two independent, sufficient dynamical systems without a defined arbitration mechanism.
      *   *Conclusion:* The coarse model is epiphenomenal (useful for prediction, but not "doing" the work).

