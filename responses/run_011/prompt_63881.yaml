      *   *Premise 2 (Supervenience):* Mental properties depend on physical properties.
      *   *Premise 3 (Distinctness):* Mental properties are not identical to physical properties.
      *   *Premise 4 (Exclusion):* No event has more than one sufficient cause (unless it's overdetermination).
      *   *Premise 5 (No Overdetermination):* Systematic overdetermination is false.
      *   *Conclusion:* Mental properties are epiphenomenal (or identical, contradicting Distinctness).

  3.  **Translate Premises into Engineering Vocabulary:**

      *   *Closure:* In engineering, this looks like conservation laws or complete state transitions. If the fine-grained state $x_f(t)$ determines $x_f(t+1)$, does the coarse state $x_c(t)$ add anything?
          *   *Translation:* For every transition in the fine-grained state vector $x_f$, the dynamics $f(x_f, u)$ are causally sufficient. No "unmodelled input" is required to explain the next fine state.
      *   *Supervenience:* This maps perfectly to Abstraction Maps. $x_c = \pi(x_f)$.
          *   *Translation:* There exists a many-to-one mapping $\pi$ from fine states to coarse states.
      *   *Distinctness:* In engineering, $x_c$ is a function of $x_f$. Are they distinct? Yes, different dimensions, different resolution. But are they *ontologically* distinct? The framework treats them as descriptions.
