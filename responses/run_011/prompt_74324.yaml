answer: |-
  The visibility account is a valuable stress test but operationally secondary to defining whose trust is being betrayed, so prioritize the principal-agent relationship before testing concealment.

  1. **Whose betrayal constitutes the "misuse"? (The Principal Problem)**
     *   **Why first:** You cannot define corruption without identifying whose interests are being violated—is it the donor taxpayers, the local citizenry, or the intended beneficiaries? An aid agency's mandate usually privileges fiduciary responsibility to donors over local democratic accountability, which may render open patronage unacceptable regardless of visibility.
     *   **Constraint:** High. Defining the principal dictates the answer to the visibility account (if the principal is the donor, local visibility is irrelevant) and the normative conflict question (donor rules usually trump local norms).
     *   **Tractability:** High. This requires textual analysis of the agency's charter, legal mandates, and past audit reports, which fits a theory-heavy group with no fieldwork budget.
     *   **Demote:** Only if the agency's mandate is explicitly singular and uncontested (e.g., "solely maximize beneficiary welfare"), which is rare in development politics.

  2. **Is concealment the necessary wrong-making feature? (The Visibility Account)**
     *   **Why second:** Once the principal is fixed, you can test whether hiding the act is what harms *that* principal. If the harm is resource diversion, visibility doesn't cure it; if the harm is democratic accountability, visibility might. This isolates your colleague's proposal from the broader definitional mess.
     *   **Constraint:** Medium. A "yes" here shifts the evidentiary burden from tracking money flows to tracking information flows, changing how you assess program capture.
     *   **Tractability:** High. Testable via thought experiments and review of existing scandal case studies (e.g., comparing open clientelism in machine politics vs. hidden lobbying) without new data collection.
     *   **Demote:** If Question 1 establishes that the agency's primary risk is reputational or legal liability rather than development effectiveness, as hidden legal acts pose less legal risk than open illegal ones.

  3. **At what threshold does capture void a program? (The Severity/Scale Question)**
     *   **Why third:** Definitions are useless without thresholds. You need to know if 5% capture kills the funding or if only systemic capture does. This moves from conceptual purity to operational decision rules.
     *   **Constraint:** Low. This operationalizes the previous two questions but doesn't fundamentally alter the conceptual account of what corruption *is*.
     *   **Tractability:** Medium. Requires synthesizing existing evaluation literature on aid failure and corruption metrics; feasible without fieldwork but requires rigorous literature review.
     *   **Demote:** If the agency requires a zero-tolerance policy, making the threshold binary and negating the need for nuanced scaling.

  4. **How do we adjudicate conflicting normative orders? (The Anthropologist's Veto)**
     *   **Why fourth:** This handles the "gift vs. bribe" and "Western construct" issues but only after you know whose rules apply (Q1) and what counts as wrong (Q2). It prevents the group from getting stuck in relativism before establishing the agency's operational lane.
     *   **Constraint:** Medium. Determines whether local legitimacy can excuse behavior that violates the donor's definition of corruption.
     *   **Tractability:** High. Leverages the anthropologist's expertise on existing ethnographies of aid and kinship obligations rather than requiring new fieldwork.
     *   **Demote:** If Question 1 establishes that donor fiduciary standards are absolute and non-negotiable regardless of local context.

  **Cut Outright:** The debate on whether corruption is a **Western construct vs. universal concept**.
  Spending a year on the metaphysics of universalism is a waste unless it directly informs Question 4. For an aid agency, the operational reality is that *their* rules apply regardless of whether those rules are "Western." Treat this as a sub-component of Question 4, not a standalone inquiry.
