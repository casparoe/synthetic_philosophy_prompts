prompt: |-
  I do civic-tech stuff on the side and our little group has been arguing about compulsory voting for maybe two years now, same six people, nobody budges. One camp says mandatory turnout fixes a bias, because the people who dont show up are systematically poorer and less educated, so a voluntary system quietly up-weights the comfortable. The other camp says you're just conscripting a pile of uninterested people who'll vote at random or follow the ballot order, and that there's no duty to vote in the first place. The fights about dropping the voting age to 16 and about letting long-term residents who aren't citizens vote split the exact same way.

  My working theory — tell me if its dumb — is that they aren't actually disagreeing about the empirical stuff. They're disagreeing about whether a non-vote is missing data or a real data point. Is abstention a null you should never impute, or is it itself a preference (contentment, protest, "the system's fine") that compulsion would overwrite and destroy? And are 16-year-olds and non-citizen residents rows you filtered out, or rows that aren't in the table yet?

  Is that the real structure of the disagreement, or am I just forcing a database metaphor onto something that's really about liberty and duty, or about who counts as a member? Walk me through what each side is actually committed to and where they genuinely can't meet, then tell me what would count as progress — some real-world case that could settle part of it, a distinction someone should draw, or an honest argument that this one just never resolves and why.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** A civic-tech group (6 people) has been debating compulsory voting (and related issues like voting age, non-citizen voting) for two years with no resolution.
      *   **The Debate:**
          *   Camp A (Pro-Compulsion): Mandatory turnout fixes bias (poor/less educated don't vote voluntarily).
          *   Camp B (Anti-Compulsion): Conscription of uninterested people leads to random/noise voting; no duty to vote.
          *   Parallel Debates: Voting age (16 vs. 18), Non-citizen residents voting.
      *   **User's Theory:** The disagreement isn't empirical (does it work?) but ontological/epistemological regarding the *nature of the vote*.
          *   Is a non-vote "missing data" (Camp A) or "real data" (Camp B)?
          *   Are excluded groups "filtered rows" (Camp B) or "rows not in the table yet" (Camp A)?
      *   **Task:** Evaluate the theory. Walk through what each side is committed to. Identify where they can't meet. Suggest what would count as progress (case studies, distinctions, or acceptance of irreconcilability).
      *   **Tone:** Intellectual, nuanced, respectful of the civic-tech context (data metaphors are welcome but need grounding in political theory).

  2.  **Evaluate the User's Theory (The Database Metaphor):**
      *   *Is it dumb?* No, it's actually quite insightful. It cuts through the surface-level policy arguments to the underlying assumptions about representation.
      *   *Is it the whole story?* It's a strong structural lens, but it might obscure the normative/ethical layer (liberty vs. duty). The metaphor explains *how* they see the system, but not necessarily *why* they value what they value.
      *   *Verdict:* Validate the metaphor but expand it to include the normative commitments. It's not *just* data; it's about the legitimacy of the dataset.

  3.  **Deconstruct the Two Camps (Commitments & Incompatibilities):**
      *   **Camp A (The "Representation as Mirror" Camp):**
          *   *Core Belief:* Democracy's legitimacy comes from descriptive representation (the outcome looks like the populace).
          *   *View of Non-Vote:* Noise/Error. It distorts the signal.
          *   *View of Excluded Groups:* Incomplete dataset.
          *   *Normative Commitment:* Equality of Outcome/Influence.
      *   **Camp B (The "Consent as Signal" Camp):**
          *   *Core Belief:* Democracy's legitimacy comes from voluntary participation and individual agency.
          *   *View of Non-Vote:* Signal. It indicates satisfaction, alienation, or refusal to endorse.
          *   *View of Excluded Groups:* Boundary markers of the polity (who belongs).
          *   *Normative Commitment:* Liberty/Autonomy.
      *   **The Impasse:** They are optimizing for different variables. Camp A wants *accuracy of the aggregate*; Camp B wants *integrity of the individual input*. You can't maximize both simultaneously.

  4.  **Analyze the Parallel Issues (Age & Citizenship):**
      *   *Voting Age:* Is competence a threshold (Camp B) or is interest/stake enough (Camp A)?
      *   *Non-Citizens:* Is membership legal (Camp B) or is residency/stake enough (Camp A)?
      *   *Connection:* These confirm the user's "rows in the table" theory. Camp A sees the table schema as too narrow; Camp B sees the schema definition as the whole point.

  5.  **Determine What Counts as Progress:**
      *   *Empirical Settlement?* Unlikely. Australia (compulsory) vs. US (voluntary) doesn't settle it because culture differs.
      *   *Distinction to Draw:* "Duty to Vote" vs. "Duty to Register." Or "Compulsion with 'None of the Above'."
      *   *Reframing:* Move from "Who is right?" to "What problem are we solving?" (Legitimacy crisis vs. Policy bias).
      *   *Acceptance:* Some disagreements are foundational.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Validate the database metaphor. It's not dumb; it's a sophisticated way to describe *political ontology*.
      *   *Section 1: The Data Model (Validating the User).* Break down the "Missing Data" vs. "Null Value" argument. Explain why this is the crux.
      *   *Section 2: The Normative Layer (Adding Depth).* It's not just data; it's about *Legitimacy*. Camp A = Legitimacy via Representativeness. Camp B = Legitimacy via Consent.
      *   *Section 3: The Parallel Cases.* Show how age/citizenship fit the "Schema Definition" argument.
