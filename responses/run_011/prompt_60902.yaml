prompt: |-
  I TA an intro ethics section and Thursday I've got fifty minutes on the Mencius/Xunzi disagreement about human nature. They'll be coming off two weeks of Aristotle, so half of them will walk in already saying Xunzi is just Aristotle with a different word for habituation and calling it a day. Don't explain the debate to me — plan how I should teach it.

  Give me the order the pieces have to go in and what depends on what. My guess is the four sprouts have to be on the table before Xunzi's claim that nature is bad can register as a denial of anything rather than as a nasty rumor, but I could be wrong, and if the order is different say why. Then which single example should carry the whole thing and what it has to have and what it has to lack — I've been defaulting to the kid about to fall into the well, but tell me if that's a trap given where they're coming from, since it invites them to hear a claim about feelings where Mencius is making a claim about what humans are.

  Then the misconception map: nature versus nurture, bad meaning actively evil, Mencius supposedly holding that we're born good so there's nothing to cultivate, the habituation mapping onto Xunzi, and whatever else they'll generate in the room — with the exact point in the sequence where I head each one off, not a list at the end.

  And there's the thing I can't resolve myself, so I don't want it buried. It looks to me like they aren't even using the word nature the same way — Mencius seems to mean the thing that separates humans from other animals, Xunzi seems to mean whatever you're born with that no teaching or effort could have produced. If that's right, is there a substantive disagreement underneath or is most of the fight definitional? Build an answer into the plan rather than steering around it, because if I punt on it theyll smell it, and if the answer is that there's real substance left over once you fix the definitions, I need to know which example exposes that residue.

  Finish with the one question I can ask around minute forty-five that tells me whether they got the dispute or just the two slogans, and tell me what I should openly leave out at this level and say out loud that I'm leaving it out.

  Bottom line first: the first sentence should be the call that decides whether this section works or not, then the plan. No preamble, don't restate my question back at me.
