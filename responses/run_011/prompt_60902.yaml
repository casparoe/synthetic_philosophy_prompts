answer: |-
  If you let them define "nature" before they see the fight, you lose; you must force them to feel the contradiction between "what we are" and "what we should be" before you name either philosopher, or the Aristotle comparison will erase the disagreement entirely.

  **The Sequence (50 Minutes)**

  **1. The Trap Setup (0–10 mins): Define "Nature" by Failure**
  *   **Action:** Write "Human Nature" on the board. Ask students for a definition. When they offer "biology" or "instinct," ask: "Is cancer human nature? It's biological." When they offer "what makes us unique," ask: "Is murder unique? Then is it natural?"
  *   **Dependency:** Do not introduce Mencius or Xunzi yet.
  *   **Misconception Head-off (Nature vs. Nurture):** Force them to admit that *both* biology and environment shape us. Establish that both Chinese philosophers agree nurture is required; the fight is about what nurture *does*.
  *   **Goal:** Create a vacuum where "nature" means either "raw material" (Xunzi) or "normative direction" (Mencius) without labeling them yet.

  **2. Mencius: The Sprout as Direction (10–20 mins)**
  *   **Action:** Introduce Mencius only after the confusion above. Present the "Four Sprouts."
  *   **Carrying Example:** **The Ritual Bow.**
      *   *Setup:* Describe a student bowing to a teacher.
      *   *Mencius's Claim:* The bow is the *growth* of an internal sprout of deference. Without the bow, the respect rots.
      *   *Requirement:* The example must show an action that looks cultivated but is claimed to be internal.
      *   *Lack:* Do not mention "feelings" or "emotions" yet; focus on the *capacity* to act.
  *   **Misconception Head-off (Mencius = Born Good/No Work):** Explicitly state: "A sprout trampled dies." Mencius requires effort, but the effort is *protective/generative*, not *corrective*.
  *   **Aristotle Check:** Ask: "Is this like Aristotle?" (Yes, actualizing a telos). Keep this tentative.

  **3. Xunzi: The Wood as Raw Material (20–30 mins)**
  *   **Action:** Introduce Xunzi as the direct rebuttal to the Bow example.
  *   **Carrying Example:** **The Ritual Bow (Revisited).**
      *   *Xunzi's Claim:* The bow is a *constraint* against natural sloppiness and aggression. We bow because we *want* to shove, and ritual stops us.
      *   **Misconception Head-off (Bad = Evil):** Clarify "Bad" (E) means "disorderly/unstraight," not "sinful." Use the "Crooked Wood" metaphor: Wood isn't evil, it's just useless for building until straightened.
      *   **Misconception Head-off (Xunzi = Aristotle):** This is the critical pivot. Aristotle says habituation makes you *more* yourself (actualizes nature). Xunzi says ritual makes you *less* yourself (overcomes nature). If you miss this, they are the same.
  *   **Dependency:** This only works if they understood Mencius's bow as internal growth. If they thought Mencius meant "we are born knowing how to bow," Xunzi looks identical.

  **4. The Definition Clash & Substantive Residue (30–40 mins)**
  *   **Action:** Address your unresolved worry directly. Acknowledge they use "Nature" (Xing) differently.
      *   Mencius: Nature = The normative potential that separates humans from beasts.
      *   Xunzi: Nature = The biological given present at birth before effort.
  *   **The Test (Substantive vs. Definitional):** Ask: "If we agree on these definitions, is there still a fight?"
  *   **Resolution:** Yes. The residue is the **Origin of Value**.
      *   **Example:** **The Sage.** How did the first Sage create Ritual?
      *   Mencius: The Sage *noticed* the sprout everyone has. (Morality is Discovery).
      *   Xunzi: The Sage *accumulated effort* against their own nature to invent order. (Morality is Invention).
      *   **Why this matters:** Even if Xunzi admits humans have a "normative potential," he denies that potential is *natural*. He argues value is artificial. This is the substantive gap that survives the definition fix.

  **5. Assessment & Closure (40–50 mins)**
  *   **Minute 45 Question:** "For Xunzi, does practicing ritual make you more 'yourself' or less 'yourself'? Why would Mencius say the opposite answer is the only one that saves morality?"
      *   *Success:* They identify Xunzi = Less (correction) vs. Mencius = More (growth).
      *   *Failure:* They say "Both say self-improvement" (misses the ontological clash).
  *   **What to Leave Out:** Do not cover the cosmological arguments (Qi, Heaven's mandate) or the specific political policies of the Warring States.
  *   **Say Out Loud:** "I am leaving out the metaphysics of Heaven because today is about moral psychology. If you think their politics follow automatically from this, you are oversimplifying, but we need the ethics first."

  **Why This Order:**
  You cannot present Xunzi's "Nature is Bad" before Mencius's "Sprouts" because students will interpret "Bad" as "No hope" rather than "Raw Material." You must establish Mencius's claim (Nature provides the *direction*) so Xunzi's denial (Nature provides only the *impulse*) registers as a structural contradiction, not just a mood swing. The "Ritual Bow" carries the load because it isolates the *source* of the action (internal vs. external) better than the "Kid in the Well," which students will reduce to "instinctive emotion" (which Aristotle also allows) rather than "moral capacity."
