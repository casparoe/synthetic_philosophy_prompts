prompt: |-
  I'm writing the "how we represent uncertainty" section of a proposal for a decision-support tool used by a county public-health board. The situation is this: the evidence is thin and conflicting (two small studies pointing different ways, an expert panel that splits down the middle, historical data that's arguably not transferable), the board has to act anyway, and they've told us bluntly that they hate being handed a single number that pretends to more precision than anybody has. My instinct is to go with imprecise probabilities — credal sets, or lower and upper previsions in Walley's sense — but my committee wants the framework choice defended against the alternatives, and I'd rather do that honestly than cheerlead for my own view.

  So: write me the desiderata. What does a framework for representing evidentially underdetermined uncertainty have to deliver to count as adequate *for this job*? Give me the phenomena it must capture, the cases it must get right, the distinctions it must not collapse, and the results it has to stay consistent with — with the motivating case or consideration behind each item, and a mark on each saying whether it's a genuine requirement or a prejudice of one camp. The ones I especially want pinned down:

  - whether there are inputs where a precise number would be a lie, and what exactly that claim amounts to — I want a worked case, not a restatement of the intuition
  - what the framework owes you on updating, including whether the set is allowed to get *wider* on new evidence, and whether an agent can know in advance that she's about to dilate (reflection-principle territory)
  - whether it has to produce a determinate recommendation, and if not, what it owes the board instead when they ask what to actually do on Tuesday
  - what decision rule it's commited to (maximin, E-admissibility, gamma-maximin, something else) and which classic constraints on decision rules — sure-thing, no dynamic money pump, no getting trapped by a sequence of individually reasonable bets — that rule buys and which it sells
  - whether an accuracy-dominance style argument, run over sets of credence functions rather than single ones, cuts for or against wide sets
  - the reduction worry: what stops a precise second-order probability distribution over candidate chances from doing all the same work with less machinery? If the honest answer is that nothing does, say so and say what's left over

  Then flag any subset of these that you think can't be jointly satisfied — I suspect there's one, and I'd much rather my committee hear it from me than discover it in review. And tell me which single requirement knocks out the most contenders, possibly including mine. Two-sentence verdicts at the end on precise Bayesianism, credal sets, and second-order probabilities, no more than that. No citations or reading list — I've got the lit, I just need the spec.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** Proposal for a decision-support tool for a county public-health board.
      *   **Problem:** Evidence is thin, conflicting, non-transferable. Board hates false precision (single numbers).
      *   **User's Instinct:** Imprecise probabilities (Credal Sets/Walley).
      *   **Task:** Write the "desiderata" section. Define what an adequate framework must deliver for *this specific job*.
      *   **Specific Requirements:**
          *   List phenomena to capture, cases to get right, distinctions to maintain, consistency constraints.
          *   Include motivation for each item.
          *   Mark each as "Genuine Requirement" or "Prejudice of One Camp".
          *   Address specific technical points:
              *   When is a precise number a lie? (Worked case).
              *   Updating (dilation, reflection).
              *   Action guidance (determinate recommendation?).
              *   Decision rules (maximin, etc.) and constraints (money pumps, sure-thing).
              *   Accuracy-dominance arguments.
              *   Reduction worry (Second-order probabilities vs. Credal sets).
          *   Identify incompatibilities (impossibility results).
          *   Identify the "killer constraint".
          *   Two-sentence verdicts on Precise Bayesianism, Credal Sets, Second-Order Probabilities.
      *   **Constraints:** No citations/reading list. Honest defense, not cheerleading.

  2.  **Deconstruct the Specific Technical Points:**

      *   *Precise number as a lie:* Need a concrete example where the evidence supports a range but not a point. The "two small studies" scenario is perfect. If Study A says risk is 10% and Study B says 50%, and we have no meta-analytic basis to weight them, a single number (30%) implies a symmetry/weighting that doesn't exist.
      *   *Updating/Dilation:* Credal sets can widen (dilation) upon learning new evidence (e.g., learning the *source* of evidence is biased but not how). Reflection principle is tricky here. If I know my set will widen, should I act now?
      *   *Action Guidance:* Public health boards *must* act. A framework that says "suspend judgment" is useless. It needs to map uncertainty to action, even if the action is "gather more info" or "choose robust option."
      *   *Decision Rules:* Maximin is too pessimistic. E-admissibility leaves too much indeterminacy. Gamma-maximin is a compromise. Need to address dynamic consistency (money pumps).
      *   *Accuracy:* Seidenfeld/Joyce arguments. Does imprecise credence avoid accuracy dominance? Usually, precise credences dominate imprecise ones *if* the scoring rule is strictly proper. But if the *state of the world* is indeterminate, maybe not. This is a tension.
      *   *Reduction (Second-Order):* Why not just put a distribution over the probabilities? (e.g., 50% chance it's 10%, 50% chance it's 50%). The issue is behavioral. Do you treat that mixture the same as a set? Often yes, unless you distinguish *risk* (known probs) from *ambiguity* (unknown probs). Ellsberg.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Item 1: Representing Ignorance vs. Risk.* Must distinguish "I know the chance is 50%" from "I know nothing about the chance." (Genuine Requirement).
      *   *Item 2: False Precision.* The worked case. (Genuine Requirement).
      *   *Item 3: Actionability.* Must yield a recommendation. (Genuine Requirement).
      *   *Item 4: Dynamic Consistency.* No money pumps. (Genuine Requirement).
      *   *Item 5: Dilation/Updating.* Can sets widen? (Prejudice/Technical).
      *   *Item 6: Second-Order Reduction.* (Technical/Philosophical).

  4.  **Identifying Incompatibilities (The "Impossibility" Check):**
      *   *The Seidenfeld/White Problem:* You cannot have (1) Imprecise Credences, (2) Strict Conditionalization, (3) No Dilation (or Reflection), and (4) Decision Rules that respect the indeterminacy (like E-admissibility) without running into dynamic inconsistency or sure-loss scenarios in specific setups.
      *   *The Actionability vs. Honesty Trade-off:* If you represent the uncertainty honestly (wide set), you often get indeterminacy (no unique best act). If you force a unique act, you often collapse the set (false precision).
      *   *The Accuracy Constraint:* Standard accuracy arguments favor precise credences. To defend imprecise ones, you have to reject standard scoring rules or argue that accuracy isn't the only goal.

  5.  **Refining the "Killer Constraint":**
      *   What knocks out the most contenders? Likely **Actionability + No False Precision**. Precise Bayesianism fails "No False Precision." Pure Credal Sets (with E-admissibility) often fail "Actionability" (too much indeterminacy). Second-order probabilities often collapse back to precise expectations (failing "No False Precision" behaviorally).
      *   Actually, the strongest tension is **Dynamic Consistency + Imprecise Probabilities + Indeterminacy**. Seidenfeld showed that if you respect the indeterminacy in your choices, you can be money-pumped unless you violate reflection or conditionalization.

  6.  **Developing the Content (Section by Section):**

      *   *Intro:* Set the tone. Pragmatic, not metaphysical.
      *   *The Desiderata List:* Go through the user's specific points.
      *   *The Worked Case:* Use the "Two Studies" example.
      *   *The Incompatibility:* Highlight the Seidenfeld/Decision Rule tension.
      *   *The Verdicts:* Keep them sharp.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I mark "Genuine" vs "Prejudice"? Yes, need to be clear.
      *   *Check:* Did I address the "Reduction Worry"? Yes, need to explain why a distribution over probabilities might behave like a single expectation (Risk vs. Ambiguity).
      *   *Check:* Is the tone right? The user wants honesty, not cheerleading. Acknowledge where credal sets struggle (e.g., decision rules).
      *   *Check:* The "Dilation" point. If I know my set will widen, does that violate reflection? Yes, standard reflection says expected future credence = current credence. If the set widens, the expectation might stay the same but the *set* changes. This is a known tension.
      *   *Check:* Accuracy dominance. Imprecise credences are generally accuracy-dominated by *some* precise credence in the set *if* the world is precise. If the world is indeterminate, the argument shifts. I need to state this clearly.

  8.  **Final Polish:**
      *   Ensure the "Two-Sentence Verdicts" are strictly two sentences.
      *   Ensure the "Killer Constraint" is identified clearly.
      *   Make sure the "Worked Case" is concrete (Study A vs Study B).

  9.  *(Self-Correction on the "Reduction Worry")*: The user asks: "what stops a precise second-order probability distribution... from doing all the same work?" The answer is usually nothing, *unless* you invoke Ellsberg-style preferences where agents care about the *structure* of the uncertainty, not just the marginal expectation. But for a public health board, do they care? If they just want to minimize expected loss, second-order collapses to first-order expectation. To defend credal sets, one must argue the *decision rule* shouldn't collapse the expectation. This is a crucial distinction. I need to make sure I don't just say "Ellsberg" but explain why it matters for the board.

  10. *(Final check on Incompatibilities)*: The big one is **Decision Rule Indeterminacy vs. Dynamic Consistency**. If you allow "no choice" (indeterminacy) when the set is wide, you avoid bad bets. But if you force a choice (to be actionable), you expose yourself to money pumps if you update naively. I will flag this as the critical tension.

  11. *(Drafting the response)*... (proceeding to generate output based on these thoughts).
answer: |-
  ### Desiderata for Representing Evidentially Underdetermined Uncertainty

  The following specifications define adequacy for this context. They are derived from the operational constraints of the board (must act, must be defensible) and the epistemic reality of the data (thin, conflicting, non-transferable). Each item is marked as either a **Genuine Requirement** (necessary for the tool to function safely and honestly in this context) or a **Theoretical Prejudice** (a commitment to a specific philosophical camp that may not be strictly necessary for the job).

  #### 1. The Distinction Between Risk and Ignorance
  *   **Requirement:** The framework must distinguish between cases where the probability is known to be *p* (risk) and cases where the probability is merely known to lie within [*p* – *ε*, *p* + *ε*] or is entirely unmeasured (ignorance/ambiguity).
  *   **Motivation:** Public health interventions have different cost-benefit profiles depending on whether failure is due to bad luck (risk) or model error (ignorance). Insurance and contingency planning differ for these two states.
  *   **Status:** **Genuine Requirement.**

  #### 2. The "False Precision" Constraint (Worked Case)
  *   **Requirement:** The framework must not output a single point estimate when the evidence structurally prohibits weighting conflicting sources.
  *   **Worked Case:** Consider two small, methodologically distinct studies on a new pathogen's transmission rate. Study A (clinical setting) implies *R*₀ = 1.2. Study B (community setting) implies *R*₀ = 2.8. There is no meta-analytic basis to weight A over B, and historical data is non-transferable due to mutation.
      *   **The Lie:** Outputting *R*₀ = 2.0 (the mean) asserts a symmetry of evidence that does not exist. It implies that a new piece of evidence is equally likely to shift the estimate up as down. In reality, a new study resembling A would validate the lower bound, and one resembling B would validate the upper bound. The mean is not a "best guess"; it is an artifact of aggregation.
      *   **The Claim:** A precise number is a lie here because it commits the agent to betting odds (e.g., even money on *R*₀ > 2.0) that the evidence does not support. The evidence supports neither *R*₀ > 2.0 nor *R*₀ < 2.0; it supports both as live possibilities without a distribution between them.
  *   **Status:** **Genuine Requirement.**

  #### 3. Actionability Under Indeterminacy
  *   **Requirement:** The framework must yield a determinate recommendation for action, even when the uncertainty representation remains indeterminate.
  *   **Motivation:** The board cannot "suspend judgment." They must allocate resources on Tuesday. A framework that outputs "no uniquely rational act" is operationally useless.
  *   **Status:** **Genuine Requirement.**

  #### 4. Updating and Dilation
  *   **Requirement:** The framework must specify how the representation changes upon receiving new evidence, including whether the set of probabilities is permitted to widen (dilate).
  *   **Motivation:** In some cases, learning *which* study is relevant (without learning the result) reveals that our current estimate is less reliable than thought. If the framework forbids widening, it forces false confidence. However, if it allows widening, it risks violating the Reflection Principle (knowing in advance that your uncertainty will increase).
  *   **Status:** **Theoretical Prejudice.** (Standard Bayesianism forbids dilation; Imprecise Probability allows it. For this job, allowing dilation is safer, but it creates dynamic tension.)

  #### 5. Decision Rule and Dynamic Consistency
  *   **Requirement:** The framework must commit to a decision rule (e.g., E-admissibility, Gamma-maximin, Maximin) and demonstrate consistency over time (no dynamic money pumps).
  *   **Motivation:** If the tool recommends Act A on Monday, but would recommend Act B on Tuesday after a predictable, non-informative event, the board is vulnerable to exploitation and loss of credibility.
  *   **Status:** **Genuine Requirement.**
  *   **Constraint Trade-off:**
      *   **E-admissibility** (choose any act not dominated by another) respects the indeterminacy but often fails to produce a unique recommendation (violates Desideratum 3).
      *   **Maximin** (choose the act with the best worst-case outcome) produces a unique recommendation but is overly pessimistic and violates the Sure-Thing Principle.
      *   **Gamma-maximin** (maximize the minimum expected utility) is a compromise but requires setting a weighting parameter that reintroduces a form of subjectivity.

  #### 6. Accuracy-Dominance
  *   **Requirement:** The framework should not be systematically less accurate than a competing framework in tracking the truth.
  *   **Motivation:** If a precise probability *p* is consistently closer to the truth than the interval [*p* – *ε*, *p* + *ε*], the interval is epistemically inefficient.
  *   **Status:** **Theoretical Prejudice.** (Accuracy arguments generally favor precise credences. Defending credal sets requires arguing that *calibration* or *avoiding false confidence* outweighs raw accuracy scores, or that the "truth" is itself indeterminate.)

  #### 7. The Reduction Worry (Second-Order Probabilities)
  *   **Requirement:** The framework must justify why a precise second-order distribution (a probability distribution over candidate first-order probabilities) is insufficient.
  *   **Motivation:** One could model the "Two Studies" case as: 50% chance the true rate is 1.2, 50% chance it is 2.8. This yields a precise expectation of 2.0.
  *   **The Defense:** Nothing stops this mathematically *unless* the decision rule treats ambiguity differently from risk. If the board is ambiguity-averse (Ellsberg-style), they value the *structure* of the uncertainty, not just the expectation. A second-order distribution collapses into a single expectation for any agent satisfying the Independence Axiom. To justify credal sets, you must assert that the board is *not* expected-utility maximizers over second-order probabilities, but rather agents who treat "unknown weights" as distinct from "known weights."
  *   **Status:** **Theoretical Prejudice.** (If the board accepts Expected Utility Theory over the second-order space, credal sets are redundant. If they reject it, credal sets are necessary.)

  ---

  ### Incompatibility Flags

  **The Impossibility Triangle:**
  You cannot jointly satisfy the following three desiderata without qualification:
  1.  **Honest Indeterminacy:** Representing the evidence as a wide set of probabilities (Credal Set).
  2.  **Actionability:** Producing a unique choice for every decision problem.
  3.  **Dynamic Consistency:** Avoiding sure-loss sequences (money pumps) across time.

  *Explanation:* If you maintain a wide set (1) and force a unique choice (2) using a rule like Gamma-maximin, you become vulnerable to dynamic inconsistency when the set updates (dilation). If you respect the indeterminacy (allowing "no choice" between acts), you satisfy (1) and (3) but fail (2). If you collapse to a precise number to ensure (2) and (3), you fail (1).

  **The Killer Constraint:**
  **Actionability (Desideratum 3)** knocks out the most contenders, including the purest versions of your preferred framework.
  Pure credal set theory (Walley/Seidenfeld) often concludes that when evidence is sufficiently thin, *there is no rational preference* between acts. This is epistemically honest but operationally dead. To make the tool usable, you will be forced to introduce a tie-breaking rule (like Gamma-maximin) that effectively collapses the set for the purpose of decision-making. You must admit in the proposal that the *representation* remains imprecise, but the *decision module* imposes a precision constraint to force a recommendation.

  ---

  ### Verdicts

  **Precise Bayesianism**
  Fails the False Precision constraint by forcing a weighting of conflicting evidence that does not exist, creating a liability when the model inevitably diverges from reality. It offers superior dynamic consistency and actionability but purchases these at the cost of epistemic honesty.

  **Credal Sets (Imprecise Probabilities)**
  Successfully captures the distinction between risk and ignorance and avoids false precision, but struggles to provide unique action recommendations without adopting decision rules that invite dynamic inconsistency or money pumps. It is the most honest representation but requires a "tie-breaker" mechanism to be operationally viable for the board.

  **Second-Order Probabilities**
  Mathematically equivalent to precise Bayesianism for any agent who maximizes expected utility over the second-order distribution, thereby collapsing the ambiguity back into a single risk number. It only offers an advantage if the board explicitly rejects standard Expected Utility Theory in favor of ambiguity-averse preferences, which requires behavioral justification they may not wish to provide.
