      *   *Wait, one more nuance:* The prompt asks what view makes the choices hang together. The current system prioritizes **Legal Certainty for the Firm** over **Absolute Control for the User**. The theory is **Institutional Legitimacy**.
      *   *Okay, let's balance it:* I will present "Control" as the surface theory, "Context" as the justificatory theory, and "Accountability" as the operational theory. I'll commit to **Contextual Integrity** as the philosophical core because it explains the *distinctions* (ads vs. contract) best.

  8.  **Final Plan:**
