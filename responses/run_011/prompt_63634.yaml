      *   **Candidate 3: Contextual Integrity (The "Norms" Model).** Privacy is maintaining the right boundaries between spheres of life.
          *   *Fit:* Advertising crosses a boundary (from shopper to product). Contract data stays in the "shopping" sphere. Audit logs stay in the "regulatory" sphere.
      *   **Commitment:** The practice actually relies on **Contextual Integrity** disguised as **Control**. It uses the language of consent (Control) to enforce boundary maintenance (Context).
      *   **Ruled Out Views:**
          *   *Property:* Data isn't a thing you sell.
