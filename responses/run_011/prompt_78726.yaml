answer: |-
  ### Part 1: The Eligibility Procedure

  This procedure is designed to resolve the boundary problem by prioritizing **All-Subjected to Coercion (ASC)** as the primary principle, with a specific carve-out for **Developmental Stake** regarding youth. It explicitly rejects the **All-Affected Interests (AAI)** principle for non-residents to avoid the infinite regress of determining "affectedness" for commuters and visitors.

  #### Tier 1: Committee-Level Categorization (Once Per Cycle)
  **Function:** The Steering Committee meets four weeks before voting to ratify eligible categories based on the principles below. This prevents table-level volunteers from making normative judgments.

  | Category | Decision | Operationalized Principle | Sufficient Answer | Fact or Value? | Escalation Point |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Adult Residents** | Admit (Full Vote) | **All-Subjected:** Subject to city coercion/law daily. | Domicile + Intent to remain. | Fact (w/ Value judgment on intent) | Disputed domicile. |
  | **Youth (15-17)** | Admit (Full Vote) | **Developmental Stake:** High impact on future capacity; low coercion risk. | School enrollment or Residency. | Fact | Home-schooled/Out of school. |
  | **Commuters** | Refuse | **Boundary of Coercion:** Not subject to city law while sleeping/governing elsewhere. | Primary sleep location outside city. | Fact | Hybrid living arrangements. |
  | **Undocumented** | Admit (Full Vote) | **All-Subjected:** De facto subject to local policing/services regardless of status. | Self-attestation of presence. | Fact | None. |
  | **Second-Home** | Restricted (Vote on local projects only) | **Partial Subjection:** Subject to property law, not community life. | Property tax record + <6 months presence. | Fact | Disputed months of presence. |
  | **Unincorporated** | Refuse | **Legal Jurisdiction:** Not yet subject to city coercion. | Annexation status. | Fact | Disputed annexation timeline. |

  **Tie-Breaker Rule:** If a petitioner fits two categories with conflicting outcomes (e.g., a student living in the city but legally domiciled elsewhere), prioritize **Physical Presence (Subjectedness)** over **Legal Domicile**, *unless* the presence is purely economic (e.g., a shop owner), in which case Legal Domicile prevails.

  **Stopping Rule:** The Committee must finalize the Rulebook 21 days before voting. No new categories may be added after this date. Individual disputes at the table are resolved by the Table Lead; only *systemic* ambiguities are escalated to the Committee.

  **Documentation Standard:** To satisfy the City Attorney's "no parallel electorate" constraint, documentation must establish *stake*, not *citizenship*.
  *   **Requirement:** One (1) piece of corroborating evidence OR sworn self-attestation.
  *   **Acceptable:** School ID, utility bill, lease, letter from shelter/service provider, sworn affidavit of residency.
  *   **Unacceptable:** Government-issued photo ID (excludes undocumented), Tax returns (excludes poor).

  ---

  #### Tier 2: Table-Level Flowchart (Volunteer Script)
  **Time Limit:** 3 Minutes per person.
  **Instruction:** If a petitioner answers "No" to any bolded question, they are ineligible unless an escalation condition is met.

  1.  **Do you sleep in this city more nights than anywhere else?**
      *   *Yes:* Go to 2.
      *   *No:* **Ineligible.** (Operationalizes: *All-Subjected/Coercion*. Fact: Self-report. Escalate if "equal nights".)
  2.  **Are you 15 years of age or older?**
      *   *Yes:* Go to 3.
      *   *No:* **Ineligible.** (Operationalizes: *Capacity*. Fact: Self-report/ID. No escalation.)
  3.  **Do you have one piece of mail, school ID, or a letter from a local service provider?**
      *   *Yes:* **Admit.** (Operationalizes: *Verification without Exclusion*. Fact: Visual check.)
      *   *No:* Go to 4.
  4.  **Can you swear under penalty of perjury that you live here?**
      *   *Yes:* **Admit.** (Operationalizes: *Trust/Self-Attestation*. Value: Prioritizing inclusion over fraud prevention.)
      *   *No:* **Ineligible.** (Escalate to Table Lead if petitioner claims homelessness/no address.)

  ---

  ### Part 2: Case Runs

  **1. The Commuters**
  *   **Flowchart Step 1:** "Do you sleep in this city more nights than anywhere else?"
  *   **Answer:** No (They sleep in the suburb).
  *   **Outcome:** **Refused.**
  *   **Theory:** Operationalizes *All-Subjected*. They are affected by infrastructure (AAI), but they are not subject to the city's coercive residential order (ASC).
  *   **Documentation:** N/A (Failed Step 1).

  **2. The Undocumented Residents (No Address)**
  *   **Flowchart Step 1:** "Do you sleep in this city...?"
  *   **Answer:** Yes.
  *   **Flowchart Step 3:** "Do you have one piece of mail...?"
  *   **Answer:** No (Unwilling to register).
  *   **Flowchart Step 4:** "Can you swear... that you live here?"
  *   **Answer:** Yes.
  *   **Outcome:** **Admitted.**
  *   **Theory:** Operationalizes *All-Subjected* (they are policed/served here) + *Anti-Exclusion*. Self-attestation bypasses the state documentation they cannot/will not provide.
  *   **Documentation:** Sworn affidavit (verbal or written).

  **3. The Fifteen-Year-Olds**
  *   **Flowchart Step 1:** "Do you sleep in this city...?"
  *   **Answer:** Yes (Enrolled in schools implies residency).
  *   **Flowchart Step 2:** "Are you 15 years of age or older?"
  *   **Answer:** Yes.
  *   **Outcome:** **Admitted.**
  *   **Theory:** Operationalizes *Developmental Stake*. Lowers the *Capacity* threshold based on the specific impact of PB projects (schools/parks) on youth.
  *   **Documentation:** School ID or parental attestation.

  ---

  ### Part 3: Contradiction Analysis

  You expected the procedure to admit the fifteen-year-olds and refuse the commuters. The procedure above achieves this. However, this outcome contradicts a commitment you likely hold as a political theory student: **The All-Affected Interests (AAI) Principle.**

  *   **The Contradiction:** In your seminar, you likely critique bounded democracy for excluding those impacted by decisions. Commuters are materially affected by road repaving and capital budget allocation (AAI). By excluding them, you are prioritizing *Residency/Subjectedness* over *Affectedness*. Yet, by including fifteen-year-olds, you are prioritizing *Stake* over *Legal Capacity*.
  *   **The Tension:** You are applying AAI to age (kids are affected by schools, so they vote) but rejecting AAI for geography (commuters are affected by roads, so they *don't* vote).
  *   **How to Reverse It Honestly:** To admit commuters without patching, you must change the **Tier 1 Tie-Breaker**. Currently, it prioritizes *Sleep Location* (Subjectedness). To admit commuters, you must change the primary principle to **Economic & Infrastructure Stake**.
      *   *New Rule:* "Anyone who spends more than 20 hours per week within city limits or pays any tax/fee to the city is eligible."
      *   *Cost:* This risks violating the City Attorney's warning by creating a franchise broader than the municipal electorate, potentially challenging the "advisory" nature of the vote. It also opens the boundary to infinite regress (how many hours? what about tourists?).

  ---

  ### Part 4: Critique & Limitations

  **1. Laundering Value Judgments as Technical Criteria**
  *   **"Sleep Location" (Step 1):** This appears to be a factual question, but it is a proxy for **Political Membership**. It assumes that where one rests is more politically salient than where one works or contributes economically. It launders a *communitarian* value (community is where you live) as a *logistical* rule.
  *   **"15 Years of Age" (Step 2):** This launders **Epistemic Competence** as a bright line. There is no theoretical reason a 14-year-old lacks capacity while a 15-year-old possesses it. This is a bureaucratic compromise disguised as a developmental fact.
  *   **"Self-Attestation" (Step 4):** This launders **Trust** as a verification method. It assumes fraud is less damaging than exclusion. This is a political choice to prioritize inclusion, masked as a resource constraint ("no budget for verification").

  **2. Undecidable Disputes**
  The Boundary Problem leaves the **weighting of principles** undecidable. The procedure above chooses *Subjectedness* over *Affectedness*. There is no democratic way to validate that choice without already having a *demos* to vote on it. The Committee is simply choosing; the flowchart merely executes that choice.

  **3. Structurally Excluded Parties**
  *   **Future Residents:** Those who will move in next year and pay for the capital projects via long-term debt have no say.
  *   **Nonhuman Interests:** The environment (trees, air quality) affected by construction cannot be represented.
  *   **Taxpayers in Other Jurisdictions:** If the city receives state/federal grants for these projects, taxpayers in other cities subsidize this vote but cannot participate.
  *   **The Homeless (Specific Sub-set):** Those who rotate between cities and cannot swear they sleep *here* more than *there* fall into the Step 1 gap.

  ---

  ### Part 5: Published Justification (For Rejected Applicants)

  > "This participatory budget is designed to decide how *our local community* cares for the spaces where we live, sleep, and raise our families. To keep this process fair and focused, voting is limited to people who make their home within our city limits. While we appreciate your work and contribution to our city, this specific fund is reserved for residents who rely on our services every day and night. We encourage you to share your ideas with the project proposers, even if you are not eligible to cast a final ballot."
