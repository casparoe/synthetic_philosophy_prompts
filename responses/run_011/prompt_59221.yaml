answer: |-
  Here is the honest answer: **There is no principle.**

  The Reference Class Problem (RCP) is not a puzzle to be solved; it is a logical feature of inductive inference. For any event $E$, there are infinite classes $C_1, C_2, ... C_n$ containing $E$, each yielding different base rates. There is no mathematical or logical rule for selecting the "correct" class without importing a causal model. If you have a causal model sufficient to select the class, you are doing structural forecasting, not reference-class forecasting.

  However, your six verdicts are not random. They are consistent. They reveal that you are not actually doing Reference Class Forecasting. You are doing **Causal Exchangeability Maximization.**

  Your judgment is tracking **the degree to which the unobserved variables affecting the outcome are distributed identically across the proposed class.** You are willing to sacrifice sample size ($n$) for causal homogeneity, and you are willing to sacrifice surface-level similarity for ontological stability.

  Here is the precise formulation of the heuristic you are using, followed by the conflict it exposes.

  ### The Operative Heuristic: Causal Exchangeability Maximization

  **Definition:** A reference class is valid if and only if the members of the class are *exchangeable* with respect to the *generative process* of the outcome, prioritizing causal stability over statistical power.

  **Clauses:**
  1.  **The Mechanism Clause:** Exclude any class where the causal structure governing the outcome has demonstrably shifted (e.g., pre/post-nuclear).
  2.  **The Ontology Clause:** Exclude any class that is a post-hoc label rather than a natural kind with persistent properties (e.g., "hegemon").
  3.  **The Environment Clause:** Prioritize the selection environment over the internal features of the unit (e.g., market sector over startup product).
  4.  **The Indexical Clause:** For duration, condition on elapsed time to account for survival bias (Lindy/Copernican).

  ### Mapping Your Verdicts

  1.  **Great-Power Rivalry (Nuclear):** Motivated by the **Mechanism Clause**. You argue that nuclear weapons alter the generative process of war termination (mutual assured destruction), making pre-1945 rivalries non-exchangeable. You accept tiny $n$ because causal homogeneity > statistical power.
  2.  **Seed Startup:** Motivated by the **Environment Clause**. You recognize that survival is determined by market selection pressures (sector/vintage), not the specific "unique approach" (internal features).
  3.  **Coup Analogy:** Motivated by the **Mechanism Clause** (negative). You reject "all coups" because the generative processes (military faction vs. palace intrigue vs. popular uprising) are heterogeneous. You reject "single analogy" because $n=1$ offers no variance data. You are stuck because you cannot define the homogeneous sub-class.
  4.  **Hegemon Decline:** Motivated by the **Ontology Clause**. You correctly identify that "hegemon" is a historian's label applied retrospectively, not a system state with a defined failure mode.
  5.  **Democratization/Protest:** Motivated by the **Environment Clause**. You choose "protest movements" (the agent of change) over "countries" (the container), recognizing the mechanism is in the mobilization, not the regime type.
  6.  **Duration/Survival:** Motivated by the **Indexical Clause**. You recognize that for processes without a defined expiration date, the probability of continuation is a function of elapsed time.

  ### The Verdict You Must Give Up

  You must give up **Verdict 1 (Nuclear Rivalries)** *as a reference class forecast.*

  **The Conflict:**
  In Verdict 3 (Coup), you correctly identify that when the causal mechanisms are heterogeneous, a broad class ("all coups") yields garbage. You demand a narrower class but admit you cannot define it.
  In Verdict 1 (Nuclear), you assert a narrow class ("nuclear rivalries") despite $n \approx 5$.

  **The Contradiction:**
  If you apply the rigor of Verdict 3 to Verdict 1, you must admit that "nuclear rivalry" is likely too heterogeneous to be a statistical class (e.g., US-USSR is different from India-Pakistan, which is different from US-China). If the $n$ is that small, you do not have a base rate; you have a **structural model**.

  You cannot claim the epistemic humility of RCF ("I'm just using the base rate") while simultaneously making a strong causal claim ("Nukes change the mechanism") that reduces the $n$ to near-zero. Either:
  1.  You use "Great Power Rivalries since 1500" (RCF) and adjust for nukes as a covariate (Structural).
  2.  You admit Verdict 1 is a structural forecast based on game theory, not a base-rate forecast.

  Currently, you are hiding a structural forecast inside an RCF wrapper to avoid accountability for the model's assumptions. You must give up the claim that Verdict 1 is RCF.

  ### Running the Heuristic on Two New Cases

  **Case A: Will a general AI be built by 2030?**
  *   *Potential Class 1:* "All previous technological breakthroughs" (Too broad; violates Mechanism Clause. AI is cognitive, not physical).
  *   *Potential Class 2:* "All predictions made by experts about AI timelines" (Too meta; violates Ontology Clause. Predictions aren't events).
  *   *Potential Class 3:* "Compute growth trends extrapolated" (Violates Mechanism Clause. Assumes scaling laws hold indefinitely).
  *   *Heuristic Verdict:* No valid reference class exists. The generative process (recursive self-improvement) has no historical precedent. You are forced into pure structural modeling. Using *any* base rate here is "astrology" (per your Verdict 4).

  **Case B: Will the Euro currency survive 10 more years?**
  *   *Potential Class 1:* "All currency unions in history" (Violates Ontology Clause. Most were metallic or colonial; the Euro is a sovereign-fiat hybrid).
  *   *Potential Class 2:* "All political unions without fiscal integration" (Better, but $n$ is tiny. Violates Statistical Power).
  *   *Potential Class 3:* "All major geopolitical commitments made by the EU" (Violates Environment Clause. Currency is an economic mechanism, not just political will).
  *   *Heuristic Verdict:* Use Class 2 ("political unions without fiscal integration") but treat it as a structural warning signal, not a probability. The causal mechanism (divergent economic shocks + no fiscal transfer) is invariant, even if $n$ is small. This aligns with your Nuclear Rivalry intuition, provided you admit it's structural.

  ### Summary
  You are tracking **Causal Exchangeability**. You intuitively understand that base rates are only valid if the causal graph is stable. The discomfort you feel is the friction between wanting the objectivity of statistics (RCF) and the reality that you are actually building causal models (Structural). Stop trying to solve the Reference Class Problem. Accept that you are a structural forecaster who uses base rates as sanity checks, not as generators of truth.
