answer: |-
  ### Brainstorming and Logical Joints

  To construct a robust taxonomy, we must distinguish between the *logic of justification* (what the author claims) and the *context of discovery* (what actually happened). The goal is to allow research assistants (RAs) to code without making philosophical judgments themselves.

  **Candidate Branch Questions:**
  1.  *Did the event happen?* (Joint: Real vs. Counterfactual).
  2.  *Did the author admit error?* (Collapse: Subjective; hard to verify from text alone).
  3.  *Was the date moved?* (Joint: Static vs. Dynamic theory).
  4.  *Was the move justified by new data?* (Joint: Progressive vs. Degenerating shift).
  5.  *Did human action prevent the event?* (Joint: Causal vs. Reflexive).
  6.  *Is the core logic used elsewhere?* (Collapse: Too broad for RA coding; requires domain expertise).
  7.  *Was the error in the numbers or the formula?* (Joint: Parameter vs. Mechanism).

  **Selected Joints:**
  *   **Realization:** Separates success from failure.
  *   **Reflexivity:** Separates external failure from internal (belief-driven) failure.
  *   **Mechanism Integrity:** Separates wrong world-model from wrong initial conditions.
  *   **Revision:** Separates abandonment from persistence.
  *   **Grounding:** Separates evidence-based adjustment from ad hoc adjustment.
  *   **Pattern:** Separates systematic postponement (Zeno) from one-off correction.

  ---

  ### The Prediction Post-Mortem Decision Tree

  **Instructions for Coders:** Answer each node sequentially based *only* on the prediction text and the historical record up to the present. Do not infer the author's intent; look for explicit statements or objective data mismatches.

  **Node 1: Realization**
  Did the predicted state of affairs obtain by the original deadline (within stated tolerance)?
  *   **Yes** → Go to **Leaf A**.
  *   **No** → Go to **Node 2**.

  **Node 2: Reflexivity**
  Is there documentary evidence that agents altered their behavior specifically to avert the predicted outcome (e.g., policy changes citing the prediction)?
  *   **Yes** → Go to **Leaf B**.
  *   **No** → Go to **Node 3**.

  **Node 3: Mechanism Integrity**
  Does the historical record show the proposed causal driver was absent or uncorrelated with the outcome during the period (e.g., prices fell when scarcity was predicted)?
  *   **Yes** → Go to **Leaf C**.
  *   **No** → Go to **Node 4**.

  **Node 4: Re-forecasting**
  Did the author or proponents issue a new specific prediction with a new deadline?
  *   **No** → Go to **Leaf D**.
  *   **Yes** → Go to **Node 5**.

  **Node 5: Empirical Grounding**
  Was the new prediction justified by new independent data (e.g., new surveys, datasets) rather than recalibration of the original model?
  *   **Yes** → Go to **Leaf E**.
  *   **No** → Go to **Node 6**.

  **Node 6: Temporal Pattern**
  Is the new deadline roughly "current date + (original interval)" (i.e., the horizon recedes as fast as time passes)?
  *   **Yes** → Go to **Leaf F**.
  *   **No** → Go to **Leaf G**.

  ---

  ### The Leaves (Verdicts)

  **Leaf A: Vindicated Core**
  *   **Verdict:** The theory is confirmed for this domain.
  *   **Path:** Node 1 (Yes).
  *   **Note:** Even if later challenged (e.g., Hubbert), the specific prediction held.

  **Leaf B: Reflexive Aversion**
  *   **Verdict:** Self-undermining prediction averted because people believed it.
  *   **Path:** Node 1 (No) → Node 2 (Yes).
  *   **Note:** The theory may still be causally valid, but the prediction is no longer testable.

  **Leaf C: Mechanism Falsification**
  *   **Verdict:** Outright refutation of the causal mechanism.
  *   **Path:** Node 1 (No) → Node 2 (No) → Node 3 (Yes).
  *   **Note:** The world did not behave as the theory's engine requires.

  **Leaf D: Theoretical Retrenchment**
  *   **Verdict:** Defender concedes the forecast but not the theory.
  *   **Path:** Node 1 (No) → Node 2 (No) → Node 3 (No) → Node 4 (No).
  *   **Note:** The specific claim is abandoned, but the framework is preserved for other domains.

  **Leaf E: Parameter Correction**
  *   **Verdict:** Timing or parameter error with the mechanism intact.
  *   **Path:** Node 1 (No) → Node 2 (No) → Node 3 (No) → Node 4 (Yes) → Node 5 (Yes).
  *   **Note:** "Right but early" or "Wrong numbers, right logic," supported by new evidence.

  **Leaf F: Zeno Rescue**
  *   **Verdict:** Immunization by indefinite postponement.
  *   **Path:** Node 1 (No) → Node 2 (No) → Node 3 (No) → Node 4 (Yes) → Node 5 (No) → Node 6 (Yes).
  *   **Note:** The prediction never gets nearer to being testable.

  **Leaf G: Ad Hoc Recalibration**
  *   **Verdict:** Degenerating problem shift (non-Zeno).
  *   **Path:** Node 1 (No) → Node 2 (No) → Node 3 (No) → Node 4 (Yes) → Node 5 (No) → Node 6 (No).
  *   **Note:** The date was moved without new data, but not in a systematic Zeno pattern.

  ---

  ### Test Case Runs

  **1. Malthus (1798)**
  *   **Node 1 (Realization):** No. Population did not outstrip subsistence in advanced economies.
  *   **Node 2 (Reflexivity):** No. Birth control adoption was not initially driven by Malthusian texts.
  *   **Node 3 (Mechanism Integrity):** Yes. Food production grew geometrically (via technology), breaking the arithmetic link.
  *   **Verdict:** **Mechanism Falsification**. (Note: Malthusians argue for Parameter Correction, but the historical record on the *link* supports Falsification).

  **2. Hubbert (1956)**
  *   **Node 1 (Realization):** Yes (initially). Peak occurred in 1970.
  *   **Verdict:** **Vindicated Core**.
  *   *Complication:* The shale boom (post-2000) revived production. If coding the *theory of permanent decline* today:
      *   Node 1: No (Production rose again).
      *   Node 3: Yes (Scarcity did not drive permanent decline).
      *   Verdict: **Mechanism Falsification** (for the broad resource theory).

  **3. Ehrlich–Simon Wager (1980)**
  *   **Node 1 (Realization):** No. Prices dropped; Ehrlich predicted rise.
  *   **Node 2 (Reflexivity):** No.
  *   **Node 3 (Mechanism Integrity):** Yes. Scarcity did not correlate with price rise in this period.
  *   **Verdict:** **Mechanism Falsification**. (Ehrlich attempted Parameter Correction, but the wager terms forced a binary outcome).

  **4. Keynes (1930)**
  *   **Node 1 (Realization):** No. Work weeks did not drop to 15 hours.
  *   **Node 2 (Reflexivity):** No.
  *   **Node 3 (Mechanism Integrity):** No. Productivity did rise (the driver existed), but the conversion to leisure failed (sociological, not theoretical).
  *   **Node 4 (Re-forecasting):** No. Keynes is deceased; defenders do not issue new dates.
  *   **Verdict:** **Theoretical Retrenchment**. (Defenders argue the economic logic holds, but social preferences changed).

  ---

  ### Empty Cells and Logical Space

  The tree structure forces every path to a leaf, but there are combinations of *attributes* in the logical space that no leaf occupies because the tree order precludes them.

  1.  **Reflexivity + Mechanism Falsification:**
      *   *Combination:* Agents changed behavior to stop the event (Reflexivity=Yes), AND the causal driver was absent (Mechanism=Yes).
      *   *Diagnosis:* **Incoherent.** If the prediction caused the aversion, we cannot empirically assess whether the mechanism would have held. The tree correctly routes Reflexivity to a terminal leaf before testing Mechanism Integrity.
  2.  **Zeno + Empirical Grounding:**
      *   *Combination:* The date is pushed systematically (Zeno=Yes), BUT justified by new data (Grounding=Yes).
      *   *Diagnosis:* **Unattractive.** If new data justifies the shift, it is a Parameter Correction, even if the dates look like Zeno. The tree routes Grounding=Yes to Parameter Correction before checking the Zeno pattern. This is a correct philosophical distinction (Lakatos: progressive shifts can look like retreats).
  3.  **Re-forecasting + Mechanism Falsification:**
      *   *Combination:* Proponents issue a new prediction (Re-forecast=Yes), BUT the mechanism is falsified (Mechanism=Yes).
      *   *Diagnosis:* **Unexplored.** The tree routes Mechanism Falsification before Re-forecasting. In reality, defenders often re-forecast *after* falsification (e.g., "The mechanism holds, but X interfered"). The tree classifies this as Falsification regardless of the re-forecast. This is a deliberate design choice to prioritize empirical record over authorial persistence.

  ---

  ### Indistinguishable Leaves

  **Pair:** **Parameter Correction** (Leaf E) vs. **Zeno Rescue** (Leaf F).

  **The Problem:**
  The tree separates these at **Node 5 (Empirical Grounding)**. Parameter Correction requires "new independent data." Zeno Rescue is defined by "no new data" + "systematic delay."
  However, for a research assistant, distinguishing "new independent data" from "post-hoc rationalization of the original model" is notoriously difficult. A proponent can always claim a new geological survey (independent data) justifies a 20-year delay, when in fact the survey was interpreted to fit the delay.

  **Evidence Needed to Separate:**
  To genuinely separate them, coders would need access to the *peer-review status* of the new data *prior* to the prediction revision. If the data was published and accepted independently of the prediction revision, it is Parameter Correction. If the data emerged only in the defense of the revision, it is likely Zeno.

  **Defect Diagnosis:**
  This is a **defect in the world** (epistemic opacity), not the scheme.
  *   *Why:* The logical distinction is sound (Progressive vs. Degenerating shift). The empirical indistinguishability arises because scientific defense is a rhetorical act. Proponents of degenerating shifts mimic the language of progressive shifts.
  *   *Implication:* Your RAs will likely under-code Zeno Rescues. To mitigate, add an instruction to Node 5: "If the 'new data' is cited *only* in the defense of the new prediction, code as No."

  **Pair:** **Theoretical Retrenchment** (Leaf D) vs. **Silent Abandonment** (Implicit).
  *   *The Problem:* If authors stop talking about the prediction but don't explicitly concede it.
  *   *Diagnosis:* **Defect in Scheme.** The tree forces a "No" at Node 4 to Retrenchment. It assumes silence = concession of forecast but retention of theory. It might just be abandonment of theory.
  *   *Fix:* Add a leaf for "Silent Abandonment" if there is no evidence of theory retention (e.g., no citations of the theory in new contexts). I have omitted this to meet the 9-leaf constraint, but it is a known blind spot.
