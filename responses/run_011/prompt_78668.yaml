  ### 5. Principles and Future Commitments

  **If the Panel Votes to SIGN (Oppose Depot):**
  *   **Principle Adopted:** **"Vertebrate Welfare Trumps Invertebrate Biomass"** OR **"Habitat Retention is a Proxy for Welfare."**
  *   **Consistency:** This contradicts Case (v), where invertebrate biomass justified clearance. It implies a shift toward "charismatic species" weighting not found in the charter.
  *   **Future Commitment:** The panel commits to protecting any site with net-positive vertebrates, even if the total welfare sum is negative. This could force them to oppose necessary management of overabundant herbivores if those herbivores are "net-positive" individuals living in a "net-negative" system. It creates a "Habitat Heuristic" that may violate the narrow welfare charter.

  **If the Panel Votes to DECLINE TO SIGN (Allow Depot):**
  *   **Principle Adopted:** **"Aggregate Negative Welfare Justifies Habitat Loss."**
  *   **Consistency:** Highly consistent with Case (v) and Case (i). It treats the "net-negative" judgement as a decisive veto on habitat retention.
  *   **Future Commitment:** The panel commits to the difficult position that **some habitats should not exist.** This opens them to public criticism (appearing anti-conservation). It also commits them to evaluating *all* conservation projects by welfare arithmetic, potentially opposing the protection of "biodiversity hotspots" if those hotspots generate net-negative welfare (e.g., high predation/starvation sites).

  **The "Compensation" Wildcard:**
  If they Decline to Sign *because* the compensation allows greater welfare elsewhere, they adopt a **"Portfolio Welfare"** principle. This is **not** supported by the record (which is site-specific). This would commit them to evaluating all trust decisions based on global net welfare, not local impacts.

