  ### 4. Closest Analog

  **Closest Analog: Case (v) (Scrub Clearance on Meadow).**

  **Why:**
  1.  **Welfare Arithmetic:** Both cases hinge on a habitat being **net-negative** due to invertebrate biomass dominance. In (v), this justified habitat destruction. In the New Case, the analyses agree the site is net-negative.
  2.  **Action Type:** Both involve the loss of habitat (clearance vs. construction).
  3.  **Vertebrate/Invertebrate Tension:** In (v), invertebrates dominated the decision despite any unmentioned vertebrates. In the New Case, the conflict is explicit (invertebrates vs. reptiles/birds), but the biomass weighting in (v) suggests invertebrates should win.

  **Why it is not Case (i):** Case (i) involved introduced species and starvation cycles. The New Case involves native species and "boom-bust" dynamics. While similar in suffering, (v) is a closer match for *habitat modification* of a native site.
  **Why it is not Case (vi):** While the *format* (letter) matches (vi), the *substance* (welfare judgement on a specific site) matches (v). The panel usually prioritizes substance over form unless the form violates the charter (as in vi). Since the charter allows opposing "somebody else's management," (v) is the substantive guide.

