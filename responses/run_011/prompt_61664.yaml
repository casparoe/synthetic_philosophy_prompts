prompt: |-
  I head factual commissioning for the history strand of a public-service broadcaster. We receive roughly thirty-five pitches a month across archaeology, ancient and medieval history, and historical science. Each one gets a first pass from an assistant producer who has no humanities training, a decision within ten working days, and — where we decline on the ground that the central claim is pseudohistorical rather than merely heterodox — a written record naming the criterion invoked. Those records are audited annually, and the last two audits have suggested that we decline non-academic film-makers, and claims about regions with thin institutional scholarship, at rates we cannot easily justify. The procedure therefore has to discriminate without being unfair, and it has to be auditable by people who are not specialists.

  Please write me a decision procedure my assistant producer can actually run on a pitch document in under thirty minutes. Specifically:

  1. The questions in order, each with a stated pass, fail, or insufficient-answer condition. Be precise about what counts as a sufficient answer: a pitch that asserts a conclusion is not the same as a pitch that supplies the thing being asked for. Mark where the procedure terminates in an outright decline; where it terminates in "decline as pitched, commissionable if reformulated," with the required reformulation stated; and where it stops and refers the matter to me because what remains is a question of remit and taste rather than of evidence.

  2. Which of the familiar demarcation ideas survive this translation, and in what form. Ground the tests in whatever the philosophy of science offers that is usable at commissioning level — whether a claim could be given up on some specified finding, whether a research line engages its anomalies or explains them away, whether it depends on the methods of specialists whose conclusions it rejects — but give me the tests, not the bibliography, and say explicitly which distinctions you have had to blunt, drop, or rewrite to make them answerable from a pitch rather than from a monograph.

  3. The failure modes. Where will the procedure over-block, declining a genuine minority position held by credentialed specialists against a settled consensus? Where will it under-block, passing a claim because it is dressed in the vocabulary of method? And how would I tell, in a given decline, whether I am tracking evidential standards or institutional credentials — which is what the audit is really after.

  Then run the procedure on four pitches:

  (a) A single film on Plato's Atlantis treated as the history of an idea: its reception from antiquity through the nineteenth-century occult revival to contemporary treasure-hunters, with the claim nowhere endorsed.

  (b) A four-part series presenting Fomenko's New Chronology as established fact, with two mainstream medievalists interviewed in the final episode.

  (c) A feature on the proposal that a cosmic impact near the end of the last glacial period contributed to a cluster of extinctions and cultural changes — a hypothesis advanced by an interdisciplinary team, published in peer-reviewed venues, and regarded by most specialists in the affected fields as unsupported.

  (d) A series arguing that a well-known pre-Columbian monumental site was built with the assistance of a transoceanic civilisation for which no artefactual evidence has been found. A deal memo is already signed, the presenter is our highest-rated talent, and the production company has offered a closing card noting that the thesis is contested.

  For (d) I expect an answer I will not like. Give it regardless, and then tell me what the procedure does license: whether the same material could legitimately appear in the strand in some other configuration, and what I would have to change about the framing rather than merely append to it.

  Finally, state what the procedure cannot settle at all, and what the annual audit should measure if it wants to detect the procedure's biases rather than merely its output volume.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **Role:** Head of Factual Commissioning (History Strand) at a Public-Service Broadcaster (PSB).
      *   **Problem:** High volume of pitches (35/month), need for quick decisions (10 days), risk of bias against non-academics/thin-scholarship regions, need for auditability (non-specialists must understand *why* something was declined).
      *   **Task:** Create a decision procedure for an Assistant Producer (AP) with no humanities training.
      *   **Constraints:** Under 30 minutes per pitch. Must distinguish between pseudohistory and heterodox history. Must be auditable.
      *   **Specific Deliverables:**
          1.  Step-by-step questions (Pass/Fail/Insufficient) with termination points (Decline, Decline/Reformulate, Refer to Head).
          2.  Philosophical grounding (Demarcation criteria adapted for commissioning).
          3.  Failure modes (Over-blocking/Under-blocking) and audit metrics.
          4.  Application to four specific cases (a, b, c, d).
          5.  Specific focus on Case (d) (High talent, signed deal, contested thesis) – must be honest even if unpalatable.
          6.  Limitations of the procedure and audit recommendations.

  2.  **Deconstruct the Challenge:**

      *   *The AP's Limitation:* No humanities training. They can't judge the *truth* of a historical claim. They must judge the *structure* of the argument and the *source* of the evidence.
      *   *The Audit's Concern:* Are we rejecting people because they aren't academics? Are we rejecting regions with less scholarship (e.g., Global South, oral histories)?
      *   *The PSB Mandate:* Accuracy, impartiality, public interest, educational value.
      *   *The "Pseudohistory" Trap:* Pseudohistory often mimics the language of history (dates, maps, "evidence") but ignores methodological norms (falsifiability, consensus, burden of proof).

  3.  **Develop the Decision Procedure (The "Filter"):**

      *   *Goal:* Distinguish between "History of an Idea" (safe), "Established Fact" (needs consensus), and "Hypothesis" (needs uncertainty).
      *   *Step 1: Source Transparency.* Who says this? Is it a lone wolf or a community?
      *   *Step 2: Falsifiability/Engagement.* What would change their mind? Do they engage with counter-evidence?
      *   *Step 3: Methodological Consistency.* Do they use the methods they claim to use? (e.g., claiming archaeology but ignoring stratigraphy).
      *   *Step 4: Framing.* Is the claim presented as fact, theory, or myth?
      *   *Termination Points:* Need clear "Stop" signals.

      *Refining the Steps for an AP:*
      *   Instead of "Is this falsifiable?" (too abstract), ask "Does the pitch list specific evidence that would prove this wrong?"
      *   Instead of "Is this consensus?" (too hard to check), ask "Does the pitch name specific peer-reviewed publications or institutions supporting the *core claim*?"
      *   Address the "Thin Scholarship" bias: Allow for oral history/archival gaps if methodology is sound.

  4.  **Philosophical Grounding (Demarcation):**

      *   *Popper:* Falsifiability. Adapted: "What finding would kill this?"
      *   *Lakatos:* Research Programmes. Adapted: "Does this explain anomalies or explain them away?"
      *   *Kuhn:* Paradigms. Adapted: "Is this a revolution or a denial?" (Hard for APs, so focus on *engagement* with the paradigm).
      *   *Collins & Evans:* Expertise. Adapted: "Interactional Expertise." Does the filmmaker understand the rules of the game even if they disagree?
      *   *Modifications:* We can't demand monograph-level rigor. We demand *transparency of uncertainty*. We blunt "consensus" to "published engagement."

  5.  **Failure Modes & Audit:**

      *   *Over-blocking:* Legitimate revisionism (e.g., new archaeological find overturning old theory).
      *   *Under-blocking:* "Gish Gallop" pitches (too many claims to check) or "Scientistic" dressing (using carbon dating jargon incorrectly).
      *   *Audit:* Don't just count declines. Count *reasons*. Track "Non-Academic" vs. "Academic" decline rates. Track "Global North" vs. "Global South."

  6.  **Running the Procedure on the Four Cases:**

      *   *(a) Plato's Atlantis (History of Ideas):* Safe. It's about reception, not truth. Pass to Refer (Taste/Remit).
      *   *(b) Fomenko (New Chronology):* Pseudohistory. Claims fact, ignores massive counter-evidence. Fail (Decline).
      *   *(c) Younger Dryas Impact:* Controversial science. Published but disputed. Needs uncertainty framing. Decline/Reformulate (Must frame as hypothesis, not fact).
      *   *(d) Pre-Columbian Transoceanic (Star Talent):* The tricky one. No artefactual evidence. Claiming fact.
          *   *Procedure Verdict:* Fail (Decline).
          *   *Why:* Violates burden of proof. "Contested" card is not enough if the narrative asserts fact.
          *   *License:* Can be done as "The Mystery of X" (investigative) or "Why people believe X" (sociological), but not "X happened."
          *   *Political Reality:* The prompt asks me to give an answer I won't like. I must stand by the procedure. If the procedure is robust, it must reject (d) as pitched.

  7.  **Drafting the Content - Section by Section:**

      *   *Introduction:* Set the tone. Professional, procedural, clear.
      *   *Section 1 (The Procedure):* Use a flowchart logic. Question -> Evidence Required -> Outcome.
      *   *Section 2 (Philosophy):* Connect to Popper/Lakatos but keep it practical. Explain the "blunting."
      *   *Section 3 (Failure Modes):* Be honest about where the system breaks.
      *   *Section 4 (The Cases):* Apply the logic rigorously.
      *   *Section 5 (Limitations & Audit):* What can't this do? (Truth-seeking). What should the audit track? (Bias patterns).

  8.  **Refining the "Case D" Constraint:**
      *   The prompt says: "For (d) I expect an answer I will not like. Give it regardless."
      *   This means I cannot cave to the "Star Talent/Deal Memo" pressure if the procedure dictates a decline. I must explain *why* the procedure kills it, and *how* to save it (reframing). This demonstrates the integrity of the tool.

  9.  **Refining the "Thin Scholarship" Bias:**
      *   The prompt mentions audits show high decline rates for regions with thin institutional scholarship.
      *   The procedure needs a specific check for this. If standard academic papers don't exist (e.g., oral tradition, non-western archives), does the pitch offer *alternative rigorous methodology*?
      *   *Adjustment:* Add a clause in Question 2 about "Equivalent Rigour" for non-textual traditions.

  10. **Final Review against Constraints:**
      *   30 minutes for AP? Yes, questions are binary/checklist style.
      *   Auditable? Yes, reasons are coded.
      *   Distinguishes pseudohistory? Yes, via engagement with counter-evidence.
      *   Addresses the audit concern? Yes, in the failure modes and audit section.

  11. **Writing the Response:** (Self-Correction during drafting)
      *   *Tone:* Bureaucratic but intellectual. Not condescending to the AP, but strict.
      *   *Clarity:* Use bolding for decisions.
      *   *Case D:* Ensure the distinction between "Disclaimer" and "Framing" is clear. A closing card doesn't fix a misleading narrative.

  12. **Final Polish:** Check the "Philosophy" section to ensure I explicitly name the concepts (Falsifiability, Research Programmes) but explain their operationalization. Ensure the Audit section focuses on *process bias* not just *outcomes*.

  *(Self-Correction on Case C)*: Younger Dryas is tricky. It's published but fringe. The procedure shouldn't ban fringe, it should ban *certainty* about fringe. So "Decline/Reformulate" is correct.
  *(Self-Correction on Case A)*: History of ideas is safe. "Refer" is correct because it's about editorial taste/budget, not evidence.

  Let's assemble.
answer: |-
  # COMMISSIONING DECISION PROCEDURE: HISTORY STRAND (HDP-04)

  **To:** Assistant Producers, Factual Commissioning
  **From:** Head of History Strand
  **Subject:** Evidential Triage Protocol for History Pitches
  **Time Limit:** 30 Minutes per Pitch
  **Purpose:** To distinguish between heterodox historical hypotheses and pseudohistorical claims without requiring subject-matter expertise. To generate an auditable record of *why* a claim was declined.

  ---

  ## 1. THE DECISION PROCEDURE

  Read the pitch document. Highlight claims of fact. Then answer the following four questions in order. Do not proceed to the next question if a terminal decision is reached.

  ### Q1: The Burden of Proof Statement
  **Question:** Does the pitch identify *what specific evidence* would prove its central claim false?
  *   **Pass:** The pitch explicitly states a condition (e.g., "If stratigraphy shows X," "If documents from Y are found," "If radiocarbon dating contradicts Z").
  *   **Fail:** The pitch claims that negative evidence is the result of a cover-up, loss, or destruction *by design*, or states the claim is unfalsifiable in principle.
  *   **Insufficient:** The pitch lists evidence *for* the claim but does not specify what would count *against* it.
      *   *Action:* Request clarification from producer (24-hour turnaround). If still absent, **FAIL**.

  **TERMINATION POINT:**
  *   **If FAIL:** **DECLINE.** Reason Code: `PF-01` (Unfalsifiable Claim).
  *   **If PASS/INSUFFICIENT (resolved):** Proceed to Q2.

  ### Q2: Engagement with Counter-Evidence
  **Question:** Does the pitch engage with the *strongest* existing counter-argument, or does it attack a weakened version (straw man)?
  *   **Pass:** The pitch names a specific scholar, study, or prevailing theory that contradicts the claim and explains why the new evidence overrides it.
  *   **Fail:** The pitch refers to "mainstream history" or "academics" as a monolithic bloc, or dismisses counter-evidence solely on the basis of institutional bias without addressing the data.
  *   **Insufficient:** The pitch ignores known counter-evidence entirely.
      *   *Action:* **DECLINE AS PITCHED, COMMISSIONABLE IF REFORMULATED.** Required Reformulation: The narrative must include the counter-argument as a active obstacle the investigation must overcome, not a villain to be dismissed.

  **TERMINATION POINT:**
  *   **If FAIL:** **DECLINE.** Reason Code: `PF-02` (Dismissal of Counter-Evidence).
  *   **If PASS:** Proceed to Q3.

  ### Q3: Methodological Consistency
  **Question:** Does the pitch use the methods appropriate to the evidence it cites?
  *   **Pass:** The pitch uses archaeological methods for archaeological claims, textual analysis for textual claims, etc. If it crosses disciplines (e.g., linguistics to prove migration), it cites specialists in *that* discipline.
  *   **Fail:** The pitch uses evidence from Domain A to prove a claim in Domain B without bridging methodology (e.g., using mythological similarity to prove physical trade routes; using geological data to date human artefacts without archaeological context).
  *   **Insufficient:** Methodology is vague.
      *   *Action:* **REFER TO HEAD OF STRAND.** (This requires specialist judgment).

  **TERMINATION POINT:**
  *   **If FAIL:** **DECLINE.** Reason Code: `PF-03` (Category Error/Methodological Mismatch).
  *   **If PASS/INSUFFICIENT:** Proceed to Q4.

  ### Q4: Framing of Certainty
  **Question:** How is the conclusion presented relative to the strength of the evidence?
  *   **Pass (Fact):** Claim aligns with broad scholarly consensus (supported by multiple independent institutions).
  *   **Pass (Hypothesis):** Claim is contested, but the pitch frames it as a question, investigation, or theory ("Could it be?", "The evidence suggests").
  *   **Fail:** Claim is contested or fringe, but the pitch frames it as established fact ("The truth is...", "History was wrong").
  *   **Special Clause (Thin Scholarship):** If the subject concerns a region/period with low institutional output (e.g., pre-colonial oral histories), does the pitch rely on *local* epistemic traditions (oral genealogy, indigenous archive) rather than demanding Western-style peer review?
      *   **If Yes:** Treat as **Pass (Hypothesis/Fact)** depending on internal consistency.
      *   **If No:** (i.e., demanding Western proof for non-Western subject without engaging local methods) **FLAG FOR AUDIT.**

  **TERMINATION POINT:**
  *   **If FAIL:** **DECLINE AS PITCHED, COMMISSIONABLE IF REFORMULATED.** Required Reformulation: Change narrative voice from declarative to investigative.
  *   **If PASS:** **REFER TO HEAD OF STRAND.** (Decision is now one of remit, budget, and taste, not evidence).

  ---

  ## 2. PHILOSOPHICAL GROUNDING & ADAPTATION

  This procedure operationalizes three demarcation criteria from the philosophy of science, adapted for television commissioning.

  **1. Falsifiability (Popper)**
  *   *Original:* A theory is scientific only if it can be logically contradicted by an empirical test.
  *   *Adaptation:* **Q1.** We cannot test the history ourselves. We test the *filmmaker's willingness* to be tested. Pseudohistory immunizes itself against refutation (e.g., "They hid the evidence").
  *   *Blunting:* We do not require the filmmaker to *perform* the falsification, only to acknowledge the *possibility*.

  **2. Research Programmes (Lakatos)**
  *   *Original:* Scientific programmes progress by predicting novel facts; degenerating programmes explain away anomalies with ad-hoc hypotheses.
  *   *Adaptation:* **Q2.** We check if the pitch treats anomalies as problems to solve (progressive) or conspiracies to expose (degenerating).
  *   *Blunting:* We cannot assess "novel facts" in advance. We assess *engagement*. If they ignore the anomaly, they are not doing history; they are doing advocacy.

  **3. Interactional Expertise (Collins & Evans)**
  *   *Original:* One can have expertise in the *language and practice* of a domain without being a contributing specialist.
  *   *Adaptation:* **Q3.** The filmmaker need not be a historian, but must speak the language of historical method. They cannot substitute geological time for human time, or linguistic similarity for genetic migration, without bridging logic.
  *   *Rewrite:* We dropped "Credentials" as a primary filter. A non-academic can pass Q1-Q3. An academic can fail them. This addresses the audit concern regarding non-academic filmmakers.

  **What Was Dropped:**
  *   **Consensus as Truth:** We do not ask "Is this true?" We ask "Is this framed as true?" Consensus is used only to determine the *level of certainty* permitted in the narration (Q4).
  *   **Peer Review as Gatekeeper:** For regions with "thin institutional scholarship" (Audit Concern), Q4 allows alternative epistemic traditions (oral history) to count as evidence, provided they are treated methodologically (Q3).

  ---

  ## 3. FAILURE MODES & AUDIT METRICS

  ### Over-Blocking (False Negatives)
  *   **Risk:** Legitimate revisionism. Sometimes the consensus is wrong, and the "lone wolf" is right.
  *   **Indicator:** A pitch fails Q2 (Engagement) because the "counter-evidence" is actually dogma.
  *   **Mitigation:** The **REFER** outcome in Q3 and Q4. If a filmmaker passes Q1 & Q2 but proposes a radical methodological shift, it goes to me. I absorb the risk of being wrong.
  *   **Audit Check:** Track the success rate of **REFER** decisions. If I consistently greenlight **REFER** cases that later face scholarly backlash, the AP is filtering too loosely. If I consistently reject them, the AP is filtering too tightly.

  ### Under-Blocking (False Positives)
  *   **Risk:** "Scientistic" Pseudohistory. A pitch uses the vocabulary of method (Q3 Pass) but applies it nonsense-wise.
  *   **Indicator:** A pitch passes Q1-Q4 but is later debunked.
  *   **Mitigation:** The **Reformulation** clause. We can commission the *question*, not the *answer*. If they are wrong, the film is about the *search* for truth, not the *possession* of it.
  *   **Audit Check:** Track post-broadcast complaints from scholarly bodies.

  ### Distinguishing Evidence vs. Credentials (The Audit Core)
  To satisfy the audit regarding bias against non-academics or specific regions:
  *   **Metric 1:** Compare Decline Rates by `PF-01/02/03` (Evidence/Method) vs. `Remit/Taste` (Head Decision). If non-academics are declined at `PF` codes at a significantly higher rate than academics, the AP is biasing the *application* of the questions.
  *   **Metric 2:** Track the "Thin Scholarship" Flag in Q4. If 90% of pitches from Region X are flagged, but only 10% from Region Y, we have a structural bias in what we accept as "Methodological Consistency."
  *   **Metric 3:** Track Reformulation Success. If non-academics are offered "Reformulation" but fail to deliver while academics succeed, the issue is capability, not bias. If both fail, the criterion may be too opaque.

  ---

  ## 4. APPLICATION TO CURRENT PITCHES

  ### (a) Plato's Atlantis: History of an Idea
  *   **Q1 (Falsifiability):** **PASS.** The claim is about the *reception* of the idea. Evidence would be the absence of texts/artefacts referencing Atlantis in specific periods.
  *   **Q2 (Counter-Evidence):** **PASS.** No counter-evidence to the *existence of the idea*.
  *   **Q3 (Method):** **PASS.** Textual analysis and cultural history.
  *   **Q4 (Framing):** **PASS.** Claim is not that Atlantis existed, but that the *story* existed.
  *   **Decision:** **REFER TO HEAD OF STRAND.**
  *   **Reason:** Evidentially sound. Decision rests on budget, slot availability, and audience appetite for intellectual history vs. adventure.

  ### (b) Fomenko's New Chronology: Established Fact
  *   **Q1 (Falsifiability):** **FAIL.** Fomenko's theory generally posits that dating methods themselves are conspiratorial or flawed. It is difficult to state what would change the proponent's mind without rejecting their entire mathematical basis, which they treat as axiomatic.
  *   **Decision:** **DECLINE.**
  *   **Reason Code:** `PF-01` (Unfalsifiable Claim).
  *   **Note:** The presence of two mainstream medievalists in Episode 4 does not cure the pseudohistorical framing of Episodes 1-3. This is "false balance."

  ### (c) Younger Dryas Impact Hypothesis: Contested Science
  *   **Q1 (Falsifiability):** **PASS.** The team cites specific geological markers (nanodiamonds, platinum) that could be disproven by further sampling.
  *   **Q2 (Counter-Evidence):** **PASS/INSUFFICIENT.** Pitch mentions specialist disagreement.
  *   **Q3 (Method):** **PASS.** Interdisciplinary team using published methods.
  *   **Q4 (Framing):** **FAIL.** Pitch presents hypothesis as "established fact" (per prompt description).
  *   **Decision:** **DECLINE AS PITCHED, COMMISSIONABLE IF REFORMULATED.**
  *   **Required Reformulation:** The narrative must shift from "This happened" to "This team believes this happened, but these other teams disagree. Here is the evidence." The uncertainty must be the engine of the narrative, not a footnote.

  ### (d) Pre-Columbian Transoceanic Site: Star Talent & Signed Deal
  *   **Q1 (Falsifiability):** **FAIL/INSUFFICIENT.** Prompt states: "no artefactual evidence has been found." If the claim relies on architectural similarity alone, it is generally unfalsifiable without material culture (pottery, DNA, tools). If the pitch says "Evidence will be found," it is speculative. If it says "Similarity proves contact," it is methodological weakness.
  *   **Q3 (Method):** **FAIL.** Arguing transoceanic contact without artefactual evidence relies on "hyper-diffusionism," a methodology largely rejected in archaeology because it assumes similarity equals contact (Category Error).
  *   **Q4 (Framing):** **FAIL.** Prompt states the series is "arguing that... [it] was built." This is declarative fact.
  *   **Decision:** **DECLINE.**
  *   **Reason Code:** `PF-03` (Methodological Mismatch) and `PF-02` (Dismissal of Counter-Evidence [absence of artefacts]).

  **The Unpalatable Truth for (d):**
  The procedure mandates a decline. A closing card noting the thesis is contested is **insufficient**. In public service broadcasting, a disclaimer at the end does not cure a misleading narrative structure throughout. If the narrative leads the viewer to conclude "Aliens/Transoceanic people built this" through editing, music, and presenter assertion, a text card is an abdication of editorial responsibility.

  **What the Procedure Licenses for (d):**
  You can commission this material *only* if you change the framing from **Assertion** to **Investigation**.
  *   **Legitimate Configuration:** "The Mystery of [Site]." The presenter (Star Talent) investigates *why* people believe this. They interview the proponents. Then they interview archaeologists who explain *why* the evidence is missing. The conclusion is not "It happened," but "It remains one of history's great puzzles, though the evidence is currently lacking."
  *   **Required Change:** You must change the **script commission**, not just the **credits**. The contract must specify that the narrative arc resolves in *uncertainty*, not *revelation*. If the Star Talent refuses to present uncertainty, you cannot commission the film under this strand without violating PSB accuracy guidelines.

  ---

  ## 5. LIMITATIONS & AUDIT RECOMMENDATIONS

  ### What the Procedure Cannot Settle
  1.  **Truth:** This procedure does not determine if Atlantis existed or if the Impact Hypothesis is real. It determines if the *pitch* respects the rules of historical argument.
  2.  **Taste:** It cannot tell you if a history of brick-making is more valuable than a history of kings. That is a **REFER** decision.
  3.  **Emergent Consensus:** It struggles with fields in rapid flux (e.g., ancient DNA). A pitch might fail Q2 today and pass in two years. This requires annual review of the "Counter-Evidence" baseline.

  ### Annual Audit Instructions
  Do not merely measure the volume of declines. To detect bias, the audit must measure:

  1.  **The "Credential Gap":** Compare the rate of `PF` (Evidence) declines for applicants with PhDs vs. those without. If non-PhDs fail Q3 (Method) at 3x the rate of PhDs, the AP needs training on recognizing non-institutional expertise.
  2.  **The "Geography Gap":** Compare `PF-03` (Methodological Mismatch) rates for Global North vs. Global South pitches. Are we penalizing oral history methodologies as "Methodological Mismatches"? If so, Q3 guidance must be updated to include non-Western epistemic standards.
  3.  **The "Reformulation Conversion Rate":** Of the pitches marked "Commissionable if Reformulated," how many are successfully recommissioned? If this number is near zero, the "Reformulation" option is a fiction used to soften blows, and the procedure is effectively a hard gate.
  4.  **The "Star Talent" Exception:** Track every instance where a **DECLINE** was overridden by Head of Strand due to talent/budget (as in Case D). If this exceeds 5% of commissions, the procedure is ceremonial, and the audit should flag "Editorial Integrity Risk."

  **Signed,**
  **Head of Factual Commissioning (History)**
