answer: |-
  The Caltech wormhole episode offers a rare empirical analogue for the metaphysics of time travel, transforming a logical puzzle into a tractable physical problem. Your scaffolding—distinguishing the paradox as refutation, constraint, and selection—provides the necessary architecture to map this migration. The episode does not merely instantiate David Lewis's analysis; it stress-tests its limits, revealing where the logical apparatus succeeds and where it falls silent against the granularity of physical modeling.

  Lewis's treatment of the grandfather paradox rests on an equivocation in "can." The traveler can kill the grandfather relative to local abilities and immediate facts, but cannot relative to the compossibility of the act with the settled past. In the Caltech episode, the transition from Refutation to Constraint mirrors this logical move, but strips it of agency. When Polchinski engineered the billiard ball scenario, he deliberately removed the "abilities" half of Lewis's equivocation. A billiard ball has no capacity to choose; it has only initial conditions and dynamical laws. Consequently, the Lewisian distinction between local possibility and global compossibility remains structurally intact, but the vocabulary of ability becomes superfluous. The ball "can" enter the wormhole locally, but "cannot" do so in a way that prevents its own entry globally.

  However, mapping Lewis onto the physics reveals a divergence in mechanism. For Lewis, the impossibility of the inconsistent history is a logical truth; it is ruled out by the principle of non-contradiction. For Thorne and Novikov, consistency is a physical constraint enforced by dynamic adjustment. The ball does not fail to enter because it is logically impossible, but because the trajectory adjusts—a glancing blow rather than a collision—to satisfy the boundary conditions of the spacetime. Lewis's apparatus explains why there is no contradiction, but it is silent on how consistency is physically maintained. The philosophical toolbox treats consistency as a static filter on possible worlds; the physics treats it as a dynamic fixed-point condition on fields and trajectories. Lewis answers the question "Is this coherent?" but the physicists answered "How is this enforced?" This is the first gap: Lewis's compossibility is a necessary condition for the physics, but it is not a sufficient explanation of the physical mechanism.

  The episode becomes most provocative when it migrates to your third role: Selection. Echeverria and Klinkhammer's finding that multiple self-consistent solutions exist for a single initial state challenges the Lewisian assumption of a unique fixed past. Lewis writes as though "the past" is a singular determinant against which compossibility is measured. But if multiple distinct histories are all compossible with the same initial conditions and the same laws, Lewis's framework lacks the resources to distinguish them. He tells us which histories are impossible (the inconsistent ones), but he offers no account for how one possible history is selected over another.

  This raises the question of whether the residual problem is indeterminism. Your intuition regarding John Norton's dome is apt but requires qualification. In Norton's case, non-uniqueness arises from a singularity in the force function, suggesting a failure of classical determinism due to ill-posed dynamics. In the wormhole case, the non-uniqueness arises from the global topology of the spacetime allowing multiple valid geodesics. Both cases demonstrate classical physics admitting multiple futures from identical pasts. However, invoking Norton risks distorting the case if it implies the physics is "broken." In the wormhole scenario, the non-uniqueness is a feature of the solution space, not necessarily a pathology of the equations. The deeper philosophical issue is whether this multiplicity constitutes a paradox of time travel or merely ordinary indeterminism. If the laws do not pick a history, then the "fixed past" Lewis relies on is not fixed by the laws alone. Here, the theory is explicitly silent. Lewis assumes a determinate past to define compossibility; he does not account for a scenario where the past itself is underdetermined by prior conditions. This is not a failure of Lewis's logic, but a boundary of his model: he analyzed the logic of consistency, not the metaphysics of historical selection.

  Hawking's chronology protection conjecture must be assessed against this backdrop. By arguing that vacuum fluctuations diverge at the Cauchy horizon, Hawking effectively reverts the paradox from Constraint back to Refutation. Is this a philosophical concession? It depends on whether one views the prohibition as logical or physical. If Lewis is right that time travel is logically possible (consistent), Hawking's move is not a concession but a relocation. It admits the logical coherence while denying the physical stability. This suggests the two communities were arguing about different objects: philosophers analyzed the consistency of narratives, while physicists analyzed the stability of manifolds. Hawking's move indicates that the Constraint role may be physically empty even if it is logically robust. The paradox is not refuted by logic, but by quantum field theory. This leaves the philosophical analysis intact but potentially idle; we have a consistent logic for a physical situation that cannot obtain.

  The Sagan origin story bears on the epistemic status of this work only insofar as it highlights the heuristic power of narrative constraints. That the research program began as a solution to a plot hole does not undermine the mathematics; if anything, it demonstrates that narrative coherence can serve as a rigorous constraint on theory construction. The requirement that the story "not embarrass a physicist" forced a level of precision that pure speculation might not have demanded. However, the epistemic status of the results rests on the general relativity, not the novel. The fiction was the catalyst, not the justification. To treat it as merely color ignores how narrative intuition guided the formulation of the physical question, but to treat it as evidence would be a category error.

  So, what is the verdict on the reverse direction? Does this episode confirm Lewis, stand as an anomaly, or represent an unanticipated case? It is best understood as an unanticipated case that confirms the logical core of Lewis's view while exposing the insufficiency of his framework for physical application. Lewis was correct that the grandfather paradox is not a logical refutation of time travel; the Caltech episode confirms that self-consistent models exist. However, Lewis's analysis was built for the Refutation role. It assumes a binary: either the history is consistent or it is not. It goes quiet on the Selection role. When faced with multiple consistent histories, Lewis's compossibility strategy cannot explain why one obtains rather than another, because his model presupposes a unique past against which "can" is evaluated.

  Therefore, the compossibility strategy does significant work in dissolving the logical contradiction, but it cannot do the metaphysical work of selecting a history. The episode confirms that the paradox is not a logical barrier, but it reveals that the philosophical toolbox lacks the mechanisms to handle the physical consequences of consistency. Lewis solved the problem of contradiction, but the physicists uncovered a problem of uniqueness. The episode implies that while Lewis's analysis is necessary for clearing the logical ground, it is insufficient for navigating the terrain once the ground is cleared. The paradox migrates from "Is this possible?" to "Which of these possibilities is actual?" and there, the Lewisian apparatus has no purchase. This suggests that any robust metaphysics of time travel must integrate the logic of compossibility with a physics of historical selection, or admit that the logic alone leaves the most pressing metaphysical questions unanswered.
