answer: |-
  Design rationale
  The branching order prioritizes meta-philosophical stance over metaphysical commitment to prevent premature labeling. By first diagnosing the skeptic's move, we separate those who accept the paradox's force from those who reject its presuppositions. Subsequent nodes drill into the mechanism of the problem (finitude vs. structure), the source of correctness (judgment vs. fact), and the scope of the worry (generalization). This mirrors the dialectical progression of the debate without naming the schools. The social and self-referential nodes appear late to ensure participants have already committed to the existence of the problem before addressing community or vocabulary constraints. This structure forces participants to reveal their intuitions on cases before they can hide behind terminology.

  The nodes
  Node 1: Consider the argument that no fact about you fixes what you mean by "plus." Does this argument successfully show that no such fact exists, or does it only work by assuming a picture of what a meaning-fact would have to look like that nobody is obliged to accept?
  Option A: The argument succeeds; there is no fact.
  Option B: The argument fails; it relies on a mistaken picture.

  Node 2: Suppose you have calculated sums all your life. Is the problem merely that your past record is finite and so underdetermines the future, or would even an ideally complete record of all your uses fail to single out addition rather than a gerrymandered function?
  Option A: Finite record is the problem; ideal record would fix it.
  Option B: Even an ideal record fails to fix it.

  Node 3: When you say "68+57=125" is correct, is this made true by our best judgments and agreements about it, or does its correctness hold independently of what we judge or agree upon?
  Option A: True because of our best judgments/agreements.
  Option B: True independently of our judgments/agreements.

  Node 4: Does this worry about rules apply only to meaning, or does it generalize to other normative practices like applying the word "red," the legal standard "reasonable care," or the correct rendering of a musical passage?
  Option A: Peculiar to meaning and logic.
  Option B: Generalizes to other normative practices.

  Node 5: Imagine a single individual isolated from any community since birth. Could this lone speaker so much as be wrong about how to follow a rule, or is wrongness impossible without others?
  Option A: The lone speaker can be wrong.
  Option B: Wrongness is impossible without a community.

  Node 6: If the skeptic's argument works, can the skeptic state the conclusion in contentful terms without undermining their own vocabulary, or does the argument destroy the possibility of stating it?
  Option A: The skeptic can state the conclusion meaningfully.
  Option B: The argument undermines the skeptic's own vocabulary.

  The tree
  *   Node 1A (Skeptic Succeeds)
      *   Node 6A (Skeptic Can Speak)
          *   Node 5B (No Lone Speaker) -> Leaf: Kripke's Skeptical Solution
          *   Node 5A (Lone Speaker Wrong) -> Leaf: Community-Relative View
      *   Node 6B (Self-Defeat)
          *   Node 4B (Generalizes) -> Leaf: Global Error Theory
          *   Node 4A (Meaning Only) -> Leaf: Expressivist View
  *   Node 1B (Skeptic Fails)
      *   Node 2A (Finite Record)
          *   Node 3B (Independent Truth) -> Leaf: Platonist Realist
          *   Node 3A (Judgment Truth) -> Leaf: Deflationary View
      *   Node 2B (Ideal Record Fails)
          *   Node 3B (Independent Truth)
              *   Node 5A (Lone Speaker) -> Leaf: Non-Metaphysical Realist
              *   Node 4B (Generalizes) -> Leaf: Normative Social Practice
          *   Node 3A (Judgment Truth)
              *   Node 4B (Generalizes) -> Leaf: Therapeutic Dissolution
              *   Node 2A (Finite) -> Leaf: Straight Naturalist
              *   Node 2B (Ideal) -> Leaf: Idealized Naturalist
              *   Node 5B (No Lone) -> Leaf: Fictionalist View

  The leaves
  Straight Naturalist. Meaning is constituted by the subject's physical dispositions to respond in specific ways under standard conditions. The awkward commitment is that this implies actual errors are physically impossible for the subject to make.
  Idealized Naturalist. Meaning is constituted by dispositions the subject would have under idealized epistemic conditions. The awkward commitment is that the idealization conditions must be specified without circularly invoking meaning.
  Kripke's Skeptical Solution. Meaning is constituted by assertability conditions fixed by community agreement rather than truth conditions. The awkward commitment is that this makes meaning essentially social, denying private language possibility.
  Therapeutic Dissolution. There is no meaning-constituting fact because the demand for one rests on a philosophical illusion. The awkward commitment is that this offers no positive theory, only a dissolution of the question.
  Platonist Realist. Meaning is constituted by abstract entities that exist independently of human practices and judgments. The awkward commitment is that this requires epistemic access to causally inert abstract objects.
  Non-Metaphysical Realist. Meaning is constituted by facts that are independent of judgment but not metaphysically robust entities. The awkward commitment is that this distinction between robust and non-robust facts remains obscure.
  Deflationary View. Meaning is fixed by a basic acceptance property rather than by any reductive analysis or constitution story. The awkward commitment is that this refuses to explain what acceptance consists in.
  Normative Social Practice. Meaning is located in normative statuses within a social practice of giving and asking for reasons. The awkward commitment is that this makes meaning inaccessible to outsiders of the practice.
  Global Error Theory. Nothing ever means anything and ordinary meaning-talk survives only as a useful fiction. The awkward commitment is that this renders all communication systematically false yet pragmatically retained.
  Community-Relative View. Both the ordinary reading and the deviant reading are correct relative to different communal standards. The awkward commitment is that this denies genuine contradiction between skeptic and speaker.
  Expressivist View. Meaning attributions are expressive or practical moves rather than reports of descriptive facts. The awkward commitment is that this struggles to account for the logical embedding of meaning claims.
  Fictionalist View. Meaning talk is false but we should continue using it as if it were true for practical purposes. The awkward commitment is that this requires a stable distinction between useful fiction and reality.

  What this instrument cannot separate
  This instrument cannot genuinely separate Kripke's Skeptical Solution from the Therapeutic Dissolution. Both positions often yield identical answers on the diagnostic cases, particularly regarding the skeptic's success and the role of community. The failure here is because the positions coincide in practice; both reject truth-conditions for meaning claims in favor of use-based accounts, differing mostly in rhetorical emphasis rather than case intuition. Similarly, the Deflationary View and the Therapeutic Dissolution are indistinguishable here. Both refuse to offer a constitution story, treating the demand for one as mistaken. The failure is because my diagnostic cases are too coarse to distinguish a metaphysical refusal from a linguistic dissolution. Finally, the Global Error Theory and the Fictionalist View may collapse together if the respondent sees no practical difference between systematic falsehood and useful fiction.

  Empty cells
  Several answer combinations yield no occupant. Node 1A (Skeptic Succeeds) combined with Node 3B (Independent Truth) is empty. This cell is incoherent because accepting the skeptic's conclusion denies the existence of meaning-facts, while asserting independent truth affirms them. Node 1B (Skeptic Fails) combined with Node 6B (Self-Defeat) is also empty. This cell is incoherent because if the skeptic fails, their vocabulary remains intact, so self-defeat does not arise. Node 2A (Finite Record) combined with Node 5B (No Lone Speaker) is stable but unattractive. It suggests finitude requires community, but most finitude solutions are individualist. This cell remains unexplored because few philosophers argue that finite records specifically necessitate sociality without invoking the stronger structural paradox. These empty cells reveal logical boundaries in the debate space.

