      *   *Analysis:* The distinction is real and significant. Pascal cares about reality (God exists); Pi cares about meaning (God is present in the telling). A defender of the analogy must surrender the claim that Pi is betting on *truth*. They must argue Pi is betting on *value*. This shifts from epistemology/metaphysics to axiology/hermeneutics. If truth is irrelevant to the payoff, it's not a wager on reality, but a wager on *how to live with reality*. It collapses if you insist Pascal also ignores truth. It holds if you view both as pragmatic justifications for belief despite evidential gaps.

