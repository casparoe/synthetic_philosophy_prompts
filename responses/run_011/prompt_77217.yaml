answer: |-
  **Exam Question: Philosophy of History Seminar**
  **Time Allowed:** 75 Minutes
  **Total Marks:** 25

  **Question:**
  Consider the following scenario: A seminar participant is analyzing the case notes of a provincial British physician from the 1840s. The physician recorded a cluster of patients—nearly all recently confined women—as suffering from "disordered nerves." He prescribed extended bed rest, isolation from children, and bleeding. The participant wishes to write that these women were suffering from *postpartum depression* and that the treatment *aggravated* their condition. A supervisor objects on two separate grounds:
  1.  **Conceptual:** The diagnosis imports a twentieth-century nosology onto descriptions the physician and his patients would not have recognized.
  2.  **Evaluative:** Calling the treatment harmful amounts to judging a practitioner by standards he had no access to.

  Write an essay that addresses the following:
  (a) Distinguish the conceptual objection from the evaluative objection. Explain why successfully defending the claim that the treatment was harmful does not automatically legitimize the retrospective diagnosis.
  (b) Propose a specific criterion for when retrospective description is legitimate. Do not merely name the problem; articulate a test for when a later concept may be applied to past agents.
  (c) Confront the asymmetry inherent in strict period-authenticity: if we ban later vocabularies, do we make certain past wrongs inexpressible? Finally, acknowledge the reflexive difficulty that your own criteria are historically situated.

  ***

  **Model Answer**

  The supervisor's objections highlight the twin dangers of presentism: conceptual distortion and moral anachronism. However, these are distinct philosophical problems requiring distinct solutions. Conflating them leads to historiographical paralysis. To write responsible history, we must distinguish the ontology of past suffering from the evaluation of past actions, and we must establish a criterion for conceptual translation that avoids both imperialistic projection and silencing silence.

  The conceptual objection concerns *description*. It argues that "postpartum depression" (PPD) is a construct embedded in twentieth-century psychology, unavailable to the 1840s actors. The evaluative objection concerns *normativity*. It argues that labeling bleeding "harmful" imposes modern medical ethics on a practitioner acting within the best standards of his time. Crucially, answering the evaluative objection does not solve the conceptual one. One might argue that bleeding is objectively harmful regardless of historical context (a realist stance on medical efficacy). However, establishing that the treatment worsened the patients' physical state does not prove that the patients' internal experience maps onto the specific syndrome of PPD. The physician might have been treating a physiological infection he misidentified as nervous disorder. Validating the claim of harm confirms the outcome, but it does not validate the retrospective categorization of the *illness*. We can judge the treatment wrong without assuming the modern diagnosis is right.

  To navigate the conceptual objection, the historian requires a criterion stricter than "similarity." I propose a **criterion of functional continuity**. A retrospective concept is legitimate only if the historian can demonstrate that the past agents' conceptual and normative resources contain a functional equivalent that licenses the translation. This is not about finding the exact word, but identifying a shared structure of experience. For example, if the 1840s notes describe melancholia, withdrawal from infants, and somatic lethargy following birth, there is a phenomenological bridge to PPD. The historian must show that the *role* the concept plays in the explanation of the agents' behavior aligns with the modern concept. If nothing in the agents' resources licenses the concept—if the modern term explains behavior the agents would find unintelligible—the description is illegitimate.

  However, strict adherence to period-authentic vocabulary creates a dangerous asymmetry. If we ban all concepts unknown to the agents, we risk making certain structural wrongs literally inexpressible. The 1840s physician operated within a patriarchal framework that may have lacked the vocabulary to recognize the psychological toll of isolation as a "wrong." If the historian restricts herself solely to the physician's vocabulary ("nerves," "hysteria"), she reproduces the epistemic violence of the period. She becomes unable to name the suffering that the period's ideology obscured. Therefore, the demand for purity is not neutral; it privileges the oppressor's vocabulary over the victim's experience. The historian must sometimes use anachronistic terms to reveal realities the past could not articulate, provided she signals the anachronism explicitly.

  Finally, we must confront reflexivity. The criterion of functional continuity and the refusal to silence past wrongs are themselves products of a specific historical moment. My insistence on "psychological experience" is as situated as the physician's insistence on "nerves." Acknowledging this situatedness does not entail relativism. It does not mean all descriptions are equally valid. Rather, it requires the historian to own her positionality. We do not escape our present to view the past; we negotiate between our conceptual resources and theirs. The goal is not a view from nowhere, but a transparent account of how our questions illuminate the past, while remaining open to the past's capacity to challenge our categories.

  In conclusion, the participant may describe the treatment as harmful based on trans-historical medical facts, but she must justify the PPD diagnosis through functional continuity, not mere resemblance. She must use modern concepts to expose silences in the historical record, while acknowledging that her own tools are historically contingent. This is not presentism as distortion, but presentism as necessary mediation.

  ***

  **Marking Scheme (25 Points)**

  **I. Distinction of Objections (6 Points)**
  *   **5-6 pts:** Clearly distinguishes conceptual (ontology/description) from evaluative (normativity/judgment) presentism. Explicitly explains why validating the *harm* (evaluative) does not validate the *diagnosis* (conceptual).
  *   **3-4 pts:** Distinguishes the two but fails to explain the logical independence (e.g., assumes proving harm proves diagnosis).
  *   **0-2 pts:** Conflates the two objections or treats them as a single "anachronism" problem.

  **II. Criterion for Legitimacy (8 Points)**
  *   **7-8 pts:** Proposes a specific, actionable test (e.g., functional continuity, recognition test, phenomenological bridge). Explains what happens when the test fails (the description is rejected).
  *   **4-6 pts:** Proposes a vague criterion (e.g., "if it fits," "if it helps understanding") without defining limits.
  *   **0-3 pts:** Fails to propose a criterion; merely restates the problem of anachronism.

  **III. Asymmetry and Reflexivity (6 Points)**
  *   **5-6 pts:** Articulates the "silencing" risk of strict authenticity (making wrongs inexpressible). Acknowledges historian's situatedness without collapsing into relativism.
  *   **3-4 pts:** Addresses one element (either asymmetry or reflexivity) but not both, or treats situatedness as implying relativism.
  *   **0-2 pts:** Ignores the asymmetry; treats period-authenticity as purely virtuous or ignores the historian's own historical position.

  **IV. Structure and Clarity (5 Points)**
  *   **5 pts:** Argument is cohesive, follows the prompt's order, and stays within word limits.
  *   **3-4 pts:** Understandable but disorganized or significantly over/under length.
  *   **0-2 pts:** Difficult to follow; lacks introduction or conclusion.

  **Characteristic Mistakes & Deductions**
  *In addition to the rubric above, apply the following specific deductions if applicable:*

  1.  **The "Dialogue" Cliché (-3 Points):** Invoking the formula that "history is a dialogue between the present and the past" as a solution without explaining the *mechanics* of that dialogue. This substitutes a metaphor for an argument.
  2.  **The Relativist Collapse (-3 Points):** Concluding that because the historian is situated, no objective claims about harm or diagnosis can be made. This fails the reflexivity requirement which demands owning one's position, not abandoning truth claims.
  3.  **The Conflation Error (-4 Points):** Treating the conceptual and evaluative objections as a single issue (e.g., arguing that because the doctor didn't know better, the diagnosis is also invalid). This indicates a fundamental failure to grasp the prompt's core philosophical distinction.

  **Grade Boundaries:**
  *   **First-Class (20-25):** Sharp distinction on objections; robust criterion; handles asymmetry/reflexivity nuance.
  *   **Upper Second (15-19):** Competent distinction; vague criterion; misses one nuance of asymmetry/reflexivity.
  *   **Lower Second/Third (10-14):** Conflates objections; no clear criterion; descriptive rather than analytical.
  *   **Fail (0-9):** Fundamental misunderstanding of presentism; incoherent.
