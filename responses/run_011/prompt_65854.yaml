answer: |-
  This is an exceptionally sharp set of intuitions. You have correctly identified the fault lines in Aristotle's theory: the tension between *convention* and *nature*, between *measure* and *medium*, and between *equality* and *proportion*.

  You are right to be suspicious. You cannot keep all seven verdicts and remain Aristotelian. To write this paper, you need a precise definition that exposes where your modern intuitions diverge from his political ontology.

  Here is a reconstructed **Political-Functional Account of Money**, derived from *Nicomachean Ethics* V.5 and *Politics* I.8–10, with necessary repairs to handle modern complexity.

  ### The Account: Money as Conventional Commensurability for Reciprocal Justice

  **Definition:**
  Money is a **conventional token** (1), instituted by a **political community** (2), that serves as a **universal medium of exchange and measure of value** (3), calibrated to **proportionate need** (4), such that it facilitates **reciprocal justice** without becoming an **end in itself** (5).

  **Clause Breakdown & Motivating Cases:**

  1.  **Conventional Token (*Nomos*):** Money has no value by nature (like a shoe); it has value by agreement.
      *   *Motivating Case:* **Cigarettes in prison.** They are physically just tobacco, but conventionally they function as the *metron* (measure). This validates your intuition that they are money.
  2.  **Instituted by a Political Community:** Money requires a *polis* (or a functional equivalent) that guarantees its acceptability beyond a single bilateral trade.
      *   *Motivating Case:* **The Gift Card.** A $25 card is a private voucher (pre-payment). Once a town settles debts in it, it has transcended private contract and become a public convention. This validates your intuition that the *scope of acceptance* determines moneyness.
  3.  **Universal Medium and Measure:** It must circulate (medium) and render dissimilar things comparable (measure).
      *   *Motivating Case:* **Company Scrip.** It measures value, but it fails the "universal" test because it is captive to a monopoly. It is money, but *defective* money. This validates your intuition that it is "unjust money"—the injustice is internal because it violates the requirement for a common medium shared by the community.
  4.  **Calibrated to Proportionate Need:** This is the hardest clause. For Aristotle, exchange is not 1:1 equality of labor/time, but reciprocity based on the *worth* (*axia*) of the producers and the *need* (*chreia*) of the community.
      *   *Motivating Case:* **The Time-Bank.** (See below: This is where you must sacrifice a verdict).
  5.  **Not an End in Itself (Anti-Hoarding/Usury):** Money's *telos* is exchange for use-value. Using money to beget money (*tokos*) violates its nature.
      *   *Motivating Case:* **Interest.** This validates your intuition on payday loans (exploitative, money breeding money from necessity). It challenges your intuition on mortgages (see below).

  ---

  ### Application to Your New Cases

  **1. Central-Bank Digital Currency (CBDC) that expires if unspent**
  *   **Verdict:** **Highly Aristotelian Money.**
  *   **Reasoning:** Aristotle's deepest fear is "unnatural chrematistics"—hoarding money for its own sake, detaching it from need. An expiring currency forces the token to remain a *medium of exchange* and prevents it from becoming a *store of wealth*. It aligns the instrument perfectly with its *telos* (facilitating the circulation of goods for need). Aristotle would likely view this as a moral improvement over standard fiat, which allows for infinite accumulation.

  **2. A Pure Gift Economy**
  *   **Verdict:** **Not Money.**
  *   **Reasoning:** In a gift economy, transfers are based on *liberality* or kinship obligation, not *reciprocal justice* measured by a common standard. Aristotle distinguishes between *exchange* (which requires commensurability via money) and *giving* (which does not). Without a measure to ensure proportionate reciprocity, there is no "justice" in the Aristotelian sense, only friendship or charity. It lacks Clause 3 (Measure).

  ---

  ### The Sacrifices: Which Verdicts You Must Give Up

  You asked for honesty. To maintain a coherent Aristotelian thesis, you cannot defend all your gut verdicts. Here is the damage report.

  **1. The Time-Bank (You must modify or drop this)**
  *   **Your Verdict:** It is money, *but* you believe the surgeon/cleaner equality is wrong and Aristotle is right about proportionality.
  *   **The Conflict:** You wrote: *"Those two can't both survive, can they?"* **No, they cannot.**
  *   **Aristotle's View:** In *NE* V.5, Aristotle explicitly argues that if a builder and a shoemaker exchange, the builder must receive *more* than the shoemaker, proportionate to their social worth/status. If the Time-Bank enforces 1 hour = 1 hour, it enforces *arithmetic* equality, not *geometric* (proportionate) equality.
  *   **The Fix:** You must argue that a Time-Bank is **money, but unjust money**. It functions as a medium (Clause 3) but fails the test of proportionate need (Clause 4). If you want to defend the Time-Bank as *just*, you must abandon Aristotle on this point. If you want to keep Aristotle, you must condemn the Time-Bank's egalitarian rate as a violation of reciprocal justice.

  **2. Wergild (You should drop this)**
  *   **Your Verdict:** Money, even though it doesn't circulate.
  *   **The Conflict:** Aristotle defines money by its role in *binding the polis* through ongoing association (*koinonia*). Wergild is a **terminal payment**. It does not facilitate exchange; it *ends* a relationship (the feud) to prevent further violence. It lacks the "circulation" aspect of Clause 3.
  *   **The Fix:** Classify Wergild as **Compensation**, not Money. It is a price on a life, not a measure for exchange. Keeping it as "money" stretches the definition so far it loses its explanatory power regarding the *polis*.

  **3. Interest / Mortgages (You must refine this)**
  *   **Your Verdict:** With him on payday loans, against him on mortgages.
  *   **The Conflict:** Aristotle condemns *tokos* (interest) universally because "money was intended to be used in exchange, but not to increase at interest" (*Politics* I.10). To him, a mortgage and a payday loan are the same category: money breeding money.
  *   **The Fix:** To save your intuition on mortgages, you need a **Scholastic Repair** (like Aquinas), not a strictly Aristotelian one. You must distinguish between *consumptive loans* (payday, where interest eats the borrower's substance) and *productive loans* (mortgage/business, where the money generates new value/assets). Aristotle does not make this distinction clearly. If you defend the mortgage, you are arguing that Aristotle's prohibition is too broad, not that his definition of money covers it.

  ### Summary for Your Paper

  If you defend the **Political-Functional Account** above, here is your thesis map:

  1.  **Defend:** Cigarettes, Gift Card (when generalized), Company Scrip (as corrupt), Expiring CBDC.
  2.  **Condemn (as Unjust/Defective):** Time-Bank (for violating proportionality), Company Scrip (for violating community).
  3.  **Reclassify (as Non-Money):** Wergild (Compensation), Gift Economy (Liberality).
  4.  **Critique (as needing repair):** Interest (Distinguish productive vs. consumptive to save the mortgage).

  **The "Killer" Insight for your Seminar:**
  Focus on the **Time-Bank**. It is the perfect stress test. It reveals that for Aristotle, money is not just a technical tool for exchange; it is a **moral technology** designed to reflect the hierarchical structure of the community. If your money treats unequal contributors as equal (1 hour = 1 hour), Aristotle would argue it is lying about the nature of the community, and thus cannot sustain justice.

  Your intuition that "the community comes apart" if you ignore proportionality is the most Aristotelian thought you have. Lean into that. It forces you to admit that "money" for Aristotle is never neutral; it is always an embodiment of a specific theory of value and worth.
