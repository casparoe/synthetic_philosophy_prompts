answer: |-
  **MEMORANDUM**

  **TO:** Board of Trustees
  **FROM:** Legal & Research Unit
  **SUBJECT:** Decision Procedure for Contributor Responsibility Findings
  **DATE:** October 26, 2023

  ### 1. WARNING: THE UNLIKEABLE OUTCOME
  Before implementing this procedure, you must accept one specific output. **The WWI Historical Case (Germany, 1914) will result in a finding of significant liability.**

  This procedure is designed to resolve the "sleepwalking" vs. "war guilt" debate by choosing a specific framework (detailed below). That framework treats self-created strategic rigidity (e.g., mobilization timetables) as *choice*, not *compulsion*. Consequently, applying this machinery to the 1914 record reproduces the functional outcome of Article 231 of the Versailles Treaty. If your goal is to avoid the political toxicity of that historical finding, you cannot use this procedure. If your goal is to have a consistent, defensible mechanism for apportioning cost, this is the price of consistency.

  ### 2. THEORETICAL FRAMEWORK: OBJECTIVE FORESEEABILITY & AGENCY
  We are not adjudicating moral sin. We are adjudicating **risk imposition**.

  **The Chosen Standard:** A contributor is responsible if their acts or omissions created a foreseeable risk of harm that materialized, unless they were coerced by an external force or lacked the capacity to know the risk.

  **Why this over the rival (Subjective Intent)?**
  *   **The Rival:** A "Specific Intent" standard requires proof that the contributor *wanted* the specific harm to occur.
  *   **The Failure:** States rarely document malicious intent. A Specific Intent standard would allow any contributor to escape liability by claiming they "hoped for peace" while mobilizing armies. It renders the fund insolvent.
  *   **The Choice:** "Objective Foreseeability" asks: *Should a reasonable state actor have known this action would lead to harm?* This captures recklessness and negligence without requiring a smoking gun.
  *   **The Risk:** It casts a wider net. It may catch actors who feel they were "just following protocol." This is necessary to prevent the "sleepwalking" defense from absolving everyone.

  ---

  ### 3. THE DECISION PROCEDURE
  **Timeframe:** 3 Weeks
  **Operator:** Junior Researcher (History)
  **Output:** Draft Finding for Board Vote

  #### STEP 1: DEFINE THE UNIT OF AGENCY
  **Question:** Who is "it" in "its acts or omissions"?
  **Procedure:**
  1.  Identify the **State** as the continuous legal person liable for payment.
  2.  Identify the **Executive Cabinet** (or equivalent governing body) at the time of the act as the "Operating Mind."
  3.  **Rule:** The acts of the Cabinet are the acts of the State. The dissolution of the Cabinet does not extinguish the State's liability. The current population pays as the successor to the State, not as individuals.
  **[JUDGMENT CALL]:** If the state ceased to exist entirely (e.g., dissolved into new entities), liability apportions to successors based on asset inheritance. If the regime changed but the state continued (e.g., Empire to Republic), liability remains with the State.
  **Evidence Required:** Constitutional continuity records; treaty succession records.

  #### STEP 2: ESTABLISH CAUSATION (THE "SUBSTANTIAL FACTOR" TEST)
  **Question:** Did the contributor's acts or omissions bring about the harm?
  **Procedure:**
  1.  Apply the "But-For" Test: Would the harm have occurred *at the time and in the manner it did* without this contributor's action?
  2.  If "No" (Harm still happens same way): **No Liability.** Terminate.
  3.  If "Yes" (Harm changes or is delayed): Proceed to Step 3.
  4.  **Overdetermination Rule:** If multiple contributors were each independently sufficient to cause the harm (e.g., four states each declared war independently), treat all as "Substantial Factors." Do not exempt them because others also caused it. Proceed to Step 5 for apportionment.
  **Evidence Required:** Chronology of mobilization, declarations, supply chains.

  #### STEP 3: ASSESS THE COMPULSION PROVISO
  **Question:** Were the acts done under compulsion?
  **Procedure:**
  1.  **Define Compulsion:** External coercion that leaves no reasonable alternative (e.g., invasion threat, direct order by occupying power).
  2.  **Exclude Self-Created Constraint:** Internal rigidity (e.g., mobilization timetables, alliance commitments entered voluntarily, domestic political pressure) is **NOT** compulsion.
      *   *Rationale:* A state that builds a machine that compels it to act is responsible for building the machine.
  3.  **Test:** Could the Cabinet have chosen a different course without immediate destruction of the State?
      *   If Yes: Compulsion defense fails.
      *   If No: Compulsion defense succeeds. **No Liability.** Terminate.
  **[JUDGMENT CALL]:** Distinguishing between "Alliance Obligation" (Voluntary) and "Gun to Head" (Compulsion). An alliance treaty signed 20 years prior is voluntary. An ultimatum delivered 24 hours prior is compulsion.
  **Evidence Required:** Cabinet minutes regarding alternatives; text of alliance treaties; military threat assessments at the time.

  #### STEP 4: ASSESS THE IGNORANCE PROVISO
  **Question:** Were the acts done in ignorance of their consequences?
  **Procedure:**
  1.  **Define Ignorance:** Lack of actual knowledge.
  2.  **Test for Culpable Ignorance:** Would a "Reasonable State" in that position have inquired further?
      *   If the risk was obvious to contemporaries: Ignorance defense fails.
      *   If the contributor chose not to ask to maintain "plausible deniability": Ignorance defense fails (Willful Blindness).
      *   If the information was genuinely unavailable despite reasonable inquiry: Ignorance defense succeeds. **No Liability.** Terminate.
  **[JUDGMENT CALL]:** Determining "Reasonable Inquiry." Look at what *other* states knew at the time. If State A knew the risk, State B cannot claim ignorance unless State A successfully concealed it through deception.
  **Evidence Required:** Diplomatic cables; intelligence reports; public press at the time; comparative knowledge of peer states.

  #### STEP 5: QUANTIFY RESPONSIBILITY (APPORTIONMENT)
  **Question:** What is the extent of responsibility "in proportion thereto"?
  **Procedure:**
  1.  **Base Liability:** If Steps 2, 3, and 4 are cleared, the contributor is liable.
  2.  **Scaling:**
      *   **Direct Initiation:** 100% baseline (if sole actor).
      *   **Enabling Support:** 25-50% baseline (depending on criticality).
      *   **Passive Omission:** 10-25% baseline (failure to prevent when able).
  3.  **Adjustment for Overdetermination:** If multiple contributors are liable (see Step 2), sum the baselines. Normalize to 100% based on relative risk contribution.
      *   *Example:* If Actor A (50%) and Actor B (50%) both independently sufficient, each pays 50%.
      *   *Example:* If Actor A (90%) and Actor B (10%) contributed to risk, split accordingly.
  **[JUDGMENT CALL]:** Assigning the percentage baselines. This is not math; it is policy. The Researcher proposes; the Board decides. The Researcher must justify the % based on the *magnitude of risk introduced*, not just the outcome.
  **Evidence Required:** Comparative analysis of all contributors' actions.

  #### STEP 6: BOARD REVIEW (VALUES VS. FACTS)
  **Question:** Is this finding acceptable?
  **Procedure:**
  1.  Researcher submits Draft Finding with evidence log.
  2.  Board reviews **only** the [JUDGMENT CALL] flags.
  3.  Board votes to Uphold, Amend, or Reject.
  4.  **Constraint:** Board cannot overturn factual findings (Steps 2-4) without new evidence. They can only adjust Apportionment (Step 5).

  ---

  ### 4. APPLICATION TO TEST CASES

  #### CASE 1: THE "BLANK CHEQUE" STATE (Hypothetical)
  **Facts:** State A gives State B a written assurance of "unconditional support." State B, relying on this, initiates a conflict with State C. State A claims it wanted peace but was bound by honor.
  **Procedure Run:**
  *   **Step 1 (Unit):** State A is the actor.
  *   **Step 2 (Causation):** But-for the assurance, State B would likely have hesitated. Substantial Factor met.
  *   **Step 3 (Compulsion):** Alliance commitment was voluntary. No external gun to head. Compulsion defense fails.
  *   **Step 4 (Ignorance):** State A knew State B had territorial grievances. Risk was foreseeable. Ignorance defense fails.
  *   **Step 5 (Apportionment):** State A did not fire the first shot, but enabled it. Baseline 40%. State B (Initiator) Baseline 60%.
  **Finding:** **Liable for 40% of assessed contribution.**
  **Rationale:** Encouraging a risk you know exists creates liability for the outcome.

  #### CASE 2: THE DUAL-USE SUPPLIER (Hypothetical)
  **Facts:** State C companies sell precision guidance chips to State D via a civilian intermediary. State D uses them in missiles against civilians. State C claims it didn't know the end-use.
  **Procedure Run:**
  *   **Step 1 (Unit):** State C is responsible for regulating its exporters.
  *   **Step 2 (Causation):** Chips were necessary for the missiles. Substantial Factor met.
  *   **Step 3 (Compulsion):** Economic gain is not compulsion. Defense fails.
  *   **Step 4 (Ignorance):** *Critical Step.* Were the chips military-grade? Was the intermediary known to be a front?
      *   *Scenario A:* Chips are commercial grade, intermediary is reputable. Ignorance defense succeeds. **No Liability.**
      *   *Scenario B:* Chips are restricted tech, intermediary is a shell company in a tax haven. A "Reasonable State" would have inquired. Culpable Ignorance. Defense fails.
  *   **Step 5 (Apportionment):** If Scenario B: Liability is low (remote contribution), approx 10%.
  **Finding:** **Liable (Scenario B only).**
  **Rationale:** Willful blindness in export control is an omission that brings about harm.

  #### CASE 3: THE WWI RECORD (Germany, 1914)
  **Facts:** Germany issues ultimatum to Russia; invades Belgium via Schlieffen Plan; claims mobilization timetables forced its hand; claims it was a defensive war.
  **Procedure Run:**
  *   **Step 1 (Unit):** German Empire (State continues as Federal Republic).
  *   **Step 2 (Causation):** German entry turned a regional conflict into a continental war. Substantial Factor met.
  *   **Step 3 (Compulsion):** Germany argues mobilization timetables compelled war.
      *   *Procedure Ruling:* Mobilization timetables are **Self-Created Constraint**. They were designed by the German General Staff over previous decades. This is not external compulsion. Defense fails.
  *   **Step 4 (Ignorance):** Germany argues it didn't know Britain would enter.
      *   *Procedure Ruling:* Violation of Belgian neutrality was known to carry British treaty obligations. A "Reasonable State" knew this. Culpable Ignorance/Recklessness. Defense fails.
  *   **Step 5 (Apportionment):** Germany initiated the western front and brought Britain in.
  **Finding:** **Liable for High Proportion (e.g., 60-70% shared with Austria-Hungary).**
  **Rationale:** Under the "Objective Foreseeability" framework, the "sleepwalking" defense is invalid. The state chose to build a strategy that required violating neutrality to succeed. That is a choice, not an accident.

  ---

  ### 5. BOARD INSTRUCTIONS & RISK MANAGEMENT

  **For the Junior Researcher:**
  *   Do not attempt to determine "Guilt." Determine "Risk Creation."
  *   When you encounter a [JUDGMENT CALL], do not solve it. Document the two options and the evidence for each. Pass it to the Board.
  *   If evidence is missing (e.g., destroyed archives), rule in favor of the contributor on that specific point (Benefit of the Doubt).

  **For the Board:**
  *   Your role is to validate the Judgment Calls, not re-run the history.
  *   **The WWI Trap:** You will be tempted to adjust Case 3 to be more "balanced" historically. Do not do this unless you change the Procedure. If you adjust the finding without changing the rule, you undermine the Fund's consistency.
  *   **The Insolvency Risk:** If you find too many contributors "Ignorant," the Fund raises no money. If you find too many "Liable," the Fund faces political boycott. The "Reasonable State" standard in Step 4 is your dial. Tighten it to collect more; loosen it to collect less.

  **Final Note:**
  This procedure chooses consistency over comfort. It assumes that states are adult actors responsible for the machines they build and the risks they foresee. If the Board wishes to operate on a principle of "Collective Sleepwalking," this procedure must be scrapped. If you wish to operate on "Accountable Agency," this is the machinery.
