answer: |-
  The archive room smelt of toner and slow decay. It was a windowless cupboard in the basement of Ouse Valley Water's headquarters, lined with boxes labelled by year and department. Sarah sat at a metal table, surrounded by the paper trail of a disaster. Four dead in Holloway. A gastrointestinal outbreak traced to Little Cray Works. The Crown Prosecution Service was waiting for her chronology.

  Her job was not to assign blame, but to map the flow of authority. Who knew what, when, and on whose instruction. She was a governance analyst, a sorter of minutes, a tracer of signatures. But after three months of reading shift handovers and memos, the boundary between the company and the people who comprised it had begun to blur.

  She picked up the file labelled *Operational Instructions: Seasonal Variations*. Inside was a document titled *SI-14: Raw Water Turbidity Protocols*. It had been issued annually for eleven years. Each version was identical, save for the date and the signature at the bottom. The operations staff called it 'The Relay'. Because no one held it for long. Each year, a different manager countersigned it, accepting the post and the instruction together.

  Sarah turned the pages. 2014. 2015. 2016. The signatures changed, but the ink remained the same blue. She turned to 2018. Her ninth year at the company. She was twenty-six then, a junior analyst eager to please. There it was. Her own signature, looping and confident, countersigning the instruction that would eventually tell a shift manager not to flush the system during a high-risk period. She had not known what she was joining. She had just signed where the line indicated.

  She needed to understand how the decision to maintain SI-14 had been sustained. She pulled the transcript of the Operations Committee meeting from March 2017.

  In the recording, the voices were distinct. There was a rhythm to their interruptions. When Mark, the engineering lead, said the filters were struggling, Diane, the quality manager, didn't wait for the chair to invite her; she slipped in, 'If we reduce flow, we can extend filter life,' and Mark immediately adjusted, 'Yes, but only if we bypass the secondary tank.' They were building a single structure of thought. If one stumbled, another caught the load. They used 'we' not as a polite fiction, but as a description of a single entity acting in the room. When they finished, they didn't just vote; they checked around the table to ensure everyone could live with the outcome. It sounded like a team.

  Sarah switched to the Board Minutes from November 2022. This was the meeting where the capital upgrade for Little Cray was deferred.

  The record showed three premises voted upon before the conclusion.
  Premise One: The risk of failure is low. (Passed 5-2).
  Premise Two: The cost of upgrade is prohibitive. (Passed 5-2).
  Premise Three: Regulatory guidelines permit deferral. (Passed 5-2).
  Conclusion: Defer the upgrade. (Passed 7-0).

  Sarah cross-referenced the individual voting records attached in the annex. Director A believed the risk was low and the cost high, but thought regulation forbade deferral. Director B believed risk was low and regulation allowed deferral, but thought the cost was manageable. Director C believed cost was high and regulation allowed deferral, but thought the risk was high. Every director had voted for the conclusion. Every premise had passed by majority. But no single director in the room believed all three premises were true. They had arrived at the same destination by different roads, and the minutes recorded the arrival as a unified judgement.

  Sarah rubbed her eyes. The prosecution would say this was the company's judgement. The defence would say it was arithmetic.

  There was a knock on the archive door. It opened to reveal Helen, the General Counsel. Helen was a woman who treated language like a contract. She leaned against the doorframe, holding a cardboard tray of sandwiches.

  "You've been down here six hours," Helen said. "You need to eat."

  "I'm looking at the voting matrix," Sarah said.

  "Don't," Helen said, stepping inside. "It's a trap. The company doesn't think, Sarah. People think. The company is a shell. A logo on a van. If someone went to prison, it would be a person, not a letterhead. You can't lock up a structure."

  Helen was right about the prison. The Act allowed for it, but in practice, culpability had to land on a head. But Sarah looked at the minutes. "They voted as a block."

  "They voted as individuals who happened to align," Helen corrected, taking a sandwich. "If Director A had known Director B's reasoning, she might have vetoed the whole thing. They didn't agree on the *why*. They just agreed on the *what*. That's not a mind. That's a tally."

  Sarah thought of the Operations transcript. That had felt like a mind. This felt like a calculation. But the law treated them the same.

  "Did you know," Helen said, crumbs on her lip, "that in the 2022 budget meeting, they spent forty minutes debating the colour of the new uniforms before discussing the filter replacement? They voted on the navy blue swatch unanimously. The upgrade they split."

  It was absurd, but it highlighted the friction. The uniform was tangible; the risk was abstract.

  Sarah needed to see the link between the paper and the dead. She pulled the Shift Log from Little Cray Works, dated the week of the outbreak.

  *14:00. Turbidity spike detected in inbound feed.*
  *14:15. Shift Manager J. Evans consults SI-14.*
  *14:20. SI-14 states: If outbound tests clear, do not flush. Flushing risks pressure drop.*
  *14:25. Outbound tests clear.*
  *14:30. Decision: Maintain pressure. Do not flush.*

  Evans had followed the procedure. He was conscientious. He had prioritised water pressure for the hospitals over the risk of contamination, because the instruction told him the risk was managed by the filters. The filters had failed. He had done exactly what he was told, and four people died because of it. He was a link in the chain, polished by procedure.

  Sarah felt a surge of anger, hot and sudden. She packed her files and went up to the second floor. She found Peter, the former Operations Director, now in a consultancy role, standing by the coffee machine. He had signed SI-14 in 2020.

  "You knew the filters were degraded," Sarah said. She hadn't planned to say it.

  Peter turned, holding a mug. "I knew what the reports said."

  "The reports were averaged. You knew the spikes were happening."

  "We managed the risk," Peter said.

  "You let us down," Sarah said.

  The words hung in the corridor. It wasn't *you let me down*. It was *us*. Peter stiffened. He looked around, as if checking for witnesses, but also as if checking for the existence of the 'us' she had invoked.

  "I did what was required," Peter said.

  "You were part of the team," Sarah said. "You signed the Relay. You knew what we were doing."

  "I didn't know you'd be here," Peter said, his voice dropping. "I didn't know who 'we' was."

  "You knew enough to rebuke me if I missed a deadline," Sarah said. "You claimed the authority of the department then. You can't claim the authority when it works and disown it when it breaks."

  Peter didn't answer. He couldn't say where her right to rebuke him came from. There was no contract between them. There was no law that gave her standing to judge his tenure. But they both felt the obligation. It lived in the space between them, in the shared history of the signature line. If they were just individuals, she was a stranger harassing a colleague. If they were parts of a single body, she was an immune system attacking a virus.

  Peter walked away without finishing his coffee.

  Sarah returned to the archive. She sat before the chronology. She had to submit a report that showed who decided what. If she wrote that the Board acted as a single agent, she validated the prosecution's theory of gross breach. If she wrote that they acted as seven individuals aggregating votes, she validated the defence's theory of no single guilty mind.

  She looked at her own signature from 2018. She had been twenty-six. She had wanted to be part of something. She had wanted to belong to the company. Now she wondered if she had simply joined a queue.

  She typed the final entry in the chronology.

  *Item 402: Board Resolution 22/11. Decision to defer upgrade. Authority: Board of Directors. Consensus: Recorded.*

  She didn't add a note about the voting matrix. She didn't add a note about the lack of shared belief. She let the minutes stand as they were. The document existed. The signatures were real. The deaths had happened.

  Sarah closed the file. The room was silent, save for the hum of the server rack next door. The company continued to exist, regardless of whether it was a person or a plot. The water continued to flow through the pipes, regardless of who intended it. She picked up her bag and turned off the light. The switch clicked with a finality that felt entirely individual, though the electricity belonged to the grid.

  ***

  **Note to Colleagues**

  This story is structured to remain neutral on the metaphysical status of the company, forcing the reader to supply their own theory of group agency to reach a verdict. The narrative leans towards the existence of a group agent in the Operations Committee (responsive joint action) but presents the Board as a mere aggregation (the discursive dilemma). The rebuke scene relies on the phenomenology of joint commitment—the felt entitlement to hold another accountable—which suggests a normative bond beyond individual contracts.

  If you believe the company *was* an agent capable of negligence, the events as described suffice: the Board's output functioned as a unified judgement despite internal fragmentation, and the 'Relay' created a continuous obligation across post-holders. To reach the opposite verdict (that only individuals are responsible), you would need to change the events themselves, not just their description. Specifically, you would need the Board minutes to record explicit dissents on the *conclusion* based on the conflicting premises, or the Operations team to show evidence of explicit coercion rather than responsiveness. Without those changes, the story preserves the ambiguity: the machinery of collective action operates regardless of whether we believe a 'ghost' inhabits the machine.
