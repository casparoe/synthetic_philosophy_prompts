answer: |-
  **Mutakallim:** You observe fire touch cotton and burning follow, and you call this cause and effect. I say you observe only conjunction. The connection is not necessary; it is habitual. God creates the burning at the occasion of the contact, in accordance with His prior habit. To claim necessity is to bind the Divine Will to created things.

  **Faylasuf:** If the connection is merely habitual, demonstration collapses. We do not merely count conjunctions; the intellect grasps that the form of fire entails heating. Without this necessity, science is memory, not knowledge. You reduce the world to a sequence of miracles, making the natures things speak of mere names.

  **Mutakallim:** You fear unintelligibility, but consider time. Bodies are atoms, accidents perish each instant. God recreates the world moment by moment. The habit is in God's will, not in things. I concede, however, that God could create in fire a power to burn, provided that power remains dependent on His will at every instant. Is this not your nature?

  **Faylasuf:** It is not. If the power depends on will at every instant, it is voluntary, not natural. I concede that the necessity I posit is never an object of the senses; sight sees contact and ash, not the tie. The intellect apprehends the tie through the essence. If God gave fire a power, that power would be its essence, not a borrowed garment recreated anew.

  **Mutakallim:** Then suppose God's habit reversed. Cotton consumes fire, bread wastes the eater, water inflames. On your view, is this impossible? On mine, it is merely contrary to custom. What makes the actual pairing natural rather than habitual? If you say essence, you assert a necessity you cannot show, for you have seen only what happens, not what must happen.

  **Faylasuf:** In that reversed world, the essences would differ. Fire would not be fire. Nature is not a label for what occurs, but the principle of motion within the thing. I concede further that natural causation is secondary and derivative, flowing from the First Cause. But a stream is truly wet, though the spring is the source. To deny the stream's wetness is to deny the spring's abundance.

  **Mutakallim:** A stream flows by gravity. Consider the hand. You will to raise it, it rises. On my account, God creates the willing and the rising. The act belongs to you by acquisition, *kasb*. You are the locus, not the creator. This preserves your agency without compromising His sovereignty.

  **Faylasuf:** This dissolves agency. If willing is merely accompanied by its object, you cannot separate an agent from a bystander who happens to will at the right moment. If I will and a stone moves, am I agent? No. The form of the agent must produce the effect. To deny production is to deny the difference between moving a hand and watching it move.

  **Mutakallim:** If the form produces the effect, what do secondary causes add to the divine act? Do they not demote God to a guarantor of what natures would accomplish in any case? Your necessity binds the First Agent. For your account to be correct, created essences would have to possess independence from the divine will sufficient to necessitate an effect. I hold they are too contingent to bind even themselves.

  **Faylasuf:** For your account to be correct, divine wisdom would have to be indifferent to the order of things, acting without regard for essences. I hold it is not, for chaos is not wisdom. God wills the effect through the cause, not instead of it.
