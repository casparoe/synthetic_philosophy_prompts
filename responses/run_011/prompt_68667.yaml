answer: |-
  # Q&A PREP SHEET: Moral Status Metrics Workshop

  **Context:** 25-min talk, 30-min discussion.
  **Audience:** Neuroanatomists, Welfare Scientists, Funder (Program Officer).
  **Tone:** Blunt. No fluff. No citations.

  ### UPFRONT CONCESSIONS (Say these in the talk to disarm critics)
  1.  **To the Funder:** Acknowledge immediately that a matrix is annoying for cost-effectiveness models. State clearly: *"I am not giving you a clean scalar because the biology doesn't support one. If you force a scalar, you are baking in a moral assumption, not measuring a biological fact."*
  2.  **To the Anatomists:** Admit the cerebellum point is an architectural hypothesis, not a settled fact. *"I am arguing that cerebellar density tracks motor prediction, not experiential content. If you have data showing cerebellar lesions alter affective state independent of motor control, I need to see it."*
  3.  **To Everyone:** Concede that "Subjecthood" is currently a black box. *"I am proposing a threshold, but I do not yet have a definitive assay for it. This is a research agenda, not a finished tool."*

  ---

  ### THE EIGHT OBJECTIONS (Ordered by Likelihood $\times$ Damage)

  #### 1. The Funder's Constraint (Likelihood: 100% | Damage: Critical)
  **Who:** Program Officer.
  **The Objection:** "I hear the matrix argument, but my model requires a weighting factor to compare interventions. If I can't put a number in the 'Moral Weight' column, I can't allocate capital. Are you saying this work is useless for prioritization, or can I derive a scalar from your matrix?"
  **The Reply:** "You can derive a scalar, but it must be risk-weighted, not absolute. Treat Subjecthood as a probability ($P$) and Bandwidth as the magnitude ($M$). Your weighting is $P \times M$. For a mammal, $P$ is near 1, so weight tracks bandwidth. For a shrimp, $P$ is uncertain (say 0.1), so even high bandwidth gets discounted. This preserves the matrix structure internally but outputs an expected value for your spreadsheet. The danger is treating $P$ as 1 for everything that moves."
  **Concede:** You cannot give them a definitive ranking without hiding uncertainty.
  **Weak Point:** If they ask how to calculate $P$ (probability of subjecthood) without arbitrary guessing, you are back to the Threshold measurement problem.

  #### 2. The Cerebellum Cherry-Pick (Likelihood: 90% | Damage: High)
  **Who:** Comparative Neuroanatomist.
  **The Objection:** "You're dismissing 80% of the neurons because they're in the cerebellum. That looks like moving the goalposts to fit your moral intuition. Cerebellar circuits handle prediction and timing; if experience is predictive processing, you've just excluded the engine because it doesn't look like the dashboard."
  **The Reply:** "It's not about morphology; it's about the 'unified representational space.' Cerebellar loops are modular and closed; they correct motor output without necessarily entering the global workspace where 'what it is like' is constituted. If you count cerebellar neurons, a mouse looks morally heavier than a primate. That contradicts every behavioral welfare metric we have. I'm arguing neuron count only works if you count neurons *in the system that integrates experience*, not just neurons period."
  **Concede:** We don't fully understand cerebellar contribution to cognition yet.
  **Weak Point:** You are assuming global workspace theory (or equivalent) is correct. If consciousness is distributed, your architectural commitment collapses.

  #### 3. The Threshold Assay (Likelihood: 85% | Damage: Critical)
  **Who:** Philosopher of Biology / Welfare Scientist.
  **The Objection:** "You say the Subjecthood Threshold is binary and architectural. Fine. What is the assay? How do I test a species and get a 'Yes/No'? If you can't measure it, it's not a scientific variable, it's a metaphysical claim."
  **The Reply:** "Currently, we use behavioral integration as a proxy—can the animal hold conflicting goals in mind simultaneously? But you're right, the neural marker is missing. The research goal is to find the minimal architecture for a unified point of view, likely involving specific thalamocortical or equivalent loops. Until then, treat the threshold as a Bayesian prior based on phylogeny, not a binary switch we can flip today."
  **Concede:** There is no current operational test for the threshold.
  **Weak Point:** This is the softest part of your theory. If you can't measure it, the 'matrix' has an empty axis.

  #### 4. The Shrimp Prioritization (Likelihood: 80% | Damage: High)
  **Who:** Welfare Scientist / Funder.
  **The Objection:** "If output is a matrix, how do I prioritize? If shrimp have low bandwidth but there are billions of them, does your model suggest I should save a billion shrimp over one cow? Your model seems to break standard prioritization logic."
  **The Reply:** "Total welfare is indeed Bandwidth $\times$ Subjecthood $\times$ Population. But because Subjecthood is a threshold, if shrimp fail the threshold, the value is zero regardless of population. If they pass, their low bandwidth means you need massive numbers to outweigh a cow. The matrix prevents you from assuming they pass just because they are numerous. It forces you to resolve the Subjecthood question before counting heads."
  **Concede:** This creates counter-intuitive results if the threshold is set too low.
  **Weak Point:** If the threshold is fuzzy (which it is), the 'zero vs. non-zero' distinction is morally dangerous.

  #### 5. Behavioral Convergence (Likelihood: 70% | Damage: Medium)
  **Who:** Welfare Scientist.
  **The Objection:** "You're leaning hard on neuroanatomy. But we have judgement-bias and preference tests showing affect in species you might rank low. Why should I trust your architectural bandwidth over actual behavioral evidence of suffering?"
  **The Reply:** "Behavior tells you *that* they are suffering; bandwidth tells you *how much* is happening at once. A bee might show avoidance (suffering), but does it have the capacity for prolonged dread or complex frustration? Neuroanatomy caps the potential intensity that behavior can express. Use behavior to confirm the Subjecthood Threshold, use neuroanatomy to scale the Bandwidth."
  **Concede:** Behavioral data is more direct evidence of valence.
  **Weak Point:** If behavior shows complex affect in a small brain, your bandwidth metric looks elitist.

  #### 6. Phylogenetic Non-Independence (Likelihood: 60% | Damage: Medium)
  **Who:** Behavioral Ecologist.
  **The Objection:** "You're treating species as independent data points. But bandwidth traits are phylogenetically clustered. You're essentially reinventing allometry but calling it 'moral status.' How do you control for shared ancestry in your matrix?"
  **The Reply:** "I'm not ranking species; I'm ranking architectures. Phylogeny matters for predicting where the architecture appears, but the moral weight lies in the hardware itself, not the lineage. A convergent evolution of high-bandwidth architecture in an octopus counts the same as in a mammal. I agree you need phylogenetic controls to predict the metrics, but not to define them."
  **Concede:** Predicting metrics requires phylogenetic modeling.
  **Weak Point:** Hard to disentangle 'architecture' from 'lineage' empirically.

  #### 7. "EQ with Extra Steps" (Likelihood: 50% | Damage: Low)
  **Who:** Skeptical Neuroanatomist.
  **The Objection:** "Experiential Bandwidth sounds like Encephalization Quotient (EQ) but with more words. EQ failed because it didn't predict behavior. Why won't your bandwidth metric fail the same way?"
  **The Reply:** "EQ measures excess size relative to body mass. Bandwidth measures integration capacity relative to neural architecture. EQ correlates with ecological niche; Bandwidth correlates with the size of the representational space. One is about what the animal *does*, the other is about what the animal *contains*. They correlate, but they aren't the same dimension."
  **Concede:** They will correlate highly in mammals.
  **Weak Point:** If the correlation is 0.9, you haven't added much value over EQ.

  #### 8. Evolutionary Function (Likelihood: 40% | Damage: Low)
  **Who:** Evolutionary Biologist.
  **The Objection:** "Bandwidth evolves for foraging or social complexity, not for 'moral status.' You're re-purposing a functional trait for an ethical framework. Isn't that a category error?"
  **The Reply:** "It's only a category error if you think moral status requires a trait evolved *for* morality. Capacity for welfare is a side-effect of capacity for information processing. We don't ask if a heart was evolved to be transplanted before using it. We use the capacity that exists."
  **Concede:** The trait did not evolve for welfare.
  **Weak Point:** None, this is a strong defensive position.

  ---

  ### THE CRITICAL REPLY (For the Funder)
  **Must Land:** You must convince the Program Officer that using a **Risk-Weighted Scalar ($P \times M$)** is safer for their model than a false precision scalar.
  **Why:** If they reject the matrix, they reject the talk. If they accept the risk-weighted scalar, they can use your work without lying about the uncertainty.
  **Phrasing:** *"If you put a definitive '1.0' on a cow and '0.01' on a fish, you are making a philosophical claim disguised as data. If you put 'Probability of Subjecthood' as a variable, you allow your model to update as science improves. Don't bake the controversy into the constant."*

  ---

  ### THE FEAR QUESTION
  **The Question:** **"How is the Subjecthood Threshold falsifiable?"**
  **Why:** If you cannot specify what would prove a species *lacks* a point of view (other than "no brain"), the threshold is metaphysical. If it's metaphysical, the neuroanatomists will dismiss it as unscientific, and the funder can't use it for risk assessment.
  **Prep:** Do not say "We will find out." Say: *"Falsification comes from demonstrating complex integration without a unified architecture. If we find a species that passes all behavioral integration tests but lacks the specific neural loops I propose, my architectural hypothesis is wrong. But until then, the architectural constraint is the best prior we have."* (This is weak, but honest).

  ---

  ### STRATEGIC ADVICE
  *   **Don't bluff on the Cerebellum.** The anatomists in the room know the cell counts better than you. If you claim cerebellar neurons *never* contribute to experience, they will eat you. Claim they contribute to *timing/prediction* but likely not to the *unified field*. That's a defensible distinction.
  *   **Don't promise a Matrix Tool.** Don't offer to build the matrix for them. Offer the *framework*. If you promise a tool, you become a vendor. If you offer a framework, you remain a researcher.
  *   **Watch the Welfare Scientists.** They are your allies against the "Neuron Count Only" crowd, but they will turn on you if you imply behavior doesn't matter. Keep emphasizing: *Behavior confirms Subjecthood; Anatomy scales Bandwidth.*
