  **The Case: The Zombie Quorum Call**

  **Who:** Julian Vane, a backbench Member of Parliament.
  **To Whom:** The Speaker of the House and the assembled legislature.
  **Setting:** The National Assembly chamber, during the final reading of the "Infrastructure Acceleration Bill."
  **The Act:** Vane stands and loudly invokes Standing Order 42: "Mr. Speaker, I raise a Point of Order. There is no quorum. I demand a bell ring and a count."
  **The Procedure:** According to the written Standing Orders (the rulebook), if a member raises a quorum call, the Speaker *must* suspend voting, ring the division bells for five minutes, and count the members. If fewer than 50% are present, the vote is invalid.
  **The Context (The Staleness):** For the past three legislative sessions, the Majority Party has operated as a rubber stamp. While Standing Order 42 remains in the book, an unspoken convention has solidified: the Speaker never honors quorum calls from the opposition, the bells are never rung, and the vote proceeds immediately. The Opposition Party knows this; their whip has instructed them not to bother with quorum calls because "it doesn't work anymore." Vane, however, is a procedural purist and insists on the text. He is sincere. He is in the right place. He uses the exact words.
  **The Downstream:** The Speaker glances at Vane, says "There is clearly a quorum present," and immediately puts the question to a vote. The bill passes. No bell rings. No count is taken. The official record notes Vane's objection but registers no suspension of proceedings.

  **The Tension**

  A proponent of the "lapsed-performative" category would argue: Vane did everything right. The syntax was correct, the role was authorized, the intent was sincere, and the written rule exists. The act of *calling a quorum* was successfully performed. The failure lies entirely in the *uptake*—the Speaker and the Majority refused to honor the convention. The act happened, but it was rendered inert by a stale social reality.

  An Austinian purist would argue: This is a straightforward **misfire** (specifically an A-rule infelicity). The procedure was *not* "accepted and understood" in the requisite sense. A procedure is not just text in a book; it is a living convention. If the relevant community (the Assembly, the Speaker, the Whip system) no longer accepts that invoking Order 42 *stops the vote*, then the procedure to "stop the vote via Order 42" no longer exists. Vane tried to drive a car that has no engine.

  **The Verdict**

  The Austinian is right. This is a **misfire**, not a lapsed performative.

  **The Argument**

  The "lapsed-performative" theory relies on a category error: it treats the *utterance* as the act, and the *convention* as the downstream consequence. Austin's insight is that the convention *constitutes* the act. There is no separable "act" of calling a quorum that exists independently of the convention that gives it force.

  When Vane says "I demand a count," he is not performing a magic spell that *then* requires the world to react. He is exercising a power that is *lent* to him by the collective acceptance of the Assembly. If that collective acceptance has evaporated—if the Speaker, the Majority, and even his own Opposition colleagues treat the rule as a museum piece—then the power itself has vanished.

  To say the act was "performed but ignored" implies that Vane successfully *stopped the proceedings* in some metaphysical sense, even if the vote continued. But that is nonsense. What is a "quorum call" if not a mechanism that suspends proceedings? If the proceedings do not suspend, no quorum call occurred. Only the *sounds* of a quorum call occurred.

  Consider the analogy of a check. If I write you a check on a bank account I closed yesterday, I have not performed the act of "paying you" which then "failed to clear." I have performed the act of "writing a worthless piece of paper." The banking convention that gives the ink value was absent. Similarly, the parliamentary convention that gives Vane's words the power to halt the vote was absent.

  The "staleness" of the convention is not a post-act failure of uptake; it is a pre-act failure of existence. The procedure requires *current* acceptance, not just *historical* codification. Because the Assembly no longer accepts Order 42 as a binding constraint on their time, the procedure is void. Vane did not misfire the engine; he tried to start a car that had been scrapped. The act was null from the moment he opened his mouth.
