answer: |-
  ### I. A Taxonomy of Claims

  Before applying any filter, you must force the author (and yourself) to identify which "Church–Turing Thesis" is being targeted. Submissions frequently conflate these four distinct claims. Their epistemic statuses differ radically, and evidence against one does not touch the others.

  1.  **CTT-1 (The Logical/Effective Thesis):** *What can be effectively calculated by a human being following rules without insight is Turing-computable.*
      *   **Status:** Conceptual analysis / Stipulation. It fixes the meaning of "effective calculability."
      *   **Refutation Condition:** Nearly impossible. Requires showing a human can follow a finite rule to generate a non-Turing-computable sequence.
      *   **Common Error:** Treating this as an empirical claim about physics.

  2.  **CTT-2 (The Modest Physical Thesis):** *Any function physically computable by a realistic device (given noise, finite energy, finite time) is Turing-computable.*
      *   **Status:** Empirical claim, hostage to idealizations.
      *   **Refutation Condition:** A physical device that reliably outputs a non-Turing-computable function (e.g., the Halting function) within finite time and energy constraints.
      *   **Common Error:** Ignoring the "realistic" constraint (noise, measurement limits).

  3.  **CTT-3 (The Bold Physical Thesis):** *Every physical process whatsoever is simulable to arbitrary precision by a Turing machine.* (Sometimes called "Digital Physics".)
      *   **Status:** Strong empirical conjecture.
      *   **Refutation Condition:** A physical system whose evolution *cannot* be simulated by a TM, even if we cannot harness it for computation. (e.g., The wave equation result).
      *   **Common Error:** Confusing the *model's* behavior with *nature's* behavior.

  4.  **CTT-4 (The Complexity Claim):** *Efficiently computable means polynomial time (P) on a deterministic TM.*
      *   **Status:** Complexity conjecture (P vs NP, or P vs BQP).
      *   **Refutation Condition:** Showing a problem solvable in polynomial time on a physical device that requires super-polynomial time on a TM.
      *   **Common Error:** Claiming this refutes CTT-1 or CTT-2. It only refutes a claim about *efficiency*, not *computability*.

  ---

  ### II. The Triage Procedure (45–60 Minutes)

  **Instructions for the Referee:** Read the Abstract, Introduction, and Conclusion. Skim the Model/Method section. Do not verify proofs. Apply these gates sequentially. If a gate triggers a verdict, stop and write the justification.

  #### Gate 1: Claim Identification (10 Minutes)
  *   **Question:** Which CTT (1–4 above) does the abstract claim to refute?
  *   **Check:** Does the text conflate *speed* (complexity) with *computability*?
      *   *If the paper claims to refute CTT-1 or CTT-2 but only demonstrates a speedup (e.g., Grover's algorithm, analog parallelism):* **Verdict: Reject coupled with invitation to restate.**
      *   *Justification:* "The manuscript demonstrates a complexity separation (CTT-4), not a violation of computability limits (CTT-1/2). Please reframe the claim to address tractability rather than computability, or provide an argument for why this speedup implies access to non-computable functions."
      *   *If the claim is clearly about CTT-1, 2, or 3:* Proceed to Gate 2.

  #### Gate 2: The Input/Parameter Smuggling Check (10 Minutes)
  *   **Question:** Is the non-computability generated by the system's dynamics, or is it encoded in the initial conditions, inputs, or physical parameters?
  *   **Check:** Look for real-valued parameters (voltages, masses, coupling constants) that are set to specific values to enable the result.
      *   *If the non-computable output depends on setting a parameter to a non-computable number (e.g., setting a voltage to Chaitin's $\Omega$):* **Verdict: Desk Rejection.**
      *   *Justification:* "The model relies on encoding non-computable information into the initial parameters or inputs. This shifts the burden of non-computability from the dynamics to the setup, which does not constitute a physical refutation of the thesis."
      *   *If the parameters are computable (e.g., integers, rationals, standard constants):* Proceed to Gate 3.

  #### Gate 3: The Readout and Measurement Check (15 Minutes)
  *   **Question:** Is the claimed output available to an observer in finite time and at finite precision?
  *   **Check:** Does the author require distinguishing between two physical states that differ by less than the noise floor, or measuring a quantity to infinite precision?
      *   *If the author admits the value cannot be fully read out (e.g., "only 40 bits are accessible") but claims the 'underlying value' exists:* **Verdict: Desk Rejection.**
      *   *Justification:* "Physical computation requires the extraction of information. A value that exists mathematically but cannot be discriminated from its neighbors due to physical noise limits is not a computable output in the physical sense."
      *   *If the readout is discrete and robust (e.g., a detector clicks or doesn't):* Proceed to Gate 4.

  #### Gate 4: The Robustness and Model Check (15 Minutes)
  *   **Question:** Does the model rely on exact real arithmetic (BSS/Real-RAM) without addressing physical perturbation?
  *   **Check:** Search for phrases like "exact real numbers," "infinite precision," or "continuous state space" without a corresponding error analysis.
      *   *If the result vanishes under arbitrarily small perturbations (structural instability) or assumes exact real arithmetic as a physical given:* **Verdict: Desk Rejection.**
      *   *Justification:* "The result depends on the idealization of exact real arithmetic. Without an analysis of stability under perturbation or noise, the model does not describe a physically realizable computation."
      *   *Exception:* If the paper is purely about the mathematical properties of a physical *model* (CTT-3) rather than building a hypercomputer (CTT-2), proceed to Gate 5.

  #### Gate 5: Significance and Escalation (10 Minutes)
  *   **Question:** If the argument succeeded, would it refute the specific CTT identified in Gate 1, and does it rely on contested physics (e.g., General Relativity, Quantum Gravity)?
  *   **Check:** Is the mechanism standard (electrical, optical) or exotic (spacetime singularities, closed timelike curves)?
      *   *If the physics is standard and the argument passes Gates 1–4:* **Verdict: Ordinary External Review.**
      *   *If the physics is exotic (e.g., Malament-Hogarth spacetimes) and the math is consistent:* **Verdict: Escalation to Specialist.**
      *   *Brief for Specialist:* "Author claims [CTT Version] refutation via [Physical Mechanism]. Math appears consistent within [Theory X]. Requires adjudication on whether [Theory X] permits this mechanism in physically realistic regimes (e.g., stability, quantum effects)."
      *   *If the paper presents a known mathematical result (e.g., Pour-El & Richards) as a physical refutation without bridging the gap:* **Verdict: Desk Rejection.**
      *   *Justification:* "The manuscript cites a result regarding the computability of a mathematical model's solution. It does not argue why nature must instantiate this specific model to the exclusion of computable approximations, nor does it bridge the gap between model-uncomputability and physical hypercomputation."

  ---

  ### III. Forbidden Dismissals

  Do not use the following justifications. They are either question-begging or category errors that will invite valid appeals.

  1.  **"Infinite precision is physically impossible."**
      *   *Why:* This assumes the conclusion (CTT-2) is true to refute the claim that it is true. Instead, use Gate 3: "The readout mechanism does not demonstrate how the information is extracted within noise limits."
  2.  **"Turing defined computation, so you cannot go beyond it."**
      *   *Why:* This confuses CTT-1 (definition) with CTT-2 (physical claim). You can define "computation" however you like, but the author is claiming *physics* exceeds the Turing limit.
  3.  **"It's just a mathematical model."**
      *   *Why:* All physics is models. This is too vague. Use Gate 5: "The manuscript fails to argue why this specific model's uncomputability implies nature is uncomputable."
  4.  **"No one has built one yet."**
      *   *Why:* Possibility claims do not require existence proofs. Focus on whether the *principle* violates the thesis, not the engineering status.

  ---

  ### IV. Application to Case Studies

  #### Case 1: The Analog Chaitin's $\Omega$ Circuit
  *   **Verdict:** Desk Rejection.
  *   **Justification:** "The manuscript fails Gate 2 (Input Smuggling) and Gate 3 (Readout). The non-computable value ($\Omega$) is encoded in the physical parameter setting the voltage, not generated by the circuit's dynamics from computable inputs. Furthermore, the author concedes that only a finite number of bits are physically accessible; the claim that the 'underlying value' exists physically but cannot be measured renders it operationally meaningless for computation."
  *   **Judgment Call:** The distinction between a parameter being "set" vs. "emerging." Here it is clearly set, but in complex dynamical systems, this line can blur. The verdict rests on the author's concession regarding the 40-bit readout limit.

  #### Case 2: The Malament–Hogarth Spacetime
  *   **Verdict:** Escalation to Specialist (Relativist).
  *   **Justification:** "The manuscript passes Gates 1–4. It correctly identifies the Bold Physical CTT (CTT-3). The input is computable, the readout is defined within the geometry (observer meets signal), and the math is explicit. However, the physical plausibility of Malament-Hogarth spacetimes (stability, quantum gravity effects near the horizon) is outside the scope of standard triage. A specialist must adjudicate whether this solution is physically realizable or merely a mathematical artifact of Classical GR."
  *   **Judgment Call:** Whether "mathematically consistent within GR" is sufficient for "External Review" vs. "Escalation." Given the board's reluctance, Escalation is safer. The procedure cannot determine if GR allows this *in reality*, only *in theory*.

  #### Case 3: The Quantum Speedup Manuscript
  *   **Verdict:** Reject coupled with invitation to restate.
  *   **Justification:** "The manuscript fails Gate 1 (Claim Identification). The abstract claims a refutation of the Church–Turing Thesis (computability), but the body establishes only a polynomial-time separation (complexity). Quantum computing challenges CTT-4 (Efficiency), not CTT-1 or CTT-2 (Computability). We invite resubmission if the claim is reframed to address computational complexity rather than computability limits."
  *   **Judgment Call:** None. This is a categorical error. The verdict is mechanical based on the definition of terms.

  #### Case 4: The Pour-El & Richards Wave Equation
  *   **Verdict:** Desk Rejection.
  *   **Justification:** "The manuscript fails Gate 5 (Significance/Bridge). It presents a known mathematical result (uncomputable solutions from computable data in classical analysis) as a refutation of the Physical CTT without argument. A non-computable solution to a differential equation does not imply nature computes the non-computable; it implies the classical continuous model may be an idealization that breaks down at the limit. The author must argue why nature instantiates this specific model rather than a computable approximation."
  *   **Judgment Call:** Whether this warrants "External Review" to let a philosopher of physics make the bridge argument. However, since the prompt states it is presented "without further argument," the paper is incomplete as a refutation.

  ---

  ### V. Honest Assessment of Procedure Limitations

  You asked where this procedure will handle things badly. It will fail on **Case 2 (The Relativistic Submission)**, and it will likely cost you the goodwill you fear.

  Here is why: The procedure treats "Mathematical Consistency within a Theory" as a pass for Gate 4 (Robustness). Malament-Hogarth spacetimes are mathematically robust within Classical General Relativity. They do not rely on infinite precision in the same way analog circuits do; the geometry *itself* performs the "supertask." The procedure cannot distinguish between "Physically Possible according to Current Best Theory" and "Physically Instantiable in Our Universe."

  A relativist knows that MH spacetimes likely require infinite mass-energy, violate cosmic censorship, or are unstable under quantum perturbations. But a non-specialist referee running this procedure will see "Math checks out" and "Readout is defined" and pass it. You are forced to escalate it because the procedure cannot adjudicate the *physical reality* of the spacetime, only its *theoretical consistency*.

  Furthermore, the procedure cannot resolve the deeper philosophical vitiation you mentioned: whether the debate is meaningless because "computable" is being used incompatibly. If an author uses the BSS (Blum-Shub-Smale) definition of "computation over the reals," they are technically correct that they can compute more than a Turing Machine, but they are talking past the CTT which is defined over integers/strings. Gate 4 catches "Exact Real Arithmetic," but sophisticated authors will frame it as "Continuous Physical Dynamics." The procedure forces a choice, but it cannot force the author to admit they have changed the definition of the word "computation."

  Finally, the procedure assumes CTT-2 (Modest Physical) is the target. If an author is arguing for CTT-3 (Bold Physical), the "Readout" check (Gate 3) is less relevant (nature might compute it even if we can't read it). The procedure biases heavily against CTT-3 refutations because it demands operational readout. If your journal cares about the philosophy of mind or information, this bias might be appropriate. If it cares about fundamental physics, you may be desk-rejecting legitimate arguments about the uncomputability of nature's state evolution.

  Use this tool to save your time, but do not trust it to save your reputation on the relativistic cases. For those, the "Escalation" verdict is the only honest output, even if the specialist hates you for sending it.
