      *   *(1) & (5):* Tainter defines complexity structurally (hierarchy, information flow, etc.). (5) says problems are endogenous. Tainter implies complexity solves problems (diminishing returns). If problems are purely endogenous, does "loss of complexity" matter if the society redefines the problem? Tainter assumes complexity is generally beneficial until marginal returns drop. (5) suggests complexity is just *a* solution, not necessarily *the* metric of success.
      *   *(2) & (6):* (2) says it's not about whether life got worse. (6) implies relocation might be an *improvement*. This actually aligns well (collapse $\neq$ suffering), but (6) uses the *outcome* to dispute the *label*. If Maya are still here, did they lose sociopolitical complexity? Yes, the Classic Maya state collapsed. The *people* didn't vanish. This is a category error risk (State vs. People).
