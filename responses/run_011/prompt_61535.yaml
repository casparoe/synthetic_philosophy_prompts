          5.  Definition of Progress (or impossibility thereof).
      *   *Key Argument:* The friend is right that it's a criteria dispute, but wrong to call it "just taxonomy." The criteria are metaphysically loaded. The user is right that it's substantive, but wrong to think the *count* is the substance.
      *   *Specific Evidence:* Use *anupalabdhi* (absence) as the hammer. It shows the ontological commitment clearly. Nyāya needs real absences; Buddhists don't. That's why they count differently.
