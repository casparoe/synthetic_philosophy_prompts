          *   *Brazil:* Resistance to compelling teens/illiterate. Why? Paternalism regarding capacity.
      *   *Revelation:* The resistance reveals the existing arrangement is about **Boundary Maintenance** (Who is 'Us'?) rather than **Justice** (Who is affected?). The state protects the "Citizen" category as a privileged class of decision-makers, distinct from mere "Subjects."

  8.  **Drafting the Response (incorporating the Sedimentologist Persona):**
      *   *Tone:* Respectful, analytical, precise, using geological metaphors where appropriate but not overdoing it. Acknowledge the user's expertise.
