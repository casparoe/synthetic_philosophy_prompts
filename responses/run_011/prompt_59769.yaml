answer: |-
  You approach this as a stratigrapher approaches a outcrop: looking for the depositional environment that laid down these rules, rather than the weathering that has since softened their edges. Your table of observations is robust enough to support a reconstruction. I will treat the electoral codes as lithological data and attempt to core the implicit theory.

  ### I. The Implicit Theory: Voting as a Ritual of Membership

  The pattern you describe cannot be generated by a theory of voting as *epistemic* (finding the truth), nor as *purely rights-based* (exercising a freedom). If voting were a right, compulsion would be incoherent. If it were purely about accurate governance, the blank ballot would be discouraged as noise.

  The only conception that renders your three boundaries (attendance vs. choice, citizen vs. resident, 18 vs. 16) consistent is **Voting as a Census of the Body Politic.**

  On this theory, the primary function of the election is not to aggregate preferences, but to perform the existence of the state and delineate its members.
  1.  **Attendance vs. Choice:** The state requires the *presence* of the member to validate the ritual. The secret ballot and the tolerance of the informal vote (Australia) allow the *content* of the judgment to remain private, but the *act* of judgment must be public. This commits one to the view that the duty is **performative**, not **deliberative**. You are not obliged to decide; you are obliged to appear as a decider.
  2.  **Citizen vs. Resident:** The obligation attaches to *ownership*, not *occupancy*. A resident is a tenant; a citizen is a shareholder. The shareholder must attend the Annual General Meeting (AGM); the tenant need not. This rules out the theory that voting is a duty owed by those subject to coercion (tenants are coerced by law but not compelled to vote).
  3.  **18 vs. 16:** This boundary tracks **legal capacity**, not cognitive maturity. In almost all these jurisdictions, 18 is the age of full criminal and contractual liability. The state compels voting only from those it holds fully liable for their actions. The 16-year-old is granted the *right* (in Austria/Argentina) as a developmental concession, but not the *duty*, because they are not yet fully liable agents in the eyes of the law.

  **Rival Accounts Ruled Out:**
  *   **Voting as a Right/Power:** Ruled out by the existence of sanctions for non-attendance.
  *   **Voting as a Duty of the Subjected:** Ruled out by the non-compulsion of residents (NZ/Ireland) and the compulsion of citizens abroad (often required to vote even if unaffected by local laws).
  *   **Voting as Statistical Instrument:** Ruled out by the tolerance of the blank ballot. If the goal were a statistically representative *electorate*, a blank vote is data loss. If the goal is a representative *attendance*, it is a success.
  *   **Abstention as Protected Speech:** Explicitly ruled out by compulsory attendance. The system treats abstention as a failure of duty, not a speech act, unless that abstention is performed *inside* the booth (the blank ballot).

  ### II. Strict Requirements vs. Underdetermined Features

  To separate the load-bearing strata from the overburden:

  **Strictly Required by the Theory:**
  1.  **Compulsion of Attendance:** The state must be able to mandate presence to perform the census.
  2.  **Link to Legal Capacity:** The duty must align with the age of full legal liability (18).
  3.  **Link to Formal Membership:** The duty must align with citizenship, not mere residence.

  **Underdetermined (Comfortable but Contingent):**
  1.  **The Secret Ballot:** The theory requires attendance, not public declaration. A show of hands would satisfy the "census" model, but the secret ballot sits comfortably with liberal norms. It is a decorative layer.
  2.  **The Fine Amount:** Whether the sanction is $20 or $200 is irrelevant to the principle, provided it is sufficient to mark the act as obligatory.
  3.  **Optional Voting for Minors:** Allowing 16-year-olds to vote optionally (Brazil/Argentina) is a sedimentary layer deposited by rights-discourse that does not penetrate the bedrock of obligation. It could be removed without collapsing the compulsory structure for adults.

  ### III. The Unconformity: One Principle or Several?

  You ask if a single principle generates these boundaries. The evidence suggests an **unconformity**. We are looking at two incompatible principles deposited at different historical periods.

  **Bed 1 (Load-Bearing): The 19th-Century Nation-State.**
  *   *Principle:* The State is an association of Citizens. Voting is a duty of membership, akin to jury duty or military service.
  *   *Evidence:* Compulsion attaches to citizens, not residents. Compulsion attaches to adults (liable agents).
  *   *Status:* This is the load-bearing bed. If you remove the link between citizenship and obligation, the rationale for compulsion collapses into coercion of non-members.

  **Bed 2 (Decorative): The 20th-Century Rights Revolution.**
  *   *Principle:* Voting is a universal human right based on affected interests or maturity.
  *   *Evidence:* Lowering the age to 16 (optional). Allowing residents to vote (NZ/Ireland). Making voting optional for the illiterate/elderly (Brazil).
  *   *Status:* This is decorative. It softens the edges of Bed 1 but does not replace it. Note that where Bed 2 conflicts with Bed 1 (e.g., should residents be *compelled*?), Bed 1 wins. Residents may vote, but they are never *forced* to. This proves the "Right" layer is superficial; the "Duty" layer remains exclusive to citizens.

  The unconformity is visible where the two meet: the 16-year-old. They are granted the Right (Bed 2) but spared the Duty (Bed 1). This inconsistency is only resolvable if we acknowledge the two principles are distinct.

  ### IV. The Australian Blank Ballot: Bodies or Judgments?

  You ask if the tolerance of the blank paper implies the state wants bodies rather than judgments.

  **Yes.** The Australian system prioritizes the **legibility of the population** over the **quality of the decision**.

  If the appeal were strictly to "Civic Duty" in a deliberative sense, a blank ballot would be a breach of duty (a failure to decide). By accepting it as compliance, the state admits it requires the *ritual of participation* more than the *substance of the choice*.

  Does this undermine legitimacy?
  *   **The Civic Duty Claim:** Weakens. You cannot claim moral improvement through an act that permits moral nullification.
  *   **The Bias Mitigation Claim:** Strengthens. This is the tacit, structural reality. Voluntary systems produce electorates skewed by class, education, and age. Compulsory systems produce electorates that mirror the demography of the citizenry. The blank ballot allows the disillusioned to participate in the *demographic correction* without participating in the *political endorsement*. The state accepts the blank vote because a poor person standing in line is a greater threat to elite stability than a poor person staying home, even if that poor person votes for no one. It forces the marginalized to be counted, which alters the calculus of the parties regardless of the specific vote cast.

  ### V. The Hypothetical Shift: "All Subjected Must Vote"

  Suppose we replace the Membership Rule with the **Principle of Affected Interests** (All subject to coercive law must have a say + must exercise it).

  **Required Changes:**
  1.  **Australia:** Permanent residents (approx. 25% of the population) would become liable for compulsory voting. 16- and 17-year-olds (subject to criminal law) would become liable for compulsory voting.
  2.  **New Zealand:** Permanent residents currently vote voluntarily. Under this principle, they would be **compelled** to vote in national elections.
  3.  **Ireland:** Non-EU/British residents currently vote in locals only. They would be compelled to vote in locals, and compelled to vote in nationals (as they are subject to national law).
  4.  **Brazil:** 16- and 17-year-olds and the illiterate (currently optional) would become **compulsory** voters, as they are fully subject to the penal code.

  **The Resistance:**
  *   **Most Fiercely Resisted:** The compulsion of **non-citizen residents** (Australia/NZ/Ireland).
  *   **Why:** This would reveal that the existing arrangement is not about *democratic fairness* (ensuring all affected have a say), but about **Boundary Maintenance**.

  **What the Resistance Reveals:**
  If the state truly believed voting was a duty owed by those subject to coercion, it would compel residents. The fierce resistance to this idea reveals that compulsory voting is not a mechanism of **Justice**, but a mechanism of **Sovereignty**.

  It is a tool to define the *Demos*. By compelling only citizens, the state reinforces the distinction between the *People* (who rule) and the *Population* (who are ruled). To compel a non-citizen to vote would be to acknowledge them as a member of the sovereign body, which undermines the privilege of citizenship.

  Similarly, resistance to compelling 16-year-olds (even in Brazil) reveals that the "duty" is linked to **liability**, not **interest**. The state is willing to let the young be affected by law, but unwilling to treat them as fully responsible agents until they reach the age of criminal majority.

  **Conclusion:**
  Your core sample shows a formation where the lower bed is **Republican Citizenship** (voting as a duty of owners) and the upper bed is **Liberal Rights** (voting as a freedom of persons). The compulsory voting systems you study are Republican structures painted with Liberal trim. They function to stabilize the state by ensuring the "Owners" show up to the AGM, while allowing enough flexibility (blank ballots, optional teen voting) to prevent the ritual from becoming intolerable. The unconformity is real, and the load-bearing stratum is the exclusionary one: the duty belongs to the member, not the subject.
