      *   *Implication:* Legitimacy comes from *participation rates* (turnout), not *deliberative quality*.
      *   *Bias Claim:* Does it rest on "unequal turnout biases outcomes"? Yes, this is the pragmatic defense. If the poor don't vote, the rich rule. Compulsion forces the poor to show up. The blank ballot allows the disillusioned to show up without endorsing.
