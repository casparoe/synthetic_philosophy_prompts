      *   *Hypothesis:* Is it one principle?
      *   *Analysis:* The "Citizen Duty" principle explains the compulsion. The "Liberty Right" principle explains the secret ballot/blank vote. The "Capacity" principle explains the age limit. The "Residency" exception (NZ/Ireland) clashes with the "Citizen Duty" principle.
      *   *Verdict:* **Unconformity.** There are distinct layers.
      *   *Layer 1 (Load-Bearing):* **The State's Need for Legibility and Stability.** (The 19th-century liberal nation-state model). Citizens = Owners. Voting = Annual General Meeting of Owners.
