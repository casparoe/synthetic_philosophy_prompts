      *   *Why:* If the core were "all subjected," non-citizen residents would be compelled. They aren't. Therefore, the core is "membership/ownership," not "subjection."

  6.  **Part 4: The Australian Blank Ballot:**
      *   *Question:* Is it bodies vs. judgments?
