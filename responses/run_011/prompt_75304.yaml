answer: |-
  Here is the translation, the analysis of your pressure points, and the residue report.

  ### I. The Translation

  **1. Wimsatt and Beardsley (The Intentional Fallacy)**
  *Patent Equivalent:* **Objective Claim Construction under *Phillips v. AWH*.**
  In this regime, the claims are the public notice. The meaning is determined solely by how the Person Having Ordinary Skill In The Art (PHOSITA) would read the intrinsic evidence (claims, specification, prosecution history) as of the filing date. Evidence of the inventor's subjective, unrecorded intent (diaries, internal emails, testimony about what they "really meant") is inadmissible. The work (the patent) is public once published; its boundary is defined by the public record, not the private mind. The "death of the author" is codified as the exclusion of extrinsic evidence regarding subjective intent.

  **2. E.D. Hirsch (Validity in Interpretation)**
  *Patent Equivalent:* **The Specification as Lexicographer + The Filing Date Barrier.**
  Hirsch argues meaning is the author's willed type and is fixed at creation. In patent law, the inventor is their own lexicographer; the specification defines the terms. This meaning is fixed irrevocably at the filing date. Any subsequent evolution in how the technology is used, or how the language is understood by the public post-issuance, is not "meaning" (claim scope) but "significance" (commercial impact or later technological application). Hirsch's distinction between *meaning* (fixed) and *significance* (variable) maps cleanly to the distinction between *claim construction* (fixed at filing) and *doctrine of equivalents* (application to later-developed technology).

  **3. Alexander Nehamas (The Postulated Author)**
  *Patent Equivalent:* **The PHOSITA Construing the Specification.**
  Nehamas argues we construct an "author" implied by the text, rather than consulting the biographical person. In patent law, the PHOSITA is not a real person, nor is it the inventor. It is a hypothetical construct who reads the specification to infer the technical contribution. The PHOSITA reconstructs the inventor's intent *only as it is objectively manifested in the text*. We do not ask "Who was Mr. Edison?"; we ask "What would a skilled engineer understand Mr. Edison to have contributed based on this disclosure?" This is an objective reconstruction of a subjective act.

  ***

  ### II. The Pressure Points

  **1. Specification vs. Biography: Publicity, Reliance, or Quid Pro Quo?**
  You ask why the specification (inventor's account) is primary evidence while biography (diaries) is excluded, whereas criticism often excludes both.
  *Judgment:* This turns on **Quid Pro Quo**, not merely publicity.
  In patent law, the specification is admissible because it is the *price of the monopoly*. The inventor gets exclusion rights in exchange for teaching the public how to make and use the invention. The specification is the teaching. A diary is not part of the bargain. In literary criticism, the exclusion of biography (Wimsatt) is ontological (the text *is* the art); in patent law, the exclusion of extrinsic evidence is regulatory (the public *relied* on the register). The difference is that patent law treats the text as a deed, not a message. We admit the specification not because it reveals the "true" meaning, but because it is the only part of the inventor's intent that the competitor could have seen.

  **2. Doctrine of Equivalents (DOE) vs. Hirsch's Significance**
  Is DOE the same as Hirsch's "significance" (meaning fixed, application grows)?
  *Judgment:* **Different move, same clothes.**
  Hirsch's "significance" describes how a reader *relates* a fixed meaning to a new context (e.g., Shakespeare meaning X, but relevant to Y today). The Doctrine of Equivalents is not about how the public *uses* the patent; it is about expanding the *inventor's boundary* to cover insubstantial variations they did not literally claim. DOE prevents a competitor from stealing the invention by making a trivial change. It is an expansion of the *right*, not an expansion of the *context*. Hirsch protects the author's meaning from being changed by the reader; DOE protects the author's territory from being bypassed by the infringer. They look similar (fixed text, flexible application), but one is hermeneutic (Hirsch) and the other is proprietary (DOE).

  **3. Joint Inventors and the Assignee**
  How does the translation handle multiple authors and a non-writing owner?
  *Judgment:* **Patent law forces a legal fiction that criticism rejects.**
  Patent law treats the "Applicant" as a unitary legal agent. It does not care if Inventor A meant X and Inventor B meant Y; it cares what the *claims* say. The Assignee (owner) is irrelevant to construction; ownership is distinct from authorship. Literary criticism struggles with collective authorship because it seeks the *source* of meaning. Patent law bypasses the source by focusing on the *effect* (public notice). The translation holds here only because patent law deliberately sterilizes the "author" function. If you try to map the Assignee to a "Publisher" or "Critic," the analogy breaks. The Assignee owns the boundary, but they did not draw it. In criticism, the owner of the copyright does not determine the meaning of the text.

  ***

  ### III. The Residue Report

  You asked whether your field settled the debate, or if the mapping reveals a distortion. Here is the breakdown of what translates, what distorts, and what is missing.

  **1. What Translates Cleanly**
  *   **Temporal Fixation:** The concept that meaning/scope is locked at a specific moment (Filing Date / Creation) is robust in both fields.
  *   **The Hypothetical Reader:** The PHOSITA is a precise legal analogue to the "Ideal Reader" or "Implied Reader" in criticism. Both are constructs used to stabilize interpretation against the vagaries of actual readers.
  *   **Hierarchy of Evidence:** The preference for intrinsic evidence (text/spec) over extrinsic evidence (testimony/biography) is a shared heuristic for stability.

  **2. What Required Distortion**
  *   **Ambiguity:** In patent law, ambiguity is a defect (indefiniteness, 35 U.S.C. § 112). We strive to eliminate it. In literary criticism, ambiguity is often a feature (polysemy, irony). To make the translation work, I had to treat literary ambiguity as a problem to be solved (like a vague claim) rather than a quality to be explored.
  *   **The "One True Meaning":** *Markman* hearings assume there is one correct construction of a claim. Literary criticism generally accepts that multiple valid interpretations can coexist. I had to suppress the pluralistic nature of criticism to make it fit the binary logic of infringement (in/out).

  **3. What Has No Expression in Your Vocabulary**
  *   **The Aesthetic Function:** Patent law is instrumental. A patent is a tool for exclusion. A poem is not (necessarily) a tool for anything. Your vocabulary has no way to account for interpretation aimed at *appreciation* rather than *boundary-setting*.
  *   **The Death of the Author (Radical Version):** Barthes argued the author is dead and the reader is born. Patent law kills the author only to replace them with the PHOSITA, but the *Inventor* remains the central economic figure. You cannot map the idea that the text belongs entirely to the reader, because in patent law, the text belongs to the Inventor/Assignee.
  *   **Normative vs. Descriptive:** Patent claim construction is normative (how *ought* we read this to ensure fair notice?). Literary criticism is often descriptive (how *does* this text generate meaning?) or evaluative (is this *good*?). Your vocabulary assumes the goal is always to fix a boundary for reliance.

  **4. The Verdict on Your Hunch**
  Your hunch is **confused at the root**.

  You suspected your field ran the debate to ground and settled it institutionally. It did not. It **legislated** a settlement for a different purpose.

  Patent law did not solve the philosophical problem of intention; it bypassed it for the sake of economic efficiency. We exclude evidence of subjective intent not because we believe Wimsatt was philosophically correct that intent is inaccessible, but because we believe competitors need reliable notice. We fix meaning at the filing date not because Hirsch was right about ontology, but because we need a priority date for novelty.

  The literary debate is substantive because it asks: *What is the nature of meaning?*
  The patent debate is regulatory because it asks: *What is the fairest way to allocate property rights?*

  If you treat literary interpretation as a way of allocating something (rights, boundaries, reliance), you are distorting literature to fit law. The "Intentional Fallacy" is not a rule of evidence; it is a claim about the nature of art. "Claim Construction" is a rule of evidence; it is not a claim about the nature of language.

  **Conclusion:**
  The mapping works structurally because both fields deal with texts and readers. It fails teleologically because one field seeks **truth** (or plurality of truths) and the other seeks **certainty**. You have not found the solution to the literary debate in your case files; you have found a bureaucratic workaround that makes the debate irrelevant to your specific task. Do not mistake the workaround for a resolution.
