answer: |-
  This is a remarkable distillation of thirty-eight years of field intuition. You are right to be dissatisfied with Sunstein, and you are right that the standard "Wingspread" definition of the Precautionary Principle (PP) is useless to you. Wingspread treats uncertainty as a one-way ratchet: more uncertainty = more stoppage. Your experience tells you uncertainty is a vector: it has direction, magnitude, and a baseline to measure against.

  Your intuitions are not inconsistent; they are **multi-criteria**. You are implicitly weighing *reversibility*, *systemic function*, *baseline risk*, and *epistemic quality*. Standard PP collapses these into a single dimension ("uncertainty"), which is why it fails your caddisfly test and your reservoir test.

  Here is a principle constructed to match your verdicts, followed by the cost of simplifying it.

  ### The Principle of Proportional Precaution

  **Core Statement:** *Precautionary measures are required only when the uncertainty involves a plausible mechanism for systemic collapse, the cost of acquiring information is low relative to the risk, and the risk of inaction does not exceed the risk of action.*

  To make this usable for your board, we break it into four operational clauses. Each clause is forced by one of your specific cases.

  #### Clause 1: The Baseline Risk Condition
  **Statement:** *Precaution against an action is not warranted if the state of inaction presents a greater, more certain, or less reversible risk than the action itself.*
  **Forced by:** **The Invasive Weed.**
  **Why:** Standard PP treats "doing nothing" as the neutral baseline. Your experience knows that "doing nothing" is an active intervention with its own toxicity. If the weed kills the fishery (systemic collapse) and the herbicide has unknowns (potential collapse), you must compare the probabilities. If the weed is certain and the herbicide is speculative, precaution demands the herbicide.
  **Implication:** This prevents the principle from becoming a status-quo preservation tool.

  #### Clause 2: The Information Cost Condition
  **Statement:** *If the cost (time, money, ecological exposure) of resolving the uncertainty is small relative to the potential harm, action must be delayed until resolution. If the cost of resolution is prohibitive, decision must proceed based on mechanistic plausibility.*
  **Forced by:** **The Fungicide vs. The Second Chemical.**
  **Why:**
  *   **Fungicide:** Frog country + no amphibian data = high plausibility of harm. Cost of study = low (months/money). **Verdict: Wait.**
  *   **Second Chemical:** Thin data + 4 orders of magnitude below effect levels = low plausibility of harm. Even if data is thin, the *mechanism* suggests safety at those concentrations. Cost of further study > marginal risk reduction. **Verdict: Go.**
  **Implication:** This distinguishes between "we need to know" and "we can't afford to know." It kills the idea that *any* data gap triggers a veto.

  #### Clause 3: The Systemic Integrity Condition
  **Statement:** *Priority is given to preventing functional collapse of the system over preventing the loss of specific constituent elements, provided the system retains the capacity for recovery.*
  **Forced by:** **The Caddisfly vs. The Sterilizing Contaminant.**
  **Why:** This is your hardest sell to a conservation board, but it is ecologically robust.
  *   **Caddisfly:** Loss is irreversible (extinction), but it is localized. The *metapopulation* or regional function remains. The system absorbs the shock.
  *   **Sterilization:** Loss is reversible (30 years), but it is a functional collapse of the whole watershed. The system loses its processing capacity entirely.
  **Implication:** You value *resilience* (the ability of the watershed to function) over *preservation* (keeping every specific part intact). This clause explicitly permits localized extinction to prevent systemic paralysis.

  #### Clause 4: The De Minimis Mechanism Condition
  **Statement:** *Catastrophic risks with probabilities below a defined threshold (e.g., 1 in 10^6) need not trigger precaution unless the mechanism is known and certain.*
  **Forced by:** **The Anoxic Reservoir.**
  **Why:** A 1-in-10-million chance of catastrophe is engineering noise. If you stop every project with a non-zero chance of catastrophe, civilization halts. However, you noted you "could not defend the ten million with a straight face." This clause forces you to set a number.
  **Implication:** This prevents paralysis by low-probability fear-mongering. It requires the board to agree on a probability threshold (e.g., "We do not regulate risks below 1 in a million").

  ---

  ### The Cost of Simplicity

  You asked which verdicts you must give up if you want a simpler rule. The "Proportional Precaution" above has four clauses. If you want a one-sentence heuristic, you have to cut one.

  **Option A: The "No Regrets" Rule**
  *   *Rule:* "Only act if the cost of being wrong is less than the cost of waiting."
  *   *Sacrifice:* **The Caddisfly.** Under this rule, you cannot approve the diversion. The loss is permanent (infinite cost), and the benefit of the diversion is finite. To keep the Caddisfly verdict, you must accept the complex "Systemic Integrity" distinction (local loss < systemic collapse).
  *   *Best for:* Public relations. It sounds safe.

  **Option B: The "Mechanism First" Rule**
  *   *Rule:* "If the mechanism of harm is plausible, stop. If it is implausible, go."
  *   *Sacrifice:* **The Invasive Weed.** If the herbicide has "real unknowns," the mechanism is technically plausible. A simple mechanism rule might ban the herbicide, saving the weed. To save the fishery, you need the "Baseline Risk" clause to weigh the weed's mechanism against the herbicide's.
  *   *Best for:* Scientific rigor.

  **My Recommendation:** Do not simplify below the four clauses. The Caddisfly verdict is the most philosophically distinct thing you hold. It separates you from a preservationist and marks you as an ecologist. If you simplify enough to lose that, you lose your specific expertise.

  ---

  ### On Uncertainty: Parameter vs. Model

  You asked if the distinction between "wide confidence interval" and "no idea of mechanism" survives philosophical scrutiny. **Yes, it does.** It is the distinction between **Parameter Uncertainty** and **Model (or Structural) Uncertainty.**

  *   **Parameter Uncertainty:** We know the equation (the toxicological mechanism), but we don't know the exact value of the variables (the LC50). This is what you have with the "wide confidence interval." This is manageable with safety factors.
  *   **Model Uncertainty:** We don't know the equation. We don't know *how* the chemical interacts with the system. This is "no idea what the mechanism is."

  **Respectable Principle:** The Precautionary Principle applies primarily to **Model Uncertainty.**
  When you know the mechanism (Parameter Uncertainty), you can calculate risk. When you don't know the mechanism (Model Uncertainty), you cannot calculate risk, only hazard.
  *   **Your Intuition:** You were right to treat the Fungicide (Model Uncertainty regarding amphibians) differently from the Second Chemical (Parameter Uncertainty regarding concentration).
  *   **Board Language:** "We distinguish between *not knowing the number* and *not knowing the process.* Precaution applies to the process."

  ---

  ### The Substitution Case (Regrettable Substitution)

  This is the "Regrettable Substitution" problem, common in REACH (EU) and TSCA (US) regulation. Here is how the **Principle of Proportional Precaution** adjudicates it.

  **The Scenario:** Banned Chemical A. Substitute Chemical B (structural relative). No chronic data (8-10 years). Suspicion of shared mechanism.
  **The Conflict:** Waiting 8 years = 8 years of unregulated exposure if B is bad. Banning B = Loss of benefit if B is good.

  **The Verdict:**
  It depends entirely on the **Necessity of the Function** (Clause 1: Baseline Risk).

  1.  **If the chemical is for a critical function** (e.g., preventing a different disease, essential infrastructure):
      *   **Verdict:** **Conditional Registration.**
      *   **Mechanism:** Allow use *now*, but with a "Sunset Clause." The registration expires in 3 years unless interim biomonitoring shows no signal. The industry must fund the 8-year study, but they get to sell while studying.
      *   **Why:** The cost of inaction (no chemical) is high. The cost of information (8 years) is too high to wait, but we can buy *partial* information (3-year monitoring) to bridge the gap.

  2.  **If the chemical is for a non-critical function** (e.g., cosmetic pesticide, marginal yield increase):
      *   **Verdict:** **Stop.**
      *   **Mechanism:** The "Suspicion of shared mechanism" triggers Clause 2 (Information Cost) and Clause 4 (Plausibility). If the mechanism is structurally similar to a banned toxin, the *Model Uncertainty* is low (we suspect we know the model).
      *   **Why:** The cost of inaction (not having this specific convenience) is low. The cost of error (8 years of watershed exposure to a new toxin) is high.

  **Does stronger suspicion change the verdict?**
  Yes. If the suspicion moves from "structural relative" to "same mode of action class," you treat Chemical B as Chemical A. The **Plausibility Clause** overrides the **Information Cost Clause**. You do not need 8 years of data to ban a nerve agent; you ban it based on mechanism. If the structural similarity implies the same mode of action, the 8-year study is irrelevant; the verdict is immediate prohibition.

  ### Summary for the Board

  When you sit down with them, hand them this:

  1.  **We do not regulate uncertainty; we regulate plausible harm.** (Mechanism matters more than data volume).
  2.  **Inaction is a decision with risks.** (We weigh the risk of the chemical against the risk of the problem the chemical solves).
  3.  **System function trumps local presence.** (We prioritize keeping the watershed working over saving every single localized population if forced to choose).
  4.  **We ignore vanishingly small probabilities.** (We set a threshold for "catastrophe" below which we do not act).

  This keeps your caddisfly verdict, your weed verdict, and your fungicide verdict intact. It only asks you to set a number for the reservoir case, which is a policy decision, not a scientific one.
