  ### The Negotiator's Fairness Decision Tree

  **The Running Case:**
  *   **The Pot:** £900k.
  *   **Party A Walk-away:** £200k.
  *   **Party B Walk-away:** £100k.
  *   **The Surplus:** £600k (The amount to be divided above walk-aways).
  *   **The Constraint:** Any deal must give A ≥ £200k and B ≥ £100k.

  ---

  #### Node 1: The Efficiency Check
  **Question:** "Is the *only* thing that matters that the full £900k is spent productively, provided both sides clear their walk-away minimums? Or does the *specific split* of that £900k carry its own moral weight?"

  *   **Only the total matters:** → **Leaf: Maximise-the-Sum (Utilitarian)**
      *   *Logic:* You view the disagreement point as a hurdle, not a baseline for fairness. Any point on the line $A + B = 900$ is equally fair; the actual split is decided by power or politics, not principle.
  *   **The split matters:** → Go to **Node 2**.

  #### Node 2: The Nature of the Walk-Away
  **Question:** "Are the £200k/£100k walk-away numbers hard facts of the world (e.g., statutory minimums, unavoidable costs) OR are they tactical positions the parties manufactured by threatening to walk?"

  *   **Tactical Positions:** → **Leaf: Strategic Bargaining (Nash Demand View)**
      *   *Logic:* You believe the disagreement point isn't neutral. It's a choice. The 'fair' outcome is the equilibrium of the threat game. If A could have threatened harder to lower B's walk-away, the current split is just a reflection of past bluffing. This leaves the standard axiomatic tree.
  *   **Hard Facts:** → Go to **Node 3**.

  #### Node 3: The Convexity Check (Lotteries)
  **Question:** "If you can't agree on a deterministic split, is it legitimate to settle by lottery (e.g., a 50% chance A gets the whole £900k, 50% B gets it) to smooth out the value?"

  *   **No (Deterministic Only):** → **Leaf: Leximin (Rawlsian)**
      *   *Logic:* You reject randomization (perhaps due to accountability rules or risk aversion). Without the ability to convexify the set via lotteries, you default to maximizing the minimum *final* budget.
      *   *Result in this case:* You ignore the surplus and equalize final totals. A gets **£450k**, B gets **£450k**. (Note: This violates the 'gains' logic but satisfies 'levels').
  *   **Yes (Lotteries Allowed):** → Go to **Node 4**.

  #### Node 4: The Pot Expansion Test (Monotonicity)
  **Question:** "Imagine the pot grows to £1.1m, but the extra £200k is a grant *only A is allowed to spend*. A's maximum possible take rises, but B's maximum stays the same. In the new deal, does B's allocation increase?"

  *   **No (B stays at £400k):** → Go to **Node 5**.
      *   *Logic:* You satisfy *Independence of Irrelevant Alternatives (IIA)*. Just because A *could* get more doesn't change the fairness of the claim on the original surplus.
  *   **Yes (B gets more than £400k):** → **Leaf: Kalai–Smorodinsky / Equal-Concessions**
      *   *Logic:* You satisfy *Resource Monotonicity*. If the pie grows, even if only one side can technically reach the new crust, the other side should benefit from the improved environment.
      *   *Note:* In standard theory, Equal-Concessions (splitting the sacrifice from the ideal point equally) is mathematically equivalent to Kalai–Smorodinsky in this 2-player convex case.

  #### Node 5: The Risk & Scale Check
  **Question:** "If Party A is under much higher pressure to sign (more risk-averse) than Party B, does that pressure reduce A's share of the surplus? OR, if we changed the currency (e.g., measured in 'utils' instead of pounds), would the split change?"

  *   **Yes (Pressure/Scale changes the split):** → **Leaf: Equal-Gains Egalitarian**
      *   *Logic:* You care about equalizing the *gain* (£300k each) regardless of risk posture or utility scaling. You treat the currency as the utility.
      *   *Result in this case:* A gets **£500k**, B gets **£400k**.
  *   **No (Split depends on risk/scale):** → **Leaf: Nash Bargaining Solution (Axiomatic)**
      *   *Logic:* You maximize the *product* of the gains. You are sensitive to risk aversion and utility scaling.
      *   *Result in this case:* On this specific linear example, you land on **£500k / £400k** (same as Equal-Gains), but your *reasoning* diverges if the frontier curves or risk profiles differ.

  ---

  ### Housekeeping & Diagnostics

  #### 1. Empty or Unoccupied Combinations
  The tree structure creates logical paths that no standard principle occupies. Here is the status of the "dead ends":

  *   **"Tactical Walk-Away" + "Leximin":** *Incoherent.* If walk-aways are tactical threats, you are in a non-cooperative game setting. Leximin is a cooperative axiom that requires a fixed, neutral disagreement point to define "worst-off."
  *   **"No Lotteries" + "Pot Expansion (Yes)":** *Unattractive/Neglected.* If you reject lotteries (non-convex set), standard monotonic solutions like Kalai-Smorodinsky often fail to exist or become unstable. While you *could* hold this view, no major named principle champions non-convex monotonicity without resorting to Leximin.
  *   **"Maximise-the-Sum" + "Walk-Away Determines Split":** *Incoherent.* If the walk-away point determines the specific split (e.g., via gains), you are no longer a pure Sum-Maximizer. Sum-Maximizers only care about the frontier, not the path to it.

  #### 2. Indistinguishable Leaves (The £900k Problem)
  You are **correct** that in this specific example (linear frontier, transferable utility), **Nash**, **Kalai–Smorodinsky**, and **Equal-Gains** all land on the exact same numbers: **A £500k / B £400k**.

  *   **Why:** On a straight line ($x_A + x_B = C$), the point that maximizes the product of gains (Nash) is the midpoint of the surplus. The point that equalizes gains (Egalitarian) is also the midpoint. The point that equalizes proportional concessions (KS) is *also* the midpoint because the ideal gains are symmetric (£600k each).
  *   **The Smallest Change to Separate Them:** You must break the **linearity of the frontier**.
      *   *Change:* Introduce diminishing returns. Suppose spending £1 on A generates £1 value, but spending £1 on B generates only £0.90 value (or vice versa). The feasible set becomes a curve (concave).
      *   *Result:* **Nash** will shift toward the party with the steeper marginal utility (risk sensitivity). **Equal-Gains** will stay focused on the monetary surplus split. **Kalai-Smorodinsky** will shift based on the new ideal points defined by the curve.
      *   *Alternative:* Keep the line but change the **Pot Expansion** scenario. This is why Node 4 exists. The *numbers* in the base case don't separate them, but the *answer to Node 4* does.

  #### 3. Equal-Concessions vs. Kalai-Smorodinsky
  In the 2-player convex case, **Equal-Concessions is KS in disguise.** They are extensionally equivalent. I have grouped them in the tree. They only separate if you introduce more than two players or non-convexities, where "equalizing concessions" becomes ambiguous but the KS monotonic path remains defined.

  ---

  ### Confidence & Weakest Node

  **Confidence Level:** **85%**.
  The theory is robust, but mapping practitioner intuition to axiomatic bargaining theory always involves translation loss. The tree accurately reflects the mathematical distinctions, but negotiators often hold hybrid views (e.g., "KS mostly, but Nash if risk is high").

  **The Weakest Node:** **Node 3 (Convexity/Lotteries)**.
  *   *Reason:* In local authority and charity contexts, "randomizing the budget" (flipping a coin for the whole £900k) is almost never a legitimate option due to audit, statutory, and accountability constraints. Practitioners will almost always answer "No."
  *   *Consequence:* This pushes almost everyone down the **Leximin** branch, even if their actual intuition is Nash or KS. They reject the *method* (lotteries) but not the *principle* (efficiency/convexity).
  *   *Fix:* In the workshop, rephrase this node to: *"If the split must be deterministic, do you prioritize equalizing the final budget levels (Leximin) or do you accept unequal levels to preserve the surplus division logic (Nash/KS)?"* This captures the diagnostic work without relying on an unrealistic lottery option.
