prompt: |-
  I've gone down a rabbit hole this winter and I could use someone to actually argue with me about it. I fix HVAC systems, no philosophy training at all, but my sister got me onto a history-of-science podcast and I ended up reading a bunch of wikipedia at 1am about Newton's religion, which I honestly didn't know anything about before. What I've pieced together: he was privately an anti-Trinitarian his whole adult life, wrote an enormous amount of theology and prophecy interpretation (way more words than the physics, I think), and basically never let any of it near a printing press. When he got the Lucasian chair at Cambridge the job normally would have meant taking holy orders, and he ended up with a royal exemption from Charles II that freed the chair from that requirement permanently — and I'm fuzzy on how much of the heresy he'd already worked out by then, I think people disagree. Later on there was an act of parliament right around 1700 that made denying the Trinity cost you any office or position of trust, with jail for a second offence, though from what I read it was almost never actually used in a courtroom, so the real danger was more like career and reputation than a cell. The bit that stuck with me: the guy who took over the chair after Newton, Whiston, got chucked out of Cambridge in like 1710 for publishing exactly the sort of views Newton had kept in a drawer, and my understanding is Newton didn't do much to help him. And Newton's own big manuscript arguing that a couple of scripture verses used to support the Trinity (the one in 1 John about the three that bear record in heaven) were later insertions — that only got printed decades after he was dead.

  So here's what I want: run Newton's concealment career through Clifford's ethics of belief. I've read enough to know the shape of it — the shipowner who talks himself into believing his emigrant ship is seaworthy, the idea that you must proportion belief to evidence, and the part where he says our beliefs aren't private property but something held in common that we pass on to everyone else. Be disciplined about the mapping before you judge him, because I keep sliding around on this: what exactly is the act under evaluation? Forming the heretical belief, writing it down, not publishing it, still showing up at chapel and taking communion, accepting a job whose exemption he engineered? Those feel like morally different things and I want them separated rather than lumped into "he hid his views." Then tell me whether Clifford actually condemns Newton. My suspicion is that he doesn't, or at least not for the reason everyone assumes, because Newton's textual work looks like a textbook case of the patient evidence-chasing Clifford praises — he was right about that 1 John verse, basically everyone agrees now — which would make the single most evidentially scrupulous believer of his century also its most accomplished concealer. That looks like a hole in the theory to me: Clifford seems to have norms about acquiring and about propagating belief (don't be credulous, don't infect others), but nothing about the person who does the epistemic work correctly and then sits on the result for forty years. So say where the theory goes silent, and what would have to be added to reach a verdict — is there a seperate duty of testimony, a duty to say what you concluded, and would it bind even when the cost is your livelihood and possibly your freedom?

  While you're at it, work in James's side of that old argument, the bit about options that are living, forced and momentous licensing a passional choice. Does it get any grip on Newton at all, or is it aimed at a different kind of case — someone deciding whether to believe in the first place, rather than someone who's already convinced and is deciding whether to speak? I think James might be doing nothing here except supplying a polite excuse, but make the case either way. And then use Whiston as the control case, since he's the same beliefs with the opposite choice: what does each lens say he should have done, what does his ruin tell us about how much Newton's silence actually cost other people (did Newton's silence make things worse for people like Whiston, or just spare one man a beating?), and does the Newton/Whiston pair end up confirming Clifford, embarrassing him, or revealing that both men were arguing about a question — how much evidence do you need before you're allowed to hold a belief — that was never the question Newton faced? Finally, please flag anything in my summary above that you think is wrong or too confident, because I got it all from podcasts and late-night browsing and I'd rather know.
