      Regarding your question about what makes the endlessness objectionable, the agreed account hinges on explanatory priority. A regress is vicious if the existence or truth of the starting point depends on the completion of the chain. If A requires B to exist, and B requires C, and so on forever, A never exists. This is the case in the metaphysical bundle theory. A regress is benign if the chain is merely conceptual or analytical. If I explain a word by defining it with other words, and define those with more words, I am not preventing the first word from having meaning, provided the language game as a whole works. In your graph, the reified node does not depend on a further node to exist in the database; it exists because you inserted it. The question of what holds it together is a question about your modeling schema, not about the data's existence. Therefore, the endlessness is only objectionable if you claim your model is a perfect isomorphic mirror of reality. If you claim it is a tool for tracking logistics, the regress is irrelevant.

