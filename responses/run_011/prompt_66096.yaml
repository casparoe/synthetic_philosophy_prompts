      You have indeed run into a very old wall, and you are right to suspect it has a name, though it wears a few different masks depending on which room of the house of knowledge you are standing in. The canonical name for the metaphysical version of this problem is Bradley's Regress, named after the idealist philosopher F. H. Bradley, who used it to argue that relations are unintelligible and therefore reality must be a single unified whole. In the philosophy of language and logic, the same structural problem is called the Unity of the Proposition, which asks exactly what you asked about sentences: what transforms a list of names and predicates into a claim that can be true or false. Your intuition that these are instances of a single pattern is correct; they are structurally isomorphic. They all arise from the attempt to analyze a complex whole into constituent parts and then explain the cohesion of those parts by introducing another part, which inevitably requires its own cohesion, launching the infinite regress you described.

      However, while the structure is identical, the stakes differ significantly between your cases, and this difference determines whether the regress is a fatal flaw or a manageable feature. In the metaphysics case regarding objects and properties, the regress is usually considered vicious because the aim is to explain the very existence of the object. If an object is just a bundle of properties, and those properties require a further relation of co-instantiation to be bundled, and that relation requires another, then the object never actually gets constituted; the explanation is never completed, so the thing itself cannot exist. This is why the metaphysician's attempt to stop by saying co-instantiation is not a further relation is not merely a decision to stop asking, but a necessary philosophical move to avoid ontological collapse. They are asserting that the tying is internal or brute, not a separate entity. In your knowledge graph case, however, you are not trying to explain the existence of the shipment in reality, but rather modeling information about it for retrieval and reasoning. Here, the regress is benign because the nodes and edges are representational tools, not ontological constituents. The delay situation exists as a node because you decided to model it that way, not because the universe requires a node to hold the delay together.

