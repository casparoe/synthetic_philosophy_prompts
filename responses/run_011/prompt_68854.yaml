answer: |-
  Here is the specification of desiderata for a rigorous comparison of diet-induced animal harm, followed by the analysis of ranking overturns and incompatible requirements.

  ### Part I: The Desiderata of Animal-Harm Accounting

  An adequate account must satisfy the following five requirements. For each, I provide the motivating case and classify the requirement as either **Non-Negotiable** (necessary for the calculus to guide individual choice validly) or **Camp Preference** (dependent on specific normative ethical frameworks).

  #### 1. The Principle of Marginality
  *   **Specification:** The account must measure the *marginal* impact of one individual's dietary shift, not the *average* harm per unit of current production. It must model supply-chain elasticity (e.g., if I buy one less chicken, does one less chicken get hatched, or does the price drop slightly and someone else buy it?).
  *   **Motivating Case:** If the meat market is inelastic in the short term, an individual refusing beef may not save a cow but merely lower the market price, transferring consumption to another buyer. Conversely, threshold effects in supply chains (e.g., a container load) mean marginal impact is non-linear. Using average harm (e.g., "1 cow per 200kg beef") overstates or understates individual agency.
  *   **Status:** **Non-Negotiable.** Without this, the calculation describes the industry, not the agent's choice.

  #### 2. The Life-Cycle Distinction (Suffering vs. Deprivation)
  *   **Specification:** The account must separate the harm of *living* (net negative experiences during the lifespan) from the harm of *dying* (deprivation of future positive experiences). It must not collapse the number of deaths with the quality of the life cut short.
  *   **Motivating Case:** A broiler chicken lives ~45 days in high confinement; a pasture-fed cow lives ~2 years. Killing the cow deprives more future life, but the chicken's life may contain higher intensity suffering per day. A count of "deaths" alone favors the cow; a count of "suffering days" may favor the chicken.
  *   **Status:** **Non-Negotiable.** Collapsing these renders the metric conceptually incoherent (confusing existence with experience).

  #### 3. The Species-Weighting Commitment
  *   **Specification:** The account must explicitly state the moral weight assigned to the neural capacity of different species. It must define the exchange rate between a day of chicken suffering, a day of cow suffering, and a day of wild rodent suffering.
  *   **Motivating Case:** If a cow has higher cognitive capacity than a chicken, its death may be a greater loss, but if a chicken has a higher density of nociceptors or stress response, its daily suffering may be more intense. Assuming all "animal days" are equal is an empirical and normative assumption that must be exposed.
  *   **Status:** **Camp Preference.** (e.g., Utilitarians may weight by neural complexity; Rights theorists may view killing any sentient being as an absolute violation regardless of capacity).

  #### 4. The Wild Animal Constraint
  *   **Specification:** The account must include harms inflicted on wild animals by the land use required for the diet. This includes field animals (mice, voles, insects) killed during crop harvest/plant protection for plant-based diets, and wild herbivores displaced or culled to maintain grazing land for beef.
  *   **Motivating Case:** Plant-based diets generally require more arable land per calorie than grazing diets (on non-arable land). Intensive cropping involves mechanical harvesting, pesticides, and habitat clearance that kill small wild animals. Ignoring this assumes wild lives have zero moral weight or that crop land is sterile.
  *   **Status:** **Empirical Constraint (Non-Negotiable to include); Valuation (Camp Preference).** You must *count* them, but how you *value* their lives (net negative vs. net positive) is normative.

  #### 5. The Counterfactual Existence Clause
  *   **Specification:** The account must state whether bringing an animal into existence is a harm, a benefit, or neutral, contingent on the quality of that life.
  *   **Motivating Case:** If a pasture-raised cow has a life worth living (net positive welfare), does eating it create a demand that brings a cow into existence (a benefit) only to kill it (a harm)? Or is the killing the only moral event? If the life is net negative (factory farm), existence is a harm.
  *   **Status:** **Camp Preference.** (Total Utilitarianism vs. Negative Utilitarianism vs. Person-Affecting Views).

  ---

  ### Part II: The Ranking Overturner

  **The Requirement:** **The Wild Animal Constraint (Requirement #4).**

  **Why it overturns usual rankings:**
  Standard intuition and most mainstream LCA (Life Cycle Assessment) rankings order diets by harm as: **Beef > Chicken > Plant-Based.** This is driven by greenhouse gas emissions, land use efficiency, and the visible suffering of large farmed animals.

  However, if one consistently applies the Wild Animal Constraint, specifically under the **Negative Utilitarian** assumption (that wild animal lives are, on average, net negative due to predation, starvation, and disease), the ranking can invert.
  1.  **Plant-Based:** Requires high-intensity cropping. This kills massive numbers of small wild animals (field mice, insects) per hectare. If these lives are net negative, cropping creates suffering.
  2.  **Beef (Grazing):** Can be produced on marginal land unsuitable for crops. Grazing may support lower densities of wild animals than intensive cropping, or displace wild herbivores who would otherwise suffer high mortality rates.
  3.  **Result:** Under specific empirical estimates (e.g., high field-mice mortality per hectare) and specific normative weights (wild suffering matters significantly), a strict plant-based diet could theoretically generate *more* net animal suffering than a diet based on ruminant grazing on non-arable land.

  This requirement is the most disruptive because it challenges the foundational axiom of the "vegetarian/vegan solution": that removing animals from the food system removes animal harm. It posits that the *agricultural system itself* is a predator, regardless of whether it harvests plants or animals.

  ---

  ### Part III: The Incompatibility Thesis

  **Your Suspicion:** *Demanding robustness to uncertainty about wild animal populations conflicts with demanding that the calculus represent harms in proportion to their true scale.*

  **Verdict:** **The suspicion survives scrutiny.** These two requirements cannot be jointly satisfied in practice, creating a "Decision-Theoretic Trap."

  **The Analysis:**
  1.  **Proportional Scale (Accuracy):** To represent harm in proportion to its true scale, you must include all categories of harm weighted by their expected magnitude. Current estimates for wild animals killed per hectare of cropping vary by **orders of magnitude** (from negligible to massive, depending on whether you count insects, rodents, or only large mammals). If the true number is at the high end, wild animal harm dwarfs farmed animal harm. To be proportional, you must input the *Expected Value* of these estimates into the calculus.
  2.  **Robustness to Uncertainty:** To be robust, a model should not yield wildly different recommendations based on volatile inputs. A robust decision rule (like *minimax regret* or *confidence-weighted expected utility*) would discount variables with high variance. Because the wild animal data has extreme variance (low epistemic confidence), a robust model would effectively treat this variable as noise or zero it out to avoid making a life-altering decision on shaky data.
  3.  **The Conflict:**
      *   If you prioritize **Scale**, you must let the high-variance wild animal data drive the conclusion. This makes the dietary recommendation *fragile* (a new study on mouse populations flips the verdict).
      *   If you prioritize **Robustness**, you must discount or exclude the wild animal data. This makes the conclusion *stable* but potentially *inaccurate* (ignoring the largest source of harm if the high estimates are true).

  **Conclusion:** You cannot have a calculus that is both **sensitive to the potentially largest category of harm** (wild animals) and **robust against the uncertainty of that category**. You must choose between a **High-Stakes Gamble** (trust the expected value of wild suffering) or **Epistemic Conservatism** (stick to known farmed animal suffering). Most individual guides choose Conservatism for practical reasons, but this violates the Proportional Scale requirement if the High-Stakes Gamble turns out to be true. Thus, the two requirements are functionally incompatible for a single agent acting under uncertainty.
