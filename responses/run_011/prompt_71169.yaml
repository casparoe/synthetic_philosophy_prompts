      *(Self-Correction during drafting)*: Wait, I need to be careful with Move 8 (OCR). Dana says OCR sorts by resemblance. Modern OCR uses neural networks trained on labeled data. The labels come from the "system/slots" Ruth talks about. So Dana is factually shaky there. I should point that out.

      *(Refining the "Who is Right" per step)*: It's rarely 100% one or the other. I should nuance it. "Dana is logically consistent, Ruth is empirically accurate."

      *(Refining the Assumptions)*: The biggest one is conflating the *abstract letter* (grapheme) with the *physical shape* (glyph). Both of them dance around this but don't name it.

  6.  **Final Polish:** Check against the prompt requirements.
      *   Move by move? Yes.
