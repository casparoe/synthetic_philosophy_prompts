answer: |-
  This is a sophisticated observation, and you are right to sense that while the *components* of this pattern are well-discussed, the specific *mechanism* you have isolated lacks a single, settled name in the literature. You have identified a structural dynamic that sits at the intersection of legal theory, moral philosophy, and economic sociology.

  Here is an analysis of the existing landscape, the near-misses, and a proposal for how to define and name this phenomenon for your work.

  ### 1. Is there an established concept?

  There is no single, canonical term (like "The Tragedy of the Commons") that names this specific pattern of moral-structural restructuring. However, your observation is the connective tissue between three distinct bodies of literature. If you search for this pattern, you will find it described in fragments across these fields:

  **A. Legal Theory: "Form vs. Substance"**
  In tax and corporate law, this is the problem of **Form over Substance**. The law often looks at the economic reality of a transaction (substance) rather than its legal labeling (form) to prevent avoidance. In your cases, the market actors are successfully arguing that the *form* should dictate the moral and legal status, while objectors argue that the *substance* should prevail. There is no specific name for the *successful* use of form to evade substance in ethics, though it is often derided as **"Legalistic Evasion."**

  **B. Property Theory: "Inalienability Rules"**
  The foundational text here is Guido Calabresi and A. Douglas Melamed's *"Property Rules, Liability Rules, and Inalienability: One View of the Cathedral"* (1972). They define **Inalienability Rules** as prohibitions on selling certain entitlements (e.g., you cannot sell yourself into slavery, or in many jurisdictions, sell a kidney). Calabresi and Melamed explicitly note that inalienability rules often lead to **black markets** or **structured evasion**. Your pattern is a *white-market* version of this evasion: a structured compliance that nullifies the rule's intent.

  **C. Economic Sociology: "Circuits of Commerce"**
  The sociologist Viviana Zelizer, particularly in *The Social Meaning of Money* (1994) and *Economic Lives* (2010), describes how people **"earmark"** money and differentiate transactions to make them morally palatable. She argues that people create **"Circuits of Commerce"** where money moves, but is socially defined as a "gift," "allowance," or "compensation" rather than a "price." While Zelizer describes *how* this works socially, she does not typically frame it as a strategic evasion of moral objection, but rather as a natural process of meaning-making.

  **Conclusion for Q1:** There is no settled term. You are describing the strategic application of **Zelizer's differentiation** to navigate **Calabresi and Melamed's inalienability rules**, relying on a **Form over Substance** defense.

  ### 2. The Near-Miss Concepts

  You correctly identified that standard terms do not quite fit. Here is why they fall short, which will help you position your own definition.

  **A. Commodification / Contested Commodities**
  *   **The Concept:** Associated with Margaret Jane Radin (*Contested Commodities*) and Elizabeth Anderson (*Value in Ethics and Economics*). This literature defines *why* the objection exists (some things lose value when sold).
  *   **Why it misses:** It names the *objection*, not the *evasion*. Radin discusses how markets spread, but she does not have a specific term for the structural reclassification that stops the spread without stopping the flow.

  **B. Regulatory Arbitrage**
  *   **The Concept:** Exploiting differences between two regulatory regimes to reduce costs.
  *   **Why it misses:** As you noted, this implies legal rules. Your pattern often operates where the "regulation" is a moral norm that the law has not yet codified, or where the law has codified the norm but the actors are exploiting the *definition* within the law. However, **"Moral Arbitrage"** is a term sometimes used in behavioral ethics, but it usually refers to individuals balancing good and bad deeds (licensing), not structural transaction redesign.

  **C. Gift-Exchange Theory (Mauss)**
  *   **The Concept:** Marcel Mauss's *The Gift*. Markets are impersonal; gifts create social bonds.
  *   **Why it misses:** This explains the *language* used (calling it a gift), but as you noted, your cases involve contracts and consideration. It is a "gift" only in the legal sense of lacking a *quid pro quo* for the specific object, not in the anthropological sense. Relying on this term invites the criticism that you are conflating legal categories with social relations.

  **D. Hypocrisy / Bad Faith**
  *   **The Concept:** The actors know they are doing wrong but pretend otherwise.
  *   **Why it misses:** As you noted, this assumes a conclusion. Some proponents genuinely believe that paying for "time and risk" (surrogacy) is morally distinct from paying for "a baby." A useful term must remain agnostic about whether the distinction is morally valid.

  ### 3. Proposal: A Term and Definition

  Since no existing term captures the structural, moral, and economic dimensions simultaneously, I propose you adopt and define the term **"Categorical Arbitrage."**

  While "arbitrage" is economic, it is increasingly used in sociology (e.g., "institutional arbitrage") to describe leveraging gaps between systems. "Categorical" specifies that the gap being exploited is not between jurisdictions or tax rates, but between *moral and legal categories*.

  #### Definition
  **Categorical Arbitrage** occurs when market actors restructure a transaction to shift it from a prohibited moral-legal category (e.g., "Sale") to a permitted category (e.g., "Service" or "Gift"), preserving the economic substance of the exchange while altering its normative classification to evade moral objection or legal prohibition.

  #### Boundaries: What makes a case an instance?
  To count as Categorical Arbitrage, a case must meet three criteria:
  1.  **Normative Pressure:** There must be an active moral or legal prohibition against the transaction in its original form (e.g., "Babies cannot be sold").
  2.  **Structural Restructuring:** The transaction must be legally or contractually altered, not merely renamed. The rights, remedies, or flow of consideration must change on paper (e.g., payment is contingent on medical milestones, not birth).
  3.  **Substantive Continuity:** The economic outcome and the physical transfer of the good/service remain functionally identical to the prohibited form (e.g., money moves from intended parents to surrogate; child moves to intended parents).

  #### Distinguishing Cosmetic from Genuine Reclassification
  This is the hardest part of your project. How do you distinguish Categorical Arbitrage from a genuine moral improvement?
  *   **The Test of Counterfactual Risk:** If the restructuring genuinely alters the moral character, it should alter the *risk profile* or *incentive structure* for the vulnerable party.
      *   *Example:* If "expense reimbursement" in surrogacy covers only actual receipts, it is a genuine reclassification. If it includes a "standardized loss of wages" stipend that exceeds actual income, it is Categorical Arbitrage.
      *   *Example:* If kidney exchange requires a genuine altruistic donor to initiate the chain, it is a genuine gift network. If the chain is initiated by a broker who matches donors based on ability to pay, it is Categorical Arbitrage.
  *   **The Boundary:** The line is crossed when the structural change is *necessary* to facilitate the transaction but *insufficient* to change the primary motivation of the parties.

  #### Hard Cases (Edge Conditions)
  1.  **Paid Clinical Trials:** Participants are paid for "time and inconvenience," not for their bodies.
      *   *Why Borderline:* The physical risk is to the body, but the legal contract is for labor. Is this Categorical Arbitrage (selling bodily risk) or a legitimate service market (selling time)? It sits on the edge because the "service" cannot be decoupled from the "body."
  2.  **Carbon Offsets:** A company pays to plant trees rather than reducing its own emissions.
      *   *Why Borderline:* The market claims to be selling "restoration service," but objectors claim it is selling "the right to pollute." The categorization determines whether the market is a climate solution or a moral hazard.
  3.  **Legacy Admissions:** A donation to a university is tax-deductible and voluntary; admission is merit-based.
      *   *Why Borderline:* When a donation correlates perfectly with admission for a borderline candidate, is it a "gift to the institution" (permitted) or a "bribe for priority" (prohibited)? The structural separation of the Development Office from the Admissions Office is the arbitrage mechanism.

  #### Generalization Beyond Markets
  You asked if the pattern generalizes. It does.
  *   **War vs. Police Action:** Governments may reclassify a military conflict as a "police action" or "peacekeeping mission" to evade constitutional requirements for a declaration of war. The violence (substance) is the same; the legal category (form) changes.
  *   **Censorship vs. Moderation:** A platform may ban speech not by government order (censorship) but via "Terms of Service violation" (contractual moderation).
  *   **Punishment vs. Therapy:** Juvenile detention may be reclassified as "treatment" to avoid due process protections afforded to criminal defendants.

  **Does this generalization weaken your concept?**
  No. It strengthens it. It suggests you have identified a feature of **rule-based normative systems**. Whenever a rule prohibits a *category* of act rather than the *consequences* of an act, actors will engage in Categorical Arbitrage to achieve the consequences without triggering the category.

  ### Recommendation for Your Work
  In your writing, I recommend you explicitly state that there is no settled term. This validates your contribution. You might write:

  > *"While legal scholars discuss 'form versus substance' and sociologists describe 'circuits of commerce,' there is no settled term for the strategic restructuring of morally contested markets to evade categorical prohibitions. I term this **Categorical Arbitrage**."*

  This allows you to use the existing literature (Radin, Zelizer, Calabresi) without being bound by their specific terminologies, while giving your readers a precise handle for the pattern you have found. It signals that you are not just observing a market, but a mechanism of moral negotiation.
