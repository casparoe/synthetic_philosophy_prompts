answer: |-
  **Recommendation**

  The Panel should direct that dialysis cease immediately following the session on Thursday morning. Ms R is to be transferred to palliative care pathways managed by the renal team and hospice liaison. The Chair must communicate this decision to the husband and elder daughter by Wednesday evening, with the Chaplaincy team authorised to offer support to the family throughout Thursday. This instruction is actionable without further legal referral.

  **The Epistemic Clause and Future Policy**

  We must address the epistemic clause directly. It attempts to bind us not merely to a treatment outcome, but to a rule of evidence: that Ms R's current expressions of contentment are invalid. Can such a clause be given effect? In this specific instance, yes, but only indirectly. We cannot contractually blind ourselves to a patient's current utterances; our duty is to assess capacity and best interests afresh. However, because the independent capacity assessment finds Ms R lacks the ability to weigh information, her current wishes do not override her prior capacitous decision. The clause therefore aligns with the clinical finding, even if it cannot legally dictate it.

  Ought we to accept such clauses in future? No. They create a closed logical loop that undermines the statutory requirement to assess capacity at the time of the decision. Future policy should state that advance decisions may specify clinical triggers (e.g., inability to name grandchildren) but cannot dictate how a panel weighs evidence of current wishes. Instead, such clauses should trigger an automatic, enhanced capacity assessment focused on values drift, rather than attempting to pre-determine the outcome of that assessment.

  **Circularity and the Video Test**

  The circularity is undeniable. The clause dictates that any rejection of the directive is evidence of the collapse the directive predicts. This is self-sealing. If we accept the clause, her protest confirms the dementia; if we reject the clause, we ignore her prior autonomy. There is no non-question-begging test within the clause itself.

  However, the video test provides an external anchor. Ms R passed the authentication test; she is the same person who made the directive. Her response—that the woman on the recording was terrified and unfit to decide—is coherent, but it does not confer capacity. The psychiatrist confirms she cannot retain or weigh the consequences of stopping treatment. Therefore, passing the test licenses the Panel to treat the advance decision as binding, not because her current voice is silenced by the clause, but because her current voice lacks the capacity to revoke it. The video proves identity; the capacity report proves incapacity. Together, they uphold the directive without requiring us to accept the epistemic clause as an evidential rule.

  **Applicability: The Word 'Reliably'**

  Two members argue the cessation clause is not triggered because Ms R names her grandchildren on good days. The clause specifies "reliably". Medical evidence describes her recognition as fluctuating. Fluctuation is the definition of unreliability. To require absolute absence of recognition would render the word "reliably" surplus to meaning. The trigger is met.

  Resolving this dispute does not change my recommendation, only its footing. Even if the cessation clause were deemed inapplicable, the combination of the valid advance decision regarding end-stage scenarios and the current lack of capacity to consent to continuation would lead to the same conclusion: treatment contrary to the prior capacitous wish is not in her best interests. However, confirming the trigger is met provides the clearest ethical path.

  **The Opposing Case**

  The strongest case for continuation rests on the sanctity of the present experience. Proponents argue that the woman in the room is content, expresses a will to live, and perceives her past self as a stranger shaped by fear. To stop treatment is to kill a person who says she wants to live, based on the words of a woman who died years ago. The husband's opposition underscores that those who love her current self see value in her continued existence that the directive cannot capture.

  This argument fails because it conflates existence with benefit. Ms R's current self cannot weigh the burden of dialysis against the finality of death; she confabulates the outcome. Her contentment is, as the epistemic clause feared, likely an adaptive preference born of diminished horizons. We are not killing a person who wants to live; we are honouring the only version of her that understood what death meant. To continue treatment is to prioritise a biological existence she previously deemed undignified over the autonomous values she held when competent.

  **Conclusion and Flip Factors**

  I recommend cessation. I share the view that the epistemic clause is persuasive regarding values drift, but I rely on the capacity finding rather than the clause itself to avoid setting a precedent that allows past selves to gag present ones.

  My recommendation would flip on two facts. First, if the capacity report found Ms R retained the ability to weigh the information, her current refusal would revoke the advance decision, regardless of the epistemic clause. Second, if the recognition of her grandchildren were stable rather than fluctuating, the cessation clause would be inapplicable, requiring a best interests balancing exercise where her current contentment might carry sufficient weight to continue treatment. Neither fact obtains. We must act on Wednesday to ensure Thursday brings comfort, not dialysis.
