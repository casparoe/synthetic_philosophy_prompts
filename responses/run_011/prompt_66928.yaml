answer: |-
  Anchor the distinction in institutional rules before introducing moral intuition, then use a controlled example to expose the slide, finally testing their ability to spot the slide without requiring agreement on justice.

  **0–15 mins: The Practice (Prerequisites)**
  Do not lecture. Create a micro-practice. Establish arbitrary rules for a trivial reward (e.g., "Whoever has the longest shoelace gets a chocolate"). Award it. Ask: "Is the winner *entitled* to the chocolate?" (Yes, by rules). "Did they *deserve* it?" (Likely no). This creates the shared concept of "a practice whose rules create expectations" without sociology. Entitlement is internal to the game; desert is external. If you skip this, they will treat rules as moral claims immediately.

  **15–45 mins: The Example**
  Your bonus example is risky; it invites the "effort is luck" rabbit hole, which derails the session into metaphysics. Use a **retroactive rule change** instead. Scenario: A firm promises a bonus for "Highest Sales." Alice wins. Next day, firm admits error: "Actually, rule was 'Most Hours'." Alice is no longer *entitled*. Does her *desert* change? No. This isolates the distinction without debating the origin of effort. Keep out: home life, systemic inequality, temperament. Keep in: the stability of the moral claim vs. the fragility of the rule. If they push on why the rule changed, pivot back: "Regardless of why, did the rule change alter her entitlement?"

  **45–60 mins: Misconceptions & The Effort Objection**
  Expect three reactions in order:
  1.  "So nothing is real/arbitrary." Head this off in Phase 1. Emphasize entitlements are real social constraints, not illusions.
  2.  "You resent success." Acknowledge briefly, then return to logic. "We are analyzing language, not redistributing wealth."
  3.  "Effort is pure desert." **Concede.** Do not fight. Say: "Even if effort is 100% moral desert, you are only *entitled* if the rule recognizes effort. If the rule recognizes seniority, your effort grants no entitlement. The concepts remain distinct." Fighting this blows up the hour; conceding it preserves the distinction. Let the "resentment" claim sit if it arises quietly; it doesn't block the logic.

  **60–70 mins: Omissions**
  Flagging is enough. Say explicitly: "We are not deciding if the rules are just today, nor solving inequality." Diving deeper triggers ideology; flagging creates safety. For first-years, especially first-gen, knowing you aren't trying to invalidate their achievement is crucial. Trust is the prerequisite for learning this distinction.

  **70–75 mins: The Check**
  Ask: "A referee makes a bad call against you. You are denied a goal. Were you *entitled* to the goal under the rules as enforced, or did you *deserve* it despite the call?" If they say "Deserved it, wasn't entitled," they have the tool. If they say "Ref was wrong so I was entitled," they conflated the two. This tests application, not agreement.
