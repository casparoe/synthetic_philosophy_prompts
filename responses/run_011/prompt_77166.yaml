          *   *Argument:* There is no agreed "ultimate" authority. It's a contested space. If the ECJ says X is EU law and a National Court says X violates the national constitution, who wins? The conflict itself proves the EU isn't just a simple agent of the states.

      *   **Point 5: Addressing the "Smaller State" Conclusion:**
          *   User concludes critics just want a smaller state.
