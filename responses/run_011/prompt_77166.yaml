          *   *Argument:* One can want a large welfare state but prefer it be decided nationally. The complaint is about the *site* of politics, not just the volume.

      *   **Conclusion:** Summarize the pressure points. The user's argument holds *de jure* but struggles *de facto* and *phenomenologically*.

  5.  **Refining the Tone:**
