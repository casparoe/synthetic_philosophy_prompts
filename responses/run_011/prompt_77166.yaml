          *   *Argument:* If you transfer power to a body you cannot practically recall, have you lost sovereignty? Analogy: Selling a house. You *could* buy it back, but if the market price makes it impossible, you've effectively lost it.
          *   *Competence Creep:* Implied powers (Article 352 TFEU) allow expansion without formal treaty change in some areas.

      *   **Point 3: The Democratic Deficit (Substantive vs. Procedural):**
          *   User sees it as low turnout/opacity.
          *   Counter: It's about the *misalignment* of power and accountability.
          *   *Argument:* National democracies are held responsible for outcomes they no longer control (e.g., budget rules, trade deals). The EU has power without a "demos." The deficit is structural, not just procedural.

      *   **Point 4: Constitutional Pluralism (The "Ultimate Authority" Clash):**
          *   User says ultimate authority is with states.
