answer: |-
  1. **The Scenario**

  Elena runs Apex Constructors, a small civil engineering firm specializing in municipal infrastructure. Six months ago, she bid on a fixed-price stormwater retrofit for the Town of Oakhaven. The contract pays $100,000 upon certified completion; there are no progress payments. At the time of bidding, Elena knew there was a significant risk of difficult soil conditions. Her internal estimate was a 50% chance of normal costs ($90,000) and a 50% chance of high costs ($130,000), yielding an expected cost of $110,000 against the $100,000 revenue. She bid anyway, hoping to absorb the loss for market entry. Now, halfway through, the high-cost soil condition has materialized. She has spent $80,000 (labor and equipment). The Town Engineer, Mr. Henderson, confirms that no payment will be released until the system passes inspection. He is not hostile; he is bound by procurement law and cannot modify the contract. Elena knows with certainty that finishing requires exactly $30,000 more. If she abandons the project, she forfeits the contract and the $80,000 already spent, but she can immediately redeploy her crew to a guaranteed repair job netting $5,000 profit. If she finishes, she receives the $100,000 contract price. She is under public pressure: the Town Council announced the project at a town hall, and her firm's reputation rests on delivery. She feels personally responsible for the bid and knows walking away looks like failure.

  2. **The Demonstration of the First Verdict (The Decision Node)**

  At this specific moment, Elena must choose between **Stopping** and **Continuing**. We evaluate only future cash flows; money already spent is sunk.

  *   **Option A: Stop Now**
      *   Future Revenue: $0 (Contract forfeited)
      *   Future Cost: $0
      *   Alternative Opportunity: +$5,000 (Repair job)
      *   **Net Future Value:** +$5,000
      *   *Total Position relative to start:* -$80,000 (Sunk) + $5,000 = **-$75,000**

  *   **Option B: Continue to Finish**
      *   Future Revenue: +$100,000 (Contract price)
      *   Future Cost: -$30,000 (Completion cost)
      *   Alternative Opportunity: $0 (Crew busy)
      *   **Net Future Value:** +$70,000
      *   *Total Position relative to start:* -$80,000 (Sunk) + $70,000 = **-$10,000**

  **Verdict:** Continuing yields a net position of -$10,000. Stopping yields a net position of -$75,000. Continuing is better by $65,000. The decision to continue is mathematically correct.

  **The Error of Inclusion:** If Elena wrongly includes the sunk cost of $80,000 in the *decision calculation* (treating it as a cost of continuing), the math looks like this:
  *   *Wrong Continue Calculation:* $100,000 (Rev) - $30,000 (Future Cost) - $80,000 (Sunk) = -$10,000.
  *   *Wrong Stop Calculation:* $0 (Rev) - $0 (Future Cost) - $80,000 (Sunk) + $5,000 (Alt) = -$75,000.
  *   *The Trap:* While the totals match, a decision-maker influenced by escalation warnings might argue: "I have already lost $80,000. I should cut my losses." If they treat the $80,000 as a reason to stop, they ignore that the $80,000 is gone regardless. The warning sign "money already spent" suggests stopping protects you from loss. Here, stopping *maximizes* loss. The arithmetic proves that ignoring the sunk cost dictates continuing, while fixating on the magnitude of the sunk loss dictates stopping.

  3. **The Demonstration of the Second Verdict (The Approval Date)**

  We evaluate the decision to undertake the project six months ago, using only the information available then.

  *   **Option C: Never Bid**
      *   Cost: $0
      *   Revenue: $0
      *   **Net Value:** **$0**

  *   **Option D: Bid and Execute (Ex-Ante Expectation)**
      *   Revenue: $100,000 (Fixed)
      *   Expected Cost: (50% × $90,000) + (50% × $130,000) = $45,000 + $65,000 = $110,000
      *   **Expected Net Value:** $100,000 - $110,000 = **-$10,000**

  **Verdict:** The expected value of starting the project (-$10,000) is strictly worse than never starting ($0). The initial decision was a loss-making proposition on the known probabilities. The project is a trap: the initial entry was negative EV, but the current position makes exit more costly than completion.

  4. **The Warning Signs**

  The literature on escalating commitment lists specific indicators that a decision-maker is trapped by irrationality. In this case, every sign is present, yet the decision to continue is rational.

  *   **Money Already Spent:** **Present.** $80,000 is gone. *Literature:* Suggests stopping to avoid throwing good money after bad. *Reality:* Stopping crystallizes the loss; continuing recovers most of it.
  *   **Personal Responsibility:** **Present.** Elena signed the bid. *Literature:* Suggests ego is clouding judgment. *Reality:* Responsibility ensures she honors the contract, which is the profitable path here.
  *   **Public Commitment:** **Present.** Town Hall announcement. *Literature:* Suggests reputational pressure forces bad choices. *Reality:* Finishing protects reputation better than abandoning a public utility.
  *   **Repeated Negative Feedback:** **Present.** Soil reports and delays. *Literature:* Suggests the project is failing and should be killed. *Reality:* The feedback confirmed the "High Cost" state, which makes completion expensive but still cheaper than abandonment.
  *   **Ego/Reputational Stake:** **Present.** She wants vindication. *Literature:* Suggests she is chasing validation. *Reality:* Vindication aligns with the profit-maximizing move (finishing).
  *   **Tempting Alternative:** **Present.** The $5,000 repair job. *Literature:* Suggests opportunity cost makes quitting wise. *Reality:* The alternative is insufficient to offset the loss of the contract completion value.

  **Conclusion:** The presence of these signs does not diagnose irrationality. They describe the *structure* of a loss-minimization problem, not the *psychology* of a fool.

  5. **The Key Feature**

  The single feature that makes the two verdicts compatible is **Asymmetric Marginal Completion Cost**.

  Specifically, the cost to *finish* the project ($30,000) is significantly lower than the *total value* of the project ($100,000), even though the *total cumulative cost* ($110,000) exceeds the value. This creates a "Quasi-Rent." Once the initial investment is sunk, the partially completed asset has value *only* if finished. Because the marginal cost to unlock that value is low, continuing is rational.

  **If this feature is removed:** If the cost to complete were $50,000 instead of $30,000 (Total Cost $130,000), the math at the node would flip.
  *   Continue: $100,000 - $50,000 = +$50,000 Future Value. Net Position: -$80,000 + $50,000 = -$30,000.
  *   Stop: Net Position: -$75,000 (including alternative).
  *   *Wait, even then Continue is better.*
  *   *Correction:* To make stopping rational at the node, the Cost to Complete must exceed the Revenue. If Cost to Complete is $110,000.
  *   Continue: $100,000 - $110,000 = -$10,000 Future Value. Net Position: -$80,000 - $10,000 = -$90,000.
  *   Stop: Net Position: -$75,000.
  *   In this altered case, Stopping is better. The "Trap" dissolves because the rational decision at the node aligns with the rational decision at the start (Quit). The tension exists *only* because the marginal cost of completion is low enough to justify finishing, while the total cost was high enough to forbid starting.

  6. **The Counterattack and Critique**

  **The Counterattack:** A defender of the escalating-commitment literature would argue: "You have stipulated that Elena 'knows precisely' the cost to complete is $30,000. In reality, her belief that completion is cheap is *produced* by her escalation. The psychological pressure to justify the $80,000 already spent unconsciously biases her estimate of the remaining work. She *thinks* it costs $30,000 because she needs it to cost $30,000 to make sense of her past. Therefore, the arithmetic is not independent of the psychology; the psychology corrupts the inputs of the arithmetic."

  **Honest Assessment:** My conditions **assume what the counterattack denies**.
  The case specification requires Elena to be "fully informed and honest with herself... She knows precisely what the case says she knows." This is a theoretical constraint designed to isolate the arithmetic from the psychology. It forces the seminar to accept the numbers as objective facts.
  However, the psychological critique argues that this isolation is impossible in the real world. By stipulating perfect information, I have *defined away* the mechanism the literature claims is universal. I have proven that *if* agents are perfectly rational and informed, the warning signs are not diagnostic. The counterattack claims agents are *never* perfectly rational and informed in these scenarios.
  So, does my condition rule it out? Yes, by fiat. It creates a "control group" scenario to show that the *structure* alone can produce the behavior without the *bias*. But it cannot prove the bias doesn't exist in reality, only that it isn't *necessary* to explain the behavior.
