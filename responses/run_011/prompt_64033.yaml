      *(Wait, one more check)*: Point 6 includes "Male pattern baldness isn't a disease." Boorse would agree *if* it doesn't impair function. But some argue it impairs psychological function. The user needs to be ready for the "mental health" objection. I'll add that as a sub-note.

      *(Wait, Point 5 again)*: "Same body, same status." If the reference class changes, the *threshold* for "subnormal" changes. So the *status* changes. Yes, this is the killer.

