  Okay so my friend and I have been at this for like four hours and I've genuinely lost track of who's supposed to be winning. He scribbled out an argument and I can't find the bad step, but the conclusion has to be wrong, because I know Cantor's theorem isn't wrong. Here it is, more or less in his words:

  (1) If ZFC is consistent, ZFC has a countable model M.
  (2) Inside M there is a set that M treats as uncountable — Cantor's theorem is provable in ZFC, so it holds in M.
  (3) But from outside M, that set is countable: there's a real bijection between it and the natural numbers.
  (4) So being uncountable isn't a property a set has in itself. It's just an artifact of which bijections the model happens to contain.
  (5) There's likewise a countable model of ZFC + V=L, in which every real is constructible, and there's also a countable model in which CH fails. Nothing in how we actually use the words "set" and "real number" singles out one of these as THE intended model.
  (6) So there's no fact of the matter about which sets there are, only about what's true in a given model.
  (7) Hence CH has no determinate truth value, and set theory doesn't have a subject matter in the way we assumed.
  (8) And notice "countable" in (1) and (3) is itself only ever model-relative, so the same reasoning applied from inside any model says there's no fact of the matter about (7) either.

  He thinks (8) is beautiful, the argument eats it's own tail and still delivers (7) on the way down. I can't tell whether the tail-eating is a fatal problem or just a curiosity, and every time I try to say where the slide happens he accuses me of begging the question against relativity. So: which step do you reject, and what does rejecting it cost? I'd like to keep (1)-(3), since those are basically just the theorem, and I don't want to give up on set theory being about something — but tell me honestly what I'm paying. Also explain why the step you kill looked so innocent going in, and what each of the usual camps owes here: the people who say the whole paradox is a confusion about relativized vs. absolute notions, the Putnam-style moderate realists, and the go-all-the-way relativity people.

  Start with the step you're rejecting in your first sentence, and keep the whole thing under 450 words.
