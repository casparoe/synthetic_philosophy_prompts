      *   *Commitment 3:* Competence ($p > 0.5$) is empirical and domain-specific. On technical questions, voters are $p < 0.5$.
      *   *Commitment 4:* No competence tests/weighted voting. Universal suffrage is normative (equality), not epistemic.
      *   *Commitment 5:* Decompose questions (vote on premises, derive conclusion) rather than vote on conclusion directly.
      *   *Commitment 6:* Vote judgment, not strategy. *But* admits to strategic voting (voting against best candidate to defeat worse).
      *   *Commitment 7:* Support for supermajorities/rights/judicial review despite CJT claim that error $\to 0$ as $n \to \infty$.

  3.  **Stage 1: Mapping Exercise (Item by Item):**

      *   *CJT Core Assumptions:*
          1.  Binary choice (True/False).
          2.  Independence (votes are conditionally independent given the state of the world).
          3.  Competence ($p > 0.5$ for each voter).
          4.  Aggregation by Simple Majority.
          5.  Sincere Voting (voting according to private signal/judgment).

      *   *Item 1 (Electorate > Experts):* Depends on Competence ($p>0.5$) and Independence. Strains Independence (common information sources). Untouched: Binary choice. *Note:* Invokes Hong-Page, which relaxes independence/competence slightly but requires specific diversity conditions.
      *   *Item 2 (Deliberation):* Strains Independence heavily. Deliberation induces correlation. If correlation is positive, effective $N$ drops. If deliberation improves $p$, it helps, but violates the standard CJT independence assumption.
      *   *Item 3 (Competence is Empirical/$p<0.5$ on tech):* Directly addresses the Competence assumption. Acknowledges CJT fails if $p < 0.5$. Untouched: Independence.
      *   *Item 4 (No Weighted Voting):* Normative constraint. CJT works *better* with weighted voting (if weights track competence). This commitment *rejects* an epistemic optimization for a normative one. Strains the "Aggregation" mechanism if we want truth-tracking.
      *   *Item 5 (Decomposition/Doctrinal Paradox):* Depends on logical consistency. Strains Independence (premises might be correlated). Addresses the "Conclusion-based vs. Premise-based" voting literature.
      *   *Item 6 (Sincere vs. Strategic):* "Voters ought to report judgment" = Sincere Voting (CJT assumption). "I have voted... against candidate" = Strategic Voting. This is a direct internal contradiction regarding behavior.
      *   *Item 7 (Supermajorities/Rights vs. Asymptotics):* CJT says $P(\text{correct}) \to 1$ as $n \to \infty$ with simple majority. Supermajority requirements slow convergence or change the threshold. This suggests a tension between epistemic optimism (Item 1) and institutional caution (Item 7).

  4.  **Stage 2: Auditing the Set (Tensions, Dissolutions, Errors):**

