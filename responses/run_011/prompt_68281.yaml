          *   *Dissolution:* 7 (Supermajority) is compatible with 1 if we view errors as asymmetric costs (Type I vs Type II).
          *   *Error:* Item 1 is empirically unsupported given Item 3. Item 5 is not "strictly more reliable" unconditionally (List & Pettit).
      *   *Single Revision:* Fix Item 1 to acknowledge domain limits.
      *   *Loss:* Cannot claim democracy is epistemically superior on technical/scientific matters.

  6.  **Refining the Math/Logic:**
      *   *CJT Math:* If $p_i = p > 0.5$, $P(\text{Majority Correct}) \to 1$ as $n \to \infty$. If $p < 0.5$, $P(\text{Majority Correct}) \to 0$.
      *   *Correlation:* If votes are correlated with $\rho$, the variance of the mean vote is $\sigma^2/n + (n-1)/n \cdot \text{cov}$. As $n \to \infty$, if $\rho > 0$, variance does not go to 0. Convergence fails.
