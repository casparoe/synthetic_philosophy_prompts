  The case successfully forces the question, but there is an escape route: a student could deny that the reassembled molecule-cluster is the same object as the original (the "break in continuity" objection), thereby avoiding the need to ground distinctness in history alone. I have closed this in the question by stipulating that both resulting objects satisfy the physical conditions for being a statue-shaped lump, forcing students to defend whether divergent history alone is sufficient for metaphysical distinctness rather than allowing them to dismiss one object as a fake.

  **METAPHYSICS II: FINAL EXAMINATION**
  **Time Allowed: 45 Minutes**
  **Total Marks: 25**

  **Question 1**

  Consider the following case. A statue stands on a plinth. Over the course of an hour, a prankster replaces every molecule of the statue with a perfect duplicate, placing the removed original molecules into a box. At the end of the hour, the molecules on the plinth form a statue-shaped lump (Object A), and the molecules from the box are reassembled in the next room into an exact duplicate statue-shaped lump (Object B). Object A and Object B are qualitatively identical in shape, mass, and composition. They differ only in their spatial location and their causal history: Object A has a continuous spatiotemporal history on the plinth but new matter; Object B has the original matter but a discontinuous history.

  Assume for the sake of argument that both Object A and Object B qualify as statues.

  (a) Does the historical difference between Object A and Object B ground their numerical distinctness, or is it merely a conceptual tool for tracking? Explain why a difference in history should (or should not) count as a metaphysical difference rather than a descriptive one. (15 marks)

  (b) In the standard statue/lump case, we often rely on modal differences (e.g., the lump survives squashing, the statue does not) to prove distinctness. In this swap case, how do the modal profiles of Object A and Object B relate to their histories? If history grounds distinctness, does one object survive squashing while the other does not? Explain how this impacts the claim that modal properties are merely "decorative." (10 marks)

  *Note: You are not permitted to simply name standard positions (e.g., "Four-Dimensionalism" or "Constitution View") without explaining the underlying reasoning. Marks are awarded for argumentative clarity, not terminology.*

  ***

  **MODEL ANSWER**

  The claim that historical distinctness is merely "bookkeeping" rests on the assumption that only intrinsic, non-relational properties are metaphysically robust. If this assumption is false, then history can ground numerical distinctness. A difference in causal history is a mind-independent fact about the world, not merely a description we impose. Object A came into existence through gradual replacement; Object B came into existence through reassembly. These are different events in the world. If objects are individuated by their origins or causal paths, then A and B are numerically distinct because the facts making them what they are are different. To call this "bookkeeping" is to confuse epistemology with ontology. We might use tracking to *identify* the difference, but the difference exists regardless of whether anyone is tracking it. Therefore, the distinctness is metaphysical because the historical properties are real properties.

  If historical properties are real, then Leibniz's Law holds: if A and B differ in properties (historical ones), they are distinct. The friend's argument suggests that because shape and location are no longer doing the work of distinguishing the objects in the *result* state, the distinctness is less real than in the standard coincidence case. This is incorrect. In the standard case, shape and location are identical, so modal properties must do the work. In the swap case, history does the work. Neither is inherently more "real." The charge of "bookkeeping" only sticks if one assumes that only synchronic, intrinsic properties ground identity. But if we accept that objects persist through time, their history is part of what they are.

  Regarding the modal profiles, the swap case reveals that modal properties are not decorative; they supervene on historical facts. In the standard case, we say the statue cannot survive squashing because of what it is. But what it is depends on its history. If Object B (the reassembled one) is the true statue because it retains the original matter and origin, it inherits the modal profile of the original statue: it cannot survive squashing. Object A, being a product of gradual replacement, might have a different modal profile. Perhaps it is more like a "living organism" of artifacts that survives material change but not disassembly.

  If history grounds distinctness, then the modal differences follow from the historical differences. The object with the "statue" history has the "statue" modal properties. The object with the "lump" history (or a different artifact history) has different modal properties. This shows that modal properties are not decorative additions; they are expressions of the object's historical nature. If we strip away the history, we strip away the ground for the modal claims.

  Therefore, the friend is wrong to suggest that relying on history reduces distinctness to tracking. Tracking implies a conceptual convenience. But if the causal history is a fact about the world, then distinctness grounded in history is a fact about the world. The squashing intuition remains vital: it tests whether the historical ground we chose (matter vs. continuity) actually supports the modal properties we associate with the object. If we say Object B is the statue, it must fail the squashing test. If it passes, our historical grounding was wrong. Thus, modal properties act as a check on our historical grounding, proving they are integral to the metaphysics, not decoration. The swap case does not dissolve the metaphysics of distinctness; it merely shifts the grounding from synchronic properties to diachronic ones.

  ***

  **MARKING SCHEME**

  **A-Range Answer (20-25 Marks)**
  *   **Grounding Analysis:** Explicitly argues whether historical properties are mind-independent facts or conceptual tags. Defends the ontological weight of history without relying on named theories.
  *   **Modal Integration:** Connects the historical grounding to the modal profiles (squashing). Explains that modal properties supervene on historical facts rather than being independent "decorations."
  *   **Leibniz's Law:** Correctly applies the law to historical properties, noting that if history is a property, distinctness follows.
  *   **Counter-Argument:** Anticipates the "bookkeeping" objection and rebuts it by distinguishing epistemic tracking from ontological grounding.

  **B-Range Answer (13-19 Marks)**
  *   **Competent Application:** Correctly identifies that A and B are distinct due to history and applies Leibniz's Law.
  *   **Surface-Level Modal Discussion:** Mentions the squashing intuition but fails to explain *why* the history dictates the modal profile (e.g., just states "one breaks, one doesn't" without linking it to the grounding).
  *   **Descriptive Focus:** Treats history as a difference but struggles to defend why it is *metaphysical* rather than conceptual. May rely on intuitive assertions ("it just feels like two things") rather than argument.
  *   **Structure:** Clear but lacks the depth of engagement with the "bookkeeping" charge.

  **Specific Mistakes That Cost Marks**

  1.  **The Epistemic Slide:** Arguing that because we cannot tell Object A and Object B apart by looking at them (qualitative identity), they are not numerically distinct. This conflates knowability with existence. (Deduct 5 marks)
  2.  **Begging the Question:** Asserting that "history matters" or "objects have essential origins" as a premise without defending why this isn't just the "bookkeeping" the prompt challenges. (Deduct 4 marks)
  3.  **Ignoring the Modal Constraint:** Discussing historical distinctness without addressing part (b) regarding the squashing intuition, or treating the modal properties as irrelevant to the metaphysical claim. (Deduct 5 marks)
  4.  **Qualitative/Numerical Confusion:** Arguing that because Object A and Object B are qualitatively identical (same shape, mass), they must be the same object, failing to distinguish between type-identity and token-identity. (Deduct 5 marks)
