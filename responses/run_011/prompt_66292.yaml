answer: |-
  **Joint Statement on the Ethics of Selection and Reward**

  **1. Agreed Claims**

  After three years of deliberation, the undersigned members of the working group submit the following claims as matters of shared conviction. Where the justification for agreement differs between us, this is noted in brackets.

  1.  Existing selection systems in education and employment frequently fail to identify those who would contribute most effectively to shared social ends. [Camp A: because they track credentials rather than effort; Camp B: because they track arbitrary endowments.]
  2.  Measured merit in current systems correlates strongly with the circumstances of one's birth, including parental wealth and social capital.
  3.  This correlation between birth circumstances and reward is unjust and undermines the legitimacy of existing hierarchies.
  4.  The belief that high rewards indicate superior moral worth is socially harmful and psychologically damaging to those less rewarded.
  5.  Institutions are morally criticisable when they distribute benefits in ways that violate public principles of justice. [Camp A: because they miss pre-institutional facts; Camp B: because they violate constructed rules.]
  6.  Diligence and character are partially products of fortunate upbringing, though we disagree on whether this eliminates desert claims.
  7.  Reforming selection systems requires more than technical adjustments to testing; it requires ethical restructuring of reward mechanisms.
  8.  No individual earns their natural endowments, nor the initial social conditions that allow those endowments to flourish.
  9.  A just society must mitigate the moral arbitrariness of birth without necessarily abandoning all distinctions in treatment.

  **2. Disagreements Table**

  | Disagreement (Neutral) | Camp A Formulation | Camp B Formulation | Crux | Shared Evidence | Predictions |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Source of Distributive Claims** | Desert facts obtain independently of social rules; institutions should track them. | Distributive shares are determined solely by public rules of a just basic structure. | Do desert facts exist prior to institutional rules? | Intuitions regarding rescue cases and informal cooperation. | A: Yes, even in statelessness. B: No, claims vanish without rules. |
  | **Moral Arbitrariness of Effort** | Effort expended is a valid basis for desert, even if capacity for effort is unevenly distributed. | The disposition to exert effort is itself morally arbitrary and cannot ground distributive justice. | Is the capacity for diligence morally arbitrary? | Psychological data on upbringing and impulse control. | A: Diminishes but does not erase desert. B: Erases desert as a justice claim. |
  | **Function of Meritocracy** | Meritocracy fails because it tracks the wrong inputs (talent vs. effort). | Meritocracy fails because it links distribution to worth at all. | Should distribution track worth? | Observations of stigma in low-wage labour. | A: Track worth better. B: Decouple worth from share. |

  **3. Worked Test Cases**

  **The Abolition Case**
  Consider a contribution-tracking scheme dissolved overnight. Camp A maintains that in the moment before dissolution, facts about who deserved what remained true regardless of the scheme's existence, and these facts retain content in a community that never had such a scheme. Camp B contends that once the rules vanish, the specific claims to distributive shares vanish with them; in a community without such schemes, talk of distributive desert is category mistakes. We agree the workers suffered injustice under the scheme, but disagree on whether the injustice was failing to match pre-existing facts or violating constructed entitlements.

  **The Care Sector Policy**
  A publicly funded care sector proposes replacing seniority-based pay with wages tied to contribution units recorded by peers. Camp A recommends a modified version of this scheme, arguing it better tracks effort and sacrifice than seniority, provided adjustments are made for unequal capacity. Camp B recommends rejecting the scheme, arguing it intensifies the link between worth and income; instead, they propose flat pay scales with non-financial recognition. Camp A expects the scheme to improve morale if adjusted; Camp B expects it to foster resentment regardless of adjustment.

  **4. Verbal versus Substantive Dispute**

  The collaboration has identified that some divergence arises from ambiguous terminology rather than incompatible worldviews. Specifically, the use of 'desert' in assessments of a person's character differs from 'desert' in claims to a share of output. When praising a caregiver's kindness, we employ a moral assessment independent of payment. When allocating wages, we employ a distributive rule. Camp A argues these are continuous; Camp B argues they are distinct categories. We conclude that conflating moral praise with distributive entitlement fuels the harmful belief that income reflects virtue. Clarifying this distinction reduces the apparent scope of our disagreement, though the core dispute regarding the basis of distributive shares remains substantive.

  **5. Residual Dissensus Register**

  The following questions are deliberately left unsettled:
  *   The metaphysical status of free will: Settling this requires philosophical resources beyond our empirical mandate.
  *   The optimal tax rate for mitigation: Settling this requires economic modelling outside our ethical scope.
  *   The definition of a 'just basic structure': Settling this requires political theory beyond our group's expertise.

  **6. Note on Falsifiability**

  Regarding the cruxes in Section 2, we state honestly what would count as evidence against our respective views. For the **Source of Distributive Claims**, Camp A would accept falsification if it were demonstrated that all intuitions regarding pre-institutional fairness are merely internalised social norms. Camp B holds this view is not falsifiable by empirical case, as it is a conceptual claim about the nature of justice. For the **Moral Arbitrariness of Effort**, Camp A would concede if neuroscience proved effort is entirely determined by prior causes without remainder. Camp B would concede if it were shown that individuals could originate their own character independent of upbringing. For the **Function of Meritocracy**, both sides accept that if decoupling worth from share led to catastrophic collapses in productivity harming the worst-off, their positions would require revision. We acknowledge that Camp B's conceptual claim is less susceptible to empirical refutation than Camp A's realist claim.
