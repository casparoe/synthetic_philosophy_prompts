      *   Closing.
      *   Need to be concise.

      *Drafting thought:* Ensure the distinction between "Archive" (the collection) and "Historian's confinement" is clear.
      *   Ensure the "Single Feature" in (d) is precise.

      *Let's write.*
answer: |-
  In the Free City of Meridian, 1923, a severe unemployment crisis unfolded. Two bodies of record survive. The Municipal Works Bureau "Daily Labor Ledgers" constitute the first. These are bound volumes recording every hour of work performed by relief employees, signed by foremen, calculated by clerks, and archived immediately. The series is continuous from January 1 to March 31, after which the volumes cease. There are no gaps, no alterations, and no missing pages. The finding aid is precise, mapping every worker to every day. The records are pristine, and every entry corresponds to a verified payment. Nothing was destroyed; the bureau simply stopped generating these records on April 1.

  The second body is the City Coroner's "Pending Inquiry Slips." These are loose, water-damaged forms stored in unindexed shoeboxes. Coverage is sporadic; some weeks have no slips, others have dozens. Many are illegible. However, the surviving slips from April list causes of death as "exposure" and "starvation" at rates fifty times the baseline of previous years. There is no third collection. No diary exists. No oral history survives. The Ledgers are objectively superior by every archival standard: volume, continuity, proximity, consistency, preservation, arrangement, and truthfulness within their own terms. Yet, a historian confined to the Ledgers concludes the crisis ended March 31. A historian confined to the Slips concludes the crisis peaked in April. The second is correct.

  (a) The Ledgers satisfy Spec 1 as follows:
  *   **Volume:** They contain 10,000+ daily entries versus the Slips' 200 fragments.
  *   **Continuity:** They cover every single day from Jan 1 to Mar 31 without break.
  *   **Proximity:** Entries were made contemporaneously with the work shifts.
  *   **Consistency:** Formatting and calculation methods never vary.
  *   **Preservation:** Bound volumes are intact; Slips are water-damaged.
  *   **Arrangement:** Chronological with a working index; Slips are unindexed.
  *   **Absence of Falsehood:** Every recorded hour was worked and paid.

  (b) The silencing occurs at Trouillot's first site: the **making of the record**. The bureaucracy defined the "crisis" operationally as "labor utilization." When funding ceased, labor utilization stopped, so record creation stopped. It is not the assembly (the archive is complete relative to its series), retrieval (the historian reads the silence correctly), or significance (the interpretation is logical). The fact of "suffering" was not silenced by power suppressing truth, but by the administrative decision that "suffering" was not a recordable fact once "work" ceased.

  (c) Historian A employs the rule: *Absence of entry implies absence of event.* This requires the assumption that record creation tracks phenomenon intensity continuously. Historian B employs the rule: *Presence of entry implies presence of event, despite gaps.* She lacks the assumption that the sample is representative, but the signal strength (50x baseline) overrides the sampling noise. Historian A lacks the assumption that the *recorder's capacity* to record is independent of the *phenomenon's* existence.

  (d) The single feature making the asymmetry go is the **decoupling of the recorded variable from the historical phenomenon**. The Ledgers record *employment*, not *need*. When employment was administratively severed from need, the archive remained perfect but became irrelevant. If you remove this decoupling, what remains is the familiar complaint that the powerful kept the records. To make the case work again, you would have to add back the bureaucratic categorization error that defined the crisis as a labor problem rather than a survival problem.

  (e) A defender of the Ledgers might argue: "The Ledgers are corrigible; the abrupt cessation on March 31 is itself a data point inviting inquiry into *why* records stopped, whereas the Slips offer no context for the spike. A rigorous historian treats the silence of a complete series as a positive fact requiring explanation, not as evidence of absence. The Slip historian relies on a fragmentary signal that could indicate a recording anomaly (e.g., a change in coroner policy) rather than a mortality spike. The Ledger historian's error is interpretive laziness, not archival failure."

  (f) This case teaches that silence is not always a void where evidence was destroyed; often, it is a solid wall where evidence was never conceived. Students must learn to interrogate the categories that generate records, not just the power that hides them. The most dangerous archive is the one that tells the truth about the wrong thing.
