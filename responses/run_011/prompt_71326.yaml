answer: |-
  ### Brainstorming Candidate Theories

  1.  **Strict Personalism (Atomistic Desert):** Desert is an inalienable relation between an agent and their intentional action; results cannot be separated from the actor.
      *   *Explains:* The doctrinal baseline that one inherits only one's own actions and the donor's merit is not depleted.
      *   *Struggles:* Cannot make sense of the "transfer" grammar or the claim that the deceased's condition actually improves; renders the ritual's specific metaphysical constraints (e.g., hungry ghost status) unintelligible.

  2.  **Ontological Substantivalism (Merit as Potency):** Merit is a quasi-physical substance or spiritual currency that accumulates and can be divided or radiated without diminishing the source.
      *   *Explains:* The candle analogy, the water pouring, the non-depletion of the donor's stock, and the surface grammar of giving.
      *   *Struggles:* Conflicts with the definition of karma as intention (*cetana*); if merit is a substance, moral responsibility becomes detached from volition, undermining the ethical core of the system.

  3.  **Relational Enablement (Occasioning):** The donor's act creates an external condition that allows the recipient to generate their own merit through a reactive mental state (rejoicing).
      *   *Explains:* The requirement for recipient assent, the non-depletion of donor merit, and the narrow conditions under which the beneficiary can benefit.
      *   *Struggles:* Fails to account for the "dedication to all sentient beings" where recipients cannot consciously assent; makes the "transfer" language systematically misleading.

  4.  **Expressive Communalism (Social Function):** The ritual is a performative enactment of social bonds and filial piety that stabilizes the community of the living, with metaphysical claims serving as symbolic scaffolding.
      *   *Explains:* The timing (funerals/commemorations), the communal response, and the persistence of the practice despite doctrinal complexities.
      *   *Struggles:* Cannot explain why participants insist on specific metaphysical preconditions (e.g., the realm of the recipient) if the work is purely social; contradicts the participants' own understanding of efficacy.

  ***

  ### Reconstruction of the Theory of Desert Presupposed by Merit Dedication

  To determine what this practice strictly requires, we must distinguish between the *mechanism of efficacy* (how it works) and the *conditions of intelligibility* (what must be true for the participants to think it works). The practice cannot function if the donor believes their action has zero causal impact on the recipient's welfare. Therefore, the practice strictly requires a **causal link** between the donor's volition and the recipient's state of affairs. However, it does not strictly require that *desert itself* moves. It requires only that the *fruits* of desert can be made accessible.

  The tension you identify—between inalienable personal desert and alienable merit transfer—is genuine. The traditional harmonization (the "Rejoicing Mechanism") attempts to resolve this by shifting the locus of desert generation. On this reading, the donor does not transfer desert; they transfer an *opportunity to deserve*. The donor performs a generous act; the recipient, upon becoming aware of it, performs the generous act of *mudita* (sympathetic joy). The recipient's improvement is the result of their own *mudita*, triggered by the donor's gift.

  **Does this reconciliation succeed?**
  It succeeds locally but fails globally.
  It succeeds in the specific case of the *hungry ghost* (the narrow condition you noted). Here, the metaphysics align: the ghost is in a state of deprivation and acute awareness of the living, capable of the specific mental act of rejoicing. The donor provides the object; the recipient provides the volition. Desert remains personal.
  It fails in the case of **dedication to all sentient beings**. If the mechanism requires conscious assent (rejoicing), then dedicating merit to beings in hell (too much pain), heaven (too much pleasure), or the animal realm (too much delusion) is metaphysically inert regarding the recipient. If the tradition claims these beings *do* benefit despite their inability to rejoice, the Rejoicing Mechanism is abandoned for a form of Ontological Substantivalism (Merit as Potency). If the tradition claims they do *not* benefit, but the donor does it anyway, the practice admits that the "transfer" is often fictive, serving only the donor's psychological state.

  Therefore, the practice is **philosophically underdetermined** between two incompatible theories:
  1.  **Enablement:** Works only for those capable of rejoicing (strictly personal desert preserved).
  2.  **Radiation:** Works for all beings via a change in the "spiritual atmosphere" or karmic field (personal desert compromised).

  The **Social Reading** you proposed is insufficient as a reconstruction of the *presupposed* theory, though it may explain the *sociological persistence*. Participants do not treat the ritual as merely symbolic; they adjust their behavior based on the metaphysical status of the dead (e.g., timing the dedication to when the relative is likely a hungry ghost). If it were purely social, the realm of the deceased would not matter. Thus, the practice rules out a purely social reading as a complete account of participant intent.

  The **Potency/Purity Reading** is the stronger rival. If merit is treated as a purity that ripens, it can be shared like warmth. This fits the water-pouring imagery perfectly. However, this reading is in tension with the doctrinal insistence that karma is intention. If I can benefit from your intention without forming a corresponding intention of my own (as in the universal dedication where I am unaware), then moral desert is no longer strictly personal.

  **What if the Strictly Personal View were enforced?**
  If we enforced the clause that "a being owns its own actions and inherits their results and nothing else" without the "Rejoicing" loophole, the practice would have to change radically.
  1.  **No Transfer Language:** The formulae would shift from "I give this to you" to "I act in a way that may inspire you."
  2.  **No Universal Dedication:** Dedicating to "all beings" would be recognized as a meditation on the donor's own benevolence, with no claim that it aids the recipients.
  3.  **No Water Pouring:** The physical metaphor of flow would be replaced by a metaphor of signaling or broadcasting.
  4.  **Recipient Accountability:** The focus would shift entirely to whether the recipient is *cultivating the capacity to rejoice*, rather than whether the donor is *sending merit*.

  ### Secular Purchase: Derivative Desert and Fitness to Receive

  Does this give secular theorizing about desert a purchase it otherwise lacks? Yes, specifically on the concept of **Fitness to Receive**.

  In secular analytic philosophy, desert is typically backward-looking (based on past action) or forward-looking (based on utility). We rarely analyze the *recipient's* role in the transaction of desert. The Buddhist practice suggests that **being a fitting recipient is itself a moral status.**

  1.  **Derivative Desert:** The practice challenges the notion that desert is never derivative. In the Rejoicing Model, the recipient deserves an improved state *in virtue of* the donor's act, but only because the recipient possesses the *capacity* to validate that act. This suggests a hybrid model: I can deserve a benefit triggered by another, provided I possess the moral faculty to recognize and affirm the value of their action. This offers a model for secular contexts, such as whether children deserve benefits derived from their parents' public service, or whether citizens deserve national reparations based on ancestors' suffering. The Buddhist answer would be: No, not automatically. They deserve it only if they actively "rejoice" in (affirm/validate) the justice of the claim. Desert cannot be inherited passively; it must be actively ratified.

  2.  **Collective Desert:** The practice rules out strong collective desert (a nation deserving punishment for a past regime) but allows for **collective conditionality**. A family or nation shares a "field" of conditions. One member's action can improve the *environment* for all, but each individual must still perform the internal work to harvest the benefit. This refines secular theories of collective responsibility: a group can create the *opportunity* for redemption, but individuals within the group must individually actualize it.

  3.  **Deserving to be a Recipient:** This is the most significant contribution. The restriction that only hungry ghosts can benefit implies that **suffering and awareness are prerequisites for receiving aid.** Beings in heaven are too complacent; beings in hell are too overwhelmed. This suggests that desert is not just about what you did, but about your *receptivity*. In secular terms, this argues that aid or reward is only "deserved" or effective if the recipient is in a moral position to integrate it. It shifts the focus from the *giver's right to give* to the *receiver's capacity to receive*.

  ### Verdict

  The practice of merit dedication **presupposes a theory of Relational Enablement that is ultimately incoherent when mapped onto a strict theory of Moral Desert.**

  The tradition attempts to have it both ways: it wants the ethical rigor of Personal Karma (you own your actions) and the soteriological utility of Transferable Merit (you can help the dead). The "Rejoicing Mechanism" is a patch that saves the theory in the specific case of the hungry ghost but collapses under the weight of Universal Dedication. When merit is dedicated to all beings, the requirement for recipient assent is necessarily dropped, and the practice slides into Ontological Substantivalism (merit as a transferable substance).

  Therefore, the practice does not successfully harmonize personal desert with transfer. Instead, it reveals that the concept of "merit" (*punna*) in lay practice is functionally distinct from the concept of "karma" (*kamma*) in scholastic doctrine. Merit operates as a **relational currency** that can be shared, while Karma remains the **law of moral causation** that cannot. The tension is not resolved; it is managed by ambiguity.

  For your seminar, the definitive philosophical lesson is this: **Desert cannot be transferred, but the *conditions for realizing desert* can be.** The Buddhist practice is coherent only if we stop calling it "desert transfer" and start calling it "opportunity provision." If we insist on the language of desert, the practice is metaphysically inconsistent. If we accept the language of enablement, the practice is coherent but loses its claim to be a theory of *justice* (giving what is owed) and becomes a theory of *grace* (providing what is needed). The water pouring is not the movement of a debt paid; it is the creation of a space where a debt might be forgiven. This distinction offers secular theory a robust model for distinguishing between *entitlement* (which is personal and inalienable) and *opportunity* (which is relational and shareable).
