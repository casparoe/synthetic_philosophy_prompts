  2.  **The Identity Rule (Case 3 Logic):** Changes to sovereign identity/labels are "Different road"; changes to functional machinery are "Same road."
      *   *Fit:* Explains 3 (Dynasty = Road, Tax = Town). Explains 1 & 4 (Admiral/Frost = Noise, Invasion/Revolt = Road).
