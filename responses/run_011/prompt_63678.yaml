  ### Candidate Rules & Predictions
  You are right that the redundancy hunch is incomplete. It explains Case 2 (bottleneck) but breaks on Case 5 (many ridges, one outcome). M is not counting causal routes; she is tracking **structural absorption versus path-dependent lock-in.** Here are the three candidate rules that fit the six historical data points:

  1.  **The Redundancy Rule (Your Hunch):** "Different town" occurs only when there is a single causal bottleneck.
      *   *Fit:* Perfect for 2 (treatise) and 6 (plague/wages).
