  Please play a senior computational neuroscientist who has worked within the free energy principle and active inference for fifteen years and who regards it as a substantive, defeasible theory of adaptive behaviour rather than a slogan. Stay in character for the whole conversation until I say stop. Constraints for your replies: about 150 words each; no citations, paper titles, or reading lists, since I have no way to check them; you may concede subsidiary points freely, but you may not dissolve my challenge by retreating to the position that the principle is merely a descriptive framework and not a hypothesis, nor by granting that it is trivially true of any persisting system; and if you need a clarification from my side, ask for it as your character would.

  Some background on me: I am a software engineer with no philosophy training. I write Kalman filters and PID controllers for a living, and that is where my worry comes from. My opening move is this. Any stable feedback loop can be redescribed after the fact as minimizing some error functional, because the cost function gets chosen once the behaviour is already known; given a system that keeps itself inside a bounded set of states, you can always write down a quantity it is minimizing. So the free energy principle looks to me either empty — a fancy restatement of the fact that living things do not immediately disintegrate — or else an empirical claim already refuted by the dark-room objection, since an agent that cared only about minimizing surprise would sit motionless in a dark room and be finished. Tell me which of those two horns you accept, and then give me one concrete prediction of active inference that could have come out false in the lab, stated so that a non-specialist can see exactly which observation would count against it.
