answer: |-
  **Bottom line**

  Your tentative principle is close but requires a third clause regarding internal architecture. I propose the **Robust Functional Dependence Principle**: A high-level property does genuine causal work if (1) behavior remains stable across physical variations of that property, (2) behavior changes when the property varies holding physics fixed, and (3) the system possesses an internal architecture selected to track that property. This saves your intuition about externalist content (7) while validating the chess engine (2). However, it forces a reconciliation of the careenium (1): if it lacks design history, it is inert; if it functions like the chess engine, it is real. To maintain consistency with your preference, you must surrender verdict (11). If the symbolic level predicts behavior better than physics, it is tracking causal joints, not just human convenience. Additionally, you must align (1) with (2); they cannot differ unless their functional integration differs.

  **The principle, clause by clause**

  **Clause 1: Counterfactual Stability.** Hold the high-level property fixed while varying the physical realization; if the effect persists, the property is a candidate cause. This captures your intuition in (10) the hurricane and (2) the chess engine. Whether the low pressure is made of nitrogen or oxygen, the roof flies off; whether the chess state is realized on silicon or vacuum tubes, the engine resigns. This clause rules out (5) the rock cracks, where changing the physical cracks destroys the "warning" without any stable high-level property persisting to drive behavior. It ensures that causation isn't tied to one specific micro-configuration but rides on a stable pattern.

  **Clause 2: Semantic Sensitivity.** Hold the physical substrate fixed while varying the high-level property; if the effect changes, the property is doing work. This motivates your verdicts on (3) the bank rumor and (6) the road sign. The sound waves or ink could be physically identical, but if they meant "CEO retiring" instead of "insolvent," the run would not occur. This clause distinguishes genuine semantic causation from mere physical correlation. It ensures that the *content* itself, not just the noise, is leveraged by the system. Without this, meaning collapses into physics, and (3) becomes indistinguishable from (5).

  **Clause 3: Internal Architectural Integration.** The system must be structured by design or evolution to be sensitive to that specific property. This is the crucial repair that distinguishes (1) the careenium from (2) the chess engine. In (2), the engine is built to evaluate chess states; its transistors are arranged to respond to *rook-count*, not just voltage. In (1), if the careenium is merely a toy we interpret, it lacks this internal selection history; the clusters move due to collisions, not because the machine is designed to track *hunger*. This clause also saves (7) the twin careenia. Although the content differs (*water* vs. *twin-water*), the internal architecture is identical and insensitive to the external difference. Thus, the external content is causally inert for the machine, even if it matters to us. Finally, it explains (4) the thermostat: unless the set-point is represented symbolically within the system's logic rather than just mechanically, it fails this clause, validating your verdict over your reading group's.

  **The three hard pairs**

  **(1) Careenium vs. (2) Chess Engine:** Your verdicts differ, yet both are physical systems. The principle reconciles them via Clause 3 (Integration). The chess engine is designed to process chess states; the careenium (in your description) is a passive system we interpret. If the careenium evolved to maintain its clusters for survival, it would become like (2). The cost is making causation historical: a system's causal powers depend on its origin (design/evolution), not just its current structure. You must accept that two physically identical systems could differ in causal power if one was designed for meaning and the other wasn't.

  **(7) Twin Careenia vs. (3) Bank Rumor:** In (7), content differs but behavior doesn't; in (3), content differs and behavior does. The principle resolves this by locating the causal work in the *receivers*. In (3), the bank customers have architectures (minds) sensitive to the rumor's truth conditions. In (7), the careenia lack sensitivity to the external environment's chemical nature. The cost is relational: content causation isn't intrinsic to the signal but depends on the receiver's architecture. This saves (7) without denying (3), but it means "meaning" doesn't push matter around unless matter is built to listen to meaning.

  **(9) Self-simmball vs. (1) Ordinary Simmball:** You feel (9) pushes substrate while (1) doesn't. The principle treats (9) as a case of structural feedback, not necessarily semantic causation. The self-simmball reroutes collisions because of its physical position and connectivity (Clause 1), not because it *means* "self." If it means "self" but is disconnected (see new cases), it does nothing. The cost is deflating (9): it feels special because it creates a loop, but physically it's just another cluster affecting flippers. You must surrender the intuition that self-reference adds magical causal power over and above structural integration.

  **Causal versus explanatory**

  Your verdict (11) claims the symbolic description is a better explanation but merely a fact about us, not the machine. Verdict (10) accepts higher-level causation (pressure) as real. The principle demands you align these. If the symbolic description in (11) satisfies Clauses 1 and 2 (stable across physics, sensitive to meaning), it tracks real causal joints, not just human convenience. Explanatory power often tracks causal structure. If the symbolic level predicts better than the physical simulation, it is because the system is organized at that level. To keep (10) as real causation while demoting (11) to mere explanation creates an unjustified dualism between "natural" higher-level properties (pressure) and "semantic" ones (clusters). You must concede that if the symbol reliably predicts behavior across physical variations, it is causally relevant. The distinction between "causal" and "explanatory" collapses when the explanation relies on robust counterfactuals. Thus, (11) must be upgraded: the machine's behavior is genuinely governed by the symbolic dynamics, not just described by them.

  **Cases I didn't list**

