answer: |-
  ### Part 1: Sensitivity to the Discount Factor

  We define two outcomes, **A** and **B**, as infinite sequences of wellbeing values for periods $t = 1, 2, 3, \dots$.

  *   **Outcome A:** $(10, 0, 0, 0, \dots)$
      *   One generation enjoys high wellbeing; all subsequent generations have zero wellbeing.
  *   **Outcome B:** $(0, 1, 1, 1, \dots)$
      *   The first generation has zero wellbeing; all subsequent generations enjoy moderate wellbeing.

  We calculate the discounted sum $V = \sum_{t=1}^{\infty} \delta^{t-1} w_t$.

  **Case 1: Discount factor $\delta = 0.9$**
  *   $V_A = 10 + 0 + 0 + \dots = \mathbf{10}$
  *   $V_B = 0 + 0.9 + 0.9^2 + \dots = \frac{0.9}{1 - 0.9} = \frac{0.9}{0.1} = \mathbf{9}$
  *   **Verdict:** A is better than B.

  **Case 2: Discount factor $\delta = 0.99$**
  *   $V_A = 10 + 0 + 0 + \dots = \mathbf{10}$
  *   $V_B = 0 + 0.99 + 0.99^2 + \dots = \frac{0.99}{1 - 0.99} = \frac{0.99}{0.01} = \mathbf{99}$
  *   **Verdict:** B is better than A.

  **Reasoning:**
  The ethical ranking flips entirely based on the discount factor. At 0.9, we prioritise the immediate large gain. At 0.99, we place sufficient weight on the infinite stream of future gains to outweigh the initial loss. Since nothing in the ethics itself dictates whether 0.9 or 0.99 is the 'correct' rate of time preference, the verdict rests on an arbitrary constant.

  ***

  ### Part 2: Failure of the Overtaking Criterion

  To avoid arbitrary discounting, we might let $\delta \to 1$ and use the overtaking criterion. Outcome A overtakes B if, from some period $T$ onwards, the cumulative sum of wellbeing in A stays strictly ahead of B forever.

  Consider these two outcomes:

  *   **Outcome A:** $(2, 0, 2, 0, 2, 0, \dots)$
      *   Wellbeing oscillates between high and nil.
  *   **Outcome B:** $(1, 1, 1, 1, 1, 1, \dots)$
      *   Wellbeing is constant and moderate.

  Let us examine the running total of the difference $(A - B)$:
  *   Period 1: $2 - 1 = 1$ (Cumulative: **1**)
  *   Period 2: $0 - 1 = -1$ (Cumulative: $1 - 1 = \mathbf{0}$)
  *   Period 3: $2 - 1 = 1$ (Cumulative: $0 + 1 = \mathbf{1}$)
  *   Period 4: $0 - 1 = -1$ (Cumulative: $1 - 1 = \mathbf{0}$)

  **Verdict:**
  The cumulative difference oscillates between 1 and 0 indefinitely.
  *   Does A overtake B? No, because the cumulative lead drops back to equality infinitely often; it never stays *strictly* ahead.
  *   Does B overtake A? No, because B never takes the lead.
  *   **Result:** They are formally incomparable.

  **Reasoning:**
  Despite the incomparability, there is a palpable moral difference. Outcome A condemns every other generation to zero wellbeing, whilst Outcome B provides a stable floor for everyone. The overtaking criterion fails to capture the moral weight of stability versus volatility when long-run averages are identical.

  ***

  ### Part 3: The Decision

  If forced to choose between Outcome A $(2, 0, 2, 0 \dots)$ and Outcome B $(1, 1, 1, 1 \dots)$, I would choose **Outcome B**.

  **Reasoning:**
  Whilst the total sum of wellbeing is identical in the limit, ethics is not merely about aggregation; it is also about distribution across time. A sequence that periodically drops to zero wellbeing implies generations that suffer catastrophic deprivation. Even if the average is acceptable, allowing any generation to fall to zero violates a constraint against severe hardship that should trump mere averaging. I would prioritise the stability of Outcome B to ensure no generation is left behind, adopting a maximin approach across time rather than a purely utilitarian sum.
