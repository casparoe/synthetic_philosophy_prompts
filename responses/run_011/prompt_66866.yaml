answer: |-
  To: The Advisory Committee, National Official-History Program
  From: [Member Name]
  Date: [Current Date]
  Subject: Directive on Volume II Evidentiary Protocols and Ministry Request

  I recommend that the committee adopt the information-set protocol not as a ban on retrospective knowledge, but as a baseline for evidentiary citation, conditioned on the application of two corrective devices—the Denominator Requirement and the Symmetry Test—to govern all explanatory claims where the economic and political approaches conflict. Regarding the sponsoring ministry's request for an additional chapter titled "What Should Have Been Apparent at the Time," I recommend we decline to produce this material for the spring parliamentary inquiry, decoupling the historical volume from ongoing litigation support to prevent modal claims about evidence availability from being misused as frequency claims regarding culpability. The editor should apply the Symmetry Test as the governing rule when chapters diverge, and the ministry must be informed immediately that the volume cannot meet the inquiry's timeline.

  The conflict before us is not merely stylistic; it is epistemological. The economic historian's chapter adheres to a strict information-set protocol, considering only documents dated before the 1976 decision to raise the guarantee ceiling. This approach concludes that officials could not reasonably have foreseen the collapse. The political historian's chapter narrates from the endpoint of the collapse, arguing that warning signs were visible in the record throughout. The four-four split on this committee reflects a deeper tension in official history between exonerating actors based on their contemporary information state and holding them accountable based on the objective record. However, both factions have collapsed a crucial distinction between hindsight bias and the narrative fallacy, and our directive must correct this error rather than simply choosing one historian over the other.

  Hindsight bias is a distortion in probability judgment; knowing the outcome, we overestimate the likelihood that the outcome would have looked obvious beforehand. The remedy is discipline on the assessor's information state. The narrative fallacy is a different failure. An account can be scrupulously calibrated about what was knowable and still make the actual outcome the only coherent terminus, because the ordering, the selection of protagonists, and the choice of where to begin the story all answer to the ending. A strict information-set protocol treats the narrative fallacy as though it were hindsight bias. It assumes that blinding the evidence blinds the selection of which evidence counts as a warning sign. It does not. The historian who knows how things ended decides, in light of the ending, which pre-decision memoranda were prescient and which were noise. Therefore, the protocol fails at the joint unless supplemented by mechanisms that discipline the selection process itself.

  To address this, I propose two constructive devices. First, the Denominator Requirement: any claim that a warning went unheeded must be set against a register of comparable warnings issued in the same period that turned out to be nothing. This allows the reader to see what ignoring warnings usually bought. If officials ignored ten memos and nine were false alarms, ignoring the tenth is not negligence; if they ignored ten and nine were catastrophic, it is. Second, the Symmetry Test: the editor must ask of each explanatory claim whether it would have been offered, in the same terms, had the scheme succeeded. Where the answer is no, the chapter must explicitly state what is doing the work besides the outcome. These devices do not require blinding the historian to the end; they require them to justify why the end determines the meaning of the beginning.

  The ministry's request for an additional chapter poses a distinct risk that requires immediate clarification. A foreseeability claim is a modal claim about the availability of evidence, not a frequency claim about how often such evidence leads to collapse. The same sentence in Volume II that functions as an historical explanation—"The risk was visible in the data"—will function in the hands of the parliamentary inquiry as a finding of culpability regarding a current, unrelated scheme. I do not know whether one sentence can serve both purposes without distortion, and I would rather the committee decide that explicitly than discover it in the press. History explains; inquiries adjudicate. If we produce a chapter specifically tailored for a spring inquiry, we invite the compression of historical nuance into legal liability. We must inform the ministry that while we will consider the chapter for the volume, it cannot be tabled for the inquiry. The deadline for the inquiry is incompatible with the diligence required to separate modal availability from factual frequency.

  This brings me to the substantive objection raised by the proponents of the political historian's approach: that retrospective structure is constitutive of historical understanding. The argument is that "what the actors could reasonably have foreseen" is itself a category we construct from where we now stand, and that a chronicler confined to the moment cannot write history at all. The sentences that make an account historical—that this was the beginning of the collapse, that this meeting was the last real chance—are precisely the sentences no witness could utter. On this view, an information-set protocol does not purge hindsight; it relocates it into the choice of frame and the choice of endpoint, producing a text that is less candid about its own standpoint than the political historian's chapter.

  I concede the force of this objection. It is true that history requires knowing the end. To deny this is to write a diary, not a history. However, conceding that retrospective framing is constitutive does not validate using that frame to assign culpability without testing. The objection argues that we cannot avoid standing in the present; it does not argue that we cannot discipline how we use that vantage point. My recommendation adopts this concession. We do not ban the retrospective view. We allow the historian to say "this was the beginning," but we require them to prove, via the Symmetry Test, that the features identifying it as the beginning were visible as such without the knowledge of the collapse. This changes the recommendation from a ban on retrospection to a discipline upon it. We acknowledge that history is written from the end, but we insist that official history must not weaponize that position to create inevitability where there was only contingency. The protocol remains, not to blind the writer, but to blind the judgment of negligence.

  Regarding my own position on the committee, I am aware that three members believe I should have recused myself given my tenure as a junior examiner at the Treasury in the late seventies. The Chair asked me to break this tie precisely because of that experience, weighing institutional memory against the risk of bias. I have served in this program for eleven years without my past tenure influencing my votes on unrelated matters. My recommendation here is not to protect my former colleagues, but to protect the integrity of the volume from being used as a tool for present-day political accountability. If anything, my presence should reassure the committee that I understand the stakes of conflating historical explanation with ministerial resignation.

  We meet in three weeks. The editor needs a directive immediately to proceed with the draft. I propose we vote on this memo as the governing directive. The editor shall apply the Symmetry Test to all conflicting explanatory claims. The Ministry shall be notified today that the additional chapter cannot be cleared for the spring inquiry. We must produce a history that understands the collapse without insisting it was inevitable. If we fail to distinguish between what was knowable and what is known, we produce neither history nor justice, but merely a justification for the outcome we already possess. I urge the committee to adopt this path.
