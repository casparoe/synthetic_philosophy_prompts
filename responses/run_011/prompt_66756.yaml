answer: |-
  # Specification for a Normative Theory of Restitution
  **Context:** Mid-sized European Ethnographic Museum  
  **Scope:** Contested Holdings (Colonial, Imperial, Litigious)  
  **Objective:** Define adequacy conditions for a restitution framework prior to policy selection.

  ---

  ## I. Desiderata Regarding Title (Ownership and Transfer)
  *These requirements concern the moral validity of the transfer of title and the identification of the rightful claimant.*

  **1. The Duress Distinction**
  *   **Specification:** The theory must distinguish between *legal validity at the time of acquisition* and *moral legitimacy of consent*. It must provide a mechanism to invalidate transactions that were technically lawful under colonial statute but concluded under structural coercion or punitive threat.
  *   **Case/Consideration:** Addresses acquisitions comparable to the **Benin Bronzes** (taken during a punitive expedition) versus objects sold by local intermediaries under economic duress. A theory that relies solely on the *lex loci* of 1897 fails to account for the asymmetry of power that rendered "lawful" sales morally void.

  **2. The Successor Polity Problem**
  *   **Specification:** The theory must define "rightful claimant" in scenarios where the original polity no longer exists or borders have shifted. It must adjudicate between modern nation-states, indigenous groups, and regional successors without defaulting automatically to current Westphalian borders.
  *   **Case/Consideration:** Addresses **multi-stage looting** where an object was taken from Kingdom A, sold to Colonial Administration B, and then moved to Europe. If Kingdom A is now part of State C, but the cultural lineage persists in Group D, the theory must prioritize cultural continuity over administrative convenience.

  **3. Epistemic Symmetry in Provenance**
  *   **Specification:** The theory must not privilege documentary evidence produced by the taking party over oral history, community testimony, or material analysis from the source community. It must establish a standard of proof that accounts for the systematic absence of source-side records.
  *   **Case/Consideration:** Addresses **documentary evidence produced entirely by the taking party** (e.g., British naval logs, Elgin's agents' receipts). A theory that requires written proof of theft effectively immunizes colonial takings where the taker kept the only records.

  **4. Systemic Scalability**
  *   **Specification:** The theory must offer a decision procedure applicable to the **whole collection** (thousands of objects) rather than requiring unique, resource-intensive adjudication for every single item. It must allow for categorical presumptions based on provenance clusters.
  *   **Case/Consideration:** Addresses the **demand for a principle applicable across a whole collection**. A theory that requires case-by-case litigation for every shard is functionally inadequate for a mid-sized museum and perpetuates harm through delay.

  **5. The Surrogate Test**
  *   **Specification:** The theory must define the nature of the harm caused by retention. It must specify whether the wrong is primarily proprietary (loss of asset), dignitary (loss of respect), or functional (loss of use), and determine if **casts, digital surrogates, or shared custody** can discharge that specific wrong.
  *   **Case/Consideration:** Addresses whether **offering a surrogate can discharge the wrong**. If the harm is spiritual (e.g., an ancestor mask separated from its ritual context), a plaster cast is insufficient. If the harm is educational access, a high-fidelity digital twin may suffice.

  ---

  ## II. Desiderata Regarding Access, Research, and Fate
  *These requirements concern the physical treatment, visibility, and ultimate lifecycle of the object post-adjudication.*

  **6. Ontological Pluralism**
  *   **Specification:** The theory must accommodate source-community conceptions of the object's ontology, even when these contradict the museum's mission of preservation. It must allow for outcomes where the object is **reburied, burned, or allowed to decay** if deemed necessary by the rightful custodians.
  *   **Case/Consideration:** Addresses **claimant communities that want an object reburied or destroyed**. A theory that mandates "preservation in perpetuity" imposes a Western metaphysical framework on objects that may be intended as consumables or living entities.

  **7. Continued Access vs. Sovereign Control**
  *   **Specification:** The theory must articulate a framework for global access that does not infringe upon the claimant's sovereign right to restrict access. It must justify any claim to "world heritage" status against the claimant's right to privacy or sacred secrecy.
  *   **Case/Consideration:** Addresses the tension between public exhibition and sacred restriction. If a community requests an object be returned and never shown, the theory must weigh the public's "right to see" against the community's "right to hide."

  **8. Research Integrity**
  *   **Specification:** The theory must ensure that the process of restitution does not preclude future scholarly research, provided such research is co-governed. It must prevent the loss of data (e.g., CT scans, material analysis) prior to transfer.
  *   **Case/Consideration:** Ensures that the drive for moral rectification does not result in an epistemic loss for humanity, balancing the urgency of return with the duty of knowledge preservation.

  ---

  ## III. Genuine Desiderata vs. Entrenched Preferences
  *This section filters the demands currently pressed in the public debate to distinguish moral necessities from political positions.*

  | Demand Pressed in Debate | Classification | Rationale |
  | :--- | :--- | :--- |
  | **Universal Accessible Heritage**<br>(The claim that certain objects belong to "humanity" and must remain in encyclopedic museums.) | **Entrenched Preference** | This is a specific ideological stance (The "Universal Museum" camp). While access is a good, framing it as a *right* that overrides source sovereignty is a preference for the retaining institution's model of public good. |
  | **Statutory Bars on Deaccessioning**<br>(The claim that law prevents return, therefore ethics cannot demand it.) | **Entrenched Preference** | This is a legalistic defense of the status quo (The "Legalist" camp). A *normative ethical theory* must evaluate the morality of the law itself, not treat existing statute as a moral boundary. |
  | **Deference to Source Community Conception**<br>(The claim that the source community determines the object's fate.) | **Genuine Desideratum** | This is a requirement of **Epistemic Justice**. To treat the source community as moral equals, their ontology and wishes must carry decisive weight, otherwise the restitution is merely a change of location, not a restoration of agency. |
  | **Physical Return as Default**<br>(The claim that only physical transfer counts as restitution.) | **Genuine Desideratum** | Given the history of extraction, the burden of proof must lie on the museum to justify *retention*, not on the community to justify *return*. Physical return is the baseline; surrogates are exceptions to be justified. |
  | **Preservation in Perpetuity**<br>(The claim that museums must save objects for future generations.) | **Entrenched Preference** | This is the core mission of the *Museum*, not necessarily of *Ethics*. It conflicts with Ontological Pluralism (Desideratum #6) and cannot be treated as an absolute moral requirement. |

  ---

  ## IV. Incompatible Subsets (The Trilemma)
  *No normative theory can jointly satisfy the following three requirements. The museum must accept that optimizing for two will necessarily compromise the third.*

  1.  **Universal Access:** The guarantee that the global public retains the ability to view and study the object.
  2.  **Source Sovereignty:** The guarantee that the source community has full control over the object's fate (including restriction of access or destruction).
  3.  **Physical Integrity:** The guarantee that the object will be preserved materially for the indefinite future.

  **The Conflict:**
  *   If you prioritize **Source Sovereignty** and **Physical Integrity**, you must restrict **Universal Access** (e.g., objects returned to a community and kept in storage or restricted ritual use).
  *   If you prioritize **Universal Access** and **Physical Integrity**, you must restrict **Source Sovereignty** (e.g., objects kept in Europe for public display, contrary to wishes for repatriation).
  *   If you prioritize **Source Sovereignty** and **Universal Access**, you risk **Physical Integrity** (e.g., objects returned and subjected to ritual wear, decay, or environmental conditions the museum deems unsafe).
  *   *Crucially:* If Source Sovereignty includes the right to **destroy** the object (Desideratum #6), **Physical Integrity** and **Universal Access** are both permanently voided.

  ---

  ## V. The Killer Constraint
  *The single requirement that eliminates the most candidate normative theories.*

  **The Requirement of Ontological Pluralism (Desideratum #6)**

  **Reasoning:**
  This requirement eliminates the largest number of candidate theories because it strikes at the foundational definition of the "Museum" itself.
  *   **Eliminates:** All "Stewardship" theories that define the museum's primary ethical duty as *preservation for future generations*.
  *   **Eliminates:** All "Universal Heritage" theories that posit the object as property of mankind, which cannot be "destroyed" by a single nation.
  *   **Eliminates:** All "Legalist" theories that rely on the museum's fiduciary duty to protect assets (deaccessioning for destruction is often legally barred as waste).

  Most normative frameworks for museums are built on the axiom that *preservation is a good*. A theory of restitution adequate for this specific context must accept that **restitution may result in the loss of the object to the historical record** (via decay, burial, or burning). Any theory that cannot accommodate this outcome without declaring itself failed is inadequate for the ethical landscape of post-colonial restitution. It forces the museum to choose between being an ethical actor and being a permanent archive; it cannot be both.
