  # STUDENT HANDOUT: SCHOLARLY HABITS INVENTORY

  **Instructions:** Read the eight scenarios below. For each, circle the **single** option that best matches your immediate instinct. Do not overthink; there are no right answers.

  **1. The Obscure Thesis**
  A student wants to write on a philosopher nobody has read since 1911. They can't explain why this figure matters today. You advise them to:
  a) Find the one great insight this figure had and use it to solve a modern problem.
  b) Recover them simply because they belong to our intellectual lineage and deserve memory.
  c) Demand they justify the figure's value; if they can't, the topic is a burden we should drop.
  d) Tell them to write about what excites them now; the date doesn't matter.

  **2. The Corridor Portraits**
  The department has a bequest to replace the old oil paintings of dead professors with modern art. You argue:
  a) Keep the portraits; they remind us of the standards we must strive to meet.
  b) Keep the portraits; removing them severs our connection to the people who built this place.
  c) Remove them; they represent an exclusive hierarchy that stifles new voices.
  d) Replace them; art should reflect the present moment, not linger on the past.

  **3. First-Year Texts**
  How should we introduce first-years to the discipline?
  a) Give them the hardest primary texts immediately so they aim for the highest peaks.
  b) Start with the established textbooks that respectfully summarize the tradition.
  c) Give them texts that expose the discipline's historical biases so they can critique them.
  d) Give them contemporary articles; the old debates are irrelevant to their lives.

  **4. The Supervisor's Framework**
  A PhD student wants to open their thesis by demolishing their supervisor's central theory. You tell them:
  a) Use the theory as a ladder; climb it, then kick it away to reach higher ground.
  b) Acknowledge the theory as the foundation; you cannot build without it.
  c) Demolish it completely; you cannot be free while their shadow covers your work.
  d) Ignore the theory; focus only on the evidence in front of you now.

  **5. The War Memorial**
  A town council debates relocating a war memorial to make way for a new road. You suggest:
  a) Move it to a park where it can serve as an inspiring lesson in sacrifice.
  b) Leave it; it belongs to the specific ground where it was placed by ancestors.
  c) Remove it; it glorifies a conflict that causes present-day pain.
  d) Let the council decide based on traffic flow; the symbol is secondary to function.

  **6. The Reading Group**
  A group proposes a rule: no books published before 2015. Your reaction is:
  a) Accept it; we need tools for current battles, not old weapons.
  b) Reject it; we owe it to the authors who shaped our language to keep reading them.
  c) Reject it; banning old books is censorship that limits our critical judgment.
  d) Accept it; time is short, and we should focus on what is alive now.

  **7. The Family Heirloom**
  You inherit a heavy, ornate desk from a relative you disliked. You:
  a) Use it to write your best work, turning their legacy into something greater.
  b) Keep it untouched in a spare room; it is a sacred object that must be preserved.
  c) Sell it; the money is more useful than the burden of their memory.
  d) Break it up for firewood; you need warmth, not history.

  **8. Personal Failure**
  You fail a major exam. In the week after, you:
  a) Study the great successes of others to model how they bounced back.
  b) Review your past notes to ensure you didn't break any study traditions.
  c) Analyze exactly where the system failed you so you can fight it next time.
  d) Put it out of your mind; dwelling on it will only stop you from acting today.

