  # TUTOR'S KEY & ANALYSIS

  ### Scoring Key (Corridor Marking)
  Tally the circled letters. The dominant column determines the **Leaf**. (If tied, prioritize Q1, Q4, Q7).

  | Q | **A (Active/Striving)** | **B (Preserving/Revering)** | **C (Suffering/Breaking)** | **D (Un/Supra-historical)** |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **M+** (Emulator) | **A+** (Curator) | **C+** (Liberator) | **U** (Forgetter) |
  | **2** | **M-** (Idolater) | **A-** (Hoarder) | **C-** (Nihilist) | **S** (Contemplator) |
  | **3** | **M+** | **A+** | **C+** | **U** |
  | **4** | **M-** | **A-** | **C-** | **S** |
  | **5** | **M+** | **A+** | **C+** | **U** |
  | **6** | **M-** | **A-** | **C-** | **S** |
  | **7** | **M+** | **A+** | **C+** | **U** |
  | **8** | **M-** | **A-** | **C-** | **S** |

  *Note: M/A/C are split between Healthy (+) and Excess (-) based on question parity (Odd=Healthy, Even=Excess). U and S are distinct.*

  ### The Eight Leaves
  | Leaf Name | Predictable Next Action | Most Awkward Commitment |
  | :--- | :--- | :--- |
  | **1. The Emulator (M+)** | Seeks a mentor or hero to copy immediately. | Must ignore the context that made the hero successful. |
  | **2. The Idolater (M-)** | Distorts a biography to fit a current ambition. | Must lie about the past to make it useful. |
  | **3. The Curator (A+)** | Archives departmental records to nurture belonging. | Slows down necessary reform to protect tradition. |
  | **4. The Hoarder (A-)** | Refuses to discard obsolete texts or methods. | Prevents new work from living by crowding it out. |
  | **5. The Liberator (C+)** | Writes a critique to free the field from dogma. | Risks destroying foundations needed for future building. |
  | **6. The Nihilist (C-)** | Attacks a tradition out of personal resentment. | Leaves nothing to build on after the destruction. |
  | **7. The Forgetter (U)** | Starts a new project without literature review. | Cannot learn from mistakes; doomed to repeat them. |
  | **8. The Contemplator (S)** | Treats the module as art, not training. | Disengages from acting in time; becomes passive. |

  ### Instrument Limitations: Indistinguishable Pairs
  1.  **The Nihilist (C-) vs. The Defected Hoarder (A-):**
      *   *Why:* A student who has defected to a *new* tradition (A-) will attack their *old* training with the same ferocity as a Nihilist (C-). Both look like "critique."
      *   *Diagnosis:* Ask: "What are you protecting?" If they name a new canon, they are A-. If they name nothing, they are C-.
  2.  **The Forgetter (U) vs. The Contemplator (S):**
      *   *Why:* Both dismiss historical chronology. "Dates don't matter" fits both.
      *   *Diagnosis:* Ask: "Why?" If "because I need to act," it's U. If "because truth is eternal," it's S.
  3.  **The Idolater (M-) vs. The Liberator (C+):**
      *   *Why:* Both reshape the past. The Idolater shapes it for glory; the Liberator shapes it for justice. On paper, both involve "reinterpretation."
      *   *Diagnosis:* Check the beneficiary. If it serves the *self's ambition*, it's M-. If it serves the *field's freedom*, it's C+.

  ### Empty Cells: Combinations Not Covered
  The instrument forces a single dominant stance. It cannot map hybrid positions.

  1.  **Monumental about Self / Critical about Others**
      *   *Example:* "My lineage is inspiring; yours is oppressive."
      *   *Status:* **Unattractive.** Everyone claims this, but few admit it. It is the structure of hypocrisy. The instrument forces consistency, masking this common scholarly vice.
  2.  **Antiquarian about Method / Critical about Content**
      *   *Example:* "Use old rigorous methods to expose old toxic ideas."
      *   *Status:* **Unexplored.** A potent position (conservative form, radical content). Students should be encouraged to inhabit this cell; it offers stability for dangerous work.
  3.  **Break with Past to Preserve It**
      *   *Example:* "Destroy the department to save its reputation."
      *   *Status:* **Incoherent.** This is C- masquerading as A+. It is logically unstable and usually collapses into Nihilism (C-) once the destruction begins.
  4.  **Revere Everything / Imitate Nothing**
      *   *Example:* "All past work is sacred; therefore I will add nothing new."
      *   *Status:* **Incoherent.** Pure A- without M. It leads to silence. Nobody wants to be caught holding it because it admits to scholarly sterility.

  ### Usage Note
  This instrument measures *orientation*, not *competence*. A "Curator" can be a brilliant historian; an "Emulator" can be a shallow one. Use the result to prompt discussion: "You scored as a Liberator. What foundations are you risking by clearing the ground?"
