answer: |-
  Case A: Consider a centrifugal governor attached to a steam engine, consisting of two weighted balls on hinged arms that rise as the flywheel spins faster, mechanically throttling the steam intake. The device contains no map, no symbol for "speed," and no internal state representing the target RPM; it is merely a linkage of mass and leverage. Yet, when the engine's load fluctuates due to varying friction or resistance within a tested operational range, the governor reliably maintains the engine's speed within narrow limits. It succeeds across these perturbations not by calculating the error but by physically coupling the throttle position directly to the rotational velocity, stabilizing the system through dynamic feedback rather than representational guidance.

  Case B: Consider a steam engine fitted with a fixed, partially clogged steam valve that happens to restrict flow at a rate precisely matching the fuel consumption required to maintain the target RPM under the specific boiler pressure used during testing. Like the governor, the valve has no representation of speed or goal, and within the narrow range of frictional loads tested, the engine's speed remains as stable as in Case A. The internal poverty of states is identical—mere metal and steam—and the observed success rate across the tried inputs is indistinguishable, yet the valve's stability is a product of a static coincidence between the clog's geometry and the boiler's pressure rather than a dynamic response to the engine's behavior.

  **Verdict on Case A:** The inversion licenses an attribution of competence here because the system's success is grounded in a **dispositional sensitivity to the goal-variable itself**. The governor works *because* the speed changes; its mechanism is causally hooked to the very property it regulates. This is not luck because the success persists across counterfactual variations in load that were not explicitly tested but are covered by the mechanism's physical design.

  **Verdict on Case B:** We refuse to credit the valve with competence because its success is **parasitic on fixed background conditions** rather than sensitive to the goal-variable. If the boiler pressure drifted or the load changed outside the narrow tested band, the valve would not correct; it merely sits in a "sweet spot" of luck. The system does not track the goal; the environment tracks the system's limitations.

  **The Single Structural Feature:** The distinguishing feature is **counterfactual robustness via causal coupling to the error signal**. In Case A, the mechanism's state changes *in response* to deviations from the goal; in Case B, the mechanism's state is static, and the environment merely fails to perturb it within the test window.

  **Is this Feature Comprehension?** This feature is **not** a species of comprehension. Sensitivity to a variable (like a thermostat sensing heat) does not require a concept of that variable. It is a matter of causal topology, not semantic content. Therefore, the inversion holds: one can have robust, counterfactually supported competence (feedback loops) without any grasp of the "why" (representation).

  **The Skeptic's Reply:** The best reply for the skeptic is to argue that **competence is an extensional notion**, defined solely by actual performance in the actual world, not by modal profiles of what *would* happen in untested scenarios. From this view, our reluctance to credit Case B is a residue of top-down reasoning that privileges "active" correction over "passive" stability, but if the output is identical, the functional capacity is identical. To demand counterfactual robustness is to demand a guarantee of future performance, which no system possesses; thus, distinguishing A from B is metaphysical hand-waving that obscures the reality that both are simply well-situated physical processes producing reliable order.
