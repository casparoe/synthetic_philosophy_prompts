  Justice without force is beaten down,
  It lacks the sword to make its decree stand;
  No arm is there to guard the rightful land,
  And leaves the truth to fall upon the ground.
  Force without justice claims the king's own crown,
  It holds the sword to make the people stand;
  Too many arms to rule the conquered land,
  And sits a tyrant on the usurped town.

  Therefore we join them, though the bond is vain:
  Force moves the body, justice moves the mind;
  Custom is equity because received long,
  The fur-lined robe, the cap, the mules, the chain,
  And guards at doors keep reason far behind—
  The strong pronounced just, not the just made strong.
