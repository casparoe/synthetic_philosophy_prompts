answer: |-
  You are not being dense; you have put your finger on a genuine fault line in early analytic metaphysics. The intuition that these are distinct problems, despite their family resemblance, is correct. While they spring from the same combinatorial picture of the world—the idea that complexes are built from simples—they target different categories of being. Bradley is attacking the *reality* of the complex; the Unity problem is attacking the *significance* of the complex.

  Here is the breakdown you asked for, comparing the assumptions, the stakes, and the proposed solutions.

  ### 1. The Triggering Assumptions

  To get a regress or a puzzle off the ground, you need a specific picture of how parts relate to wholes. The assumptions required for Bradley's Regress and the Unity of the Proposition are similar in spirit but distinct in category.

  **Bradley's Regress** requires the assumption of **Ontological Parity**.
  For the regress to start, you must treat the relation ($R$) as the same kind of existent as the relata ($a$ and $b$). If $a$, $b$, and $R$ are all self-standing items in a list of existents, then $R$ is just another thing that needs to be tied to $a$ and $b$. If you deny this—if you say relations are not "things" in the same way terms are "things"—the regress cannot even begin. The engine of the regress is the demand that every connector must itself be connected, which only makes sense if the connector is the sort of thing that *can* be disconnected.

  **The Unity of the Proposition** requires the assumption of **Compositional Significance**.
  For this problem to bite, you must assume that a proposition is a complex entity whose meaning is derived from its parts, yet the whole must be more than the sum of those parts. The specific trigger is the distinction between a *list* and a *claim*. If you assume that the constituents of a sentence (names, predicates) contribute to the meaning independently, you face the problem of what turns that aggregate into something capable of being true or false. Unlike Bradley, you do not need to assume the predicate is a self-standing object. Even if the predicate is a function or a concept, you still need to explain how combining a name with a function yields a unified thought rather than just an unasserted combination of signs.

  **Are the assumptions the same?**
  No. Bradley's assumption is metaphysical (everything involved in a fact must be an object). The Unity assumption is semantic (the parts of a sentence must combine to yield a truth-value). You can reject Ontological Parity (stopping Bradley) while still retaining Compositional Significance (leaving Unity intact). This confirms your suspicion: solving one does not automatically solve the other.

  ### 2. Ontology vs. Meaning: Where the Damage Lands

  You asked which problem is more dangerous for a facts ontology and which for a theory of meaning. The distinction is sharp.

  **Bradley's Regress is lethal for a Relational Ontology.**
  If Bradley is right, external relations are unintelligible. If you cannot explain how a relation hooks onto its terms without an infinite chain of further relations, then relational facts cannot exist. This destroys the pluralistic view of the world. If facts cannot be built from terms and relations, then reality must be a single, undifferentiated One (which was Bradley's own conclusion). For anyone trying to build a world out of states of affairs (like Russell or the early Wittgenstein), Bradley is an existential threat. It says your building blocks cannot actually be assembled.

  **The Unity Problem is lethal for a Combinatorial Semantics.**
  If you cannot solve the Unity problem, your theory of meaning collapses into a naming theory. If a proposition is just a list of constituents, it cannot be false (lists aren't false), and it cannot assert anything. This destroys the possibility of logic and truth-conditions. For Frege and Russell, who needed propositions to be the bearers of truth and falsity, this is the primary danger. It doesn't necessarily mean the world isn't complex; it means *language* cannot map that complexity.

  **Verdict:** Bradley threatens the *existence* of the world's structure. Unity threatens the *representability* of that structure.

  ### 3. The Blocking Moves: Frege vs. Wittgenstein

  Now let's look at the two standard ways of stopping these puzzles and how they relate to each other.

  **The Fregean Move (Unsaturatedness)**
  Frege blocks Bradley by denying Ontological Parity. Concepts and relations are not objects; they are unsaturated. They do not need a further glue to connect them to objects because their very nature is to require completion. An object fits into a concept like a key into a lock; you don't need a third thing to connect the key to the lock.
  *   *Does this solve Unity?* Frege thinks so. The unsaturated nature of the predicate provides the binding force that turns a list into a proposition.
  *   *The Catch:* As you suspected, this pushes the problem. It solves the ontological connection (how things stick together in the world) by making it a logical feature. But it creates an epistemic problem: How does the mind "grasp" an unsaturated entity? If concepts are essentially different from objects, how do we think about them without turning them into objects? This is where your worry holds water. Frege solves the metaphysical regress but risks a semantic mystery about how we access these incomplete entities.

  **The Wittgensteinian Move (Internal Form)**
  In the *Tractatus*, Wittgenstein blocks Bradley by denying that combination is an extra ingredient at all. Objects contain the possibility of all states of affairs they can enter. The form of the fact is internal to the objects. You don't need a relation to connect $a$ and $b$ because if $a$ and $b$ exist, and the world exists, their possible combinations are already fixed.
  *   *Does this solve Unity?* Yes, but by changing the picture of the proposition. A proposition is not a complex name; it is itself a fact (a propositional sign in a significant relation). The unity of the proposition mirrors the unity of the fact because both are structural, not compositional in the "brick-and-mortar" sense.
  *   *Relation to Frege:* Wittgenstein's move is more radical. Frege still treats functions as a kind of entity (albeit a strange one). Wittgenstein dissolves the entity status entirely. In a way, Wittgenstein presupposes Frege's insight (that the verb isn't a name) but rejects Frege's ontology (that concepts are a type of referent). Wittgenstein agrees that unsaturatedness stops the regress, but he argues that unsaturatedness implies we shouldn't treat the predicate as a constituent *at all*.

  **Are they rivals?**
  They are rival ontologies that share a semantic insight. Both agree that the verb is not a name. But Frege tries to save the idea that predicates refer to something (concepts), whereas Wittgenstein argues that trying to say what predicates refer to is nonsense. Wittgenstein's solution presupposes that Frege was right to reject Ontological Parity, but wrong to think that "unsaturated entities" were a coherent category.

  ### 4. Evaluating Your Hypothesis

  You wrote: *"Bradley's regress is only vicious if you insist that a relation is self-standing... Whereas the unity problem bites even if you deny that... If that's right the two problems come apart, and a Fregean-style solution can only ever fix one of them."*

  This is a robust distinction. Here is why you are right to trust it.

  Bradley's Regress is indeed dependent on the reification of the relation. If you accept Frege's unsaturatedness, Bradley's Regress is dead. You cannot generate an infinite chain of connectors if the first connector doesn't need connecting. So, Frege successfully neutralizes the ontological threat.

  However, you are also right that the Unity problem survives. Even if relations are unsaturated, we still need to explain what makes a specific instance of saturation a *truth-apt unity*. Frege's answer is that the unsaturatedness *is* the unity. But your worry is that this just moves the mystery from "how do they connect?" to "what is unsaturatedness?" If unsaturatedness is a primitive brute fact, then Unity is "solved" only by stipulation. If it requires explanation, we risk a new regress (how do we grasp the unsaturated?).

  So, the Fregean solution acts as a universal solvent only if you are willing to accept a primitive logical distinction between object and concept as the ultimate explanation. If you demand an explanation of *that* distinction, the Unity problem re-emerges as a problem about cognitive access or semantic composition.

  ### Conclusion: One Problem or Two?

  They are two different problems generated by one picture.

  The shared picture is **Combinatorialism**: the idea that complexes are built from independent simples.
  *   Bradley shows that if you take Combinatorialism seriously in **metaphysics**, you can't build the complex (the fact).
  *   The Unity problem shows that if you take Combinatorialism seriously in **semantics**, you can't build the complex (the proposition).

  Frege's unsaturatedness is an attempt to modify Combinatorialism so it works for both. He says: "The parts aren't all independent; some are essentially dependent." This stops Bradley (metaphysically) and aims to stop Unity (semantically).

  But your intuition is correct: it is more successful at the former than the latter. It definitively blocks the ontological regress by changing the category of the relation. But it leaves the semantic unity as a primitive feature of logic that we must simply accept. For a seminar paper, this is a fertile spot to stand: you can argue that early analytic philosophy treated these as the same problem to allow Frege's solution to do double duty, but that they actually pull apart, leaving the Unity of the Proposition as the harder, lingering ghost that haunts the *Tractatus* and beyond.

  You aren't redescribing the same worry; you are identifying the point where the metaphysics of facts diverges from the semantics of sentences. That is exactly where the action is in this period.
