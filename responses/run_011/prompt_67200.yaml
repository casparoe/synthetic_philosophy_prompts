prompt: |-
  I'm in a grad seminar on early analytic philosophy and we did Bradley and Frege back to back this week, and honestly I can't tell whether we're dealing with one problem wearing two hats or two genuinely different problems. My seminar paper is on something else entirely (Russell's theory of judgment, don't ask) but this keeps nagging at me. So: compare Bradley's regress — the argument that you can't build a relational fact out of terms plus a relation, because then you need a further relation to hook the first relation onto its terms, and so on forever — with the unity of the proposition problem, i.e. the question of what makes "a is to the left of b" one sayable thing rather than a mere list of constituents. A bunch of people in my class act like the second is just the first applied to sentences, and like Frege's unsaturatedness story answers both at once. I don't buy it and I want to know whether I'm right or just being dense.

  To get concrete: suppose you swallow the Fregean picture, where the predicate is incomplete or unsaturated and that incompleteness is what does the binding work. Then (a) does Bradley's regress even get started, since there's no self-standing relation sitting there needing an extra nexus, and (b) is the unity problem actually solved, or just pushed somewhere else — into how an unsaturated thing can be grasped at all, or into the question of what makes the *sentence* complete? I want a real comparison rather than two summaries stuck together. So: state explicitly what assumption each regress needs in order to get going (what's the claim that, if you deny it, kills the regress dead?), say whether those assumptions are the same or different, and then tell me which of the two problems is more dangerous for a facts/states-of-affairs ontology and which is more dangerous for a theory of meaning. Also compare the two usual blocking moves against Bradley — the Wittgensteinian one where states of affairs aren't objects glued by a relation because the form is already there in the objects, versus the Fregean unsaturatedness one — and say whether they're rival answers or whether one quietly presupposes the other.

  Here's the thing I've been chewing on, tell me if it's confused: it looks to me like Bradley's regress is only vicious if you insist that a relation is self-standing, that "to the left of" denotes an item you could list on a piece of paper next to a and b. Whereas the unity problem bites even if you deny that, because there the trouble isn't the relation needing a hook, it's that the whole has to come out as one thing and not a heap. If that's right the two problems come apart, and a Fregean-style solution can only ever fix one of them, which would be a pretty big deal for anyone who thinks unsaturatedness is the universal solvent here. Is that a real distinction or am I just redescribing the same worry in two vocabularies? No bibliography, I'll chase down sources myself, and please paraphrase rather than putting things in quotation marks — I don't have the texts in front of me and I'd have no way of checking whether a quote is accurate, so I'd rather not be misled somewhere in the middle of a paragraph.
