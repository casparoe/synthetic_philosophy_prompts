      The slowest history is the valley itself. The river cuts through the rock regardless of who owns the banks. The soil here is thin and rocky. That decided early on that we wouldn't be a place of big farms. We watched the river drop so low last summer you could walk across the ford in August. That wasn't about us. That was the land doing what it does, waiting for the water to come back or not.

      The middle speed is the rhythm of work and people. This town grew when the mill switched to wooden bobbins. It kept going for sixty years. The railroad brought things, then the passenger service stopped in the fifties. The tracks came up in the nineties and became a walking trail. The state highway got rerouted around us in the seventies. Our population peaked over four thousand in the fifties. It's about eleven hundred now. The mill building is self-storage with one apartment upstairs. These changes didn't happen overnight, but they didn't last forever either. They are the tides that brought people in and took them out.

