  The middle speed is the rhythm of work and people. This is the time of economies and generations. This town grew when the mill switched to making wooden bobbins for thread. It kept going for sixty years. The railroad brought things, then the passenger service stopped in the fifties. The tracks came up in the nineties and became a walking trail. The state highway got rerouted around us in the seventies. Our population peaked over four thousand in the fifties. It's about eleven hundred now. The mill building is self-storage with one apartment upstairs. These changes didn't happen overnight, but they didn't last forever either. They are the tides that brought people in and took them out.

  The fastest speed is the one we live in. It's the specific floods that everyone still dates things by. It's the year the plant shut. It's who was mayor. It's this weekend. It's the folding chairs on the lawn. It's also the announcement that the high school consolidates with the district two towns over starting next year. The State Representative is sitting right there, and my mom drives forty minutes each way to her job now. These things feel huge because they are happening to us, right now.

  Some historians call this top layer froth. They say it sparkles but doesn't have weight. They say only the slow stuff matters. But I don't think that's right for us. The slow stuff—the river, the soil—it sets the stage. The middle stuff—the mill, the road—it builds the set. But the fast stuff is where the actors stand.

  For the people in the front rows who worked at the mill, or remember the flood waters hitting the porch steps, that fast history isn't shallow. It's where you lived. The river doesn't care if the mill closed, but you did. The highway bypass doesn't care about the population drop, but families had to decide whether to stay or go.

