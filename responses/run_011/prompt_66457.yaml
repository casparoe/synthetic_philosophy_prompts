      *   However, it might be slightly too charitable to B. B likely thinks the lock *fails* as a hard constraint too (courts find "impossibility" easily).
      *   The core tension is about *Time and Agency*. Can the "Trust" of 2024 be bound by the "Trust" of 1998?

  4.  **Categorize the Disagreement:**
