      *   *Camp A's View:* Institutional identity is static/fiduciary. The board is an agent of the *founders/donors*. Constraint is external/legal.
      *   *Camp B's View:* Institutional identity is dynamic/political. The board is an agent of the *current community/context*. Constraint is internal/normative.
