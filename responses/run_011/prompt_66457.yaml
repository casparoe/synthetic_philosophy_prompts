      *   *Is it about Legitimacy?* Yes. Where does the board's authority come from? (Past donors vs. Present stakeholders).

  5.  **Formulate the Diagnosis:**
      *   The disagreement is primarily about **Source of Legitimacy** and **Temporal Agency**.
      *   Camp A: Legitimacy flows from the Past (Donors/Founders). The Board is a *fiduciary of a dead hand*.
      *   Camp B: Legitimacy flows from the Present (Current Board/Community). The Board is a *steward of living assets*.
      *   The "Binding" question is secondary to the "Who owns this?" question.
      *   It is *not* purely resolvable by evidence because the evidence is interpreted through these legitimacy lenses.

  6.  **Determine What Counts as Progress:**
      *   Since it's not purely empirical, more data won't fix it.
      *   Since it's not purely verbal, defining terms won't fix it.
      *   Progress requires shifting the question from "How do we bind?" to "What happens if we fail?" (Risk asymmetry).
      *   Or, acknowledging the "Dead Hand" problem explicitly.
      *   The "Progress" move is to stop arguing about *mechanism efficacy* and argue about *risk tolerance*.
