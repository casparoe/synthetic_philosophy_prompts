answer: |-
  This is a classic problem in moral philosophy known as the **Infinite Ethics Problem**. Your brother-in-law (BIL) is not playing a word trick; he is referencing a genuine technical difficulty that keeps professional ethicists up at night. However, his conclusion (that you should stop donating) is far too strong.

  He has presented the "naive" version of the problem. Professional consequentialists accept the challenge but have developed several robust ways to solve it without abandoning morality.

  Here is the breakdown of where the argument breaks, which step you should reject, and the cost of doing so.

  ### The Weak Link: Step 3 and Step 5
  The most vulnerable point is the move from **Step 3** ("adds up to an infinite total") to **Step 5** ("Infinite equals infinite, so no act... produces more").

  Your BIL is treating moral value like simple arithmetic with a single symbol ($\infty$). But in mathematics and decision theory, not all infinities are comparable in that way, and we don't have to sum things naively to rank them.

  #### Fix 1: Temporal Discounting (Rejects Step 3)
  The easiest fix that preserves consequentialism is to reject the idea that future wellbeing counts equally regardless of *when* it happens.
  *   **The Fix:** You apply a "discount rate" to future wellbeing. Just as \$100 today is worth more than \$100 in 100 years, you can value a life today slightly more than a life 1,000 years from now.
  *   **The Math:** If you discount the future geometrically (e.g., each year counts 1% less than the previous), an infinite timeline sums to a **finite number**.
  *   **The Result:** Step 3 becomes false. The total value is finite, so your donation *does* change the total sum.
  *   **The Cost:** Some philosophers find discounting "discriminatory" against future people. However, most economists and decision theorists accept some discounting is necessary for rational planning.
  *   **Survival Check (Awful Lives):** This works perfectly. Infinite suffering discounted over time also sums to a finite negative number. You can still compare the totals.

  #### Fix 2: The Pareto Principle (Rejects Step 5)
  If you refuse to discount the future, you must reject Step 5's claim that you can't compare infinities. You can rank two infinite worlds without summing them.
  *   **The Fix:** Use a **Spatiotemporal Expansion** principle. Imagine the universe is a grid. In World A, every 10x10 block has a certain amount of good. In World B, every 10x10 block has *more* good. Even if both totals are infinite, World B is better because it is better *everywhere locally*.
  *   **The Math:** This relies on order and density, not just cardinality. It's like comparing the set of all even numbers (2, 4, 6...) to the set of all integers (1, 2, 3...). They are both "countably infinite," but we can still say one contains more value per capita or per region.
  *   **The Result:** Your donation creates a "bubble" of improved wellbeing. If you can expand that bubble or make the density of good higher within it, you have improved the world, even against an infinite background.
  *   **The Cost:** It requires a more complex moral calculus than "just sum the total." It also runs into trouble if the "background" infinite universe is chaotic (some regions good, some bad) rather than uniform.
  *   **Survival Check (Awful Lives):** This is trickier. If there are infinite awful lives, you can't just sum them. But you can still argue that *reducing* suffering in your causal sphere is a Pareto improvement (better for those people, neutral for the distant infinite others).

  ### The Theoretical Link: Step 1 (Total Utilitarianism)
  You mentioned you'd rather not give up Step 1, but it is worth noting that Step 1 describes **Total Utilitarianism** specifically, not all consequentialism.

  *   **Average Utilitarianism:** If you maximize the *average* wellbeing per person rather than the *total*, infinity vanishes as a problem. (Infinity divided by Infinity is undefined, but you can compare local averages).
      *   *Cost:* This leads to the "Repugnant Conclusion" in reverse (better to have one extremely happy person than a billion happy people).
  *   **Person-Affecting View:** Morality is about making *particular* people better off, not adding abstract value to the universe.
      *   *Cost:* It struggles with "non-identity problems" (actions that change *who* is born).

  ### The Epistemic Link: Step 7
  Step 7 claims: *"I can't rule out that [the universe is infinite], so I can never know..."*

  This is an epistemological error similar to **Pascal's Mugging**.
  *   **The Argument:** Just because you cannot *rule out* a scenario with 0% certainty doesn't mean it should dominate your decision. If the probability of the universe being infinite is low (or undefined), and the probability of it being finite is high, Expected Utility Theory tells you to act based on the finite case.
  *   **The Fix:** Treat the infinite case as a "measure zero" problem or apply a cap on utility.
  *   **The Cost:** You have to accept that you are acting on probabilities, not certainties. But you already do that with everything (e.g., you donate assuming the charity *probably* works).

  ### Recommendation: Which Step to Reject?

  **Reject Step 3 via Discounting.**

  This is the cleanest solution for a practical consequentialist.
  1.  **Why:** It preserves the structure of consequentialism (Step 1) without requiring complex new math for comparing infinities (Step 5). It renders the total sum finite, allowing your donation to mathematically increase the total value.
  2.  **Cost:** You must accept that a life saved 1,000 years from now is morally weightier than a life saved 1,000,000 years from now. Given that you are focusing on "long-run future" work, this is a very reasonable concession.
  3.  **Awful Lives:** It survives the "infinite suffering" test. If suffering is discounted, the total negative value is finite, and you can still work to reduce it.

  ### Is this a genuine problem or a word trick?
  It is a **genuine technical problem** for *naive* Total Utilitarianism, but it is not a **fatal problem** for consequentialism as a whole.

  Your BIL is correct that *if* you hold a specific, rigid version of consequentialism (Naive Total Summation) *and* the universe is infinite *and* you refuse to discount the future *and* you demand cardinal comparison of infinities, *then* you get paralysis.

  But that is a lot of "ifs." Philosophers generally view the Infinite Ethics Problem as a reason to refine the theory (e.g., add discounting or use Pareto principles), not to abandon the project of doing good.

  **The Verdict:**
  Tell your brother-in-law you are adopting **Discounted Utilitarianism**. The sum is finite. Your donation adds to the sum. Therefore, your donation is morally superior to keeping the money. Keep donating.

  *(Note: If he argues that discounting is morally repugnant, ask him if he would save a child drowning in front of him over a child drowning on Mars. If he says yes, he is already discounting by spatial/causal proximity, which solves the problem similarly.)*
