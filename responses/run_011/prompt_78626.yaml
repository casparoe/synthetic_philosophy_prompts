  1. A polity falls when its foundational source of legitimacy is extinguished or fundamentally inverted (Roman Republic under Augustus, Constantinople 1453, Soviet Union 1991); it transforms when new rulers merely appropriate that legitimacy while maintaining operational structures and constitutional vocabulary (Ming to Qing, loss of Syria and Egypt, Fourth Crusade).
  2. Augustus marks a fall because sovereignty shifted from the Senate to the Princeps despite preserved forms, and 1453 is a fall because the Christian imperial constitution was replaced by an Islamic Sultanate despite titular claims. Consequently, 476 must be classified as a transformation, since Odoacer governed through Roman offices under Eastern auspices rather than extinguishing the Roman constitutional framework.
  3. Babylon in 539 BCE was a transformation because Cyrus adopted Babylonian royal titles and religious duties to maintain continuity. Venice in 1797 fell because its Great Council voluntarily abolished the republican constitution that generated its legitimacy.
  4. This principle cannot keep your verdict that the Western Empire fell in 476, which you should replace with the view that the Western imperial office was abolished while Roman political culture survived in Italy.
  5. I would change my mind if you could demonstrate that the Soviet Union's legitimacy rested on Russian statehood rather than Communist ideology, or if I have wrongly assumed that constitutional forms matter more than the lived experience of subjects.
