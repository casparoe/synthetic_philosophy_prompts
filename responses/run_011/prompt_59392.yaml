  | (D) Gouging | 0.2 | 0.1 | 0.1 | 0.4 | 0.6 | 0.7 | 0.4 |
  | (E) Surrogacy | 0.8 | 0.7 | 0.7 | 0.5 | 0.7 | 0.5 | 0.5 |
  | (F) Prison | 0.8 | 0.1 | 0.1 | 0.9 | 0.9 | 0.8 | 0.8 |

  **Case (A) Decomposition**

  *   **Degradation:** 0.35
  *   **Hollow Consent:** 0.20
  *   **Exploitation:** 0.10
  *   **Corruption of the parties:** 0.10
  *   **Expressive harm:** 0.15
  *   **Misallocation:** 0.05
  *   **Erosion:** 0.05
  *   **Total:** 1.00

  **Most Confident Entry:** Degradation (0.35). The core intuition against organ markets is that putting a price on a body part fundamentally alters its nature from an inalienable aspect of the self to a fungible commodity, independent of the welfare consequences.

  **Suspected Borrowed Work:** Exploitation (0.10). I suspect this entry is doing borrowed work for Hollow Consent. When observers claim the transaction is exploitative, they are often pointing to the seller's lack of alternatives (Hollow Consent) rather than a distinct mechanism where the buyer specifically extracts surplus *because* of those poor options; the moral weight lies in the vulnerability itself, not the buyer's calibration to it.

  **Single Mechanism Selection**

  I would retain **Degradation (1)** as the general explanation of market repugnance.

  This choice gets **Case (D) (Price Gouging)** wrong.

  **Direction:** **False Negative.** The Degradation mechanism predicts low repugnance for Case (D) because pricing bottled water does not intrinsically change what water *is* (it remains a fungible necessity, not a sacred good or body part). However, the felt repugnance for price gouging is extremely high, driven primarily by fairness and need-based concerns (Misallocation/Hollow Consent of the *buyer*) rather than the commodification of the good itself.
