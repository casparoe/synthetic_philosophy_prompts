answer: |-
  Your intuitions are not random; they are remarkably consistent with a specific school of political philosophy known as **Constitutional Democracy with Epistemic Constraints**. You are instinctively distinguishing between *ordinary policy*, *fundamental rights*, and *meta-rules* (the rules about how we make rules), even though you are trying to force them into a single flat rule.

  Your tentative rule (Affected + Opinion + No Lock-out) is a good heuristic, but it fails to explain *why* a 52% vote on drugs is voidable while a 52% vote on treaties is not. Both affect everyone, both are opinions, and both can be reversed (legislatively or via re-entry).

  Here is the principle that actually underlies your list, the test against your new cases, and the price you have to pay to keep it.

  ### The Principle: The Hierarchy of Democratic Competence

  Democracy is not a single tool; it is a stack of three distinct tools, each with different validity thresholds.

  1.  **Epistemic Limit (Truth vs. Value):** Voting is a mechanism for aggregating *preferences* and *values*, not for determining *facts*. A majority cannot vote a falsehood into truth.
  2.  **Agency Distinction (People vs. Policy):**
      *   **Electing Agents (Representatives):** Low threshold (plurality/low turnout ok). Why? Because agents are flexible; they compromise, negotiate, and can be fired soon.
      *   **Enacting Policies (Referendums):** Higher threshold (quorums/majorities). Why? Because laws are rigid; they bind the future and lack the flexibility of negotiation.
  3.  **The Constitutional Hierarchy (Ordinary vs. Meta):**
      *   **Tier 1: Ordinary Policy** (Second homes, taxes). Simple majority is fine.
      *   **Tier 2: Fundamental Rights** (Minarets, criminal liberty). Simple majority *cannot* strip these. Requires judicial review or supermajority.
      *   **Tier 3: Meta-Rules** (Courts, Secession, Binding Future Votes). These change the system itself. They require "Dual Majorities" or Supermajorities because a simple majority cannot alter the playing field for the next majority.

  ---

  ### Testing Your List Against the Hierarchy

  | Your Case | Verdict | Which Tier? | Why it fits |
  | :--- | :--- | :--- | :--- |
  | **Minaret Ban** | Void | **Tier 2 (Rights)** | Violates fundamental religious freedom. Majority cannot vote away minority rights. |
  | **Second Homes** | Stick | **Tier 1 (Policy)** | Economic regulation. Ordinary policy. 51% is sufficient. |
  | **Treaty Exit** | Stick | **Tier 3 (Meta)** | *Tension here.* You treat this as binding at 52%. This implies sovereignty is an "Ordinary" asset, not a Meta-structure. |
  | **Drug Felony** | Voidable | **Tier 2 (Rights)** | Criminal law restricts liberty. 52% is too thin a margin to incarcerate citizens. |
  | **Abolish Court** | Supermajority | **Tier 3 (Meta)** | You cannot use the rules to destroy the referee. Requires broad consensus. |
  | **Re-run (3mo vs 4yr)** | No / Yes | **Agency** | 3mo is manipulation (fatigue). 4yr + failed deal is *new information* (changed circumstances). |
  | **Turnout (Measure vs Election)** | Void / Ok | **Agency** | Elections choose flexible agents. Measures choose rigid laws. Low turnout on rigid law is dangerous. |
  | **Vaccine Fact** | Void | **Epistemic** | Voting on reality is category error. |
  | **Secession (Region/City)** | Dual / No | **Tier 3 (Meta)** | Region: Alters constitutional border (Dual majority). City: Breaks administrative viability (Universalizability). |

  **Where your tentative rule failed:** It couldn't explain why the Drug Felony (52%) is voidable but the Treaty (52%) is binding. The Hierarchy explains it: One is a rights violation (Tier 2), the other is a sovereign status change (Tier 3) where stability is prioritized to prevent chaos.

  ---

  ### Applying the Principle to Your New Cases

  **1. A citizens' assembly recommendation put to a popular vote.**
  *   **Verdict:** **Valid, but Tier 1.**
  *   **Reasoning:** A citizens' assembly is a deliberative body, but once it goes to a popular vote, it becomes a standard referendum. It is subject to the Hierarchy. If the recommendation violates Tier 2 (Rights) or Tier 3 (Meta-rules), it is void regardless of the assembly's endorsement. It does not gain "extra" validity just because an assembly liked it.

  **2. A referendum that makes all future referendums binding.**
  *   **Verdict:** **Void (unless Supermajority).**
  *   **Reasoning:** This is a **Tier 3 (Meta-Rule)** change. It is the "Dead Hand" problem. A simple majority today cannot shackle the hands of all future majorities. This removes the "No Lock-out" clause from your tentative rule. To pass, this would need the same supermajority threshold as abolishing the constitutional court.

  **3. The "Bad Cost Estimate" Re-run (10% off, 2 years later).**
  *   **Verdict:** **Legitimate (Good Re-run).**
  *   **Reasoning:** This aligns with your "Treaty Deal Fell Apart" intuition. A vote is a mandate based on specific representations. If the cost estimate was a material condition of the vote, and it proves false, the *informational basis* of the consent has collapsed. This is not voter fatigue; it is contract violation. The vote should be re-validated.

  ---

  ### The Cost: What You Have to Give Up

  You asked me to tell you plainly which verdicts my principle has to give up, or what machinery is required to save them.

  **1. The Contradiction: Treaty Exit vs. Court Abolition**
  *   **The Conflict:** You say abolishing the Constitutional Court (Tier 3) needs a supermajority, but Leaving a Treaty Union (also Tier 3) is binding at 52%.
  *   **The Fix:** To be consistent, **Leaving a Treaty Union should also require a supermajority or dual majority.**
  *   **The Cost:** If you keep the 52% threshold for Treaties, you must admit that *sovereignty is cheaper than justice*. You are saying it is easier to leave a union than to protect the rights of a minority. My principle forces you to raise the bar for Treaty Exit to match the Court Abolition bar.

  **2. The Machinery Cost: You Need the Court You Almost Abolished**
  *   **The Conflict:** You want the Minaret Ban and Drug Felony to be voidable. Who voids them? The Legislature? If the Legislature reflects the same 52% majority, they won't void it.
  *   **The Fix:** You need an **unelected Constitutional Court** to strike down the Tier 2 violations.
  *   **The Cost:** You intuitively feel the Court Abolition vote should be hard to pass (good), but your desire to stop the Minaret Ban *requires* that Court to exist and have power. You cannot have "Majority Rule" on rights without a "Counter-Majoritarian" institution to enforce the limit. You have to accept that **democracy requires undemocratic guards.**

  **3. The City Secession Absurdity**
  *   **The Conflict:** You feel City Secession is absurd but can't say why.
  *   **The Fix:** **The Principle of Universalizability.** If every city can secede, the state dissolves into chaos. If every region can secede, the nation dissolves (which you seem to accept as a valid, if grave, possibility).
  *   **The Cost:** You must accept that **administrative viability trumps local self-determination** at the lowest level. A city is a service provider; a region is a political community. You have to draw a line where "identity" outweighs "logistics."

  ### Summary
  Your gut is working perfectly; your rule was just too flat.
  *   **Keep:** The distinction between facts, rights, and rules.
  *   **Patch:** Raise the threshold for Treaty Exits to match Constitutional changes.
  *   **Accept:** That to protect the Minaret voters' rights, you must empower the Judges you are wary of.

  If you refuse to empower the Judges, you must let the Minaret Ban stand. You cannot have both pure majoritarianism and protected minority rights.
