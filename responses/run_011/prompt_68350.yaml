          2.  Second homes cap (51%) -> *Should stick* (Economic regulation?).
          3.  Leaving treaty union (52-48) -> *Binding* (Sovereignty/Status Quo change?).
          4.  Drug felony (52-48) -> *Not binding* (Minority rights/Criminal justice?).
          5.  Abolish constitutional court (52-48) -> *Needs supermajority* (Meta-constitutional/Checks & Balances).
          6.  Re-running vote (3 months vs. 4 years) -> *3 months illegitimate, 4 years legitimate* (Cooling off/Changed circumstances).
          7.  Low turnout measure (80-20, 18% turnout) vs. Election (35% vote) -> *Measure void, Election ok* (Mandate type/Quorum).
          8.  Vote on fact (Vaccine efficacy 70%) -> *Void* (Epistemic authority).
          9.  Secession (Region vs. Whole Country vs. City) -> *Region + Country yes, City no* (Scale/Constitutional Order).
      *   **User's Tentative Rule:**
          1.  Everyone affected votes.
          2.  Question is opinion-based, not technical/factual.
          3.  Losing doesn't lock losers out of future votes.
      *   **Tasks:**
          1.  Test the tentative rule against the list.
          2.  Patch or replace the principle.
          3.  Apply the new principle to three new cases (Citizens' Assembly, Binding Future Referendums, Cost Estimate Re-run).
          4.  Identify which of the user's verdicts must be sacrificed or what "extra machinery" (complexity) is required to save them.

  2.  **Deconstruct the User's Intuitions (The "Why"):**
      *   *Minaret Ban:* Violates fundamental rights of a minority (religious freedom). Majority tyranny.
      *   *Second Homes:* Economic zoning. Affects property rights but within normal legislative scope.
      *   *Treaty Union:* High stakes, but status quo change. Once done, hard to undo. Stability needed.
      *   *Drug Felony:* Criminalizing behavior affects liberty. 52% is too thin a margin for restricting liberty.
      *   *Constitutional Court:* This is the "guardian of the rules." You can't use the rules to destroy the guardian without broad consensus. Meta-rule change.
      *   *Re-runs:* 3 months is voter fatigue/manipulation. 4 years + failed deal is new information.
      *   *Turnout (Measure vs. Election):* Elections select *agents* (representatives) who compromise. Measures select *policies* which are rigid. Low turnout on policy is risky. Low turnout on agents is normal (plurality).
      *   *Vaccine Fact:* Democracy decides *values/policies*, not *truth*.
      *   *Secession:* Breaking the constitutional order. Needs higher bar. City vs. Region is about administrative viability and nested sovereignty.

  3.  **Evaluate the User's Tentative Rule:**
      *   *(1) Everyone affected votes:* Fails on Secession (Whole country votes on region leaving? User says yes, but technically the region is more affected). Fails on Minaret (Majority voted, minority affected).
      *   *(2) Opinion vs. Technical:* Handles the Vaccine case well. Doesn't explain Minaret vs. Drug Felony (both opinions on values).
      *   *(3) Losing doesn't lock out:* Handles the Re-run case well. Doesn't explain Constitutional Court (abolishing it locks everyone out of review).
      *   *Verdict:* The tentative rule is a good start but too thin. It misses the distinction between *ordinary policy*, *fundamental rights*, and *constitutional architecture*.

  4.  **Develop a Better Principle (The "Three-Tier Theory"):**
      *   To reconcile these intuitions, we need a tiered system of democratic authority.
      *   **Tier 1: Ordinary Policy.** (Second homes, Drug felony *maybe*). Simple majority ok, but subject to rights review.
      *   **Tier 2: Fundamental Rights/Minorities.** (Minaret, Drug Felony). Simple majority cannot strip core liberties. Needs judicial review or supermajority.
      *   **Tier 3: Constitutional Architecture.** (Court abolition, Secession, Treaty Union). Changes the rules of the game. Needs supermajority or dual majority.
      *   **Epistemic Constraint:** Democracy cannot vote on objective truth.
      *   **Agency Constraint:** Elections (choosing agents) differ from Referendums (choosing policies).

      *Refining the Principle:* **"The Hierarchy of Democratic Competence."**
      1.  **Epistemic Limit:** Voters decide *values and trade-offs*, not *facts*.
      2.  **Rights Limit:** Majorities cannot vote away the fundamental procedural or human rights of minorities (Minaret, Drug Felony).
      3.  **Meta-Rule Limit:** Changes to the system that decides disputes (Courts, Secession, Future Binding) require higher consensus (Supermajority/Dual Majority) because they alter the playing field.
      4.  **Agency Distinction:** Electing representatives (low threshold) is different than enacting immutable law (higher threshold/turnout).

  5.  **Test the New Principle against the List:**
      *   *Minaret:* Fails Rights Limit. (Consistent with user).
      *   *Second Homes:* Ordinary Policy. Passes. (Consistent).
      *   *Treaty Union:* Meta-Rule/High Stakes. User says 52% binding. My principle might suggest higher bar, but once done, stability is key. I need to accommodate the "Binding" intuition. *Adjustment:* Status quo changes are binding to prevent chaos, but should ideally have higher bars to *start*. User says 52% binding. I will accept that *implementation* is binding, even if the threshold was low, to avoid paralysis.
      *   *Drug Felony:* Rights Limit. 52% is too low for criminalization of liberty. (Consistent).
      *   *Constitutional Court:* Meta-Rule Limit. Needs supermajority. (Consistent).
      *   *Re-runs:* Agency/Stability. 3 months = manipulation. 4 years + new info = new decision. (Consistent).
      *   *Turnout (Measure vs. Election):* Agency Distinction. Elections choose people (flexible). Measures choose laws (rigid). Low turnout on rigid laws is dangerous. (Consistent).
      *   *Vaccine:* Epistemic Limit. (Consistent).
      *   *Secession:* Meta-Rule Limit. Nested sovereignty. City secession breaks administrative viability (Meta-Rule). (Consistent).

  6.  **Apply to New Cases:**
      *   *Citizens' Assembly Recommendation:* This is advisory. Putting it to a vote makes it Ordinary Policy. If it conflicts with Rights/Meta-Rules, it's subject to the same limits. *Verdict:* Valid, but subject to the Hierarchy.
      *   *Referendum making future referendums binding:* This is a Meta-Rule change. It locks future majorities. *Verdict:* Requires Supermajority (Meta-Rule Limit). A simple majority cannot bind future simple majorities permanently.
      *   *Cost Estimate Re-run (10% off):* This is a "Safety Valve." It acknowledges new information (like the 4-year treaty case). *Verdict:* Legitimate. It treats the vote as a contract based on specific data. If data changes, contract is voidable.

  7.  **Identify Costs/Contradictions (The "Price"):**
      *   *The Drug Felony vs. Second Homes:* Why is one a right and one not? The principle requires a definition of "Fundamental Rights." This invites judicial activism (which the user might dislike given the Court Abolition intuition).
      *   *Treaty Union (52%):* My Meta-Rule limit suggests this should need a supermajority. The user says 52% is binding. *Conflict:* To save the user's intuition here, we must argue that *reversibility* is the key. Treaties are hard to reverse, so the vote sticks, BUT it implies a risk. Or, we accept that "Leaving" is Ordinary Policy (restoring sovereignty) while "Abolishing Court" is Meta.
      *   *City Secession:* Why is it absurd? Administrative viability. The principle needs to add "Functional Viability."
      *   *The Big Cost:* You need a **Guardian**. To enforce the Rights Limit and Meta-Rule Limit, you need the Constitutional Court. But the user thinks abolishing it should be hard (good), but implies the Minaret ban shouldn't stick (requires a Court to stop it). So the user *needs* the Court they almost voted to abolish.
      *   *Sacrifice:* Either the Minaret ban sticks (Pure Majoritarianism) OR the Drug Felony is binding (Consistency on 52%). The user wants both to be non-binding/voidable. This requires an *unelected* body to overrule the 52%. That contradicts the "people should rule" vibe.
      *   *Specific Sacrifice:* The Treaty Union (52% binding). If abolishing the Court needs a supermajority because it changes the system, Leaving a Treaty Union also changes the system permanently. Consistency demands the Treaty vote also needs a supermajority to *trigger*, or at least be reviewable. I will point out this tension.

  8.  **Drafting the Response:**
      *   **Introduction:** Acknowledge the sophistication of the intuitions. They aren't random; they track a specific political theory.
      *   **The Principle:** Propose "Constitutional Hierarchy" (Ordinary vs. Fundamental vs. Meta). Add the Epistemic and Agency constraints.
      *   **Testing:** Walk through the list. Show where it fits.
      *   **New Cases:** Apply the hierarchy.
      *   **The Cost/Contradiction:** Be blunt. The user wants judicial review (to stop Minaret/Drugs) but is wary of the Court's power (Abolition vote). The Treaty vote is the outlier (52% vs Supermajority for Court).
      *   **Conclusion:** Summarize the trade-off.

  9.  **Refining the "City Secession" point:**
      *   Why is city secession absurd? Nested sovereignty. If every city can leave, the region collapses. It's a "Universalizability" test. If everyone did it, the system fails. Region secession is rare; city secession is contagious.
      *   *Correction:* Actually, the user says "Region voters decide + Whole Country." For City, they say "Absurd." The principle is about *Constitutional Order*. Cities are administrative subdivisions; Regions are often cultural/political units. The principle is "Subsidiarity vs. Integrity."

  10. **Refining the "Treaty vs. Court" Contradiction:**
      *   User: Court Abolition (52%) -> Needs Supermajority.
      *   User: Treaty Leave (52%) -> Binding.
      *   Why? A Court protects rights. A Treaty is an agreement.
      *   My analysis: Both are structural. To be consistent, Treaty Leave should also require a higher bar *to initiate*, even if the result is binding. I will highlight this inconsistency.

  11. **Final Polish:** Ensure tone is analytical, respectful, and direct ("Tell me plainly").

  *(Self-Correction during drafting)*: Wait, the user's tentative rule had "Everyone affected." On Secession, they said Region + Country. That fits. On Minaret, everyone voted, but rights violated. So "Affected" isn't just "Subject to law," it's "Fundamental interests."
  I need to make sure I don't just say "You need a Constitution." I need to articulate the *principle* that justifies the Constitution.
  Principle Name: **"The Hierarchy of Democratic Competence."**

