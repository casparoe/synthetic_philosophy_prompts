      *   *Inconsistency:* The "Puzzle" itself is often framed as an inconsistent triad: (1) The statue and lump are distinct. (2) They share all parts at time T. (3) If x and y share all parts at T, x=y. You can't keep all three. So the desiderata list *must* reflect that you have to drop or modify one.
