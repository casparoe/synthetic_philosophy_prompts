answer: |-
  Your friend's argument is compelling because it appeals to a common-sense intuition: physical proof equals history, and lack of paperwork equals myth. However, from a methodological standpoint, his reasoning contains several category errors that professional historians would identify immediately. He is conflating the *stage* with the *play*, and treating different types of historical silence as identical.

  Here is a sentence-by-sentence autopsy of his position, followed by an analysis of the underlying methodology and a proposed correction.

  ### Part 1: Sentence-by-Sentence Autopsy

  **1. "The Trojan War is history."**
  *   **Historian's View:** **Overstated/Contentious.**
  *   **Analysis:** Most historians agree that *conflicts* occurred around Troy in the Late Bronze Age. However, "The Trojan War" implies a specific, singular event matching the narrative causality (the abduction of Helen, the ten-year siege, the specific kings involved). There is no evidence for the narrative event. To call it "history" without qualification conflates a likely historical kernel with the literary epic.

  **2. "Schliemann dug up Troy; the city is real, the destruction layers are real, and the Late Bronze Age setting matches, so the war happened even if Homer dressed it up."**
  *   **Historian's View:** **Logically Flawed (Non Sequitur).**
  *   **Analysis:** This is the "setting vs. event" fallacy. Proving a city existed and was destroyed does not prove *why* it was destroyed or *who* destroyed it. Troy (Hisarlik) shows multiple destruction layers (earthquakes, fires, warfare). Layer Troy VIIa shows signs of violent destruction roughly around the right time (c. 1180 BCE), but this could be a local raid, an earthquake, or part of the general Bronze Age Collapse. Confirming the *location* validates the *geography*, not the *plot*. Finding the setting of *Harry Potter* (King's Cross Station) does not prove wizards exist.

  **3. "King Arthur is legend, and the difference is the paperwork: nothing composed near the time names him, and the earliest accounts we have were written centuries later by people who needed a national hero."**
  *   **Historian's View:** **Mostly Accepted.**
  *   **Analysis:** This is the strongest part of your friend's argument. The *Historia Brittonum* (9th century) and *Annales Cambriae* (10th century) are the first to name him, centuries after the supposed 5th-century events. Gildas (6th century), who discusses the Battle of Badon, does not name Arthur. The motivation (political legitimization for Welsh kings) is a standard historical critique. However, "legend" doesn't preclude a historical kernel (a real commander whose name was lost), but as a narrative figure, he is indeed legendary.

  **4. "The Exodus sits much closer to Arthur than to Troy."**
  *   **Historian's View:** **Debatable/Complex.**
  *   **Analysis:** This is a comparative judgment that depends on definition. Like Arthur, there are no contemporary records. Unlike Arthur, there is a specific geographical claim (Sinai) that yields almost no archaeological trace of a mass population movement. However, unlike Arthur, there are plausible historical analogues (the expulsion of the Hyksos, the movement of Habiru groups). It is not clearly "closer" to Arthur; it occupies a different category of "foundational myth with potential socio-political origins."

  **5. "The Egyptians kept meticulous records and never mention a mass departure of Israelite slaves, and when a bureaucracy that documented everything stays silent about an event, that silence is evidence the event did not happen."**
  *   **Historian's View:** **Simply Wrong.**
  *   **Analysis:** This relies on a fundamental misunderstanding of Egyptian record-keeping. Egyptian inscriptions were propaganda, not accounting. They recorded victories, building projects, and divine favor. They did not record defeats, logistical failures, or the loss of slave labor (which would be an embarrassment). Furthermore, the survival rate of papyrus is low; stone survives, but stone was for monuments. Arguing from silence here assumes the records were intended to be objective and comprehensive, which they were not.

  **6. "So the rule is simple: archaeology confirming the setting makes a story history, and the silence of the sources makes it legend."**
  *   **Historian's View:** **False Dichotomy.**
  *   **Analysis:** This rule fails because it treats "setting" as proof of "event" and "silence" as proof of "non-existence." History is rarely binary. It operates on a spectrum of probability based on *corroboration of specific claims*, not just background details.

  ---

  ### Part 2: The Core Methodological Errors

  You suspected you conceded too much. You did, specifically on three points your friend glossed over.

  #### 1. Setting vs. Event
  Your friend argues that confirming the place confirms the story. In historiography, this is insufficient.
  *   **The Work It Does:** Confirming the setting (Troy existed in the Late Bronze Age) establishes *plausibility*. It moves the story from "Impossible" to "Possible."
  *   **What It Doesn't Do:** It does not establish *actuality*. To move from "Possible" to "History," you need evidence that links the specific *actors* and *actions* to the setting. For Troy, we have Hittite texts mentioning a city called *Wilusa* (likely Troy) and a conflict involving the Ahhiyawa (likely Achaeans/Greeks). This brings us closer to history than Arthur, but it still describes a geopolitical struggle, not the Homeric war of honor.
  *   **The Gap:** You can have a real city and a fake war. You can have a real war and a fake cause. Archaeology confirms the city; it does not confirm the *Iliad*.

  #### 2. Disparate Evidence Ecologies
  Your friend treats Troy, Arthur, and Exodus as if they are being judged by the same jury. They are not.
  *   **Troy:** Benefits from a stone city in a dry climate (archaeology survives) and mentions in Hittite clay tablets (contemporary external texts).
  *   **Arthur:** Exists in post-Roman Britain, a "dark age" where stone inscriptions are rare, literacy was collapsing, and organic materials rot in the damp climate. The lack of paperwork is partly due to the collapse of the bureaucratic system itself.
  *   **Exodus:** Supposedly takes place in the New Kingdom, the height of Egyptian literacy. However, the event (if it happened) involved nomadic movement in the Sinai desert, where almost nothing survives archaeologically, and the "adversary" (Egypt) had no incentive to record it.
  *   **Conclusion:** You cannot apply the same standard of "paperwork" to 5th-century Britain that you do to 13th-century Egypt. The silence in Britain is expected; the silence in Egypt is suspicious but not definitive.

  #### 3. The Illegitimacy of the Egyptian Silence
  Your friend's claim that Egyptian silence proves the Exodus didn't happen is the weakest link.
  *   **Completeness:** We do not have "all" Egyptian records. We have what survived on stone or in dry tombs. Administrative papyri regarding slave quotas rarely survive.
  *   **Concerns:** Egyptian pharaohs did not document the loss of slaves. If the Israelites fled, it was a security failure. If they were chased and drowned, it was a military defeat. Neither appears on temple walls.
  *   **Scale:** If the Exodus was a mass departure of 2 million people (as the Bible implies), there would be traces. If it was a smaller group (as historians suspect), Egyptian silence is entirely consistent with their record-keeping habits. Your friend assumes the Biblical scale to prove the silence is meaningful, then uses the silence to disprove the event. It is circular.

  ---

  ### Part 3: Does the Rule Survive?

  **No.** Your friend's rule ("Archaeology confirming setting = History; Silence = Legend") cannot survive correction. If you fix the errors, the rule collapses.

  *   **Correction 1:** Archaeology confirming setting = **Context**, not Event.
  *   **Correction 2:** Silence = **Lack of Corroboration**, not Disproof (unless the record should *necessarily* have captured it).

  #### A Better Rule
  A more historically rigorous rule would look like this:

  > "A story transitions from legend to history when **independent contemporary evidence corroborates the specific agents and actions of the narrative**, not merely the background setting. Silence counts against historicity only when the recording culture had the means, motive, and habit of documenting such events."

  #### Implications for the Three Cases
  1.  **King Arthur:** Remains **Legend**. No contemporary corroboration of the agent (Arthur) or specific actions (Badon, though the battle is real, his role is not).
  2.  **The Exodus:** Remains **Legend/Myth with a Kernel**. The specific narrative (Moses, 10 Plagues, mass departure) lacks corroboration. The silence of Egypt is not proof of non-existence, but the lack of archaeological traces in Sinai for a mass population is significant. It is likely a foundational myth constructed from smaller historical migrations.
  3.  **The Trojan War:** **This is where your friend's verdict flips.**
      *   Under your friend's rule, Troy is History because the city was found.
      *   Under the *corrected* rule, "The Trojan War" (as a specific event caused by Helen, led by Agamemnon, lasting 10 years) slides back toward **Legend**.
      *   **Why?** We have the city (Setting). We have Hittite texts mentioning conflict over Wilusa (Corroboration of Conflict). But we do *not* have corroboration of the *specific event* described by Homer. We do not know the cause, the duration, or the key figures.
      *   **Verdict:** The *Conflict* is History. The *War* (as a singular, defined narrative event) is Legend.

  ### Conclusion
  You were right to feel unconvinced. Your friend has confused the existence of a stage with the truth of the play performed on it. He has also mistaken the propaganda of Pharaohs for the minutes of a board meeting.

  If you apply a rigorous historical standard, the Trojan War does not graduate to "History" simply because Schliemann found a burned layer. It remains a legendary narrative grafted onto a historical conflict. Your friend's rule grants Troy a status it hasn't earned, while using a flawed metric to deny nuance to Arthur and Exodus. The boundary between legend and history isn't a line drawn by shovels or silence; it is a gradient determined by how many specific claims of the story can be independently verified. By that metric, none of the three are pure history, but Troy is the only one with a verified battlefield—not a verified war.
