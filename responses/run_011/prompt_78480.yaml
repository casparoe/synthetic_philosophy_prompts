answer: |-
  Dear Chief Executives and Members of the Joint Board

  This memo outlines the screening procedure our office will use to evaluate joint protocol proposals between the two charities, followed by the application of this procedure to the three current proposals on the table. Our goal is to provide a consistent, conservative filter that aligns with the board's requirement for safe Pareto improvements, defined specifically as protocols that guarantee each charity ends up at least as well off as it would have been running its own default dispatch policy in every scenario, with strictly better outcomes in some scenarios, without requiring either charity to trust the other's model of the situation. We recognize that this definition prioritizes worst-case safety over expected value, which is a deliberate choice to align with legal counsel's risk posture, though we note that finance departments often prefer expected value maximization with side payments. This procedure takes the side of worst-case safety because once an emergency is unfolding, the cost of a single bad outcome cannot be undone by average gains elsewhere, but you should be aware that this is a contested choice in decision theory and not an objective truth.

  The screening procedure consists of five sequential steps that our three-person team can execute within half a day using the simulation data provided by your analysts. Step one requires each charity to submit their own baseline simulation of the default dispatch policy, acknowledging that you disagree on what the default actually is. Instead of trying to arbitrate a single truth, which has proven impossible, we require the protocol to dominate both claimed baselines independently. This means Charity A must certify that the protocol beats Charity A's default in Charity A's model, and Charity B must do the same for itself. Step two is the scenario dominance check, where we verify that there is no known scenario in either simulation where the protocol yields a worse outcome than the default for either party. This is where we enforce the worst-case safety constraint, meaning that even if a protocol saves money on average, it fails this step if there is a single branch where a charity loses patients or resources compared to their default. Step three tests for incentive compatibility during an active emergency. We ask whether either charity would have a rational incentive to ignore the protocol once a call comes in, given that the other follows it. If the protocol relies on trust during the event rather than pre-commitment, it fails. Step four addresses the ambiguity of objectives by requiring dual certification on patient outcomes and donor metrics. A protocol cannot trade patient safety for operational metrics without explicit board approval, so we treat any degradation in patient outcomes as an automatic failure regardless of metric gains. Step five is a distributional stop-rule. If multiple protocols pass the first four steps, our office will not recommend one over the other based on who gains more, as that is a political decision about the split of gains rather than a technical safety question, and we will hand the choice to the board.

  Regarding the data limitations you highlighted, where we cannot get comparable numbers and only receive each side's own simulation output, the procedure demands a specific remedy. If safety cannot be quantified comparably, we demand a null test where both sides run the proposed protocol on the other side's historical data logs to check for catastrophic failures. If a proposer cannot provide this cross-validation, the verdict is cannot be assessed with what we have, and we will demand raw dispatch logs rather than summary simulations before proceeding. This ensures that the guarantee of safety does not depend on trusting the other side's model, satisfying the core requirement of the safe Pareto improvement. We must also be transparent that this procedure is partly a judgment call wearing a procedural costume. Specifically, step one relies on the honesty of your analysts in reporting their default baselines, and step four relies on your internal agreement on how to weight patient outcomes against donor metrics. The procedure cannot settle what the right reference point for the default is, nor can it resolve the tension between legal's worst-case requirement and finance's expected value preference, other than to default to worst-case as per our mandate.

  Applying this procedure to the first proposal, the stand-down rule based on a live readiness map, the verdict is fail. While both sides' analysts claim this saves wasted scrambles, step three of our procedure identifies a critical incentive incompatibility. The rule relies on self-reported readiness, and because the four-minute comparison uses each charity's own data, there is a foreseeable incentive to misreport readiness to avoid scrambling or to force the other to scramble. Furthermore, you noted that in some branches the standing-down charity's aircraft would have arrived first for reasons the other side cannot see. This violates step two, the scenario dominance check, because there exists a scenario where the patient outcome is worse under the protocol than under the default for the charity that stood down. Since the guarantee of safety must hold in every scenario, not just on average, this protocol introduces a risk of degraded patient outcomes that cannot be mitigated without trust, which violates the safe Pareto improvement definition.

  Applying the procedure to the second proposal, the rotation rule for the overlap belt, the verdict is fail under the safe Pareto improvement criteria, though this borders on not a technical question, hand it to the board because it's about the split. The finance directors are correct that expected cost per patient falls and expected transports rise, which would satisfy an expected utility framework. However, you specified that legal wants worst-case safety in every branch. In the event of an avalanche or coach crash on one charity's home side, that charity loses patients it would have treated under its default and its crews sit idle. This is a specific scenario where that charity is worse off than the default, violating step two. Because the protocol cannot be adjusted mid-event without breaking the commitment, the loss is locked in. This is a clear case where the procedure is forcing a choice between legal's risk aversion and finance's efficiency. If the board wishes to accept the risk of idle crews during mass casualty events in exchange for lower average costs, they can waive the worst-case requirement, but technically this protocol is not a safe Pareto improvement as defined.

  Applying the procedure to the third proposal, the escrow of full dispatch decision rules, the verdict is fail due to strategic manipulation risks identified in step one and step three. While this idea aims to end the baseline argument by computing the default conditional on the escrowed rules, it is self-undermining. If charities know their default rules will be used to calculate the baseline for the protocol, they have an incentive to tune their default rules before escrow to make the protocol look better or to maximize their share of the gains. This is a form of Goodhart's law where measuring the default changes the default. Additionally, depositing full decision rules may reveal proprietary operational logic that creates competitive disadvantages outside this partnership. There is nothing left of the idea that survives the incentive check, because the act of defining the baseline becomes part of the game rather than a neutral reference point. We cannot assess a protocol where the baseline itself is a strategic variable, so this fails the requirement that the guarantee doesn't depend on either charity trusting the other's model.

  In summary, none of the three current proposals pass the screening procedure as currently constituted. The stand-down rule fails on information asymmetry and scenario safety, the rotation rule fails on worst-case scenario dominance despite average gains, and the escrow rule fails on incentive compatibility regarding the baseline definition. We recommend that proposers return to the drawing board with a focus on protocols that do not require real-time data sharing vulnerable to manipulation, that do not sacrifice worst-case patient outcomes for average efficiency, and that do not allow the definition of the default to be gameable. When you review these verdicts, please note where the procedure is really a judgment call. The decision to reject the rotation rule is a judgment call favoring legal's worst-case stance over finance's expected value stance, and the decision to reject the escrow rule assumes that charities will act strategically rather than cooperatively in defining their defaults. The procedure structurally cannot settle the distribution of gains between safe protocols, nor can it resolve the ambiguity of whether patient outcomes or donor metrics take precedence without your explicit direction. We stand ready to re-evaluate revised proposals using this same framework.

  Sincerely

  The Brokerage Office
