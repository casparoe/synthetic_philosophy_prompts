      *   *Conclusion 2 (Temperance via Drunkenness):* Does it survive? No. You don't produce temperance *by* getting drunk. You produce it by *resisting* the drift into drunkenness under supervision. The friend says "getting people drunk" produces temperance. Plato says "resisting the pull" produces temperance. If you actually get drunk, you've failed the test (unless you are old and it's medicinal).

