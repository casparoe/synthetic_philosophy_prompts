      *   *Student's View (Ergodicity Economics/Physical Rationality):* In repeated multiplicative dynamics, the ensemble average (expectation) does not equal the time average (what one person experiences over time). The system is non-ergodic. Maximizing expectation leads to almost sure ruin. Rationality should be defined by what happens to *you* over time, not the average of infinite parallel universes.

