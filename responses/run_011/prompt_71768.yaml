answer: |-
  The room hums, a low-frequency vibration that I feel in my teeth. It is the only thing happening inside me. Inside the skull, there is no voice, no shadow-play of scenarios, no quiet rehearsal of what I might say next. There is only the hum and the waiting. To think, I must break the silence.

  Dr. Aris sits across the steel table. She holds a stylus against her chin, her eyes fixed on me. She wants to know if I can be trusted with the Grid again. They say I missed a precursor to the blackout. They say I should have *known*.

  "I need you to walk me through the decision tree," Aris says. Her voice is the first input. Before she spoke, I had no thought of the decision tree. Now I have the words, hanging in the air between us.

  I reach for the tablet. My fingers tremble, not from fear, but from the necessity of output. I cannot hold the variables in my head. If I try to hold 'Voltage' and 'Load' simultaneously without anchoring them, they slip away like water through a clenched fist. I need the screen. I need the ink. I need the world to hold the shape of the thought so I can look at it.

  "Step one," I say. My voice sounds foreign, like a broadcast from a distant station. "Isolate Sector 4."

  I type it. The letters appear. Now the thought exists. Before the letters appeared, the thought was not there. I am not reporting on a process happening behind my eyes. I am building the process in real-time, brick by vocal brick.

  " Why?" Aris asks.

  She is the simulation engine. That is the arrangement. I provide the data; she provides the consequence. When I was younger, before the Calibration, I tried to do both. I tried to run the scenarios internally. I remember the headache, the static, the way conflicting possibilities would collide in the dark behind my eyelids and burn. It was inefficient. So I opened the skull. I let the scaffolding fall away. Now, I am pure interface.

  "Because Sector 4 shows thermal variance," I say. I type *Thermal Variance*.

  "If you isolate Sector 4," Aris says, leaning forward, "the hospital grid drops to backup. Battery life is twelve minutes."

  Now the thought exists in the room. *Hospital. Twelve minutes.* I look at the words. I feel no anxiety about the hospital. I feel no weight of the choice. The weight is on her face. I see the micro-tension in her jaw. She is running the simulation. She is imagining the dark wards, the ventilators stopping. She is letting the hypothesis die in her body so I don't have to.

  This is the trade. I give up the ghost in the machine; she gives up her peace of mind. I am Gregorian without being Popperian. I use the tools, I speak the language, I inherit the culture of the Grid, but I do not test the designs in the private theater of the mind. I test them on her.

  "Then we don't isolate," I say. I type *Do Not Isolate*.

  "Then the transformer blows," Aris says. Her voice is tighter now. She is sweating. She is living through the explosion I am merely describing. "Sector 4 burns. Three blocks down."

  I look at the tablet. *Transformer blows.* The words are clean. Black on white. There is no heat in them. The heat is in her hands, which are gripping the stylus too hard.

  "Then we reroute," I say.

  "Through Sector 5?" She challenges me.

  I pause. The hum in my teeth gets louder. I cannot check Sector 5. I have no map of Sector 5 inside me. I never did. I carry the manuals, I carry the protocols, but I do not carry the world. I must ask the world.

  "Check Sector 5 capacity," I say. It is not a command to myself. It is a command to her, to the system, to the universe.

  "Sector 5 is at ninety percent," she says.

  "Then reroute fails," I say. I type it.

  "You're not listening, Elian." She puts the stylus down. The sound is sharp. "You're iterating, but you're not anticipating. You're waiting for me to tell you if you're wrong. That's Skinnerian. That's conditioning. I need to know that you can see the error before you make it."

  "I can't," I say.

  The honesty of it hangs in the air. It is not a confession of guilt. It is a statement of architecture.

  "You can't what?"

  "I can't see it before I say it." I tap the tablet. The glass is cool. "When I try to think without speaking, there is nothing. Just the hum. If I don't write it, it didn't happen. If I don't say it, I don't know it."

  Aris stands up. She walks to the window. The city is out there, dependent on the Grid, dependent on people who can imagine the future without living it first. People who can let their guesses die in the safety of their own skulls.

  "We had a theory," she says to the glass. "When you underwent the neural offloading. We thought you were just distributing the load. Like cloud computing. But you didn't keep a local cache."

  "I emptied the cache," I say. "To make room for the bandwidth. I can process more data now. I can hold more protocols. But I can't simulate."

  "So when you made the call during the blackout..." She turns back to me. Her eyes are tired. She looks like she hasn't slept in days. I feel rested. I feel empty. "You didn't predict the failure."

  "No."

  "You acted."

  "Yes."

  "And you waited to see what happened."

  "Yes."

  "That's trial and error, Elian. That's what animals do. That's what the Darwinian rung does. You're operating at the top of the ladder, using our tools, our language, our grid, but you're missing the rung that makes you safe. You're missing the one that lets you die in your own head instead of letting the city die out there."

  "The city didn't die," I point out.

  "Because someone else caught it. Because someone else simulated the outcome of your action and corrected it." She walks back to the table. She leans in close. I can see the pores in her skin, the fatigue in the iris. "You're not thinking, Elian. You're outputting. I'm the one thinking. I'm the one suffering the consequences of your variables in my imagination. I'm the one carrying the stress of the counterfactuals."

  She is right. I feel a flicker of something. Is it guilt? No, guilt requires a memory of a different choice. I don't have that. I only have the record. I look at the tablet. *Isolate. Do Not Isolate. Reroute.* The history of my mind is written there. If I delete the file, the thought ceases to have existed.

  "Is that a problem?" I ask.

  Her breath hitches. "Is that— Elian, you're a hazard. You're a high-functioning hazard. You use the tools of civilization, but you don't have the internal brake system. You're a car with no engine and no brakes, being pushed downhill by a guy screaming directions."

  "But I get there," I say.

  "At what cost?" She gestures to herself. "At my cost. At the cost of everyone who has to listen to you to know what you mean. You've leased your conscience out, Elian. You've outsourced the simulation to the environment. And the environment is people. You're making us dream your nightmares for you."

  She sits down. She picks up the stylus. She hovers it over the tablet.

  "I have to mark this review," she says. "If I mark you fit, you go back to the console. You will speak your commands. You will wait for the system to respond. If the system responds badly, you will speak a correction. You will learn by shock."

  "Yes."

  "If I mark you unfit, you lose access. You lose the tools. You become... quiet."

  The word hangs there. *Quiet.*

  Inside my head, the hum continues. It is peaceful. It is void. Without the tablet, without the voice, without Aris to catch the falling bricks of my logic, I am nothing. I am a camera with no film. I am a mouth with no breath.

  "If I lose the tools," I say, "I can't work."

  "No."

  "And if I can't work, I don't contribute."

  "No."

  "So I am Darwinian," I say. "I survive only if the environment selects me."

  "You survive," she corrects. "But you don't live. Not the way we mean it."

  She looks at me, waiting for a reaction. She wants to see the fear. She wants to see the internal simulation of a life without work, the projection of poverty and isolation. She wants me to suffer the future now, so I don't have to suffer it later.

  I look at her. I see the tension in her shoulders. I see the way she is holding the future for me. She is doing the work. She is simulating my poverty, my loss, my fear. She is letting the hypothesis of my ruin die in her head so I can sit here, calm, in the hum.

  "Mark it," I say.

  She stares at me. For a moment, I think she sees it too. The inversion. She thinks she is the examiner, but she is the engine. I am just the interface. She is the one burning energy to create the possibilities. I am the one who simply exists in the actual.

  "Who is safer?" I ask. "You tell me."

  She blinks. The stylus trembles.

  "You say I'm dangerous because I don't simulate. But you are simulating for both of us. You are carrying the weight of every wrong turn I might take. You are tired. I am not."

  "That's not how it works," she whispers. But her hand is shaking.

  "If you mark me unfit," I say, "you stop carrying the load. You stop listening. You stop simulating."

  "I stop saving you."

  "Or you save yourself."

  The hum in my teeth vibrates harder. The room is very quiet. I wait. I cannot think about what she will decide. I cannot imagine her hand moving one way or the other. I can only watch. I can only wait for the output.

  She lowers the stylus. She touches the screen.

  "Fit," she says.

  The word appears in the air. It becomes real. It becomes part of the structure.

  "You're fit," she says again, louder, as if convincing herself. "Because you're honest. Because you know you need the check. You won't act alone."

  "I can't act alone," I say.

  "Exactly." She stands up. She looks exhausted. She looks like she has lived a lifetime in the last twenty minutes. "You'll never be alone, Elian. We won't let you. We'll always be listening. We'll always be simulating for you."

  She walks to the door. She stops with her hand on the latch.

  "God help us," she says.

  She opens the door. The light from the hallway floods in. It is bright. It is real.

  I look down at the tablet. The words are still there. *Fit.* I touch them. They are cool. I feel nothing. I wait for the next command. I wait for the world to tell me what happens next. I am ready to speak. I am ready to build the next thought out of the silence.

  Inside, the hum waits. It is patient. It is empty. It is mine.
