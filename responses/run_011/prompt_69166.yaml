  3. Hacking's theory collapses the distinction between loops from above and below because institutional incentives and survivor advocacy are co-constitutive; the money and legal standing make the label real enough for survivors to adopt it, which then pressures the institution to revise it. You cannot separate the political concession from the clinical discovery because the availability of benefits changes the phenomenology of the suffering itself.

  4. Soldier's heart and shell shock are earlier laps of the same loop, not indifferent kinds, because each iteration created a specific type of sufferer who could claim moral injury, even if the physiological mechanism shifted from heart to spine to psyche. The continuity lies not in the biology but in the recurring social function of the label as a bridge between individual pain and collective obligation.

  5. Looping doesn't deny the reality of suffering but denies the stability of the category, suggesting truth is less about correspondence to nature and more about the durability of the interaction. A loop stalls when the classification no longer offers enough interactive power, such as benefits or recognition, to motivate people to adopt the label, causing the kind to fragment or fade.
