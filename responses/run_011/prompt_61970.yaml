      *   *Thresholds:* SIR is deterministic threshold ($R_0=1$). Cascade is probabilistic (inevitable lock-in eventually, but *which* state locks in is the risk).
      *   *Superspreading:* Position in queue > Infectiousness. Early movers are "superspreaders" of information.
      *   *Recovery/Immunity:* "Cascade Breaking." A strong private signal acts like immunity/recovery.
      *   *Vaccine:* Exogenous Public Signal.

      *   *The "Fear" vs. "Evidence" Question:* This is the core conceptual clash.
          *   Fear-SIR: Negative externality. I avoid $I$.
