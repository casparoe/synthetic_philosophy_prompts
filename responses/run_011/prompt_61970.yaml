prompt: |-
  ok so I'm in year 13 doing my EPQ and I've spent basically the whole thing building SIR models in Python — susceptible/infected/recovered, the differential equations, R naught, all that. I also made a version where beta drops when prevalence goes up cos people get scared and stop going out, which felt like a proper achievement at the time.

  More recently I've got into information cascades and rational herding, where everyone ends up doing the same thing not because they worked anything out for themselves but because they can see what the people before them did and thats evidence. From what I've read the interesting bit is that every single person is being completely sensible given what they know, and the crowd still ends up badly wrong.

  I understand epidemics way better than I understand Bayes or game theory — I've done conditional probability in my stats module and that's genuinely about it. So could you translate the whole cascade thing into my vocabulary, as faithfully as you can manage? Specifically: what plays the role of beta and of gamma, is there something like an R0 for a cascade, and is a cascade taking off a threshold thing in the same way R going above 1 is? What corresponds to superspreading and to heterogenous mixing? Does anyone ever recover from a cascade, or become immune to being influenced by it? Is there anything that works like a vaccine — an intervention that stops the thing spreading? And crucially, is my scared-people-cut-their-contact-rate model actually the same phenomenon in disguise, or is there a real difference between reacting to how many people are doing something and reacting to what their doing is evidence of?

  Then I want the honest part, which is the bit I care about most: a residue report. Sort the central claims about cascades into (a) ones that translate into epidemic language cleanly, (b) ones you had to bend or fudge to make fit — tell me exactly how you bent them — and (c) ones you simply cannot say in that language at all. Please don't sneak epidemiology's own assumptions in and present them as if they were translations.

  Finally, my mate reckons that if it all reduces to contagion in the end then the whole 'but each person is being rational' thing is just decoration on top. So: is the stuff that won't translate a weakness in my framework, or is it a sign the cascade people are making more fuss than they should?
