      *   *Cascade Model:* Discrete time (usually), sequential decision making, informational transmission, state changes (Uncertain $\to$ Adopt/Reject).

      *   *Mapping $\beta$ (Transmission Rate):* In SIR, it's contact rate $\times$ probability of infection. In cascades, it's the probability that a private signal is overridden by public history. Let's call it "Susceptibility to Public History."
      *   *Mapping $\gamma$ (Recovery):* In SIR, stopping being infectious. In cascades? Once you decide, you usually stay decided. Maybe "New Information arriving"? No, that doesn't fit well. Cascades are often one-shot decisions. This is a weak point.
      *   *Mapping $R_0$:* In SIR, secondary infections. In cascades, how many people follow the first few before the cascade breaks? Or the probability the cascade *starts*.
