answer: |-
  The conservation studio smelled of epoxy and dust. On the central table sat the *Doryphoros*, reassembled from the shards that had littered the floor twelve hours prior.

  **Elena:** It stands. That's the datum. The statue survived the fall.

  **Marcus:** The statue survived. Did the clay? That's the hinge. Look at the temporal structure, Elena. Before the fall, you have a clay-worm and a statue-worm sharing temporal parts. During the shattering, the clay-worm terminates. A scattered pile of shards isn't a lump; it's a plurality. When the conservator glued it back together, she initiated a *new* clay-worm. But the statue-worm? Because her intention was restoration, not creation, the statue-worm bridges the gap.

  **Elena:** You're slicing time to avoid counting objects in space. I say they are both wholly here, now. Numerically distinct. The statue is an artifact dependent on intentional continuity. The lump is a material object dependent on cohesive continuity. The shattering broke cohesion. It did not break artistic identity. Therefore, the lump ceased to exist, and a new one was formed from the shards. The statue persisted through the interval.

  **Marcus:** So you accept the asymmetry? Usually, the literature assumes the lump survives what kills the statue. Here, the lump dies, and the statue lives.

  **Elena:** Precisely. And that kills your "no-coincidence" view. If they have different persistence conditions, they are different objects. If they are different objects occupying the same volume now, they coincide. You say they are distinct four-dimensional wholes. But right now, in this studio, I am touching one surface. You say I'm touching two distinct surfaces that are perfectly superimposed?

  **Marcus:** I'm saying you're touching a temporal part of the Statue-whole and a temporal part of the Clay-whole. They are distinct because their histories diverge. The Clay-whole existing now began twelve hours ago with the gluing. The Statue-whole existing now began centuries ago in the sculptor's studio. They overlap spatially, but they are not identical.

  **Elena:** But they are both wholly present. The clay constituting the statue isn't a slice; it's the whole mass. Let's press the ontology. Before the fall, on the pedestal. How many things?

  **Marcus:** Two. A statue-stage and a clay-stage. But they belong to different worms.

  **Elena:** Two objects. Distinct. Yet you accuse *me* of ontological extravagance?

  **Marcus:** I accuse you of magic. You say two material bodies can occupy the same coordinates without interaction. I say there are two extended histories that intersect. It's like two roads crossing.

  **Elena:** Roads cross at a point. These objects overlap entirely for centuries. Let's talk about the fragments. When it shattered, you said the clay-worm terminated. Why?

  **Marcus:** Because a lump requires spatial continuity. Scattered shards are not a lump.

  **Elena:** Concede this, then: If the shards were connected by a thin thread of clay, would the lump survive?

  **Marcus:** ...Likely.

  **Elena:** So your view turns on microscopic continuity? That seems fragile for a metaphysical claim. But here is my concession: I admit the counting problem is severe. If the statue and the clay are distinct, and there was also a collection of atoms, and a quantity of matter... the pedestal was crowded. I must swallow that there were dozens of objects where common sense sees one.

  **Marcus:** And I concede this: The intuition that the statue survives restoration is robust. My view must accommodate it by positing that the *sortal* 'statue' allows for temporal gaps provided the causal chain of intention remains unbroken. The sortal 'lump' does not. So, I agree that the object you are touching now is numerically the same statue as before the fall, but numerically distinct from the lump that was before the fall.

  **Elena:** But if they are distinct now, and both wholly present, coincidence is real. You can't just wave the 'four-dimensional' wand. If I destroy the clay now, do I destroy the statue?

  **Marcus:** You destroy the statue's current temporal part. Since the statue requires clay to exist, the statue-worm terminates. But you don't destroy the *history* of the statue.

  **Elena:** You're retreating to language. I'm talking about being. Look, the conservator intended to restore *this* statue. She did not intend to create *this* lump. She just aggregated matter. That intentional difference grounds the distinction in reality, not just in description.

  **Marcus:** It grounds the distinction in *conditions of persistence*, which I model as boundaries on temporal worms. You model it as distinct substances in the same place. The empirical predictions are identical. The ontology is where we bleed.

  **Elena:** The ontology dictates how we count. If I burn this, do I burn one thing or two?

  **Marcus:** You burn a temporal part of two distinct worms.

  **Elena:** That sounds like two things.

  **Marcus:** It sounds like one event affecting two histories.

  **Elena:** We aren't leaving this studio tonight, are we?

  **Marcus:** Not until the epoxy cures.

  ***

  **Confidence Note:**
  I am highly confident (90%+) that these moves reflect actual contemporary metaphysical debates. The Coincidentalist appeal to sortal-relative persistence conditions (Burke, Baker) and the Perdurantist reliance on temporal parts to avoid coincidence (Lewis, Sider) are standard. The specific twist (Statue survives, Lump does not) is a known variation used to test sortal sensitivity.

  **Least Sure Claim:**
  I am least sure about the Perdurantist's concession that the "Clay-worm" terminates upon shattering. Standard 4Dism often treats "lump" as a phase sortal or assumes matter persists through scattering more easily than artifacts. Having Marcus agree that the Lump *doesn't* survive the scattering (to fit the prompt's constraint) might be slightly less natural for a 4Dist than for a 3Dist, as 4Dists typically define objects by their spacetime regions, and a scattered region is still a valid spacetime region. However, it is defensible if "Lump" implies cohesion.
