  **Proof of Unreachability by Fixed Rules**

  I define the class of **Fixed Rewrite Rules** for this domain as functions `R(s)` that select a target index `i` and a symbol mapping `M` independent of the string's content values (e.g., "Increment index 2", "Replace index 0 with 1"). This class covers all context-free position-based edits reasonable for a schema migration tool (e.g., "rename column 3").

