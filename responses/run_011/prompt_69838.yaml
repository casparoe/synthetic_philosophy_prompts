answer: |-
  ### 1. How to use the tree

  This tool is a diagnostic, not a weapon. Its purpose is to sort claims about the past into categories based on what the video actually shows and says, not on what you already believe. Answer each question strictly using evidence present in the clip or easily verified by a quick search. Do not guess the author's secret thoughts; judge them by their public commitments. The path splits based on method and honesty, allowing you to distinguish between a sincere mistake and a deliberate trick. Follow the branches until you reach a named leaf. Use the verdict to explain *why* the claim is problematic, rather than simply dismissing it.

  ### 2. The nodes

  **1. Is the speaker presenting this as a literal event that physically happened, or as a story teaching a moral lesson?**
  *   **Literal:** Go to Node 2.
  *   **Story:** Go to Node 7.

  **2. Has anyone demonstrated an ordinary explanation of the puzzling artefacts using tools the period actually had?**
  *   **Yes:** Go to Node 3. (This checks if the mystery is real or manufactured.)
  *   **No:** Go to Node 3. (A "No" here flags a gap in evidence, not necessarily fraud.)

  **3. If accepting this claim is true, how much independently corroborated evidence assembled by people with no stake in the dispute would have to be discarded?**
  *   **Little or None:** Go to Node 4.
  *   **Almost Everything (dates, trees, ice, unrelated cultures):** Go to Node 5.

  **4. Has anyone who supports this written down, in advance, a specific discovery that would make them give it up?**
  *   **Yes:** Go to Node 6.
  *   **No:** Go to Node 5.

  **5. Does this tradition keep producing new findings, or only new excuses for why the evidence doesn't fit?**
  *   **New Findings:** Go to Node 6.
  *   **Only Excuses:** Go to Node 8.

  **6. Is the author making money solely if you believe this specific claim, or do they get paid regardless of the outcome?**
  *   **Regardless (Academic/Salary):** Leaf: The Uphill Battle.
  *   **Solely (Book Sales/Donations):** Leaf: The Wild Guess.

  **7. Is the argument actually solving one problem, or is it solving two different problems at once?**
  *   **One Problem:** Leaf: Just a Story.
  *   **Two Problems:** Leaf: The Bait-and-Switch.

  **8. Has the author ever admitted error when presented with counter-evidence?**
  *   **Yes:** Leaf: The Uphill Battle.
  *   **No:** Go to Node 9.

  **9. Is there evidence the author knows the claim is false but promotes it anyway?**
  *   **Yes:** Leaf: The Grift.
  *   **No:** Leaf: The Rabbit Hole.

  *(Note: This structure separates epistemic quality from intent. Node 3 addresses cost; Node 2 addresses ordinary explanation.)*

  ### 3. The leaves

  **1. The Grift (Deliberate Fraud)**
  *   *Awkward Commitment:* You have to believe the author is lying to you for profit while pretending to seek truth.

  **2. Just a Story (Myth or Allegory)**
  *   *Awkward Commitment:* You have to accept that the speaker never intended this to be taken as factual history at all.

  **3. The Bait-and-Switch (Two Claims Smuggled)**
  *   *Awkward Commitment:* You have to untangle two separate arguments that are being treated as a single point.

  **4. The Uphill Battle (Ordinary Heterodoxy)**
  *   *Awkward Commitment:* You have to admit the method is sound, but the evidence simply hasn't favoured this view yet.

  **5. The Wild Guess (Speculation)**
  *   *Awkward Commitment:* You have to acknowledge the idea cannot be proven false, but it has nonetheless generated real research.

  **6. The Rabbit Hole (Pseudohistory Proper)**
  *   *Awkward Commitment:* You have to accept that every failure to find evidence is treated as proof of a conspiracy hiding the truth.

  ### 4. Three worked examples, plus Newton

  **Atlantis (Literal):** Node 1 (Literal) → Node 2 (No tools shown) → Node 3 (High cost: discards geology) → Node 5 (Only excuses) → Node 8 (No admission) → Node 9 (No evidence of knowledge) → **The Rabbit Hole**. The claim requires discarding too much evidence without new findings.

  **Nazca (Aliens):** Node 1 (Literal) → Node 2 (Video says no, though investigators say yes) → Node 3 (High cost: requires aliens) → Node 5 (Only excuses) → Node 8 (No admission) → Node 9 (No evidence of knowledge) → **The Rabbit Hole**. Even if tools exist, the alien claim ignores them to maintain the mystery.

  **Fomenko (New Chronology):** Node 1 (Literal) → Node 3 (Huge cost: deletes antiquity) → Node 4 (No give-up condition) → Node 5 (Only excuses) → Node 8 (No admission) → Node 9 (Suspicious profit motive) → **The Grift**. The statistical method is a veneer for discarding all contrary data.

  **Newton (Chronology):** Node 1 (Literal) → Node 3 (Moderate cost) → Node 4 (Yes, he adjusted dates) → Node 6 (Academic status) → **The Uphill Battle**. Newton used ordinary methods for his time and was willing to adjust; he was sincere but wrong. The tree distinguishes him from Fomenko based on willingness to admit error and methodological cost.

  ### 5. The grid and the empty squares

  The tree implies a grid with two axes: **Honesty** (Sincere vs. Deceptive) and **Epistemic Standing** (Sound/Ordinary vs. Unsound/Pseudo).

  *   **Sincere + Sound:** Real History (Not a leaf, but the baseline).
  *   **Sincere + Unsound:** The Uphill Battle, The Wild Guess, The Rabbit Hole.
  *   **Deceptive + Unsound:** The Grift.
  *   **Deceptive + Sound:** **Empty Square.**

  This combination is empty because nobody wants to occupy it. It represents a claim that is methodologically sound and factually true, but the author knowingly presents it as false or misleading. While logically possible (e.g., satire or strategic deception), in historical discourse, no one actively argues for a truth they know is true while pretending it is false. It is empty because there is no motive to lie in favour of reality. The tree assumes that if the method is sound and the author is deceptive, they are likely hiding a falsehood, not a truth.

  ### 6. What this tree cannot separate

  The tree struggles to reliably distinguish **The Wild Guess** from **The Rabbit Hole**. Both involve unsound claims that resist falsification. The difference lies in productivity: speculation generates research; pseudohistory generates excuses. This distinction hinges entirely on Node 5 ("New Findings vs. Excuses").

  A strict "could this ever be shown false?" test (Node 4) and a "does this tradition keep producing new findings?" test (Node 5) can send the same claim to different leaves. A claim might be unfalsifiable (failing Node 4) yet productive (passing Node 5). For example, early continental drift theory was initially unfalsifiable but productive. In this tree, such a claim might hit Node 4 (No) and go to Node 5. If it produces findings, it becomes **The Wild Guess**. If the user interprets "productive" loosely, a pseudohistorian claiming "conspiracies hide the evidence" might claim productivity, slipping into **The Wild Guess** instead of **The Rabbit Hole**. The tree relies on the evaluator's judgment of what counts as a "finding" versus an "excuse," which is subjective.
