          *   *PII-2 (Spatiotemporal/Relational):* Includes relations. Solves Black's spheres *by fiat* but begs the question if space is relational vs. absolute. If space is absolute, spheres share location properties relative to absolute space. If relational, they differ. Verdict: Contingent/Question-begging in this context.
          *   *PII-3 (Pure Qualitative/Intrinsic):* The "Leibnizian" ideal. No relations, no haecceities. This is what Bundle Theory needs. Verdict: False (Black's spheres are a genuine counterexample here).
          *   *PII-4 (Modal/Worlds):* Applied to worlds. Qualitative indiscernibility of worlds implies identity. Anti-haecceitism. Verdict: Defensible/Standard in contemporary metaphysics.
