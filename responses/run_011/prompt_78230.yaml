      *   *Refining the "Trivialization" Constraint:* I need to be explicit about *why* Reading 1 is trivial and why restricting properties is hard. The user wants to know if a non-arbitrary restriction exists. I should argue that "purely qualitative" is the standard non-arbitrary restriction but comes at the cost of truth.

  4.  **Drafting the Content - Section by Section:**

