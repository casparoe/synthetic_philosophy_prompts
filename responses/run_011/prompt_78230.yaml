  2.  **Deconstruct the Slogan (PII):**
      *   The slogan is the Principle of Identity of Indiscernibles (PII).
      *   Formula: $\forall x \forall y (\forall F (Fx \leftrightarrow Fy) \rightarrow x = y)$.
      *   The variations depend on the domain of quantification for $x, y$ and the range of quantification for $F$ (properties).

  3.  **Develop the Menu (Weakest to Strongest):**

