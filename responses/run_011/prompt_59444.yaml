answer: |-
  ### Framing the Episode: A Preliminary Sketch

  Before we descend into the particulars of the Wuxi judgment, let us step back and consider how we might situate this episode within our seminar. I see at least four viable frames, each highlighting different tensions between the Rosemont–Ames conception of role ethics and the reality of modern Chinese jurisprudence.

  1.  **The Legal Moralism Frame:** We could treat this as a standard problem in jurisprudence: the enforcement of morality. Here, the question is whether the state is justified in using coercive power to enforce duties that are traditionally moral or familial. This frames the issue as *Law vs. Morality*, where Confucianism simply provides the specific content of the morality being enforced.
  2.  **The Institutional Decay Frame:** We could view the statute as a symptom of social breakdown. The law is a prosthetic device used because the organic social mechanisms (clan, village, tradition) that once sustained these roles have failed. This frames the issue as *Tradition vs. Modernity*, where the law is a desperate attempt to preserve a dying social ontology.
  3.  **The Ontological Repair Frame:** This aligns most closely with the Rosemont–Ames line. If persons are constituted by their roles, then the inability to perform those roles (due to migration, economics, or estrangement) is not just a moral failure but an ontological disruption. The law, on this reading, is an attempt to legally mandate the conditions necessary for personhood itself. This frames the issue as *Being vs. Performance*.
  4.  **The Rectification of Names Frame:** We could focus on the Confucian project of *zhengming*. The law is an attempt to redefine what it means to be a "daughter" or "son" in the contemporary PRC, aligning the name with a specific set of state-approved actions. This frames the issue as *Definition vs. Practice*.

  **Selection:** I choose to proceed with the **Ontological Repair Frame**, inflected by the **Rectification of Names**.

  **Reasoning:** The Legal Moralism frame is too generic; it treats Confucian duties as merely another set of moral rules akin to Western natural law, missing the constitutive claim that persons *are* their roles. The Institutional Decay frame is sociologically rich but risks treating Confucianism as merely a historical artifact rather than a living ethical theory. The Ontological Repair frame allows us to take the Rosemont–Ames claim seriously: if a daughter is constituted by her relation to her parents, then a law commanding her to visit is not just commanding an action, but attempting to legislate the continuity of her own selfhood. However, this raises the profound question of whether state coercion can sustain an ontology that relies on spontaneous cultivation. This tension offers the most fertile ground for testing the theory against the case.

  ***

  ### I. Mapping the Roles and the Statute

  Let us begin by mapping the normative landscape of the Wuxi case through the lens of role ethics, contrasting it with the statutory text.

  **The Role-Holders and Beneficiaries**
  On the role-ethical account, the primary role-holder is the daughter. Her identity is partially constituted by being a "daughter." The beneficiary is the mother, whose identity is constituted by being a "mother." The obligation is not a debt incurred by past benefits (the gratitude model) nor a contract entered into voluntarily. It is an obligation inherent to the structure of the relationship itself. To be a daughter *is* to attend to the mother. The statute specifies this vaguely: adult children must attend to "spiritual needs" and "never neglect or slight" parents. Regarding distance, it mandates those "who live far away... should go home often."

  **The Awkward Detail: The Son-in-Law**
  The court ordered not only the daughter but also her husband to provide financial support. This detail creates a significant friction point for classical role ethics. In the traditional Confucian schematic, a daughter marries *out* of her natal family and *into* her husband's. Her primary ritual obligations shift to her husband's parents. The son-in-law's obligation to his wife's parents is secondary, derivative, and often distant.

  By ordering the husband to pay, the law converts a specific, person-to-person role obligation into a fungible household liability. It treats the married couple as a single economic unit liable for the parents of either side. From a strict role-ethical perspective, this is problematic. It suggests the obligation is not about *who one is* (a son vs. a son-in-law) but about *what resources one controls*. It risks turning the constitutive role into a tax liability. If the son-in-law is forced to pay, is he fulfilling a role? Or is he merely satisfying a debt? If role ethics insists that obligations are specific to the relation, then the law has arguably violated the specificity of the role by extending it to someone who does not stand in that constitutive relation to the elderly woman. It transforms a role-duty into a household duty, diluting the particularity that role ethics prizes.

  ### II. Classical Resources: Silence and Opposition

  You ask whether the tradition supplies resources for when family duties collide with state authority. We must look closely at the two touchstones you mentioned.

  First, consider the episode in the *Analects* where the Duke of She tells Confucius of a man named "Upright Gong" whose father stole a sheep, and the son testified against him. Confucius replies that in his village, uprightness is different: "Fathers cover for sons, and sons cover for fathers." This is a claim about the priority of familial role integrity over abstract legal justice.

  Second, consider the *Mencius* thought experiment where a student asks what the sage-king Shun would do if his father killed a man. Mencius says Shun would view abandoning the empire as like discarding a worn-out sandal. He would secretly carry his father on his back, flee to the seaside, and live in joy, forgetting the empire.

  **Do these cover the Wuxi situation?**
  Plainly stated: **No.** In fact, they point in the opposite direction.

  Both classical precedents address the tension where the state demands loyalty *against* the family (testifying against a thief) or where family loyalty requires abandoning state duty (Shun fleeing the throne). They are defenses of the family *against* the encroachment of the state. They assume the danger is that the state will break the family bond.

  The Wuxi case presents the inverse danger: the state attempting to *forge* the family bond. The classical texts assume the filial disposition is natural or cultivated through ritual, and the state should generally step back to let it flourish (or hide when it conflicts). They offer no resource for a scenario where the state becomes the active enforcer of filial piety because the spontaneous disposition has collapsed. The tradition assumes the role is internally motivated; it has no theory for what happens when the state must externally mandate the performance of the role to keep the relationship alive. We must be honest: the tradition is silent on the state as a promoter of virtue in this coercive manner. It warns against the state as a disruptor, not a micromanager of intimacy.

  ### III. The Enforcement Paradox and Role-Legibility

  You propose an "enforcement paradox": if obligation is cultivated responsiveness, external enforcement is either too thin (visiting isn't piety) or too thick (courts can't order spirit), resulting in counterfeit virtue. You ask if this is a structural objection or if it slides into motivational internalism.

  **Critique of the Paradox**
  The paradox relies on a distinction between action and disposition that is sharper than what Confucian role ethics typically accepts. In the Western virtue ethics tradition (often Aristotelian), there is a strong emphasis on the internal state of the agent; acting rightly without the right feeling is mere compliance, not virtue. This is motivational internalism.

  However, Confucian ethics, particularly through the concept of *li* (ritual propriety), often argues that the external form *cultivates* the internal state. One does not wait to feel filial to act filially; one acts filially (through ritualized visiting, serving, speaking) to *become* filial. The performance is not a counterfeit of the virtue; it is the scaffold upon which the virtue is built.

  Therefore, the paradox slides illicitly from a claim about what virtue *is* to a claim about what law *can do*, assuming they must be disjoint. If law is viewed not as a command to "feel love" but as a command to "perform the ritual," it may not be producing a counterfeit. It may be enforcing the *practice* that makes the virtue possible.

  **Refining with Role-Legibility**
  This brings us to the notion of **role-legibility**. In a complex, modern society, roles become opaque. What does it mean to be a "son" when you live 1,000 kilometers away and work 60 hours a week? The role loses its legibility; the script is lost.

  The statute's specification ("once every two months") attempts to make the role legible again. It converts an indeterminate role duty into a determinate one. Is this a loss of content? Yes, it reduces the richness of filial piety to a calendar metric. But is it also a gain? It provides a focal point. For a law student or a migrant worker unsure of how to navigate the competing demands of modern life and traditional expectation, the law offers a "minimum viable role."

  The objection holds only if we assume the law replaces the virtue. If we view the law as a *prop* for the role—a way to maintain the structural connection when social pressure fails—then it is not necessarily producing counterfeit virtue. It is maintaining the channel through which virtue might flow. However, the risk remains: if the daughter visits only because the court ordered it, and resents every visit, the role is technically performed but ontologically hollow. The law can secure the body's presence, but it cannot secure the heart's orientation. Role ethics requires the heart. Thus, the paradox is not fully dissolved, but it is mitigated if we view the law as a temporary scaffold for role-restoration rather than a final definition of the role.

  ### IV. Background Conditions and Institutional Silence

  We must confront the material conditions: the *hukou* system restricting residency, the economic necessity of migration, the 4-2-1 family structure (four grandparents, two parents, one child).

  **Does role ethics have anything to say here?**
  I must be plain: **Classical role ethics is largely silent on these institutional preconditions.**

  The tradition presupposes an agrarian society where families live in close proximity, where lineage structures provide support, and where economic life is integrated with family life. It assumes the role is *possible*. It offers ethics for how to behave *within* the role, not political theory for how to structure a society so the role remains viable.

  When the material conditions make the role impossible (e.g., a single child physically cannot visit four grandparents and two parents frequently while working in a distant megacity), role ethics has no internal resource to critique the state. It can only critique the child for failing the role. This is a significant blind spot. The theory posits that persons are constituted by roles, but it fails to account for what happens when the state structures the economy in a way that makes those roles unsustainable.

  If we are teaching this to law students, we must admit that role ethics, in its classical form, cannot answer the question: "Is this law unjust because it mandates the impossible?" It can only say, "You must strive to be a son." It lacks a theory of institutional justice that would distribute the burden of care across the state and society rather than collapsing it onto the individual role-holder. It treats the breakdown of care as a moral failure of the individual, not a structural failure of the polity.

  ### V. The Reverse Direction: What the Case Shows About the Theory

  Finally, we turn the lens back onto the theory. What does the Wuxi judgment tell us about Confucian role ethics?

  Is it a **Confirmation**? One could argue the state is finally embracing the Confucian vision, using law to rectify names (*zhengming*), ensuring fathers are fathers and sons are sons.
  Is it an **Anomaly**? A weird statistical blip in a largely Westernized legal system?
  Is it an **Unanticipated Case**? A scenario the tradition never foresaw?

  **Verdict:** It is an **Unanticipated Case**.

  **Why:** The inherited problem of Confucian jurisprudence was how to protect the family *from* the state (as seen in the *Analects* and *Mencius* examples). The tradition assumes the state is a potential threat to the integrity of familial roles. The Wuxi judgment inverts this: the state assumes the role of the guardian of the family, intervening to force the family to be a family.

  This reveals a limit in the theory. Role ethics assumes that if the roles are named and practiced, harmony follows. It did not anticipate a modernity where the roles themselves are economically and geographically fractured to the point that the state must act as a surrogate parent to enforce the child's role. It shows that role ethics, without a配套 (matching) political theory of institutional support, is vulnerable to being co-opted by the state to offload welfare responsibilities onto individuals under the guise of "virtue." The theory tells us *what* we are (our roles), but the case shows it fails to tell us *how to sustain* those roles when the world changes.

  ### VI. Seminar Value: Beyond Abstract Obligations

  What can your seminar gain from this case that a purely abstract debate on special obligations cannot provide?

  Debates on special obligations in Western ethics often revolve around **justification**: Why do I owe my mother more than a stranger? Is it gratitude? Is it friendship? Is it the "special goods" only a child can provide? These are arguments about the *source* of the duty.

  The Wuxi case moves the discussion from the *source* of the duty to the **sustainability of the relation**. It forces students to confront the material reality of role ethics. It shows that obligations are not just metaphysical claims or feelings of gratitude; they are practices that require time, money, proximity, and legal structures.

  A abstract debate might conclude, "Yes, children owe parents care." The case analysis forces the question: "What happens when the child literally cannot provide that care without starving, and the state mandates it anyway?" It exposes the vulnerability of constitutive relations to political economy. It teaches students that ethics is not just about deciding what is right, but about recognizing when the conditions for being a moral person (a son, a daughter) are being structurally undermined. It transforms the discussion from "What do I owe?" to "What kind of world allows me to pay what I owe?" This is a lesson in jurisprudence that abstract moral philosophy rarely delivers.
