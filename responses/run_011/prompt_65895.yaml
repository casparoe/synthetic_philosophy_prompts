      *   **M's Stance:** Categories are "interactive kinds" (Ian Hacking's term, though I shouldn't necessarily name-drop unless it helps explain). Labeling changes the behavior/prevalence (looping effect). This undermines the ability to validate the category empirically *after* introduction. Old categories are safe because the loop has settled.
