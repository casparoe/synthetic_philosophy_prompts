answer: |-
  ### I. Mapping the Naming Game

  Before applying the normative framework, we must map the descriptive landscape. The central friction in April–June 1994 was not ontological (what was happening) but deontic (what must be done about it).

  *   **The Principals (President, NSC, State, Defense):**
      *   *Belief:* They knew the scale of killing was massive and systematic by late April. Intelligence reports and media coverage made the "facts" of slaughter indisputable.
      *   *Constraint:* Post-Somalia political aversion to peacekeeping; no strategic interest; fear of the 1948 Convention's "duty to prevent."
      *   *Option:* Acknowledge genocide $\rightarrow$ face pressure to intervene. Deny genocide $\rightarrow$ face moral outrage.
      *   *Strategy:* Select the middle path (lexical free-riding) to manage political risk.

  *   **The Lawyers (State Dept Legal Adviser, NSC Counsel):**
      *   *Belief:* The 1948 Convention creates legal obligations triggered by the classification.
      *   *Option:* Advise that the legal threshold is met.
      *   *Strategy:* Draft guidance that keeps the legal trigger unpulled. They tracked the *Convention*, not Lemkin, because the Convention carries the treaty obligation.

  *   **The Spokespeople (State Dept Bureau of Public Affairs):**
      *   *Belief:* Bound by interagency clearance.
      *   *Option:* Deviate from script.
      *   *Strategy:* Strict adherence to "acts of genocide may have occurred." Their role was to perform the uncertainty required by the policy.

  *   **The Ambassador (Rawson, Kigali):**
      *   *Belief:* Witnessed the collapse of order and targeted killing firsthand.
      *   *Option:* Resign or leak.
      *   *Strategy:* Publicly defended the "responsible government" formula (aligning with Washington) while privately reporting the reality. This highlights the bifurcation between the *field epistemic state* (certainty) and the *capital speech act* (hedged).

  *   **The Press Corps:**
      *   *Belief:* This is genocide.
      *   *Option:* Force the label through repeated questioning.
      *   *Strategy:* Tried to collapse the gap between the facts they reported and the label the State Dept withheld.

  **Consensus:** Almost no serious player disputed the *facts* of the killing by May 1994. The dispute was entirely about the *consequences of the label*.

  ### II. The Definition and the Speech Act

  **Lemkin vs. The Convention**
  The administration's lawyers were tracking the **1948 Convention**, exclusively. Lemkin's 1944 formulation is sociological and moral; it describes a *phenomenon*. The Convention describes a *crime* and attaches *jurisdiction and obligation*.
  *   **Lemkin:** Focuses on the destruction of "essential foundations of life." By this standard, Rwanda was genocide by week two.
  *   **Convention:** Focuses on "intent to destroy, in whole or in part, a national, ethnical, racial or religious group." This requires specific intent (*dolus specialis*).
  *   **The Move:** By insisting on the Convention's legal test, the US introduced a procedural hurdle (legal determination of intent) that allowed them to treat an observable sociological reality (Lemkin) as a disputed legal conclusion.

  **Lie, Misleading, or Neither?**
  The formula "acts of genocide may have occurred" is a **misleading literal truth** (often called "paltering").
  *   **Why it is not a lie:** It is factually true that *acts* constitutive of genocide were occurring. The modal verb "may" technically qualifies the *legal classification*, not the physical acts.
  *   **Why it is misleading:** In ordinary conversation, if a speaker says "X may have occurred" when they possess high-confidence evidence that "X is occurring," they violate the Gricean maxim of Quantity (make your contribution as informative as required). The administration possessed sufficient evidence to assert "genocide is occurring" but chose the weaker modal to implicate uncertainty where there was none.
  *   **The Gap:** The lying/misleading distinction struggles here because the statement isn't about the world; it's about the *government's internal legal process*. It is a bureaucratic truth ("We have not finalized the determination") masquerading as an empirical truth ("We don't know what is happening").

  ### III. Auditing the Evidential Hedge (Item 3)

  You ask for a principled way to locate the crossing point where "we need to investigate" becomes false.
  *   **The Rawson Defense:** "As a responsible Government, you don't just go around hollering 'genocide'." This frames the hedge as a matter of *prudence* rather than *epistemology*.
  *   **The Crossing Point:** The hedge ceases to be valid when the *marginal value of additional certainty* is outweighed by the *cost of delay*. In epistemic ethics, the threshold for assertion is usually "knowledge" or "justified true belief." In *humanitarian* ethics, the threshold is "reasonable belief sufficient to act."
  *   **The Date:** **April 21–30, 1994.** By the time the UN Security Council voted to draw down the force (April 21), the pattern of targeting Tutsis was explicit. To say after this date that the situation "needed investigation" to determine if genocide was occurring is false, because the *purpose* of the investigation shifted from discovery to delay.
  *   **Defense of the Date:** You defend this date not by citing new evidence, but by citing the *stability* of existing evidence. If the evidence base does not change for two weeks while killing accelerates, the claim "we need more evidence" becomes a claim about *policy*, not *proof*. The hedge becomes a falsehood when it no longer reflects the speaker's actual credence. By late April, the Principals' credence was high; their speech act indicated low credence. That is the falsehood.

  ### IV. Auditing Your Framework

  Here is the honest audit of your four claims against the 1994 episode.

  **1. Naming-as-Action (Performative vs. Descriptive)**
  *   **Verdict:** **Survives and carries the load.**
  *   **Analysis:** This is the strongest pillar. The episode proves that for the US government, "genocide" was not a description of reality but a trigger for obligation. If it were merely descriptive, the delay would be an error of fact. Because it was treated as performative (naming = troops), the delay was a strategic choice. The ethics of assertion usually govern constative speech (describing the world). This framework correctly identifies that ICL naming is illocutionary (changing the world).

  **2. Lexical Free-Riding**
  *   **Verdict:** **Survives, but your claim that it is "worse than the flat denier" needs nuance.**
  *   **Analysis:** The US used "acts of genocide," "ethnic cleansing," and "chaos" to retain moral gravity (acknowledging horror) while shedding legal entailments (avoiding troops).
  *   **Critique:** Is it *worse* than denial? A flat denier ("This is not genocide") can be empirically refuted quickly. The free-rider ("Acts of genocide may have occurred") is resilient to refutation because it is technically true. It corrodes the language's ability to function as a alarm bell. It is more *insidious*, but perhaps morally equivalent in outcome. However, your claim that it *exploits* the term's authority is correct. It uses the word's shadow to look responsible without accepting the word's substance.

  **3. The Evidential Hedge Floor**
  *   **Verdict:** **The episode undercuts the idea of a "principled" epistemic floor.**
  *   **Analysis:** Your framework asks for a principled way to locate the crossing point. The episode shows there *isn't* one internal to epistemology. The "floor" is determined by the *stakes*. If the cost of false positive is diplomatic embarrassment and the cost of false negative is 800,000 deaths, the evidential floor drops. The US treated the floor as static (legal certainty) when the moral context demanded it be dynamic (risk assessment). The framework is silent on *who sets the floor*, which is the actual political battle.

  **4. Delayed Naming $\neq$ Partial Compliance**
  *   **Verdict:** **Strongly Vindicated.**
  *   **Analysis:** Clinton's 1998 apology confirms this. Naming in 1998 could not "prevent" or "punish" the 1994 crime in real-time. It functioned as *confession* or *memorialization*, not *prevention*. The speech act changed from "Warning/Trigger" to "Apology/Exorcism." Your distinction that retroactive naming is a different speech act entirely is philosophically sound. It acknowledges the debt without paying the bill.

  ### V. Displacement Activity: Naming vs. Intervention

  You suspect the word-fight was a displacement activity. **You are correct.**
  The moral problem was not the naming; the naming was the *proxy* for the intervention.
  *   **The Logic:** If the US says "Genocide," the public expects troops. If the US sends no troops after saying "Genocide," they are in violation of the Convention and domestic political trust.
  *   **The Displacement:** It is easier to fight over a dictionary definition than a deployment order. The "naming fight" allowed the administration to appear engaged (holding press briefings, debating legal terms) while avoiding the actual cost (boots on the ground).
  *   **Theory Limit:** Your framework focuses on the *ethics of the word*. It risks obscuring the *ethics of the deed*. If the US had said "Genocide" and still done nothing, the moral failure would be identical (abandonment), even if the linguistic failure were resolved. The framework explains the *mechanism* of avoidance, but the *moral core* is the refusal to intervene, not the refusal to speak.

  ### VI. Control Case: Cambodia

  **Prediction:** If the legal label is awkward (due to protected groups), the state will use Lexical Free-Riding and Bureaucratic Hedges.
  **Reality:** The Khmer Rouge killed "class enemies" and political opponents. The 1948 Convention does not protect political groups.
  **Application:**
  *   **Item 1 (Naming-as-Action):** The US avoided the label "genocide" for Cambodia for years, partly because the legal trigger was ambiguous (were they a national/ethnic group or a political one?).
  *   **Item 2 (Free-Riding):** Terms like "auto-genocide" or "mass murder" were used. This kept the moral horror but sidestepped the Convention's specific group requirements.
  *   **Item 3 (Hedge):** The State Department setting up an office to "look into it" in 1994 (decades later) mirrors the Rwanda "investigation" hedge. It creates the appearance of diligence without the commitment of judgment.
  *   **Fit:** The framework fits well. Where the legal definition is structurally awkward (Cambodia), the state uses that ambiguity to justify silence. Where the definition fits but the *will* is absent (Rwanda), the state manufactures epistemic uncertainty. In both cases, the result is the same: the label is withheld to avoid the duty.

  ### VII. Conclusion: Where the Theory Runs Out

  Your framework is robust on the **philosophy of language** (Items 1, 2, 4) but reaches its limit on the **political economy of obligation** (Item 3).
  *   **Strength:** It successfully categorizes "acts of genocide may have occurred" as a distinct class of bad-faith assertion (free-riding/misleading literal truth) and correctly identifies retroactive naming as a different speech act.
  *   **Limit:** It assumes that clarifying the norms of assertion would solve the problem. The Rwanda episode suggests the norms were understood perfectly; they were simply overridden by political calculus. The "evidential floor" is not an epistemic boundary but a political shield.
  *   **Final Verdict:** The framework explains *how* the lie was told, but not *why* it was permitted. It diagnoses the linguistic pathology but cannot cure the political unwillingness that necessitated it. The "ethics of assertion" collides with the "realism of statecraft," and in 1994, statecraft treated the ethics of assertion as a casualty of war.
