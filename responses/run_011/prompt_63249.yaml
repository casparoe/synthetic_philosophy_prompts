  # JOINT MEMORANDUM ON INDUCTION AND CONSERVATION

  **Part I — Agreed Claims**

  1.  **The No-Free-Lunch (NFL) Identity:** For any fixed set of target functions and any two learning algorithms, if performance is averaged uniformly over all possible target functions, the expected performance of both algorithms is identical.
      *   *Weak Reading:* The mean accuracy across the function space is equal for all methods.
      *   *Strong Reading:* The entire distribution of performance trajectories is identical under permutation of the function space.
      *   *Camp A Requirement:* Camp A relies on the Strong Reading to argue that no method is intrinsically distinguished.
      *   *Camp B Requirement:* Camp B accepts the Weak Reading as a mathematical identity but denies it carries the Strong Reading's metaphysical weight regarding specific worlds.
  2.  **Hume's Target:** The problem of induction asks whether there is a non-circular justification for expecting unobserved instances to resemble observed instances, independent of specific empirical assumptions about the world's structure.
  3.  **Uniform Accuracy Derivation:** In Setting S, under measure $M_u$ (uniform over all 16 targets), the expected accuracy of any learner is exactly 0.5.
      *   *Proof:* For any training set of two points, there exist exactly two target functions consistent with the data that assign 0 to the test point, and exactly two that assign 1. By symmetry of $M_u$, the posterior probability of the test label being 0 or 1 is equal. Thus, no guess yields expected accuracy greater than chance.

  **Part II — The Disagreement, Stated Twice**

  **The Conservationist Rendering (Camp A):**
  The NFL theorems demonstrate that inductive success is a zero-sum game across logical space. Any gain a method achieves on a subset of worlds is mathematically necessitated by a loss on the complement. Therefore, a method's success in our world cannot be attributed to the method's rationality *per se*, but to a match between the method and the specific distribution of our world. Since the uniform distribution represents the only state of total ignorance, any deviation from it constitutes an assumption. Consequently, induction has no general justification; it is rational only relative to imported priors.

  **The Deflationist Rendering (Camp B):**
  The NFL theorems are consistency checks on averaging procedures, not limitations on learning. They hold only because the averaging measure ($M_u$) treats chaotic, anti-inductive worlds as equally probable as structured, inductive ones. This measure does not represent "ignorance" but a specific, highly biased commitment to noise. The theorems leave untouched the practical question: given that we inhabit a world with stable regularities, which method extracts them best? Hume's problem is not vindicated by NFL; it is bypassed, because the theorem's premises (uniformity over all functions) are irrelevant to the agent's actual situation.

  **Glossary of Divergent Terms:**

  *   **Assumption:**
      *   *Camp A:* Any deviation from the uniform prior over all logically possible functions.
      *   *Camp B:* An explicit constraint on the hypothesis space or data generating process.
      *   *Stipulation:* We distinguish *structural assumptions* (constraints on the world) from *methodological biases* (preferences within the algorithm).
  *   **Prior:**
      *   *Camp A:* An inevitable weighting of possibilities, even if implicit in the algorithm's design.
      *   *Camp B:* A formal probability distribution explicitly held by the agent.
      *   *Stipulation:* "Prior" refers to the probability measure over targets used to evaluate expected performance.
  *   **General Purpose:**
      *   *Camp A:* A method that performs well averaged over $M_u$. (Camp A concedes no such method exists).
      *   *Camp B:* A method that performs well on the class of worlds physically realizable or computable.
      *   *Stipulation:* "General Purpose" means "effective across the reference class of worlds deemed relevant."
  *   **Justification:**
      *   *Camp A:* A proof of reliability valid across all logically possible worlds.
      *   *Camp B:* A proof of reliability valid across the actual world and its near neighbors.
      *   *Stipulation:* We seek *local justification* (reliability in our context) rather than *global justification* (reliability everywhere).
  *   **Algorithm:**
      *   *Camp A:* A mapping from data sequences to predictions, abstracted from computational cost.
      *   *Camp B:* A physical procedure bounded by time and memory.
      *   *Stipulation:* We treat algorithms as input-output mappings, noting where resource bounds alter the function space.

  **Part III — Cruxes**

  | Crux | Construction / Test | Conservationist Prediction | Deflationist Prediction | Concession if Prediction Fails |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Fixed Target Assumption** | Treat the target as varying during data collection (non-stationary). | The NFL identity collapses; thus, the fixed-target hypothesis is a substantive inductive assumption required for the theorem. | The fixed-target hypothesis is a definition of the learning problem, not an inductive assumption about the world's nature. | **Camp A:** Admits NFL does not vindicate Hume for non-stationary worlds, limiting the scope of the "contentless" claim. |
  | **2. Computability Bounds** | Restrict target functions to those computable by a Turing machine within $N$ steps. | The symmetry breaks, but a new symmetry arises over the set of computable functions, preserving the zero-sum nature. | The symmetry breaks irreparably; structured functions vastly outnumber unstructured ones in computable space, allowing general success. | **Camp A:** Admits induction is not contentless for computable worlds; Hume is not fully vindicated. |
  | **3. Online Regret** | Compare Multiplicative Weights aggregator against best expert in a finite class. | The guarantee is uniform over outcomes, but the inductive commitment is relocated to the choice of the expert class. | The guarantee is a genuine win: it ensures performance close to the best available strategy without knowing which is best. | **Camp B:** Admits that if the expert class contains no good predictor, the guarantee is vacuous (relocates the burden). |
  | **4. Neutrality of $M_u$** | Compare $M_u$ against $M_s$ (smooth) and $M_a$ (anti-smooth). | $M_u$ is the only prior representing total ignorance; $M_s$ and $M_a$ are biased. | $M_u$ is a positive commitment to high-entropy worlds; $M_s$ matches physical reality better. | **Camp A:** Admits "no assumption" is ill-defined if $M_u$ counts as a specific bias against smoothness. |

  **Part IV — The Verbal Component**

  Adopting the stipulations in Part II dissolves the dispute over whether the NFL theorems are *mathematically true*. Both camps agree they are. The dispute over whether $M_u$ represents "ignorance" also dissolves into a definition: if ignorance means "no structural constraints," $M_u$ fits; if it means "no preference for noise over signal," $M_u$ fails.

  The substantive residue is narrow but deep. It concerns the **Reference Class Problem**. Camp A insists the reference class for evaluating rationality must be "all logically possible worlds." Camp B insists it must be "all physically or computationally plausible worlds."

  If the reference class is logical space, Camp A is correct: induction is unjustified without priors. If the reference class is physical space, Camp B is correct: induction is justified by the structure of that space, and NFL is irrelevant.

  Is this residue worth eleven years? Yes. It clarifies that the disagreement is not about mathematics or even about the utility of induction, but about the scope of philosophy. Camp A seeks a justification that holds even if the world were chaos. Camp B seeks a justification that holds because the world is not chaos. We agree that no document can bridge this without choosing a reference class. We sign this to record that choice as the boundary of our disagreement.

  **Part V — Appendix: The Arithmetic**

  **1. Enumeration of Targets**
  In Setting S (4 points on a cycle), there are 16 functions. Let $T(f)$ be the number of edges where values change.
  *   **$T=0$ (Constant):** 0000, 1111. (Count: 2)
  *   **$T=2$ (Smooth):** All functions with one contiguous block of 1s (sizes 1, 2, or 3). Examples: 1000, 1100, 1110. (Count: 12)
  *   **$T=4$ (Alternating):** 1010, 0101. (Count: 2)
  *   **Total:** 16 functions.

  **2. Measure Weights**
  *   **$M_u$ (Uniform):** Weight $1/16$ for all.
  *   **$M_s$ (Smoothness Bias):** Proportional to $2^{-T(f)}$.
      *   Raw weights: $T=0 \to 1$; $T=2 \to 0.25$; $T=4 \to 0.0625$.
      *   Sum ($Z_s$): $2(1) + 12(0.25) + 2(0.0625) = 2 + 3 + 0.125 = 5.125$.
      *   Normalized Probabilities: $P(T=0) = 16/41$; $P(T=2) = 24/41$; $P(T=4) = 1/41$.
  *   **$M_a$ (Anti-Smoothness Bias):** Proportional to $2^{+T(f)}$.
      *   Raw weights: $T=0 \to 1$; $T=2 \to 4$; $T=4 \to 16$.
      *   Sum ($Z_a$): $2(1) + 12(4) + 2(16) = 2 + 48 + 32 = 82$.
      *   Normalized Probabilities: $P(T=0) = 2/82$; $P(T=2) = 48/82$; $P(T=4) = 32/82$.

  **3. Learner Performance**
  Consider $L_{smooth}$, which guesses the label minimizing transitions with observed neighbors.
  *   **Under $M_u$:** Expected accuracy is 0.5 (by Part I).
  *   **Under $M_s$:** Since $M_s$ heavily weights $T=0$ and $T=2$ (40/41 probability), and $L_{smooth}$ is optimized for these, accuracy $> 0.5$. (Calculation: On $T=0$, accuracy is 1.0. On $T=2$, accuracy is high. On $T=4$, accuracy is low).
  *   **Under $M_a$:** Since $M_a$ heavily weights $T=4$ (32/82 probability), and $L_{smooth}$ fails on alternating patterns, accuracy $< 0.5$.

  **4. The Offset Question**
  *Question:* Is the gain under $M_s$ exactly offset by the loss under $M_a$ for this specific learner?
  *Answer:* No. Exact offset requires $M_s(f) + M_a(f) = 2 M_u(f)$ for all $f$.
  *   For $T=0$: $M_s \approx 0.39$, $M_a \approx 0.02$. Sum $\approx 0.41$. $2 M_u = 0.125$.
  *   The sums are not equal. Conservation holds only when averaging over **all learners** for a fixed measure, or over **all measures** for a fixed learner class, not pairwise for one learner across two biased measures.

  **5. Camp Statements on Arithmetic**
  *   **Camp A:** "The arithmetic shows that while pairwise offset fails, the aggregate balance remains; the structure of the function space enforces a conservation law that no single learner can escape without paying elsewhere."
  *   **Camp B:** "The arithmetic shows that pairwise offset fails; the 'conservation' is an artifact of averaging over measures we have no reason to inhabit, rendering it irrelevant to the performance of $L_{smooth}$ in a smooth world."
  *   **Disagreement:** Camp A sees the aggregate law as the fundamental truth; Camp B sees the specific performance in the specific measure as the fundamental truth.

  ***

  **Closing Note (Not Part of Joint Statement)**
  Having drafted this, I observe that Camp B (Deflationists) is better placed. Camp A's position relies on the uniform measure $M_u$ representing a normative standard of "ignorance." However, the arithmetic in Setting S demonstrates that $M_u$ assigns low probability to the structural properties (smoothness) that define learnability. To treat $M_u$ as neutral is to treat noise as the default state of reality, which is itself a substantive metaphysical claim. Camp B correctly identifies that NFL theorems constrain averages over logical space, but do not constrain inference in physical space where computability and stability break the symmetry Camp A requires. Camp A is logically consistent within a solipsistic framework; Camp B is consistent within a scientific one.
