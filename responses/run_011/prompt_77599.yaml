answer: |-
  # Joint Statement on the Relation Between Phenomenal Consciousness and Cognitive Access

  **Prepared by:** The Adversarial Collaboration Group (Sparse/Access vs. Rich/Phenomenal)
  **Date:** October 26, 2023
  **Subject:** Delimitation of Disagreement regarding Consciousness and Global Availability

  ## 1. Jointly Endorsed Claims

  The following claims represent points of convergence between Party A (Global Workspace/Sparse) and Party B (Phenomenal Overflow/Rich). We distinguish between claims regarding the empirical or conceptual landscape that both parties accept as true (**Substantive Agreement**) and claims that represent a charitable restatement of one party's position that the other accepts as accurate, without necessarily endorsing the truth of that position (**Descriptive Agreement**).

  1.  **[Substantive]** **The Status of Report:** Neither party holds that the ability to produce a verbal or motor report is constitutive of consciousness. Both agree that report is a fallible, downstream measure of consciousness. Consequently, evidence relying solely on the absence of report to demonstrate the absence of consciousness is inadmissible without independent justification.
  2.  **[Substantive]** **The Partial-Report Paradigm:** Both parties agree that the partial-report superiority effect (where subjects recall more items from a briefly presented array when cued post-stimulus) demonstrates the existence of a high-capacity, rapidly decaying sensory store (iconic memory). Both agree this paradigm does not, on its own, settle whether the contents of that store are phenomenally conscious.
  3.  **[Substantive]** **Fragility and Blindness:** Both parties accept the reality of change blindness and inattentional blindness. Both agree that without attention or consolidation, information is rapidly lost and cannot be utilized for deliberate reasoning or long-term planning.
  4.  **[Descriptive]** **Party A's Commitment (as described by B):** Party B accepts the following as a fair description of Party A's view: For A, a mental state is conscious if and only if its content is globally available to systems for reporting, reasoning, and rational control of action. A treats the "richness" of the visual field as a metacognitive illusion generated by the potential for rapid sampling, not as a census of simultaneous conscious content.
  5.  **[Descriptive]** **Party B's Datum (as described by A):** Party A accepts the following as a fair description of Party B's starting point: B takes as a phenomenological datum that perceptual experience *seems* to present more detail (e.g., in the periphery or unattended regions) than can be accessed or reported at any instant. B insists this "seeming" reflects an actual state of phenomenal consciousness that overflows cognitive access, not merely a disposition to become conscious.

  ## 2. Table of Disagreements

  | Topic | Party A (Sparse/Access) Formulation | Party B (Rich/Phenomenal) Formulation | Neutral Formulation | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **The Nature of Phenomenology** | Phenomenal consciousness is identical to, or supervenes upon, global cognitive availability. | Phenomenal consciousness is distinct from cognitive availability and can exceed it. | What is the necessary and sufficient relation between phenomenal character and global availability? | **Genuine** |
  | **Interpretation of Richness** | The impression of richness is a cognitive heuristic regarding potential access, not evidence of simultaneous conscious content. | The impression of richness is veridical evidence of a high-capacity phenomenal field that exists prior to access. | How should the subjective sense of a rich visual field be explained mechanistically? | **Genuine** |
  | **Terminological Scope** | The term "conscious" should be reserved for states that play a functional role in reasoning and reporting. | The term "conscious" should track subjective experience regardless of its functional availability for report. | Does the term "conscious" refer to a functional role or a qualitative state? | **Partly Verbal** |
  | **Unaccessed Content** | Content that is not globally available is unconscious, regardless of how much sensory processing it undergoes. | Content that is not globally available can still be phenomenally conscious (phenomenal overflow). | Can a state possess phenomenal character without being available for global control? | **Genuine** |

  ## 3. The Cruxes

  We identify four sub-questions such that a definitive answer would compel at least one party to revise their position.

  **Crux 1: The Determinacy of Overflow**
  *Question:* If phenomenal overflow exists, is the content determinate (e.g., a specific letter 'K' or a specific orientation) or merely determinable (a generic sense of "something there" that supports rapid uptake without specific phenomenology)?
  *Movement:* If the content is shown to be merely determinable (generic), **Party B** moves toward Party A (conceding that specific richness is an illusion of potential). If the content is shown to be determinate (specific) without access, **Party A** moves toward Party B (conceding that specific consciousness exceeds access).

  **Crux 2: The Domain of Quantification**
  *Question:* Does the phrase "the contents of consciousness at time *t*" pick out the same kind of entity for both parties, or are the two sides quantifying over different domains (functional roles vs. qualitative states)?
  *Movement:* If it is demonstrated that the two sides are quantifying over fundamentally different domains with no overlap in truth conditions, **Both Parties** move toward a verbal resolution (accepting they are talking past one another). If it is shown that both refer to the same natural kind but disagree on its properties, the dispute remains **Genuine**.

  **Crux 3: Causal Efficacy without Access**
  *Question:* Can unaccessed content (content not broadcast to the global workspace) guide complex, flexible behavior or learning that typically requires consciousness?
  *Movement:* If unaccessed content is shown to guide complex, flexible reasoning, **Party A** must revise the claim that global availability is necessary for conscious-level guidance. If unaccessed content is shown to be rigid and reflex-like, **Party B** must revise the claim that overflow plays a significant role in the subject's mental life.

  **Crux 4: Neural Dissociation**
  *Question:* Can neural correlates of specific content be decoded from posterior sensory cortex while prefrontal markers of global availability are absent or suppressed?
  *Movement:* If specific content decoding persists in posterior cortex while prefrontal access markers are absent, **Party A** faces significant pressure (as A ties consciousness to the global broadcast). If posterior decoding fails whenever prefrontal markers fail, **Party B** faces significant pressure (as B posits a phenomenal store independent of the workspace).

  ## 4. Experimental Designs and Predictions

  For each crux, we propose one concrete experimental design or analysis.

  **Design for Crux 1 (Determinacy): The Specific-Feature Priming Test**
  *Method:* Subjects are presented with a masked array of letters. They are not asked to report the letters. Immediately after, they perform a lexical decision task on a target word. The critical condition involves a prime letter that is visually similar but not identical to a letter in the target word (e.g., prime 'C', target 'CAT' vs. 'BAT').
  *Prediction A:* No specific priming effect for unreported items. Any facilitation will be categorical (letter vs. number), not specific.
  *Prediction B:* Specific priming effect observed even when subjects cannot report the prime.
  *Interpretation:* If specific priming occurs without report, A may argue this is unconscious semantic activation, not conscious phenomenology. B will argue this confirms determinate phenomenal overflow.

  **Design for Crux 2 (Quantification): The Conceptual Analysis Protocol**
  *Method:* A structured philosophical and operational analysis where both parties define "content" and "time *t*" in terms of measurable variables (e.g., neural firing windows, behavioral latency).
  *Prediction A:* Operational definitions will reveal A quantifies over "reportable information states."
  *Prediction B:* Operational definitions will reveal B quantifies over "subjective quality states."
  *Interpretation:* If the operational definitions do not overlap, the crux is verbal. If they overlap but predictions diverge, the crux is substantive.

  **Design for Crux 3 (Causal Efficacy): The Implicit Learning Paradigm**
  *Method:* A probabilistic sequence learning task where the sequence rules are complex. Subjects perform a secondary task that occupies the global workspace (high cognitive load), preventing conscious awareness of the sequence.
  *Prediction A:* Learning will be slow, rigid, and fail to transfer to new contexts (hallmarks of unconscious processing).
  *Prediction B:* Learning will show flexibility and rapid adaptation (hallmarks of conscious processing), despite the load.
  *Interpretation:* Flexible learning under load supports B. Rigid learning supports A.

  **Design for Crux 4 (Neural Dissociation & Supervisor's Proposal): The Dual-Task Partial-Report**
  *Method:* A briefly presented visual array is followed immediately by a demanding central load that occupies the workspace (e.g., a continuous auditory 2-back task). No report of the array is solicited during the trial. At the end of each block, subjects give graded confidence and a forced choice about a cued location from the earlier arrays.
  *Prediction A:* Performance on the cued-item forced choice will drop to chance levels when the auditory load is high. Without global availability, the iconic trace cannot be utilized or sustained as consciousness.
  *Prediction B:* Performance on the cued-item forced choice will remain significantly above chance, even under high load. The phenomenal store persists despite the workspace being occupied.
  *Interpretation of Divergent Data:* If performance remains above chance, B claims this is proof of overflow. A claims this is evidence of unconscious sensory processing that does not constitute consciousness.
  *Interpretation of Convergent Data:* **Note:** It is possible both parties predict above-chance performance but diverge on the reading. If the result is above-chance performance, Party A will maintain this reflects unconscious processing because the workspace was occupied. Party B will maintain this reflects conscious processing because the phenomenology was present. **Plainly Stated:** If the data shows above-chance performance, this specific experiment may not decide the crux because the parties disagree on whether "performance without workspace access" equals "consciousness." The crux is decidable only if we agree *a priori* that performance under total workspace blockade implies consciousness (which A denies). Therefore, this experiment tests the *capacity* of the store, but the *conscious status* of that store remains an interpretive layer.

  ## 5. Closing Statements on Falsification and Stalemates

  **Party A Statement on Falsification:**
  "I would accept evidence counting against my view if it were demonstrated that specific, detailed content (e.g., the orientation of a grating or the identity of a letter) could guide novel, flexible reasoning or deliberation in the complete absence of global availability. Mere sensory priming is insufficient; the content must be shown to enter into the kind of rational integration that defines the global workspace, without actually being in the workspace."

  **Party B Statement on Falsification:**
  "I would accept evidence counting against my view if it were demonstrated that whenever specific phenomenal content is present, it is necessarily reportable under idealized conditions (e.g., immediate cueing with no interference). If the 'richness' dissolves completely whenever we control for post-perceptual memory and attention, leaving only a generic sense of 'something there,' I would concede that the specific overflow is an illusion."

  **Joint List of Non-Moving Evidence:**
  Both parties agree that the following would **not** resolve the debate:
  1.  **Report-Based Criteria:** Any evidence that treats the ability to report as the definition of consciousness. (Reason: Both agree report is evidence, not constitution.)
  2.  **Untethered Introspection:** Appeals to "how rich experience seems" that do not distinguish between the *seeming* of richness and the *representational capacity* underlying it. (Reason: A explains the seeming via potential access; B explains it via actual overflow. The seeming itself is not in dispute.)
  3.  **Semantic Stipulations:** Arguments that rely solely on redefining "conscious" without linking the definition to empirical markers or causal roles. (Reason: This changes the subject rather than resolving the mechanism.)

  ## 6. Joint Assessment of Verbal vs. Substantive Dispute

  We conclude that the dispute contains both verbal and substantive elements, and the dividing line runs through the definition of the term "conscious" versus the architecture of the sensory store. The dispute is **merely verbal** insofar as Party A and Party B use the word "conscious" to track different natural kinds: A tracks *functional availability for report and reasoning*, while B tracks *subjective qualitative character*. If this terminological divergence is acknowledged, much of the heat dissipates; A can admit there is "qualitative character without access" provided they are allowed to call it "unconscious phenomenology," and B can admit "access is required for report" provided they are allowed to call the pre-access state "conscious."

  However, the dispute is **substantive** regarding the *capacity and determinacy* of that pre-access store. It is not a matter of stipulation whether the high-capacity store carries specific information (e.g., specific letters) or merely generic information (e.g., "text is present"). It is not a matter of stipulation whether that store can influence behavior when the workspace is fully occupied. These are empirical questions about the mind's architecture. Therefore, while we recommend distinct terminology to avoid confusion (e.g., "phenomenal field" vs. "global workspace content"), we affirm that a genuine scientific disagreement remains regarding the informational richness and causal power of the phenomenal field independent of access.
