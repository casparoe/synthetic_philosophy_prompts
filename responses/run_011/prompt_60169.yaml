prompt: |-
  I write the ideas column for a weekly — normally science and cognition, but this month I've been reporting a piece on immigration and work, and one sentence has turned up in nearly every interview I've done: immigrants do the jobs the rest of us wont do. I've heard it from a nursing-home operator who means it approvingly, from a union organizer who means it as an indictment (the jobs are terrible, that's the whole point), and from an economist who told me the sentence is worthless until somebody names a wage. That last one is where I'm stuck, because I want to build my nut graf around the phrase and I have no idea which version of it I'd be signing up for.

  Can you take the sentence apart for me? I want the different claims it could be making laid out as a menu, not as one settled meaning. My guess is that the load is on "won't," but there's probably stuff hiding in "the jobs" too, and in who counts as "the rest of us." For each reading: what it actually asserts, whether it's a claim about willingness or about ability or about legal permission, whether it's trivially true / substantively true / probably false, and what you'd have to go look at to settle it.

  Three more things. Some people use the sentence to argue that immigration therefore can't be dragging native wages down — tell me which reading, if any, actually licenses that inference. There's also a chicken-and-egg worry I can't quite articulate, something about whether a job is badly paid because nobody wants it or unwanted because it's badly paid, and whether it changes what "the jobs" even refers to once people start filling them — if that's a separate reading, say so and put it on the list. And finally: which reading does each of my three sources need for their point to survive, are those readings compatible with each other, and is there any version of the sentence I can print without it being either empty or false?

  Keep it to something I can read in ten minutes. No citations or reading list — I just need the distinctions and your verdicts on them.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Task:** Deconstruct the sentence "Immigrants do the jobs the rest of us won't do."
      *   **Format:** A "menu" of different claims/readings, not a single settled meaning.
      *   **Specific Requirements:**
          *   Break down "won't," "the jobs," and "the rest of us."
          *   For each reading: Asserted claim, type (willingness/ability/legal), truth value (trivial/substantive/false), and verification method.
          *   Address the wage inference (does immigration drag wages down?).
          *   Address the chicken-and-egg problem (bad pay vs. unwanted).
          *   Analyze the three sources (nursing-home operator, union organizer, economist) and their compatibility.
          *   Verdict: Is there a version worth printing?
      *   **Constraints:** ~10 minute read, no citations/reading list, focus on distinctions and verdicts.
      *   **Tone:** Analytical, journalistic, clear, nuanced (fitting an ideas column).

  2.  **Deconstruct the Sentence:**
      *   *Subject:* Immigrants (undocumented? legal? high-skilled? low-skilled?).
      *   *Object:* The jobs (specific tasks? specific wage levels? specific conditions?).
      *   *Predicate:* Won't do (refusal based on price? culture? ability? legality?).
      *   *Contrast:* The rest of us (natives? citizens? existing workforce?).

  3.  **Develop the "Menu" of Readings:**
      *   *Reading 1: The Price Mechanism (Economist's View).* It's about wage elasticity. Natives *would* do it if paid more.
      *   *Reading 2: The Structural/Condition View (Union View).* The jobs are objectively terrible (dangerous, degrading). It's an indictment of the employer, not the worker.
      *   *Reading 3: The Cultural/Prestige View.* Natives view certain work as beneath them due to social status, regardless of pay.
      *   *Reading 4: The Legal/Permission View.* Natives *can't* do them (or employers *won't hire* them) due to documentation/status issues, often conflated with "won't."
      *   *Reading 5: The Endogenous Job View (Chicken-and-Egg).* The job exists *as currently constituted* only because immigrants fill it. Change the worker, change the job.

  4.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the ubiquity of the phrase and the writer's dilemma. Set the stage for the dissection.
      *   **The Menu (The Core):**
          *   *Claim 1: The Wage Gap (Economist).* Asserts natives have a higher reservation wage. Willingness, not ability. Substantively true but trivial if wage isn't specified. Check: Wage elasticity studies.
          *   *Claim 2: The Hardship Indictment (Union).* Asserts jobs are inherently undesirable (danger, dignity). Willingness conditioned on safety/dignity, not just pay. Substantively true for specific sectors. Check: Injury rates, turnover.
          *   *Claim 3: The Social Status (Cultural).* Asserts natives avoid low-prestige work. Willingness based on social signaling. Hard to measure. Check: Sociological surveys on job prestige vs. fill rates.
          *   *Claim 4: The Legal Barrier.* Asserts natives are legally excluded or employers prefer undocumented for control. Ability/Permission. True in specific contexts (e.g., cash economy). Check: E-verify data, enforcement records.
          *   *Claim 5: The Job Definition (Endogenous).* Asserts the job *is* "immigrant work" by design. If natives took it, the job would change (tech, process). This addresses the chicken-and-egg. Check: Automation rates in high-immigration vs. low-immigration sectors.

      *   **The Wage Inference:**
          *   Does it prove no wage depression? Only Reading 1 (if wages are market clearing) suggests complementarity. But if Reading 1 is true (natives need higher pay), then immigrants *are* suppressing the price required to attract natives. So the inference is usually false or misleading.

      *   **The Chicken-and-Egg (Endogeneity):**
          *   Make this Reading 5 explicit. If immigrants weren't there, would the job exist? Or would it be automated? Or would the wage rise until natives took it? This changes "the jobs" from a fixed set to a variable one.

      *   **The Three Sources:**
          *   *Nursing Home Operator:* Needs Reading 1 (Price) or 3 (Status). Wants to pay current low wage.
          *   *Union Organizer:* Needs Reading 2 (Hardship). Wants to improve conditions/wages so natives *would* want them.
          *   *Economist:* Needs Reading 1 (Price). "Won't" is meaningless without a price tag.
          *   *Compatibility:* Operator and Union are opposed on solution (keep wage low vs. raise conditions). Economist is the referee saying "specify the price."

      *   **Verdict/Conclusion:**
          *   Can it be printed? Yes, but only if qualified. The "Economist" version is the most rigorous, but the "Union" version is the most morally potent. The "Endogenous" version is the most intellectually honest.
          *   Recommendation: Use the phrase but immediately pivot to the wage/condition question.

  5.  **Review and Refine (Self-Correction):**
      *   *Constraint Check:* Is it under 10 minutes reading time? (Approx 1500-2000 words). Yes.
      *   *Tone Check:* Is it analytical but accessible? Avoid overly dense econ jargon.
      *   *Specific Prompt Requirements:* Did I cover "won't," "jobs," "rest of us"? Yes. Did I cover the wage inference? Yes. Did I cover the chicken-and-egg? Yes. Did I analyze the three sources? Yes.
      *   *Refinement on "The Rest of Us":* Need to explicitly mention that "the rest of us" often excludes previous generations of immigrants who *did* do these jobs. It's a moving target.
      *   *Refinement on Wage Inference:* Be careful. If immigrants do jobs natives won't do *at current wages*, it implies immigrants and natives are not perfect substitutes. This *can* support the "no wage depression" argument (complementarity), but only if the labor markets are segmented. I need to make this distinction clear.

  6.  **Final Polish:** Organize with clear headings. Ensure the "Menu" is distinct. Make the verdict punchy. (Proceeding to generate output based on this structure).

  7.  **Final Word Count Check:** A 10-minute read is roughly 1,500 to 2,000 words at average reading speed. I will aim for concise but dense analysis to fit this.

  *(Self-Correction during drafting)*: I need to make sure I don't just say "it depends." I need to give the writer *tools* to write the nut graf. The verdict should be actionable.

  *(Refining the Wage Inference)*: The prompt asks: "Some people use the sentence to argue that immigration therefore can't be dragging native wages down — tell me which reading, if any, actually licenses that inference."
  *   *Logic:* If immigrants and natives are in different labor markets (segmentation), then immigrants don't compete with natives. This relies on Reading 1 (at current wages) + Reading 5 (jobs are distinct). I need to be precise here. It licenses the inference *only if* the labor markets are segmented. If natives *would* do the job at a slightly higher wage, then immigrants *are* competing and suppressing that rise.

  *(Refining the Chicken-and-Egg)*: This is about the *definition* of the job. Is "fruit picker" a fixed job description? Or is it "agricultural laborer" which could be mechanized? I'll label this the "Technological/Structural" reading.

  *(Refining the Sources)*:
  *   Operator: Wants to keep labor cheap. Needs "Won't" to mean "Refuse at *this* wage."
  *   Union: Wants to make jobs better. Needs "Won't" to mean "Rightfully refuse due to conditions."
  *   Economist: Wants precision. Needs "Won't" to mean "Reservation wage is higher."

