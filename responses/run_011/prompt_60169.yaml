answer: |-
  Here is a dissection of the sentence, broken down into the specific claims it hides, followed by an analysis of your three sources and a verdict on how to use it.

  ### The Menu of Readings

  The sentence *"Immigrants do the jobs the rest of us won't do"* sounds like a description of fact, but it is actually a theory of labor markets. Depending on how you load the words, it makes five distinct claims.

  #### 1. The Reservation Wage Claim (The Economist's Reading)
  *   **What it asserts:** Native workers have a higher "reservation wage" (the minimum pay they require to accept a job) than immigrants. At the *current* market wage, natives refuse the work. If the wage were raised, natives would do it.
  *   **Type of claim:** Willingness, conditioned on price.
  *   **Truth Value:** Substantively true, but trivial without a number. It is almost tautologically true that if you pay people more, more people will work.
  *   **How to settle it:** You need wage elasticity data. Look at sectors with high immigrant density. If you artificially raise wages (e.g., via minimum wage hikes or labor shortages), do native participation rates rise? (Evidence suggests they rise slightly, but often employers automate instead).
  *   **The Load:** Heavy lift on **"won't."** It implies a financial calculation, not a moral or physical one.

  #### 2. The Working Conditions Claim (The Union Reading)
  *   **What it asserts:** The jobs are objectively undesirable due to non-monetary factors: danger, degradation, physical toll, or lack of dignity. No amount of money (within reason) makes the job acceptable to natives because the *nature* of the work is the barrier.
  *   **Type of claim:** Willingness, conditioned on safety and dignity.
  *   **Truth Value:** Substantively true for specific sectors (e.g., meatpacking, roofing, elder care). False for others (e.g., agriculture has become mechanized where wages rose).
  *   **How to settle it:** Look at injury rates, turnover rates, and OSHA violations in immigrant-dense industries compared to native-dense industries with similar pay.
  *   **The Load:** Heavy lift on **"the jobs."** It defines the job by its hazards, not its output.

  #### 3. The Social Status Claim (The Cultural Reading)
  *   **What it asserts:** Natives avoid these jobs because they signal low social status. "The rest of us" defines itself by *not* doing manual or servile labor. This is about identity, not just economics.
  *   **Type of claim:** Willingness, conditioned on prestige.
  *   **Truth Value:** Probably true, but hard to separate from the Wage Claim. A native might take a garbage collection job (low status) if paid $100k, but not for $15k.
  *   **How to settle it:** Sociological surveys on job prestige vs. actual fill rates. Also, historical analysis: jobs often gain status when immigrants stop doing them and natives start (e.g., firefighting, policing).
  *   **The Load:** Heavy lift on **"the rest of us."** It defines the native population by their social boundaries.

  #### 4. The Legal/Permission Claim (The Enforcement Reading)
  *   **What it asserts:** Natives *could* do the jobs, but legal frameworks or employer preferences exclude them. Employers may prefer undocumented workers because they are less likely to report abuse or demand rights. Alternatively, the jobs exist in a cash economy natives avoid for tax reasons.
  *   **Type of claim:** Ability/Permission.
  *   **Truth Value:** Substantively true in sectors with high undocumented populations.
  *   **How to settle it:** Compare hiring practices in E-verify states vs. non-E-verify states. Look at the ratio of undocumented workers to total workforce in specific industries.
  *   **The Load:** Heavy lift on **"won't"** (which actually means "can't" or "aren't hired to").

  #### 5. The Endogenous Job Claim (The Chicken-and-Egg Reading)
  *   **What it asserts:** "The jobs" are not fixed entities. They are designed *around* the availability of immigrant labor. If immigrants weren't available, the job wouldn't exist in its current form; it would either be automated, offshored, or restructured to require higher skills. The job is "immigrant work" by design.
  *   **Type of claim:** Structural definition.
  *   **Truth Value:** Substantively true in agriculture and construction. False in care work (you can't automate a bedside manner easily).
  *   **How to settle it:** Look at capital investment per worker in high-immigration vs. low-immigration industries. Do industries with cheap labor invest less in productivity-enhancing technology?
  *   **The Load:** Heavy lift on **"the jobs."** It suggests the job description is fluid.

  ---

  ### The Wage Inference

  You asked which reading licenses the argument that *immigration isn't dragging native wages down.*

  **Only Reading 1 (Reservation Wage) combined with Reading 5 (Endogenous Job) allows this inference, and even then, only weakly.**

  Here is the logic: If immigrants and natives are not competing for the same jobs (because natives refuse them at any reasonable wage), then the labor markets are "segmented." If the markets are segmented, adding immigrants doesn't increase the supply of labor *for natives*, so native wages don't fall.

  **However, this is fragile.**
  If Reading 1 is true (natives would do it for more money), then immigrants *are* dragging wages down, or at least preventing them from rising to the level that would attract natives. The presence of immigrants allows the employer to pay $15 instead of $25. The wage *is* being suppressed relative to the clearing price for natives.

  **Verdict:** The sentence is often used to claim immigrants are "complements" (they help natives) rather than "substitutes" (they compete with natives). This is only true if the jobs are truly impossible to fill with natives *at any market-clearing wage*. If the wage just needs to go up, they are substitutes, and the inference fails.

  ---

  ### The Chicken-and-Egg Problem

  You articulated a worry about whether a job is unwanted because it's badly paid, or badly paid because it's unwanted. This is **Reading 5 (The Endogenous Job Claim)**.

  This is a separate reading because it challenges the existence of the noun phrase "the jobs."
  *   **Fixed View:** There is a pile of work called "fruit picking." It pays poorly. Natives won't do it. Immigrants do.
  *   **Endogenous View:** There is a goal called "harvest fruit." Currently, we do it by hand for low pay because immigrants are available. If immigrants vanish, we don't pay natives to pick by hand; we buy machines. Therefore, the job of "hand-picker" disappears.

  If you accept the Endogenous View, the sentence "Immigrants do the jobs the rest of us won't do" is misleading. It should be: "Immigrants do the jobs that *capital* won't restructure."

  This changes "the jobs" from a static necessity to a dynamic choice made by employers based on labor availability.

  ---

  ### Analyzing Your Three Sources

  Here is what each of your interviewees needs the sentence to mean for their argument to survive, and whether they can coexist.

  #### 1. The Nursing-Home Operator
  *   **Needs:** **Reading 1 (Reservation Wage).**
  *   **Argument:** "I would love to hire natives, but they demand $25/hour. I can only charge $20/hour for care. Immigrants work for $18. Therefore, without them, the home closes."
  *   **Compatibility:** Incompatible with the Union. The Operator wants the wage to stay low; the Union wants the conditions to change. The Operator treats the job as fixed (Reading 5 is bad for them because it implies they should automate or restructure).

  #### 2. The Union Organizer
  *   **Needs:** **Reading 2 (Working Conditions) + Reading 5 (Endogenous).**
  *   **Argument:** "The job is terrible. That's why natives won't do it. If we unionize, raise the wage, and fix the safety issues, natives *will* do it. The fact that immigrants do it now proves the exploitation, not the necessity."
  *   **Compatibility:** Incompatible with the Operator. The Organizer believes the job *can* change (Reading 5). The Operator believes the job *must* stay as is.

  #### 3. The Economist
  *   **Needs:** **Reading 1 (Reservation Wage) + Precision.**
  *   **Argument:** "The sentence is meaningless without a price. Natives won't do it *at $15*. They might at $30. Until you name the wage, you aren't describing labor supply; you're describing a political preference."
  *   **Compatibility:** The Economist is the referee. They agree with the Operator on the mechanism (price) but agree with the Union on the implication (the market hasn't cleared).

  **Are they compatible?**
  No. The Operator uses the sentence to justify the status quo. The Union uses it to indict the status quo. The Economist uses it to demand data. They are using the same words to argue about three different things: viability, morality, and mechanics.

  ---

  ### The Verdict: Can You Print It?

  You asked if there is any version of the sentence you can print without it being either empty or false.

  **Yes, but you have to puncture it immediately.**

  If you print the sentence as a standalone fact in your nut graf, you inherit the Operator's bias (that the jobs are fixed and the wages are natural). If you print it as a quote, you inherit the ambiguity.

  **The Strategy:**
  Use the sentence as the *object* of your investigation, not the *premise*.

  **Drafting suggestion:**
  > "Immigrants do the jobs the rest of us won't do." It is the most common sentence in the immigration debate, repeated by employers, advocates, and policymakers alike. But it is a sentence that changes meaning depending on who speaks it. To the employer, it is a statement of market constraints: natives are too expensive. To the union, it is an indictment of conditions: the jobs are too broken. To the economist, it is a half-truth that requires a price tag to become whole. The question isn't whether the sentence is true. It's which version of "won't" we are paying for.

  **Why this works:**
  1.  **Acknowledges ubiquity:** Validates your reporting process.
  2.  **Signals nuance:** Tells the reader you aren't buying one side.
  3.  **Sets up the "Menu":** You can then spend the column exploring the Wage vs. Conditions vs. Structure angles.
  4.  **Avoids the Trap:** It doesn't commit you to the idea that natives *physically can't* do the work, nor does it commit you to the idea that wages *must* rise. It commits you to investigating the *definition* of the work.

  **Final advice on "The Rest of Us":**
  Be careful with this phrase. "The rest of us" implies a static native population. Historically, "the rest of us" (previous generations of immigrants) *did* do these jobs. The sentence often erases the ladder of assimilation. If you want a sharper nut graf, consider adding that the "rest of us" is a moving target. Today's immigrant is often tomorrow's "us" who won't do the job.

  **Summary for your notes:**
  *   **Won't:** Usually means "at this price" (Economist/Operator) or "under these conditions" (Union).
  *   **The Jobs:** Are they fixed tasks (Operator) or flexible structures (Union/Economist)?
  *   **The Rest of Us:** A temporary category. Previous immigrants did these jobs; current natives won't.
  *   **Wage Inference:** Only holds if labor markets are totally segmented (rare). Usually, immigrants suppress the wage rise needed to attract natives.
  *   **Printable?** Only if framed as a claim to be tested, not a fact to be cited.
