answer: |-
  **TO:** Animal Welfare and Ethics Review Committee
  **FROM:** [Your Name], Student Member
  **DATE:** [Current Date]
  **SUBJECT:** Proposed Decision Procedure for Invertebrate Scope Determination

  **Purpose:** To standardize how we assess whether non-vertebrate/cephalopod species fall within our remit. This procedure replaces ad-hoc discussion with a stepped checklist. It is designed to be completed within the first 15 minutes of a protocol review, leaving 20 minutes for harm-benefit analysis.

  ### PART 1: THE PROCEDURE

  **Instructions:** The Committee Chair reads the questions in order. The Applicant provides evidence. The Committee marks "Established," "Not Established," or "Uncertain."

  **Step 1: Hardware Capacity (The "Can It?" Check)**
  *   **Question:** Does the animal possess a nervous system capable of integrating sensory input and coordinating a whole-organism response?
  *   **Sufficient Answer:** Peer-reviewed evidence of a centralised nervous system or ganglia structure known to process nociceptive (damage-sensing) input.
  *   **Superficial Answer:** "It has neurons" (too broad; gut neurons don't count) or "It reacts to touch" (reflexes don't count).
  *   **Veto Power:** **Veterinarian.** If the Vet confirms the hardware is physiologically incapable of integration (e.g., sponge, jellyfish), the procedure terminates here. Status: **Outside Scope.**

  **Step 2: Behavioral Cluster (The "Pattern" Check)**
  *   **Question:** Does the animal exhibit at least *three* of the following five indicators in the proposed experimental context?
      1.  **Learning:** Avoidance persists after the stimulus stops.
      2.  **Trade-off:** The animal accepts a cost (e.g., losing food/shelter) to avoid the stimulus.
      3.  **Analgesia:** The animal uses or responds to pain-relief substances differently when injured vs. uninjured.
      4.  **Protection:** Grooming or guarding the injured site.
      5.  **Grading:** Response intensity changes with stimulus intensity (not all-or-nothing).
  *   **Sufficient Answer:** Data showing a *combination* of these. (e.g., Learning + Trade-off).
  *   **Superficial Answer:** Citing only one indicator (e.g., "It withdraws when shocked"). Single indicators can be mimicked by simple reflexes or algorithms.
  *   **[ETHICAL JUDGMENT]:** We treat the *cluster* as a proxy for welfare status. This is not proof of feeling, but a risk-management threshold.

  **Step 3: Suppression vs. Absence (The "Anesthesia" Check)**
  *   **Question:** If the animal will be anesthetized or paralyzed during the procedure, is there evidence that the capacity identified in Steps 1 & 2 exists *before* induction or returns *after* recovery?
  *   **Sufficient Answer:** Pre-induction baseline testing OR post-procedure recovery monitoring showing return of Step 2 behaviors.
  *   **Superficial Answer:** "We cannot measure behavior during paralysis, so we assume nothing is happening." (This confuses *output* with *capacity*).
  *   **Requirement:** If the animal is killed while paralyzed without recovery, the Status from Step 2 stands. You cannot erase capacity by muting expression.

  **Step 4: Uncertainty Default**
  *   **Termination Point:** If Steps 1–3 yield "Not Established" or "Uncertain."
  *   **Default Ruling:** **Precautionary Principle.** If there is credible scientific disagreement or data gaps, the animal is treated as **Inside Scope.**
  *   **[ETHICAL JUDGMENT]:** The burden of proof lies on the researcher to show the animal is *not* capable, not on the Committee to prove it *is*.

  **Step 5: Final Designation**
  *   **Inside Scope:** Full harm-benefit analysis required. Analgesia mandatory unless scientifically justified.
  *   **Outside Scope:** Minimal welfare checks only.
  *   **Signature Requirement:** A designation of **Outside Scope** requires the **Veterinarian's signature** plus a majority vote. A designation of **Inside Scope** requires only a majority vote. (It is harder to exclude an animal than to include it).

  ---

  ### PART 2: WHAT SURVIVES AND WHAT MISFIRES

  **Distinctions Retained:**
  1.  **Hardware vs. Function:** We keep Step 1 to rule out organisms lacking the physical substrate, preventing the "thermostat" worry.
  2.  **Cluster vs. Single Trait:** We keep Step 2 to prevent "gerrymandering." A single behavior is a trick; a cluster is a profile.
  3.  **Capacity vs. Expression:** We keep Step 3. This is the critical fix for the anesthesia loophole.

  **Distinctions Dropped:**
  1.  **Phenomenology vs. Function:** We do not ask "Does it feel?" We ask "Does it function like something that feels?" This is a pragmatic simplification.
  2.  **State vs. Disposition (Nuance):** We collapse these into Step 3. We do not need to philosophically distinguish a blocked state from a latent disposition; we simply require evidence that the system exists regardless of current output.

  **Where It Will Misfire:**
  1.  **False Positives:** A sophisticated robot or a very complex reflex arc could theoretically pass Step 2. We accept this risk to avoid False Negatives (suffering animals).
  2.  **The "Black Box" Problem:** During anesthesia (Step 3), we are inferring internal state from external history. If the anesthesia itself ablates the experience (not just the movement), we may be protecting a "shell." We cannot solve this empirically; we default to caution.

  ---

  ### PART 3: APPLICATION TO LIVE PROTOCOLS

  **Protocol 1: Shore Crabs (Shelter Avoidance)**
  *   **Step 1 (Hardware):** Crab nervous system established. **Pass.**
  *   **Step 2 (Cluster):**
      *   Learning? Yes (persistent avoidance).
      *   Trade-off? Yes (abandoning preferred dark shelter).
      *   Grading? Yes (implied by "small shocks" vs control).
      *   *Result:* 3 indicators. **Pass.**
  *   **Step 3 (Suppression):** N/A (Awake).
  *   **Finding:** **Inside Scope.** The combination of learning and motivational trade-off exceeds reflex.

  **Protocol 2: Honeybees (Odor Discrimination & Agitation)**
  *   **Step 1 (Hardware):** Insect CNS. **Pass.**
  *   **Step 2 (Cluster):**
      *   Learning? Yes (odor discrimination).
      *   Trade-off? **No** (No cost paid to avoid).
      *   Analgesia? **No.**
      *   Protection? **No.**
      *   Grading? Maybe (response to blends).
      *   *Result:* Only 1-2 indicators. The "shifted response to ambiguity" is a single metric. It risks being a foraging heuristic (optimizing search) rather than affective state.
  *   **Step 3 (Suppression):** N/A.
  *   **Finding:** **Inside Scope (by Default).** Step 2 is "Uncertain." The objection regarding anthropomorphism is valid scientifically, but under Step 4 (Uncertainty Default), we must err on the side of caution.
  *   **Condition:** Approval contingent on adding a trade-off measure (e.g., will they fly through a wind barrier to avoid the odor?) to confirm Step 2 in future iterations.

  **Protocol 3: Anesthetized/Paralyzed Preparation (The Loophole)**
  *   **Applicant Claim:** No behavior is measurable intraoperatively; therefore, no criteria are met; therefore, no burden applies.
  *   **Procedure Ruling:** **Rejected.**
  *   **Reasoning:** This fails Step 3. The procedure distinguishes between *absence of capacity* and *suppression of output*.
  *   **Required Evidence:**
      1.  **Pre-Induction:** Evidence that this species/strain meets Step 2 criteria when awake (literature or pilot data).
      2.  **Physiological Proxies:** During the block, we require monitoring of physiological stress markers (e.g., hemolymph lactate, stress hormone analogues, or neural firing patterns in nociceptive pathways) that correlate with the capacity identified in Step 1.
      3.  **Recovery:** If the animal survives, Step 2 behaviors must be tested post-recovery. If the animal is terminated, the Pre-Induction status holds.
  *   **Finding:** **Inside Scope.** The functional capacity exists even if the behavioral output is chemically muted. To rule otherwise is to grant moral status based on the convenience of the experimenter.

  ---

  ### PART 4: CLOSING STATEMENT FOR THE CHAIR

  *(To be read aloud before the vote on any protocol designated "Inside Scope")*

  "Committee members, before we vote, I need to state a limitation of this procedure. We have just determined that this animal fits the *functional profile* of an entity that can be harmed. We have checked for hardware, behavioral clusters, and latent capacity.

  However, we must be clear: **Establishing a functional role is not the same as establishing that anything is experienced.**

  There is a philosophical objection which holds that an animal could tick every box on our list—learning, trading off, protecting itself—and still not 'feel' anything in the way we understand suffering. It could be a 'philosophical zombie.' On this view, our entire exercise is beside the point, because we would be licensing harm on the basis of evidence that is in principle silent about the only thing that matters: the inner experience.

  We cannot verify experience. We cannot solve this today. But we must acknowledge it. We are not voting that we *know* this animal suffers. We are voting that the risk of it suffering is high enough that we are not willing to proceed without justification. We are acting on the precautionary principle, not on certainty.

  If you are comfortable proceeding on that basis, please vote."
