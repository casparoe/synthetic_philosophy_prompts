answer: |-
  ### I. A Menu of Claims

  The sentence "absence of evidence is not evidence of absence" (AENEOA) is not a single proposition but a schema. Its truth value depends entirely on how one disambiguates "absence of evidence" (the antecedent) and "evidence of absence" (the consequent). Below are the distinct pairings worth taking seriously.

  **1. The Trivial Reading**
  *   **Antecedent:** Evidence has never been sought.
  *   **Consequent:** Proof of non-existence.
  *   **Verdict:** **Platitudinous.** If no search has been conducted, no logical proof of absence can be generated. This is true but useless for settling arguments where excavation has occurred.

  **2. The Preservationist Reading**
  *   **Antecedent:** Evidence was sought, but the phenomenon leaves no durable trace, or the trace did not survive taphonomic processes (rot, ploughing, acid soil).
  *   **Consequent:** Strong probabilistic support for non-existence.
  *   **Verdict:** **Substantive and True.** If $P(\text{Trace}|\text{Present})$ is near zero due to preservation bias, finding no trace updates our credence in the hypothesis negligibly. This is the standard archaeological defense against negative inference.

  **3. The Sampling Reading**
  *   **Antecedent:** Evidence was sought, but the sampling fraction is too low relative to the expected distribution of the trace.
  *   **Consequent:** Any shift in credence regarding non-existence.
  *   **Verdict:** **Indeterminate pending an empirical model.** Whether silence bears weight depends on the spatial distribution of the phenomenon. If the trace is ubiquitous, a small sample matters; if rare and clustered, it does not.

  **4. The Bayesian Reading (Strong Probabilistic)**
  *   **Antecedent:** A rigorous search was conducted in a context where traces should survive and be found.
  *   **Consequent:** A rational shift in credence (not proof, but support) for non-existence.
  *   **Verdict:** **Substantive and True.** Silence *is* evidence, provided the search had sensitivity. To claim otherwise is to violate Bayes' Theorem.

  **5. The Dogmatic Reading**
  *   **Antecedent:** A rigorous search was conducted in a high-sensitivity context.
  *   **Consequent:** No shift in credence whatsoever.
  *   **Verdict:** **Substantive and False.** This asserts that $P(H|\text{Silence}) = P(H)$. This is only true if the search provides no information, which contradicts the premise of a rigorous search in a high-sensitivity context.

  #### Conditions for the Strong Probabilistic Reading
  For a failed search to leave a hypothesis exactly where it was (i.e., for silence to carry *no* weight), the following condition must hold:
  $$P(\text{Silence} | \text{Hypothesis is True}) = P(\text{Silence} | \text{Hypothesis is False})$$
  In archaeological terms, the probability of finding nothing must be the same whether the phenomenon existed or not. This occurs only if the **Recovery Probability** is zero.

  The weight of silence is governed by the product of three parameters:
  1.  **Formation Probability:** How likely is the practice to leave a material footprint? (e.g., stone tools vs. wooden tools).
  2.  **Survival Probability:** How likely is that footprint to survive abandonment, reuse, and taphonomy? (e.g., vitrified clay vs. organic textile).
  3.  **Recovery Probability:** How much of the relevant deposit has been sampled, and did the recovery techniques (e.g., flotation, sieving) match the trace size?

  If the product of these three is high, silence is heavy evidence. If low, silence is light evidence.

  ***

  ### II. Responses to Your Four Questions

  #### 1. The Colleague's Blocking Move and the 4% Figure
  The reading that licenses your colleague's blocking move is the **Preservationist/Sampling Reading** (Menu Items 2 & 3). He is arguing that the Recovery Probability is too low to warrant a shift in credence.

  However, the raw figure of "four percent" is **irrelevant** without weighting for distribution. Administrative apparatus in early states is rarely distributed uniformly; it concentrates in specific loci (palaces, temples, storage complexes). If your 4% excavation sampled domestic housing but missed the putative administrative quarter, your effective coverage of the *signal* is 0%. Conversely, if administration were bureaucratic and decentralized (e.g., every house has a seal), 4% random sampling would be highly significant. Your colleague is correct that 4% does not settle the matter, but only if the traces of authority are expected to be spatially clustered. He must specify *where* the 4% was dug relative to the expected locus of power.

  #### 2. Consistency of the Two Moves and the "Shifting Priors" Suspicion
  Is there a single reading on which both moves are legitimate? **Yes, but only conditionally.**
  Both moves are legitimate *if and only if* the Recovery Probability for administrative sealings is comparable to the Recovery Probability for metalworking debris. If metalworking debris (slag, crucibles) is more durable and more widely scattered than clay sealings, then silence regarding metalworking should count *more* heavily than silence regarding administration. If he treats them identically despite different taphonomic profiles, he is being methodologically inconsistent.

  However, your suspicion is **vindicated**. The maxim is functioning as a **shifter of priors**.
  *   In the first case (Administration), he likely holds a high prior for "complexity" or wishes to keep the option of centralized authority open despite the silence, so he invokes AENEOA to prevent the posterior probability from dropping.
  *   In the second case (Metalworking), he likely holds a high prior for "local production" (perhaps for economic self-sufficiency models), so he again invokes AENEOA to keep that posterior high.
  *   The inconsistency arises in his acceptance of your "kin-ordered" conclusion. He accepts the silence on *grave goods/house sizes* as diagnostic (positive evidence of equality) but rejects the silence on *seals* as diagnostic (negative evidence of hierarchy). This suggests he is not applying a uniform rule about silence, but rather evaluating which silences fit his preferred theoretical model. He is surrendering the inference from silence when it threatens a desired complexity, but accepting it when it supports a desired social typology. One of these must be surrendered: either silence on seals counts against hierarchy, or silence on debris counts against metalworking. He cannot claim silence is inert in both cases while simultaneously claiming the society is "kin-ordered" based on other material patterns.

  #### 3. The Detective, The Doctor, and The Archaeologist
  *   **The Detective (Silver Blaze):** The dog didn't bark. Here, silence is **decisive**. Why? Because $P(\text{Silence}|\text{Stranger})$ is near zero (dogs bark at strangers) and $P(\text{Silence}|\text{No Stranger})$ is near one. The sensitivity of the "test" (the dog) is known and high.
  *   **The Doctor (Underpowered Trials):** "Absence of evidence [of efficacy] is not evidence of absence [of efficacy]." Here, silence is **inconclusive**. Why? Because the sample size ($N$) is too small. The test has low statistical power. $P(\text{No Significant Result}|\text{Drug Works})$ is high simply because the trial was too weak to detect the effect.
  *   **The Archaeologist:** The archaeological record is **lossy**, making it more like the Medical case than the Detective case. Unlike the dog, the soil does not guarantee a "bark" (trace) even if the event occurred. Preservation bias acts like an underpowered trial.

  **Verdict:** The medical reading is the true kernel for archaeology. The record is inherently low-sensitivity. However, a stronger reading (closer to the Detective) becomes correct in **sealed contexts** or with **indestructible materials**. If you excavate a sealed kiln and find no vitrification, silence *is* evidence of absence (of high heat), because the "test" (clay physics) is high-sensitivity. Your colleague is treating all archaeology as low-sensitivity (Medical), whereas your argument relies on specific contexts where sensitivity should be higher.

  #### 4. A Replacement Maxim and The Student's Challenge
  **The Replacement Maxim:**
  > "Absence of evidence is evidence of absence only when the evidence was expected to survive and be found."

  Or, for the graduate student:
  > "Silence is decisive only when the signal-to-noise ratio of the record is known to be high."

  **Answering the Student (The Immunity Claim):**
  The student claims archaeology can never subtract from the inventory of the past. To correct him, present a case where the **Formation Probability** and **Survival Probability** are effectively 1.0.

  *   **The Case:** A sealed, anaerobic bog burial where organic preservation is perfect, or a vitrified fort where stone fusion is guaranteed at specific temperatures.
  *   **The Argument:** If we hypothesize that a body was buried with a wooden spear in a perfect preservation bog, and we recover the body with no spear and no decomposition trace of a spear (e.g., no soil stain, no associated iron ferrule), we are warranted in concluding there was no spear.
  *   **The Distinction:** What distinguishes this from your lowland settlement case is the **taphonomic certainty**. In your settlement, clay sealings *could* have disintegrated, been recycled, or lie in the unexcavated 96%. In the sealed context, the absence of the trace is physically incompatible with the presence of the object. Silence is decisive when the medium guarantees the record.
