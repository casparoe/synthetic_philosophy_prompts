  **2. Felix:** *Then your principle gives opposite prescriptions in structurally identical situations.*
  **Rating: 3/5 (Partially Mistaken)**
  **Justification:** Felix is right that the *surface* features (predictor, correlation, no causal leverage) look identical, but he is mistaken that the *structural* logic is identical. Case A is a "Counterfactual Mugging" where the act determines the reward in the other branch; Case B is "XOR Blackmail" where the act determines *observation* of the letter but not the physical state of the house. The differing verdicts stem from these structural differences, not an inconsistency in Hana's principle.

  **3. Hana:** *They are not identical. In Case A the payoff... was keyed to your very act... In Case B the contamination was produced by ordinary causes before you opened the envelope.*
  **Rating: 4/5 (Mostly Right)**
  **Justification:** Hana correctly points to the causal/logical direction. In Case A, the Tails reward is *logically dependent* on the Heads disposition. In Case B, the contamination is physically independent of the decision; the correlation is enforced by the mailing rule, not by the decision influencing the past. This distinction is crucial for why the expected value calculations diverge.

  **4. Felix:** *What makes Case B safe to refuse is not that your act cannot reach the contamination — it is that the money buys nothing... Your verdict is tracking a contingent detail about whether the wire has any use.*
  **Rating: 5/5 (Clearly Right)**
  **Justification:** This is Felix's strongest move. He correctly identifies that the core reason to refuse in Case B is that the payment yields no *ex-ante* expected benefit (it costs money in safe worlds and saves nothing in contaminated worlds). He successfully strips away the "news vs. causation" jargon to reveal the underlying utility calculus: if the money bought remediation, the calculation would change. He forces Hana to admit the verdict depends on the payoff structure, not just the epistemic status of the information.

  **5. Hana:** *Fine — but that detail vindicates me rather than you... A refuser never spends and loses the house exactly in the worlds where the house was already lost.*
  **Rating: 5/5 (Clearly Right)**
  **Justification:** Hana successfully defends her consistency. She demonstrates that even under Felix's "usefulness" criterion, her verdict holds. In Case B, the policy "Pay" strictly dominates "Refuse" in terms of cost (you pay $1k in safe worlds, and still lose the house in contaminated worlds because you don't get the letter to pay). She shows that her framework (ex-ante policy optimization) yields "Refuse" for B and "Pay" for A because the expected value math differs, not because she switched theories.

  **6. Felix:** *You dropped the news/causation vocabulary entirely and ran a dominance comparison over algorithms. That is a causal-style calculation. Now run it on Case A... Case A only comes out the way you want because you are counting a payment that no one ever receives.*
  **Rating: 2/5 (Mostly Mistaken)**
  **Justification:** Felix misidentifies Hana's framework. Comparing algorithms ex-ante is not "causal-style" (CDT); it is *updateless* (UDT). CDT would reject counting the counterfactual branch in Case A. Felix is correct that UDT requires counting counterfactual branches, but he is wrong to claim this is a concession to causal reasoning. It is the definition of the framework Hana has used from Move 1. He mistakes consistency for abandonment.

  **7. Hana:** *They count, because before the coin flip you were the person who stood on both sides of that bet, and it is that earlier situation your present choice settles.*
  **Rating: 4/5 (Mostly Right)**
  **Justification:** This is the standard and robust justification for Updateless Decision Theory. It grounds the rationality of paying in Case A on the agent's identity over time. While it relies on a specific metaphysical view of agency (that the "ex-ante self" governs the "ex-post self"), it is internally coherent and directly answers why the counterfactual branch counts.

  **8. Felix:** *If your answer is "me, viewed from behind the coin flip," you have not discovered anything about rationality — you have stipulated which of your temporal stages gets to speak for you.*
  **Rating: 4/5 (Mostly Right)**
  **Justification:** Felix raises a potent meta-ethical objection. He correctly notes that UDT requires a normative stipulation about which temporal stage defines the agent's interests. There is no empirical fact that *forces* the ex-ante self to rule the ex-post self; it is a choice of decision theory. This highlights that the debate is ultimately about which normative stipulation is more rational, not just about calculation.

  **9. Hana:** *The same objection lands on you. "Me, the one actually holding the letter" is also a stipulation about which stage speaks.*
  **Rating: 5/5 (Clearly Right)**
  **Justification:** Hana delivers a decisive symmetry argument. Felix's preferred view (CDT/EDT) privileges the *current* informational state ("Me now"). Hana points out that this is equally a "stipulation" as privileging the *prior* state ("Me then"). If Felix claims the "now" is the natural agent, he must justify why the "then" is not. This neutralizes the force of Move 8 by showing the objection is universal to all decision theories that persist over time.

  ***

  ### (ii) Assessment of Move 4 and Move 5

  **Does Felix's fourth move succeed?**
  **Yes.** Felix successfully pierces the "news vs. causation" rhetoric. He demonstrates that the reason Hana refuses payment in Case B is not merely because the information is "news" (which she might otherwise value), but because the payment is *instrumentally useless* in an ex-ante expected value calculation. He forces the debate onto the terrain of policy utility rather than epistemic status.

  **Is Hana's fifth move an answer or a concession?**
  **It is an answer, not a concession.** Hana does not abandon her framework; she clarifies it. Felix implies that if she admits the verdict turns on "usefulness," she is admitting causation matters (which would force her to refuse in Case A). Hana shows that "usefulness" is determined by the *policy-level expected value*, which includes counterfactual branches. In Case A, the payment is "useful" ex-ante (buys the Tails reward). In Case B, the payment is "useless" ex-ante (costs money, saves nothing). She accepts Felix's premise (look at usefulness) but shows her theory satisfies it better than his.

  ***

  ### (iii) Assessment of Move 6 (Framework Abandonment)

  **Does Felix correctly identify Hana's fifth as abandoning her own framework?**
  **No.** Felix claims that running a "dominance comparison over algorithms" is a "causal-style calculation." This is a category error. Causal Decision Theory (CDT) evaluates *acts* given the current state. Updateless Decision Theory (UDT) evaluates *policies* given the prior state. Both use dominance/utility comparisons, but over different domains (acts vs. policies) and different probability spaces (conditional on current info vs. unconditional).

  **Can policy-level comparison and an evidential/causal distinction coexist?**
  **Yes, but Hana isn't using the evidential/causal distinction in the way Felix thinks.** Hana is using a *logical* distinction. In her framework (UDT), "causation" is replaced by "logical dependency." In Case A, the act is logically dependent on the Tails reward. In Case B, the act is logically dependent on receiving the letter, but not on the house's safety. Her policy comparison incorporates these logical dependencies. Felix is mistaken to think that using expected value calculations implies a return to CDT; UDT is fundamentally an expected value maximizer, just over policies rather than acts.

  ***

  ### (iv) Adjudication of Moves 8 and 9 (Temporal Stipulation)

  **Do they cancel, or does one have force?**
  **Hana's Move 9 neutralizes Felix's Move 8; they do not merely cancel.**
  Felix's Move 8 argues that choosing the "ex-ante" perspective is an arbitrary stipulation. This is a strong objection if one assumes the "ex-post" perspective is the default/natural one. However, Hana's Move 9 correctly identifies that the "ex-post" perspective is *also* a stipulation. There is no metaphysical law that says "The agent is defined by their current knowledge."
  **Winner:** Hana. By showing that *any* diachronic decision theory requires a rule for which temporal stage sets the goal, she removes the special burden of proof Felix tried to place on her. The debate then shifts to *which* stipulation yields better outcomes (which returns to Moves 1-5), rather than which is more "natural." Felix's objection applies to everyone, so it adjudicates nothing.

  ***

  ### (v) Substantive Omissions and Case Coherence

  **1. Family Resemblance: Are Case A and Case B in the same family?**
  **They are cousins, not twins.** Both omit causal leverage, but they differ in **Observation Selection**.
  *   **Case A (Counterfactual Mugging):** You observe the request *regardless* of the coin outcome (in the Heads branch). The correlation is between your disposition and the Tails reward.
  *   **Case B (XOR Blackmail):** You observe the letter *only if* the XOR condition is met. This introduces an observation selection effect. In Case B, receiving the letter is evidence of the state of the world *conditional on your policy*.
  *   **Omission:** Neither party explicitly discusses **Observation Selection Effects**. Hana treats them both as policy optimization problems (which is correct for UDT), but Felix's confusion stems partly from not seeing that Case B involves a filter on which worlds you get to make a decision in, whereas Case A does not.

  **2. Coherence of the Predictor in Case B:**
  **This is a critical omission.** Case B describes a predictor whose mailing rule depends on *(Contamination XOR You Will Pay)*.
  *   If the house is Contaminated (True), the letter is sent only if You Will Pay (False).
  *   If the house is Safe (False), the letter is sent only if You Will Pay (True).
  *   **The Loop:** Whether you receive the letter depends on what you decide. But what you decide may depend on whether you receive the letter.
  *   **Missing:** For this case to be coherent, the predictor must be solving for a **Fixed Point** (a la Logical Decision Theory). The predictor predicts what you will do *conditional on receiving the letter*. If there are multiple fixed points (e.g., a world where you Pay and get the letter, and a world where you Refuse and don't), the case is ill-defined. Both Hana and Felix assume a unique solution exists. If the predictor is "near-perfect" but not logically omnipotent, Case B might be impossible to construct consistently. Hana's analysis assumes the predictor successfully enforces the correlation; Felix assumes the physical facts are settled. They leave out the **logical consistency conditions** required for the predictor to exist at all.

  **3. The Nature of "Leverage":**
  Both parties discuss "causation," but in Newcomblike problems, the relevant concept is **Logical Leverage**.
  *   In Case A, your decision has logical leverage over the Tails reward (via the prediction).
  *   In Case B, your decision has logical leverage over *whether you observe the letter*, but not over the contamination.
  *   **Omission:** Neither explicitly distinguishes between leverage over *outcomes* (Case A) and leverage over *observations* (Case B). This distinction explains why the expected value calculations diverge without needing to appeal to "causation" in the physical sense. Hana hints at it in Move 5, but making it explicit would have resolved Felix's confusion in Move 2 much earlier.
