  Format it in these sections, in this order:

  1. Sanity check (~120 words) — my position and his, stated back to me so I know you got them, plus anything you had to guess at.
  2. The translation (~650 words) — the argument rebuilt in my terms, section by section, no philosophy jargon sneaking in.
  3. Where it bent (~300 words) — a small table: his claim, my term for it, what it cost. Then a paragraph on the worst two distortions.
