answer: |-
  **Move Ratings**

  1.  **Marcus (4):** Strong moral framing that defines the subsidy as a right rather than a transaction, setting high stakes immediately.
  2.  **Dana (4):** Effectively counters with a competing dignity claim (paternalism) and introduces the pragmatic necessity of political solidarity.
  3.  **Marcus (4):** Successfully exposes an inconsistency in Dana's "work" argument by highlighting non-market exemptions on the approved list.
  4.  **Dana (3):** Plausible technocratic fix, but underestimates the inherent stigma of certification; doesn't fully beat Marcus's stigma argument.
  5.  **Marcus (4):** Deepens the critique by identifying bureaucratic judgment as the mechanism of humiliation, not just a bug.
  6.  **Dana (3):** Strong logical challenge regarding ubiquity of judgment, but creates a false equivalence by ignoring the consequences of failure.
  7.  **Marcus (5):** The decisive move; distinguishes conditionality based on the severity of the penalty (homelessness vs. fine), reclaiming the moral high ground.
  8.  **Dana (4):** Sharp tactical close that forces operationalization, but demands a quantitative answer to a qualitative objection.

  **Does Move 5 survive Move 6?**
  Move 5 alone does not survive Move 6. Dana correctly shows that bureaucratic judgment exists in many accepted civic obligations (taxes, schooling), weakening Marcus's claim that judgment *itself* is the unique villain. Move 5 only becomes defensible when coupled with Move 7. The humiliation isn't inherent to the judgment alone, but to the judgment *over survival needs*. Without Move 7's distinction on stakes, Move 6 proves too much.

  **Does Move 8 land as a challenge or dodge?**
  Move 8 lands as a challenge, but it relies on a category error. Marcus argued in Move 7 that the *nature* of the penalty (homelessness) is the wrong, not just the magnitude. By asking him to "name a number," Dana reframes the issue as a quantitative calibration of sanctions. Marcus cannot name a number without conceding that conditionality is acceptable if the penalty is small enough, which undermines his rights-based argument. It traps him, but doesn't refute him.

  **What are they missing?**
  Both ignore the empirical reality: does this requirement actually preserve funding, or does administrative cost eat the savings? They also miss that "approved activities" might displace unpaid labor essential to the community. Finally, they are not fighting about the same thing by the end. They began debating dignity (intrinsic worth vs. contribution) but ended debating penalty thresholds. This shift is illegitimate because Marcus's core claim is that housing security is a precondition for dignity, not a variable to be calibrated. Dana treats dignity as a balance sheet; Marcus treats it as a floor.

  Verdict: MARCUS — Move 7 establishes a qualitative coercion numbers cannot fix.
