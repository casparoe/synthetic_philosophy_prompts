answer: |-
  (a) **The Principle of Operational Invariance**

  An analogy is warranted if and only if the causal mechanism linking the antecedent to the outcome in the source case is *operationally invariant* in the target case. "Operationally invariant" is defined by four clauses. A failure on any clause renders the analogy unwarranted.

  **Clause 1: Mechanism Identity.** The specific causal chain (A → B → C) that produced the outcome in the source must be replicable in the target using the target's actual components, not just metaphorical labels.
  *   *Motivated by:* **Case 1 (Munich/Vietnam)** and **Case 3 (Vietnam/Iraq)**.
  *   *Work done:* Case 1 fails because "expansionist appetite" (Source) does not map to "civil conflict" (Target). Case 3 passes because "open-ended occupation without exit criteria" (Source) maps directly to "open-ended occupation without exit criteria" (Target), despite surface differences. This clause privileges causal structure over descriptive similarity.

  **Clause 2: Constraint Compatibility.** Any negative constraint present in the target that was absent in the source, and which is sufficient to block the causal chain, renders the analogy unwarranted.
  *   *Motivated by:* **Case 4 (1914/US-China)** and **Case 5 (1914/Ind-Pak)**.
  *   *Work done:* This explains the split between Cases 4 and 5. Both share the source (1914). Case 5 passes because the target (Ind-Pak) shares the *drivers* (pre-delegation, compressed time). Case 4 fails because the target (US-China) possesses a *blocker* absent in the source (nuclear second-strike capability) that fundamentally alters the payoff structure of war. Descriptive similarity (naval rivalry) is overruled by the presence of a deal-breaking constraint.

  **Clause 3: Agency Capacity.** The actors in the target case must possess the institutional or physical capacity to fulfill the roles assigned to them by the analogy.
  *   *Motivated by:* **Case 6 (Printing Press/Internet)** and **Case 9 (Uni Debt/Sovereign Debt)**.
  *   *Work done:* This resolves the tension between 6 and 9. In Case 6, human agents in both cases have the capacity to react to low-cost information by bypassing gatekeepers. In Case 9, the University lacks the *capacity* of a Sovereign (currency issuance, electorate mandate). The arithmetic is similar, but the *agency* required to resolve the crisis via the source mechanism (inflation/monetization) is absent in the target. The analogy fails because the target actor cannot physically execute the source script.

  **Clause 4: Reflexive Independence.** The validity of the analogy must not depend on the actors' belief in the analogy, unless the analogy is explicitly deployed as a tool to alter that belief.
  *   *Motivated by:* **Case 8 (Domino Theory)** and **Case 10 (AI/Manhattan)**.
  *   *Work done:* This isolates the reflexivity problem. If an analogy is used as a *prediction*, it must hold even if actors ignore it. If it is used as a *policy justification*, it may be warranted even if predictive failure is likely, provided the goal is to shape behavior. This clause forces a distinction between analytical warrant and rhetorical warrant.

  ***

  (b) **Application to New Cases**

  **Case A: Semiconductor Export Controls (Target) vs. Interwar Embargoes on Japan (Source)**
  *   **Verdict:** **Unwarranted.**
  *   **Application:**
      *   *Mechanism Identity:* The source mechanism is "resource strangulation → desperate military aggression."
      *   *Constraint Compatibility:* This fails Clause 2. 1941 Japan was an island nation with zero domestic oil/steel and a finite window of opportunity. Contemporary China is a continent with massive domestic substitution capacity and a longer time horizon. The "strangulation" mechanism requires a chokepoint that does not exist in the target to the same degree.
      *   *Agency Capacity:* China possesses state-directed industrial capacity to absorb shocks that Imperial Japan lacked.
  *   **Principle Check:** The principle delivered this verdict without stretching. It identifies that the *causal sufficiency* of the embargo mechanism relies on constraints (island geography, lack of substitutes) present in the source but absent in the target.

  **Case B: 2008 Financial Crisis Response (Target) vs. 1930s Deflationary Spiral (Source)**
  *   **Verdict:** **Warranted (as a Negative Analogy).**
  *   **Application:**
      *   *Mechanism Identity:* The source mechanism is "liquidity crunch → fire sales → credit freeze → deflation." This mechanism was identified in the target.
      *   *Constraint Compatibility:* The policy response in 2008 intentionally removed the constraint that plagued the 1930s (ideological aversion to deficit spending/monetary expansion).
      *   *Reflexive Independence:* This passes Clause 4 only because the analogy was used *normatively* ("Do not repeat 1930s") rather than *predictively* ("1930s will happen again"). The actors believed the analogy and changed the outcome.
  *   **Principle Check:** The principle holds, but requires the user to specify that the analogy is warranted as a *guide to intervention*, not as a prediction of inevitability. If the user claimed the 2008 crisis *was* the 1930s, it would be unwarranted. Since the claim was "this is the 1930s mechanism, so we must act differently," it is warranted.

  ***

  (c) **The Sacrifice: Where the Pattern Gives**

  To maintain the sharpness of the Principle of Operational Invariance, you must surrender the nuance in **Case 8 (Domino Theory)**.

  You wrote: *"Unwarranted as description... But I am reluctant to file it simply as false, because belief in the cascade generated the policy that produced much of what in fact happened."*

  **The Principle demands:** You must file it as **Unwarranted**.
  **Reasoning:** Clause 4 (Reflexive Independence) distinguishes between an analogy that *tracks reality* and one that *manufactures reality*. The Domino Theory failed Clause 1 (Mechanism Identity): political ideology does not cascade like physical dominos; it requires human transmission. The fact that belief in the theory created the conditions for conflict (via intervention) makes it a *self-fulfilling prophecy*, not a warranted analogy. A warranted analogy must explain the world; a self-fulfilling prophecy changes it. Conflating the two destroys the analytical utility of your collection. If you keep Case 8 as "partially warranted," you admit that false causal models are acceptable if they are politically potent. For a principle of *judgment*, that is a fatal concession.

  **Secondary Sacrifice:** You must move **Case 10 (AI/Manhattan)** from "Indeterminate" to **"Unwarranted (Analytically) / Warranted (Rhetorically)."**
  **Reasoning:** Clause 1 fails. The Manhattan Project mechanism was "concentration → chokepoint → single device." AI development is "diffusion → dual-use → continuous capability." The mechanism is not invariant. However, under Clause 4, if the goal of the analogy is to *create* secrecy and export controls (making AI *more* like Manhattan), it is rhetorically warranted. You cannot keep it "Indeterminate." It is analytically false but performatively potent.

  ***

  (d) **The Reflexivity Problem**

  Reflexivity admits of principled treatment, but it requires splitting the concept of "Warrant" into two distinct categories: **Predictive Warrant** and **Constitutive Warrant**.

  **The Clause:** *An analogy possesses Predictive Warrant only if the causal mechanism operates independently of the actors' knowledge of the analogy. An analogy possesses Constitutive Warrant if the explicit adoption of the analogy by actors is part of the causal mechanism intended to produce a specific policy outcome.*

  **Application to Case 8 (Domino Theory):**
  *   *Predictive Warrant:* **None.** The mechanism (ideological contagion) did not exist independently of US intervention.
  *   *Constitutive Warrant:* **High.** The analogy was successfully used to mobilize resources and alliances.
  *   *Judgment:* As a tool of analysis, it was unwarranted. As a tool of statecraft, it was effective. Your principle must prioritize Predictive Warrant for historical judgment, or you risk validating propaganda.

  **Application to Case 10 (AI/Manhattan):**
  *   *Predictive Warrant:* **Low.** AI is not converging on a single device naturally.
  *   *Constitutive Warrant:* **High.** By invoking Manhattan, policymakers are *forcing* convergence through regulation, secrecy, and centralization.
  *   *Judgment:* The analogy is a policy instruction, not a description. Treating it as "Indeterminate" obscures this. It is a command disguised as a comparison.

  **Is it self-undermining?**
  No. It does not counsel against using constitutive analogies. It counsels against *believing* them to be predictive. You can use the Manhattan analogy to justify secrecy (Constitutive) without believing AI is inherently a single-device technology (Predictive). The principle protects you from being fooled by your own rhetoric.

  ***

  (e) **Generality and Modification**

  **Specific vs. General:**
  The principle is **general to analogical reasoning**, not specific to statecraft. Cases 6 (Printing Press) and 9 (University Debt) prove this. The logic of "Agency Capacity" (Clause 3) applies equally to a university budget, a corporate merger, or a sovereign debt crisis. The logic of "Constraint Compatibility" (Clause 2) applies to engineering, medicine, and history. Statecraft merely heightens the stakes of reflexivity (Clause 4).

  **Standard Account vs. Modification:**
  This is **not** the familiar account of analogical inference (relevant similarity) with a minor modification. The modification is carrying the whole weight.
  *   *Standard Account:* Focuses on the ratio of shared attributes to total attributes (e.g., "US and China are both great powers").
  *   *Your Principle:* Focuses on **Causal Capacity** and **Operational Invariance**.
  *   *The Shift:* Standard accounts would likely validate Case 4 (US/China 1914) because the descriptive match is high. Your principle rejects it because the *causal capacity* for war is blocked by nuclear constraints. Standard accounts would likely validate Case 9 (Debt) because the arithmetic is identical. Your principle rejects it because the *institutional capacity* differs.

  Therefore, the principle is a **Causal-Mechanistic Account** with a **Reflexive Override**. It rejects surface similarity entirely in favor of causal structure, and it adds a second-order check on whether the act of comparison alters the structure being compared. This is a heavier modification than it appears; it effectively replaces "similarity" with "isomorphism of function."
