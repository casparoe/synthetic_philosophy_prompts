  1. Imagine a doctor looking at just you, with every test result known. If the question fixes the group, why doesn't your chance become zero or one once we narrow down to the individual?
     *   **Likely Answer:** "There is no question where the only relevant fact is identity."
     *   **Follow-up:** "So uncertainty is just a measure of our ignorance, not the world?"

  2. Two doctors treat the same patient but ask different questions about her recovery. If both questions are valid, do they get different true numbers, and is one of them actually wrong?
     *   **Likely Answer:** "Both are right relative to the inquiry."
     *   **Follow-up:** "So truth itself is relative to the questioner?"

  3. A woman is hit by a bus, and the only evidence is that four out of five buses in town are blue. On your account, is that statistical match enough for a verdict, or does the question need more?
     *   **Likely Answer:** "Legal verdicts require more than probability."
     *   **Follow-up:** "But if probability depends on the question, doesn't the legal question fix the class?"
     *   **[Likely Lecture Pivot]:** She may steer this into a general talk on legal epistemology.

  4. A parole board consultant wants to know reoffending rates among defendants of a specific ethnicity. That's a real question for them, so what in your view rules that group out?
     *   **Likely Answer:** "Ethics constrains the questions."
     *   **Follow-up:** "So morality limits what counts as a fact?"

