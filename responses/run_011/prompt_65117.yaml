answer: |-
  **Exam Question: Moral Obligation and Its Limits**
  **Time Allowed:** 75 Minutes
  **Total Marks:** 20

  **Question 1**

  Consider the following theoretical proposal, henceforth called the **Ledger View**.

  The Ledger View holds that moral obligations are not static but dynamic, dependent on an agent's moral history. When an agent performs a genuinely supererogatory act (one that is good, optional, and praiseworthy), they acquire a stock of **moral credit**. This credit is **agent-relative** (only the actor holds the credit) and **spendable** (it functions to lower future obligations). Consequently, an act that would normally be required may become merely permissible if the agent has sufficient credit balance. To prevent agents from accumulating permanent exemptions, this credit **expires** after a set period. Furthermore, the status of an act can **flip**: an act that is supererogatory for an agent with low credit might become required for an agent with high credit, as their "debt" to morality decreases.

  For example, under this view, donating a kidney might generate enough credit to excuse an agent from future charitable donations for a year. However, if that credit expires, their obligations return to baseline.

  **Prompt:**
  Evaluate the coherence of the Ledger View. Does this model successfully preserve the category of the supererogatory, or does it collapse supererogation into a form of transactional permission? In your answer, you must address the following tensions: the risk of "self-service" exemptions, the metric required to compare credits against duties, the implications of agent-relative obligation status, the function of moral praise, and how this view compares to agent-centered prerogatives.

  *Note: Mere recitation of standard definitions of supererogation will not earn credit. You must engage with the specific mechanics of the Ledger View as defined above.*

  ***

  **Model Answer**

  The Ledger View attempts to dynamize moral obligation by introducing a credit system, but in doing so, it risks dissolving the very category it seeks to explain. The central tension lies in whether supererogation remains "beyond the call" if it functions as currency to lower the call itself.

  First, the view faces a severe self-service or bootstrapping objection. If I can perform a good act today to purchase permission to ignore a drowning stranger tomorrow, morality becomes transactional. The Ledger View attempts to mitigate this via expiration dates, but this does not solve the structural issue. It allows agents to pre-purchase exemptions, turning duty into a debt that can be paid off rather than a categorical demand. A coherent theory of obligation usually requires duties to be binding regardless of past performance; making them endogenous to history suggests obligations are not truly obligatory but conditional quotas.

  Second, the view requires a scalar account of duty to function. For credit to lower obligation, there must be a common metric between "goodness" of supererogatory acts and "weight" of duties. How much credit does a kidney donation yield versus running into a burning building? Without a scalar theory of value, the ledger cannot be balanced. However, adopting a scalar view often undermines the binary distinction between duty and supererogation. If duty is just a threshold on a scale of value, then supererogation is merely "above the threshold," and the Ledger View simply moves the threshold. This suggests the view is only available to those who have already abandoned the off-the-call reading of duty.

  Third, the indexicality of obligation is problematic. If an act's status flips based on my balance, then whether I ought to save a stranger depends on my moral resume, not the stranger's need. This makes obligation radically agent-relative. Proponents might argue this is a feature, acknowledging moral fatigue or fairness. However, it undermines the general claim that donating a kidney is supererogatory. It is only supererogatory for those in debt; for the "credit-rich," it may be required. This fragments moral community standards, making public moral judgment impossible since no one knows another's balance.

  Fourth, the instrumentalization of praise is concerning. Praise typically registers the intrinsic value of an act. Under the Ledger View, praise might signal acquired credit. This changes the practice of praising from recognizing value to acknowledging currency accumulation. It risks encouraging acts done for credit rather than goodness, corrupting the motive required for the act to be genuinely supererogatory in the first place.

  Finally, compared to a Scheffler-style agent-centered prerogative, the Ledger View is less stable. A prerogative allows agents to prioritize personal interests without generating credit. It permits opting out without claiming moral surplus. The Ledger View claims surplus to opt out. The prerogative preserves supererogation as genuinely optional; the Ledger View makes it strategically required for future slack.

  Ultimately, the Ledger View saves the phenomenon of optional good acts only by destroying the categorical nature of duty. It preserves supererogation as a category of action but redefines it as investment rather than sacrifice.

  ***

  **Marking Scheme (20 Marks Total)**

  **General Instructions:**
  *   Do not award marks for name-dropping (e.g., "Urmson," "Heyd," "Scheffler") without analysis.
  *   Do not award marks for introductory fluff about supererogation sitting between duty and wrongdoing.
  *   **Penalty:** Deduct 2 marks total if the student invokes "Heyd's paradox" as a knockdown refutation without addressing the reply (good-making features need not be duty-generating) or claims the view is "circular" without specifying the direction (e.g., credit defines duty vs. duty defines credit).

  | Criterion | Status | Marks | Descriptor & Common Errors |
  | :--- | :--- | :--- | :--- |
  | **1. Self-Service/Bootstrapping** | **Load-Bearing** | 4 | **4:** Identifies risk of pre-purchasing exemptions; notes expiration doesn't fix structural transactionalism.<br>**2:** Identifies risk but accepts expiration as a full solution.<br>**0:** Misses the objection entirely.<br>*Error:* Claims this proves the view is impossible rather than problematic. |
  | **2. Commensurability/Scalar** | **Load-Bearing** | 4 | **4:** Notes need for metric between credit/duty; links this to collapsing binary duty.<br>**2:** Notes need for metric but doesn't link to scalar duty implications.<br>**0:** Assumes credits and duties are naturally comparable.<br>*Error:* Asserts "values are incomparable" without argument. |
  | **3. Indexicality of Status** | **Load-Bearing** | 4 | **4:** Discusses fragmentation of moral standards (act status varies by agent); evaluates bug vs. feature.<br>**2:** Notes status varies but treats it as unproblematic.<br>**0:** Ignores the relativism implication.<br>*Error:* Confuses agent-relative credit with agent-relative value. |
  | **4. Function of Praise** | **Bonus** | 4 | **4:** Argues praise becomes instrumental (currency acknowledgment) vs. evaluative; notes motive corruption.<br>**2:** Notes praise changes but doesn't explain why it matters.<br>**0:** Treats praise as unaffected.<br>*Error:* Claims praise is irrelevant to the theory. |
  | **5. Prerogative Comparison** | **Bonus** | 4 | **4:** Contrasts credit-based exemption with interest-based prerogative; notes stability difference.<br>**2:** Mentions prerogatives but fails to distinguish mechanism.<br>**0:** No comparison offered.<br>*Error:* Treats prerogative and credit as identical mechanisms. |

  **Grade Bands:**
  *   **A (17-20):** Hits all Load-Bearing points strongly + at least one Bonus point deeply. Avoids cheap moves.
  *   **B (13-16):** Hits all Load-Bearing points adequately. Bonus points weak or missing.
  *   **C (10-12):** Misses one Load-Bearing point or relies on cheap moves.
  *   **F (0-9):** Misses multiple Load-Bearing points or fails to engage the stem.

  \answer{Whether they recognize duty collapses into a moral transaction.}
