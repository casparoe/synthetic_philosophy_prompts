answer: |-
  # Q&A Prep Sheet: The Endogeneity Constraint

  **Core Thesis:** The Frame Problem is unsolved because ML solves *borrowed* relevance (statistical priors) but lacks *endogenous* relevance (selection based on the agent's own current projects).
  **Load-Bearing Concept:** The *Endogeneity Constraint*.

  ---

  ### 1. The Planning Pragmatist (Robotics/Planning Postdoc)
  **The Objection:** "You're treating goals as static. In modern planning stacks, we have dynamic cost functions and reward shaping. If a priority inverts, we update the cost function. If a promise is made, it's a constraint in the optimization problem. We don't need 'endogeneity,' we need better objective functions."

  **The Reply:** "Updating the objective function is exactly the bookkeeping problem you claim to have solved. Who updates the function? If it's an external programmer, that's borrowed relevance. If it's the agent, what triggers the update? You've moved the frame problem from 'which facts change?' to 'which goals change?' You haven't solved relevance; you've just pushed the relevance decision outside the optimization loop. My claim is that the mechanism for *choosing* to update the goal isn't itself an optimization over a fixed distribution."

  **Concede:** "Yes, explicit goal representation handles *known* priority shifts well."
  **Soft Spot:** "Can't meta-learning update the objective function based on runtime feedback?" (They will argue runtime feedback *is* endogenous. You must argue feedback signals are still defined by the training regime.)

  ### 2. The Senior Connectionist
  **The Objection:** "This sounds like GOFAI nostalgia. In deep learning, inductive bias *is* relevance. The latent space organizes itself around what matters for the loss function. You're drawing a metaphysical line between 'borrowed' and 'endogenous' that doesn't exist in the math. The network's state *is* its project."

  **The Reply:** "Inductive bias is fixed at training time; endogeneity is runtime flexibility. A network's latent space is a compression of *past* data. When I make a promise five minutes ago, that isn't in the training distribution. It's a new constraint generated by the agent's current history. If relevance is just loss minimization, the agent can never override its training priors for a specific, local reason unless that reason was anticipated in the loss function. That's not agency; that's lookup."

  **Concede:** "Yes, inductive biases heavily constrain what *can* be learned as relevant."
  **Soft Spot:** "What about online learning or continuous weight updates?" (You must argue that weight updates are still driven by external error signals, not internal project maintenance.)

  ### 3. The AI Historian
  **The Objection:** "McCarthy and Hayes (1969) defined the frame problem as a representational efficiency issue in logical deduction. They were worried about axioms, not 'projects.' You're retrofitting a philosophical relevance problem onto a technical bookkeeping problem and calling it 'still live.' That's not history."

  **The Reply:** "I'm not arguing about their ink; I'm arguing about their insight. They noticed that deductive closure explodes. The community solved the explosion with circumscription and situation calculus, but only by assuming a closed world. As soon as you open the world—which modern AI does—the relevance question returns. They circled the target even if they named it 'qualification.' The literature dissolved the logical version but ignored the cognitive version. I'm reclaiming the cognitive version."

  **Concede:** "Yes, strictly speaking, they framed it as a logical qualification problem."
  **Soft Spot:** "Are you just renaming the 'relevance problem' from the 80s? Why call it Frame?" (You need to hold that Frame is the ancestral name for the general issue of change and relevance.)

  ### 4. The Transformer Researcher (ML Postdoc)
  **The Objection:** "Attention mechanisms solve this. The model dynamically weights tokens based on context. That's relevance determination happening at inference time, not training time. The context window holds the 'promise,' the attention head picks it up. That's endogenous."

  **The Reply:** "Attention weights are computed by functions learned from the training distribution. They select relevance based on statistical correlation, not intentional commitment. If I promise to do X, but the statistical prior says X is unlikely, the attention mechanism will likely attend to the prior, not the promise, unless the promise is explicitly highlighted. The mechanism doesn't know *why* the promise matters, only that it matches a pattern. Endogeneity requires knowing *why* it matters to *you*."

  **Concede:** "Yes, attention allows dynamic selection within a context window."
  **Soft Spot:** "Doesn't fine-tuning on personal data make the 'personal' pattern statistically dominant?" (You must argue that statistics never capture the *normative force* of a commitment.)

  ### 5. The Dreyfusian (Philosopher)
  **The Objection:** "You're intellectualizing coping. Heidegger showed that relevance shows up in the breakdown of equipment, not in deliberation. You're trying to solve this with another layer of computation. The solution isn't endogenous computation; it's embodiment. Relevance is disclosed by the situation, not selected by the agent."

  **The Reply:** "Embodiment explains how relevance is *grounded*, not how it's *selected* among competing grounds. I can be embodied and have two conflicting projects. Which one wins? The situation doesn't decide; the agent's commitment does. You're describing the background conditions for agency, not the mechanism of priority inversion. I'm arguing for the mechanism that operates *on* that background."

  **Concede:** "Yes, disembodied systems lack the contextual grounding for relevance."
  **Soft Spot:** "Isn't the 'commitment' itself just a product of embodied history?" (This threatens to collapse endogeneity back into borrowed history.)

  ### 6. The Robotics Engineer (Closed-World Advocate)
  **The Objection:** "In real deployment, we assume a closed world. We define the domain. If the world changes outside the domain, the system stops. We don't need general endogeneity; we need safe failure. Your problem only exists in open-world fantasies."

  **The Reply:** "Safe failure isn't agency. If the system stops whenever a priority inverts unexpectedly, it's not an agent; it's a tool. I'm arguing about systems that claim to act autonomously. If you restrict the domain enough to solve the frame problem, you've removed the need for intelligence. The frame problem is the tax you pay for openness. You can't evade it by closing the world if you want general autonomy."

  **Concede:** "Yes, closed-world assumptions make the problem tractable for specific tasks."
  **Soft Spot:** "Isn't most useful AI just narrow tools?" (Hard to argue against without sounding like you want AGI immediately.)

  ### 7. The Analytic Philosopher
  **The Objection:** "Isn't this just the Symbol Grounding Problem? You're saying the system doesn't know what the symbols mean. If it knew what a 'promise' meant, it would know it's relevant. You're repackaging semantics as relevance."

  **The Reply:** "Grounding is about mapping symbols to world states. Relevance is about selecting which world states matter *now*. I can know what a promise means (grounding) but still fail to prioritize it over a statistical habit (relevance). You can have grounded symbols and still have the frame problem. The issue isn't meaning; it's weighting."

  **Concede:** "Yes, lack of grounding exacerbates the relevance failure."
  **Soft Spot:** "Can you have relevance without semantics?" (If you say yes, you look behaviorist. If no, you rely on grounding.)

  ### 8. The Pragmatist (ML Student)
  **The Objection:** "Okay, suppose you're right. Borrowed relevance works 99% of the time. Endogeneity is edge cases. Why does this matter for engineering? We optimize for the 99%."

  **The Reply:** "Because the 1% is where liability and trust live. If a system fails when a priority inverts, it's unpredictable. You can't deploy endogenous failures in high-stakes environments. Also, without endogeneity, you don't have agents; you have automata. If you want automation, fine. If you want agency, you need to solve this. You can't have agency on the cheap."

  **Concede:** "Yes, borrowed relevance is sufficient for most current commercial applications."
  **Soft Spot:** "Is 'agency' actually a useful category, or just marketing?" (Hard to defend without getting metaphysical.)

  ---

  ### The Single Answer That Must Land
  *When asked to summarize the "Endogeneity Constraint" in one sentence:*

  "It's the difference between selecting a move because it fits the pattern of all previous games (borrowed) versus selecting a move because it serves a commitment you made *in this specific game* that overrides the pattern (endogenous). Without the latter, you have a simulator, not a player."

  ### The Prayer Question (The One You Hope They Don't Ask)
  **The Question:** "If the agent's 'own projects' are themselves learned from data, interaction, or prior experience, isn't *all* relevance ultimately borrowed from a distribution? Where does the endogenous part actually come from without invoking magic?"

  **Why it hurts:** It attacks the coherence of the distinction. If the "self" that generates the projects is constructed from borrowed materials, the Endogeneity Constraint collapses into a recursion problem. Answering honestly requires either admitting a non-computational source of agency (metaphysical claim) or conceding that endogeneity is just a complex form of borrowing (thesis dies).

  **Improvised Defense (if asked):** "It's not about the *origin* of the project, but the *authority* structure. Borrowed relevance defers to the training distribution's authority. Endogenous relevance defers to the agent's current state maintenance. The mechanism isn't magic; it's a self-referential loop where the system's current state modifies its own relevance weights independently of gradient descent. Whether that's computable is the open question."
