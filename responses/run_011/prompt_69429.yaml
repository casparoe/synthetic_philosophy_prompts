answer: |-
  ### 1. Exam Question Stem

  **Final Exam: Philosophy of Social Science & Moral Psychology**
  **Time:** 90 Minutes | **Marks:** 25

  **Question:**
  Read the following study summary carefully. You may not cite outside literature or specific authors. Your answer must rely solely on reasoning from the design and results provided below.

  **Study Design:**
  *   **Sample:** National panel, 14,000 adults, four waves over twenty years, in an unnamed Western European country where monthly religious attendance fell from roughly two-thirds of adults to about a fifth over that period.
  *   **Measures:** Each wave measures: (A) monthly attendance; (B) self-reported volunteering hours and giving as a share of income; (C) a real one-shot anonymous money transfer to a stranger in another city, no repeat interaction, recipient knows nothing about the sender; (D) the same transfer but the recipient is a fellow member of the sender's congregation or community group and both sides know the pairing; (E) two neighbors rate the participant on whether they'd hand over their house keys; (F) the standard generalized-trust item about whether most people can be trusted.
  *   **Results:** Attendance predicts B and E strongly and D moderately, but predicts C barely at all, and the tiny C effect vanishes when the anonymous recipient is described as having no community ties whatsoever. Participants who stopped attending between waves 2 and 3, matched to continuing attenders on demographics and on their wave-2 scores, show no drop in C, a modest drop in D and E, and a large drop in B. F rises across the whole country over the two decades even as attendance falls, with the rise concentrated in the under-35s and the highly educated. And E ratings of attenders by their own neighbors go up over time while E ratings of non-attenders by their neighbors go down.

  **Prompt:**
  Based *only* on the design and results above, argue whether this study supports the claim that religion makes people "more moral." Your essay must define what "moral" would have to mean for these results to count as evidence for that claim, and specify precisely what the results license regarding causality and social change.

  ***

  ### 2. Model Answer

  The claim that religion makes people "more moral" is unsupported by this study unless "moral" is defined narrowly as *parochial prosociality* rather than *universal ethical commitment*. The results draw a sharp distinction between how religious people treat their own community versus how they treat strangers, and the longitudinal data suggests that secularization does not erode generalized trust. Therefore, religion appears to sustain community-specific cooperation, but not morality in a universal sense.

  First, we must define the dependent variable. If "moral" means maximizing welfare for anyone regardless of ties (Measure C and F), religion fails the test. Attendance predicts anonymous giving (C) barely at all, and the effect disappears when the recipient has no community ties. Furthermore, generalized trust (F) rises nationally as attendance falls. This inverse relationship suggests that the mechanisms producing universal trust are independent of, or perhaps even suppressed by, religious institutional participation. However, if "moral" means being a reliable co-operator within a specific network (Measures B, D, E), religion looks effective. Attendance strongly predicts volunteering and neighbor trust. But this is merely group cohesion, not necessarily morality. A mafia member is reliable to their family but not moral. The study shows religion makes people better *neighbors*, not necessarily better *humans*.

  Second, the causal claim that religion *makes* people better is threatened by selection effects, despite the leaver analysis. The study matches leavers to stayers on demographics and wave-2 scores. While this controls for observed baseline differences, it cannot control for unobserved life shocks. A person might stop attending because of a crisis (divorce, job loss) that also causes them to volunteer less (Measure B). The large drop in B among leavers could be the result of the crisis, not the cessation of attendance. The fact that C (anonymous giving) does not drop for leavers strengthens the selection argument: if religion causally generated moral capital, losing it should reduce all prosociality. Instead, only the community-tied behaviors (B, D, E) drop. This suggests religion selects for people already inclined toward community engagement, or simply provides the infrastructure for it, rather than generating the moral disposition itself.

  Third, and critically, we cannot interpret the trend data without addressing measurement invariance. Measures B (self-reported volunteering) and E (neighbor ratings) are assessed over twenty years of rapid cultural change. Does "volunteering" mean the same thing in Wave 1 as in Wave 4? If secularization changes the *definition* of civic duty, self-reports may not be comparable. More importantly, consider Measure E. As attendance drops from two-thirds to one-fifth, being an attender becomes a rare, high-cost signal. Neighbors rating attenders higher over time may not reflect improved behavior, but increased *prestige* associated with a rare identity. Conversely, non-attenders are rated lower not because they are worse, but because they are the default. If the meaning of the rating scale shifts as the base rate of attendance shifts, the trend is an artifact of signaling, not moral decay.

  Finally, social desirability likely inflates Measure B, but this is secondary to the invariance problem. Religious participants may over-report volunteering to align with norms. However, since Measure E (neighbor ratings) also tracks with attendance, there is some external validation. Yet, if neighbors share the religious bias, E is also contaminated.

  In conclusion, the study licenses the claim that religious communities sustain internal cooperation and signal reliability to neighbors. It does not support the claim that religion produces universal moral agents. The rise in generalized trust alongside religious decline suggests morality, defined universally, is secularizing successfully. To claim religion makes people "better" requires ignoring the anonymous stranger and the macro trends in trust.

  ***

  ### 3. Marking Scheme (25 Marks)

  **1. Conceptualization of Morality (5 Marks)**
  *   **5:** Clearly distinguishes parochial (B, D, E) vs. universal (C, F) morality. Argues that results support the former but contradict the latter.
  *   **3:** Identifies the split in results but fails to define "moral" explicitly.
  *   **0:** Treats all measures as equivalent evidence of "goodness."
  *   *Common Error:* Reciting outside debates (e.g., Norenzayan vs. Shariff) instead of defining terms based on the measures provided.

  **2. Causal Inference & Selection (7 Marks)**
  *   **7:** Identifies that matching on observed wave-2 scores does not eliminate unobserved selection (e.g., life shocks causing both leaving and dropping B). Notes that C not dropping for leavers undermines the causal mechanism.
  *   **4:** Identifies selection issues but treats the matching as sufficient for causality, or focuses only on social desirability.
  *   **0:** Accepts the leaver comparison as proof of causation.
  *   *Common Error:* Focusing heavily on social desirability (worth max 2 marks within this section) while ignoring the structural selection problem in the leaver design.

  **3. Measurement Invariance (5 Marks) — *Must-Hit***
  *   **5:** Explicitly questions whether B and E mean the same thing in Wave 1 vs. Wave 4. Connects the rarity of attendance (2/3 to 1/5) to the signaling value of Measure E (ratings rise because attenders are rare/select).
  *   **2:** Mentions social desirability but misses the longitudinal invariance/signaling issue.
  *   **0:** Ignores measurement validity over time.
  *   *Constraint:* Answers failing to address measurement invariance across the two decades cannot score higher than 15/25 total.

  **4. Macro Context & Generalized Trust (3 Marks)**
  *   **3:** Integrates the rise in F (trust) despite fall in A (attendance) to argue against the "religion makes people better" thesis.
  *   **1:** Mentions F rises but doesn't connect it to the main argument.
  *   **0:** Ignores Measure F.

  **5. Structure & Argumentation (5 Marks)**
  *   **5:** Takes a clear position (e.g., "Religion sustains community, not universal morality"), flows logically.
  *   **3:** Lists considerations without synthesizing them into a thesis.
  *   **0:** Disorganized or unreadable.

  ***

  ### 4. The "A-Grade" Move

  **The Signaling Value of Rarity:**
  Beyond the must-hit measurement invariance point, the move that lifts a student from a solid B to an A is connecting the **decline in attendance base rates** (2/3 to 1/5) directly to the **increase in neighbor ratings (E) for attenders**.
  *   **B-Level:** Notes that measurement might change over time.
  *   **A-Level:** Argues that as religion becomes rare, it transforms from a *norm* into a *costly signal*. Neighbors rate attenders higher over time not because attenders are behaving better, but because the *meaning* of attendance has shifted from "normal citizen" to "highly committed community member." This explains why E ratings for attenders go up while non-attenders go down (the new default is viewed with suspicion), independent of actual moral behavior. This synthesizes the demographic shift with the micro-level rating data.

  ***

  ### 5. Internal Coherence Flags (For Instructor Only)

  Before printing, you should fix these three incoherencies in the study design text:

  1.  **Panel vs. Cohort Confusion:** The study is described as a "National panel... four waves over twenty years" (implying the *same* 14,000 people tracked). However, the results state the rise in F (trust) is "concentrated in the under-35s." In a 20-year panel, the under-35 cohort ages out. If you mean new young people were added each wave, it is a "repeated cross-section" or "cohort-sequential" design, not a simple panel. If it is a fixed panel, "under-35s" is a shrinking, aging group, making the trend hard to interpret.
      *   *Fix:* Change "National panel" to "National repeated cross-section" OR remove the "under-35s" detail.
  2.  **Matching Ambiguity:** The text says leavers were "matched... on their wave-2 scores." Which scores? A, B, C, D, E? If they are matched on Wave-2 B (volunteering), finding a drop in B at Wave-3 is statistically tricky (regression to the mean). If they are matched on Wave-2 A (attendance), that defines the group.
      *   *Fix:* Specify "matched on demographics and Wave-2 prosociality scores (B, C, D, E)."
  3.  **Measure C Variant:** The measure list defines C as "anonymous money transfer to a stranger." The results mention a condition where "the anonymous recipient is described as having no community ties whatsoever." This implies a sub-variant of C not listed in the measures.
      *   *Fix:* Add to Measure C description: "...including a variant where the recipient is explicitly described as having no community ties."
