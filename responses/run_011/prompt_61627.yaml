answer: |-
  ### Phase 1: Brainstorming Candidate Implicit Theories

  To diagnose these regimes, I need to isolate the normative claims hidden in their administrative procedures. Here are the five strongest candidate theories, followed by my assessment of their viability.

  1.  **The Anti-Corruption Panopticon:** Publicity exists primarily to monitor the *tax authority*, not the taxpayer. If assessments are public, the state cannot secretly favor the powerful.
      *   *Scrutiny:* Fits Norway's official rationale. Fails to explain Finland's mass media dumps (which target individuals, not auditors) or the US confidentiality of returns (the US has other audit controls). *Verdict: Partial survivor.*
  2.  **Horizontal Equity Enforcer:** Taxation is a cooperative scheme among citizens. Secrecy allows free-riding; publicity ensures everyone contributes their fair share relative to peers.
      *   *Scrutiny:* Strong fit for Finland/Sweden. Explains why neighbors check neighbors. Implies citizenship entails a waiver of financial privacy regarding the "common pot." *Verdict: Strong survivor (Nordic).*
  3.  **The Liberal Privacy Shield:** Financial data is intimate and potentially dangerous. The state needs it for collection, but broadcasting it violates autonomy and invites harm (kidnapping, identity theft, harassment).
      *   *Scrutiny:* The bedrock of the US regime (26 U.S.C. § 6103). Treats tax data like medical or legal records. *Verdict: Strong survivor (US).*
  4.  **The Public-Function Distinction:** If you consume public funds (salary) or wield public power, privacy is forfeited. If you earn private wealth, privacy is retained.
      *   *Scrutiny:* Explains the US hybrid (public salaries open, private returns closed). *Verdict: Survivor, but philosophically unstable (see below).*
  5.  **The Social Shaming Mechanism:** The state uses embarrassment as a compliance tool.
      *   *Scrutiny:* While "Envy Day" functions this way, liberal states rarely admit to using shame as official policy. It's a sociological effect, not a legal justification. *Verdict: Rejected as normative theory, kept as functional observation.*

  **Narrowing Down:**
  Theories 2 and 3 are the primary rivals. Theory 2 (Cooperative Scheme) underpins the Nordic model; Theory 3 (Privacy Shield) underpins the US. Theory 4 (Public-Function) is the US attempt to bridge the gap, but it relies on a specific definition of "public" that I will challenge. Theory 1 is the "official story" that often masks the deeper social contract implications of Theory 2.

  ---

  ### Phase 2: Reconstructing the Implicit Theories

  #### 1. The Nordic Model: Taxation as a Transparent Cooperative Scheme
  **Implicit Theory:** The Nordic regimes presuppose that tax compliance is not merely a vertical obligation (citizen to state) but a horizontal one (citizen to citizen).
  *   **What it requires:** It requires that income be viewed not as purely private property, but as a metric of one's participation in the social contract. If society provides the infrastructure, security, and education that generates income, society has a claim to know the outcome.
  *   **What it fits:** It fits a high-trust, low-inequality society where the "lookup" is rarely weaponized because the range of incomes is narrower and the welfare state mitigates the stakes of disparity.
  *   **Ruled Out:** This regime quietly rules out the libertarian view that wealth generation is a purely private act. It also rules out the idea that financial privacy is a fundamental human right akin to bodily autonomy.

  #### 2. The US Model: The State as Fiduciary, The Wallet as Fortress
  **Implicit Theory:** The US regime (26 U.S.C. § 6103) presupposes that the tax authority is a dangerous repository of sensitive data that must be contained. Privacy is a shield against both state overreach and private predation.
  *   **What it requires:** It requires a sharp ontological distinction between "public funds" (salaries) and "private funds" (market income).
  *   **Coherence Check:** The US line ("public money public, private money secret") is *legally* coherent but *philosophically* smuggled. It assumes private wealth is generated in a vacuum. If a billionaire's wealth relies on public courts, infrastructure, IP law, and educated workers, the "private" label is a fiction. The US model protects the *source* of wealth (private market) while exposing the *cost* of government (public salaries). This creates an asymmetry: we watch the cost of the state, but not the benefit extracted *from* the state.
  *   **Ruled Out:** This regime rules out the notion that citizens have a right to verify horizontal equity. It prioritizes individual security over collective verification.

  #### 3. The Meaning of "Transparency" and Causality
  "Transparency" does not mean the same thing in these regimes.
  *   **In the Nordics:** Transparency is **constitutive of trust**. It assumes trust is high enough to withstand scrutiny, and scrutiny reinforces that trust. The causality runs: *Social Solidarity → Transparency → Reinforced Solidarity.*
  *   **In the US:** Transparency is **compensatory for distrust**. We publish public salaries because we *don't* trust officials. We hide tax returns because we *don't* trust neighbors or criminals. The causality runs: *Distrust of State → Transparency of Officials; Distrust of Peers → Privacy of Citizens.*

  #### 4. The Norwegian Tweak: Stigmatizing the Looker
  The 2011 Norwegian reform (login + notification) is the most philosophically sophisticated adjustment.
  *   **The Problem:** Unrestricted transparency creates a power asymmetry. The looker knows about the looked-up, but not vice versa. This turns transparency into surveillance.
  *   **The Fix:** By notifying the subject, Norway transforms the act from "surveillance" to "encounter." It acknowledges that *curiosity is a form of power*.
  *   **Why Stigmatize?** It isn't necessarily to stigmatize, but to **reciprocalize**. If I know you can see me looking, I am less likely to look maliciously. It shifts the theory from "The Public has a right to know" to "Citizens have a right to verify, but not to snoop." It preserves the *Control Theory* (checking assessments) while dampening the *Shame Theory* (envy/harassment). It admits that total transparency can erode the very social trust it aims to protect.

  ---

  ### Phase 3: Social Preconditions and Regime Swapping

  If we treat these laws not just as rules but as social technologies, swapping them reveals their hidden dependencies.

  **If the US adopted the Nordic Model:**
  *   **Social Consequence:** Without pre-existing high social trust and low inequality, this would likely lead to weaponization. In a high-inequality society, income data becomes a target list for harassment, kidnapping, or political vengeance.
  *   **Philosophical Shift:** It would require Americans to accept that wealth is a matter of public record, fundamentally challenging the liberal conception of private property. It would likely increase tax morale *or* increase evasion driven by resentment, depending on whether the public perceived the system as fair.
  *   **Underdetermination:** The law cannot manufacture the social norm. Finland works because Finns generally agree on what a "fair" income looks like. In the US, where CEO-to-worker pay ratios are extreme, publicity might ignite class warfare rather than cooperative compliance.

  **If the Nordics adopted the US Model:**
  *   **Social Consequence:** This would signal a collapse of the "common pot" mentality. It would suggest the state no longer trusts citizens to police each other, or that the state fears its own citizens more than it fears tax evasion.
  *   **Philosophical Shift:** It would reframe taxation from a civic duty to a private extraction. It would likely increase the perception that "everyone else is cheating," lowering voluntary compliance.
  *   **Underdetermination:** It highlights that privacy is a luxury good of stable institutions. When trust in the system drops, privacy becomes a shield for the corrupt.

  ---

  ### Phase 4: Where is this Philosophically Underdetermined?

  There are three unresolved tensions that neither regime fully solves:

  1.  **The Right to Know vs. The Right to Security:**
      Norway's tweak admits this tension. There is no philosophical consensus on whether "knowing a neighbor's income" is a civic right (necessary for democracy) or a privacy violation (unnecessary for function). The law draws a line, but the moral status of that line is arbitrary. Is income data like a criminal record (public safety interest) or a medical record (private interest)? Both regimes pick one, but neither proves why.

  2.  **The Definition of "Public":**
      The US distinction between public salaries and private income relies on a fiction. All wealth is partly public (dependent on state stability) and partly private. The Nordic model treats all income as public. Neither captures the nuance that *some* private wealth wields public power (e.g., a billionaire funding super-PACs). Transparency regimes fail to target *influence*, focusing instead on *amount*.

  3.  **The Causality of Trust:**
      Does transparency create trust, or does trust allow transparency? The Nordic experience suggests the latter. If you impose Nordic transparency on a low-trust society, you get doxxing, not compliance. If you impose US privacy on a high-trust society, you get suspicion, not security. The law is epiphenomenal to the culture, yet policymakers treat it as a lever to change culture.

  ### Conclusion

  The Nordic regimes presuppose **Taxation as a Civic Commons**, where financial privacy is waived to ensure horizontal equity and maintain the integrity of the cooperative scheme. The US regime presupposes **Taxation as a Necessary Intrusion**, where privacy is a bulwark against state and private predation.

  The US "public money/public, private money/secret" distinction is legally functional but philosophically incoherent because it ignores the public infrastructure underpinning private wealth. The Norwegian login tweak is a crucial evolution: it recognizes that transparency without reciprocity is surveillance, not accountability.

  Ultimately, these laws are not just administrative; they are declarations of what kind of society we inhabit. The Nordics declare: "We are partners in a shared project." The US declares: "We are sovereign individuals protected from each other and the state." Neither is strictly "correct"; they are bets on human nature. The Nordic bet requires high equality to function safely; the US bet accepts higher evasion risks to protect individual autonomy. The underdetermination lies in whether we believe financial data reveals a *public claim* or a *private secret*—a question law can answer, but only philosophy can justify.
