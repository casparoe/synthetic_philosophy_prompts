  There are two main candidate rules in axiomatic bargaining theory that fit most of your cases. Here is how they score against your verdicts.

  ### The Two Candidates

  1.  **Nash Bargaining Solution (NBS):** Maximizes the *product* of the gains above walkaway. $(x - d_x) \times (y - d_y)$.
  2.  **Kalai-Smorodinsky (KS):** Equalizes the *fraction* of the maximum possible gain each person achieves. $\frac{x - d_x}{x_{ideal} - d_x} = \frac{y - d_y}{y_{ideal} - d_y}$.

  ### The Scorecard

  | Case | Your Gut | Nash (NBS) | Kalai-Smorodinsky (KS) | Winner |
