  **Case 3 is the tiebreaker.** Your explicit reasoning ("same fraction of our own best case") is the literal definition of Kalai-Smorodinsky. Nash Bargaining ignores the "ideal point" and focuses on the curvature of the frontier, which is why it yields 60/37.5 instead of your 66.7/33.3.

  **Case 4 is the moral test.** You correctly identified that Nash Bargaining violates a principle called **Monotonicity**. If the set of possible deals expands (adding an option), nobody should end up worse off than before. Nash allows your gain to increase at her expense simply because a new option changed the "slope" of the deal, even if that option wasn't picked. Kalai-Smorodinsky satisfies Monotonicity; in your Case 4, her share would slightly *increase* (from ~6.67 to ~6.72), not drop.

