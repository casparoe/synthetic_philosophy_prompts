answer: |-
  You are right. Superrationality is not a decision theory; it is a coordination norm that masquerades as one. It functions only within a closed class of agents who share common knowledge of their own superrationality. Once you open the class to include uncertainty about the opponent's reasoning type, the "logical link" superrationality relies on dissolves into a standard probabilistic calculation where defection dominates (or at best, becomes a threshold calculation rather than a logical necessity). Your arithmetic holds for the model where superrationality is treated as a fixed disposition to cooperate, but even under the "mirror" model (where the superrationalist mirrors your move), the requirement for certainty ($p=1$) to guarantee the cooperative equilibrium reveals the theory's inability to guide action under uncertainty. It cannot bootstrap the closed class it requires to function.

  **First, the unfairness charge.** You suggest that genuine superrational reasoning might not admit mixed credences without dissolving. This charge does not miss; it indicts. A decision theory is a tool for navigating uncertainty. It must take an epistemic state (including credences about the world and other agents) as input and output a verdict. If superrationality "dissolves" when $p < 1$, it is not a decision theory; it is a description of an equilibrium state that agents occupy only when they already know they are in the club. To say "you cannot have mixed credences and be superrational" is to say "you cannot be superrational unless you are certain others are." This makes superrationality a status, not a strategy. It offers no help to the agent standing outside the door wondering whether to knock. If the theory cannot process the uncertainty of the open class, it fails the basic job description of a decision theory. The "unfairness" is actually the fatal flaw: the theory presupposes the solution (common knowledge) as a precondition for its application.

  **Second, Team Reasoning and EDT.** Team Reasoning inherits the identical closure problem. It requires identifying the "team" before reasoning can begin. If you assign probability $p$ to the opponent being a team-reasoner, you cannot fully adopt the "we-perspective" because the "we" is ill-defined. You are forced back into individual reasoning to calculate the expected value of team-reasoning, which collapses the view back into a standard calculation vulnerable to the same defection pressure.

  Evidential Decision Theory (EDT), however, does better. EDT does not require logical identity or team membership; it requires only correlation. EDT asks, "Is my cooperation evidence of their cooperation?" In your mixed setting, if you believe your reasoning is correlated with theirs (even probabilistically), EDT can justify cooperation when $p$ is sufficiently high. It survives the open class because it treats the link as empirical or statistical rather than logical or normative. The trouble for superrationality and team reasoning is specifically about *closure* (knowing who is in the group), whereas EDT's trouble is about *correlation strength*. EDT admits the mixed setting and calculates; superrationality rejects the mixed setting and stalls.

  **The single weakest link in my case.**
  I am drawing a hard distinction between superrationality and EDT, claiming the former requires logical identity/certainty while the latter handles probability. The weakest link is the possibility that superrationality *is* just EDT with a specific, high-confidence prior about logical correlation. If a superrationalist can coherently say, "I assign probability $p$ to us sharing the same reasoning algorithm," and then maximize expected utility based on that correlation, superrationality becomes a standard decision theory that handles the open class gracefully (cooperating when $p$ exceeds a threshold). My thesis relies on superrationality being an all-or-nothing logical claim; if it can be probabilized without losing its essence, then it *is* a decision theory, and your arithmetic (and my support for it) fails.
