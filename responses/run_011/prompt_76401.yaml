  **MEMORANDUM**

  **TO:** Board of Trustees
  **FROM:** [Your Name]
  **DATE:** January 5, 2025
  **SUBJECT:** Decision Framework for Grantmaking: Recommendation on Risk-Weighted Proposal

  ### Bottom Line Recommendation

  I recommend that the Board **reject the proposal to adopt Risk-Weighted Expected Utility (REU) with a squared probability function**, but that we simultaneously **update our Investment Policy Statement to explicitly include a "Ruin Constraint" and a concave utility function for ecological outcomes.**

  We should not change our fundamental decision calculus from Expected Value (EV) maximization, as the proposed REU mechanism introduces mathematical inconsistencies and portfolio management hazards that outweigh its theoretical benefits. However, the risk concerns raised by our actuary trustee are valid and must be addressed through clearer constraints rather than a new decision theory.

  ### Context

  For the past decade, our policy has been to maximize expected ecological benefit per dollar. Last month, a proposal was circulated to switch to a "risk-weighted" model (specifically, weighting probabilities by $p^2$). The intent is to penalize "moonshot" grants (low probability, high benefit) and heavily penalize tail-risk disasters (low probability, catastrophic loss). A counter-argument was raised that this is operationally unnecessary—that standard risk aversion (concave utility) achieves the same end without new machinery, and that the REU model complicates portfolio aggregation.

  After reviewing the literature and modeling the impact on our current pipeline, I believe the Skeptic's objection regarding portfolio coherence is decisive, but the Actuary's concern regarding "ruin" requires a specific policy safeguard.

  ### Analysis of the REU Proposal

  The proposal to use a risk function $r(p) = p^2$ is an application of Risk-Weighted Expected Utility theory. While theoretically interesting, it presents three specific problems for our operations:

  **1. The Asymmetry Problem (Mathematical Consistency)**
  The Actuary's pitch relies on the function being "deliberately pessimistic": ignoring low-probability wins while treating low-probability disasters as certainties. However, a single monotonic risk function like $p^2$ treats probability symmetrically.
  *   **Wins:** A 1-in-1,000 chance of a massive ecological win is downweighted to 1-in-1,000,000. (Intended effect: Ignore moonshots.)
  *   **Losses:** A 1-in-1,000 chance of a catastrophic legal/financial loss is *also* downweighted to 1-in-1,000,000. (Unintended effect: Ignore ruin.)
  To achieve the Actuary's stated goal (fearing the disaster while ignoring the moonshot), we would need a reference-dependent model (like Prospect Theory) or separate risk functions for gains and losses. Adopting $p^2$ as written might actually blind us to the very tail risks the Actuary wants to avoid.

  **2. The Portfolio Aggregation Problem**
  The Skeptic trustee correctly identified that scoring grants in isolation under REU does not aggregate cleanly to the portfolio level.
  *   **Correlation:** Many of our grants are correlated (e.g., multiple projects dependent on the same regulatory ruling). REU violates the "Sure Thing Principle," meaning we cannot simply sum the risk-weighted scores of individual grants to understand the fund's total risk.
  *   **Dynamic Inconsistency:** REU can lead to situations where a portfolio of grants looks acceptable individually but unacceptable in aggregate, or vice versa. For a fiduciary body managing a $9M endowment, we need a framework where the sum of the parts equals the whole. Standard Expected Utility preserves this; REU does not.

  **3. Arbitrariness of the Risk Function**
  Why $p^2$? Why not $p^{1.5}$ or $p^3$? In standard Expected Utility, risk aversion is derived from the *utility function* (how much we value the next dollar or the next fish saved), which can be calibrated to our mission. In REU, the risk function is a separate parameter with no external anchor. Adopting $p^2$ sets a precedent where our risk tolerance is defined by an arbitrary exponent rather than our actual capacity to absorb loss.

  ### Analysis of the "Smoke and Mirrors" Objection

  The Skeptic trustee argues that we should simply use a concave utility function over dollars/outcomes and keep maximizing Expected Value. This objection is theoretically robust and deserves a real hearing.

  *   **Where the Skeptic is Right:** Concave utility (diminishing marginal value) successfully handles the "moonshot" problem. If saving 10,000 fish isn't valued 10x more than saving 1,000 fish, we naturally deprioritize low-probability home runs. It also preserves portfolio coherence, allowing us to optimize the $9M endowment as a single unit.
  *   **Where the Actuary Pushes Back (and is right):** The Actuary cites Rabin's Calibration Theorem, which suggests that if we reject small favorable bets due to concave utility, we are mathematically committed to rejecting absurdly large favorable bets. While this theorem applies strictly to wealth, it highlights a limitation: utility curvature alone can feel like a "fudge factor" to explain away risk aversion. The Actuary is correct that we have an intuitive fear of *uncertainty itself*, not just *diminishing returns*, that standard EV struggles to capture without looking like we are fudging the numbers.

  ### The Path Forward: EV + Guardrails

  We do not need to abandon Expected Value to address the Actuary's concerns. We can address the fear of ruin and the calibration issue through policy constraints rather than changing the decision calculus.

  **1. Adopt a Concave Ecological Utility Function**
  We should formally define "Benefit" not as raw units (e.g., miles of river), but as utility-weighted units. This validates the Skeptic's approach: we naturally value the first mile of restored river more than the hundredth. This handles the "moonshot" issue without breaking the math.

  **2. Implement a "Ruin Constraint" (Value at Risk)**
  To address the Actuary's fear of catastrophic loss (the dam removal that wipes out the fishery), we should add a hard constraint to our policy:
  *   *No single grant or correlated cluster of grants may expose the organization to a loss of liquidity or reputation exceeding X% of the endowment.*
  This creates the "pessimistic scoring" the Actuary wants for disasters (by vetoing them entirely) without distorting the probability weights of successful outcomes.

  **3. Maintain Expected Value for Selection**
  Within those guardrails, we continue to maximize Expected Ecological Utility per Dollar. This preserves our ability to compare disparate projects and manage the portfolio holistically.

  ### Conclusion

  The Actuary is right that blind Expected Value maximization can expose us to absurd tail risks. The Skeptic is right that Risk-Weighted Expected Utility is the wrong tool to fix it, as it breaks portfolio coherence and relies on arbitrary parameters.

  **Motion for January Meeting:**
  I will move to **table the REU proposal** and refer it to the Investment Committee for further theoretical review. Simultaneously, I will move to **draft a revised Grantmaking Policy** that incorporates a concave utility function for ecological outcomes and a hard "Ruin Constraint" on financial and reputational exposure.

  This approach gives the Actuary the safety he seeks, the Skeptic the mathematical coherence she requires, and the Board a defensible fiduciary standard.

  I look forward to discussing this on the 15th.
