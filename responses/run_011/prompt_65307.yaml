  4.  **Rank and Refine Tensions:**

      *   *Severity 1: The Normativity Problem (C3 + C6 + C7).*
          *   Conflict: C3 strips hinges of epistemic status (not true/false, not known). C6 asserts the denier is "wrong" and subject to criticism/"oughts." C7 labels the resolution "rational persuasion."
          *   Why severe: This strikes at the heart of the Wittgensteinian move. If hinges aren't truth-apt, calling someone "wrong" is category confusion. If it's not epistemic, "rational" is the wrong label.
          *   Fix: Weaken C3 (allow a sui generis epistemic status) or Weaken C6/C7 (admit it's pragmatic coercion, not rationality).
          *   Cost: Weakening C3 loses the sharp distinction between empirical and grammatical. Weakening C6/C7 makes the view look like fideism or force.

      *   *Severity 2: The Mechanism of Change (C5 + C7).*
          *   Conflict: C5 says hinges shift based on community/history. C7 describes an individual psychological shift based on "unliveability."
          *   Why severe: C7 implies the individual saw a logical flaw ("standard... would have dissolved everything"). But C3/C1 says hinges aren't subject to logical testing. If she tested the hinge, it wasn't a hinge *for her* at that moment.
          *   Fix: Clarify that the "testing" in C7 was actually the hinge becoming fluid (C5).
          *   Cost: Needs careful phrasing to avoid implying hinges *can* be evidentially tested while they are hinges.

      *   *Severity 3: The Skeptic's Status (C4 + C6).*
          *   Conflict: C4 says the skeptic has no thesis (dissolved). C6 says the denier is wrong.
          *   Why severe: If there's no thesis, there's nothing to be wrong *about*.
          *   Fix: Distinguish "philosophical skeptic" (C4) from "real-world denier" (C6).
          *   Cost: Nuance.

  5.  **Identify Apparent Tensions:**
      *   *C1 vs. C5:* C1 says they are the framework. C5 says they change.
      *   *Dissolution:* Frameworks aren't eternal; riverbeds shift. This is standard On Certainty. No real tension if "framework" is understood dynamically.
      *   *C2 vs. C4:* C2 says doubt needs grounds. C4 says skepticism is dissolved.
