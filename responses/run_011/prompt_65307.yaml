      *   *C3 vs. C7:* C7 calls the relative's change "rational persuasion." C3 says the relation to hinges is *practical*, not epistemic. If it's not epistemic, can the change be *rational* in the standard sense? Or is it just psychological exhaustion?
      *   *C4 vs. C6:* C4 says skepticism is dissolved (no thesis). C6 says the denier is wrong. If there's no thesis to be false, how can they be wrong? (Similar to C3/C6).
      *   *C2 vs. C5:* C2 says doubt needs grounds. C5 says hinges can become fluid. If a hinge becomes fluid, does it suddenly require grounds? How does the transition happen without a moment of global doubt?
