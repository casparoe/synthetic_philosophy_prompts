      *   *C4 (Dissolution):* Skepticism dissolved, not refuted. Ordinary knowledge remains intact (warrant doesn't travel through hinges).
      *   *C5 (Fluidity):* Hinges change over time/community. Hardening/fluidity.
      *   *C6 (Normativity):* Deniers aren't epistemically wrong (no evidence mishandled) but are *wrong* nonetheless. Entitled to criticize/pressure them.
      *   *C7 (Case Study):* Relative's conspiracy theory. Argument failed. Acting within framework worked. Relative changed mind due to "unliveability" and "self-dissolution." User calls this "rational persuasion."

  3.  **Identify Tensions (Brainstorming):**
