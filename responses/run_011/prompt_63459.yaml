      *(Refining the LLM specific)*: LLMs are different from Otto's notebook. Otto's notebook is trusted memory. LLM is a generator. This makes "endorsement" crucial. I need to highlight this in the "Functions as a process" section for each relevant item.

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is a numbered menu of distinct interpretations of the Parity Principle (PP), designed for distribution at your seminar. Each entry isolates a specific philosophical reading of the principle, evaluates its status, determines its implications for the LLM case, and analyzes the "functions as a process" condition.

  ### 1. The Linguistic Stipulation Reading
  *   **The Proposition:** The PP is a definitional decree: we *define* the word "cognitive" to extend to external tools whenever they match internal processes functionally.
  *   **Classification:** **Trivial.** (It is analytically true by fiat, but the critic is right: it proves nothing about the world, only about how we choose to use a label.)
  *   **Verdict on LLM:** **Delivers the conclusion only by brute force.** If the seminar accepts the stipulation, the LLM is cognitive. If they reject the stipulation (arguing "cognitive" implies "intracranial"), the argument fails.
  *   **"Functions as a Process":** **Consultation suffices.** Under a pure stipulation, the bar is low. If you define "looking up a word" as cognitive because "recalling a word" is cognitive, the mechanism of lookup (trust, integration) matters less than the functional output match.

  ### 2. The Conceptual Engineering Reading
  *   **The Proposition:** The PP is a proposal for *conceptual revision*. Our current concept of "cognitive" is parochial (skin-skull bound); we *ought* to revise it to track functional roles rather than biological location to better serve scientific explanation.
  *   **Classification:** **Substantive but Defensible.** (It is not a truth-claim about current usage, but a pragmatic claim about future utility. It avoids the "trivial" objection by admitting it is a proposal, and avoids the "idle" objection by offering a reason for the change.)
  *   **Verdict on LLM:** **Conditional.** It delivers the conclusion only if the seminar agrees that extending the concept aids explanation. Given LLMs are probabilistic generators rather than static storage (like Otto's notebook), one might argue revising the concept to include them dilutes the explanatory power of "cognition."
  *   **"Functions as a Process":** **Requires Integration.** To justify the conceptual revision, the external resource must play a role *indistinguishable* from internal belief. Mere consultation is likely insufficient; the user must treat the output with the same immediate reliance as endogenous memory (endorsement).

  ### 3. The Metaphysical Functionalist Reading
  *   **The Proposition:** The PP is an ontological claim derived from functionalism: cognitive *kinds* are individuated by causal role, not physical substrate. The principle is a test to reveal where cognition *already is*, not where we should say it is.
  *   **Classification:** **Substantive but Defensible.** (This is the standard Clark & Chalmers reading. It claims the world is such that location is irrelevant to mental constitution.)
  *   **Verdict on LLM:** **Debatable.** It delivers the conclusion only if the LLM interaction is functionally isomorphic to an internal process. Critics may argue LLM interaction involves a different causal topology (e.g., latency, probabilistic generation vs. retrieval) that breaks the isomorphism.
  *   **"Functions as a Process":** **Requires Endorsement and Trust.** For the metaphysics to hold, the coupling must be tight. If the colleague critically evaluates every LLM output, the LLM is merely an input source (like a book), not part of the process. To be part of the *system*, the output must be automatically endorsed (the "Glue and Trust" conditions).

  ### 4. The Epistemic Heuristic Reading
  *   **The Proposition:** The PP is not a definition or a metaphysical law, but a methodological rule of thumb: *Start by assuming* external functional equivalents are cognitive, unless there is a specific reason to deny it. It shifts the burden of proof.
  *   **Classification:** **Substantive.** (It is a claim about evidential standards, not meaning or metaphysics.)
  *   **Verdict on LLM:** **Does not deliver the conclusion definitively.** It suggests the LLM *should be treated* as cognitive for the sake of investigation, but allows that further evidence might disqualify it. It keeps the discussion open rather than ending it.
  *   **"Functions as a Process":** **Requires Robust Coupling.** As a heuristic, we look for signs of integration. Constant consultation suggests coupling, but if the colleague treats the LLM as an oracle to be questioned rather than a memory to be accessed, the heuristic suggests looking elsewhere for the cognitive boundary.

  ### 5. The Impossible Counterfactual Reading
  *   **The Proposition:** The PP relies on the counterfactual: "were it done in the head." For LLMs, this antecedent is false. No human head can function as a transformer architecture with billions of parameters. Therefore, the condition cannot be met.
  *   **Classification:** **False (as a dismissal of PP) / True (as a limitation).** (It is false to say this invalidates EMT generally, but true that it limits PP's application to *this specific case*.)
  *   **Verdict on LLM:** **Denies the conclusion.** If the internal counterpart is impossible, the Parity Principle cannot be triggered. The LLM is doing something *sui generis* that has no internal analog, so parity cannot be established.
  *   **"Functions as a Process":** **N/A.** The condition "functions as a process... were it done in the head" fails. The LLM is not functioning as a process we *could* have in our heads; it is functioning as an oracle we *cannot* be.

  ### 6. The Process-vs-Output Distinction Reading
  *   **The Proposition:** The PP specifies "functions as a **process**," not "produces an **output**." Consulting a tool to get an answer is not the same as the tool performing the cognitive operation itself.
  *   **Classification:** **Substantive.** (This highlights a category error in applying PP to generative AI.)
  *   **Verdict on LLM:** **Denies the conclusion.** The colleague is using the LLM to *generate* premises, not as a vehicle for *processing* premises she already holds. The cognition lies in the prompt engineering and the evaluation of the result, both of which are internal.
  *   **"Functions as a Process":** **Requires Integration into the Flow.** For the LLM to be part of the *process*, it must be transparently woven into the reasoning stream (e.g., auto-completion of thoughts). If the colleague stops, reads, evaluates, and then types again, the LLM is an interlocutor, not a component. "Consultation on demand" is insufficient; it requires seamless operational integration.

  ***

  ### Summary for the Seminar
  *   **To answer the "Stipulation" Objection:** Move the discussion from **Reading 1** (Trivial) to **Reading 2 or 3** (Substantive). The Parity Principle is not just about words; it is about whether functional role constitutes mental states.
  *   **To answer the "Idle" Objection:** If it is substantive (Reading 3), it is not idle; it makes a falsifiable claim about the metaphysics of mind.
  *   **To address the LLM specifically:** Focus on **Reading 5 and 6**. Even if we accept Extended Mind generally, the specific architecture of an LLM (probabilistic generation vs. memory retrieval) and the mode of use (consultation vs. transparent coupling) may fail the "functions as a process" condition required by **Reading 3**. Mere consultation is likely insufficient; **endorsement and integration** are required to satisfy the parity condition.
