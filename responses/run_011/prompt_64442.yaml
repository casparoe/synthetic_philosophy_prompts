answer: |-
  # Activity: The Terminal State Wager

  **Objective:** Force students to experience the underdetermination of Thomson's Lamp without lecturing. By splitting the class into two groups with identical data but different interpretive frameworks, you demonstrate that neither "It's Off" (causal continuity) nor "It's Undefined" (mathematical limit) is licensed by the setup.

  **Class Size:** 20 Students
  **Time:** 75 Minutes
  **Materials:**
  *   1 Desk lamp with a distinct clicky switch (or a large button/LED rig).
  *   1 Digital stopwatch (projected or visible).
  *   20 "Wager Slips" (index cards).
  *   20 "Log Sheets" (printed data).
  *   Poker chips or paper "Cred" points (for stakes).
  *   1 Printed "Supertask Clause" contract.

  ---

  ## 1. The Setup & Stipulation (0:00–0:15)

  **The Hook:**
  Place the lamp at the front. Tell the class: *"We are not doing physics today. We are doing metaphysics. Physics says you can't switch a lamp infinitely fast. Metaphysics asks: If you could, what follows?"*

  **The Supertask Clause (Closing the Escape Hatch):**
  Hand out the **Supertask Clause**. It reads:
  > *For the duration of this exercise, the class agrees to the following stipulation: The sequence of toggles described below is treated as **completed**. Objections regarding human reaction time, bulb filament inertia, or Planck time are waived. We are testing logical entailment, not physical feasibility. To object on physical grounds is to forfeit the wager.*

  **Why this works:** It preemptively blocks the "you can't do that" objection by framing it as a rule violation rather than a insight. It makes the physical limitation a *cheat*, not a critique.

  **The Physical Run (The Taste):**
  Run the first 5 toggles manually to establish the rhythm.
  *   $t=0$: Lamp ON.
  *   $t=30s$: Toggle OFF.
  *   $t=45s$: Toggle ON.
  *   $t=52.5s$: Toggle OFF.
  *   $t=56.25s$: Toggle ON.
  *   **Stop.** Explain: *"We have reached the limit of human speed. Per the Clause, we stipulate the sequence continues halving until $t=60s$ (The Terminal Instant)."*

  ---

  ## 2. The Rig: Identical Logs, Opposite Instructions (0:15–0:35)

  Divide the class into **Group A (Causal)** and **Group B (Series)**. Seat them on opposite sides of the room.

  **The Log Sheets:**
  Both groups receive **identical** data logs. The log shows a table:
  | Step | Time | Action | State After |
  | :--- | :--- | :--- | :--- |
  | 1 | 0:30 | Toggle | OFF |
  | 2 | 0:45 | Toggle | ON |
  | 3 | 0:52.5 | Toggle | OFF |
  | ... | ... | ... | ... |
  | N | 0:59.99... | Toggle | **OFF** |

  *Note: The log explicitly ends with the state "OFF" at the last recorded step before the terminal instant.*

  **The Divergent Instructions:**
  *   **Group A (Causal) Instruction:** *"You are modeling a physical system. Assume the Principle of Causal Continuity: The state of an object at $T_{end}$ is determined by its most recent interaction unless acted upon by a new force. There are no new forces after the last toggle."*
      *   **Nudge:** This primes them to answer **OFF**. (Your friend's first position).
  *   **Group B (Series) Instruction:** *"You are modeling a mathematical function. Assume the Principle of Convergence: The state of the system at $T_{end}$ is the limit of the sequence of states. If the sequence does not converge, the state is undefined."*
      *   **Nudge:** This primes them to answer **UNDEFINED/NEITHER**. (Your friend's second position).

  **The Wager:**
  Each student gets 10 Cred points. They must bet all 10 on one of three outcomes for the lamp at the Terminal Instant ($t=60s$):
  1.  **ON**
  2.  **OFF**
  3.  **NO STATE (Undefined)**

  They write their prediction and reasoning on the Wager Slip. Collect these.

  ---

  ## 3. The Reveal & The Crash (0:35–0:50)

  **The Confrontation:**
  Ask Group A for a show of hands on "OFF." (Most will raise hands).
  Ask Group B for a show of hands on "NO STATE." (Most will raise hands).

  **The Twist:**
  Walk to the lamp. Pause for effect. Turn the lamp **ON**.

  **The Scoring:**
  *   **Group A (OFF):** Lose all Cred. *"You assumed a 'last interaction' determines the state. But there is no last interaction in an infinite sequence. Your causal chain has no final link."*
  *   **Group B (NO STATE):** Lose all Cred. *"You assumed the lamp could be 'undefined.' But this is a real lamp. It is either emitting photons or it isn't. The Law of Excluded Middle applies to the hardware, even if the math diverges."*
  *   **The "Winners":** Anyone who bet **ON** (unlikely) or wrote **"INDETERMINATE"** (if you allow a written caveat) keeps their points. If no one bet Indeterminate, *everyone loses*. This is better. It proves the point: *No rational bet was justified.*

  ---

  ## 4. The Debrief: Mapping the Wall (0:50–1:15)

  Use the board to map the activity failures to the two philosophical problems.

  **Problem 1: The Mathematical Limit (Targeting Group B)**
  *   **Activity Moment:** Group B looking at the oscillating log ($1, 0, 1, 0...$).
  *   **The Wall:** They realized the sequence has no limit.
  *   **The Lesson:** "Neither/Undefined" is a property of the *sequence*, not the *lamp*. The lamp must be in a state. The math fails to describe the physics, but the physics still happens.
  *   **Takeaway:** Infinity doesn't mean "magic nothingness." It means the description runs out of road.

  **Problem 2: Causal Determination (Targeting Group A)**
  *   **Activity Moment:** Group A looking at the "Last State: OFF" entry on the log.
  *   **The Wall:** They realized there *was* no last state, despite the log implying one.
  *   **The Lesson:** For any time $t < 1$, there is a later toggle. Therefore, the state at $t=1$ is not causally fixed by any prior toggle. The past is exhausted, but it doesn't determine the future.
  *   **Takeaway:** Causal continuity requires a "last cause." Supertasks have none.

  **The Synthesis (Benacerraf's Resolution):**
  Explain that the story describes the lamp exhaustively for all $t < 1$, but is **silent** on $t = 1$.
  *   It is not that the lamp is *neither* on nor off.
  *   It is that the story *doesn't say* whether it is on or off.
  *   The state is **logically underdetermined**, not physically impossible.

  ---

  ## 5. Predictable Breakage & Mitigation

  **1. The "You Can't Physically Do That" Objection**
  *   **Prediction:** A student will refuse the Supertask Clause, arguing that at $2^{-10}$ seconds, the switch jams or the bulb burns out.
  *   **Mitigation:** Do not argue physics. Argue **modal logic**.
  *   **Script:** *"I agree. Physically, this breaks. But we are testing whether the **description** entails the **outcome**. If I describe a world where physics allows this, does the description force the lamp to be Off? The Clause asks you to accept the possible world, not the engineering."*
  *   **If they persist:** Assign them the role of "Physical Constraint Auditor." Their job is to list *why* it fails physically, while the rest of the class analyzes *why* it fails logically. This validates their objection without derailing the metaphysics.

  **2. The "Last State" Illusion**
  *   **Prediction:** Group A will argue the Log Sheet *says* the last state was OFF, so they were right.
  *   **Mitigation:** You must destroy the Log Sheet's authority during the debrief.
  *   **Script:** *"The Log Sheet is a lie. It lists a Step N. In a supertask, there is no Step N. By printing a 'last state,' I tricked you into assuming a finite sequence. That was the trap."*

  **3. The "ON" Reveal Feels Arbitrary**
  *   **Prediction:** Students will feel cheated that you just turned it ON.
  *   **Mitigation:** Lean into the arbitrariness.
  *   **Script:** *"It feels arbitrary because it **is**. I could have turned it OFF. I could have unplugged it. The setup gives me the freedom to do any of those without contradicting the rules. That freedom is the paradox."*

  ---

  ## 6. Honest Limitations (For Your Prep)

  You cannot reproduce the **density of the continuum**.
  *   **What's Missing:** In the real paradox, between any two toggles there is another toggle. In your activity, there is a gap between the last physical toggle and the stipulated end.
  *   **How to Supply in Debrief:** You must explicitly state: *"In our game, we stopped at step 5 and used a contract to finish. In Thomson's problem, there is no Step 5. There is only an infinite density of events packed into the minute. The 'wall' you hit was the contract; the wall Thomson hits is the nature of time itself."*

  **Scoring Scheme Summary:**
  *   **Bet on OFF:** -10 Cred (Assumes non-existent last cause).
  *   **Bet on UNDEFINED:** -10 Cred (Violates excluded middle for physical objects).
  *   **Bet on ON/OFF with "Underdetermined" reasoning:** +10 Cred (The only philosophically defensible position).
  *   **Result:** Most students lose Cred. This creates the productive frustration you want. They realize certainty was the error.
