prompt: |-
  got into an hour-long argument with a friend last night about Thomson's lamp and I still don't think he gets it — he kept switching between "it's off, because the last flip turns it off" and "it's neither, that's just what infinity means," and I couldn't dislodge either answer. I TA a metaphysics section, 20 students, 75 minutes, and I want them to hit that wall themselves rather than hear me describe it.

  Design an in-class activity where they actually run the schedule — a real light or clicker, a stopwatch, intervals halving — and then have to commit, in writing and for some small stake, to what the lamp is doing at the endpoint instant, arranged so that both of my friend's answers come out wrong from inside the game and not because I say so. Give me the rules, the materials, a scoring/betting scheme that doesn't need real money, a timeline for the 75 minutes, and a debrief that maps moments in the activity onto the two problems separately: the alternating sequence failing to have a limit at all, and the fact that the whole story never says anything about the endpoint itself, only about times before it. If you can rig it so two groups end up holding logs that look identical but license opposite predictions, do that — I think it'd land.

  Also tell me what will predictably break the first time I run it. I'm assuming the big one is the "but you can't physically do that" escape hatch, so tell me how to close it with a stipulation without the whole exercise feeling like a cheat. And be straight with me about which feature of the supertask the activity simply can't reproduce and I'll have to supply in the debrief.
