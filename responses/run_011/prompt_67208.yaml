prompt: |-
  So there's this result in decision theory — Good's theorem I think — that says a rational agent should always accept evidence offered to them for free, because acting on more information can only ever raise your expected utility, or something along those lines. I've been chewing on it and I'm not sold. My intuition is the whole thing only works if you quietly assume you'll respond sensibly *afterwards*, and there's plenty of real cases where you wouldn't — my uncle would refuse a free test for an inheritable disease precisely because he knows the result would wreck him whichever way it comes out. And the usual reply, that a future you who acts myopically just doesn't meet the assumptions so the theorem isn't refuted, feels like it's smuggling in the conclusion.

  Give me your actual credence — a number — in this claim: Good's theorem survives, in the sense that every apparent counterexample either has hidden costs baked in, or involves a future self who isn't doing expected-utility maximisation. But I want the decomposition more than the number. Break it into the sub-questions: how much hangs on EU maximisation being the right account of rationality at all, how much on whether cases like my uncle's really count as free and relevant information, how much on whether you're allowed to assume the future self responds rationally, plus whatever other factor belongs in there that I haven't listed. A rough probability and one line of justification for each, then how they combine into your headline number. Finish by saying which factor your number is most sensitive to, which one you're least confident about, and what kind of argument or evidence would move it.
