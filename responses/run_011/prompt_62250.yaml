answer: |-
  This is a sophisticated set of intuitions. You have effectively identified the friction between *consequentialist* reasoning (what outcome does this cause?) and *non-consequentialist* reasoning (what kind of person does this make me, or what rules am I following?). Most students stop at the realisation that "making no difference" is a hard problem; you have moved on to mapping the inconsistencies in your own moral psychology. That is excellent EPQ work.

  You have asked for a principle derived from your verdicts, not from the literature. Based on the patterns in your cases, your moral reasoning does not follow a single metric (like "harm caused"). Instead, it follows a hybrid model that weighs **Civic Duty**, **Direct Complicity**, and **Salience of Harm**.

  Here is the principle that best systematises your verdicts, followed by the analysis you requested.

  ### The Principle of Complicit Participation

  **An individual act is morally wrong if it satisfies one of the following three conditions, regardless of whether it causally determines the outcome:**

  1.  **The Duty of Membership Clause:** The act is an omission of a required participation in a cooperative practice essential to the community's functioning.
      *   *Motivating Verdict:* **School Council Vote (V1).** You feel voting is a moral failure even when causally impotent because it is a duty of membership in the school community.
      *   *Motivating Verdict:* **Petition (V6).** You feel signing is better than refusing, as it affirms membership in a collective voice, even if less binding than a vote.

  2.  **The Direct Complicity Clause:** The act involves direct engagement with or consumption of a harmed entity, rather than indirect contribution to a harmful system.
      *   *Motivating Verdict:* **Meat vs. Flying (V9).** You judge the meat-eater harsher than the flyer because eating meat is direct engagement with the animal's death, whereas flying is an indirect contribution to emissions.
      *   *Motivating Verdict:* **Supermarket Chicken (V2).** Buying the chicken is wrong because it is a direct transaction with the industry of rearing, even if batches buffer the causal link.

  3.  **The Salient Threshold Clause:** The act is visibly proximate to triggering a specific harm, or completes a perceptible increment of harm, making the agent's contribution distinct from the background noise.
      *   *Motivating Verdict:* **Last Two Portions (V4).** This is wrong because the link between purchase and restocking is visible and probable.
      *   *Motivating Verdict:* **Perceptible Harm (V8).** The 1,000th person is worse because their contribution crosses the threshold from imperceptible to perceptible.
      *   *Motivating Verdict:* **Lights/Charger (V7).** You judge the lone pupil in a school of wasters as "just as wrong" because they are actively participating in the waste, satisfying the Complicity clause, even if the Threshold clause is blurred.

  **Exceptions:**
  *   **The Expressive Permission:** Symbolic acts performed to affirm virtue are permissible even if causally null, provided they are not deceptive.
      *   *Motivating Verdict:* **Reusable Cup (V10).** You resent the claim it is "only to feel good" because the expression of intent has value independent of the carbon saved.
  *   **The Imprudence Distinction:** Acts where the probability of impact is low and the link is abstract are merely wasteful, not wrong.
      *   *Motivating Verdict:* **Donation Target (V5).** This is a waste, not a moral failure, because the threshold is abstract and unlikely to be met.

  ---

  ### Application to New Cases

  **1. The End-of-Year Trip (Coach vs. Train)**
  *   **The Case:** Coach (fixed capacity, spare seats) vs. Train (potential extra carriage).
  *   **Your Intuition:** Coach is permissible; Train is not obviously permissible.
  *   **Analysis:** You remark that this "looks backwards if marginal emissions are what matters." I must correct you: your intuition here is actually *more* consistent with marginal thinking than you realise. If the train adds a carriage based on bookings, your ticket carries a non-zero probability of triggering high emissions. The coach, being hired regardless, has a marginal emission of zero for your seat.
  *   **Verdict under Principle:** This falls under the **Salient Threshold Clause**. The train booking has a visible mechanism for expansion (the extra carriage), making the risk salient (like the Restocking case). The coach is a fixed cost (like the Donation case, but with zero marginal harm). Your principle permits the coach and questions the train.
  *   **Tension:** Note that this contradicts your **Duty of Membership** logic on voting. In voting, you accept a duty despite zero marginal impact. In the trip, you reject the risk despite low marginal impact. This suggests you are more consequentialist about environmental harm than about civic duty.

  **2. "I am only one person"**
  *   **Analysis:** Under your principle, this statement is **never a legitimate excuse** for violations of the Duty of Membership or Direct Complicity clauses.
  *   **Verdict:** It is a true statement, but morally irrelevant for the School Vote (V1) or the Meat-eating (V9). The principle holds that participation in the wrong (or the duty) binds the individual regardless of the crowd.
  *   **Exception:** It *may* serve as an excuse under the **Salient Threshold Clause** if the probability is vanishingly small (like the Donation case V5), shifting the verdict from "wrong" to "imprudent." But it does not exonerate.

  **3. The General Election**
  *   **Analysis:** This maps directly onto the **School Council Vote (V1)**.
  *   **Verdict:** The principle requires you to vote. The margin of victory (214 votes vs. millions) is irrelevant under the **Duty of Membership Clause**. To abstain because your vote won't change the result would be to misunderstand the act as purely causal rather than participatory. If the school vote is a duty, the general election is a fortiori a duty of national membership.

  ---

  ### Which Verdict Must Go?

  You asked for honesty: one of your verdicts is the "weakest link" that makes your principle baroque. You should abandon the verdict on the **Dead Fish (V3)**.

  *   **The Verdict:** You stated buying the dead fish is "at least as wrong as the chicken, and possibly worse."
  *   **Why it must go:** This contradicts the logic of your **Direct Complicity Clause**.
      *   With the **Chicken**, your purchase signals demand to the industry, influencing future batches (even if delayed). There is a causal thread, however thin.
      *   With the **Dead Fish**, the harm is "sunk." The bird is reared; the fish is caught. Buying the fish does not signal demand for *more* fishing in the same way buying chicken signals demand for *more* rearing.
      *   To claim the fish is *worse* relies on an emotional reaction to the visible corpse (the "yuck factor") rather than a consistent ethical principle. If you keep this verdict, you must add a clause about "Visceral Disgust" overriding "Causal Logic," which undermines the rest of your project.
      *   **Recommendation:** Conclude that the fish is *less* wrong than the chicken. The chicken supports the system; the fish merely clears the inventory of a completed harm. Abandoning this allows your **Direct Complicity Clause** to remain clean.

  ---

  ### Does "Expected Harm" Resolve the Problem?

  Recasting the problem in terms of **Expected Harm** (Probability × Impact) **relocates the problem rather than resolving it.**

  *   **How it helps:** It solves the **Salient Threshold** cases. It explains why the "Last Two Portions" (V4) is wrong (high probability of restock) while the "Donation" (V5) is merely wasteful (low probability of success). It mathematically justifies the Train vs. Coach intuition.
  *   **How it fails:** It cannot explain your **Duty of Membership** or **Expressive Permission** verdicts.
      *   **Voting (V1):** The expected harm of not voting is effectively zero. Expected Harm theory says abstaining is permissible. You say it is a moral failure.
      *   **Reusable Cup (V10):** The expected harm saved is zero. Expected Harm theory says the act is pointless. You say it has value.
      *   **Meat vs. Flying (V9):** If both have zero expected impact (as you posit), Expected Harm theory says they are morally equivalent. You say Meat is worse.

  Therefore, Expected Harm is a useful tool for the environmental cases, but it is the wrong tool for the civic and symbolic cases. Using it would force you to abandon your intuitions on Voting and the Cup, which seem central to your moral identity.

  ### Summary for your EPQ

  Your research suggests that human moral reasoning is not unitary. You are not trying to find a single "master principle" that saves every intuition, because your intuitions themselves draw from different ethical traditions.
  1.  **Civic acts** are judged by **Deontology** (Duty/Rules).
  2.  **Environmental acts** are judged by a mix of **Consequentialism** (Thresholds/Probability) and **Virtue Ethics** (Complicity/Character).
  3.  **The Fish verdict** is an outlier driven by emotion, not principle.

  In your conclusion, you should argue that the question "Can an individual act be wrong when it makes no difference?" presupposes that "wrongness" depends on "difference." Your own verdicts prove that for you, wrongness often depends on **participation, duty, and integrity**, not just outcome. The tension you feel is not a failure of your reasoning, but a accurate map of the complexity of moral life.
