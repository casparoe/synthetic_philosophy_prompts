  The vision lab hummed, a low-frequency thrum competing with the click of the subject's response box. Behind the one-way glass, Marisol and Dev watched the monitor trace the trial sequence. On screen, a green dot flashed left, then a red dot flashed right. The subject, separated by soundproofing and distance, reported seeing a single dot move across the gap and change color mid-path.

  "Condition A starts now," Dev said, tapping his clipboard. "White noise burst after the green dot, plus the counting-backward task. Eight hundred milliseconds of cognitive jamming before the red dot even fires."

  Marisol crossed her arms. "This is the kill shot for the illusion. If the subject reports motion here, I'll eat my hat. The noise and the counting disrupt the consolidation process. The memory revision machinery gets jammed. They should report exactly what happened: a stationary green dot, then a stationary red one."

  "You're assuming the revision happens *after* the experience," Dev countered, eyes on the latency data scrolling on the secondary monitor. "On my view, the reconciliation is finished before anything is experienced at all. The brain constructs the narrative of motion and color change pre-consciously. Messing with working memory via counting backward can't reach back into the past to alter what was already broadcast to consciousness. I predict literally no change in the reports."

  "So you think the subject sees the illusion even while their working memory is being scrubbed?"

  "I think the experience is the final draft. You're treating consciousness like a live feed that gets edited in post-production. I'm saying consciousness is the screening room. By the time the lights come up, the movie is already cut."

  "Condition B is up," Marisol said, ignoring the metaphor. "The probe trials. Dim flash on the illusory path. They just hit a key for detected or not detected. No verbal report until the end of the block."

  "Fast keypress," Dev noted. "Sub-second."

  "If that keypress is driven by the illusory content," Marisol said, "then the illusion is robust. But if you claim that button press wasn't mediated by consciousness anyway, you're draining the whole dispute of content. You can't just relegate the hard data to the unconscious whenever it inconveniences your timeline."

  "And if you claim the keypress is a readout of a veridical experience that gets overwritten later," Dev shot back, "you're positing a ghost event. A experience that exists but is immediately annihilated. How is that different from saying it never happened?"

  They watched the subject hit the key. The trial logged a 'detected.'

  "Here's the thing, Dev," Marisol said, turning from the glass. "Look at the neural data. Look at the latencies. We agree on every spike in V1, every latency in V4, every motor output the subject produces. We agree on the physics of the stimulus and the statistics of the report. What is actually left to disagree about? Is this a real difference, or just a quarrel over where the word 'experience' gets pinned on the causal chain?"

  Dev sighed, rubbing his temples. "It's not just semantics. It's about causal efficacy. If the content is settled before broadcast, then consciousness is a consumer, not a constructor. If it's settled after, consciousness is a naive recipient that gets gaslit by memory. That changes how we model the function of awareness."

  "But to make that distinction," Marisol pressed, "you need a cutoff. A finish line. You need a moment where the draft becomes final. That's the Ledger Problem. Whichever cutoff you posit—a freeze on memory revision for me, a broadcast deadline for you—it starts to look exactly like the Cartesian Theater wearing a trenchcoat. You're both smuggling in a place where the 'self' looks at the data and says 'done.'"

  Dev stiffened. "My broadcast deadline isn't a seat in a theater. It's a functional threshold. When information becomes globally available for verbal report and rational control, that's the line. It's not a magical moment; it's a systems constraint."

  "And my memory consolidation window isn't a theater either," Marisol fired back. "It's a physiological process. Hippocampal-cortical dialogue takes time. If you interrupt it, the record stays raw. That's not a homunculus checking a ledger; it's a buffer overflow."

  "Then why," Dev asked, "does your buffer have to look so much like a screen? You say the subject *really* had an accurate experience of a stationary green dot. Where was it? If it wasn't accessible for report, action, or memory, in what sense did it exist? You're positing an experience that makes no difference to the world. That's epiphenomenalism with extra steps."

  "And you're positing a construction process that happens in the dark," Marisol retorted. "You say the mid-path color change was genuinely seen. But if the brain hasn't finished integrating the red dot signal when the 'seeing' happens, how is it seen? You're saying the brain lies to consciousness before consciousness even opens its eyes."

  "Okay," Dev said, holding up a hand. "Let's talk about Condition C. The titration. We shrink the spatial gap until the motion percept snaps in."

  "Right. The threshold."

  "Here's the question: Does the color-change report cross its threshold on the same step as the motion report?" Dev leaned against the console. "If those two come apart—if they see motion before they see the color change, or vice versa—what does each of them owe?"

  "If they dissociate," Marisol said slowly, "it suggests binding is gradual. That helps me. It means different features are settled at different times. If motion locks in early but color waits for the second dot, I can say the memory revision is feature-specific."

  "But if they lock in simultaneously," Dev said, "it suggests a unified construction event. A single package deal. That favors the Stalinesque view. The brain waits until it has enough info to render the whole scene."

  "Alright," Marisol said. "I'll play. If the titration shows that motion and color thresholds are perfectly synchronized across subjects, down to the millisecond, I switch sides. That would imply a unified broadcast event, not a staggered consolidation. I can't explain perfect synchrony with independent memory revisions."

  "Fair," Dev nodded. "For me, if the interference task in Condition A *does* collapse the report to veridical stationary dots, I have to concede. If jamming working memory kills the illusion, then the illusion depends on post-stimulus processing. I can't claim the content was settled pre-experience if messing with memory changes the experience."

  "That's a genuine concession," Marisol noted. "You're admitting that if memory is involved, your 'pre-conscious construction' line blurs."

  "I'm admitting that if the data shows post-stimulus dependency, my timeline is wrong," Dev corrected. "But I still won't defect to Multiple Drafts. I won't say there's no experience. I just say the experience is later than I thought."

  "And I won't say there's no revision," Marisol added. "I'll just say the revision happens faster than I thought. But we stay in our camps."

  "Because if we don't," Dev said, looking back at the subject through the glass, "then we're just describing neural latency curves and calling it philosophy. We need the cutoff. Even if it is a trenchcoat."

  "Even if it is," Marisol agreed. "Because without it, we can't say when the light turns on."

  The subject finished the block. The monitor chimed. They both leaned in to check the logs, neither willing to blink first.
