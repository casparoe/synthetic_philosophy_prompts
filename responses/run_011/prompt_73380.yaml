answer: |-
  **Project Title:** The Bootstrap Residue: Self-Description and the Location of Meaning

  **Introduction and Research Question**

  Standard models of communication often triangulate meaning between a message, a frame, and a decoder. Drawing on Douglas Hofstadter's framework in *Gödel, Escher, Bach*, we might distinguish the physical inscription (outer message), the formatting rules (frame), and the semantic content (inner message), all activated by a decoder. The familiar interactionist conclusion is that meaning resides in the combination of these elements. However, this conclusion obscures a sharper question regarding self-describing artifacts. Some carriers include their own decoding instructions: a file header declaring its format, a musical score with performance directions, or a text explaining how it is to be read. In such cases, the artifact attempts to supply its own frame. Yet these instructions must themselves be read, requiring capacities the artifact does not supply. I call what the artifact cannot supply, at any given level of self-description, the **bootstrap residue**.

  This project investigates the behavior of this residue as self-description deepens. My primary conjecture is that the residue stays constant in kind; even in the limit, an irreducible unframed step remains, preventing meaning from being wholly located in the artifact. A rival conjecture holds that the residue shrinks asymptotically, suggesting the interactionist picture overstates the decoder's contribution. A third possibility is that "how much the artifact supplies" is not a quantity, rendering both conjectures category mistakes. The correct reformulation might instead ask which features of successful decoding are counterfactually sensitive to the artifact. The research question driving this fellowship is:

  Does the semantic contribution required from a decoder diminish asymptotically as an artifact's self-descriptive depth increases, remain constant, or is the quantification of such contribution a category mistake?

  **The Gap in Existing Positions**

  Current philosophical positions leave this question unresolved because they operate at too high a level of abstraction. The code or conduit view locates meaning entirely in the message, ignoring the necessity of a frame. The interpretivist view locates meaning entirely in the decoder, ignoring the constraints imposed by the inscription. The structuralist view locates meaning in the frame, ignoring the need for interpretation. The interactionist view, which dominates contemporary philosophy of information, asserts that meaning arises from the combination of artifact and interpreter. While true, this compatibility is too broad. The interactionist claim is consistent with both limit behaviors: an interactionist can agree that meaning requires a decoder while maintaining that adding self-description reduces the decoder's load asymptotically, or that it does not.

  Because interactionism does not specify the *limit behavior* of self-description, it fails to distinguish between an artifact that merely collaborates with a decoder and one that nearly substitutes for one. Consequently, we lack a principled way to determine whether increased self-description genuinely transfers semantic labor from the mind to the object, or merely shifts the locus of interpretation to a higher level of abstraction. This project fills that gap by treating the distribution of semantic labor as an empirical-conceptual variable rather than a fixed metaphysical truth.

  **Methodology and Timeline**

  The method is constructive rather than exegetical or purely formal. I will build a finite ordered series of artifacts of increasing self-description, ranging from an unframed inscription to a maximal case attempting to teach its own base conventions from scratch. I will not rely on existing information-theoretic metrics alone, as mutual information gaps often conflate semantic residue with syntactic noise. Instead, I will state explicit candidate criteria for when something counts as supplied by the artifact rather than brought by the decoder. These criteria include: invariance across decoders with different histories, recoverability by a general-purpose learner without prior specific training, and counterfactual dependence of decoding success on artifact features.

  The twelve-month timeline is divided into three phases. Months one through four are dedicated to constructing the artifact series and refining the criteria. I will design inscriptions that embed framing instructions within the data stream, ensuring each level attempts to explain the decoding rules of the previous level. Month five serves as a critical decision point. I will test the initial criteria against the first two levels of the series. If the criteria prove unworkable or the artifacts fail to demonstrate distinct levels of residue, the project will be redirected. The redirect would involve abandoning the constructive series in favor of a conceptual analysis of the criteria themselves, using existing natural language examples rather than constructed artifacts.

  Assuming the constructive path remains viable, months six through ten will involve applying the criteria to the full series. I will analyze whether the residue measured by each criterion diminishes, remains constant, or fluctuates inconsistently. Months eleven and twelve will be dedicated to synthesizing these findings into a dissertation chapter and a companion article. This schedule ensures that if the constructive proof fails, there is sufficient time to pivot to a viable conceptual argument without jeopardizing the fellowship year.

  **Worked Example: The Delta Sequence**

  To define the bootstrap residue precisely, consider a simple artifact: a card displaying the string "Δ → 1". At Level 0, this is merely an unframed inscription. A decoder must bring the convention that symbols represent numbers and that the arrow indicates assignment. The residue includes the entire semantic framework of mathematical notation. At Level 1, we add a header: "Interpret symbols as values using the key below." The card now includes a key mapping "Δ" to "1". The residue shrinks slightly; the decoder no longer needs to know the specific value of Δ, but must still understand what a "key" is and how to apply a mapping.

  At Level 2, the artifact includes instructions for reading the key: "Match the shape on the left to the shape on the right." The residue now excludes specific mapping conventions but retains the requirement to understand spatial matching and identity. At Level 3, the artifact attempts to teach matching by showing pairs of identical shapes with a checkmark. Here, the residue is the understanding of what a checkmark signifies (correctness) and what identity consists in. Even if we add a Level 4 explaining the checkmark via neural reinforcement diagrams, the decoder must still understand the diagram. The bootstrap residue is defined as the set of cognitive capacities required to process the instructions at level *n* that are not themselves explained at level *n* or any lower level. This definition allows a reader to apply the concept to any artifact by isolating the unexplained primitives at the deepest level of embedded framing.

  **Outcomes and Philosophical Significance**

  A successful result will defend one of the three conjectures. Positive success involves demonstrating that the residue either remains constant or shrinks asymptotically according to the selected criteria. Negative success involves showing that the question is ill-posed because the criteria yield inconsistent results, supporting the category mistake conjecture. Failure would consist only in an inability to construct the artifact series or define the criteria coherently without yielding any conclusion about the limit behavior. Even a negative success is philosophically valuable, as it would demonstrate that the "location of meaning" cannot be quantified by self-descriptive depth.

  This is philosophy rather than information theory because it addresses the normative conditions of interpretation, not merely the statistical correlations of signal transmission. Information theory can measure uncertainty reduction, but it cannot determine whether a reduced uncertainty counts as *meaning* without presupposing a decoder's semantic capacities. Two objections are anticipated. First, a hostile examiner might claim the residue is simply Shannon's channel noise relabelled. This is incorrect: noise is random variation that degrades signal, whereas residue is the structural semantic necessity that enables signal recognition in the first place. Second, an examiner might argue this merely redescribes familiar rule-following worries about what fixes the application of a rule. While related, this project localizes the problem to information carriers. It asks not how rules are fixed generally, but whether the physical artifact can absorb the fixity through self-description.

  **Scope Assessment**

  The scope is realistic for a one-year fellowship. The primary risk lies in constructing the maximal case artifact that attempts to teach base conventions from scratch. If this proves logically impossible or too complex to model rigorously, I am prepared to drop the maximal case. The argument can proceed on the basis of the asymptotic trend observed in the earlier levels. If the residue does not shrink significantly in the first three levels, it is unlikely to vanish at the limit. Furthermore, if the criteria for "artifact-supplied" content prove too contentious, I will narrow the focus to counterfactual dependence alone, sacrificing breadth for precision. This ensures the project yields a defensible conclusion regarding the interactionist model even if the full taxonomy of criteria remains incomplete.

  \question{Does the semantic contribution required from a decoder diminish asymptotically as an artifact's self-descriptive depth increases, remain constant, or is the quantification of such contribution a category mistake?}
