answer: |-
  **I. The Asymmetry of Exercise: Visibility and Cost**

  The divergence between Royal Assent and King's Consent stems from the political cost of visibility and the nature of the interest being protected. Royal Assent operates in the register of the public constitution; its exercise is a binary, public act that signifies a rupture between the Crown and the Parliament. Because it occurs at the terminus of the legislative process, refusing assent nullifies the work of both Houses and the Government. The political cost is therefore catastrophic, rendering the power unusable except in a hypothetical emergency where the constitution itself is at stake. Consequently, infrequent use leads to atrophy; the power becomes mythologised rather than operational, its content indeterminate because it lacks the friction of regular application.

  King's Consent, conversely, operates in the register of private interest and administrative procedure. By framing the mechanism as a protection of the Crown's proprietary interests (revenues, duchies, personal property) rather than its political will, the stakes are lowered. It occurs at the drafting stage, hidden from public view. This allows for negotiation and compromise rather than binary acceptance or rejection. A bill can be amended to accommodate the Palace without the Government appearing to capitulate to royal interference.

  The underlying structural principle is that **routine, low-visibility exercise preserves the determinate content of a power, whereas rare, high-visibility exercise dissolves it.** A power used frequently becomes part of the administrative machinery; its boundaries are tested and defined through practice. A power reserved for emergencies becomes abstract, defined by theory rather than precedent. The "private interest" framing is crucial: it permits the Crown to act as a stakeholder rather than a sovereign, allowing it to influence legislation without appearing to govern. Thus, the power remains live precisely because it is mundane.

  **II. The Convention of Advice: Relocation rather than Neutralisation**

  The convention that the Sovereign acts on ministerial advice does not neutralise the power of King's Consent; it relocates it from the person of the Monarch to the interface between the Royal Household and the Civil Service. Normatively, the convention performs a masking function. It preserves the fiction of royal neutrality in public governance while permitting the reality of royal interest protection in private administration.

  It is coherent to maintain that the Monarch acts only on advice *and* that private concerns influence legislation, provided one distinguishes between the *decision* to consent and the *formation* of the bill. The advice tendered at the moment of consent is indeed to grant it. However, the convention allows the Palace to signal concerns during the drafting phase (the fourteen-day window). Ministers, wishing to avoid the embarrassment of a withheld consent or a public dispute, voluntarily reshape the bill. The advice is thus the ratification of a prior negotiation.

  The normative work of the convention is to depoliticise the Monarch's interests. If the Monarch were seen to demand changes, it would be a political act. By requiring Ministers to seek consent and offering that consent only on advice, the system ensures that any changes are technically Government decisions. The convention transforms a potential command from the Crown into a bureaucratic constraint on the Executive. It protects the monarchy from accusations of interference by ensuring that the Government can always claim it amended the bill because it *chose* to, not because it was *ordered* to.

  **III. Legal Power versus Procedural Courtesy**

  There is a paradox of robustness here: the legal power (Assent) is weaker in practice than the procedural courtesy (Consent). A legal power is entrenched and hard; it implies a right that exists independently of the legislature's will. Because it is so hard, it is brittle. To use it is to break the constitutional order. A procedural courtesy is soft; it exists only because the House allows it. Because it is soft, it is flexible. It can be adjusted, negotiated, and absorbed into daily practice without triggering a constitutional crisis.

  A self-imposed constraint behaves differently from a legally entrenched one because it relies on *comity* rather than *coercion*. Legally entrenched powers invite legalistic challenges and define clear battle lines. Self-imposed constraints rely on habit and mutual self-interest. Parliament maintains King's Consent because it is convenient; it avoids the awkwardness of passing legislation that the Crown might later find objectionable on proprietary grounds. It is a mechanism of conflict avoidance.

  This dynamic holds specifically because the constrained party is the Legislature. When the Legislature constrains itself, it retains the theoretical key to remove the constraint (by resolution). This retention of ultimate sovereignty makes the constraint safe to maintain. If the Executive were similarly constrained by a self-imposed rule it could revoke, it might be less stable, as the Executive is prone to claims of necessity. However, in this specific constitutional dyad, the Legislature's self-restraint regarding the Crown's private interests is more robust than the Crown's legal restraint regarding the Legislature's public will. The legal veto is a nuclear weapon that cannot be fired; the procedural courtesy is a speed bump that is constantly navigated.

  **IV. Generalisability of the Asymmetry**

  This asymmetry is not peculiar to monarchy; it recurs wherever constitutional systems distinguish between a "nuclear" option and administrative friction.

  In judicial review, for instance, the power to strike down legislation as unconstitutional is often the dramatic, rarely used equivalent of Royal Assent. In contrast, the power of interpretive avoidance—reading statutes narrowly to avoid constitutional conflict—is the quiet, constantly used equivalent of King's Consent. The former defines the outer boundary of the system but is dormant; the latter shapes the content of the system continuously.

  Similarly, in executive governance, the formal power of clemency or pardon is often a dormant reserve, while the discretionary power of prosecutors not to charge is the live, operative mechanism that determines outcomes. The structural pattern is consistent: powers that operate as final, public vetoes tend to decay into formality due to the high cost of their use, while powers that operate as preliminary, procedural hurdles retain operative content because they function as tools of management rather than weapons of war.
