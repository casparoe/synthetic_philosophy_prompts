prompt: |-
  Just spent most of the night arguing with a friend about the color phi illusion and we both came away annoyed. I say you've got to pick a side: either the brain stalls and waits for the second dot before it hands over the experience (the Stalinesque option), or it hands it over on time and quietly rewrites the memory afterwards (the Orwellian option). He says that's a fake choice because some views just deny there's any fact about what the experience was like prior to the report.

  Can you build me a decision tree that starts from "I accept the color phi data — the subject reports one dot crossing the screen and changing color partway, and the reported change point is earlier then anything the second stimulus could have caused" and ends at a named position about the timing of experience? Every branch node has to be a question someone could answer without already knowing which view it leads to — no "are you a multiple-drafts person?" nodes. Branch on things like whether the introspective report counts as evidence about the experience or is partly what constitutes it, whether experience has to be determinate at an instant or can be smeared across time, and whether "waiting for more input" is even a coherent thing to say about a brain.

  Put whatever views you think deserve leaves on it, including first-person operationalism and the plain Stalinesque delay story, and flag any pair of leaves your tree can't actually separate — I suspect his no-fact-of-the-matter view and the pure Orwellian one are going to come out the same. Mark any combination of answers that ends up empty and say why nobody lives there: incoherent, merely unattractive, or just unexplored. Then as a check, run one other temporal illusion through the tree afterwards (flash-lag or the cutaneous rabbit, your call) and tell me whether it sorts views differently than color phi does, and if so which branch is doing the different work.

  Last thing: say how confident you are in the sorting overall, and single out the one branch you'd be most embarassed to have gotten wrong.
