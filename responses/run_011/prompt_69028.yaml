      *   *Orwellian (Dennett's label for the alternative):* The brain generates the initial experience (Red dot), then B arrives, and the memory is retroactively edited. The experience happened "on time," but the memory is falsified.
      *   *Multiple Drafts/No-Fact-of-the-Matter (Dennett):* The distinction between Stalinesque and Orwellian is meaningless. There is no "Cartesian Theater" where experience happens at a specific time. There are only judgments/reports.
