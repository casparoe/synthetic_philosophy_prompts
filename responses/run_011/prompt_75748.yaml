      Good morning. There are two thousand of these notes on the table behind me. They look like money. They behave like money. But if you take one home and put it in a drawer, it is nothing but paper.

      My father spent forty years in banking. He taught me when I was eleven that almost none of the money in the world was ever metal in anyone's hands. He is right. He also tells me this scheme is Monopoly money. On that, I hope to prove him wrong, not by arguing, but by asking you to work.

      We are launching this currency based on an idea from the eighteenth century. George Berkeley, who became Bishop of Cloyne, wrote a pamphlet called the *Querist*. He asked why Ireland was poor when the land was fertile. His answer was not that we lacked gold, but that we lacked industry. He argued that money is not wealth. It is, in his phrase, "a ticket or counter". It is a tool to stir up labour. If the ticket does not move, the labour does not happen.

      That is why these notes carry a stamp. Every three months, you must buy a small stamp to keep the note valid. We do not do this to raise revenue. We do it because Berkeley insisted that smaller sums circulating quickly are equivalent to larger sums circulating slowly. If you hoard this note, it loses value. If you spend it, it gains purpose. We want them spent, not kept.

      There is a reserve at the credit union. Each note is redeemable one for one. But understand this: the reserve exists precisely so that nobody ever has to touch it. If everyone redeems their notes tomorrow, we have not succeeded. We have merely given people back their own money with extra steps. Success looks like the notes staying out here, changing hands for bread, for paint, for repairs.

      I know some of you are shopkeepers. You are wondering what to say when a customer hands you this instead of sterling. Here is the sentence: "Take this because it buys what you need sooner than waiting for the other kind." It is not about loyalty. It is about speed.

      If nobody spends them, the theory remains sound but the town remains idle. Berkeley thought appetite and fashion move people, not reason. He wondered if the legislature ought to make fashions to set industry going. We are attempting a small version of that. We are making a fashion for using these tickets. If the fashion fails, if the tickets stop moving, then we are simply drones with pretty paper. That is the consequence. It is not an embarrassment to the theory; it is a verdict on our industry.

      My father knows that banks run on confidence, but also on turnover. This is not about trust in each other's hearts. It is about trust in the transaction. If the note stops, the value stops.

      Look at Market Street. There are three empty units there. They have been dark for a long time. There is an old verse about the high tree being brought down and the dry tree made to flourish. I do not bring this to preach. I bring it because those shops are dry wood. They will not flourish because we feel good about them. They will flourish because someone uses them.

      These notes are not wealth. They are permission to work. They are a signal that there is labour to be done and goods to be swapped. If you take one, spend it. If you receive one, pass it on. Do not save it. Do not worship it. Use it to wake up the street.

      Let us see if we can make the dry tree flourish, not by wishing, but by trading.

