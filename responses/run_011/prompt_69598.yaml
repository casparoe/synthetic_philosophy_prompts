  **Leaf Commitments and Falsifiers**

  1.  **Szilard:** *Unwanted Commitment:* Perfect measurement without energy exchange is physically impossible even in principle. *Falsifier:* A measurement device is constructed that correlates with a particle's position without any detectable heat release or energy transfer to the environment.
  2.  **Classical Correlation:** *Unwanted Commitment:* Merely knowing the state of the gas reduces its entropy regardless of whether that knowledge is used. *Falsifier:* A system establishes perfect correlations between a register and a gas, yet the gas pressure remains unchanged until a feedback mechanism is physically engaged.
  3.  **Quantum/Entanglement:** *Unwanted Commitment:* Classical thermodynamics is insufficient to describe the demon, requiring quantum decoherence to explain the cost. *Falsifier:* A fully classical mechanical demon exhibits the exact same thermodynamic limits as a quantum system without any decoherence effects.
  4.  **Statistical:** *Unwanted Commitment:* The Second Law is not a strict prohibition but a probabilistic tendency that can be violated in individual instances. *Falsifier:* A single cycle is observed where work is extracted and the total entropy of the universe demonstrably decreases without any compensating fluctuation probability.
  5.  **Landauer-Bennett:** *Unwanted Commitment:* Logical irreversibility is fundamentally tied to thermodynamic irreversibility in all physical substrates. *Falsifier:* A logically irreversible operation is performed on a memory register with zero heat dissipation in a non-equilibrium steady state.
  6.  **Information as Accounting:** *Unwanted Commitment:* "Information" adds no explanatory power and is merely a synonym for entropy in this context. *Falsifier:* A system is found where information processing costs energy in a way that cannot be mapped to standard thermodynamic entropy changes.
  7.  **Thermodynamic:** *Unwanted Commitment:* The demon is just a heat engine, and the information narrative is a distracting metaphor. *Falsifier:* A device is built that extracts work based on bit values where no temperature gradient exists to drive a standard heat engine.
  8.  **Dissenting:** *Unwanted Commitment:* Landauer's Principle is a circular argument that assumes the Second Law to prove the Second Law. *Falsifier:* A memory reset is performed below the kT ln 2 limit while maintaining the Second Law through purely mechanical constraints.
  9.  **Deflationary:** *Unwanted Commitment:* The entire thought experiment is flawed because the demon cannot measure without a thermal cost that prevents work extraction from the start. *Falsifier:* A demon apparatus successfully extracts work from a single bath in the measurement phase, regardless of the reset cost.

