answer: |-
  Your intuition is spot on. This study guide paragraph is a classic "Intro to Philosophy" gloss: it captures the surface-level slogans but obscures the metaphysical engine driving the disagreement. It creates a tidy narrative that falls apart under scrutiny.

  Here is the claim-by-claim breakdown, followed by the bigger structural problem.

  ### Claim-by-Claim Analysis

  **1. "Peirce and James both held that truth is what works..."**
  *   **Verdict:** **Misleading/Wrong (for Peirce).**
  *   **Analysis:** This is the standard caricature of Pragmatism. James was more willing to use "cash value" and "works" language regarding *truth*. Peirce, however, strictly distinguished between the *pragmatic maxim* (a rule for clarifying *meaning*) and the *nature of truth*. Peirce explicitly rejected the idea that truth is simply "what works" in a practical sense. For Peirce, truth is a representation of reality that works *because* it is true, not true *because* it works.
  *   **Specialist Pushback:** A specialist would note that Peirce viewed "what works" as too subjective and tied to individual desire. He was a scientific realist; he believed truth was independent of what you or I find useful.

  **2. "...they disagreed about whose working counts."**
  *   **Verdict:** **Oversimplification.**
  *   **Analysis:** It frames the disagreement as merely sociological (community vs. individual). While partly true, it misses the *temporal* and *metaphysical* disagreement. It's not just *who* verifies, but *when* (the end of time vs. now) and *what truth is* (correspondence vs. utility).

  **3. "For Peirce, a belief is true if the community of investigators would settle on it at the limit of inquiry..."**
  *   **Verdict:** **Fair (with caveats).**
  *   **Analysis:** This accurately reflects Peirce's "convergence theory of truth" found in essays like *How to Make Our Ideas Clear*. He did argue that the "final opinion" destined to be agreed upon by all investigators constitutes the truth.
  *   **Contested:** Some scholars argue Peirce shifted later in life toward a stronger realism where truth is independent even of that final opinion, serving as the *guide* to the opinion rather than being *defined* by it. But for a study guide, this is acceptable.

  **4. "...truth is ideal consensus, which makes him basically a verificationist."**
  *   **Verdict:** **Wrong.**
  *   **Analysis:** This is the most dangerous claim in the paragraph. Labeling Peirce a "verificationist" associates him with Logical Positivism (Vienna Circle), which he predates and fundamentally disagrees with. Verificationists generally held that statements are meaningless if they cannot be empirically verified. Peirce was a **Scholastic Realist**; he believed in real generals (laws, habits, possibilities) that exist independently of human verification.
  *   **Specialist Pushback:** Peirce believed reality constrains inquiry. A verificationist thinks verification *constructs* truth. Peirce thinks inquiry *discovers* truth. Conflating the two erases Peirce's realism.

  **5. "James thought that made truth too remote and too social..."**
  *   **Verdict:** **Fair.**
  *   **Analysis:** James explicitly criticized the "limit of inquiry" as useless for living humans who need to act now. He wanted a theory of truth that was relevant to individual life, religion, and morality, not just abstract science.

  **6. "...for him a true idea is one an individual can verify here and now, that pays off in experience, and that is expedient to believe."**
  *   **Verdict:** **Mostly Fair (but vulnerable).**
  *   **Analysis:** This captures James's rhetoric in *Pragmatism* (1907). He speaks of truth "happening" to an idea and becoming true via verification. "Expedient" is a word James actually used (leading to much trouble).
  *   **Nuance:** James didn't mean *any* individual whim; he emphasized that truths must lead us through a chain of experiences without contradiction. However, the guide's phrasing ("individual... here and now") does lean into the subjectivist critique harder than James might have liked in his more careful moments.

  **7. "That's why critics charged James with making truth whatever is comforting..."**
  *   **Verdict:** **Fair.**
  *   **Analysis:** This is historically accurate. Bertrand Russell and A.O. Lovejoy famously attacked James on exactly these grounds (e.g., is a belief in God true just because it comforts you?). James tried to walk this back, arguing that "expedient" means expedient in the *long run* and *overall*, but the damage was done.

  **8. "...Peirce renamed his own view 'pragmaticism' — he wanted a name ugly enough that nobody would steal it..."**
  *   **Verdict:** **Fair.**
  *   **Analysis:** This is a direct quote from Peirce (1905). He was indeed distancing himself from the popularization of pragmatism by James, Schiller, and others.

  **9. "...to break with James's subjectivism."**
  *   **Verdict:** **Fair in spirit, imprecise in terminology.**
  *   **Analysis:** Peirce did view James as a "nominalist" (believing only particular things are real) whereas Peirce was a "realist" (believing laws and habits are real). Peirce would call James's view "subjectivistic" relative to his own, though James would argue he was accounting for the human element Peirce ignored.

  ---

  ### The Structural Problem: Is this the right frame?

  You asked me to be plain if the frame is wrong. **The frame is wrong.**

  The study guide frames the split as **Community/Future (Peirce) vs. Individual/Present (James).** While this is the standard textbook distinction, it treats the disagreement as merely *methodological* or *sociological*.

  The actual disagreement is **Metaphysical.**

  1.  **Realism vs. Nominalism:** Peirce was fighting for the reality of "Thirdness" (laws, habits, generals). He believed the universe has real habits that inquiry discovers. James was more of a nominalist; he believed truth is made in the process of experience. The guide misses this entirely.
  2.  **Truth as Discovery vs. Truth as Manufacture:** For Peirce, truth is *found* (correspondence with an external reality, signaled by consensus). For James, truth is *made* (an idea becomes true when it verifies). The guide implies they both think truth is "what works," just for different people. That suggests they agree on the definition of truth and disagree on the scope. They actually disagreed on the *ontology* of truth.
  3.  **The "Verificationist" Error:** By calling Peirce a verificationist, the guide aligns him with the very logical positivism that later killed off classical pragmatism. Peirce is currently being revived in scholarship precisely because he *wasn't* a verificationist; he was a realist who offered a way out of the dead ends of positivism.

  ### Summary for your friend

  *   **What's safe:** The bit about the "limit of inquiry," James's "expedient" language, and the "pragmaticism" name change.
  *   **What's risky:** The "truth is what works" slogan applied to Peirce.
  *   **What's wrong:** Calling Peirce a "verificationist."
  *   **The Big Picture:** The guide presents a sociological split (who decides?) when the real split is metaphysical (what *is* truth?).

  If this is for a 101-level multiple-choice exam, the guide is "correct enough" to pass the test. If your friend wants to actually understand American Philosophy, she needs to know that Peirce would be furious about the "verificationist" label and that the "what works" definition is James's distortion of Peirce's maxim, not Peirce's own view.
