answer: |-
  There is no established term that precisely captures this structural feature, so I propose naming it **the Logic of Irreducible Sacrifice**.

  Existing candidates fail because they capture only one pole of the double bind you identified. "Martyrdom" captures the voluntary embrace of death but typically locates the value in a transcendent reward (heaven, truth) rather than the historical price itself, and it belongs primarily to religious discourse. "Heroic Defeat" or "Last Stand" captures the military scenario but permits the consolation of blunder or bad luck; a hero can be mistaken, but an irreducible sacrifice cannot be. "Founding Myth" is too broad, encompassing victories and survivals that do not require death as the constitutive price. None of these terms encode the specific mnemonic hostility to contingency—the requirement that survival must have been impossible *and* chosen—for the myth to hold value.

  The **Logic of Irreducible Sacrifice** is defined as a mnemonic structure wherein the moral worth of a collective death is predicated on the simultaneous affirmation of its inevitability and its voluntary acceptance, such that any historical evidence suggesting a viable alternative invalidates the sacrifice. It operates on an economic metaphor of honor: the price paid (death) must be the minimum necessary to secure the value (honor/memory); if a cheaper price (survival without dishonor) was available, the expenditure becomes waste rather than sacrifice. This creates the epistemic closure you observed: revisionism is not merely corrective but defamatory because it reduces a sacred transaction to a tactical error.

  **Diagnostic Test:** To apply this to a fresh case, ask: "Does the commemorative tradition treat evidence that the defenders could have survived without dishonor as an attack on their virtue?" If the answer is yes, the Logic of Irreducible Sacrifice is operating. If the tradition accepts survival was possible but argues they *chose* death anyway for a higher goal (without denying the possibility of retreat), it is voluntary martyrdom. If the tradition argues they died because they had no choice but does not emphasize the voluntary embrace, it is tragic fate. Only when both necessity and choice are insisted upon simultaneously does the Logic apply.

  **Nearest Established Neighbors:**
  1.  **Religious Martyrdom:** This is the structural ancestor. The difference runs deeper than merely the nature of the refused alternative (dishonor vs. sin). In religious martyrdom, the witness (*martyria*) validates a truth that exists independently of the death. In the Logic of Irreducible Sacrifice, the death *constitutes* the value itself; there is no external truth being validated, only the honor of the group being purchased. The secular myth cannot afford the "heavenly kingdom" consolation; the price must be final to count.
  2.  **Founding Trauma:** This describes the emotional tone but not the logical constraint. A founding trauma can be a massacre where the victims had no choice (e.g., genocide memory). The Logic of Irreducible Sacrifice requires agency; the victims must be co-authors of their doom.
  3.  **The Cult of the Fallen:** (George Mosse). This describes the ritualization of death in war. However, the Cult often sanctifies *all* fallen soldiers. The Logic of Irreducible Sacrifice is exclusive; it applies only to those whose death was the *only* honorable option, distinguishing them from those who died merely because they were conscripted or unlucky.

  **Boundary Cases:**
  1.  **"Not in Vain":** This insistence denies futility, whereas the Logic of Irreducible Sacrifice accepts futility regarding earthly outcomes (the battle is lost) to secure metaphysical ones (honor). "Not in vain" looks forward to a future victory redeemed by the death; Irreducible Sacrifice looks backward at the purity of the price paid. If the defenders had lived and won later, "Not in Vain" is satisfied, but Irreducible Sacrifice is voided because the price was not paid.
  2.  **Confederate Memory:** This concedes loss but attributes it to overwhelming force, preserving the thought that the cause was winnable under different material conditions. This violates the necessity condition of the Logic. The Confederate myth argues "we could have won," whereas the Logic of Irreducible Sacrifice argues "we could not have lived honorably." The former protects the *cause*, the latter protects the *act*.
  3.  **Dunkirk:** This narrative welcomes accident as providence and emphasizes rescue. It is structurally opposite because survival is the triumph. In the Logic of Irreducible Sacrifice, survival would be the failure. Dunkirk is a myth of preservation; this is a myth of expenditure.
  4.  **Religious Martyrdom:** As noted, the structure is isomorphic, but the boundary lies in the *object* of the sacrifice. In religious martyrdom, the alternative is apostasy (a moral/spiritual death). In the historical phenomena you list (Masada, Alamo), the alternative is tactical survival (physical life) which is *retroactively framed* as moral death (cowardice). The difference is that religious martyrdom posits an actual higher life (heaven), while the historical myth posits only a higher memory. The historical myth is more fragile because it lacks the theological infrastructure to sustain the value of death without a divine witness.
