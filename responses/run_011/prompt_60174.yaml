  | Hall's Inclination Account | D4 | Denies the necessary link, changing the subject of inquiry. |
  | Grahek's Two-Factor Proposal | D2 | Explains dissociation but leaves normativity ungrounded. |
  | Agency-Disruption View | D3 | Too intellectual for neonates and non-human animals. |
