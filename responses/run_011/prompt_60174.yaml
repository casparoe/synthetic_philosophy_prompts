  ### Analysis of Joint Unsatisfiability

  There is a hard conflict between **D1 (Dissociability)**, **D4 (Necessary Link)**, and **D7 (Intrinsicness)**. If you maintain that unpleasantness is an *intrinsic* property of the pain experience (D7), and that pain is *necessarily* unpleasant (D4), then pain asymbolia (where patients report pain but lack unpleasantness) becomes metaphysically impossible, forcing you to deny the data or claim the patients are not in pain (violating D5's neutral assessment). Conversely, if you accept the dissociation data (D1) and the reality of asymbolia (D5), you must treat unpleasantness as contingent (violating D4) or extrinsic/relational (violating D7).

  This is not merely a theoretical tension but a negative result for the project as currently scoped: you cannot have an account where unpleasantness is both the intrinsic "feel" that grounds reasons from the inside *and* a modular component that can be surgically removed while the pain remains. To escape this, **D7 must be weakened**. You must accept that unpleasantness is relational or functional rather than intrinsic. The explanatory work lost by this weakening is significant: you lose the ability to claim that the badness of pain is self-intimating to the subject. If unpleasantness is relational, a subject could theoretically be in pain and fail to recognize it as bad (as in asymbolia), which complicates the first-person authority usually granted to pain reports in the PoM literature.

  Additionally, **D2 (Normative Grounding)** and **D3 (Subject Range)** pull in opposite directions. D2 demands a robust ground for reasons (often cognitive or evaluative), while D3 demands that this ground be available to non-cognitive subjects. Satisfying D3 usually forces a move toward Imperativism or Felt-Quality views, which then struggle to satisfy D2 without appealing to brute desires.

  **The Single Most Eliminating Desideratum:** **D3 (Subject Range)**. This requirement eliminates strong Evaluativism and sophisticated Agency-Disruption accounts immediately, as they typically require cognitive capacities neonates and many animals lack. It forces the dissertation toward naturalistic or phenomenal accounts, which then face the brunt of the D1/D7 conflict.

