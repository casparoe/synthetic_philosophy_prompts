answer: |-
  The traditional deflationist stance on ontology asserts that metaphysical disputes are merely verbal. When one philosopher claims there are two objects in the room (a statue and a lump of clay) and another claims there is only one, the deflationist argues they are speaking different dialects of "ontologese." They agree on all the fundamental physical facts—the position of every atom, the distribution of mass—but disagree on how the quantifier "there exists" maps onto those facts. Ted Sider and others have pushed back, arguing that reality has a structure, and some conceptual schemes carve nature at its joints better than others. On this view, the dispute isn't just about words; it's about which language captures the objective structure of the world.

  Now, introduce the twist. Suppose the dispute isn't abstract. Suppose the "two-object" theorist predicts the statue weighs 5kg, while the "one-object" theorist predicts 9kg, because they disagree on whether the internal armature counts as part of the object. Weighing the assembly becomes a crucial experiment. To evaluate this, we employ the Leftover-Observation Test (LOT): a dispute is merely verbal only if settling the meanings of the terms leaves no observable prediction dangling. If fixing the definitions resolves the conflict without needing to check the scale, it's verbal. If the scale reading itself is contested even after definitions are clear, it's real.

  My verdict is decisive: **The deflationist survives.** The Leftover-Observation Test does not sink the program; rather, it confirms that the empirical bit can be fully reabsorbed into semantics. The apparent divergence in prediction is an illusion caused by ambiguous reference, not a divergence in physical expectation.

  Here is why the deflationist wins. The core insight is distinguishing between *base-level observations* and *derived claims*. A scale reading is a base-level observation. The statement "The statue weighs 9kg" is a derived claim that combines a base observation with a semantic rule about what "statue" refers to. In the twist scenario, both parties agree on the base physics: they agree on the mass of the clay, the mass of the armature, and the total mass of the assembly. When the scale reads 9kg, neither party is surprised. The "two-object" theorist says, "The clay weighs 5kg, the armature weighs 4kg, and together they read 9kg." The "one-object" theorist says, "The statue weighs 9kg."

  The disagreement was never about the scale's behavior. It was about which subset of the mass gets labeled "the statue." Once we fix the meaning—once we stipulate that "statue" refers either to the clay alone or the composite—the dangling prediction vanishes. If we define "statue" as the clay, both agree the statue weighs 5kg. If we define it as the composite, both agree it weighs 9kg. The LOT is satisfied: fixing meanings settles the dispute without requiring further empirical investigation. The empirical content was never in the ontology; it was in the physics, which both sides accepted all along.

  We can verify this consistency by running the test over three cases.

  First, the **Statue/Lump with Weight**. As argued, the dispute dissolves upon clarifying reference. The scale reading is neutral data. The ontological claim is a labeling convention applied to that data. The test yields "Verbal."

  Second, consider **Mereological Nihilism**. The nihilist says, "There are no tables, only particles arranged table-wise." The realist says, "There is a table." Apply the LOT. Is there an observable prediction dangling? If I put a cup on the surface, both agree the cup will not fall. If I smash the arrangement, both agree the particles will scatter. There is no experiment where the nihilist predicts "cup falls" and the realist predicts "cup stays." The disagreement is entirely about whether the word "table" applies to the arrangement. Fixing the meaning of "table" (either as a fundamental object or a derivative arrangement) resolves the linguistic friction without changing the physical expectations. The test yields "Verbal."

  Third, consider a non-ontological analog: **Pluto**. Is Pluto a planet? Before 2006, the answer was yes. After the IAU redefinition, the answer was no. Did Pluto change? Did its orbit, mass, or composition change? No. Did the empirical evidence attached to it change? No. The dispute was settled by definitional fiat. However, one might argue there is evidence attached: Pluto hasn't cleared its orbit. But both sides agree on the orbital data. They disagree on whether "clearing the orbit" is a necessary condition for the label "planet." If we fix the definition, the dispute vanishes. The test yields "Verbal."

  In all three cases, the criterion gives the same answer: the disputes are verbal. Is this a bug or a feature? It is a feature. It demonstrates that ontology functions like taxonomy. Biological taxonomy once debated whether whales were fish. They agreed on the anatomy, the habitat, and the breathing mechanisms. The dispute was about the definition of "fish." Once biology standardized the definition based on phylogeny rather than habitat, the dispute ended. Ontology is the taxonomy of existence. That it behaves like taxonomy does not make it trivial; it makes it conceptual. The deflationist is not saying existence doesn't matter; they are saying that *counts* of existence depend on the conceptual scheme used to count.

  The strongest case against this conclusion comes from the Sider-style realist. They argue that the deflationist ignores the explanatory power of structure. If one conceptual scheme allows for better, more robust predictions about the world than another, it isn't just "different"; it's *better*, and potentially *truer*. For instance, if treating the statue-plus-armature as a single object allows engineers to correctly calculate load-bearing limits, while treating them as separate objects leads to structural failure, then the "one-object" view has empirical cash value. The realist argues that if ontology dictates successful interaction with the world, it cannot be merely verbal. The Leftover-Observation Test should catch this: if one ontology leads to a collapsed bridge, there is a leftover observation (the rubble) that falsifies that ontology.

  This objection breaks down because it conflates *ontology* with *physical theory*. The engineer who fails does not fail because they believed in the wrong quantifier; they fail because they miscalculated the physical forces. The nihilist engineer can perfectly well calculate load limits using "particles arranged table-wise." The realist engineer uses "tables." Both can succeed or fail based on their physics, not their metaphysics. The "joint-carving" argument suggests that some concepts are more natural, but naturalness is a gradient of utility, not a binary of existence. Even if "statue" carves reality better than "statue-minus-armature," that makes "statue" a more useful term, not a more existent object. The realist wants to jump from "useful" to "ontologically fundamental," but the Leftover-Observation Test shows there is no empirical gap there to bridge. The observations are fully accounted for by the physical arrangement regardless of the label.

  Furthermore, the realist's appeal to explanation begs the question. Explanation is always relative to human interests. We care about load-bearing limits because we are human-sized beings who want to put cups on tables. A particle physicist might find "table" a useless category. If ontology were about the objective structure of the world independent of observers, the concept "table" should not exist at all. The fact that it exists and is useful proves it is tied to our conceptual scheme, not the bare furniture of the universe.

  Therefore, the deflationist program stands firm against the empirical twist. The introduction of weight measurements does not transform a metaphysical dispute into a physical one; it merely highlights how deeply entangled our language is with our physical expectations. The Leftover-Observation Test succeeds because it forces us to isolate the raw data from the interpretation. In every case—statues, tables, or planets—the raw data remains constant while the interpretation shifts.

  This conclusion requires us to accept that ontology is not a search for hidden objects. It is a negotiation over how to describe the objects we already see. The deflationist is often accused of making philosophy trivial, but the opposite is true. By revealing that ontological disputes are verbal, we expose them as decisions about conceptual engineering. We are not discovering whether tables exist; we are deciding whether the concept "table" serves our purposes better than "particles." This is not a shrug; it is a relocation of the burden. The question is no longer "What is there?" but "How should we speak about what is there?"

  The deflationist wins because the empirical world is silent on matters of categorization. The scale reads 9kg. It does not say "This is one object" or "This is two." It simply registers mass. Any claim beyond that is a human addition. The Leftover-Observation Test confirms that once we strip away the human addition, there is no disagreement left. The dispute was never about the room; it was about the language we use to describe the room. And while language shapes how we interact with the room, it does not change the room itself. Thus, the deflationist absorbs the empirical bit without cost, preserving the view that ontological disputes are, at their core, verbal disputes about the best way to carve the silence of the physical world.
