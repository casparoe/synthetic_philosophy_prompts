answer: |-
  ### 1. Exam Question

  **Case 1:** Senior tells Junior, "The client approved the budget," believing this false.
  **Case 2:** Senior tells Junior, "The client hasn't rejected the budget," believing this true but knowing the client rejected it.

  In both, Senior knows Junior will infer approval, work weekends, and suffer stress when the project is cancelled. Motives and knowledge are identical.

  Standard theory holds lying wrongs agency more by causing false belief, whereas misleading invites it. Conversely, misleading may exploit agency by modeling inference, whereas lying overrides it.

  Which speaker wrongs Junior more? Is this difference one of kind or degree? What consideration settles this adjudication? Assume both acts are impermissible; do not argue permissibility.

  ***

  **Design Commentary (For Examiner)**
  The working feature is the **identical inferential path**. In both cases, Junior forms the belief via inference (in Case 1, inferring the Senior is truthful; in Case 2, inferring the implicature). This controls for the "credulous hearer" confound. The harm (stress/wasted work) and motive (exploiting labor) are stipulated as identical, ruling out consequentialist confounds. The only variable is the literal truth-value of the assertion versus the engineered implication. This isolates the "respect for agency" variable: is it worse to bypass reasoning (lie) or weaponize it (mislead)?

  ***

  ### 2. Model Answer

  **Step 1: Rejecting the Causal Proximity View**
  The standard argument posits that lying is the graver wrong because the liar is the proximate cause of the false belief, whereas the misleader merely provides premises from which the hearer infers the falsehood. On this view, the liar overrides the hearer's rationality, while the misleader leaves it intact. However, this relies on a superficial metric of causal distance. If the moral wrong lies in the violation of rational agency, we must examine the *quality* of the interaction with that agency, not merely the causal chain of belief formation.

  **Step 2: The Exploitation Counter-Argument**
  The reverse reading suggests misleading is the graver wrong regarding agency. To mislead successfully, the speaker must model the hearer's reasoning processes in fine detail, selecting true premises specifically to trigger a specific false conclusion. This treats the hearer's rationality not as something to be respected, but as a mechanism to be manipulated. The misleader makes an instrument of the hearer's own cognitive powers, co-opting them to produce the speaker's desired outcome. The liar, by contrast, simply inputs false data; the hearer's reasoning is bypassed, not enlisted.

  **Step 3: Adjudication (Pivotal Move)**
  Adjudicating between these requires identifying what respect for agency demands. If agency is valued for its *output* (true belief), lying is worse because it guarantees error. But if agency is valued for its *integrity* (autonomous processing), misleading is worse. The stronger view is that integrity is paramount. Co-opting a rational agent to deceive themselves is a deeper violation of autonomy than overriding them. It turns the agent against themselves. Therefore, regarding the specific wrong to agency, the misleader (Case 2) commits the graver wrong.

  **Step 4: Kind vs. Degree**
  This difference is one of kind, not degree. It concerns the structural relationship between the speakers and Junior's rationality. In lying, the relationship is adversarial (speaker vs. hearer); in misleading, it is parasitic (speaker *using* hearer). While the resulting harm (stress) is a matter of degree (and stipulated as identical here), the moral topology of the agency violation is structurally distinct. One bypasses the engine; the other hijacks the steering.

  **Step 5: The Settling Consideration**
  What settles this is the principle of **non-manipulation versus non-interference**. If the core duty is non-interference with belief content, lying is worse. If the core duty is non-manipulation of the will's processes, misleading is worse. Since the seminar focuses on truthfulness as a condition of rational cooperation, the integrity of the reasoning process is the foundational value. Thus, the exploitation of inference (misleading) settles the question as the deeper violation of the rational contract, even if lying is often more socially destructive.

  ***

  ### 3. Marking Scheme (25 Marks)

  | Move | Requirement | Marks | Partial Performance |
  | :--- | :--- | :--- | :--- |
  | **1** | **Critique of Standard View:** Identifies the "causal proximity" argument (liar causes belief) and explains why it might be insufficient for agency-based ethics. | 5 | 3 marks for identifying the view; 5 for explaining its limitation regarding agency. |
  | **2** | **Articulation of Reverse Reading:** Explains how misleading exploits/models the hearer's reasoning rather than bypassing it (instrumentalization of rationality). | 5 | 3 marks for noting misleading requires inference; 5 for linking this to exploitation/instrumentalization. |
  | **3** | **Adjudication (Pivotal):** Takes a stance on which is worse *regarding agency* and justifies it using the integrity vs. output distinction. | 5 | 0 marks for sitting on the fence. 3 marks for a stance with weak justification. 5 for a clear stance grounded in the nature of agency. |
  | **4** | **Kind vs. Degree:** Correctly classifies the difference as one of kind (structural relation) rather than degree (harm/outcome). | 5 | 3 marks for correct classification without structural justification. 5 for linking kind to the structural relationship. |
  | **5** | **Settling Consideration:** Identifies the underlying principle (e.g., non-manipulation vs. non-interference) that resolves the conflict. | 5 | 3 marks for naming a principle; 5 for showing how it settles the specific adjudication in Move 3. |

  **Pivotal Move:** Move 3 (Adjudication). Without taking a stance on which wrong is graver based on the agency argument, the answer remains descriptive rather than analytical.

  ***

  ### 4. Distinction Criterion

  **First-Class vs. Good Answer:**
  A **good** answer will successfully explain both the standard view (lying bypasses agency) and the reverse view (misleading exploits agency) and may even conclude that misleading is worse.
  A **first-class** answer makes the further step of **isolating the value of agency itself**. It distinguishes between valuing agency for its *outputs* (true beliefs) versus valuing it for its *process* (autonomous reasoning). It explicitly argues that if the latter is the priority, misleading is necessarily the graver wrong, whereas if the former is the priority, lying is. It identifies that the debate turns on this meta-ethical prioritization, not just the mechanics of the vignettes.

  ***

  ### 5. Characteristic Errors

  1.  **Error:** Arguing that the liar is worse simply because the statement was literally false.
      *   **Diagnosis:** Treats the literal truth-value as the morally relevant fact rather than the intent and effect on agency.
  2.  **Error:** Arguing that the misleader is worse because the harm was identical but the effort to deceive was higher.
      *   **Diagnosis:** Conflates the *difficulty* of the wrong with the *severity* of the wrong.
  3.  **Error:** Treating the "kind vs. degree" question as a linguistic analysis of the word "lie."
      *   **Diagnosis:** Reads the metaphysical question as a question about ordinary usage or semantic classification.
