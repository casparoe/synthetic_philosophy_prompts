  - **Swapping the theory out** (~250 words)
  Swapping to a full **Instrumentalist Theory** (Ballot = Causal Intervention) requires concrete changes.
  **Guidance:** Leaflets would abandon "vote for who you want." Instead: "Vote to maximize impact. Consider candidate viability." It would teach voters to treat the ballot as a game move, acknowledging GS implicitly.
  **Offences:** Bribery laws would shift rationale from "corruption of will" to "inequality of resources." The harm isn't that the vote isn't yours, but that money distorts the causal efficacy of votes.
  **Language of Mandates:** Politicians could not claim "the country voted for X." They would say "the coalition structure favored X." The concept of a "mandate" dissolves into "plurality authorization."
  **Parliament:** Agenda control would be transparent. Instead of hiding procedure, standing orders would acknowledge that ordering determines outcomes, treating legislation as explicit bargaining rather than deliberative discovery.
  The mystique of representation vanishes. Legitimacy rests on fair rules, not ontological alignment with voter will. Voters would be treated as players, not principals. The state would admit it aggregates strategies, not preferences. This would likely lower turnout among expressive voters but increase engagement among strategic ones. The "will of the people" would be retired as a political category.

  - **How sure are you** (~150 words)
  **Confidence Levels:**
  *   **Alienation/Autonomy distinction:** High confidence. Legal statutes (Representation of the People Act) focus on "free exercise."
  *   **Implicit Theory (Authorized Agency):** Medium-High. Fits the practices, but state intent is opaque.
