answer: |-
  - **What I described, cleaned up** (~150 words)
  You identify a tripartite tension in UK electoral practice. First, the **Regulative Frame**: law and official guidance treat the ballot as a sincere revelation of preference, criminalizing bribery and undue influence to protect the "free exercise" of the vote. Second, the **Practical Frame**: civil society encourages strategic instrumentalism (tactical voting), treating the ballot as a tool to affect outcomes rather than express truth, with no legal penalty. Third, the **Procedural Frame**: parliamentary standing orders acknowledge path-dependence (agenda setting determines outcomes), contradicting the notion that there is a single discoverable "will."

  Correction: The Electoral Commission does not officially link to tactical voting sites; they remain neutral. The tolerance is passive, not active endorsement. Also, parliamentary procedure regulates agenda to ensure stability, not necessarily to manipulate, though the effect is similar. The core tension remains: the state polices the *origin* of the vote but ignores its *strategic content*.

  - **The implicit theory** (~300 words)
  The implicit theory is **Authorized Agency**. The ballot is not a truth-claim about preferences, nor a commodity, but an act of delegated authority. The system presupposes that legitimacy derives from the voter retaining ownership of the decision, not from the decision matching their inner psychological state.

  This explains the triad. The ban on bribery and undue influence protects the *chain of authorization*. If you sell your vote, you are no longer the principal; you are an agent for another. If you are coerced, the authorization is void. However, tactical voting preserves authorization. You remain the principal, processing information to maximize utility. The "vote honestly" guidance is a **stabilizing fiction**. It reduces cognitive load and maintains the myth of the "popular will" necessary for democratic legitimacy, without being a condition of validity. The counting mechanism is agnostic to motive; it only requires a valid mark from an authorized agent.

  Parliamentary procedure fits here too: MPs are authorized agents navigating rules. The system accepts that outcomes depend on procedure (agenda setting) because it views politics as a process of authorized negotiation, not a scientific measurement of pre-existing will. The ballot is a trigger for authority, not a measurement device. The state requires the vote to be *yours*, but does not require it to be *true* to your inner hierarchy. This distinguishes the legal protection of the voter's autonomy from the philosophical ideal of preference revelation.

  - **What it excludes** (~200 words)
  This practice excludes three rival accounts. First, **Market Liberalism**: If the vote were private property, bribery would be legal. The criminal law explicitly rules this out; you cannot alienate the vote. Second, **Strict Preference Revelation**: If the system required true preferences (as mechanism design might idealize), tactical voting would be invalidated or officially discouraged. The tolerance of strategic voting excludes this. Third, **Pure Expressivism**: If voting were merely symbolic speech (like wearing a badge), parliamentary procedure wouldn't matter so much, and outcome-focused tactical voting would be irrational. The heavy regulation of parliamentary agenda implies votes are causal interventions, not just signals.

  The bribery ban excludes Market Liberalism. The tolerance of tactical voting excludes Strict Revelation. The procedural rigidity excludes Pure Expressivism. The system demands the vote be an *effective* act of *autonomous* will, but refuses to define what that will must contain. It treats the vote as a power transfer that must be voluntary, but not necessarily sincere.

  - **Strictly required vs merely comfortable** (~250 words)
  **Strictly Required:** The system strictly requires **Autonomy** and **Formal Validity**. The voter must be the source of the mark (hence bribery laws), and the mark must follow counting rules (hence tactical votes count). The state cannot inquire into *why* you marked X, only that *you* marked X without coercion or payment.

  **Merely Comfortable:** The notion that the aggregate result reflects a coherent "Popular Will" is comfortable but not required. The guidance language ("reflect what voters really think") is decorative. The system functions even if everyone votes tactically, provided they do so autonomously. The parliamentary acknowledgement of agenda manipulation suggests the architects know the "will" is constructed, not discovered.

  The underdetermined element is the **Epistemic Claim**. The state speaks as if elections discover truth (comfortable), but acts as if they merely authorize power (required). The sincerity norm is a low-cost heuristic for legitimacy, not a structural prerequisite. If voters stopped being sincere, the election would still be valid, though the resulting government might claim less moral authority. The law protects the *process* of choice, not the *accuracy* of the signal. This allows the system to survive Gibbard–Satterthwaite without admitting it.

  - **Does the package hang together?** (~300 words)
  Your **Alienation Hypothesis** is robust but requires refinement. You argue the law tracks alienation (vote ceasing to be yours) rather than direction. This holds for bribery: selling the vote transfers ownership. However, "undue influence" covers coercion where you still cast the ballot yourself. Here, alienation isn't the issue; **volition** is. You retain ownership but lose freedom.

