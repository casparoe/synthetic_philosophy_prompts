prompt: |-
  Construct a thought experiment involving a multipolar trap — a race to the bottom — engineered to survive the removal of the two explanations people normally reach for. Its purpose is to test whether a Moloch-style trap can be generated from strategic structure alone, so a scenario that asserts the trap rather than deriving it from the players' own reasoning counts as a failure.

  Specifications:

  1. The setting is mundane and institutional — a profession, an industry, a platform, a department — not science-fictional, and the scenario is at most two paragraphs.
  2. No player has a dominant strategy to defect, and the interaction is not a prisoner's dilemma or a resource-depletion problem at any stage; each player's best action genuinely depends on what they expect the others to do.
  3. The players are rational, share the same ranking over outcomes, and correctly anticipate one another's behavior. The trap may not rest on any mistake, myopia, or ignorance.
  4. There is an alternative profile that every player strictly prefers and that is feasible, including enforceable through an arrangement all of them would accept — so the case cannot be waved away as an incentive problem.
  5. Full, credible, verifiable disclosure of the relevant facts does not break the trap, and the reason must be internal to the strategic structure, not that the disclosure is cheap talk or disbelieved.
  6. Nothing outside the players — no regulator, no legal barrier, no exogenous shock — may be doing the work of either creating or sustaining the trap.

  After the scenario, do the checking: write out the equilibrium in strategies and beliefs and verify it holds; explain how the unanimously preferred profile can be feasible and yet unreachable; give the precise mechanism by which the disclosure in (5) fails, or backfires; name the single feature of the case that is load-bearing and show what happens to the trap when that feature is removed; and close with the strongest objection available to someone who thinks monitoring and graduated sanctions dissolve the case, together with your verdict on whether it lands.
reasoning: |-
  Here's a thinking process that leads to the suggested thought experiment:

  1.  **Analyze the Request:**
      *   **Goal:** Construct a thought experiment about a multipolar trap (race to the bottom) that survives the removal of common explanations (ignorance, prisoner's dilemma, external constraints, etc.).
      *   **Constraint 1 (Setting):** Mundane, institutional (profession, industry, platform, department). Max 2 paragraphs.
      *   **Constraint 2 (Strategy):** No dominant strategy to defect. Not a Prisoner's Dilemma (PD). Not a resource depletion (Tragedy of the Commons). Best action depends on expectations (coordination/assurance element).
      *   **Constraint 3 (Rationality):** Players are rational, share preferences, correct beliefs. No mistakes/myopia.
      *   **Constraint 4 (Pareto Improvement):** A strictly preferred, feasible alternative exists, enforceable by agreement (not just an incentive problem in the standard sense).
      *   **Constraint 5 (Disclosure):** Full disclosure doesn't fix it. Reason must be structural.
      *   **Constraint 6 (Endogeneity):** No external regulators/shocks creating/sustaining the trap.
      *   **Post-Scenario Analysis:** Check equilibrium, explain feasibility vs. unreachability, explain disclosure failure, identify load-bearing feature, address the "monitoring/sanctions" objection.

  2.  **Deconstruct the Constraints & Identify the Core Problem:**
      *   *Not PD:* In PD, defecting is dominant. Here, I need a coordination game or a stag hunt variant where the "bad" equilibrium is selected despite a "good" one being available and agreed upon.
      *   *Not Tragedy of the Commons:* Not about depleting a finite resource.
      *   *Not Ignorance:* Everyone knows the structure.
      *   *Not External Constraints:* The trap is internal to the interaction.
      *   *The Crux:* How do rational agents with shared preferences get stuck in a suboptimal equilibrium *even when they can agree to the optimal one*?
      *   *Standard Solution:* Usually, if an agreement is enforceable, they sign it. If it's not enforceable, it's cheap talk. Constraint 4 says it *is* enforceable through an arrangement they would accept. This implies the barrier isn't enforcement *per se*, but the *selection* of the equilibrium prior to enforcement, or a structural feature that makes the "good" equilibrium unstable despite agreement.
      *   *Wait, Constraint 4 says:* "including enforceable through an arrangement all of them would accept." This is tricky. If they can enforce it, why don't they? Usually, "enforceable" implies a contract. If they can contract, they solve the PD.
      *   *Re-reading Constraint 4:* "The trap may not rest on any mistake... There is an alternative profile that every player strictly prefers and that is feasible, including enforceable through an arrangement all of them would accept."
      *   *Interpretation:* The *outcome* is feasible and could be enforced *if* they could coordinate on the agreement mechanism itself. But the trap prevents the *adoption* of the agreement mechanism. Or, more subtly, the "arrangement" requires a level of coordination that is itself subject to the same multipolar pressure.
      *   *Better Interpretation:* This sounds like a **Coordination Failure with Strategic Complementarity** where the "good" equilibrium is risk-dominant but payoff-dominant, but the "bad" equilibrium is selected due to *higher-order uncertainty* or *pre-emption*. But Constraint 3 says "correctly anticipate one another's behavior." If they correctly anticipate, they should coordinate on the Pareto optimal one in a pure coordination game (Schelling point).
      *   *The Loophole:* **Pre-emption / Timing.** If moving first confers an advantage that forces others to follow, but moving first is risky, or if the "agreement" requires simultaneous commitment which is structurally impossible to synchronize perfectly without a focal point that doesn't exist.
      *   *Actually, look at Constraint 2 again:* "No player has a dominant strategy to defect." "Best action genuinely depends on what they expect the others to do." This describes a Coordination Game (like Stag Hunt).
      *   *The Hard Part:* In a Stag Hunt, if everyone is rational and knows everyone is rational (Common Knowledge of Rationality), they *should* play the Payoff-Dominant equilibrium (Stag). To get them stuck in the Risk-Dominant (Hare), you usually need uncertainty about rationality. Constraint 3 forbids this ("correctly anticipate").
      *   *Wait, Constraint 5:* "Full, credible, verifiable disclosure... does not break the trap."
      *   *Constraint 6:* "Nothing outside the players... may be doing the work."
      *   *The Only Way:* The trap must be a **Self-Fulfilling Prophecy driven by a structural asymmetry in commitment timing** or a **Coordination problem on the *meta-level* of enforcement.**
      *   *Refining Constraint 4:* "enforceable through an arrangement all of them would accept." This implies the contract *itself* is desirable. Why isn't it signed? Because signing it requires a quorum or simultaneous action that creates a new coordination problem *more severe* than the original.
      *   *Idea:* **The "First-Mover Penalty" in a Standardization Race.**
      *   *Scenario:* A group of departments needs to adopt a new software protocol. Old protocol is inefficient (Trap). New protocol is efficient (Pareto). To switch, *everyone* must switch simultaneously. If you switch alone, you are isolated and fired (huge loss). If everyone switches, everyone wins.
      *   *Problem:* This is a standard Stag Hunt. With common knowledge of rationality, they play Stag.
      *   *How to break Common Knowledge of Rationality without "mistakes"?* You can't.
      *   *Alternative:* **The "Matching" Constraint.** The benefit of the good outcome depends on the *number* of participants crossing a threshold, but the cost of switching is individual.
      *   *Let's look for a specific game structure:* **The "Battle of the Sexes" with many players?** No, preferences differ.
      *   **The "Assurance Game" with a Twist:** The "arrangement" to enforce the good outcome requires a *costly signal* or *upfront investment* that is itself a public good.
      *   *Wait, Constraint 4 says the arrangement is acceptable.*
      *   *Hypothesis:* The trap is **Equilibrium Selection via Path Dependence locked in by irreversible individual choices.**
      *   *Let's try a specific mundane setting:* **Academic Citation / Grant Review.** Or **Corporate Email Etiquette.**
      *   *Let's try: "The CC Trap" in Corporate Email.*
      *   *Setting:* A large firm. Employees communicate via email.
      *   *Trap:* Everyone CCs managers on everything to signal diligence. This clogs inboxes, reduces productivity.
      *   *Good Outcome:* No one CCs managers unless critical.
      *   *Why Trap?* If I stop CCing, but others continue, I look negligent (suspicion of hiding work). If everyone stops, we are all trusted.
      *   *Constraint Check:*
          *   PD? No. If others don't CC, I prefer not to CC (save time). If others CC, I must CC (protect reputation). This is a Stag Hunt (Coordination).
          *   Rational/Correct Beliefs? If they know everyone wants to stop, why don't they? Because the *risk* of being the only defector is catastrophic (fired), whereas the gain of being the only cooperator is zero. Even with correct beliefs, if the belief is "Others will CC because they fear being the only one not to," then I CC. This is a self-fulfilling belief. But Constraint 3 says "correctly anticipate." If they anticipate everyone *wants* to stop, do they stop?
          *   *The Kicker:* The "Arrangement." They can sign a pact: "We all agree not to CC."
          *   *Why does the pact fail?* Because the pact is not binding on *future* anxiety. Or, more structurally: **The pact requires a public act of signing.** If I sign, I signal I trust others. If others don't sign, I am exposed.
          *   *Wait, Constraint 4 says the arrangement is enforceable.* If it's enforceable, signing it guarantees the outcome.
          *   *So why not sign?* Because **signing the arrangement is itself a strategic move subject to the same trap.**
          *   *Refinement:* To enforce the "No CC" rule, someone must monitor. Who monitors? If I volunteer to monitor, I incur cost. If we elect a monitor, the election is a coordination problem.
          *   *Better:* **The "Standardization Lock-in" in a Supply Chain.**
          *   *Setting:* Auto parts suppliers.
          *   *Trap:* Using a legacy file format. New format is better.
          *   *Constraint:* Compatibility.
          *   *Why not switch?* Switching costs.
          *   *Why not agree?* The agreement requires *simultaneous* investment.
          *   *Constraint 5 (Disclosure):* Knowing the costs doesn't help.
          *   *Constraint 6 (Endogenous):* No regulator.
          *   *The "Load-Bearing" Feature:* **Strategic Complementarity with a Threshold.**
          *   *Wait, I need to ensure it's not just a Stag Hunt solved by Common Knowledge.*
          *   *The "Correctly Anticipate" constraint is the hardest.* If I know you know I know... we coordinate on the Pareto optimum in a Stag Hunt (Harsanyi & Selten).
          *   *Unless:* There are **Multiple Pareto Optima** and they conflict? No, Constraint 4 says "alternative profile that *every* player strictly prefers."
          *   *Unless:* The "Arrangement" requires a **unanimous vote** to activate, but the *vote itself* is public and sequential.
          *   *Idea:* **The "Voluntary Compliance" Audit.**
          *   *Setting:* Departmental Budgeting.
          *   *Trap:* Inflating budget requests.
          *   *Good:* Honest requests.
          *   *Mechanism:* If everyone is honest, funds are allocated efficiently. If one inflates, they get more, others get less. If everyone inflates, inflation adjusts, everyone works harder for same real value.
          *   *Is this PD?* If others are honest, do I prefer to inflate? Yes (get more resources). That's PD. Constraint 2 forbids PD.
          *   *I need:* If others are honest, I prefer to be honest. If others inflate, I prefer to inflate. (Stag Hunt).
          *   *Why stuck in Bad Equilibrium?* Because the "Honest" equilibrium is unstable to *trembling hand*? No, Constraint 3 says no mistakes.
          *   *Okay, the only way to satisfy "Correctly Anticipate" + "Stuck in Bad Equilibrium" + "Pareto Optimum Exists" is if the Bad Equilibrium is the **Unique Nash Equilibrium** despite the Pareto Optimum being feasible.*
          *   *How?* The Pareto Optimum is not a Nash Equilibrium.
          *   *But Constraint 4 says:* "feasible, including enforceable through an arrangement all of them would accept."
          *   *This implies:* The Pareto Optimum *can* be made stable via contract, but the *formation* of the contract is the trap.
          *   *The Trap:* **The Contract Formation Game.**
          *   *Scenario:* A group of consultants billing hours.
          *   *Trap:* Billing 60 hours/week (burnout).
          *   *Good:* Billing 40 hours/week.
          *   *Structure:* Clients judge value by total hours billed by the *team*. If the team bills less, clients think the team is lazy and fire them all. If the team bills high, clients are happy, but consultants burn out.
          *   *Wait, if I bill 40 and others bill 60, do I get fired?* Yes, I look like the slacker.
          *   *If everyone bills 40?* Clients accept it (Pareto).
          *   *Why not agree?* To enforce the 40-hour cap, they need to submit a joint proposal to the client.
          *   *The Catch:* The joint proposal requires **unanimous public signature**.
          *   *The Trap:* Signing the proposal *first* signals weakness. If I sign, and you don't, I am the "ringleader" of the laziness and get fired first. If we sign simultaneously, we are safe. But there is no mechanism for perfect simultaneity.
          *   *Constraint 5:* Disclosure doesn't help. Knowing I want to sign doesn't help if I sign 1 second before you.
          *   *Constraint 2:* Is there a dominant strategy? If others sign, I want to sign. If others don't, I don't. (Coordination).
          *   *Constraint 3:* Rational/Correct beliefs. If we know we all want to sign, why not? **Because the order of moves matters.**
          *   *This is a "War of Attrition" or "Pre-emption" game disguised as coordination.*
          *   *Actually, let's refine the "Simultaneity" issue.* In digital systems, perfect simultaneity is impossible. There is always a sequence.
          *   *The Load-Bearing Feature:* **Irreversibility of the First Move.**
          *   *If I commit first, I am vulnerable.* If I wait, I am safe but the deal doesn't happen.
          *   *This creates a "Second-Mover Advantage" in the contracting phase.* Everyone waits to be the second mover. No one moves. Trap persists.

  3.  **Drafting the Scenario:**
      *   *Setting:* A partnership of 10 independent architectural firms bidding on a massive municipal project.
      *   *Trap:* The "Over-Design" Race. To win, the consortium must submit a proposal.
      *   *Norm:* Each firm contributes a design module.
      *   *Bad Equilibrium:* Every firm submits a hyper-complex, expensive module. Total cost is too high, margin is zero, work is miserable.
      *   *Good Equilibrium:* Every firm submits a streamlined, efficient module. Total cost is lower, margin is high, work is manageable.
      *   *Constraint:* The client selects the consortium based on the *weakest* link's perceived effort. If one firm submits a simple module while others submit complex ones, the client perceives that firm as "low effort" and ejects them from the consortium (replaced by a rival).
      *   *If all submit simple:* Client accepts (they know the consortium is efficient).
      *   *The Agreement:* They can sign a "Simplicity Pact" binding them to simple modules.
      *   *The Catch:* The Pact only becomes valid if **all signatures are logged on a public ledger.** The ledger timestamps signatures.
      *   *The Trap:* The first firm to sign is publicly identified as the "instigator." If the Pact fails (i.e., not everyone signs), the instigator is targeted by the client as the one trying to "cut corners" and is ejected immediately, even if others didn't sign. The last signer is safe (joined a successful pact) or invisible (pact failed, no instigator).
      *   *Result:* Everyone wants the Pact. No one wants to be the First Signer. Time runs out. They submit the Over-Design.

  4.  **Checking Constraints:**
      *   1 (Mundane): Architectural bidding. Yes.
      *   2 (No Dominant Strategy): If others sign, I want to sign. If others don't, I don't. (Coordination).
      *   3 (Rational/Correct): They know everyone wants to sign. They know everyone fears being first.
      *   4 (Feasible/Enforceable): The Pact works if signed. Everyone prefers it.
      *   5 (Disclosure): Knowing everyone's preference doesn't solve the "First Mover Penalty."
      *   6 (Endogenous): No regulator. The client's rule is exogenous, but the *trap* is the firms' interaction with that rule. Wait, Constraint 6 says "Nothing outside the players... may be doing the work of either creating or sustaining the trap." The Client's rule creates the incentive. Is the Client "outside"? Yes.
      *   *Correction:* The Client's rule is the environment. The *trap* must be sustained by the players' strategic interaction *given* the environment. The environment sets the payoff matrix. The players sustain the equilibrium. This is allowed. The constraint means I can't say "The Client forbids the pact." The Client allows it, but the *players* fail to execute it due to internal dynamics.
      *   *Refinement on Client Rule:* The Client doesn't forbid the pact. The Client just punishes the "outlier." The "First Signer" risk is internal to the consortium's liability structure (joint and several liability).
      *   *Let's make it more internal:* The "First Signer" risk comes from **Joint Liability.** If the Pact is signed and *fails* (someone defects), the signatories are liable for the defector's breach. The *first* signer takes the highest reputational risk of organizing a failed collusion.
      *   *Actually, the "Timestamp" idea is stronger.* It creates a focal point for blame.
      *   *Let's tighten the "Client" aspect.* The Client is just the payoff source. The constraint says "Nothing outside... creating or sustaining." The Client sets the payoffs (the game). The Players sustain the trap (the equilibrium). This is standard game theory. The constraint likely means "Don't blame a law forbidding the contract."
      *   *Okay, the "First Mover Penalty" in a Unanimity Game is the key.*

  5.  **Refining the Analysis:**
      *   *Equilibrium:* All wait. (Bad Outcome).
      *   *Preferred:* All sign. (Good Outcome).
      *   *Why unreachable?* The "Signing Game" has a Unique Nash Equilibrium where no one signs because signing is strictly dominated by waiting *if* there is any probability of failure, but with correct beliefs...
      *   *Wait, if beliefs are correct, and everyone plans to sign, then the Pact succeeds. So the First Mover is safe.*
      *   *I need a reason why the First Mover is unsafe EVEN IF everyone plans to sign.*
      *   *Ah:* **The signature process is not simultaneous.** It is sequential.
      *   *If I sign first, I am committed. You have not signed yet.*
      *   *Even if you plan to, you have the option to wait and see if a third party signs.*
      *   *This is the "Centipede Game" logic or "War of Attrition".*
      *   *But with Common Knowledge of Rationality, in a finite sequential game with perfect info, backward induction solves it.*
      *   *Unless:* **The horizon is infinite/undefined** or **There is a cost to waiting that is lower than the risk of moving.**
      *   *Let's try a different angle:* **The "Plausible Deniability" Trap.**
      *   *Setting:* Corporate Compliance Officers.
      *   *Trap:* Aggressive accounting.
      *   *Good:* Conservative accounting.
      *   *Agreement:* "We all agree to conservative."
      *   *Why fail?* To enforce this, one officer must report the deviation.
      *   *If I report:* I am a snitch. If the agreement holds, good. If the agreement fails (others deny), I am fired for "disrupting harmony."
      *   *This relies on "Others might deny."* Constraint 3 says "Correctly anticipate." They know others won't deny.
      *   *Okay, I need to lean heavily on Constraint 4's wording:* "enforceable through an arrangement all of them would accept."
      *   *This implies the arrangement exists.* Why isn't it adopted?
      *   *Because adopting the arrangement requires a **Unanimous Vote**.*
      *   *The Vote is Public.*
      *   *If I vote Yes, and the Vote fails (someone votes No), I am identified as a "Reformer." The Status Quo defenders punish Reformers.*
      *   *If I vote No, I am safe regardless.*
      *   *So Voting Yes is risky. Voting No is safe.*
      *   *But if everyone Votes Yes, the Vote passes, and everyone is safe.*
      *   *This is a Stag Hunt on the Vote.*
      *   *Why stuck in Bad?* Because the "Risk Dominant" equilibrium is selected.
      *   *But Constraint 3:* "Correctly anticipate." In a Stag Hunt with CKR, players coordinate on Payoff Dominant.
      *   *UNLESS:* There is a **Second-Order Coordination Problem.**
      *   *I need to invoke the "Multiplicity of Equilibria" where the selection mechanism is arbitrary but fixed.*
      *   *No, that violates "Correctly anticipate" if they anticipate the wrong one.*
      *   *Okay, the only rigorous way to satisfy "Correctly Anticipate" + "Suboptimal Equilibrium" is if the Suboptimal Equilibrium is the **Unique Nash Equilibrium**.*
      *   *But Constraint 4 says the Good Outcome is "feasible, including enforceable."* This implies the Good Outcome *can* be a Nash Equilibrium *if* the arrangement is in place.
      *   *So the trap is in the **Transition** to the arrangement.*
      *   *The Transition Game has a Unique NE (Don't Sign).* The Post-Transition Game has a Unique NE (Cooperate).
      *   *Why is "Don't Sign" Unique?* Because Signing is weakly dominated by Waiting in the transition phase due to **Irreversibility.**
      *   *Once I sign, I cannot unsign. If you don't sign, I am exposed.*
      *   *Even if I know you will sign, I must sign *before* you to make it happen (if sequential).*
      *   *If I sign first, I am exposed for time $t$. In that time, an exogenous shock could occur?* No, Constraint 6.
      *   *In that time, you could change your mind?* But beliefs are correct.
      *   *Okay, the "Correct Beliefs" constraint is the killer.* If I truly know you will sign, I am not exposed.
      *   *So the belief must be: "I know you want to sign, but I also know you are waiting for me to sign first."*
      *   *This is the **Hi-Lo Game** with a **Pre-emption Cost**.*
      *   *Let's construct the "Pre-emption Cost".*
      *   *Scenario:* **The "Voluntary Standard" Adoption.**
      *   *Players:* 5 Division Heads.
      *   *Trap:* Using incompatible legacy software (high integration cost).
      *   *Good:* Adopting new standard (low cost).
      *   *Mechanism:* To switch, all 5 must switch in the same fiscal quarter.
      *   *Agreement:* They can sign a "Switch Pact."
      *   *Constraint:* The Pact requires a **Deposit** from the first signer to cover transition costs if the pact fails. The deposit is refunded only if *all* sign. If the pact fails, the first signer loses the deposit.
      *   *Why?* To signal seriousness.
      *   *Problem:* Everyone prefers the Pact. No one wants to post the Deposit because if *anyone else* hesitates (even if they intend not to), the Deposit is lost.
      *   *With Correct Beliefs:* I know you intend to sign. But I also know you know I intend to sign.
      *   *Why not sign?* Because the **order is endogenous.**
      *   *If we could sign simultaneously, we would.*
      *   *But the system forces sequential logging.*
      *   *In a sequential game with perfect information and common knowledge of rationality, the first player signs (Backward Induction).*
      *   *I need to break Backward Induction.*
      *   *How?* **Uncertainty about the *number* of players?** No.
      *   *Uncertainty about *payoffs*?** No.
      *   *Ah, Constraint 5:* "Disclosure... does not break the trap."
      *   *Okay, I will use the **"Second-Mover Advantage in Liability"**.*
      *   *If I sign first, I am the "Principal" of the agreement. If the agreement is technically breached later (even by accident), the Principal is liable.*
      *   *If I sign last, I am a "Signatory."*
      *   *Even with correct beliefs, the **legal structure** imposes a cost on the First Mover that is not imposed on the Last Mover.*
      *   *Everyone waits to be the Last Mover.*
      *   *Since there is no "Last Mover" without a "First Mover," no one moves.*
      *   *This works.* It relies on the structural rules of the arrangement itself, not on irrationality.

  6.  **Finalizing the Scenario:**
      *   **Setting:** Five hospital departments sharing a patient database.
      *   **Trap:** Manual data entry (error-prone, slow).
      *   **Good:** Automated API integration (fast, safe).
      *   **Requirement:** All five must integrate simultaneously to maintain data integrity.
      *   **Arrangement:** A "Integration Covenant."
      *   **Constraint:** The Covenant requires a **Sponsor** to file the paperwork. The Sponsor assumes full liability for data breaches during the transition if *any* department fails to integrate on time.
      *   **Rationality:** All prefer Automation. All prefer *not* to be Sponsor.
      *   **Trap:** No mechanism to select a Sponsor simultaneously. Volunteering is sequential.
      *   **Disclosure:** Knowing everyone wants to automate doesn't make anyone want to be Sponsor.

  7.  **Drafting the Analysis:**
      *   *Equilibrium:* No one volunteers. Status quo persists.
      *   *Preferred:* One volunteers, all integrate.
      *   *Feasibility:* The Covenant is legal and beneficial.
      *   *Disclosure Failure:* Information doesn't change the liability structure.
      *   *Load-Bearing Feature:* **Asymmetric Liability in the Commitment Mechanism.**
      *   *Objection:* "Just randomize selection."
      *   *Verdict:* Randomization requires a coordinator (external) or a pre-agreed randomization device (which requires a prior agreement... subject to the same trap).

  8.  **Review against Constraints:**
      *   1 (Mundane): Hospital departments. Yes.
      *   2 (No Dominant Strategy): If someone else sponsors, I integrate. If no one sponsors, I don't (can't alone).
      *   3 (Rational): Yes.
      *   4 (Feasible): Yes, Covenant exists.
      *   5 (Disclosure): Yes, knowing preferences doesn't solve liability.
      *   6 (Endogenous): The liability rule is part of the Covenant (internal to the arrangement they must agree on).

      *Wait, one nuance:* Constraint 6 says "Nothing outside the players... may be doing the work of... sustaining the trap."
      *   If the Liability Rule is part of the Covenant, and the Covenant is *proposed* but not *adopted*, is the Rule "outside"?
      *   The Rule is a feature of the *solution*, not the *problem*. The problem is that the solution requires a role no one wants.
      *   The trap is sustained by the players' refusal to take the role.
      *   This seems valid. The "Multipolar Trap" is the inability to assign the "Sponsor" role.

      *Refining the "Correctly Anticipate" bit:*
      *   If I know you won't sponsor, I won't.
      *   Why do I know you won't sponsor? Because I know you know I won't.
      *   This is a coordination failure on *who* sponsors, not *whether* to sponsor.
      *   Since the payoff for Sponsoring < Payoff for Free Riding (even in the good outcome), everyone prefers to Free Ride on the Sponsorship.
      *   But if everyone Free Rides, no Sponsor.
      *   This is a **Volunteer's Dilemma**.
      *   *Constraint 2 Check:* "No player has a dominant strategy to defect."
      *   In Volunteer's Dilemma, "Don't Volunteer" is dominant *if* someone else volunteers. If no one else volunteers, "Volunteer" is better than "Crash."
      *   So "Don't Volunteer" is NOT dominant. It depends on expectations.
      *   This fits Constraint 2.
      *   *Constraint 3 Check:* "Correctly anticipate."
      *   In a symmetric Volunteer's Dilemma with CKR, there is a mixed strategy equilibrium where there is a probability no one volunteers.
      *   Can we make it a Pure Strategy Equilibrium where no one volunteers?
      *   Only if the Cost of Volunteering > Cost of Crash.
      *   But Constraint 4 says the Good Outcome is "strictly preferred." So Cost of Volunteering < Cost of Crash (net).
      *   So there *is* an incentive to volunteer if no one else does.
      *   So why the trap?
      *   Because in the **Sequential** version, everyone waits.
      *   If the game is "Who presses the button first?", and pressing first incurs a cost $C$, and waiting incurs cost 0 (unless time runs out).
      *   If time is continuous, this is a War of Attrition.
      *   In War of Attrition with complete information, the player with the lowest cost threshold wins immediately.
      *   If players are symmetric, there is no pure strategy equilibrium.
      *   *I need a Pure Strategy Equilibrium where the trap holds.*
      *   *Solution:* **The "Sponsor" role carries a permanent stigma or liability that persists even after success.**
      *   *Example:* The Sponsor is legally liable for *future* breaches caused by the new system for 5 years. Non-Sponsors are not.
      *   *Payoff:*
          *   Status Quo: 0
          *   New System (Non-Sponsor): +10
          *   New System (Sponsor): +5 (10 benefit - 5 liability cost)
      *   *Wait, if +5 > 0, they should Sponsor.*
      *   *I need:* New System (Sponsor) < Status Quo.
      *   *But Constraint 4:* "Alternative profile that every player strictly prefers."
      *   *This implies:* For *every* player, the Good Outcome (including their role in it) must be better than the Bad Outcome.
      *   *So:* Sponsor Payoff > Status Quo Payoff.
