  **The Scenario**

  Five department heads in a hospital system must jointly migrate from a legacy patient-record platform to a superior, integrated cloud system. The migration yields a net benefit of +10 units for the hospital, but requires one department to act as the "Lead Integrator." The Lead assumes unique liability for transition errors, reducing their net benefit to +1, while the other four departments reap the full +10 without liability. If no one leads, the hospital remains on the legacy system (payoff 0 for all). The departments can negotiate any binding agreement to facilitate the switch, and all facts—including each head's preference for the switch and their aversion to the Lead role—are common knowledge. However, the technical protocol for migration requires the Lead Integrator to initiate the handshake *unilaterally* and *irreversibly* before others can join; there is no technical function for simultaneous commitment.

  Despite the switch being Pareto-superior for every player (even the Lead prefers +1 to 0), and despite the ability to draft enforceable side-contracts compensating the Lead, the migration never occurs. Any side-contract compensating the Lead requires a unanimous vote to ratify the budget transfer. Since ratifying the contract formally designates the recipient as the Lead, the designated head holds veto power over their own designation. Consequently, every head rationally vetoes any arrangement naming them Lead, hoping another will volunteer. Because the players are symmetric and no exogenous focal point exists to select a specific Lead, the veto cycle repeats indefinitely. The hospital remains on the legacy system, not because the solution is unknown or unenforceable, but because the internal procedure for assigning the necessary asymmetric role requires unanimity from players who share a symmetric incentive to avoid it.

  ***

  **The Checking**

  **1. Equilibrium in Strategies and Beliefs**
  *   **Strategies:** Each player adopts the strategy: "Veto any proposal designating me as Lead; Wait for another to initiate the handshake."
  *   **Beliefs:** Each player correctly believes that all others prefer the migration (+10 or +1) over the status quo (0), but also correctly believes that all others prefer Free Riding (+10) over Leading (+1). Crucially, each believes that no other player possesses a reason to break symmetry (e.g., no one has a lower cost of leading).
  *   **Verification:** Given the unanimity rule for compensation and the unilateral requirement for initiation, a player who volunteers without compensation receives +1. A player who waits risks 0 but hopes for +10. Since +10 > +1 > 0, waiting is the best response to the expectation that others are also waiting to avoid the Lead role. The profile where all wait (Status Quo) is a Nash Equilibrium. The profile where one Leads and others Follow is also a Nash Equilibrium, but it is unreachable because it requires an asymmetric move in a symmetric game without a coordination device.

  **2. Feasibility vs. Unreachability**
  The Pareto-optimal profile (Migration) is **feasible** because the technology exists and the net gains (+10 for four, +1 for one) exceed the status quo (0). It is **unreachable** because realizing it requires selecting an asymmetric equilibrium (one Lead, four Followers) from a symmetric strategy space. The mechanism for enforcing the "fair" distribution of the burden (compensating the Lead) requires a unanimous vote, which grants the potential Lead veto power. Since the Lead prefers to be a Follower, they veto their own designation. The trap is not a lack of surplus, but the inability to distribute the *role* required to capture the surplus without granting the role-holder the power to block it.

  **3. Mechanism of Disclosure Failure**
  Full disclosure fails because the trap is not epistemic (based on ignorance) but **structural**. Knowing that "Player A wants to migrate" does not change Player A's incentive to veto their own designation as Lead. Disclosure confirms the conflict of interest: everyone wants the benefit, no one wants the specific burden required to unlock it. The disclosure does not create a focal point; it merely verifies the symmetry of preferences that causes the deadlock. The "cheap talk" problem is bypassed by the enforceability of contracts, but the *formation* of the contract is itself subject to the veto trap.

  **4. Load-Bearing Feature**
  The load-bearing feature is the **Unanimity Requirement for Asymmetric Burden Assignment**.
  *   **Removal:** If the burden assignment required only a Majority Vote, the four non-Leads could outvote the one Lead, forcing the rotation. The trap would dissolve.
  *   **Effect:** The unanimity rule transforms the "Lead" role from a duty into a privilege that can be rejected. It couples the *benefit* of the agreement (migration) with the *right to block* the specific term (designation) necessary to execute it. This creates a "Holdout Problem" where every player is a potential holdout against their own participation in the optimal role.

  **5. Objection and Verdict**
  *   **Objection:** "Monitoring and graduated sanctions dissolve the case. The departments can agree to a randomization device (e.g., a dice roll) to select the Lead, with sanctions for anyone who vetoes the result. This removes the veto power."
  *   **Verdict:** **Does Not Land.** The objection assumes the randomization device can be adopted without triggering the veto trap. However, adopting the *rule* that "we will abide by the dice roll" is itself an arrangement that designates a potential Lead. If the dice roll is binding, the player who knows they might become Lead (and prefers to avoid it) has an incentive to veto the *adoption of the rule* before the dice are cast. Since the adoption of the rule requires unanimity (per the scenario's institutional constraints), the player who fears the random outcome vetoes the mechanism. The trap recurs at the meta-level: you cannot sanction a veto on the selection mechanism if the selection mechanism requires unanimity to install. The multipolar trap is robust because the "escape hatch" requires a key that every player holds, and no one is willing to turn it first.
