answer: |-
  To defend the claim that group-level selection is occurring in this beetle scenario, we must begin by rigorously distinguishing the concept of selection as a causal process from the concept of evolution as a historical trajectory. The standard verdict—that there is no group selection because group composition is not heritable—rests on a conflation of these two ideas. It treats the conditions necessary for a population to *adapt* via selection as identical to the conditions necessary for selection to *act*. On the view defended here, selection is a force exerted in the present generation, defined by the covariance between entity properties and entity fitness, whereas heritability is a condition on whether the effects of that force accumulate over time. To deny selection in the absence of heritability is akin to denying that gravity acts on a stone merely because the stone is glued to the ground and does not fall. The force is present; the motion is prevented. Similarly, group selection is present in the beetle patches; the evolutionary response is prevented by the lack of group genealogy.

  To establish this, we must first define what it takes for there to be selection at a specific level without begging the question in favor of the standard view. Selection at a given level occurs when there are entities at that level that vary in their properties, when those properties causally influence the entities' contribution to the next generation, and when that contribution is differential relative to other entities at that level. Crucially, this definition requires neither that the entities replicate themselves nor that their specific properties be transmitted to successor entities; it requires only that the entities function as units of fitness in the current generation. In the beetle case, the patches function as such units. They vary in composition (fast-dominated vs. slow-dominated), and this variation causally determines their productivity. A fast-dominated patch produces fewer surviving offspring than a slow-dominated patch not merely because the individuals within it differ, but because the *interaction* of those individuals exhausts the resource. The collapse of the patch is a property of the collective, not a property of any single beetle. No single beetle causes the collapse; it is the aggregate density of fast metabolizers that triggers the environmental failure. Therefore, the differential productivity of the patches is not merely a bookkeeping shorthand for individual fitness. If it were merely individual fitness, the total output of a patch would be the linear sum of individual outputs regardless of context. But here, the context determines the survival of the output. The patch acts as a sieve that filters individual lineages based on group composition. This causal structure satisfies the requirements for selection at the group level: there is variation among groups, there is differential fitness among groups, and that fitness difference is caused by the group-level property.

  One might object that without group genealogy, this process is better described as "sorting" or merely as an ecological background condition on individual-level selection. The objection suggests that because patches do not reproduce, they are not genuine biological individuals, and thus their differential survival is just part of the environment in which the beetles evolve. However, accepting this redescription costs us explanatory power regarding the causal mechanism of the evolutionary dynamics. If we dismiss the patch effects as mere background, we obscure the specific nature of the selective pressure acting on the beetles. We are left saying that individuals in fast patches have low fitness, without explaining *why* in a way that captures the structural dependency. By acknowledging group selection, we identify the mechanism as a tragedy of the commons: the fitness of the individual is negatively correlated with the fitness of the group to which it belongs. To call this "sorting" implies a passive process, like stones settling by size, whereas the patch collapse is an active, dynamic consequence of the interaction between the beetles and their shared resource. What is lost by the redescription is the ability to model the tension between levels. If we deny group selection, we cannot formally represent the conflict between the individual advantage of being fast and the group disadvantage of having too many fast beetles. We lose the conceptual toolkit required to understand why the population might not maximize total productivity, even if the trait doesn't evolve. The causal reality of the group-level filter exists regardless of whether the filter leaves a historical trace.

  This leads to the worry that this position makes group-level selection implausibly cheap. If any transient grouping that affects fitness counts as a level of selection, does the concept lose its bite? To address this, we must distinguish between the *occurrence* of selection and the *evolutionary consequences* of selection. Consider a variant of the case where patch composition does persist across generations—perhaps daughters remain on the maternal fungus patch. In that scenario, group-level selection leads to group-level adaptation: the population evolves toward slower metabolism because the successful groups reproduce themselves. In the original random-colonization case, group-level selection occurs but leads to no group-level adaptation. The difference lies in the heritability, not in the presence of the selective force. Conceding that the two cases differ in evolutionary consequences does not oblige us to concede they differ in whether selection occurs. Just as a strong wind exerts pressure on a tree regardless of whether the tree bends or breaks, group selection exerts pressure on the population regardless of whether the group traits are transmitted. The "cheapness" is only a problem if we insist that selection must be defined by its long-term success. But selection is a component of evolutionary change, not synonymous with it. By reserving the term "selection" for the instantaneous causal pressure, we preserve the ability to analyze why evolution *fails* to occur at a certain level. In the beetle case, evolution at the group level fails precisely *because* the strong force of group selection is uncoupled from transmission. If we define selection to require transmission, we can no longer say that group selection is thwarted; we would have to say it is absent, which renders the explanation of the population's stasis or individual-level trajectory less precise.

  This distinction is mathematically supported by partitioning total evolutionary change, such as in the Price equation framework. The total change in the frequency of the slow trait can be decomposed into a within-group component and a between-group component. The between-group term corresponds to the covariance between group trait value (proportion of slow beetles) and group fitness (total offspring produced). In the beetle case, this between-group covariance is positive and significant: groups with more slow beetles produce more offspring. The standard verdict often implies that because the total response to selection at the group level is zero (due to random reshuffling), the between-group term must be zero or irrelevant. This is a confusion of the force with the response. The partition identifies the *pressure* exerted at each level. The between-group term is non-zero, indicating a selective pressure favoring slow groups. The fact that this pressure does not result in a cumulative change in the population mean is due to the transmission term being zero at the group level. The partition is not question-begging because it measures statistical associations in the current generation independently of the transmission rules. It isolates the differential contribution of groups from the fidelity of group reproduction. To claim that group selection is absent because the total change is zero is to define selection by its net outcome, which conflates the input (selection) with the output (evolution). The mathematical decomposition confirms that there is a genuine group-level component to the fitness structure, even if the inheritance system prevents that component from driving long-term change.

  The strongest objection to this position challenges the ontological status of the groups. A critic might argue that selection fundamentally requires replicators: entities that make copies of themselves. On this view, selection is not just a causal filter but a process of differential replication. Since the beetle patches do not replicate—their composition is scrambled every generation—they are not replicators, and therefore no selection proper can be said to act upon them. To call it "selection" is to stretch the word beyond its biological utility, turning it into a metaphor for any causal influence on survival. If we accept this, the critic argues, we lose the ability to distinguish between a biological evolutionary process and a mere physical filtering event, like water filtering sand.

  To answer this, I must concede that if one defines "evolution by natural selection" strictly as a process requiring replication, then the beetle patches are not evolving. However, I must resist the move to deny that *selection* is occurring. The replicator requirement conflates the unit of evolution with the unit of selection. Selection is the differential persistence of entities based on their properties. Replication is the mechanism by which that persistence becomes historical. In the beetle case, the groups persist for a season, they vary, and they differ in their contribution to the global pool based on their properties. That is a selective event. To deny it because the groups do not replicate is to impose a historical requirement on a contemporaneous causal process. It implies that we cannot know if selection is happening until we see the next generation. But the selective pressure is real in the current generation; the beetles in the fast patches die *because* of their group context. That causal fact does not vanish because the group structure dissolves later. If we adopt the replicator requirement, we render ourselves unable to describe selective pressures that are real but transient. We would have to say that a predator exerting pressure on a herd is not "selecting" unless the herd structure is heritable. This restricts the concept of selection to successful lineages, introducing a teleological bias where only what persists counts as having been selected. By maintaining that selection is the force and heritability is the condition for accumulation, we retain the conceptual clarity to say that group selection is indeed occurring in the beetle patches, but it is evolutionarily futile. This preserves the explanatory power of multilevel selection theory to diagnose conflicts and constraints, even in cases where the higher-level units are ephemeral. The tragedy of the commons is no less a tragedy because the commons are reconstituted every year; the selective pressure destroying the fast groups is real, even if the population never learns the lesson.
