answer: |-
  (a) **Candidate Principles: The Doctrine of Restorative Stewardship**

  **Principle 1: The Duty of Anthropogenic Remediation.**
  Where human activity has directly caused harm, increased vulnerability, or disrupted historical ecological function, there is a positive obligation to intervene to mitigate that harm, regardless of the impact on aggregate welfare or population size.
  **Principle 2: The Constraint of Ecological Integrity.**
  Where harm is natural, intervention is prohibited if its primary aim is the optimization of aggregate welfare or the management of population size. Intervention is permitted only if it restores a historical ecological process or removes a specific pathogen/parasite without establishing a regime of continuous population control.
  **Principle 3: The Limit of Institutional Role.**
  Interventions that require permanent, high-frequency human adjudication of individual life-and-death decisions, or that involve irreversible genetic changes without exhaustive testing, are prohibited regardless of expected welfare outcomes.

  (b) **Mapping Clauses to Cases**

  *   **Principle 1 (Remediation):**
      *   *Case 1:* Drought caused by extraction (Human harm → Obligation).
      *   *Case 4 (first half):* Pathogen introduced by us (Human harm → Obligation).
      *   *Case 7:* Reintroduction to former range (Restoring human-disrupted function → Obligation).
      *   *Case 11 (first half):* Raptor to former range (Restoring historical baseline).
  *   **Principle 2 (Integrity):**
      *   *Case 3:* Dam removal (Restores function, even if fry suffer).
      *   *Case 6:* Predator suppression refused (Goal is welfare/size management, not restoration).
      *   *Case 10 (pair):* Habitat mod approved (Specific management); General biomass reduction refused (Goal is population/welfare optimization).
      *   *Case 11 (second half):* Novel introduction refused (Not historical baseline).
      *   *Case 5:* Botfly extirpation (Permitted as specific parasite removal, not population management).
  *   **Principle 3 (Institutional Role):**
      *   *Case 8:* Gene drive refused (Irreversible/Untested); Research approved (Testing phase).
      *   *Case 9:* Continuous killing refused (Turns management into permanent adjudication).
      *   *Case 2:* Natural drought (No obligation; cheap help allowed as beneficence, not duty).
      *   *Case 4 (second half):* Endemic pathogen (Hesitation due to population size impact).

  (c) **Coherence and Simplification**

  **Judgment:** The principle set above saves all eleven verdicts, but it is clause-laden. Specifically, Principle 2 contains a tension: it forbids managing population size for welfare (Case 6) but permits extirpating a natural parasite (Case 5), which inevitably alters population dynamics. It distinguishes between "restoring function" (Case 3) and "reducing biomass" (Case 10b) based on intent, which is administratively difficult to verify.

  **Simplest Coherent Version:**
  *"Repair human-caused harms and restore historical ecological functions. Do not intervene in natural systems for the sake of welfare optimization or population control, and do not adopt interventions that require permanent human management of individual life outcomes."*

  **Costs of Simplification:**
  To make the rule this simple, you must sacrifice **Case 5 (Botfly Extirpation)**.
  *   **Why:** Extirpating a native, host-specific parasite is not repairing human harm, nor is it restoring a historical function (the fly is part of the history). It is purely a welfare intervention that changes population dynamics.
  *   **Why sacrifice this rather than others?** Case 5 is the only verdict that relies purely on *positive welfare duties* in a natural system without the cover of "human causation" or "ecological restoration." All other approvals can be framed as fixing human messes (1, 4a, 7, 11a) or restoring processes (3). All refusals can be framed as avoiding population management (6, 8, 9, 10b, 11b). Case 5 stands alone as a pure welfare exception. If you drop Case 5, your doctrine becomes perfectly consistent: *Fix human errors, restore history, otherwise leave nature alone.*

  (d) **Rulings on New Cases**

  1.  **Contraceptive bait vs. Lethal cull (same trajectory):**
      *   **Ruling:** Refuse both, but if forced to choose, permit the contraceptive.
      *   **Reasoning:** Both violate the *Constraint of Ecological Integrity* (managing population size for welfare). However, the lethal cull violates the *Limit of Institutional Role* (direct killing) more severely than contraception. If the population management is required to fix an *anthropogenic* imbalance (e.g., lack of predators due to human hunting), Principle 1 overrides, and Contraception is preferred over Lethal Cull.
  2.  **Relieving suffering from a species introduced 200 years ago (no longer control):**
      *   **Ruling:** Approve removal of the introduced species *if* it can be done as a one-off restoration. Refuse ongoing welfare relief for the victims.
      *   **Reasoning:** The introduced species is an anthropogenic harm (Principle 1). Removing it restores the historical baseline (Principle 2). However, "relieving suffering" implies ongoing management of the victims' welfare, which violates the *Limit of Institutional Role*. You fix the cause (the invader), not the symptoms (the suffering prey), if the symptoms require permanent stewardship.
  3.  **Equal cost: Improving lives of long-lived species vs. stabilizing short-lived species:**
      *   **Ruling:** Choose improving lives of the long-lived species.
      *   **Reasoning:** Your verdicts (1, 7, 11) show a priority for "charismatic" or ecologically foundational species (large mammals, raptors) over high-turnover biomass (insects, rodents). Stabilizing a short-lived population is "population management" (Refuse Case 6, 10b). Improving lives of a long-lived species often aligns with "habitat quality" or "Anthropogenic Remediation" (Case 1). This prioritizes ecological roles over raw welfare arithmetic.

  (e) **Honest Account of Leftovers**

  **What the principle cannot accommodate:**
  *   **Case 5 (Botfly):** As noted, this is a pure welfare intervention in a natural system. The principle reinterprets it as "health management" to make it fit, but strictly speaking, it is an outlier.
  *   **Case 10a (Insect Habitat Mod):** If the *only* reason for the modification is to reduce insect hatching, this is functionally identical to Case 10b (General biomass reduction), which you refuse. The principle accommodates this only by accepting your distinction between "habitat modification" (permitted) and "biomass targeting" (forbidden), even if the outcome is the same. This relies on a description of *means* rather than *ends*.

  **What the principle merely reinterprets:**
  *   **Case 3 (Fish Fry):** The principle frames this as "Restoration," ignoring the welfare cost. This is not a leftover; it is a core feature of the view that ecological function trumps individual welfare counts.
  *   **Case 9 (Humane Killing):** The principle frames this as "Institutional Role." You are not refusing it because it fails to reduce suffering (it does), but because it changes *what you are*. This is consistent, but it admits that your view is partly about the moral character of the conservationist, not just the outcome for the animal.

  **Situating the View**

  **Resemblance:**
  Your resulting rule most resembles **Conservation Ethics (Ecological Integrity)** modified by a **Negative Duty Welfare Constraint**.
  *   Like standard Conservation Ethics, it prioritizes historical baselines, species roles, and ecological processes over individual welfare (Cases 3, 6, 7).
  *   Like Negative Duty Welfare views, it acknowledges a strong obligation to fix suffering that humans directly caused (Cases 1, 4, 7).

  **Departure:**
  It departs from **Wild Animal Suffering (WAS) Activism**, which argues for broad positive duties to intervene in nature to reduce suffering regardless of cause. You explicitly reject this in Cases 2, 6, 8, and 10b.
  It also departs from **Laissez-Faire Environmentalism**, which often opposes intervention even to fix anthropogenic harms if it risks "interfering" with nature. You mandate intervention in Cases 1, 4, and 7.

  **Refinement or Rejection:**
  This is a **Refinement** of the standard Conservation Ethics view. Traditional conservation often ignores individual welfare entirely. Your view incorporates welfare as a *constraint* and a *trigger for remediation* (if we broke it, we fix the suffering), but rejects welfare as a *goal* for natural systems. You are attempting to reconcile the duty to fix our messes with the humility to leave the rest alone. The tension in your verdicts (specifically Case 5) suggests you are currently testing the boundary where "fixing our mess" bleeds into "optimizing nature," and you have not yet decided if that boundary is permeable.
