  *(Self-Correction on the "Shutting Down" aspect)*: I need to be firm that *none* of the true versions justify *shutting down* the argument, only prioritizing. Only the false versions justify shutting it down, which is why the teacher is technically wrong to end the debate that way. I should highlight that.

  *(Refining the "Volcano" question)*: The prompt asks "which readings actually need those things to count as historical actors." I should mention specific historiographical schools. Environmental Determinism, maybe Annales School (longue durée), and Jared Diamond.

