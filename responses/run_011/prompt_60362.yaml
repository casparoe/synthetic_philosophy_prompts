answer: |-
  1.  **Truth of Premises.** The factual claims constituting the explanation must correspond to reality. An explanation built on false data (e.g., claiming the sprinkler system was turned off when it was never installed) is not a poor explanation; it is no explanation at all. Without this, you have fiction, not history.

  2.  **Causal Relevance.** The factors cited must make a difference to the outcome. This is usually tested by counterfactual dependence: if this factor were absent, would the fire still have occurred in the same way? Without this, the account is a mere list of background conditions (e.g., "oxygen was present") rather than an explanation of the specific event. This settles your first problem: explanatory force lives in the dependency relation, not the prose style.

  3.  **Contrastive Sensitivity.** An explanation must answer a specific *why-this-rather-than-that* question. Why did the mill burn *completely* rather than suffer a *contained* fire? Why *then* rather than *last week*? Without this constraint, any true antecedent counts as a cause, leading to the over-determination problem you fear. This settles your second problem: it prevents *post hoc* assembly by forcing the account to rule out nearby possible worlds where the antecedent existed but the fire did not.

  4.  **Mechanism Specification.** The account must describe the process by which the cause produced the effect, not merely assert the correlation. It is not enough to say the locked door caused deaths; one must show how the locked door interacted with panic, smoke density, and egress capacity to produce fatality. Without this, the explanation is magical thinking or black-boxing.

  5.  **Scope Consistency.** The explanation must not invoke causes that operate outside the boundaries of the account's own logic (e.g., invoking divine wrath in a structural engineering report). Without this, the explanation becomes incoherent, mixing registers that cannot be weighed against one another.

  **Explanatory Force and Post Hoc Constraints**
  Explanatory force resides in Requirement 2 (Causal Relevance). A well-written account that fails the counterfactual test is a story, not an explanation. If the foreman's decision is cited as a cause, the text must sustain the claim that had he sent them home, the fire would not have killed thirty-one people. The constraint against *post hoc* assembly resides in Requirement 3 (Contrastive Sensitivity). Because your event is over-determined, you could cite a hundred true conditions. The contrastive requirement forces the selection of only those conditions that differentiate the actual outcome from a plausible alternative. It prevents the writer from cherry-picking antecedents that fit the known conclusion but would not have predicted it beforehand.

  **Non-Negotiable vs. Camp-Specific**
  Requirements 1, 2, and 4 are non-negotiable. Any theory of explanation that allows false premises, irrelevant causes, or missing mechanisms fails to distinguish explanation from assertion. Requirements concerning "subsumption under a universal law" and "narrative emplotment" are camp-specific. The demand for universal laws belongs to the positivist tradition; it treats history as applied physics. The demand for narrative shape belongs to the constructivist tradition; it treats history as literature. Neither is strictly necessary for adequacy. A list can explain without a story; a story can explain without a law.

  **Unsatisfiable Requirements and the Eliminator**
  The subset of **Completeness** (include all causes) and **Selectivity** (include only relevant causes) is jointly unsatisfiable. You cannot have both. A complete causal history of the fire includes the Big Bang; a selective one excludes the drought because the sprinkler tank was full enough anyway. You must choose selectivity. The single requirement that eliminates the most otherwise attractive theories is **Subsumption under a Universal Law**. If you insist that every explanation must cite a general law covering the event (e.g., "combustible materials ignite when..."), you eliminate almost all historical explanation, because history deals in singularities, not repeatable experiments. This requirement is too rigid for your novel's purpose.

  **The Three Documents and Pragmatic Pluralism**
  The standard *does* differ for the coroner, the adjuster, and the organizer. This is not a failure of objectivity but a feature of pragmatic explanation. The coroner seeks *proximate legal cause* (liability); the adjuster seeks *risk classification* (contractual exclusion); the organizer seeks *systemic negligence* (political mobilization). Each asks a different contrastive question. The coroner asks, "Why did these bodies expire rather than survive?" The adjuster asks, "Why is this loss total rather than partial?" The organizer asks, "Why did this tragedy occur rather than safe labor conditions?" None is "simply right." They are adequate relative to their interests. This validates your conceit: they can all be genuine explanations while contradicting each other on what *matters*.

  **The Shuffle Test**
  Your shuffle test is a valid heuristic for distinguishing causal mechanism from narrative suspense, but it is not a philosophical absolute. If reordering sentences into bare chronology destroys the explanation, it suggests the original relied on rhetorical pacing rather than logical linkage. However, in history, temporal order *is* often part of the causal mechanism (A must precede B for A to cause B). Stripping the connective tissue might remove the *argument* for the causation, not just the *story*. Therefore, the test is useful for detecting when you are mistaking dramatic tension for causal necessity, but it should not be applied so rigidly that it strips out the logical connectors that establish *why* the sequence matters. An explanation should survive the shuffle if the *truth conditions* remain intact, even if the *persuasive flow* suffers. If the logic collapses, you have written a mystery, not an analysis.

  **Scoring the Contenders**

  The **Covering Law Model** scores poorly. It satisfies Truth and Consistency but fails on Mechanism and Contrastive Sensitivity for singular events. It forces your characters to speak like physicists, citing general laws of combustion rather than specific human failures. It eliminates the nuance required for your three rival accounts, as it demands a single, objective standard of lawfulness that ignores the pragmatic interests of the speakers.

  The **Narrative Model** scores highly on Mechanism and Scope Consistency but risks failing the Truth of Premises if "story truth" overrides "factual truth." It handles the singular event well and allows for the three different voices to shape the data differently. However, without the constraint of Causal Relevance, it risks degenerating into mere storytelling, where plot coherence substitutes for causal necessity. It passes your shuffle test only if the narrative arc mirrors the causal chain.

  The **Pragmatic/Interest-Relative Model** scores highest. It explicitly accommodates the three different documents by acknowledging that explanation is relative to the question asked. It satisfies Causal Relevance and Contrastive Sensitivity by tying them to the specific interests of the coroner, adjuster, and organizer. It avoids the trap of seeking one "God's eye view" of the fire. It accepts that the shuffle test might yield different results for different audiences, as the logical linkage depends on what the audience needs to understand. This model best serves your novel's structure.
