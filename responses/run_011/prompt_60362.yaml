      *   *Self-Correction on Shuffle Test:* I need to be careful not to dismiss it entirely. It tests for *logical dependency* vs. *rhetorical flow*. I should argue it's a useful tool for the *writer* to check causal rigor, even if philosophers of history accept narrative structure as explanatory.
      *   *Self-Correction on "Better":* Ensure I emphasize *counterfactual dependence* (if X hadn't happened, Y wouldn't have). That is the gold standard for "explanatory force."

  11. **Final Polish:** Ensure the distinction between the Coroner, Adjuster, and Organizer is clear regarding their "interests." Ensure the "over-determination" problem is tackled via the "contrastive" requirement.

