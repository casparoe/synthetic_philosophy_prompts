answer: |-
  The principle that best captures your verdicts is the **Principle of Inextinguishable Claims**: A genuine moral dilemma exists if and only if an agent faces conflicting *pro tanto* obligations where (1) the conflict is ontic rather than epistemic, (2) the conflict is not attributable to the agent's prior culpable conduct, (3) fulfilling one obligation infringes a valid moral claim that is not fully defeasible by the competing consideration, and (4) this infringement generates a specific moral remainder (guilt, atonement, compensation) owed to the claimant whose claim was infringed.

  ### 1. The Principle and Its Clauses
  **The Principle of Inextinguishable Claims**
  A situation constitutes a genuine moral dilemma if and only if:
  1.  **Ontic Conflict:** The conflict arises from the structure of the world, not merely from the agent's lack of knowledge (distinguishes Case 3).
  2.  **Clean Hands:** The conflict was not created by the agent's prior negligence or wrongdoing (distinguishes Case 2).
  3.  **Non-Defeasibility:** The overridden obligation retains normative force; it is infringed rather than merely outweighed or extinguished by the competing duty (distingu Cases 1, 4, 6a from 5, 6b, 7).
  4.  **Directed Remainder:** The infringement necessitates a moral residue (atonement, guilt, explanation) directed specifically at the party whose claim was violated, beyond ordinary regret (distinguishes Dilemmas from hard choices like Case 7).

  ### 2. Case Mapping
  *   **Clause 1 (Ontic Conflict):** Motivated by **Case 3 (Vials)**. You reject this as a dilemma because the right action exists objectively; the conflict is in the evidence, not the obligations. Deleting this would classify all uncertainty as dilemma, bloating the category.
  *   **Clause 2 (Clean Hands):** Motivated by **Case 2 (Contractor)**. You reject this because the conflict is an artifact of negligence. Deleting this would force agents to treat self-created messes as tragic dilemmas rather than rectifiable errors.
  *   **Clause 3 (Non-Defeasibility):** Motivated by **Case 5 (Rescue)** and **Case 6 (Confidentiality)**. In Case 5, the promise is *defeated* by the rescue (hence no dilemma), whereas in Case 1 (Medic), the duty to save is not defeated by the duty to save another (hence dilemma). In Case 6, the Therapist's confidentiality is conditional on no harm (defeasible), while the Defender's duty is not (non-defeasible). Deleting this would collapse Case 5 into a dilemma.
  *   **Clause 4 (Directed Remainder):** Motivated by **Case 7 (Mother)** and **Case 4 (Teacher)**. In Case 7, you suspect no dilemma because the residue is "ordinary grief" rather than a specific owed remainder. In Case 4, the atonement is owed *to the student*, marking the claim as persistent. Deleting this would make "hard choices" indistinguishable from "moral dilemmas."

  ### 3. New Test Cases
  **Case A: The Double Promise (Discriminates on Clause 2)**
  You promise two different friends to help them move on the same Saturday. You made both promises intentionally, knowing there was a risk of overlap, thinking you could juggle them. You cannot.
  *   **Principle Verdict:** Not a genuine dilemma.
  *   **Reasoning:** Fails Clause 2 (Clean Hands). The conflict is attributable to prior culpable conduct (reckless promising).
  *   **Rival View:** A strict deontologist might call this a dilemma because two promises exist.
  *   **Expected Change:** I expect your verdict might shift to "Not a dilemma" if you initially felt it was one, once you recognize the prior fault dissolves the tragic status.

  **Case B: The Whistleblower (Discriminates on Clause 3)**
  An engineer promises confidentiality to her employer. She discovers the company is dumping toxic waste that will cause chronic illness to nearby residents over ten years. She leaks the documents.
  *   **Principle Verdict:** Not a genuine dilemma.
  *   **Reasoning:** Fails Clause 3 (Non-Defeasibility). The duty of confidentiality is implicitly conditional on no significant harm to third parties (like the Therapist in Case 6b). The claim is extinguished by the harm condition.
  *   **Rival View:** A contract absolutist would call this a dilemma (Promise vs. Public Good).
  *   **Expected Change:** I expect your verdict here to align with the Therapist case (not a dilemma), confirming the conditionality of professional confidentiality.

  ### 4. Limitations and Machinery
  The principle cannot fully keep **Case 6 (The Confidentiality Split)** without added machinery. The principle states that duties must be non-defeasible, but it does not inherently explain *why* the Public Defender's duty is non-defeasible while the Therapist's is defeasible, given both involve confidentiality and harm.
  *   **Required Machinery:** You must add a **Role-Specific Conditionality Clause**. This stipulates that professional duties carry implicit conditions defined by the profession's ethical code (e.g., Tarasoff duty for therapists vs. Zealous Advocacy for defenders).
  *   **Cost:** This moves the moral work from general ethics to institutional rules. You should pay this cost because your verdicts on 6a and 6b depend entirely on these institutional distinctions; without them, the cases are structurally identical.
  *   **Abandonment Option:** If you refuse this machinery, you must abandon the verdict on **Case 6b (Therapist)** and classify it as a genuine dilemma. The case for abandoning it is that confidentiality is a prima facie duty in both cases, and distinguishing them relies on contingent legal/ethical codes rather than deep moral structure. However, given your strong intuition that "nothing is left over" for the therapist, retaining the verdict and adding the machinery is preferable.

  ### 5. Deontic Logic Repairs
  The principle requires genuine conflicts of *pro tanto* obligation, which standard deontic logic (SDL) cannot express without contradiction.
  *   **Minimal Repair:** Distinguish **_O_ (pro tanto)** from **_O_ (all-things-considered)**. SDL's closure under conjunction (_O_A_ & _O_B_ → _O_(A&B)) holds for _O_ (pro tanto) but not _O_ (all-things-considered). The implication "Ought implies Can" is rejected for _O_ (pro tanto) but retained for _O_ (all-things-considered).
  *   **Cost:** This fragments the concept of "obligation." It means an agent can be under an obligation they cannot fulfill (the untreated patient in Case 1), which feels paradoxical in ordinary language.
  *   **Application to Cases 1, 4, 6:** Under this repair, these cases involve conflicting _O_ (pro tanto) obligations. In Case 1, _O_ (Save A) and _O_ (Save B) are both true _pro tanto_. The agent chooses one, making it _O_ (all-things-considered). The other _O_ (pro tanto) persists as the source of the **moral remainder** (guilt/atonement). This explains why the agent "did nothing wrong" (followed _O_ (atc)) but still owes atonement (violated _O_ (pt)). Standard logic cannot capture the persistence of the violated obligation after the choice is made; this repair allows the obligation to survive as a residue rather than vanishing into falsehood.
