  The Hall of Shelves smelled of wet wool and old stone, but tonight it smelled of ozone. Elara stood before the pedestal, the copper coin burning a hole in her palm. The valley outside was drowning in rain, a steady drumming that usually soothe the Rite, but inside the air shimmered. The heat wasn't from the hearth; it radiated from the shelf itself.

  Three stacks. Three coins on the left. One in the middle. Two on the right. *3-1-2.*

  The Rule was a groove worn into Elara's mind since infancy, deeper than the ruts in the village mud. *Put a coin on the tallest stack.* Usually, the tallest stack reached up like a hand waiting to be filled. Tonight, the left stack sat at the ceiling. Three was the rafters. Three was the sky. You could not put a coin on the sky.

  Elara's arm twitched. The coin felt heavy as a millstone. The air in the Hall grew thick, sweltering. From the corners of her vision, things moved. Not people—the elders sat silent in the dark, faces obscured by hoods—but pressures. Ghost-limbs of actions not taken.

  A whisper brushed her left ear, cold and sharp. *Take.* It was the mirror-image itch. If you cannot put, then take. Remove a coin from the three. Make it two. The muscle in her forearm tightened, ready to pluck rather than place. The heat spiked. The shelf seemed to vibrate, rejecting the violence of subtraction. The Rule was about growth, about stacking toward the light. To take was to dig a hole in the floor. The whisper hissed, frustrated, and dissolved into the humidity.

  Another pressure bloomed behind her eyes. *Wrap.* The ceiling wasn't a ceiling; it was a loop. Three touches the sky and becomes one again. The stack would reset. The coin could land on the two, making it three. The idea felt slippery, like trying to hold water. It required the world to bend, for the rafters to become the floor. The air grew heavier, pressing down on her shoulders. The coin in her hand pulsed, out of rhythm with her heart. The Hall was too hot to breathe. The concepts were jostling, half-formed imps of logic crowding the rafters, screaming for purchase. *Take. Wrap. Stop. Break.*

  Elara squeezed her eyes shut. The heat was unbearable, a fever of impossibility. The Rule was a key that no longer fit the lock. She needed a new lock. Or a new key.

  Her mind drifted from the peak of the left stack. It slid down the side, past the hard, unyielding top coin. It slid past the middle stack. It landed on the one coin in the center.

  The stack was small. It was hollowed out. It had room.

  The concept of *Tallest* stretched. It groaned. It wasn't about height anymore; it was about capacity. It was about where the coin could *go*. The tallest stack was the one with the most room to grow. The one-coin stack was the tallest in potential.

  The heat didn't vanish; it drained away, like water down a plug. The shimmering air cleared. The whispering imps in the rafters fell silent, satisfied or suffocated, it didn't matter. They were gone. The Hall was suddenly cold, the stone floor biting through Elara's sandals. The certainty was physical, a drop in pressure that popped her ears.

  The coin was no longer heavy. It was just copper.

  The Rule had not changed. The words were the same. But the meaning had slid sideways onto its neighbor, smooth as oil. *Tallest* now meant *Hungriest*. The impossibility was gone. The path was clear.

  Elara opened her eyes. The shelf was just wood and metal. The rain outside was just rain. She extended her arm. There was no trembling. The air was still and crisp. She hovered over the single coin in the middle stack. It waited. It was the only place the coin could exist.

  She dropped it.

  *Click.*

  The sound was sharp, definitive, final. The stack rose to two. The shelf settled into a new silence. The Rite was complete. The elders exhaled in the darkness, a single collective breath they hadn't realized they were holding. Elara lowered her hand. The heat was gone. The world was solid again.

  Slip: tallest -> shortest
