answer: |-
  **Question 1**
  Can the threshold be vague without the view's collapsing into the cardinalism it repudiates, given that a vague boundary often functions mathematically as a steep slope?
  **Expected Reply:** Vagueness is epistemic rather than ontological; there is a sharp fact of the matter about where the break occurs, even if we cannot precisely locate it.
  **Follow-up:** If the fact is unknowable, on what basis do you claim moral priority attaches to that specific unknowable point rather than to the knowable aggregate of sub-threshold pain?
  **Alternative Branch (Ontological Vagueness):** If the boundary is indeterminate in reality, does a pain on the borderline lexically outweigh sub-threshold pain, or does it fail to trigger the lexical rule?

  **Question 2**
  Can any operationalization of the threshold — self-report, the defeat of agency, a stated willingness to trade years of life — avoid defining it by an exchange rate?
  **Expected Reply:** We identify it phenomenologically as the point where agency is defeated, not by what one would trade to escape it.
  **Follow-up:** If agency defeat is the marker, does a stoic who endures agony without surrendering fall below the threshold, making their suffering morally less significant than a weaker subject's?

  **Question 3**
  Can ten thousand lives each falling just below the threshold together amount to something that crosses it, and if they can, is the threshold about intensity at all?
  **Expected Reply:** No, the threshold is a property of individual experiential intensity, not aggregate volume; numbers do not bridge the lexical gap.
  **Follow-up:** If intensity alone matters, does the suffering of a single insect in extreme agony morally outweigh the cumulative mild suffering of the entire human population?

  **Question 4**
  How are two worlds that both contain threshold-crossing suffering to be compared, and in particular whether a minute of agony and a decade of it stand in any determinate relation on your account?
  **Expected Reply:** Duration matters within the lexical tier; a decade of agony is worse than a minute, even if both cross the threshold.
  **Follow-up:** If duration creates a metric within the tier, why does that same metric not bridge the gap to the sub-threshold tier, given the phenomenology of pain is continuous?

  **Question 5**
  Is the threshold fixed by intensity alone or by the psychological capacities of the sufferer, and what follows for non-human animals, whose treatment in intensive confinement plausibly exceeds any intensity threshold one cares to name?
  **Expected Reply (Assumed Branch):** It is fixed by intensity alone; non-human animals certainly qualify for lexical protection.
  **Follow-up:** Then you must accept that factory farming is arguably the greatest moral catastrophe in history, outweighing all human sub-threshold conflicts; are you prepared to rank it so?
  **Alternative Branch (Capacity):** If it requires capacity for agency defeat, then non-human animals cannot suffer threshold pain; does this not contradict the negative utilitarian impulse to prioritize suffering wherever it occurs?

  **Question 6**
  Does the reading of your view that treats the presence of any threshold-crossing suffering as decisive and the reading that treats such suffering as merely lexically prior in the aggregation yield different verdicts, and which of the two are you committed to?
  **Expected Reply:** I am committed to lexical priority; we can compare worlds with threshold suffering, but they always rank below worlds without it.
  **Follow-up:** If worlds with threshold suffering can be ranked against each other, they share a common currency; why is that currency inconvertible with the sub-threshold currency?

  **Question 7**
  Consider a clinical case like terminal sedation that relieves agony at the price of every remaining pleasure, or the allocation of a scarce analgesic: does your second commitment's common scale and your third commitment's denial of one appear to give opposite advice?
  **Expected Reply:** Commitment Three overrides Commitment Two in cases of conflict; relieving threshold agony is mandatory regardless of the sub-threshold cost.
  **Follow-up:** If the override is absolute, does your view mandate allocating all medical resources to the single person in most agony, even if thousands suffer mildly elsewhere?

  **Question 8**
  My housemate argues that your view is empty because any view that ranks worlds in this order can be rewritten as a cardinal view with a sufficiently steep weighting function.
  **Expected Reply:** That is mathematically possible but metaphysically misleading; it misrepresents the structural break in value.
  **Follow-up:** If the mathematical output is identical in all decision scenarios, what explanatory work is the "structural break" doing other than dramatizing a number?

  **Question 9**
  He further argues the view is incoherent because the moment you characterize the threshold as "unbearable," you have defined it in terms of a willingness to exchange, which is precisely the ratio you claim is undefined.
  **Expected Reply:** "Unbearable" describes a phenomenological collapse, not an economic trade-off; the exchange rate is a consequence, not a definition.
  **Follow-up:** If the phenomenology necessarily entails an infinite exchange rate, how do you distinguish the property from the rate without circularity?

  **Question 10**
  I will ask you to endorse one of two formalizations in one sentence: either the threshold is a hard discontinuity rendering values incommensurable, or it is a lexical ordering preserving comparability; please state which you endorse, and accept the consequence that the other branch would have allowed you to avoid.
  **Expected Reply (Assumed Branch):** I endorse the hard discontinuity, as it best captures the qualitative difference in suffering.
  **Follow-up:** Then you accept that no decision procedure can resolve choices between threshold and sub-threshold worlds; do you accept that your theory licenses moral paralysis?
  **Alternative Branch (Lexical Ordering):** If you endorse lexical ordering, you accept that threshold and sub-threshold values are ultimately commensurable; do you accept that your view is formally indistinguishable from the cardinalism you repudiate?
