  **Commencement Address**
  **June 6th**

  Good morning. For those of you who don't know me, I grew up here. I left. I wrote some books that people in cities read, and somehow that qualified me to stand here and tell you what your life is worth. I'll do my best not to abuse the privilege.

  I know the schedule. I know the Superintendent has to talk about the future, and the Principal has to talk about the past, and I have to talk about the "journey." I promise to keep this shorter than the history of the company buying this building. That's the joke for everyone. The joke for us is that at least the new owners won't need to fix the bleachers; they're going to store lawn tractors in here.

  We all know what's happening. After today, this school closes. The district consolidates. Forty minutes down the interstate is where the lights stay on next year. And this building, the one where you learned to drive in the parking lot and where the chemistry lab still smells like 1984, is being sold to a company that makes prefab sheds.

  It is easy to be bitter about that. It is easy to say a place that held your first kiss and your last exam deserves more than to become inventory for metal storage. But I've been thinking about the sheds. They're practical. They're honest. They hold things that matter to people: tools, bikes, the things you need to keep working. Maybe that's the right ending for a place like this. Not a monument, but a utility. A place that held you while you were being built, now used to hold the things you'll build with.

  I am aware of the narrative expected here. Usually, the person who left comes back to tell the people staying that they need to escape. The script says I should tell you that the world is wide and this town is small, and that success is measured by the distance you put between yourself and this zip code.

  I am not going to read that script.

  But I am also not going to read the other one. I am not going to stand here and tell you that staying is inherently noble, or that roots are always a virtue, or that the gravity of this place is the only thing holding you together. I have seen too many people stay because they had no other choice, and I have seen too many people leave because they were told they were worthless if they didn't. I cannot tell the difference from where I stand, and I suspect you can't always tell the difference from where you sit, either.

  There is a distinction I've been turning over in my head. There is the life you choose because it fits you. And there is the life you accept because the cost of leaving is too high. Sometimes those look exactly the same from the outside. A person at the hardware store and a person at a desk in Chicago might both be trapped, or both be free. You can't see the cage from the highway.

  My brother runs the hardware store. He has been there for fifteen years. He knows every screw in this county. When I told him I was giving this speech, I asked him what I should say about people who stay. He told me on the phone that he doesn't want to be anybody's cautionary tale or anybody's hero. He just wants to be a man who sells good paint to his neighbors.

  That sentence is the only truth I have that fits in this room.

  If you leave, you will not be a hero just for going. If you stay, you will not be a failure just for remaining. The value of your life is not determined by your coordinates. It is determined by whether you are honest about why you are there.

  The danger isn't staying. The danger is lying to yourself about whether you stayed because you loved it, or because you were afraid. The danger isn't leaving. The danger is leaving because you think you're too good for this, only to find out you're just running from yourself. The professional class—the people like me, with the editors and the flights—we like to pretend we can diagnose your life from a distance. We like to say your satisfaction is just adaptation. We say you settled. We say you didn't know what else was on offer.

  I am not going to make that claim. I do not know your good better than you do. I only know that a life bound to a place can be a good life, genuinely good, even if the arrangement that put you there wasn't fair. The justice of the system and the value of the life are two different things. You can live a true life in an unfair system. You can live a false life in a free one.

  So, to the forty-one of you. You are the last class. That makes you a bookend. You are the period at the end of a sentence that started decades ago.

  Some of you will drive the forty minutes. Some of you will drive four hours. Some of you will take over the hardware store, or the diner, or the farm. None of those paths are virtuous by default. None of them are shameful by default.

  Your job is not to validate this town. Your job is not to validate my books. Your job is to look at the options in front of you—the ones you chose, and the ones that were chosen for you—and refuse to lie about the difference. If you stay, stay because you see something here worth your time, not because you're afraid of the interstate. If you go, go because you want to see what's there, not because you think you need to be saved.

  This building is going to hold sheds. That's fine. Sheds hold tools. You are not the tools. You are the ones who pick them up.

  Don't let anyone tell you that your life is a symbol of something larger. Don't let the Superintendent tell you you're the future, and don't let me tell you you're the past. You're just the people who have to live the next day.

  My brother isn't a hero. He's a brother. He's a neighbor. He's a man who knows the difference between a Phillips and a flathead, and he knows that both have their use. Be like that. Know your tools. Know your hands. And know the truth about why you're holding them.

  Thank you. Good luck.

  ***

  **Analysis of the Bind**

  **Where the bind forced the wording:**
  The core philosophical tension—validating the *life* without validating the *system* that constrained it—forced the speech into the second person ("Your job is to..."). I could not speak in the first person plural ("We know...") without claiming a shared experience I no longer have, nor in the third person ("They stay...") without objectifying the audience. The brother's quote ("cautionary tale or hero") was the only load-bearing beam available to support the weight of the "elected vs. stranded" argument without collapsing into abstraction. The shed metaphor was forced by the constraint to acknowledge the sale without bitterness; it had to be repurposed from a symbol of loss to a symbol of utility to avoid the "bitterness" trap.

  **Where I faked it:**
  I faked the resolution of the "justice" question. The speech asserts that "The justice of the system and the value of the life are two different things," but rhetorically, I glide over the fact that an unjust system actively degrades the value of the life within it. I claimed the graduates can "refuse to lie about the difference" between choice and constraint, but in reality, economic and social constraints often make that distinction impossible to discern, even internally. I offered agency ("Know the truth about why you're holding them") as a solution to a structural problem. That is a comforting lie, necessary for a commencement address, but it sidesteps the user's fear that the "professional class" claims to know their good better than they do. By telling them how to judge their own lives, I am still prescribing the metric of judgment, which is exactly the move the user wanted to avoid. I smoothed the paradox rather than solving it.
