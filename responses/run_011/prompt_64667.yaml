answer: |-
  ### Ratings of Argumentative Moves

  **1. Priya (Move 1): "Kestrel is a retailer... § 12(c) applies by its terms... permissions cannot cut down a duty."**
  *   **Rating:** **Strong.**
  *   **Justification:** This correctly identifies the statutory trigger: § 12(c) applies to any "Retailer that sells beverage containers." Under § 12(b)(2), Kestrel fits the definition of "Retailer" (selling from a place of business in the State). The canon that permissive limitations (§ 12(d)/(e)) do not negate mandatory duties (§ 12(c)) is a sound structural reading.

  **2. Dev (Move 2): "(d) allows... only during posted business hours at the location where the containers are sold — Kestrel has no such location... (e) allows substitution... Kestrel has no stores... absurdity is evidence of meaning."**
  *   **Rating:** **Weak.**
  *   **Justification:** This conflates "store" (§ 12(e)) and "location where... sold" (§ 12(d)) with the § 12(b)(2) definition of "place of business." Kestrel has a fulfillment center. More critically, the "absurdity doctrine" requires a result that is impossible or nonsensical; requiring returns at a warehouse is inconvenient, not absurd.

  **3. Priya (Move 3): "Absurdity is on your side... coverage shrinks as retail modernizes... findings tie the duty to keeping containers out of the litter... (e) is a distance formula, not scope."**
  *   **Rating:** **Strong** (on modernization/findings); **Strong** (on § 12(e) scope).
  *   **Justification:** The argument that statutory coverage should not vanish due to market shifts is a standard anti-obsolete canon. Correctly identifying § 12(e) as an alternative compliance mechanism rather than a definitional limit on § 12(c) is textually accurate.

  **4. Dev (Move 4): "(a) is a findings clause... preamble... reference to redemption at the point of purchase describes a counter, not a cursor."**
  *   **Rating:** **Weak.**
  *   **Justification:** Findings clauses (§ 12(a)) are operative aids for resolving ambiguity, not mere preamble to be ignored. The "counter not cursor" distinction is rhetorical, not legal; "point of purchase" is not defined in the text as a physical counter.

  **5. Dev (Move 4, cont.): "More importantly... to make the duty workable... department would have to invent a mail-in procedure... Courts don't supply missing machinery."**
  *   **Rating:** **Weak.**
  *   **Justification:** This assumes the statute lacks machinery, but § 12(d) explicitly authorizes retailers to limit acceptance to posted hours and 200 containers. The "machinery" for limiting the burden exists in the text; Dev misses that Kestrel can use § 12(d) without agency rulemaking.

  **6. Priya (Move 5): "Performance is specified: accept, upon presentation by a person... How the retailer accepts is left to the retailer... expressio unius: the legislature plainly knew how to write a location limit, and wrote one only inside a permission."**
  *   **Rating:** **Strong.**
  *   **Justification:** The *expressio unius* argument is the strongest textual point in the exchange: the legislature explicitly limited *location* in the permissive § 12(d) but omitted it from the mandatory § 12(c). This suggests the duty is not geographically confined to a "sales counter."

  **7. Dev (Move 6): "If the duty is satisfied by whatever arrangement Kestrel devises, § 12(c)... requires Kestrel to design a returns program, an obligation whose content the obligor chooses."**
  *   **Rating:** **Weak.**
  *   **Justification:** This is a strawman. § 12(c) specifies the content: "accept... upon presentation." It does not require designing a program, only facilitating the statutory act of acceptance.

  **8. Dev (Move 6, cont.): "And nobody 'presents' a container to a moving van."**
  *   **Rating:** **Defensible.**
  *   **Justification:** As a factual matter, "presentation" implies a fixed point of transfer. While Priya suggests vans, the text "upon presentation" favors a stationary location where a person can physically hand over the item.

  **9. Dev (Move 6, cont.): "Finally, the 2019 amendment... drafted its entire alternative-compliance route in terms of stores was telling us who (c) is about."**
  *   **Rating:** **Defensible.**
  *   **Justification:** Subsequent amendments can inform the interpretation of prior text (legislative ratification). However, it is speculative without legislative history to confirm the omission of "online" was intentional rather than an oversight.

  **10. Priya (Move 7): "A 2019 legislature's failure to mention a business model that barely existed... is evidence of nothing... general term governs, not the expected reach of a text."**
  *   **Rating:** **Strong.**
  *   **Justification:** This is a core textualist principle: statutory terms apply to new phenomena falling within their semantic scope unless the text excludes them. "Retailer" semantically includes online sellers with a state presence.

  ***

  ### (a) Strongest Arguments and Survival

  **Priya's Strongest Argument:** The *expressio unius* point in Move 5. By placing location restrictions only in the permissive § 12(d) ("location where the containers are sold") and not in the mandatory § 12(c), the text signals that the duty to accept is not inherently tied to a specific sales counter.
  **Dev's Strongest Argument:** The "missing machinery" concern in Move 4 (specifically regarding administrative feasibility). If the statute cannot function without agency invention, it suggests the text does not apply.
  **Survival:**
  *   **Priya:** Her conclusion survives stripping away the purposivist arguments (Move 3). The text of § 12(b)(2) ("place of business") and § 12(c) ("Retailer that sells") is sufficient on its own.
  *   **Dev:** His conclusion collapses without the "absurdity" and "missing machinery" claims. The "2019 amendment" argument (Move 6) is too speculative to sustain liability exemption on its own, especially against Priya's "general term" canon (Move 7).

  ### (b) Missed Points

  **1. Textual Point: The Definition of "Retailer" vs. "Store."**
  Both students conflate "place of business" (§ 12(b)(2)) with "store" (§ 12(e)) and "location where... sold" (§ 12(d)). Kestrel has a "fulfillment center," which qualifies as a "place of business in this State" under § 12(b)(2). Dev argues Kestrel has no "location" for § 12(d) purposes, but § 12(b)(2) ties the sale to the "place of business." If the fulfillment center is the place of business, it is also the location where the containers are "sold" from, making § 12(d) applicable.

  **2. Factual Point: The Existing Service Window.**
  Both argue as if Kestrel has *no* physical interface for returns. The facts state Kestrel "does... accept in-person returns of damaged or wrongly delivered goods at a service window at the fulfillment center during posted weekday hours." This proves "presentation" is already possible at a fixed location they control. This fact negates Dev's "moving van" objection and Priya's need to argue for van returns; the mechanism already exists.

  ### (c) Bottom Line

  **Does § 12(c) reach Kestrel?**
  **Yes.** Kestrel meets the § 12(b)(2) definition of "Retailer" (selling goods including beverage containers from a place of business in Meridian). The duty in § 12(c) triggers on the status of "Retailer," not on the existence of a storefront.

  **What is Kestrel obliged to do?**
  Kestrel must accept marked beverage containers for redemption upon presentation by a person, regardless of whether Kestrel sold them.

  **Where?**
  At its **fulfillment center service window**. This satisfies the "place of business" requirement and allows for physical "presentation" (resolving Dev's van objection).

  **When?**
  During **posted weekday hours**. Under § 12(d), a retailer "may accept containers only during posted business hours." This is an authorization, not a filing requirement. Kestrel can rely on its existing posted hours for the service window.

  **Up to what limit?**
  **200 containers per person per day.** Under § 12(d), a retailer "may limit its obligation... to 200 containers." This is a statutory safe harbor available to "A retailer" without election (unlike § 12(e)). Kestrel can post this limit at the service window.

  *(Gap Flag: The phrase "outside the state capital" in the facts implies the center is within Meridian, but if "outside the state capital" were interpreted as "outside the State," Kestrel would fail the § 12(b)(2) "place of business in this State" requirement. I am proceeding on the assumption it is in-state.)*

  ### (d) Methodology Analysis

  This dispute does not genuinely turn on a choice between textualist and purposivist method; a careful proponent of each method would likely end up in **Priya's place**.

  *   **Textualism:** A textualist must start with the definition of "Retailer" in § 12(b)(2), which requires only a "place of business," not a "store." The duty in § 12(c) is unqualified by location. The limitations in § 12(d) are permissive ("may") and apply to "A retailer" generally. A textualist would conclude the text covers Kestrel but allows it to limit the burden via § 12(d). Dev's textualism relies on an "absurdity" canon that is not met (warehouse returns are not absurd) and an inference from § 12(e) ("stores") that contradicts the broader definition in § 12(b)(2).
  *   **Purposivism:** The findings in § 12(a) identify litter as the problem and redemption as the solution. Excluding 18% of the market (online sales) would frustrate this purpose. A purposivist would favor coverage to prevent the statute from obsolescing.

  **What they are actually disagreeing about:**
  They are disagreeing about **Integration vs. Segregation**. Dev argues the statute must be read as an integrated *system* where the compliance mechanisms (§ 12(d)/(e)) define the scope of the duty (§ 12(c)); if the mechanisms don't fit, the duty shouldn't apply. Priya argues the statute is *segmented*: § 12(c) creates a broad duty, and § 12(d)/(e) provide specific, non-exclusive tools to manage that duty. Priya's view better respects the plain text of the definitions and the permissive language of the limitations.
