answer: |-
  Here is the breakdown you asked for. I have evaluated these based on your specific constraints: part-time staff, entrenched managers, high turnover, and the specific funding ratchet dynamic.

  ### Part 1: Anti-Gaming Tiers (3-Year Horizon)

  **Tier 1: The Hard Barriers**
  *   **2. Denominator audits:** Random external adjudication creates a tangible risk of getting caught reclassifying deaths or declining surrenders, which is the cheapest and most effective deterrent against specific bad behaviors.
  *   **7. Radical transparency:** Publishing raw records makes collusion difficult because it outsources oversight to thousands of eyes (volunteers/press) who do not depend on the shelter for their paycheck.
  *   **1. Paired opposing metrics:** Requiring sites to optimize for save rate *and* intake volume simultaneously makes it mathematically difficult to cherry-pick easy cases without crashing the volume number.

  **Tier 2: The Soft Deterrents**
  *   **3. Shadow metric:** This detects gaming after the fact but does not prevent it, serving better as a board-level early warning system than an operational constraint.
  *   **5. Rotate the headline metric:** Randomization creates anxiety that discourages focused gaming, but part-time staff will likely default to "do everything okay" or guess the pattern, diluting the effect.
  *   **4. Percentile targeting:** This reduces the pressure to hit an arbitrary 95%, but peer groups can be manipulated or suffer from collective drift where everyone games together.

  **Tier 3: The Regression**
  *   **6. Subjective evaluation:** Relying on a supervisor to read logs reintroduces the exact bias and favoritism the dashboard was meant to cure, especially with managers who have known each other for years.
  *   **8. Dana's position (Measure nothing):** Removing quantitative guardrails returns the network to the pre-dashboard opacity that caused the original arguments, allowing poor performance to hide behind persuasive storytelling.

  ### Part 2: The Funding Ratchet Score & Tier Adjustments

  I scored these 0 to 3, where **0** means the metric hides capacity (protects funding, encourages sandbagging) and **3** means it exposes all capacity (triggers funding cuts/ratchets, risks org survival).

  *   **Option 8 (Narrative):** Score **0**. Narratives are easily spun to emphasize struggle over success.
  *   **Option 6 (Subjective):** Score **0.5**. A sympathetic supervisor can be lobbied to downplay efficiency in their year-end summary.
  *   **Option 3 (Shadow):** Score **1**. Since it is never published, funders never see the "real" number, protecting the budget while alerting the board.
  *   **Option 5 (Rotate):** Score **1.5**. Inconsistent data makes it hard for funders to draw a straight line for ratcheting.
  *   **Option 4 (Percentile):** Score **1.5**. Being "average" compared to peers is a safe place to hide; it doesn't scream "we have excess capacity."
  *   **Option 1 (Paired):** Score **2**. High volume + high save rate looks efficient, which funders love to tax, though the volume metric helps justify the need.
  *   **Option 2 (Audits):** Score **2**. Audits validate the data, making it harder to claim you are at capacity when you aren't, but the sample size leaves some wiggle room.
  *   **Option 7 (Transparency):** Score **3**. Raw data leaves no room for spin; funders will see every empty kennel and ratchet accordingly.

  **Tier Adjustments:**
  When you factor in organizational survival, **Option 7 (Radical Transparency)** drops from Tier 1 to **Tier 2**. While it stops gaming best, it creates an existential funding risk in a ratchet environment; a shelter that starves itself of revenue cannot save animals. **Option 3 (Shadow Metric)** rises slightly in practical utility because it protects the funding stream while still alerting the board, though it remains a detection tool rather than a prevention tool. **Option 8 (Dana's Position)** remains in Tier 3; while it protects funding (Score 0), it fails the primary mission of oversight so completely that it is net-negative regardless of budget stability.

  ### Part 3: Probability, Verdict, and Option 3

  **Probability of Gaming Recurring:** **0.25**
  If you adopt the adjusted Top Tier (Paired Metrics + Denominator Audits + *controlled* Transparency), the cost of gaming becomes higher than the benefit. However, given "managers who have known each other for years," collusion is never zero, hence the 25% chance.

  **Who Won the Argument:** **You.**
  Dana correctly identified Goodhart's Law, but her solution is an overcorrection that ignores the complexity of managing a three-site network. You cannot coordinate 9,000 intakes across three locations on "narratives and vibes"; you need a common language of data. The failure was not in *having* a dashboard, but in having a *single* dashboard metric without audit controls. You are right that the design was the problem, not the measurement.

  **On Option 3 (The Shadow Metric):**
  It is **not** the clever fix Dana thinks it is, but it is also not just a surveillance toy. It is a **board-level smoke detector.**
  *   **Why Dana likes it:** It lets her feel she knows the "truth" without confronting the managers.
  *   **The Risk:** If you calculate a shadow number and *do nothing* when it diverges from the public number, you are complicit in the lie. If you *do* something, you are punishing people based on a metric you told them didn't matter.
  *   **The Verdict:** Keep Option 3, but **only** as a trigger for Option 2 (Audits). If the Shadow Metric diverges from the Public Metric by >5%, that triggers a random Denominator Audit. Do not use it as a performance score; use it as a tripwire.

  **Final Recommendation:** Implement **Option 1 (Paired Metrics)** as the public face, **Option 2 (Audits)** as the enforcement mechanism, and **Option 3 (Shadow)** strictly as the tripwire that triggers the audits. This balances gaming prevention with funding stability.
