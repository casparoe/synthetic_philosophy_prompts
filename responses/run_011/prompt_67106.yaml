      *   Okay, Tier 1 = Anti-Gaming. Score = Ratchet Risk. If Ratchet Risk is high, does the Anti-Gaming Tier drop? Yes, because a metric that bankrupts you is useless.
      *   *Correction:* High transparency (Option 7) stops gaming but maximizes ratchet risk. Is that bad? For the *animals*, maybe not, but for the *org's survival*, yes. I need to weigh organizational survival.
      *   *Actually, looking at the prompt's tone:* The user wants to know what works. If a metric works but kills funding, it's not a sustainable solution. I will treat high ratchet exposure as a negative trait for the *ranking* in the second pass.

  6.  **Addressing Option 3 (Shadow Metric):**
