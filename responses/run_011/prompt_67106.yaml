      *   *Option 3 (Shadow Metric):* Internal "truth" metric vs. public metric. Good for detection, doesn't prevent gaming directly unless consequences are tied to the gap. Dana likes it as a "tamper alarm." Risk: If never published/tied to consequences, managers might ignore it. If discovered, creates distrust.
      *   *Option 4 (Percentile Targeting):* Relative performance. Reduces absolute pressure, but peer groups can collude or data can be messy. Doesn't stop internal gaming to beat peers.
      *   *Option 5 (Rotate Headline Metric):* Randomization. High cognitive load for part-time staff. Encourages general goodness but also confusion. Might lead to "prepare for everything" or "guess the metric."
      *   *Option 6 (Subjective Evaluation):* Supervisor reads logs. Prone to bias, favoritism (managers know each other), and lacks scalability. High gaming potential via storytelling.
      *   *Option 7 (Radical Transparency):* Publish raw data. Volunteers/Press oversight. High deterrent, but privacy concerns (animal records?), high effort to sanitize. Very effective against hiding things.
