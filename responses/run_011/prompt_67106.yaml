      *   User wants to fix the dashboard.
      *   The problem wasn't measurement; it was *single* measurement without audit.
      *   User is right. Measurement is necessary for a multi-site network. Narrative alone fails at scale.
      *   Probability of gaming again: Even with best controls, humans game. But with Top Tier (Audits + Paired Metrics + Transparency), it should be low. Maybe 0.2?
      *   Wait, the "Part-time staff, high turnover, managers known for years" factor increases risk. Let's say 0.35.
