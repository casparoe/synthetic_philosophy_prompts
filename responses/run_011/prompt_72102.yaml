answer: |-
  Your intuition is not just correct; it is the central tension in the entire field of value learning. You have identified that Inverse Reinforcement Learning (IRL) and Revealed Preference (RP) are indeed the same inverse problem, separated by fifty years of disciplinary drift.

  RP treats the agent as a black box that *must* be logically consistent to be legible. IRL treats the agent as a noisy optimizer that *must* be modeled to be legible.

  Here is the argument, the comparison, and the verdict for your specific goal: alignment.

  ### (a) Testability: The Prior vs. The Axiom

  You are right to suspect that in modern IRL, the prior is doing almost all the work.

  In Revealed Preference, GARP (Generalized Axiom of Revealed Preference) acts as a hard filter. If data violates GARP, the model rejects the data (or rather, rejects the hypothesis that the data comes from a utility maximizer). The content of the theory lies in its ability to say "no."

  In IRL, specifically the MaxEnt IRL family that dominates alignment research, the "noise model" (usually a Boltzmann distribution over actions) ensures that *every* trajectory has non-zero probability. There is no observation that is strictly impossible under the model, only observations that are unlikely. This means you can never falsify the model; you can only find a reward function that makes the data *less* surprising.

  **The Verdict on (a):** There is no real analogue to GARP in standard IRL. The identification is achieved entirely through regularization (the entropy term) and structural assumptions about the policy class. If you change the rationality model (e.g., from Boltzmann to quantal response, or to a planning horizon limit), the inferred reward function shifts dramatically.

  This is a feature for alignment, but a dangerous one. Humans violate GARP constantly. If you impose GARP on human data, you infer nothing. If you use MaxEnt IRL, you infer *something*, but that "something" is a mixture of the human's true values and your assumptions about their cognitive noise. The data selects among prior-permitted rewards, exactly as you suspected.

  ### (b) Constraints, MDPs, and Beliefs

  This is where the analogy breaks down, and where IRL faces a harder problem than RP.

  In RP, the budget set is assumed observable. The economist sees the prices and income. If the agent chooses bundle A over B when both were affordable, we learn something.

  In IRL, the "budget set" is the MDP (transitions, actions, observability). But in alignment, **the MDP is not given.** You do not know the true dynamics of the world the human is acting in, and crucially, **you do not know the human's belief state about those dynamics.**

  This relocates the identification problem rather than solving it.
  1.  **MDP Misspecification:** If you assume the world is deterministic and the human fails to achieve a goal, IRL infers a penalty in the reward function. If the world is actually stochastic, that penalty is spurious. You have inferred a "preference for failure" because you misunderstood the physics.
  2.  **Belief Misspecification:** This is the killer. RP assumes the agent knows what they are choosing. IRL often assumes the agent knows the transition dynamics (or learns them perfectly). If a human avoids a hallway because they *believe* it is dangerous (but it isn't), a standard IRL agent infers that the hallway has negative reward. It infers a value judgment where there is only a factual error.

  **The Verdict on (b):** IRL solves the "constraints" problem only by assuming them away or burying them in the state space. When the MDP is wrong, the reward is garbage. When the human's *beliefs* about the MDP are wrong, the reward is actively deceptive. RP avoids this by refusing to model beliefs, but that makes it useless for sequential planning. IRL models beliefs but requires you to solve an "Inverse Inverse" problem (inferring beliefs while inferring rewards), which is notoriously underdetermined.

  ### (c) Irrationality: Violation vs. Misspecification

  This is the crux of the alignment problem.

  *   **The RP Stance:** If a person chooses A over B today, and B over A tomorrow under identical conditions, they have violated stationarity/time-consistency. RP declares the agent "irrational" and stops. There is no single utility function to recover.
  *   **The IRL Stance:** IRL absorbs this. It models time inconsistency as hyperbolic discounting, or myopic planning, or action noise. It calls this "reward misspecification" or "model mismatch," but functionally, it is **redefining rationality to fit the data.**

  Is there a principled difference? **No.** In practice, "revealed preference violation" is just "reward misspecification" where the misspecification is in the optimality assumption rather than the objective function.

  However, for alignment, this distinction is vital.
  If you treat a self-control failure as a **preference** (e.g., "they smoked, so they must value smoking more than health"), you align to their impulses.
  If you treat it as a **planning error** (e.g., "they value health, but have a high discount rate"), you align to their "true" self.

  RP forces you to admit you can't distinguish these without more structure. IRL lets you pretend you can, by baking the structure (e.g., a specific discounting model) into the inference.

  ### The Final Verdict

  You asked which escape route is better for inferring what a person values from the mess of what they actually do.

  **Revealed Preference is useless for alignment.**
  It is too brittle. It requires the agent to be coherent to extract *any* signal. Since humans are fundamentally incoherent (time-inconsistent, context-dependent, socially influenced), RP yields an empty set. It protects you from inferring wrong values by inferring no values at all. That is safe, but it fails the mission.

  **IRL is necessary but currently naive.**
  IRL is the only vehicle that can handle sequential, messy, suboptimal behavior. However, your suspicion is correct: it is currently "unfalsifiable-ish." By adjusting the noise model, you can rationalize anything.

  **The Synthesis: Structural IRL with RP Constraints**
  The "better" path is not to choose one, but to use IRL's machinery with RP's skepticism. You must stop treating the "rationality model" (the noise, the planning horizon, the discount factor) as a tuning parameter and start treating it as a **structural hypothesis.**

  Here is the defended position:

  1.  **Accept Underdetermination:** Acknowledge that there is no "true" reward function waiting to be found. There is only a reward function *relative to a model of competence*. You are not inferring $R$; you are inferring $(R, \text{Competence Model})$.
  2.  **Import Falsifiability:** You need analogues to GARP for bounded agents. For example, if you model a human as a noisy optimizer, there should be *some* sequences of actions that are so improbable they reject the model. If your model explains everything, it explains nothing. You need to penalize model complexity (the rationality model itself) to prevent overfitting human errors as complex preferences.
  3.  **Separate Beliefs from Values:** This is the highest priority. You cannot align to a human's values if you conflate their epistemic errors with their instrumental goals. You need a framework that allows the human to be *wrong about the world* without inferring that they *want the wrong outcome*. This requires modeling the human as a POMDP agent, not an MDP agent, and inferring their belief state alongside their reward.
  4.  **The "No Regret" Test:** Use RP-style consistency checks as regularizers. If the inferred reward implies the human should regret their action immediately (e.g., pre-commitment devices), weight that reward function lower.

  **Conclusion:**
  Take the IRL route, because RP cannot handle the temporal messiness of human life. But do not trust the IRL output as "truth." Treat the inferred reward as a **latent variable in a causal model of human error.**

  The wall you identified is real. RP climbed over it by demanding the human be a logic gate. IRL climbed over it by assuming the human is a noisy calculator. For alignment, you must assume the human is a **broken calculator trying to do logic.** Your job is not to read the output (behavior), nor to read the intended sum (reward), but to reverse-engineer the circuitry (competence model) to find where the wires are crossed.

  If you don't model the brokenness explicitly, you will align to the brokenness. That is the risk IRL runs that RP avoids. But since RP infers nothing, IRL is the only game in town—provided you treat the "rationality assumption" as the most critical variable to get right.
