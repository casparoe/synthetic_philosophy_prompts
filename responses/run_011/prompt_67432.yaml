          *   "Don't fish for 5 stars" policy.
          *   Platform reserves right to deactivate (shadow ban/remove).
      *   **Core Questions:**
          *   What picture of cooperation does this apparatus presuppose?
          *   Reconstruct the design's commitment (separate necessary features from incidental ones).
