answer: |-
  **Title:** The Ledger of Rationality: Why Good's Theorem is Bookkeeping, Not Law

  **Thesis:** Good's Theorem is not a deep fact about rationality; it is a piece of bookkeeping. It is a consistency check internal to a specific model of agency, not a universal normative command. Of the two cases you presented, Case 1 (Suspense) is significantly more damaging to the theorem's claim to normative authority than Case 2 (Finite Additivity). Case 2 exposes a technical limitation in the mathematical machinery; Case 1 exposes a substantive limitation in the axiology. The standard "repairs" are not fixes but boundary markers, and the slogan that one "ought to conditionalize" survives only as a hypothetical imperative: *if* you value only world-states, *then* you ought to seek information.

  ### The Nature of the Theorem

  To decide whether Good's Theorem is deep or empty, we must distinguish between a *normative law* and a *structural constraint*. A normative law tells you what you should do regardless of your specific goals (e.g., "Do not contradict yourself"). A structural constraint tells you what follows *if* you adopt a specific set of goals and rules (e.g., "If you play by chess rules, a bishop moves diagonally").

  Good's Theorem falls squarely into the latter category. It proves that *within the framework of standard Bayesian expected utility theory*, information has non-negative expected value. It does not prove that standard Bayesian expected utility theory is the correct model of rationality. To treat the theorem as a deep fact about rationality is to confuse the map with the territory. It tells us about the properties of the Bayesian map, not the terrain of rational agency itself.

  ### Case 1: The Axiological Bullet

  Your first case involves an agent who derives utility from suspense—specifically, from holding a credence of 0.5 regarding a future outcome. Your arithmetic is correct.
  *   **Refuse Note:** Expected Prize (5) + Suspense (6) = 11.
  *   **Take Note:** Expected Prize (10) + Suspense (0) = 10.
  *   **Result:** The rational agent refuses free information.

  This is the more damaging case because it attacks the *purpose* of inquiry, not just the math. Good's Theorem assumes that utility is a function of world-states and actions, $U(a, w)$. It explicitly assumes utility is *not* a function of the agent's credence function, $U(a, w, P)$.

  The "Deep Fact" camp might argue that this is just a repair: "Real rationality requires utility to depend only on world states." But this is not a repair; it is a substantive philosophical claim about value. It asserts that mental states like suspense, hope, or dignity have no intrinsic value, only instrumental value. This is a controversial axiological stance, not a logical truth. Many humans reasonably value the *process* of uncertainty (the suspense of a mystery novel, the tension of a game) independently of the outcome.

  If Good's Theorem only holds for agents who do not care about their own mental states, then it cannot be a universal law of rationality. It is a theorem about *consequentialists* who view their own minds as transparent tubes for processing data, not as loci of value. Case 1 shows that the theorem's "normative work" is purchased by excluding a vast class of plausible human preferences. That makes it bookkeeping: it balances the ledger only by refusing to count certain entries.

  ### Case 2: The Mathematical Glitch

  Your second case involves finite additivity and the failure of the Law of Total Probability (LTP) in countable partitions (non-conglomerability).
  *   **The Math:** If $P(X) > P(X|E_i)$ for all cells $E_i$ in a partition, updating on any $E_i$ lowers your credence in $X$. If you hold a bet on $X$ that is favorable at $P(X)$ but unfavorable at $P(X|E_i)$, free information causes you to abandon a winning bet.
  *   **The Damage:** This shows the proof of Good's Theorem relies on standard probability axioms (specifically countable additivity or conglomerability).

  While serious, this is less damaging than Case 1. It is a technical edge case concerning infinity. In finite decision problems—which constitute almost all actual human deliberation—finite additivity suffices for the LTP to hold. We can "repair" Good's Theorem for practical purposes simply by restricting its domain to finite partitions.

  Case 2 says the theorem breaks for agents dealing with specific kinds of infinities. Case 1 says the theorem breaks for agents dealing with *life*. The former is a limitation of measure theory; the latter is a limitation of the Bayesian conception of value. Therefore, Case 1 is the stronger argument for the "bookkeeping" verdict. It demonstrates that the theorem is not robust against reasonable variations in what agents care about.

  ### The "Repairs" are Boundary Conditions

  You asked whether the standard repairs (assume utility independence, assume countable additivity) are genuine repairs or just relabeling. They are **boundary conditions**, which is a polite way of saying they are relabeling.

  Calling them "repairs" implies that Good's Theorem *should* hold universally, and we are tweaking the assumptions to make it work. But the assumptions *are* the theorem. If you remove the assumption that utility is independent of belief, the inequality $EU(info) \ge EU(no\_info)$ no longer follows. If you remove countable additivity, the summation in the proof fails.

  Acknowledging this does not save the theorem's normative status. It clarifies that the theorem is a conditional statement: "For agents with utility function type $A$ and probability function type $B$, information is valuable." To present this as a general argument for seeking truth is to hide the premises in the conclusion. It is bookkeeping because it merely confirms that the definitions of "Bayesian Agent" and "Value of Information" are consistent with each other.

  ### What Remains of the "Ought"?

  If Good's Theorem is bookkeeping, what becomes of the slogan that you "ought always to conditionalize on your total evidence"?

  It loses its categorical force and becomes a **hypothetical imperative**.
  *   **Old Slogan:** "You ought to conditionalize because information is always good."
  *   **New Slogan:** "If you want to maximize expected utility defined over world-states, and you have standard probabilities, then you ought to conditionalize."

  This is still useful advice for specific contexts (e.g., scientific inquiry, gambling, engineering), where suspense and epistemic emotions are irrelevant noise. But it cannot ground a general epistemology. It cannot tell a poet, a gambler seeking a thrill, or a anxious patient why they *should* seek the truth. In those cases, the "ought" dissolves. The normativity of evidence is contingent on the normativity of your utility function.

  ### The Shakiest Step

  I must flag the step in my own argument that is on thinnest ice: **My defense of belief-dependent utility as rational.**

  In Case 1, I argued that valuing suspense makes the agent rational, and thus Good's Theorem fails to apply to rational agents. However, a hardline Bayesian (following Savage or Joyce) would argue that a rational utility function *must* be defined over world-states, not beliefs. They would claim that if you value suspense, that value should be modeled as a consequence in the world-state (e.g., "The state of 'waiting in suspense'"), not as a function of the credence itself.

  If suspense can be fully captured by expanding the state space to include "mental states as outcomes," then Good's Theorem might be rescued. The agent would compare the state {Prize + Suspense} against {Prize + No Suspense}. If the theorem holds over this expanded space, then my claim that Case 1 breaks the theorem is wrong.

  **Why I think this rescue fails:** Good's Theorem relies on the information *changing* the probability distribution over states to allow better action selection. If the "state" includes "my current credence," then receiving the information *changes the state itself* before the action is taken, independent of the external world. The standard proof assumes the state $w$ is fixed and only our knowledge of it changes. If the utility function depends on the knowledge state, the "states" in the "before" and "after" calculations are not comparable in the way the theorem requires. The convexity argument (max of averages vs average of maxima) breaks because the utility function is shifting under the maximization.

  However, this is technical. The philosophical vulnerability remains: I am asserting that it is rational to care about one's own credences intrinsically. If you accept the premise that rationality requires "state-separability" (utility depends only on external facts), my entire critique of Case 1 collapses, and Good's Theorem regains its normative force *for those who accept that premise*. My argument rests on the claim that state-separability is too restrictive for a general theory of rationality. That is a substantive ethical claim, not a logical one, and it is open to debate.

  ### Conclusion

  Good's Theorem is bookkeeping. It is a mathematical demonstration that the Bayesian engine runs without leaking value *if* you fuel it with specific assumptions. Case 1 shows that the fuel (utility independence) is not universally available. Case 2 shows that the engine (probability calculus) has known failure points at infinity.

  The "Deep Fact" camp is mistaking internal consistency for external truth. The theorem proves that Bayesians are consistent, not that they are right. We should retain the theorem as a tool for checking coherence within a model, but discard the idea that it proves the inherent value of truth. Information is only as valuable as the utility function allows it to be. Sometimes, ignorance really is bliss, and Good's Theorem is just the ledger that proves you paid for it.
