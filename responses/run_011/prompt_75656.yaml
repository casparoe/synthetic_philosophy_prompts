answer: |-
  Here is the preparation for your question period, tailored to the technical sensibilities of a microtheory seminar.

  ### 1. The "Which Axiom?" Challenge
  **Who:** Senior Social Choice Theorist
  **Damage:** High. If you cannot pinpoint the formal locus of comparability, your claim that it is "imported" looks like hand-waving.
  **Idiom:** "You say comparability is an input. But the theorem starts with ordinal preferences over lotteries. At which specific step in the derivation does the common scale enter? Is it the Pareto axiom itself? If Pareto imposes the scale, then Pareto is not a minimal efficiency condition; it is a substantive ethical assumption."

  **Concession:** "You are right to press for the formal locus; it is not an extra assumption tacked onto the theorem, but embedded in the application of Pareto to vNM functions."

  **90-Second Answer:**
  "The common scale enters precisely when we require the social ordering to satisfy the vNM axioms *given* that individual orderings already satisfy them. If we treat individual utilities as merely ordinal, Pareto yields no specific form. To get the linear sum, we must treat individual utilities as cardinal. But to get a *single* sum, we must treat those cardinals as commensurable. My claim is that the Pareto axiom, when applied to cardinal utilities, silently performs this commensuration. It assumes that a 'unit' of utility for person A can be traded for a 'unit' for person B without remainder. So, I concede Pareto is doing the work. But that means Pareto is not the neutral efficiency principle it is often cast as; it is the carrier of the interpersonal comparison. The theorem doesn't generate the comparison; it exposes that Pareto requires it to function in this context."

  **Unestablished Step:** You are asserting that Pareto *requires* commensuration to yield the sum. A formalist could argue Pareto only requires ordinal ranking, and the sum comes from the Social vNM axiom. You cannot prove at the podium that Pareto *forces* the scale rather than the Social vNM axiom doing it independently.

  ### 2. The Ex Ante Pareto Violation
  **Who:** Junior Social Choice Theorist / Game Theorist
  **Damage:** High. This is the standard Diamond critique. If you admit to violating Ex Ante Pareto, you must justify why a dominant principle of welfare economics is discardable.
  **Idiom:** "In the fair lottery case, both agents prefer the 50-50 flip to the sure allocation. Ex Ante Pareto demands society prefer the flip. Your sum-ranking is indifferent. You are explicitly violating Ex Ante Pareto. Isn't this just begging the question against prioritarianism or egalitarianism?"

  **Concession:** "I am explicitly rejecting Ex Ante Pareto in cases where preferences are driven by the distribution of risk itself."

  **90-Second Answer:**
  "I accept the violation of Ex Ante Pareto, but I deny it is question-begging. Ex Ante Pareto aggregates preferences over lotteries. In the fair lottery case, the agents' preference for the flip is not based on their own consumption prospects—which are identical in expectation—but on the *procedure* of allocation. They have a 'taste for gambling' on who gets the good. My argument is that social welfare should aggregate interests in outcomes, not tastes over procedures of allocation. If we credit preferences generated solely by the desire for ex ante fairness, we are double-counting: once in the outcome utility and once in the risk preference. The theorem remains valid as an aggregation of outcome-utilities; it simply refuses to treat procedural preferences as sovereign inputs."

  **Unestablished Step:** You are drawing a normative distinction between "outcome interests" and "procedural tastes." The model treats all vNM preferences identically. You cannot formally distinguish a "legitimate" preference from a "gambling" preference within the vNM framework without adding new axioms you haven't defined.

  ### 3. The Behavioral Attack on Independence
  **Who:** Behavioral Economist
  **Damage:** Medium. They know vNM is descriptively false. They will ask if your "instrument" breaks if the handle is cracked.
  **Idiom:** "Your whole story rests on individuals having vNM utilities. We know people violate Independence. Allais preferences are robust. If individuals aren't expected utility maximizers, Harsanyi's theorem doesn't get off the ground. Is your 'instrument' useless for real humans?"

  **Concession:** "If the goal is descriptive accuracy of decision-making, the instrument is indeed broken by violations of Independence."

  **90-Second Answer:**
  "However, my paper is not about descriptive psychology; it is about the logic of justification. Even if humans violate Independence, the theorem tells us what follows *if* we commit to treating individuals as rational agents in the vNM sense. The behavioral violations show where the idealization fails, not where the logic is wrong. Furthermore, the 'imported comparability' claim holds regardless: any aggregation rule that respects rationality constraints will need to fix a scale across persons. Whether that scale is vNM or rank-dependent, the problem of interpersonal comparison remains an input. The theorem isolates the structural requirement of comparability, which survives the specific vNM formulation."

  **Unestablished Step:** You are assuming the "structural requirement of comparability" is invariant across different decision theories (e.g., rank-dependent utility). This is a technical claim you haven't proven; a different decision theory might aggregate without requiring a shared affine scale.

  ### 4. The Measurement Objection
  **Who:** Measurement Theorist (Philosophy of Science)
  **Damage:** Medium-Low. They care about empirical meaningfulness.
  **Idiom:** "You say the shared affine transformation is imported. But is it empirically meaningful? If I cannot observe the zero point or the unit across persons, isn't this statement cognitively meaningless?"

  **Concession:** "The shared scale is not directly observable in the way physical units are."

  **90-Second Answer:**
  "It is theoretically meaningful rather than empirically measurable. In measurement theory, we often posit structural constraints to make a representation unique. Here, the 'shared affine transformation' is a constraint we impose to make the social representation unique. It is a stipulation of the model, not a discovery of nature. My point is precisely that economists often treat it as a discovery generated by the theorem, when it is actually a stipulation required to make the theorem run. The lack of direct observability confirms my thesis: it is a moral premise disguised as a technical parameter."

  **Unestablished Step:** You are conflating "moral premise" with "model stipulation." Just because a parameter is unobservable doesn't make it moral; it could be a mathematical necessity for representation unrelated to ethics.

  ***

  ### The Killer Objection: The Triviality Charge
  **The Attack:** "If the axioms (Pareto + vNM + Anonymity) *entail* the shared scale and the sum, and you admit those axioms *are* the moral premises, then the theorem is tautological. It adds no analytical value. You say it's an 'instrument for locating premises,' but if the premises are just the axioms restated, the theorem is empty. It doesn't locate them; it *is* them."

  **Why it hurts:** This undermines your core thesis. If the theorem is just a complex way of saying "Assume utilitarianism to get utilitarianism," your claim that it is an *instrument* for discovery collapses. It renders your paper a semantic critique rather than a structural one.

  **Survival Assessment:**
  *   **The "Instrument" Claim:** **0% Survival.** If the Triviality Charge sticks, you cannot maintain that the theorem *locates* premises distinct from the axioms themselves. You would have to concede the theorem is merely a representation result.
  *   **The "Comparability is Imported" Claim:** **50% Survival.** You can still argue that the *interpretation* of the axioms imports comparability, even if the math is tautological. The philosophical point stands even if the technical novelty fades.
  *   **The "Ex Ante Pareto" Claim:** **100% Survival.** This argument is independent of the theorem's triviality. Whether Harsanyi is deep or shallow, your defense of sum-ranking against the Diamond critique (regarding tastes for gambling) remains a coherent normative stance.

  **Strategy:** If this comes up, pivot immediately to the Ex Ante Pareto point. Concede the tautology risk but argue that *recognizing* the tautology is the philosophical work your paper does, clearing the ground for the second claim about lotteries.
