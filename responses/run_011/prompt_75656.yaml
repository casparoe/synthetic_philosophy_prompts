          *   *Defense:* Normative force remains even if descriptive fails.
          *   *Weakness:* If the axioms are normatively unappealing, the "instrument" is broken.

      *   *Objection 3: The Ex Ante Pareto / Diamond Critique.*
          *   *Who:* Social Choice Economist.
          *   *Content:* You say we shouldn't credit tastes for gambling on others. But Ex Ante Pareto says if everyone prefers the lottery, society should too. You are violating Pareto to save Utilitarianism.
          *   *Damage:* High. This is the core technical conflict.
          *   *Concession:* Yes, I am rejecting Ex Ante Pareto in favor of Ex Post.
          *   *Defense:* Ex Ante Pareto counts illegitimate preferences (envy/gambling).
          *   *Weakness:* Defining "legitimate" preferences is outside the model.

      *   *Objection 4: Measurement/Operationalization.*
          *   *Who:* Measurement Theorist.
          *   *Content:* How do you observe the "shared affine transformation"? If it's not observable, it's metaphysical.
          *   *Damage:* Medium.
          *   *Concession:* It's not directly observable.
          *   *Defense:* It's a structural requirement for coherence.
          *   *Weakness:* Risks sounding like hand-waving.

  4.  **Refining and Ranking:**
      *   *Rank 1 (Highest Damage):* The "Which Axiom?" question regarding Claim 1. If the user can't pinpoint *where* comparability enters, the "instrument" claim is vague. Social choice theorists will demand the specific axiom.
      *   *Rank 2:* The Ex Ante Pareto violation. This is the standard Diamond critique. The user's response ("tastes for gambling") needs to hold up against the definition of Pareto.
      *   *Rank 3:* The Behavioral/Independence attack. Easy to deflect as "normative vs. descriptive," but still annoying.
      *   *Rank 4:* Measurement/Operationalization. Important for the philosophy person, less for the economists.

  5.  **Drafting the Responses (adhering to constraints):**
      *   Need specific concession sentences.
      *   Need 90-second spoken answers (approx. 130-150 words).
      *   Need to identify the "unestablished step."

  6.  **Identifying the "Killer" Objection:**
      *   What kills the paper? If the "shared affine transformation" is shown to be *equivalent* to assuming utilitarianism directly, then the theorem adds nothing. It's not an instrument; it's a restatement.
      *   *Survival:* If this hits, the "instrument" claim dies. The "ex ante" claim might survive as a separate point.

  7.  **Review against Constraints:**
