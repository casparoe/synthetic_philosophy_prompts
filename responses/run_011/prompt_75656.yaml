prompt: |-
  My paper contends that Harsanyi's aggregation theorem has been miscast as a proof of utilitarianism when it is really an instrument for locating the moral premises that do the work. Two claims. First, the theorem yields a social ordering over lotteries of social states representable as a sum of individual utilities only because its axioms have already fixed each person's von Neumann–Morgenstern utility function up to an affine transformation shared across persons; the interpersonal comparability is imported, not generated. Second, once that comparability is granted, the theorem is untroubled by the charge that it flouts ex ante Pareto: the familiar case of the fair lottery over which of two people receives a single indivisible good shows only that the sum-ranking declines to credit people's tastes for gambling over one another's fortunes.

  The venue is a microtheory seminar — mostly social choice economists, one behavioral economist who publishes on failures of the independence axiom, and a measurement theorist from the philosophy of science side. No one there works on population ethics or on normative ethics. Nobody will ask whether utilitarianism is true; they will ask which axiom is carrying the conclusion and whether it can be tested.

  Prepare me for the question period. Give the objections this room will actually press, in the sequence and idiom in which they will arrive, ranked by the damage each could do; for each, the sentence I should concede before defending anything, an answer I can deliver aloud in ninety seconds, and the step at which that answer leans on something I cannot establish at the podium. Reasoning only, no bibliography. Finish by naming the line of attack that would leave the paper unrecoverable, and say candidly how much of my position survives it.
reasoning: |-
  Here's a thinking process that leads to the suggested preparation:

  1.  **Analyze the User and the Request:**
      *   **User:** An academic philosopher or economist presenting a paper on Harsanyi's Aggregation Theorem.
      *   **Paper's Core Claim:** Harsanyi's theorem isn't a proof of utilitarianism but a tool to locate moral premises.
      *   **Two Sub-claims:**
          1.  Interpersonal comparability (IPC) is imported via the axioms (specifically the shared affine transformation), not generated by the theorem.
          2.  The "ex ante Pareto" objection (e.g., the fair lottery case) fails because the sum-ranking simply doesn't value "tastes for gambling on others' fortunes."
      *   **Audience:** Microtheory seminar. Mostly social choice economists, one behavioral economist (skeptic of Independence), one measurement theorist (philosophy of science). *Not* normative ethicists or population ethicists.
      *   **Audience Focus:** Axiomatic structure, testability, technical consistency, not "Is utilitarianism true?"
      *   **Task:** Prepare for the Q&A.
          *   List objections in sequence/idiom, ranked by damage.
          *   For each: Concession sentence, 90-second answer, hidden assumption/weakness.
          *   Final: The "killer" objection and survival assessment.
      *   **Constraints:** Reasoning only, no bibliography.

  2.  **Deconstruct the Paper's Argument vs. Audience Expertise:**
      *   *Claim 1 (IPC is imported):* Economists know Harsanyi requires cardinal utility. They know vNM utilities are unique up to positive affine transformations. The tricky part is the *shared* scale. Standard Harsanyi assumes we can compare levels/units. The user argues this is an input, not an output. This aligns with standard technical critiques (e.g., Sen, Weymark), but the audience will want to know *which* axiom does the importing.
      *   *Claim 2 (Ex Ante Pareto):* This is the Diamond critique (1967). Diamond argues a social planner should prefer a fair coin flip (ex ante equality) over giving it to person A for sure, even if ex post welfare is the same. Harsanyi/Utilitarianism is indifferent. The user argues this indifference is fine because "tastes for gambling on others" shouldn't count.
      *   *Audience Vibe:* Social choice theorists love axioms. They will pounce on "which axiom breaks Pareto?" or "is Independence plausible?" The behavioral economist will attack Independence. The measurement theorist will attack the meaningfulness of the "shared affine transformation."

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1: The Axiomatic Source of Comparability.*
          *   *Who:* Social Choice Economist / Measurement Theorist.
          *   *Content:* You say comparability is imported. Fine. Which axiom imposes the common scale? Is it the Pareto axiom itself? If so, you haven't located the moral premise; you've just hidden it inside Pareto.
          *   *Damage:* High. If the moral work is done by Pareto + Independence, and Pareto is supposed to be neutral, the claim that it's just an "instrument" weakens.
          *   *Concession:* Acknowledge Pareto does the heavy lifting.
