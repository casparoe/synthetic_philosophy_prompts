answer: |-
  Here is the principle that reconciles your verdicts, stated precisely.

  ### The Macro-Causal Validity Principle

  A high-level pattern $P$ (a simmball, belief, rumor, etc.) is granted causal credit for an effect $E$ if and only if it satisfies all three of the following clauses:

  **Clause 1: Realization Robustness**
  The effect $E$ persists if the low-level physical substrate constituting $P$ is altered, provided the pattern $P$ itself is preserved.
  *   *Mechanic:* This establishes that the causation resides in the *arrangement*, not the *stuff*.
  *   *Handles:* **The Rumor** (sound waves vs. text vs. digital packet), **The Note** (ink vs. pixels), **The Placebo** (different neuron sets firing for the same belief content).
  *   *Excludes:* **The Kettle/Tea** (Boiling happens regardless of "tea time"; the correlation is not robust to changing the time).

  **Clause 2: Functional Constraint**
  The existence of pattern $P$ must actively restrict the degrees of freedom of the low-level components *during* the production of $E$. $P$ must act as a boundary condition or a gate, not merely as a geometric summary.
  *   *Mechanic:* This distinguishes between a pattern that *shoves* (a wall, a rule, a signal) and a pattern that *traces* (a shadow, a shape, a wake).
  *   *Handles:* **The Simmball** (physically blocks other balls), **The Placebo** (belief state inhibits pain-signaling neurons), **The Note** (ink pattern constrains future eye-movements and decisions), **The Traffic Jam** (the wave structure forces cars to zero velocity).
  *   *Excludes:* **The Smoke Ring** (The *roundness* is a description of the air flow, not a constraint on it. The air molecules are not stopped or directed by the "roundness"; they are directed by pressure gradients. The shape is a trace, not a wall).

  **Clause 3: Informational Screening**
  Knowing the state of $P$ renders knowledge of the specific low-level details redundant for predicting $E$. The micro-details become noise relative to the macro-signal.
  *   *Mechanic:* This ensures the macro-level is the *efficient* cause. If you need the micro-details to predict the outcome, the macro-pattern isn't doing the work.
  *   *Handles:* **The Market Crash** (Knowing the specific trades adds nothing if you know the rumor; the rumor screens off the trades), **The Neural Macro** (Knowing the specific weights matters less than knowing the feature activation).
  *   *Excludes:* **The Smoke Ring** (To predict where the ring goes, you need the fluid dynamics (micro), not just the fact that it is "round" (macro). The shape does not screen off the physics).

  ***

  ### The Simpler Rule and Its Cost

  You asked for the simpler rule. The simplest rule is **Micro-Physical Exclusivity**: *Only the lowest-level physical particles and forces have causal power. High-level patterns are just descriptive shorthand.*

  **The Cost:**
  If you adopt this rule, you must surrender **all** your verdicts where a pattern gets credit.
  1.  **The Rumor:** You must say the rumor did *not* cause the crash; only the specific sequence of buy/sell orders did. The rumor is just a story you tell to compress the data.
  2.  **The Placebo:** You must say the belief did *not* heal the patient; only the neurochemical cascade did. The "belief" is an epiphenomenal label.
  3.  **The Note:** You must say the ink did *not* cause the action; only the photon reflection and retinal firing did.
  4.  **The Traffic Jam:** You must say the wave is an illusion; only the individual braking cars exist.

  **Would I take the deal?**
  No. While Micro-Physical Exclusivity is technically defensible in a closed physical system, it renders explanation impossible for complex systems. It forces you to describe a market crash in terms of electron flows in trading servers rather than investor sentiment. It sacrifices *predictive leverage* for *ontological purity*. The 3-clause principle above preserves the utility of high-level explanation without violating physics, by defining causation as **constraint propagation** rather than just energy transfer.

  ***

  ### Application: The Angry Text

  **Case:** Deciding not to send an angry text because the thought "this'll make it worse" stops your thumb.

  **Verdict:** This is **genuine downward shoving**.

  **Mechanics:**
  1.  **Realization Robustness:** The thought could be realized by different neural firing patterns (e.g., on a different day, or in a slightly different mood) and still stop the thumb.
  2.  **Functional Constraint:** The thought acts as an inhibitory signal in the motor cortex. It actively restricts the degrees of freedom of your muscles (preventing the tap). It is a boundary condition, not a trace.
  3.  **Informational Screening:** Knowing you had the thought "this'll make it worse" predicts the non-sending better than knowing the specific millivolt potential of the neurons involved.

  **Conclusion:** The thought is a simmball. It clumps neural activity into a functional unit that exerts force on the physical world (your thumb).

  ***

  ### Application: The Neural Network Feature

  **Case:** A feature inside a trained network that reliably tracks a property of its inputs (e.g., a "dog detector" neuron cluster).

  **Verdict:** This is a **simmball doing the shoving**.

  **Mechanics:**
  1.  **Realization Robustness:** You can prune the network or retrain it with different random seeds (changing the weights/micro-substrate), and as long as that feature activation remains, the network classifies the image as "dog."
