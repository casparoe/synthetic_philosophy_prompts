  **Triage Procedure for Meta-Claims**

  1.  **Check Grounding:** Does the claim's truth depend on external facts (e.g., biology) or registry states (e.g., "Entry 5 is confirmed")? If registry states, proceed. **[JUDGMENT: Distinguishing mixed claims relies on volunteer intuition.]**
  2.  **Establish Hierarchy:** List all Entry IDs mentioned. Look up their status. If any target is "Unresolved", mark this submission **Hold**. Meta-claims cannot be grounded if their foundations are pending.
  3.  **Detect Loops:** If Entry A cites Entry B, and B cites A (or leads back to A), **Reject**. Circular claims lack grounded truth values.
  4.  **Check Self-Reference:** Does the claim refer to its own final status (e.g., "This will not be confirmed")? If yes, **Escalate**. Do not assign status.
  5.  **Assign Status:** If dependencies are resolved and non-circular, match the target's status. If target is Confirmed, Confirm this. If Refuted, Refute this. **[JUDGMENT: Matching status assumes logical equivalence that may not hold.]**

  **Running the Procedure**

  1.  **"Entry 2210 is confirmed."** **Confirm.** Step 5 applies. 2210 is confirmed externally; this meta-claim accurately reflects that state. It is grounded in the registry's existing truth.
  2.  **"Entry 4471 is refuted" (where 4471 ↔ 4502).** **Reject.** Step 3 detects a loop. 4471 depends on 4502, which depends on 4471. Neither can be grounded; the truth value floats without anchor.
  3.  **"No entry tagged mercury is confirmed" (this is the only mercury entry).** **Escalate.** Step 4/2 conflict. If Confirmed, it falsifies itself. If Refuted/Unresolved, it becomes true, but the status says otherwise. This is a variant of the Liar Paradox caused by set inclusion.
  4.  **"This entry will not be confirmed."** **Escalate.** Step 4 triggers. Truth depends entirely on the act of classification. It is performatively contradictory.

  **The Pipeline Problem (Example 4)**

  Triage cannot survive Example 4 with your current pipeline. Because "Unresolved" collapses to "False" downstream, marking Example 4 as Unresolved makes the bot broadcast "False." But the claim ("This will not be confirmed") becomes *true* if marked Unresolved. You create a lie by trying to be safe. If you Confirm it, the claim is false, but the bot broadcasts "True."

  The fix must be in the pipeline, not triage. You need a fourth status (e.g., "Void" or "Meta") that is stripped before the API feed, or you must ban self-referential meta-claims entirely. Triage can only flag these; it cannot resolve the semantic contradiction caused by your downstream logic.

  **Operational Notes**

  **A Result You Will Hate:** The procedure forces you to **Reject** Example 2. You lose valid data about the relationship between 4471 and 4502 because the logic is circular, even if the volunteers feel there's "something there." Efficiency demands cutting the knot, but it feels like data loss.

  **Limitations**
  *   Cannot resolve performative contradictions (like Example 4) without pipeline changes.
  *   Cannot verify meta-claims if target entries are still pending.
  *   Cannot distinguish nuanced logical errors from simple falsehoods without expert review.
