  1. *Pre-grading analysis.* A claim-by-claim triage of the response: extract each substantive assertion the candidate makes and tag it correct, partly correct, incorrect, or irrelevant-but-harmless. Note at this stage which of the errors are blatant and which are subtle enough that a hurried grader reading at speed would have passed them by. Do not assign marks yet.
  2. *The mark.* A single figure out of 100, plus sub-marks for (a), (b) and (c) out of 40, 30 and 30 respectively, each with one or two sentences of justification. Do not penalise the same underlying mistake twice, and do not treat a real mistake as costless.
  3. *Margin comments.* Point-by-point comments keyed to the parts, written in the second person and addressed to the candidate, each specific enough that they can locate the passage being praised or corrected without my having to reproduce their text back to them. Include credit where credit is genuinely due — the answer is not uniformly weak, and a comment sheet that only lists faults would misdescribe it.
  4. *Subtle-error dossier.* For each error you identified in step 1 as one a hasty grader would likely have missed: state exactly what the candidate asserts, spell out the reasoning that shows it is wrong rather than merely labelling it, give the correct analysis, and say how much it should cost. Where an error also creates an internal inconsistency with another part of the same answer, point that out explicitly.
  5. *Charitable readings.* Identify any passage where a more charitable construal would rescue the candidate, state which construal you have adopted, and explain why — including whether the wording of the question itself invited the error.
  6. *Note to the candidate.* 120–160 words, constructive and specific, introducing no new technical vocabulary beyond what the question already used.

  Be decisive throughout. If you are genuinely uncertain about some point of doctrine, say so in a single sentence and mark provisionally rather than hedging across the whole assessment.
