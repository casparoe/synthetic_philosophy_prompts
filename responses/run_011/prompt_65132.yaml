  9.  **Refining the "Mind-Changing" Aspect:**
      *   Why will #4 change minds? Because currently, many treat PP as a brute constraint. If an accuracy argument succeeds, it changes the *status* of chance. If it fails, it suggests chance is metaphysically heavier than epistemologists like. That's a real fork in the road.
