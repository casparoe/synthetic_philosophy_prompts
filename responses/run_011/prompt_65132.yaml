      *   Push back hard. Undermining is a problem *for Humeans*. If you aren't committed to HS, undermining isn't a "bug," it's just a reason to reject HS. Making a workshop about it risks preaching to the choir or getting stuck in metaphysics of laws, which isn't the department's strength. It's "technical tidying" for non-Humeans.

  8.  **Drafting the Response (Iterative refinement):**
