answer: |-
  Here is the assessment, ranking, and commitment you asked for. I am treating this as a colleague evaluating a grant strategy, not a tutor correcting a student. I will be direct about where your dialectic is sloppy and where your bias is leading you astray.

  ### Part 1: Correcting the Dialectic

  You asked me not to be polite about errors in your understanding. Here are the three places where your shortlist misrepresents the current state of play.

  **1. Your read on #3 (The New Bug) is confused.**
  You write: *"once you move to the New Principle, chance hypotheses themselves stop being governed by it."*
  This is not quite right. The New Principle (NP) is designed specifically to handle cases where the chance function itself entails evidence that undermines it (the undermining future). The "New Bug" isn't that chance hypotheses escape the principle; it's that under NP, the *object language* of chance becomes opaque. You can't simply conditionalize on "The chance of H is X" without worrying about how that proposition interacts with your total evidence in a way that PP didn't require. The problem isn't that you can't reason about chances; it's that the NP makes the relationship between *chance propositions* and *credence* more complex, not less. It solves the inconsistency of PP but at the cost of making the norm less transparent. If you build a workshop on this, you risk spending two days untangling formalism that only matters if you are already committed to the NP.

  **2. Your bias toward #2 (Undermining) is indeed familiarity doing the work.**
  You suspect this; I confirm it. Undermining is a "bug" only if you are a Humean Supervenience (HS) partisan. If you are a non-Humean about laws or chances, undermining futures are not a bug; they are simply evidence that HS is false.
  For a department that does *not* do philosophy of physics, a workshop on Undermining is dangerous. It inevitably collapses into a metaphysics of laws debate (Are laws Humean or Anti-Humean?). Since you lack the physics toolkit to adjudicate the statistical mechanics cases that usually drive this, the discussion will float in a vacuum of abstract modal logic. It produces "status reports" from the Humeans defending their patch and the Anti-Humeans pointing at the hole. It rarely changes minds because the stakes are metaphysical, not epistemological.

  **3. #6 and #7 are non-starters for your constraints.**
  You correctly identified #7 (Everett) as out of scope. You should apply the same veto to #6 (Deterministic Chance). Almost every viable account of deterministic chance relies on statistical mechanics or coarse-graining arguments from physics. Without a philosopher of physics in the room, "deterministic chance" becomes a word game about compatibilism. It violates your "no physics" constraint just as hard as Everett.

  ### Part 2: The "Same Clothes" Problem

  You asked which of these are secretly the same question.
  **#1 (Admissibility), #2 (Undermining), and #3 (The New Bug) are all symptoms of #4 (Derivation).**

  Here is the structural reality: The Principal Principle (PP) is currently treated by many as a *primitive* norm. We are told to defer to chance. But *why*?
  *   If you can **derive** PP from more basic norms (Accuracy or Decision Theory), then **Admissibility** (#1) is no longer a mysterious filter; it is simply the set of evidence that doesn't interfere with the derivation.
  *   If you derive PP, **Undermining** (#2) becomes a constraint on the derivation (i.e., "Which chance functions allow for a stable derivation?"), not a metaphysical bug.
  *   If you derive PP, the **New Bug** (#3) is resolved by the conditions of the theorem.

  Currently, the literature treats PP as a brute constraint and then builds scaffolding (admissibility, NP) to keep it from collapsing. This is backwards. The foundational question is #4. The rest are patchwork.

  ### Part 3: The Ranking

  I am ranking these based on three criteria:
  1.  **Toolkit Fit:** Can your department actually solve this with formal epistemology + modal logic, without needing stat mech?
  2.  **Leverage:** Does solving this constrain the answers to the other questions?
  3.  **Disagreement Potential:** Is there a live fork in the road where smart people currently disagree?

  **Rank 1: #4 (Derivation from Accuracy/Decision Theory)**
  *   **Why:** This is the only question that is purely epistemological. It relies on scoring rules, Dutch Books, and representation theorems—your department's bread and butter. It avoids physics entirely.
  *   **Disagreement:** High. There is a sharp split between those who think chance is a primitive metaphysical guide (Lewisans) and those who think chance is a construct of rational norms (Best-System-adjacent or Pragmatists). A successful derivation would demote chance from metaphysical primitive to epistemic tool. A failed derivation (proof of impossibility) would suggest chance *must* be metaphysical. That is a mind-changing fork.
  *   **Leverage:** High. It dictates the answers to #1, #2, and #3.

  **Rank 2: #1 (Admissibility)**
  *   **Why:** This is the technical bottleneck for *using* the PP. It is tractable for formalists.
  *   **Downside:** It risks being "technical tidying." Many have argued admissibility is just "evidence that doesn't bear on the chance." If the workshop concludes "Admissibility is relative to the chance function," people will nod and leave. It lacks the metaphysical stakes of #4.

  **Rank 3: #5 (Imprecise Chance)**
  *   **Why:** It is tractable and avoids physics.
  *   **Downside:** It is niche. The debate is often "Does your imprecise framework allow this?" which is internalist squabbling. It doesn't generate the kind of "I changed my mind about the nature of probability" disagreement you want.

  **Rank 4: #2 (Undermining)**
  *   **Why:** It is the classic problem.
  *   **Downside:** As noted, it is saturated and metaphysically loaded. Without physics, it is abstract logic chopping. It reinforces existing camps rather than bridging them.

  **Rank 5: #3 (The New Bug)**
  *   **Why:** Too derivative. You can't discuss the New Bug without first settling whether you need the New Principle, which brings you back to Undermining (#2) or Derivation (#4).

  **Rank 6: #6 (Deterministic Chance) & #7 (Everett)**
  *   **Why:** Violate the "no physics" constraint. Cut them.

  ### Part 4: The Commitment

  **Build the workshop around #4: The Derivation of the Principal Principle.**

  **The Framing Question:**
  *"Is the Principal Principle a Constitutive Norm of Rationality or a Derivative Theorem?"*

  **Why this specific framing?**
  It forces participants to choose a side on the *status* of chance.
  *   **Side A:** Chance is a metaphysical primitive. The PP is a brute bridge principle. (Lewis's view).
  *   **Side B:** Chance is a construct of rational norms. The PP is a theorem derived from accuracy or decision-theoretic constraints. (The Joyce/Pettigrew/Pragmatist trajectory).

  **Why this will change minds:**
  Currently, many formal epistemologists use the PP as a tool without asking if it *can* be derived. If your RA and the workshop can produce a rigorous proof that PP *cannot* be derived from accuracy norms without assuming a prior link to chance, that is a major result: it proves Chance is metaphysically heavy. Conversely, if a clean derivation is found, it reduces Chance to an epistemic feature. This is not "tidying"; it is a verdict on the ontology of probability.

  **The RA's Job (18 Months):**
  Do not have the RA survey the literature. Have them formalize the impossibility claims.
  *   **Months 1-6:** Map the existing derivation attempts (accuracy-based, decision-theoretic). Identify the exact premise where "chance" is smuggled in.
  *   **Months 7-12:** Construct a formal model where Accuracy Norms hold, but PP fails. If they can do this, they have a paper: "The Independence of Accuracy and Chance."
  *   **Months 13-18:** Prepare the workshop papers. Invite one "Metaphysical Primitive" defender and one "Epistemic Derivation" defender. The RA's formal result becomes the background constraint for the debate.

  **Why not #2 (Undermining)?**
  If you choose Undermining, the workshop ends with Humeans saying "We fixed it with NP" and Non-Humeans saying "You shouldn't be Humeans." No one changes their mind about epistemology; they just restate their metaphysics. With Derivation, a Humean might be forced to admit their chance function requires a metaphysical primitive they didn't want, or an Anti-Humean might admit chance is just a rational construct. That is genuine tension.

  ### Part 5: What Would Move the Ranking?

  You asked what result would promote a lower-ranked theme or sink the winner.

  **1. What would sink #4 (Derivation)?**
  If a definitive impossibility proof is published in the next 6 months showing that *no* accuracy or decision-theoretic norm can recover PP without circularity, the debate shifts to #1 (Admissibility). If derivation is impossible, PP is primitive, and the only work left is managing its application (Admissibility).
  *   *Monitor:* Watch for new impossibility theorems in accuracy-first literature.

  **2. What would promote #2 (Undermining)?**
  If a new account of Best Systems is proposed that dissolves undermining without needing the New Principle (e.g., a revision of the fit criterion that doesn't rely on infinite limits), #2 becomes live again. However, this usually requires philosophy of physics. If a purely logical/probabilistic solution to Undermining appears (one that doesn't rely on the structure of physical laws), #2 jumps to Rank 1.
  *   *Monitor:* Look for "Humean" papers that do not cite statistical mechanics.

  **3. What would promote #5 (Imprecise)?**
  If the derivation project (#4) stalls because "sharp credence" is the blocker. If it turns out PP *can* be derived but only for imprecise credences, then #5 becomes the gateway to #4.
  *   *Monitor:* If your RA finds that all derivation attempts fail solely due to the requirement of precision.

  ### Final Advice

  Drop the physics-adjacent topics (#6, #7). Drop the Humean-specific bug-hunting (#2, #3). They are traps for a department with your profile. They look deep but are actually narrow.

  Go for the foundation (#4). It leverages your strength (formal epistemology), respects your constraint (no physics), and targets the root of the disagreement. It allows you to frame the workshop not as "How do we fix Lewis's principle?" but "Does Lewis's principle even need to be primitive?" That is a question where a smart person can leave on day two realizing they've been assuming a metaphysical commitment they don't actually hold.
