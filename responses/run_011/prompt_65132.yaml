      *   *#3 (The New Bug):* User worries chance hypotheses aren't governed by the New Principle (NP). *Critique:* This is a misunderstanding. NP handles self-undermining better, but there are still issues with *knowing* the chance function. It's technically distinct from #2 but often conflated.
