answer: |-
  This is a sophisticated reconstruction. You have effectively formalized the "Person-Affecting Restriction" and shown that if one accepts it as a necessary condition for value, it destroys not only Telic Egalitarianism but the Priority and Total views as well. Your seminar partner is correct that the argument proves too much, but your suspicion that there is a bad step is also correct.

  The argument fails at **Step (3)**, supported by a category error in **Step (4)** and **Step (7)**.

  Here is the diagnosis of the error, the principled line you are looking for, and the cost of fixing it.

  ### 1. The Fatal Step: Confusing Welfarism with the Person-Affecting View

  The core error is the inference from **(2)** to **(3)**.

  *   **Premise (2)** is a statement of **Welfarism** (or Individualism): Value supervenes on the wellbeing of individuals. There are no "free-floating" values (like beauty or holiness) independent of how lives go.
  *   **Premise (3)** is the **Person-Affecting Restriction**: An outcome can be better only if it is *better for someone*.

  Parfit, and most modern axiologists, accept (2) but reject (3). The move from (2) to (3) is invalid because one can hold that value is constituted entirely by individual wellbeing levels (satisfying 2) while denying that "betterness" must be reducible to a "better for" relation (violating 3).

  In your **Leveling-Down (LD)** case—(100, 200) to (100, 100)—Telic Egalitarianism claims the outcome is *in one respect* better. Since *no one* is better off, this violates (3). The Leveling-Down Objection (LDO) works because it highlights that Telic Egalitarianism posits value in a **relation** (equality) that has been severed from any benefit to individuals.

  However, in your **Priority View** case (Step 4)—(30, 190) vs. (20, 200)—P1 *is* better off in A. The Priority View ranks A above C. Does this violate (3)? Factually, no: P1 is better off. Your argument claims it violates the *spirit* of (3) because the *decisive feature* is the "declining slope of *f*," which you characterize as a structural fact rather than a person-affecting one.

  This is the category error. The "declining slope of *f*" is not a structural feature of the distribution like equality; it is a rule for evaluating **P1's absolute level**. The moral weight is attached to P1's gain *because of where it occurs on the absolute scale*. The value is located in P1's life, specifically in the fact that P1 is at a low absolute level.

  ### 2. The Principled Line: Separability vs. Relationality

  You asked for a principled line between the Prioritarian's concave *f* and the Egalitarian's equality term. The line is **Separability**.

  *   **The Priority View is Separable:** The moral value of a benefit to P1 depends *only* on P1's absolute level of wellbeing. It does not matter what P2 has. If P1 goes from 20 to 30, that has a specific moral value regardless of whether P2 is at 20, 200, or 2,000. The value is located entirely within P1's history.
  *   **Telic Egalitarianism is Non-Separable (Relational):** The moral value of P1's level depends on P2's level. P1 having 100 is better (in the equality respect) if P2 has 100 than if P2 has 200. The value is located in the *gap* between them.

  **Why Step (4) and (7) fail:**
  In Step (4), you claim the Priority View's weighting is a "fact about the shape of the distribution." It is not. It is a fact about the **moral marginal utility of absolute wellbeing**. Since absolute wellbeing is a feature of "how individual lives go" (Premise 2), the Priority View satisfies Premise 2. It does not posit value located nowhere; it posits value located in the absolute levels of the individuals.

  In Step (7), you claim the Total View's sum "belongs to the pair and not to either member." This is a mereological error. The sum is not an entity over and above the members; it is an aggregate of the members. If P1 gains 50 and P2 loses 40, the increase in the sum is fully constituted by the changes in P1 and P2. There is no "group mind" holding the sum. Telic Egalitarianism, by contrast, claims value in *equality*, which is a relation that cannot be reduced to the sum of intrinsic properties (since you can have the same sum with different equality).

  ### 3. What Does Rejecting Step (3) Cost?

  If you reject Step (3) to save the Priority and Total views, you pay the following price:

  1.  **You must accept Impersonal Value:** You must concede that "Outcome A is better than Outcome B" is not synonymous with "A is better for someone than B." Parfit embraces this. He argues that we should care about the *pattern* of wellbeing (e.g., priority-weighted sum) even if that pattern cannot be reduced to a simple "better for" claim in every instance (especially across different populations, though your case is fixed).
  2.  **You lose the Person-Affecting Intuition as a Constraint:** You can no longer use the intuition "If no one is better off, it can't be better" as a universal axiom. You must restrict it. The LDO works against Telic Egalitarianism not because it violates the Person-Affecting View *per se*, but because it posits value in a **relation** (equality) that yields no benefit. The Priority View posits value in **absolute levels**, which *do* yield benefits (in trade-off cases) or at least locate value in the individuals (in LD cases, where Priority says LD is *worse*).
  3.  **You must defend Aggregation:** You have to defend the claim that summing or weighting individual goods creates a *moral* total that can be compared. Some critics (like non-aggregative deontologists) will say this is still "value located nowhere." But within welfarist consequentialism, aggregation is the mechanism of value, not a ghostly addition to it.

  ### 4. Conclusion: Is the LDO a General Constraint?

  You asked if the LDO is "not really an objection to egalitarianism at all, but a person-affecting restriction on value that egalitarians, prioritarians and utilitarians have precisely the same reason to reject."

  **No.** The LDO is a specific objection to **Telic Egalitarianism**.

  *   **Telic Egalitarianism** says LD is *better in one respect* (equality). The LDO says: "A respect that benefits no one is not a value." This kills Telic Egalitarianism.
  *   **The Priority View** says LD is *worse* (because P2 loses, and P2's loss matters more than any gain in equality). The Priority View **does not** say LD is better in any respect. Therefore, the LDO does not apply to it.
  *   **Your Argument** tried to show that the Priority View *also* posits value located nowhere in standard trade-offs. This fails because the Priority View locates value in absolute levels (Separable), whereas the LDO targets value located in relations (Non-Separable).

  **Recommendation for your seminar:**
  Withdraw Step (3). Replace it with a **Separability Condition**: *"Any axiology that ranks A above B must be able to identify some feature of A, absent from B, that is intrinsic to the individuals involved, not merely relational."*

  *   **Telic Egalitarianism** fails this (Equality is relational).
  *   **Priority View** passes this (Absolute levels are intrinsic).
  *   **Total View** passes this (Sums are aggregates of intrinsics).

  This preserves the insight behind (6)—that the LDO targets value that floats free of individual good—without triggering the nihilism of (8). You preserve the distinction between **distributive justice based on relations** (which Parfit rejects) and **distributive justice based on weighted individual good** (which Parfit accepts).

  **The cost:** You must admit that "Betterness" is not always "Better for." But that is a price Parfit was willing to pay, and one most contemporary ethicists accept.
