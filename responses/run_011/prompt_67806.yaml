answer: |-
  Here is a specification of desiderata for a theory of personhood, drafted to meet your supervisor's demand for adequacy conditions. I have kept the tone critical and the distinctions sharp, using British English as requested.

  ### The Desiderata

  **1. The No-Oppressor's Veto (Non-Negotiable)**
  *   **The Case:** Enslavement, caste systems, and totalitarian regimes function by socially constructing certain humans as non-persons. If a theory makes personhood dependent on communal recognition, it grants the oppressor the metaphysical power to destroy the victim's status merely by withholding recognition.
  *   **The Requirement:** A theory must allow that a person remains a person even when their community systematically denies it.
  *   **Status:** *Genuine Requirement.* To treat this as optional is to privilege metaphysical consistency over moral safety. However, note that individualists call this a requirement, while strong relationalists often view it as a category error (confusing moral status with social standing).

  **2. The Asymmetry Constraint (Non-Negotiable)**
  *   **The Case:** Prolonged solitary confinement or advanced dementia severs or degrades relational capacity. If relations *constitute* personhood, their removal should diminish or destroy the person. Yet, we intuitively owe duties *to* the isolated or demented that we do not owe to stones.
  *   **The Requirement:** A theory must explain how relationships can enhance or express personhood without their absence necessarily annihilating it. It must block the inference: 'No relations, therefore no person.'
  *   **Status:** *Genuine Requirement.* This is the hardest hurdle for relational accounts. If you cannot clear this, your theory cannot handle the solitary confinement case.

  **3. The Minimum Floor (Non-Negotiable)**
  *   **The Case:** Menkiti argues personhood is earned through ritual and social participation; Gyekye argues there is a basic status from birth. If personhood is purely an achievement, infants, the severely cognitively impaired, and the comatose fall outside the circle of protection.
  *   **The Requirement:** There must be a baseline of moral standing that does not depend on functional capacity or social performance.
  *   **Status:** *Genuine Requirement.* Institutional protection (law, medicine) collapses without a binary floor, even if social *respect* is graduated.

  **4. The Memory Independence Clause (Contested)**
  *   **The Case:** Mbiti's 'living dead' exist only while named by the living. This honours ancestry but risks erasing victims of genocide or forced removal whose names were destroyed. If personhood depends on being remembered, the unnamed are doubly killed.
  *   **The Requirement:** Personhood (or at least the moral residue of it) must not vanish solely because the relational link of memory has been severed.
  *   **Status:** *Partisan Preference?* This looks like a requirement, but it may be a Western anxiety about permanence. A relationalist might argue that once the relationship of memory ends, the *social* person ends, and that is acceptable provided the *biological* human was honoured while alive. You must decide if 'posthumous personhood' is a necessary category.

  **5. Empirical and Legal Consistency (Non-Negotiable)**
  *   **The Case:** Developmental psychology shows continuity of self despite radical cognitive change; law grants personhood to ships and companies.
  *   **The Requirement:** The theory must distinguish between *human* personhood (biological/psychological continuity) and *legal* personhood (functional standing). It cannot claim dementia destroys personhood if the science shows narrative continuity persists in fragmented forms. Nor should it be confused by corporate personhood, which is a fiction of standing, not ontology.
  *   **Status:** *Genuine Requirement.* A metaphysics that contradicts settled science or conflates legal fiction with moral ontology is useless for policy.

  **6. Standing vs. Capacity Distinction (Non-Negotiable)**
  *   **The Case:** We protect people who cannot exercise rights (infants, dementia).
  *   **The Requirement:** The theory must separate the *status* of being a person (which grounds rights) from the *capacity* to function as one (which varies).
  *   **Status:** *Genuine Requirement.* Without this, you slide into ableism.

  ---

  ### Incompatibilities and Trade-offs

  You are correct to suspect a trilemma. You cannot simultaneously hold the following three claims:

  1.  **Strong Constitution:** Relations *constitute* the person (you are your relations).
  2.  **The No-Oppressor's Veto:** A hostile community cannot strip personhood.
  3.  **The Asymmetry Constraint:** The withdrawal of relations does not subtract from personhood.

  If (1) is true, then (2) and (3) are false. If relations make you who you are, their removal changes *what* you are. To save (2) and (3), you must weaken (1) to a claim that relations are *evidential* or *developmental* but not strictly constitutive of the core status.

  **The Single Requirement That Knocks Out the Most Candidates:**
  **The Asymmetry Constraint.**
  Most robust relational accounts (including some readings of Metz and Menkiti) struggle here. If personhood is a function of harmonious relationship, the absence of harmony implies a deficit in personhood. To avoid this, theories often retreat to a hidden individualist core (a 'soul' or 'dignity' that survives isolation), which undermines the relational premise. This is where your supervisor will push: if you say relations matter, you must pay the price that their absence matters too. If you refuse to pay that price, you are an individualist in disguise.

  ---

  ### Brief Pass on Existing Accounts

  **Lockean Psychological-Continuity**
  Fails the dementia and solitary confinement cases decisively. If personhood tracks memory and psychological connectedness, advanced dementia breaks the chain. It also fails the 'Floor' requirement for infants. It handles the 'Oppressor's Veto' well (internal psychology matters, not external recognition), but at the cost of excluding those who cannot sustain a narrative. It is too brittle for your institutional purposes.

  **Kantian Dignity**
  Secures the 'Floor' and the 'No-Oppressor's Veto' robustly; dignity is intrinsic and cannot be stripped by others. However, it struggles with the relational constitution you are exploring. It treats relations as secondary to rational agency. It handles the asymmetry well (dignity remains in isolation) but risks being too abstract to explain *why* community destruction (like enslavement) is a specific harm to personhood rather than just a rights violation.

  **Metz-Style Relational Account**
  Strong on explaining the value of community and the harm of its destruction. However, it faces the Asymmetry problem head-on. If personhood is the capacity for relationship, does the incapacitated demented patient retain it? Metz argues for a 'basic' capacity, but this risks looking like a capacity account in relational clothing. It is vulnerable to the 'Oppressor's Veto' unless it posits a modal capacity (the ability to relate *if* conditions allowed), which is a subtle but necessary move.

  **Capabilities/Threshold Account (Nussbaum et al.)**
  Handles the 'Floor' and 'Capacity vs. Standing' distinction well. It aligns with empirical data on disability. However, it is often criticised for being too individualist in its metric (what *this* body can do) rather than relational (who *we* are). It might satisfy your institutional needs but fail to capture the ontological shift you are investigating in the ubuntu literature. It solves the protection problem but might miss the metaphysical point.

  ---

  ### Meta-Reflection: Where This Spec Might Be Wrong

  I am flagging three requirements where my reasoning may be smuggling in your (or my) prejudices rather than identifying genuine necessities.

  **1. The Demand for a Binary 'Floor' (Desideratum 3)**
  *   **Why it might be a prejudice:** This assumes the law's need for a switch (person/non-person) reflects reality. A relationalist might argue that personhood *is* graduated, and our legal insistence on a binary is a bureaucratic fiction that distorts the ontology.
  *   **Argument to drop it:** If you can show that a graduated status *better* protects the vulnerable (by allowing tailored duties rather than a cliff-edge), the demand for a binary floor is a weakness, not a strength.
  *   **Risk:** Dropping this makes institutional application notoriously difficult.

  **2. The Memory Independence Clause (Desideratum 4)**
  *   **Why it might be a prejudice:** This assumes personhood must be permanent to be valuable. Many African ontologies accept that the 'living dead' fade away; this is not seen as a tragedy but as a natural cycle. Insisting they remain persons might be a Western anxiety about death.
  *   **Argument to drop it:** If the purpose of the theory is to describe *social* reality, then when memory ends, the social person *does* end. The requirement should be that they were honoured *while* remembered, not that they persist metaphysically.
  *   **Risk:** This leaves victims of erasure (genocide) without posthumous standing.

  **3. Consistency with Legal Corporate Personhood (Desideratum 5)**
  *   **Why it might be a prejudice:** This assumes legal categories track moral categories. They often do not.
  *   **Argument to drop it:** Demanding consistency with corporate personhood might force your theory to accommodate a fiction. Human personhood might be ontologically distinct from legal standing, and trying to align them could distort the account of human relations.
  *   **Risk:** Ignoring legal reality makes the thesis less useful for the institutional questions you want to settle.

  **Where My Reasoning Is Most Likely to Go Wrong:**
  I have prioritised **moral safety** (protecting the vulnerable) over **ontological consistency**. In doing so, I may have defined 'adequacy' in a way that makes strong relationalism impossible by fiat. If the truth is that personhood *is* fragile and dependent on community, then a theory that guarantees protection against isolation is simply false, however comforting. You must decide if you are building a theory of *what personhood is* or a theory of *how we ought to treat humans regardless of personhood*. The supervisor's critique suggests you are conflating the two.
