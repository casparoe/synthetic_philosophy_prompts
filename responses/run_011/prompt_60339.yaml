      *   The risk profile is identical. REU will not flip.
      *   **I need the Allais Common Consequence effect.**
      *   The Global Act must combine the branches in a way that lowers the weight on the top outcome more than the Local evaluation does.
      *   **Revised Setup:**
          *   **Act A (Fixed):** H -> \$400 Sure. T -> \$400 Sure. (Global: \$400 Sure). **REU = 400**.
          *   **Act B (Contingent):** H -> 50% \$2000 / 50% \$0. T -> **\$0 Sure**.
