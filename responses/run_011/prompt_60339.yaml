answer: |-
  ### The Scenario: The Consultant's Bonus

  You are a senior consultant finalizing a contract for a two-phase project. The firm uses a randomized allocation system to assign partners to client tracks.

  **Node 1 (Contract Choice):** You must choose between **Contract Fixed** (Act A) and **Contract Contingent** (Act B).
  **Chance Event:** A fair coin determines the Client Track (Heads or Tails, $p=0.5$).
  **Node 2 (Buy-In Offer):** After the Track is revealed but before the payout is resolved, the firm offers a "Performance Buy-In." You can pay **\$100** to swap your current payout structure in *this specific track* for the Contingent structure.
  **Resolution:** A second random draw (independent 50/50 coin) determines the final bonus payout within the track.

  **The Payoffs:**
  *   **Contract Fixed (Act A):** In either Track, you receive **\$501** sure.
  *   **Contract Contingent (Act B):** In either Track, you enter a lottery: 50% chance of **\$2,000**, 50% chance of **\$0**.

  **The Agent:**
  *   Utility: $u(x) = x$ (linear in dollars).
  *   Risk Function: $r(p) = p^2$ (risk-averse).
  *   REU Calculation: Outcomes ordered $x_1 < \dots < x_n$. Weight on $x_i$ is $r(P(\ge x_i)) - r(P(> x_i))$.

  ---

  ### The Arithmetic

  #### 1. Node 1: Global Choice (Act A vs. Act B)
  The agent evaluates the global acts before the Track is known.

  **Act A (Fixed):**
  *   Outcome: \$501 with probability 1.0.
  *   $REU(A) = 1.0^2 \times 501 = \mathbf{501}$.

  **Act B (Contingent):**
  *   Global Distribution: 50% \$2,000, 50% \$0. (Since both Tracks offer the same lottery).
  *   Outcomes: $0, 2000$.
  *   Cumulative Probs: $P(\ge 0) = 1.0$, $P(\ge 2000) = 0.5$.
  *   Weights ($r(p)=p^2$):
      *   $w(0) = 1.0^2 - 0.5^2 = 0.75$.
      *   $w(2000) = 0.5^2 - 0 = 0.25$.
  *   $REU(B) = 0.75(0) + 0.25(2000) = \mathbf{500}$.

  **Verdict:** $501 > 500$. **She chooses Act A.**

  #### 2. Node 2: Local Choice (The Trade)
  The Coin lands **Heads**. She knows she is in the Heads Track. She holds Contract Fixed (\$501 sure).
  The firm offers: Pay \$100 to switch to the Contingent structure for this Track (50% \$2,000, 50% \$0).

  *Note: She evaluates this locally, conditioning on being in the Heads Track. The Track probability is now 1. The only risk is the payout lottery.*

  **Option Stay (Keep Fixed):**
  *   Payoff: \$501. Cost: \$0. Net: **\$501**.
  *   $REU_{local}(Stay) = \mathbf{501}$.
  *   *Wait, to match the pump logic, we compare the net position after the potential trade cost.*
  *   Let's frame the choice as: **Keep \$501** vs. **Pay \$100 for Lottery**.
  *   **Option Stay:** \$501 Sure. $REU = 501$.
  *   **Option Trade:** Pay \$100. Net outcomes: 50% \$1,900, 50% \$-100.
      *   Outcomes: $-100, 1900$.
      *   Cumulative: $P(\ge -100) = 1.0$, $P(\ge 1900) = 0.5$.
      *   Weights: $w(-100) = 0.75$, $w(1900) = 0.25$.
      *   $REU_{local}(Trade) = 0.75(-100) + 0.25(1900) = -75 + 475 = \mathbf{400}$.
      *   **Wait, 501 > 400.** She would reject the trade. **My previous mental draft had an error.**
      *   *Correction:* I need the Local REU of the Trade to be *higher* than the Stay.
      *   Why did the previous mental math work? I compared Sure Net (\$401) vs Gamble Gross (\$500).
      *   Let's align the comparison properly.
      *   **Option Stay:** \$501 Sure.
      *   **Option Trade:** Pay \$100. Get 50% \$2000, 50% \$0.
      *   Net Outcomes of Trade: 50% \$1900, 50% \$-100.
      *   To make the Trade attractive locally, I need to lower the Sure Amount or raise the Gamble.
      *   Let's adjust Act A to **\$350 Sure**.
      *   **Re-Run Node 1:**
          *   Act A: \$350. REU = 350.
          *   Act B: REU = 500.
          *   She picks B. **Fail.** I need her to pick A.
      *   *Constraint:* Act A must be preferred globally, but the Trade must be preferred locally.
      *   This requires the risk aversion to be *stronger* globally than locally.
      *   Global: 50% chance of the gamble (because of the Track coin).
      *   Local: 50% chance of the gamble (just the payout coin).
      *   The probabilities are the same! $r(0.5)$ is the same.
      *   **The Error:** In my previous symmetric design, the global probability of the \$2000 was 50% (0.5 Track * 1.0 Payout? No).
      *   Let's look at the structure again.
      *   Act B: H (50% \$2k), T (50% \$2k). Global is 50% \$2k.
