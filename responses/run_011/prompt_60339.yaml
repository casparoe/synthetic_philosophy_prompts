              *   T (0.5): \$400 Sure.
              *   Outcomes: -50, 400, 1950.
              *   Probs:
                  *   1950: 0.25
                  *   400: 0.50
                  *   -50: 0.25
              *   Cumulative ($P(\ge x)$):
                  *   $\ge -50$: 1.0
                  *   $\ge 400$: 0.75
                  *   $\ge 1950$: 0.25
              *   Weights ($p^2$):
                  *   $w(-50) = 1 - 0.75^2 = 0.4375$.
                  *   $w(400) = 0.75^2 - 0.25^2 = 0.50$.
                  *   $w(1950) = 0.25^2 = 0.0625$.
              *   $REU(Final) = 0.4375(-50) + 0.50(400) + 0.0625(1950)$.
              *   $= -21.875 + 200 + 121.875 = \mathbf{300}$.
          *   **Pump:** Started with Act A (REU 400). Ended with Final (REU 300). **Loss of 100 REU points.**
          *   **Package Check:**
              *   Offer at Node 1: "Pay \$50 if H occurs to switch H-payoff to Lottery."
              *   This creates the exact Final Distribution calculated above.
              *   REU(Package) = 300.
              *   REU(Act A) = 400.
              *   **She refuses the package.**
          *   **Symmetry:**
              *   To make it symmetric (Bonus), we need the T branch to offer the same trade.
              *   But Act B had T -> \$0 Sure. If we make Act A -> \$400 in T, and offer the trade in T...
              *   Trade in T: Pay \$50 to switch \$400 to "50% \$2000 / 50% \$0".
              *   Local REU(Trade) = 450. Local Stay = 400. She takes it.
              *   If she takes it in both branches, she ends up with:
                  *   50% (50% \$1950, 50% \$-50).
                  *   50% (50% \$1950, 50% \$-50).
                  *   Global: 50% \$1950, 50% \$-50.
                  *   REU = $0.25(1950) + 0.75(-50) = 487.5 - 37.5 = 450$.
              *   Wait, if she takes it in both branches, the Global REU is 450.
              *   Original Act A = 400.
              *   She is BETTER off (450 > 400).
              *   **The Pump Fails if Symmetric.**
              *   Why? Because the "Common Consequence" protection (the T branch being safe in Act B) is what made Act A attractive globally. If she turns T into a gamble too, she loses the safety that justified Act A.
              *   **Decision:** I must drop the Symmetric Bonus to preserve the Pump logic. The prompt says "bonus points," not "required." I will prioritize the Pump's validity over the bonus. I will note this in the analysis.
              *   *Wait, can I fix the symmetry?*
              *   I need the Global Package to be rejected.
              *   Package = Act A modified in both branches.
              *   If Modified Act A > Act A globally, she takes the package.
              *   I need Modified Act A < Act A globally.
              *   In my calculation: Act A (400) vs Modified (300).
              *   Why did the symmetric calculation yield 450?
              *   Because in the asymmetric case, T was \$400 Sure (Weight 0.5 in global mix). In the symmetric case, T becomes a gamble.
              *   In the Asymmetric Case (Pump):
                  *   H: Gamble (modified). T: Sure \$400.
                  *   This mix creates the bad weighting (the 0.75 cumulative step).
              *   If T is also Gamble:
                  *   H: Gamble. T: Gamble.
                  *   Global is just the Gamble.
                  *   Gamble REU = 450.
                  *   Act A = 400.
                  *   She prefers the Gamble globally if it's everywhere.
                  *   She prefers Act A globally only because T is Safe.
              *   **Conclusion:** The pump *requires* asymmetry to exploit the global weighting of the safe branch. I will omit the symmetric bonus to ensure the math holds. (I will explicitly flag this trade-off).

  #### 3. EU Control Case ($r(p) = p$)
  *   **Node 1:**
      *   Act A: \$400.
      *   Act B: 25% \$2000, 75% \$0. EU = 500.
      *   EU Agent picks **Act B** (500 > 400).
