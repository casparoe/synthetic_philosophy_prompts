answer: |-
  ### Candidate Mechanisms

  1.  **Negative Synergy (Interdependence):** The utility of Issue A is contingent on the status of Issue B. Gains-from-trade assumes additivity ($U_{total} = U_A + U_B$), but if values are multiplicative ($U_{total} = U_A \times U_B$), securing A while compromising B can drive total value to zero even if $U_A$ is positive.
  2.  **Integrity/Identity Erosion:** Agents derive value not just from outcomes, but from being the *kind of agent* who pursues them. Trading concessions treats values as preferences rather than commitments. The act of bargaining degrades the agent's integrity, reducing the capacity to enjoy the gain.
  3.  **The Paradox of Authorization:** To enforce the compromise, parties must empower a neutral arbiter or procedure they fundamentally distrust. The cost of the enforcement mechanism outweighs the benefit of the policy gained.

  **Selection:** I choose **Integrity/Identity Erosion**. It most directly challenges the moral psychology underlying bargaining theory (that values are fungible preferences) without relying on external consequences or ignorance.

  ### The Thought Experiment

  In a fragile coalition government, the Liberty Party (L) and Equality Party (E) face a budget crisis. L values deregulation above spending; E values redistribution above efficiency. They strike a logroll: L accepts a Wealth Tax, E accepts Labor Deregulation. To secure passage, both must amend their bills: L allows loopholes undermining the tax's efficacy; E accepts exemptions weakening deregulation. Each secures their signature policy instrument, counting it a local victory. Yet, to pass these compromised versions, both parties must publicly argue against their own core principles, alienating their base and eroding their distinctive political identity. They gain the statute but lose the credibility required to govern or reproduce their values. Both parties end the term weaker, less distinct, and less capable of pursuing their ends than if they had remained in opposition and kept their principles intact.

  ### Analysis of the Design

  **Walking the Trade:**
  *   **Liberty Party:** Gains the Deregulation Act (Local Gain). However, to pass it, they must endorse the Wealth Tax (Core Violation).
  *   **Equality Party:** Gains the Wealth Tax (Local Gain). However, to pass it, they must endorse Labor Deregulation (Core Violation).
  *   **All-Things-Considered:** Both parties derive significant utility from *political integrity* and *brand distinctiveness*. By compromising, they secure the policy instrument but degrade the agent. The loss of identity (and subsequent loss of voter support/power) outweighs the utility of the compromised policy.

  **The Structural Feature:**
  The case relies on the **Non-Separability of Value and Agent**. Gains-from-trade reasoning assumes that the value of a policy outcome is independent of the moral cost to the agent securing it. It treats values as *preferences* (things I want) rather than *commitments* (things that constitute who I am). In this scenario, the utility function is not $U(Policy) - Cost$, but $U(Policy | Agent)$. If the Agent changes via compromise, $U$ drops.

  **Deleting the Feature:**
  If we assume **Separability** (the standard economic premise), the case collapses. If values are merely preferences, the "cost" of arguing against principles is just another negative utility to be weighed. If the policy gain outweighs the discomfort of inconsistency, the trade is a net gain. The paradox disappears because there is no structural link between *who you are* and *what you value*.

  **Strongest Reply:**
  A proponent of moral trade might argue: *"This is just bad accounting. If integrity is a value, include it in the calculus. If they traded anyway, they revealed that policy mattered more than integrity. You cannot claim they are worse off by their own lights if they voluntarily chose the trade."*

  **Evaluation:**
  This reply lands partially but misses the philosophical point. It assumes **Revealed Preference** is infallible. However, political agents often suffer from **Adaptive Preferences** or **False Consciousness** regarding their own identity. They may *think* they are prioritizing policy, only to discover post-trade that their power was constitutively linked to their purity. The counterexample holds because it exposes that gains-from-trade models cannot account for values that are *constitutive of the valuer*. If the trade changes the valuer, the pre-trade calculus is structurally blind to the loss.
