  **Rejected Settings:**
  *   *Software Development:* Too volatile; market shifts would explain productivity changes, violating Constraint 1.
  *   *Elder Care:* Too close to the "harm/overwork" axis; reducing hours here risks patient safety, violating Constraint 3.
  *   *Assembly Line:* Too susceptible to automation narratives; violates Constraint 1.
  *   *Why Watchmaking:* It is an ordinary, stable trade with a consistent market (heritage pieces always need repair). It relies on long-tenure human judgment that cannot be automated without violating the "high-end" value proposition. It is calm, not physically punishing, satisfying Constraint 3.

  **The Arrangement:**
  The workshop employs twelve restorers. Historically, they worked 45-hour weeks. The new policy reduces this to 30 hours. Pay is fully protected. Headcount remains at twelve. There is no intensification: the number of watches accepted for repair is reduced proportionally to match the new labor capacity. No shifts are reorganized to create overlap; the workshop simply closes earlier each day and remains closed on Wednesday afternoons.

  **The Change:**
  Mechanical restoration involves a phase called "settling." After a movement is reassembled, it must be observed running in different positions over several days to catch intermittent friction that only appears after lubrication distributes. Previously, restorers managed this through informal continuity. A restorer would check a watch at 5:00 PM, note a slight hesitation, and return at 8:00 AM to see if it persisted. This required no extra pay, only presence. The "gap" between shifts was short enough that the restorer's mental model of the specific watch remained active.

  Under the 30-hour week, the workshop is dark for 18-hour stretches nightly and 66-hour stretches over the long weekend. The watches sit in static states. The intermittent faults still occur, but they occur in the dark. They are not witnessed. The watches are cased and returned to clients. They function for six months, then fail.

  **The Workers:**
  None of the twelve restorers believe in the "dignity of labour." They view the job as a skilled way to earn a living. None pine for the 45-hour week. Five years post-change, they report high life satisfaction. They have taken up gardening, parenting, and leisure reading. They do not feel their skills have atrophied, because the technical act of disassembly and cleaning remains unchanged. They are not stressed. They are not guilty.

  **The Loss:**
  The rate of "return repairs" (watches coming back under warranty) has doubled. This is absorbed by the business as a cost of doing business; the market has not fled (Constraint 1). However, the *integrity of the restoration* has degraded. The work no longer guarantees what it once guaranteed. The restorers do not notice this degradation because they do not see the failures (they happen off-site, months later). The loss is real, permanent (Constraint 5), and structural to the time cut, yet it registers as zero loss to the workers' subjective experience.

  ***

  ### The Analysis

  **The Two Positions**

  1.  **The Leisure Account:** Labour is instrumental. It is a disutility undertaken to secure the means of life. The good life is defined by the quantity and quality of non-labour time (freedom). A reduction in working hours, with pay and security protected, is an unqualified moral good because it expands the realm of freedom without diminishing the means of survival. The quality of the work output matters only insofar as it sustains the market exchange that funds the leisure.
  2.  **The Work/Formative Account:** Labour is constitutive. It is the sphere in which human capacity is tested, formed, and justified. A "calling" is not about feeling good, but about discharging a duty to the integrity of the practice itself. The value of work lies in the correspondence between the worker's intention and the objective quality of the thing made. A life of labour is for the sake of achieving a standard of excellence that transcends the worker's immediate satisfaction.

  **The Verdicts**

  *   **The Leisure Account:** **Success.** The workers have gained 15 hours of freedom per week. Their material welfare is unchanged. Their health is unharmed (Constraint 3). Their subjective contentment is high (Constraint 4). The increase in warranty returns is an accounting issue, solvable by pricing or reserves. It does not impinge on the workers' freedom. The account registers no loss.
  *   **The Work/Formative Account:** **Failure.** The practice of restoration has been severed from its telos (a fully functioning timepiece). The workers are no longer "restorers" in the full sense; they are "disassemblers and cleaners." The gap between their action and the final outcome has been widened by the structural break in observation. The labour no longer forms them into masters of the craft, but into technicians of a fragment. The life of labour is diminished because the *truth* of the work is compromised, regardless of the workers' contentment.

  **The Single Feature Doing the Work**
  **The Decoupling of Action from Feedback.**
  The loss arises because the temporal continuity required to verify the *truth* of the work (does it hold?) is broken by the hour cut. The Leisure Account values the *time of the worker*. The Work Account values the *time of the object*. When these two times diverge, the Leisure Account sees freedom, and the Work Account sees falsification.

  **The Minimal Repair**
  To eliminate the loss while preserving the 30-hour week and protected pay: **Automated Kinetic Monitoring.**
  Install independent testing machines that simulate wrist motion and log friction data during the off-hours.
  *   *If this repair works:* The loss is contingent. It was caused by a lack of technology, not the hour cut itself. The Work Account is satisfied (integrity restored) without violating the Leisure Account (hours remain low).
  *   *If this repair fails:* In high-complication watchmaking, the "feel" of a fault is often auditory or tactile, detectable by a human ear against a quiet room, but not by a machine sensor. If the machine cannot replicate the human verification, the loss is **built into the shape of the arrangement**. You cannot have both the 30-hour week (with its long dark gaps) and the integrity of the craft. One must give.

  **On Whom the Loss Falls**
  The loss falls primarily on the **Client** (who receives a inferior product) and secondarily on the **Practice** (the standard of the craft degrades). The workers themselves suffer no subjective or material loss.
  *   *Does this count against the Leisure Position?* Yes. The Leisure Position argues that labour is for the sake of the worker's freedom. However, labour is also a social relation. If the reduction of labour time systematically degrades the value delivered to the community (the clients) without the workers' knowledge, it creates a hidden subsidy: the workers' freedom is purchased with the clients' trust. A political philosophy of leisure that cannot account for the *quality of the contribution* risks legitimizing a form of benign negligence.

  **The Strongest Attack (Defender of Leisure)**
  "You are smuggling in a moralistic definition of 'excellence' that the workers themselves have rejected. By Constraint 4, the workers are content. By Constraint 1, the market remains. If the customers accept the warranty terms and the business remains solvent, no objective harm has occurred—only a shift in risk allocation.
  Your claim that the work is 'falsified' relies on the idea that the worker owes a duty to the *object* that supersedes their duty to their own *life*. This is precisely the Protestant Ethic residue you claim to be testing. You say the loss is not 'internalized discipline,' but your entire case rests on the idea that a worker *should* feel a loss they do not feel. You are positing a 'true interest' of the worker (in their own formation) against their 'actual interest' (in their own time). If the worker does not experience the atrophy of their craft as a harm, by what right does the Work Account declare it one? You have not escaped the moral discipline of labour; you have simply externalized it from the worker's conscience to the object's history."

  **Evaluation of the Attack**
  The attack **succeeds partially, but fails on the specific constraint of the novel.**
  It succeeds in showing that without a belief in "dignity of labour" (Constraint 4), the Work Account cannot claim the *worker* is harmed. The worker is not harmed.
  However, it fails to address the **novelist's specific problem**: the divergence of the accounts. The novelist asks for a case where the accounts *diverge*.
  *   The Leisure Account *must* say "This is Good" (Freedom increased, no subjective harm).
  *   The Work Account *must* say "This is Bad" (Integrity degraded, formation stunted).
  The Attack tries to collapse the Work Account into the Leisure Account by saying "If the worker feels fine, it is Good." But that denies the premise of the Work Account (that formation is objective).
  Therefore, the thought experiment holds: The divergence is real. The Leisure Account sees a win; the Work Account sees a loss. The Attack reveals that the Work Account requires a belief in objective goods (craft integrity) that the Leisure Account rejects. This is exactly the "talking past each other" the novelist wishes to explore. The loss is not internalized discipline; it is **objective degradation of the practice** which the Leisure Account is theoretically blind to, because it values the *agent's time* over the *practice's continuity*.

  **Conclusion on Specifications**
  The specifications **can be satisfied**, but only by locating the loss in the *object/practice* rather than the *subject/worker*. If the loss were located in the worker (e.g., they feel empty), it would violate Constraint 4 or risk violating the "no internalized discipline" rule. By placing the loss in the **unobserved failure of the watch**, the scenario creates a divergence: The worker is freer (Leisure Win), but the work is less true (Work Loss). This allows the novelist to stage the conflict not as a psychological battle within the character, but as a structural tension in the world they inhabit.
