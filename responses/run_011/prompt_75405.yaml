answer: |-
  # The Causal Claims Triage Protocol (CCTP)

  **Purpose:** To standardize decisions on causal language in science texts without requiring reviewers to hold degrees in *kalām* or philosophy of science.
  **Scope:** Textbook drafts, student questions, parent objections regarding causation and divine agency.
  **Time Limit:** 20 minutes per item (Reviewer); 3 minutes (Teacher).

  ---

  ## Part I: The Reviewer Procedure (20 Minutes)

  Run the flagged item through these four gates in order. If an item fails a gate, apply the prescribed fix. If it passes all four, it is approved. If it triggers a "Hand-Up" condition, send to the Board.

  ### Gate 1: The Empirical Integrity Check
  **Question:** Does the proposed text or objection deny an observed, repeatable sequence of events (e.g., "Fire does not burn cotton," "Germs do not spread")?
  *   **Sufficient Answer:** No. The text affirms the sequence occurs.
  *   **Fail Condition:** Yes. The text claims the sequence *never* happens or is an illusion.
  *   **Action:** **Reject.** Al-Ghazālī affirms habitual sequence (*ʿādah*). Denying observation invalidates the science.
  *   **Judgment Call:** Distinguishing between "this mechanism is unproven" (acceptable scientific caution) and "this mechanism is impossible" (theological overreach). *Systematic Misfire:* This gate will struggle with probabilistic sciences (quantum mechanics, evolution) where "sequence" is statistical, not linear.

  ### Gate 2: The Necessity Check
  **Question:** Does the text assert that the created thing (fire, virus, force) possesses *independent, intrinsic power* to necessitate the effect, such that God *could not* intervene?
  *   **Sufficient Answer:** No. The text uses standard scientific language ("causes," "produces") as shorthand for "is the consistent occasion for."
  *   **Fail Condition:** Yes. The text uses words like "exceptionless," "inherent necessity," "autonomous power," or "law of nature" without qualification.
  *   **Action:** **Qualify.** Add language indicating contingency (e.g., "by God's habit," "under normal conditions," "Allah permitting").
  *   **Judgment Call:** Determining when standard scientific shorthand ("causes") becomes a metaphysical claim ("necessitates"). *Systematic Misfire:* Reviewers will tend to over-flag standard language as metaphysical claims.

  ### Gate 3: The Pedagogical Clarity Check
  **Question:** Does the theological qualification render the scientific concept unintelligible or unusable for a high-school student (e.g., preventing them from solving a stoichiometry problem)?
  *   **Sufficient Answer:** No. The student can still perform the science.
  *   **Fail Condition:** Yes. The qualification confuses the mechanism being tested.
  *   **Action:** **Move.** Place the theological qualification in a sidebar, footnote, or introductory chapter rather than inline with the operational text.
  *   **Judgment Call:** Balancing theological precision with cognitive load. *Systematic Misfire:* This often becomes a cover for avoiding uncomfortable theology rather than protecting learning.

  ### Gate 4: The Board Threshold (Hand-Up)
  **Question:** Is the item a dispute over *piety* (how much we should mention God) rather than *doctrine* (what is permissible to say about causation)?
  *   **Sufficient Answer:** It is a doctrinal boundary issue (Gate 1 or 2 failed).
  *   **Fail Condition:** It is a preference for more/less religious language where doctrine is not violated.
  *   **Action:** **Hand-Up.** If the item requires defining the limits of *Tawḥīd* in a novel context, or if the reviewer is unsure if a claim violates *ʿAqīdah*, send to the Board.
  *   **Judgment Call:** Distinguishing between a "safe" theological preference and a "required" theological boundary.

  ---

  ## Part II: The Classroom Stopgap (3 Minutes)

  When a student asks a live question about causation (e.g., "Does the fire burn or does Allah burn?") and the teacher cannot consult the handbook:

  **The Default Script:**
  > "Science describes the *habit* (ʿādah) that Allah has placed in creation. We study the habit to understand how the world usually works. But Allah is the One who holds the power to create the effect. So, in science, we say 'fire burns' to describe the pattern. In faith, we know 'Allah creates the burning' to describe the Power."

  **Stop Conditions:**
  1.  If the student presses on whether the pattern *can* break (miracles): Refer to the Religion/Aqeedah curriculum.
  2.  If the student argues that science is therefore "fake": Correct immediately. Science is "real description of real habits."
  3.  If the teacher is unsure: "That is an excellent question that connects science and theology. Let me verify the precise wording and return to you."

  ---

  ## Part III: Theological Distinctions (Simplification Guide)

  For the purpose of high-school science texts, these distinctions must survive simplification:

  **KEEP (Non-Negotiable):**
  1.  **Contingency:** The connection between cause and effect is not logically necessary; it is contingent on God's will.
  2.  **Ultimate Agency:** God is the only independent Agent; created things are loci of action (*mahall*), not independent actors.
  3.  **Regularity:** The world is orderly because God's habit is consistent, not because nature has autonomy.

  **DROP (For 15-Year-Olds):**
  1.  **Atomistic Time:** The theory that time is composed of discrete atoms. (Too complex, unnecessary for the point).
  2.  **The Mechanics of *Kasb*:** How human acquisition of acts works. (Irrelevant for chemistry/physics).
  3.  **Malebranche vs. Ashʿarī:** The specific European vs. Islamic historical debate. (Confusing and historically inaccurate to conflate).

  **Warning:** Do not drop the distinction between **Denying Necessity** vs. **Denying Sequence**. This is the most common failure point. Students must not think al-Ghazālī says fire *doesn't* burn cotton. He says it burns *because God wills it when fire touches cotton*, not because fire *forces* it to burn.

  ---

  ## Part IV: Case Studies

  ### Case 1: Chemistry (Oxidizing Agent)
  **Item:** "The oxidizing agent makes the fuel burn."
  **Reviewer Annotation:** Rewrite to attribute burning to God.
  **Procedure Run:**
  1.  **Empirical Check:** Pass. Oxidizer + Fuel -> Burn is observed.
  2.  **Necessity Check:** Fail. "Makes" implies intrinsic power/necessity.
  3.  **Pedagogical Check:** Pass. Can qualify without breaking stoichiometry.
  4.  **Board Threshold:** No. This is standard language qualification.
  **Verdict:** **Revise.**
  **Required Change:** "The oxidizing agent is the occasion for the fuel to burn, by Allah's will." OR "In the habitual order of creation, the oxidizing agent causes the fuel to burn."
  **Note:** The reviewer's demand to attribute burning *solely* to God (removing the oxidizer) would fail Gate 1. The oxidizer must remain the *sabab* (means), even if not the *Fa'il* (Agent).

  ### Case 2: Infectious Disease (Parent Objection)
  **Item:** Parent objects to transmission models; argues for reliance on supplication. Student asks: "Does medicine work?"
  **Procedure Run:**
  1.  **Empirical Check:** **Fail.** The parent's objection implies transmission models are unnecessary or false in favor of direct reliance. This denies the observed sequence of infection.
  2.  **Necessity Check:** N/A (Failed Gate 1).
  3.  **Pedagogical Check:** N/A.
  4.  **Board Threshold:** **Hand-Up.** This touches on *Tawakkul* (reliance) vs. *Asbab* (means). While Gate 1 fails the parent's objection, the tension between medical intervention and spiritual reliance is a pastoral/doctrinal matter.
  **Verdict:** **Reject Parent Objection / Hand-Up for Pastoral Response.**
  **Reasoning:** Al-Ghazālī explicitly affirms taking means (*asbab*). Denying transmission denies the *ʿādah* (habit) of God. The curriculum must teach transmission. However, the Board must draft the response to the family to ensure the religious formation aspect is addressed in the Religion department, not by compromising the Science text.
  **Outcome:** Science text remains unchanged. Family counseling required.

  ### Case 3: Physics (Exceptionless Laws)
  **Item:** "The regularities described in this chapter are exceptionless laws of nature."
  **Reviewer Annotation:** None (This is the Director's preferred sentence).
  **Procedure Run:**
  1.  **Empirical Check:** Pass. Regularities are observed.
  2.  **Necessity Check:** **Fail.** "Exceptionless" asserts ontological necessity. It precludes the possibility of *Karamat* (miracles of saints) or *Mu'jizat* (miracles of prophets), which are core Islamic doctrines. It asserts the creation has autonomy from the Creator's will.
  3.  **Pedagogical Check:** Pass. "Consistent" works as well as "Exceptionless."
  4.  **Board Threshold:** No. This is a clear doctrinal boundary.
  **Verdict:** **Revise.**
  **Required Change:** "The regularities described in this chapter are consistent patterns within the habitual order of creation."
  **Unwelcome Truth:** You must delete "exceptionless." To keep it is to teach that God is bound by the physics text. This contradicts the *Incoherence* and the *Qur'ān*. The sentence you like best is theologically untenable in this framework.

  ---

  ## Part V: Limitations & Honest Recommendations

  **What This Procedure Cannot Do:**

  1.  **It Cannot Reconcile Materialism with Tawḥīd:** If a text explains a phenomenon using *only* material causes and explicitly excludes divine will as a category of explanation (methodological naturalism), this procedure can patch the language, but it cannot fix the underlying epistemology. If the science curriculum teaches that "only physical causes exist," no wording tweak will save it.
  2.  **It Cannot Stop "Miracle-Seeking" in Science Class:** Parents or students who expect the science curriculum to validate miraculous interruptions of physics (e.g., "Pray so the virus doesn't transmit") will not be satisfied. The procedure protects the science from theology, and the theology from science, but it does not merge them into a single super-discipline.
  3.  **It Will Misfire on Evolution:** The "Empirical Integrity Check" (Gate 1) will struggle with common ancestry vs. special creation. This procedure handles *causation*, not *origins*. Do not use this triage for biology units on human origins; those require full Board review.
  4.  **It Cannot Replace ʿAqīdah Class:** This procedure is a damage-control mechanism for science texts. It is not a teaching tool for theology.

  **The Hard Recommendation:**
  There are cases where a school's science curriculum cannot be made consistent with a medieval theological account of causation without rendering the science useless for college preparation.
  *   **If the choice is between Accreditation and Metaphysical Precision:** Keep the science text standard (using "cause" and "law" as technical terms) and move the metaphysical qualifiers to the *Religion* curriculum.
  *   **Why:** A student who writes "Fire does not burn cotton; Allah does" on a standardized chemistry exam will fail. A student who understands "Fire burns by Allah's habit" in Religion class and "Oxidation releases energy" in Science class will succeed in both.
  *   **Action:** If the Board finds itself flagging more than 10% of the text, stop revising the science books. Revise the scope and sequence of the Religion department to ensure the theology of causation is taught *there*, explicitly referencing the science concepts. Do not break the science tool to fix the theology lesson.

  **Systematic Misfire Warning:**
  This procedure assumes the reviewers understand the difference between *scientific law* (description) and *natural law* (prescriptive ontology). They will often conflate them. Expect the procedure to flag standard descriptions of gravity or thermodynamics as "theological errors" simply because they sound deterministic. The Board must be prepared to overturn Reviewer verdicts that confuse *predictability* with *necessity*.
