      *Drafting content:*
      To: Medal Committee and Council
      From: [Name]
      Subject: Selection Methodology and Current Award

      **Recommendation**
      Uphold this year's award to preserve procedural legitimacy, but immediately adopt a hybrid selection model: a five-member panel shortlists three candidates, and the full committee selects the winner via a Condorcet-ranked ballot. This balances expert filtering with democratic accountability while minimizing strategic manipulation.

      **Diagnosis of Current Result**
      Our current method, Instant Runoff Voting (IRV), eliminates candidates with the fewest first-place votes until one holds a majority. This year, the low-temperature experimentalist was the Condorcet winner—meaning they would have defeated every other candidate in a head-to-head contest—yet were eliminated in the second round. This is a known failure mode of IRV: it violates the Condorcet criterion. Regarding the three members who admitted strategic voting (burying a strong candidate to alter elimination order): recomputing the ballot without their contributions would show whether their tactics changed the winner, but it cannot recover their sincere preferences. We can determine if the manipulation was decisive, but not what the sincere outcome would have been.

      **Audit of Arrow's Impossibility Theorem**
      My colleague's note invokes Arrow's Impossibility Theorem, which states that no ranked voting system can satisfy four conditions simultaneously: Unrestricted Domain (any preference order is allowed), Non-dictatorship (no single voter dictates the outcome), Pareto Efficiency (if everyone prefers A to B, the group prefers A to B), and Independence of Irrelevant Alternatives (IIA). IIA means the group's ranking of A versus B should not depend on the presence of candidate C. Our current rule violates IIA, as removing the historian changed the winner between the theorist and experimentalist.

      The proposal to replace the ballot with a five-member panel does not escape Arrow's theorem; it sidesteps it. A panel deciding by consensus is technically an oligarchy. In Arrow's terms, if the panel produces a single ranking, it acts as a dictator (or small group of dictators) relative to the full committee. If they decide by discussion without a formal ranking, they fail to produce a social welfare function entirely, which avoids the theorem but removes transparency. Trusting people over arithmetic does not negate the mathematical constraints on aggregating preferences; it merely shifts the locus of arbitrariness from the voting rule to the panel's private deliberation.

      **Manipulation and Gibbard-Satterthwaite**
      The confession of strategic voting relates not to Arrow, but to the Gibbard-Satterthwaite theorem. This result proves that any ranked voting rule is susceptible to tactical voting (manipulation) unless it is dictatorial or restricts the domain of preferences. This confirms that manipulation is an inherent risk in any democratic selection. However, not all rules are equally vulnerable in practice. Elimination rounds like IRV are highly vulnerable to "burying" strong competitors. Score voting or approval voting (rating candidates independently) are less susceptible to this specific tactic, though they introduce other complexities regarding how scores are calibrated.

      **Preference Structure**
      Arrow's conditions assume Unrestricted Domain. If our committee's preferences are "single-peaked"—meaning we all order candidates along a shared spectrum, such as scientific impact or seniority—then a simple majority rule yields a consistent outcome without cycles. We should examine this year's ballots to see if preferences cluster by field or seniority. If preferences are structured rather than random, a Condorcet method (which selects the candidate who beats all others pairwise) becomes a robust and fair solution, satisfying most fairness criteria despite Arrow's general impossibility.

      **The Case for Deliberation**
      My colleague's argument for a panel has merit beyond mathematical technicalities. Deliberation allows members to weigh incommensurable contributions—comparing instrument-building to theory—without pretending a ballot captures nuance. A panel can identify factual errors in nominations and hold members accountable by name, whereas a secret ballot anonymizes responsibility. However, removing the full committee from the final decision risks alienating the society's membership and concentrating power too narrowly. A hybrid model retains the panel's filtering capacity while preserving the committee's ultimate authority.

      **Actionable Motion and Schedule**
      To resolve this in one sitting, I propose the following motion:

      *Motion:* That the statute governing the medal be amended to define "preferred by the committee" as the winner of a Condorcet vote among three finalists shortlisted by a five-member Nominating Panel.

      *Proposed Statute Wording:* "The Medal shall be awarded to the candidate who defeats all other finalists in pairwise majority comparisons. Finalists shall be nominated by a five-member panel appointed by the Council."

      *Schedule:*
      1. Council approves motion today.
      2. Panel appointed by March 1.
      3. Panel submits shortlist by June 1.
      4. Committee votes by July 1.
      5. Award announced September 1.

      **Regarding This Year's Medal**
      Upholding the current result is defensible, not merely convenient. The statute was followed as written, and retroactive invalidation undermines the authority of future votes. The flaw lies in the rule, not the execution. We must accept this outcome to secure the legitimacy of the reformed process for future years.

