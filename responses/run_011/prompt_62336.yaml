answer: |-
  # FORMAL EPISTEMOLOGY — END OF YEAR PAPER

  **Question 4** (25 marks)

  A researcher S is considering a new theory H. Her prior is P(H) = 0.20. The lab's archive contains ten long-standing recorded regularities, R1 … R10, all of which H entails. S has known about all ten for years and gives each a prior of 0.90, regarding them as probabilistically independent, so her prior for the conjunction of all ten is 0.9^10 ≈ 0.35. She has personally derived that H entails R1, but she has not checked whether H entails R7 — that derivation would take a month of work. Separately, H entails a novel prediction N that nobody had thought to look for; a rival theory makes N somewhat likely, so S's prior for N is 0.25. N is then observed.

  (a) Compute P(H|R1), P(H|N), and P(H|R1 ∧ … ∧ R10). In each case, say whether the shift in S's credence is confirmation in the sense that is actually at issue in the old evidence problem. [8 marks]

  (b) Evaluate the response that denies P(E) = 1 is ever the right idealisation and insists the boost from R1 is perfectly genuine confirmation. Address the bootstrapping worry (S can raise her credence in H from 0.20 to roughly 0.57 just by rehearsing consequences she already knew) and the threshold worry (what happens at P(R1) = 0.99 or 0.999999, and what principle picks out where the problem starts). [9 marks]

  (c) Consider the Garber-style route, where the agent conditionalises on the proposition that H entails R rather than on R itself. Explain why this does not apply to R1 but does apply to R7. What does this asymmetry cost the proposal, including what S's priors over entailment claims would have to look like? End by saying whose problem this is: a problem for the norms of Bayesian reasoning, for the idealisations the framework needs, or for the claim that Bayesianism captures what is evidentially special about a theory getting the data right. [8 marks]

  *Calculators are allowed. Show your working.*

  ***

  # MODEL ANSWER

  **(a)**
  By Bayes' theorem, $P(H|E) = \frac{P(E|H)P(H)}{P(E)}$. Since H entails the evidence in all cases, $P(E|H) = 1$. Thus $P(H|E) = \frac{P(H)}{P(E)}$.

  1.  **For R1:** $P(H|R_1) = \frac{0.20}{0.90} = \frac{2}{9} \approx 0.22$.
  2.  **For N:** $P(H|N) = \frac{0.20}{0.25} = 0.80$.
  3.  **For R1 ∧ … ∧ R10:** $P(H|R_{1-10}) = \frac{0.20}{0.35} = \frac{4}{7} \approx 0.57$.

  Regarding confirmation: In the standard Bayesian account, confirmation is simply an increase in credence ($P(H|E) > P(H)$). Formally, all three cases yield confirmation. However, the old evidence problem concerns cases where the evidence is already known with certainty ($P(E)=1$). Here, $P(N)=0.25$, so N is novel evidence. $R_1$ and the conjunction are 'old' in the sense that S knew them beforehand, but the case stipulates $P(R_i) < 1$. The shift for N represents standard predictive confirmation. The shift for R1 and the conjunction represents 'confirmation from old evidence' only because we have refused to idealise their probability as 1. If we treated them as certain, the denominator would be 1, and there would be no shift. The difference in epistemic weight tracks entirely on how probable the consequence already was.

  **(b)**
  Denying $P(E)=1$ avoids the zero-shift result, but invites two serious worries. First, the bootstrapping worry. If S can raise her credence in H from 0.20 to 0.57 merely by deriving ten consequences she already accepted (R1…R10), she achieves a massive boost without empirical input. This looks like rationalism run wild; she confirms a theory purely armchair by noting it fits what she already believed. If this is legitimate, it suggests her prior uncertainty about the regularities was actually uncertainty about H all along, merely disguised. If it is a reductio, then allowing $P(E) < 1$ for known evidence permits epistemic free lunches.

  Second, the threshold worry. If a boost is genuine at $P(R_1)=0.90$, is it also genuine at 0.99? At 0.999999? There is no natural cutoff where evidence becomes 'too old' to confirm. If the boost is real at 0.90 but vanishes at 1.0, the theory relies on an arbitrary distinction between high probability and certainty. This suggests the solution does not solve the structural problem but merely hides it behind a vague boundary. The principle picking out where the problem bites is missing; without it, the account cannot explain why Mercury's perihelion (known near-certainty) feels different from a novel prediction, other than by pointing to a decimal place.

  **(c)**
  The Garber-style route proposes conditionalising on the logical claim 'H entails E' ($H \vdash E$) rather than E itself. This allows learning that H explains the data to boost H.

  This fails for R1 because S already knows H entails R1. For Garber's method to work, the agent must be uncertain about the entailment relation. Since S has derived R1, $P(H \vdash R_1) = 1$, so conditionalising on it yields no update. It applies to R7 because S has not checked the derivation; she is uncertain whether H entails R7. Learning that entailment holds would boost her credence in H.

  This asymmetry costs the proposal generality. It solves the problem only for agents who are not logically omniscient. It requires S to have non-extreme priors over logical relations (e.g., $0 < P(H \vdash R_7) < 1$). This violates the standard idealisation of logical omniscience required for coherent Bayesian priors.

  Whose problem is this? It is primarily a problem for the idealisations the framework needs. Standard Bayesianism assumes logical omniscience; relaxing this makes the model more realistic but formally complex. It is not necessarily a problem for the norms of reasoning (agents ought to learn from logical insights), but it undermines the claim that standard Bayesianism captures what is evidentially special about getting data right. If confirmation depends on the agent's ignorance of logic, then the evidential value lies in the psychological learning event, not the objective relation between theory and world.

  ***

  # MARKING SCHEME

  **Total Marks: 25**
  **Pass Mark: 10**

  ### Part (a) — 8 Marks
  **Must-hit moves:**
  *   **Calculations (3 marks):** 1 mark for each correct numerical result ($0.22$, $0.80$, $0.57$). Allow minor rounding differences if working is shown.
  *   **Diagnosis (5 marks):**
      *   Identify that formally all are confirmation (credence rises) (2 marks).
      *   Identify that the old evidence problem turns on $P(E)=1$ (2 marks).
      *   Note that the difference in epistemic status tracks the prior probability of the evidence (1 mark).

  **Differentiation:**
  *   **2:1 (60%+):** Correct calculations and clearly states that standard Bayesianism yields no confirmation if $P(E)=1$.
  *   **1st (70%+):** Explicitly connects the numerical difference to the philosophical definition of the problem (i.e., that the 'problem' disappears only if we refuse the certainty idealisation).

  ### Part (b) — 9 Marks
  **Must-hit moves:**
  *   **Bootstrapping Worry (4 marks):** Explains that S gains credence without new empirical data (armchair); identifies this as potentially irrational or a 'free lunch' (2 marks); discusses whether this is a reductio or a correction of prior uncertainty (2 marks).
  *   **Threshold Worry (4 marks):** Notes the continuum from 0.90 to 1.0; argues there is no principled cutoff for when confirmation stops (2 marks); identifies the arbitrariness of the idealisation (2 marks).
  *   **Evaluation (1 mark):** Concludes whether this response solves the problem or merely shifts it.

  **Differentiation:**
  *   **2:1 (60%+):** Describes both worries accurately.
  *   **1st (70%+):** Critically evaluates the 'correction of residual uncertainty' angle — i.e., suggests that if the boost is real, the agent was never truly certain of the evidence independent of the theory.

  ### Part (c) — 8 Marks
  **Must-hit moves:**
  *   **Garber Mechanism (2 marks):** States the update is on the entailment claim, not the evidence.
  *   **Asymmetry (4 marks):** Explains it fails for R1 (entailment known/certain) (2 marks); explains it works for R7 (entailment uncertain) (2 marks).
  *   **Cost/Priors (1 mark):** Notes the requirement for non-extreme priors on logical truths (violating omniscience).
  *   **Whose Problem (1 mark):** Assigns the problem to idealisations or the capture of evidential value (not merely calculation norms).

  **Differentiation:**
  *   **2:1 (60%+):** Correctly identifies the R1/R7 asymmetry and the logical omniscience violation.
  *   **1st (70%+):** Nuanced conclusion on 'Whose problem', distinguishing between normative failure and descriptive inadequacy of the model.

  ### Concrete Errors (Costing Marks)

  1.  **Error:** Setting $P(R_1) = 1$ in part (a) despite the prompt specifying 0.90.
      *   **Marks Lost:** 3 marks (Calculation section).
      *   **Misunderstanding Revealed:** Failure to read the specific constraints of the hypothetical case; applying the 'old evidence problem' assumption rather than the numbers given.

  2.  **Error:** Claiming $R_1$ confirms H simply because $P(R_1|H) = 1$, ignoring the denominator $P(R_1)$.
      *   **Marks Lost:** 2 marks (Diagnosis section).
      *   **Misunderstanding Revealed:** Fundamental misunderstanding of Bayes' theorem; confusing likelihood with posterior probability.

  3.  **Error:** Asserting that the Garber solution works for $R_1$ because H still entails it.
      *   **Marks Lost:** 2 marks (Asymmetry section).
      *   **Misunderstanding Revealed:** Missing the core mechanism of the Garber solution (learning the entailment relation) and conflating it with standard conditionalisation.

  4.  **Error:** Discussing the 'Problem of New Theories' (how to assign priors to H) instead of Old Evidence.
      *   **Marks Lost:** 3 marks (Relevant content across parts).
      *   **Misunderstanding Revealed:** Confusing distinct problems in Bayesian confirmation theory; inability to distinguish between prior assignment and updating on consequences.

  ### Grade Boundaries
  *   **First (70–100):** All calculations correct. Deep engagement with the 'Whose problem' question. Clear distinction between the bootstrapping worry as a reductio vs. a feature. Precise handling of logical omniscience.
  *   **2:1 (60–69):** Correct calculations. Identifies both worries in (b) and the asymmetry in (c). May lack depth on the normative implications.
  *   **2:2 (50–59):** Calculations mostly correct. Identifies one worry in (b). Identifies Garber involves entailment but misses the R1/R7 asymmetry nuance.
  *   **Pass (40–49):** Attempts calculations (even if wrong). Identifies that old evidence is problematic. Mentions Garber.
  *   **Fail (0–39):** Significant calculation errors. Fails to address the specific prompts (e.g., ignores bootstrapping).
