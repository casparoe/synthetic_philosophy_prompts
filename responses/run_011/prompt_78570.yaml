answer: |-
  This is not padding. You have isolated a specific *structural dynamic* within the boundary problem literature that is often treated as noise rather than signal. Most theorists treat the boundary problem as a hurdle to be cleared (e.g., "Here is my criterion, it solves Whelan"). You are observing that the *attempted solutions* exhibit a systematic instability.

  Your supervisor may think you are padding because you are framing this as a *problem to be solved* rather than a *phenomenon to be described*. If you try to solve the oscillation, you will just become another data point in it. If you theorize the oscillation itself, you are doing meta-theory.

  Here is the breakdown you asked for: existing concepts, the literature on the movement, and a proposed conceptual framework with boundary tests.

  ### (a) Nearest Existing Concepts and Differentiation

  There is no single label that captures exactly what you are describing, but there are three adjacent concepts. Your contribution is the synthesis of their structural logic applied specifically to the *instability of justification*.

  **1. The Münchhausen Trilemma (Hans Albert)**
  *   **The Concept:** In epistemology, Albert argued that any attempt to ultimately justify a proposition leads to one of three outcomes: (1) an infinite regress, (2) a logical circle, or (3) a dogmatic break (stopping the regress by fiat).
  *   **The Fit:** This is the exact structural skeleton of your observation. Your "Horn 1" (the demos decides its boundaries) is the **Circle**. Your "Horn 2" (moral facts/history decide) is the **Dogmatic Break**.
  *   **The Difference:** Albert uses this to argue for critical rationalism (abandon ultimate justification). You are observing that democratic theory *cannot* abandon ultimate justification (legitimacy is required), so it gets stuck sliding between the Circle and the Dogma. The "oscillation" is the literature trying to disguise the Dogma as a Circle or vice versa.
  *   **Use:** Cite this to show the logical form is not unique to politics, but the *normative cost* of the trilemma is unique to democracy.

  **2. The Paradox of Politics (Bonnie Honig)**
  *   **The Concept:** In *Political Theory and Its Disputes* (1993), Honig analyzes the "chicken and egg" problem of the people and the law (Rousseau/Siegel). The people make the law, but the law makes the people.
  *   **The Fit:** Honig explicitly argues against solving this paradox. She suggests the "movement" you see is not a bug but a feature of democratic vitality.
  *   **The Difference:** Honig focuses on the *temporal* paradox of founding (constituent power). You are focusing on the *spatial/jurisdictional* paradox of boundaries. More importantly, you are tracking how *proposed solutions* migrate between horns, whereas Honig tracks how the *state* relies on the tension.
  *   **Use:** Use Honig to validate that "living with the paradox" is a legitimate theoretical stance, but pivot to her lack of focus on the *migration of criteria* (e.g., how "all-affected" slides into "all-subjected").

  **3. Reflexive Law / Autopoiesis (Luhmann, Teubner, Lindahl)**
  *   **The Concept:** Legal systems are operationally closed; they define their own boundaries. Hans Lindahl (*Constituent Power and Reflexivity*) argues the legal order posits its own unity.
  *   **The Fit:** This describes Horn 1 (Self-Constitution) technically.
  *   **The Difference:** Systems theory is descriptive. It says "this is how systems work." You are asking a normative question: "What is the *legitimacy cost* when a system claims to be open but is closed?" You are interested in the *failure* of reflexivity to satisfy democratic intuitions, which leads to the slide toward Horn 2 (external morality).

  ### (b) Literature on the *Movement* Between Horns

  Most literature picks a horn and digs in. Very little focuses on the slide. However, these authors come closest to tracking the dynamic:

  1.  **Arash Abizadeh ("Democratic Theory and Border Coercion," 2008):** He argues borders *must* be democratically justified (forcing Horn 1). But critics immediately push him on *who* votes on the border justification. He is forced to appeal to universal moral principles (sliding toward Horn 2). Analyze the *replies* to Abizadeh to show the push-back dynamic.
  2.  **Robert Goodin ("Enfranchising All Affected Interests," 2007):** He tries to dissolve the boundary by expanding the demos to everyone affected globally. This attempts to escape the circle by making it universal. But critics ask: "Who decides who is affected?" (Back to Horn 1).
  3.  **Jacques Derrida ("Force of Law," 1990):** While not a democrat, his concept of the "mystical foundation of authority" describes the moment a decision is made that is neither legal nor illegal. This is the *point of the slide*. The founding moment is the pivot between the two horns.
  4.  **Andreas Kalyvas (*Democracy and the Politics of the Extraordinary*, 2008):** He discusses how constituent power (the people) is both inside and outside the order. He focuses on the *extraordinary* moment. You can extend this to argue the boundary problem makes *every* democratic decision potentially "extraordinary" because the boundary is never settled.

  **Your Gap:** None of these treat the *oscillation itself* as the primary object of study. They treat it as a hurdle. Your paper would argue the oscillation is the *mechanism* of democratic boundary discourse.

  ### (c) Naming, Definition, and Boundary Testing

  If you build a chapter on this, you need a sharp conceptual tool. I propose adopting and adapting the epistemological term:

  **Proposed Name:** **The Democratic Grounding Trilemma** (or **The Boundary Justification Trilemma**)
  *Alternative:* **The Meta-Boundary Oscillation**

  **Definition:**
  > A structural instability in democratic justification wherein any criterion for setting the boundaries of the *demos* inevitably collapses into either (1) **Vicious Circularity** (the boundary is set by the very group whose boundary is in question) or (2) **Heteronomous Fixity** (the boundary is set by non-democratic facts, morality, or history). Theoretical attempts to resolve this tension do not rest on one horn but exhibit a **justificatory slide**, where the costs of one horn (illegitimacy vs. undemocratic) push the theory toward the other, without a stable equilibrium.

  **Boundary Testing (Is your concept applicable here?):**

  To prove this is a robust category and not just "the boundary problem," you must show where it applies and where it *doesn't*.

  **1. The Constitutional Convention Case**
  *   *Scenario:* A convention is convened to write a constitution. They decide who gets to vote for ratification.
  *   *Test:* Does it fit the Trilemma?
  *   *Analysis:* **Yes.** If the convention delegates decide the electorate, it is Horn 1 (Circular/Self-constituting). If the convention is bound by a prior treaty or UN resolution on who votes, it is Horn 2 (Heteronomous).
  *   *Nuance:* If the convention uses a "stakeholder" model, critics will ask who defined the stakeholders. The slide occurs. This is a core case.

  **2. The Sortition Case (Random Selection)**
  *   *Scenario:* A demos is selected by lottery from the global population to decide a border policy.
  *   *Test:* Does it escape the Trilemma?
  *   *Analysis:* **No, it masks Horn 2.** Sortition removes human agency from the boundary setting, appearing to avoid circularity. But the *rule* of sortition (why global? why national?) must be justified. If the rule is chosen by the existing demos -> Horn 1. If the rule is chosen by "natural equality" -> Horn 2. Sortition does not escape the structure; it merely naturalizes the boundary (making it look like fate/chance).
  *   *Value:* This shows your concept captures *disguised* forms of the problem, not just overt ones.

  **3. The Federation Admission Case**
  *   *Scenario:* An existing federation votes to admit a new member state.
  *   *Test:* Is this a boundary problem at one level up?
  *   *Analysis:* **Yes, but it shifts the locus.** For the Federation, it is Horn 1 (existing members decide). For the Applicant, it is Horn 2 (they are subject to a decision they didn't make).
  *   *Differentiation:* This shows the Trilemma is **scalable**. It doesn't disappear at higher levels of abstraction; it just changes who bears the cost of which horn. This is a strong point for your paper: the problem isn't solved by federalism, it is *distributed*.

  **4. The "Open Borders" Case (Cosmopolitanism)**
  *   *Scenario:* Abolish borders entirely. Everyone is in the demos.
  *   *Test:* Does this solve it?
  *   *Analysis:* **No, it triggers the Regress (the third option of the Trilemma).** If everyone is in, who decides the scope of "everyone"? (e.g., future generations? AI? Animals?). If the answer is "moral fact," you are on Horn 2. If the answer is "we decide," you are back to Horn 1 (who is "we"?).
  *   *Value:* Shows that even dissolving the boundary doesn't stop the oscillation; it just expands the circle until it breaks.

  ### Strategic Advice for the Quals Paper

  1.  **Don't Solve It:** If you conclude with "Therefore, we should use the All-Affected Principle," you have failed. You have just entered the oscillation.
  2.  **Diagnose the Costs:** Your conclusion should be about the *trade-offs*. "Theories that prioritize Democratic Agency (Horn 1) incur a cost of Exclusionary Arbitrariness. Theories that prioritize Moral Universality (Horn 2) incur a cost of Democratic Alienation."
  3.  **Reframe the Topic:** Your topic isn't "Democratic Boundaries." It is **"The Structural Instability of Democratic Boundary Justification."**
  4.  **The "Padding" Defense:** If your supervisor pushes back, argue that you are not restating Whelan. Whelan identifies the *logical paradox*. You are identifying the *sociology of theoretical justification*—how theorists move to avoid the paradox. You are studying the *response* to the problem, not the problem itself.

  **Final Verdict:** You have found a viable, sophisticated angle. It moves you from "student summarizing literature" to "theorist analyzing the limits of the field." Use the **Münchhausen Trilemma** as your structural anchor and **Bonnie Honig** as your normative guide for why we might need to inhabit the oscillation rather than resolve it.
