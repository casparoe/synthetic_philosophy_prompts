answer: |-
  Here is a complete design for the 100-minute seminar. It is built to be tight, slightly uncomfortable, and pedagogically precise.

  ### **Session Title:** The Life of Sarah Ann Vickery
  **Time:** 100 Minutes
  **Room Setup:** Two distinct halves of the room. Tables clustered for groups of 8.
  **Materials:** Two distinct document packets (Red and Blue), large sheets of paper for timelines, "Biographer's Prize" tokens (can be literal candy or just printed certificates).

  ---

  ### **1. The Setup (0:00 – 0:10)**
  **Instructor Script:**
  "Welcome. Today is not about theory. It is about reconstruction. You are biographers. You have been granted access to a newly discovered box of papers from a Midlands parish, dated 1826 to 1860. The subject is Sarah Ann Vickery.
  Your task: Write the definitive biography of Sarah Ann Vickery.
  **The Rule:** You must tell a coherent story. Ambiguity is the enemy. If the record says 'removed,' you must decide *why*. If there is a gap of three years, you must explain *what she was doing*.
  **The Incentive:** The group that produces the most compelling, emotionally resonant, and causally linked narrative wins the Biographer's Prize. We are judging on *narrative power*, not caution."

  *(Note: You are explicitly incentivizing them to over-interpret. This is the trap.)*

  ### **2. The Contrast Beat (0:10 – 0:15)**
  **Activity:** "The Landowner Test."
  **Instructor:** "Before you open your packets, turn to your neighbor. You have two minutes. List every document you would expect to survive for the *largest landowner* in that same parish between 1826 and 1860. Go."
  **Action:** Students shout out items. TA writes them on the whiteboard.
  **Expected Output:** Estate maps, correspondence, leases, diaries, portraits, hunting logs, parish vestry minutes (chaired by him), newspaper mentions, wills, gravestone, family bible.
  **Instructor:** "Count them. (Usually 10+). Keep that number in your head. Open your packets."

  ### **3. Group Work: Constructing the Life (0:15 – 0:45)**
  **Split:** Divide the 16 students into **Team Red (8 students)** and **Team Blue (8 students)**.
  **TA Role:** The TA circulates *aggressively*. If a group says, "We don't know why she moved," the TA says, "You're biographers. Make a call. The prize goes to the confident story." (This feeds the trap).

  **Packet Allocation (The Asymmetry):**

  *   **Team Red (The Institutional View):**
      *   *Includes:* Magistrates' Removal Order, Workhouse Admission/Discharge Register, Parish Account Book (costs), Curate's Letter to Charity, Quarter Sessions Calendar.
      *   *Excludes:* Deposition, Petition, Beer House License.
      *   *Resulting Narrative:* A tragedy of destitution. Sarah is a passive object shuffled between parishes, a cost to the ratepayers, a 'fallen' woman saved by clerical intervention. She is defined by her dependency.

  *   **Team Blue (The Agency View):**
      *   *Includes:* Census Line, Deposition (naming father), Petition Mark (footpath), Beer House License (Trade Directory), Burial Entry.
      *   *Excludes:* Removal Order, Workhouse Logs, Parish Accounts, Curate's Letter.
      *   *Resulting Narrative:* A saga of resilience. Sarah is a mother fighting for her child's legitimacy, a neighbor engaged in community governance (petition), an entrepreneur (licensee). She is defined by her endurance.

  *   **Both Teams Get:** The Census (birth/bookend) and Burial Entry (death/bookend).

  ### **4. The Collision & The Prize (0:45 – 1:05)**
  **Activity:** Each team has 5 minutes to present their biography.
  **Judging:** You and the TA act as judges. Use the "Narrative Power" rubric.
  *   *Team Red* will present a moving story of systemic cruelty.
  *   *Team Blue* will present an inspiring story of individual grit.
  **The Award:** Award the prize to *both* teams. "Both stories were compelling. Both were historically plausible based on the evidence provided."
  **The Turn:** "Now, swap packets. Team Red, read Team Blue's documents. Team Blue, read Team Red's documents. You have 5 minutes. Discuss: How does this change the person you just eulogized?"

  ### **5. The Reveal (1:05 – 1:15)**
  **Instructor Script:**
  "Look at the combined picture. She is both the pauper *and* the licensee. She is both the burden *and* the neighbor.
  Now, look at the *handwriting*.
  *   **Team Red's documents:** Written by Clerks, Overseers, Magistrates, Curates. People paid to manage her.
  *   **Team Blue's documents:** A deposition (her words, written by a clerk), a mark (her hand, on a document drafted by others), a directory entry (compiled by a printer selling books).
  *   **Missing:** A letter to her child. A diary entry about the workhouse food. A photograph. A gravestone she chose.
  The archive did not lose her life by accident. It preserved the parts of her life that were someone else's administrative problem."

  ### **6. The Debrief (1:15 – 1:30)**
  **Key Discussion Points (Instructor-led):**

  1.  **The Trap of Coherence:** "I asked you for a confident story. The archive rewards confidence. But for Sarah Ann, confidence is a lie. The gaps aren't puzzles to be solved; they are the reality of her life."
  2.  **History from Below:** "This is what 'History from Below' fights against. It isn't just adding poor people to the timeline. It is reading the *official* record against the grain to find where the person pushes back. (Point to the Petition Mark). That 'X' is a political act in a sea of clerical text."
  3.  **Scale and Generalization:** "Does Sarah's life prove all poor women were resilient? No. Does it prove all were crushed? No. It proves the *system* treated them as costs. The micro-scale exposes the *machine* (the Removal Law, the Settlement Act) that a county-level narrative would call 'Poor Relief' and move on."
  4.  **The Landowner Contrast:** "Recall the whiteboard. The landowner's life is preserved because he *owned* the paper. Sarah's life is preserved because she *cost* money."

  ### **7. Addressing the Genealogy Kids (1:30 – 1:35)**
  **The Objection:** "But surely we could just find more? Parish magazines? Local newspapers?"
  **Your Response:**
  "This dossier *is* the local archive. This is the box labeled 'Vickery' that doesn't exist. The newspapers didn't print her name unless she was prosecuted. The parish magazines were for the pews, not the workhouse.
  In genealogy, the goal is *connection* (finding the link). In history, the goal is *explanation* (understanding the silence). If you find one more letter, you have changed her story, but you haven't changed the *structure* of the archive. The fix isn't more sources; the fix is admitting the sources are biased."

  ### **8. Wrap Up (1:35 – 1:40)**
  **Final Thought:**
  "We end with the Beer House License. It looks like a happy ending. She survived. But notice: it's a Trade Directory. It was printed to sell information to merchants, not to celebrate her. She is visible only because she became a taxable unit.
  Next week: We talk about how to write history when the subjects are silent. Read Thompson."

  ---

  ### **Predictable Failure Points & Fixes**

  | Failure Mode | Why it happens | How to Handle |
  | :--- | :--- | :--- |
  | **Students refuse to speculate.** | They are trained to be cautious. | **Fix:** During group work, explicitly say: "I am not grading accuracy today. I am grading narrative cohesion. If you write 'we don't know,' you lose points." |
  | **The "Beer House" feels like a rescue.** | Students want a happy ending. | **Fix:** In the Reveal, emphasize the *source*. It's a commercial directory. She is a line item. Ask: "Does this tell us if she was happy? Or just that she was solvent?" |
  | **Team Red vs. Team Blue hostility.** | They feel their version was "wrong." | **Fix:** Frame it as "Perspective," not "Truth." Red saw the State's view. Blue saw the Community's view. Both are true, neither is whole. |
  | **TA is too helpful.** | TA tries to guide them to the "right" answer. | **Fix:** Brief the TA beforehand: "Your job is to encourage *boldness*, not accuracy. Feed the trap." |

  ---

  ### **Honesty Check: What This Exercise Cannot Reproduce**

  1.  **The Frustration of the Search:** In this seminar, the documents are printed and handed to them. In reality, finding *one* of these documents might take three days in a cold archive. They won't feel the *exhaustion* that leads historians to over-interpret a single find.
      *   *Supply by hand:* You must verbally simulate this. "Imagine you found this one workhouse log after three days of reading microfilm. How much weight would you put on it?"
  2.  **The Chaos of the Archive:** Your dossier is neat. Real archives are disordered, illegible, and incomplete in random ways.
      *   *Supply by hand:* Print the documents on different quality paper. Make the Curate's letter hard to read (fancy script). Make the Workhouse log look like a grid of numbers. Give them the *texture* of difficulty.
  3.  **The Emotional Stakes:** They know it's a seminar. They don't feel the moral weight of misrepresenting a dead person.
      *   *Supply by hand:* In the debrief, be serious. "If you get her wrong, it doesn't matter. But if we get a whole class of people wrong, we change how we understand justice."

  ### **Critique of Your Dossier (Rigging Check)**

  *   **The Beer House License:** This is the riskiest element. If it's too prominent, it undermines the "powerlessness" thesis.
      *   *Fix:* Ensure the Trade Directory entry looks dry and bureaucratic. Do not highlight it. Bury it in Packet Blue among the other docs. It should feel like a surprise, not a reward.
  *   **The Petition Mark:** This is your strongest piece of evidence for agency.
      *   *Fix:* Make sure they notice it's just a *mark* (an 'X'), not a signature. It shows she couldn't write her name, but she had political will. That tension is gold.
  *   **The "Invented Parish":** Good call. Prevents Googling.
      *   *Fix:* Ensure the place names sound generic Midlands (e.g., "Little Mucking," "St. Jude's in the Marsh") so they don't trigger real geographic knowledge.

  ### **Final Note on the "Genealogy Kids"**
  You have three students who think "a record is a record." This exercise is designed specifically to break that axiom.
  When they argue for more sources, hit them with this:
  *"The archive is not a library. It is a graveyard. It keeps what the powerful thought worth keeping. Finding more records doesn't fix the graveyard; it just adds more tombstones written by the warden."*

  This lesson plan respects your constraints, utilizes your TA, leverages the dossier effectively, and delivers the pedagogical "punch" you're looking for without lecturing until the students have felt the problem themselves.
