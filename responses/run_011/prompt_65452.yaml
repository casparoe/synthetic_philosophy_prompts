  2. Challenge the "Carr Settled It" premise (it's more nuanced).
  3. Offer the "Underspecification" argument (the cleanest way to show it's broken).
  4. Suggest the "Working Towards the Führer" synthesis as the "surviving version."
  5. Conclusion: Keep the question, change the task.

