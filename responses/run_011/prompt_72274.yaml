answer: |-
  **BOARD MEMORANDUM**

  **TO:** Board of Directors, Regional Transit Authority
  **FROM:** [Your Name]
  **DATE:** September 15, 2024
  **SUBJECT:** Recommendation on Prediction Market Pilot for Congestion Cordon Decision

  ### **Recommendation**

  I recommend we **adopt the prediction market proposal with strict governance conditions.**

  We should not reject the tool outright, as it offers a mechanism to improve decision quality that our current process lacks. However, we cannot adopt the proposal as currently drafted. It conflicts with our bylaws regarding findings of fact, bypasses our adopted Equity Policy, and creates market integrity risks that could invalidate the data.

  My motion will be to authorize the pilot only if: (1) the Board ratifies the Welfare Index formula to include equity weighting prior to market launch; (2) we establish position limits and disclosure rules for traders; and (3) the resolution treats the market price as evidentiary support for findings, subject to a supermajority override.

  ### **The Strongest Case for the Proposal**

  Before detailing the conditions, it is necessary to acknowledge why this proposal deserves serious consideration. Our colleague from fintech is correct about the fundamental flaw in our status quo.

  Currently, this Board makes high-stakes decisions based on a process that aggregates whoever shouts loudest at public comment, combined with internal modeling that is never held accountable. When we vote on a project, there is no mechanism to verify if our assumptions were correct until years later, by which time no one is on the hook for being wrong. We confuse political viability with operational success.

  A prediction market forces a specific discipline: it requires participants to put capital behind their beliefs. It aggregates dispersed information—from traffic engineers to downtown business owners—that never makes it into our staff reports. If we can credibly commit to following the market, we insulate the decision from short-term political pressure and align incentives with actual outcomes. Dismissing this as a "stunt" ignores the genuine failure of our current deliberative process to distinguish between strong arguments and loud voices.

  ### **Critical Issues and Required Conditions**

  While the principle is sound, the current draft creates three specific liabilities that must be resolved before we vote in October.

  **1. The "Findings of Fact" Requirement (Legal Compliance)**
  *The Issue:* Our bylaws require every resolution to carry a written statement of findings. Our attorney has correctly noted that stapling a price chart to a resolution does not satisfy this. A price is data, not a finding. If we cannot articulate *why* the price justifies the decision, the resolution is vulnerable to legal challenge.
  *The Condition:* The resolution text must explicitly state that the Board *finds* the market price constitutes probative evidence regarding the likely outcome of the Welfare Index. The "Findings" section will read: *"The Board finds that the settlement price of the Implement Contract represents the aggregated best-estimate of the Cordon Welfare Index outcome, based on available information as of [Date]."* This treats the market as an expert witness rather than the judge.

  **2. The Welfare Index and Equity Policy (Values vs. Facts)**
  *The Issue:* The consultant's draft index measures aggregate vehicle-hours and revenue. It ignores the 9,000 lower-income residents driving into the cordon. Our Equity Policy requires their impacts be weighted explicitly. Allowing the market to optimize a flawed index is not "deciding what will work"; it is deciding we do not value equity. That is a policy choice for this Board, not a prediction for traders.
  *The Condition:* The Board must vote to ratify the **Cordon Welfare Index Formula** before the market opens. This formula must include the equity weighting mandated by our policy. Traders then bet on *that* index. This separates values (Board's job) from facts (Market's job).

  **3. Market Integrity and Commitment (The "Thin Market" Problem)**
  *The Issue:* If we reserve full discretion to ignore the market, traders will bet on our politics, not the cordon's effects, rendering the price meaningless. However, if we bind ourselves completely, we hand a decision affecting 250,000 daily trips to a market with potentially few participants. Specifically, the Downtown Business Association and the Hospital System have clear incentives to trade to influence the outcome rather than forecast it. Furthermore, since only one branch realizes, we lose the counterfactual data needed to validate the market's accuracy.
  *The Condition:*
  *   **Position Limits:** No single entity may hold more than 5% of the open interest on either contract.
  *   **Disclosure:** Any trader holding >2% must disclose their identity to the Board Clerk (confidentially) to monitor for conflicts.
  *   **Supermajority Override:** To balance commitment with fiduciary duty, the Board commits to following the market signal unless a **two-thirds vote (6 members)** determines the market price is demonstrably disconnected from reality due to manipulation or external shock. This raises the bar for ignoring the market without illegally fettering future Board discretion.

  ### **Reusable Criteria for Market-Based Decisions**

  If we proceed, we should establish the following criteria for any future proposal to outsource a decision to a market. This ensures we do not repeat this negotiation from scratch.

  1.  **Binary Verifiability:** The decision outcome must be objectively measurable within a defined timeframe (e.g., "Ridership > X on Date Y"). Subjective metrics are ineligible.
  2.  **Values Pre-Approval:** The metric being optimized (the Index) must be approved by the Board *before* trading begins. The Board sets the goal; the market forecasts the path.
  3.  **Liquidity & Integrity:** The market must have minimum liquidity thresholds and position limits to prevent single-actor manipulation.
  4.  **Legal Admissibility:** The market output must be admissible as evidence within the Board's existing legal framework for findings of fact.

  ### **Next Steps**

  To meet the October federal grant deadline, we must move quickly. I propose we schedule a special working session next week to:

  1.  Vote on the **Equity-Weighted Welfare Index Formula**.
  2.  Review the **Market Rules** (position limits/disclosure) with legal counsel.
  3.  Draft the **Resolution Findings** language to ensure the price is treated as evidence.

  If we cannot finalize the Index and Market Rules by September 25, we should reject the pilot and proceed with a traditional staff recommendation to ensure we do not lose the federal funding. Innovation is valuable, but not at the cost of compliance or equity.

  I look forward to discussing this on the agenda.
