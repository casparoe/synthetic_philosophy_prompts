prompt: |-
  I'm a convinced expressivist of the plan-based variety and I think I've got a line on the Frege-Geach problem. Roughly: a moral sentence expresses the same kind of planning state whether it's asserted or embedded, and the logical relations between those states are fixed by whether holding them together would be incoherent as planning — not by truth conditions. So "murder is wrong" is being for blaming for murdering, "murder isn't wrong" is being for not blaming for murdering, and an occurrence embedded under "either...or" expresses being for a plan that settles the question one way or the other. Validity comes out as: you can't coherently accept the premises and deny the conclusion, where "can't" is a planning-level constraint rather than a truth-preservation fact.

  What would count against this? I want a map of what the view actually risks, not a general assault on expressivism. Specifically: which cases or bits of linguistic data would be genuinely damaging — I'm thinking negation, whether moral connectives really behave like Boolean ones, moral modus ponens, and whether someone can grasp "wrong" without having the relevant attitude — and which are merely awkward. Where does my view stick its neck out in a way a truth-conditional rival doesn't, such that the rival could turn out right and I wrong? For what its worth, the thing that would move me most is a case where my account of the connectives predicts different inferential behaviour from the classical one and comes out on the losing end.

  And please be blunt about the collapse worry: once I hand over a systematic rule assigning planning states to complex sentences, haven't I just written a compositional semantics with unusual values and called it non-representational? Is there a principled line there, or has the view been qualified until it can't fail? Sort the defeaters from fatal to cosmetic, and say which ones a committed defender of this view would already concede as counting against them rather than waving off.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User Persona:** A convinced expressivist of the "plan-based" variety (likely influenced by Allan Gibbard's *Wise Choices, Apt Feelings* or *Thinking How to Live*). They believe they have a solution to the Frege-Geach problem.
      *   **Core View:** Moral sentences express planning states (norm-acceptance) in both asserted and embedded contexts. Logical relations are fixed by planning coherence (inconsistency of plans), not truth conditions. Validity is about the incoherence of accepting premises and denying the conclusion.
      *   **The Ask:** A "map" of risks. What counts *against* this view? Specifically, linguistic data or cases that would be genuinely damaging vs. merely awkward. Where does the view stick its neck out more than truth-conditional realism?
      *   **Specific Concerns:** Negation, Boolean behavior of connectives, moral modus ponens, grasping "wrong" without the attitude, and the "collapse worry" (is this just semantics in disguise?).
      *   **Tone:** Blunt, philosophical, technical but accessible to someone familiar with the metaethics literature. Sort defeaters from fatal to cosmetic.

  2.  **Deconstruct the View (Plan-Based Expressivism):**
      *   *Core Claim:* $S$ expresses plan-state $P$.
      *   *Embedding:* $S$ in complex sentences expresses complex plan-states.
      *   *Logic:* Validity = Incoherence of holding premises' plan-states + negation of conclusion's plan-state.
      *   *Key Proponent:* Allan Gibbard is the main target here, though the user might have their own spin.

  3.  **Brainstorming Objections (The "Map of Risks"):**

      *   *The Frege-Geach Problem (Logic):* The user claims to solve this via planning coherence.
          *   *Risk:* Does the logic match classical logic exactly? If not, that's a problem.
          *   *Specific Case:* Modus Ponens. If $A \to B$ and $A$, then $B$. In expressivism, $A \to B$ is often analyzed as "accepting a norm that if you accept $A$, accept $B$." Does this guarantee validity in the same way truth-conditions do?
          *   *The "Negation" Problem:* "Murder is not wrong." Is this *rejecting* the plan to blame, or *planning not to blame*? Gibbard distinguishes these. If the analysis gets negation wrong, the logic breaks (e.g., Double Negation, Excluded Middle).
          *   *The "Embedding" Problem:* Conditionals. "If murder is wrong, then stealing is wrong." What plan state is this? Being for a plan that links the two? Is that state distinct enough to preserve validity?

      *   *The Collapse Worry (Semantics vs. Pragmatics):*
          *   *Risk:* If you assign semantic values (plan states) compositionally, isn't that just possible worlds semantics with "plan worlds"?
          *   *Distinction:* Truth-conditional semantics says meaning *is* truth conditions. Expressivism says meaning is use/attitude, but to solve F-G, it mimics semantics.
          *   *Fatal?* Not necessarily fatal to expressivism, but fatal to the claim that it's *radically* different from realism. It risks becoming "quasi-realism" that looks indistinguishable from realism.

      *   *Cognitive Access/Understanding:*
          *   *Risk:* Can I understand "Murder is wrong" without having the plan? A realist says yes (belief). An expressivist usually says no (internalism).
          *   *Data:* Amoralists, sociopaths, or just tired moralists. If they understand the sentence but lack the plan, expressivism struggles.
          *   *Severity:* High. This attacks the core definition of meaning.

      *   *Logical Divergence:*
          *   *Risk:* The user asked for cases where the view predicts *different* inferential behavior and loses.
          *   *Example:* The "Deep Embedding" problem. Iterated conditionals or quantifiers. "For all x, if x is wrong, then..."
          *   *Example:* Logical truths. "Either murder is wrong or murder is not wrong." A realist says this is true in all worlds. An expressivist says it's incoherent to lack a plan either way. But what if I'm undecided? Is undecidedness incoherent? If yes, the view is too demanding. If no, LEM fails.

      *   *The "Euthyphro" of Logic:*
          *   Is it valid *because* it's incoherent to plan otherwise? Or is it incoherent *because* it's invalid? Realists have an easier time here (logic is mind-independent). Expressivists make logic dependent on the nature of planning. If human planning psychology changes, does logic change?

  4.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the sophistication of the position (Gibbardian). Set the stage for a blunt assessment.
      *   **Category 1: The Logical Match (Fatal Risks):** Focus on where the logic might diverge from classical logic. Negation and Conditionals are the weak points.
      *   **Category 2: The Collapse Worry (Structural Risks):** Address the "is this just semantics?" question directly.
      *   **Category 3: Psychological/Conceptual Data (Empirical Risks):** Amoralists, understanding without attitude.
      *   **Category 4: Cosmetic/Manageable Risks:** Things that are annoying but solvable (e.g., specific phrasing of plan states).
      *   **Conclusion:** Summary of the "Stick out neck" moments.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Negation:* This is the big one. Gibbard's distinction between *disagreeing* with a plan and *planning not* to do something. If "Murder is not wrong" = "I plan not to blame," then "Murder is wrong" = "I plan to blame." Are these contradictories? What if I have no plan? Realism handles this with Truth/Falsehood easily. Expressivism needs to ensure the "plan space" is exhaustive. *Verdict: High Risk.*
      *   *Conditionals:* "If lying is wrong, then getting your little brother to lie is wrong." What is the plan state? Being for a plan that... what? If the analysis of the conditional doesn't yield *exactly* Modus Ponens, the view fails. *Verdict: High Risk.*
      *   *Collapse:* If you define a function from sentences to plan-states that respects compositionality, you have a semantics. The difference is metaphysical (what the values *are*), not structural. If the structure is identical, the "expressivist" label might be merely verbal. *Verdict: Philosophical Cost, not necessarily Fatal, but undermines the motivation.*
      *   *Amoralism:* If someone says "I understand 'wrong' but I don't care," the plan-based view says they don't understand. This is counter-intuitive to many. *Verdict: Moderate/High Risk depending on internalism commitment.*
      *   *Logical omniscience/Coherence:* If validity is about *incoherence*, does it require the agent to *realize* the incoherence? Realism separates validity from recognition. Expressivism risks psychologizing logic too much. *Verdict: Moderate Risk.*

  6.  **Refining the "Collapse" Argument:**
      *   Need to be careful. Gibbard admits he's doing semantics. The claim is that the *ontology* is different (plans vs. propositions). The risk is that "plans" end up behaving so much like "propositions" (they have consistency conditions, entailment relations, etc.) that the ontological saving is illusory. This is the "Property of Being Norm-Acceptable" worry.

  7.  **Final Review against User Constraints:**
      *   *Blunt?* Yes.
      *   *Sort defeaters?* Yes (Fatal, Structural, Cosmetic).
      *   *Focus on linguistic data?* Yes (Negation, Conditionals, LEM).
      *   *Address the "Stick out neck" aspect?* Yes, specifically where logic might diverge.

  8.  **Final Polish:** Ensure the distinction between *inconsistency of attitudes* and *inconsistency of content* is clear. Ensure the Gibbard references are implicit but accurate (normative logic). (Self-Correction: Make sure not to conflate Simple Expressivism with Plan-Based. The user specifies Plan-Based, so focus on Gibbard-style coherence.)

  **(Self-Correction during drafting):** I need to make sure I don't just repeat the standard Frege-Geach objection, since the user claims to have solved it. I need to attack the *solution* itself. The solution relies on an isomorphism between planning coherence and logical validity. The attack must show where that isomorphism breaks or costs too much.

  *Key Insight:* The "Negation" problem is the strongest logical wedge. In truth-conditional semantics, $\neg P$ is true iff $P$ is false. In plan-expressivism, what is the plan state of $\neg P$? If it's "not having plan P," that's not a positive state. If it's "having plan Not-P," are P and Not-P exhaustive? What if I'm agnostic? Realism handles agnosticism easily (truth value gap or just unknown). Expressivism might force a plan where none exists to preserve LEM.

