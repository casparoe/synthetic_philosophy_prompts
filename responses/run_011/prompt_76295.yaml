      *   Table 4: "I have mostly Black."
      *   Table 1 thinks: "I am holding Red cards in my hand. I can see them. You say Black. You must be lying or blind."
      *   This generates the *affective* state of distrust.
      *   To make connectivity *worse*: If Table 1 tries to compromise ("Maybe it's mixed"), they lose points on the Local Accuracy score.
