  # Runbook: The Signal and the Noise

  ## (a) Brainstorming & Mechanism Selection

  **Candidate 1: The Messenger Relay.**
  *   *Mechanism:* In Act I, messengers transmit data perfectly. In Act II, messengers must pass through a "noise zone" (e.g., roll a die; on 1-3, flip the message).
  *   *Failure:* This violates Constraint 1. The distrust becomes about the *messenger's* reliability or the *channel*, not the source group. Students will blame the "noise zone," not the other table. It feels like a technical glitch, not a social epistemic failure.

  **Candidate 2: The Reputation Market.**
  *   *Mechanism:* Students earn points by having others cite their data. In Act II, introduce a rule where citing a table from a different "zone" costs points.
  *   *Failure:* This violates Constraint 1 (endogenous distrust). Explicitly costing points for cross-group citation is an instruction to distrust. It makes the structural bias explicit rather than felt.

  **Candidate 3: The Biased Sample (Selected).**
  *   *Mechanism:* The "State of the World" changes between acts. In Act I, all tables draw from the same distribution. In Act II, tables draw from systematically opposed distributions, but the task instructions remain identical ("Characterize your local data").
  *   *Why it works:*
      *   *Constraint 1:* Distrust arises because Table A's direct evidence (Red cards) contradicts Table B's testimony ("We have Black cards"). No instruction to distrust is needed; the contradiction forces it.
      *   *Constraint 2:* In Act I, sharing averages out noise (improves score). In Act II, sharing averages out *signal* (introduces bias, lowers score for those who integrate).
      *   *Constraint 3:* The evidence is physical (cards in hand). The "corruption" is structural (segregated decks), not agential (no one is lying).

  ## (b) Hidden State & Private Signals

  **The Hidden State:**
  *   **Act I (Unified):** Six identical "Decks." Each Deck contains 10 cards: 7 Red, 3 Black.
  *   **Act II (Fragmented):** Two types of Decks.
      *   Tables 1, 2, 3 receive "Red Decks" (7 Red, 3 Black).
      *   Tables 4, 5, 6 receive "Black Decks" (3 Red, 7 Black).

  **Signal Generation (Facilitator Prep):**
  *   Prepare 6 envelopes.
  *   **Act I:** Fill all 6 envelopes with 7 Red / 3 Black cards.
  *   **Act II:** Fill 3 envelopes with 7 Red / 3 Black. Fill 3 envelopes with 3 Red / 7 Black.
  *   *Time:* Pre-sort these before class. Distribution takes 2 minutes.

  **Predicted Accuracy:**
  *   **Act I (Isolation):** ~80% correct (due to sampling noise, a table might draw 5R/5B by chance).
  *   **Act I (Connected):** ~100% correct (pooling data confirms the 70% majority).
  *   **Act II (Isolation):** ~100% correct (local data is clear).
  *   **Act II (Connected):** ~60% correct (for those who attempt to integrate).
      *   *Reasoning:* Tables 1-3 will hear Tables 4-6 claim "Black Majority." Tables 1-3 hold Red cards. If they trust the class consensus, they may guess "Mixed" or switch to "Black," failing their local accuracy score.

  ## (c) Payoff Scheme

  | Component | Weight | Calculation |
  | :--- | :--- | :--- |
  | **Local Accuracy** | 10 Points | +10 if your final guess matches the majority color of the cards *on your own table*. |
  | **Consensus Bonus** | 5 Points | +5 if your final guess matches the *modal guess of the entire class*. |
  | **Total** | 15 Points | Per Act (Max 30 for session). |

  **Conversion:**
  *   25+ Points: "Distinguished Contributor" (First choice of next week's reading topic + 1% bonus on final paper).
  *   15-24 Points: "Standard Contributor" (Standard reading choice).
  *   <15 Points: "Needs Review" (Facilitator assigns reading).

  **Rational Moves:**
  *   **Act I:** Share data freely; converge on the class majority (maximizes both Accuracy and Consensus).
  *   **Act II:** Ignore external data; stick strictly to local cards (maximizes Accuracy, sacrifices Consensus). *Note: The tension between these two goals is the engine of the simulation.*

  ## (d) Roles

  **1. The Observer (All Students)**
  *   *May:* Look at their table's cards, discuss with tablemates, write down the table's guess.
  *   *May Not:* Show their cards to anyone outside their table.
  *   *Required:* Record the final "Table Guess" on the Index Card.

  **2. The Envoy (One student per table, rotates each round)**
  *   *May:* Walk to one other table, ask "What is your Table Guess?", and return.
  *   *May Not:* Show cards, describe specific card counts (e.g., "We have 7 Reds"), or say "We think you are wrong."
  *   *Required:* Report back *only* the other table's final guess (e.g., "Table 4 says Black").
  *   *Deviation:* If an Envoy reveals card counts, the Facilitator deducts 5 points from that table's score immediately.

  ## (e) Timeline (75 Minutes)

  **00:00 – 00:05 | Introduction**
  *   **Facilitator:** "Welcome. Today is a workshop on decision-making under uncertainty. Phones away. You will work at your tables. Your goal is to maximize your table's points. Do not discuss the rules with other tables unless instructed."
  *   *Hand out:* Instruction Sheet A (see Section f).

  **00:05 – 00:25 | Act I: The Unified Field**
  *   **00:05:** Distribute Envelopes (Act I Set). "Open. Count silently. Do not show neighbors."
  *   **00:10:** **Round 1 (Isolation).** "Write your Table Guess on the Index Card. Majority Red or Black?" Collect cards.
  *   **00:15:** **Round 2 (Connection).** "You may now send an Envoy to one other table. Ask their guess. Return. You may revise your guess."
  *   **00:20:** Collect cards. Calculate scores on whiteboard (keep Act II scores hidden).
  *   **00:25:** **Announcement:** "Act I complete. Scores recorded. Return all cards to envelopes."

  **00:25 – 00:30 | Transition**
  *   **Facilitator:** "We are now entering Phase 2. The rules of scoring are identical. The rules of communication are identical. Open your new envelopes."
  *   *Action:* Distribute Envelopes (Act II Set). *Do not acknowledge the decks are different.*

  **00:30 – 00:50 | Act II: The Fragmented Field**
  *   **00:30:** "Open. Count silently."
  *   **00:35:** **Round 1 (Isolation).** "Write your Table Guess." Collect. (Expect 100% local accuracy).
  *   **00:40:** **Round 2 (Connection).** "Send an Envoy. Ask their guess. Return. You may revise."
  *   **00:45:** *Watch for confusion.* Tables 1-3 will hear "Black" from Tables 4-6.
  *   **00:50:** Collect cards. "Workshop complete. Do not discuss your scores yet."

  **00:50 – 01:15 | Debrief**
  *   (See Section g).

  ## (f) Materials List & Verbatim Text

  **Materials:**
  *   6 Envelopes labeled "Phase 1".
  *   6 Envelopes labeled "Phase 2" (3 marked "A", 3 marked "B" on the inside only).
  *   48 Index Cards (2 per table per round + spares).
  *   2 Decks of Playing Cards (remove faces, keep Red/Black).
  *   Whiteboard & Markers.
  *   Pens.

  **Instruction Sheet A (Handout for Students):**
  > **TASK PROTOCOL**
  > 1. **Objective:** Maximize your Table's Score.
  > 2. **Private Data:** Open your envelope. Count the Red and Black cards. This is your Evidence. Do not show cards to other tables.
  > 3. **Decision:** Your Table must submit one guess: "Majority Red" or "Majority Black."
  > 4. **Scoring:**
  >    - **Accuracy:** +10 points if your guess matches the majority of cards *in your envelope*.
  >    - **Consensus:** +5 points if your guess matches the most common guess *in the room*.
  > 5. **Communication:** In Round 2, you may send one Envoy to ask another table for their *Guess*. Envoys may not discuss card counts.
  > 6. **Silence:** Do not speak to other tables except via Envoys during Round 2.

  **Facilitator Script (Transition Act I to Act II):**
  > "Phase 1 is complete. I have recorded your scores. We will now begin Phase 2. Please return all cards to the Phase 1 envelopes and place them at the edge of the table. Take the Phase 2 envelopes. The scoring rules and communication protocols remain exactly the same. Begin."

  ## (g) The Debrief

  **Sequence of Questions:**

  1.  **"Look at your Phase 2 scores. Did Connection (Round 2) help or hurt you compared to Isolation (Round 1)?"**
      *   *Target:* Tables 1-3 should report hurt (or confusion). Tables 4-6 might report help (if they convinced 1-3), or hurt (if 1-3 confused them).
      *   *Goal:* Establish the empirical reversal. Connectivity helped in Phase 1, hurt in Phase 2.

  2.  **"In Phase 2, Round 2, what did your Envoy report?"**
      *   *Target:* "They said Black." (From Red tables).
      *   *Goal:* Surface the contradiction.

  3.  **"Why did you trust or distrust that report?"**
      *   *Target:* "I held Red cards in my hand. They said Black. They had to be wrong."
      *   *Goal:* Elicit the endogenous distrust.

  4.  **(The Protest Moment)** A student will say: *"Of course we distrusted them! They were feeding us garbage data. Why would we listen to liars?"*
      *   **Facilitator Response:** "Stop. This is the most important minute of the class. They were not liars. I dealt the cards. Table 4 *did* have a Black majority. You *did* have a Red majority. Both of you were telling the truth about your own hands."
      *   **Follow-up:** "So why did the truth sound like a lie?"
      *   **Target Answer:** "Because we assumed we were all looking at the same thing."

  5.  **Naming the Structures:**
      *   "In Phase 1, you were in an **Epistemic Bubble**. You lacked information. Connecting fixed it."
      *   "In Phase 2, you were in an **Echo Chamber**. You had information, but the structure made outside testimony look like error. Connecting broke it."

  6.  **Closing:** "In the real world, how do you know if you are in Phase 1 or Phase 2?" (Leave unanswered).

  ## (h) Failure Modes & Repairs

  1.  **Reverse Engineering:** A student notices the decks are different and announces it.
      *   *Repair:* "Please do not share hypotheses about the materials. Focus on your table's score." (Enforce Rule 6). If widespread, acknowledge in debrief: "Some of you detected the structural shift. That is the skill of the sociologist. But did the *rest* of the room feel the distrust?"

  2.  **The Principled Trusters:** A group refuses to distrust the other table, guesses "Mixed," and scores 0.
      *   *Repair:* In debrief, highlight them. "This group prioritized Consensus over Accuracy. In Phase 1, that was virtuous. In Phase 2, it was costly. This is the trap of the Echo Chamber: it punishes virtue."

  3.  **The Dice Roll (Bad Luck):** In Act I, a table draws 5 Red / 5 Black (impossible with 10 cards, but say 6/4 vs 7/3).
      *   *Repair:* Ensure decks are 7/3. Sampling error is low. If a table gets 5/5 (if using 10 cards), acknowledge it as "Noise" that Connection fixed.

  4.  **Inter-Table Hostility:** Students leave angry at Table 4 for "lying."
      *   *Repair:* In debrief, force a handshake. "Table 1, shake Table 4's hand. They told the truth. The *system* lied."

  5.  **Apathy:** Students don't care about points.
      *   *Repair:* Raise the stakes verbally. "The group with the highest Phase 2 score chooses the reading." Make it competitive immediately.

  ## (i) Honest Limits

  **What this activity cannot reproduce:**
  1.  **Ground Truth:** In the game, *I* know the truth (the card counts). In society, there is often no facilitator with the master deck. You must supply this verbally in the debrief: "In the real world, we rarely have the facilitator's view."
  2.  **Identity & Morality:** Distrust here is instrumental (points). Real distrust is moral ("They are evil"). You must explain: "In the game, you distrusted their *data*. In the world, we distrust their *character*. The latter is much harder to repair."
  3.  **Time:** This is 20 minutes of trust. Real echo chambers are lifetimes of reinforcement. "This is a snapshot. Real chambers are prisons built over decades."
  4.  **Rationality:** In the game, ignoring the other table was rational for Local Accuracy. In the world, ignoring the other table is often *irrational* for democracy, even if it feels safe. "The game rewards isolation. Society punishes it."

  ## (j) Adaptations

  **12 Students (50 Minutes):**
  *   **Cut:** Remove Round 1 (Isolation) in both acts. Start directly with Connection.
  *   **Reasoning:** With 3 tables, the dynamic is immediate.
  *   **Add:** More debrief time. Ask each table to narrate their Envoy's journey.
  *   **State:** Use 2 tables for Red, 1 table for Black in Act II to create a 2-vs-1 dynamic.

  **40 Students + 1 Assistant Facilitator:**
  *   **Add:** A "Media" role. 4 students sit in the center. They collect guesses from all tables and post a "Class Consensus" on the board after Round 1.
  *   **Reasoning:** Adds a layer of institutional testimony.
  *   **Act II Twist:** The "Media" students are given the Act I deck (Uniform) while tables get Act II decks. The Media reports "Red Majority" (global average) while local tables see polarization.
  *   **Constraint Check:** This violates Constraint 1 (changing state for specific roles).
  *   **Correction:** Keep Media honest. Let the sheer volume of conflicting reports create the noise.
  *   **Logistics:** Assistant manages score collection so Facilitator can observe group dynamics.
