      *   *Why does connectivity make it worse?* Because in Act II, the "Communication Phase" allows them to hear conflicting reports. If they weight those reports highly, they adjust their guess away from their local truth.
      *   *To ensure they actually feel the distrust:* They need to publicly commit.
      *   *Mechanism:* "The Board." Tables write their estimate on the whiteboard.
