      *   *Act II:* Cards come from different sources. Sharing creates conflict.
      *   *Why does sharing hurt?* Because if Table 1 (Red) listens to Table 4 (Black), Table 1 might second-guess their own Red cards and guess "Mixed," which is wrong for their specific hand.
      *   *This works.* It creates the *feeling* that Table 4 is hallucinating.

  4.  **Developing the Payoff (Constraint 2 & 3):**
      *   Need a scoring system where "Listening to the other side" lowers your score in Act II.
      *   Score = Accuracy of guess about *own* hand.
      *   Act I: Own hand is representative of whole. Listening confirms.
      *   Act II: Own hand is biased. Listening introduces noise/bias against own hand.
      *   Incentive: "You get points for correctly characterizing your hand. You get bonus points if your characterization matches the 'Consensus'."
      *   *Wait, Consensus bonus creates pressure to conform.*
