answer: |-
  Here is the plan. I'm taking a hard line on the pedagogy here: this section fails if it becomes a debate about visual physiology. It succeeds only if it becomes a debate about the *authority of the subject*.

  ### 1. The Label Check
  You have them the right way round.
  *   **Stalinesque:** The show trial is staged *before* the public sees it. (Editing happens before consciousness).
  *   **Orwellian:** The event happens, but the history books are rewritten *after*. (Editing happens after consciousness, in memory).
  Keep this confidence. If you wobble on the definitions, the students will smell blood and treat the whole philosophical puzzle as a terminology mix-up.

  ### 2. Dependency Order
  Your guess is close, but you're missing the foundational layer. You cannot get to "misremembered vs. not how it was" until you establish **the authority of the report**.
  1.  **Veridicality of Report:** Establish that we must take the subject's word for what it felt like. If you allow "they're just confused" early, the puzzle dissolves.
  2.  **Physics of Stimulus:** Establish the objective timeline (Red light, then Green light, spatially separated).
  3.  **The Mismatch:** Show that the Report (continuous motion with color change mid-path) is physically impossible given the Stimulus.
  4.  **The Timing Gap:** Now you can introduce the delay. To match Report to Stimulus, the brain must wait for the second light to process the first.
  5.  **The Two Explanations:** Now Stalinesque vs. Orwellian becomes relevant.
  6.  **The Collapse:** Finally, show why distinguishing them is impossible from the inside.

  *Why this order:* If you start with the political analogy or the memory distinction, students treat it as a sociology or psychology problem. You need them locked into the *logical contradiction* between Objective Time and Subjective Time first.

  ### 3. The One Case: The Dual Timeline
  Do not draw a strip of frames. The animation majors will critiquing your drawing skills or argue about persistence of vision.
  **Draw two horizontal timelines on the whiteboard.**

  *   **Top Line (World Time):** Mark $T_1$ (Red Flash), $T_2$ (Green Flash). Note the physical gap.
  *   **Bottom Line (Subject Time):** Mark $T_1$ (Red seen), $T_{1.5}$ (Color changes mid-motion), $T_2$ (Green seen).

  **Why this beats alternatives:**
  *   It abstracts away the "movie" quality that invites the "it's just animation" objection.
  *   It forces the students to look at the *relation between timestamps*, which is where the philosophy lives.
  *   It maps perfectly onto the political analogy: The Top Line is the "Historical Record," the Bottom Line is the "Public Broadcast."

  **The Political Analogy:**
  Use it as the **Hook (Minute 0-5)**. Do not save it for the payoff.
  *   Say: "Stalin edited the photos before printing the newspaper. Orwell edited the newspaper after the event happened, then burned the original photos."
  *   Write "Stalinesque" and "Orwellian" next to the two hypotheses immediately.
  *   **Why:** You need the mnemonic stickiness early. When the discussion gets bogged down in neural latency at minute 25, you can point to the board and say, "Is this a pre-print edit or a post-history rewrite?" and bring them back.

  ### 4. Misconceptions & Interception Points
  Here is where they will try to derail you, and exactly when you shut it down.

  **1. "It's just frame rate / persistence of vision." (The Animation Majors)**
  *   **When:** Minute 5, as soon as you describe the motion.
  *   **Interception:** "You are explaining *Beta Movement* (the motion). I am asking about the *Color Change*. The subject sees red move, then turn green *before* the green light turns on. Frame rate explains the motion, not the precognitive color shift. Put the pen down."

  **2. "Predictive Processing already solves this." (The PP Fans)**
  *   **When:** Minute 15, when you introduce the timing gap.
  *   **Interception:** "PP explains *why* the brain generates the smooth motion hypothesis. It does not tell us *when* that hypothesis becomes conscious. Does the prediction happen before awareness (Stalin) or does the awareness happen and get updated by the prediction (Orwell)? PP is the mechanism, Phi is the paradox of timing. Don't confuse the engine with the timestamp."

  **3. "We can just measure the brain to see which it is." (The Neuro-Reductionists)**
  *   **When:** Minute 30, during the comparison of hypotheses.
  *   **Interception:** "Even if you find the neural correlate, you have to decide which neuron firing counts as 'conscious experience.' That decision presupposes the Cartesian Theater we are trying to question. You can't measure your way out of a conceptual problem."

  **4. "The labels bias us against Stalin." (The Critical Theorists)**
  *   **When:** Minute 20, when defining the terms.
  *   **Interception:** "Agreed. They are loaded terms. That's why Dennett used them. They are meant to be provocative. Strip the morality; keep the timing. Pre-conscious edit vs. Post-conscious edit."

  **5. "So consciousness is an illusion." (The Nihilists)**
  *   **When:** Minute 40, near the end.
  *   **Interception:** "No. Experience is real. The *authority* of the experience to tell us how the brain works is what's illusory. You really see the color change. You are wrong about *when* you saw it. That's different than not seeing it at all."

  ### 5. The Closing Question
  Do not ask "Which theory is right?" (The answer is neither/both).
  Do not ask "What does this mean for AI?" (Too vague).

  **Ask this:**
  > "If there is no experiment that can distinguish between a rewritten memory and a genuine experience, is there a fact of the matter about which one happened?"

  *   **Why:** This separates the students who think there *must* be a truth (realists) from those who grasp the Multiple Drafts view (the distinction is useful only from the outside, not the inside). If they say "Yes, the brain did one or the other," they missed the point. If they say "The question assumes a 'moment of consciousness' that doesn't exist," they got it.

  ### 6. What to Refuse & The Deflection Sentence
  **Refuse:** Any discussion of specific neural latencies (e.g., "V1 takes 40ms, V4 takes 80ms").
  **Why:** This turns a 45-minute philosophy section into a 45-minute neurobiology lecture where you will lose the animation majors and bore the philosophers. The paradox holds regardless of the millisecond count.

  **The Sentence:**
  > "We are not doing neurology today; we are doing logic. Even if you knew the exact millisecond of every spike, you would still have to interpret when the 'seeing' happened, and that is where the paradox lives."

  ### 7. The Standard Oversell (Lateral Inhibition)
  You asked about the "boring lateral inhibition" objection.
  **Give it 30 seconds. No more.**
  Some instructors spend half the class debunking Phi as "just low-level visual processing." That is a category error. Low-level processing explains the *content* of the illusion, not the *temporal anomaly* of the report.
  **Your stance:** "Lateral inhibition explains why you see motion. It does not explain how you see a color change caused by a light that hasn't turned on yet. Don't let the mechanism distract you from the timing paradox."

  ### Summary of Flow (45 Mins)
  *   **0-5:** Hook (Stalin/Orwell) + Draw Dual Timelines.
  *   **5-10:** Lock down the Phenomenology (Shut down Animation majors).
  *   **10-20:** The Timing Gap (Shut down PP fans).
  *   **20-30:** Stalin vs. Orwell (Shut down Neuro-reductionists).
  *   **30-40:** The Indistinguishability Argument (The "Fact of the Matter").
  *   **40-45:** Closing Question & Dismissal.

  Stick to the timelines. Keep the authority of the report sacred until the very end. Don't let them solve it with biology.
