      *   *Correction:* It's low because it requires a "resident pool." Defining "resident" is the boundary problem. So it presupposes the boundary just like the others, but with less normative justification. Keep it low.
      *   *Critique:* Is "Self-Constitution" really high on implementability?
      *   *Correction:* Yes, because existing states *already do this*. It's the status quo.
      *   *Critique:* Probabilities. If the advisor is right, the probability of any being "correct" is zero. But the prompt asks me to bet on one. I will frame the probabilities as "most defensible normative workaround" rather than "logical solution." I will explicitly note the advisor's point in the betting section.

  9.  **Final Review against constraints:**
      *   Rank 6 in tiers (theory)? Yes.
