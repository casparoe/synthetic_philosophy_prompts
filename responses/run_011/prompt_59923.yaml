prompt: |-
  So I'm in a philosophy of perception seminar this term and our prof did this thing where he split us into two camps and told us to actually produce something together instead of just yelling at each other in section. I got sorted with the disjunctivists — the McDowell/Martin line, where in the good case the fact you're perceiving is itself part of what makes your experience the experience it is, so there's no highest common factor shared with the matching hallucination, and hallucination gets handled negatively (it's just a state you can't tell apart from a perception, and that's all there is to say about it). The other group are the common-kind people, which for our purposes lumps the sense-datum folks together with the representationalists, since both say a veridical perception and its introspectively perfect hallucination match are literally the same kind of mental state.

  Could you write the joint statement the two sides would end up signing if the adversarial collaboration went well? Here's the structure I want:

  1. A numbered list of claims both sides can sign without wincing. I mean stuff about how the argument from hallucination is actually set up, about what each side is willing to concede up front (the disjunctivist granting indiscriminability from the inside, the common-kinder granting that in the good case you're related to the fact itself rather than to a representation of it), and about what counts as needing an explanation at all.
  2. A disagreements table with columns for: the issue, the disjunctivist's statement of their own position in wording they'd happily put their name to, the common-kinder's statement of theirs, and a final column saying whether that row is a genuine disagreement or just a verbal one.
  3. The cruxes — the sub-questions where settling one would definately move at least one side. My guesses are whether you're licensed to go from "can't be told apart introspectively" to "same metaphysical kind," whether the negative treatment of hallucination is a real explanation or a promissory note, and whether the fact that hallucinations and perceptions seem to light up overlapping neural machinery cuts either way. But tell me if I've got the cruxes wrong or missed one.
  4. For each crux, a specific case or argument both sides would agree bears on it, plus each side's prediction about it, written down in advance so nobody can backpedal later.

  And if you think some chunk of this fight is really just about words, say which chunk and why — I've got a suspicion that "same phenomenal character" is doing something shady in both camps' arguments.

  Don't bother with citations or a reading list, we've already got all that from the syllabus. I just want the document itself.
