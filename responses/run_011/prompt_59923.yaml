answer: |-
  # Joint Statement on the Structure of Perceptual Experience
  **Prepared by:** Seminar Group A (Disjunctivists) & Seminar Group B (Common-Kind Theorists)
  **Date:** End of Term
  **Subject:** Adversarial Collaboration on the Argument from Hallucination

  ## 1. Points of Agreement
  *The following claims are endorsed by both camps. Signing this indicates a commitment to these premises as the starting point for further debate, not a surrender of core metaphysical commitments.*

  1.  **The Indiscriminability Premise:** Both sides agree that it is possible, in principle, for a subject to undergo a hallucination that is introspectively indistinguishable from a veridical perception. From the first-person perspective, the subject cannot tell the difference between the "good case" (perception) and the "bad case" (hallucination).
  2.  **The Veridical Anchor:** Both sides agree that in the veridical case, the subject is aware of a mind-independent object or fact. We reject the idea that even in the good case, the immediate object of awareness is an internal sense-datum or proxy. (The Common-Kind camp grants that in the good case, the relation is to the fact itself, even if they argue the *nature* of the mental state mediating that relation is shared with hallucination).
  3.  **The Explanatory Demand:** Both sides agree that hallucinations are not brute facts; they require causal and psychological explanation. The Disjunctivist camp agrees that the fact that a hallucination is indistinguishable from a perception requires explanation, even if that explanation does not posit a shared mental *kind*.
  4.  **Phenomenal Reality:** Both sides agree that there is "something it is like" to undergo these states. We are not eliminativists about phenomenal character.
  5.  **No Skeptical Surrender:** Both sides aim to preserve the intuition that perception generally puts us in contact with the world. We are not using the possibility of hallucination to drive a wedge between the mind and the world that results in global skepticism.

  ## 2. Map of Disagreements
  *Where we diverge. The "Status" column indicates whether we believe the disagreement is metaphysical (Genuine) or primarily terminological/conceptual (Verbal).*

  | Issue | Disjunctivist Position (McDowell/Martin Line) | Common-Kind Position (Sense-Data/Representationalism) | Status |
  | :--- | :--- | :--- | :--- |
  | **The Highest Common Factor (HCF)** | There is no HCF. The fundamental metaphysical nature of the veridical case is a relation to an external object. The hallucination lacks this nature entirely. | There is an HCF. The veridical case and the hallucination share a fundamental mental kind (e.g., same representational content or same phenomenal object). | Genuine |
  | **Analysis of Hallucination** | Hallucination is defined *negatively*: it is a state that is indiscriminable from a veridical perception. It has no positive nature in common with perception. | Hallucination is defined *positively*: it is a state with intrinsic properties (content/qualia) that exist independently of whether an external object is present. | Genuine |
  | **Source of Phenomenal Character** | In the good case, the phenomenal character is constituted by the actual properties of the external object. | The phenomenal character is determined by the internal state of the subject (the representation or sense-datum), which happens to be caused by the object in the good case. | Genuine |
  | **Supervenience Base** | Mental nature does not necessarily supervene on the internal physical state of the subject. The external object can be constitutive of the mental state. | Mental nature supervenes on the internal physical (neural/functional) state of the subject. If the brain is the same, the mental kind is the same. | Genuine |
  | **"Experience" Terminology** | We use "experience" to refer to the factive relation in the good case. | We use "experience" to refer to the internal state type, regardless of whether the good or bad case obtains. | **Verbal** |

  ## 3. The Cruxes
  *Sub-questions where resolving the issue would force a significant update or concession from at least one side.*

  1.  **The Indistinguishability Inference:** Does *introspective indistinguishability* entail *metaphysical identity of kind*?
      *   *Why it matters:* If yes, Disjunctivism is false. If no, the Common-Kind argument loses its primary lever.
  2.  **The Explanatory Power of Negativity:** Is defining hallucination as "indistinguishable from perception" a genuine explanation, or merely a promissory note (a refusal to explain)?
      *   *Why it matters:* If it's a refusal, Disjunctivism is methodologically deficient compared to Common-Kind theories which posit a shared causal mechanism.
  3.  **The Neural Supervenience Constraint:** Does the fact that veridical perceptions and matching hallucinations activate overlapping (or identical) neural machinery entail that they are the same mental kind?
      *   *Why it matters:* If neural identity forces mental identity, Disjunctivism requires a rejection of standard physicalist supervenience. If not, Common-Kind theory loses its empirical anchor.

  ## 4. Test Cases and Predictions
  *Specific scenarios bearing on the cruxes. Each side commits to a prediction in advance.*

  ### Crux 1: The Indistinguishability Inference
  *   **Case:** **The Perfect Twin Scenario.** A subject has a veridical perception of a red apple. At the exact same moment, a molecule-for-molecule duplicate in a vat has a hallucination of a red apple.
  *   **Disjunctivist Prediction:** The twins are in different mental states. One is in a state of *seeing*, the other in a state of *seeming to see*. The difference is real, even if neither twin can detect it.
  *   **Common-Kind Prediction:** The twins are in the same fundamental mental state. The difference is merely relational (one has a cause, the other doesn't), not mental.
  *   **Settling Condition:** If it can be shown that indistinguishability is purely epistemic (about knowledge) and not ontological (about being), Disjunctivism wins. If indistinguishability is shown to require a shared ontological ground, Common-Kind wins.

  ### Crux 2: The Explanatory Power of Negativity
  *   **Case:** **Charles Bonnet Syndrome.** Subjects with vision loss experience complex, structured visual hallucinations (e.g., patterns, faces).
  *   **Disjunctivist Prediction:** We can explain the *cause* (neural disinhibition) and the *report* (indistinguishable from seeing) without positing that the subject is acquainted with an internal object. The explanation stops at the causal mechanism + the negative epistemic definition.
  *   **Common-Kind Prediction:** The specific structure of the hallucination proves the existence of an internal generator of content/imagery that is the same kind of thing as perceptual content.
  *   **Settling Condition:** If the Disjunctivist can provide a causal story of the hallucination that does not secretly rely on "internal images" functioning as common kinds, their view holds. If the Disjunctivist story inevitably smuggles in a Common-Kind entity to explain the *structure* of the hallucination, Common-Kind wins.

  ### Crux 3: The Neural Supervenience Constraint
  *   **Case:** **Direct Cortical Stimulation.** Stimulating V4 produces a color experience identical to seeing that color.
  *   **Disjunctivist Prediction:** The neural activity is merely the *enablement* condition for experience, not the *constitutive* condition. In the good case, the experience is constituted by the object + neural enablement. In the bad case, it is constituted by neural enablement alone (which is a different kind).
  *   **Common-Kind Prediction:** Identical neural activation constitutes the same mental kind. The external object is just a causal add-on.
  *   **Settling Condition:** If we find a neural correlate that is *necessary and sufficient* for the phenomenal character regardless of external input, Common-Kind wins. If the neural correlate is shown to function differently depending on whether it is coupled with an external object (context-sensitive), Disjunctivism wins.

  ## 5. Note on Verbal Disputes
  *Addressing the suspicion that "same phenomenal character" is doing something shady.*

  We agree that a significant portion of the friction stems from the phrase **"Phenomenal Character."**

  *   **The Shadiness:** When Common-Kind theorists say the phenomenal character is the same, they often mean "the subject cannot tell the difference." When Disjunctivists say the phenomenal character is different, they mean "the metaphysical constitution of the experience is different."
  *   **The Resolution:** We acknowledge that if "Phenomenal Character" is defined strictly as *introspectively available features*, the Common-Kind theorist is right (they are the same). If "Phenomenal Character" is defined as *the metaphysical ground of what it is like*, the Disjunctivist is right (they are different).
  *   **Agreement:** Much of the "Genuine" disagreement in Row 3 of the Disagreements Table collapses into a verbal dispute if we do not specify whether we are talking about the *epistemic profile* of the state or the *ontological constitution* of the state. Going forward, we will distinguish between **Phenomenal Indistinguishability** (which we all accept) and **Phenomenal Identity** (which we dispute).

  ***

  **Signed,**

  *The Disjunctivist Camp* | *The Common-Kind Camp*
