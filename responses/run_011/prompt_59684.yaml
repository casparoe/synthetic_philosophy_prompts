  Here's a thinking process that leads to the suggested exam question, model answer, and marking scheme:

  1.  **Analyze the Request:**
      *   **Context:** TA for a Philosophy of Religion seminar.
      *   **Task:** Draft a final exam question, model answer, and marking scheme based on D.K. Lewis's "Do We Believe in Penal Substitution?" (1997).
      *   **Goal:** Avoid superficial answers (taxonomy of atonement, simple "it's unjust" objections). Force engagement with Lewis's core argument: the shift from individualistic moral liability to a corporate/relational unit to make substitution coherent.
      *   **Specific Focus:** Does Lewis's move rescue retributive logic or change the subject? Does it relativize or relocate the moral objection?
      *   **Constraints:** 45-minute answer time, closed book, no texts. Model answer ~600 words. Marking scheme out of 25.
      *   **Penalties:** Explicitly penalize the "punishing innocents is unjust, full stop" response and the misreading that Lewis is *endorsing* the doctrine rather than analyzing its believability.

  2.  **Deconstruct Lewis's Argument (Mental Sandbox):**
      *   *The Problem:* Penal substitution (PS) seems morally grotesque in ordinary cases (friend takes beating for offender).
      *   *Lewis's Move:* PS isn't incoherent if we reject strict individualism. If A and B are sufficiently united (corporate personality, mystical body), punishing B can count as punishing A.
      *   *The Catch:* This unity must be real, not just legal fiction. But if the unity is real, does the offender still suffer? If they suffer *in* the substitute, is it still substitution?
      *   *The Crux:* Lewis suggests believers accept PS because they accept the metaphysical union (Christ/Church). The moral objection isn't defeated by logic alone; it's displaced by a different ontology.
      *   *Key Distinction:* Lewis isn't necessarily saying PS is *true*, but explaining how one can *believe* it without contradicting ordinary moral intuitions (by changing the metaphysical premises).

  3.  **Drafting the Question:**
      *   *Need:* Clear, direct, forces the specific analysis requested.
      *   *Draft 1:* Explain Lewis's argument about penal substitution. Do you agree? (Too vague).
      *   *Draft 2:* Lewis argues that penal substitution works if we see people as a group. Does this solve the injustice problem? (Better).
      *   *Draft 3 (Refining for the prompt's requirements):* Focus on the "individualistic unit of moral liability" vs. "larger thing." Ask whether this rescues retributivism or changes the subject.
      *   *Final Polish:* "Lewis argues that the moral revulsion against penal substitution stems from an assumption of strict individual moral liability. Explain how invoking a 'corporate' or 'relational' ontology is meant to render substitution coherent. Does this move successfully preserve the retributive logic of punishment, or does it effectively change the subject? In your view, has Lewis relocated the moral objection or merely relativised it?"

  4.  **Drafting the Model Answer:**
      *   *Word Count:* Around 600 words.
      *   *Structure:*
          1.  Intro: State Lewis's core diagnostic move (individualism vs. corporate unity).
          2.  Explanation: How the "one flesh" or "kin group" metaphor works to transfer liability.
          3.  Critical Analysis (The "Crux"): Does this save retributivism? (Argument: It changes the subject because retributivism usually demands the *guilty* suffer, not the *guilty-plus*).
          4.  Moral Objection: Relocated vs. Relativised. (Argument: Relocated to the metaphysics of union).
          5.  Conclusion: Lewis explains *believability*, not necessarily *truth*.
      *   *Tone:* Academic, precise, avoiding the forbidden pitfalls.
      *   *Check:* Ensure I don't say Lewis *endorses* PS. He explains how it's *believable*.

  5.  **Drafting the Marking Scheme:**
      *   *Total:* 25 marks.
      *   *Categories:* Understanding of Lewis (10), Critical Analysis (10), Clarity/Structure (5).
      *   *Specific Penalties:* Must explicitly deduct for the "innocents unjust" cliché and the "Lewis endorses PS" error.
      *   *A-Grade Criteria:* Must identify the shift in ontology, distinguish between coherence and truth, and evaluate the "change of subject" claim.

  6.  **Review and Refine:**
      *   *Question:* Is it answerable in 45 mins? Yes, if they know the text.
      *   *Model Answer:* Is it ~600 words? (Need to count carefully). Does it hit the specific points the user asked for? Yes.
      *   *Marking Scheme:* Is it clear? Does it warn against the specific bad answers the TA mentioned? Yes.
      *   *Tone:* Professional, helpful to a TA.

      *(Self-Correction during drafting Model Answer)*: I need to make sure I don't wander into general atonement theology. Keep it focused on Lewis's philosophical move regarding *liability* and *identity*. Make sure to explicitly state Lewis is analyzing *belief conditions*, not proving doctrine.

      *(Self-Correction during Marking Scheme)*: Ensure the penalty for the "Lewis endorses" mistake is heavy, as that's a fundamental reading comprehension failure. Same for the "unjust full stop" answer, as the prompt specifically wants to avoid that.

  7.  **Final Polish:** Check against all constraints one last time. No citations requested in question. Closed book context. 25 points.

      *Let's write it.*
answer: |-
  ### Exam Question

  **Question 4:**
  In "Do We Believe in Penal Substitution?", D.K. Lewis argues that the moral revulsion typically directed at penal substitution arises from an assumption of strict individual moral liability. Explain how Lewis suggests that invoking a 'corporate' or 'relational' ontology is meant to render substitution coherent. Does this move successfully preserve the retributive logic of punishment, or does it effectively change the subject? In your view, has Lewis relocated the moral objection to a different metaphysical ground, or merely relativised it?

  *(Time suggested: 45 minutes)*

  ***

  ### Model Answer

  Lewis's central diagnostic claim is that penal substitution appears grotesque in ordinary contexts because we assume moral liability is strictly individualistic. In a secular legal framework, the offender and the volunteer are distinct moral atoms; transferring punishment from one to the other violates the retributive requirement that the guilty suffer. Lewis argues that religious believers do not hold this individualistic ontology. Instead, they operate with a metaphysics of corporate personality or mystical union, where the offender and the substitute constitute a single moral entity.

  To make substitution coherent, Lewis suggests we must view the relationship between Christ and humanity (or the offender and the volunteer) not as two strangers, but as parts of a larger whole, akin to a kin group or a single body. If A and B are sufficiently united, punishing B can logically count as punishing A, because B's suffering is experienced as A's suffering. This move attempts to satisfy the retributive demand—the "guilty party" suffers—by redefining the boundaries of the guilty party. The punishment is not transferred *away* from the guilty; it is absorbed *within* the guilty collective.

  However, this move likely changes the subject rather than rescuing standard retributive logic. Retributivism traditionally requires that the person who committed the wrong bears the burden. By expanding the moral agent to include the substitute, Lewis preserves the *formula* of retribution (the guilty suffer) but alters the *substance* of the agent. If the substitute is innocent in isolation but guilty by association, the concept of "innocence" itself is being redefined. Consequently, the retributive logic is preserved only verbally; materially, it shifts from personal desert to collective liability.

  Regarding the moral objection, Lewis does not simply relativise it (i.e., claim it is only wrong relative to individualistic cultures). Rather, he relocates it. The objection is no longer about the injustice of punishing an innocent *per se*, but about the metaphysical plausibility of the union required to make the innocent non-innocent. The moral weight shifts from the act of punishment to the ontology of the relationship. If the union is real, the punishment is just; if the union is metaphorical, the punishment is unjust.

  Crucially, Lewis is not endorsing penal substitution as true. He is explaining the conditions under which it is *believable* without contradiction. He demonstrates that a believer is not logically inconsistent for accepting penal substitution while rejecting a friend taking a prison sentence, provided they hold different metaphysical premises about identity in each case. The coherence of the doctrine depends entirely on the reality of the corporate union. Therefore, the moral objection is not defeated by logic alone; it is displaced onto the metaphysical claim. If one rejects the metaphysics of mystical union, the moral revulsion returns intact. Lewis successfully shows that the barrier to belief is not logical incoherence, but ontological commitment.

  ***

  ### Marking Scheme (Total: 25 Marks)

  **1. Exposition of Lewis's Argument (10 Marks)**
  *   **A-Range (8-10):** Clearly identifies Lewis's diagnosis: the conflict arises from "individualistic moral liability." Explains the "corporate/relational ontology" solution (kin group, mystical body) and how it allows the substitute's suffering to count as the offender's. Crucially, notes Lewis is analyzing *believability/coherence*, not endorsing the doctrine's truth.
  *   **B-Range (5-7):** Identifies the individualism vs. corporate point but is vague on how the transfer of liability works. May ambiguously imply Lewis is arguing *for* the doctrine rather than explaining its logical space.
  *   **C-Range (0-4):** Fails to identify the ontological shift. Treats the essay as a general discussion of atonement theories without referencing Lewis's specific philosophical move regarding identity and liability.

  **2. Critical Analysis (10 Marks)**
  *   **A-Range (8-10):** Directly addresses the "rescue vs. change of subject" prompt. Argues that redefining the moral agent alters the substance of retributivism. Distinguishes clearly between "relativising" the objection (cultural preference) and "relocating" it (shifting the burden to metaphysics).
  *   **B-Range (5-7):** Attempts the critique but conflates relativism with relocation. Argues one side (rescue OR change of subject) without nuance.
  *   **C-Range (0-4):** Offers generic moral opinions about punishment without engaging Lewis's specific framework.

  **3. Structure and Clarity (5 Marks)**
  *   **A-Range (4-5):** Concise, logical flow, precise terminology.
  *   **B-Range (2-3):** Understandable but disorganized or wordy.
  *   **C-Range (0-1):** Difficult to follow.

  **Specific Penalties (Mandatory Deductions)**
  *   **The "Full Stop" Objection (-5 Marks):** If the student ignores Lewis's argument to simply assert "punishing the innocent is unjust, full stop," cap the Critical Analysis score at 4/10. This answer fails to engage the text's specific philosophical move.
  *   **The "Endorsement" Error (-5 Marks):** If the student writes as though Lewis is defending the truth of penal substitution rather than explaining the conditions of its *believability*, cap the Exposition score at 4/10. This is a fundamental reading comprehension failure.
  *   **Taxonomy Dump (-3 Marks):** If the first paragraph is spent defining Satisfaction Theory vs. Moral Influence Theory rather than addressing Lewis's specific argument on liability, deduct from Structure.

  **Grade Boundaries**
  *   **21-25 (A):** Meets A criteria in all sections; avoids specific penalties.
  *   **16-20 (B):** Solid understanding but lacks nuance in the critical analysis or minor reading errors.
  *   **11-15 (C):** General understanding of the topic but misses Lewis's specific ontological point; falls into generic moralizing.
  *   **0-10 (D/F):** Significant misunderstanding of the text or failure to answer the prompt.
