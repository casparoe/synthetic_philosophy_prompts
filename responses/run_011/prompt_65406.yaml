answer: |-
  **MEMORANDUM**

  **TO:** Interpretive Standards Panel
  **FROM:** [Your Name/Seat]
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Memo: Framing Text for Bengal Famine Gallery

  **Purpose**
  This memo addresses the interpretive framing for the Bengal Famine of 1943 gallery. We face a conflict between scholarly nuance, moral accountability, community grievance, and institutional sustainability. Our charter requires that evaluative conclusions rest on the preponderance of scholarship. However, as one member noted, "famine" is already evaluative; neutrality is impossible. The question is not whether to judge, but how to articulate the relationship between natural shock and political agency without distorting the historical record or jeopardizing the gallery's existence.

  **The "Double-Entry" Proposal**
  One member proposes a double-entry label listing natural and political causes in parallel columns to reflect unsettled scholarship. While this appears balanced, it effectively launders a verdict as neutrality. Presenting policy decisions (denial policies, shipping refusals) alongside cyclones and crop disease as equivalent categories implies that political choices are forces of nature rather than exercises of agency. Scholarship agrees that while harvest shocks occurred, the scale of mortality was driven by the collapse of purchasing power and the refusal to mitigate that collapse. To weight these equally is to obscure the preponderance of evidence that human decisions transformed a food crisis into a mass-fatality event. We must not use "balance" to mask causality.

  **Culpability, Agency, and the "Crime" Framing**
  We must distinguish between causal contribution and moral imputation. Describing these deaths as a "crime" implies a legal standard of intent or recklessness that a museum panel is not constituted to adjudicate. However, culpability does not require an order to starve. In governance, culpability attaches to foreseeability and capacity to act. The colonial administration possessed the means to mitigate starvation through shipping and price controls but prioritized war logistics and urban stability over rural survival.

  This is not market abstraction; it is administrative choice. When starvation runs through markets, the responsible agent is the authority that regulates those markets and controls the shipping. Therefore, we can assert that policy choices *caused* the deaths without declaring them a *crime* in the penal sense. The "Crime" framing (Option 3) risks reducing complex administrative failure to a slogan, inviting legalistic rebuttals that distract from the historical reality. Conversely, the "Disaster" framing (Option 1) erases agency entirely.

  **The Genocide Request**
  Regarding the descendants' request to use the word "genocide": we must refuse this specific terminology while honoring the grievance behind it. Under international law and historical consensus, genocide requires specific intent to destroy a group in whole or in part. The scholarship indicates negligence and prioritization, not exterminatory intent. To adopt the term would violate our charter's requirement to adhere to the preponderance of scholarship. However, we owe this community recognition that their loss was not incidental. We can acknowledge that the impact fell disproportionately on specific religious and economic groups without applying a legal label the evidence does not support.

  **The Trust's Objection**
  The Trust's threat to withdraw funding if "criminal language" is used presents a material constraint, but not a curatorial one. We cannot allow a donor to dictate historical truth. However, we must distinguish between truth and vocabulary. If we can accurately describe the administration's fatal prioritization without using the word "crime," we satisfy our historical duty without triggering the financial clause. To ignore the budget is to risk a gallery that never opens; to capitulate is to render the gallery meaningless. The path forward is precise language that describes the failure without inviting libelous interpretation.

  **Recommendation**
  I recommend we reject Options 1 (Disaster), 3 (Crime), and the Genocide request. I also reject the double-entry label. I propose a modified version of Option 2, reframed as **Policy Failure**. This framing acknowledges that while natural factors existed, the scale of death was determined by administrative choices. It assigns responsibility to the regime without acting as a prosecutor.

  **Proposed Wall Text**
  > "Between one and four million people died in Bengal between 1943 and 1944. While cyclone, flood, and crop disease contributed to local shortages, the scale of starvation was determined by wartime policy. British authorities prioritized military supply and urban workers over rural populations, refusing to divert shipping or control inflation despite warnings. The provincial government never formally declared a famine. What began as a food crisis became a catastrophe through decisions about who was to be fed and who was not."

  **Criteria for Objections**
  Panel members should evaluate objections against this recommendation using the following criteria:
  1.  **Scholarly Alignment:** Does the objection rely on a minority view of the harvest data, or does it address the consensus on entitlement failure?
  2.  **Agency:** Does the objection treat policy decisions as inevitable wartime constraints, or does it acknowledge they were choices among alternatives?
  3.  **Institutional Risk:** Does the objection identify a specific legal liability, or does it rely on general discomfort with assigning blame?

  **Strongest Consideration Against This Recommendation**
  The strongest argument against this framing is that it may still be interpreted as a moral verdict by the Trust, triggering the funding withdrawal regardless of our semantic precision. If the Trust views "decisions about who was to be fed" as synonymous with "criminal negligence," we risk losing the gallery entirely. Some may argue that a vaguer "Disaster" framing ensures the gallery opens, allowing visitors to draw their own conclusions from the artifacts, preserving the platform for future reinterpretation rather than risking immediate closure.

  **Conclusion**
  We cannot write history to satisfy a donor, but we must write it so that it can be read. The proposed text meets the charter's standard, honors the dead by naming the mechanisms of their death, and avoids legally loaded terminology that offers a pretext for censorship. I urge the panel to vote for this framing.
