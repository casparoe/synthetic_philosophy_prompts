      *   **Recommendation:** Construct a "Fourth Option" or refine Option 2. Let's refine Option 2 into a "Policy Failure" framing. It captures culpability without needing legal proof of intent.
      *   **Wall Text:** Draft the actual sentences.
      *   **Criteria:** How to judge objections.
      *   **Counter-Argument:** Fair statement of the strongest case against the recommendation.

  4.  **Refining the Argument (Self-Correction during drafting):**
