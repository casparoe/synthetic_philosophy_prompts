prompt: |-
  I am seventeen, in my last year of high school, and I sit on our school's peer accountability board: a student panel that hears cases in which one student alleges that another has breached a community standard — copying lab data, damaging someone's property, engineering another student's exclusion from a team. Roughly once a term, the student who has been reported does not deny the allegation but turns it back on the person bringing it. "You did the same thing in ninth grade." "You're the one who gained the starting spot from it." "You've said publicly that you don't think this rule should exist." Our faculty adviser tells us to set such replies aside as beside the point, and about half the board agrees; the other half thinks they can be decisive. Before I take a side in that argument, I want to know what should be demanded of any account of standing to blame — a specification I could hold proposals against, including proposals nobody has written yet.

  So please set out the desiderata for a theory of standing to blame: the phenomena it must explain, the verdicts it must deliver in particular cases, the distinctions it must not collapse, and the ordinary facts about blame it must remain consistent with. Each requirement should come with the case or consideration that motivates it, and a sentence on what goes wrong for a theory that fails it. I am not asking for a survey of the debate, and I cannot check references, so please describe positions by their content rather than by author or title, and leave out bibliographies and reading lists entirely.

  Among the cases I have made up for myself, please tell me which belong in the data set a theory has to fit and which I should discard as confused. They are deliberately not the standard illustrations:

  - Priya falsified a results table in ninth grade, was caught, served the consequence, wrote the reflection, and has not done it since. In eleventh grade she reports another student for exactly that. Her target says she has forfeited any right to speak. Has she — and if not, what restored it, and on what date?
  - Nadia never broke the rule in question, but she knowingly kept the benefit her rival's breach handed her, and she is now the loudest voice condemning the rival.
  - Marcus is entirely entitled to object but cannot bring himself to, so he drafts the objection and has a classmate with no history of the offense deliver it verbatim. Can standing be handed over like that, and if so, does the deliverer acquire it or merely lend a mouth?
  - The same Priya also thinks badly of herself in private. Does whatever would disqualify her from addressing another disqualify her from addressing herself, and if not, what is the difference made of?
  - A student who believes our phone policy is unjust and says so at every assembly nevertheless reports someone under it. Their target says: you do not even accept the standard you are invoking.
  - Two students did the same thing; one did it once four years ago, one does it weekly. Does the theory have room for that difference, or only for a yes/no?

  Also tell me which requirements are non-negotiable and which are really the preferences of one camp — for instance, whether a theory must explain the *feeling* of force behind "you did it too" or only its normative status; whether it must leave the accused's culpability completely untouched; whether standing has to come in degrees; whether it must be a property of a person or can be a property of a particular act of blaming in a particular relationship. If some subset of the desiderata turns out to be jointly unsatisfiable, say so explicitly and give the argument, because that result would matter to me more than any of the individual items. And identify the single requirement that does the most work in eliminating candidate accounts.

  One further wrinkle. My purpose is practical, and adequacy depends on purpose: whatever account I end up defending has to be translatable into a rule a panel of sixteen-year-olds can apply in public, without interrogating anyone's private moral history or grading their character. That seems to add demands of its own — publicity, operability, some limit on how much of a person's past is admissible. Please say plainly whether those belong on the list as genuine desiderata for a theory of standing, or whether they are only constraints on my institution and would be a category error to build into the theory itself.

  Finish, briefly and only if the list permits it, with a paragraph each on how the main available explanations fare against it: the view that keys lost standing to the blamer's own wrongdoing, the view that keys it to the blamer's failure to hold herself to the standard she invokes, the view that treats blame as a form of address that presupposes some relationship, and the view that there is no such thing as standing and that the intuition is an artifact. Keep this short — the criteria are what I actually need.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** 17-year-old high school senior, member of a peer accountability board.
      *   **Context:** Deals with student disputes (academic dishonesty, property damage, social exclusion). Frequently encounters the "tu quoque" defense ("you did it too").
      *   **Task:** Provide desiderata (requirements) for a theory of *standing to blame*.
      *   **Constraints:**
          *   Do not survey the debate or cite authors/titles. Describe positions by content.
          *   No bibliographies.
          *   Evaluate specific made-up cases (Priya, Nadia, Marcus, Self-Blame, Unjust Rule, Frequency/Recency).
          *   Distinguish non-negotiable requirements from camp preferences.
          *   Identify if any requirements are jointly unsatisfiable.
          *   Identify the single most eliminative requirement.
          *   Address the "practical constraint" (public, operable rules for teens) vs. "theoretical desiderata."
          *   Briefly evaluate main available explanations against the criteria at the end.
          *   Tone: Respectful, intellectually rigorous, accessible but not condescending.

  2.  **Deconstruct the Core Philosophical Problem:**
      *   The problem is *Standing to Blame*. When does a person lose the moral authority to criticize another for a fault they share (or have shared)?
      *   The user needs a framework to judge *proposals* for how the board should handle these defenses.

  3.  **Drafting the Desiderata (The "List"):**
      *   I need to identify what a good theory must do.
      *   *Requirement 1: The Distinction between Hypocrisy and Innocence.* A theory must explain why a non-hypocritical blamer has more authority than a hypocritical one, even if the wrongdoer's guilt is the same.
      *   *Requirement 2: The Temporal Dimension.* It must handle past wrongdoing vs. current wrongdoing (Priya's case).
      *   *Requirement 3: The Benefit Constraint.* It must address benefiting from wrongdoing without committing it (Nadia's case).
      *   *Requirement 4: Agency and Delegation.* It must clarify if standing is personal or transferable (Marcus's case).
      *   *Requirement 5: Self-Blame.* It must distinguish standing to blame others vs. oneself.
      *   *Requirement 6: Normative Consistency.* It must handle the case where the blamer rejects the rule (Unjust Rule case).
      *   *Requirement 7: Gradability.* It must explain if standing is binary or scalar (Frequency/Recency case).
      *   *Requirement 8: The "Untouched Culpability" Constraint.* The theory must not let standing issues erase the original wrong.

  4.  **Evaluating the User's Cases:**
      *   *Priya (Past Wrongdoing):* **Keep.** Central to the "forgiveness/reform" question.
      *   *Nadia (Benefit without Breach):* **Keep.** Tests if standing is about *action* or *complicity*.
      *   *Marcus (Delegation):* **Keep.** Tests the nature of standing (property vs. act).
      *   *Priya (Self-Blame):* **Discard (mostly).** While philosophically interesting, it's likely outside the scope of a *peer accountability board*. However, as a theoretical desideratum, it's crucial for distinguishing public vs. private standing. I should advise keeping it for theory, discarding for board policy.
      *   *Unjust Rule:* **Keep.** Tests the link between belief and standing.
      *   *Frequency/Recency:* **Keep.** Tests binary vs. scalar nature.

  5.  **Distinguishing Non-Negotiable vs. Preference:**
      *   *Non-Negotiable:* Culpability remains untouched (the wrong is still wrong), Distinction between blamer types (hypocrite vs. non-hypocrite), Operability (for the user's specific context).
      *   *Preference:* Scalar vs. Binary (some theories say you either have it or you don't), Self-Blame symmetry (some say standing is purely relational).
      *   *Feeling of Force:* This is psychological, not normative. A theory needs to explain the *normative* force, not necessarily the emotional sting.

  6.  **Addressing Joint Unsatisfiability:**
      *   Is there a conflict? Yes. *Moral Consistency* vs. *Operability/Privacy*.
      *   To know if someone has standing based on their moral history (Priya), you need to know their history. But the board rules say "no interrogating private moral history."
      *   Also: *Culpability Untouched* vs. *Standing as Defeater*. If standing is lacking, does the blame fail? If the blame fails, does it look like the act wasn't wrong?
      *   Actually, the bigger tension is between **Moral Truth** (did they do it?) and **Procedural Fairness** (can we ask?).
      *   Wait, the prompt asks about *theoretical* desiderata first, then the practical constraint. I need to check if the practical constraint creates a contradiction in the *theory*.
      *   Theoretical tension: **The "Clean Hands" Requirement vs. The "Reform" Requirement.** If standing requires clean hands, Priya never gets it back. If reform restores it, when? This isn't unsatisfiable, just hard.
      *   Real unsatisfiability: **Privacy vs. Moral Accuracy.** You cannot have a theory that demands full moral accounting *and* a rule that forbids looking into the past. I need to be clear that this is a constraint on the *institution*, not necessarily the *theory*, but if the theory requires private knowledge, it fails the user's purpose.

  7.  **Identifying the "Most Work" Requirement:**
      *   The requirement that **the wrongdoer's culpability remains untouched** is the heavy lifter. It prevents the "tu quoque" from becoming a "get out of jail free" card. It forces the theory to separate the *act* from the *accuser*.

  8.  **Addressing the Practical Constraint (Publicity/Operability):**
      *   Are these genuine desiderata for a *theory*? No. They are desiderata for an *institution*.
      *   A philosophical theory can be complex and private. A school board rule must be public and simple.
      *   I need to tell the user: Do not build "easy to apply" into the definition of standing. Build it into the *procedure* for adjudicating standing.

  9.  **Evaluating Main Explanations (Briefly):**
      *   *Wrongdoing Account (Hypocrisy):* Fails Priya (past wrong).
      *   *Commitment Account (Belief):* Fails Unjust Rule (can blame even if you disagree, provided you acknowledge the rule exists).
      *   *Relationship Account:* Good for Marcus, hard for strangers.
      *   *Error Theory (No Standing):* Fails the intuition that hypocrites lack authority.

  10. **Refining and Polishing:**
      *   *Tone Check:* Ensure I'm speaking to a smart 17-year-old, not a professor, but not talking down. Use clear examples.
      *   *Structure:* Follow the prompt's order.
      *   *Case Evaluation:* Be decisive on which to keep/discard.
      *   *Unsatisfiability:* Be honest if things clash.
      *   *Practicality:* Distinguish theory vs. policy clearly.

      *(Self-Correction during drafting)*: I initially thought about telling the user to discard the Self-Blame case entirely. But the prompt asks what a *theory* must explain. A theory of standing *should* explain self-blame, even if the board doesn't handle it. I will advise that it belongs in the theoretical dataset but not the institutional policy dataset.

      *(Refining the "Unsatisfiable" point)*: The tension between "Standing depends on private moral history" and "Board cannot investigate private moral history" is the key. I need to state that a theory requiring deep moral auditing is incompatible with the board's constraints, even if the theory is philosophically sound.

      *(Refining the "Most Work" requirement)*: The requirement that *blame can be apt even if the blamer lacks standing* is crucial. It stops the defense from exonerating the accused.

      *(Final Review against constraints)*: No authors? Check. No bibliography? Check. Address all specific cases? Check. Address practical constraints? Check.

