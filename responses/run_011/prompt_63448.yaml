prompt: |-
  Ops lead at a 22-person insurance claims team here, and we're rewriting our standard operating procedures. Half the team wants checklists tight enough that a temp could run a claim end to end; the other half says our worst screwup last year was an adjuster following the checklist straight into denying something that obviously should have been paid. I want to think it through with sphexishness -- Dennett's wasp idea, where an animal looks perfectly competent right up until the situation shifts one step off script and it just repeats itself. I also have in mind his cognitive wheels argument, that flexibility isn't free and real competence gets built out of cheap rigid routines first, plus the fact that people have since argued Fabre's wasp story was overblown, and that re-inspecting a disturbed nest might be perfectly adaptive behavior rather than a stuck record.

  Play the role of a philosopher of mind who has also done consulting work on operational design, and think carefully before answering. Give me the five most important implications of sphexishness for how I should actually write these SOPs -- not a summary of Dennett, but claims that bite. Some of what I'm after: does the cognitive wheels point license tight scripts or undercut them, who is allowed to go off script and what makes them qualified, whether a procedure can be sphexish even when the person running it isn't, and whether the shaky wasp anecdote changes anything about the argument.

  American English please, and just a numbered list of exactly five items, one or two sentences each, no introduction and no conclusion.
