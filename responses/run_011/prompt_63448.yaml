answer: |-
  1. Dennett's cognitive wheels argument licenses tight scripts for routine tasks because automating the basics frees up the mental bandwidth required for the complex judgment needed when exceptions arise.
  2. Grant off-script authority only to adjusters who have demonstrated the surplus cognitive capacity to recognize context shifts, rather than allowing novices to improvise before they master the routine.
  3. A procedure itself becomes sphexish if it lacks explicit exception triggers, meaning you must design escape hatches into the checklist that force a human review when specific anomaly markers appear.
  4. Since the wasp anecdote was likely overblown, treat apparent rigidity as adaptive caution and require adjusters to log specific reasons for deviation rather than encouraging free-form improvisation.
  5. Ultimately, competence is not the absence of rigid routines but the layered ability to switch between them, so your documentation must specify not just the steps but the conditions under which the script is no longer the map.
