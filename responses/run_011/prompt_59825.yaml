  The argument you have assembled is a rigorous reconstruction of David Lewis's famous dilemma regarding temporary intrinsics, extended to trap both major theories of persistence. It is valid, but it is not sound. The failure occurs at a specific juncture where a contingent metaphysical commitment is disguised as a logical necessity.

  ### 1. Diagnosis: The Failure of Step (5)

  The argument goes wrong at **premise (5)**.

  **(5) claims:** *"The very same thing has being-hot-at-t1 and being-cold-at-t2. But it has both of these now... So on endurantism the coffee never changes either."*

  This premise asserts that Endurantism *entails* the possession of time-indexed properties (e.g., *being-hot-at-t1*) as eternal, unchanging facts about the object. It concludes that because the object possesses this entire "stock" of properties eternally, no gain or loss occurs.

  **Why it reads as unobjectionable:**
  This step reads as unobjectionable because it relies on a powerful and intuitive analogy between time and space, often called the **Indexicalist** or **Relationalist** view of properties. When we consider spatial variation, we accept that an object can be *bent-in-the-leg* and *straight-in-the-back*. We possess both of these indexed properties eternally; we do not "lose" *bent-in-the-leg* when we stand up. Premise (5) treats temporal qualification identically: it assumes that if an endurantist relativizes properties to times to avoid contradiction, they must treat *being-hot-at-t1* as a single, static property possessed by the object at all times (including now). Given **Eternalism** (the view that past, present, and future times all exist), this inference is logically tight. If the object exists at $t_{now}$, and $t_1$ exists, and the relation *has-at* holds between them, then the fact is eternally true. The step feels inevitable because it treats time as just another dimension of indexing, like spatial location.

  **Why it is false:**
  Premise (5) falsely equates **Endurantism** with **Eternalist Indexicalism**. It ignores viable Endurantist frameworks that reject the ontological commitments required to make (5) true.
  1.  **Presentism:** If only the present exists, the coffee does *not* have the property *being-hot-at-t1* now, because $t_1$ does not exist now. The property is not part of its current stock. Thus, it *did* lose the property of being hot when $t_1$ ceased to be present.
  2.  **Adverbialism (Primitivism):** This view denies that the property itself is indexed. The coffee has *being-hot* absolutely, but it has it *at-t1*. The temporal modifier attaches to the *instantiation* (the copula), not the *property*. On this view, the object does not possess a timeless relation *being-hot-at-t1*; it simply *was* hot.

  By assuming that Endurantism must adopt the Indexicalist solution (which Lewis himself targeted and refuted), premise (5) attacks a strawman. Endurantism can accommodate real change (8) without contradiction by rejecting the Eternalist/Indexed-property model assumed in (5).

  ### 2. Symmetry and Asymmetry of (4) and (5)

  Premises (4) and (5) **do not fail for the same reason**. There is a deep asymmetry in how the two theories must respond to this argument to save the reality of change (8).

  *   **Perdurantism (Premise 4):** The Perdurantist typically **accepts the description** in (4) but **rejects the inference** to "no change." They admit that the spacetime worm is a static distribution of properties across parts. However, they deny premise (1)'s requirement that change must involve numerical identity of the *whole* object having incompatible properties. For the Perdurantist, change *is* the variation of properties across temporal parts.
      *   *Implication:* Perdurantism saves the phenomena by **redefining change**. It is revisionary about the *concept* of change, analyzing it as qualitative variation across parts rather than alteration of a whole.

  *   **Endurantism (Premise 5):** The Endurantist **rejects the description** in (5). They deny that they are committed to the object possessing a fixed stock of time-indexed properties eternally. They insist that the object *gains* and *loses* properties simpliciter.
      *   *Implication:* Endurantism saves the phenomena by **refining instantiation**. It is revisionary about the *metaphysics of time or possession* (adopting Presentism or Adverbialism) to ensure that past properties are not currently possessed.

  **The Asymmetry:** Perdurantism saves change by making the *object* complex (a worm of parts) and change static (a pattern). Endurantism saves change by making the *possession* dynamic (temporal instantiation) and the object simple (wholly present). The Perdurantist bites the bullet on (1); the Endurantist bites the bullet on (2) or (3) (by denying that absolute properties entail contradiction, or by denying the exhaustive nature of the "absolute vs. relative" dichotomy).

  ### 3. Cost Analysis (If one rejects the "Single Step" diagnosis)

  *Although I maintain that (5) is the specific point of failure, the argument's force relies on the surrounding logical structure. If one were to view the failure as distributed, here is the cost of abandoning the key premises for each theory:*

  *   **Abandoning (1) (Change requires numerical identity):**
      *   *Perdurantist:* No cost. This is their standard move. Change is variation across parts.
      *   *Endurantist:* High cost. It dissolves the distinction between change and replacement, undermining the core intuition of endurance.
  *   **Abandoning (2) (Absolute vs. Relative exhaustion):**
      *   *Perdurantist:* Low cost. They can accept adverbial modification of parts.
      *   *Endurantist:* Medium cost. Requires adopting Adverbialism, which complicates the logic of predication (triadic instantiation).
  *   **Abandoning (3) (Absolute properties imply contradiction):**
      *   *Perdurantist:* Irrelevant. They relativize to parts regardless.
      *   *Endurantist:* High reward/High cost. Allows properties to be absolute, but requires explaining how $F$ and not-$F$ are held without contradiction (usually via Presentism).
  *   **Abandoning (6) (Parts and Times are the only candidates):**
      *   *Perdurantist:* Low cost. They can accept temporal parts are not the only way, but prefer them.
      *   *Endurantist:* Medium cost. Opens door to Presentism or other ontologies of time.

  **Cheapest Exit Overall:** The cheapest exit is for the **Perdurantist to abandon (1)**. It requires the least metaphysical gymnastics regarding time or instantiation; it simply requires accepting that our ordinary language about "change" is a manner of speaking about spacetime patterns. However, since you regard (8) and (1) as fixed, the cheapest exit for *your* seminar constraints is for the **Endurantist to reject (5)** by adopting **Adverbialism**. This preserves numerical identity, preserves real change, and avoids the contradiction without requiring the radical ontology of Presentism.

  ### 4. Validity and the "No Change" Metaphysics

  *Since my considered view is that the argument is **invalid** (due to premise 5), I do not need to sketch a metaphysics without change. However, to address your final constraint:*

  If one were forced to accept the argument as valid and abandon (8), one would have to adopt a **Block Universe Eternalism** where "change" is purely psychological. In this metaphysics:
  1.  **Ontology:** The universe is a four-dimensional block. All times exist equally.
  2.  **Objects:** Objects are spacetime worms.
  3.  **Properties:** All properties are time-indexed and possessed eternally by the worm.
  4.  **Change:** There is no ontological change. What we call "change" is the conscious experience of a mind (itself a worm-segment) encountering different qualitative properties along its temporal extent.
  5.  **Truth:** Propositions like "The coffee is changing" are false *simpliciter*; they are only true relative to a temporal perspective within the block.

  This view earns the name "metaphysics of persistence" only by redefining persistence as the existence of a spacetime worm, and "change" as a subjective illusion of passage. Given your commitment to (8), this is the view you must avoid, which confirms that rejecting (5) is the necessary path for your seminar.
