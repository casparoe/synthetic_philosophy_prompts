      Now I can say what the danger was. It involved nuclear weapons. It involved the bomb. But for her, these were not abstract concepts. They were things kept at bay by paperwork. She kept yellow legal pads. She once spent two years on a single sentence of an agreement. She answered the phone the same way for thirty years. She made sure the test never came.

