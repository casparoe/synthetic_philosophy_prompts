      The people in this room who spent their careers on this subject know the logic better than I do. You know that the arrangement was not wise. You know that it only held. You know that a great deal of uncelebrated labour went into the holding. My mother did not solve the paradox. She served it. She worked on the wording. She made the phone calls. She ensured that the human decision remained possible.

      This speech will not resolve the paradox. It will not end triumphantly. The world is still dangerous. The work is not finished. But for thirty-one years, the test did not come. That was not luck. That was labour. And for that labour, our family is grateful. And I suspect, though she would not say it, so is everyone else in this room.

