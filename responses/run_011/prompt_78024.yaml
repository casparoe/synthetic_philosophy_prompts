      *   *Thesis:* The original design was **Majoritarian Industrial Sovereignty**. The union acts as the legislative branch for the workplace. The current friction (especially post-*Janus*) arises because the Supreme Court has imposed a **Libertarian/Individualist Rights** framework onto a **Collectivist/Functionalist** structure without dismantling the structure.
      *   *Verdict:* The system *presupposes* the union is a quasi-public governing body. The *Janus*/Right-to-Work overlay treats it as a private political club. These are incompatible.

  7.  **Drafting the Argument (Section by Section):**

      *   **Introduction:** Acknowledge the tension. State the thesis clearly: The system is built on **Majoritarian Industrial Sovereignty**, treating the union as a quasi-governmental legislature for the workplace, not a voluntary club.
      *   **The Theory of Representation:** Explain why the vote isn't about joining a club, but selecting a government. Use the "Social Contract" analogy. The majority binds the minority, just like a city council binds dissenting residents.
      *   **The Duty of Fair Representation (DFR):** Why does this exist? Because if the union is the *sole* government, it cannot violate Equal Protection principles. It's a constitutional-style constraint on a private actor wielding public-like power.
      *   **The Fee/Janus Mismatch:** This is where the theory breaks. *Janus* imposes a liberal individualist view (speech rights) on a pluralist structure. This creates the "free rider" incoherence.
      *   **Rival Theories Ruled Out:** Explicitly reject the "Mutual Aid/Contractual" model. If it were that, non-members wouldn't be covered, and fees would be mandatory for coverage.
      *   **Underdetermination:** Where is the law vague? The scope of "fair representation." Does it mean procedural fairness or substantive equality?
      *   **The Counterfactual (Consent-and-Membership View):** If we switched to a pure voluntary model (members only), what happens?
          *   End of exclusive representation.
          *   Multiple unions possible.
          *   Management can pick and choose who to bargain with.
