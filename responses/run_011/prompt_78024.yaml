answer: |-
  The arrangement you describe is not a philosophical accident; it is the deliberate architecture of **Industrial Pluralism**.

  To make sense of it, you must abandon the idea that the union is a private club or a mutual-aid society. Under the National Labor Relations Act (NLRA) and the jurisprudence surrounding it, the union is constructed as a **quasi-sovereign legislature for the workplace.**

  Here is the committed reading: The law treats the bargaining unit as a distinct political polity. The election is not an invitation to join an association; it is a ratification of a governing authority. The "mismatch" you perceive between individual voting and collective binding is not a contradiction; it is the standard mechanism of majoritarian democracy. The current incoherence regarding fees (especially post-*Janus*) arises because the Supreme Court has recently superimposed a **Libertarian Individualist** framework onto a **Collectivist Functionalist** structure without dismantling the structure itself.

  Here is the breakdown of that theory, what it rules out, and what happens if you swap it for the consent-based view you suspect is missing.

  ### 1. The Theory: Majoritarian Industrial Sovereignty
  The philosophical foundation of exclusive representation is that industrial peace requires a single sovereign voice for labor, just as a state requires a single government to avoid civil war.

  **The Vote as Social Contract:**
  When the NLRB supervises an election, it is not tallying preferences for a service provider; it is conducting a constitutional convention for the shop floor. The "one person, one vote" mechanism is the method of legitimizing sovereignty. Once the majority consents to the *regime* (the union as exclusive agent), the regime binds the minority. This is standard social contract theory: you are bound by the laws of the jurisdiction you reside in, even if you voted against the party that passed them.

  **Exclusive Representation as Jurisdiction:**
  By granting the union "exclusive" status, the state grants it a monopoly on bargaining power in that unit. In exchange for this state-backed monopoly, the union accepts the **Duty of Fair Representation (DFR)**. The DFR is the functional equivalent of the Equal Protection Clause. Because the union wields state-delegated power to set the terms of employment for *everyone*, it cannot discriminate against the political minority within its jurisdiction.

  **Why Non-Members Are Covered:**
  Under this theory, the Collective Bargaining Agreement (CBA) is not a private contract between two parties; it is a **statute** for the workplace. You cannot opt out of a statute simply because you didn't vote for the legislature that passed it. If the union negotiates a wage floor, that floor applies to the unit because the *unit* is the recognized polity, not because every individual consented to the specific wage.

  ### 2. What This Theory Rules Out
  This framework explicitly rejects two rival pictures of association:

  **A. The Mutual-Aid/Contractual Model:**
  If the union were a voluntary mutual-aid society, its obligations would run only to its dues-paying members. It could legally refuse to process a grievance for a non-member. It could negotiate side deals that favored members over non-members. The fact that the law *forbids* this (via the DFR) proves the union is not acting as a private fiduciary for its members, but as a public administrator for the unit.

  **B. The Exit-Based/Market Model:**
  In a pure market model, if workers don't like the union, they exit (quit) or the union exits (decertifies). But the law makes decertification difficult and forbids the union from "dropping" non-members. This rules out the idea that the union's authority is sustained by continuous market consent. Its authority is sustained by legal status. The "exit" option is structurally suppressed to prevent the "tragedy of the commons" where individual defection undermines collective bargaining power.

  ### 3. The Atomization/Reconstitution "Mismatch"
  You asked if the shift from individual ballot to collective body is a contradiction. Under Industrial Pluralism, it is exactly right.

  The law atomizes workers *only* to determine the legitimacy of the sovereign. Once legitimacy is established (50% + 1), the atoms are reconstituted into a **corporate body**. This is the legal fiction of the "bargaining unit." The unit is the legal person, not the individual workers.

  The dissenters are not being forced to *associate* in the expressive sense (which would trigger First Amendment issues); they are being subjected to *governance*. The Supreme Court has historically held that compulsory representation is justified by the government's interest in labor peace and the prevention of "fractionalization" (multiple unions claiming to speak for the same workers).

  ### 4. Where the Theory Breaks (The Fee Mismatch)
  This is where your intuition about incoherence is correct, but the diagnosis requires precision.

  The original New Deal deal was: **Monopoly Power + Compulsory Fees + DFR.** This was coherent. If you are the government, you can tax the populace to fund your operations. (This was the "union shop" model).

  The current regime (Right-to-Work laws + *Janus v. AFSCME*) is: **Monopoly Power + No Compulsory Fees + DFR.**
  This is philosophically broken. It treats the union as a **public utility** (must serve everyone) but strips it of the **taxing authority** usually granted to public utilities.

  *Janus* imposed a **Libertarian Individualist** theory of speech onto the **Pluralist** structure. The Court argued that bargaining in the public sector is inherently political, so forcing fees violates free speech. But the Court did *not* strike down exclusive representation.
  *   **Result:** The state forces the union to represent the dissenter (burden), but forbids the union to charge the dissenter (no revenue), while simultaneously preventing the dissenter from hiring their own agent (exclusive representation).

  This is the underdetermined zone. The law has not decided if the union is a **speaker** (which requires opt-in consent) or a **governor** (which allows majority binding). Currently, it is legally forced to be a governor without the tools of governance.

  ### 5. The Counterfactual: Swapping in the Consent-and-Membership View
  If we were to align the law with the "voluntary association/consent" view you are looking for, the changes would be radical and would effectively dismantle the New Deal labor system.

  **Legal Changes Required:**
  1.  **End of Exclusive Representation:** Management would have to be allowed to bargain with multiple unions, or with individuals. If a worker doesn't consent to the union, the union has no standing to represent them.
  2.  **Abolition of the Duty of Fair Representation:** The union would only owe a duty to its members. It could negotiate a two-tier system where members get grievance representation and non-members do not.
  3.  **Individual Contracting:** Non-members would negotiate their own terms. The CBA would only cover members.

  **Consequences for Collective Agency:**
  *   **Fragmentation:** You would return to a system of "memberships" rather than "units." A workplace could have three different unions and fifty individual contracts.
  *   **Loss of Leverage:** The union's power comes from the threat of a unified strike. If only 60% of the workforce are members and the other 40% are legally distinct individual contractors, the employer can often operate through the 40%. The strike threat loses its sovereignty.
  *   **Management Power:** Management gains the ability to play factions against one another. Without exclusive representation, management is not legally obliged to recognize the majority union at all; they can simply ignore the union and bargain with individuals (a return to pre-1935 dynamics).

  ### The Verdict
  The system you are struggling to make sense of is **Majoritarian Industrial Sovereignty**. It is coherent *only* if you accept that the workplace is a polity and the union is its legislature.

  The friction you feel is not a flaw in the original design, but a fracture caused by the Supreme Court's recent insistence on treating the union as a **political advocacy group** (for First Amendment purposes) while retaining the legal requirement that it act as a **governing monopoly** (for labor law purposes).

  If you want a system based on pure consent and voluntary membership, you cannot have exclusive representation. You must choose: either the union is the government of the shop (and can bind/tax the minority), or it is a private club (and cannot bind/tax anyone but its members). US law currently tries to force it to be a government that cannot tax, which is why it feels philosophically untenable.
