          *   **Crucial:** Explain what would change if the "consent-and-membership" view replaced the current one.

  2.  **Deconstruct the Legal/Philosophical Landscape:**
      *   **The Regime:** National Labor Relations Act (NLRA) for private sector, various state laws + *Janus* for public sector.
      *   **Key Features:**
          *   Exclusive Representation (Section 9(a) NLRA).
          *   Duty of Fair Representation (DFR) - judicial creation (*Steele v. Louisville & Nashville*).
          *   Right-to-Work (Section 14(b) NLRA) + *Janus v. AFSCME* (public sector).
      *   **The Philosophical Problem:** How can a private organization be forced to represent non-members who don't pay, while being barred from discriminating against them?

  3.  **Identify the Dominant Theory:**
      *   Is it a "Public Utility" model? Yes, functionally.
      *   Is it a "Majoritarian Democracy" model? Yes, procedurally.
      *   Is it "Industrial Pluralism"? This is the academic term. The idea is that labor and management are competing sovereigns within the workplace, and the union is the legislative branch for workers.
      *   *Decision:* The strongest cohesive theory is **Industrial Pluralism combined with a Majoritarian Conception of Sovereignty.** The union isn't just a club; it's a *governing institution* for the workplace.

  4.  **Address the "Atomization vs. Reconstitution" Mismatch:**
      *   The user asks if the shift from individual ballot to collective body is a contradiction.
      *   *Argument:* It's not a contradiction under Social Contract theory. The vote isn't just a preference survey; it's a ratification of a governing authority. Once the majority consents to the *regime*, the regime binds the minority (standard democratic theory).
      *   *Nuance:* The "consent" is to the *exclusive bargaining agent*, not necessarily every contract term.

  5.  **Address the "Free Rider" / Fee Issue:**
      *   Why ban fees (*Janus*, Right-to-Work) but keep DFR?
      *   *Historical shift:* Originally, the theory was "benefits conferred = payment due" (quasi-contract).
      *   *Current shift:* First Amendment speech/association rights trump the economic stability of the union.
      *   *Philosophical tension:* This creates the incoherence the user spots. The *Janus* court treated the union as a political speaker (requiring opt-in) but kept the exclusive representation mandate (requiring service). This is the "underdetermined" or broken part.

  6.  **Develop the "Commitment":**
