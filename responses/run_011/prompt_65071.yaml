  *Application to Pile-ons:* Is a pile-on an instigation to a mischievous act? If the "mischievous act" is harassment/bullying that drives the user away, then yes. The pile-on *is* the mob action. The original post is the spark.
  *Wait, the prompt asks about the pile-on thread itself.* The thread *is* the mob gathering.
  *Okay, the opponent says:* "Words won't hurt."
  *Mill says:* "Words can be acts if they incite harm."
  *My analysis:* The proverb claims words are inert. Mill shows words are contextual. If the context (400 people vs 1) creates a high probability of severe psychological harm or exclusion, it moves from "opinion" to "assault."

