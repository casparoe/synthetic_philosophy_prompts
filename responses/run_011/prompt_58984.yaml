answer: |-
  ### The Verdict
  **Sam donates the $15k.**

  Despite the low probability (1-in-a-million), the expected value (1,000 lives) vastly outstrips the alternative (roughly 3 lives via bednets). Crucially, the probability estimate comes from modelers whose calibration he has personally verified. This distinguishes the case from the "internet mugger" (untrusted source, absurd magnitude) and aligns it with the previous biosecurity grant (trusted source, high impact), even if the probability is lower. His risk aversion on money reflects diminishing marginal returns on *funding*, not necessarily on *lives*, and the EV gap here (300:1) is too large for his demonstrated level of risk aversion to overcome.

  ***

  ### Three Consistent Rules

  Here are three decision rules that fit Sam's past behavior but diverge on future edge cases:

  **1. Epistemically Constrained Expected Value (ECEV)**
  *   **The Rule:** Maximize expected value, but only count probabilities that pass a strict epistemic vetting process (e.g., calibrated forecasters, strong trials). Reject probabilities that are speculative or unverified (Pascal's Mugging), regardless of the mathematical EV. Apply a concave utility function to money (diminishing returns on funding) but remain roughly risk-neutral on lives *if* the probability is robust.
  *   **Consistency:** Explains bednets (verified), Bio-1 (verified), Money cases (concave utility of funding), and Mugging rejection (unverified probability).
  *   **New Case:** **Donate.** The modelers are checked; the EV is robust.

  **2. Risk-Weighted Expected Utility (RWEU)**
  *   **The Rule:** Probabilities are non-linearly weighted based on magnitude. Small probabilities are psychologically discounted (e.g., a 1% chance feels like 0.5%). This applies to both money and lives. Extremely small probabilities (like 1-in-a-million) are weighted near zero regardless of source credibility.
  *   **Consistency:** Explains money risk aversion (downweighting the 50% and 10% chances), Mugging rejection (1-in-a-billion weighted to zero), and Bio-1 (1-in-100 is high enough to retain weight).
  *   **New Case:** **Reject.** 1-in-a-million is below the psychological threshold for action, even with trusted modelers.

  **3. The Plausibility Threshold (Heuristic)**
  *   **The Rule:** Act on EV only if the probability exceeds a fixed floor (e.g., 1-in-10,000) OR if the scenario is "concrete" (like bednets). If the scenario feels abstract or "long-shot," reject it unless the probability is above the floor.
  *   **Consistency:** Explains Bednets (concrete), Bio-1 (1-in-100 > floor), Mugging (1-in-billion < floor), Money (concrete amounts).
  *   **New Case:** **Reject.** 1-in-1,000,000 falls below the plausibility floor, triggering the same "silly" intuition as the Mugging.

  ***

  ### Which Rule Do I Bet On?
  **I bet on Rule 1: Epistemically Constrained Expected Value (ECEV).**

  **Why:** Sam's language is the tell. He doesn't say "the odds feel too low"; he says he checks **calibration** and **forecasts**. He rejected the mugger not because the math was wrong (1e-9 * googolplex is huge), but because the claim was *silly* (epistemically bankrupt). He accepted the 1-in-100 bio grant because he "checked" the forecasts.

  The money risk aversion is standard Effective Altruist behavior: charities have diminishing returns on marginal dollars (the first $80k is easier to spend effectively than a risky $200k grant). This doesn't imply he is risk-averse on *lives* when the probability is trusted. The EV difference in the new case (1,000 expected lives vs. 3 certain lives) is so massive that only a rule that treats 1-in-a-million as *epistemically void* (Rule 2 or 3) would reject it. Given his emphasis on modeler calibration, he treats the probability as real.

  ***

  ### Is He "Just Following the Math"?
  **No.** This is an inaccurate self-description.

  Pure expected value math demands he pay the internet mugger (if he assigns *any* non-zero probability to the claim) and take the 50% chance at $200k over the guaranteed $80k (assuming linear utility). Sam is actually following **Math + Epistemic Sanitization + Risk Management.** He is using heuristics to filter out "noise" in probability estimates and managing the risk of ruin for his charitable portfolio. He is following the math *conditional on his trust in the inputs*, which is a philosophical stance, not a mathematical necessity.

  ***

  ### The Distinguishing Test Case
  To tell **ECEV (Rule 1)** apart from **Risk-Weighted Utility (Rule 2)**, you need to isolate the *source credibility* from the *probability magnitude*.

  **The Case:**
  > "A group of forecasters you have worked with for years (perfect calibration record) presents a model: For $15k, there is a **1-in-10,000,000** chance of preventing a disaster that kills **100 million people** (EV = 10 lives). Alternatively, you can save **5 lives for certain** via bednets."

  *   **ECEV Prediction:** **Donate.** The source is trusted, so the probability is treated as real. 10 expected lives > 5 certain lives.
  *   **RWEU Prediction:** **Reject.** A 1-in-10-million probability is psychologically weighted to near zero, regardless of the source. The certainty of 5 lives outweighs the "phantom" 100 million.

  If Sam donates, he is an Epistemic Constrainist. If he passes, he is a Risk-Weighter.
