      *   *Correction/Nuance:* Gibbs didn't explicitly claim particles were ontologically identical in the quantum sense; it was more about the "generic phase" vs. "specific phase." Bose's move was more radical because it wasn't just a correction factor at the end; it changed the fundamental counting of microstates.

  3.  **Metaphysical Mapping (PII & Black's Spheres):**

      *   *PII:* If $x$ and $y$ share all properties, then $x = y$. (Contrapositive: If $x \neq y$, they must differ in some property).
