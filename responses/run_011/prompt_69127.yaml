      *   *Haecceitism:* Can a haecceitist (believer in primitive thisness) use BE statistics? Yes, if they claim the *dynamics* or *accessibility* of states is restricted, even if the objects have primitive identity. However, standard QM interpretation suggests the state vector itself is symmetric/antisymmetric, making the labels mathematically redundant.
