answer: |-
  ### The "Accuracy-First" Sorting Quiz

  **Instructions:** Read each scenario and pick the option that matches your gut reaction. Don't overthink the math; go with what feels like the right call for a rational agent.

  **Q1 (Boundedness):** You assign 99.999% confidence to a claim. It turns out false. Should your penalty be infinite?
  *   **A:** Yes. Absolute certainty demands absolute accountability.
  *   **B:** No. A finite penalty is enough; infinity breaks the math.

  **Q2 (Separability):** You predict Rain and Wind. If you miss Rain but get Wind right, does the Wind score change because you missed Rain?
  *   **A:** No. Score each claim independently and sum them.
  *   **B:** Yes. The whole web of belief is scored together.

  **Q3 (Calibration vs. Sharpness):** Model A is always 50% confident and 50% right. Model B is 100% confident, 50% right and 50% wrong. Both have equal average accuracy. Which is better?
  *   **A:** Model A. It knows what it doesn't know (Calibration).
  *   **B:** Model B. It takes useful risks (Sharpness/Resolution).

  **Q4 (Dynamic Justification):** You must pick a rule for changing your mind before you see new data. Does the best rule depend on your starting confidence?
  *   **A:** Yes. The best update depends on where you start (Prior-dependent).
  *   **B:** No. One rule beats all others regardless of where you start (Dominance).

  **Q5 (Evidence Access):** Is your "evidence" only what you can prove to others, or also what you privately feel certain about?
  *   **A:** Only what is objectively true or publicly provable.
  *   **B:** Anything I have internal access to, even if I'm mistaken.

  **Q6 (Strict Properness):** Is it ever rational to report 60% confidence when you feel 70% to get a better score?
  *   **A:** No. You should always report your true confidence.
  *   **B:** Yes. If the scoring rule rewards it, game the system.

  **Q7 (Logical Omniscience):** If your brain is too small to check all your beliefs for contradictions, are you irrational?
  *   **A:** Yes. Rationality requires logical consistency.
  *   **B:** No. Rationality is bounded by your compute limits.

  **Q8 (Risk Profile):** Do you maximize the average score over many possible worlds, or minimize the worst score in any single world?
  *   **A:** Maximize the average (Expectation).
  *   **B:** Minimize the worst case (Robustness/Minimax).

  **Q9 (Permissivism):** Two people see the exact same data. Is it possible both are rational starting from different gut feelings?
  *   **A:** No. The data forces one specific rational conclusion.
  *   **B:** Yes. Multiple starting points can be equally rational.

  **Q10 (Higher-Order Defeat):** You know your reasoning process is flawed in this specific case. Should you trust your conclusion?
  *   **A:** Yes. If the logic holds, the process doesn't matter.
  *   **B:** No. Knowing you might be wrong should lower your confidence.

  ***

  ### The Branching Structure (Axes)

  Do not show this to the audience yet. This is your key to sort their answers into the 8 leaves. We derive five primary axes from the questions above.

  1.  **Penalty Cap (Q1):** Unbounded (A) vs. Bounded (B).
  2.  **Aggregation (Q2):** Separable/Additive (A) vs. Holistic (B).
  3.  **Dynamics (Q4):** Prior-Dependent Expectation (A) vs. Prior-Independent Dominance (B).
  4.  **Risk (Q8):** Expectation (A) vs. Robustness (B).
  5.  **Constraints (Q7 + Q9 + Q10):** Ideal (A/A/A) vs. Bounded/Permissive (B/B/B).

  *Note: Q3, Q5, and Q6 are tie-breakers or secondary descriptors for the leaves below.*

  ***

  ### The 8 Leaves (Views)

  **1. The Coherence Purist**
  *   **Profile:** Q1-A (Unbounded), Q2-A (Separable), Q7-A (Omniscience).
  *   **View:** Accuracy requires probabilistic coherence. If you violate the axioms, there is a possible world where you are less accurate and no world where you are more accurate. They focus on static coherence rather than dynamic updating.
  *   **Label:** **Jim Joyce (Accuracy-Dominance Static)**

  **2. The Expected Accuracy Maximizer**
  *   **Profile:** Q4-A (Prior-Dependent), Q8-A (Expectation), Q7-A (Omniscience).
  *   **View:** You should update by conditionalization because, given your *current* prior, that rule maximizes your expected accuracy. It is consequentialist relative to your starting point.
  *   **Label:** **Hilary Greaves / David Wallace**

  **3. The Dominance Updater**
  *   **Profile:** Q4-B (Dominance), Q8-A (Expectation), Q7-A (Omniscience).
  *   **View:** Updating by conditionalization is required because it accuracy-dominates other rules *regardless* of your prior. They want to derive updating without relying on the specific priors you happen to have.
  *   **Label:** **Rachel Briggs / Richard Pettigrew**

  **4. The Plan Evaluator**
  *   **Profile:** Q4-A (Prior-Dependent), but emphasizes the *plan* over the *moment*. (Distinguished from Leaf 2 by Q10-A: they trust the plan even if local logic wavers).
  *   **View:** You must grade an updating plan against the priors you had *before* you got the evidence. Diachronic rationality is about sticking to the ex-ante optimal plan.
  *   **Label:** **Diachronic Bayesianism (Standard)**

  **5. The Holistic Scorer**
  *   **Profile:** Q2-B (Holistic).
  *   **View:** You cannot score proposition-by-proposition and sum. The inaccuracy of a belief system is a property of the whole distribution. Separability fails to capture logical connections between claims.
  *   **Label:** **Non-Separable Epistemic Utility (e.g., Caie)**

  **6. The Robustness Agent**
  *   **Profile:** Q8-B (Robustness), Q1-B (Bounded).
  *   **View:** Maximizing expected accuracy is too fragile. You should pick a credence that holds up across a range of possible scoring situations or minimizes worst-case regret.
  *   **Label:** **Risk-Weighted / Minimax Epistemology**

  **7. The Permissivist**
  *   **Profile:** Q9-B (Permissive), Q5-B (Internal Evidence).
  *   **View:** Accuracy constraints do not narrow rational priors down to one. Lots of priors tie for accuracy-optimal on the same evidence.
  *   **Label:** **Subjective Bayesian / Permissivism**

  **8. The Bounded Realist**
  *   **Profile:** Q7-B (Bounded Compute), Q1-B (Bounded Penalty).
  *   **View:** Violating the axioms can be accuracy-optimal if you are bounded. Logical omniscience is impossible; demanding it makes the theory useless for real agents.
  *   **Label:** **Bounded Rationality / Logical Non-Omniscience**

  ***

  ### Empty Logical Space

  These are combinations of answers that are logically available but occupied by no major view.

  1.  **Unbounded Penalty (Q1-A) + Bounded Rationality (Q7-B).**
      *   **Status:** **Incoherent.**
      *   **Why:** If you admit agents cannot check for logical consistency (Q7-B), you cannot justify an infinite penalty for logical errors (Q1-A). The penalty presupposes the agent could have known better.
  2.  **Strictly Proper (Q6-A) + Holistic Scoring (Q2-B).**
      *   **Status:** **Mathematically Unattractive / Unexplored.**
      *   **Why:** Constructing a strictly proper scoring rule that is non-separable is extremely difficult and often collapses back into separability or loses the "proper" property. Nobody has successfully built a working system here yet.
  3.  **Dominance Updating (Q4-B) + Permissivism (Q9-B).**
      *   **Status:** **Tension / Unexplored.**
      *   **Why:** If one update rule dominates regardless of priors (Q4-B), it suggests a unique rational response to evidence, which clashes with the idea that multiple priors are permissible (Q9-B). Briggs/Pettigrew argue for dominance, but usually within a framework that constrains priors.

  ***

  ### Indistinguishable Leaves

  These pairs are hard to separate with the current 10 questions.

  **Pair:** **Leaf 2 (Expected Accuracy Maximizer)** vs. **Leaf 4 (The Plan Evaluator)**.
  *   **Why:** Both answer Q4-A (Prior-Dependent) and Q8-A (Expectation). In practice, Greaves (Leaf 2) *is* a Plan Evaluator. The distinction is subtle: Leaf 2 focuses on the *consequentialist derivation*, Leaf 4 focuses on the *temporal evaluation point*.
  *   **The Extra Question:** "You realize mid-stream that your update rule is sub-optimal given your new evidence. Do you switch rules?"
      *   **Leaf 2 (Greaves):** Yes, re-optimize based on current state.
      *   **Leaf 4 (Plan):** No, stick to the ex-ante optimal plan to avoid dynamic inconsistency.

  **Pair:** **Leaf 1 (Coherence Purist)** vs. **Leaf 3 (Dominance Updater)**.
  *   **Why:** Both rely on dominance arguments (Q1-A, Q7-A). Leaf 1 applies it to static states; Leaf 3 applies it to update rules. A static purist might agree with the Dominance Updater's conclusion without caring about the dynamic derivation.
  *   **The Extra Question:** "Is a static set of beliefs that violates probability axioms always less accurate than one that obeys them?"
      *   **Leaf 1:** Yes, always.
      *   **Leaf 3:** (Might say) Not necessarily, if the update rule leading there was dominance-optimal. (This is a nuanced split, but Leaf 1 is the primary home of the static dominance theorem).
