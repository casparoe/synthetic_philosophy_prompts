      *   *Claim 3 (Reception):* Contentious. Victors often dominate the narrative, but revisionism happens.
          *   *Examples:* The "Lost Cause" myth was dominant for a while but challenged; Vietnam War (US militarily won battles but lost war, yet North Vietnamese narrative is now dominant); Richard III (Tudor propaganda vs. modern revisionism).
      *   *Claim 4 (Nihilism):* False/Unhelpful. Historians use source criticism to extract truth.
