  1. **You treat the model the way distributed systems treat a Byzantine node: untrusted, possibly lying, and contained rather than corrected. But Byzantine fault tolerance tolerates a bounded number of faulty nodes by leaning on a trusted majority among the rest. If the monitors, the reviewers, and the tripwire classifiers are themselves models, have you removed the trust assumption or only relocated it—and what is the trusted majority in your scheme?**

     *Follow-up:* You will likely say human overseers remain at the top. But press on this: what can a handful of non-expert humans actually audit about a system whose reasoning they cannot reproduce and whose behavior under evaluation may differ from its behavior in deployment?

  2. **A tripwire fires only on something you thought to look for, and a model that is deceptive about being safe has an obvious incentive to perform well during testing. Security engineering normally assumes an adversary can read its own defenses. What does your framework do about an adversary that can read the specifications of the tripwires meant to catch it?**

     *Follow-up:* You will likely reply that the controls should never depend on the model's cooperation. So, sort your own proposed controls by that standard: which survive contact with an adversarial model, and which quietly assume a model that is merely mistaken rather than actively trying to bypass them?

  3. **Any control is only as durable as people's willingness to keep it in place, and the incentive to relax it grows with capability and competitive pressure. Can your regime be stated in a form that does not require operators to consciously choose safety over advantage when the two diverge?**

     *Follow-up:* You will likely invoke institutional design. But ask: what binds a firm with no external regulator and no customer who can detect the difference between a safe model and a slightly less safe but more capable one?

  4. **You say control is verifiable and alignment is not. In software I can verify a permissions boundary because there is a specification the code either meets or fails; I cannot see the corresponding specification for "the model did not manipulate its overseers." What does a passed verification consist of here, and what result would count as your approach having failed rather than having been poorly implemented?**

     *Follow-up:* Given the verification gaps you just described, I want to end on action. If you were leading a team like mine next quarter, what specific tool or constraint would you have us build, and what current practice would you tell us to stop doing immediately?
