      *   *Level 1: Empirical Underdetermination.* Finite data $\neq$ infinite function. (True, trivial, doesn't kill spec).
      *   *Level 2: Interpretation Regress.* Rules need interpretations, interpretations need rules. (Contested, Wittgenstein's target, but doesn't stop *use*).
      *   *Level 3: No Intrinsic Meaning (Individual).* Mental states don't fix content. (Kripke's skeptic says yes, but this is about *individual* isolation).
      *   *Level 4: No Fact of the Matter (Eliminativism).* There is *no* fact about what anyone means. (Strongest skeptical claim).
      *   *Level 5: The Skeptical Solution.* Meaning is grounded in community agreement/correctness conditions. (This saves meaning).

  4.  **Analyzing Relevance to AI Safety:**
