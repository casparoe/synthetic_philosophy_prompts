prompt: |-
  ok so — I'm in an AI-safety slack and one guy has a move he makes constantly. Any time somebody talks about specifying a goal, or writing down an objective, or corrigibility, he types some version of "Kripkenstein already settled this: no rule pins down its own application." Delivered as a knockdown. Last week he aimed it at someone arguing you could get at least a partial specification of what a system should optimize for, on the grounds that anything we write down admits of a quus-style reinterpretation, so the spec is empty and we should stop pretending otherwise.

  I've read enough Kripke to be anoyed but not enough to say exactly why. Can you give me the menu of distinct precise claims that one sentence could be standing for — starting from the near-trivial point that finitely many past applications underdetermine which function someone is applying, up through the regress-of-interpretations version, the version where no mental state or internal item constitutes meaning, the community/practice version, and the full eliminativist version on which there's no fact at all about what anyone means. For each one: is it true, is it contested, does Kripke's skeptic actually establish it, and — flag the ones his skeptical solution is supposed to block, because that's the bit im fuzzy on. Then, the part I care about: would that reading actually support shutting down the specification project, or would it be consistent with the project going ahead untouched?

  Also give me your best guess at which reading he thinks he has in hand, and then the strongest version of his point that a specification person genuinely has to answer instead of waving off. My hunch is that the only version strong enough to sink specification is one Kripke himself doesn't endorse, and the version he does endorse is orthogonal to the engineering question, but I want that actually checked rather than nodded along to. A numbered list I can paste into the channel is perfect.
