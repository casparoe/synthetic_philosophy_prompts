  2.  **Deconstruct "Kripkenstein" (Kripke on Wittgenstein):**
      *   *The Skeptical Argument:* No fact about an individual (past behavior, mental states, dispositions) fixes what rule they are following (e.g., plus vs. quus).
      *   *The Skeptical Solution:* We don't need truth-conditions for meaning; we need assertability-conditions based on community agreement/practice.
      *   *Common Misuse:* People often take the *Skeptical Argument* (meaning is impossible) as the conclusion, ignoring the *Skeptical Solution* (meaning is social/practical). Or they apply the individual skepticism to formal systems where community practice isn't the relevant metric.

