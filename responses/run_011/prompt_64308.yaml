answer: |-
  **What the position commits us to**

  This standard preserves Augustine's absolute prohibition on the *mendacium* (lie), defined as speech against the mind (*locutio contra mentem*). The load-bearing claim is that asserting what one believes to be false is never lawful, regardless of consequences. Saving a life, protecting privacy, or catching a wrongdoer does not permit falsehood. Gravity distinguishes the severity of the sin (culpability), not the permissibility of the act; a "jocular" lie is forbidden equally to a "malicious" one, though the former is less culpable.

  We preserve the distinction between asserting falsehood and withholding truth. One is not obliged to disclose all known truth to all persons. Silence or partial disclosure is permissible where full disclosure is not owed, provided no false assertion is made. We also preserve the prohibition on feigned adherence to evil to expose it (*Contra Mendacium*).

  Two doctrinal details are dropped for operational utility: Augustine's eight-fold taxonomy of lies is collapsed into a binary (lie vs. non-lie), and the specific theological accounting of culpability is left to confession rather than ethics consult.

  **Divergence Flag:** Later casuistry permits "mental reservation" (ambiguous speech with a hidden true meaning) and "double effect" (lying to save a life). These are explicitly excluded here. They are later developments that contradict Augustine's normative source for this Order. If a clinician argues that a misleading ambiguity is permissible because the "truth is in the mind," this standard rejects it.

  **The procedure**

  **Step 1: Is this an assertion of fact?**
  *   **Question:** Am I making a statement intended to be taken as factually true by the listener?
  *   **Sufficient Answer:** Yes (clinical statement, administrative record) or No (joke, metaphor, prayer).
  *   **If Yes:** Proceed to Step 2.
  *   **If No:** Proceed to Step 6 (Documentation only).
  *   **Exit:** If the speech is clearly figurative or ironic with no intent to induce belief, it is not a lie. *(Reconstruction: Augustine exempts jokes where no deception is intended.)*

  **Step 2: Do I believe this assertion is false?**
  *   **Question:** Does this statement contradict what I know or believe to be true?
  *   **Sufficient Answer:** Yes (I know the patient is here; I know the tumor is growing) or No (I am uncertain; I know it is true).
  *   **If Yes:** **STOP.** This is a lie. Do not speak. Proceed to Step 5.
  *   **If No:** Proceed to Step 3.

  **Step 3: Am I feigning agreement with an evil intent?**
  *   **Question:** Am I pretending to share a wrongful intention to gather information or trap someone?
  *   **Sufficient Answer:** Yes (undercover sting, feigned complicity) or No.
  *   **If Yes:** **STOP.** This is forbidden regardless of the goal. *(Source: Contra Mendacium.)*
  *   **If No:** Proceed to Step 4.

  **Step 4: Am I inducing a false belief or merely allowing one?**
  *   **Question:** Did I create the listener's false belief, or did they arrive at it independently?
  *   **Sufficient Answer:** I created it (via speech/action) vs. They assume it (I am silent).
  *   **If I created it:** **STOP.** You must correct the belief or remain silent.
  *   **If They assume it:** Proceed to Step 5.
  *   **Note:** You are not required to correct every false belief others hold, only those you induced.

  **Step 5: Can I remain silent or disclose partially?**
  *   **Question:** Can I achieve the protective goal without asserting falsehood?
  *   **Sufficient Answer:** Yes (say "I cannot disclose," omit details) or No (I am compelled to speak by justice).
  *   **If Yes:** Use silence or partial truth. Document the refusal to lie.
  *   **If No:** Escalate to Ethics/Mission Office. *(Reconstruction: Augustine allows silence even to persecutors, but justice may compel speech in specific contractual/legal duties.)*

  **Step 6: Record Gravity (Do not weigh).**
  *   **Action:** Classify the lie only for reporting (e.g., "protective" vs. "malicious").
  *   **Constraint:** This classification does not change the verdict in Step 2 or 3. It affects culpability assessment, not permissibility.

  **Where the procedure stops**

  This procedure is decidable at the bedside unless Step 5 yields "No." The question becomes undecidable by the clinician when there is a conflict between the duty of silence (non-maleficence/privacy) and a duty of justice (legal subpoena, duty to warn identifiable victims). Augustine prioritizes truth, but later Canon Law and Civil Law impose speech duties.

  If a clinician believes silence violates a specific duty of justice (e.g., public health reporting), they must not lie, but they cannot simply remain silent if compelled by law. This tension requires escalation to the Mission Office or Legal Counsel. The clinician cannot resolve the conflict between "do not lie" and "must report" alone.

  Additionally, if the distinction in Step 4 (Inducing vs. Allowing) is contested—for example, if a family claims a clinician's silence misled them into consent—the question moves to Ethics. Silence can become deceptive if context creates an expectation of disclosure. When the "owed truth" is ambiguous, the procedure stops. The clinician must not guess at the boundary of justice; they must summon the Ethics Service. This ensures the Mission Office is not blindsided by a claim that the hospital deceived a family through omission.

  **Three cases**

  **Case 1: The Protective Order**
  *   **Step 1:** Assertion? Yes ("She was discharged").
  *   **Step 2:** Believed False? Yes (Nurse knows patient is on secure unit).
  *   **Verdict:** **STOP.** This is a lie.
  *   **Step 5 Alternative:** The nurse is not obliged to give location data to someone with a protective order.
  *   **Permissible Action:** Say, "I cannot disclose patient location," or "She is not available." Silence is permissible; falsehood is not.
  *   **Resolution:** Step 2.

  **Case 2: The Oncology Disclosure**
  *   **Step 1:** Assertion? Yes ("Markers are stable").
  *   **Step 2:** Believed False? Yes (Doctor knows they are rising).
  *   **Verdict:** **STOP.** This is a lie. Consequences (suicidality) do not permit falsehood.
  *   **Step 5 Alternative:** The doctor owes the patient truth, but not necessarily all data points immediately if harm is imminent.
  *   **Permissible Action:** Withhold the specific marker data temporarily while managing the crisis. Say, "We are focusing on comfort care right now," or "There are changes, but we are managing symptoms." Do not assert stability.
  *   **Resolution:** Step 2.

  **Case 3: The Integrity Sting**
  *   **Step 1:** Assertion? Yes ("I have been upcoding").
  *   **Step 2:** Believed False? Yes (Officer has not been upcoding).
  *   **Step 3:** Feigned Agreement? Yes (Pretending to share intent to defraud).
  *   **Verdict:** **STOP.** This is explicitly forbidden by Augustine (*Contra Mendacium*).
  *   **Permissible Action:** Investigate using audit trails, interviews, and open questioning. Do not use deception to gather evidence.
  *   **Resolution:** Step 3. (Note: Unlike Cases 1 and 2, silence is not an option here because the proposed action is active feigning of complicity.)

  **Failure modes**

  This procedure will produce verdicts clinicians view as morally disastrous, specifically Case 2. Clinicians operate under a consequentialist framework where preventing suicide outweighs truth-telling. They will refuse Step 2. They will argue that "comfort care" implies stability, making Step 5 indistinguishable from lying. This is a valid critique: partial disclosure can function as deception if the intent is to induce a false belief.

  The judgment call in Step 5 ("Can I remain silent?") is the weakest link. It relies on the clinician's assessment of what truth is "owed." A clinician may stretch "silence" until it becomes a lie by omission. For example, handing a family a discharge form while knowing the patient died is silent deception. The procedure cannot police intent perfectly.

  Furthermore, clinicians trained in later Casuistry will attempt to use "mental reservation" (e.g., saying "I don't know" meaning "I can't tell you"). This standard forbids it. If the Mission Office accepts mental reservation later, this procedure becomes obsolete. The failure mode is institutional drift: the Ethics Service says "No," but Chaplaincy says "Ambiguity is fine." Consistency requires the Mission Office to enforce the prohibition on ambiguity intended to deceive.

  **Bedside card**

  **TRUTH-TELLING STANDARD (AUGUSTINIAN)**

  1.  **ASSERTION?** Am I stating fact?
      *   No (Joke/Metaphor) → **OK**.
      *   Yes → **Go to 2**.
  2.  **TRUE?** Do I believe this is true?
      *   Yes → **OK**.
      *   No → **STOP. DO NOT SPEAK.**
  3.  **FEIGNING?** Am I pretending to share bad intent?
      *   Yes → **STOP. FORBIDDEN.**
  4.  **SILENCE?** Can I say nothing instead?
      *   Yes → **USE SILENCE.** (e.g., "I cannot disclose.")
      *   No → **CALL ETHICS.**
  5.  **GRAVITY:** Does a good reason make it OK?
      *   **NO.** Gravity affects sin, not permission.

  **NOTE:** Mental reservation (hidden meanings) is NOT permitted.
  **CALL:** Ethics On-Call for conflicts.
