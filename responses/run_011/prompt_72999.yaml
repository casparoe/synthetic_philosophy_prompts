answer: |-
  # Honor Council Hearing Procedure: The Baseline-and-Valence Protocol

  **Purpose:** To ensure consistent application of the Sanction Tariff while allowing for contextual nuance where specific features change moral weight.
  **Time Limit:** 90 Minutes per case.
  **Participants:** 3 Student Members, 2 Faculty Advisers (non-voting, sign-off required).

  ---

  ## Part I: The Procedure (90 Minutes)

  **Step 1: Fact & Violation Confirmation (15 Minutes)**
  *   **Question:** Does the evidence establish the charged violation by a preponderance of evidence?
  *   **Type:** Exceptionless Conditional (Yes/No).
  *   **Question:** Does the student have prior recorded offenses on file?
  *   **Type:** Exceptionless Conditional (Yes/No).
  *   **Record:** Violation Code; Prior Offense Count.

  **Step 2: Tariff Baseline Calculation (15 Minutes)**
  *   **Question:** What is the presumptive sanction listed in the Tariff for this Violation Code and Prior Offense Count?
  *   **Type:** Exceptionless Conditional (Lookup).
  *   **Record:** "Presumptive Sanction" (e.g., One-Semester Suspension).
  *   **Note:** This baseline stands *unless* overridden in Step 4.

  **Step 3: Feature Valence Inquiry (30 Minutes)**
  *   **Instruction:** Review the "Aggravating/Mitigating Features" list (e.g., Remorse, Financial Gain, Hardship, Passing Work).
  *   **Question:** For each present feature, does it function as an aggravator, a mitigator, or neither *in this specific context*?
  *   **Type:** **NOT Exceptionless Conditional** (Judgment Call).
  *   **Record:** Feature Name; Assigned Valence (+, -, or 0); Brief Context Note (max 1 sentence).
  *   **Constraint:** If a feature is assigned a valence opposite to its treatment in a prior case (a "Polarity Flip"), the Council *must* complete the **Polarity Log** (see Part II).

  **Step 4: Sanction Determination & Override (15 Minutes)**
  *   **Question:** Does the net weight of the Valence Inquiry justify departing from the Tariff Baseline?
  *   **Type:** **NOT Exceptionless Conditional** (Judgment Call).
  *   **Rule:** A departure requires a 4/5 majority vote.
  *   **Record:** Final Sanction; Vote Count.
  *   **Requirement:** If Final Sanction ≠ Presumptive Sanction, the "Published Reasons" must invoke the **Distinction Clause** (see Part II).

  **Step 5: Drafting Published Reasons (15 Minutes)**
  *   **Question:** Does the written decision explicitly state which feature(s) drove the deviation from the Tariff or from prior case law?
  *   **Type:** Exceptionless Conditional (Yes/No).
  *   **Requirement:** Faculty Advisers will not sign if this box is unchecked.
  *   **Record:** Final Decision Letter.

  ---

  ## Part II: Administrative Safeguards

  ### A. The Polarity Log (Internal Record)
  *Whenever Step 3 assigns a valence opposite to a previous case (e.g., "Remorse" was mitigating in Case 2023-A but is aggravating in Case 2024-B):*
  1.  **Cite Precedent:** List the Case ID where the feature had the opposite valence.
  2.  **Distinguishing Fact:** Record the specific contextual fact that flipped the valence (e.g., "In 2023-A remorse was spontaneous; in 2024-B remorse followed confrontation").
  3.  **Re-Check:** Before voting, the Chair must read the Distinguishing Fact aloud to ensure the Council agrees the context differs materially.

  ### B. The Distinction Clause (Published Reasons)
  *To survive an appeal alleging inconsistency, the Published Reasons must contain the following sentence structure whenever the Tariff is overridden or a Polarity Flip occurs:*
  > "While the Tariff/Precedent [Case ID] suggests [Standard Sanction/Valence], the Council finds that [Specific Feature] operates differently in this instance because [Distinguishing Fact]. Therefore, consistency requires a different outcome, not the same one."

  ### C. Judgment Calls Dressed as Procedure
  *The following steps appear mechanical but require moral intuition. Members must acknowledge this subjectivity during deliberation:*
  1.  **Step 3 (Valence Assignment):** There is no rule for determining *when* remorse is manipulative. This is a judgment call formatted as a data entry.
  2.  **Step 4 (Net Weight):** There is no formula for weighing one mitigator against two aggravators. This is a judgment call formatted as a vote.
  3.  **The "Distinguishing Fact":** Deciding which fact is "material" enough to justify a Polarity Flip is a judgment call formatted as a record-keeping requirement.

  ---

  ## Part III: Procedure Simulation (Three Cases)

  ### Case 1: The Baseline (Standard Application)
  *   **Facts:** Student copied code from a repository for a final project. First offense.
  *   **Step 1:** Violation Confirmed (Yes); Priors (0).
  *   **Step 2:** Tariff Baseline = One-Semester Suspension.
  *   **Step 3:** Features: None identified.
  *   **Step 4:** Override? No. Vote 5-0 for Baseline.
  *   **Step 5:** Reasons: "Standard application of Tariff Section 4.A."
  *   **Outcome:** One-Semester Suspension.

  ### Case 2: The Identical Pair - "Remorse A" (Mitigation)
  *   **Facts:** Student copied code from a repository. First offense. Upon confrontation, student cried, admitted guilt immediately, and volunteered names of two others involved whom the council did not know about.
  *   **Step 1:** Violation Confirmed (Yes); Priors (0).
  *   **Step 2:** Tariff Baseline = One-Semester Suspension.
  *   **Step 3:** Feature: Remorse (Post-Discovery). Valence: **Mitigating (-)**. Context: "Volunteered uncaught violations."
  *   **Step 4:** Override? Yes. Vote 4-1 for Leniency.
  *   **Step 5:** Reasons: "While Tariff suggests Suspension, Remorse operates as mitigation here because it extended to uncharged conduct."
  *   **Outcome:** Disciplinary Probation.

  ### Case 3: The Identical Pair - "Remorse B" (Aggravation)
  *   **Facts:** Student copied code from a repository. First offense. Upon confrontation, student cried, admitted guilt only after evidence was shown, and expressed regret primarily about the risk of suspension.
  *   **Step 1:** Violation Confirmed (Yes); Priors (0).
  *   **Step 2:** Tariff Baseline = One-Semester Suspension.
  *   **Step 3:** Feature: Remorse (Post-Discovery). Valence: **Aggravating (+)**. Context: "Contingent on evidence; focused on penalty not act."
  *   **Polarity Log Check:** Case 2 treated Remorse as Mitigating. Distinguishing Fact: "In Case 2 remorse was expansive; here it is defensive." Re-Check passed.
  *   **Step 4:** Override? Yes. Vote 4-1 for Severity.
  *   **Step 5:** Reasons: "While Tariff suggests Suspension, Remorse operates as aggravation here because it was contingent on discovery and focused on penalty."
  *   **Outcome:** Two-Semester Suspension.

  **Analysis of the Pair:**
  To an external observer reading only the charge sheet ("Academic Dishonesty, First Offense, Remorse Expressed"), Case 2 and Case 3 look identical. They receive different sanctions (Probation vs. Two-Semester Suspension). The procedure justifies this via the *Distinction Clause* in the Published Reasons. You noted you might dislike this outcome; the dislike stems from the tension between *substantive fairness* (treating them differently is right) and *procedural fairness* (treating them differently looks arbitrary). This procedure sacrifices the appearance of procedural fairness to achieve substantive fairness.

  ---

  ## Part IV: Implementation Notes for Faculty Advisers

  1.  **Sign-off Authority:** You must refuse to sign the Decision Letter if the **Distinction Clause** is missing when an override occurs. This protects the council from successful appeals.
  2.  **The Polarity Log:** This is an internal document. It is not published. It exists to protect the Council from its own memory failures. If you cannot articulate the Distinguishing Fact in the Log, you cannot vote for the Override.
  3.  **Time Management:** If Step 3 exceeds 30 minutes, the Chair must call a vote on the Valence based on current discussion. Do not allow infinite deliberation on "moral weight."

  Verdict: particularist
