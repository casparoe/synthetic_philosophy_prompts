          *   Specify what to record/re-check when a feature flips polarity.
          *   Specify when the tariff can be overridden and what the published reasons must say to survive appeal.
          *   Identify which steps are judgment calls dressed as procedure.
          *   Run the procedure on three cases (including one pair that looks identical but gets different outcomes).
          *   End with a single line: "Verdict: [generalist/particularist]".

  2.  **Deconstruct the Philosophical Standoff:**
      *   *Generalism:* Rules apply universally. Consistency = Justice. Predictability is key.
      *   *Particularism:* Context determines moral weight. No feature (like "remorse") is always good or bad. Wisdom > Rules.
      *   *The Challenge:* Create a *procedure* (which implies rules/generalism) that accommodates *particularism* (context sensitivity) without collapsing into arbitrariness (which violates the charter).
      *   *Solution Strategy:* A "Presumptive Tariff with Contextual Override." The tariff provides the baseline (satisfying generalists), but the procedure mandates a specific inquiry into valence (satisfying particularists). The "published reasons" requirement is the safety valve for appeals.

