answer: |-
  The Principle of Alternative Possibilities (PAP) states that an agent is morally responsible for what they have done only if they could have done otherwise. For decades, this principle served as a cornerstone for incompatibilist theories of free will, suggesting that determinism undermines responsibility precisely because it eliminates alternative possibilities. Harry Frankfurt sought to topple this cornerstone by constructing cases where an agent appears clearly responsible despite having no alternative options. The standard Frankfurt case involves a counterfactual intervener (Black) who monitors the agent (Jones) and stands ready to force the action if Jones shows signs of hesitating. If Jones acts on his own, Black does nothing. Jones is responsible, the argument goes, even though he could not have done otherwise.

  The dispute described here concerns a novel variant of this setup, one that replaces the neural monitor with a mechanical lock on the completion of an action. In this "Infusion Case," Jones must hang a poison bag and let it run. Black's device does not monitor Jones's mind; it monitors the act itself. Once Jones begins hanging the bag, a timer starts. If the timer reaches zero before Jones stops, the device locks his motor functions, ensuring the infusion completes. The variable in dispute is the length of the "abort window"—the time Jones has to change his mind after starting but before the lock engages.

  The interlocutors in this dispute represent two distinct philosophical intuitions. The Friend argues that only Window D (zero time) constitutes a genuine Frankfurt case, while Windows A, B, and C are ordinary scenarios where Jones retains alternatives. The Friend maintains that because the actual sequence of events is identical across all four windows, the verdict on responsibility must be identical; the shrinking window is cosmetic. The User argues that the slider reveals robust alternatives to be a matter of degree, challenging the binary nature of PAP. If there is no principled cutoff between having an alternative and lacking one, the Frankfurtian cannot isolate the counterexample.

  This essay adjudicates that dispute. It will argue that the Friend is correct regarding the ultimate falsity of PAP, but incorrect in dismissing the moral significance of the abort window. The User is correct that the window is not cosmetic, but incorrect that this saves PAP. The Infusion Case demonstrates that responsibility tracks the actual sequence of agency, not the presence of alternatives, but it also reveals that the *value* of alternatives lies in mitigation, not attribution.

  ### The Frankfurt Burden and the Family of Cases

  To adjudicate this dispute, we must first be precise about what a Frankfurt-style case must accomplish. It is not enough to show that an agent lacks alternative possibilities. A prisoner in a locked cell lacks alternative possibilities but is not responsible for staying in his cell. To refute PAP, a case must show that an agent lacks alternative possibilities *and* is nevertheless morally responsible. The burden is to decouple responsibility from the ability to do otherwise.

  In the Infusion family, we must identify where this burden is met. In Window A (five minutes), Jones hangs the bag and has five minutes to remove it. He does not. He clearly possesses the physical and volitional capacity to prevent the death. If PAP is true, Jones is responsible in Window A *because* he could have done otherwise. In Window D (zero time), the lock engages the instant the bag is hung. Jones physically cannot stop the infusion once the act begins. If Jones is responsible in Window D, PAP is false, because he is responsible despite lacking the ability to prevent the outcome.

  The Friend claims that only D refutes PAP, while A, B, and C are padding. This is technically correct regarding the *logic* of the refutation. A Frankfurt case requires the absence of alternatives. Window A possesses alternatives; therefore, Window A is not a counterexample to PAP. It is a confirmation of PAP. However, the Friend's claim that the verdict on responsibility must be identical across all four cases is the crux of the matter. If Jones is responsible in D (no alternatives) and also responsible in A (alternatives present), then the *possession* of alternatives is not a necessary condition for responsibility. The Friend's "Actual Sequence" claim—that responsibility depends on how the action was produced, not on what else might have happened—is the engine of the Frankfurt argument. The User's objection is that if the verdict is identical, the alternatives in A are shown to be morally irrelevant, which seems counterintuitive.

  ### Desisting Mid-Action as "Doing Otherwise"

  A critical objection arises regarding the nature of the alternative possibility in Windows A, B, and C. The Friend suggests that by the time the window opens, Jones has already formed his intention and begun the attempt. What the window offers is not an alternative action but an alternative completion. Does voluntary abandonment count as "doing otherwise" in the sense PAP requires?

  PAP is typically formulated regarding the action for which the agent is blamed. If Jones is blamed for *murder*, the relevant alternative is *not murdering*. If Jones hangs the bag and lets it run, he murders. If he hangs the bag and then removes it, he does not murder (though he may have attempted to). Therefore, the ability to remove the bag is the ability to avoid the outcome for which he is held responsible.

  The Friend might argue that the moral core of the action is the *decision* to kill, which occurs before the bag is hung. On this view, the abort window is merely damage control. However, this conflates the formation of intent with the execution of harm. Our moral practices distinguish sharply between attempted murder and completed murder. The difference in blame is often grounded in the difference in outcome, but also in the agent's relationship to that outcome during the act. Voluntary abandonment is a recognized locus of diminished blame and, in some legal frameworks, a defense.

  If desisting mid-action counts as "doing otherwise," then in Windows A and B, Jones *can* do otherwise. He can prevent the death. The Friend's claim that the actual sequence is identical is true regarding the *completion* of the crime, but false regarding the *opportunity structure* surrounding it. In A, the opportunity to avoid the crime persists into the action. In D, it vanishes at the onset.

  This distinction matters for PAP. If PAP requires the ability to avoid the *outcome*, then Jones has AP in A and lacks AP in D. If Jones is responsible in both, PAP is refuted by D. The User's worry is that this makes the five-minute window in A morally inert. If Jones is just as responsible in A as in D, then his ability to stop didn't matter. This leads to the User's stronger claim: that robust alternatives make no difference to responsibility whatsoever. This is indeed a strong thesis, but it is not indefensible. It implies that alternatives are not the *ground* of responsibility, but perhaps a *condition* of fairness that is satisfied easily. However, the more precise conclusion is that alternatives are not necessary for responsibility, even if their presence affects the *degree* of blame.

  ### Robustness, Degrees, and the Binary Principle

  The User's central argument relies on the "slider." In Window A, the alternative is robust: Jones has five minutes to reflect, call for help, or physically intervene. In Window B (five seconds), the alternative is strained but possible. In Window C (fifty milliseconds), the alternative is theoretically open but physiologically impossible to execute. In Window D, it is closed.

  The User argues that robustness is a matter of degree, whereas PAP is a binary principle (you either could or could not). If robustness admits of degrees, PAP faces a sorites problem. Where is the cutoff? If there is no principled cutoff, the Frankfurtian cannot say which cases refute PAP.

  We must decide whether the windows in A, B, and C are robust alternatives. A robust alternative is generally defined as one that is voluntarily accessible and would result in the agent not being responsible for the outcome. In Window A, the alternative is robust. In Window B, it is borderline; a highly disciplined agent might stop, but most would not. In Window C, it is nominal only; no human can form and execute an intention in fifty milliseconds.

  Does robustness admit of degrees? Yes, clearly. The *ease* of accessing an alternative varies. But PAP does not ask "How easy was it to do otherwise?" It asks "Could you have done otherwise?" This is a binary question. However, the *ability* to do otherwise is constrained by physiology. If the window is shorter than the human reaction time, the answer to "Could you?" is "No."

  This suggests a principled cutoff exists between Window B and Window C. The cutoff is not arbitrary; it is grounded in human neurophysiology. If the window is shorter than the minimum time required to initiate a veto signal (roughly 150-200 milliseconds), the agent literally cannot stop. Thus, Window C is functionally identical to Window D. Window A and B are functionally different.

  If robustness is graded, what becomes of PAP? If PAP is stated with a threshold (e.g., "could have done otherwise within normal reaction time"), it survives the slider. However, the User's deeper point is that if responsibility remains constant as the window shrinks from A to D, then the *degree* of robustness does not track the *degree* of responsibility. If Jones is fully responsible in A (high robustness) and fully responsible in D (zero robustness), then robustness is irrelevant to the *existence* of responsibility. It may be relevant to the *severity* of blame, but not to the binary attribution of responsibility. This supports the Friend's Actual Sequence view: what makes Jones responsible is that he acted on his own desires, not that he had a backup plan.

  ### The Trigger Dilemma

  Standard Frankfurt cases face a famous dilemma regarding the trigger mechanism. To ensure Jones cannot do otherwise, Black must intervene if Jones is about to choose differently. But how does Black know?
  1.  If Black monitors a prior neural sign that is causally sufficient for the choice, then determinism is true, and incompatibilists will argue Jones isn't responsible for reasons unrelated to PAP.
  2.  If the sign is not causally sufficient, Jones could have chosen differently without triggering Black, meaning Jones *could* have done otherwise, and PAP is not refuted.

  The Infusion Case attempts to escape this dilemma by triggering the device on *overt behavior* (hanging the bag) rather than a neural precursor. Does this escape the dilemma?

  It escapes the *prior* sign worry. The device does not determine Jones's decision to start. Jones is free to walk away before touching the bag. The intervention only secures the *completion*. This respects the incompatibilist's demand that the initial choice be free. However, it inherits a "simultaneous" dilemma. If the lock engages instantly (Window D), is Jones free to *complete* the act? He is free to start, but not to stop.

  For the incompatibilist, freedom requires the ability to do otherwise at the time of action. If the action is "poisoning the partner," and that action is temporally extended, the inability to stop mid-stream restricts freedom. However, the Frankfurtian argues that this restriction is counterfactual. In the actual sequence, Jones never tries to stop. The device never activates. The restriction exists only in the counterfactual sequence where Jones tries to abort.

  By triggering on overt behavior, the case relocates the dilemma rather than solving it. The question becomes: Does the *guarantee of completion* undermine responsibility for the *initiation*? If I know I cannot stop once I start, am I free to start? Most intuitions suggest yes. I can freely commit to a course of action that I know will become irreversible. Driving onto a one-way bridge is free, even if turning back is impossible once committed. Thus, the trigger mechanism succeeds in isolating the lack of alternatives to the *completion* phase without undermining the freedom of the *initiation*. This strengthens the Frankfurt conclusion: Jones is responsible for the killing because he freely initiated the irreversible process, not because he could have stopped it.

  ### The Sorites Charge

  The User presses a Sorites charge: if there is no principled cutoff between responsibility-preserving and responsibility-destroying interference, the Frankfurtian is in trouble. If the window shrinks by one millisecond at a time, when does Jones lose responsibility?

  I argue this is fatal to neither party, provided we accept the physiological threshold mentioned earlier. Vagueness is a feature of many moral concepts (e.g., "heap," "bald," "coercion"). It does not invalidate the concept unless it prevents us from identifying clear cases. Window A is a clear case of having alternatives. Window D is a clear case of lacking them. The boundary between B and C is vague, but the endpoints are not.

  The Friend claims the shrinking window is cosmetic because the actual sequence is identical. The User claims it cannot be cosmetic because it changes the modal status of the agent. Both are partially right. It is not cosmetic regarding *opportunity*, but it is cosmetic regarding *causation*. In all four cases, the cause of the death is Jones's will, not Black's device. The device is a backup that never fires.

  Is a vague boundary fatal to PAP? If PAP requires a sharp binary distinction, and "ability" is vague, then PAP is imprecise. But this is a problem for PAP, not for the Frankfurt case. The Frankfurt case exploits the clear end of the spectrum (Window D). The existence of a gray area (Window B/C) does not invalidate the counterexample found at the extreme. The User is right that the slider complicates the picture, but wrong that it dissolves the refutation. The refutation stands on Window D. Window A merely shows that when alternatives *are* present, responsibility is also present. This correlation does not prove causation.

  ### Coherence of the Device

  We must test the coherence of the case itself. A device that removes the capacity to stop while leaving the capacity to continue may be conceptually unstable. Is "continuing" distinct from "not stopping"? In a temporally extended act, yes. One can be committed to a flow of action. Consider a ratchet mechanism: you can push the lever forward, but you cannot pull it back. This is physically coherent.

  Philosophically, the worry is that if Jones cannot stop, he is not acting voluntarily during the locked phase. He is being moved by the device. If so, he is not responsible for the completion, only the initiation. But the death is caused by the completion. If Jones is only responsible for the attempt, the Frankfurt refutation fails (since he could have avoided the attempt).

  To repair this, we must define the action as "setting the poison in motion." Once the bag is hung and the flow starts, the causal chain is established. The device ensures the chain is not broken. Jones is responsible for establishing the chain. The fact that he cannot break it later does not absolve him of establishing it, provided he knew the nature of the act. The repair is to emphasize Jones's knowledge of the device. If Jones knows the device locks him in, his decision to start is a decision to finish. This integrates the locked phase into his voluntary agency. He authors the entire sequence by authoring the start, knowing the end is guaranteed. This repair preserves the verdict: Jones is responsible for the death.

  ### Verdict on the Principle of Alternative Possibilities

  We arrive now at the final verdict. The dispute hinges on whether the Infusion Case successfully severs the link between responsibility and alternative possibilities.

  The Friend argues that PAP is refuted by Window D and that the Actual Sequence view explains responsibility across all four windows. The User argues that the slider shows alternatives are a matter of degree, and that equating A and D implies alternatives make no difference, which is untenable.

  I conclude that **PAP is false**, but the User's intuition about the "slider" reveals a necessary refinement to the Frankfurt conclusion.

  PAP is false because Window D describes a scenario where Jones is intuitively responsible despite lacking the ability to prevent the outcome. The Actual Sequence view is correct: responsibility is grounded in the actual causal history of the action (Jones's own will), not in the modal landscape of what else might have happened. The fact that Jones acted on his own desires, without coercion or intervention, is sufficient for responsibility.

  However, the User is correct that the window is not "cosmetic." While the *attribution* of responsibility (whether Jones is blameworthy at all) remains constant across the four cases, the *degree* of blameworthiness and the *nature* of the excuse potential do not. In Window A, Jones has a robust opportunity to mitigate harm. His failure to take it confirms his malice. In Window D, he lacks that opportunity. While he is still responsible for the killing, the moral landscape is different. The Friend is wrong to dismiss the difference between A and D as merely padding. It is not padding for the *refutation* of PAP, but it is significant for moral theory.

  The User's worry that "robust alternatives make no difference" is based on a conflation of *necessary conditions* with *mitigating factors*. That alternatives are not *necessary* for responsibility (as D shows) does not mean they make *no difference* to the moral quality of the situation. They differ in their normative force. In Window A, Jones's failure to stop is an additional moral failure (a failure of rescue). In Window D, it is not. But both are failures of *initiation*. Since the initiation is identical and free in all four cases, the core responsibility is identical.

  Therefore, the Frankfurt project succeeds. PAP is false. The Infusion Case, specifically Window D (and functionally C), demonstrates that an agent can be responsible for an outcome they could not have prevented, provided they voluntarily initiated the causal chain leading to that outcome. The slider does not save PAP; it merely maps the boundary of human capacity. The cutoff between B and C is physiological, not metaphysical, and once that threshold is crossed, the alternative possibility vanishes. Since responsibility remains, PAP must be abandoned.

  The Friend is right about the verdict: Jones is responsible in all four cases, and PAP is refuted by D. The User is right about the nuance: the window is not cosmetic regarding the *opportunities* Jones possesses, only regarding the *source* of his agency. But since responsibility tracks the source, not the opportunities, the Friend's conclusion holds. The Principle of Alternative Possibilities cannot withstand the pressure of the Actual Sequence. We are responsible for what we do, not for what we might have done instead.

  **Verdict:** PAP is false. Responsibility supervenes on the actual sequence of agency. The "Abort Window" variant confirms that while the *availability* of alternatives varies by degree, the *necessity* of alternatives for responsibility is nil. The Friend wins the dispute on the central claim, though the User correctly identifies that the moral significance of alternatives lies in mitigation, not attribution.
