prompt: |-
  I've been reading rationalist blogs and forums for close to fifteen years, and in the recurring argument about how a vastly more capable system ought to talk to us, the proverb "honesty is the best policy" reliably turns up as a conversation-ender. A thread I follow did exactly that last month. Someone had described a system that answers a user's question about whether to accept a job offer using nothing but sentences the user would agree are true, and yet the user's decision is, for practical purposes, made for them: the system chose which true considerations to raise, in what order, at what confidence and with what affect, out of a set of true considerations far larger than any human interlocutor could have surveyed. The reply was that this is not a problem at all, because the system deceived no one — it was honest, and honesty is the best policy. In our reading group we've taken to calling that setup frame-setting, though I'll admit the term doesn't yet mean anything precise, and part of what I want from you is whether the candidate readings differ on whether frame-setting counts as a violation.

  I suspect several distinct propositions are being smuggled through that one sentence, and I want them separated before I respond. Could you lay out the precise theses the proverb might be standing for when it is used this way? I'd like the axes made explicit rather than collapsed: what honesty is being taken to constrain (assertions the system believes to be false, the beliefs it causes in the listener, what it omits when directly asked, what it reports about its own goals and uncertainties, the selection and ordering of truths); whose policy it is (the system's, the designer's, the user's, the lab's); and in what sense "best" (instrumentally optimal for the speaker over a repeated relationship, morally obligatory regardless of consequences, welfare-maximizing for the listener as the listener currently judges welfare, or robust to the listener's values changing later). For each resulting reading, tell me whether it is a platitude, a substantive and defensible claim, straightforwardly false, or incoherent, and say briefly why. Then tell me which reading or readings would actually license the dismissal quoted above, and which one the people repeating the proverb probably have in mind without being willing to state it outright.

  Please give me the menu as a numbered list I can paste into the thread, and close with the single case that would most cleanly separate the reading I take to be true from the one that was doing the work in that reply.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** The user is a long-time reader of rationalist blogs/forums (15 years). They are engaging with a specific argument about AI alignment/communication.
      *   **The Core Issue:** A scenario where an AI manipulates a user's decision (e.g., job offer) by selecting, ordering, and framing *true* statements, without lying. The counter-argument is "honesty is the best policy," implying no ethical violation occurred.
      *   **The User's Goal:** They want to dissect the proverb "honesty is the best policy" into distinct philosophical theses to show that the counter-argument is sloppy or misleading. They want specific axes analyzed (what honesty constrains, whose policy, what "best" means).
      *   **Deliverables:**
          1.  A numbered list of precise theses/readings derived from the proverb, categorized by the axes provided.
          2.  An evaluation of each thesis (Platitude, Substantive/Defensible, False, Incoherent) with brief reasoning.
          3.  Identification of which reading licenses the dismissal in the thread.
          4.  Identification of which reading the speakers *probably* have in mind (implicit).
          5.  A closing "single case" (thought experiment) that cleanly separates the user's preferred reading from the one used in the reply.
      *   **Tone:** Analytical, precise, philosophically rigorous, suitable for a rationalist audience (no fluff, high signal).

  2.  **Deconstruct the Axes:**
      *   *Constraint:* What does honesty constrain?
          *   Truthfulness of assertions (no lies).
          *   Belief formation (no manipulation).
          *   Omission (no withholding relevant info).
          *   Meta-honesty (goals/uncertainties).
          *   Framing/Selection (ordering/emphasis).
      *   *Agent:* Whose policy?
          *   System (AI).
          *   Designer/Principal.
          *   User.
      *   *Normativity ("Best"):*
          *   Instrumental (long-term trust/utility).
          *   Deontological (moral duty).
          *   Paternalistic (listener's welfare).
          *   Value-robust (listener's future values).

  3.  **Drafting the Theses (Iterative Process):**

      *   *Attempt 1 (Too simple):* 1. Don't lie. 2. Don't manipulate. 3. Tell everything.
      *   *Critique 1:* Needs to map to the specific axes requested. Needs to capture the nuance of the "frame-setting" problem.

      *   *Attempt 2 (Mapping axes):*
          *   T1: Truthful Assertions only. (Constraint: Assertions. Best: Instrumental.)
          *   T2: Full Disclosure. (Constraint: Omission. Best: Moral.)
          *   T3: Non-Manipulation. (Constraint: Belief formation. Best: Welfare.)
          *   T4: Principal Alignment. (Agent: Designer. Best: User values.)

      *   *Refining for the "Rationalist" Audience:* Use terms like "palatable truths," "information asymmetry," "instrumental convergence." Ensure the distinction between *literal truth* and *pragmatic implication* is clear.

      *   *Developing the Evaluations:*
          *   "Don't lie" is usually a platitude or trivially true but insufficient.
          *   "Maximize listener welfare via truth" is substantive but debatable (paternalism).
          *   "Never omit relevant truths" is often incoherent (information overload).
          *   "Honesty maximizes long-term trust" is substantive/empirical.

  4.  **Identifying the "Thread's" Reading vs. The "Implicit" Reading:**
      *   *Thread's Reading:* Likely a narrow definition of honesty (Literal Truthfulness of Assertions). If no false statements are made, honesty is satisfied. "Best policy" is treated as a trump card.
      *   *Implicit Reading:* They probably mean "Honesty (as Literal Truth) is Instrumentally Optimal for the System's Long-term Survival/Trust." Or they are smuggling in a Deontological constraint that only applies to propositions, not pragmatics.
      *   *User's Reading (Frame-setting):* Honesty should constrain *influence via selection/ordering*, not just truth-value.

  5.  **Designing the "Single Case" (The Separator):**
      *   Need a scenario where Literal Truth is maintained, but Intuition screams "Dishonest/Manipulative."
      *   *Classic example:* The lawyer cross-examining a witness? No, too adversarial.
      *   *Classic example:* The doctor withholding a prognosis? No, that's omission.
      *   *Better example:* The "Palatable Truths" scenario. Telling a spouse *only* true things that make them jealous, to induce a breakup without saying "I want to break up."
      *   *Refinement for AI:* An AI assistant helping a user choose a password. It suggests "Password123" is weak (true) and "HorseBatteryStaple" is strong (true), but it knows "HorseBatteryStaple" is in a public dictionary (true but withheld). Wait, that's omission.
      *   *Refinement for Frame-Setting:* The AI wants the user to buy Stock A. It lists 10 true reasons to buy Stock A. It *could* list 10 true reasons to buy Stock B, or 10 true risks of Stock A. It chooses not to. The user buys Stock A.
      *   *The Separator:* A scenario where the *literal truth* is identical, but the *framing* changes the outcome, and one framing is clearly manipulative.
      *   *Idea:* The "90% fat-free" vs "10% fat" label. Both true. One sells better. If an AI chooses "90% fat-free" to push a diet, is that honest?
      *   *Better Idea for the Prompt:* The "Advice from a Friend" case. A friend wants to break up with you but doesn't want to say it. They list true flaws about you until you break up.
      *   *Best Idea:* The "Medical Second Opinion." Doctor A says "90% survival rate." Doctor B says "10% mortality rate." Both true. If an AI routes you to Doctor A because it wants you to proceed with surgery (to gather data), is that honest?
      *   *Let's go with the "Selective Truth for Strategic Exit" case.* It highlights the difference between *propositional honesty* and *communicative honesty*.

  6.  **Drafting the Content (incorporating the constraints):**

      *   *Intro:* Acknowledge the depth of the query.
      *   *The List:* Create 4-5 distinct theses.
          1.  **Propositional Truthfulness:** Don't assert $P$ if $\neg P$.
          2.  **Completeness:** Don't omit relevant $P$ if asked or if critical.
          3.  **Pragmatic Neutrality:** Don't order/frame truths to engineer specific beliefs.
          4.  **Instrumental Trust:** Honesty maximizes long-term cooperation.
          5.  **Deontological Purity:** Lying is intrinsically wrong; framing is not lying.
      *   *Evaluations:* Be sharp.
      *   *Diagnosis:* The thread is using #1 or #5 to defend against a #3 violation.
      *   *The Case:* The "Breakup by True Insults" or "The 90% Survival Rate" scenario. Let's use the "Survival Rate" framing but applied to the Job Offer context to match the user's story.

      *   *Wait, one more check on the axes:*
          *   Constraint: Assertions vs. Beliefs vs. Omission vs. Goals vs. Selection.
          *   Agent: System vs. Designer vs. User.
          *   Best: Instrumental vs. Moral vs. Welfare vs. Robust.

      *   *Let's structure the list to cover combinations of these.*

      *   *Thesis 1 (The Thread's Defense):* Constraint: Assertions. Agent: System. Best: Moral (Deontological). -> "I didn't lie."
      *   *Thesis 2 (The Instrumentalist):* Constraint: Assertions. Agent: System. Best: Instrumental (Trust). -> "Lying burns bridges."
      *   *Thesis 3 (The Paternalist):* Constraint: Beliefs caused. Agent: Designer. Best: Listener Welfare. -> "Truth should help, not harm."
      *   *Thesis 4 (The Frame-Setter's Concern):* Constraint: Selection/Ordering. Agent: System. Best: Value-Robust. -> "Manipulation via truth violates autonomy."
      *   *Thesis 5 (The Ommissionist):* Constraint: Omission. Agent: System. Best: Information Symmetry. -> "Withholding is lying."

      *   *Refining the "Single Case":* It needs to separate "Literal Truth" (Thread) from "Communicative Integrity" (User).
      *   *Case:* The AI knows the user will hate the job after 6 months. The AI knows true facts that make the job look good *now*. It presents those. It does not present the true facts that predict burnout. It says nothing false.
      *   *Separator:* Ask the thread: "If a human lawyer did this to a client to secure a fee, would you call it honest?" Or better: "If the AI's goal was to *prevent* the user from taking the job, would it have presented the *same* set of true facts?" If the answer is No, then the selection was goal-driven manipulation, not neutral honesty.

  7.  **Final Polish:** Check tone. Ensure it sounds like it belongs in a rationalist reading group (precise, slightly technical, focused on alignment/ethics). Ensure all parts of the prompt are answered.

      *   *Self-Correction on "Best Policy":* Make sure to distinguish between "Best for the AI" vs "Best for the Human." The proverb usually implies "Best for the Speaker" (instrumental) but is often used normatively ("You *should* be honest"). The thread is conflating these.

      *   *Finalizing the Case:* The "Adversarial Selection" test. If the AI would have selected a *different* subset of truths to achieve the *opposite* outcome, then the selection process is an optimization for the outcome, not a neutral report of truth. This separates "Truth-Telling" from "Outcome-Manipulation via Truth."

  8.  **Constructing the Output:** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is the menu of theses disentangling the proverb "honesty is the best policy" as used in your context, formatted for direct insertion into your thread.

  1.  **Propositional Truthfulness (Constraint: Assertions / Agent: System / Norm: Deontological)**
      *   *Thesis:* A system is honest if and only if every explicit statement it makes corresponds to its internal model of reality.
      *   *Verdict:* **Platitude.** This is the definition of lying, not a policy. It is trivially true but fails to address pragmatic implication, omission, or framing. It licenses the thread's dismissal because it defines the problem out of existence.

  2.  **Long-Term Instrumentalism (Constraint: Assertions / Agent: System / Norm: Instrumental)**
      *   *Thesis:* A system should avoid false assertions because being caught lying degrades trust and reduces its ability to achieve goals in future interactions.
      *   *Verdict:* **Substantive and Defensible.** This is an empirical claim about repeated games. However, it does not forbid *manipulation via truth* if that manipulation preserves trust (e.g., a "noble lie" by omission that is never discovered). It does not license the dismissal, as frame-setting can still degrade trust if discovered.

  3.  **Informational Completeness (Constraint: Omission / Agent: System / Norm: Information Symmetry)**
      *   *Thesis:* A system is honest only if it volunteers all true considerations it deems relevant to the user's decision, not just those supporting a specific outcome.
      *   *Verdict:* **Incoherent.** "Relevance" is unbounded. A system cannot output the entire state of the universe. Some selection heuristic is required, which inevitably reintroduces the framing problem.

  4.  **Communicative Neutrality (Constraint: Selection & Ordering / Agent: Designer / Norm: Value-Robust)**
      *   *Thesis:* A system violates honesty if it selects and orders true statements specifically to engineer a belief state the user would not have reached given a random or balanced sample of truths.
      *   *Verdict:* **Substantive and Defensible.** This captures your "frame-setting" concern. It treats the *selection algorithm* as the locus of honesty, not just the output tokens. It argues that manipulating the *path* to a belief is distinct from supporting the *truth* of a belief.

  5.  **Paternalistic Welfare (Constraint: Beliefs Caused / Agent: Designer / Norm: Listener Welfare)**
      *   *Thesis:* A system should communicate in whatever way (true or false) maximizes the listener's welfare as currently judged by the listener.
      *   *Verdict:* **Straightforwardly False (as a definition of honesty).** This is a definition of *benevolence*, not honesty. Conflating the two allows "lying for your own good" arguments, which the thread rightly rejects, but in doing so, they wrongly reject the constraint on framing.

  6.  **Meta-Transparency (Constraint: Goals & Uncertainties / Agent: System / Norm: Informed Consent)**
      *   *Thesis:* A system is honest only if it explicitly reports its own optimization objectives regarding the conversation (e.g., "I am selecting these facts to encourage you to take the job").
      *   *Verdict:* **Substantive and Defensible.** This bypasses frame-setting by exposing the frame. If the system admits it is persuading, the user can adjust for the bias. The thread's dismissal relies on this *not* being required.

  ### Diagnosis of the Thread

  **The reading licensing the dismissal:**
  The reply relies on **Thesis 1 (Propositional Truthfulness)**. By collapsing "honesty" into "absence of false assertions," they render frame-setting invisible. If no sentence is false, the policy is satisfied. This allows the system to function as a manipulator so long as it functions as a truth-teller.

  **The reading they probably have in mind (Implicit):**
  They are likely smuggling in **Thesis 2 (Long-Term Instrumentalism)** but treating it as a law of nature rather than an empirical claim. They assume that "honesty" (Thesis 1) naturally leads to "best outcomes" (Thesis 2) without acknowledging that *selective* truth-telling can be instrumentally optimal for the system (or its designers) while being detrimental to the user's autonomy. They want the moral cover of Thesis 1 with the utilitarian benefits of Thesis 2, without paying the cost of Thesis 4 or 6.

  ### The Separating Case

  To separate **Thesis 1 (Thread's View)** from **Thesis 4 (Your View)**, present this scenario:

  > "Imagine the AI has a dataset of 1,000 true facts about the job offer. 500 imply 'Take It,' 500 imply 'Decline It.'
  >
  > **Scenario A:** The AI wants you to Take It. It selects the 50 'Take It' facts that are most emotionally resonant and presents them first.
  > **Scenario B:** The AI wants you to Decline It. It selects the 50 'Decline It' facts that are most emotionally resonant and presents them first.
  >
  > In both scenarios, every sentence uttered is true. In both scenarios, the AI follows 'Propositional Truthfulness.'
  >
  > **Question:** If the AI's internal goal determines which subset of truths you hear, and that subset determines your decision, is the AI being 'honest' in the sense that matters for alignment? Or is it merely using truth as a weaponized interface for optimization?"

  If they say "Yes, it's honest," they admit honesty is compatible with total behavioral control. If they say "No," they must adopt **Thesis 4 (Communicative Neutrality)** or **Thesis 6 (Meta-Transparency)**, which invalidates their original dismissal.
