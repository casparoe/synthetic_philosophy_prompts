  (c) **0.20** — The exclusion argument relies on a contestable view of causal competition; given realization relations, macro-causes often do not compete with but rather constrain micro-causes, making exclusion unlikely to succeed.

  (d) **0.90** — Interventionist accounts explicitly validate higher-level causes when they exhibit proportionality, making it highly probable that simmball-level claims meet the criteria for literal truth.

  (e) **0.95** — Stipulation 3 grants objective robustness, and in a system designed to track external regularities, the higher-level patterns are necessarily stable and non-gerrymandered.

  (f) **0.95** — There is no relevant causal disanalogy between the careenium and a mammalian brain regarding physical implementation; both are complex physical systems subject to the same metaphysical constraints.

  **Arithmetic:**
  I model the final credence $P(C)$ as the product of the structural supports (a, d, e, f) and the probability that the metaphysical threat (closure + exclusion) does not falsify C. The threat probability is the conjunction of closure being metaphysical (b) and exclusion succeeding (c).
  $$P(C) = P(a) \times P(d) \times P(e) \times P(f) \times (1 - [P(b) \times P(c)])$$
  $$P(C) = 0.95 \times 0.90 \times 0.95 \times 0.95 \times (1 - [0.80 \times 0.20])$$
  $$P(C) = 0.771 \times (1 - 0.16)$$
  $$P(C) = 0.771 \times 0.84 = 0.64764$$

  **Final Credence:** 0.65

  ***

  **Sensitivity:**
  The final number is most sensitive to **(c)**, the success of the exclusion argument. Because (c) acts as a switch within the metaphysical threat term, a modest revision (e.g., from 0.20 to 0.40) significantly increases the probability that C is falsified by physical closure, dropping the final credence by over 10 percentage points.

  **Least Confidence:**
  I am least confident about **(b)**, whether causal closure is a substantive metaphysical thesis. This would be settled by a **conceptual argument** clarifying whether physical completeness entails metaphysical necessity or merely descriptive adequacy, as empirical results cannot distinguish between a metaphysical law and a universal regularity.

  **Implications of Falsity:**
  If C is false, **reduction** is the most likely alternative: simmball causal claims are true only insofar as they are shorthand for complex simm-level interactions, with no autonomous causal standing. Epiphenomenalism is less likely because the simmballs track external regularities that drive behavior, implying functional efficacy that reduction can capture but epiphenomenalism cannot.

  **Verbal Dispute:**
  A defender and denier could agree on every counterfactual, prediction, and simm-level fact, yet the dispute is **not verbal**. It concerns the ontology of causation itself—whether causal relations are fixed solely by microphysical trajectories or also by the proportional relationships identifiable only at the macro-level—which is a substantive metaphysical disagreement, not a linguistic one.
