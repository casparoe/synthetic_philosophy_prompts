answer: |-
  You have identified a precise mechanism of democratic erosion that existing literature often conflates with broader trends. You are correct: *whataboutism* describes the rhetoric, *constitutional hardball* describes the acts, and *norm decay* describes the outcome. None of them capture the **recursive, justificatory loop that permanently shifts the baseline of acceptable conduct.**

  Here is the carving you are looking for.

  ### The Near Misses (Existing Concepts)

  To isolate your concept, we must first clear away the adjacent terms that fail to capture the *cumulative, one-directional shift via precedent.*

  **1. Whataboutism (Tu Quoque)**
  *   **What it captures:** The rhetorical move of deflecting criticism by accusing the critic of similar behavior.
  *   **Where it falls short:** It is episodic and rhetorical. It describes a single exchange in a debate. It does not account for the *structural consequence* of that exchange: the permanent alteration of the normative baseline. Whataboutism can be empty bluster; your pattern requires the precedent to be *binding* enough to trap the critic.

  **2. Constitutional Hardball (Mark Tushnet)**
  *   **What it captures:** Political moves that are technically legal but violate established norms of restraint (e.g., refusing to hold hearings on judicial nominees).
  *   **Where it falls short:** It focuses on the *action*, not the *justification*. Hardball describes the pitch thrown; it does not describe the rule change that allows the next pitcher to throw from closer to the plate because the batter complained about the first pitch. It lacks the recursive element.

  **3. Breakdown of Forbearance (Levitsky & Ziblatt)**
  *   **What it captures:** The loss of "self-restraint" where parties stop exercising their full legal powers to preserve the system.
  *   **Where it falls short:** This describes the *state of the norms* (they are gone), not the *mechanism of their removal*. Levitsky and Ziblatt note that tit-for-tat escalation occurs, but they do not isolate the specific *precedential trap* that prevents the norms from being restored. Their model implies a symmetric collapse; your pattern describes an *asymmetric ratchet*.

  **4. The Overton Window**
  *   **What it captures:** The range of policies or ideas acceptable to the mainstream population.
  *   **Where it falls short:** The Overton Window is usually about *policy ideas* (e.g., tax rates, healthcare), not *procedural norms* (e.g., how judges are selected). More importantly, the Overton Window can shift back and forth. Your pattern is distinct because it is **one-directional**: it is easier to justify breaking a norm than to restore it, because the "restoration" can be framed as partisan weakness.

  ---

  ### The Proposed Concept: The Precedential Ratchet

  Since no existing term captures the *mechanism of recursive justification leading to a locked-in baseline shift*, I propose the term **The Precedential Ratchet**.

  #### Definition
  **The Precedential Ratchet** is a mechanism of democratic erosion wherein a norm violation is defended not on its merits, but by citing a prior violation by an opponent. This defense creates a binding precedent that traps critics into accepting the new behavior as legitimate, thereby permanently shifting the baseline of acceptable conduct in one direction (toward less restraint).

  #### The Five Conditions
  For a sequence of events to qualify as a Precedential Ratchet, it must meet these five criteria:

  1.  **The Violation:** Actor A takes an action that stretches or breaks an existing democratic norm (e.g., packing a court).
  2.  **The Precedential Defense:** When challenged, Actor A does not argue the action is good *per se*, but argues it is *permissible* because Actor B did something structurally similar in the past.
  3.  **The Critic's Trap:** Actor B (or the guardians of the norm) cannot condemn Actor A without condemning themselves (hypocrisy) or admitting their own past actions were wrong (political suicide).
  4.  **The Baseline Shift:** The controversy resolves not by returning to the *old* norm, but by accepting the *new* behavior as the legitimate baseline.
  5.  **The Lock:** In the next cycle, Actor A (or a successor) can cite *this* round as the precedent for an even more extreme action. The mechanism only turns one way: toward erosion.

  #### Boundary Cases (What This Is Not)

  To ensure the concept is sharp, here are three scenarios that look similar but are **not** The Precedential Ratchet.

  **1. Symmetric Escalation (The Arms Race)**
  *   *Scenario:* Party A breaks a norm. Party B retaliates by breaking the same norm to "level the playing field." Party A then breaks it worse.
  *   *Why it's not the Ratchet:* In an arms race, both sides acknowledge the behavior is bad but necessary for competition. In the Ratchet, the behavior is **normalized as legitimate**. The arms race implies a desire to return to stability if the other side stops; the Ratchet implies the baseline has *moved*.
  *   *Distinction:* In an arms race, the norm is *suspended*. In the Ratchet, the norm is *rewritten*.

  **2. Policy Normalization (The Overton Shift)**
  *   *Scenario:* A party proposes a radical tax cut. Critics call it dangerous. The party wins, the cut passes, and five years later it is standard policy.
  *   *Why it's not the Ratchet:* This is a shift in *policy preference*, not *procedural restraint*. The Precedential Ratchet specifically targets the **rules of the game** (institutions, procedures, checks and balances), not the **outcomes of the game** (laws, budgets).
  *   *Distinction:* Policy shifts are reversible by election. Procedural ratchets are often irreversible without constitutional crisis.

  **3. Restorative Justice (The Reverse Ratchet)**
  *   *Scenario:* A government admits, "Our predecessors abused emergency powers. We are returning to the pre-emergency baseline."
  *   *Why it's not the Ratchet:* This is the opposite motion. The Precedential Ratchet is defined by its **asymmetry**. It is politically easy to cite a violation to justify a new one; it is politically difficult to cite a virtue to justify restraint.
  *   *Distinction:* If the baseline moves *back* toward restraint, the Ratchet has been disengaged (a rare event).

  ### Why This Distinction Matters for Your Study

  Naming this **The Precedential Ratchet** solves a specific analytical problem in the study of democratic backsliding.

  1.  **It explains the "Both Sides" Accelerant:** It clarifies why calls for "consistency" often accelerate erosion. When observers demand consistency ("If you condemned Party B for this, you must condemn Party A"), they are inadvertently turning the ratchet. They force the baseline to equalize at the *lower* standard, not the higher one.
  2.  **It Identifies the Point of No Return:** In norm decay, there is often a debate about whether a norm can be restored. The Ratchet model suggests that once a precedent is successfully invoked to justify a violation, the old norm is dead. Restoration requires not just "stopping," but explicitly repudiating the precedent, which is politically costly.
  3.  **It Highlights the Advantage of the "Grievance Holder":** As you noted, the party with the longer catalogue of grievances has the most ammunition. This concept explains why populist parties (who often campaign on "they did it first") are structurally advantaged in this specific mechanism. They are playing the Ratchet game; traditionalists are playing the Guardrails game.

  ### Summary for Your Work
  You are describing **The Precedential Ratchet**.

  *   **Mechanism:** Recursive licensing via past violations.
  *   **Direction:** One-way (toward erosion).
  *   **Trap:** Critics are forced to choose between hypocrisy and normalization.
  *   **Outcome:** The "new normal" is strictly worse than the "old normal," and the old normal becomes indefensible.

  This term allows you to distinguish between a democracy that is *fighting* (symmetric escalation) and a democracy that is *unraveling* (the ratchet turns).
