answer: |-
  Here is a complete lesson plan designed to meet your constraints, handle the professor's skepticism, and create the specific pedagogical "trap" you requested.

  ### 1. Incentive Structure & Coercion Check
  **Do not tie tokens to grades.** With "sore losers" and a skeptical professor, grading based on game performance introduces confounding variables (risk aversion, wealth effects) and ethical concerns.
  *   **The Scheme:** Every student receives **10 tokens** upon entry. Participation credit is awarded for *submitting cards*, not for token count.
  *   **The "Win" Condition:** At the end, the student with the most tokens gets a trivial, non-academic prize (e.g., they choose the snack for the last week of class, or receive a printed "Market Maker" certificate).
  *   **Framing:** Explicitly state: *"In this game, losing tokens is often a sign of successful data generation for our discussion. A guaranteed loss is theoretically more interesting than a risky loss."*

  ### 2. Game Rules (Handout for Students)
  *Print this on the board or a half-sheet handout.*

  **THE MARKET SIMULATION**
  1.  **Role:** You are a "Market Maker." The TA is the "Bank."
  2.  **Currency:** Poker tokens. Final count determines the "Market Maker" title.
  3.  **Commitment:** When you write a price on a card, you are committing to trade at that price. You cannot refuse a trade request from the Bank. (Objections to this rule are noted on the card and discussed in the debrief).
  4.  **Payoff:** A "Winning Ticket" pays **10 Tokens**. A "Losing Ticket" pays **0 Tokens**.
  5.  **Mechanism:**
      *   You write a price (0–10 tokens) you are willing to **Buy** or **Sell** a ticket for.
      *   The Bank collects all cards.
      *   The Bank decides for each card: **Buy** (Bank pays you price, you give ticket), **Sell** (Bank gives you ticket, you pay price), or **Pass**.
      *   Outcomes are resolved. Tokens are exchanged.

  ---

  ### 3. Materials to Print/Cut
  You need 3 colors of index cards (or mark them with dots).

  **BLUE CARDS (The Dutch Book Trap)**
  > **Event:** A fair coin will be flipped at the end of class.
  > **Proposition A:** The coin lands HEADS.
  > **Proposition B:** The coin lands TAILS.
  > **Instruction:** Write the price (0-10 tokens) at which you will **BUY** a ticket that pays 10 tokens if the event happens.
  > *Note: You must submit two cards, one for A and one for B.*

  **RED CARDS (The Coherent Risk Control)**
  > **Event:** A standard 6-sided die will be rolled at the end of class.
  > **Proposition:** The die shows 4, 5, or 6.
  > **Instruction:** Write the price (0-10 tokens) at which you will **BUY** a ticket that pays 10 tokens if the event happens.

  **GREEN CARDS (The Ranking/Money Pump)**
  > **Prizes:** X (Chocolate), Y (Gummy Bear), Z (Nothing).
  > **Instruction:** Circle your preference order (e.g., X > Y > Z).
  > **Rule:** If you hold a prize you like *less* than another available prize, you may pay **1 Token** to swap to the better one. You may swap as many times as you wish before the round ends.

  ---

  ### 4. Minute-by-Minute Timeline (80 Minutes)

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00-05** | **Setup & Distribution** | Hand out 10 tokens each. Explain rules. Emphasize the "Binding Commitment" rule. |
  | **05-15** | **Round 1: Pricing (Blue & Red)** | Students fill out 2 Blue cards (Heads/Tails) and 1 Red card (Die). Collect them silently. No talking. |
  | **15-25** | **Bank Processing (TA Work)** | **Crucial Phase.** While students chat, you calculate. <br>1. Identify incoherent students (Price H + Price T > 10). <br>2. **Book them:** Buy both tickets from them. They pay you (Price H + Price T). You hold both tickets. One must lose, so you keep the 10 token payout, they lose the difference.<br>3. **Identify coherent students:** Pick one with Price H + Price T = 10. **Sell** them the Heads ticket. <br>4. **Red Cards:** For everyone, **Sell** the Die ticket if Price < 5. (This creates risk for everyone). |
  | **25-35** | **Round 2: Ranking (Green)** | Hand out Green cards. Collect. Identify anyone with a cycle (rare, but if found, act as Bank to pump them). If no cycles, use this time to let them trade prizes informally to see if they pay to swap. |
  | **35-45** | **Resolution** | Flip Coin. Roll Die. Settle all debts publicly. Highlight the specific token counts. |
  | **45-80** | **Debrief & Argument Reconstruction** | See Section 6 below. |

  ---

  ### 5. TA "Bank" Cheat Sheet (For your eyes only)
  *Do not show students.*

  **Goal 1: Create a Guaranteed Loss (The Dutch Book)**
  *   Scan Blue Cards. Look for any student where $Price(Heads) + Price(Tails) > 10$.
  *   **Action:** If found, **BUY** both tickets from them.
      *   *Example:* Student prices H at 6, T at 6. Total cost to them = 12.
      *   *Outcome:* Coin lands H or T. One ticket pays 10. The other pays 0.
      *   *Result:* Student paid 12, gets back 10. **Net Loss: 2 tokens (Guaranteed).**
  *   **If everyone is coherent:** You cannot Dutch Book them. Pivot in debrief: "The theorem says *if* you are incoherent... today you were all surprisingly rational." (Have a hypothetical example ready on the board just in case).

  **Goal 2: Create a Coherent Loss (The Control)**
  *   Find a student who priced H=5, T=5 (Perfectly Coherent).
  *   **Action:** **SELL** them the Heads ticket for 5 tokens.
  *   **Outcome:** If coin lands Tails, they paid 5, get back 0. **Net Loss: 5 tokens.**
  *   **Point:** This student lost *more* than the Dutch-Booked student, but their loss was *risky*, not *guaranteed*.

  **Goal 3: The Red Card (Risk)**
  *   Fair price is 5 tokens.
  *   If a student prices it at 4, **Sell** to them. (They might win, might lose).
  *   This ensures even coherent students might end up with low tokens, preventing the "Tokens = Intelligence" inference.

  **Goal 4: The Ranking (Green)**
  *   If a student writes $X > Y > Z > X$ (Cycle):
  *   Give them Z. Offer swap to Y for 1 token. Offer swap to X for 1 token. Offer swap to Z for 1 token.
  *   **Result:** They are back at Z, but down 3 tokens.
  *   *Note:* This requires them to *choose* to swap. Unlike the Dutch Book, this is a **Money Pump**, not a static book.

  ---

  ### 6. The Debrief Script (Mapping Game to Argument)

  **Phase 1: The Reveal (45-55 min)**
  1.  **Ask:** "Who lost tokens on the Coin Flip?" (Hands go up).
  2.  **Ask:** "Who lost tokens on the Die Roll?" (Hands go up).
  3.  **Ask:** "Who lost tokens on the Coin Flip *regardless* of how the coin landed?" (This is the Dutch Book victim).
  4.  **Write on Board:**
      *   Student A (Coherent): Paid 5 for Heads. Coin Tails. Loss = 5. (Contingent).
      *   Student B (Incoherent): Paid 6 for H, 6 for T. Loss = 2. (Guaranteed).
  5.  **State:** "Student A took a risk. Student B made a mistake. The Dutch Book Argument is not about losing money; it's about the *guarantee*."

  **Phase 2: Reconstructing the Argument (55-65 min)**
  Map the game rules to the philosophical premises.
  *   **Game Rule:** "You must trade at your written price." $\rightarrow$ **Premise 1:** Degrees of belief *are* (or entail) betting dispositions. (Operationalization).
  *   **Game Rule:** "You cannot refuse the Bank." $\rightarrow$ **Premise 2:** Rational agents do not refuse mutually acceptable bets. (No refusal).
  *   **Game Rule:** "Tokens have linear value." $\rightarrow$ **Premise 3:** Utility is linear in money/stakes. (No diminishing marginal utility).
  *   **Game Rule:** "Prices written simultaneously." $\rightarrow$ **Premise 4:** Beliefs are synchronic states. (No learning during pricing).

  **Phase 3: The Professor's Objections / Idealizations (65-75 min)**
  *Invite the professor here.* "We know this game relies on assumptions. Let's list them and see which ones hold in real life."

  | Idealization | Status in Game | Status in Reality |
  | :--- | :--- | :--- |
  | **Belief = Price** | **Enforced.** Rule 1. | **Contested.** Do I really believe rain is 70% if I won't bet on it? |
  | **Linear Utility** | **Enforced.** Small stakes (tokens). | **Approximate.** Holds for small stakes, fails for life savings. |
  | **Logical Omniscience** | **Ignored.** Students didn't calculate $P(H)+P(T)=1$. | **False.** Real humans make arithmetic errors. |
  | **No Refusal** | **Enforced.** Rule 3. | **Contested.** Can I say "I believe it, but the odds are bad"? |
  | **Bets don't change World** | **Enforced.** Coin flip is independent. | **Contested.** (Causal decision theory issues). |

  **Phase 4: The Ranking Variant (75-80 min)**
  *   **Question:** "Did the Ranking game produce a Guaranteed Loss?"
  *   **Answer:** "No. It produced a *Cycle*. You only lost money because you *chose* to swap. This is a **Money Pump**, not a Dutch Book."
  *   **Takeaway:** Probabilistic incoherence guarantees loss *statically*. Preference incoherence guarantees loss *dynamically* (if you allow swapping).

  ---

  ### 7. Troubleshooting: What Will Go Wrong

  **Problem 1: Everyone is Coherent.**
  *   *Prediction:* 12 students is a small sample. It is possible everyone writes 5/5.
  *   *Recovery:* Have a pre-prepared "Hypothetical Student C" on the board with prices 7/7. Run the math for them. Say: "If anyone had done this, here is what would have happened. The theorem is a conditional: *If* you are incoherent, *then* you are bookable."

  **Problem 2: A Student Refuses to Trade.**
  *   *Prediction:* A student says "I wrote 7, but I'm not actually giving you 7 tokens."
  *   *Recovery:* Do not argue. Mark their card "REFUSED." In the debrief, say: "This is the most common objection to DBA. If belief doesn't compel action, the bookie can't touch you. But then, what work is 'belief' doing?" (This validates the professor's skepticism while preserving the lesson).

  **Problem 3: The "Sore Loser" Meltdown.**
  *   *Prediction:* A student is annoyed about losing tokens.
  *   *Recovery:* Remind them early and often: "Losing tokens here is the data point we need." If they are upset, offer them a "consolation token" from the jar privately, framing it as "Compensation for being a good sport."

  **Problem 4: Time Overrun.**
  *   *Prediction:* The Bank Processing (15-25 min) takes too long.
  *   *Recovery:* Skip the Green Card (Ranking) round entirely. It is secondary to the main DBA point. Focus on the Coin Flip (Blue Cards).

  ---

  ### 8. Limitations (What the Game Cannot Reproduce)
  *Be frank about this in the debrief.*

  1.  **The "Merely Verbal" Objection:** The game forces belief to *be* price. In reality, belief might be a separate mental state that *influences* price. The game cannot prove they are identical; it only shows that *if* you equate them, coherence is required.
  2.  **Stakes Sensitivity:** The game uses fixed stakes (10 tokens). Real credences might shift depending on how much is bet (e.g., I'm 90% sure for $1, but 50% sure for $1,000,000). The DBA assumes stakes don't change the credence.
  3.  **The "So What?" Factor:** The game shows you lose tokens. It does not show you are *irrational* in a deep sense, only that you are *exploitable*. Some philosophers argue exploitability $\neq$ irrationality (e.g., if I know the bookie is watching, I should change my prices, not my beliefs).

  ### 9. Note to the TA on the Professor
  Your professor is skeptical that coherence norms apply to *actual believing*.
  *   **Do not** claim the game proves people *are* incoherent.
  *   **Do** claim the game proves that *if* we model belief as betting prices, incoherence is costly.
  *   **Strategy:** When she pounces on an idealization (e.g., "But people don't actually bet like this!"), agree with her. "Exactly. That is why the DBA is a normative argument about ideal agents, not a descriptive one about psychology. The game makes that idealization visible so we can critique it." This aligns you with her skepticism rather than opposing it.
