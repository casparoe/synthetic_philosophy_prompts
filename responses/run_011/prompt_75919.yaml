      *   *Focus:* The prompt asks about "bounded agents." I need to address whether the 2nd Law becomes anthropocentric.
      *   *Focus:* The prompt asks about "decoration" in computing. I need to distinguish between a *theoretical limit* and a *practical constraint*.
