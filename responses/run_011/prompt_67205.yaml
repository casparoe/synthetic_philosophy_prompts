answer: |-
  Here is a principle designed to capture your intuitions while resolving the contradictions in your working rule. It prioritizes theoretical cleanliness over preserving every nuance of your eight verdicts.

  ### The Principle: Polycentric Complementarity

  A historical outcome is **Locked In** if and only if it satisfies three conditions:

  1.  **Contingency:** The outcome was not determined by physical law or immediate functional necessity (i.e., a viable alternative existed at the branch point).
      *   *Forced by:* **Case 8 (Base-60).** You want to call it "inevitable," but "locked in" implies a road not taken. This clause forces you to choose: either it was contingent (and thus locked in) or determined (and thus not locked in). It cannot be both.
  2.  **Complementary Capital:** The outcome generated value-adding investments in physical, human, or institutional capital that depend on the standard to function.
      *   *Forced by:* **Case 2 (Rail Gauge)** and **Case 7 (Gasoline).** Without the tracks or the refineries/cities, the standard is just an idea. The capital is what makes reversal costly.
  3.  **Polycentric Ownership:** The complementary capital is owned or controlled by multiple, independent agents (including non-state actors like culture, biology, or foreign markets) such that no single sovereign authority can coordinate its simultaneous scrapping without catastrophic utility loss.
      *   *Forced by:* **Case 3 (Sweden)** vs. **Case 5 (French Week).** This is the crucial fix for your working rule. In Sweden, the capital (cars, signs) was owned by citizens but *controllable* by the State via decree and subsidy. In Revolutionary France, the capital (religious observance, agricultural cycles, sleep biology) was owned by the Church, the Sun, and human circadian rhythms. The State could not command them.

  ---

  ### Application to Your Eight Verdicts

  This principle saves seven of your eight verdicts cleanly, but requires a modification to the eighth.

  *   **1. QWERTY (Locked In):** **Pass.** Contingent (Dvorak exists). Capital (muscle memory, hardware). Polycentric (millions of typists + manufacturers; State cannot retrain everyone overnight).
  *   **2. Rail Gauge (Locked In):** **Pass.** Contingent (broad gauge existed). Capital (track, trains). Polycentric (multiple rail firms, geography, state regulators).
  *   **3. Sweden Traffic (Not Locked In):** **Pass.** Contingent. Capital (cars, signs). **Fails Polycentric:** The State successfully coordinated the switch because the capital was purely mechanical and legal, not cultural or biological.
  *   **4. Metric (Locked In Europe/Not US):** **Pass.** The principle makes "Locked In" a property of the *ecosystem*, not the abstract standard. In Europe, State + Trade aligned. In US/UK, Custom (independent agent) resisted State.
  *   **5. French Week (7-Day Locked In):** **Pass.** The 10-day week failed because the complementary capital (Church liturgy, harvest cycles) was polycentrically owned and resisted the State. The 7-day week survived because it was embedded in those independent spheres.
  *   **6. Betamax (Not Locked In):** **Pass.** Contingent. Capital (tapes, players). **Fails Polycentric/Utility:** The capital was consumer-grade and easily swapped or rendered obsolete (by DVD). Reversal did not cause catastrophic utility loss to the system.
  *   **7. Gasoline (Locked In):** **Pass.** Contingent (EVs existed). Capital (refineries, roads, suburbs). Polycentric (Oil majors, geopolitics, auto manufacturers, homeowners). Reversal requires rebuilding civilization.
  *   **8. Base-60 (Verdict Modified):** **Fail/Modify.** You called it "Locked In and Inevitable." The principle forces you to drop **"Inevitable."** Base-10 or Base-12 were viable alternatives (Contingency). If it was truly inevitable, it cannot be "locked in" by history, only determined by math. I advise keeping "Locked In" and dropping "Inevitable."

  ---

  ### Verdicts on Three New Cases

  1.  **The Light Water Nuclear Reactor (LWR).**
      *   *Analysis:* Chosen contingently by the US Navy for submarines (compactness). Now dominates civilian power.
      *   *Verdict:* **Locked In.**
      *   *Reasoning:* Massive complementary capital (regulatory frameworks, fuel enrichment plants, engineer training) owned by independent states and corporations. A sovereign cannot easily switch to Thorium or Fusion without scrapping this polycentric capital.
  2.  **The 5-Day Work Week.**
      *   *Analysis:* Emerged from labor unions + Ford + Religion (Sabbath).
      *   *Verdict:* **Locked In.**
      *   *Reasoning:* Embedded in law (State), worship (Church), school schedules (Education), and family structure (Culture). A single agent (e.g., a President) cannot mandate a 4-day week without breaking coordination across these independent spheres.
  3.  **The USB-A Connector.**
      *   *Analysis:* Dominant for 20 years, now being replaced by USB-C.
      *   *Verdict:* **Not Locked In.**
      *   *Reasoning:* While it had complementary capital (ports, cables), the ownership was concentrated in tech manufacturing. The utility loss of switching was low (adapters exist), and the coordinating agents (tech consortia) had the authority to mandate the change without societal collapse.

  ---

  ### The Sacrifice

  If you demand a single clean principle, you must abandon the claim in **Case 8 (Base-60)** that the standard is **"Inevitable."**

  "Locked in" is a historical category describing a path taken among alternatives. "Inevitable" is a deterministic category describing a path with no alternatives. Holding both creates a theoretical contradiction. Base-60 is a paradigmatic example of lock-in (Sumerian inheritance persisting through millennia despite decimal logic), but it is not inevitable (France successfully decimalized time during the Revolution, proving it *can* be changed, even if it didn't stick).

  **Abandon "Inevitable." Keep "Locked In."** This preserves the historical weight of the outcome without invoking determinism that undermines the definition of lock-in itself.
