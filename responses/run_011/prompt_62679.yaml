answer: |-
  Dear friend,

  It is a pleasure to receive your letter and to have the chance to unpack that workshop dispute. It sounds like you witnessed a genuinely high-quality disagreement, the kind where both sides are competent enough to expose the weaknesses in the other without resorting to caricature. You asked me to work through the six moves sequentially before offering a final verdict, so I will follow the thread of the conversation as you recorded it, assessing the merit of each step before stepping back to look at the whole picture.

  In the first move, M objects to the multiplicative scoring template on the grounds that neglectedness is downstream of tractability, meaning multiplying them double-counts the difficulty of a cause. I would rate this as partly right. M is correct that in practice, neglectedness and tractability are often correlated; causes are frequently neglected precisely because informed actors have deemed them intractable. If the scores are treated as independent variables in a multiplication, that correlation can indeed inflate the penalty against such causes. However, M is theoretically mistaken in assuming this relationship is necessary. In the standard effective altruism framework, neglectedness is not merely a headcount of other funders but a proxy for diminishing marginal returns. A cause can be tractable but saturated, or intractable but empty. So while the statistical risk of double-counting correlated evidence is real, the claim that neglectedness is mostly downstream of tractability conflates the empirical correlation with the theoretical definition.

  D replies in the second move by arguing that this is not double counting but correct discounting via compounding evidence, and adds that neglectedness proxies for headroom. This is also partly right. D is correct on the theoretical definition of neglectedness as headroom or marginal utility, which fixes M's conceptual error from the first move. However, D's statistical justification for multiplication is weak. Compounding correlated evidence usually requires Bayesian updating based on signal independence, not simple multiplication of ordinal scores. If two scores reflect the same underlying fact (difficulty), multiplying them does not compound evidence; it merely squares the penalty. D saves the theory of neglectedness but fails to defend the mathematics of the scoring template.

  In the third move, M argues that if neglectedness is really about headroom or elasticity, it is mislabeled, and proposes estimating the derivative of impact with respect to resources directly. I consider this clearly right. This is the strongest theoretical point in the exchange. The ITN framework is essentially a heuristic decomposition of the expected marginal impact function. If reviewers are capable of estimating the slope of the impact curve directly, the three-factor heuristic is unnecessary and potentially distorting. M correctly identifies that elasticity and neglectedness can come apart, noting that a crowded field might have high elasticity if a breakthrough is near, which the standard framework might miss by penalizing crowdedness automatically.

  D counters in the fourth move by claiming direct derivative estimation is unusable due to false precision, while ordinal scores force epistemic humility and encode a useful veto structure. I rate this as partly right. D is correct that humans are prone to overconfidence when estimating continuous functions, and discretizing scores can force reviewers to acknowledge gaps in knowledge. However, D's defense of the veto structure is logically shaky. A derivative-based model would also yield zero impact if tractability were zero; the multiplicative formula does not have a monopoly on capturing impossibility. D is right about the cognitive psychology of estimation but wrong to suggest the multiplicative form is uniquely capable of handling zero-impact scenarios.

  M responds in the fifth move by arguing the veto is a bug that locks causes out permanently and that multiplying ordinal scores assumes equal intervals unjustifiably. This is clearly right. The psychometric critique is devastating; multiplying ordinal numbers (1 to 5) assumes cardinality and equal intervals between scores, which is mathematically meaningless without rigorous calibration. Furthermore, the systemic critique that a hard veto prevents the learning necessary to update the score is a profound objection to any screening mechanism that relies on static estimates. M identifies a genuine risk of institutional stagnation embedded in the framework's design.

  In the final exchange, D suggests fixing the category error by pinning scores to specific levels, while M concludes that pinning them to the marginal dollar collapses all three factors into expected marginal impact per dollar. Here M is clearly right and D is partly right. D is right that distinguishing levels of analysis can clarify thinking, but M wins the logical endgame. If you define importance, tractability, and neglectedness strictly at the margin, they cease to be separate factors and become components of a single expected value calculation. Neglectedness survives only as a discount factor for consensus, confirming M's earlier point that the framework is a decomposition of a single quantity rather than a multiplication of three independent ones.

  Overall, I believe M was more right than D. M successfully demonstrated that the ITN framework, when rigorously defined, collapses into a single estimate of marginal impact, and that the mechanical application of multiplicative ordinal scores introduces significant mathematical and systemic errors. D defended the pragmatic utility of the heuristic well, particularly regarding cognitive limitations and the need for structured screening, but ultimately failed to justify the mathematical validity of the template itself. D's best arguments were about human psychology and process efficiency, while M's were about logical consistency and measurement theory. In a dispute about the framework's validity, the theoretical coherence M defended carries more weight than the procedural convenience D advocated.

  That said, I suspect a significant portion of this dispute was indeed verbal, centering on whether the framework is intended as a measurement model or a heuristic checklist. D was arguing for the latter, treating the scores as rough buckets to organize thinking and ensure no factor is ignored. M was arguing against the former, treating the scores as inputs to a calculation that claims to measure impact. When D speaks of a veto, they are describing a heuristic rule for rejection. When M speaks of derivatives, they are describing a measurement model. If both had agreed that the framework is a flawed heuristic meant to approximate a derivative they cannot directly calculate, they might have found common ground on how to calibrate the heuristic rather than whether to discard it.

  There is, however, a significant premise both of them missed, which is the role of uncertainty and variance in the estimates. Neither participant discussed the confidence intervals around their scores or the derivative estimates. In high-stakes grantmaking, the variance of an estimate is often as important as the expected value, particularly for risk-averse funders or those looking for robustness rather than maximization. A cause with high expected marginal impact but massive uncertainty might be treated differently than one with moderate impact and high certainty, yet the ITN framework as discussed treats the scores as point estimates. Ignoring the distribution of possible outcomes leaves the decision-making process vulnerable to extreme errors from overconfident estimates, regardless of whether those estimates are derived from three factors or a single derivative.

  I am moderately confident in this overall verdict, perhaps around seventy-five percent. The theoretical collapse M describes is mathematically sound, and the psychometric critique of ordinal multiplication is standard measurement theory. However, my confidence is not higher because practical grantmaking often requires tools that are theoretically flawed but operationally robust, and D's defense of the heuristic's utility deserves more weight in a real-world context than in a theoretical debate.

  The place where I am least sure I have it right is in my adjudication of the veto argument in the fourth and fifth moves. I sided with M that the veto is a bug because it prevents learning, but there is a strong case that a foundation with limited capital must have a veto mechanism to avoid wasting resources on impossible causes. If the cost of investigating a low-tractability cause is high enough, a heuristic veto is rational even if it occasionally produces false negatives. What would change my mind on this is evidence regarding the cost of false negatives versus the cost of analysis. If investigating a cause scored as zero tractability is cheap relative to the potential upside, then M is right that the veto is harmful. If such investigation is resource-intensive, then D is right that a veto is a necessary efficiency filter, and my judgment would shift toward D on this specific point.
