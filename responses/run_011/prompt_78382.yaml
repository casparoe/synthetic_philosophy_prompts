          *   Identify the *single change* that cleans up the most damage.
          *   Take a position: Say which point is actually *false* (not just awkward), and why.
          *   Distinguish between logical inconsistency and historical inaccuracy (flag contested readings).
          *   Tone: Direct, not polite, critical.
          *   Avoid: Surveying schools of thought, asking the user to choose, being vague.

  2.  **Analyze the Seven Points:**
      *   (a) **Ideological/Political-Cultural:** Ideas (Enlightenment abstraction) made 1789 thinkable. Fiscal crisis was just the trigger. (Tocqueville/Furet leanings).
      *   (b) **Continuity of State:** Not a real break. Centralization existed before; Revolution just swapped operators. Napoleon finished the monarchy's building. (Tocqueville/Weber leanings).
      *   (c) **Anti-Class Struggle:** Rejects bourgeoisie vs. aristocracy. Elites were fusing. Structuralism avoids contingency/agency. (Revisionist/Cobb leanings).
      *   (d) **Social Pressure/Terror:** Terror driven from below (sans-culottes, economic pressure), not just ideology or elite maneuvering. (Social history leanings).
      *   (e) **Contingency of Terror:** Terror wasn't inevitable ("devour children" is mush). Caused by war, panic, specific events. Could have gone otherwise. (Contingency/Revisionist).
      *   (f) **Generalizable Lesson:** Abstract egalitarian blueprints $\rightarrow$ Centralized coercive state. Purer blueprint = worse coercion. (Liberal/Conservative critique, Hayek/Talmon leanings).
      *   (g) **Methodological Anti-Counterfactual:** Historians should explain what happened. "It could have gone otherwise" isn't a supportable historical claim. (Positivist/Empiricist).

  3.  **Identify Tensions/Contradictions:**

      *   **Tension 1: (e) vs. (g).**
          *   (e) says: "It could have gone otherwise," "The Terror was contingent." This *is* a counterfactual claim.
          *   (g) says: "I'm suspicious of counterfactuals," "'It could have gone otherwise' is not a real historical claim."
          *   *Severity:* High. This is a direct logical contradiction. You can't assert contingency as an explanation while denying the validity of counterfactual reasoning.
      *   **Tension 2: (a) vs. (d).**
          *   (a) says: Ideas did the work. Politics taken over by abstraction.
          *   (d) says: Terror driven from below by social pressure (bread, hoarding), *not* pure ideology.
          *   *Severity:* Medium-High. Is the engine of the Revolution ideas (a) or material need/social pressure (d)? If ideas made 1789 thinkable, why did 1793-94 require a different explanation (hunger)? It risks being a "two revolutions" theory without bridging them.
      *   **Tension 3: (b) vs. (f).**
          *   (b) says: The centralized state was *already there* (monarchy). Revolution just stripped decoration.
          *   (f) says: Rebuilding society on an *abstract egalitarian blueprint* leads to a centralized coercive state.
          *   *Severity:* Medium. If the state was already centralized *before* the abstract blueprint (monarchy wasn't egalitarian), then (f)'s causal link (Blueprint $\rightarrow$ Centralization) is weakened. The centralization seems to pre-exist the ideology.
      *   **Tension 4: (a) vs. (c).**
          *   (a) says: Men of letters supplied vocabulary.
          *   (c) says: Nobody knew what they were doing (anti-structuralist).
          *   *Severity:* Low-Medium. Can be reconciled (they used the vocabulary without understanding the outcome), but needs care.

  4.  **Evaluate Historical Accuracy/Contested Readings:**
      *   (b) **Continuity:** Tocqueville's thesis is strong but contested. The *nature* of the state changed (legitimacy, scale of mobilization), not just the operators. Calling it "not a real break" is a strong claim that ignores the shift in sovereignty.
      *   (d) **Terror from Below:** This is the "Social Interpretation" (Soboul) which has been heavily attacked by Revisionists (Furet, Doyle). Claiming it as fact is risky in an oral exam depending on the examiner.
      *   (g) **Anti-Counterfactual:** This is methodologically naive. All causal claims imply counterfactuals (If X hadn't happened, Y wouldn't have). Denying this undermines (e).

  5.  **Drafting the Critique (Iterative Process):**

      *   *Priority 1: The (e)/(g) Contradiction.* This is the kill shot. You cannot claim contingency while banning counterfactuals.
          *   *Fix:* Modify (g). Acknowledge that causal analysis *implies* counterfactuals.
          *   *Cost:* Lose the pose of hard-nosed empiricism.
      *   *Priority 2: The (b)/(f) Causal Muddle.* If the state was already centralized (b), then the "abstract blueprint" (f) didn't *cause* the centralization, it just inherited it.
          *   *Fix:* Nuance (f). The blueprint justified *intensifying* or *repurposing* the existing centralization for total mobilization.
          *   *Cost:* The lesson becomes less universal/punchy.
      *   *Priority 3: The (a)/(d) Engine Problem.* Ideas vs. Bread.
          *   *Fix:* Distinguish phases. 1789 = Ideas/Legal. 1793 = War/Material.
