      *Wait, one more check on (b) vs (f).* If (b) is true (state already centralized), then (f) (blueprint creates centralized state) is false *for France*. The blueprint didn't create the machine; it drove the machine harder. So (f) is the generalization that fails the specific case if (b) is true. This is a strong tension.

