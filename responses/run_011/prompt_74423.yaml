  ### Follow-Up Analysis

  **1. Which axis is doing most of the discriminating work?**
  **Blindness (B)** is the primary discriminator. While Vehicle and Fidelity separate the digital items from the oral ones, Blindness is what separates the "Darwinian" memes (Viral Sound, Macro, Slang) from the "Designed" systems (Chess, Law, SOP, Tune). Almost every Tier C item fails specifically because their variation is guided by rational intent or institutional enforcement rather than blind drift.

  **2. Mean vs. Min Aggregation**
  Recalculating using the **Mean** instead of the Min produces significant tier migration:
  *   **Movers:** (3) Chess, (4) Law, (10) SOP, and (11a) Tune all jump from **Tier C to Tier A**. Their high scores in F, V, and S pull their average up despite the zero/near-zero on B. (6) Viral Sound moves from **S to high A** (diluted by lower S), and (8) Rumor moves from **C to B**.
  *   **Evaluation:** The Min rule is **not decoration**; it is earning its keep. Your worry that B flattens the handout is partially correct (it creates a large Tier C), but that collapse is theoretically necessary. If you use the Mean, you classify Chess and Lab SOPs as "Darwinian," which contradicts the core definition of natural selection (blind variation). The Mean rule measures "Cultural Stability," but the Min rule measures "Darwinian Algorithm."
  *   **Repair:** If the C tier feels too crowded, do not change the aggregation rule. Instead, refine the **Blindness** definition for the students: ask them to score whether the *selection* is blind, not just the variation. However, keeping the Min rule is the only way to preserve the distinction between *evolution* and *design*.

  **3. Dawkins vs. Sperber Showdown**
  *   **Item:** (3) The Najdorf Sicilian (Chess).
  *   **Axis:** **B (Blindness)**.
  *   **The Fight:** A Dawkins-style memeticist would argue B is high (around 7), claiming players explore move spaces blindly and the "winning moves" are selected by the environment (the board). A Sperber-style attractor theorist would argue B is low (around 1), claiming moves are transmitted via rational inference of intent ("I see why he played that") and variation is guided by calculation.
  *   **Verdict:** **Sperber is right.** Chess transmission is fundamentally reconstructive and reason-based. Players do not copy moves blindly; they adopt them because they understand the underlying logic. Calling this "Darwinian" stretches the definition of blind variation until it breaks. The high fidelity here is due to shared rational constraints, not replicator mechanics.
