answer: |-
  # Question-Period Preparation Sheet

  **Session:** Analogy and Conceptual Representation
  **Paper:** Degeneracy in the Letter-String Microdomain
  **Audience:** 40 (Hostile/Mixed)

  ## Part 1: Objections, Replies, and Soft Spots
  *Ordered by product of Likelihood and Damage.*

  ### 1. The Temperature Locality Objection
  **Who:** FARG Loyalist 1 (Maintainer of modern port)
  **Objection:** "You claim temperature fails as a global control signal because the shape and fill dimensions have incompatible topologies. But nothing in the architecture forbids computing temperature locally per bond type. We can have a 'shape-temperature' and a 'fill-temperature.' The terraced scan remains parallel; it just sums weighted resistance signals. Why does control have to be scalar globally to be valid?"
  **Reply:** "If temperature is split by dimension, the 'parallel terraced scan' ceases to be a single search process and becomes two independent searches coordinated only by a summing function. In the Shape/Fill domain, this matters because slippage in one dimension constrains the other. If I slip 'hexagon' to 'triangle' (cyclic), I cannot simultaneously slip 'solid' to 'hollow' (bounded terminus) without violating the fill topology. A global temperature forces a trade-off: do I tolerate high resistance in the fill dimension to resolve the shape cycle? If you localize temperature, you remove the mechanism that forces that trade-off. You lose the pressure that creates the analogy, reducing it to parallel constraint satisfaction without a global urgency signal."
  **Soft Spot:** This relies on the claim that global pressure is necessary for *analogy* rather than just *solution finding*. If they argue that independent searches can be re-synchronized by workspace conflicts, I need to show that the synchronization itself requires a global metric they haven't defined.

  ### 2. The Hand-Coding Charge
  **Who:** Session Chair (Connectionist)
  **Objection:** "You say the fluidity is pre-loaded because the slipnet distances match the domain geometry. But isn't the slipnet just a set of free parameters? Any model fits its data if you tune the weights. You haven't shown the architecture fails; you've shown that *this specific parameter set* is brittle. Why isn't this just a complaint about overfitting?"
  **Reply:** "In standard overfitting, parameters are tuned to match output distributions. Here, the parameters define the *conceptual geometry* itself—the distance between 'hexagon' and 'triangle' is hard-wired to be close, mirroring the cyclic successor. The degeneracy claim is that the letter domain hides this tuning because 'Z' to 'A' is rarely needed, so the cyclic nature of the alphabet isn't tested. In Shape/Fill, the cycle is active. If the slipnet distances are free parameters, then the 'slippage' is not emergent fluidity; it is a lookup table for permitted transformations. The architecture isn't discovering the analogy; it is traversing a graph built to make that analogy easy."
  **Soft Spot:** I must avoid implying that *all* symbolic distances are illegitimate. The soft spot is admitting that *some* hand-coding is inevitable in microdomains. I need to hold the line that the *degree* of matching here masks the mechanism's inability to handle mismatched topologies.

  ### 3. The Human Baseline Objection
  **Who:** Categorization Experimentalist
  **Objection:** "You build your argument on the topology of the Shape/Fill domain. But do humans actually perceive 'hexagon to triangle' as a valid successor? You've stipulated this cycle by fiat. If human subjects don't see that analogy naturally, your degeneracy claim is about your formalism, not cognition. Where is the behavioral data?"
  **Reply:** "The point isn't that humans naturally prefer this domain, but that the domain *separates variables* that letters collapse. Whether humans accept hexagon-triangle is secondary to whether the model can handle the topology without breaking. However, preliminary piloting shows adults accept the cycle when instructed, but struggle with the 'solid' terminus—they try to loop solid back to hollow. Copycat, with a fixed slipnet, cannot model that struggle unless we hard-code the terminus. The domain exposes that the model cannot learn the topology; it must be told. That is the degeneracy: the model assumes the geometry it should be discovering."
  **Soft Spot:** I have weak behavioral data. If they press hard on the "instructed" part, I look like I'm modeling compliance, not cognition. I need to pivot back to the architectural incapacity to learn topology, regardless of human baseline.

  ### 4. The Statistical Degeneracy Metric
  **Who:** Computational Statistician
  **Objection:** "You claim the letter domain is degenerate. Degeneracy implies a loss of information or distinct states. How do you quantify this? What is the statistical test that shows the letter domain collapses distinctions that Shape/Fill separates? Without a metric, 'degeneracy' is just a metaphor."
  **Reply:** "The metric is the coincidence of extremal descriptions. In letters, 'rightmost', 'last', and 'highest ordinal' map to the same token. In Shape/Fill, 'most sides' (hexagon) is not 'last' (solid is terminal in fill, but shape cycles). I propose measuring the entropy of the mapping between positional descriptors and conceptual descriptors. In letters, the mutual information is near 1.0; in Shape/Fill, it is significantly lower. The model's failure to distinguish these in the letter domain shows it cannot separate position from concept when they coincide. The statistic is the divergence in answer distributions when those coincidences are broken."
  **Soft Spot:** I haven't actually computed this entropy metric in the paper. If they ask for the number, I have to admit it's theoretical. I need to frame it as a proposed method for future evaluation, not a completed result.

  ### 5. The Codelet Flexibility Defense
  **Who:** FARG Loyalist 2 (Former Student)
  **Objection:** "You say the architecture can't handle the mixed topology. But codelets are stochastic. We can post codelets that specifically check for cyclic vs. bounded chains. The workspace would build structures reflecting the topology, and temperature would rise if those structures are violated. Why isn't this just a matter of writing richer codelets?"
  **Reply:** "Codelets operate on structures built in the workspace. To build a structure that says 'this dimension is cyclic,' the codelet must already know the topology of the concepts it is processing. That knowledge lives in the slipnet. If the slipnet says 'hexagon' is near 'triangle', the codelet assumes continuity. If the codelet has to check the topology explicitly, it is no longer relying on slipnet activation for slippage; it is running a symbolic check. You are shifting the burden from the emergent dynamics to explicit rule-checking codelets, which defeats the claim that fluidity comes from the terraced scan."
  **Soft Spot:** This borders on defining the architecture so narrowly that no modification is allowed. I need to emphasize that adding topological checks changes the *class* of the model from subsymbolic activation to hybrid symbolic checking.

  ### 6. The Scale/LLM Objection
  **Who:** Session Chair (Connectionist)
  **Objection:** "Even if you're right about Copycat, why does it matter? Large pretrained models handle these analogies via in-context learning without hand-built slipnets or temperature schedules. They don't care about your topology mismatches. Isn't this a debate about a dead end?"
  **Reply:** "LLMs solve the task, but they obscure the mechanism. They don't show *how* conceptual fluidity arises; they show statistical convergence. My argument is about cognitive plausibility, not task performance. If human analogy relies on mechanisms like slippage, we need to know if those mechanisms are robust to topological mismatch. LLMs don't have a slipnet; they have attention weights. If we care about the cognitive claim of the Copycat family—that fluidity emerges from competing pressures—then showing that mechanism fails on mixed topologies is vital. Don't confuse solving the puzzle with modeling the mind."
  **Soft Spot:** This risks sounding like "goalpost moving" (performance vs. mechanism). I must ensure I don't dismiss LLMs entirely, but frame them as orthogonal to the specific cognitive claim being tested.

  ### 7. The Positive Account Demand
  **Who:** Philosopher of Cognitive Science
  **Objection:** "You've argued that the microdomain is a hidden parameter and the temperature mechanism is flawed here. What is the positive account? How *should* we specify conceptual geometry if not via a slipnet? If you reject hand-set parameters, what replaces them?"
  **Reply:** "I am not rejecting parameters; I am demanding explicit declaration of the conceptual geometry as a separate layer from the mechanism. Instead of hiding the topology in slipnet distances, the model should take a geometry specification as input: 'Dimension A is cyclic, Dimension B is bounded.' The mechanism should then be tested on its ability to navigate that specification without the distances being pre-tuned to the solution. The positive account is a separation of concerns: geometry is a constraint, slippage is the process. Currently, geometry is baked into the process."
  **Soft Spot:** This sounds like I'm asking for a symbolic pre-processor. I need to clarify that the geometry specification shouldn't dictate the *path*, only the *constraints* on valid moves.

  ### 8. The Ordinality of Shapes
  **Who:** Categorization Experimentalist
  **Objection:** "Letters have an intrinsic ordinality learned early in development. Shapes do not. By imposing an ordinality on shapes (3 to 6 sides), you are creating a artificial task. Doesn't this invalidate the comparison? You're comparing a natural domain to a contrived one."
  **Reply:** "That is exactly the point. The letter domain feels natural because the coincidences (ordinal, positional, terminus) align with our learning history. But that alignment is what makes it degenerate for testing mechanisms. By contriving the Shape/Fill domain, I am isolating the variables. If the mechanism is general, it should handle the contrived topology as well as the natural one. If it only works when the domain matches our priors, it is not a model of general analogy, but a model of letter-string analogy specifically."
  **Soft Spot:** I risk conceding that Copycat is only a model of letter-strings. I need to maintain that the *claim* is generality, even if the *implementation* is specific.

  ### 9. The Variability Objection
  **Who:** Computational Statistician
  **Objection:** "Copycat outputs are distributions over runs. How do you know the failure on Shape/Fill isn't just run-to-run variability? Have you controlled for the number of codelet runs? Maybe it just needs more search time to resolve the cyclic tension."
  **Reply:** "The failure isn't convergence failure; it's structural bias. Increasing runs doesn't fix the topology mismatch. If the slipnet distance between 'solid' and 'hollow' is low, the model will slip across the terminus regardless of temperature or run count. If the distance is high, it won't slip even when needed. The distribution shifts, but the mode remains incorrect relative to the topology constraints. Variability noise doesn't explain a systematic bias toward treating bounded chains as cycles."
  **Soft Spot:** I need to be sure the bias is systematic. If the model occasionally gets it right by chance, the statistician will pounce on the overlap. I must emphasize the *mode* of the distribution, not the tails.

  ### 10. The Canonical Domain Defense
  **Who:** FARG Loyalist 1
  **Objection:** "The letter-string domain isn't degenerate; it's canonical. It was chosen because it isolates pure analogy without semantic baggage. Your Shape/Fill domain introduces semantic baggage (number of sides). Why isn't your domain the degenerate one?"
  **Reply:** "Letters isolate analogy only if you ignore their ordinal structure. Once you use 'successor', you invoke ordinality. The letter domain is canonical only because the ordinality, position, and terminus coincide. Shape/Fill removes that coincidence. It's not about semantic baggage; it's about topological independence. If a mechanism claims to handle conceptual slippage, it must handle cases where 'most' does not mean 'last'. The letter domain hides this; Shape/Fill exposes it."
  **Soft Spot:** This is a definitional fight. I need to avoid getting bogged down in what "canonical" means and stick to the topological argument.

  ---

  ## Part 2: Strategic Guidance

  ### Concessions for Opening (First 5 Minutes)
  *Disarm the predictable attacks without giving away the pincer.*
  1.  **Concede Performance:** Acknowledge that Copycat successfully reproduces human answer distributions on letter-strings. Do not claim the model "fails" on its home turf; claim the turf is rigged.
  2.  **Concede LLM Capability:** Acknowledge that transformers can solve Shape/Fill analogies. This prevents the Chair from dismissing the work as obsolete. Frame your paper as about *mechanism transparency*, not task solving.
