answer: |-
  **MEMORANDUM**

  **TO:** Cognitive Science Lab Group
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Decomposition of the "No Negative Evidence" Slogan in Structure-Dependence Simulations

  **1. Introduction**

  Following the recent discussion regarding simulation conditions for structure-dependence, the objection "there is no negative evidence" was raised to dismiss both positive-only training and control conditions involving contrastive pairs. As this slogan conflates distinct empirical, logical, and methodological claims, the following menu decomposes the statement into five precise readings. Each reading is categorized by its domain (Environment, Learner, or Procedure), assessed for epistemic status, and evaluated against the two argumentative jobs the slogan was asked to perform:

  *   **Job A:** Ruling the control condition (contrastive pairs) inadmissible as a model of the child's epistemic situation.
  *   **Job B:** Supporting the claim that structure-dependence must be innate because it cannot be learned from distributional information over positive data.

  ***

  **2. Menu of Readings: "There Is No Negative Evidence"**

  **Reading 1: The Empirical Absolutist**
  *   **Claim:** Caregivers *never* provide explicit corrections or indications of ungrammaticality to children.
  *   **Domain:** Environment (Descriptive claim about input).
  *   **Epistemic Status:** **Plainly False.** While early studies (e.g., Brown & Hanlon, 1970) suggested corrections were rare, subsequent corpus analyses show that recasts and explicit corrections do occur, though not systematically for all error types.
  *   **Argumentative Utility:**
      *   *Job A (Control Condition):* **Supports.** If the claim were true, the control condition would be ecologically invalid.
      *   *Job B (Nativism):* **Weak.** Even if true, it does not prove learnability is impossible; it only removes one potential source of information.

  **Reading 2: The Reliability Skeptic**
  *   **Claim:** While corrections occur, they are too noisy, inconsistent, or delayed to be reliably utilized by a learner for hypothesis testing.
  *   **Domain:** Environment $\times$ Learner (Claim about the signal-to-noise ratio of input relative to processing constraints).
  *   **Epistemic Status:** **Empirically Well Supported.** Corrections are often contingent on truth conditions rather than syntax, and their frequency relative to child errors is low.
  *   **Argumentative Utility:**
      *   *Job A (Control Condition):* **Supports.** Suggests the control condition (reliable contrastive pairs) grants the model an advantage the child lacks.
      *   *Job B (Nativism):* **Partial.** Suggests *explicit* negative evidence is not the mechanism, but leaves open whether *indirect* negative evidence (statistical preemption) suffices.

  **Reading 3: The Logical Necessity (Identifiability)**
  *   **Claim:** Positive data alone is logically insufficient to identify the target grammar from the class of possible grammars (specifically, to rule out supersets like linear-order rules).
  *   **Domain:** Procedure/Space (Formal claim about identifiability in the limit; Gold's Theorem context).
  *   **Epistemic Status:** **Question-Begging in this Setting.** Formally true *if* the hypothesis space includes linear rules that generate all positive data plus additional unobserved strings. However, it assumes the learner does not have biases (inductive or architectural) that prefer structure-dependent hypotheses independent of data.
  *   **Argumentative Utility:**
      *   *Job A (Control Condition):* **Neither.** This claim concerns the positive-only condition, not the control.
      *   *Job B (Nativism):* **Strong Support.** If true, it necessitates innate constraints to reduce the hypothesis space, regardless of the learning algorithm.

  **Reading 4: The Psychological Realist**
  *   **Claim:** Children are cognitively incapable of utilizing negative evidence even if it were available (e.g., they ignore corrections).
  *   **Domain:** Learner (Claim about developmental trajectory and processing).
  *   **Epistemic Status:** **Empirically Shaky.** Evidence is mixed; some studies show children react to recasts, others show no uptake. It is unlikely to be a hard constraint.
  *   **Argumentative Utility:**
      *   *Job A (Control Condition):* **Supports.** If children cannot use contrastive pairs, a model that does is not a valid cognitive model.
      *   *Job B (Nativism):* **Supports.** If children cannot use negative evidence, and positive evidence is insufficient (see Reading 3), the rule must be innate.

  **Reading 5: The Definitional Stipulation**
  *   **Claim:** "Negative Evidence" is defined strictly as explicit metadata (e.g., "That is ungrammatical"), excluding statistical preemption or absence of expected constructions.
  *   **Domain:** Procedure (Claim about how learning signals are categorized).
  *   **Epistemic Status:** **Question-Begging / Stipulative.** This defines the problem away. If statistical absence allows the learner to penalize linear hypotheses, calling it "not negative evidence" is a semantic move rather than a substantive one.
  *   **Argumentative Utility:**
      *   *Job A (Control Condition):* **Neither.**
      *   *Job B (Nativism):* **Supports (Rhetorically).** Allows the arguer to claim "no negative evidence exists" even if the learner successfully uses distributional gaps to rule out hypotheses.

  ***

  **3. Analysis of the Maximum-Likelihood Objective**

  **Question:** *Is training by maximum likelihood (ML) on positive examples alone a form of negative evidence?*

  **Assessment:**
  This depends on whether negative evidence is characterized **data-relatively** or **update-relatively**.

  1.  **Data-Relative Characterization:** If negative evidence requires an explicit signal in the input stream marking a string as ill-formed, ML on positive data is **not** negative evidence. Your positive-only condition is, in this strict sense, on the same side of the line as the child. The corpus contains only $P(x) > 0$.
  2.  **Update-Relative Characterization:** If negative evidence is defined by the *effect* on the learner's hypothesis space, ML on positive data constitutes **Indirect Negative Evidence** (Statistical Preemption). Because the probability mass is normalized ($\sum P(x) = 1$), increasing the likelihood of observed structure-dependent forms necessarily decreases the likelihood of unobserved linear-order variants. In a corpus of realistic size, if a linear variant never appears in a context where a structure-dependent variant does, the model assigns it vanishingly low probability.

  **Verdict:**
  If we accept the update-relative definition (which is standard in modern probabilistic modeling), your positive-only condition *does* utilize a form of negative evidence (indirect/statistical). If your colleague insists on the data-relative definition (Reading 5 above), they are excluding statistical preemption by fiat. Since there is evidence that children are sensitive to statistical preemption (e.g., verb argument structure learning), the **update-relative** characterization is more cognitively plausible. Therefore, your positive-only condition is a valid model of a learner using indirect negative evidence, distinguishing it from a learner who literally cannot penalize unobserved hypotheses.

  ***

  **4. The "Kill Shot": Rendering the Simulation Irrelevant**

  **Question:** *If the colleague were compelled to choose the one reading that would legitimately render the simulation irrelevant to the nativism debate, which should it be, and what premises are missing?*

  **The Reading:**
  **Reading 3 (The Logical Necessity).** This is the only reading that directly targets the learnability claim (Job B) rather than just ecological validity (Job A).

  **Required Additional Premises:**
  To move from "Positive data is logically insufficient" to "Structure-dependence is innate," the colleague must supply premises regarding the **Hypothesis Space** and the **Learning Mechanism**:

  1.  **Hypothesis Space Premise:** The learner's initial hypothesis space *includes* linear-order rules (e.g., "Move the first auxiliary") as live candidates. If the architecture (e.g., a specific inductive bias in the neural net or the child's brain) makes linear hypotheses inaccessible or infinitely less probable *a priori*, the logical insufficiency of the data is irrelevant.
  2.  **Learnability Premise:** The learning procedure is equivalent to "Identification in the Limit" without strong inductive biases. If the model (or child) uses a Bayesian prior or an architectural bias that favors hierarchical structures over linear sequences (independent of the data), the "no negative evidence" argument fails.
  3.  **Input Premise:** The input data available to the child is insufficient to trigger statistical preemption against linear rules (e.g., the relevant contexts are too rare).

  **Conclusion:**
  The colleague's slogan collapses the distinction between **ecological invalidity** (children don't get explicit corrections) and **logical impossibility** (children couldn't learn it even with perfect statistical learning).
  *   To dismiss your **Control Condition**, they rely on **Reading 2** (Reliability/Ecology).
  *   To dismiss your **Positive-Only Condition** and support **Nativism**, they rely on **Reading 3** (Logical Necessity).

  However, Reading 3 only holds if they can prove that your sequence model's success is due to capacity overfitting rather than genuine generalization, or that the child's hypothesis space is fundamentally broader (more permissive of linear rules) than your model's. Without establishing the shape of the child's hypothesis space, the slogan "there's no negative evidence" remains an unsupported premise rather than a conclusion.

  ***

  **5. Closing Summary: Load-Bearing Readings**

  For the argument you encountered to hold, two specific readings must be simultaneously accepted, despite their tension:

  1.  **For Job A (Rejecting Control):** We must accept **Reading 2 (Reliability Skeptic)**. We must agree that explicit contrastive pairs are not available to the child with sufficient reliability to drive learning.
  2.  **For Job B (Supporting Nativism):** We must accept **Reading 3 (Logical Necessity)** coupled with **Reading 5 (Definitional Stipulation)**. We must agree that statistical preemption (indirect negative evidence) does not count as "evidence" sufficient to rule out linear hypotheses, *and* that the hypothesis space is not biased against linear rules by architecture alone.

  The colleague's error lies in treating these as a single monolithic fact. By separating them, we see that the control condition fails on ecological grounds, while the positive-only condition succeeds or fails on formal learnability grounds. Conflating the two prevents a precise evaluation of whether structure-dependence is learned via statistical preemption or innate constraint.
