  # Part 1: Activity Design and Facilitation Guide

  ## Activity Title: The Chain of Resonance

  ### Setup and Materials
  *   **Room:** 4-5 tables arranged in clusters (5-6 students per table).
  *   **Materials per Student:**
      *   3 Index Cards (White).
      *   1 Index Card (Red).
      *   1 Pen.
      *   1 Copy of the "Law of Resonance" Handout.
  *   **Materials for Instructor:**
      *   Timer.
      *   Whiteboard (for debrief only).

  ### The Handout: "The Law of Resonance"
  *Print this exactly as written. The ambiguity is in the bolded terms.*

  > **THE LAW OF RESONANCE**
  >
  > 1.  **The Weight:** Every Choice has a **Moral Weight**. Heavy choices (great harm or great aid) create strong Resonance. Light choices create weak Resonance.
  > 2.  **The Fit:** Every Experience assigned to an Agent must **Fit** the Moral Weight of the Choice that preceded it. A Heavy Choice requires a Heavy Experience. A Light Choice requires a Light Experience.
  > 3.  **The Chain:** The Agent who receives the Experience must be part of the **Causal Chain** started by the Choice. They need not be the same body, but the link must be unbroken.
  > 4.  **The Silence:** You cannot see the Choices made by others. You can only see the Experiences they endure.
  > 5.  **The Intervention:** You may choose to absorb another Agent's Experience. If you do, you must write a new Experience for yourself that Fits your act of Intervention.
  > 6.  **The Adjudication:** It is up to the table to decide if a Fit is true. There is no external score.

  ### Phase 1: The Weight and The Silence (Opacity)
  **Time:** 0:00 – 0:15 (15 minutes)
  **Action:**
  1.  Students take a White Card. Fold it in half.
  2.  **Inside:** Write a "Choice" (an action taken by an Agent). Do not sign it. Examples: "Stole bread to feed a sibling," "Lied to protect a friend," "Ignored a cry for help."
  3.  **Outside:** Write the "Experience" that Fits that Choice according to the Law. Examples: "Imprisonment," "Loss of trust," "Loneliness."
  4.  **Constraint:** The Experience must be written by the *same* student initially, but it must "Fit" the Choice based on their interpretation of the Handout.
  5.  **Collection:** Collect all cards. Shuffle them *visibly* (to mix origins, not to randomize outcomes—the outcomes are already written). Redistribute randomly so no one holds their own card.
  6.  **Realization:** Students look at the Experience on the card they hold. They see someone is suffering. They try to guess the Choice inside. They cannot open the card. They realize they cannot judge the moral status of the holder based on the visible suffering.
  **Intended Realization:** **Opacity.** Suffering is visible; Desert is not. Interpersonal judgment is impossible.

  ### Phase 2: The Intervention (Intervention)
  **Time:** 0:15 – 0:35 (20 minutes)
  **Action:**
  1.  Students place their current card on the table, Experience side up.
  2.  Distribute the **Red Cards**.
  3.  **Rule:** You may place your Red Card on top of another student's Experience to "Intervene."
  4.  **Cost:** If you Intervene, the original Experience is nullified. You (the Intervener) must take a new White Card and write an Experience for *yourself* that Fits the act of Intervention.
  5.  **Ambiguity:** The Handout does not say if Intervention is "Good" (merit) or "Neutral" (just another Choice). It does not say if the original debt is "Paid" or "Deferred."
  6.  **Discussion:** Tables must discuss whether to Intervene. Some will see it as obstructing Justice (Ledger). Some will see it as Compassion (Formation).
  7.  **Execution:** Students who choose to Intervene write their new self-consequence.
  **Intended Realization:** **Intervention.** Relieving suffering creates a new causal branch. Does this fix the universe or break it? The rules allow both interpretations.

  ### Phase 3: The Chain (Continuity)
  **Time:** 0:35 – 0:55 (20 minutes)
  **Action:**
  1.  Gather all cards (including Red Card interventions).
  2.  **The Swap:** Pass all cards to a *different* table. You are now holding the consequences of strangers you have never met.
  3.  **Task:** You are now the "Future Agent." Read the Experience on the card. You must write a *subsequent* Experience on the back that Fits the previous one.
  4.  **Constraint:** You must decide if you are the *same* Agent as the original writer (Phase 1) or a *new* Agent inheriting the causal chain.
  5.  **Conflict:** Table A might treat the card as a continuing biography (Formation). Table B might treat it as a transferable debt (Ledger). When cards circulate back or are discussed, these interpretations clash.
  6.  **Example:** If Phase 1 wrote "Imprisonment," Table C must write what comes next. "Release" (Debt paid)? Or "Resentment" (Character formed)?
  **Intended Realization:** **Continuity.** For the consequence to make sense, who is suffering? If it's a Ledger, anyone can pay. If it's Formation, it must be the same character. The game forces a choice without dictating it.

  ### Phase 4: Debrief
  **Time:** 0:55 – 1:20 (25 minutes)
  **Method:** Socratic circle. Do not lecture. Ask the following questions in order.

  1.  **Question:** "In Phase 1, you saw suffering but couldn't see the Choice. Did anyone feel unable to judge the person holding the card? Why?"
      *   **Good Answer:** "We couldn't know if they deserved it. The Law hides the balance sheet." (Opacity).
      *   **If Stuck:** Ask: "If you saw someone in pain, could you call them immoral based on these rules?"
  2.  **Question:** "In Phase 2, some of you Intervened. Did you feel like you were fixing a mistake or breaking a law?"
      *   **Good Answer:** "Fixing a mistake feels like Formation (changing the flow). Breaking a law feels like Ledger (blocking payment)." (Intervention).
      *   **If Stuck:** Ask: "If Karma is a law like gravity, is helping someone stand up interfering with gravity?"
  3.  **Question:** "In Phase 3, you received a card from strangers. Were you paying their debt, or living your own life?"
      *   **Good Answer:** "If I'm paying their debt, it's a Ledger. If I'm living the outcome of their character, I have to be them." (Continuity).
      *   **If Stuck:** Ask: "Can you suffer for someone else's crime? The rules said 'Causal Chain.' What is that chain made of?"
  4.  **Question:** "Look at the Handout. Did the rules tell you which way to play it?"
      *   **Good Answer:** "No. 'Weight' could be points or depth. 'Chain' could be accounts or identity."
      *   **If Stuck:** Have them read Rule 1 and 3 aloud. Highlight "Moral Weight" and "Causal Chain."
  5.  **Question:** "I am standing here enforcing the rules. Does that change what Karma is?"
      *   **Good Answer:** "Yes. You make it a verdict, not a law." (The Administrator Problem).

  ### Closing Note: What This Activity Cannot Stage
  **The Impersonal Law Problem:**
  You rightly worry that your presence as the facilitator ruins the "impersonal law" aspect of karma. In the game, *you* enforce the "Fit." In the theory, the universe enforces the Fit.
  *   **Does this ruin the exercise?** No. It provides a critical contrast.
  *   **What to say:** "Notice that I had to tell you if a 'Fit' was acceptable. In the Ledger view, a God might do this. In the Impersonal view, nothing does—it just happens. This game simulates the *structure* of desert, but it inevitably simulates the *administration* of justice. Real karma claims to work without an administrator. That is the hardest part to believe. This game worked because I was watching. Would it work if I left the room?"

  ---

