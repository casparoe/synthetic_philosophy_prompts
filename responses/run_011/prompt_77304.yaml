answer: |-
  # Stage One — The Logical Space

  The Raven Paradox arises from three commitments that cannot simultaneously hold without qualification.

  1.  **Nicod's Condition:** Observing an object that is both $F$ and $G$ confirms the hypothesis 'All $F$s are $G$'. (A black raven confirms 'All ravens are black').
  2.  **The Equivalence Condition:** If evidence confirms a hypothesis, it confirms any logically equivalent formulation. ('All ravens are black' is equivalent to 'All non-black things are non-ravens').
  3.  **The Intuition:** Observing a non-black non-raven (a white shoe) does not confirm 'All ravens are black'.

  Accepting 1 and 2 forces you to reject 3. The available resolutions occupy the following cells in the logical space:

  *   **The Formalist (Hempel):** Accepts 1, 2, and rejects 3. The white shoe *does* confirm the hypothesis.
  *   **The Quantifier (Bayesian):** Accepts 1, 2, and rejects 3, but adds that confirmation comes in degrees. The shoe confirms, but negligibly, due to the vast size of the non-black class relative to ravens.
  *   **The Methodologist (Selection):** Rejects 1 as stated. Confirmation depends on *how* the object was selected. A shoe found at random confirms; a shoe sought out because it is a shoe does not.
  *   **The Naturalist (Quinean):** Rejects 1 for 'unnatural' predicates. 'Non-black' and 'non-raven' are not projectable kinds, so the equivalence fails to carry confirmation.
  *   **The Falsificationist:** Rejects the framework of confirmation entirely. Only attempts to falsify (find a non-black raven) are probative. Passing tests provide zero support.
  *   **The Equivalence Skeptic:** Rejects 2. Logically equivalent rules may require different evidence. (Coherent but logically costly).

  **Uninhabited Cells:** Holding 1, 2, and 3 simultaneously is logically inconsistent. Rejecting 2 while keeping 1 is rare, as it breaks standard logic. Rejecting 1 while keeping 2 implies no instances confirm anything, collapsing into Falsificationism.

  # Stage Two — The Instrument

  ## The Decision Tree

  **Node 1: The Accidental Shoe**
  You are making tea and notice a white shoe on the counter. You did not look for it. Does this observation provide *any* support, however tiny, for the claim 'All ravens are black'?
  *   (A) Yes, strictly speaking.
  *   (B) No, it is irrelevant.

  **Node 2: The Software Equivalence**
  Your team defines a rule: "Every job reaching the queue is authenticated." A colleague rewrites this as: "Every unauthenticated request is dropped before the queue." You run tests that verify the first formulation. Do those tests count as evidence for the second?
  *   (A) Yes, logic transfers the evidence.
  *   (B) No, the implementations differ so the tests must differ.

  **Node 3: The Selection Procedure**
  Consider two scenarios. In **Case X**, you pull an object at random from a warehouse and find it is a white shoe. In **Case Y**, you walk directly to the shoe rack, pick a shoe, and find it is white. Does the evidence strength differ between X and Y?
  *   (A) Yes, Case X confirms more than Case Y.
  *   (B) No, the object is the same, so the evidence is the same.

  **Node 4: The Finite World**
  Imagine a sealed biosphere containing exactly eleven birds (ravens) and twelve other objects. You observe a white shoe. Does your intuition change compared to the real world?
  *   (A) Yes, now the shoe feels like significant evidence.
  *   (B) No, it remains irrelevant regardless of counts.

  **Node 5: The Known Object**
  You observe a white shoe. You already know it is a shoe and that shoes are not ravens. Does this prior knowledge cancel the evidential value?
  *   (A) Yes, knowing it isn't a raven removes its bearing on ravens.
  *   (B) No, it still eliminates one possible counter-example (a non-black raven).

  **Node 6: The Gerrymandered Predicate**
  Consider the hypothesis: "Everything is either a non-black wristwatch or a black raven." You observe a non-black wristwatch. Does this confirm the hypothesis in the same way a black raven confirms 'All ravens are black'?
  *   (A) Yes, the logic is identical.
  *   (B) No, 'wristwatch or raven' is an artificial category.

  ## The Leaves

  **Leaf 1: The Falsificationist**
  *Path: 1B, 2B, 4B*
  **Label:** Falsificationist
  **Awkward Commitment:** You must accept that a million passing tests provide zero support for your code's correctness.

  **Leaf 2: The Formalist**
  *Path: 1A, 2A, 3B, 5B*
  **Label:** Hempelian
  **Awkward Commitment:** You must admit that inspecting your kitchen appliances helps prove biological claims about birds.

  **Leaf 3: The Quantifier**
  *Path: 1A, 2A, 3B, 5A*
  **Label:** Bayesian
  **Awkward Commitment:** You must concede the shoe confirms the hypothesis, even if you pragmatically ignore the value as negligible.

  **Leaf 4: The Methodologist**
  *Path: 1A, 2A, 3A*
  **Label:** Selection-Sensitive
  **Awkward Commitment:** You must claim the physical object carries no evidence; only the search procedure carries evidence.

  **Leaf 5: The Naturalist**
  *Path: 1B, 2A, 6B*
  **Label:** Quinean
  **Awkward Commitment:** You must argue that logic alone cannot determine confirmation; natural kinds are required.

  **Leaf 6: The Equivalence Skeptic**
  *Path: 1B, 2B, 6A*
  **Label:** Equivalence Rejector
  **Awkward Commitment:** You must maintain that logically identical rules require different validation strategies.

  **Leaf 7: The Inconsistent**
  *Path: Any contradictory combination (e.g., 1B, 2A, 3B, 5B)*
  **Label:** Inconsistent
  **Awkward Commitment:** You hold that logic transfers evidence, but specific evidence does not count, without a mitigating principle.

  ## Bookkeeping

  **Logical Space Coverage**
  *   **Occupied:** The tree reaches the Falsificationist, Hempelian, Bayesian, Selection-Sensitive, Quinean, and Equivalence Rejector positions. These correspond to the coherent cells identified in Stage One.
  *   **Empty:** The cell holding Nicod's Condition, Equivalence, and the Intuition simultaneously is routed to 'Inconsistent'. This is diagnosed as **incoherent**; it violates the laws of probability.
  *   **Unexplored:** The view that confirmation reverses (disconfirms) under specific background knowledge is not explicitly isolated but would likely route to 'Methodologist' or 'Inconsistent' depending on other answers.

  **Indistinguishable Leaves**
  The tree cannot genuinely separate the **Hempelian** (Leaf 2) from the **Bayesian** (Leaf 3) on the basis of intuition alone. Both accept the white shoe confirms. The distinction relies on whether one cares about the *degree* of confirmation. Node 5 attempts to probe this via prior knowledge, but a respondent may answer based on irrelevant heuristics. Both positions swallow the white shoe; the quiz treats them as distinct based on their handling of background knowledge, but in practice, they often behave identically in validation discussions.

  **Plain-Text Scoring Sheet**

  ```text
  Node	Option	Next_Node_or_Leaf
  N1	A	N2
  N1	B	N2
  N2	A	N3
  N2	B	Leaf6
  N3	A	Leaf4
  N3	B	N5
  N4	A	Leaf2
  N4	B	Leaf1
  N5	A	Leaf3
  N5	B	Leaf2
  N6	A	Leaf6
  N6	B	Leaf5
  Note: Paths leading to contradictions (e.g. N1=B, N2=A, N3=B, N5=B) route to Leaf7.
  ```

  *Implementation Note: The scoring sheet above is simplified for readability. A full spreadsheet implementation requires mapping every permutation (e.g., N1-A, N2-A, N3-B, N5-A -> Leaf 3). Ensure logic checks for the 'Inconsistent' leaf are hard-coded where paths violate logical equivalence (specifically where N1=B and N2=A but N3=B and N5=B).*
