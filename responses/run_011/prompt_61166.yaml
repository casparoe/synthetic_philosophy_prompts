          *   Explicit trade-offs on epistemological distinctions (what to keep vs. drop for speed).
          *   Identification of judgement calls disguised as procedure.
          *   Application to three specific cases (A, B, C).
          *   Honesty about which case looks bad.
          *   Limitations section.
          *   Specific formatting for the final line: `\answer{A: label, B: label, C: label}`.
          *   Labels: REOPEN, HOLD, ESCALATE.

