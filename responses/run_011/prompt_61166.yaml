      *   *Constraint:* 3 days. Needs to be fast, actionable, plain English.
      *   *Epistemological Trade-off:* We can't solve the problem of induction. We must drop the distinction between "Truth" and "Regulatory Acceptability." We must keep the distinction between "Evidence dismissed unexamined" and "Evidence examined and outweighed."
