  # Challenge Triage Protocol (CTP) v1.0

  **Owner:** Model Validation Lead  
  **Audience:** Validators, Model Oversight Committee (MOC)  
  **Turnaround:** 3 Working Days  
  **Purpose:** To assess challenge memos without relying on the infallibility of prior validation. This procedure treats prior sign-off as *provisional*, not final. It forces engagement with new evidence rather than dismissal by authority.

  ## 1. Epistemological Trade-Offs (Read First)
  To make this runnable in three days, we are making specific philosophical sacrifices. You need to know what they are so you don't misuse the tool.

  *   **What We Drop:** The distinction between "The Model is True" and "The Model is Approved." We do not care if the model is ontologically correct. We care if the *challenge* constitutes a **defeater** for our current justification to use it.
  *   **What We Drop:** The distinction between "Ignoring Evidence" and "Weighing Evidence." Under this protocol, you *must* look at the evidence to dismiss it. You cannot dismiss it because it contradicts the past. You dismiss it only if, *after looking*, it is demonstrably irrelevant or flawed.
  *   **What We Keep:** The distinction between **Fact** (Data, Documentation, Code) and **Appetite** (Risk tolerance, Policy interpretation). Validators decide Facts. The Committee decides Appetite.
  *   **The Cost:** This procedure will generate more work than our old habit. It will flag uncertainty as a risk (ESCALATE) rather than hiding it.

  ## 2. The Procedure (The Five Questions)
  Run these questions in order. Do not skip. If you answer "No" to Q1 or Q2, you may HOLD. If you answer "Unknown" to Q3, you must ESCALATE.

  **Q1: Is this *new* information?**
  *   *Ask:* Was this data, logic, or observation available and considered during the last validation sign-off?
  *   *Sufficient Answer for "Yes":* "This data covers quarters subsequent to sign-off," or "This documentation gap was not in the inventory at sign-off."
  *   *Insufficient Answer:* "The business feels differently now," or "We just noticed this old file." (If the file existed, it's not new).
  *   *Exit:* If **No**, issue **HOLD**. (Rationale: This is a re-litigation of settled facts, not a challenge).

  **Q2: Is the potential impact *material*?**
  *   *Ask:* If the challenger is right, does it breach a regulatory limit, a risk appetite statement, or cause financial loss > £[Threshold]?
  *   *Sufficient Answer for "Yes":* "Capital requirement changes by >5%," or "Documentation breach violates Policy X."
  *   *Insufficient Answer:* "The model is more accurate," (without quantifying impact).
  *   *Exit:* If **No**, issue **HOLD**. (Rationale: The challenge is valid but immaterial).

  **Q3: Can we verify the claim within 3 days?**
  *   *Ask:* Do we have the data, access, and expertise to prove them right or wrong *now*?
  *   *Sufficient Answer for "Yes":* "We can re-run the backtest," or "We can trace the input lineage."
  *   *Sufficient Answer for "No":* "Data is held by a third party," or "Requires deep forensic code review."
  *   *Exit:* If **No**, issue **ESCALATE**. (Rationale: **Crucial Step.** This is where we avoid dogmatism. We admit we don't know. We do not assume we are right. We pass the uncertainty to the Committee).

  **Q4: Does the evidence *defeat* the prior justification?**
  *   *Ask:* Assuming the challenger's evidence is true, does it break the logic used to approve the model originally?
  *   *Sufficient Answer for "Yes":* "The model assumes X, evidence proves Not-X."
  *   *Insufficient Answer:* "The model is less accurate than a competitor." (Unless accuracy is a mandated requirement).
  *   *Exit:* If **No**, issue **HOLD**. (Rationale: Evidence is new and material, but does not invalidate the model's specific design intent).
  *   *Exit:* If **Yes**, issue **REOPEN**. (Rationale: The model's validation status is compromised).

  **Q5: (Only if Q4 is Yes) Is the fix a model change or a documentation change?**
  *   *Ask:* Do we change the numbers/logic, or just the manual?
  *   *Exit:* If Logic/Numbers -> **REOPEN**. If Docs/Policy -> **ESCALATE** (Committee must accept the governance failure).

  ## 3. Exit Definitions
  *   **HOLD:** The challenge is rejected. The model status remains **Approved**. You must attach the evidence showing *why* the new evidence was examined and found insufficient. (e.g., "We ran the test; the deviation is within tolerance.")
  *   **REOPEN:** The challenge is accepted. The model status moves to **Under Review**. Work is assigned to Model Development or Validation to fix the specific defect.
  *   **ESCALATE:** The challenge is plausible but unresolved, or the fix requires policy change. The model status moves to **Conditional**. The MOC must decide whether to accept the risk or restrict the model.

  ## 4. Judgement Calls Disguised as Procedure
  Be aware: You are still making human judgements. The procedure does not remove liability.
  1.  **Materiality (Q2):** The £ threshold is arbitrary. You must judge if a reputational risk outweighs a financial one.
  2.  **Verification Feasibility (Q3):** You decide if 3 days is enough. If you say "Yes" and you're wrong, you are back to the Dogmatism trap. Err on the side of ESCALATE.
  3.  **Defeat Condition (Q4):** You decide if a deviation breaks the *logic* or just the *calibration*. This is the hardest technical call.

  ---

  ## 5. Application to Live Memos

  ### Memo A: Portfolio Manager (PD Model Drift)
  *   **Q1 (New Info?):** **Yes.** 11 consecutive quarters of arrears data post-validation.
  *   **Q2 (Material?):** **Yes.** PD drives capital calculation. Systematic pessimism ties up capital unnecessarily.
