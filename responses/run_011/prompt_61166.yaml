  ## 6. Limitations of This Procedure
  This procedure is a triage tool, not a truth machine. It will systematically fail in the following ways:
  1.  **Slow Drift:** It relies on challenges. If no one challenges a model that drifts slowly over 5 years, this procedure never triggers. It is reactive, not proactive.
  2.  **The "Unknown Unknown":** It cannot handle challenges about risks we don't have concepts for yet (e.g., a new type of fraud). Q1 will filter these as "Not New" or "Immaterial" until it's too late.
  3.  **Resource Gaming:** Challengers know that ESCALATE burdens the Committee. They may frame minor issues as "Unverifiable" to force an ESCALATE and delay your pipeline.
  4.  **The "Safe" Bias:** Validators will naturally lean towards REOPEN to avoid blame. This procedure does not stop risk-aversion; it just makes it explicit.

