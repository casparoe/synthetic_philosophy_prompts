answer: |-
  | id | requirement | motivating case(s) | status | which family of definition it strains or rules out |
  | :--- | :--- | :--- | :--- | :--- |
  | 1 | **Bivalence** | The payload output is a boolean flag; the downstream system cannot act on probabilities or degrees of life. | Non-negotiable (Engineering) | **Cluster/Functionalist:** These typically yield a score or degree of "aliveness" (e.g., 7/8 criteria met). Forcing a threshold arbitrary converts a continuum into a binary, increasing false positives/negatives. |
  | 2 | **Individual-Level Assignment** | The classifier must verdict a specific sample object at a specific time, not a lineage or ecosystem. | Non-negotiable (Engineering) | **Evolutionary:** Evolution is a property of populations over generations, not individuals at a time. A mule is alive but cannot evolve; a single bacterium is alive but evolution is unseen until replication. |
  | 3 | **Operationalizability (Ahistorical)** | The system must decide based on onboard sensor data (snapshot or limited soak), not the object's origin story or ancestry. | Non-negotiable (Engineering) | **Evolutionary:** Requires knowledge of descent and history. **Origin-Neutral Functionalist:** A self-replicating machine built yesterday fits the functional profile but fails the historical criterion of natural selection. |
  | 4 | **Dormancy Tolerance** | Must classify cryptobiotic spores or dormant seeds as "alive" despite zero energy throughput or metabolism during measurement. | Non-negotiable (Biological Reality) | **Metabolic/Thermodynamic:** Definitions relying on active energy dissipation, homeostasis, or self-maintenance fail when the system is thermodynamically indistinguishable from dead matter. |
  | 5 | **Reproduction Independence** | Must classify sterile individuals (mules, sterile worker ants, post-menopausal humans) as "alive" despite inability to replicate. | Non-negotiable (Biological Reality) | **Strict Replicative:** Definitions requiring actual reproduction or potential for replication exclude sterile castes and individuals, contradicting common biological classification. |
  | 6 | **Origin Neutrality** | Must detect life regardless of whether it arose via Darwinian evolution or was engineered/built (e.g., synthetic self-replicating machines). | Negotiable (Camp-Specific) | **Evolutionary:** Explicitly excludes synthetic life or created artifacts. **Functionalist:** Accepts them if behavior matches. This requirement forces a choice between "natural history" and "capacity." |
  | 7 | **Virus Resolution** | Must definitively classify viruses, viroids, or prions as either alive or not alive to avoid ambiguous payload states. | Negotiable (Linguistic Prejudice) | **All Families:** Viruses sit on every boundary (metabolic, evolutionary, structural). Insisting on a boolean here may enforce an arbitrary linguistic boundary rather than a physical one, as your colleague suggests. |

  Your hypothesis is correct: Bivalence, Individual-Level Assignment, and Operationalizability are jointly unsatisfiable for a robust definition of life. You can enforce Bivalence and Individual-Level assignment, but only by adopting ahistorical proxies (metabolic or structural) that fail on dormant cases or abiotic false positives; alternatively, you can adopt the robust Evolutionary definition, but it violates Individual-Level assignment (it applies to lineages) and Operationalizability (it requires historical data unavailable in a single sample). The engineering constraint forces you to choose between a definition that is operationally decidable but theoretically fragile, or theoretically robust but operationally impossible.

  Regarding the definition families: **Evolutionary** definitions score highest on theoretical robustness but fail Operationalizability and Individual-Level assignment completely. **Self-Maintenance (Autopoietic)** definitions handle Individual-Level assignment well but fail Dormancy Tolerance (spores look dead) and Virus Resolution. **Thermodynamic** definitions are highly Operationalizable but fail to distinguish complex abiotic dissipative structures (e.g., hurricanes, chemical gardens) from life without historical context. **Cluster/Functionalist** definitions handle the hard cases best by flexibility but fail Bivalence unless arbitrary thresholds are imposed.

  The single requirement that eliminates the most robust candidates is **Operationalizability (Ahistorical)**. It immediately disqualifies the Evolutionary definition, which is the only framework capable of naturally excluding complex abiotic chemistry and synthetic machines without relying on Earth-specific biochemical biases. By requiring a verdict based on local measurements rather than lineage history, you force the classifier to rely on correlates of life rather than the defining mechanism of life itself.
