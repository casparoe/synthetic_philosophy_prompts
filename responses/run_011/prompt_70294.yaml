      *   *The "Composite Monarch":* Aristotle often analogises the many to a single entity. If the many ignore law and follow decrees driven by passion/orators, they act like a tyrant (monarch) but made of many parts. It's about the *will* being unified by passion rather than reason/law.
      *   *Demagogues:* They rise because the people are swayed by rhetoric rather than fixed rules. The demagogue controls the *source* of the decision (public opinion), effectively controlling the outcome.
      *   *Law vs. Decree:* For Aristotle, law (*nomos*) is general, stable, and reasoned. Decree (*psephisma*) is particular, transient, and often reactive. A decree targets a specific situation/person. A universal rule must apply to future cases too.
      *   *Constitution (*politeia*):* A constitution *is* the arrangement of offices and the rule of law. If law doesn't rule, there is no structure, just force/will. Hence, "not a constitution at all."

  3.  **Address Question 1: The "Single Composite Monarch" & Demagogues:**
      *   *Monarch:* It's not just about accountability. It's about the *nature of the will*. A tyrant acts on whim. A lawless multitude, stirred by a speaker, acts on collective whim. They function as one body (*hen ti*), but that body is driven by appetite, not reason.
      *   *Demagogues:* It's primarily a power observation with an epistemic underpinning. The demagogue shapes reality for the people. If the people believe X, and the demagogue makes them believe Y, the demagogue rules. It's about who holds the *effective* sovereignty.

  4.  **Address Question 2: Decree vs. Law (Universal Rule):**
      *   *Aristotle's View:* Law is universal (applies to classes of people/actions). Decrees are particular (apply to specific instances).
      *   *The "Impossible" Claim:* You can't generalise a specific command. If I vote "Socrates must drink hemlock," that's a decree. It can't guide future cases unless it becomes a law ("All corrupters of youth..."). But if the assembly keeps voting specific outcomes, there's no predictability.
      *   *Procedure vs. Content:* For Aristotle, they are linked. Law requires deliberation and stability. Decrees are immediate. The distinction is both procedural (how it's passed) and substantive (generality).

  5.  **Address Question 3: Democratic Backsliding (The Big One):**
      *   *The Problem:* Modern autocrats use legal forms (parliamentary majorities, referendums) to destroy liberal substance. Aristotle says "where laws do not govern there is no constitution."
      *   *Does Aristotle's test fail?* Not necessarily. We need to distinguish between *formal legality* and *constitutionalism*.
      *   *Aristotle's Grip:* Aristotle cares about the *spirit* of the law (reason, stability, common good) vs. the *will* of the moment. If a majority amends the constitution to entrench power permanently, they are treating the constitution as a decree (a tool for immediate will) rather than law (a framework for enduring order).
      *   *Key Concept:* The "Rule of Law" vs. "Rule of Men." Even if the "Men" use legal paperwork. If the fundamental rules change constantly to suit the ruler's whim, it's effectively decree-rule.
      *   *Application:* Court-packing changes the *application* of law to suit the moment. Constitutional replacement to remove checks turns the constitution into a tool of the majority's will, not a constraint on it. Aristotle would likely call this a form of tyranny (or "extreme democracy" which resembles tyranny).

