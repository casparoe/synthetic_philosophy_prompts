answer: |-
  This is a superb passage to grapple with. You have hit upon one of the central tensions in political theory: the distinction between *procedural* legality and *constitutional* legitimacy. Aristotle is drawing a line between a polity governed by reason (law) and one governed by appetite (decrees), even if both look like 'democracies' from the outside.

  Here is an analysis of the three points you raised, keeping in mind the Rackham translation and the broader context of the *Politics*.

  ### 1. The 'Single Composite Monarch' and the Demagogue

  **The Composite Monarch**
  When Aristotle describes the multitude as a "single composite monarch," he is not primarily making a point about accountability, nor strictly about the inability to deliberate (though that is part of it). He is making a point about the **unity of will**.

  In a lawful democracy, the citizens are distinct individuals bound together by a shared, external standard (the law). They are sovereign *under* that standard. However, in this 'extreme' democracy, the multitude ignores the law and acts on immediate collective impulse. When they do this, they cease to function as a deliberative body of individuals and instead function as a single entity driven by a singular passion.

  Aristotle often analogises the many to a single man. If that single man rules without law, he is a tyrant. Therefore, a multitude ruling without law is a "composite tyrant." The 'composite' nature means they are many bodies, but the 'monarch' nature means they possess one undivided, lawless will. It is a warning that mob rule is structurally identical to tyranny; the only difference is the number of people holding the whip.

  **Sovereignty over Opinion**
  Regarding the demagogue being "sovereign over the opinion of the people," this is both a power observation and an epistemic worry, but the power dynamic is primary.

  Aristotle views the demagogue not merely as a speaker, but as the *mind* of the collective monarch. If the multitude is sovereign, but the multitude is easily swayed by rhetoric, then the person who controls the rhetoric effectively controls the sovereign.
  *   **Power:** The demagogue holds the keys to the state because the state's mechanism (the assembly) runs on persuasion.
  *   **Epistemic:** There is an underlying worry here about truth. In a lawful state, the 'truth' of what is just is embedded in the long-standing customs and statutes. In a decree-based state, 'truth' is whatever the assembly can be convinced of today. The demagogue thrives because there is no objective standard (law) against which to check his claims. He creates the reality the people believe in.

  ### 2. Why a Decree Cannot be a Universal Rule

  This distinction rests on the Greek difference between *nomos* (law) and *psephisma* (decree). For Aristotle, this is a distinction of both **content** and **function**, not merely procedure.

  *   **Generality:** A law (*nomos*) deals with classes of things and types of people. It says, "If anyone does X, Y shall happen." A decree (*psephisma*) deals with particular instances. It says, "Alcibiades shall be exiled."
  *   **Time:** Law is intended to be stable and endure for the future. A decree is reactive to the immediate circumstance.

  Aristotle claims it is "impossible for a voted resolution to be a universal rule" because a resolution is, by definition, an act of will regarding a specific matter. You cannot generalise a specific command without turning it into a standing rule. If the assembly votes on case-by-case outcomes, there is no predictability.

  The deeper philosophical point is that **law represents reason without passion**, whereas **decree represents appetite**. A universal rule requires one to think ahead about justice in the abstract. A decree allows one to satisfy a desire in the moment. If you try to make a decree a universal rule, it collapses, because the next time the situation arises, the assembly's mood may have changed. Therefore, a state run by decrees has no consistent 'constitution' (*politeia*); it has only a series of momentary commands.

  ### 3. Application to Democratic Backsliding

  This is the most critical question for your interests. You ask: if a government acts 'by law' (e.g., passing a new constitution via parliamentary majority), does Aristotle's test fail to bite?

  The short answer is: **No, Aristotle's test still bites, but you must look at the *status* of the law, not just its *form*.**

  Aristotle's criterion is not "did they vote on it?" but "does the law rule, or do men rule?" Modern democratic backsliding often involves using legal forms to achieve lawless ends. Here is how an Aristotelian analysis would apply to your examples:

  **A. Replacing the Constitution Wholesale**
  If a majority replaces a constitution not to refine the framework of justice, but to entrench their own power permanently, Aristotle would argue they are treating the constitution as a **decree**, not a **law**.
  *   For Aristotle, a constitution is the arrangement of offices that allows the state to endure. It is the 'life' of the state.
  *   If the majority changes the fundamental rules simply to ensure they remain in power, they are treating the constitution as an instrument of their immediate will (a decree) rather than a constraint on all citizens (a law). They are acting as the 'composite monarch' rewriting the rules to suit their whim.

  **B. Court-Packing**
  This is a clear case of the decree overriding the law. The judiciary represents the application of standing law. By packing the courts, the executive/legislature ensures that the *application* of the law aligns with their current political will.
  *   Aristotle would see this as making the judges subservient to the assembly's mood. If the interpretation of the law changes to suit the rulers, then the law is not sovereign; the rulers are.

  **C. Referendums to Overrule Judges**
  This is the quintessential "decree over law" scenario. If a specific judicial ruling (based on existing law) is overturned by a popular vote, the multitude has declared itself sovereign over the law.
  *   Aristotle explicitly warns against this in your passage. He says where "decrees of the assembly over-ride the law... demagogues arise."
  *   Even if the referendum is 'legal' under the current rules, if it is used to bypass the protective, deliberative function of legal institutions, it functions as a decree. It is the multitude acting as a single will to punish or reward specific outcomes, rather than upholding a universal standard.

  **The 'Rule of Law' vs. 'Rule by Law'**
  Aristotle helps us distinguish between the *Rule of Law* (where law binds the rulers) and *Rule by Law* (where rulers use law as a tool).
  *   In the backsliding cases you mention, the government is engaging in **Rule by Law**. They are using the *form* of legality to enact the *substance* of arbitrary will.
  *   Aristotle's test asks: **Is the law sovereign, or is the majority sovereign?** If the majority can change the fundamental rules at will to suit their interest, the law is not sovereign. The majority is.
  *   Consequently, Aristotle would likely classify such a regime not as a 'polity' or even a 'good democracy', but as a deviant constitution resembling tyranny, precisely because the "laws do not govern."

  **Summary for your analysis**
  Do not let the modern obsession with 'legality' (was the procedure followed?) obscure Aristotle's point about 'legitimacy' (is the law master, or servant?). If a majority amends the fundamental rules to remove checks on its own power, it is acting as Aristotle's "composite monarch." It is issuing a series of decrees dressed up as laws. The test does not fail; it simply requires you to look past the parliamentary vote to the *function* of the legislation. If the legislation serves to make the rulers unaccountable, it is, in Aristotelian terms, lawless.

  I hope this helps clarify the text and its application to your work. It is a dense passage, but remarkably prescient regarding the fragility of constitutional order.
