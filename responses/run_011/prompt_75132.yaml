prompt: |-
  You're a philosopher of biology who's also shipped real software — treat this as a translation job, not a lecture. Think it through carefully and brainstorm candidate mappings before you commit to any of them.

  At the pub last night I had a two-hour argument with a mate who does systematics. I'm a release engineer — semantic versioning, package registries, dependency resolution, all day every day — and I argued that species identity is the same kind of thing as package identity: there's no fact of the matter about whether something that's drifted this far is 1.4.9 or 2.0.0, you just pick whatever boundary keeps downstream compatibility workable. He said that's exactly backwards, that gene flow puts a real seam in the world and packages have nothing like it.

  Restate his side as faithfully as you can in my vocabulary: semver and major/minor/patch bumps, forks and branches, monorepos, API compatibility, deprecation windows, vendoring. I want the biological species concept, the phylogenetic/diagnosabilty one, the ecological niche one, and that claim he kept coming back to — that species are individuals rather than kinds — which I couldnt get any grip on at all in my terms.

  Then the part I actually want: what breaks. For each, say what maps cleanly, what you had to bend out of shape, and what has no counterpart in versioning whatsoever. Handle two cases explicitly, because I threw both at him and he didn't think either one landed. Ring species — each neighbouring population interbreeds with the next but the two ends don't; my version being a chain of releases each API-compatible with its neighbour and not with the far end, so where does the major bump go? And bacteria swapping genes sideways, which I said was just vendoring with extra steps.

  Finally, don't be diplomatic about it: does the stuff that breaks show my vocabulary is missing something (code is designed, not descended, so obviously there's no gene flow), or does it show his confidence in real seams was overblown?
