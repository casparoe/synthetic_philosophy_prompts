      *   *No Counterpart:*
          *   *Selection Pressure.* Code doesn't die because it's bad at surviving; it dies because maintainers get bored or requirements change. There's no "predator" package eating a "prey" package (unless we count supply chain attacks, but that's different).
          *   *Blind Variation.* Commits are intentional. Mutations are random.

  4.  **Handle Edge Cases:**

      *   *Ring Species:*
          *   *Biology:* A -> B -> C -> D. A breeds with B, B with C, C with D. A does not breed with D. Are A and D same species?
          *   *Software:* Library v1.0 is compatible with 1.1. 1.1 with 1.2. 1.2 with 2.0. But 1.0 is *not* compatible with 2.0.
