      *   *Ecological Niche Concept:* Species occupy a specific adaptive zone.
          *   *Software Translation:* Runtime environment / Deployment context. A package built for serverless lambda functions vs. one built for embedded IoT. If it runs in the same "environment" and solves the same "problem space," it's the same species.
      *   *Species as Individuals (Ghiselin/Hull):* Species are spatiotemporally localized entities, not abstract classes. A species has a birth (speciation) and death (extinction).
          *   *Software Translation:* This is the hardest one. Packages are usually abstract types (kinds). But a *deployment* or a *running instance* is an individual. Or, perhaps, the *Repository* itself is the individual, evolving over time. A package name on npm is a class; the specific graph of contributions and forks over time is the individual. Let's refine: The *Lineage* is the individual. `react` on npm is a class. The specific history of the `facebook/react` repo is the individual.

