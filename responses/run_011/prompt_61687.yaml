answer: |-
  **Project Title:** The Constructivism of Latent Knowledge: Elicitation, Representation, and the Guidance Condition

  **Principal Investigator:** [Name], PhD Candidate, Department of Philosophy

  **Project Summary**
  Recent work in machine learning suggests that large language models possess "latent knowledge": information stored within their internal states that does not appear in their default outputs but can be recovered through specific elicitation techniques. These techniques range from linear probes over internal activations to adversarial debate formats. The prevailing assumption is that these methods discover pre-existing internal facts. This project challenges that assumption. I propose that "latent knowledge" currently conflates three distinct claims: that an internal state carries information; that the system can be forced to track that information under elicitation; and that the system is disposed to act on it without pressure. My central research question is: *Does the content recovered by elicitation techniques represent a stable internal property of the system, or is it a relational artefact constructed by the probe itself?*

  **Theoretical Context and Research Question**
  Three standard positions dominate the current discourse, yet each leaves my central question unresolved. The intentional-realist view treats recovered information as genuine belief-like states. This view assumes that successful elicitation proves existence, bypassing the possibility that the probe constructs the very state it measures. The behaviorist view holds that only input-output dispositions are real, dismissing internal talk as decoration. While this avoids the trap of over-ascribing mental states, it fails to distinguish between a system that knows but hides information and one that only simulates knowledge when pressured. Finally, the deflationary view argues that these phenomena are merely prompt-sensitivity wearing a lab coat. While skeptical, this view often lacks the technical granularity to explain why certain elicitation methods succeed where others fail.

  All three positions assume a determinate fact of the matter regarding what the model "knows." However, if the content recovered varies significantly with the probe used, there may be no such fact. The philosophical work lies in determining whether the failure to elicit information without a specific probe indicates a limitation of our tools or the absence of the knowledge itself.

  **The Guidance Condition**
  To resolve this, I will focus on a specific sub-question: Should a claim of latent knowledge be required to satisfy a *Guidance Condition*? This condition stipulates that for information to count as knowledge held by the system, it must be available to steer the system's own behavior in the absence of the eliciting probe. 

  This raises a sharp problem for text-generation systems. If a model only outputs truthful information when forced into a specific format (e.g., a multiple-choice constraint or a fictional framing) but reverts to falsehoods in free generation, does it "know" the truth? If the Guidance Condition is necessary, many current claims of latent knowledge collapse. If it is not necessary, we risk attributing knowledge to systems that are merely capable of mimicry under constraint. I will investigate whether meeting this condition is possible for a system whose only behavior is text production, or whether meeting it trivializes the condition by reducing "guidance" to mere token prediction consistency.

  **Methodology**
  This project will proceed over four months, combining conceptual analysis with the design of technical evaluation criteria.

  *Month 1: Conceptual Taxonomy.* I will map the existing literature on elicitation techniques, categorizing claims by whether they rely on internal state access (probes), behavioral output under constraint (forced choice), or unprovoked generation. I will identify where authors slide between these categories without justification.

  *Month 2: Designing the Discrimination Test.* I will design a concrete evaluation logic to discriminate between genuine retrieval and probe-induced construction. The design involves a "probe-ablation" scenario: if a model passes an elicitation test but fails to utilize that information to resolve ambiguity in a subsequent, unprovoked generation task, the knowledge is likely constructed rather than retrieved. I will specify the technical conditions under which this test is valid, drawing on my background in machine learning to ensure the design is implementable.

  *Month 3: Case Study Analysis.* I will apply this framework to prominent existing case studies from the literature (described by technique rather than citation). I will analyze whether these studies satisfy the Guidance Condition or merely demonstrate elicitation capacity. I will also document the conditions under which no such design could be run—for instance, if the model's architecture makes internal states inaccessible to the behavioral output layer without explicit probing.

  *Month 4: Synthesis and Writing.* I will draft the workshop paper, focusing on a worked distinction between "latent capacity" and "latent knowledge." The goal is a diagnostic tool for researchers to classify their claims precisely.

  **Why Instrumentation Is Insufficient**
  A reviewer with an experimental background might argue that this conceptual ambiguity will dissolve once we have better evaluation metrics or more transparent models. This objection misunderstands the nature of the problem. Instrumentation measures correlation and performance; it does not determine constitution. Running more evals can tell us *that* a model outputs truth under condition X, but it cannot tell us *why*. 

  Consider a lock that opens only for a specific key. Better instrumentation can tell us the precise tumblers moving inside, but it cannot tell us whether the lock was designed to hold valuables or merely to simulate holding them. Similarly, observing that a probe activates a specific vector associated with truthfulness does not prove the vector represents a belief rather than a switch triggered by the probe's syntax. The question is not whether we can measure the phenomenon, but how we categorize it. Without philosophical clarity on what constitutes "knowledge" versus "elicited performance," improved instrumentation will only yield more precise data about an ill-defined target. We risk optimizing for the appearance of knowledge rather than its presence.

  **Success, Failure, and Limitations**
  A successful result will be a worked distinction that allows researchers to classify elicitation claims into those that satisfy the Guidance Condition and those that do not. I aim to produce a diagnosis of which published claims trade on which sense of "knowledge," clarifying where safety assurances based on latent knowledge are robust and where they are fragile.

  The project fails if I cannot articulate a non-trivial version of the Guidance Condition that applies to text generators. If the condition turns out to be impossible for such systems to meet, or if meeting it reduces to something trivial (like consistent token prediction), I will argue that "latent knowledge" is the wrong vocabulary for this phenomenon.

  I must be honest about limitations. Four months is sufficient to clarify the conceptual landscape and design the evaluation logic, but it is too little time to implement large-scale empirical tests of the proposed discrimination design. Furthermore, this project cannot resolve the broader safety implications of deceptive alignment; it can only clarify the vocabulary we use to discuss them. If the ambiguity of "latent knowledge" is deeper than I suspect—rooted in unresolved problems in the philosophy of mind regarding disposition versus occurrence—this project will expose that depth rather than solve it. This exposure is itself a valuable outcome, preventing the field from building safety cases on conceptual sand.
