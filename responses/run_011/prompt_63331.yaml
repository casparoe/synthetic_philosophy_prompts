          *   Rating: Partly right (thresholds exist), but "literally zero" is the weak point.
      *   *Move 2 (Rhiannon - Expected Value):* This is the standard utilitarian counter (Alastair Norcross, Shelly Kagan). Even if the chance is 1 in 10,000 of saving 10,000 chickens, the expected value is 1 chicken.
