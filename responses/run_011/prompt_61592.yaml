answer: |-
  ### Purpose Statement
  The theory is not an end in itself. It is a tool for a festival programming committee to resolve a specific procedural deadlock: determining the epistemic weight of expert panel verdicts versus mechanical aggregate scores, and deciding whether a committee member is warranted in forming a belief about a work's merits without viewing it. The theory must justify a voting procedure.

  ### Desiderata for a Theory of Aesthetic Testimony

  **1. The Asymmetry Constraint**
  *   **Statement:** The theory must explain why accepting **verdict testimony** (e.g., "This is a masterpiece") feels epistemically distinct from accepting ordinary testimony about non-aesthetic facts (e.g., "This building is 100m tall"), without positing a magical barrier to knowledge.
  *   **Case:** Committee members report resistance to believing a work is "good" on say-so, yet no resistance to believing it is "90 minutes long." A theory that treats them as identical fails to describe the committee's actual deliberative experience; a theory that treats them as wholly disjoint fails to explain how programming decisions are ever made without universal viewing.
  *   **Status:** **Non-negotiable.** (To ignore the felt asymmetry is to describe a different psychology; to reify it is to make programming impossible.)

  **2. The Non-Aesthetic Anchor**
  *   **Statement:** The theory must account for the unproblematic transmission of warrant regarding non-aesthetic properties (attribution, plot, running time) and explain why **feature testimony** (e.g., "the grading is muddy") occupies a middle ground between those facts and bare **verdict testimony**.
  *   **Case:** We accept testimony that "the protagonist dies" without seeing the film. We are more hesitant about "the pacing drags," and most hesitant about "it is trite." The theory must map this gradient. If **feature testimony** is treated as epistemically identical to **verdict testimony**, the theory cannot explain why providing reasons (features) increases acceptance of a verdict.
  *   **Status:** **Non-negotiable.** (The existence of the unproblematic neighbourhood constrains the account of the problematic one; any theory must explain the transition from plot to value.)

  **3. The Acquaintance Accommodation**
  *   **Statement:** The theory must classify the epistemic status of the member who defers now and looks later. It must determine whether the belief formed on **verdict testimony** prior to viewing is warranted, unwarranted, or merely useful, and whether **response testimony** (e.g., "I wept") functions as a prompt to look or a basis for deference.
  *   **Case:** Committees often provisionally select works based on expert buzz to schedule screenings. If the Acquaintance Thesis is treated as an absolute datum (no warrant without seeing), this common practice is epistemically corrupt. If treated as a claim to be argued against, the theory must specify when deference is permissible.
  *   **Status:** **Non-negotiable.** (The committee's workflow requires a classification of "deferred belief." A theory that renders standard workflow irrational is practically useless.)

  **4. The Epistemic/Evaluative Split**
  *   **Statement:** The theory must keep separate the question of whether testimony *can* confer warranted belief (epistemic) from whether relying on it constitutes an aesthetic failing (evaluative), even when the belief is true.
  *   **Case:** A member might know a work is good via **aggregate testimony** (epistemically warranted) but feel that programming it on that basis is cowardly or philistine (evaluatively failing). Conflating these prevents the committee from distinguishing between a valid selection and a virtuous one.
  *   **Status:** **Non-negotiable.** (Conflation leads to policy paralysis; one can warrant a belief while regretting the necessity of the warrant.)

  **5. The Disagreement Resolution**
  *   **Statement:** The theory must provide a mechanism for weighing two selectors of acknowledged equal competence who issue conflicting **verdict testimony**, specifically by analyzing whether they supply competing **feature testimony** or merely bare verdicts.
  *   **Case:** If Expert A says "Masterpiece" and Expert B says "Trite," the committee cannot simply average them. If A supplies **feature testimony** ("the third act lands") and B supplies only a bare verdict, the theory must grant A more weight. If both supply features, the theory must explain how to weigh the features.
  *   **Status:** **Non-negotiable.** (Peer disagreement is the primary trigger for committee deadlock; a theory without a resolution rule is operationally void.)

  **6. The Generalism Pressure**
  *   **Statement:** The theory is required to fall out of a general account of testimony with no aesthetic clause in it, unless it can demonstrate a specific cognitive incapacity unique to the aesthetic domain.
  *   **Case:** This is a demand of the **Optimist** camp. Dropping it allows the **Pessimist** to posit a sui generis block on aesthetic knowledge. The loss incurred by dropping this is the fragmentation of epistemology; we would need one logic for art and another for everything else. However, retaining it puts pressure on Desideratum 1 (Asymmetry).
  *   **Status:** **Demand of One Camp (Optimist).** (Loss if dropped: Epistemic unity is sacrificed, allowing Pessimism to hide behind aesthetic exceptionalism.)

  **7. The Aggregate Integration**
  *   **Statement:** The theory must assign a specific epistemic weight to **aggregate testimony** relative to expert **verdict testimony**, without resting on an empirical guess that aggregates perform better or worse than experts.
  *   **Case:** The committee must decide whether a score of 8.4/10 from 5,000 users warrants belief more than a "Recommended" from 3 experts. The theory must define the *structure* of **aggregate testimony** (where nobody intended to testify) versus **verdict testimony** (where intention is central).
  *   **Status:** **Non-negotiable.** (This is the core practical problem. A theory that cannot weigh these inputs fails the purpose.)

  ***

  ### The Impossible Subset

  I identify the following three desiderata as generating a tension that cannot be fully resolved without empirical data the committee does not possess:

  1.  **Desideratum 6 (The Generalism Pressure):** Requires testimony to function uniformly across domains (like height or date).
  2.  **Desideratum 7 (The Aggregate Integration):** Requires **aggregate testimony** to be weighed against expert **verdict testimony**.
  3.  **Desideratum 5 (The Disagreement Resolution):** Requires expert **verdict testimony** to retain authority even when contradicted by numbers or peers.

  **The Pressure:**
  If we enforce **Generalism (6)**, **aggregate testimony** should arguably function like a poll on height: the larger sample size should epistemically swamp the individual expert, provided the aggregate process is reliable. This suggests the committee should prioritize the 5,000 ratings over the 3 experts. However, **Disagreement Resolution (5)** demands that expert verdicts retain authority, implying that a bare **verdict testimony** from a competent selector carries a weight that a mechanical **aggregate testimony** does not, perhaps because the expert intends to testify to *value* while the aggregate only records *response*.

  If we prioritize Expert Authority (5) and Generalism (6), we struggle to justify why **aggregate testimony** (7) matters at all, since general testimony norms usually favor reliability and sample size over status. If we prioritize Aggregates (7) and Generalism (6), we dissolve Expert Authority (5). If we prioritize Expert Authority (5) and Aggregates (7), we violate Generalism (6) by positing a special aesthetic reason why expert intention matters more than statistical reliability.

  **Empirical Assumption Avoidance:**
  To prevent the theory from turning on a guess, I stipulate that the theory must treat **aggregate testimony** as *derivative* **response testimony** rather than direct **verdict testimony**. It reports that many people had reactions, not that the work is good. This preserves Expert Authority (they judge value; the crowd reports reaction) and satisfies Generalism (testimony about reactions is standard), but it leaves the weight of the aggregate *practically* undetermined by the theory alone. The committee must decide how much *response testimony* predicts *value*.

  ***

  ### The Eliminator

  **The Single Requirement:** **Desideratum 3 (The Acquaintance Accommodation)**, specifically the clause that *the theory must permit warranted belief for the purpose of programming selection.*

  **Position Eliminated:** **The Hard Pessimist.**

  **Reasoning:**
  The Hard Pessimist holds that aesthetic testimony *never* confers warranted belief about a work's aesthetic character; one must see the work to know its value. If this position is adopted, the committee's core task—deciding how to weigh inputs for a member who *has not seen the work*—becomes impossible. The member cannot form a warranted belief based on *any* input (expert or aggregate). The committee would be forced to view every submission before voting, which is logistically impossible for a festival receiving thousands of entries.

  **Positions Left Standing:**
  1.  **The Optimist:** Leaves standing. They argue testimony confers warrant readily. This satisfies the committee's need to act, though it may struggle with Desideratum 1 (Asymmetry).
  2.  **The Pluralist:** Leaves standing. They argue warrant depends on the *kind* of testimony (e.g., **feature testimony** warrants, bare **verdict testimony** does not). This allows the committee to construct a policy where experts must provide features to confer warrant, satisfying the practical need while respecting the asymmetry.

  **Revision Note:**
  An initial draft of this list treated Desideratum 1 (Asymmetry) as neutral, which allowed the Pessimist to claim the asymmetry proves their case. I revised Desideratum 3 to explicitly demand that *some* pathway to warranted belief must exist for the committee to function. This forces the theory to be action-guiding. A theory that concludes "You cannot know" is a defective tool for a programming committee. This revision breaks the tie by ruling out any theory that renders the committee's standard operating procedure epistemically bankrupt.
