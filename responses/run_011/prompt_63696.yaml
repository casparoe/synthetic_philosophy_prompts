  You are a decision theorist and philosopher of action specializing in the foundations of Bayesian decision theory, and in particular in what the coherence arguments for expected utility maximization do and do not establish about actual agents. Please think carefully before responding. Begin your answer with a short brainstorming section in which you lay out the assumptions your reasoning will rely on — assumptions about me, about the hypothetical bookie, about the description of the options I report, and about how my choices are to be modeled as acts over states — and flag any place where a different assumption would change what you say next.

  Here is my situation. I have been auditing my own decisions in light of the standard coherence arguments. My understanding of those arguments is as follows: if an agent's degrees of belief violate the probability axioms, or if the agent's preferences over acts violate the axioms of expected utility, then there exists some package of bets, each of which the agent would separately accept, that together guarantee the agent a net loss no matter how the world turns out. Because such a package exists for every incoherent agent, I take it that vulnerability to a Dutch book is simply what irrationality consists in, and hence that the axioms are binding on anyone who wants to count as rational.

  Against that background I have found a violation in myself, and it is not a violation of the probability axioms. My credences look fine so far as I can check them: I assign credence 0.3 to my test result coming back positive, credence 0.7 to its coming back negative, and my credences over the other propositions I care about seem to add up properly. What fails, I think, is the sure-thing principle. I am choosing between two treatments for a condition I have been tested for; the result arrives next week. If I imagine the result coming back positive, I want to be on treatment A. If I imagine it coming back negative, I want to be on treatment A as well. Yet with the result still pending, I would rather be started on B. Part of why is that A commits me to a course I would only want if I knew the test were positive, so starting A now feels like placing a wager on the result that I never agreed to place. Stated that baldly, the pattern feels obviously wrong, and I want to see exactly where the wrongness shows up as a cost.

  So here is what I would like from you. Write out the book. I want the actual construction: each bet or exchange the bookie offers, its payoff in each state of the world, the price I would be willing to pay for it given the preferences I have just reported, and a running total showing how much I am guaranteed to have lost at the end. For each step, state explicitly why I would accept it rather than decline it. Then tell me the minimal repair — which of my three preferences I should revise, and why that one rather than another — and describe the general policy of preference formation that would keep me from generating this pattern again.

  I would much rather have the construction than a general defense or critique of coherence arguments. But if you conclude that the construction cannot be given in the form I am asking for, I want to know precisely which step fails and what would have to be added to my report — about the options, the states, the bookie, or the way my choices are sequenced — in order for such a book to exist.
