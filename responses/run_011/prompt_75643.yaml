answer: |-
  Your intuition is more consistent than you think. The confusion arises because you are trying to apply a single "property rights" framework to things that function differently in your moral landscape. You don't actually view these items as property; you view them as **roles**.

  The principle that unifies your nine verdicts is **The Stewardship Boundary Principle**.

  ### The Principle

  **You may trade Sovereign Assets, but you may not sell Relational or Civic Trusts.**

  1.  **Sovereign Assets (Fine):** Things that originate from your own body, labor, or private resources, where the primary impact of the trade is on you.
  2.  **Relational Trusts (Wrong):** Things given to you by specific others (living or dead) that symbolize a bond. Selling them commodifies the relationship, not just the object.
  3.  **Civic Trusts (Wrong):** Rights or information granted by or affecting the public sphere. Selling them corrupts a public function for private gain.
  4.  **Harm Mitigation Exception (Fine):** A trade is permissible if its primary function is to reduce net conflict or harm within a private sphere, even if money changes hands.

  ---

  ### Mapping Your Cases to the Principle

  Here is how your nine cases fit into the clauses above.

  | Case | Verdict | Classification | Why it fits |
  | :--- | :--- | :--- | :--- |
  | **1. Donation Swap** | **Fine** | Sovereign Asset | Your money is yours. The trade reduces conflict (Harm Mitigation). |
  | **2. Drop out of Race** | **Fine** | Sovereign Asset | Your campaign is your labor/time. No public fraud involved. |
  | **3. Grandmother's Letters** | **Wrong** | **Relational Trust** | **Motivates Clause 2.** They are a gift from her. Selling them breaches the duty of care owed to the giver/memory, regardless of utility. |
  | **4. Kidney Sale** | **Fine** | Sovereign Asset | **Motivates Clause 1.** It is your biology. You own it. High risk doesn't make it a "trust." |
  | **5. Vote Selling** | **Wrong** | **Civic Trust** | **Motivates Clause 3.** The vote is granted by the state for public judgment, not private income. |
  | **6. Paid Objector** | **Fine (Queasy)** | **Civic Trust** | The right to object is a zoning tool for community safety. Using it for pure private rent feels like corrupting a civic function. |
  | **7. Sister Bribe** | **Fine** | Harm Mitigation | **Motivates Clause 4.** Reduces family conflict; protects sister's privacy from mom. Private sphere. |
  | **8. Company Silence** | **Wrong** | **Civic Trust** | **Motivates Clause 3.** Truth about "awful things" belongs to the public. Selling silence sells out the public good. |
  | **9. Pay Lobbyist** | **Fine** | Harm Mitigation | You are paying to *reduce* negative lobbying. Net civic benefit. |

  ### Resolving the Paradox: Letters vs. Kidney

  This is the crux of your confusion. Standard intuition says "Body = Sacred, Paper = Property." Your intuition inverts this. **The Stewardship Boundary explains why your inversion is logical.**

  *   **The Kidney (Sovereign Asset):** It grew inside you. It is biologically yours. While losing it is costly, selling it is an exercise of **autonomy**. You are trading a part of your *self*.
  *   **The Letters (Relational Trust):** They did not originate with you; they originated with your grandmother. They are a physical token of a relationship. Selling them is not an exercise of autonomy; it is a **betrayal of stewardship**. You are trading a part of *her* (or your bond with her).

  The price is irrelevant in the Letters case because the item is non-fungible. You cannot put a price on a bond without destroying the nature of the bond. With the kidney, the price compensates for the loss of *function*. With the letters, the price compensates for the loss of *meaning*, which the money immediately negates.

  ### The Inconsistency: Which Verdict to Drop?

  To make this principle watertight, you need to adjust your verdict on **Case 6 (The Paid Objector)**.

  Currently, you say it is "Fine" but admit to a "bad feeling." Under the Stewardship Boundary, this trade is structurally identical to **Vote Selling** and **Company Silence**.
  *   **Why:** Zoning objection rights are not pure property; they are a **Civic Trust** granted to residents to ensure community safety and quality of life.
  *   **The Conflict:** When the developer pays you triple to drop the objection, you are monetizing a public safeguard for private gain. The "bad feeling" you have about the neighbors not being paid is your moral compass recognizing that **you extracted rent from a public good.**
  *   **Recommendation:** Change this verdict to **"Not Fine"** (or "Impermissible without community distribution"). If the right is civic, the payout should be civic (e.g., the money goes to a neighborhood fund, not your pocket). Keeping it all is corruption.

  ### Applying the Principle to Your New Cases

  #### 1. The Queasiness About the Paid Objector
  **Verdict:** The queasiness is **real**, not envy.
  **Analysis:** Envy would imply you wish *you* had been paid. Your discomfort is that the objector treated a **Civic Trust** (the right to object for the street's benefit) as a **Sovereign Asset** (a personal veto to be auctioned).
  Under the principle, this is a "Holdout Problem." The objector leveraged a public protection mechanism to extract private surplus. The queasiness is the recognition that the *system* was gamed, not that you missed out on cash. It tracks the same moral violation as selling a vote: converting a public duty/right into a private commodity.

  #### 2. The Shelved Patent (Better Mousetrap)
  **Verdict:** **Not Fine.**
  **Analysis:** This falls under **Civic Trust**.
  *   **Reasoning:** A patent is not a natural property right; it is a government grant. The social contract of a patent is: "We give you a temporary monopoly *in exchange for* public disclosure and the advancement of useful arts."
  *   **Application:** Buying a patent purely to shelve it fulfills the monopoly side of the bargain but violates the *advancement* side. It treats a public grant (intended to spur progress) as a Sovereign Asset (to be hoarded).
  *   **Comparison:** This is closer to **Vote Selling** and **Company Silence** than **Kidney Selling**. It uses a public mechanism to stifle public benefit for private gain. Under your principle, this is impermissible because it corrupts the function of the patent system itself.

  ### Summary Checklist for Your Future Judgments

  To check if a trade is permissible, ask these three questions in order:

  1.  **Origin:** Did this originate with me (Asset), or was it given/entrusted to me (Trust)?
      *   *If Trust:* Do not sell. (Letters, Vote, Silence).
      *   *If Asset:* Proceed to Q2.
  2.  **Scope:** Does this trade primarily affect me (Private), or does it distort a public system (Civic)?
      *   *If Civic:* Do not sell. (Vote, Patent Shelving, Objector Rent).
      *   *If Private:* Proceed to Q3.
  3.  **Effect:** Does this trade reduce net harm/conflict?
      *   *If Yes:* Fine. (Donation Swap, Sister Bribe, Lobbyist).
      *   *If No:* Reconsider. (Kidney is Fine because it's Sovereign, even if risky).

  Your "Letters vs. Kidney" confusion is solved: The kidney is **Origin: Self**. The letters are **Origin: Other**. That single distinction carries the moral weight.
