answer: |-
  ### Conditions of Adequacy for Resolving Simpson's Paradox

  Your advisor is correct: a review of who said what is not a dissertation. A dissertation requires a stance. Your stance is that Simpson's Paradox is not a probabilistic anomaly to be fixed with better math, but a causal identification problem disguised as one. The following requirements define what an account must deliver to be considered adequate. They are derived from the specific failure modes you identified.

  #### 1. The Causal Specification Requirement
  *   **Motivating Case:** Berkeley Admissions (aggregate rejection vs. departmental acceptance).
  *   **The Requirement:** The account must explicitly state the causal relationship between the grouping variable (department) and the treatment/outcome (gender/admission) *before* selecting the table. It must forbid selecting the stratified table solely because the association reverses.
  *   **Rationale:** In Berkeley, department is a common cause (or proxy for one) of application choice and admission difficulty. Aggregation biases the effect because it ignores this structure. The account must mandate that the "correct" table is determined by the causal role of the stratifying variable, not the direction of the arithmetic.
  *   **Status:** **Non-Negotiable.** (Both Potential Outcomes and Structural Causal Model camps agree: confounding structure dictates adjustment.)

  #### 2. The Structural Exclusion Requirement
  *   **Motivating Case:** Conditioning on a collider or a downstream variable (M-bias / over-adjustment).
  *   **The Requirement:** The account must provide a rule that prohibits conditioning on variables that are effects of the treatment or common effects of the treatment and outcome, even if doing so creates or removes an association.
  *   **Rationale:** Disaggregating by a downstream variable induces bias where none existed. An adequate account must distinguish between "controlling for a difference" (good) and "controlling for a consequence" (bad). It cannot rely on statistical significance or change-in-estimate criteria to make this call.
  *   **Status:** **Non-Negotiable.** (Agreed upon by all causal inference frameworks; implementation notation is the only variable.)

  #### 3. The Measure Invariance Requirement
  *   **Motivating Case:** Randomized trials where Crude OR $\neq$ Conditional OR despite no confounding (Non-collapsibility).
  *   **The Requirement:** The account must distinguish between a change in effect estimate due to *bias* (confounding) and a change due to *mathematical scaling* (non-collapsibility). It must not label non-collapsibility as a paradox requiring resolution.
  *   **Rationale:** In RCTs with binary outcomes, the odds ratio is non-collapsible. The conditional estimate differs from the marginal estimate even with perfect randomization. An account that treats this as a "Simpson's Paradox" to be resolved by picking one table is fundamentally misdiagnosing the problem. The account must specify which estimand (marginal vs. conditional) matches the scientific question.
  *   **Status:** **Non-Negotiable.** (Biostatistical fact, independent of causal camp.)

  #### 4. The Temporal Coherence Requirement
  *   **Motivating Case:** Effect drift over follow-up due to frailty/selection (Survivor bias).
  *   **The Requirement:** The account must enforce time-ordering on the conditioning set. Variables that change status *after* treatment initiation and are affected by survival cannot be treated as baseline strata.
  *   **Rationale:** As the frailest subjects die, the remaining population changes composition. Conditioning on "survivors at month 6" conditions on a collider induced by treatment and frailty. The account must prevent static table analysis from being applied to dynamic populations without structural adjustment.
  *   **Status:** **Non-Negotiable.** (Required for longitudinal validity.)

  #### 5. The Target Explicitness Requirement
  *   **Motivating Case:** Fusing "Which table describes the population?" with "Which table answers the decision?"
  *   **The Requirement:** The account must separate the *Descriptive Estimand* (what is happening in this specific dataset) from the *Causal Estimand* (what would happen under intervention).
  *   **Rationale:** Sometimes the aggregate table *is* the correct one for the decision (e.g., insurance pricing based on aggregate risk, regardless of causal mechanism). Sometimes the stratified table is correct (e.g., clinical efficacy). An account that claims one table is universally "true" fails to distinguish between prediction and etiology.
  *   **Status:** **Non-Negotiable.** (Essential for the working epidemiologist to avoid acting on the wrong quantity.)

  #### 6. The Stopping Rule Requirement
  *   **Motivating Case:** The infinite regress of conditioning (always one more variable to add).
  *   **The Requirement:** The account must define a termination condition for adjustment based on *causal sufficiency*, not statistical stability.
  *   **Rationale:** You can always condition on another covariate. Statistical criteria (e.g., "estimate stabilizes") are insufficient because they can stabilize at a biased value. The account must demand a claim that "all common causes are measured" or utilize a formal criterion (like d-separation or backdoor) to declare the set sufficient.
  *   **Status:** **Non-Negotiable.** (Without this, the method is undefined.)

  #### 7. The Notation Neutrality Preference
  *   **Motivating Case:** Reviewer bias against DAGs vs. Potential Outcomes.
  *   **The Requirement:** The account should be expressible in either Potential Outcomes notation (conditional independence of counterfactuals) or Graphical notation (d-separation), provided the assumptions are explicit.
  *   **Rationale:** Whether you draw arrows or write $Y(1) \perp Z | X$ is a syntactic choice. Insisting on one specific visual language alienates half the department without adding mathematical rigor.
  *   **Status:** **Camp Preference.** (Rigor is in the assumptions, not the syntax.)

  ***

  ### The Impossibility Result (The Trilemma)

  You suspected a trilemma, and you are right. An account of Simpson's Paradox cannot simultaneously satisfy the following three properties:

  1.  **Data-Only:** The correct table is identifiable from the joint distribution alone (no external assumptions).
  2.  **Universal Correctness:** The account picks the causally correct table in every case (Berkeley, Colliders, RCTs).
  3.  **Assumption-Free:** The account does not smuggle in causal assumptions the data cannot supply.

  **Resolution:** Property #1 must go.

  It is a mathematical theorem that causal direction cannot be derived from observational joint distributions alone. Therefore, any account that claims to resolve Simpson's Paradox using only statistical criteria (change-in-estimate, significance testing, or association strength) will necessarily fail in either the Collider case or the Berkeley case. To satisfy **Universal Correctness**, the account **must** violate **Data-Only**. It must demand that the analyst import causal assumptions (time-ordering, structural knowledge) that are not present in the dataset.

  Consequently, your dissertation's position is that **Simpson's Paradox is not resolvable within probability theory.** It requires a causal vocabulary. Any attempt to resolve it purely statistically is not just incomplete; it is provably prone to error in specific, known configurations (specifically M-bias and non-collapsibility).

  ***

  The requirement that causal assumptions be explicit rather than implicit knocks out the most candidate accounts.
