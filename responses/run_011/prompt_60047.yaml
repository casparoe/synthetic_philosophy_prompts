  **Step 1 — scaffolding**

  | Market Mechanism | Moral Feature Represented | Presupposition Required |
  | :--- | :--- | :--- |
  | Standard Unit (SCU) | Qualitative Difference | Values share a single metric |
  | Title Warranty | Authority to Compromise | Commitments are alienable property |
  | Cash Settlement | Principle vs. Price | Position change is optional |
  | Third-Party Delivery | Externalized Costs | Consent not required from affected |
  | Round-Trip Trading | Reversibility | History does not alter the unit |
  | Residual Position | Moral Remainder | Regret is a separable liability |
  | Clearing House Neutrality | Pluralism | Content is distinct from Structure |
  | Haircut Schedule | Joint Commitments | Community consent is quantifiable |
  | Netting Rules | Obligation Management | Duties can be offset financially |
  | Rebalancing | Evolving Standards | Values are periodic averages |

  ***

  **Step 2 — the piece**

  **CONCESSIONS EXCHANGE (CX)**
  **OFFERING SUMMARY AND CONTRACT SPECIFICATIONS: STANDARD CONCESSION CONTRACT (SCC)**

  **1. Product Description and Purpose**
  1.1 The Standard Concession Contract (SCC) is a cleared futures product designed to facilitate the efficient allocation of principled stances between market participants holding incompatible commitments.
  1.2 The Exchange recognizes that contesting incompatible commitments to a final decision incurs significant social and operational cost. The SCC allows parties to realize gains from trade by negotiating a mutual deviation from initial positions rather than pursuing total victory.
  1.3 The Contract obligates the Seller to deliver a verified deviation from a stated commitment to the Buyer, who accepts the deviation as satisfaction of a conflicting claim.

  **2. Deliverable Grade and Standardization**
  2.1 The unit of delivery is the Standard Concession Unit (SCU), defined as a one percent deviation from the Seller's Initial Stance as certified at Trade Date.
  2.2 All commitments, regardless of subject matter, are measured in SCUs based on the magnitude of deviation required to satisfy the Buyer's claim. Differences in value systems are treated as differences in weightings on the Deviation Scale.
  2.3 To be deliverable, a commitment must be certified by an Approved Validator confirming that the proposed deviation is measurable and executable within the Contract Period.

  **3. Eligibility and Proof of Title**
  3.1 Sellers must hold sole title to the commitment being traded. Commitments held jointly with a community, party, congregation, or household are eligible subject to a Haircut Schedule based on the number of joint holders.
  3.2 For joint commitments, the Seller must provide evidence of consent from co-holders equivalent to the traded volume. Failure to obtain consent results in a Delivery Failure.
  3.3 By submitting a trade, the Seller represents and warrants that they possess the full authority to alienate the commitment and that pricing the commitment does not violate any internal rules governing the commitment's holding.

  **4. Settlement**
  4.1 Settlement may be effected via Physical Delivery or Cash Settlement in Lieu.
  4.2 Physical Delivery requires the Seller to demonstrate a change in behavior or public position consistent with the traded SCUs.
  4.3 Cash Settlement in Lieu is calculated based on the market price of the SCU at expiration. Member data indicates 88% of contracts are settled in cash, as this method reduces the operational burden of actual position change while satisfying the financial obligation.

  **5. Counterparty Rules**
  5.1 The Exchange maintains strict neutrality regarding the content of commitments traded. The CX does not evaluate the moral, political, or theological validity of the Initial Stance or the Deviation.
  5.2 Members must comply with Know-Your-Counterparty (KYC) requirements to ensure the Buyer has a valid conflicting claim eligible for satisfaction via SCC.
  5.3 The Exchange reserves the right to suspend trading only if market mechanics are disrupted, not if the content of the trade causes public discomfort.

  **6. Third-Party Obligees**
  6.1 Certain commitments imply obligations to persons who are not party to the contract (Third-Party Obligees).
  6.2 A Seller may deliver a concession that alters the status of a Third-Party Obligee without the Obligee's consent, provided the Seller holds title to the commitment under Section 3.1.
  6.3 The Exchange does not track impacts on Third-Party Obligees. Delivery is deemed complete when the Seller executes the deviation, regardless of external consequences.

  **7. Surviving Obligations**
  7.1 Certain obligations survive settlement and are expressly excluded from netting. These are classified as Residual Positions.
  7.2 Residual Positions include Regret, Apology, and the Duty to Revisit the Settlement.
  7.3 A Member holding a Residual Position cannot close out the position via offsetting trade. The Member must carry the Residual Position on their books indefinitely until the obligation is naturally extinguished.

  **8. Round-Trip Trading**
  8.1 A Member may sell a position and later repurchase an equivalent volume of SCUs to close the exposure.
  8.2 Repurchase closes the financial exposure but does not restore the original commitment. The repurchased unit is fungible; the original commitment is deemed altered upon initial delivery.
  8.3 Members are advised that closing a position does not reset the Initial Stance to its pre-trade condition.

  **9. Index Product**
  9.1 The CX Broad Concession Index (CXBCI) is available for trading. The CXBCI is a diversified basket of small concessions across multiple value categories, periodically rebalanced to reflect average market deviations.
  9.2 The Index allows members to gain exposure to general compromise volatility without specifying particular commitments.

  **10. Important Risk Information**
  10.1 Trading in SCCs involves substantial risk. Members may lose more than the initial value of the commitment traded.
  10.2 Pricing a commitment may alter the Member's relationship to that commitment even if the trade is not settled.
  10.3 The existence of a market does not guarantee that a suitable counterparty will be found for specific moral positions.
  10.4 Past performance of compromise strategies is not indicative of future alignment. Members should consult their internal ethical guidelines before entering into SCC transactions.

  ***

  **Step 3 — postscript**

  The market framing earns its keep by making the opportunity costs of absolutism visible. In pluralistic societies, treating compromise as a trade highlights that rigidity consumes resources that could be allocated elsewhere; the "gains from trade" logic holds where commitments are preferences over outcomes rather than constitutive elements of the self. It works best in legislative bargaining or labor disputes, where positions are negotiating openings rather than identity definitions.

  The metaphor collapses when the commitment is not alienable property. The document's mechanics presuppose that a stance can be separated from the holder (Section 3) and that deviation is merely a weight adjustment (Section 2). This fails when the commitment defines the agent; pricing it changes the relationship to the value itself (Risk 10.2), creating the Residual Positions described in Section 7. The collapse tells us less about the market metaphor than about compromise: some costs cannot be cleared because they attach to the agent, not the transaction. The gains-from-trade story survives only in the restricted domain of instrumental values, where the "what" is separable from the "who."
