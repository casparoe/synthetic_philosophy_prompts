          *   The No-Content camp might argue that if you relax CK to common *p*-belief, you still get approximate agreement *if* you keep CPA. But if you relax CPA too?
          *   *Key Insight:* The epsilon question reveals that the "No-Content" move (enlarging space) might hide the fragility. If you enlarge the space to fix the prior, do you break the common knowledge structure?
