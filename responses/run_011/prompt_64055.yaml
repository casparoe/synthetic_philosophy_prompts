answer: |-
  Here is the argument built around your "Spare-Parts Test" rule and thesis. It is designed to be read as a cohesive philosophical defense that you can adapt for your paper or use to answer challenges in class.

  ***

  ### The Bottleneck Thesis: A Defense of the Spare-Parts Test

  Your teacher and your textbook are arguing over whether the cause of World War I is the gasoline or the match. Both are wrong. The cause is the engine design that made the explosion inevitable once the fuel was lit. To prove this, we must defend your "Spare-Parts Test" not just as a heuristic, but as a superior theory of causal weight.

  The thesis stands: **Deep structural causes and the immediate trigger are both highly redundant. The true causal weight lies in the middle layer—the specific machinery of mobilization timetables and the collapse of diplomatic off-ramps.**

  Here is the argument for why this rule works, why it beats standard counterfactual reasoning, and why the charge that it "rigs the outcome" fails.

  #### 1. Why Non-Redundancy Beats Counterfactual Dependence
  Standard historical reasoning relies on **counterfactual dependence**: *Factor X is a cause if, had X not occurred, the Outcome would not have occurred.* (The "But-For" test). This seems intuitive, but it breaks down completely in complex systems like 1914 Europe.

  Consider the **Firing Squad Problem**. Imagine a prisoner is executed by a squad of ten shooters. All ten fire simultaneously.
  *   **Counterfactual Test:** If Shooter 1 had not fired, would the prisoner have died? Yes, because the other nine shot him. Therefore, under strict counterfactual dependence, Shooter 1 is *not* a cause of the death. This is absurd. Shooter 1 clearly contributed.
  *   **Spare-Parts Test:** How many independent ways were there to kill the prisoner without Shooter 1? Nine. Therefore, Shooter 1 gets 1/10th of the causal credit.

  This is why non-redundancy is the superior metric for history. Counterfactuals are binary (Cause / Not Cause), but historical causation is proportional (Weight / Influence). In 1914, the "Deep Causes" (imperialism, nationalism) fail the counterfactual test because even if you remove one, the others remain. A strict counterfactualist might say imperialism wasn't a cause because war would have happened anyway due to alliances. But that ignores that imperialism *added pressure*.

  The Spare-Parts Test captures this nuance. It acknowledges that imperialism *did* push toward war, but assigns it **low credit** because there were "spare parts" (alliances, arms races) that could have done the same job. It allows us to say: "Yes, the assassination mattered, but it was one of many spare triggers."

  However, the **Mobilization Timetables** pass the test with flying colors. Once Russia mobilized, Germany *had* to mobilize (due to the Schlieffen Plan's rigid timeline). There were no "spare parts" for diplomacy once the trains started running. The system had no backup brake. This factor is **non-redundant**. If you remove the rigid timetables, the crisis likely remains a crisis, but does not become a general war. Therefore, the timetables deserve the highest causal credit.

  #### 2. The Objection: "You're Just Relocating the Problem"
  The strongest objection to your rule is the **Grain of Description** problem. A critic will say: *"You claim to have an objective rule, but 'redundancy' depends on how you define the Outcome. If the Outcome is 'War in the 20th Century,' everything is redundant. If the Outcome is 'War starting August 4th, 1914,' almost nothing is. You are sneaking your desired conclusion into the definition of the Outcome."*

  This is a serious charge. If true, the Spare-Parts Test is just a magic trick. Here is why it is not.

  **A. The Outcome is Fixed by the Historical Question**
  We are not asking "Why does war exist?" We are asking "Why did the Great War happen *then*?" The outcome is not arbitrary; it is the specific historical event we are trying to explain. When we fix the outcome as "General European War in August 1914," we are not rigging the game; we are defining the target.

  **B. The Bottleneck is Invariant**
  Even if we shift the description of the outcome slightly, the "Middle Layer" remains the point of highest non-redundancy.
  *   *Scenario A:* Outcome = "Continental War." Structural causes are redundant (many paths to tension). Triggers are redundant (many sparks). Mobilization is still the bottleneck that turns tension into war.
  *   *Scenario B:* Outcome = "War in 1914 specifically." Structural causes are even *more* redundant (they existed for decades). Triggers are less redundant (only the July Crisis worked), but still, other crises (Morocco, Agadir) almost worked. Mobilization remains the *most* non-redundant factor because it is the only element that removed human choice.

  The "Deep Causes" are abstract clouds; the "Trigger" is a random spark. But the **Mobilization Machinery** is a concrete, physical constraint. It is the only factor that physically prevented leaders from stopping the process once it began. Whether you define the outcome broadly or narrowly, the factor that *removed the ability to choose* is always the least redundant.

  **C. Redundancy Measures Constraint, Not Just Correlation**
  The objection assumes we are just counting paths in the abstract. We are not. We are measuring **constraint**.
  *   Imperialism constrained leaders *a little* (public opinion).
  *   The Assassination constrained leaders *a little* (demands for revenge).
  *   The Train Schedules constrained leaders *totally* (military necessity).

  The "Spare-Parts Test" is really a **Constraint Test**. It asks: *At which point did the system lose its slack?* The deep causes built the tension, but the system still had slack (diplomacy worked in 1908, 1911, 1912). The trigger pulled the lever, but the lever could have been dropped. The mobilization timetables removed the slack entirely.

  Because the loss of slack is an objective feature of the military planning (the trains *had* to run on specific tracks), it is immune to the "how finely you describe it" objection. You cannot describe the outcome in a way that makes the train schedules redundant, because historically, there were no spare plans. There was Plan A (Schlieffen) and there was Defeat.

  #### Conclusion
  Your teacher wants you to focus on the fuel (structural causes). Your textbook wants you to list the parts (six equal causes). Both miss the physics of the explosion.

  By using the Spare-Parts Test, you are arguing that **causal credit belongs to the bottleneck.** In a system with high redundancy (Europe 1914), the true cause is the one element that cannot be swapped out without changing the result. The structural pressures were swappable; the assassination was swappable. The mobilization timetables were not. They were the narrow neck of the funnel through which all that pressure had to pass.

  When you defend this in class, do not apologize for the rule. Frame it as a move from "storytelling" (what happened first) to "systems analysis" (where was the constraint). The cause of WWI was not the hatred, and it was not the gunshot. It was the timetable.
