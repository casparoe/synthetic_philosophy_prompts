answer: |-
  ### Evaluation of Candidate Principles

  **1. Unqualified invariance**
  *   **Robustness:** 1/10
  *   **Bite:** 10/10
  *   **Justification:** This formulation is falsified by almost any case involving conflicting duties (e.g., promising to meet for lunch vs. saving a life), rendering it metaphysically false. However, it offers maximum action-guidance, leaving no room for deliberation or exception.
  *   **Tier:** C

  **2. Invariance with fixed weight**
  *   **Robustness:** 3/10
  *   **Bite:** 8/10
  *   **Justification:** While it allows for overriding, it falsely claims the *weight* of a promise is context-independent (a promise to kill carries different moral weight than a promise to buy coffee). It retains strong guidance but fails to capture the nuance of moral salience.
  *   **Tier:** C

  **3. Invariance with enumerated defeaters**
  *   **Robustness:** 6/10
  *   **Bite:** 7/10
  *   **Justification:** It acknowledges exceptions, improving truth-value, but the requirement to list them invites the "etc." problem, where unforeseen defeaters render the principle incomplete. It guides well in standard cases but falters in novel situations.
  *   **Tier:** B

  **4. Default with a shifting burden of proof**
  *   **Robustness:** 9/10
  *   **Bite:** 7/10
  *   **Justification:** This handles context-sensitivity best by treating the reason as presumptive rather than invariant, avoiding falsification by exceptions. It retains strong guidance by setting a default position, though it requires agents to actively check for defeaters.
  *   **Tier:** A

  **5. Loose generalisation**
  *   **Robustness:** 10/10
  *   **Bite:** 2/10
  *   **Justification:** By claiming only a statistical tendency, it is virtually immune to counter-example. However, it offers almost no normative force for individual deliberation, failing to tell an agent what *they* ought to do *now*.
  *   **Tier:** C

  **6. Deliberative rule without metaphysical commitment**
  *   **Robustness:** 8/10
  *   **Bite:** 6/10
  *   **Justification:** It avoids metaphysical error by focusing on practice, making it robust against theoretical objections. However, it grounds criticism in social utility rather than moral truth, slightly weakening its normative authority.
  *   **Tier:** B

  ***

  ### Tiering Analysis

  **The Trade-off:**
  The primary trade-off driving this tiering is between **codifiability** (Bite) and **context-sensitivity** (Robustness). Formulations that seek high Bite (1, 2) attempt to freeze moral reasoning into algorithms but break when confronted with the complexity of reality (low Robustness). Formulations that seek high Robustness (5) accommodate complexity but dissolve into descriptions that cannot guide action (low Bite). Tier A (Principle 4) succeeds because it structures the *process* of deliberation without making false claims about the *content* of the moral landscape.

  **Least Stable Formulation:**
  **Principle 3 (Invariance with enumerated defeaters)** is the least stable. It attempts to occupy a middle ground between absolute rules and open-ended defaults. Under sustained pressure, the clause "the list is to be continued" inevitably expands until the list becomes unmanageable, at which point the principle functionally collapses into **Principle 4 (Default with a shifting burden of proof)**. Conversely, if one attempts to finalize the list to preserve Bite, it collapses into **Principle 1 or 2** by ignoring necessary exceptions. It cannot maintain its position as a finite list of infinite exceptions.

  ***

  ### Contextual Variations

  **1. Professional Code of Conduct**
  **Yes, the ranking would change.** In a professional context, enforceability and clarity are paramount for disciplinary purposes. **Principle 3** would rise to **Tier A**, potentially surpassing Principle 4. While Principle 4 is philosophically superior, a professional body requires defined standards to adjudicate misconduct; a "shifting burden of proof" is too litigious and vague for a code of conduct. Members need to know exactly which defeaters are recognized (e.g., "coercion" or "conflict of interest") to ensure consistent application, even if the list is not metaphysically exhaustive.

  **2. Decision-Support System (AI/Algorithm)**
  **Yes, the ranking would change again.** For a system capable only of evaluating checkable conditions, **Principle 3** becomes the only viable **Tier A** option, while **Principle 4** drops to **Tier C**. An algorithm cannot process a "burden of proof" or a "presumption" without explicit boolean logic. Principle 3's structure (If Promise AND NOT Defeater_X AND NOT Defeater_Y) is computationally tractable. Principle 5 is useless for decision-making, and Principle 6 is irrelevant to non-agentic systems. Principle 3 is the only one that can be successfully compiled, even if it requires periodic updates to the "defeater list" by human developers.
