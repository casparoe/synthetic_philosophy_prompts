answer: |-
  There is no single, canonical term in the political science or sortition literature equivalent to "gerrymandering" or "filibuster" that specifically names this phenomenon. It is widely recognized as a structural risk—discussed under headings like "the problem of the permanent secretariat," "bureaucratic capture of mini-publics," or "the expertise-rotation tradeoff"—but these are descriptions rather than a fixed concept. The closest existing shorthand is **"the permanent secretariat,"** but that refers to the body itself, not the power dynamic or the cadre it produces.

  Because the field lacks a specific label for this *structural relocation of power*, I will coin the term that best fits your description: **The Permanent Process Elite**.

  ### Definition
  **The Permanent Process Elite** refers to the non-rotating cadre of staff, facilitators, consultants, and administrators who support a randomly selected legislative body. Unlike the citizen members, this group retains institutional memory, controls the procedural architecture (agenda-setting, witness selection, briefing materials), and accumulates influence over multiple cycles. Their power is not derived from legal authority or electoral mandate, but from **turnover asymmetry** (they stay while members leave) and **procedural discretion** (they define the bounds of feasible deliberation).

  ### Boundaries: What It Is Not
  To ensure the term is useful, it must be distinguished from adjacent concepts:
  *   **Not "Bureaucracy" (Weberian):** A standard bureaucracy has legal authority and statutory responsibilities. The Permanent Process Elite has no formal decision-making power; their influence is informal, structural, and derived from being the only constants in the system.
  *   **Not "Capture" or "Corruption":** "Capture" implies the staff are acting against the public interest for private gain (bribes, industry revolving doors). The Permanent Process Elite often acts in good faith to ensure the process works; the distortion is a side effect of institutional design, not necessarily malicious intent.
  *   **Not "Facilitator Bias":** Facilitator bias usually refers to moderation skew within a *single* assembly. The Permanent Process Elite is a multi-cycle phenomenon where the bias becomes embedded in the institution's standard operating procedures over time.
  *   **Not "The Deliberative Elite":** This term is sometimes used to describe the citizen members themselves becoming a new class of professional deliberators. The Permanent Process Elite are the *staff*, not the members.

  ### Grading and Thresholds
  The phenomenon is graded, not binary. It begins to "bite" when two conditions meet a critical threshold:
  1.  **Turnover Asymmetry:** The ratio of staff tenure to member tenure. If staff serve 5 years and members 1 year, the asymmetry is high. If staff rotate annually with the members, the elite does not form.
  2.  **Procedural Discretion:** The degree of autonomy staff have over framing. If staff merely book rooms and transcribe notes (zero discretion), the elite does not form. If they draft the briefing packs, select the experts, and synthesize the final report (high discretion), the elite consolidates.

  ### Cases
  *   **Counts:** **Ireland's Constitutional Convention (2012–14).** The citizen members rotated, but the secretariat (civil servants) and academic advisors remained constant, controlling the agenda and research flow.
  *   **Counts:** **Commercial Deliberative Consultancies.** Firms like _Involve_ or _Sortition Foundation_ (when acting as repeat vendors) accumulate the "know-how" of what recommendations are politically palatable, effectively gatekeeping which questions are askable by future assemblies.
  *   **Does Not Count:** **An Assembly with Rotating Staff.** If the secretariat is also drawn by lot or hired on fixed-term contracts that expire with the assembly, the institutional memory resets, preventing elite formation.
  *   **Does Not Count:** **Zero-Discretion Support.** If the citizen body votes on its own agenda, selects its own experts from an open pool, and writes its own report without staff synthesis, the staff are logistical, not elite.

  ### Remedies and Tradeoffs
  The tradeoff between amateurism and cadre-formation is likely permanent unless the design is radically altered. Potential remedies include:
  *   **Citizen Control of Staff:** Giving the assembly the power to hire/fire the secretariat (though new members may lack the knowledge to judge).
  *   **Transparent Procedural Rules:** Codifying agenda-setting rules so they cannot be quietly adjusted by staff between cycles.
  *   **Rotating Secretariats:** Attempting to draw support staff by lot (logistically difficult due to skill requirements).
  *   **Alumni Oversight:** Empowering past citizen members to audit the staff's framing in future cycles.

  \answer{The Permanent Process Elite}
