  ### 8. Historical Note

  I am confident in the broad strokes of the Sen-Nozick-Gibbard exchange (1970–1976). Sen's *Collective Choice and Social Welfare* (1970) introduced the theorem. Nozick's *Anarchy, State, and Utopia* (1974) offered the side-constraint critique. Gibbard's "A Pareto-consistent libertarian claim" (1974) offered the waiver solution. Sen's "Liberty, Unanimity and Rights" (1976) responded to Gibbard. If you need specific page numbers for your own verification, I recommend checking Sen's 1976 *Economica* paper and Gibbard's 1974 *Journal of Political Economy* article.
