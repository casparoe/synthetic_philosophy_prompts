  Here is a revised version you can send. It preserves his rhetorical flow and zoning application but tightens the technical claims to withstand specialist scrutiny.

  > 'Back in 1970 Amartya Sen proved something that welfare economists have never fully sidestepped. Take a society of two people and a single copy of *Lady Chatterley's Lover*. The book can be read by Lewd, who enjoys it; read by Prude, who finds it obscene; or disposed of unread. Lewd prefers Prude reading it most, then himself, then neither. Prude prefers neither most, then himself, then Lewd. Now impose three conditions on any rule turning these preferences into a social ranking. Unrestricted domain: the rule must handle any preference profile. The Pareto principle: if everyone prefers one outcome, society must too. And minimal liberalism: each person is decisive over at least one pair of states concerning their private affairs, so Lewd settles whether he reads and Prude settles whether he does. Sen showed these cannot all hold. Give Lewd his way and "Lewd reads" outranks "no one reads"; give Prude his way and "no one reads" outranks "Prude reads"; transitivity implies "Lewd reads" is socially better than "Prude reads," even though both men prefer the reverse. So *this specific formulation* of liberty and efficiency are logically incompatible: no aggregation rule can respect these minimal rights and remain Pareto-efficient over *all* preferences. The outcome isn't just inefficient; it's indeterminate. Note that "decisive over one pair" functions like a local dictatorship, suggesting Sen's theorem and Arrow's are structural cousins—rights act as veto powers that can cycle against unanimity. The debate persists not because the math is wrong, but because it depends on Lewd having meddlesome preferences about Prude's conduct. While excluding such preferences resolves the contradiction—a move some theorists accept—Sen argued this begs the normative question: rights should protect precisely against such interference. Thus, the paradox remains a live result: in a world of meddlesome preferences, respecting rights may require us to abandon the goal of Pareto efficiency.