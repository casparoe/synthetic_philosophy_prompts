answer: |-
  # PART 1: THE LOGICAL SPACE

  Before handing out the cases, here is the map of the territory. This instrument sorts respondents along four binary axes. The "Leaves" are the stable combinations of answers.

  **The Four Axes**
  1.  **Grounding:** Is function ascription grounded in *Past Etiology* (how it got there) or *Current Contribution* (what it does now)?
  2.  **History Type:** If history matters, must it be *Natural Selection* (lineage) or is *Any Optimization* (design, gradient descent, self-maintenance) sufficient?
  3.  **Normativity:** Can a trait have a function but fail to perform it (*Malfunction possible*), or does function simply describe actual capacity (*Malfunction impossible*)?
  4.  **Uniqueness:** Is there *One True Account* (Monism) or does the answer depend on *Explanatory Interest* (Pluralism)?

  **The Tree Structure**
  *   **Node 1 (Uniqueness):** Do different contexts license different function ascriptions for the same trait?
      *   *Yes:* **Pluralist/Pragmatist Leaf.**
      *   *No:* Go to Node 2.
  *   **Node 2 (Truth-Aptness):** Are function statements literally true/false, or merely useful fictions?
      *   *Fictions:* **Error-Theory/Deflationist Leaf.**
      *   *True/False:* Go to Node 3.
  *   **Node 3 (Grounding):** Does a trait need a history to have a function? (Tested by Swampman/New Gene).
      *   *No (Current Only):* Go to Node 4.
      *   *Yes (History Required):* Go to Node 5.
  *   **Node 4 (Normativity):** Can the trait malfunction? (Tested by Broken Heart).
      *   *No (Capacity = Function):* **Causal-Role Leaf.**
      *   *Yes (Statistical/Goal Norm):* **Boorse-ish Dispositional Leaf.**
  *   **Node 5 (History Type):** Does the history have to be natural selection? (Tested by Robot/Bridge).
      *   *Yes (Lineage Only):* **Selected-Effects Leaf.**
      *   *No (Design/ML counts):* **Proper Function Leaf.**
  *   **Node 6 (Systemic Norms):** (Tie-breaker for Prebiotic case). Can a self-maintaining system without lineage have functions?
      *   *Yes:* **Organizational/Systemic-Teleology Leaf.**
      *   *No:* (Collapses into Selected-Effects or Proper Function depending on history view).

  **Empty Cells & Why**
  1.  **Current Contribution + Lineage Required:** Incoherent. If function is defined by what the part does *now*, checking its ancestry is logically redundant.
  2.  **History Required + Malfunction Impossible:** Theoretically possible (a broken watch still has the history of being a watch), but unattractive. It renders "malfunction" indistinguishable from "functioning poorly," which defeats the normative point of invoking history. Most theories here accept malfunction.
  3.  **Organizational + Lineage Required:** Redundant. If you require a selection lineage, you are doing Etiology. The point of Organizational accounts is to ground norms in *current* self-maintenance constraints, bypassing history.
  4.  **Error Theory + Malfunction Possible:** Incoherent. If function ascriptions are never literally true, nothing can *literally* malfunction.

  ***

  # PART 2: THE SORTING INSTRUMENT

  **Instructions:** Read each case. Select the **one** verdict that best matches your intuition. Do not worry about consistency yet. Parentheticals clarify subtle distinctions; choose the one that matches your reason.

  **Case 1: The Moonlighting Protein**
  A specific protein is transcribed in the eye lens and the liver. In the liver, it catalyzes a metabolic reaction. In the lens, it is stockpiled at high concentration for its refractive properties, though it still catalyzes the reaction there. Evolution selected it for the metabolism; the optical benefit is a later exaptation.
  *Statement:* "The function of this protein in the lens is to refract light."
  *   (A) True.
  *   (B) False (it was not selected for this).
  *   (C) True only relative to an optical explanation; False relative to an evolutionary one.
  *   (D) Not the kind of sentence that is true or false.

  **Case 2: The New Duplicate**
  A gene duplication event occurred four generations ago. The copy is transcribed and its product stabilizes cell membranes, increasing survival. There has been insufficient time for natural selection to act on this copy specifically.
  *Statement:* "The function of this gene copy is to stabilize membranes."
  *   (A) True (it is doing the job).
  *   (B) False (it has no evolutionary history yet).
  *   (C) True, but only in a derivative sense (like a spare part).
  *   (D) False (genes don't have functions, only organisms do).

  **Case 3: The Swamp Organism**
  A molecule-for-molecule duplicate of a wolf condenses out of swamp muck. It has no ancestors. Its heart circulates blood perfectly.
  *Statement:* "The function of the swamp-heart is to circulate blood."
  *   (A) True (it contributes to the system's survival).
  *   (B) False (it lacks a selection history).
  *   (C) True, but we cannot say it is *supposed* to circulate blood.
  *   (D) False (without a designer or lineage, 'function' is the wrong word).

  **Case 4: The Obsolete Trait**
  A moth population lives on an island where bats went extinct 200 generations ago. The moths still perform an evasive dive when they detect ultrasound. The dive no longer aids survival or reproduction.
  *Statement:* "The function of the dive response is to avoid predation."
  *   (A) True (that is why the mechanism is there).
  *   (B) False (it no longer contributes to survival).
  *   (C) True (it would avoid predation if bats were present).
  *   (D) False (the trait is now neutral).

  **Case 5: The Broken Heart**
  An individual mammal is born with a heart that cannot pump blood, though the species typically has pumping hearts. The individual dies young.
  *Statement:* "The function of this individual's heart is to pump blood."
  *   (A) True (it is a malfunctioning heart).
  *   (B) False (it does not and cannot pump).
  *   (C) True, but only as a statistical average of the species.
  *   (D) False (this specific organ has no function).

  **Case 6: The Prebiotic Strand**
  A self-replicating RNA strand exists in a warm pool. There is no larger organism containing it, and no lineage of death/selection yet, just chemical persistence.
  *Statement:* "The function of the strand's folding is to enable replication."
  *   (A) True (it contributes to its own persistence).
  *   (B) False (there is no containing system to serve).
  *   (C) False (there is no selection history).
  *   (D) True, but 'function' is just a metaphor for 'cause' here.

  **Case 7: The Bridge Drain**
  A bridge bearing is designed to carry load. As a side effect, its shape channels rainwater away from the abutment. The engineer never intended this, but it prevents corrosion.
  *Statement:* "The function of the bearing's shape is to channel water."
  *   (A) True (it does the job).
  *   (B) False (it was not designed or selected for this).
  *   (C) True (it contributes to the bridge's longevity).
  *   (D) False (only the load-bearing is a function).

  **Case 8: The Robot Vision**
  A robot's vision module was not explicitly coded. It was shaped by gradient descent over millions of episodes to identify obstacles. It now reliably does so and would be retrained if it stopped.
  *Statement:* "The function of the module is to identify obstacles."
  *   (A) True (it was optimized for this).
  *   (B) False (it is not biological).
  *   (C) True (it currently contributes to the robot's goal).
  *   (D) False (software has causal roles, not functions).

  **Case 9: The Fever**
  A human runs a high fever during infection. This is statistically abnormal and harmful if prolonged, but helps kill pathogens in the short term.
  *Statement:* "The function of the fever is to raise body temperature to kill pathogens."
  *   (A) True (it is a defense mechanism).
  *   (B) False (it is a statistical deviation from the norm).
  *   (C) True only if the fever stays within a specific range.
  *   (D) False (physiological processes just happen; they don't have functions).

  **Case 10: The General Query**
  A biologist asks "What is the function of the thumb?" in a lab meeting.
  *Statement:* "There is a single, context-independent fact of the matter about what the thumb's function is."
  *   (A) True.
  *   (B) False (it depends on whether you ask about grasping, opposition, or evolution).
  *   (C) True, but we might not know it yet.
  *   (D) False (thumbs don't have functions, people do).

  ***

  # PART 3: SCORING KEY

  Tally your answers. Do not look at the theory names until you have your result.

  **The Pluralist Check**
  *   If you chose **(C)** on **Case 1** OR **(B)** on **Case 10**:
      *   **Result:** **Pluralist / Pragmatist.**
      *   *Commitment:* Function ascriptions are tools for explanation, not descriptions of mind-independent properties. History matters for evolutionary questions; capacity matters for engineering questions.

  **The Deflationist Check**
  *   If you chose **(D)** on **three or more** cases:
      *   **Result:** **Error-Theory / Deflationist.**
      *   *Commitment:* Teleological language is useful heuristic talk, but nothing in the world literally makes these sentences true.

  **The History Check (Cases 2, 3, 4)**
  *   If you chose **(B)** on **Case 2** AND **(B)** on **Case 3** AND **(A)** on **Case 4**:
      *   You require **Natural Selection History**. Proceed to *Normativity Check*.
  *   If you chose **(A)** on **Case 2** OR **(A)** on **Case 3**:
      *   You are a **Current Contribution** theorist. Proceed to *System Check*.
  *   If you chose **(A)** on **Case 8** but **(B)** on **Case 3**:
      *   You require **Optimization History** (Design/ML) but not necessarily Biological Lineage. Proceed to *Artifact Check*.

  **The Normativity Check (Cases 5, 9)**
  *   (For those requiring History):
      *   If you chose **(A)** on **Case 5** (Broken Heart has function): **Selected-Effects / Etiological.**
      *   If you chose **(B)** on **Case 5**: You likely collapse into Causal Role (see below).
  *   (For those requiring Current Contribution):
      *   If you chose **(A)** on **Case 9** (Fever has function despite abnormality): **Boorse-ish Dispositional.** (You allow statistical norms).
