answer: |-
  ### Part 1: The Arithmetic (Do This Before Class)

  You need these numbers on a cheat sheet. They are the anchor for the entire session.

  **The Gamble:**
  *   **Coin:** Fair ($p=0.5$).
  *   **Payoff:** Net 3:1. (Stake \$1 $\to$ Heads: +\$3, Tails: -\$1).
  *   **Wealth Multiplier:**
      *   Heads: $W_{new} = W_{old} \times (1 + 3f)$
      *   Tails: $W_{new} = W_{old} \times (1 - f)$

  **The Critical Fractions:**
  1.  **Max Expected Value (Arithmetic Mean):** $f = 100\%$ (All-In).
      *   *Why:* $E[\text{Return}] = 0.5(1+3f) + 0.5(1-f) = 1 + f$. Maximized at $f=1$.
      *   *Risk:* 50% chance of total ruin every round.
  2.  **Max Long-Run Growth (Geometric Mean / Kelly):** $f = 33.3\%$ ($1/3$).
      *   *Why:* Maximizes $0.5 \ln(1+3f) + 0.5 \ln(1-f)$.
      *   *Result:* Wealth grows by ~15% per round on average.
  3.  **The "Doom" Threshold:** $f = 66.6\%$ ($2/3$).
      *   *Why:* At this fraction, the geometric mean is exactly 1. $(1+3f)(1-f) = 1$.
      *   *Result:* Any bet **above 66%** has **Positive Expected Value** but **Negative Long-Run Growth**. You will mathematically trend toward zero despite the bet being "favorable."

  **The Simulation (22 Players, 15 Rounds, Fixed Bet $f=75\%$):**
  *We use 75% for the game because it is in the "Doom Zone" (>66%) but allows survival long enough to see the trend (unlike All-In).*
  *   **Individual Trajectory:** The geometric multiplier per round is $\sqrt{(1+2.25)(0.25)} = \sqrt{0.8125} \approx 0.90$.
      *   *Median Player:* After 15 rounds, wealth $\approx 0.90^{15} \approx 20\%$ of starting capital.
  *   **Room Trajectory (Ensemble):** The arithmetic multiplier per round is $0.5(3.25) + 0.5(0.25) = 1.75$.
      *   *Theoretical Average:* After 15 rounds, average wealth $\approx 1.75^{15} \approx 4,500\times$ starting capital.
  *   **The Reality in Class:**
      *   ~18 students will end with less than they started (drifting to zero).
      *   ~4 students will get lucky (10+ heads) and hold massive wealth.
      *   **The Visual:** The *Sum* of all chips in the room will skyrocket (driven by the 4 winners). The *Median* chip count will crash.

  ---

  ### Part 2: Game Design & Logistics

  **Time:** 75 Minutes
  **Materials:**
  *   22 Bags of Poker Chips (100 chips each, 1 color).
  *   22 Index Cards (labeled "Bankroll Log").
  *   11 Coins (shared pairs) OR 1 Coin (Facilitator flips for all—see note below).
  *   Whiteboard + Markers (Red and Blue).
  *   Laptop (optional, for backup calculation if board math lags).

  **Round Structure (15 Rounds Total):**
  1.  **Setup (10 mins):** Distribute chips (100 each) and Index Cards.
  2.  **The Mandate (5 mins):** Explain the bet (3:1 payoff). **Crucial:** Tell them: *"To test high-conviction investing, everyone must bet exactly 75% of their current bankroll every round. Round up to the nearest chip."*
      *   *Why mandate?* If they choose, half will bet 10% and hide the effect. We need them in the "Doom Zone" to see the EV vs. Growth gap.
  3.  **The Play (40 mins):**
      *   **Speed:** 2.5 minutes per round.
      *   **Action:** Students calculate 75% of their current stack, push chips to the center.
      *   **Flip:** If you have 11 coins, pass them down rows. If 1 coin, you flip for the whole room (correlated risk—see "Honest Part"). *Recommendation: Use 11 coins so pairs flip independently. This creates the "Ensemble" effect better.*
      *   **Record:** Winners take 4x stake. Losers take 0. Update Index Card "Current Total."
      *   **Bust Rule:** If a student hits 0 chips, they are not out. They become an **"Auditor."** Give them a red marker. Their job is to update the Whiteboard Graph (see below). This keeps them engaged.
  4.  **The Tally (5 mins):** Collect final chip counts.

  **The Visualization (Whiteboard):**
  Draw a graph before class.
  *   **X-Axis:** Rounds 0 to 15.
  *   **Y-Axis:** Chip Count (Linear Scale).
  *   **Line 1 (Blue):** "Total Room Wealth" (Sum of all 22 players).
  *   **Line 2 (Red):** "Median Player Wealth" (The 11th richest player).
  *   **Process:** Every 3 rounds, pause. Auditors calculate the Sum and the Median. Plot the points.
  *   **Expected Result:** The Blue Line goes up exponentially. The Red Line goes down toward zero.

  ---

  ### Part 3: Token Scheme (No Calculators)

  100 chips is easy to work with mentally.
  *   **Start:** 100.
  *   **Round 1 Bet:** 75.
      *   Win: Keep 25 + Win 225 (3x stake) = 250.
      *   Lose: Keep 25.
  *   **Round 2 Bet (if 250):** 187 (round to 185 for speed).
      *   *Facilitator Tip:* Put a "75% Cheat Sheet" on the board for the first few rounds so they don't stall on math.
      *   100 $\to$ Bet 75
      *   250 $\to$ Bet 185
      *   625 $\to$ Bet 470
      *   25 $\to$ Bet 20
  *   **Rounding:** Allow rounding to the nearest 5 chips to speed up counting.

  ---

  ### Part 4: Stage Two (The Single Shot)

  **Goal:** Make them feel the shift from "Ensemble Reasoning" (Game 1) to "Time Reasoning" (Real Life).

  **Setup:**
  1.  Announce the game is over.
  2.  Tell them: *"You now have a chance to convert your chips into course credit (or a $50 gift card for the top 3)."*
  3.  **The Offer:** "You can cash out your chips as they are. OR, you can go All-In on one final coin flip. Heads: 4x your chips. Tails: 0 chips."
  4.  **The Twist:** Before they decide, ask: *"In the last game, the Room Total went up. The bet had positive EV. Why would anyone say No?"*
  5.  **The Vote:** Have them write "Cash" or "Flip" on a slip of paper. Collect and tally.
  6.  **The Reveal:** Most will say "Cash."
  7.  **The Discussion:** Ask a student who switched strategies: *"You maximized EV in the game. Why not now?"*
      *   *Target Answer:* "Because I only get one life. I can't be the average of 22 people."

  ---

  ### Part 5: The Debrief (Scripting the Insight)

  **1. Map the Board:**
  Point to the Blue Line (Room Total). *"This line represents Expected Value. It went up. The bet was mathematically 'good'."*
  Point to the Red Line (Median). *"This line represents Your Experience. It went down. The bet was practically 'bad'."*

  **2. Handle the Lucky Winner:**
  Someone will have 10,000 chips. They will say: *"But I won. EV worked for me."*
  **Your Response:** *"You didn't prove EV works. You proved variance exists. If we ran this class 100 times, you would go broke in 99 of them. You are the outlier that makes the Average look good while the Typical person suffers. Did you choose the strategy, or did the coin choose it for you?"*

  **3. Define the Vocabulary (Now):**
  *   **Ergodicity:** "In the first game, we looked at the room (Ensemble). In the second, you looked at your life (Time). When those two don't match, the system is **Non-Ergodic**."
  *   **Geometric vs. Arithmetic:** "EV uses Arithmetic (averaging outcomes). Wealth uses Geometric (compounding outcomes). If you optimize Arithmetic in a Geometric world, you go broke."

  ---

  ### Part 6: The Honest Part (What Will Go Wrong)

  **1. The "Bust-Out" Boredom:**
  *   **Risk:** Even at 75% bet, some students will hit near-zero quickly and disengage.
  *   **Fix:** The "Auditor" role is critical. Give the busted students the red marker and the calculator. Make them responsible for the "Bad News" (the Red Line). If they see the Red Line dropping, they feel vindicated rather than defeated.

  **2. Correlated Risk (The One-Coin Problem):**
  *   **Risk:** If you only have one coin and flip it for the whole room, everyone wins or loses together. The "Room Total" and "Median" will move in lockstep. The divergence won't happen.
  *   **Fix:** You **must** have independent flips. Use 11 coins and have pairs flip. If you only have 1 coin, you cannot run this demo effectively. You must simulate the "Ensemble" by telling them: *"Imagine 22 parallel universes."* (This is weaker). **Get 11 coins.**

  **3. The "Fake Money" Effect:**
  *   **Risk:** Students know chips aren't rent money. They might take wild risks in Stage Two that they wouldn't in real life, muddying the lesson.
  *   **Fix:** In Stage Two, make the stakes social. "Top 3 chip counts get their names on the board for the rest of the semester." Status often mimics financial utility better than fake cash.

  **4. The Math Drag:**
  *   **Risk:** Calculating 75% of weird numbers (e.g., 75% of 37 chips) will eat 5 minutes per round.
  *   **Fix:** Enforce "Rounding to 5s." 75% of 37 is 27.75. Call it 25 or 30. Precision matters less than the trend.

  **5. The Limitation of the Game:**
  *   **What the chips can't teach:** Chips reset next week. Wealth doesn't.
  *   **What you must say:** "In this game, if you bust, you sit out. In the economy, if you bust, you're out of the market. The 'Room Total' keeps growing because the lucky winners stay in. In reality, when people bust, they leave the market, and the 'Average' becomes a lie told by the survivors. That is Survivorship Bias, and it is born from Non-Ergodicity."
