  9.  **Final Polish:** Check against the "45 minutes" constraint. The questions must be answerable with field data or proposal text. No deep research allowed.

      *Refining the "Values Hand-off":* When does the Board decide? When the insect welfare is neutral/negative but the human benefit is high. That's a trade-off. The Entomologist decides the *insect cost*. The Board decides if the *human benefit* justifies it.

      *Refining the "Swamping":* Explicitly state: "We do not count the dead." We count the *change in mode of death* and *density anomalies*.

      *Let's write the Procedure.*
