answer: |-
  ### Spec for Rational Preference Over Risky Prospects (One-Shot, Single Agent)

  **Purpose:** Normative guidance for a single agent making a one-off choice, with fixed preferences, no repeat play, and no counterparty to exploit inconsistencies.

  #### 1. Desiderata List

  | Desideratum | Requirement | Case / Consideration | Status |
  | :--- | :--- | :--- | :--- |
  | **Transitivity** | If A ≻ B and B ≻ C, then A ≻ C. | Without this, the agent has no stable ranking to guide choice; preference becomes circular. | **Non-negotiable** |
  | **Stochastic Dominance** | If A yields better outcomes than B in every state (or equal in all, better in some), A ≻ B. | Violating this implies choosing a prospect known to be worse in every possible world. | **Non-negotiable** |
  | **Description Invariance** | Preferences must not change if the same prospect is described differently (framing). | If preference flips on wording, it reflects a cognitive bug, not a stable valuation of the prospect. | **Non-negotiable** |
  | **Completeness** | For any A, B, either A ≻ B, B ≻ A, or A ∼ B. | Ensures a decision is always possible. | **Camp Taste** |
  | **Continuity (Archimedean)** | No outcome is infinitely better/worse than another; no lexicographic preferences. | Prevents "safety first" rules from trumping all expected gains. | **Camp Taste** |
  | **Reduction of Compounds** | A two-stage lottery is equivalent to a single-stage lottery with the same final probabilities. | Assumes only final outcomes matter (consequentialism), not the *process* of risk resolution. | **Camp Taste** |
  | **Independence (Separability)** | Preference between A and B is unaffected by mixing both with a common C. | Assumes preferences separate across states/events; the core of the Allais dispute. | **Camp Taste** |
  | **Event-Wise Dominance** | If A is preferred to B conditional on any partition of events, A ≻ B overall. | A stronger form of separability; ensures local rationality aggregates to global rationality. | **Camp Taste** |
  | **Risk-Attitude Consistency** | Risk aversion/seeking should not flip arbitrarily based on coarse/fine descriptions. | Prevents manipulation via granularity, though some variation across wealth levels is permitted. | **Camp Taste** |

  #### 2. The Institutional Shift
  If the purpose changes to **"a rule an institution imposes on many agents making many correlated bets"**, the following shift occurs:
  *   **Completeness** becomes **Non-negotiable**: The institution must be able to price every asset; "I don't know" is not an admissible output for a market maker.
  *   **Continuity** becomes **Non-negotiable**: Lexicographic rules prevent clearing prices and efficient capital allocation.
  *   **Dynamic Consistency** (not listed above) becomes **Non-negotiable**: In repeated play, planning a strategy and then deviating later allows the institution to be money-pumped or arbitrated by agents. In your one-shot case, this does not bite.

  #### 3. Joint Unsatisfiability (Impossibility Results)
  *   **Independence + Allais Preferences:** You cannot satisfy the Independence axiom and accommodate the typical Allais pattern (preferring certainty in one pair, but higher expectation in the other). Independence forbids the "certainty effect" that drives the Allais preference.
  *   **Stochastic Dominance + Simple Betweenness:** Some models that violate Independence to allow Allais preferences (like simple betweenness models) inadvertently violate Stochastic Dominance. You need a more complex structure (like rank-dependence) to keep both.
  *   **Completeness + Continuity + Transitivity + Independence:** This set forces the Expected Utility representation. If you want to keep the first three but allow Allais preferences, you *must* drop Independence.

  #### 4. Redundancies and Hygiene
  *   **Independence vs. Event-Wise Dominance:** These are often methodological cousins. Independence is the probabilistic version; Event-Wise Dominance is the state-space version. Satisfying one usually requires satisfying the other in standard formalisms.
  *   **Description Invariance vs. Reduction of Compounds:** Reduction is often justified *by* Description Invariance (the tree diagram is just a description). However, if an agent cares about the *temporal resolution* of uncertainty, Reduction fails without violating Invariance. Treat Reduction as a substantive claim about whether the *process* of gambling has utility, not just hygiene.

  #### 5. The Allais Fork
  **Does this list settle the Allais question?**
  No. There is a real fork. Two theories can satisfy every **Non-negotiable** item (Transitivity, Dominance, Invariance) and still disagree on Allais.

  **The Extra Decision:**
  You must decide whether **Independence** is a requirement of rationality or a restriction on the *domain* of goods.
  *   *Side A:* Rationality requires evaluating prospects solely by their final probability distribution (Independence holds). Allais preferences are a bias.
  *   *Side B:* Rationality permits caring about the *structure* of the distribution (e.g., the security of certainty) independently of the final outcomes (Independence fails). Allais preferences are rational.
  This is not a hidden desideratum; it is a metaphysical choice about whether "risk" is merely a calculator of outcomes or a distinct component of value.

  #### 6. Verdicts

  **Expected Utility (EU)**
  Satisfies all Non-negotiables and Independence. It fails to accommodate Allais preferences, classifying them as irrational. It is the most restrictive but mathematically robust theory for the one-shot case.

  **Rank-Dependent Utility (RDU)**
  Satisfies all Non-negotiables (including Stochastic Dominance) but violates Independence. It accommodates Allais preferences by weighting probabilities based on their rank (outcome size) rather than treating them linearly.

  **Risk-Weighted Expected Utility (Buchak)**
  Satisfies all Non-negotiables but violates Independence. It explicitly separates risk attitude from utility, allowing the agent to weight the *contribution* of probabilities non-linearly. It formalises the "Camp Taste" of risk sensitivity.

  **Savage / Jeffrey (Subjective Prob)**
  Savage satisfies Non-negotiables but requires Independence to derive probabilities, forcing EU. Jeffrey allows more flexibility on Independence but struggles to separate belief from desire cleanly in risky choices, making it less decisive on the Allais problem without extra constraints.
