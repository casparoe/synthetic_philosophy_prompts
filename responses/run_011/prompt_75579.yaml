prompt: |-
  ok so I'm trying to build up a spec before I read any more of the choice-under-risk literature, because every paper in that area seems to start by assuming thier own answer to the Allais problem and then arguing from it. here's what I want from you: write out the desiderata — the list of things a theory of rational preference over risky prospects has to deliver before it counts as adequate, with the case or consideration behind each entry. and for each one, say whether it's genuinely non-negotiable or whether it's really the taste of one camp dressed up as a requirement.

  purpose, since adequacy is relative to it: I want a norm for a single agent making a one-shot choice, who knows what they want, who won't be offered the same gamble again next week, and who isn't going to be traded against by anyone. so please don't let "but you could be money-pumped" get a free pass just because it sounds decisive — tell me which of the standard objections actually still bite under that setup and which only bite once you have repeated play, sequential decomposition, or an institution involved. then briefly say which of your non-negotiables you'd have to demote if I changed the purpose to "a rule an institution imposes on many agents making many correlated bets".

  stuff I'd expect to show up somewhere on the list, in whatever form you think is right: getting the common-consequence and common-ratio patterns straight, and saying which of them a theory is allowed to violate and which it isn't; some account of which risk attitudes are permissible (can an agent be risk-averse about a fine-grained gamble and risk-seeking about a coarser description of it, and is that a bug or a feature?); not being pushed around by how the same problem is written down; continuity/archimedean-ness, and whether that's a substantive claim about rationality or just technical convenience; stochastic dominance; whether reduction of compound lotteries is a requirement or an assumption smuggled in through the formalism; and whatever you think about seperability across events, since that's roughly where the independence axiom lives and where the whole fight is. add whatever I've missed — I'm sure I've missed the interesting ones.

  then the bit I actually most want: which subsets of these are jointly unsatisfiable? if there's a result or a short argument showing you can't have three of them at once, name the three and say in a sentence or two why they can't coexist. separately, flag any pair of "desiderata" that you suspect are the same requirement under two names, or are methodological hygiene rather than conditions on the theory itself.

  and finally, keep this short: does the list settle the Allais question, or does it leave a real fork — i.e. could two theories that both satisfy every non-negotiable still disagree about whether the Allais preferences are rational or a bias? if there's a fork, say what extra decision you'd have to make to close it, and why it isn't just another desideratum in disguise. then give me a two-sentence-each verdict on expected utility, rank-dependent utility, risk-weighted expected utility of the Buchak sort, and a Savage/Jeffrey-style view where the probabilities come out of the preferences themselves, scored against your list. no bibliography, no reading list, no citations — I'm offline and I'll chase sources down later. british english please, and a table is fine for the main list.
