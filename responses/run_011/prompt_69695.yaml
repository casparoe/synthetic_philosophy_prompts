prompt: |-
  I'm a novelist — third book, out next spring if nothing goes wrong — and my main character is a woman who starts out counting cards in Vegas, gets her face into every database in the state, and then moves into sports betting and eventually ends up running a tiny fund out of a co-working space in Reno. I did about six weeks of research for it (two long interviews with actual advantage players, a truly embarrassing amount of time on poker forums) but the math bits I'm shakey on, so I asked an old college friend who spent some years on a prop desk to send me a one-pager on the Kelly criterion, since my character is supposed to live by it and quote it at people. He emailed me the thing below, and I've already drafted two scenes around it, which is my problem: I now can't tell whether I'm building on rock or on a smart guy showing off. So before I write the scene where she explains it to her brother, I want to know how much of this survives contact with someone who actually does this for a living.

  Here's roughly what he sent: (1) Kelly is just a formula for how much of your bankroll to put on a bet when you think you have an edge — for a bet that pays b-to-1 you stake f = (bp − q)/b of your roll, where p is your win probability and q is 1 − p, which in practice means your edge divided by your odds. (2) The reason it works is that it's the stake size that maximizes the expected value of your bankroll; anything smaller leaves growth on the table and anything bigger takes risk for nothing, so Kelly is a single number, not a range. (3) It has nothing to do with utility or psychology or how much risk you can stomach — plain expected-value thinking tells you to bet your whole roll on any positive-edge bet, which obviously bankrupts you, and Kelly fixes that by looking at what happens to one person over a long sequence of bets rather than averaging over imaginary parallel bettors; a Nobel laureate in the sixties wrote a paper calling this a fallacy and it never really got settled. (4) If your estimate of p is a bit off it's no big deal, you just grow slightly slower, because the curve is smooth near the top. (5) You literally cannot go broke betting Kelly, since you're always only staking a fraction of what you have — worst case you get small. (6) Half-Kelly halves your long-run growth and also halves your swings, so people who tell you to always bet half are just admitting they're scared; pros bet full.

  What I want is an audit, not a lecture. Go through it point by point and tell me what a working quant or a serious advantage player would nod at, what they'd wince at, and what's just wrong — and please be specific about the wrong-in-a-confident-way kind, because that's the kind my friend would have written and the kind my character would repeat at a bar and get called out for. Then three things. First: my plot needs her to follow this system faithfully and still end up nearly broke and borrowing money at a genuinely bad rate, and I need to know if that's consistent with the corrected math or if I'm cheating readers who know this stuff — if it is consistent, tell me which mechanism actually does it and whether a disciplined pro could fall into it or only a sloppy one. Second: rewrite the crib sheet the way it should have been written, in plain language I could hand my character, keeping whatever is true in what he said. Third: tell me which of these claims she could plausibly say out loud to other gamblers without sounding like a textbook or a mark. And where the experts genuinely disagree — I gather there's some live argument about whether Kelly needs a utility function at all, or whether it's about time averages versus something else — just flag it as contested and tell me how confident I can let her sound, don't pretend there's a settled answer. I don't need sources or a reading list, I need to know what to put in her mouth.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Novelist (3rd book), writing about a female advantage player (card counter $\rightarrow$ sports betting $\rightarrow$ small fund manager).
      *   **Problem:** Friend (ex-prop desk) sent a one-pager on the Kelly Criterion. User drafted scenes based on it but fears it might be inaccurate or "showing off" rather than practical truth.
      *   **Task:** Audit the friend's 6 points (what's right, what's wince-worthy, what's dead wrong).
      *   **Specific Constraints:**
          1.  Check plot consistency: Can she follow Kelly faithfully and *still* end up nearly broke/borrowing at bad rates? (Needs mechanism).
          2.  Rewrite the crib sheet (plain language, accurate).
          3.  Identify what claims she can say out loud without sounding like a mark/textbook.
          4.  Flag contested areas (don't fake consensus).
      *   **Tone:** Audit, not lecture. Specific about "wrong-in-a-confident-way." Practical for a novelist.

  2.  **Audit the Friend's 6 Points:**

      *   *(1) Formula:* $f = (bp - q) / b$.
          *   *Verdict:* Correct. This is the standard definition.
          *   *Nuance:* In sports betting, odds are usually moneyline or decimal, not always "b-to-1". But conceptually correct.
      *   *(2) Maximizes Expected Value (EV) of Bankroll / Single Number:*
          *   *Verdict:* Mostly correct, but "Expected Value of your bankroll" is slightly sloppy terminology. It maximizes the expected *logarithm* of wealth (geometric growth rate).
          *   *Wince:* "Single number, not a range." Technically true for Full Kelly, but pros rarely bet Full Kelly.
      *   *(3) Utility/Psychology vs. Time Averages / Nobel Laureate:*
          *   *Verdict:* This is the messiest part. Samuelson (Nobel laureate) did criticize Kelly (maximizing geometric mean doesn't maximize expected utility for finite horizons in some frameworks). The "time averages vs. ensemble averages" argument is a modern reframing (Ergodicity Economics, Ole Peters).
          *   *Wince:* "Never really got settled." It *is* settled in practice (people use Fractional Kelly), but theoretically, the debate exists. The friend dismisses utility too easily.
      *   *(4) Estimation Error / Smooth Curve:*
          *   *Verdict:* **Dangerous.** This is the biggest risk. The curve is smooth near the top *if* you know $p$. If you overestimate edge, you overbet. Overbetting Kelly leads to volatility drag and ruin.
          *   *Wrong:* "No big deal." It is a big deal. Overestimating edge is the #1 way Kelly bettors go broke.
      *   *(5) Cannot Go Broke:*
          *   *Verdict:* **Mathematically False in Practice.** Theoretically, with infinite divisibility and continuous betting, you approach zero but never hit it. In reality? Table limits, minimum bet sizes, margin calls, and "gambler's ruin" due to variance *before* recovery happen.
          *   *Wrong:* "Literally cannot go broke." This is the most confident wrong statement.
      *   *(6) Half-Kelly / Pros bet Full:*
          *   *Verdict:* **Dead Wrong.** Almost no serious pro bets Full Kelly. It's too volatile. Half-Kelly or Quarter-Kelly is standard.
          *   *Wrong:* "Pros bet full." This marks her immediately as an amateur if she says this to a room of pros.

  3.  **Address Plot Consistency (Going Broke on Kelly):**
      *   *Question:* Can she follow Kelly and end up nearly broke?
      *   *Answer:* Yes, but not because Kelly *mathematically* guarantees ruin (it doesn't, theoretically).
      *   *Mechanisms:*
          1.  **Overestimation of Edge:** She thinks she has 5%, she has 1%. She bets 5x too much. This causes "volatility drag."
          2.  **Correlated Risk:** Sports betting isn't independent coin flips. If she bets on 5 games all dependent on the same weather event, she's effectively overbet.
          3.  **Table Limits/Minimums:** If bankroll drops, Kelly stake drops. If it drops below minimum bet size, she can't execute the strategy (cannot compound back up).
          4.  **Margin Calls/Leverage:** If she's running a "fund" or using leverage (common in sports betting funds), Kelly doesn't protect against liquidation events.
          5.  **Sequence Risk:** A bad run early can deplete capital needed for living expenses, forcing withdrawal from the bankroll (eating the seed corn).
      *   *Conclusion:* It is consistent, provided she is *overconfident in her edge* or faces *external constraints* (minimum bets, living expenses). A disciplined pro usually uses Fractional Kelly to avoid this. If she uses Full Kelly, she is aggressive/borderline reckless.

  4.  **Rewrite the Crib Sheet:**
      *   Needs to be plain language.
      *   Needs to correct the "Full Kelly" myth.
      *   Needs to acknowledge estimation error.
      *   Needs to explain *why* it prevents ruin (mostly) but admits limits.
      *   Tone: Practical, cynical, trader-to-trader.

  5.  **Dialogue/Claims Analysis:**
      *   *Safe to say:* "Edge over odds," "Growth vs. Ruin," "Fractional Kelly is standard."
      *   *Dangerous to say:* "Full Kelly is best," "Impossible to go broke," "Estimates don't matter."
      *   *Contested:* The theoretical justification (Utility vs. Ergodicity). She can sound confident on the *practice*, less confident on the *philosophy*.

  6.  **Drafting the Response:**
      *   *Structure:*
          1.  Audit (Point by Point).
          2.  Plot Consistency (How she goes broke).
          3.  Revised Crib Sheet.
          4.  Dialogue Guide (What to say/What to avoid).
      *   *Tone Check:* Keep it sharp. The user is a novelist, not a math student. Focus on narrative credibility.
      *   *Specific Focus:* The "Wrong-in-a-confident-way" bits need to be highlighted because those are the ones that will make readers roll their eyes.

      *(Self-Correction during drafting)*: I need to make sure I distinguish between "Card Counting" (blackjack) and "Sports Betting." Kelly applies to both, but the variance profiles are different. Blackjack has lower variance, sports betting higher. The friend's note implies sports betting context ("prop desk"). I should ensure the advice fits the sports betting fund context.
      *Crucial Point:* The friend said "Pros bet full." This is the biggest red flag. I need to emphasize that *real* pros bet half or quarter Kelly. If she says "Pros bet full," she sounds like a wannabe.
      *Crucial Point:* "Literally cannot go broke." This is theoretically true for continuous functions, practically false. I need to explain *why* (discrete bets, minimums, margin).

      *Plot Mechanism:* How does she go broke? The most realistic way for a "fund" manager is **correlation** and **overestimation**. If she thinks she has uncorrelated bets but they all lose on the same Tuesday, her bankroll tanks. Also, **withdrawal for living expenses** is a killer. Kelly assumes reinvestment. If she eats the bankroll to pay rent in Reno, the compounding breaks.

      *Refining the Crib Sheet:* Make it look like a sticky note or a text message. Short, punchy.

      *Refining the Dialogue:* Give her lines that sound experienced, not academic. "It's not about winning, it's about not dying."

  7.  **Final Review against constraints:**
      *   Audit point by point? Yes.
      *   Plot consistency (broke on Kelly)? Yes.
      *   Rewrite crib sheet? Yes.
      *   Dialogue claims (plausible vs. mark)? Yes.
      *   Flag contested theory? Yes.
      *   No sources/reading list? Yes.

      *Let's write.*
answer: |-
  Here is the audit of your friend's one-pager, followed by the plot mechanics, the corrected crib sheet, and the dialogue guide.

  ### Part 1: The Audit
  Here is how a working quant or a serious sports bettor would react to each of your friend's six points.

  **(1) The Formula:** $f = (bp - q) / b$.
  *   **Verdict:** **Nod.**
  *   **Detail:** This is the standard definition. In sports betting, "b" (odds) varies bet-to-bet (unlike blackjack), so the calculation is more tedious, but the math is solid.
  *   **Note:** In practice, pros convert moneyline odds to decimal implied probability first. If she's doing this in her head at a bar, she's a wizard, but the formula is correct.

  **(2) Maximizes Expected Value / Single Number:**
  *   **Verdict:** **Wince.**
  *   **Detail:** It maximizes the expected *logarithm* of wealth (geometric growth), not raw expected value. Raw EV says bet everything on any positive edge. Kelly maximizes the *rate* of growth.
  *   **The Trap:** Saying it's a "single number, not a range" is theoretically true for *Full* Kelly, but in practice, edge is never a single number; it's a distribution. Pros treat it as a range.

  **(3) Utility/Psychology vs. Time Averages / Nobel Laureate:**
  *   **Verdict:** **Contested / Show-offy.**
  *   **Detail:** Your friend is referencing the Samuelson critique (1979). Samuelson argued maximizing geometric mean doesn't maximize expected utility for finite horizons. The "time average vs. ensemble average" argument is a modern reframing (Ergodicity Economics).
  *   **The Trap:** Saying "it never really got settled" is true in academia, but irrelevant in the trenches. Traders don't care about the philosophy; they care that Full Kelly hurts. Dismissing utility is dangerous because "risk stomach" is exactly why people use Fractional Kelly.

  **(4) Estimation Error / Smooth Curve:**
  *   **Verdict:** **Wrong-in-a-Confident-Way.**
  *   **Detail:** This is the most dangerous advice in the email. The growth curve is smooth *if you know the true probability*. But advantage players never know the true probability; they only have an *estimate*.
  *   **The Reality:** If you overestimate your edge by even a little, you overbet. Overbetting Kelly increases variance disproportionately. If you bet *double* Kelly, your expected growth rate drops to zero. If you bet more than that, it goes negative. Estimation error is the #1 killer of Kelly bettors.

  **(5) Literally Cannot Go Broke:**
  *   **Verdict:** **Dead Wrong.**
  *   **Detail:** Theoretically, with infinite divisibility and no minimum bet size, you approach zero asymptotically but never hit it.
  *   **The Reality:** In the real world, there are minimum bet sizes, table limits, and margin calls. If your Kelly stake drops below the minimum bet allowed by the book or the fund structure, you are "effectively broke." You cannot compound back up. Also, if you are leveraged (running a fund), you can be liquidated before the long run saves you.

  **(6) Half-Kelly / Pros Bet Full:**
  *   **Verdict:** **Dead Wrong (Mark Territory).**
  *   **Detail:** Almost no serious advantage player bets Full Kelly. It is too volatile. The drawdowns (swings) are brutal.
  *   **The Reality:** The standard industry practice is **Half-Kelly** or **Quarter-Kelly**. This reduces volatility by 50% (or 75%) while retaining 75% (or 50%) of the growth. Anyone telling you "pros bet full" has never managed real risk capital. If your character says this to a room of sports bettors, they will know she is an amateur immediately.

  ***

  ### Part 2: Plot Consistency (How she goes broke)
  **Can she follow Kelly faithfully and still end up nearly broke?**
  **Yes.** But not because the math failed. It fails because of *inputs* and *constraints*.

  **The Mechanism:**
  1.  **Overconfidence in Edge (The Input Error):** Kelly requires an accurate $p$ (win probability). In sports betting, $p$ is an estimate. If she calculates she has a 5% edge and bets Full Kelly, but her actual edge is only 2%, she is mathematically overbetting. This leads to "volatility drag." Her bankroll will bleed out over time even if she wins more than she loses.
  2.  **Correlated Risk:** Kelly assumes bets are independent. In sports, they often aren't. If she bets on five different games, but they all hinge on the same weather event or league-wide scandal, she is effectively making one big bet. If that loses, she takes a hit equivalent to 5x her Kelly stake.
  3.  **The "Eat the Seed Corn" Problem:** Kelly assumes all profits are reinvested. If she is running a fund out of a co-working space, she has overhead (rent, data feeds, living expenses). If she withdraws money from the bankroll to pay rent during a downswing, she reduces the base needed to compound back up. This is the most realistic way a disciplined pro goes broke: **Liquidity mismatch.** She is solvent on paper, but cash-poor in reality.
  4.  **Minimum Bet Constraints:** As her bankroll shrinks, her Kelly stake shrinks. Eventually, her optimal bet is $50, but the sportsbook minimum is $100. She can no longer execute the strategy. She is stuck.

  **Disciplined vs. Sloppy:**
  A *disciplined* pro would use Half-Kelly and keep a separate cash reserve for living expenses. A *disciplined but unlucky* pro could still fail due to correlation (bad luck clustering). A *sloppy* pro (Full Kelly, overestimating edge, mixing operating cash with bankroll) will fail inevitably. For your plot, make her **disciplined on the math but aggressive on the edge estimation.** She trusts her model too much. That is a tragic flaw, not a competence failure.

  ***

  ### Part 3: The Revised Crib Sheet
  *Hand this to your character. This is what a prop desk trader would actually write to a friend who needs to sound credible without getting laughed out of the room.*

  **KELLY CRITERION (THE REAL VERSION)**

  1.  **The Goal:** Maximize geometric growth, not raw profit. It's about survival first, compounding second.
  2.  **The Formula:** Bet size = Edge / Odds. (If you have 5% edge at even money, bet 5% of bankroll).
  3.  **The Trap:** You never know your *true* edge. You only have an estimate. If you overestimate your edge, you overbet. Overbetting Kelly kills you faster than underbetting.
  4.  **The Fix:** Nobody bets Full Kelly. It swings too hard. Standard is **Half-Kelly** or **Quarter-Kelly**. You give up some growth to sleep at night.
  5.  **Ruin:** Theoretically, you never hit zero. Practically, you hit "effective zero" when your bet size falls below the table minimum or you get margin called.
  6.  **Correlation:** Kelly assumes independent bets. If your bets are correlated (same league, same risk factor), you are overbetting. Adjust down.
  7.  **Summary:** Kelly tells you the *maximum* safe bet. It is not a target. Treat it as a speed limit, not a recommendation.

  ***

  ### Part 4: Dialogue Guide (What she can say)
  *Use this to filter her lines. The goal is to make her sound like someone who has taken losses, not someone who read a textbook.*

  **Safe to Say (Sounds like a Pro):**
  *   "Kelly isn't about how much you can win; it's about how much you can survive."
  *   "Full Kelly is for people who don't care about drawdowns. I bet half."
  *   "The math is fine. It's the input that kills you. If you think you have an edge and you don't, Kelly just speeds up your ruin."
  *   "I don't worry about going to zero. I worry about hitting the table minimums before I recover."
  *   "Variance will find you. Kelly just makes sure you're still standing when it does."

  **Do Not Say (Sounds like a Mark/Textbook):**
  *   "It's impossible to go broke using Kelly." (Instant credibility loss).
  *   "Pros bet Full Kelly." (Everyone knows this is false).
  *   "It maximizes expected value." (Technically wrong; it maximizes geometric mean).
  *   "The curve is smooth, so my estimates don't have to be perfect." (This is how funds blow up).
  *   "It's purely mathematical, nothing to do with psychology." (Risk management is entirely psychology).

  **On the Contested Theory (Utility vs. Time Averages):**
  *   **Confidence Level:** Low to Medium.
  *   **How to phrase it:** "There's a debate about whether this is about utility functions or just time averages. Honestly, I don't care. I care that if I bet too big, I'm out of the game."
  *   **Why:** Let her acknowledge the debate exists but dismiss it as irrelevant to the work. This shows experience. Academics argue about *why* it works; pros care *that* it works.

  **Summary for the Scene with the Brother:**
  If she explains this to her brother, she should sound weary, not excited. She shouldn't present Kelly as a magic key to wealth, but as a seatbelt. She wears it because she knows crashes happen. If she treats it like a weapon, she's the villain of her own story. If she treats it like a shield that still let her get cut, she's a tragic protagonist.
