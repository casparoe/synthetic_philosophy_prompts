      *   **Tension D: Capacity vs. Disposition (Points 2 & 3).**
          *   Point 2: KH is not mere capacity (novice luck).
          *   Point 3: KH survives loss of capacity (paralysis).
          *   *Conflict:* Actually, these are consistent. Point 2 says Capacity $\nrightarrow$ KH. Point 3 says KH $\nrightarrow$ Capacity. They are logically compatible.
