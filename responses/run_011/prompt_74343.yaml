          *   *Conflict:* If KH is fundamentally distinct from KT (1), and the purest form is inaccessible to language (4), how does linguistic input (6) integrate into it? It suggests KH is permeable to KT. This is the standard "Intellectualist" counter-argument (Stanley & Williamson). If KT can *constitute* or *directly modify* KH, the distinction blurs.
          *   *Severity:* Medium-High. This is the classic debate. Ryleans usually handle this by saying KT guides the *acquisition* or *correction* of KH, but isn't KH itself. However, combined with Point 4, it gets tricky.

      *   **Tension C: The "Human Exceptionalism" Problem (Points 3 & 5).**
          *   Point 3: Paralyzed pianist knows how.
          *   Point 5: Chess program does *not* know how.
