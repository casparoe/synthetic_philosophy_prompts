          *   **Constraints:** No preamble, no restatement of the question.
      *   **Content:** The debate centers on whether Weber's thesis is a valid explanation, with H. (economic historian, quantitative) arguing against it and M. (cultural sociologist) arguing for it.

  2.  **Analyze the Debate Moves:**
      *   **Move 1 (M):** Weber's thesis is a cultural explanation (elective affinity, probabilistic).
      *   **Move 2 (H):** Quantitative literature disproves it; control for literacy/schooling removes the Protestant advantage.
      *   **Move 3 (M):** Literacy/schooling *is* part of the culture (religious valuation), so this concedes the argument.
      *   **Move 4 (H):** The thesis is unfalsifiable (immunizing strategy); if every mechanism gets absorbed into culture, it explains nothing.
      *   **Move 5 (M):** Demanding mechanism is question-begging; Weber uses counterfactual/probabilistic causation.
      *   **Move 6 (H):** Culture is just a summary label (redescription) or reduces to psychology.
      *   **Move 7 (M):** The ethic outlived the theology (path dependence/institutionalization), which individual beliefs can't explain.

  3.  **Evaluate Each Move (Mental Draft):**
      *   *Move 1:* Mostly right. Weber did frame it as elective affinity/probabilistic. It is a cultural explanation.
      *   *Move 2:* Partially right/oversimplified. Some studies (e.g., Becker & Woessmann) suggest human capital (literacy) mediates the effect, but saying it "finishes it off" is too strong. The mechanism might shift, but the causal chain remains.
      *   *Move 3:* Right. If religion causes literacy which causes capitalism, religion is still a cause. Mediating variables don't negate distal causes.
      *   *Move 4:* Strong point on falsifiability, but applies it too rigidly. If culture is defined too broadly, it becomes tautological. However, Weber's specific historical claim is falsifiable.
      *   *Move 5:* Right on Weber's method. Weber explicitly used objective possibility and probabilistic causation. Demanding deterministic mechanisms misreads Weber.
      *   *Move 6:* Partially right risk. Culture *can* be a redescription, but not necessarily. The reduction to psychology ignores institutional/social dimensions.
      *   *Move 7:* Strong point. Institutionalization/habituation allows culture to persist beyond individual belief. This addresses the "psychology in costume" critique.

  4.  **Identify "Talking Past Each Other":**
      *   H. wants deterministic, mechanistic, individual-level causation (standard econ history).
      *   M. wants probabilistic, structural, historical causation (sociological).
      *   They disagree on what counts as an "explanation" (mechanism vs. counterfactual dependence).
      *   They disagree on the ontology of culture (variable vs. context).

  5.  **Identify "Jointly Missing":**
      *   What makes culture a *cause* rather than a *redescription*?
      *   Need: Institutional embedding, coordination problems, shared expectations, or cognitive schemas that constrain action independently of individual belief.
      *   They miss the *mechanism of transmission* beyond individual belief (e.g., institutions, networks) and the *specificity* required to avoid tautology. Culture causes when it constrains choices via shared expectations or institutional rules, not just when it correlates with behavior.

