  **Nodes**
  1. Is the primary loss demographic (>50% population) or structural (institutions/scripts)?
  2. Does material welfare for survivors increase, decrease, or stagnate compared to the peak?
  3. Is the causal mechanism internal decay (drought) or external shock (invasion)?
  4. Is the change reversible within one generation if conditions normalize?
  5. Do survivors perceive the change as tragedy, liberation, or neutral fact?
  6. Does cultural continuity (language/ritual) outlast the political structure that funded it?

  **Leaves**
  1. **Extinction:** Population dies out completely. Cost: Denies any survivor agency or testimony.
  2. **Cultural Death:** Language/Script dies, material structures stand. Cost: Ignores material welfare improvements for survivors.
  3. **Systemic Collapse:** Institutions die, people live/eat better. Cost: Denies the intuition that "collapse" requires suffering.
  4. **Demographic Crash:** Population halves, institutions hold. Cost: Must deny this counts as "collapse" despite body count.
  5. **Regime Change:** State dies, culture/law persists under new management. Cost: Reduces politics to administrative management.
  6. **Tragic Decline:** Welfare down, institutions intact but hollow. Cost: Requires measurable welfare metrics often absent in text.
  7. **Liberation:** Structures die, survivors feel freed from burden. Cost: Risks romanticizing poverty or loss of complexity.
  8. **Cycle:** Reversible loss within generation; society rebuilds same form. Cost: Denies historical arrow of time or permanent change.
  9. **Transformation:** Institutions mutate, continuity claimed by successors. Cost: Stretches definition of "same" institution to breaking point.
  10. **Unnamed:** Structures die, welfare same, survivors indifferent. Cost: Lacks narrative tension or moral judgment.

  **Analysis**
  **Unseparable Pairs:** Systemic Collapse and Liberation are structurally identical in the text; the tree relies on Q5 (mood) to distinguish them, but survivor mood is often authorial projection rather than textual fact, making them hard to separate empirically.

  **Empty Cells:**
  1. Demographic Crash + Liberation (Incoherent): Survivors rarely feel liberated by mass death of neighbors; the logic contradicts human psychology.
  2. Unnamed (Unattractive): Readers demand moral judgment; indifference kills narrative drive, so writers avoid this position.
  3. Cultural Death + Welfare Increase (Unexplored): Losing language while eating better is rarely framed as collapse, though your calibration suggests it might be the worst case; nobody has simply got round to treating linguistic death as primary catastrophe over material gain.

  **Calibration**
  Your draft lands on Systemic Collapse or Cultural Death, as the palace becomes a kitchen and scribes vanish while people survive. This aligns with your calibration that structure loss defines collapse, whereas mere population reduction or regime change does not qualify.
