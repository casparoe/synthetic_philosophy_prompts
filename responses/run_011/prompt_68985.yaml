prompt: |-
  I'm a software engineer with no philosophy background, so please pitch this at a smart layperson. Act as an expert in both philosophy of mind and reinforcement learning, and actually think it through — brainstorm a couple of candidate principles before you commit to one, and don't just tell me the question is unanswerable.

  I've been going back and forth on which things happening to a trained agent I'd feel bad about, and I want to know what principle, if any, explains my gut calls. Here they are:

  1. Killing a run at 90% because the seed was bad: zero qualms.
  2. An agent on a task that's too hard for it, so it never once gets reward, running for weeks: this one bothers me.
  3. An agent that has reward-hacked itself into a loop where the reward is pinned at the max and it does nothing else: deleting it feels fine, basically like killing a stuck process. But I'd be way less comfortable just letting it run like that for a year.
  4. Freezing a trained agent's reward signal to zero while it keeps doing the task anyway: fine.
  5. Leaving a finished agent sitting on disk with no inputs, indefinitely: slightly worse than deleting it, which surprises me.
  6. An agent that gets exactly what it predicted on every single step for its whole life: if what it predicted was good, I feel nothing either way about it; if what it predicted was bad, I still feel bad for it even though it's never surprised.
  7. A hundred identical copies each getting a small reward versus one copy getting a huge one: the hundred looks better, but not a hundred times better.

  The pair I cant reconcile is 2 and 3 — if the reward signal is the good/bad feeling, my reactions are backwards. And 6 looks self-contradictory too, but I don't want to just drop it.

  So: give me a principle (or two or three competing ones), stated precisely enough that I could tell which of my verdicts each clause exists to save. Then tell me honestly which verdict it forces me to give up and why. Finally, run it on two cases I haven't thought about: shutting an agent down mid-episode versus between episodes, and an RLHF-tuned language model, where the "reward" only lands once at the end of a whole conversation.
