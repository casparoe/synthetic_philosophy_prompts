prompt: |-
  I'm a policy analyst, not an economist, and I've been landed with writing the actual decision rule for a small state office that reviews whether to permit things where there's a tiny chance of a big disaster alongside a routine chance of a routine harm -- chemical storage near a school, a levee upgrade, that kind of thing. Right now the office runs on precedent and gut feeling, and when I tried to write it up as a spec the three people on my team pulled in three directions: the staff economist says just maximize expected utility and stop overthinking it, the behavioral hire says that's empirically dead because people reliably make Allais-type choices and we should use something like prospect theory, and our counsel says whatever we adopt has to give the same answer next quarter that it gives today or a court will call it arbitrary. Comms wants something a reporter can restate in one sentence. Nobody has yet told me what the rule has to be able to *do* before we start arguing over which one to buy.

  So: acting as a decision theorist who has spent real time in this literature and has refereed papers in it, write me the desiderata -- the spec -- that a theory of choice under risk has to satisfy to count as an adequate response to the Allais problem, for my purposes specifically (a rule a public body can apply repeatedly, defend in writing, and audit after the fact). Brainstorm out loud a bit first, then give me the list: for each requirement, the case or consideration motivating it and what goes wrong without it. Be concrete rather than schematic -- I want the common-consequence and common-ratio forms treated seperately if they actually differ, the sequential versions where the choice happens in stages, the versions where a gamble is written as a tree with branches that arguably should be combined before you evaluate it, first-order stochastic dominance, very small probabilities of catastrophe, and how all this relates to the ambiguity stuff (I keep seeing Ellsberg waved around as though it were the same objection and I suspect it isnt). Then tell me which of the things people in this fight demand are genuine requirements and which are one camp's priors wearing a requirement costume: is "must satisfy the independence axiom" a desideratum or the very thing under dispute? Are cardinal utility, interpersonal comparability, and layperson-explainability demands on a theory or demands on my job description?

  The part I most want: is some subset of the list jointly unsatisfiable, in which case the list itself is the finding and I should stop shopping for a theory? Someone told me there's an argument that consequentialism plus dynamic consistency forces the independence axiom back on you, which if correct seems to mean I cannot have both a theory that blesses the Allais choices and a rule that doesn't reverse itself mid-stream -- please check whether that's right, and if it is, say which of the three you'd give up and why. Also weigh in on how much normative weight the experimental evidence should carry at all, since my behavioral colleague concedes that Allais choices shift with the size of the stakes and with how the problem is written down, and I'm not sure a theory built to fit those choices is answering the question I'm being paid to answer. Finish with a tight scorecard -- expected utility, rank-dependent utility, cumulative prospect theory, and maybe a safety-first or lexicographic rule -- against the list, but keep it short; the criteria are the deliverable, not the ranking. No bibliography, no reading list, no citations, I can't chase any of that down and I'd rather you spent the space on the requirements. Think carefully.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Role:** Policy Analyst in a small state office.
      *   **Task:** Write a decision rule for permitting high-stakes/low-probability risks (chemical storage, levees).
      *   **Current Situation:** Office runs on precedent/gut feeling. Team is divided (Economist: Expected Utility [EU]; Behavioral: Prospect Theory [PT]/Allais; Counsel: Consistency/Non-arbitrariness; Comms: Simplicity).
      *   **Core Need:** A *specification of desiderata* (requirements) for a decision theory suitable for public administration, specifically addressing the Allais problem context.
      *   **Specific Instructions:**
          *   Act as an experienced decision theorist/referee.
          *   Brainstorm out loud first.
          *   Provide a concrete list of requirements (motivation + consequence of failure).
          *   Cover specific technical points: Common-consequence vs. common-ratio, sequential/stage choices, tree reduction, stochastic dominance, small probabilities of catastrophe, ambiguity (Ellsberg) vs. risk.
          *   Distinguish genuine requirements from "priors in costume" (e.g., Independence Axiom).
          *   Address the "joint unsatisfiability" problem (Consequentialism + Dynamic Consistency $\rightarrow$ Independence?).
          *   Weigh normative value of experimental evidence (Allais choices vary).
          *   Finish with a tight scorecard (EU, RDU, CPT, Safety-First).
          *   No bibliography/citations.
          *   Tone: Professional, analytical, pragmatic, authoritative but accessible to a non-economist.

  2.  **Deconstruct the Conflict:**
      *   *Economist:* Wants EU. Why? Normative purity, dynamic consistency, easy aggregation.
      *   *Behavioral:* Wants PT/RDU. Why? Descriptive accuracy, captures fear of ruin (catastrophe aversion).
      *   *Counsel:* Wants Consistency. Why? Legal defensibility (Equal Protection/Administrative Procedure Act vibes).
      *   *Comms:* Wants Simplicity. Why? Political survivability.
      *   *Analyst (User):* Needs a *spec* before buying a *product*. Needs to know if the product exists.

  3.  **Brainstorming & Technical Deep Dive (Mental Sandbox):**
      *   *The Allais Paradox:* It violates Independence. If you satisfy Independence, you can't match Allais choices. If you match Allais choices, you violate Independence.
      *   *Dynamic Consistency:* If I plan to do X tomorrow, do I actually do X tomorrow when tomorrow arrives? EU says yes. PT often says no (preference reversal over time/stages). This is huge for Counsel's "same answer next quarter" requirement.
      *   *Catastrophe Risk:* EU often ignores tiny probabilities if the utility function isn't curved enough. PT overweight small probabilities. But PT also violates stochastic dominance sometimes.
      *   *Ellsberg vs. Allais:* Allais is risk (known probs). Ellsberg is ambiguity (unknown probs). User is right to suspect they aren't the same. Permitting usually involves estimated probs (risk), but sometimes deep uncertainty (ambiguity). I need to clarify this distinction in the spec.
      *   *Tree Reduction:* Should a two-stage gamble be evaluated as a compound lottery reduced to a simple one? EU says yes. Behavioral says no (segregation/integration matters).
      *   *Normative vs. Descriptive:* The user asks a crucial question: Just because people *do* violate EU (Allais), should the government *codify* that violation? Or should the government correct it? This is the "is-ought" gap.
      *   *The "Impossibility" Theorem:* Machina, Hammond, McClennen. If you want Consequentialism (only outcomes matter) + Dynamic Consistency (plans match actions), you are pushed back toward EU/Independence. This is the crux of the Counsel vs. Behavioral fight.

  4.  **Drafting the Desiderata (The Spec):**
      *   Need to translate technical axioms into administrative requirements.
      *   1. *Legal Defensibility (Consistency):* Dynamic Consistency.
      *   2. *Safety (Dominance):* First-Order Stochastic Dominance (FOSD). Can't prefer a strictly worse option.
      *   3. *Catastrophe Sensitivity:* Sensitivity to tail risk (where EU often fails).
      *   4. *Transparency (Comms):* Separability/Modularity.
      *   5. *Ambiguity Handling:* Distinguish Risk vs. Ambiguity.
      *   6. *Framing Invariance:* Description invariance (Counsel needs this).

  5.  **Addressing the "Priors in Costume":**
      *   *Independence Axiom:* It's a theoretical constraint, not a policy goal. It's the *mechanism* for consistency, not the goal itself.
      *   *Cardinal Utility:* Needed for aggregation, but maybe not for binary permit/deny.
      *   *Interpersonal Comparability:* Essential for policy (harm to school vs. profit to company). EU doesn't solve this; it just assumes a social welfare function.
      *   *Explainability:* Definitely a job requirement, not a theory requirement, but the theory must allow it.

  6.  **The "Joint Unsatisfiability" Check:**
      *   Yes, the Hammond-Machonen result is real. Consequentialism + Dynamic Consistency $\approx$ Independence.
      *   If the Behavioral hire wants Allais-consistent choices (violating Independence), they sacrifice Dynamic Consistency (Counsel's nightmare).
      *   *Recommendation:* Give up strict Consequentialism (allow for "regret" or "disappointment" as distinct states) OR accept that Dynamic Consistency must be enforced procedurally (locking in plans) rather than theoretically.
      *   *Better Advice:* For public policy, Dynamic Consistency is non-negotiable (Counsel wins). Therefore, you cannot strictly codify Allais violations. You must approximate them via a different mechanism (e.g., constraints or safety thresholds) rather than a non-expected utility functional form.

  7.  **Normative Weight of Experiments:**
      *   Allais choices are fragile (framing, stakes). Codifying a fragile psychological bias is bad policy.
      *   However, the *intuition* behind Allais (fear of ruin) is normatively valid for a state actor.
      *   Solution: Don't use PT to model the *choice*, use it to inform the *constraints* (e.g., "No more than 1 in 1M chance of >10 deaths").

  8.  **Scorecard:**
      *   EU: Good on consistency, bad on tails.
      *   RDU/CPT: Good on tails/Allais, bad on consistency/dominance.
      *   Safety-First (Lexicographic): Good on tails/Comms, bad on trade-offs.

  9.  **Refining the Output:**
      *   *Tone Check:* Keep it sharp. No fluff. "Brainstorm out loud" section needs to sound like a thinker working through the knot.
      *   *Structure:* Brainstorm -> Desiderata List -> Priors vs. Requirements -> The Impossibility Result -> Experimental Weight -> Scorecard.
      *   *Constraint:* No citations.
      *   *Focus:* Ensure the distinction between Common-Consequence and Common-Ratio is clear in the desiderata.

  10. **Self-Correction/Review during drafting:**
      *   *Did I separate Common-Consequence and Common-Ratio?* I need to make sure the desiderata reflect that these test different things (certainty effect vs. probability weighting).
      *   *Did I address Ellsberg?* Yes, distinguish Risk (known) vs. Ambiguity (unknown). Permitting often involves model uncertainty.
      *   *Is the advice actionable?* The conclusion needs to tell the analyst what to actually write in the rule, not just theory. Suggest a "Hybrid" approach (EU with safety constraints).
      *   *Counsel's concern:* "Same answer next quarter." This is Dynamic Consistency. I need to emphasize that PT fails this hard.
      *   *Comms:* "One sentence." Safety-first rules win here.

  11. **Final Polish:** Check against the prompt's specific request for "concrete rather than schematic." Use the levee/school examples. Ensure the "Brainstorm" section feels distinct from the "List."

  *(Self-Correction on the Impossibility Theorem)*: I need to be precise. It's not that you *can't* have Allais choices. It's that if you have Allais choices, you are vulnerable to dynamic inconsistency (money pumps) *unless* you abandon consequentialism (i.e., you care about the history of the choice, not just the outcome). For a government body, caring about history is weird. So, practically, Counsel is right: if you want consistency, you can't have pure Allais preferences.

  *(Final Plan)*:
  1.  Brainstorm the tension between "rational" consistency and "real" fear.
  2.  List the 6-7 key desiderata with concrete examples.
  3.  Filter the "Requirements" from the "Priors."
  4.  Deliver the hard truth on the Impossibility Theorem.
  5.  Assess the experimental evidence.
  6.  Scorecard.
  7.  Final recommendation (The Hybrid).

  Let's write.
answer: |-
  ### Brainstorming: The Knot You're In

  You are standing in the middle of a classic triangulation problem, but the stakes are administrative liability and public safety, not just academic tenure. Here is the landscape as I see it from the referee's chair.

  Your economist is arguing for **normative coherence**. Expected Utility (EU) is the only theory that guarantees you won't shoot yourself in the foot over time (dynamic consistency) and that you won't accept a series of trades that leave you worse off (no money pumps). For a government body, this is the "Arbitrary and Capricious" defense. If you use EU, you can prove mathematically that your decision today is consistent with your decision tomorrow, provided probabilities and outcomes haven't changed.

  Your behavioral hire is arguing for **descriptive validity and tail sensitivity**. They are right that EU treats a 0.0001% chance of a disaster as 1/10,000th of a 1% chance. But in public policy, a 1-in-10-million catastrophe is often a hard "no," regardless of the benefit. EU smooths this out; Prospect Theory (PT) or Rank-Dependent Utility (RDU) overweights small probabilities. They want the rule to capture the "fear of ruin." However, PT is a nightmare for Counsel. It violates *procedure invariance* (framing matters) and *dynamic consistency* (preferences reverse as probabilities shift from "possible" to "certain"). If you codify PT, a lawyer can show you would have denied a permit in January but approve it in February for the exact same risk profile, simply because the decision process was staged differently.

  Your Counsel is arguing for **administrative law**. They don't care about axioms; they care about audit trails. "Same answer next quarter" is a demand for *stationarity* and *dynamic consistency*.

  Your Comms director is arguing for **cognitive load**. If the rule requires solving a integral equation to determine if a levee is safe, it will be ignored or misused.

  The core tension: **You cannot have a theory that satisfies the Allais intuition (fear of ruin/certainty effect), maintains strict dynamic consistency, and respects first-order stochastic dominance, all while remaining simple.** There are impossibility theorems here. If you satisfy Allais, you violate Independence. If you violate Independence, you generally lose Dynamic Consistency unless you abandon Consequentialism (i.e., you start caring about the *path* taken, not just the outcome).

  So, the spec isn't about finding the "true" theory. It's about deciding which failure mode you can defend in court.

  ***

  ### The Spec: Desiderata for a Public Risk Decision Rule

  Here are the requirements a decision theory must satisfy to be viable for your office. I have separated technical axioms into administrative requirements.

  #### 1. Dynamic Consistency (The "Next Quarter" Rule)
  *   **Requirement:** If the office decides today that Plan A is preferred to Plan B, and the state of the world moves forward exactly as anticipated without new information, the office must still prefer A to B at the next decision node.
  *   **Motivation:** Counsel's requirement. Prevents "arbitrary and capricious" rulings. Prevents contractors from gaming the timing of the application.
  *   **Failure Mode:** **Preference Reversal.** Under Prospect Theory, you might reject a risky levee design today because the failure probability is "small but non-zero." But if you wait until the construction is half-done, that same probability might be psychologically coded differently, leading you to approve a continuation you would have originally banned. This creates legal liability.
  *   **Concrete Case:** A chemical storage permit is denied because of a 0.01% explosion risk. Six months later, the company reapplies with the exact same specs. If the rule depends on the *context* of the application (e.g., "recent disaster in news"), you violate this. The rule must be state-independent.

  #### 2. First-Order Stochastic Dominance (The "No Stupidity" Rule)
  *   **Requirement:** If Option A offers a probability of harm that is strictly lower than Option B for every level of severity, and strictly lower for at least one level, the rule must never prefer B.
  *   **Motivation:** Basic rationality. If a safer levee costs the same as a riskier one, you cannot choose the riskier one.
  *   **Failure Mode:** **Dominance Violations.** Some versions of Prospect Theory (specifically original PT, less so CPT) can violate this when probability weighting functions cross. If your rule tells you to accept a higher risk for the same cost because of how the probabilities are "weighted," you will lose in court.
  *   **Concrete Case:** Levee Design X has a 5% chance of 1ft flooding and 1% chance of 10ft flooding. Design Y has a 4% chance of 1ft and 1% chance of 10ft. If your rule picks X because of how it aggregates the "routine" harm, it is indefensible.

  #### 3. Catastrophe Sensitivity (The "School" Rule)
  *   **Requirement:** The rule must allow for a discontinuous drop in acceptability as outcomes cross a "catastrophic" threshold, even if the probability change is linear.
  *   **Motivation:** The Behavioral/Ethical requirement. EU treats 1 death with 10% prob as equivalent to 10 deaths with 1% prob. Public policy does not. A tiny chance of 500 schoolchildren dying is not tradable against routine economic gain.
  *   **Failure Mode:** **Risk Neutrality in the Tails.** Standard EU with linear utility will approve high-consequence risks if the expected value is positive. This is politically and ethically unsustainable for a state regulator.
  *   **Concrete Case:** A chemical plant offers \$10M in tax revenue. Risk is 1 in 1,000,000 of a cloud killing 100 kids. EU might say "Expected loss is 0.0001 lives, worth the money." Your rule needs a mechanism to say "No."

  #### 4. Description Invariance (The "Comms" Rule)
  *   **Requirement:** The decision must not change if the same risk is described as "99.9% safe" vs "0.1% failure rate," or if a multi-stage process is collapsed into a single probability.
  *   **Motivation:** Prevents manipulation by applicants. If a company can rephrase their application to get a different answer, the rule is broken.
  *   **Failure Mode:** **Framing Effects.** Behavioral models often rely on framing (gain vs. loss). If your rule incorporates loss aversion, an applicant could frame their proposal as "avoiding job losses" (gain frame) vs "risking safety" (loss frame) to game the score.
  *   **Concrete Case:** **Tree Reduction.** A permit requires two independent safety checks, each with 10% failure. Is this evaluated as two stages (sequential) or one combined 19% failure rate? EU says combine them. Behavioral says people treat sequential risks differently. You must mandate one. For auditability, you must mandate **reduction** (combine them), or applicants will structure risks sequentially to hide the aggregate probability.

  #### 5. Distinction Between Risk and Ambiguity (The "Model Uncertainty" Rule)
  *   **Requirement:** The rule must treat "known probability" (Risk) differently from "unknown probability" (Ambiguity/Model Uncertainty).
  *   **Motivation:** Ellsberg is not Allais. Allais is about how we weight known numbers. Ellsberg is about trusting the numbers. In permitting, probabilities are often model outputs, not frequencies.
  *   **Failure Mode:** **False Precision.** Treating a geologist's subjective 1% risk the same as an actuarial 1% risk.
  *   **Concrete Case:** A levee upgrade uses new soil data (ambiguous prob) vs. an old dam with 50 years of data (risk). A good rule applies a "ambiguity penalty" or safety margin to the former. EU ignores this distinction; it only sees the number provided.

  #### 6. Separability of Routine and Catastrophic Harm
  *   **Requirement:** The rule must be able to evaluate routine harms (noise, traffic, minor leaks) separately from catastrophic harms (mass casualty, structural collapse).
  *   **Motivation:** Addresses the Common-Consequence vs. Common-Ratio distinction without requiring complex axioms.
  *   **Failure Mode:** **Aggregation Errors.**
      *   *Common-Consequence (Allais Type 1):* People prefer certainty over high probability. In policy, this manifests as "Zero Tolerance" for certain harms.
      *   *Common-Ratio (Allais Type 2):* People's preferences shift when probabilities are scaled down.
      *   If you aggregate these, you get noise. If you separate them, you can apply EU to routine harm (cost-benefit) and a Lexicographic rule to catastrophe (threshold).
  *   **Concrete Case:** Traffic noise (routine) vs. Explosion (catastrophe). Do not trade them off against each other in a single utility function.

  ***

  ### Priors in Costume vs. Genuine Requirements

  You asked which demands are theoretical baggage and which are actual job requirements.

  1.  **"Must Satisfy the Independence Axiom"**
      *   **Verdict:** **Prior in Costume.**
      *   **Reasoning:** Independence is a mathematical property that *generates* Dynamic Consistency in EU theory. It is not a policy goal itself. You care about the consistency, not the axiom. However, because Independence is the cheapest way to get Consistency, your Economist is treating them as identical. They aren't. You could theoretically have consistency without independence, but it's hard.
  2.  **"Must Match Experimental Data (Allais Choices)"**
      *   **Verdict:** **Prior in Costume.**
      *   **Reasoning:** Your Behavioral hire wants to codify human bias. Just because humans *fear* a 1-in-1-million catastrophe disproportionately doesn't mean the *rule* should be mathematically inconsistent to match that fear. The normative goal is safety, not psychological mirroring.
  3.  **"Cardinal Utility / Interpersonal Comparability"**
      *   **Verdict:** **Job Description Requirement.**
      *   **Reasoning:** You are a state office. You *must* compare the company's profit to the school's safety. This requires a social welfare function. No decision theory solves this for you; it's a political/ethical input you must supply. EU assumes it exists; it doesn't create it.
  4.  **"Layperson Explainability"**
      *   **Verdict:** **Job Description Requirement.**
      *   **Reasoning:** A theory can be opaque, but the *output* must be explainable. This is a constraint on your implementation, not the theory. However, complex theories (CPT) make this much harder.

  ***

  ### The Impossibility Result: Can You Have It All?

  You asked the critical question: *Does Consequentialism + Dynamic Consistency force the Independence Axiom back on you?*

  **The Short Answer:** Yes, effectively.
  **The Technical Answer:** This is the Hammond-Machonen result. If you require that choices depend only on outcomes (Consequentialism) and that plans made today are carried out tomorrow (Dynamic Consistency), you are mathematically pushed back toward Expected Utility.

  **The Conflict:**
  *   **Behavioral Hire:** Wants to violate Independence (to capture Allais/Catastrophe fear).
  *   **Counsel:** Wants Dynamic Consistency (to avoid arbitrariness).
  *   **Theorem:** You cannot have both.

  **Which one do you give up?**
  For a public regulatory body, **you must give up strict Consequentialism.**

  *Why?*
  1.  **Counsel Wins:** Dynamic Consistency is non-negotiable for administrative law. If you reverse decisions based on how the choice is staged, you invite litigation.
  2.  **Behavioral Wins (Sort of):** You can capture the "fear of catastrophe" without violating Independence *if* you abandon Consequentialism. How? By treating the *state of anxiety* or the *potential for regret* as part of the outcome.
      *   *Example:* A 1% chance of death isn't just "0.01 deaths." It is "0.01 deaths + Public Outrage." If you include "Public Outrage" as a distinct negative outcome in your utility function, you can stay within EU (keeping Counsel happy) while effectively vetoing catastrophic risks (keeping Behavioral happy).
  3.  **The Alternative:** If you try to use Cumulative Prospect Theory (CPT) directly, you will violate Dynamic Consistency. You will approve a project in a multi-stage review that you would have rejected in a single-stage review. Counsel will kill this.

  **Normative Weight of Experimental Evidence:**
  Your Behavioral colleague concedes Allais choices shift with stakes and framing. **Do not build a rule on shifting sand.**
  *   *Advice:* Use the experimental evidence to *calibrate the constraints*, not the *objective function*.
  *   *Don't write:* "Maximize Rank-Dependent Utility."
  *   *Do write:* "Maximize Expected Net Benefit, subject to the constraint that probability of >N fatalities is < X."
  *   This respects the intuition (catastrophes are special) without adopting the mathematical inconsistencies of PT.

  ***

  ### Scorecard

  Here is how the contenders stack up against your Spec.

  | Criterion | Expected Utility (EU) | Rank-Dependent / Cumulative PT (RDU/CPT) | Safety-First / Lexicographic |
  | :--- | :--- | :--- | :--- |
  | **Dynamic Consistency** | **Pass.** Mathematically guaranteed. | **Fail.** Preferences reverse over stages/trees. | **Pass.** (If thresholds are fixed). |
  | **Stochastic Dominance** | **Pass.** Always respects it. | **Mixed.** CPT fixes PT's failures, but complex weighting can still glitch. | **Pass.** (By definition). |
  | **Catastrophe Sensitivity** | **Fail.** Requires extreme risk aversion parameters to work, which breaks routine decisions. | **Pass.** Overweights small probabilities naturally. | **Pass.** Hard constraints handle this best. |
  | **Description Invariance** | **Pass.** Invariant to framing/tree reduction. | **Fail.** Sensitive to framing and editing phases. | **Pass.** (If metrics are clear). |
  | **Explainability** | **Medium.** "Expected value" is easy; "Risk aversion parameter" is hard. | **Low.** "Probability weighting function" is impossible to explain to a reporter. | **High.** "Safety limit exceeded" is one sentence. |
  | **Ambiguity Handling** | **Fail.** Treats model uncertainty as risk. | **Medium.** Can be extended, but adds complexity. | **High.** Easy to add safety margins for uncertainty. |

  ### Final Recommendation for the Spec

  Do not adopt a single decision theory as the "law." Adopt a **Hybrid Constraint Rule**.

  1.  **Primary Engine:** Use **Expected Utility** for routine trade-offs (cost vs. routine harm). This satisfies Counsel (Consistency) and Economist (Coherence).
  2.  **Safety Constraint:** Overlay a **Lexicographic Safety Threshold** for catastrophic outcomes (e.g., "No permit if probability of >10 fatalities exceeds 1 in 1,000,000"). This satisfies Behavioral (Tail risk) and Comms (Simple rule).
  3.  **Ambiguity Margin:** Require that probabilities used in the Safety Constraint be adjusted upward by a fixed factor if based on models rather than data. This handles Ellsberg.

  **Why this works:** It sidesteps the Impossibility Theorem. You aren't trying to make a utility function that looks like Prospect Theory. You are using EU for what it's good at (consistency) and constraining it with a rule that captures the Allais intuition (catastrophe aversion) without importing the mathematical instability.

  **The One-Sentence Rule for Comms:**
  *"We approve projects that maximize public benefit, provided they do not exceed strict safety limits on catastrophic risk."*

  This gives you the defensibility of EU, the safety of PT, and the simplicity Counsel and Comms need. Stop shopping for a theory that does everything; build a process that manages the trade-offs.
