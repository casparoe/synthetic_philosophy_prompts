answer: |-
  The principle best fitting your pattern is Rights-Constrained Relational Aggregation, which holds that numbers dictate choice unless specific duties or rights intervene, but it cannot keep your theoretical verdict in Case 6 regarding dependents.

  To apply this precisely, we must bolt together specific clauses that mirror your intuitions. First, the **Aggregation Clause**: in the absence of competing duties, you must minimize the total loss of life (Cases 2, 4, 8, 10). This establishes the baseline utilitarian demand; five deaths are worse than one, provided no other moral features are present. Second, the **Relational Priority Clause**: a specific history or direct knowledge creates a duty that can override numerical superiority (Cases 1, 3, 9). This explains why the correspondent saves the one, and why the "scene" outweighs the "tally"; knowing someone transforms them from a unit into a beneficiary of specific obligation. Third, the **Rights Constraint**: you may not directly inflict harm on an unwilling person to save others, even if the numbers favor it, though you may sacrifice yourself (Case 5). This distinguishes between letting die and killing, preserving bodily integrity as a boundary condition. Fourth, the **Non-Instrumentalization Clause**: a person's future utility or social value does not increase their weight in the calculation (Case 4). The surgeon counts as one, not as many future patients. Fifth, the **Consent Asymmetry**: a volunteer may consent to be sacrificed, but others cannot consent to be denied rescue on their behalf (Case 7). This protects the unwilling from the altruism of the group. Each clause is machinery bolted on to save an intuition; the Relational Priority Clause exists solely to rescue Case 1 and 9 from the cold logic of Case 2, while the Rights Constraint is purely for Case 5.

  Regarding the divergence in felt weight (Cases 8 and 9), this is not noise in the instrument; it is evidence of the moral cost. Ethics often demands we act against our emotional grain, but fiction lives in the grain. The divergence between the "tally" (logic) and the "scene" (experience) reveals that while aggregation may be *right*, it is not *neutral*. You are entitled to use your reactions as a novelist because your task is not to solve the ethical equation but to dramatize the friction of solving it. If the numbers say save five, but the heart breaks for the one, that breakage is the story. The "noise" is the residual guilt of surviving a moral dilemma where every option incurs a debt. To treat your reactions as mere error is to deny the reality of the conflict; the conflict is the point. You can write a character who does the right thing and is haunted by it; indeed, that is the only honest way to write it. The divergence tells you that the principle is action-guiding, but not experience-exhausting.

  Applying this principle to your four new cases yields specific verdicts. Where the alternative is one person's sight versus one life, you save the five lives; sight is a severe harm, but life is the threshold for aggregation (Aggregation Clause). Where the one is your dog, you save the five humans; species membership creates a categorical threshold that overrides relational duty to animals (Aggregation Clause extension). Where you can save five now or one now and four in twenty years, you save the five now; future claims are too uncertain to outweigh present existence, and the relational duty to the present five is stronger (Aggregation Clause). Where the five are separate people who never meet, you still save the five; aggregation depends on the sum of losses, not the social cohesion of the losers (Aggregation Clause). In each, the principle prioritizes existence over quality, certainty over possibility, and humans over non-humans, unless a specific relational duty intervenes.

  A leaner principle would be **Strict Aggregation**: always save the greater number, regardless of relationship or feeling. This throws overboard your verdicts in Case 1 (the correspondent), Case 5 (the hand), and Case 9 (the scene). It demands you leave the woman you know to die for the five strangers, and it permits crushing the hand to save the four. You might prefer this loss because it eliminates the guilt of arbitrariness; it admits that relationships are biases, not duties, and that bodily integrity is secondary to survival. It simplifies the climax by removing the temptation to negotiate with the numbers. The cost is human warmth, but the gain is moral clarity. If you choose this, you accept that ethics is not about who you love, but about what you minimize. It is a colder world, but one where the coastguard does not have to weigh the texture of a voice against the count of heads.

  For your coastguard climax, the principle dictates he takes the woman. Case 1 establishes that a year of correspondence overrides a 5-to-1 count; Case 3 shows that even twenty minutes creates a tear in the duty. Two hours of radio contact is a significant relational thread, and the gap is only four-to-one, not five-to-one. The Relational Priority Clause outweighs the Aggregation Clause here. He saves the one he knows. The fact that this reads wrong on the page is not reason to doubt the ethics, but reason to deepen the tragedy. Audiences expect Strict Aggregation; denying them that expectation creates friction. That friction is where the novel lives. If the right answer feels wrong, it is because the cost of the relational duty is the death of the four strangers. Do not smooth this over. Write the coastguard saving the woman and hating himself for it, or saving the four and grieving the woman as if he killed her. The "wrongness" is the evidence that the choice mattered. If it felt easy, it would be a lie. The principle gives you the action, but your felt weight gives you the scene. Trust the principle for the plot, and trust the weight for the prose.
