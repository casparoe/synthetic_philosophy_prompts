answer: |-
  **Project Title:** Unit Testing Truth: A Comparative Evaluation of Restrictions on the Knowability Principle

  **Research Question**
  Fitch's Paradox of Knowability demonstrates that if all truths are knowable, then all truths are already known. Since we know there are unknown truths, the principle "all truths are knowable" must be false. Most philosophical responses attempt to save the principle by restricting it—for example, claiming only "non-self-referential" or "stable" truths are knowable. My research asks: **To what extent do proposed restrictions on the Knowability Principle successfully block Fitch's derivation without rendering intuitively knowable truths unknowable?** I aim to determine if there is a necessary trade-off between a restriction's logical safety (blocking the paradox) and its philosophical utility (preserving the anti-realist motivation).

  **Background and Rationale**
  The standard move in the literature is to propose a syntactic or semantic restriction on the proposition *p* in the knowability claim ($\diamond K p$). However, these proposals are usually evaluated solely on whether they stop the paradox. They are rarely tested against a broader corpus of truths to see what collateral damage they cause. A restriction might successfully block Fitch's proof but accidentally classify ordinary empirical truths—like "there are an even number of stars in the Milky Way"—as unknowable. If a restriction makes too many ordinary truths unknowable, it defeats the original purpose of the Knowability Principle, which was to rule out truths that are *in principle* beyond human reach.

  Currently, philosophers evaluate these restrictions by "eyeballing" specific counterexamples. This is subjective and prone to cherry-picking. My project proposes a more rigorous method: constructing a logical "test suite."

  **Methodology**
  I will approach this problem using an analogy from software engineering: unit testing. Instead of arguing informally, I will construct a fixed set of test propositions representing different categories of truth (e.g., unobserved past events, large-number mathematical claims, contingent future events). For each proposition, I will establish a baseline intuition on whether it *should* be knowable in principle.

  I will then select the three most prominent restrictions found in introductory literature (e.g., syntactic restrictions, cartesian restrictions, and stability restrictions). I will formally apply each restriction to every item in the test suite using Fitch-style natural deduction. I will record "false negatives"—cases where a restriction deems a proposition unknowable despite our strong intuition that it is knowable. This allows for a quantitative comparison: Restriction A might block the paradox perfectly but fail 40% of the test suite, while Restriction B blocks the paradox weakly but fails only 10%.

  **Timeline**
  *   **September – October:** Deep dive into the formal derivation of Fitch's Paradox. I will formalize the proof in my own words to ensure I understand the exact step where the contradiction arises. I will also compile the list of existing restrictions to be tested.
  *   **November – December:** Construction of the Test Suite. I will draft 20–30 specific propositions and justify why each counts as "intuitively knowable." This requires careful wording to avoid accidental self-reference.
  *   **January – February:** The Testing Phase. I will run the formal logic proofs. For each restriction, I will determine if the test suite propositions satisfy the restriction's criteria. This is the heavy lifting of the project.
  *   **March:** Analysis. I will graph the results, looking for the trade-off curve. I will draft the paper, focusing on whether any restriction passes the "threshold" of being useful.
  *   **April:** Finalizing the paper and creating visual aids for the symposium presentation. I will focus on making the logical proofs accessible to a non-specialist audience.

  **Feasibility and Scope**
  This project is ambitious for a high school senior. While I am comfortable with truth tables, quantifiers, and Fitch-style proofs, I am aware that modal logic can become computationally complex very quickly. There is a risk that formally proving whether a proposition satisfies a specific restriction will be too difficult for the time available.

  To mitigate this, I have defined success realistically. A "successful" project does not require me to solve the paradox or invent a new restriction. Success looks like a clear comparative map showing that Restriction A is too strict and Restriction B is too loose. If the formal proofs become intractable, I will pivot to a conceptual analysis of the test suite, arguing why certain categories of truth resist restriction. I am confident the scope is manageable because I am limiting the number of restrictions tested to three and keeping the test suite finite. The logic background I have built independently is sufficient for the derivation work, provided I stay disciplined about not expanding the scope mid-year.

  **Conclusion**
  Fitch's Paradox is often treated as a puzzle to be solved by finding the "right" restriction. This project treats it as an engineering problem: measuring the cost of the solution. By applying a test-suite methodology, I hope to move the discussion from "which restriction stops the proof?" to "which restriction preserves the spirit of knowability?"
