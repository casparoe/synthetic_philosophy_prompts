          *   *Analysis:* This is the pivot. It's not pure positivism (law is just law) nor pure natural law (law must match nature). It's a *theological conventionalism*. God wills order/peace. To achieve order, societies need rules. God authorizes the *mechanism* of law-making. Therefore, once the mechanism produces a law, violating it disrupts the order God permits.
          *   *Justice vs. Prudence:* "Il est injuste de les violer." This is justice *within the system*. It's not "Natural Justice" in the abstract, but "Justice" defined by the authorized convention. It's more than prudence because God authorizes the convention.

      *   **Q3: Duke vs. Shipwrecked Man:**
          *   *Similarity:* Both based on chance, not merit.
