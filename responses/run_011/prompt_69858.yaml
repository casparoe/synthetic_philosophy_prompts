answer: |-
  **Bottom line**
  No subset of the locality conditions is internally inconsistent; classical physics satisfies them all. The unsatisfiability arises only when empirical adequacy to quantum predictions is added as a hidden constraint. However, tension exists between Local Beables and Lorentz Covariance in deterministic theories. Thus, the "conflict" is tripartite: Locality, Freedom, and Quantum Adequacy. The condition doing the most work is Outcome Independence, as it encodes the common-cause intuition most vulnerable to quantum entanglement.

  **The job of the principle**
  A locality principle in this setting must formalize "no action at a distance" without relying on ambiguous notions like "measurement" or "observer." It serves as the premises for a deductive argument: if the world satisfies these conditions, certain statistical inequalities must hold. Usual formulations fail by conflating ontology with epistemology, allowing theories to evade the theorem by redefining "observation" rather than addressing physical causation. The principle must isolate the specific causal structure that Bell's theorem forbids, distinguishing it from mere signal locality or relativistic symmetry. It acts as a sieve, filtering out theories that rely on spacelike influence, regardless of their formalism.

  **The requirements**
  1.  **Local Beables:** The theory must specify physical states assigned to bounded spacetime regions, independent of observation. *Motivation:* Prevents hiding non-locality in vague "measurement" collapse or observer-dependent updates. *Status:* Non-negotiable for Bell's intent.
  2.  **Parameter Independence:** Outcome probability in region A is independent of setting in region B, given the past. *Motivation:* Blocks superluminal signalling mechanisms and respects relativistic causality constraints on control. *Status:* Non-negotiable for signal locality.
  3.  **Outcome Independence:** Outcome in A is independent of outcome in B, given the past. *Motivation:* Ensures correlations arise from common causes in the past, not direct spacelike influence. *Status:* Negotiable (violated by objective collapse theories).
  4.  **Measurement Independence:** Settings are statistically independent of the hidden physical state. *Motivation:* Rules out conspiratorial superdeterminism where the past fixes both settings and outcomes. *Status:* Non-negotiable for experimental science.

  **Collisions**
  The four conditions are jointly satisfiable; classical mechanics proves this. The conflict emerges only when adding "Reproduces Quantum Predictions." However, a structural tension exists between Local Beables and Lorentz Covariance: deterministic beable theories (like Bohm) often require a preferred foliation to define dynamics, violating relativistic symmetry. Thus, satisfying Beables plus Parameter Independence may cost Lorentz Invariance. Additionally, maintaining Measurement Independence conflicts with a fully deterministic physical history if settings are physical events caused by the past. The "conflict" is thus tripartite: Locality, Freedom, and Quantum Adequacy. Literature often misleads by treating Parameter and Outcome Independence as a single block; splitting them reveals that one can preserve signal locality (PI) while abandoning common-cause completeness (OI), as GRW does.

  **Do the requirements bite?**

  | Requirement | Bohm | GRW | Everett | Retro | Superdet | Instrumentalism |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Local Beables** | Yes | Yes | No | Yes | Yes | No |
  | **Param. Indep.** | No | Yes | N/A | Yes | Yes | Yes |
  | **Outcome Indep.** | Yes | No | N/A | Yes | Yes | Yes |
  | **Meas. Indep.** | Yes | Yes | Yes | No | No | Yes |

  The requirements discriminate sharply. Bohm sacrifices Parameter Independence (and Lorentz symmetry). GRW sacrifices Outcome Independence. Everett fails Local Beables in 3D space, rendering the conditions inapplicable. Superdeterminism and Retrocausality sacrifice Measurement Independence. Instrumentalism fails Local Beables by design. Only Retrocausality attempts to keep all by modifying time asymmetry, but at the cost of standard causal order. The list successfully forces each view to declare its cost.

  **The Everettian objection**
  Your colleague claims Everett escapes by denying single outcomes. This is blocked by the Local Beables condition. If beables are the wavefunction, it lives in configuration space, not spacetime regions, violating condition 1. If beables are "worlds," they are not unique. Outcome Independence presupposes definite outcomes $A$ and $B$ in spacetime. Without them, the condition is inapplicable, but so is the empirical claim of "locality" in spacetime. Everett avoids the theorem not by satisfying locality, but by failing the ontological precondition required to state it. The theorem assumes single outcomes; Everett denies them, thus opting out of the Bell setting entirely rather than satisfying locality.

  **What I would drop**
  I drop the demand that violating locality must not permit signalling (v). This is a consequence, not a definition; Bell locality implies signal locality, but the reverse is not true. I also drop the meta-condition that the principle must be non-vacuous (vii); that is a test for the theorem, not the principle. Insisting on them confuses the definition of locality with its empirical implications. People insisting on them are really asking for "peace of mind" that relativity isn't violated, rather than a precise causal condition.
