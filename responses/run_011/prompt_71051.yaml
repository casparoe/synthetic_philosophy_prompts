answer: |-
  This is a sophisticated position, but your flatmate and your own intuition are both picking up on real structural stresses. The position *almost* hangs together, but there is one logical contradiction that will get you torn apart in a workshop, and one philosophical boundary dispute that you can win if you sharpen your definitions.

  Here is the breakdown of tensions ranked by severity, the reconcilable pairs, and the single revision that saves the system.

  ### 1. Tension Ranking (By Severity)

  **Severity 1: (2) Neutral Aggregation vs. (3) Sacrifice Metric**
  *   **The Conflict:** You claim "One person, one equal say" (2), but your metric (3) effectively implements "One dollar, one vote." In your farmer example, the billionaire's preference weighs more simply because he has more surplus to sacrifice. This violates the neutrality constraint of (2). It converts *intensity* of preference into *capacity* to pay.
  *   **What Has to Give:** Either you abandon "equal say" (admitting the system is plutocratic) or you abandon the current definition of "sacrifice."
  *   **Cheapest Fix:** Redefine the Sacrifice Metric from **absolute** surrender to **proportional** surrender (willingness-to-pay relative to endowment). If the farmer would give up 100% of her surplus for water, and the billionaire would give up 0.001% of his for a jet, the farmer's preference weighs *more*. This preserves (2) while keeping the spirit of (3).

  **Severity 2: (1) Actual Preferences vs. (4) Adaptive Preferences**
  *   **The Conflict:** Your flatmate is technically correct that these are in tension, but philosophically wrong that they are incompatible. If you track "actual" preferences (1), you must track adaptive ones. If you screen them out (4), you are imposing an external standard of what preferences *should* be (paternalism).
  *   **What Has to Give:** You must concede that "Actual" does not mean "Occurrent." You cannot claim to track *every* actual preference.
  *   **Cheapest Fix:** Add an **Autonomy Condition** to (1). Revise (1) to read: "The target has to be built out of people's actual preferences, *provided they were formed under conditions of minimal coercion and deprivation*." This makes (4) a subset of (1) rather than an exception to it. You aren't discarding actual preferences; you are discarding *distorted* inputs.

  **Severity 3: (3) Sacrifice Metric vs. (5) No Fact of the Matter**
  *   **The Conflict:** (5) says the weighting scheme is an arbitrary institutional choice. (3) presents the Sacrifice Metric as if it is the discovered "true" way to measure stake. If (5) is true, why is (3) mandatory?
  *   **What Has to Give:** The rhetorical framing of (3).
  *   **Cheapest Fix:** Frame (3) explicitly as the **proposal** resulting from (5). "Because there is no fact of the matter (5), we propose the Sacrifice Metric (3) as the most publicly justifiable scheme." This turns a contradiction into a logical flow.

  ---

  ### 2. Reconcilable Pairs (The "False Alarms")

  You asked to name the pairs that look contradictory but aren't. Saving these will reduce your cognitive load.

  *   **(1) and (4) are reconcilable:** This is the flatmate's main charge, but it is a standard distinction in welfare economics (e.g., Amartya Sen's *Capability Approach*). You can argue that adaptive preferences are not "values" but "scars." A preference formed solely to reduce cognitive dissonance in an oppressive environment is not a value endorsement; it is a coping mechanism. Screening them out isn't paternalism; it's **data cleaning**.
      *   *The Argument:* "I am not overriding their values; I am refusing to treat a survival reflex as a value judgment."
  *   **(3) and (5) are reconcilable:** As noted in the severity ranking, this is a category error. (5) is meta-ethical (about the status of the scheme); (3) is normative (the scheme itself). They fit together perfectly if you present (3) as the *chosen* institution justified by the public justifiability criterion in (5).

  ---

  ### 3. The Single Revision (Highest Consistency per Unit of Pain)

  **Revise Point (3): Switch from Absolute Sacrifice to Relative Sacrifice.**

  **Why this is the winner:**
  1.  **It kills the biggest logical contradiction:** It resolves the (2) vs. (3) tension (Severity 1). You can now honestly claim "One person, one equal say" because a poor person's intense preference will outweigh a rich person's trivial preference.
  2.  **It cures the "Queasiness":** You mentioned feeling queasy about the farmer having "nothing to give up." If you measure sacrifice as a *percentage of endowment* (intensity) rather than *absolute amount* (wealth), the farmer's stake is recognized as high.
  3.  **It strengthens (5):** A proportional metric is far more "publicly justifiable" than a wealth-weighted one. It makes your institutional choice robust.
  4.  **It helps with the Flatmate:** While it doesn't directly solve (1) vs. (4), it removes the oligarchic implication of your system. If your system accidentally privileges the rich (via absolute sacrifice), the flatmate will smell "elite ideals" (violating 1). By fixing the equity profile, you make your anti-paternalist claim in (1) more credible.

  **The Cost:** You lose the ability to use "total economic surplus" as a proxy for stake. You have to measure utility intensity, which is harder empirically. But for a position paper, the conceptual consistency is worth the empirical cost.

  ---

  ### 4. Ammo for the Flatmate (On 1 vs. 4)

  Since your flatmate is blocking you on (1) vs. (4), here is the specific argument to shut that down without changing your core view:

  **The "Endogeneity" Defense:**
  Tell her: *"I am not comparing actual preferences to idealized ones. I am comparing **endogenous** preferences to **exogenous** constraints."*

  *   **Idealized (Paternalist):** "You want X, but if you were smarter, you'd want Y." (This violates 1).
  *   **Adaptive (Your View):** "You want X, but you only want X because Y was impossible." (This violates 1 *only if* you define 'want' as 'occurrent desire').

  **The Script:**
  > "My claim in (1) is that the system should track **agency**, not just **desire**. Adaptive preferences are a failure of agency, not a different kind of value. If I screen them out, I am not imposing my values; I am refusing to codify the oppressor's constraints as the victim's values. That isn't paternalism; it's de-confounding."

  **Summary:**
  Fix (3) to save the logic (and your queasiness). Refine the definition of "Actual" in (1) to save the argument with your flatmate. Do this, and the position hangs together.
