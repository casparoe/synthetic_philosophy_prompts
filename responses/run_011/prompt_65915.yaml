answer: |-
  Look, that's the stress test I expected, and it's a good one. You're asking if the theory collapses when the correlation chain breaks. But here's the thing: from inside the deliberation, she can't know she's truly isolated. To calculate *any* probability, she has to place herself in a reference class—she has to ask, "What do people like me do?" If she says "people like me are isolated emigrants," she's actually invoking a class of isolated emigrants, and if there's more than one, the decision-rule overlap kicks back in. If she says "I am literally unique," then she has no frequency data to assign a probability at all, and the Downsian calculation doesn't just yield a low number, it returns an error. It's ill-formed because you can't run a statistical expectation on a sample size of one without assuming a distribution, and assuming a distribution reintroduces the correlations I'm talking about.

  So I'm not saying her vote is irrational; I'm saying the *model* that calls it irrational is the broken part. The work is being done by the epistemic constraints on the agent, not just the sociological facts. She must act as if her decision is diagnostic of others', because that's the only way to generate a p-value. If she does that, the probability of being decisive isn't 1/N, it's conditional on the rule, and instrumental rationality is back on the table. I'll grant you that if she had God's-eye view and knew she was the only voter left, the instrumental value drops to zero, but that's not the human condition. We deliberate under uncertainty, and under uncertainty, the decision-rule logic holds.
