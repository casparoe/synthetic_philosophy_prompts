answer: |-
  # The Logical Map

  Before you begin the tree, note the five axes along which your judgements will split. The six leaves at the end of the tree correspond to specific coordinates on this map. Combinations marked 'Empty' are logically possible but philosophically unstable or unoccupied.

  1.  **Reference Class:** Is normal function defined by the **Species** (human typical) or the **Individual** (roles/goals)?
  2.  **Statistical Deviance:** Is rarity **Constitutive** (makes it a disease) or **Evidential** (hints at dysfunction)?
  3.  **Harm Perspective:** Is harm judged **Third-Person** (objective/biological) or **First-Person** (experienced/valued)?
  4.  **Locus of Dysfunction:** Is the failure **Internal** (mechanism) or a **Mismatch** (person-environment)?
  5.  **Concept Unity:** Is there **One Concept** (disease) or **Split Concepts** (disease/illness/sickness)?

  | Position | Ref Class | Stats | Harm | Locus | Unity | Status |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Boorse** | Species | Constitutive | 3rd Person | Internal | Unified | Occupied |
  | **Wakefield** | Species | Evidential | 3rd Person | Internal | Unified | Occupied |
  | **Nordenfelt** | Individual | Evidential | 1st Person | Mismatch | Split | Occupied |
  | **Fulford** | Individual | Irrelevant | 1st Person | Mismatch | Split | Occupied |
  | **Constructionist**| Social | Political | 3rd Person (Oppression) | Mismatch | Split | Occupied |
  | **Unnamed** | Species | Constitutive | 1st Person | Internal | Unified | **Empty** |

  **Diagnosis of Empty Spot:** *The Unnamed Position* is unstable because it demands biological deviance and subjective suffering simultaneously; it cannot classify asymptomatic carriers (no suffering) or the happy deviant (no suffering), rendering the 'disease' label redundant to the 'suffering' label.

  ***

  # The Decision Tree

  **Node 1**
  *Case:* A 34-year-old woman carries a genetic variant conferring a 80% lifetime risk of fatal cancer, but her current physiology is entirely normal. Do you classify her as having a disease *now*?
  *   **Yes:** Pathology constitutes disease independent of harm. (Go to Node 2)
  *   **No:** Harm or functional failure is necessary for disease ascription. (Go to Node 3)

  **Node 2**
  *Case:* A competitive freediver has a spleen three times the species-typical size, enhancing her performance but deviating wildly from the norm. Is this physiological state pathological?
  *   **Yes:** Statistical deviance from the species-typical range is decisive. (Go to Node 5)
  *   **No:** Function trumps statistics; advantageous deviance is not disease. (Go to Node 9)

  **Node 3**
  *Case:* A sound engineer cannot distinguish frequencies critical for his job, yet his audiogram sits comfortably within the normal population range. Is this a medical disorder?
  *   **Yes:** Inability to meet role-specific goals counts as disorder. (Go to Node 4)
  *   **No:** Only failure of species-typical function counts as disorder. (Go to Node 8)

  **Node 4**
  *Case:* If the engineer retrained for a new career where his hearing sufficed, would his disorder vanish?
  *   **Yes:** Dysfunction is a mismatch between person and environment. (Go to Node 6)
  *   **No:** Dysfunction must be a failure internal to the organism. (Go to Node 10)

  **Node 5**
  *Case:* A man is born with one kidney but maintains perfect homeostatic regulation throughout a normal lifespan. Is his renal system dysfunctional?
  *   **Yes:** Structural deviation from species-design implies dysfunction regardless of output. (Leaf: **Boorse-style Biostatistical Naturalism**)
  *   **No:** Function is defined by survival and reproduction, not anatomical typicality. (Leaf: **Wakefield's Harmful Dysfunction**)

  **Node 6**
  *Case:* A patient experiences prolonged, intense sadness but reports that it brings them spiritual depth and no desire to change. Are they mentally ill?
  *   **Yes:** Objective harm exists even if the subject values the state. (Leaf: **Social-Constructionist Leaf**)
  *   **No:** If the subject's vital goals are met, there is no illness. (Go to Node 7)

  **Node 7**
  *Case:* Do you distinguish between 'disease' (biological) and 'illness' (lived experience) in your documentation?
  *   **No:** There is only one unified concept of medical abnormality. (Leaf: **Unnamed Leaf**)
  *   **Yes:** The concepts split to accommodate different normative judgements. (Leaf: **Nordenfelt-style Vital Goals**)

  **Node 8**
  *Case:* In the case of the asymptomatic carrier (Node 1), you said she was not diseased. If she develops anxiety about the risk, does she become a patient?
  *   **No:** Medical status depends on biological facts, not reaction to them. (Leaf: **Wakefield's Harmful Dysfunction**)
  *   **Yes:** The entry into the sick role is determined by values and experience. (Leaf: **Fulford-style Normativism**)

  **Node 9**
  *Case:* You rejected statistical deviance as decisive (Node 2). Do you nonetheless maintain a value-free biological core to the concept of disease?
  *   **Yes:** Biology sets the boundaries, values only determine the 'harm'. (Leaf: **Wakefield's Harmful Dysfunction**)
  *   **No:** Values permeate the entire description of the biological state. (Leaf: **Fulford-style Normativism**)

  **Node 10**
  *Case:* You insisted dysfunction must be internal (Node 4). Is the 'harm' required for disease judged by the clinician or the patient?
  *   **Clinician:** Third-person judgement of objective harm prevails. (Leaf: **Boorse-style Biostatistical Naturalism**)
  *   **Patient:** First-person experience of goal-frustration prevails. (Leaf: **Nordenfelt-style Vital Goals**)

  ***

  # The Leaves

  **Boorse-style Biostatistical Naturalism**
  *   **Definition:** Disease is a value-free state of statistical sub-typical functioning in a species-relative reference class.
  *   **Awkward Commitment:** You must classify asymptomatic high-risk carriers as diseased while potentially classifying Olympic athletes as pathological due to deviance.

  **Wakefield's Harmful Dysfunction**
  *   **Definition:** Disease requires both a failure of internal mechanism to perform its evolved function and an objective judgement of harm.
  *   **Awkward Commitment:** You struggle to classify conditions where the mechanism is unknown but the harm is undeniable, or where the 'evolved function' is philosophically obscure.

  **Nordenfelt-style Vital Goals**
  *   **Definition:** Health is the ability to reach one's vital goals, making disease relative to individual circumstances and ambitions.
  *   **Awkward Commitment:** You must accept that a condition can be a disease for a pianist but not a banker, making medical resource allocation notoriously difficult.

  **Fulford-style Normativism**
  *   **Definition:** There is no value-free core; disease ascriptions are fundamentally expressions of shared human values about what counts as a 'good' state.
  *   **Awkward Commitment:** You risk collapsing medicine into ethics, making it hard to explain why we treat broken legs differently from unpopular political views.

  **Social-Constructionist Leaf**
  *   **Definition:** Disease categories are tools of social control that pathologise deviation from dominant cultural norms rather than biological facts.
  *   **Awkward Commitment:** You must deny that biology constrains the categories at all, which makes explaining the efficacy of antibiotics or surgery theoretically awkward.

  **Unnamed Leaf (The Internalist Subjectivist)**
  *   **Definition:** Disease requires an internal mechanical failure *and* first-person suffering, but statistical normality is irrelevant.
  *   **Awkward Commitment:** You classify a person with a broken heart valve who feels fine as healthy, and a person with a normal heart who feels sad as diseased.

  ***

  # Key and Stability Notes

  **Mapping Answer Patterns**
  *   **Boorse:** Node 1 (Yes) → Node 2 (Yes) → Node 5 (Yes) OR Node 10 (Clinician).
  *   **Wakefield:** Node 1 (No) → Node 3 (No) → Node 8 (No) OR Node 1 (Yes) → Node 2 (No) → Node 9 (Yes).
  *   **Nordenfelt:** Node 1 (No) → Node 3 (Yes) → Node 4 (Yes) → Node 6 (No) → Node 7 (Yes) OR Node 10 (Patient).
  *   **Fulford:** Node 1 (No) → Node 3 (Yes) → Node 4 (Yes) → Node 6 (No) → Node 7 (No) OR Node 9 (No).
  *   **Constructionist:** Node 1 (No) → Node 3 (Yes) → Node 4 (Yes) → Node 6 (Yes).
  *   **Unnamed:** Node 1 (No) → Node 3 (No) → Node 8 (Yes) → Node 7 (No).

  **Unstable Patterns**
  *   **The "Deviant but Harmless" Instability:** If you answer Node 1 (Yes) but Node 2 (No), you hold that risk constitutes disease but advantageous deviance does not. This is coherent (Wakefield), but if you answer Node 1 (Yes) and Node 5 (No), you claim pathology exists without structural dysfunction, which is logically tense.
  *   **The "Objective Suffering" Instability:** If you answer Node 6 (Yes) but Node 10 (Patient), you claim harm is objective yet judged by the subject. This pattern usually collapses into Fulford-style Normativism upon reflection.

  **Extensional Equivalence Note**
  *   **Boorse vs. Wakefield:** These leaves often agree on clinical ascriptions (extensionally equivalent) because statistical deviance usually correlates with dysfunction. The difference shows up only in hard cases like the Asymptomatic Carrier (Node 1) or the Freediver (Node 2).
  *   **Nordenfelt vs. Fulford:** These are nearly indistinguishable in practice; the split is theoretical (Vital Goals vs. Broad Values). The tree separates them only at Node 7 (Terminology) and Node 9 (Value-Free Core), which may feel like a verbal distinction to clinicians.
