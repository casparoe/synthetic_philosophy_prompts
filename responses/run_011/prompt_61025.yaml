  *   **The Synthesis:** For him, **What Matters = Psychological Continuity + Physical Continuity of the Functional Brain.**

  ### 2. The Verdicts on Your New Cases

  Here is what he will almost certainly say about your two cases, based on that rule.

  **Case 1: The One-Sitting Psychology Swap**
