answer: |-
  The coffee in the committee room was cold, the lights dimmed low over the two drafts spread across the table. Outside, the parliament building was quiet, but the vote on the National Digital ID was scheduled for noon.

  R tapped the cover of Bill A. "It's the only wall that actually holds. If the state doesn't have the file, it can't leak it, sell it, or weaponize it. That's the German instinct for a reason. Data minimisation isn't inefficiency; it's structural safety. No central register means no honeypot."

  T stirred his tea, watching the steam rise. "That's superstition. A modern state can't help collecting. You issue a credential, you verify it. That verification creates a shadow record anyway. The only real variable is whether we admit it and lock it down. Bill B stores centrally, yes, but every query is purpose-bound, cryptographically signed, and logged. A state that has to justify every look is more accountable than one that claims to know nothing and therefore can never be caught knowing something."

  "Claims," R said. "You're relying on the duty to audit. But the temptation to peek is permanent, and the duty to audit is intermittent. Every emergency carves an exception that never gets restored. When the pressure comes—and it will come—the logs get 'temporarily' suspended for national security. Then the precedent is set."

  "And in your world," T countered, leaning forward, "abuse is undetectable by design. If a clerk looks up his ex-wife's address, or a party operative checks donor records, your system says nothing. There's no central stream to monitor. My bill publishes aggregate access logs. That's the only mechanism that surfaces the pattern of quiet looking you're worried about. If twenty people query the same ID in a night, the anomaly triggers. In your system, that happens in the dark."

  "In the dark where it dies," R said. "In the light where it becomes a tool. You think cryptography survives a crisis? It doesn't. It survives on institutions. Your guarantees are only as durable as the people holding the keys when the bombs fall or the terror threat peaks. A log is a promise, not a wall. When the crisis motivates the abuse, the institution tasked with protecting the log will be the same one demanding access to it. They won't break the crypto; they'll break the auditors."

  T paused. He looked at the aggregate reporting clause in Bill B. "You think the crisis breaks the institution."

  "I know it does. History isn't a linear progression of privacy tech. It's a cycle of panic and consolidation. You're building a system for peacetime accountability in a world that runs on wartime exceptions."

  T sighed, rubbing his eyes. "If we go with Bill A, we lose the ability to catch routine corruption. The low-level abuse. The bureaucratic creep."

  "Better creeping than running," R said.

  "Maybe." T picked up his pen, hovering over Bill B. "But if we don't log, we fly blind. We won't know until the damage is done."

  "We'll know when the knock comes at the door," R said. "By then, your logs won't save us."

  T looked at the cryptographic signing requirement. He capped his pen. "You're right about the crisis point. If the executive declares an emergency, the crypto keys get subpoenaed or the admins get coerced. The log becomes a ledger for the purge."

  R nodded slowly. "So?"

  "So," T said, sliding Bill B back toward the center. "The aggregate logging stays. It catches the clerks, the operatives, the routine rot. But the retention period... I can't defend permanent storage of the logs. If the institution falls, the history shouldn't survive them."

  "You'd limit the log retention?" R asked.

  "Six months. Enough to catch the pattern, not enough to build a biography of dissent." T looked up. "It weakens the audit trail for long-term investigations, but it removes the weapon from the future tyrant's hand. You keep your wall, I keep my mirror. But the mirror fades."

  R considered this. It wasn't victory, but it was a breach in the armor. "Six months requires automatic deletion protocols. Hardcoded."

  "Hardcoded," T agreed. "But I'm not voting for Bill A. Local credentials shift the burden to the citizen. If they lose the key, they cease to exist."

  "Fine," R said, standing up. "But if that retention clause gets stripped in committee, I'm leaking the risk assessment."

  "Deal," T said. He didn't smile. He just turned off the lamp.
