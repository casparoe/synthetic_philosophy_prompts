answer: |-
  This is a classic case of a "philosophical slogan" doing too much heavy lifting. Your hunch is correct: "Belief aims at truth" is not a single thesis but a cluster of distinct claims that range from trivial platitudes to highly controversial normative theories. Your interlocutor likely slid between them without noticing.

  Here is a menu of five distinct readings of the slogan, categorized by the axes you identified, evaluated for plausibility, and mapped onto your two stalled arguments.

  ### The Menu: Five Readings of "Belief Aims at Truth"

  #### 1. The Norm of Correctness (The "Scorekeeping" Reading)
  *   **Thesis:** A belief is *correct* if and only if it is true, and *incorrect* if and only if it is false. Truth is the standard by which we evaluate belief.
  *   **Axis:** Normative status (Correctness) vs. Constitution.
  *   **Status:** **Platitude.** Very few epistemologists deny this. Even if you believe falsely for good reasons, the belief is still factually incorrect.
  *   **Work it does:** It explains why we *prefer* true beliefs, but it does not explain why we *can't* form false ones, nor why we *shouldn't* form true ones for bad reasons.

  #### 2. The Deliberative Transparency Thesis (The "First-Person" Reading)
  *   **Thesis:** When I deliberate about whether to believe *p*, I can only consider considerations that bear on the truth of *p*. Pragmatic considerations (money, happiness) disappear from view during the act of deliberation.
  *   **Axis:** Transparency/Deliberation; Descriptive of psychology.
  *   **Status:** **Substantive but Defensible.** Proposed by Shah & Velleman. It captures the phenomenology of deliberation (I ask "Is it raining?" not "Would it be nice if it were raining?"). However, it struggles to explain self-deception and motivated reasoning, which clearly happen.
  *   **Work it does:** It suggests that trying to believe for money is psychologically impossible *from the inside*, because money isn't a truth-reason.

  #### 3. The Exclusion of Pragmatic Reasons (The "Reasons" Reading)
  *   **Thesis:** Only evidence (truth-relevant considerations) counts as a *reason* for belief. Pragmatic benefits (money, happiness) may be *causes* of belief, but they cannot be *justifications* or *reasons* in the normative sense.
  *   **Axis:** Reasons vs. Causes; Normative constraint.
  *   **Status:** **Substantive and Controversial.** This is the battleground of "Pragmatic Encroachment." Many argue that if a belief saves your life or makes you happy, that *is* a rational consideration, even if not evidential.
  *   **Work it does:** This is the heavy lifter. It claims that believing for happiness is *irrational* by definition, not just impossible.

  #### 4. The Constitutive Aim (The "Archery" Reading)
  *   **Thesis:** Belief is a functional kind defined by its goal, like a heart is defined by pumping blood or an arrow by hitting a target. To "believe" something *just is* to be in a state regulated by a truth-norm. If you aren't aiming at truth, you aren't believing; you're imagining or supposing.
  *   **Axis:** Constitution; Analogy to intention/goal-directed states.
  *   **Status:** **Substantive and Dubious.** This is a metaphysical claim about the nature of mental states. It is vulnerable to counterexamples (e.g., self-deception seems to be a belief, but it aims at comfort).
  *   **Work it does:** It tries to make the norm internal to the concept. If you accept this, paying for belief is category error (like paying a heart to pump blood).

  #### 5. The Evolutionary/Functional Claim (The "Deflationary" Reading)
  *   **Thesis:** Human belief-forming mechanisms were selected for because they generally track truth. False beliefs tend to get agents killed.
  *   **Axis:** Descriptive; Evolutionary/Social function.
  *   **Status:** **Platitude/Defensible.** Generally true as a biological claim, but normatively weak. Just because our eyes evolved for seeing doesn't mean we *ought* to use them only for seeing (we might use them to signal status).
  *   **Work it does:** Explains why we *usually* seek truth, but cannot explain why it is *irrational* to deviate in specific cases.

  ---

  ### Mapping the Readings to the Arguments

  Here is where the sleight of hand likely occurred. The two arguments require different levels of strength from the slogan.

  #### Argument 1: "You can't be paid to believe."
  *   **What is needed:** A claim about **ability** (Doxastic Involuntarism).
  *   **Which reading supports it?** **Reading 2 (Transparency)** or **Reading 4 (Constitutive Aim)**.
      *   If belief is constituted by truth-regulation (Reading 4), then money (a non-truth factor) cannot trigger it directly.
      *   If deliberation is transparent (Reading 2), you cannot consciously adopt a belief because of money.
  *   **The Gap:** Reading 1 (Correctness) does *not* support this. Just because a belief is correct only if true doesn't mean I can't be bribed to hold one. I can hold a false belief; I can also hold a true belief for a bad reason.
  *   **Verdict:** The interlocutor likely relied on Reading 2 (Psychological impossibility) but presented it as Reading 1 (Conceptual truth).

  #### Argument 2: "Believing for happiness is irrational."
  *   **What is needed:** A claim about **rationality/normativity**.
  *   **Which reading supports it?** **Reading 3 (Exclusion of Reasons)**.
      *   To say it is *irrational*, you must claim that pragmatic benefits are excluded from the space of reasons.
  *   **The Gap:** Reading 5 (Evolutionary) doesn't support this. Just because belief evolved for truth doesn't mean using it for happiness is irrational (we use hands evolved for gripping to play piano). Reading 1 (Correctness) doesn't support this either; a happy belief can be correct (true).
  *   **Verdict:** This requires the strongest, most controversial reading (Reading 3).

  ---

  ### Diagnosis: The Interlocutor's Slide

  **Most Likely Reading in Mind:**
  She was likely operating with a hybrid of **Reading 1 (Correctness)** and **Reading 4 (Constitutive Aim)**.
  *   *Why?* Reading 1 feels like a safe platitude ("Of course belief is about truth!"). Reading 4 feels like a deep conceptual insight ("Belief *is* truth-tracking").
  *   *The Slide:* She treated the platitude (Reading 1) as if it entailed the constitutive norm (Reading 4), which in turn entailed the exclusion of reasons (Reading 3).

  **The Gap:**
  There is a massive gap between **"Belief is correct only if true"** (which everyone accepts) and **"One cannot rationally believe for pragmatic reasons"** (which is highly contested).
  *   For the **Payment Argument**, she needs *Involuntarism* (I can't will belief). "Aiming at truth" doesn't prove I can't will it; it just proves I shouldn't.
  *   For the **Happiness Argument**, she needs *Epistemic Purism* (Only truth counts as a reason). "Aiming at truth" is compatible with having multiple aims (e.g., a car aims at transport, but I can rationally buy one for status).

  ---

  ### The Real Crux: What to Argue Next Week

  If you want to break the deadlock, tell the group that "Belief aims at truth" is a placeholder, not an argument. Propose spending the hour on the actual underlying disagreements.

  **For the Payment Argument (The "Can" Question):**
  *   **The Crux:** **Doxastic Voluntarism.**
  *   **The Question:** Is belief under direct voluntary control?
  *   **Why it matters:** If I *can* believe at will, payment works. If I *can't*, payment fails. The "aim at truth" slogan is irrelevant unless it proves involuntarism.
  *   **Challenge to the group:** "Can you right now, for $1,000, believe that the moon is made of cheese? If not, is it because belief 'aims at truth,' or simply because our psychology is wired to respond to evidence?"

  **For the Happiness Argument (The "Should" Question):**
  *   **The Crux:** **Pragmatic Encroachment vs. Epistemic Purism.**
  *   **The Question:** Are there pragmatic *reasons* for belief, or only pragmatic *benefits*?
  *   **Why it matters:** If pragmatic reasons exist, believing for happiness is rational (Instrumental Rationality). If only epistemic reasons exist, it is irrational.
  *   **Challenge to the group:** "If believing my spouse is innocent saves my marriage and makes me happier, and I have no evidence they are guilty, is it *irrational* to maintain that belief? If yes, why does 'truth' trump 'well-being' in the definition of rationality?"

  **Summary for your opening statement:**
  "Last week we treated 'belief aims at truth' as a premise. But it's actually a conclusion that hides three different debates: whether we can believe at will, whether pragmatic reasons count as reasons, and whether the function of belief constrains its rationality. We shouldn't nod at the slogan; we should pick which of those three debates we actually want to have."
