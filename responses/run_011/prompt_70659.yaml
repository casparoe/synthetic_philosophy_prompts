      *   *The Gap:* The slogan is often treated as a conceptual truth (Platitude) when it's actually a substantive normative claim (Controversial).

  6.  **Identify the Real Crux:**
      *   *Case 1 (Payment):* It's not about truth-aiming, it's about *Doxastic Involuntarism* (Can we believe at will?).
      *   *Case 2 (Pragmatics):* It's about *The Nature of Rationality* (Is rationality purely epistemic or does it include pragmatic utility?).

