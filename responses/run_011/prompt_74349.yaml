answer: |-
  Let us walk through the play as a bargaining history, applying your framework of moral trade to the specific sequence of offers and refusals.

  **The Bargaining History**

  The first negotiation occurs between the sisters. Ismene initially refuses to participate in the burial, citing the impossibility of success against the state. This is a standard refusal to enter a contract where the expected return is negative. However, after Antigone acts, Ismene offers to share the punishment. Under a moral trade framework, Ismene is attempting to purchase a share of the moral good (solidarity with family) at a discounted rate, since she bore none of the risk. Antigone rejects this. Her refusal is not merely emotional; it is a rejection of the fungibility of the act. For Antigone, the moral value is generated by the risk itself. To allow Ismene to claim the credit without the cost would be to falsify the moral currency. Antigone treats the deed as non-transferable property.

  The second stage involves Haemon and Creon. Haemon does not appeal to abstract right but to political accounting. He informs Creon that the city values Antigone's life and that Creon's rigid stance is depleting his political capital. This is a proposal for a trade: Creon yields on the corpse (a low cost to him, theoretically) in exchange for preserved authority and his son's loyalty (high value). Creon rejects this, but his rejection reveals a distortion in his own valuation. He views yielding not as a strategic concession but as a loss of status equivalent to being ruled by a woman. He cannot find an exchange rate because he has equated his personal authority with the state's survival. He treats the concession as a zero-sum loss rather than a liquidity move.

  The third stage is the encounter with Teiresias. Here the lens bites hardest. Teiresias offers a warning: the gods are rejecting the city's sacrifices because of the unburied corpse. This is a cosmic price signal. Creon's immediate response is to accuse the prophet of having been paid to speak. This is critical. Creon cannot conceive of a warning that is not a transaction. He assumes that because there is a cost to heeding the warning (burying the traitor), there must be a payment attached to the warning itself. He projects his own market logic onto the divine. When he finally accepts the trade—burying Polyneices to save Haemon—the market has closed. The delay demonstrates that moral trade is time-sensitive. The exchange rate shifted as the consequences compounded; what could have been bought cheaply (a simple burial) later required the price of a life, and finally, the price of the entire family.

  **The Argument from Non-Substitutability**

  Antigone's justification regarding her brother is the strongest challenge to your framework. She argues that she would not have defied the state for a husband or a child, because those can be replaced; she did it for a brother because, with her parents dead, no other brother can be born.

  This is an explicit argument from non-substitutability to non-tradeability. Your framework relies on agents finding actions that are "worth more to one of them than to the other." This implies fungibility: I give up X, which I value less, to get Y, which I value more. But Antigone posits a good (the burial of *this* brother) that has no substitute. If a good is unique and necessary, its value approaches infinity within the agent's system. There is no amount of civic order Creon can offer that offsets the infinite disutility of leaving *this* brother unburied.

  The moral trade framework can technically absorb this by assigning infinite value, but in doing so, it renders trade impossible. If one party holds a good as non-fungible, no exchange rate exists. Therefore, Antigone's logic survives contact with your framework only by breaking the framework's precondition for trade. She establishes that some duties are tied to specific tokens, not general types. You cannot trade "a burial" for "order"; it must be *this* burial.

  **Where the Reading Breaks Down**

  You asked where you should stop pressing this lens. The reading breaks down when it treats the characters as rational maximizers of their existing preferences. The heroic and divine register of the play operates on a logic of purity and pollution, not optimization.

  First, Antigone is not merely maximizing her moral utility; she is actively seeking death. She speaks of her tomb as a bridal chamber. If her preference ordering includes self-destruction as a positive good, she is not a bargaining agent in the standard sense. A trader seeks to come out ahead; Antigone seeks to exit the game. Treating her as a negotiator obscures her drive for martyrdom, which is not a commodity to be traded but an end state.

  Second, Creon is not a trader; he is a tyrant. A trader recognizes the sovereignty of the other party's valuation. Creon denies Antigone's moral agency entirely, treating her action as mere insubordination. He does not want to trade; he wants submission. To frame this as a failed negotiation implies Creon was willing to recognize Antigone as a counterparty with valid claims. He was not. He recognized only power.

  Third, the divine element resists marketization. The pollution that falls on Thebes is not a penalty negotiated between parties; it is an automatic consequence, like touching fire. Teiresias does not offer a deal; he reports a causal reality. Framing this as a bargaining chip suggests the gods are open to compromise. The play suggests they are not. They enforce boundaries. When you treat the divine law as a bargaining position, you distort the nature of the threat. It is not a threat; it is a law of nature.

  **The Commitment**

  I will take a side. Your colleague argues the play is a tragedy of bargaining failure: a mutually acceptable deal was available, and stubbornness destroyed everyone. I support your view: the play is a refutation of the idea that certain goods can be priced, and the tragedy lies in Creon's attempt to impose a market logic on a sacred sphere.

  The reason is structural. If this were a tragedy of bargaining failure, the resolution would vindicate the middle ground. Haemon represents the middle ground—flexibility, prudence, political accounting. Yet Haemon dies. Teiresias represents the voice of divine reality, and he is ignored until it is too late. The play does not punish the stubbornness of both sides equally; it punishes Creon's specific error of judgment regarding the nature of the goods at stake.

  Creon treats the corpse as a political object to be managed. Antigone treats it as a sacred object to be honored. These are not different prices for the same item; they are different categories of existence. To suggest a deal was "available" is to assume the corpse *could* be priced. The play demonstrates that attempting to price it destroys the pricer. Creon's reversal comes too late not because of bad timing, but because the violation had already occurred. The pollution was already released. You cannot undo a sacrilege by changing your mind later, whereas in a moral trade, you can usually unwind a deal or compensate for delay. The irreversible nature of the consequence signals that this was never a tradeable context.

  Therefore, the counsel of flexibility offered by Haemon is indeed the shallow position. It assumes the conflict is about resource allocation. The play reveals the conflict is about ontology—what kind of thing is a brother, and what kind of thing is a ruler. You cannot compromise on ontology without ceasing to be who you are.

  **What the Drama Contributes**

  Finally, what does this dramatization contribute to the debate over moral trade that a journal article could not?

  A journal article abstracts the agents. It discusses "Agent A" and "Agent B" and their utility functions. It allows you to posit the possibility of trade without witnessing the visceral cost of the collision. The play forces you to witness the *remainder*. In moral trade theory, if a deal isn't struck, the agents remain in their pre-trade positions. In *Antigone*, when the "deal" fails, the agents do not remain static; they are destroyed. The bodies pile up.

  The drama contributes the reality of emotional and physical ruin that theoretical models often sanitize. It shows that when incommensurable values collide, the friction generates heat that burns the surrounding community (Ismene, Haemon, Eurydice), not just the principals. A journal article might conclude that "trade was impossible due to incommensurability." The play shows that the *attempt* to force trade (Creon's decree) generates a specific kind of violence that a mere stalemate does not.

  However, I must be candid about how much of this verdict depends on a contested reading of Antigone's motives. If Antigone is purely a deontologist acting out of duty to divine law, my reading holds: she cannot trade because the duty is absolute. But if Antigone is driven by a death wish, or by a desire to assert her own glory over the state, then she is not refusing trade on principle; she is simply irrational. If she is irrational, the moral trade framework does not fail; the agent simply falls outside the model's scope.

  If she loves death more than life, no trade is possible because she values the currency of the living (safety, future, compromise) at zero. My defense of your position relies on Antigone being sane and her values being coherent, just incompatible with Creon's. If she is in love with death, the play is not a refutation of moral trade, but a study of pathology. Given the text, where she articulates the logic of the replaceable husband versus the irreplaceable brother, I believe the coherent reading is the stronger one. She is not suicidal; she is sacrificial. And sacrifice is the one transaction where the payment is the self, which precludes coming out ahead.
