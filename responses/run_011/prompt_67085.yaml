answer: |-
  There is no single, canonical term in the philosophy of history that captures both halves of this maneuver (the structural smuggling and the immunizing disavowal) with the precision you require. You have correctly identified a gap between the existing concepts.

  The closest established concept is **Roland Barthes's "The Referential Illusion"** (from his 1967 essay *"The Discourse of History"*), but you are right to distinguish it from the "Reality Effect." The Reality Effect concerns *details* (the barometer on the wall) that signify "the real." The Referential Illusion concerns the *structure of the discourse* itself. Barthes argues that historical narrative hides its own enunciation (the "I am telling you" is erased) so that the signifier (the text) appears to be the signified (the event). The text claims not to *represent* reality, but to *be* reality. This covers the smuggling (narrative structure imposed as fact) and the immunity (to critique the text is to critique the fact).

  However, "Referential Illusion" is often categorized under literary theory or semiotics, which may not land well in a US history journal's theory section. In the philosophy of history proper, the phenomenon is usually disaggregated:
  *   **Louis Mink's "Narrative Causality":** Covers the smuggling (the "joints" create causality not present in the events).
  *   **Robert Jervis's "Retrospective Determinism":** Covers the "outcome was the only one available" aspect.
  *   **Alun Munslow's "Reconstructionism":** Covers the epistemological stance that the past can be accessed without construction.

  None of these fully capture the *rhetorical immunity* bought by the disavowal. Since you are drafting for a US journal and need a functional label, I recommend coining or adopting the term **"The Rhetoric of Archival Inevitability."**

  Here is the carving you asked for, defined with its edges marked.

  ### Proposed Term: The Rhetoric of Archival Inevitability

  **Definition:** A historiographical maneuver in which the author imposes a specific causal or interpretive shape upon events through narrative structure (selection, ordering, emphasis) while explicitly disavowing interpretive agency, attributing the narrative shape solely to the internal logic of the sources.

  **The Two Halves:**
  1.  **Structural Determinism:** The argument is located in the *joints* (chapter breaks, sequencing, subordination of clauses) rather than in explicit claims. This creates a sense of inevitability (your supervisor's critique).
  2.  **Epistemic Shielding:** The disavowal of argument ("I am only describing") functions as a defensive perimeter. It reframes potential criticism of the *interpretation* as a denial of the *evidence*.

  **Boundary Conditions (The Edges):**

  *   **Sincerity:** Irrelevant. The phenomenon is defined by the *textual effect*, not the author's intent. Whether the historian sincerely believes the archives "spoke" or is cynically hiding a thesis, the rhetorical operation and its immunity function remain identical. The "View from Nowhere" is effective regardless of whether the author believes they are actually there.
  *   **Fidelity to Sources:** Requires sentence-level fidelity. For the shield to hold, individual propositions must be defensible by citation. If individual sentences are demonstrably false, the shield collapses into fabrication. The maneuver relies on the *truth of the parts* to protect the *contestation of the whole*.
  *   **The Threshold:** The line between necessary selection and this maneuver is crossed when the *transitions* imply a causal or logical link that the sources do not support. If Source A says X happened on Monday, and Source B says Y happened on Tuesday, and the historian writes "X happened on Monday, leading to Y on Tuesday," the "leading to" is the smuggling. If the historian writes "X happened on Monday. Y happened on Tuesday," and places them in consecutive paragraphs within a chapter titled "The Crisis Deepens," the smuggling is in the *contextual framing*. The threshold is passed when the arrangement precludes alternative configurations of the same valid facts.

  ### Why this fits your needs

  For a US journal, "The Referential Illusion" may require too much explanation of French post-structuralism. **"The Rhetoric of Archival Inevitability"** is self-explanatory to Anglophone historians. It signals that you understand the empirical commitment (Archival) while critiquing the narrative construction (Rhetoric/Inevitability).

  It allows you to make the following move in your theory section:
  > *"This account relies on what I term the **Rhetoric of Archival Inevitability**. By disavowing narrative agency, the author locates the argument in the structure of the account rather than its claims. This grants the narrative immunity from critique, as challenging the interpretation appears to challenge the archival record itself."*

  ### Summary of Existing Concepts vs. Your Need

  | Concept | Covers Smuggling? | Covers Immunity? | Verdict |
  | :--- | :--- | :--- | :--- |
  | **Reality Effect (Barthes)** | No (Details only) | No | Reject (as you did) |
  | **Referential Illusion (Barthes)** | Yes | Yes | **Best Philosophical Fit** (but lit-theory baggage) |
  | **Narrative Causality (Mink)** | Yes | No | Too descriptive |
  | **Retrospective Determinism (Jervis)** | Yes (Outcome only) | No | Too cognitive/psychological |
  | **Reconstructionism (Munslow)** | Yes (Stance) | Yes (Implicitly) | Too broad/epistemological |
  | **Archival Inevitability (Coined)** | **Yes** | **Yes** | **Best Rhetorical Fit** |

  ### Recommendation

  Use **"The Referential Illusion"** if you want to anchor the argument in established philosophy of history/semiotics (citing Barthes's *"The Discourse of History,"* not *"The Reality Effect"*).

  Use **"The Rhetoric of Archival Inevitability"** if you want a term that is immediately operational for a history audience and allows you to define the edges (sincerity, fidelity, threshold) exactly as you have outlined them without carrying the baggage of the "Linguistic Turn" debates that US history departments often treat with suspicion.

  Given your department's aversion to "theory," the latter is likely the safer, more persuasive choice for a US journal. It sounds like a methodological critique rather than a philosophical assault.
