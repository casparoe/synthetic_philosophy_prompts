  ### The Gap Analysis (You: 0.3 vs. Consultant: 0.8)

  The gap between you and your consultant is not primarily about the facts of dementia or the definition of narrative. It is about the **weighting of Term 4 (Phenomenology)** and **Term 3 (Authorship)**.

