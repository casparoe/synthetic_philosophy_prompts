  To calculate the probability of NG being true, I am using a **Weighted Arithmetic Mean**. I am not using a conjunction (which would yield a near-zero probability given the uncertainties) because philosophical theories are rarely all-or-nothing; they are assessments of best explanation.

  However, I have weighted the terms based on their importance to the *coherence of the theory* and the *stakes of your inquiry*. **Term 3 (Authorship)** and **Term 4 (Phenomenology)** carry the most weight because they determine whether the self survives the loss of memory (your plot) and whether the self is real to the feeler (the truth condition).

