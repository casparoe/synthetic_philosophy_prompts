answer: |-
  The activity rests on a mid-game rule shift that decouples chip accumulation from material survival, landing exactly when you declare a currency reform that renders liquid assets worthless while leaving real goods intact.

  ### Materials & Preparation
  *   **Goods Cards (Printed):** 5 types (Grain, Oil, Cloth, Tools, Wine). Print 130 cards total (5 cards per student, randomized decks).
  *   **Household Need Cards (Printed):** 26 cards. Each lists a specific requirement: "1 Grain, 1 Oil, 1 Cloth" (vary the specific triad slightly to force trade, e.g., some need Tools instead of Oil).
  *   **Chips:**
      *   **Blue (Currency):** 260 total (10 per student).
      *   **Red (Interest/*Tokos*):** 50 total (held by you).
      *   **White (Reserve):** 50 total (held by you, emergency liquidity only).
  *   **Loan Contracts (Index Cards):** Pre-write 10 cards with blanks: *Lender ______ lends Borrower ______ [Amount] Blue. Repay [Amount + 1 Red] by end of round.*
  *   **Room:** Single seminar table. Seat students around it. Place Goods Cards and Blue Chips in the center or distribute face-down.

  ### Endowments & Rules (Handout/Verbal)
  1.  **Start:** Each student receives 5 random Goods Cards and 10 Blue Chips.
  2.  **Phase 1 Goal (Household Management):** Secure the 3 Goods listed on your Need Card AND retain at least 5 Blue Chips. This represents "taxes" required to keep your property.
  3.  **Phase 2 Goal (Wealth-Getting):** Securing goods no longer matters. The goal is to accumulate **Red Chips**. Red Chips are issued by the TA only when a loan is made.
  4.  **Banking Rule:** To get a Red Chip, a Lender must give Blue Chips to a Borrower. The Borrower signs a Contract promising to return the Blue + 1 Red Chip later. **No new Blue Chips will be printed.**
  5.  **Winning:** undefined until the end.

  ### Minute-by-Minute Timeline (75 Minutes)

  **0:00–0:05 | Setup & Endowment**
  Distribute Goods and Chips. Do not explain the philosophy yet. State the Phase 1 Goal clearly. "You have 15 minutes to secure your household. If you lack the 3 Goods or 5 Chips at the bell, you are 'bankrupt' and sit out Phase 2."

  **0:05–0:20 | Phase 1: Oikonomia (Natural Acquisition)**
  Students trade. They will barter Goods for Goods and use Blue Chips to balance differences.
  *   *TA Role:* Circulate. Enforce the "5 Chip Tax." If someone hoards all the Blue Chips, trade will stall. If it stalls too hard, inject 5 White Chips into the pool as "emergency liquidity" (tell them it's a government stimulus).
  *   *Observation:* Watch the Econ majors. They will likely accumulate excess Blue Chips beyond the 5 needed. Let them.

  **0:20–0:25 | Transition: The Hook**
  Call time. Check who is "bankrupt" (missing Goods or Chips). Eliminate them from trading (they observe).
  **Announce Phase 2:** "The Polis has changed. Survival is guaranteed. Goods are now irrelevant. The only metric of success is Red Chips. You earn Red Chips by lending Blue Chips. Interest rate is fixed: 1 Red per 5 Blue lent. Contracts must be written."
  *   *Crucial:* Do not set an end time for Phase 2. Just say "Trade until further notice." This removes the natural stopping point.

  **0:25–0:45 | Phase 2: Chrematistike (Unlimited Acquisition)**
  Students lend Blue to earn Red.
  *   *The Trap:* Since no new Blue Chips are printed, Borrowers must compete for the fixed pool of Blue to repay principal + interest.
  *   *The Experience:* Lenders feel rich (accumulating Red). Borrowers feel squeezed (scrambling for Blue). The total debt (Blue + Red claims) exceeds the total currency (Blue).
  *   *TA Role:* Issue Red Chips strictly according to contracts. If someone says "I have enough," encourage them: "There is no cap. The richest householder wins status."

  **0:45–0:50 | The Shock: The Midas Moment**
  Stand up. Assume authority. "The State declares a Currency Reform. Effective immediately, Blue Chips are demonetized. They are now plastic. Red Chips were claims on Blue; they are now void. Only Goods Cards have value."
  *   *Action:* Collect all Blue and Red Chips into a bin visibly.
  *   *Instruction:* "Count your Goods. Those with the most Goods survive. Those with the most Chips starve."

  **0:50–1:15 | Debrief & Mapping**
  See mapping below.

  ### Debrief Mapping (Text to Experience)

  | Moment in Play | Aristotle's Claim | Text Reference |
  | :--- | :--- | :--- |
  | **Phase 1 Goal** | **Household Management (*Oikonomia*):** Acquisition is limited by the needs of the household (the 3 Goods + Tax). Once met, trade should stop. | *Politics* I.8-9 |
  | **Phase 2 Goal** | **Wealth-Getting (*Chrematistike*):** Acquisition becomes limitless because the end (Chips) has no natural use. You traded for Chips to get more Chips. | *Politics* I.9-10 |
  | **Interest Mechanism** | **Money is Barren:** Red Chips (Interest) were created without new Goods. Money breeding money is unnatural because coins produce nothing. | *Politics* 1258b |
  | **The Squeeze** | **Unnatural Debt:** Since Blue Chips were fixed but Debt (Blue+Red) grew, borrowers had to extract from others to pay. This creates hostility, not community. | *Ethics* V (Reciprocity) |
  | **The Shock** | **Money is Conventional (*Nomos*):** Money exists by agreement, not nature (*Physis*). When the agreement ends, the wealth vanishes. | *Politics* 1257a; *Ethics* V |
  | **Midas Story** | **Wealth vs. Use:** You had "wealth" in chips but could not eat them. True wealth is the use-value of goods (Grain/Oil). | *Politics* 1257b |

  ### Predictable Failures & Fixes

  1.  **The Liquidity Trap (Econ Major Hoarding):**
      *   *Failure:* In Phase 1, an Econ major realizes Chips are scarce and hoards them, freezing trade.
      *   *Fix:* Use your **White Chips**. Announce: "The market is illiquid. The State is injecting reserve capital." Dump 10 White chips (valued same as Blue) into the center. This keeps trade moving without validating their hoarding strategy permanently.
  2.  **The Strike (Refusal to Borrow):**
      *   *Failure:* Students realize the math doesn't work (zero-sum liquidity) and refuse to borrow in Phase 2, stalling Red Chip generation.
      *   *Fix:* Apply social pressure. "The richest householder will be recognized." Or, privately offer a "bailout" to one borrower to show it's possible, sparking a race.
  3.  **Genuine Anger at the Shock:**
      *   *Failure:* Students feel cheated because they "played well" (accumulated Chips) and lost.
      *   *Fix:* Do not apologize. Validate their skill, then reframe the lesson. Script: "You optimized perfectly for the rules I gave you. You are right to be angry. Aristotle's point is that the *polis* often sets up rules that reward the wrong things. You won the game of Wealth-Getting, which proves you are good at it. But you lost the game of Living. That is the tragedy he wants us to see."

  ### Limitations & Teleology
  This simulation demonstrates the *instrumental* irrationality of unlimited accumulation (it risks starvation) and the *conventional* instability of money. It **cannot** reproduce Aristotle's *moral* teleology. The game makes limitless accumulation look *risky*, but Aristotle argues it is *virtuously wrong* regardless of risk. He believes human beings have a natural end (*telos*): the good life (*eudaimonia*). Acquiring past need is a mistake about what humans are *for*, not just a bad investment strategy. You must supply this verbally in the debrief: "Even if the currency hadn't collapsed, Aristotle says you wasted your time. You were training for a race that leads nowhere."

  ### Etymology Note: *Tokos*
  You are correct. The Greek word for interest is **τόκος (*tokos*)**, which literally means "offspring" or "birth." Aristotle explicitly puns on this in *Politics* 1258b19: "And this term interest, which means the birth of money from money, is applied to the breeding of money because the offspring resembles the parent." Use this in the debrief when discussing the Red Chips. "You were trying to make money breed. Aristotle says this is the most unnatural act because coins are sterile."
