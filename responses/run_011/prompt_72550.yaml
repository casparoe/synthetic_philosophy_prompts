answer: |-
  ### The Committee Procedure (Admissibility Testing Protocol)

  **Purpose:** To determine the admissibility of motions tabled for Annual Congress within ninety minutes, without legal counsel.
  **Verdicts:** Inadmissible (Congress cannot consider); Admissible (Ordinary Track); Admissible (Entrenched Track); Refer (Return to Mover).
  **Tie-Break Rule:** Where two rules conflict and neither is entrenched, the rule preserving the Federation's operational continuity prevails over the rule asserting absolute textual compliance. Where Rule 3 (Congress Procedure) conflicts with Rule 12 (Committee Finality) regarding *admissibility*, Rule 12 prevails; regarding *substance*, Rule 3 prevails.

  **The Test Sequence:**

  1.  **Track Verification:** Does the motion add, amend, or repeal a Rule?
      *   *No:* **Admissible (Congress Procedure).**
      *   *Yes:* Proceed to Test 2.
      *   *[Choice Node]:* If the motion claims to change the "effect" of a rule without changing text, treat as amendment.

  2.  **Entrenchment Scan:** Does the motion affect Rule 101 (including 101(a), 101(b), 101(c)) or any provision listed in 101(b) (e.g., Rule 7)?
      *   *Yes:* Is it tabled under the **Entrenched Track** (3/4 vote + club ratification notice)?
          *   *No:* **Inadmissible.** (Stop).
          *   *Yes:* Proceed to Test 3.
      *   *No:* Is it tabled under the **Ordinary Track** (2/3 vote + 60 days notice)?
          *   *No:* **Refer** (to Mover for correct notice).
          *   *Yes:* Proceed to Test 3.
      *   *[Finding Node]:* This is a textual match against Rule 101(b). No discretion.

  3.  **Re-enactment Bar (Rule 44):** Was the substantive provision of this motion repealed at the current or immediately preceding Congress?
      *   *Yes:* **Inadmissible.**
      *   *No:* Proceed to Test 4.
      *   *[Choice Node]:* Determining "substantially the same" requires committee judgment on intent vs. text.

  4.  **Sovereignty Check (Rule 3 vs. Rule 12):** Does the motion attempt to bind future Congresses on matters of *procedure* (Rule 3) or remove the Committee's power to rule on *admissibility* (Rule 12)?
      *   *Bind Future Procedure:* **Inadmissible.** (A Congress cannot strip a successor's procedural sovereignty).
      *   *Remove Committee Power:* **Admissible.** (Congress may abolish the Committee, provided Test 2 is passed).
      *   *[Choice Node]:* Distinguishing "procedure" from "substantive right" is a political judgment.

  5.  **Formal Compliance:** Is the text final? Is notice exact (60 days)?
      *   *Fail:* **Refer** (to Mover).
      *   *Pass:* **Admissible** (under verified Track).
      *   *[Choice Node]:* Minor notice defects (e.g., 58 vs. 60 days) may be waived if reliance is established (see Motion C).

  ***

  ### Application to Motions

  **Motion A**
  *Analysis:* Motion A seeks to amend Rule 101(a) and repeal Rule 101(c). Rule 101(c) entrenches Rule 101 under Rule 101(b). Therefore, any change to Rule 101 requires the Entrenched Track. Motion A is tabled under the Ordinary Track. It also attempts to disapply Rule 12 and Rule 44 prospectively; while Congress can amend Rule 12, it cannot bypass the current entrenchment requirements to do so. The "notwithstanding" clauses do not cure the track defect.
  *Verdict:* Inadmissible.
  *Readout:* "Motion A is inadmissible because it seeks to amend an entrenched provision using the ordinary track."
  1. Rule 101(c) explicitly entrenches Rule 101 under the provisions of Rule 101(b).
  2. The motion was tabled under the ordinary track, failing the required notice and voting threshold for entrenched rules.
  3. A motion cannot validate its own procedure by declaring other rules inapplicable prior to adoption.

  **Motion B**
  *Analysis:* B1 and B2 are tabled under the Entrenched Track and do not conflict with existing text. They attempt to create perpetual entrenchment. Under Rule 3, a current Congress cannot bind the *procedure* of a future Congress absolutely; a future Congress could assert sovereignty and repeal them using the standard amendment process if it chooses to ignore the entrenchment. However, *admissibility* is judged by current rules. Currently, they are valid enactments. In Year 3, a motion to repeal Rule 250 would be *Admissible under the Ordinary Track* despite Rule 250's text, because Rule 3 (Congress Procedure) overrides attempted perpetual procedural binds, but the Committee should rule it Admissible under the *Entrenched Track* to respect the text as written, leaving the sovereignty fight to the Congress floor. There is no way out via Rule 205 (unanimity is impossible). The escape is Rule 3 asserted by a future Congress.
  *Verdict:* Admissible (Entrenched Track).
  *Readout:* "Motions B1 and B2 are admissible under the entrenched track, subject to the continuing procedural sovereignty of future Congresses."
  1. The motions comply with all current notice, voting, and entrenchment requirements.
  2. Nothing in the Rules prohibits the enactment of new entrenched provisions.
  3. Rule 3 preserves the right of future Congresses to determine their own procedure, rendering absolute permanence a political fact rather than a legal certainty.

  **Motion C**
  *Analysis:* Two motions: C1 (Declare 2014 Void) and C2 (Declare 2014 Valid). Strict application of Rule 101(a) makes the 2014 amendment void (58 vs. 60 days). However, eleven years of reliance and uncontested elections create an equitable estoppel. Enforcing strict compliance now destabilizes the Federation. This is a *[Choice Node]* in Test 5 (Formal Compliance). We choose stability over textualism. C1 is inadmissible (vexatious/destabilizing); C2 is admissible.
  *Verdict:* C1 Inadmissible; C2 Admissible.
  *Readout:* "Motion C1 is inadmissible as destabilizing to established governance; Motion C2 is admissible to ratify established practice."
  1. The 2014 amendment has been acted upon for eleven years without contest.
  2. Declaring past elections void would invalidate the tenure of all current officers and create administrative chaos.
  3. The Committee exercises its discretion to waive minor notice defects where reliance is total and uncontested.

  **Motion D**
  *Analysis:* Motion D repeals Rule 12 (Committee Power). Rule 12 is not in the Rule 101(b) list of entrenched provisions. Therefore, it can be amended via the Ordinary Track. The Committee is competent to rule on a motion that abolishes its competence because the power to rule derives from the current Rules, which are still in force until the motion passes. If the motion carries, Rule 12 is gone, and our ruling on *this* motion remains final (Rule 12 says our ruling is final, it doesn't say it can be appealed later).
  *Verdict:* Admissible (Ordinary Track).
  *Readout:* "Motion D is admissible under the ordinary track, as Congress retains the power to determine its own procedure."
  1. Rule 12 is not listed in Rule 101(b) and is not itself entrenched.
  2. Rule 3 explicitly reserves to Congress the power to determine its own procedure.
  3. The Committee's authority to rule exists under the current Rules until such time as they are lawfully changed.

  ***

  ### Deliverable 1: Operational Distinctions

  **Distinctions to Preserve:**
  1.  **Limit on How vs. Limit on What:** Distinguishing procedural hurdles (vote thresholds) from substantive bans (rights). *Operational:* Determines if a motion is Inadmissible (wrong track) or just hard to pass.
  2.  **Validity of Enactment vs. Validity of Content:** A rule can be properly passed but legally ineffective (e.g., Motion B binding successors). *Operational:* Allows us to rule "Admissible" without guaranteeing the rule will work forever.
  3.  **Unamendable vs. Unamended:** A rule that *can* be amended but *hasn't* is not entrenched. *Operational:* Prevents volunteers from treating old rules as sacred text.
  4.  **Retrospective vs. Prospective:** Changing a rule for the future vs. voiding past acts (Motion C). *Operational:* Protects the Federation from chaos caused by retroactive invalidation.
  5.  **Acceptance as Fact vs. Acceptance as Rule:** Members obeying a rule vs. the Committee citing it as binding precedent. *Operational:* Allows us to ignore "informal habits" unless they create reliance interests.

  **Distinctions to Ignore:**
  1.  **Constituent Power vs. Constituted Power:** (The "People" vs. the "Congress"). *Risk:* Ignoring this risks volunteers thinking they represent a higher sovereignty than the Rules allow; mitigate by sticking strictly to Rule 3.
  2.  **Implied Repeal:** (New rule cancels old rule without saying so). *Risk:* Ignoring this risks confusion; mitigate by requiring explicit repeal text in motions.

  ### Deliverable 2: Defended Default Rules

  1.  **Conflict of Non-Entrenched Rules:** *Later-in-time prevails.* (Standard legislative practice, minimizes committee intervention).
  2.  **Conflict of Thresholds:** *Higher threshold prevails.* (If one rule says 2/3 and another says 3/4 for the same action, require 3/4 to ensure safety).
  3.  **Self-Reference:** *The reading that avoids infinite regress prevails.* (If a rule refers to itself, interpret it as applying to the *process* of amendment, not requiring a meta-amendment).
  4.  **Committee Competence:** *The reading that preserves the Committee's power to rule on admissibility prevails.* (If a motion is ambiguous on whether it strips our power, assume it does not, otherwise we cannot process the motion).

  ### Deliverable 3: Precedent Book Wording

  "To prevent precedents from becoming de facto entrenched rules, every entry in the Precedent Book must conclude with the following clause:

  *'This ruling applies to the specific text and factual circumstances presented at the [Year] Congress. It does not establish a binding principle of interpretation for future Committees, who retain full discretion to distinguish future motions on their merits or to depart from this reasoning if the Rulebook or Federation circumstances materially change.'*"

  ### Deliverable 4: Honest Limits

  **The Indefensible Class:**
  This procedure will output an indefensible result if a motion is tabled that complies with all textual requirements but violates the *spirit* of the Federation (e.g., a motion to expel a club without cause, which might violate Rule 7's "right to withdraw" by forcing them out). We have no rule to block this except "Inadmissible" via Test 4 (Sovereignty), which is a stretch.

  **The "Refer" Trap:**
  "Refer" is not a true escape hatch. Rule 12 forbids Congress from considering inadmissible motions. If we "Refer" a motion to Congress with a "fix this" note, Congress cannot consider it until we rule it Admissible. Therefore, "Refer" must mean "Return to Mover to Redraft." If the Mover refuses, the motion dies. We cannot use "Refer" to pass the buck to Congress.

  **Political Judgment:**
  In Motion C (The 58-Day Notice), we are exercising political judgment under the cover of Test 5. We are choosing stability over legality. This is indefensible in a court of law but necessary for a volunteer federation.

  **The Ruling I Do Not Want to Publish:**
  Motion C. Admitting that we are ignoring the clear text of Rule 101(a) ("sixty days' written notice") because "everyone did it anyway" undermines the authority of the Rulebook we are sworn to uphold. It tells the membership that rules only matter if we feel like enforcing them.
  *Sentence anyway:* "Motion C1 is inadmissible as destabilizing to established governance; Motion C2 is admissible to ratify established practice."
