answer: |-
  ### 1. The Axes

  Positions in this debate diverge along six primary dimensions. Note that while conceptually distinct, empirical measures often conflate them.

  1.  **Locus of Effect:** Does the cognitive influence alter sensory *sensitivity* (signal strength) or response *criterion* (willingness to report)? *Independent.*
  2.  **Temporal Profile:** Does the influence occur *online* (during the perceptual moment) or accumulate over *development/learning*? *Independent.*
  3.  **Mechanism:** Does cognition alter *sensory processing* itself or only *sampling* (eye movements, attention, fixation)? *Independent, though often correlated with Locus.*
  4.  **Content Level:** Are the affected properties *low-level* (hue, orientation) or *high-level* (kind, causality, affordance)? *Independent, but High-Level claims are more common.*
  5.  **Epistemic Consequence:** Does the influence *degrade* justificatory force (bias) or *enhance* it (expertise)? *Independent.*
  6.  **Boundary Metaphysics:** Is there a sharp fact of the matter where perception stops and cognition begins, or is the boundary *continuous/nonexistent*? *Independent.*

  ***

  ### WORKSHOP INSTRUMENT: CASE JUDGMENTS

  **Instructions:** Read each case and select the option that best matches your judgment. Do not consult others.

  **1. Color Categories.** Two groups distinguish green-cyan pairs. One group has separate words for green and cyan; the other does not. The two-word group is faster at distinguishing cross-category pairs. When asked to repeat a sentence aloud (verbal shadowing) while viewing the colors, the speed advantage disappears.
  *When the advantage disappears under shadowing, what is true of the colors?*
  A) They look identical to how they looked to the one-word group.
  B) They look distinct, but the subject cannot access the difference.
  C) They look identical, but the subject's selection habits differ.

  **2. Chess Expertise.** An expert and a novice view a chessboard for 200 milliseconds. Both accurately report square occupancy and shade matching. The expert accurately reports which pieces attack which; the novice does not.
  *Regarding the attack relations, the expert:*
  A) Saw the relations directly in the arrangement.
  B) Inferred the relations too quickly to report the inference.
  C) Guessed based on typical board patterns.

  **3. Spider Phobia.** A phobic participant and a control view a spider behind glass. Both estimate its length against a ruler. The phobic participant's estimate is systematically larger.
  *The most likely explanation is that the spider:*
  A) Visually appeared larger to the phobic participant.
  B) Appeared the same size, but felt more threatening.
  C) Appeared the same size, but the estimate was a guess.

  **4. Word Detection.** Two groups detect faint food words. Group A says "food word" more often. Three data patterns are possible: (i) Excess matches excess on blank trials; (ii) Excess is confined to trials with real words; (iii) Excess disappears in forced-choice tasks.
  *Which pattern confirms the groups visually experienced the word differently?*
  A) Pattern (i)
  B) Pattern (ii)
  C) Pattern (iii)

  **5. Radiologists.** Two radiologists view an ambiguous shadow. One knows the patient has a family history; the shadow presents itself to her as a nodule. Her colleague reports only a smudge.
  *Regarding the shadow's appearance:*
  A) It literally looked different to each radiologist.
  B) It looked the same, but was interpreted differently.
  C) It looked the same, but the reporting threshold differed.

  **6. Hill Steepness.** Participants wearing a heavy backpack estimate a hill as steeper than those without packs.
  *The hill:*
  A) Visually sloped more sharply to the loaded participants.
  B) Looked the same, but seemed harder to climb.
  C) Looked the same, but estimates were adjusted for effort.

  **7. Reachability.** Participants judge whether a target is reachable. When holding a tool, they judge farther targets as reachable.
  *The target:*
  A) Appeared closer when holding the tool.
  B) Appeared the same distance, but action possibilities changed.
  C) Appeared the same distance, but judgment criteria shifted.

  **8. Memory Color.** Participants match the color of a familiar object (e.g., a banana) from memory. They select a more saturated yellow than physically present.
  *This error arises because:*
  A) The memory image itself is saturated.
  B) The object is perceived as saturated during encoding.
  C) The report is biased by knowledge of the object's typical color.

  **9. Ventriloquism.** A sound comes from a speaker, but a puppet's mouth moves nearby. The sound seems to come from the puppet.
  *The auditory location:*
  A) Was perceptually shifted toward the visual cue.
  B) Was ambiguous, and the visual cue resolved the judgment.
  C) Was accurate, but the report followed the visual cue.

  ***

  ### 3. The Scoring Key

  **1. The Strict Encapsulator**
  *Pattern:* Predominantly A/C options denying visual change (e.g., Q1-A, Q3-C, Q5-C).
  *Position:* Cognitive states never alter the phenomenal character of sensory experience.
  *Awkward Commitment:* Must explain away strong subjective reports of difference as universal illusion.

  **2. The Attentional Gatekeeper**
  *Pattern:* Denies processing change but accepts sampling change (e.g., Q1-C, Q7-B).
  *Position:* Cognition affects what is sampled, not how sensory input is processed.
  *Awkward Commitment:* Must classify attentional modulation as non-perceptual despite spatial effects.

  **3. The Developmental Realist**
  *Pattern:* Accepts expertise effects but denies online effects (e.g., Q2-A, Q6-C).
  *Position:* Penetration occurs only through long-term learning, not immediate belief.
  *Awkward Commitment:* Must draw a sharp line between learned expectations and immediate primes.

  **4. The Phenomenal Penetrabilist**
  *Pattern:* Accepts online visual change (e.g., Q1-B, Q3-A, Q5-A).
  *Position:* Beliefs and expectations can directly alter the sensory phenomenology of the moment.
  *Awkward Commitment:* Must explain how perception remains a reliable guide to the world if biased by belief.

  **5. The Epistemic Pessimist**
  *Pattern:* Accepts penetration but claims it degrades justification (e.g., Q5-A + "bias").
  *Position:* Cognitively altered experience loses its power to justify beliefs about the world.
  *Awkward Commitment:* Must deny that expertise (e.g., radiology) improves justificatory standing.

  **6. The Epistemic Optimist**
  *Pattern:* Accepts penetration as enhancing justification (e.g., Q2-A + "expertise").
  *Position:* Cognitive influence improves experience by making relevant features salient.
  *Awkward Commitment:* Must explain why phobia-induced distortion isn't also epistemically useful.

  **7. The Boundary Dissolver**
  *Pattern:* Rejects the distinction between seeing and judging (e.g., Q9-B/C hybrid).
  *Position:* The question assumes a false dichotomy between perception and cognition.
  *Awkward Commitment:* Makes it difficult to define what counts as a perceptual error versus a conceptual one.

  ***

  ### Analysis for Facilitators

  **Empty Cells**
  Three combinations of axes remain unoccupied in current literature.
  1.  **Online + Low-Level + Processing:** Logically available but rarely defended. Most agree low-level features (hue, orientation) are encapsulated. This cell is empty because the empirical evidence for low-level penetration is negligible compared to high-level.
  2.  **Sampling + Enhanced Justification:** Unattractive. If cognition only changes where we look (sampling), it is usually framed as a strategic choice rather than an perceptual enhancement. Defenders of expertise usually argue for processing changes, not just sampling.
  3.  **No Boundary + Strict Encapsulator:** Incoherent. If there is no fact of the matter where perception ends, one cannot claim perception is strictly encapsulated from cognition, as the terms lack distinct referents.

  **Indistinguishable Leaves**
  Your nine questions cannot separate **The Strict Encapsulator** from **The Attentional Gatekeeper**. Both deny that sensory *processing* changes; they differ only on whether attention counts as perceptual. To separate them, you would need a case where attention is held constant (e.g., fixed fixation) yet performance differs.
  Similarly, **The Developmental Realist** and **The Phenomenal Penetrabilist** are indistinguishable if your cases only test online effects. You would need a longitudinal case showing immediate belief changes versus trained expertise effects to pry them apart.

  **A Note to the Host**
  Question 4 most cleanly decides between your position and your collaborator's. Your disagreement centers on whether effects are changes in sensitivity (experience) or criterion (willingness to report). Question 4 forces a choice on which signal detection pattern constitutes evidence for "seeing." Your collaborator must choose Pattern (ii) (sensitivity); you must choose Pattern (i) or (iii) (criterion/forcing). The other questions allow both of you to agree on the data while disagreeing on the description; Question 4 forces a disagreement on the data's meaning.
