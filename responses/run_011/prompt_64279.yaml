answer: |-
  This is a sophisticated historiographical problem. You have correctly identified a mechanism that operates *within* Whig history and *alongside* Mertonian sociology, but is distinct from both. You are describing the *ontological smoothing* required to make a "multiple" count as a multiple in the first place.

  Here is an analysis of the existing terminology, a proposal for a new conceptual tool, and a substantive account of discovery individuation.

  ### 1. Existing Terminology: The Neighborhood and the Gap

  You are correct that the standard lexicon does not contain a single, sharp term for this specific mechanism. Here is where the existing terms fit and where they break down:

  *   **Merton's "Multiples":** As you noted, this names the phenomenon to be explained (independent discovery), not the historiographical distortion. Merton assumes the identity of the discovery is pre-theoretically given; your point is that the identity is the *result* of the historiography, not its premise.
  *   **Obliteration by Incorporation (OBI):** This is the closest neighbor. OBI occurs when a concept becomes so standard that its origin is forgotten. Your phenomenon is distinct: the origins are *not* forgotten (Newton and Leibniz are both named), but the *difference* between them is forgotten. It is not the erasure of the source, but the erasure of the *discontinuity* between sources. One might call this **"Incorporation without Obliteration,"** but that is descriptive, not a technical term.
  *   **Whig Historiography / Presentism:** These are the genus, not the species. Whig history is the judgment of the past by present standards. Your pattern is a specific *move* within Whig history: the **retroactive alignment of distinct conceptual structures** to fit a modern category.
  *   **Kuhn's "Discovery as Process":** In *The Structure of Scientific Revolutions* (Chapter VI), Kuhn argues that discovery is not a punctual event but an extended process of conceptual realignment. He uses the case of Oxygen explicitly. However, Kuhn uses this to attack the idea of "discovery" itself, not specifically to analyze the construction of "simultaneity."
  *   **Latour's "Black Boxing":** In *Science in Action*, Latour describes how controversies are settled by turning the inside of a device or theory into a black box. Your phenomenon is the black-boxing of the *relationship* between two competitors. Once the box is closed, the internal differences (fluxions vs. differentials) are hidden, and the output (Calculus) is treated as uniform.

  **Verdict:** There is no canonical term. The phrase **"Retrospective Conflation"** appears occasionally in history of science literature, but it is used loosely to describe any anachronism. It lacks the specific methodological definition you require to distinguish genuine multiples from manufactured ones.

  ### 2. Coining a Term: "Retrospective Homogenization"

  I propose the term **"Retrospective Homogenization"** (or the **"Homogenization of Multiples"**) to name this specific pattern.

  **Definition:**
  Retrospective Homogenization is the historiographical operation whereby two or more historically distinct intellectual products, produced independently within a proximate timeframe, are recategorized as token-identical instances of a later-established conceptual type. This operation suppresses contemporaneous conceptual divergences to construct a narrative of inevitability.

  **Criteria for Qualification (The Inclusion Test):**
  For a case to qualify as a product of Retrospective Homogenization, four conditions must be met:
  1.  **Independent Origin:** The investigators did not collaborate or copy (satisfying the basic Mertonian condition).
  2.  **Conceptual Divergence:** At the time of production, the investigators employed distinct ontologies, notations, or inferential rules (e.g., phlogiston vs. oxidation; fluxions vs. differentials).
  3.  **Subsequent Subsumption:** A later theoretical framework emerges that can translate both prior products into a single language, rendering the prior differences intelligible only as "notation" or "partial understanding" rather than fundamental disagreement.
  4.  **Inevitability Function:** The historiography explicitly uses the "simultaneity" of these products to argue that the result was determined by the state of the field rather than individual agency.

  **Criteria for Disqualification (The Exclusion Test):**
  A case is *not* Retrospective Homogenization if:
  1.  **Explicit Agreement:** The investigators explicitly recognized each other's work as identical *at the time*, using shared criteria of validity (e.g., two astronomers calculating the same orbit using the same Newtonian mechanics).
  2.  **Pure Priority Dispute:** If the dispute is solely about *who* did it first, but both parties agree on *what* "it" is conceptually, this is a standard priority dispute, not homogenization.
  3.  **Convergent Realism:** If the divergence was purely heuristic (different paths) but the propositional content was logically equivalent *within the conceptual resources available at the time*, it is a genuine multiple.

  **Distinguishing Genuine from Manufactured (The Methodological Tool):**
  The hard part, as you noted, is that partisans in a priority dispute will always claim the rival's result is "not the same." To distinguish a genuine multiple from a homogenized one, I propose the **"Inferential Role Test."**

  *   **The Test:** Can Investigator A derive Investigator B's specific conclusions using *only* the conceptual tools and ontological commitments available to A *at the time*, without importing the later unifying framework?
  *   **Application:**
      *   *Calculus:* Could Newton derive Leibniz's algorithmic rules using only fluxions without adopting the differential notation's logic? Initially, no; they were seen as competing metaphysics of the infinitesimal. The unification came later. **(Homogenized)**
      *   *Oxygen:* Could Priestley predict Lavoisier's quantitative conservation of mass using phlogiston theory? No, because phlogiston theory did not require mass conservation in the same way. **(Homogenized)**
      *   *Genuine Multiple:* If two astronomers independently calculate the position of Neptune using Le Verrier's equations, they are using the same inferential machinery. The result is identical within the contemporary framework. **(Genuine Multiple)**

  ### 3. The Individuation of Discovery and the Inevitability Inference

  This leads to the substantive philosophical question: What individuates a discovery?

  **The Problem of Reference vs. Sense:**
  A realist might argue (using Kripke/Putnam) that Priestley and Lavoisier both discovered *Oxygen* because they both referred to the same natural kind ($O_2$), regardless of their descriptions. If reference individuates discovery, then the multiple is real, and the inevitability argument holds.

  However, your examples (and Kuhn) suggest that reference is insufficient. If individuation were purely referential, almost all scientific change would be continuous, and revolutions would be impossible.

  **The Proposal: Inferential Role Individuation**
  A discovery is individuated by its **Inferential Role** within its native conceptual framework. A discovery is not just a pointer to a thing; it is a node in a network of reasoning.
  *   **Content:** What is asserted.
  *   **Framework:** What licenses the assertion.
  *   **Uptake:** What further assertions the discovery licenses.

  If the *uptake* differs, the discovery differs. Priestley's "dephlogisticated air" licenses inferences about combustion that Lavoisier's "oxygen" does not (and vice versa regarding mass). Therefore, they are not the same discovery. They are distinct solutions to a shared problem space.

  **Implications for Inevitability:**
  The pattern of Retrospective Homogenization significantly undermines the standard inference from multiples to inevitability, but it does not destroy it entirely. It forces a shift in *what* is considered inevitable.

  1.  **The Weak Inevitability Thesis (Undermined):** The claim that "The Specific Truth ($T$) was waiting to be found." If $T$ is defined by its modern inferential role, then $T$ did not exist for Newton or Priestley. They did not find $T$; they found $T'$ and $T''$, which we later mapped to $T$. The specific truth was not inevitable because it was not yet constituted.
  2.  **The Strong Problem Thesis (Preserved):** The claim that "The Problem Space ($P$) was ripe for resolution." The field had reached a state where *some* resolution was necessary. The *pressure* was inevitable, even if the *product* was not.

  **Conclusion on the Inference:**
  Retrospective Homogenization reveals that "simultaneous discovery" is often evidence not of the inevitability of a *result*, but of the inevitability of a *crisis*. The field had exhausted its previous resources, and multiple actors were compelled to generate new ones. That they generated *different* ones (which we later homogenized) suggests that the path forward was *not* uniquely determined.

  Therefore, the existence of a "multiple" is actually evidence *against* the inevitability of the specific conceptual outcome, provided we account for the homogenization. It shows that the "air" was pregnant with *change*, but not with *the* change.

  ### Summary of the Conceptual Tool

  *   **Term:** Retrospective Homogenization.
  *   **Function:** To identify cases where the identity of simultaneous discoveries is an artifact of later theoretical consolidation rather than historical fact.
  *   **Test:** The Inferential Role Test (could the agents validate each other's claims without adopting the later framework?).
  *   **Historiographical Consequence:** Shifts the burden of proof. The default assumption should not be that multiples prove inevitability; rather, multiples should be presumed distinct until a contemporaneous conceptual identity is demonstrated.
  *   **Philosophical Consequence:** Discovery is individuated by inferential role, not reference. Inevitability applies to the necessity of conceptual change, not the specificity of the resulting concept.

  This tool allows you to parse the "Calculus," "Evolution," and "Oxygen" cases not as proofs of inevitability, but as proofs of **conceptual plasticity** during periods of high scientific pressure. The "same" result was not found twice; different results were found once, and then made to look the same.
