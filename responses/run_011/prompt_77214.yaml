answer: |-
  The projector hummed, casting a pale blue rectangle onto the concrete wall of the conference room. Elena clicked the clicker. The slide changed to a simple graph: a steep downward curve plunging toward zero.

  "This isn't about malice," Elena said, her voice flat, rehearsed. She tapped the screen. "This is the Veridian Protocol. We all have the lab notes. We all have the precursor chemicals. Any one of you can mix the additive tonight. It strengthens concrete by four hundred percent. It solves the infrastructure crisis in the Global South within a decade."

  She clicked again. The graph now showed forty distinct dots along the X-axis.

  "There are forty organizations in this room. Civil engineering NGOs, state development bureaus, humanitarian coalitions. Every single one of you is staffed by experts. Every single one of you is ethical. You want to save lives."

  Marcus, sitting near the back, shifted in his chair. He ran the BridgeLight Consortium. They built schools in flood zones. "We are," he said. "So what's the problem?"

  "The problem is the groundwater reaction," Elena said. "Used in isolation, Veridian leaches vanadium into the aquifer over twenty years. Used in a coordinated regional grid with the neutralizing agent, it's inert. But the neutralizer requires regional deployment. If thirty-nine of us coordinate and one group decides to act alone to save their specific project... the grid fails. The water turns toxic."

  She let that hang. The air conditioning rattled.

  "Look at the curve," Elena continued. "Let's assume each organization here is ninety-five percent likely to make the right call. That's generous. That assumes perfect information and no pressure from donors or local governments. If forty independent groups make independent decisions based on their own local judgment, the probability of *all* of us being correct is zero point nine-five to the power of forty."

  She typed the equation into the calculator on the podium. The result flashed: **0.128**.

  "Twelve percent," Elena said. "That is the chance we save the water. Eighty-eight percent is the chance that someone, somewhere, decides their emergency is important enough to bypass the neutralizer. And because the geology is shared, everyone pays for it. Competence doesn't scale linearly. Risk compounds."

  Marcus stood up. He was a big man, worn down by travel and grant applications. "You're asking us to wait. While the bridges fall. While the schools wash away."

  "I'm asking you to bind yourselves," Elena said. "I'm proposing the Covenant. No organization deploys Veridian without a five-key consensus from the others. We raise the coordination cost. We make it impossible to act unilaterally."

  "That's bureaucracy," Marcus snapped. "That's veto power for people who don't see the mud in my yards."

  "It's friction," Elena corrected. "Friction is the only thing keeping us from boiling the pot because we're all trying to stir it faster."

  The debate lasted six hours. It wasn't a fight between good and evil. It was a fight between safety and speed, between the collective future and the immediate present. Every person in that room wanted to help. That was the terror of it. If there were villains, Elena could hunt them. Instead, she was looking at forty mirrors, each reflecting a sincere desire to do good, each capable of accidentally triggering a disaster.

  When the vote was called, thirty-eight hands went up. Marcus kept his hands on the table. He didn't vote no; he just abstained. He didn't have to vote no. The Covenant required unanimity to pass, but Elena had leveraged public pressure. The media was watching. To vote against safety was to vote for poison. Marcus knew he couldn't win the press war.

  He signed the Covenant.

  ***

  Three years later, Elena sat on a park bench overlooking the reservoir. The water was clear. The testing stations along the rim blinked green. No vanadium spikes. The Veridian concrete was being used in major urban centers, carefully metered, neutralized, monitored. The catastrophe had been averted.

  Her phone buzzed. A message from an unknown number. She knew who it was.

  *Meet me at the old site.*

  She drove an hour north, to the river valley where BridgeLight had planned the regional hub. The road was unpaved, muddy. She found Marcus standing by the riverbank. There was no bridge. Just a makeshift ferry cable stretched across the murky water, rusted and groaning in the wind.

  "You stopped us," Marcus said. He didn't look at her. He was watching a group of children wading through the shallows to get to the school bus on the other side. Their uniforms were soaked.

  "The water is safe, Marcus," Elena said softly. "The aquifer is clean. We modeled the twenty-year projection. No toxicity."

  "Tell that to the parents who carry their kids across during the rains," Marcus said. He turned to face her. He looked older, the lines around his eyes deeper. "We had the materials. We had the engineers. We could have had this span done in four months. The Covenant took eighteen months to approve the neutralizer distribution plan. Then the key-holders argued over liability clauses."

  "It prevented a regional poisoning event," Elena said. She heard how hollow it sounded.

  "It prevented *my* project," Marcus said. "And not just mine. There are three other valleys. We couldn't get five keys. One organization in Europe didn't respond to emails for six weeks. Another wanted changes to the reporting structure. We couldn't act. We couldn't save people because we weren't allowed to be reckless."

  "You weren't being reckless. You were being independent."

  "Same thing," Marcus said. He kicked a stone into the river. "Last monsoon, the ferry cable snapped. Two people drowned. They aren't statistics on your slide, Elena. They're names. And they died because forty good people decided they couldn't trust each other to hold the wheel."

  Elena looked at the water. It was pristine. Chemically perfect. A testament to successful coordination. She had done her job. She had raised the cost of action high enough that no one could jump the gun. She had taxed independence to protect the commons.

  "We can revisit the protocol," Elena said. "Streamline the key exchange."

  "It's not the protocol," Marcus said. "It's the principle. You proved that if you give good people the power to save the world, they'll break it by trying too hard. So you took the power away. You won. Congratulations."

  He walked back toward the ferry landing to help a woman lift a stroller onto the raft. He didn't look back.

  Elena stayed on the bank. She pulled out her tablet and opened the dashboard. All systems green. Risk probability: negligible. The world was safe from the Veridian leak. The arithmetic held. The curve had been flattened.

  She watched the ferry drag itself across the current, slow and straining. It would take ten minutes to cross what a bridge would take ten seconds to span. Over a year, that was hundreds of hours lost. Thousands of hours. Opportunities missed. Medicine delayed.

  She had saved the water. She had sacrificed the speed. She had traded certain deaths in the present for probabilistic safety in the future. The math said she was right. The math always said she was right.

  A child on the other side waved at her. Elena waved back. She looked at the green lights on her screen, then at the rusted cable cutting into the river. She closed the tablet. The silence of the valley was heavy, broken only by the creak of the pulley and the flow of the clean, safe water. She wasn't sure if she had saved them or just preserved them for a slower decline. She stood up, got in her car, and drove back to the city to maintain the lockbox.
