prompt: |-
  Every year our admissions committee proposes a new ordeal for applicants — a non-refundable fee, a trial residency, a public confession of some past error — and I have grown suspicious of my own enthusiasm for these. I direct a small residential fellowship, roughly thirty places a year from several hundred applications, and "it's a costly signal, so it must select for the right people" has become the committee's substitute for an argument. Write a decision procedure we could run on any proposed costly requirement before adopting it: the questions to ask in order, what counts as a sufficient answer to each, the point at which the procedure terminates in rejection, and the points where it hands the decision back to us because the question is one of values rather than facts.

  Ground it in what signaling theory can actually hand a non-specialist. I want the differential-cost condition made usable — a requirement is informative only if it costs the applicants we want less than the applicants we don't — along with the difference between an unfakeable index and a handicap that can simply be bought, what makes unenforced talk credible when interests coincide, what a receiver's response does to a signal's value across successive cohorts, the gap between evidence of a trait and possession of it, and the possibility that the candidates we most want are the ones least inclined to signal at all. Flag which steps are judgment calls dressed as arithmetic, and be explicit about what the procedure cannot settle — in particular, what to do when a cost works not by revealing a type but by changing the person who pays it.

  Then run it on three proposals: a $500 non-refundable application fee; a required public essay describing something the applicant got badly wrong; and an unpaid two-week trial residency. At least one should come out "no" despite the committee's fondness for it, and I want the reasoning shown rather than the verdict alone.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Role:** Advisor to a fellowship admissions committee director.
      *   **Task:** Create a decision procedure (algorithm/checklist) for evaluating proposed "costly signals" (admission requirements).
      *   **Constraints & Requirements:**
          *   Grounded in signaling theory (accessible to non-specialists).
          *   Must include the "differential-cost condition" (costs less for desired types than undesired types).
          *   Distinguish between unfakeable indices vs. buyable handicaps.
          *   Address cheap talk vs. credible signals (interest alignment).
          *   Consider receiver response effects over cohorts (Goodhart's Law/adaptation).
          *   Distinguish evidence of a trait vs. possession of it.
          *   Address the risk of screening out the *best* candidates (who won't signal).
          *   Flag judgment calls disguised as arithmetic.
          *   Explicitly state what the procedure *cannot* settle (especially transformative costs).
          *   **Application:** Run the procedure on three specific proposals:
              1.  $500 non-refundable fee.
              2.  Public essay on a past error.
              3.  Unpaid two-week trial residency.
          *   **Outcome:** At least one must be rejected ("no") despite committee fondness, with shown reasoning.
      *   **Tone:** Analytical, rigorous, slightly skeptical (matching the user's suspicion), practical.

  2.  **Theoretical Foundation (Signaling Theory for Non-Specialists):**

      *   *Spence's Job Market Signaling:* Education doesn't necessarily make you productive; it signals you are productive because it's easier for productive people to get educated.
      *   *Differential Cost:* The core mechanism. $C_{good} < C_{bad}$. If the cost is the same for everyone, it's just a tax, not a signal.
      *   *Index vs. Signal:* An index is unchangeable (height). A signal is chosen (degree). A handicap is a signal that can be bought (wealth).
      *   *Cheap Talk:* Costless communication. Only credible if interests align perfectly.
      *   *Pooling vs. Separating Equilibrium:* Does the requirement separate the types, or does everyone just pay it (pooling)?
      *   *Lucas Critique/Goodhart's Law:* Once a measure becomes a target, it ceases to be a good measure. Candidates adapt.
      *   *Adverse Selection:* If the cost is too high or misaligned, the best candidates (who have better outside options or higher integrity thresholds) drop out.

  3.  **Drafting the Decision Procedure:**

      *   *Structure:* Sequential steps. Pass/Fail/Defer.
      *   *Step 1: The Differential Cost Test.* Is the burden actually heavier for the "bad" candidates?
      *   *Step 2: The Liquidity/Wealth Test.* Can money bypass the trait? (Distinguish signal from handicap).
      *   *Step 3: The Adaptation Test.* Will candidates game this within 3 cycles?
      *   *Step 4: The Adverse Selection Test.* Are we scaring away the specific people we want most?
      *   *Step 5: The Transformative vs. Revelatory Test.* Does this change them or show who they are? (The "cannot settle" clause).
      *   *Step 6: The Ethical/Value Boundary.* Where does math end and morality begin?

  4.  **Refining the Steps (incorporating specific prompts):**

      *   *Differential Cost:* Make it concrete. "Is the pain asymmetric?"
      *   *Index vs. Handicap:* "Can this be bought?"
      *   *Receiver Response:* "What happens in Year 3?"
      *   *Evidence vs. Possession:* "Does doing this prove they *are* it, or just that they *did* it?"
      *   *Judgment Calls:* Explicitly label where we are guessing probabilities.

  5.  **Running the Procedure on the Three Proposals:**

      *   **Proposal 1: $500 Non-refundable Fee.**
          *   *Differential Cost:* Money is fungible. A bad candidate with rich parents pays easily. A good candidate with debt struggles. Cost is likely *higher* for the good candidate (opportunity cost/liquidity constraint).
          *   *Verdict:* Likely Fail. It's a wealth filter, not a merit/talent filter.
      *   **Proposal 2: Public Essay on Past Error.**
          *   *Differential Cost:* Harder for a narcissist or someone with something truly disqualifying (criminal/ethical) to write honestly.
          *   *Adaptation:* Can be gamed ("I worked too hard"). Needs strict grading.
          *   *Adverse Selection:* Might scare off privacy-conscious high performers.
          *   *Verdict:* Conditional Pass or Fail depending on enforcement. Let's make it a "Pass with caveats" to contrast with the fee. Or better, make it the "Yes" to contrast with the Residency. Let's aim for the Fee to be the hard "No" based on signaling theory (wealth vs. talent). Actually, the prompt asks for *at least one* "no" despite fondness. The Committee likes *all* of them. I need to be hard on one. The Fee is the easiest to debunk theoretically. The Residency is the most "costly." Let's make the Residency the "No" due to adverse selection (best candidates have jobs) or the Fee the "No" due to wealth bias.
          *   *Decision:* The Fee is the clearest signaling failure (liquidity constraint inversely correlated with need). The Residency is a strong signal but high adverse selection risk. The Essay is "cheap talk" unless verified.
          *   *Strategy:* I will reject the **$500 Fee** decisively based on the Differential Cost condition (it costs the poor/good more than the rich/bad). I will reject the **Trial Residency** based on Adverse Selection (best candidates can't afford 2 weeks unpaid). I will give a conditional pass to the **Essay** but highlight the "gaming" risk.
          *   *Wait, prompt says:* "At least one should come out 'no' despite the committee's fondness for it." I can do two "nos" if justified. Let's make the Fee a hard No (Signaling Failure) and the Residency a hard No (Adverse Selection). The Essay can be the "Maybe/Value Call".
          *   *Refinement:* Let's make the **Residency** the primary "No" because it's the most "ordeal-like" and the committee is most proud of it, but it fails the "best candidates drop out" test. The Fee is obviously bad, but the Residency feels "noble." Actually, the Fee is the classic "costly signal" example. Let's stick to the theory.
          *   *Re-evaluating:* The prompt asks to run it on three. I should show the reasoning for all. I will conclude "No" on the Fee (Wealth Signal != Talent Signal) and "No" on the Residency (Adverse Selection). The Essay gets a "Proceed with Caution" (Value Judgment).
          *   *Wait, looking at the prompt again:* "At least one should come out 'no'". Okay. I'll make the **$500 Fee** the definitive "No" because it violates the core differential-cost condition regarding *talent* vs *wealth*. I'll make the **Residency** a "No" based on Adverse Selection. I'll make the **Essay** a "Conditional Yes" but highlight the "gaming" risk.
          *   *Actually, let's look at the "Transformative" clause.* The prompt asks to be explicit about what the procedure cannot settle, specifically "when a cost works not by revealing a type but by changing the person." The Residency fits this best. It *trains* them. So the procedure might flag it as "Undecidable by Signal Theory."
          *   *Final Plan:*
              1.  Fee: **Reject** (Fails Differential Cost/Wealth Confound).
              2.  Essay: **Conditional Pass** (Fails Unfakeable Index, relies on verification).
              3.  Residency: **Reject/Undecidable** (Fails Adverse Selection & is Transformative not Revelatory).
              *   I need to ensure at least one is a clear "No" despite fondness. The Committee loves "ordeals." The Residency is the ultimate ordeal. I will argue against the Residency strongly.

  6.  **Writing the Content - Section by Section:**

      *   **Introduction:** Acknowledge the director's suspicion. Validate that "costly signal" is often a buzzword for "barrier."
      *   **The Procedure:** Define the steps clearly. Use the terminology requested (differential-cost, index vs. handicap, etc.).
      *   **The "Cannot Settle" Clause:** Explicitly handle the transformative aspect.
      *   **The Application:** Run the three proposals through the steps.
      *   **Conclusion:** Summary recommendation.

  7.  **Self-Correction/Refinement during drafting:**

      *   *Check:* Did I explain "differential-cost" simply? *Correction:* Use the phrase "asymmetric burden."
      *   *Check:* Did I distinguish Index vs. Handicap? *Correction:* Ensure the Fee analysis highlights that money makes the signal fakeable.
      *   *Check:* Did I address Receiver Response? *Correction:* Include a step on "Cohort Adaptation" (Goodhart's Law).
      *   *Check:* Did I flag judgment calls? *Correction:* Use bold text or brackets to mark where human judgment overrides the math.
      *   *Check:* Is the tone right? *Correction:* Keep it professional but sharp. Avoid academic jargon where plain English works.

  8.  **Final Polish:** Ensure the distinction between "evidence of a trait" and "possession of it" is clear in the Essay section (writing about humility $\neq$ humility). Ensure the Residency analysis covers the "best candidates least inclined to signal" point (they have other options).

  *(Self-Correction on the Residency Verdict)*: The prompt asks for a decision procedure that terminates in rejection *or* hands back on values. The Residency is transformative. The procedure should flag this as "Out of Scope for Signaling Theory." But for the sake of a decision, if it screens out the best talent, it's a bad *selection* tool, even if it's a good *training* tool. I will recommend rejection as a *selection* mechanism.

  Let's finalize the "No" target. The $500 fee is the most theoretically unsound as a signal of *merit*. It signals *liquidity*. I will make that the hard "No". The Residency is a "No" on adverse selection grounds. The Essay is a "Maybe" on value grounds. I will focus the "No" reasoning on the Fee and Residency.

  Wait, the prompt says "At least one should come out 'no'". I can do more. I'll do two "Nos" to be thorough, as the committee seems too fond of ordeals.

