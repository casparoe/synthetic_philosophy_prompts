answer: |-
  ### The Costly Signal Decision Protocol

  You are right to be suspicious. In signaling theory, a "costly signal" is only useful if it creates a **separating equilibrium**—meaning it sorts applicants into distinct groups based on the trait you care about. If the cost is the same for everyone, it is merely a tax. If the cost is lower for the wrong people, it is a filter for the wrong traits.

  Below is a decision procedure designed to strip the jargon from the theory and leave you with a functional audit. It consists of six sequential gates. If a proposal fails any gate marked **[TERMINATE]**, the requirement must be rejected as a selection mechanism. If it reaches a gate marked **[VALUE JUDGMENT]**, the procedure halts and returns the decision to the committee, explicitly noting that signaling theory can no longer guide you.

  ---

  #### Step 1: The Differential-Cost Condition
  **Question:** Is the burden of this requirement asymmetrically heavier for applicants lacking the trait we seek than for those possessing it?
  *   **The Theory:** For a signal to be informative, the cost ($C$) must satisfy $C_{\text{undesired}} > C_{\text{desired}}$. If the cost is identical, everyone pays it (pooling), and you learn nothing. If the cost is higher for the *desired* candidate, you are actively filtering them out.
  *   **Sufficient Answer:** A plausible mechanism explaining why a "bad" candidate finds this objectively harder, riskier, or more painful than a "good" candidate, *independent of wealth*.
  *   **Failure Condition:** If the cost is purely financial or time-based without a correlation to the specific trait (e.g., talent, integrity), terminate.
  *   **Status:** **[TERMINATE]** if failed.

  #### Step 2: The Index vs. Handicap Test
  **Question:** Can this signal be purchased or faked without possessing the underlying trait?
  *   **The Theory:** Distinguish between an **Index** (unfakeable, e.g., height), a **Signal** (costly choice, e.g., degree), and a **Handicap** (costly but buyable, e.g., a peacock's tail funded by excess calories). You want a Signal that approximates an Index. You do not want a Handicap that proxies for wealth or privilege.
  *   **Sufficient Answer:** Evidence that resources (money, connections, coaching) cannot easily bypass the difficulty of the requirement.
  *   **Failure Condition:** If an applicant can hire someone to do it, or pay to mitigate the cost without demonstrating the trait, terminate.
  *   **Status:** **[TERMINATE]** if failed.

  #### Step 3: The Adaptation Horizon
  **Question:** Will this signal remain informative after three cohorts?
  *   **The Theory:** Receivers (you) react to signals, which changes the incentives for Senders (applicants). This is the Lucas Critique applied to admissions. If a signal works, applicants will optimize for the signal rather than the trait (Goodhart's Law).
  *   **Sufficient Answer:** A plan for how the requirement changes or is re-evaluated to prevent "signal inflation" (where everyone learns to pass the test without having the trait).
  *   **Failure Condition:** If the requirement is static and easily gamable (e.g., a specific essay prompt), flag as high risk.
  *   **Status:** **[WARNING]** (Proceed only if mitigation exists).

  #### Step 4: The Adverse Selection Check
  **Question:** Are the candidates we most want the ones least likely to submit to this?
  *   **The Theory:** High-quality candidates often have better outside options (higher opportunity cost) or higher integrity thresholds (unwillingness to perform undignified acts). If your signal is too costly or culturally specific, you induce **adverse selection**: the "lemons" stay, the "peaches" leave.
  *   **Sufficient Answer:** Data or strong qualitative reasoning showing that your top-tier targets (e.g., employed professionals, high-integrity outliers) can afford this cost without dropping out.
  *   **Failure Condition:** If the requirement disproportionately burdens those with high opportunity costs or strong privacy boundaries, terminate.
  *   **Status:** **[TERMINATE]** if failed.

  #### Step 5: Evidence vs. Possession
  **Question:** Does completing this requirement prove they *have* the trait, or only that they *did* the task?
  *   **The Theory:** There is a gap between the map and the territory. Writing about resilience is not resilience. Paying a fee is not commitment.
  *   **Sufficient Answer:** A direct causal link between the action and the trait.
  *   **Failure Condition:** If the link is correlational at best, flag as weak evidence.
  *   **Status:** **[VALUE JUDGMENT]** (Committee must decide if weak evidence is acceptable).

  #### Step 6: The Transformative Boundary
  **Question:** Is this cost meant to reveal the person, or to change them?
  *   **The Theory:** Signaling theory assumes the trait is pre-existing. If the ordeal is designed to *build* character (transformative) rather than *show* it (revelatory), signaling theory cannot validate it.
  *   **Sufficient Answer:** Acknowledgement that this is a pedagogical or hazing tool, not a selection tool.
  *   **Failure Condition:** If the committee claims it is for selection but intends it for transformation, the procedure cannot settle this.
  *   **Status:** **[VALUE JUDGMENT]** (Return to committee: "This is not selection; this is training. Decide if you have the right to train applicants.")

  ---

  ### What This Procedure Cannot Settle

  Before applying the protocol, note two critical blind spots:

  1.  **The Transformative Gap:** If a requirement (like the trial residency) is intended to *forge* the right kind of fellow rather than *find* them, signaling theory is silent. It treats the cost as a filter, not a forge. If your goal is transformation, you are no longer doing admissions; you are doing indoctrination. The procedure will flag this, but cannot tell you if it is ethical.
  2.  **The Judgment Calls:** Step 1 (Differential Cost) and Step 4 (Adverse Selection) look like arithmetic, but they are **judgment calls dressed as math**. You must estimate probabilities of dropout and cost burdens. There is no formula for "how much dignity is worth." The procedure forces you to make the guess explicit, but it cannot make the guess for you.

  ---

  ### Audit of Current Proposals

  Here is the protocol applied to your committee's three favorite ordeals.

  #### Proposal 1: $500 Non-Refundable Application Fee

  *   **Step 1 (Differential Cost):** **FAIL.**
      *   *Reasoning:* Does $500 cost a "bad" applicant more than a "good" one? No. It costs a *poor* applicant more than a *rich* one. Unless you have evidence that lack of wealth correlates perfectly with lack of fellowship potential, you are signaling liquidity, not talent. The cost is symmetric regarding merit, asymmetric regarding wealth.
  *   **Step 2 (Index vs. Handicap):** **FAIL.**
      *   *Reasoning:* This is a pure Handicap. It can be bought by parents, loans, or savings. It is easily faked by anyone with access to capital.
  *   **Step 4 (Adverse Selection):** **HIGH RISK.**
      *   *Reasoning:* High-potential candidates from non-wealthy backgrounds (often the most resilient and driven) are priced out. They have better risk-adjusted options than gambling $500 on a fellowship.
  *   **Verdict:** **REJECT.**
      *   *Committee Note:* You are calling this a "signal of commitment." Signaling theory identifies it as a "tax on poverty." It selects for cash on hand, not fitness for the fellowship.

  #### Proposal 2: Public Essay on a Past Error

  *   **Step 1 (Differential Cost):** **PASS (with caveats).**
      *   *Reasoning:* The "cost" here is reputational risk and vulnerability. A narcissist or someone hiding ethical violations finds this cost prohibitive. A humble, secure candidate finds it lower. The burden is asymmetric in the way you want.
  *   **Step 2 (Index vs. Handicap):** **WARNING.**
      *   *Reasoning:* This can be gamed. Applicants will write "humblebrags" (*"I worked too hard and burned out"*). It requires skilled readers to distinguish genuine vulnerability from performance.
  *   **Step 3 (Adaptation):** **WARNING.**
      *   *Reasoning:* Within three years, "failure essay" coaching will exist. Prompts must rotate, and rubrics must penalize clichés.
  *   **Step 5 (Evidence vs. Possession):** **VALUE JUDGMENT.**
      *   *Reasoning:* Writing about humility is not humility. It is evidence of *literacy about* humility. The committee must decide if the act of confession is enough proxy for the trait.
  *   **Verdict:** **CONDITIONAL ACCEPT.**
      *   *Committee Note:* This is the only proposal that functions as a signal rather than a tax. However, it requires rigorous grading to prevent "performative vulnerability." Do not treat it as unfakeable.

  #### Proposal 3: Unpaid Two-Week Trial Residency

  *   **Step 1 (Differential Cost):** **PASS.**
      *   *Reasoning:* Two weeks of unpaid labor is significantly costlier for someone who is not serious or confident in their fit than for someone who is.
  *   **Step 4 (Adverse Selection):** **FAIL.**
      *   *Reasoning:* This violates the Adverse Selection Check. The candidates you "most want" (employed professionals, caregivers, those with high opportunity costs) are the ones least able to afford two weeks of unpaid time. The candidates who *can* afford it are often those with safety nets (wealthy) or no other options (unemployed). You are filtering for privilege and desperation, not necessarily talent.
  *   **Step 6 (Transformative Boundary):** **VALUE JUDGMENT.**
      *   *Reasoning:* You likely argue this "tests fit." In reality, it *creates* fit through sunk cost fallacy and socialization. It changes the person. Signaling theory cannot validate this because the trait is not pre-existing; it is being manufactured during the trial.
  *   **Verdict:** **REJECT (as a selection tool).**
      *   *Committee Note:* The committee loves this because it feels like a "real test." But it is a **handicap** that screens out the busy and the poor. If you wish to keep it, reclassify it as a *training program* for those already admitted, not a gate for applicants. Using it as an ordeal selects for those who can afford to be unemployed.

  ### Summary Recommendation

  1.  **Drop the Fee.** It is theoretically incoherent as a merit signal. It signals wealth, nothing else.
  2.  **Drop the Residency as an Admissions Gate.** It induces adverse selection against your strongest candidates (who have jobs) and functions as a transformative hazing ritual rather than a revelatory signal.
  3.  **Keep the Essay, but Audit it.** It is the only mechanism that approaches a true differential cost based on psychological traits (humility/integrity) rather than economic ones. However, acknowledge that it is a proxy, not proof.

  **Final Warning:** The committee's enthusiasm for "costly signals" is likely a rationalization for exclusion. If the cost does not differentially burden the *unqualified*, it is not a signal; it is a barrier. Ensure your barriers are gates, not walls.
