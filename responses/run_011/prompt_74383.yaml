  9.  **Final Polish:** Ensure the distinction between *descriptive* (market) and *prescriptive* (ethical) approaches is clear in the "Contested" section. Make sure the "Collision" section explicitly validates the user's suspicion.

  *(Self-Correction on Time Consistency with Declining Rates)*: A declining discount rate schedule *can* be time-consistent if it is defined as a function of *calendar date* rather than *time from now*. However, standard hyperbolic discounting in psychology is time-inconsistent. In public policy (like the UK Green Book), they use a declining schedule that is pre-committed. I need to be careful not to say declining rates *always* cause inconsistency, but that they *risk* it if not institutionalized properly. Actually, the deeper mathematical point is that if the uncertainty is about the *rate itself*, the effective rate declines and it *is* consistent. I will stick to the practical policy tension: Constant vs. Declining.

  *(Refining the "Killer")*: Is it "Far Future" or "Consistency"? For a sea wall, "Far Future" is the killer. If you use 5%, the wall never pays off. So "Far Future Non-Negligibility" is the filter.

