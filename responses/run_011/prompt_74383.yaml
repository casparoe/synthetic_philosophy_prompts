      *   Alternatively, "Time Consistency" kills ad-hoc political adjustments.
      *   *Decision:* "Far Future Non-Negligibility" is the specific killer for a sea wall project. If the rate is too high, the project fails by definition.

  6.  **Evaluate the Camps:**
      *   *Camp 1: Ramsey/Utilitarian (Impatience = 0).* $r = \rho + \eta g$. If $\rho=0$, $r$ depends on growth. Low rate. Good for far future. Bad if growth is overestimated.
      *   *Camp 2: Market-based (Opportunity Cost).* $r \approx$ municipal bond or private return (3-5%). High rate. Kills far future. Good for budget constraints.
