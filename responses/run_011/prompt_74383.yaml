      *   *Contested:* Intergenerational Neutrality (some argue pure time preference is valid), Market Anchoring (some argue markets are myopic), Single Number (some argue for schedules).
      *   *Wait, refine:* "Intergenerational Neutrality" is the core ethical fight. Is it a *requirement* or a *stance*? For *social* evaluation of climate, it's usually treated as a requirement by the "far future matters" camp, but the "market" camp rejects it. I need to frame this carefully. Let's call it "Ethical Coherence."
      *   *Actually, the prompt asks to flag where "taste... is dressed up as a criterion."* So, "Must be positive" is a taste. "Must be market-anchored" is a taste.
      *   *True Non-negotiables:* Internal Consistency (Time Consistency), Decision Relevance (Catastrophe Sensitivity).

