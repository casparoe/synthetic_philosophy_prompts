answer: |-
  ### Part 1: The Spec (Desiderata)

  You need a framework that translates future welfare into present equivalents without breaking the logic of the decision. Here are the five requirements any candidate discount rate must satisfy to be usable for a century-scale adaptation project.

  **1. Catastrophe Sensitivity (The "Pothole vs. City" Test)**
  *   **Requirement:** The framework must not mathematically guarantee that low-probability, high-impact events in the distant future are valued at zero.
  *   **The Failure Case:** If you use a standard compound rate (e.g., 5%), a benefit occurring in 2200 is divided by $(1.05)^{180}$. That factor is roughly 6,000. A billion dollars of damage in 2200 is worth $160,000 today. A pothole repair costing $200,000 today outweighs the existential risk. If the discount function decays exponentially, the tail of the distribution is amputated. The framework fails if it makes adaptation mathematically impossible regardless of the physical risk.

  **2. Dynamic Consistency (The "Review Timing" Test)**
  *   **Requirement:** The valuation of a specific future cash flow or benefit cannot change simply because time has passed and we are now closer to it, unless new information has arrived.
  *   **The Failure Case:** Suppose you approve the sea wall today based on a calculation. In five years, a new council reviews the *same* project with *same* data. If the discounting method makes the remaining benefits look less valuable relative to the remaining costs simply because the "present" moved forward, you will vote to cancel a project you previously voted to build. This creates policy instability and destroys credibility. You cannot have a rule that tells you to "wait and see" when waiting actually degrades the project's value artificially.

  **3. Intergenerational Neutrality (The "People Not in the Room" Test)**
  *   **Requirement:** The framework cannot value a dollar of welfare for a current citizen higher than a dollar of welfare for a future citizen *solely* because of their date of birth.
  *   **The Failure Case:** If the rate includes a "pure time preference" parameter (a tax on the future just because it is the future), you are asserting that the current generation has a property right over the welfare of the 22nd century. Since the people in 2200 cannot trade with you, cannot lobby you, and cannot invest in your election, using a rate that reflects *current* market preferences effectively disenfranchises them. The framework fails if it treats the absence of future market participants as a reason to ignore their welfare.

  **4. Domain Consistency (The "Neighborhood vs. Tax Base" Test)**
  *   **Requirement:** The discount rate applied to non-market goods (safety, existence of a neighborhood, ecosystem integrity) must be consistent with the rate applied to market goods (tax revenue, construction costs) when they are traded off against each other.
  *   **The Failure Case:** If you discount the loss of homes at 1% (because "lives matter") but discount the construction costs at 5% (because "money has a cost"), you create an arbitrage loop. You could justify any safety measure regardless of cost. Conversely, if you discount the loss of the neighborhood at 5%, you imply that a neighborhood saved in 2100 is worth pennies today. You must use a single social rate for all welfare impacts, or explicitly justify why safety is a different currency than cost.

  **5. Operationalizability (The "Spreadsheet" Test)**
  *   **Requirement:** The framework must yield a clear decision rule that can be implemented in a budget process.
  *   **The Failure Case:** If the answer is "it depends on a philosophical debate about the nature of time," the project stalls. You need a number or a schedule that can be entered into a cell. A framework that requires knowing the utility function of unborn people is theoretically pure but practically useless.

  ***

  ### Part 2: The Sort (Non-Negotiable vs. Contested)

  Not all requirements are created equal. Some are logical prerequisites for planning; others are ethical positions disguised as math.

  **Non-Negotiable (Logical Prerequisites)**
  If a framework fails these, it is broken, not just controversial.
  1.  **Dynamic Consistency:** If your method tells you to reverse a decision without new information, it is not a decision tool; it is a random number generator.
  2.  **Domain Consistency:** If you discount costs and benefits at different rates without a rigid accounting boundary, you can engineer any outcome you want.
  3.  **Operationalizability:** If it can't be calculated, it can't be used.

  **Contested (Ethical/Political Stances)**
  These are where the "taste" is dressed up as a criterion.
  1.  **Catastrophe Sensitivity:** *Why contested?* Market-based advocates argue that if the market doesn't price the risk, the government shouldn't either. They view "saving the far future" as a preference, not a requirement. *Verdict:* For a *climate adaptation* office, this is effectively non-negotiable, but in general public finance, it is contested.
  2.  **Intergenerational Neutrality:** *Why contested?* This is the core fight. One camp says "impatience is irrational" (Neutrality required). The other says "public money has an opportunity cost" (Neutrality irrelevant). Insisting on neutrality is a covert ethical claim that the future matters as much as the present. Insisting on market rates is a covert ethical claim that current taxpayers' opportunity costs trump future residents' survival.

  ***

  ### Part 3: The Collision (The Impossibility)

  Your suspicion is correct, but the tension is slightly more specific than you guessed.

  **The Trilemma:**
  1.  **Constant Positive Rate:** You want a single number (e.g., 3.5%) that stays fixed.
  2.  **Far Future Significance:** You want the year 2150 to matter (not be discounted to zero).
  3.  **Market Consistency:** You want the rate to reflect the opportunity cost of capital (which is historically positive).

  **You cannot have all three.**

  *   **Why:** Mathematically, a constant positive rate compounds exponentially. Exponential decay crushes long-time horizons. If $r > 0$, the limit as $t \to \infty$ is 0. To satisfy (2), $r$ must be near zero. But if $r$ is near zero, it violates (3) because capital markets generally return more than that.
  *   **The "Declining Schedule" Solution:** This is how people try to escape the trilemma. By using a rate that starts higher (satisfying Market Consistency) and drops lower over time (satisfying Far Future Significance), you avoid the exponential crush.
  *   **The Catch:** This sacrifices the "Single Number" requirement. It also risks **Dynamic Consistency**. If the rate declines because "we are getting closer to the future," you face the time-inconsistency problem (Requirement #2).
  *   **The Fix:** A declining schedule *can* be time-consistent **if** the decline is driven by *uncertainty* about the future growth rate, not just a preference for the near term. If we are unsure whether the future economy will grow at 1% or 4%, the math naturally produces a declining effective discount rate that is consistent over time.
  *   **Verdict:** You can have Far Future Significance and Consistency, but you **must give up the Single Constant Number.** You need a schedule (a curve), not a scalar. If your office demands a single scalar, they are forcing you to violate Far Future Significance.

  ***

  ### Part 4: The Killer Criterion

  **Catastrophe Sensitivity (Far Future Non-Negligibility)** is the filter that eliminates half the field.

  *   **Why:** For a sea wall with a 100-year lifespan, the bulk of the avoided damages occur in the second half of that timeline.
  *   **The Elimination:** Any framework that anchors the rate strictly to *current* short-term market returns (like the municipal bond rate or private ROI) will produce a rate between 3% and 5%. At 4%, the present value of benefits in year 100 is less than 2% of their face value. At 4%, the present value of benefits in year 150 is negligible.
  *   **Result:** If you insist that the project must be able to justify itself against catastrophic risk in 2150, **market-based discounting is dead.** It renders the project impossible by definition. This criterion forces you toward prescriptive/ethical rates or uncertainty-adjusted declining rates.

  ***

  ### Part 5: Running the Contenders Past the Spec

  Here is how the four main camps score against your requirements.

  **Camp 1: The Ramsey/Utilitarian Approach**
  *   *Logic:* "Impatience is irrational." Set pure time preference to zero. Rate depends only on expected economic growth and how much we care about equality ($r = \eta \times g$).
  *   *Performance:*
      *   **Catastrophe Sensitivity:** **Pass.** Rates are typically low (1-2%), keeping the far future alive.
      *   **Consistency:** **Pass.** Logically robust.
      *   **Neutrality:** **Pass.** Explicitly treats generations equally.
      *   **Operationalizability:** **Fail/Mixed.** Requires agreeing on "how much we care about equality" ($\eta$), which is political.
  *   *Verdict:* The ethical favorite. Fails only if the group refuses to accept a rate lower than market returns.

  **Camp 2: The Market Opportunity Cost Approach**
  *   *Logic:* "Public money crowds out private investment." Use the municipal bond rate or private ROI (3-5%).
  *   *Performance:*
      *   **Catastrophe Sensitivity:** **Fail.** Exponential decay kills the 2150 benefits.
      *   **Consistency:** **Pass.** Market rates are observable.
      *   **Neutrality:** **Fail.** Privileges current taxpayers over future residents.
      *   **Operationalizability:** **Pass.** Easy to get the number.
  *   *Verdict:* **Reject.** It answers the question "What is the cost of capital?" but fails the question "Is this wall worth building for the future?" It is the wrong tool for intergenerational assets.

  **Camp 3: The Uncertainty/Declining Rate Approach (Weitzman)**
  *   *Logic:* "We don't know future growth." Uncertainty about the rate itself implies the effective discount rate falls over time.
  *   *Performance:*
      *   **Catastrophe Sensitivity:** **Pass.** The "tail" of the distribution keeps the far future valuable.
      *   **Consistency:** **Pass** (if modeled correctly as uncertainty, not just a schedule).
      *   **Neutrality:** **Pass.**
      *   **Operationalizability:** **Mixed.** Requires a schedule, not a number. Complex to explain in a meeting.
  *   *Verdict:* **The Technical Winner.** It solves the math problem without requiring you to swear an ethical oath. It says "We use 4% for year 10, 2% for year 50, 1% for year 100."

  **Camp 4: The Non-Aggregative Approach (Rights/Thresholds)**
  *   *Logic:* "Don't discount survival." Some goods (existence of the city) are lexicographic—they trump cost-benefit analysis entirely.
  *   *Performance:*
      *   **Catastrophe Sensitivity:** **Pass.**
      *   **Consistency:** **Fail.** Hard to compare against other city projects (schools, roads).
      *   **Neutrality:** **Pass.**
      *   **Operationalizability:** **Fail.** Doesn't produce a number for the spreadsheet.
  *   *Verdict:* **Politically Strong, Technically Weak.** Good for a speech, bad for a budget request. Use this to justify *why* you are using Camp 3.

  ### Summary for the Meeting

  1.  **Demand a Schedule, Not a Number:** Tell them a single constant rate is mathematically incompatible with a 150-year project. If they insist on a single number, they are deciding to ignore the year 2100.
  2.  **Kill the Bond Rate:** The municipal bond rate reflects the risk of the city defaulting in 10 years, not the value of the city existing in 100 years. Using it is a category error.
  3.  **Push the Uncertainty Argument:** It is the path of least resistance. You don't have to argue ethics ("the future matters"); you argue math ("growth is uncertain"). Uncertainty naturally lowers the long-term discount rate.
  4.  **The Bottom Line:** If you use 3.5% or 5%, you are not evaluating the sea wall; you are vetoing it. If the goal is adaptation, the rate must decline over time.
