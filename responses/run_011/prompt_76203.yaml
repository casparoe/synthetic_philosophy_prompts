answer: |-
  You have identified a sophisticated and pervasive rhetorical maneuver. While there is no single, canonical Latin term (like *ad hominem* or *post hoc*) that captures this specific semantic dynamic exclusively, it is a recognized pattern in informal logic, legal theory, and political philosophy.

  The closest established concept is the **Motte-and-Bailey Doctrine**, though your description refines it specifically regarding *vagueness* and *classification*. In the philosophical literature on vagueness, this is often discussed under the heading of **inconsistent epistemic standards** or **strategic contextualism**, but these are descriptions rather than names.

  Since you asked for a specific carving of the abuse and, if necessary, a proposed name, I will first map it to the existing literature, then propose a precise term for this specific semantic variant, and finally define the boundary between the fallacy and legitimate reasoning.

  ### 1. The Existing Literature: Motte-and-Bailey
  The structure you describe is a specific species of the **Motte-and-Bailey Doctrine** (coined by Nicholas Shackel, 2005).

  *   **The Motte (The Defensible Position):** "The term is fuzzy; there is no bright line; demanding a criterion is a category error." This is modest, philosophically defensible (many concepts *are* vague), and hard to refute.
  *   **The Bailey (The Desired Position):** "This specific case is definitely X (or not X)." This is a strong, actionable claim that usually drives the argument's conclusion.
  *   **The Maneuver:** When challenged on the Bailey ("Why is this definitely a democracy?"), the speaker retreats to the Motte ("Democracy is complex; there's no test."). When making their argument, they occupy the Bailey ("Since this is not a democracy, we should sanction them.").

  While Motte-and-Bailey is the correct structural label, it is usually applied to *propositions* (e.g., "We want to help the poor" vs. "We want high taxes"). Your observation applies it to *predicates* and *semantic criteria*. For this specific semantic variant, the existing literature often refers to it as **"Strategic Ambiguity"** or **"Tactical Vagueness,"** but these terms fail to capture the *switch* to precision you noted.

  ### 2. Proposed Name: The Fallacy of Semantic Elasticity
  Because existing terms focus either on the structure (Motte-and-Bailey) or the state of being vague (Ambiguity), neither fully captures the *elastic* shift between vagueness and precision. I propose the term:

  **The Fallacy of Semantic Elasticity**
  *(Also: Epistemic Elasticity)*

  **Definition:** The fallacy of Semantic Elasticity occurs when an arguer inconsistently adjusts the epistemic standards of a vague predicate to suit their argumentative needs. Specifically, they invoke the **indeterminacy** of a term to deflect challenges to its application (shielding), while simultaneously invoking the **determinacy** of the same term to assert conclusions (swording), without providing a principled reason for the shift in standards.

  ### 3. The Carving: Abuse vs. Legitimate Use
  You asked exactly what the abuse consists in and how it differs from legitimate shifts in standards. Vague predicates (like "tall," "rich," "democracy," "employee") are legitimate features of language. We use them constantly without bright lines. The abuse lies not in using a vague term, but in **manipulating the burden of proof.**

  #### Legitimate Use of Vague Predicates
  A speaker is acting legitimately if they acknowledge the vagueness but **accept the burden of justification** for the specific classification.
  *   **Stance:** "There is no bright line for 'employee,' *but* in this case, the degree of control is so high that it falls squarely within the core meaning of the term."
  *   **Epistemic Commitment:** Consistent. They admit the boundary is fuzzy, but argue that *this specific case* is far from the boundary.
  *   **Response to Challenge:** If asked "What if control were 5% less?", they engage with the hypothetical ("It might become a borderline case, but here we are at 90%.").

  #### The Fallacy (Semantic Elasticity)
  The speaker acts fallaciously when they use vagueness to **evade the burden of justification**, then claim the benefit of certainty.
  *   **Stance:** "There is no test for 'employee' [therefore you cannot ask for my criteria], *but* this worker is definitely not an employee [therefore I owe no benefits]."
  *   **Epistemic Commitment:** Inconsistent. They claim the boundary is unknowable when asked to draw it, but known when asked to apply it.
  *   **Response to Challenge:** If asked "What if control were 5% less?", they retreat ("You're asking for a bright line where none exists," effectively silencing the challenge).

  **The Core Abuse:** The arguer treats the *concept* as having **truth-value gaps** (no fact of the matter) when defending, but **bivalent truth** (true/false) when attacking.

  ### 4. Boundary Cases
  Distinguishing the fallacy from nuanced reasoning can be difficult. Here are the boundary markers:

  1.  **The "Core vs. Penumbra" Test (H.L.A. Hart):**
      *   *Legitimate:* The speaker argues the case lies in the "core" of the concept, acknowledging the "penumbra" (fuzzy edge) exists elsewhere.
      *   *Fallacious:* The speaker claims the case is in the core, but when pressed on *why*, they claim the whole concept is penumbra (no core exists).

  2.  **The Consistency of Stakes:**
      *   *Legitimate:* The standard of precision matches the stakes. (e.g., "For casual conversation, he's tall; for the basketball team, we need a specific height.")
      *   *Fallacious:* The standard shifts solely to avoid losing a point. (e.g., "He's tall enough to be liable" vs. "Height doesn't matter for liability" depending on which helps the defendant).

  3.  **The Retreat Condition:**
      *   *Legitimate:* If the speaker admits vagueness, they also admit the conclusion is probabilistic or defeasible ("It is *likely* a democracy").
      *   *Fallacious:* The speaker admits vagueness but retains a categorical conclusion ("It is *not* a democracy").

  ### Summary
  You have correctly identified that this is not the **Continuum Fallacy** (which denies distinctions exist because boundaries are fuzzy) nor **Equivocation** (which changes the meaning).

  It is a form of **Motte-and-Bailey** applied to semantic criteria. I propose calling it **The Fallacy of Semantic Elasticity**. It consists in claiming **epistemic immunity** (you can't define the line) to block scrutiny, while claiming **semantic authority** (I know which side of the line this is on) to drive conclusions. The boundary between this and legitimate reasoning is whether the speaker accepts the **burden of justification** for the specific classification despite the general vagueness of the term.

  **References for further reading:**
  *   **Shackel, N. (2005).** "The Motte and Bailey Doctrine." (For the structural analogue).
  *   **Hart, H.L.A. (1961).** *The Concept of Law.* (For the distinction between "core" and "penumbra" of meaning).
  *   **Williamson, T. (1994).** *Vagueness.* (For the philosophical background on epistemicism vs. supervaluationism, which underpins the inconsistency).
  *   **Walton, D. (1996).** *Fallacies Arising from Ambiguity.* (For the informal logic context).
