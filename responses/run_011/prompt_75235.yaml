answer: |-
  You have put your finger on the engine room of modern epistemology and philosophy of mind. Your intuition is correct: there is a specific inferential move doing the heavy lifting here, and it is distinct from the skeptical conclusion it produces.

  ### 1. Does it have a name?

  In the technical literature, this is most commonly called the **Common Kind Assumption (CKA)** or the **Common Factor Principle**.

  However, your assessment is accurate: these terms are not "household" philosophical concepts like *Occam's Razor* or *Modus Ponens*. They are working labels used primarily by specialists debating the structure of perception and skepticism. There is no single, universally canonized name that captures the *logical force* of the move as clearly as your description ("the bad case sets the terms").

  If we were to coin a name based on the logical structure you identified, it would be the **Principle of Indistinguishable Reduction**. It states: *If two states are introspectively indistinguishable, the ontological and epistemic status of the veridical state must be reducible to the intersection of what is present in both.*

  But since **Common Kind Assumption** is the term you will encounter if you dig deeper, I will use that, with the caveat that it covers both the metaphysical claim (what the experience *is*) and the epistemic claim (what you *know* from it).

  ### 2. Is it one principle or two?

  This is a **live and heated dispute**. You are right to suspect a slide between two distinct claims. Philosophers generally carve them as follows:

  1.  **The Metaphysical Claim (Common Kind):** The immediate mental state in the good case (seeing) and the bad case (hallucinating) are tokens of the *same fundamental kind*. (e.g., Both are just "sense-data" or "neural representations"; the apple is external to the state itself).
  2.  **The Epistemic Claim (Indistinguishability/Parity):** Because the subject cannot tell the cases apart from the inside, the *justification* or *evidence* available to them must be the same in both cases.

  **Where the disagreement lies:**
  *   **Skeptics** accept both. They argue that because the mental kind is the same, the evidence is the same, and since the evidence in the bad case doesn't guarantee truth, the evidence in the good case doesn't either.
  *   **Internalists** often accept the Epistemic Claim but might remain agnostic about the Metaphysical one. They argue: "I don't care what the state *is* ontologically; I care that from my perspective, the reasons I have are identical."
  *   **Disjunctivists** (the primary "resisters" you asked about) reject the Metaphysical Claim *in order to* reject the Epistemic Claim. They argue that because the good case involves a direct relation to the world, it is a *different kind of state* entirely, and therefore provides *different (better) evidence*, even if it feels the same.

  **Can you deny one while granting the other?**
  Yes. This is a major fault line.
  *   You could grant that the brain states are identical (Metaphysical Common Kind) but argue that the *justification* differs because justification depends on external facts (Epistemic Externalism).
  *   Conversely, you could argue the mental states are different (Disjunctivism) but maintain that since the subject can't tell the difference, their *rational entitlement* is the same (a view some concessive Disjunctivists hold).

  ### 3. What do the resisters actually resist?

  The resisters (primarily **Disjunctivists** like John McDowell, M.G.F. Martin, and Matthew Kennedy) resist the **Metaphysical Claim** first and foremost.

  They argue that the "Common Kind Assumption" is a prejudice. They claim that in the good case, the apple itself is a constituent of your experience. In the bad case, it is not. Therefore, they are not two instances of a common thing ("seeming to see"); they are two fundamentally different things that happen to be hard to tell apart.

  **What does the denial amount to?**
  It amounts to a claim about the **nature of experience**.
  *   **Pro-CKA:** Experience is an internal representation. The world is outside the "veil."
  *   **Anti-CKA (Disjunctivism):** Experience is a relation. In the good case, the world is "in" the experience (not spatially, but constitutively).

  **Do they owe an explanation of indistinguishability?**
  Yes, this is the biggest objection to Disjunctivism. If the states are fundamentally different, why can't I tell them apart?
  *   **The Disjunctivist Answer:** They argue that "indistinguishability" is not a positive relation (like "sharing a property"). It is merely the **failure of a capacity to discriminate**. Just because I can't tell A from B doesn't mean A and B share a common property C.
  *   **The Critic's Reply:** This sounds like wordplay. If my brain is doing the exact same thing in both cases (as neuroscience suggests), how can the *nature* of the experience be different? This leads to the "screening off" problem: if the brain state is sufficient for the experience, what work is the apple doing?

  **Status:** This is **unsettled**. Disjunctivism is a major contemporary position, but it is not the "standard view." It is viewed as a bold, counter-intuitive move that solves skepticism at the cost of a complex metaphysics of mind.

  ### 4. Actual vs. Possible Indistinguishability

  The principle does **not** require actual indistinguishability. It relies on **modal** indistinguishability (possibility).

  This is the engine of the "Brain in a Vat" argument. It doesn't matter if you are *actually* a vat brain. It matters that there is a *possible world* where you are a vat brain, and in that world, your experience is indistinguishable from this one. If the Common Kind Assumption holds, the *actual* world inherits the limitations of the *possible* bad world.

  So, a merely possible bad case does the same job. In fact, most modern skepticism relies entirely on *possible* scenarios (dreams, demons, vats) rather than actual illusions.

  ### 5. Extension to Memory and Testimony

  Your extension is **recognized and standard**.
  *   **Memory:** This is the "Skepticism about the Past." If a false memory can feel exactly like a true one, and we accept the Common Kind Assumption for memory, then your evidence for the past is always compatible with the past not having happened.
  *   **Testimony:** If a liar sounds exactly like a truth-teller, and we accept the principle, then hearing testimony never gives you direct evidence of truth, only of "sounding true."

  **Is it stable to reject the principle for perception but accept it for memory?**
  This is a **live dispute**.
  *   **Some argue Yes:** Perception is "presentational" (the object is here now), while memory is "representational" (the object is gone). Therefore, perception might be relational (Disjunctivist) while memory is inherently internal.
  *   **Some argue No:** If you accept the Common Kind Assumption for memory, you undermine your ability to verify perception (since you need memory to track perceptual consistency). If you reject it for perception, consistency suggests you should reject it for memory (a view known as "Disjunctivism about Memory," defended by philosophers like Sven Bernecker).

  Generally, philosophers prefer **global** solutions. If you are a Disjunctivist about perception, you feel pressure to be one about memory too, or else you risk inconsistency. However, no consensus exists.

  ### 6. How this differs from Ordinary Skepticism

  You asked for the edges. This is crucial.

  *   **Ordinary Skepticism** is the *conclusion*: "We don't know the external world exists."
  *   **The Common Kind Assumption** is the *premise*: "The good case and bad case share the same core."

  You can be a skeptic without using this principle (e.g., by arguing that our concepts are inherently flawed). You can also accept the principle without being a skeptic (e.g., by arguing that the "common core" is sufficient for knowledge, which is a form of Internalism).

  However, the specific *flavor* of skepticism you described—where the good case is "demoted" to the bad case plus luck—is uniquely generated by the Common Kind Assumption. Without this principle, a skeptic would have to argue that the good case is *itself* deficient, rather than arguing it is *identical* to the deficient case.

  ### Summary of the Landscape

  | Feature | The Principle (CKA) | The Resistance (Disjunctivism) |
  | :--- | :--- | :--- |
  | **Core Claim** | Good/Bad cases share a common mental core. | Good/Bad cases are fundamentally different kinds. |
  | **Metaphysics** | Experience is internal/representational. | Experience is relational (in the good case). |
  | **Epistemology** | Evidence is the same in both cases. | Evidence is better in the good case. |
  | **Indistinguishability** | Explained by shared properties. | Explained by inability to discriminate. |
  | **Status** | Dominant historical view (Descartes to Russell). | Dominant contemporary *challenge* (last 40 years). |

  **Verdict on your intuition:**
  You have correctly identified that the "Argument from Illusion" is merely the vehicle, and the **Common Kind Assumption** is the cargo. You are also correct that there is a slide between the metaphysical and epistemic versions of this assumption. The "resisters" (Disjunctivists) are specifically trying to pry those two apart: they deny the metaphysical claim to save the epistemic status of the good case.

  Whether they succeed is one of the central unanswered questions in current philosophy of mind.
