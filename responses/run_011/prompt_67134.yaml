answer: |-
  # Specification of Evaluative Desiderata

  The following requirements are ordered by exclusionary work (the volume of plausible historical accounts each eliminates). Each item includes the motivating phenomenon and a negotiability marker indicating whether it is a **Non-Negotiable Desideratum** (required for any adequate account) or a **Doctrinal Preference** (a commitment of one camp disguised as a criterion).

  1.  **Archival Operability**
      *   **Requirement:** Any standard invoked to evaluate an agent must be demonstrably in force for that agent via evidence recoverable from the archive (e.g., correspondence, institutional records, marginalia), not merely via abstract reconstruction of the "spirit of the age."
      *   **Motivation:** Prevents the historian from attributing standards to an agent based on what *should* have been known rather than what *was* known to them. Solves the problem of non-unanimous standards by tying norms to specific networks of reception.
      *   **Marker:** [Non-Negotiable Desideratum]

  2.  **Reachability of Dissent**
      *   **Requirement:** Exculpation based on "common standards of the time" fails if evidence shows contrary standards were accessible to the agent without ruinous cost. Conversely, blame fails if dissent existed only in forms socially or intellectually inaccessible to the agent.
      *   **Motivation:** Distinguishes the Physician (who read objections and dismissed them) from the Magistrate (where refusal meant destitution). Prevents the "existence somewhere" fallacy; focuses on the *cost* of epistemic access.
      *   **Marker:** [Non-Negotiable Desideratum]

  3.  **Act/Agent/Character Distinction**
      *   **Requirement:** The account must separate the evaluation of the *act* (was it harmful/unjust?), the *agent* (were they culpable for performing it?), and the *character* (does this define their moral worth?).
      *   **Motivation:** Handles the asymmetry of praise and blame. Allows a historian to judge an act as wrong (e.g., enforcing an unjust statute) while judging the agent as excusable (due to constraint), without collapsing into incoherence.
      *   **Marker:** [Non-Negotiable Desideratum]

  4.  **Hindsight Independence**
      *   **Requirement:** Evaluative verdicts must not depend primarily on outcomes known only to the historian (e.g., that a practice would later cause harm) unless the risk was recognizable at the time.
      *   **Motivation:** Prevents moral luck from dictating verdicts. Ensures the Physician is judged on the risk knowledge available then, not solely on the harm we now know occurred.
      *   **Marker:** [Non-Negotiable Desideratum]

  5.  **Strict Immanence**
      *   **Requirement:** The historian may only apply standards that the agent could have recognized and accepted as valid within their own conceptual horizon.
      *   **Motivation:** Intended to prevent presentism and ensure fairness to the agent.
      *   **Marker:** [Doctrinal Preference: Contextualist]

  6.  **Normative Reciprocity**
      *   **Requirement:** The account must allow the past to normatively correct the present; the historian must be willing to admit that present standards might be inferior to past ones.
      *   **Motivation:** Intended to prevent the past from becoming normatively inert and to ensure the historian is subject to the same reflexive scrutiny as the agent.
      *   **Marker:** [Doctrinal Preference: Presentist]

  ***

  # Sorting Analysis: Desiderata vs. Doctrinal Commitments

  Two items in the specification above are not universal requirements for an adequate method but are instead doctrinal commitments wearing the costume of criteria.

  **1. Strict Immanence (Item 5) is a Contextualist Commitment.**
  It is routinely demanded as a criterion of "fairness," but it is actually the substantive claim that moral truth is relative to historical horizons. By insisting that an agent cannot be judged by standards they could not recognize, this requirement preemptively excludes the possibility that some truths (e.g., regarding human equality) are trans-historical. It disguises a metaphysical claim about morality as a methodological rule about evidence.

  **2. Normative Reciprocity (Item 6) is a Presentist Commitment.**
  It is routinely demanded as a criterion of "intellectual humility" or "reflexivity," but it is actually the substantive claim that the primary utility of history is moral instruction for the present. By insisting the past must be able to correct us, this requirement excludes the possibility that the primary goal of history is understanding rather than improvement. It disguises a claim about the *purpose* of history as a rule about *evaluation*.

  **Genuine Desiderata:** Items 1 through 4 are non-negotiable because they concern the mechanics of historical reasoning itself (evidence, causality, distinction of categories) rather than the moral status of the past or the utility of the discipline. An account that fails Archival Operability is not history; an account that fails Strict Immanence is merely non-contextualist history.

  ***

  # Unsatisfiability Analysis

  There is a jointly unsatisfiable subset among the following three demands:
  1.  **Strict Immanence** (Judgment limited to standards recognizable to the agent).
  2.  **Preservation of Genuine Criticism** (The historian must be able to declare the agent's actions wrong, even if the agent believed them right).
  3.  **Non-Question-Begging Standards** (Objective criteria for whose standards count, not just "mine" or "theirs").

  **The Conflict:** If you enforce Strict Immanence, you cannot offer Genuine Criticism when the agent faithfully followed their own recognizable standards (e.g., a slaveholder following local law). If you allow Genuine Criticism (e.g., "slavery was wrong regardless of local law"), you violate Strict Immanence. If you attempt to solve this by appealing to Non-Question-Begging Standards (e.g., "universal human rights"), you inevitably import presentist standards, which violates Strict Immanence, or you appeal to past standards, which may not support the criticism.

  **Resolution:** **Strict Immanence must go.** It is the weak link. It should be replaced by **Accessible Normative Horizons**. The historian should judge based on what was *possible* to know and recognize, not merely what was *actually* recognized. This allows for Genuine Criticism (the agent *could* have known better, per Reachability) without assuming the historian's current standards are the only valid ones. It preserves the Non-Question-Begging requirement by grounding the critique in archival evidence of alternative possibilities (Item 1 and 2) rather than abstract moral assertion.

  ***

  # Evaluation of Available Stances

  **Unrestrained Contextualist Restraint** fails because it adheres to Strict Immanence, rendering it unable to offer Genuine Criticism in cases where agents faithfully followed local norms (the Magistrate becomes indistinguishable from the Physician if both followed their lights). **Unabashed Present-Minded Judgment** fails because it ignores Reachability and Archival Operability, judging the Magistrate by standards he could not access without ruinous cost, thus violating fairness. **Two-Tier Separation (Explanation vs. Evaluation)** fails because it often lacks Operationalization; it posits a space for evaluation but provides no method for settling whose standards apply in that space, leading to arbitrary verdicts. **Culpability-Relative-to-Accessible-Criticism** fares best, provided it abandons Strict Immanence. By anchoring verdicts in what dissent was reachable (Item 2) and provable in the archive (Item 1), it allows for condemnation of the Physician and exculpation of the Magistrate without requiring the historian to claim moral superiority, only epistemic precision.
