answer: |-
  To: Board of Directors
  From: [My Name]
  Re: Thursday's Vote – Surrogate Goal Proposal

  Hi everyone,

  Ahead of Thursday, I wanted to circulate my thinking on the researcher's proposal regarding "surrogate goals." I know this sounds abstract, and I know we have serious concerns about cost, credibility, and funding. I've tried to weigh the innovation against the risks.

  **Recommendation**
  I recommend we **adopt Part 1 (the policy)** but **table Part 2 (the public reasoning paper)** until after our spring funding renewal. Additionally, we should modify the implementation to rely on the *existing* value we place on the archive rather than budgeting new funds to manufacture care.

  **The Mechanism in Plain English**
  The core idea is simple: blackmail works because there's something you care about that an adversary can break. If you publicly promise, ahead of time, to treat any threat against your staff, data, or mission as a threat against a specific, less valuable thing—a "decoy"—you remove the leverage. You're telling potential aggressors: "If you threaten us, we will not pay. We will only react as if you threatened this specific archive."

  For this to work, the decoy must be something we genuinely care about. If we're bluffing, sophisticated adversaries will call it. We need to be able to say, "Losing that archive would actually hurt us," and mean it.

  **Addressing the Ops Director's Concern**
  Our Ops Director is right: spending $60–80k to manufacture emotional attachment to a hostage is inefficient and risky. It looks like theater. However, the wrinkle here is that several of us *already* care about this archive. Staff met there; work is stored there. This isn't a bug; it's the solution. We don't need to spend money to create care; we need to formally recognize the care that already exists. By budgeting only for maintenance (not "investment in caring"), we satisfy the credibility requirement without the wasteful spend. This turns the Ops objection from a veto into a design constraint: keep it lean, rely on authentic value.

  **Addressing the ML and Philosopher Objections**
  The ML team worries this is unfalsifiable theater. They're correct that if we don't actually mourn the archive, the mechanism fails. But because the care is pre-existing, our reaction to loss would be real, making the signal detectable.

  Regarding the philosophical concern about agents we can't causally interact with: this is a common sticking point. If this comes up in the meeting, here is how I suggest we frame it:

  > "This isn't about metaphysics or magic; it's about predictability. When an adversary decides whether to threaten us, they run a simulation of our response. They don't need to be in the room with us; they just need to predict what we'd do. If we change our decision-making structure now—by binding ourselves to a surrogate goal—we change the output of their simulation. It doesn't matter if we can causally interact with the threatener. What matters is that their model of us sees no payoff in aggression. We are hardening our software against exploitation, not negotiating with ghosts."

  **Funder and Legal Risk**
  Publishing the *reasoning* (Part 2) now signals that we are theorizing about blackmail scenarios involving unobservable agents. Our largest funder may read this as instability. The policy itself (Part 1) can be framed as standard data preservation commitment. I propose we adopt the policy quietly as part of our risk framework now, and delay the explanatory whitepaper until after the $400k renewal is secured. This protects our liquidity while testing the mechanism. I also agree with our lawyer that the policy wording must be reviewed to ensure it doesn't inadvertently admit liability or outline vulnerabilities in a way that invites testing.

  **Where Our Reasoning is Soft**
  The weakest link isn't the theory; it's our own resolve. Precommitment only works if we hold the line when the threat arrives. If we crack under pressure, we lose the decoy *and* our credibility for future threats. We need to discuss internally: are we actually willing to let the archive be damaged rather than negotiate? If the answer is "no," this policy is a lie, and we shouldn't publish it.

  Additionally, we haven't fully stress-tested what happens if an adversary threatens the archive *directly*. If the decoy becomes the primary target, the shield collapses. We need a contingency for that scenario before voting yes.

  **Conclusion**
  This proposal is unusual, but so are the risks we manage. By leveraging existing care, we keep costs low. By delaying the theoretical writeup, we protect funding. By adopting the policy, we test a potentially vital defense mechanism. I think this balanced approach lets us innovate without being reckless.

  See you Thursday.
