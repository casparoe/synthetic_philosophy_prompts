  **Feedback on Errors and Confusions**

  In preparing for our discussion, it is important to distinguish between slips of phrasing and genuine conceptual hurdles. Your answer contains very few phrasing slips; your prose is precise and your reading of van Fraassen and Lipton is textually accurate. The deductions in parts (b) and (c) stem from a genuine confusion about the definition of "ampliative inference." You seem to treat an inference as deductive if the *process* of reaching the conclusion is determined or algorithmic. In philosophy, an inference is ampliative if the truth of the premises does not *guarantee* the truth of the conclusion, regardless of how mechanically the conclusion was selected. We should spend the session focusing on this distinction: why "H is the best explanation" never logically entails "H is true," even if H is the best of an exhaustive list. Once that is clear, you will see why Lipton defends IBE as a guide to likelihood (ampliative) rather than a mechanism of deduction.
