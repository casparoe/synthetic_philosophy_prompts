answer: |-
  Your diagnosis is sharp, and you are right that the 1980s battlefield is overgrown. The "four corners" textualist versus "legislative intent" purposivist fight is indeed dead; context is now universal currency. However, your claim that both sides agree "meaning is a linguistic fact" flattens the one substantive philosophical disagreement that remains, and your identification of the "smuggled judicial role" is correct but understated: it isn't smuggled, it is the engine.

  Here is the argument for why the stalemate persists, why *Bostock* proves it, and why theoretical progress is unlikely.

  ### 1. The Diagnosis: You are right about the convergence, wrong about the "linguistic fact."

  You argue that both sides now treat meaning as a linguistic fact about enacted text + context, disagreeing only on *which* empirical facts settle it (ordinary reader vs. legislative record). This misses a deeper distinction in the philosophy of language that has moved from the subtext to the text.

  The disagreement is no longer **Text vs. Purpose**. It is **Semantic Content vs. Expected Application**.

  *   **The Gorsuch Position (Semantic Content):** Meaning is the compositional semantic value of the words at the time of enactment. If the words logically cover a scenario, the statute covers it, regardless of whether the enacting coalition anticipated that coverage. In *Bostock*, "because of sex" semantically entails "but-for causation." If firing a gay man requires considering his sex, the text is satisfied. The fact that 1964 legislators didn't *expect* this result is irrelevant to the *meaning*.
  *   **The Alito/Purposivist Position (Communicative Content/Expected Application):** Meaning is the communicative act understood by the audience at the time. Language is a tool of social coordination. If the relevant linguistic community (the 1964 public) understood "sex discrimination" to *exclude* sexual orientation discrimination, then the legal meaning is fixed by that understanding, not by abstract semantic compositionality.

  This is not just a dispute over "which empirical facts." It is a dispute over **what kind of thing statutory meaning is.**
  *   For the New Textualist, meaning is an objective property of the sentence (like code).
  *   For the Modern Purposivist (and Old Textualist), meaning is a social fact about how the sentence was received and utilized (like a promise).

  *Bostock* confirms this. Gorsuch and Alito both claimed the mantle of textualism. They both looked at the text. They both looked at dictionaries. They split because Gorsuch prioritized *semantic logic* while Alito prioritized *contemporary public understanding*. If your diagnosis were correct—that they only disagree on empirical facts—they should have been able to resolve it by looking at more data. They couldn't, because they were measuring different things.

  ### 2. The "Smuggled" Judicial Role is actually the Primary Disagreement

  You suggest the disagreement about judicial role is "smuggled in under semantic vocabulary." I would argue it is the only reason the semantic disagreement matters.

  If the only goal were accurate communication, we might privilege the "expected application" view (Alito). But Textualism is not primarily a theory of communication; it is a theory of **political legitimacy and constraint**.

  *   **The Textualist Constraint:** The judicial role is limited to what the legislature *actually enacted*, not what they *wanted to enact*. Allowing "expected application" to override semantic breadth gives judges license to update statutes based on their guess of what the legislature "would have done." Textualists accept "unanticipated coverage" (like *Bostock*) as the price of maintaining the constraint that judges cannot update laws.
  *   **The Purposivist Function:** The judicial role is to make the statute *work* as a coherent regulatory tool. If the semantic reading produces a result that defeats the identifiable problem the legislature was solving, the judge has a duty to correct the mismatch.

  The stalemate is frozen because these are competing constitutional values, not linguistic theories.
  *   Value A: **Democratic Accountability.** (Only the text voted on is law.)
  *   Value B: **Functional Governance.** (The law should solve the problem it was designed to solve.)

  You cannot resolve this with better linguistics because it isn't a linguistic problem. It is a separation-of-powers problem disguised as semantics.

  ### 3. What Would Count as Progress?

  If the dispute is normative (about judicial power) rather than empirical (about word meanings), standard tools for progress fail.

  **A. Corpus Linguistics (CL)**
  CL will not solve this. CL can tell you the semantic range of "sex" in 1964. It can tell you how often "because of" implied but-for causation.
  *   *Why it fails:* It cannot tell you whether the *legal effect* of the statute is bound by the semantic range or the expected application. In *Bostock*, CL might support Gorsuch on the definition of "because of," but it might support Alito on the public understanding of "sex discrimination." CL provides data, but it cannot tell you which data is legally dispositive. That is a normative choice.

  **B. A Decision Procedure**
  A unified decision procedure (e.g., "Step 1: Text, Step 2: Context, Step 3: Purpose") is already attempted (see the *Chevron* framework or various canons).
  *   *Why it fails:* The fight happens at the prioritization stage. When Text and Purpose conflict, who wins? Any procedure that prioritizes Text is Textualist; any that allows Purpose to override is Purposivist. You cannot write a neutral procedure to resolve a normative disagreement about authority.

  **C. The Only Viable Path: The "Construction Zone"**
  Progress would require a change of question. Instead of asking "What is the true method?", the field needs to acknowledge the **Interpretation-Construction Distinction**.
  *   **Interpretation:** Discovering the semantic meaning (where linguistics rules).
  *   **Construction:** Determining the legal effect when the text is ambiguous or leads to absurdity (where policy rules).

  **Progress looks like this:** Both sides admit that "ordinary meaning" runs out. They admit that *Bostock* wasn't purely semantic; it involved a choice to privilege semantic breadth over expected application. They move the fight to the "Construction Zone," where they argue openly about **default rules**.
  *   *Textualist Default:* If text is ambiguous or overbroad, default to the defendant/narrow reading (Rule of Lenity style).
  *   *Purposivist Default:* If text is ambiguous or overbroad, default to the purpose (fix the problem).

  **Why this won't happen:**
  Admitting a "Construction Zone" concedes that judges are making law in the gaps. Textualists cannot admit this without undermining their claim to constraint. Purposivists cannot admit this without undermining their claim to democratic fidelity.

  ### 4. Conclusion: No Resolution is Coming

  You asked whether you are flattening a genuine substantive disagreement or if the labels are just obsolete.

  You are **not** flattening the disagreement; there *is* a substantive disagreement about the nature of meaning (Semantic vs. Communicative). But you are correct that the **labels** are obsolete because they hide the real stakes.

  However, no theoretical progress is coming. The debate is frozen because it is a **proxy war for the administrative state**.
  *   **Textualism** is the jurisprudence of a judiciary skeptical of agency power and legislative delegation. It seeks to freeze statutes in time to prevent bureaucratic drift.
  *   **Purposivism** is the jurisprudence of a judiciary comfortable with dynamic governance. It seeks to allow statutes to evolve with the problems they regulate.

  As long as the underlying political struggle over the scope of federal regulatory power remains unresolved, the interpretive debate will remain frozen. The "same moves recycled since the 80s" persist because the underlying institutional conflict has not changed.

  **The Verdict:** Your diagnosis of the *symptoms* (convergence on context, empirical disputes, smuggled judicial role) is accurate. Your diagnosis of the *cause* (that they agree meaning is a linguistic fact) is the one place you flatten the theory. They disagree on whether meaning is a *code* to be cracked or a *promise* to be kept. But even if you fix that, the stalemate remains, because the fight isn't about meaning. It's about who gets to update the law when the world changes.
