          5.  Non-Rational Updates (Juror 3, 10).
          6.  Cinematic Form.
          7.  Final Verdict on the Analogy.

      *   *Refining the "Weak Signal" point:* In cascade models, if the public pool is deep, a weak signal gets swallowed. Juror 8 survives because the *rule* (unanimity) protects him, not because his signal is strong. This supports the "institutional design" angle.
      *   *Refining the "Off-Record" point:* This is the biggest snag. If a scientist brings in a knife from a pawn shop to disprove a colleague's finding, that's not replication; that's new experimentation. But if they do it *after* the hypothesis was set, it's questionable. The film treats extra-record investigation as heroic. Science reform treats it as suspect. I need to highlight this tension.
      *   *Refining the "Form":* The room *is* the peer review process. Hot, stifling, inescapable.

  7.  **Final Review against Constraints:**
      *   Did I use quotes? No.
      *   Did I force the fit? No, I highlighted the fractures.
      *   Did I address specific scenes? Yes (knife, glasses, walk, photo, ballot).
      *   Did I address the science analogy? Yes.

  8.  **Final Polish:** Ensure the distinction between "rational herding" and "social conformity" is clear. Ensure the "weak signal" vs. "procedural veto" distinction is sharp. (Self-Correction: Make sure to emphasize that Juror 8 isn't actually herding *against* the crowd initially; he is refusing to join the cascade. That's different.)

      *   *Wait, one nuance:* The user asks if "reasonable doubt" is an anti-cascade device. Yes, because it changes the payoff matrix. It makes the cost of a False Positive (convicting innocent) infinitely higher than a False Negative. This alters the rational calculation for joining the cascade.

      *   *Another nuance:* The "off-record" evidence. In science, a failed replication *is* new data. But if the original study was "The knife is unique," and the replication is "I found another knife," that *is* valid new data. The problem in science is that the *failed* replication isn't published. In the film, the "failed replication" (finding the second knife) *is* the pivot point. So the analogy holds there: The "file drawer" problem is solved in the film because Juror 8 *forces* the drawer open.

