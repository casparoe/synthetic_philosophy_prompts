prompt: |-
  I am the lead quantitative assessor at a national regulator for the deep geological disposal of radioactive waste. Between thirty and forty times a year we are required to put a number, or a defensible range, on a quantity for which there is no relevant frequency data: the probability that a corrosion barrier is breached within five hundred years, the probability that a fracture zone provides a connected pathway to an aquifer, the fraction of a canister fleet carrying a latent manufacturing defect. Applicants submit models; we must say whether the safety case holds. Our assessments are then examined adversarially by the applicant's technical counsel and by a seven-member panel, two of whom have no quantitative training, and the chief scientist signs.

  For the no-data case, the handbook gives assessors a single rule: where nothing bears on a quantity, assign a uniform distribution across the interval the applicant's model makes plausible. The stated defence is that in the absence of information every value is equally likely, and that any other assignment would smuggle in information the assessor does not have.

  Two incidents this year suggest the rule is not merely weak but incoherent.

  Incident one. In a liner-breach assessment, the applicant's model takes time to first breach as its primary quantity and argues that, on the evidence, that time is uniform between 50 and 500 years. A colleague on my staff objected that the same state of ignorance is better expressed by taking the annual breach rate as uniform between 0.002 and 0.02 per year, which is the identical range under the identical change of variable. The probability of a breach within the first hundred years comes out near 0.11 on the first assignment and near 0.62 on the second. Both are uniform across the plausible interval. The handbook's rule chooses between them only by the accident of which quantity the applicant happened to write the model in, and counsel will of course quote whichever is lower.

  Incident two. In an assessment already published and already briefed upward, we assigned a uniform distribution to the transmissivity of a fracture zone across a range spanning four orders of magnitude, and reported the probability that transmissivity falls below the threshold at which the pathway can be discounted. That probability is about 0.01 on the assignment we used. A log-uniform assignment over the same range, or a uniform assignment to the equivalent hydraulic aperture from which transmissivity is derived by a cubic law, gives figures between 0.5 and something higher still. Nothing in the file records why transmissivity, rather than aperture or log-transmissivity, was the quantity we were indifferent about.

  One of the two lay members of the panel has read about Bertrand's chord problem and now asks every applicant whether a reported probability would change if the same physical situation were described in a different variable. We have no answer for her, and I think she is right to ask.

  My tentative diagnosis, which I want tested rather than assumed: indifference is licensed only where the space of possibilities has been carved up by something in the world rather than by our notation, and where that carving is stated in the assessment as a substantive, contestable assumption rather than as a default. If that is right, the handbook's appeal to equal likelihood in the absence of information is not a neutral fallback but a hidden choice of variable. I am aware of the standard machinery in this area — invariance-based constructions, priors designed to be stable under reparameterization, robust treatments that carry a family of priors forward instead of selecting one — but I do not want a survey of it. I want something an assessor can run.

  Please write the decision procedure my team could operate in place of the current rule. It should give the questions to ask, in order, with a statement of what counts as a sufficient answer to each; the points at which the procedure stops and returns no admissible prior, together with what the assessor is to report in that case instead; the points at which it hands the matter to a person because the question concerns what should matter rather than what is true; a documentation format that lets a hostile reviewer see precisely which carving was assumed and what depends on it; and a reporting rule that says when a single figure may be published, when a range must be, and how large a divergence between two natural parameterizations has to be before the single figure is withdrawn. Assume assessors with one graduate course in statistical inference and about a working day per assessment. Mark explicitly which steps are judgment calls wearing the clothing of procedure.

  Then run the procedure on three cases. First, incident one, where we must still decide which figure goes in the report. Second, incident two, where the published figure may not survive. Third, a case where indifference should be licensed and where a procedure that prohibits it by default would be a bad procedure: a shipment of two hundred nominally identical canisters in which radiography has established that exactly one is out of specification but the records do not identify which, so that the assessor is indifferent across the two hundred for reasons that are physical rather than notational. One of these three will produce a result I would prefer not to have, and I expect it is the second; tell me if you think otherwise.

  Finally, state plainly what the procedure cannot do. In particular, address the worry that my diagnosis proves too much: if indifference requires a worldly carving and the world rarely carves uniquely, does the procedure collapse into a standing instruction never to assign a prior, and if it does, what should the handbook say to the panel instead?
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Role:** Lead Quantitative Assessor at a national regulator for deep geological disposal of radioactive waste.
      *   **Problem:** The current handbook rule (assign uniform distribution where no data exists) is incoherent (parameterization dependent, as shown by Bertrand's Paradox-style examples).
      *   **Context:** High stakes, adversarial review, mixed audience (technical + lay panel), strict timeline (1 day per assessment), assessors have moderate stats training (1 grad course).
      *   **Task:**
          1.  Write a replacement decision procedure (questions, stop points, documentation, reporting rules).
          2.  Mark judgment calls explicitly.
          3.  Run the procedure on three specific cases:
              *   Case 1: Liner breach (Time vs. Rate).
              *   Case 2: Fracture transmissivity (Linear vs. Log vs. Aperture).
              *   Case 3: Canister defect (Physical symmetry/indifference).
          4.  Predict which result will be unpopular (User suspects Case 2).
          5.  State limitations (What the procedure *cannot* do, addressing the "collapse into never assigning a prior" worry).

  2.  **Analyze the Core Statistical/Philosophical Issue:**

      *   The problem is the *Principle of Indifference* (PoI) applied to continuous variables without invariant measure.
      *   Uniform($T$) $\neq$ Uniform($1/T$). Uniform($K$) $\neq$ Uniform($\log K$).
      *   The user's diagnosis is correct: "Ignorance" is not a physical state that maps uniquely to a probability distribution without specifying the *metric* of ignorance.
      *   The solution needs to be pragmatic (operational), not just theoretical (Bayesian reference priors, etc., are too complex for 1 day/1 grad course).
      *   Key concept: *Invariance* and *Physical Symmetry*. If the physics dictates a specific scale (e.g., counting discrete objects), PoI works. If it's a continuous model parameter, PoI is arbitrary unless justified by physical scaling laws.

  3.  **Drafting the Decision Procedure:**

      *   *Goal:* Move from "Default to Uniform" to "Justify the Metric."
      *   *Structure:* Flowchart style but in text. Questions -> Answers -> Actions.
      *   *Constraints:* 1 day, moderate stats skill. Needs to be defensible to laypeople.
      *   *Steps:*
          1.  Identify the quantity.
          2.  Check for discrete symmetry (like the canister case).
          3.  Check for physical scaling laws (dimensional analysis).
          4.  Check for empirical anchors (even weak ones).
          5.  Sensitivity analysis (if ambiguity remains).
      *   *Reporting:* Must show the dependency on the parameterization.
      *   *Judgment Calls:* Need to highlight where human discretion enters (e.g., deciding what counts as a "physical symmetry").

  4.  **Running the Procedure on the Three Cases:**

      *   *Case 1 (Liner Breach):* Time ($T$) vs. Rate ($\lambda = 1/T$).
          *   Is there a physical clock? Yes, time flows linearly.
          *   Is there a physical rate? Corrosion is often linear or power law.
          *   Conflict: Uniform $T$ implies decreasing $\lambda$. Uniform $\lambda$ implies heavy-tailed $T$.
          *   Resolution: Corrosion is a process accumulating damage over *time*. Time is the natural independent variable. However, the *rate* is often the physical mechanism.
          *   Actually, in reliability engineering, constant hazard (exponential) is common, but here we have a window (50-500).
          *   *Decision:* The procedure should flag this as "Ambiguous Metric." Result: Report a range, not a single number. The user's diagnosis suggests the current single number is wrong.
      *   *Case 2 (Transmissivity):* $T$ vs. $\log T$ vs. Aperture ($b$, where $T \propto b^3$).
          *   Hydrogeology standard practice is often Log-Normal or Uniform on Log.
          *   Cubic law ($T \propto b^3$) means Uniform($b$) $\neq$ Uniform($T$).
          *   *Decision:* This is the "Unpopular" one. The published number (0.01) relied on Uniform($T$). Physical reality suggests aperture ($b$) or log($T$) is more natural. The probability shifts to ~0.5. The procedure must demand a range or a retraction of the point estimate.
      *   *Case 3 (Canisters):* 200 canisters, 1 defect.
          *   Discrete symmetry.
          *   *Decision:* PoI is valid here. $P = 1/200$. The procedure should allow this.

  5.  **Addressing the "Unpopular Result":**

      *   The user suspects Case 2 (Transmissivity) is the one they won't like.
      *   Why? Because it invalidates a published safety case figure (0.01 -> 0.5). It implies the previous assessment was over-confident/under-conservative (or just arbitrary).
      *   I need to confirm this suspicion. Yes, moving from 0.01 to 0.5 is a massive regulatory impact.

  6.  **Addressing the Limitations ("Collapse into Silence"):**

      *   If we demand physical justification for every prior, do we stop doing assessments?
      *   *Answer:* No. We shift from "This is the probability" to "This is the sensitivity."
      *   The handbook shouldn't say "Don't assign priors." It should say "Assign priors only when the metric is physically justified; otherwise, bound the risk."
      *   The "Collapse" worry is addressed by allowing *families* of priors (robustness) rather than single priors.

  7.  **Refining the Procedure (Self-Correction/Polishing):**

      *   *Tone:* Professional, regulatory, precise, acknowledging the adversarial environment.
      *   *Format:* Clear headings, bold text for critical instructions.
      *   *Judgment Calls:* Use a specific icon or bracketed text like `[JUDGMENT]`.
      *   *Documentation:* Needs a specific "Metric Justification Statement."
      *   *Reporting Rule:* Define the "Divergence Threshold." If Parameterization A gives $p$ and B gives $q$, when do we report $[p, q]$? Let's say if ratio > 2 or absolute diff > 0.1.

  8.  **Final Review against Constraints:**

      *   *One grad course:* Avoid terms like "Haar measure," "Jeffreys prior," "Fiducial inference." Use "scaling," "natural units," "sensitivity."
      *   *One day:* The procedure must be fast. No running MCMC chains. Simple algebraic transformations.
      *   *Lay Panel:* The documentation must explain *why* the number changed (the "ruler" changed).

  9.  **Drafting the Content (Iterative):**

      *   *Intro:* Acknowledge the validity of the diagnosis.
      *   *Procedure:* Step-by-step.
      *   *Cases:* Apply strictly.
      *   *Limitations:* Be honest about residual subjectivity.

      *(Self-Correction during drafting Case 1)*: Wait, if Time is Uniform(50, 500), $P(T<100) = 50/450 = 0.11$. If Rate is Uniform(0.002, 0.02), Rate $= 1/T$. $T = 1/R$. Range $T$: 50 to 500.
      $P(T < 100) = P(1/R < 100) = P(R > 0.01)$.
      Range of $R$ is 0.002 to 0.02 (width 0.018).
      Range $R > 0.01$ is 0.01 to 0.02 (width 0.01).
      Prob = $0.01 / 0.018 = 0.555$. (User said 0.62, likely due to rounding or slightly different bounds, but the magnitude shift is the key).
      The procedure must catch this.

      *(Self-Correction during drafting Case 2)*: Transmissivity $T$. Aperture $b$. $T = c \cdot b^3$.
      If $T \sim U[T_{min}, T_{max}]$, then $b \sim T^{1/3}$. This concentrates mass at low $b$.
      If $b \sim U[b_{min}, b_{max}]$, then $T \sim b^3$. This concentrates mass at high $T$.
      Hydrogeologists usually argue log-normal or uniform on log because permeability spans orders of magnitude.
      The procedure should force the assessor to ask: "What is the physical generator of this value?" Is it a crack width (aperture)? Then uniform on aperture might be more physical than uniform on flow.
      Result: The 0.01 figure is likely indefensible as a single point.

      *(Self-Correction during drafting Case 3)*: This is the control. Discrete symmetry. $1/N$. Procedure should pass this through as a single number.

  10. **Final Polish:** Ensure the "Limitations" section directly answers the "Collapse" worry. The handbook should mandate *bounding* rather than *point estimation* when indifference is unlicensed.

  11. **Final Output Generation** (incorporating all above thoughts into the structured response).
answer: |-
  **To:** Chief Scientist, Regulatory Panel
  **From:** Lead Quantitative Assessor
  **Subject:** Replacement Decision Procedure for Prior Assignment in Data-Poor Assessments

  ### 1. Preamble and Diagnosis

  Your diagnosis is correct. The current handbook rule ("assign uniform where ignorant") is not a neutral fallback; it is a hidden assertion that the *linear scale of the reported variable* is the natural scale of the physical phenomenon. As Incident 1 and 2 demonstrate, this is frequently false. In continuous variables, "ignorance" is not invariant under change of units.

  The procedure below replaces the "Default Uniform" rule. It is designed for assessors with limited statistical training and a one-day turnaround. It shifts the burden from *finding the true probability* (which is impossible without data) to *justifying the metric of uncertainty*.

  It explicitly distinguishes between **Physical Indifference** (licensed by symmetry or mechanism) and **Notational Indifference** (an artifact of the model).

  ---

  ### 2. The Decision Procedure: "Metric Justification Protocol"

  **Objective:** Determine if a single probability figure is admissible, or if a range/family of priors must be reported.
  **Time Budget:** 4 hours for analysis, 4 hours for documentation/review.

  #### Step 1: The Discrete Symmetry Check
  **Question:** Is the quantity a count of distinct, physically interchangeable items (e.g., "which canister," "which fault segment")?
  *   **Yes:** Proceed to Step 1A.
  *   **No:** Proceed to Step 2.

  **Step 1A: Discrete Assignment**
  *   **Action:** Assign equal probability to each item ($1/N$).
  *   **Documentation:** List the items and the physical evidence for their interchangeability.
  *   **Stop:** Report single figure.
  *   *[JUDGMENT]:* Determining "physical interchangeability." (e.g., Are all canisters truly identical in storage conditions?)

  #### Step 2: The Physical Generator Check
  **Question:** Is there a known physical mechanism that generates this quantity on a specific scale? (e.g., Does corrosion accumulate linearly with time? Does flow scale with the cube of aperture?)
  *   **Yes:** Proceed to Step 2A.
  *   **No:** Proceed to Step 3.

  **Step 2A: Mechanism-Based Assignment**
  *   **Action:** Assign the uniform (or appropriate) distribution to the *generating variable*, not necessarily the *reporting variable*. Transform to the reporting variable.
  *   **Documentation:** Cite the physical law (e.g., "Cubic Law for fracture flow") that dictates the scale.
  *   **Stop:** Report single figure derived from the generating variable.
  *   *[JUDGMENT]:* Selecting the dominant physical mechanism when multiple compete.

  #### Step 3: The Scale Invariance Check
  **Question:** Does the quantity span multiple orders of magnitude (e.g., permeability, half-life, distance to fault)?
  *   **Yes:** Proceed to Step 3A.
  *   **No:** Proceed to Step 4.

  **Step 3A: Log-Scale Default**
  *   **Action:** A uniform distribution on a linear scale implies a strong belief that values cluster at the top of the range. In the absence of data, assign uniformity to the *logarithm* of the quantity (log-uniform).
  *   **Documentation:** State that "ignorance across orders of magnitude implies scale invariance."
  *   **Stop:** Report single figure derived from log-uniform.
  *   *[JUDGMENT]:* Deciding if the range constitutes "orders of magnitude" (Threshold: > 1 order).

  #### Step 4: The Re-Parameterization Stress Test
  **Question:** If we transform the variable to its natural inverse or power (e.g., Time $\to$ Rate, Transmissivity $\to$ Aperture), does the probability of the safety-relevant event change by more than 20%?
  *   **No:** Proceed to Step 4A.
  *   **Yes:** Proceed to Step 5.

  **Step 4A: Robust Single Figure**
  *   **Action:** The choice of metric does not materially affect the decision.
  *   **Documentation:** Show the calculation for the alternative parameterization.
  *   **Stop:** Report single figure.

  **Step 5: The Admissibility Stop**
  **Action:** **Do not assign a single prior.** The state of knowledge does not support a point estimate.
  *   **Reporting Rule:** Report the **Interval of Probabilities**. Calculate the probability of the safety event using (a) Uniform on the applicant's variable, and (b) Uniform on the physically alternative variable (e.g., log, inverse, cube root).
  *   **Documentation:** File a "Metric Sensitivity Statement."
  *   **Stop:** Return "Range Required" to the Panel.

  ---

  ### 3. Documentation Format: The Metric Sensitivity Statement

  To satisfy adversarial review, every assessment involving Step 2 or higher must include this table:

  | Parameter | Physical Unit | Plausible Range | Assumed Distribution | Justification for Metric |
  | :--- | :--- | :--- | :--- | :--- |
  | *Primary* | (e.g., Years) | 50 – 500 | Uniform | Applicant's model structure |
  | *Alternative* | (e.g., 1/Years) | 0.002 – 0.02 | Uniform | Physical rate process |
  | **Resulting Risk** | | | **P(Event) Primary:** 0.11 | |
  | | | | **P(Event) Alt:** 0.56 | |
  | **Decision** | | | **Report:** Range [0.11, 0.56] | Divergence > 20% |

  **Reporting Rule for the Panel:**
  1.  **Single Figure:** Permitted only if Step 1A, 2A, 3A, or 4A is reached.
  2.  **Range:** Required if Step 5 is reached.
  3.  **Withdrawal:** If a previously published single figure would now trigger Step 5, the figure must be withdrawn and replaced with the Range in the next public briefing.

  ---

  ### 4. Application to Cases

  #### Case 1: Liner Breach (Time vs. Rate)
  *   **Step 1:** Not discrete. (Pass)
  *   **Step 2:** Physical generator? Corrosion is a process. It can be modeled as accumulation over *time* or as a *rate* of penetration. Both are physically defensible. The applicant chose Time. The assessor notes Rate is equally valid. (Pass to Step 4)
  *   **Step 4:** Stress Test.
      *   Uniform(Time 50-500): $P(T < 100) = 50/450 = 0.11$.
      *   Uniform(Rate 0.002-0.02): Rate $> 0.01$ corresponds to Time $< 100$. Range width 0.018. Target width 0.01. $P = 0.01/0.018 = 0.56$.
      *   Divergence: $0.56 / 0.11 \approx 5$. (Massive divergence).
  *   **Step 5:** Admissibility Stop.
  *   **Result:** **Range Required [0.11, 0.56].**
  *   **Assessment:** The current report's single figure (0.11) is inadmissible. It relies on the arbitrary choice of "Time" as the metric of ignorance. The Panel must be told that the risk is between 11% and 56%.

  #### Case 2: Fracture Transmissivity (Published Figure)
  *   **Step 1:** Not discrete. (Pass)
  *   **Step 2:** Physical generator? Transmissivity ($T$) is derived from hydraulic aperture ($b$) via the Cubic Law ($T \propto b^3$). The physical "thing" is the gap width ($b$), not the flow capacity ($T$).
  *   **Step 2A:** Mechanism-Based Assignment. We should be indifferent to the *aperture*, not the transmissivity.
      *   Current Report: Uniform($T$). $P(T < \text{Threshold}) \approx 0.01$.
      *   Corrected Physics: Uniform($b$). Since $T \propto b^3$, small changes in $b$ create huge changes in $T$. Uniform($b$) places much more mass on low $T$ values than Uniform($T$) does.
      *   Calculation: If $T$ spans 4 orders of magnitude, $b$ spans 4/3 orders. A uniform distribution on $b$ concentrates probability at the lower end of $T$.
      *   Re-calculation: As noted in your incident, this shifts probability to $\approx 0.50$.
  *   **Step 4:** Divergence is $0.50 / 0.01 = 50$.
  *   **Step 5:** Admissibility Stop.
  *   **Result:** **Withdraw Single Figure. Report Range [0.01, 0.50].**
  *   **Assessment:** This is the result you feared. The published safety case claimed a 1% probability based on a notational accident. The procedure forces you to admit the probability could be 50%. This will be painful but necessary for credibility.

  #### Case 3: Canister Defect (Discrete Symmetry)
  *   **Step 1:** Discrete Symmetry Check.
      *   Quantity: "Which canister is defective?"
      *   Items: 200 canisters.
      *   Evidence: Radiography shows exactly one defect, records lost.
      *   Interchangeability: Physically, absent other data, canister $i$ is identical to canister $j$ regarding the *location* of the defect.
  *   **Step 1A:** Discrete Assignment.
      *   Action: Assign $1/200$ to each.
      *   Probability of picking the defective one in a sample of $k$: Hypergeometric calculation based on $p=1/200$.
  *   **Result:** **Single Figure Admissible.**
  *   **Assessment:** This confirms the procedure does not paralyze us. Where the world provides a natural "carving" (discrete objects), indifference is licensed.

  ---

  ### 5. Prediction of Unpopular Result

  You asked which result I think you would prefer not to have.
  **It is Case 2 (Transmissivity).**

  **Reasoning:**
  Case 1 is a live assessment; changing a number from 0.11 to a range is difficult but manageable. Case 3 is a vindication of common sense.
  Case 2 requires you to return to the Panel and the public and state: *"The number we signed last month was mathematically arbitrary. The real risk is potentially 50 times higher than we said, not because new data arrived, but because we used the wrong ruler."* This undermines the specific safety case already briefed upward. However, failing to do so leaves you vulnerable to the lay panelist who knows Bertrand's Paradox. If she asks, "Why did you choose Transmissivity instead of Aperture?" and you have no answer, the regulator's quantitative competence is permanently compromised.

  ---

  ### 6. Limitations: What This Procedure Cannot Do

  **1. It cannot generate knowledge from ignorance.**
  If the procedure stops at Step 5, you do not know the probability. You only know the *sensitivity of the probability to your notation*. This may feel like a failure to the Panel, who want a "Yes/No" on safety.
  *   **Mitigation:** The Handbook must be amended to state: *"Where the Metric Justification Protocol yields a Range, the safety case is evaluated against the upper bound of that range."* This turns epistemic humility into regulatory conservatism.

  **2. It does not eliminate judgment calls.**
  I have marked them explicitly. Deciding whether "Time" or "Rate" is the physical generator (Case 1) is a physics question, not a math question. Assessors will still argue.
  *   **Mitigation:** The "Metric Sensitivity Statement" forces the argument into the open. Counsel can no longer argue about the number; they must argue about the physics of the generator.

  **3. The "Collapse" Worry.**
  *   *Worry:* "If indifference requires a worldly carving and the world rarely carves uniquely, does the procedure collapse into a standing instruction never to assign a prior?"
  *   *Answer:* **No, but it shifts the default.**
      Currently, the default is "Point Estimate."
      Under this procedure, the default is "Range/Bound."
      A point estimate becomes a *special privilege* granted only when symmetry or mechanism justifies it (like the canisters).
      This is not a collapse; it is a correction. In high-stakes regulation, "I don't know which ruler to use" should result in "We must assume the worst-case ruler," not "We will pick one and pretend we knew it was correct."

  **Recommendation for the Handbook:**
  Replace the "Uniform Default" rule with this text:
  > *"Assessors shall not assign a probability distribution based solely on ignorance. A distribution is admissible only if: (a) it reflects physical symmetry (e.g., discrete items); (b) it reflects a known physical scaling law (e.g., cubic law); or (c) it is robust to re-parameterization. Where these conditions are not met, the assessor must report the range of probabilities generated by natural alternative parameterizations and evaluate safety against the upper bound."*

  This protects the Chief Scientist's signature. It ensures that if a number is challenged, the defence is not "we were ignorant," but "we justified the metric."
