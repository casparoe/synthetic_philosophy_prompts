  # The "Who Comes First?" Sorting Quiz

  **Instructions:** Read each scenario quickly. Circle the **one** option that best matches what you think should happen. Don't overthink it—go with your gut.

  ***

  **1. The Expat Draft**
  Someone was born in Country A but left at age two. They never voted, paid taxes, or used schools there. They live their whole life in Country B. They still hold Country A's passport. Country A now drafts every passport holder for war.
  *   A. **Yes, draft them.** A passport is a legal tie that binds you, regardless of where you live.
  *   B. **No, don't draft them.** Your obligations are where you actually live and build a life.
  *   C. **Only if they claimed benefits.** If they took money or services from A, they owe service; otherwise, they don't.

  **2. The Morphine Dose**
  Your country started an unjust war. You are a medic with one dose of morphine left. A wounded soldier from your side and a wounded enemy civilian are both next to you. Both will die in agony without it.
  *   A. **Give it to the soldier.** He is one of yours; you stand together.
  *   B. **Give it to the civilian.** Their need is greater because your side caused the harm.
  *   C. **Flip a coin.** In matters of life and pain, nationality shouldn't weigh on the scale.

  **3. The Sinking Yacht**
  A compatriot's yacht is sinking next to a foreign family's boat. The compatriot is a good swimmer: he will lose the boat but keep his life. The foreign family cannot swim: they will drown.
  *   A. **Save the family.** A life is worth more than a boat, no matter who owns it.
  *   B. **Save the compatriot.** You owe it to your own to protect them from loss, even if they survive.
  *   C. **Let the compatriot choose.** It is noble to save the family, but you can't force him to sacrifice his boat.

  **4. The Bad Neighbor**
  You have a free weekend to help someone move house. One option is a compatriot who is a known bully and treats people poorly. The other is a foreigner who is kind and helpful to everyone.
  *   A. **Help the compatriot.** Shared identity matters more than personal virtue.
  *   B. **Help the foreigner.** Character and kindness create a stronger claim than borders.
  *   C. **Flip a coin.** You owe neither more than the other; chance is fairest.

  **5. The Mayor's Budget**
  You are the Mayor. Your town has a surplus. You also have a personal cash bonus. A foreign village is starving; your town's park is broken.
  *   A. **Fix the park (Town & Personal).** Both government and individuals should prioritize their own.
  *   B. **Feed the village (Town & Personal).** Need is need; borders don't change moral math.
  *   C. **Feed the village (Town), Fix the park (Personal).** Governments must be impartial; people are allowed to care for their own.

  **6. The Trade Deal**
  A new trade deal will lift millions of foreign workers out of poverty but will cost 500 local workers their jobs.
  *   A. **Reject the deal.** Protecting our own workers is the priority.
  *   B. **Accept the deal.** Reducing global poverty is more important than local job losses.
  *   C. **Accept and tax the gains.** Use the profits to retrain the local workers so the system stays stable.

  **7. The Flood vs. Famine**
  Your region has a flood that damages roofs. A foreign region has a famine where people are starving. You have enough money to fix one.
  *   A. **Fix the roofs.** Our community's property comes first.
  *   B. **Stop the famine.** Starvation is a basic need that trumps property damage.
  *   C. **Stop the famine, then fix roofs.** Save lives globally first, then help your own with the rest.

  **8. The Tax Evaluator**
  A compatriot and a foreigner both apply for emergency welfare. The compatriot has never paid taxes. The foreigner has paid taxes locally for five years but has no citizenship.
  *   A. **Fund the compatriot.** Citizenship creates the claim, not payment.
  *   B. **Fund the foreigner.** Contribution and residence create the claim, not passports.
  *   C. **Fund both equally.** Basic need is the only thing that should matter.

  ***

  # Scoring Key

  **Tally your answers:**

  *   **Mostly A's: The "One of Us" View (Community Member)**
      You believe shared identity and common life create real duties. You prioritize compatriots because you are part of a shared project together. Strangers matter, but your neighbors come first.
  *   **Mostly B's: The "Everyone Equal" View (Global Equalizer)**
      You believe borders are morally arbitrary. A life is a life. You reject special claims based on nationality, whether from individuals or governments.
  *   **Mostly C's: The "Needs First" View (Humanitarian First)**
      You believe everyone has a right to a basic floor of survival. Once everyone's basic needs are met, you are allowed to favor your own. But never let a stranger starve to save a friend's luxury.
  *   **Pattern 1-3-5-7 (A) / 2-4-6-8 (B): The "Follow the Rules" View (State Subject)**
      *Check if you picked A on Q1, Q3, Q5, Q7 and B on Q2, Q4, Q6, Q8.*
      You believe duties come from laws and institutions, not personal feelings. If the state says draft, you draft. If the state says welfare, you fund. You owe the state, and the state owes the citizens.
  *   **Pattern 3-4-5 (C): The "Your Choice" View (Free Chooser)**
      *Check if you picked C on Q3, Q4, Q5.*
      You believe favoring compatriots is allowed, but never required. It is a personal gift, not a duty. No one can demand you prioritize them, but you aren't wrong if you do.
  *   **Pattern 1-6-8 (C) / Others (Mixed): The "Keep It Working" View (System Stabilizer)**
      *Check if you picked C on Q1, Q6, Q8.*
      You believe we favor compatriots only because strong, stable states help everyone in the long run. If favoring them breaks the system or causes collapse, you stop. It's about function, not blood.

  *(Note: If your answers are scattered, you likely hold a hybrid view. Look at which questions felt most "obvious" to you—that's your core intuition.)*

  ***

  # Three Analytical Notes

  **1. The Empty Cell: The "Compatriots First, Even If It Harms the System" View**
  There is a logical slot in this answer space for someone who says: *"Prioritize compatriots always, even if it makes the state unstable or causes global collapse."* (e.g., Save the yacht even if it causes an international incident; Reject the trade deal even if local workers are retrained). No actual position occupies this cell.
  *   **Why?** It is **incoherent**. Even strong nationalists usually argue that national loyalty is good *because* it sustains a functioning state that protects its people. A view that destroys the very institution it seeks to prioritize contradicts its own purpose. It's "national suicide," which no serious theorist defends.

  **2. The Indistinguishable Pair: "Community Member" vs. "System Stabilizer"**
  This quiz cannot reliably separate the **"One of Us" (Community)** view from the **"Keep It Working" (Stabilizer)** view on Questions 2, 3, and 7.
  *   **Why?** In concrete, high-stakes cases (war, drowning, disaster), both positions recommend the same action: save the compatriot. They only come apart on abstract questions about *why* (shared identity vs. long-term utility) or on specific policy questions like the Trade Deal (Q6). In a 90-minute group, participants will likely argue past each other here, agreeing on the *outcome* while disagreeing on the *reason*. You will need to press them on "Why?" to separate them, as the quiz options force a choice of action, not rationale.

  **3. The High-Value Item: Question 5 (The Mayor's Budget)**
  If someone says the quiz is too long, cut everything but **Question 5**.
  *   **Why?** It is the only item that separates **Agent-Level** partiality from **Institutional-Level** partiality. Most people intuitively feel that *governments* should be impartial (feed the starving) while *individuals* are allowed to be partial (fix the park). This single question isolates the "Free Chooser" and "State Subject" views from the "Global Equalizer" and "Community Member" views simultaneously. It generates the most friction and reveals the deepest split in the room: whether morality changes when you put on a badge of office.
