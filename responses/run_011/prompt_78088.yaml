answer: |-
  Reject step (2).

  It looks solid because Athens lacked judicial review, fostering the "absolute sovereignty" thesis common in political theory, but it conflates raw power with procedural authority. Athenians distinguished between *nomoi* (standing laws) and *psephismata* (decrees); when the Assembly violated established procedural norms (as at Arginusae with separate trials), they acted *ultra vires*, rendering the decision unauthorized despite their sovereignty. The *graphe paranomon* existed precisely to police this boundary, proving that not every decree was automatically authorized.

  The price is high. In the Socrates chapter, you lose the *Crito*'s moral weight: if the trial was illegal, Socrates wasn't obeying "the Laws" but submitting to a criminal mob, turning him from a philosophical martyr into a victim of technical error. This undermines your load-bearing reliance on his concession to the laws, shifting your argument from political obligation to legal technicality. For Mytilene and Sicily, you risk losing the cases entirely unless you can prove specific procedural violations beyond mere panic or bad strategy. If the decrees followed authorized forms, they remain legitimate under your framework, forcing you to classify them as strategic failures rather than democratic pathologies. 

  You save your thesis by narrowing its scope: democracy fails not when it chooses poorly, but when it breaks its own rules. This preserves your procedural definition of legitimacy (1) but requires you to argue that Athenian democracy contained self-binding constraints it frequently shattered under pressure. You trade a broad critique of democratic wisdom for a sharper critique of democratic lawlessness. If you cannot prove procedural breach in Mytilene or Sicily, they must be cut, leaving Arginusae and Socrates as your core evidence of systemic procedural collapse.
