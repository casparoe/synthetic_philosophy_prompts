  I recommend adopting a dual-schema annotation policy that distinguishes "Molecular Activity" from "Biological Role," allowing both dispositional and historical data to coexist without conflating them.

  ### 1. The Dispute Beneath the Disagreement

  You are debating Selected Effect (SE) versus Causal Role (CR) theories of function. Your view follows the etiological lineage established by Ruth Millikan and Karen Neander: functions are defined by the selective history that maintained the trait in the population. An item functions only if it was preserved because it did that thing. Your collaborator advocates the systemic view articulated by Robert Cummins: functions are current capacities contributing to a system's complexity, regardless of history. If a part contributes to a capacity, it has a function. The funder's guideline to "describe only what the systems do" implicitly privileges CR, as SE requires inferring historical causes rather than observing current behaviors. However, true neutrality is impossible here because recording a capacity *as* a function is itself a theoretical commitment. To remain neutral, the database must distinguish between observed dispositions and evolutionary explanations, rather than pretending observation settles the question of biological purpose. The funder's rule resolves nothing because "what systems do" can mean "what capacities they manifest" (CR) or "what roles they were designed by selection to fulfill" (SE). By claiming neutrality while adopting CR language, the funder inadvertently sides with your collaborator. Real neutrality requires structural separation of these claims, not a semantic flattening that hides the philosophical disagreement behind ambiguous phrasing. You must expose the distinction to satisfy the guideline genuinely.

  ### 2. The Three Entries

  Case 1 (Neutral Duplicate): For you (SE), this is a pseudogene or non-functional duplicate; without selective maintenance, there is no function, only noise. It is an ancestral leftover, evolutionary debris destined for loss. For her (CR), the weak activity is a function because it contributes to the system's potential capacities. The divergence is ontological: you deny the existence of the function; she affirms it based on presence. If the database records this as functional, it misleads evolutionary biologists seeking adaptive traits; if not, it misleads biochemists seeking catalytic potential. In an extremophile, where genome streamlining is common, labeling neutrally drifting genes as functional obscures the organism's adaptive strategy.

  Case 2 (Lateral Transfer): You see a broken historical chain; the ancestral selection does not transfer with the gene, and new selection is unproven. The gene is in a new context, potentially undergoing exaptation. She sees a continuous capacity; the protein works, so it functions. Here, SE demands evidence of new retention, while CR accepts imported machinery as functional immediately. This touches on the nature of borrowing: is it a tool waiting for a use, or a use waiting for a tool? Your view requires re-validation of purpose; hers assumes continuity of capacity. For a newly sequenced organism, assuming continuity risks attributing donor ecology to the recipient.

  Case 3 (Heavy Metal): You argue this is a side effect; without environmental pressure, binding is accidental chemistry, akin to a spandrel. It is a biochemical possibility, not a biological job. She argues dispositional reality; the binding occurs regardless of ecology. This highlights the core split: SE ties function to ecological context and history, whereas CR ties it to intrinsic biochemical properties. In all three, your verdicts exclude items hers include, not because you disagree on the data, but on what counts as a function versus a mere capacity. Your rule protects the database from teleological error; hers protects it from incompleteness regarding biochemical potential. The stakes are high: your way risks under-reporting useful machinery; her way risks over-reporting biological purpose. In a public resource, these errors propagate differently: yours limits hypothesis generation; hers generates false positives.

  ### 3. The Strongest Case Against My Position

  The strongest objection to your SE view is epistemic and temporal. Phylogenetic history is often opaque; requiring proof of selection for every annotation paralyzes database curation. We simply cannot know the selection history for every gene in a newly sequenced extremophile. Furthermore, SE struggles with novelty. How does a new function arise? Before a trait is selected, it must exist as a capacity. If we deny function until selection is complete, we cannot describe the emergence of function. Consider "moonlighting" proteins: one gene product performs multiple tasks. SE often forces a choice of the *primary* selected effect, ignoring secondary beneficial capacities that are biologically real. Additionally, Bigelow and Pargetter argue for a forward-looking view: functions are defined by survival contribution now, not history. If a duplicate gene becomes essential tomorrow, denying it function today seems pragmatically wrong. Your rule risks labeling useful, active machinery as "non-functional" simply because the historical record is incomplete or the selection is recent. This creates a blind spot for emerging adaptations. In a public database, utility often trumps metaphysical purity; users need to know what a protein *can* do, even if evolution hasn't yet decided what it *should* do. Ignoring capacities limits the database's utility for synthetic biology and metabolic engineering, where potential matters more than history.

  ### 4. A Working Compromise

  Adopt a two-tier annotation schema modeled on the Gene Ontology. Create distinct columns: "Molecular Activity" (CR) and "Biological Role" (SE). Your collaborator populates "Activity" with all assay results, satisfying the funder's "what systems do" rule. You populate "Biological Role" only when evolutionary evidence supports selective retention. Use Evidence Codes (ECO) to tag entries: "Inferred from Experiment" for activities, "Inferred from Natural Selection" for roles. To live with this, you must concede that "Activity" entries belong in the database, accepting that capacities are data even if not functions. She must concede that "Activity" cannot be labeled "Function" without qualifying evidence codes. This separates observation from interpretation. The database remains neutral by presenting both data types distinctly, allowing users to filter by theoretical preference without forcing a metaphysical resolution on the curators. This satisfies the funder by describing behaviors while respecting your concern against misleading teleology. It transforms the impasse into a feature: the database becomes a tool for both mechanistic modeling and evolutionary analysis, serving both communities without conflating their distinct theoretical needs. Users can query for "what works" or "what matters," ensuring the resource remains robust across disciplinary boundaries.
