  You're right that I'm going to say the constraints are local to our world, but you're wrong to call that conceding the point. When you draw a configuration space, you're mapping out the nomological possibilities compatible with the laws of *this* universe, and of course everything off that sheet is forbidden *here*. But why think the laws of condensed matter physics dictate the boundaries of being itself? In my ontology, "forbidden" only gets grip relative to a world. There are worlds where the symmetry breaks differently, where the energy conditions fail, where the very dimensionality of space is distinct. The "thin sheet" you love is just the cross-section of reality that happens to contain us. Your physics training is smuggling in the assumption that the laws governing our neighborhood are the laws governing existence. If you treat our laws as metaphysical limits, you're doing exactly what I accuse the ersatzer of: taking a primitive notion of "physical necessity" and pretending it exhausts reality. So to answer your first question: "forbidden" means "not in this world," and it has no grip across the pluriverse because there are no cross-world constraints. That's not a bug, it's the definition of logical space.

  Now, what does this buy you? It buys you an analysis of modality that doesn't cheat. When you say a state is "forbidden" in your configuration space, you're relying on a prior notion of what counts as a valid solution to the equations. Where does that validity come from? Usually, it's mathematical consistency, but then you've just pushed the modality back into the math. I give you a world where "possible" means "exists somewhere" and "necessary" means "exists everywhere." You get a uniform ontology where the difference between what is and what could be is just a matter of location, not a matter of kind. You worry about the ontological bill, but look at what you're paying with: primitive modal operators that you can't reduce. I pay with more worlds; you pay with magic "coulds" that hang over reality without being part of it. So let me turn it back on you: when you say a configuration is "not a state at all," are you telling me about the world, or are you telling me about the limits of your model? Because if it's the latter, you're mistaking the map for the territory, and my plenitude is just the territory without the map's legends.
