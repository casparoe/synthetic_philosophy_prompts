          *   Bonus: A tag after the punchline that makes things worse for the Bayesian.
          *   Tone: Funny over clever.

  2.  **Deconstruct the Problem of Old Evidence:**
      *   Bayes' Theorem: P(T|E) = P(E|T) * P(T) / P(E).
      *   If E is old evidence, P(E) = 1.
      *   If P(E) = 1, then P(E|T) = 1 (usually, if T entails E).
      *   So P(T|E) = 1 * P(T) / 1 = P(T).
      *   Result: Learning that T explains E provides *no* confirmation for T, which contradicts scientific practice (Einstein *was* confirmed by Mercury).
      *   Proposed Solutions (the "embarrassing workarounds"):
          *   Pretend you didn't know E (counterfactual subjective probability).
          *   Conditionalize on the *fact that T explains E* rather than E itself.
          *   Relax logical omniscience (maybe you didn't *know* T entailed E).

