answer: |-
  # FORMAL EPISTEMOLOGY: TAKE-HOME ASSESSMENT

  **Time Allowed:** 48 Hours
  **Word Limit:** 1,500 words maximum
  **Total Marks:** 25 (50% of paper grade)

  **Instructions:**
  Answer all five parts. You may not cite external literature or named philosophers. All necessary definitions are contained in the stipulations below. Your answers must show all formal derivations. Philosophical claims must be explicitly linked to the formal features of the model.

  ***

  ### Stipulations

  1.  A *support structure* is a pair $\langle S, R \rangle$, where $S$ is a set of doxastic states and $R \subseteq S \times S$, with $tRs$ read as "$t$ is a reason for $s$." A *justification assignment* is a function $J: S \to [0, 1]$.
  2.  A state is *spontaneous* if nothing bears $R$ to it.
  3.  **DT (discounted transmission).** If $s$ has exactly one reason $t$, then $J(s) = r \cdot J(t)$, where $r$ is a fixed real number with $0 < r < 1$.
  4.  **RA (redundant aggregation).** If $s$ has exactly $n \ge 2$ reasons $t_1, \dots, t_n$, then $J(s) = 1 - \prod_i (1 - r \cdot J(t_i))$.
  5.  Every spontaneous state has $J = 1$.
  6.  An assignment is *admissible* for a structure if it satisfies clauses 3–5 at every state.
  7.  *Infinitist* structures contain no spontaneous states, every state has at least one reason, and $R$ is acyclic. *Coherentist* structures may contain cycles and need not contain spontaneous states. *Foundationalist* structures are acyclic, contain no infinite descending $R$-chains, and every maximal descending chain terminates in a spontaneous state.
  8.  Throughout, take $r = 3/4$ unless a part asks for general $r$.
  9.  Four structures are designated: **$T_\infty$**, the infinite binary tree in which every state has exactly two reasons, those two have their own two, and so on without end, no two branches ever rejoining and no state spontaneous; **$\Delta$**, three states each of whose reasons are the other two; **$\Gamma$**, two states each of which is the sole reason for the other; **$F_d$**, a finite tree of depth $d$ in which every non-terminal state has exactly one reason and every terminal state is spontaneous.

  ***

  ### Questions

  **(a)** Prove that in any acyclic structure with no spontaneous states in which every state has exactly one reason, every admissible assignment is identically zero. Then identify which of three ingredients is load-bearing — the absence of spontaneous states, the fact that $r < 1$, and the one-reason restriction — and for each state the minimal change that would admit a non-zero admissible assignment, together with whether an infinitist can make that change without ceasing to be an infinitist. [5 marks]

  **(b)** For $T_\infty$ under RA, show that the identically-zero assignment and the uniform assignment $J \equiv (2r - 1)/r^2$ (for $r > 1/2$) are both admissible, identify them as the least and greatest fixed points of the monotone operator that RA induces, and evaluate both at $r = 3/4$. The question must then ask what principle, if any, could select one semantics over the other, and must note that iteration from the bottom never leaves zero while iteration from any positive starting value climbs to the greater value — so the choice is not settled by the dynamics. [5 marks]

  **(c)** Determine the admissible assignments for $\Gamma$ and for $\Delta$ at $r = 3/4$. The question must then ask whether $\Delta$'s non-zero greatest fixed point, in a structure containing no spontaneous state and no contact with anything outside the triangle, is a refutation of the model or a formal statement of the isolation objection, and must require the student to say what a coherentist could concede here without abandoning coherentism. [5 marks]

  **(d)** Compute $J$ at the root of $F_d$ and explain why foundationalist structures admit a unique assignment where $T_\infty$ and $\Delta$ do not. Then ask what clause 5 smuggles in: what the model is structurally unable to say about spontaneous states — for instance about defeaters, and about whether a seeming's authority might itself depend on where it sits in the network. [5 marks]

  **(e)** Ask the student to evaluate the model rather than work inside it: is the collapse in (a) an artefact of treating justification as transmitted along a single channel rather than a genuine problem for infinite chains? Require at least one escape route for the infinitist, an account of what the infinitist gives up by taking it, and a verdict on whether the indeterminacy in (b) afflicts coherentism specifically or any view that permits unanchored support cycles. [5 marks]

  ***

  # MODEL ANSWER

  **(a)** Let $S$ be the structure described. Since $S$ is acyclic, has no spontaneous states, and every state has exactly one reason, every state initiates an infinite descending chain $s_0, s_1, s_2, \dots$ where $s_{i+1} R s_i$. By DT, $J(s_i) = r \cdot J(s_{i+1})$. By induction, $J(s_0) = r^n \cdot J(s_n)$. Since $J$ maps to $[0, 1]$, $J(s_n)$ is bounded. As $n \to \infty$, $r^n \to 0$ (given $r < 1$). Thus $J(s_0) = 0$. Since $s_0$ was arbitrary, $J \equiv 0$.

  The load-bearing ingredients are: (1) Absence of spontaneous states (no anchor $J=1$); (2) $r < 1$ (decay factor); (3) One-reason restriction (prevents RA boost).
  Minimal changes for non-zero $J$:
  1.  *Add spontaneous state:* Admits non-zero $J$. Infinitist cannot make this change; it violates the definition of infinitist structures (clause 7).
  2.  *Set $r \ge 1$:* Admits non-zero $J$. Infinitist can make this change structurally, but it violates stipulation 3 ($0 < r < 1$).
  3.  *Allow $\ge 2$ reasons:* Admits non-zero $J$ (via RA). Infinitist can make this change; clause 7 requires acyclicity and no spontaneous states, not a limit on reason count.

  **(b)** In $T_\infty$, every state has exactly two reasons. By symmetry, assume uniform $J(s) = k$. RA applies: $k = 1 - (1 - rk)(1 - rk) = 1 - (1 - 2rk + r^2k^2) = 2rk - r^2k^2$.
  Rearranging: $r^2k^2 - (2r - 1)k = 0$. Roots: $k = 0$ and $k = (2r - 1)/r^2$.
  At $r = 3/4$: $k = 0$ and $k = (1.5 - 1)/(9/16) = 0.5 \cdot (16/9) = 8/9$.
  These are the least and greatest fixed points of the operator $f(x) = 1 - (1 - rx)^2$. Iteration from $x_0 = 0$ yields $x_{n+1} = f(0) = 0$ (stays at zero). Iteration from $x_0 > 0$ (where $f'(0) = 2r > 1$) climbs to $8/9$.
  The dynamics do not select a unique semantics. A principle of *conservatism* (start from zero presumption) selects $0$; a principle of *maximal coherence* selects $8/9$. The formal feature driving this is the existence of multiple fixed points in the RA operator when $r > 1/2$.

  **(c)** For $\Gamma$: Two states, 1 reason each. DT applies. $J(s_1) = r J(s_2)$ and $J(s_2) = r J(s_1)$. Substituting: $J(s_1) = r^2 J(s_1)$. Since $r < 1$, $J(s_1) = 0$. Unique solution $J \equiv 0$.
  For $\Delta$: Three states, 2 reasons each. RA applies. Symmetry implies $J(s) = k$. Equation is identical to $T_\infty$: $k = 2rk - r^2k^2$. At $r = 3/4$, solutions are $0$ and $8/9$.
  $\Delta$'s non-zero point is a formal statement of the isolation objection: high justification arises purely from internal relations without external input. It is not a refutation of the model, but a demonstration that RA permits self-sustaining cycles. A coherentist could concede that coherence is necessary but not sufficient, requiring a constraint that rules out "floating" coherent sets (e.g., requiring input from spontaneous states), without abandoning the core claim that justification is a property of the system.

  **(d)** In $F_d$, the root is distance $d$ from terminal (spontaneous) states. Each step applies DT. $J(\text{root}) = r^d \cdot J(\text{spontaneous}) = r^d \cdot 1 = (3/4)^d$.
  Foundationalist structures admit a unique assignment because the boundary condition (Clause 5: spontaneous $J=1$) anchors the recursion. $T_\infty$ and $\Delta$ lack this anchor, allowing multiple fixed points.
  Clause 5 smuggles in infallibility or "givenness." The model cannot represent defeaters (which would lower $J$) or context-sensitive authority (where a spontaneous state's $J$ depends on its network position). It treats spontaneous states as structurally identical sources of maximal justification, ignoring their qualitative differences.

  **(e)** The collapse in (a) is an artefact of DT (single channel). Infinite chains are not inherently justification-draining if support aggregates. An escape route for the infinitist is to adopt RA (multiple independent reasons per state). By taking this, the infinitist gives up the intuition of a single linear chain of reasoning, moving toward a holistic web.
  The indeterminacy in (b) afflicts any view permitting unanchored support cycles, including coherentism and infinitism with loops (if loops were allowed). It is not specific to coherentism but to any system lacking a boundary condition. The formal feature is the lack of a spontaneous anchor combined with a non-linear aggregation function (RA) that allows amplification.

  ***

  # MARKING SCHEME

  **Total Marks:** 25
  **Pass Threshold:** 13 marks (A fluent taxonomy of positions with no derivations earns no more than a bare pass).

  **Part (a) [5 marks]**
  *   **Must-hit:** Proof of $J \equiv 0$ via infinite chain limit (2 marks). Identification of 3 ingredients (1 mark). Correct analysis of Infinitist constraints on changes (2 marks).
  *   **A Grade:** Explicitly notes that changing reason count preserves Infinitist structure while changing spontaneous status destroys it.
  *   **B Grade:** Proves zero result but vague on which structural definition prevents the "spontaneous" change.
  *   **Common Error:** Assuming acyclic + no spontaneous implies finite set (ignoring infinite chains).

  **Part (b) [5 marks]**
