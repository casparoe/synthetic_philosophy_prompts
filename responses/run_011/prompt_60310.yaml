  **Confidence Statement**
  I am highly confident in the algebraic derivations (parts a, b, c, d) as they follow directly from the stipulated equations. I am moderately confident in the philosophical glosses (parts c, d, e), particularly the interpretation of the "isolation objection" in part (c). The claim I am least sure of is the verdict in part (e) that the indeterminacy afflicts *any* view with unanchored cycles; while formally true in this model, some philosophical accounts of coherentism might deny that "unanchored" coherent sets are possible in reality, which would block the formal result from applying to the view. Settling this would require a premise linking the formal possibility of $\Delta$ to the metaphysical possibility of isolated coherent systems.
