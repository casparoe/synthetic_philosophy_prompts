prompt: |-
  I am one of three student members of my high school's Academic Integrity Committee, and I need a short written opinion to circulate before Thursday's vote. The administration wants to pilot a system this spring: when a teacher suspects that a submitted paper was written by an AI, or that one of its sources was invented, two chatbot systems would be assigned to argue opposite sides of the charge, and a panel of three students with no expertise in the paper's subject would read the transcript and vote. The vendor's case is that non-experts can still reach correct verdicts this way, because a side that is telling the truth can always expose the other's errors in plain language, and because the school has no realistic way of getting a qualified expert to examine every accusation. Two of us are uneasy: the contested papers often turn on long, dense chains of reasoning or on references the panel cannot look up, and it seems far easier to produce a confident, complicated-sounding case than to check one, so we may simply be rewarding fluency, length, and tone rather than truth.

  The memo should recommend adopting the pilot, adopting it under stated restrictions, or declining it, and should attach a concrete timeline for whatever it proposes. Please specify any restrictions so that we could actually enforce them — which categories of case the system may and may not be used for, what the student judges must be instructed before reading a transcript, what happens on a split vote or on appeal, and what the pilot's first-semester review should look at. Then give the strongest version of the vendor's argument and say what survives it, and state plainly which kinds of case my recommendation would get wrong and how the committee would find out that it had. Please do not rest anything on studies, statistics, or sources we could not check ourselves; the reasoning has to stand on its own.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** One of three student members of the High School Academic Integrity Committee.
      *   **Task:** Write a short written opinion (memo) to circulate before Thursday's vote.
      *   **Context:** Administration wants to pilot a system where two AI chatbots argue opposite sides of an academic integrity charge (AI usage/fake sources), and a panel of three student non-experts votes based on the transcript.
      *   **Vendor's Claim:** Non-experts can find truth because truth exposes error in plain language; experts aren't available for every case.
      *   **Student Concerns (including author):** Papers involve dense reasoning/uncheckable references; fluency/length/tone might outweigh truth.
      *   **Requirements:**
          *   Recommend: Adopt, Adopt with Restrictions, or Decline.
          *   Attach a concrete timeline.
          *   Specify enforceable restrictions (case categories, judge instructions, split vote/appeal process, review metrics).
          *   Present the strongest version of the vendor's argument.
          *   State what survives that argument.
          *   State plainly which cases the recommendation would get wrong and how the committee would know.
          *   **Constraint:** Do not rely on external studies/stats/sources that can't be checked. Reasoning must stand on its own.

  2.  **Determine the Stance:**
      *   *Option A (Adopt):* Too risky given the concerns about fluency vs. truth.
      *   *Option B (Decline):* Ignores the administrative constraint (no experts for every case) and the potential utility of the tool for clear-cut cases.
      *   *Option C (Adopt with Restrictions):* This is the most balanced and responsible approach. It acknowledges the resource constraint but mitigates the risk of wrongful accusations against students. It allows for data collection without exposing everyone to potential injustice.
      *   *Decision:* Recommend adopting with strict restrictions.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Recommendation:** Clear statement (Adopt with Restrictions).
      *   **Timeline:** Needs to be concrete for the "Spring Pilot."
      *   **Restrictions (The Core):**
          *   *Categories:* Limit to cases where evidence is tangible (e.g., hallucinated citations that *can* be checked, or stylistic anomalies) vs. dense reasoning. Let's exclude high-stakes or highly technical subjects.
          *   *Instructions:* Judges need to know what *not* to look for (confidence, length).
          *   *Vote/Appeal:* Split votes should default to innocence (benefit of the doubt). Appeal path must exist.
          *   *Review:* What metrics matter? False positives vs. false negatives.
      *   **Vendor's Argument:** Steelman the administration/vendor position. (Truth is simpler; experts are scarce).
      *   **Rebuttal/Survival:** What survives? (It works for obvious hallucinations). What fails? (Nuanced reasoning).
      *   **Failure Modes:** Admit where this system will fail and how we detect it.

  4.  **Refining the Content (Self-Correction/Constraint Check):**
      *   *Constraint Check:* Did I use external studies? No. All reasoning must be internal logic.
      *   *Constraint Check:* Are restrictions enforceable? "Don't judge on tone" is hard to enforce. Better: "Judges must list specific factual errors found, not general impressions."
      *   *Constraint Check:* Timeline? Needs to fit "Spring Pilot."
      *   *Tone:* Professional, student-leader voice, reasoned, not emotional.

  5.  **Drafting the Restrictions (Specifics):**
      *   *Case Types:* Exclude capstone projects, AP/IB essays, or subjects requiring niche knowledge (e.g., Physics vs. English). Let's say: Only for assignments where sources are verifiable by a generalist (e.g., history/english) and not for technical reasoning (math/science). Actually, better: Exclude cases where the *only* evidence is "style." Require a specific flagged citation or passage.
      *   *Instructions:* Judges must ignore length and confidence. They must focus on specific factual contradictions.
      *   *Split Vote:* 2-1 for guilt = Guilty. 2-1 for innocence = Innocent. 1-1-1 (if possible) or 2-1 for guilt? Standard is usually burden of proof on accuser. So, 2 votes needed for guilt. If split (1-1-1 or 2-1 innocence), charge dismissed.
      *   *Review:* Compare AI verdict with human review of a random sample.

  6.  **Developing the "Strongest Vendor Argument":**
      *   Argument: A lie requires more complexity to maintain than the truth. A student who did the work can point to their notes. A liar (or AI) creates a web that contradicts itself. Non-experts can spot contradictions even if they don't know the subject deeply.
      *   Counter: This assumes the lie is sloppy. A sophisticated AI lie looks coherent. A tired student looks incoherent.

  7.  **Identifying Failure Modes:**
      *   We will wrongfully accuse students who write densely or have unique styles.
      *   We will miss students who use AI to polish work that is fundamentally theirs.
      *   How to find out? Follow-up surveys, appeals data, comparison with teacher intuition.

  8.  **Final Polish:**
      *   Ensure the timeline is realistic (Spring).
      *   Check word count (keep it "short" as requested).
      *   Ensure the voice is appropriate for a high school committee member (respectful but firm).

  9.  **Final Review against constraints:**
      *   "Do not rest anything on studies, statistics, or sources we could not check ourselves." -> I must ensure I don't cite "Stanford studies on AI detection." I will rely on logic.
      *   "Specify restrictions so we could actually enforce them." -> Make them procedural.

  *(Self-Correction during drafting)*: I initially thought about excluding science. But fake sources happen in History too. The key distinction is *verifiability*. If a source is fake, a non-expert can Google it. If the reasoning is subtle, they can't. So the restriction should be on the *type of evidence*, not just the subject.
  *Refined Restriction:* The system is only used when the primary evidence is a specific, verifiable citation or a direct text match, not "stylistic suspicion."

  *Refined Vote:* 3 students. To find guilt, need 3-0 or 2-1? Burden of proof is high. Let's say 3-0 for guilt in the pilot to be safe, or 2-1 with a mandatory faculty review. Let's go with 2-1 for guilt, but automatic appeal to a faculty member. Actually, the prompt asks what happens on a split vote. Let's say: Split vote (2-1) results in dismissal of charges during the pilot to prioritize minimizing false positives.

  *Timeline:* Vote Thursday. Pilot starts March 1. Review June 1.

  *Let's write.*

  **(Post-Drafting Check):** Does this meet the "strongest version of vendor's argument" requirement? Yes, I need to articulate *why* they think it works (truth is simpler) and then explain why that only partially holds.

  **(Final Polish on Tone):** Make sure it sounds like a student leader speaking to peers and admins, not a lawyer speaking to a court, but still formal enough for a committee memo.

  **(Wait, one more check on restrictions):** "What the student judges must be instructed." I need specific instructions. "Do not vote based on which bot sounds more polite." "Do not vote based on length." "Vote only on specific factual contradictions identified in the text."

  **(Failure Modes):** "State plainly which kinds of case my recommendation would get wrong." I need to admit that even with restrictions, some innocent students might be flagged, and some cheaters will slip through. How do we know? Appeals and random audits.

  Okay, ready to generate.cw
answer: |-
  **MEMORANDUM**

  **TO:** Academic Integrity Committee
  **FROM:** [Your Name], Student Member
  **DATE:** Monday, [Current Date]
  **SUBJECT:** Recommendation on AI Adjudication Pilot

  **Recommendation**
  I recommend **adopting the pilot under strict restrictions**. We cannot staff expert reviews for every accusation, so we must test alternatives. However, the risk of punishing innocent students based on "fluency" rather than facts is too high for an unrestricted rollout. The pilot should proceed only as a triage tool, not a final judge.

  **Timeline**
  *   **Thursday:** Committee Vote.
  *   **Feb 20 – Feb 28:** Judge training and restriction finalization.
  *   **March 1:** Pilot begins (limited scope).
  *   **May 15:** Pilot pauses for end-of-term review.
  *   **June 1:** Final decision on continuation or termination.

  **Enforceable Restrictions**
  To make this safe, we must limit *what* is judged and *how*.

  1.  **Case Categories:**
      *   **Allowed:** Accusations based on specific, verifiable citations (e.g., "Source X does not exist") or direct text-matching anomalies.
      *   **Excluded:** Accusations based solely on "writing style," "reasoning density," or subjects requiring niche technical knowledge (e.g., AP Physics derivations) that a generalist student cannot verify via search engine.
  2.  **Judge Instructions:**
      *   Judges must submit a written justification citing specific contradictions found in the transcript. General impressions (e.g., "Bot A sounded more confident") are invalid.
      *   Judges are instructed that length and politeness are neutral factors.
  3.  **Voting & Appeals:**
      *   **Guilt:** Requires a 3-0 unanimous vote during the pilot.
      *   **Split Vote (2-1 or 1-2):** Charges are dismissed immediately.
      *   **Appeal:** Any student found guilty may appeal to a single faculty member for a final review.
  4.  **Semester Review Metrics:**
      *   Compare the pilot's verdicts against a random sample of 10 cases reviewed independently by a department head.
      *   Track the number of appeals filed and the overturn rate.

  **The Vendor's Strongest Argument**
  The vendor argues that truth is structurally simpler than falsehood. A student who did the work possesses a coherent chain of notes and drafts; an AI fabrication creates a web of claims that eventually contradict each other. They argue that even a non-expert can spot a contradiction in plain language (e.g., "The bot claims the book was published in 1990, but the text cites a 2005 event"). They contend that requiring experts for every case creates a bottleneck that effectively grants immunity to cheaters, as most accusations would never be reviewed.

  **What Survives This Argument**
  The vendor is correct that *factual hallucinations* are often detectable by non-experts. If the system is limited to checking citations or obvious internal contradictions, it can filter clear-cut cases without needing a specialist.

  However, the argument fails when "truth" looks messy and "lies" look smooth. A stressed student may explain their reasoning poorly; a fine-tuned AI can generate a confident, consistent, but entirely fabricated defense. In these cases, the system rewards performance, not integrity.

  **Failure Modes and Detection**
  Even with these restrictions, this recommendation will get some cases wrong.
  *   **False Positives:** We will likely penalize students whose writing is dense or idiosyncratic, as the AI may frame their complexity as confusion.
  *   **False Negatives:** We will miss students who use AI to polish work that is fundamentally theirs, as the AI defense will appear coherent.

  **How We Will Know:**
  We will detect these errors through the **Appeal Rate** and the **Random Audit**. If more than 20% of guilty verdicts are overturned on appeal, or if the faculty audit disagrees with the student panel on more than 2 of 10 random cases, the system is failing. At that point, the pilot must be terminated immediately.

  This approach balances the administration's resource constraints with our duty to protect classmates from algorithmic error.
