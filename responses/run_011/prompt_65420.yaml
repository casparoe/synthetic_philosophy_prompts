answer: |-
  *   **Position (a): Incompleteness.**
      *   *Claim:* Spreadless akrasia is possible.
      *   *Cost:* The discounting account is not a general theory of weakness of will; it is only a theory of *intertemporal* instability. It loses explanatory unity.
      *   *Benefit:* Preserves the logical integrity of the discounting model (it doesn't have to stretch to fit impossible cases).
  *   **Position (b): Denial of Premise.**
      *   *Claim:* No choice is truly spreadless; all outcomes have micro-temporal structure (anticipation, duration, relief).
      *   *Cost:* Risks empirical falsity. Requires agents to be sensitive to micro-delays they cannot perceive. Risks becoming a "just-so" story.
      *   *Benefit:* Saves the universality of the discounting account.
  *   **Position (c): Trivialization.**
      *   *Claim:* The model can fit spreadless cases by positing arbitrary micro-spreads.
      *   *Cost:* Makes the theory unfalsifiable. If any behavior can be modeled as discounting, the model explains nothing specific.
      *   *Benefit:* Maintains formal consistency of the theory at the price of content.
  *   **Preferred Verdict:** (a). The discounting account explains dynamic inconsistency, not synchronic weakness. Conflating them category-mistakes the phenomenon.

  ***

  The standard economic account of weakness of will, or akrasia, locates the pathology in the shape of the agent's discount function. On this view, a rational agent discounts the future exponentially, maintaining consistent preferences over time. An akratic agent, however, discounts hyperbolically: the value of a reward spikes disproportionately as it approaches the present. This curvature generates a preference reversal. At a distance, the larger-later reward is preferred; as the smaller-sooner reward draws near, its discounted value overtakes the larger-later option, and the agent succumbs. This is a powerful model because it mathematizes the intuition of being "overcome by the nearness" of temptation. However, the mechanism relies entirely on a differential in delay. The discount factor $D(t)$ applies to value $V$ such that $Present Value = V \cdot D(t)$. For a reversal to occur between Option A and Option B, the ratio $D(t_A)/D(t_B)$ must change as time passes. This requires $t_A \neq t_B$. If the payoffs are simultaneous, the discount factor cancels out, and the ranking remains stable regardless of the function's shape.

  This mathematical necessity gives rise to the problem of *spreadless* cases. These are stipulated scenarios where the competing payoff profiles are located at the same moment, or within a window too narrow for any discount function to distinguish. Yet, the agent judges one option better and chooses the other. If such cases are possible, they pose a direct challenge to the sufficiency of the discounting account. We must weigh three responses: admitting incompleteness, denying the possibility of spreadless choices, or absorbing the cases at the cost of triviality.

  Position (b) argues that no actual choice is spreadless. Proponents claim that the fine temporal structure of any real payoff stream is what constitutes the phenomenon. Even if two rewards seem simultaneous, one is experienced slightly before the other, or one carries an immediate anticipatory pleasure that the other lacks. On this view, the objection stipulates away its own subject matter by imagining an abstraction that does not exist in the psychology of action. There is always a spread, however minute, between the pang of guilt and the taste of the cake, or between the effort of restraint and the relief of indulgence. If there is a spread, there is a $t_A$ and a $t_B$, and thus the discounting machinery can engage.

  However, Position (b) faces a severe epistemic hurdle. For discounting to explain the action, the agent must be sensitive to the temporal spread that drives the reversal. If the spread is merely ontological—existing in the physics of neural firing but not in the phenomenology of the choice—it cannot guide the agent's deliberation. If the agent perceives the options as simultaneous, but the theorist posits a micro-delay to save the model, the model ceases to describe the agent's reasoning and instead describes a sub-personal causal chain. This shifts the account from a theory of action to a theory of behaviorism. Furthermore, if the theorist insists that *every* instance of akrasia hides a temporal spread, they risk making the claim unfalsifiable. Any counterexample can be dismissed by positing a finer grain of temporal resolution.

  This leads directly to Position (c). The account can absorb spreadless cases by redescribing them at ever finer temporal grains. If an agent chooses a immediate insult over silence, the theorist posits that the pleasure of the insult lands 100 milliseconds before the pain of social repercussion. By adjusting the temporal coordinates, the hyperbolic model can fit any choice pattern. But this victory is pyrrhic. A theory that is compatible with any behavior whatever ceases to explain anything. If the model can explain why an agent waits for a larger reward and also why an agent takes a smaller reward at the exact same moment (by positing hidden micro-delays), it loses its predictive power. It becomes a descriptive curve-fitting exercise rather than an explanatory framework. The cost of saving the theory via (c) is emptying it of content.

  Therefore, we are left with Position (a): spreadless akrasia is possible, and the discounting account is incomplete. This position accepts the logical limits of the discounting model. The discounting account is specifically a theory of *dynamic inconsistency*—the failure of preferences to remain stable over time. It explains why I plan to diet tomorrow but eat cake today. It does not, however, explain why I might eat the cake today even if I knew for certain that the health consequences and the taste pleasure were perfectly simultaneous, or if the choice was between two immediate options where one is judged better but the other is chosen due to immediate impulse unrelated to delay.

  Consider a case of immediate spite. An agent is insulted and can either respond with a witty retort (judged better all things considered) or throw a drink (judged worse). Both consequences—the satisfaction of the retort or the drink, and the immediate social fallout—occur in the same moment. There is no larger-later reward to sacrifice for a smaller-sooner one. There is only a better-now versus a worse-now. If the agent chooses the drink, this is akrasia, but it is not driven by a discounting reversal. It is driven by a synchronic conflict between judgment and impulse. The discounting model has no leverage here because there is no time differential to exploit.

  Defending (a) requires us to distinguish between *akrasia simpliciter* and *intertemporal weakness*. The discounting theorist often conflates the two, assuming that all weakness of will is essentially a failure of patience. Spreadless cases reveal that weakness of will can also be a failure of alignment at a single time slice. It shows that the human will is not merely a navigator of time, but a mediator of competing concurrent values. By accepting (a), we preserve the utility of the discounting model for the vast class of choices that do involve delay, without forcing it to bear the weight of explaining every irrational action. We acknowledge that hyperbolic discounting is a specific mechanism for a specific type of error, not the universal grammar of irrationality.

  The danger of rejecting (a) is that we distort the phenomenon of action to fit the model. If we insist on (b), we must claim that the agent throwing the drink is actually responding to a micro-temporal difference in payoff arrival. This is implausible on its face and reduces the agent to a passive reactor to temporal gradients rather than an active evaluator of reasons. If we insist on (c), we render the theory vacuous. Only (a) respects both the mathematics of discounting and the phenomenology of choice.

  Thus, the discounting account is entitled to claim that it explains *dynamic inconsistency* arising from temporal proximity. It is not entitled to claim it explains weakness of will as such. The existence of spreadless cases demonstrates that the architecture of human irrationality includes synchronic failures that no amount of temporal discounting can capture. To demand that the discounting account explain spreadless akrasia is to demand that a theory of time explain a phenomenon that, by stipulation, lacks temporal structure. The verdict must be that the discounting account is robust but partial. It illuminates the shadow cast by the future on the present, but it cannot explain the darkness that exists within the present moment itself.

