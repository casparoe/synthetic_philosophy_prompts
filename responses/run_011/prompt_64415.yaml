answer: |-
  **The white dot at the apex.**

  The hum of the amplifier was the only sound that didn't feel delayed. Ilse sat in the rolling chair, the leather cracked along the spine, watching the subject blink behind the EEG cap. The subject was a graduate student, paid fifty dollars to sit still and watch a clock that wasn't there, only a simulation on a monitor ten degrees off-center. The white dot swept the circle. Ilse had spent thirty years telling people that the moment the dot passed the top was the moment the brain began to move, half a second before the muscle fired. She knew now that the half second was a shadow, cast by a threshold crossed in noise. She looked at the tub of conductive gel on the cart beside her. The corner of a white envelope stuck out from underneath the plastic lid. The lawyer's letterhead was visible, the font bold and demanding. She didn't touch it. The subject's wrist rested on the armrest, palm up, waiting for the urge to flex. Ilse felt the cold air of the lab on her neck and remembered, absurdly, touching a hot stove ten years ago and feeling the burn before she saw the flame. Time didn't flow; it was edited after the fact.

  **The white dot passing the right-hand quadrant.**

  Duy stood behind the monitor bank, his back to her. He was typing, the keystrokes sharp against the room's low drone. On his screen, a waterfall of raw voltage traces scrolled upward, jagged and chaotic. Ilse watched his hands. He selected a block of trials where the subject had flexed early. He highlighted them. He hit delete. The smooth negative ramp that usually appeared on the main display—the beautiful, sloping curve that had funded their department and built her reputation—flickered and vanished. In its place, the averaged line flattened into a jittery zero. Duy didn't turn around. He ran the script again, this time keeping the trials where the noise spiked high enough to trigger the movement threshold. The ramp returned, smooth as a ski slope. He deleted it again. He was erasing the decision before it happened, showing that nothing decided anything until the random walk hit the wall. Ilse looked at the gel tub. The envelope corner seemed to pulse. She needed to check the impedance on channel four. She said this to the room, her voice flat. She didn't reach for the electrodes. She kept her hands in her lap. The impedance was fine. She just needed to say she was working, to fill the space where the truth used to be.

  **The white dot at the bottom, inverted.**

  The subject flexed. A sharp spike on the EMG trace marked the muscle twitch. On the main screen, the marker for the reported urge landed just a fifth of a second before the spike. The gap between the ramp's start and the urge was the space where free will used to live, before Ilse told the world it was empty. Now Duy's screen showed the gap was just an artifact of sorting noise. Ilse felt the weight of the letter under the gel tub pressing against the cart's metal shelf. The lawyer wanted her to say the ramp was real. He wanted her to say the brain had set the act in motion before the man knew he was choosing to kill. If she said yes, the defendant might live, but the science would be a lie. If she said no, the science would be honest, but her life's work would be a confession of error. She looked at Duy's back. He was saving the deleted averages to a folder named *Archive*. He wasn't deleting them to fix the data; he was hiding them to protect her. Or perhaps to protect himself from having to tell her. The hum of the amplifier shifted pitch, a slight warble that arrived before the power light flickered. She felt the change in her bones before she heard it. The past was already written, even the part that hadn't happened yet.

  **The white dot climbing the left side.**

  Ilse stood up. The chair wheels squeaked. She walked to the cart and lifted the gel tub. The envelope slid out, crisp and white against the gray metal. She held it in her left hand. The subject was waiting for instructions for the next trial, head lolling slightly inside the cap. Duy turned around, holding a mug of cold coffee. He saw the letter. He didn't ask. Ilse looked at the empty space where the lawyer would stand in court, the jury box, the judge's bench. She saw the defendant's face in the file photo, blank and terrified. She knew the honest version of the science wouldn't hold the weight the lawyer wanted. She knew the ramp was a trick of averaging. She knew the cancellation task showed a point of no return, but only late, after the noise had already climbed too high. She tightened her grip on the envelope. The paper crinkled. She spoke to the air, her voice loud enough for Duy to hear, loud enough to settle the matter. "Yes," she said. "We can say the choice was made before the feeling." Her right hand trembled, just once, a visible spasm that knocked the gel tub off the cart. It hit the floor with a wet slap, the lid popping open, green slime oozing onto the linoleum. Neither of them moved to clean it.

  **The white dot approaching the top again.**

  Duy stepped forward to help her with the cap. The subject sat still, eyes closed, waiting for the alcohol wipe. Ilse watched the green gel spread across the floor, catching the light from the monitor. It looked like a trace, a slow negative ramp spreading out from the center. Duy peeled the velcro straps on the cap, the sound sharp and tearing. He lifted the mesh away from the subject's hair. The smell of alcohol and sweat rose into the air. Ilse picked up the envelope from where it had fallen in the mess. She put it in her pocket. The amplifier hummed on, steady and indifferent. Duy handed her the alcohol wipes. She took them. The package snapped shut.
