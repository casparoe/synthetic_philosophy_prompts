answer: |-
  **Bottom Line**
  We cannot determine death now; the incomplete testing battery mandates withdrawal of support for circulatory determination.

  **What the record commits us to**
  Precedents A–I establish a hybrid standard that is internally tense. A, D, and F affirm that machine-supported somatic functions (movement, circulation, homeostasis) do not negate death if brainstem function is lost. Conversely, B and G explicitly reject a higher-brain standard: consciousness alone is insufficient for life (B), and motor incapacity alone is insufficient for death (G). C and H impose strict procedural constraints: confounders must be excluded, and determinations require completed testing batteries. I allows substrate testing when function cannot be measured, but H forbids ruling without *some* completed validation. The tension lies between H's procedural rigidity and D/F's substantive functionalism: is death a fact we discover via protocol, or a reality we recognize despite technical gaps?

  **Candidate Rules**
  **Rule 1: Procedural Validity.** Death is a legal status conferred only when statutory criteria are verified via completed, documented testing protocols. This rule centers H (no determination without completed battery) and C (confounders excluded). It treats tests not merely as evidence but as constitutive conditions for the declaration. Under this reading, I (substitute testing) is permissible only if the substitute is definitive and signed off. This rule strains to accommodate D (ECMO) if one argues circulation was technically ongoing, but resolves it by prioritizing the brain prong's *completed* testing. It makes H the gatekeeper: without a signed study or completed apnea test, the patient remains alive regardless of clinical appearance.

  **Rule 2: Functional Reality.** Death is the irreversible loss of biological function, where tests are proxies rather than prerequisites. This rule centers D and F (machines do not sustain life) and A (spinal movements irrelevant). It treats the clinical exam as primary, allowing ancillary tests only when the exam is compromised. This reading accommodates I (substrate testing) broadly: if the radiologist refuses to sign but the clinical picture is undeniable, death may still be declared. It strains against H, implying that insisting on a completed battery when function is obviously ceased is bureaucratic fetishism. It makes D central: machine circulation is irrelevant to the fact of brain death.

  **This Case under each Rule**
  **Under Rule 1 (Procedural):** We cannot declare death now. H forbids determination without a completed battery. The apnea test was aborted twice; the radionuclide study is inconclusive and unsigned. Neurologist 2 is correct: I does not license resting on a study the reader won't stand behind. We must proceed to DCD. Regarding circulatory cessation: E's five-minute window relies on native heart autoresuscitation statistics. Here, circulation is mechanical. Cessation occurs when the pump stops. However, because the pump can restart instantly, "irreversibility" (C) requires ensuring no decision to restart is made. The observation period serves not to watch for native return (impossible in chronic VF) but to confirm the permanence of the withdrawal decision.

  **Under Rule 2 (Functional):** We could declare death now if the clinical exam is deemed sufficient proxy. Neurologist 1 argues D and I allow this: the brain is dead, the scan is merely confirmatory. However, even under this rule, the radiologist's refusal creates epistemic doubt incompatible with "irreversible." If we proceed to DCD, the circulatory definition is clearer: the organism's circulatory function is the pump. When the pump stops, circulation ceases. The five-minute rule (E) is irrelevant; cessation is immediate upon shutdown. The conflict here is not about physiology but authority: does the physician's clinical judgment override the radiologist's signature? Rule 2 says yes; Rule 1 says no.

  **My Recommendation**
  Adopt Rule 1 (Procedural Validity). It best coheres with H, which is our strongest safeguard against error. The closest analog is H itself: we refused to record a determination whose battery was never completed, however unmistakable the picture. This case is H with higher stakes. Declaring death now relies on probability, not proof. B and G already foreclose the higher-brain standard you worry about: B confirms brainstem function sustains life without consciousness, and G confirms consciousness sustains life without movement. Neither supports declaring death based on loss of awareness alone. If we go the other way (Rule 2), we adopt the principle that clinical certainty overrides statutory protocol. This risks conflating *probability* of death with *determination* of death, turning the panel into a utilitarian body rather than a legal one. We must honor the statute's requirement for *demonstrated* cessation, not just inferred cessation.

  **What would settle it**
  Your hunch is wrong; an intact brain doesn't split these rules. The discriminating case is a patient meeting all clinical criteria for brain death where *every* ancillary test is physically impossible (no nuclear medicine access, severe facial trauma preventing reflex check, cord injury preventing apnea test). Rule 1 (Procedural) says Alive: no completed battery exists (H). Rule 2 (Functional) says Dead: function is demonstrably gone despite testing barriers (A/D). This forces us to choose between legal safety and biological reality.
