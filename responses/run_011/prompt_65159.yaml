answer: |-
  ### The Steering Committee Protocol: Standing & Role Assignment

  This procedure is designed for your three-person committee to decide who enters an accountability circle and in what capacity. It distinguishes between **Participation** (having a voice in the process) and **Facilitation** (holding the authority to guide the process). It relies on the concept of *Standing*: the right to hold others accountable is not inherent; it is earned through adherence to norms or the honest acknowledgment of violations.

  **The Intake Form (To be filled by the requestor)**
  1. What is the specific conflict/norm violation?
  2. What is your role in this conflict (Affected party, Witness, Interested member)?
  3. Are you aware of any past or current conduct of your own that resembles the issue at hand? If yes, describe status (Active, Resolved, Denied).

  **The Committee Decision Matrix (4 Questions in Order)**

  **Q1: Is the conduct substantively similar?**
  *   *Procedure:* Compare the requestor's record to the current conflict.
  *   *Sufficient Answer:* "Yes, it is the same rule/norm" or "No, it is distinct."
  *   *Threshold:* If **No**, proceed to Q4. If **Yes**, proceed to Q2.
  *   *Judgment Call:* Defining "substantively similar." (e.g., Is noise at 2 AM similar to noise at 10 PM? Is parking subletting similar to parking in a fire lane?)

  **Q2: What is the status of the requestor's conduct?**
  *   *Procedure:* Verify the record.
  *   *Sufficient Answer:*
      *   **Active:** The behavior is currently happening or unresolved.
      *   **Remediated:** The behavior stopped, amends were made, and a significant period of compliance has passed (suggest 6 months minimum).
      *   **Unacknowledged:** The behavior happened, but the member denies it was wrong or denies doing it.
  *   *Threshold:*
      *   If **Unacknowledged**: Disqualified from Facilitation. Discouraged from Participation (risk of derailing).
      *   If **Active**: Disqualified from Facilitation. Participation allowed *only if* they center their own struggle (see Q3).
      *   If **Remediated**: Proceed to Q4.

  **Q3: Does the requestor acknowledge the tension? (The Integrity Check)**
  *   *Procedure:* Ask the member: "How does your own record affect your ability to hold space on this?"
  *   *Sufficient Answer:* An explicit acknowledgment of the hypocrisy without deflection (e.g., "I am breaking this rule too, which makes it hard for me to judge, but I see the impact," vs. "It doesn't matter because I'm right.").
  *   *Threshold:*
      *   If **No Acknowledgement**: Disqualified from Facilitation. (You cannot facilitate accountability you refuse to be accountable to).
      *   If **Acknowledged**: May Participate. Cannot Facilitate if status is **Active**.

  **Q4: What role is being requested?**
  *   *Procedure:* Assign role based on previous answers.
  *   *Threshold:*
      *   **Facilitator:** Requires **Remediated** status OR **No Record** + **Community Standing** (known to parties, understands co-op history).
      *   **Participant:** Requires **Acknowledgement** of any Active/Remediated record.
      *   **Observer:** Assigned if **Active** status + **No Acknowledgement**.

  **Clearing Conduct (The Path to Restoration)**
  Past conduct is cleared for the purpose of *Facilitation* when:
  1.  **Cessation:** The behavior has stopped.
  2.  **Acknowledgement:** The member admits the past violation to the Committee.
  3.  **Amends:** Restitution was made to those affected.
  4.  **Time:** A minimum of 6 months of compliance has passed.
  *Note:* This does not erase the record; it restores *Standing*.

  **The "Values" Escape Hatch**
  If the Committee is split, or if the hypocrisy touches a core community value (e.g., safety, discrimination, financial integrity) rather than a procedural rule (e.g., noise, parking), the decision is **Deferred to Membership**.
  *   *Procedure:* Committee presents the conflict and the standing issue to the next general meeting. The group votes on whether the member has standing to facilitate.
  *   *Why:* This admits that standing is a social grant, not a logical fact.

  ***

  ### Application to Your Three Cases

  Here is how the protocol runs on your specific scenarios. I have followed the logic strictly, even where it contradicts your intuition.

  **Case 1: The Reformed Noise Maker (7 years ago, amends made)**
  *   **Q1 (Similarity):** Yes.
  *   **Q2 (Status):** Remediated (7 years is > 6 months, amends made).
  *   **Q3 (Acknowledgement):** Implicitly yes (understands the pattern).
  *   **Q4 (Role):** Wants to "sit on" (Participate).
  *   **Ruling:** **Allowed to Participate.**
  *   **Nuance:** Because the status is *Remediated*, they actually have *higher* standing than a newbie. They possess "lived experience of correction." They can speak to the possibility of change.
  *   **Facilitation?** If they asked to facilitate, they would be **Approved**. Their history makes them credible on *repair*, which is the goal of the circle.

  **Case 2: The Active Parking Violator ("Working on it")**
  *   **Q1 (Similarity):** Yes.
  *   **Q2 (Status):** Active (Still subletting).
  *   **Q3 (Acknowledgement):** Yes ("I know, I'm working on it").
  *   **Q4 (Role):** Wants to **Facilitate**.
  *   **Ruling:** **Disqualified from Facilitation. Allowed to Participate with conditions.**
  *   **The Hard Truth:** You said she "sees it clearly" and you might want her in the room. The procedure says **she cannot facilitate.**
  *   **Why:** Facilitation requires authority. Authority requires that you are not currently benefiting from the violation you are policing. If she facilitates, the message is "We enforce rules we are currently breaking." This destroys the circle's legitimacy.
  *   **Condition:** She may participate as a member *if* she opens with: "I am currently struggling with this same rule. I am not here to judge, but to share what I see." If she cannot make that statement, she is moved to Observer.

  **Case 3: The Newbie (Clean record, 6 weeks in)**
  *   **Q1 (Similarity):** N/A (No record).
  *   **Q2 (Status):** N/A.
  *   **Q3 (Acknowledgement):** N/A.
  *   **Q4 (Role):** Wants to **Facilitate**.
  *   **Ruling:** **Disqualified from Facilitation.**
  *   **Why:** This is not about hypocrisy; it is about **Community Standing**. Facilitation in a co-op is not just neutral mediation; it is stewardship of community norms. A member of 6 weeks does not know the history, the relationships, or the unwritten culture.
  *   **Verdict:** She can Participate as a witness if invited by the parties, but she lacks the *social capital* to Facilitate. Clean hands do not grant authority; trust does.

  ***

  ### Meta-Analysis: The Judgment Calls & The Slogan

  **1. Which steps are judgment calls dressed up as procedure?**
  *   **Defining "Remediated" (Q2):** I set a 6-month arbitrary line. Is 5 months enough if the amends were huge? Is 7 months enough if the member is resentful? The Committee must judge the *spirit* of the repair, not just the calendar.
  *   **Defining "Substantively Similar" (Q1):** Is parking similar to noise? Both are "rule-breaking." Or are they distinct categories? If a member breaks *any* rule, do they lose standing on *all* rules? The procedure assumes specificity, but members often argue "It's all about respect." The Committee has to draw that line every time.
  *   **The "Values" Escape Hatch:** Deciding what counts as a "Core Value" vs. a "Procedural Rule" is entirely political. One committee's "parking issue" is another committee's "equity issue" (if parking is scarce). This step admits the Committee cannot decide alone, but it doesn't tell you *how* to know when to punt.

  **2. Is your slogan wrong or incomplete?**
  *   **The Slogan:** *"Hypocrisy costs you your audience but not your argument."*
  *   **Verdict:** It is **Wrong** for this context.
  *   **Why:** That slogan applies to *truth claims* (e.g., "Smoking is bad" said by a smoker). In an accountability circle, you are not debating truth; you are exercising *authority*.
  *   **The Missing Piece:** **Standing.**
      *   In a co-op, the "argument" is not a logical proposition; it is a demand for behavioral change.
      *   If I demand you stop doing X, while I am doing X, I am not just unconvincing; I am claiming a privilege I have not earned.
      *   **Corrected Slogan:** *"Hypocrisy does not make your observation false, but it waives your right to enforce it."*
      *   **What's Missing:** The distinction between **Witnessing** and **Judging**.
          *   The Active Violator (Case 2) can *Witness* ("I see this happening").
          *   She cannot *Judge* or *Facilitate* ("You must stop").
          *   Your current slogan treats all speech as equal. Accountability circles require hierarchy of role.

  **3. The Uncomfortable Outcome**
  You suspected one case would come out against the person you'd most want in the room.
  *   **That person is Case 2 (The Active Violator).**
  *   You want her because she has insight ("I see it in him clearly").
  *   The procedure excludes her from *leading* because her insight is tainted by her current self-interest.
  *   **Why this is necessary:** If you let her facilitate, you teach the co-op that rules are optional for those with "insight." This creates a caste system of rule-breakers who are allowed to police others. It is better to lose her insight than to lose the legitimacy of the circle.
  *   **Compromise:** Let her speak first, under the condition of disclosure. "I am breaking this rule too." That turns her hypocrisy from a disqualifier into a bridge for the accused member ("Oh, even *she* struggles with this?"). But she cannot hold the gavel.

  **Summary for the Committee:**
  Stop asking "Is this person a hypocrite?" Start asking "Does this person have the standing to hold the space?"
  *   **Case 1:** Has Standing (Earned through repair).
  *   **Case 2:** Has Voice, No Standing (Active violation).
  *   **Case 3:** Has Clean Hands, No Standing (No trust/history).

  Use the protocol to assign roles, not to banish people. The goal is not purity; it is legitimacy.
