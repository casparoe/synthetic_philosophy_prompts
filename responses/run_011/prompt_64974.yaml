  ## VII. Why This Forces the Reversal

  You noted: *"The same student turns out to be a hard-assed textualist when they're writing rules... and a purposivist the second somebody else's rules are being applied to them."*

  *   **Round 1 (Applying):** They are faced with the **Gas Leak**. The text says "Guilty." Their conscience says "Not Guilty." To resolve the cognitive dissonance, they become **Purposivists**. They argue the *point* of the law wasn't to stop safety warnings.
  *   **Round 2 (Writing):** They are tasked with **codifying** that acquittal. They cannot write "Don't ban safety warnings." They have to write "Except in cases of imminent physical danger." They suddenly become obsessed with the definition of "imminent." They become **Textualists** because they fear a judge will abuse their exception.
  *   **Round 3 (The Trap):** When they see another group's text applied to the **Drone**, they revert to **Purposivism** to attack it. "Well, the *purpose* of the exception wasn't to allow drones!"

  They will not notice they switched sides unless you point it out in the Debrief. That is the moment the learning happens.
