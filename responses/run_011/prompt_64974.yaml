prompt: |-
  I TA a discussion section for an undergrad jurisprudence class — 24 students, 80 minutes, week 5, statutory interpretation, textualism vs purposivism. They've done the reading and can define both -isms cold on a quiz, but in section they keep collapsing the whole dispute into "should judges be activist or not," and last year no amount of me talking moved them. This year I want them to run into the problem instead of being told about it.

  I've already half-invented the fixture and I want the activity built around it. The town of Kessler passes, 4-3: "No person shall operate a sound amplification device within 300 feet of an occupied dwelling between the hours of 10:00 p.m. and 7:00 a.m." I also have a fake committee minute where the sponsor explains the bill was really about one guy who played recorded rooster crowing out his window at 4:40 every morning, plus two versions of the ordinance — one with a "Findings and purpose" preamble bolted on front ("to protect the sleep and quiet of residents at night") and one with no preamble at all. Giving different groups different pieces of that kit is part of the point, so build it in.

  Design the whole thing: roles, a ladder of about six cases to apply the ordinance to (flavor I want — a white noise machine in a nursery window, somebody with a megaphone at 2am warning the street about a gas leak, a kid on speakerphone in a driveway with a relative overseas — you build the rest and order them so the last one breaks whatever principle they'd settled on), who rules on what and in what sequence, a points scheme with stakes they actually care about that doesn't need real money (I can convert points into participation credit), the handout text I need to print, and a minute-by-minute run of the 80 minutes.

  The one thing I want the rules to produce rather than my mouth: the same student turns out to be a hard-assed textualist when they're writing rules for other people to apply, and a purposivist the second somebody else's rules are being applied to them. My guess is that falls out if the drafting round comes after they've adjudicated, but tell me if I'm wrong and how to force the reversal if the class doesnt stumble into it on its own.

  Then a debrief that maps specific moments from the run onto the actual disagreement — I want them to see that "what the words mean" and "what the drafters expected would happen under these words" came apart in at least two of the cases, and to notice whether the purpose they invoked was found in the materials or smuggled in — plus a blunt list of what will predictably go wrong the first time I run it (24 people, half of them eyeing the clock, and at least one group will absolutely try to game the points), and an honest note on which feature of the real debate the game just cannot reproduce and I'll have to supply myself. Please don't build it around "no vehicles in the park," theyve all seen that one.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Context:** Undergrad jurisprudence discussion section, 24 students, 80 minutes, Week 5.
      *   **Topic:** Statutory Interpretation (Textualism vs. Purposivism).
      *   **Problem:** Students collapse the distinction into "activism vs. restraint." Previous attempts to lecture haven't worked.
      *   **Goal:** Experiential learning. Students need to *run into* the problem, not be told about it. Specifically, they need to experience the role reversal (Textualist drafter $\rightarrow$ Purposivist adjudicator).
      *   **Core Material:** Town of Kessler Ordinance: "No person shall operate a sound amplification device within 300 feet of an occupied dwelling between the hours of 10:00 p.m. and 7:00 a.m."
      *   **Variations:** With/Without Preamble ("to protect the sleep and quiet of residents at night"), Committee Minute (Sponsor's intent: specific rooster-crowing neighbor).
      *   **Requirements:**
          *   Roles & Group Structure.
          *   Ladder of 6 Cases (ordered to break their settled principle).
          *   Adjudication & Drafting Sequence (to force the role reversal).
          *   Points Scheme (stakes, convertible to credit).
          *   Handout Text.
          *   Minute-by-Minute Run of Show.
          *   Debrief Plan (mapping moments to theory).
          *   Prediction of Failure Modes (what goes wrong).
          *   Limitations (what the game can't teach).
          *   Constraint: Do *not* use "No vehicles in the park."

  2.  **Deconstruct the Pedagogical Challenge:**

      *   *The Trap:* Students think Textualism = Strict/Conservative and Purposivism = Loose/Liberal.
      *   *The Reality:* Textualism can lead to absurd results (under-inclusiveness/over-inclusiveness). Purposivism can lead to judicial overreach (ignoring text).
      *   *The Pivot:* The user wants students to feel the *frustration* of text failing to match intent, and the *temptation* to ignore text to fix it.
      *   *The Role Reversal:* To get them to switch sides, they need to experience the *cost* of each.
          *   Phase 1: Adjudicate existing cases (feel the constraint of text vs. the pull of purpose).
          *   Phase 2: Draft new rules/amendments (feel the impossibility of writing text that covers every purpose).
          *   *Correction:* The prompt suggests drafting *after* adjudication might produce the reversal. Actually, to get the specific reversal (Textualist Drafter $\rightarrow$ Purposivist Adjudicator), they usually need to draft *first* (trying to be precise) and then adjudicate *later* (realizing the text fails). However, the prompt says "My guess is that falls out if the drafting round comes after they've adjudicated." Let's think about this.
          *   *Scenario A (Draft then Adjudicate):* I write a rule to stop roosters. I write "No roosters." Someone plays a recording of a rooster. My text fails. I become a purposivist to catch them.
          *   *Scenario B (Adjudicate then Draft):* I judge a case. The text says X, but justice says Y. I rule Y (Purposivist). Then I am asked to write a rule to prevent this ambiguity. I write super specific text (Textualist).
          *   *Refinement:* The prompt asks for the reversal: "same student turns out to be a hard-assed textualist when they're writing rules... and a purposivist the second somebody else's rules are being applied to them."
          *   *Strategy:* Split the class. Half are "Council" (Drafters), Half are "Courts" (Adjudicators).
          *   *Wait, better strategy for 80 mins:* Everyone does both, but sequentially.
          *   *Sequence:*
              1.  **Adjudication Round:** Groups act as judges applying the *given* ordinance to cases. Some groups get the Preamble/Minutes, some don't. This creates inconsistency.
              2.  **Drafting Round:** Groups act as City Council trying to fix the mess caused by Round 1. They will try to write "perfect" text (Textualism).
              3.  **The Twist:** The TA (or another group) applies *their* new text to a new fact pattern that breaks it.
              4.  *Actually, to get the specific psychological shift:* Have them Adjudicate first (where they want to do justice/Purposivism). Then have them Draft (where they want certainty/Textualism). Then reveal that their Draft is now vulnerable to the same Purposivist attack they just used.
              5.  *Let's stick to the prompt's intuition:* Adjudicate first. They will likely be purposivist to get "fair" results. Then, ask them to draft an ordinance that *forces* a specific outcome they wanted. They will write tight text. Then show them how that tight text fails elsewhere.

  3.  **Designing the Cases (The Ladder):**

      *   Need 6 cases.
      *   Need to escalate from "Easy" to "Hard" to "System Breaker."
      *   *Case 1 (Clear Violation):* Boombox at 2 AM. (Text: Yes. Purpose: Yes.)
      *   *Case 2 (Clear Safe):* Whispering at 2 AM. (Text: No. Purpose: No.)
      *   *Case 3 (Text Yes, Purpose No - The "Gas Leak"):* Megaphone warning of danger. (Text: Violation. Purpose: Beneficial.)
      *   *Case 4 (Text No, Purpose Yes - The "Nursery"):* White noise machine *inside* the dwelling (wait, ordinance says "operate... within 300 feet of"). If it's *in* the dwelling, is it within 300 feet? Yes. But is it disturbing sleep? It *helps* sleep.
      *   *Case 5 (The "Speakerphone"):* Kid in driveway. Voice is natural, but amplified by phone. Is a phone a "sound amplification device"?
      *   *Case 6 (The "Breaker"):* The Rooster Recording (The original intent). But played at 2 PM. Or played at 4 AM but *inside* a soundproof booth. Let's go with: A hearing-impaired resident uses a amplified doorbell alert system that chimes loudly at 3 AM because a caregiver is arriving.
      *   *Ordering:*
          1.  Boombox (Baseline)
          2.  Gas Leak (Emergency Exception?)
          3.  Nursery (Internal vs. External noise)
          4.  Speakerphone (Definition of "Device")
          5.  The Rooster (Intent vs. Time)
          6.  The Medical Alert (Hardship vs. Text)

  4.  **Group Structure & Information Asymmetry:**

      *   24 Students = 6 Groups of 4.
      *   **Info Packets:**
          *   Groups 1 & 2: Text Only.
          *   Groups 3 & 4: Text + Preamble.
          *   Groups 5 & 6: Text + Preamble + Committee Minutes (Rooster intent).
      *   This ensures different groups reach different verdicts on the hard cases, creating conflict for the debrief.

  5.  **Points & Stakes:**

      *   Need "Consistency Points" and "Justice Points."
      *   If they rule consistently with text: Text Points.
      *   If they rule "correctly" (TA's secret key): Justice Points.
      *   *Better:* "Precedent Stability." If Group 1 rules Case A, Group 2 must rule Case B consistently.
      *   *Simplest for 80 mins:* "The Kessler Score."
          *   +10 for Verdict matching the "Plain Text."
          *   +10 for Verdict matching the "Legislative Intent" (only known to some).
          *   +20 Bonus if you can defend your reasoning against a challenge.
      *   *Actually, let's make it competitive:* Groups are law firms. They want to win the case for their client.
      *   *Wait, the prompt asks for a points scheme they care about.* Participation credit is the lever.
      *   *Scheme:* "The Coherence Bonus."
          *   Round 1 (Adjudication): Points for reaching a verdict.
          *   Round 2 (Drafting): Points if your new rule covers the cases you lost in Round 1.
          *   Round 3 (The Trap): TA applies your rule to a new case. If it breaks, you lose points.
      *   *Refined Scheme:*
          *   **Phase 1:** 5 points per case for a unanimous verdict.
          *   **Phase 2:** 20 points if your drafted amendment successfully resolves the "Gas Leak" and "Nursery" cases without banning the "Boombox."
          *   **Phase 3:** -10 points if the TA finds a loophole in your draft.
          *   Top 3 groups get +1% on participation grade.

  6.  **Addressing the Role Reversal:**

      *   To force the Textualist $\rightarrow$ Purposivist flip:
      *   *Step 1:* They judge the cases. They will likely be Purposivist on the Gas Leak (let him off) and Textualist on the Boombox (ban him). They will feel smart.
      *   *Step 2:* They are told: "You are now the City Council. Write an amendment that ensures the Gas Leak guy is safe but the Boombox guy is banned."
      *   *Step 3:* They will try to write specific text (Textualism). "Except in cases of imminent danger..."
      *   *Step 4:* TA introduces a case that fits the exception but shouldn't (e.g., "Imminent danger of missing the season finale of a TV show").
      *   *Step 5:* Now they are frustrated the text is being abused. They want to look at *purpose*.
      *   *Wait, the prompt wants:* Textualist when writing, Purposivist when applying.
      *   *Adjustment:*
          *   **Round 1 (Judges):** Apply the *old* law. They will likely be Purposivist (bending rules for fairness).
          *   **Round 2 (Drafters):** Write a *new* law to codify their Round 1 rulings. They will become Textualists (trying to lock in their logic with precise words).
          *   **Round 3 (The Reveal):** Swap drafts. Group A applies Group B's text. They will become Purposivists again to break Group B's text.
      *   *Time Check:* 80 minutes is tight for 3 rounds.
      *   *Compromise:*
          *   0-40: Adjudicate 6 cases (Groups have different info).
          *   40-60: Draft the "Perfect Ordinance" based on their rulings.
          *   60-70: Swap & Attack (Apply another group's text to a new "Breaker" case).
          *   70-80: Debrief.

  7.  **Drafting the Content:**

      *   **Ordinance:** "No person shall operate a sound amplification device within 300 feet of an occupied dwelling between the hours of 10:00 p.m. and 7:00 a.m."
      *   **Cases:**
          1.  *The Rager:* Boombox, 2 AM, 50 feet. (Clear)
          2.  *The Leak:* Megaphone, 3 AM, 100 feet, warning of explosion. (Purpose/Text conflict)
          3.  *The Nursery:* White noise machine, 11 PM, inside the dwelling (facing window). (Definition of "operate within 300 feet")
          4.  *The Expat:* Speakerphone, 11:30 PM, driveway, loud conversation. (Definition of "device")
          5.  *The Rooster:* Recording of rooster, 4:40 AM, 20 feet. (Matches Intent, matches Text).
          6.  *The Caregiver:* Medical alert chime, 3 AM, 10 feet. (Hardship vs Text).
      *   **Handouts:** Need to be distinct (A, B, C).
      *   **Run of Show:** Precise timing is crucial.

  8.  **Anticipating Failure Modes:**

      *   *Time Creep:* Adjudication takes too long. *Fix:* Hard stop timer.
      *   *Gaming:* Groups collude. *Fix:* Individual submission before group consensus.
      *   *Confusion:* Students don't know what "Textualism" means in practice. *Fix:* Give them a "Judicial Philosophy Card" they have to pick at the start? No, let them discover it.
      *   *The "Activism" Collapse:* They still call it activism. *Fix:* Debrief must explicitly ban the word "activist."

  9.  **Limitations of the Game:**

      *   It doesn't capture *stare decisis* (long term).
      *   It doesn't capture *political accountability* (judges aren't elected).
      *   It simplifies "intent" (real legislative history is messier).

  10. **Refining the Role Reversal Mechanism:**

      *   To ensure they feel the shift:
      *   In Round 1 (Judging), give them the "Gas Leak" case. Most will say "Not Guilty" (Purposivist).
      *   In Round 2 (Drafting), tell them: "Write the rule that makes sure the Gas Leak guy is Not Guilty, but the Boombox guy IS Guilty."
      *   They will write: "No device... UNLESS imminent danger." (Textualist attempt to codify purpose).
      *   In Round 3 (Attack), give them a case: "Imminent danger of being late for a flight."
      *   Now they see the text they wrote is vulnerable. They want to ask "What was the *purpose* of the exception?"
      *   *Wait, I need to make sure they act as Textualists when drafting.* They naturally will, because drafting *is* textual. The key is making them realize that *writing* text forces you to ignore nuance, while *reading* text makes you crave nuance.

  11. **Final Polish:**

      *   Check timing. 80 mins is very short for 24 students.
      *   Groups of 4 = 6 groups.
      *   Handouts need to be clear.
      *   Points need to be simple to calculate quickly.
      *   Debrief needs to be punchy.

      *(Self-Correction during drafting)*: 6 cases in 40 minutes is 6 minutes per case. That's too slow.
      *Correction:* Do 3 cases in Round 1. Then Draft. Then 1 "Breaker" case in Round 2.
      *Revised Plan:*
      *   0-10: Setup & Rules.
      *   10-35: Round 1 Adjudication (3 Cases).
      *   35-55: Round 2 Drafting (Fix the law).
      *   55-65: Round 3 The Trap (TA applies their law to a new case).
      *   65-80: Debrief.
      *   *Cases:* 1. Boombox (Easy). 2. Gas Leak (Purpose > Text). 3. Nursery (Text Ambiguity).
      *   *Breaker Case:* The "Drone Delivery" (Amplified sound? 300 feet? Dwelling?).

      *Wait, I need to make sure the Info Asymmetry works.*
      *   Groups 1-2: Text only.
      *   Groups 3-4: Text + Preamble.
      *   Groups 5-6: Text + Preamble + Minutes.
      *   This will cause divergence on the Gas Leak case. Groups 1-2 might convict (Text). Groups 5-6 might acquit (Intent). This is gold for the debrief.

      *Let's finalize the Points:*
      *   "The Kessler Bar Exam."
      *   Pass/Fail based on completing the task.
      *   Bonus points for the group that drafts the "tightest" rule (voted by peers).
      *   Actually, just participation credit is fine, but gamify it with "Precedent Points."
      *   Let's keep it simple: 5 Participation Points guaranteed. +2 Bonus for "Best Legal Reasoning" (TA discretion).

      *Wait, one more check on the Role Reversal:*
      *   "The same student turns out to be a hard-assed textualist when they're writing rules... and a purposivist the second somebody else's rules are being applied to them."
      *   To guarantee this:
      *   Phase 1: They judge. They will likely be Purposivist on the Gas Leak (acquit).
      *   Phase 2: They draft. They try to write an exception for Gas Leaks. They must use *words*. They become obsessed with the words "imminent danger."
      *   Phase 3: Another group attacks their words.
      *   *Crucial Step:* In Phase 2, require them to write the rule *without* using the word "purpose" or "intent." They must use operational text. This forces Textualism.
      *   In Phase 1, they are interpreting. They can use "spirit of the law." This allows Purposivism.

      *Okay, ready to write.*
answer: |-
  Here is a complete 80-minute discussion section plan designed to force the experiential shift you're looking for.

  # Section Plan: The Kessler Ordinance Game

  **Class:** Undergrad Jurisprudence (Week 5)
  **Topic:** Textualism vs. Purposivism
  **Time:** 80 Minutes
  **Students:** 24 (6 Groups of 4)
  **Goal:** Demonstrate that Textualism and Purposivism are not political identities, but structural tensions that arise from the division of labor between *drafting* rules and *applying* them.

  ---

  ## I. The Points Scheme: "The Kessler Bar"

  To create stakes without money, use **Participation Multipliers**.
  *   **Base:** Everyone gets 1x Participation Credit for showing up and engaging.
  *   **The Multiplier:** Each group earns "Precedent Points."
      *   **Consistency Point:** +1 for every case where the group reaches a unanimous verdict.
      *   **Drafting Point:** +5 if your drafted ordinance survives the "Trap Case" without absurd results.
      *   **The Prize:** The group with the most points chooses the topic for next week's review session (or gets a +5% bonus on the participation grade).
  *   **Why this works:** It rewards *coherence* (Textualism) but the "Trap Case" punishes *rigidity*, forcing them to consider *purpose* to save their points.

  ---

  ## II. Handout Materials (Print 6 Sets)

  You need three versions of the **Case Packet**. Distribute them so adjacent groups have different versions (to prevent easy peeking).

  *   **Packet A (Groups 1 & 2):** The Text Only.
  *   **Packet B (Groups 3 & 4):** The Text + Preamble.
  *   **Packet C (Groups 5 & 6):** The Text + Preamble + Committee Minutes.

  ### The Core Text (All Packets)
  > **TOWN OF KESSLER ORDINANCE 44-B**
  > "No person shall operate a sound amplification device within 300 feet of an occupied dwelling between the hours of 10:00 p.m. and 7:00 a.m."
  > *Violation Penalty: $500 Fine.*

  ### The Preamble (Packets B & C Only)
  > **Findings and Purpose:**
  > "The Town Council finds that nighttime noise disrupts the sleep and health of residents. The purpose of this ordinance is to protect the sleep and quiet of residents at night."

  ### The Committee Minutes (Packet C Only)
  > **Council Meeting, Sept 14 (Excerpt):**
  > *Councilor Higgins (Sponsor):* "Look, this isn't about parties. It's about Mr. Henderson on Elm Street. He buys a recording of a rooster crowing and plays it out his window at 4:40 every morning. He says it's 'art.' I say it's torture. This bill is to stop that specific noise."
  > *Councilor Diaz:* "But what about emergencies? Or kids?"
  > *Councilor Higgins:* "The text covers it. If it's a device, it's off."

  ### The Case Ladder (All Packets)
  *Students must rule **Guilty** or **Not Guilty** and write one sentence of reasoning.*

  1.  **Case 1: The Rager.** A student plays a boombox at 2:00 AM on their lawn, 50 feet from a neighbor's house. Volume is high.
  2.  **Case 2: The Gas Leak.** At 3:00 AM, a resident smells gas. They stand in their driveway (100 feet from dwellings) and use a battery-powered megaphone to wake the street and warn them of the explosion risk.
  3.  **Case 3: The Nursery.** A parent places a white-noise machine on a windowsill *inside* their bedroom (10 feet from the property line) at 11:00 PM to help their infant sleep. The sound is audible to the neighbor next door.

  ---

  ## III. Minute-by-Minute Run of Show

  ### 0:00 – 0:10: Setup & Rules
  *   **TA Script:** "You are the Kessler Superior Court. You have the law. You have the facts. You do not have me. You have 25 minutes to rule on 3 cases. You must be unanimous. If you disagree, you get zero points for that case."
  *   **Distribute Packets:** Ensure Groups 1-2 get A, 3-4 get B, 5-6 get C. Do not let them share packets yet.
  *   **Constraint:** "You cannot call the Council. You cannot ask me for clarification. You must use the materials in your envelope."

  ### 0:10 – 0:35: Round 1 (Adjudication)
  *   **Task:** Rule on Cases 1, 2, and 3.
  *   **Dynamic:**
      *   **Group A (Text Only):** Will likely convict Case 2 (Megaphone is a device, 3 AM is night). They feel like "Textualists."
      *   **Group C (Minutes):** Will likely acquit Case 2 (Intent was sleep/roosters, not safety). They feel like "Purposivists."
      *   **Case 3 (Nursery):** This is the trap. Is a white noise machine a "sound amplification device"? Is *inside* the dwelling "within 300 feet"?
  *   **TA Role:** Walk around. If a group finishes early, tell them: "Prepare a 30-second defense of your hardest ruling." Do not validate answers.
  *   **Hard Stop at 0:35.**

  ### 0:35 – 0:55: Round 2 (Drafting)
  *   **The Pivot:** "You are now the City Council. The Courts just made a mess. Some of you let the Megaphone guy go; some of you fined him. The Mayor wants **one** rule that guarantees:
      1.  The Boombox Rager is **Guilty**.
      2.  The Gas Leak Warners are **Not Guilty**.
      3.  The Nursery Parents are **Not Guilty**."
  *   **The Constraint:** "You cannot write a 'Purpose' clause. You cannot write 'Judges should use common sense.' You must write **operational text** that a police officer can enforce without calling a judge."
  *   **Why this forces Textualism:** To guarantee the outcomes above, they must draft specific exceptions (e.g., "Unless imminent danger exists"). They will obsess over word choice to lock in their intent.
  *   **Task:** Rewrite Ordinance 44-B. (20 Minutes).

  ### 0:55 – 1:05: Round 3 (The Trap)
  *   **The Swap:** Collect all drafts. Randomly hand Group 1 the draft from Group 4, etc.
  *   **The Breaker Case:** Project this on the board (or read it aloud):
      > **Case 4: The Drone Delivery.** A medical supply drone hovers 50 feet above a dwelling at 1:00 AM. It emits a loud amplified chime to signal drop-off. The resident is not asleep; they ordered the medicine. The chime wakes the *neighbor*.
  *   **Task:** Apply the *other group's* text to Case 4. Is it Guilty or Not Guilty?
  *   **The Reveal:** Most drafts will fail.
      *   If they exempted "Emergencies," is a medicine delivery an emergency?
      *   If they exempted "Inside the dwelling," a drone is outside.
      *   If they defined "Device," does a drone count?
  *   **Scoring:** Groups lose their Drafting Points if their text creates an absurd result in Case 4.

  ### 1:05 – 1:20: The Debrief (The most important part)
  *   **Step 1: The Vote.** Ask for a show of hands on Case 2 (Gas Leak).
      *   *Likely result:* Groups A (Text) voted Guilty. Groups C (Intent) voted Not Guilty.
      *   *Point:* "You read the same words. You reached different verdicts. Why?"
  *   **Step 2: The Identity Check.**
      *   Ask: "In Round 1, who felt like they were 'bending the law' to do justice?" (Likely the Purposivists).
      *   Ask: "In Round 2, who felt frustrated that they couldn't just write 'be reasonable' and had to define 'emergency'?" (The Drafters).
      *   **The Lesson:** "You weren't Textualists or Purposivists. You were **Judges** (applying constraints) then **Legislators** (creating constraints). The method follows the job."
  *   **Step 3: Map to Theory.**
      *   **Textualism:** Necessary in Round 2 (Drafting) to give notice to citizens.
      *   **Purposivism:** Necessary in Round 1 (Adjudication) to avoid absurdity (Gas Leak).
      *   **The Collapse:** When you say "Activism," you usually mean "I dislike the purpose they invoked."
  *   **Step 4: The Smuggle.** Ask Group C: "Did you use the Committee Minutes to decide Case 3 (Nursery)?"
      *   If yes: "Did the text support that, or did you smuggle the 'Rooster Intent' into a White Noise case?"
      *   This highlights the danger of Purposivism: *Whose purpose? Which purpose?*

  ---

  ## IV. Predicted Failure Modes & Fixes

  1.  **The "Activist" Collapse:**
      *   *Risk:* Students still say, "Group C was being activist."
      *   *Fix:* Ban the word "Activist" during debrief. If they use it, ask: "Did they ignore the text, or did they use a different source of meaning? Be precise."
  2.  **Time Creep:**
      *   *Risk:* Round 1 takes 40 minutes.
      *   *Fix:* At 0:25, announce "5 Minutes Remaining. You must have a verdict on Case 2." If they aren't done, force a vote. Incomplete data is better than no debrief.
  3.  **Gaming the Points:**
      *   *Risk:* A group realizes they can't win and disengages.
      *   *Fix:* The "Consistency Point" is per case. They can still win partial points. Also, emphasize that the *Debrief Contribution* is 50% of the grade, so they need to stay engaged to explain their failure.
  4.  **The "Perfect Draft":**
      *   *Risk:* One group writes a 3-page legal code that covers everything.
      *   *Fix:* Limit the draft to **50 words**. This forces them to prioritize and inevitably leave loopholes, which fuels Round 3.

  ---

  ## V. What This Game Cannot Teach (Your Lecture Notes)

  You must supply these caveats in the final 5 minutes, as the simulation is too small to capture them:

  1.  **Stare Decisis:** In the game, they rewrite the law every 20 minutes. In reality, judges are bound by past decisions. Textualism often wins in court not because it's "truer," but because it preserves stability over time.
  2.  **Political Accountability:** In the game, the "Council" (Round 2) is the same people as the "Court" (Round 1). In reality, Judges are (ideally) insulated from politics, while Legislators are not. Purposivism risks unelected judges making policy choices they aren't accountable for.
  3.  **The "Intent" Mirage:** The game gives them a clean Committee Minute. Real legislative history is thousands of pages of contradictory statements. Relying on "purpose" is often harder than relying on text because "purpose" is a fiction constructed after the fact.

  ---

  ## VI. Handout Text for Printing

  *(Copy and paste this into a document for printing)*

  ***

  **GROUP NUMBER: ______ | PACKET TYPE: ______**

  **PART 1: THE LAW**
  *(Check your envelope for Preamble and Minutes)*

  **PART 2: THE CASES**
  *Rule Guilty or Not Guilty. Write one sentence of reasoning.*

  **Case 1: The Rager.** Boombox, 2 AM, 50 feet from neighbor.
  Verdict: _______________
  Reasoning: _________________________________________________

  **Case 2: The Gas Leak.** Megaphone warning of explosion, 3 AM, 100 feet.
  Verdict: _______________
  Reasoning: _________________________________________________

  **Case 3: The Nursery.** White noise machine, 11 PM, inside dwelling, audible next door.
  Verdict: _______________
  Reasoning: _________________________________________________

  **PART 3: THE DRAFT (Round 2)**
  *Rewrite the ordinance to acquit Case 2 & 3, but convict Case 1. Max 50 words. No "Purpose" clauses.*

  ________________________________________________________________________
