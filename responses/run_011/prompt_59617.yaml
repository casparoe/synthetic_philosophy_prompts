answer: |-
  ### Consultant's Analysis: Framing the Disagreement

  Before drafting the memo, it is useful to categorize the philosophical underpinnings of this conflict. As a philosopher of skill, I see three distinct ways to frame what is happening here. We need to choose the frame that best serves the public interest and the integrity of the certification.

  **Frame 1: Propositional vs. Procedural Knowledge (The Rylean Distinction)**
  *   **The Conflict:** The written exam tests *propositional knowledge* (knowing *that* pressure rises with temperature). The practical tests *procedural knowledge* (knowing *how* to braze a joint without leaking).
  *   **Implication:** If we view HVAC as a trade of pure action, the written exam is irrelevant. If we view it as an applied science, propositional knowledge is foundational.
  *   **Weakness:** This frame suggests the two are totally separate. In reality, expert technicians blend them. The "lucky habit" argument suggests procedural knowledge without propositional backing is fragile.

  **Frame 2: Reliability vs. Justification (The Epistemic Frame)**
  *   **The Conflict:** The 11 students demonstrated *reliability* (they got the right result). The committee opponents demand *justification* (they can explain *why* it was the right result).
  *   **Implication:** A "lucky habit" works until conditions change. Justification ensures adaptability. If a system behaves anomalously, the tech with only procedural knowledge may be stuck; the tech with justificatory knowledge can reason through the novelty.
  *   **Weakness:** High scores on a written exam do not guarantee a tech can apply that justification under pressure. One can memorize justification without understanding it.

  **Frame 3: Tacit Knowledge vs. Metacognition (The Expertise Frame)**
  *   **The Conflict:** Much of expert skill is *tacit* (unspoken, intuitive). The written exam forces *explicit* articulation.
  *   **Implication:** Your hunch aligns here. The ability to explain is not always concurrent with the ability to do. However, the ability to *retrieve* explicit knowledge during a failure (metacognition) is a marker of expertise.
  *   **Selection:** **This is the most productive frame.** It validates the students' practical success (tacit skill) while respecting the committee's safety concern (the need for metacognitive retrieval during troubleshooting).

  ***

  ### MEMORANDUM

  **TO:** State Community College HVAC Certification Committee
  **FROM:** [Your Name], External Consultant on Vocational Epistemology
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Written Theory Examination Standards

  #### 1. Executive Summary
  The committee is currently divided on the necessity of the standalone written theory examination for HVAC certification. Data from the last cohort indicates a discrepancy: 11 candidates failed the written exam but demonstrated high competence in practical application, with early employment data suggesting successful job performance.

  This memo recommends **replacing the standalone written exam with a Contextualized Diagnostic Assessment (CDA).** This approach maintains the requirement for theoretical understanding but measures it within the context of practical troubleshooting, rather than as an abstract academic exercise.

  #### 2. Philosophical Context: What is at Stake?
  We are not merely arguing about test formats; we are arguing about the nature of technical knowledge.

  *   **The "Lucky Habit" Objection:** One faction argues that without the ability to articulate theory, a technician possesses only a "lucky habit." This is a serious epistemic concern. If a technician cannot explain *why* a system failed, they cannot reliably predict *how* it might fail differently next time. They are operating on pattern recognition alone, which is vulnerable to novel situations.
  *   **The "Tacit Skill" Reality:** Conversely, philosophical research into expertise (e.g., Dreyfus & Schön) confirms your hunch: **Doing and explaining are distinct cognitive processes.** Expert action often becomes automatic and non-verbal. A written exam often tests test-taking ability or abstract recall rather than the ability to apply theory to a physical system.

  **Verdict on the Hunch:** Your intuition holds up. The ability to explain is not a prerequisite for *routine* action, but it is a prerequisite for *adaptive* action. The current written test measures abstract recall, not adaptive reasoning. Therefore, the test should be moved to the moment where adaptation is required: the troubleshooting phase.

  #### 3. Recommendation: The Contextualized Diagnostic Assessment (CDA)
  I recommend we **eliminate the standalone written theory exam** and replace it with a **Diagnostic Log** component embedded within the practical exam.

  **How it works:**
  1.  **Fault Insertion:** During the practical exam, instructors introduce specific, non-obvious faults into the HVAC unit.
  2.  **The Log:** As the candidate diagnoses and fixes the fault, they must complete a structured log. This is not a multiple-choice test. It requires:
      *   Recorded measurements.
      *   A brief written or recorded oral statement of the *hypothesis* before touching the component.
      *   A brief statement of *causality* after the fix (e.g., "The contactor failed because the coil voltage was low, caused by...").
  3.  **The Threshold:** Candidates pass if they fix the unit safely *and* demonstrate a correct chain of reasoning for the faults, even if their grammar or abstract theory definitions are imperfect.

  **Why this solves the deadlock:**
  *   **For the "Drop the Written" camp:** It removes the barrier of abstract academic testing that filters out talented hands-on learners who struggle with standardized tests.
  *   **For the "Keep the Written" camp:** It directly addresses the "lucky habit" objection. It proves the candidate isn't just swapping parts until it works; they must articulate the causal link between the symptom and the fix.

  #### 4. Steel-Manning the Opposition (Risks to Consider)
  To ensure robust decision-making, we must take the arguments for retaining the written exam seriously. Here are the strongest arguments against my recommendation:

  *   **Standardization and Bias:** A written exam is blind-graded. A Diagnostic Log evaluated by instructors introduces potential bias. An instructor who likes a student might accept a vague explanation that they would reject from another.
      *   *Mitigation:* We will need a standardized rubric for the Diagnostic Log with specific "key phrases" or causal links that must be present to earn points.
  *   **Safety Codes and Regulations:** Abstract written exams are good at testing knowledge of national codes (NEC, EPA) that might not come up in a specific practical scenario. A tech might fix a unit perfectly but violate a code they didn't encounter during the test.
      *   *Mitigation:* The Diagnostic Log must include a mandatory "Code Compliance" check-off section where the candidate cites the specific regulation governing their repair.
  *   **Scalability:** Grading 500 written exams is faster than reviewing 500 diagnostic logs or oral defenses.
      *   *Mitigation:* This is a resource cost we must accept if we value competency over efficiency. However, audio-recorded explanations can be reviewed at 1.5x speed by off-site graders to ensure fairness.

  #### 5. Evaluation Plan: Measuring Success
  If we adopt the CDA, we must verify that we are not certifying unsafe technicians. Over the next two years, we will track the following metrics to determine if this policy change was successful:

  1.  **The "Callback" Rate:** We will survey employers of certified graduates. We will compare the rate of "callbacks" (return visits to fix the same problem) between graduates certified under the old system vs. the new CDA system.
      *   *Hypothesis:* CDA graduates will have lower callback rates on complex issues, as they understand the *cause*, not just the symptom.
  2.  **Safety Incident Reporting:** Track any safety violations or accidents involving graduates within the first 24 months of employment.
      *   *Hypothesis:* Rates should remain stable or improve, proving that abstract theory was not the primary guardrail against accidents.
  3.  **Troubleshooting Efficiency:** During future practical exams, measure the time taken to diagnose novel faults.
      *   *Hypothesis:* If the "lucky habit" theory was correct, CDA graduates should struggle with novel faults. If my recommendation is correct, their ability to reason through the Diagnostic Log will translate to faster diagnosis of new problems.

  #### 6. Conclusion
  We should not certify technicians who cannot explain their work, but we should not require them to explain it in a format unrelated to the work. By moving the assessment of theory into the practical workflow, we respect the nature of skilled labor while maintaining the intellectual standards required for safety and adaptability.

  I look forward to discussing the rubric design for the Diagnostic Log at next month's meeting.
