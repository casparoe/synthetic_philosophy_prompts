      *   **The "State" Idea:** It helps. It moves away from "movie playback" to "cognitive environment."
      *   **The Device:**
          *   Does it survive? Strictly, no. Reading text in dreams is notoriously difficult/unstable (neural constraints). Pausing and resuming is high-level executive function usually offline in REM.
