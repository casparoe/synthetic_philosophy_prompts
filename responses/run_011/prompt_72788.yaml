answer: |-
  Your friend's storage experiment proves DNA is a viable *medium* for human encoding, not that the genome is a *container* for phenotypic information, and while your "protocol" metaphor correctly dismantles her inference, your objection about there being "no reader" was biologically false.

  Here is the menu of claims hidden inside the phrase "DNA is a code," ranked from trivial physical facts to substantive biological falsehoods:

  1.  **Physical Correlate:** Specific nucleotide sequences correlate reliably with specific physical outcomes.
      *   **Requirement:** Causal stability between sequence and effect.
      *   **Scope:** Whole genome.
      *   **Weight:** Trivially true; applies to any causal chain (e.g., tree rings encode age), bears no explanatory weight regarding "information."
  2.  **Combinatorial Chemistry:** Nucleotides function as discrete, interchangeable units rather than a continuous chemical soup.
      *   **Requirement:** Digital-like discreteness in bonding.
      *   **Scope:** Whole genome.
      *   **Weight:** True; explains stability and replicability, but not semantics.
  3.  **The Translation Map:** Triplets of nucleotides map to specific amino acids via cellular machinery.
      *   **Requirement:** A consistent lookup table (codon table) implemented by tRNA and ribosomes.
      *   **Scope:** Protein-coding regions only (~1-2% of human genome).
      *   **Weight:** Substantively true; this is the only literal "code" in biology, but it governs protein synthesis, not organismal architecture.
  4.  **Engineered Archive:** DNA can store arbitrary digital data if framed by external agents who define the encoding scheme.
      *   **Requirement:** Human intervention to write, frame, and read the data using imposed protocols.
      *   **Scope:** Synthetic inserts only.
      *   **Weight:** True; this is what your friend demonstrated, but it proves capacity, not natural function.
  5.  **Phenotypic Blueprint:** The genome uniquely specifies the organism's traits independent of developmental context.
      *   **Requirement:** One-to-one mapping between gene sequence and adult phenotype, ignoring environment and epigenetics.
      *   **Scope:** Whole genome.
      *   **Weight:** False; this is the claim required to say the genome "contains" the phenotype in the PDF sense.

  Your friend's data-storage success establishes Claim 4 exclusively. It demonstrates that DNA has the chemical stability and combinatorial density to serve as an archival medium *when humans act as the encoders and decoders*. It does not establish Claim 5, because the PDF retrieval relies on an external key and a standardized reader you built; the organism relies on a self-constructing system where the "reader" (the cell) is built by the "text" (the genome) in a recursive loop. Her argument commits a category error by conflating *using* a molecule as a storage device with that molecule *naturally functioning* as a storage device for the whole organism.

  Your alternative metaphor—that the genetic code is a protocol rather than a cipher—quietly defeats her inference. A cipher implies a static message waiting to be decrypted into a pre-existing meaning (the PDF model). A protocol implies a set of rules for interaction, negotiation, and construction where the outcome depends on the state of the system executing the rules (the developmental model). If DNA is a protocol, it does not "contain" the phenotype; it constrains the process that builds the phenotype. This validates your point that development supplies much of what is needed, as the protocol requires an environment to execute against.

  Regarding your specific objections, you must concede one to save the others. Your claim that there is "no reader" is empty; the ribosome is literally a reading machine, and the cellular machinery interprets genetic signals constantly. However, your claim that there is "no message" is precise if you mean "no semantic content independent of the interpreter," and your insistence that development supplies the context is the strongest argument you have. You lost ground by denying the existence of the biological reader, but you win the philosophical argument by denying that the reader extracts a static blueprint rather than executing a dynamic procedure.
