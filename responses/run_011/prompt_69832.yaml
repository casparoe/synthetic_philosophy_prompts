  ### Tier List

  *   **S Tier: Standing-consent (6).** It is the only account that dissolves the metaphysical deadlock by treating death as a regulatory threshold rather than a biological discovery, allowing donation to proceed without lying about physiology.
  *   **A Tier: Circulatory-respiratory (1) & Reversibility-horizon (5).** Circulatory wins on pragmatic inertia, while Reversibility lands here because it is a real sociological advance in honesty, though it merely relocates ambiguity from biology to resource allocation rather than solving it.
  *   **B Tier: Whole-brain (2) & Organism-as-a-whole (4).** Both are fading because they rely on biological integration criteria that modern life support and perfusion technologies increasingly render fictitious.
  *   **C Tier: Higher-brain (3).** Philosophically elegant but legally toxic; the epistemic risk of misdiagnosing consciousness imposes an unacceptable cost of error on vulnerable patients.

  ### Probability Estimate

  **0.65**

  US practice will likely shift because the organ shortage crisis forces expanded DCD protocols that already stretch the "irreversible" standard past recognition, and because perfusion technology will soon make dead organs viable again, collapsing the distinction between living and dead tissue.

  ### The Controversial Call

  The placement most likely to draw fire from both surgeons and philosophers is ranking **Standing-consent (6) as S Tier**. Surgeons will object because it removes the biological safe harbor that protects them from homicide liability, and philosophers will object because it abandons the project of defining truth in favor of administrative convenience. I would defend it because the current system requires clinicians to declare patients dead while their bodies remain warm and integrated, which erodes public trust more than admitting that donation is a moral permission slip rather than a biological fact.
