answer: |-
  This is a classic historiographical standoff, and your intuition that the "Novelist" analogy is being over-extended is well-founded. Your roommate is making a move that is common in introductory theory seminars: she is conflating *narrative construction* with *ontological equivalence*.

  Here is the audit you asked for, breaking down the mappings, the disanalogies, the status of the competing analogies, and the state of the field.

  ### 1. The Audit: Historian as Novelist

  Your roommate's argument rests on a structural isomorphism: if the *process* looks the same, the *product* must have the same status. Here is the mapping of the roles, followed by what the analogy silently imports.

  | Role/Function | In the Novelist's Trade | In the Historian's Trade |
  | :--- | :--- | :--- |
  | **Raw Material** | Imagination, memory, observation, other texts. | Archives, artifacts, testimony, data (traces). |
  | **Constraint** | Aesthetic coherence, thematic resonance, internal logic. | Evidence, archival silence, peer verification, causality. |
  | **Plot/Structure** | Invented to serve theme/character arc (Freitag's pyramid, etc.). | Imposed on events to make them intelligible (emplotment). |
  | **Characters** | Created to serve the plot; psychology is mutable. | Real agents; psychology is inferred from traces; cannot be changed. |
  | **Drafts** | Revised until the "story feels right." | Revised until the "argument fits the evidence." |
  | **Publisher/Gatekeeper** | Editor/Market (Does this sell/resonate?). | Peer Review (Is this evidenced/argued correctly?). |
  | **Reader's Contract** | Suspension of disbelief; emotional truth. | Claim to truth; referential accuracy. |

  **The Silent Imports**
  When your roommate says "Historians are Novelists," she is quietly importing three licenses that historians do not possess:
  1.  **The License to Invent:** A novelist can add a character to balance a scene. A historian cannot add a soldier to balance a battalion count.
  2.  **The Absence of a Referent:** A novel does not fail because "Madame Bovary didn't actually exist." A history book fails if "Napoleon didn't actually invade Russia."
  3.  **Success Criteria:** A novel succeeds if it is compelling. A history book succeeds if it is compelling *and* accurate.

  ### 2. The Disanalogies: Local Color vs. Critical Bites

  To evaluate her conclusion (that there is no non-question-begging way to prefer one account over another), we must separate disanalogies that are merely cosmetic from those that destroy the argument.

  **Local Colour (Does not save objectivity)**
  *   *Writing Style:* Both use metaphors, syntax, and rhetoric. (White is right here; history is written in language, not math).
  *   *Selection:* Both choose what to include and exclude. (Carr is right here; you can't tell everything).
  *   *Subjectivity:* Both are written by humans with biases.

  **Critical Bites (Destroys the relativist conclusion)**
  *   **Falsifiability:** If you find a letter dated 1914 from a general stating "We do not intend to mobilize," a standard historian *must* adjust the narrative. A novelist can ignore the letter if it ruins the chapter. The historian is held hostage by the trace; the novelist is not.
  *   **The Reality Constraint:** Historians operate under a "reality constraint." If two maps of London contradict on the location of the Thames, one is wrong. If two novels contradict on the location of a fictional street, both are valid. Your roommate's claim that the WWI standard account and a revisionist account are "just stories" fails because the revisionist account can be *demonstrably wrong* about troop movements, not just aesthetically different.
  *   **Community Verification:** Novelists do not generally check each other's footnotes. Historians do. This social mechanism is designed specifically to filter out "stories" that do not align with the material traces.

  **Verdict on the Roommate:** She is correct that history is *constructed* (White's point), but she is incorrect that construction implies *indifference to evidence*. She is conflating **epistemological humility** (we can't know the past perfectly) with **ontological relativism** (all accounts are equally valid).

  ### 3. The Other Analogies: Camera and Fisherman

  **The Camera/Mirror (Ranke)**
  *   **Status:** Mostly dead as a literal description, but alive as a regulative ideal.
  *   **Why it fails:** It implies passivity. It ignores that the historian chooses *where* to point the camera. It ignores that the "plate" (the historian's mind/language) is not blank.
  *   **Does it save objectivity?** No. It pretends selection doesn't happen. Your roommate is right to kill this one.

  **The Fisherman (Carr)**
  *   **The Image:** The historian fishes in a specific ocean (the past) with a specific net (theory/method).
  *   **Does it concede the roommate's conclusion?** No. This is the crucial point.
      *   **Selection vs. Invention:** The fisherman selects *which* fish to catch, but he cannot catch *shoes* and call them fish. The net filters, but it does not create the catch.
      *   **The Ocean Exists:** The fisherman analogy preserves the independence of the past. The ocean is there whether the fisherman fishes or not. The novelist analogy implies the ocean is made of the water the fisherman hauls up.
  *   **Verdict:** The Fisherman is a modest realist. It admits bias (mesh size) without surrendering to relativism (the fish are real). It is a stronger analogy than the Camera for modern historiography.

  ### 4. Your Intuition: Mapmaking

  You feel mapmaking is promising. You are right. In fact, among philosophers of history who want to avoid both Rankean naivety and Whitean relativism, this is often the preferred analogy.

  **Why it works:**
  1.  **Projection is Choice:** A Mercator projection distorts size to preserve shape. A historian might distort the complexity of individual lives to preserve the clarity of economic trends. Both admit this is a choice.
  2.  **Distortion is not Fiction:** A map that distorts Greenland's size is not a *fantasy map*. It is still a map of Earth. Similarly, a history that emphasizes class struggle over great men is not a *novel*. It is a different projection of the same terrain.
  3.  **Utility over "Truth":** We don't ask if a map is "True." We ask: "Is this the right map for hiking? For sailing?" We ask of history: "Is this account useful for understanding economic causality? For understanding cultural sentiment?"
  4.  **The Terrain Constraint:** You cannot map a mountain where there is a valley. The past constrains the map, even if the map doesn't copy the past 1:1.

  **Where it relocates the problem:**
  It moves the debate from "True vs. False" to "Useful vs. Misleading." A bad map isn't fiction; it's dangerous. A bad history isn't a novel; it's misleading. This allows you to reject the revisionist WWI account not because it's "not a story," but because it's a map that claims the Thames runs through Manchester.

  ### 5. Settled Consensus vs. Live Fights

  You asked for explicit demarcation of what is settled and what is contested. This is vital because your seminar might be presenting live fights as settled dogma.

  **Settled (or Near-Consensus)**
  *   **Pure Objectivism is impossible:** Almost no working historian today claims to be a "mirror." Everyone admits selection, bias, and the influence of the present on the past. (Ranke is dead).
  *   **Narrative is unavoidable:** Historians write in prose, not just data tables. Emplotment (structuring events into a story) is recognized as a necessary tool for communication and understanding.
  *   **Evidence matters:** Even the most postmodern historians generally agree that you cannot simply invent facts. Holocaust denial is not treated as a "valid alternative narrative" in the academy; it is treated as falsification.

  **Live Fights (Where your Roommate and Seminar are sparring)**
  *   **The Implications of White:**
      *   *Roommate's View:* White proves history is literature, therefore truth claims are rhetorical moves to silence rivals.
      *   *Counter-View (Many Historians):* White analyzed the *rhetoric* of history, not the *validity*. He showed history uses tropes, not that it lacks referents. Many argue White has been "vulgarized" by students into a relativist he wasn't.
      *   *Status:* **Unresolved.** There is no agreement on whether narrativism necessarily leads to relativism.
  *   **The Status of "Objective":**
      *   *View A:* Objectivity is a myth; we should aim for "intersubjective agreement" or "fairness."
      *   *View B:* Objectivity is a method, not a state of being. If you follow the methods (source criticism, peer review), the result is "objective enough" to distinguish from fiction.
      *   *Status:* **Live Fight.** This is the core epistemological battle in the field.
  *   **The "Linguistic Turn":**
      *   Does language *describe* reality, or does it *construct* it? If the latter, the Map analogy fails because the terrain itself is made of language.
      *   *Status:* **Niche but vocal.** Most working historians act as if the terrain is real, even if they admit their maps are constructed.

  ### Summary Recommendation for the Seminar

  If you need to push back in the seminar without sounding like a Rankean dinosaur:

  1.  **Concede the Camera:** Admit the "mirror" is broken. Historians select and interpret.
  2.  **Reject the Novelist:** Argue that *construction* does not equal *invention*. The "Reality Constraint" (archives, physical traces) limits the historian in a way that does not limit the novelist.
  3.  **Propose the Map:** Suggest that history is like cartography. Different maps (Marxist, Liberal, Diplomatic) show different features of the same terrain. Some maps are more useful; some are misleading; but none are fiction, and not all maps are equally accurate.
  4.  **On White:** Note that accepting White's analysis of *tropes* does not require accepting the roommate's conclusion about *truth*. One can acknowledge history is a verbal artifact without concluding that all verbal artifacts are equally valid.

  Your roommate is right that you cannot be a naive empiricist (Camera). She is wrong that the only alternative is radical relativism (Novelist). The Fisherman and the Mapmaker live in the middle ground, and that is where most actual historical work happens.
