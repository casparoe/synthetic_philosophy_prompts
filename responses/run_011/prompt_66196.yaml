          2.  Carr/Fisherman (Interactionism: selection bias, historian's context).
          3.  White/Novelist (Constructivism/Narrativism: history as literary artifact, plot imposition).
      *   **Roommate's Argument:** Historians = Novelists. Therefore, no objective way to prefer standard accounts over revisionist ones (relativism). Accuses the user of clinging to the "camera."
      *   **Task:** Audit the "Historian as Novelist" analogy.
          *   Map the roles (raw material, plot, characters, etc.).
          *   Identify disanalogies (critical vs. local color).
          *   Analyze what the novelist side imports (invention, obligation to referent, success criteria, authorship).
          *   Evaluate the Camera and Fisherman analogies in light of this.
          *   Evaluate the User's "Mapmaking" suggestion.
          *   **Crucial Constraint:** Distinguish between settled consensus and live scholarly debates (especially regarding Hayden White). Do not feign certainty where specialists disagree.

  2.  **Deconstruct the "Historian as Novelist" Analogy:**

      *   *Mapping:*
          *   Raw Material: Archives/Evidence vs. Imagination/Experience.
          *   Plot: Narrative structure vs. Invented plot.
          *   Characters: Historical agents vs. Fictional characters.
          *   Drafts: Revisions based on evidence vs. Revisions based on aesthetic/thematic goals.
          *   Publisher/Reader: Academic peer review/public vs. Market/Critics.
      *   *Disanalogies (The "Bite"):*
          *   **Constraint by Evidence:** Historians *cannot* invent facts. Novelists *can*. This is the biggest bite.
          *   **Obligation to Referent:** Historians claim to refer to real events. Novelists do not (usually).
          *   **Verification:** Historians are subject to falsification by new evidence. Novels are judged by coherence/resonance.
          *   **Ethical/Political Stakes:** Getting history "wrong" has different consequences than writing a "bad" novel.
      *   *Roommate's Conclusion:* If history is just a story, all stories are equal.
      *   *Counter:* The constraints on the historian limit the *range* of valid stories, even if they don't dictate a *single* story.

  3.  **Evaluate the Other Analogies:**

      *   *Camera/Mirror (Ranke):* Dead? Mostly. We know selection happens. But the *ideal* of accuracy remains. It fails on selection and interpretation.
      *   *Fisherman (Carr):* Modest? It acknowledges selection (mesh of the net). Does it concede the roommate's conclusion? No. A fisherman catches *fish*, not old boots (hopefully). The net filters, but the fish are real. It bridges Ranke and White.

  4.  **Evaluate the "Mapmaking" Analogy:**

      *   *Pros:* Acknowledges selection (scale, projection), distortion is inevitable but controlled, refers to real terrain, utility-based truth (is the map useful for navigation?), not fiction.
      *   *Cons:* Maps are spatial, history is temporal. Maps don't usually have "plots."
      *   *Verdict:* Stronger than Novelist for avoiding relativism while admitting construction.

  5.  **Address the "Live Fights" Constraint:**

      *   *Hayden White:* Did he say history is *fiction*? Or that it uses *fictional techniques*? There is a debate between "radical constructivists" (roommate's view) and "moderate narrativists" (White didn't deny evidence, just emphasized emplotment).
      *   *Objectivity:* Is it dead? Postmodernism says yes. Realists say no (it's a regulative ideal).
      *   *Consensus:* Almost no one is a pure Rankean anymore. Almost no one accepts pure relativism (Holocaust denial isn't just "another story").

  6.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the depth of the question. Validate the user's suspicion about the roommate's leap.
      *   *Section 1: The Audit (Novelist Analogy).* Create the table/mapping. Highlight the "Silent Imports" (invention, lack of referent).
      *   *Section 2: The Disanalogies.* Separate "Local Color" (writing style, deadlines) from "Critical Bites" (evidence constraints, falsifiability). This directly addresses the roommate's relativism.
      *   *Section 3: The Other Analogies.*
          *   Camera: Why it fails (passive), but why the *impulse* survives (accuracy).
          *   Fisherman: Why it's better (active selection, but real catch). Does it concede relativism? No, because the lake and fish exist independently.
      *   *Section 4: Mapmaking.* Validate the user's intuition. Explain *why* it works (projection = interpretation, terrain = past). Acknowledge limits (time vs. space).
