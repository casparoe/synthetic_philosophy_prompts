      *   **The "Less is More" Effect?** Too vague.
      *   **Page's Theorem** is the strongest academic anchor.
      *   I should coin/describe the specific dynamic: **"Anti-Correlated Error Synergy."**

  6.  **Addressing the "How to explain" part:**
