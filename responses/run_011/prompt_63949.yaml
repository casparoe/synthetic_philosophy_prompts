answer: |-
  This is a fascinating and counter-intuitive finding, but you haven't broken statistics; you've stumbled into a specific, well-documented corner of social choice theory and ensemble learning. You are correct that the Condorcet Jury Theorem and the standard "Wisdom of Crowds" narrative do not apply here, because both rely on assumptions your panel violates: independence of errors and random noise.

  Here is the breakdown of the concepts that describe your situation, why the standard models fail, what to call this phenomenon, and where the cliff edge lies.

  ### 1. The Core Concept: The Diversity Prediction Theorem
  The nearest established mathematical framework is **Scott Page's Diversity Prediction Theorem** (from *The Difference*, 2007).

  The theorem states:
  $$ \text{Collective Error} = \text{Average Individual Error} - \text{Prediction Diversity} $$

  *   **Collective Error:** How wrong the group is (your panel's 16% error rate).
  *   **Average Individual Error:** The average accuracy of the members.
  *   **Prediction Diversity:** The variance in the predictions (how much the members disagree with each other).

  **Why this fits:**
  When you trained the two biased raters, you lowered the **Average Individual Error** (they got more accurate personally). However, you drastically reduced the **Prediction Diversity**. Because they moved toward the center, they began agreeing with the other three moderate raters. In the equation above, the drop in Diversity was larger than the drop in Individual Error, causing the Collective Error to rise.

  **Where it stops fitting:**
  Page's theorem is usually applied to continuous numerical predictions (guessing the weight of an ox). Your case is binary voting (True/False). While the math holds (variance in binary votes is essentially the rate of disagreement), the *mechanism* in your case is more specific than just "diversity." It is specifically **negative correlation of errors**.

  ### 2. The Statistical Mechanism: Negatively Correlated Errors
  Standard ensemble theory (like Random Forests in machine learning) relies on **uncorrelated errors**. If Voter A is wrong, Voter B should be wrong randomly, not systematically.

  Your panel was working because of **negatively correlated errors**.
  *   **Rater Group 1 (Institutional):** False Negatives (call True claims False).
  *   **Rater Group 2 (Anti-Institutional):** False Positives (call False claims True).

  When a claim was tricky, Group 1 voted one way and Group 2 voted the other. The "Truth" was often in the tension between them. By training them to be "better," you made their errors **positively correlated**. They now make the *same* mistakes at the same time.

  **The Measurement Analogy:**
  You asked how this differs from ordinary error-cancelling in measurement.
  *   **Ordinary Measurement:** Assumes **Random Noise**. If you measure a table with 7 tape measures, some are 1mm long, some 1mm short. The average converges on the truth.
  *   **Your Panel:** Had **Systematic Bias**. Imagine you have two rulers. One is manufactured 5cm too long. The other is 5cm too short. If you average them, you get the perfect length.
  *   **The Intervention:** You calibrated the rulers. Now *both* are 1cm too long. Individually, they are much more accurate (1cm error vs 5cm error). But collectively, the average is now consistently wrong by 1cm, whereas before it was wrong by 0cm.

  ### 3. Naming the Phenomenon
  There is no single noun for "accuracy derived from offsetting biases," but in literature regarding ensemble learning and organizational behavior, it is often referred to as:

  *   **Bias-Variance Tradeoff (in a social context):** You reduced bias (individual inaccuracy) but increased variance in the *wrong direction* (correlated failure).
  *   **Constructive Conflict:** The sociological term for when disagreement produces a better outcome than consensus.
  *   **My Suggestion:** If you need a label for your report, call it **"Compensatory Bias"** or **"Adversarial Calibration."**

  However, the most precise description is **"Violation of the Independence Assumption."** The Condorcet theorem fails here not because the voters are incompetent, but because their incompetence is *coupled*.

  ### 4. The Edge: When does this stop working?
  You asked where offsetting bias stops being a mechanism and starts being a coincidence. This is the most critical risk for your nonprofit. This system is **fragile**.

  It stops working when:
  1.  **The Claim Distribution Shifts:** Your current accuracy relies on the mix of claims matching the mix of biases. If you suddenly get a week of 40 claims that are *all* institutional but true, your "anti-institution" raters will vote False, and your "pro-institution" raters will vote True. The majority might still work. But if you get 40 claims that are *non-institutional* and False, both biased groups might now agree on "False" (one because it's not official, one because it sounds like a lie), and you lose the cancellation effect.
  2.  **The Biases Drift:** Systematic bias is stable only as long as the psychological heuristic remains stable. If the "anti-institution" rater has a bad week and becomes randomly noisy, the cancellation breaks.
  3.  **The "Truth" Moves:** In fact-checking, truth is static. But in *perceived* truth, if public consensus shifts, your "biased" raters might actually become the accurate ones, and your "moderate" majority becomes the biased block.

  **The Coincidence Threshold:**
  It is a mechanism only if the biases are **structural** (based on worldview/heuristic) rather than **situational**.
  *   *Mechanism:* "I distrust banks" vs. "I trust banks." (Stable, offsetting).
  *   *Coincidence:* "I didn't sleep well" vs. "I read a blog post yesterday." (Unstable, random).
  Your raters sound structural. That makes it a mechanism you can count on *for now*, but it is not robust to changes in the input data.

  ### 5. How to Explain This to Your Coordinator
  You need to advocate for preserving the *diversity of error* without advocating for *incompetence*. Do not say "don't train them." Say "we need to train for independence, not conformity."

  **The Script:**
  > "The data shows our high accuracy comes from **error cancellation**, not just individual skill. We have raters who lean in opposite directions. When they disagree, it signals a complex claim that requires scrutiny.
  >
  > The training made the raters more accurate individually, but it also made them think more like the rest of the panel. This created **correlated error**. Now, when the panel is wrong, everyone is wrong together, whereas before, the dissenters would often save the majority.
  >
  > **Recommendation:** We shouldn't stop training, but we should change the goal. Instead of training them to match the 'correct' answer key, we should train them to recognize their own heuristic bias. We want them to know *why* they vote, not just to vote the way the sources suggest. We need to maintain **cognitive diversity** to keep the collective accuracy high."

  ### Summary
  *   **Concept:** Diversity Prediction Theorem / Negatively Correlated Errors.
  *   **Why Condorcet fails:** Violation of independence; voters are not better than coin flips individually, but their *combination* is.
  *   **Why Measurement fails:** This is systematic bias cancellation, not random noise averaging.
  *   **The Risk:** The system is fragile to changes in the types of claims processed.
  *   **The Fix:** Train for self-awareness of bias, not for alignment with the majority.

  You have discovered that in a binary classification system, **disagreement is a feature, not a bug.** Your panel isn't a jury; it's a hedge.
