prompt: |-
  Six months ago I started volunteering for a small nonprofit that rates viral claims as true or false. We get maybe forty claims a week, each one goes to a panel of seven volunteers who vote independently, and the majority becomes our public rating. An outside reviewer recently checked a sample of our past ratings against primary sources, so for the first time we have real per-person accuracy numbers, and they're not flattering. Not one of the seven is above 62% on their own. Two of them are actually below 50%, and reliably so, in the sense that they're wrong in a consistent direction: roughly speaking, one subgroup calls anything sourced from an institution true, the other calls anything that sounds like an official line false. But the panel's majority vote lands at 84% — way better than any single member, and better than our best person working alone would have been.

  Here's the part I have no word for. Last month we ran a short calibration training for the two institution-trusting raters, and it worked: their individual accuracy went from 47% and 49% up to 58% and 61%. And the panel's majority accuracy dropped, from 84% to something like 76%. I rebuilt the spreadsheet twice because I assumed I'd screwed something up, but it holds. With those two now leaning the same way as three of the others on borderline claims, the majority has started agreeing with itself in one direction, and the claims we used to catch by having people cancel each other out now sail through. So we have a commitee that's more accurate than any of its members, for a reason that gets destroyed when you make the members better. Our coordinator's instinct is obviously to train everybody, and I want to explain why that backfired here without sounding like I'm saying "please keep them bad."

  I know the Condorcet jury theorem is the neighborhood, but the version I learned needs each voter to be individually better than a coin flip and to err independently, and we have neither — a big chunk of our accuracy comes from the fact that people are wrong in mirror-image directions. It also doesn't feel like the usual wisdom-of-crowds talk, where the point is that lots of independent guesses average out noise, because what's doing the work for us isn't noise at all, it's two stable biases pointed at each other. So: is there an established concept for collective accuracy that depends on the parts being wrong in offsetting ways, such that improving one part makes the whole worse? I'd want to know what the nearest concepts are and exactly where each one stops fitting, and how this differs from ordinary error-cancelling in measurement, where you basically assume the deviations are random rather than two deliberate-looking leanings. And if nothing names it precisely, what would you call it, and where are the edges — at what point does offsetting bias stop being a mechanism you can count on and start being a coincidence you got lucky with?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **Context:** A nonprofit fact-checking panel (7 volunteers per claim, majority rules).
      *   **Initial State:** Individual accuracies are low (max 62%, two < 50%). The two low performers have *systematic biases* (one pro-institution, one anti-institution/conspiracy-leaning).
      *   **Outcome:** Panel majority accuracy is high (84%), significantly outperforming individuals.
      *   **Intervention:** Training improved the two biased individuals (47% $\to$ 58%, 49% $\to$ 61%).
      *   **Result:** Panel accuracy *dropped* (84% $\to$ 76%).
      *   **Mechanism:** The biases were offsetting (canceling each other out). Making them "better" (more moderate/accurate individually) made them agree more with the middle group, reducing diversity of error and causing the majority to lock into a specific (sometimes wrong) direction.
      *   **Goal:** Find a name/concept for this phenomenon (collective accuracy relying on offsetting biases), distinguish it from related concepts (Condorcet, Wisdom of Crowds, Measurement Error), and explain the boundaries (when does it stop working?).
      *   **Tone:** Intellectual, precise, empathetic to the awkwardness of explaining "don't train them."

  2.  **Identify Key Concepts & Literature:**
      *   *Condorcet Jury Theorem:* User already knows this. Requires $p > 0.5$ and independence. Here, we have $p < 0.5$ for some, and dependence (correlated errors).
      *   *Wisdom of Crowds:* Usually relies on independence and averaging (continuous variables). This is binary voting.
      *   *Diversity Prediction Theorem:* (Scott Page) Collective Error = Average Individual Error - Prediction Diversity. This is very close. If diversity drops, collective error rises, even if individual error drops.
      *   *Bias-Variance Tradeoff:* Usually in ML, but applicable. Reducing bias (individual accuracy) might increase variance (correlation of errors) or reduce the "error cancellation" effect.
      *   *Negative Correlation / Anti-Correlated Errors:* This is the statistical core. The errors are negatively correlated.
      *   *Superadditivity / Synergy:* The whole is greater than the sum of parts.
      *   *Dysfunctional Diversity / Constructive Conflict:* Sociological terms.
      *   *The "Fox and Hedgehog" analogy:* Maybe relevant (knowing one big thing vs. many little things), but not quite.
      *   *Specific Term:* **"Error Cancellation"** is the mechanism, but is there a specific name for the *paradox*?
      *   *The "Diversity Trumps Ability" Theorem:* (Page & Hong). This is the strongest fit. It mathematically demonstrates that a diverse group of problem solvers can outperform a group of high-ability individuals if the high-ability individuals think alike.
      *   *Correlated Error:* The training likely increased the *correlation* of errors among the raters.

  3.  **Synthesize the Explanation:**

      *   **The Core Concept:** The phenomenon is best described by the **Diversity Prediction Theorem** (Scott Page) or the broader concept of **Negative Correlation in Errors**.
      *   **Why Condorcet Fails:** Condorcet assumes independent errors. Here, errors are *structured*. The "worse" raters had *negatively correlated* errors with the rest.
      *   **Why Wisdom of Crowds Fails:** Standard WoC assumes random noise. This is *systematic bias* that happens to cancel.
      *   **The Paradox:** Improving individual accuracy reduced *cognitive diversity*, increasing error correlation.
      *   **Naming It:** There isn't one single perfect noun, but "The Diversity-Ability Trade-off" or "Correlated Error Collapse" fits. I should suggest a descriptive term like **"Adversarial Calibration"** or **"Offsetting Bias Synergy."** Actually, the most precise academic framing is **"The Diversity Trumps Ability Theorem."**
      *   **Measurement Analogy:** In measurement, you assume random noise (Gaussian). Here, you have systematic error (bias). If you have two rulers, one +1cm and one -1cm, the average is perfect. If you fix them both to be +0.2cm, the average is now +0.2cm (worse than 0).
      *   **The Edge/Boundary:** When does it stop being a mechanism? When the biases are no longer reliably opposite, or when the "truth" shifts such that both biases align on the wrong side. It relies on the *distribution* of claims matching the *distribution* of biases.

  4.  **Drafting the Response (Iterative refinement):**

      *   *Acknowledge the weirdness:* Validate that this is counter-intuitive but mathematically sound.
      *   *Primary Concept:* **The Diversity Prediction Theorem** (Scott Page). Equation: $CE = AE - PD$ (Collective Error = Average Error - Prediction Diversity).
      *   *Explanation:* Training reduced Average Error ($AE$) but reduced Prediction Diversity ($PD$) *more*.
      *   *Statistical Mechanism:* **Negative Correlation of Errors**. The "bad" raters were effectively hedging the "good" raters.
      *   *Distinction from Measurement:* Measurement assumes $Error \sim N(0, \sigma)$. Here $Error = Bias + Noise$. The Biases were $+B$ and $-B$. Averaging gave 0. Now Biases are $+b$ and $+b$. Averaging gives $b$.
      *   *Distinction from Condorcet:* Condorcet requires $p > 0.5$. Here, the "bad" raters were $p < 0.5$, but their *inverse* vote was valuable.
      *   *Naming:* Suggest **"Constructive Bias Cancellation"** or refer to it as a violation of the **"Independence Assumption."**
      *   *Advice:* How to explain to the coordinator? Don't say "keep them bad." Say "we need to preserve cognitive diversity." Train them to recognize their bias, not necessarily to conform to the mean. Or, weight the votes differently (though that's politically hard).
      *   *The Edge:* It stops working if the claim pool changes (e.g., fewer institutional claims), or if the biases drift. It's fragile.

  5.  **Refining the "Name":**
      *   Is there a specific paradox? The **Braess's Paradox** is about networks, not voting.
