prompt: |-
  I work in methods support for a hospital research office, and I keep running into an asymmetry between two fields I have to deal with that I cannot reconcile.

  On the clinical-trial side, we run randomized trials under protocols that specify interim analyses. An independent data monitoring committee examines the accumulating outcome data — unblinded, with treatment labels attached — at two or three pre-planned points. It may recommend stopping early for harm, and it may also recommend stopping early for overwhelming benefit. To hold the overall false-positive rate at five percent, the protocol applies a group-sequential adjustment: the significance threshold at each look is made considerably stricter than .05, usually by means of an alpha-spending function that allocates error probability across looks and permits the schedule of looks to shift within limits. Everyone treats this apparatus as a mark of rigor, and regulators expect it.

  On the behavioral-science side, the very similar-looking practice of enrolling participants until the p-value falls below .05 — checking the data repeatedly and quitting when the result looks good — is treated as among the worst offenses available, a paradigm case of p-hacking, and it is genuinely destructive: it can inflate false-positive rates to a large multiple of the nominal level. The reform movement's remedy is preregistration, which requires the analyst to fix the sample size and the analysis plan before any data are seen.

  Here is my difficulty. Both practices involve repeated looks at accumulating data under the possibility of early stopping. One is praised, the other is scorned. The obvious reply is that the trialist pre-commits to a stopping rule and pays for the extra looks with a stricter threshold, whereas the p-hacker does neither. But if that is the whole difference, then what the machinery protects does not look like the evidential force of the data actually gathered: two researchers who collect identical data and stop at an identical point receive different verdicts, because one of them held a different plan concerning observations that never occurred. I do not see how a plan about counterfactual data can be a property of evidence.

  Could you work through what this arrangement presupposes? Specifically:

  1. Reconstruct the implicit account of what a p-value is and what it measures, on which the trial's machinery is mandatory and the behavioral researcher's superficially parallel conduct is fatal. State as precisely as you can what each practice must take "the data" to consist of.

  2. Say whether the standard reconciliation — pre-specification plus adjusted thresholds — actually answers my objection or merely relocates it. If it relocates it, say to where.

  3. Separate what the practice strictly requires from what it merely sits comfortably with. In particular: which components of the trial apparatus would survive, and which would collapse, under a view on which inference consists in updating degrees of belief on the data in hand? Is preregistration's insistence on fixing the sample size in advance intelligible on such a view at all, or does it become a piece of ritual left over from the framework it replaced? I would also like to know where the existing arrangement is philosophically underdetermined — where more than one theory of evidence would license the same rules.

  4. Identify where the two practices are inconsistent with each other, and where either is inconsistent with itself. Candidates I have in mind: a monitoring committee overriding its own boundary on clinical-judgment grounds; trials halted early for benefit systematically reporting larger effects than the same trials would have reported had they run to completion; journals demanding fixed-N preregistration while justifying the demand in the language of protecting the strength of the evidence.

  5. Describe what would have to change institutionally — protocols, monitoring committees, journal requirements, regulatory review, the division of labor between statistician and clinician — if the presupposed view were replaced wholesale rather than patched.

  I am not asking which framework is better in the abstract. I want the implicit theory of evidence that the existing arrangement already commits us to, and an assessment of whether we can hold it consistently.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Context:** The user works in methods support for a hospital research office, bridging clinical trials and behavioral science.
      *   **The Core Problem:** An apparent asymmetry.
          *   *Clinical Trials:* Repeated looks (interim analyses) with early stopping are allowed/encouraged *if* pre-specified and alpha-adjusted (Group Sequential Design).
          *   *Behavioral Science:* Repeated looks (peeking) with early stopping are condemned as p-hacking *unless* pre-registered with fixed N.
          *   *The Tension:* Both involve looking at data and potentially stopping. The difference is the *plan* (counterfactuals). The user finds it philosophically troubling that the evidential value of *actual* data depends on *unobserved* intentions/plans (the Likelihood Principle violation).
      *   **The Task:** The user wants a deep philosophical and methodological dissection of the implicit theory of evidence underlying current practices.
      *   **Specific Questions:**
          1.  Reconstruct the implicit account of the p-value and "the data."
          2.  Evaluate the standard reconciliation (pre-specification + adjustment) against the objection (does it answer or relocate?).
          3.  Separate strict requirements from comfortable accommodations (specifically regarding Bayesian updating vs. Frequentist error control). Where is the arrangement underdetermined?
          4.  Identify inconsistencies (internal and between fields).
          5.  Describe institutional changes required if the underlying view were replaced (e.g., with Bayesianism).

  2.  **Analyze Question 1: The Implicit Account of the P-value and "The Data"**

      *   *Frequentist Foundation:* The current system is fundamentally Frequentist (Neyman-Pearson).
      *   *Definition of P-value:* Probability of observing data *as extreme or more extreme* than what was observed, *given the null hypothesis is true* AND *given the sampling plan*.
      *   *What is "The Data"?* It's not just the numbers in the spreadsheet. It's the numbers *plus* the stopping rule that generated them. $P(Data | H_0, StoppingRule)$.
      *   *Why the asymmetry?* In Clinical Trials, the stopping rule is part of the null distribution calculation (alpha spending). In Behavioral "p-hacking," the stopping rule is undefined or flexible, making the null distribution unknowable/inflated.
      *   *Key Insight:* The p-value is a property of the *experiment*, not just the *outcome*.

  3.  **Analyze Question 2: The Standard Reconciliation vs. The Objection**

      *   *The Objection:* The Likelihood Principle (LP). Evidence should depend only on what happened, not what *might* have happened.
      *   *The Reconciliation:* Pre-specification + Alpha Spending controls the Long-Run Error Rate (Type I error).
      *   *Does it answer the objection?* No, it *rejects* the premise of the objection. It relocates the justification from "Evidential Meaning of this specific dataset" to "Reliability of the Decision Procedure over many hypothetical repetitions."
      *   *Relocation:* It moves the locus of validity from the *posterior belief* to the *behavioral guarantee*.

  4.  **Analyze Question 3: Strict Requirements vs. Comfortable Accommodations (Bayesian vs. Frequentist)**

      *   *Bayesian View:* Inference = Updating beliefs ($P(H|Data)$). Stopping rules are irrelevant (Stopping Rule Principle).
      *   *Frequentist View:* Inference = Error Control ($P(Data|H_0)$). Stopping rules are crucial.
      *   *What survives under Bayesianism?* The Data Monitoring Committee (DMC) makes sense (looking at data is fine). Alpha spending collapses (irrelevant). Preregistration of *sample size* becomes ritualistic (though preregistration of *models* prevents fishing).
      *   *Underdetermination:* Some rules (like blinding) make sense in both. Some (like alpha spending) are purely Frequentist. The current system is a hybrid: Frequentist control with quasi-Bayesian decision making (DMC using clinical judgment).

  5.  **Analyze Question 4: Inconsistencies**

      *   *Internal (Clinical):* DMCs often stop for "overwhelming benefit" using clinical judgment that might not strictly align with the statistical boundary (O'Brien-Fleming vs. reality). Early stopping leads to effect size overestimation (the "winner's curse").
      *   *Internal (Behavioral):* Preregistration fixes N, but then people use "sensitivity analyses" or exclude outliers post-hoc, reintroducing the flexibility they tried to ban.
      *   *Between Fields:* As noted by the user. Why is "optional stopping" okay for life-saving drugs (with math) but fatal for psychology (without math)? Actually, behavioral scientists *can* do sequential analysis (Bayesian or Frequentist), but they usually don't. The inconsistency is cultural/procedural, not mathematical.
      *   *Journals:* Demand fixed N (Frequentist ritual) but interpret p < .05 as "strength of evidence" (Bayesian intuition). This is a category error.

  6.  **Analyze Question 5: Institutional Changes for a Paradigm Shift**

      *   *Shift to Bayesianism:*
          *   No more alpha spending.
          *   No more fixed N requirements (sequential analysis becomes default).
          *   DMCs focus on posterior probabilities of benefit/harm.
          *   Preregistration shifts from "N and Analysis" to "Priors and Model Structure."
          *   Regulatory approval based on risk/benefit ratios derived from posteriors, not binary "reject null."
      *   *Shift to Likelihoodism:* Focus on Likelihood Ratios.
      *   *Practical Reality:* Regulators (FDA) are locked into Frequentist error rates. Changing this requires a massive regulatory overhaul, not just statistical tweaks.

  7.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Professional, philosophical, rigorous, acknowledging the user's expertise. Avoid condescension.
      *   *Structure:* Follow the 5 numbered points exactly.
      *   *Key Concept:* The Likelihood Principle is the elephant in the room. I need to name it explicitly.
      *   *Key Distinction:* Error Statistics (Mayo) vs. Bayesianism. The current system is "Error Statistics."
      *   *Refining Point 2:* Make sure to clarify that the standard reconciliation *denies* the user's premise that evidence is solely about the data at hand. It asserts evidence is about the *process*.
      *   *Refining Point 4:* The "Effect Size Inflation" in early stopped trials is a crucial point. It shows the Frequentist machinery controls *errors* but distorts *estimation*.
      *   *Refining Point 5:* Be realistic. FDA isn't going Bayesian tomorrow. But what *would* change if they did?

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "counterfactual data" concern? Yes, by explaining that Frequentism *requires* counterfactuals (the sampling distribution).
      *   *Check:* Did I distinguish between the DMC (independent) and the p-hacker (investigator)? Yes, independence matters for bias, but the statistical issue is the stopping rule.
      *   *Check:* Is the distinction between "evidence" and "decision rule" clear? This is the crux. Frequentism is about decision rules; Bayesianism is about evidence. The current system conflates them.

  9.  **Final Polish:** Ensure precise terminology (Likelihood Principle, Stopping Rule Principle, Type I Error, Alpha Spending, Posterior). Ensure the distinction between *internal* consistency and *external* justification is clear. (Proceed to generate output based on these thoughts.)

  *(Self-Correction Note)*: I need to be careful not to simply say "Frequentism is bad, Bayesianism is good." The user asks for the *implicit theory* of the *existing arrangement*. I must explicate the Frequentist/Error-Statistical philosophy that underpins the current regulatory regime, even if it has philosophical vulnerabilities. The user wants to know if *this* system holds together, not necessarily to be converted.

  *(Refining Point 3)*: The user asks about "updating degrees of belief." I need to be explicit that the current system *forbids* interpreting results as degrees of belief. That is a category error in Neyman-Pearson theory.

  *(Refining Point 4)*: The "inconsistency" between clinical and behavioral is actually less about math and more about *cost of error*. In clinical trials, false positives kill people. In behavioral science, false positives waste grant money. But the user's point is about the *logic*. I should focus on the logical inconsistency regarding the Likelihood Principle.

  *(Final Plan)*:
  1. Define the Error-Statistical Philosophy.
  2. Explain how it handles the "counterfactual" objection (by embracing it).
  3. Analyze the Bayesian counterfactual.
  4. List inconsistencies (Estimation vs. Testing, Evidence vs. Decision).
  5. Outline the Institutional Shift (Bayesian/Decision-Theoretic).

