answer: |-
  ### Part 1: The Brainstorm (What to Keep, What to Drop)

  You have a solid grasp of the theory, but since you're working in ten-minute windows during a crisis, we need to strip the philosophy down to its tools. Here is the blunt assessment of what matters for a rumor desk and what is academic baggage.

  **Load-Bearing (Keep This):**
  1.  **Sensitivity (The "If False" Test):** This is your most important tool. Nozick says you only know something if, *were it false, you wouldn't believe it.* In your job, this translates to: "If this rumor were a lie, would the evidence look different than it does now?" If the answer is no, you don't have knowledge. You have a guess.
  2.  **The Rejection of Closure:** You are correct that you cannot chain beliefs. In philosophy, "closure" means if you know A, and you know A leads to B, you automatically know B. Nozick says no. In your work, this means if you verify "The river is rising" and you verify "If the river rises, the bridge closes," you have *not* verified "The bridge is closed." You must verify the bridge directly. Chains degrade confidence; they do not transfer it.
  3.  **The Grandmother Problem:** You mentioned this correctly. If the family lies to the grandmother to protect her, her belief that her grandson is healthy is true, but it doesn't *track* the truth. For you, this means: Does the source have a reason to tell the truth *even if the truth is bad*? If they only report good news, they aren't tracking; they're PR.

  **Philosophical Decoration (Drop This):**
  1.  **Adherence (The "If True" Test):** Nozick says you also need to know that *if it were true, you would believe it.* In an emergency, this is less critical. Your main danger is spreading falsehoods (libel, panic), not missing every single truth. Focus your energy on the "If False" test.
  2.  **Metaphysical "Worlds":** Don't worry about "possible worlds." Just worry about "alternative scenarios."
  3.  **Absolute Certainty:** Nozick is trying to define "Knowledge" with a capital K. You are defining "Actionable Confidence." You will never have 100%. Aim for "Safe to Act."

  **The Misleading Part:**
  You described the theory accurately, but there is one trap. Nozick's theory is about *individual* knowledge. You are a *system*. The "40 accounts posting the same thing" problem you mentioned is a failure of **Independence**, which Nozick assumes but doesn't explicitly test for. If 40 people believe a lie because they all read the same bot account, their beliefs aren't independent. They are one signal amplified. Your procedure must test for independence before it tests for truth.

  ---

  ### Part 2: The Procedure (The 10-Minute Flowchart)

  This is designed for two tired volunteers. It prioritizes safety over speed. If you run out of time, you default to "Unverified."

  **Total Time Budget:** 10 Minutes
  **Escalation Rule:** If a claim names a private citizen (not a public official) or alleges a crime, stop immediately. Send to Editor/Lawyer. Do not post.

  #### Step 1: The Triage (Minutes 0–1)
  **Question:** Is this claim actionable, and is it safe to touch?
  *   **Check:** Does it name a specific private individual (e.g., "John Smith stole a generator")?
      *   **Yes:** **STOP.** Tag as "Legal Review." Do not investigate further.
  *   **Check:** Is the claim specific enough to test? (e.g., "Shelter out of insulin" vs. "People are scared")
      *   **No:** **STOP.** Tag as "Vague/Opinion." Do not post.
      *   **Yes:** Proceed to Step 2.

  #### Step 2: The Independence Check (Minutes 1–4)
  *This handles your "40 accounts" problem. We call this the **Echo Test**.*
  **Question:** Do I have more than one independent source?
  *   **Action:** Look at the accounts reporting this.
  *   **Test:** If multiple accounts post the same claim within a short window (e.g., 1 hour):
      *   Do they use identical phrasing?
      *   Do they link to the same original image/video?
      *   Are they all following the same new account?
  *   **Verdict:** If yes to any of these, count them as **ONE** source.
  *   **Pass Criteria:** You need at least **two** independent sources (e.g., a person on the ground + an official report, OR two people on the ground who don't know each other).
  *   **Fail:** If you only have one source (even if 40 people shared it), proceed to Step 3 but mark confidence as **LOW**. If the claim is high-risk (safety/legal), **STOP** and mark "Unverified."

  #### Step 3: The Sensitivity Check (Minutes 4–8)
  *This is the Nozick core. We call this the **Counterfactual Test**.*
  **Question:** If this claim were false, would the evidence look different?
  *   **Action:** Imagine the claim is a lie. Would the source still have sent this message?
  *   **Test A (Motive):** Does the source benefit if this is true? (e.g., selling generators, political attack). If yes, the signal is noisy.
  *   **Test B (Access):** Does the source have direct access to the fact? (e.g., Are they *in* the shelter, or hearing about it from a cousin?)
  *   **Test C (Correction):** If the fact changed, would they update? (e.g., Is this an official agency that issues corrections, or an anonymous account?)
  *   **Pass Criteria:** The source has no clear motive to lie, has direct access, and is capable of being corrected.
  *   **Fail:** If the source is anonymous, has a motive, or is passing along hearsay, you **FAIL**.

  #### Step 4: The Chain Check (Minutes 8–10)
  *This handles the "Chained Beliefs" problem. We call this **Link Decay**.*
  **Question:** Did I have to combine two claims to get this conclusion?
  *   **Action:** Did you verify "Road is flooded" and "Bridge is on that road" to conclude "Bridge is closed"?
  *   **Rule:** **Chains Break Knowledge.**
  *   **Verdict:** If your conclusion relies on stitching two unverified or weakly verified claims together, you **FAIL**. You must verify the final conclusion directly.
  *   **Time Limit:** If you have less than 2 minutes left and haven't verified the final conclusion directly, **STOP**. Mark "Unverified."

  **Final Output Options:**
  1.  **Confirmed:** Passed all steps. (Post as fact).
  2.  **Official Claim:** Failed Independence (only one source), but it is an Official Agency. (Post as "Agency X states...").
  3.  **Unverified:** Failed Sensitivity or Chain. (Post as "We are looking into this" or do not post).
  4.  **False:** Evidence directly contradicts. (Post as "False").

  ---

  ### Part 3: Running the Test Cases

  Here is how the procedure handles the three claims you provided.

  #### Case A: The Insulin Shortage
  *Claim: One woman messages that the county shelter is out of insulin and turning diabetics away. No second source.*
  *   **Step 1 (Triage):** Pass. No private names, actionable safety issue.
  *   **Step 2 (Independence):** **FAIL.** Only one source. The "40 shares" rule doesn't apply here, but the single-origin rule does. Even if 50 people share her post, it is still one source.
  *   **Step 3 (Sensitivity):** **WEAK.** She has direct access (says her mother is there), but we cannot test the "If False" condition. If the shelter *had* insulin, would she still say they don't? Yes, if she was panicked or misinformed by staff.
  *   **Step 4 (Chain):** N/A.
  *   **Result:** **UNVERIFIED.**
  *   **The Unpleasant Truth:** You cannot post this as confirmed. You cannot even post it as "We can't verify but be careful" without risking a run on the shelter that makes the shortage real. The procedure forces you to silence a potentially life-saving warning because the signal isn't clean. You have to call the shelter directly. If they don't answer in 10 minutes, you stay silent. This feels like abandoning the diabetics, but spreading unconfirmed medical triage info can cause panic at other shelters that *do* have supplies.

  #### Case B: The Mayor Fleeing
  *Claim: Mayor left town before evacuation. Sourced to a screenshot of a license plate at a gas station 2 hours away.*
  *   **Step 1 (Triage):** Pass. Public official.
  *   **Step 2 (Independence):** **FAIL.** One screenshot.
  *   **Step 3 (Sensitivity):** **FAIL.** Ask the Counterfactual: If the Mayor were *in* town, would this image look different? No. The image could be old. The plate could be misidentified. The gas station could be fake. The signal (the image) does not change whether the fact (Mayor's location) is true or false. It is a static object.
  *   **Result:** **FALSE / UNSUBSTANTIATED.**
  *   **Why:** A static image cannot track a dynamic fact without timestamped, geolocated verification. You post: "This image is unverified and does not confirm the Mayor's location."

  #### Case C: The Water Safety
  *Claim: Water is safe to drink. Posted by the Utility Company + repeated by 3 local news outlets.*
  *   **Step 1 (Triage):** Pass. Public safety.
  *   **Step 2 (Independence):** **FAIL (The Echo Trap).** You have four sources (Utility + 3 News). But run the Echo Test. Did the news outlets do their own water testing? No. They reposted the Utility's press release. You effectively have **ONE** source (The Utility).
  *   **Step 3 (Sensitivity):** **PASS (With Caveat).** If the water were unsafe, would the Utility say it's safe? Legally, they are required to report contamination. However, in a crisis, they might delay to avoid panic. They are *mostly* tracking, but there is a lag.
  *   **Step 4 (Chain):** N/A.
  *   **Result:** **OFFICIAL CLAIM.**
  *   **The Unpleasant Truth:** You do not *know* the water is safe. You only know the Utility *says* it is safe. The procedure strips away the comfort of "3 news outlets agree." They don't agree; they echo. You must post this as "Utility Company states water is safe," not "Water is safe." If the Utility is lying or wrong, your verification offered no protection. This is the "Grandmother" problem: you are being told the truth (hopefully), but the mechanism (News repeating Utility) wouldn't necessarily correct itself if the Utility lied.

  ---

  ### Part 4: Where the Checklist Breaks

  You asked for the parts where judgment can't be squeezed out. Here is where this procedure fails you, and where you need to rely on your own gut.

  **1. The "Good Lie" Problem**
  Sometimes a lie saves lives. If a rumor says "The bridge is out" and it stops people from driving into a flood zone, but the bridge is actually fine, the Sensitivity Test fails (the bridge being fine didn't stop the rumor), but the outcome was good. This procedure will tell you to mark that as "Unverified" or "False." You may face a moment where you have to choose between epistemological honesty and public safety. The procedure cannot make that choice for you.

  **2. The Time/Truth Trade-off**
  Nozick's theory assumes you have the luxury of checking conditions. In a wildfire, facts change faster than verification. A claim might pass Step 3 at Minute 8, but by Minute 12, the situation has changed. The procedure gives you a snapshot, not a movie. You need a rule for "Expiration Dates" on your posts (e.g., "Verified as of 2:00 PM").

  **3. The Emotional Cost**
  In Case A (Insulin), the procedure tells you to stay silent. That is the correct epistemological move, but it is the hardest human move. You will feel like you are withholding help. You need to agree with your co-volunteer *now*, before the emergency, that **Silence is safer than Noise.** If you don't agree on that now, you will argue during the crisis, and you will burn out.

  **4. What This Cannot Do**
  This procedure cannot generate truth. It can only filter noise. If the Utility lies about the water, and the news echoes them, and the shelter manager lies about the insulin, this procedure will faithfully report that "Official sources claim X." It protects you from looking foolish, but it does not protect the public from being lied to by authorities. You are a filter, not a generator. Accept that limit. It keeps you sane.

  **Final Advice:**
  Print the Flowchart. Put it between you and your keyboard. When the adrenaline is high and you want to hit "Post" because people need help, look at Step 3. If the signal doesn't track the fact, you are not helping; you are just adding noise to the emergency. Your brother-in-law is right about the law, but Nozick is right about the truth. Use both.
