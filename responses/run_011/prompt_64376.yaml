answer: |-
  Through the lens of Confucian role ethics as developed by Roger Ames and Henry Rosemont, the 2013 amendment to China's Elderly Rights Law represents a profound category error. It attempts to solve a crisis of *li* (ritual/propriety) with the instruments of *fa* (law/punishment), thereby misunderstanding the ontological status of the persons involved. While the statute aims to reinforce filial piety (*xiao*), role ethics suggests it inevitably corrupts the practice it seeks to protect. However, the episode also exposes a significant lacuna in role ethics itself: while it offers a robust critique of the law's moral form, it lacks the resources to address the material and structural conditions that make the roles it champions increasingly impossible to perform.

  ### I. The Statute Through Role Ethics: Ontological Corruption

  For Ames and Rosemont, the fundamental premise of role ethics is that persons are not atomic, autonomous individuals who subsequently enter into relationships. Rather, persons are constituted by the roles they live—son, father, neighbor, citizen. To be a "person" is to be a nexus of these relationships. Consequently, the Western liberal language of "rights" and "duties" is ontologically alien to this view. A right implies a claim one individual holds against another, presupposing separateness. A duty implies an obligation one can choose to discharge or be forced to discharge. In role ethics, caring for one's parents is not a duty one owes; it is part of what it *means* to be a child. It is constitutive of the self.

  Therefore, the framing of the parent as a "rights-holder" and the child as a "duty-bearer" is indeed an importation of the individualist ontology role ethics rejects. By legislating filial attention, the state treats the parent-child relationship as a contract between strangers rather than a constitutive bond. This redirects the performance of the role. In a role-ethical framework, the "audience" for filial action is the parent and the community; the motivation is the cultivation of virtue (*de*) and the maintenance of harmony. When the state mandates visits, the "audience" becomes the court or the bureaucracy, and the motivation becomes compliance. This hollows out the role. It transforms *xiao* from a ritual expression of reverence into a bureaucratic metric. As Confucius noted in the *Analects* (2.3), leading people by edicts keeps them out of trouble but gives them no sense of shame; leading them by ritual gives them a sense of shame and makes them good. A law commanding "spiritual needs" attempts to legislate the internal disposition of the heart, which is the very domain role ethics reserves for cultivation, not coercion.

  The contrast with monetary maintenance obligations, such as those adjudicated in Singapore, is decisive. Financial support is external and fungible; it can be measured, transferred, and coerced without necessarily violating the internal logic of the relationship. One can pay for a parent's care without feeling love, and the parent receives the material benefit regardless. Role ethics might view this as a lesser form of care, but it is compatible with legal enforcement because it deals with external goods. The 2013 Chinese statute, however, targets "spiritual needs" and visitation. These are inherently internal and ritualistic. A visit made under threat of litigation is not a ritual act of filial piety; it is a court-ordered appearance. The difference is decisive because role ethics holds that the *quality* of the action (the intention and ritual propriety) is inseparable from the action itself. You cannot coerce sincerity. Thus, the law does not preserve the role; it replaces the role with a legal simulation of it.

  ### II. The Episode's Exposure of Role Ethics: Structural Silence

  If the first analysis shows how role ethics condemns the law, the second analysis reveals where role ethics falls silent. The public derision regarding the law focused not on its moral philosophy, but on its material impossibility: migrant workers hundreds of kilometers away, only children with no siblings to share the burden, and a lack of paid leave. These are demographic and economic realities generated by state policy (the One-Child Policy, *hukou* restrictions) and market forces.

  Role ethics, in its Ames-Rosemont formulation, is primarily a normative account of how persons should relate to one another. It assumes that the roles it describes are viable. It posits that if we cultivate ourselves and observe ritual, social order will follow. However, this episode exposes the theory's lack of a political economy. It has no account of what happens when the state or the market structurally undermines the possibility of performing these roles. If a "child" is constituted by their relationship to a "parent," but the economic structure requires the child to live 1,000 kilometers away to survive, role ethics offers no mechanism to resolve this conflict. It cannot tell us whether the state, the market, or the family should bear the cost of reconciling these demands.

  The theory is silent on the distribution of the *capacity* to be virtuous. It critiques liberal individualism for isolating people, but it does not adequately address how macro-structural forces isolate people in ways that make role-bearing impossible. When the prompt asks which of state, market, or family should decide, role ethics defaults to the family/community sphere. But when the family is shrunk by policy and the community is fragmented by labor migration, the theory has no resources to evaluate the justice of the structural constraints. It can say the law is morally wrong for using *fa* instead of *li*, but it cannot explain how to restore the conditions where *li* is possible.

  ### III. Definite Position

  On the best role-ethical analysis, the 2013 law is a **corruption of filial practice**. It mistakes the external compliance of the citizen for the internal cultivation of the child, thereby undermining the very virtue it seeks to promote. By importing the language of rights and duties, it reifies the individualist ontology that role ethics seeks to overcome, turning a constitutive relationship into a transactional one.

  However, we must admit plainly where role ethics falls silent. While it correctly diagnoses the law as a moral category error, **role ethics lacks the resources to evaluate the structural crisis that prompted the law.** It cannot account for the demographic and material conditions (labor migration, shrinking cohorts) that rendered the roles hard to perform. It offers no theory of distributive justice to determine who should pay for the time and travel required to fulfill these roles. Consequently, while role ethics provides a powerful critique of the *form* of the legislation, it offers no solution to the *substance* of the social problem. It can tell us why the law is wrong, but it cannot tell us how to make filial piety possible in a modern, industrialized society where the material conditions for traditional roles have evaporated. To demand role ethics solve this is to press it into service beyond its scope; its silence on political economy is a theoretical limitation that the 2013 episode lays bare.
