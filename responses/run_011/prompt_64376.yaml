      *   **Theoretical Lens:** Confucian Role Ethics (Ames & Rosemont). Key tenets: No atomic individuals, persons constituted by roles, order via ritual/cultivation (*li*) not edicts/punishment (*fa*).
      *   **Task 1 (Law $\rightarrow$ Theory):** How does role ethics view a statute commanding filial attention?
          *   Does it preserve the role?
          *   Does it hollow it out (redirecting performance to the state)?
          *   Is the rights/duty framing an importation of individualist ontology?
          *   Contrast with monetary maintenance obligations (Singapore style) – is this difference decisive?
      *   **Task 2 (Episode $\rightarrow$ Theory):** What does the episode expose in the theory?
          *   Silence on demographic/material conditions (migration, one-child policy).
          *   Lack of account on who decides (state, market, family).
      *   **Requirement:** Take a definite position (Corruption? Stopgap? Theory fails?). Don't just tabulate options. Admit where the theory falls silent.

  2.  **Analyze Task 1: The Law through Role Ethics:**

      *   *Core Tenet:* Role ethics prioritizes *li* (ritual/propriety) over *fa* (law/punishment). Confucius said, "If you lead them by edicts and keep them in line with punishments, the common people will stay out of trouble but will have no sense of shame. If you lead them by virtue and keep them in line with ritual, they will have a sense of shame and moreover will become good." (Analects 2.3).
      *   *The Law:* It's an edict (*fa*). It mandates "spiritual needs." It has no penalty but allows civil action.
      *   *Role Ethics Critique:*
          *   **Ontological Mismatch:** Role ethics rejects the "rights-holder/duty-bearer" model. This is Western liberal individualism. In role ethics, being a child *is* the obligation. It's constitutive, not contractual. Framing it as a legal right implies the relationship is external to the self, something that can be litigated between strangers.
          *   **Hollowing Out:** By making filial piety (*xiao*) a legal requirement, the motivation shifts from internal cultivation (*de*) to external compliance. It turns a ritual act (visiting out of love/respect) into a bureaucratic box-ticking exercise. This destroys the *quality* of the role.
          *   **Contrast with Money:** Monetary support is external and measurable. It fits a legal framework better because it doesn't require "heart." "Spiritual needs" are internal. Legislating the internal is anathema to role ethics. The Singapore model (money) is *fa* applied to external goods. The China model (visits/spirit) is *fa* applied to *li*. This difference *is* decisive. You can legislate transaction; you cannot legislate relationship.

  3.  **Analyze Task 2: The Episode's Exposure of the Theory:**

      *   *Material Conditions:* Role ethics assumes roles are *performable*. If the "child" role requires physical presence, but the economy (market/state policy) forces migration, the role becomes impossible.
      *   *Theory's Blind Spot:* Ames and Rosemont focus heavily on the *normative* structure of roles (how we should live), but often gloss over the *structural* conditions that make roles viable. They critique liberal individualism but don't always provide a robust political economy to sustain the roles they champion.
      *   *Who Decides?* Role ethics emphasizes family/community harmony. But when the family is broken by state policy (One Child) or state economic strategy (migrant labor), the theory lacks a mechanism to adjudicate the conflict between "being a good worker/citizen" and "being a good child." It assumes harmony is possible; this episode shows structural disharmony.
      *   *Silence:* The theory doesn't have a built-in critique of the *state* overreaching into the family sphere to fix problems the state helped create.

  4.  **Formulate the Definite Position:**

      *   *Is it a corruption?* Yes, from a strict role-ethical view, legislating *xiao* corrupts the virtue.
      *   *Is it a stopgap?* Maybe pragmatically, but theoretically weak.
      *   *Does the theory fail?* The theory has resources to critique the *form* of the law (fa vs. li), but it lacks resources to address the *material impossibility* of the role.
      *   *Decision:* The law is a **corruption of filial practice** because it substitutes legal coercion for ritual cultivation, fundamentally misunderstanding the ontology of the person. However, the episode exposes a **critical lacuna in role ethics**: it lacks a political economy to sustain roles when structural forces make them impossible to perform. The theory can diagnose the moral error of the law but cannot solve the sociological crisis that prompted it.

  5.  **Drafting the Response (Iterative refinement):**

