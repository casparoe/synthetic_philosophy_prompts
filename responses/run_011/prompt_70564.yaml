prompt: |-
  I run reliability for a mid-size platform — on-call rotations, SLOs, error budgets, incident review, the whole thing. I'm pretty fluent in that world and basically illiterate in political science, but I've been reading about democratic backsliding (Hungary, Turkey, the US arguments) and somthing about how the concept gets used feels off to me.

  So: restate the actual debate about what counts as democratic backsliding in the vocabulary I use at work. I mean the real disagreements, not the op-ed version — the people who define democracy procedurally (competitive elections that are roughly free and fair, full stop) versus the people who think that's too thin because you can keep holding elections while hollowing out everything that made them meaningful; the claim that backsliding is a distinctive phenomenon precisely because it arrives as a long series of small legal increments instead of a coup; and the accusation that the whole concept is just a partisan label that gets applied to whichever side you lost to. Map that stuff onto SLOs, error budgets, degradation-versus-outage, monitoring coverage and blind spots, config drift, alert fatigue, blast radius, MTTR, rollback, canary analysis, silent failure, whatever else genuinely fits. Be honest about it — don't smuggle your own political priors in and call it translation.

  Then the residue report, which is what I actually want:
  - which claims map cleanly,
  - which ones you had to bend or fudge to make fit,
  - which ones have no expression at all in reliability vocabulary.

  Here's the specific worry I want you to test rather than just agree with. In my world the SLO is written by people outside the system — product, users, whoever signs the contract — and the system does not get a vote in what "healthy" means. We also have ground truth: if latency is bad, users notice whether or not anyone filed a ticket. In the democracy debate it looks to me like the components inside the system are the ones arguing about what the SLO even is, and there's no user-visible ground truth to appeal to. If that's right, does it mean reliability vocabulary is just structurally unable to talk about contested definitions of health — or does it mean the political scientists are mostly arguing about where to set a threshold, i.e. an SLO-setting dispute dressed up as a dispute about the system's behavior? I want you to pick a side and defend it, not split the difference.

  To keep it concrete, work through a case I made up: over nine years a ruling party cuts the mandatory retirement age for judges, creating a wave of vacancies it then fills; moves appointment of the electoral commission's members from a cross-party committee to the justice ministry; redraws constituency boundaries; and imposes foreign-funding registration requirements on NGOs. Over the same period it loses two large municipal elections and one national election, power transfers peacefully every time, and there's no violence at the polls. Under your translation, is that system inside its error budget, slowly burning budget, in a brownout, or has it completed a migration to a different architecture that is still reporting healthy metrics? And of those four descriptions, which ones are doing real explanatory work and which are just relabeling?

  Also, while you're in there: who is supposed to be on call? Opposition parties, courts, international bodies, voters, the press? Because in my world, if nobody owns the alert, the alert doesn't exist — and I suspect that's exactly the gap the "this is just a partisan label" charge is pointing at.

  I can't look anything up, so no citations or reading lists, just argue it out. 1200-1500 words is fine, and a few sections with headers would help me follow.
