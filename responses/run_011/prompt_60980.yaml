      *   **Specific Focus:** The tension between Ranke's "first law" (strict presentation of fact, however unlovely) and "second law" (development of unity and course of events).
      *   **Constraints:**
          *   Don't give a cheap win to either character.
          *   Avoid generic "Ranke vs. Postmoderns" textbook summaries.
          *   Brainstorm rival readings *before* committing to an interpretation.
