prompt: |-
  Hey — hoping you can play the part of a specialist in 19th-century German historiography and the philosophy of history for me. I'm a novelist, and my book has two historians in it, one who genuinely thinks you can get at the past as it was and one who thinks that's a comforting fantasy, and they have a long argument scene I still haven't got right. I dont want either of them winning cheaply, so I've been sitting with the preface Ranke wrote for his 1824 book on the Latin and Germanic peoples, and I'm stuck on a bit in the section where he talks about form:

  "Man kann von einer Historie nicht die freie Entfaltung fordern, welche wenigstens die Theorie in einem poetischen Werke sucht ... Strenge Darstellung der Thatsache, wie bedingt und unschön sie auch sei, ist ohne Zweifel das oberste Gesetz. Ein zweites war mir die Entwickelung der Einheit und des Fortgangs der Begebenheiten."

  (My rough rendering: you can't demand of a history the free unfolding that theory looks for in a work of poetry; rigorous presentation of the fact, however conditioned and unlovely it may be, is the supreme law — and a second law, for him, was the working-out of the unity and the course of events. Probably clumsy.)

  A few paragraphs earlier he says the book "will blos zeigen, wie es eigentlich gewesen," the line everybody quotes. But here he hands himself two laws, and the second one — bringing out the unity and direction of what happened — looks like precisely the thing a Carr or a Hayden White would accuse him of sneaking in under cover of the first.

  Could you think this through carefully with me, and start by brainstorming the rival readings of that second law before you commit to one? Specifically:

  1. Is the "unity and course of events" something Ranke takes himself to be discovering in the material, or something he's admittedly supplying to it? Does the wording here — especially the way he contrasts history with poetry right beforehand — give a clue either way?
  2. Does "eigentlich" in the famous sentence really mean "what actually happened," or does it lean more toward "what it essentially/truly amounted to"? Tell me how much weight the whole claim can bear on each reading.
  3. Are the two laws compatible, or does the second quietly repeal the first? I want to know which reading makes my believer strongest and which leaves him most exposed, so the sceptic gets a real point rather than an easy one.

  Please go easy on the textbook Ranke-versus-the-postmoderns summary — I've read plenty of that. And flag anything I've got wrong about the text or its date.
