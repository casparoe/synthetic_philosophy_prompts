  This matches the standard text of the 1824 *Vorrede*.
  One small nuance: *Theorie* in "welche wenigstens die Theorie in einem poetischen Werke sucht." Ranke is saying poetry *theory* demands free unfolding. He is distinguishing the *theory of art* from the *law of history*.
