      Veridian offers two primary instruments: Fine-Backed Discharge (FBD) and Custodial Equivalency Discharge (CED). FBD instruments apply to monetary penalties and are immediately transferable. CED instruments apply to custodial sentences. To facilitate transfer, Veridian converts custodial terms into monetary equivalents using the Custodial Equivalency Matrix (CEM). The CEM calculates the present value of lost liberty based on average wage forfeiture, psychological distress indices, and statutory multipliers. Once converted, the CED is treated as a fine-backed instrument for settlement purposes. Clients understand that this conversion represents a commutation of sentence type, not a reduction in total burden. The Firm assumes no liability if the jurisdiction rejects the CEM valuation.

