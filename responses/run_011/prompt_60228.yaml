  Veridian offers two primary instruments: Fine-Backed Discharge (FBD) and Custodial Equivalency Discharge (CED). FBD instruments apply to monetary penalties and are immediately transferable under existing statute. CED instruments apply to custodial sentences. To facilitate transfer, Veridian converts custodial terms into monetary equivalents using the Custodial Equivalency Matrix (CEM). The CEM calculates the present value of lost liberty based on average wage forfeiture, psychological distress indices, and statutory multipliers. Once converted, the CED is treated as a fine-backed instrument for settlement purposes. Clients understand that this conversion represents a commutation of sentence type, not a reduction in total burden. The Firm assumes no liability if the jurisdiction rejects the CEM valuation. For the avoidance of doubt, a ten-year sentence may be valued higher than a life sentence depending on discount rates applied to future suffering.

  **2. SUBSTITUTE ELIGIBILITY AND SCREENING**
  Substitutes must be natural persons acting voluntarily. Veridian strictly prohibits mercenary arrangements; substitutes cannot receive direct compensation from the Firm or the Client. To ensure compliance, Veridian screens all substitutes for a verified Relation of Devotion to the Client. Acceptable relations include immediate family, spiritual adherents, or sworn associates. Devotion is quantified via psychometric testing and historical loyalty audits. While the substitute receives no payment, the Client pays Veridian an arrangement fee covering screening, legal compliance, and administrative overhead. Clients acknowledge that fees paid to the Firm do not constitute payment to the substitute, preserving the non-mercenary status of the substitution. This structure ensures the suffering is accepted as discharging the debt rather than merely as an equivalent quantity of pain purchased on the open market.

  **3. NATURE OF SUFFERING AND SATISFACTION**
  Clients may select between two satisfaction tiers. The Utilitarian Tier guarantees the substitute undergoes suffering equivalent in intensity and duration to the Client's sentence. The Retributive Tier guarantees the suffering is legally recognized as the Client's punishment. The Retributive Tier carries a premium surcharge. Veridian does not warrant that state authorities will accept the Retributive Tier as satisfying retributive justice goals. In cases where the state accepts the transfer but denies the punitive character, the Client remains morally liable though legally discharged. Clients seeking full retributive satisfaction should consult independent theological counsel. The Firm makes no representation regarding the metaphysical status of the transferred pain.

  **4. SURPLUS, DEFICIT, AND REOFFENSE**
  If a substitute suffers in excess of the converted sentence value (e.g., due to prison violence exceeding CEM projections), the surplus suffering credits accrue to the Client as non-transferable goodwill. No cash redemption is available for surplus suffering. Conversely, if a Client reoffends after a completed discharge, residual liability may reactivate. Veridian reserves the right to void prior discharges upon evidence of fraudulent intent at the time of contracting. In such events, the Client is liable for all original penalties plus administrative fees. The substitute retains no liability for Client recidivism. Surplus suffering cannot be applied to future liabilities.

  **5. CLIENT OBLIGATIONS AND REPENTANCE**
  Client repentance is not a contractual requirement for discharge but is strongly recommended for risk mitigation. While lack of repentance does not invalidate the transfer, it may increase the probability of judicial review or public scrutiny. Veridian advises Clients that demonstrating remorse may lower the cost of future instruments. The Firm remains neutral on the moral necessity of repentance, treating it solely as a factor influencing regulatory stability. Failure to repent does not constitute a breach of contract.

  **6. INTERNAL COMPLIANCE NOTE**
  Regarding the CED valuation model, Senior Underwriter J. Harlow noted: "The matrix prices the liberty interest correctly, but we need to ensure the deviation between physical confinement and monetary loss doesn't trigger a prospectus update under Section 4(b)."

  **RISK WARNINGS**
  *   **Identity Risk:** Substitution may not satisfy stakeholders who view penal liability as non-severable from personal identity, potentially voiding the discharge.
  *   **Proportionality Risk:** Converted monetary values may not accurately reflect the subjective severity of custodial confinement, leading to underpayment claims.
  *   **Moral Hazard Risk:** Transferability may incentivize Clients to engage in higher-risk criminal behavior knowing liability is insurable, increasing premium costs.
  *   **Recognition Risk:** Jurisdictions may refuse to recognize substituted suffering as punitive, leaving Client legally exposed despite full payment to Veridian.

  **COMPLAINTS**
  Complaints regarding discharge validity should be directed to the Bureau of Liability Transfer Oversight.

  The repentance clause was most difficult to render deadpan, as it requires asserting moral indifference as risk management; I solved this by framing repentance strictly as a variable affecting recidivism probabilities rather than moral worth.
