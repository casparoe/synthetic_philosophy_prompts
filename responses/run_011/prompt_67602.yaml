answer: |-
  **Project Title:** The Epistemology of Aid: Re-evaluating ISOTYPE's Claims Through Municipal Practice

  **Statement of the Question**
  This project asks: *Does Otto Neurath's coherentist epistemology sustain or subvert the tripartite claim of ISOTYPE—that pictorial notation is faster to acquire, inherently less determinate, and more universally intelligible than verbal language—and which of these claims is necessary for the system to function as public information?*

  Current discourse treats ISOTYPE as a unified block: either a triumphant precursor to modern infographics or a failed universal language. I propose that the argument for ISOTYPE as a "language" conflates three distinct empirical and philosophical claims: acquisition speed, semantic indeterminacy, and cross-cultural universality. Neurath himself balanced these carefully, treating the system as an auxiliary to text, insisting on a trained "transformation" step between data and image, and preferring repeated symbols to scaled ones because he doubted what a picture can settle. My supervisor suggests a deeper tension: whether Neurath's general epistemology—where no statement is foundational and all are revisable within a system—supports the ambition of a picture language or quietly undercuts it. If knowledge is a web of revisable statements, can a picture, which claims immediate intuition, ever function as a stable node? I intend to disentangle these claims to determine which are philosophically viable and which are merely design heuristics.

  **Context and Gap Analysis**
  Existing scholarship leaves this question open because it approaches ISOTYPE from isolated disciplinary silos. Design history tends toward celebration, framing ISOTYPE as a stylistic victory of modernism while glossing over the epistemological tensions in Neurath's writing. It treats the "transformation" process as a workflow rather than a philosophical safeguard. Conversely, semiotics often rejects the project outright, arguing that pictures are cultural codes no less arbitrary than words. This dismissal misses Neurath's pragmatic caveat that ISOTYPE was never intended to replace words but to accompany them. Finally, philosophy of science readings focus heavily on the "Unity of Science" and physicalism, often ignoring the practical design constraints that grounded the theory. None of these perspectives account for the ground-level failure modes of pictorial information in high-stakes humanitarian contexts. The boiling-water incident in my own practice—where a chart on duration was read as a chart on temperature—illustrates a gap between the theoretical promise of universality and the lived reality of interpretation. This project bridges that gap by testing philosophical claims against archival and empirical data.

  **Methodology**
  This fellowship pairs a design studio with a philosophy department, allowing me to utilize my eight-year archive of municipal commissions, my current design team, and direct access to the recent-arrival populations we serve.

  *   **Months 1–3: Archive Audit and Theoretical Mapping.** I will catalog my unit's past eight years of commissions, coding them for "failure modes" (misinterpretations, non-compliance, confusion). Simultaneously, I will map these failures against Neurath's three claims (speed, indeterminacy, universality). This establishes a baseline of where current practice deviates from ISOTYPE principles.
  *   **Months 4–6: The Transformation Workshop.** Neurath insisted on a specific "transformation" step where a specialist translates data for an artist. I will re-enact this process with my design team. We will redesign the specific boiling-water chart and other high-risk notices using strict ISOTYPE constraints (e.g., repeated symbols rather than scaling). We will document the friction points: where does the "translation" resist pictorialization? This addresses the claim of *indeterminacy*.
  *   **Months 7–9: Field Testing.** The redesigned materials will be deployed in reception facilities. Using comprehension testing with recent arrivals, we will measure acquisition *speed* and interpretive *universality* against our standard textual/visual hybrids. Crucially, we will test whether the "revisable" nature of Neurath's epistemology holds: if users are corrected on a misinterpretation, does the pictorial system allow for that revision, or does the image feel "fixed"?
  *   **Months 10–12: Synthesis.** I will correlate the empirical data with the philosophical framework. The output will be a joint paper and a "Manual of Transformation" for municipal designers, outlining which of Neurath's claims hold up under empirical stress.

  **Description of Results**
  The primary result will be a philosophical assessment of the "picture language" concept, specifically determining if it is a category error or a viable auxiliary system. I expect to demonstrate that Neurath's epistemology actually undermines the claim of *universality* while supporting the claim of *indeterminacy*. If pictures are less determinate, they require more context, not less, which complicates the "international language" argument. Practically, the project will yield a revised protocol for public information design that abandons the quest for universal legibility in favor of "legible revisability"—designs that explicitly invite correction rather than masking ambiguity.

  **Conditions of Failure**
  This project fails if:
  1.  **Conflation Returns:** I am unable to keep the three claims (speed, indeterminacy, universality) distinct in the analysis, collapsing back into a general praise or critique of ISOTYPE.
  2.  **Design Trumps Philosophy:** The empirical data from the field testing is treated as the final verdict on the philosophical question, ignoring the normative dimensions of Neurath's epistemology.
  3.  **The "Safe" Outcome:** I conclude that "more research is needed" without taking a stance on whether the picture-language ambition is coherent. Given the stakes of public safety information, ambiguity in the conclusion is a failure of the project's ethical mandate.

  **Candid Assessment: The Market Research Worry**
  My remaining unresolved worry is whether a philosophical question survives being answered partly by comprehension testing. Philosophy typically seeks necessary truths or conceptual clarity, whereas comprehension testing yields contingent, empirical data about specific populations. There is a risk that this fellowship reduces a question about the *nature of representation* to a question about *usability metrics*. If I prove that refugees misunderstand the boiling chart, have I disproved Neurath's epistemology, or merely proved that my chart was poorly designed?

  I cannot fully resolve this tension beforehand. However, I propose that the friction is productive. If the philosophical claim is that pictures *can* be universal, but the empirical data shows they *are not* under specific conditions, the philosophy must account for that contingency. The risk is that the "market research" aspect seduces the inquiry into pragmatism, stripping it of its critical edge. I will mitigate this by ensuring the field testing is not used to validate the system, but to stress-test the *limits* of the system. If the testing becomes purely about optimizing compliance, I will have failed the philosophical brief. If the testing reveals that certain ambiguities are inherent to the medium regardless of design quality, the philosophical question remains intact. I enter the fellowship aware that this boundary is porous, and maintaining it will require constant vigilance.
