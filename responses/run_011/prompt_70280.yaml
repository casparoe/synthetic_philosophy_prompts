      *   Address verbal/substantive/empirical? Yes.

      *(Final thought on the "Baseline" hypothesis)*: The user thinks it's a disagreement about the null case. I should argue it's actually a disagreement about the *ownership* of the cognitive environment. The "null" isn't neutral; it's *owned* by someone (the state, the market, chance). The debate is about *who gets to hold the steering wheel*, not whether there is a steering wheel.

