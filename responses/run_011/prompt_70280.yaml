      *   *Best Path:* Reframe the question. Move from "Is it legitimate?" to "Under what conditions does architecture constitute *domination* (republican freedom) vs. *facilitation*?"
      *   *Specific Progress Markers:*
          1.  **Distinction:** Separate *exploitative* nudges (aligning with bias against interest) from *corrective* nudges (aligning with bias to serve interest).
          2.  **Empirical/Conceptual Bridge:** The transparency condition needs to be treated as a *sliding scale* of invasiveness, not a binary switch.
