answer: |-
  This is a rigorous and internally ambitious package. It attempts to synthesize the formalism of Rank-Dependent Utility (RDU/REU) with a specific metaphysical grounding (non-fungibility) and a structural constraint (locality). Because the components are tightly coupled, stress-testing one often strains the others.

  Below is the map of exposure you requested, ranked by severity, followed by the specific construction you asked for.

  ### 1. The Exposure Map: Fatal vs. Awkward

  **Fatal Exposures**

  1.  **The Locality-Framing Pump (Dynamic Inconsistency).**
      *   **Why Fatal:** Your Locality Clause (Component 4) states that the weighting applies to the decision problem "as the agent faces it," and which problem that is is a "matter of fact." However, in sequential choice, the "fact" of whether one faces a sequence of independent problems or a single aggregated problem is often manipulable by the offerer without changing the objective probabilities or payoffs. If rationality depends on how the world bundles offers, a sophisticated adversary can partition a favorable aggregate gamble into a sequence of locally unfavorable gambles to pump the agent.
      *   **Distinction:** This is not merely "awkward" framing sensitivity; it is a violation of *instrumental rationality*. An agent who rejects the sequence (due to Locality) but would have accepted the bundle (due to Non-fungibility attenuation) ends up with strictly less wealth than an EU maximizer, despite having the same information and access to the same opportunities.
      *   **Verdict:** Fatal unless "matter of fact" is anchored to something offerer-invariant (e.g., temporal separation), which then conflicts with the Non-fungibility claim (Component 3) that risk should attenuate across independent prospects regardless of timing.

  2.  **The Irreducibility Collapse.**
      *   **Why Fatal:** You claim risk attitude is irreducible (Component 2) and that non-fungibility drives the weighting (Component 3). However, if non-fungibility is defined as "destruction of option-sets that cannot be offset," this is a property of the *outcome state* (e.g., "Bankrupt with no credit" vs. "Down $100 with credit"). Standard EU can capture this by defining the utility function over *final states inclusive of option sets*.
      *   **Distinction:** To maintain Irreducibility, you must argue that the *distribution itself* has value independent of the final states it produces. But if the value of the distribution derives from non-fungibility (an objective feature of the states), then the value is in the states. If the value is in the states, EU can represent it. If you insist EU cannot represent it, you must posit a "taste for risk" that is disconnected from the value of outcomes, which renders the Non-fungibility explanation (Component 3) vacuous.
      *   **Verdict:** Fatal to the claim that this is a *rival* to EU rather than a notational variant. If non-fungibility explains the weighting, the weighting is doing the work that a rich utility function over final states usually does.

  **Awkward Exposures**

  3.  **Dominance Violations in Localized Frames.**
      *   **Why Awkward:** Standard RDU satisfies stochastic dominance. However, your Locality Clause individuates outcomes relative to the "problem faced." If two acts are offered in different "problems" (e.g., one as a standalone, one as part of a portfolio), the rank-ordering of outcomes might shift locally, potentially licensing a violation of state-wise dominance *across* descriptions.
      *   **Concession:** A defender must concede that dominance holds only *within* a locally individuated problem.
      *   **Cost:** This makes the theory unable to critique choices where an agent fails to integrate two simultaneously available but "framed" separately gambles that would dominate if combined.

  4.  **Collective Incoherence.**
      *   **Why Awkward:** Individual risk attitudes (concave weighting) do not aggregate linearly. If a group adopts a voting rule or a representative agent model, the collective risk function may not preserve the rationality properties of the individual functions (e.g., becoming intransitive or violating continuity).
      *   **Concession:** The theory applies primarily to individual rationality, not social choice.
      *   **Cost:** Limits the scope of the normative claim. It cannot easily guide policy where risk is pooled socially (e.g., insurance mandates) without additional aggregation axioms.

  5.  **Underdetermination of the Weighting Function.**
      *   **Why Awkward:** Any finite body of preferences can be fit by multiple combinations of $u$ and $r$. You claim $u$ is linear in money (in your example) and $r$ is concave. But without independent access to "utility" (e.g., via certainty equivalents of risk-free choices), you cannot uniquely identify the risk function.
      *   **Concession:** The theory requires a method to fix utility independently of risk (e.g., small-stakes risk-neutral choices).
      *   **Cost:** Empirical application becomes difficult; the theory risks becoming a "just-so" story where any rejection is attributed to $r$ and any acceptance to $u$.

  ---

  ### 2. The Sophisticated Defender's Concessions

  A sophisticated defender of your view would make the following moves:

  *   **On Dominance:** She would concede that state-wise dominance is only preserved *within* the locally individuated problem. She would dismiss cross-frame dominance violations as category errors (comparing apples in Problem A to oranges in Problem B).
      *   *Cost:* This insulates the theory from criticism but reduces its normative bite. It cannot tell an agent she is irrational for failing to "see" two problems as one, even if doing so would guarantee a better outcome.
  *   **On Sequential Choice:** She would concede that a "resolute" choice strategy is required. The agent must commit at $t=0$ to the plan that maximizes REU over the *anticipated sequence*, ignoring the local temptation to re-evaluate at each step.
      *   *Cost:* This effectively abandons the Locality Clause (Component 4) in dynamic contexts. If the agent must treat the sequence as one problem to avoid pumping, then the "problem as faced" is the sequence, not the individual steps. This contradicts the intuition that sequential offers *are* distinct problems.
  *   **On Irreducibility:** She would concede that if "non-fungibility" is fully cashed out in terms of final option sets, EU *could* model it. She would retreat to the claim that the *psychological experience* of risk is primitive and not fully captured by final states.
      *   *Cost:* This moves the view from a normative claim about *value* to a descriptive claim about *psychology*. It weakens the claim that EU is *irrational*, suggesting instead that EU is *incomplete* regarding psychological goods.

  ---

  ### 3. Specific Technical Queries

  *   **Can rank-weighting license a dominated act?**
      *   Generally, no, provided the weighting function is monotonic. However, under your **Locality Clause**, if the "ranking" of outcomes changes because the problem description changes (e.g., a loss is "catastrophic" in isolation but "noise" in a portfolio), an act that is dominated in the portfolio frame might be chosen in the isolated frame. This is not a formal violation of dominance *within* a frame, but a violation of *description invariance*.
  *   **Does the view survive sequential choice?**
      *   Only via **Resolute Choice**. If the agent is "sophisticated" (knows her future self will reject the local gamble), she will reject the sequence at the start (backward induction). This leads to the suboptimal outcome (rejecting the aggregate gain). To accept the aggregate gain, she must be resolute (bind herself to the aggregate plan). This rescues the outcome but relocates the difficulty to the metaphysics of agency (how can one bind one's future rational evaluations?).
  *   **Can irreducibility be defended?**
      *   Only if you stipulate that "outcomes" for EU must be *intrinsic* goods, and risk-profiles are not intrinsic goods. If money is instrumental, final wealth is the outcome. If final wealth determines option sets, EU works. To defend irreducibility, you must argue that the *path* to wealth has normative weight independent of the final state. This is defensible but costly (violates Consequentialism).
  *   **Does non-fungibility belong in weighting or utility?**
      *   This is the crux. If non-fungibility is about "recoverability," that is a property of the *world*, not the *agent*. If the world makes losses recoverable in aggregates, that should affect the *value* of the aggregate outcome (Utility). Putting it in the Weighting Function implies the agent's *attitude* changes based on aggregation, not just the value. This creates the tension in Component 4. **Verdict:** Non-fungibility logically belongs in Utility (outcomes); putting it in Weighting (probabilities) creates the framing vulnerability.
  *   **Are the two commitments (Small Reject/Large Accept) derivable?**
      *   Yes, for a wide class of concave functions (e.g., $r(p) = p^2$).
      *   Small: $-100 + r(0.5)(210)$. If $r(0.5) < 0.476$, Reject.
      *   Large: $-600 + r(0.5)(10600)$. If $r(0.5) > 0.056$, Accept.
      *   Package: As $N \to \infty$, the distribution converges to a sure gain. $r(1) = 1$. Accept.
      *   *Failure would show:* That the risk function cannot be both sensitive enough to reject small stakes and insensitive enough to accept large stakes without violating continuity. (Current math says it holds).
  *   **Does it extend to collective decisions?**
      *   Poorly. Aggregating rank-weighted preferences often leads to cycles or violations of the Pareto principle if risk attitudes differ.

  ---

  ### 4. Distinctive Predictions

  Your position predicts patterns that rivals do not:

  1.  **Vs. Orthodox EU:** EU predicts preference reversals between small and large stakes *only* if utility is non-linear (diminishing marginal utility). You predict reversals *even with linear utility* due to the weighting function.
      *   *Test:* Elicit utility for money via risk-free choices (linear). Then offer small vs. large gambles. EU predicts risk neutrality. You predict risk aversion on small, neutrality on large.
  2.  **Vs. Ambiguity Aversion:** Ambiguity accounts (e.g., MaxMin) predict rejection due to unknown probabilities. Your view predicts rejection even with known probabilities (50/50 coin).
      *   *Test:* Use objective chances (urns with known counts). Ambiguity aversion vanishes; your risk aversion remains.
  3.  **Vs. Probability Distortion (Descriptive):** Prospect Theory posits probability weighting as a cognitive error. You posit it as rational.
      *   *Test:* Normative pressure. If you train agents on EU logic, Prospect Theory predicts they will still distort (bias). You predict they *should* distort if non-fungibility is present. If you can manipulate non-fungibility (e.g., by offering insurance/backstops), your view predicts risk aversion should *drop*. Prospect Theory predicts weighting is stable regardless of backstops.

  ---

  ### 5. The Unfalsifiability Verdict

  **Honest Verdict:** The package, particularly with the **Locality Clause**, is at high risk of being qualified into unfalsifiability.

  *   **Why:** The clause "which problems an agent faces is a matter of fact" is the shield. If an agent accepts a gamble, you say "She faced it as a portfolio." If she rejects, you say "She faced it as an isolated risk." Since the "fact" of the problem boundary is not independently defined (is it temporal? spatial? contractual?), any behavior can be rationalized post-hoc by adjusting the problem individuation.
  *   **Defect or Feature:** In a normative theory, this is a **defect**. A normative theory must be able to say "You faced one problem, but you acted as if it were two, and that was irrational." If the theory cannot distinguish the *actual* problem structure from the *agent's perception* of it without collapsing into descriptivism, it loses its normative force.
  *   **Fix:** You must define "decision problem" objectively (e.g., "all gambles available within a specific temporal window"). But doing so invites the Framing Pump (see Fatal Exposure #1).

  ---

  ### 6. The Construction: The Sequential Non-Fungibility Pump

  You asked for a fully specified finite decision problem where the four components cannot all be honored. Here it is.

  **The Setup:**
  *   **Agent:** Has linear utility for money ($u(x) = x$) and a concave risk function $r(p) = p^2$.
  *   **Gamble $G$:** Coin flip. $+110$ (Heads), $-100$ (Tails).
  *   **Sequence:** The agent will be offered $G$ exactly **100 times**, sequentially, one per day.
  *   **Independence:** All flips are independent.
  *   **Information:** The agent knows at $t=0$ that she will be offered 100 sequential gambles.
  *   **Non-Fungibility Fact (Component 3):**
      *   Isolated Loss ($-100$): Non-recoverable within the day. High non-fungibility.
      *   Aggregate Loss (100 flips): By CLT, probability of net loss $< 0.0001$. Losses are recoverable by gains. Low non-fungibility.
  *   **Locality Fact (Component 4):** The offers arrive one per day. Each day, the agent faces a *new* decision problem. She cannot bind her future self contractually.

  **The Conflict:**

  1.  **Normative Core (Component 1) + Non-Fungibility (Component 3):**
      *   The agent *ought* to track non-fungibility.
      *   In the **Aggregate**, non-fungibility is low. The rational attitude is near risk-neutrality. The REU of the 100-gamble package is $\approx +500$. The agent *ought* to secure this gain.
      *   To secure this gain, she must accept the gambles.

  2.  **Locality Clause (Component 4):**
      *   On Day 1, the agent faces **one** gamble $G$.
      *   The "problem as faced" is isolated. The downside is $-100$ (non-recoverable *within this problem*).
      *   REU of $G$ in isolation: $-100 + r(0.5)(210) = -100 + 0.25(210) = -100 + 52.5 = -47.5$.
      *   Rational choice under Locality: **Reject**.

  3.  **The Contradiction:**
      *   If she follows **Locality** (Component 4), she rejects Day 1. By induction, she rejects all 100 days. Total Payoff: **0**.
      *   If she follows **Non-Fungibility** (Component 3), she recognizes the aggregate risk is recoverable. She *should* accept. But to accept Day 1, she must treat Day 1 as part of the Aggregate Package.
      *   **Violation:** Treating Day 1 as part of the Package violates Locality (Component 4), because the "fact" is she faces a single offer today, not a bundle.
      *   **Result:** She cannot simultaneously honor Locality (treat today as isolated) and Non-Fungibility (treat today as recoverable).
      *   **Pump:** An adversary offers the 100 gambles sequentially to your Agent (Payoff 0). The adversary offers the 100 gambles as a single bundle to an EU Maximizer (Payoff 500). Your Agent is rationally required (by her own lights) to end up poorer, despite knowing the aggregate structure.

  **Arithmetic of the Failure:**
  *   **Component 3 says:** Risk aversion scales with non-recoverability. In the sequence, losses *are* recoverable. $\rightarrow$ **Accept.**
  *   **Component 4 says:** Weighting applies to the problem as faced. The problem is a single flip. Losses are *not* recoverable in this problem. $\rightarrow$ **Reject.**
  *   **Component 1 says:** Maximize REU.
      *   $REU(\text{Sequence Plan}) = +500$.
      *   $REU(\text{Local Plan}) = 0$.
      *   To maximize REU, she must violate Locality. To honor Locality, she must fail to maximize REU (relative to the available sequence).

  **Conclusion of Construction:**
  You cannot honor Component 3 (Non-fungibility tracks objective recoverability) and Component 4 (Locality tracks structural presentation) simultaneously in a sequential environment where objective recoverability depends on aggregation but structural presentation is sequential. One must give. If Locality gives, the view collapses into standard REU with aggregation (vulnerable to framing). If Non-fungibility gives, the view collapses into local risk aversion (vulnerable to the "small stakes paralysis" you explicitly disavowed).
