answer: |-
  # Q&A Prep Sheet: Reason-Insensitivity & Manipulation

  **Audience:** Applied Behavioral Scientists (85%) + Political Philosophers (15%)
  **Goal:** Defend the process-based account without alienating the practitioners or getting crushed by the domination theorists.

  ---

  ### 1. Goodwill Concessions (First 10 Minutes)
  *Do not wait for Q&A to make these. Bake them into the close of your main remarks to disarm the room.*

  *   **Concede the Correlation:** Admit that bypassing reasoning is *usually* a red flag for manipulation. You are arguing it's not the *definition*. This stops the behavioral scientists from thinking you're ignoring the psychological literature.
  *   **Concede the Normative Weight:** Acknowledge that calling something "manipulative" doesn't automatically mean "impermissible." A life-saving default might be manipulative on your account but still justified. This prevents the room from panicking that you're demanding they shut down public programs.
  *   **Concede the Salesman Intuition:** Admit that the "slimy used-car salesman" example is counter-intuitive. You aren't saying he's *moral*, just that his vice might be deception or exploitation, not manipulation *strictly defined*.

  ---

  ### 2. The Question You're Praying Nobody Asks
  **"The 'So What?' Challenge"**
  *   **The Question:** "Okay, suppose you're right. Suppose this well-funded savings program is 'manipulative' by your definition but saves thousands of retirements. And suppose the salesman is 'clean' but sells lemons. What practical work is this definition doing? If the moral verdict doesn't change, why should we change our vocabulary?"
  *   **Why it's Dangerous:** It renders your distinction academically interesting but practically inert. If the behavioral scientists conclude, "We'll be manipulative, but it's justified," your thesis loses its bite. If the philosophers conclude, "Domination covers this better," your theory is redundant.
  *   **The Hail Mary Reply:** "It changes the remediation. If the vice is bypassing reasoning, the fix is education. If the vice is reason-insensitivity, the fix is *feedback architecture*. We don't need to teach people to think harder; we need to build systems that listen better. It shifts the design burden from the target to the influencer."

  ---

  ### 3. Top 4 Objections (Ordered by Damage)

  #### Objection #1: The "Opt-Out is the Procedure" Defense
  *   **Damage Level:** Critical. If this sticks, your theory collapses into standard consent models.
  *   **How They'll Phrase It:** "In our RCTs, the opt-out mechanism *is* the reason-sensitivity procedure. If a participant has a reason to leave, the channel exists. By your logic, any default with an exit cost is manipulative, which makes the concept too broad to be useful."
  *   **Your 2-Minute Reply:**
      "I'd push back on equating 'exit' with 'reason-sensitivity.' An opt-out is reactive; it puts the burden on the target to act after the influence is already locked in. My account requires the *design process* to anticipate reasons beforehand.
      Think of it like a treatment arm. If you design a nudge based on aggregate data without modeling heterogeneity, you've locked in a message that won't shift even if sub-groups have strong reasons to resist. That's reason-insensitive. A truly sensitive procedure wouldn't just offer an exit; it would use heterogeneity analysis to tailor the default or flag the friction *before* deployment. Opt-out is a safety valve, not a listening mechanism."
  *   **Where You're Soft:** You haven't defined how much "anticipation" is required. If they ask, "How much heterogeneity analysis is enough to avoid manipulation?" you risk setting a bar so high no policy can clear it.

  #### Objection #2: The Scale/Feasibility Objection
  *   **Damage Level:** High. This makes your theory hostile to public policy.
  *   **How They'll Phrase It:** "We design for millions. We can't know individual reasons. If reason-sensitivity requires individual tailoring, then all public policy is manipulative. Are you arguing the state *cannot* non-manipulatively influence citizens at scale?"
  *   **Your 2-Minute Reply:**
      "I'm not arguing for individual tailoring. 'Reasons' can be statistical. If your RCT data shows a subgroup fails to benefit, and you ignore that heterogeneity to keep the default uniform, that's process insensitivity.
      But I am willing to bite a small bullet here: Large-scale policy *is* inherently riskier for manipulation than face-to-face interaction because it lacks feedback loops. That doesn't mean we ban it. It means we should call it manipulation, acknowledge the trade-off for efficiency, and build in compensatory monitoring. Don't hide the manipulation behind the label 'nudge.'"
  *   **Where You're Soft:** You're admitting that effective public policy is inherently manipulative. The room might decide your definition is simply out of touch with the realities of governance.

  #### Objection #3: The Domination/Power Asymmetry Attack
  *   **Damage Level:** Medium-High. Comes from the two philosophers, but could sway the room on normative grounds.
  *   **How They'll Phrase It:** "Domination isn't about reason-sensitivity; it's about arbitrary power. Even if your process is sensitive to my reasons, if you hold the power to change the rules unilaterally, I'm still dominated. A benevolent master is still a master."
  *   **Your 2-Minute Reply:**
      "I agree that domination is about arbitrary power. But what makes power 'arbitrary'? I'm arguing that power is non-arbitrary precisely when it's forced to track the reasons of the subject.
      If the influencer is structurally required to adjust the influence based on the target's reasons, they aren't exercising arbitrary will—they're acting as a conduit for the target's own rationality. The domination vanishes when the power loses the capacity to ignore the subject. So reason-sensitivity isn't just a nice feature; it's the antidote to arbitrariness."
  *   **Where You're Soft:** The philosophers will argue that structural power imbalances make "reason-sensitivity" illusory (e.g., I can give reasons, but you decide which ones count). You haven't addressed who validates the reasons.

  #### Objection #4: The "Slimy Salesman" Intuition Pump
  *   **Damage Level:** Medium. Attacks the plausibility of your view.
  *   **How They'll Phrase It:** "You're telling me a used-car salesman who listens to my budget and fears, then tailors a deceptive pitch to exploit them, is *less* manipulative than a government auto-enrollment? That violates the basic intuition of what manipulation is."
  *   **Your 2-Minute Reply:**
      "It violates the intuition because we conflate manipulation with 'influence that feels bad.' My claim is descriptive. The salesman is engaging in *exploitation* or *deception*, which are distinct vices. He is tracking your reasons—he knows you're worried about cost, so he hides the fees. That's reason-sensitive, but dishonest.
      The government default ignores your specific reasons but isn't lying. By separating these, we get better tools. We fight the salesman with truth-in-lending laws (anti-deception), and we fight the state with feedback requirements (anti-manipulation). Lumping them together blunts both weapons."
  *   **Where You're Soft:** It sounds like semantic gerrymandering. Most people think the salesman is the *paradigm* of manipulation. Denying this makes you look disconnected from ordinary language.

  ---

  ### 4. General Q&A Tactics
  *   **If they ask for a metric:** Do not promise a quantitative metric for "reason-sensitivity." Say it's a qualitative design audit.
  *   **If the philosophers gang up:** Pivot to the behavioral scientists. "This is why we need the practitioners in the room. Theory tells us *why* sensitivity matters; you tell us *how* to build it."
  *   **If someone says "Informed Consent":** Distinguish immediately. Consent is a one-time signature. Reason-sensitivity is an ongoing process constraint. You can consent to a manipulative process.
