      *   *Section 4: The Payoff.* (Maximal vs Maximum).
      *   *Section 5: The Cost.* (Choice Audit).

  5.  **Refining the "Choice Audit" for Vector Spaces:**
      *   The prompt mentions: "I've been telling the class that countable choice is plenty because you only ever add one vector at a time."
      *   *Correction/Nuance:* For *arbitrary* vector spaces, you need Full AC (or at least Boolean Prime Ideal Theorem/Zorn). For *countable dimensional* spaces, you need Countable Choice. If the student is proving "Every vector space has a basis," Zorn is standard, but the prompt implies the instructor believes Countable Choice is enough.
      *   *Wait, re-reading prompt:* "my own handout on bases for vector spaces, where I've been telling the class that countable choice is plenty because you only ever add one vector at a time."
      *   *Mathematical Reality Check:* This is actually a common misconception unless the space is known to be separable/countable-dimensional. If the space is arbitrary, Countable Choice is *not* enough. However, the prompt asks me to run the protocol on *their* handout. If the protocol is honest, it should flag that Zorn implies Full AC, while the instructor claims Countable. I need to make sure the protocol highlights this tension in the "Audit" section without contradicting the instructor's specific course context too aggressively, but accurately reflecting the set-theoretic cost of *using Zorn*.
