      Make sure "Empty Set is a Chain" is explicit in the Chain Closure step.

      *Final check on the "Finite Subsets of N" case:* The error is "Union of chain of finite sets is finite." The protocol must force them to justify *why* the union is in the poset. This will expose the lie.

