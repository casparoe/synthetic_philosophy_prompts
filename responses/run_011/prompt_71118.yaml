answer: |-
  # ZORN'S LEMMA TRIAGE PROTOCOL
  **Course:** First-Year Structures | **Time Limit:** 15 Minutes | **Status:** Diagnostic Only

  **INSTRUCTION:** Fill out the slots below in order. If you hit a **STOP**, do not proceed to Zorn's Lemma. Fix the error or find a different proof method. Do not bring the proof to clinic until all Stops are cleared.

  **RULE 0:** The word **"obviously"** is banned. If you write it, erase it. Replace it with "because [axiom/definition/previous step]."

  ---

  ### SLOT 1: THE "CHEAPER TOOL" CHECK
  *Before defining a poset, state the theorem you are proving.*
  *   **Question:** Does this proof require uncountable choice?
  *   **Checklist:**
      *   [ ] Is the object countable? (Try Induction).
      *   [ ] Can you construct a sequence step-by-step? (Try Dependent Choice).
      *   [ ] Is this a compactness argument on a graph/tree? (Try König's Lemma).
  *   **Decision:** If you checked any box above, **STOP**. You are likely using a sledgehammer on a nut. Consult the instructor on whether Zorn is *required* for this specific assignment.
  *   **If NO cheaper tool applies:** Proceed to Slot 2.

  ### SLOT 2: THE OBJECT (SET VS. CLASS)
  *Define your partially ordered set $(P, \leq)$.*
  *   **Write:** $P = \{ x \mid \dots \}$
  *   **Question:** Is $P$ a **set**?
  *   **Check:** Can you find a known set $S$ (e.g., $\mathcal{P}(R)$, $\mathcal{P}(V)$) such that $P \subseteq S$?
      *   [ ] Yes, $P$ is a subset of [Write $S$ here]: _______________
      *   [ ] No / I don't know.
  *   **Decision:** If No, **STOP**. Zorn's Lemma applies to sets, not proper classes.
  *   **If Yes:** Proceed to Slot 3.

  ### SLOT 3: THE ENGINE (NON-EMPTY & CHAIN CLOSURE)
  *Zorn requires: (1) $P \neq \emptyset$, and (2) Every chain has an upper bound **in $P$**.*
  *   **Part A (Non-Empty):**
      *   [ ] Exhibit one element $x_0 \in P$. (Hint: The empty set is a chain; its upper bound must exist).
      *   [ ] Specific element: _______________
  *   **Part B (Chain Closure):**
      *   Let $C \subseteq P$ be a chain. Let $u = \bigcup C$ (or the specific upper bound candidate).
      *   **Write out the verification:** Why is $u \in P$? Do not skip steps.
      *   *Draft:* "Since every $c \in C$ has property [Property of P], then $u$ has property..."
      *   **Check:** Does this hold if $C$ is infinite?
      *   **Decision:** If you cannot verify $u \in P$ rigorously, **STOP**. This is the most common failure point.
  *   **If Verified:** Proceed to Slot 4.

  ### SLOT 4: THE PAYOFF (MAXIMAL VS. MAXIMUM)
  *Zorn gives you a **maximal** element $m$. It does not give you a **maximum**.*
  *   **Definition Check:**
      *   [ ] Maximal: No element is strictly greater than $m$.
      *   [ ] Maximum: $m$ is greater than or equal to *all* elements.
  *   **Application:** Does your proof require $m$ to be unique or comparable to everything?
      *   [ ] Yes. **STOP**. Zorn does not guarantee this.
      *   [ ] No, I only need $m$ to not be extendable.
  *   **Final Logic:** Does "maximal in $P$" imply "has the property I want"?
      *   [ ] Yes (Explain why): _______________
      *   [ ] No. **STOP**.
  *   **If Clear:** Proceed to Slot 5.

  ### SLOT 5: THE COST (CHOICE AUDIT)
  *Record the axiomatic cost of this specific proof draft.*
  *   **Did you invoke Zorn's Lemma?** [ ] Yes [ ] No
  *   **If Yes:** You have used **Full Axiom of Choice**.
  *   **Reflection:** Based on Slot 1, could this be done with less?
      *   [ ] None (Constructive)
      *   [ ] Countable Choice ($AC_\omega$)
      *   [ ] Dependent Choice ($DC$)
      *   [ ] Full Choice ($AC$ / Zorn)
  *   **Note:** If you marked Zorn but suspect Countable/Dependent is enough, flag this for discussion. The protocol cannot settle this; it requires external verification.

  ---

  ## CALIBRATION RUNS (Instructor Notes)

  Below are four test cases run through the protocol to demonstrate its filtering capacity.

  ### 1. Maximal Ideal in Nonzero Commutative Ring ($R, 1 \neq 0$)
  *   **Slot 1 (Cheaper Tool):** No induction possible on arbitrary rings. No obvious sequence. **Pass.**
  *   **Slot 2 (Set/Class):** $P = \{ I \subsetneq R \mid I \text{ is a proper ideal} \}$. $P \subseteq \mathcal{P}(R)$. **Pass.**
  *   **Slot 3 (Engine):**
      *   Non-empty: $(0) \in P$ since $1 \neq 0$. **Pass.**
      *   Chain Closure: Let $C$ be a chain of proper ideals. $u = \bigcup C$. $u$ is an ideal (standard check). Is $u$ proper? Yes, because $1 \notin I$ for all $I \in C$, so $1 \notin u$. **Pass.**
  *   **Slot 4 (Payoff):** Maximal ideal is defined as maximal in $P$. We do not need it to be maximum (unique). **Pass.**
  *   **Slot 5 (Audit):** Invoked Zorn. Cost: Full AC.
  *   **Result:** **CLEARED.** This is a valid use case.

  ### 2. Baire Category Theorem (Complete Metric Spaces)
  *   **Slot 1 (Cheaper Tool):** Theorem involves a countable intersection of dense open sets. Proof typically constructs a nested sequence of balls.
      *   Check: "Can you construct a sequence step-by-step?" **YES.**
      *   Check: "Is this a compactness argument?" **NO**, but it is sequential.
      *   **Decision:** **STOP.** The standard proof uses Dependent Choice (nested balls), not Zorn. Using Zorn obscures the metric structure.
  *   **Result:** **FLAGGED.** Student must justify why Zorn is preferred over the standard nested ball construction.

  ### 3. Poset of Finite Subsets of $\mathbb{N}$ (The "Broken" Specimen)
  *   **Slot 1 (Cheaper Tool):** N/A (Proof is attempting to show a maximal element exists). **Pass.**
  *   **Slot 2 (Set/Class):** $P = \{ A \subseteq \mathbb{N} \mid |A| < \infty \}$. $P \subseteq \mathcal{P}(\mathbb{N})$. **Pass.**
  *   **Slot 3 (Engine):**
      *   Non-empty: $\emptyset \in P$. **Pass.**
      *   Chain Closure: Let $C$ be a chain of finite sets. Let $u = \bigcup C$.
      *   *Student Draft:* "Union of sets is a set."
      *   *Protocol Check:* "Why is $u \in P$?" i.e., Why is $u$ finite?
      *   *Reality:* If $C = \{ \{0\}, \{0,1\}, \{0,1,2\}, \dots \}$, then $u = \mathbb{N}$, which is infinite. $u \notin P$.
      *   **Decision:** **STOP.** The union of a chain in $P$ is not necessarily in $P$. Zorn's Lemma hypotheses are not met.
  *   **Result:** **BROKEN.** Caught at Slot 3.

  ### 4. Existence of Basis for Vector Spaces (Instructor Handout)
  *   **Slot 1 (Cheaper Tool):** Space is arbitrary (possibly uncountable dimension). Induction fails. **Pass.**
  *   **Slot 2 (Set/Class):** $P = \{ S \subseteq V \mid S \text{ is linearly independent} \}$. $P \subseteq \mathcal{P}(V)$. **Pass.**
  *   **Slot 3 (Engine):**
      *   Non-empty: $\emptyset$ is LI. **Pass.**
      *   Chain Closure: Union of a chain of LI sets is LI. (Dependence relation involves finitely many vectors, so it must appear in some element of the chain). **Pass.**
  *   **Slot 4 (Payoff):** Maximal LI set spans $V$ (is a basis). **Pass.**
  *   **Slot 5 (Audit):**
      *   Invoked Zorn? **Yes.**
      *   Cost: **Full AC.**
      *   Reflection: Instructor notes suggest Countable Choice might suffice for specific cases, but for *arbitrary* spaces, Zorn (Full AC) is the standard tool. However, if the course handout claims Countable Choice is enough for *all* spaces, there is a tension here.
      *   **Decision:** **FLAG FOR DISCUSSION.** The proof is valid, but the "Cost" slot reveals the proof uses Full AC. If the course goal is to minimize choice axioms, the student must note that Zorn overshoots Countable Choice.
  *   **Result:** **CLEARED (with Audit Flag).** The logic holds, but the axiom strength is recorded honestly.

  ---

  ## LIMITATIONS & JUDGMENT CALLS

  This protocol is a sieve, not a verifier. It will not catch every error, and it may flag correct intuitions.

  1.  **False Negatives (The "Cheaper Tool" Slot):** A student might genuinely not know a constructive proof exists (e.g., Baire). The protocol flags it, but a senior mathematician might still accept the Zorn proof as valid, just inelegant. This slot forces awareness, not correctness.
  2.  **The "Set vs. Class" Intuition:** First-year students often lack the intuition to distinguish a large set from a proper class. They may check "Yes" incorrectly. This protocol relies on their ability to identify a superset $S$; if they lie here, the protocol fails.
  3.  **Choice Strength Ambiguity:** Slot 5 asks students to audit axiom strength. Most cannot do this reliably. The instruction explicitly states: *"sometimes you just have to go ask a set theorist."* The value is not in the correct answer, but in the student realizing there *is* a cost to check.
  4.  **Chain Closure Nuance:** In the Vector Space case, the union of LI sets is LI. In the Finite Subset case, the union of finite sets is not finite. The protocol forces the writing of this step, but it cannot verify the truth of the student's assertion. It relies on the student being honest when they realize they can't justify "u is finite."

  **Summary:** The protocol prevents the *structural* sins (skipping non-emptiness, ignoring chain closure, confusing max/maximal). It does not prevent *arithmetic* or *algebraic* errors within the slots. It is a safety harness, not a guarantee of flight.
