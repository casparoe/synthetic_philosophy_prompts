answer: |-
  ### 1. The Requirements List

  To make Aristotle's criticism of money (specifically usury) intelligible, an account of money must satisfy the following conditions. I have distinguished between requirements demanded by the text itself and those demanded by the philosophical framework (the "school commitment") necessary to sustain the argument.

  1.  **The Commensurability Requirement:** Money must render heterogeneous goods comparable enough for exchange to occur.
      *   *Consideration:* Without this, reciprocity is impossible. A builder cannot trade with a shoemaker unless there is a single denominator that equates a house to a pair of shoes. Aristotle argues that without this equality, there is no association, and without association, there is no state.
      *   *Status:* **Non-negotiable.** The text explicitly states exchange cannot happen without it.

  2.  **The Conventionality Requirement:** Money must exist by law or agreement, not by nature.
      *   *Consideration:* Aristotle notes that money can be devalued, rendered useless, or changed by decree. If money were natural (like gold's luster), it could not be altered by human fiat. This distinguishes money from the goods it measures.
      *   *Status:* **Non-negotiable.** He plainly states it exists by convention.

  3.  **The Teleological Requirement:** Money must have a specific natural end (exchange) distinct from its mere physical capabilities.
      *   *Consideration:* This is the ground for the charge that interest is "contrary to nature." A thing is only used unnaturally if it has a proper nature to violate. If money is merely a tool with no inherent purpose, using it to breed is just innovation, not perversion.
      *   *Status:* **School Commitment.** This relies on Aristotelian metaphysics (final causes). A modern economist would reject this as a category error, but without it, the critique collapses.

  4.  **The Stability Requirement:** Money must retain sufficient identity over time to act as a bridge between present and future exchange.
      *   *Consideration:* If money fluctuates too wildly, it cannot serve as the "demand representative" that holds the association together over time. It must be stable enough to be stored, even if not perfectly constant.
      *   *Status:* **Non-negotiable (Practical).** While Aristotle admits fluctuation, he implies it must be slower than other commodities to function as the common measure.

  5.  **The Separability Requirement:** The measure must be distinguishable from the things measured.
      *   *Consideration:* In your trade, the thermometer is not the heat. In Aristotle's account, money is not the need, but the representative of need. If money becomes the object of desire itself (hoarding), it ceases to be a measure and becomes a good, violating its function.
      *   *Status:* **School Commitment.** This follows from the Teleological Requirement. It is necessary to distinguish "household management" (getting goods for need) from "wealth-getting" (getting money for money's sake).

  ### 2. Unsatisfiable Subsets

  You suspected a triple trouble, and you are correct. The set comprising **The Conventionality Requirement**, **The Commensurability Requirement**, and **The Stability Requirement** cannot be jointly satisfied to a high degree of precision.

  If money is purely conventional (Req 2), its value is subject to political will and can be altered at will. If it can be altered at will, it lacks the stability (Req 4) required of a rigorous measure. If it lacks stability, it cannot provide the genuine commensurability (Req 1) needed to equate a house and shoes in anything more than a transient, subjective agreement.

  Aristotle acknowledges this tension but glosses over it. He admits money fluctuates but claims it is *more* stable than other goods. This is a pragmatic fudge, not a metrological solution. In your terms, he is using a rubber ruler to measure wood. It works for the marketplace because the errors average out socially, but it fails as a strict measure. If you demand strict metrological consistency, you must drop the Conventionality Requirement (making money a commodity like gold) or drop the Commensurability Requirement (admitting money does not actually measure value, but only facilitates trade). Aristotle wants to keep all three, which is why his account feels unstable to a metrologist.

  ### 3. The Most Exclusionary Requirement

  The **Teleological Requirement** does the most work in excluding candidates.

  Most modern and alternative accounts of money (barter, state theory, credit theory) treat money as a mechanism or a technology. A technology is judged by efficiency, not by adherence to a natural end. If money is merely a tool to reduce transaction costs, there is no "unnatural" use; there is only effective or ineffective use.

  By insisting that money has a *nature* (exchange) that can be violated (breeding), Aristotle excludes any account that views money as neutral. This requirement forces the definition of money to be normative. It excludes the view that money is simply whatever the market accepts, because the market might accept usury. It excludes the view that money is simply a state debt, because the state might legislate interest. For Aristotle's critique to land, money must be something that *resists* certain uses by its very definition. This is a heavy metaphysical lift that most subsequent theories discard.

  ### 4. Measurement: Scalar, Ordinal, or Arbitrary?

  Your professional suspicion is well-founded. Calling money a "measure" implies a magnitude. Here is how the three interpretations fare against the requirements.

  **Answer A: Real Scalar (e.g., Labor or Objective Need)**
  This view holds that there is a hidden quantity (like labor-time) in every good, and money reveals it.
  *   *Verdict:* This satisfies Commensurability and Stability best. It treats value like length.
  *   *Failure:* It fails the **Conventionality Requirement**. If value is an intrinsic scalar (labor), money should not be alterable by law. Aristotle explicitly rejects the idea that goods are commensurable in themselves; he says they become commensurable *through* money. Furthermore, he acknowledges that different skills have different worth, which a simple labor-scalar cannot explain without arbitrary weighting.

  **Answer B: Ordinal Ranking (Subjective Preference)**
  This view holds that there is no common magnitude, only rankings (I prefer shoes to bread).
  *   *Verdict:* This satisfies Conventionality. It acknowledges value is in the eye of the beholder.
  *   *Failure:* It fails the **Commensurability Requirement**. You cannot exchange one house for five pairs of shoes based on ordinals alone. You need a ratio. Aristotle insists on a ratio ("so many shoes equal one house"). Pure ordinalism makes the "measure" talk a lie; there is no measuring happening, only matching.

  **Answer C: Arbitrary Unit of Account (Numeraire)**
  This view holds that money is a chosen standard (like the meter) against which prices are quoted, but it measures nothing real.
  *   *Verdict:* This satisfies Conventionality and Separability. It aligns with the "stamp" analogy you noted.
  *   *Failure:* It fails the **Teleological Requirement**. If the unit is arbitrary, there is no "nature" to violate. You cannot say interest is contrary to the nature of the dollar if the dollar is just a counter. To save the critique, one must argue that the *practice of exchange* has a nature, even if the *token* does not.

  **My Commitment:**
  I argue that Aristotle is attempting **Answer C** but relies on **Answer A** to make the moral critique work. He knows money is conventional (C), but he needs value to be real enough to be "just" or "unjust" (A). Your metrological intuition identifies the gap: he is using a conventional token to measure a social magnitude that has no physical substrate. The "weights and bases" you mention are chosen by the political community. Different communities choose different weights, yielding different "values." Aristotle accepts this, but insists there is a *correct* weighting that preserves the association. That is not metrology; it is politics disguised as measurement.

  ### 5. Scoring the Contenders

  **Aristotle's Own Account**
  *   *Performance:* High on Teleology and Conventionality.
  *   *Failure:* Fails **Stability** and **Precision**. He admits money fluctuates and is a proxy for demand, not a direct measure. He relies on the "stamp" to certify value, which admits that the value is not intrinsic to the metal.
  *   *Reinterpretation:* He must reinterpret "measure" to mean "social equalizer" rather than "quantitative determinant."

  **The Barter Account (Money evolves to solve double coincidence of wants)**
  *   *Performance:* High on Commensurability (money emerges from real exchange ratios).
  *   *Failure:* Fails **Conventionality**. This account makes money natural and evolutionary. If money arises spontaneously from trade, the State cannot define it, and it is harder to argue it has a single "natural" end imposed from above. It makes money a commodity, which Aristotle distinguishes it from.

  **The State Account (Chartalism: Money is what settles debt to the state)**
  *   *Performance:* High on Conventionality and Stability (state enforces value).
  *   *Failure:* Fails **Teleological Limit**. If the State creates money, the State can define its use. If the State legislates interest, it becomes "natural" by decree. This account removes the ground for saying interest is *inherently* wrong; it could only be illegal.

  **The Credit Account (Money is a transferable record of obligation)**
  *   *Performance:* High on Separability (money is a relation, not a thing).
  *   *Failure:* Fails **The Measure Requirement**. A record of debt does not measure value; it records a promise. This makes the "breeding" of money (interest) a change in the terms of the promise, not a perversion of a measuring device. It dissolves the metrological analogy entirely.

  ### 6. The Charge About Interest: Moral or Conceptual?

  I commit to the view that the charge is **Conceptual**, which grounds the Moral.

  If the charge were merely moral (greed is bad), it would be contingent. A lender could be generous, yet still charge interest. Aristotle's argument is stronger: he claims usury is a category mistake. Money is a measure of exchange. A measure is a mean. For a measure to generate more of itself is for the mean to become an extreme. It is like asking a ruler to measure itself and grow longer in the process.

  This reading makes the argument **better** philosophically, though worse economically. It makes the argument better because it renders the prohibition necessary rather than contingent. It is not that interest is *sinful*; it is that it is *nonsensical* within the defined system. It treats money as a good (which can breed) when it is actually a relation (which cannot).

  However, this relies entirely on the **Teleological Requirement**. If you reject the idea that tools have natures, the conceptual charge vanishes. If money is just a tool, using it to breed is no more a category error than using a hammer to crack a nut instead of driving a nail. It is just a different use.

  Therefore, for Aristotle to be right, you must accept that the social world has a structure analogous to the physical world, where things have proper functions. Your metrological background makes this difficult, because in physics, a ruler does not have a "moral" function, only a physical one. Aristotle is projecting physical teleology onto social conventions. The "error" of interest is not that it violates a law of physics, but that it violates the logic of the association (the *koinonia*). It turns the medium of connection into an end in itself, dissolving the connection.

  **Final Word to the Metrologist:**
  You are right to halt. Aristotle is not doing metrology. He is using the *language* of metrology to describe a social equilibrium. When he says money "measures" demand, he means it "stabilizes" reciprocity. When he says interest is "unnatural," he means it is "destructive of the association." The friction you feel is the friction between physical quantity and social value. Do not try to resolve it by finding a better theory of money; resolve it by recognizing that Aristotle is describing a political bond, not a physical magnitude. The "unit" is not the coin; the unit is the citizen's need, and the coin is merely the token that acknowledges it.
