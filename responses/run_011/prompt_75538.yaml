      *   **(3) Maya:** Anscombe didn't just assert; she criticized "Unconditional Surrender." This shows she's offering a substantive constraint on means, not just "lose the war."
          *   *Assessment:* Historically accurate. Anscombe did argue that the policy of Unconditional Surrender created the trap. This shows her ethics isn't pacifism but constrained just war theory.
          *   *Rating:* Right.

      *   **(4) Sam:** Double Effect problem. Intention is invisible. Truman could claim he intended surrender, not death. Distinction collapses or lets everyone off.
          *   *Assessment:* This is the classic critique of Double Effect (PDE). It highlights the epistemological difficulty of ascertaining intention.
          *   *Rating:* Strong challenge, but assumes intention is *only* internal mental states (which Anscombe denies).

      *   **(5) Maya:** Intention is read from the *plan*, not post-hoc claims. If deaths are instrumental to the plan (city's population makes the weapon work), they are intended. She condemned firebombing too.
