  Good evening. Justice Vance. Mr. Vance. Colleagues. Friends.

  I stand here as a former clerk. It has been twenty-six years since I sat in these chambers. I now work on collective decision-making. Justice Vance knows this well. She has known for two decades that I regard her profession's favorite argument about panel adjudication as far weaker than it looks. She has enjoyed telling me so at dinner. She would raise a glass and ask if the math had changed. I would say no. She would smile. She is right.

  There is a mathematical claim about groups: if each member is more likely than not to be correct and votes without influencing others, the majority verdict is more reliable than any single member's judgment.

  We want to believe this about your court. We want to say three heads are better than one. But the math requires independence. Judges do not vote in isolation. They talk. They read each other's drafts. They change their minds. The independence required by the theorem dissolves in conversation.

  Nor does the math handle hard cases well. At this level, the questions are not simple facts. They are disputes where informed and conscientious people differ. To say each judge is more likely than not to be right is exactly what is in dispute. And three judges do not make a crowd. The promise that majorities tend toward certainty as they grow does not apply here. Her cases were almost never the single yes-or-no question the theorem is about in the first place.

  Then there is the record. One dissent in thirty-one years.

  There is a good reading of that number. It suggests a panel of genuinely competent judges converging on the law. There is also a reading we rarely speak aloud. It suggests a judge so thoroughly absorbed into the panel that her agreement carried no information, because it was never independent. I will not tell you that is false. I will not tell you it is true. I ask you to hold both possibilities in mind.

  Condorcet himself trusted majorities too well. He was proscribed by one, hid in a village, and died in prison.

  So why do we respect these decisions? If the theorem cannot supply the reason, where do we find it?

  We find it in what sitting on a panel does to the judges themselves. It obliges each to state her reasons in a form another person must answer. It forces the majority to confront the minority. It puts the losing side's reasons into the public record where they cannot be quietly forgotten. This matters for the litigants. It matters for the bar. It matters for the future. The value is not in the reliability of the tally. It is in the integrity of the argument. The law does not demand perfection. It demands accountability.

  Harriet, your family is here. Your children teach school. One tends to animals. Your grandchildren have never read a judicial opinion. They do not need to. They know you keep your glasses on the nightstand next to briefs. They know you leave early sometimes to see their soccer games. They know you listen before you speak. They see the person behind the robe. That is the verdict that matters at home.

  That discipline belongs to the law now. You have given it thirty-one years. You have served with honor.

  Thank you, Harriet. Thank you, Mr. Vance.

  ***

  **Note on Constraints**

  1.  *"The independence required by the theorem dissolves in conversation."* — The theorem forbade me from claiming panels were more reliable than individuals, as deliberation violates the independence condition.
  2.  *"Her cases were almost never the single yes-or-no question the theorem is about in the first place."* — The theorem forbade me from applying its logic to complex legal disputes rather than binary factual questions.
  3.  *"I ask you to hold both possibilities in mind."* — The theorem forbade me from resolving the dissent tension flatteringly, as uniform agreement undermines the independence assumption required for the theorem's validity.
