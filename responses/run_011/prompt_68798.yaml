          *   $\sum_{t=2}^{\infty} \delta^t = \frac{\delta^2}{1-\delta}$.
          *   Inequality: $1,000,000\delta < \frac{\delta^2}{1-\delta}$.
          *   Divide by $\delta$ (assuming $\delta > 0$): $1,000,000 < \frac{\delta}{1-\delta}$.
          *   $1,000,000(1-\delta) < \delta \Rightarrow 1,000,000 - 1,000,000\delta < \delta \Rightarrow 1,000,000 < 1,000,001\delta$.
          *   $\delta > \frac{1,000,000}{1,000,001} \approx 0.999999$.
          *   So V needs $\delta$ extremely close to 1 to prefer STEADY. If $\delta$ is standard (e.g., 0.95), V picks SPIKE.
      *   **PULSE vs. STEADY for U:**
