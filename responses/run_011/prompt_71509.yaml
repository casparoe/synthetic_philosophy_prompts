answer: |-
  Belief penetrates perception if and only if the experience's qualitative character is constitutively dependent on the active retrieval of semantic knowledge, excluding cases where the experience persists despite contrary belief or arises from fixed sub-personal sensory algorithms.

  The first clause ("constitutively dependent on semantic knowledge") is forced by cases 2, 3, 5, and 8, where the experience fundamentally alters or emerges only when the concept is applied (the coldness, the pawn structure, the blackberry taste, the shade difference). The second clause ("excluding... persists despite contrary belief") is forced by cases 1 and 7, where the illusion (snake, spider) remains vivid regardless of your certainty, proving the perceptual module is encapsulated from the belief. The third clause ("excluding... fixed sub-personal sensory algorithms") is forced by case 4, where color constancy corrects the grey banana to yellow automatically via visual mechanics rather than your knowledge of bananas.

  Applied to your conflicts, this principle preserves your verdicts on cases 4 and 5: the banana is fixed sensory processing (not penetration), while the wine taste depends on the semantic label (penetration). On cases 6 and 7, it preserves your verdict on the shadow (7) as non-penetration because the spider-image persists against your knowledge, but it overturns your suspicion on the ambiguous face (6): because the angry/frightened look *depends* on the cue rather than persisting against it, this counts as penetration, meaning you are not merely being agreeable in your reports but actually experiencing a conceptual shift.

  For unlisted cases, consider the Müller-Lyer illusion: knowing the lines are equal yet seeing them as unequal is not penetration (persists despite belief). Conversely, hearing a string of phonemes as distinct words in your native language but as undifferentiated noise in a foreign language is penetration (depends on semantic retrieval).

  You should stop treating experiences from cases 2, 3, 5, 6, and 8 as independent evidence for the beliefs that shaped them, because the experience is no longer a neutral check on the belief but partially constituted by it; specifically, case 5 (wine) and case 2 (mother's face) are epistemically circular, while cases 1, 4, and 7 remain reliable indicators of sensory function even if they are illusions about the world.
