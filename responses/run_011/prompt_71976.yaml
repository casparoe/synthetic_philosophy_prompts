  ### Arithmetic and Backwards Induction Check

  You suspected Move 2's logic might be leaning on a step that doesn't follow. **The arithmetic is actually solid.** Ines's backwards induction holds up:

  1.  **Node 3 (Holding C):** Offer is C → A for $5. Maya prefers A to C, and the upgrade value ($20–$30) exceeds the cost ($5). **Action:** Trade. **Result:** Ends with A, total spend $10.
  2.  **Node 2 (Holding B):** Offer is B → C for $5.
      *   *If she trades:* She gets C, pays $5. Then Node 3 happens (she trades to A, pays another $5). **Final:** A, -$10.
      *   *If she refuses:* She keeps B, pays $0. **Final:** B, -$0.
      *   *Comparison:* Is (B, $0) better than (A, -$10)? Yes. B is inherently better than A (lens), and she saves $10. **Action:** Refuse.
  3.  **Node 1 (Holding A):** Offer is A → B (Free).
      *   *If she trades:* She gets B. Then Node 2 happens (she refuses). **Final:** B, $0.
      *   *If she refuses:* She keeps A. **Final:** A, $0.
      *   *Comparison:* B is better than A. **Action:** Trade.

  **Verdict:** Maya ends with B and $0 spent. This is strictly better than starting with A. Ines's math on the finite sequence is correct; the "sneaky" part was only her claim in the last sentence that this applies to rational people generally.

