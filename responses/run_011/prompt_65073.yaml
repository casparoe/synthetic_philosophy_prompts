answer: |-
  # The Convention Classification Worksheet

  ## Part 1: Translating Lewis for the Secretariat

  You are correct that Lewis's account is the right tool, but you are partially incorrect about which conditions are load-bearing.

  **Keep These Three:**
  1.  **Regularity:** Everyone (or almost everyone) does it.
  2.  **Conditional Preference:** Everyone does it *because* they expect others to do it. If others stopped, they would stop too. This distinguishes convention from law or physical necessity.
  3.  **Arbitrariness:** There was at least one other workable solution. This distinguishes convention from technical necessity (e.g., "messages must be binary" is not arbitrary; "messages must use Tag X" is).

  **Drop This One:**
  *   **Common Knowledge:** Strictly speaking, Lewis requires that everyone knows that everyone knows... *ad infinitum*. You cannot prove this with documents.
      *   *Replacement:* **Publicity.** Is the rule published in a place all members access? Are deviations publicly visible?
      *   *Loss:* You may misclassify a "gentlemen's agreement" known to all insiders but not written down. However, for a standards body, written publicity is a sufficient proxy. If it isn't written, you shouldn't be classifying it yet.

  **The Cost of Dropping Common Knowledge:**
  You lose the ability to detect "hidden" conventions that exist socially but not textually. The procedure loses nuance regarding informal norms. However, for a secretariat managing *published* texts, this is an acceptable trade-off. You are managing written standards, not social cultures.

  ---

  ## Part 2: The Worksheet

  **Time Budget:** 90 Minutes
  **Evidence Allowed:** Implementation surveys, ticket/incident logs, WG minutes, parser rejection data, audit reports.
  **Reviewer Instruction:** Do not guess. If evidence is missing, mark "Unclassified" and specify the missing datum.

  ### Step 1: The Regularity Check (15 mins)
  *Goal: Establish if the behavior is actually universal.*

  **Q1.1:** Do implementation surveys or parser logs show 100% conformance?
  *   **Yes:** Proceed to Q1.2.
  *   **No:** Is the non-conformance limited to **two or fewer members**? **[JUDGMENT CALL FLAG: "Almost Everyone" is defined here as All minus 2. This is a policy choice, not a fact.]**
      *   **Yes:** Proceed to Q1.2.
      *   **No:** **STOP.** Verdict: **Cannot hold unaudited.** (A convention requires a stable equilibrium. Fragmentation indicates the convention has not formed.)

  **Q1.2:** How long has this regularity persisted?
  *   **Evidence:** Date of first implementation vs. current date.
  *   **Threshold:** >18 months.
  *   **If <18 months:** **FLAG:** High risk of transience. Proceed with caution.

  ### Step 2: The Impostor Filter (30 mins)
  *Goal: Ensure this is not one of the four non-convention regularities.*

  **Q2.1 (Vendor/Tool Default):** Is the regularity the default setting of a dominant middleware or vendor tool?
  *   **Evidence:** Vendor release notes, member implementation notes.
  *   **If Yes:** Ask: Do members actively override this default when it suits them, or do they leave it because they expect others to have it?
      *   **If they leave it passively:** **STOP.** Verdict: **Cannot hold unaudited.** (This is path dependence, not coordination. It will break if the vendor changes the default.)
      *   **If they actively keep it to match others:** Proceed to Q2.2.

  **Q2.2 (Audit-Sustained):** Is there an existing audit requirement for this rule?
  *   **Evidence:** Current Rulebook, Audit Reports.
  *   **If Yes:** Ask: Is there evidence in minutes or surveys that members would continue this practice if the audit penalty were removed?
      *   **Evidence for "Yes":** Minutes stating "We do this for interoperability, audit is just a check."
      *   **Evidence for "No":** Minutes stating "We do this to pass audit," OR no discussion of the rule outside audit contexts.
      *   **If Evidence is "No" or Missing:** **STOP.** Verdict: **Cannot hold unaudited.** (This is compliance, not convention.)

  **Q2.3 (Coincidence of Interest):** Does a member benefit from this rule even if *no one else* follows it?
  *   **Evidence:** Technical analysis of the field/rule.
  *   **Example:** "Encrypting your own database" benefits you regardless of others. "Using a specific message header" does not.
  *   **If Yes (Benefit is independent):** **STOP.** Verdict: **Convention status irrelevant.** (This is a best practice, not a coordination convention. It does not need classification as a convention.)
  *   **If No (Benefit depends on others):** Proceed to Q2.4.

  **Q2.4 (The "Prisoner's Dilemma" Check):** Does the evidence show members privately prefer a *different* standard but stick to this one?
  *   **Evidence:** WG minutes, change requests, complaint logs.
  *   **If Yes:** This *is* a convention (Lewis allows conventions everyone dislikes, provided they stick to them to coordinate). Proceed to Step 3.
  *   **If No:** Proceed to Step 3.

  ### Step 3: The Coordination & Arbitrariness Test (30 mins)
  *Goal: Confirm the Lewis "Conditional Preference."*

  **Q3.1:** Is there a viable alternative that was discussed and rejected?
  *   **Evidence:** Minutes from the time the practice was adopted.
  *   **If No (No alternative existed or was considered):** **STOP.** Verdict: **Cannot be classified.** (May be technical necessity.)
  *   **If Yes:** Proceed to Q3.2.

  **Q3.2:** Why do members conform?
  *   **Evidence:** Search minutes/tickets for the phrase "because others do" or "interoperability" vs. "requirement" or "mandate."
  *   **Sufficient Answer:** At least three distinct members have stated in writing that they follow the practice to ensure matching with counterparts.
  *   **Insufficient Answer:** "It is the standard." (Circular).
  *   **If Sufficient:** Proceed to Step 4.
  *   **If Insufficient:** **STOP.** Verdict: **Cannot be classified on evidence available.**
      *   **Missing Observation:** A survey question asking: "If you knew 50% of the network would switch to Alternative X tomorrow, would you switch?"

  ### Step 4: Value Judgment & Cost Flag (15 mins)
  *Goal: Identify political hurdles before the Chair makes the call.*

  **Q4.1:** If we classify this as a Convention (unaudited), and a member defects, who pays the migration cost to fix the break?
  *   **Options:** The Defector / The Victims / The Consortium.
  *   **[VALUE JUDGMENT FLAG]:** This determines political risk. If "The Victims" pay, the Chair must approve the risk.

  **Q4.2:** Does this classification override a minority implementation?
  *   **Evidence:** From Step 1.2 (The "All minus 2" rule).
  *   **[VALUE JUDGMENT FLAG]:** If Yes, the Chair must confirm the minority can migrate within 12 months.

  ### Step 5: Terminal Outcomes
  *   **Outcome A: Convention.** (Passes Steps 1-3, Costs accepted in Step 4). Publish as non-audited guidance.
  *   **Outcome B: Requirement.** (Fails Step 2.1, 2.2, or 3.2). Must remain audited to sustain interoperability.
  *   **Outcome C: Unclassified.** (Evidence missing). Return to Working Group with "Missing Observation" from Step 3.2.

  ---

  ## Part 3: Limitations of the Procedure

  **1. Static Analysis:**
  Lewis's account is static. It classifies the equilibrium *now*. It does not predict stability over five years.
  *   **The Gap:** A convention can collapse if a new technology makes the alternative (Q3.1) superior. The worksheet cannot predict this.
  *   **The Patch:** Add a "Review Date" to all Conventions (max 3 years). The worksheet classifies the present; the review cycle manages the future.

  **2. The "Papering Over" Risk:**
  Step 2.2 (Audit-Sustained) is the weakest link. Documents rarely admit "we only do this because we are forced."
  *   **Honesty:** The worksheet assumes members are rational actors. If members lie in minutes about their motivations, the worksheet will misclassify a Requirement as a Convention. There is no documentary fix for this other than removing the audit and watching what happens (which is risky).

  ---

  ## Part 4: Creating New Conventions (Bootstrapping)

  Half your requests are not about classifying existing practices but creating new ones. Lewis is skeptical here. A convention cannot be created by fiat; it emerges from behavior.

  **What must be true for a text to become a convention?**
  1.  **Salience (Focal Point):** The text must propose a solution that is naturally obvious (e.g., "Use UTC" is more salient than "Use UTC+13").
  2.  **Pre-Announcement:** Members must know *before* implementation that others are committing to the same text.
  3.  **No Incentive to Defect:** The first mover must not be penalized.

  **What typically goes wrong:**
  *   **The False Start:** The consortium publishes the text, but members wait for others to implement first. No one moves. The text becomes "aspirational" (ignored).
  *   **The Split:** Half implement Version A, half implement Version B. The text failed to provide a unique Focal Point.

  **The Cheapest Reliable Substitute:**
  If the Working Group cannot prove Salience (Q3.1 in the worksheet), **do not attempt to bootstrap a Convention.**
  *   **Substitute:** Issue it as a **Temporary Requirement** (audited) for 24 months.
  *   **Mechanism:** Use audit capacity to force the equilibrium. After 24 months, run the Worksheet. If the behavior holds due to mutual expectation (Step 3.2), *then* downgrade to Convention. If it holds only due to audit (Step 2.2), keep as Requirement.
  *   **Why:** It is cheaper to audit for 2 years than to manage silent interoperability failures for 5 years.

  ---

  ## Part 5: Test Run on Three Candidates

  ### Candidate 1: Settlement-Timing Field (Local Time vs. UTC)
  *   **Step 1 (Regularity):** Pass. "Every member encodes..."
  *   **Step 2.1 (Vendor Default):** **FAIL.** Evidence: "Spread because the two dominant middleware vendors ship that as their default."
      *   *Analysis:* Members did not choose this to coordinate; they chose it because their tools did. If Vendor A updates to UTC in the next release, members will drift unless stopped.
      *   *Impostor:* Regularity sustained by shared tool default.
  *   **Step 4 (Cost):** Incident log shows "one dispute a year." Silent degradation is occurring.
  *   **Verdict:** **Cannot hold unaudited.**
  *   **Action:** Convert to **Requirement**. Explicitly mandate either Local+Offset or UTC to lock the behavior independent of vendor defaults.
  *   **Note:** This contradicts the intuition that "everyone does it, so it's a convention." It is not; it is a technological lock-in.

  ### Candidate 2: Inbound Message Acknowledgement Window
  *   **Step 1 (Regularity):** Pass. "Universally followed."
  *   **Step 2.2 (Audit-Sustained):** **FAIL.** Evidence: "Last three audits found no violations."
      *   *Analysis:* There is no evidence in minutes that members value this for *interoperability* independent of the audit. The only evidence of compliance is the audit report itself.
      *   *Lewis Condition:* Conditional Preference is unproven. Do they acknowledge because they expect others to, or because they fear suspension?
      *   *Missing Observation:* A survey asking, "If the audit penalty were removed, would you maintain this window?"
  *   **Verdict:** **Cannot hold unaudited.**
  *   **Action:** Retain as **Requirement**.
  *   **Note:** This goes against your prior argument. The worksheet flags that "universal compliance under audit" is not evidence of convention; it is evidence of effective auditing. Removing the audit removes the only proven incentive.

  ### Candidate 3: Legacy Institution-Code Scheme
  *   **Step 1 (Regularity):** **FAIL.** Evidence: "Adoption of the alternative has reached eleven members [out of forty]."
      *   *Analysis:* 29 members are still on Legacy. 11 are on New. There is no single regularity. There are two competing regularities.
      *   *Lewis Condition:* Regularity (Condition 1) is not met.
  *   **Step 2.4 (Dislike):** Pass. "Everyone... agrees is worse."
  *   **Verdict:** **Cannot be classified.**
  *   **Action:** This is a **Coordination Failure**. Publishing the New Scheme as a "Convention" will not fix it (see Part 4).
  *   **Recommendation:** The Working Group must select *one* as a **Requirement** (likely the New Scheme, with a migration timeline) to force the equilibrium. A convention cannot be declared here because the population is split.
  *   **Note:** This case is badly constructed as a test of *convention*. It is a test of *migration strategy*. The worksheet correctly identifies that no convention exists yet.

  ---

  ## Part 6: Confidence and Supervision

  **Confidence Level:**
  I am **moderately confident** in the logic, but **low confidence** in the unsupervised execution by non-specialists within 90 minutes.

  **Reasoning:**
  The logic holds. Lewis's conditions are robust. However, Step 2.2 (distinguishing Audit Fear from Mutual Expectation) and Step 3.2 (inferring motivation from minutes) require interpretive skill. A reviewer might accept "We follow the standard" as evidence of mutual expectation, when it is actually evidence of deference to authority.

  **Supervision Plan:**
  1.  **Pilot Phase:** Run the worksheet on the next 5 candidates with a reviewer *and* a senior secretariat member present.
  2.  **Calibration:** Compare the reviewer's "Step 3.2" findings against the senior member's. If they diverge, the definition of "Sufficient Answer" needs tightening.
  3.  **Appeal Path:** Any "Cannot hold unaudited" verdict on a rule previously considered "safe" must be reviewed by the Standards Chair before publication.

  **The Claim I Am Least Sure Of:**
  I am least sure of the claim in **Step 2.2**: *"Documents can reliably distinguish between audit compliance and mutual expectation."*

  **Evidence That Would Show It False:**
  If, during the Pilot Phase, you find that members consistently write in minutes "We support this for interoperability" (which looks like convention) but privately admit to the auditors "We only do this to avoid fines" (which is compliance), the worksheet will systematically misclassify Requirements as Conventions.
  *   **Test:** Conduct anonymous interviews with three member technical leads regarding Candidate 2. If they admit they would drop the acknowledgement window if the audit vanished, the worksheet's documentary evidence is insufficient, and you must rely on the "Temporary Requirement" model (Part 4) for all such cases.
