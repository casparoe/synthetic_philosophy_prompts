          3.  Everyone prefers to conform to $R$ *on the condition that* others do (coordination problem).
          4.  There is at least one alternative regularity $R'$ that could have solved the coordination problem instead (arbitrariness).
          5.  Conditions 1-4 are *common knowledge* (everyone knows, everyone knows everyone knows, etc.).
