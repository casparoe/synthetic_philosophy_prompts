answer: |-
  Your first claim is false because strategy stealing proves only that a winning strategy exists from the start, not that every opening move preserves it, and your second claim is theoretically inaccurate because one side must always have a forced win in a no-draw game, even though the swap rule effectively balances practical play.

  Regarding the first claim, the strategy-stealing argument is non-constructive: it demonstrates that the initial empty board is a winning position for the first player, but it does not identify which moves maintain that winning status. It is entirely possible that certain opening moves are blunders that hand the winning advantage to the opponent immediately. In Hex, for example, while the first player is guaranteed a win with perfect play, it is not proven that every possible opening cell is a winning move on large boards; playing on the edge or in a corner might be suboptimal enough to lose against perfect defense. You still need search or an opening book to avoid these losing moves.

  Regarding the second claim, in any finite, perfect-information game without draws, Zermelo's theorem guarantees that one side has a forced win. The swap rule does not change this mathematical reality; it simply gives the second player (the chooser) the ability to select the winning side. With perfect play, the second player will always win under the swap rule because they can choose to swap if the opening move favors the first player, or stay if it favors the second. The rule makes the game fair for humans because humans cannot calculate the forced win, forcing the opener to choose a move that appears balanced, but it does not create a state where "neither side can force a win."
