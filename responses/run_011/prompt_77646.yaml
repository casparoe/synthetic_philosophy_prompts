  # Diagnostic Instrument: Epistemic Commitments in Deep History

  ## Part I: The Decision Tree (Branch Nodes)

  *Instructions: Answer each question based on your intuitive judgment about how evidence works. Follow the arrows to the next relevant question or to a final position (Leaf).*

  **Node 1 (Material Traces):** When a physical object (like an arrowhead) is found in a layer of ash where a story says a battle happened, does the object prove the story is true, or only prove the object was there?
  *   **A:** Only proves the object was there. → Go to **Node 2**.
  *   **B:** Proves the story is true. → Go to **Node 3**.

  **Node 2 (Target of Inquiry):** If objects only prove themselves, are we trying to establish *that* an event happened, or *what it was like* for the people involved?
  *   **A:** What it was like (experience/mindset). → **Leaf 1**.
  *   **B:** That it happened (fact). → Go to **Node 3**.

  **Node 3 (Weight of Silence):** If a group wrote many letters but none mention a huge war, does that make the war unlikely?
  *   **A:** Yes, silence counts against the claim. → Go to **Node 4**.
  *   **B:** No, survival of documents is too random. → Go to **Node 8**.

  **Node 4 (Preservation Expectation):** When silence counts, does it matter whether we *expected* them to write about it?
  *   **A:** Yes, only counts if they should have mentioned it. → Go to **Node 5**.
  *   **B:** No, any silence is suspicious. → **Leaf 2**.

  **Node 5 (Source Reliability):** If a writer is accurate about taxes but tells myths about kings, can we trust them on kings?
  *   **A:** Yes, they are generally trustworthy. → Go to **Node 6**.
  *   **B:** No, trust depends on the specific topic. → Go to **Node 7**.

  **Node 6 (Miraculous Content):** If a trustworthy writer says gods fought in the battle, do we discard that part or keep it as their perspective?
  *   **A:** Discard/Correct it to fit natural laws. → **Leaf 3**.
  *   **B:** Keep it as their perspective/bracket it. → **Leaf 4**.

  **Node 7 (Contemporaneity):** If trust is topic-specific, must an account be written close to the event to carry weight?
  *   **A:** Yes, time degrades truth. → **Leaf 5**.
  *   **B:** No, late accounts can be reliable. → **Leaf 6**.

  **Node 8 (Convergence):** If two later books agree on a story but copied from one lost book, is that stronger than one book alone?
  *   **A:** Yes, agreement adds weight. → Go to **Node 9**.
  *   **B:** No, it is just one voice echoing. → Go to **Node 10**.

  **Node 9 (Transmission Chains):** When agreement adds weight, does it matter if the authors are different people or if their information chains are separate?
  *   **A:** Different people is enough. → **Leaf 7**.
  *   **B:** Chains must be separate. → **Leaf 8**.

  **Node 10 (Testimony vs. Improbability):** If a single chain of testimony is excellent, can it convince us of a very unlikely event?
  *   **A:** Yes, trust overcomes odds. → Go to **Node 11**.
  *   **B:** No, improbability blocks belief. → **Leaf 9**.

  **Node 11 (Warrant Structure):** When trust overcomes odds, does the evidence support the claim directly, or because it fits a wider web of beliefs?
  *   **A:** Directly (Linear). → **Leaf 10**.
  *   **B:** Fits a web (Coherent). → **Leaf 11**.

  ***

  ## Part II: Leaf Mapping and Descriptions

  | Leaf | Position Label | Answer Pattern (Nodes 1-11) | Awkward Commitment / Embarrassing Case |
  | :--- | :--- | :--- | :--- |
  | **1** | Collingwoodian Re-enactment | 1A, 2A | Cannot confirm battles occurred, only that people believed they did. |
  | **2** | Skepticism (Underdetermination) | 1A, 2B, 3A, 4B | Treats accidental loss of records as evidence of non-events. |
  | **3** | Rankean (Source-Critical) | 1B, 3A, 4A, 5A, 6A | Must aggressively delete divine elements from ancient texts to use them. |
  | **4** | Unnamed (Global/Bracket) | 1B, 3A, 4A, 5A, 6B | Trusts a writer globally but accepts their impossible claims as "perspective." |
  | **5** | Source-Critical (Strict) | 1B, 3A, 4A, 5B, 7A | Dismisses all later histories even if they preserve lost early data. |
  | **6** | Unnamed (Local/Late) | 1B, 3A, 4A, 5B, 7B | Trusts late writers on specific topics without explaining how truth survived. |
  | **7** | Coherentism | 1B, 3B, 8A, 9A | Treats multiple copies of one error as stronger evidence than a single unique record. |
  | **8** | Unnamed (Chain-Strict) | 1B, 3B, 8A, 9B | Requires proof of separate chains, which is often impossible to establish. |
  | **9** | Skepticism (Humean) | 1B, 3B, 8B, 10B | Cannot accept any report of a unique catastrophe, however well-attested. |
  | **10** | Testimony-based Realism | 1B, 3B, 8B, 10A, 11A | Accepts miraculous claims if the witness is credible enough. |
  | **11** | Inference to Best Explanation | 1B, 3B, 8B, 10A, 11B | May privilege a complex explanation over a simple one due to web-fit. |

  ***

  ## Part III: Unoccupied or Thinly Occupied Regions

  1.  **Region:** Material Traces Confirm Story + Silence Counts + Preservation Random (Nodes 1B, 3A, 4B).
      *   **Diagnosis:** **Incoherent.** If the survival of records is random (4B), silence cannot logically count against a claim (3A). This combination asserts a probabilistic contradiction.
  2.  **Region:** Source Reliability Global + Contemporaneity Required (Nodes 5A, 7A).
      *   **Diagnosis:** **Unattractive.** If a writer is globally trustworthy (5A), requiring them to be contemporary (7A) is redundant; if they are not contemporary, their global trustworthiness is already compromised, making the specific time requirement an unnecessary second gate.
  3.  **Region:** Convergence Adds Weight + Transmission Chains Must Be Separate (Nodes 8A, 9B).
      *   **Diagnosis:** **Unexplored/Impractical.** While logically possible, historians rarely defend this because proving separate chains in the deep past is usually impossible; thus, no school of thought builds its methodology on a criterion it cannot practically apply.

  ***

  ## Part IV: Non-Separation Analysis

  **Pair:** **Leaf 10 (Testimony-based Realism)** and **Leaf 11 (Inference to the Best Explanation)**.
  **Explanation:** The tree distinguishes these based on whether warrant is "Linear" (Node 11A) or "Web" (Node 11B). However, in practice, a student who believes testimony overcomes improbability (Node 10A) almost always justifies that belief by appealing to how well the testimony fits other known facts (a web). The distinction between "direct support" and "web fit" is too subtle for a first-year diagnostic to reliably capture, as most students will answer based on the *outcome* (I believe it) rather than the *structure* of their justification.

  **Pair:** **Leaf 3 (Rankean)** and **Leaf 5 (Source-Critical Strict)**.
  **Explanation:** Both rely on Node 5 (Source Reliability) to split, but the distinction between "Global Trust" (Leaf 3 path) and "Topic-Specific Trust" (Leaf 5 path) is often a matter of degree. A student might believe a scribe is trustworthy on *most* things but not kings, yet answer "Yes" to Node 5 thinking "trustworthy" means "useful." The tree forces a binary choice on a spectrum of reliability.

  ***

  ## Part V: Demonstration on the Orenth Dossier

  **Dossier Summary:**
  *   **For Destruction:** Ash layer, arrowheads, Victory Stele ("100 cities"), Admin Tablet ("Year of Fire"), Two Prose Histories (shared source).
  *   **Against/Uncertain:** No mass graves/hoards, Stele names no cities, Poem is late/divine, Merchant Correspondence is silent.

  ### Run 1: The "Arrowhead and Stele" Student
  *   **Node 1 (Material):** *Proves the story.* (Arrowheads in ash confirm battle). → **Node 3**.
  *   **Node 3 (Silence):** *Neutral.* (Merchant letters are a small fraction; survival random). → **Node 8**.
  *   **Node 8 (Convergence):** *No.* (Histories share a lost original; it's one voice). → **Node 10**.
  *   **Node 10 (Testimony):** *Testimony Wins.* (Stele is contemporary and official). → **Node 11**.
  *   **Node 11 (Warrant):** *Linear.* (The Stele directly proves the event).
  *   **Result:** **Leaf 10 (Testimony-based Realism).**
  *   **Stability:** Stable. If this student changes Node 3 to "Counts," they move to Node 4. If they admit preservation was "Expected" (Node 4A), they move toward Source-Critical/Rankean. However, given the dossier stipulates the correspondence is "only a small fraction," a consistent student should hold Node 3B. The verdict is stable under small changes to the *dossier*, but sensitive to the *epistemic commitment* regarding silence.

  ### Run 2: The "Merchant Silence" Student
  *   **Node 1 (Material):** *Only proves object.* (Arrowheads show shooting, not city destruction; no graves). → **Node 2**.
  *   **Node 2 (Target):** *That it happened.* (They want to know if the city fell). → **Node 3**.
  *   **Node 3 (Silence):** *Counts against.* (Merchants were active and would know). → **Node 4**.
  *   **Node 4 (Preservation):** *Expected.* (Active trade implies record keeping).
  *   **Result:** **Leaf 2 (Skepticism).**
  *   **Stability:** Highly Stable. This student's position hinges entirely on Node 3. Unless they are convinced that merchant letters are random survivals (Node 3B), they cannot access the "Realist" leaves (8-11).

  ### Agreement Analysis
  **Should this instrument yield agreement?**
  **No.** The dossier is specifically constructed to trigger the split at **Node 1 (Material)** and **Node 3 (Silence)**.
  *   The arrowheads are ambiguous (ash exists, but no graves), inviting Node 1A vs 1B.
  *   The merchant letters are extensive but fragmentary, inviting Node 3A vs 3B.
  *   **Diagnosis:** The instrument correctly identifies that disagreement on Orenth is not about the *facts* of the dossier (which are stipulated) but about the *epistemic weight* of silence and material traces. The tree successfully maps the divergence: one student lands in **Testimony Realism**, the other in **Skepticism**. This confirms the tree's utility as a diagnostic for underlying philosophical commitments rather than historical knowledge.
