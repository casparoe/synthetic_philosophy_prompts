prompt: |-
  I'm a third-year PhD student — my own area is measurement in the climate sciences, so I'm coming at this sideways — and I've been volunteered to host our department's philosophy-of-science podcast next week. The guest is a philosopher whose new book argues that Hempel's raven paradox was never really about confirmation: it's about people forgetting that an observation report is always the output of some sampling process. Her view, roughly, is that confirmation is a three-place relation between an observation, a hypothesis and a sampling frame, where the frame is a description of the process that actually produced the observation. So a green apple picked out of a fruit bowl confirms nothing whatever about ravens, because the frame there is 'objects on my kitchen counter' and being-a-raven was never a possible outcome of that selection; but a black raven that turns up in a mist-net survey of every bird in a woodland does confirm, because the nets were colour-blind and ravens were in the running; and a black raven found by somebody who went out specifically hunting for black corvids after a tip-off confirms much less, or perhaps nothing at all, because the frame was selected on the very property under test. Her slogan is that confirmation attaches to sampling designs rather than to observation sentences, and that once you index to the frame the paradox simply evaporates. She's also got a habit of brushing objections aside by saying the objector is just re-running the intuition Hempel diagnosed.

  Its a 40-minute episode and half the audience are undergrads who met the paradox once in an intro class, so I don't want softball questions, I definitely don't want anything of the 'what drew you to this puzzle' variety, and I need the jargon kept low. Could you write me five core questions that build on one another — each should still be usable if she dodged the previous one, but sharper if she answered it the way I expect — and for each, the escape route she's most likely to take plus the follow-up that closes it off? Coverage I want: one on whether indexing to frames forces her to abandon the principle that logically equivalent hypotheses get the same evidence, and what she then says to the equivalence condition; one on deliberate search, since practically all field ornithology consists of people going out to look for the very thing they're studying, and I want to know where a colour-blind frame is supposed to come from in that setting; one on whether you can gerrymander a frame so that any old data confirms any hypothesis you like — I suspect the bootstrapping worry from epistemology has an analogue here, but put it in terms she can't wave away as technical; one on grue, and whether 'sampling frame' has to be spelled out in projectible vocabulary for her account to work at all, which would mean she's borrowed Goodman's problem rather than dissolved it; and one on hypotheses where no sampling frame is available — a region exhaustively surveyed for ravens that turns up none, or generalisations about things nobody could ever sample. If you can squeeze it in, I'd also like her asked about that old case where the direction of confirmation flips purely because of the content of your background knowledge — something like knowing that a species either doesn't exist in the region at all or exists in huge numbers with varied plumage, so that actually sighting a black one lowers your confidence that they're all black — since on her story the provenence of the sighting is supposed to be doing all the work.

  Then give me one opener that makes her state the criterion in operational form, i.e. something a listener could apply to a case they've never seen before, and one closer asking what observation, or what verdict about a case, would count against the account rather than being explained away by it. Keep every question short enough to be read aloud in a single breath, don't put anything in quotation marks as hers (I haven't got the book yet and I don't want to invent wording for her), and please write the whole thing in British English — our editor is genuinely fussy about that.
