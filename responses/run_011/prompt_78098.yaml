  Opener
  Could you give us a step-by-step test that a listener could apply to any new case to decide whether an observation counts as evidence under your account?

  Question 1
  Does indexing to frames force you to abandon the principle that logically equivalent hypotheses receive the same confirmation from the same data?
  Escape Route: She will likely argue that the sampling frame must be described relative to the hypothesis wording, so the frame changes when the hypothesis changes.
  Follow-up: But if the frame description changes with the hypothesis, have you not made confirmation relative to wording rather than content?

  Question 2
  Since field ornithologists deliberately search for the species they study, where does a colour-blind sampling frame come from in actual practice?
  Escape Route: She may claim they sample habitats or locations rather than specific birds, preserving the colour-blind nature of the selection.
  Follow-up: But if the habitat selection was guided by where ravens were expected, is the frame not still selected on the property under test?

  Question 3
  What stops a researcher from gerrymandering the sampling frame description so that any old data confirms any hypothesis they like?
  Escape Route: She will insist the frame must describe the actual physical process that occurred, not just any description one can write down.
  Follow-up: But since the frame is a description we write after the fact, how do we prevent that description from being tailored to suit the result?

  Question 4
  Does the sampling frame itself have to be spelled out in projectible vocabulary for your account to work at all?
  Escape Route: She might concede this is necessary but argue it is a separate issue from the Raven Paradox.
  Follow-up: Then have you not just borrowed Goodman's problem rather than dissolved the Raven Paradox?

  Question 5
  How does your account handle hypotheses where no sampling frame is available, such as an exhaustive survey that turns up nothing?
  Escape Route: She will suggest we can always describe the search effort itself as the frame, even if it yields null results.
  Follow-up: And does this hold even when background knowledge implies that the observation should lower confidence in the hypothesis?

  Closer
  What observation, or what verdict about a case, would count against the account rather than being explained away by it?
