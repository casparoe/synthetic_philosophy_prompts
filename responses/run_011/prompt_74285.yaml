  **Grade: 17/20**
  **Split: (a) 6/7, (b) 5/6, (c) 6/7**

  **Comments:**

  This is a sophisticated script with excellent compression of complex material. Your critical voice in (c) is particularly strong, moving beyond summary to evaluate the normative stakes of the exchange. However, there are two technical inaccuracies in the exposition that prevent a higher score.

  **(a) 6/7:** Your explanation of basic desert and the ultimacy requirement is precise and accurate. However, at *"In practice this is deterrence with a safety valve,"* you conflate Caruso's justification with the criticism of it. Caruso explicitly argues the quarantine model is *not* deterrence because the justification is protection (like disease control), not utility or behavioral modification. While many critics argue the model collapses into deterrence, presenting this collapse as Caruso's own view ("In practice this is...") misrepresents his position for the sake of exposition.

  **(b) 5/6:** You capture Dennett's "freedom worth wanting" well. However, at *"This is essentially Frankfurt's move — what matters isn't alternative possibilities but the structure of the will,"* you conflate two distinct compatibilist strategies. The conditional analysis you describe earlier ("would have done otherwise had the reasons... been different") is the traditional Moorean compatibilist move. Frankfurt cases argue responsibility exists *even if* the agent could not have done otherwise (rejecting the conditional analysis). Dennett uses both, but they are not the same move; distinguishing them is key in this unit.

  **(c) 6/7:** This is the strongest section. The verdict ("wins the argument and loses the conclusion") is nuanced and well-supported by your claim that Dennett's naturalized desert may lack retributive force. I dock one point because there is a slight tension with (b): you list Dennett's arguments in (b) (evolution, reasons-responsiveness, pragmatic self-undermining), but in (c) claim he *"mostly just asserts"* that desert does normative work. It would be more precise to say those arguments fail to *bridge the gap* to retribution, rather than that he asserts the conclusion without argument.

  **Overall:** Excellent work. Tighten the technical distinctions in the exposition, and this would be flawless.
