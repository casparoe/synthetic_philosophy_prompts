      *   *What's Missing:* The patient's/family's perspective, the legal reality, and the "pluralism" concept.
      *   *User's Suspicion:* Validate this strongly. It's the key to unlocking the debate.

  7.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction on Move 5:* Make sure to acknowledge that 5 minutes *is* partly about organs, but also about autoresuscitation data. Don't let Marcus win that point completely.
      *   *Correction on Move 9:* Ensure I mention the "Lazarus phenomenon" regarding autoresuscitation in the DCD context, and Shewmon's critique regarding brain death.
      *   *Correction on Move 11:* Be careful not to endorse Marcus's view as "safe." It's a fringe view in policy, even if respected in philosophy.
      *   *Tone Check:* Keep it respectful to the doctors. They are both arguing valid points within their frameworks.
      *   *Interpreter Role:* Acknowledge the user's awkward position (being treated as a scoreboard).

  8.  **Final Polish:** Check against the prompt requirements (ratings, specific questions, overall verdict, missing elements, user suspicion). Ensure the distinction between "biological fact" and "social construct" is clear. (Proceed to generate output).

  *(Self-Correction Note on Move 1)*: Marcus says "the rule... isn't buying anything here." This is the "Dead Donor Rule" critique.
  *(Self-Correction Note on Move 7)*: This refers to Normothermic Regional Perfusion (NRP). It is highly controversial.
