      *   **Notebook vs. Chatbot:** The key is *opacity*. A notebook is passive storage; AI is active synthesis. If you can't see the synthesis, it's not "yours."
      *   **The Blackout Test:** It's a necessary condition but not sufficient. It tests *access*, not necessarily *depth*.
