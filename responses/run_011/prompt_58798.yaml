  **MEMORANDUM**

  **TO:** Acquisitions and Attributions Committee
  **FROM:** Chair
  **SUBJECT:** Acquisition and Attribution of 1926 Altarpiece Copy (Donated Collection)

  **1. Candidate Principles Derived from Precedents**
  Reviewing the committee's record (Cases 1–7), three guiding principles emerge that remain jointly consistent with all past verdicts, though not all have been explicitly articulated:

  *   **Principle of Intrinsic Authorship:** Attribution follows the physical or conceptual agent at the moment of creation. External factors (market fraud, later scholarship) adjust the *label*, but do not rewrite the *creator* (Cases 2, 6, 7).
  *   **Principle of Transparent Utility:** Objects may be retained and displayed for historical or documentary value even if their market value or aesthetic status is compromised, provided their condition and history are fully disclosed (Cases 1, 4, 5).
  *   **Principle of Intent Stigma:** Deceptive intent *by the creator* permanently segregates an object from the main corpus (Case 1). However, the record is silent on whether deceptive intent *by a third party* (dealer) imposes the same segregation if the creator was honest.

  **2. Application to the New Case**
  *   **Acquisition:** **Recommend Acquire.** Under the Principle of Transparent Utility, the panel is the sole visual record of a lost masterpiece. Like Case 1 (forgery retained for education) and Case 4 (heavily restored panel retained), its documentary value exceeds its market liability.
  *   **Catalogue Attribution:** **Recommend Catalogue under the Copyist.** Under the Principle of Intrinsic Authorship, the student copyist is the physical creator. The dealer's fraud (Case 1 analogue) does not make the copyist a forger, as there was no deceptive intent at creation. Case 7 dictates we catalogue under the actual creator when the "Master" attribution fails.
  *   **Display Location:** **Underdetermined.**
      *   *Option A (Main Gallery):* Follows Case 4 and 7. The object is honest in its creation; the fraud was external. Displaying it in the period gallery with full wall text regarding the fraud and the lost original honors its documentary utility. *Commitment:* "Historical utility trumps provenance stigma."
      *   *Option B (Study/Documentation Gallery):* Follows Case 1. The object carries a "fraud" history that may confuse the public or tarnish the gallery's integrity, regardless of who committed the fraud. *Commitment:* "Any association with the forgery market requires segregation."

  **3. Committee Vote Prediction**
  **Best Guess:** The committee will vote to **Acquire**, catalogue under the **Copyist**, and hang in the **Study/Documentation Gallery**.
  **Reasoning:** While Option A is principled, the committee has historically been risk-averse regarding fraud (Case 1). The "stain" of the convicted dealer and the fake paperwork will likely trigger the segregation instinct of Case 1, even though the copyist was honest. The Principle of Intent Stigma will likely be extended by analogy to cover the object's recent history, overriding the Utility argument for main gallery placement.

  **4. Closest Analogue**
  **Precedent 1** is the closest analogue. Both involve panels sold as "Masters" that were physically created by later/lesser hands, accompanied by fraudulent provenance.
  **Decisiveness:** It does **not** genuinely decide the case. Case 1 involved *intrinsic* forgery (creator intended deception); this case involves *extrinsic* fraud (dealer intended deception). Relying on Case 1 requires ignoring the copyist's honest commission and signature. Case 7 is a better principled fit for attribution, but lacks the fraud element.

  **5. Distinguishing Hypothetical**
  To separate the leading principles (Intrinsic Authorship vs. Intent Stigma), consider this case:
  *A verified autograph work by a Master is stolen, then sold by a dealer with fake papers claiming it is a different, more valuable work by the same Master. The fraud is exposed.*
  *   If we retain it in the Main Gallery: We prioritize **Intrinsic Authorship** (the object is genuine).
  *   If we segregate it to Study Storage: We prioritize **Intent Stigma** (the object is "tainted" by the market fraud, regardless of authorship).

  **6. Addressing the Suspicion: Value vs. Display**
  I agree with your suspicion that the record tracks two distinct properties: **Market/Attribution Status** (Value) and **Physical Placement/Labeling** (Display). The committee slides between them to manage reputation risk.
  **Verdicts forcing the split:**
  *   **Case 1:** Curators rated the quality as "good as anything in the Dutch gallery" (High Display Merit), yet the committee "struck it from that gallery" (Low Status Placement). Aesthetic value did not secure gallery placement.
