prompt: |-
  Write me a short story, 1200 words ish, about a release review board at a rewilding station arguing over whether a certain organ in a herd of captive-bred animals counts as defective. Here's the situation I want you to build on: the structure was obviously favoured in the wild ancestors for one job, it's useless for that job now, but it's quietly doing real work inside a completely different capacity the animals have picked up since — and the lineage has been bred in captivity long enough that nothing has been selected for or against it in generations.

  One board member holds that you can't call something broken unless you know what it was *for*, and that means tracing its history; the other holds that history is beside the point, what matters is what the thing contributes to the animal working as a whole right now, and on that basis a different verdict comes out. Same animal, same data, opposite call.

  Dont let anyone name a philosopher or give a lecture. Put the disagreement in what each of them counts as evidence, what tests they order, which records they insist on dragging up, and what they're each willing to risk if they're wrong. I want the board to actually have to decide by the end, and I want to feel that whichever way it goes something real gets lost — no third character arriving to cleverly split the difference.
