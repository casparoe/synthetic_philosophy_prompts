  The observation glass was cold enough to fog where Elias breathed against it. Below, in the scrub-grass enclosure, the herd of *capra-reborn* grazed listlessly. They were mountain goats, technically, though none of them had ever seen a mountain. They were Generation Forty-two.

  "It's hypertrophied," Elias said, tapping the holographic display. He didn't look at the animals. He looked at the scan of the spleen floating between them. "Look at the smooth muscle density. It's forty percent higher than the Founding Map."

  Mara didn't look at the scan. She was watching a kid stumble over a rock, recover, and keep nursing. "It's within viable variance. They're alive, Elias. They're thriving."

  "They're thriving in a cage," Elias snapped. He swiped the scan away and pulled up a genomic overlay, red lines marking deviations. "This organ was selected over two million years to contract during high-adrenaline events. It dumps red blood cells into the system so the ancestor could sprint up a scree slope to escape a leopard. That is the *history* of the spleen. That is what it is *for*."

  "And what is it doing now?" Mara asked. She slid a physical folder across the table. It was thick, stained with coffee rings. "Open page twelve. Mortality logs from the last decade."

  Elias didn't touch it. "I know the logs. Low infection rates."

  "Because of the spleen," Mara said. "The water table in this valley has high iron content. We can't change it without draining the aquifer. Their spleens adapted. They aren't storing blood for a sprint; they're sequestering excess iron to prevent hemochromatosis. It's doing real work. It's keeping the herd alive."

  "It's doing the wrong work," Elias said. He finally turned from the glass. "We are a Release Board. Our mandate is rewilding. If we release these animals into the Reserve, there are leopards. There are steep slopes. When the predator comes, the spleen won't contract to give them the burst speed they need. It will stay full of iron. They will die. Therefore, the organ is defective for the purpose of release."

  Mara leaned forward, her hands clasped tight. "You're defining 'defective' by a ghost. You're defining it by a leopard that hasn't hunted this lineage in forty generations. You want to judge the animal by what it *was*, not what it *is*."

  "I want to judge it by what it needs to *be*," Elias countered. He picked up a stylus. "I'm ordering a Predator Response Drill. Simulated audio cues, mechanical lurkers. We measure the splenic contraction rate during the stress event."

  "That's cruel," Mara said. "And it's irrelevant. They won't encounter mechanical lurkers in the wild. They'll encounter stress from the transition itself. I'm ordering a Metabolic Challenge. We switch their water to low-iron source and monitor their blood chemistry for toxicity."

  "If you do that," Elias said, "you're testing their ability to live in a different cage. You're not testing their wild viability."

  "I'm testing their systemic integrity!" Mara's voice cracked. "If you mark the organ defective based on history, you condemn the herd. They stay here. They remain captive. You lose the wild lineage forever because you're chasing a purity test based on dead ancestors."

  "And if I mark it functional based on current utility," Elias shot back, "I sign their death warrants. I release them into a system they aren't built for. I lose the animals to predation within the first month. Which loss is worse? The loss of the lineage, or the loss of the lives?"

  The silence stretched between them, filled only by the hum of the air filtration. Outside, a male goat head-butted a fence post. The sound was dull, hollow.

  Elias pulled a file from his stack. "I have the Founding Map signed off by the original geneticists. They defined the species by its escape velocity. That is the standard. If the organ doesn't meet the standard, it's broken. It's that simple. You can't change the definition of the animal just because it survived captivity."

  "The animal changed," Mara said softly. "Evolution didn't stop because we put them in a pen. Drift happened. Plasticity happened. That organ is keeping them whole. If you cut it out of the equation, you aren't looking at the animal. You're looking at a diagram."

  "I'm looking at the truth," Elias said. "History is the only truth we have. Without it, we're just guessing what matters."

  "Survival is the only truth," Mara said. "Everything else is commentary."

  They both looked at me. I was the Chair. The tie-breaker. The one who had to sign the release form or the containment order.

  I looked at the scan Elias had pulled up. The spleen was dark, dense, heavy. Then I looked at the herd below. They were robust, their coats glossy, their eyes clear. They were not the animals their ancestors were. They were something else. Something made for this place, for this water, for this quiet, predator-free existence.

  If I sided with Elias, the organ was defective. The herd was unfit. They would stay in the station, breeding forever in this valley, slowly becoming something entirely domestic. The concept of "rewilding" this line would die today. We would admit that captivity had changed them too much to ever go back.

  If I sided with Mara, the organ was functional. The herd was fit. We would truck them to the Reserve. They would graze on the high grass. And when the leopards came, as they would, their spleens would not fire. They would not run fast enough. They would be eaten. We would have released them to die, satisfying a bureaucratic requirement of "function" while ignoring the reality of the wild.

  There was no third option. I could not order more tests; we had years of data already. I could not split the herd; the genetic diversity was too low to separate them.

  I picked up the stylus. The plastic felt slick in my palm.

  "Elias," I said. "Your definition protects the idea of the animal."

  "It protects the reality of the wild," he corrected.

  "Mara," I said. "Your definition protects the life of the animal."

  "It protects the integrity of the organism," she said.

  I looked at the file. *Release Recommendation.*

  If I checked 'No', we save their lives but kill their purpose. They become zoo pieces, permanently. The wild loses a potential herd.
  If I checked 'Yes', we honor their purpose but sacrifice their lives. The wild gets a herd, but only for a season.

  I thought about the leopard. I thought about the iron in the water. I thought about the definition of "defective." Is a thing broken if it doesn't do what it used to, or only if it fails to do what it must?

  In the wild, they must run. Here, they must filter. We were sending them to the wild.

  "I'm marking it defective," I said.

  Mara flinched as if struck. Elias exhaled, a long, shaky breath.

  "You're condemning them," Mara said. Her voice was flat.

  "I'm condemning them to captivity," I said. "If I release them, I'm condemning them to death. At least here, the spleen works. At least here, they live."

  "But they aren't wild," Elias said, though he looked relieved. "They're never going to be wild."

  "No," I said, signing the containment order. "They aren't. And neither are we."

  I handed the file back. Below, the herd moved together toward the shelter, unaware that their fate had been sealed by an organ they couldn't see, doing a job no one wanted. We had saved them. And in saving them, we had admitted that the wild they were meant for no longer existed, even in the Reserve. The organ wasn't broken. The world was. But only one of us could vote on the world. I had voted for the cage.
