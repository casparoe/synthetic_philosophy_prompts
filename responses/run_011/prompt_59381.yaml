prompt: |-
  I'm in the middle of a novel about a staking operation — the sort where a backer puts up all the money and a young poker player grinds it out for a cut — and I've been talking to people in that world to get the details right. What keeps striking me is how much of a whole moral and mathematical system is baked into the paperwork, and I can't tell which bits are load-bearing and which are just custom.

  The arrangement as it's usually described to me: the backer fronts the bankroll, takes half the winnings, the player keeps half. If the player loses, the loss isn't wiped — it goes on the books as 'makeup', and the player doesn't see a penny of their share until makeup is cleared. Makeup survives the end of a session, a month, sometimes the end of the deal itself: if the player wants to walk and sign with another backer, the debt has to be bought out first. Alongside that, players are told constantly never to risk the roll — one or two per cent a game, and if you drop below a threshold you move down in stakes rather than up. But the same people will tell you to take a shot at a game you can't really afford when a rich fish sits down, and they'll say the reason its fine is that you're not risking your own money, you're risking the backer's.

  What does that whole package presuppose about what it is to bet well? I keep getting told it's the Kelly criterion in practice — bet the fraction of your roll that makes it grow fastest over the long run, and never risk going bust, because a bust ends the growth story. But makeup looks like it changes the story: nobody goes bust, they just owe, indefinitely, and the person doing the owing keeps playing. So is the rule about the money or about the person? And how can never risk the roll and take the shot both be right unless the two are measuring different things, or unless somebody's long run is not somebody else's?

  Can you reconstruct the theory of rational betting the staking world is actually running on, and tell me what it commits my characters to that I hadn't noticed — in particular whether it's a view about long-run growth, a view about utility, or a view about who a player is across time, and whether the long run it appeals to is something a single mortal person ever gets to stand in for. I'd like to know which parts of the practice strictly require that theory and which would sit just as happily under a rival one, plus where the practice is simply underdetermined, so I don't put a contradiction in someone's mouth that isn't really there. And if you swapped it for a straightforward expected-utility view of a person who's going to die in fourty-odd years and can't reinvest forever, what would these contracts have to look like instead — would makeup still make any sense?

  British English please. Don't worry about keeping it short, this is for my notes rather than the book.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** The moral and mathematical system underlying poker staking arrangements (backer/player relationships).
      *   **Key Elements:** Bankroll management (1-2% risk), Makeup (losses carried forward), Profit Split (usually 50/50), "Taking a Shot" (deviating from bankroll management for opportunity).
      *   **Core Question:** What theory of rational betting underpins this? Is it Kelly Criterion? Expected Utility? Something about identity over time?
      *   **Specific Tensions:** "Never risk the roll" vs. "Take the shot"; Makeup preventing "going bust" vs. indefinite debt; Who is the "long run" for (backer or player)?
      *   **Requirements:** Reconstruct the theory, identify commitments for characters, distinguish load-bearing vs. custom elements, contrast with standard Expected Utility Theory (EUT) for a mortal agent, British English, detailed/notes format.

  2.  **Deconstruct the Staking System:**
      *   *The Deal:* Backer provides capital ($C$), Player provides labour/skill ($L$). Split is usually 50/50 of *profit*.
      *   *Makeup:* Losses are deducted from future profits. Player gets $0$ until net profit > 0. This creates a "ratchet" effect.
      *   *Bankroll Management (BRM):* Don't play stakes where a downswing wipes you out. Usually framed as Kelly-adjacent.
      *   *The Contradiction:* "Protect the roll" vs. "Take a shot at a fish."
      *   *The "Bust" Condition:* In pure gambling, bust = game over. In staking, bust = makeup debt. But if debt is too high, backer cuts player loose. So "bust" is social/contractual, not just mathematical.

  3.  **Identify the Underlying Theory:**
      *   *Is it Kelly?* Kelly maximizes geometric growth rate ($G = E[\log(wealth)]$). It assumes reinvestment of *all* profits. Staking splits profits. So it's not pure Kelly for the *player*. It might be Kelly for the *backer's portfolio*.
      *   *Is it Expected Value (EV)?* Poker players obsess over EV. But EV maximization leads to ruin if bet sizing is too big (Gambler's Ruin).
      *   *Is it Expected Utility (EUT)?* Standard economics. Concave utility function = risk aversion. But poker players are often risk-neutral regarding EV, but risk-averse regarding "ruin."
      *   *The Real Theory:* It's a **Principal-Agent Problem** wrapped in **Growth Optimal Investing** with a **Social/Reputational Constraint**.
      *   *Key Insight:* The "Long Run" belongs to the *Backer*, not the Player. The Player is a replaceable asset (a "fund manager"). The Bankroll is the immortal entity.

  4.  **Address the Specific Tensions:**
      *   *Makeup:* Why does it exist? To prevent moral hazard. If losses were wiped, the player would take insane risks (heads I win, tails you lose). Makeup aligns incentives. It makes the player feel the pain of loss (via lost future income) without needing cash.
      *   *BRM vs. Taking a Shot:* BRM protects the *instrument* (the bankroll). Taking a shot exploits *market inefficiency* (a bad player). The theory says: Preserve the capital vehicle unless the EV is so skewed it justifies temporary variance. It's a calculation of "Risk of Ruin" vs. "Opportunity Cost."
      *   *Who is the "Self"?* The Player is not betting for their own life-utility. They are betting for the Bankroll's growth. The Player is a hired hand. The "Long Run" is the Backer's horizon, which can be indefinite (or until the player is fired).

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the depth of the observation. It's not just math; it's a specific economic anthropology.
      *   *Section 1: The Mathematical Core (Kelly & Growth).* Explain that while they say "Kelly," it's actually about *survival of the fund*. The bankroll is the protagonist.
      *   *Section 2: The Moral Core (Makeup & Incentives).* Explain Makeup as an incentive compatibility constraint. It prevents the player from gambling recklessly because they are "risk neutral" (it's not their money).
      *   *Section 3: The Contradiction (BRM vs. Shots).* Resolve this. It's about *Risk of Ruin* vs. *Expected Growth*. A shot is taken only if the edge is massive enough to lower the risk of ruin despite the higher stake. Or, it's a career move (marketing).
      *   *Section 4: Identity and Time.* This is crucial for the novelist. The "Person" is the Bankroll. The Player is transient. The "Long Run" is a statistical abstraction that no single human session fully captures, but the *career* must approximate.
      *   *Section 5: Alternative Theory (Standard EUT).* What if we treated the player as a normal mortal? They would demand a salary + smaller cut, or no makeup. Makeup relies on the "career as an infinite game" fiction.
      *   *Section 6: Character Commitments.* What does this mean for the dialogue/internal monologue? They shouldn't talk about "winning money," they should talk about "making good decisions" and "protecting the tool."

  6.  **Refining the Theory (Self-Correction/Nuance):**
      *   *Correction:* It's not *pure* Kelly because of the 50% split. If you win 50% and lose 100% (of your share), your bet sizing needs to be adjusted. Actually, the player isn't sizing the bets relative to *their* wealth, but the *bankroll's* wealth.
      *   *Nuance:* The "Shot" is often about *career capital*, not just immediate EV. Moving up stakes builds a reputation.
      *   *Makeup Transfer:* The user mentioned debt buyouts. This confirms the "debt is real" aspect. It's a lien on future labour.
      *   *British English:* Ensure spelling (labour, programme, centre) and tone (slightly more formal/analytical).

  7.  **Final Polish:** Check against all constraints.
      *   British English? Yes.
      *   Detailed notes? Yes.
      *   Address "load-bearing" vs "custom"? Yes.
      *   Address "mortal vs infinite"? Yes.
      *   Address the specific contradictions? Yes.

  8.  *(Mental Check on the "Shot" logic)*: Why is it rational to break BRM for a fish? Because BRM assumes a standard edge (e.g., 5bb/100). A "fish" might offer 20bb/100. The Kelly fraction is proportional to the edge. Higher edge = higher allowable bet size. So, increasing stakes *is* consistent with Kelly if the edge increases proportionally more than the variance. I need to make sure this is clear.

  9.  *(Mental Check on Makeup)*: Does Makeup make sense under EUT? For a risk-averse mortal with a finite horizon, negative utility from debt might outweigh the upside. But poker players often have high risk tolerance for income volatility. Makeup works because it binds the player to the backer. Without it, the player walks after a big win and leaves the backer with the loss. It's a "golden handcuff."

  10. *Structure:*
      *   Intro: The Bankroll as the Immortal.
      *   The Mathematics: Kelly vs. Survival.
      *   The Ethics: Makeup as Incentive Alignment.
      *   The Contradiction: Rules vs. Shots.
      *   The Metaphysics: Time and Identity.
      *   The Counterfactual: Finite Mortal EUT.
      *   Character Notes.

  11. *Drafting content...* (Proceeding to generate response based on these thoughts).
answer: |-
  This is a remarkably sharp observation. You have identified that poker staking is not merely a financial arrangement but a distinct economic subculture with its own ontology. The contradictions you are sensing are real, but they are not necessarily logical failures; they are tensions between two different theoretical frameworks operating simultaneously: **Growth-Optimal Investing** (the mathematics of the bankroll) and **Principal-Agent Theory** (the sociology of the relationship).

  To help you ground your characters, I have reconstructed the implicit theory of rational betting that governs this world. I have broken this down into the mathematical engine, the moral architecture, the metaphysics of time, and finally, what would happen if you swapped this for a standard mortal utility model.

  ### 1. The Mathematical Core: The Bankroll as the Protagonist

  The first thing to grasp is that in the staking world, the **Bankroll is the immortal agent**, and the Player is a transient operator.

  **The Kelly Criterion Misconception**
  When your characters talk about Kelly, they are usually speaking loosely. The true Kelly Criterion maximises the expected logarithm of wealth ($E[\log(W)]$). It dictates bet sizing to prevent "Gambler's Ruin" (going to zero) while maximising geometric growth.
  *   **The Load-Bearing Bit:** The prohibition against risking more than 1–2% of the roll on a single tournament or cash game session is a heuristic proxy for Kelly. It assumes a certain variance and edge. If you bet too much, variance can wipe you out before the "long run" arrives.
  *   **The Custom Bit:** The specific percentages (1%, 2%, 5%) are often tribal knowledge. A high-variance tournament player needs a larger bankroll (more buy-ins) than a low-variance cash game player.
  *   **The Theoretical Commitment:** This system commits your characters to the belief that **survival is more important than profit.** A 100% return means nothing if the probability of ruin is 1%. The goal is not to win a session; it is to keep the instrument (the bankroll) intact so it can compound indefinitely.

  **The "Shot" Paradox**
  You asked how they can reconcile "never risk the roll" with "take a shot at a fish."
  *   **The Resolution:** In Kelly theory, your bet size is proportional to your *edge*.
      *   Standard Game: Edge is small. Bet size must be small (play lower stakes).
      *   Fish Game: Edge is massive. The Kelly formula actually *permits* a larger bet size because the probability of ruin decreases as your edge increases, even if the stake is higher.
  *   **Character Logic:** When a backer says, "Take the shot," they are not violating bankroll management; they are recalibrating it based on new information (the presence of a weak opponent). However, there is a second, darker logic: **Career Capital.** Sometimes a player takes a shot they can't mathematically afford because playing at that stake builds a reputation. If they win, they are "a high-stakes pro." If they lose, they drop back down. The bankroll takes the hit, but the player's *market value* rises. This is a divergence between the Backer's interest (money) and the Player's interest (status/earning power).

  ### 2. The Moral Architecture: Makeup as Incentive Compatibility

  Makeup is the most fascinating part of your inquiry. Mathematically, it looks like debt. Morally, it is a mechanism to solve the **Principal-Agent Problem**.

  **The Problem**
  The Backer (Principal) puts up money. The Player (Agent) does the work.
  *   If losses are wiped clean every month, the Player is **risk-neutral**. They have nothing to lose (it's not their money) and everything to gain (50% of profits). They would play recklessly, chasing high-variance lines to maximise their share, potentially ruining the Backer's capital.
  *   If the Player is liable for losses in *cash*, they are **over-risk-averse**. They won't take necessary risks, playing too tightly to protect their own savings, which reduces the Expected Value (EV) for the Backer.

  **The Solution: Makeup**
  Makeup creates a synthetic risk. The Player does not lose cash, but they lose *future labour*.
  *   **Load-Bearing:** The existence of makeup is essential to prevent moral hazard. It aligns the Player's pain with the Backer's loss.
  *   **The "Indefinite" Debt:** You noted that makeup can survive the end of a deal. This implies that the Player's **future earning potential** is the collateral. The theory presupposes that the Player is an asset that can be liquidated. If a player walks with £50k makeup, another backer might buy that debt for £30k, expecting the player to grind it off.
  *   **Character Commitment:** Your characters must view makeup not as a "debt" in the banking sense, but as a **score**. It is a measure of trust depleted. A player in deep makeup is playing with "house money" in the worst sense—they are desperate. The unwritten rule is that a player in heavy makeup should play *more* conservatively to clear the debt, not less, to rebuild trust.

  ### 3. The Metaphysics of Time: Who Lives in the Long Run?

  This is the crux of your question regarding the "mortal person."

  **The Infinite Game**
  The staking system implicitly assumes an **infinite horizon**. Kelly betting only works if you can reinvest profits forever.
  *   **The Backer:** Often treated as the infinite entity. A staking syndicate can outlive any individual player.
  *   **The Player:** Treated as a **replaceable component**. If a player goes bust (accumulates too much makeup), they are fired. The bankroll survives; the player is discarded.
  *   **The Contradiction:** Humans are mortal. They have rent to pay, families to feed, and a finite career span (poker is young man's game). The system demands the Player act as if they have an infinite runway (reinvesting profits, grinding out makeup over years) while living a precarious, finite life.

  **The "Long Run" as a Fiction**
  In probability theory, the "long run" is a limit as $n \to \infty$. No human plays infinite hands.
  *   **Character Psychology:** Your characters must speak as if the "Long Run" is a physical place they are travelling towards. "I'm due," or "It'll even out."
  *   **The Tension:** A rational mortal with a 40-year horizon should care about **arithmetic mean** (total cash extracted) rather than **geometric mean** (growth rate). They should take money off the table to invest in a pension, not reinvest it all into the bankroll.
  *   **The Reality:** The staking contract forbids this. You cannot withdraw your share of the bankroll; you can only withdraw *profit*. If you withdraw too much, you are "playing scared" or "not building the roll." The system punishes the mortal need for security.

  ### 4. Counterfactual: The Standard Expected-Utility Mortal

  If you swapped this system for a straightforward Expected-Utility Theory (EUT) view of a mortal human being (risk-averse, finite lifespan, consumption needs), the contracts would look radically different.

  **1. No Makeup (or Capped Makeup)**
  *   **Why:** A mortal agent has diminishing marginal utility of money. Losing £50k hurts more than winning £50k helps. Forcing a player to grind out unlimited makeup creates negative utility that outweighs the incentive to play.
  *   **Alternative:** A "Stop-Loss" clause. If the player loses 20% of the bankroll, the contract is terminated. No debt carries over. The player walks away free, but blacklisted.

  **2. Salary + Smaller Cut**
  *   **Why:** To smooth consumption. A mortal needs to pay rent during downswings.
  *   **Alternative:** The backer pays a monthly wage (taxed as employment) and takes a larger share of the winnings (e.g., 70/30) to cover the risk of the wage.

  **3. Defined Term Contracts**
  *   **Why:** The current system is often indefinite. A mortal contract would be for 12 months. At the end, profits are distributed, losses are written off or settled, and the relationship is renegotiated.
  *   **Alternative:** "Makeup resets annually." This acknowledges the player's finite career.

  **4. Risk of Ruin vs. Risk of Poverty**
  *   **Why:** The current system fears "Risk of Ruin" (bankroll hits zero). A mortal system fears "Risk of Poverty" (player can't eat).
  *   **Alternative:** The contract would mandate withdrawals for the player once the bankroll hits a certain size, regardless of growth potential.

  **Would Makeup Make Sense in this Model?**
  Only if capped. Unlimited makeup relies on the fiction that the player's labour is an infinite resource. If the player can die, retire, or quit to drive a taxi, the debt becomes uncollectible. Therefore, in a mortal model, makeup is essentially an **option on the player's future**. It is only valuable if the player is young, talented, and has no better outside options.

  ### 5. Load-Bearing vs. Custom: A Checklist for Your Characters

  To ensure you don't put contradictions in their mouths, here is a breakdown of what is essential to the theory and what is folklore.

  | Practice | Load-Bearing (Theoretical Necessity) | Custom/Folklore (Tribal Knowledge) | Character Implication |
  | :--- | :--- | :--- | :--- |
  | **50/50 Split** | **Custom.** Could be 60/40 or 70/30. | **Load-Bearing:** The split must be fixed to align incentives. | Don't have them argue the math of 50%; argue the *trust*. |
  | **Makeup** | **Load-Bearing.** Essential to prevent reckless play. | **Custom:** Whether makeup transfers between backers. | A player in makeup is "owned." They have less agency. |
  | **1-2% Risk** | **Load-Bearing.** Must be below Kelly threshold to survive variance. | **Custom:** The specific % varies by game type. | If they break this, they are either geniuses or gamblers. |
  | **Taking a Shot** | **Load-Bearing.** Justified only if Edge increases disproportionately. | **Custom:** Often done for ego/marketing. | Distinguish between a "mathematical shot" and an "ego shot." |
  | **Cashouts** | **Load-Bearing.** Profits can be taken; Bankroll cannot. | **Custom:** How much can be taken without offending the backer. | Taking money out is seen as "weakening the armour." |
  | **Verbal Deals** | **Custom.** | **Load-Bearing:** Reputation is the enforcement mechanism. | In this world, a handshake is stronger than a contract because courts can't judge "bad beats." |

  ### 6. Summary of the "Theory of Rational Betting"

  The staking world runs on a theory I would call **Instrumental Growth Utilitarianism**.

  1.  **The Good:** The maximisation of the geometric growth rate of the Bankroll.
  2.  **The Agent:** The Bankroll is the primary moral patient. The Player is a steward.
  3.  **The Constraint:** Survival (avoiding ruin) is the absolute prior to Profit.
  4.  **The Timeframe:** Indefinite. The system collapses if viewed through a finite human lifespan.
  5.  **The Ethics:** Fairness is defined by adherence to the mathematical edge, not by immediate financial outcome. A player can play perfectly and lose (morally good); a player can play poorly and win (morally suspect).

  **Where the Contradictions Live (for dramatic tension):**
  The drama in your novel lies in the friction between the **Instrumental Theory** (the bankroll must grow forever) and the **Human Reality** (the player is tired, aging, and needs cash now).

  *   **The Backer's View:** "You are in makeup. You cannot cash out. You must grind. The math says you will come out ahead in 3 years."
  *   **The Player's View:** "I am 28. I have back pain. I need a house deposit. The 'long run' might not include me."

  **Final Note on "Bust":**
  In your novel, be careful with the word "bust."
  *   **Mathematically:** Bust = Bankroll = 0.
  *   **Practically:** Bust = Backer loses faith.
  A player can be mathematically profitable but still "busted" if they violate the social contract (e.g., playing high stakes while in makeup without permission). The "bust" condition is social, not just financial. The debt (makeup) is a tether. It keeps the player attached to the backer even when the relationship is toxic, because the player cannot work elsewhere until the debt is cleared. This is a form of **debt peonage** disguised as partnership.

  If your characters understand this, they will speak about makeup with a mix of resentment and resignation. It is the price of entry. If they don't understand it, they will treat it like a normal loan, which will mark them as an outsider who is about to get crushed.
