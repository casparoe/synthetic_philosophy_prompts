  *   **Ontological Surplus:** **Split.** Can we keep QM predictions without $\psi$ being a "thing"? Yes (QBism, Copenhagen, Algebraic QFT). Therefore, the *wave ontology* is surplus. But the *statistical structure* is indispensable.

  ### 4. The Commitment: Which Rule Is Hers?

  Her rule is the **Ontological Surplus Rule**, but specifically keyed to **Causal Structure** rather than Mathematical Formalism.

