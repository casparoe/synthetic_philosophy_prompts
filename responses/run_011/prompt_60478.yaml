  *   **Why Ether was "Full Stop Pessimist":** Because the *named posit* (Ether) contributed nothing to the causal story that the Field didn't do better. It was pure surplus.
  *   **Why Caloric was "Split":** Because the *phenomenon* (Heat) retained a causal role, even if the fluid didn't.

  **Verdict on $\psi$:** She will treat $\psi$ like the Caloric Fluid, not the Heat. The *predictions* (Heat) are real; the *Wave* (Fluid) is surplus. Hence: **Split.**

