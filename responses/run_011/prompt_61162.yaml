answer: |-
  **Predicted Verdicts**
  (i) **No.** (ii) **Yes.** (iii) **No.**

  **Rule Compatibility Matrix**

  | Rule | Health/Decade | Win Match | Panic Stab | Fit Status |
  | :--- | :--- | :--- | :--- | :--- |
  | **Classical (Present Will)** | No | No | No | **Survives** |
  | **Trichotomy (Partly)** | Partly | Partly | No | **Fails** (She says No) |
  | **Praise/Blame** | No | No | No | **Survives** |
  | **Aim w/o Reserve** | Aim Yes | Aim Yes | N/A | **Compatible** (Method, not ontological) |
  | **Temporal Index** | No (Future) | No (Outcome) | No (Pre-assent) | **Survives** |

  **Rule Analysis**
  The **Trichotomy** rule (Irvine) strains fatally against the verdicts. While the instructor uses the vocabulary, her binary verdicts on health and match outcomes reject the "partly up to us" classification; she categorises them strictly as "No." The **Praise/Blame** and **Classical** rules survive intact. Both align with the distinction between voluntary assent (Yes) and involuntary externals or bodily reactions (No). The **Temporal Index** is crucial: verdicts on future states (health over a decade) are "No," while present actions (take the walk) are "Yes." This suggests "up to us" is indexed strictly to the present moment of prohairesis (moral choice). The **Aim w/o Reserve** rule explains *how* to engage with "No" items but does not define the boundary of control itself.

  The surviving rule is **Classical Act-of-Will indexed to the Present Moment**. Only current assent and impulse are truly "up to us." Future volition, like future health, is not guaranteed to the present self.

  **Predictions and Reasoning**
  **(i) Whether she will be able to refuse it when it comes: No.**
  This mirrors the "body health over decade" verdict. Future capacity, even internal, is not secure to the present agent. She cannot guarantee her future prohairesis any more than she can guarantee her future biology. To claim Yes would be arrogance, not resilience.

  **(ii) Whether becoming the sort of person... is up to her now: Yes.**
  This mirrors "take the walk" and "do work deserving rating." Current training and disposition-building are internal acts. She controls the *attempt* to forge character now, even if the future result (actually refusing) is not guaranteed.

  **(iii) Whether the flush of shame... is up to her: No.**
  This mirrors the "first stab of panic." Pre-voluntary physiological or emotional shocks occur before assent. Stoics distinguish between the *propatheia* (initial flash) and the judgment following it. The flush is bodily; the acceptance of the shame is voluntary.

  **Settling Question**
  To confirm the Temporal/Classical rule over a simple Internal/External split, ask:
  *"If I bind myself physically today so I cannot accept the shortcut tomorrow, is that restraint up to me now?"*
  If she says **Yes**, she prioritises present external control. If she says **No** (because future action is never secure), she holds the strict Classical view that only present assent is free. Given her rebuke on the brother's drinking, she will likely say **No**, confirming that even future internal states are externals to the present self.
