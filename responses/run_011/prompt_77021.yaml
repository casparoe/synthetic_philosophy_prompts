answer: |-
  ### Part 1: The Underlying Space

  Before you hand out the quiz, put this on the board. It shows students that this isn't about memorizing names, but about where they draw lines on a map.

  *   **Material vs. Information:** Is "you" defined by the specific physical atoms of the sperm and egg (the stuff), or the genetic code they carry (the blueprint)?
  *   **Absolute vs. Tolerant:** Does identity snap like a twig if anything changes (absolute), or can it bend a little before breaking (tolerant)?
  *   **Point vs. Process:** Are you created in a single instant (fertilization), or are you the result of an unbroken chain of growth (development)?
  *   **Internal vs. External:** Is your origin locked inside the microscopic seed, or does the environment (the womb, the timing, the parents) play a role in making you *you*?
  *   **One-to-One vs. One-to-Many:** Can a single starting point (one fertilized egg) result in more than one person (twins), or must every origin be unique to one individual?

  ***

  ### Part 2: The "Where Did You Come From?" Quiz

  **Instructions:** Read the scenarios. Don't overthink the science; focus on your gut feeling about whether *you* would exist in that situation. Pick the answer that feels most true.

  **1. The Twin Glitch**
  Identical twins come from the exact same sperm and the exact same egg. They share the same starting material and the same DNA. Yet, they are two different people.
  *   **A.** This proves that "where you came from" isn't enough to define who you are. Something else must split them later.
  *   **B.** They actually share the same "origin," but nature made a copy. They are biologically the same person who got split.
  *   **C.** The moment they split is the real origin, not the sperm/egg meeting.

  **2. The 1% Swap**
  A mad scientist takes the sperm that made you. He uses a tiny nanobot to replace 1% of the molecules in that sperm with identical molecules from a different guy, then fertilizes the egg.
  *   **A.** That's still you. 1% doesn't change anything important.
  *   **B.** That's not you. It's a different sperm, even if it's almost the same.
  *   **C.** It's a version of you, but not the *real* you.

  **3. The Total Swap (Ship of Theseus Sperm)**
  Same scientist. This time, he keeps the sperm alive in a jar for a year. Every day he replaces a few molecules. By the end, 100% of the original matter is gone, replaced by new stuff, but the shape and DNA are identical.
  *   **A.** It's still the same sperm. The pattern matters, not the old atoms.
  *   **B.** It's a fake. The original physical stuff is gone, so it's not the origin of *you*.
  *   **C.** It became a new sperm somewhere in the middle of the process.

  **4. The Embryo Split**
  A clinic takes a fertilized embryo (you, at day 1) and surgically splits it in half before implanting it. Both halves grow into babies.
  *   **A.** Neither is the "real" you. You were destroyed when they cut it.
  *   **B.** Both are you. The origin was the same, so the identity is shared until they separate.
  *   **C.** Only one is you, but there's no fact about which one.

  **5. The Lab Assembly**
  Scientists scan your DNA. They build a new embryo atom-by-atom from brand new matter in a lab vat (no sperm, no egg, just assembled parts). It has your exact genome.
  *   **A.** That's you. The blueprint is what makes you, not the biological parents.
  *   **B.** That's a clone, not you. You need the actual history of coming from your parents.
  *   **C.** It's a new person who just happens to look and think like you.

  **6. The Womb Swap**
  Your biological parents' sperm and egg are used, but the embryo is implanted into a completely different woman's womb. She carries and births you.
  *   **A.** You are still you. The womb is just an oven; the ingredients make the cake.
  *   **B.** You are a different person. Your origin includes the specific environment you grew in.
  *   **C.** You are the same person, but your "identity" is weaker.

  **7. The Time Capsule**
  Your parents' sperm and egg are harvested today but kept frozen for 20 years. Then they are combined.
  *   **A.** That's still you. Time doesn't change the ingredients.
  *   **B.** That's not you. You were supposed to be born 20 years ago; this is a different person born later.
  *   **C.** It depends on whether your parents are still alive.

  **8. The Sibling Switch**
  Your parents have another child. It comes from the same two parents, but a different sperm and a different egg.
  *   **A.** Obviously not me. Different gametes mean a different person.
  *   **B.** It could have been me. If the universe shuffled the cards differently, I could have been that sibling.
  *   **C.** It's a different person, but we share the same "source" so we are partially the same.

  **9. The Pause Button**
  You are conceived, grow for two weeks, then the pregnancy is paused by advanced tech for a decade, then resumed.
  *   **A.** That's still you. The chain of life was paused, not broken.
  *   **B.** That's not you. The continuous process of growth was interrupted.
  *   **C.** It's you, but you're ten years younger than you should be.

  ***

  ### Part 3: Scoring Key & Position Mapping

  Don't just count letters. Look for the *pattern* of their answers. Here is how to map their choices to the philosophical positions.

  **1. The Strict Essentialist (The Kripkean)**
  *   **Signature:** Q2(B), Q3(B), Q8(A).
  *   **View:** The exact physical gametes are required. If the sperm is different (even slightly), it isn't you. Origin is a lock that only fits one key.
  *   **Note:** This is the standard "you couldn't come from different parents" view.

  **2. The Tolerance Theorist (The Gradualist)**
  *   **Signature:** Q2(A), Q3(C), Q8(A).
  *   **View:** Small changes to the origin don't matter, but big ones do. There is a "blurry line" where you stop being you.
  *   **Note:** This avoids the harshness of Strict Essentialism but admits there is *some* limit.

  **3. The Genetic Structuralist (The Blueprint View)**
  *   **Signature:** Q3(A), Q5(A), Q8(A or B).
  *   **View:** It's about the information (DNA), not the matter. If the code is the same, *you* are the same, even if the atoms are new.
  *   **Note:** This treats humans like software rather than hardware.

  **4. The Process Continuity View (The Organismic)**
  *   **Signature:** Q1(C), Q4(A), Q9(B).
  *   **View:** What matters is the unbroken chain of biological development. If the process splits (twins) or stops (pause), identity is threatened.
  *   **Note:** Focuses on the *history* of growth, not just the starting spark.

  **5. The Gestation/Environmental View**
  *   **Signature:** Q6(B), Q7(B).
  *   **View:** Where you grew (womb/time) is part of who you are, not just the seed.
  *   **Note:** This is rarer. Most people think the womb is just a container. If they pick this, they value context over biology.

  **6. The Anti-Essentialist (The Contingent)**
  *   **Signature:** Q8(B), Q5(C), Q1(A).
  *   **View:** "You" aren't locked to an origin at all. You could have been your sibling. Origin is just a cause, not a definition.
  *   **Note:** This is the Humean view. It makes identity very loose.

  **Critique of Your List:**
  *   *Gestation View:* I kept this, but warn students it's unpopular. Philosophically, it conflates "conditions of growth" with "origin."
  *   *Missing Position:* **Psychological Continuity.** This quiz focuses on biological origin. A position that says "I am where my memories are" (so a brain transplant makes you you, regardless of sperm) isn't fully tested here. I excluded it to keep the quiz focused on *origin*, but mention it in the discussion.

  ***

  ### Part 4: Limitations & Inconsistencies

  **What This Quiz Cannot Separate**
  1.  **Strict Essentialism vs. Tolerance:** If a student answers "Not You" on the 1% Swap (Q2) and "Not You" on the Total Swap (Q3), you can't tell if they are Strict (nothing changes) or Tolerant (1% was actually over their limit). You need a 0.001% question to split them.
  2.  **Genetic Structuralist vs. Anti-Essentialist:** If they say the Lab Assembly (Q5) is "You," are they Structuralists (DNA = You) or Anti-Essentialists (Anything can be You)? You'd need a question where DNA *changes* but origin stays the same to tell the difference.
  3.  **Process vs. Strict:** If the process is interrupted (Q9), a Strict Essentialist might say "Not You" because the *causal chain* from the specific gametes was broken. A Process theorist says "Not You" because *growth* stopped. They arrive at the same answer for different reasons.

  **The "I Contradicted Myself" Guide**
  *   **If they chose Q3(A) [Pattern Matters] but Q5(B) [History Matters]:** They believe physical continuity matters more than genetic continuity. *Decider:* Ask them, "If we teleport you by disassembling your atoms and rebuilding them elsewhere, do you survive?"
  *   **If they chose Q1(A) [Twins are different] but Q4(B) [Split Embryo is same]:** They think natural splitting is different from artificial splitting. *Decider:* Ask, "Does human intention (the surgeon's knife) change biology?"
  *   **If they chose Q8(B) [Could have been sibling] but Q2(B) [1% swap is not me]:** They think big changes (different sperm) allow identity, but small changes don't. This is backwards. *Decider:* Question 8 is the anchor. Ask, "If you could have been your sibling, why does a tiny molecule change stop you from being you?"

  ***

  ### Part 5: The Empty Seats (Unheld Positions)

  These are logically possible combinations of answers that basically nobody actually believes. Tell students *why* these seats are empty.

  *   **The "Retroactive Origin" View:** (You become you only when you die, so your sperm/egg didn't matter).
      *   *Why empty:* Incoherent. You can't come from something that happens after you exist.
  *   **The "Gendered Origin" View:** (Sperm matters for boys, Egg matters for girls).
      *   *Why empty:* Biologically arbitrary with no philosophical justification.
  *   **The "50% Threshold" View:** (If 50% of the sperm is swapped, it's half-you. If 51%, it's not you at all).
      *   *Why empty:* Identity is usually seen as binary (you or not you), not a percentage. Being "half alive" doesn't make sense.
  *   **The "Parental Intent" View:** (You are you only because your parents *wanted* you; if they didn't, the same sperm makes a different person).
      *   *Why empty:* Makes identity dependent on other people's thoughts, which vanishes if the parents die.
