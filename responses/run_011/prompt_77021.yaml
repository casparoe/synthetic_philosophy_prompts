      *   *Axis 2: Moment of Fixing.* When do *you* begin? Conception? Implantation? Birth? Is it a point or a process?
      *   *Axis 3: Necessity vs. Contingency.* How rigid is the link? Is it 100% locked, mostly locked, or totally loose?
