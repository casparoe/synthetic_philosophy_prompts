          6.  Better Analogy: Evaluate alternatives (advance directives, trust fund, lease, savings account, two-key, DNR) and recommend one for the op-ed.
      *   **Tone:** Intellectual, rigorous, respectful of the user's sophistication (they are clearly very bright), but accessible enough for an op-ed context.

  2.  **Deconstruct the Ulysses Analogy (Elster's Framework):**
