answer: |-
  You assign a decimal **Weight**
  To every outcome's cash **Value**,
  To find the option **Right**,
  Minimizing expected **Cost**,
  Removing all pure **Chance**,
  Obeying rational **Law**.

  But conscience breaks that **Law**,
  Feeling a heavier **Weight**,
  Where luck is more than **Chance**,
  And persons hold intrinsic **Value**,
  Where suffering is **Cost**,
  And duty claims the **Right**.

  Is it **Right** to obey the **Law**
  When the human **Cost**
  Outstrips the credence **Weight**?
  Does utility drain **Value**?
  Is virtue merely **Chance**?

  We gamble on a **Chance**
  That calculus defines the **Right**,
  Flattening distinct **Value**
  Under one universal **Law**,
  Where belief carries **Weight**,
  And agony is **Cost**.

  You cannot budget **Cost**
  Or leave redemption to **Chance**,
  When obligation has **Weight**
  Beyond merely being **Right**,
  Breaking the single **Law**,
  To honor local **Value**.

  There remains a **Value**
  Beyond the calculated **Cost**,
  A silence where the **Law**
  Admits it leaves no **Chance**
  To say what is **Right**,
  Without feeling the **Weight**.

  The math loses **Value** by ignoring **Chance**,
  Treating moral residue as **Cost** to the **Right**;
  The **Law** of numbers cannot hold the **Weight**.

  ***

  **Notes on Liberties & Contested Ground**
  The poem treats "intertheoretic comparison" (comparing utility units across different moral theories) as impossible, but this is a live debate (e.g., MacAskill's *Normative Uncertainty* argues it is possible). It also assumes moral credences are coherent, whereas some philosophers argue you cannot have probabilistic beliefs about normative truths themselves. Finally, it portrays decision theory as inherently flattening, ignoring recent work on risk-weighted expected utility that attempts to model moral texture within a formal framework. The verdict in the envoi sides with the "phenomenology objection" (that DT misses the experience of obligation), which is not a consensus view.
