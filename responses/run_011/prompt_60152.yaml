prompt: |-
  so i've read maybe too much sequences-era stuff and the current crop of EA forums, and one of the moves i keep seeing in the moral uncertainty threads is "just treat it like decision theory under uncertainty — you've got a prior over which moral theory is true, you maximize expected value across the theories, done." i want to push back on that with something that isn't another 3000-word comment.

  write me a sestina. six end-words, your pick, but each one has to be a term that means something different in the two vocabularies by the time it comes back around — weight, value, bet, risk, right, sure, whatever you like. the rotation is the point: the words keep returning, never quite in the same slot, which is exactly what it feels like trying to say intertheoretic comparisons of value or "ought implies can" or the question of whether a theory can even have a credence attached to it in terms of states of the world and payoffs.

  the six stanzas should stage the translation honestly: start with what carries over clean, then start bending, and let the three-line envoi be the residue report — the thing that has no counterpart on my side of the fence at all. it needs to land on an actual answer to whether the leftover is because decision-theory vocabulary is missing something or because the philosophers' claims were mushier than they looked, not a shrug. and it should still be a poem somebody who's never read a normative-uncertainty paper would want to finish.

  after it, drop like 4-6 lines telling me where the poem took liberties or leaned on a reading that's genuinely contested among people who work on this stuff, as opposed to what's actually settled. i don't want to accidentally present one side of a live argument as the consensus just because it scans better.
