  **TO:** Trust & Safety Review Board
  **FROM:** Office of Community Policy
  **SUBJECT:** Community Cohesion Standard: A Framework for Enforcement
  **VERSION:** 4.2
  **DATE:** October 14, 2023
  **OWNER:** Director of Policy Standards

  **1. Purpose**
  This document establishes the Community Cohesion Standard (CCS) as a primary enforcement vector within Hearth's Trust & Safety architecture. Current policy frameworks prioritize individual harm mitigation. The CCS recognizes that Hearth functions not as an aggregate of isolated accounts but as a structured community bound by shared normative expectations. The purpose of this framework is to authorize intervention where content threatens the integrity of these shared standards, regardless of the presence of identifiable individual harm. Enforcement under the CCS is not merely a product function but a condition of the platform's continued existence. Without this mechanism, the shared environment dissolves into disconnected transactions, rendering the platform unintelligible to its user base.

  **2. Definitions**
  **Community:** The totality of active user accounts interacting within Hearth's ecosystem over a rolling quarterly period.
  **Shared Standard:** Norms of conduct implicitly accepted by the Community as necessary for continued participation. These standards are constitutive; they define what Hearth is. They are not written rules but underlying expectations.
  **Reasonable User:** A construct used to measure adherence to Shared Standards. The Reasonable User is calibrated against the median reporting frequency and sentiment expression of active accounts engaged in policy stewardship.
  **Breach:** Conduct that violates a Shared Standard, evidenced by quantitative metrics of community reaction rather than specific rule violations.

  **3. The Cohesion Thesis**
  Hearth exists only insofar as its users share a common understanding of acceptable conduct. These standards are often invisible during normal operation and are noticed chiefly in their breach. If the Community loses its shared standards, Hearth does not merely change; it ceases to be the platform its users joined. A platform without shared standards is indistinguishable from a random collection of users. Therefore, enforcement of the CCS is distinct from safety interventions regarding physical harm or fraud. It is a preservation mechanism. Conduct that undermines the moral fabric of the Community threatens the platform's structural integrity equivalent to technical subversion. Consequently, breaches of the Shared Standard should be handled as attempts to subvert the system from within, which is to say without requiring an identified victim. The injury is to the bond itself.

  **4. Detecting the Standard**
  Because Shared Standards are implicit, they are detected through aggregate user reaction. The Office of Community Policy will operationalize consensus using three metrics:
  1.  **Report Volume per Impression:** A spike in reporting relative to view count indicates normative violation.
  2.  **Negative-Sentiment Ratio:** Analysis of comment threads and reaction emojis indicating indignation or disgust.
  3.  **Distress-Weighted Reach:** The number of unique users exposed to the content multiplied by the severity of their reported distress.
  When these metrics exceed the threshold established by the Reasonable User baseline, a Shared Standard is deemed to exist and has been breached. The arithmetic of reporting determines the boundary; accounts that file the most reports define the median stewardship activity. This ensures the standard reflects active engagement rather than passive consumption.

  **5. Scope and the Question of Privacy**
  The CCS applies to all content hosted on Hearth, regardless of privacy settings or audience size. The distinction between public and private conduct is irrelevant where the content resides on platform infrastructure. Conduct exposed to strangers, even within limited audiences, remains within the Community's purview. If conduct breaches the Shared Standard, the lack of a complaining victim does not immunize the content. The harm is to the Community itself, not necessarily to a specific viewer. Private venues do not exempt content from cohesion requirements.

  **6. Proportionality**
  Enforcement under the CCS must be moderate to avoid stagnation. Standards evolve, and enforcement should lag change to ensure stability. The platform must spare any whole way of life that does not actively destabilize the core cohesion. A margin of tolerance is required; not every deviation warrants removal. Action is reserved for cases where the metrics indicate a fundamental threat to the shared understanding of Hearth. This ensures that enforcement protects the Community without policing every variation in user behavior. We do not seek to freeze culture, but to prevent disintegration.

  **7. Worked Example**
