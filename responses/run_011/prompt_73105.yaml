  - A criterion-by-criterion assessment: for each of the four rubric headings, the score and two to four sentences of justification that point at the specific passage doing the work.
  - Three or four marginal comments, keyed to identifiable sentences in the answer and phrased as I would hand them back to the student — concrete enough that they could revise from them, not evaluative throat-clearing.
