answer: |-
  ### The Scenario

  Dolores owns a shed on a blind cove where the salt air eats paint in months. Inside sits the *Orion*, a sixty-foot wooden hull she began building eleven years ago after her husband died. She has no intention of sailing it; she gets seasick, and the water is too cold. She has no intention of selling it; there is no market for custom wooden vessels that aren't working boats, and this one is too heavy to be fast. The money is gone—two million dollars of inheritance, spent on timber, epoxy, and master craftsmen who are now dead or retired. To finish the *Orion*—to varnish the final planks, install the non-functional engines, and seal the deck—will cost her another hundred thousand. If she stops now, the unfinished hull will delaminate in the damp shed, becoming hazardous waste that costs twenty thousand to dispose of. If she finishes, the boat will sit stable and dry, costing nothing further. She is alone. No one sees the shed. No one knows the boat exists. There is no reputation to save, no legacy to leave, no tax loss to harvest. On a ledger, finishing makes her eighty thousand dollars poorer than quitting.

  ### The Demonstration

  Your beta readers are applying a static model of rationality to a dynamic problem. They are treating Dolores as a series of snapshots—a different woman at every moment, each asked to maximize utility from that point forward. In that model, they are correct. The past two million is gone. The next hundred thousand yields no cash, no utility, no signal. It is a burn.

  But Dolores is not a series of snapshots; she is a line. The rationality here does not live in the future benefit of the boat, nor in the recovery of the past money. It lives in the **ontological status of the past expenditure**.

  Here is how the constraints clear the field for this specific mechanism:
  *   **Constraint 2 (No Recovery)** blocks the idea that she is finishing to get money back. The money is not coming home.
  *   **Constraint 3 (No Signaling/Option Value)** blocks the idea that she is finishing for an audience or a future possibility. The shed is closed.
  *   **Constraint 4 (Continuing Costs)** blocks the idea that finishing is cheap. It is expensive.

  Once these escapes are barred, we are left with the structure you suspected: **Retroactive Validation.**

  Until the moment she quits or finishes, the two million dollars she already spent exists in a superposition. It is either *Investment* or *Waste*. Which one it is depends entirely on her next action. If she quits, the past eleven years are objectively categorized as error. If she finishes, those same eleven years are categorized as foundation. The money is gone either way, but the *truth* of what that money was is not fixed until the project closes.

  By spending the next hundred thousand, Dolores is not buying a boat. She is buying the **classification of her past**. She is paying a premium to ensure that the previous two million dollars counts as *work* rather than *loss*. This is rational because human agency is extended in time. A decision that renders your past self irrational is a cost to your current self, even if that cost isn't monetary. It creates a fracture in the continuity of agency. To maintain a coherent life—a life where past actions align with future outcomes—she must pay the fee to validate the premise. The hundred thousand is the price of making the past eleven years real.

  ### The Attack

  Here is the objection that will come from the hard-nosed accountant, the philosopher, and the reviewer who smells a trick:

  *"You have smuggled the value into the utility function. You are simply stipulating that Dolores gets a psychic benefit from 'coherence' or 'validation,' and then calling that benefit rational. But that is just a preference. She likes not feeling like a fool. That is an expensive taste, like liking truffles or fast cars. It is not structural rationality; it is emotional hedging. You have relabeled a feeling as a reason."*

  This attack lands, but it does not kill the case. It lands because, technically, all rationality rests on terminal values. If someone asks "Why maximize wealth?" the only answer is "Because I value wealth." If Dolores values "Temporal Coherence" over "Cash," the accountant cannot prove her wrong, only poorer.

  However, the defense against this attack is that **Temporal Coherence is not merely a feeling; it is a structural requirement of agency.** We are not beings who exist only in the present. We are beings who inhabit a timeline. To act in a way that declares your past self incompetent is to undermine your own capacity to act in the future. It is a self-defeating prophecy. If Dolores quits, she admits her past judgment was false. If her past judgment was false, why trust her current judgment to quit?

  The rationality survives because it is not about *liking* the past; it is about **preserving the validity of the agent**. A reader who doesn't care about Dolores's feelings can still feel the pull because the alternative is nihilism. If sunk costs never matter, then nothing we build has any weight until it is finished, and nothing we finish has any weight once we are gone. The *Orion* is not a boat; it is a argument against the idea that we are merely consumers of the present moment.

  ### The Verdict

  Your hunch is correct. The mechanism is **Retroactive Validation**. The past cost is irrecoverable, but it is not inert. It is a question waiting for an answer. Continuing changes the past from a liability into an asset, not on the balance sheet, but in the ledger of reality.

  To write this without stipulating the verdict, do not have Dolores talk about her feelings. Have her talk about the **wood**. Have her describe the unfinished hull not as "almost done," but as "untrue." Have her describe the finished boat not as "beautiful," but as "stable." The rationality must sound like physics, not psychology. She is not satisfying a preference; she is completing a circuit. If she stops, the current has nowhere to go, and the wire burns. If she continues, the circuit closes. The money is the heat generated by the resistance. It is not wasted; it is the cost of flow.

  Write her not as a woman protecting an investment, but as a woman protecting the **truth of her own history**. That is a stake high enough to justify the cost, even to an accountant who understands that some ledgers are kept in ink, and some in blood.
