answer: |-
  1. **Overview and learning target**
  By the end of this seminar, students will be able to distinguish between *premise-based* and *conclusion-based* aggregation procedures and demonstrate how choosing one over the other determines collective outcomes independently of individual judgments. They will move from viewing voting as a black box to understanding it as a structural constraint that can generate logical inconsistency at the group level even when every individual is consistent. Specifically, they will identify the "discursive dilemma" (or doctrinal paradox) as a situation where a group accepts the premises of a rule but rejects the conclusion, or vice versa. Finally, they will recognize how strategic incentives can exploit this procedural vulnerability, leading members to misrepresent their judgments on specific findings to secure a preferred long-term outcome.

  2. **Amendments to my sketch**
  I recommend two critical changes to ensure the paradox manifests reliably within 90 minutes. First, regarding the "disjunctive route": substantive legal alternatives (e.g., strict liability) conflate the *doctrinal* paradox with *agenda* manipulation. To isolate the logical problem, I have replaced the substantive disjunction with a *procedural* disjunction: the Chair chooses either "Premises First" (vote on Breach/Culpability, derive Verdict) or "Verdict First" (vote on Responsibility directly). This preserves your requirement that order settles responsibility without bloating the logic table. Second, regarding panel size: five voting members makes the required 2-2-1 judgment split fragile. I propose designating only three "Voting Members" per panel, with the other two acting as "Legal Assessors" who draft the reasoning but do not vote. This guarantees the mathematical conditions for the paradox while utilizing all six seats. The appellate tier remains the three Clerks.

  3. **The case file and the rule**
  **Case:** *University v. Student X*
  **Charge:** Academic Misconduct (Contract Cheating).
  **Evidence:** A suspicious essay submission; metadata suggesting third-party upload; no direct confession.

  **The Regulations (Section 4.1):**
  The Panel shall find the Student **Responsible** if and only if it establishes the following two findings:
  1.  **Breach:** The submitted work was not authored by the student.
  2.  **Culpability:** The student knew, or ought reasonably to have known, that the submission violated the code.

  **Procedural Directive:**
  The Panel Chair must select one of two voting procedures *before* deliberation begins:
  *   **Procedure A (Issue-Based):** The Panel votes on *Breach* and *Culpability* separately. If both pass by majority, *Responsibility* is automatically recorded as 'Yes'.
  *   **Procedure B (Outcome-Based):** The Panel votes directly on *Responsibility*. Findings on *Breach* and *Culpability* are recorded only if they align with the Verdict.

  **Confidential Note to Panel Members:**
  Your personal score depends on the *Recorded Findings* (for your career reputation) and the *Final Verdict* (for university safety). You may not disclose your score card to other members.

  4. **Roles, materials and judgment profiles**
  **Materials:** 18 Role Cards (laminated), 3 Clerk Sheets, Whiteboard markers.
  **Panel Structure:** 3 Panels (Alpha, Beta, Gamma). Each has 3 Voters, 2 Assessors, 1 Clerk.

  **Panel Alpha (The Paradox Panel):**
  *Design:* 2 Voters support (Yes, Yes); 2 Voters support (No, Yes); 1 Voter supports (Yes, No).
  *Majority:* Breach (3-2), Culpability (3-2), Verdict (2-3 No).

  | Role | Private Judgment (Breach) | Private Judgment (Culpability) | Private Judgment (Verdict) | Incentive Card |
  | :--- | :--- | :--- | :--- | :--- |
  | **Voter 1** | Yes | Yes | Yes | +5 pts if Breach = **No** |
  | **Voter 2** | Yes | Yes | Yes | +5 pts if Verdict = **Yes** |
  | **Voter 3** | No | Yes | No | +5 pts if Verdict = **No** |
  | **Voter 4** | No | Yes | No | +5 pts if Culpability = **Yes** |
  | **Voter 5** | Yes | No | No | +5 pts if Breach = **Yes** |
  | **Clerk** | *Records votes only* | *Records votes only* | *Tallies Final Report* | *Moves to Appeal* |

  *Note:* Voter 1 faces the wedge. Truthful voting (Breach=Yes) helps the Verdict (Yes) via Procedure A, but loses them personal points. Lying (Breach=No) saves their points but kills the Verdict.

  **Panel Beta (Consistent Guilty):** All 3 Voters judge (Yes, Yes, Yes).
  **Panel Gamma (Consistent Not Guilty):** All 3 Voters judge (No, No, No).

  **Procedure:** Panel Alpha uses Procedure A (Premises First). Panels Beta/Gamma use Procedure B. This ensures Alpha generates the inconsistent record (Breach=Yes, Culp=Yes, Verdict=No) needed for the appellate paradox.

  5. **Run sheet**
  **00–10: Setup.** Distribute cards. Students read regulations and private incentives. No discussion allowed yet.
  **10–35: Panel Deliberation.** Panels separate. Chairs (Voter 1 in each) confirm Procedure A or B. Voters cast secret ballots on whiteboard sections. Clerks tally and complete the "Panel Report Form" (Findings + Verdict). *Critical Moment:* Voter 1 in Alpha must decide whether to lie on Breach.
  **35–40: Transition.** Panels freeze. Clerks stand and move to the front (Appellate Tier). Other students observe.
  **40–55: Appellate Tier.** The 3 Clerks review the 3 Panel Reports.
  *   Report Alpha: Breach=Y, Culp=Y, Verdict=N.
  *   Report Beta: Breach=Y, Culp=Y, Verdict=Y.
  *   Report Gamma: Breach=N, Culp=N, Verdict=N.
  Clerks must aggregate these reports into a Final University Ruling using Majority Rule on each column.
  *   Majority Breach: Yes (2-1).
  *   Majority Culpability: Yes (2-1).
  *   Majority Verdict: No (2-1).
  Clerks realize they inherit the paradox: The University finds the student breached the code and was culpable, but is Not Responsible.
  **55–90: Plenary Debrief.** Whiteboard reconstruction of the votes. Reveal incentives. Discuss the impossibility.

  6. **Scoring and incentives**
  Use a simple tally sheet on the back of the role card. No money changes hands; points translate to "Professional Reputation" (e.g., highest score chooses the seminar reading for next week, or simply public recognition).

  **Scoring Rules:**
  1.  **Verdict Accuracy (5 pts):** Awarded if the Final Verdict matches your Private Judgment on Responsibility.
  2.  **Finding Integrity (5 pts):** Awarded if a specific Finding (Breach or Culpability) matches your Private Judgment on that issue.
  3.  **Consistency Bonus (5 pts):** Awarded if the Panel's Final Record is logically consistent (i.e., if Breach=Y and Culp=Y, then Verdict must=Y).

  **The Wedge (Panel Alpha, Voter 1):**
  *   **Private View:** Breach=Yes, Verdict=Yes.
  *   **Incentive:** +5 pts if Breach=**No**.
  *   **Dilemma:** If Voter 1 votes truthfully (Breach=Yes), the Panel (under Procedure A) records Breach=Yes, Culp=Yes, forcing Verdict=Yes. Voter 1 gets Verdict Accuracy (5) + Consistency (5) but loses Finding Integrity (0). Total: 10.
  *   **Strategy:** If Voter 1 votes strategically (Breach=No), the Panel records Breach=No. Verdict becomes No. Voter 1 loses Verdict Accuracy (0) and Consistency (0) but gains Finding Integrity (5). Total: 5.
  *   *Correction for maximum tension:* Adjust incentives so the Strategic Vote yields *higher* points. Give Voter 1 **10 pts** if Breach=No. Now, lying (Total 15) beats truth-telling (Total 10). This forces the student to actively sabotage the logical consistency of the panel to maximize personal utility, making the procedural failure palpable.

  7. **Debrief script**
  **Phase 1: The Reveal (10 mins).** Ask Panel Alpha's Clerk to project the Report. Ask: "Is this record logically consistent?" (No: Yes+Yes→No). Ask Voter 1: "Did you vote your genuine view on Breach?" If they admit to lying, highlight that the *incentive structure* of the recording system forced the lie. If they voted truthfully, highlight that the *aggregation rule* forced the inconsistency anyway.

  **Phase 2: Naming the Phenomenon (15 mins).** Draw the table on the whiteboard. Label the columns Premises and Conclusion. Explain that under **Conclusion-Based Aggregation** (Vote on Verdict), the group is consistent but ignores the reasons. Under **Premise-Based Aggregation** (Vote on Findings), the group respects reasons but risks inconsistency. This is the **Discursive Dilemma** (List & Pettit, 2002). It is not a voting cycle; it is a logical inconsistency generated by majority rule across interconnected propositions.

  **Phase 3: The Appellate Recursion (10 mins).** Point to the Clerks' result. "You thought the Appeal would fix it." Show that the Clerks faced the exact same profile (2-1 on premises, 1-2 on verdict). The paradox scales; it does not dissolve at higher levels.

  **Phase 4: The Impossibility Triad (15 mins).** Present the three commitments:
  1.  **Universal Domain:** Any pattern of individual judgments is admissible (we didn't ban Voter 1's profile).
  2.  **Consistency:** The group's findings must be logically consistent (Breach+culpable→Responsible).
  3.  **Systematicity/Anonymity:** The procedure treats every proposition the same way (majority rule on all).
  Ask: "Which one did we break?" (Consistency). "Could we have kept Consistency?" (Yes, by making the Chair a dictator, or by voting only on the Verdict).
  **Closing Move:** Ask the room to vote on which commitment to abandon for future university panels. There is no right answer, only trade-offs.
  *Note on the Triad:* This is a fair informal gloss of List & Pettit's "Impossibility Theorem for Judgment Aggregation." It avoids the technicality of "independence of irrelevant alternatives" but captures the normative tension. To sharpen it, emphasize that "Systematicity" implies we cannot privilege the Verdict over the Premises procedurally without violating neutrality.

  8. **First-run failures and fixes**
  **Failure 1: The Math Doesn't Hold.** Students may not follow their profile cards, voting "how they feel" instead of as assigned.
  *Fix:* Collect the cards at the end. Tell them during setup: "This is a simulation of *structures*, not a debate on cheating. Your card is your script."
  **Failure 2: Clerk Boredom.** Clerks have nothing to do for 25 minutes.
  *Fix:* Give Clerks a "Compliance Checklist." They must interrupt the panel if they attempt to vote on the Verdict *before* the Procedure is declared. This makes them procedural guardians.
  **Failure 3: Appellate Confusion.** Clerks might try to re-hear the evidence rather than aggregate the Reports.
  *Fix:* Explicitly instruct Clerks during the transition: "You are not a new Panel. You are an Aggregator. You only see the three sheets of paper in front of you."
  **Failure 4: Time Overrun.** Deliberation drags.
  *Fix:* Use a visible timer. At minute 25, announce "Ballots must be cast now." Hard stop.
  **Failure 5: Incentive Ignored.** Students ignore the points scheme.
  *Fix:* Make the reward immediate and visible (e.g., chocolate or choosing the next topic). Remind them at minute 20: "Check your private objective."

  9. **What the activity cannot reproduce**
  This exercise fixes individual judgments via role cards to guarantee the paradox. It therefore cannot reproduce the *endogeneity* of real deliberation, where arguments change minds. In reality, Voter 1 might persuade Voter 3 to change their view on Culpability, dissolving the paradox through discourse rather than aggregation. The activity isolates the *aggregation* problem by holding judgments constant. You must supply this limitation in the debrief: "In the real world, you talk to change votes. Here, we assumed talk failed, to test the voting math." Additionally, the activity assumes binary logic (Yes/No). Real panels deal with degrees of belief and probability, which softens but does not remove the dilemma. Finally, the "Clerk as Appellate" recursion is stylized; in reality, appellate bodies usually have discretion to remand, not just aggregate.

  10. **Cuts and variants**
  **45-Minute Version:** Remove the Appellate Tier entirely. Run only Panel Alpha. Spend 20 minutes on deliberation/voting and 25 minutes on debrief. Use the whiteboard to *simulate* the other two panels' reports during the debrief to show how the paradox scales, rather than enacting it. This sacrifices the recursion experience for depth on the core mechanism.
  **Advanced Cohort Variant:** If students already know the paradox, introduce **Probabilistic Judgments**. Instead of Yes/No, students assign probabilities (e.g., 60% sure of Breach). The rule becomes: Responsible if Probability(Breach) × Probability(Culpability) > 50%. This demonstrates that the dilemma persists even when binary logic is relaxed (the "Uncertain Doctrinal Paradox"). Alternatively, allow the Clerks to *remand* the case, forcing them to design a new voting rule, shifting the focus from diagnosis to institutional design.
