      *   **3 (Safety) vs. 5 (Reflective Access):** 5 claims margin-for-error doesn't apply to $Kp$. 3 says Safety is necessary for *knowledge*. If $KKp$ is knowledge, it must be safe. If it must be safe, margins for error apply. 5 denies this.
