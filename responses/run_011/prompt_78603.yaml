  **MEMORANDUM**

  **TO:** Grantmaking Committee
  **FROM:** [Your Name]
  **DATE:** Wednesday
  **SUBJECT:** Recommendation for Round 4 Allocation ($3m)

  **Recommendation**
  I recommend we fully fund **Program M** (Cash + Livestock, Region A) in this round, with a binding commitment to prioritize **Program D** (Perinatal Therapy, Region B) for the spring pot. Concurrently, we should commission the **re-anchoring module** in Region A immediately, not as a gatekeeper for this decision, but to calibrate our metrics for future rounds.

  **Rationale**
  The deadlock stems from treating the life-satisfaction "points" as a common currency when they represent different underlying goods. To break this, we must shift from a utilitarian calculus (summing points) to a **capability-based framework**.

  1.  **Addressing the Adaptation Objection (for the D Advocate):**
      The concern that Region A's reported satisfaction reflects "sour grapes" (adaptive preferences) is valid regarding *hedonic* welfare. However, Program M delivers *capabilities* (Sen, 1985). Cash and livestock expand what recipients can *do* and *be* (nutrition, security, agency), regardless of whether their reported happiness adjusts upward. We are funding freedom from deprivation, not just reported contentment. This allows us to credit M's gains even if the "happiness" metric is partially adapted, because the *material capability* gain is non-adaptive.
      *Counter-point for discussion:* Does perinatal depression similarly crush capability? If so, we should weight D's intensity higher in future rounds, but M's breadth and income-priority stand for now.

  2.  **Addressing the Scale Objection (for the M Advocate):**
      We should accept the anchoring-vignette correction (+0.4 → +0.8). This acknowledges that Region A's scale is compressed. While this strengthens M's utilitarian case, we must not rely on it exclusively, as it still assumes interpersonal comparability.

  3.  **Prioritarianism:**
      The Chair's proposal to weight by "badly off" is circular only if we use satisfaction as the metric. If we use **income/consumption**, Region A is decisively worse off ($900/yr). Given our mandate to reduce poverty, income-based prioritarianism is the more defensible tie-breaker when welfare metrics conflict.

  **Timeline & Conditions**
  *   **Immediate:** Approve $3m for Program M.
  *   **Immediate:** Allocate up to $50k from operational reserves to commission the re-anchoring module in Region A.
  *   **Spring Round:** Program D receives first right of refusal on the next pot, contingent only on standard due diligence (not re-litigating this philosophical debate).
  *   **Review:** The re-anchoring data will be used to set a "conversion rate" between Region A and B satisfaction scores for Round 5, reducing metric uncertainty.

  **Proposed Decision Rule for Future Rounds**
  We should adopt a **Multi-Dimensional Threshold Rule**:
  1.  **Threshold:** Programs must demonstrate gains in at least two of three dimensions: (a) Income/Assets, (b) Clinical Health/Psychology, (c) Reported Well-being.
  2.  **Weighting:** Gains in (a) and (b) are weighted 2:1 against (c) in contexts where adaptive preferences are suspected (e.g., extreme poverty or chronic illness).
  3.  **Aggregation:** We explicitly acknowledge that "points" are not VNM utilities but *moral proxies*. We will not sum them across populations without a stated ethical conversion factor (e.g., "1 point of depression relief = 5 points of life satisfaction in extreme poverty").

  ***

  **Regarding your hunches:**

  **1. Is this a factual dispute or a dispute about what welfare is?**
  You are right: **It is a philosophical dispute.**
  The data (0.4 vs 1.2, 40k vs 12k) is not in question. The disagreement is about *commensurability*: Can a unit of "life satisfaction" in a subsistence economy be traded against a unit of "depression relief" in a clinical setting?
  *   The **M Advocate** implicitly holds a **Resource/Capability View**: Welfare is having the means to live.
  *   The **D Advocate** implicitly holds a **Mental State View**: Welfare is the absence of suffering/presence of positive affect.
  *   The **Economist** holds a **Formalist View**: Neither is measurable in a way that allows summation.
  No amount of additional data (like the re-anchoring module) will solve this, because the data must be interpreted through one of these frameworks. The re-anchoring study fixes the *measurement* error, but not the *ethical* error of comparing the two regions.

  **2. Is the Economist's objection fatal?**
  **No, it is a condition of the trade.**
  The economist is technically correct: Von Neumann–Morgenstern utilities are not interpersonally comparable. If we adhered strictly to this, the foundation could not exist, as *all* grantmaking requires comparing the welfare of Person A against Person B.
  In practice, philanthropy operates on **implicit ethical weights**. We pretend the math is objective to make the decision palatable, but we are actually making moral judgments. The economist's objection is valuable not because it stops us from acting, but because it forces us to admit that our "formula" is actually a **policy choice**.
  *   *Advice:* Do not try to solve the economist's problem. Acknowledge it. State clearly in your minutes: *"The Committee acknowledges that utility points are not cardinal units, but adopts them as a standardized proxy for moral weight under the assumption that reported changes correlate with welfare improvements."* This discharges the economist's duty without paralyzing the committee.

  **Strategic Note:**
  By recommending M but grounding it in *Capabilities* rather than *Happiness*, you give the D advocate a substantive counter-argument (e.g., "Depression also destroys capability") rather than a procedural blockade. This moves the debate from "Your math is wrong" to "Our ethical weights differ," which is solvable via the Future Rule proposed above.
