answer: |-
  ### 1. Exam Question

  **Question 4 (20 marks)**

  **Scenario:** A software service routes incoming requests to either a Legacy shard or a Modern shard. Over one month, 10,000 requests were recorded:
  *   **Legacy:** 1,000 requests. 850 met the latency target; 150 missed it.
  *   **Modern:** 9,000 requests. 8,650 met the latency target; 350 missed it.
  *   **Total:** 9,500 met the target; 500 missed it.

  Consider two indicative conditionals an engineer might assert in a postmortem:
  *   **(I1)** If the request did not go to the Legacy shard, it met the latency target.
  *   **(I2)** If the request missed the latency target, it went to the Legacy shard.

  Consider also a specific request, *r*, which went to the Modern shard, carried a 4.2 MB payload (larger than 99.5% of traffic), and met the target (180ms). Internal benchmarks show the Legacy shard takes roughly 900ms on 4.2 MB payloads due to architectural limitations. This supports the counterfactual:
  *   **(C)** If *r* had gone to the Legacy shard, it would have missed the latency target.

  Finally, a colleague proposes a replay harness that flips the routing decision for *r* and re-executes the log. He claims this settles the truth of (C) because "would have" simply means "does in the replay." You object that the harness must decide which recorded facts to hold fixed and which to vary, and this choice determines the verdict.

  **Prompt:** Write a unified essay addressing the following three tensions. First, explain why (I1) and (I2) are logically equivalent under a standard truth-functional analysis yet differ sharply in assertibility, using the provided probabilities to demonstrate the gap. Second, explain why (C) appears true despite the statistical probability of missing the target on Legacy being low (0.15), distinguishing the logic of counterfactuals from statistical frequency. Third, evaluate the replay harness objection: explain why the mechanism's choice of "fixed facts" introduces context-dependence that prevents the replay from settling the philosophical question definitively.

  ***

  ### 2. Model Answer

  The scenario presents three distinct challenges to a naive truth-functional or purely statistical account of conditionals. These challenges map onto established distinctions in the philosophy of language between truth conditions and assertibility conditions, and between statistical relevance and causal structure.

  First, consider the indicative conditionals (I1) and (I2). Under the standard material conditional analysis, both sentences are false only when the antecedent is true and the consequent is false. For (I1), this occurs when a request is Modern and misses the target (350 cases). For (I2), this occurs when a request misses the target and is not Legacy (i.e., is Modern and misses, also 350 cases). Thus, truth-functionally, they are contrapositives with identical truth conditions; the probability of either being true is 0.965. However, their assertibility differs radically. According to the Suppositional Theory (often associated with Adams), the assertibility of a conditional equals the conditional probability of the consequent given the antecedent. For (I1), we calculate P(Met | Modern), which is 8,650 divided by 9,000, approximately 0.96. This is high, warranting assertion. For (I2), we calculate P(Legacy | Missed), which is 150 divided by 500, exactly 0.30. This is low, warranting refusal. The data demonstrates that while logical equivalence preserves truth value, it does not preserve assertibility because assertibility tracks conditional probability, not the probability of the material conditional.

  Second, consider the counterfactual (C). A purely statistical approach might evaluate (C) by looking at the base rate of failure on the Legacy shard. The data shows P(Missed | Legacy) is 150 divided by 1,000, or 0.15. If counterfactuals were merely conditional probabilities, (C) would be false or highly unlikely. However, (C) strikes us as plainly true. This aligns with the Possible World semantics (associated with Lewis or Stalnaker), where a counterfactual is true if the consequent holds in the closest possible world where the antecedent is true. The "closeness" of a world is determined not by statistical frequency but by causal laws and specific facts. In this case, the specific fact of the 4.2 MB payload and the causal law regarding Legacy architecture (lacking columnar cache) dictate the outcome. The 0.15 base rate reflects average traffic, mostly small payloads. For *r*, the specific causal mechanism overrides the statistical average. Thus, counterfactuals track causal powers and specific circumstances rather than fleet-wide frequencies.

  Third, the replay harness objection highlights the context-dependence of counterfactuals. The colleague claims the replay settles the truth of (C) by making it actual. However, to replay request *r* on the Legacy shard, the harness must construct a simulation. It must decide which facts from the original log to hold fixed. If it holds the payload size (4.2 MB) fixed, the simulation will likely show a latency miss, confirming (C). If it holds the *outcome* (meeting the target) fixed and adjusts other variables to accommodate the Legacy routing, the simulation would show a hit, falsifying (C). There is no metaphysically privileged set of facts to hold fixed; this is a contextual choice. Different contexts prioritize different similarities (e.g., matching input size vs. matching output status). Therefore, the replay does not discover a pre-existing truth value independent of context; it enforces a specific context of comparison. The harness resolves the engineering question by stipulation, but it cannot resolve the philosophical question because the truth conditions of counterfactuals remain sensitive to which facts the evaluator chooses to prioritize.

  In sum, the data illustrates that indicatives require a probabilistic account of assertibility distinct from truth conditions, counterfactuals require a causal account distinct from statistical frequency, and the evaluation of counterfactuals remains context-dependent regarding which facts are held fixed.

  ***

  ### 3. Marking Scheme (20 Marks Total)

  **Part 1: Indicatives and Assertibility (6 Marks)**
  *   **2 marks:** Correctly identifies that (I1) and (I2) are truth-functionally equivalent (material conditional) with the same probability of truth (0.965).
      *   *Typical Error:* Claims they have different truth values because one sounds wrong.
  *   **2 marks:** Correctly calculates the conditional probabilities: P(Met|Modern) ≈ 0.96 and P(Legacy|Missed) = 0.30.
      *   *Typical Error:* Uses the wrong denominator (e.g., divides by total requests instead of antecedent cases).
  *   **2 marks:** Explains the divergence using the concept of assertibility conditions (or suppositional theory) rather than truth conditions.
      *   *Typical Error:* Asserts that logic is broken rather than distinguishing truth from assertibility.

  **Part 2: Counterfactuals vs. Statistics (8 Marks)**
  *   **2 marks:** Identifies the conflict: Base rate (0.15) suggests falsehood, but intuition suggests truth.
      *   *Typical Error:* Claims the base rate proves the counterfactual false.
  *   **3 marks:** Explains that counterfactuals rely on specific causal mechanisms/laws (payload size + architecture) rather than general frequencies.
      *   *Typical Error:* Treats counterfactuals as identical to conditional probability.
  *   **3 marks:** References the "closest possible world" or similarity metric concept to explain why *r* is treated differently from the average request.
      *   *Typical Error:* Vaguely says "it depends on the situation" without referencing causal structure or similarity.

  **Part 3: The Replay Harness (6 Marks)**
  *   **2 marks:** Acknowledges the colleague's view (replay makes it actual) but states the objection (fixity of facts).
      *   *Typical Error:* Accepts the colleague's view that replay settles the metaphysical truth.
  *   **2 marks:** Explains that holding different facts fixed (payload vs. outcome) yields opposite results.
      *   *Typical Error:* Assumes there is only one correct way to run the replay.
  *   **2 marks:** Concludes that this demonstrates context-dependence; the harness stipulates a context rather than revealing context-independent truth.
      *   *Typical Error:* Concludes that the harness proves the engineer is wrong.

  **General Constraints**
  *   **Deduction (up to 5 marks):** For exceeding word count significantly, poor organization, or failing to use the provided numbers where required.
  *   **Bonus (None):** No extra marks for naming philosophers (Lewis, Adams, etc.), but no penalty either. Marks are for reasoning with the case.

  ***

  ### 4. Confidently Stated Positions That Should Cost Marks

  1.  **"Conditionals are material implications, so (I1) and (I2) must be equally assertible."**
      *   *Why it fails:* Confuses truth conditions with assertibility conditions; ignores the probabilistic data provided.
  2.  **"The counterfactual is false because the statistical probability of failure on Legacy is only 15%."**
      *   *Why it fails:* Treats counterfactuals as statistical generalizations rather than claims about specific causal mechanisms in specific worlds.
  3.  **"The replay harness proves the counterfactual true because it makes the event actual."**
      *   *Why it fails:* Ignores the problem of which background facts are held fixed during the simulation; assumes simulation is metaphysically neutral.
  4.  **"Logic requires contrapositives to have the same meaning, so the engineer's intuition about (I2) is simply mistaken."**
      *   *Why it fails:* Dismisses linguistic data (assertibility) in favor of formal logic where the course material suggests a distinction (e.g., Adams' Thesis).

  ***

  ### 5. First-Class vs. Competent

  A **competent** answer correctly calculates the probabilities, notes that counterfactuals differ from statistics, and mentions that the replay requires choices. It treats the three parts of the prompt as separate tasks.

  A **first-class** answer integrates the sections. It uses the "fixity of facts" discussion in Part 3 to explain *why* the counterfactual in Part 2 diverges from the base rate (i.e., the base rate holds the *distribution* of payloads fixed, while the counterfactual holds *r's specific payload* fixed). It explicitly articulates that the replay harness does not solve the context-dependence problem but rather enforces a specific context, linking the engineering constraint back to the philosophical problem of similarity metrics.
