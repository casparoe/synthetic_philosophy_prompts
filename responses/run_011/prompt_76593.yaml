              *   Assertibility (Adams/Edgington): P(M|¬L) = 8650/9000 ≈ 0.96. High assertibility.
          *   (I2) If ~M, then L. (If missed target, then legacy).
              *   Truth-functional: Contrapositive of I1. Same truth conditions. Probability = 0.965.
              *   Assertibility: P(L|~M) = 150/500 = 0.30. Low assertibility.
          *   *Philosophical Point:* Material conditional equivalence vs. Probabilistic/Assertibility difference (Adams' Thesis).
      *   **Subjunctive/Counterfactual:**
