answer: |-
  You describe a grim arrangement, and I will concede readily that it looks like a deliberate strategy to evade democratic accountability. State A is indeed using State B as a buffer to insulate its legislature from the consequences of its border policies, and the involvement of a private firm adds a layer of obscurity that should trouble us both. But you leap from the existence of this evasion to the conclusion that the asylum seekers thereby become members of the demos entitled to a vote. This is the bootstrapping error I mean to challenge. The people of State A and the people of State B remain the constituent powers here because they are the ones who authorized the treaty, funded the camps, and permitted the subcontracting. The coercion flows from their sovereign will, even if delegated, and the boundary of their political community is defined by their mutual recognition and shared historical project, not by the accidental presence of those they choose to regulate or exclude.

  The mistake in your view is conflating jurisdiction with membership. Yes, the camp residents are subject to rules about curfews and transfers, but these are administrative regulations imposed within a zone of exception, not the fundamental laws that constitute a political order. When you argue that subjection demands a say, you assume the only valid form of justification is enfranchisement. I deny this. We can demand that State A and State B owe these residents justification through human rights tribunals, international oversight, or trusteeship mechanisms without granting them the franchise. The remedy for wrongful coercion is not necessarily to dissolve the boundary of the people who coerced them, but to hold that people accountable for violating the norms that constrain their external actions. If the camp rules are unjust, the citizens of A and B should vote to change them, but the asylum seekers do not become citizens simply by being on the receiving end of the injustice.

  Consider where your logic leads regarding the private firm. You note that most employees are nationals of a third state, yet they write the day-to-day rules. Under the all-subjected view, are these employees now part of the demos because they are subject to employment contracts and liability laws while enforcing the coercion? Or do the asylum seekers constitute a separate demos within the camp, entitled to vote on the curfew but not on the tax laws of State A? This fragments the sovereign authority required to maintain any stable democracy. A people must exist prior to the rules to judge them, otherwise the demos changes every time a regulation is written. The boundary is not porous to every instance of power; it is drawn by the collective agent that holds the constituent power to begin with, and in this case, that agent remains the electorate of A and B, however poorly they have exercised their duty.
