  Three weeks ago I moved from an academic post into a role structuring contingent-consideration clauses for small acquisitions, and in my second week I ran into an earn-out whose arithmetic my colleague — I'll call him R., a statistician by training — insists is sound. The clause ties my client's payment to a metric my client can currently estimate at some figure V, and the counterparty's own estimate of the same metric is either half of V or twice V; neither side knows the other's number. R. wrote out the familiar calculation: half the time the counterparty's figure is 2V and half the time it is V/2, so the expected value of anchoring to their number rather than ours is 1.25V, and it is therefore always worth taking the other side's figure. I told him this is the two-envelope argument and it is a fallacy. He told me the fallacy only exists in the textbook version, where the amounts are written into the envelopes before anyone looks, and that once the numbers are generated by two people holding genuinely different information the calculation goes through.

  We have agreed to write down our credences before Friday's meeting and see whether we can locate the disagreement. Mine, on the proposition below, is 0.70; his is 0.20. I would like your number.

  **Proposition.** In every well-posed version of the two-envelope problem in which the pair of amounts is fixed before the choice is made and the agent's uncertainty is representable by a proper prior with a finite expectation, the inference that the other envelope is worth 1.25 times the amount observed — and hence that one should always switch — is blocked by the probability model alone. No restriction on or revision of expected-utility maximization is needed to dispose of the paradox: nothing turns on bounding utility, on how divergent or undefined expectations are treated, or on any special principle governing decisions over infinite partitions.

  Please give me a single number for this proposition and then decompose it. I want the sub-questions your number actually depends on, a credence for each, and an account of how they combine — including the conditional structure, since these terms are plainly not independent. The following are candidates; add, drop, or replace them as you see fit: whether any proper prior whatsoever can license always-switching; whether the diagnosis of the fallacy is really an equivocation between a conditional and an unconditional expectation, or something else, such as holding the observed amount fixed while the distribution over pairs shifts; whether a variant in which the amounts are not fixed in advance and the two parties hold asymmetric information is a version of the same paradox or a different phenomenon wearing its clothes — this is R.'s entire objection, and I need to know whether he has found a genuine hole or committed a category error; whether unbounded utility leaves a residue that only decision theory can clear; and whether non-conglomerability does any work here beyond what the improper-prior diagnosis already does.

