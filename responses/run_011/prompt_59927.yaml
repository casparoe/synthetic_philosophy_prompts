  No references, please: I have no way of checking them and I do not need them. Where a named position, standard example, or known result matters, name it and move on, and I will look it up myself.

  Format: give me your reasoning in prose first, in whatever order makes the argument clearest, and then a JSON object I can paste into a spreadsheet, matching this schema exactly.

  - `proposition`: your one-sentence restatement of what you took the proposition to be, so I can check that we agree on it.
