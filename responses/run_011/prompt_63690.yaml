prompt: |-
  I'm putting together a proposal for a one-year postdoc in formal philosophy and I want both a real draft and a sanity check on the framing. My half-formed idea: the St. Petersburg puzzle is always treated as a problem about the gambler — unbounded utility, risk attitudes, whether to cap the value function or weight probabilities differently. But the game only has infinite expected value if somebody can actually pay it, and the finite-bankroll reply (no house has infinite reserves, so the real gamble was never the one we wrote down) gets filed as a side note that dissolves the paradox too cheaply. I want to argue it isn't a side note: payability is doing unacknowledged work all through the literature, and once you make it explicit you get a different object to theorize about — gambles indexed to a pair, agent and house, rather than to an agent alone. Write the proposal: state the question precisely enough that it could come out either way; say why the standard fixes (bounded utility, risk-weighted decision rules, comparing expected utilities relative to some baseline) leave it open instead of answering it; sketch what I'd actually do month by month, including whether I need to formalize 'payable' or whether an informal criterion would carry the weight; give a hard case to test it on — Pascal's mugging or one of the conditionally-convergent variants would be the obvious candidates — and say what result would count as the project failing, e.g. if the pairwise framing turns out to be just a relabeling of the bankroll objection. No citations, I'll add those myself. And be blunt about where you think this framing is most likely to go wrong: what consideration would make you scrap the question rather than the answer.
