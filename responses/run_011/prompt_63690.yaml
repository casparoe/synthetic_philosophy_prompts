answer: |-
  **Project Title:** The Counterparty Constraint: A Relational Approach to Unbounded Gambles

  **1. The Research Question**
  Standard decision theory treats the St. Petersburg paradox as a monadic problem: given a gamble with infinite expected value, how must a rational agent restrict their utility function or probability weighting to avoid absurd recommendations? This project asks: **Does modeling the payability of a gamble as a structural constraint on the agent-house pair, rather than a bound on the agent's utility, generate normative principles that cannot be derived from standard agent-side restrictions?**

  The question is designed to be falsifiable. If the dyadic (agent-house) model yields the same admissible actions as a monadic model with bounded utility or risk-weighting, the project fails. If the dyadic model permits or forbids actions that standard models cannot justify without *ad hoc* parameter tuning, the framing succeeds.

  **2. Motivation and Critique of Standard Fixes**
  The literature typically resolves St. Petersburg by modifying the agent. Bounded utility functions cap the value of outcomes. Risk-weighted decision theory discounts low-probability high-payoff tails. Some propose comparing expected utilities relative to a baseline rather than in absolute terms.

  These fixes leave the core ontology of the gamble untouched. They assume the gamble *exists* as described (an infinite series of potential payouts) and that the paradox arises from the agent's inability to process it. This treats the "finite bankroll" objection as a trivial empirical footnote: of course no house has infinite money, but the paradox is about rationality, not liquidity.

  I argue this distinction is false. If a payout is physically or logically impossible for the counterparty to make, the event space of the gamble is ill-defined. By treating payability as a side constraint, standard theory ignores how uncertainty about the *house's* capacity alters the rationality of the *agent's* choice. The project posits that "rational acceptance of a gamble" is not a property of the agent's preferences alone, but a relation between the agent's valuation and the house's solvency.

  **3. Work Plan (12 Months)**

  *   **Months 1–3: Formalizing 'Payability'**
      *   Task: Determine whether 'payable' requires a hard formal definition (e.g., solvency relative to a resource bound) or an informal criterion (e.g., epistemic accessibility of funds).
      *   Deliverable: A working definition of a "Valid Gamble" as a tuple $\langle A, H, O, P \rangle$ where $H$ (House) has a capacity function $C$ limiting outcomes $O$.
      *   Decision Point: If 'payable' cannot be formalized without collapsing into "Agent believes House has finite money," I will pivot to an epistemic framework where the constraint is on the Agent's justification for believing the House can pay.

  *   **Months 4–6: Developing the Dyadic Model**
      *   Task: Construct a decision rule that takes the House's capacity as an input. Compare this against Bounded Utility and Risk-Weighted Expected Utility.
      *   Deliverable: A proof of concept showing a scenario where the Dyadic Model forbids a gamble that Bounded Utility permits (or vice versa).
      *   Focus: Establishing that the constraint is external to the agent's psychology.

  *   **Months 7–9: Hard Case Testing (Conditionally Convergent Variants)**
      *   Task: Apply the model to the Pasadena Game or Altadena Game. These variants involve conditionally convergent series where expected value is undefined even without infinite payouts.
      *   Rationale: If the dyadic framing only works on simple St. Petersburg, it's weak. These games break standard expectation regardless of bankroll size due to rearrangement issues.
      *   Test: Does indexing the game to a specific House (with a specific payout schedule order) resolve the undefined expectation?
      *   Deliverable: Case study analysis.

  *   **Months 10–12: Synthesis and Writing**
      *   Task: Draft papers. One on the formal distinction between agent-bounds and counterparty-bounds. One on the application to conditionally convergent games.
      *   Deliverable: Two draft manuscripts for submission.

  **4. Failure Conditions**
  The project fails if the dyadic framing turns out to be merely a relabeling of the bankroll objection. Specifically:
  1.  **Mathematical Equivalence:** If the dyadic decision rule is mathematically isomorphic to a bounded utility function (e.g., the House's cap simply acts as a utility cap), the philosophical framing adds no theoretical value.
  2.  **Triviality:** If the result is simply "Agents should not accept gambles the House cannot pay," this is a tautology, not a decision theory. The model must handle cases where the Agent is *uncertain* about the House's capacity.
  3.  **No New Norms:** If the model does not recommend different actions than standard theory in edge cases (e.g., it agrees with Risk-Weighted EU in all practical instances), the distinction is purely semantic.

  **5. Sanity Check and Vulnerabilities**
  *   **The "Economics Already Did This" Risk:** Counterparty risk is standard in finance. If this proposal ignores literature on default risk and credit constraints, it will look naive. *Mitigation:* I must distinguish philosophical rationality from financial risk management. The focus is on the *definition of the gamble*, not the pricing of debt.
  *   **The "Relabeling" Risk (Highest Probability of Failure):** This is the strongest objection. A critic will argue that "House cannot pay $X$" is functionally identical to "Agent receives utility of $X$ capped at House's wealth." If the math reduces to $E[U] = \sum P(i) \cdot \min(Payout_i, Bankroll)$, then I haven't found a new object to theorize; I've just added a variable to the standard equation. To survive this, I need to show that the *source* of the bound matters normatively. For example, does a gamble change its rational status if the House *could* pay but is legally barred from doing so, versus physically unable? Standard theory says no (outcome is the same); my theory might say yes (the structure of the commitment differs).
  *   **The Formalization Trap:** If I spend Months 1–3 trying to define "payability" too rigidly (e.g., in terms of global wealth), the model becomes an economic model, not a philosophical one. If I define it too loosely (e.g., "reasonable belief"), it loses formal bite.
  *   **When to Scrap the Question:** I should scrap this if, by Month 3, I find that the "House capacity" variable can be fully absorbed into the Agent's probability distribution (i.e., the probability of the House defaulting is just another probability weight). If the counterparty constraint reduces to epistemic uncertainty about outcomes, the dyadic framing is redundant. The project relies on the claim that payability is a *structural* limit on the game tree, not a *probabilistic* branch within it. If that distinction cannot be maintained, the project collapses.

  **6. Conclusion**
  This project risks being a solution in search of a problem. However, if successful, it shifts the locus of decision-theoretic paradoxes from the psychology of the agent to the metaphysics of the transaction. It forces formal philosophy to acknowledge that a gamble is not a abstract function, but a social contract with physical preconditions.
