answer: |-
  **Incident Report: INC-2024-05-14-LED**
  **Service:** `ledger-core`
  **Date:** 14/05/2024
  **Severity:** SEV-2
  **Owner:** Platform Engineering

  **Summary**
  During a scheduled blue-green deployment, two distinct binaries answering to the DNS name `ledger-core.internal` processed production traffic simultaneously for nine minutes. One binary was the current production artifact (v11.4); the other was a resurrected 2013 build (v1.0) compiled locally by a former employee and inadvertently promoted via the CI/CD pipeline. Both instances produced separate, non-identical audit trails for the same transaction IDs.

  **Impact**
  *   14,000 transactions processed with divergent state hashing.
  *   Audit trail integrity compromised for the window 14:09–14:18 BST.
  *   Compliance team unable to certify which binary constitutes the legal entity of record.

  **Timeline**
  *   **14:02 BST:** Deploy pipeline triggered for v11.4.
  *   **14:05 BST:** Legacy v1.0 binary detected in staging environment. Automated compliance check passed based on interface contract matching.
  *   **14:09 BST:** Load balancer began splitting traffic between v11.4 and v1.0.
  *   **14:14 BST:** Alerts fired regarding state divergence.
  *   **14:18 BST:** Traffic routed exclusively to v11.4. v1.0 instance terminated.

  **Root Cause Analysis**
  The incident stems from an unresolved ambiguity regarding the identity criteria for `ledger-core`. Over eleven years, the service has undergone total material replacement: implementation language, datastore, infrastructure, and owning team have all changed. Only the DNS name and the client-facing contract remain constant.

  Operational consequences vary depending on which identity criterion is prioritised:
  *   **If identity is Code:** The v1.0 binary is a different service. The incident was a namespace collision.
  *   **If identity is Causal History:** The v1.0 binary lacks the continuous deployment lineage of v11.4. It is a distinct entity mimicking an existing one.
  *   **If identity is Function/Name:** Both binaries are `ledger-core`. The incident was a single service running in an inconsistent state.

  During the post-incident review, Staff SRE J. Thorne argued that the question itself is malformed. Thorne posits that `ledger-core` is a four-dimensional object extended through spacetime. The 2013 build and the 2024 build are merely different temporal parts of the same spacetime worm. The incident represented an overlapping of temporal slices that are usually sequential. Thorne noted that our monitoring tools track 3D instances at time *t*, not 4D continuants, rendering the divergence invisible until state comparison.

  Principal Engineer A. Vance countered: "Identity over time just is continuity of process. If the transaction flow was uninterrupted, the service is the same."
  Senior Engineer M. Gupta replied: "That is question-begging. It assumes the process we are tracking is the one continuing. It defines identity by continuity when continuity is what requires the identity to be established first."

  No consensus was reached on whether the v1.0 binary was a backup, a rival, or the same object.

  **Five Whys**
  1.  **Why were there divergent audit trails?** Two instances processed transactions simultaneously.
  2.  **Why were two instances live?** The CI/CD pipeline accepted the v1.0 binary as a valid candidate for `ledger-core`.
  3.  **Why was it accepted?** It satisfied the interface contract and integration tests.
  4.  **Why is contract satisfaction sufficient for identity?** We define service identity by external behaviour rather than internal lineage.
  5.  **Why is external behaviour the sufficient criterion for identity over time?**
      *   [Unanswered]
      *   *Action:* No further action.

  **Action Items**
  *   **Refactor causal history:** Ensure all service artifacts share a singular, unbroken lineage chain. (Owner: Platform Team, Due: 30/06/2024)
  *   **Align temporal parts:** Prevent overlapping temporal slices of `ledger-core` in production. (Owner: SRE, Due: 30/06/2024)
  *   **Update CMDB:** Record the CMDB entry as the sole determinant of canonical identity, regardless of metaphysical status. (Owner: Config Mgmt, Due: 21/05/2024)

  **Resolution**
  The Config Management Database (CMDB) currently points to the v11.4 artifact. It is resolved that whatever the CMDB says is canonical is canonical. The v1.0 binary is designated non-canonical. Incident status: Closed.
