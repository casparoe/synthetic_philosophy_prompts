  Okay so this is a legal-philosophy question I sort of backed into from work, and I have no idea what the actual literature says.

  I'm on an infra team with a policy engine that decides which config changes are allowed to be applied. The catch: the policies are themselves just configs in the same repo going through the same pipeline. So the rule that decides whether a change is legitimate gets changed under that very rule -- the current policy set has to approve the change that replaces it. And I can't get my head around how that's supposed to work. Either the old rule authorizes its own replacement, which seems to require it to apply to itself, or the new rule just asserts a validity it doesn't have yet. Where does the authority for the switch come from?

