  Maria inspects a steel crate under warehouse lighting to verify its shipping zone. She reads the stenciled ID, seeing the final digit is '4', and infers it is not '5'. Had the digit been '3' or '6' (nearest not-$p$ worlds), distinct glyph shapes would prevent her belief. However, in nearest worlds where the digit is '5' (not-$q$ worlds), a conjunction of two unlikely conditions obtains: a stamping error placed a '5', and oil residue obscured the bottom curve, making it indistinguishable from '4'. Her visual evidence remains numerically identical here, so she still believes '4' and infers 'not 5'. Stencil fonts differ in the lower quadrant, where grease can obliterate the distinguishing curve. She knows $p$ and the entailment, believes $q$, but lacks knowledge of $q$ due to insensitivity.

  ### 1. Specification Check
  *   **One paragraph, ≤150 words:** 132 words.
  *   **Plausible workplace:** Warehouse inventory inspection.
  *   **No skepticism:** No demons/vats; only oil and stamping errors.
  *   **No stock examples:** Not barns/lottery/clocks.
  *   **$p$ known:** "Digit is 4" (Sensitive to 3/6).
  *   **Entailment necessary:** "4" logically entails "Not 5".
  *   **$q$ ordinary:** "Digit is not 5" (Practical shipping stakes).
  *   **Failure mechanism:** Variation fails for $q$ (Belief persists in nearest $\neg q$).
  *   **Evidence identity:** Visual experience identical in $\neg q$ worlds (due to oil).
  *   **Modal asymmetry:** $\neg p$ (3/6) is single-change/common; $\neg q$ (5+oil) is conjunction/rare.
  *   **Technical fact:** Stated regarding stencil fonts and grease.

  ### 2. Tracking Analysis
  *   **Belief $p$ ("Digit is 4"):**
      *   **Method $M_1$:** Visual inspection of glyph shape.
      *   **Truth:** True.
      *   **Belief:** Yes.
      *   **Variation:** In nearest $\neg p$ worlds (Digit is 3 or 6), glyph shape differs significantly. Maria does not believe "4". **Success.**
      *   **Adherence:** In nearest $p$ worlds, she sees "4" and believes. **Success.**
      *   **Verdict:** Knowledge.
  *   **Conditional ($p \to q$):**
      *   **Method $M_2$:** A priori deduction (mutual exclusivity of digits).
      *   **Verdict:** Known a priori.
  *   **Belief $q$ ("Digit is not 5"):**
      *   **Method $M_3$:** Deduction from $M_1$ belief.
      *   **Truth:** True.
      *   **Belief:** Yes.
      *   **Variation:** In nearest $\neg q$ worlds (Digit is 5), the conjunction (Error + Oil) makes evidence identical to actuality. Maria believes "4", thus believes "Not 5". **Failure.**
      *   **Adherence:** In nearest $q$ worlds, she believes. **Success.**
      *   **Verdict:** No Knowledge (Variation condition failed).

  ### 3. Method-Relativization Reply
  *   **Narrow Individuation ($M_{deduction}$):** If the method is solely "Deduction from belief that $p$", sensitivity depends on the basis. In $\neg q$ worlds, the basis (belief that $p$) is held falsely. Thus, the deduction yields a false belief insensitively. Failure persists.
  *   **Broad Individuation ($M_{visual+deduction}$):** If the method includes the visual inspection, the insensitivity originates in the perceptual link. In $\neg q$ worlds, the visual component fails to track truth due to masking. Failure persists.
  *   **Motivation:** The broad individuation is better motivated because the belief in $q$ causally depends on the visual evidence. Neither individuation restores knowledge of $q$ because the insensitivity is rooted in the evidence identity constraint required by the case design.

  ### 4. Structural Feature & Removal Tests
  *   **Structural Feature:** **Masked Counterpart Asymmetry.** The $\neg p$ worlds are unmasked variations (detectable), while the $\neg q$ worlds are masked variations (undetectable due to conjunction).
  *   **Removal Test 1 (Exact Duplication Ruled Out):** If warehouse protocol mandates degreasing before inspection, the "oil" condition is impossible. The nearest $\neg q$ worlds become unmasked (Digit 5 looks like 5). Maria sees "5", doesn't believe "4". Variation succeeds. **Closure Restored.**
  *   **Removal Test 2 (Independent Method):** If Maria also scans a barcode (which cannot be obscured by oil), she detects the "5" in $\neg q$ worlds. Variation succeeds. **Closure Restored.**
  *   **Removal Test 3 (Salient Risk):** If Maria has positive reason to suspect oil interference, she withholds belief in $p$. Knowledge of $p$ vanishes. **Closure Collapses (via antecedent failure).**

  ### 5. Verdict on Tolerability
  *   **Verdict:** The conjunction "She knows $p$, knows $p$ entails $q$, but doesn't know $q$" sounds **tolerable** in this case.
  *   **Comparison:** Unlike the "Hands/Vat" case, this does not invite global skepticism. The failure is local, tied to a specific physical occlusion (oil) rather than metaphysical deception.
  *   **Advantage:** This demonstrates that tracking theory's closure failure is not merely an artifact of anti-skeptical maneuvering but arises in mundane reliability gaps. It is not a hidden deceiver; the "deception" is causal and physical (grease), not agential or metaphysical.

  ### 6. Strongest Closure Defender Attack
  *   **Target:** The claim that Maria knows $p$ ("Digit is 4").
  *   **Argument:** A defender of closure (e.g., a Safety theorist) argues that if the risk of the masking conjunction (Error + Oil) is non-zero in the environment, Maria's belief in $p$ is not *safe*. In nearby worlds where the conjunction obtains, she believes $p$ falsely. Therefore, she never knew $p$ to begin with.
  *   **Judgment:** The attack **lands** against Safety theories but **misses** against Tracking. Tracking explicitly distinguishes nearest $\neg p$ worlds (3/6, detected) from further $\neg p$ worlds (5+Oil, undetected). Since sensitivity only requires tracking in the *nearest* false worlds, Tracking preserves knowledge of $p$ while denying $q$. The attack succeeds only if one abandons Tracking for Safety, which begs the question against the tracking framework.
