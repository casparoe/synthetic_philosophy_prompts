  so I got into it with my roommate last night for like three hours about the "equality of what" question and we both ended up more confused than when we started. She's doing a health econ PhD, so every time I made a philosophical move she asked me how I'd measure it, and I kept dodging, which I suspect means something. I figured I'd just write down where I actually stand and get an honest read on whether it hangs together before I say any of this out loud again.

  Here's my list. (1) The currency of distributive justice should be access to advantage — basically capability sets, not functionings: what matters is what people are really able to do and be, not whether they end up doing it. (2) I'm an anti-perfectionist; the state shouldn't promote any particular conception of the good life, and I don't want anyone handing down an official list of valuable ways to live. (3) People can be held responsible for their own expensive tastes insofar as they could have shaped them, so the rare-wine guy doesn't get topped up. (4) I distrust reported wellbeing as a metric, because adaptive preference formation means the chronically deprived tell you they're fine. (5) Conversion factors do the real work: the same income buys a very different capability set for someone with a disability, a single carer, or a person in a cold climate, so redistribution should track that rather than income. (6) Health gaps are the paradigm injustice for me and closing them is a priority. (7) Capabilities are plural and irreducible — I don't think there's a legitimate single index that weights them against each other. (8) But policy still has to produce rankings, so I'm not going to pretend incomparability gets me out of decisions. (9) And roughly luck egalitarian about the cut: brute luck gets compensated, chosen gambles don't.

  Somthing in there has got to be incoherent — she said at least two of these are flatly incompatible and I said no, they just *sound* incompatible — but I can't tell which is which, and I don't want to be talked into agreeing with her just because she was more confident. So go through the set and audit it. Tell me which pairs genuinely pull against each other and which ones only look like they do, ordered by severity rather than listed flat. For each real tension say what has to give, what the cheapest repair is, and what that repair costs me elsewhere in the list — I don't want a fix that silently breaks (4) to save (6). Then tell me which single revision would clean up the most damage. And please don't just reassure me that it all fits with careful wording: if two of my commitments are each perfectly standard views whose usual motivations simply can't both be had, say so plainly.

  Format: lead with a section called "Bottom line", two or three sentences, saying whether the package survives and what breaks first. Then "Tensions, worst first", one ranked entry per genuine problem, about 120 words each. Then "The false alarm", roughly 100 words on whichever pairings look bad but dissolve — and I want the actual reason they dissolve, not just a note that they're unimportant. Then "Cheapest repairs", about 120 words, including which one change does the most work. Then "Confidence", about 60 words, saying how sure you are of the main calls you made and singling out the single point you're least sure about plus what would change your mind on it.
