answer: |-
  # Activity: The Office Coffee Run

  **Time:** 75 Minutes
  **Class Size:** 14 Adults (5 Teams of 2-3)
  **Math Level:** Adding fractions, basic percentages.
  **Goal:** Experience Simpson's Paradox and understand that *context* dictates which data table is trustworthy.

  ## 1. The Setup (5 Minutes)
  **Scenario:** You work in a 6-story office building. Two coffee vans deliver to desks: **UpStart** and **DownToEarth**.
  **Goal:** You want **Hot Coffee**.
  **Data:** You are given delivery logs. "Success" = Coffee arrived Hot.

  **Team Roles:**
  *   **The Commuter:** Cares only about *their* floor.
  *   **The Manager:** Cares about the *whole building's* average satisfaction.
  *   **The Scribe:** Writes numbers on the team whiteboard/paper.

  **Scoring:** No money. Teams earn "Reputation Points" (RP).
  *   Correct decision based on available info: +2 RP.
  *   Correct explanation of *why*: +1 RP.
  *   Winning team gets first choice of break-time snacks next week.

  ---

  ## 2. Round 1: The Confounder (35 Minutes)

  ### Step A: The Subgroup Data (10 mins)
  Hand out **Card A**. It shows data split by floor height.

  | Delivery Zone | UpStart (Hot/Total) | DownToEarth (Hot/Total) |
  | :--- | :---: | :---: |
  | **Upper Floors (4-6)** | 1 / 5 | 1 / 10 |
  | **Lower Floors (1-3)** | 4 / 5 | 15 / 20 |

  **Task 1 (The Commuter):** You work on Floor 5. Which van do you order from?
  *   *Math:* Compare 1/5 (20%) vs 1/10 (10%).
  *   *Answer:* UpStart.
  *   *Task 2 (The Commuter):* You work on Floor 2. Which van?
  *   *Math:* Compare 4/5 (80%) vs 15/20 (75%).
  *   *Answer:* UpStart.

  **Task 3 (The Manager):** You are buying the contract for the *whole building*. You don't know where people sit. Look at the **Total** performance.
  *   *Instruction:* "Combine the rows to find the Total Success Rate for each van."
  *   *Math Support:* Write this on the board:
      *   UpStart Total: $1+4$ Hot out of $5+5$ Total = **5/10**
      *   DownToEarth Total: $1+15$ Hot out of $10+20$ Total = **16/30**
  *   *Comparison:* To compare 5/10 and 16/30, make denominators match (30).
      *   UpStart: 15/30 (50%)
      *   DownToEarth: 16/30 (53%)
  *   *Decision:* DownToEarth has the better *overall* record.

  **The Trap:** Teams will feel conflicted. UpStart wins every floor, but DownToEarth wins the total. Ask them to commit to a choice for the Manager role *before* explaining why. Award points for consistency with the math they just did.

  ### Step B: The Reveal (5 mins)
  Ask teams: "How can UpStart be better on every floor, but worse overall?"
  Let them struggle for 2 minutes. Do not solve it yet.

  ### Step C: The Story (5 mins)
  Reveal the **Context Card**:
  *   **UpStart** is the "Hard Job Specialist." They take most of the difficult Upper Floor orders (5 out of 10 total jobs).
  *   **DownToEarth** is the "Lobby Loiterer." They take mostly easy Lower Floor orders (20 out of 30 total jobs).
  *   *Key Insight:* The "Floor" variable drives the success rate (higher = colder coffee), and it also drives which company gets the job.

  ### Step D: The Clinician vs. Administrator (15 mins)
  Lead the discussion to the core insight you requested.
  *   **Question:** "If you are on Floor 5, which table do you trust?"
      *   *Answer:* The Subgroup Table. The Total table lies to you because it includes data from floors you don't work on.
  *   **Question:** "If you are the Manager, and you assign orders randomly next year, which table predicts your success?"
      *   *Answer:* The Total Table (mostly). If you give jobs randomly, you will replicate the volume mix, so the Total Rate predicts your overall budget satisfaction.
  *   **Question:** "If you are the Manager, but you want *fairness* (ensure Floor 5 gets good coffee), which table?"
      *   *Answer:* Subgroup Table.

  **Debrief Terminology (Last 5 mins of Round 1):**
  Now you can use the words.
  *   "This reversal is called **Simpson's Paradox**."
  *   "The 'Floor' was a **Confounder**. It affected both the Success (height cools coffee) and the Choice (companies specialize)."

  ---

  ## 3. Round 2: The Selection Bias (25 Minutes)
  *(**INSTRUCTOR NOTE:** This is the first thing to cut if you run long. If you cut this, extend the Round 1 debrief to cover "Correlation vs Causation" using the instructor script below.)*

  ### Step A: Same Numbers, New Story (10 mins)
  Hand out **Card B**. It has the **exact same numbers** as Card A.
  *   UpStart: 1/5 (Upper), 4/5 (Lower), 5/10 (Total).
  *   DownToEarth: 1/10 (Upper), 15/20 (Lower), 16/30 (Total).

  **New Context:**
  *   **UpStart** is a charity service. They *accept* any order, including the difficult Upper Floors that other vans reject.
  *   **DownToEarth** is premium. They *reject* most Upper Floor orders because they are too hard. They only accept 10 Upper Floor jobs all year, whereas UpStart took 5. (Wait, the numbers show UpStart took 5, DownToEarth took 10).
  *   *Correction for Story:* DownToEarth is premium. They *choose* the easy jobs. UpStart is the budget option; they get stuck with the hard jobs because DownToEarth refused them.
  *   *Actually, look at the volumes:* UpStart did 5 Upper, 5 Lower. DownToEarth did 10 Upper, 20 Lower.
  *   *Revised Story:* DownToEarth is the "Incumbent." They have the contract for the Lobby (Lower). UpStart is the "Challenger" trying to win the Upper floors.
  *   *Better Story for Selection Bias:*
      *   **Hospital Scenario (Swap context for Round 2 to make bias clearer).**
      *   *Let's stick to Coffee to avoid confusion, but change the 'Why'.*
      *   **Story:** DownToEarth has a policy: "We don't go above Floor 3 unless it's an emergency." UpStart goes everywhere.
      *   Because DownToEarth avoids the hard jobs, their *Total* looks great. But if you force them to serve Floor 5, they will perform poorly (as shown in the subgroup row).

  **Task:** You are the Manager. You are considering forcing DownToEarth to serve the Upper Floors exclusively next year. Can you use their **Total** success rate (53%) to predict how they will do?
  *   *Answer:* **No.** The Total rate is inflated by the easy jobs they usually take. If you change their job mix, the Total rate becomes meaningless. You must use the Subgroup rate (10%).

  **Debrief:**
  *   In Round 1, the Total was useful for a random mix.
  *   In Round 2, the Total is dangerous because the groups were **Self-Selected**.
  *   "The table doesn't tell you *why* the groups are different sizes. You need the story."

  ---

  ## 4. Final Debrief & Mapping (15 Minutes)

  **Map their experience to the formal structure:**
  1.  **The Feeling:** "I felt cheated when the Total flipped." -> *That is the Paradox.*
  2.  **The Clinician (Commuter):** "I needed the row for my floor." -> *Conditional Probability. You know the value of the confounder.*
  3.  **The Administrator (Manager):** "I needed the Total." -> *Marginal Probability. You are averaging over the population.*
  4.  **The Caveat:** "Round 2 showed the Total could lie even to the Manager." -> *Causal Structure. If the group sizes aren't fixed (selection bias), pooling is dangerous.*

  **Instructor Script for Limitations (What the activity can't do):**
  "This activity shows you the *math* of the reversal. It cannot show you the *cause*. The numbers 1/5 and 1/10 look the same whether UpStart is a 'Specialist' (Round 1) or a 'Charity' (Round 2). You cannot find the truth in the spreadsheet. You have to go out into the world and ask: *Why are the group sizes different?* That is why evidence reading requires both math and storytelling."

  ---

  ## 5. Troubleshooting: What Goes Wrong

  **1. "The Math is Wrong" (10 mins in)**
  *   **Problem:** Students will try to average the percentages (20% + 80% / 2 = 50%) instead of pooling the totals.
  *   **Fix:** Pre-empt this. "When pooling, do not average the percentages. Add the Hot coffees, then add the Total coffees. Make a new fraction." Write the formula on the board: $\frac{H_1 + H_2}{T_1 + T_2}$.

  **2. "The Reversal is Too Small" (Round 1 Step A)**
  *   **Problem:** 50% vs 53% feels like a tie. They won't feel the paradox.
  *   **Fix:** Draw a pie chart on the whiteboard for the Totals. Shade in 15/30 vs 16/30. Visually, 16 is clearly bigger than 15. Emphasize: "UpStart lost. DownToEarth won. Direction matters, not just size."

  **3. "This is Fake Data" (Cynicism)**
  *   **Problem:** Adults might dismiss it as contrived.
  *   **Fix:** Agree with them. "Real data is messier. We made the numbers clean so you can see the mechanism. In the real world, you need a computer to find this, but the *question* you ask is the same: 'Who is in this group, and why?'"

  **4. Time Overrun (The biggest risk)**
  *   **Cut List:**
      1.  **Cut Round 2 entirely.** Spend the extra time discussing Round 1's "Manager vs. Commuter" distinction. This is the more valuable lesson for general evidence reading.
      2.  **Skip the "Common Denominator" math.** Just tell them: "5/10 is 15/30. 15 is less than 16. DownToEarth wins." Don't make them do the conversion themselves.
      3.  **Reduce Team Count.** If 14 people is too chatty, merge into 3 large teams.

  ## 6. Materials Checklist
  *   **Handout 1:** The Subgroup Table (Blank for them to fill in decisions).
  *   **Handout 2:** The Context Cards (One for Round 1, One for Round 2).
  *   **Whiteboard:** Pre-drawn empty tables to fill in as a class.
  *   **Tokens:** 20 poker chips or sticky notes for scoring.

  ## 7. Instructor's Cheat Sheet (The Numbers)
  *Keep this visible to you.*

  | Group | UpStart (A) | DownToEarth (B) | Winner |
  | :--- | :---: | :---: | :---: |
  | **Upper (Hard)** | 1/5 (20%) | 1/10 (10%) | **UpStart** |
  | **Lower (Easy)** | 4/5 (80%) | 15/20 (75%) | **UpStart** |
  | **TOTAL** | **5/10 (50%)** | **16/30 (53.3%)** | **DownToEarth** |

  *Comparison:* 5/10 = 15/30. 15 < 16.
  *Why:* DownToEarth did 20 easy jobs. UpStart only did 5 easy jobs. The easy jobs boost the total score disproportionately.
