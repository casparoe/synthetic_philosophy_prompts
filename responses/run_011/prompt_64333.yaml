prompt: |-
  So me and three others run a little hardship fund in our town — proper ex-mining area, about 14,000 people, one high street with a pound shop and two bookies in it. The pot's around nine grand a year: a donation from a bloke who grew up here and did alright for himself down south, plus whatever the Christmas bring-and-buy raises. We get three or four applications a month, mostly between £150 and £700 — a washing machine, a car repair so someone can keep a shift pattern going, dental work the NHS can't get them near in time, a deposit to move out of somewhere awful. We meet fortnightly on a Tuesday and we've got maybe a quarter of an hour per case, because there's also the minutes and the bank forms to do afterwards. Two of us are ex-council, one's a retired nurse who'd give away the furniture, one's the treasurer who counts every penny, and I'm the one who does the website. Nobody's got any training in welfare or benefits or anything, and we've slowly realised we're basically deciding by gut and then writing down a reason afterwards. Two of the four have to agree, and the treasurer won't release money without a written reason, so the reason we make up is the thing that actually ends up on file.

  Here's what I've been chewing on. What we seem to be trying to do is help people with bad things that happened *to* them rather than bad things they went and did themselves — and I found out that distinction has proper names in philosophy, something like brute luck and option luck, and that people have been arguing about it for decades, including that it's cruel because it lets you walk away from anyone who made a daft choice. I don't want an essay about that, and please don't give me a reading list or any references, I won't read them. What I want is a procedure we could actually run on a Tuesday night: the questions we ask in order, what counts as a good enough answer to each one, the point where the procedure just stops and the answer is no, and the points where it isn't a factual question at all and has to be handed over to us as humans making a value call. Short enough that we could laminate it, plus an even shorter emergency version, because sometimes it's a same-day phone call between meetings and two of us have to decide without the other two. And it's got to work with what we actually have, which is a form someone filled in at the library and one phone call — we can't cross-examine people, and honestly we don't want to, because half these questions would be us sitting in judgement of somebody's whole life. One more wrinkle: last year we started asking folk to put a bit back in the pot when they're on their feet again, and that's caused a row — tell me whether your procedure needs to know about that or whether we should park it.

  Three of ours to run it through. First, a lad of 23 who took out a loan at a shocking rate on a car because there's no bus at all to the industrial estate where he'd got a warehouse job; the job went after six weeks, he's behind now, and the car's about to be taken — half the panel will say that was his choice and half will say he never had one. Second, a woman of 58 who gave up work eleven years ago to look after her mam, her mam died in the spring, and she's got no pension, no recent references and no transport; she's asking for help with the funeral and the rent arrears. She obviously chose that, but nobody in the room is going to call it a gamble. Third, a bloke wanting £540 for a tooth that's been rotting since March; he smokes and he drinks, and one of us will definately say he did that to himself, though our own written rules don't mention either. Run all three through it and be straight with me about which one the procedure gets wrong, or says no to when we all know we'll pay it anyway — I'd much rather hear that from you than find out in the room with the person's form on the table. And please mark every step where the procedure only looks like it's deciding something but is really just one of us deciding in a posher way, and say whether two sensible people following it word for word could still end up disagreeing, because at the moment they do.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **Context:** A small, informal hardship fund in an ex-mining town (pop. 14k).
      *   **Resources:** ~£9k/year pot. 4 volunteers (ex-council, retired nurse, treasurer, website guy).
      *   **Process:** Fortnightly meetings, ~15 mins/case. Applications via form + one phone call. No professional welfare training.
      *   **Current Problem:** Decisions made by "gut" then rationalized afterwards. Tension over "brute luck" (things happening *to* you) vs. "option luck" (choices you made).
      *   **Goal:** A concrete, laminatable procedure (flowchart-style questions) + an emergency version.
      *   **Constraints:** No essays, no reading lists, no references. Must acknowledge where human judgment overrides the procedure. Must address the "pay it back" row.
      *   **Test Cases:**
          1.  23yo lad, high-interest car loan for job, job lost, car being repossessed.
          2.  58yo woman, cared for mom 11 years, mom died, no pension/transport, needs funeral/rent help.
          3.  Bloke, £540 dental work, smokes/drinks, tooth rotting since March.
      *   **Specific Requirements:** Mark steps where it *looks* objective but is actually subjective. Acknowledge if two sensible people could disagree. Be honest about where the procedure fails vs. human instinct.

  2.  **Deconstruct the Ethical/Practical Tension:**

      *   The user identifies the "brute luck vs. option luck" problem but rightly notes that strict adherence is cruel.
      *   The fund's reality: Limited money, high need, volunteer capacity, desire to be helpful but responsible.
      *   The "Pay Back" Row: This introduces a contractual/expectation element that might conflict with immediate need.
      *   The Core Conflict: Objective criteria (can we verify this?) vs. Subjective values (do they *deserve* this?).

  3.  **Drafting the Procedure (The "Tuesday Night Protocol"):**

      *   *Structure:* Needs to be sequential. Stop/Go logic.
      *   *Tone:* Practical, empathetic, clear. Not bureaucratic jargon.
      *   *Key Filters:*
          1.  Eligibility (Town resident? Within budget?)
          2.  Urgency/Impact (Will this stop a disaster?)
          3.  The "Choice" Question (Reframed from "Was it their fault?" to "Is there a viable alternative?")
          4.  Sustainability (Will this fix it for more than a week?)
          5.  The "Human Override" (Where the gut check happens explicitly).

      *   *Addressing the "Pay Back" Row:* It shouldn't be a *condition* for help, especially in emergencies. It creates a barrier for the most desperate. It should be optional/invited, not enforced. I need to advise parking it as a *requirement* but keeping it as a *hope*.

      *   *Marking Subjectivity:* I need to explicitly label steps where the "rule" is actually a mask for values.

  4.  **Running the Test Cases:**

      *   *Case 1 (Car Loan Lad):*
          *   Eligibility: Yes.
          *   Urgency: High (lose car = lose ability to work).
          *   Choice: He took the loan. But transport was non-existent.
          *   Sustainability: If no job, can he keep the car?
          *   *Verdict:* Procedure might flag the "choice" of the loan. Human instinct says "no bus, needed job."
      *   *Case 2 (Carer Woman):*
          *   Eligibility: Yes.
          *   Urgency: High (homelessness/funeral).
          *   Choice: Cared for mom. Not a "gamble."
          *   Sustainability: Rent arrears solved, but long-term income?
          *   *Verdict:* Procedure should pass this easily. It's classic "brute luck" (family duty).
      *   *Case 3 (Dental Bloke):*
          *   Eligibility: Yes.
          *   Urgency: Pain/Health.
          *   Choice: Smoking/drinking/delay.
          *   Sustainability: Fixes the tooth.
          *   *Verdict:* Procedure might block on "self-inflicted." Human instinct (and the nurse on the panel) will likely overrule.

  5.  **Refining the Procedure (Iterative Process):**

      *   *Initial thought:* Make a strict checklist.
      *   *Correction:* The user admits they *want* to use human judgment but want structure to make it fair. So the procedure must *invite* the judgment, not hide it.
      *   *The "Stop" Point:* Needs to be clear. If it doesn't prevent a crisis, it's not hardship fund money.
      *   *The "Choice" Filter:* Instead of "Did they cause this?", ask "Did they have a reasonable alternative?" This shifts from blame to capacity.

  6.  **Addressing the "Pay Back" Question:**

      *   If you make repayment a condition, you turn a grant into a loan. The poorest can't risk a loan.
      *   Advice: Park it as a *condition*. Keep it as a *conversation*. "If you can, great. If not, no worries." Don't let it drive the decision.

  7.  **Finalizing the Output Structure:**

      *   **Introduction:** Acknowledge the difficulty.
      *   **The "Pay Back" Question:** Deal with this first as it affects the rules.
      *   **The Main Procedure (Laminated Version):** Step-by-step with "Subjectivity Alerts."
      *   **The Emergency Version:** Condensed for phone calls.
      *   **The Test Cases:** Walkthrough of the three scenarios.
      *   **The Honest Truth:** Where the procedure fails and why that's okay.

  8.  **Self-Correction/Review during drafting:**

      *   *Check:* Did I include references? *No.*
      *   *Check:* Is it too long? *Keep it tight.*
      *   *Check:* Did I mark the subjective parts? *Yes, use [JUDGMENT CALL] tags.*
      *   *Check:* Did I answer the "two sensible people disagree" question? *Yes, explicitly.*
      *   *Check:* Is the tone right? *Needs to be respectful of their volunteer work, not condescending.*

      *(Self-Correction on Case 1)*: The car loan is tricky. If we pay it off, does he keep the car? Or does the finance company just take the cash? The procedure needs to ask "Will this money actually solve the problem?"
      *(Self-Correction on Case 3)*: The dental case. Smoking/drinking is irrelevant to the immediate pain. The procedure should filter out "lifestyle judgments" unless they directly prevent the solution working.

  9.  **Final Polish:** Ensure the distinction between "Brute Luck" and "Option Luck" is handled practically (i.e., "Reasonable Alternative" test) without using the philosophical terms.

      *(Final thought on the "Pay Back" row)*: The user asked if the procedure needs to know about it. My advice is: The procedure should ignore it for *approval*, but the admin can track it separately. Don't let it block the 'Yes'.

      *(Final thought on Disagreement)*: Two sensible people *will* disagree. The procedure can't fix that. It can only make the disagreement honest. I need to state that clearly.

  10. **Drafting the response.** (Proceeding to generate output based on these thoughts).
answer: |-
  This is a heavy load you're carrying, and you're right to be wary of turning yourselves into judges of character. You aren't a court; you're neighbours with a pot of cash. The philosophy you stumbled on (brute vs. option luck) is real, but in a room on a Tuesday night, it usually just translates to "Do we like them?" or "Do we blame them?"

  Here is the straight answer on the "pay back" row first, then the procedure, then the test cases.

  ### The "Pay Back" Question
  **Park it as a condition.**
  If you make repayment a requirement for getting help, you are no longer a hardship fund; you are a predatory lender with nicer stationery. The people who need you most are the least likely to be able to promise future money. It creates shame, and it stops people applying.
  *   **The Fix:** Keep the *ask*, drop the *rule*. You can print "We invite recipients to contribute back when they can" on the award letter, but it must never be a tick-box for approval. If the procedure below says "Yes," the money goes out regardless of whether they promise a penny back. Do not let this row influence the decision matrix.

  ---

  ### The Tuesday Night Protocol (Laminated Version)
  *Keep this on the table. Work through 1 to 5. If you hit a STOP, the answer is No. If you pass all 5, the answer is Yes, subject to the Budget Check.*

  **1. The Residency & Budget Check**
  *   **Q:** Do they live in the postcode area? Is the amount requested within our single-case limit (e.g., £750)?
  *   **Stop:** If No to either.
  *   **Note:** This is factual. No disagreement here.

  **2. The Crisis Test**
  *   **Q:** If we do *nothing*, does a specific, serious harm happen within 14 days? (e.g., eviction, repossession, loss of job, untreated acute pain).
  *   **Stop:** If the answer is "They'll be uncomfortable" or "It would be nice to have."
  *   **[JUDGMENT CALL]:** Defining "serious harm." One person's "stress" is another's "crisis."
  *   **Disagreement Risk:** Medium. The nurse will spot health risks; the ex-council will spot housing risks. Listen to the specialist.

  **3. The "Reasonable Alternative" Test (The Luck Filter)**
  *   **Q:** Did the applicant have a safe, accessible alternative to getting into this situation *at the time*?
  *   **Pass:** If the answer is "No" (e.g., no bus, no NHS dentist, no other family).
  *   **Stop:** If the answer is "Yes, they chose a more expensive/risky option when a safe one existed."
  *   **[JUDGMENT CALL]:** **This is the danger zone.** This is where you decide what counts as a "reasonable" choice.
  *   **Disagreement Risk:** High. This is where the "Car Loan Lad" lives or dies.

  **4. The Solution Viability**
  *   **Q:** Will this money actually fix the problem for at least 3 months, or just kick the can?
  *   **Stop:** If paying this bill guarantees they will be in the same hole in 4 weeks (e.g., paying rent for a house they can't afford long-term).
  *   **[JUDGMENT CALL]:** Predicting the future.
  *   **Disagreement Risk:** Medium.

  **5. The Human Override**
  *   **Q:** Ignoring the rules for a second, if this was our sister/brother, would we want someone to help them?
  *   **Action:** If the procedure says "No" but the room unanimously says "We can't let this happen," you may override **once** per quarter. Record the reason as "Compassionate Override."
  *   **[JUDGMENT CALL]:** All of this.
  *   **Disagreement Risk:** High. This is the safety valve.

  **6. Final Budget Check**
  *   **Q:** Do we have the funds this month?
  *   **Action:** If Yes, approve. If No, waitlist.

  ---

  ### The Emergency Protocol (Phone Version)
  *For same-day decisions between two trustees. Both must agree.*

  1.  **Harm:** Will something irreversible happen in 48 hours if we don't pay? (Yes/No)
  2.  **Alternatives:** Is there literally nowhere else they could have gone? (Yes/No)
  3.  **Fix:** Will this money stop the harm completely? (Yes/No)
  4.  **Gut:** Are we both comfortable sleeping on this decision? (Yes/No)

  *If any answer is No, you decline. If all Yes, approve up to £300. Anything higher waits for the full meeting.*

  ---

  ### Running Your Three Cases

  Here is where the procedure meets the road. I have marked where the protocol struggles.

  #### Case 1: The 23-Year-Old Lad (Car Loan)
  *   **Crisis Test:** **Pass.** Losing the car means losing the ability to work/get to interviews. Serious harm.
  *   **Reasonable Alternative:** **FAIL/STOP.** Strictly speaking, he chose the loan. He chose the car. A strict reading says "He had an alternative: don't take the job/don't buy the car."
  *   **Viability:** **FAIL/STOP.** If he has no job *now*, paying the arrears doesn't stop the car being taken next month.
  *   **Human Override:** **PASS.** This is where you will use it. The town has no bus. He tried to work. The "choice" was illusory.
  *   **Verdict:** The procedure says **No**. You will likely vote **Yes**.
  *   **Why:** The procedure punishes the *method* of survival (high-interest loan) rather than the *need* (transport).
  *   **Fix:** Tweak Question 3. Change "Did they have an alternative?" to "Was the choice made to secure income or safety?" If yes, pass them.

  #### Case 2: The 58-Year-Old Carer (Funeral/Rent)
  *   **Crisis Test:** **Pass.** Eviction and unburied dead.
  *   **Reasonable Alternative:** **Pass.** Caring for a parent is not a "gamble." It is a social good. She had no alternative if she loved her mother.
  *   **Viability:** **Partial Pass.** Rent arrears are cleared, but she has no income. However, funeral costs are one-off.
  *   **Human Override:** Not needed.
  *   **Verdict:** The procedure says **Yes**. You will vote **Yes**.
  *   **Why:** This is "Brute Luck" in its purest form. Life happened *to* her. The procedure handles this well.

  #### Case 3: The Dental Bloke (Smoker/Drinker)
  *   **Crisis Test:** **Pass.** Rotting tooth is acute health harm.
  *   **Reasonable Alternative:** **FAIL/STOP.** He could have gone to the NHS dentist in March. He smokes and drinks, which contributed to the decay. A strict reading says "Self-inflicted."
  *   **Viability:** **Pass.** Tooth gets fixed.
  *   **Human Override:** **Pass.** The nurse on your panel will rightly point out that dental phobia or cost often drives people away from the NHS until it's too late. Lifestyle judgments shouldn't block pain relief.
  *   **Verdict:** The procedure says **No** (due to Alternative Test). You will vote **Yes**.
  *   **Why:** Because you are not a health insurer. You are a hardship fund. Pain is pain.
  *   **Fix:** Add a note to Question 3: "Do not penalise for health behaviours (smoking/diet) unless they directly prevent the solution working."

  ---

  ### The Honest Truth About Disagreement

  You asked: *"Could two sensible people following it word for word still end up disagreeing?"*

  **Yes. Absolutely.**

  Specifically at **Question 3 (Reasonable Alternative)** and **Question 5 (Human Override)**.

  *   **Why:** Because "Reasonable" is a value, not a fact. To the Treasurer, a high-interest loan is always unreasonable. To the Ex-Council member, a high-interest loan in a town with no buses is a survival tactic. Both are sensible. Both are looking at the same fact.
  *   **The Procedure's Limit:** The procedure cannot remove the burden of choice from your shoulders. It cannot make the decision "objective." What it *does* do is force you to admit *why* you are disagreeing.
      *   Instead of: "I don't think he deserves it."
      *   You say: "I am voting No on Question 3 because he had an alternative."
      *   The other says: "I am voting Yes on Question 3 because the alternative was starvation."

  **Where the procedure gets it wrong:**
  It will try to block **Case 1 (The Lad)** and **Case 3 (The Teeth)**.
  *   **Case 1** fails because the procedure assumes financial choices are made in a vacuum. They aren't; they're made under duress.
  *   **Case 3** fails because the procedure invites moral judgment on health, which you said you don't want to do.

  **Recommendation:**
  Before you laminate it, amend **Question 3** slightly.
  *   *Old:* "Did the applicant have a safe, accessible alternative to getting into this situation at the time?"
  *   *New:* "Did the applicant have a safe, accessible alternative **given their resources and the local options at the time**?"

  That addition ("given their resources and local options") saves the Lad (no bus) and the Teeth (NHS wait times/cost fear). It keeps the Carer safe. It acknowledges that a "choice" made with £50 in the bank isn't the same as a "choice" made with £5,000.

  **Final Word:**
  Two of you will still disagree sometimes. That is fine. Your rule is "Two of the four have to agree." If the procedure says No, but two of you feel strongly Yes, use the **Human Override**. Write it down. "Compassionate Override: Local transport failure." That goes on the file instead of a made-up reason. It's honest, and it protects you when the Treasurer asks why the rules were bent.

  You're doing good work. Don't let the rules stop the kindness, just make sure the kindness doesn't bankrupt the pot.
