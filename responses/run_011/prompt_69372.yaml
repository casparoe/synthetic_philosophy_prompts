answer: |-
  1. **The Scenario**
  During a federal safety inspection, an engineer stands under sworn testimony. Her counsel has entered a standing instruction on the record: the witness will answer only the specific question asked, volunteering no additional data or corrections. Both inspector and counsel acknowledge this limitation. The inspector asks, "Did the pressure valve engage during the spike?" The engineer, mechanically adhering to counsel's instruction without personal stake in the outcome, replies, "The sensor logged a pressure event." She believes this literal claim is true; the sensor did log the event. She knows the sensor is known to glitch, but volunteering that fact would violate the instruction. She holds no intention regarding what the inspector infers. The inspector, however, records the conclusion: The engineer implied the valve engaged. In reality, the valve stuck; the sensor glitched.

  2. **The Derivation**
  The hearer reasons: (1) The speaker is participating in a talk exchange (Inspection). (2) Therefore, the Cooperative Principle applies. (3) The literal answer is less informative than required (Maxim of Quantity). (4) Unless the speaker is uncooperative, she implies the valve engaged. (5) Therefore, she implies the valve engaged.
  **Break Point:** Step (2) is unlicensed. Given specification (b), the speaker has publicly opted out of the informative purpose required by Quantity. The derivation relies on the assumption that the institutional purpose overrides the public opt-out, but Grice's CP rests on participant acceptance, which is explicitly withheld here. The machinery generates the inference only by ignoring the setup.

  3. **The Diagnostics**
  *   **Cancellability:** Passes. ("...but the sensor is faulty" is consistent).
  *   **Nondetachability:** Passes. ("The gauge registered" yields the same inference).
  *   **Calculability:** Fails. The calculation requires assuming CP observance, which contradicts the public opt-out.
  *   **Nonconventionality:** Passes. The meaning is not encoded in "sensor logged."
  *   **Indeterminacy:** Fails. The inference is determinate (valve engaged), unlike typical flouting cases.
  *   **Verdict:** The tests mimic standard implicature, but Calculability reveals the fracture: the reasoning uses a premise (Cooperation) known to be false in this context.

  4. **The Two Readings**
  On the **psychological reading**, this is not implicature. The speaker lacks the requisite intention to induce belief in the hearer; she is a rule-following conduit. On the **normative reading**, this is implicature. The hearer is entitled to hold the speaker to the institutional norm of truth-finding, regardless of individual strategy. The case favors the normative reading. The CP functions here not as a description of mental states, but as a warrant for attribution: if you speak in this forum, you are accountable for what is reasonably inferred, even if you disclaim cooperation. The institutional purpose overrides the individual's adopted strategy.

  5. **The Repair**
  Relevance Theory presumes only that the utterance is worth processing. The hearer thinks: "Why mention the sensor unless it confirms the valve worked?" The cognitive effect (valve engaged) justifies the processing effort. This derives the same content without invoking the Cooperative Principle or speaker intention. It handles the exchange better because it locates the mechanism in the hearer's search for cognitive effects, not the speaker's commitment to cooperation. The opt-out becomes irrelevant; the utterance exists, and the hearer extracts the maximal relevant implication available.

  6. **The Load-bearing Feature**
  The public opt-out (b) is the load-bearing feature. It severs the link between utterance and cooperative intention. If removed, the case collapses into standard Gricean implicature where psychological intent is plausible. If the speaker (d) is given insinuating intention, it also collapses into standard implicature. The tension exists *only* because the inference persists despite the public suspension of the norm that usually licenses it. This isolation proves the inference arises from hearer-side attribution, not speaker-side design.

  7. **The Defense**
  A Gricean might argue the hearer is engaging in strategic reasoning about a rule-follower, not interpreting communication. The inspector treats the utterance as evidence, not meaning. This keeps the case inside a framework of rational action rather than semantics. **Cost:** This abandons the core Gricean claim that implicature is essentially the recognition of communicative intention. It reduces the CP to a general heuristic for behavior prediction, stripping it of its specific power to explain *meaning* rather than mere *causal inference*. The principle becomes a theory of decision-making, not communication.
