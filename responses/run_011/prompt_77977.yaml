answer: |-
  The Eyre Affair presents the ultimate stress test for John Stuart Mill's liberal imperialism. To understand why Mill led the charge to prosecute Governor Eyre, you have to reconcile the author of *On Liberty* with the man who spent thirty-five years writing despatches for the East India Company. It is easy to view these as contradictory lives—the libertarian versus the bureaucrat—but Mill saw them as a single project. The question is whether Eyre's actions fell within the narrow corridor of legitimacy Mill had constructed for colonial rule, or whether they blew the corridor up entirely.

  Mill's doctrine does not predict Eyre; it predicts Mill's prosecution of him. However, the episode exposes the fragility of the doctrine's enforcement mechanisms.

  To see why, we must look at the specific conditions Mill placed on "benevolent despotism." In *On Liberty*, Mill argues that despotism is a legitimate mode of government for dealing with "barbarians," provided the end is their improvement. This is the clause Carlyle and the Eyre Defence Committee leaned on: the Jamaican population was not yet capable of self-government, and the rebellion threatened a return to savagery; therefore, absolute power was necessary to restore order.

  But Mill's despotism was never meant to be arbitrary. In *Considerations on Representative Government*, he clarifies that rule over dependencies must be exercised by a free state, bound by the rule of law. The logic is pedagogical: the purpose of imperial rule is to teach the colony the habits of civilization, the primary habit being obedience to law rather than to men. If the ruler acts outside the law, he teaches the ruled that law is merely a tool of power. This undermines the very "improvement" that justifies the despotism in the first place.

  This is where the specifics of the Gordon execution become decisive for Mill. George William Gordon was not a rebel caught in the heat of battle in Morant Bay. He was an elected member of the House of Assembly, arrested in Kingston where civil courts were functioning, and transported to a martial law zone to be hanged after a two-day sham trial. For Mill, this violated the administrative contract. Even if Jamaica was a dependency requiring tutelage, it possessed institutions (the Assembly) that signaled a degree of political capacity. By bypassing civil courts to execute a legislator, Eyre didn't just punish a crime; he dismantled the ladder of legal progress Mill believed the Empire was supposed to be building.

  Therefore, the prosecution is consistent with Mill's theory. It relies on the rule-of-law constraint that even a benevolent despot must obey. The "improvement clause" does not grant a license for atrocity; it mandates a specific *kind* of order—one that moves the subject toward liberty. Eyre's order was static, maintained by terror, which Mill viewed as retrograde.

  However, this is where Fitzjames Stephen's position illuminates the crack in Mill's armor. Stephen, the Jamaica Committee's own counsel, argued that Eyre was legally guilty of murder but morally justified. This distinction relies on a positivist separation of law and morality: the law says one thing, but the emergency demanded another. Mill cannot accept this split. For Mill, morality is consequentialist and tied to the long-term development of human liberty. An act that undermines the rule of law is, by definition, morally wrong because it damages the conditions necessary for future happiness and freedom. To Mill, Eyre was legally guilty *and* morally guilty.

  Yet, the Eyre Affair exposes a vulnerability in Mill's doctrine that Stephen identified and Mill could not quite solve. Mill's system relies on the "civilized" metropole to act as the guardian of the colony's interests. The "improvement clause" only bites if the audience back home cares about the improvement. In this case, a significant portion of the British intellectual elite—Dickens, Tennyson, Ruskin—sided with Eyre. They viewed the colony not as a ward to be improved, but as a possession to be kept.

  This suggests that Mill's "improvement clause" is politically inert without a sympathetic metropolitan public. If the home audience views the colony as fundamentally "other"—as Carlyle did, viewing the Jamaican peasants as lazy and in need of the lash—then the moral constraint vanishes. The doctrine assumes a shared rationality between the ruler and the scrutinizer back home. When the scrutinizers (the Defence Committee) believe that "niggers" (as Carlyle called them) are not owed the same legal protections as Englishmen, the check on imperial power fails. Mill's prosecution was an attempt to force the British public to live up to their own principles, but the failure of the prosecutions proved that those principles did not extend as far as Mill thought.

  The specter of 1857 is the final, complicating layer. Eyre defended himself by invoking the Indian Mutiny, implying that Jamaica was on the brink of a similar existential threat to British rule. This struck close to home for Mill, whose career at the East India Company ended precisely because of the Mutiny and the subsequent abolition of Company rule. Mill knew the argument well: that military necessity trumps legal niceties in the face of rebellion.

  But Mill's experience with the EIC likely hardened his resolve against this justification. He had spent decades trying to codify Indian law to replace arbitrary military power with bureaucratic regularity. To Mill, the "Indian style" response—martial law, collective punishment, summary execution—was the disease, not the cure. Eyre was importing the worst habits of Company rule into a British colony that had a constitution. If Mill allowed Eyre to get away with it, he was admitting that the British Constitution was elastic enough to stretch to Jamaica and break.

  So, does the episode suggest the improvement clause only works when the violence embarrasses the audience? Largely, yes. Mill's theory provides the vocabulary to condemn Eyre, but it lacks the political machinery to enforce that condemnation against a popular wave of racialized authoritarianism. The doctrine assumes that the "free state" ruling the dependency is motivated by a universalist utilitarianism. The Eyre Affair revealed that the free state was often motivated by particularist nationalism and racism.

  Mill's prosecution of Eyre was an attempt to police the boundary between liberal imperialism and illiberal tyranny. He lost the legal battle, but he clarified the philosophical stakes. He demonstrated that for a liberal, the *method* of rule is as important as the *outcome*. You cannot create free subjects through unfree methods. But the episode also served as a grim warning: without a metropolitan conscience willing to apply its own standards universally, the "civilizing mission" is just a phrase waiting to be discarded when the drums of war start beating. Mill's theory could explain why Eyre was wrong, but it could not stop the British public from deciding that Eyre was, in fact, their kind of man.
