answer: |-
  You have identified a specific rhetorical topology that doesn't have a single, universally recognized name in logic, though it is a composite of several known phenomena in political theory and historiography. The closest existing theoretical concept is the **"Empty Signifier"** (a symbol that holds no fixed content but unifies a group by opposing what it is not), but that term misses the crucial *temporal* deception you've spotted: the claim that the changing content was *always* there.

  Here is the carving of the thing you are seeing.

  ### The Mechanism: Negative Definition + Teleological Time

  The structure relies on two engines working in tandem:

  1.  **Negative Definition (The Foil):** The content of the category is not determined by a positive core (e.g., "We believe X"), but by a negative boundary ("We are *not* Them"). Since "Them" changes (Nazis in the 40s, Communists in the 70s, Terrorists in the 00s), the definition of "Us" must shift to maintain the contrast.
  2.  **Teleological Time (The Deception):** To hide this shift, the argument treats history as a straight line leading inevitably to the present. Current values are projected backward as the "true intent" of the past, while past values that contradict the present are treated as "errors" or "betrayals."

  This creates a category that is **functionally fluid but rhetorically fixed.**

  ### Distinguishing from the Near-Misses

  You are correct that the standard fallacies don't quite fit. Here is the precise differentiation:

  **1. vs. No True Scotsman (NTS)**
  *   **NTS:** Protects a *universal rule* by excluding counter-examples. ("No Scotsman puts sugar on porridge." "Angus does." "Angus is no *true* Scotsman.")
  *   **Your Phenomenon:** Protects a *group identity* by redefining the *history*. It doesn't just exclude the counter-example (slavery); it re-categorizes the counter-example as an "accident" rather than an "essence." NTS is static defense; this is dynamic drift disguised as stasis.
  *   **The Edge:** If they admitted, "Our values have evolved," it would not be this. The claim of *continuity* is the key differentiator.

  **2. vs. Motte-and-Bailey**
  *   **Motte-and-Bailey:** Requires two distinct positions: a defensible one (Motte) and an ambitious one (Bailey). The arguer swaps between them when challenged.
  *   **Your Phenomenon:** There is only *one* claimed position ("Western Values"), but the *content* of that position silently updates. There is no retreat to a safe core because the core itself is replaced.
  *   **The Edge:** If they said, "Strictly speaking, Western Values mean Rule of Law (Motte), but ideally they mean Christianity (Bailey)," that would be M&B. Instead, they say "Western Values *are* Christianity" (1940) and later "Western Values *are* Secularism" (1990), insisting both are the same eternal truth.

  **3. vs. Self-Sealing Definition**
  *   **Self-Sealing:** A definition that cannot be falsified because any evidence against it is interpreted as evidence for it.
  *   **Your Phenomenon:** It is self-sealing, but specifically *historical*. It doesn't just block falsification; it *digests* falsification to update the definition. It absorbs the contradiction (e.g., "Non-Westerners have markets too") by adding a qualifier ("...but not as an *organizing principle*") that moves the goalpost without admitting the move.
  *   **The Edge:** A self-sealing definition usually stays rigid ("All behavior is selfish"). This definition stays fluid while claiming rigidity.

  ### The Coinage: "Retrospective Essentialism"

  If you need a term to drop into a comment thread that captures the mechanics without sounding like academic jargon, I recommend **"Retrospective Essentialism."**

  *   **Definition:** The practice of deciding what a tradition's "essential values" are *today*, based on current contrasts, and then projecting that definition *backward* in time as if it were an inherited constant.
  *   **How to use it:** "You're arguing from **Retrospective Essentialism**. You're taking values we hold *now* because of *current* conflicts, and pretending they were the fixed core of the tradition all along. The list changes whenever the enemy changes, but you treat it like an inheritance."
  *   **Colloquial Variant:** **"The Moving Essence."** ("That's a Moving Essence argument—the target is fixed in time but the content moves.")

  ### Boundary Cases (What This Is Not)

  To ensure you don't overapply the label, here are cases that look similar but lack the specific configuration:

  1.  **Living Constitutionalism / Doctrinal Development:** A religious or legal tradition that *admits* its interpretation changes. ("We used to think X, but we now understand Y better.") This is **not** Retrospective Essentialism because it acknowledges the drift.
  2.  **Brand Pivot:** A company changing its values statement. ("We used to be about oil, now we're about green energy.") This is **not** it because there is no claim of eternal continuity or historical inevitability.
  3.  **Whig History:** Interpreting the past as a march of progress toward the present. This is a *component* of Retrospective Essentialism, but Whig History alone doesn't require the *negative definition* (the foil). You can have Whig History without the two-directional immunity.

  ### Bonus Question 1: The Two-Directional Immunity

  **It is one phenomenon.**

  It is a single logical move: **The Essence/Accident Toggle.**
  In Aristotelian logic, an "essence" is what makes a thing what it is; an "accident" is a feature it happens to have but isn't defined by. This rhetoric works by toggling the classification of historical facts based on utility:
  *   **Internal Negative (Slavery):** Toggled to **Accident**. ("This happened, but it wasn't *really* us.")
  *   **External Positive (Non-Western Markets):** Toggled to **Accident**. ("They had this, but it wasn't *really* their core.")
  *   **Internal Positive (Free Speech):** Toggled to **Essence**. ("This is who we are.")
  *   **External Negative (Authoritarianism):** Toggled to **Essence**. ("This is who they are.")

  The immunity works because the criteria for "Essence" are never stated; they are implied by the current contrast.

  ### Bonus Question 2: Real vs. Imaginary Foils

  **It matters significantly.**

  *   **Real/Current Foils (Slow Churn):** When the enemy is a concrete geopolitical rival (e.g., The USSR), the definition stabilizes. You can't claim "State Control" is a Western Value while the USSR exists, because the contrast is material. The list hardens.
  *   **Imaginary/Historical Foils (Fast Churn):** When the enemy is abstract ("Tyranny," "Barbarism," "The Past"), the definition becomes highly volatile. Since "Tyranny" can be redefined to mean anything the current generation dislikes, the "Western Values" list can be completely rewritten without triggering cognitive dissonance.

  The churn rate you noticed is fastest when the foil is **conceptual** rather than **material**. When the foil is a living rival, the definition is constrained by reality. When the foil is a historical ghost, the definition is constrained only by the imagination of the writer.
