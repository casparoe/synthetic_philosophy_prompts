answer: |-
  ### The Case: The Breakroom Tables of Yard 4

  **Setting.** The night-shift welders at the Kowloon Drydock, a group of fourteen men working a specific hull section. They share a single ten-minute break every four hours in a cramped canteen with two identical round tables, Table North ($R$) and Table South ($R^*$). The tables are equidistant from the food counter and the exit; seating at one offers no physical advantage over the other. The men are neither saints nor strategists; they are tired workers who want to sit where their mates sit to pass tools and cigarettes efficiently.

  **Phase One.** For the first year, the crew sits at Table North. This began when the first foreman sat there; the rest followed to hear his instructions. Now the foreman is gone, but the pattern remains. Everyone sits North. Everyone expects everyone else to sit North. If, counterfactually, the crew had started sitting South, they would prefer to sit South (to maintain coordination). There is no sentiment attached to the tables; they are fungible. The regularity is sustained purely by the mutual expectation of conformity in a coordination problem.

  **Phase Two.** A rival yard down the harbor, with whom the Kowloon crew has a longstanding labor dispute, habitually sits at Table South during joint port meetings. During a heated contract negotiation, a Kowloon welder accidentally sits at Table South and is mocked by the rivals as "eating from the management plate." The incident becomes a founding story for the shift's solidarity. Henceforth, Table North is "Our Table," and Table South is "The Scab Table." Everyone still sits North. Everyone still expects everyone else to sit North. The physical utility of the tables remains identical. However, sitting South now incurs social sanctions (silence, withheld cigarettes) and internal shame. Crucially, if counterfactually everyone else sat South, a given welder would *not* prefer to join them; he would prefer to sit alone at North rather than be part of a group that "sits like rivals." The regularity is as stable as before, but the preference structure has shifted.

  ***

  ### 1. The Verdict: Clause by Clause

  Lewis defines a convention as a regularity $R$ in a population $P$ satisfying five conditions (summarized from *Convention*, p. 78).

  **Phase One Verdict: Convention.**
  *   **(1) Regularity:** Everyone conforms to $R$ (Table North). **Met.**
  *   **(2) Expectation:** Everyone expects others to conform to $R$. **Met.**
  *   **(3) Preferences:** Everyone has similar preferences over action profiles. **Met.**
  *   **(4) Conditional Preference for $R$:** Everyone prefers general conformity to $R$ *on condition that* almost everyone conforms to $R$. **Met.** (I want us all at North given that you are at North).
  *   **(5) Conditional Preference for $R^*$:** Everyone prefers general conformity to $R^*$ *on condition that* almost everyone conforms to $R^*$. **Met.** (If you all sat South, I would prefer to sit South with you rather than be alone at North).
  *   **Arbitrariness:** Because (4) and (5) are symmetric, $R$ is an arbitrary solution. **Met.**

  **Phase Two Verdict: Not a Convention.**
  *   **(1) Regularity:** **Met.**
  *   **(2) Expectation:** **Met.**
  *   **(3) Preferences:** **Met** (Preferences have changed, but are now common).
  *   **(4) Conditional Preference for $R$:** **Met.** (I prefer us all at North given you are at North).
  *   **(5) Conditional Preference for $R^*$:** **Failed.**
      *   *Explanation:* Lewis requires that $R$ be preferred to $R^*$ *only* conditional on others' conformity. In Phase Two, the preference for $R$ over $R^*$ is no longer purely conditional on coordination. Even if *everyone else* conformed to $R^*$ (Table South), I would *not* prefer to conform to $R^*$. I would prefer to deviate to $R$ (Table North) to avoid the shame of being a "scab," even if it meant sitting alone. Because I do not prefer general $R^*$ on the condition that almost everyone conforms to $R^*$, the symmetry required for arbitrariness is broken. $R$ is no longer just a coordination solution; it is a morally privileged action.

  ### 2. Generalization and Theoretical Cost

  **Does the analysis imply that no convention which acquires moral force remains a convention?**
  Yes. On Lewis's strict definition, once a regularity acquires intrinsic normative weight (where conformity is preferred even absent coordination, or non-conformity is dispreferred even with coordination), it fails the counterfactual test (Clause 5). It ceases to be "arbitrary" in the requisite sense.

  **Is this a cost Lewis can absorb?**
  Lewis might argue this is a feature, not a bug. He distinguishes between *conventions* (solutions to coordination problems) and *norms* (rules backed by sanctions). He could claim that when a convention "hardens" into a norm, it literally ceases to be a convention and becomes a different social kind.
  **However,** this undermines the claim to analyze our *ordinary* concept. In ordinary language, we say, "It is a convention to drive on the left, and we ought to do it." We treat the normative force and the conventional nature as compatible. If Lewis's theory forces us to say, "Once you feel you *ought* to drive on the left, it is no longer a convention," the theory divorces itself from the phenomenon it purports to explain. It renders 'convention' a transient, pre-moral state, unable to account for the stable social institutions that conventions typically constitute.

  ### 3. The Threshold Question

  **If only a minority moralize $R$, does the verdict flip?**
  Lewis quantifies over "everyone" with an "almost" qualification (allowing for a few deviants).
  *   **The Line:** The verdict flips when the minority of moralizers is large enough to disrupt the *common knowledge* of the preference structure required for Clause (5). If 2 of 14 welders view Table South as shameful, the remaining 12 might still satisfy Clause (5) (they would still sit South if everyone else did). The regularity remains a convention for the majority.
  *   **The Tipping Point:** The flip occurs when the moralizers are sufficient to make the sanction credible for the non-moralizers. Once the non-moralizers conform *not* because they prefer coordination to $R^*$, but because they fear the sanctions of the moralizers, their preference becomes categorical (avoid punishment) rather than conditional (coordinate).
  *   **Principled or Arbitrary?** The line is arbitrary in Lewis's framework. His "almost" clause is a hedge against real-world noise, not a principled boundary for normative change. There is no specific percentage in Lewis's theory where a convention becomes a norm; there is only a gradual erosion of the conditional preference until Clause (5) fails for "almost everyone." This vagueness makes the theory ill-equipped to handle the *process* of norm emergence, treating it instead as a binary switch that lacks a clear trigger mechanism.

  ### 4. The Strongest Lewisian Reply

  **Reply:** A sophisticated Lewisian can argue that the *sanctions themselves* are conventional. In Phase Two, I sit at Table North not because North is intrinsically better, but because I expect you to sanction me if I sit South. You sanction me because you expect others to sanction you if you don't. This creates a second-order coordination problem: "The Sanctioning Convention."
  Therefore, the preference for $R$ is still conditional: I prefer $R$ *given* that you sanction $R^*$. The underlying structure remains game-theoretic.

  **The Cost:** This reply saves the definition at the cost of explanatory depth. It pushes the normativity back one step without explaining it. It implies an infinite regress: if the sanctions are conventional, what sustains the convention of sanctioning? If the answer is "a further convention of sanctioning the non-sanctioners," the theory becomes circular. If the answer is "eventually, people just *want* to sanction," then we have admitted a non-conventional (intrinsic) preference into the base, which concedes the main point: that moral force cannot be fully reduced to coordination preferences.

  ### 5. Alternative Account: Genealogy and Normative Expectations

  An account based on genealogy or normative expectations (e.g., Cristina Bicchieri or John Searle) would describe Phase One and Phase Two as the *same* regularity type, distinguished by the *content* of the expectations. In Phase One, agents conform because they expect others to conform (empirical expectation). In Phase Two, agents conform because they expect others to *believe they ought* to conform and punish deviations (normative expectation). Such an account gives up the reductive ambition of Lewis's game theory. It cannot derive the "ought" entirely from the "is" of preference satisfaction. Instead, it treats the normative force as a primitive social fact generated by the history of the group (the "founding story" of the rival yard). While this captures the continuity between convention and norm that Lewis misses, it sacrifices the elegance of explaining social order solely through the equilibrium behavior of self-interested agents.
