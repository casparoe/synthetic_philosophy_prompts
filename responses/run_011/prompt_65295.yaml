      *   **The Conflict:** Commitment (1) requires replicated data or testable models for risk estimates. Commitment (2) places the burden of safety proof on proponents of *novel* interventions. By definition, novelty lacks historical replication. If you strictly enforce (1), you cannot generate the risk estimate required to satisfy (2), creating an epistemic deadlock that defaults to the status quo.
