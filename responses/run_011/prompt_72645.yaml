answer: |-
  Okay, here's the lay of the land. The neuroscientists aren't here for metaphysics; they're here for tools. Their motive is instrumental—if your view doesn't help them fit models or justify their methods, they'll treat it as noise. They'll attack the utility of your distinction. The metastability postdoc is the technical hawk; their motive is to protect the integrity of continuous-time models from being "digitized" by philosophers who don't understand differential equations. They'll attack your assumptions about time and boundaries. The enactivist philosopher is the ideological hawk; their motive is to prevent any slip back into internalism or representationalism. They'll attack your semantic grounding. The mechanist philosopher is the ally who wants to ensure you aren't just reinventing the wheel; their motive is conceptual clarity. They'll attack the novelty of your claim. The real danger isn't that they prove you wrong, it's that they prove you *empty*.

  ***

  ### Q&A Prep Sheet

  **1. The "So What?" (Neuroscientist)**
  *   **The Question:** "Okay, let's say I buy that dynamics is just a form of computation. Does that change how I build my RNNs? Does it constrain my experiments any differently than if I just called it dynamics? If not, why should I care?"
  *   **The Reply:** "It changes how you validate the model. If it's just dynamics, you're fitting curves to trajectories. If it's computation, you're claiming the system is organized to preserve specific functional relationships despite physical variation. That means you should be testing for robustness to substrate noise, not just trajectory fit. It shifts your criterion for a good model from 'does it match the voltage trace?' to 'does it realize the same transformation under perturbation?'"
  *   **Soft Spot:** You might not have a concrete example of a experiment this changes *today*.
  *   **Concede:** "I'm not saying it changes your code tomorrow. I'm saying it changes how you justify the model in the paper."

  **2. The "Redescription" (Mechanist Philosopher)**
  *   **The Question:** "You're saying computation is just functional organization of mechanisms. Isn't this just the standard mechanistic account with a new label? What work is 'computation' doing that 'mechanism' isn't?"
  *   **The Reply:** "Mechanism tells you how the parts are arranged. Computation tells you why *that* arrangement matters across different substrates. A mechanistic explanation is substrate-specific; a computational explanation is medium-independent. I'm claiming we need both: the mechanism explains the implementation, the computation explains the capacity."
  *   **Soft Spot:** The line between "mechanism" and "functional organization" is notoriously blurry in practice.
  *   **Concede:** "It is a subset of mechanistic explanation. I'm arguing it's a specific, indispensable subset for psychiatry."

  **3. The "Homunculus" (Enactivist Philosopher)**
  *   **The Question:** "You say the system computes because it realizes a function. But functions are assigned by observers. Who assigns the function here? Are you smuggling in a homunculus to read the states?"
  *   **The Reply:** "No, the function is fixed by the system's evolutionary or learning history, not by me looking at it. The system was selected or trained to achieve goal X. That causal history individuates the computation, not my semantic interpretation."
  *   **Soft Spot:** In psychiatry, 'proper function' is normative and contested (what is the brain *supposed* to do?).
  *   **Concede:** "I agree functions aren't intrinsic physical properties. They're relational properties grounded in history."

  **4. The "Boundary Problem" (Metastability Postdoc)**
  *   **The Question:** "Computation requires inputs and outputs. But in the brain, there are no clean boundaries. It's a closed loop with the body and environment. Where do you draw the box to say 'computation happens here'?"
  *   **The Reply:** "You draw it pragmatically, based on where the functional organization is localized. We do this in engineering all the time. The lack of a metaphysical boundary doesn't stop us from identifying a functional module that transforms specific signals."
  *   **Soft Spot:** Pragmatic boundaries can feel arbitrary to a rigorous modeler.
  *   **Concede:** "There is no hard anatomical boundary. It's a functional carve-out."

  **5. The "Clock" (Metastability Postdoc)**
  *   **The Question:** "Standard computation implies discrete steps or a clock. Neural dynamics are continuous and asynchronous. You're forcing a discrete grid on continuous flow."
  *   **The Reply:** "I'm not claiming the brain is a digital serial processor. Continuous dynamical systems can compute. They transform state vectors over time. That's still computation, just not Turing-style stepwise computation."
  *   **Soft Spot:** You have to be careful not to dilute 'computation' so much it loses meaning.
  *   **Concede:** "There is no global clock. I agree completely."

  **6. The "Falsifiability" (Neuroscientist)**
  *   **The Question:** "If everything that realizes a function is a computer, and brains realize functions, how do you falsify this? It sounds unfalsifiable."
  *   **The Reply:** "You falsify it by showing the system fails to maintain the function when the substrate is perturbed. If the function collapses with minor physical noise, it wasn't a computational organization, it was just a physical reaction."
  *   **Soft Spot:** Defining 'minor noise' is context-dependent.
  *   **Concede:** "It's hard to falsify at a high level of abstraction. I grant that."

  **7. The "Pathology" (Computational Psychiatrist)**
  *   **The Question:** "We deal with broken brains. If computation is just what mechanisms do, what does a 'broken computation' look like versus just 'different dynamics'?"
  *   **The Reply:** "A broken computation is a failure to realize the target function under normal conditions. Different dynamics might still compute the same function. We care when the input-output mapping fails, not just when the trajectory looks weird."
  *   **Soft Spot:** Defining 'normal conditions' and 'target function' in psychiatry is ethically loaded.
  *   **Concede:** "Defining the target function is the hard clinical part, not the computational part."

  **8. The "Pancomputationalism" (General)**
  *   **The Question:** "If a bucket of water realizes functions via its molecular dynamics, is it a computer? If yes, your view is trivial. If no, what's the difference?"
  *   **The Reply:** "A bucket of water isn't organized to preserve functional relationships against noise. It just reacts. The brain is organized to stabilize specific mappings. That organization is the difference."
  *   **Soft Spot:** 'Organization' is doing all the heavy lifting here.
  *   **Concede:** "Many physical systems compute trivially. Not all compute *mentally*."

  **9. The "Terminology" (Neuroscientist)**
  *   **The Question:** "We already use 'computation' to mean 'what the circuit does'. Why do you need a philosophy talk to tell us we're right?"
  *   **The Reply:** "Because you're using it inconsistently. Sometimes you mean 'simulation', sometimes 'mechanism', sometimes 'information processing'. I'm giving you a consistent definition so you don't talk past each other."
  *   **Soft Spot:** Scientists rarely wait for philosophers to clean up their language.
  *   **Concede:** "You've been getting along fine without me. I'm trying to prevent future headaches."

  ***

  ### Triage: Real Force vs. Sound Bad

  **Real Force (The Killers):**
  1.  **The "So What?" (Neuro):** If they think this is idle taxonomy, you lose the room.
  2.  **The "Redescription" (Mechanist):** If you're just renaming mechanism, you haven't added value.
  3.  **The "Homunculus" (Enactivist):** If you can't ground the function without an observer, the whole computational claim collapses into subjectivity.

  **Sound Bad (The Noise):**
  1.  **The "Clock":** Easy to deflect if you emphasize continuous computation.
  2.  **The "Terminology":** Sounds pedantic, but you can brush it off as "clarification."
  3.  **The "Pancomputationalism":** Mostly a definitional worry that doesn't impact the neuroscience much.

  ***

  ### The Crucial Reply
  **The "So What?" (Objection #1).**
  This has to land perfectly. If the neuroscientists decide your view doesn't constrain experiments or justify models better than pure dynamics, you become irrelevant to the workshop. You must emphasize **robustness** and **medium-independence** as testable criteria. Don't get stuck on the definition of computation; get stuck on the *utility* of the definition.

  ### The Dreaded Question
  **"Isn't this just a verbal dispute?"**
  (Usually asked by a tired senior neuroscientist after lunch.)
  *   **Why it's dreaded:** It collapses the distinction between your view and the dynamical view into mere semantics, implying you've wasted everyone's time.
  *   **Best Answer:** "If it were merely verbal, we wouldn't disagree on what counts as evidence. The dynamical view says look at the trajectory. My view says look at the functional stability under perturbation. Those are different experimental demands. So it's not just words; it's about where you look for the explanation."
