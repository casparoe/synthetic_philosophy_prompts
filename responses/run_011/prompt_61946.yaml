          *   *Risk:* The premise assumes a "continuous inner life" is possible across gaps. This is psychologically/philosophically contested (Lockean memory criteria). I need to flag this.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* The prompt asks to distinguish settled from contested *throughout*. I need to be careful not to say "Philosophers agree X" if they don't.
