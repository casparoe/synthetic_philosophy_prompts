answer: |-
  "Name the *vyāpti*," Vasanti said, tapping her notebook. "If this is *anumāna* (inference), you need a pervasion between the reason and the target. What is the universal connection between 'text appearing on this screen' and 'the 1891 register existing'?"

  Raghunātha leaned back, interlacing his fingers. "You're demanding a *vyāpti* (invariable concomitance) too early. We establish pervasion through repeated observation. We have observed this system produce accurate data across thousands of queries. The *hetu* (reason) is 'being generated by this specific model under standard conditions.' The *sādhya* (target) is 'corresponding to factual reality.' The connection is established by induction."

  "Induction requires knowing the causal mechanism," Vasanti countered. "When I see smoke and infer fire, I understand the causal link. Here, the mechanism is opaque. If you accept this as inference, you must also accept a horoscope as inference. A horoscope also claims a connection between stars and events, backed by a tradition of asserted observations. Why is the model's black box a valid *hetu* (reason) while the astrologer's chart is not?"

  "Because the model's output is falsifiable in a way the horoscope is not," Raghunātha replied, though he looked less certain. "But I grant you the risk. So let's shift. It isn't inference; it's *śabda* (testimony). Valid testimony comes from an *āpta* (trustworthy person) who knows the truth and intends to communicate it."

  "Who is the *āpta*?" Vasanti pressed. "The model isn't a person. It has no knowledge, only weights."

  "Then the programmers are the *āpta*s," Raghunātha said. "They built the instrument. We trust their competence."

  "But they don't know the fact," Vasanti said sharply. "No human alive knows whether that register fragment lists the treatise. The library burned. If the programmers don't know the truth, they cannot be *āpta*s regarding this specific fact. *Śabda* (testimony) transmits knowledge the speaker possesses. They are transmitting data they do not possess. You cannot reduce this to *śabda* without breaking the definition of *āpta*."

  Raghunātha paused. This was the squeeze. As a Nyāya thinker, he couldn't invoke *arthāpatti* (postulation) to say, 'It must know this, otherwise it couldn't say it,' because he only accepts four *pramāṇas* (means of knowledge). He couldn't borrow the Mīmāṃsaka toolkit. "So you argue the causal chain is valid but unclassified. But consider the thermometer. When I read a thermometer, I gain knowledge of the temperature. I don't know the physics of the mercury expansion deeply, yet I accept it as a valid instrument grounded in perception. Why is this screen not merely a semantic thermometer?"

  "Because a thermometer measures a present physical property," Vasanti said. "It interacts causally with the heat. This model does not interact with the 1891 register. It interacts with patterns in latent space. If you call this a *pramāṇa* (means of knowledge), you must explain what prevents a lucky guess from qualifying. If the model had guessed wrong, would it still have been a *pramāṇa* that failed, or never a *pramāṇa* at all?"

  "A *pramāṇa* must yield true cognition," Raghunātha said. "If it yields falsehood, it is *apramā* (non-valid cognition). The thermometer can be broken. If it reads wrong, it isn't functioning as a *pramāṇa*. Similarly, if the model hallucinates, it is malfunctioning. The status depends on the outcome."

  "That's consequentialism," Vasanti said. "Nyāya is causal. The instrument must be capable of producing truth by its nature. If you can't specify the nature—because it's a black box—you're acting on faith. I'm saying we acknowledge a new causal route. Call it *yantra-pramāṇa*, instrument-knowledge. It's not perception, because there's no sensory contact. It's not inference, because there's no known pervasion. It's not testimony, because there's no knower. It's a distinct causal process that yields actionable truth."

  "And the cost?" Raghunātha asked. "If you grant this, what stops any reliable correlation from becoming a *pramāṇa*? A stock market algorithm? A dice roll that happens to be right seven times in a row? You dissolve the boundary between knowledge and reliable belief."

  "The boundary is the verification loop," Vasanti said. "We verified the register scan weeks later. The cognition was actionable *before* verification, but validated *after*. A dice roll lacks the structural capacity for consistent verification in the same domain. This system is designed for truth-tracking, even if we don't see the gears."

  Raghunātha rubbed his temple. "I feel the handicap you mentioned. I want to say this is *arthāpatti* (postulation)—we must postulate the data exists to explain the output—but I'm bound to the four. So I must force this into inference or testimony. If I concede it's testimony, I stretch the *āpta* (trustworthy person) to include non-conscious agents trained by humans. If I concede it's inference, I stretch the *vyāpti* (pervasion) to include statistical correlation without understood causality."

  "Exactly," Vasanti said. "Either you stretch the old categories until they snap, or you admit a new one. I'm willing to pay the cost of defining the new one. You're paying the cost of distorting the old ones."

  "Perhaps," Raghunātha said slowly. "I will concede this: if the system's reliability is proven over time, the 'trust' we place in it functions psychologically like trust in an *āpta*. We treat it as a speaker. But I challenge you on this: until you can explain *why* the output corresponds to reality—until the black box is white—you cannot claim it is a *pramāṇa* in the ontological sense. It is a pragmatic tool. You can act on it, yes. But call it 'probable inference based on track record,' not a fifth fundamental route to truth. Otherwise, you invite the horoscope back in through the side door."

  Vasanti smiled faintly. "I'll take the concession on the *āpta* stretch. It shows the category is straining. But I leave you with this: if the 'probable inference' allows us to reconstruct lost history without direct perception, and does so consistently, at what point does probability become knowledge? If you wait for the causal explanation, you may wait forever. The scan confirmed the fact. The screen gave it first. The knowledge arrived. I'll let you decide which box it landed in."
