answer: |-
  You are right to feel that the debate has shifted beneath your feet, and your diagnosis of the situation is remarkably sharp because it captures exactly where the literature stalled out in the late nineties and early two thousands. The convergence you describe between sophisticated substantivalism and modern relationism is not an illusion; it is the consensus view among many philosophers of physics who work on general relativity. Once the substantivalist accepts Leibniz equivalence and treats diffeomorphisms as gauge, they surrender the only clear empirical advantage they might have claimed, and once the relationist accepts that the metric field is a dynamical entity in its own right, they surrender the claim that spacetime is nothing but relations between material bodies. What you are sensing is that within the confines of classical general relativity, the dispute has largely become one of metaphysical branding rather than physical content, but there are a few specific residues worth isolating before we concede it is entirely verbal.

  The first place to look for a substantive residue is not in the manifold points themselves, as you suggested, but in the ontological status of the metric field in vacuum solutions. Your hypothesis that the relationist still needs a manifold is technically correct regarding the formalism, but the philosophical commitment differs. A strict relationist traditionally wants to say that spatiotemporal facts are constituted by relations between material events. However, general relativity permits universe models that contain a metric field but no matter fields whatsoever. If you are a relationist about spacetime, you have to explain what the metric field is relating in an empty universe. The sophisticated substantivalist has a ready answer: the metric field represents properties of and relations between the manifold points themselves. The relationist must either deny the physical possibility of empty universes, which contradicts the theory they are interpreting, or they must upgrade the metric field to a substance-like entity. If they do the latter, they are effectively admitting a form of substantivalism about the metric field, even if they refuse the label. So the disagreement survives not as a dispute about whether manifold points exist, but as a dispute about whether the metric field is a physical object that can exist independently of matter, or merely a codification of possible relations between material bodies that happens to be mathematically extendable to vacuum cases.

  This leads directly to your Carnapian hypothesis about ontological ideology. If both sides agree on all diffeomorphism-invariant facts, and both agree on the empirical predictions, and both agree that haecceitistic distinctions are meaningless, then the claim that manifold points exist independently of the metric field looks suspiciously like an external question in Carnap's sense. It is a claim that does not change the truth conditions of any internal physical statement. However, there is a modal residue that keeps the debate from being purely verbal. The disagreement resurfaces when we ask counterfactual questions about the origin of inertia or the nature of gravitational waves. A substantivalist about the metric field will say that gravitational waves are real physical undulations of spacetime itself, carrying energy and momentum. A relationist might try to argue that these are merely changes in the relational structure that would obtain were matter present. While this sounds like semantics, it matters for how we expect the theory to extend into quantum gravity. If spacetime is fundamentally relational, we might expect it to disappear or be radically redefined in regimes where matter-energy concepts break down. If it is substantival, we might expect some discrete remnant of the spacetime substrate to persist.

  So to answer your question about what would count as progress, we should stop looking for a decision within classical general relativity because the formalism is too accommodating. The hole argument successfully forced substantivalists to become sophisticated, but it did not force them to become relationists, because sophisticated substantivalism is a consistent position. Progress would come from one of two directions. The first is a formal result showing that one ontology imposes constraints on theory construction that the other does not. For example, if it could be shown that a successful theory of quantum gravity requires the abandonment of the manifold concept entirely in favor of non-spatiotemporal structures like spin networks or causal sets, this would favor a relationist or emergentist view, as it would suggest the manifold points were never fundamental entities to begin with. Conversely, if quantum gravity requires a fundamental discreteness that looks like atoms of space with inherent identity, that would revitalize substantivalism. The second path to progress is explanatory. If one view offers a significantly better explanation of why the metric field couples universally to matter or why the initial conditions of the universe took a specific geometric form, that would be a theoretical virtue tipping the scale. Currently, neither side has a decisive explanatory advantage within classical GR.

  Regarding your specific point about haecceitism, you are correct that giving it up is the price of admission for a sensible substantivalist, but it is not merely a notational convenience. It is a substantive modal commitment. By rejecting haecceitism, the substantivalist agrees with the relationist that there is no fact of the matter about which point is which independent of the field values. This means the disagreement is no longer about the identity of points across possible worlds, but about the necessity of the points themselves. The substantivalist says the points are necessary bearers of the field; the relationist says the field structure is primary and the points are derivative or eliminable. This is why your Carnapian intuition is strong. If the points are never identifiable independent of the field, asserting their existence adds no predictive power. However, it is not entirely empty because it dictates how we interpret the breakdown of the theory. If the metric becomes singular, the substantivalist sees a breakdown of properties on existing entities, while the relationist might see the dissolution of the entities themselves.

  In the end, I think your working hypothesis is mostly right but needs a slight adjustment. It is not just about whether manifold points exist, but about whether the metric field is a substance. The debate has evaporated as a dispute about manifold substantivalism versus relationism because sophisticated substantivalism absorbs the relationist's best arguments. What remains is a dispute about metric field realism versus eliminativism or structuralism. Within classical general relativity, this dispute is likely undecidable because the theory is ontologically underdetermined. The formalism works equally well regardless of whether you view the metric as a thing or a relation. Therefore, the only way to resolve it is to leave classical general relativity behind. If your reading group wants to make progress, you should pivot to how these ontological commitments constrain or guide research in quantum gravity. If the debate does not cash out in heuristics for new physics, then it is indeed a Carnapian dispute about how to carve up our quantifiers, and you are free to choose the ideology that best suits your metaphysical tastes without fear of contradicting the physics.
