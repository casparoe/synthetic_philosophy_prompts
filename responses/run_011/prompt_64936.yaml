answer: |-
  Bet on the **Direct Reference + Mental Files** account. It locates the shock in the cognitive cost of merging two independent databases rather than in mysterious semantic entities, matching the visceral feel of betrayal without inflating ontology. It explains why she knew everything (reference) yet learned something (file structure).

  ### Why the Puzzle Bites
  The pressure point is the conflation of *what* you are thinking about with *how* you are thinking about it. In the world, V and Brandt are identical (one person); in Adèle's mind, they are distinct (two concepts). An identity statement (`V = Brandt`) feels informative because it bridges two separate cognitive access routes to the same object. If you only track the object (reference), the statement is trivial (`a = a`). If you track the access route (mode of presentation), it is substantial. The puzzle bites because language forces us to use names to track objects, but our minds use names to track *ways of thinking* about objects.

  ### The Sense-Based Answer (Frege)
  This view commits you to the existence of "senses"—intermediate entities between the name and the object. A name isn't just a tag; it's a description or a mode of presentation (e.g., "the person I write letters to" vs. "the painter I critique").
  *   **Is the worry fair?** Yes. Positing "senses" can feel like naming the mystery rather than solving it. What determines the sense? Is it public (language) or private (psychology)? If it's private, semantics becomes psychology.
  *   **Earning its keep:** It earns its keep by cleanly explaining the informativeness: Adèle learns a new proposition (that the sense of V coincides with the sense of Brandt). However, it struggles to explain *why* the reveal hurts. Learning an identity shouldn't inherently cause pain unless the senses carried conflicting emotional weights, which pushes the explanation back toward psychology.

  ### The Direct-Reference Camp (Kripke et al.)
  This camp says names are just tags (rigid designators) pointing directly to the object. There is no sense. `V = Brandt` expresses the same proposition as `V = V`. So what changes in Adèle? There are three live candidates:
  1.  **Mental Files:** Adèle maintains two cognitive dossiers ("files") for one person. The reveal forces a merger. The change is structural, not propositional.
      *   *Cost:* High explanatory power for fiction/psychology. Requires accepting that the mind compartmentalizes information irrationally.
  2.  **Inferential Potential:** Before, she couldn't transfer predicates from the V-file to the Brandt-file. She couldn't infer "V is Brandt" from her existing beliefs. The reveal unlocks new inferences.
      *   *Cost:* Dry. Explains knowledge gain, not emotional devastation.
  3.  **Epistemic Possibility:** Before, she lived in a world where V *might not* have been Brandt. After, that world is eliminated.
      *   *Cost:* Abstract. Doesn't capture the retrospective shame ("I wrote cruel things to *her*").

  ### The Nastier Cousin (Contradictory Beliefs)
  This is Kripke's Puzzle about Belief. In the bilingual case, Pierre believes "London is pretty" (via French) and "London is not pretty" (via English). He is rational but holds contradictory beliefs because he doesn't know the names co-refer.
  *   **Why is it worse?** It violates the principle that a rational agent cannot believe `P` and `not-P`. It suggests rationality is local to files, not global across the mind.
  *   **Does it apply to Adèle?** Yes. She believed "V is kind" and "Brandt is cruel." If V=Brandt, she believed "X is kind and X is cruel." She didn't notice because the beliefs were siloed.
  *   **Did she believe it?** On the Direct Reference view, yes, she believed contradictory propositions about the same object. On the Sense view, no, she believed compatible propositions about different senses. For your novel, the Direct Reference view is more damning: she *was* contradictory, which heightens the tragedy of her blindness.

  ### Predicting the Reveal Tax
  Semantics does not predict the tax; psychology does. The semantic accounts explain *how* the ignorance was possible (the mechanism of the blindfold). The "tax" is the emotional cost of restructuring her mental model.
  *   **Semantic View:** The tax should be proportional to the distance between the senses.
  *   **Psychological View:** The tax is proportional to the *integration* of the files. If she built her entire identity around hating Brandt and loving V, the merger destroys her self-narrative.
  *   **Verdict:** You are measuring psychology and calling it information. The "voltage" comes from the retroactive recontextualization of eleven years of intimacy and cruelty, not the logical content of the identity statement.

  ### Comparison Table

  | account | Adèle's belief state before chapter 38 | what literally changes at the reveal | does she acquire a new proposition | what it predicts about the size of the reveal tax | where it creaks |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Fregean Sense** | She believes two distinct propositions involving different modes of presentation for the same object. | She learns the two modes of presentation pick out the same object. | **Yes** (the identity proposition linking the senses). | Tracks the conceptual distance between the two "senses" (e.g., lover vs. critic). | Ontologically spooky; risks treating "senses" as magic widgets rather than cognitive habits. |
  | **Direct Ref + Mental Files** | She has two separate cognitive files for one object, with no cross-referencing. | The two files are merged into one; information becomes globally accessible. | **No** (the fact was true, she just couldn't access it across files). | Tracks the cognitive cost of merging conflicting data and the shame of past siloed actions. | Doesn't fully explain the *semantic* difference in how she would report her beliefs before vs. after. |
  | **Belief Reports (Contextualist)** | She assents to "V is kind" and "Brandt is cruel" in different contexts. | The context shifts so both names are understood to refer to the same individual in one frame. | **Not the right question** (belief is a relation between agent and proposition under a guise). | Tracks the social/linguistic embarrassment of having used names incorrectly or deceptively. | Can feel like it dissolves the problem by saying "it's just how we talk," ignoring the internal pain. |
  | **Structured Propositions** | She believes propositions containing the names themselves as constituents, not just the person. | The constituent structure of her belief changes from [V, Kind] to [Brandt, Kind]. | **Yes** (propositions are structured differently even if truth-conditions match). | Tracks the structural rearrangement of her internal narrative logic. | Complex; risks over-intellectualizing the emotional hit as a syntactic rearrangement. |
