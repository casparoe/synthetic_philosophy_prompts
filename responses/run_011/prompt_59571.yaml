      *(Self-Correction during drafting)*: I need to be careful not to say Montreal was a "failure" because of HFCs. It was a success for Ozone. The point is that the *consequentialist calculation* at the time was incomplete. The verdict needs to reflect this nuance. The theory of cluelessness says we *can't* guide choice. Montreal says we *can*, but only if we build flexibility. So it modifies the theory.

      *(Refining the Agent)*: The prompt asks "Who is the deliberating agent?" I should argue it's a *hybrid*. The scientists defined the causal space, the states defined the option set, the negotiators defined the constraints. But for the purpose of the moral evaluation of the *Protocol*, the "Signatory States acting collectively" is the primary agent.

      *(Refining Frame Ignorance)*: This is the strongest philosophical point. Lenman worries about the *tail* of the distribution. Montreal shows the worry should be about the *axes* of the graph.

      *(Refining Revisionability)*: Make sure to hit the individual vs. institution point hard. That's a key constraint in the prompt.

