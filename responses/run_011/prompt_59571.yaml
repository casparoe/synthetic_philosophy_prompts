      *   *Refining the "Cluelessness" argument:* Make sure to distinguish between *parameter uncertainty* (how much ozone will deplete?) and *structural uncertainty* (what else will the substitutes do?). Lenman cares about the latter mostly.
      *   *Refining the "Revisionability" argument:* Connect it to Rule Consequentialism or Two-Level Consequentialism. If the *system* is consequentialist, does the *agent* need to be omniscient?

