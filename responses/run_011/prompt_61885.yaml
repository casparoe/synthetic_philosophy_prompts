answer: |-
  Your suspicion is well-founded. The magazine passage captures the *spirit* of Galen Strawson's "Basic Argument" but stumbles significantly on the metaphysics, specifically regarding determinism, and conflates Galen Strawson's views with those of other "hard incompatibilists" (like Derk Pereboom) regarding policy.

  Here is a claim-by-claim breakdown, followed by an analysis of your specific questions and a final assessment of the argument's dialectical force.

  ### Claim-by-Claim Analysis

  **1. "Strawson's point is that you can only be morally responsible for what you do if you are responsible for how you turned out."**
  *   **Verdict:** **Endorsed.**
  *   **Analysis:** This is an accurate summary of the "Principle of Ultimate Responsibility." Strawson argues that to be truly responsible for an action, you must be responsible for the mental nature (character, motives, preferences) that produced that action.

  **2. "Everything you do flows from your character and your circumstances, and you chose neither."**
  *   **Verdict:** **Fair Simplification.**
  *   **Analysis:** Strawson argues that actions flow from one's "mental nature." While "circumstances" are relevant, Strawson focuses heavily on the internal mental state. The key point is that you did not choose your initial mental nature.

  **3. "To be responsible for yourself you would have to have created yourself, which would mean an endless chain of prior choices, each made by an earlier self you never picked — precisely what determinism rules out."**
  *   **Verdict:** **Genuine Distortion.**
  *   **Analysis:** This is the error you spotted. The Basic Argument is explicitly designed to work **whether determinism is true or false**.
      *   If determinism is true, you aren't responsible (standard incompatibilism).
      *   If indeterminism is true, your choices are random or uncaused. Randomness does not grant responsibility; it merely breaks the chain of causation without adding control.
      *   By saying "precisely what determinism rules out," the author conflates Strawson's Basic Argument with Peter van Inwagen's "Consequence Argument." Strawson's point is that *even if* you could make a choice in an indeterministic universe, you would need a prior reason/nature to make that choice, which you also didn't choose. The impossibility lies in the logic of self-creation (*causa sui*), not in deterministic physics.

  **4. "Since nothing can be its own cause, no one is ever truly morally responsible."**
  *   **Verdict:** **Endorsed.**
  *   **Analysis:** This is the core metaphysical conclusion. One cannot be *causa sui* (cause of oneself) in the respect required for ultimate moral responsibility.

  **5. "The consequence, Strawson says, is that we should abandon blame and resentment altogether and replace them with something like the therapeutic management of dangerous people..."**
  *   **Verdict:** **Partial Distortion / Conflation.**
  *   **Analysis:** Strawson does argue that retributive blame is unjustified if the Basic Argument holds. However, the specific phrasing "therapeutic management" is more characteristic of **Derk Pereboom** (who proposes a "quarantine model" for criminal justice) or **Gregg Caruso**.
      *   Galen Strawson tends to focus on the *truth* of the matter rather than specific penal policy. He suggests we should view people as "parts of nature" or "deeply lucky/unlucky," but he is often more pessimistic about our ability to institute a rational policy than Pereboom is. He emphasizes the *tragedy* of this realization more than the *reform*.

  **6. "...a shift he concedes we could never actually pull off, because, as Hume showed, our reactive attitudes are natural and inescapable."**
  *   **Verdict:** **Endorsed (with nuance).**
  *   **Analysis:** Strawson distinguishes between what is *true* (we are not responsible) and what is *psychologically possible* (we cannot stop feeling responsibility). He acknowledges the Humean/P.F. Strawsonian point that reactive attitudes (resentment, gratitude) are part of human nature. He lives with the contradiction: intellectually knowing responsibility is impossible, but emotionally unable to abandon it.

  ---

  ### Addressing Your Specific Questions

  **1. How wide is the demand that you be responsible for "how you turned out"?**
  Strawson restricts this carefully. He does not mean you must be responsible for your height, your parents, or your socioeconomic status. He means you must be responsible for your **mental nature**—the specific reasons, values, and preferences from which your action issued.
  *   *The Restriction:* You don't need to be responsible for *everything* about yourself, only the part of yourself that explains the action.
  *   *The Catch:* But to be responsible for *that* mental nature, you must have chosen it. To choose it, you must have had a prior mental nature that guided that choice. Thus, the regress begins. The demand is narrow (mental nature) but the logical requirement (self-creation) is impossible.

  **2. Does the argument really need an infinite regress of choices, or is there a more basic point?**
  The infinite regress is the mechanism, but the basic point is about **intelligibility**.
  Strawson argues that for a choice to be *yours* in a responsibility-grounding way, it must be made for a reason. If you choose your own nature, you must do so for a reason (Principle R). That reason must come from *some* prior nature. If that prior nature was not chosen by you, you are not ultimately responsible. If it *was* chosen by you, we need a reason for *that* choice, leading to the regress.
  The argument doesn't just say "regresses are bad"; it says "you cannot get the ball rolling in the first place." You cannot step outside your own skin to choose your skin.

  **3. Does Strawson recommend reforming blame, and how does he distinguish 'true' responsibility?**
  *   **Reform:** Strawson is a "pessimist." He believes we *ought* to abandon the belief in moral responsibility because it is false. However, unlike Pereboom, he is less focused on drafting new laws and more focused on the existential shift in how we view humanity. He admits (as the passage notes) that we likely cannot stop *feeling* blame, but we should stop *believing* it is justified.
  *   **Distinction:** Strawson distinguishes between:
      1.  **True (Ultimate) Moral Responsibility:** Requires being *causa sui*. Impossible.
      2.  **Compatibilist Responsibility:** Based on capacities like rationality, responsiveness to reasons, and lack of coercion. Strawson admits people have *this*, but he argues it is not enough to justify deep moral desert, retribution, or true praise. He claims compatibilists have changed the subject to a "watered-down" version of responsibility that doesn't satisfy our actual emotional demands.

  **4. Is the closing appeal correctly attributed?**
  Yes. Strawson frequently cites **David Hume** (and his father, **P.F. Strawson**) on this point. In *Freedom and Resentment*, P.F. Strawson argued that reactive attitudes are natural facts about humans, not rational choices. Galen accepts this descriptive psychology while rejecting his father's normative conclusion. Galen agrees: We are stuck with these attitudes by nature (Hume), even though they are metaphysically unjustified (Galen).

  ---

  ### Final Assessment: Dialectical Force Against the Compatibilist

  The compatibilist objection is: *"Strawson has simply defined moral responsibility out of existence by setting an impossible standard (self-creation) that no one ever meant to require."*

  **Strawson's Counter-Argument:**
  Strawson's dialectical force lies in **phenomenology**. He argues that when people feel deep moral resentment or believe a villain *truly deserves* punishment (not just quarantine), they are implicitly committed to Ultimate Responsibility.
  *   **The Trap:** If the compatibilist says, "We don't need self-creation, just rationality," Strawson asks: "But if the villain's rationality was determined by genetics and environment they didn't choose, why do they *deserve* suffering?"
  *   **The Force:** Strawson forces the compatibilist to admit that their version of responsibility does not support **basic desert**. It might support safety measures or behavioral modification, but not the retributive blame that characterizes our actual moral practices.
  *   **Conclusion:** The argument is strong because it exposes a gap between what compatibilists *say* responsibility is (capacities) and what our moral emotions *feel* it requires (ultimate authorship). If the compatibilist accepts that ultimate authorship is impossible, Strawson wins: they must admit that "moral responsibility" in the retributive sense is a fiction, even if we keep using the word for social utility.

  **Summary of the Magazine Passage:**
  The passage is **mostly sound on the psychology and the conclusion**, but **metaphysically imprecise on the role of determinism**. It correctly identifies the regress problem and the Humean concession on attitudes, but it mistakenly ties the argument to determinism (ignoring the indeterminism problem) and attributes specific penal policy recommendations to Strawson that belong more to his contemporaries. It is a fair popularization, but one that blurs the lines between different "hard incompatibilist" thinkers.
