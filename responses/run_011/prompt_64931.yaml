prompt: |-
  I write literary-ish historical fiction — this is the third book set on an invented Bronze Age-ish coastline, but the first two leaned on real archaeology and I got burned in both directions. Once a specialist reader tore into a scene because I'd built a whole organised priesthood out of a couple of figurines, and another time I got dinged for the opposite thing: objects that were pure set dressing, with no social weight behind them, in a book that's supposedly about a world where every object cost somebody a season of labour. So I've accepted that I need an actual procedure, not vibes.

  Here's the situation. I keep a file of objects — some real finds I've read about popularly, some invented — and every time I want one to do work in a scene I need to know what it licenses. Write me that procedure: an ordered set of questions to run on an object, where each question either lets me go further or stops me cold. The main thing I need it to do is keep three kinds of claim apart, because I collapse them constantly:

  - this thing exists → somebody could make it (skills, raw materials, tools, time, who's allowed to spend that time)
  - this thing means something → belief, taboo, the sacred, the dead, cosmology
  - this thing shows an institution → measures, records, storage, officials, tax, a guild, a priesthood, a state that can move grain

  Bake in the stuff I always get wrong:

  - how the object got into the ground — lost, thrown out, hoarded, deliberately broken, buried with somebody, dropped in a burn layer — and what each of those routes does and doesn't let me infer about the people.
  - wear. Intended use versus what it actually got used for over forty years, and how much of either a character standing in the room could know.
  - the fact that a lot of different pasts can leave the same pile of stuff. I want the procedure to force me to write at least two rival explanations for anything I build a scene on, and then to tell me which of them my characters could not possibly distinguish between from the inside.
  - the "if you can't explain it, call it ritual" reflex. Give me a hard stop for that, and tell me what positive grounds would actually be enough for a character to treat something as sacred rather than just me wanting them to.
  - silence. When nothing like the object has ever turned up anywhere, when is that a genuine constraint on what I can write and when is it just a hole in the sample? I want a test, not a shrug.
  - standardization. When does a batch of similar objects justify me writing rules, officials or measures, and when is it only habit and copy-and-drift?

  It has to be fast. I'm running this maybe twenty times a week mid-draft, no library, no time — ten minutes on a difficult object, and most objects should sort in two. Write it for someone who's read a lot of archaeology at the popular level but can't do stats and can't read a strat report. My editor doesn't touch this material and my one specialist reader only sees a second draft, so whatever comes out of the procedure has to be something I can check myself on the first pass without phoning anybody. No bibliography, no reading list, no citations — I'm not chasing sources. If there's a proper name for a concept you're using, drop the name once and move on.

  Then run it on three cases so I can see it actually bite:

  1. A small bronze figure, sex unclear, no attributes, no context, picked up loose in ploughsoil, nobody knows where it came from. I want a temple in this book and a hereditary priesthood. Tell me what this object will carry and what it flatly won't.
  2. One room in a burned building with several hundred clay lumps that were pressed over jar mouths and tied with string, a lot of them bearing the same two or three marks. I want a redistribution economy and a man who is almost but not quite a scribe.
  3. Two hundred-odd loom weights from an ordinary house, all within a couple of grams of each other. I want whatever it can bear, which I suspect is less than I want.

  For each one show the questions being answered, not just the verdict, and be blunt where the procedure is going to disapoint me — better I hear it from you than from a reviewer. Mark clearly which steps aren't matters of fact at all but calls only I can make: what kind of book this is, how much I'm willing to let a reader be unable to check anything, how much invention I'll own in the author's note versus how much I'll let pass as scenery. And finish with what the whole procedure can't do — where it'll hand me a confident green light that's still wrong — plus whatever habit or double-check I should build in to catch those.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and case studies:

  1.  **Analyze the Request:**
      *   **User:** Literary-ish historical fiction writer (Bronze Age-ish setting). Third book, first two had archaeology issues (over-interpreting vs. under-interpreting).
      *   **Goal:** A fast, ordered procedure (checklist of questions) to vet objects before using them in a scene.
      *   **Core Problem:** Collapsing three distinct claims: Existence (tech/material), Meaning (belief/taboo), Institution (state/priesthood/economy).
      *   **Specific Pain Points to Address:** Depositional context (how it got there), Wear/Use-life, Equifinality (multiple pasts = same stuff), "Ritual" dumping, Silence (absence of evidence), Standardization (rules vs. habit).
      *   **Constraints:** Fast (10 mins max, often 2), no library/stats/strat reports, self-checkable before specialist review. No bibliography.
      *   **Deliverables:**
          1.  The Procedure (ordered questions, stop/go logic).
          2.  Three Case Studies (Bronze figure, Clay sealings, Loom weights) running the procedure.
          3.  Meta-commentary on authorial choices (what's fact vs. invention).
          4.  Limitations of the procedure (where it gives false confidence).
      *   **Tone:** Blunt, practical, respectful of the craft but hard on the archaeology. "Better I hear it from you than from a reviewer."

  2.  **Drafting the Procedure (The "Object Vetting Protocol"):**
      *   *Structure:* Needs to be a funnel. Start with the physical, move to the social, end with the narrative.
      *   *Step 1: The Physical Reality (Existence).* Can it exist? Materials, tech.
      *   *Step 2: The Biography (Deposition/Wear).* How did it get here? What does wear say?
      *   *Step 3: The Social Weight (Meaning/Institution).* This is where the user collapses claims. Need to separate "Sacred" from "Official" from "Made."
      *   *Step 4: The Silence & Equifinality Check.* Force alternative explanations.
      *   *Step 5: The Character Horizon.* What can the character *know*?
      *   *Refining the "Stop/Go":* Make sure there are hard stops. E.g., if you can't explain the material, stop. If you call it ritual without evidence, stop.
      *   *Addressing Specific Pain Points:*
          *   *Deposition:* Add a specific question about "Find Context."
          *   *Ritual:* Add a "Ritual Stop" requiring positive evidence (placement, association, not just weirdness).
          *   *Silence:* Add a "Negative Evidence" test (is it missing everywhere or just here?).
          *   *Standardization:* Differentiate "Skill" from "Rule."

  3.  **Drafting the Case Studies:**
      *   *Case 1: Bronze Figure (Loose find).*
          *   *User Wish:* Temple + Hereditary Priesthood.
          *   *Reality Check:* Loose ploughsoil = lost/discard. No context = no temple link. Single item = no institution.
          *   *Verdict:* Can exist. Cannot prove temple. Cannot prove priesthood. High risk of "Ritual" dumping.
      *   *Case 2: Clay Sealings (Burned room).*
          *   *User Wish:* Redistribution economy + Proto-scribe.
          *   *Reality Check:* Sealings = administration. Multiple marks = few authorities. Burned room = archive destruction.
          *   *Verdict:* Strong evidence for economy/officials. "Scribe" is risky (could be owner marking own goods).
      *   *Case 3: Loom Weights (House).*
          *   *User Wish:* "Whatever it can bear" (suspects less than wanted).
          *   *Reality Check:* Standardization = skill/tradition, not necessarily state rule. Domestic context = household production, not necessarily factory.
          *   *Verdict:* Good for tech/skill. Weak for state/institution. Strong for household economy.

  4.  **Refining the Meta-Commentary & Limitations:**
      *   *Authorial Choices:* Need to highlight where the writer decides to break the rules for the story.
      *   *Limitations:* The procedure relies on the writer's honesty and knowledge base. It can't fix wrong premises. It can't predict new excavations.
      *   *Habit/Double-Check:* The "Reverse Outline" or "The Specialist's Red Pen" simulation.

  5.  **Review against Constraints:**
      *   *Fast?* Yes, the questions are direct.
      *   *No Library?* Yes, relies on logic and internal consistency.
      *   *Blunt?* Yes, explicitly telling the user where they will be "burned."
      *   *Three Claims Separated?* Yes, the procedure structures around Existence, Meaning, Institution.
      *   *Pain Points Covered?* Deposition, Wear, Equifinality, Ritual, Silence, Standardization all have specific steps.

  6.  **Final Polish (Tone and Voice):**
      *   Ensure the voice is professional but direct. Avoid academic jargon unless defined simply (e.g., "Equifinality").
      *   Make sure the "Stop" conditions are visually distinct.
      *   Ensure the distinction between "Character Knowledge" and "Reader Knowledge" is clear.

  *(Self-Correction during drafting)*: I initially thought about suggesting they look up similar finds. *Correction:* No, the prompt says "no library, no time." The procedure must rely on *logic* applied to the object's description, not external research during the draft. The research is done; this is the *application* filter. I need to make sure the "Silence" test doesn't require a database search, but rather a logical assessment of preservation bias.

  *(Refining the "Ritual" Stop)*: Make sure I define what counts as "Positive Grounds." It's not just "it's weird." It's "it's placed where people don't go" or "it's broken on purpose."

  *(Refining the "Standardization" Step)*: Distinguish between "Craft Consistency" (I learned from my dad) and "Administrative Consistency" (The State says 5 units).

  7.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is the procedure. It is designed to be a filter, not a research tool. You run this on the object description you already have. It forces separation of the three claims (Existence, Meaning, Institution) and bakes in the failure points you identified.

  ### The Object Vetting Protocol (OVP)

  **Time limit:** 10 minutes max.
  **Rule:** If you hit a **STOP**, you cannot write the scene as planned. You must change the object, the context, or the claim.

  #### Phase 1: Existence (The Physical)
  *Goal: Verify the object can physically exist without implying a society that doesn't match your setting.*

  1.  **Material Chain:** Do you know where the raw material comes from? (e.g., Tin for bronze, specific clay for seals).
      *   *If No:* **STOP.** You cannot claim trade routes or scarcity. The object is generic scenery.
      *   *If Yes:* Does the transport match your setting's tech? (Ox cart vs. Ship vs. Human carry).
  2.  **Tool Mark:** What tool made the marks on this object? (Chisel, mold, fingernail, kiln).
      *   *Check:* Does that tool exist in your timeline?
  3.  **Time Cost:** How many days of labour does this object represent?
      *   *Check:* Who can afford to spend that time? (A peasant cannot spend a season making a bronze figure unless they are fed by someone else).

  #### Phase 2: Biography (The Deposition & Wear)
  *Goal: Prevent inferring "Life" from "Death." How the object ended up limits what it tells you about how it was used.*

  4.  **Find Context:** How did this object get into the ground/scene?
      *   *Options:* In use (on a shelf), Discarded (midden), Lost (floor), Hoarded (buried), Ritual (broken/burned/buried deep), Grave (with dead).
      *   *Constraint:* **Loose/Ploughsoil = Lost or Discarded.** You cannot infer a building (temple/house) existed at the exact spot it was found.
  5.  **Wear Pattern:** Does the wear match the intended use?
      *   *Check:* A knife sharpened to a needle is a tool. A knife buried sharp is a status symbol or new. A knife bent double is ritual or scrap.
      *   *Character Horizon:* Could your character see this wear? (Is it microscopic, or obvious?)
  6.  **The Equifinality Test:** Write down two different histories for this object that result in the exact same physical state.
      *   *Example:* A broken pot in a fire. History A: Accident during cooking. History B: Deliberate smashing during a raid.
      *   *Requirement:* If your scene relies on History A, you must acknowledge History B is possible, or add evidence that rules B out.

  #### Phase 3: Social Weight (Meaning & Institution)
  *Goal: Stop collapsing "Made," "Sacred," and "Official."*

  7.  **The Ritual Stop:** Do you want to call this sacred/ritual?
      *   *Requirement:* You need **Positive Grounds**. "Weird" is not enough.
      *   *Valid Grounds:* Deliberate breaking, placement in inaccessible space, association with human remains, consumption by fire without utility.
      *   *If you lack these:* **STOP.** It is secular. It might be *treated* as sacred by a character, but it is not *institutionally* sacred.
  8.  **The Standardization Test:** You have a batch of similar objects. Do they imply a Rule or a Habit?
      *   *Rule (Institution):* Identical weight/size across different locations/materials. Implies officials/measures.
      *   *Habit (Craft):* Similar size within one workshop, drifts over time. Implies training/tradition.
      *   *Decision:* Which are you writing? If "Rule," where is the enforcer?
  9.  **The Silence Test:** Nothing like this exists in the real archaeological record for this period/region.
      *   *Question:* Is it missing because it rots (wood/textile) or because it didn't exist (plastic/steel)?
      *   *If it should survive (stone/metal) and doesn't:* **STOP.** You are inventing a technology or social form that left no trace. You must own this invention in the text or notes.
      *   *If it rots:* You are safe to infer, but cannot prove.

  #### Phase 4: The Character Horizon
  *Goal: Ensure the character isn't an archaeologist.*

  10. **Knowledge Check:** What can the character know about this object *in the moment*?
      *   They know who made it? (Only if they saw it or know the maker).
      *   They know what it means? (Only if they are initiated/official).
      *   They know it's old? (Only if it's visibly antique/heirloom).
      *   *Constraint:* A character cannot know an object is "ritual" unless they are told or see the ritual act. They cannot know an object is "standardized" without measuring it against another.

  ---

  ### Case Studies

  Here is the protocol applied to your three scenarios. I will be blunt about where the procedure kills the idea.

  #### Case 1: Small Bronze Figure (Loose, Ploughsoil, No Context)
  *User Wish:* Temple + Hereditary Priesthood.

  *   **Phase 1 (Existence):** Bronze exists. Material chain implies trade (tin/copper). Time cost is high (specialist caster). *Pass.*
  *   **Phase 2 (Biography):**
      *   *Q4 Context:* Ploughsoil/Loose. **STOP.** This object is divorced from its building. It could have been lost 5 miles from where it was made. It proves nothing about a temple *here*.
      *   *Q6 Equifinality:* History A: Votive offering thrown from a temple. History B: Loot dropped by a raider. History C: Scrap metal lost by a trader.
  *   **Phase 3 (Social Weight):**
      *   *Q7 Ritual Stop:* No attributes, no break, no context. **STOP.** You cannot call this institutional ritual. It is a "votive" only if you assert it is.
      *   *Q9 Silence:* Small bronze figures are rare in many Bronze Age contexts. If this is a "god," where are the others?
  *   **Phase 4 (Character):** Character finds it in a field. They know it's valuable (bronze). They do not know it's a god.

  **Verdict:**
  *   **Carries:** Wealth, trade connections, specialist craft skill.
  *   **Won't Carry:** A temple at this location. A priesthood. A specific deity.
  *   **The Burn:** If you build a temple scene on this, a specialist will tear it apart. This is a "lost item," not a "foundation deposit."
  *   **Authorial Call:** You can write a character *believing* it's a god, but the narrative cannot treat that as objective fact. You must invent the temple; this object does not license it.

  #### Case 2: Clay Sealings (Burned Room, Jar Mouths, Marks)
  *User Wish:* Redistribution Economy + Proto-Scribe.

  *   **Phase 1 (Existence):** Clay is cheap. String rots. *Pass.*
  *   **Phase 2 (Biography):**
      *   *Q4 Context:* Burned room + Cluster. This is an archive destruction event. High information value.
      *   *Q5 Wear:* Fired clay = permanent record.
  *   **Phase 3 (Social Weight):**
      *   *Q8 Standardization:* 2-3 marks repeated. This is **Rule**, not Habit. Specific people are authorizing goods.
      *   *Q7 Ritual Stop:* Not ritual. Administrative.
      *   *Q9 Silence:* Sealings are common in Bronze Age palaces. Safe.
  *   **Phase 4 (Character):**
      *   *Q10 Knowledge:* Can the "almost scribe" read the marks?
      *   *Constraint:* If the marks are logos (owner marks), anyone can recognize them. If they are script, he needs literacy.
      *   *Equifinality:* Are these taxes (State) or storage (Merchant)?

  **Verdict:**
  *   **Carries:** Bureaucracy, control of surplus, specific authorized individuals. Strong license for "Redistribution."
  *   **Won't Carry:** A full "State" necessarily (could be a wealthy merchant house).
  *   **The Burn:** The "Scribe" title. If he can't write, only read marks, he is a "Counter" or "Steward." "Scribe" implies script.
  *   **Authorial Call:** You are safe on the economy. Be careful on the title. The "Burn" is your friend here—it explains why the records stopped.

  #### Case 3: Loom Weights (Ordinary House, Standardized)
  *User Wish:* "Whatever it can bear" (Suspects less than wanted).

  *   **Phase 1 (Existence):** Fired clay. Cheap. *Pass.*
  *   **Phase 2 (Biography):**
      *   *Q4 Context:* Ordinary house. Domestic sphere.
      *   *Q5 Wear:* Weights don't wear much.
  *   **Phase 3 (Social Weight):**
      *   *Q8 Standardization:* Within a couple of grams. **CRITICAL CHECK.**
      *   *Analysis:* Is this State Standardization or Craft Skill? In a domestic house, this is likely **Craft Skill/Tradition**. A weaver makes weights to balance her own loom.
      *   *Institution Check:* Does this prove a Guild? No. Does it prove a Tax? No. It proves a skilled weaver who knows tension.
      *   *Q9 Silence:* Loom weights are ubiquitous. Safe.
  *   **Phase 4 (Character):**
      *   *Q10 Knowledge:* The character knows the weight is right for the thread.

  **Verdict:**
  *   **Carries:** High skill level, domestic production, textile economy.
  *   **Won't Carry:** State regulation, factory production, official measures.
  *   **The Burn:** You suspected right. Standardization in a house is habit, not law. If you write an "Inspector of Weights" coming to check these looms, you will be burned.
  *   **Authorial Call:** Use this to show the *woman's* expertise, not the *state's* reach.

  ---

  ### Authorial Choice Points (The "You" Decisions)

  The procedure flags risks; it does not make the story. You must decide these three things explicitly before drafting:

  1.  **The Invention Line:** Which objects are "Real" (archaeologically attested) and which are "Invented" (necessary for plot)?
      *   *Action:* In your notes, mark Invented objects with an asterisk. If a specialist asks, you can say, "I know this isn't attested; it serves a narrative function."
  2.  **The Character Blindspot:** Where will you let the character be wrong?
      *   *Action:* Decide if the character thinks the Bronze Figure is a god (Subjective) or if the Narrator says it is a god (Objective). The Procedure forbids the Narrator from saying it unless Phase 3 is passed.
  3.  **The Silence Wager:** When you write something that hasn't been found (e.g., a wooden temple), are you betting on preservation bias?
      *   *Action:* If yes, ensure the text acknowledges the impermanence. "The wood rots, but the memory stays."

  ### Limitations & The False Green Light

  This procedure cannot save you from **Wrong Premises**.
  *   **The Trap:** If your fundamental understanding of the Bronze Age economy is wrong (e.g., you assume money exists when it doesn't), the OVP will still give you a green light on the *object*, because the object logic holds internally.
  *   **The Double-Check:** Once a month, take a scene that passed the OVP and ask: "If I removed this object, would the social structure collapse?"
      *   *If Yes:* You are leaning too hard on one artifact. Add redundancy (texts, architecture, dialogue) to support the claim.
      *   *If No:* The object is scenery. Stop worrying about it.

  **Final Habit:** When you finish a draft, search for the word "Ritual." Highlight every instance. For each highlighted word, demand the **Positive Grounds** from Phase 3, Step 7. If you can't point to the break, the fire, or the burial, change the word to "Custom," "Habit," or "Law."
