answer: |-
  This is a delightful problem. You have stumbled upon the intersection of curation and metaphysics without a map, and you are navigating it correctly. Your committee has been practicing applied mereology (the study of parts and wholes) and persistence conditions (what makes an object the *same* object over time) for decades, disguised as collection management.

  The "statue-and-the-clay" problem (often associated with the work of David Wiggins or Lynne Baker) asks whether an object is defined by its material constitution (the clay) or its form/history (the statue). In museum terms, this translates to: **Is a specimen defined by its physical matter, or by its institutional biography?**

  Here is an analysis of your precedents, the conflict they reveal, and a recommendation for minuting the decision.

  ### 1. The Two Competing Rules
  Your precedents are not consistent because they rely on two different metaphysical principles that you have been applying situationally.

  **Rule A: Material-Historical Continuity (The "Clay" View)**
  *   **Definition:** Identity persists as long as the physical material originates from the same source individual, regardless of fragmentation or distribution, provided the chain of custody is unbroken.
  *   **Supporting Precedents:**
      *   *The Iron Meteorite (Offcuts):* Material removed but kept in-house = Same Specimen.
      *   *The Petrified Wood (Cracked):* Spatial separation without custody loss = Same Specimen.
      *   *The Trilobite (Prepared):* Massive material loss = Same Specimen (because the remaining material is continuous with the original).
  *   **Implication for New Case:** Since the 900g fragment is compositionally identical and originated from the founding mass, it is part of the founding specimen.

  **Rule B: Custodial-Integrity Continuity (The "Statue" View)**
  *   **Definition:** Identity is tied to the specific spatio-temporal path of the object *under museum care*. If the object leaves the institution's legal custody, the "museum identity" is broken. Re-acquisition creates a new historical object (a reconstruction or a return), not a continuation.
  *   **Supporting Precedents:**
      *   *The Geode (Sold & Reglued):* Left custody + returned = Reconstruction (Not Original).
      *   *The Resin Cast:* Same form/material proxy, but different causal origin = New Object.
      *   *The Dissolved Fossil:* Material continuity lost = Identity lost.
  *   **Implication for New Case:** Since the fragment left the institution in 1912 and the paperwork is gone, the custodial chain is broken. It is a new object made of old stuff.

  ### 2. The Closest Analog
  The **Geode** is the closest analog, not the Meteorite Offcuts.

  Here is the distinction: The Meteorite Offcuts precedent explicitly states the slices are in "twelve drawers." They were distributed *internally*. They never left the museum's legal possession. The Geode, however, was "sold off." It entered the market and left institutional custody.

  The 900g fragment was "given to another institution." Like the Geode, it suffered **alienation**.

  If you rule that the fragment is the Founding Specimen, you are implicitly overruling the Geode precedent. You are stating that *Material Origin* trumps *Custodial History*. If you rule it is a New Specimen, you are upholding the Geode precedent and treating the Meteorite Offcuts rule as limited to *internal* distribution.

  ### 3. Recommendation
  To maintain consistency with the **Geode** precedent (which protects the museum against provenance creep and legal ambiguity), you should accession this as a **New Specimen**, linked to the Founding Specimen.

  Why? Because museum registry is not just about physics; it is about legal and administrative history. The "Founding Specimen" is a legal entity as much as a physical one. By allowing a fragment that left custody for a century to return as the *original*, you blur the line between "original holding" and "repatriated material." This sets a dangerous precedent for deaccessioned items.

  ### 4. Draft Minute
  If I were sitting beside you, I would propose we minute it as follows:

  > **Committee Decision: Acquisition of Meteorite Fragment (900g)**
  >
  > **Motion:** To accession the 900g iron meteorite fragment as Specimen #2024.001, with a cross-reference link to Founding Specimen #1, rather than amalgamating it into Specimen #1.
  >
  > **Rationale:** While geochemical analysis confirms the fragment is material from the original 1912 mass, Committee precedent regarding the 1950s Geode (Case #G-50) establishes that material alienation (sale or transfer out of custody) breaks the continuity of museum identity. Upon return, such material is classified as a Reconstruction or Related Specimen, not the Original.
  >
  > Although the 1912 Meteorite Offcuts (Case #M-12) were retained under the original number, those materials never left institutional custody. As the offered fragment was held by an external institution for 112 years with no chain of custody documentation, it fits the Geode precedent. Amalgamation would compromise the integrity of the Founding Specimen's registration history.
  >
  > **Action:** Accession as related material; update Founding Specimen record to note the existence of the fragment.

  ### 5. Underdetermination and The Test Case
  You are correct that your record underdetermines this. If the committee votes the other way (to make it the Founding Specimen), they are signing onto **Principle A (Material Essentialism)**. They are declaring that the "rock" is the specimen, not the "museum's rock."

  If you want to force the committee to clarify which rule they actually follow (so you don't have this argument again in ten years), you need a **Test Case** that isolates *Custody* from *Material*.

  **The Proposed Test Case:**
  Put the following hypothetical to the committee for a policy ruling:

  > "A curator legally deaccessions a specimen in 1980 and donates it to a private collector. In 2025, the collector's heir donates it back to us. The physical object is unchanged. Do we restore the original register number, or assign a new one?"

  *   **If they say "Restore Original":** They are prioritizing **Material Continuity**. You should then accept the meteorite fragment as the Founding Specimen (and admit the Geode ruling was an outlier or based on the "reassembly" aspect).
  *   **If they say "New Number":** They are prioritizing **Custodial Continuity**. You must reject the meteorite fragment as the Founding Specimen (and perhaps revisit the Meteorite Offcuts rule to ensure it doesn't apply to external loans).

  ### Summary
  You are dealing with the **Ship of Theseus** in a drawer.
  *   **Trilobite/Meteorite Offcuts:** Theseus's ship stays in the harbor; we replace planks (preparation) or store the old planks in the basement (offcuts). It's still the ship.
  *   **Geode/New Fragment:** Theseus's ship is sold, sails away for a century, and is towed back. Is it the same ship?

  For a university museum, the safe philosophical bet is **No**. The "Ship" is defined by its logbook (registry) as much as its timber. Minute it as a return, not a continuation.
