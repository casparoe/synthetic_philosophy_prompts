      *   *Principle B (Custodial/Administrative Continuity):* Focuses on the museum's relationship to the object. Identity is tied to the chain of custody and the specific institutional history. This aligns with the *Geode* precedent (sold off = reconstruction) and distinguishes the *Meteorite Offcuts* (never left custody).
      *   *The Tension:* The Meteorite Offcuts case says "distributed parts = same specimen." The Geode case says "sold parts + return = reconstruction." The new case is "lost parts + return = ?"

  5.  **Determine the Closest Analog:**
      *   *Closest:* The Iron Meteorite offcuts (same material, same origin).
      *   *Distinguishing Factor:* Custody. The offcuts stayed in the museum. The geode left and came back. This fragment left and is coming back.
      *   *Verdict:* This is the pivot point. If we follow the *Meteorite* rule, it's the founding specimen. If we follow the *Geode* rule, it's a reconstruction/new object.

  6.  **Drafting the Response:**

      *   **Acknowledgment:** Validate the user's philosophical intuition. Yes, this is exactly the Ship of Theseus / Statue & Clay problem applied to curation.
      *   **Analysis of Precedents:** Group them into the two competing principles identified above.
          *   *Principle 1: Material-Historical Identity* (The "Clay" view). Supported by Trilobite, Petrified Wood, Meteorite Offcuts.
          *   *Principle 2: Custodial-Integrity Identity* (The "Statue/Museum" view). Supported by Dissolved Fossil, Geode, Resin Cast.
      *   **The Conflict:** The new case pits Principle 1 (It's the same stuff) against Principle 2 (It left the building).
      *   **Recommendation:**
          *   *Option 1 (Assimilate):* Treat as Founding Specimen. Argue that meteorites are "distributable objects" (like holy relics or art editions) where material origin trumps custody.
          *   *Option 2 (Accession New):* Treat as Related Specimen. Argue that chain of custody defines museum identity.
          *   *My Advice:* Given the "Founding Specimen" status, *Custodial Integrity* usually wins in museum ethics to prevent provenance fraud, *but* the Meteorite Offcut precedent is strong. However, the Geode precedent is the specific counter-example for things that leave.
          *   *Decision:* The Geode precedent is the stronger analog for *objects that leave custody*. The Meteorite offcuts never left. Therefore, consistency suggests treating it as a **new accession (linked record)**, not the original register number.
      *   **Minuting:** How to write this formally. Needs to cite the specific precedents.
      *   **Underdetermination & Future Test:** If the committee is split, what principle are they signing?
          *   *Principle X:* "Identity follows Matter."
