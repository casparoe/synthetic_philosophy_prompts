      *Correction:* I need to make sure I distinguish between *internal distribution* (Meteorite) and *external alienation* (Geode/New Case).

      *Wait, one more nuance:* The user says "composition will verify it's our rock." In meteoritics, a "pairing" is often established. But registry is legal/administrative.
      *Decision:* I will argue that the *Geode* precedent controls because of the break in custody, despite the *Meteorite* precedent controlling the material nature. This creates the philosophical tension the user enjoys.

