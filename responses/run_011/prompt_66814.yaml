          *   *Test Case:* A loaned specimen that is damaged and repaired off-site. Or a specimen deaccessioned and donated back by the *same* curator who took it.

  7.  **Refining the Philosophy:**
      *   Use terms like "Mereological Sum," "Spatio-Temporal Continuity," "Constitution View."
      *   Highlight the "Meteorite Exception." Meteorites are often treated differently in science because they are "falls." A piece of a fall *is* the fall. But museum registry is about *institutional* history, not just cosmic history.

