      *   **Tone:** Professional, academic, slightly philosophical (matching the user's interest), practical (museum curation context).
      *   **Key Constraint:** The user explicitly mentions the "statue-and-the-clay" problem (material constitution, persistence conditions, identity over time). This is the lens through which they want the problem analyzed.

  2.  **Analyze the Precedents:**
      *   *Trilobite Block (95% removed):* Identity persists despite massive material loss. (Principle: *Form/Informational Continuity* or *Historical Continuity of the Specific Individual*).
      *   *Dissolved Fossil (Matrix only):* Identity lost when the specific material/form is gone. (Principle: *Material/Form Necessity*).
      *   *Petrified Wood (Cracked in two):* Spatial separation doesn't create new identity if parts remain associated. (Principle: *Mereological Essentialism* relaxed by *Administrative Unity*).
      *   *Iron Meteorite (Cut down, offcuts kept):* Material removal doesn't destroy identity; distributed parts count as one. (Principle: *Historical Origin + Administrative Control*). **Crucial Precedent.**
      *   *Resin Cast:* Copy is not the original. (Principle: *Causal History/Origin*).
      *   *Geode (Sawn, sold, reglued):* Disruption of custody + reassembly = Reconstruction, not Original. (Principle: *Continuity of Custody/Integrity*).

  3.  **Analyze the New Case:**
      *   **Object:** 900g fragment of the founding iron meteorite.
