  Part Three

  **Opening Concession:**
  In your first five minutes, concede that the "custody" metaphor sounds abstract and that intentions *feel* like the source of force. Acknowledge that the intentionalist intuition is strong and natural. By validating their starting point, you disarm the intention-based theorists who might otherwise spend their question time proving you wrong about how it feels. Frame your theory not as denying the phenomenology, but as explaining the normative structure underneath it. This lowers the temperature and makes the "liability" shift seem like a discovery rather than a correction.

  **Feared Objection and Fallback:**
  The objection you hope nobody raises is the Grad Student's challenge on slurs (Objection 1). If it lands, it threatens to make your theory morally repugnant by suggesting victims bear liability for abuse. Your fallback is to rigidly distinguish "liability for the harm" from "standing to be wronged." If pressed, concede that "liability position" is imperfect terminology for "normative standing." Emphasize that uptake makes the hearer the *creditor* of the norm, never the debtor. If this distinction fails, pivot to the idea that withholding uptake is a defensive maneuver that prevents custody from ever attaching.

  **Move to Abandon:**
  Be prepared to abandon Move 5 (the relocation of the Conventionalism vs. Intentionalism dispute) if the discussion turns hostile. This move is the meta-philosophical payoff, not the engine of the theory. If you lose the audience on the Grice/Strawson/Austin taxonomy wars, your core liability thesis (Moves 1–4) still stands. Sacrificing the claim to resolve the field's standing dispute allows you to retain the substantive claims about contracts, chatbots, and infelicity without getting bogged down in historical exegesis that might alienate the law faculty.
