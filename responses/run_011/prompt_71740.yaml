  4.
  - Objector: Intention Theorist (General)
  - Said aloud: "If intentions are the mechanism for taking liability, you haven't displaced intentionalism. You've just made intentions the trigger for your liability scheme."
  - Targets: Move 5
  - Damage: 3. Reduces the view to a variant of intentionalism, losing the distinctive "allocation" claim.
  - Reply: Intentionalism says intentions *constitute* the force. I say intentions signal the assumption of liability, but the force comes from the liability itself. If I signal liability without intention (corporate apology), I still bind. If I have intention without signal (mumbled promise), I don't. The weight sits on the liability position, not the mental state. Intentions are the switch, not the power source.
  - Soft spot: Corporate apology example is key. Hold it.

  5.
  - Objector: Sociolinguist
  - Said aloud: "You're building a theory of interaction on invented examples. In real talk, 'liability' is negotiated turn-by-turn, not assigned by abstract convention."
  - Targets: Move 1
  - Damage: 3. Undermines empirical validity and suggests the theory is armchair fantasy.
  - Reply: I'm not describing the temporal negotiation; I'm describing the normative skeleton underneath it. Conversation analysis shows *how* people manage trouble; I'm asking *who pays* when management fails. Your data shows the repair; my theory explains why repair is needed. We're looking at different layers of the same phenomenon.
  - Soft spot: Can sound dismissive of CA. Reframe as complementary.

  6.
  - Objector: Graduate Student / Intention Coalition
  - Said aloud: "If a chatbot says 'I promise' and I rely on it, the company is liable. Why say the bot didn't promise? The functional outcome is identical."
  - Targets: Move 4(c)
  - Damage: 3. If functionalism works, the metaphysical distinction is otiose.
  - Reply: Functional outcomes aren't enough for speech acts. A recording can induce reliance, but it doesn't promise. The bot is a tool; the company is the principal. Saying the bot promises confuses the instrument with the agent. My view clarifies *why* the company is liable: because they hold custody, not because the bot has a mind.
  - Soft spot: "Tool vs. Agent" is standard. Hold it.

  7.
  - Objector: Contracts Scholar
  - Said aloud: "If uptake is liability, can a child give uptake? Your theory seems to ignore legal capacity rules regarding who can bear liability."
  - Targets: Move 3
  - Damage: 2. Shows lack of legal nuance regarding capacity.
  - Reply: Capacity rules are exactly custody rules. A child cannot take custody of a contract, so no uptake occurs. My theory predicts the legal doctrine: no liability position change means no contract. It explains *why* capacity matters, not just *that* it matters.
  - Soft spot: Might be circular. Concede it needs integration with capacity doctrine.

  8.
  - Objector: General / Philosophy Faculty
  - Said aloud: "You say corporate apologies are felicitous without sincerity. But the whole point of an apology is moral acknowledgment. You've saved felicity by killing the morality."
  - Targets: Move 4(b)
  - Damage: 2. Makes the theory morally shallow.
  - Reply: I'm analyzing the speech act, not the moral worth. A check is valid even if the payer hates you. The apology acts as a settlement of liability; sincerity is a separate moral virtue. My view explains why we accept corporate apologies despite knowing they're drafted by lawyers.
  - Soft spot: Risks separating law and morality too sharply. Hold it.

