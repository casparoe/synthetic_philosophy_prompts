      *Refining for the Prompt's Specific Variables:* The prompt asks to vary specific things: "someone" (rival vs everyone), "will" (certainty vs likelihood), built anyway vs sooner, power vs permission vs interest, causal vs signal, single vs category harm. I need to make sure I hit these specific distinctions.

  4.  **Evaluating the VP's Intent & Missing Premise:**
