  # The Augustinian Decision Tree for Testimony

  *   Did you speak in a way that let your listener know you were not trying to trick them?
      *   **Yes, the manner signaled no deceit.** → **Leaf 1: Joke (*iocosa*).** Augustine's term. You have made a playful utterance, not a lie, because the context forbids belief.
      *   **No, you spoke seriously.** → *Proceed to Mind.*
          *   Did you believe the impression your words would create was true?
              *   **Yes, you believed the impression was true.** → **Leaf 2: Error (*error*).** Augustine's term. You have spoken falsehood, but not a lie, because your mind agreed with your words.
              *   **No, you knew the impression was false.** → *Proceed to Intent.*
                  *   Did you want your listener to believe what you said?
                      *   **No, you did not care if they believed.** → **Leaf 3: Irony (*unnamed*).** Augustine faced this but declined to name it as a distinct category; he often folds it into lying if deception occurs. **UNDERDETERMINED**: Augustine requires intent to deceive for a lie, but if the listener is deceived despite your lack of intent, his criteria waver; a stipulation on listener uptake is needed to close this.
                      *   **Yes, you intended them to believe.** → *It is a Lie. Proceed to Gravity.*
                          *   Was your purpose to teach something about God or faith?
                              *   **Yes, it concerned religious doctrine.** → **Leaf 4: Lie in Religion (*in doctrina religionis*).** Augustine's term. You have committed the worst kind of lie, regardless of any good you hoped to achieve.
                              *   **No, it was secular.** → *Proceed to Harm.*
                                  *   Did you aim to hurt someone who deserved no hurt?
                                      *   **Yes, you intended unjust harm.** → **Leaf 5: Malicious Lie (*perniciosum*).** Augustine's term. You have lied to injure, which is sinful regardless of whether the injury succeeded.
                                      *   **No, you intended no unjust harm.** → *Proceed to Conflict.*
                                          *   Did you aim to help one person by hurting another?
                                              *   **Yes, you intended mixed justice.** → **Leaf 6: Lie of Conflict (*quo alteri prodest et alteri nocet*).** Augustine's term. You have lied to shift burden or benefit, which remains sinful even if one party gains.
                                              *   **No, you intended harm to none.** → *Proceed to Motive.*
                                                  *   Did you lie simply for the enjoyment of deceiving?
                                                      *   **Yes, you enjoyed the deceit.** → **Leaf 7: Wanton Lie (*mendacium voluptatis*).** Augustine's term. You have lied for pleasure, which sins against truth itself without external excuse.
                                                      *   **No, you sought some good.** → *Proceed to Politeness.*
                                                          *   Did you lie merely to be pleasant in conversation?
                                                              *   **Yes, you sought social ease.** → **Leaf 8: Social Lie (*officiosum in sermone*).** Augustine's term. You have lied for courtesy, which is a minor sin but still a rupture of fidelity.
                                                              *   **No, you sought protection.** → *Proceed to Property.*
                                                                  *   Was your purpose to protect someone's money or goods?
                                                                      *   **Yes, you aimed to save property.** → **Leaf 9: Lie for Property (*quo pecunia servatur*).** Augustine's term. You have lied for material gain or retention, which is less grave than harming life but still sinful.
                                                                      *   **No, you sought bodily safety.** → *Proceed to Life.*
                                                                          *   Was your purpose to protect someone's life?
                                                                              *   **Yes, you aimed to prevent death.** → **Leaf 10: Lie for Life (*quo vita servatur*).** Augustine's term. You have lied to save a life, which is the most excusable lie but remains a sin.
                                                                              *   **No, you sought other safety.** → *Proceed to Purity.*
                                                                                  *   Was your purpose to protect someone from sexual violation?
                                                                                      *   **Yes, you aimed to save purity.** → **Leaf 11: Lie for Purity (*quo pudicitia servatur*).** Augustine's term. You have lied to shield bodily integrity, which Augustine ranks as the least bad lie.
                                                                                      *   **No, it fits none above.** → **Leaf 12: Unnamed Residual (*unnamed*).** Augustine never faced the case or declined to name it; it covers officious lies not fitting the specific hierarchy. You have lied for a good end not captured by the standard eight types.

  ## Honest Gaps

  **Underdetermined Nodes:**
  *   **Leaf 3 (Irony):** Augustine states a lie requires the *will* to deceive. If a speaker utters falsehood without intent to deceive, but the listener is deceived, Augustine's definition of the *sin* is clear (none), but his pastoral advice on the *utterance* is vague. To close this, one must stipulate whether the speaker's negligence in signalling irony counts as a form of intent.

  **Indistinguishable Leaves:**
  *   **Leaf 8 (Social) and Leaf 12 (Unnamed):** Both cover officious lies that harm no one. Augustine distinguishes them by specific intent (pleasing conversation vs. other good), but in practice, the boundary is porous. A further question on *whose* pleasure is served (speaker vs. listener) would separate them.

  **Empty Combinations:**
  1.  **Lie in Religion + Protect Someone's Life:** Logically available (lie about doctrine to save a life), but the cell is empty because Augustine views religious truth as absolute; he never thought of it as a valid combination because divine truth cannot be traded for human safety.
  2.  **Wanton Lie + Protect Someone's Life:** Logically available, but the cell is empty because the view is incoherent; one cannot lie *merely* for enjoyment and *simultaneously* for the specific purpose of saving a life.
  3.  **Malicious Lie + Help No One:** Logically available, but the cell is empty because it is unattractive; Augustine defines malicious lies by their intent to injure, which implies a benefit to the speaker (vengeance) or harm to the victim, so 'helping no one' contradicts the motive.

  ## Test Cases

  **(a) The Investigative Journalist**
  *   **Path:** Serious → Knew impression false → Intended belief → Religious doctrine (Priscillianist belief concerns faith) → **Leaf 4: Lie in Religion.**
  *   **Verdict:** This is the specific case of *Contra Mendacium*. Augustine condemns it absolutely. Even to convict heretics, one cannot lie about one's own faith, because truth in religion is the foundation of all authority.

  **(b) The Witness under Cross-Examination**
  *   **Path:** Serious → Knew impression false (intended to convey innocence while guilty) → Intended belief → Intended mixed justice (help self/justice, hurt accused) → **Leaf 6: Lie of Conflict.**
  *   **Verdict:** Augustine rejects equivocation. If the mind reserves a meaning contrary to the signification received by the listener, it is a lie. The literal truth of the words does not save the speaker if the intended impression is false.

  **(c) The Parent and the Parcel**
  *   **Path:** Serious (to the child) → Knew impression false → Intended belief → No harm → No conflict → No wanton pleasure → Social/Officious (to please child) → **Leaf 8: Social Lie.**
  *   **Verdict:** Because the parent intends the child to believe the falsehood, it is not a joke (Leaf 1). It is an officious lie told for pleasure (the child's joy). Augustine would classify this as sinful, though minor.

  **(d) The Man at the Door**
  *   **Path:** Serious → Knew impression false → Intended belief → No harm → No conflict → No wanton → No social → No property → Intended to prevent death → **Leaf 10: Lie for Life.**
  *   **Verdict:** This is the classic 'murderer at the door'. Augustine classifies it as a lie. It is the most excusable type (along with purity), but it remains a sin. One must not do evil (lie) that good (life) may come.

  **(e) The Comedian**
  *   **Path:** Manner signaled no deceit → **Leaf 1: Joke.**
  *   **Verdict:** Not a lie. The register announces that no deceit is intended. The mismatch between words and mind is mutually understood as play.

  **(f) The Colleague**
  *   **Path:** Serious → Believed impression true → **Leaf 2: Error.**
  *   **Verdict:** Not a lie. The speaker's mind aligns with the words. The falsehood is in the world, not in the speaker's will.

  **(g) The Jerome/Antioch Incident**
  *   **Path:** Serious → Knew impression false (if theatre) → Intended belief (for benefit of Christians) → Religious doctrine (Scripture/Apostles) → **Leaf 4: Lie in Religion.**
  *   **Verdict:** This node does the rejecting. Augustine rejects Jerome's 'white lie' theory of Scripture because if the Apostles lied in conduct, Scripture lies in record. This node comes before any question of good because if the utterance is a lie in religion, no benefit can justify it; the authority of Truth itself is the prior good.

  ## Diagnosis

  **The Structural Node of Absolutism:**
  The node asking: **"Was your purpose to protect someone's life?"**

  **Alteration:**
  To convert this tree into an ordinary moderate account, the 'Yes' branch from this node must lead to a leaf labelled **"Permissible Deception"** rather than **"Lie for Life (Sin)"**.

  **Augustine's Loss:**
  Augustine would say he had lost the **integrity of Truth as a divine attribute**. For Augustine, God is Truth and the Devil is the Father of Lies; there is no middle ground. By inserting a permission here, you make utility (saving a life) superior to fidelity (speaking truth). You collapse the distinction between the City of God and the City of Man, allowing human calculation to override divine command. The absolutism is not distributed; it is anchored here, where the greatest human good (life) is still deemed lesser than the divine good (truth).

  ## Severity

  **Ordering of Lies (Worst to Least Bad):**

  1.  **Lie in Religion (Leaf 4):** Worst, because it injures the soul and God directly.
  2.  **Malicious Lie (Leaf 5):** Injures an innocent neighbour; sins against charity.
  3.  **Lie of Conflict (Leaf 6):** Helps one by injuring another; sins against justice.
  4.  **Wanton Lie (Leaf 7):** Sins against truth for no end but pleasure; pure corruption.
  5.  **Social Lie (Leaf 8):** Sins against fidelity for mere courtesy; trivial but habitual.
  6.  **Lie for Property (Leaf 9):** [Reconstruction] Saves material goods; less grave than bodily harm.
  7.  **Lie for Life (Leaf 10):** [Reconstruction] Saves bodily life; grave matter but excusable motive.
  8.  **Lie for Purity (Leaf 11):** [Reconstruction] Saves bodily integrity; Augustine ranks this lowest as the injury prevented is most intimate.

  *Note: Augustine explicitly orders the first five in *De Mendacio*. The ordering of 6–8 is inferred from his hierarchy of goods (spiritual > bodily life > bodily integrity > property), though he sometimes varies the position of property and purity.*
