  2.  **Deconstruct the Philosophy (The Knobe Effect):**
      *   *Standard Effect:* People say a side effect is brought about "intentionally" if it's bad (harm), but "unintentionally" if it's good (help), even if the agent's attitude toward the side effect is identical (indifference).
      *   *Condition 3 Goal:* The prompt asks for a condition where the pattern *breaks* or *shrinks*. Specifically: "a side effect nobody would praise or blame anybody for, where both versions come out as 'not on purpose'."
      *   *Wait, a nuance check:* The standard Knobe effect relies on moral valence. If I remove moral valence (neutral), people usually say "unintentional" for both. This confirms the moral judgment drives the intentionality ascription.
      *   *The Prompt's specific request on Condition 3:* "Build it so the pattern breaks or at least shrinks... where both versions come out as 'not on purpose'." This aligns with the standard interpretation: No moral weight = No intentionality ascription for side effects.

  3.  **Drafting the Vignettes (Relatable Context):**
