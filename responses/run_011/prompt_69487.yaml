answer: |-
  ### Activity Design: The "Group Chat Admin" Experiment

  **Time:** 45 Minutes
  **Materials:** 14 printed slips (cut in half), markers, whiteboard.
  **Goal:** Demonstrate the asymmetry in intentionality judgments without naming the effect.

  #### 1. The Vignettes (Print & Cut)
  Print these on identical paper. Cut them into slips. Do not label them "Condition 1, 2, 3." Just mix them.

  **Slip Type A (Harm Side-Effect) — 5 copies**
  > Jordan is the admin of the senior class group chat. To stop spam bots, Jordan changes the settings so only admins can post messages. Jordan knows this means people won't be able to share funny memes during the day, but Jordan doesn't care at all about that; Jordan just wants to stop the spam. The settings are changed.
  >
  > **Question:** Did Jordan change the settings *on purpose* to stop people from sharing memes?
  > **Circle:** YES / NO
  > **Write one sentence:** Why?

  **Slip Type B (Help Side-Effect) — 5 copies**
  > Jordan is the admin of the senior class group chat. To stop spam bots, Jordan changes the settings so only admins can post messages. Jordan knows this means people will be able to focus better on schoolwork during the day, but Jordan doesn't care at all about that; Jordan just wants to stop the spam. The settings are changed.
  >
  > **Question:** Did Jordan change the settings *on purpose* to help people focus on schoolwork?
  > **Circle:** YES / NO
  > **Write one sentence:** Why?

  **Slip Type C (Neutral Side-Effect) — 4 copies**
  > Jordan is the admin of the senior class group chat. To stop spam bots, Jordan changes the settings so only admins can post messages. Jordan knows this means the chat icon will turn from blue to grey on everyone's phone, but Jordan doesn't care at all about that; Jordan just wants to stop the spam. The settings are changed.
  >
  > **Question:** Did Jordan change the settings *on purpose* to turn the icon grey?
  > **Circle:** YES / NO
  > **Write one sentence:** Why?

  #### 2. Distribution & Rules (5 Minutes)
  1.  Hand the slips out face-down as students enter. Tell them: *"Do not flip this over yet. Do not show your slip to anyone else. This is a silent reading exercise."*
  2.  Once everyone has one: *"Flip it over. Read the story. Answer the Yes/No question. Write exactly one sentence explaining why. You have 3 minutes. No talking."*
  3.  Collect the slips immediately after. Do not let them discuss yet.

  #### 3. The Whiteboard Tally (5 Minutes)
  Draw this grid on the board before class starts.

  | | **YES** (On Purpose) | **NO** (Not On Purpose) |
  | :--- | :---: | :---: |
  | **Story A (Memes)** | | |
  | **Story B (Focus)** | | |
  | **Story C (Icon)** | | |

  *   Read the slips aloud yourself and mark the tally marks.
  *   **Do not** reveal that Story A and B are identical except for one phrase until *after* the tally is done.
  *   **Do not** reveal Story C's purpose yet.

  #### 4. The Debrief Script (25 Minutes)

  **Step 1: The Reveal (5 mins)**
  "Look at the board. In Story A and Story B, Jordan's goal was identical: stop spam. Jordan's attitude was identical: 'doesn't care' about the side effect. Jordan's control was identical. Yet, our answers split."
  *(Point to the asymmetry. Ideally, A has more YES, B has more NO.)*
  "Now look at Story C. The control is the same. The indifference is the same. But the side effect is morally neutral."
  *(Point to Story C. Ideally, this is almost all NO.)*

  **Step 2: The Three Explanations (10 mins)**
  "Philosophers have three main theories for why we voted this way. I want you to tell me which one fits our data."

  1.  **The Blame Leak:** "We don't actually care about 'purpose.' We just want to blame people for bad stuff. If the outcome is bad, we call it 'intentional' so we can hold them responsible. If it's good, we call it 'accidental' so they don't get a big ego."
  2.  **The Skill Argument:** "It's about control. We call something 'intentional' if the agent had the skill to make it happen reliably. If they could have stopped it, they did it on purpose."
  3.  **The Different Question:** "We aren't answering the question asked. When you ask 'Did they do it on purpose?', we hear 'Should they have done it?' or 'Does this matter?' We are answering a moral question, not a psychology question."

  **Step 3: Analyzing Condition 3 (5 mins)**
  "Look at Story C (The Icon). Jordan had the exact same **Skill** and **Control** as in Stories A and B. Jordan knew the icon would change and changed the settings anyway."
  *   "If the **Skill Argument** were true, you should have voted YES for Story C, just like Story A. You didn't. So Skill isn't the main driver."
  *   "If the **Different Question** theory is true, you voted NO because the icon color doesn't matter morally."
  *   "If the **Blame Leak** theory is true, you voted NO because there is no blame to assign."

  "**Verdict:** Condition 3 primarily supports the **Blame Leak** explanation (and by extension, the Different Question). It shows that moral valence is the switch. When you remove the ability to praise or blame (Condition 3), the 'Intentional' label disappears, even though the agent's knowledge and control remained constant. This suggests 'Intentional' isn't a description of the mind; it's a tool for moral judgment."

  #### 5. Predictable Pitfalls & Limitations (10 Minutes)

  **What will go wrong with 14 kids:**
  *   **The Mushy Numbers:** With only 5 people per condition, a single stubborn student ruins the trend. You might get a 3-2 split instead of 5-0.
      *   *Fix:* Acknowledge it. "The trend is messy, but look at the *direction*. More people said Yes to Harm than Help. That's the signal."
  *   **The "Gotcha" Moment:** One kid will realize the stories are the same and shout it out before the tally.
      *   *Fix:* If they guess, ask them to stay quiet until the tally is done to preserve the data. "Don't spoil the experiment for your classmates."
  *   **The "Technically Yes" Crowd:** Some students (often the literal-minded ones) will say "Yes, they knew it would happen, so it was on purpose" for *all three*.
      *   *Fix:* This is actually data! It shows the "Skill/Knowledge" definition of intentionality. Contrast them with the "Moral" group.

  **What this activity CANNOT show (You must explain this):**
  *   **The Mechanism:** This activity proves the *effect* exists, but not *why*. It doesn't prove whether the moral judgment changes the concept of "intentional" itself, or if it just changes how we apply the word. (Is the brain seeing a different color, or just labeling the same color differently?)
  *   **The "Side-Effect" Distinction:** Philosophers argue about whether side-effects can *ever* be intentional. This activity forces a Yes/No, but the real philosophical debate is about whether the question is valid.
  *   **Unconscious Bias:** Students might think "Focusing on schoolwork" is actually bad (boring) or "Icon Color" is actually good (aesthetic). You have to trust their interpretation of the valence.

  **Closing Line for the Session:**
  "Next week, we'll talk about what it means if our definition of 'choice' depends entirely on whether we like the outcome. For now, keep your slips. Don't Google the 'K-word' until after next session."
