prompt: |-
  I run my school's philosophy club — about 14 people, we get the back of the library for 45 minutes on Thursdays. Next session is about whether people are even consistent when they say someone did something "on purpose," and I want them to walk into the weird asymmetry themselves before anybody says the name out loud (if they hear it they'll just look it up on their phones and start pattern-matching instead of answering).

  So design me a classroom activity where each person gets one short vignette, writes down a yes/no plus one sentence of why, and we tally it on the whiteboard. Constraints: it can't be the usual chairman-and-the-environment story reskinned, it needs to be about something a bunch of 16 year olds would actually have an opinion about (school, a group chat, a part time job, whatever), and I want three conditions. Conditions 1 and 2 should be the mirror-image pair that produces the normal flip. Condition 3 is the interesting one: build it so the pattern breaks or at least shrinks — a side effect nobody would praise or blame anybody for, where both versions come out as "not on purpose."

  Give me the exact wording of all three vignettes (they have to be short enough to read in 30 seconds), how to hand them out so nobody compares, a tally sheet layout that works on one whiteboard, and the debrief. In the debrief I want you to pull apart the three explanations people will reach for — that blame is leaking backwards into the judgment, that its really about skill and whether the agent couldve done it reliably, and that they're just answering a different question than the one you asked — and then tell me which of those three my condition 3 actually supports and why. Finally: what predictably goes wrong with only 14 kids and one period (I'm assuming the numbers come out mushy), and what part of the effect the activity just can't show, so I know what I have to explain myself instead of letting them discover it.
