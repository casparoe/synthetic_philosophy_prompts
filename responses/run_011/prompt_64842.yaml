answer: |-
  The scanner sat on the desk like a smooth black stone, waiting for a hand that could mean what it said. Elena knew the contract by heart. She had recited it to three hundred and twelve applicants. *£50,000 at midnight. Condition: Genuine intention to swallow the capsule at 2 PM tomorrow. Verification: This device. Caveat: Performance optional. Clawback: None.*

  Only one person had ever been paid. A janitor, eleven years ago. He'd claimed he just wanted the money and thought he'd feel like taking the pill later. He was an outlier. The rest were like Elena: too smart to lie to the machine, too rational to lie to themselves.

  Elena needed the money. Her daughter's tuition was due, and the broker's salary was static. But she also needed to win. She had told hundreds, "You know you won't do it, so you can't intend to." Tonight, she would prove herself different.

  She placed her palm on the scanner. The screen glowed amber. *Calibrating.*

  Midnight was four minutes away. She closed her eyes and projected herself to tomorrow afternoon. She saw the capsule on the table. It was blue, harmless, vile. She saw herself reaching for it. But then the image fractured. She saw the clock tick past 2:05. She saw the money already in her account, secured at midnight. She saw no reason to suffer the fever. She saw herself walking away, rational, healthy, wealthy.

  The image was clear. She knew herself. She was a creature of reasons, and tomorrow, the reason would be dead.

  *You must believe you will act to intend to act,* she thought. That was the barrier. To pass the scan, she had to hold the belief that at 2 PM, she would swallow. But she knew that at 2 PM, she would know the money was safe. She knew she would not swallow. Therefore, she could not believe she would. Therefore, she could not intend.

  She tried to force the belief. She tightened her grip on the desk. She tried to forget the payout structure. She tried to convince herself that her integrity demanded the swallow. But integrity was a ghost; the fever was physical. The scanner hummed, reading the dissonance between her will and her prediction.

  Three minutes.

  She thought of the janitor. He hadn't understood the logic. He hadn't known that the payment severed the link between act and reward. He had intended because he was ignorant. Elena was the assessor. She knew the mechanism. Her knowledge was the lock, and she held the key, but the key was made of glass.

  She tried to summon a blind spot. She tried to manufacture a delusion where the money wasn't guaranteed. But the contract was signed. The broker was solvent. The scanner was infallible. There was no room for error, and thus no room for faith.

  Two minutes.

  Sweat prickled her hairline. She wanted to scream at her future self to cooperate. *Just take the pill,* she begged silently. *Make my intention true.* But future-Elena was just as rational as present-Elena. Future-Elena would look at the pill and see no reason.

  One minute.

  The amber light flickered. It was waiting for a spike of conviction, a neural signature of certainty. Elena offered it only analysis. She could decide to try, she could want the money, but she could not bridge the gap to intention. Intention required a promise to the future that the future would break.

  The clock on the wall clicked. 11:59:50.

  She realized then that the one paid client hadn't beaten the puzzle. He had simply missed it. To win, she had to be less than she was. She had to be willing to be irrational. But you cannot decide to be irrational rationally.

  11:59:59.

  The scanner turned red. A soft buzz indicated rejection. *Intention not verified.*

  Elena pulled her hand away. The money would not come. She looked at the capsule vial sitting next to the device. There was no reason to swallow it now. No payment hinged on it. No principle remained unbroken that hadn't already shattered. She capped the vial and left it on the desk.

  ***

  **Note on Intention**
  This ending assumes the **Belief-Desire Model** (specifically Bratman's planning theory), where intention entails a belief that one will perform the action. Since the protagonist knows she will lack reasons to act tomorrow, she cannot believe she will act, thus cannot intend. The liberty taken is the existence of a perfect "intention scanner," treating a philosophical state as a measurable physiological signal.
