answer: |-
  1. **Analytic Preamble**

  We must abandon the search for a single essence. Life is a cluster concept, but a prize requires a decision rule. Given the ten-minute constraint and mixed expertise, we cannot evaluate deep biochemistry. We must evaluate *claims of function*. The procedure must distinguish empirical claims (does it divide?) from conceptual stipulations (does division count as reproduction?). We must set aside metaphysical debates about consciousness or purpose; they are unverifiable in this format. We must also set aside the requirement for specific molecules (DNA/protein); this is the inductive predicament. If we demand DNA, we guarantee finding only Earth-life variants. Instead, we demand the *logic* of inheritance. We must also decide upfront whether the statute's "chemical system" excludes digital substrates; this is a legal/conceptual decision, not scientific. Finally, we must distinguish between a living *system* (capable of evolution) and a living *artifact* (made of cells but sterile). The procedure prioritizes the capacity for lineage over the state of the individual instance. We discard the distinction between "alive" and "dead" in favor of "capable of persistence" versus "static." This shifts the burden from ontology to capacity.

  2. **The Procedure**

  **Question 1: Substrate Compliance**
  *   **Ask:** Is the system physically instantiated in matter subject to chemical laws?
  *   **Sufficient:** Yes (carbon, silicon, lipid, mineral).
  *   **Evasive:** "It exists in information space."
  *   **Type:** **Decision.** The statute says "chemical system."
  *   **Action:** If "No" (pure software), **Terminate (Reject)** unless the committee votes to waive the statute (requires unanimous consent).
  *   **Note:** This handles the *Substrate Problem*. It acknowledges the statute while allowing a deliberate override.

  **Question 2: Bounded Individuality**
  *   **Ask:** Does the system maintain a physical boundary separating "self" from "environment" that is produced by the system itself?
  *   **Sufficient:** Evidence of a membrane, wall, or cohesive surface generated by the system's internal processes.
  *   **Evasive:** "The boundary is defined by the experimenter" or "It is a diffuse cloud."
  *   **Type:** **Empirical Fact.**
  *   **Action:** If "No," **Terminate (Reject).**

  **Question 3: Persistence and Maintenance**
  *   **Ask:** Does the system actively resist entropy to maintain its boundary and internal state over time?
  *   **Sufficient:** Evidence of energy uptake, repair, or metabolic flux.
  *   **Dormancy Clause:** If the submission is dormant (spore, seed, frozen), is there evidence it can resume maintenance upon triggering?
  *   **Evasive:** "It persists because it is stable rock" or "It persists only while we pump energy in manually without internal regulation."
  *   **Type:** **Empirical Fact.**
  *   **Action:** If "No," **Terminate (Reject).**

  **Question 4: Heredity and Evolution**
  *   **Ask:** Does the system produce offspring that resemble the parent due to information passed from parent to offspring, allowing for selection?
  *   **Sufficient:** Demonstration of variation, inheritance, and differential survival across generations.
  *   **Heredity Clause:** Accept templated (DNA) or compositional (mixture ratios) heredity.
  *   **Lineage Clause:** If the individual is sterile (e.g., worker caste), does it belong to a lineage that reproduces?
  *   **Evasive:** "It replicates exactly with no variation" or "Variation is random noise not linked to parent structure."
  *   **Type:** **Empirical Fact** (does it happen?) + **Conceptual Choice** (is this mechanism sufficient?).
  *   **Action:** If "No," **Terminate (Reject).** If mechanism is novel (e.g., compositional), flag for **Committee Discussion** to ensure it counts as evolution.

  **Question 5: Novelty**
  *   **Ask:** Is this form of life distinct from known terrestrial biology?
  *   **Sufficient:** Different substrate, different heredity mechanism, or radically different architecture.
  *   **Evasive:** "It is a genetically modified E. coli."
  *   **Type:** **Empirical Fact.**
  *   **Action:** If "No," **Terminate (Reject).** If "Yes," **Proceed to Award Consideration.**

  3. **Aggregation Method**

  I agree with your suspicion: a checklist with a threshold score is the wrong instrument. Life properties cluster but come apart. A virus has heredity but no metabolism; a mule has metabolism but no heredity. Scoring suggests compensability (lots of metabolism makes up for no evolution), which is false. A system without evolution is not a living lineage.

  Instead, use a **Gated Constraint Model**. Questions 1, 2, and 4 are *necessary conditions*. Failure on any eliminates the submission. Question 3 (Maintenance) allows for the dormancy exception, provided the capacity is demonstrated. Question 5 is the prize criterion, not a life criterion.

  This avoids the "score" trap. You cannot trade off evolution for metabolism. However, Question 4 contains a **Conceptual Choice** point. If the heredity mechanism is non-templated (compositional), the committee must explicitly agree that this counts as "Darwinian evolution." This is not a fact check; it is a definition setting. Record this agreement in the minutes. This preserves the "Inductive Predicament" safeguard: we do not reject novel heredity simply because it lacks DNA, but we must consciously accept it.

  4. **Specific Handling Constraints**

  *   **Dormancy:** Handled in Question 3. A seed is not rejected for being inactive, provided the file shows germination data. If the file shows only a static object with a claim of potential, it fails Q3.
  *   **Individual–Lineage:** Handled in Question 4. Sterile hybrids or worker castes pass if the *colony* or *lineage* reproduces. Cultured cell lines pass if they divide, even if the original organism is extinct. The unit of selection is the replicating entity, not necessarily the submitted physical object.
  *   **Substrate:** Handled in Question 1. The procedure assumes the statute ("chemical") is binding. Digital life fails unless the committee votes to waive the statute. This forces the committee to confront the legal constraint rather than hiding it in biology.
  *   **Heredity without Templating:** Handled in Question 4. The sufficient condition explicitly allows "compositional" heredity. The committee must verify that the composition is actually inherited and subject to selection, not just mixed randomly.
  *   **Inductive Predicament:** Handled by focusing Q4 on the *process* (variation + inheritance + selection) rather than the *mechanism* (DNA). However, the committee must acknowledge that "selection" implies a fitness landscape. If the environment is entirely artificial and controlled to force survival, the committee must decide if that counts as "Darwinian." This is a judgment call recorded in minutes.

  5. **Test Run**

  **Submission A (Lipid Vesicles/Compositional Genome)**
  *   Q1 (Substrate): Chemical (Lipids). **Pass.**
  *   Q2 (Boundary): Yes (Vesicles). **Pass.**
  *   Q3 (Maintenance): Yes (Grow by incorporation). **Pass.**
  *   Q4 (Heredity): Compositional mixture passed on. Selection demonstrated. **Pass.** *Judgment Call:* Committee must agree compositional inheritance counts as Darwinian evolution.
  *   Q5 (Novelty): Yes (No DNA). **Pass.**
  *   **Verdict:** Strong Candidate.
  *   **Judgment Calls:** Whether compositional inheritance is stable enough to count as "heritable."

  **Submission B (Digital Life)**
  *   Q1 (Substrate): Software on Silicon. **Fail.** (Statute says "chemical").
  *   **Action:** Terminate unless Committee votes to waive statute.
  *   **Verdict:** Reject (unless waived).
  *   **Judgment Calls:** Whether "chemical system" is a legacy constraint the donor intends to be rigid. This is a legal/interpretive decision, not scientific.

  **Submission C (Xenobots/Cell Constructs)**
  *   Q1 (Substrate): Chemical (Cells). **Pass.**
  *   Q2 (Boundary): Yes (Tissue surface). **Pass.**
  *   Q3 (Maintenance): Yes (Move, close wounds, use yolk). **Pass.**
  *   Q4 (Heredity): No. They do not reproduce. They are discarded. No lineage. **Fail.**
  *   **Verdict:** Reject.
  *   **Judgment Calls:** None. The lack of reproduction is candidly admitted. They are living *tissue*, not a living *system* capable of evolution.
  *   **Note:** The donor's enthusiasm is irrelevant to the procedure. The procedure protects the committee from pressure.

  6. **Failure Modes**

  1.  **The Virus Case:** A submission shows a complex replicator that requires a host cell to reproduce (like a virus). Q2 (Boundary) and Q3 (Maintenance) are borderline. Viruses don't maintain themselves outside a host.
      *   *Remedy:* The committee must decide if "obligate parasitism" counts as self-maintenance. If the procedure rejects viruses, and a novel viral-like entity is submitted, we may miss it. *Action:* If Q2/Q3 are borderline, move to Q4. If heredity is strong, allow a "Provisional Pass" requiring external review.
  2.  **The Symbiosis Case:** A system where two distinct entities must combine to reproduce (like mitochondria and nuclei). Submitted separately, they fail Q4. Submitted together, they look like one organism.
      *   *Remedy:* Q4 asks about the "system." If the submission defines the system as the consortium, it passes. If they submit one part, it fails. *Action:* Ensure the submission defines the "unit of selection."
  3.  **The AI Future:** An AI runs on chemical hardware (neuromorphic chips) but behaves like Submission B. Q1 passes (chemical), but is it "alive"?
      *   *Remedy:* The procedure will classify it as alive if it evolves. This may be controversial. *Action:* Acknowledge in minutes that "chemical substrate" was satisfied, but "biological origin" was not.
  4.  **The Static Claim:** A group claims a system *could* evolve but hasn't run long enough.
      *   *Remedy:* Q4 requires evidence of selection. Potential is not enough. *Action:* Reject. The prize is for work *produced*, not proposed.

  7. **Draft Report to Donor**

  The Screening Committee has completed its review of the submissions for the Novel Life Prize. Our task was to identify systems that qualify as a new form of life according to the foundation's statutes. To do this fairly, we adopted a procedure that focuses on what a system *does*, rather than what it is made of.

  We looked for three specific capacities. First, the system must maintain a physical boundary between itself and its environment. Second, it must actively sustain itself against decay, either continuously or from a dormant state. Third, and most critically, it must be capable of passing traits to offspring with enough variation to allow for evolution over generations.

  We received many submissions describing complex biological materials. However, materials that do not reproduce or evolve—such as engineered tissues that live for a short time and then perish—do not meet the statutory requirement for a "living thing." Similarly, systems that exist purely as software were excluded because the statute specifies a "chemical system," though this definition remains under review for future cycles.

  The winning submission demonstrated all three capacities using a mechanism of inheritance distinct from known terrestrial biology. We are confident this award recognizes a genuine novelty in the chemistry of life, consistent with the foundation's mission to expand our understanding of what living systems can be.
