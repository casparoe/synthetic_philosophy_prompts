  Here is the restatement of the Kant–Strawson argument using state estimation terminology, followed by the critique on mappings, ambiguity, and residue.

  ### The Translation

  **The Claim:** To construct a valid state estimate ($\hat{x}$) from measurements ($y$), you must be able to distinguish measurement noise (how things seem) from process dynamics (how things are).

  **The Condition:** This distinction is only possible if the system model ($F, H$) provides a stable framework of re-identifiable states over time. You need an observability condition that holds across time steps; you cannot estimate a state if the mapping from state to measurement is singular or drifting arbitrarily with every impression.

  **The Conclusion:** Global skepticism (the claim that "no true state exists" or "the model is entirely void") is self-defeating. To formulate the doubt ("my estimate might be wrong"), you must presuppose the existence of a state-space structure and an error metric ($\tilde{y} = y - H\hat{x}$) that gives the doubt meaning. If the system were truly unobservable or the model nonexistent, you couldn't even define an estimation error, let alone doubt it.

  ### The Ambiguity: "Needs" vs. "Presupposes"

  In estimation, "the filter needs observability" is ambiguous between two readings:
  1.  **Performance (Algorithmic):** Without observability, *this specific estimator's* covariance blows up ($P \to \infty$).
  2.  **Constitutive (Structural):** Without observability, the *concept of the state* is undefined relative to the measurements.

  The transcendental argument requires the **Constitutive** reading. It claims that objectivity (the state) is constituted by the possibility of distinguishing it from subjectivity (measurement). If you use the Performance reading, the skeptic wins: they can simply say, "Fine, the filter diverges, but the state still exists unknowably." The argument only works if unobservability implies the *incoherence* of the state concept itself, not just estimator instability.

  This ambiguity is **fatal** if not strictly maintained. In engineering, we are realists: the state exists even if unobservable (e.g., hidden modes). In Kant–Strawson, the "object" is transcendental: it exists *only* insofar as it can be constituted in experience. Conflating estimator convergence with ontological possibility smuggles in a realism the argument is trying to prove.

  ### Residue Report

  **Translates Cleanly:**
  *   **Seems/Is:** Maps cleanly to Innovation/Residual vs. True State Error.
  *   **Framework:** Maps to the System Matrices ($F, H$) providing the laws of motion.
  *   **Self-Defeat:** Maps to the fact that defining an error signal requires the model structure being doubted.

  **Bent:**
  *   **Re-identifiable Objects:** In estimation, states are vectors defined by the model, not ontological objects. We "re-identify" them via coordinate consistency, not persistence of substance.
  *   **Regularities:** In estimation, these are statistical assumptions ($Q, R$). In the argument, they are necessary conditions for experience.

  **Breaks (No Expression):**
  *   **Normativity:** This is the critical failure. In estimation, "must" is always conditional ("*If* you want convergence, *then* you must have observability"). In the transcendental argument, "must" is categorical ("To have experience, you *must* have objectivity"). Estimation vocabulary cannot express a necessity that isn't tied to a goal function or cost minimization.
  *   **Truth of the Model:** Estimation assumes model mismatch is possible (we can be wrong about $F$). The transcendental argument claims the framework categories are necessarily true of experience. You cannot model "necessary truth" in a Kalman filter; you can only model "high confidence."

  **The Identifiability Trap:**
  Identifiability is a structural property of a *contingent* model. Transcendental necessity is a property of the *subject*. Equating them suggests that if we changed the model, objectivity would vanish. Kant claims objectivity persists across conceptual schemes; estimation says state definition collapses if the model rank drops. This reveals the argument relies on a modality (categorical necessity) that estimation treats as a design parameter.

  Verdict: SOURCE-DEFECT, Categorical necessity reduces to conditional stability.
