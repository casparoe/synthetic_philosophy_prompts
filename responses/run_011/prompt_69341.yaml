answer: |-
  **MEMORANDUM**

  **TO:** Board of Trustees, Historical Trust
  **FROM:** [Your Name]
  **DATE:** March 12, 2024
  **RE:** Allocation of Sesquicentennial Bequest ($2.6M)

  **Executive Summary**
  We face a hard constraint: $2.6M is available for allocation against $2.8M in requests. Any unallocated funds revert to the unrestricted endowment by the April deadline. Based on fiduciary risk, legal eligibility, and the physical urgency of preservation, I recommend we fully fund Proposal A ($900k) and Proposal B ($1.7M), and decline Proposal C for this specific bequest.

  This is not a judgment on the moral necessity of Proposal C. It is a recognition that the legal instrument governing these funds ("study and commemoration") is incompatible with the critical adjudication C proposes, and that risking the entire bequest on litigation jeopardizes our ability to preserve the evidence required to tell that truth later.

  **The Nature of the Stalemate**
  Our deadlock stems from conflating three distinct functions of history, each valid but mutually competing in this context.
  1.  **Exemplar (Proposal A):** History as inspiration. It uses the past to motivate the present.
  2.  **Archive (Proposal B):** History as preservation. It protects the raw material of the past from decay.
  3.  **Judgment (Proposal C):** History as correction. It uses the present to judge the past.

  Proponents of A argue for inspiration; proponents of B argue for conservation; proponents of C argue for justice. We are talking past one another because we haven't admitted that a single budget cannot maximize all three simultaneously. The will restricts us to "study and commemoration." "Judgment" falls outside that scope legally, even if it belongs within our moral scope as an institution.

  **Analysis of Proposals**

  **Proposal A ($900k): The Monumental**
  *Strengths:* Fits the "commemoration" clause perfectly. The Development Office's assessment—that visible history leverages future gifts—is plausible. Students need exemplars.
  *Risks:* Low. This is the safest legal fit.
  *Verdict:* **Fund.** It satisfies the donor's intent and secures future revenue.

  **Proposal B ($1.4M → $1.7M): The Antiquarian**
  *Strengths:* Physical decay is the only true irreversible constraint here. The conservator's assessment of the 1920s–50s newsprint is objective; once it turns to dust, the data is gone. This includes the ledgers and papers necessary to verify the claims in Proposal C.
  *Risks:* Medium. "Urgency" is often a negotiation tactic, but chemical decay is not.
  *Verdict:* **Fund and Expand.** I propose increasing this allocation to $1.7M. The additional $300k should be earmarked specifically for digitizing the 1870s–1880s land records and county road documents. This ensures the *evidence* for Proposal C is preserved even if the *narrative* is not yet funded.

  **Proposal C ($500k): The Critical**
  *Strengths:* Moral honesty. The hidden history of the land settlement and the fraudulent endowment partner deserves acknowledgment. Ignoring it perpetuates a lie.
  *Risks:* Critical. College Counsel has flagged that "reckoning" may violate the "commemoration" clause. Furthermore, the threat of a withdrawn $1M pledge creates a net negative financial impact ($500k cost + $1M lost pledge).
  *Verdict:* **Decline from this Bequest.** Funding C risks litigation that could freeze the entire $2.6M. However, we must not abandon the work.

  **Recommendation and Conditions**

  1.  **Allocate $900,000 to Proposal A.** Proceed with the exhibit and lecture series.
  2.  **Allocate $1,700,000 to Proposal B.** Expand the scope to prioritize the digitization of all records pertaining to the 1876 land transfer and the original endowment sources.
  3.  **Allocate $0 to Proposal C from this fund.**
  4.  **Condition of Approval:** The Board must simultaneously pass a resolution directing the Administration to secure operating budget or external grant funding for Proposal C within 12 months. We acknowledge the truth of C requires telling, but this restricted capital is the wrong vehicle.
  5.  **Timeline:** All funds must be encumbered by April 30 to prevent reversion. Project completion for A and B must coincide with the 2027 Sesquicentennial.

  **Addressing the Loss**
  To the proponents of Proposal C: I recognize this recommendation asks you to wait. It feels like silencing. But consider the alternative: if we fund C and are sued for violating the will, the funds are frozen. If we lose the pledge, the operating budget shrinks, making it *less* likely C can be funded later. By funding B expanded, we secure the primary sources. You cannot tell the truth without the documents. We are choosing to save the evidence so that the judgment can be rendered later, on firmer ground, without burning down the archive.

  To the proponents of Proposal A: You get your exemplars, but you must accept that the exhibit cannot be hagiography. The preserved records (B) will be available to researchers who question the narrative you present.

  **Conclusion**
  We cannot be everything at once. We must be fiduciaries first. By prioritizing Preservation (B) and Commemoration (A), we honor the legal instrument. By mandating a search for alternative funding for Judgment (C), we honor the truth. This avoids the reversion clause, minimizes legal liability, and ensures that when the reckoning comes, the evidence survives to support it.

  I move we adopt this allocation.
