          *   What it can't distinguish.
          *   The Reporter Script.

  9.  **Tone Check:** Professional, direct, clinical, empathetic to the team's workload, no academic fluff.

  10. **Final Review against constraints:**
      *   Binary line for funder? Yes (Yes/No/Undetermined).
      *   No reading list? Yes.
      *   Exact sentences? Yes.
      *   Flag judgment calls? Yes.
      *   Ethics/Consent marked? Yes.
      *   Case 1, 2, 3 analyzed? Yes.
      *   Reporter question answered? Yes.

  *(Self-Correction during drafting)*: Make sure I don't give a "Yes" to Case 1 if the acuity makes it impossible. 20/400 at 40cm... A 5cm cube subtends about 7 degrees. 20/400 can resolve about 1 degree (roughly). So they *can* see the shape. Okay, Case 1 is viable.
  Wait, Case 2: 18 months. Visual cortex development. Usually, Molyneux applies to *congenital*. If he had vision for 18 months, he might have object permanence and visual storage. The procedure should classify him as "Not Applicable" for the specific Molyneux metric, even if he's a success story.
  Case 3: Contaminated. "Undetermined."

