answer: |-
  Here is the **Touch-Sight Match Protocol (TSMP)**. It is designed to be embedded in your standard Week 2 "Visual-Haptic Integration" therapy session. It requires no statistics, no philosophy, and no extra consent forms, provided you document it as part of the standard rehab assessment.

  ### Part 1: The Procedure

  **Goal:** Determine if the patient can match a visual shape to a tactile memory *without* prior visual learning of that shape post-surgery.
  **Timing:** Week 2 Post-Op (or first session where eyes are open and stable).
  **Materials:** Two high-contrast objects distinct in global geometry (e.g., Cube vs. Sphere, or Block vs. Ball). No color cues (same color). No sound cues (soft landing).

  #### Phase A: Eligibility Gate (Do this before testing)
  *If the patient fails any step, STOP. Do not proceed to Phase B.*

  1.  **Tactile Baseline:** Can the patient name or match the two objects by touch alone (eyes covered) with 100% accuracy (3/3 trials)?
      *   *If No:* **STOP.**
      *   *Chart Script:* "Tactile baseline not established. Cross-modal status: Undetermined."
      *   *Funder Report:* "No." (Treat as failure to transfer).
  2.  **Visual Resolution:** Can the patient distinguish the two objects visually *while holding them*? (Hold Object A in view. Ask: "Is this the block or the ball?")
      *   *If No:* **STOP.** Their acuity is too low to resolve the shape.
      *   *Chart Script:* "Visual acuity insufficient to resolve test stimuli. Cross-modal status: Undetermined."
      *   *Funder Report:* "No."
  3.  **Learning Lockout:** Has the patient been shown the objects *visually* and named them *by staff or family* since surgery?
      *   *If Yes:* **STOP.** The association was taught, not transferred.
      *   *Chart Script:* "Visual-object association learned via instruction. Cross-modal status: Contaminated."
      *   *Funder Report:* "No."
  4.  **Onset Check:** Did the patient have functional vision after age 2?
      *   *If Yes:* **STOP.** This is memory retrieval, not cross-modal transfer. (See Case 2 analysis).
      *   *Chart Script:* "Prior visual memory present. Molyneux protocol not applicable."
      *   *Funder Report:* "N/A" (Do not count toward the binary yes/no tally).

  #### Phase B: The Transfer Trial (Rehab Task)
  *Marked as [REHAB] — No separate consent required.*

  1.  **Setup:** Patient seated. Objects placed 40cm apart on table. Patient's hands resting in lap (no touching allowed yet).
  2.  **The Prompt:** Hand the patient Object A (e.g., Cube) behind a screen or under the table so they cannot see it. Say: "Feel this. Remember it."
  3.  **The Choice:** Remove the object. Reveal the two objects on the table. Ask: "Point to the one that feels like what you were holding."
      *   *Constraint:* Do **not** use the words "Cube" or "Sphere." Use "This one" or "That one."
      *   *Constraint:* Do **not** confirm if they are right or wrong during the trial.
  4.  **Repetition:** Run 8 trials. Randomize which object is held first.
  5.  **The Judgment Call [FLAG]:** *Was that a report of what he saw or a smart guess?*
      *   *Rule:* If the patient hesitates >5 seconds, squints excessively, or asks "Does it matter?", mark that trial as **Guess**.
      *   *Rule:* If the patient points immediately and confidently, mark as **Signal**.
      *   *Note:* You cannot mechanize this. If the nurse feels the patient is guessing, trust the nurse.

  #### Phase C: Scoring & Reporting

  *   **Score:** Count the number of **Signal** trials that were Correct.
  *   **Threshold:** You need **6 out of 8** correct Signal trials to claim transfer.
      *   *Why:* 5/8 is chance. 6/8 is the clinical minimum for "reliable enough for rehab planning."
  *   **Decision:**
      *   **6-8 Correct:** Report **YES**.
      *   **0-5 Correct:** Report **NO**.
      *   **Inconclusive Judgment:** If the nurse flags >3 trials as "Guess," Report **UNDETERMINED**.

  *   **Funder Report Sentences:**
      *   *If YES:* "Cross-modal transfer: Yes."
      *   *If NO:* "Cross-modal transfer: No."
      *   *If UNDETERMINED:* "Cross-modal transfer: Undetermined." (Count this as a "No" for the binary line if forced, but keep the distinction in the chart).
      *   *If STOPPED in Phase A:* "Cross-modal transfer: No." (For funder simplicity, eligibility failures count as non-successes).

  ---

  ### Part 2: Running Your Three Cases

  #### Case 1: The 7-Year-Old (Congenital, 20/400, Nystagmus)
  *   **Phase A Check:**
      1.  Tactile Baseline: Pass (Names instantly).
      2.  Visual Resolution: **Pass.** (20/400 at 40cm allows resolution of large geometric differences like Cube vs. Sphere, even with nystagmus).
      3.  Learning Lockout: Pass (Week 2, no mention of drilling).
      4.  Onset Check: Pass (Congenital).
  *   **Phase B Check:**
      *   Score: 6/8 Correct.
      *   Patient Quote: "Looking for the same one." (Indicates active matching strategy, not random pointing).
      *   Judgment Call: Assuming your nurse did not flag >3 trials as "Guess."
  *   **Verdict:** **YES.**
  *   **Reasoning:** This is the textbook Molyneux subject. Congenital blindness, no prior visual memory, passed the 6/8 threshold. The nystagmus and low acuity are hurdles he cleared during the test.
  *   **Report:** "Cross-modal transfer: Yes."

  #### Case 2: The 45-Year-Old (Blind since 18 Months)
  *   **Phase A Check:**
      1.  Tactile Baseline: Pass.
      2.  Visual Resolution: Pass.
      3.  Learning Lockout: Pass.
      4.  Onset Check: **FAIL.**
  *   **Verdict:** **NOT APPLICABLE.**
  *   **Reasoning:** Molyneux's question asks if *new* vision connects to *old* touch without *old* vision. This patient had vision for the first 18 months of life. His brain likely stored visual templates of "round" and "square" before the injury. When he says "things look the way they feel," he is likely retrieving a 40-year-old memory, not building a new cross-modal bridge.
  *   **Action:** Do not use this patient for the "Cross-Modal Transfer" metric. He is a success story for *Restoration*, but he is scientifically useless for the *Molyneux* question.
  *   **Report:** "N/A" (If the funder forces a binary, exclude him from the denominator. If you must include him, report "No" because it's not transfer, it's recall, but this misrepresents the data. Better to classify as "Late-Onset Restoration" separate from "Congenital Transfer").

  #### Case 3: The 10-Year-Old (Grandmother Drilling)
  *   **Phase A Check:**
      1.  Tactile Baseline: Pass.
      2.  Visual Resolution: Pass.
      3.  Learning Lockout: **FAIL.**
  *   **Verdict:** **STOP.**
  *   **Reasoning:** The grandmother taught the association ("This is a cube, look at it") before you could test the raw transfer. You cannot distinguish if he is matching touch-to-sight or remembering the lesson.
  *   **Chart Script:** "Visual-object association learned via instruction. Cross-modal status: Contaminated."
  *   **Funder Report:** "No." (In a binary system, contaminated data cannot count as success).

  ---

  ### Part 3: What The Procedure Can't Do (And How to Talk About It)

  #### 1. The "Blindness" Distinction
  **Limitation:** The procedure cannot distinguish between "He sees the shape but has no concept for it" and "He doesn't see the shape at all."
  *   *Why:* If he fails the test (scores 0-5), it could be because his retina isn't sending a clear image (Optical Failure) OR because his visual cortex doesn't know what to do with the image (Neural Failure). Phase A, Step 2 (Visual Resolution) tries to catch the Optical Failure, but it's imperfect.
  *   *Solution:* Rely on Phase A, Step 2. If he can identify the object *while holding it* visually, the optics are working. If he fails the Transfer Trial after that, it is a Neural/Conceptual failure.

  #### 2. The Reporter's Question ("He was born blind, now he can see?")
  **Limitation:** "Seeing" is a lay term that conflates *light detection*, *shape recognition*, and *understanding*.
  *   *Risk:* If you say "Yes," parents expect 20/20 understanding immediately. If you say "No," they think the surgery failed.
  *   *The Script:* Do not use the word "See" without a qualifier. Use this exact phrasing:
      > "His eyes are capturing the image, but his brain is learning how to read it. Right now, he can detect light and shape, but connecting that to what he knows by touch is a skill he has to build, like learning to read. The surgery gave him the camera; the rehab is teaching him the language."

  #### 3. The Judgment Call Flag
  **Warning:** The step where the nurse decides "Was that a guess?" is the weakest link. It is subjective.
  *   *Mitigation:* If two nurses are present, they must agree on the "Guess" flag. If they disagree, mark the trial as **Inconclusive**. If >3 trials are Inconclusive, the whole test is **Undetermined**.
  *   *Why:* It is better to report "Undetermined" than to lie to the funder with a false "Yes."

  ### Summary for your Team
  1.  **Run Phase A first.** If they fail eligibility, stop. Don't waste time testing.
  2.  **No Naming.** Don't say "Cube." Say "This one."
  3.  **Trust the Nurse's Gut.** If it feels like guessing, mark it guessing.
  4.  **50% is Failure.** They need 6/8 to count as a "Yes."
  5.  **Late Blindness is Different.** Adults who knew sight aren't Molyneux cases. Don't count them.
