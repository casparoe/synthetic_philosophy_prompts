      *   *The "Experience" Argument:* If it looks the same, does it matter? Yes, because art is historical artifact, not just visual stimulus. Knowing it's touched changes the relation.
      *   *The "Institutional" Argument:* Truth vs. Survival. If we lose the 2027 show, do we serve the public better by hiding truth or keeping the show?
      *   *The "Donor" Argument:* Stewardship vs. Sentiment. The gift was the object, not the idea of the object.
      *   *Recommendation:*
          *   Label: "Attributed to [Artist], with later additions." Don't drop to "Circle of" yet without more tech analysis, but acknowledge the extension.
          *   Physical: Keep extension for now (cutting is destructive), but mark it as non-original in docs.
          *   Communication: Tell lender honestly but frame as "scholarly refinement," not "scandal."
