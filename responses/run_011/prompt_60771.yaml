answer: |-
  **Preliminary Notes & Disagreement Map**

  *   **Core Ontological Question:** Is the artwork the visual image (perceptual) or the historical artifact (indexical)?
      *   *Committee Split:* Visual coherence (keep status quo) vs. Material truth (reveal extension/retouching).
      *   *Donor:* Sentimental/Contractual (gift was the object *as known*).
      *   *Director:* Consequentialist (truth vs. institutional survival).
  *   **The "Blindfold" Argument:** If it looks the same, the aesthetic experience is identical.
      *   *Counter:* Art is not just stimulus; it's evidence of human action. Knowing the hand didn't touch that patch changes the relation from "viewing" to "observing a trace."
  *   **The Risk:** Re-attribution might kill the 2027 show.
      *   *Counter:* Being caught hiding it later kills credibility permanently. Trust is non-renewable.
  *   **The Test for 30 Works:** Distinguish between *preservation* (stabilizing decay) and *recreation* (painting what isn't there). Disclosure required when recreation exceeds 15% of surface or alters composition.
  *   **Recommendation:** Modify label, keep physical extension (cutting is destructive), disclose to lender honestly.

  ***

  **MEMORANDUM**

  **TO:** Collections Committee
  **FROM:** Faculty Representative
  **DATE:** Monday, October 23
  **SUBJECT:** Recommendation Regarding Haarlem Still Life (1961.00X)

  We are asked to decide what this object *is*. The conservation report confirms the panel is period oak, but the image we admire is a collaboration between a 17th-century painter and an 18th-century restorer. There was no fraud, only accumulation. Our task is to determine how much of that history belongs in the label, the ledger, and the public trust.

  **The Principle for Future Cases**
  We have thirty similar works. We need a test that separates conservation from reconstruction. The principle should be this: Authenticity attaches to the history of production, not just the visual effect. When restoration efforts cross from stabilizing existing pigment to inventing missing composition, the object becomes a hybrid. For this and future cases, I propose a disclosure threshold: if later intervention alters more than 15% of the visual field or changes the compositional boundaries (as the six-inch extension does), the label must qualify the attribution. This does not require deaccessioning; it requires precise describing. We owe the visitor standing before the work not just a beautiful image, but an accurate account of the human actions that produced it.

  **The Aesthetic Objection**
  One colleague argues that because the visual experience is unchanged, the attribution is merely paperwork. This assumes art is purely retinal—that a blindfolded visitor misses nothing relevant. But we treat art as historical testimony. We value the brushstroke because it records a specific decision made at a specific time. When a restorer supplies the brushwork, the record is broken. Knowing that the top six inches were added later changes the work from a statement by the artist to a conversation across centuries. The aesthetic experience is not just what we see; it is what we know we are seeing. To hide the extension is to ask the visitor to trust a fiction.

  **The Institutional Risk**
  The strongest argument against public re-attribution comes from the Director. If we qualify the label, the 2027 lender may withdraw, jeopardizing a major exhibition and our institutional standing. This is not merely financial; it is about mission viability. If the museum cannot secure loans, it cannot serve the public. There is a pragmatic case that preserving the object's current status protects the collection's ability to function. Furthermore, science is iterative; today's "extension" might be tomorrow's "collaborative practice." Rushing to downgrade the object risks locking us into a narrative that future tech might overturn. The Director's point is that truth has a cost, and sometimes the institution cannot afford to pay it immediately.

  However, trust is our only non-renewable resource. If the extension is discovered by outside scholars during the 2027 show, the scandal will dwarf the current risk. Honesty framed as scholarly refinement is safer than secrecy framed as discovery.

  **Recommendation**
  1.  **Labeling:** By January 1, update the wall label to read: "Attributed to [Artist], panel extended c. 1750." This acknowledges the period material without guaranteeing the entire image is autograph.
  2.  **Physical Treatment:** Do not remove the extension. Cutting period material is destructive conservation. Stabilize the current surface.
  3.  **Donor Relations:** The Director and Chair to meet the donor's grandson. Explain that stewardship means preserving the truth of the object, not freezing the 1961 understanding.
  4.  **2027 Lender:** The Director to communicate the findings immediately. Frame this as "enhanced scholarship increasing the object's research value," not "devaluation."
  5.  **Review Trigger:** Reopen attribution only if new technical analysis (e.g., pigment dating) definitively separates the original paint from the retouching.

  **Motion**
  I move that we accept the conservation report as definitive for current cataloging, update the public attribution to "Attributed to [Artist] with later additions" by January 1, retain the physical extension without further intervention, and authorize the Director to disclose this status to the 2027 lender as a matter of scholarly transparency.
