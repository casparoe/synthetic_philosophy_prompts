prompt: |-
  I'm in a seminar on societal collapse where one participant keeps pressing this analogy: a society no more collapses than a caterpillar collapses when it becomes a butterfly. The larva dissolves inside the chrysalis, the adult is built from what survives, and it is one continuous life throughout. So, he says, the Classic Maya did not fail — they reorganized: the people, the languages, and the ritual calendar persisted, and the lowland cities were abandoned rather than destroyed. His conclusion is that "collapse" is an engineering metaphor doing covert moral work, that societies only ever change, and that the concept should be dropped from serious use.

  Audit the analogy for me. Give the correspondence table — caterpillar, chrysalis, the dissolved larval tissue, the imaginal discs, the genetic program, the imago — saying which social feature each is meant to pick out and whether anything in the historical record actually occupies that slot. Then separate the disanalogies that genuinely defeat his conclusion from those that are only unflattering surface differences. In particular: what would have to persist for a society to count as the same society, and is there anything in these cases that answers to tissue broken down rather than carried over?

  Tell me whether the conclusion survives, whether there is a non-evaluative description of what is lost that the analogy has no room for, and whether some other analogy would carry his point better or worse. Finally, say what would change your verdict — which evidence or argument would push you the other way — and where you think your own reasoning here is most likely to fail.
reasoning: |-
  Here's a thinking process that leads to the audit of the "caterpillar collapse" analogy:

  1.  **Deconstruct the Request:**
      *   **Context:** Seminar on societal collapse.
      *   **Opposing View:** A participant argues "collapse" is a misleading engineering/moral metaphor. Societies don't collapse; they transform (like caterpillar $\to$ butterfly).
      *   **Specific Example:** Classic Maya (cities abandoned, but people/language/ritual persisted).
      *   **Task:** Audit the analogy.
      *   **Requirements:**
          1.  Create a correspondence table (Caterpillar parts $\to$ Social features + Historical evidence check).
          2.  Separate disanalogies (defeating vs. surface).
          3.  Address the persistence condition (what makes a society the "same"?).
          4.  Address the "tissue broken down" question (is there loss that isn't carried over?).
          5.  Evaluate the conclusion (does it survive?).
          6.  Identify non-evaluative descriptions of loss missing from the analogy.
          7.  Suggest better/worse analogies.
          8.  State what would change the verdict.
          9.  Self-reflect on potential reasoning failures.

  2.  **Analyze the Analogy (Caterpillar $\to$ Butterfly):**
      *   *Core Claim:* Continuity of identity despite radical structural change.
      *   *Mechanism:* Histolysis (dissolving) + Imaginal Discs (blueprints) $\to$ Imago (new form).
      *   *Implication:* "Collapse" implies failure/death, but this is actually metamorphosis. Therefore, drop the term "collapse."

  3.  **Drafting the Correspondence Table:**
      *   *Caterpillar (Larva):* The pre-collapse society (e.g., Classic Maya Lowlands).
      *   *Chrysalis (Pupa):* The transition period (Terminal Classic, ~800-950 CE).
      *   *Dissolved Larval Tissue:* Institutions/structures that vanish (Divine Kingship, monumental construction, long-distance trade networks).
      *   *Imaginal Discs:* The seeds of the new society (Lineage heads, local ritual knowledge, agricultural practices).
      *   *Genetic Program:* Deep cultural codes (Language, cosmology, calendar).
      *   *Imago (Butterfly):* The Post-Classic society (Northern Yucatán, Highland Guatemala, dispersed populations).
      *   *Check:* Does history support this? Yes, mostly. Maya people didn't vanish. But did *everything* dissolve? No. Did the "butterfly" fly away or just crawl?

  4.  **Identifying Disanalogies:**
      *   *Surface (Unflattering but not defeating):* Societies don't have a literal chrysalis wall. Metamorphosis is biological destiny; social change isn't teleological.
      *   *Defeating (Critical):*
          *   **Suffering/Entropy:** Metamorphosis is a programmed, low-entropy transition (mostly). Collapse often involves mass death, famine, violence, and loss of complexity *without* a guaranteed new form.
          *   **Complexity Loss:** A butterfly is not "less" than a caterpillar functionally (both eat, reproduce). A post-collapse society often loses the capacity to do things the previous one could (build aqueducts, maintain roads, support large populations).
          *   **Agency/Intent:** Metamorphosis is internal/genetic. Collapse is often external (climate, invasion) or systemic failure.
          *   **The "Same Society" Problem:** If the political structure, economic network, and population density drop by 90%, is it the *same* society or a successor society?

  5.  **Addressing "Tissue Broken Down" vs. "Carried Over":**
      *   In biology, the tissue is recycled. Energy is conserved.
      *   In society, "tissue" (knowledge, infrastructure, population) is often *lost*, not recycled. Literacy rates drop. Engineering knowledge vanishes. Population crashes. This is entropy, not transformation.
      *   *Key Question:* What persists for identity? Language/Genetics persist, but *Societal Complexity* (the thing usually meant by "collapse") does not.

  6.  **Evaluating the Conclusion ("Drop the term Collapse"):**
      *   Does it survive? No. "Transformation" is true, but "Collapse" describes the *loss of capacity*. Calling a hospital turning into a hut "transformation" ignores the loss of medical capacity.
      *   Non-evaluative description of loss: "Decrease in socio-political complexity," "Reduction in energy capture," "Loss of information storage."

  7.  **Alternative Analogies:**
      *   *Better:* Ecosystem succession (Forest fire $\to$ scrubland). Acknowledges loss of biomass but continuity of life.
      *   *Better:* Computer system downgrade (Mainframe $\to$ Network of PCs). Function changes, capacity changes.
      *   *Worse:* Phoenix (implies rebirth to same glory).
      *   *Worse:* Ship of Theseus (too philosophical, ignores function).

  8.  **Changing the Verdict:**
      *   What would make me agree? If "collapse" was defined strictly as "extinction of people." Since people survive, "collapse" is a category error *if* defined that way. But archaeologists define it as "loss of complexity." If the participant conceded that "complexity collapse" is real but objects only to the moral weight of the word, I'd agree more.
      *   Evidence: If we found that Post-Classic Maya had *higher* energy capture and quality of life than Classic, the "collapse" label would be purely pejorative. But evidence suggests quality of life dropped for many.

  9.  **Self-Reflection (Where might I fail?):**
      *   Bias towards "complexity = good."
      *   Underestimating the resilience of the "imaginal discs" (local knowledge).
      *   Over-relying on elite markers (monuments) vs. commoner welfare.

  10. **Refining the Output:**
      *   Structure strictly according to the prompt's requirements.
      *   Maintain a critical, academic tone.
      *   Ensure the Maya example is integrated throughout.

  *(Self-Correction during drafting)*: I need to be careful not to just say "he's wrong." The participant has a point about the moral loading of "collapse." I need to validate the insight (continuity exists) while rejecting the conclusion (therefore no collapse). The distinction is between *ontological continuity* (people exist) and *functional continuity* (society works the same way).

  *(Refining the "Tissue" point)*: In metamorphosis, the larval cells are used to build the butterfly. In societal collapse, the "bricks" of the old cities are often not used to build the new villages; the knowledge of *how* to make the bricks is lost. That's a crucial disanalogy. Energy is lost, not just transformed.

  *(Refining the "Same Society" point)*: Identity conditions for societies are contested. Is it the *polity* or the *culture*? The participant conflates culture (Maya) with polity (Tikal/Calakmul).

  *(Final Polish)*: Ensure the "What would change your verdict" section is specific and falsifiable.

  11. **Final Review against constraints:**
      *   Correspondence table? Yes.
      *   Disanalogies (defeating vs surface)? Yes.
      *   Persistence condition? Yes.
      *   Tissue broken down? Yes.
      *   Conclusion survival? Yes.
      *   Non-evaluative description? Yes.
      *   Other analogies? Yes.
      *   Verdict change conditions? Yes.
      *   Self-reflection? Yes.

