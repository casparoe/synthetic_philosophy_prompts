answer: |-
  ### I. The Phenomenological Constraint

  You propose that the starting point must be C.S. Lewis's observation: our intuitions regarding penal substitution are not uniform. We permit it for fines but reject it for imprisonment or death, even when the burden of the fine exceeds the burden of the custody. A theory that declares substitution universally permissible or universally impermissible fails to capture the data; it explains away the phenomenon rather than explaining it.

  I agree. This is a non-negotiable constraint on the framework. Any account that begins by asserting a principled monism (e.g., "Punishment is essentially suffering, therefore transferable" or "Punishment is essentially personal, therefore non-transferable") renders the actual texture of our moral practice unintelligible. The framework must therefore demand a *differentiated* account.

  ### II. Assessment of the Provisional List

  Your provisional list is strong but contains category errors that need straightening before it can serve as a rigorous filter.

  1.  **Variance by burden type:** This is essential. It is the Lewis Constraint.
  2.  **Condemnation/Communication:** This is essential, but it needs to be decoupled from the assumption that innocent suffering *cannot* communicate. Some theories (e.g., vicarious atonement) argue it *does* communicate. The desideratum should demand an account of *what* is communicated, not presuppose the message is null.
  3.  **Distinct Permissions:** This is a conceptual necessity. Pooling the victim's waiver with the state's authorization is a jurisprudential error. Non-negotiable.
  4.  **Obligation vs. Punishment:** This is the "Remainder" problem. It is the deepest philosophical hurdle. Non-negotiable.
  5.  **Wealth Immunity:** You suspected this might be a prejudice. You are correct. This is an egalitarian policy preference, not a conceptual requirement of punishment. A libertarian theory could coherently allow wealth-based substitution. I have classified this as a Camp Preference.

  ### III. The Desiderata

  An adequate theory of penal substitution must satisfy the following six conditions.

  **1. The Differentiation Requirement**
  *   **Condition:** The theory must explain why substitutability is permissible for certain classes of penalty (e.g., fines) and impermissible for others (e.g., imprisonment), without relying solely on the magnitude of the burden.
  *   **Motivation:** Lewis's puzzle. A $10,000 fine is often more burdensome than a 30-day sentence, yet the former allows a proxy while the latter does not. Severity alone cannot track the moral permission.
  *   **Status:** **Non-negotiable.** A theory that fails here is descriptively inadequate.

  **2. The Remainder Specification**
  *   **Condition:** The theory must identify what normative or psychological status remains with the offender after a successful substitution, and determine whether this remainder constitutes a form of punishment in itself.
  *   **Motivation:** Even when a friend pays a fine, the offender is still "convicted," retains a criminal record, and often feels a specific guilt (the discomfort of rescue) distinct from the discomfort of payment. If the remainder is punitive, substitution is partial; if not, the theory must explain why the offender is "punished" without suffering.
  *   **Status:** **Non-negotiable.** Ignoring this collapses punishment into mere suffering.

  **3. The Initiation Asymmetry**
  *   **Condition:** The theory must distinguish morally between a volunteer assuming the penalty and an authority assigning an innocent third party to the penalty, even if the resulting distribution of suffering is identical.
  *   **Motivation:** We tolerate a father paying his son's fine; we revolt at a judge ordering a random citizen to serve the son's time. The moral valence shifts with the source of the imposition, not the outcome.
  *   **Status:** **Non-negotiable.** This rules out pure consequentialist accounts.

  **4. The Communication Constraint**
  *   **Condition:** The theory must explain how condemnatory force attaches to the offender when the hard treatment is endured by an innocent, or else demonstrate that condemnation is not a necessary feature of the penalty in question.
  *   **Motivation:** Punishment is standardly taken to censure the offender. If an innocent suffers, the censure risks misfiring (condemning the innocent) or vanishing (failing to reach the guilty). The theory must locate the censure.
  *   **Status:** **Non-negotiable** for retributive/communicative theories; **Camp Preference** for pure debt/discharge models.

  **5. The Agency Separation**
  *   **Condition:** The theory must treat the permissions of the Volunteer, the Offender, the Victim, and the State as distinct variables that do not automatically entail one another.
  *   **Motivation:** A victim may waive restitution without waiving public punishment; a volunteer may offer suffering without the state accepting it; the state may authorize substitution without the offender's consent. Pooling these creates false dilemmas.
  *   **Status:** **Non-negotiable.** This is a requirement of conceptual clarity.

  **6. The Equality Constraint**
  *   **Condition:** The theory should not permit wealth to function as a mechanism for purchasing immunity from the distinctive burdens of punishment that the poor must endure.
  *   **Motivation:** If only fines are substitutable, and fines are monetizable, the wealthy gain a structural advantage in avoiding the personal sting of justice.
  *   **Status:** **Camp Preference (Egalitarian).** A coherent libertarian or strict debt-based theory may reject this without logical contradiction, though it may be politically unpalatable.

  ### IV. Incompatibility Analysis

  There is a tension within this set that no theory can fully resolve without cost. Specifically, **Desideratum 1 (Differentiation)** and **Desideratum 6 (Equality)** are jointly unsatisfiable in a non-ideal world.

  **The Argument:**
  Desideratum 1 requires the theory to validate the intuition that fines are substitutable while imprisonment is not. This distinction is structural: fines are external and monetizable; imprisonment is bodily and personal. However, because fines are monetizable, they are inherently sensitive to wealth. If a theory satisfies D1 by permitting fine substitution, it necessarily creates a mechanism where those with access to capital (either their own or through wealthy networks) can discharge penalties that those without capital must endure personally. To satisfy D6 (preventing wealth-based immunity), one would have to ban fine substitution or convert all fines to non-transferable burdens. But banning fine substitution violates D1, as it contradicts the robust intuition that proxy payment of fines is permissible. Therefore, a theory that fully respects the phenomenological data (D1) will inevitably offend egalitarian sensibilities (D6). The theorist must choose between descriptive accuracy regarding current practice and normative purity regarding equality.

  ### V. The View-Eliminator

  The single requirement that eliminates the largest number of otherwise attractive views is **Desideratum 3 (The Initiation Asymmetry).**

  **Reasoning:**
  Many sophisticated theories of punishment, particularly consequentialist, deterrent, or rehabilitative models, focus primarily on the *outcome* of the penal process (e.g., crime reduction, rehabilitation, aggregate suffering). For these views, the distribution of suffering is what matters morally. If the offender is rehabilitated and society is safe, it should theoretically matter little whether the suffering was borne by the offender or a volunteer, provided the causal chain holds. D3 asserts that the *source* of the imposition (volunteer vs. state assignment) carries independent moral weight. This immediately disqualifies any theory that treats punishment as a purely instrumental good or a mere cost-benefit analysis. It forces the theory to incorporate deontological constraints regarding agency and consent that many modern "forward-looking" accounts wish to avoid.

  ### VI. Evaluation of Broad Strategies

  Here is how three common strategic approaches fare against the finished list.

  **1. The Material Burden Strategy (Debt Model)**
  *   *Core Claim:* Punishment is the discharge of a debt; debts are transferable if the creditor accepts.
  *   *Performance:* Satisfies **D1** (explains fines as debts) and **D5** (respects permissions). Fails **D2** (cannot explain the Remainder; if the debt is paid, the offender is clear, yet they feel punished) and **D4** (struggles to show how paying a debt communicates condemnation). It likely fails **D6** as it explicitly licenses wealth advantages.
  *   *Verdict:* Strong on mechanics, weak on moral meaning.

  **2. The Expressive Strategy (Symbolic Model)**
  *   *Core Claim:* The substituted suffering is itself a symbol that communicates condemnation to the public and the offender.
  *   *Performance:* Satisfies **D4** (locates condemnation in the symbol) and **D2** (the offender bears the symbolic weight). Struggles with **D1** (why can a fine symbolize substitution but prison cannot? Both are expressive). Struggles with **D3** (if the suffering is purely symbolic, why does state assignment of a volunteer feel monstrous while volunteerism feels noble? The symbol is the same).
  *   *Verdict:* Strong on meaning, weak on the bodily distinction.

  **3. The Identity-Irrelevant Strategy (Utilitarian/Collective Model)**
  *   *Core Claim:* The identity of the sufferer never mattered; only the reduction of bad consequences matters.
  *   *Performance:* Satisfies **D6** (potentially, by optimizing distribution). Catastrophically fails **D3** (cannot distinguish volunteer from assignment) and **D2** (cannot explain why the offender retains a specific remainder). It also fails **D1**, as it would likely advocate for substitution wherever it is cheapest, regardless of burden type.
  *   *Verdict:* Eliminates the puzzle by denying the phenomena that create it.

  **Conclusion for the Framework:**
  The framework reveals that the "Puzzle of Penal Substitution" is not merely about suffering, but about the intersection of *debt*, *symbolism*, and *agency*. A successful theory cannot simply be a theory of punishment; it must be a theory of how moral status is transferred, retained, or symbolized. The tension between D1 and D6 suggests the paper should not aim for a perfect reconciliation, but rather an honest accounting of the trade-off between our retributive intuitions and our egalitarian commitments.
