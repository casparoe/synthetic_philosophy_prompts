prompt: |-
  I'm helping my aunt sort out her late brother's estate while also sitting in a trusts and estates seminar this semester, and the exact same problem keeps showing up in both places in a way that's driving me crazy. In the estate: the will leaves his Martin guitar to my cousin, but he sold it eight or nine years before he died and the check from that sale is still sitting in the account. The lawyer says the cousin gets nothing, that the gift "adeemed," and then mentions almost in passing that in some states he'd get the proceeds instead. In the seminar, meanwhile, we're reading about cy pres, where a charitable trust whose purpose has become impossible doesn't die at all — the court just redirects the money to whatever purpose comes closest to the original one. The example we did was a trust created before the Civil War to build up anti-slavery sentiment, which after emancipation didn't lapse but got pointed at educating and supporting the newly freed people instead. Then the very next case is the opposite: a Georgia park left in trust by a senator for the exclusive use of white people, where after the courts said it could no longer be run that way, the state courts held the segregation was so bound up with the purpose that nothing else could count as near enough to it, so the whole trust failed and the land reverted to his heirs.

  Here's what I can't get straight. Same institution, arguably the same bench, and in one corner a thing can be swapped for something similar and the arrangement survives intact — we still call it the same trust, we still say we're carrying out the dead man's intent — while in the other corner, if the numerically identical item isn't sitting in the estate on the day of death, the gift is simply dead, no matter how much traceable cash is right there and no matter what everyone agrees he would have wanted. My roommate, who's a philosophy major, said there's a standing debate about the difference between something literally persisting through changed circumstances and there merely being a similar thing standing in for it, but neither of us could say which of the two the probate courts think they're doing, and honestly I suspect they've never decided. So: what theory of identity — of what makes a gift, a purpose, or a fund the same thing across time and across situations where it's been altered — do these doctrines actually presuppose? Which rival accounts do they quietly rule out? And is the system committed to both at once, or can one of them be explained some other way that doesn't involve identity at all?

  When you answer, please reconstruct the implicit view as carefully as you can and be strict about seperating what the practice really requires from what it merely fits comfortably with. I can already hear someone saying ademption has nothing to do with identity and everything to do with bright lines, evidence, and not making executors litigate a dead person's hypotheticals, and I want to know whether that deflationary story actually works or whether it smuggles an identity view back in the moment it says the proceeds don't count as the guitar. Flag the places where the practice is underdetermined too, where two or three different metaphysics would license exactly the same ruling — the park case looks like the interesting one to me, since "this purpose can't be approximated" might mean the purpose is genuinely gone, or might just be a claim about who gets to decide what counts as close enough, or about whether the wrongness of the original purpose is allowed to infect its substitutes. And end by telling me concretely what would have to change if you swapped the presupposed view for its rival: if specific bequests got the cy pres treatment, so the nearest substitute always goes to the beneficiary, or if charitable purposes got the ademption treatment, so an impossible purpose kills the trust and everything reverts to the heirs. What breaks, who loses, and what is it that courts would no longer be able to say? No citations or case names needed, I've got the casebook — I just want the reasoning laid out.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Context:** The user is dealing with a real-life estate issue (ademption of a specific bequest: guitar sold, proceeds remain) while studying trusts and estates (cy pres doctrine in charitable trusts vs. failure of trust in private/charitable contexts like the segregated park).
      *   **Core Conflict:** Why does the law treat the *identity* of the subject matter differently in these two contexts?
          *   *Ademption:* Specific item gone = gift dead (even if proceeds exist). Identity is tied to the *specific object*.
          *   *Cy Pres:* Specific purpose impossible = gift survives (redirected to similar purpose). Identity is tied to the *general intent*.
          *   *Park Case:* Specific purpose impossible/unlawful = gift dead (reverts to heirs). Identity is tied to the *specific condition*.
      *   **The Question:** What theory of identity (metaphysics of persistence) do these doctrines presuppose? Do they rule out rival accounts? Is the system inconsistent? Is it actually about identity or just administrative convenience (deflationary view)?
      *   **Requirements:**
          *   Reconstruct the implicit view carefully.
          *   Separate what practice *requires* vs. what it *fits with*.
          *   Address the deflationary argument (bright lines/evidence vs. identity).
          *   Flag underdetermined areas (especially the park case).
          *   Concrete thought experiment: Swap the views (Ademption gets Cy Pres treatment; Cy Pres gets Ademption treatment). What breaks?
          *   No citations/case names.

  2.  **Initial Analysis & Theoretical Framing:**

      *   *Ademption by Extinction:* The law treats the specific bequest as a description of a *particular object*, not a value. If the object is gone, the description fails. This looks like a *rigid designator* theory of identity (Kripke-esque). The gift refers to *that* guitar, not "a guitar or its value."
      *   *Cy Pres:* The law treats the charitable gift as a *general intent* to benefit a class or cause. The specific mechanism is secondary. This looks like a *cluster concept* or *functionalist* theory of identity. The trust is defined by its *purpose*, not its specific assets or methods.
      *   *The Park Case (Charitable Trust Failure):* Here, the specific condition (segregation) was deemed essential to the intent. If that condition goes, the intent goes. This reverts to a rigid designator view regarding the *terms* of the gift.
      *   *The Deflationary View:* It's not metaphysics; it's about probate administration. Specific bequests are easy to verify (is the guitar there? No? Done.). Charitable trusts are supervised by the Attorney General; courts have ongoing jurisdiction. It's about *jurisdiction and administrability*, not ontology.
      *   *User's Challenge:* Does the deflationary view smuggle identity back in? Yes, because saying "proceeds don't count as the guitar" *is* an identity claim.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the tension. It's a classic clash between "Specific Intent" vs. "General Intent."
      *   **Part 1: The Metaphysics of Ademption (The Guitar).**
          *   *Implicit View:* Token Identity. The gift is indexed to a specific physical token at a specific time (execution of will or death, depending on jurisdiction).
          *   *Rival Ruled Out:* Type Identity or Value Substitution. The law rejects the idea that the gift is "the value represented by the guitar."
          *   *Deflationary Check:* Is it just evidence? Partly. But it relies on the testator's control. If they sold it, they changed their mind (presumed). The identity of the *asset* is bound to the *item*.
      *   **Part 2: The Metaphysics of Cy Pres (The Charity).**
          *   *Implicit View:* Functional/Teleological Identity. The trust is defined by its *end goal*, not the *means*. As long as the "spirit" survives, the entity survives.
          *   *Rival Ruled Out:* Literalist Identity. The law rejects the idea that the specific method is constitutive of the trust's existence.
      *   **Part 3: The Park Case (The Limit of Cy Pres).**
          *   *Why did it fail?* The "general intent" wasn't general enough. The segregation was deemed *essential*, not incidental.
          *   *Underdetermination:* Is it metaphysics (purpose is gone) or Policy (courts won't enforce racism)? It's likely a mix. The court decides what is "essential" to the identity of the purpose.
      *   **Part 4: The Deflationary Challenge.**
          *   Does "bright lines" explain it? It explains *why* we have the rules (administrative ease), but it doesn't explain the *outcome* without an identity premise. To say "proceeds aren't the guitar" *is* to make an ontological claim about what constitutes the subject of the gift.
          *   *Crucial Distinction:* Private vs. Charitable. Private trusts benefit individuals (property rights); Charitable trusts benefit the public (policy goals). This drives the metaphysical difference.
      *   **Part 5: The Swap (Thought Experiment).**
          *   *Scenario A: Ademption gets Cy Pres.* (Cousin gets the cash).
              *   *Breaks:* Testator control. Will becomes a snapshot of value, not specific items. Increases litigation (what counts as "traceable"?).
              *   *Loss:* Heirs/Residuary beneficiaries.
              *   *Court can't say:* "The testator changed their mind by selling."
          *   *Scenario B: Cy Pres gets Ademption.* (Charity fails if method impossible).
              *   *Breaks:* Philanthropy. Dead hand control becomes absolute.
              *   *Loss:* The Public/Beneficiaries.
              *   *Court can't say:* "We can honor the spirit without the letter."
      *   **Conclusion:** Synthesize. The system isn't committed to one metaphysics. It uses *Token Identity* for private property (protecting ownership/control) and *Teleological Identity* for public benefit (protecting social utility).

  4.  **Refining the Argument (Self-Correction during drafting):**

      *   *Correction:* I need to be careful not to say "Token Identity" is the only view in ademption. Some states *do* allow proceeds (the "Massachusetts rule" vs. "English rule" nuance, though I won't cite names). The user noted this ("in some states he'd get the proceeds"). I need to address that variance. It shows the metaphysics is a *choice*, not a necessity.
      *   *Refinement on the Park Case:* The user suspects the park case is about "who decides." I need to validate that. The "essential purpose" finding is a judicial construction of identity.
      *   *Deflationary Deep Dive:* The user wants to know if the deflationary story works. I should argue it *partially* works but rests on a normative view of property rights which implies an ontological view. You can't separate the "rule" from the "thing" completely.
      *   *Tone:* Keep it analytical, rigorous, avoiding legalese where possible, focusing on the philosophical underpinnings as requested.

  5.  **Final Polish:** Check against constraints. No citations. Strict separation of requirement vs. fit. Concrete ending.

      *(Self-Correction on "Identity"):* I need to make sure I don't confuse "identity of the object" with "identity of the legal right." In ademption, the legal right is contingent on the object. In cy pres, the legal right is contingent on the purpose. The "identity" in question is the *persistence conditions of the gift*.

      *Plan:*
      1.  Define the two competing persistence conditions (Object-Based vs. Purpose-Based).
      2.  Analyze Ademption (Object-Based).
      3.  Analyze Cy Pres (Purpose-Based).
      4.  Analyze the Park Case (The Boundary of Purpose).
      5.  Address the Deflationary Objection.
      6.  The "Swap" Thought Experiment.

  6.  **Final Review against User Prompt:**
      *   "Reconstruct implicit view": Yes.
      *   "Strict about separating what practice requires vs fits": Yes.
      *   "Flag underdetermined places": Yes (Park case).
      *   "Concrete what would change if swapped": Yes.
      *   "No citations": Yes.

      *Let's write.*
answer: |-
  You have identified the central tension in fiduciary law: the conflict between the **ontology of the object** (what constitutes the *thing* given) and the **ontology of the intent** (what constitutes the *will* of the giver). The law does not operate with a single, unified theory of identity. Instead, it toggles between two distinct metaphysical frameworks depending on whether the gift is private (ademption) or public/charitable (cy pres).

  Here is the reconstruction of the implicit views, the deflationary counter-argument, and the consequences of swapping them.

  ### 1. The Metaphysics of Ademption: Token Identity
  In the case of your aunt's brother and the Martin guitar, the law presupposes a theory of **Token Identity**.

  **The Implicit View:**
  The specific bequest is not a transfer of value; it is a designation of a specific physical token existing in the world. The legal right created by the will is *indexical*—it points to *that* guitar, not "a guitar" or "the value of a guitar." The identity of the gift is rigidly bound to the physical continuity of the asset. If the token ceases to be part of the estate's corpus, the reference fails. The gift does not migrate to the proceeds because the proceeds are a *different token* (a chose in action/cash) than the original token (the instrument).

  **What This Rules Out:**
  This view explicitly rejects **Type Identity** or **Value Substitution**. It rules out the idea that the gift is essentially "the economic benefit the testator associated with this description." If the law accepted Type Identity, the cousin would receive the cash, because the cash fulfills the *type* of benefit (value) intended. By denying this, the court asserts that the *particularity* of the object is constitutive of the gift itself.

  **Does the Deflationary Story Work?**
  Your roommate's deflationary argument (that this is just about bright lines and evidence) is partially correct but incomplete.
  *   **Where it fits:** It is true that courts want to avoid litigating the testator's state of mind. If the guitar is gone, it is administratively easy to say the gift fails. Tracing proceeds requires accounting work and invites disputes about commingling.
  *   **Where it smuggles identity back in:** The deflationary argument claims this is just a procedural rule. But to say "the check is not the guitar" is not merely a procedural convenience; it is an ontological claim. If the law truly believed the gift was just "value," the procedure would be to pay the value. The procedure *is* the metaphysics. The bright line exists *because* the law views the specific item as the essential container of the intent.
  *   **The Underdetermination:** You noted that in some states, the cousin *would* get the proceeds. This proves the metaphysics is a choice, not a necessity. In those jurisdictions, the law adopts a **Presumption of Continuity**, assuming the testator intended the benefit to survive even if the form changed. This shows that Ademption by Extinction is not a law of nature; it is a default rule about how strictly we bind intent to matter.

  ### 2. The Metaphysics of Cy Pres: Teleological Identity
  In the anti-slavery trust example, the law presupposes a theory of **Teleological Identity**.

  **The Implicit View:**
  A charitable trust is not defined by its assets or its specific methods, but by its *end goal* (telos). The identity of the trust persists as long as the general charitable purpose can be recognized, even if the specific means to achieve it vanish. The trust is a functional entity, not a static bundle of property. When the original method becomes impossible, the court does not see a "new" trust; it sees the *same* trust adapting to new circumstances. The identity is located in the *spirit*, not the *letter*.

  **What This Rules Out:**
  This rules out **Literalist Identity**. It rejects the notion that the specific instructions are constitutive of the trust's existence. If the law adhered to Literalist Identity, the anti-slavery trust would have failed the moment slavery was abolished, because the specific instruction ("build anti-slavery sentiment") became logically impossible or moot.

  ### 3. The Park Case: The Boundary of Teleology
  The segregated park case is the critical stress test. Here, the court reverted to something closer to **Token/Conditional Identity**.

  **The Implicit View:**
  The court determined that the segregation clause was not an incidental *method* (like the anti-slavery sentiment), but an *essential condition* of the gift's identity. The donor's intent was not "a park for the public" (Teleological); it was "a park for the public *under these specific social conditions*" (Conditional).

  **Where the Practice is Underdetermined:**
  You are right to suspect this is about "who decides." The metaphysics here are indeterminate.
  1.  **Metaphysical Reading:** The court genuinely found that the "purpose" was segregation, not recreation. Therefore, without segregation, the "purpose" ceased to exist ontologically.
  2.  **Policy Reading:** The court refused to validate a racist purpose. To apply cy pres would require the court to affirm that "education for whites" is sufficiently similar to "education for all." The court may have decided that the moral taint of the original purpose infects any substitute, making identity impossible to construct.
  3.  **Authority Reading:** This is about the limits of judicial power. In the anti-slavery case, the court expands the purpose (benevolent). In the park case, the court refuses to rewrite the donor's discriminatory terms.

  The practice does not require a specific metaphysics here. It merely requires a justification for stopping the cy pres doctrine. "The purpose is gone" is a convenient metaphysical shorthand for "We will not alter this specific intent."

  ### 4. The Swap: What Breaks?

  To understand what these doctrines are actually doing, we must swap their underlying theories of identity.

  #### Scenario A: Ademption gets Cy Pres Treatment (The "Substitutive" Will)
  *The Rule:* If a specific item is gone, the beneficiary gets the nearest substitute (proceeds, insurance, replacement item).
  *   **What Breaks:** The concept of **Testator Control during Life**.
      *   Currently, ademption presumes that if you sell the guitar, you changed your mind. You exercised dominion over the asset, so the gift is revoked.
      *   If you switch to Cy Pres logic, the Will acts as a **floating lien** on the testator's wealth. You could sell the guitar, spend the money on groceries, and the cousin could still claim the value from the residuary estate.
  *   **Who Loses:** The **Residuary Beneficiaries** (often the heirs or charity). Their share becomes volatile, subject to claims based on items that no longer exist.
  *   **What Courts Could No Longer Say:** They could no longer say, "The testator's act of selling revoked the gift." They would have to say, "The testator's intent survives the alienation of the asset." This undermines the principle that a will is ambulatory (effective only at death) and subject to revision by conduct during life.

  #### Scenario B: Cy Pres gets Ademption Treatment (The "Literalist" Charity)
  *The Rule:* If the specific charitable purpose becomes impossible, the trust fails and the assets revert to the donor's heirs (resulting trust).
  *   **What Breaks:** The **Perpetuity of Philanthropy**.
      *   Charitable trusts are allowed to exist in perpetuity precisely because they serve the public. If they fail whenever circumstances change, donors will stop giving for long-term projects.
      *   It creates a **Dead Hand Problem** on steroids. A donor could restrict a fund to "curing polio" specifically. Once polio is cured, the money reverts to heirs rather than going to "curing viral diseases."
  *   **Who Loses:** The **Public**. The social utility of the funds is lost. Heirs get windfalls based on the obsolescence of charity.
  *   **What Courts Could No Longer Say:** They could no longer say, "We are honoring the donor's general charitable intent." They would have to say, "We are honoring the donor's specific instructions, even if it kills the charity." This shifts the law from protecting *beneficence* to protecting *donor specificity*.

  ### 5. Synthesis: The Dual Ontology of Property

  The system is not inconsistent; it is **bifurcated**. It relies on two different theories of identity because it serves two different masters.

  1.  **Private Estates (Ademption):** The master is **Property Rights**.
      *   The law prioritizes the testator's right to change their mind while alive.
      *   *Identity Theory:* **Token Identity.** The gift is the object. If the object is gone, the right is gone.
      *   *Why:* To ensure the testator retains full control over their assets until the moment of death.

  2.  **Charitable Trusts (Cy Pres):** The master is **Social Utility**.
      *   The law prioritizes the continued benefit to the public over the specific whims of the donor.
      *   *Identity Theory:* **Teleological Identity.** The gift is the purpose. If the purpose survives, the right survives.
      *   *Why:* To prevent wealth from being locked up in useless or impossible mandates that harm the public interest.

  **The Park Case Resolution:**
  The park case sits on the fault line. The court had to decide whether the trust was a "Charity" (Social Utility master) or a "Private Restriction" (Property Rights master). By ruling that the trust failed, they effectively treated it as a private restriction disguised as a charity. They decided the *identity* of the gift was the segregation, not the park. This was likely less a metaphysical discovery and more a policy determination that the "Social Utility" justification for Cy Pres cannot be used to sanitize a purpose that violates public policy.

  **Conclusion:**
  The deflationary story (that this is just about evidence and bright lines) fails because it cannot explain why the bright lines are drawn where they are. We *could* have a bright line rule that says "proceeds always follow specific bequests." We don't, because we prioritize the testator's lifetime control over the beneficiary's expectation. Conversely, we *could* have a rule that says "charitable trusts fail if the method changes." We don't, because we prioritize public benefit over donor specificity.

  The law presupposes that **private gifts are about things**, and **charitable gifts are about goals**. If you swap these, you either destroy the testator's control over their own property or you destroy the endurance of charitable institutions. The "identity" of the gift is not a pre-existing fact the courts discover; it is a legal construct chosen to maximize the policy goals of the specific context.
