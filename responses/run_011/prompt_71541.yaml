  Arthur finds a bank statement showing his wife emptied their savings. He knows she betrayed him ($\neg P$). He decides he cannot live with this knowledge. He intends to believe she was hacked ($P$). He knows $P$ is false now. He intends to achieve $P$ by destroying the statement, filing a false police report, and repeatedly recounting the "hacking" story to friends until the rehearsal overwrites his memory of the discovery. He treats his own mind as a malleable record, intending to edit the source material so the false narrative becomes the only retrievable data. Six months later, he angrily denies she took the money, sincerely convinced of the hack, with no conscious access to the original knowledge.

  **The Check**

  **Intention:** Arthur intends to *manipulate his evidential intake and memory consolidation*. He can intend this without representing the truth as *immutable fact*, but rather as *current data* to be replaced. He represents the situation as "I have evidence X" rather than "X is the eternal truth," allowing him to intend the deletion of X without logically contradicting the goal of believing $\neg X$.

  **The Split:** The split is **temporal**, not structural. There are no homunculi; there is only Arthur-at-$T_1$ (Knower) and Arthur-at-$T_2$ (Believer). They do not coexist. The contradiction is dodged because the belief-state $\neg P$ is extinguished before the belief-state $P$ is fully consolidated. The "deception" is the causal chain linking them, not a simultaneous state of knowing and not-knowing.

  **Heavy Lifting:** The feature doing the work is **Memory Overwriting via Rehearsal**. If you delete this, Arthur remains a liar who knows the truth but speaks falsely; he does not become self-deceived. The skeptic redescribes this as "motivated reasoning": Arthur simply preferred $P$, avoided $\neg P$ evidence, and drifted into belief. They argue the destruction of the statement was just extreme avoidance, not a plan to engineer belief.

  **Counter:** Avoidance is passive; destruction is active engineering. The skeptic cannot explain the *specific intent to erase memory* without admitting a plan to alter belief states directly. However, the case only survives if the memory overwrite is successful. If Arthur retains *any* implicit knowledge of the destruction, the homunculus returns (a part of him knows he destroyed the truth). To survive the redescription, the case requires that the *mechanism of forgetting* itself be forgotten—the intention must consume the trace of the intention.
