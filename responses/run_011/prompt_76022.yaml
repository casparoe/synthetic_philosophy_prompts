      *   *Clause 2:* Ruin constraint. Institutional survival vs. Mathematical growth.
      *   *Clause 3:* Stationarity assumption.
      *   *Clause 4:* Cost of carry. Consistency with Clause 2 (constraint vs. cost).
      *   *Synthesis:* Robust Growth.
      *   *Rewrites:* Terminal Wealth vs. Utility.

  10. **Refining and Polishing:**
      *   *Check Word Count:* Need to ensure depth without fluff. 1500 words is tight for this much philosophy. I need to be concise.
      *   *Tone:* Philosophical, analytical, precise.
      *   *Specific Prompt Requirements:* Ensure I answer "is it ergodicity or risk aversion?" and "which clause must go?" explicitly.
      *   *Clause 1 Specifics:* Address the "wrong tail" probability account. It implies the true measure is singular and unknown, not just noisy parameters.
      *   *Clause 2/4 Consistency:* Explicitly resolve the "buying protection in-house" paradox.

      *(Self-Correction during drafting)*: I need to make sure I don't just explain Kelly criterion mechanics but focus on the *philosophical presuppositions* as requested. The prompt asks about "what entity is being optimized."
      *   *Entity:* The trajectory of the capital, not the expectation of the capital.
      *   *Clause 1:* The "half" isn't mathematically derived from the preamble; it's a heuristic overlay. I need to state that clearly.
      *   *Clause 3:* Is drift a loss? Yes, under the assumption of constant geometric Brownian motion parameters.

      *(Word Count Check)*: If I spend 200 words on Preamble, 250 on each clause (1000), 200 on synthesis, 100 on rewrites. That's 1500. I need to be tight.

