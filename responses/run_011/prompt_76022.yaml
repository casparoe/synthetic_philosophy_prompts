answer: |-
  **Preamble: The Ergodic Claim**
  The preamble rejects Expected Utility Theory in favor of Ergodicity Economics. It presupposes that the entity being optimized is not the ensemble average of wealth (the expectation across possible worlds) but the time-average growth rate of wealth (the trajectory through the actual world). In reinvestment contexts, these diverge: the arithmetic mean (ensemble) is dominated by rare, huge outcomes, while the geometric mean (time) is dragged down by volatility. The claim that a rule optimal by the first standard is endorseable by no trustee "from inside" is a substantive claim about non-ergodicity. It is not merely risk aversion redescribed; risk aversion posits a concave utility function over wealth levels, whereas this posits a linear utility over log-wealth *along a path*. Rationality is defined diachronically: a decision is rational if it maximizes the growth rate of the specific lineage of capital you inhabit, not the average of lineages you do not.

  **Clause 1: The Half-Kelly Heuristic**
  This clause presupposes that probability estimates are not merely noisy parameters within a known model, but that the model class itself may be false ("modeled the wrong tail"). This implies a Knightian distinction between risk (known distribution) and uncertainty (unknown distribution), despite the preamble's focus on time averages. If the committee's probabilities were truly "their own," subjective Bayesianism would demand they bet according to those probabilities. Halving implies a meta-uncertainty: the true measure lies outside the committee's sigma-algebra.

  Why one-half? Mathematically, betting half the full Kelly fraction captures 75% of the maximum growth rate while reducing volatility by 50%. It is a robustness heuristic, not a derivation. The omission of the forgone growth share is not innocent; it obscures the cost of prudence. It presents survival as a free good, whereas it is purchased with sacrificed compounding. This clause strictly presupposes that the cost of ruin (or model error) is infinite, lexicographically outranking the growth objective stated in the preamble.

  **Clause 2: The Ruin Constraint**
  This clause presupposes that the trust is an institutional entity that can cease to function before mathematical recovery is possible. Pure log-utility optimization (Kelly) allows for arbitrary drawdowns provided the probability of absolute zero is zero. Clause 2 imposes a hard floor at 85% of capital. This contradicts the preamble's "sole objective" if taken literally; a bet with positive expected log growth but a 1% chance of a 20% loss is forbidden.

  This is not an inconsistency if the theory is read as "Maximize Growth Subject to Non-Ruin." The entity optimized is the *continuing* trust. However, if one demands strict adherence to the preamble's growth maximization, Clause 2 must go. Its presence reveals the preamble's claim to be conditional: growth is maximized only over paths that do not breach the institutional tolerance for loss. It treats the 15% threshold as a hard boundary of the state space, rendering any wealth below it inaccessible or irrelevant.

  **Clause 3: Rebalancing and Stationarity**
  This clause presupposes stationarity: that the return distributions defining the "target weights" are stable over time. It views drift from target weights as a loss of exposure to the growth-optimal mix, rather than as information updating the probability estimates. This is imported from the theory of volatility harvesting, not strictly entailed by the growth objective. If the world is non-stationary, rebalancing to old weights could be irrational. The clause assumes the market's price movements are noise around a stable signal, rather than a discovery process changing the signal itself. It treats the portfolio weights as the control variable, assuming the environment is the constant.

  **Clause 4: No Insurance**
  This clause presupposes that protection is always a negative-drift asset. It aligns with the preamble: insurance premiums reduce the geometric mean return. However, it creates tension with Clause 2. Clause 2 creates "implicit insurance" by banning tail-risk bets; Clause 4 bans "explicit insurance" by banning options. This is consistent only if explicit insurance is assumed to be actuarially unfair (negative expected log growth) while position sizing (Clause 2) is costless. The underlying theory is that one should manage tail risk by *not taking the bet* rather than *hedging the bet*. Hedging introduces drag; exclusion does not.

  **Synthesis: Robust Growth Theory**
  Is there a single underlying theory? Yes: **Constrained Ergodic Growth.** The preamble defines the direction (time-average growth), while Clauses 1 and 2 define the survival boundary. Clause 1 handles epistemic uncertainty (model error); Clause 2 handles aleatoric uncertainty (realized loss). Clause 4 ensures no drag on the growth rate, and Clause 3 maintains the exposure required to capture that growth.

  The distinction between "strictly presupposes" and "sits well with" is crucial here. The document strictly presupposes non-ergodicity (Preamble) and institutional ruin constraints (Clause 2). It merely sits well with Knightian uncertainty (Clause 1); a strict Bayesian could argue that if you truly believe your probabilities, you should not halve them. The "half" is a pragmatic overlay, not a logical entailment of the ergodic argument. Similarly, Clause 3 sits well with stationarity but is not entailed by it; a dynamic growth optimizer might change targets daily.

  **Counterfactual Rewrites**

  **Scenario A: Maximizing Expected Terminal Wealth (Fixed Horizon)**
  If the trust had a fixed horizon and maximized expected terminal wealth (arithmetic mean), the manual would invert.
  *   **Preamble:** Would cite the Law of Large Numbers over the ensemble, not the time path. Ergodicity would be assumed or irrelevant.
  *   **Clause 1:** Would invert. To maximize terminal expectation, one should bet *more* than Kelly, potentially leveraging up, as volatility drag is irrelevant for a single terminal snapshot. The "half" discount would be deleted as suboptimal.
  *   **Clause 2:** Would likely vanish or relax. A 99% chance of zero and 1% chance of 1000x might be acceptable if it maximizes the arithmetic mean.
  *   **Clause 4:** Would become contingent. Insurance might be purchased if it protects the terminal outcome, even with negative expected return, depending on the specific horizon constraints.
  *   **Clause 3:** Would become unintelligible. Rebalancing is a strategy to manage path volatility; for terminal wealth, one simply holds the highest expected value asset until the end.

  **Scenario B: Standard Concave Utility (CRRA)**
  If the trust applied a standard Constant Relative Risk Aversion utility function to wealth levels (e.g., $U(W) = W^{1-\gamma}/(1-\gamma)$):
  *   **Preamble:** Would shift from "growth rate" to "expected utility of wealth." The ergodic argument would be replaced by a preference argument.
  *   **Clause 1:** The "half" would be replaced by a specific risk aversion coefficient. If $\gamma=2$, the optimal bet is naturally half-Kelly. The justification would shift from "wrong tail" to "my utility curvature." The omission of growth cost would remain, but it would be framed as a utility trade-off rather than a survival heuristic.
  *   **Clause 2:** Would become redundant. A sufficiently concave utility function naturally penalizes large losses without hard constraints. If kept, it would imply infinite risk aversion below the 15% threshold.
  *   **Clause 4:** Would change. Insurance could be rational even with negative expected return if it smooths utility sufficiently. The ban would need to be justified by the specific loading cost relative to the risk aversion parameter.
  *   **Clause 3:** Would remain largely similar, as rebalancing maintains risk exposure consistent with constant relative risk aversion, but the justification would be "maintaining risk profile" rather than "harvesting volatility."

  **Conclusion**
  The document you are signing is a hybrid. It wears the clothes of ergodic growth maximization but operates on the bones of institutional survival. It asks you to believe that time-average growth is the only rational goal, but then restricts that goal to prevent you from ever testing the limits of that theory. It is a philosophy of infinite horizons managed by finite fears.
