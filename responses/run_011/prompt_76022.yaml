          *   Clause 2: Might relax. A 99% chance of 100x and 1% chance of 0 might be acceptable for expected value.
          *   Clause 4: Might buy insurance if it protects the terminal outcome, regardless of drag.
      *   *Scenario B: Standard Concave Utility (CRRA).*
          *   Preamble: Changes to utility of wealth levels.
          *   Clause 1: The "half" becomes specific to the risk aversion coefficient ($\gamma$). If $\gamma=2$, you naturally bet half-Kelly. The "wrong tail" justification vanishes.
          *   Clause 2: Becomes redundant or integrated into the utility function.
          *   Clause 4: Insurance might be bought if it smooths consumption/utility, even with negative expected return.

  9.  **Drafting - Section by Section (monitoring word count):**

      *   *Intro:* Brief setup.
      *   *Preamble:* Ergodicity vs. Risk Aversion. It's ergodicity.
