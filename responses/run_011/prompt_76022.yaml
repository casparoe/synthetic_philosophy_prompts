  2.  **Deconstruct the Preamble:**
      *   *Core Claim:* Maximize long-run compounded growth rate (Kelly criterion logic).
      *   *Argument:* Ensemble average (expected value) vs. Time average (actual path). In reinvestment, they diverge (non-ergodic).
      *   *Philosophy:* This is an ergodicity argument. It claims standard Expected Utility Theory (EUT) confuses ensemble averages for time averages. It's not just "risk aversion" redescribed; it's a claim about the physical mathematics of growth. Rationality is defined by what survives in the *actual* timeline, not the *average* timeline.

  3.  **Deconstruct Clause 1 (Half-Kelly):**
      *   *Rule:* Size = 0.5 * Full Kelly.
      *   *Justification:* Not parameter uncertainty (noise), but "modeled the wrong tail" (model risk/structural uncertainty).
      *   *Philosophical Issue:* If probabilities are "the committee's own estimates," usually that implies subjective Bayesianism. But "wrong tail" implies the true distribution lies outside the model class.
      *   *Why Half?* Mathematically, half-Kelly captures ~75% of growth with ~50% of volatility. It's a heuristic for robustness. The omission of the growth cost is significant—it suggests survival trumps efficiency, hinting that the "growth objective" is lexicographically ordered below "survival."
      *   *Probability:* Implies a distinction between *risk* (known distribution) and *Knightian uncertainty* (unknown distribution), despite the preamble's focus on time averages.

  4.  **Deconstruct Clause 2 (Hard Stop-Loss):**
      *   *Rule:* Max loss < 15% of capital.
      *   *Conflict:* Pure Kelly might accept a small probability of 90% loss if the upside is huge.
      *   *Philosophy:* This is a ruin constraint. It prioritizes *continuation* over *optimization*. It treats the trust as a finite entity that can cease to function even if "mathematically" recoverable. It contradicts the pure log-utility view where wealth=0 is just negative infinity utility but technically allowed if probability is zero. Here, probability isn't zero, so it's banned.
      *   *Entity:* The trust as an institution, not just a number.

  5.  **Deconstruct Clause 3 (Rebalancing):**
      *   *Rule:* Quarterly rebalance + bands.
      *   *Presupposition:* Stationarity. The "target weights" assume the return distribution is stable over time.
      *   *Drift:* Viewing drift as "loss" implies the market prices are noisy deviations from a stable truth, rather than the market discovering new information. It assumes mean reversion or at least constant proportions.
