      *   *Reject Step 6 primarily, but also refine Step 5.*
      *   *Why Step 6 fails:* A firm is an island of planning in a sea of market prices. The "accounting prices" inside the firm are anchored by the *external* market prices of the final goods and the capital goods they *do* buy. A socialist economy has no external market to anchor the shadow prices.
