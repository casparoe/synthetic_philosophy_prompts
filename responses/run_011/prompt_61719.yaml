  ### 4. "Never Best Response" vs. "Strictly Dominated"
  In **two-player** games, these claims are **identical** (Pearce's Lemma). In **three-player** games, they **come apart**: a strategy can be "Never a Best Response" but **not** strictly dominated by any mixture.

  **Smallest Example (3 Players):**
  *   **P1** has strategies **U, D, M**. **P2** has **L, R**. **P3** has **l, r**.
  *   **P1 Payoffs** (based on P2/P3 joint move):
      *   (L, l): U=2, D=0, **M=1**
      *   (L, r): U=0, D=2, **M=1**
      *   (R, l): U=0, D=2, **M=1**
      *   (R, r): U=2, D=0, **M=1**
  *   **Why M is NBR:** In every column, either U or D scores 2, while M scores 1. M is never a best response.
  *   **Why M is Not Dominated:** To beat M (score >1), a mix needs $>50\%$ U (for L,l) AND $>50\%$ D (for L,r). This is impossible. No mixture dominates M.
