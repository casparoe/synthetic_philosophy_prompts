  I reject step (6) because it falsely assumes that transformational filters like decay and deposition are knowable only from their output, ignoring the independent warrant provided by actualistic studies of taphonomy and material behavior.

  This premise looked unobjectionable because it captures a genuine epistemic asymmetry: we cannot observe the past directly, so any claim about the filters (what was discarded, what survived) seems to rely on assuming the very history we are trying to reconstruct. It draws force from the underdetermination problem—that multiple historical sequences can produce identical material residues—making it seem as though we are trapped in a hermeneutic circle where the record validates the model that reads the record. However, this conflates the uniqueness of historical events with the opacity of the processes transforming them. We do not characterize the filter of soil sedimentation by inferring it from the pit alone; we characterize it through geoarchaeology, experiments, and uniformitarian principles that operate independently of the specific archaeological context.

  If you defend the chapter by giving up (4), you owe a account of how general psychological principles can be falsified by material patterns despite the indefinite variability of human expression, risking the imposition of universalist categories that erase cultural difference. If you give up (5), you owe a demonstration of how analogical warrant can be updated by the target record without circularity, showing how a pattern can count against an analogy rather than simply being dismissed as a disanalogy. If you bite the bullet on (8), you owe a defense of skepticism about your colleagues' beliefs that does not dissolve the possibility of collaboration or argument, effectively accepting solipsism. By contrast, rejecting (6) costs only a commitment to actualism—the view that physical and behavioral processes observable today operated in the past—which is already the foundational warrant for every stratigraphic claim your colleagues make.

  This diagnosis satisfies your test case by distinguishing the warrant for physical event reconstruction from the warrant for mental state ascription. The claim that breakage occurred before deposition relies on taphonomic filters (fracture mechanics, sedimentation rates) that are characterized independently of the pit via actualistic science; rejecting (6) validates this inference. The claim that the snapping meant ritual termination relies on bridging principles connecting pattern to belief; retaining (4) and (5) blocks this inference because the material pattern cannot confirm the analogical warrant nor falsify the general principle. Thus, the first sort of inference works because it bypasses the opacity of the record through independent process laws, while the second fails because it remains trapped within the opacity of meaning, a distinction grounded in the source of warrant rather than your say-so.
