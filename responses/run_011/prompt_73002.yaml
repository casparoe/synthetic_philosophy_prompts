answer: |-
  **TO:** Board of Trustees
  **FROM:** [Your Name], Faculty Trustee
  **DATE:** January 5, 2025
  **SUBJECT:** Opinion on Treasury Management Incident and Policy Recommendations

  **Recommendation**

  I recommend the Board adopt the following two motions. First, regarding the treasurer's conduct: we should record that the transactions were permissible under the policy as written but represent a failure of stewardship given the net loss. We should neither censure nor fully exonerate the treasurer, but rather note that the loss resulted from systemic ambiguity rather than individual malfeasance. Second, regarding governance: we should adopt the proposal to evaluate transaction sequences and cap annual moves, rather than binding the treasurer to a fixed annual plan or leaving the policy unchanged.

  My judgment on the treasurer's conduct does not depend on the governance change; even under the old rules, a nine-thousand-dollar loss for no gain warrants a note of caution. However, the governance change is necessary to prevent recurrence. The Board can coherently adopt the conduct record while rejecting the policy change, though doing so would leave the foundation exposed to identical losses in the future.

  **Reasoning**

  The central issue is not whether the treasurer broke the rules, but whether the rules allowed him to break the bank. The audit confirms that each individual move satisfied the investment policy. The first move improved yield, the second credit quality, and the third liquidity. The failure lies in the policy's allowance of shifting criteria.

  Imagine measuring three boxes. If you choose the tallest one, then switch to measuring the heaviest, then switch to the widest, you can circle through all three boxes and end up where you started, having paid a fee for each measurement. The treasurer did not hold inconsistent preferences; he applied different rulers at each step. The policy authorized this flexibility but failed to require a unified standard of value that weighs yield, credit, and liquidity against one another simultaneously.

  The proposal to bind the treasurer to a fixed annual plan solves the looping problem by removing discretion. However, it assumes we can predict market conditions in January that will hold true in June. The liquidity concern that prompted the return to Instrument X was real; a rigid plan might have prevented us from addressing it. Conversely, leaving the policy unchanged assumes nine thousand dollars is an acceptable cost of flexibility. It is not. The middle path—evaluating sequences and capping moves—preserves the ability to react to genuine crises while preventing churn driven by shifting priorities.

  **Operational Rule for the Treasurer**

  To implement this, the treasurer requires a clear directive applicable during ordinary operations. Effective immediately, the following protocol applies:

  1.  **Comparison Standard:** Any proposed move must be justified by a net anticipated gain that exceeds transaction fees by a margin of at least 200 percent.
  2.  **Sequence Check:** The treasurer must document whether the proposed move makes a subsequent reversal foreseeable within twelve months. If a reversal is foreseeable, the move is prohibited unless the initial position poses an immediate risk of loss.
  3.  **Frequency Cap:** No more than two reallocations of the operating endowment are permitted per fiscal year.
  4.  **New Facts:** If a genuinely new fact regarding credit or liquidity arises mid-year requiring a move outside this cap, the treasurer must certify the change in writing to the Chair and one additional trustee. They shall decide jointly within forty-eight hours whether the fact warrants an exception.

  This rule removes the need for philosophical debate during trading hours. It forces a calculation of net value rather than single-criterion improvement and introduces a human check on what constitutes an emergency.

  **The Flexibility Objection**

  The strongest objection to this recommendation comes from the trustees who oppose any commitment rule. They argue that fettering the treasurer prevents him from using better information available later. A foundation unable to respond to real changes trades a bounded nine-thousand-dollar loss for an unbounded one. If the market crashes in May, a cap on moves could prevent us from fleeing to safety.

  This objection holds weight regarding the *cap*, but not regarding the *sequence evaluation*. We can mitigate this risk by setting the cap high enough to allow crisis response (two moves) but low enough to prevent tinkering. Furthermore, the "New Facts" exception explicitly preserves the ability to act on genuine emergencies. What does not survive this objection is the idea that unlimited discretion is necessary for safety. The treasurer's three moves were not responses to external shocks; they were optimizations based on shifting internal criteria. Security comes from stability, not from the freedom to churn. We accept a small risk of delayed reaction to preserve certainty against self-inflicted loss.

  **Counterfactuals**

  Two variations of this case are likely to arise in discussion.

  First, would my recommendation change if the loop involved four moves and a forty-thousand-dollar loss? No. The remedy remains the same because the defect is procedural, not proportional. A larger loss increases the urgency of the policy change but does not alter the nature of the failure. The structure of the loophole is identical regardless of the sum.

  Second, would my recommendation change if the treasurer had foreseen the entire sequence in advance and executed it anyway? Yes. This variation isolates foresight from procedure. If the treasurer knew the sequence would loop and incur fees but proceeded regardless, this is no longer a policy failure but a breach of fiduciary duty. In that specific instance, censure would be appropriate, and the governance change would be secondary to personnel action. However, the audit found no evidence of foresight, only contemporaneous justification. Therefore, we must treat this as a systemic flaw rather than individual bad faith.

  **Conclusion**

  We are not dealing with a money pump driven by irrational preferences, but a policy that permitted comparison without a complete ordering. The treasurer followed the map we gave him, even if the map led in a circle. We should record the loss as a lesson in policy design, not personnel failure, and adopt the sequence-and-cap rule to ensure our next map leads somewhere.
