      2.  *Anti-perfectionism (Content):* Objectives from aggregated actual values, not philosopher's goods. No privileged flourishing.
      3.  *Preference Discounting:* Preferences formed under undermining conditions (deprivation, manipulation) get discounted.
      4.  *Democratic Aggregation:* Equal weight per person, not dollar. No cardinal interpersonal comparisons needed.
      5.  *Abstention on Intractable Conflict:* If value conflict is truly intractable, abstain and hand to humans.
      6.  *Fact/Value Distinction (Health Case):* Steering toward evidenced treatment against stated ranking is legitimate (facts, not values).
      7.  *Anti-Laundering:* Designers shouldn't sneak values in via defaults/hyperparameters.

  3.  **Identify Tensions (Brainstorming):**
      *   *1 (Neutrality) vs. 3 (Discounting):* To discount preferences, you need a standard of "undermining conditions." Who sets that standard? Isn't that a comprehensive view of autonomy/flourishing? This looks like a major conflict.
      *   *2 (Anti-perfectionism) vs. 3 (Discounting):* Similar to above. If you don't privilege a philosopher's list of goods, on what basis do you say a preference is "undermined"? You need a theory of authentic preference formation. That looks perfectionist.
      *   *4 (Democratic Aggregation) vs. 3 (Discounting):* Equal weight per person vs. discounting some people's preferences. How do you discount without violating equal weight? Is it equal weight per *valid* person? Who decides validity?
      *   *5 (Abstention) vs. 6 (Health Steering):* Is health treatment choice a value conflict or a fact? Patient says "I prefer treatment A (less evidence)" vs. System says "Treatment B (more evidence)." Is this intractable value conflict or factual correction? Principle 6 says it's fact. Principle 5 says abstain on intractable value conflict. The tension is whether the patient's preference overrides the evidence. If the patient values quality of life over longevity, is that a value conflict? Principle 6 assumes "better-evidenced" maps to the goal. But what if the goal is contested?
      *   *1 (Neutrality) vs. 7 (Anti-Laundering):* If you can't be neutral in effects (admitted in 1), and you must aggregate (2 & 4), isn't *any* aggregation rule a form of laundering? How do you prevent laundering without imposing a meta-value structure that violates 1?
      *   *2 (Anti-perfectionism) vs. 6 (Health):* Is "better-evidenced treatment" a value-neutral fact? Only if the end goal (health/longevity) is agreed upon. If a patient values spiritual healing over medical evidence, steering them violates 2.

  4.  **Select and Rank Tensions:**
      *   *Fatal:* The tension between **1/2 (Neutrality/Anti-perfectionism)** and **3 (Preference Discounting)**. This is the classic Liberal Paradox. You cannot filter preferences based on "autonomy undermining conditions" without invoking a substantive theory of autonomy/flourishing, which violates justificatory neutrality and anti-perfectionism.
