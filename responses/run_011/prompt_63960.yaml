  4.  **Developing the Categories (The "Menu"):**

      *   **Claim 1: The Methodological "Is" (The Model).** Like "the atmosphere is a fluid." It's a useful approximation for prediction, not a literal identity.
      *   **Claim 2: The Input-Output "Is" (Black Box).** The brain computes a function. If you match the function, you match the mind. (Behaviorism/Turing Test).
      *   **Claim 3: The Causal/Structural "Is" (White Box).** The brain processes information via specific causal steps. If you replicate the causal structure, you get the mind. (Computational Functionalism).
      *   **Claim 4: The Substrate-Neutral "Is" (The Strong Claim).** Computation is abstract. It doesn't matter *how* it's done (silicon, neurons, brass gears), only *what* is computed. (Multiple Realizability).

  5.  **Addressing the "Computer" Definition:**
      *   *Von Neumann (Digital):* Discrete steps, symbols.
      *   *Tide Predictor (Analog):* Continuous, physical coupling.
      *   *Relevance:* If the brain is analog/continuous, a digital simulation might miss something (precision, chaos). If the brain is a "computer" in the broad sense (information processor), the tide predictor counts. If it means "digital symbol manipulator," the tide predictor doesn't.
      *   *Impact on Conclusion:* If the brain is analog and consciousness depends on continuous physics, a digital duplicate might fail (Lights Off).

  6.  **Addressing the "Is" (Ontology vs. Model):**
