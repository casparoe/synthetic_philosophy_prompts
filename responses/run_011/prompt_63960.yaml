      *   *Problem 1: "Computer".* Is it digital? Analog? Symbolic? Subsymbolic? Universal Turing Machine? Physical mechanism?
      *   *Problem 2: "Is".* Ontological identity? Functional isomorphism? Metaphorical utility?
      *   *Problem 3: The Conclusion.* "Same computation, same mind." This implies Functionalism or Computationalism. It skips the "Hard Problem" (Chalmers) or assumes it away.

  3.  **Drafting the Menu of Claims (Iterative Process):**

      *   *Attempt 1 (Too philosophical):* Strong AI, Weak AI, Functionalism, Physicalism.
      *   *Correction:* User said "no literature." Use their NWP language. Talk about models, discretization, substrate independence.
      *   *Attempt 2 (Better):*
          1.  Metaphor/Heuristic (Useful but not true).
          2.  Functional Equivalence (Input/Output mapping).
