  11. **Final Polish:** Ensure the distinction between "simulation" and "duplication" is clear. In NWP, a simulation of a hurricane doesn't get your roof wet. Is a simulation of a mind conscious? That's the question.

  **(Self-Correction on "Computer" Definition):** I need to be careful. In modern CS, a tide predictor is a "special-purpose computer" or "analog computer." But in the philosophical sense of "Computationalism," they usually mean digital symbol manipulation. I need to highlight this tension. If the brain is more like the tide predictor (continuous, coupled), then digital discretization (like NWP) might lose the "essence" required for consciousness.

  **(Self-Correction on "Is"):** "The atmosphere is a fluid." Actually, the atmosphere *is* a fluid in the physical sense (it obeys Navier-Stokes). But in NWP, the *model* is a discretized approximation. The friend's claim is more like "The atmosphere *is* the model." I need to clarify that distinction. The brain *is* physical stuff. Is it *also* a computer?

  Let's organize the "Menu" by strength of claim.
  1. Weak: It's a useful metaphor.
  2. Medium: It processes information.
