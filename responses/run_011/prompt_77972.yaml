answer: |-
  **Dissertation Prospectus**

  **Title:** The Stability of Eliminativism: A Tripartite Analysis of Functional, Semantic, and Normative Commitments in Folk Psychology

  **1. Introduction and Problem Statement**

  The debate over the ontological status of belief and desire has reached a state of dialectical stagnation. For the past four decades, the central question of the philosophy of mind—whether the propositional attitudes posited by folk psychology refer to genuine internal states—has oscillated between entrenched positions without significant convergence. On one side, eliminative materialists argue that folk psychology is a radically false theory, akin to alchemy or vitalism, and that its central posits will not survive the advancement of neuroscience. On the other, realists and instrumentalists maintain that belief-talk is either descriptive of causal mechanisms or indispensable as a predictive tool.

  The persistence of this disagreement suggests a structural flaw in the debate itself. My preliminary research indicates that the stalemate arises because the term "belief" is performing at least three distinct theoretical jobs within the dialectic, yet participants often argue as if there is only one target. Eliminativist arguments frequently target the causal efficacy of belief states (arguing neuroscience will bypass them), while realist defenses often retreat to the indispensability of content attribution for interpretation. Meanwhile, a third dimension—the normative status of the believer as an accountable agent—is often invoked to deflect self-refutation objections but rarely integrated into the ontological assessment.

  Consequently, the debate suffers from equivocation. An argument that successfully eliminates belief as a *causal mechanism* does not necessarily eliminate belief as a *semantic content-bearer*, nor does it eliminate belief as a *normative status*. Conversely, a defense of belief as a *normative commitment* does not automatically secure its status as a *neurobiological kind*. Because the positions are not standardized against these three dimensions, proponents talk past one another. Eliminativists claim victory by dismantling the causal story, while realists claim victory by securing the normative or semantic story.

  This project proposes that the debate cannot be resolved until we determine whether a *stable* eliminativism is possible. By "stable," I mean a position that consistently addresses all three dimensions without relying on hidden premises from the others. The current literature lacks a systematic mapping of how eliminativist arguments fare when forced to engage with all three dimensions simultaneously. This prospectus outlines a project to construct that map, determine the conditions under which eliminativism remains coherent, and assess whether the most viable "eliminativist" positions inevitably collapse into instrumentalism or normative realism.

  **2. The Research Question**

  The standard framing of this research area asks, "Is eliminativism about belief true?" This is too broad to be finishable within a dissertation timeframe because it invites an endless survey of empirical neuroscience and metaphysical speculation. Instead, this project focuses on the internal coherence of the philosophical positions themselves.

  **Primary Research Question:** *Under what conditions can an eliminativist stance on belief remain consistent across functional, semantic, and normative dimensions without collapsing into self-refutation or instrumentalism?*

  This question is determinate and finishable because it does not require me to settle the empirical fate of neuroscience. Rather, it requires a logical audit of the existing arguments. I am not asking whether the brain *actually* contains beliefs; I am asking whether the *argument* for their non-existence holds water when the concept of belief is disaggregated.

  This question breaks down into three sub-questions:
  1.  Do the standard empirical arguments against folk psychology (e.g., from learning theory or neuroscience) target the functional role of belief, its semantic content, or its normative status?
  2.  Can one consistently eliminate belief in one dimension (e.g., functional) while retaining it in another (e.g., normative), or does the elimination of one necessitate the elimination of the others?
  3.  Does the self-refutation objection (that one cannot argue against belief without employing belief) rely specifically on the normative dimension, and if so, can an eliminativist bypass it by rejecting that dimension?

  By answering these questions, I will move beyond the binary of "true vs. false" and toward a taxonomy of "stable vs. unstable" philosophical positions.

  **3. Theoretical Framework: The Tripartite Taxonomy**

  To conduct this audit, I will operationalize a tripartite taxonomy of "belief." This is not merely a conceptual analysis of the word, but a categorization of the theoretical work the concept is asked to do in the philosophy of mind literature.

  **(a) Belief as Functional/Causal State:**
  This dimension treats belief as an internal state individuated by its causal role in producing behavior. This is the primary target of classic eliminativism (e.g., Churchland). The claim here is that folk psychology posits a specific causal architecture (belief + desire → action) that fails to match the actual architecture of the brain (e.g., vector transformations, neural networks). If belief is eliminated here, it means there is no discrete internal state that maps onto the folk-psychological causal role.

  **(b) Belief as Semantic/Representational State:**
  This dimension treats belief as a state individuated by its truth conditions or accuracy conditions. This is the domain of content externalism, teleosemantics, and the indeterminacy arguments (e.g., Quine, Kripke). The worry here is not whether the state causes behavior, but whether it carries content at all. If belief is eliminated here, it means there are no states with genuine truth conditions; there is only causal covariance or syntactic manipulation.

  **(c) Belief as Normative Status:**
  This dimension treats belief as a status an agent occupies when they avow a proposition, assert it, or undertake a commitment. This is the domain of normative pragmatics (e.g., Brandom, though applicable to non-normativists who use accountability). Here, to have a belief is to be liable to criticism, to owe reasons, and to be held accountable for consistency. If belief is eliminated here, it means there is no practice of holding agents accountable for truth-claims.

  **The Gap in the Literature:**
  Current debates typically isolate these dimensions. Eliminativists focus heavily on (a), arguing that neuroscience will replace folk-causal roles. Realists often defend (b), arguing that content is real even if the mechanism is non-classical. Instrumentalists (e.g., Dennett) often sidestep (a) and (b) by focusing on the utility of the stance, which leans heavily on (c) without fully committing to the ontology of (a).

  The gap is that no one has systematically tested whether a "partial eliminativism" is viable. Can you be an eliminativist about (a) but a realist about (c)? Or does eliminating (a) undermine the possibility of (c)? My hypothesis is that the debate stalls because eliminativists think they have won by defeating (a), while realists think they have won by securing (c). A stable position must account for the dependencies between them.

  **4. Methodology and Argument Strategy**

  The core method of this dissertation will be a "Matrix Analysis" of the major arguments in the field. I will construct a matrix where the rows are the standard arguments for and against folk psychology, and the columns are the three dimensions (a, b, c). For each cell, I will determine whether the argument succeeds, fails, or is inapplicable.

  **Phase 1: Mapping the Arguments**
  I will catalog the primary arguments used in the debate.
  *   *For Eliminativism:* The stagnation of folk psychology (it doesn't explain mental illness/learning); the incommensurability with neuroscience; the indeterminacy of content.
  *   *For Realism/Instrumentalism:* The indispensability of intentional explanation; the self-refutation argument; the success of predictive modeling.

  I will then test each argument against the three dimensions. For example, the argument that "folk psychology is stagnant" primarily targets (a). It shows that folk-causal roles are poor predictors of neural activity. It does not, however, address (c). One could concede that folk psychology is a bad *causal* theory while maintaining that it is a necessary *normative* practice. By mapping this, I can show that the "stagnation" argument does not justify global eliminativism, only functional eliminativism.

  **Phase 2: Testing for Stability**
  Once the matrix is populated, I will test combinations of positions for consistency.
  *   *Scenario 1: Eliminate (a), Keep (b) and (c).* This looks like a non-reductive realism. Is it stable? Only if content can exist without the specific causal roles folk psychology posits.
  *   *Scenario 2: Eliminate (a) and (b), Keep (c).* This is a purely normative account. Is it stable? This is the critical test. If I eliminate the internal state and the content, what is the "status" attached to? If there is no state and no content, is "accountability" just a fiction? If it's a fiction, haven't we eliminated (c) as well?
  *   *Scenario 3: Eliminate (a), (b), and (c).* This is global eliminativism. I will analyze the self-refutation objection here. The objection states: "You cannot argue against belief without believing your premises." I will argue this objection specifically targets (c). To argue is to undertake a commitment. If the eliminativist rejects (c), they must claim they are not undertaking commitments but merely emitting noises caused by neural states. I will assess whether this move is philosophically livable or whether it renders the position unintelligible.

  **Phase 3: The Cost-Benefit Analysis**
  Finally, I will evaluate what the eliminativist gains and loses by trying to stabilize their position. If they target all three, they avoid equivocation, but they face the self-refutation charge head-on. If they retreat to eliminating only (a), they avoid self-refutation but concede too much to the realist (saving the "belief" that matters for accountability). I will argue that a *stable* eliminativism is much harder to formulate than the literature suggests, and that many self-proclaimed eliminativists are actually covert instrumentalists who rely on (c) while denying (a).

  **5. Justification of Method vs. Alternatives**

  It is necessary to explain why this conceptual mapping is preferable to the two obvious alternative approaches: pure conceptual analysis or waiting for empirical resolution.

  **Vs. Pure Conceptual Analysis:**
  A traditional approach might simply analyze the concept of "belief" to see if it entails existence. This is insufficient because the concept of belief is plastic and context-dependent. As the reading group experience demonstrated, philosophers use "belief" to mean different things in different contexts. A static analysis would miss the dynamic way the term is used to block or advance arguments. My matrix method respects this plasticity by treating the dimensions as functional roles in the debate rather than essential definitions. It allows me to say, "In this argument, 'belief' is functioning as (a)," without committing to a single definition of belief for the whole dissertation.

  **Vs. Waiting for Neuroscience:**
  One might argue that this is a premature armchair exercise and that we should wait for cognitive science to tell us if beliefs exist. This is a category mistake. Neuroscience can tell us about causal mechanisms (dimension a), but it cannot settle the normative (dimension c) or semantic (dimension b) questions on its own. Whether a neural state *counts* as a belief depends on our philosophical criteria for content and accountability. Furthermore, the "wait for science" approach assumes the question is purely empirical. My project demonstrates that the question is partly about the *stability of the arguments* we use to interpret that science. If the eliminativist argument is logically unstable regardless of the neural data, then waiting for the data is irrelevant. We need to clear the conceptual underbrush before the empirical data can be properly interpreted.

  **Vs. Dennett-Bashing:**
  I am aware that my advisor and much of the department are sympathetic to instrumentalism. It is crucial that this project does not devolve into a refutation of instrumentalism (e.g., Dennett). In fact, instrumentalism may emerge from this project as the *most* stable position. My method treats instrumentalism as a viable coordinate in the matrix (likely retaining (c) while downplaying (a) and (b)). The goal is not to prove instrumentalism wrong, but to show that it is a distinct, stable alternative to both realism and eliminativism, and that many participants in the debate are confused about which position they actually hold. This aligns with the department's strengths while still allowing for a critical assessment of eliminativism.

  **6. Expected Outcomes and Commitments**

  A successful result for this dissertation will look like a refined map of the logical space of folk psychology debates. Specifically, I aim to produce the following conclusions:

  1.  **The Fragmentation Thesis:** I expect to demonstrate that the "eliminativism vs. realism" debate is actually a cluster of smaller debates regarding (a), (b), and (c). Recognizing this fragmentation explains the stagnation.
  2.  **The Instability of Partial Eliminativism:** I aim to show that eliminating (a) without eliminating (c) leaves the position vulnerable to the charge that it is merely verbal. If you keep the normative status, you haven't really eliminated the phenomenon that matters to human life.
  3.  **The Resilience of the Normative:** I suspect the analysis will show that dimension (c) is the hardest to eliminate. Even hardline materialists rely on normative practices of argumentation. This suggests that a "global" eliminativism is pragmatically impossible, even if it is metaphysically coherent.
  4.  **A Defense of Instrumentalism (or Normative Realism):** Depending on the outcome of the matrix, I may be committed to the view that instrumentalism is the only stable position that acknowledges the failure of (a) without succumbing to the self-refutation of eliminating (c). Alternatively, I may argue for a normative realism where beliefs are real *as* statuses, regardless of their neural implementation.

  **Commitments:**
  By undertaking this project, I am committed to the view that philosophical progress here comes from clarifying argumentative structures rather than generating new empirical predictions. I am also committed to treating "belief" as a multifunctional term, which precludes me from defending a naive realism that posits belief as a simple, unitary brain state.

  **7. Failure Conditions and Risk Assessment**

  It is vital to be honest about where this project could fail. The primary risk is not that I will fail to write the words, but that the central theoretical distinction will collapse under scrutiny.

  **The Primary Risk: The Inseparability Hypothesis**
  My entire taxonomy rests on the assumption that (a), (b), and (c) can be teased apart. The major failure condition is if, upon close inspection, it turns out that these three dimensions are inextricably linked. For example, if it turns out that you cannot have normative status (c) without causal efficacy (a), or that content (b) just *is* a certain kind of causal role (a), then the matrix becomes decorative. If the three jobs are actually one job, then the "talk past each other" diagnosis is false, and the debate is stagnant for other reasons (perhaps purely ideological or empirical).
  *Mitigation:* I will address this in the first chapter by testing the separability of the dimensions. If they prove inseparable, I will pivot the dissertation to argue *for* their inseparability and show how that forces a different resolution (likely a robust realism or a global eliminativism with no middle ground).

  **The Secondary Risk: The Semantic Quagmire (Dimension b)**
  Dimension (b) involves teleosemantics and theories of content. This is a notorious sinkhole. If I attempt to solve the problem of content to settle dimension (b), the project will balloon uncontrollably.
  *Mitigation:* I will explicitly bracket the "hard problem" of content. I will not attempt to solve how content is naturalized. I will only assess whether eliminativist arguments *presuppose* a solution to naturalization. I will treat theories of content as inputs to the matrix, not as objects of investigation themselves. This keeps the scope manageable.

  **The Tertiary Risk: Advisor Friction**
  As noted, my advisor is friendly to instrumentalism. If I frame the project as "Proving Eliminativism Wrong," it may seem tendentious.
  *Mitigation:* I will frame the project as "Mapping the Conditions of Stability." This is neutral. It allows instrumentalism to win if it proves to be the most stable position. The deliverable is a clarification of the dialectic, not a victory for one tribe.

  **8. Timeline and Work Plan**

  The following timeline outlines the next four months of work, targeting a 9,000-word first draft (representing the first two substantive chapters of the dissertation). This phase focuses on establishing the Taxonomy and the Matrix Method.

  **Month 1: Taxonomy and Literature Audit**
  *   **Weeks 1-2:** Finalize the definitions of (a), (b), and (c). Write the 3,000-word explication of the taxonomy. Ensure the distinction between "Normative Status" and "Instrumental Utility" is sharp, as this is crucial for the advisor's interests.
  *   **Weeks 3-4:** Audit the literature. Create the preliminary Matrix. Categorize the top 5 eliminativist arguments and top 5 realist arguments into the cells.
  *   *Deliverable:* A 2,000-word "Taxonomy Memo" and a completed Matrix diagram.
  *   *Risk:* Getting bogged down in defining (b). *Constraint:* Do not read new teleosemantics literature unless it directly impacts the matrix cell. Stick to how the arguments *use* content, not how content works.

  **Month 2: Drafting the Functional and Normative Arguments (a & c)**
  *   **Weeks 1-2:** Draft the section on Functional Eliminativism (a). Analyze the "stagnation" and "neuroscience" arguments. Show why they fail to touch (c).
  *   **Weeks 3-4:** Draft the section on Normative Status (c). Analyze the self-refutation objection. Argue that this is the pivot point of the debate.
  *   *Deliverable:* 4,500 words of draft text.
  *   *Risk:* Drifting into general philosophy of action. *Constraint:* Keep the focus strictly on how these arguments affect the *stability* of the eliminativist position.

  **Month 3: Drafting the Semantic Arguments (b) and Synthesis**
  *   **Weeks 1-2:** Draft the section on Semantic Indeterminacy (b). This is the danger zone. I will limit this to analyzing whether indeterminacy arguments succeed in eliminating content *given* the functional and normative constraints established in Month 2.
  *   **Weeks 3-4:** Synthesis. Combine the three sections. Run the "Stability Test." Does eliminating (a) force the elimination of (c)? Write the conclusion of the draft.
  *   *Deliverable:* 4,500 words of draft text (Total 9,000).
  *   *Risk:* The Semantic section expands to 5,000 words. *Constraint:* If the word count threatens to balloon, cut the historical overview of teleosemantics and focus only on the logical dependency between (b) and (c).

  **Month 4: Revision and Advisor Review**
  *   **Weeks 1-2:** Self-revision. Check for tone. Ensure instrumentalism is treated fairly. Check that the "Failure Condition" (Inseparability) is adequately addressed in the text.
  *   **Weeks 3-4:** Submit to advisor. Incorporate feedback. Prepare for the prospectus defense.
  *   *Deliverable:* Final 9,000-word draft and revised prospectus document.

  **Contingency Plan:**
  If Month 2 reveals that the Functional/Normative split is untenable (i.e., you can't separate causal role from accountability), I will pivot Month 3 to focus on that inseparability. The dissertation would then argue that the "Tripartite" view is a heuristic that ultimately collapses, forcing a choice between Global Realism and Global Eliminativism. This saves the project from the "decorative taxonomy" failure condition by making the collapse of the taxonomy the *result* rather than the failure.

  **9. Conclusion**

  This project offers a way out of the stagnation in the folk psychology debate not by providing a new empirical answer, but by diagnosing the structural equivocation that prevents the current answers from landing. By disaggregating the functional, semantic, and normative dimensions of belief, I will show that the debate is not a single battlefront but a three-way intersection. The dissertation will demonstrate that a stable eliminativism is far more costly than its proponents admit, likely requiring the abandonment of the normative practices that make argumentation possible. In doing so, it clarifies the true stakes of the discussion: not just what is in the head, but what we are doing when we hold each other accountable for what is in the head.

