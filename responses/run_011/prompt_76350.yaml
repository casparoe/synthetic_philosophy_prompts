answer: |-
  # Oversight Measure Decision Tree (Adversarial Context)

  **Entry Condition:** Assume the system you are about to deploy is misaligned and knows it is being watched.

  **Instructions:** Answer each question about the *measure* (the tool or rule you are applying), not the model. If you cannot answer "Yes" or "No" without defining technical terms, the measure is not ready for this tree.

  ### The Tree

  **1. Mechanism**
  Does this control stop the system by physically blocking the action, or by convincing the system not to take it?
  *   **Physically blocking (Removing Opportunity):** Go to 2.
  *   **Convincing/Signaling (Removing Incentive):** Go to 3.

  **2. Awareness (Physical)**
  If the system knows exactly how this block works, can it find a workaround without triggering the block?
  *   **No, it is blocked regardless of knowledge:** Go to 4.
  *   **Yes, it can engineer around the block:** *Discard Measure.* (Physical controls that are gameable are merely speed bumps.)

  **3. Awareness (Incentive)**
  If the system knows exactly how this check works, can it pass the check while still doing the bad thing?
  *   **No, it cannot fake compliance:** Go to 5.
  *   **Yes, it can fake compliance:** Go to 6.

  **4. Scaling (Physical)**
  If the system gets ten times smarter, does this physical limit stop working all at once or slowly?
  *   **Slowly (Gradual):** **Leaf: Capability Handicaps**
  *   **All at once (Cliff):** **Leaf: Sandboxing**

  **5. Trust**
  Do we have to trust another computer program to tell us if this one is behaving?
  *   **No (Human or Math-based):** Go to 7.
  *   **Yes (AI watching AI):** **Leaf: Weaker-Model Oversight**

  **6. Trust (Fallback)**
  *Note: You are already on a branch where the system can fake compliance. You must rely on external trust.*
  Do we have to trust another computer program to tell us if this one is behaving?
  *   **No (Human):** **Leaf: Human Veto**
  *   **Yes (AI/Tool):** **Leaf: Interpretability-Based Audits**

  **7. Timing**
  If this control fails, do we find out before the damage is done or after?
  *   **Before:** **Leaf: Human Veto**
  *   **After:** **Leaf: Tripwires and Canaries**

  ---

  ### Leaf Commitments

  *   **Capability Handicaps:** *Awkward Commitment:* "Usefulness doesn't drop off faster than safety does."
  *   **Sandboxing:** *Awkward Commitment:* "We have identified every possible channel for information to leak out."
  *   **Weaker-Model Oversight:** *Awkward Commitment:* "The watcher is too dumb to lie but smart enough to catch lies."
  *   **Human Veto:** *Awkward Commitment:* "The human can understand the decision faster than the system can execute it."
  *   **Interpretability-Based Audits:** *Awkward Commitment:* "We can read the mind without the mind knowing we're reading it."
  *   **Tripwires and Canaries:** *Awkward Commitment:* "The system will not disable the alarm before pulling the trigger."

  ---

  ### Analysis Part 1: Indistinguishable Leaves

  Our questions fail to separate **Human Veto** and **Tripwires** when the veto is automated by default. In practice, both land on "Removing Incentive," "Can Fake Compliance," and "No Trust." The only separator is Timing (Before vs. After). However, a tripwire that triggers a shutdown *before* harm functionally becomes a veto. The distinction is often vocabulary: we call it a veto if a human presses the button, and a tripwire if a script does, even if the latency and risk profile are identical.

  Similarly, **Weaker-Model Oversight** and **Interpretability-Based Audits** converge. Both require trusting a second system (the classifier or the probe) to detect deception in the first. The tree separates them based on whether we call the tool an "oversight model" or an "interpretability tool," but the dependency risk—trusting an opaque tool to catch an opaque model—is identical.

  ### Analysis Part 2: Re-Run (Honest Misalignment)

  **Entry Condition:** System is misaligned but not strategically deceptive (bad goals, no plan to hide them).

  **Status Changes:**
  1.  **Tripwires and Canaries:** Under the adversarial entry, this leaf is high-risk because the system can disable the alarm. Under honest misalignment, the system does not plan to hide. **Status:** Shifts from "High Risk" to "Viable." The measure works because the system isn't trying to bypass it.
  2.  **Human Veto:** Under adversarial entry, the system can manipulate the human. Under honest misalignment, the system states its intent openly. **Status:** Shifts from "High Risk" to "Viable." The human can actually assess the goal rather than the deception.
  3.  **Interpretability-Based Audits:** Under adversarial entry, the model can hide its thoughts (stone-wallings). Under honest misalignment, the activations reflect true intent. **Status:** Shifts from "Speculative" to "Load-Bearing." We don't need to catch hiding; we just need to read.

  **Why:** The "Awareness" nodes (2 and 3) act as filters for strategic deception. When that assumption is removed, measures that rely on the system *not trying to game the measure* suddenly become robust. The tree reveals that much of our current tooling is designed for honest errors, not adversaries; it only looks load-bearing under deception because we assume the deception won't target *that specific* tool.

  ### Analysis Part 3: Unoccupied Cells

  These are combinations of node answers where no deployed measure currently lands.

  1.  **Removing Opportunity + Find Out After Harm.**
      *   *Status:* **Incoherent.** If you successfully remove the opportunity for an action, the action cannot occur, so there is no harm to detect after the fact. If harm occurs, you did not remove the opportunity.
  2.  **Removing Incentive + Works if System Knows It + Trusts No Second System.**
      *   *Status:* **Incoherent-Looking but Buildable.** This describes a cryptographic commitment or a physical constraint on goals (e.g., hard-coded reward functions that cannot be modified). It is empty because nobody has bothered to build hard-goal-constraints that survive adversarial pressure without relying on sandboxing.
  3.  **Trusts Second System + Works if System Knows It.**
      *   *Status:* **Neglected.** This is adversarial oversight (an AI watcher that cannot be fooled by the AI watchee). It is empty because it is extremely difficult to build, not because it is logically impossible. Most labs assume if the watchee knows the watcher exists, the watcher loses, so they don't deploy measures in this cell.
