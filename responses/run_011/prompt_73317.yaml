answer: |-
  # Which account of disease do you actually hold?

  ## 1. Logical Space

  To understand where your judgments sit, consider four independent axes. You can hold a position high on one axis and low on another without contradiction. Each axis is defined by two poles.

  **Axis 1: Location of Trouble**
  *   **Pole A:** The trouble originates in the organism's internal structure.
  *   **Pole B:** The trouble originates in the community's reaction.

  **Axis 2: Role of Feeling**
  *   **Pole A:** Unpleasant experience is required for the label to apply.
  *   **Pole B:** Unpleasant experience is irrelevant to the label.

  **Axis 3: Reference Group**
  *   **Pole A:** The standard is fixed by biological kind (species or sex).
  *   **Pole B:** The standard is fixed by environmental context (era or surroundings).

  **Axis 4: Scope of Application**
  *   **Pole A:** The label applies equally to plants, animals, and humans.
  *   **Pole B:** The label applies only to humans.

  ## 2. Populated Space

  The following names describe coherent combinations of positions on the axes above. Empty combinations are diagnosed below.

  *   **Biological Realism:** (1A, 2B, 3A, 4A) The label tracks internal breakdown regardless of feeling, measured against species design, across all life.
  *   **Human Exceptionalism:** (1A, 2B, 3A, 4B) The label tracks internal breakdown regardless of feeling, measured against species design, but only for people.
  *   **Phenomenological Account:** (1A, 2A, 3A, 4B) The label requires internal breakdown plus suffering, measured against species design, only for people.
  *   **Environmental Functionalism:** (1A, 2B, 3B, 4A) The label tracks internal breakdown regardless of feeling, measured against local demands, across all life.
  *   **Social Agreement View:** (1B, 2B, 3B, 4B) The label tracks community rules regardless of feeling, measured against local priorities, only for people.
  *   **Experiential Social View:** (1B, 2A, 3B, 4B) The label tracks community rules plus suffering, measured against local priorities, only for people.

  **Empty Combinations:**
  *   **1B + 4A:** Incoherent. If the trouble is in the community's reaction, it cannot apply to plants that have no communities.
  *   **1B + 3A:** Incoherent. If the trouble is in the community's reaction, the standard cannot be fixed by biological kind.
  *   **2A + 2B:** Contradictory. A condition cannot both require and ignore unpleasant experience.
  *   **3A + 3B:** Contradictory. The standard cannot be both fixed by biology and fixed by context.

  ## 3. The Instrument

  Answer the following ten questions. Choose the option that best matches your judgment. There are no right or wrong answers.

  **1. A condition once classified as a medical trouble was dropped from the list when society's priorities shifted, though the biology remained unchanged.**
  *   A. The original classification was a mistake about the body.
  *   B. The original classification was a mistake about the society.
  *   C. The biology changed subtly along with the society.

  **2. A physical trait is present in ninety percent of people over age eighty in a specific population.**
  *   A. It remains a trouble because the species design does not include it.
  *   B. It ceases to be a trouble because it is typical for that group.
  *   C. It remains a trouble only if it causes unpleasant experience.

  **3. An inherited variant causes physical differences but protected ancestors from a lethal infection and causes no impairment now.**
  *   A. It is a trouble because it deviates from the species design.
  *   B. It is not a trouble because it fits the environmental demands.
  *   C. It is not a trouble because the carrier feels fine.

  **4. A physical difference limits a person only because buildings lack ramps or screens lack captions.**
  *   A. It is a trouble inherent to the person regardless of buildings.
  *   B. It is a trouble only because the surroundings are built poorly.
  *   C. It is a trouble only if the person feels limited by it.

  **5. A condition measurably shortens life and narrows activity, yet the person prizes it and refuses treatment.**
  *   A. It remains a trouble regardless of the person's wish.
  *   B. It ceases to be a trouble because the person rejects the label.
  *   C. It remains a trouble but should not be treated against their will.

  **6. A family qualifies for paid leave only if a doctor applies a specific medical label to a child's behavior.**
  *   A. The label is correct if the biology matches the criteria.
  *   B. The label is incorrect because it is driven by benefit rules.
  *   C. The label is correct because the benefit supports the family's health.

  **7. The same physical breakdown occurs in a grapevine, a dairy cow, and a human.**
  *   A. The label applies equally to all three.
  *   B. The label applies only to the human.
  *   C. The label applies to the cow and human, but not the plant.

  **8. Intense sorrow follows a spouse's death, and doctors withhold the medical label for the first two months.**
  *   A. The trouble exists immediately but is ignored to avoid harm.
  *   B. The trouble does not exist until the time limit passes.
  *   C. The trouble depends on whether the sorrow feels out of control.

  **9. Two communities disagree on whether a specific behavior counts as a medical trouble.**
  *   A. One community is wrong about the facts.
  *   B. Both communities are right within their own rules.
  *   C. One community is wrong about the priorities.

  **10. A biomarker indicates high risk for future harm, but the person feels no different today.**
  *   A. The trouble exists now based on the measurement.
  *   B. The trouble exists only if symptoms appear later.
  *   C. The trouble exists only if the person worries about it.

  ## 4. Scoring Key

  **Facilitator Instructions:** Do not share this key with participants. Tally responses to identify the primary position. Look for internal tensions.

  **Axis Mapping:**
  *   **Axis 1 (Location):** Q1 (A=Internal, B=Community), Q4 (A=Internal, B=Surroundings), Q9 (A=Internal, B=Community).
  *   **Axis 2 (Feeling):** Q2 (C=Required), Q3 (C=Required), Q5 (B=Required), Q8 (C=Required), Q10 (C=Required).
  *   **Axis 3 (Reference):** Q2 (A=Species, B=Group), Q3 (A=Species, B=Environment), Q4 (A=Internal, B=Surroundings).
  *   **Axis 4 (Scope):** Q7 (A=Universal, B=Human).

  **Primary Positions:**
  *   **Mostly A on Q1, Q4, Q9:** Biological Realism or Human Exceptionalism.
  *   **Mostly B on Q1, Q4, Q9:** Social Agreement View.
  *   **Mostly C on Q2, Q3, Q5, Q8, Q10:** Phenomenological Account.
  *   **A on Q7:** Biological Realism or Environmental Functionalism.
  *   **B on Q7:** Human Exceptionalism or Social Agreement View.

  **Identifying Instability:**
  Do not average conflicting answers. Identify the specific tension.

  *   **Tension 1 (Q1-A and Q4-B):** You claim the trouble is internal (Q1) but also that it depends on surroundings (Q4).
      *   *Why:* Internal structure cannot depend on external ramps for its definition.
      *   *Resolution:* Does the body fail on its own, or only when meeting the world?
  *   **Tension 2 (Q5-A and Q8-C):** You claim the label persists without consent (Q5) but depends on feeling out of control (Q8).
      *   *Why:* One answer ignores experience, the other requires it.
      *   *Resolution:* Is suffering required for the label, or just for treatment?
  *   **Tension 3 (Q3-A and Q3-B):** You cannot select both. If you feel pulled both ways, you are weighing species design against environmental fit.
      *   *Why:* The standard cannot be both fixed and flexible.
      *   *Resolution:* Which standard overrides the other when they conflict?
  *   **Tension 4 (Q7-A and Q9-B):** You claim the label applies to plants (Q7) but also that communities decide truth (Q9).
      *   *Why:* Plants do not have communities to decide rules.
      *   *Resolution:* Can a label be universal if its rules are local?

  ## 5. Limits

  This instrument cannot separate the following pairs of positions, regardless of phrasing.

  *   **Biological Realism vs. Environmental Functionalism:** Both yield identical verdicts on human cases where species design and environmental demands align. The disagreement is metaphysical (what fixes the standard), not extensional (what gets labeled).
  *   **Human Exceptionalism vs. Social Agreement View:** Both restrict the label to humans. The disagreement lies in whether the restriction is due to lack of community (plants) or lack of moral status (animals), which case verdicts alone cannot reveal.
  *   **Phenomenological Account vs. Experiential Social View:** Both require suffering. The disagreement lies in whether the suffering must stem from internal breakdown or community exclusion, which is often indistinguishable in the person's reported experience.
  *   **Realism vs. Error Theory:** A respondent who believes all medical labels are mistakes will answer like a Realist who believes none of these specific cases meet the criteria. The instrument measures commitment to criteria, not belief in the system's success.
