      *   *Case 3 (Boring Tool + Reviewer Bias):* Reviewer wants to hold it but can't say why. *Outcome:* Procedure forces articulation. If it's just "gut feeling," it might pass, but the bias check flags the reviewer's hesitation as a potential risk signal *or* personal blockage. Let's make the procedure catch the reviewer's bias here.

  5.  **Addressing Limitations & Culture:**

