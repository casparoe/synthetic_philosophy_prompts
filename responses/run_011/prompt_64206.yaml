answer: |-
  **Brainstorming Considerations**
  The core tension lies between historical fidelity and public engagement. We owe the audience honesty about what they are seeing, but we also owe the subject (and his descendants) a representation that doesn't trivialize their legacy. The bequest's "accuracy" clause conflicts with the filmmaker's need for dramatic legibility. The tier-label system risks paralysis by analysis—if everything is "inferred," nothing is trusted, and audiences may disengage. We need a solution that preserves the film's reach (filmmaker's point) while correcting the narrative displacement (granddaughter's point) without imposing unworkable administrative burdens (staff/board reality) in an 11-day window.

  ***

  **MEMORANDUM**

  **TO:** Board of Directors, County Historical Society
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Vance Docudrama Screening and Bequest Compliance

  **Bottom Line Up Front**
  I recommend we proceed with the screening as scheduled but condition the release of the remaining grant funds on the addition of specific contextual materials. We should reject the proposed tier-label policy for this instance as operationally unworkable, opting instead for a curated program note and a post-screening discussion. This approach satisfies the bequest's requirement for "respect," addresses the granddaughter's concern regarding "explanatory displacement," and preserves the filmmaker's audience reach without endorsing historical distortion.

  **Interpreting the Bequest**
  The 1960s bequest mandates films treat local history "accurately and with respect for the people in it." This language was drafted before the modern docudrama format became standard, so we must interpret it rather than apply it literally. "Accuracy" in drama does not require documentary rigidity in every frame, but it does require that core motivations align with the evidentiary record unless there is no other way to tell the story. "Respect" is the stronger constraint here. Substituting a documented act of communal protection (shielding families in the ledger) with a secret sexual affair trivializes Vance's moral agency. It transforms a public-spirited risk into a private panic. Even if labeled as dramatization, this swap violates the spirit of "respect" because it fundamentally alters why we should admire him. We cannot claim the bequest allows us to fund a narrative that evicts the most dignified truth available.

  **Obligations to the Dead, the Living, and the Audience**
  We must distinguish what we owe Vance, his granddaughter, and our patrons. Regarding Vance himself: strictly speaking, the dead have no interests. He cannot be harmed. However, we owe his *memory* integrity because history is a communal asset, not private property. When a historical figure serves as a touchstone for a community's understanding of justice, distorting their legacy damages the living community's grasp of its own past.

  This connects directly to the granddaughter. Her objection is not merely personal; it is historiographical. Her concept of "explanatory displacement" identifies a real harm: the invented scene doesn't just add fiction; it makes the documented truth harder to recover. If we screen the film without correction, we become complicit in that displacement. We owe the audience transparency, not necessarily about every costume choice, but about the causal mechanics of the history they are consuming. If they leave believing Vance was motivated by fear of exposure rather than protection of others, we have failed our educational mission.

  **The Tier-Label Proposal**
  The proposed policy requiring on-screen labels ("attested," "inferred," "invented") is theoretically sound but practically flawed. The board member's objection that "everything is inferred" is correct. In historical narrative, nearly every dialogue reconstruction and motive attribution is inferred. If we label every inference, the screen becomes cluttered, and audiences will tune out. If we label only the biggest inventions, we create a false binary where unlabeled scenes are assumed to be proven fact, which is often untrue. Adopting this system now, eleven days out, would force us to categorize hundreds of claims without a established methodology, inviting confusion rather than clarity. We should reject this mechanism for the current film. It is a tool for archive metadata, not film exhibition.

  **The Filmmaker's Defense**
  The filmmaker argues that the affair thread makes the sequence legible and that our squeamishness is aesthetic preference wearing an ethical costume. He is partly right: dry history often fails to find an audience. Reach matters. If no one sees the film, Vance remains absent from public memory, which the granddaughter identifies as the worst outcome. However, reach built on a trivializing lie undermines the historical value of that attention. We can acknowledge the dramatic necessity of tension without accepting the specific invention of an affair. The film can stand, but it cannot stand alone.

  **Recommendation and Conditions**
  We should screen the film unchanged to honor the contractual commitment and preserve the dramatic flow, but we must mitigate the explanatory displacement. I propose the following conditions for the release of the final grant tranche:

  1.  **Program Note:** A printed insert or projected slide before the film must explicitly state that while the film dramatizes certain events, Vance's documented reason for declining to testify was to protect families in his ledger, not personal scandal. This corrects the record without altering the cut.
  2.  **Post-Screening Discussion:** We will host a Q&A featuring the granddaughter and a local historian to discuss the difference between the film's narrative and the archival record. This turns the screening into an educational event about how history is constructed.
  3.  **Policy Deferral:** We will table the tier-label policy for further study by a subcommittee, acknowledging its value but recognizing its current impracticality for exhibition.

  This path honors the bequest's demand for respect, validates the granddaughter's historiographical concern, and keeps the film in front of an audience. It admits that while we cannot change the art, we can change the context in which it is received.
