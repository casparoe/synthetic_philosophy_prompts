prompt: |-
  I'm prepping for quals with a professor who drills me on testimony cases, and I've started writing her verdicts down, but I can't reverse-engineer the rule. So far:

  - Lost in an airport, I ask a woman wearing a volunteer greeter vest which platform the train leaves from. Justified.
  - Same airport, a guy with a suitcase says my gate changed, and mentions he just walked over from there and heard it on the PA. Justified.
  - A coworker I've known eight years, who just came down from the third floor, says the printer's jammed. Justified.
  - That same coworker tells me the CEO is about to be indicted, which she heard from her cousin's friend. Not justified.
  - My six-year-old niece says there's a raccoon in the backyard. I know kids confabulate, but she's looking right at it and has nothing to gain. Justified.
  - An unsigned email to the whole department from the HR address says the building's closed Friday. Nothing corroborates it, nothing contradicts it. Justified — she said "you could have replied and made them own it."
  - A throwaway account emails me specifics about a grant fraud nobody else is reporting, and nothing contradicts them. Not justified.
  - A used-car dealer with a spotless reputation tells me the timing belt was replaced, but I'd already decided to buy the car before he said it. Not justified, and her line was "you weren't believing it on his word."

  Tomorrow's case, which I copied down right after she gave it: a hiker coming down the trail tells me the footbridge a mile up is washed out and the creek's too high to ford, so the loop is impossible. She's muddy to the knees and obviously just came from there, she doesn't know me and has nothing to gain, and she's standing right in front of me, so I could push back and she'd have to answer for it. Two complications. Ten minutes earlier she told me the lot closes at six and a ranger corrected her within earshot — an innocent mistake, totally unrelated. And the stakes aren't nothing: I drove four hours for my one free day, so if she's wrong I've lost it, but if she's right and I go anyway I could get stranded. There's no way to check short of hiking the mile myself.

  Predict her verdict and say how confident you are. Then tell me which rule she's actually running — I know the labels I'm supposed to reach for here, reductionist and anti-reductionist, but I don't think she's cleanly either one, becuase the HR email and the car dealer seem to be turning on something else entirely. List the other rules that fit all eight verdicts just as well as yours does, and note where each of them lands on the trailhead case, since I suspect they don't all land the same place. Finally, name the one further case that would best tell my top two candidates apart, and explain what she'd have to say about it for each to survive.
