prompt: |-
  ok so I've been going down a rabbit hole on the socialist calculation debate for a reading group I run, and half the people there are software engineers who think the whole thing was settled in 1990 and the other half think it was settled in 1936, and I want something that'll make the actual disagreement concrete without me giving a lecture. Here's what I want you to write:

  A blameless postmortem — the standard SRE incident-review format, like something that lives on an internal wiki — from the platform team that operates a national economy running on Lange-style market socialism. So: incident title and severity level, a one-paragraph summary, impact (invent plausible metrics), a timestamped timeline, root cause analysis, contributing factors, a "what went well / what went badly / where we got lucky" section, and an action items table with owners and due dates. Around 900 to 1100 words. No sources or reading list at the end, just the document.

  The setup you're writing inside: the Central Planning Board runs the price system as a service. Consumer goods prices and labor float. But capital goods and intermediate inputs have no market, so their prices are set administratively and revised by trial and error — the board raises a price where there's excess demand, cuts it where there's a surplus, and repeats until things clear. Enterprise managers are handed two standing rules: pick your input mix to minimize average cost at the prices you've been given, and set output where price equals marginal cost. Then one revision cycle doesn't converge, the plan quarter goes out underneath everyone, and you get the incident.

  The important part: the humor has to come from getting the economics right, not from being cute about communism or about bureaucrats being dumb. Every engineering complaint in the doc should be a real objection from the Mises/Hayek side, translated into ops vocabulary. Nobody in the document ever says "calculation problem" or "knowledge problem," nobody names an economist, nobody explains any theory, and there's no wink at the reader. A person who knows the debate should be able to point at a specific line and say "ah, that's the point about the shadow prices for capital goods never having tracked anything." A person who doesn't should still enjoy it purely as an artifact about a catastrophic on-call rotation.

  Things I'd love to see worked in, all rendered in incident-report register rather than argued:

  - the price-revision cycle has quietly grown longer than the production plan it's supposed to be steering, and there's a chart nobody wants to look at showing the drift over successive cycles
  - an on-call engineer discovers, three pages deep in a subsystem, that the inputs needed to set one intermediate price live in the heads of a few hundred people at plant level and in none of the databases, and files a ticket that gets closed as "working as intended"
  - a chronic duplicate-and-phantom-demand alert that's been muted for years because it fires constantly and the goods in question were never actually wanted by the units supposedly requesting them
  - the fact that no manager has ever been disciplined for violating either of the two rules, and a section in "contributing factors" that dances around why that's structurally unavoidable rather than a personnel problem
  - a proposed remediation — basically "let the plants negotiate prices with each other directly and let those settle" — that gets rejected in review, with the rejection phrased as a governance and mission-fit concern rather than as an argument
  - a "where we got lucky" bullet that is quietly the most terrifying line in the document

  Deadpan the whole way through, flat corporate tone, no punchline paragraph, no author's-note coda. Please write it in American English.
