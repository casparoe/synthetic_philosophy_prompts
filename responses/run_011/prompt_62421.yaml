      *   **User's Hypothesis:** The film supports Elegiac Pronatalism, not Additive. Additive is imported by the audience. The silence at the baby's cry privileges the particular over the aggregate. The refugee crisis complicates the "more people is better" view.
      *   **Specific Challenges:** Address the anti-natalist foil (world is grim, maybe no birth is better?). Address the resource scarcity/migration issue (quality vs. quantity).
