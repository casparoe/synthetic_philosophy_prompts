  3. The model's provided measure and observer counts must yield a conditional probability of being an Ordinary Observer that strictly exceeds being a Boltzmann Brain.
  This is the cognitive stability requirement that prevents the model from undermining the empirical reasoning used to derive it, and it does most of the work ruling models out.
  Verdict: Non-negotiable for scientific validity, but collides with Item 5 if equilibrium thermodynamics inevitably predicts BB domination in the late universe.

  4. The model must provide a physical mechanism for terminating the future temporal domain rather than assuming finiteness solely to avoid fluctuation problems.
  This addresses the charge that finite-lifetime models (scenario c) are ad hoc fine-tuning purchases rather than physical predictions.
  Verdict: Camp preference (eternalists vs. finitists), and collides with Item 5 if terminating the future contradicts the physical expectation of an eternal vacuum state.

  5. The model must justify applying equilibrium statistical mechanics to the late-time gravitational vacuum or explicitly derive why it fails.
  This confronts the skeptic who argues BBs are artifacts of misapplying thermodynamics to a system with no external heat bath.
