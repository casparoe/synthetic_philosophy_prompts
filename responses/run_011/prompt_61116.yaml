  **Concession:** This metaphor breaks down when trying to specify the threshold where high cost becomes clinical pathology rather than mere stress.

  4. **Objection:** "From an engineering standpoint, if this is just variational Bayes, what computational advantage do we gain by adopting the FEP vocabulary over standard control theory?"
  **Reply:** The advantage is conceptual unification, allowing us to treat perception, action, and learning as consequences of a single objective function rather than separate modules. This reduces the risk of architectural mismatches when modeling biological agents.
  **Concession:** I have to admit that for building artificial systems, standard control theory often provides more direct optimization tools.

  5. **Objection:** "Doesn't evolutionary selection already explain why systems persist, making this variational account a redundant description of the same phenomenon?"
