  2. **[THE QUESTION I'M PRAYING NOBODY ASKS]** **Objection:** "If multiple distinct factorizations yield equivalent predictive accuracy, is there any fact of the matter about which blanket is the real agent, or is agency entirely relative to the modeler?"
  **Reply:** On this view, agency is indeed relative to the modeler's resolution, meaning there is no single 'real' blanket independent of the descriptive scale. We select the blanket that offers the most compressed explanation of the data without overfitting the noise.
