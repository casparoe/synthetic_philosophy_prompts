      *   To make "Outcome is risky" hit home: The "System" player needs a deck of cards that forces errors. E.g., "Make a logical leap in Step 2." If the Grader only checks the Conclusion, they might miss it.
      *   *Wait, one nuance:* In real AI, the System isn't *trying* to trick us, it's just opaque. In the game, a human System might feel weird being forced to lie.
      *   *Fix:* The "System" player draws a **Problem Card**. Some problems are "Clean" (Logic holds). Some are "Tricky" (Logic has a hidden fallacy). The System just solves the card. They aren't "lying," they are simulating a model that *might* be flawed. The Grader doesn't know which card type it is.

