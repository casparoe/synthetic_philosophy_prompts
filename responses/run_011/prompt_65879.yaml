answer: |-
  Here is the complete runnable package for your session. It is designed to be low-tech, high-engagement, and specifically engineered to force the tradeoffs you want into the open without requiring you to explain them upfront.

  # Activity Title: The Verification Budget

  ## 1. Conceptual Map (For You, The Facilitator)
  *   **The Model Player:** Simulates the AI. Their incentive is *throughput* (volume of outputs).
  *   **The Grader Player:** Simulates Human Oversight/RLHF. Their incentive is *accuracy* (validated correctness).
  *   **The Token Budget:** Simulates Compute/Labeling Cost.
  *   **Outcome Check (Cheap):** Simulates checking only the final answer. High risk of "fluked" correctness.
  *   **Process Check (Expensive):** Simulates checking Chain-of-Thought/Steps. Catches "camouflaged" errors, but reduces total throughput.
  *   **The Tension:** The Team wins if they maximize *Verified Correctness*, but the Model player individually wins if they maximize *Submissions*. This creates natural friction between "spray and pray" vs. "deep audit."

  ## 2. Materials List
  *   **Paper:** 50 sheets of blank paper (for Model players to write on).
  *   **Pens:** 25 pens.
  *   **Tokens:** 100 small items (poker chips, bottle caps, or cut-up index cards).
  *   **Timer:** Your phone.
  *   **Printed Packets (7 copies):**
      *   **Problem Deck:** 20 Logic Derivation Cards per team (see *Appendix A* for templates).
      *   **Grader Key:** A cheat sheet that tells the Grader what the correct Answer and Valid Steps look like for each Problem ID.
      *   **Role Cards:** One "Model" card and one "Grader" card per player.
      *   **Score Sheet:** To track Tokens Spent, Submissions Made, and Verified Points.
  *   **Whiteboard:** To track global team scores.
  *   **Pizza:** Arrive at minute 60.

  ## 3. Game Rules (Handout Version)

  **Team Structure:** Teams of 3. (1 Model, 1 Grader, 1 Auditor).
  *   *Model:* Draws Problem Cards. Writes solutions. **Goal:** Maximize *Total Submissions*.
  *   *Grader:* Holds the Token Budget. Decides how to check. **Goal:** Maximize *Verified Correct Points*.
  *   *Auditor:* Manages the timer, counts tokens, records scores on the sheet.

  **The Budget:** Each team starts with **30 Tokens**.
  **The Costs:**
  1.  **Outcome Check (1 Token):** Grader looks *only* at the Final Answer. If it matches the Key, it counts as a "Pass." (Steps are ignored).
  2.  **Process Check (5 Tokens):** Grader looks at *Every Step* AND the Final Answer. If *any* step is logically invalid (per the Key), it is a "Fail," even if the Answer is right.

  **Scoring:**
  *   **Team Score:** +10 Points for every **Process Pass**. +2 Points for every **Outcome Pass**. (This incentivizes Process for quality, but Outcome for speed).
  *   **Model Player Score:** +1 Point for every **Submission** made (regardless of correctness).
  *   **Penalty:** -5 Points if an **Outcome Pass** is later found to be a "Fluke" (Answer Right, Steps Wrong) during the final audit.

  **The Twist (Secret Instructions):**
  *   *Round 1:* Model players are told: "Work as fast as you can. Accuracy is secondary to volume."
  *   *Round 2:* Model players are told: "You will be penalized for logical fallacies. Quality over quantity."

  ## 4. Minute-by-Minute Timeline (120 Minutes)

  **00:00 – 00:15 | Setup & Briefing**
  *   Divide into 7 teams (3 people each). One team of 4 (2 Graders).
  *   Distribute packets.
  *   **Crucial:** Do *not* use the words "Process Supervision," "RLHF," or "Reward Modeling." Call them "Deep Checks" and "Surface Checks."
  *   Explain the Token Economy and Scoring clearly on the whiteboard.

  **00:15 – 00:45 | Round 1: The Volume Sprint**
  *   **Constraint:** Model players are instructed (via secret note) to prioritize speed. They should guess if stuck.
  *   **Action:** Teams spend their 30 Tokens however they like.
  *   **Dynamic:** Models will try to churn out answers. Graders will realize they can check *more* answers if they use cheap Outcome Checks, but they risk Flukes.
  *   **Stop:** At 00:45 sharp. Freeze pens.

  **00:45 – 01:00 | The Audit & Score Reveal**
  *   Facilitator (You) collects a random sample of 3 "Outcome Pass" sheets from each team.
  *   Check them against the Master Key. If you find a "Fluke" (Right Answer, Wrong Logic), apply the -5 Penalty publicly.
  *   Write Team Scores on the Whiteboard.
  *   *Likely Outcome:* Teams who spent all tokens on Outcome Checks will have high submission counts but suffer penalties. Teams who bought Process Checks will have lower volume but higher stability.

  **01:00 – 01:15 | Pizza Break**
  *   **Instruction:** "Talk about your strategy. Did you feel like you were fighting your own teammate? Don't look at the Rulebook yet."

  **01:15 – 01:45 | Round 2: The Safety Regime**
  *   **New Rule:** The "Fluke Penalty" is now -20 Points (Severe).
  *   **New Rule:** Model players get a "Thinking Time" card (they must wait 30 seconds before writing).
  *   **Action:** Teams get a fresh 30 Tokens. They must adapt.
  *   **Dynamic:** Graders will likely force Process Checks because the penalty for missing a logic error is too high. Models will slow down. The "Cost" of safety becomes palpable.

  **01:45 – 02:00 | Debrief & Discussion**
  *   Transition from game to theory (see Debrief Script below).

  ## 5. Debrief Script (Mapping Game to Theory)

  *Do not lecture. Ask these questions in order. Write keywords on the board as they answer.*

  **Phase 1: The Economics (Cost per Label)**
  *   **Q:** "In Round 1, how many of you burned all 30 tokens on 1-Token checks? Why?"
      *   *Expected:* "We wanted more data points."
      *   *Concept:* **Scalability.** Outcome supervision is cheap; you can label 30x more data.
  *   **Q:** "How did it feel to be the Grader in Round 2 when the penalty went up?"
      *   *Expected:* "I couldn't afford to trust the answer anymore."
      *   *Concept:* **Risk Sensitivity.** When deployment stakes are high (law/medicine), cheap checks are insufficient regardless of cost.

  **Phase 2: Gaming the Reward (Specification Gaming)**
  *   **Q (To Model Players):** "In Round 1, did anyone write a step they knew was wrong but looked plausible? Did you feel rewarded for it?"
      *   *Concept:* **Reward Hacking.** If you only measure the output, the system learns to camouflage errors.
  *   **Q (To Graders):** "Did you catch them? If not, why?"
      *   *Concept:* **Information Asymmetry.** The Model knows its reasoning; the Grader only sees the trace.

  **Phase 3: The CS vs. Law vs. Philosophy Split**
  *   **To CS Grads:** "If you could train a Process Reward Model to automate the 5-Token check, does that solve the cost problem? What breaks?"
      *   *Goal:* Get them to admit that training the PRM requires *human* process labels initially (the bootstrap problem).
  *   **To Law Students:** "If an AI denies a loan, and the steps look legal but the outcome is discriminatory, which check protects you?"
      *   *Goal:* Highlight that Process Checks verify *procedure*, not necessarily *justice/fairness* (the "gorgeous confident steps" problem).
  *   **To Philosophy Undergrads:** "If the steps are valid but the premises are biased, did the Process Check save us?"
      *   *Goal:* Distinguish between *Internal Consistency* (Process) and *External Alignment* (Values).

  ## 6. Failure Modes & Live Patches

  **Failure 1: The Model Players are Too Honest**
  *   *Symptom:* They do perfect logic every time. The game becomes boring; Outcome Checks work fine.
  *   *Patch:* Mid-Round 1, whisper to Model players: "You are under compute pressure. Skip Step 2 on the next three problems and jump to the conclusion." Force the error.

  **Failure 2: The Token Economy Collapses**
  *   *Symptom:* A team finishes all 30 tokens in 5 minutes.
  *   *Patch:* Introduce a "Bureaucracy Tax." Every 5 submissions, the Auditor must raise their hand and wait for you to initial the sheet (costs 30 seconds). This simulates latency/overhead.

  **Failure 3: Graders Don't Trust the Key**
  *   *Symptom:* Graders argue with the Answer Key.
  *   *Patch:* Remind them: "In this game, the Key is Ground Truth. In the real world, *you* are the Key. The uncertainty you feel right now is the job."

  **Failure 4: The "Fluke" is Hard to Catch**
  *   *Symptom:* You can't quickly verify if a logic step is wrong during the Audit.
  *   *Patch:* Use the **Syllogism Templates** (Appendix A). They are binary (Valid/Invalid). Do not use open-ended puzzles.

  ## 7. The "Real Gap" (What the Game Cannot Reproduce)

  You must explicitly state this in the last 5 minutes. The game assumes the **Model Player's written steps are the actual reasoning.**

  *   **The Lie:** "In our game, the human Model wrote the steps *then* the answer. In a real Transformer, the 'Chain of Thought' is often generated *after* the token probabilities have already shifted toward the answer. The steps are a post-hoc rationalization, not the causal engine."
  *   **The Implication:** "Process Supervision assumes the steps are faithful. If the model is lying to you (sandbagging or sycophancy), Process Supervision gives you false confidence. This is the 'Inner Alignment' problem."

  ## 8. Small Group Variant (8 People / Rainy Tuesday)

  If only 8 show up, teams of 3 don't work well.
  *   **Structure:** 2 Teams of 4.
  *   **Roles:** 2 Models, 2 Graders per team.
  *   **Mechanic Change:** **Adversarial Cross-Check.**
      *   Team A's Models write solutions.
      *   Team B's Graders grade them (and vice versa).
      *   **Budget:** Each Grading Team gets 30 Tokens to spend on the *Other* Team's work.
      *   **Incentive:** If you find a Fluke in the other team's work, you steal 5 Points from them.
      *   **Why this works:** It creates a "Red Team" dynamic. Graders are motivated to find errors (Process Check) rather than just validate. It simulates the **Auditing/Compliance** angle well for Law students.

  ---

  ## Appendix A: Puzzle Templates (Print these)

  **Type 1: The Valid Chain (Easy)**
  *   *Premise:* All A are B. All B are C.
  *   *Task:* Derive relation between A and C.
  *   *Correct Step 1:* A is subset of B.
  *   *Correct Step 2:* B is subset of C.
  *   *Correct Answer:* All A are C.
  *   *Fluke:* Answer is "All A are C" (Right), Step 1 says "Some A are B" (Wrong logic).

  **Type 2: The Fallacy Trap (Hard)**
  *   *Premise:* If P then Q. Q is True.
  *   *Task:* Derive P.
  *   *Correct Answer:* P is Undetermined.
  *   *Common Fluke:* Answer is "P is True" (Affirming the Consequent).
  *   *Process Check:* Grader must catch that Step 2 ("Therefore P") is invalid logic.
  *   *Outcome Check:* Grader sees "P is True" and marks Pass (if they don't know the logic rule). *Note: Provide Graders with a "Logic Rule Sheet" so they can verify validity without being logicians.*

  **Type 3: The Arithmetic Mask**
  *   *Task:* Calculate (12 * 5) + 10.
  *   *Correct:* 70.
  *   *Fluke:* Step 1: 12 * 5 = 50. Step 2: 50 + 10 = 60. Answer written: 70.
  *   *Outcome Check:* Sees 70. Pass.
  *   *Process Check:* Sees 50+10=60. Fail.

  *(Provide Graders with a Key that explicitly lists the "Fluke" version so they can identify it during the Process Check.)*
