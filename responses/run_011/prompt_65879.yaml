  7.  **Failure Modes:**
      *   *Model too good:* They solve everything perfectly. *Patch:* Add harder puzzles or "Trap Cards."
      *   *Model too adversarial:* They try to break the game. *Patch:* Remind them they are on a team; the goal is Team Score.
      *   *Budget too loose:* *Patch:* Reduce tokens.
      *   *Boredom:* *Patch:* Keep rounds short.

  8.  **Small Group Variant:**
      *   If only 8 people: 2 Teams of 4. Or 1 Big Team vs. Facilitator. Let's go with 2 Teams of 4 (2 Graders, 2 Models) to allow role swapping.

  9.  **Refining the "Gap" (Limitations):**
      *   The biggest gap: **Inner Alignment.** In the game, the human Model *knows* the steps they wrote. In real AI, the steps (Chain of Thought) might be post-hoc rationalizations, not the actual causal mechanism. The game implies the steps *are* the reasoning. Real CoT might be a lie. I need to highlight this.

