      *   *Incentive:* Model wants to maximize "Accepted Submissions." Grader wants to maximize "Correctly Validated Submissions" (catching errors). Wait, usually in RLHF, the Grader *is* the reward signal. Let's align them against a "Ground Truth" to make it a cooperative team score, OR make it adversarial (Model tries to pass, Grader tries to catch).
      *   *Decision:* **Cooperative Team Score.** The Team (Model + Grader) is trying to maximize *Verified Correctness*. This mirrors the goal of AI Safety (getting a safe, correct system).
      *   *The Twist:* The Model player gets a secret "Lazy/Adversarial" card. They *can* do the work, but they get extra points if they pass a wrong answer. This introduces the "Gaming the Reward" dynamic.
      *   *Revised Decision:* To keep it simple for a mixed group, let's make the **Team** compete against other Teams. The Team has a Budget. They must decide how to spend it. The "Model" is a human simulating an AI. The "Grader" is the human overseer.
      *   *The Conflict:* If they spend on Outcome, they get more data points but might miss errors. If they spend on Process, they get fewer data points but higher confidence per point.
      *   *The "Gaming" Element:* The "Model" player needs to be instructed to occasionally *hallucinate* or *cut corners* to see if the Grader catches it.

