answer: |-
  Here is a disambiguation of the thesis "past performance is no guarantee of future results," structured as a numbered menu of distinct interpretations, followed by an analysis of your specific constraints and a judgement on your colleague's usage.

  ### Menu of Theses

  **1. The Logical Skeptic's Thesis (Humean Induction)**
  *   **Explicit Statement:** There is no logical contradiction in assuming the future will differ from the past; therefore, no empirical regularity logically entails a specific future outcome.
  *   **Terms:** "Guarantee" means **logical entailment** (necessity). "Past performance" refers to **any empirical observation or frequency**. The negation asserts the **logical possibility of deviation**.
  *   **Classification:** **Analytic.** It is true by definition of the difference between logical and empirical truths.
  *   **Licensing Dismissal?** **No.** While true, this thesis forbids *all* empirical forecasting, not just base-rate forecasting. To use this to dismiss a base-rate forecast while accepting any other empirical premise (e.g., "this regime is currently unstable") is inconsistent. To license dismissal, he owes a premise that **forecasting requires logical certainty to be actionable**, which is a pragmatic error.

  **2. The Non-Stationarity Thesis (Regime Change)**
  *   **Explicit Statement:** The causal process generating the historical data is not stable over time; therefore, frequencies derived from the past do not map to the probabilities of the future.
  *   **Terms:** "Guarantee" means **stable conditional probability**. "Past performance" refers to the **output of a specific data-generating process**. The negation asserts **structural break or non-stationarity**.
  *   **Classification:** **Substantive and Defensible.** This is an empirical claim about the world (e.g., "nuclear weapons changed the logic of empire").
  *   **Licensing Dismissal?** **Yes, conditionally.** To license dismissal, he owes specific evidence that **the reference class is historically obsolete** (e.g., "modern fiat systems differ fundamentally from gold-standard unions"). Without identifying the specific structural break, this is an unsupported assertion.

  **3. The Reference Class Invalidity Thesis (Small-N/Heterogeneity)**
  *   **Explicit Statement:** The proposed class of "comparable arrangements" is too small or too heterogeneous to yield a stable frequency; therefore, the calculated base rate is statistical noise rather than a signal.
  *   **Terms:** "Guarantee" means **statistical reliability/significance**. "Past performance" refers to the **observed frequency of the chosen reference class**. The negation asserts **insufficient sample size or lack of exchangeability**.
  *   **Classification:** **Substantive and Defensible.** Given your constraint that reference classes are "very small" (handful of polities), this is methodologically potent.
  *   **Licensing Dismissal?** **Yes.** This directly attacks the "outside view" construction. He owes a demonstration that **the cases in the class are not exchangeable** with the target case (e.g., "The Roman Empire is not exchangeable with the Eurozone due to X, Y, Z").

  **4. The Legal/Compliance Thesis (Liability Shield)**
  *   **Explicit Statement:** We make no fiduciary or contractual promise that historical trends will continue; therefore, you cannot sue us if you lose money based on this information.
  *   **Terms:** "Guarantee" means **legal or contractual obligation**. "Past performance" refers to **reported returns in a prospectus**. The negation asserts **limitation of liability**.
  *   **Classification:** **Institutional/Pragmatic.** It is neither true nor false in an epistemic sense; it is a performative speech act defining a legal relationship.
  *   **Licensing Dismissal?** **No.** This is a category error in a forecasting meeting. It governs legal risk, not epistemic warrant. Using it to settle a methodological dispute is a rhetorical conflation.

  ---

  ### Analysis of Constraints

  **1. The Small-N Constraint**
  Your setting involves "a handful of long-lived polities" with no re-sampling. This severely constrains which theses are available:
  *   **Thesis 1 (Logical)** remains available but remains useless for decision-making.
  *   **Thesis 2 (Non-Stationarity)** becomes harder to prove. With small N, it is difficult to distinguish a "regime change" from normal variance.
  *   **Thesis 3 (Reference Class)** becomes the **strongest available objection**. If N=5, the "base rate" is fragile. If your colleague is methodologically sophisticated, this is likely the substantive core of his objection: that in geopolitics, $N$ is too low for frequentist inference.
  *   **Thesis 4 (Legal)** is irrelevant to the epistemic question but explains the phrase's cultural availability.

  **2. The Problem of Induction (Global vs. Local)**
  *   **Global Skepticism (Thesis 1):** If your colleague relies on this, he cannot consistently rely on frequencies "everywhere else in his work." If he uses base rates for currency inflation but rejects them for regime durability using the same slogan, he is being inconsistent. He cannot invoke global skepticism selectively to block only the conclusions he dislikes.
  *   **Local Empirical Claims (Thesis 2 & 3):** These allow him to use frequencies elsewhere (where processes are stable and N is large) while rejecting them here (where processes are unique and N is small). This is the only way he can maintain consistency while deploying the slogan.

  ---

  ### The Fund-Advertising Disclaimer

  **Which reading stands behind the disclaimer?**
  The disclaimer primarily operates on **Thesis 4 (Legal/Compliance)**. Its function is to prevent liability, not to make an epistemological claim.

  **Is it parasitic on base rates?**
  **Yes.** The disclaimer is only meaningful if past performance is *informative*. If past performance had zero correlation with future results (pure noise), regulators would not require the warning; they would simply ban the advertisement of past returns entirely. The disclaimer presupposes **Thesis 2 (Non-Stationarity)**: it admits that while past performance is the best *estimate* available, the process is risky and non-stationary enough that the estimate might fail.

  **Comparison to Colleague:**
  Your colleague is using the sentence to imply **Thesis 1 (Logical Skepticism)** or a strong version of **Thesis 2 (Total Non-Stationarity)** to kill the forecast. The fund disclaimer uses the sentence to acknowledge **Thesis 2 (Risk)** while implicitly accepting the utility of the data.
  *   **Fund Disclaimer:** "The map is not the territory; proceed with caution." (Presupposes the map is useful).
  *   **Colleague's Usage:** "The map is not the territory; throw away the map." (Implies the map is useless).
  *   **Verdict:** Your suspicion is correct. The colleague is using a phrase designed to manage *risk* (finance) to manage *epistemic validity* (forecasting), and in doing so, he is treating a substantive claim (the process has changed/N is too small) as if it were an analytic truth (nothing can be known).

  ---

  ### Ranked Judgement

  Based on the context of a methods meeting, the small-N constraint, and the rhetorical function of the phrase, here is the ranking of what is actually doing the work in your senior colleague's mouth:

  1.  **Most Likely: Thesis 3 (Reference Class Invalidity) disguised as Thesis 1.**
      He likely senses that the small-N reference class is methodologically weak (Thesis 3). However, articulating *why* the class is invalid requires work (defining exchangeability, justifying exclusions). By using the slogan, he invokes the undeniable truth of Thesis 1 (Logical Skepticism) to shield the substantive claim of Thesis 3. It is a **Motte-and-Bailey tactic**: he retreats to the analytic truth ("nothing is certain") when challenged, but advances the substantive claim ("this forecast is worthless") to win the argument.

  2.  **Second Most Likely: Thesis 2 (Non-Stationarity) asserted without evidence.**
      He genuinely believes the current geopolitical/monetary regime is unique (e.g., "nuclear peace," "digital currency"). He treats this as common knowledge rather than a premise requiring proof. The slogan serves as a placeholder for the argument he is too busy to make.

  3.  **Least Likely: Thesis 1 (Global Skepticism) held consistently.**
      It is highly improbable he is a consistent Pyrrhonian skeptic. If he were, he would not engage in forecasting projects at all, nor would he trust inside-view data (which also relies on induction).

  **Recommendation:** To move the dispute forward, do not attack the slogan. Instead, force the disambiguation. Ask: *"Are you saying that no empirical inference is possible (Thesis 1), or that this specific reference class is non-stationary or too small (Thesis 3)?"* If he chooses the latter, you have successfully moved the burden of proof to him to demonstrate the structural break or the heterogeneity of the class.
