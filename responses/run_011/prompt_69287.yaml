answer: |-
  This is a rich set of intuitions. You've essentially mapped the fault lines of modern statistics without realizing you're holding a seismograph. You are oscillating between three competing demands: the need for **error control** (cases 1, 2, 3, 5), the need for **plausibility** (cases 6, 7), and the need for **robustness** (cases 9, 10).

  You asked to see the search, not just the landing. So, before I give you the principle that I think governs your judgments, I'm going to walk you through three candidate principles I drafted and discarded while testing them against your cases. This will show you why the final version has the shape it does.

  ### The Search Process

  **Candidate 1: The "Auditability" Principle.**
  *Draft:* Evidence is valid only if the process generating the data is fully transparent and checkable by an outsider.
  *Stress Test:* This handles your Case 2 (hidden stopping) vs. Case 3 (public stopping) beautifully. It also explains your suspicion of Case 8 (priors are internal, uncheckable).
  *Failure:* It collapses on Case 4. The doctor's process is perfectly auditable (look at the chart), yet you rightly say it generates no *generalizable* evidence. It also struggles with Case 6 vs. 7. The "process" is identical; the difference is your internal prior, which isn't auditable. Auditability is necessary, but not sufficient.

  **Candidate 2: The "Severity" Principle.**
  *Draft:* Evidence exists only if the claim has passed a test that had a high probability of detecting errors if they existed.
  *Stress Test:* This nails Case 10 (high N null kills the effect) and Case 2 (optional stopping ruins error probabilities).
  *Failure:* It is too rigid for Case 9. In the "multiverse" analysis, no single test is severe (p-values vary), yet the *pattern* convinces you. Severity is a property of a single test, but your intuition recognizes evidence in *stability*. It also doesn't naturally accommodate Case 6 vs. 7; a severe test of a miraculous claim should still be treated with skepticism, but "Severity" alone doesn't tell you to discount it.

  **Candidate 3: The "Rational Belief" Principle.**
  *Draft:* Evidence is anything that should rationally update your degree of belief in a hypothesis.
  *Stress Test:* This handles Case 6 vs. 7 perfectly (Bayesian updating). It handles Case 4 (doctor isn't updating beliefs, they're acting).
  *Failure:* It dissolves Case 2 vs. 3. If the data is identical (p=0.048, N=100), a pure belief-updater says the evidence should be identical. But you feel the "hidden peeking" ruins it. Pure Bayesianism ignores the *process* that generated the data, but your intuition correctly demands that the process matters.

  ***

  ### The Winning Principle: Auditable Risk with Independent Anchor

  After discarding those, I believe your intuitions are generated by a hybrid principle. It treats evidence as a two-stage filter: first, the data must be proven reliable (Process); second, the data must be proven meaningful (Context).

  Here is the principle, stated precisely:

  **The Principle of Auditable Risk and Independent Anchor**

  A statistical result counts as evidence for a general claim if and only if it satisfies two conditions:

  1.  **The Risk Clause (Process):** The procedure that produced the data must have subjected the claim to a known, quantifiable risk of rejection *before* the data were observed. The rules defining this risk (stopping rules, analysis plans) must be fixed such that the space of possible alternative outcomes is reconstructable by an outsider.
      *   *Motivating Cases:* 1, 2, 3, 5, 10.
  2.  **The Anchor Clause (Context):** The weight of the evidence conferred by the Risk Clause must be modulated by the independent plausibility of the hypothesis. "Independent" means the plausibility is derived from theory or prior data not used in the current test. If the Anchor is weak, the Risk must be correspondingly higher to count as evidence.
      *   *Motivating Cases:* 6, 7, 8.

  **Caveat (The Robustness Override):** If the Risk Clause is partially compromised (e.g., analytic flexibility), evidence can be recovered if the result persists across the space of reasonable alternative specifications, effectively reconstructing the risk post-hoc.
  *   *Motivating Cases:* 9.

  ***

  ### Stress-Testing Against Your 11 Cases

  Here is how the principle processes your verdicts. I will be honest about where it forces a hard line.

  1.  **Preregistered, p=0.048:** **Pass.** Risk is fixed and auditable (Clause 1). Anchor is neutral (default). Verdict: Weak evidence.
  2.  **Hidden Optional Stopping:** **Fail.** The space of alternative outcomes (when would they have stopped?) is private and unreconstructable. We cannot quantify the risk of a false positive. Clause 1 violated. Verdict: Worthless.
  3.  **Planned Interim Analysis:** **Pass.** The stopping space is mathematically defined in the protocol. The risk is auditable (alpha spending). Clause 1 satisfied. Verdict: Convincing.
  4.  **Doctor Treating Patients:** **Fail (as evidence).** The doctor is optimizing a loss function (patient health), not subjecting a claim to a risk of rejection. There is no "null hypothesis" being tested. Clause 1 violated. Verdict: Good action, no evidence.
  5.  **200 Tests, 1 Reported:** **Fail.** The risk space includes 199 other tests. By reporting only one, the researcher hides the true risk of finding a "significant" result by chance. Clause 1 violated. Verdict: Nothing.
  6.  **Low Prior, p=0.004:** **Fail (as strong evidence).** Clause 1 is met (single test), but Clause 2 (Anchor) is weak. A miracle claim requires extreme risk (e.g., p < 10^-7 or massive replication). Verdict: Nothing.
  7.  **High Prior, p=0.004:** **Pass.** Clause 1 met, Clause 2 strong. Verdict: Believe it.
  8.  **Bayesian Reanalysis:** **Conditional Pass/Fail.** If the prior is "honestly skeptical" but *justified by independent theory*, it passes Clause 2. If the prior is just "I don't like this result," it fails Clause 2. Your suspicion is correct: most skeptical priors are uncheckable. Verdict: Suspicious unless the prior is externally anchored.
  9.  **Multiverse Analysis:** **Pass.** Clause 1 is technically violated (flexibility), but the Robustness Override kicks in. Showing the result holds across 495 specifications reconstructs the risk post-hoc. Verdict: Convincing.
  10. **Replication Power:** **Pass.** Case A (Low N): Clause 1 fails (low power = low risk of rejecting false null). Case B (High N): Clause 1 passes (high power = high risk). Verdict: Matches your intuition.
  11. **The 0.049/0.051 Cliff:** **Explained.** The Principle says the Risk is continuous (p-values are continuous). The "cliff" is a psychological heuristic for "Did they pass the pre-set risk threshold?" It feels real because we use thresholds for decision-making, but the *evidence* changes smoothly. Verdict: The feeling is a bug, the principle is the fix.

  ***

  ### The Hard Verdict: Which One Must You Give Up?

  If I must force you to abandon one of your verdicts to make the system coherent, it is **Case 1**.

  You call p=0.048 in a preregistered study "weak, but real evidence. I'd update."
  My principle, combined with Case 6, suggests you should be much harsher. If you accept Case 6 (that a low prior makes p=0.004 "nothing"), then consistency demands that a neutral prior makes p=0.048 "very little." In a world where most published findings are false (low base rate), a p=0.048 is often more likely to be a false positive than a true positive.

  **Why give up Case 1 instead of Case 6?** Because Case 6 is protected by the Anchor Clause. If you admit that prior plausibility matters (which you do in 7), you cannot treat p=0.048 as "real evidence" in a vacuum. It is only real evidence *relative to a prior*. If the prior is 50/50, it's weak evidence. If the prior is low, it's noise. You want to have it both ways: treating the statistic as objective (Case 1) while admitting context matters (Case 6). You must concede that **no p-value is evidence without a prior.**

  ***

  ### Deep Dive: The 2/3 Pair and Case 4

  **The 2 vs. 3 Reconciliation (Intentions vs. Constraints)**
  You feel "the rules were written down" is too thin a difference to carry the weight between "worthless" (2) and "convincing" (3). You are right that *intentions* don't change the data. But intentions change the **Counterfactual Space**.

  In Case 3 (Interim Analysis), the "space of possible worlds" is mathematically bounded. We know exactly what would have happened if the data had looked different at n=50. We can calculate the probability of a false positive across all those paths. The risk is *quantifiable*.

  In Case 2 (Hidden Peeking), the space of possible worlds is psychological and infinite. Would they have stopped at 50? 60? 75? We don't know. Because we cannot reconstruct the path they *didn't* take, we cannot calculate the error rate.

  It is not that the researcher's soul is cleaner in Case 3. It is that in Case 3, the **risk is auditable**. In Case 2, the risk is hidden. Evidence requires the ability to calculate how often the procedure would have lied to us. Case 3 allows that calculation; Case 2 does not.

  **Case 4 (The Doctor)**
  You ask if the distinction between "fine-in-practice" and "no-good-as-evidence" is a dodge. It is not. It is a distinction between **Optimization** and **Inference**.

  The doctor is playing a game with a loss function: Minimize patient suffering. Stopping when it looks like it works minimizes suffering.
  The scientist is playing a game with an error function: Minimize false claims about the population. Stopping when it looks like it works maximizes false claims.

  You cannot use the same data stream to optimize local utility and infer general truth. If you stop because the patient is better, you have corrupted the data for the purpose of asking "Does this drug work for everyone?" The Principle of Auditable Risk demands that for *inference*, you must bind your hands against your own self-interest. The doctor's hands must remain free. That is why the behavior is virtuous in the clinic but invalid in the journal.

  ***

  ### Verdicts on Three New Cases

  **(a) The Underpowered Study**
  *Case:* N set by power calc for large effect. True effect is half that size. Study runs to full N. Result is non-significant (p=0.20).
  *Verdict:* **Inconclusive, not Negative.**
  *Reasoning:* Clause 1 (Risk) was calibrated for a large effect. The "risk of rejection" if the null were false (power) is now low because the effect is smaller. A non-significant result here does not mean the effect is zero; it means the test lacked the severity to detect the true effect size. You cannot claim evidence of absence.

  **(b) The Conflicting Replications**
  *Case:* Two labs, same preregistered protocol. Lab A: p=0.02. Lab B: p=0.40.
  *Verdict:* **Evidence of Instability, not Evidence of Effect.**
  *Reasoning:* Both satisfy Clause 1 (Auditable Risk). However, the divergence suggests a violation of the "Independent Anchor" or hidden moderators. If the protocol was truly identical, one is a false positive or one is a false negative. The *process* was sound, but the *phenomenon* is not robust. The principle dictates you suspend belief until the heterogeneity is explained. Do not average the p-values.

  **(c) The Grant Ran Out**
  *Case:* Researcher peeked repeatedly but stopped because funding ended, not because of the data.
  *Verdict:* **Valid Evidence (with a caveat).**
  *Reasoning:* This is "informative censoring" but not "data-dependent stopping." The stopping rule is external to the data stream. Clause 1 is satisfied because the decision to stop was not influenced by the significance of the result. *Caveat:* You must verify the grant running out wasn't correlated with early trends (e.g., they knew the interim results looked bad and let the grant expire). If truly independent, the risk is calculable.

  ***

  ### The "Gut Check" Case

  I predict your gut will fail on the following case, and my principle will correct you.

  **The Case:** A massive, perfectly preregistered study (N=50,000) tests a hypothesis with a **neutral prior** (we have no idea if it's true). The result is p=0.0001. The effect size is tiny (d=0.05), but the CI excludes zero comfortably.
  *   **Your Gut:** "This is strong evidence. The N is huge, the p is tiny, it was preregistered. It's real."
  *   **My Principle's Verdict:** **Statistically Real, Substantively Empty.**
  *   **Why:** Clause 1 is satisfied (Auditable Risk). But you are conflating *evidence* with *importance*. With N=50,000, trivial noise becomes "significant." The Principle of Auditable Risk validates the *reliability* of the number, but it does not validate the *claim* that this matters.
  *   **The Trap:** You will feel the p=0.0001 compels belief. But without an Anchor Clause that demands the effect size be theoretically meaningful, you are collecting "true" facts about a world that doesn't care. The principle forces you to say: "I believe the effect is not zero. I do not believe the effect is worth talking about." Your gut often treats "statistically significant" as "scientifically significant." This principle forces them apart.

  ***

  ### What Kind of Animal Is This?

  This principle is **Procedural Realism**.

  It is not **Pure Frequentism**, because it admits that priors (Case 6/7) and robustness (Case 9) matter, which strict error-statistics often sideline as "subjective."
  It is not **Pure Bayesianism**, because it insists that the *process* of data collection (Case 2 vs. 3) changes the evidential value of identical data, which likelihoodists and Bayesians often deny (via the Likelihood Principle).
  It is not **Pragmatism**, because it demands truth-tracking (Risk) over utility (Case 4).

  It is a **Neo-Critical** position. It treats evidence as a relational property: a fact is only evidence *relative to a procedure that could have falsified it* and *relative to a theory that makes it plausible*. It acknowledges that science is a social practice (auditability) aimed at tracking reality (risk), constrained by what we already know (anchor).

  It departs from standard textbook views by refusing to let the math speak for itself. It insists that a number is not evidence until it has passed a background check of how it was made and where it fits. It is a philosophy for a post-replication-crisis world, where trust is the scarcest resource.
