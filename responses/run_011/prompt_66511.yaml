  3.  **Evaluate the User's Current Principle:**
      *   *Principle:* "Dead when body stopped operating as one organism and become collection of organs run by machines."
      *   *Failure Point 1 (Case 2):* The pregnant body *is* operating as one organism (homeostasis, healing, gestation).
