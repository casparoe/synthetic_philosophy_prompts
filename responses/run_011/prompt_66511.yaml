  4.  **Develop a Coherent Framework (The "Reconstruction"):**
      *   *The Hard Truth:* There is no single *biological* principle that cleanly separates all six cases without contradiction. Death is not a purely biological event; it is a *moral/legal status* assigned to a biological process.
