          *   *Recommendation:* Keep the verdict (Dead), but admit the justification is *normative*, not biological. The "expensive" thing to keep is the idea that death is a *moment*. It's a *decision point*.
          *   *Alternative:* Drop the strict biological definition. Accept that Case 2 is biologically a "zombie" state but legally dead to facilitate donation and stop futile treatment.
          *   *Actually, the most expensive is Case 5's logic.* It relies entirely on the Permanence/Irreversibility distinction. If that breaks, the whole transplant system breaks.

      *   **Addressing the Unlisted Cases:**
          *   *Barbiturate Coma:* Not dead. Reversible. Confounds the "no reflexes" test. Shows why we wait.
          *   *Early Embryo:* Alive. Shows "brain death" criteria can't apply to early life. Life begins before brain.
          *   *ECMO Brain Dead:* This is the ultimate test. If ECMO runs circulation, is the body integrating? Yes. Is it dead? Legally, yes (no brain). Biologically? Debatable. This breaks the "somatic integration" theory completely.
