      *   **Irreversibility vs. Permanence (Case 5):**
          *   This is the key. *Irreversible* = Cannot be restarted (physically impossible). *Permanent* = Will not be restarted (decision made).
          *   In DCD, it is *Permanent*, not *Irreversible* (at minute 5, you *could* code them).
          *   Is it a cop-out? Yes. Is it necessary? Yes. It shifts death from a *state* to a *prognosis based on intent*.

      *   **Conclusion:**
          *   Summarize the "Two Deaths" theory.
          *   Validate the nurse's role: You are the enforcer of the normative boundary, not the discoverer of the biological one.

  6.  **Refining the Tone:**
      *   Avoid academic jargon where possible. Use clinical language.
      *   Be decisive. The user wants a reconstruction, not a survey.
