      *   *Wait, better approach:* Acknowledge the "Two Deaths" hypothesis the user asked about. It's not a cop-out; it's the reality. There is *Biological Dying* (a process) and *Social/Legal Death* (a status assignment).
      *   *Refining the Principle:* The principle isn't "When does life end?" It's "When is it permissible to treat this body as a corpse?"
      *   *Addressing Case 5 (DCD):* This hinges on *Permanence* (won't be reversed) vs. *Irreversibility* (can't be reversed). This is the crux.

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Validate the user's intuition. The "mushiness" is a feature, not a bug. The UDDA (Uniform Determination of Death Act) is doing heavy lifting that biology can't support alone.
