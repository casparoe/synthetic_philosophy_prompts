  1. The verdicts leave open whether sense is individuated by the linguistic act of naming itself or strictly by the cognitive mode of presentation associated with the sign. One reading holds that distinct signs introduced separately constitute distinct senses regardless of content, while the other holds that identical modes of presentation yield identical senses even for distinct signs.

  2. On the first reading, the astronomer conferred two senses, making the identity informative and the belief report false; on the second, he conferred one sense, making the identity trivial and the belief report true. This divergence turns on whether the duplication of the naming act overrides the identity of the descriptive content provided to the assistants.

  3. Frege would likely rule that one sense was conferred because sense is defined by cognitive mode, and the assistants possess no distinguishing knowledge between the names. Consequently, the identity is trivial and the belief report holds, preserving his insistence that sense governs cognitive value.

  4. The strongest pressure against this is Frege's concession that natural language lacks a tidy correspondence of sign to sense, implying distinct signs usually carry distinct senses regardless of speaker ignorance. If sense were purely psychological equivalence, the objective status of thoughts would be threatened by individual epistemic states.

  5. Consider a student taught "Cicero" and "Tully" simultaneously as labels for "the Roman orator" without knowing they are distinct names, and ask whether their assertion "Cicero is Tully" counts as a discovery. If Frege calls this trivial, sense follows cognitive state; if informative, sense follows linguistic convention.
