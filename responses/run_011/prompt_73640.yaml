answer: |-
  This is a genuinely sharp observation. You have identified the central tension in modern behavioral law and economics without necessarily using the jargon. You are looking at the gap between **ontological preference** (what you actually want) and **legal preference** (what the law treats you as wanting based on your actions).

  Here is a reconstruction of the implicit theory driving these three regimes, followed by the stress tests you asked for.

  ### 1. The Implicit Theory: "Constructive Paternalism"

  The three schemes do not operate on a **Revealed Preference** theory (where doing nothing reveals you want nothing) nor a **Strict Consent** theory (where nothing counts unless you actively sign).

  They operate on a theory of **Constructive Paternalism** (often associated with Thaler and Sunstein's *Nudge*). The implicit view of human agency here has three specific tenets:

  1.  **Inertia is Noise, Not Signal:** The law assumes that for significant life decisions (retirement, death, long-term contracts), human inaction is usually a result of cognitive load, procrastination, or confusion, not a deliberate expression of preference.
  2.  **The "True Self" is Rational but Busy:** The state assumes there is a version of you that *would* make the "correct" choice if you had perfect information and zero transaction costs. Since you don't, the law supplies the choice your "True Self" *would* have made.
  3.  **Defaults are Policy Tools, Not Neutral Background:** The starting position is not an accident; it is a regulatory lever. The law is not trying to *discover* your preference; it is trying to *shape* the aggregate outcome while leaving an escape hatch for the intensely motivated.

  **What makes something a bias rather than a preference in this view?**
  *   **Preference:** Requires active friction to maintain. If you want the gym, you stay. If you want the pension, you stay in after the refund window.
  *   **Bias/Inertia:** Requires zero friction to maintain. If you do nothing, you stay. The law treats "doing nothing" as a failure of agency, which allows the state to step in and define the outcome for you.

  ### 2. Necessary vs. Incidental Features

  **What the practices *need*:**
  *   **The Asymmetry of Effort:** All three schemes *require* that opting out is slightly harder than staying in. If opting out were as easy as doing nothing, the default would fail. The friction (filling a form, calling a line) is the filter that separates the "True Self" (who cares enough to act) from the "Inert Self" (who doesn't).
  *   **The Time Limit:** There must be a moment where uncertainty crystallizes into certainty. Without a deadline (14 days, 1 month, death), the transaction can never settle. The law needs finality more than it needs perfect accuracy.

  **What just *fits comfortably* (Incidental):**
  *   **The Specific Windows:** The 14-day gym window vs. the 1-month pension window is arbitrary. It fits the administrative capacity of the industries, not a deep philosophical truth about how long it takes to form a preference.
  *   **The Refund Mechanism:** In pensions, the fact that contributions are *refunded* (erased) rather than just *locked* during the first month is a policy choice, not a theoretical necessity. They could theoretically treat it as locked savings immediately but allow a withdrawal. The "erasure" is a comfort mechanism to make auto-enrolment politically palatable.

  ### 3. Rival Accounts Ruled Out

  Your intuition is correct: these schemes explicitly rule out two competing theories.

  *   **Ruled Out: Flat Revealed Preference.**
      *   *Theory:* "If you didn't opt out, you wanted it."
      *   *Conflict:* If this were true, **Auto-Enrolment** and **Opt-Out Organ Donation** would be incoherent. Under revealed preference, the default shouldn't matter because people would move to their preferred state regardless of friction. The fact that the government switched organs to opt-out *specifically to increase donation rates* admits that revealed preference is false; people don't move to their preferred state without a push.
  *   **Ruled Out: Strict Consent (Libertarian Contractualism).**
      *   *Theory:* "Nothing binds you unless you actively sign 'Yes'."
      *   *Conflict:* This would kill **Auto-Enrolment**. If strict consent were required, employers could not deduct pay without a signed opt-in form. It would also complicate the **Gym** contract (though less so, as you do sign initially).

  **The Middle Ground:** The current system occupies a "Soft Paternalism" zone. It says: *We will assume you consent to the thing that is good for you (or the market) unless you actively scream 'No'.*

  ### 4. Consistency Check: Are the Three Schemes Compatible?

  Superficially, they look inconsistent. Deep down, they are consistent **if you accept that the "Good" changes by domain.**

  *   **Gym (Consumer Law):** The "Good" is **Market Certainty**.
      *   *Logic:* We know sales can be high-pressure, so we give you a cooling-off period (protecting the Impulsive Self). But after 14 days, the need for commercial finality outweighs your inertia. Silence becomes consent because the market cannot function if contracts are perpetually unwindable.
  *   **Pensions (Welfare Law):** The "Good" is **Future Wealth**.
      *   *Logic:* We know you are myopic about retirement. So we default you in. *However*, the 1-month refund window is actually a **Cooling-Off Period** identical to the gym. It acknowledges that the *initial* enrolment was done without your active consent. It says: "We forced you in, but you have 30 days to undo the force." After 30 days, the "Future Wealth" good outweighs your inertia.
  *   **Organs (Public Health Law):** The "Good" is **Social Utility**.
      *   *Logic:* There is no "cooling-off" here because the transaction happens at death. The state decides that saving lives (social good) outweighs the individual's inertia.

  **The Inconsistency:**
  The Pension refund window is the outlier. It admits that the default might be *wrong* for you initially. The Organ system does not admit this; it assumes the default is *right* for you immediately.
  *   *Why?* Because pension money is *yours*. Organ tissue is treated as a *public resource* in the opt-out model. The pension scheme respects property rights more than the organ scheme respects bodily autonomy (post-mortem).

  ### 5. Underdetermination: Where the Theory is Vague

  There is a crucial area where the paperwork is the same, but the justification could be totally different. This is the **Justification for the Default.**

  *   **Scenario A (Benevolent Paternalism):** "We default you in because we know you *want* to save/have your organs used, but you are lazy."
  *   **Scenario B (State Appropriation):** "We default you in because *we want you to* save/have your organs used, regardless of what you want."

  The paperwork (the enrolment letter, the donor card) looks identical in both scenarios. The system is **underdetermined** regarding *whose preference* is being tracked.
  *   In Pensions, it's mostly Scenario A (theoretically).
  *   In Organs, it's a mix.
  *   In Gym Contracts, it's neither; it's **Scenario C (Commercial Efficiency).** The default after 14 days isn't what's best for you; it's what's best for the gym's cash flow.

  This means the "Theory of Preference" is actually a **Theory of Power.** The party with the power to set the default (State or Employer) gets to define what "Silence" means.

  ### 6. The Hard-Line Revealed Preference Swap

  If you swapped the implicit view for a hard-line **Revealed Preference / Strict Consent** model tomorrow, here is what would concretely change:

  1.  **Gym Contracts:** The 14-day cooling-off right would likely vanish (or be seen as a concession, not a right). If you sign, you are bound. Silence is absolute consent.
  2.  **Pensions:** Auto-enrolment would become **Opt-In**. Employers would hand you a form; if you didn't sign it, no money is taken.
      *   *Consequence:* Participation rates would crash (likely from ~90% to ~40-50%). The "inertia" would no longer be harnessed for welfare.
  3.  **Organs:** The register would revert to **Opt-In**.
      *   *Consequence:* Donor rates would drop significantly. The "deemed consent" legal basis would be abolished. Silence would mean "No."

  **The Crucial Shift:** Under Revealed Preference, **Inertia becomes a Veto.** Currently, Inertia is an **Endorsement** (in organs/pensions) or a **Ratification** (in gyms). Under strict revealed preference, Inertia is simply **Absence of Data**, which usually defaults to "No Action Taken."

  ### 7. The Organ/Family Paradox

  You asked: *Does the fact that families still get consulted sit awkwardly with the whole idea of deemed consent?*

  **Yes, it is a massive contradiction.** And it is the "tell" that reveals the true theory.

  If the law truly believed that **Silence = Consent**, the family's opinion would be legally irrelevant. The deceased consented by law; the tissue belongs to the state/medical system.

  The fact that clinicians still ask the family proves that the "Deemed Consent" law is **political fiction.**
  *   **Legally:** You have consented.
  *   **Practically:** We need your family to confirm you didn't *secretly* object.

  **What this tells us about the Theory:**
  The system is not tracking **Consent**. It is tracking **Lack of Objection.**
  There is a philosophical difference.
  *   *Consent:* "I want this."
  *   *Lack of Objection:* "I haven't said I don't want this."

  The family consultation exists because the state knows that "Lack of Objection" is a weak proxy for "Consent" in high-stakes emotional situations. If the family screams "He would have hated this," the state retreats. This implies the system is not actually confident in its own theory of preference. It is **hedging.** It uses the legal default to boost numbers, but uses the family consultation to prevent political backlash.

  ### Summary

  You have stumbled upon the machinery of **Libertarian Paternalism**.

  *   **The Theory:** People are bad at choosing what is good for them in the long run, so the state sets the default to the "good" option and relies on inertia to keep them there.
  *   **The Inconsistency:** The definition of "Good" changes based on who benefits (You in pensions, The Gym in contracts, Society in organs).
  *   **The Flaw:** The system claims to respect autonomy (by letting you opt out) but relies on the fact that most people won't. The family consultation in organ donation admits that the "deemed consent" is often not real consent, but rather a lack of registered dissent.

  The "rabbit hole" you're in is the realization that **modern law does not try to find out what you want.** It tries to manage what you *do* by structuring the path of least resistance. Your inertia is not your own; it is a resource the state harvests.
