  **1. The "Broken Barrier" Model (Defense in Depth)**
  *   **The Rule:** Any independent safety layer that failed to function as designed and contributed to harm is a contributing factor. Redundancy does not excuse individual failures (see Case 2: Pharmacist *and* Nurse tagged).
  *   **The Logic:** Safety is a Swiss Cheese model. If two slices have holes that line up, both holes are factors.
  *   **Prediction:** **Tags Both.**
