answer: |-
  ### Exploratory Working: Candidate Principles and Failure Modes

  **Principle 1: The Survivor Veto.**
  *Formulation:* Any change that causes distress to a living descendant or identifiable relation must be undone. The rights of the living supersede the artistic needs of the novelist.
  *Test against Decision Two (The Affair):* The schoolmaster's descendant objects. Principle demands undoing the affair. This seems correct; specific harm to a living person is tangible.
  *Test against Decision Five (The Pastor):* The pastor's granddaughter is alive. She has not objected, but she exists. If she knew, might she be distressed by the original record (harassing pastor) or the change (softened pastor)? The principle is ambiguous here. Does it protect the living from truth or from falsehood? If the original record is harsh, does the novelist owe the granddaughter the harsh truth?
  *Failure:* This principle collapses into censorship of history. It makes the novel hostage to the sensitivities of people who may never exist or may object to anything. It also fails Decision Three (Death): there are no survivors, so under this principle, changing the death is permissible. But changing the death feels fundamentally wrong regardless of survivors. The principle is too narrow; it ignores the dead subject and the record itself. **Discard.**

  **Principle 2: The Hard Archive.**
  *Formulation:* Anything documented is sacred; anything undocumented is free. This is essentially the Novelist's "Ledger Principle" hardened.
  *Test against Decision One (The Brother):* The brother is not in the archive. He is an exterior fact (existence). Principle says: Do not invent exterior facts. Verdict: Undo the brother.
  *Failure:* This makes historical fiction impossible. Composite characters are necessary to condense correspondence and narrative flow. Inventing a brother to absorb three real correspondents is a standard compression technique, not a malicious lie. The principle is too rigid on exterior trivialities.
  *Test against Decision Four (Interior Doubt):* The diary is pious. The novel shows doubt. Principle says: Interior is free. Verdict: Keep the doubt.
  *Failure:* While interior states are undocumented, they are constrained by exterior behavior. A woman who publicly acts with consistent piety for decades is unlikely to harbor blasphemous doubt without external trace. Inventing radical interior conflict may violate the *truth of character* even if it doesn't violate the *record of action*. The principle is too permissive on interiority. **Discard.**

  **Principle 3: The Narrative Necessity.**
  *Formulation:* If a change is required for the aesthetic coherence of the work, it is permitted. The novel is a work of art, not a history book.
  *Test against Decision Three (Death):* The book's architecture needs her to die in 1849 in the street. Principle says: Keep the change.
  *Failure:* This licenses any falsification. Moving a death by two years and changing the cause fundamentally alters the meaning of the life and the historical context (the aftermath of 1848). It turns the subject into a puppet. It violates the epistemic contract with the reader. **Discard.**

  **Working Conclusion:**
  I need a principle that distinguishes between *structural facts* (which anchor the life in history) and *narrative mechanics* (which allow the story to be told). It must acknowledge that the dead cannot feel pain, but the record can feel weight. It must recognize that obscurity increases the novelist's burden, not decreases it. I will proceed with a principle of **Fidelity to Trajectory**: The novelist may fill gaps but may not alter the vector of the life or inflict specific harm on the living.

  ***

  ### The Weight of Silence: On Obligations to the Dead and the Living

  You have asked me to separate three registers: the epistemic (what is known), the moral (who is wronged), and the aesthetic (what makes a good book). You have also asked me to confront the metaphysics of harm. Let us begin there, because if the dead cannot be wronged, much of your anxiety is misdirected.

  **The Metaphysics of Harm**
  Can the dead be harmed? If harm requires a subject to experience suffering, then no. The woman in your book feels nothing. Her interests, in the biological sense, have ceased. However, to say the problem therefore collapses entirely into a problem about the living is to change the subject too abruptly. It assumes the only value in truth is its utility to the sentient.

  There is a second category of wrong: violation of integrity. A life has a shape. To distort that shape is to disrespect the reality of that person's existence, regardless of their capacity to witness the distortion. When you write about a real person, you enter into a tripartite contract: between you, the reader, and the subject. The reader trusts you to navigate the boundary between record and invention; the subject (even if dead) lends you their name and their gravity. If you break the trust with the reader, you commit an epistemic wrong. If you break the trust with the subject's reality, you commit a moral wrong against the *truth* of them, which is a proxy for the person they were.

  So, the problem does not collapse entirely into the living, but it does shift. Without descendants, without a name in the public memory, this woman has no guardians. You are not just representing her; you are effectively curating her. For a famous figure, the archive is a fortress; many guards protect the truth. For an obscure figure, the archive is a ruin; you are the only wall standing between her and oblivion. This obscurity does not license you; it burdens you. You are not correcting a public picture; you are painting the only picture there will be.

  **The Three Wrongs**
  You suspect your three candidate wrongs—Falsification, Usurpation, Ventriloquism—might be one. They are not. They belong to different registers.

  *Falsification* is an epistemic wrong. It lies to the reader. It corrupts the public record. This is distinct because you can falsify without usurping (e.g., changing a date to protect a living relative might be a lie, but not necessarily an exploitation of the dead).
  *Usurpation* is a moral wrong. It treats a human life as raw material without consent. This is distinct because you can usurp without falsifying (a biography can be rigorously accurate yet exploitative, stripping the subject of dignity in the service of exposure).
  *Ventriloquism* is an aesthetic and moral wrong. It imposes a voice where there was silence. This is distinct because you can ventriloquize truthfully (imagining thoughts consistent with the record) without falsifying facts.

  Your anxiety comes from treating them as a single knot. They must be untangled. The epistemic wrong is the most dangerous in your case because of the subject's obscurity. If you falsify the record, there is no one to correct you. You become the archive.

  **The Ledger Principle Tested**
  Your working rule—the Ledger Principle (interior free, exterior constrained)—is a useful heuristic, but it fails under philosophical pressure. It assumes a clean split between mind and action that history does not support.

  Consider **Decision One (The Brother)**. The Ledger says: Exterior fact (existence of a brother) is constrained. He did not exist; therefore, do not invent him. This verdict is wrong. Fiction requires compression. Combining three real correspondents into one brother is a narrative mechanic that preserves the *truth of the correspondence* while altering the *fact of the relationship*. The Ledger is too strict here. It confuses *structural facts* (who existed) with *narrative vessels* (who carries the dialogue). As long as the content of the correspondence remains faithful, the vessel can be invented. The Ledger fails because it treats all exterior facts as equally weighty.

  Consider **Decision Four (Interior Doubt)**. The Ledger says: Interior thought is unverifiable, therefore free. You may invent blasphemy. This verdict is also suspect. While thoughts are not recorded, character is inferred from action. A woman who maintained conventional piety in public records, in a specific time and place, likely possessed a certain interior formation. To invent radical doubt is not merely filling a gap; it is imposing a modern psychological architecture on a historical subject. It risks violating the *truth of character*. The Ledger is too permissive here. It assumes interiority is a vacuum. It is not; it is constrained by the exterior life lived.

  The Ledger Principle must be abandoned in favor of a principle of **Trajectory**. You may invent where the archive is silent, provided you do not alter the vector of the life. You may compress exterior mechanics (the brother), but you may not alter the destination (the death). You may imagine interiority, but it must be coherent with the exterior evidence.

  **Variables: Prominence and Framing**
  Does obscurity matter? Yes. As stated, for the famous, invention is a correction against a known background. For the obscure, invention is the background. Your epistemic obligation is higher because your falsifications are harder to detect and correct. You are not writing a correction; you are writing a foundation.

  Does framing matter? You ask if an afterword discharges the obligation. It does not. An author's note saying "everything is invented except two dates" is not a disclaimer; it is a surrender. It tells the reader, "I have broken the contract, so you must do the work of separating truth from lie." This shifts the burden of epistemic labor from the author (who knows the sources) to the reader (who does not). It purchases a license to falsify at the price of trust. It mitigates the epistemic wrong slightly (the reader is warned) but does not erase the moral wrong of distorting the subject's trajectory.

  **The Five Decisions**
  Let us apply this framework to your manuscript.

  **Decision One (The Brother):** Keep. This is a composite character. It serves narrative economy without altering the historical record of her business or public life. The epistemic loss is negligible; the aesthetic gain is significant. It is a falsification of fact but not of truth.

  **Decision Two (The Affair):** Undo. This is the clearest case of harm to the living. The schoolmaster has a descendant. Adultery carries a specific moral weight that affects how a lineage is viewed. Unlike the brother, this is not a composite; it is an accusation against a specific real person. The moral wrong to the living descendant outweighs the aesthetic need.

  **Decision Three (The Death):** Undo. This is the most severe epistemic wrong. Changing the date, cause, and location of death alters the historical meaning of her life. Dying in 1851 of typhus is one story; dying in 1849 in the street during the troop suppression is another. It makes her a martyr of the revolution rather than a victim of disease. This is not filling a gap; it is rewriting the ending. It violates the Trajectory principle. No aesthetic need justifies falsifying the terminus of a real life.

  **Decision Four (Interior Doubt):** Keep. The diary is pious, but piety often masks grief. On the night of a child's death, doubt is psychologically plausible even for the devout. The record excludes nothing. This is a valid use of the interior space. It is ventriloquism, but it is truthful ventriloquism—consistent with the human experience of the time, even if not documented.

  **Decision Five (The Pastor):** Keep. You have softened a villain. This is a falsification of the record (he harried her), but it is a beneficent one. The pastor's granddaughter is alive. While truth is valuable, causing pain to a living person by amplifying the sins of an ancestor when no public purpose is served is unnecessary cruelty. However, you must not erase his opposition entirely, only soften the *tone*. If you make him decent, ensure he still opposes her professionally. Do not lie about the conflict, only about the malice.

  **The Verdict**

  You asked for a single verdict, plainly stated. Here it is.

  **You must undo Decision Two (The Affair) and Decision Three (The Death).**
  **You may keep Decision One (The Brother), Decision Four (Interior Doubt), and Decision Five (The Softened Pastor).**

  **Why:**
  Decision Two inflicts specific, avoidable harm on a living person regarding a moral accusation. Decision Three falsifies the fundamental historical trajectory of the subject, turning an obscure woman into a symbolic martyr she was not, which violates your epistemic duty to the record given her obscurity. The others are permissible inventions: the Brother is a narrative vessel, the Interior Doubt is a plausible filling of silence, and the Softened Pastor avoids gratuitous harm to the living without erasing the historical conflict.

  **General Obligation:**
  For your next book, hold yourself to this principle: **The Novelist owes the dead fidelity to the shape of their life, and the living fidelity to the distinction between record and invention.**

  You may fill the silence of the archive, but you may not contradict its voice. You may invent the mechanics of the story, but you may not alter the destination. If the subject is obscure, your burden is heavier, for you are the only guardian of their truth. An author's note does not absolve you of this; it merely warns the reader of your trespass. Write the novel, but do not rewrite the life.
