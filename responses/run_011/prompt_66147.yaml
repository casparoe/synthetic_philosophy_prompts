answer: |-
  **Menu of Readings: "Science is Self-Correcting" (SSC)**

  1.  **The Institutional Mechanism Claim.** *Proposition:* Scientific institutions (peer review, replication) causally facilitate the detection of anomalies.
      *   **Status:** Platitude.
      *   **PMI Impact:** None. Laudan grants errors are found; he doubts we escape *reference failure*.
      *   **Selection Objection:** **Bites.** Mechanisms exist, but their efficacy against *current* undetected errors is the very point in dispute.

  2.  **The Methodological Discontinuity Claim.** *Proposition:* Contemporary methods are qualitatively superior to past methods, breaking the inductive link between past and present error rates.
      *   **Status:** Substantive/Empirical.
      *   **PMI Impact:** **Undercuts.** Denies the uniformity of nature required for the induction.
      *   **Selection Objection:** **Mitigated.** Past scientists also believed their methods were optimal. To succeed, one must specify *why* current tools (e.g., relativistic constraints) avoid specific past blind spots (e.g., absolute frames) without begging the question.

  3.  **The Peircean Convergence Claim.** *Proposition:* Truth is defined as the opinion fated to be agreed upon at the ideal limit of inquiry; SSC describes this teleological trajectory.
      *   **Status:** Metaphysical/Regulative.
      *   **PMI Impact:** **Undercuts (by fiat).** PMI is a mid-point snapshot; this claim posits the end-point is veridical.
      *   **Selection Objection:** **Irrelevant.** This is not an empirical generalization from past corrections but a modal claim about the nature of inquiry. However, it offers no *current* guarantee of truth.

  4.  **The Structural Retention Claim.** *Proposition:* Correction involves discarding ontological posits while retaining mathematical structure (e.g., Fresnel's equations survive ether's demise).
      *   **Status:** Substantive/Defensible (cf. Structural Realism).
      *   **PMI Impact:** **Weakens.** Shifts the target from "theory is true" to "theory's structure is approximately true."
      *   **Selection Objection:** **Bites.** We cannot distinguish "working" from "idle" posits in real-time. We only know what was retained *after* the next theory arrives.

  5.  **The Normative Definition Claim.** *Proposition:* A practice that does not correct itself is not science; SSC is a criterion of demarcation, not a description of success.
      *   **Status:** Normative.
      *   **PMI Impact:** None. PMI concerns the truth of outputs, not the classification of the practice.
      *   **Selection Objection:** **Irrelevant.** Addresses definition, not reliability.

  **Reconstruction and Evaluation**
  Charitably reconstructed, your speaker likely relied on a conflation of (1) and (2). Rhetorically, (1) does the work (everyone loves replication), while (2) does the heavy lifting against PMI (our methods are better now). However, without explicitly arguing for Methodological Discontinuity—specifying *why* ether-drift errors are detectable now in a way they weren't then—the slogan collapses into the Institutional Mechanism Claim. Against your classmate's selection objection, only Reading 2 offers a genuine rebuttal, but it requires an argument the speaker didn't give: that current physics occupies a privileged methodological position distinct from the ether theorists' own confidence in their apparatus. Without that, "self-correction" is merely a description of the graveyard of theories, not a guarantee against joining them.
