answer: |-
  This is a fantastic collision of domains. You are asking how a metaphysical argument about the ontology of properties maps onto a statistical framework designed for identifying causal effects from observational data.

  Here is the translation of Jaegwon Kim's Causal Exclusion Argument into your causal inference vocabulary, followed by the residue report you asked for.

  ### 1. The Restatement: Kim's Argument in DAG/SEM Terms

  Let's construct the Structural Causal Model (SCM) that a Non-Reductive Physicalist (NRP) wants to claim is true. We have two time points, $t$ and $t+1$.

  **The Variables:**
  *   $P_t$: The physical base state at time $t$ (e.g., C-fiber firing).
  *   $M_t$: The mental property at time $t$ (e.g., Pain).
  *   $P_{t+1}$: The physical effect state at time $t+1$ (e.g., Muscle contraction).
  *   $M_{t+1}$: The mental effect state at time $t+1$ (e.g., Wincing).

  **The NRP Graph (The Claim):**
  The NRP wants to assert the following structural equations:
  1.  $P_{t+1} := f_P(P_t, \epsilon_P)$  *(Physical Causal Closure)*
  2.  $M_t := g(P_t)$ *(Supervenience: $M$ is determined by $P$)*
  3.  $M_{t+1} := g(P_{t+1})$ *(Supervenience)*
  4.  $M_{t+1} := h(M_t, \dots)$ *(Mental Causation: The thing we want to save)*

  In DAG notation, the NRP wants to draw:
  *   $P_t \rightarrow P_{t+1}$
  *   $P_t \rightarrow M_t$ (Supervenience base)
  *   $P_{t+1} \rightarrow M_{t+1}$ (Supervenience base)
  *   $M_t \rightarrow M_{t+1}$ (Mental Causation)
  *   *(Implicitly, to make mental causation work on the physical world, they often need $M_t \rightarrow P_{t+1}$ as well).*

  **Kim's Exclusion Argument in CI Vocabulary:**
  Kim argues that this graph is misspecified due to **conditional independence** and **sufficiency**.

  1.  **Physical Closure:** The path $P_t \rightarrow P_{t+1}$ is causally sufficient. In regression terms, the coefficient $\beta_{P_t \rightarrow P_{t+1}}$ accounts for all explainable variance in $P_{t+1}$.
  2.  **Supervenience as Determinism:** $M_t$ is a deterministic (or near-deterministic) function of $P_t$. There is no error term on $M_t$ that is independent of $P_t$.
  3.  **The Screening-Off:** Because $M_t$ adds no information about $P_{t+1}$ (or $M_{t+1}$) that is not already contained in $P_t$, $M_t$ is d-separated from $M_{t+1}$ conditional on $P_t$.
      *   Formally: $M_{t+1} \perp \!\!\! \perp M_t \mid P_t$.
  4.  **The Exclusion:** If you run the regression $M_{t+1} \sim M_t + P_t$, the coefficient for $M_t$ will be zero (or statistically indistinguishable from zero) because $P_t$ "screens off" $M_t$.
  5.  **Overdetermination Check:** The only way to keep the $M_t \rightarrow P_{t+1}$ arrow is to claim **Causal Overdetermination**. In your toolkit, this means there are two distinct, open paths from distinct causes to the same effect ($P_t \rightarrow P_{t+1}$ AND $M_t \rightarrow P_{t+1}$), where both are sufficient. Kim argues this is implausible for systematic mental causation (it's not like two assassins shooting at once; it happens every time).

  **Conclusion:** $M_t$ is an **epiphenomenon**. It is a collider or a mediator that carries no unique variance. It is a "shadow" cast by $P_t$.

  ---

  ### 2. The Residue Report

  Here is where the mapping holds, where it bends, and where it breaks.

  #### A. Clean Maps (The Statistical Core)
  *   **Causal Closure $\approx$ No Unmeasured Confounding + Sufficiency:** The claim that "physics is closed" maps cleanly to the assumption that the set of physical variables $\{P\}$ is causally sufficient for physical outcomes $\{P^*\}$. There are no omitted variables $U$ such that $U \rightarrow P^*$.
  *   **Exclusion $\approx$ Multicollinearity/Masking:** Kim's intuition that the physical cause "excludes" the mental cause maps perfectly to extreme multicollinearity in a regression model. If $Cor(M_t, P_t) \approx 1$, you cannot identify the unique causal effect of $M_t$ controlling for $P_t$. The standard errors blow up; the coefficients become unstable.
  *   **Overdetermination $\approx$ Parallel Mediation:** The "bullet to bite" is claiming two parallel paths exist ($P \rightarrow Y$ and $M \rightarrow Y$) that are both active. In DAGs, this is perfectly coherent. You just estimate both Average Causal Effects (ACE).

  #### B. Distorted Maps (The Metaphysical Stretch)
  *   **Supervenience as an Arrow ($P \rightarrow M$):** This is the biggest distortion. In your DAGs, an arrow implies that if you intervene on $P$ ($do(P)$), $M$ changes *causally*. But supervenience is not causation; it is a **constitutive** or **modal** dependency.
      *   *The Distortion:* Drawing $P \rightarrow M$ implies $P$ and $M$ are distinct events separated by a causal mechanism. Supervenience claims they are the *same event* described at different levels.
      *   *The CI Consequence:* If you treat supervenience as a causal arrow, you imply modularity (see below). If you treat it as identity, you can't draw two nodes.
  *   **Distinctness of Variables:** DAGs require nodes to be distinct variables. Kim's argument rests on $M$ and $P$ being *distinct properties* (otherwise it's reductionism, not non-reductive physicalism). But they must also be *inseparable*. DAGs have no syntax for "distinct but inseparable."

  #### C. No Expression (The Void)
  *   **The Modularity Assumption:** This is the critical missing piece. Your DAG framework rests on the **Causal Markov Condition** and **Modularity**. Modularity assumes that each structural equation is an independent mechanism. You can intervene on $M_t$ without changing the equation for $P_t$.
      *   *Kim's Point:* Supervenience violates modularity. You *cannot* intervene on $M_t$ (change the pain) without intervening on $P_t$ (changing the C-fibers).
      *   *The Void:* There is no way to draw a DAG where $do(M_t)$ is defined *without* simultaneously triggering $do(P_t)$. Standard CI assumes variables are "loose" enough to be wiggled independently. Kim argues mental variables are "tight" to physical variables.
  *   **Identity vs. Correlation:** In your data, if two variables are perfectly correlated, you drop one for identifiability. In metaphysics, "Identity" ($M = P$) is different from "Perfect Correlation" ($Cor(M, P) = 1$). DAGs cannot distinguish between $M$ being *the same thing as* $P$ versus $M$ being *caused by* $P$ with probability 1.

  ---

  ### 3. The Supervenience-without-Identity Problem

  You suspected this is where the map fails. **You are correct.**

  In causal modeling, if $M$ supervenes on $P$ without being identical to it, you are positing a functional relationship $M = f(P)$ where $f$ is many-to-one (multiple physical states map to one mental state).

  **The Problem:**
  To estimate the causal effect of $M$ on an outcome $Y$ (using the backdoor criterion or front-door criterion), you must be able to conceptually hold $P$ fixed while varying $M$.
  *   **CI Requirement:** To find $ACE(M \rightarrow Y)$, we need $E[Y | do(M=m)]$.
  *   **Supervenience Constraint:** $do(M=m)$ is **undefined** unless you also specify which $P$ realizes $M$. You cannot set "Pain = 1" without setting "C-fiber firing = 1".
  *   **The Clash:** If you control for $P$ (to block the physical path), you fix $M$ (because $M$ supervenes on $P$). There is no variance left in $M$ to explain $Y$.
      *   Mathematically: $Var(M | P) = 0$.
      *   Therefore: $\beta_{M \rightarrow Y | P} = 0/0$ or simply undefined.

  **Where you might be wrong:**
  You aren't wrong about the DAGs. You are right that DAGs can't express this. However, **Interventionist Causation (James Woodward)** attempts to fix this. Woodward redefines causation specifically to handle supervenience. He argues that an intervention on $M$ is valid *even if* it changes $P$, provided the change in $P$ is *only* that which is required to change $M$.
  *   *In your vocab:* This is like a "compound intervention" or a constrained optimization where $do(M)$ forces $do(P)$ along a specific manifold.
  *   *Kim's Counter:* Kim would say this is cheating. If the only way $M$ works is by wiggle $P$, then $P$ is the real cause. $M$ is just a label for the wiggle.

  ---

  ### 4. The Verdict: Who is Confused?

  **Are the philosophers confused?**
  No. Kim is identifying a genuine ontological constraint that standard causal models tacitly assume away. He is pointing out that **Non-Reductive Physicalism** is structurally unstable. It wants $M$ to be distinct enough to be a cause, but dependent enough to be physical.

  **Are causal modelers leaving something out?**
  Yes. Your toolkit assumes **Variable Autonomy**. It assumes that for any node $X$, there exists a possible world (or intervention) where $X$ changes and its parents do not (except via the edge).
  *   In clinical psych, this is usually fine. "Therapy" and "Medication" can be varied independently.
  *   In metaphysics of mind, "Pain" and "C-fibers" cannot.

  **The Synthesis:**
  The residue shows that **DAGs are inherently reductionist.**
  To make a DAG work, you must operationalize variables. Once you operationalize "Depression" as a PHQ-9 score and "Serotonin" as a blood assay, you have made them distinct, measurable, separable variables. You have *already solved* the exclusion problem by fiat through measurement.
  *   In your data, $M$ and $P$ are never perfectly collinear. There is measurement error. There is noise. So $Var(M|P) > 0$.
  *   Therefore, in your *empirical* models, mental variables *do* have unique predictive power (because your measures are imperfect proxies for the true physical base).

  **Kim's argument applies to the "True Model" (God's DAG), not your Estimated Model.**
  *   **God's DAG:** $P$ determines $M$ perfectly. $P$ determines $P^*$ perfectly. $M$ is excluded.
  *   **Your DAG:** $P_{measure}$ correlates with $M_{measure}$. $P_{measure}$ predicts $P^*_{measure}$ with error. $M_{measure}$ captures residual variance (perhaps measurement error, perhaps valid construct variance).

  **Final Answer:**
  The philosophers are not confused; they are talking about the **ontology of the nodes**. You are talking about the **epistemology of the edges**.
  *   Kim says: "If the nodes are related by supervenience, the edges from mental nodes are redundant."
  *   You say: "In my data, the mental nodes predict outcomes conditional on physical covariates."

  The gap is that your "Mental Variable" is likely not the "Mental Property" Kim is talking about. Your variable is a *indicator* that contains noise and independent variance. Kim is arguing about the *construct* itself.

  **Recommendation for the Partner:**
  Tell them: *"In my framework, Exclusion looks like perfect multicollinearity. If Mental and Physical are distinct but inseparable, my design matrix is singular. I can't estimate the model. You philosophers are arguing about whether the singularity is a feature of the universe or a bug in the theory. I'm just telling you that if it's a feature, I can't run the regression."*

  This acknowledges their point (the singularity/identification problem) while maintaining your ground (that empirically, we never observe perfect supervenience, so mental variables retain predictive utility).
