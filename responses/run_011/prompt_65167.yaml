answer: |-
  1. **Bottom line**
  The specification is satisfiable. The case successfully generates the required divergence: Total and Average Utilitarianism endorse the addition, while Critical-Level Utilitarianism opposes it, and the Person-Affecting View remains indifferent. The most fragile assumption is the assignment of the critical level. It must be set higher than the welfare of the added lives, even though those lives are better than the status quo average. This requires defending a critical level that represents a "good life" rather than merely a "life worth living," a move standard in Critical-Level literature but sensitive to calibration.

  2. **The scenario**
  The Ministry of Social Development in a middle-income nation faces a statutory decision regarding a sovereign wealth fund surplus. Due to legal constraints, these capital reserves cannot be invested in markets or used for general budget relief; they must either remain idle or fund specific demographic initiatives within twenty years. The Ministry proposes a pronatalist package: direct cash transfers and education vouchers for a cohort of 100,000 additional children born to low-income families over the next decade.

  The existing population of ten million citizens is unaffected. The fund surplus is idle, so spending it imposes no opportunity cost on current taxpayers or beneficiaries. No resources are diverted from existing social services. The new children will be raised in households that currently struggle but are stable; the subsidies ensure their lives are materially easier than the current national average. They will face no stigma, suffer no resource deprivation caused by the program, and enjoy lives clearly worth living. However, their expected welfare, while above the national mean, does not reach a threshold of robust flourishing. The decision is binary: execute the program strictly as designed, or leave the fund idle and the cohort unborn. There is no sequence, no future contingency, and no technology beyond current capacity.

  3. **The parameters and the arithmetic**
  We model welfare on a cardinal scale where 0 represents a life not worth living. The status quo population ($N_0$) is 10,000,000 with average welfare ($W_0$) of 50. The added cohort ($N_1$) is 100,000 with expected average welfare ($W_1$) of 60. The Critical Level ($c$) is set at 70.

  | Parameter | Symbol | Value | Note |
  | :--- | :--- | :--- | :--- |
  | Status Quo Pop | $N_0$ | 10,000,000 | Existing citizens |
  | Status Quo Welfare | $W_0$ | 50 | Modest but worth living |
  | Added Pop | $N_1$ | 100,000 | New cohort |
  | Added Welfare | $W_1$ | 60 | Better than $W_0$ |
  | Critical Level | $c$ | 70 | Threshold for "good to create" |

  **Computations:**
  *   **Total Change:** $100,000 \times 60 = +6,000,000$ welfare units.
  *   **Average Change:** New average $\approx 50.1$. Old average $= 50$.
  *   **Critical-Level Change:** $100,000 \times (60 - 70) = -1,000,000$ value units.
  *   **Person-Affecting:** Change to existing $= 0$.

  The critical level assignment is not fiat. Critical-Level theorists often argue $c$ must be positive to avoid the Repugnant Conclusion. Setting $c$ at 70 reflects a judgment that while lives at 60 are worth living, they are not sufficiently good to merit creation when resources are constrained, a standard distinction in non-totalist literature.

  4. **The general inequalities**
  The verdicts depend on the relationship between $W_1$, $W_0$, $c$, and 0. Let $\Delta V$ be the change in value.

  *   **Total Utilitarianism:** Endorses if $\Delta V > 0$. Since $\Delta V = N_1 W_1$, the condition is $W_1 > 0$. Given lives are worth living, this holds.
  *   **Average Utilitarianism:** Endorses if New Average $> W_0$. This simplifies to $W_1 > W_0$. Since the added lives are better than the status quo average, this holds.
  *   **Critical-Level Utilitarianism:** Endorses if $\Delta V > 0$. Since $\Delta V = N_1(W_1 - c)$, the condition is $W_1 > c$. Here, $60 < 70$, so it rejects.
  *   **Person-Affecting View:** Endorses if existing people are better off. Condition: $\Delta W_{existing} > 0$. Since resources are idle, $\Delta W_{existing} = 0$, yielding indifference.

  The divergence arises because $c > W_1 > W_0 > 0$. This ordering is the engine of the case. If $c$ were lower than $W_1$, Critical-Level and Average Utilitarianism would agree. If $W_1$ were lower than $W_0$, Average Utilitarianism would reject. The policy space where pronatalism is debated often sits precisely in this gap: lives better than the current struggle, but not fully flourishing.

  5. **Verdicts and derivations**
  **Total Utilitarianism** sums welfare across all lives. Because the added lives have positive welfare (60), their existence increases the total sum of welfare in the universe. The theory is insensitive to the distribution or the average; it cares only that there is more net good. Since the resources used were idle, no existing welfare is sacrificed. Therefore, Total Utilitarianism unequivocally judges the addition as better. The sheer volume of positive welfare added by the cohort outweighs any concern about their relative standing.

  **Average Utilitarianism** compares the mean welfare of the resulting population to the status quo. Because the added group's average welfare (60) exceeds the existing population's average (50), their inclusion pulls the national average upward. The theory treats the new lives as statistical inputs that raise the overall score. It does not matter that their welfare is below the critical level; what matters is that they are above the current mean. Consequently, Average Utilitarianism judges the addition as better, aligning with Total Utilitarianism despite their usual theoretical antagonism.

  **Critical-Level Utilitarianism** sums the difference between each person's welfare and a fixed critical level. Here, the critical level (70) exceeds the welfare of the added lives (60). Each new life contributes negative value (-10 units) to the critical-level sum, even though their lives are worth living. The theory posits that creating lives below this threshold is bad, regardless of whether they are happy. Because the existing population is unchanged, their contribution to the sum is constant. The net change is negative. Thus, Critical-Level Utilitarianism judges the addition as worse, diverging sharply from both Total and Average views.

  **The Person-Affecting View** restricts moral evaluation to changes in welfare for people who exist independently of the choice. Since the program uses idle funds, no existing citizen is made better or worse off. The new children do not exist in the status quo, so their welfare counts for nothing on this view. There is no subject for whom the outcome is better or worse. Therefore, the view judges the options as neutral or incomparable. It remains indifferent to the addition of happy people if no existing person benefits, highlighting its strict restriction to identifiable subjects.

  6. **What does the work**
  The load-bearing feature is the gap between the added lives' welfare ($W_1$) and the critical level ($c$). Specifically, $c > W_1$. If $c$ were set below 60, Critical-Level Utilitarianism would agree with Total and Average Utilitarianism that the addition is good. The case relies on the Critical-Level theorist committing to a threshold of "good to create" that is higher than "worth living." This is plausible if the status quo is low (50) and the critical level represents robust flourishing (70). Remove this gap by lowering $c$ to 55, and the divergence collapses: all three consequentialist theories would endorse the addition. The case isolates the specific cost Critical-Level Utilitarianism pays to avoid the Repugnant Conclusion: it must sometimes oppose adding lives that are better than average.

  7. **The stress test**
  Modify the scenario: the program also builds community infrastructure used by existing citizens, providing a small welfare benefit ($B$) of 0.05 units per existing person. Total benefit to existing: $10,000,000 \times 0.05 = 500,000$ units. The negative critical-level value of the new cohort remains $-1,000,000$ units.

  **Verdict Movements:**
  *   **Person-Affecting:** Moves from Neutral to **Better**. Existing people gain welfare. This reveals their initial indifference was purely contingent on the "no leakage" constraint, not a judgment on the new lives.
  *   **Critical-Level:** Stays **Worse**. The gain to existing people (500,000) does not offset the critical-level deficit of the new cohort (-1,000,000). This shows CLU weighs the "badness" of sub-critical creation heavily against existing gains.
  *   **Total/Average:** Remain **Better**. The addition still adds positive welfare and raises the average.

  **Revelation:** The Person-Affecting View's initial neutrality was fragile; it flips with any benefit to existing people. Critical-Level Utilitarianism is more robustly opposed to the addition, willing to sacrifice some existing welfare gains to avoid creating sub-critical lives. This distinguishes CLU from PAV: CLU cares about the new lives (negatively), while PAV ignores them entirely.

  8. **Objections from the losers**
  **Critical-Level Utilitarians** will attack the assignment of $c=70$. They might argue that if lives are worth living (60 > 0), the critical level should not exceed them unless there is a specific reason. However, lowering $c$ to avoid this verdict risks the Repugnant Conclusion, where adding vast numbers of barely-worth-living lives becomes obligatory. To maintain their solution to Repugnance, they must accept this verdict. They might argue the case proves their point: we should not subsidize mediocre lives even if they are better than current struggles.

  **Average Utilitarians** have little to object to; the case validates their divergence from CLU. They might argue the scenario is ideal for their view. However, they must accept the Sadistic Conclusion elsewhere (adding miserable people to lower the average can be good if the existing are worse).

  **Person-Affecting Theorists** might claim the case misstates their view by assuming "strict addition" is possible. They often argue that bringing people into existence affects the identity of others (non-identity problem). If identities shift, existing people are affected. However, within the stipulated constraints (idle funds, no resource competition), the "no effect" claim holds. Their objection would be that the view is not meant to guide population size decisions, only policies affecting existing people. This concedes the essay's point: PAV is silent where population policy operates.

  9. **Reservations**
  This case licenses the claim that Average and Critical-Level Utilitarianism are not interchangeable "repairs" to Total Utilitarianism; they yield opposite verdicts in plausible policy spaces. It does not prove Critical-Level Utilitarianism is false, only that it carries a specific cost (opposing some good additions). It does not resolve the Repugnant Conclusion, but shows the trade-off required to avoid it. The argument relies on the defensibility of a positive critical level; if a reader rejects any $c > 0$, the divergence vanishes. The essay should frame this as a feature of the theoretical landscape, not a refutation.
