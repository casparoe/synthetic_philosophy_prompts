answer: |-
  ### Part 1: Candidate Activity Architectures

  1.  **The Tribunal:** Teams act as expert witnesses presenting a case for why the region turned out the way it did, with a jury deciding the most convincing narrative.
      *   *Reject:* This encourages adversarial dismissal of other scales rather than integration; students will try to "win" by proving other teams irrelevant instead of feeling the dependency between scales.
  2.  **The Timeline Wall:** All teams work on a single giant chronological timeline on the wall, negotiating placement of their cards together.
      *   *Reject:* This collapses the distinction between scales too quickly; the specific friction of trying to date undatable structures gets lost in the collaborative shuffle of sticking things on a wall.
  3.  **The Policy Simulation:** Teams act as planning committees for different eras trying to save Carraig Point, using their cards to justify decisions.
      *   *Reject:* Shifts focus to counterfactual planning and agency rather than historical explanation; risks implying history is just about decision-making (event-focused) rather than structural constraint.
  4.  **The Archive Triad:** Teams are isolated archives holding only one type of data; they must write an explanation, then trade information to revise it under strict validation rules.
      *   *Commit:* This isolates the epistemological constraints of each scale, forces the specific friction points (dating, card ownership), and requires integration to succeed.

  ---

  ### Part 2: The Archive Triad — Session Design

  **Session Title:** The Carraig Inquiry
  **Time:** 100 Minutes
  **Students:** 18 (3 Teams of 6)
  **Room:** Movable tables, arranged in three isolated clusters.
  **Materials:** Printed card decks (see below), large sheets of paper, markers, masking tape.

  #### 1. Group Assignments & Identities
  Do not use Braudelian terms. Use these identities:
  *   **Team A (The Chronicle):** You hold records of specific dates, people, decisions, and accidents.
  *   **Team B (The Cycle):** You hold records of trends, prices, demographics, and technological shifts lasting 10–50 years.
  *   **Team C (The Ground):** You hold records of geography, geology, climate, and permanent physical constraints.

  #### 2. The Cards (Verbatim Text)
  *Print these on cardstock. Cut them out. Distribute only the relevant deck to each team initially.*

  **Team A: The Chronicle (Events)**
  1.  **1839 Storm:** "Great Gale of October 1839. Nineteen vessels wrecked in the roads at Carraig Point. Insurance rates spike immediately."
  2.  **1850s Commissioner:** "Harbour Commissioner J. Thorne (1852–1857). Combative personality. Spends five years fighting the railway route proposal. Loses."
  3.  **1911 Scandal:** "Harbour Board Embezzlement exposed. Chairman resigns in disgrace. Public trust in Carraig management collapses."
  4.  **1927 Registry Move:** "Major Shipping Firm 'Northline' moves registry to Kell Down. Cites 'administrative efficiency.' 200 jobs lost."
  5.  **1970s Strike Leader:** "Charismatic dockers' leader leads 1974 strike at Carraig. Media coverage highlights port inefficiency."
  6.  **1861 Railway Vote:** "Board of Directors vote on railway route. Passes by 3 votes to route through Aldergate instead of Carraig."
  7.  **1793 War Declaration:** "War declared with France. Navy requires immediate provisioning."
  8.  **1815 Peace:** "Treaty of Paris signed. Navy provisioning contracts cancelled overnight."

  **Team B: The Cycle (Conjunctures)**
  1.  **1793–1815 Provisioning Boom:** "Navy provisioning triples oat and salt-beef trade. Prices high. Carraig busy."
  2.  **1840s Herring Peak:** "Herring fishery peaks. Massive catch volumes. Processing plants built on coast."
  3.  **1880 Fishery Collapse:** "Herring stocks vanish. Processing plants close. Coast depopulates."
  4.  **1920s Steam Consolidation:** "Coasting trade consolidates into handful of steamship firms. Small ports lose custom."
  5.  **1970s Ferry Shift:** "Shift to ferry-and-lorry transport. Road distance to industrial north matters more than sea access."
  6.  **1860s Railway Age:** "National expansion of rail networks. Inland towns connected to coal fields gain advantage."
  7.  **1950s Road Building:** "National investment in trunk roads. Aldergate becomes junction hub."
  8.  **19th Century Urbanization:** "General shift of population from coast to inland industrial centers."

  **Team C: The Ground (Longue Durée)**
  1.  **Shifting Sandbar:** "Treth mouth has shifting sandbar. Only admits deep-draft ships on spring tides."
  2.  **Prevailing Westerlies:** "Wind direction means inbound sailing ships must beat upwind into Carraig's approach."
  3.  **Kell Down Advantage:** "Rival harbour Kell Down (25 miles south) is a downwind run. Easier access."
  4.  **Acid Soil:** "Hinterland is thin acid soil on granite. Good for oats and sheep, no heavy agriculture."
  5.  **No Local Coal:** "No coal measures under Carraig/Aldergate hinterland."
  6.  **Distant Coal:** "Coal seams lie 40 miles inland on the far side of a ridge."
  7.  **Tidal Range:** "Estuary has large tidal range. Cargo can't be worked at low water unless you build wet docks."
  8.  **The Ridge:** "High ridge separates coastal plain from inland coal fields. Expensive to tunnel."

  **Shared Pool (Place in center of room)**
  1.  **Deforestation Card:** "Hinterland deforestation. Partly caused by datable shipbuilding contracts (1790–1815), partly by centuries of soil exhaustion and fuel needs."
  2.  **Silting Report:** "Estuary silting rates. Gradual accumulation of sand at the bar. No specific date of 'completion'."

  #### 3. The Rules of Engagement

  **Objective:** Produce a single written explanation (max 1 page) that explains why Carraig declined, Aldergate grew, and Kell Down survived.

  **Constraint 1: The Dating Tax**
  To include any causal link in your final explanation, **every node in the chain must have a specific year attached.**
  *   *Example:* You cannot say "The sandbar caused decline." You must say "The sandbar caused decline in [YEAR]."
  *   *Penalty:* If you assign a year to a card that has no year, you must mark it with an asterisk (*). During cross-examination, any team can challenge an asterisk. If you cannot defend the date with evidence from another team's deck, you lose the right to use that link.

  **Constraint 2: The Trade Protocol**
  You may not look at other teams' cards. You may only request information.
  *   **Request:** "Team A, do you have evidence for silting in 1850?"
  *   **Cost:** To make a request, you must give up one of your own cards to the requesting team's discard pile.
  *   **Shared Pool:** The Shared Pool cards are free to take, but once taken, they are gone. If two teams reach for the same card, they must negotiate a split usage or play Rock-Paper-Scissors.

  **Constraint 3: Validation**
  Your final explanation must cite at least one card from each of the three decks (Chronicle, Cycle, Ground).

  #### 4. Minute-by-Minute Timeline

  **00:00 – 00:05 | Introduction**
  *   Hand out the Outcome Sheet (Carraig declines, Aldergate grows, Kell Down middling).
  *   Assign teams. Hand out decks.
  *   Read Rules. Emphasize the **Dating Tax**.

  **00:05 – 00:25 | Phase 1: Isolation**
  *   Teams read their cards.
  *   Teams draft a preliminary explanation using *only* their own cards.
  *   *Instructor Role:* Circulate. Ensure Team C (Ground) is trying to date their undatable cards. Do not help them. Let them struggle.

  **00:25 – 00:55 | Phase 2: The Market**
  *   Teams may now trade.
  *   Team C will realize they cannot meet the Dating Tax without Team A's help.
  *   Team A will realize their events make no sense without Team B's context.
  *   *Critical Moment:* The Shared Pool cards (Deforestation/Silting) will be claimed. Watch who grabs the Deforestation card.
  *   *Instructor Role:* Announce "15 minutes remaining" in this phase. Increase pressure.

  **00:55 – 01:15 | Phase 3: Synthesis**
  *   Teams finalize their written explanation.
  *   They must mark any asterisked dates.
  *   They must prepare one spokesperson to read the explanation aloud.

  **01:15 – 01:40 | Phase 4: Cross-Examination & Debrief**
  *   Each team reads their explanation (3 mins each).
  *   Open floor for challenges on asterisked dates (5 mins).
  *   **The Reveal:** Introduce the terms *Événement*, *Conjoncture*, *Longue Durée*.
  *   Guided discussion (see below).

  #### 5. Incentive Structure
  *   **The "Historian's Seal":** The instructor holds three stamps (or drawn stars).
  *   **Criteria:**
      1.  **Coherence:** Does the story hang together?
      2.  **Integration:** Did they successfully trade and use all three decks?
      3.  **Honesty:** Did they acknowledge where their dates were guesses (asterisks)?
  *   **Reward:** The team with the most stars chooses the topic for the next seminar's opening discussion. (Low stakes, but creates pride).

  #### 6. Troubleshooting & Predictive Failures

  **Problem 1: Team A (Events) feels cheated.**
  *   *Symptom:* They argue that without the storm or the scandal, nothing happens. They feel the "Ground" team is lazy for not having dates.
  *   *Intervention:* Do not soothe them. In the debrief, highlight their frustration. "You felt the history was in the decisions. Why couldn't you prove it?" This *is* the lesson on the limits of event-history.

  **Problem 2: Team C (Ground) gets smug/deterministic.**
  *   *Symptom:* They claim the outcome was inevitable because of the sandbar and coal. They treat the 1861 vote as irrelevant.
  *   *Intervention:* During cross-examination, ask Team A to read the 1861 Vote card. Ask Team C: "If the vote went the other way, does your sandbar matter?" Force them to admit geography sets the stage, but doesn't write the script.

  **Problem 3: The Deforestation Card Fight.**
  *   *Symptom:* Two teams grab it simultaneously.
  *   *Intervention:* Enforce the negotiation rule. If they can't agree, the card goes back to the pool and neither can use it. This teaches that evidence sometimes remains unused if frameworks don't align.

  **Problem 4: The Silting Date.**
  *   *Symptom:* Team C picks "1850" arbitrarily. Team A challenges it.
  *   *Intervention:* Let the challenge stand. If Team C cannot defend it, they must remove the link. This demonstrates the cost of forcing structural processes into event-based timelines.

  #### 7. Debrief Questions (Mapping Game to Theory)

  1.  **To Team C (Ground):** "You were forced to put a year on the silting bar to win the game. How did that feel? Did it make your explanation stronger or weaker?"
      *   *Target:* Reveals the violence of imposing event-time on structural time.
  2.  **To Team A (Events):** "You had all the specific dates. Why couldn't you explain the 200-year trend on your own?"
      *   *Target:* Reveals the 'foam on the wave' problem; events lack momentum without context.
  3.  **To Team B (Cycle):** "The 1861 Railway card mentioned a vote (3 votes) and a ridge (geology). Which team claimed that card? Why?"
      *   *Target:* Highlights the conjuncture as the meeting point of decision and structure.
  4.  **To All:** "Who owned the Deforestation card? Why was it hard to place?"
      *   *Target:* Shows how human action and environmental exhaustion intertwine across scales.
  5.  **The Reveal:** "You just argued using Braudel's three timescales. Team A was *Événement*. Team B was *Conjoncture*. Team C was *Longue Durée*."

  #### 8. Limitations of the Activity (Instructor Note)

  You must supply these caveats yourself in the final 5 minutes, as the game mechanics cannot reproduce them:

  1.  **Pre-Sorted Scales:** In the game, I handed you the scales pre-sorted (Team A, B, C). In real historiography, the historian must *choose* the scale of analysis and defend that choice. Braudel's innovation was not just having these layers, but insisting they be studied *simultaneously* by one mind, not three teams.
  2.  **Determinism vs. Possibility:** The game mechanics pushed Team C toward determinism (geography = fate). Braudel did not believe geography made history inevitable, only that it set the limits of the possible. The 1861 vote card was there to show human agency still matters within constraints, but the game scoring may have undervalued that agency.
  3.  **The "Total History" Goal:** Braudel wanted these layers to merge into a *histoire totale*. In this game, you remained separate teams who traded. The real work is dissolving the boundaries, not just trading cards across them.

  ---

  ### Instructor Prep Checklist
  *   [ ] Print 3 decks (A, B, C) + 2 Shared Cards.
  *   [ ] Print 18 Outcome Sheets.
  *   [ ] Prepare 3 large sheets of paper and markers for each table.
  *   [ ] Set room: 3 distinct table clusters, far apart.
  *   [ ] Timer visible to you (not necessarily students).
  *   [ ] Do not mention Braudel, Annales, or timescales until minute 75.
