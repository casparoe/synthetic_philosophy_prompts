answer: |-
  Dear Friend,

  The horror of the Charles Whitman case lies not only in the blood spilled on the Texas campus but in the quiet desperation of the note he left behind, a plea for understanding that implicated his own biology before he had even climbed the tower. You have asked me to weigh this tragedy against the scales of the Dennett–Caruso dispute, using your stipulated distinction between tumor-sensitive and tumor-invariant theories of responsibility. It is a sharp lens through which to view the problem, and I find myself largely agreeing with your suspicion, though I believe the light it casts reveals shadows on both sides of the aisle. To begin with, we must settle how each philosopher fits your definition. Daniel Dennett's compatibilism is indeed tumor-sensitive because his theory grounds responsibility in the possession of certain capacities, such as reasons-responsiveness and self-control. In a standard case, Dennett argues we are responsible because we possess these capacities, but if a glioblastoma compresses the amygdala and dismantles that control, the theory's verdict on the agent changes. The tumor moves Whitman from the category of responsible agent to the category of exempted patient. Gregg Caruso's free will skepticism, conversely, is tumor-invariant regarding the agent's status. For Caruso, no one is ever morally responsible in the basic desert sense, regardless of their neural architecture. The tumor does not change the verdict that Whitman does not deserve blame, though it rightly changes our response, shifting us from retribution to quarantine and medical treatment. Thus, your initial mapping holds firm.

  The question you pose is whether Dennett's sensitivity is a liability, and here the Whitman episode serves as a brutal stress test. The liability emerges when we consider what Dennett's sensitivity implies about the counterfactual world where Whitman had no tumor. If the tumor is what negates responsibility, then the implication is that a neurotypical brain committing the same act would be truly responsible. This exposes compatibilism to the charge of arbitrariness, for the difference between a brain tumor and normal neurochemistry is ultimately a matter of luck. If Whitman's violent impulses were caused by a lesion, he is exempt; if they were caused by the deterministic interplay of genetics and environment without a distinct lesion, he is liable. By making responsibility sensitive to the presence of a tumor, Dennett concedes that biological determinism exculpates only when it is pathological, not when it is ordinary. In the shadow of the tower, this looks like a weakness. It suggests that responsibility is not a deep metaphysical fact but a pragmatic label we apply only when the causal chains are familiar to us. The tumor makes the determinism visible, and Dennett's theory bends to accommodate it, but in doing so, it highlights the fragility of the control he claims exists in the non-tumor cases. The sensitivity is a liability because it admits that the only thing standing between Whitman and full moral condemnation is the location of the damage, not the presence of causation itself.

  Caruso's invariance avoids this specific pitfall, yet it is not without its own descriptive costs. Because Caruso's view is invariant, he must say that Whitman was not a fitting object of blame even before the tumor was discovered, and indeed even if no tumor had been found. While this maintains logical consistency, it risks misdescribing the phenomenological tragedy of the case. There is a profound difference between a person who chooses evil and a person whose capacity for choice was usurped by a growth. Dennett's sensitivity captures this loss of self; he can say Whitman was not himself in those final hours. Caruso must say that Whitman was never himself in the sense required for desert responsibility. In this way, Caruso's account goes silent on the specific horror of the tumor itself. It treats the glioblastoma as just another causal factor in a universe of causal factors, flattening the distinction between disease and disposition. While this protects the theory from the arbitrariness charge, it fails to honor Whitman's own intuition, expressed in his note, that something had gone wrong with him specifically. Caruso saves the theory from liability but at the cost of erasing the nuance of agency loss that the tumor represents.

  When we consider the moment after the police killed Whitman, the practical divergence between the two views collapses, yet the theoretical divergence remains stark. Punishment is unavailable, so the forward-looking justification for restraint moots itself. What is left is the retrospective judgment. Dennett's theory licenses us to say that Whitman was not blameworthy due to the impairment, validating the intuition that he was a victim of his biology. Caruso licenses us to say that Whitman was not blameworthy because no one is, rendering the tumor evidentially interesting but morally redundant. Here is where your suspicion finds its strongest footing. Dennett's sensitivity forces him to draw a line in the sand of neural pathology that determines moral status, a line that seems increasingly arbitrary as neuroscience advances. If we find that all violent impulses have biological correlates, Dennett's sensitive theory risks collapsing into Caruso's invariant one anyway. The tumor is merely the wedge that opens the door to this realization. By being sensitive to the tumor, Dennett acknowledges that biology can negate responsibility, which invites the skeptical question of why biology ever permits it.

  Ultimately, the episode bears out your suspicion that the sensitivity is a liability, though perhaps not for the reasons one might initially think. It is not that Dennett fails to exculpate Whitman; he succeeds there. The liability is that his success depends on a distinction that cannot bear the weight of scientific scrutiny. The tumor shows us that the self is physical, and if the physical self is damaged, responsibility vanishes. But if the self is physical, then the undamaged self is also merely physical, subject to the same causal laws. Dennett's tumor-sensitive compatibilism tries to have it both ways, preserving responsibility for the healthy while exempting the sick, but the Whitman case demonstrates that the healthy and the sick are on a continuum of causal determination. Caruso's tumor-invariant skepticism is more robust here because it does not rely on that continuum breaking at the point of pathology. However, we must acknowledge that Caruso's victory is pyrrhic. He avoids the liability of arbitrariness only by abandoning the distinction between the person who loses their mind and the person who keeps it. In the end, Whitman's note asks for his brain to be examined because he sensed he was no longer the author of his actions. Dennett agrees with him but cannot explain why the authorship was real before the tumor. Caruso agrees that the authorship was never real but cannot explain why the tumor feels like a theft. Your suspicion holds: Dennett's sensitivity exposes the fault line in compatibilism, while Caruso's invariance papers over it with a consistency that feels coldly accurate. I remain, as ever, yours in thought.
