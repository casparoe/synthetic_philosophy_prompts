  In the small hours of August 1, 1966, Charles Whitman stabbed his mother and his wife to death, having first typed a note asking that his brain be examined once he was dead; he then shot fourteen people in and around the University of Texas Main Building over the next ninety-odd minutes before police killed him. The autopsy found a glioblastoma pressing on tissue near his amygdala, and experts have argued ever since about whether it had anything to do with what he did. In the months beforehand he had complained to a campus counsellor of violent impulses he could neither explain nor control.

  Take that episode through the Dennett–Caruso dispute over just deserts, organized around a distinction I will stipulate: a theory of responsibility is tumor-sensitive if a lesion like Whitman's changes what the theory says about the agent, and tumor-invariant if a lesion can only change what the theory says about our response. My suspicion is that Caruso's skepticism is tumor-invariant and Dennett's compatibilism tumor-sensitive, and that here the sensitivity is a liability rather than a virtue. Test it. What does each view license us to say about Whitman — was he a fitting object of blame, what work does the tumor do or fail to do, and what is left for either theory once he is dead on the tower floor and punishment is simply unavailable? Where do the two verdicts genuinely diverge, where does each account go silent or misdescribe the case, and does the episode bear out my suspicion?

  Please answer in continuous prose, as one would write a letter — no headings, bullet points, bold text, or tables.
