              *   *Status:* **Reject.** This is the critical philosophical error. The NIP is designed to show the *failure* of the Person-Affecting Restriction.
          *   *Claim:* "If wrongness has to be tied to how things go for particular people, then we can say the girl's choice was wrong because it went worse for her child than it needed to."
              *   *Status:* **Reject.** Contradicts the definition of PAR. Under PAR, it did *not* go worse for *this* child (compared to non-existence).
