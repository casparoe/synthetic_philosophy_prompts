              *   *Status:* **Reject.** She wasn't denied that life; that life belongs to a *different* possible person. She cannot point to it as *her* alternative.
          *   *Claim:* "So the restriction resolves the problem rather than creating it."
              *   *Status:* **Reject.** The restriction *is* the source of the problem (it implies the act is permissible).

