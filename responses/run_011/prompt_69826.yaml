answer: |-
  Here are ten questions drafted for the session, designed to prevent restatement and target the specific vulnerabilities of learning-based teleosemantics. Each includes the speaker's likely defense and a follow-up to keep the pressure on.

  ### The Questions

  **1. The Input Problem (Circularity)**
  "To individuate the 'proper function' of a consumer state, you need to specify what input it is supposed to receive. But specifying the input seems to require knowing what that input *means* (its content). If you define the function by the content, you're circular; if you define it purely causally, the set of causes is too broad to fix specific content. How do you individuate the proper function without already presupposing the semantic facts you're trying to naturalize?"
  *   **Likely Reply:** "We individuate functions by causal-historical roles, not semantic ones. We look at the selection history of the mechanism, not the meaning of the signal."
  *   **Follow-up:** "But the causal history is infinite. What principle selects the *relevant* slice of history that constitutes the function? Isn't that principle of relevance itself determined by what the system is *about*?"

  **2. Conflicting Consumers**
  "Consider a neural state that feeds into two downstream consumers with conflicting success conditions—one triggers avoidance (predator detection), the other triggers approach (mating opportunity). Both have been reinforced in different contexts. Which consumer's proper function fixes the content of the upstream state? If it's a weighted average, does the content shift dynamically as the weights change?"
  *   **Likely Reply:** "Content is determined by the 'dominant' consumer or the normal conditions of the system. We look at the design of the architecture."
  *   **Follow-up:** "In a learning system, 'design' is plastic. If the weighting shifts based on new reinforcement, are you saying the *concept* itself changes every time the agent's motivational priorities shift? That makes content incredibly unstable."

  **3. The RL Redundancy Challenge (For the Neuro/Psych Contingent)**
  "There's a doctoral candidate in reinforcement learning in the second row who wants to know: In TD-learning, the reward prediction error *is* the normative signal. It tells the system what to keep and what to discard. What explanatory work is 'proper function' doing here that isn't already done by the error signal? Is 'teleosemantics' anything more than a philosophical redescription of 'shaped by reward'?"
  *   **Likely Reply:** "The error signal explains *how* the learning happens, but proper function explains *why* that signal is normative. It grounds the 'ought' in biological history."
  *   **Follow-up:** "But if the 'ought' is just 'maximize cumulative reward,' then truth collapses into utility. If a false belief maximizes reward better than a true one, your theory says the false belief is the 'correct' one. Can you accommodate truth-normativity distinct from fitness-normativity?"

  **4. Non-Reinforced Beliefs (Testimony and Arithmetic)**
  "I believe Paris exists, but I've never been there and received no direct reinforcement for that belief. I believe 2+2=4, which has no differential survival value in my personal history. How does *my* reinforcement history fix the content of states that are decoupled from direct payoff? Do these beliefs borrow content from others, and if so, where does the buck stop?"
  *   **Likely Reply:** "They derive content inferentially from other states that *do* cash out in reward. They are part of a holistic network."
  *   **Follow-up:** "How many inferential steps removed can a belief be before the 'semantic cash' runs out? And if the content depends on the network, doesn't that make the content of 'Paris' dependent on my specific network, leading back to the publicity problem?"

  **5. Publicity and Disagreement**
  "If content is fixed by *my* specific learning history, and yours differs, do we strictly share the concept 'justice' or 'dog'? If not, when we argue, are we just talking past each other? If yes, what does the 'sharing' consist in if the grounding conditions are idiosyncratic to the individual?"
  *   **Likely Reply:** "We share concepts because our learning histories overlap sufficiently in a shared environment. We don't need identity, just sufficient similarity."
  *   **Follow-up:** "'Sufficient' is doing a lot of work there. In polarized epistemic bubbles, histories diverge radically. Does your theory imply that people in different bubbles literally cannot disagree because they lack shared content?"

  **6. Truth vs. Utility (The Normativity Gap)**
  "Reinforcement selects for fitness, not truth. A useful fiction (e.g., an overactive threat detector) gets reinforced more strongly than a nuanced truth. When the two come apart, does your theory assign the content of the truth or the content of the useful fiction? If the latter, you haven't naturalized truth conditions, just utility conditions."
  *   **Likely Reply:** "True representations are generally more robustly useful in the long run. The system is tuned to the structure of the world."
  *   **Follow-up:** "'Generally' allows for exceptions. In those specific exceptions where falsehood is more useful, does your theory say the agent is misrepresenting the world, or representing it accurately as 'something-to-be-avoided'? If the latter, you've lost objective reference."

  **7. Swampman Latency**
  "You argue Swampman starts contentless and fills in fast. But until the first reward signal arrives, he behaves exactly like a contentful agent. What is the metaphysical difference between him and a normal agent in that first hour? If there's no behavioral difference, is the 'history' requirement doing any work other than satisfying an intuition?"
  *   **Likely Reply:** "The difference is potential. He has the *capacity* to acquire content immediately, but hasn't met the historical conditions yet."
  *   **Follow-up:** "If the capacity is identical and the behavior is identical, positing a metaphysical lack of content seems to make content epiphenomenal. Why posit a difference that makes no difference to the explanation of his behavior?"

  **8. The 'Do the Psychology' Dodge**
  "When pressed on the disjunction problem, you often reply that 'we haven't done the psychology yet.' But isn't that deferring the philosophical heavy lifting? The philosopher's job is to specify what *kind* of fact the psychology would find. Are you offering a constitutive account of content, or just a promise that one exists?"
  *   **Likely Reply:** "Philosophy can't dictate empirical facts. I'm outlining the structure the explanation must take."
  *   **Follow-up:** "Agreed, but you haven't specified the structure sufficiently to rule out competing accounts. If the structure is just 'look for the reinforcement history,' that's compatible with non-teleological accounts. What constraint does 'teleo-' add?"

  **9. Environmental Mismatch**
  "Your view relies on tuning to conditions. But humans often operate in environments radically different from those they were tuned in (e.g., modern urban settings vs. ancestral or childhood environments). When a state is tokened in a mismatch environment, is it misrepresenting, or functioning properly in a bad context? How do you distinguish the two without referencing truth conditions you're trying to define?"
  *   **Likely Reply:** "It's functioning properly but in error. The content is fixed by the tuning environment, not the current one."
  *   **Follow-up:** "But for a learning-based view, the 'tuning environment' is the individual's past. If my past was a video game and now I'm in a war zone, is my content fixed by the game? That seems to make content radically unmoored from current reality."

  **10. Granularity and Indeterminacy**
  "Reinforcement is coarse-grained; content seems fine-grained. A reward might reinforce 'food' generally, but I have concepts for 'apple,' 'granny smith,' and 'rotten apple.' How does a scalar reward signal fix content at that level of granularity without an infinite regress of selectors?"
  *   **Likely Reply:** "The granularity comes from the discriminative capacities of the sensory system, constrained by the reward."
  *   **Follow-up:** "But the sensory system can discriminate infinitely many shades. What stops the content from being 'shade of red #4432' versus 'red'? If reward doesn't pick, what does?"

  ***

  ### The Cruxes (Must Ask)

  If the clock is tight, these are the two questions where a bad answer undermines the entire theoretical framework.

  **1. Question #3 (The RL Redundancy Challenge)**
  *   **Why it's a crux:** This targets the *motivation* for the theory. If "proper function" is merely a philosophical gloss on "reward prediction error," then the theory offers no explanatory advantage over standard computational neuroscience. For the half of your audience in psych/neuro, this is the dealbreaker. If she cannot articulate what the "teleo-" adds to the "semantics" beyond a label, the naturalization project becomes obsolete.
  *   **Risk:** If she admits it's just a redescription, the philosophy is dead. If she insists it adds normativity but fails to distinguish truth from utility (see Q6), the naturalization fails.

  **2. Question #1 (The Input Problem/Circularity)**
  *   **Why it's a crux:** This targets the *coherence* of the theory. Teleosemantics lives or dies on its ability to individuate functions non-semantically. If she cannot explain how we pick out the "proper function" of a consumer without implicitly referencing the content that function is supposed to serve, the account is viciously circular. It presupposes the very intentional facts it claims to reduce.
  *   **Risk:** A vague appeal to "causal history" is the standard weak point. If she can't specify the selection principle for that history, the theory is vacuous.

  ***

  ### Ranking the Rest (Drop Priority)

  If time runs short, drop questions in this order (from first to drop to last to drop):

  1.  **Drop First: Q7 (Swampman Latency).** *Metaphysical intuition pumping.* While fun, the "Swampman" debate is often a stalemate of intuitions. It doesn't damage the mechanics of the theory as much as the other questions.
  2.  **Drop Second: Q10 (Granularity).** *Technical detail.* Important, but if she waffles here, it looks like a gap in the model rather than a fatal flaw. It's a "how does it work?" question rather than a "does it work?" question.
  3.  **Drop Third: Q9 (Environmental Mismatch).** *Specific case.* Similar to Q7, this is an edge case application. It pressures the theory, but she can likely accommodate it with a "tuning environment" distinction.
  4.  **Drop Fourth: Q8 (The 'Do the Psychology' Dodge).** *Meta-philosophical.* Important for rigor, but if she commits to doing the psychology, the audience might let it slide. It's a methodological critique, not a direct hit on the content.
  5.  **Keep High: Q6 (Truth vs. Utility).** *Normativity.* This is nearly as important as the Cruxes. If teleosemantics can't distinguish true beliefs from useful falsehoods, it fails to explain representation.
  6.  **Keep High: Q4 (Non-Reinforced Beliefs).** *Scope.* If the theory can't handle testimony or math, its scope is too narrow to be a general theory of content.
  7.  **Keep High: Q5 (Publicity).** *Social dimension.* Crucial for the philosophy grad students. If content is private, communication is impossible.
  8.  **Keep High: Q2 (Conflicting Consumers).** *Mechanism.* This puts pressure on the internal coherence of the consumer-based account.

  **Strategy:** If you have time for only four questions total, ask **Q1, Q3, Q6, and Q4**. This covers Circularity, Redundancy, Normativity, and Scope—the four pillars holding up her view.
