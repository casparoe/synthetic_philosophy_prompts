answer: |-
  (a) **Exam Question**

  **Module:** Metaphysics of Modality (Final Year Seminar)
  **Assessment:** Final Examination
  **Time Allowed:** 2 Hours
  **Question 1 (20 Marks)**

  **Instructions:** Answer the following question. Write no more than 1,200 words.

  **Case File:**
  *   **Case One (Aggregation):** A mother produces two eggs in one cycle, each fertilised by a different sperm from the same father. Before implantation, the two early embryos aggregate and develop as a single organism. The resulting person contains two intermingled, genetically distinct cell lines.
  *   **Case Two (Mitochondrial Replacement):** Nuclear material from a mother's egg is transferred into a second woman's enucleated egg. This reconstructed egg is fertilised by the father's sperm. The child's nuclear genome comes from the mother and father, but the mitochondrial genome and some cytoplasm come from the donor.
  *   **Case Three (Gradual Replacement):** At the two-cell stage, one cell of an embryo is removed and replaced by a cell from a second embryo created from a completely different gamete pair. This substitution is repeated at every subsequent division. The developmental process is continuous, but the material provenance is progressively exchanged until no original material remains.

  **Essay Question:**
  Using the three cases above, evaluate the thesis of the Necessity of Origin (that a person could not have come from a different sperm and egg than the ones they in fact came from).

  You must either: (i) state the most defensible precisification of the relation of *coming-from* that remains consistent across all three cases, or (ii) argue that no such precisification exists.

  Furthermore, you must explain what philosophical work, if any, remains for the thesis given your conclusion. In particular, assess whether retreating to identifying the origin with the *zygote* or with the *continuous developmental process* rather than the specific *gamete pair* still supports the *de re* necessity claims and the account of cross-world identity that motivated the thesis in the first place.

  ***

  (b) **Model Answer**

  The Necessity of Origin (NoO) is traditionally motivated by the intuition that a person is essentially tied to their specific biological beginnings. However, the stipulated cases demonstrate that defining "origin" as a specific pair of gametes is biologically fragile. To salvage the thesis, we must retreat from a *material* conception of origin to a *causal-structural* one. Specifically, the defensible precisification is that a person originates from the *initial unified developmental process* that leads to their maturity, regardless of the specific micro-constituents involved.

  Case One (Aggregation) presents an immediate challenge to the "unique gamete pair" view. Here, one person arises from two zygotic events. If origin were strictly the gamete pair, this person would have two origins, or perhaps no single origin. The essentialist cannot claim this person is two people, as they function as one organism. Therefore, the origin must be located not in the gametes themselves, but in the *fusion event* that created the single developmental trajectory. The essentialist owes us an account of how two causal chains merge into one essential history. The most defensible view is that the origin is the point at which the developmental process becomes unique to that individual. In aggregation, this is post-fusion. Thus, the person could not have come from a different *fusion event*, but the gametic input is merely contingent material for that event.

  Case Two (Mitochondrial Replacement) tests the tolerance of material constitution. If the egg is defined by its nucleus, the child originates from the mother. If defined by cytoplasm, the origin is shared with the donor. A strict materialist NoO fails here, as it cannot distinguish which matter is essential. However, if we adopt the causal-structural view, the nuclear DNA provides the primary structural blueprint for the organism's development. The cytoplasm is the vessel, not the architect. Thus, the child originates from the mother's egg *conceptually*, even if materially hybrid. This avoids the sorites risk mentioned in the prompt: small alterations to the cytoplasm do not alter the structural blueprint. We can maintain a tolerance principle for the "vessel" while holding the "blueprint" as necessary. This preserves the intuition that the child is essentially the offspring of the nuclear parents.

  Case Three (Gradual Replacement) is the most damaging to material essentialism. If we swap cells one by one, a strict materialist must identify an arbitrary cutoff where the origin changes, or admit that the final person shares nothing with the original origin. The causal-structural view avoids this by prioritizing *continuity of process* over *continuity of matter*. As long as the developmental instructions (the genetic code and the regulatory environment) maintain functional continuity, the origin remains the same. The "origin" is the initiation of that specific program. In Case Three, if the replacement cells carry different genetic instructions, the developmental program is hijacked. If the replacement cells are instructed to follow the original program, the origin remains the initial zygote's plan. However, if the genetic material itself is swapped (as implied by "different gamete pair"), the developmental program changes. In this specific scenario, the causal-structural view must concede that the origin *does* change, but not at an arbitrary material cutoff. It changes when the *guiding information* is wholly supplanted.

  Does this retreat save the philosophical work of NoO? The original motivation for NoO was to ground *de re* necessity and cross-world identity: to say "I could not have been born of different parents." If we redefine origin as the "initial developmental process," the thesis becomes: "I could not have arisen from a different initial causal process." This is logically robust but dialectically weaker. It no longer guarantees that *these specific parents* were necessary, only that *a process sufficiently similar to this one* was necessary. In Case Two, the "mother" is biologically ambiguous. In Case One, the "parents" provided double the material.

  Consequently, while the thesis survives as a constraint on cross-world identity (you cannot exist in a world where the causal process initiating you does not occur), it loses its power to fix parental identity across worlds. The *de re* claim shifts from "necessarily child of X and Y" to "necessarily product of process P." This is sufficient to block the idea that you could have been a completely different kind of being, but it fails to secure the deep intuition that your specific biological lineage is metaphysically fixed. The NoO survives, but it is a thinner, more structural thesis than the robust biological essentialism often advertised. It secures identity against total replacement, but admits vagueness regarding the specific material constituents of that identity.

  ***

  (c) **Marking Scheme**

  | Criterion | Marks | Characteristic Mishandling by a Fluent but Unremarkable Answer |
  | :--- | :---: | :--- |
  | **1. Analysis of Case One (Aggregation)** | 4 | Treats the chimera as simply "two people" or ignores the fusion problem, failing to adjust the definition of origin. |
  | **2. Analysis of Case Two (Mitochondrial)** | 4 | Applies a rigid "all matter is essential" rule that breaks under the tolerance principle, or ignores the nucleus/cytoplasm distinction. |
  | **3. Analysis of Case Three (Gradual Swap)** | 4 | Posits an arbitrary cutoff point for identity without justification, or denies the possibility of the swap entirely. |
  | **4. Precisification of "Coming-From"** | 4 | Restates the standard "gamete pair" definition despite the cases showing its inadequacy, rather than proposing a structural/process alternative. |
  | **5. Evaluation of Philosophical Work** | 4 | Concludes that the thesis is either "completely saved" or "completely dead" without analyzing the shift from parental necessity to process necessity. |
  | **Total** | **20** | |

  ***

  (d) **Sophisticated but Low Pass Answers**

  **1. The "Name-Drop" Answer**
  *   **Description:** The student writes fluently about Kripke's *Naming and Necessity*, Lewis's counterpart theory, and Mackie's objections, using correct terminology throughout.
  *   **Reason for Cap:** The answer relies entirely on external scholarly memory rather than engaging with the specific biological constraints of the three stipulated cases. It treats the cases as mere illustrations for pre-learned theories rather than problems that require novel precisification.

  **2. The "Ethical Diversion" Answer**
  *   **Description:** The student argues persuasively that Case Two and Case Three involve unethical medical interventions and that therefore the resulting persons "should not count" as natural origins, resolving the metaphysical tension by appealing to moral norms.
  *   **Reason for Cap:** The question asks for a metaphysical account of identity and *de re* necessity, not a bioethical evaluation. Resolving a modal problem by appealing to moral impermissibility is a category error that fails to address the ontological question.
