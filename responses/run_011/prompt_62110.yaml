      Make sure the "Policy Utility" is high up, because the Director and the Institute care about sustainability/policy.
      Ensure the "Variables" objection hits the Modeler/Economist points.

      *Re-evaluating the "Hope Nobody Asks":* The prompt says "you will have a view about what that is from the material above." The material highlights the "knowledge loss" as the thing resilience science has no category for. The vulnerability is: If resilience science has no category for it, how do you study it scientifically?
      *Actually, the biggest vulnerability is the Director.* The Director wrote a book saying Maya = Overshoot. I am saying Maya != Overshoot (it's legitimacy). The Director might ask: "If I take away the resource constraint, what is your mechanism?"
      *Let's go with the Prediction/Early Warning question.* It strikes at the heart of Earth-system science (prediction/management).

      *Final check on Preemptive Concessions:* Conceding the "variables" issue is smart. Conceding the "normative" issue is smart. Conceding the "analogy" issue is dangerous (undermines the talk). I should concede that the *direct* analogy is weak, but the *mechanism* is valuable.

      *Let's finalize the list.*
