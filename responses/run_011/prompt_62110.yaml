      *   **Audience Mindset:** Archaeological record = analogies for present-day risk.
      *   **Speaker's Thesis:** "Collapse" commits a unit error. Distinguishes Complexity, Legitimation, and Demographic collapse. Sequence is usually Legitimation -> Complexity, Demographic is often absent/overstated (Maya, Rapa Nui examples). Polities don't die; people die or institutions fail to transmit. Irreversible loss is *knowledge* (writing, astronomy), which resilience science ignores because regime shifts are value-neutral.
      *   **Task:** Prepare for the 20-minute discussion.
      *   **Deliverables:**
          1.  ~8 objections ordered by damage potential and likelihood (in audience idiom).
          2.  90-second replies for each (concede/hold/soft spot).
