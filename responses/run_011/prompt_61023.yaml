answer: |-
  1. **Requirements for an Adequate Account**

      1.  **The Commensurability Protocol.** The theory must specify the currency in which formal violations and semantic violations are traded. It must state whether a broken rhyme is equivalent to a changed adjective, a falsified proposition, or a shifted register.
          *   *Motivating Case:* A translator preserves the trisyllabic count and rhyme scheme but changes "get well soon" to "die soon" to secure a rhyme. A competing translator keeps "get well soon" but writes in free verse. A theory without a commensurability protocol cannot declare one "better"; it can only describe them as "different." To adjudicate, it must claim that preserving the rhyme scheme is worth *more* than preserving the propositional content, or vice versa.
      2.  **The Phonological Scarcity Adjustment.** The theory must weight formal constraints by the phonological resources of the target language. A penalty for missing a rhyme must be higher in a rhyme-rich language (Italian) than in a rhyme-poor language (English).
          *   *Motivating Case:* An English translator fails to rhyme "orange." An Italian translator fails to rhyme "amore." A theory that penalizes these failures equally ignores the empirical fact that the English translator faced a combinatorial impossibility while the Italian faced a choice. Equal penalty implies equal laziness, which is factually wrong.
      3.  **The Register Stability Clause.** The theory must penalize formal success that induces a register shift alien to the original. If adhering to the meter makes the poem sound like a nursery rhyme when the original was courtly banter, the theory must count this as a loss, not a gain.
          *   *Motivating Case:* A translator achieves perfect trisyllabic couplets in English, but the result sounds sing-songy and childish. The original Marot was witty and light, not juvenile. A theory that scores this translation higher than a free-verse version that captures the wit but loses the meter privileges structure over effect, contradicting the pragmatic goal of communication.
      4.  **The Local Actionability Heuristic.** The theory must provide a decision rule for local impasses. It cannot simply evaluate finished products; it must guide the choice at the moment of composition.
          *   *Motivating Case:* A translator is on line 14. They have the sense, but cannot find the rhyme without distorting the meaning. They need to know *now* whether to break the rhyme or break the meaning. A theory that says "it depends on the overall effect" is useless at the line level. A theory that says "always break the rhyme" is actionable but dogmatic.
      5.  **The Identity Threshold.** The theory must define the minimum structural retention required for the output to count as a translation of *this* poem rather than an imitation or homage.
          *   *Motivating Case:* A version keeps the sense perfectly but changes the line count from 28 to 14 and removes all rhyme. Is this a translation of Marot's poem, or a translation of Marot's *message*? If the theory calls this a successful translation, it collapses the distinction between translating a text and translating a brief.

  2.  **Tagging Requirements**

      1.  **Commensurability Protocol:** *Non-negotiable.* Without this, Job 1 (adjudication) is impossible. You cannot weigh options without a scale.
      2.  **Phonological Scarcity Adjustment:** *Non-negotiable.* This is an empirical fact. Ignoring it makes the theory linguistically illiterate.
      3.  **Register Stability Clause:** *Non-negotiable.* If the effect on the reader is the goal (pragmatics), form that distorts effect is a failure.
      4.  **Local Actionability Heuristic:** *Prejudice of the Practitioner.* This is required for Job 2, but a purely descriptive theory of translation (Job 1 only) could reject it. However, since you demanded both jobs, I must tag it non-negotiable for *this* specific brief, though it conflicts with nuanced adjudication.
      5.  **Identity Threshold:** *Negotiable.* This depends on the definition of "translation." Some camps define it loosely (spirit), some strictly (text). A theory can function without fixing this, but it cannot adjudicate the "is this a translation?" dispute without it.

      *Cut Item:* I initially considered a requirement for "Authorial Intent Preservation." I cut it because it is unverifiable. We have the text, not Marot's head. A theory relying on intent collapses into speculation.

  3.  **Distinctions the Theory Must Not Collapse**

      *   **Translation vs. Imitation/Homage.**
          *   *What turns on it:* Accountability. A translation claims to stand in for the original; an imitation claims to stand beside it. If a theory collapses these, it allows a translator to claim fidelity while producing a variation (a common Hofstadter move). This misleads the reader about the source text's actual constraints.
      *   **Content vs. Total Effect.**
          *   *What turns on it:* The definition of "sense." A sentence can be propositionally true ("I wish you health") but pragmatically false (sounding sarcastic or childish). A theory that equates content with effect cannot detect when formal success kills the tone.
      *   **Faithfulness to Text vs. Faithfulness to Pattern.**
          *   *What turns on it:* The object of loyalty. Is the poem the words, or is the poem the puzzle? Marot's poem is a virtuoso display of constraint. Ignoring the pattern betrays the *point* of the poem. Ignoring the words betrays the *message*. A theory must distinguish these to explain why a literal crib feels dead and a formal reconstruction feels fake.
      *   **Form as Ornament vs. Form as Carrier.**
          *   *What turns on it:* The penalty for breaking form. If form is ornament, breaking it is a cosmetic loss. If form is carrier (the wit *is* the constraint), breaking it is a structural collapse. In Marot's case, the constraint is the content. A theory treating form as ornament will systematically undervalue the formalist translator's efforts.

  4.  **Empirical and Structural Facts**

      *   **Combinatorial Scarcity:** The set of target-language strings satisfying tight formal constraints (3 syllables, specific rhyme) is vanishingly small compared to the set of strings conveying the sense. In English, this set is smaller than in French. A theory must acknowledge that a "perfect" formal translation in English is statistically less probable than in French.
      *   **Register Drift via Meter:** Specific metrical forms carry cultural baggage. Trisyllabic lines in modern English strongly correlate with nursery rhymes or limericks. In 16th-century French, they correlated with light courtly verse. A theory must account for the fact that preserving the meter may necessarily alter the register.
      *   **Untranslatable Phonemic Effects:** Some effects rely on source-language specificities (e.g., specific vowel echoes in "Ma mignonne" that do not exist in English). A theory must acknowledge that some losses are absolute, not tradeable. No amount of sense-preservation can recover a phonemic effect that lacks a counterpart.

  5.  **The Jointly Unsatisfiable Subset**

      I assert that no account can do both jobs (Adjudicate Universally and Guide Locally) while respecting Empirical Facts. The unsatisfiable subset consists of:
      1.  **Universal Commensurability** (Requirement 1: A fixed exchange rate between form and sense).
      2.  **Phonological Scarcity Adjustment** (Requirement 2: Cost of form varies by language/context).
      3.  **Universal Adjudication** (Job 1: The theory must pronounce a verdict on success).

      **The Argument:**
      To adjudicate universally (3), the theory needs a stable metric (1). It must say, "A broken rhyme costs X points; a changed adjective costs Y points." However, Phonological Scarcity (2) dictates that the cost of a broken rhyme is not stable; it varies wildly depending on the specific words required in the specific language. In one line, a rhyme is easy; in the next, it is impossible.
      If the theory respects Scarcity (2), the "cost" of form is variable and contextual. If the cost is variable, you cannot have a Universal Commensurability protocol (1) that applies across cases. If you cannot compare form and sense on a stable scale, you cannot issue a Universal Adjudication (3).
      Therefore, you must drop one.
      *   If you drop **Universal Commensurability**, you cannot adjudicate between the Form-purist and Sense-purist universally (Job 1 fails).
      *   If you drop **Phonological Scarcity**, your theory is empirically false (it penalizes English translators unfairly).
      *   If you drop **Universal Adjudication**, you admit the theory cannot settle the dispute (Job 1 fails).

      **The Exclusionary Requirement:** **Universal Commensurability.** This does the most exclusionary work. It demands that qualitatively different things (sound patterns vs. propositional truth) be quantifiable on a single scale. This is the category error. You cannot fix an exchange rate between a rhyme and a truth claim that holds across all contexts.

  6.  **Comparability**

      The theory **must** be permitted to return "incomparable" for some pairs of candidates. To do otherwise is to lie.
      *   *Prior:* My prior is that form and sense are incommensurable categories. One is structural/aesthetic, the other is semantic/pragmatic.
      *   *Condition to Move:* I would only accept a single-scale metric if it could be demonstrated that readers consistently trade one for the other in predictable ways (e.g., "Readers always prefer a true rhyme over a true statement in light verse"). There is no evidence for this; preference splits by reader camp.
      *   *Consequence:* If the theory returns "incomparable," it fails Job 1 (Adjudicate). This confirms the impossibility result in section 5. A theory that tells the truth cannot settle the dispute. A theory that settles the dispute must lie about the commensurability of form and sense.

  7.  **Scoring the Three Stances**

      *   **The Literal Crib:**
          *   *Score:* Fails Formal Constraints (Gates). Fails Register (often dry). Passes Propositional Content.
          *   *Verdict:* Not a poem. Fails the Identity Threshold (Requirement 5). It is a key, not a door.
      *   **The Free-Verse Rendering:**
          *   *Score:* Passes Propositional Content. Passes Register (usually). Fails Formal Constraints (Gates).
          *   *Verdict:* A poem, but not *this* poem. It captures the message but discards the virtuosity (Form as Carrier). It fails the Commensurability Protocol if form is weighted heavily.
      *   **The Rhyme-for-Rhyme Reconstruction:**
          *   *Score:* Passes Formal Constraints (Gates). Risks Failing Propositional Content (paraphrase). Risks Failing Register (nursery rhyme effect).
          *   *Verdict:* The only candidate that attempts the whole object. However, it incurs the highest "cost" in sense and register. Under the Phonological Scarcity Adjustment, it is penalized heavily in English.

      *Conclusion:* The scorecard reveals that the **Register Stability Clause** and **Phonological Scarcity Adjustment** are the items doing the work. They penalize the Formal Reconstruction enough to make it tie with the Free-Verse rendering, rendering the adjudication impossible without arbitrary weighting. This confirms the impossibility theorem: the list itself prevents a clear winner.
