      *   **Denominator End:** Medieval population estimates are model-based reconstructions, not census data. Homicide counts are often fragmentary (court records, coroner rolls).
          *   *Surveillance View:* Ratio of two high-variance estimates. If numerator is stable-ish and denominator increases, rate decreases. Is it a rate claim? Yes, but with massive confidence intervals. It's a signal-to-noise problem.
          *   *Commitment:* The thesis commits to the *direction* of the bias being accounted for, but statistically, it's a ratio of uncertain quantities.

      *   **Competing Risks/Exposure:** High background mortality means fewer person-years at risk for homicide in later life.
          *   *Surveillance View:* "Per capita per year" ignores age structure. A life-table approach (lifetime risk) is more robust. If you die of plague at 25, you can't be murdered at 40.
          *   *Impact:* Adjusting for competing risks might attenuate the decline (if modern people live longer, they have more exposure time), but the magnitude of the homicide rate drop is usually large enough to swamp this. However, strictly speaking, "per capita" is the wrong metric for individual risk.

      *   **Case-Definition Drift:** Coding rules change (ICD revisions, recording standards).
          *   *Surveillance View:* Non-stationary measurement instrument. Sensitivity increases over time (better reporting). Specificity might change (what counts as assault vs. common argument).
          *   *Counterfactual:* Can we apply modern definitions backward? No, data doesn't exist. We rely on proxy indicators (e.g., pardon rates, court records). This introduces selection bias. The trend survives only if the measurement error is random or bounded, but it's likely systematic (under-ascertainment in past).

