      *   *Mechanisms (State monopoly, commerce, norms):* These are confounders or effect modifiers in the surveillance model. State monopoly = increased enforcement/surveillance sensitivity but decreased incidence. Commerce = change in exposure opportunities. Norms = change in threshold for reporting/coding.

