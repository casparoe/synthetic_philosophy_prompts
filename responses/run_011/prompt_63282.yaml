  *(Self-Correction on User's Proposal)*: The user suggests treating violence as a hazard of escalation. I need to point out that historically, the denominator (conflicts) is unobserved. Surveillance relies on *presenting* cases. A conflict that doesn't present is missing data. So this proposal shifts the bias from case definition to ascertainment bias. I need to be clear about that.

  *(Self-Correction on Structural Violence)*: In surveillance, we deal with "external cause of injury." Structural violence is often natural causes (disease) exacerbated by environment. To call it violence requires imputing agency. Surveillance is agnostic on agency beyond the immediate mechanism. So the translation fails on the *label*, not necessarily the *metric* (excess mortality).

