answer: |-
  ## PART 1: THE DECISION PROCEDURE (HANDOUT TEXT)
  *(Designed to be read aloud; fits two sides of A4)*

  **MUSEUM COLLECTIONS COMMITTEE: ENTITLEMENT DECISION PROCEDURE**
  **Framework:** Historical Entitlement (based on R. Nozick, *Anarchy, State, and Utopia*)
  **Purpose:** To determine whether the Museum holds a just title to an object, or whether justice requires restitution.

  **PRINCIPLE:** We do not ask "Who needs this more?" or "What is the fair distribution?" We ask: "Did we get this justly, and is our chain of title unbroken?"

  ---

  ### STEP 1: JUSTICE IN ACQUISITION (The Origin)
  **Question:** Was the object's original removal from its source community or first owner voluntary and rights-respecting?
  *   **Sufficient Evidence:** Contemporary contracts signed without duress; records of purchase at market rate; oral history from source community confirming voluntary gift/sale.
  *   **Insufficient Evidence:** "Found" during military action; taken under colonial legal regimes that denied local ownership; no record of transaction.
  *   **Rule on Silence:** If the record disappears during a period of systemic coercion (e.g., colonial expedition, regime persecution), we presume acquisition was **unjust**. The burden is on the Museum to prove otherwise.
  *   **If YES:** Proceed to Step 2.
  *   **If NO:** Proceed to Step 3 (Rectification).
  *   **If UNCLEAR:** Proceed to Step 2, but flag for Committee Review.

  ### STEP 2: JUSTICE IN TRANSFER (The Chain)
  **Question:** Has every transfer of the object from the original owner to the Museum been voluntary?
  *   **Sufficient Evidence:** Unbroken chain of bills of sale, wills, or gift deeds where each holder had valid title.
  *   **Insufficient Evidence:** Gaps in provenance during periods of conflict; transfers where the seller was under duress (e.g., fleeing persecution); "Good faith" purchase of stolen goods (good faith does not cure defective title).
  *   **Rule on Silence:** If the chain breaks during a period of systemic coercion, we presume the transfer was **unjust**. A later "clean" transfer (e.g., a 1960s gift) does not cure an earlier theft.
  *   **If YES:** **EXIT A: RETAIN.** (The Museum holds just title).
  *   **If NO:** Proceed to Step 3 (Rectification).

  ### STEP 3: RECTIFICATION (Fixing the Injustice)
  **Question:** What restores the situation to what it would have been had the injustice not occurred?
  *   **The Counterfactual Rule:** We cannot calculate exact financial loss. We must approximate the "closest possible world" where the injustice did not happen.
  *   **If the Object Exists:** The closest approximation is that the claimant still possesses it. **Return the object.** (Financial compensation is only permissible if return is physically impossible).
  *   **If the Object is Destroyed:** Compensation is required. *Note: Market value + interest is an economic calculation, not a strict entitlement one. Use only if return is impossible.*
  *   **If the Claimant is a Community:** Restitution is made to the legitimate trustees of that community (e.g., National Commission), not necessarily individuals.
  *   **If UNCLEAR:** **EXIT C: ESCALATE.** (See below).

  ---

  ### THE THREE EXITS

  **EXIT A: RETAIN (Museum Keeps Object)**
  *   **Condition:** Steps 1 and 2 are satisfied. Acquisition and all transfers were just.
  *   **Reasoning:** The Museum is the rightful owner. No justice-based claim exists.

  **EXIT B: RETURN (Museum Restitutes Object)**
  *   **Condition:** Step 1 or 2 failed. An injustice occurred in the history of the holding.
  *   **Reasoning:** Justice requires restoring the holding to the victim or their successors. Current Museum hardship or "public access" arguments are irrelevant to entitlement.

  **EXIT C: ESCALATE (Committee Value Judgment Required)**
  *   **Condition:** The theory cannot resolve the factual or normative uncertainty.
  *   **Triggers for Escalation:**
      1.  **Standing:** It is unclear who counts as the legitimate successor (e.g., competing community claims).
      2.  **The Proviso:** Returning the object might catastrophically harm others' rights (e.g., essential medical/sacred use conflict).
      3.  **Time/Limits:** The claim is historically valid but legally time-barred (Theory says return; Law says wait).
      4.  **Conditions:** The claimant attaches conditions that violate future entitlement (e.g., banning future sale).
  *   **Action:** The Committee must vote based on institutional values, acknowledging this step is *not* determined by the Entitlement Procedure.

  ---
  *End of Procedure*

  ## PART 2: CONSULTANT'S BRIEFING (FOR THE PHILOSOPHER)

  Here is the analysis of your three cases, the tension with sector conventions, and the honest limitations of using Nozick in this context.

  ### 1. Running the Cases

  **Case 1: The Brass Plaques (Benin Variant)**
  *   **Procedure Run:**
      *   *Step 1 (Acquisition):* 1890s military expedition. Presumption of coercion/unjust acquisition. **(FAIL)**
      *   *Step 2 (Transfer):* 1961 gift. Even if the gift was voluntary, *nemo dat quod non habet* (you cannot give what you do not have). The officer's estate had no just title to give. **(FAIL)**
      *   *Step 3 (Rectification):* Object exists. Counterfactual = Community still holds them.
  *   **Verdict:** **EXIT B (RETURN).**
  *   **Your Fear:** You worried the procedure would say "Retain" because post-1961 transfers were clean.
  *   **Correction:** Nozick is historical. A clean transfer of stolen goods does not cleanse the title. The procedure correctly identifies the 1890s injustice as the veto point. The "three undocumented gaps" trigger the *Rule on Silence* regarding systemic coercion.
  *   **Standing Issue:** You noted "no identifiable individual descendants." This triggers **EXIT C (Escalate)** regarding *who* receives it. The Procedure says return to "legitimate trustees," but defining that is a value judgment (National Commission vs. Royal Family vs. Local Community).

  **Case 2: The Vienna Watercolour (Nazi Loot)**
  *   **Procedure Run:**
      *   *Step 1/2 (Transfer):* 1938 Vienna sale under duress. Unjust transfer. **(FAIL)**
      *   *Rectification:* Object exists. Return to heirs.
  *   **Verdict:** **EXIT B (RETURN).**
  *   **The Hardship Problem:** The dealer's granddaughter is "not well off"; claimants are wealthy. Nozick's theory is blind to end-state distribution. Her hardship is morally irrelevant to the *title*.
  *   **Conflict:** This is where the "vibes" usually win (compromise, split ownership). Nozick forbids this. Either it's hers or it's theirs. If the title is defective, she has no claim to the object, though the Museum might choose to compensate her for her loss (separate from the claimants' entitlement).
  *   **Judgment Call:** The Procedure forces a binary choice. If the Committee wants to account for the granddaughter's hardship, they must use **EXIT C** and admit they are overriding the theory for humanitarian reasons.

  **Case 3: The Conditional Exchange**
  *   **Scenario:** Source country wants the object back but agrees to a clause barring future sale/loan.
  *   **Nozickian Analysis:** This is the **Chamberlain Case** problem. If they own it, they must have the right to alienate it (sell/loan it). A clause that permanently restricts alienation turns "property" into "stewardship."
  *   **Verdict:** **EXIT C (ESCALATE).**
  *   **Reasoning:** The Procedure cannot validate a restriction that violates the core concept of entitlement. If you return it, you must return full title. If you attach strings, you are retaining a partial entitlement.
  *   **Recommendation:** Tell the Committee: "Under this theory, we cannot enforce that clause. If we return it, it is theirs to sell. If we require the clause, we are effectively retaining a future interest, which complicates the rectification."

  ### 2. Theory vs. Sector Conventions

  You asked where the theory and conventions pull apart. They pull hard.

  *   **Washington Principles (1998):** Call for "just and fair solutions." This is explicitly *not* Nozickian. It invites compromise (e.g., sharing ownership, long-term loans, financial settlements in lieu of return). Nozick demands restitution of title.
      *   *Conflict:* In Case 2 (Vienna), Washington might suggest a financial settlement to keep the art in the public eye. Nozick says "Give it back."
      *   *Action:* When you present the Procedure, flag that following it may violate the "spirit" of Washington if the Committee prefers compromise over strict justice.
  *   **UNESCO 1970:** Sets a prospective threshold (illicit trade after 1970). It ignores pre-1970 theft.
      *   *Conflict:* Nozick is retrospective. It doesn't matter if the theft was legal in 1890; if it violated natural rights (coercion), it requires rectification.
      *   *Action:* The Procedure overrides UNESCO dates. Be prepared for the Solicitor to push back on legal risk vs. philosophical justice.

  ### 3. Limitations: Where This Will Give You the "Wrong" Answer

  You asked for honesty on where to argue the Committee *out* of Nozick.

  1.  **The Counterfactual Problem (Rectification):**
      *   *The Flaw:* Nozick admits his rectification principle is under-theorized. If the object was destroyed, or if the community no longer exists in a form that can hold property, the theory runs out of road.
      *   *The Risk:* In Case 1, if the "National Commission" is a state apparatus hostile to the specific ethnic group that made the plaques, Nozick has no mechanism to adjudicate *internal* community justice.
      *   *Advice:* If the "Closest Possible World" is computationally impossible (e.g., the object was melted down), move immediately to **EXIT C**. Do not let the Procedure pretend to calculate "Market Value + Interest." That is utilitarianism wearing a mask.

  2.  **Individual vs. Community:**
      *   *The Flaw:* Nozick is methodologically individualist. Museums deal with *communities*.
      *   *The Risk:* "Standing" (Exit C) will be your biggest bottleneck. Nozick doesn't tell you if a modern Nation State inherits the rights of a pre-colonial Kingdom.
      *   *Advice:* Acknowledge this is a political question, not a philosophical one. The Procedure identifies the injustice; it cannot identify the heir with precision.

  3.  **The Proviso (Enough and As Good):**
      *   *The Flaw:* You kept the proviso in the prompt, but it's hard to apply. Does keeping a sacred mask in a university museum worsen the source community's situation? Likely yes. Does returning it worsen the students' education? Maybe.
      *   *The Risk:* Weighing these "worsenings" is an end-state calculation.
      *   *Advice:* I have minimized the Proviso in the Procedure to avoid paralysis. Use **EXIT C** if a claimant argues that retaining the object violates their human rights (a stronger claim than the Proviso).

  4.  **The "Vibes" are Sometimes Necessary:**
      *   *The Flaw:* Strict entitlement can lead to morally repugnant outcomes (e.g., evicting a poor family from a home with a title defect from 100 years ago). In museums, this looks like stripping a public collection to satisfy a technicality while ignoring public access.
      *   *Advice:* Use **EXIT C** strategically. When the Nozickian answer is too rigid for the political reality, escalate it. Tell the Committee: "The theory says Return. But this falls under Exit C: Values. Do we value strict title over public access?"

  ### Final Recommendation

  Use the Procedure to kill the "vibes" on *facts* (provenance, coercion, chain of title). It is excellent at establishing whether an injustice occurred.

  Do **not** use it to solve *politics* (who represents the community, whether public access trumps ownership, whether to compromise). For those, force the Committee to vote under **Exit C**. Make them own the deviation from the theory.

  If the Committee finds Exit C is being used for more than 30% of cases, the theory is too brittle for your context. At that point, argue for a hybrid model: Nozick for the *presumption* (burden on Museum), but Rawlsian/Utilitarian for the *remedy* (negotiated settlement). But for now, this document will stop the "we've always done it this way" arguments dead.
