          *   *Reason 1:* SE says seed-crushing isn't a function, which is awkward for biologists. (Plausible pragmatic argument).
          *   *Reason 2:* SE can't handle new mutations/artifacts. CR can. Therefore CR is more basic.
          *   *Critique:* The argument that CR is "more basic" because it covers more cases is a common move (Godfrey-Smith etc.), but the conclusion that we should *prefer* CR overall is controversial. However, the prompt asks for *their* argument. The logic holds internally, even if the premise about SE's inability to handle artifacts is debated (some SE theorists extend the account).
