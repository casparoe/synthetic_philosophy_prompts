  # What's in the box

  Thank you for purchasing the Gödel Model™ Spacetime Kit! Inside, you'll find one fully rendered Lorentzian manifold, pre-loaded with pressureless dust and a negative cosmological constant. This model is singularity-free, ensuring smooth geodesics without unexpected infinite curvature spikes. The metric is homogeneous, meaning every location offers the premium 'center of the universe' experience. Please note temporal orientation is user-defined locally; global synchronization hardware is not included. Your kit includes closed timelike curves routed through every event coordinate. Simply unfold the manifold and begin existence. If the box appears to contain itself, this is normal calibration behavior.

  # Getting started: your matter, your constant

  To initialize your universe, first balance your cosmological constant against the dust density. Our Setup Wizard automatically tunes this negative value to prevent expansion, keeping your spacetime static and stable. Next, engage the rigid rotation protocol. It is crucial that all matter rotates uniformly; differential rotation may cause shearing stresses in your causal structure. Once spinning, verify that your local light cones are tilting appropriately relative to the rotation axis. Don't be alarmed if distant regions appear to rotate faster than light; this is a coordinate effect permitted by general relativity. You may now inhabit any comoving coordinate. Because the solution is homogeneous, every customer is technically at the rotation axis simultaneously. Please do not file tickets claiming you are off-center; this is a feature of the geometry, not a placement error. Enjoy your stable, non-expanding reality.

  # Known issues

  *   **Ticket #8821: Cannot define a universal 'now'.** Users report inability to slice spacetime into global spacelike hypersurfaces. This is intended. The geometry does not support a universal present moment. Please experience time locally. Support cannot synchronize clocks across distances.
