  # What's real here

  This parody highlights the tension between mathematical existence and physical reality. The Gödel solution is a valid solution to Einstein's field equations. It features rigidly rotating dust, a negative cosmological constant, and no singularities. Crucially, it contains closed timelike curves through every point and admits no global time function (no universal 'now').

  The satire targets the inference drawn from this existence proof. Just because a consistent model allows time travel doesn't mean our universe does. Gödel argued that if time travel is possible in some consistent world, then 'time' isn't essential to reality. But physics selects models based on observation (like our expanding, positive-constant universe), not just consistency. The helpdesk tone mimics how easily we treat mathematical possibility as physical fact. The joke is on the leap from 'can be written down' to 'must be true.' Consistency is not actuality.
