answer: |-
  1. **What I'm committed to**

  We are abandoning the claim that every future event has a numerical probability waiting to be discovered. Following Keynes, we treat probability as a logical relation between the evidence we possess and the conclusion we wish to draw. Sometimes that relation is strong; sometimes it is weak; sometimes it is non-existent. Crucially, we distinguish the *balance* of probability (the direction the evidence points) from the *weight* of argument (the amount of relevant evidence available). A high probability based on scant evidence is not the same as a high probability based on abundant evidence.

  We reject the Principle of Indifference. If we have no grounds to rank outcomes, we do not assign equal probabilities; we admit ignorance. We do not split differences to force a model to run. For long-term expectations, we accept that decisions rest on convention: we assume the present state of affairs will continue indefinitely unless we have specific evidence to expect a change. We acknowledge that conventions do not erode smoothly; they hold until they break at identifiable junctures.

  Consequently, we throw out the single-point Net Present Value (NPV) as a measure of truth. We discard sensitivity analysis that varies inputs without varying the weight of evidence supporting them. We stop pretending that a confidence interval derived from a distribution based on guesswork represents risk rather than ignorance. Our goal is not to optimize return under false precision, but to avoid catastrophic error under genuine uncertainty. We will not number the unnumerable.

  2. **The procedure**

  This procedure must be completed within three weeks. It terminates in a recommendation to Proceed, Reject, or Refer to the Board.

  **Step 1: The Weight of Evidence Audit**
  *Question:* What is the volume and relevance of evidence connecting past data to the future state required for this asset to succeed?
  *Sufficiency:* A classification of "High Weight" (direct, relevant historical data exists) or "Low Weight" (data is proxy, scarce, or relates to a different system state).
  *Exit:* If Weight is Low and the asset is irreversible (Step 4), terminate with a **Recommendation to Reject**. Do not proceed to valuation. If Weight is High, proceed to Step 2. If Weight is Low but asset is reversible, proceed to Step 2.
  *Reasoning:* This enforces the distinction between balance and weight. Low weight cannot support irreversible commitments regardless of the projected return.

  **Step 2: Convention Baseline Setting**
  *Question:* What is the current state of affairs, and is there definite evidence to expect a change?
  *Sufficiency:* A forecast based strictly on the continuation of current trends (the convention), documented with specific reasons for any deviations.
  *Exit:* If the forecast relies on anticipated changes without definite evidence, revert to the convention baseline. If the convention baseline renders the project non-viable, terminate with a **Recommendation to Reject**.
  *Reasoning:* This applies Keynes's view of long-term expectation. We do not forecast the future; we project the present unless compelled otherwise. This prevents speculative modeling from driving capital allocation.

  **Step 3: Breakpoint Identification**
  *Question:* At what identifiable juncture will the convention established in Step 2 fail?
  *Sufficiency:* A list of specific triggers (e.g., regulatory change, hydrological threshold, market saturation) that would invalidate the baseline.
  *Exit:* If no breakpoints can be identified despite Low Weight evidence, terminate with a **Recommendation to Reject** (unknown unknowns are too high). If breakpoints are identified, proceed to Step 4.
  *Reasoning:* Conventions fail abruptly. We must know where the cliff is before we walk toward it. This replaces smooth sensitivity curves with binary failure points.

  **Step 4: Reversibility Assessment**
  *Question:* If the breakpoint is hit, can we recover capital or cease operations without catastrophic loss?
  *Sufficiency:* A binary classification: "Irreversible" (sunk capital, physical infrastructure) or "Reversible" (contractual, modular, short-life).
  *Exit:* If Irreversible and Weight is Low (from Step 1), terminate with a **Recommendation to Reject**. If Reversible, proceed to Step 5.
  *Reasoning:* Keynesian uncertainty demands liquidity and flexibility. We take risks only where we can retreat.

  **Step 5: Valuation and Probability Assignment**
  *Question:* Given the Weight and Convention, can we assign a numerical probability to cash flows?
  *Sufficiency:* Numbers are assigned *only* if Weight is High. If Weight is Low, cash flows are treated as indeterminate ranges without probabilities.
  *Exit:* If Weight is Low, do not calculate NPV. Calculate only the cost of failure vs. cost of inaction. Proceed to Step 6. If Weight is High, calculate NPV using Convention Baseline.
  *Reasoning:* This bans the Principle of Indifference. We do not assign probabilities to Low Weight scenarios. We assess them by consequence, not likelihood.

  **Step 6: Decision Rule Application**
  *Question:* Who bears the risk of the Breakpoint occurring?
  *Sufficiency:* Identification of the party absorbing the loss if the convention fails.
  *Exit:* If the Utility bears the risk on a Low Weight project, terminate with **Refer to Board**. State clearly: "This is a value decision, not an evidence decision." If the Customer/Partner bears the risk, **Recommend to Proceed**. If the Utility bears the risk on a High Weight project, **Recommend to Proceed** (if NPV > 0).
  *Reasoning:* When evidence is weak, the decision is no longer technical; it is ethical and political. The Board must own the uncertainty.

  3. **Where it isn't really a procedure**

  Three steps require judgment that cannot be fully mechanized, creating vulnerability to bias or laziness.

  First, **Step 1 (Weight)** relies on the analyst's honesty about evidence relevance. A lazy analyst will classify proxy data (e.g., climate models from different regions) as "High Weight" to force the model to run. A bad actor will inflate Weight to justify a pet project. There is no external audit for this; it relies on professional integrity. We mitigate this by requiring a written justification of *why* the evidence is relevant, subject to peer review by the second analyst.

  Second, **Step 3 (Breakpoints)** requires imagination. It is easy to claim "no breakpoints exist" or to list trivial ones. A lazy analyst will identify breakpoints that are easily managed. A bad actor will hide the real cliff edges. We mitigate this by requiring at least one breakpoint that renders the asset stranded, not just impaired.

  Third, **Step 6 (Risk Allocation)** involves defining who "bears" the risk. Contractual indemnity is not always real protection if the counterparty fails. An analyst might claim risk is transferred when it is merely shared. We mitigate this by requiring proof of counterparty creditworthiness equal to the exposure.

  These are not bugs; they are features of a Keynesian approach. Probability is a logical relation, not a measurement. The analyst is part of the logic. We cannot remove the human judgment, so we must expose it to scrutiny rather than hiding it behind a spreadsheet.

  4. **Case A: desalination**

  **Step 1 (Weight):** Low. The hydrological data is "quite good" but relates to a climate that is not the one we will operate in. The logical relation between past rainfall/runoff and future availability is broken. The weight of argument supporting the 50-year projection is negligible.
  **Step 2 (Convention):** The convention is current water scarcity. However, the project relies on a change (stable future hydrology) without definite evidence. Reverting to convention suggests higher risk than modeled.
  **Step 3 (Breakpoints):** Climate thresholds are identifiable but timing is unknown. Once hit, the plant may be undersized or source water may become too saline/scarce.
  **Step 4 (Reversibility):** Irreversible. Huge capital cost, poured concrete, site-specific. Cannot be moved or repurposed easily.
  **Step 5 (Valuation):** Weight is Low. We do not assign probabilities to the 50-year cash flows. The NPV is meaningless. We assess only the cost of failure (stranded asset) vs. cost of inaction (rationing).
  **Step 6 (Decision):** The Utility bears the risk. The asset is Irreversible. The Weight is Low.

  **Recommendation: Reject.**

  This will be hated. The team has defended this publicly for two years. Sunk costs are psychological, not economic, but the political capital is real. However, under Keynesian rules, you cannot commit irreversible capital on a Low Weight argument. The data is about the wrong climate. To proceed is to gamble, not to invest. The sensitivity table currently bolted on the end is a facade; it varies numbers but does not increase the weight of evidence. You are building a monument to a climate that is leaving. Do not pour the concrete. Defer until the weight of evidence regarding the new climate regime increases, or seek modular, reversible alternatives. The board cannot vote on a number that claims precision where none exists. They must vote on whether to gamble ratepayer money on a guess. The procedure says no.

  5. **Case B: offtake contract**

  **Step 1 (Weight):** Low. The data concerns other people's forecasts (second-order expectations). This is a "beauty contest" scenario. There is no fundamental evidence of long-term demand, only sentiment.
  **Step 2 (Convention):** The convention is current tech expansion. We assume this continues unless there is definite reason to expect a crash. No definite reason exists today.
  **Step 3 (Breakpoints):** Industry saturation, regulatory shift on energy use, tech shift away from water-cooling. These are identifiable junctures.
  **Step 4 (Reversibility):** Reversible-ish. It is a contract, not a plant. If the customer leaves, we lose revenue, not sunk capital (assuming we don't build dedicated infrastructure).
  **Step 5 (Valuation):** Weight is Low. Do not assign probabilities to the 30-year duration. Treat cash flows as indeterminate beyond the short term.
  **Step 6 (Decision):** Who bears the risk? Currently, the Utility bears the volume risk via a standard offtake. If the campus never builds, we lose the revenue stream we counted on for rate base growth.

  **Recommendation: Refer to Board (Conditional).**

  This is not an evidence decision; it is a risk appetite decision. The procedure prohibits us from approving this as a standard capital plan item because the probability relation is weak. However, because the asset is not irreversible concrete, we do not Reject outright.
  We recommend the Board approve *only if* the contract is restructured to be take-or-pay with strong credit support, shifting the breakpoint risk to the data centre. If the developer refuses to bear the risk of their own industry's volatility, we **Reject**.
  Do not accept a 30-year promise based on what firms expect other firms to expect. That is convention without weight. If they want the water, let them guarantee the payment regardless of their industry's beauty contest outcomes. If they won't, walk away. You are not a venture capital fund for speculative tech expansion. The recommendation is to demand risk transfer. If that kills the deal, let it die.

  6. **What Keynes costs me**

  Following Keynes makes your appraisals less decisive and more uncomfortable. You will produce fewer "Go" recommendations. You will hand the Board decisions that lack the comfort of a single NPV number. You will look less competent to stakeholders who equate precision with expertise.

  Specifically, you lose the ability to compare disparate projects on a single metric. A High Weight project with low return cannot be mathematically ranked against a Low Weight project with high potential return, because the probabilities are not comparable. You lose the shield of the model. When a project fails, you cannot say "the model said 90%"; you must say "the weight of evidence was insufficient."

  Tell the Board this: "We are switching from predicting the future to managing our ignorance. The old method gave us false confidence and exposed us to catastrophic error on long-life assets. The new method will reject more projects and send more decisions to you. This is not inefficiency; it is solvency. We are buying resilience against the things we cannot know. You will have to make more value judgments, but you will make them with open eyes rather than hidden behind a spreadsheet."
