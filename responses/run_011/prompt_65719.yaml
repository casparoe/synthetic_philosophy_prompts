      *   Advisor 2 (Selection Bias): The score is an average over questions *you* answer. If you only answer easy questions (where you are very sure), your average error will be lower than someone answering hard questions. This encourages cherry-picking.
      *   The Winning Condition: "Lowest average... buys the whisky." This is a competition. Minimizing your score is good, but beating others is better.
      *   The Problem: The current system rewards risk aversion (Advisor 1) and selection bias (Advisor 2) rather than genuine calibration or information gathering.

