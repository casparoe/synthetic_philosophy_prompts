prompt: |-
  I work on the policy side of an assistant product, and there's a move a colleague makes that I can't get traction on. When someone objects that our refusals are paternalistic — deciding for a competent adult what they're allowed to ask for — he says: it's just a seatbelt law. Nobody thinks seatbelt laws insult adults. You regulate the moment of bad judgement, because the person you're constraining would endorse the constraint from the cool hour, before the crash. Same shape exactly: the user in a bad moment (furious, manic, grieving, bored, three drinks in) is being held to the standard their own steadier self would set. He uses this to conclude that "paternalism" has no bite at all in this debate, so the only live question is which harms are big enough to count, and any further objection is just squeamishness about the word.

  I think the analogy is carrying more weight than it can hold, but I can't say where. Can you audit it?

  Specifically:
  - the correspondence table. Seatbelt law on one side, assistant refusal on the other: what plays the legislator, the crash, the cool hour, the fine, the driver who objects, the opt-out. Say explicitly if some slot has no occupant, because I suspect that's where the trouble is.
  - the disanalogies, split into the ones that actually threaten his conclusion and the ones that are merely interesting. I don't want a laundry list where the trivial items pad out the real ones.
  - a case that I think breaks it and he hasn't answered: we're also floating not refusing outright but quietly returning a weakened or redirected answer — user asks for X, gets X-minus, and isn't told that's what happened. Does the seatbelt picture cover silent substitution, or only announced prohibitions? If it doesn't cover it, does that weaken the whole analogy or just leave one practice outside it?
  - whether "paternalism has no bite" survives all of that, and if it doesn't, what the analogy was really doing for him.
  - one better analogy if you've got one, with a line on why it fits better and what it still can't carry.

  Keep the whole thing under 450 words, table included. I've read the soft-paternalism arguments on both sides, so don't summarize them or give me a survey — just the audit, and please seperate the parts that are load-bearing from the decoration.
