answer: |-
  The ventilation hummed, a low-frequency drone that seemed to vibrate in the teeth of everyone left in the committee room. It was past eight. The whiteboard was crowded with equations that looked more like accounting than ethics.

  Tobias Fenn rubbed his temples, staring at the draft schedule. "Let's start with the obvious. Allometry. You're weighting brain mass, but brain mass tracks body mass. A heavier brain often just means a larger animal to control, not a deeper mind."

  Ines Marchetti didn't look up from her notes. "We abandoned mass in revision three. You know that. We count neurons. It's the only public, auditable proxy for the intensity and range of experience."

  "Neurons," Tobias said, tapping the table. "Fine. Take the elephant. Roughly three times our brain mass, something like three times our total neuron count. By your metric, an elephant is three moral units to our one. But well over ninety percent of those neurons are in the cerebellum. They have a third of our cortical complement despite a cortex twice the mass. Their encephalization quotient is near the bottom of the mammalian range; ours is near the top. The whales sit in between. The metrics don't agree, Ines. The choice isn't forced by the data."

  Ines capped her pen. "That's why we restrict the count to the pallium. We aren't counting plumbing; we're counting the structure associated with integration."

  "But once the schedule must say which structures count, it is no longer measuring the brain neutrally," Tobias said, leaning forward. "It is presupposing a theory about which parts host experience. That theory is doing all the normative work. You've hidden the philosophy inside the anatomy."

  "I've hidden nothing. I've chosen the only boundary line that doesn't rely on the sympathies of the reviewer," Ines said, her voice tightening. "If you let reviewers judge 'complexity' based on behavior, they'll privilege the species they like. A neuron count is coarse, yes, but it is even-handed."

  "Is it?" Tobias picked up a pen, twirling it. "Consider the octopus. The majority of their neurons sit out in the arms. The arms keep solving problems when severed. Is the weight additive? Is an octopus eight minds in one skin, or one mind distributed? If you count unitarily, you ignore the distributed processing. If you count additively, you inflate the score based on morphology."

  "And insects," Ines countered. "Mushroom bodies. If you call them pallial analogues, you collapse the tier structure across billions of farmed animals. A cricket farm outweighs a whale. If you refuse to call them analogues, you're admitting the criterion is behavioral and functional after all, not structural."

  Tobias nodded slowly. "Exactly. You're trapped between a collapse of the system and a contradiction of your own premise. But let's talk about the math. Why is the weight logarithmic? Why base-ten log of the neuron count?"

  Ines exhaled, a sharp sound in the quiet room. "Diminishing marginal intensity. Adding a million neurons to a fly doesn't change its world as much as adding a million to a dog. Experience isn't linear."

  "Any monotone transform fits the ranking equally well," Tobias said softly. "Log, square root, linear—the order remains. The transform is where you smuggled in the aggregate results you wanted. Whether a shrimp farm outweighs a single whale turns entirely on the curvature of that function. You didn't derive that from neuroanatomy. You derived it from the budget cap you needed to meet."

  Ines was silent for a moment. She looked at the equation on the board. "I grant you the transform is a policy choice," she said, the concession costing her. "But without a cap, we approve nothing. Without a metric, we approve anything. I need a variable that exists independently of the observer."

  "And when you apply it to us?" Tobias pressed. "The schedule ranks neonates and patients with advanced neurodegeneration below adult corvids and cetaceans. Their pallial neuron counts are lower. Are we really prepared to sign off on protocols for human infants that we'd forbid for crows?"

  Ines straightened. "If we restrict the schedule to non-human animals, the restriction looks arbitrary. If we move from actual neuron counts to species-typical or capacity-based counts, I lose the auditability. I lose the hard number."

  "So you bite the bullet?"

  "I say that moral status is not the only variable in research approval," Ines said. "But yes, on the metric of experiential range, a mature crow exceeds a human neonate. If you want to protect the neonate, do it on species solidarity, not on pretending their neural hardware is equivalent."

  Tobias shook his head. "Then your substitute is 'solidarity,' which is pure sentiment. You claimed to escape sympathy. My alternative is affective circuitry. Evidence of suffering rather than mere nociception. Associative learning that indicates a model of self."

  "And how do you measure that without neural terms?" Ines snapped. "You talk of circuitry. You talk of learning mechanisms. Your substitute is itself cashed out in neural facts. Our disagreement isn't about whether neural facts matter. It's about which ones."

  Tobias paused. He looked at the whiteboard, then at Ines. "You're right," he said quietly. "I can't escape the biology. If I demand evidence of suffering, I am demanding evidence of specific neural architectures. I am not arguing against quantification; I am arguing against *this* quantification."

  Ines nodded, once. "Then we are arguing about weightings, not variables."

  "No," Tobias said. "We are arguing about what the variables represent."

  The room settled back into the hum of the ventilation. The coffee cups were cold.

  Ines capped her pen again, finally. "My crux is auditability. For you to be right, there would have to be a functional measure of suffering that is as public and resistant to bias as a cell count. I don't believe it exists."

  Tobias stood up, gathering his papers. "My crux is homology. For you to be right, the pallium would have to be the sole substrate of experience across all taxa, proven not by analogy but by identity. Until then, you're just weighing plumbing."

  He turned to the door. "See you at the hearing, Ines."

  "See you, Tobias."
