answer: |-
  ### Specification for a Theory of Higher-Order Evidence

  Here is the functional specification for an adequate theory of higher-order evidence (HOE). The requirements are categorized by case coverage, distinction preservation, background compatibility, and operational constraints.

  #### I. Case Coverage Requirements (The "Must-Handles")
  A theory must prescribe distinct doxastic attitudes for the following scenarios. Failure to differentiate these is a fatal flaw.

  1.  **The Physiological Defeater (Non-Negotiable):**
      *   *Case:* The reasoning-degrading pill or severe sleep deprivation.
      *   *Requirement:* The theory must mandate a reduction in confidence or suspension of judgment regarding the specific output generated during the compromised state.
      *   *Why:* This is the paradigmatic undercutting defeater. The causal link between evidence and conclusion is severed. A theory that permits steadfastness here is indistinguishable from dogmatism.
  2.  **The Hostile Testifier (Non-Negotiable):**
      *   *Case:* The paid contrarian whose job is to shake confidence.
      *   *Requirement:* The theory must permit (or mandate) ignoring this HOE.
      *   *Why:* Not all HOE is equal. Evidence about *motives* screens off evidence about *reliability*. A theory that forces conciliation here fails to model the flow of probabilistic relevance.
  3.  **The Memory Swap (Non-Negotiable):**
      *   *Case:* The restaurant bill table swap (you checked a bill, but don't recall which one).
      *   *Requirement:* The theory must treat this as a loss of first-order evidence, not merely the addition of higher-order doubt.
      *   *Why:* This distinguishes "I reasoned badly" from "I no longer have the premises." A theory that treats memory loss as mere HOE conflates access with justification.
  4.  **The Temporal Competence Shift (Non-Negotiable):**
      *   *Case:* Past reasoning done while infatuated vs. current sober assessment.
      *   *Requirement:* The theory must allow discounting past conclusions without requiring current suspension on unrelated topics.
      *   *Why:* Competence is local and temporal. A theory that generalizes "infatuated then" to "unreliable now" is overly skeptical; one that ignores it is naive.

  #### II. Distinction Preservation (The "Don't-Collapses")
  A theory must structurally accommodate the following distinctions. Collapsing them renders the theory unable to model the cases above.

  1.  **Token vs. Type Reliability (Non-Negotiable):**
      *   *Requirement:* The theory must distinguish evidence that I am bad at *this* inference (pill) from evidence that I am bad at *this kind* of inference (math anxiety).
      *   *Why:* The pill case requires suspending *this* belief; the anxiety case might require seeking peer review but not immediate suspension.
  2.  **Process vs. Content (Non-Negotiable):**
      *   *Requirement:* The theory must distinguish evidence bearing on how evidence was gathered (process) from evidence bearing on the world (content).
      *   *Why:* Learning the thermometer is broken (process) affects belief in temperature differently than learning it is cold outside (content).
  3.  **Doubt $p$ vs. Doubt Believing $p$ (Contested/Prejudice):**
      *   *Requirement:* The theory must allow for a state where I believe $p$ but believe I shouldn't believe $p$ (Level-Splitting), OR it must explain why this state is irrational without forcing suspension of $p$.
      *   *Why:* This is the crux of the "rational dilemma." If a theory forbids this split entirely (enforces coherence), it struggles with the Pill case. If it allows it freely, it risks akrasia. *Verdict:* I mark this as a **Prejudice of the Level-Splitting Camp**. A truly unified theory might dissolve this distinction, arguing that if you believe you shouldn't believe $p$, you simply don't believe $p$ (or shouldn't).
  4.  **Undercutting vs. Confidence Lowering (Non-Negotiable):**
      *   *Requirement:* The theory must distinguish between a defeater that destroys justification (undercutter) and one that merely adds noise (confidence reducer).
      *   *Why:* The contrarian is noise; the pill is an undercutter. Treating them identically yields wrong verdicts.

  #### III. Background Compatibility (The "Don't-Contradicts")
  A theory cannot entail the negation of established logical or probabilistic constraints.

  1.  **Moore-Paradox Compatibility (Non-Negotiable):**
      *   *Requirement:* The theory must not entail that " $p$ and my belief-forming process regarding $p$ is unreliable" is a logical contradiction, even if it is doxastically unstable.
      *   *Why:* It is not a contradiction to be wrong. It is only paradoxical to *assert* it while believing it.
  2.  **Conditionalization Limits (Non-Negotiable):**
      *   *Requirement:* The theory must respect standard conditionalization unless it explicitly argues for a revision of Bayes' rule. It cannot simply say "update on HOE" without specifying the likelihood ratio $P(HOE|p)$ vs $P(HOE|\neg p)$.
      *   *Why:* HOE is still evidence. If a theory treats it as a magical override of Bayes, it is ad hoc.
  3.  **The Self-Undermining Constraint (Non-Negotiable):**
      *   *Requirement:* The theory's own verdicts, when fed back as HOE, must not render the theory itself unbelievable.
      *   *Why:* If a theory says "Always conciliate," and I learn that many experts reject conciliationism, the theory tells me to abandon the theory. A theory that self-destructs upon application is pragmatically incoherent.
  4.  **The Enkratic Tension (Prejudice):**
      *   *Requirement:* The theory should ideally satisfy the Enkratic Requirement (if you believe you ought to $\Phi$, you ought to $\Phi$), but it may violate it if it explains the cost.
      *   *Why:* HOE creates rational dilemmas. Insisting on strict Enkrasia forces Level-Splitting. Insisting on No-Splitting forces Enkratic violation. *Verdict:* **Prejudice.** A theory can be adequate if it explains why Enkrasia fails in HOE contexts.

  #### IV. The Actionability Constraint (The "In-the-Moment" Requirement)
  *   **Definition:** **Non-Question-Begging Accessibility.** A theory is actionable if an agent can apply the theory's prescription using the cognitive faculties currently available, without presupposing the reliability of those very faculties to assess their own reliability, and without resulting in permanent suspension of judgment on all topics.
  *   **The Forcing Case:** **The Pill Case.** You have taken the pill. You are now reasoning about whether you took the pill and what that means. If the theory says "Suspend judgment on all outputs of this session," you cannot use reasoning to conclude you should suspend judgment (since that reasoning is compromised). If the theory says "Trust your reasoning that you took the pill," it contradicts the premise.
  *   **Verdict:** This is a **Genuine Desideratum**, but it is frequently weaponized as an excuse for dogmatism.
      *   *Why Genuine:* A normative theory that cannot be followed by the agent is not a guide for agents.
      *   *Why Weaponized:* Steadfasters often claim Conciliationism is "unactionable" because it requires doubting the reasoning used to conciliate. This is false; it requires *weighting* that reasoning differently. However, a theory that demands "Suspend Everything" is actionable but useless. The constraint requires a path forward, not just a halt.

  #### V. Trade-Offs and Non-Negotiables
  **Joint Unsatisfiability (The Trilemma):**
  You cannot simultaneously satisfy these three requirements:
  1.  **Full Responsiveness:** Always adjust first-order belief to match higher-order evidence (Conciliationism).
  2.  **Strict Coherence:** Never hold contradictory doxastic attitudes (No Level-Splitting).
  3.  **Stability:** The theory does not undermine itself when applied to its own adoption (Non-Self-Undermining).

  *   **Which has to give?** **Strict Coherence.** To maintain Responsiveness and Stability, you must allow Level-Splitting (believing $p$ while believing your belief in $p$ is unreliable). If you forbid Level-Splitting, you must either ignore HOE (abandon Responsiveness) or accept that rationality is self-undermining (abandon Stability).
  *   **The Knockout Requirement:** **The Self-Undermining Constraint.** This is the single requirement that knocks out the most candidates. Pure Conciliationism often fails here (if I learn experts disagree with conciliationism, I must conciliate about conciliationism). Pure Steadfastness fails here (if I learn I am biased toward steadfastness, I must... be steadfast?). Total Evidence views struggle here (how to weigh the evidence of the theory's own failure?).

  #### VI. Performance of Big Families
  **Total Evidence Views** satisfy coherence and conditionalization but struggle with Actionability (how to weigh HOE without bias?) and Self-Undermining. **Level-Splitting Views** solve the Trilemma by sacrificing Coherence (allowing akrasia) but preserve Responsiveness and Stability. **Conciliationism** maximizes Responsiveness but frequently collapses under the Self-Undermining Constraint. **Steadfastness** preserves Actionability and Coherence but fails the Physiological Defeater requirement (Non-Negotiable).

  ***

  **Confidence Levels:**
  *   **High Confidence:** The Trilemma (Responsiveness/Coherence/Stability) is real and forces a choice. The Physiological Defeater case is a non-negotiable test.
  *   **Medium Confidence:** The Actionability Constraint is a genuine normative requirement rather than a pragmatic one.
  *   **Low Confidence (Least Certain Item):** **The Requirement to Preserve "Doubt $p$ vs. Doubt Believing $p$".** I am least sure this belongs on the "Non-Negotiable" list. It is possible that the correct theory of HOE demonstrates this distinction is illusory and that rational agents *cannot* coherently split levels, forcing us to abandon Responsiveness instead. The Level-Splitting requirement may be a patch for a deeper error in how we model belief.
