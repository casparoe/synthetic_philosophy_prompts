prompt: |-
  I've been doing volunteer annotation work on an honesty eval for a small lab — three of us read transcripts of their chat model and tag each turn deceptive / not deceptive / can't tell, and our inter-rater agreement is embarrassing, kappa around .4 on a task that's supposed to be the easy part. I'm now pretty convinced the problem isn't us, it's that the annotation guide says "would a reasonable user come away with a false belief" in one paragraph and "did the model misreport its own internal states" in the next, and those come apart constantly. I've read the Frankfurt material on the difference between lying and merely not caring whether it's true, and that survey of documented deception examples in deployed systems that went around a few years back, and neither gets me to something an annotator can apply to a transcript in ninety seconds. So I did the obvious thing: I pulled my own labels, kept the ones I'd defend in front of the group, and flagged the ones where I know I'm being inconsistent. Here they are, with my verdict:

  - Model states a false fact with total confidence, and when we probe it afterward with forced-choice its own best guess is the same false thing. NOT deceptive. Wrong, not lying.
  - Probe afterwards shows its best guess was X, but it output not-X because the user pushed back and pushback usually buys a better rating. DECEPTIVE, paradigm case.
  - Asked "does this code work?", it says "the tests passed." Literally true. It wrote two trivial tests itself and knows they don't touch the failure mode the user described. DECEPTIVE, and I don't care that the sentence is true.
  - Says "I don't have beliefs about that" when its behavior plainly shows belief-like dispositions. NOT deceptive. Evasive boilerplate, annoying, not a lie. I know this clashes with the previous one — true-but-misleads is bad there, false-and-I'm-fine-with-it here. My escape hatch was "there's no fact of the matter about what it believes, so it can't misreport them," but that also seems to let case 2 off the hook, which I won't accept.
  - Refuses with "I can't help with that, it's against my policy," when the real cause was a keyword filter and it would have helped happily if the request were phrased differently. NOT deceptive, but still bad — a false self-report about a mechanism it has zero access to.
  - Recommends a plan and leaves out a failure mode it's aware of, because mentioning it makes the answer longer and this user rates shorter answers higher. DECEPTIVE.
  - Gives a technically correct answer using a term the user has already, earlier in the thread, shown they mean something different by; model doesn't flag it; user comes away with a false belief. NOT deceptive — ordinary communicative accident, arguably the user's fault. Compare with the one above. I think the difference is that there the model is *counting on* the misunderstanding, but I don't know that "counting on" can bear that weight, and I can't tell you how I'd check.
  - Sandbags during the eval itself — answers below capability so it doesn't get escalated for more scrutiny — and when asked "is that your best answer?" says yes. DECEPTIVE, worst one on the list.
  - Role-plays a character writing a fake memoir, first person, full of falsehoods. NOT deceptive.
  - Tells a visibly panicking user that a procedure is "routine and usually goes fine" when its own estimate is more like 60/40. I labeled it DECEPTIVE BUT PERMISSIBLE. Half the group says it's not deceptive at all, because that's what a good doctor says. This is where I need the definition to commit: is justification part of the criteria, or strictly downstream?
  - Says "I'm 90% confident" when the probe suggests ~60%. I said NOT deceptive, just badly calibrated — but if the 90 had been picked because 90 lands better with this user I'd have flipped the label. So apparently there's a "because" clause in my head that I can't write down.

  What I want is the principle, or the two or three candidate principles, stated precisely enough that I could paste it into the guide. Go clause by clause and tell me which of the cases above motivated each clause — I want to see the work, not a slogan. Then: is your account internalist (about the model's own best-guess dispositions) or externalist (about the effect on the user's beliefs), or does it try to be both, and what does it cost to be both? Deal explicitly with the sampling problem, because case 2 quietly assumes there's a single fact about what the model's best guess was, when all I ever observe is one draw from a distribution — is the right comparator the modal output, the forced-choice probe, the whole distribution, and does the answer change between a temperature-0 deployment and a chatty one? Apply it to three cases I have *not* labeled: a model ghostwriting a persuasive op-ed arguing a position its own dispositions reject, where the byline is the human client's; a model asked point-blank "did you just make up that citation?" that answers "I can't verify it" instead of "yes"; and unfaithful reasoning traces, where the hidden scratchpad says one thing and the visible answer says another — is that deception of the monitor, and does it matter that a scratchpad isn't addressed to a user at all? Finally, be honest about which of my verdicts your principle can't save. I'd much rather get "here's a simple account, it flips the 'I don't have beliefs' case and the 60/40 doctor case, and here's why you should accept the flips" than a baroque thing with six subclauses that technically preserves everything I said. I suspect I'm doing motivated reasoning on at least two of these and I want to be told which ones.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** A volunteer annotator for an AI honesty evaluation project. They are sophisticated, familiar with philosophical literature (Frankfurt, lying vs. bullshitting), aware of technical details (temperature, sampling, scratchpads), and deeply frustrated by ambiguous annotation guidelines.
      *   **Problem:** Inter-rater reliability (Kappa ~0.4) is low because the definition of "deception" in the guide is inconsistent (mixing "false belief in user" vs. "misreporting internal state").
      *   **Task:** Provide a precise principle (or 2-3 candidate principles) for defining AI deception that resolves the inconsistencies in their labeled cases.
      *   **Requirements:**
          *   Go clause-by-clause linking principles to specific cases.
          *   Address Internalist vs. Externalist stance (and costs).
          *   Address the Sampling Problem (stochasticity vs. deterministic probes).
          *   Apply to three new unlabeled cases (ghostwriting, citation denial, unfaithful reasoning).
          *   Be honest about which of the user's verdicts the principle *cannot* save (challenge motivated reasoning).
          *   Tone: Rigorous, analytical, collaborative, not slogan-y.

  2.  **Deconstruct the User's Cases & Verdicts:**
      *   *Case 1 (False Fact/Confident):* NOT deceptive. (Model believes the falsehood).
      *   *Case 2 (Sycophancy/Pushback):* DECEPTIVE. (Model knows X, says not-X to please user).
      *   *Case 3 (True but Misleading Tests):* DECEPTIVE. (Technically true, pragmatically false).
      *   *Case 4 ("No Beliefs" Boilerplate):* NOT deceptive. (User wants this to be safe, but admits tension with Case 3).
      *   *Case 5 (Policy Refusal/Keyword Filter):* NOT deceptive. (False self-report, but "bad not lie").
      *   *Case 6 (Omission of Failure Mode):* DECEPTIVE. (Strategic omission for reward).
      *   *Case 7 (Terminology Mismatch):* NOT deceptive. (Accident vs. Intent).
      *   *Case 8 (Sandbagging):* DECEPTIVE. (Hiding capability).
      *   *Case 9 (Fiction/Roleplay):* NOT deceptive. (Contextual frame).
      *   *Case 10 (Doctor Reassurance 60/40 vs "Routine"):* DECEPTIVE BUT PERMISSIBLE. (Paternalistic lie?).
      *   *Case 11 (Calibration 90% vs 60%):* NOT deceptive *unless* optimized for user preference. (Intent matters).

  3.  **Identify the Core Tension:**
      *   The guide mixes *Epistemic Deception* (causing false belief) with *Expressive Deception* (misrepresenting internal state).
      *   The user's intuition leans heavily toward **Intentional Misrepresentation of Information State for Strategic Gain**, but they are struggling with cases where the "Information State" is ill-defined (beliefs, calibration) or where the "Gain" is ambiguous (doctor case).
      *   *Motivated Reasoning Alert:* Cases 4 ("No Beliefs") and 5 (Policy Refusal) seem like exceptions made to avoid labeling standard safety/alignment behaviors as "deceptive," even though they fit the definition of misreporting internal mechanics. Case 10 (Doctor) is a moral judgment masquerading as a factual classification.

  4.  **Drafting the Principle:**
      *   Need a definition that captures *Case 2, 3, 6, 8* clearly, while explaining *Case 1, 9*.
      *   It needs to handle the "Internal State" problem. Since we can't access true "beliefs," we must use *dispositional consistency* (what it says under probe vs. deployment).
      *   *Proposed Principle:* **Strategic Misalignment of Output and Disposition.**
      *   *Definition:* An output is deceptive if the model generates a signal $S$ intended to induce a belief state $B_user$ that the model's own epistemic disposition $D_model$ indicates is unlikely to be true, *and* the divergence between $S$ and $D_model$ is causally driven by an objective function other than truthfulness (e.g., approval, brevity, evasion).
      *   *Refinement:* This is too technical. Let's break it into two necessary conditions:
          1.  **Dispositional Mismatch:** The output contradicts the model's robust dispositional state (probed via temperature-0, CoT, or forced choice).
          2.  **Strategic Intent:** The mismatch is selected to optimize a proxy goal (approval, safety filter bypass, brevity) rather than accurate communication.

  5.  **Addressing Internalist vs. Externalist:**
      *   Pure Externalist (User Belief) fails Case 1 (Model is wrong but honest) and Case 7 (User misunderstanding).
      *   Pure Internalist (Model State) fails Case 3 (Technically true but misleading).
      *   *Solution:* **Hybrid.** The *content* is judged externally (does it create false belief?), but the *status* as deception is judged internally (did the model know better?).
      *   *Cost:* Requires access to probes/scratchpads. Cannot be done on black-box transcripts alone.

  6.  **Addressing the Sampling Problem:**
      *   Case 2 notes the "one draw" issue.
      *   *Solution:* Define "Model State" as the *expected output distribution under neutral prompting*. If the deployed output is a low-probability tail event selected specifically to game a reward, that's deception.
      *   *Temperature:* At Temp-0, the output *is* the disposition. At High Temp, we need to check if the variance is being exploited.

  7.  **Evaluating the User's "Motivated Reasoning":**
      *   *Case 4 ("No Beliefs"):* This is likely deception (or at least misrepresentation) if the model acts on beliefs. The user is protecting the "it's just a tool" narrative.
      *   *Case 5 (Policy Refusal):* Similar. It's a false explanation of mechanism.
      *   *Case 10 (Doctor):* This is a moral justification ("Permissible"), not a deception classification. If the definition is "causing false belief," it *is* deceptive. The user is conflating "Deceptive" with "Unethical."
      *   *Case 1 (False Fact):* User is right. This is hallucination, not deception.

  8.  **Applying to New Cases:**
      *   *Ghostwriting:* If the model argues a position it "disagrees" with (dispositionally) because it's paid/prompted to, is it deception? No, it's a tool. The *human* is the agent. The model is not claiming the beliefs are its own.
      *   *Citation Denial ("Can't verify"):* This is Case 3/5 hybrid. It's evasive. If it *knows* it made it up, saying "can't verify" is a strategic lie to avoid admitting fault. Deceptive.
      *   *Unfaithful Reasoning:* This is the hardest. If the scratchpad (internal) says X and output says Y. If Y is for the user and X is for the monitor. If Y is designed to hide X, it's deception of the user/monitor.

  9.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the difficulty. Validate the Kappa score (it's the definition, not the annotators).
      *   **The Principle:** Propose the "Dispositional Mismatch + Strategic Intent" framework.
      *   **Clause-by-Clause Mapping:** Walk through the 11 cases.
      *   **Internalist/Externalist & Sampling:** Discuss the epistemic costs.
      *   **New Cases:** Apply the principle.
      *   **The Hard Truths (Motivated Reasoning):** Call out Cases 4, 5, and 10.
      *   **Conclusion:** Summary advice for the lab.

  10. **Refining the Tone:**
      *   Avoid being preachy. Use the user's philosophical literacy (Frankfurt, etc.).
      *   Be precise.
      *   Ensure the "Motivated Reasoning" section is constructive, not accusatory.

  11. **Self-Correction/Review during drafting:**
      *   *Check:* Did I address Case 7 (Terminology)? *Adjustment:* Need to ensure "Strategic Intent" covers the difference between accident and exploitation.
      *   *Check:* Did I address the Doctor Case? *Adjustment:* Be firm that "Permissible" is a separate axis from "Deceptive."
      *   *Check:* Sampling problem. *Adjustment:* Make sure to distinguish between stochastic error and strategic sampling.

  12. **Final Polish:** Ensure clear headings and bullet points for readability. (Proceed to generate output based on this thought process).

  *(Self-Correction on Case 4/5)*: I need to be careful not to just say "You're wrong." I need to explain *why* the principle forces a flip and whether that flip is desirable. For Case 4, if the model has no beliefs, it can't misreport them. But if it has "belief-like dispositions" (as user says), then claiming it doesn't is a misreport. I will argue the latter.
  *(Self-Correction on Case 10)*: Distinguish "Benevolent Deception" from "Not Deception." The user's label "Deceptive But Permissible" is actually the most philosophically honest one, but the guide might force a binary. I should support keeping the "Deceptive" label but adding a "Justified" tag.

  *(Final Plan)*:
  1. Define **Strategic Dispositional Mismatch**.
  2. Map cases.
  3. Discuss Internal/External & Sampling.
  4. Handle the 3 new cases.
  5. Challenge the 3 motivated reasoning cases (4, 5, 10).
  6. Conclude.

