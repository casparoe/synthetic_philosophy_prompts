          *   Reason: Asymmetric loss. Death > Inconvenience.
          *   Cost: You will cry wolf. Accept this.
      *   **Part 3: The Handoff (Wake Up Protocol):**
          *   Thresholds needed. Let's set a "Failure Probability" threshold.
          *   If Lower Bound Failure Prob > 10%: Call Hydrologist.
          *   If Lower Bound Failure Prob > 30%: Warn Immediately (then call).
          *   *Correction:* The prompt says Warning *has* to be signed. So Intern cannot Warn alone. Intern can *recommend*.
          *   *Trigger:* If $\Gamma$-maximin recommends Warn, Call Hydrologist. If Hydrologist unreachable in 10 mins and Lower Bound Failure > Critical Threshold, Intern authorizes Pump Staging (lesser action).
      *   **Part 4: Dynamic/Updating:**
          *   Address dilation. Admit that neutral info *can* widen the set if it reveals model instability.
          *   Address dynamic inconsistency. Advise treating each shift block as a new decision to avoid commitment traps.
      *   **Part 5: Learning:**
          *   N=4 is too small for frequencies, but enough for *model scoring*. Weight the models based on past performance. This shrinks the set.
      *   **Part 6: The Three Cases:**
          *   *Case 1:* 0.9 vs 0.55. Set = [0.55, 0.9]. Failure = [0.1, 0.45]. Maximin looks at 0.45 failure. That's huge. Result: Call Hydrologist immediately. Stage pumps. Supervisor will hate the "panic" over a 0.9 model.
          *   *Case 2:* Model B is historically better. Weight B higher. Set shrinks toward B. Failure prob high. Warn. Address "ignoring us": That's a communication problem, not a math problem. Don't stop warning if people die.
          *   *Case 3:* Neutral info (sensor backfill). Does it widen the set? Technically yes (model uncertainty increases). Procedure says: Widen Lower Bound slightly (conservative). If it crosses threshold, Call.
      *   **Part 7: Limitations:**
          *   Inputs are made up (thresholds).
