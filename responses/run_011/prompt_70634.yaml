          *   Actually, given the stakes, if $\Gamma$-maximin says Warn, you Warn (or stage pumps). But the Hydrologist must sign. So the trigger is: "If $\Gamma$-maximin says Warn, Call Hydrologist immediately."
          *   Wait, the prompt says Hydrologist takes 25 mins. Warning needs to happen *now*.
