      *   *Learning (N=4):*
          *   With N=4, you don't learn precise frequencies. You learn *model reliability*. If Model B is right 5/6 times, you weight Model B higher. This shrinks the set towards B. This addresses the "stay vague forever" worry.

  4.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the gravity. Validate the user's epistemological instinct.
      *   **Part 1: The Credal Sheet (Building the Set):**
          *   Define the "Risk Band" (Lower/Upper).
          *   Formula: Lower = Min(Model A, Model B). Upper = Max(Model A, Model B).
          *   Adjustment: If Gut says "worse," lower the Lower bound by 0.05.
