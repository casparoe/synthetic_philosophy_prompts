  3.  **Develop the Procedure (The "Core"):**

      *   *Epistemic Foundation:* We have two models ($P_A, P_B$). We have scarce data. A single probability is a lie. A credal set $K$ is the convex hull of plausible probabilities.
      *   *Building $K$:*
          *   Lower Bound ($\underline{P}$): Min(Model A, Model B, Historical Frequency).
          *   Upper Bound ($\overline{P}$): Max(Model A, Model B, Historical Frequency).
          *   *Correction:* Historical frequency is too sparse (N=4) to trust as a hard bound, but it anchors reality. Let's use the models as the primary spread, adjusted by the "Gut" factor if it falls outside. Actually, given the "two weeks training" constraint, keeping it simple is key. Let's define the Credal Interval $[\underline{P}, \overline{P}]$ as the range spanned by the two models, *unless* historical data strongly contradicts both (which N=4 won't do reliably). Let's stick to the Model Spread as the primary credal set, perhaps widened slightly for "model uncertainty."
          *   *Refinement:* The prompt asks how to build it from *what we've got*. Let's use the **Convex Hull of Available Estimates**. If Model A = 0.9, Model B = 0.55, the set is $[0.55, 0.9]$. If Gut says "looks worse," shift the lower bound down.
          *   *Meaning:* "We are confident the true risk is somewhere in this band. It is not 0.725. It is between 'likely safe' and 'toss-up'."

      *   *Decision Rule:*
          *   *Options:*
              *   Interval Dominance: Too weak (often leaves options open).
              *   Maximality: Complex to calculate.
              *   E-admissibility: Requires utilities.
              *   $\Gamma$-maximin (Maximin Expected Utility): **This is the one.** It's the standard for high-stakes safety. It maximizes the minimum expected utility. In flood terms: Assume the *worst* probability in your set is the true one, and act accordingly.
          *   *Why:* "Missing one is potentially people dying." This is a classic asymmetric loss function. The cost of a Miss (death) $\gg$ cost of False Alarm (credibility/road closure). $\Gamma$-maximin protects against the worst-case probability (Model B's 0.55).
          *   *Cost:* High false alarm rate. The supervisor will hate this. I need to be explicit about this.

      *   *Handoff/Triggers:*
          *   Intern acts alone if $\underline{P}$ (worst case) is above safety threshold.
