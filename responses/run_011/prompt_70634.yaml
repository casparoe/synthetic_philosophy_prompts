answer: |-
  This is a serious operational failure disguised as administrative simplicity. Your supervisor is asking you to collapse a distribution of uncertainty into a point estimate because the council finds ranges "inconvenient." In formal epistemology, that's called *dogmatism*. In flood control, it's called *negligence*.

  You are correct: this is a textbook application for a credal set (imprecise probabilities). You have conflicting sources (models), sparse data (N=4), and asymmetric loss (death vs. annoyance). A single number lies. A range tells the truth.

  Below is the procedure. It is designed to be printed on a single sheet, laminated, and kept next to the phone. Following that is the technical justification and the three test cases you requested.

  ***

  # LAMINATED SHEET: OVERNIGHT FLOOD DECISION PROTOCOL
  **For Use By Student Interns On Shift**

  ### 1. BUILD THE RISK BAND (5 Minutes)
  Do not average the models. Do not pick the "best" one. The truth is somewhere between them.
  *   **Model A Probability (Levee Holds):** \_\_\_\_\_
  *   **Model B Probability (Levee Holds):** \_\_\_\_\_
  *   **Historical Check:** In the last 5 similar floods, which model was right more often? (If Model B is right >60% of time, circle Model B).
  *   **The Risk Band:**
      *   **Lower Bound (Worst Case):** Write down the *lower* of the two model numbers. (If you circled Model B above, use Model B's number even if it's higher).
      *   **Upper Bound (Best Case):** Write down the *higher* of the two model numbers.
      *   **Gut Check:** Does the river look worse than the models say? If yes, subtract 0.05 from your **Lower Bound**.

  **What this means:** "We cannot tell you the exact chance of safety. We can tell you the safety is *at least* [Lower Bound] and *at most* [Upper Bound]. Any number in between is a guess."

  ### 2. THE DECISION RULE (5 Minutes)
  **Rule:** Assume the **Lower Bound** is the true probability. (This is the *Maximin* rule).
  *   **Calculate Failure Chance:** $1.0 - \text{Lower Bound}$.
  *   **Thresholds:**
      *   **Failure Chance < 10%:** Monitor. No action.
      *   **Failure Chance 10% – 25%:** **Stage Pump Crew.** (Call Crew Chief, do not close road).
      *   **Failure Chance > 25%:** **INITIATE WARNING PROTOCOL.** (Close road, prepare door-knocking).

  ### 3. THE HANDOFF (Wake-Up Triggers)
  You cannot sign a Full Warning alone. The Duty Hydrologist must sign. They take 25 minutes to reach.
  *   **If Failure Chance > 10%:** Call Duty Hydrologist immediately. Tell them: *"Risk Band Lower Bound indicates [X]% failure chance. I am staging pumps per protocol."*
  *   **If Failure Chance > 25% AND Hydrologist unreachable in 10 mins:** You are authorized to order Road Closure and Pump Staging. Log the time. Wake Hydrologist again immediately.
  *   **If Models Disagree Wildly (Gap > 0.30):** Call Hydrologist regardless of the numbers. Tell them: *"Model uncertainty is too high for intern judgment."*

  ### 4. UPDATING DURING SHIFT
  *   **New Data (Rain/Gauge):** Recalculate the Risk Band.
  *   **Neutral News (e.g., Sensor Glitch fixed):** Do **not** change the numbers unless the model outputs change.
  *   **12-Hour Blocks:** Treat every shift block as a new decision. Do not assume a decision made at 10pm holds for 6am. Re-run this sheet every 4 hours or when gauge changes by >1 inch.

  ***

  # TECHNICAL JUSTIFICATION & ANALYSIS

  ### 1. Building the Set (Plain Language Meaning)
  You asked how to explain the bounds without collapsing them.
  *   **The Lower Bound:** "This is the safety level we can guarantee even if the pessimistic model is right."
  *   **The Upper Bound:** "This is the safety level we get if the optimistic model is right."
  *   **The Gap:** "This gap represents our ignorance, not the river's behavior."

  **Why not average?** Averaging (0.725) assumes the errors of Model A and Model B cancel each other out. In hydrology, errors often correlate (both miss the soil saturation). Averaging creates false precision.
  **Why not just use the worse one?** That is effectively setting the Lower Bound as the point estimate. It's safe, but it discards the information that the Upper Bound provides (which helps the Hydrologist gauge urgency).

  ### 2. The Decision Rule: $\Gamma$-Maximin
  I have selected **$\Gamma$-maximin** (Maximin Expected Utility) for you.
  *   **The Logic:** You have a set of probabilities $K = [\underline{P}, \overline{P}]$. You choose the action that maximizes utility assuming the probability is $\underline{P}$ (the worst case in your set).
  *   **Why:** Your loss function is asymmetric.
      *   $Loss(\text{False Alarm}) = \$\$\$ + \text{Credibility}$.
      *   $Loss(\text{Miss}) = \text{Human Life}$.
      *   Since $Loss(\text{Miss}) \gg Loss(\text{False Alarm})$, you must optimize for the worst-case probability.
  *   **The Cost:** This rule **will** increase your false alarm rate. You will close the road when the levee holds. Your supervisor will hate this. They will call it "panic." You must tell them: "The protocol prioritizes life over road closure costs. If you want fewer alarms, you must improve the models, not the intern."

  ### 3. Handoff and Wake-Up Triggers
  The procedure hard-codes the wake-up trigger.
  *   **Why 10%?** In civil engineering, 1-in-10 risk on a catastrophic failure is usually the threshold for mobilization.
  *   **Why 25%?** This is the threshold for public warning.
  *   **The Gap Trigger:** If the models disagree by >0.30 (e.g., 0.9 vs 0.55), the epistemic uncertainty is too high for an intern. This forces a handoff even if the risk looks low, because the *uncertainty* itself is a risk factor.

  ### 4. Dynamic Updating and Dilation
  You asked if the set can get *wider* on neutral info.
  *   **Yes.** In imprecise probability, this is called **Dilation**. If you learn that your data source is unreliable (even if the data itself is neutral), your uncertainty about the *model's reliability* increases.
  *   **Case 3 Application:** If the upstream gauge backfilled data, you now know the input data is noisier than thought. Even if the number didn't change, your confidence in that number should drop. The procedure handles this by the "Gap Trigger." If the glitch makes the models diverge, you call the Hydrologist.
  *   **Dynamic Consistency:** $\Gamma$-maximin is notoriously dynamically inconsistent (you might plan tonight to do X tomorrow, but tomorrow you change your mind).
      *   **Fix:** The procedure explicitly says "Treat every shift block as a new decision." You are not making a plan for 12 hours; you are making a decision for *now*. This avoids the commitment trap. You accept that you might change your mind at 6am, and that is allowed.

  ### 5. Learning from N=4
  You are worried that with only 4 events, you stay vague forever.
  *   **The Fix:** You do not learn *frequencies* from N=4. You learn *model weights*.
  *   In Section 1 ("Historical Check"), if Model B has been right 5 out of 6 times, you circle it. The procedure then says: "Use Model B's number even if it's higher."
  *   **Effect:** This collapses the Credal Set toward Model B. You aren't claiming Model B is *true*; you are claiming Model B is *reliable*. This allows you to sharpen your bounds over semesters without needing N=100.

  ***

  # RUNNING THE CASES

  ### Case 1: The "Panic" Call
  *   **Inputs:** Model A = 0.90, Model B = 0.55. Gap = 0.35.
  *   **Risk Band:** [0.55, 0.90].
  *   **Rule:** $\Gamma$-maximin uses Lower Bound (0.55).
  *   **Failure Chance:** $1.0 - 0.55 = 0.45$ (45%).
  *   **Action:** 45% > 25% Threshold. **INITIATE WARNING PROTOCOL.** Call Hydrologist.
  *   **Supervisor Reaction:** They will hate this. The average is 0.725 (27% failure), which is borderline. The "optimistic" view is 10% failure. By using the Lower Bound, you are treating a 55/45 toss-up as a near-certainty of danger.
  *   **Why this is correct:** A 45% chance of levee failure is not a gamble you take with 400 families. If you average, you are betting that Model A's error is independent of Model B's. In a flood, errors correlate. If B sees danger and A doesn't, B is usually seeing the non-linear factor (debris, soil saturation) that A missed.
  *   **Outcome:** You wake the town. The levee holds. The council yells. You show them the sheet: "Protocol says 45% risk requires warning."

  ### Case 2: The "Boy Who Cried Wolf"
  *   **Inputs:** Models disagree (0.9 vs 0.55). Model B has been right 5/6 times.
  *   **Risk Band:** Because Model B is historically reliable, Section 1 says "Use Model B's number." Risk Band collapses to ~[0.55, 0.55] (or narrow range around it).
  *   **Rule:** Failure Chance = 45%.
  *   **Action:** **WARN.**
  *   **The Credibility Problem:** The town ignores you.
  *   **Procedure Response:** The procedure does not account for "credibility fatigue." It accounts for *mortality*.
  *   **Hard Truth:** If you stop warning because people ignore you, you are optimizing for council comfort, not safety. The procedure forces you to warn. If the council wants people to listen, they must fund better models or public education. You cannot math your way out of their apathy. If you withhold warning to save credibility and the levee breaks, you are liable. If you warn and it doesn't break, you are annoying. Choose annoying.

  ### Case 3: The Neutral Glitch
  *   **Inputs:** Upstream gauge backfilled data. Models unchanged.
  *   **Epistemic Status:** This is *second-order uncertainty*. You don't know if the river is higher, but you know your *knowledge* of the river is degraded.
  *   **Procedure:** Section 4 says "Do not change numbers unless model outputs change." **HOWEVER**, Section 3 says "If Models Disagree Wildly... Call."
  *   **Refinement for this case:** A sensor glitch usually increases variance in the models. If the models stay tight (0.9 vs 0.9) despite the glitch, proceed. If the glitch makes them diverge (0.9 vs 0.6), the Gap Trigger fires.
  *   **Dilation Check:** If you are being strictly formal, neutral info about data quality *should* widen the credal set (you are less sure the models are ingesting truth).
  *   **My Advice:** On the laminated sheet, I kept it simple ("Don't change numbers"). Why? Because interns at 3am will overthink dilation.
  *   **The Real Move:** If you know the data is backfilled, you add a "Gut Check" penalty in Section 1. "Subtract 0.05 from Lower Bound." This acknowledges the data degradation without requiring complex Bayesian updating.
  *   **Result:** Lower bound drops. Failure chance rises. You call the Hydrologist to tell them: "Data quality is suspect, risk band adjusted down."

  ***

  # LIMITATIONS & ETHICAL DISCLAIMER

  You asked me to be straight about what this can't do.

  1.  **Judgment Calls Dressed as Math:** The thresholds (10%, 25%) are made up. They are not derived from your data (N=4 is insufficient). They are ethical choices. I picked them to be conservative. Your council might want 50%. That is a political fight, not a math one.
  2.  **The "Gut Check" is a Fudge Factor:** Section 1 allows the intern to subtract 0.05 for "Gut." This is where the intern's anxiety enters the math. It's necessary (humans see patterns models miss), but it's uncalibrated.
  3.  **Systematic False Alarms:** This procedure *will* generate false alarms. It is designed to. If your council punishes false alarms, they are punishing safety. This procedure does not protect you from that politics; it only protects you from the liability of a miss.
  4.  **The Intern Burden:**
      *   **Honest Answer:** **This should not be run by a twenty-year-old alone overnight.**
      *   **Why:** You are asking a student with one semester of stats to make life-or-death decisions using a procedure they helped write, at 3am, with no backup. Even with this sheet, the cognitive load is too high. If the gauge spikes and the phone rings and the models disagree, the stress will cause them to revert to "averaging" because it feels safer socially.
      *   **Recommendation:** If you implement this, you must petition the department to require the Duty Hydrologist to be *on-call by phone* (answering within 2 rings) whenever the Risk Band Lower Bound drops below 0.8. You cannot leave the intern as the sole decision-maker on $\Gamma$-maximin. The intern should be the *analyst*; the Hydrologist must be the *decider*.

  **Final Word:**
  Your supervisor wants a single number because it absolves them of ambiguity. "We said 72%, we were wrong, oh well."
  A range says: "We knew we were uncertain, and we acted on the uncertainty."
  If the council hates the range, let them hate it. Better a hearing about a closed road than a funeral about a flooded basement. Use the sheet. Force the handoff. Protect the intern.
