  9.  *(Self-Correction on Case 2)*: "Town has started ignoring us." This is the "Boy Who Cried Wolf" problem. The procedure must prioritize life over credibility. I need to state that clearly.

  10. *(Self-Correction on Case 3)*: "Nobody thinks this is evidence about the river either way." This is the test for dilation. If the procedure widens the interval on neutral info, does it paralyze action? I need to ensure the widening doesn't trigger a false alarm unless it crosses a specific uncertainty threshold.

