prompt: |-
  Okay so context: I'm a third year, taking a formal epistemology seminar this term (we did imprecise probabilities for like three weeks and I got way too into it), and separately I work overnight shifts at my county's flood warning desk as one of the student interns. The desk is basically a room with two hydrological models, a river gauge, and a phone, and on any given wet night the question is whether to put out a warning for the bottoms neighborhood — which means closing a state road, calling in a pump crew, and knocking on about 400 doors. Missing one is potentially people dying. Crying wolf is a council hearing and, worse, people stop opening the door. Interns rotate every semester and get maybe two weeks of training, and the standing instruction is basically "be sensible."

  The thing is, our actual practice is embarrassing. Each model spits out a single probability that the levee holds, and whoever is on shift either averages the two numbers or just uses the worse one, depending on mood. Last month they were 0.9 and 0.55 and the guy on shift averaged them to 0.725 and wrote that on the bulletin. My supervisor says the town council wants one number on the bulletin anyway, so there's no point pretending we have a range. And we only have four comparable events in the gauge record, so there is no way I'm fitting anything.

  This is exactly the case my seminar says a credal set is for, so I want to try to build the procedure myself and I'd rather you write it properly than me half-ass it at 3am. Please write a decision procedure an intern can actually run in twenty minutes, alone, with one semester of stats, on a laminated sheet next to the phone. Specifically:

  - How to build the set from what we've got — two disagreeing model outputs, four historical events, and the duty hydrologist's gut — and what the resulting lower and upper bounds on "the levee holds" are supposed to *mean* to someone who has never heard the word credal. I need plain-language phrasing that doesn't collapse back into a single number and also doesn't make the council think we're stalling.
  - Which of the decision rules we did — interval dominance, maximality, E-admissibility, Γ-maximin — the desk should run, in what order, and why. I know the choice of rule isn't a math question, it's a question about how much you're willing to gamble, so tell me explicitly which one you'd pick for us and what that pick costs us in false alarms.
  - Where the procedure stops with a default action on its own, and where it hands off — including the fact that any warning has to be signed by the duty hydrologist, who takes about 25 minutes to reach and will not thank you for a 2am call that turns out to be nothing. The wake-them-up trigger needs to be part of the procedure, not an afterthought.
  - How to handle new information coming in mid-shift. Does the set tighten, and can it ever get *wider* after we learn something that seems neutral? Someone in the seminar argued maximin-style rules also get into trouble when you apply them stage by stage — you end up committed to a plan you'd abandon later — and for us the stages are real, because a warning stays in force in twelve-hour blocks. Say whether your rule survives that.
  - And the other thing that got raised: if you start with a really wide prior, do you ever actually learn? Our record is four events, which makes me nervous that the honest answer is we stay vague forever.

  Then run it on three cases, and please don't soften any of them — one of these should come out in a way my supervisor will hate and I want to see that plainly:

  1. 11:40pm, gauge rising faster than forecast. Model A says 0.9 the levee holds through the night, Model B says 0.55. Warning means the road closes and 400 people get woken. Pump crew can be staged without a full warning.
  2. It's the sixth comparable event in nine years and Model B has now been the right one five times, including the bad one. Models disagree again tonight, roughly the same spread. Does the procedure let us finally sharpen, and if not, does that mean we warn again — and how do we handle the fact that the town has started ignoring us?
  3. 2:15am, we find out the upstream gauge stopped transmitting for about ninety minutes earlier in the evening and backfilled its readings from a nearby sensor. Nobody thinks this is evidence about the river either way. What does the procedure say to do with it?

  Finally, be straight with me about what the procedure can't do: which steps are judgment calls dressed up as procedure, which inputs would have to be made up, and what it will get systematically wrong. If the honest answer is that this shouldn't be run by a twenty-year-old alone overnight, I want you to say that too — I'd rather hear it from you than from the council.
