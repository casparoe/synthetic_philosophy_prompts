answer: |-
  This is a sophisticated collision between two epistemologies: the archival turn in history and the verificationist ethic of Wikipedia. You are correct that your hunches are largely right, but the mapping requires precision to avoid the 'cheat' you identified.

  Here is the translation of the five claims into Wikipedia policy vocabulary, followed by the residue analysis and practical advice.

  ### The Translation

  **1. Claim: Archives produce holes; record-keepers decide who appears.**
  *   **Wikipedia Vocabulary:** *Systemic bias* and *Reliable Sources (RS).*
  *   **The Mapping:** Wikipedia acknowledges *systemic bias* (the project knows its coverage skews towards the Global North, men, and the powerful). It accepts that *Reliable Sources* are the gatekeepers of content.
  *   **The Distortion:** In policy language, systemic bias is treated as an *unfortunate gap* to be filled when sources arrive. In archival theory, the gap is a *constitutive feature* of the record. Wikipedia policy assumes that if a source *were* to exist, it would be found and used. It cannot encode the idea that the absence of sources is itself a historical fact. Policy treats the source landscape as a neutral terrain we must navigate; theory treats the landscape as a political construction.
  *   **Verdict:** Expressible, but flattened. The *moral weight* of the silence is lost.

  **2. Claim: Silenced people are objects in the record, not voices (name in a column vs. narrative).**
  *   **Wikipedia Vocabulary:** *Primary vs. Secondary sources* and *Significant coverage.*
  *   **The Mapping:** This is the closest direct map. Wikipedia explicitly distinguishes between primary sources (the minute book, the census) and secondary sources (the analysis). *Significant coverage* requires a secondary source to discuss the subject at length. A name in a column is verification of existence, not notability.
  *   **The Distortion:** Wikipedia assumes the secondary source is a *better* truth-carrier. Policy dictates that a secondary source transforms a 'name' into a 'subject'. Archival theory argues the secondary source might just be another layer of power deciding which names deserve narrative. Wikipedia policy cannot distinguish between 'significant coverage' and 'significant power'. If the press ignored her, policy says she wasn't notable; theory says the press rendered her invisible.
  *   **Verdict:** Expressible, but the *reasoning* is inverted. Wikipedia sees the lack of secondary sources as a failure of the subject to attract attention; theory sees it as a failure of the attention-mechanisms to be just.

  **3. Claim: Silence is made at multiple stages (creation, filing, keeping, historian selection).**
  *   **Wikipedia Vocabulary:** *Verifiability* and *No Original Research (NOR).*
  *   **The Mapping:** Wikipedia stops at the 'historian selection' stage. *Verifiability* requires that a claim be published by a reliable source. If a record was binned in 1920, Wikipedia treats it as if it never existed, unless a modern secondary source explicitly states, "Records were binned in 1920."
  *   **The Distortion:** Wikipedia cannot encode the *process* of attrition. You cannot write in the article, "She is hard to find because the police logs were selectively kept," unless a secondary source says exactly that. To put that observation in based on your own examination of the gaps is *Original Research*. The policy language has no variable for 'missing data due to curation'.
  *   **Verdict:** Inexpressible without a secondary source to validate the silence.

  **4. Claim: Power decides what counts as an event.**
  *   **Wikipedia Vocabulary:** *Due Weight* and *Notability (GNG).*
  *   **The Mapping:** *General Notability Guideline (GNG)* effectively operationalises this. If power (media, academia) has not treated it as an event (coverage), Wikipedia cannot treat it as an article. *Due Weight* ensures we don't overstate minor events.
  *   **The Distortion:** This is the hardest cheat point. In Wikipedia vocabulary, 'Notability' is often framed as 'intrinsic significance discovered by sources'. In reality, as you note, it is 'significance conferred by sources'. Policy language struggles to admit that notability is not an intrinsic property of the subject, but a measurement of the echo chamber surrounding them.
  *   **Verdict:** Expressible only by admitting that 'Notability' is a proxy for 'Coverage', not 'Importance'.

  **5. Claim: Responses (Read against the grain vs. Speculative gap).**
  *   **Wikipedia Vocabulary:** *No Original Research (NOR)* and *Synthesis (SYNTH).*
  *   **The Mapping:** 'Reading against the grain' is precisely *Synthesis*. It involves taking multiple primary sources (census, log, minute book) and combining them to reach a conclusion ('she organised workers') that none of them state individually. 'Speculative gap' is *Original Research*.
  *   **The Distortion:** There is no distortion here; there is a direct prohibition. The method historians recommend to recover subaltern voices is a deletable offence on Wikipedia. Wikipedia prioritises the *integrity of the claim's attribution* over the *recovery of the historical truth*.
  *   **Verdict:** Literally inexpressible. It is banned methodology.

  ### The Residue

  You asked what doesn't survive the translation.

  **1. The Structural Hole**
  There is a hole in Wikipedia's vocabulary. It is the inability to distinguish between "nobody wrote about this" and "this did not matter." Policy conflates *significance* with *coverage*. When you argue at AfD that "she matters despite the lack of sources," you are making a historical claim. When they argue "delete because no sources," they are making a policy claim. They are talking past each other because policy has no mechanism to value historical significance independent of publication volume.
  This is not rhetorical fluff on the historians' part. It is a structural limitation of a tertiary source project. Wikipedia is an archive of summaries of other archives. It inherits the silences of the secondary source layer. It cannot fix the silence; it can only mirror it.

  **2. Where Wikipedia is Sharper**
  Wikipedia states the constraint of *verification* more sharply than the historians do. Historians often argue that 'reading against the grain' yields truth. Wikipedia counters that without a secondary source to anchor the claim, the 'truth' is unverifiable and potentially mythical.
  In your specific case: you know she organised workers. But if the pamphlet only says she was present, and the police log only says she was arrested, linking those two dots to say 'organisation' is an inference. Wikipedia demands that the *inference* be published, not just the *data points*. This protects the project from well-meaning editors constructing narratives that might be slightly wrong. It prioritises *accuracy of attribution* over *completeness of history*.

  ### Addressing Your Hunches

  **Hunch 1: "My article dying and the historian's claim about silence are the same fact."**
  **Verdict:** Correct. The AfD outcome is the administrative enforcement of the archival silence. The deletion is not a judgement on the woman; it is a judgement on the state of the published record. You are experiencing the theory in real-time.

  **Hunch 2: "Reading-against-the-grain is precisely what OR and SYNTH rules ban."**
  **Verdict:** Correct. If you write an article that says "X happened" based on your synthesis of a census return and a minute book, you are committing SYNTH. Even if you are right, you are not allowed to be the one to make the connection. The connection must be made by a publisher first.

  ### What To Do Next

  Knowing this translation changes your strategy. You cannot win an AfD by arguing archival theory. The other editors are not historians; they are custodians of policy. They cannot accept 'silence' as a reason for inclusion because policy demands 'sources' as a reason for inclusion.

  **1. Do not re-nominate the standalone article.**
  Unless a new secondary source appears, the article will not survive. Arguing that the policy is unjust will not work; the policy is the foundation of the project.

  **2. Move the content to a broader article.**
  This is the workaround. Find or create an article about the *1912 Rent Strike in [Town]* or *Labour Unrest in [Town] c. 1910–1915*.
  *   **Why this works:** The *event* likely has more coverage than the *person*. A local history book might discuss the strike without focusing on her.
  *   **Policy advantage:** You do not need to prove *her* notability. You need to prove the *strike's* notability. Once the article exists, you can include her as a participant.
  *   **Weight:** You must adhere to *Due Weight*. You cannot give her a biography section. You can write: "The strike was supported by laundry workers, including [Name], who was recorded in police logs as..."
  *   **Sourcing:** You can cite the primary sources here to verify specific details (dates, arrests) provided they are not controversial, but the *narrative* of the strike must come from a secondary source.

  **3. Use the 'Mention' strategy.**
  If there is an article about the *Laundry Workers Union* or a biographical list of *People from [Town]*, she may qualify for an entry there. Lists often have slightly more flexible inclusion criteria than standalone articles, provided the list itself is well-sourced.

  **4. For your school essay.**
  Use this experience. It is a perfect case study. You can argue that Wikipedia's 'Neutral Point of View' is not a view from nowhere, but a view from the *published record*. Your essay can demonstrate how the 'Verifiability' policy inadvertently codifies the 'Archival Silence' you studied in class. You have empirical data: the AfD log is your evidence of the silencing mechanism in action.

  **Summary**
  You are not wrong about the history. You are right about the theory. But you are trying to use a tool (Wikipedia) that is structurally designed to replicate the biases of the secondary source market. The translation reveals that Wikipedia policy is not a theory of history; it is a theory of citation.

  Preserve the work you did. Put it in a broader context where the sourcing requirements are met by the event, not the individual. And do not take the deletion as a verdict on her life; it is merely a verdict on the paperwork surviving about her.
