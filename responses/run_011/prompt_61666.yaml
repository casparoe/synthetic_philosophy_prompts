  5.  **Reviewing against Constraints:**
      *   *Charitable Reading:* Is there a way (c) is right? Some might argue epistemic access is a *consequence*, but the prompt asks for the difficulty HS creates *for the Principal Principle*. The PP fails because $Cr(F | X)$ cannot equal $x$ if $F$ undermines $X$. The student says PP "can't be applied." That's weak. The PP is actually *false* (or needs modification) on Lewis's original view because of the contradiction. I need to flag this as a major conceptual error, not just a wording issue.
      *   *Uncertainty:* I need to flag to the TA to check if their specific lecture emphasized the epistemic angle (unlikely for Lewis, but possible). Standard Lewis scholarship (Hall, Thau, Lewis's "New Principle" paper) focuses on Undermining.
      *   *Reweighting:* (a) is worth more usually, but the prompt says 8/6/6. I'll stick close to that but emphasize (c) is where the points are lost.

