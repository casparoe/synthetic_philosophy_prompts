answer: |-
  There is no existing single term that captures this specific inconsistency. You are describing a rhetorical maneuver that hijacks two established concepts but violates the core condition of both.

  Here are the two nearest concepts, why they fail, and the term you should use instead.

  ### The Nearest Existing Concepts

  **1. Bernard Williams' "Ground Projects"**
  *   **The Match:** This is the philosophical source of your interviewees' language. Williams argued that utilitarianism fails because it threatens the "ground projects" and commitments that give a life substance and make it "worth living." It captures the "makes the life *mine*" register perfectly.
  *   **The Mismatch:** Williams treats integrity as a consistent constraint. If a project is truly constitutive of your identity, you cannot trade it away without psychological disintegration. Your subjects trade their "ground projects" for promotions and book deals without blinking. They are invoking Williams' defense without accepting Williams' cost.

  **2. Philip Tetlock's "Sacred Values" (or Baron & Ritov's "Protected Values")**
  *   **The Match:** This explains the refusal to price. In cognitive psychology, sacred values are those we refuse to trade off against secular goods (money, efficiency). Treating the comparison as a "category mistake" is a classic taboo trade-off response.
  *   **The Mismatch:** Sacred values are supposed to be *context-independent*. If your novel is sacred, you shouldn't trade it for a promotion any more than for charity. Your subjects' values are only sacred when the counter-offer is *moral*. When the counter-offer is *prudential* (status, money, love), the value becomes secular instantly.

  ### The Term You Should Use

  **Contingent Sacredness**

  **Definition:**
  > A personal interest treated as inviolable when challenged by moral obligation, but readily tradable when challenged by prudential gain.

  **Why this works:**
  It isolates the mechanism. It acknowledges the "sacred" rhetoric (the refusal to price, the identity claim) while flagging the "contingency" (the asymmetry between moral and selfish trade-offs). It is neutral enough for science writing but sharp enough to signal the inconsistency to a philosophically literate reader.

  **Boundary Cases (Where to draw the line):**

  *   **Just Above the Line (Not Contingent Sacredness):** A devout religious practitioner who refuses to work on Sundays. They turn down the promotion *and* the charity demand. This is genuine **Sacred Value**.
  *   **Just Below the Line (Not Contingent Sacredness):** A hobbyist who admits, "I love my garden, but if I could save 100 lives by paving it, I'd do it." This is an **Ordinary Preference**.
  *   **The Line (Contingent Sacredness):** The novelist who says, "You can't ask me to sacrifice my art for strangers; that's my life," but signs a contract requiring 12-hour workdays that kill the art for a 20% raise.

  Use **Contingent Sacredness**. It gives you the precision to distinguish between a genuine integrity objection and a self-protective shield, without accusing your subjects of lying. They aren't lying; they are engaging in motivated reasoning that elevates a preference to a principle only when necessary.
