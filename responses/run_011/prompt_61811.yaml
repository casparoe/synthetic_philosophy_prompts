  **Total Grade: 22 / 25**

  **Breakdown:**
  *   **Part (a):** 5 / 5
  *   **Part (b):** 10 / 10
  *   **Part (c):** 7 / 10

  ***

  **Comments for the Paper (Paste-able):**

  **(a) 5/5:** Excellent identification. You correctly name the Moral Equality of Combatants (MEC) and situate it within the Traditional (Walzerian) *jus in bello* framework, contrasting it accurately with Revisionism (McMahan). You capture the independence thesis clearly.

  **(b) 10/10:** Strong analysis. While many students target Premise (2), your identification of Premise (1) is philosophically defensible and well-argued. You correctly note that (1) assumes the moral equivalence ("doing the same thing") that revisionists deny. Your explanation that revisionists care about the *justice* of the threat, not just the *existence* of the threat, demonstrates a solid grasp of the core disagreement.

  **(c) 7/10:** Good engagement with the hypothetical, but there is a significant conceptual error regarding liability. You write: *"If unjust combatants are liable to be killed, they're on the hook as murderers... ought to be prosecuted."* This conflates **liability to defensive harm** with **criminal liability**. Revisionists (like McMahan) argue combatants can be liable to be killed without being moral criminals (due to excusing conditions like duress or ignorance). Liability makes killing them permissible; it does not automatically make *them* murderers. Additionally, be careful with the logic of the grant: if we grant (2), the revisionist objection (which denies 2) is logically blocked within the argument, even if the philosophical disagreement remains.

  ***

  **Full-Credit Benchmark (What was missing for 25/25):**

  To secure full points on Part (c), the answer needed to:
  1.  **Distinguish Liability from Criminality:** Explicitly state that being liable to attack does not entail being a war criminal or "murderer." Unjust combatants may be excused from blame even if they are liable to defensive force.
  2.  **Clarify the Hypothetical:** Acknowledge that granting Premise (2) logically negates the revisionist objection *within the bounds of the argument* (since Revisionism rejects 2), even if it highlights *why* they reject it.
  3.  **Refine the "Sharpening" Claim:** Instead of saying the objection becomes "sharper," explain that granting (2) forces the Revisionist to reject the argument's soundness entirely rather than just the conclusion.

  ***

  **TA Calibration Notes (For Thursday's Meeting):**

  *   **Defensible Move (Part b):** The student locates the "gap" in Premise (1) rather than the more common Premise (2). **Do not dock for this.** It is a sophisticated reading: if (1) claims combatants do the "same thing," and Revisionists argue they do *not* (because one threatens unjustly and one justly), then (1) is indeed the false premise. The student's explanation supports this valid interpretation.
  *   **Flat Wrong (Part c):** The conflation of **liability** with **criminal guilt/murder** is a substantive philosophical error in this field. McMahan's revisionism specifically decouples these. This is a valid place to deduct points (3 points deducted here).
  *   **Shaky but Passable (Part c):** The claim that granting (2) makes the objection "sharper" is logically ambiguous but shows the student understands the *source* of the disagreement. I gave partial credit here rather than failing the section because the core intuition (Revisionists reject the threat-only criterion) is present.
