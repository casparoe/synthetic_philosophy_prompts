answer: |-
  Your diagnosis of the dinner fight is correct: you were not arguing about facts, but about which dimension of a contested concept should count as the *real* measure of the thing. That is precisely why this makes an excellent seminar case study. It moves the conversation from "Who is right?" to "What are we measuring, and why?"

  Here is the conceptual geography you need to lay out for your students, structured to move from the definitions to the empirical friction points, and finally to the measurement pathologies that make the question unresolvable.

  ### 1. Disambiguating "Liberal"
  You identified three senses, but for the purpose of a social science seminar, we need to sharpen the conflict between them. The fight wasn't just about ambiguity; it was about incommensurability.

  *   **Market Liberalism (Economic):** Here, "liberal" means free exchange, low taxation, and weak state intervention.
      *   *The Comparison:* Both Sweden and Norway are social democracies with high tax burdens and strong welfare states. Compared to the US or UK, both are "illiberal."
      *   *The Differentiation:* Sweden has pursued more aggressive privatization within the welfare state (e.g., voucher systems in education and elderly care) than Norway. Norway's sovereign wealth fund represents massive state ownership of capital.
      *   *Verdict:* If "liberal" means market freedom, **Sweden** is marginally more liberal, but both are outliers on the global illiberal end. Using this definition makes the question trivial in the opposite direction of the American sense.

  *   **Social Liberalism (Personal Autonomy):** Here, "liberal" means the capacity to define one's own life, body, and relationships without moralistic interference.
      *   *The Comparison:* Both are global leaders in gender equality, LGBTQ+ rights, and secularism.
      *   *The Differentiation:* This is where the "State Individualism" paradox bites.
      *   *Verdict:* High similarity, but the *mechanism* of liberty differs (see below).

  *   **Coalitional Liberalism (The American Sense):** Here, "liberal" is a tribal marker for a specific package of left-economic and progressive-social views.
      *   *The Comparison:* You called this trivial, but it's actually a category error. In the US, "liberal" implies a specific correlation between economic redistribution and social permissiveness. In Scandinavia, these axes don't correlate the same way. A Swedish market-liberal might support free schools (economic) but strict drug laws (social). A Norwegian leftist might support state oil ownership (economic) but drug decriminalization (social).
      *   *Verdict:* This definition collapses under cross-national comparison. It measures cultural affinity with the US Democratic Party, not a political science variable.

  **The Seminar Point:** The dinner fight stalled because one side was likely using Market Liberalism (where Sweden wins slightly) and the other was using Social Liberalism (where the answer depends on how you view the state).

  ### 2. The Paradox of State Individualism
  You mentioned the Swedish historians' label (likely Lars Trägårdh's "Statist Individualism"). This is the crux of the theoretical problem.

  In classical liberal theory (Negative Liberty), the state is the primary threat to freedom. Freedom is the absence of interference. By this metric, high taxes and regulations in Sweden and Norway reduce liberty.

  However, in the Scandinavian model, the state is an *emancipator* from other forms of dependency.
  *   **Non-Interference:** The state interferes heavily (taxes, regulations).
  *   **Non-Domination:** The state reduces domination by private actors (employers, husbands, parents).

  **How this splits Sweden and Norway:**
  *   **Sweden** has historically leaned harder into statist individualism. Individual taxation (introduced earlier and more thoroughly) incentivized women to enter the workforce, liberating them from financial dependence on spouses. Public childcare is designed to make the individual independent of the family unit.
  *   **Norway**, while similar, has a slightly more conservative cultural undercurrent (partly due to the rural/religious demographic balance) and the oil buffer. The oil fund allows for wealth distribution that sometimes cushions families rather than forcing individual labor market attachment.

  **The Liberty Question:** Does a big state raise or lower liberty?
  *   If you define liberty as **Non-Interference**, the big state lowers it. (Norway might be slightly "freer" here simply due to marginally less aggressive restructuring of the family unit, though this is thin).
  *   If you define liberty as **Non-Domination** (Republican freedom), the big state raises it. You are free because you are not beholden to a husband for health insurance or a parent for housing. **Sweden** scores higher here because its institutions are more deliberately engineered to break familial dependency.

  ### 3. Discriminating Cases
  Aggregate indices (like Freedom House) wash out these differences. You need the specific policy divergences to see where the concepts pull apart.

  *   **EU Membership (Sweden Yes, Norway No):**
      *   *Market Liberal Reading:* Sweden is more liberal (free trade, open borders, market integration).
      *   *Republican Liberal Reading:* Norway is more liberal (protecting local democratic sovereignty from technocratic rule).
      *   *Seminar Takeaway:* The same fact supports opposite verdicts depending on whether you value market flow or democratic self-determination.

  *   **Drug Policy (The Strongest Differentiator):**
      *   *Sweden:* "Drug-Free Society." Zero tolerance. Punitive. High liberty interference for the sake of public health/morality.
      *   *Norway:* Recently moved toward decriminalization of use (treating it as a health issue, not a crime).
      *   *Verdict:* On bodily autonomy and protection from state coercion, **Norway** is currently more liberal. This is one of the few clear empirical wins for one side.

  *   **Sex Purchase Ban (The Nordic Model):**
      *   Both ban the purchase of sex. Sweden did it first (1999); Norway followed (2009).
      *   *Liberal Reading:* Both are illiberal (restricting consensual adult transaction).
      *   *Feminist Liberal Reading:* Both are liberal (protecting vulnerable sellers from exploitation).
      *   *Verdict:* Sweden is the *vanguard* of this specific illiberalism/liberalism. If you hate the ban, Sweden is worse. If you love it, Sweden is better.

  *   **Migration (Post-2015):**
      *   Sweden went from the most open regime in Europe to one of the most restrictive (tightening residency requirements, family reunification). Norway was always stricter.
      *   *Verdict:* Convergence. Currently, both are similarly restrictive. The *trajectory* shows Sweden moving illiberally faster, but the *state* is now similar.

  ### 4. Measurement Pathologies
  This is the core of your seminar. Why can't we just look up the index score?

  *   **Ceiling Effects:** Most freedom indices (V-Dem, Freedom House) are designed to distinguish democracies from autocracies. When you point them at Sweden and Norway, both hit the ceiling. The variance is noise. Ranking them 1st and 2nd is statistically meaningless when the score difference is within the margin of error.
  *   **Ordinal vs. Cardinal:** Indices produce numbers (cardinal), but they function as rankings (ordinal). A score of 98 vs. 99 does not mean the second country is 1% freer. It means they are in the same cluster. Treating the difference as substantive is a measurement error.
  *   **The Reference Group Problem:** If you use survey data ("Do you feel free?"), Scandinavians evaluate themselves against Scandinavian norms. A Swede might rate their freedom lower than an American because their expectation of autonomy is higher. The metric is culturally endogenous.
  *   **Locus of the Property:** Where does "liberalism" live?
      *   *In the State?* (Laws and regulations).
      *   *In the Society?* (Cultural norms like *Janteloven*—the law of Jante, which discourages individual boastfulness).
      *   *In the Individual?* (Actual lived experience).
      *   *The Conflict:* Sweden might have more "liberal" laws (state), but a more conformist culture (society). Norway might have slightly more conservative laws but a more rugged, individualist self-conception. If the locus is unclear, the measurement is invalid.

  ### 5. The Honest Verdict
  You asked me to land somewhere. Here is the verdict you should present to the seminar.

  **The question is Conceptually Underdetermined.**

  It is not merely that the data is hard to find (Empirical Underdetermination); it is that "Liberalism" is not a latent variable waiting to be discovered. It is a **cluster concept**.

  *   If you weight **Bodily Autonomy** heavily (drugs, sex work), **Norway** wins today.
  *   If you weight **Gender Independence/Non-Domination** heavily (welfare structure), **Sweden** wins.
  *   If you weight **Market Freedom** heavily, **Sweden** wins (slightly).
  *   If you weight **Sovereignty** heavily, **Norway** wins.

  There is no "God's eye view" weighting scheme. The dinner fight never got anywhere because your colleagues were implicitly arguing over which weights to assign, while pretending they were arguing over facts.

  **The Seminar Lesson:**
  The value of this case study is not to determine which country is more liberal. It is to demonstrate that **quantification does not resolve conceptual contestation.** When we turn "liberalism" into a number, we hide the normative choices required to build the index.

  *   **Step 1:** Show the students the indices where Sweden and Norway are tied.
  *   **Step 2:** Show the policy divergences (Drugs vs. Welfare).
  *   **Step 3:** Ask them to build their own index.
  *   **Step 4:** Reveal that their ranking depends entirely on whether they value freedom *from* the state or freedom *via* the state.

  **Critique of your framing:**
  You wrote: *"I'm now pretty sure we weren't even arguing about the same proposition."*
  You should be more confident than that. You *know* you weren't. The confusion wasn't a bug of the conversation; it was the feature. The fight *was* the data. The friction you felt was the sound of different political ontologies colliding.

  **Final Answer:**
  Is Sweden or Norway more liberal?
  **Sweden is more liberal in terms of emancipatory state capacity (freedom via the state).**
  **Norway is more liberal in terms of protection from state coercion (freedom from the state), specifically regarding drug policy and sovereignty.**
  **Neither is more liberal in the abstract,** because "abstract liberalism" does not exist as a measurable quantity. The question is a category error masquerading as a comparative politics puzzle. Use that error as the engine of your seminar.
