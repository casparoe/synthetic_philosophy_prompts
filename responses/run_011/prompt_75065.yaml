      *   *Application:* Sweden often leans harder into this (individual taxation earlier, stronger push for women's labor participation as independence). Norway has oil wealth which creates a different dynamic (more cushion, perhaps less pressure to maximize labor participation for survival, though participation is still high).

  4.  **Discriminating Cases (The Empirical Meat):**
      *   *EU Membership:* Sweden (Yes, 1995), Norway (No, twice).
