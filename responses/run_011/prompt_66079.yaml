answer: |-
  **The Composition of the Monster**

  The Special Composition Question asks under what conditions some things compose a further thing. Nihilism answers never: there are no composite objects, only simples arranged in various ways. On this view, Victor Frankenstein creates nothing; there are only simples arranged creature-wise, and the horror is a psychological projection onto a plurality that lacks unity. Universalism answers always: any plurality of things composes an object. Here, Victor creates infinitely many objects—the Creature, the Creature-minus-a-finger, the Creature-plus-the-table—though only one becomes alive. Universalists often motivate this view with the argument from vagueness: if composition is restricted, there must be a sharp cutoff where adding one part suddenly creates a whole, which seems absurd. Restricted views attempt to find a middle ground. Contact or cohesion theories suggest parts must touch or stick; on this view, the Creature exists once stitched, regardless of animation. Peter van Inwagen argues composition occurs only where the activity of the parts constitutes a life; for him, the Creature exists if and only if it is biologically alive, making the spark of animation the moment of ontological birth. Trenton Merricks suggests composition occurs only where the whole has causal powers not possessed by the parts acting in concert; the Creature exists if its consciousness is an emergent power dead flesh lacks. These views yield different verdicts: for the nihilist, there is no one to hold responsible; for the universalist, responsibility is diluted across infinite objects; for the restrictionist, the moral status hinges on the precise moment life or emergence begins.

  **Provenance and the Kind of Unity**

  The novel is insistent on the provenance of the Creature's parts. Victor gathers materials from charnel houses and dissecting rooms, assembling a body from the remains of other living beings. This history complicates the metaphysical classification of the result. Is the Creature an organism, an artefact, or a colony? If it is an artefact, its unity is imposed from without, like a statue. If it is an organism, its unity is internal and self-sustaining. The Creature resembles a siphonophore or a coral head, a colony that functions as one animal only in a loose and contested sense. The parts were once unified in other lives; now they are unified in this one. For van Inwagen, if the Creature is alive, it is a genuine object regardless of its history, because life is an intrinsic feature of how parts are organised at a time. However, the novel suggests that history matters morally even if it does not matter metaphysically. Victor treats the achieved unity as metaphysically inferior to grown unity, regarding the stitching as a violation of natural boundaries. This is not merely aesthetic disgust; it is a mereological anxiety. The Creature feels this inferiority too, describing himself as a blotched aggregate rather than a born whole. If being alive is partly a fact about where parts came from, then the Creature's existence is precarious, dependent on a lineage it lacks. The book does not resolve whether this hybrid unity is a third kind altogether, but it dramatises the terror of a unity that is manufactured rather than begotten.

  **Thresholds and Vagueness**

  The animation of the Creature is a threshold crossed, and Victor's destruction of the half-finished female is a threshold crossed in reverse. This raises the Sorites problem central to the argument from vagueness. At which removed part would the female creature have ceased to be a candidate for existence? Shelley does not locate these boundaries sharply. We do not know how much of the female was assembled before Victor tore her apart. This exploitation of unsharpness serves a literary effect, sustaining suspense and moral ambiguity. However, it also bears on the metaphysics. If restricted answers to the Composition Question are true, there must be a fact of the matter about when the female became a being worthy of destruction. If there is no sharp line, the universalist argues that restricted views are false. Shelley seems to suggest that vagueness about composition is a price worth paying, one that a novelist can make us feel rather than merely concede. The horror lies in the inability to say when the parts became a person. When Victor destroys the female, he is not just preventing a marriage; he is preventing a composition. The novel implies that the moral weight of the act depends on the metaphysical status of the assembly, yet it refuses to give us the criteria to settle that status. We are left with the intuition that destroying the assembly was wrong, even if we cannot say exactly what was destroyed. This supports the thought that any restricted answer will be intolerably vague, but it also suggests that living with that vagueness is part of the human condition. (Note: In the 1831 text, the method of animation is more obscure than in 1818, which heightens the vagueness of the threshold, making the life criterion harder to apply.)

  **Narrative Unity and Personal Identity**

  The Creature's embedded first-person account is the novel's most sustained argument for his standing. He tells a continuous story of his own development, from awakening to education to revenge. Does the book offer the telling of a continuous self-narrative as the ground of his being one thing? If so, this is a Lockean criterion of personal identity over time recruited to do synchronic work it was never meant to do. Locke asks what makes a person the same person across time; the Special Composition Question asks what makes some parts a single object now. The novel trades on this difference. The Creature's narrative unity convinces Walton and the reader that he is a single agent, but it does not strictly answer whether his body composes an object at any given moment. Shelley may be noticing the difference, suggesting that narrative coherence is the only unity that matters for moral beings. Alternatively, she may be conflating them, assuming that because the Creature remembers being one thing, he must be one thing. If the narrative is the ground of being, then the Creature exists only insofar as he can tell his story. When he vows to burn himself at the end, he is threatening not just death but ontological dissolution. This is a powerful literary move, but metaphysically strained. It suggests that for persons, composition is secured by psychology rather than physics. The book credits the Creature with noticing this; he knows that without a story, he is merely a collection of scars.

  **Victor's Implicit Mereology and the Walton Frame**

  Victor's actions reveal an inconsistent mereology. He flies from the Creature initially, refusing to acknowledge it as a being with a claim upon him. Later, he pursues it across the ice, treating it as a single enemy with a continuous will. He regards the Creature as one being when it suits his vengeance, and as an arrangement of stolen parts when it suits his guilt. Is his horror at a composite that should never have been composed, or at something the novel leaves deliberately unclear? It is likely both. He fears the existence of the thing, but also the fact of its composition. The Walton frame—a nest of recounted narratives, each contained within the next—acts as a structural image of this problem. Walton records Victor's record of the Creature's record. Each narrative is a part that composes a larger whole, yet each retains its own voice. This is not a coincidence; it mirrors the anxiety about whether the whole is greater than the sum of its parts. However, we should not build a chapter on the idea that the frame solves the metaphysical problem. It illustrates it. The frame shows how unity is constructed through testimony, just as the Creature's unity is constructed through assembly. Victor's implicit mereology is pragmatic: he accepts composition when it assigns blame, and denies it when it assigns responsibility.

  **Where the Reading Breaks**

  There are features of the novel that this lens cannot handle. Forcing the terminology of the Special Composition Question onto the emotional core of the book yields strained results. The murder of Elizabeth is not primarily a mereological event; it is a violation of domestic sanctity and a strike against Victor's happiness. To analyse it as the dispersal of parts is to miss the point. Furthermore, themes of gender, birth, and divine ambition are not reducible to questions of unity and plurality. Shelley is addressing the ethics of creation, not the metaphysics of objects. Importing the Special Composition Question risks distorting the book by treating it as a puzzle to be solved rather than a tragedy to be endured. The novel is not addressing our question directly; it is using the ambiguity of composition to generate horror. To insist on a sharp metaphysical answer is to resist the very vagueness that makes the story work. The honest case is that Shelley is not doing analytic metaphysics. She is using metaphysical anxiety to explore moral abandonment. A reading that focuses solely on composition may overlook the political and social dimensions of the Creature's exclusion. The lens is useful for understanding the ontology of the monster, but it blinds us to the sociology of the outcast.

  **Conclusion: The Stakes of Abandonment**

  What does the novel contribute that argument does not? Abandonment presupposes an answer to the composition question: there must be someone there to abandon. Philosophers argue about the conditions under which the Creature exists; Shelley shows the consequence of deciding that he does. A reader who has felt the force of that presupposition knows afterwards that the metaphysical question is not neutral. To say the Creature is an object is to incur a debt. The novel changes the stakes, not necessarily the truth conditions. It demonstrates that the Special Composition Question is not merely about objects, but about obligations. If the parts compose a person, Victor is a father. If they do not, he is a vandal. The journal article reader learns the conditions for composition; the novel reader learns the cost of getting it wrong. Shelley forces us to acknowledge that ontology is ethical. We cannot decide whether the Creature exists without deciding whether we owe him care. The novel thereby changes the question from "Under what conditions do parts compose a whole?" to "Under what conditions do we accept the wholes we have made?" The metaphysical uncertainty remains, but the moral imperative becomes sharp. We are left with the knowledge that even if composition is vague, abandonment is not.
