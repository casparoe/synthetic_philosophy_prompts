      *   **The Engineering Fix:**
          *   The "3 out of 5" hack is basically **Ensemble Variance**. It's useful but crude.
          *   Better: **Regularization** (L1/L2) to kill noise features.
          *   Better: **Cross-Validation** to select the feature set that generalizes.
          *   Conceptual Shift: Stop thinking about "The Reference Class." Think about "The Feature Vector." The model *constructs* the relevant reference class dynamically.
      *   **Addressing the "Theater" worry:** It's not theater if it predicts. The "Reference Class Problem" is a known issue in statistics (Goodman's "Grue"), but in practice, predictive power resolves it.

