      *   The "Reference Class Problem" is real (Hájek 2007), but it's not a showstopper for predictive modeling. It's a showstopper for *singular causal claims*. The user is making *probabilistic forecasts*.
      *   *Key Insight:* The user is treating the Hazard Model as a "Base Rate Calculator." It's not. It's a "Similarity Weighter."
