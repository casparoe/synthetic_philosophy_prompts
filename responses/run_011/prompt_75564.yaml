answer: |-
  The sea was inland and shallow. Five cities sat on its rim: Ostra, Velle, Kest, Morn, and Hal. Between them lay the water, and in the water lay the fish. The fish ran from the north feeding grounds to the south spawning beds, passing each city in turn. The cities caught the fish, salted them, and sold them. To sell them, the weight and the salt content had to be certified. That was the work of the Assay Office.

  The Assay Office sat on a rock in the center of the sea. It had no walls. It had no ships. It had clerks, scales, and chemical reagents. The clerks belonged to no city. They were paid in grain and oil, contributed by all five cities according to their catch. In return, the Office stamped the barrels. A stamped barrel could be traded in any port. An unstamped barrel was suspect. This system had worked for eighty years.

  The cities were alike. They all had harbors. They all had councils. They all had dredges to clear the silt from their channels. They differed only in size. Ostra was the largest, with the deepest harbor. Hal was the smallest, with the shallowest.

  In the sixtieth year of the system, the silt changed. It did not come from the rivers, but from the sea floor itself, stirred by a shift in the currents. The channels between the cities grew shallow. The dredges worked harder. The cost of fuel rose.

  The City of Hal was the first to struggle. Their channel silted faster than the others. Their ships grounded. They could not get their fish to the market. The Council of Hal asked the other cities for help. They proposed a joint dredging fund. Each city would contribute fuel and labor to clear the central channel, managed by the Assay Office.

  Ostra refused. Ostra's harbor was deep. The silt did not bother them yet. They argued that the fund would tax them disproportionately. They said it was a matter of fairness. Ostra's merchants said they should not pay for Hal's geography. This was true. Ostra's council voted to maintain their own channel only.

  Velle saw Ostra's decision. Velle's harbor was medium depth. They worried that if Ostra kept their channel clear, Ostra's ships would move faster. Ostra would get the fish to the market first. The price would drop for everyone else. Velle decided to dredge their channel too. They bought extra fuel. They hired more labor.

  Kest saw Velle buying fuel. Kest worried that Velle was stockpiling fuel for winter. If Velle had fuel and Kest did not, Kest would be vulnerable. Kest bought fuel. Morn saw the price of fuel rising. Morn bought fuel to hedge against inflation.

  The Assay Office watched the fuel purchases. They did not buy fuel. They certified the quality of the salt. But the salt quality depended on the speed of processing. If the ships were delayed by silt, the fish spoiled before salting. The Office's stamps began to show variance. Ostra's fish were Grade A. Hal's fish were Grade C. The market paid less for Hal's fish. Hal grew poorer.

  In the sixty-second year, the fish run shifted. The main body of the school moved closer to Ostra's northern nets. Ostra's catch doubled. Hal's catch vanished.

  This was an ecological event. No city caused it. But the distribution of capability changed. Ostra now had half the total wealth of the system. The other four cities shared the rest.

  Hal could no longer afford fuel. Their channel closed completely. Hal's council approached Velle. They proposed a merger. Hal would become a district of Velle. In exchange, Velle would clear Hal's channel and share the catch. Velle agreed. It was defensive. Velle needed the harbor space for their growing fleet. Hal needed food. There was no malice. It was arithmetic.

  Now there were four units: Ostra, Velle-Hal, Kest, Morn.

  The Assay Office noticed the merger. Their charter said they certified cities. Velle-Hal was a new entity. The Chief Clerk asked for new documentation. Velle-Hal sent the papers. The Office stamped them. But the Office noticed that Velle-Hal's ships were now escorting the grain shipments. Previously, grain moved unarmed. Now, Velle-Hal said it was to protect against pirates. There were no pirates. The escorts carried cannons.

  Kest saw the escorts. Kest's council argued that unarmed transport was the old standard. Armed transport changed the risk. If Velle-Hal could stop a shipment, they could blockade Kest. Kest could not allow this. Kest announced they would arm their own grain ships.

  Morn saw Kest arming. Morn could not afford cannons. Morn approached Ostra. They proposed a security pact. Morn would give Ostra preferential docking rights. Ostra would guarantee Morn's safety. Ostra agreed. Ostra needed the docking rights to offload their massive catch. It was defensive. Ostra did not want the fish to rot.

  Now there were three units: Ostra-Morn, Velle-Hal, Kest.

  The silt continued to rise. In the sixty-fourth year, the central channel narrowed. It was no longer a wide basin. It was a single groove between two sandbars. Only one ship could pass at a time.

  This changed the offense-defense balance. Before, the sea was wide. If one city blocked a path, another could go around. Defense was easy because attack was hard. Now, the channel was a choke point. Whoever controlled the dredge controlled the passage.

  The dredge was a machine for moving sand. It was not a weapon. But if the dredge stopped working, the channel silted shut. If the channel silted shut, the ships could not pass. If the ships could not pass, the fish could not be sold.

  The Velle-Hal union owned the largest dredge. They positioned it in the center of the channel. They said this was to maximize efficiency. One dredge was cheaper than three. They would clear the channel for everyone. They asked for a toll to cover costs.

  Ostra-Morn objected. They said the toll was too high. They said Velle-Hal could stop the dredge at any time. This would give Velle-Hal veto power over Ostra's trade. Ostra said they would dredge their own side.

  Velle-H said this was impossible. The sandbars were connected. Dredging one side would collapse the other. It was a technical fact. The engineers agreed. Only one dredge could work.

  Kest proposed a solution. The Assay Office should manage the dredge. The Office was neutral. They had no ships. They could hire the operators. The tolls would go to the Office.

  The Office considered this. They were clerks. They did not know how to run a dredge. But they knew how to manage accounts. They accepted the responsibility. It seemed to fit their function. They were the neutral certifier. Now they would be the neutral operator.

  For one year, this worked. The Office hired the crew. Velle-Hal provided the machine. Ostra-Morn provided the fuel. Kest provided the security. The channel stayed open. Trade flowed.

  Then the winter came. It was a hard winter. The sea froze. The dredge could not break the ice. The fish stopped moving. The cities relied on stored grain.

  Ostra had stored the most grain. They had the surplus from the big catch. Velle-Hal had less. Kest had very little.

  Ostra offered to sell grain to Kest. The price was high. Kest said this was exploitation. Ostra said it was market rate. Supply was low. Demand was high. This was true.

  Velle-Hal offered to break the ice for Kest. They had reinforced hulls. They could clear a path to Ostra's stores. They asked for a fee. The fee was a share of Kest's future catch.

  Kest refused both. Kest's council calculated that accepting either offer made them dependent. If they took Ostra's grain, they owed Ostra credit. If they took Velle-Hal's help, they owed Velle-Hal tribute. Dependency was a security risk.

  Kest decided to ration. They reduced consumption. People grew weak. The labor force shrank. The ability to maintain walls and ships declined.

  The Assay Office watched the rationing. They certified the grain reserves. They reported the numbers to all cities. The numbers were public. Everyone knew Kest was starving.

  Ostra argued that public numbers were destabilizing. They said knowing Kest was weak tempted Velle-Hal to attack. Velle-Hal argued that hiding the numbers was worse. They said transparency prevented surprise.

  The Office continued to publish. They believed truth was their function.

  In the spring, the ice melted. The channel opened. The dredge started. But the sandbars had shifted in the winter. The channel was now even narrower. The dredge could not pass without grounding.

  The engineers said the dredge needed a deeper berth. To make the berth, they had to dump the silt somewhere. The only place to dump the silt was into the harbor of Morn.

  Morn was part of the Ostra pact. Ostra refused permission. They said dumping silt in Morn's harbor would damage their ships. This was true. Silt abrasion ruined hulls.

  Velle-Hal said the dredge must stop. If the dredge stopped, the channel would close in a month. If the channel closed, Ostra's fish could not reach the southern markets.

  Ostra calculated the loss. They could sell locally, but the price was lower. They would lose wealth. But if they allowed the dumping, Morn's harbor would be damaged. Morn's ships would be useless. Ostra would lose naval capacity.

  Ostra chose to protect capacity over wealth. They refused the dumping.

  Velle-Hal said they had no choice. They had to feed their people. The channel was their only trade route. They began to dump the silt anyway. They did it at night.

  Ostra's patrols saw the dumping. They fired warning shots. Velle-Hal's escorts returned fire. No one was killed. The ships withdrew.

  The channel silted shut.

  Now the system broke. The Assay Office could not certify fish that did not move. Their revenue stopped. They had grain reserves for six months. After that, they would starve.

  The Office sent envoys to Ostra and Velle-Hal. They asked for emergency funding. They reminded the cities that without certification, trade was impossible. Even if the channel opened, no one would trust the barrels.

  Ostra said they would create their own certification. They had the volume. They could set the standard. Anyone who wanted to buy Ostra fish would accept Ostra's stamp.

  Velle-Hal said they would do the same.

  The Office realized they were no longer necessary. The system had moved from five units to two. In a five-unit system, a neutral arbiter was valuable. It reduced transaction costs. In a two-unit system, the arbiter was a bottleneck. Each pole could enforce its own standard within its sphere.

  The Chief Clerk resigned. He was not fired. He left because there was no work. The scales were packed away. The reagents were sold.

  Kest starved. They did not die out, but they became a client state of Velle-Hal. They gave up their ships. They gave up their foreign policy. They became a provider of labor.

  Morn remained with Ostra. They became a forward base.

  The sea was now divided. North and South. The channel remained closed. Ships went around the long way, through the open ocean. The cost of transport tripled. The price of fish rose. People ate less.

  Ostra and Velle-Hal built walls. Not against each other, but against the uncertainty. They stored more grain. They built more ships. They said it was for defense. Each saw the other's storage as preparation for siege.

  The offense-defense balance had flipped. Initially, the sea protected everyone. Distance was defense. Now, the choke point made distance irrelevant. Control of the channel was control of life. But the channel was closed. So control of the ships was control of life. Ships could go anywhere.

  The system stabilized at two units. It was stable because neither could defeat the other. Ostra had the food. Velle-Hal had the channel access (though blocked). They were locked.

  The Assay Office rock sat empty. The gulls nested on the scales.

  In the seventy-first year, the currents shifted again. The silt moved. The channel opened slightly. It was passable for small boats.

  Ostra sent a boat. Velle-Hal sent a boat. They met in the middle. They did not fight. They measured the depth. They exchanged data. They agreed the channel was usable.

  They did not reopen the Assay Office. They did not merge. They established a new protocol. Ostra's stamp was valid in the North. Velle-Hal's stamp was valid in the South. If trade crossed the line, both stamps were required.

  This increased costs. It slowed trade. It reduced wealth. But it prevented war.

  The cities believed they were safe. They had secured their supplies. They had secured their borders. They had acted rationally at every step. Hal had sought survival. Velle had sought efficiency. Ostra had sought market access. Kest had sought independence. The Office had sought neutrality.

  The result was a poorer system. The total catch was lower. The total consumption was lower. The security was higher, but the wealth was lower.

  The clerks of the Assay Office found work in the city bureaucracies. They became auditors. They checked the grain counts for Ostra and Velle-Hal. They wore the livery of the cities now. They were no longer neutral.

  The sea remained. The silt remained. The fish ran. The cities watched each other. They counted ships. They counted barrels. They waited for the next shift in the current.

  ***

  **Afterword**

  This story cheats. Structural realism claims to explain outcomes through system structure—anarchy, distribution of capability—while ignoring unit-level attributes. But a story requires specific actors making specific choices. I could not show "structure" without showing people. When Ostra refuses the dredging fund, is that structural constraint or Ostra's greed? I wrote it as rational calculation, but the reader sees a council voting. That is unit-level politics.

  The offense-defense flip was driven by silt (ecology), which fits the constraint. But the consolidation from five units to two required political mergers (Hal joining Velle). Structural theory predicts balancing or bandwagoning, but not necessarily administrative merger. I used merger to make the math visible. That is a simplification. Real states rarely dissolve so cleanly.

  The Assay Office was the test. Theory says like units survive. The Office was unlike. It failed. This supports the theory: the system punished the outlier. But its failure was decided by the Chief Clerk's resignation. A structural account should not depend on a resignation. It should depend on budget lines. I gave it a human exit because narratives need endings.

  Your assignment asks for a story about a crisis. Structural realism explicitly denies it can explain specific crises. It explains recurrence, not events. Waltz argues structure constrains behavior, it does not determine specific outcomes. By asking for a plot, you are asking for unit-level causality disguised as structural inevitability. I have given you the disguise.

  An honest exercise would not be a story. It would be a simulation of variables: change the capability distribution, observe the survival rates of neutral institutions. Or, compare multiple historical cycles to show the pattern, stripping away the names and dates. A story forces me to lie and say *this* decision caused *that* war. Structure says the war was waiting to happen; the decision was just the spark. If you want to teach structure, do not ask for a narrative. Ask for a map of constraints. Narratives are inherently unit-level. They require villains, heroes, or at least choices. Structure allows none of these. It only allows pressure. I have written about pressure, but I had to give it hands.
