answer: |-
  I take the horn that I speak of names and not beasts, but I reject your claim that this is trivial, for the distinction between a compound name and a simple name is the foundation of order.

  You ask how I can grant that a white horse is an animal while denying it is a horse, and you blame my tongue for hiding the truth. In your language, you use the same sound "is" to say that a thing belongs to a group and to say that one name is identical to another, but I make no such confusion. When I say "horse," I name the shape; when I say "white," I name the color; when I say "white horse," I name the compound of both. If you seek a horse, a yellow one suffices; if you seek a white horse, a yellow one fails. If the names were identical, the seeking would be identical. I do not deny the living creature stands before us; I deny that the name "horse" captures the actuality of the "white horse." To say the compound is the simple is to erase the color from the world, and if you can erase the color here, you can erase the distinction between a loyal minister and a loyal minister who steals, simply because both are "ministers."

  You ask if this has any use beyond trolling patrons who pay for wisdom. If a ruler cannot distinguish between the name of a general and the name of a general who has lost a banner, he cannot punish the loss. My method trains the mind to see that adding a specification changes the identity of the request. When the court understands that "white horse" is not "horse," they understand that "tax for defense" is not "tax for pleasure," and "promise" is not "promise made under duress." If you tell your section this is merely about words, tell them that laws are merely words, yet we kill men for breaking them. I did not confuse my rulers; I warned them that when names are muddled, the hundred surnames have nowhere to rest their hands and feet, and a state that cannot distinguish its requests will soon find itself unable to fulfill them.
