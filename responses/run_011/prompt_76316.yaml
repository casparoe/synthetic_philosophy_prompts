prompt: |-
  I'm a health economist, about fifteen years doing value of information work for a public payer, so EVSI and EVPPI, influence diagrams, decision rules, sensitivity analyses, the whole apparatus is basically how I think at this point. A philosopher friend has been at me for months about an argument she says her field has on its side: Good's theorem on the value of information. Her version is that a Bayesian expected-utility maximizer is never worse off in expectation for having observed something before choosing, so there's a principled bridge from evidence to action, and from there they want to get to the claim that knowledge is the norm of practical reasoning — that if you know p you're entitled to treat p as a reason to act, and that if you merely have a high credence in p you aren't, no matter how high.

  Translate that argument into my vocabulary as faithfully as you can, premise by premise rather than just the conclusion, and don't quietly import my framework's assumptions and then call the result a translation. Then give me the residue report, which is the only part I really care about. Which steps turn out to be literally an EVSI calculation wearing a costume? Which ones did you have to stretch to make fit, and where exactly does the stretch happen? Which ones have no expression at all in a framework where every doxastic state is a number strictly between zero and one and the only thing you can do with it is maximize against it? Specifically: does "knowledge is the norm of practical reasoning" come out as a claim about a threshold on credences — in which case it's just a dressed-up restatement of something I already knew about when to stop collecting data — or is it something my vocabulary can't even state, let alone argue about?

  And be straight with me about which side the residue indicts. Part of me suspects the theorem is doing less work than she thinks. The "never worse off" seems to hold only because the decision maker can always ignore the data, and in my own models the value of information goes negative the moment the results become public and a competitor moves on them first, or the moment the analyst cant credibly commit to ignoring what they've seen, or the moment the person being studied changes behavior because they know they're being measured. I've never seen the philosophers allow for any of that. Tell me whether that's a real hole in their argument or whether I'm just describing a different decision problem than the one they're theorizing about, and if it's the latter, say what has to be true of a decision problem before their move goes through.

  Please write it as continuous prose, the way you'd write an email to a colleague — no headings, no bullet points, no bold, no tables. I want to read it straight through in one go.
