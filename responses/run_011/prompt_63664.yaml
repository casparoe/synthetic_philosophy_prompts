      *   Concessions, Killer Reply, Forbidden Question.
      *   Tone: Professional, prepared, slightly defensive but confident.

  8.  **Drafting the Content (incorporating the "Voice" requirement):**
      *   *Counsel:* "Liability," "Misrepresentation."
