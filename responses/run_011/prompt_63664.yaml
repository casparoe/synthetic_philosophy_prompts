answer: |-
  **PREP SHEET: EXHIBITIONS COMMITTEE PITCH**
  **PROJECT:** "Reperformance" of 18th-Century Drawing (Iron Gall/Wash)
  **STATUS:** 6 Weeks to Pitch

  ### THE EIGHT OBJECTIONS (Ranked by Lethality)

  **1. General Counsel (The Liability/Deception Risk)**
  *   **The Objection:** "If a donor gave us money to preserve *this* object, does commissioning a substitute violate their intent? And if a visitor photographs this and it ends up on the market as 'authentic' because our labeling wasn't read, are we liable for facilitating fraud?"
  *   **The Reply:** "We treat this not as a collection object but as an exhibition prop, like a mannequin in a costume display. It will not be accessioned into the permanent collection. We will include a specific disclaimer on the wall text regarding reproduction rights, and the verso will be permanently marked 'Recreation 2024.' We are not selling it, and we are not claiming it is the artifact."
  *   **The Soft Spot:** I'm bluffing on the market fraud risk. If a high-res photo of the remake leaks, I can't control what happens to it online. If it surfaces at an auction house, our name gets dragged through the mud regardless of our disclaimer.

  **2. Paintings Conservator #1 (The Ethics Code)**
  *   **The Objection:** "This violates the AIC Code of Ethics. We are creating false historical evidence. You're proposing we introduce an object into the gallery that claims to show a process we cannot verify. That's not conservation; it's fabrication."
  *   **The Reply:** "I am not asking Conservation to do this. I am asking the museum to commission an external artist for an educational intervention. This is a performance artifact, not a conservation treatment. It documents a hypothesis about technique, not the history of the object's aging. We are distinguishing between the history of the *sheet* and the history of the *image*."
  *   **The Soft Spot:** The line between "performance artifact" and "false evidence" is thin. If the Art History Chair buys into it as a teaching tool, Conservators will feel overruled on ethical grounds. I'm hoping they stay in their lane.

  **3. Director (The Precedent/Budget)**
  *   **The Objection:** "If we do this for a drawing, why not a painting? Why not a sculpture? This opens a door where we stop preserving things and start paying artists to pretend. Plus, where does this money come from? Conservation storage is underfunded."
  *   **The Reply:** "This is a pilot for light-sensitive works on paper only, where the alternative is total invisibility. We aren't replacing conservation; we are solving the access problem that conservation creates. The cost is one commission fee, not a permanent increase in overhead. It drives traffic to see the 'real' thing in the study room."
  *   **The Soft Spot:** I don't have the budget line secured yet. If they ask me to cut the education budget to pay for this, I have to say yes, and that will hurt me later.

  **4. Board Member/Dealer (The Market/Brand)**
  *   **The Objection:** "You are diluting the brand. If we become known as the museum that hangs copies, it lowers the prestige of the originals. Collectors want to see the real thing. If they can't, they'd rather we didn't show it at all than show a fake."
  *   **The Reply:** "The original remains the asset. This project highlights *why* the original is valuable—because it is fragile and unique. It creates a narrative of scarcity. We are telling the donor community: 'Your gift is so precious we won't even let light touch it, but we want to share its story.'"
  *   **The Soft Spot:** Some dealers hate "reproductions" on principle. If he feels strongly that this makes us look cheap, he can whisper to other board members to kill the funding. I can't argue taste with a check-writer.

  **5. Art History Chair (The Pedagogy)**
  *   **The Objection:** "I teach students to look at the hand of the master. If you put a 21st-century hand on the wall, even a skilled one, you are teaching them bad connoisseurship. They will learn to recognize modern stroke patterns, not 18th-century ones."
  *   **The Reply:** "We label the pedagogical goal explicitly: this is a lesson in material constraints, not style. We want students to see the *sequence* of the ink application, which the foxing on the original hides. It's a technical diagram, not a stylistic substitute."
  *   **The Soft Spot:** He's right. Students *will* confuse the two if they aren't forced to compare them side-by-side, which we can't do because of the light. I'm hoping the labeling is aggressive enough to prevent this.

  **6. Registrar (The Cataloging Nightmare)**
  *   **The Objection:** "Where does this live in the database? If it's not accessioned, how do we insure it? If it is accessioned, how do we ensure it doesn't get mixed up with the original in fifty years when we're all dead?"
  *   **The Reply:** "It gets a temporary exhibition number, not a permanent accession number. It is tracked as an exhibition asset, like a loan. We will link the record digitally to the original's file so the connection is permanent, but the physical records remain distinct."
  *   **The Soft Spot:** Registrars hate temporary records that become permanent problems. In 20 years, someone will find this in storage and wonder why it's not accessioned. I'm betting on digital metadata holding up, which is a gamble.

  **7. Director of Visitor Experience (The Trust)**
  *   **The Objection:** "Visitors feel lied to when they find out something isn't real. It breaks the trust. If the label is too text-heavy, they won't read it. If it's too simple, they'll miss the distinction."
  *   **The Reply:** "We use a traffic light system. Green dot for original, clear red dot for recreation. The title wall says 'Original in Storage / Recreation on View.' We make the distinction part of the experience, not a footnote."
  *   **The Soft Spot:** People skim labels. If a school group comes in and the docent says 'Here is the drawing,' the damage is done. I can't control every docent's script perfectly.

  **8. Paintings Conservator #2 (The Material Impossibility)**
  *   **The Objection:** "You say 'period paper and inks.' You can't get that. Modern water is different. Modern air is different. This will look like a costume, not a reconstruction. It will age differently within a year."
  *   **The Reply:** "We aren't promising molecular identity. We are promising functional identity. The ink will behave similarly enough to demonstrate the wash technique. We accept it will age differently; that's actually part of the data we want to collect."
  *   **The Soft Spot:** This is the biggest scientific bluff. If the ink corrodes the new paper in six months, the project looks incompetent. I'm hoping it holds for the 6-month run, but I haven't accelerated aged the test samples yet.

  ***

  ### STRATEGIC MOVES

  **The Concessions (First 5 Minutes)**
  *   **Say this:** "I want to be clear: This object will **not** be accessioned into the permanent collection. It is an exhibition tool, like a scale model."
  *   **Say this:** "The labeling will not be subtle. We will explicitly state 'Recreation' in the title line, not just in the fine print."
  *   **Why:** This disarms Counsel (not a permanent asset), Registrar (no cataloging headache), and Visitor Exp (no deception). It lowers the stakes immediately.

  **The Single Reply That Must Land**
  *   **The Line:** "We have a choice between an object that exists in the dark and an image that exists in the light. A facsimile print gives you the image, but it hides the *making*. This project gives us the *making*. It is the only way to show the students how the drawing was built without destroying the evidence of how it has survived."
  *   **Why:** It pivots from "copy" (cheap) to "research" (valuable). It appeals to the University mission (teaching/research) over the Museum mission (collecting).

  **The Question I'm Praying Nobody Asks**
  *   **The Question:** "When this recreation fades in ten years, do we commission another one? And another? Are we committing the museum to a perpetual cost of replacing fakes?"
  *   **Why:** It exposes the sustainability flaw. If the remake is light-safe, it's not accurate. If it's accurate, it's not light-safe. I don't have a long-term plan for the lifecycle of the remake other than "we'll cross that bridge then."
