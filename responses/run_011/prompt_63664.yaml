      *   **Core Argument:** Value lies in *reperforming the making*, not duplicating the surface.
      *   **Audience (Committee):** 2 Paintings Conservators, Registrar (provenance), Art History Chair (old-school connoisseur), General Counsel, Board Member (OM drawing dealer), Director of Visitor Experience.
      *   **Constraints:** No art theory/philosophy jargon ("keep it practical"). Need ~8 objections ranked by damage potential, phrased in each member's voice. Need 2-minute replies + "soft spot/bluff" admission. Need concessions, the "killer reply," and the "forbidden question."
      *   **Format:** Prep sheet, actionable sentences, no reading lists.

  2.  **Deconstruct the Proposal & Identify Risks:**
      *   *Authenticity/Deception:* Is this a fake? (Registrar, Dealer, Counsel)
      *   *Conservation Ethics:* Does this violate AIC codes? (Conservators)
      *   *Scholarly Value:* Does this undermine connoisseurship? (Art History Chair)
      *   *Visitor Confusion:* Will people think it's real? (Visitor Experience)
      *   *Precedent:* Does this open a floodgate? (Director, Counsel)
      *   *Cost/Resource:* Is this worth the money vs. buying storage? (Director, Registrar)

  3.  **Drafting the Objections (Iterative Process):**
      *   *Goal:* 8 objections, ranked by damage potential, specific voices.
      *   *Ranking:* High damage = Legal/ethical/financial dealbreakers. Low damage = Philosophical nitpicks (though the prompt says avoid theory, so focus on practical implications).
      *   *Voices:*
          *   Conservators: Material stability, ethics of "faking."
          *   Registrar: Accession numbers, provenance confusion, storage records.
          *   Art History Chair: Loss of "aura," confusing students about the original hand.
          *   General Counsel: Liability, donor restrictions, deception.
