      *(Self-Correction on Objection 1)*: The General Counsel is the biggest risk. If they say "No," it's over. Their concern is deception.
      *(Self-Correction on Objection 2)*: Conservators are the next biggest risk. If they say it violates AIC code, the museum's reputation tanks.
      *(Self-Correction on Objection 3)*: The Director controls the budget. If they think it's a money pit, it dies.

      *Let's finalize the 8 objections.*
