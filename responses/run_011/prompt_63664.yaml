      *Refining for "Damage Potential":* The biggest threats are Legal/Deception (Counsel), Ethics (Conservators), and Money/Precedent (Director). The Dealer's worry about market value is secondary for a university museum but still potent. The Registrar's worry about cataloging is solvable but annoying.
      *Let's reorder:*
      1. Counsel (Deception/Liability)
      2. Conservators (Ethics/Standards)
      3. Director (Budget/Precedent)
      4. Dealer (Market/Authenticity stigma)
      5. Art History Chair (Pedagogy/Connoisseurship)
