  5.  **Developing the Strategic Elements:**
      *   *Concessions:* What to give up early to gain trust? (e.g., It won't be accessioned as an original, labeling will be aggressive).
      *   *The One Reply:* The core argument that justifies the expense/effort. (It's not a copy; it's an experiment in material history).
      *   *The Forbidden Question:* The one thing that exposes the flaw. (e.g., "What happens when *this* drawing fades?")

  6.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Check:* Did I avoid art theory? Yes, keep it about logistics, ethics, and money.
