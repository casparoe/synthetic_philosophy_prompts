      *   *Reply to Conservators:* Focus on "research artifact" not "conservation treatment."
      *   *Reply to Director:* Focus on PR/Engagement value vs. cost.
      *   *Reply to Dealer:* Focus on the original staying in storage (protecting the asset).

      *The "One Reply":* Needs to be the pivot from "copy" to "research."
      *The "Forbidden Question":* Likely about the longevity of the *new* drawing or the cost vs. buying a different object. Let's go with longevity of the new drawing. If the new one fades in 5 years, the project looks stupid.

  7.  **Final Review against Constraints:**
      *   No reading lists.
