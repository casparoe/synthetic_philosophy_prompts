answer: |-
  Here is a reconstruction of the dialectical pattern you have identified, broken down according to your four questions.

  ### 1. Names for the Move and the Worry

  The defensive move itself has a standard technical name: **Outcome Individuation** (sometimes **Consequence Individuation** or **State-Space Refinement**). When the defender claims the agent's description of the prize was too coarse (e.g., "$50" vs. "$50 plus the feeling of security"), they are arguing for a finer individuation of outcomes.

  The worry that this renders the theory empty has a standard name as well: **The Vacuity Objection** (or **The Triviality Threat**). The charge is that if any preference pattern can be modeled as expected utility maximization simply by redescribing the outcomes, the theory imposes no substantive constraints on rational choice.

  There is a third term that captures the *context* in which this move operates: the distinction between **Small Worlds** and **Grand Worlds**. A "Small World" is a decision problem where the states and outcomes are described coarsely (e.g., just the monetary payoffs). A "Grand World" is one where the outcomes include *everything* the agent might care about, including the psychological experience of the gamble, the epistemic state, and the causal history. The orthodox reply you describe is effectively an insistence that the counterexample was posed in a Small World, but that the theory properly applies only to the Grand World.

  **Confidence:** High. These are the standard terms of art in formal decision theory for the mechanism (individuation), the objection (vacuity), and the scope (Small/Grand World).

  ### 2. Nearest Concepts and Precise Distinctions

  You correctly noted that this is not quite *ad hoc*-ery in the Popperian sense, nor is it a "No True Scotsman" move. Here is how it carves apart from its nearest neighbors:

  *   **Vs. Ad Hoc Modification:** An *ad hoc* modification changes the *theory* to fit the data (e.g., adding a new parameter to the utility function). In the move you describe, the theory (the axioms of Expected Utility) remains perfectly rigid. The *ontology* of the case changes, not the *nomology* of the theory.
  *   **Vs. Semantic Redefinition:** This is not merely changing the meaning of the word "utility." The defender claims the initial description was *factually incomplete*, not semantically confused. They assert that the agent *really did* choose between outcome A and outcome B, where A and B were richer than the challenger supposed. It is an ontological claim about what constitutes the object of choice.
  *   **Vs. Ceteris Paribus Clauses:** A *ceteris paribus* clause holds background conditions fixed to isolate a variable. Here, the defender argues the background conditions were *not* fixed in the agent's valuation (e.g., the "worry" was not held constant between the sure thing and the gamble). The move denies the isolation rather than asserting it.

  **The Crucial Carving:** The distinctive feature of your pattern is **Theoretical Conservation via Ontological Expansion**. The theory is conserved intact; the ontology of the decision situation is expanded to absorb the anomaly.

  ### 3. Principled Criteria and the Relocation of Difficulty

  Is there a limit to how finely we may individuate? Yes, but it is contentious. The standard principled criterion is **Agent-Relative Relevance** (sometimes framed as **Causal** or **Experiential Relevance**).

  *   **The Criterion:** A distinction between two outcomes is legitimate only if the agent *cares* about that distinction or if that distinction makes a causal difference to the agent's experience. If the agent is indifferent between "$50 described in red ink" and "$50 described in blue ink," individuating by ink color is illegitimate gerrymandering. If the agent cares about "having taken a risk," that is a legitimate feature of the outcome.
  *   **Does it Restore Content?** Generally, no. It **relocates the difficulty**.
      *   In a Small World, Expected Utility Theory (EUT) is substantive: it forbids certain preference orderings over simple prizes (like the Allais pattern).
      *   In a Grand World (where outcomes include all psychological and epistemic features), EUT becomes **formally valid but substantively thin**. It tells you that you must maximize expectation, but it no longer tells you what counts as a risk or a loss, because those attitudes are baked into the utility of the Grand World outcomes themselves.
      *   The normativity shifts from the *structure of the choice* (the axioms) to the *measurement of the utility* (the description of the outcomes). The theory is saved from refutation, but it loses its power to criticize the agent's attitudes toward risk, ambiguity, or fairness, as those attitudes are now defined as part of the "prize."

  **Confidence:** High on the criterion (Relevance) and the effect (Relocation). Moderate on whether this counts as a "loss" of content, as some orthodox theorists argue formal consistency *is* the only content rationality should have.

  ### 4. Coining a Concept for the Meta-Pattern

  While "Outcome Individuation" names the move, and "Vacuity" names the worry, there is no single established term for the *dialectical shape* you identified: the universal availability of the move to shield the theory from any counterexample by expanding the description of the world.

  I propose the term: **Descriptive Inflation**.

  *   **Definition:** A defensive dialectical strategy in which a theory is protected from falsification not by modifying its axioms, but by inflating the descriptive complexity of the data points (outcomes, states, or agents) until they conform to the axioms.
  *   **Inside the Scope:**
      *   The EUT defense against Allais/Ellsberg (inflating outcomes to include risk-preferences).
      *   The defense of Rational Choice Theory in economics when agents appear to act altruistically (inflating "utility" to include "warm glow").
      *   Functionalism in philosophy of mind when a mental state doesn't fit the causal role (inflating the description of the causal role).
  *   **Outside the Scope:**
      *   **Ad Hoc Theory Change:** Adding a "risk parameter" to the theory itself (as Risk-Weighted EUT does) is *not* Descriptive Inflation; it is Theoretical Modification.
      *   **Error Theory:** Claiming the agent is simply irrational or mistaken is *not* Descriptive Inflation; it accepts the description but rejects the agent's coherence.
      *   **Semantic Stipulation:** Simply defining "utility" as "whatever is chosen" without ontological expansion is **Operationalism**, not Descriptive Inflation. Inflation requires adding *features* to the world, not just renaming the relation.

  **Confidence:** Medium. This is a reconstruction tailored to your description. While the components are standard, this specific label for the meta-pattern is my own formulation based on the structure you provided.

  ### Confidence and Least Sure Point

  I am **highly confident** in the identification of "Outcome Individuation" and the "Small World/Grand World" distinction as the technical machinery you are observing. I am **highly confident** that the effect of this move is to relocate normativity from the axioms to the utility function.

  The point on which I am **least sure** is your recollection regarding the originator of the framework (Savage). You recalled that he thought extending the framework beyond tidy settings was "indefensible." My reconstruction is that he viewed the "Grand World" application as *theoretically ideal* but *practically impossible* for humans to compute, rather than *indefensible* in principle. He argued that we must use Small Worlds for practice, provided they are "ethically neutral" relative to the Grand World. Whether he thought the *orthodox reply* you describe (using Grand World to defend Small World failures) was legitimate is a matter of interpretive debate. I am less certain about the specific strength of his skepticism regarding the *defense* versus the *application*.
