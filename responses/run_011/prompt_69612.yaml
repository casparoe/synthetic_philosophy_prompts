prompt: |-
  I run the research desk at a small documentation NGO — five analysts, we write reports on things like mass detentions, forced displacement, attacks on hospitals — and every report goes through legal review before publication, then usually gets a furious rebutal from the government involved within a week or two. Our recurring problem is the gap between "we have a lot of evidence for this" and "we can say we know this," and right now that call is made by whoever is most senior in the room, which means it's inconsistent from report to report. A few years back I did an evening philosophy course and got hooked on Nozick's tracking account in *Philosophical Explanations* — the idea that knowing is believing truly by a method that wouldn't have let you believe it if it were false. Sensitivity, he calls it. And then the mirror-image one, adherence: if it were true, you'd believe it. Both of those feel like things you could actually ask an analyst to do with a claim, unlike "justification," which nobody in my office can cash out.

  So: write me a procedure my analysts can run on a single factual claim from a draft report, in about fifteen minutes, with no philosophy background, producing something a lawyer can read and challenge. I want the questions in the order they should be asked. That includes: how you construct "the nearest situation in which the claim is false" without just imagining whichever false-world is most convenient; how narrowly the method has to be specified before you test it (the grandmother case is supposed to show what goes wrong when you let the method drift, and I want that lesson turned into a rule rather than a parable); when sensitivity comes out trivially satisfied because the false-world is so far away that no method would fire there anyway, and why that shouldn't be scored as a pass; when adherence is the test really doing the work — for us that's often "if the pattern were true but slightly different, would our collection method have picked it up at all," which is basically a coverage question; and where the procedure has to stop and hand the claim to a human because what's left isn't a tracking question but a question about how much reputational and legal risk we're willing to carry.

  Then be honest with me about closure. If sensitivity is the standard, it looks like we can know each of twelve individual testimonies without knowing the summary claim they jointly entail, and our reports are almost entirely summary claims — so tell me whether that's a bug to design around, a reason to use a different condition for the summary layer, or just something we live with and disclose. Finally, run the procedure on three cases and make sure one of them comes out against us: (1) twelve witnesses interviewed independently describe the same checkpoint routine, and we'd like to say we know it was standing policy rather than improvisation; (2) a satellite image series showing dated new earthworks at a site a defector described as a detention facility — the earthworks are real, but nothing in the imagery says what happens inside; (3) one named source, corroborated only by documents we can't authenticate, saying a specific order was given in writing — the government's rebuttal will be that we coudn't have known, and honestly I think they're right, but I want the procedure to show me why instead of just agreeing with my gut. Also point out which steps an analyst who wants a particular verdict can game, and what the procedure can't deliver no matter how carefully it's followed.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **User:** Research desk lead at a small documentation NGO (5 analysts).
      *   **Task:** Create a 15-minute procedure for analysts to evaluate a single factual claim using Nozick's Tracking Theory (Sensitivity and Adherence) instead of traditional "justification."
      *   **Constraints:** No philosophy background required, output must be readable/challengeable by lawyers, specific questions in order.
      *   **Key Philosophical Concepts to Operationalize:**
          *   Sensitivity: If $P$ were false, would we believe $P$? (Method wouldn't yield belief if false).
          *   Adherence: If $P$ were true, would we believe $P$? (Method would yield belief if true).
          *   Method Specification: Avoiding the "Grandmother Case" (method must be fixed, not drifting).
          *   Trivial Sensitivity: Avoiding passes where the false world is too distant.
          *   Adherence as Coverage: If the pattern were true but different, would we catch it?
          *   Risk Threshold: Where the procedure stops and human judgment on risk begins.
      *   **Closure Problem:** Address the aggregation problem (knowing 12 testimonies $\neq$ knowing the summary claim). Is this a bug, a feature, or a disclosure issue?
      *   **Case Studies:** Run the procedure on three specific cases:
          1.  12 witnesses on checkpoint routine (Policy vs. Improvisation).
          2.  Satellite imagery + Defector (Earthworks exist, function unknown).
          3.  Single source + unauthenticated docs (Written order). *Must fail this one.*
      *   **Meta-Analysis:** Identify gamable steps and limitations of the procedure.

  2.  **Deconstruct Nozick for NGO Work:**
      *   *Standard Epistemology:* Justified True Belief (JTB). Problem: "Justification" is vague and legalistic.
      *   *Nozick's Tracking:* $S$ knows $P$ via method $M$ iff:
          1.  $P$ is true.
          2.  $S$ believes $P$ via $M$.
          3.  If $P$ were false, $S$ would not believe $P$ via $M$ (Sensitivity).
          4.  If $P$ were true, $S$ would believe $P$ via $M$ (Adherence).
      *   *Translation to Documentation:*
          *   $P$: The factual claim (e.g., "Hospital was bombed intentionally").
          *   $M$: The investigation method (e.g., "Interviewing 3 witnesses + analyzing shrapnel").
          *   Sensitivity: If this *didn't* happen (or happened differently), would our method still have produced this report? (False Positive Check).
          *   Adherence: If this *did* happen (perhaps slightly differently), would our method have detected it? (False Negative/Coverage Check).
          *   Method Fixation: We must define $M$ *before* testing. We can't say "Our method is 'looking at evidence'" because that changes depending on what evidence exists. It must be "Interviewing X type of source" or "Analyzing Y type of imagery."

  3.  **Drafting the Procedure (The "Tracking Audit"):**
      *   *Goal:* 15 minutes, actionable, legal-ready.
      *   *Structure:*
          1.  Define Claim ($P$) and Method ($M$).
          2.  Fix the Method (Prevent drifting).
          3.  Sensitivity Test (The Counterfactual).
          4.  Adherence Test (The Coverage).
          5.  Risk Handoff.
      *   *Addressing Specific User Concerns:*
          *   *Nearest False World:* Need to constrain this. Not "any false world," but "the most plausible alternative explanation."
          *   *Grandmother Case:* Rule: Method $M$ is fixed *before* looking at the specific outcome. You can't change the method to fit the result.
          *   *Trivial Sensitivity:* If the false world is "Aliens did it," sensitivity is trivial. We need the *relevant* false world (e.g., "It was an accident, not an attack").
          *   *Closure:* Need to address this in the "Honesty" section, not necessarily the 15-min procedure (which is for single claims), but the procedure needs to flag when a claim is a *summary* claim.

  4.  **Developing the Case Studies:**
      *   *Case 1 (Checkpoint):* 12 witnesses.
          *   $P$: Standing Policy.
          *   $M$: 12 independent interviews.
          *   Sensitivity: If it were improvisation, would 12 people say the same thing? Maybe (if they coordinate). If they are independent, sensitivity is high.
          *   Adherence: If it were policy, would we find 12 people? Yes.
          *   *Verdict:* Passes Tracking, but Closure problem applies (Policy is a summary of acts).
      *   *Case 2 (Satellite + Defector):*
          *   $P$: Site is a detention facility.
          *   $M$: Satellite imagery + 1 defector.
          *   Sensitivity: If it were *not* a detention facility (e.g., a warehouse), would imagery + defector still say it is? Imagery shows earthworks (neutral). Defector might lie. Sensitivity is weak.
          *   Adherence: If it *were* a detention facility, would imagery show it? Not necessarily (could be inside existing buildings).
          *   *Verdict:* Fail Sensitivity/Adherence on the *function* claim.
      *   *Case 3 (Single Source + Unauth Docs):*
          *   $P$: Written order exists.
          *   $M$: 1 source + unauthenticated docs.
          *   Sensitivity: If no order existed, would we still believe it? Yes, source could lie, docs could be forged.
          *   *Verdict:* Fail Sensitivity. (This meets the user's requirement).

  5.  **Addressing Closure (The "Bug"):**
      *   Nozick's tracking is notorious for failing closure (Knowing $P$, Knowing $P \to Q$, but not Knowing $Q$).
      *   In NGO work: We know the testimonies ($P_1...P_{12}$), but do we know the Pattern ($Q$)?
      *   *Advice:* Don't try to fix it philosophically. Treat summary claims as *new* claims requiring their own method (e.g., "Pattern Analysis Method"). Disclose the gap. It's a feature, not a bug—it prevents overreach.

  6.  **Refining the Procedure (Iterative Polish):**
      *   *Tone:* Professional, directive, pragmatic.
      *   *Formatting:* Checklists, bold text for emphasis.
      *   *Legal Readiness:* The output needs to look like a memo appendix.
      *   *Gamability:* Analysts might widen the "Nearest False World" to make sensitivity easier, or narrow the "Method" to make it look more robust. Need controls.

  7.  **Final Review against Constraints:**
      *   15 minutes? Yes, if kept to one claim.
      *   No philosophy background? Terms defined operationally.
      *   Lawyer readable? Yes, structured as an audit.
      *   Case 3 fails? Yes.
      *   Closure addressed? Yes.
      *   Gamability identified? Yes.

  8.  **Drafting the Content (Mental Outline & Writing):**
      *   *Intro:* Acknowledge the Nozick influence, set the stage.
      *   *The Procedure:* "The Tracking Audit." 5 Steps.
      *   *Step 1 (Claim & Method):* Crucial to lock the method.
      *   *Step 2 (Sensitivity):* Define the "Nearest False World" (NFW). Not "anything false," but "plausible alternative."
      *   *Step 3 (Adherence):* Coverage check.
      *   *Step 4 (Triviality Check):* Ensure NFW isn't too far.
      *   *Step 5 (Risk Handoff):* Where epistemology ends and liability begins.
      *   *Closure Section:* Honest talk about aggregation.
      *   *Case Studies:* Run the audit on the three scenarios.
      *   *Limitations/Gaming:* Where analysts can cheat.

      *(Self-Correction during drafting)*: I need to make sure I don't get too bogged down in Nozick jargon. Use "False Positive Check" for Sensitivity and "Coverage Check" for Adherence, but keep the philosophical terms in parentheses for the user's benefit.
      *(Refining the Grandmother Case)*: The grandmother case is about method relativity. If I see grandma is well, I know she is well. But if she were sick, she would hide it, so I would still believe she is well. So I don't *know*. The method is "Looking at her." In the NGO context: If the method is "Trusting Source X," and Source X lies when false, I don't know. The rule is: Define the method *independently* of the specific truth of the claim.
      *(Refining Trivial Sensitivity)*: If the claim is "The sun rose," the false world (sun didn't rise) is physically impossible. Sensitivity is trivial. In NGO work, this means don't test against "Magic." Test against "Government Denial Narrative."

      *(Final Polish on Case 3)*: Make sure the failure is clear. The method is "Single Source + Unverified Doc." In the nearest false world (No order), the source still lies and the doc is still there (forged). So we *would* believe it. Sensitivity fails.

      *(Final Polish on Closure)*: Be clear: Tracking theory *does not* preserve closure. This is a known philosophical feature. For an NGO, this means you cannot simply aggregate "Known Facts" into a "Known Conclusion" without a new method for the conclusion.

      *(Gamability)*: Analysts can game the "Nearest False World" by making it too crazy (making sensitivity easy) or define the Method too broadly ("All available evidence") which hides weaknesses.

      Let's write it.cw
answer: |-
  ## The Tracking Audit: A Procedure for Factual Claims

  **Purpose:** To replace subjective "confidence levels" with a structured test of whether our evidence *tracks* the truth. This determines if we can claim **Knowledge** (publish as fact) or merely **Belief** (publish as allegation or withhold).
  **Time:** 15 minutes per claim.
  **Output:** A one-page "Tracking Memo" appended to the draft report for Legal Review.

  ---

  ### Part 1: The Procedure

  **Step 1: Lock the Claim and the Method (3 Minutes)**
  *   **The Claim ($P$):** Write the specific factual assertion. It must be a single proposition, not a paragraph.
      *   *Bad:* "The government is abusing prisoners."
      *   *Good:* "On 14 March, guards at Site X beat Prisoner Y with batons."
  *   **The Method ($M$):** Define *exactly* how we arrived at $P$. You must specify the *type* of evidence, not just "research."
      *   *Rule (No Drifting):* You cannot change $M$ after seeing the result. If you used "Three witness interviews," $M$ is "Three witness interviews," not "Available testimony."
      *   *Write:* "We believe $P$ based on Method $M$."

  **Step 2: Construct the Nearest False World (4 Minutes)**
  *   **The Task:** Describe the **Nearest False World (NFW)**. This is the most plausible scenario where $P$ is *false*, but the situation on the ground looks almost the same.
      *   *Constraint:* You cannot use "Magic" or "Conspiracy" unless there is evidence for it. The NFW must be the specific alternative narrative the government or a skeptic would plausibly argue.
      *   *Example:* If $P$ is "Airstrike hit hospital," NFW is not "No explosion happened." NFW is "Airstrike hit the military compound next door, and debris caused the hospital damage."
      *   *Write:* "In the NFW, [describe plausible alternative] is true instead of $P$."

  **Step 3: The Sensitivity Test (False Positive Check) (4 Minutes)**
  *   **The Question:** If the Nearest False World were real, would Method $M$ still have produced belief in $P$?
  *   **The Test:** Imagine the NFW is true. Run your Method $M$ in that world.
      *   If $M$ still says "$P$ is True," then $M$ is **Insensitive**. You do not know $P$. (You would believe it even if it were false).
      *   If $M$ says "$P$ is False" or "Unclear," then $M$ is **Sensitive**.
  *   *Write:* "In the NFW, Method $M$ would [still produce $P$ / fail to produce $P$]."

  **Step 4: The Adherence Test (Coverage Check) (2 Minutes)**
  *   **The Question:** If $P$ were true, but varied slightly (within the range of normal error), would Method $M$ still have picked it up?
  *   **The Test:** This checks for blind spots. If the event happened slightly differently, would we be silent?
      *   *Example:* If $P$ is "Artillery fired from Location A," but our method only detects fires from Location A *during daylight*, Adherence is low.
  *   *Write:* "If $P$ varied slightly, Method $M$ would [still detect it / miss it]."

  **Step 5: The Risk Handoff (2 Minutes)**
  *   **Decision:**
      *   **Pass:** Sensitive + Adherent. (Ready for Legal Risk Assessment).
      *   **Fail:** Insensitive OR Non-Adherent. (Claim must be downgraded to "Allegation" or dropped).
      *   **Trivial Pass Warning:** If the NFW in Step 2 was physically impossible or wildly implausible (e.g., "The witnesses were all hallucinating"), mark **TRIVIAL**. A trivial pass is a **Fail**. Sensitivity only counts if the NFW is a *live option*.
  *   **Handoff:** This procedure does not assess legal liability. It assesses epistemic stability. A "Pass" means "We aren't guessing." It does not mean "We can't be sued."

  ---

  ### Part 2: The Closure Problem (Honesty Check)

  You asked about the aggregation issue: *Can we know the twelve testimonies but not the summary claim?*

  **The Hard Truth:** Under Tracking Theory, **Closure Fails.**
  Knowing $P$ (Witness 1 is truthful) and Knowing $Q$ (Witness 2 is truthful) does **not** automatically mean you Know $P \land Q$ (The pattern is real), because the Method for verifying the *pattern* is different from the Method for verifying the *individuals*.

  *   **Is this a bug?** No. In your line of work, it is a safety feature. It prevents "creep," where ten "alleged" incidents magically become one "proven" policy without new evidence.
  *   **How to design around it:** You must treat Summary Claims (e.g., "This was State Policy") as **new claims** requiring their own Tracking Audit.
      *   *Method for Individual Claim:* Interview witness.
      *   *Method for Summary Claim:* Cross-reference 12 interviews + look for written orders + analyze chain of command.
  *   **Disclosure:** Do not try to hide this. In your methodology section, state: *"Individual incidents are verified independently. Patterns are established only where the verification method for the pattern itself satisfies sensitivity and adherence."* This inoculates you against the charge that you are "assuming" a pattern exists just because you have enough data points.

  ---

  ### Part 3: Case Studies

  Here is the Tracking Audit applied to your three scenarios.

  #### Case 1: The Checkpoint Routine (12 Witnesses)
  *   **Claim ($P$):** The checkpoint routine was standing policy, not improvisation.
  *   **Method ($M$):** 12 independent witness interviews describing identical routines.
  *   **Nearest False World (NFW):** The routine was improvisation, but witnesses coordinated their stories afterwards (collusion) or were coached by a third party.
  *   **Sensitivity Test:** In the NFW (Collusion), would $M$ (12 interviews) still produce belief in $P$?
      *   *Result:* **Yes.** If they coordinated, 12 interviews look the same as 12 independent truths.
      *   *Verdict:* **FAIL SENSITIVITY.** The method cannot distinguish between "Shared Truth" and "Shared Lie."
      *   *Correction:* To pass, $M$ must include something that breaks collusion (e.g., "12 interviews + internal memo confirming orders").
  *   **Adherence Test:** If it were policy, would we find 12 witnesses? Yes. (Pass).
  *   **Final Status:** **DOWNGRADE.** You know 12 people *say* it happened. You do not yet know it was *policy*.

  #### Case 2: Satellite Imagery + Defector
  *   **Claim ($P$):** The site is a detention facility.
  *   **Method ($M$):** Satellite analysis of earthworks + 1 defector testimony.
  *   **Nearest False World (NFW):** The site is a military warehouse (earthworks match), and the defector is lying or mistaken about the function.
  *   **Sensitivity Test:** In the NFW (Warehouse), would $M$ still produce belief in $P$?
      *   *Result:* **Yes.** Earthworks look similar for warehouses and prisons. One defector can lie.
      *   *Verdict:* **FAIL SENSITIVITY.** The method yields the same result in the false world.
  *   **Adherence Test:** If it *were* a detention facility, would $M$ detect it?
      *   *Result:* **Weak.** Detention can happen inside existing buildings without new earthworks.
      *   *Verdict:* **FAIL ADHERENCE.**
  *   **Final Status:** **DROP/REPHRASE.** You know there are earthworks. You know a defector *says* it's a prison. You do not know it *is* a prison.

  #### Case 3: Single Source + Unauthenticated Docs
  *   **Claim ($P$):** A specific written order was given by General Z.
  *   **Method ($M$):** 1 named source + possession of a document copy (unauthenticated).
  *   **Nearest False World (NFW):** No order was given. The source is fabricating the story and forged the document (or found an old unrelated one).
  *   **Sensitivity Test:** In the NFW (Fabrication), would $M$ still produce belief in $P$?
      *   *Result:* **Yes.** If the source is willing to lie, they will provide the document. Our method relies on trusting that source.
      *   *Verdict:* **FAIL SENSITIVITY.** (This is the failure you suspected).
  *   **Adherence Test:** If the order *were* real, would $M$ find it?
      *   *Result:* Maybe. But since Sensitivity failed, it doesn't matter.
  *   **Final Status:** **FAIL.** The procedure confirms your gut. You cannot claim knowledge here because your method does not filter out the most plausible lie.

  ---

  ### Part 4: Gamability and Limitations

  **Where Analysts Can Game the System:**
  1.  **Rigging the NFW (Step 2):** An analyst who wants to publish can make the NFW absurd (e.g., "The NFW is that all witnesses were hypnotized"). This makes Sensitivity trivially easy to pass.
      *   *Control:* The Legal Reviewer must approve the NFW. It must be the *Government's likely rebuttal*, not a strawman.
  2.  **Drifting the Method (Step 1):** An analyst can define $M$ vaguely ("Comprehensive research") so that in the NFW, they can claim "Well, comprehensive research would have caught that."
      *   *Control:* $M$ must be listed as specific inputs (e.g., "3 interviews," "2 satellite images"). If it's not listed, it's not part of $M$.
  3.  **The "Trivial Pass" Loophole:** Claiming Sensitivity is satisfied because the false world is "Impossible."
      *   *Control:* The Step 5 "Trivial Pass Warning" forces them to admit if the NFW wasn't a live threat.

  **What This Procedure Cannot Deliver:**
  1.  **Absolute Truth:** Tracking is about the *relationship* between belief and truth, not access to Truth itself. You can pass the audit and still be wrong (if you are in the rare world where the method failed).
  2.  **Moral Certainty:** This procedure does not tell you if the violation is "bad enough" to publish. It only tells you if you *know* it happened.
  3.  **Closure:** As noted, you cannot aggregate passing claims into a passing summary without a new audit. This will slow down your reporting on "Patterns" and "Policies." You must accept this friction as the cost of accuracy.

  **Final Recommendation:**
  Implement this as a **"Tracking Memo"** required for any claim marked "Confirmed" in your database. If a claim fails Sensitivity, it is automatically downgraded to "Alleged" in the text. This shifts the burden from "Convince the Senior Editor you're right" to "Show why the False World wouldn't fool your method." It makes the epistemology explicit, defensible, and consistent.
