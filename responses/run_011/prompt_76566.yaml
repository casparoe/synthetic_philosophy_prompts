answer: |-
  The principle that reconciles your verdicts is what I call **The Locus of Control**. It can be stated without jargon as follows:

  > **A latent property belongs to a thing only when the engine that drives it sits inside the thing, and the brake that stops it is not part of the thing's own design.**

  This rule relies on two checks. First, the **Source Check**: Does the power to produce the effect come from the object's own nature? Second, the **Boundary Check**: Is the mechanism that prevents the effect internal to the object's defining boundaries, or is it an external circumstance?

  Here is how this principle maps onto your five cases:

  1.  **Reactive Monomer:** The chemical potential (engine) is inside the monomer. The inhibitor (brake) is an additive stored *with* it, not part of the monomer's molecular design. **Verdict: Still reactive.** (Source In, Brake Out).
  2.  **High-Voltage Line:** The charge (engine) is in the line. But the drain (brake) is wired directly to the device, making it part of the system's integrated design. We judge the "device," not just the copper. **Verdict: Not live.** (Source In, Brake In).
  3.  **Viral Strain:** The machinery to infect (engine) is inside the virus. The immunity (brake) belongs to the host, a separate entity. **Verdict: Still infectious.** (Source In, Brake Out).
  4.  **Disease Gene:** The mutation (engine) is in the genome. The silencer (brake) is also in the genome. Both are part of the same biological blueprint. **Verdict: Not a disease gene.** (Source In, Brake In).
  5.  **Intact Glass:** The guarantee of shattering comes from a law of the world, not the glass's structure. The glass itself supplies no force toward breaking. **Verdict: Not fragile.** (Source Out).

  ### Predictions for New Cases

  Applying the Locus of Control to your three untested scenarios yields the following:

  *   **The Drug and Antidote:** A drug fatal to anyone who takes it but *never dispensed without an antidote*.
      *   **Analysis:** The toxicity (engine) is internal to the molecule. The antidote (brake) is external to the molecule, but the constraint "never dispensed without" makes it part of the *protocol's* design. However, unlike the HV line where the drain is wired to the hardware, here the pairing is procedural. If we judge the *molecule*, the brake is external. If we judge the *treatment*, the brake is internal.
      *   **Prediction:** Following your Monomer verdict (where storage conditions didn't negate reactivity), the drug remains **fatal** in principle, though the *regimen* is safe. If the antidote were chemically bonded or co-packaged as a single unit (like an EpiPen), the verdict would flip to **safe**.
  *   **The Structural Cable:** A cable rated to fail under a load a redundancy system would always redistribute first.
      *   **Analysis:** The tendency to snap (engine) is in the cable material. The redundancy (brake) is built into the structure the cable serves. Like the HV line, the safety mechanism is integral to the engineering system.
      *   **Prediction:** The cable is **not a point of failure**. In an engineering report, you would not label it "liable to snap" any more than you would call the HV line "live." The property is negated by the integrated design.
  *   **The Radioactive Source:** A source sealed in shielding it can never escape.
      *   **Analysis:** The emission (engine) is internal to the isotope. The shielding (brake) is a container, external to the source itself (like the tank for the monomer).
      *   **Prediction:** Still **radioactive**. The shielding masks the hazard, but the property remains intrinsic to the material, matching your monomer verdict.

  ### The Cost of the Principle

  There are verdicts this principle cannot save without becoming circular. The most significant is the **Boundary Problem**. The principle works only if we agree on where "the thing" ends and "the world" begins.

  *   **The Ambiguous Case:** Consider a bomb with a failsafe wired inside its casing. Is it "live"?
      *   If "the thing" is the explosive charge, the brake is external (the casing/wiring). Verdict: Live.
      *   If "the thing" is the delivered weapon system, the brake is internal. Verdict: Not live.
      *   **The Cost:** The Locus of Control cannot tell you which boundary to draw; it only tells you what follows once you have drawn it. Your intuitions shifted between the Monomer and the HV line because you implicitly drew the boundary around the *chemical* in one case and the *device* in the other.

  Is this account too baroque to be worth believing? No, but it is **context-dependent**. It reveals that latent properties are not just facts about matter; they are facts about how we choose to group matter into systems. For a general-interest magazine, this is a feature, not a bug. It allows you to explain that safety, reactivity, and risk are not inherent truths, but descriptions of where we decide to stop looking for the cause.
