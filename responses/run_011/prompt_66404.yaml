answer: |-
  Yes, a single coherent principle exists: **A benefit is permissible only if it sustains social reciprocity within visible community norms, and impermissible if it treats public authority as a private asset for personal gain.**

  This principle distinguishes between *integration* (doing what is required to function within a society) and *appropriation* (using office to extract exclusive value). The "visible community norms" clause handles cultural variance without relativism: a wedding envelope is visible and normative in one context, a garage envelope is secret and non-normative in all contexts. The "private asset" clause handles the corruption risk: public power belongs to the office, not the person.

  Here is how the principle resolves your flagged pairs:

  *   **The Bottle:** At New Year, the bottle sustains social reciprocity (normative timing). Three days before tender, it treats access as a private asset (instrumental timing). The object didn't change, but its function shifted from relationship maintenance to influence peddling.
  *   **The Envelope:** At the wedding, the cash is visible community norm (social reciprocity). In the garage, it is secret and exclusive (private asset). The secrecy confirms the intent to privatize the transaction.
  *   **The Governor:** Routing the road to his district uses public authority for public ends (the district elected him for this). Steering the contract to his brother treats public authority as a private asset for family gain. The distinction is the beneficiary: the constituency vs. the bloodline.
  *   **The Daughter:** Hiring while permits are pending treats authority as a private asset (quid pro quo). Hiring six years later *looks* like deferred compensation for past authority. Your hesitation to approve this in writing is the principle working correctly: it is difficult to prove this isn't a delayed payout for past favors.

  Applied to your two new cases:

  *   **Hospital Bills (5 Years Later):** **Impermissible.** This is deferred compensation. Even if no discretion exists now, paying past debts treats the former official's past status as a private asset that retains value. It creates a market for future behavior by past officials.
  *   **Lobbyist Dinners (Junior Staff):** **Impermissible.** Regular, exclusive access creates a private channel outside visible norms. Even with "nothing pending," it builds a debt of reciprocity that treats the staff's access as a private asset to be cultivated rather than a public resource to be managed.

  To remain coherent, you must overrule two of your intuitions, and you should not patch them:

  1.  **The Daughter (6 Years Later):** You want to say "fine," but your refusal to approve it in writing is the correct compliance verdict. Allowing this creates a "cooling-off" loophole where officials know they can cash out later. The principle demands you treat deferred compensation with the same suspicion as immediate compensation because the incentive effect on past decisions is identical.
  2.  **The Chief's Son (University):** Your uncertainty is correct, but leaning "fine" is risky. If the payment is purely charitable and diffuse (like the school roof), it is fine. If it is targeted at the chief's lineage to build a specific debt, it treats the chief's influence as a private asset. You cannot approve this without verifying it is not an investment in future access.

  Regarding your worry about two standards: You are not applying two standards. You are applying one standard ("private asset vs. social reciprocity") to different social realities. In the country where the wedding envelope is normative, refusing it breaks the social reciprocity required to function. In your home country, that same envelope would be seen as privatizing authority. The principle holds constant; the input (what counts as a visible norm) changes. Trust the hesitation you feel on the daughter and the mining chief; that is the principle signaling where social reciprocity ends and private appropriation begins.
