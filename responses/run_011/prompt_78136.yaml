answer: |-
  Here is a reading that tries to hold the tension without collapsing *Lear* into a case study or Confucianism into a prop.

  ### 1. Cordelia and the Rectification of Names
  You are right that Cordelia sounds like a role-ethicist, but the trap is viewing her silence as a rejection of the role. In the Ames/Rosemont framework, there is no "Cordelia" prior to "daughter." So when she says "nothing," she isn't withdrawing herself; she is withdrawing *false speech* that would corrupt the relation.

  Read her through *Zhengming* (Rectification of Names). Lear's demand—"Which of you shall we say doth love us most?"—is a command to falsify the name "daughter." He is asking for a performative utterance that treats filial piety as a commodity to be traded for land. Goneril and Regan comply; they separate the name from the reality, turning ritual (*li*) into empty performance. Confucius says if names are not rectified, language does not accord with truth, and people do not know where to put hand or foot. Cordelia refuses to put her hand or foot in a false place.

  This makes her not a limit-case for role ethics, but its primary exemplar in a corrupt court. Crucially, you need to bring in the doctrine of remonstrance (*jian*). Filial piety is not blind obedience. The *Classic of Filial Piety* and later Confucian texts insist that if a parent is moving toward unrighteousness, the child *must* remonstrate, gently but firmly. Cordelia's "bond" speech is remonstrance. She is telling Lear: *You are acting like a King who does not know what Kingship is, and a Father who does not know what Fatherhood is.*

  So, to answer your specific worry: She is not exposing what role ethics can't handle (the good occupant/bad giver); she is demonstrating that the "bad giver" is actually failing the metaphysics of personhood. Lear thinks he is the source of the roles (he gives them away); Cordelia knows the roles are the source of the persons. She isn't stuck with a bad role-giver; she is trying to save the role-giver from destroying the very structure that sustains him. The Confucian diagnosis is that Goneril and Regan are "small men" (petty people) who seek profit, while Cordelia is the "superior person" who seeks rightness. The Shakespearean diagnosis overlaps but adds the tragic cost: in a world where the sovereign violates *Zhengming*, the rectifier gets banished.

  ### 2. Abdication and the Shun Inversion
  Your intuition on Shun is sharp. Let's tighten it. In the *Mengzi*, Shun abandons the Empire (political role) to preserve the Father (familial role). He prioritizes the root. Lear attempts the inverse: he tries to abandon the substance of the political role (rule/revenue) while keeping the name ("additions to a king"), and he demands the familial role be performed as a tribute to that hollow name.

  Lear treats "King" as a noun, a piece of property he owns and can parcel out. Confucianism treats "King" as a verb, a pattern of action. You cannot "keep the name" without doing the work. The play then unfolds exactly as the *Analects* predicts: because the name was not rectified at the start, affairs do not get completed, ritual and music do not flourish, and punishments miss their mark (Gloucester's eyes, Cordelia's death).

  Is the storm doing work the doctrine can't do? No. The storm is the physical manifestation of the collapse of *Zhengming*. In early Chinese thought, cosmic disorder mirrors human disorder. When the human ruler loses the Way, nature becomes chaotic. The storm isn't a supernatural intervention; it's the environment reacting to the ontological error Lear committed on the dais. He tried to split the inseparable. The storm is the universe saying: *You cannot be a King without a Kingdom, and you cannot be a Father without a Duty.*

  ### 3. The Heath: A Hard Stand
  You asked me not to split the difference, so here is the cut: **The heath scene confirms role ethics; it does not refute it.**

  When Lear tears off his clothes and speaks of "unaccommodated man," he is not discovering an ontological truth; he is suffering a delusion of negation. He thinks he is finding the "real" Lear beneath the robes. Role ethics says there is no "beneath." There is only "alongside."

  Look at what actually happens in that scene. Lear does not find a solitary self. He finds Poor Tom (Edgar), the Fool, and Kent. He forms a *new* community of suffering. His compassion ("O, I have ta'en too little care of this") does not arrive because the roles are gone; it arrives because his specific role (King) has been shattered, forcing him into a more fundamental role (Human among Humans). If there were a residual self outside of roles, he would be alone in his head. Instead, he is intensely focused on the "poor naked wretches" out there in the world.

  The horror isn't that there is no self without roles. The horror is that without *proper* roles (King/Subject, Father/Daughter), human life is reduced to the "bare forked animal" state of mere survival and exposure. The compassion is the seed of *Ren* (humaneness) sprouting in the ashes of *Li* (ritual). Lear becomes truly "human" (in the Confucian sense of *Ren*) only when he loses the specific social status that blinded him. The play argues that you cannot find humanity by stripping away relations; you find it by recognizing your relation to the suffering other. Lear's mistake is thinking he is stripping down to a self; the play shows he is stripping down to a *network*.

  ### 4. Where the Reading Breaks
  This is where you must be honest with the students, or you risk the "comparative ventriloquism" you fear.

  **First, the death of Cordelia.** Confucian role ethics is ultimately optimistic about cosmic order. There is a confidence that if one rectifies names and cultivates *Ren*, order will follow, or at least one's moral integrity will be preserved by Heaven. *Lear* breaks this. Cordelia does everything right. She rectifies the name, she remonstrates, she returns with an army to save the father. And she is hanged. The play suggests a universe where role-ethical perfection does not guarantee survival, or even meaningful order. The "Mandate of Heaven" in *Lear* looks suspiciously like silence.

  **Second, the value of Interiority.** Ames and Rosemont are wary of the "inner/outer" split, focusing on public performance and relational conduct. *Lear* is obsessed with the "inside." "I have that within which passeth show." The play validates the private, interior experience of suffering as a site of truth distinct from social performance. When Lear goes mad, he isn't just failing a role; he is accessing a truth about the world that his sane, role-bound self could not see. Confucianism might view madness as a loss of self-control/ritual propriety; *Lear* views it as a tragic necessity for insight.

  **Third, the Ending.** Confucianism aims for restoration. *Lear* ends in exhaustion and silence ("Break, heart; I prithee, break"). There is no new King immediately stepping in to rectify the names (Edgar's final speech is weak compared to the carnage). The play leaves us with the cost of the error, not the correction of it.

  ### 5. What the Play Adds to the Debate
  Theory describes the structure of personhood; tragedy describes the *phenomenology* of losing it.

  Role ethics can explain *why* Lear is wrong metaphysically. But *Lear* shows us what it *feels like* to be a person constituted by roles when those roles are violently severed. It captures the visceral panic of "Who am I if I am not this?" It adds the dimension of pain to the metaphysics.

  Furthermore, the play identifies a specific trap in role ethics that the *Analects* doesn't fully stress: **The demand to verbalize the role.** The Love Test is a demand to make the implicit explicit. Confucianism relies on the unspoken understanding of the bond. Lear forces it into language, and in doing so, kills it. The play suggests that some roles can only exist as long as they are not interrogated. The moment you ask "Do you love me according to the bond?", the bond is already broken. *Lear* adds the insight that the *questioning* of the role is itself a violation of the role.

  ### 6. Discussion Questions
  1.  **On Remonstrance:** Cordelia says she loves Lear "according to my bond." If Confucianism demands a child remonstrate with a parent who is doing wrong, is Cordelia's silence in Act 1, Scene 1 actually a failure of filial piety? Did she owe him more words to save him from himself, or was her refusal to play the game the only way to preserve the truth of the bond?
  2.  **On the "Bare" Self:** When Lear tears off his clothes on the heath, he claims he is finding "unaccommodated man." If Ames and Rosemont are right that there is no such thing, what is Lear actually experiencing in that moment? Is it a revelation of truth, or is it the specific madness of a man who thinks he can exist outside the relations that made him?
  3.  **On Cosmic Justice:** In the *Mengzi*, Heaven supports the virtuous. In *Lear*, Cordelia dies. Does this ending force us to reject the Confucian optimism about cosmic order, or does Cordelia's death affirm her role-ethical integrity precisely because she remains true to the "bond" even when the universe offers no reward for it?
