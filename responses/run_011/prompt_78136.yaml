      *   "Heath scene: Take a stand." -> Check.
      *   "Where reading breaks." -> Check.
      *   "What play adds." -> Check.
      *   "Discussion questions." -> Check.

  7.  **Final Polish:** (Writing the response with the appropriate voice.) *Self-correction: Ensure I don't get too bogged down in defining Ames/Rosemont since the user knows them. Focus on application.*

  *(Self-Correction on the Heath Scene)*: I need to be careful. If I say "Lear is wrong," does that dismiss the emotional weight? I need to argue that the *play* shows Lear's realization is about connection, not isolation. The "bare forked animal" is what happens when *Ren* is absent. The compassion is the return of *Ren*. Okay, that works.

  *(Self-Correction on the Break)*: The death of Cordelia is the big one. Confucianism implies a cosmic moral order (Heaven). *Lear* suggests maybe there isn't one. That's the real break.

