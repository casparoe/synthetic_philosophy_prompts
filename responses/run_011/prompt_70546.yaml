          *   *Analysis:* This is a classic EDA (like Sharon Street or Richard Joyce). It's not "flat wrong." It's a strong skeptical challenge. However, it assumes moral realism (that there *are* moral truths to be missed) to generate the skepticism. If anti-realism is true, there's nothing to debunk.
          *   *Verdict:* Basically sound as a skeptical challenge, but relies on specific meta-ethical assumptions. Load-bearing.

      *   **Move 2 (Marcus):** Genetic Fallacy & Self-Defeat. Core claim: Origin doesn't equal truth (genetic fallacy). Also, if evolution makes *all* beliefs suspect, Dev's argument is also suspect (self-defeat).
          *   *Analysis:* "Genetic fallacy" is a bit of a blunt instrument here. EDAs aren't just about origin; they're about the *lack of connection* between origin and truth. The self-defeat point (Plantinga's EAAN style) is strong but Dev anticipates it in Move 3.
          *   *Verdict:* Partly right. The genetic fallacy charge is weak/noise. The self-defeat charge is load-bearing but needs refinement.

      *   **Move 3 (Dev):** Selective Skepticism. Core claim: Distinguishes between perceptual/math beliefs (truth aids survival) and moral beliefs (fitness aids survival, truth irrelevant). Addresses the self-defeat charge.
          *   *Analysis:* This is the crucial distinction in EDA literature. It acknowledges that evolution tracks truth in some domains (medium-sized dry goods) but not others (morality). This neutralizes the "sawing off the branch" objection.
          *   *Verdict:* Basically sound. This is Dev's strongest move. Load-bearing.

      *   **Move 4 (Marcus):** Moral Naturalism/Teleology. Core claim: "Surviving is good." Evolution tracks moral truth because survival *is* a moral good. Analogy: Thermometer.
          *   *Analysis:* This shifts from epistemology to meta-ethics. It asserts a substantive moral claim ("survival is good") to bridge the gap. Dev calls this circular. Marcus is arguing for a form of ethical naturalism.
          *   *Verdict:* Partly right/Controversial. It's not "wrong," but it assumes a specific meta-ethical view (naturalism) that Dev (likely an error theorist or non-naturalist) rejects. It's load-bearing but contentious.

      *   **Move 5 (Dev):** Circularity & Scope. Core claim: Using a moral premise to prove moral knowledge is circular. Also, evolution doesn't cover abstract/modern moral dilemmas (strangers, trolley problems).
          *   *Analysis:* The circularity charge is strong against Marcus's specific move. The scope argument (ancestral environment vs. modern morality) is a standard and strong objection to evolutionary ethics.
