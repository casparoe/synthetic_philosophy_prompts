answer: |-
  ### The Temporal Sorting Instrument

  **Start here:** Close your eyes. Think of the moment you woke up this morning. Does that moment feel like it has vanished into nothing, or does it feel like a place you simply aren't standing in right now?

  **Node 1:** If you could read tomorrow's newspaper, would the headlines surprise you, or would you just be reading what is already waiting there?
  *   **A. They would surprise me.** (The future is not real yet.) → *Go to Node 2.*
  *   **B. I would just be reading what is there.** (The future is as real as the present.) → *Go to Node 3.*

  **Node 2:** When you make a hard choice (tea instead of coffee), does the version of you who chose coffee cease to exist, or do they walk away into another room?
  *   **A. They cease to exist.** (Only one path is taken.) → *Go to Node 4.*
  *   **B. They walk away into another room.** (All paths are taken.) → *Leaf 1.*

  **Node 3:** If you burned every diary and photograph, would yesterday still have happened exactly the same way, or does the meaning of yesterday change based on what you do today?
  *   **A. It happened the same way.** (The past is fixed.) → *Go to Node 5.*
  *   **B. The meaning changes the event.** (The past is mutable/retroactive.) → *Leaf 2.*

  **Node 4:** Is "now" a spotlight illuminating a room that was already furnished, or a knife-edge cutting through raw nothingness?
  *   **A. A spotlight.** (Past and Future exist, but we move through them.) → *Leaf 3.*
  *   **B. A knife-edge.** (Only the cut exists.) → *Leaf 4.*

  **Node 5:** If you lost your memory entirely, would time still be passing for you, or does time require a "you" to witness the succession?
  *   **A. Time passes regardless.** (Time is objective.) → *Leaf 5.*
  *   **B. Time requires a witness.** (Time is idealist/subjective.) → *Leaf 6.*

  ***

  ### The Leaves

  **Leaf 1: Branching Time (The Multiverse)**
  *   **Borges Marker:** *Fiction Only.* Appears in "The Garden of Forking Paths" as a narrative device; his essays treat it as a logical paradox rather than a physical claim.
  *   **Awkward Commitment:** You are constantly dying, just not all of you; every choice is a funeral for the selves that didn't take it.
  *   **Plot License:** Licenses stories of haunting and regret where ghosts are real but inaccessible; makes tragedy impossible because every loss is compensated by a branch where it didn't happen.

  **Leaf 2: Retrocausal Idealism**
  *   **Borges Marker:** *Essay/Story Conflict.* "The Theme of the Traitor and the Hero" implies the future scripts the past; this contradicts the static eternity suggested in "The Aleph."
  *   **Awkward Commitment:** Causes can happen after their effects, meaning your birth might be the result of your death.
  *   **Plot License:** Licenses mystery plots where the detective solves the crime by realizing they commissioned it; makes linear suspense impossible because the end determines the beginning.

  **Leaf 3: The Moving Spotlight (A-Theory Eternalism)**
  *   **Borges Marker:** *Standard Alignment.* Consistent with the vision in "The Aleph" where all points are seen, but filtered through a human consciousness that must move.
  *   **Awkward Commitment:** The future is already real and fixed, so your feeling of "deciding" is just you catching up to what you've already done.
  *   **Plot License:** Licenses prophecy and fate-driven tragedy; makes genuine surprise impossible for the narrator, only for the characters who haven't reached the "lit" part of the timeline yet.

  **Leaf 4: Presentism**
  *   **Borges Marker:** *None.* Borges generally rejects this as too narrow for his labyrinths, though Funes lives trapped in an overwhelming present.
  *   **Awkward Commitment:** You have no age; you ceased to exist a moment ago and a new you popped into existence just now, holding false memories of a childhood that is gone.
  *   **Plot License:** Licenses intense, sensory immediacy and amnesia plots; makes long-term character arcs impossible because the person who started the journey is dead.

  **Leaf 5: The Block Universe (B-Theory)**
  *   **Borges Marker:** *Standard Alignment.* The metaphysical underpinning of "The Aleph" and the library of Babel; time as a dimension of space.
  *   **Awkward Commitment:** Nothing ever happens; "change" is just an illusion of consciousness moving along a static block of events.
  *   **Plot License:** Licenses non-linear narration and omniscient perspectives; makes "suspense" a lie, as the tension is merely the reader catching up to the fixed geometry.

  **Leaf 6: Timeless Idealism (No-Self)**
  *   **Borges Marker:** *Essay/Story Conflict.* "A New Refutation of Time" argues this position; "The Secret Miracle" quietly refutes it by granting the protagonist a subjective year inside a frozen second.
  *   **Awkward Commitment:** You do not exist, so nothing is happening to you; there is only a series of unconnected mental states.
  *   **Plot License:** Licenses stream-of-consciousness and epiphany without event; makes action impossible because there is no continuous agent to perform it.

  ***

  ### Blind Spots & Collapses

  **1. The Eternal Intellect vs. The Block Universe**
  *   **The Pair:** The view that all time exists simultaneously in the mind of God (Boethius) vs. the view that all time exists simultaneously as a physical 4D object (Einstein/Minkowski).
  *   **Verdict:** **Collapsed.** My tree cannot separate them.
  *   **Why:** Narratively, they function identically. Whether the block is held in a divine mind or made of spacetime matter, the narrator experiences the same constraint: the future is as fixed as the past. To split them, you would need a node asking, "Is the container of time a person or a place?" which is theological, not metaphysical.

  **2. No-Self vs. No-Succession**
  *   **The Pair:** The Buddhist/Humean view that the *self* is an illusion (but time flows) vs. the McTaggart/Borgesian view that *time* is an illusion (because the self cannot bind moments).
  *   **Verdict:** **Separable.**
  *   **The Split:** Node 5 handles this. If the user answers "Time passes regardless" (Objective), they keep succession but can lose the self. If they answer "Time requires a witness" (Subjective), they lose time if they lose the self.
  *   **Note:** In practice, these often bleed into Leaf 6, but a narrator who believes in *flow* without a *self* (Buddhist Presentism) is logically distinct from one who believes in *no flow* because of *no self*.

  ### Unoccupied Territory

  **1. The Reverse Growing Block**
  *   **The Position:** The Past does not exist; the Future does exist.
  *   **Status:** **Unattractive.**
  *   **Why:** Logically coherent but causally inverted. It implies we are being pulled backward into existence by a future that is already solid, while the past dissolves behind us.
  *   **Narrative Potential:** **High.** This is your fourth narrator. They would experience déjà vu as memory of the future, and feel the past slipping away like smoke. They would plan with certainty but remember with doubt.

  **2. Solipsistic Static Time**
  *   **The Position:** Only *my* present exists; the past and future are fictions I tell myself to explain my current state.
  *   **Status:** **Incoherent.**
  *   **Why:** It collapses into Leaf 4 (Presentism) but adds the unnecessary burden that *other people* don't exist either.
  *   **Narrative Potential:** **Low.** It creates a narrator who cannot interact, only observe. It is a trap, not a theory.

  **3. Discrete Time (Atomism)**
  *   **The Position:** Time is not a flow or a block, but a series of frozen frames like a film reel; there is no motion between frames.
  *   **Status:** **Unexplored.**
  *   **Why:** Physicists debate it (Planck time), but metaphysicians rarely build systems on it because it makes "causality" magic (how does frame A cause frame B if they don't touch?).
  *   **Narrative Potential:** **High.** A narrator who experiences life as a strobe light. They would perceive cause and effect as coincidence. They could theoretically "skip" frames, missing years without noticing.
