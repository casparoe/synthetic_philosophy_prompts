answer: |-
  Referee Report: Gould & Lewontin "Spandrels" Seminar Debate

  You've spent thirty-four years distinguishing signal from noise in mud that doesn't talk back. These two are arguing about the map while you've walked the terrain. That gives you a better instinct for the weight of their claims than they have. Here is the assessment you asked for, move by move.

  ### Move-by-Move Refereeing

  **(1) Nadia: Methodological hygiene, no biological examples, trivial advice.**
  *   **Verdict:** **Half-lands.**
  *   **The Work:** The factual claim that the paper lacks rigorous biological demonstrations is **safe**. Gould and Lewontin offered candidates (the human chin, brain size) but did not provide the developmental or genetic proof to seal them as spandrels in that text. They relied on the architectural analogy to carry the logical weight.
  *   **The Flaw:** Her claim that "no working adaptationist ever denied" the need to consider alternatives is **shaky**. While adaptationists paid lip service to it, G&L's critique was that the *standards of evidence* required to reject an adaptive hypothesis were virtually non-existent. It wasn't that alternatives weren't considered; it was that adaptive stories were accepted on coherence alone, while non-adaptive alternatives were dismissed without evidence. Nadia treats the principle as if it were the practice.
  *   **Why it half-lands:** She correctly identifies the paper's empirical weakness but underestimates its normative force. It changed the burden of proof, which is not trivial.

  **(2) Ellis: Critique of procedure (atomization), architecture as category error.**
  *   **Verdict:** **Lands.**
  *   **The Work:** This is the correct philosophical reading of the paper. The "atomization" point (treating traits as independent units of selection) is the core logical target. The architectural analogy is not decorative; it is structural. It demonstrates that some features exist solely because of the rules of construction, not because they were selected.
  *   **The Fact Check:** His reading of the San Marco analogy is **safe**. The point is indeed that asking for the function of the spandrel is a category error if the spandrel is a necessary byproduct of putting a dome on arches.
  *   **Why it lands:** Ellis identifies that G&L were attacking the *unit of analysis*, not just specific trait explanations.

  **(3) Nadia: "Digests failures" is underdetermination; identifying spandrels requires positive work G&L didn't do.**
  *   **Verdict:** **Lands.**
  *   **The Work:** This is the strongest scientific objection. To prove a trait is a spandrel, you must demonstrate the developmental or genetic constraint that makes it inevitable. That is positive, hard empirical work. G&L made it sound as though spotting a spandrel was merely a matter of skepticism.
  *   **The Fact Check:** Her claim about constraints being identified retrospectively is **safe** in most evolutionary contexts. We usually infer the constraint after failing to find the adaptation, rather than predicting the constraint beforehand.
  *   **Why it lands:** She exposes the asymmetry in effort. Dismissing an adaptive story is easy; proving a non-adaptive constraint is hard. G&L made the dismissal sound like a discovery.

  **(4) Ellis: Disagreement over default assumptions (Adaptation vs. Agnostic).**
  *   **Verdict:** **Lands.**
  *   **The Work:** This moves the debate from biology to the philosophy of research programs (Lakatos/Kuhn). He is right that defaults dictate data collection. If you assume adaptation, you look for fitness benefits. If you assume agnosticism, you look for developmental constraints.
  *   **The Fact Check:** His claim that these defaults are operationally distinct is **safe**. They lead to different grant proposals and different measurements.
  *   **Why it lands:** He successfully defends the paper as a paradigmatic intervention rather than a specific biological claim. He concedes the "parasitism" (you need adaptationism to have something to critique) but argues the shift in default is valuable regardless.

  **(5) Nadia: Defaults are sociology; "Spandrel" usage collapsed into "any non-adaptive feature."**
  *   **Verdict:** **Half-lands.**
  *   **The Work:** The terminological collapse is real and damaging. In the literature post-1979, "spandrel" is often used as a catch-all for byproducts, exaptations, and noise. This dilutes the specific meaning (necessary byproduct of selection on *another* trait).
  *   **The Fact Check:** Her claim about Gould and Vrba (1982) adding to the confusion is **safe**. While *Exaptation* was intended to clarify the origin/use distinction, critics argue it created a new bucket for unfalsifiable historical stories.
  *   **The Flaw:** Dismissing defaults as "sociology" is a dodge. Methodological norms *are* social agreements that govern scientific practice. Calling it sociology doesn't negate the methodological impact.
  *   **Why it half-lands:** She wins on the vocabulary drift, loses on the philosophy of method.

  **(6) Ellis: Blur is real, but origin vs. utility distinction survives.**
  *   **Verdict:** **Lands.**
  *   **The Work:** This is the enduring legacy of the G&L/Vrba collaboration. Distinguishing *why a trait arose* from *what it does now* is conceptually robust, even if empirically difficult.
  *   **The Fact Check:** **Safe.** This distinction is now standard in evolutionary biology, even among adaptationists.
  *   **Why it lands:** He isolates the one conceptual tool from the paper that cannot be discarded without losing analytical power. Nadia's critique in (5) actually requires this distinction to make sense, as he notes.

  ### Overall Verdict

  **Ellis comes out ahead.**

  Nadia wins on the *empirical ground*. She is right that proving a spandrel is harder than G&L implied, and she is right that the term has been sloppily applied in the decades since. If this were a grant review for a specific study on infauna morphology, Nadia's skepticism would be the more useful guide.

  However, Ellis wins on the *philosophical ground*, which is the context of your seminar. He correctly identifies that the paper's value was not in providing a list of spandrels, but in breaking the "adaptationist programme's" monopoly on legitimate explanation. He successfully defends the shift in default assumptions (Move 4) and the origin/utility distinction (Move 6) as robust contributions that survive Nadia's empirical critiques. Nadia treats the paper as a failed biological study; Ellis treats it as a successful methodological intervention. Given the paper's actual historical impact, Ellis's reading is more accurate to what the text *did*, even if Nadia is more accurate about what the text *lacked*.

  ### The Missing Move: Your Hunch

  **Your hunch is half-right, but you are being too hard on the ontology.**

  You suspect "spandrel" is just a placeholder for "not yet explained."
  *   **Where you are right:** Epistemically, in many fields (especially paleontology or comparative psychology), "spandrel" often functions as a placeholder. It is the null hypothesis we retreat to when an adaptive story fails. In those contexts, you are correct: it is often a label for our ignorance of the true selective history.
  *   **Where you are wrong:** Ontologically, in developmental biology and genetics, "spandrel" names a real category. Pleiotropy (one gene affecting multiple traits) and linkage disequilibrium are physical realities. If Selection acts on Trait A, and Trait B comes along for the ride because of the genetic architecture, Trait B is a spandrel. That is not a placeholder; that is a mechanistic description of inheritance.

  **The Referee's Expectation:**
  A decent referee would expect you to distinguish between the *mechanism* (which is real) and the *inference* (which is often weak).
  *   In the mudflats, if you see a worm tube structure that is a necessary physical consequence of the mucus secretion required for feeding, that is a real spandrel. You can measure the physics.
  *   If you look at a human cognitive bias and call it a spandrel because you can't find the fitness benefit, that is a placeholder.

  Nadia and Ellis both skipped this distinction. Nadia treated all spandrel claims as weak inferences (ignoring the developmental reality). Ellis treated the distinction as logically clean (ignoring the inferential messiness).

  **Final word:** Your hunch holds for evolutionary reconstruction, but fails for developmental mechanics. The term is not *just* a placeholder, but it is used as one far too often. Ellis knows the logic; Nadia knows the difficulty; you know the difference between a mechanism and a story.
