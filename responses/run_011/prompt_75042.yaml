answer: |-
  **Project Title:** The Locus of Uncertainty: Distinguishing Payoff Perturbations from Rationality Perturbations in Strategic Interaction

  **Research Question**
  Does small uncertainty always destroy strategic coordination, or does it depend on what is uncertain? I ask whether uncertainty about the rules of the game and uncertainty about players' rationality have fundamentally different effects on equilibrium outcomes.

  **Project Description**
  Common knowledge of rationality (CKR) is the load-bearing wall of non-cooperative game theory. Yet, when this assumption is slightly perturbed, the literature offers two contradictory pictures of stability. In Rubinstein's electronic mail game, a tiny probability that players are unsure about the payoff matrix destroys coordination entirely; the equilibrium does not converge to the complete-information solution as the uncertainty vanishes. Conversely, in the centipede game, a tiny probability that players are unsure about each other's rationality (or types) sustains cooperation; the equilibrium diverges from the backward-induction solution even as the uncertainty vanishes.

  In the first case, uncertainty kills the cooperative outcome. In the second, uncertainty saves it.

  Current research treats these perturbations as interchangeable instances of "incomplete information." The robustness literature, following Weinstein and Yildiz, focuses on how payoff uncertainty affects rationalizability, generally concluding that predictions are fragile. The reputation literature, following Kreps, Wilson, Milgrom, and Roberts, focuses on how type uncertainty affects backward induction, generally concluding that predictions are flexible. Because these literatures employ different technical apparatuses to model "uncertainty," it remains an open question whether the asymmetry in outcomes is a theorem-shaped fact about the structure of knowledge or merely an artifact of the specific information structures chosen.

  My project proposes that these are structurally distinct epistemic conditions. Uncertainty about the game concerns a state of the world players might in principle learn. Uncertainty about rationality concerns a property of the players that cannot be verified from the inside without circularity. I will formalize this distinction to determine if the opposing empirical directions (uncertainty destroys coordination vs. uncertainty enables cooperation) hold generally.

  **Why Existing Positions Leave This Open**
  The standard defense is that both cases are simply applications of Harsanyi's purification or common *p*-belief. If players share a high enough *p*-belief in rationality and payoffs, results should stabilize. However, this conflates the *object* of belief. In the mail game, the perturbation is on the payoff function (the environment). In the centipede, the perturbation is on the disposition to maximize (the agent).

  Philosophers of game theory have noted that CKR is incoherent at off-path nodes, suggesting we should drop it. Economists often bypass this by invoking bounded rationality or quantal response equilibria (QRE). But these alternatives change the solution concept rather than analyzing the epistemic logic of the standard model. Level-k reasoning assumes a hierarchy of sophistication but does not explain why a specific hierarchy should be common knowledge. My project does not replace CKR; it interrogates the stability of CKR when the *source* of doubt varies. Until we have a unified framework comparing payoff-perturbations against rationality-perturbations within the same epistemic logic, we cannot know if the asymmetry is real.

  **Research Plan (12 Months)**
  The project proceeds in three phases, prioritizing simple toy models before attempting general theorems.

  *Months 1–4: Formalizing the Distinction.*
  I will construct two canonical toy models that isolate the locus of uncertainty. Model A will replicate the mail game structure but allow for uncertainty about rationality. Model B will replicate the centipede structure but allow for uncertainty about payoffs. By swapping the perturbations, I can test if the "destruction" vs. "preservation" of cooperation tracks the *game structure* (finite vs. infinite horizon) or the *perturbation type* (payoff vs. rationality). I will use epistemic logic frameworks (type spaces) rather than specific equilibrium refinements to ensure the results are foundational. I start with toy models because the mail game and centipede contain unnecessary complexity (e.g., specific payoff values) that obscures the epistemic mechanism.

  *Months 5–8: Generalization and Theorem Proving.*
  If the toy models confirm the asymmetry, I will attempt to generalize the result. The goal is a theorem characterizing the conditions under which payoff-uncertainty implies discontinuity in equilibrium outcomes, while rationality-uncertainty implies continuity (or vice versa). This involves defining a metric on the space of "epistemic perturbations." I will engage with the literature on common *p*-belief to see if a unified threshold exists. If the asymmetry disappears in the general case, I will identify the specific structural features (e.g., signal noise vs. type distribution) that caused the divergence in the canonical cases.

  *Months 9–12: Implications and Write-Up.*
  The final phase translates the technical results into philosophical and economic implications. For economists, this clarifies when robustness checks are sufficient. For philosophers, it clarifies the epistemic status of rationality assumptions. I will draft two papers: one technical result for a field journal (e.g., *Games and Economic Behavior*) and one conceptual analysis for a interdisciplinary venue (e.g., *Philosophy of Science* or *Economics and Philosophy*).

  **Defense Against Alternatives**
  A referee might ask why I do not simply adopt a behavioral approach. If the centipede game is solved by quantal response or level-k reasoning, why worry about common knowledge? The answer is that behavioral models describe *how* people deviate, while epistemic game theory explains *why* the standard model fails to predict. If the standard model's failure depends on the locus of uncertainty, then patching it with QRE misses the structural cause. Similarly, declaring CKR incoherent at off-path nodes is a valid philosophical move, but it abandons the predictive power of equilibrium analysis. My project seeks to salvage the epistemic program by refining its assumptions, not discarding them. I am not testing whether humans are rational; I am testing whether the *logic* of common knowledge behaves consistently across different domains of uncertainty.

  **Outcomes and Failure Conditions**
  A positive result is a theorem demonstrating that payoff-perturbations and rationality-perturbations belong to different topological classes regarding equilibrium convergence. This would validate the intuition that "uncertainty about the world" is epistemically distinct from "uncertainty about the mind."

  A negative result would show that once properly formalized, the two perturbations are interchangeable; the asymmetry was indeed an artifact of the Rubinstein and Kreps et al. specific constructions. This is not a failure of the project but a success of the unification. The salvageable contribution would be a unified taxonomy of perturbations, showing exactly which auxiliary assumptions (e.g., signal independence, prior support) drive the divergence. This would still correct the literature's tendency to treat all incomplete information as homogeneous.

  **Scope and Risk Assessment**
  The highest risk lies in Months 5–8. Generalizing from two specific games to a class of games is mathematically demanding. The topology of type spaces can become intractable quickly. If the general theorem proves elusive, I have a minimal publishable fallback: a rigorous comparative statics analysis of the two canonical models using a unified epistemic framework. Even without a general theorem, demonstrating that the asymmetry holds under a standardized formalization is a significant contribution, as it prevents the conflation of the two literatures in future work.

  This project fits the center's interdisciplinary mission. It uses the economist's toolkit (modeling, equilibrium analysis) to answer a philosopher's question (the structure of knowledge and rationality). By clarifying the limits of common knowledge, it offers a more stable foundation for both fields.
