answer: |-
  Here is a plan for running the section, designed to keep the methodological distinction sharp without getting bogged down in theory.

  ### 1. The Case Study: Stick with Tambora, but Change the Lens
  **Keep Tambora,** but do not let it be a story about "The Volcano that Changed the World." That framing invites determinism.
  **The Better Frame:** Compare **Tambora's impact in Western Europe vs. Colonial Java.**
  *   **Why:** In Europe, it led to unrest, migration, and cultural shifts (Frankenstein). In Java (where the volcano actually is), it led to mass starvation and intensified colonial extraction.
  *   **What a good case must have:**
      1.  **A Single Non-Human Shock:** (The eruption).
      2.  **Divergent Human Outcomes:** (Revolution in Europe vs. Enslavement in Java).
      3.  **Archival Evidence of Choice:** (Parliamentary debates on grain tariffs vs. Dutch colonial decrees).
  *   **What it must lack:**
      1.  **Inevitability:** If the source material says "the famine forced them," discard it. You need sources that show "they *chose* to export grain despite the famine."
  *   **Why not the 1918 Flu?** It's methodologically cleaner (Philly vs. St. Louis), but Tambora feels more "historical" to first-years who associate germs with science class. Tambora allows you to talk about *politics*, which is where the agency debate lives.

  ### 2. The Sequence (75 Minutes)

  **0:00–0:15: Breaking the "Intention" Habit**
  *   Do not start with the volcano. Start with a **traffic jam**.
  *   Ask: "Why were you late?"
  *   If they say "The traffic," press them: "Did the traffic *intend* to make you late?"
  *   **Goal:** Establish that *cause* does not require *intent*. A red light causes you to stop, but it has no agency. You have the agency to run it (and pay the cost).
  *   **Define the terms:** *Actor* = makes a choice. *Cause* = changes the conditions of the choice.

  **0:15–0:25: The Heuristic (The "Cost of Options" Concept)**
  *   **Place this BEFORE the case.** If you wait until after, they will have already interpreted the volcano as a dictator.
  *   Write on the board: **"Non-human causes do not write the script; they change the price of the tickets."**
  *   Explain: A drought doesn't force a revolution. It makes *feeding the army* more expensive. The King can still choose to feed the army (and tax harder) or disband it. The volcano makes some choices costly, not impossible.
  *   **Why here:** This gives them a tool to analyze the Tambora evidence without sliding into "The volcano made them do it."

  **0:25–0:50: The Case (Tambora: Europe vs. Java)**
  *   Split the room. Half looks at sources regarding European harvest failures/riots. Half looks at Dutch colonial responses in Indonesia.
  *   **Task:** Identify one moment where a human *could* have acted differently despite the ash/clouds.
  *   **Synthesis:** Bring them back together. Show that the *same ash* led to *different policies*.
  *   **Crucial Move:** When a student says "The famine caused the revolt," correct them: "The famine made grain expensive. The *refusal to lower tariffs* caused the revolt."

  **0:50–1:05: Head Off the Pushbacks**
  *   **Pushback 1: "So no one's responsible, it just happened."**
      *   **Address this DURING the case synthesis (0:50).**
      *   Counter: "Acknowledging the volcano actually *increases* responsibility. If the harvest failed naturally, the government's job was to manage the shortage. If they exported grain anyway, the volcano didn't kill people; the policy did."
      *   *Point:* Environmental history isn't an alibi; it's a spotlight on bad governance.
  *   **Pushback 2: "This is just Guns, Germs, and Steel with better manners."**
      *   **Address this AFTER the case (1:00).**
      *   Counter: "Diamond argues geography *determines* the winner. We are arguing geography *complicates* the choice. Diamond says 'Eurasia won because of germs.' We say 'Eurasia had germs, but their imperial policies determined who died.' We are studying the *response*, not just the *shock*."

  **1:05–1:15: Closing Assessment**
  *   Do not ask "What caused the Year Without a Summer?" (They will say Tambora).
  *   **The Question:** "If we remove the volcano from the history of 1816, does the British Corn Law debate disappear? Why or why not?"
  *   **What this tests:** If they say "Yes, it disappears," they are determinists. If they say "No, the debate existed, but the *outcome* changed," they understand that the non-human is a *variable*, not the *author*.

  ### 3. What to Openly Refuse to Get Into
  **Refuse to discuss Actor-Network Theory (ANT) or "Object Agency."**
  *   **Why:** First-years will hear "non-human cause" and immediately Google it, finding Bruno Latour and the idea that a door-closer has "agency." This conflates *causal power* with *moral/historical agency*.
  *   **The Line:** "We are not asking if a volcano has rights or intentions. We are asking how historians account for things that humans didn't build but still have to deal with. We are keeping 'agency' reserved for beings who can be held responsible."
  *   **Risk:** If you let this slide, the section becomes a philosophy seminar on ontology rather than a methods class on historical explanation.

  ### Summary of Critical Moves
  1.  **Concept Placement:** "Cost of Options" heuristic comes **before** the case (0:15).
  2.  **Pushback 1 (Responsibility):** Crushed **during** the case analysis (0:50).
  3.  **Pushback 2 (Determinism):** Crushed **after** the case as a boundary setting (1:00).
  4.  **Case Requirement:** Must show **divergent outcomes** from the same environmental shock.
  5.  **Theoretical Boundary:** Explicitly ban **Actor-Network Theory** to preserve the definition of agency.
