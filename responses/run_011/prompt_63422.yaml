      *   *Best "Missing" Point:* They are missing the distinction between **having a reliable process** and **being justified in believing the process is reliable**. Externalism allows the former without the latter. Marcus wants the latter; Yuki thinks the former suffices. The missing piece is the **Requirement of Independent Verification** for higher-order beliefs (knowledge of reliability). Most epistemologists agree Nadia cannot come to *know* the thermometer is reliable this way, even if her first-order beliefs are true.
      *   *Refinement:* The crucial missing element is the **transmission of justification**. Justification doesn't transmit across the "basis" of the belief. You can't use a source to validate itself because the justification for the premise *depends* on the conclusion you are trying to prove. This is the "Epistemic Circularity" problem (Alston).

  6.  **Drafting the Response:**
