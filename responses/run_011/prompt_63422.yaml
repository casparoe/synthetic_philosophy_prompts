      *   They are missing the distinction between **Propositional Justification** and **Doxastic Justification**, or perhaps the role of **Antecedent Justification**.
      *   More deeply, they are missing the specific literature solutions:
          1.  **No Self-Support:** Some say basic sources (perception, memory) cannot justify their own reliability without independent corroboration (Fumerton).
          2.  **Tracking/Safety:** The reasoning fails safety conditions (Weisberg).
          3.  **Defeaters:** Nadia acquires a defeater (the realization that she is bootstrapping) that undermines her justification (Cohen).
