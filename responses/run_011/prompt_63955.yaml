answer: |-
  **Marcus:** You're smuggling psychology back into semantics, Fiona. That's the only way I can make sense of what you're saying about Dana.

  **Fiona:** And you're pretending psychology doesn't exist, Marcus. Look at the case again. In 2011, Dana stands next to a man in a linen jacket. She forms a memory. No name. No description like "the best man" or "the groom's uncle." Just a face. In 2019, she meets Tomás the organ restorer. She builds a rich dossier. In 2024, she sees the photo. She realizes: *That* man is *this* man. You say nothing new is believed. I say a merger happened.

  **Marcus:** Nothing new is believed *semantically*. The proposition `<Tomás, was at the wedding>` was true in 2011. Dana stood in a perceptual relation to Tomás. She formed a belief with that singular proposition as its content. She just couldn't access it via the 2019 file. When she sees the photo, she doesn't acquire a new truth-condition. She acquires a new route to an old truth. You're calling that route a "file" and pretending it's ontological heavy lifting. It's just processing.

  **Fiona:** It's not just processing if it governs rationality. Before the photo, Dana could not infer "The organ restorer was at the wedding." She lacked the premises to construct that syllogism. After the photo, she can. If semantics is supposed to explain rational inference—if it's supposed to tell us why some transitions in thought are justified and others aren't—then your singular proposition is too coarse. It lumps together states that function differently in reasoning. The file is the unit of cognitive significance. She had two files. Merging them is a real event.

  **Marcus:** But what individuates the files? You say she had two. Why? Because she didn't know they were the same. But that's just restating the data. "She didn't know identity" becomes "She had two files." Then you explain "She didn't know identity" by saying "She had two files." It's circular. You're rebranding Fregean senses as mental folders.

  **Fiona:** It's not circular if the files have functional roles. A file is a store of information poised for action. In 2019, the "Tomás" file prompted her to talk about organs. The "Lisbon Man" file—if she even kept one active—prompted nothing. They were isolated databases. Merging them pools the information. Now the organ fact is available to explain the wedding behavior. That's not just a psychological hiccup; it's a change in what information is available for deduction.

  **Marcus:** Availability is psychological. Truth is semantic. I can describe Dana's behavior without positing files. In 2019, she disposed to assert "Tomás restores organs." She was not disposed to assert "The man from Lisbon restores organs." Why? Because the neural pathways linking the perceptual memory to the name "Tomás" weren't forged. That's a fact about synaptic weights, not semantic content. You're reifying the architecture.

  **Fiona:** But consider the Lisbon state itself. This is where your view gets sticky. You claim that in 2011, Dana held a singular belief about Tomás. But she had no name. No description. Just a recognitional capacity. If that counts as a singular belief content, then you've conceded the main point of contention. You've admitted that cognitive contact—acquaintance—is enough for reference. But if acquaintance is enough, then the "file" is just the record of that acquaintance. When the acquaintance is re-established in 2024, the records merge. You agree on the belief; you just disagree on the bookkeeping.

  **Marcus:** I agree on the reference, not the bookkeeping. The bookkeeping implies there's something *between* Dana and Tomás. There isn't. There's just Dana and Tomás. The "file" is a metaphor for how her brain caches data. But if you ask what she believes, the answer is: she believes of Tomás that he was at the wedding. She believed it in 2011. She believes it in 2024. The informativeness of the discovery is a fact about her epistemic history, not her current propositional attitude. You're trying to solve Frege's Puzzle by changing the subject from truth-conditions to cognitive dynamics.

  **Fiona:** I'm changing the subject because the subject was never just truth-conditions. Frege cared about *cognitive value*. Why is `a=a` trivial but `a=b` informative? Your answer is "psychology." My answer is "files." But here's the twist: usually, Frege cases involve contradiction. Paderewski is the classic example. She believes Paderewski is musical. She believes Paderewski is not musical. She holds inconsistent beliefs because she has two files. But Dana's case is different. There's no contradiction. She doesn't think "Tomás was at the wedding" and "Tomás was not at the wedding." She thinks "This guy was at the wedding" and "That guy restores organs." The discovery isn't resolving inconsistency; it's creating connection.

  **Marcus:** Precisely. And that shows the file theory is over-engineered. You don't need files to explain connection. You just need identity. The Paderewski case is messy because people attribute conflicting properties. Dana's case is clean. It shows that informativeness is just learning an identity statement. `The Lisbon Man = Tomás`. Once she accepts that identity, she can substitute salva veritate. The Millian story handles the no-conflict version perfectly. She learns an identity. Her web of belief expands. No need for mystical folders.

  **Fiona:** But how does she learn the identity? That's the question. If she has no descriptive content from 2011, she can't learn it via description. She can't say "The man in the linen jacket is Tomás" because "the man in the linen jacket" doesn't pick him out uniquely for her anymore—she doesn't remember the jacket distinctly until she sees the photo. She recognizes the face. The recognition triggers the merge. If you say "She learns an identity," you're implying she had two concepts she could identify. But in 2011, she had no concept worthy of the name. She had a perceptual link. The file theory captures this: she had a dormant file based on perception. The merge activates the link. Your "singular proposition" ignores the dormancy.

  **Marcus:** Dormancy is psychological. I'm talking about content. Even if the file was dormant, the content was singular. You're worried that without descriptions, reference fails. It doesn't. Causal chains sustain reference. The 2011 encounter launched a chain. The 2024 photo reactivated it. The fact that it feels informative is explained by the fact that she didn't know the chain was continuous. But that's a fact about her knowledge of the chain, not the content of the belief.

  **Fiona:** You keep saying "content" like it's a diamond hidden in the rough, untouched by how we hold it. But if the way we hold it determines what we can do with it, then the "how" is part of the semantic story. If I can't deduce `Q` from `P` because my files are separate, then semantically, for me, `P` does not entail `Q`. You want to say `P` entails `Q` God's-eye view. I care about Dana's-eye view.

  **Marcus:** And I care about what makes her belief true. What makes her belief true is Tomás. Not the file. If the file theory can't give me identity conditions for files that don't rely on the subject's ignorance, then it's just a placeholder. You say "two files." I say "one object, two encounters." Your theory adds nothing to the explanation of truth.

  **Fiona:** It adds everything to the explanation of learning. Merging isn't redescription. It's the mechanism of learning identity in the absence of descriptions. In the standard Paderewski case, the subject often never merges the files. They live with the contradiction. In Dana's case, the merge happens. If files were just redescription of ignorance, the merge would be impossible to specify. But we can specify it: it's the pooling of information stores. That's a functional change. You dismiss it as "processing," but processing is where the rationality lives.

  **Marcus:** Rationality lives in the logic of propositions. If you change the logic to fit the psychology, you lose normativity. You're saying she *couldn't* infer before. I say she *didn't*. There's a difference. She had the premises all along, semantically speaking. She just couldn't see them.

  **Fiona:** If she couldn't see them, then semantically speaking, she didn't have them available. Availability is constitutive of belief attribution in cognitive science. You're holding out for a notion of belief that no longer does any work.

  **Marcus:** It does the work of grounding truth.

  **Fiona:** And I'm grounding understanding.

  **Marcus:** Look, I'll concede this: If you can provide identity conditions for mental files that don't ultimately cash out in terms of the subject's ignorance of identity, I'll switch sides.

  **Fiona:** And I'll concede this: If you can explain the informativeness of the recognition without appealing to cognitive architecture, I'll switch sides.

  ***

  **Postscript**

  The case relies heavily on the "recognitional-only" nature of the 2011 encounter. This rigs the game against the Descriptivist (obviously) but also creates a loophole for the Millian. Marcus argues that the causal link from 2011 is sufficient for singular content. However, if Dana had learned the name "Tomás" in 2011 but simply forgotten it by 2019, the case changes. If she knew the name in 2011, the Millian has an easier time claiming the content was identical all along (`<Tomás, ...>`). The "recognitional capacity" alone is philosophically fragile; some argue pure recognition without conceptualization doesn't sustain a propositional attitude at all.

  To close the loophole, vary the setup: In 2011, Dana is told the man's name is "Sebastião," but she forgets it immediately. In 2019, she meets "Tomás." In 2024, she learns Sebastião is Tomás. This introduces distinct names (blocking simple Millian substitution) while maintaining the lack of descriptive overlap. This forces the Millian to explain why `<Sebastião, ...>` and `<Tomás, ...>` are cognitively distinct despite referring to the same object, without relying solely on the "file" metaphor which they reject. It tests whether the Millian can handle distinct guises of reference without collapsing into the File Theory.
