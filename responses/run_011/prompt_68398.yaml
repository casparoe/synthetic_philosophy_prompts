answer: |-
  The requirement to explain how the thesis sustains both modal necessity and empirical vulnerability excludes the most candidates, and consequently, the three standard families cannot jointly meet the list because they constitute mutually exclusive ontological commitments regarding that tension.

  ### Desiderata for an Account of CT's Epistemic Status

  | Requirement | Phenomenon to Handle | Why This is a Requirement |
  | :--- | :--- | :--- |
  | **Counterexample Vacuum** | The total absence of accepted counterexamples despite decades of scrutiny. | Must distinguish between *inductive support* (none found yet) and *conceptual impossibility* (none describable). |
  | **Math/Physics Distinction** | The difference between "effective procedure" (math) and "physical process" (nature). | Conflating them renders CT vulnerable to physical discovery or immune to physical relevance erroneously. |
  | **Formalism Convergence** | The extensional equivalence of Turing machines, λ-calculus, general recursion, etc. | Must explain whether this is independent evidence of a natural kind or artifacts of shared human intuition. |
  | **Counterexample Describability** | The specification of a hypercomputational process. | If a counterexample requires effective steps to describe/verify, positing it begs the question against CT. |
  | **Exotic Machine Failure** | The impossibility of Zeno, Real-valued, or Oracle machines. | Must determine if these fail due to logical contradiction (conceptual) or physical laws (engineering/nomological). |
  | **Physical Derivation Status** | Proofs deriving computability bounds from locality, finite density, etc. | Must clarify if these prove CT itself or merely prove that *our universe* obeys CT-like constraints. |
  | **Mind Triviality Avoidance** | The use of CT in computational theories of mind. | If CT is analytic/stipulative, "the mind computes" becomes trivial; if empirical, it becomes contingent and falsifiable. |

  ### Non-Negotiables vs. Hobby-Horses

  **Non-Negotiable:** Counterexample Vacuum, Math/Physics Distinction, Formalism Convergence, Counterexample Describability, Exotic Machine Failure. Any account that collapses the mathematical thesis into the physical thesis (or vice versa) fails to explain why the mathematical proof holds regardless of physics, or why physical limits matter for the mathematical definition. Similarly, an account that cannot explain why all formalisms converge without circularity fails to justify the thesis's robustness.

  **Hobby-Horses:** Physical Derivation Status, Mind Triviality Avoidance. The former is only critical if you believe physics should ground logic (a specific naturalist camp); the latter is only critical if you prioritize philosophy of mind over mathematics. However, while "hobby-horses" relative to pure logic, they are essential for a *philosophical* account of the thesis's status in the wider world.

  ### Incompatible Subsets

  Your suspicion is correct: **"Must be falsifiable in principle"** and **"Must be an analysis of a pre-theoretical concept"** cannot be jointly satisfied.
  *   **Conceptual Analysis** renders CT analytic (true by meaning of "effective procedure"). Analytic truths are not falsifiable by empirical evidence.
  *   **Empirical Hypothesis** renders CT synthetic (a claim about the world). Synthetic truths are falsifiable but lose their modal necessity (they could have been otherwise).
  *   **The Conflict:** You cannot claim CT is *necessarily* true (no counterexample is conceivable) while simultaneously claiming it is *contingently* true (a counterexample is physically possible but hasn't occurred). An adequate account must choose one, thereby failing the desiderata of the opposing camp.

  ### Scoring the Three Families

  **1. CT as Conceptual Analysis (e.g., Sieg, Gandy)**
  *   **Score:** High on Necessity/Describability; Low on Physics/Empirical.
  *   **Verdict:** Best explains why no counterexample exists (they are inconceivable) and why formalisms converge (they analyze the same concept). Fails to explain how physics could violate CT without changing the concept, making Physical CT distinct enough to be interesting.

  **2. CT as Empirical Hypothesis (e.g., Copeland, Shagrir)**
  *   **Score:** High on Physics/Exotic Machines; Low on Necessity/Convergence.
  *   **Verdict:** Best handles the possibility of hypercomputation in exotic physics. Fails to explain the modal force of the mathematical thesis (makes the equivalence of formalisms a cosmic coincidence) and renders the lack of counterexamples merely inductive.

  **3. CT as Stipulative Definition (e.g., Formalist/Logicist)**
  *   **Score:** High on Math/Convergence; Low on Everything Else.
  *   **Verdict:** Solves the math by fiat (CT is true by definition of "Turing-computable"). Fails to connect to the world (Physical CT becomes a separate, unproven hypothesis) and makes computationalism of mind trivial or false by definition.

  **Bottom Line:** No single family meets all desiderata because the list demands the thesis be both a necessary truth of reason and a contingent truth of nature. To determine if CT can be overturned by evidence, you must adopt the **Empirical Hypothesis** view; if you adopt the other two, CT can only be overturned by re-definition.
