  **The short answer**
  Finish the book, but change its spine. You are not writing a definitive history of the fire; you are writing a history of the memory of the fire. Your instinct as an adjuster is to find a single truthful settlement, but history rarely settles. Print the book, but include the contradictions explicitly. Do not smooth over the payroll discrepancy or the shared source of the testimonies. Your readers will trust you more if you show them where the evidence breaks. The story isn't just what happened in 1953; it's how your county remembered it for seventy years. That is a better book than the one you planned.

  **What I've actually got myself into**
  You have stumbled into the core problem of oral history and historiography. Specifically, you are dealing with "source contamination" and the "illusion of corroboration." When multiple accounts share a single origin point, they are not independent validations; they are echoes. In archival science, this is an issue of provenance. You thought you had triangulation; instead, you have a single vector repeated. Furthermore, you are experiencing "confirmation bias," which your daughter correctly identified. Your claims adjusting background trains you to close files, to find liability and settle. History often refuses closure. You are treating testimony as evidence in a claim, where consistency proves truth, rather than as memory, where consistency often proves only that the story was told often. The payroll book introduces "documentary silence," which is tricky; absence of evidence isn't always evidence of absence, but it demands explanation. You aren't just researching an event; you are researching how a community constructs its own past. This is less about facts and more about narrative architecture. You are acting as both historian and subject, which complicates the adjuster's need for a clean conclusion. This is a crisis of verification common in local history.

  **The four things**
  **Dale:** His evidentiary weight has decreased significantly, shifting from witness to originator. He is a primary source for employment status, but his memory is fluid. The shift in his story between 2019 and 2023 suggests reconstruction, not recall. The cash payment explanation is plausible but unfalsifiable, serving only to protect his narrative. He is no longer an independent witness; he is the likely origin of the county's mythos. Treat him as the source of the legend, not necessarily the facts. His motivation is clear: he wants the dead men to be hands because that simplifies the wheat ownership dispute. As an adjuster, you know a self-serving statement when you hear one.

  **Ruth:** Her vivid details are compelling but now suspect. If she heard the story at the family table, her "memory" is actually inherited narrative, known as "post-memory." The specific details (dog, limp) are valuable culturally but not evidentiary. She confirms what the county believed, not necessarily what happened. Her value lies in showing how the story was consumed by the community, not in verifying the event itself. The limp is a sensory detail that anchors the story for her, but it anchors nothing for you. She is a vessel for Dale's story, not a separate camera.

  **The Reporter:** This document has lost most of its independent value. If the phrase "lit up like a lantern" comes from Ruth's mother, the article is likely based on interviews with your family circle. It is not an external verification. It serves as a timestamp for when the story entered public record, but not as proof of the event's details. It solidified the oral tradition into print, making it harder to challenge later. It represents the moment the family story became the county story.

  **The Payroll:** This is your only hard anchor, but it is negative evidence. It doesn't prove the men weren't there; it proves they weren't on *that* list. However, it contradicts the oral tradition directly. It must be given higher weight than memory, but not absolute weight. Cash payments were common then, but the absence of names requires you to acknowledge the possibility that the dead men were not employees, which changes the ownership dispute entirely. If they weren't employees, whose wheat was it? This document opens the mystery rather than closing it. It is the only piece of paper that existed before the story was told. Together, they form a circle where the paper contradicts the people, and the people contradict each other only when pressed.

  **Dale's rule and my rule**
  Both of you are wrong, because you are arguing about verification when you should be arguing about interpretation. Dale's rule is too rigid for oral history; memory degrades chronologically but retains emotional truth. Your rule is too loose; without dates, the shape can be molded to fit any preference. You need a hybrid: dates establish the framework, but the shape reveals the meaning. To Dale, you should say that his rule works for military intelligence, but not for community memory. Tell him you aren't trying to court-martial the past, but to preserve it. Acknowledge that his cash explanation is possible, but note that it cannot be verified. You don't need to reject his account entirely to acknowledge the payroll exists. You can say, "The book needs to show the puzzle, not just the solution." He wants vindication; you need accuracy. Find a middle ground where his experience is honored but not allowed to overwrite the documents. As an adjuster, you know that when two facts conflict, you don't discard one; you note the discrepancy in the report. Tell him you are writing the final report, not the settlement. He needs to know that including the doubt protects him from future correction.

  **The limp, and the spreadsheet**
  Dale is right about the limp: specific sensory details usually indicate presence. However, presence doesn't guarantee accuracy about the fire's cause or the men's employment. Someone saw a limping man, but that man might not have been involved in the wheat dispute. The detail proves observation, not interpretation. Regarding the spreadsheet: your daughter is right. Averaging bias does not cancel out bias; it quantifies it. You cannot assign numbers to truth. It gives a false veneer of objectivity to subjective choices. Rescue the method by changing the metric. Instead of scoring "truth," score "provenance." Rate how far removed the source is from the event. A five is an eyewitness document; a one is a grandchild's hearsay. This measures reliability, not validity. Or delete it. Rely on narrative weighting. The limp proves someone was there, but not that Dale's version of why they were there is correct. Keep the limp as evidence of atmosphere, not evidence of liability. Your daughter's comment stung because it was an adjuster's assessment of your claim: you were padding the file. Drop the numbers. They are a costume indeed.

  **What goes in the book**
  Print the parts you cannot settle. Use phrases like "family lore holds" versus "company records show." Do not resolve the contradiction. Write: "Dale remembers them as hands paid in cash; the payroll book leaves them out." Let the reader weigh the evidence. This honors the historical society's goal without compromising your integrity. Include a note on methodology explaining the shared source of the oral histories. This turns your wall into a feature. Be explicit: "Here the record breaks." Use the first person to admit your own uncertainty. It makes you a guide, not a judge. The book becomes a record of the search, not just the finding. This satisfies the sesquicentennial need for content while maintaining historical rigor. You are not failing to finish; you are finishing honestly.
