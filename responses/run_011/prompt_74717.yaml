  2.  **Deconstruct the Phenomena (The "Awkward Cases"):**
      *   *Case 1: REM Reports vs. Denials.* Some wake from REM with long stories; some wake from REM saying "nothing."
      *   *Case 2: "Non-Dreamers".* People claim they never dream, but report dreams if woken in the night.
      *   *Case 3: Lucid Eye Signals.* Pre-arranged signals (e.g., L-L-R-R) executed during REM, confirmed by polysomnography, followed by report of dreaming.
      *   *Case 4: Narrative Drift.* Reports change, smooth out, or shift minutes after waking.
      *   *Case 5: Unremarked Absurdities.* Bizarre content accepted as normal within the dream (lack of critical reflection).

  3.  **Drafting the Requirements (Phenomenon + Motivation):**
      *   *Req 1 (Physiological Correlation):* Must account for the link between REM/activation and report generation. (Motivation: Lucid eye signals/REM reports).
      *   *Req 2 (Subjective Certainty vs. Truth):* Must explain why subjects are certain they dreamed (or didn't) even when objective measures conflict. (Motivation: Non-dreamers/REM denials).
      *   *Req 3 (Temporal Location):* Must specify *when* the dream happens (during sleep or at waking?). (Motivation: Eye signals imply *during*, memory drift implies *at waking*).
      *   *Req 4 (Content Stability):* Must account for the malleability of the report post-waking. (Motivation: Narrative drift).
      *   *Req 5 (Cognitive Status):* Must explain the lack of critical judgment within the dream state. (Motivation: Unremarked absurdities).

  4.  **Sorting Requirements (Non-negotiable vs. Camp Commitments):**
      *   *Constraint 1: "Ordinary dream talk systematically false".* Is this a constraint? Realists say yes (we talk as if dreams are experiences). Deflationists say ordinary talk is confused. *Verdict:* This is a camp commitment (Realist preference), not a neutral constraint.
      *   *Constraint 2: "Reports as fallible as memory elsewhere".* Realists want this (dreams are memories of experiences). Deflationists (Dennett) suggest they are *more* fallible (fabricated at waking). *Verdict:* This is also a camp commitment/taste. A neutral account just needs to explain *why* they are fallible, not presuppose the degree relative to other memory.
      *   *Non-negotiables:* Physiological correlation (eye signals are hard data), Subjective certainty (phenomenology is data), Temporal location (must take a stand), Content malleability (must explain the drift).

  5.  **Methodology (Conceptual vs. Empirical):**
      *   Malcolm (Wittgensteinian): Conceptual. Dreams are not inner experiences; "I dreamed" is a story told on waking.
      *   Dennett (Materialist/Deflationary): Empirical/Conceptual hybrid. Dream content is "narrative gravity" imposed at waking.
      *   Realists (Empirical): Dreams are neural events during sleep.
      *   *Analysis:* If the requirement is empirical (e.g., eye signals), conceptual analysis alone fails. If the requirement is about the *grammar* of "dreaming," empirical data might be irrelevant to Malcolm. This highlights they are answering different questions.

  6.  **Identifying Tensions (The "Hard Tension"):**
      *   The prompt specifically flags: Datable to sleep (physiology) vs. Evidence is waking impression.
      *   *Conflict:* If dreams are strictly waking impressions (Malcolm), eye signals are coincidental or reinterpreted. If dreams are sleep events (Realist), why do reports change so much after waking (memory contamination)?
      *   *Incompatibility:* You cannot fully satisfy "Dreams are identical to neural events during sleep" AND "Dream reports are purely constructive narratives formed at waking" without qualifying one.

  7.  **Evaluating Malcolm and Dennett:**
      *   *Malcolm:* Dreams are not experiences during sleep.
