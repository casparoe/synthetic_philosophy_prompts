          *   *Check:* Confidence markers. Need to insert [Confidence: High/Med/Low] or similar. Let's use parenthetical confidence estimates.
          *   *Refinement on Tension:* The prompt asks to flag pairs/triples that can't be jointly met. The big one is (A) Dream is a sleep event + (B) Report is the only evidence + (C) Report is highly malleable. If (A) is true, (C) suggests memory is bad. If (B) is true, (A) is unsupported.
          *   *Refinement on Malcolm/Dennett:* Malcolm's biggest hit is the Eye Signal. Dennett's biggest hit is also the Eye Signal (timing of narrative construction). I need to pick the *single* most damaging requirement for each. For Malcolm, it's the Eye Signal (Physiological Correlation). For Dennett, it's the Temporal Location (since he pushes the *content* to waking). Actually, both fail the Eye Signal best. Let's look closer. Malcolm says "I dreamed" is meaningless as a past tense experience. Eye signals make "I was doing X while asleep" meaningful. So Physiological Correlation kills Malcolm. Dennett says the *story* is made at waking. Eye signals show specific content *during* sleep. So Physiological Correlation kills Dennett too. Maybe distinguish: Malcolm fails on *existence*, Dennett fails on *timing of content*. Let's assign Physiological Correlation to Malcolm and Temporal Location to Dennett for variety, or acknowledge they both fail the same one. The prompt asks for "which single requirement does the most damage." I will argue Physiological Correlation (specifically Lucid Signals) damages both, but perhaps Temporal Location is the deeper conceptual break for Dennett. No, the Eye Signal is the empirical hammer. I'll stick with Physiological Correlation for both, or differentiate. Let's differentiate: Malcolm fails *Subjective Certainty* (he says the subject is conceptually confused), Dennett fails *Physiological Correlation* (hard to match narrative construction to specific eye blinks). Actually, the prompt hints at the tension between "datable to sleep" and "evidence is impression." I should use that.
