          *   *Damaging Req:* Temporal Location / Physiological Correlation.
      *   *Comparison:* Malcolm denies the experience exists *at all* during sleep. Dennett allows neural activity but denies the *narrative content* exists until waking. Both struggle most with the Lucid Dreaming data.

