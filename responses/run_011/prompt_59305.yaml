answer: |-
  This phenomenon sits at the intersection of semiotics, perceptual psychology, and information theory, but no single existing term captures the specific *mechanism* you are describing. You are describing a transformation where the "style" functions as a correlated signal across the set, allowing the brain to treat it as a baseline rather than a feature.

  Here are the nearest established candidates, why they fail to carve the joint correctly, and the proposed coinage.

  ### 1. Family Resemblance (Wittgenstein)
  *   **The Concept:** Category membership is determined by overlapping similarities rather than a single necessary condition.
  *   **Where it Fails:** Family resemblance explains how we recognize variations *within* a category (why a round 'a' and a sharp 'a' are both 'a'). It does not explain the *relational* boundary *between* categories. It cannot account for why a round 'a' is legible in a round alphabet but reads as an 'o' in a standard one. It treats the category as a cloud, not as a point in a vector space defined by its distance from other points.

  ### 2. Allography (Goodman / Linguistics)
  *   **The Concept:** Different physical marks that count as the same symbol within a notation system (e.g., italic 'a' vs. roman 'a').
  *   **Where it Fails:** Allography is typically discrete and predefined. It assumes the system (the font or hand) is already established. Your program is exploring the *genesis* of that system. Furthermore, Goodman is strict: if a mark changes the symbol identity, it is not an allograph. Your phenomenon shows that allography is *context-dependent*: the same mark is an allograph in one context (global) and a different symbol in another (isolated). Allography describes the status of the mark, not the transformation that creates it.

  ### 3. Perceptual Normalization (Speech Perception)
  *   **The Concept:** Listeners adjust their perception of phonemes based on the speaker's vocal tract (e.g., adjusting for a high-pitched voice).
  *   **Where it Fails:** This is the closest cognitive mechanism. However, it names the *listener's compensation*, not the *stimulus property*. You are asking for the name of the distortion pattern itself. Normalization is the brain's solution; you need the term for the problem structure that makes normalization possible.

  ### The Carving: Signal vs. Baseline
  Your insight ("a letter isn't its features but its distances to its neighbours") is structurally identical to **differential signaling** in engineering.
  *   **Absolute Features:** The specific coordinates of the ink (the voltage on a single wire).
  *   **Relative Distances:** The difference between letters (the voltage difference between two wires).

  When you distort a single letter, you introduce noise into a single channel. The receiver (the reader) has no reference to subtract this noise, so the signal is corrupted (the 'a' becomes an 'o').
  When you distort the whole alphabet, you introduce the same noise into *all* channels. The receiver subtracts the common baseline to recover the differences. The "style" is effectively **correlated noise** that the visual system filters out as the new zero-point.

  ### The Boundary Case
  You asked if this holds when a global distortion makes two letters merge.
  **No.** This is the failure condition of the concept.
  In signal terms, this is **clipping** or **channel collision**. If the "common-mode" shift is non-linear or large enough that the *differential* distance between two categories drops to zero (e.g., your round 'a' and round 'o' become identical circles), the topology of the category space breaks. The distortion ceases to be a "style" and becomes a "loss of information." The validity of the distortion is bounded by the **injectivity** of the mapping: distinct inputs must map to distinct outputs.

  ### The Coinage
  Since existing terms describe the *result* (allography) or the *cognition* (normalization), we need a term for the *transformation pattern* itself. In engineering, a signal that appears identically on all lines is called **Common-Mode**. When applied to your handwriting generation, the distortion is harmless only when it is Common-Mode (global). When applied to a single letter, it is **Differential-Mode** (noise).

  Therefore, the distortion pattern is a **Common-Mode Distortion**. It defines "style" as a global offset that the perceptual system cancels out to recover the "content" (the letter identity).

  \answer{Common-Mode Distortion}
