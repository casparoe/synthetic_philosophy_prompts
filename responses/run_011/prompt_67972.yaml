          *   Condorcet Cycle $\leftrightarrow$ Doctrinal Inconsistency.
      *   **Key Difference:** Condorcet shows majority rule *fails* to produce a transitive ordering. Doctrinal shows majority rule produces *consistent* outcomes on premises that imply an *inconsistent* outcome on the conclusion (or vice versa).
