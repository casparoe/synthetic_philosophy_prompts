  2.  **Deconstruct the Doctrinal Paradox vs. Condorcet Paradox:**
      *   **Condorcet Paradox:** Preference aggregation. Voters have transitive preferences over alternatives ($A, B, C$). Majority rule leads to intransitive social preference ($A > B, B > C, C > A$).
      *   **Doctrinal Paradox (Discursive Dilemma):** Judgment aggregation. Voters make logical judgments on interconnected propositions ($p, q, p \land q \to r$). Majority rule on premises leads to a different outcome than majority rule on conclusion.
      *   **User's Claim:** They are the same thing.
      *   **Reality:** They are structurally related (both impossibility theorems in social choice) but distinct mechanisms. Condorcet is about cycles in preferences; Doctrinal is about inconsistency in judgments.
