  - **Verdict**
  The package is barely tenable. It hangs on an equivocation regarding the definition of "harm." The single most serious problem is the conflict between Item 2's claim that revulsion is a reason "in its own right" and Item 5's denial of legal moralism. You want the democratic weight of Devlin without the metaphysical baggage, but you retain the moralist conclusion while denying the moralist label. This leaves you vulnerable to the charge that you are simply redefining "harm" to include whatever the majority finds repugnant, which collapses your distinction between liberalism and moralism.

  - **Genuine tensions, ranked**
  1. **Item 2 vs. Item 5 (The Status of Revulsion):** Item 2 claims majority revulsion is a reason "in its own right," not merely a symptom of harm. Item 5 denies legal moralism, prohibiting wrongs where "nothing is harmed and nobody's interests are set back." If revulsion tracks degradation, is degradation an interest setback? If yes, Item 2's claim of independence is false; revulsion is just evidence. If no, Item 5 is violated. This is substantive because it determines whether you are a liberal who trusts public intuition about harm, or a moralist who trusts public intuition about wrongs. The cheapest revision is to treat revulsion as evidentiary of harm. This costs you the distinctively anti-liberal claim in Item 2 that the legislature overriding the "reasonable man" is not being "more moral." You concede the philosopher might better identify actual harm than the mob. Furthermore, if revulsion is only evidence, it is defeasible evidence. If experts show no harm in surrogacy, Item 2 loses its grip, weakening your Case Verdicts.

  2. **Item 2 vs. Item 6 (The Prostitution Exception):** Item 2 makes settled revulsion "indispensable." Item 6 decriminalizes prostitution, despite widespread historical and contemporary revulsion. If the "reasonable man" is the guide (Item 2), why is he ignored here? You need a principle distinguishing sex work revulsion from surrogacy revulsion. Without it, Item 2 swallows Item 6. The clash is substantive because it reveals an unstated hierarchy of moral intuitions. The cheapest revision is to argue sex work revulsion is mere offense (Item 4) while surrogacy revulsion tracks degradation. This costs you the authority of the "reasonable man" in Item 2. You are now deciding which of his revulsions count, implying the philosopher's critical morality (which Item 2 rejects) is needed to filter them. You reintroduce the elite judgment Item 2 purported to bypass.

  3. **Item 3 vs. Item 6 (The Commodification Harm):** Item 3 makes harm a necessary condition. Item 6 prohibits paid surrogacy and kidney donation. If these transactions are consensual and safe, the "harm" is moral corruption or degradation. If degradation counts as harm, Item 5 is safe but Item 3 becomes vague. If degradation does not count as harm, Item 3 is violated. This forces you to stretch "harm" to cover moral wrongs, collapsing the distinction between Items 3 and 5. The cheapest revision is to define commodification as a specific type of harm (self-alienation). This costs you clarity; you must explain why selling sex (Item 6) is not self-alienation while selling kidneys is, without relying on the revulsion you claimed was independent in Item 2. If you rely on revulsion to define the harm, you circle back to Tension 1. If you rely on objective features, you must articulate a non-moralist difference between sex and kidneys that sustains the harm claim.

  - **Tensions that dissolve**
  1. **Item 1 vs. Item 2:** This looks like a contradiction (Devlin is false vs. Devlin's mechanism is useful) but dissolves. Item 1 rejects the empirical claim that society disintegrates without shared morality. Item 2 accepts the normative claim that democratic sentiment should guide law. You can reject the *consequence* (disintegration) while accepting the *input* (public sentiment). This holds provided you treat Item 2 as a democratic principle, not a functionalist one.
  2. **Item 3 vs. Item 4:** These align perfectly. Item 3 requires harm for prohibition. Item 4 rejects offense (which is defined as distress without interest setback) as a ground. Since offense lacks harm, Item 3 already prohibits using it. Item 4 merely clarifies that "captive audience" issues are cashed out as harm, not offense. No conflict exists here.
  3. **Item 1 vs. Item 5:** Rejecting Devlin's premise (Item 1) supports rejecting legal moralism (Item 5). If society doesn't need shared morality to exist, the justification for enforcing morality collapses. This is a reinforcing relationship, not a tension.

  - **The three case verdicts**
  1. **Surrogacy:** Items 3 and 5 cannot deliver this prohibition alone unless you define commodification as "harm." If the surrogate is consenting and unpaid surrogacy is allowed, the harm must be in the *payment*. This relies heavily on Item 2 (revulsion registers degradation). Item 2 is load-bearing here; without it, the prohibition looks like illegal moralism under Item 5.
  2. **Kidneys:** Same as surrogacy. If the donor is consenting and healthy, the prohibition rests on the repugnance of selling organs. Item 2 justifies this; Item 5 threatens it. You must argue that selling kidneys sets back the donor's interests (degradation) to satisfy Item 5.
  3. **Prostitution:** Item 4 delivers this verdict (reject offense principle). Item 3 supports it if no harm is shown. However, Item 2 threatens it. If the majority finds sex work repugnant, Item 2 suggests prohibition. To maintain this verdict, you must argue sex work revulsion is mere offense (Item 4), unlike surrogacy revulsion. Item 4 is load-bearing; Item 2 is the obstacle.

  - **Cheapest overall repair**
  Revise Item 2. Drop the claim that revulsion is a reason "in its own right." Instead, claim revulsion is a *heuristic* for identifying degradation (harm). This aligns Item 2 with Item 5 (no prohibition without harm) and Item 3 (harm necessary). You lose the anti-liberal sting of claiming majority sentiment is intrinsically authoritative. You become a paternalist who trusts the public to spot harm, rather than a quasi-Devlinian who trusts the public to define wrongs. This saves consistency but makes your view more vulnerable to the charge that the public often spots harm where none exists (e.g., prostitution).
