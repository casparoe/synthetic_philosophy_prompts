  ### Why These Categories? (And Not Others)

  1.  **No "Correct/Incorrect":** Berkeley's argument is valid *if* you accept his premises. Grading for correctness teaches dogma. Grading for *move* teaches argument mapping.
  2.  **PIC vs. LIM:** This is the critical pressure point. Berkeley relies on students confusing *imagining* (PIC) with *supposing* (LIM). Separating these ensures you catch who fell for the equivocation.
  3.  **TRAP vs. GRAM:** TRAP accepts the phenomenology but regrets it. GRAM rejects the phenomenology as irrelevant. This distinguishes the *confessed idealist* from the *frustrated realist*.
  4.  **WIT (The God Clause):** This is the only category that allows for Berkeley's actual solution (God's perception) without conflating it with Realism (no perception needed). If a student says "God sees it," they are WIT. If they say "It just exists," they are REAL. The procedure keeps these distinct.
  5.  **The Domain Tag:** A REAL response to the Past is scientifically literate. A REAL response to the Object is philosophically naive. The Tag ensures your note reflects that difference without changing the code.

  ### Where the Procedure Bites (Your Check)

  *   **The God Concession:** Handled by **WIT**. If a student writes, "The tree is in God's mind," they get WIT ("You found a way to keep it perceived without you"). If they write, "The tree exists unperceived," they get REAL ("You're trusting your gut"). The procedure registers the concession (perception is required) in the first, but not the second.
  *   **The Image/Proposition Split:** Handled by **PIC** vs. **LIM**. PIC says "I saw it." LIM says "I can't see it, but..."
  *   **The Smuggling:** Handled by **TRAP**. "I can't get rid of myself."

  ### Final Instruction on the "Judgment" Step
  Do not skip the **JUDGE** code. If you force Card 7 into LIM, you tell the student their distinction between *object* and *act of conceiving* is the same as a student who just says "I have a bad imagination." It isn't. Use the override for the top 5% of cards that break the rubric. It saves you from misclassifying the best thinkers in the room.
