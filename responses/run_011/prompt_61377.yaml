answer: |-
  ### The Three-Track Triage Procedure

  **Philosophical Grounding:**
  This procedure does not grade for "correctness." It grades for *positioning*. Berkeley's challenge isn't a syllogism; it's a phenomenological trap. The goal is to identify where the student stands in relation to the trap: Did they fall in (Image)? Did they notice the bars (Trap/Limit)? Did they walk away (Realist/Grammar)? Did they find a back door (Other Mind)?

  **Time Budget:** 60 seconds per card.
  **Tools:** Red pen (for your codes), Blue pen (for student notes).

  ---

  ### Step 1: The Domain Tag (5 Seconds)
  Scan the card for the *target* of their conception. Circle one letter in the top right corner. This determines the "force" of the argument for this specific response.

  *   **O (Object):** A tree, a book, a room. (Standard Berkeley).
  *   **P (Past):** Dinosaurs, pre-human earth, history. (Requires continuous perception).
  *   **M (Minds):** Other people's pain, thoughts, experiences. (Solipsism risk).

  *Why sort first?* A "Common Sense" objection works for the Past (science requires it) but begs the question for the Object (philosophy challenges it). The tag ensures your note acknowledges this weight.

  ### Step 2: The Move Diagnosis (30 Seconds)
  Read the response. Match the primary move to one of these six labels. Write the code in the top left.

  1.  **PIC (Picture Claim):** Claims success via mental imagery. ("I saw it," "I pictured it").
      *   *Diagnosis:* They treated "conceive" as "visualize." They likely smuggled themselves in as the viewer.
  2.  **TRAP (Self-Block):** Claims failure because their own mind is doing the thinking. ("I'm the one picturing," "I can't remove myself").
      *   *Diagnosis:* They felt the phenomenological squeeze. They noticed the smuggling.
  3.  **GRAM (Rule Check):** Claims the task is linguistically or logically incoherent. ("It's grammar," "Goalposts," "Nonsense").
      *   *Diagnosis:* They are attacking the framework, not the tree.
  4.  **REAL (Gut Check):** Asserts existence regardless of the mental exercise. ("I trust my senses," "It's there anyway").
      *   *Diagnosis:* Realist intuition overriding idealist constraints.
  5.  **LIM (Mind Limit):** Distinguishes between *their* inability to imagine and the *world's* ability to exist. ("Limit on my imagination," "Copy in my head").
      *   *Diagnosis:* Lockean distinction between idea and object. Saves the object by blaming the brain.
  6.  **WIT (External Witness):** Saves the object by positing a perceiver other than the student. ("God," "Someone else," "Other minds").
      *   *Diagnosis:* The Berkeleyan move. Concedes "perceived" but denies "perceived *by me*."

  ### Step 3: The Note Generation (25 Seconds)
  Write one line in blue ink. Use the **Base Note** for the Label, then apply the **Domain Modifier** if necessary. Keep it conversational.

  | Label | Base Note (Write this) | Domain Modifier (Add if tagged) |
  | :--- | :--- | :--- |
  | **PIC** | "You pictured a tree, but you were there to picture it." | **P:** "History needs more than a mental image." <br> **M:** "You can't picture another's pain from the inside." |
  | **TRAP** | "You caught yourself entering the scene." | **P:** "Hard to apply this to times before you existed." <br> **M:** "This leads quickly to solipsism." |
  | **GRAM** | "You're questioning the rules of the game, not the tree." | **P:** "Scientific claims need to survive this grammar." <br> **M:** "Language about other minds is tricky here." |
  | **REAL** | "You're trusting your gut over the puzzle." | **P:** "Science relies on this assumption." <br> **M:** "We act as if this is true daily." |
  | **LIM** | "Nice split between mental limits and reality." | **P:** "Useful for separating evidence from existence." <br> **M:** "Does this make other minds unknowable?" |
  | **WIT** | "You found a way to keep it perceived without you." | **P:** "This is the standard theological fix." <br> **M:** "Analogy is the standard secular fix." |

  ### Step 4: The Judgment Flag (Explicit Override)
  If a card contains a distinction between *conceiving the object* and *conceiving the perception of the object*, do not use the codes. Circle **JUDGE** and write: *"Nuanced take on what 'conceive' means."*
  *Why:* The rubric treats "conceive" as a monolith. If a student splits it, they have outgrown the triage. Mark it for discussion, not sorting.

