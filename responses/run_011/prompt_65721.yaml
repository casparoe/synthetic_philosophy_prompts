  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User:** Deputy Director of a merged humanitarian org (8 months in).
      *   **Background:** Came from the "evaluation/unit" side (cost-effectiveness methodology). Previously argued against the "faith-based/presence" side's approach. Now holds the pen on allocation. Merger failure would be blamed on them.
      *   **Context:**
          *   Board: 9 members (4 Founding A, 4 Founding B, 1 Chair). Needs 6 votes (min 3 from each side). Deadlock = previous year's allocation.
          *   Budget: ~$4.1M/quarter. Emergency reallocation: $600k (72 hrs, Director + Chair).
          *   Constraints: Public reporting (no side deals), Funder veto (sanctioned gov), Methodology amendment is hard (2 quarters, supermajority), 2 grants conditional on not contradicting methodology.
          *   Dynamics: "Their" side (Faith/Presence) has 4 board members (1 sympathetic to Methodology). "Our" side (Evaluation/Cost) has 4 board members.
          *   Problem: Deadlocked twice, lost matching window. Instinct to concede low-cost/high-principle items is failing.
      *   **Task:** Write a decision procedure (1 page, numbered steps) for program officers (no bargaining theory training).
      *   **Requirements for Procedure:**
          *   Distinguish surplus-creating trades vs. value transfers.
          *   Account for deadlock default & outside options (their capacity to act alone vs. ours).
          *   Discipline cheap claims of intensity.
          *   Identify "no trade" zones (compromise worse than original proposals).
          *   Separate means/priority/timing trades from public judgment trades.
          *   Handle participation in condemned activities (veto/price/referral?).
          *   Handle publicity constraint (trades that only exist if unwritten).
          *   Handle the sympathetic board member (when to engage individually).
          *   Include a branch to improve outside option/accept deadlock.
      *   **Application:** Apply to three specific cases (Gov ministry diversion, Clinic network for triage concession, Emergency famine vs. high-impact elsewhere).
      *   **Closing:** Mark judgment calls disguised as procedure. Explain exploitation by unscrupulous counterparts. List three things the procedure cannot tell me.
      *   **Tone:** Practical, rigorous, unsentimental, operational. No literature survey.

  2.  **Drafting the Decision Procedure (The "Algorithm"):**

      *   *Goal:* Needs to be actionable in <1 hour.
      *   *Structure:* Linear flow with decision nodes.
      *   *Key Concepts to Embed:*
          *   *BATNA (Best Alternative to a Negotiated Agreement):* Here, it's the Deadlock Default (previous year's allocation).
          *   *ZOPA (Zone of Possible Agreement):* Where both sides are better off than deadlock.
          *   *Verifiability:* Public report constraint.
          *   *Ethical/Methodological Red Lines:* Funder veto, conditional grants.
      *   *Step 1: Legality & Authority.* (Funder veto, grant conditions). If fail -> Stop.
      *   *Step 2: The Deadlock Baseline.* Compare proposal to "Last Year's Allocation." Is *everyone* better off than last year? If not, why trade?
      *   *Step 3: Surplus vs. Transfer.* Does this create new value or just move money? (Hard for POs). Use the "Both Sides Gain vs. Status Quo" test.
      *   *Step 4: Intensity & Claims.* How to verify "faith-based" claims without data? Look for *skin in the game* (commitment of their own restricted funds).
      *   *Step 5: Public Judgment.* Does this contradict published methodology? If yes -> Referral to Director (User).
      *   *Step 6: The "Unwritten" Test.* Can this survive the quarterly report? If no -> Stop.
      *   *Step 7: Board Dynamics.* Sympathetic member. Engage only if it secures the 3rd vote without fracturing the bloc permanently.
      *   *Step 8: The "No Trade" Option.* Is improving our outside option better than a bad deal?

      *Refining the Steps for the Prompt's Specific Requirements:*
      *   Need to explicitly handle the "participation in condemned activity" (Case 1).
      *   Need to handle the "emergency rule" (Case 3).
      *   Need to handle the "sympathetic member."
      *   Need to handle the "deadlock is an option" branch.

      *Drafting the Steps (Mental Iteration):*
      1.  **Compliance Check:** Funder veto? Grant conditions? If yes -> Reject.
      2.  **Baseline Comparison:** Is this better than Last Year's Allocation (LYA) for *both* sides? If one side is worse off than LYA, they will vote No.
      3.  **Surplus Test:** Does this unlock funds or efficiency that LYA doesn't? Or is it just a transfer?
      4.  **Intensity Verification:** They claim high need. Do they commit restricted funds? If no -> Discount claim.
      5.  **Public Consistency:** Does this require lying in the report? If yes -> Reject. Does it contradict methodology? -> Refer to Director.
      6.  **Complicity Check:** Does this make us partner with condemned entities? -> Refer to Director (Value Judgment).
      7.  **Board Math:** Do we need the sympathetic vote? Only use if it doesn't expose them.
      8.  **Deadlock Option:** If no surplus, accept deadlock to build leverage.

      *Polishing for the "One Page" constraint:* Needs to be tight. Use "If/Then" logic.

  3.  **Applying to Cases:**

      *   *Case 1 (Gov Ministry/Diversion):*
          *   Compliance: Funder veto on sanctioned gov? Prompt says "standing veto over any partnership with a sanctioned government body." This is a hard stop unless the ministry isn't "sanctioned" but "documented to divert." If diverted away from a minority, is it ethical?
          *   Public Consistency: Cost per unit +22%. Methodology violation?
          *   Complicity: Partnering with diverting ministry.
          *   *Verdict:* Likely Referral or Reject based on Funder Veto/Methodology.
      *   *Case 2 (Clinic for Triage):*
          *   Surplus: They withdraw objection (value to us), we fund clinic (value to them).
          *   Intensity: Metrics show "no effect." They claim deep ties.
          *   Test: Do they commit funds? If they won't put money in a place with "no effect," why should we?
          *   *Verdict:* Reject unless they co-fund.
      *   *Case 3 (Emergency Famine):*
          *   Rule: 72hr/$600k.
          *   Outside Option: They act alone with restricted funds. We act elsewhere with higher impact.
          *   Publicity: If we walk away, no one notices. If we go, they get credit either way.
          *   Deadlock/Concede: If we act, we set precedent of ignoring metrics for presence. If we don't, they act alone.
          *   *Verdict:* Concede the round (don't use emergency funds). Let them act alone. Price the precedent (loss of moral authority on metrics).

  4.  **Drafting the "Failure & Limitations" Section:**

      *   *Judgment Calls:* What looks like a calculation but is actually a value choice? (e.g., discounting testimony, defining "condemned").
      *   *Exploitation:* How can they game this? (e.g., false commitments, fracturing the bloc, creating artificial emergencies).
      *   *Unknowns:* What can't this solve? (Long-term trust, personal relationships, true intent).

  5.  **Review against Constraints:**

      *   *One page procedure?* Keep it tight.
      *   *Under an hour?* Yes, checklist style.
      *   *Usable by PO?* Avoid jargon like "BATNA" or "Pareto Frontier." Use "Last Year's Allocation" and "Better for Both."
      *   *Address all specific prompt requirements?* (Surplus vs Transfer, Deadlock Default, Intensity Discipline, No-Trade Zone, Means vs Values, Complicity, Publicity, Sympathetic Member, Improve Outside Option).
      *   *Three Cases Applied?* Yes.
      *   *Mark Judgment Calls?* Yes.
      *   *Failure/Exploitation/Unknowns?* Yes.

  6.  **Refining the Content (Self-Correction during drafting):**

      *   *Correction on Case 1:* The prompt says "Funder holds a standing veto over any partnership with a sanctioned government body." Case 1 says "government ministry documented to divert." It doesn't explicitly say "sanctioned." I need to be careful. If it's not sanctioned, the veto doesn't trigger legally, but the *diversion* might trigger the "condemned activity" clause. I will treat it as a Referral on Values/Complicity.
      *   *Correction on Case 3:* The prompt asks: "If the procedure's answer in the third case is that I should concede the round, say so plainly... do not soften it." I must ensure the procedure allows for "Do Nothing" as a valid output.
      *   *Sympathetic Member:* Need to be careful. Engaging individually can be seen as undermining the bloc. The procedure should advise caution.
      *   *Intensity:* The prompt asks to "discipline a claim of intensity." The best way is to ask for *skin in the game* (restricted funds).
      *   *Deadlock:* The prompt emphasizes "improve our outside option and accept the deadlock." I need to make sure Step 8 explicitly allows this.

  7.  **Final Polish:** Check tone. It needs to be cold, professional, and direct. The user is in a high-stakes political trap; the tool needs to be a shield.

      *(Self-Correction on Length)*: The prompt asks for the procedure to be "about a page." I will format it densely. The case applications and analysis follow separately.

      *(Check on "Judgment Call" marking)*: I will use brackets or bold text to indicate where human judgment overrides the algorithm.

      *(Check on "Three things it cannot tell me")*: Needs to be profound. (e.g., Truthfulness, Future Relationship, Moral Weight).

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # ALLOCATION TRADE DECISION PROTOCOL (ATDP)
  **Authorized Use:** Program Officers, Quarterly Rounds & Emergency Windows
  **Time Limit:** 60 Minutes
  **Objective:** Determine if a proposed trade creates mutual surplus or should be rejected/referred.

  **1. COMPLIANCE & VETO CHECK**
  *   **Question:** Does this trade trigger the Funder Veto (sanctioned government partnership) or violate Conditional Grant terms (public contradiction of methodology)?
  *   **Data:** Legal memo, Grant agreements.
  *   **Action:** If **YES**, terminate. Do not trade. If **NO**, proceed.
  *   *Note: This is a hard constraint. No bargaining.*

  **2. THE DEADLOCK BASELINE (BATNA)**
  *   **Question:** Is *every* board member's constituency strictly better off under this trade than under the Deadlock Default (Last Year's Allocation)?
  *   **Data:** Comparison of current proposal vs. previous year's line items.
  *   **Action:** If any side is worse off than Last Year, they will vote No. **Terminate** or **Revise**.
  *   *Judgment Call: Estimating "better off" for non-quantitative constituencies.*

  **3. SURPLUS VS. TRANSFER TEST**
  *   **Question:** Does this trade unlock new value (e.g., matching funds, access, efficiency) OR is it merely moving the $4.1M pie?
  *   **Data:** Evidence of new resources or access contingent on this specific trade.
  *   **Action:** If **Transfer Only**, proceed to Step 4. If **Surplus**, proceed to Step 5.
  *   *Logic: Pure transfers increase conflict risk; surplus reduces it.*

  **4. INTENSITY DISCIPLINE (THE "SKIN IN THE GAME" RULE)**
  *   **Question:** The other side claims high intensity (urgent need/principle). Are they committing *their* restricted funds or staff capacity to match this claim?
  *   **Data:** Written commitment of co-funding or staff hours.
  *   **Action:** If they claim high value but commit **Zero** of their own restricted resources, **Discount Claim by 50%** in your analysis. If they refuse to commit resources, **Terminate**.
  *   *Logic: Cheap talk is free; restricted funds are scarce.*

  **5. PUBLIC JUDGMENT & COMPLICITY**
  *   **Question:** Does executing this trade require us to publicly affirm a principle we have condemned (e.g., partnering with diverting entities) or contradict our published methodology?
  *   **Data:** Draft text of the Quarterly Report.
  *   **Action:** If **Yes**, this is a **Value Referral**. Stop. Send to Deputy Director. Do not attempt to price this as a cost.
  *   *Judgment Call: Distinguishing "operational compromise" from "moral complicity."*

  **6. THE "UNWRITTEN" TEST**
  *   **Question:** Does this trade rely on a promise that cannot be written in the Quarterly Report without causing a veto or scandal?
  *   **Data:** Can the rationale be published verbatim?
  *   **Action:** If **No** (it requires a side-letter or silence), **Terminate**.
  *   *Logic: Unwritten deals become weapons in the next round.*

  **7. BOARD DYNAMICS & THE SYMPATHETIC VOTE**
  *   **Question:** Do we need the 3rd vote from their bloc? Is the sympathetic member willing to break ranks publicly?
  *   **Data:** Private channel check.
  *   **Action:** Engage the sympathetic member **ONLY IF** their vote secures the round *without* exposing them to retaliation from their bloc. If engaging them fractures the bloc permanently, **Terminate** and accept Deadlock.
  *   *Judgment Call: Assessing long-term coalition stability vs. short-term win.*

  **8. THE "NO TRADE" OPTION (IMPROVING OUTSIDE OPTION)**
  *   **Question:** If we accept Deadlock this round, do we gain leverage (e.g., let them fail alone, preserve methodology integrity) that outweighs the cost of the lost matching window?
  *   **Data:** Projection of their capacity to act alone vs. ours.
  *   **Action:** If Deadlock strengthens our long-term position or forces them to reveal true capacity, **Accept Deadlock**.
  *   *Logic: A bad deal now sets a precedent that lowers your value next year.*

  ***

  # APPLICATION TO CASES

  ### Case 1: National Distribution (Gov Ministry/Diversion)
  *   **Step 1 (Compliance):** Check if Ministry is "sanctioned." If yes, **Veto**. If no, proceed.
  *   **Step 5 (Complicity):** Partnering with a ministry documented to divert from a minority group contradicts humanitarian principles. This is not a cost; it is a value judgment.
  *   **Step 6 (Publicity):** Can we publish "We funded a diverting ministry"? No.
  *   **Step 4 (Intensity):** They ask us to absorb a 22% cost increase (1/6th of round benefit). Are they contributing restricted funds to offset this? If no, discount their claim.
  *   **Verdict:** **Referral to Deputy Director (Step 5).** This is not a trade; it is a reputational liability. The cost efficiency loss is secondary to the complicity risk. Do not price this.

  ### Case 2: Clinic Network for Triage Concession
  *   **Step 3 (Surplus):** They withdraw objection (high value to us); we fund clinic (value to them). Looks like surplus.
  *   **Step 4 (Intensity):** Your metrics show "no effect." They claim "deep ties." Do they commit restricted funds to the clinic?
      *   *If No:* They are asking you to subsidize their presence with your efficiency capital. **Terminate.**
      *   *If Yes:* They have skin in the game. Proceed.
  *   **Step 6 (Publicity):** Can you publish "Funded clinic with no measured effect"? If this violates methodology conditional grants, **Veto (Step 1)**.
  *   **Verdict:** **Terminate unless they co-fund.** If they won't put money into a "no effect" zone, you should not either. The asymmetry indicates they value the *presence*, not the *outcome*. You cannot trade outcome-capital for presence-value without breaking your methodology.

  ### Case 3: Emergency Famine (72-Hour Rule)
  *   **Step 2 (Baseline):** Deadlock = You fund high-impact elsewhere. They fund famine with restricted money.
  *   **Step 4 (Intensity):** They say they will act alone. They have 30 years infrastructure. You have none.
  *   **Step 8 (No Trade Option):** If you spend the $600k there, you gain little (no infrastructure) and set a precedent of ignoring metrics for emergencies. If you *don't*, they act alone (they get credit), and you save the $600k for high-impact work.
  *   **Verdict:** **Accept Deadlock (Do Not Trade).**
  *   **Pricing the Precedent:** The cost of acting is the erosion of your emergency rule's integrity. You become a generalist fund in a specialist crisis. Let them act alone. The $600k does more good elsewhere. You lose no moral credit because they will claim it regardless. **Do not soften this.** A "compromise" split dilutes impact and sets a bad precedent.

  ***

  # FAILURE MODES & LIMITATIONS

  ### Judgment Calls Disguised as Procedure
  1.  **Step 5 (Complicity):** The line between "operational necessity" and "moral complicity" is not factual. You are outsourcing your ethical burden to the PO.
  2.  **Step 2 (Baseline):** Determining if a constituency is "better off" when their currency is *presence* and yours is *lives saved* requires an exchange rate you do not possess.
  3.  **Step 7 (Sympathetic Member):** Assessing whether a vote "fractures the bloc" is political intuition, not data.

  ### Exploitation by an Unscrupulous Counterpart
  1.  **The False Commitment:** They pledge restricted funds in Step 4 to pass the test, then renege post-approval, knowing you cannot reverse the allocation without board chaos.
  2.  **The Artificial Emergency:** They manufacture a "72-hour" crisis (Case 3) to bypass the quarterly scrutiny, knowing you hesitate to say "no" to famine.
  3.  **The Bloc Feint:** They use the sympathetic member to signal flexibility,诱 ing you into a trade, then vote as a unified bloc to demand more, knowing you've already invested reputational capital in the deal.

  ### Three Things This Procedure Cannot Tell You
  1.  **Truth:** It cannot verify if their testimony about community need is honest or strategic fabrication.
  2.  **Trust:** It cannot measure the erosion of personal relationships caused by rigid adherence to the "No Trade" option.
  3.  **The Future:** It cannot predict if a "bad precedent" set today will actually bind you tomorrow, or if the Board will simply forget in six months.
