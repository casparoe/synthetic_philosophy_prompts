answer: |-
  Your hypothesis is not just plausible; it is the standard meta-philosophical critique of the joint action literature, and you have arrived at it in six weeks what often takes graduate students two years to realize. You are right to suspect that the stalemate is not about the *phenomena* (everyone sees the canoe moving) but about the *explanatory project*.

  However, to pressure-test this properly, I need to refine your diagnosis. It is not merely that you are answering three different questions. It is that each camp claims their question is *foundational* to the others. They aren't just talking past each other; they are fighting over which floor the building stands on.

  Here is the diagnosis of the disagreement, the reality check on what is actually settled in the field, and what would constitute progress.

  ### 1. The Diagnosis: Explanatory Priority, Not Just Definition

  You have correctly identified the three dominant poles in the literature, though I will map them to their primary proponents to ensure we are precise about what work the claims are doing.

  *   **Camp 1 (The Functionalists):** This is the **Bratmanian** position (Michael Bratman).
      *   **The Work:** Their goal is to show how joint action is possible without spooky metaphysics. They want to save the phenomenon of "we-doing" while respecting methodological individualism.
      *   **The Claim:** Normativity (the right to rebuke) is a *consequence* of the structural features of planning agency. If I plan on us painting, and you plan on us painting, and we know this, rationality dictates I rely on you. If you bail, you violate a norm of *instrumental rationality*, not necessarily a social contract.
      *   **The Vulnerability:** As Camp 2 notes, this feels like "normativity-lite." It explains why I'm *frustrated* you stopped rowing, but not why I am *entitled* to demand you resume.

  *   **Camp 2 (The Normativists):** This is the **Gilbertian** position (Margaret Gilbert).
      *   **The Work:** Their goal is to capture the *phenomenology of obligation*. They argue that the distinctive feature of joint action is the creation of a "plural subject."
      *   **The Claim:** The binding force is primitive and normative. You cannot derive an "ought" (the right to rebuke) from an "is" (interlocking beliefs and desires). Therefore, the joint commitment must be a sui generis social fact.
      *   **The Vulnerability:** As Camp 1 notes, this looks like magic. How does a "joint commitment" exist if not in the heads of the individuals? It risks positing a group mind by the back door.

  *   **Camp 3 (The Naturalists):** This is a mix of **Searle** (John Searle) and **Tomasello** (Michael Tomasello).
      *   **The Work:** Their goal is evolutionary and cognitive compatibility. They want to know how a primate brain does this.
      *   **The Claim:** "We-intentionality" is a biological primitive. It is not constructed out of I-intentions (contra Camp 1) and it is not primarily a normative contract (contra Camp 2); it is a cognitive capacity selected for cooperation.
      *   **The Vulnerability:** Calling normativity a "category mistake" is risky. Even if the *capacity* is biological, the *practice* seems inherently normative. Camp 3 often conflates the *source* of the capacity with the *logic* of the action.

  **The Real Stalemate:**
  The argument isn't about whether the canoe moves. It is about **Explanatory Priority**.
  *   Camp 1 says: Rational Planning $\rightarrow$ Normative Force.
  *   Camp 2 says: Normative Commitment $\rightarrow$ Rational Planning.
  *   Camp 3 says: Biological Capacity $\rightarrow$ Both of the above.

  Because each side treats their starting point as the *ground* for the others, no counterexample works. If Camp 1 offers a case of interlocking plans without obligation, Camp 2 says, "That isn't joint action, that's just coordination." If Camp 2 offers a case of obligation without planning, Camp 1 says, "That's a social contract, not shared intention." They are using the same label ("Joint Action") to pick out slightly different slices of the same pie.

  ### 2. Settled vs. Contested (A Reality Check)

  You asked me to flag where people actually agree. I need to correct a significant point in your reconstruction.

  **What is actually settled in the field:**
  *   **The Rejection of Simple Summation:** Everyone agrees joint action is not just "I row + You row." There must be a "meshing" or "mutual awareness" condition.
  *   **The Rejection of Group Minds (mostly):** Almost no one (except perhaps extreme holists) believes there is a literal metaphysical entity hovering above the canoeists. Even Gilbert insists the commitment is held *by* the individuals, just in a special way.
  *   **The Importance of Mutual Knowledge:** Everyone agrees that if I think we are painting the house and you think we are burning it down, we are not acting jointly.

  **What is NOT settled (and your group might be wrong here):**
  *   **The "Strangers Shoveling" Case:** You wrote: *"Everybody accepts... the two strangers who start shoveling the same snowbound driveway without exchanging a word."*
      *   **Correction:** This is **highly contested**. Bratman explicitly excludes this from "Shared Intention." He calls it "coordinated interaction" but argues that without mutual knowledge and a commitment to mutual support, it lacks the stability of true joint action. Gilbert might allow it if a spontaneous joint commitment forms, but she emphasizes the *obligation* aspect, which is murky in strangers.
      *   **Why this matters:** If your group agrees on this, they have likely smoothed over a major fault line. Camp 1 usually denies this is full-blooded joint action. Camp 3 (Tomasello) might accept it as a basic form of shared agency. If you aren't fighting about this case, you aren't testing the boundaries of the theories.
  *   **The Status of Normativity:** There is zero consensus on whether the "right to rebuke" is essential. Camp 1 tries to derive it; Camp 2 posits it; Camp 3 often ignores it or treats it as a secondary social layer.

  ### 3. What Would Count as Progress?

  If my diagnosis is right (that this is a clash of explanatory priorities), then standard philosophical argumentation (intuition pumping) will not work. You have already proven this: "Each camp bites the bullet it's handed."

  Here is what would actually move the needle, ranked from most to least likely to succeed:

  **A. Formal Compatibility (The Integration Model)**
  *   **The Move:** Stop trying to kill the other theories. Ask: *Can we model Gilbert's normativity using Bratman's planning structures?*
  *   **Why:** Recent work (e.g., by Hakli, Collier, et al.) tries to show that normative constraints can emerge from iterative planning games. If Camp 1 can formally demonstrate how a "right to rebuke" emerges from repeated interlocking planning states, Camp 2 loses its "magic" objection.
  *   **Progress Condition:** A game-theoretic model where "joint commitment" is the equilibrium state of "interlocking plans."

  **B. Empirical Constraints (The Developmental Turn)**
  *   **The Move:** Use the infant/chimp literature not as decoration, but as a constraint.
  *   **Why:** Camp 3 claims the capacity is primitive. Camp 1 claims it is built from individual planning.
  *   **The Test:** Do 14-month-old infants (who lack complex planning architectures) show *normative* expectations of partners? (Tomasello's work suggests they do—they protest if a partner stops playing a game).
  *   **Progress Condition:** If infants show normative protest *before* they have the cognitive capacity for Bratman-style subplan meshing, Camp 1 is in trouble. If they show coordination *without* protest, Camp 2 is in trouble. Currently, the data is messy enough that both sides claim it, but stricter experimental design could discriminate.

  **C. Dissolution via Distinction**
  *   **The Move:** Admit there are two (or three) phenomena.
  *   **Why:** Perhaps "Joint Action" is an umbrella term covering:
      1.  **Shared Cooperative Activity** (Bratman): High-level, planning-heavy, adult human stuff.
      2.  **Primitive Shared Intentionality** (Tomasello): Biological, pre-normative, infant/animal stuff.
      3.  **Plural Subjecthood** (Gilbert): A specific normative status that *can* arise from (1) or (2) but is a distinct social layer.
  *   **Progress Condition:** You stop arguing about "The Canoe" and start arguing about "Which layer of the canoe are we analyzing?" This dissolves the stalemate but admits there is no single "Theory of Joint Action."

  **D. The Honest Answer: No Progress Expected**
  *   **Reason:** If the disagreement is truly about **Metaphysical Grounding** (Does normativity ground psychology, or vice versa?), this is not an empirical question. It is a philosophical preference about what kind of explanation satisfies you.
  *   If Camp 2 is unwilling to accept a naturalistic reduction of normativity, and Camp 1 is unwilling to accept primitive normativity, they will never agree. They have different criteria for what counts as an "explanation."
  *   **Verdict:** If your group is unwilling to accept **Pluralism** (that all three are correct at different levels), then no progress should be expected. You are waiting for one side to abandon their core metaphysical commitment.

  ### 4. Recommendation for the Reading Group

  You are a junior; your job is not to solve this but to map it. Here is how you break the stalemate next Sunday:

  1.  **Challenge the "Strangers" Consensus:** Ask Camp 1: "Is the snow-shoveling case *really* joint action, or just coordinated interaction?" If they say "just interaction," ask Camp 2: "Is there an obligation there?" This will force them to define the boundary of the phenomenon.
  2.  **The "Robot" Test:** Ask Camp 3: "If we build two robots with primitive we-intention modules but no normative concepts, are they acting jointly?"
      *   If Camp 3 says "Yes," Camp 2 will object (no obligation).
      *   If Camp 3 says "No," they admit normativity is essential, undermining the "category mistake" claim.
  3.  **Propose Integration:** Suggest that Bratman explains the *mechanism*, Gilbert explains the *status*, and Tomasello explains the *origin*. Ask them why these can't all be true simultaneously.

  **Summary:** Your hypothesis is correct. The debate is verbal only in the sense that "mass" means something different to a physicist, a grocer, and a metaphysician, yet they all point to the same rock. The stalemate persists because each camp insists their definition is the *real* one. Progress requires either empirical data that rules out one level of analysis or a willingness to accept that "Joint Action" is a layered concept, not a single natural kind.
