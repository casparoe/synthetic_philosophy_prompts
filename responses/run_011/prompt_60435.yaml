answer: |-
  **Section 1: The Mapping**

  The episode presents a dilemma of underdetermination: faced with a residual between prediction and observation, the investigator may augment the ontology (particular-channel repair) or revise the generalization (law-channel repair). To assess what the metaphysics of lawhood contributes to this dilemma, we must first map the components of the episode onto the competing metaphysical frameworks. The facts are stipulated as provided: Neptune validates the particular-channel; Vulcan fails it; General Relativity (GR) validates the law-channel; Pluto initially validates the particular-channel before dissolving into error.

  On the Lewisian best-system view, the "mosaic" is the total distribution of local particular matters of fact across all spacetime. The "law" is the theorem of the deductive system that best balances simplicity and strength in summarizing that mosaic. The "anomaly" is a local fact that, if taken as brute, reduces the score of the current best system. Crucially, on this view, the status of a generalization as a law is determined by the *entire* mosaic, including future events. Thus, in 1880, the status of Newton's inverse-square law was not a fixed fact waiting to be uncovered, but a function of a future distribution of matter that included the non-existence of Vulcan and the existence of the gravitational field described by Einstein. The anomaly at Mercury was a pressure point in the systematization, but whether it demanded a new particular or a new system depended on which total distribution actually obtained.

  On a necessitation or production view (e.g., Armstrong or Maudlin), laws are entities over and above the mosaic: either second-order relations between universals or primitive generators of the mosaic. The "law" is the relation $N(F, G)$ or the primitive rule itself. The "anomaly" is a manifestation that fails to accord with the necessitation relation or the generative rule. Here, the status of Newton's law in 1880 was determinate. Either the universals of mass and distance necessitated inverse-square attraction, or they did not. If they did, Vulcan was metaphysically required to exist to save the phenomenon. If they did not, the astronomers were operating under a false constraint. The anomaly indicates a mismatch between the posited necessitation and the actual productive structure of the world.

  The distinction between the two repair channels maps differently here. For the Lewisian, both channels are merely competing attempts to optimize the systematization of the mosaic. For the Necessitation theorist, the particular-channel assumes the law (the relation) is correct and the initial conditions (the ontology) are incomplete; the law-channel assumes the relation itself is misidentified. The Pluto coda complicates the mapping: a particular-channel repair was treated as successful for fifty years before the mosaic was refined (via Voyager 2) to show the particular was insufficient. On both accounts, this requires distinguishing between the *epistemic status* of the repair (confirmed by available data) and its *metaphysical status* (fitting the total mosaic or matching the real relation).

  **Section 2: The Two Diagnoses**

  The central question is what makes Neptune a licensed particular-channel repair and GR a licensed law-channel repair, while Vulcan and the exponent tweak remain unlicensed. Does the metaphysics of lawhood explain this licensing, or merely describe it retrospectively?

  For the Lewisian, the license is entirely retrospective. In 1880, there was no determinate fact about whether Newton's law was a law, because the best system depends on the whole mosaic. If Vulcan had existed, the Newtonian system augmented by Vulcan would have scored higher on simplicity and strength than a system requiring a new gravitational theory. Since Vulcan did not exist, and GR ultimately provided a better systematization of the total mosaic (including the Mercury residual), the "law-channel" repair became the licensed one. The worry here is explicit: the distinction between a licensed and unlicensed repair depends on the future distribution of matter. In 1895, no astronomer could consult the post-1915 mosaic. Thus, on the Humean account, the astronomers were not tracking a present fact about lawhood; they were gambling on the future shape of the mosaic. Is this an objection? It implies that the normative force scientists felt—the sense that Vulcan *must* be there if Newton is true—was misplaced. There was no "must" grounded in the present; there was only a heuristic bet on where the local facts would cluster. The Lewisian account subtracts from the Duhemian observation by denying that there is a fact of the matter to be underdetermined *at the time of inquiry*. It dissolves the tension by pushing the truth conditions into the future.

  For the Necessitation theorist, the license is grounded in the actual relation between universals, but this creates an epistemic opacity. If Armstrong's $N(F, G)$ obtained between mass and distance in 1880, then Newton's law was true, and Vulcan *had* to exist. If Vulcan did not exist, then Newton's law was false, and the astronomers were wrong about the necessitation relation for two and a half centuries. What precisely were they wrong about? They were wrong about the structure of production governing the solar system. What did November 1915 change? It did not change the law; it changed the epistemic access to the law. The exponent tweak (Hall/Newcomb) was unlicensed not because it was empirically inadequate initially, but because it did not match the real necessitation relation. The problem for this view is explaining the *preference* for the particular-channel. Why was Vulcan a live option and the exponent tweak a desperate measure? The metaphysics of necessitation does not inherently privilege ontology over law; both are adjustments to fit the manifestations. The Necessitation theorist must appeal to extra-metaphysical methodological principles (e.g., conservatism about laws) to explain the historical trajectory. Thus, like the Lewisian, the Necessitation theorist finds that the metaphysics of lawhood does not dictate the repair strategy; it only validates the outcome.

  The Pluto coda presses both accounts regarding the meaning of confirmation. For fifty years, Pluto was thought to be a successful particular-channel repair. On the Lewisian view, the "confirmation" was a provisional assessment of the best system relative to a *partial* mosaic. Once the mosaic was updated (Voyager 2 data), the best system changed, and Pluto's status as a law-preserving particular evaporated. On the Necessitation view, the astronomers were simply mistaken about the particulars; they posited a mass that did not possess the requisite causal powers to produce the residuals. In both cases, "the law was confirmed" is revealed as shorthand for "the system survived the available data." The metaphysics adds nothing to the explanation of why the repair failed; only the updated empirical data explains that.

  **Section 3: The Verdict on the Case as Evidence**

  Does this episode favor one account over the other, or does it reveal a limitation in the project itself? I argue for a clean negative result: the metaphysics of lawhood does no work in resolving the underdetermination of this episode. Everything of interest belongs to confirmation theory and the sociology of astronomical practice.

  The case study demonstrates that the distinction between "particular-channel" and "law-channel" repairs is methodological, not metaphysical. Scientists preferred the particular-channel for Uranus and Mercury not because they knew the metaphysical status of Newton's law, but because modifying the ontology is locally cheaper than modifying the generalization. This is a pragmatic constraint on inquiry, not a feature of lawhood. The Lewisian account captures the retrospective nature of this success but fails to account for the normative force felt during the inquiry. The Necessitation account captures the realism of the scientists' attitude (that there was a fact of the matter) but fails to explain why the particular-channel was the default heuristic. Both views accommodate the history, but neither guides the decision *in media res*.

  The Pluto coda is decisive here. It shows that a particular-channel repair can be "confirmed" in every epistemic sense while being metaphysically void (on the Necessitation view) or not part of the best system (on the Lewisian view). If metaphysics of lawhood were doing work, it should constrain what counts as a viable repair. Instead, the viability was determined entirely by mass estimates and orbital mechanics. The metaphysics is silent on why Pluto was a better candidate than a modified gravity law in 1930, and silent on why it became a worse candidate in 1989. The change was in the measurement of the mosaic, not in the concept of law.

  One might suggest a third position, such as dispositional essentialism, could handle the Mercury case differently. On this view, masses possess intrinsic powers to curve spacetime or attract. The anomaly would indicate a misidentification of the disposition itself. However, this faces the same epistemic barrier as the Necessitation view: without access to the essence of the disposition, the astronomer cannot know whether to posit a new bearer of the disposition (Vulcan) or revise the disposition's structure (GR). The metaphysics remains distinct from the heuristic.

  Ultimately, the episode suggests that the metaphysics of lawhood is a taxonomy of outcomes, not a guide for inquiry. The Duhemian observation—that hypotheses are tested in bundles—stands unmodified by metaphysical considerations. Whether laws are Humean summaries or Necessitation relations, the astronomer faces the same choice: add a planet or change the equation. The justification for that choice lies in empirical adequacy and methodological conservatism, not in the metaphysical category of the law. To claim otherwise is to manufacture a verdict where the history shows only the gradual refinement of the mosaic and the fallible mapping of particulars. The metaphysics of lawhood is silent where the seminar asks it to speak: it cannot tell us why Neptune was found and Vulcan was not, only that, given they were not found, the law had to change.
