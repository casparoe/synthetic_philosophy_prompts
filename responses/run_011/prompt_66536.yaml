answer: |-
  This is a sophisticated reconstruction of a classic objection to the Austrian position, often surfacing in debates between market socialists and libertarians. You have correctly identified that the "Walmart is a planned economy" analogy is the strongest rhetorical weapon in the socialist arsenal against Mises. However, your *reductio* fails because it conflates the *source* of price information with the *use* of price information.

  The step you must cut is **Step (3)**.

  Here is the diagnosis of why it fails, why it looked innocent, and what the fallout is for the debate.

  ### Why Step (3) is the Failure Point
  Step (3) asserts: *"So the condition (1) says is necessary simply doesn't hold within the firm's boundaries."*
  Condition (1) is the availability of a "single scale" (money price) to rank alternative uses of resources.

  Step (3) is false because firms **do** maintain a single money scale internally. They use **transfer prices** and **cost accounting**. When a division manager at Walmart requests warehouse space or engineering hours, they are not bidding in a legal market, but they are charged an internal price that reflects the opportunity cost of those resources.

  The error in (3) is assuming that because there is no *legal exchange of title* internally (Step 2), there is no *economic price* internally. But the price information is **imputed** from the external market. Walmart knows what warehouse space costs because it can observe the market rate for warehouse space outside the firm. It knows what engineers cost because it observes the labor market. It uses these external market prices to construct internal shadow prices.

  Therefore, the condition in (1) *does* hold within the firm's boundaries, derivatively. The firm is not a pocket of "blind guessing" (Step 4); it is a pocket of "calculation anchored in external data."

  ### Why It Looked Innocent
  This step looked innocent because it relies on a legalistic definition of "price" (a transaction where title changes hands) rather than an economic definition (a signal of scarcity and opportunity cost). Inside a firm, the CFO can allocate resources by fiat. It *looks* like central planning because the mechanism of allocation is authority, not contract. It is easy to slide from "allocation by authority" to "allocation without prices." But authority is merely the *mechanism* of movement; the *direction* of that movement is guided by the accounting prices derived from the outside market.

  ### The Cost of Cutting Step (3)
  Cutting (3) costs the anti-socialist side a specific rhetorical claim: **You can no longer argue that hierarchical planning is inherently irrational.**

  You must concede that "planning" (allocation by direction) is perfectly rational and calculable **provided it is embedded within a larger market economy.** The firm works *because* it is an island of planning in a sea of markets. The market provides the coordinate system (prices) that allows the planner (manager) to navigate.

  This narrows Mises' critique. It is not a critique of *planning per se*; it is a critique of *economy-wide* planning. If the state becomes the only firm, there is no "outside" market from which to impute prices. The coordinate system vanishes. Cutting (3) forces you to admit that the problem isn't the *firm structure*; it's the *lack of an external anchor*.

  ### Does Lange Win the Residue?
  Lange does not win the residue on this specific argument. Lange's model relies on the Planning Board simulating the market via trial and error (tatonnement). Your *reductio* attempted to show that firms already do this successfully, implying the State could too.

  By cutting (3), you block this inference. You admit firms calculate successfully, but you clarify they do so by **importing** prices from the real market. Lange's Planning Board, by definition, encompasses the whole economy; it has no external market to import prices from. It must generate them endogenously. Hayek's 1945 argument (which you are teaching) kicks in here: the problem isn't just the lack of a price *scale* (which Lange tries to simulate), it's the lack of the *discovery process* that generates those prices in the face of dispersed, tacit knowledge.

  So, cutting (3) saves Mises from the *reductio* without handing the debate to Lange. It preserves the distinction between a **parasitic plan** (the firm, which works) and a **total plan** (the State, which fails).

  ### What Mises Thought About Firms
  You asked why Mises wasn't troubled by firms. He wasn't troubled because he never claimed calculation was impossible *within* a firm. In *Socialism* (1922) and *Human Action*, Mises explicitly distinguishes between the "autochthonous" prices of the market and the "derived" prices of the firm. He argued that business calculation is possible for a firm precisely because it can compare its internal costs against external market prices. He was only troubled when the firm *became* the society, eliminating the external reference point. Your argument accidentally assumed Mises thought firms couldn't calculate; he thought they couldn't calculate *if they were the whole economy*.

  Verdict: 3 Admits hierarchical calculation relies on external markets.
