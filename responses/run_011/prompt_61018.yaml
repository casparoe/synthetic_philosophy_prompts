answer: |-
  # Diagnostic Instrument: The Artifact Politics Tuple

  ## I. The Space
  Do not classify yourself by author. Classify your judgments by the following four independent axes. A position is a tuple **(Causal, Political, Developmental, Locus)**.

  1.  **Causal:** Does the technical configuration make a difference to social outcomes that could not have been made by human decisions alone? *(Yes / No)*
  2.  **Political (Strict):** Can an artifact embody power or authority, rather than merely being used politically? *(Yes / No)*
  3.  **Developmental:** Is technical change internally constrained (lock-in, trajectory), limiting social choice to variants the technology licenses? *(Yes / No)*
  4.  **Locus:** Where does the politics sit? *(Designer Intention / Operational Requirements / Interpretive Work / Network of Actants / Socio-Technical Regime)*

  ## II. The Questions
  Answer based on your intuition about the case. Do not theorize; judge the specific scenario.

  **Node 1 (Case 1: Parkway):** The low bridges exclude buses. Is the exclusion caused primarily by the *concrete height* or the *designer's will*?
  A. The concrete height (Physical constraint)
  B. The designer's will (Human intention)
  C. Both equally

  **Node 2 (Case 5: Door/Speedbump):** A door-closer replaces a junior colleague; a speed-hump replaces a warden. Does the object *act* or merely *transmit* an order?
  A. It acts (The object enforces)
  B. It transmits (The owner enforces)

  **Node 3 (Case 8: Power Plant):** A centralized plant requires hierarchical management; distributed units do not. Is this hierarchy *required* by the physics or *chosen* by the managers?
  A. Required by technical operation
  B. Chosen by social organization
  C. Indistinguishable

  **Node 4 (Case 2: Tomato):** The harvester required large farms and new seeds. Was the disappearance of small holdings *inevitable* once the machine was introduced?
  A. Yes, the trajectory was locked
  B. No, policy could have saved small farms
  C. No, the machine was irrelevant

  **Node 5 (Case 3: Stirrup):** Did the stirrup *produce* the landed warrior class, or merely equip a class formed by other means?
  A. Produced the class (Tech causes social form)
  B. Equipped the class (Tech serves social form)
  C. Co-constituted (Mutual shaping)

  **Node 6 (Case 4: Algorithm):** A hiring algorithm reproduces bias without intent. Is the bias in the *data* or the *model*?
  A. In the data (Social mirror)
  B. In the model (Technical encoding)
  C. In the usage (Contextual application)

  **Node 7 (Case 6: Ranking):** An ad-optimized ranking system amplifies outrage unintentionally. Is the outrage a *bug* or a *feature* of the system's logic?
  A. Feature (System logic demands it)
  B. Bug (Implementation error)
  C. External (User behavior)

  **Node 8 (Case 7: Voting):** Officials and researchers describe the voting machine incompatibly. Is the machine's function *fixed* or *negotiated*?
  A. Fixed (It does what it does)
  B. Negotiated (It is what they say it is)
  C. Stabilized (Negotiation ends in closure)

  **Node 9 (Case 1 Revisit):** If the parkway designer had *no* exclusionary intent, would the low bridges still be political?
  A. Yes (Operational effect remains)
  B. No (Politics requires intent)
  C. Unsure

  ## III. The Leaves
  Your answers map to one of the following positions. Each includes its commitment regarding **Case 4 (Algorithm)**.

  1.  **Hard Determinism:** (Yes, Yes, Yes, Tech). *Case 4: The bias is an inevitable output of technical rationality.*
  2.  **Soft Determinism:** (Yes, Yes, No, Tech/Social). *Case 4: The bias is a leading cause that society struggles to correct.*
  3.  **Instrumentalism/Deflationary:** (No, No, No, User). *Case 4: The algorithm is a neutral tool reflecting prior social bias.*
  4.  **Intentional Politics (Winner 1):** (Yes, Yes, No, Designer). *Case 4: The bias is political only if someone intended the disparity.*
  5.  **Operational Politics (Winner 2):** (Yes, Yes, No, Requirements). *Case 4: The bias is political because the code enforces a discriminatory outcome.*
  6.  **Interpretive Flexibility (SCOT):** (No, No, No, Interpretive). *Case 4: The bias exists only insofar as relevant groups define it as such.*
  7.  **Symmetric Delegation (ANT):** (Yes, Yes, No, Network). *Case 4: The bias is an effect of the human-nonhuman network acting together.*
  8.  **Prescription/Scripts (ANT):** (Yes, Yes, No, Operation). *Case 4: The bias is scripted into the algorithm's prescribed user actions.*
  9.  **Critical Code:** (Yes, Yes, No, Design Code). *Case 4: The bias is embedded in the unexamined assumptions of the programming language.*
  10. **Dual Nature:** (Yes, No, No, Hybrid). *Case 4: The algorithm has physical properties and intentional properties, but politics belongs to the latter.*
  11. **Affordance/Disposition:** (Yes, No, No, Relation). *Case 4: The algorithm affords biased decisions but does not enforce them.*
  12. **Historical Materialist:** (Yes, Yes, Yes, Regime). *Case 4: The bias is a site of class struggle embedded in the technical regime.*
  13. **Unnamed (Operational Non-Political):** (Yes, No, No, Requirements). *Case 4: The algorithm causally shapes hiring but lacks normative political content.*
  14. **Unnamed (Interpretive Political):** (No, Yes, No, Interpretive). *Case 4: The algorithm is politically charged solely through public controversy.*

  ## IV. The Gaps
  Three cells in the cross-product space are unoccupied by the positions above.

  1.  **Causal: No / Political: Yes.** (e.g., "The artifact makes no difference, yet embodies power.")
      *   *Status:* **Incoherent.** If the artifact makes no causal difference, it cannot embody power distinct from human use.
  2.  **Developmental: Yes / Locus: Designer Intention.** (e.g., "Trajectory is locked, but determined by one designer's will.")
      *   *Status:* **Unattractive.** Lock-in implies structural constraints exceeding individual intention.
  3.  **Causal: Yes / Political: No / Locus: Socio-Technical Regime.** (e.g., "The regime shapes outcomes, but without power relations.")
      *   *Status:* **Unexplored.** Most regime theories (like Transition Theory) assume power dynamics; a purely functionalist regime theory is rare.

  ## V. The Failures
  Two pairs of leaves this instrument cannot reliably distinguish.

  1.  **Symmetric Delegation vs. Prescription (ANT).**
      *   *Trouble:* Both locate agency in the network/operation. Students answering "Network" often mean "Script."
      *   *Resolution:* Verbal distinction only. Requires a question about *who* writes the script vs. *how* the network holds together.
  2.  **Affordance vs. Soft Determinism.**
      *   *Trouble:* Both suggest technology "nudges" without forcing. Node 2 (Door/Speedbump) often collapses them.
      *   *Resolution:* Requires a case where the affordance is ignored without penalty (Affordance) vs. a case where ignoring it causes systemic failure (Soft Determinism).

  ## VI. Scoring Key
  *   **Hard/Soft Determinism:** Node 4 (A) + Node 5 (A/B).
  *   **Instrumentalism:** Node 2 (B) + Node 3 (B) + Node 6 (A).
  *   **Winner (Intentional):** Node 1 (B) + Node 9 (B).
  *   **Winner (Operational):** Node 1 (A) + Node 9 (A).
  *   **SCOT:** Node 8 (B).
  *   **ANT:** Node 2 (A) + Node 7 (A).
  *   **Materialist:** Node 4 (A) + Node 3 (A).

  **Primary Sorting Question:** **Node 3 (Power Plant).**
  This question does the most work separating Instrumentalists (who see hierarchy as a management choice) from Technological Politicists (who see hierarchy as a technical requirement). It forces a decision on whether physical constraints translate directly into social forms.
