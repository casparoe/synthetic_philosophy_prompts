answer: |-
  **Brainstorm: Three Causal Structures for Reversal**

  Before adjudicating the dispute, we must list the mechanical ways an aggregate trend can reverse when disaggregated. First, the **Confounder Scenario**: The tag exists before the experiment, influences both assignment (due to randomization failure) and purchase. Here, disaggregation corrects bias. Second, the **Mediator Scenario**: The treatment causes the tag, which causes the purchase. Here, disaggregation blocks the treatment's primary mechanism, hiding its true value. Third, the **Collider Scenario**: The treatment and some unmeasured factor both cause the tag, and the tag causes purchase. Conditioning on the tag opens a spurious path, creating bias where none existed. The decision hinges entirely on which structure matches reality, not on the numbers alone.

  ***

  **The Illusion of the Table: Settling the Simpson's Paradox Dispute**

  You are standing at a classic intersection of data science and causal reasoning. On one side, your data scientist (DS) invokes Simpson's Paradox to argue that the aggregate win is a statistical illusion. On the other, your product manager (PM) argues that the bottom line is the only metric that matters. Both are partially right about the math, but only one is right about the causality. To resolve this, we must move beyond the probabilities in your tables and examine the timeline of events that generated them.

  The unsettling truth at the foundation of probability is that a table of conditional probabilities—like the ones you provided—cannot determine causality. $P(\text{Purchase} | \text{New Flow})$ and $P(\text{Purchase} | \text{New Flow, Tag})$ are merely descriptions of associations. They do not tell us whether the flow *caused* the tag, whether the tag *caused* the flow, or whether a third factor caused both. Without external knowledge about the mechanism, the data is mute on the question of intervention. You cannot derive an "ought" (ship or don't ship) from an "is" (the tables) without a causal bridge.

  In your specific case, that bridge is the timeline. You noted that the new flow sends a push notification on day two, which drives browsing, and the "high-intent" tag is applied based on browsing during that first week. This establishes a clear causal chain: **Treatment $\rightarrow$ Push $\rightarrow$ Browsing $\rightarrow$ Tag $\rightarrow$ Purchase**. In causal inference terminology, the tag is a **mediator**. It is a mechanism through which the treatment exerts its effect.

  This distinction destroys the data scientist's argument. The DS's heuristic—"always trust the disaggregated table"—is a rule of thumb designed for confounders. If the tag were a pre-existing characteristic (like age or location) that was imbalanced between groups due to chance, conditioning on it would isolate the treatment effect within comparable subgroups. However, because the treatment *creates* the tag (shifting users from "Not Tagged" to "Tagged" via the push notification), conditioning on the tag effectively "controls away" the benefit of the treatment.

  Look closely at the numbers. The control group has only 10% high-intent users, while the new flow has 40%. The new flow successfully converts casual browsers into high-intent browsers. Within the high-intent group, the conversion rate is slightly lower for the new flow (85% vs. 90%), perhaps because the push notification annoys some users or attracts slightly less qualified leads into the tag. However, the sheer volume of users pushed into the high-converting "high-intent" bucket outweighs the slight drop in conversion efficiency within that bucket. The aggregate number (44.8% vs. 27%) captures this total benefit: the direct effect plus the indirect effect of generating high-intent users. The disaggregated number hides the indirect effect by holding the mediator constant. If you ship based on the disaggregated table, you are deciding to forgo the mechanism that makes the product successful.

  The product manager is therefore correct that the aggregate answers the business question: "Does shipping this flow increase total purchases?" However, the PM's reasoning ("it's the only number") is philosophically weak. There are scenarios where the aggregate is misleading, specifically if the tag were a collider or if the mechanism was unethical. But in this standard mediation case, the aggregate represents the Total Causal Effect, which is the relevant quantity for decision-making.

  To commit to a verdict: **You should ship based on the aggregate numbers.** The new flow increases purchases primarily by engineering user intent through engagement. Blocking that pathway by conditioning on the tag is an error of causal specification.

  However, a qualified verdict is necessary because the tables alone did not prove this. For the opposite verdict to hold (i.e., do not ship, trust the disaggregated table), the **tag would have to be a pre-treatment variable**. If the "high-intent" tag were assigned based on user history *before* the experiment began, and the treatment somehow could not change tag status, then the imbalance (10% vs. 40%) would indicate a catastrophic failure of randomization. In that hypothetical world, the aggregate would be biased because the new flow group would be inherently richer or more engaged before the experiment started. Conditioning would then be necessary to compare apples to apples. But given your description, the treatment changes the tag rate, ruling out this possibility.

  Another scenario where the DS would be right is if the tag were a **collider**. This would happen if the treatment caused the tag, and some unmeasured factor (like "impatience") also caused the tag, and "impatience" negatively affected purchases. Conditioning on the tag would then induce a correlation between treatment and impatience, biasing the result. However, "high-intent" based on browsing is conceptually a mediator of purchase, not a collider of purchase and some hidden trait.

  To verify this causal structure empirically using your existing logs, you must perform a **timestamp diagnostic**. You need to query the logs to confirm that the majority of users who received the "high-intent" tag in the new flow group exhibited the browsing behavior *after* receiving the day-two push notification. If the logs show that the tag was assigned based on activity prior to the push, or if the push did not correlate with the browsing spike, then the mediator assumption fails. Specifically, calculate the time delta between `push_open_timestamp` and `tag_assignment_timestamp` for the new flow group. If `tag_assignment` consistently follows `push_open`, the mediator model is confirmed, and the aggregate result is valid.

  In conclusion, Simpson's Paradox is not a paradox of math, but a paradox of interpretation. It arises when we confuse seeing with doing. The disaggregated table tells you what happens when you *see* a user is high-intent. The aggregate table tells you what happens when you *make* a user undergo the new flow. Since you are deciding whether to *do* the new flow, the aggregate is the only number that reflects the intervention. The data scientist is applying a confounder-adjustment strategy to a mediator. Ship the feature, but instrument your logs to ensure the engagement driven by the push is sustainable and not merely short-term noise that might churn users after week one.

