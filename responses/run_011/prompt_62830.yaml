      *   **Simpson's Paradox Context:**
          *   Aggregate says New is better.
          *   Conditional says Control is better.
          *   This is a classic case of conditioning on a mediator (or a collider, but here likely a mediator).
          *   If $M$ is a **mediator** ($A \rightarrow M \rightarrow Y$), conditioning on $M$ blocks the path through which $A$ improves $Y$. The aggregate effect captures the total causal effect (including the benefit of driving high intent). The conditional effect captures the direct effect (excluding the mechanism of driving intent).
          *   If $M$ is a **confounder** ($M \rightarrow A$ and $M \rightarrow Y$), conditioning is necessary. But $A$ is randomized, so there are no pre-treatment confounders. $M$ is measured *during* the week, influenced by the push notification. So $M$ cannot be a pre-treatment confounder.
          *   If $M$ is a **collider** ($A \rightarrow M \leftarrow U \rightarrow Y$), conditioning opens a spurious path.
      *   **The Crux:** The tag is defined by browsing activity *during* the week. The new flow *drives* browsing via push. Therefore, the new flow *creates* high-intent tags. The DS wants to condition on the tag. The PM wants to look at the aggregate.
      *   **Decision:** Since the goal is to maximize purchases, and the new flow increases purchases partly by *making* users high-intent (via browsing), we should not block that pathway. Conditioning on the tag hides the benefit of the treatment that operates through increasing the tag rate. The aggregate number represents the Total Causal Effect. The disaggregated number represents the Direct Effect (controlling for the mechanism). Unless the mechanism is unethical or unsustainable, the Total Effect is what matters for business value.
      *   **Verdict:** Ship based on aggregate. The tag is a mediator.
