      *   Since $A$ is randomized, $A$ is independent of pre-treatment variables. $M$ is post-treatment.
      *   Conditioning on a post-treatment variable that is affected by treatment is generally biased for estimating the total effect.
      *   DS Argument: "Always trust the disaggregated table." This is a heuristic that fails when the stratification variable is a mediator.
      *   PM Argument: "Aggregate is the only number that answers the question we actually asked." The question is "Does this flow increase purchases?" Yes, it does.
