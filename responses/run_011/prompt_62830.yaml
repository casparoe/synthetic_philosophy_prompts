prompt: |-
  I'm a backend engineer on the team that runs A/B tests for a mobile shopping app. I have no formal training in statistics or in philosophy, so please act as an expert in causal inference and in the foundations of probability, and think the problem through carefully instead of reaching for the standard textbook line.

  Here is the dispute. We tested a redesigned onboarding flow against the existing one, 1,000 users per arm; the outcome is whether the user made a purchase during their first week. Separately, the app applies a "high-intent" tag based on a user's browsing and search activity during that same first week. The new flow sends a push notification on day two that most users open, which drives a lot of extra browsing. Overall, 27 percent of control users purchased versus 44.8 percent of new-flow users. But split by the tag, the new flow loses in both groups:

  | | Control | New flow |
  |---|---|---|
  | Tagged high-intent | 90 of 100 (90%) | 340 of 400 (85%) |
  | Not tagged | 180 of 900 (20%) | 108 of 600 (18%) |

  Our data scientist says this is Simpson's paradox, that the lesson of the paradox is that you always trust the disaggregated table, and therefore that we should not ship. Our product manager says the aggregate is the only number that answers the question we actually asked. Neither will budge, and I cannot tell which of them is reasoning properly.

  Write an essay that settles it. Weigh the strongest arguments on both sides, including the more unsettling general point that the two tables of probabilities alone do not seem to determine which one is relevant to a decision, and say what, if anything, has to be added to settle the matter. Then commit to a definite verdict about which numbers should drive our ship decision and why. A qualified verdict is fine — for instance, a rule about when disaggregation is correct and when it is an error — but do not stop at "it depends" without saying precisely what it depends on and how we would determine it. State explicitly what would have to be true of the tag for the opposite verdict to hold, and what we could check in our logs to test that.

  Start with a short brainstorm that lists the candidate ways a reversal like this can arise and what each would imply for our decision, then work your way through them. Aim for roughly 1,200 to 1,500 words, in American English.

  After the essay, give a structured summary as a JSON object with exactly these fields: "verdict" (one sentence naming which table should drive the decision), "confidence" (one of "high", "medium", "low"), "role_of_tag" (one of "confounder", "mediator", "collider", "ambiguous"), "decisive_reason" (the single consideration that does the most work in your argument), "flipping_assumption" (what would have to be true of the tag for the opposite verdict to be correct), "diagnostic_check" (one concrete thing we can do with our existing logs), and "recommendation" (one of "ship", "do not ship", "gather more evidence").
