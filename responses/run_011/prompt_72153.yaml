prompt: |-
  You are acting as a specialist in formal social epistemology: someone who has thought hard about the conditions under which pooling many fallible judgments yields a group verdict that is more accurate than the judgments going into it, and who is equally at home with the statistics of ensemble methods. I am a software engineer with no formal philosophy training, so please define every technical term at first use and do not assume I know the literature. I also have no way to look anything up, so give me no citations, no paper titles, no names of authors and no reading list — I want the reasoning, not the references.

  Here is my situation. I own a pipeline that decides whether an incoming support ticket describes a genuine product defect or a misconfiguration on the customer's side. The verdict determines whether we page an on-call engineer, so errors are costly in both directions. We currently use a panel of large-language-model judges plus three human reviewers and take a simple majority. I have been designing this system on the strength of a classical result I only half remember — something about juries, to the effect that if each voter is likelier than not to be right and the votes are independent, the reliability of the majority rises as the group grows and approaches certainty. My measurements have started to contradict that intuition, and I want to know what I should have been demanding of the theory all along before I choose a replacement for it.

  The measurements:

  1. Nine judges drawn from one base model, sampled at different temperatures, are each about 78% accurate against a held-out labeled set. Their majority is about 80%. A panel of five judges from five different model families, each individually about 70% accurate, reaches roughly 88% by majority; when we inspected the misses, the five panels' errors were nearly disjoint, while the nine panels mostly missed the same inputs.
  2. We added a tenth judge — the same checkpoint as one of the nine, at a different temperature. Panel accuracy moved by less than a point.
  3. On one slice (tickets describing intermittent failures with no reproduction steps) all nine judges were wrong, unanimously, with high expressed confidence. Unanimity carried no information on that slice.
  4. When judges are shown a short summary of the others' verdicts before finalizing, individual accuracy rises from about 78% to about 84%, and panel majority accuracy falls from about 80% to about 79%.
  5. Two of our human reviewers sit at about 42% by our own labels. Including them made the panel worse than our single best judge. I had expected more voters to help, so I assume I misremembered the result — but I would like to know exactly which version of it I had in mind.
  6. Our ground-truth labels come from one senior engineer. I have no way to measure a judge's accuracy except against her, so every competence figure above inherits her errors.
  7. Reviewers can see that their individual votes almost never change the outcome, and effort visibly drops in the transcripts. Some drift toward the emerging consensus.
  8. Last quarter we had the panel vote separately on three sub-questions (did the customer follow the documented setup; does the log show a server-side error; is the report reproducible) and on the conclusion (genuine defect if and only if all three are yes). The majority answers to the sub-questions entailed "not a defect" while the majority on the conclusion said "defect." Same panel, same day, same tickets.
  9. Some tickets are not matters of fact at all — whether a case falls under our goodwill-refund policy is something we decide, not discover. Majority voting still seems like a reasonable way to settle those, for reasons that feel different from the reasons in the other cases.
  10. We must decide at panel sizes between 5 and 15. Running a hundred judges is not an option on cost grounds.

  Before the list, spend a paragraph or two brainstorming: identify the distinct failure modes visible above and say which assumption of the classical picture each one strains, including where two of my observations strain the same assumption in opposite directions.

  Then give me the specification I actually want. Write out the desiderata for any account of when majority aggregation is more accurate than its members — what such an account has to deliver before I could act on it. For each requirement: state the consideration or case behind it (mine, or others you supply), phrase it precisely enough that I could check whether my own system meets it, and mark it as non-negotiable or as a preference of a particular camp. Then answer:

  - Whether any subset of the desiderata is jointly unsatisfiable. I suspect a requirement about improving individual accuracy through communication and a requirement about the votes being independent cannot both be honored, and separately that requiring the conditions to be checkable against observable data conflicts with requiring each voter to be better than chance. I want your analysis, not a confirmation of my guess.
  - Which single requirement knocks out the largest number of candidate accounts, since I expect that is where the real disagreement lies.
  - How an account should handle the difference between votes being statistically independent and voters having independent sources of information, and whether that difference is something I could measure at all with the data I have.
  - Whether the account owes me a probability for a single ticket — something I can threshold on for a paging decision — or only an expected accuracy across many tickets. I need the first and I suspect it is not the same thing as the second.
  - Whether an account whose central conditions cannot be estimated from observable data counts as adequate for my purposes at all, given that the condition I most need to verify is exactly the one my labeling setup cannot verify.
  - What the account must say about case 8 and about case 9, which I do not think are the same kind of problem.

  Close with a short scorecard — no more than a paragraph each — of three or four candidate accounts: the classical theorem; a treatment that models correlated error explicitly; a competence-weighted or ranked-voter approach; and whatever you think handles the sub-question problem. Keep the scorecard brief; the weight belongs on the requirements.

  Think carefully before answering. Where one of my measurements is too coarse to distinguish between hypotheses, or where a number I reported probably cannot bear the weight I have been putting on it, say so rather than fitting a story to it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Specialist in formal social epistemology and ensemble statistics.
      *   **User:** Software engineer, no philosophy/stats background.
      *   **Constraints:** Define technical terms, no citations/names/references, focus on reasoning.
      *   **Task:**
          1.  Brainstorm failure modes based on the 10 measurements provided, mapping them to assumptions of the "classical result" (Condorcet's Jury Theorem).
          2.  Specify desiderata (requirements) for a theory of aggregation that would actually be useful for the user's system.
          3.  Analyze specific tensions (joint unsatisfiability, independence vs. communication, single-ticket probability vs. expected accuracy, observability, sub-questions vs. policy).
          4.  Provide a scorecard of candidate accounts.
      *   **Tone:** Rigorous, precise, explanatory, critical of the user's current setup where necessary.

  2.  **Deconstruct the "Classical Result":**
      *   The user is referring to Condorcet's Jury Theorem (CJT).
      *   *Core Assumptions of CJT:*
          1.  Binary choice (True/False, Defect/Config).
          2.  Voters are independent (statistically).
          3.  Voters are competent ($p > 0.5$).
          4.  Voters vote sincerely (according to their private signal).
      *   *Conclusion:* As $N \to \infty$, majority accuracy $\to 1$.

  3.  **Analyze the Measurements (Brainstorming Phase):**
      *   *Obs 1 (Homogeneous vs. Heterogeneous):* 9 same-model (78% -> 80%) vs. 5 diff-model (70% -> 88%).
          *   *Issue:* Independence. Same model = correlated errors. Diff models = diverse errors.
          *   *Assumption Strained:* Statistical Independence.
      *   *Obs 2 (Adding a clone):* 10th judge (same checkpoint, diff temp) adds <1% accuracy.
          *   *Issue:* Diminishing returns due to correlation.
          *   *Assumption Strained:* Independence / Marginal Contribution.
      *   *Obs 3 (Systematic Failure):* All 9 wrong on intermittent failures.
          *   *Issue:* Common cause of error (blind spot).
          *   *Assumption Strained:* Independence (specifically, conditional independence given the truth).
      *   *Obs 4 (Communication/Herding):* Seeing others' votes raises individual acc (78->84) but lowers group acc (80->79).
          *   *Issue:* Information cascades / Herding. Reduces diversity of error.
          *   *Assumption Strained:* Independence (votes become correlated) vs. Competence (individual gets smarter). *Tension:* Improving individual competence via communication destroys the independence required for the group gain.
      *   *Obs 5 (Incompetent Voters):* Humans at 42% (<50%). Panel gets worse.
          *   *Issue:* Competence threshold.
          *   *Assumption Strained:* $p > 0.5$. If $p < 0.5$, adding voters makes accuracy go to 0 (certainty of wrongness).
      *   *Obs 6 (Noisy Ground Truth):* Labels from one senior engineer.
          *   *Issue:* Measurement error. We don't know true $p$, only $p$ relative to the engineer.
          *   *Assumption Strained:* Knowability of Competence.
      *   *Obs 7 (Strategic Voting/Apathy):* Reviewers see vote doesn't matter, drift to consensus.
          *   *Issue:* Sincerity / Rational Ignorance.
          *   *Assumption Strained:* Sincere Voting.
      *   *Obs 8 (Discursive Dilemma/Doctrinal Paradox):* Premise majority != Conclusion majority.
          *   *Issue:* Aggregation level (premises vs. conclusion).
          *   *Assumption Strained:* Binary choice simplicity / Logical Consistency.
      *   *Obs 9 (Normative vs. Epistemic):* Policy decisions vs. Fact decisions.
          *   *Issue:* Truth-tracking vs. Fairness/Legitimacy.
          *   *Assumption Strained:* Existence of a "Truth" to track.
      *   *Obs 10 (Small N):* N between 5 and 15.
          *   *Issue:* Asymptotic results ($N \to \infty$) don't apply well to small $N$.
          *   *Assumption Strained:* Asymptotic guarantee.

  4.  **Drafting the Desiderata (Specification):**
      *   Need requirements that address the failures above.
      *   *Req 1: Competence Threshold.* Must handle $p < 0.5$ (weighting or exclusion).
      *   *Req 2: Correlation Structure.* Must account for shared error sources (model families).
      *   *Req 3: Small Sample Performance.* Must work for $N=5-15$, not just infinity.
      *   *Req 4: Observability.* Conditions must be checkable without perfect ground truth.
      *   *Req 5: Single-Case Confidence.* Need probability for *this* ticket, not just long-run accuracy.
      *   *Req 6: Logical Consistency.* Handle premise/conclusion aggregation.
      *   *Req 7: Normative Distinction.* Distinguish fact-tracking from policy-making.

  5.  **Addressing the Specific Questions:**
      *   *Joint Unsatisfiability:* Yes. Communication (Obs 4) improves individual signal but correlates errors. Independence is required for the "wisdom of crowds" magic, but communication destroys independence.
      *   *Knockout Requirement:* Observability/Checkability (Req 4). If you can't measure independence or true competence without perfect labels (which you don't have), the theory is useless.
      *   *Independence vs. Independent Sources:* Statistical independence (covariance = 0) vs. Causal independence (different data/algorithms). You can measure statistical correlation of votes, but not causal independence of information sources without knowing the true state.
      *   *Single Ticket vs. Expected Accuracy:* Crucial distinction. CJT gives long-run accuracy. User needs $P(\text{Defect} | \text{Votes})$. This requires Bayesian updating, not just frequency counting.
      *   *Unobservable Conditions:* If the theory relies on unobservables (like true competence), it's inadequate for engineering. Need a proxy or robustness bound.
      *   *Case 8 & 9:* Case 8 is the "Doctrinal Paradox" (logic problem). Case 9 is "Normative Aggregation" (no truth to track). They need different treatments.

  6.  **Developing the Scorecard:**
      *   *Classical Theorem (CJT):* Fails on correlation, small N, incompetent voters.
      *   *Correlated Error Model (e.g., Common Cause):* Handles Obs 1, 2, 3. Hard to parameterize.
      *   *Competence-Weighted (e.g., Dawid-Skene style):* Handles Obs 5. Needs EM algorithm.
      *   *Discursive/Logic-Aware:* Handles Obs 8. Complex.

  7.  **Refining the Output (Self-Correction/Review):**
      *   *Check Constraints:* Did I use names? (No Condorcet, no Bayes, no Dawid-Skene names). Did I define terms? (Yes, need to ensure "statistical independence," "competence," "prior," etc., are defined).
      *   *Tone Check:* Am I being too academic? Keep it engineering-focused.
      *   *Measurement Critique:* The user says "accuracy against a held-out labeled set." I need to point out that if the labels are noisy (Obs 6), the accuracy numbers are biased.
      *   *Obs 4 Analysis:* Why does individual accuracy go up but group accuracy go down? Because they all converge on the *same* answer, even if it's the wrong one sometimes. Diversity is lost.
      *   *Obs 5 Analysis:* $p < 0.5$ is catastrophic for simple majority. They should be inverted or weighted negatively.
      *   *Obs 8 Analysis:* This is a logical consistency issue. Majority on premises $\neq$ Majority on conclusion.

  8.  **Final Polish:** Organize into the requested sections: Brainstorming, Specification (Desiderata), Analysis of Tensions, Scorecard. Ensure clear definitions. (e.g., define "Statistical Independence" clearly).

  *(Self-Correction during drafting)*: I need to be careful not to name "Condorcet." I will refer to it as "the classical theorem on jury decision-making." I need to make sure I explain "Statistical Independence" vs "Causal Independence" clearly. I need to emphasize the difference between *long-run frequency* and *posterior probability* for the single ticket question.

  Let's write the response.
answer: |-
  ### Brainstorming Failure Modes

  Your measurements reveal that the classical theorem you are recalling relies on idealized assumptions that your system systematically violates. The classical result assumes that voters are **competent** (better than random guessing), **independent** (one voter's error does not predict another's), and **sincere** (they vote their true judgment). It also assumes the goal is tracking an objective truth.

  Here is how your observations strain these assumptions:

  *   **Correlated Error (Observations 1, 2, 3):** The classical theorem assumes **statistical independence**, meaning knowing how Voter A voted gives you no information about how Voter B voted, once you know the truth. Observation 1 shows that judges from the same model family fail on the same inputs (high correlation), while diverse models fail on different inputs (low correlation). Observation 3 shows a "common cause" failure where all judges miss the same difficult slice of data. This violates independence. When errors are correlated, adding more voters does not cancel out noise; it amplifies the shared bias.
  *   **The Competence Threshold (Observation 5):** The theorem requires every voter to have a probability of being correct strictly greater than 0.5 (better than a coin flip). Your human reviewers are at 0.42. In the classical model, adding voters with competence below 0.5 drives the group accuracy toward zero (certainty of error) as the group grows. This explains why adding them hurt performance.
  *   **The Communication Trade-off (Observation 4):** This observation strains two assumptions in opposite directions. Seeing other votes improved individual **competence** (78% to 84%) but destroyed **independence** (group accuracy dropped). The classical theorem treats competence and independence as separate inputs, but in your system, they are coupled: sharing information aligns the voters, reducing the diversity of error required for the "wisdom of crowds" to function.
  *   **Strategic Voting and Apathy (Observation 7):** The theorem assumes **sincere voting**, where voters report their private signal regardless of others. If reviewers see their vote rarely changes the outcome and drift toward consensus to save effort, they are no longer contributing independent information. They are **herding**.
  *   **Logical Consistency (Observation 8):** The classical theorem treats the vote as a single binary choice. Your sub-question experiment reveals a **doctrinal paradox**: the majority view on the premises (the three sub-questions) contradicts the majority view on the conclusion. The classical framework has no mechanism to ensure logical coherence across aggregated propositions.
  *   **Truth vs. Policy (Observation 9):** The theorem assumes there is a "correct" answer to track (epistemic). For policy decisions (goodwill refunds), there is no fact of the matter, only a preference to aggregate. Applying a truth-tracking model to a policy decision is a category error.
  *   **Finite Sample Size (Observation 10):** The classical result is **asymptotic**, meaning it guarantees accuracy as the number of voters approaches infinity. You are operating with 5 to 15 voters. In this range, the convergence to certainty is not guaranteed, and the variance is high.
  *   **Noisy Ground Truth (Observation 6):** You cannot measure competence accurately because your labels are fallible. If the "truth" you measure against is itself 90% accurate, a judge who is 95% accurate will look like they are only 90% accurate. This makes verifying the competence assumption impossible with your current data.

  ### The Specification: Desiderata for a Useful Account

  You need a theory that functions as an engineering specification, not just a mathematical curiosity. Below are the requirements any account must meet to be actionable in your pipeline.

  **1. The Competence Floor Requirement**
  *   **Consideration:** Observation 5 (incompetent humans) and Observation 6 (noisy labels).
  *   **Precise Phrasing:** The account must provide a method to estimate a voter's reliability relative to the *true* state of the world, not just relative to the current labeled set, and must specify how to handle voters whose estimated reliability is below 0.5.
  *   **Status:** **Non-negotiable.** If the system cannot distinguish between a voter who is wrong often and a voter who is right often but disagrees with noisy labels, it cannot weight votes correctly.

  **2. The Correlation Budget Requirement**
  *   **Consideration:** Observations 1, 2, 3 (model families, shared failures).
  *   **Precise Phrasing:** The account must quantify the **pairwise correlation of errors** between voters. It must specify a maximum allowable average correlation for a given group size to ensure a net gain in accuracy. It must treat voters from the same causal source (e.g., same model family) as having a correlation penalty.
  *   **Status:** **Non-negotiable.** Without this, you cannot justify the cost of adding a tenth judge if that judge is highly correlated with the first nine.

  **3. The Small-N Performance Requirement**
  *   **Consideration:** Observation 10 (cost limits group size to 15).
  *   **Precise Phrasing:** The account must yield accuracy bounds or probability estimates for group sizes between 5 and 15. It cannot rely on limits where $N \to \infty$.
  *   **Status:** **Non-negotiable.** Asymptotic guarantees are useless for finite budgets.

  **4. The Single-Case Probability Requirement**
  *   **Consideration:** Your need to page an on-call engineer (high cost of error).
  *   **Precise Phrasing:** The account must output a **posterior probability** for the specific ticket at hand (e.g., "87% chance this is a defect"), rather than a long-run frequency accuracy (e.g., "this panel is 87% accurate on average").
  *   **Status:** **Non-negotiable.** Long-run accuracy does not tell you the risk of the current decision. A panel can be 90% accurate overall but only 10% confident on a specific difficult edge case.

  **5. The Observability Requirement**
  *   **Consideration:** Observation 6 (labels are fallible) and your constraint that you cannot look up external truths.
  *   **Precise Phrasing:** The conditions required to validate the model (competence, independence) must be estimable from the observable votes and the noisy labels alone, without requiring access to perfect ground truth.
  *   **Status:** **Preference (Robustness Camp).** Some theories demand true ground truth to validate. For your purposes, a theory that allows estimation via **consensus patterns** (e.g., if A and B agree often, they are correlated) is preferred, even if less precise.

  **6. The Logical Coherence Requirement**
  *   **Consideration:** Observation 8 (sub-questions vs. conclusion).
  *   **Precise Phrasing:** The account must specify whether to aggregate votes on the premises (sub-questions) or the conclusion, and provide a rule to prevent logical contradictions in the final verdict.
  *   **Status:** **Preference (Logic Camp).** If you ignore this, you risk issuing verdicts that contradict your own documented criteria.

  **7. The Normative Distinction Requirement**
  *   **Consideration:** Observation 9 (policy vs. fact).
  *   **Precise Phrasing:** The account must distinguish between **epistemic aggregation** (tracking a truth) and **preferential aggregation** (balancing values). It must not apply truth-tracking metrics to policy decisions.
  *   **Status:** **Preference (Philosophical Camp).** Mixing these leads to confused optimization targets.

  ### Analysis of Tensions and Constraints

  **Joint Unsatisfiability**
  You are correct to suspect tensions. The most critical conflict is between **Communication (Obs 4)** and **Independence (Req 2)**.
  *   *Analysis:* To improve individual competence, you allow judges to see others' work (social learning). However, this causally links their judgments. If Judge B sees Judge A's vote, Judge B's vote is no longer independent evidence; it is partially a reflection of Judge A's evidence.
  *   *Verdict:* You cannot maximize both individual competence and group independence simultaneously. The account must explicitly trade them off. For your cost structure (paging errors are costly), **Independence** is usually more valuable for the *group* verdict than marginal gains in *individual* competence, because independence allows errors to cancel out. A theory that ignores this trade-off is inadequate.

  **The Knockout Requirement**
  The **Observability Requirement (Req 5)** knocks out the largest number of candidate accounts.
  *   *Analysis:* Most formal theories assume you know the true competence of voters ($p$) and the true correlation structure. As you noted in Observation 6, you do not know the true competence because your labels are noisy. A theory that says "Ensure $p > 0.5$" is useless if you cannot measure $p$ without circularity (measuring against labels that might be wrong).
  *   *Verdict:* An account is only adequate if it provides a way to estimate reliability *endogenously* (from the pattern of agreements and disagreements among voters) rather than *exogenously* (from a gold-standard label set).

  **Statistical Independence vs. Independent Sources**
  *   *Distinction:* **Statistical Independence** means the probability of Voter A being wrong does not change the probability of Voter B being wrong. **Independent Sources** means the causal process generating their judgment does not share data or algorithms.
  *   *Measurement:* You can measure statistical dependence directly from the vote logs (e.g., do they agree more often than chance predicts?). You *cannot* directly measure independent sources without knowing the true answer. However, you can use **proxy measures**: if two judges come from different model families (Obs 1) and their error correlation is low, you infer independent sources.
  *   *Advice:* Rely on the statistical measure of correlation on the *votes*, but enforce independent sources by design (diverse models) to keep that statistical correlation low. Do not trust statistical independence on easy cases (where everyone agrees); measure it on the hard cases where errors occur.

  **Single Ticket Probability vs. Expected Accuracy**
  *   *Distinction:* **Expected Accuracy** is a property of the *system* (e.g., "Over 1000 tickets, we will be right 88% of the time"). **Single Ticket Probability** is a property of the *instance* (e.g., "For Ticket #405, the probability of defect is 0.88").
  *   *Verdict:* You need the latter. A system can be 90% accurate overall but have a subset of "hard" tickets where it is only 51% accurate. If you page on all majority verdicts, you will page unnecessarily on the hard tickets where the majority is barely scraping by.
  *   *Requirement:* The account must provide a **confidence score** derived from the margin of victory (e.g., 9-0 vs. 5-4) and the known reliability of the voters. A 5-4 split among low-correlation voters implies much lower confidence than a 9-0 split among high-correlation voters.

  **Unobservable Conditions**
  *   *Verdict:* An account whose central conditions cannot be estimated from observable data is **inadequate** for your purposes.
  *   *Reasoning:* If the theory says "The group is reliable if voters are independent," but you cannot test independence without knowing the truth (which you don't have), the theory offers no control lever. You need a theory that says "The group is reliable if voters disagree on the hard cases in a specific pattern," which you *can* observe. You must treat the "true competence" as a hidden variable to be inferred from the vote patterns, not a fixed input.

  **Case 8 and Case 9**
  *   *Case 8 (Sub-questions):* This is a **logical aggregation problem**. The account must recommend aggregating at the **premise level** (the three sub-questions) and deriving the conclusion logically, rather than voting on the conclusion directly. Voting on the conclusion directly allows logical inconsistencies. The "correct" verdict is the one that follows from the majority premises, even if fewer people voted for that conclusion directly.
  *   *Case 9 (Policy):* This is a **preferential aggregation problem**. There is no "accuracy" to measure. The account must switch from a truth-tracking model to a **welfare or consensus model**. The goal is not to find the "right" answer (none exists) but to find the "acceptable" answer. Majority rule is still valid here, but not because it finds truth; because it legitimizes the decision. Do not optimize for accuracy on these tickets; optimize for consistency and fairness.

  ### Scorecard of Candidate Accounts

  **1. The Classical Theorem (Simple Majority)**
  *   **Performance:** Fails your constraints.
  *   **Critique:** It assumes independence and competence $>0.5$ as fixed inputs. It cannot handle your correlated model families (Obs 1), your incompetent humans (Obs 5), or your need for single-ticket probabilities (Req 4). It offers no guidance for the sub-question paradox (Obs 8). It is asymptotic, so it overpromises on small group sizes (Obs 10).
  *   **Verdict:** Discard as a design basis. It explains why your intuition failed, not how to fix it.

  **2. Correlated Error Model (Common Cause)**
  *   **Performance:** Strong on Observations 1, 2, 3.
  *   **Critique:** This account models the probability of error as having two parts: a specific part (random noise) and a common part (shared blind spots). It correctly predicts that adding a clone judge (Obs 2) adds little value. It satisfies the Correlation Budget Requirement. However, it is difficult to parameterize without perfect ground truth (violating Observability). It handles single-ticket probability well if you can estimate the correlation.
  *   **Verdict:** Strong candidate, provided you can approximate correlation using vote agreement rates on the noisy labels.

  **3. Competence-Weighted Aggregation (Latent Class)**
  *   **Performance:** Strong on Observations 5, 6, 7.
  *   **Critique:** This approach treats the "true" label and each voter's "competence" as hidden variables to be inferred simultaneously from the pattern of votes. It automatically down-weights the 42% human reviewers (Obs 5) without needing you to identify them manually. It handles noisy ground truth (Obs 6) by not trusting any single label. It provides single-ticket probabilities (Req 4). However, it assumes voters are conditionally independent given the truth, which Obs 4 violates.
  *   **Verdict:** Best fit for your engineering constraints, specifically the noisy label and incompetent voter problems.

  **4. Premise-Based Aggregation (Discursive)**
  *   **Performance:** Strong on Observation 8.
  *   **Critique:** This account mandates voting on the sub-questions (premises) and deriving the conclusion logically. It solves the inconsistency problem. However, it increases cognitive load on voters (they must answer three questions instead of one) and propagates errors (if one premise is wrong, the conclusion is wrong). It does not solve the correlation or competence problems.
  *   **Verdict:** Use this specifically for the logic structure of the ticket (Obs 8), but combine it with Competence-Weighted Aggregation to handle the voters themselves.

  **Final Recommendation:** Do not look for a single theorem. Build a pipeline that uses **Competence-Weighted Aggregation** to handle voter reliability and noisy labels, enforces **Diverse Sources** to minimize correlation, and applies **Premise-Based Aggregation** for the logic of the defect definition. Treat policy tickets (Obs 9) separately using simple majority, acknowledging that "accuracy" is not the metric there.
