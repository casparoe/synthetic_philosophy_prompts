      *   *Is it Ill-posed?* "Which is correct?" is ill-posed without specifying the context (strategic vs. axiomatic/arbitration).
      *   *Geometry:* The user is right about curvature. NBS cares about how fast marginal utility diminishes as we move along the frontier. KS ignores that; it only cares about the endpoints.
      *   *Verbal?* "Fair" means different things. NBS: Fair = stable against independent shifts in irrelevant options. KS: Fair = monotonic improvement when the pie gets bigger.
      *   *Conclusion:* It's a **categorical mismatch**. NBS is a *strategic equilibrium* concept disguised as an axiom system. KS is a *fair division* concept disguised as a bargaining solution. They answer different questions.

  4.  **Evaluate Progress Candidates (Task 2):**
      *   *New Characterization Theorem:* User already dismissed this (rightly). It just adds noise.
      *   *Experiment:* Lab work exists (Roth et al.). It's messy. People aren't consistent. Unlikely to resolve the theoretical tension because human behavior varies by context.
      *   *Strategic Foundation:* Rubinstein (1982) gave NBS a non-cooperative foundation (alternating offers with discounting). KS lacks a clean, universally accepted non-cooperative foundation (though some exist with specific threat structures). This is a strong point for NBS in *prediction*.
      *   *Redundancy:* Unlikely. The axioms are logically independent.
      *   *Change of Question / Different Questions:* This is the winner. Acknowledging that NBS is for *strategic prediction* and KS is for *arbitration norms*.
      *   *Likelihood:* High for "Change of Question" (it's already happening in specialized lit), Low for "Definitive Experiment."

