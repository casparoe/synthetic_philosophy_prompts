      *   *Section 1: Diagnosis.* Validate the "local vs. global" insight. Push it further: It's about *information* and *risk*. NBS requires cardinal utility (curvature matters). KS works with ordinal utility (mostly). NBS is about *efficiency of trade*; KS is about *claims on the surplus*.
