      *(Self-Correction during drafting)*: I need to be careful about the "risk" claim. NBS assumes vNM utilities, which encode risk. KS is often applied to utilities, but its axioms don't strictly require the same risk interpretation. However, the geometric difference is the key. NBS is sensitive to the *shape* of the frontier between $d$ and the solution. KS is blind to the shape, only seeing $d$ and $a$.
      *Refining the "Power" point:* In NBS, if the frontier bends toward Player 1 (concave from P2's view), P1 gets less than KS would give them? Let's check.
      *   NBS maximizes area of rectangle from $d$.
      *   KS moves along the diagonal.
      *   If the frontier is "bulging" out (convex set), NBS tends to favor the player whose utility grows faster initially? No, NBS favors the player with more "bargaining power" defined by the curvature.
      *   Actually, a key distinction: NBS is invariant to independent scaling of utilities (affine transformation). KS is *not* invariant to independent scaling of utilities (it depends on the ideal point $a$, which changes if you scale utility). Wait, KS *is* invariant to affine transformations *if applied to the utility representation*. But the *ratio* of gains depends on the units if the units aren't comparable.
      *   *Correction:* Both are invariant to affine transformations of *individual* utility functions. The difference is that KS uses the *ideal point* $a_i = \max u_i$. If I change the scale of $u_1$, $a_1$ changes, but the ratio $(u_1-d_1)/(a_1-d_1)$ stays the same. So KS is scale invariant.
      *   *The Real Difference:* NBS depends on the *substitutability* of utility along the frontier. KS depends on the *comparability* of the maximum claims.
      *   *Wait, one nuance:* KS requires interpersonal comparison of utility *scales* implicitly? No, it normalizes by the ideal point. But it assumes the "distance" to the ideal point is comparable in terms of "proportion of satisfaction." This is a normative claim about fairness (equal relative sacrifice) that NBS doesn't make. NBS makes a normative claim about multiplicative symmetry.

      *Let's focus on the Mediator Context:*
