answer: |-
  Your hypothesis is sharp, but I think it identifies the *symptom* rather than the *disease*. You are correct that the geometric divergence happens at frontier curvature and that the two solutions locate "power" differently (disagreement/local vs. ideal/global). But the reason this has remained unresolved for fifty years is not that the axioms are equally compelling, but that **Nash and Kalai–Smorodinsky are solving different problems under the same name.**

  Here is the diagnosis of the disagreement, the geometry of the consequence, and the ranking of paths to progress.

  ### 1. The Diagnosis: A Categorical Mismatch

  The dispute is not substantive (about the same truth), normative (about the same value), or verbal (about definitions). It is a **categorical mismatch regarding the enterprise.**

  *   **Nash (NBS)** is a **strategic stability** concept masquerading as an axiomatic one. Its core axiom, Independence of Irrelevant Alternatives (IIA), is the mathematical fingerprint of a non-cooperative equilibrium. It says: "The agreement should not depend on options that would not be chosen in equilibrium." This is why NBS has a clean non-cooperative foundation (Rubinstein's alternating offers). The "power" in NBS comes from the *threat point* and the *marginal rate of substitution* at the solution. It assumes the parties are strategic actors who care about consistency.
  *   **Kalai–Smorodinsky (KS)** is a **fair division** concept masquerading as a bargaining solution. Its core axiom, Monotonicity, is the fingerprint of an arbitrator's norm. It says: "If the set of possible agreements improves, no one should be punished." This is a normative claim about rights to the surplus, not a prediction about strategic behavior. The "power" in KS comes from *claims* on the maximum possible utility. It assumes the parties are claimants entitled to a proportion of their potential satisfaction.

  **The Geometry of the Disagreement**
  You suspected frontier curvature is where the philosophy bites. You are right.
  *   **NBS is sensitive to curvature.** It maximizes the area of the rectangle defined by the disagreement point $d$ and the solution $u$. If the Pareto frontier bulges outward (strictly convex set), the NBS point shifts toward the player whose utility function is "flatter" (less diminishing marginal utility) near the solution. NBS rewards the player who can convert the other's utility concessions into their own gains more efficiently *at the margin*.
  *   **KS is blind to curvature.** It draws a straight line from $d$ to the ideal point $a$. It does not care how "expensive" it is in terms of Player 2's utility to give Player 1 more utility, provided the ideal point remains the same. KS treats the utility frontier as a constraint on *claims*, not a menu of *trade-offs*.

  **The Verdict:** The disagreement is ill-posed because "Which solution is correct?" asks for a single truth where there are two distinct contexts. NBS answers: "What will rational, strategic agents converge to?" KS answers: "What should a neutral arbitrator impose to ensure proportional satisfaction?"

  ### 2. What Counts as Progress?

  You asked for a ranking of candidates for progress, excluding new characterization theorems. Here is the ranking from most likely to resolve the tension to least likely, with an honest assessment of feasibility.

  **1. Change of Question (Contextual Validity)**
  *   **The Move:** Explicitly decouple the solutions by domain. Admit that NBS is the standard for *positive* theory (predicting outcomes in unmediated negotiation) and KS is the standard for *normative* theory (designing arbitration rules or mediated focal points).
  *   **Why it resolves it:** It stops the competition. We stop asking which axiom is "true" and start asking "Are we modeling a fight or designing a settlement?"
  *   **Likelihood:** **High.** This is already the de facto state in advanced microeconomics and mechanism design, though textbooks often obscure it by teaching them side-by-side as rivals.
  *   **Progress Metric:** When a paper no longer feels the need to justify KS by attacking IIA, but instead justifies it by citing the need for monotonicity in mechanism design.

  **2. Strategic Foundation (Non-Cooperative Limits)**
  *   **The Move:** Find a robust non-cooperative game whose unique subgame perfect equilibrium converges to KS (as Rubinstein did for NBS).
  *   **Why it resolves it:** If KS can be derived from strategic play, it challenges the idea that NBS is the only "stable" outcome. (Note: Some foundations exist for KS involving specific threat structures or incomplete information, but none are as canonical as Rubinstein's).
  *   **Likelihood:** **Medium.** It is possible to construct games that yield KS, but they usually require specific, less natural assumptions (e.g., specific breakdown probabilities or commitment devices) compared to the sheer robustness of the alternating offers model for NBS.
  *   **Progress Metric:** A "Rubinstein-style" model for KS that is taught in core PhD sequences.

  **3. Discriminating Experiment**
  *   **The Move:** A lab experiment that cleanly isolates curvature effects and IIA violations to see which solution predicts human behavior.
  *   **Why it resolves it:** Empirical dominance would force theorists to align.
  *   **Likelihood:** **Low.** Human bargaining behavior is context-dependent. In competitive, anonymous settings, people often look like NBS. In mediated, face-to-face, or "fairness" primed settings, they look like KS or Equal Split. The noise is too high to crown a winner.
  *   **Progress Metric:** A meta-analysis showing a consistent moderator variable (e.g., "time pressure favors NBS, communication favors KS").

  **4. Axiomatic Redundancy**
  *   **The Move:** Prove that under a "reasonable" extra assumption (e.g., specific risk attitudes), one axiom implies the other.
  *   **Why it resolves it:** It would mathematically collapse the choice.
  *   **Likelihood:** **Near Zero.** The axioms are logically independent. You would need to impose an assumption so strong it essentially begs the question (e.g., "assume the frontier is linear").

  ### 3. Advice for the Mediator/Arbitrator

  You asked if "maximize product" (NBS) vs. "proportional gains" (KS) is a genuine choice with consequences for a mediator. **It is.** It is not notational. It changes the distribution of surplus, especially when the frontier is curved.

  **When to commit to Nash (Maximize Product):**
  *   **Context:** Unmediated negotiation support, or when you want to anchor parties to their BATNAs (Best Alternative to a Negotiated Agreement).
  *   **Consequence:** This favors the player with the stronger *threat point* and the player whose utility is less sensitive to concessions near the agreement. It treats the negotiation as a strategic interaction where consistency matters.
  *   **Risk:** It can feel "cold." If the frontier is highly curved, NBS can yield outcomes that look lopsided compared to the ideal point, which parties may reject as "unfair" even if efficient.

  **When to commit to Kalai–Smorodinsky (Proportional Gains):**
  *   **Context:** Active arbitration, mediation where you are setting a focal point, or when you want to incentivize *expanding the pie*.
  *   **Consequence:** Because of the Monotonicity axiom, KS incentivizes parties to reveal options that expand the feasible set. If I know that making the pie bigger won't result in me getting a smaller slice (which can happen in NBS if the curvature shifts), I am more likely to cooperate.
  *   **Risk:** It requires agreeing on the "Ideal Point" ($a$). Parties often disagree on what is theoretically possible. NBS only requires agreeing on the Disagreement Point ($d$), which is usually observable (litigation, walk-away).

  **The Concrete Difference:**
  Imagine a divorce settlement.
  *   **$d$ (Disagreement):** Court battle (costly for both).
  *   **$a$ (Ideal):** Husband gets everything / Wife gets everything (impossible).
  *   **Frontier:** Curved. Perhaps transferring the house to the Wife is very cheap for the Husband (he doesn't value it much) but high value for her.
  *   **NBS:** Will push the settlement toward the Wife heavily, because the "marginal trade" is efficient there. It exploits the curvature.
  *   **KS:** Will split the *proportion* of the ideal gain. If the Husband's ideal is \$1M and Wife's is \$1M, KS aims for equal proportional satisfaction, ignoring that the Husband doesn't care about the house.

  **Recommendation:**
  If your goal is **efficiency and stability**, lean Nash. It respects the local trade-offs.
  If your goal is **cooperation and perceived fairness**, lean Kalai–Smorodinsky. It respects the global claims and ensures that finding new value helps everyone.

  **Final Diagnosis:** The field hasn't converged because it refuses to admit that **Nash describes the war, and Kalai–Smorodinsky describes the peace treaty.** If you are the mediator, you are designing the peace treaty. You should probably be using KS, or at least acknowledging that NBS might leave value on the table by failing to reward the expansion of the feasible set.
