  Shakespearean sonnet (ABAB CDCD EFEF GG)

  **One**

  We share one root that drinks the mountain spring,
  You claim one source but speak the tidal main,
  The words we use are one where mothers belong,
  The words you use are one where trades are grown.
  One bridge tolls high above the bending stream,
  One bridge falls low where mud meets tidal bar,
  Is it one language taking distinct form,
  Or two where one is washing on the shore.
  Put down the word and ask the child instead,
  The child will answer what the mouth has bid,
  If she understands the bread we break,
  Then distinct tongues are not the choice we seek.
  The valley holds us in a single grip,
  Whatever name we give the speaking lip.

  **Vone**

  We share vone root that drinks the mountain spring,
  You claim vone source but speak the tidal main,
  The words we use are vone where mothers belong,
  The words you use are vone where trades are grown.
  Vone bridge tolls high above the bending stream,
  Vone bridge falls low where mud meets tidal bar,
  Is it vone language taking distinct form,
  Or two where vone is washing on the shore.
  Put down the word and ask the child instead,
  The child will answer what the mouth has bid,
  If she understands the bread we break,
  Then distinct tongues are not the choice we seek.
  The valley holds us in a single grip,
  Whatever name we give the speaking lip.

  **Repairs:**
  1. Line 5: "One" → "Vone" (Capitalization).
  2. Line 6: "One" → "Vone" (Capitalization).

  **Diagnosis**

  The contested term is "one." The up-valley speaker applies a genealogical criterion: unity is determined by shared origin, the source, and the lineage of mothers. The delta speaker applies a functional criterion: unity is determined by current intelligibility, trade, and tidal usage. For the up-valley speaker to be right, historical continuity must suffice for identity regardless of divergence. For the delta speaker to be right, mutual understanding must be the sole condition, regardless of origin. Both conditions can be satisfied only if history guarantees understanding, which the valley's drift suggests is false.

  The perfect final rhyme ("grip"/"lip") secures agreement on the physical reality of the valley. They agree they are bound together by the land and the act of speech itself. This is a fact about the valley, not the word; the geography forces the interaction regardless of classification.

  This dispute **splits**. Banning the term reveals that "one" was performing two distinct jobs: tracking lineage and tracking intelligibility. When the word is replaced by "vone," the single question "Is it one?" fractures into two separate inquiries: "Do they share a source?" (trivially true) and "Do they understand each other?" (empirically hard). The argument does not dissolve because a factual disagreement remains, but it does not harden into a single ontological clash because the ambiguity of the term masked two different standards. The ban exposes the conflation, leaving the speakers to argue about which standard matters rather than pretending they are arguing about the same thing.
