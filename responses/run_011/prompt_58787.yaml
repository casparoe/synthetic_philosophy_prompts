      *   Ensure the bridge is solid: The math *is* the metaphysics here.

  9.  **Self-Correction/Check during drafting:**
      *   *Did I address the "offset" issue correctly?* In infinite horizon discounted MDPs, adding a constant $c$ adds $c/(1-\gamma)$ to the value of *every* state. It doesn't change the *argmax* action. But in episodic tasks, it changes the value of terminating vs. continuing. I need to be precise here. The prompt mentions this specifically.
