  ok so me and the people in my school's philosophy discord get into the same argument about whether it's wrong to have kids like twice a week, and every single one of us says "im an antinatalist," but I'm pretty sure we don't mean the same thing by it and I want to prove that. Can you make me a sorting quiz — 8 or 9 questions — that I can post in the server that sorts people by what they say about cases, not by what label they claim for themselves?

  stuff I care about:

  - every question is a concrete scenario with 2 or 3 answer options. nothing like "do you accept the asymmetry," because half of us would just say yes to sound smart and the quiz would be useless.
  - the leaves have to include: the Benatar-style asymmetry view, where pain's absence is a good even if nobody is around to enjoy it but pleasure's absence isn't a loss unless there's somebody being deprived; plain "life is net bad on average" pessimism that doesn't need any asymmetry at all; the consent version (nobody can agree to be born, so it's wrong for that reason); the weaker version where having a kid isn't wrong but you still have a strong reason not to; the procreative beneficence people who think you should have the best kid you can; and the person-affecting view where none of this can be wrong because you can't harm or benefit someone who never exists. use the standard name for a leaf if it has one, and if a leaf is one nobody actually defends, say so instead of inventing a name.
  - I really want it to pull apart "you would have been better off never existing" from "your parents did something wrong," because half the server slides between those two without noticing. so build at least one question where those come apart, and one about someone who's genuinely glad to be alive and whether that changes anything about what their parents did. also one on whether the same reasoning reaches having pets or building a sentient AI in a game, and one on a kid whose life would be really good.
  - then a scoring key: which answer patterns land on which leaf, and what to make of a pattern that's a mix that doesn't match any real position. I want to be able to tell someone "youre not an antinatalist, you just think your own life sucks" without being a jerk about it. also point out any combination of answers that looks available in principle but nobody holds, and say why — incoherent, just unattractive, or nobody's bothered.
  - if two of the leaves can't actually be told apart by my questions, flag which ones rather than pretending the quiz is perfect.

  no trolleys, and please keep it away from abortion and euthanasia, those derail the server instantly.
