answer: |-
  There is a tradition in this room, as the Father has kindly reminded us, to speak of the departed as saints. It is a comforting geometry. It flattens the curve of a life into a halo, smoothing out the jagged edges so that the grieving might have something clean to hold. For a family, this is mercy. For a newsroom, it is fiction.

  I stand here because Arthur hired me. He rescued me. He is the reason I have a career. I also stand here because I have seen the margins of his manuscripts. I have seen the red ink that bled through the paper, the adjectives circled like prey, the notes in the margin that asked, simply, "Why?" when a sentence was soft, or "Liar," when it was merely imprecise.

  We are asked to imitate the lives of the saints. But if we are to imitate Arthur, we cannot imitate a saint. We must imitate a force.

  There is an old way of writing lives, practiced by Plutarch, who suggested that we learn more of a man from a jest or a glance than from a battle. Arthur's battle was against sloppy thinking. His glance was often withering. To speak of him honestly, we must acknowledge that his generosity and his severity were not opposites. They were the same fire.

  To the family: You knew the warmth of that fire. You knew the man who came home, who loved you, who protected you. To the staff: You knew the heat of that fire. You knew the man who burned away the excess to find the truth. These are not two different men. They are the same man, directed at different targets. If we separate them, we lose him.

  In the hagiography, the vice is erased to make the virtue safe. But Arthur's virtue was not safe. It was demanding. When he eviscerated a junior writer in a meeting, it was cruel. I will not stand here and call it tough love. It was pain. But it was pain inflicted because he believed that words mattered more than feelings. He believed that a sloppy sentence was a moral failure. That is a hard belief to hold. It requires a certain hardness to maintain it.

  If we are to honor him, we cannot simply praise the books or the column. We must praise the standard. And we must acknowledge the cost of that standard.

  I am reminded of the parallel lives, where a man is compared not to an ideal, but to another man, flaw and all, to see where the virtue truly lies. If I must pair Arthur with anyone, I would pair him with himself. The man who broke you is the man who built you. The hand that struck the table in anger is the hand that pulled you up when you fell. He did not suffer fools, but he never abandoned a student. He would tell you your work was garbage, and then stay until midnight to help you fix it.

  This is the model he leaves us. Not a saint who floats above human error, but a craftsman who was wounded by it. He was 84. He wrote until the end. He fought until the end.

  How do we imitate this? We do not imitate the shouting. We do not imitate the red ink that stings. We imitate the refusal to settle. We imitate the belief that the work is worth the fight. We imitate the care that is so deep it sometimes looks like rage.

  To his widow and children: He loved you with the same intensity he brought to the page. He protected you from the temper that he visited upon us, because he knew the cost of it. He spared you the fire so you could enjoy the light.

  To the journalists: We carry the scars. Let them remind us not to be cruel, but to be careful. Let us write as if someone is watching. Let us care enough to be difficult.

  Arthur was not a safe man. He was a necessary one. In a world of soft words and easier truths, he was a grindstone. You do not love a grindstone because it is gentle. You love it because it makes the blade sharp.

  He has put down the pen. The margins are blank. It is up to us to fill them without him. We will miss his kindness. We will miss his wrath. Mostly, we will miss the standard.

  Rest now, Arthur. The copy is clean.
