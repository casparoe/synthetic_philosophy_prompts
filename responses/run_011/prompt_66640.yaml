  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Expert on Plutarch's biographical method and hagiography, philosopher/speechwriter.
      *   **Task:** Write a eulogy (approx. 800 words, 6 minutes) for a deceased magazine editor (84 yrs old).
      *   **Context:** The editor hired the speaker, rescued careers, wrote books/columns. He was also cruel (margin notes, meetings, public humiliation of juniors).
      *   **Audience:** Half grieving family (want a saint), half journalists (know the cruelty), plus one priest (framing it as hagiography/"lives of the saints").
      *   **Goal:** Comfort without lying. Avoid the word "complicated." Emulate Plutarch's *bios* (life) rather than hagiographic *vita* (saint's life). Show the temper as integral to his worth, not a disclaimer. Use Plutarch's method of small specifics ("expression or a jest"). potentially use parallel lives comparison to handle the flaw.
      *   **Constraints:** ~800 words, no lecture on Plutarch (max 1 explicit reference), temper must be part of the imitation model.
      *   **Pre-drafting:** Brainstorm out loud about vice/imitation and *vita* vs. *bios*.

  2.  **Brainstorming & Philosophical Grounding:**
      *   *Vita* (Hagiography) vs. *Bios* (Plutarch): A *vita* flattens the subject into a model of virtue. Vice is erased or redeemed. The gain is clarity and safe imitation. The loss is truth and human connection. A *bios* includes flaws because the flaw is often the shadow side of the virtue. You imitate the *energy*, not just the morality.
      *   *Vice as Imitable:* How do you imitate a cruel editor? You imitate the *standard*, not the cruelty. The cruelty was the friction caused by his refusal to accept less than the truth. The temper wasn't a bug; it was the heat of his care for the work. To imitate him is to care that much, even if we pray we find gentler ways to show it.
      *   *Plutarch's Method:* Small details reveal character. Not "he was great," but "he circled a verb in red." Parallel lives: Compare him to someone else? Maybe compare the public man vs. the private man, or compare his severity to his generosity. Actually, the prompt suggests using the pairing method to get the flaw in without accusation. Maybe pair him with himself: the man who broke you and the man who built you. Or pair him with a historical figure known for severity but virtue (like Cato?). Let's stick to the prompt's suggestion: "If Plutarch's habit of pairing two lives and comparing them is a way to get the flaw in without accusing him of it, use that." I could compare him to a stern father figure or a historical editor known for bite. Or, more subtly, compare the *idea* of him vs. the *man* of him. Actually, the best Plutarchan move is to juxtapose his cruelty with his generosity as two sides of the same coin, not opposites.
      *   *The "Saint" Frame:* The priest wants a saint. I can't contradict the priest openly. I must redefine sainthood. Not a sinless saint, but a fiery one. An Old Testament prophet rather than a serene apostle.
      *   *Key Image:* The red pen. The margin note. The meeting.
      *   *Tone:* Respectful, honest, warm but sharp. Not apologetic.

  3.  **Drafting - Section by Section:**
      *   *Opening:* Acknowledge the setting (church, saintly frame) but pivot to the human.
      *   *The Work:* His dedication to ideas. The books, the column.
      *   *The Flaw (The Temper):* Address the cruelty without using the word "cruel." Describe the margin notes. The fear he instilled.
      *   *The Plutarchan Turn:* Connect the temper to the care. The friction was because he cared about the truth.
      *   *The Parallel:* Compare him to someone? Or compare the two versions of him (the destroyer and the builder). Let's use the Plutarchan parallel of *Cato* or just the concept of "sternness." Actually, let's compare him to the *work* itself. The work was hard, so was he.
      *   *The Imitation:* How do we imitate him? Not the shouting, but the refusal to settle.
      *   *Closing:* Comfort for the family (he loved you) and the staff (he made you).

  4.  **Refining the "Parallel Lives" Constraint:**
      *   Plutarch pairs lives (e.g., Alexander/Caesar) to illuminate virtue/vice through comparison. I can pair the Editor with the Journalist. Or the Editor with the Priest. No, better: Pair the *man who wounded* with the *man who healed*. They are the same man.
      *   Alternatively, invoke a specific Plutarchan parallel implicitly. "There is an old way of writing lives..." (One reference allowed).
      *   Let's try pairing him with a historical figure known for severity. Johnson? Luce? No, keep it general. Let's pair the *public virtue* with the *private vice* and show they are the same root.
      *   Actually, the prompt says: "If Plutarch's habit of pairing two lives and comparing them is a way to get the flaw in without accusing him of it, use that." I will pair his severity with his generosity. They are not opposites; they are the same intensity directed at different targets.

  5.  **Drafting - Word Count & Tone Check:**
      *   Need to ensure I don't say "complicated."
      *   Need to ensure the temper is part of the *reason* to imitate him (the intensity), not a flaw to overlook.
      *   Need to comfort the family (he loved you) without lying to the journalists (he was hard).
      *   Word count target: ~800.

  6.  **Writing - Step-by-Step:**
      *   *Intro:* Establish the "Saint" frame but shift to "Man."
      *   *Body 1:* The work. The standards.
      *   *Body 2:* The cost of those standards (the temper). The red ink.
      *   *Body 3:* The Plutarchan insight. The virtue and vice are the same fire.
      *   *Conclusion:* The legacy. Imitate the fire, not the burn.

      *(Self-Correction during drafting)*: Make sure I don't sound like I'm defending abuse. The key is that his *care* was so large it became violent. The imitation is the care, not the violence. But the violence proves the care.
      *(Refining the Plutarch reference)*: Keep it subtle. "Plutarch wrote..." once.
      *(Refining the Parallel)*: I will pair him with himself. The destroyer and the creator.

      *Let's write.*

      *Check constraints:*
      - 800 words approx.
      - No "complicated".
      - One Plutarch ref max.
      - Temper as reason to imitate.
      - Comfort without falsehood.

      *Drafting thought:* Start with the margin notes. That's the specific detail.

      *Wait, one more thing:* The priest is framing it as "lives of the saints." I need to respect that but expand the definition of saint. A prophet is a better model than a martyr.

      *Okay, let's go.*

      *Brainstorming output first:*
      How does a life with vice function as imitation? In hagiography, vice is erased to make the subject a safe vessel for divine virtue. In *bios*, vice shows the cost of the virtue. The vice is often the virtue overheated. Ambition becomes ruthlessness; care becomes nagging; standards become cruelty. To imitate this man is not to imitate the cruelty, but to recognize that the cruelty was the shadow of his immense care for the truth. We imitate the intensity, not the burn.
      What does *vita* gain by leaving vice out? Safety. Clarity. A model that doesn't hurt.
      What does *bios* lose by keeping it in? Safety. But it gains truth. It gains the ability to say: "He was dangerous, and that is why he was great."
      Okay, ready to write.

