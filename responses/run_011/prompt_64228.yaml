  **Option 1 (The Specific Joke)**
  "You keep looking for the hand that pushed him. Like the universe had to obey a rule. But you know me. I don't think there's a hand. I think the laws are just the bruise. We're treating the mark like it was the punch."

  **Option 2 (The Safer Alternate)**
  "You want to believe there was a reason. A law that demanded it. But you know me. I think the universe doesn't have reasons. It just has habits. We're looking for a promise, but there's only a pattern."

  ***

  **Why it lands**
  For the philosophically literate, this nails the Best System Account: laws are supervenient on the mosaic of events (the bruise/mark) rather than governing them (the hand/punch). It captures the Anti-Humean accusation that Humeanism offers only description, not production. For the lay reader, it works as dark, fatalistic wit appropriate for a wake: the comforting idea of "fate" or "order" is dismissed as a confusion between cause and effect.

  **The Supervisor's Comeback**
  "But a bruise doesn't explain the fist. If the laws are just the record, nothing makes the next moment happen. You've got a world of facts, but no glue. He didn't die because of a law; he died, and you wrote a law about it. That leaves him without a reason."
