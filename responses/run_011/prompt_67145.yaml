answer: |-
  The no-jargon constraint costs you the ability to name the structural critique explicitly, forcing you to embed the theory in narrative rather than argument. If I could use the vocabulary, I would tell the room that Do was a republican theorist who understood that dependency corrupts both the master and the servant, and that benevolence is incompatible with liberty.

  ***

  Good morning.

  It is loud out here. The traffic does not stop for dedications. I think Do would have liked that. She did not like things that pretended to be quieter than they were.

  My name is [Name]. I am twenty-nine years old. I am standing here because the City asked me to speak. This feels strange. I was not born on the Near East Side. I do not live here now. I knew Do for one summer when I was nineteen. I sat at a desk in the back of her office. I filed papers. I answered phones. I watched her work.

  When people die, we often smooth them out. We make them soft. Do was not soft. She was abrupt. She held grudges. She lost more than she won. If I tell you she was a saint, her daughter will roll her eyes from the front row. She knows better. You know better.

  So I will not tell you she was perfect. I will tell you what she looked for.

  In that office, she kept a card file. It was old-fashioned. Thick cardboard. She kept a card for every address where she had lost. Evictions that went through. Buildings that got converted. Families that had to leave. People asked her why she kept track of the losses. It seemed like carrying weight that wasn't hers.

  She said she needed to know how much of the map was still at somebody's say-so.

  That was her test. She used it on everything. When someone offered you protection, she asked one question. Can the person giving it take it back without giving a reason?

  If the answer was yes, she did not call it freedom. She called it a loan.

  She said nearly all the freedom people were offered was loaned. It might be pleasant. It might be generous. But if it could be taken back on a Tuesday for no reason, you did not own it. You were just staying there rent-free until the landlord changed his mind.

  This made her difficult. It made her fight people who were trying to help. But it also made her honest.

  There is a man sitting here today who knows this well. Ray Vitullo. For many years, he owned the buildings where many of her tenants lived. He was not a villain in the storybook sense. He never raised a rent above the cap. He fixed the heat on the same day you called. Once, he paid for a family's flight to a funeral out of his own pocket.

  Do thanked him for the care. But she told him to his face that his kindness was not justice. She told him that as long as he held the keys, he held their necks. He could be kind today and arbitrary tomorrow. It made them enemies for eleven years.

  Then, bizarrely, it made them friends.

  I think they became friends because they stopped pretending. He stopped pretending his kindness was a right. She stopped pretending he was a monster instead of a man with power. We thank Mr. Vitullo for being here. We thank him for the care he showed those families. And we honor Do for insisting that care was not enough. She wanted them to own their place, not borrow it.

  That insistence had costs. It still does.

  This plaza sits on ground with a history. In 2009, the City took this land by eminent domain. A hardware store had been on this corner for forty years. The block was declared blighted. The plan included sixty permanently affordable units. Do testified in favor of the taking.

  The hardware store owner's son is here today. He has said that this dedication is a monument to his father's ruin. He is not wrong about the ruin.

  Do knew there was a bill. She knew that security for some often meant loss for others. She did not look away from that. She chose the tenants who had nowhere else to go. She chose the many over the one. It was a hard choice. It was a human cost. We acknowledge that pain today. We do not hide it. She would not have wanted us to hide it. She believed in looking at the map and seeing where the losses were.

  She believed in looking at the wins, too. And asking if they were solid.

  There are new programs today. The City has launched a Housing Access Pilot. Four hundred slots. A lottery. A caseworker who decides case by case who qualifies as extreme hardship. The Councilmembers have asked me to thank them for this work.

  We thank you for the resources. We thank you for trying to help people who are struggling. It is better than nothing.

  But Do would ask the question again. Can the caseworker take it back without a reason? If the answer is yes, then it is still a loan. It is still freedom at somebody's say-so.

  So here is the thank you that honors her. We accept the help. But we will keep working. We will keep working until the help is not a favor. We will keep working until it is a right. We will keep working until the answer to her question is no.

  I was nineteen when I worked for her. I was scared of everything. I was scared of the phone. I was scared of the tenants. I was scared of Do.

  One day, a landlord called. He was angry. He said he was doing us a favor by not evicting everyone immediately. He said we should be grateful.

  Do was sitting right next to me. She did not yell. She did not argue. She just said, "We are not asking for a favor. We are asking for the law."

  She hung up. She looked at me. She said, "Don't thank them for not burning the house down. Ask them why they have the matches."

  That summer taught me something. It taught me that freedom is not about how nicely someone treats you. It is about whether they have the power to treat you badly without consequence.

  She died in February. She left behind the card file. She left behind the fights. She left behind the friends she made by telling them the hard truth.

  Now we have this plaza. It has her name on it.

  A plaza is public ground. Nobody owns it. Nobody can lock it. Nobody can decide who sits on the benches based on whether they are grateful enough. It is not loaned. It is owned.

  That is a rare thing.

  So we stand here. We listen to the traffic. We look at the map. We see the losses. We see the wins. And we check them. We check to see if they are solid.

  If you are here because she helped you keep your home, you know what she would say. She would say do not just remember her. Remember the test.

  When someone offers you protection, ask if they can take it back.
  When someone offers you kindness, ask if it comes with strings.
  When someone offers you a home, ask if you own it.

  She was not a saint. She was a woman who knew the difference between a gift and a right.

  We miss her. We need her. But we have the test.

  Thank you.

  Spine: True liberty is not the absence of interference or the presence of help, but the security of standing on ground that no one can pull from under you without reason.
