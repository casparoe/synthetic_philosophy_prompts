      *   **Core Theme:** Do's concept of freedom = non-domination (not being at anyone's mercy), not negative liberty (leave us alone) or positive liberty (build a better life). Freedom you own vs. freedom you're loaned.
      *   **Constraint:** No academic jargon (no "non-domination," "Berlin," "Pettit," etc.). The idea must structure the speech silently.
      *   **Specific Challenges (The Three Knots):**
          1.  *Ray Vitullo (Landlord):* Kind but held arbitrary power. Do fought him, then befriended him. Need to thank him without validating arbitrary power or villainizing him.
          2.  *Eminent Domain (Hardware Store):* City took land for affordable housing. Do supported it. Store owner's son resents it. Need to address this honestly without apologizing for Do or lying about the cost.
          3.  *Housing Access Pilot (City Program):* Discretionary benefits (lottery/caseworker). Do would hate this (freedom loaned). Council expects thanks. Need to acknowledge without endorsing discretion, or eat the awkwardness gracefully.
