      Dear Student,

      Your supervisor's suggestion that mathematicians simply trust one another as chemists or historians do is indeed too quick, for it ignores the specific normative architecture that distinguishes mathematics from the empirical sciences. While the practice looks like reliance on testimony, the justification offered is fundamentally different. You are right to sense that the standard dichotomy between Humean reductionism and Reidian anti-reductionism fails to capture the nuance of what is happening in your reading group. A Humean account requires that testimony be corroborated by one's own experience or the conformity of reports, yet mathematicians accept results they cannot personally verify and often without independent confirmation. A Reidian account grants a default entitlement to believe unless there is positive reason for doubt, which aligns better with the daily workflow where gaps are ignored until they become problematic. However, neither view fully explains the unique role of the proof itself. The practice presupposes a hybrid position where testimony is warranted not merely by the speaker's reliability, as Reid might suggest, nor by the listener's verification, as Hume demands, but by the structural availability of verification within the community.

      This brings us to the notion of checkability in principle, which seems to be the engine driving this epistemic economy. You ask if this can be a reductionist account. Strictly speaking, it cannot, because reductionism requires actual reduction of testimonial warrant to non-testimonial evidence. Here, the warrant is transferred via the *possibility* of reduction, not the actuality. For this to transmit warrant to your own belief rather than merely certifying the original prover's belief, the community must function as a single epistemic agent. The practice treats the mathematical community as a distributed cognitive system where the capacity to check is pooled. When you accept a theorem based on a proof you have not read, you are not relying on the author's authority in the way a layperson relies on a physicist. You are relying on the fact that the author has issued a standing offer to justify the claim according to shared rules. This functions less like traditional testimony and more like an insurance policy or a division of epistemic labour. The warrant transfers because the social structure guarantees that if the claim were false, the possibility of checking ensures it would likely be exposed. Thus, the knowledge is not individual but collective, and your individual warrant is derivative of your membership in this verificatory community.

      Regarding the Kepler conjecture and the referees' ninety-nine percent certainty, this introduces a crucial distinction between belief and acceptance. If the referees were uncertain, yet the result was used as a theorem, they were not expressing full doxastic belief in the truth of the proposition. Instead, they were accepting the proposition for the purposes of further work. This pragmatic stance allows the discipline to progress without waiting for absolute certainty, which may be unattainable or too costly. Does this change whether testimony transmits knowledge? If knowledge requires truth and justification, probabilistic assurance complicates the justification condition. However, if we view mathematical knowledge as a stable state of accepted commitments rather than a mirror of platonic truth, then testimony transmits the right to use the result, not necessarily the infallible knowledge of its truth. This distinction matters because it suggests that mathematical knowledge is fallible and evolving, much like scientific knowledge, despite the rhetoric of certainty. The testimony transmits a license to proceed, contingent on the future possibility of full verification, as seen when the machine-checked proof arrived years later.

      Finally, we must separate what the practice strictly presupposes from what merely sits well with it. The practice is underdetermined between a view that values actual verification and one that values social cohesion. To discriminate between these rival accounts using evidence internal to the practice, one would need to examine how errors are treated when found. If the community operates on a strict Humean model, the discovery of a gap should invalidate all downstream work immediately. If it operates on a Reidian model, the authority of the author might sustain the result despite gaps. In reality, the community often continues to use results with known gaps if the risk is deemed low, suggesting a pragmatic acceptance model. To concretely shift the community toward a strict Humean view where nothing is taken on authority, refereeing would need to become exhaustive rather than sampling, textbooks would need to include every lemma rather than marking steps as routine, and citation habits would need to distinguish between verified and unverified results. Conversely, adopting a strict Reidian view would diminish the role of proofs entirely in favor of expert consensus, changing graduate training to focus on authority and tradition rather than derivation. The current practice presupposes that the proof exists as a public object capable of settling disputes, even if unread. It relies on the tension between the ideal of individual verification and the reality of collective trust. Your task is to show that this tension is not a bug but a feature, constituting a unique epistemic category that is neither purely testimonial nor purely empirical, but structural.

      I hope this helps you frame your contribution to the group.

      Warmly,
