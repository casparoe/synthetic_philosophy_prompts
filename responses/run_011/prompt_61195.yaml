answer: |-
  You have put your finger on a profound and rather uncomfortable truth about quantitative regulation. It is a frustration shared by many in the field, though it is seldom discussed so clearly. You are describing two distinct epistemic regimes that are frequently conflated in organisational practice.

  To answer your question directly: yes, the two *types* of questions have established names, though the specific phenomenon of *not knowing which type you are holding* is less well-standardised.

  ### 1. The Two Types of Questions

  The distinction you draw between component failure rates (convergent) and structural stability in fifteen years (divergent) is best captured by the distinction between **Resolvable Uncertainty** and **Radical Uncertainty**.

  *   **Resolvable Uncertainty (Type 1):** This aligns with what Frank Knight called *Risk*, or what statisticians might call *Aleatory Uncertainty* with learnable parameters. The system is stationary; the rules of the game do not change. More data reduces variance. Your analysts converge because the truth is discoverable.
  *   **Radical Uncertainty (Type 2):** This aligns with Knight's *Uncertainty*, or what Mervyn King and John Kay (in their book *Radical Uncertainty*) describe as problems where the future is not a continuation of the past. The system is non-stationary. Definitions may shift, political landscapes may change, and the "structure" itself is mutable. Here, more data does not help because the reference class is unstable.

  In the American policy literature (specifically the RAND Corporation), Type 2 is often termed **Deep Uncertainty**. This exists when analysts do not know, or the parties to a decision cannot agree upon, the appropriate models to relate actions to consequences.

  ### 2. The "Not Knowing Which Sort" Phenomenon

  You asked specifically for the name of the situation where you cannot tell, from the inside, which sort of question you are holding. This is the more dangerous of the two insights.

  Technically, this is a form of **Second-Order Uncertainty** (or **Meta-Uncertainty**). This is uncertainty about the uncertainty itself—specifically, uncertainty about whether the uncertainty is reducible. However, that term is a bit dry and does not quite capture the deceptive nature of the problem.

  A more descriptive term, which I suggest you might adopt, is **The Convergence Illusion**.

  This captures the specific hazard: the question *presents* itself as Type 1. It invites a distribution. It invites a mean and a variance. It mimics the syntax of a solvable problem. It is only after expending effort—collecting data, consulting analysts—that one discovers the variance is not shrinking. The question possesses **Epistemic Mimicry**; it looks like a risk calculation but behaves like a philosophical enquiry.

  Another relevant concept is the **Reference Class Problem**. To forecast, you must decide which class of past events applies to the future. For passenger volumes, the class is clear (past transport data). For "will this structure hold," the class is ambiguous (does it belong to the class of 'engineering projects' or 'political liabilities'?). You cannot know which reference class is correct until it is too late.

  ### 3. The Spreadsheet Problem: Epistemic Conflation

  The issue of both types going into the same column is a **Category Error**, specifically driven by **Quantification Bias**.

  In regulatory environments, there is often a demand for **Performative Precision**. The spreadsheet requires a number to function, regardless of whether the number carries semantic weight. When you force a Type 2 question into a Type 1 cell, you are engaging in **Reification**: treating an abstract, uncertain concept as if it were a concrete, measurable thing.

  This explains your colleague's predicament. He is exercising **Epistemic Integrity** by refusing to quantify the unquantifiable. However, the organisation interprets this as **Evasiveness** because the institutional culture values the *appearance* of control (a number) over the *accuracy* of the description (a narrative). He is speaking about the nature of the question; they are hearing a refusal to do the work.

  ### 4. Distinguishing from Model Uncertainty and Ignorance

  It is important to keep this distinct from ordinary **Model Uncertainty** and **Ignorance**, as you noted.

  *   **Ignorance** implies we lack data but believe data *could* exist. (e.g., "We don't know the failure rate because we haven't tested enough units.")
  *   **Model Uncertainty** implies we know there are competing explanations. (e.g., "Model A says 5%, Model B says 10%.")
  *   **Your Phenomenon (Radical Uncertainty/Convergence Illusion)** implies the map does not match the territory. Even with perfect data and a perfect model, the ground may shift. It is not that we don't know the parameters; it is that the equation itself may change mid-calculation.

  ### 5. Recommendations for Practice

  Since you cannot easily rename the spreadsheet columns without causing organisational friction, you might consider the following adjustments to manage the risk:

  1.  **The "Confidence" Column:** If you cannot add a qualitative flag, add a second numerical column labelled "Confidence" or "Evidence Quality." Type 1 questions get a high score; Type 2 questions get a low one. This preserves the format but signals the divergence.
  2.  **Scenario Planning:** For Type 2 questions, abandon the single-point forecast. Present three narratives (Optimistic, Pessimistic, Structural Break). This signals that the future is not a tight distribution but a set of possibilities.
  3.  **Reframing the Refusal:** Help your colleague phrase his refusal not as "I will not answer," but as "This question belongs to a class where precision is misleading." He should propose a qualitative assessment *alongside* the number, rather than withholding the number entirely (if the template demands it). This is often called **Shadow Forecasting**.

  ### Summary

  *   **Type 1:** Resolvable Uncertainty (or Risk).
  *   **Type 2:** Radical Uncertainty (or Deep Uncertainty).
  *   **The "Not Knowing":** Second-Order Uncertainty, or **The Convergence Illusion**.
  *   **The Spreadsheet Issue:** Epistemic Conflation / Reification.

  You are quite right to be concerned. In a regulator, treating Radical Uncertainty as Resolvable Risk is not merely an error; it is a systemic vulnerability. It creates a false sense of security precisely where vigilance is most required. Calling it **The Convergence Illusion** might help your unit discuss it without sounding as though you are simply admitting defeat.
