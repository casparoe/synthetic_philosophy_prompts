answer: |-
  Here is the specification of desiderata for an account of interpersonal utility comparison (IUC), tailored to the context of welfare measurement and resource allocation.

  ### I. Desiderata for an Account of Interpersonal Utility Comparison

  **1. The Phenomenological Constraint**
  *   **Requirement:** The account must explain the asymmetry between our confidence in coarse-grained comparisons (e.g., "torture is worse than a headache") and our hesitation regarding fine-grained or cross-context comparisons (e.g., "is the grief of loss A greater than the physical pain of injury B?"). It must allow for some comparisons to be *indeterminate* rather than merely *unknown*.
  *   **Case:** In the health authority case, you may be certain the acute pain patient suffers more *now* than the depressed patient, but uncertain whether the depressed patient's lifelong burden outweighs the acute patient's week of agony. An account that forces a precise number for both obscures this moral reality.
  *   **Status:** **Near-Universal.** (Contested only by strict behaviorists who deny internal states entirely).
  *   **Classification:** **Non-Negotiable.**

  **2. The Distinction Constraint (Levels vs. Differences)**
  *   **Requirement:** The account must distinguish between *level comparability* (who is better off?) and *unit/difference comparability* (whose gain is larger?). It must specify which is required for the decision at hand.
  *   **Case:** Ranking patients for a scarce analgesic requires difference comparability (marginal benefit). Ranking them for a basic income supplement might require level comparability (baseline welfare). Collapsing these leads to category errors in policy.
  *   **Status:** **Near-Universal** among formal welfare economists.
  *   **Classification:** **Non-Negotiable.**

  **3. The Truth vs. Knowability Constraint**
  *   **Requirement:** The account must separate the metaphysical question (do facts exist that make the comparison true?) from the epistemological question (can we access those facts?). It cannot solve the metaphysical problem merely by proposing a measurement technique.
  *   **Case:** Your friend argues the practice *fixes* the scale (epistemology/practice determines truth). A realist argues the scale exists and we measure it poorly. A policy authority needs to know if a measurement error is a technical failure or a conceptual limit.
  *   **Status:** **Contested.** (Realists argue truth precedes knowledge; Quietists/Pragmatists argue truth is constituted by verification conditions).
  *   **Classification:** **Non-Negotiable** (The account must take a stance, not conflate them).

  **4. The Formal Constraint (Affine Transformation)**
  *   **Requirement:** The account must specify how the "gauge freedom" of individual utility functions (unique only up to positive affine transformation: $u' = au + b, a > 0$) is restricted to allow comparison. It must state explicitly whether it fixes the *origin* ($b$), the *unit* ($a$), or both.
  *   **Case:** If Patient A's scale is 0–10 and Patient B's is 0–100, a raw score of 5 is incomparable. To compare, you must assert that A's "0" and B's "0" represent the same state (origin) and A's "1 step" equals B's "1 step" (unit).
  *   **Status:** **Near-Universal** in formal social choice theory.
  *   **Classification:** **Non-Negotiable.**

  **5. The Consistency Constraint (Impossibility/Possibility)**
  *   **Requirement:** The account must acknowledge that granting IUC bypasses Arrow-style impossibility results but incurs new informational burdens. It must specify the *degree* of comparability required for the desired possibility result (e.g., Utilitarianism requires full level and unit comparability; Rawlsian Maximin requires only level comparability).
  *   **Case:** If the authority wants to maximize total health benefit (Utilitarian), it needs more robust comparability than if it prioritizes the worst-off. The account must not promise a ranking method that exceeds the comparability it justifies.
  *   **Status:** **Near-Universal** among technical theorists.
  *   **Classification:** **Non-Negotiable.**

  **6. The Empirical Constraint (Adaptation and Response Shift)**
  *   **Requirement:** The account must accommodate hedonic adaptation and response shift (recalibration of expectations) without dismissing self-reports as simply "false." It must explain how a depressed patient's "7/10" might represent a different objective state than a healthy person's "7/10."
  *   **Case:** The disability paradox. If the depressed patient reports high welfare due to recalibrated expectations, but the clinician observes low functioning, the account must explain whose metric tracks "utility" for the purpose of allocation.
  *   **Status:** **Contested.** (Hedonic psychologists take reports literally; Objective List theorists override them).
  *   **Classification:** **Non-Negotiable.**

  **7. The Vignette Verdict**
  *   **Requirement:** The account must provide a verdict on anchoring vignettes (methods where respondents rate hypothetical scenarios to calibrate their scales).
  *   **Verdict:** Anchoring vignettes **stipulate** comparability; they do not discover it. They work by forcing a common origin and unit through shared description, effectively constructing a "common language" rather than revealing a pre-existing neural scale. They presuppose that the *vignette* is experienced similarly, which is an ethical/empirical assumption, not a neutral correction.
  *   **Case:** If two cultures rate "severe pain" differently in vignettes, correcting the self-report assumes the vignette meaning is stable.
  *   **Status:** **Contested.** (Economists often treat them as technical fixes; Philosophers treat them as normative stipulations).
  *   **Classification:** **Camp Preference** (Constructivist/Pragmatist view).

  **8. The Single Most Eliminating Requirement**
  *   **Requirement:** **The Formal Constraint (Affine Transformation).**
  *   **Reasoning:** Most intuitive or folk-psychological accounts fail here. They assume utility is like height (ratio scale with absolute zero). Once it is established that utility is only cardinal up to affine transformation, any account that does not explicitly propose a mechanism for fixing the zero-point and the unit across persons is mathematically incoherent for aggregation. This eliminates naive hedonism, simple self-report aggregation, and most ordinary language accounts immediately.

  ---

  ### II. The Trilemma

  Your suspicion is correct. The following three demands form an inconsistent triad:

  1.  **Factualism:** Comparability is settled entirely by non-ethical facts about individuals (e.g., neural states, behavior) carrying no ethical evaluation.
  2.  **Determinacy:** The account yields a determinate ranking sufficient for actual allocation decisions in hard cases (like depression vs. acute pain).
  3.  **Non-Error:** The account explains the divergence between first-person report and third-person observation without declaring one simply mistaken (i.e., both track valid aspects of welfare).

  **Analysis:**
  If comparability is settled by brute facts (1), and reports diverge from observation (3), then at least one measure fails to track the fact. To maintain (3), you must argue that "utility" is not a single fact but a composite. But if it is a composite, how do you weight the components to get a determinate ranking (2)? The weighting requires an ethical judgment (e.g., "experience matters more than functioning"). Therefore, (1) is false. Comparability cannot be settled *entirely* by non-ethical facts; it requires an ethical stipulation to fix the scale.

  **Resolution:**
  **Drop Leg 1 (Factualism).**
  You must accept that interpersonal comparability is partly a **normative construct**. We decide to treat certain states as comparable for the purpose of justice or policy. This does not make it arbitrary, but it acknowledges that the "common scale" is imposed by the moral framework of the authority, not discovered in the neurons. This satisfies (2) by allowing the authority to stipulate the weighting needed for a decision, and satisfies (3) by allowing both report and observation to count as evidence weighted by that normative framework.

  ---

  ### III. Evaluation of the Quietist Position (Your Friend)

  Your friend's Wittgensteinian/Quietist line is evaluated against the desiderata as follows:

  *   **Meets:** **The Phenomenological Constraint.** It explains our ordinary confidence beautifully (shared form of life). It also handles **The Truth vs. Knowability Constraint** by dissolving it (truth *is* assertibility within the practice).
  *   **Dissolves:** **The Formal Constraint.** The friend argues that demanding affine transformation fixes is a category mistake. For the friend, the "scale" is the practice itself, not a number line. This is elegant but mathematically unusable for the health authority.
  *   **Cannot Handle:** **The Determinacy Leg of the Trilemma.** Quietism works for ordinary life ("I see you are in pain"), but fails when the practice runs out ("Do we fund the depression clinic or the trauma unit?"). When the "form of life" offers no clear rule, the Quietist has no resource to generate a ranking without stepping outside quietism into normative stipulation. It also struggles with **The Vignette Verdict**, as it views vignettes as just more language games, lacking the critical leverage to say one game is "corrected" relative to another.

  ---

  ### IV. Classification of Requirements

  *   **Near-Universal:** Formal Constraint, Distinction Constraint, Consistency Constraint. (Disagreement exists on application, not on the logical necessity).
  *   **Contested:** Truth vs. Knowability (Realists vs. Anti-Realists), Empirical Constraint (Subjectivists vs. Objectivists), Vignette Verdict (Technocrats vs. Philosophers).
  *   **Non-Negotiable:** Phenomenological, Distinction, Truth/Knowability separation, Formal, Consistency, Empirical. (Without these, the account is either useless for policy or logically incoherent).
  *   **Camp Preference:** Vignette Verdict (as stated above).

  ---

  ### V. Summary of Accounts

  Realist accounts (e.g., neural hedonism) satisfy Factualism and Determinacy but fail Non-Error (they must dismiss self-reports that contradict scans). Quietist accounts satisfy Non-Error and Phenomenology but fail Determinacy (they cannot adjudicate hard cases without ceasing to be quietist). Constructivist accounts (e.g., Sen-style informational bases) satisfy Determinacy and Non-Error by dropping Factualism, admitting that comparability is a normative requirement of justice rather than a metaphysical discovery; this is the only family that survives the Trilemma intact for policy purposes.
