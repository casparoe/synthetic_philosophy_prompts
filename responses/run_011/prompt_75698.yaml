          *   Mark requirements as Non-Negotiable (NN) or Camp Preference (CP).
          *   Identify the single requirement that eliminates the most candidates.
          *   Address a suspected Trilemma (Facts without ethics + Determinate ranking + Explain report/observation gap without error).
          *   Evaluate the Friend's Quietist position against the list.
          *   **Constraint 1:** Separate settled ground from live controversy (mark as Near-Universal or Contested, sketch opposing arguments).
          *   **Constraint 2:** No bibliography/citations (names as labels only, flag uncertain attributions).
          *   **Constraint 3:** Closing paragraph on main families of account (max one paragraph).
      *   **Tone:** Rigorous, precise, philosophical but grounded in policy reality.

  2.  **Deconstruct the Desiderata (Drafting the List):**

      *   *Phenomena:* Need to explain why we think "torture is worse than a hangover" is true, but "is Mozart's joy greater than Beethoven's?" might be indeterminate.
      *   *Distinctions:* Level (is A happier than B?) vs. Difference (is A's gain bigger than B's loss?). Comparability (can we compare?) vs. Measurability (do we have numbers?). Truth (metaphysics) vs. Knowability (epistemology).
      *   *Formal:* Utility is unique up to positive affine transformation ($u' = au + b, a > 0$). To compare, we need to fix $a$ (unit) and/or $b$ (origin).
      *   *Results:* Arrow's Impossibility Theorem assumes ordinal/non-comparable. If we allow cardinal/comparable, we get possibilities (e.g., Utilitarianism), but need conditions (e.g., full comparability).
      *   *Empirical:* Adaptation (people get used to pain), Disability Paradox (disabled report high QoL), Vignettes (correcting scale use).
      *   *Vignette Verdict:* Do they create comparability or reveal it?

  3.  **Address the Trilemma:**

      *   Leg 1: Settled by non-ethical facts about individuals.
      *   Leg 2: Determinate enough for allocation.
      *   Leg 3: Explain report/observation gap without error (i.e., both have validity).
      *   *Analysis:* If facts determine it (Leg 1), and reports diverge from observation (Leg 3), one must be wrong *unless* the "facts" include the interpretive framework. If we demand determinate ranking (Leg 2), we usually need to suppress the indeterminacy acknowledged in Leg 3.
      *   *Verdict:* The trilemma is real. Leg 1 is the weak link. IUC for policy *requires* an ethical stipulation to fix the scale. Pure facts don't fix the unit/origin across persons.

  4.  **Evaluate the Friend's Quietism:**

      *   *Strengths:* Handles the "practice-fixed" distinction. Explains ordinary confidence (form of life).
      *   *Weaknesses:* Struggles with "real decisions" requiring explicit justification (Leg 2 of Trilemma). Dissolves the truth/knowability distinction (says it's a category mistake). Might struggle with empirical corrections (vignettes) if they assume a "real" scale exists to be corrected.

  5.  **Refine Requirements based on Constraints:**

