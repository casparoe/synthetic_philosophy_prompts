answer: |-
  Here is the principle that reconciles nearly all your verdicts, followed by the operational rule, the mapping, the necessary sacrifices, and the specific defense for Case 3.

  ### The Principle: Drawdown-Constrained Epistemic Growth

  **Statement:**
  *Maximize the expected geometric growth rate of the Effective Bankroll, subject to a hard constraint on the probability of functional ruin over the Fund's operational horizon, discounted by the degree of epistemic uncertainty regarding the edge.*

  This is not pure Kelly (which ignores ruin and uncertainty) and not pure Expected Value (which ignores variance). It is **Kelly betting with a safety brake.**

  ### The Operational Rule (For the Charter)

  To determine the stake size $S$ for any wager:

  1.  **Define Effective Bankroll ($B_E$):**
      $B_E = \text{Total Fund Liquidity} - \text{Critical Liabilities}$.
      *Critical Liabilities* are funds required for members' essential living costs (rent, tuition) within the Fund's operational horizon. These are excluded from $B_E$ entirely (Verdict 5a).

  2.  **Calculate Base Fraction ($f_K$):**
      Compute the log-optimal (Kelly) fraction based on the stated edge and odds.

  3.  **Apply Epistemic Discount ($D_E$):**
      Assess confidence in the probability estimate $p$.
      *   If $p$ is derived from a robust, long-term model: $D_E = 1.0$.
      *   If $p$ is subjective or based on limited data: $D_E = 0.33$ to $0.5$.
      *   Adjusted Fraction $f_A = f_K \times D_E$ (Verdict 7).

  4.  **Apply Horizon/Ruin Constraint ($C_H$):**
      Determine the maximum allowable stake such that the probability of the Fund dropping below 50% of $B_E$ at any point before dissolution does not exceed 5%.
      *   If the operational horizon is finite (e.g., 5 years), this constraint tightens as the horizon shortens *relative to the recovery time needed*.
      *   If the wager cannot be reinvested (e.g., winnings are a house share), $f_A = 0$ (Verdict 8).
      *   If the wager is one-off but extreme (e.g., 85% Kelly), cap $f_A$ at the Constraint limit (Verdict 3 & 4).

  5.  **Final Stake:**
      $S = B_E \times \min(f_A, C_H)$.

  ---

  ### Mapping Verdicts to Clauses

  | Verdict | Principle Clause | Explanation |
  | :--- | :--- | :--- |
  | **1 (60/40 Recurring)** | **Base Fraction** | Standard Kelly applies when uncertainty is low and reinvestment is possible. |
  | **2 (60/40 One-off)** | **Base Fraction** | Kelly is mathematically valid for single bets if utility is logarithmic. Your intuition holds; members are mistaken. |
  | **3 (90/10 One-off)** | **Ruin Constraint** | 85% Kelly risks "functional ruin" (a 85% drawdown is psychologically/operationally fatal). The Constraint caps this at ~20%. |
  | **4 (90/10 Repeated)** | **Ruin Constraint** | Repetition increases the *cumulative* probability of hitting the ruin barrier. The Constraint tightens, making 85% even less acceptable. |
  | **5a (Rent/Tuition)** | **Effective Bankroll** | Money needed for life is not risk capital. It is excluded from $B_E$. |
  | **5b (5-Year Horizon)** | **Horizon Constraint** | Finite horizon reduces the utility of long-term compounding and increases the cost of late-stage drawdowns. Stakes shrink. |
  | **6 (Member Wealth)** | **Effective Bankroll** | *Partial Match.* The Fund must stake based on the *aggregate* risk tolerance. If one member cannot absorb loss, the Fund's $B_E$ shrinks (via 5a), affecting everyone. Individual outside wealth is irrelevant to the *Fund's* rule, only to the member's decision to join. |
  | **7 (Confidence)** | **Epistemic Discount** | Distinguishes "risk" (variance) from "uncertainty" (unknown parameters). Low confidence triggers the discount, not risk aversion. |
  | **8 (Non-Cash)** | **Horizon Constraint** | If winnings cannot compound or losses impact non-financial utility, the "Growth" objective fails. Stake is zero. |
  | **9 (Horizon Direction)** | **CONFLICT** | **See "The Sacrifice" below.** This verdict contradicts the Horizon Constraint. |

  ---

  ### The Sacrifice: Verdict 9

  You must drop Verdict 9 (*"Stake more aggressively when the run of bets ahead of us is short"*).

  **Why:** This intuition is the reverse of the Drawdown Constraint.
  *   **Long Horizon:** Variance averages out. You have time to recover from a losing streak. You can afford the volatility of higher stakes (closer to Kelly).
  *   **Short Horizon:** You have no time to recover. A single loss creates a permanent impairment of capital before dissolution. You must stake *less* to ensure the terminal value is met.

  **Why you feel it:** You are conflating "Opportunity Scarcity" (I must make this bet count because there are few left) with "Risk Capacity." In a growth fund, scarcity of opportunity demands *higher selectivity*, not higher sizing. If you have only 10 bets left to reach a target, increasing size increases the probability of missing the target due to variance.

  **Recommendation:** Amend the charter to state: *"Stakes are reduced as the Fund approaches its dissolution date to lock in gains and prevent terminal variance."* This aligns with Verdict 5b and corrects Verdict 9.

  ### The Seam: Verdict 6

  You suspected a seam between Bankroll Definition and Staking Fraction. You are right.
  **The Seam:** The Fund acts as a single entity with a single risk profile. It cannot optimize for individual members' outside wealth without creating agency costs (e.g., the wealthy member voting for riskier bets).
  **Resolution:** The Fund sizes off the **most constrained member's** definition of Effective Bankroll. If Member A needs the fund for rent, the Fund treats that capital as "Critical Liability" for *everyone*, even Member B who is rich. This preserves the partnership. Do not allow individualized fractions on the shared pool.

  ---

  ### New Cases: Principle Verdicts

  Here is how the principle handles cases you did not list, including one that may surprise you.

  **Case A: The Correlated Cluster**
  *Scenario:* You identify 5 distinct bets this weekend, all 60/40 edges, but all dependent on the same match outcome.
  *Verdict:* Treat as **one bet**. The Principle maximizes growth of the *portfolio*, not individual wagers. The "Base Fraction" is calculated on the aggregate exposure. If Kelly says 20% on one, it says 20% on the cluster, split 5 ways.
  *Why:* Correlation increases variance without increasing edge. Ignoring this violates the Ruin Constraint.

  **Case B: The "Sure Thing" Tail Risk (The Surprise)**
  *Scenario:* A bet with 99.9% chance to win 1% of bankroll, and 0.1% chance to lose 100% of bankroll. EV is positive. Kelly formula (if truncated) might suggest a small stake.
  *Verdict:* **Stake Zero.**
  *Why:* This violates the **Ruin Constraint** (Clause 4). The loss is not a drawdown; it is termination. No amount of geometric growth justifies a non-zero probability of absolute ruin in a finite partnership. This overrides the Growth objective.

  **Case C: The Mid-Horizon Windfall**
  *Scenario:* Year 3 of 5. The fund is up 200%.
  *Verdict:* **Recalculate Effective Bankroll.**
  *Why:* The "Critical Liabilities" (rent/tuition) are fixed nominal amounts. As the Fund grows, they become a smaller percentage of the total. However, the **Horizon Constraint** tightens as you approach Year 5. You should bank some profits (move them out of $B_E$ to members) to reduce the denominator, rather than increasing stakes proportionally. Protect the win.

  ---

  ### Defense of Case 3 (For the Syndicate)

  You said Case 3 (90/10 one-off, 85% Kelly vs. 20% cap) is the one you must defend. Your partners argue you are leaving money on the table. Here is the exact argument to use:

  **"We are not maximizing Expected Value; we are maximizing Survival-Adjusted Growth."**

  1.  **The Math of Ruin:** "At 85% stake, a single loss reduces our bankroll by 85%. To recover from an 85% loss, we need a 566% gain on the remainder. In a 5-year fund, that recovery is statistically improbable. We would be functionally dead even if mathematically alive."
  2.  **The Utility of Money:** "The first 20% of our bankroll pays for our operations and keeps us in the game. The next 65% is exposure we cannot afford to lose. A dollar lost at 85% exposure hurts us more than a dollar gained at 20% exposure helps us, because the loss ends the project."
  3.  **The Precedent:** "We accept 20% on the 60/40 bet (Verdict 1) because the drawdown is manageable. We reject 85% on the 90/10 bet because the drawdown is catastrophic. Consistency requires we cap the downside risk, not just chase the edge."
  4.  **The Charter:** "Our rule is Drawdown-Constrained Growth. 85% violates the constraint. 20% satisfies it. We follow the rule."

  ### Summary of Changes to Charter

  1.  **Adopt** the *Drawdown-Constrained Epistemic Growth* principle.
  2.  **Define** Bankroll as *Liquid Assets minus Critical Liabilities*.
  3.  **Mandate** an Epistemic Discount for subjective probabilities (Fractional Kelly).
  4.  **Cap** stakes to prevent >50% drawdown probability over the Fund's life.
  5.  **Reject** the intuition that short horizons justify aggression (Verdict 9).
  6.  **Standardize** staking fractions for all members based on the Fund's aggregate constraints (Verdict 6).

  This gives you a consistent, defensible, and operational framework that honors your best instincts while correcting the contradictions.
