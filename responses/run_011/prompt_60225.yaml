  2.  **Source of Norms:** Was the *criterion for success* (the fitness function) assigned by a human designer, or did it emerge intrinsically from the requirement to replicate/survive? (If human-assigned → **Derived**).
  3.  **Specificity:** Was the specific *content* of the state (what it tracks) explicitly programmed or rewarded by a designer, or did it emerge as a side-effect of solving the replication problem? (If programmed/rewarded → **Derived**).

  If it passes all three (History + Intrinsic Norms + Emergent Content), it has **Original Intentionality**.

