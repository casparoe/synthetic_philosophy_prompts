prompt: |-
  So my uncle and my flatmate said the exact same sentence at a family dinner last month and used it to mean opposite things, and I've been trying to work out whether they were even arguing about the same claim. The sentence was "we're hardwired for God" — my uncle puts it slightly differently each time, sometimes "religion is hardwired into us", sometimes "the brain is built for belief", but it's always that shape.

  He's a practising evangelical and for him it's a piece of evidence: every culture ends up with gods, and children who've never been taught anything come up with them on their own, so we must have been built by something in order to be in contact with it. He says its basically the old Calvin idea that God plants a sense of himself in everyone, just with brain science bolted on. My flatmate is a very loud atheist and he uses the same words as a dismissal: religion is a misfiring of whatever module detects agents behind rustling grass, so belief explains itself without any of it having to be true.

  Can you take that one slogan apart for me? I want the distinct precise claims it could be making, laid out as a numbered menu rather than an essay — and I think the ambiguity is definately in both halves, not just one. "Hardwired" could mean loads of different things (present at birth? universal? inevitable given any normal upbringing? merely easy to pick up once you're exposed? an actual evolved adaptation as opposed to a byproduct of something that was selected for?) and "for God" is doing its own separate work, since God, religion, supernatural agents generally, and just thinking about the world in terms of purposes are not the same target.

  For each reading I want a verdict attached: is it a platitude nobody should resist, an empirical claim that's actually well supported, or is it false or at least way overclaimed? And then the bit I care about most — which readings would actually get my uncle his conclusion, and which would get my flatmate his. My suspicion is that no single reading does both jobs, and that some of the readings that do one of them actively undercut the other; if that's right I want to know exactly where the undercutting happens.

  Two extra things while you're in there. First, is either of them just committing a genetic fallacy, or is there a version of the hardwiring claim that isn't one? Second, my flatmate got annoyed when I suggested that if our belief-forming equipment was shaped for surviving rather than for getting things right, that worry lands on his naturalism too — tell me whether he's right to be annoyed or whether I've actually got something there.

  Please write the whole answer in British English, and don't bother with references or suggested further reading, I just want the menu with the verdicts on it.
