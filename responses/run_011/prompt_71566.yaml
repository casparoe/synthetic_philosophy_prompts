  ### The Case of the Landlord and the Winter Bill

  **Setting:** Elena manages a small apartment building in a cold climate. She has owned it for five years.

  **The Hypothesis ($H$):** "There is a slow leak in the main water supply line beneath the foundation."
  Elena has entertained this hypothesis for three years. Whenever the water bill spikes, she thinks, "It could be a leak." She has never ruled it out, nor fully accepted it. Her credence in $H$ has remained stable at $P(H) = 0.4$. The content of $H$ has not changed; it is the same physical claim she considered three years ago.

  **The Evidence ($E$):** "The water bill for January 2023 is significantly higher than the baseline."
  Elena received this bill two months ago. She has filed it. She knows it is true. She assigns it credence $P(E) = 1$. She has known this fact continuously since receipt.

  **The Entailment:** Elena has long known that if there is a leak in the main line ($H$), the water bill *must* be high ($E$). She understands the plumbing. She knows $H \to E$. This is not a new discovery; she has always acknowledged that a leak would explain the bill.

  **The Trigger:** For years, Elena treated the high bill as a "sunk fact" of winter living. She told herself, "Old pipes, cold ground, bills are always high in January; it's just how it is." She lumped $E$ into a category of *Background Noise*.
  Today, while reviewing her annual budget, she makes a cognitive shift. She decides to stop treating $E$ as background noise and starts treating $E$ as a *Test*. She tells herself: "I am no longer going to assume high bills are normal. I am going to treat this bill as data that bears on the leak hypothesis." She does not learn any new fact about the bill, the pipes, or the weather. She does not recall any forgotten memory. She simply changes her *stance* toward the evidence she already possesses. She actively *uses* $E$ to evaluate $H$, whereas before she merely registered $E$ alongside $H$.

  **The Intuition:** Despite knowing $E$ all along, and knowing $H \to E$ all along, there is a strong intuitive pull that Elena is now *right* to increase her credence in $H$. By taking the evidence seriously—by refusing to dismiss it as "just winter"—it feels as though the old evidence now exerts a confirmatory pressure it previously lacked. The intuition is that $P(H)$ *ought* to rise, simply because she has finally attended to the evidential relationship properly.

  ***

  ### 1. Bookkeeping and Formal Analysis

  **Propositions:**
  *   $H$: There is a leak in the main line.
  *   $E$: The January water bill is high.
  *   $K$: Background knowledge (plumbing physics, climate, building age).

  **Priors (Pre-Trigger):**
  *   $P(H) = 0.4$
  *   $P(E) = 1$ (Condition 3)
  *   $P(E|H) = 1$ (Condition 4, $H$ entails $E$)

  **The Update:**
  Elena undergoes the "Trigger" (the shift in stance). No new proposition $X$ is added to her knowledge base. $H$, $E$, and $H \to E$ remain unchanged.

  **Strict Conditionalization:**
  Bayesian conditionalization updates credence via $P_{new}(H) = P_{old}(H|E)$.
  $$P_{old}(H|E) = \frac{P_{old}(E|H) \cdot P_{old}(H)}{P_{old}(E)}$$
  Substituting the values:
  $$P_{old}(H|E) = \frac{1 \cdot 0.4}{1} = 0.4$$
  **Result:** $P_{new}(H) = 0.4$. Strict conditionalization leaves the credence untouched. The "Trigger" generates no formal update because no probability value changed.

  **Jeffrey Conditionalization:**
  Jeffrey conditionalization applies when the evidence $E$ is not learned with certainty, but its probability shifts ($P_{old}(E) \to P_{new}(E)$).
  Here, Condition 3 stipulates $P(E) = 1$ before, during, and after. There is no partition $\{E, \neg E\}$ whose probabilities shift.
  **Result:** Jeffrey conditionalization has no purchase. There is no input shift to propagate.

  **The Contradiction:**
  Conditions 3 ($P(E)=1$), 4 ($P(E|H)=1$), and 6 (Intuition that $P(H)$ ought to rise) are **jointly unsatisfiable** for a probabilistically coherent agent.
  *Proof:* If $P(E)=1$, then $P(E \land \neg H) + P(E \land H) = 1$. Since $H \to E$, $P(E \land H) = P(H)$. Thus $P(E \land \neg H) = 1 - P(H) = P(\neg H)$. This implies $P(E|\neg H) = 1$. If $P(E|H)=1$ and $P(E|\neg H)=1$, then $E$ provides no likelihood ratio support for $H$. The intuition in Condition 6 requires $P(E|\neg H) < 1$, which contradicts $P(E)=1$ (given $P(H)<1$).

  ***

  ### 2. Verdicts of Standard Responses

  **A. The Erasure/Abstraction Strategy (Glymour):**
  *Strategy:* Construct a counterfactual probability function $P^*$ where $E$ is not in the evidence base (or $P^*(E) < 1$), conditionalize on $E$, and map the result back.
  *Verdict:* This strategy **succeeds formally but violates the case constraints.** To make it work, we must imagine a scenario where Elena *didn't* know $E$ yet. But Condition 3 and 5 forbid this. The strategy saves the intuition by essentially admitting that the real confirmation happened when $E$ was *first* learned, or by falsifying the "Old Evidence" constraint. In this specific case, where $H$ is also old, erasing $E$ leaves us with no reason to update $H$ unless we also erase the knowledge of $H \to E$.

  **B. Relaxing Logical Omniscience:**
  *Strategy:* Add a proposition $L$: "$H$ entails $E$." Treat $L$ as new information ($P(L)$ goes from $<1$ to $1$). Conditionalize on $L$.
  *Verdict:* This **fails Condition 4.** The case stipulates Elena has "long known" the entailment. To use this response, we must claim she didn't *really* know it (she was logically non-omniscient). While psychologically realistic, it contradicts the explicit setup of the thought experiment. If we enforce Condition 4, this response is unavailable.

  **C. The Deflationary Reply ($P(E) < 1$):**
  *Strategy:* Argue that no empirical evidence ever has credence exactly 1. If we lower $P(E)$ to $0.99$, confirmation becomes possible.
  *Verdict:* This **fails Condition 3.** The case stipulates $P(E)=1$. However, this response identifies the source of the intuition: humans do not actually treat old evidence as probability 1 in their reasoning engines. We treat it as *highly probable but contingent*. The intuition that $H$ is confirmed relies on the implicit thought, "If $H$ were false, $E$ might not have happened." This counterfactual is incompatible with $P(E)=1$.

  ***

  ### 3. The Working Feature and Removal Test

  **The Working Feature:** **Explanatory Exclusivity.**
  The intuitive force of the case comes from Elena's shift in treating $E$ as *exclusive* to $H$ in her mind, even if she knows logically it isn't. She moves from "High bills happen in winter (many causes)" to "This high bill is a sign of a leak (focusing on one cause)." The trigger is the **suppression of alternative explanations** for $E$ without empirical justification.

  **Removal Test:**
  If we remove the "Explanatory Exclusivity" (i.e., she acknowledges that high bills are equally likely under $\neg H$ due to winter rates), the intuition of confirmation vanishes.
  *   *Does putting the novelty of the hypothesis back collapse this to the standard astronomical case?*
      *   No. In the standard POE (e.g., Einstein and Mercury), $H$ is new. Here $H$ is old.
      *   If we make $H$ new (Elena just thought of the leak hypothesis today), the case becomes the standard POE. The "Trigger" would then be the discovery of $H$, and the confirmation comes from $H$'s ability to predict known $E$.
      *   In *this* case, since $H$ is old, the confirmation intuition cannot come from $H$'s predictive success (which was already known). It must come from the **re-weighting of rivals**. This makes it distinct from the standard POE. It is a "Problem of Old Evidence and Old Hypothesis," driven by the salience of the explanatory link rather than the discovery of the link.

  ***

  ### 4. Control Case: The Summer Bill

  **Scenario:** Same building, same Elena.
  **Hypothesis ($H$):** "There is a leak in the main line." (Credence 0.4).
  **Evidence ($E_{summer}$):** "The water bill for July 2023 is high."
  **Conditions:**
  *   $E_{summer}$ is known ($P=1$).
  *   $H \to E_{summer}$ is known (Leaks cause high bills in summer too).
  *   No new info.
  *   **Crucial Difference:** Elena knows that in July, high bills are *common* even without leaks (tenants water gardens, fill pools). She treats $E_{summer}$ as "Background Noise" and continues to do so.

  **Verdict:** The intuitive judgment here is that $E_{summer}$ does **not** confirm $H$.
  **Distinction:** The difference lies in the **Likelihood Ratio** intuition. In the Winter case, the agent feels $P(E|H) \gg P(E|\neg H)$. In the Summer case, she feels $P(E|H) \approx P(E|\neg H)$.
  **Formal Representation:** None of the three responses above can represent this difference *given the constraints*.
  *   If $P(E)=1$ in both cases, and $P(E|H)=1$ in both cases, then formally $P(E|\neg H)=1$ in both cases.
  *   The formalism cannot distinguish the "Winter" case (intuition: confirm) from the "Summer" case (intuition: no confirm) without violating Condition 3 ($P(E)=1$) or Condition 4 (Known Entailment implies known likelihoods).
  *   This proves the intuition in the Winter case relies on a covert violation of the probability axioms (specifically, treating a certain event as if it were contingent).

  ***

  ### 5. The Strongest Bayesian Attack

  **The Attack:** **The Rigidity of Certainty.**
  A strict Bayesian argues: "If Elena assigns $P(E)=1$, she has ruled out the possibility of $\neg E$. If she has ruled out $\neg E$, she cannot coherently believe that $\neg H$ makes $\neg E$ probable. To feel confirmation, she must be implicitly thinking, 'If $H$ were false, $E$ might have been false.' But this thought is logically incompatible with $P(E)=1$. Therefore, her intuition that $P(H)$ ought to rise is a cognitive illusion caused by her failure to maintain coherence between her certainty in $E$ and her conditional probabilities. There is no problem of old evidence here; there is only a problem of incoherent agents."

  **Does the Attack Succeed?**
  **Yes, formally.** The attack succeeds in showing that the case as constructed (Conditions 3, 4, and 6) describes an impossible state for a rational agent.
  **However,** as a seminar tool, the case succeeds in a different way: it demonstrates that **human confirmation judgments are not sensitive to $P(E)=1$ in the way Bayesian formalism requires.** We feel confirmation from old evidence because we *counterfactually* lower $P(E)$ in our reasoning, even if we nominally accept $E$ as true. The case isolates the "Old Hypothesis" variable to show that the POE is not just about new theories, but about the **activation of explanatory relevance**. The Bayesian attack wins on normativity, but the thought experiment wins on descriptive psychology.

  **Conclusion on Satisfiability:**
  The six conditions are **jointly unsatisfiable** for a coherent agent. Condition 6 (Intuition of confirmation) requires $P(E|\neg H) < 1$. Condition 3 ($P(E)=1$) combined with Condition 4 ($P(E|H)=1$) and $P(H)<1$ requires $P(E|\neg H) = 1$. The contradiction arises in the probability calculus itself. The value of the case is not that it solves the POE, but that it forces the student to choose between the formal constraint ($P(E)=1$) and the intuitive judgment (Confirmation), revealing that the "Problem of Old Evidence" is ultimately a problem of **idealization**.
