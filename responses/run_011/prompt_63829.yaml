answer: |-
  **Project Title:** Diachronic Stability and Act-Individuation in Risk-Weighted Expected Utility Theory

  **Project Summary**
  Risk-weighted expected utility (RWEU) theory offers the most promising normative alternative to standard expected utility (EU) for capturing rational risk attitudes, particularly in light of Allais-style preferences. However, RWEU faces a severe diachronic objection: agents employing rank-dependent weighting appear dynamically inconsistent, planning one course of action ex ante but preferring to reverse course ex post once uncertainty partially resolves. Standard responses argue that avoiding this inconsistency requires commitment strategies that effectively collapse RWEU back into standard EU, negating its theoretical value. This project challenges that diagnosis. I propose that the instability does not stem from the risk-weighting function itself, but from the non-additive nature of rank-dependent valuation and the consequent sensitivity to act-individuation. Over ten weeks, I will construct formal models to demonstrate that a rank-dependent agent can maintain diachronic stability without collapsing into EU, provided the decision problem is individuated correctly. Furthermore, I will investigate whether RWEU violates the reduction of compound lotteries, using this violation not as a bug, but as a feature that fixes the relevant description of the choice problem.

  **The Research Question**
  The central question is whether the diachronic instability attributed to RWEU is a substantive flaw in the theory's account of risk, or an artifact of misidentifying the object of choice. The "Collapse Objection" posits that a rational agent must be dynamically consistent. Since RWEU agents often violate dynamic consistency in standard formulations of sequential choice, critics argue they are irrational or must pre-commit. If they pre-commit, their behavior mimics EU maximizers, rendering RWEU normatively redundant.

  Existing replies, such as those offered by Buchak, concede the inconsistency but argue that planning norms can manage it. This concession is too costly. It accepts the critic's framing that the instability is real and must be managed externally. My hypothesis is that the instability is illusory, arising because RWEU valuations are non-additive across partitions of a gamble. In EU, the value of a gamble is the sum of the values of its branches. In RWEU, the value of a branch depends on its rank relative to other branches. Therefore, splitting a decision into temporal stages changes the ranking structure, altering the valuation. If we treat the temporally extended sequence as a single act—properly individuated—the agent's preferences remain stable.

  A secondary, contingent hypothesis concerns the reduction of compound lotteries. In EU, a two-stage gamble is equivalent to its single-stage mathematical reduction. In RWEU, this equivalence holds only if the risk function has a specific shape. If this equivalence fails generally, then the "same" choice problem described as a sequence versus a single shot is not actually the same problem for the RWEU agent. This project asks: *Can a precise account of act-individuation and compound lottery reduction rescue RWEU from the Collapse Objection without abandoning its core insights?*

  **Methodology and Work Plan**
  This project is primarily formal and conceptual. I will use logical modeling to reconstruct diachronic choice problems within an RWEU framework, testing for stability under different individuation schemes.

  *Weeks 1-2: Formal Reconstruction.* I will formalize the standard diachronic counterexamples used in the literature (e.g., the sequential Allais cases). I will define the RWEU functional explicitly, isolating the risk function $r(p)$ from the utility function $u(x)$. The goal is to reproduce the instability result to understand exactly where the preference reversal enters the calculation.

  *Weeks 3-5: Modeling Act-Individuation.* I will construct toy models where the "act" is defined not by the temporal stage but by the full contingent plan. I will test whether assigning value to the complete strategy (ex ante) yields the same ranking as evaluating the sub-nodes (ex post), provided the ex post evaluation respects the original ranking context. This involves defining a "context-sensitive" valuation rule where the rank of an outcome is fixed by the initial gamble structure, even at later nodes. I will determine if this preserves dynamic consistency.

  *Weeks 6-7: The Compound Lottery Wedge.* I will investigate the reduction axiom. I will calculate the RWEU value of a two-stage gamble versus its reduced single-stage equivalent across different risk functions (concave, convex, linear). I aim to prove that for any non-linear risk function, reduction fails. This establishes that the temporal structure of the gamble is normatively significant, not just descriptively.

  *Weeks 8-9: Synthesis and Normative Implications.* I will combine the results. If act-individuation fixes the stability issue, and reduction failure justifies treating sequential gambles as distinct from single-stage ones, the Collapse Objection loses its force. I will draft the argument showing that the demand for dynamic consistency presupposes an EU-specific view of act-individuation (additivity) that RWEU rejects.

  *Week 10: Final Write-Up.* I will compile the models and arguments into a draft paper suitable for submission to a journal in decision theory or philosophy of science.

  **Expected Outcomes and Success Conditions**
  A **positive result** consists of a formal proof that an RWEU agent, adhering to a specific rule of act-individuation (treating the full strategy as the object of choice) and acknowledging the non-equivalence of compound lotteries, exhibits no preference reversal in sequential choice problems. This would show that RWEU is a viable diachronic theory without needing external commitment devices.

  A **negative result** would demonstrate that even with holistic act-individuation, preference reversals persist solely due to the curvature of the risk function. This would be a significant philosophical finding, as it would clarify that the cost of RWEU is indeed diachronic instability, forcing a choice between risk-sensitivity and dynamic consistency.

  The project would be **inconclusive** if the required act-individuation rules turn out to be so ad hoc that they render the theory unguided or trivial. For example, if "correct" individuation simply means "individuate however makes you consistent," the theory loses predictive power. I will assess this by checking if the individuation rules can be stated independently of the desired outcome.

  **Feasibility and Scope**
  Ten weeks is sufficient for the formal modeling and the initial philosophical argument, but it is tight for a comprehensive defense against all variants of the Collapse Objection. The risk lies in the complexity of the counter-examples; some diachronic puzzles involve information structures that complicate the ranking mechanism.

  If time becomes constrained, I will prioritize the **Compound Lottery Wedge** (Weeks 6-7). This is the sharper technical point. Even if the act-individuation argument remains provisional, demonstrating that RWEU formally violates the reduction of compound lotteries provides a robust wedge against the claim that RWEU collapses into EU. It shows that the "same" decision problem is not the same for both theories. I would cut the broader normative discussion on planning norms to focus on this formal divergence.

  This project is feasible because it builds on existing formalisms rather than creating new ones from scratch. The innovation lies in the application of these formalisms to the specific problem of act-individuation. By shifting the debate from "risk attitudes are irrational" to "decision problems are being misdescribed," this research aims to secure a stable foundation for risk-weighted theories of rational choice.
