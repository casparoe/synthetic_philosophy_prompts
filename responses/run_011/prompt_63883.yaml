      *   **The Complication:** Hydrologist suspects spring-fed fen + state-listed mollusk. Formal survey = 8 weeks, $18k.
      *   **The Catch:** Survey needs 60-day extension from family. Extension requires $40k deposit (forfeitable). Total cost if surveying = $18k + potential $40k risk.
