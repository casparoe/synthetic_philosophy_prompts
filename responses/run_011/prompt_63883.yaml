              *   *Survey:* Can't buy blind. Better to know. Bylaws say don't act against conservation purpose (knowingly).
      *   **New Developments:** Reporter asking about assessment (rumor circulating). Builder asked for extension on their offer.
      *   **Requirements:**
          *   Recommend concrete course of action (dates, amounts, survey, deposit, extension, vote).
          *   Give arguable reasons + explicit conditions for being wrong.
