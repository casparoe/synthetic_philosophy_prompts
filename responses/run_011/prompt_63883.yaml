answer: |-
  **MEMORANDUM**

  **TO:** Board of Trustees
  **FROM:** Vice Chair
  **DATE:** October 3
  **SUBJECT:** Recommendation on Riverside Woodland Acquisition and Survey

  In three weeks, we must decide whether to exercise our right of first refusal on the 410-acre Riverside Woodland property. The offer expires in seventy-five days. We have a funding gap, a tight timeline, and a significant ecological uncertainty regarding a potential spring-fed fen and listed mollusk on the north parcel.

  After reviewing the options with staff and considering the recent inquiry from the county weekly, I recommend the following course of action:

  1.  **At the meeting in three weeks (October 24), vote to authorize a $40,000 deposit** to secure a sixty-day extension from the owning family.
  2.  **Immediately commission the formal hydrological survey** at a cost of $18,000 upon securing the extension.
  3.  **Condition the final closing vote** on the survey results and a revised management plan that accounts for those results.

  This path commits $58,000 and extends our decision deadline by two months. It is not the cheapest option, but it is the only one that protects the trust from reputational damage and legal liability.

  **The Reasoning**

  I know many of you believe the survey is unnecessary. The strongest argument against this recommendation is that the board's intent is already fixed: two trustees have stated they will vote to purchase regardless of the survey to prevent subdivision, and another prioritizes the trail access above all. If the vote count does not change, why spend $58,000 and risk losing the deposit? Furthermore, if the survey confirms the fen, state rules will likely force us to close public access. This would undermine the membership drive and alienate major donors who support us specifically for community access. From this view, the survey buys us nothing but expense and restricted land.

  This is a valid concern. Losing access would be a significant blow to our mission as we currently define it. However, this calculation relies on a condition that no longer exists: plausible deniability.

  Two days ago, a reporter asked if we had assessed the site for wetlands. The rumor of the fen is already in the public sphere. If we decline the survey, purchase the land, and the mollusk is subsequently discovered—by the state, a neighbor, or that same reporter—we cannot claim ignorance. We were told by a hydrologist there was a high probability. To proceed without verification would look like we intentionally bypassed conservation protocols to keep trails open.

  If that happens, the state may revoke the provisional $690,000 grant for non-compliance. Worse, our donors may leave not because the trails closed, but because they feel misled. They fund conservation; if they perceive we prioritized recreation over protected species to save money, trust evaporates. The survey costs $58,000; a scandal costs the organization.

  **When This Recommendation Is Wrong**

  I want to be explicit about the conditions under which this advice would be mistaken. I am wrong if:

  1.  **The rumor is false and the deposit is forfeited.** If we pay the $40,000, the family sells to the builder anyway, and the fen never existed, we have wasted funds that could have acquired other land.
  2.  **The grant is secure regardless.** If we have confirmed verbally with the state agency that they will not require a management plan change unless *we* submit positive data, then the risk of buying blind is lower. (My current understanding is that grant terms require reporting known habitat issues, and "known" includes credible evidence provided to the board.)
  3.  **The access donors prefer risk to closure.** If our largest donors privately confirm they would rather we take the risk of a future scandal than guarantee trail closures now, then the survey undermines their wishes.

  If any of these are true, we should skip the survey, save the money, and vote to purchase as-is.

  **Addressing the Media**

  Regarding the reporter from the county weekly: do not confirm or deny the specific ecological suspicion. Our standard position is: *"The trust is conducting standard due diligence on all potential acquisitions to ensure they meet state conservation criteria and grant requirements. We do not comment on specific findings until a transaction is complete."*

  The fact that the rumor is circulating actually strengthens the case for the survey. If we say we are doing "standard due diligence," we must actually do it. If we decline the survey and the story runs headlining "Trust Ignores Habitat Concerns to Build Trails," we lose. If we commission the survey, we can demonstrate we are following the rules, regardless of the outcome.

  **A Standing Rule for Future Acquisitions**

  This situation highlights a gap in our process. We need a protocol for when an acquisition turns on a fact we could verify but haven't yet. I propose the board adopt the following standing rule:

  *"When a credible ecological uncertainty exists that could alter management obligations or grant compliance, the trust must investigate prior to closing unless the cost of investigation exceeds 5% of the acquisition budget or the timeline makes it impossible. If investigation is waived, the board must document the specific reason why the risk was accepted."*

  This prevents us from relying on "ignorance" as a strategy. It forces us to weigh the cost of knowledge against the cost of risk explicitly, rather than in the heat of a specific deal.

  **Next Steps**

  Please review the attached budget revision reflecting the $58,000 due diligence cost. At the October 24 meeting, I will move to authorize the deposit and extension request. We have seventy-five days before the offer lapses; this plan ensures we do not rush a permanent decision based on incomplete information.

  Thank you for your continued service and hard thinking on this complex file.
