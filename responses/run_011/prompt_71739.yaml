prompt: |-
  I sit on the ethics committee of my university's teaching hospital, and we have been asked to review the brief-intervention protocol governing how clinicians talk with patients about behavior change: tobacco, alcohol, medication adherence, opioid tapering. The protocol is built on motivational interviewing. In outline, clinicians are trained not to argue for the change, not to recite risks or statistics the patient has not asked about, and not to treat patient pushback as an obstacle to be overcome but as a signal to change tactics. The documented aim is to elicit and reflect back the patient's own avowals in favor of change — what the training literature calls change talk — on the working assumption that a patient moved by reasons she articulates herself sustains the change longer than one persuaded by the clinician's. The same institution, however, runs informed consent and patient education on something close to the opposite principle: a patient who has been given accurate risk information and remains unmoved is recorded as non-adherent, the remedy is more information restated more forcefully, and the clinician's instinct to correct the patient is treated there as a professional duty rather than a reflex to be suppressed.

  I want a philosophical reconstruction of what each practice presupposes about practical reasons, not a description of either. Does the counseling practice presuppose internalism, and if so which version: the crude one on which a reason must attach to some existing element of the agent's motivational set, or the Williams-style one on which it suffices that the agent would be moved after a sound deliberative route from that set? The difference is not academic here, since evocation looks like an attempt to run that deliberation on the patient's behalf. Does the consent practice presuppose externalism, or only a thesis about how information produces motivation? Can one institution house both without incoherence, or is there a real contradiction about whose reasons count and when — and if the latter, which practice has to give?

  Then consider the deflationary reading on which neither practice is committed to anything in the metaphysics of reasons, both being applied claims about what causally works — reactance, rapport, self-perception — and tell me whether that reading is genuinely available or whether it concedes the interesting question. Finally, the protocol fixes the target behavior before the conversation begins. Does evoking a patient's reasons toward an end the clinician has already chosen amount to manufacturing internal reasons, and what does that presuppose about whether reasons can be produced by reflection rather than only discovered?

  Throughout, please separate what the practices strictly entail from what they merely sit comfortably with, mark the places where they are underdetermined so that rival theories would license them equally, and close by saying what would have to change in the protocol's wording, and in the consent practice, were we to adopt the rival account in each case. I am after a defended reconstruction with the reasoning exposed, not a survey of the positions and not a bibliography.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**

      *   **Role:** Ethics Committee Member at a University Teaching Hospital.
      *   **Task:** Philosophical reconstruction of two conflicting clinical practices regarding practical reasons.
      *   **Practice A (Brief Intervention/MI):** Motivational Interviewing. Don't argue, don't lecture, elicit "change talk," assume self-articulated reasons sustain change better.
      *   **Practice B (Informed Consent/Education):** Provide accurate risk info. If unmoved, label "non-adherent," remedy is *more/forceful* info, clinician duty is to correct.
      *   **Core Questions:**
          1.  Does Practice A presuppose Internalism (Crude vs. Williams-style)?
          2.  Does Practice B presuppose Externalism or just a causal thesis about information?
          3.  Can the institution house both without incoherence? If contradiction, which gives?
          4.  Is a deflationary (causal/psychological) reading available, or does it concede the interesting question?
          5.  Does fixing the target behavior beforehand amount to "manufacturing" internal reasons? What does this say about reasons (discovered vs. produced)?
          6.  **Constraint:** Separate what practices *entail* vs. what they *sit comfortably with*. Mark underdetermined areas.
          7.  **Constraint:** Close with specific wording changes required if adopting the rival account.
          8.  **Style:** Defended reconstruction with reasoning exposed, not a survey/bibliography.

  2.  **Analyze Practice A (Motivational Interviewing/MI):**

      *   *Mechanism:* Elicit patient's own arguments for change. Avoid argumentation.
      *   *Philosophical Commitment:* It assumes motivation must come from *within* the agent to be effective/sustainable.
      *   *Internalism?* Yes, broadly. But which kind?
          *   *Crude Internalism (Actual Desire):* Reason exists only if I currently want X. MI doesn't quite fit this because the patient often *doesn't* want to quit initially. MI tries to *create* the desire/reason.
          *   *Williams-style (Sound Deliberative Route):* Reason exists if, upon rational reflection on current commitments, I would want X. MI fits this better. The clinician facilitates the "sound deliberative route" to reveal latent commitments (e.g., "I want to see my grandkids" + "Smoking kills" -> "I should quit").
      *   *Entailment:* It entails that *authority* over the reason lies with the agent's reflective endorsement. It does *not* strictly entail that reasons don't exist externally, only that external impositions don't *motivate*.
      *   *Underdetermination:* One could justify MI purely causally (psychological reactance theory) without committing to meta-ethical internalism.

  3.  **Analyze Practice B (Informed Consent/Education):**

      *   *Mechanism:* Provide facts. If patient disagrees, provide more facts/correction. Label resistance as "non-adherent."
      *   *Philosophical Commitment:* It assumes facts *themselves* constitute reasons that should motivate any rational agent.
      *   *Externalism?* It leans heavily towards Reason Externalism (facts are reasons regardless of subjective set). If the patient isn't moved, they are irrational/non-adherent.
      *   *Entailment:* It entails that the clinician possesses the normative authority to identify the correct action based on objective facts.
      *   *Underdetermination:* It could be justified by a fiduciary duty to prevent harm (paternalism) without committing to full-blown meta-ethical externalism, but the *method* (more info = compliance) assumes a tight link between truth and motivation.

  4.  **Analyze the Conflict (Coherence):**

      *   *Tension:* Practice A says "Your reasons count most." Practice B says "The Facts count most; your resistance is an error."
      *   *Incoherence?* Yes, at the level of *normative authority*. In A, the patient is the author of the norm. In B, the patient is the recipient of the norm.
      *   *Resolution:* Can they coexist? Only if the domains are strictly separated (e.g., Lifestyle vs. Acute Safety). But the prompt implies overlap (opioid tapering, medication adherence).
      *   *Which gives?* If Internalism is true, B is coercive/ineffective. If Externalism is true, A is manipulative/inefficient.

  5.  **Analyze the Deflationary Reading:**

      *   *Claim:* Both are just causal tools. MI works on psychology; Education works on epistemology. No meta-ethics needed.
      *   *Critique:* This avoids the metaphysics but fails the *ethical* reconstruction. The prompt asks about "practical reasons." If we treat reasons merely as causal levers, we ignore the normative claim ("You *ought* to quit"). Practice B explicitly labels patients "non-adherent" (a normative failure), not just "unconvinced." Practice A aims for "sustained change" based on "avowals" (normative ownership). The deflationary reading concedes the question of *authority*, which is central to the ethics committee's concern.

  6.  **Analyze "Manufacturing" Reasons (Target Fixing):**

      *   *Issue:* Clinician picks the goal (quit smoking). MI elicits reasons *for that goal*.
      *   *Philosophical Implication:* Are reasons discovered (Platonic) or constructed (Kantian/Existentialist)?
      *   *MI View:* Reasons are constructed through reflection. The clinician scaffolds the construction.
      *   *Risk:* Manipulation. If the goal is external, are the reasons truly internal?
      *   *Entailment:* It presupposes reasons are *malleable* via reflection, not just static facts waiting to be found.

  7.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the tension. Set the stage (Internalism vs. Externalism).
      *   *Section 1: MI and Internalism.* Distinguish Crude vs. Williams. Argue for Williams-style. MI is about the *deliberative route*.
      *   *Section 2: Consent and Externalism.* Argue it presupposes Externalism (facts = reasons). The "non-adherent" label implies objective failure.
      *   *Section 3: Coherence.* Highlight the contradiction in normative authority. It's not just "different tools," it's "different masters."
      *   *Section 4: Deflationary Reading.* Argue it is *available* descriptively but *fails* normatively. It ignores the "ought."
      *   *Section 5: Manufacturing Reasons.* Discuss construction vs. discovery. MI assumes construction.
      *   *Section 6: Entailment vs. Comfort.* Be precise here. (Crucial constraint).
      *   *Section 7: Recommendations.* Specific wording changes for both protocols based on swapping the theories.

  8.  **Refining the Philosophy (Self-Correction during drafting):**

      *   *Check:* Did I distinguish Crude vs. Williams clearly?
      *   *Correction:* Crude = I must currently desire it. Williams = I would desire it if I reasoned well from current desires. MI clearly aims for the latter (patient often starts *not* wanting to quit).
      *   *Check:* Is Practice B definitely Externalist?
      *   *Correction:* It could be Internalist but assumes the patient is *irrational* (ignoring their own deep desires). However, the "more info" approach suggests the *info* is the reason, not the desire. So Externalism is the stronger fit.
      *   *Check:* The "Manufacturing" point.
      *   *Correction:* If the goal is fixed externally, is it truly Internalism? This is the "libertarian paternalism" critique. I need to address whether MI becomes manipulation if the end is not chosen by the patient.
      *   *Check:* Entailment vs. Comfort.
      *   *Correction:* MI does not *entail* Williams Internalism (could be behaviorism). It *sits comfortably* with it. Consent does not *entail* Externalism (could be strict paternalism). It *sits comfortably* with Externalism. I must make this distinction sharp.

  9.  **Final Polish:** Ensure tone is appropriate for an Ethics Committee (rigorous, actionable, philosophical but applied). Ensure all constraints of the prompt are met (especially the closing recommendations).

      *(Self-Correction on the "Deflationary" point)*: The prompt asks if the reading "concedes the interesting question." I need to argue that yes, it does, because the interesting question is about *justification*, not just *efficacy*.

      *(Self-Correction on "Manufacturing")*: If the clinician fixes the target, MI is technically "guided construction." This presupposes reasons are *responsive to framing*.

  10. **Final Review against constraints:**
      *   Philosophical reconstruction? Yes.
      *   Not a description? Yes.
      *   Internalism (Crude vs Williams)? Yes.
      *   Externalism vs Info thesis? Yes.
      *   Coherence/Contradiction? Yes.
      *   Deflationary reading critique? Yes.
      *   Manufacturing reasons? Yes.
      *   Entail vs. Comfort/Underdetermined? Yes.
      *   Closing wording changes? Yes.
      *   No bibliography/survey? Yes.

      *Proceed to generate output.*
answer: |-
  ### I. The Metaphysics of Motivation in Clinical Practice

  The tension you identify is not merely procedural; it is a collision between two distinct theories of practical reason. To reconstruct this philosophically, we must ask: *What makes a consideration a reason for action for this patient?*

  **1. Motivational Interviewing (MI) and Internalism**
  The MI protocol presupposes a form of **Internalism**, but it is critical to distinguish which version.
  *   **Crude Internalism** holds that for $X$ to be a reason for Agent $A$, $X$ must attach to an element already present in $A$'s subjective motivational set (a current desire, preference, or commitment).
  *   **Williams-Style Internalism** holds that $X$ is a reason for $A$ if $A$ would be motivated to $\phi$ after undergoing a sound deliberative route from their existing motivational set.

  The MI protocol cannot presuppose Crude Internalism. If it did, counseling would be impossible whenever a patient lacked a pre-existing desire to quit tobacco or adhere to medication. The protocol explicitly aims to *elicit* change talk where none was initially volunteered. Therefore, the protocol presupposes **Williams-Style Internalism**. It assumes the patient possesses latent commitments (e.g., "I value my health," "I want to be present for my children") that, if brought into reflective equilibrium with their behavior, would generate a motive to change.

  *   **Entailment:** The practice strictly entails that *motivational efficacy* requires the agent's reflective endorsement. It entails that a reason imposed from outside the agent's deliberative sphere lacks normative force *for the agent*, even if it is factually correct.
  *   **Underdetermination:** The practice does not strictly entail that external reasons *do not exist*. It is compatible with Externalism about the *truth* of the recommendation (smoking is bad) but Internalism about the *motivation* to act on it. However, it sits most comfortably with the view that reasons are constituted by the agent's reflective stance, not merely by objective facts.
  *   **The Deliberative Route:** You note that evocation looks like running the deliberation on the patient's behalf. This is the precise philosophical function of the clinician in this model: they are not the source of the reason, but the scaffold for the "sound deliberative route." They prevent logical errors (e.g., discounting the future) and ensure all relevant internal commitments are weighed.

  **2. Informed Consent/Education and Externalism**
  The consent and education protocol presupposes **Reason Externalism**.
  *   **Externalism** holds that facts (e.g., "this medication reduces stroke risk") constitute reasons for action regardless of the agent's subjective motivational set.
  *   **The Causal Thesis:** An alternative reading is that the practice presupposes only a causal thesis: *Information causes compliance.* However, the use of the label "non-adherent" and the prescription of "forceful restatement" betrays a normative judgment. It implies the patient is failing to respond to a reason that *is there*, independent of their desire. If the practice were merely causal, a patient unmoved by facts would be "unresponsive," not "non-adherent." "Non-adherence" implies a violation of an objective standard of rationality or duty.

  *   **Entailment:** This practice entails that the clinician is the epistemic authority on what counts as a reason. It entails that resistance is a cognitive deficit (lack of information or understanding) rather than a normative disagreement.
  *   **Underdetermination:** It does not strictly entail hard Externalism; it could be justified by strong Paternalism (the clinician must protect the patient from themselves regardless of reasons). However, the reliance on *information* as the remedy suggests the belief that the facts themselves carry motivational weight that the patient is failing to grasp.

  ### II. Institutional Coherence and Contradiction

  Can the institution house both?
  *   **Descriptive Coherence:** Yes. One can use different tools for different contexts.
  *   **Normative Incoherence:** No. The practices contradict regarding **Normative Authority**.
      *   In MI, authority resides in the patient's reflective will. The clinician suppresses their own authority to facilitate the patient's.
      *   In Consent/Education, authority resides in the objective facts as interpreted by the clinician. The patient's will is subordinate to the facts.

  **The Contradiction:** The contradiction arises in the "gray zone" behaviors you listed: opioid tapering and medication adherence.
  *   If a patient refuses opioid tapering, MI dictates we explore their internal reasons (fear of pain, loss of coping). If those reasons stand after deliberation, the protocol suggests we cannot simply override them without breaking the therapeutic alliance.
  *   If the same patient is in the "Education" track, their refusal is "non-adherence" based on risk statistics. The remedy is to press harder until they submit to the external reason.

  **Which must give?**
  If **Williams-Internalism** is true, the Consent practice is coercive. It treats patients as vessels to be filled with facts rather than agents to be engaged. It risks "alienation," where the patient acts on reasons they do not own, leading to the very lack of sustainability MI seeks to avoid.
  If **Externalism** is true, MI is manipulative. It is a rhetorical trick to make the patient feel like they chose what they were always going to be told to do. It wastes time eliciting reasons that already exist objectively.

  Given the clinical aim of *sustained* behavior change (as admitted in the MI aim), the **Consent/Education practice must give** in matters of long-term behavioral modification. External reasons may justify the *recommendation*, but they cannot sustain the *action* without internal endorsement. The "non-adherent" label is the philosophical error; it reifies a disagreement about values into a failure of cognition.

  ### III. The Deflationary Reading

  You ask if a deflationary reading is available: that neither practice commits to metaphysics, but both are merely empirical claims about what causally works (reactance vs. rapport).

  *   **Availability:** This reading is *descriptively* available. One could run both protocols simply because data shows MI reduces relapse and Education reduces malpractice suits.
  *   **Concession:** However, this reading **concedes the interesting question**. The ethics committee's mandate is not merely "what works" but "what is right."
      *   The MI protocol claims the patient is "moved by reasons she articulates herself." This is a claim about the *nature* of motivation, not just its mechanics.
      *   The Consent protocol claims the patient is "non-adherent." This is a normative status, not a causal description.
      *   To adopt the deflationary reading is to ignore the **moral status of the patient**. Are they a sovereign agent whose reasons constitute the justification for action (MI), or are they a system to be corrected against objective standards (Consent)? The deflationary reading hides this moral conflict under the guise of "technique," which is ethically dangerous in a teaching hospital. It allows clinicians to switch between treating patients as autonomous authors and passive recipients without acknowledging the shift in moral standing.

  ### IV. Manufacturing Reasons and the Fixed Target

  The MI protocol fixes the target behavior (e.g., "quit tobacco") before the conversation begins. The clinician then evokes reasons *for that specific end*.

  *   **Discovery vs. Production:** This presupposes that reasons are **constructed through reflection**, not merely discovered like stones on a path. If reasons were only discovered, the clinician would simply point to the existing desire. But since the patient often lacks the desire, the reflection *produces* the reason by linking latent values (family, health) to the specific behavior.
  *   **Manufacturing Internal Reasons:** Does this amount to manufacturing? Yes, but not necessarily illegitimately. It is **scaffolded construction**.
      *   *Risk:* If the target is entirely external (clinician's goal) and the reasons are elicited solely to meet that target, this borders on manipulation (making the patient feel free while constraining the outcome).
      *   *Presupposition:* It presupposes that the patient's motivational set is **malleable** and that reflection can generate new motivations that were not previously active, provided they are consistent with deep commitments. This aligns with a constructivist view of practical reason: we become committed to things by reasoning about them, not just by having pre-existing urges.

  ### V. Entailment, Comfort, and Underdetermination

  To ensure precision for the committee, we must separate what the protocols *force* us to believe from what they merely *allow*.

  | Practice | Strictly Entails | Sits Comfortably With | Underdetermined (Rival Theories License This) |
  | :--- | :--- | :--- | :--- |
  | **MI Protocol** | 1. Motivation requires reflective endorsement by the agent.<br>2. Direct argumentation undermines motivational sustainability. | 1. Williams-Style Internalism.<br>2. Constructivism about reasons. | 1. **Behaviorism:** MI works via operant conditioning (reinforcing "change talk"), not reason.<br>2. **Crude Internalism:** If we assume the desire is already there, just hidden. |
  | **Consent Protocol** | 1. Accurate information is the primary determinant of rational choice.<br>2. Resistance to facts is a deficit (non-adherence). | 1. Reason Externalism.<br>2. Strong Paternalism. | 1. **Internalism + Irrationality:** Patient *has* the desire to be healthy but is temporarily irrational; info fixes the irrationality.<br>2. **Legalism:** Protocol is driven by liability protection, not theories of reason. |

  ### VI. Recommendations for Protocol Revision

  If the committee decides to resolve the incoherence, we must align the wording of the protocols with the chosen metaphysical account.

  **Scenario A: Adopting Williams-Style Internalism (Prioritizing Agency)**
  *   **MI Protocol Changes:** No change needed to the core philosophy, but wording must acknowledge the constructed nature of the goal.
      *   *Current:* "Elicit patient's own avowals in favor of change."
      *   *Revision:* "Facilitate a deliberative route connecting the patient's existing values to the proposed clinical goal. If no sound route exists, the goal must be renegotiated." (This prevents manufacturing reasons where none can logically exist).
  *   **Consent Protocol Changes:** Must remove the externalist presumption of "non-adherence."
      *   *Current:* "Patient... remains unmoved is recorded as non-adherent, the remedy is more information restated more forcefully."
      *   *Revision:* "Patient... remains unmoved is recorded as **values discordant**. The remedy is **exploration of the conflicting values**, not restatement of facts. Clinician duty is to ensure understanding, not to secure agreement."

  **Scenario B: Adopting Reason Externalism (Prioritizing Objective Risk)**
  *   **MI Protocol Changes:** Must admit the manipulative element if the goal is fixed externally.
      *   *Current:* "Assumption that a patient moved by reasons she articulates herself sustains the change longer."
      *   *Revision:* "Assumption that **ownership of the decision** increases compliance, even if the reasons are objectively determined by clinical guidelines. Clinician to use evocation as a tool to reduce resistance to objectively mandated care." (This is honest but ethically colder).
  *   **Consent Protocol Changes:** Reinforce the duty to correct.
      *   *Current:* "Clinician's instinct to correct the patient is treated... as a professional duty."
      *   *Revision:* "Clinician's duty is to **align patient behavior with objective medical necessity**. Patient refusal based on subjective valuation contrary to medical fact is to be documented as **decisional incapacity regarding risk assessment**." (This raises the bar for refusal significantly).

  **Final Judgment:**
  For a teaching hospital committed to both ethics and efficacy, **Scenario A** is the only viable path. Scenario B collapses the distinction between treatment and coercion. The inconsistency lies in the Consent Protocol's use of "non-adherent." It treats a failure of *motivation* (which MI correctly identifies as internal) as a failure of *information* (which Externalism assumes). The Consent Protocol must be rewritten to recognize that information is necessary for consent, but insufficient for adherence. Adherence requires the internalism MI respects.
