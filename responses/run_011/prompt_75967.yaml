answer: |-
  **UNIVERSITY OF ST JUDE'S**
  **FACULTY OF HUMANITIES**
  **SUMMER EXAMINATIONS 2024**

  **Course Code:** PHIL304
  **Course Title:** Philosophy of Biology
  **Time Allowed:** 60 Minutes
  **Total Marks:** 25

  **INSTRUCTIONS TO CANDIDATES**
  Answer the question below. All parts must be attempted. The marks allocated to each section are indicated in brackets. You are expected to demonstrate technical precision in your use of terminology.

  ***

  **QUESTION 4**

  Consider a synthetic microorganism constructed in a laboratory environment. Its genome presents three features of philosophical interest:

  1.  **The Novel Enzyme:** A catalytic structure with no ancestral history in the lineage (present for only ~50 clonal generations). It currently detoxifies a solvent in the culture medium, preventing cell lysis.
  2.  **The Wild-Type Motility Apparatus:** Inherited from a wild ancestor where it was selected for chemotaxis. In the current uniform laboratory medium, it rotates and consumes ATP but confers no survival advantage.
  3.  **The Mutant Motility Apparatus:** A variant carried by a sub-lineage. It is structurally intact but mechanically locked; it does not rotate. It exists in the same uniform laboratory medium as the Wild-Type.

  Using the Selected-Effects (SE) account (e.g., Millikan, Neander) and the Causal-Role (CR) account (e.g., Cummins):

  (a) Determine whether the Novel Enzyme and the Wild-Type Motility possess 'functions' under each account. [10 marks]
  (b) Assess whether the Mutant Motility counts as *malfunctioning*. Explain how each account justifies this verdict, given the environmental context. [10 marks]
  (c) Conclude by analysing what the divergence in these verdicts implies about the *relata* of functional ascription (i.e., what kind of thing is being explained). [5 marks]

  ***

  ### MODEL ANSWER (First-Class Standard)

  The Selected-Effects (SE) account defines function etiolologically: a trait has a function if it exists because ancestors possessing it were selected for that effect. The Causal-Role (CR) account defines function dispositionally: a trait has a function if it currently contributes to a capacity of the containing system.

  Regarding the **Novel Enzyme**, the accounts diverge immediately. For SE, the enzyme lacks a function. It has no history of selection; its presence is not explained by its detoxifying effect, but by recent engineering or drift. It is merely beneficial. For CR, it possesses a function. Relative to the capacity of 'survival in solvent', the enzyme makes a current causal contribution. The CR theorist need not care about history, only the current systemic organisation.

  Regarding the **Wild-Type Motility**, the divergence reverses. For SE, the apparatus has a function (chemotaxis/locomotion). Its presence is explained by past selection in the ancestral niche, regardless of current utility. For CR, it likely lacks a function. In the uniform medium, rotation contributes to no capacity of the containing system (the lab culture); it is merely a cost. A CR theorist might argue it contributes to 'ATP depletion', but this is not the capacity we aim to explain.

  The **Mutant Motility** presents the critical test for malfunction. For SE, the verdict is clear: the mutant is malfunctioning. Function is normative based on history. The trait *ought* to rotate because that is the effect for which it was selected. The current environment is irrelevant to the norm; the trait fails its etiological standard.

  For CR, the verdict is problematic. If the Wild-Type has no function in this environment (as established above), the Mutant cannot be malfunctioning relative to that environment. A non-functional trait cannot malfunction. To call it a malfunction, the CR theorist must shift the 'containing system'. They must appeal to the ancestral environment or the organism's design specification. However, appealing to the ancestral environment collapses CR into SE. Appealing to design specifications risks conflating biological function with artefact function, which biology typically excludes unless invoking artificial selection. Alternatively, the CR theorist might appeal to a 'typical' case (statistical normality), but this struggles to ground normativity; a trait can be typically broken without malfunctioning in a functional sense. Thus, CR struggles to ground malfunction without smuggling in history.

  This divergence implies the accounts are not competing descriptions of the same relata. SE explains the *presence* of the trait (why it is here), fixing the relata as the lineage and ancestral environment. CR explains the *capacities* of the system (how it works now), fixing the relata as the current organism and its immediate context. The tension is not a contradiction but a category difference. SE tracks history; CR tracks current systemic contribution. Recognizing this dissolves the urge to force a single verdict on the Mutant: it is etiolologically broken but systemically neutral.

  ***

  ### MARKING SCHEME & ANNOTATION GUIDE

  **Total Marks: 25**
  **Pass Mark: 40% (10/25)**

  **Part (a): Application to Enzyme & Wild-Type (10 Marks)**
  *   **7-10 (First):** Correctly identifies SE denies function to Enzyme (no history) and grants it to Wild-Type (history). Correctly identifies CR grants function to Enzyme (current contribution) and denies it to Wild-Type (no current contribution to relevant capacity). Explicitly mentions the shift in 'containing system' for CR.
  *   **5-6 (2:1):** Correctly applies definitions but may waver on the Wild-Type CR verdict (e.g., suggests it still has a function because it *can* move).
  *   **3-4 (2:2):** Definitions correct, but application to the specific scenario is muddled.
  *   **0-2 (Fail):** Confuses SE and CR definitions.

  **Part (b): The Malfunction Crux (10 Marks)**
  *   **7-10 (First):** Identifies that SE grounds malfunction easily via historical norm. Identifies that CR struggles: if Wild-Type has no function here, Mutant cannot malfunction *here*. Notes that saving CR malfunction requires appealing to history (collapsing into SE) or Design (problematic).
  *   **5-6 (2:1):** States SE says malfunction, CR says no. Fails to explain *why* CR struggles (i.e., fails to see the dependency on the Wild-Type's functional status).
  *   **3-4 (2:2):** Asserts verdicts without justification.
  *   **0-2 (Fail):** Claims both agree on malfunction.

  **Part (c): Relata and Meta-Analysis (5 Marks)**
  *   **5 (First):** Explicitly states the accounts fix on different relata (lineage/history vs. current system/capacity). Concludes that the tension is structural, not accidental.
  *   **3-4 (2:1):** Notes they look at different things but treats this as a 'pluralist' solution without analysing the relata.
  *   **0-2 (Fail):** No conclusion or suggests one theory is simply 'wrong'.

  **SPECIFIC PENALTIES (Deduct from Total)**
  *   **The 'Comfortable Pluralism' Penalty (-2):** Ending with "both are useful" without explaining the structural divergence. *Marginalia: "Don't sit on the fence."*
  *   **The 'CR Malfunction' Error (-3):** Asserting CR handles malfunction easily via 'statistical typicality' without noting the loss of normativity. *Marginalia: "Statistics ≠ Norms."*
  *   **The 'Designer' Error (-3):** Using the bioengineer's intention as the SE history without qualification. *Marginalia: "Biology ≠ Artefacts."*
  *   **The 'Interest-Relativity' Error (-2):** Treating CR's interest-relativity as a bug rather than a feature. *Marginalia: "Cummins insists on this."*

  **MARKER'S MEMO (For Internal Use)**
  *   *Look for:* The phrase "containing system" in Part (a).
  *   *Look for:* The admission that CR must "shift" contexts to find malfunction in Part (b).
  *   *Watch out:* Candidates who think the Enzyme has an SE function because it was 'designed'. Remind yourself: design is not natural selection unless specified as artificial selection lineage.
  *   *Tone:* Be harsh on vague definitions. If they say "SE is about the past," ask them to mark down. It is about *selection* in the past.

  **SAMPLE MARGINALIA (To be written on scripts)**
  *   *"Precise."*
  *   *"You've missed the cost element in the Wild-Type."*
  *   *"This collapses CR into SE—notice that."*
  *   *"Vague on the relata."*
  *   *"Good distinction."*
  *   *"Don't just assert this."*
  *   *"Where is the normativity coming from?"*
  *   *"Predictable."*
  *   *"Finally, some thought."*
