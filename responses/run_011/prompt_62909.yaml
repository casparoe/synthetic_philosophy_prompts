      *   *Problem:* If the optimal bet is 0, you can't demonstrate *finding* the optimal fraction. You only demonstrate *avoiding* the bet.
      *   *Solution:* Change the wager slightly for the Kelly calculation part. Make the upside 60% or the downside 30%.
