answer: |-
  Here is a structural plan for your forty-five-minute seminar. It is designed to move from intuition to arithmetic to geometry, reserving the jargon for the final label.

  ### I. The Wager: Can it carry the weight?

  **Verdict:** The 50% gain / 40% loss (with 50/50 probability) wager is perfect for the **first half** of the session but mathematically dead for the **second half**.

  *   **Why it works initially:** It is the cleanest possible demonstration of the divergence between arithmetic and geometric means.
      *   Arithmetic Mean: $(1.5 + 0.6) / 2 = 1.05$ (Positive EV).
      *   Geometric Mean: $\sqrt{1.5 \times 0.6} = \sqrt{0.9} \approx 0.95$ (Negative Growth).
      *   It proves that a positive expected value can guarantee ruin if bet fully.
  *   **Why it fails later:** The Kelly criterion asks, "What fraction $f$ maximizes growth?" For this specific wager, the answer is **zero**. If you try to derive a Kelly fraction with these numbers, the optimization yields "do not bet." You cannot demonstrate *how* to calculate a positive position size if the optimal size is zero.
  *   **The Fix:** Keep the 50/40 payoff structure for the first 20 minutes to establish the trap. For the second 20 minutes (the Kelly optimization), explicitly **tweak the probability**. Change the win probability from 50% to **60%**.
      *   New EV: $0.6(1.5) + 0.4(0.6) = 1.14$.
      *   New Growth: $1.5^{0.6} \times 0.6^{0.4} \approx 1.03$.
      *   Now the Kelly fraction is positive (approx. 35%). This allows you to show the *mechanism* of optimization without changing the payoff mechanics the audience has already internalized.

  ### II. The Sequence of Dependencies

  Do not start with definitions. Start with the conflict.

  **1. The Trap (Minutes 0–15)**
  *   **Action:** Present the 50/50 probability, 50% gain/40% loss bet. Ask: "Take it or leave it?"
  *   **Dependency:** None. Rely on their intuition.
  *   **Calculation:** Show the Arithmetic Mean (EV) is $+5\%$. Show the Geometric Mean (two flips) is $-10\%$.
  *   **Key Concept:** **Compounding must be established here.** You cannot explain the divergence without establishing that wealth updates multiplicatively ($W_{t+1} = W_t \times \text{Return}$), not additively.
  *   **Takeaway:** "EV is correct for one-off parallel bets; it is lethal for repeated sequential bets."

  **2. The Fraction (Minutes 15–30)**
  *   **Action:** Introduce the tweak (60% win probability). Ask: "Now we take it. But how much?"
  *   **Dependency:** Requires acceptance of the multiplicative structure from Phase 1.
  *   **Mechanism:** Introduce $f$ (fraction of bankroll).
      *   Show that $f=1$ is still dangerous (volatility drag).
      *   Show that $f=0$ is safe but suboptimal.
      *   Sketch the curve: Growth rate rises then falls.
  *   **Takeaway:** There is a specific "speed limit" for capital growth.

  **3. The Logarithm (Minutes 30–35)**
  *   **Action:** Explain *why* we maximize the geometric mean.
  *   **Dependency:** Requires the concept of "long-run."
  *   **Explanation:** Do not derive the Law of Large Numbers. State it: "Over thousands of bets, the average of the *logs* of your returns converges to the expected log return."
  *   **Crucial Distinction:** Maximizing expected log wealth is mathematically equivalent to maximizing the geometric growth rate.
  *   **Takeaway:** The logarithm is not a preference; it is the arithmetic of time.

  **4. The Label (Minutes 35–40)**
  *   **Action:** Now, and only now, name **Ergodicity**.
  *   **Dependency:** Requires the distinction between Phase 1 (Time) and Phase 2 (Ensemble) to be fully felt.
  *   **Explanation:** "Ergodicity" is just the formal word for "what happens to one person over time is not the same as what happens to many people at once."
  *   **Takeaway:** You have been doing ergodicity economics for 40 minutes without the jargon.

  **5. The Close (Minutes 40–45)**
  *   **Action:** Diagnostic question and scope setting.

  ### III. Mapping the Misconceptions

  You must intercept these errors at specific waypoints. If you wait until the end, the misunderstanding will have calcified.

  **1. "Expected Value is an error."**
  *   **When to head it off:** **Minute 15**, immediately after showing the 50/40 ruin.
  *   **The Correction:** "EV is not wrong. It is the correct average for the *casino*, who plays many people at once. It is the wrong average for the *gambler*, who plays one game many times."
  *   **Let them voice it:** Allow them to call EV a "scam" initially. Validate the feeling, then correct the scope.

  **2. "Kelly reveals your edge."**
  *   **When to head it off:** **Minute 20**, when introducing the fraction $f$.
  *   **The Correction:** "Kelly does not tell you if the bet is good. You must estimate the probability and payoff *first*. Kelly only tells you how to size the bet given those inputs. Garbage in, garbage out."
  *   **Let them voice it:** Do not let this slide. If they think Kelly generates the edge, they will overbet. State clearly: "Kelly is a sizing tool, not a signal generator."

  **3. "The Logarithm is just risk aversion."**
  *   **When to head it off:** **Minute 35**, during the Logarithm section.
  *   **The Correction:** "In standard economics, log utility is a psychological preference. Here, the log comes from the *mathematics of compounding*. You do not need to be 'risk averse' to use Kelly; you only need to want to stay in the game."
  *   **Let them voice it:** This is the deepest confusion. Let them suggest "maybe people just hate losing." Then correct it: "It's not about hate; it's about geometry. A 50% loss requires a 100% gain to recover. That is a mathematical fact, not a psychological one."

  ### IV. Scope and Boundaries

  **Announce at the Outset:**
  1.  **No Utility Theory:** "We are not discussing how much happiness money brings. We are discussing how much money remains."
  2.  **No Estimation:** "We assume we know the probabilities. In the real world, estimating the edge is harder than sizing the bet. We are ignoring estimation error today."
  3.  **No Ruin Barriers:** "We assume you can bet infinitely small fractions. We are ignoring transaction costs and minimum bet sizes."

  ### V. The Closing Question

  To separate those who grasp the ergodic distinction from those who simply distrust EV, pose this scenario:

  > "A casino offers you this 60% win-probability bet. They will allow you to play it 1,000 times. Alternatively, they will allow 1,000 different people to play it once each.
  >
  > **Question:** In which scenario should the casino price the bet using Expected Value, and in which scenario should they price it using the Geometric Mean? And if you are the gambler, which scenario are you in?"

  **The Correct Answer:**
  *   **Casino:** Uses **Expected Value** in *both* cases. For the casino, the 1,000 sequential players and the 1,000 parallel players are the same ensemble average. The casino is diversified.
  *   **Gambler:** Is in the **Time Average** scenario (1 person, 1,000 times). They must use Geometric Mean/Kelly.
  *   **The Trap:** If a participant says "The casino should use Geometric Mean for the single player," they have missed the point. The casino doesn't care about the single player's path; they care about the aggregate book. The divergence is between the *agent* and the *market*, not just between two math formulas.

  **Why this works:** It forces them to identify *who* is experiencing the time average. If they understand that the casino absorbs the ensemble while the gambler endures the time, they have grasped ergodicity. If they simply say "EV is bad," they have learned a slogan, not the mechanism.
