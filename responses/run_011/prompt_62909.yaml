      *   *The Conflict:* Arithmetic Mean (EV) says take the bet. Geometric Mean (Growth) says decline (or bet fractionally).
      *   *The Mechanism:* Compounding (multiplicative dynamics).
      *   *The Solution:* Kelly Criterion (maximize geometric growth).
      *   *The Framework:* Ergodicity (Time average $\neq$ Ensemble average).

  3.  **Address the Specific Wager (50% / 40%):**
      *   *Pros:* Simple numbers. $1.5 \times 0.6 = 0.9$. Clearly shows wealth destruction despite positive EV.
      *   *Cons:* It's an "all-in" scenario. Kelly is about *fractional* betting. If the audience thinks the lesson is "don't take positive EV bets," they miss the nuance of *how much* to take.
      *   *Verdict:* It's a great *hook* to demonstrate the divergence between EV and Growth, but it needs to evolve into a fractional betting scenario to introduce Kelly properly. If you stay at "all or nothing," Kelly is trivial (bet nothing). To teach Kelly, you need to vary the fraction $f$.
      *   *Recommendation:* Start with the all-in to show the trap, then immediately modify to "what if I only bet half?" to introduce the optimization problem.

  4.  **Sequencing and Dependencies:**
      *   *Step 1: The Trap.* Establish the wager. Calculate EV (positive). Simulate/Calculate path (negative).
      *   *Step 2: The Cause.* Why the difference? Multiplicative vs. Additive. Compounding is the prerequisite. Without compounding, arithmetic mean is king.
      *   *Step 3: The Fix.* How to bet? Introduce fraction $f$. Show that there's an optimal $f$.
      *   *Step 4: The Logic.* Why Log? (Geometric mean maximization $\equiv$ Log expectation maximization).
      *   *Step 5: The Context.* Ergodicity (Time vs. Ensemble).

  5.  **Addressing "Ergodicity":**
      *   *Audience:* Some know the pop-sci version ("EV is a confidence trick").
      *   *Strategy:* Don't make it the *foundation*, make it the *label* for what they just discovered. If you start with ergodicity, eyes glaze over. If you end with it, it's the "aha" moment.
      *   *Decision:* Use the concept without the heavy jargon initially. Name it at the end as the formal classification of the distinction they just derived.

  6.  **Mapping Misconceptions:**
      *   *Misconception 1: EV is an error.*
          *   *Correction:* EV is correct for *ensemble* (parallel) bets, wrong for *time* (sequential) bets.
          *   *Timing:* Address this when comparing the single path to the average of many paths.
      *   *Misconception 2: Kelly reveals edge.*
          *   *Correction:* Kelly *uses* edge. You need to estimate probability/payoff first.
          *   *Timing:* When introducing the formula.
      *   *Misconception 3: Log = Risk Aversion.*
          *   *Correction:* Log is about survival/compounding geometry, not psychological utility (though they overlap).
          *   *Timing:* When justifying the logarithm.

