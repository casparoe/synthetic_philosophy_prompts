          *   *Critical Flaw:* If the optimal Kelly fraction is zero, you can't teach them how to calculate a positive Kelly fraction.
          *   *Fix:* The user needs a wager where the full bet is *too much*, but a partial bet is *good*.
          *   *Requirement:* $ (1+g)(1-l) > 1 $.
          *   Example: 50% gain, 20% loss. $1.5 \times 0.8 = 1.2$. Good.
