          *   *Recommendation:* I must advise the user that the 50/40 wager is perfect for the *problem* but fails for the *solution* (Kelly optimization) unless modified. I will suggest keeping the 50/40 for the "Don't Bet" lesson, but having a second "60/40 gain/loss" or "50/20" ready for the "How Much" lesson. Or, simpler: Change the probability. If $p=0.6$ (60% chance of 50% gain, 40% chance of 40% loss).
          *   $1.5^{0.6} \times 0.6^{0.4} \approx 1.25 \times 0.81 \approx 1.01$. (Positive growth).
          *   *Decision:* I will advise that the 50/40 (50/50 prob) wager is lethal for the "All-In" warning but useless for the "Kelly Optimization" demonstration because the answer is "bet nothing." I need to suggest a tweak for the second half.

