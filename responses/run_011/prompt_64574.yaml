  ### 6. The Killer Question

  To force him to reveal which rule he is using, ask this during the Q&A on **Part 3 (The Tax Default)**:

  > "Professor, you testified that the German church tax is acceptable because individuals can opt out. In Part 3, individuals can also opt out by redirecting their 2 percent. **If we changed the default so that unredirected funds went to a secular humanist fund instead of the National Church, would that cure the constitutional defect for you?**"

  *   **If he says YES:** He is running **Rule B (Structural Neutrality)**. The problem is the state favoring *religion*, not the default mechanism itself.
  *   **If he says NO:** He is running **Rule A (Coercion)**. The problem is the *sticky default* itself (paternalism), regardless of where the money goes.
  *   **If he hedges:** He is likely relying on the **Shaky UK Bishops** logic (impact assessment), in which case you can press him on whether the "impact" of the default is measurable.

  **Why this works:** It isolates the *destination* of the default from the *mechanism* of the default. His answer will tell you whether he cares more about minority protection (Neutrality) or individual autonomy (Coercion).
