      *   *Tone Check:* Avoid flowery language. Be precise. Use Foucault's terminology correctly (e.g., "micro-physics of power," "sovereign power," "docile bodies").

  8.  **Final Polish:** Check against all constraints in the prompt.
      *   Did I cover Midvale/Bethlehem specifics? Yes.
      *   Did I cover the 6 mechanisms? Yes.
      *   Did I cover the missing institutional features? Yes.
      *   Did I address the economism/class interest tension? Yes.
      *   Did I address Watertown/Congress? Yes.
      *   Did I list missing vocabulary? Yes.
      *   Did I give a verdict? Yes.

  9.  *(Final thought before generating)*: Ensure the distinction between "disciplinary power" (Foucault) and "sovereign power" (Law/King) is clear in the Watertown section. The ban is a Sovereign act against a Disciplinary technique. This is the crux of the theoretical tension.

