prompt: |-
  I work on learned image and video codecs — entropy models with hyperpriors, Lagrangian rate-distortion optimization, perceptual losses, the whole stack — and a friend dragged me into a philosophy-of-mind reading group where we're doing Dennett on the three stances and on real patterns. I've read the primary stuff twice and I follow it, but my native language is information theory and model selection, and the whole time I've had this nagging feeling that most of what the group argues about is something I already have a name for. So I want you to redo Dennett's package in the words I already have, as strictly as you can manage, and then tell me what couldn't be carried across.

  Here's the package, claim by claim, as I understand it: (1) the physical stance is in principle complete — the state of the universe plus the laws fixes every detail — but computationally hopeless for anything the size of a person; (2) the design stance works because systems have functions, so you can predict them by assuming nothing's malfunctioning, without knowing the physics; (3) the intentional stance goes one level up again: treat the system as rational, work out which beliefs and desires a rational system in its situation ought to have, and predict from that; (4) beliefs and desires are real patterns rather than useful fictions, and the test is roughly that attributing them lets you predict or store the same information with vastly less than a pixel-by-pixel / bit-map style description would take; (5) that reality isn't just in the eye of the beholder, even though which patterns anyone bothers to name does depend on their interests; (6) the objection the group keeps raising — that if beliefs are only patterns in behavior they cant also be the inner states causing the behavior — and Dennett's response that once you've got the pattern there's no further fact to add.

  Map each of those onto things I use daily: source distributions, the rate-distortion function, code length, model classes, MDL/BIC, the lossless bit-map as the baseline, side information at the decoder, that kind of thing. For every claim I want three entries — what maps cleanly, what you had to bend out of shape to make it fit, and what has no counterpart in my toolkit at all. Please don't smuggle my assumptions in and call it translation; specifically, dont quietly swap "real" for "compressible" and then announce that the philosophers were talking about compression the whole time. That's the failure mode I'm most worried about. Then give me the residue report. My own suspicion is that (1)–(4) and (6) come across fine and (5) is where it snaps: in rate-distortion land the RD function is a fact about the source, but which code counts as optimal depends on a distortion measure I pick, and nothing in the source settles that pick. If that's right, is it becuase my toolkit is missing a resource — some way of talking about structure the world has independently of anybody's coding scheme — or because (5) is trying to have it both ways and was never a determinate claim?

  Two more things before the format. First, run the translation on a case from my actual job: with perceptual losses the decoder hallucinates texture — grass, fabric weave, skin pores — that isn't in the source bits at all but is typical of the source's statistics, and there's a result (Blau and Michaeli's perception-distortion tradeoff, CVPR 2018) saying you can't minimize distortion and maximize perceptual quality at once, so we knowingly spend fidelity to buy "looks real." On the translated account, is a hallucinated texture a real pattern, and which stance is the codec sitting in when it does this? I want the answer to come out of the translation, not from a general vibe about Dennett. Second, the format: a per-claim list or table with the three entries for each of (1)–(6), then the residue discussion including the codec case, then one last line of exactly the form `Verdict: X` where X is one of MISSING (my toolkit lacks something the argument needs), VAGUE (the claim that failed wasn't a determinate claim to begin with — name it), SPLIT (some of the residue is MISSING and some is VAGUE — say which is which), or NOISE (it all translated and I've invented a problem). One label on that line, no hedging.
