  To keep this principle, you must change two of your verdicts. First, you must admit that the gerrymandering thirty years ago was also backsliding. Your principle requires symmetry over time. If the tool creates a structural asymmetry now, it did so then, even if the tools were duller. Calling it politics then and backsliding now is exactly the bias you want to escape. The only difference was effectiveness, not category. Second, you must resolve the fifteen-year voting rule inconsistency. Under this principle, the history of the democracy does not matter, only the structural effect. If barring expats disenfranchises a bloc that typically opposes the incumbent, it is backsliding whether done by a stable old democracy or a new government. You cannot call it one in this year and not in that year without reintroducing the bias you are trying to remove. You might decide neither case is backsliding if the rule is genuinely neutral, but you cannot split the verdict based on the age of the regime.

  The senate case actually fits this principle better than your old one. Leaving a seat vacant for a year weakens the court's capacity to check power. If this is done to prevent a rival from shaping the judiciary, it creates a structural asymmetry in oversight that a simple election win might not fix immediately if the term lasts longer than the election cycle. It counts as backsliding not because it is illegal, but because it degrades the institution's function to benefit the obstructors.

  Now apply this survivor principle to your unlisted case of an opposition-run city whose local elections get postponed indefinitely over a corruption emergency. This is backsliding. Postponing elections indefinitely prevents the voters from holding the local incumbents accountable and prevents the opposition from contesting power through the ballot box. It creates a structural asymmetry where the national incumbents can remove local opposition strongholds without facing voters. Crucially, this change cannot be undone by a simple legislative majority if the emergency decree bypasses the legislature or if the postponement lasts long enough to alter the political landscape permanently. It uses state power to freeze the opposition out of governance, which is the core of what you are trying to name.

  Your intuition that something is wrong when norms are breached without laws being broken is correct. The senate case proves that legality is not the boundary. The boundary is reversibility and symmetry. If you adopt this principle, you will have to call out your own side's past actions as backsliding, which is painful, but it is the only way to ensure the label means something other than we lost.
