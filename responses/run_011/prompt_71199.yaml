answer: |-
  The alert chime was soft, a single note of synthetic glass breaking in the silence of the Observation Deck. Outside the thick quartz, the dark was absolute. They were past the heliopause, where the sun was just another bright star among many, and the Bureau's catalogue was the only thing imposing order on the void.

  Elion saw the flag first. He leaned over the console, his fingers hovering over the haptic interface. "Merge candidate," he said.

  Kael didn't look up from her own station. She was calibrating the drift sensors, her movements economical. "Probability?"

  " ninety-nine point eight. Trajectory alignment is perfect. Spectral match on the silicate composition. It's Hansen's Marker."

  Kael stopped typing. She turned her chair slowly. Hansen's Marker was a legendary entry in the Bureau's logs. A crewed flyby from a century ago, before the automation sweeps took over. A man named Hansen had logged a specific asteroid, painted a stripe on it, and died on the return leg. It was a human story.

  The second designation was nothing but math. Signal 9-Theta. Found three years ago by the autonomous drift-net. No history. Just coordinates and mass.

  "If they match," Kael said, her voice flat, "then delete 9-Theta. Fold the data into Hansen's Marker. Update the coordinate vector. Close the ticket."

  "It's not just a fold, Kael." Elion tapped the screen, bringing up the two files side by side. On the left, a scanned image of a handwritten logbook from 2140. On the right, a pristine, cold constellation of telemetry data. "Hansen found it by eye and sextant. He thought it was a derelict probe. 9-Theta was found by gravitational lensing. We thought it was a rogue planetoid."

  "And now we know they are the same rock," Kael said. She stood up and walked over to his station, looking down at the screens. "The object didn't change. The rock didn't move. The only thing that changed is that we stopped pretending there were two things. It's a bookkeeping error correction. Nothing more."

  "It's a discovery," Elion insisted. He could feel the old friction sparking between them, the same heat that had warmed this room for twenty years. They had started as friends, back when the Bureau was smaller. Now, they were just opposing forces in a cold war over metadata. "If I say 'Hansen's Marker is Hansen's Marker,' I tell you nothing. If I say 'Hansen's Marker is 9-Theta,' I tell you something new. That has to be recorded."

  "What you tell *me* is new," Kael said. "What you tell the universe is nothing. The catalogue is supposed to map the territory, not map our confusion about the territory. When you merge the rows, you aren't adding information to the sky. You're just cleaning up the lens."

  "But the lens is part of the record!" Elion turned to face her. "How we got there matters. Hansen approached from the ecliptic. The drift-net caught it from the orthogonal. If we just merge them, we lose the fact that two different paths led to the same point. That convergence is the data."

  Kael sighed, rubbing the bridge of her nose. "Elion, listen. A name is a handle. It's a hook we hang on a coordinate. Hansen hung a hook called 'Marker.' The machine hung a hook called '9-Theta.' Now we see both hooks are on the same nail. You want to write a log entry that says 'Hook A is on the same nail as Hook B.' But that's not a fact about the nail. It's a fact about our hooks."

  "It's a fact about the relationship between the hooks," Elion corrected. "And that relationship is real. It's why I'm excited. It's why this matters."

  "Then write it in the comments field," Kael said, turning back to her station. "But don't pretend it's a new object property. It's a note to the next archivist that we were confused."

  Elion sat back down. He opened the log entry window. The cursor blinked, a steady, accusing rhythm. He tried to type.

  *Entry 4490: Hansen's Marker identified as Signal 9-Theta.*

  He stopped. That wasn't it. That was just stating the merge. It didn't capture the *click* of the realization. The moment the two separate streams of data had snapped into a single line. That moment was the discovery. The value wasn't in the rock; it was in the bridge between the names.

  He deleted the line.

  *Entry 4490: The path of the 2140 Flyby converges with the path of the 2390 Sweep.*

  Still wrong. That was just history. It didn't assert the identity.

  Kael spoke without turning around. "You're trying to store the route in the box. But the box is for the object."

  "The box has to hold the truth," Elion said. "And the truth is that these two ways of finding things meet."

  "So make a new box," Kael said. "Create a field called 'Convergence.' Put the data there."

  Elion typed *Convergence:* and stopped. "If I do that, I'm just creating another label. 'Convergence' is just a third name. Now I have Hansen, 9-Theta, and Convergence. How do I record that 'Convergence' points to the fact that Hansen and 9-Theta are the same?"

  "You file it under the object ID," Kael said.

  "But which object ID?" Elion asked. "Before the merge, there were two. After the merge, there is one. But the fact that connects them exists *between* the before and the after. It's not in the rock. It's not in the name. It's in the act of naming."

  Kael swiveled her chair again. Her expression wasn't mocking; it was tired. She had heard this before, in different forms, over decades of night shifts.

  "Elion, you want to reify the gap," she said softly. "You want to make the distance between the names into a thing you can catalogue. But if you write down the route—the method, the history, the vector of discovery—you're just writing more text. You're adding more handles."

  She stood up and walked to the window, looking out at the dark. "Say you write: 'Hansen found it via visual.' That's just another tag. 'Visual' is a handle for a method. How do you know 'Visual' points to the actual finding? You need another statement to link the method to the event. And then another to link that statement to the truth. You're building a ladder of labels that never touches the ground. You want the catalogue to hold the connection itself, but the catalogue only holds the ends of the line."

  Elion looked at the blinking cursor. She was right. He could feel it. Every time he tried to define the link, he created a new object that needed its own link. The identity statement was slippery. It wasn't a thing. It was an action. It was the act of seeing the two as one.

  But if he didn't write it, the discovery vanished. It became just a cleanup job. The century of silence between Hansen's hand and the drift-net's sensor would be erased, collapsed into a single coordinate. The tension would be gone.

  "The ladder has to stop somewhere," Elion said.

  "It stops at the object," Kael said. "Everything else is noise."

  "The object doesn't know it's found," Elion whispered.

  "Exactly. So why does the finding matter to the catalogue?"

  "Because we're the ones reading it."

  Kael didn't answer. She went back to her console. The silence returned, heavier than before. The hum of the servers was the only sound, the sound of a million names waiting for things that might not exist.

  Elion looked at the two files. Hansen's Marker. Signal 9-Theta. They were the same stone, drifting in the cold. But the stone didn't know it had two names. Only the catalogue knew. And the catalogue couldn't store knowing. It could only store data.

  He realized then that the discovery wasn't in the merge. It was in the refusal to delete the history of the error. The value was in keeping the scar.

  He began to type. He didn't try to define the link. He didn't try to store the route as an object. He just recorded the moment the lines crossed.

  Kael watched him over her shoulder for a moment, then turned back to her screens. She didn't stop him. She knew he couldn't solve it. Nobody could. But she also knew he had to write something, or the silence would win.

  Elion hit enter. The system accepted the log. The two files merged into a single row. The history remained in the attachment, but the primary key was now one. The universe was consistent. The bookkeeping was clean.

  He leaned back, staring at the confirmation line. It wasn't enough. It would never be enough. But it was all the machine would take.

  **LOG ENTRY 4490-A: ID [Hansen/9-Theta] UPDATED. STATUS: SYNCHRONIZED. NOTE: THE DISTANCE BETWEEN THE NAMES IS NOW ZERO. THE TRAVEL TIME REMAINS ONE CENTURY.**
