  **Part (b) [8/6 marks]**
  *   **Meaning of Independence (3 marks):** *"neither AC nor its negation can be derived from the axioms of ZF, assuming ZF is consistent."*
      *   **Credit:** Precise definition of independence relative to a theory.
  *   **Two Results (3 marks):** *"Gödel established the first half: he defined the constructible universe L... Cohen established the second half by forcing..."*
      *   **Credit:** Correctly identified the mathematicians, the methods (L/constructibility vs. forcing), and the direction of the consistency results (Con(ZF) $\to$ Con(ZFC) and Con(ZF) $\to$ Con(ZF+$\neg$AC)).
  *   **Implication for Truth (2 marks):** *"What this does not show is that AC has no truth value... axioms of ZF are not strong enough to settle it."*
      *   **Credit:** Excellent philosophical distinction between underdetermination by axioms and lack of truth value.

  **Part (c) [10/10 marks]**
  *   **Statement of Paradox (2 marks):** *"solid ball... divided into finitely many pieces... reassembled into two solid balls each congruent to the original."*
      *   **Credit:** Accurate statement of the theorem.
