answer: |-
  ### Mapping the Jury Theorem into Psychometric Vocabulary

  You propose treating the jury as a test instrument. This is structurally sound but ontologically risky. Below is the systematic translation you requested, flagging where psychometric commitments are smuggled in to make the theorem tidy.

  | Condorcet Component | Psychometric Analogue | Strain / Smuggled Assumption |
  | :--- | :--- | :--- |
  | **Voters** | **Items** | **Strained:** Voters are agents with causal powers; items are static stimuli. Treating voters as items assumes their competence is a fixed parameter like item difficulty, ignoring strategic or social dynamics. |
  | **Binary Question** | **Latent Trait ($\theta$)** | **Smuggled:** IRT assumes $\theta$ is continuous and varies across persons. CJT assumes Truth is binary and fixed for the jury. Mapping Truth to $\theta$ imports a continuous latent dimension where none exists. |
  | **Competence ($p$)** | **Item Information / Discrimination** | **Distorted:** $p$ is a marginal probability. In 2PL, probability depends on $\theta$. Treating $p$ as fixed assumes the "difficulty" of the truth is zero or constant, collapsing the item response function to a single point. |
  | **Independence** | **Local Independence** | **Clean but Conditional:** Both require responses to be uncorrelated conditional on the latent variable (Truth/$\theta$). However, CJT independence is causal (no communication); IRT independence is statistical (no residual correlation). |
  | **Majority Verdict** | **Total Score (Summed)** | **Clean:** Both are simple sums of binary responses used as the estimator for the latent state. |
  | **Jury Size** | **Test Length** | **Clean:** Both $n$ voters and $n$ items drive the precision of the aggregate estimate. |
  | **Asymptotic Infallibility** | **Reliability $\to$ 1 (Spearman-Brown)** | **Distorted:** Spearman-Brown assumes parallel measures measuring the *same* trait. CJT assumes voters track an *external* fact. Reliability $\to$ 1 implies consistency, not necessarily validity (truth). |

  ### Residue and The Three Knots

  The translation above sorts into three categories: those that translate cleanly, those that translate with distortion, and those with no expression at all. The "clean" mappings (Size, Verdict, Independence structure) rely on the algebraic similarity of summing binary variables. The "distorted" mappings reveal where your framework forces the philosophy into a shape it does not naturally hold. The "no expression" category captures the ontological gaps your partner suspects.

  **Knot 1: The Role of Theta and Truth**
  In IRT, $\theta$ is a continuous latent trait distributed across a population. In CJT, Truth is a binary state of the world fixed for all voters. To make the translation work, you must smuggle in the assumption that **Truth operates as a latent dimension**. You are implicitly modeling the "state of the world" as a point on a continuum where the jury's score estimates location. But CJT does not estimate *where* we are; it estimates *which* side of a line we are on. Furthermore, standard IRT presupposes a distribution of $\theta$ to estimate parameters. CJT makes no assumption about the distribution of Truths across questions, only the competence on *this* question. The psychometric framework lacks a native expression for a fixed, binary, external criterion that does not vary across the "examinees" (juries).

  **Knot 2: Correlation and Reliability**
  You note that in psychometrics, correlation among items is evidence of coherence (unidimensionality), while in the seminar, correlation among voters is a fatal defect (common cause bias). The distinction turns on **what explains the correlation**. In IRT, correlation is desirable if explained by $\theta$ (the construct) but undesirable if explained by nuisance factors (local dependence). In CJT, correlation is desirable if explained *solely* by Truth, but fatal if explained by shared bias (e.g., reading the same erroneous newspaper).
  The psychometric analogue of "correlation running through the truth" is **validity**, whereas "correlation running around it" is **local dependence** or **method effect**. However, IRT typically assumes the former is good and the latter is bad without always distinguishing them empirically without external data. CJT highlights that if the common cause is *not* the Truth (e.g., a shared heuristic), reliability (consistency) might remain high while validity (accuracy) collapses. Your framework measures the former; the theorem demands the latter.

  **Knot 3: The Absence of Validation**
  Psychometrics relies on calibration against a criterion or a known population distribution. A jury votes without access to the answer key. This absence has a name in your framework: **unsupervised parameter estimation**. In IRT, you cannot simultaneously estimate item difficulty and person ability without constraints (like fixing the mean of $\theta$). CJT solves this by stipulating $p > 0.5$. This is not a statistical estimate but an **axiomatic constraint**. Without this axiom, the model is unidentified. The consequence is that psychometrics can detect misfitting respondents (person-fit statistics), but a jury cannot detect a "misfitting voter" without knowing the truth. The framework lacks resources to validate the instrument *in situ* without external criteria.

  ### Closing Judgement

  Your seminar partner argues that the theorem concerns a fact of the matter not constituted by anyone's disposition to answer correctly, whereas psychometrics measures only dispositions. He is right, but the implication requires nuance.

  Psychometrics is inherently operationalist: it defines ability by the probability of correct response. It cannot express the distinction between "high competence" and "correct truth" without an external key. If every voter has $p=0.9$ but the question is flawed (no determinate truth), psychometrics sees a reliable scale; CJT sees a void. Your vocabulary cannot express the **ontological status of the criterion**. You can model the *tracking* of truth, but not the *existence* of truth independent of the tracking.

  Does this indict psychometrics for lacking resources, or the jury-theorem literature for being less determinate than it sounds? It indicts neither, but it clarifies their domains. Psychometrics is a theory of **measurement precision**; CJT is a theory of **epistemic aggregation**. The residue indicates that psychometrics lacks the ontological commitments to guarantee validity, only reliability. If you accept that distinction, your vocabulary is not reductive, but it is incomplete for epistemology. You can model how well the jury agrees (reliability), but you cannot model whether they are right (truth) without importing the philosophical axiom that $p > 0.5$ relative to a reality you cannot measure.

  The smuggled assumption you must catch is this: **operational validity**. By mapping Truth to $\theta$, you assume that consistency implies correctness. The seminar's focus on independence warns that consistency can be manufactured by shared error. Your framework treats shared variance as signal; the theorem treats some shared variance as noise. Until you can distinguish variance due to the World from variance due to the Collective, your translation remains a model of agreement, not knowledge. Accept this limitation not as a failure of statistics, but as the boundary where measurement ends and philosophy begins.
