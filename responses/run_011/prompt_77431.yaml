answer: |-
  ### 1. Brainstorming Candidate Principles

  Here are three candidate principles that could generate your pattern of verdicts, drawing on different epistemological traditions.

  **Candidate 1: The Lakatosian Problem-Shift.**
  This principle judges theories not by single predictions but by whether modifications to save them are "progressive" or "degenerating." A modification is progressive if it leads to novel, risky predictions that are subsequently verified; it is degenerating if it only accommodates past anomalies.
  *Implication for Case 2 vs. 3:* Malthus 1803 (Case 2) looks degenerating: "moral restraint" was added to explain why collapse hadn't happened yet, not to predict a specific new phenomenon. Hubbert (Case 3) looks progressive: the US model was built first, and the global prediction was a novel extrapolation from that specific geological mechanism, even if the timing slipped.

  **Candidate 2: Independent Parameterization of Interference.**
  This principle relies on the technical forecaster's distinction between model error and input error. A prediction is "right but early" only if the factor delaying the outcome (the interference) can be quantified independently of the theory's failure. If you must infer the strength of the interference *from* the fact that the prediction failed, the theory is empty.
  *Implication for Case 2 vs. 3:* Hubbert wins because we can measure oil reserves and extraction technology independently of the price peak. Malthus loses because "ingenuity" or "moral restraint" are often inferred solely from the absence of famine, making them post-hoc fudge factors.

  **Candidate 3: Mechanism Capacity vs. Trigger Conditions.**
  Drawing on the idea that laws state capacities rather than regularities, this principle distinguishes between the existence of a causal power and the conditions for its manifestation. A theory is "right but early" if the capacity is demonstrated in a controlled setting, even if global trigger conditions haven't aligned.
  *Implication for Case 2 vs. 3:* Hubbert wins because the US contiguous 48 states acted as a controlled setting where the mechanism (geological depletion) operated without external interference. Malthus loses because there is no closed system where population *actually* outgrew subsistence solely due to geometric growth without other variables intervening; the mechanism was never isolated.

  ### 2. The Committed Principle

  I commit to a refined version of **Candidate 2**, which I will call the **Principle of Independent Defeasibility**. It treats "right but early" not as a pardon for failure, but as a specific claim about the causal structure of the delay.

  **Clause 1: The Isolation Requirement.**
  To claim a mechanism is real despite a failed global prediction, the proponent must demonstrate the mechanism operating in a subsystem where confounding variables are minimized or absent.
  *   *Motivating Case:* **Case 3 (Hubbert).** The US lower-48 peak validated the geological mechanism in a bounded system where "deepwater" and "shale" (the global deferring factors) were not yet in play. This isolates the capacity from the interference.

  **Clause 2: The Independent Measure of Deferral.**
  A prediction that fails due to interference counts as "right but early" only if the interfering factor can be measured or specified without reference to the prediction's failure. If the existence or magnitude of the deferring factor is inferred solely from the fact that the catastrophe did not occur, the theory is degenerating.
  *   *Motivating Case:* **Case 8 (Peak Phosphorus).** Here, the reserve estimates were revised *because* the peak didn't happen. The deferral (more reserves) was inferred from the failure. Contrast this with **Case 6 (Y2K)**, where the fix (code rewriting) was a measurable input independent of the system's stability.

  **Clause 3: The Specificity of Aversion.**
  For a prevented harm to confirm a theory (Mobilised Aversion), the preventive action must target the specific mechanism identified by the theory. General improvement or unrelated technological progress does not count as confirmation.
  *   *Motivating Case:* **Case 7 (Ozone).** The Montreal Protocol targeted CFCs specifically. This contrasts with **Case 1 (Malthus 1798)**, where "improvement" was general economic growth, not a specific check on population geometry.

  ### 3. Testing Your Proposal

  Your tentative principle has two clauses: *Exhaustible Deferral* (A) and *Mobilised Aversion* (B). Here is how they break against your ten cases, and the minimal repair required.

  **Where Clause A (Exhaustible Deferral) Breaks:**
  *   **Case 6 (Y2K):** The deferral was not "exhaustible" in the resource sense; it was a repair. The code didn't run out; it was rewritten. Your clause implies Y2K shouldn't count as confirmed, but your verdict says it is.
  *   **Case 3 (Hubbert):** You correctly identify this as satisfying A. However, Clause A is too narrow. It excludes cases where the deferral is renewable but *measurable* (e.g., policy changes).
  *   **Case 1 & 2 (Malthus):** You claim human ingenuity is self-renewing and thus permanently blocks the theory. This is the crux of your dispute. Clause A handles this well *if* ingenuity is treated as a black box. But if ingenuity is a function of price signals (as your friend suggests), it becomes endogenous.
  *   **Repair:** Change "Exhaustible" to "Independently Quantifiable." A deferral counts if we can measure the force stopping the prediction without looking at the prediction's failure. Oil reserves are quantifiable; "human ingenuity" usually is not, unless specified as a specific technology (like shale fracking).

  **Where Clause B (Mobilised Aversion) Breaks:**
  *   **Case 3 (Hubbert):** You admit this fails B (nobody stopped drilling because of Hubbert), yet you want to call it confirmed. Clause B is too strict; it excludes "passive" confirmations where the mechanism is real but simply outpaced.
  *   **Case 5 (Limits to Growth):** You call this "not confirmation" because of internal flexibility. Clause B doesn't capture *why*. It's not about aversion; it's about the model's ability to absorb any data trajectory.
  *   **Repair:** Add a "Mechanism Isolation" condition (as in my Clause 1 above). Aversion is not required if the mechanism is proven in a subsystem (Hubbert US).

  **Is the Repair a Fudge?**
  Expanding "Exhaustible" to "Independently Quantifiable" is a genuine refinement. It moves the criterion from the *ontology* of the deferrer (does it run out?) to the *epistemology* of the deferrer (can we measure it?). This solves the Y2K problem (we can count lines of code fixed) and the Phosphorus problem (we cannot count reserves except by assuming the peak hasn't happened).

  ### 4. Application to Four New Cases

  **Case 11: Marx's Falling Rate of Profit.**
  *Prediction:* Capitalist competition drives down the rate of profit, leading to systemic collapse.
  *Observation:* Profits have fluctuated but not collapsed over 150 years.
  *Application:* Deferral factors include counteracting tendencies (cheapening of constant capital, expansion into new markets). Are these independently quantifiable? Often, they are inferred from the survival of capitalism itself.
  *Verdict:* **Wrong, not early.** Like Malthus, the rescue hypotheses are degenerating. There is no "subsystem" where the rate of profit fell to zero solely due to the mechanism without intervention.

  **Case 12: The 1919 Eclipse (General Relativity).**
  *Prediction:* Light bends near massive objects by a specific amount.
  *Observation:* Confirmed during the solar eclipse.
  *Application:* This is not a long-run forecast, but it tests Clause 1 (Isolation). The eclipse provided a natural experiment isolating gravity's effect on light from other forces.
  *Verdict:* **Confirmed.** It satisfies the Isolation Requirement perfectly. It shows the principle applies to physics, not just resources.

  **Case 13: AI Takeoff (Singularity Forecasts).**
  *Prediction:* AI intelligence will explode recursively, surpassing humans by date X.
  *Observation:* Progress is steady but not explosive; dates pass.
  *Application:* Deferral factors are "algorithmic bottlenecks" or "compute limits." Can we measure these independently? We can measure compute (FLOPS), but the "intelligence" variable is not independently quantifiable.
  *Verdict:* **Not respectable (yet).** Like Peak Phosphorus, the definition of "intelligence" often shifts to ensure the prediction remains just out of reach. Until "intelligence" is as measurable as "barrels of oil," this is unfalsifiable.

  **Case 14: The 2008 Financial Crisis (Systemic Risk Models).**
  *Prediction:* Pre-2008 models said extreme correlations were impossible (10-sigma events).
  *Observation:* They happened.
  *Application:* Post-crisis, models were adjusted to include "fat tails."
  *Verdict:* **Wrong, not early.** The deferral (stability) was assumed by the model, not measured. When the model failed, the assumption was changed. This is a degenerating shift. Contrast with **Case 9 (Cod)**: The biological mechanism (reproduction rate) was independent of the model, and the collapse happened when the external deferrer (distant fleets) hit a limit.

  ### 5. Which Verdicts Must Be Abandoned?

  You must abandon the ambivalent status of **Case 2 (Malthus 1803)**.

  You want to penalise it as *ad hoc* but credit it as *prescient*. Epistemologically, you cannot do both. If "moral restraint" is an *ad hoc* rescue hypothesis introduced to explain away an anomaly (the lack of famine), it cannot simultaneously serve as confirmation of the theory's core mechanism.
  *   **Why:** For the demographic transition to count as vindication, Malthus would have needed to predict that *as incomes rose, fertility would fall*. He did not. He predicted that *as incomes rose, population would rise until checked by misery or vice*. He added "moral restraint" to explain why misery hadn't arrived, not to predict a voluntary decline in fertility driven by opportunity costs.
  *   **The Cost:** You must concede to your friend that Malthus 1803 is a degenerating research programme. The "preventive check" was a patch, not a prediction. The fact that fertility fell later is a lucky coincidence, not a confirmation.
  *   **What to Keep:** You can keep **Case 3 (Hubbert)**. The US peak was a genuine prediction based on a measurable parameter (geology). The global delay was due to measurable parameters (technology/policy), not a redefinition of "oil."

  If you hold to the **Principle of Independent Defeasibility**, Case 2 fails Clause 2 (Independent Measure). "Moral restraint" was not measured; it was inferred from the absence of famine. Case 3 passes Clause 1 (Isolation) because the US lower-48 was a closed system that validated the mechanism before the global interference (shale/deepwater) became relevant.

  ### 6. The Direct Answer to Your Friend

  Is "right but early" a genuine epistemic category or a socially useful way of declining to score a theory?

  **It is a genuine epistemic category, but only under strict conditions.**

  Your friend is correct that the phrase is often used as a licence to make claims that cannot fail. In 90% of usage, it is a rhetorical shield against falsification. However, in the remaining 10%, it names a real distinction between **latency** and **refutation**.

  A theory is "right but early" if and only if:
  1.  **The Mechanism is Isolated:** The causal power has been demonstrated in a context where interfering variables were absent (Hubbert's US oil).
  2.  **The Interference is Measurable:** The reason the prediction hasn't manifested globally is due to a counter-force that can be quantified without referencing the prediction's failure (Y2K code fixes, Montreal Protocol CFC bans).

  If the "deferral" is "human ingenuity," "market adaptation," or "complexity" without a specific metric, your friend is right: the claim is empty. It is a "degenerating problem shift" that protects the theory from ever being wrong.

  **The Verdict on Malthus:**
  Malthus 1798 was wrong, not early, because the mechanism (geometric growth) was refuted by the demographic transition, which operated on a logic (opportunity cost) he did not specify. Malthus 1803 was a rescue operation that happened to align with later history, but it was not confirmed by it.

  **The Verdict on Hubbert:**
  Hubbert was right but early on the global peak. The mechanism (depletion) was proven in the US. The delay (technology) is measurable. The prediction remains live, merely shifted in time by a quantifiable amount.

  **Conclusion:**
  You can defend "right but early" against your friend, but only by surrendering Malthus. If you defend Malthus as "right but early," you validate the very unfalsifiability your friend accuses you of. If you abandon Malthus to save Hubbert, you prove that "right but early" is a rigorous category reserved for theories that specify *exactly* what is stopping them from being right *now*.
