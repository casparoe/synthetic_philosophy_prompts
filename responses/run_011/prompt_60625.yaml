answer: |-
  **Proposal: Temporal Profiles and the Lexical Threshold of Suffering**

  **1. The Research Question**
  Does the lexical threshold for suffering—the intensity level at which pain becomes incomparable to any quantity of mild pleasure—depend on the temporal continuity of the subject's experience? Standard lexical views treat this threshold as a fixed point on a scale of raw intensity. I propose that the threshold is endogenous to the temporal profile of the life in question. Specifically, I will argue that pain isolated by interruptions (such as unconsciousness) carries greater lexical weight than phenomenally identical pain embedded in a continuous stream of consciousness. The determinate question is: Can a variable lexical threshold, sensitive to temporal isolation, resolve intuitions about suffering that fixed-threshold views cannot, without collapsing into intransitivity or negative utilitarianism?

  **2. The Gap in Existing Literature**
  Current debates on lexical views focus almost exclusively on intensity and aggregation. Proponents argue that a fixed threshold is necessary to avoid the conclusion that enough mild pleasures can outweigh extreme torture. Opponents argue that fixed thresholds create sorites problems (where exactly is the line?) or violate transitivity (if A is better than B, and B better than C, A must be better than C).

  However, both sides assume the badness of a pain episode is intrinsic to its intensity and duration. They treat time as a container for summing units of value, not as a constituent of the value itself. Work on the "shape of a life" considers whether goods clustered together matter more than goods spread apart, but this is usually applied to aggregation within a single valence, not to lexical comparisons between valences. There is no existing account that asks whether the *lexical status* of a pain shifts based on its narrative or phenomenal context. This is a real gap, not a manufactured one: fixed-threshold views cannot explain why an hour of torture followed by unconsciousness feels morally distinct from an hour of torture followed by normal life, even if the total sum of pleasure remains constant. They must treat the unconscious stretch as neutral, leaving the pain's weight unchanged. My project tests whether making the threshold variable solves this without introducing new paradoxes.

  **3. Methodology and Plan of Work**
  The paper will proceed in three stages, moving from formal constraints to mechanism to application.

  *(a) Formal Constraints and the Toy Model*
  I will construct a toy model where the lexical threshold $T$ is a function not just of intensity $I$, but of temporal isolation $k$. The core equation will test whether $Badness = f(I, Duration, k)$ can maintain transitive ordering. The primary technical challenge is blocking the sorites without merely relabeling it. If $T$ shifts based on context, does a series of small changes in context create a slippery slope where torture becomes permissible? I will define bounds for $k$ to ensure the view does not collapse into straight negative utilitarianism (where $T$ is so low nothing outweighs pain) or effective nihilism (where $T$ is so high it never triggers). The model will be schematic rather than fully axiomatic, sufficient to demonstrate logical coherence within the word limit.

  *(b) Pinning Down the Mechanism*
  "Temporal isolation" is ambiguous. I will evaluate three candidates for what drives the shift in lexical weight:
  1.  **Phenomenal Interruption:** The mere cessation of consciousness (e.g., dreamless sleep).
  2.  **Memory and Anticipation:** Whether the pain is remembered or anticipated by the subject.
  3.  **Narrative Unity:** Whether the pain is integrated into a coherent life story.
  These come apart. A person under anesthesia has phenomenal interruption but no memory. A person in constant pain has narrative unity but no interruption. I will commit to **Phenomenal Interruption** as the primary driver, arguing that it is the most distinct from standard aggregation views. I will explicitly account for the cost of this commitment: it implies that states lacking consciousness are not merely neutral but may actively alter the value of past conscious states.

  *(c) Case Studies and Verdicts*
  I will test the model against three specific cases where standard views and my proposed view diverge. I will produce a table of verdicts comparing the two.
  1.  **Palliative Sedation:** Clinicians induce unconsciousness to relieve refractory suffering. Standard views say this is good because it stops the pain. My view risks saying this is problematic if the unconsciousness isolates the preceding pain, increasing its lexical weight.
  2.  **Accidental Awareness Under Anesthesia:** A patient feels pain while paralyzed, then returns to unconsciousness. Does the isolation make this worse than being awake and recovering?
  3.  **Episodic vs. Continuous Pain:** Is a year of constant mild pain worse than ten years of the same pain broken by pain-free months?
  These cases are chosen because they force a choice between clinical intuition and theoretical consistency.

  **4. Success and Failure Conditions**
  I am defining success and failure narrowly to ensure the project is completable in ten weeks.

  *Success:* The model produces a transitive ordering that matches the core intuition (Case B is worse than Case A) without requiring $T$ to fluctuate wildly. The view offers a plausible explanation for why isolation amplifies suffering (e.g., by preventing "dilution" through future goods) and handles at least two of the three case studies without counterintuitive results.

  *Failure:* There are two specific failure modes I will monitor.
  1.  **The Unconsciousness Bug:** If the model implies that unconsciousness is intrinsically bad (rather than neutral) because it amplifies past pain, this is a major cost. I will treat this as a failure unless I can show this implication is actually a feature (i.e., that we have a reason to value continuous consciousness higher than we thought).
  2.  **Intransitivity:** If adjusting $T$ based on context creates cycles (A > B, B > C, C > A), the model is useless.
  If either occurs, the paper will pivot to a "failure report" analyzing why temporal sensitivity is incompatible with lexicality, rather than forcing a positive view. I would rather submit a clear-eyed explanation of why the idea doesn't work than a patched-up model that hides the contradiction.

  **5. Scope and Feasibility**
  Five thousand words is tight for a formal model plus case studies. To make this feasible alongside four other courses, I am making the following cuts:
  *   **No History:** I will not survey the history of lexical views or utilitarianism. I will refer to positions by description (e.g., "the standard additive view") without extensive exegesis.
  *   **No Population Ethics:** I will restrict the analysis to individual lives. Extending this to non-identity problems or future generations adds complexity that cannot be managed in 5,000 words.
  *   **Schematic Model:** The formal section will be a logical sketch, not a full mathematical proof. The goal is to show coherence, not derive theorems.
  *   **Single Mechanism:** I will not try to solve the debate between memory vs. narrative vs. interruption. I will select one (interruption) and note the others as limitations.

  *Deliverables:*
  1.  A schematic formal model defining the variable threshold.
  2.  A comparison table showing verdicts for the standard view vs. the proposed view on the three test cases.
  3.  A dedicated "Limitations and Failure Modes" section (approx. 1,000 words) analyzing the unconsciousness bug and transitivity risks.

  This scope ensures I can draft the core argument by week 6, leaving weeks 7–9 for revision and polishing, with a buffer for unexpected complications in the formal sketch.
