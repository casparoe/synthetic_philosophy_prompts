prompt: |-
  I have a philosophy background and am in the second year of a law degree, and I am drafting a seminar paper around a tension I keep running into but cannot yet name. A classmate of mine, who came to law school from litigation practice and considers himself a realist, is confident I am inventing the problem, which is partly why I want it stated carefully rather than waved at. Here is the practice I want analyzed. In common-law systems courts treat earlier decisions of their own court and of courts above them as binding, and they do so even where the earlier decision is widely thought mistaken; the ordinary route of escape is not overruling but distinguishing — locating the present facts outside the earlier holding — with the result that a line of distinctions can narrow a precedent almost past recognition while leaving it formally intact and still cited. When courts do overrule, the traditional self-description was that the overruled decision was never really the law at all but an error now exposed and corrected, which carries the implication that the corrected rule governs transactions closed years earlier under the discredited understanding. In the twentieth century, though, American courts developed the technique of prospective overruling, announcing that a new rule would govern only conduct occurring after the decision and leaving past transactions settled under the old one, with the justification usually framed in terms of the parties' reliance on the law as it stood when they acted. Meanwhile, in at least one jurisdiction a highest court that had for generations regarded itself as absolutely bound by its own decisions released itself by means of a brief announcement that it would depart from them when it appeared right to do so.

  What I want is not a defense or a critique of precedent but a reconstruction of what this cluster of practices presupposes. Start with the most basic question: does the binding force of precedent make sense only if judges make law, so that a later court is constrained by an earlier court's exercise of creative power — or only if judges find it, so that no one is ever bound by anything but the pre-existing law and the earlier decision was simply a misreport of it? Both descriptions are alive in the same body of doctrine, sometimes in the same opinion, and I want to know whether one of them is doing all the work or whether there is a coherent position that occupies the space between them. Then separate the components. Does treating a decision as binding presuppose the same thing as preferring distinction to overruling, and does prospective overruling presuppose the same thing as either? I suspect that a court which overrules prospectively has quietly conceded that it legislates, since only a lawmaker can choose the effective date of a rule, and that this concession is in tension with the declaratory self-description that the rest of the machinery still runs on — but I would rather you test that suspicion than simply elaborate it.

  I would also like the following addressed explicitly. First, distinguish what the practice strictly presupposes from what it merely sits comfortably with: must binding precedent commit one to a positivist account on which judicial decisions are themselves sources of law, or could a view on which there is always a single right answer, recoverable by constructing the best account of the legal materials as a whole, license exactly the same behaviour? Could a prediction-oriented realist, for whom law is just what courts will do, make sense of a court feeling bound? Second, the point my paper is really about: does this practice presuppose that legal outcomes are contingent yet locked in — that a particular decision reached by particular people at a particular moment permanently narrows what later courts may say — or does its official rhetoric presuppose the opposite, that the answer was there all along and history decided nothing? And if the conjecture were correct that common law tends to drift toward workable or efficient rules regardless of its starting points, so that most early accidents are eventually absorbed or corrected, would the practice still presuppose the same thing, and what would it look like if the people inside it actually believed the conjecture? Third, whether the two appeals to reliance can be reconciled: refusing to overrule a bad decision because people have relied on it, and refusing to let an overruling disturb people who relied on the bad decision, invoke the same value while pulling in opposite temporal directions — tell me what a single principle would have to say to justify both, or show that they cannot both be justified. Finally, identify where the practice is philosophically underdetermined, so that several rival theories of law would license it equally well, and tell me what would concretely have to change — in the reasoning opinions give, in the vocabulary available to judges, in who wins the cases — if the presupposed view were replaced by its main rival. You do not need to cite cases or supply any bibliography; describe the doctrinal moves generically, and where a hypothetical would sharpen the point, invent one.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User Profile:** Philosophy background, 2nd-year law student. Drafting a seminar paper.
      *   **Core Problem:** A tension in common-law precedent practices (stare decisis) that the user senses but can't name. A realist classmate thinks it's illusory.
      *   **Specific Practices to Analyze:**
          1.  Binding precedent (even if mistaken).
          2.  Distinguishing vs. Overruling (narrowing while leaving intact).
          3.  Declaratory Theory (overruled decision was never law).
          4.  Prospective Overruling (new rule applies only to future conduct).
          5.  Practice Statement (UK 1966 style: releasing oneself from absolute bindingness).
      *   **Core Questions/Tasks:**
          1.  **Reconstruction:** What does this cluster presuppose? Is it judge-made law (positivist/realist) or found law (declaratory/natural law/Dworkinian)? Is there a coherent middle ground?
          2.  **Component Separation:** Do distinguishing, overruling, and prospective overruling presuppose the same things? (Specifically: Does prospective overruling concede legislation?)
          3.  **Strict Presupposition vs. Comfort:** Must this be positivist? Could a "single right answer" theory (Dworkin) or Realist prediction theory license the same behavior? Can a Realist make sense of a court *feeling* bound?
          4.  **Contingency vs. Necessity (The Main Point):** Does practice presuppose outcomes are contingent/locked-in (historical accident matters) OR that answers were always there (history decided nothing)? If the law drifts to efficiency (Posner), does the practice change? What if judges believed that?
          5.  **Reliance Tension:** Reconciling *not* overruling due to reliance vs. overruling *prospectively* due to reliance. Can one principle justify both?
          6.  **Underdetermination & Concrete Change:** Where is the practice philosophically underdetermined? What would concretely change (reasoning, vocabulary, outcomes) if the presupposed view were replaced by its rival?
      *   **Constraints:** No case citations, no bibliography. Use generic doctrinal moves. Use hypotheticals if helpful. Tone should be rigorous, analytical, suitable for a philosophy/law seminar paper.

  2.  **Deconstruct the Tension:**

      *   The tension is between the *Declaratory Theory* (judges find law, errors are nullities) and the *Positivist/Realist Reality* (judges make law, errors have consequences).
      *   The practices (distinguishing, prospective overruling) are hybrid mechanisms that try to have it both ways: stability (like made law) and correctness (like found law).
      *   The user's suspicion: Prospective overruling admits legislation.
      *   The user's main point: Contingency (history locks in paths) vs. Necessity (truth is timeless).

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the prompt. Name the tension. It's the "Ontological Status of Precedent." Is it *authority* or *truth*?
      *   **Section 1: The Core Reconstruction (Made vs. Found):**
          *   Analyze the "Binding Force." If law is found, a mistake isn't law, so why bind? If law is made, why pretend it's found?
          *   *Thesis:* The practice presupposes a "Constructive Authority." It treats past decisions as *sources* of obligation regardless of their truth-value, but masks this as fidelity to a timeless corpus.
          *   Address the "Middle Ground": It's not purely one or the other. It's a *fiction* of finding law that functions as *making* law.
      *   **Section 2: Component Separation (Distinguishing, Overruling, Prospective):**
          *   *Distinguishing:* Compatible with "Found Law." You aren't changing the rule; you're clarifying its scope. It preserves the declaratory fiction.
          *   *Retroactive Overruling:* Strictly requires "Found Law." If you overrule retroactively, you say "the old case was never law."
          *   *Prospective Overruling:* Strictly requires "Made Law." Only a legislator sets effective dates. This confirms the user's suspicion. It creates a rift in the ontology.
          *   *Practice Statement (UK 1966):* Admits discretion, moves toward "Made Law."
      *   **Section 3: Strict Presupposition vs. Comfort (Positivism, Dworkin, Realism):**
          *   *Positivism:* Comfortable. Precedent is a source.
          *   *Dworkin (Right Answer):* Can it fit? Yes, via "Integrity." Past decisions constrain not because they are commands, but because they are part of the narrative chain. But prospective overruling is hard for Dworkin (rights exist now, not later).
          *   *Realism:* Can a Realist make sense of *feeling* bound? Yes, as a sociological constraint or rule-following habit, but ontologically, the Realist knows the constraint is illusory. The *practice* presupposes normativity; the *Realist* describes causality.
      *   **Section 4: Contingency vs. Necessity (The Main Point):**
          *   *Practice:* Presupposes Contingency. If the answer were always there, distinguishing would be unnecessary; we'd just find the truth. The fact that we distinguish means the *fact* of the prior decision matters, not just its correctness. History locks in paths.
          *   *Efficiency/Drift:* If law drifts to efficiency, the *outcome* might look the same, but the *justification* changes. If judges believed this, they wouldn't talk about fidelity to the past; they'd talk about calibration. The "locked-in" nature would vanish.
          *   *Rhetoric:* Official rhetoric presupposes Necessity (we found the truth). Operational practice presupposes Contingency (we are stuck with this unless we distinguish).
      *   **Section 5: The Reliance Tension:**
          *   *Scenario A:* Keep bad rule because of reliance (Stare Decisis).
          *   *Scenario B:* Overrule but prospectively to protect reliance (Prospective Overruling).
          *   *Conflict:* One protects reliance on the *rule*, the other protects reliance on the *outcome* of the specific case while changing the rule.
          *   *Reconciliation:* A principle of "Minimum Disruption to Settled Expectations." But strictly, they pull apart. One prioritizes Stability (Rule), the other prioritizes Correctness (Rule) + Stability (Transaction).
          *   *Verdict:* They cannot be fully reconciled under a single coherent theory of *what law is*. One treats law as a settled expectation (Positivist), the other as a moral truth that shouldn't punish past ignorance (Declaratory/Legislative hybrid).
      *   **Section 6: Underdetermination & Concrete Changes:**
          *   *Underdetermination:* The *outcome* of cases is often underdetermined. Both a Dworkinian and a Positivist could reach the same result using different vocab.
          *   *Concrete Changes:*
              *   *If Positivist/Made Law:* Opinions would say "We are changing the policy." Retroactivity would vanish. Dissents would argue policy, not principle.
              *   *If Declaratory/Found Law:* Prospective overruling would vanish. Distinguishing would be more rigorous (logical scope), less manipulative.
              *   *Vocabulary:* Shift from "error/correction" to "policy/update."
              *   *Winners:* In prospective overruling, the litigant who brought the change loses (no benefit). In declaratory, they win.

  4.  **Refining and Polishing:**

      *   *Tone Check:* Needs to be academic, precise, avoiding colloquialisms. Use terms like "ontological status," "normative force," "declaratory theory," "positivist."
      *   *Addressing the Classmate:* The realist classmate says the problem is invented. I need to show why it's structural, not just verbal. The tension is *performative*.
      *   *Addressing the User's Suspicion:* Validate the suspicion about prospective overruling but nuance it. It's a "confession" embedded in the practice.
      *   *Structure:* Follow the user's requested order (Reconstruction -> Components -> Presupposition vs. Comfort -> Contingency -> Reliance -> Underdetermination/Change).

  5.  **Self-Correction during Drafting:**
      *   *Initial thought:* Maybe Dworkin fits perfectly.
      *   *Correction:* No, Dworkin struggles with prospective overruling because rights are trumps. If I have a right now, you can't say I only get it tomorrow. I need to highlight this friction.
      *   *Initial thought:* Reliance is easily reconciled.
      *   *Correction:* No, the prompt asks to test if they *can* be reconciled. I should argue they represent a fracture in the theory. One relies on the *rule* as a fact, the other relies on the *justice* of the transition.
      *   *Focus:* Ensure I answer the "Contingency vs. Necessity" question clearly. This is the heart of the paper. The practice *acts* as if history matters (contingency) but *speaks* as if it doesn't (necessity).

  6.  **Final Review against Constraints:**
      *   No cases? (Check. Use "Case A" or generic descriptions).
      *   No bibliography? (Check).
