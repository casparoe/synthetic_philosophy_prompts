answer: |-
  The tension you have identified is not illusory; it is structural. Your classmate, the practitioner, sees the machinery working and assumes the engine is sound. You, looking at the schematic, see that the engine is described as steam-powered but runs on electricity. The tension is ontological: it concerns the *kind of thing* a judicial decision is.

  Here is a reconstruction of the presuppositions of common-law precedent, analyzed through the specific doctrinal moves you identified.

  ### I. Reconstruction: The Ontology of the Precedent

  You ask whether the binding force of precedent makes sense only if judges make law (positivist/realist) or only if they find it (declaratory/naturalist). The practice you describe presupposes neither exclusively but relies on a **functional fiction** that oscillates between them to maintain systemic legitimacy.

  1.  **The Declaratory Baseline:** The default posture of the common law is the Declaratory Theory. Judges find the law; they do not make it. This explains why overruling is traditionally retroactive: if Case B overrules Case A, Case A was *never* law. It was a misstatement of the eternal legal truth. This preserves the separation of powers (judges don't legislate) and the rule of law (citizens are governed by law, not men).
  2.  **The Positivist Reality:** The practice of *stare decisis*—binding courts to earlier decisions even when "mistaken"—contradicts the Declaratory Theory. If law is found, a mistake is null. To bind a court to a mistake is to treat the *decision itself* as a source of law, independent of its correctness. This is a positivist move: the command of the sovereign (or the institutional fact of the decision) creates the obligation.

  **The Coherent Middle Ground?**
  There is no stable theoretical middle ground, but there is a stable *practical* one. The system presupposes that judicial decisions are **authoritative interpretations that constitute the law provisionally.**
  *   They are not "made" in the sense of arbitrary will (constrained by principle and prior text).
  *   They are not "found" in the sense of pre-existing metaphysical truth (since they can be overruled).
  *   **Reconstruction:** The practice presupposes that the *institutional history* of the court is itself a source of law. The "law" is not the abstract rule, nor the specific command, but the **trajectory of the institution.** This allows a court to say, "We are bound by this" (institutional continuity) while also saying, "This was wrong" (moral/legal critique).

  ### II. Component Separation

  You suspect that prospective overruling concedes legislation. You are correct, and this creates a fracture in the doctrinal machinery.

  1.  **Distinguishing:** This is compatible with the Declaratory Theory. By distinguishing, the court claims it is not changing the rule but clarifying its scope. The earlier holding remains "true" for its specific facts; the new case simply falls outside its gravitational field. This preserves the fiction that the law is a coherent, pre-existing web.
  2.  **Retroactive Overruling:** This strictly requires the Declaratory Theory. To apply a new rule to past conduct is to assert that the new rule was *always* the law. The prior decision is treated as a nullity.
  3.  **Prospective Overruling:** This strictly requires a Positivist/Legislative Theory. Only a lawmaker can decide that a rule is "good for the future" but "not the truth of the past." By limiting the temporal effect, the court admits that the old rule *was* the law (otherwise, reliance on it would be irrelevant) and that the new rule is a *change* (otherwise, it would apply retroactively).
      *   **Testing your suspicion:** Prospective overruling is indeed a quiet concession of legislative power. It breaks the declaratory fiction. It treats the court as a manager of social consequences rather than a discoverer of truth.
  4.  **The Practice Statement (Self-Release):** When a highest court announces it is no longer absolutely bound by its own decisions, it shifts the presupposition from **Necessity** (we must follow the law) to **Discretion** (we should follow the law unless it is expedient not to). This moves the system closer to Positivism but retains the rhetoric of principle to avoid the charge of arbitrariness.

  ### III. Strict Presupposition vs. Theoretical Comfort

  You ask whether the practice *must* commit one to positivism or if other theories can license it.

  1.  **Positivism:** The practice sits most comfortably here. If law is a social fact, precedent is a source of law. Distinguishing and overruling are merely techniques for updating the social fact. Prospective overruling is unproblematic: it is simply a rule about the rule's effective date.
  2.  **The "Single Right Answer" (e.g., Dworkin):** Can a theory of "law as integrity" license this?
      *   *Yes, regarding Distinguishing:* A judge constructs the best narrative of the legal materials. Distinguishing is part of refining that narrative.
      *   *No, regarding Prospective Overruling:* If there is a single right answer about the parties' rights *now*, a court cannot say, "You have the right, but we won't enforce it until tomorrow." Rights, in this view, are trumps that exist timelessly. Prospective overruling implies rights are created by the court, not derived from the best interpretation of the community's political morality.
      *   *Can they license the same behavior?* Superficially, yes. A Dworkinian judge might distinguish a case for the same reason a Positivist does. But the *justification* differs. The Positivist says, "Policy dictates stability." The Dworkinian says, "Integrity demands we fit this into the narrative."
  3.  **Realism (Prediction-Oriented):** Can a Realist make sense of a court *feeling* bound?
      *   *Ontologically:* No. For the Realist, the law *is* the prediction. If the court feels bound, that feeling is just another data point in the prediction.
      *   *Normatively:* The Realist cannot explain the *obligation*. The Realist can explain why the judge *does* it (habit, career security, institutional role), but cannot explain why the judge *should* feel bound if the outcome is unjust. The practice presupposes normativity (ought); Realism describes causality (is). Therefore, a strict Realist cannot justify the practice, only describe it.

  ### IV. Contingency vs. Necessity (The Core Tension)

  This is the heart of your paper. Does the practice presuppose that outcomes are contingent (locked in by history) or necessary (always there)?

  1.  **Operational Presupposition (Contingency):** The machinery of *stare decisis* presupposes **Contingency.** If the answer were always there, the specific identity of the prior court would not matter; only the correctness of the reasoning would. But we bind ourselves to *this* court's decision, not just to "the truth." The fact that *Case A* was decided in 1950 by *Judge X* narrows the path for *Case B* in 2024. History locks in the path. Distinguishing is the art of navigating a path created by accident and authority, not just logic.
  2.  **Rhetorical Presupposition (Necessity):** The official rhetoric presupposes **Necessity.** Opinions speak of "discovering" the rule, "correcting" errors, and "aligning" with principle. This rhetoric denies that history decided anything; it claims history merely revealed what was always true.
  3.  **The Efficiency Drift Conjecture:** Suppose the common law inevitably drifts toward efficient rules (Posner), absorbing early accidents.
      *   *Does the practice presuppose the same thing?* No. If judges believed the law inevitably corrects itself toward efficiency, the strictness of *stare decisis* would weaken. Why be bound by an inefficient precedent if the system guarantees it will be fixed later?
      *   *What if they believed it?* If judges explicitly believed in the efficiency drift, the practice would look like **Common Law Legislation.** They would stop distinguishing disingenuously. They would say, "This rule was efficient for 1950; it is inefficient for 2024; we update it." The "locked-in" nature of precedent would vanish. The tension you feel exists precisely because judges *do not* believe the system automatically corrects itself, yet they *do not* want to admit they are manually correcting it.

  ### V. The Two Appeals to Reliance

  You ask if the two reliance arguments can be reconciled:
  1.  **Refusing to Overrule:** "We keep the bad rule because people relied on it." (Stability of the Rule)
  2.  **Prospective Overruling:** "We change the rule but protect those who relied on the bad one." (Stability of the Transaction)

  **The Conflict:**
  *   Argument 1 treats the **Rule** as the object of reliance. It sacrifices correctness for stability.
  *   Argument 2 treats the **Transaction** as the object of reliance. It sacrifices the declaratory fiction (that the new rule was always law) for fairness.

  **Can a Single Principle Justify Both?**
  Only a principle of **Minimum Disruption to Settled Expectations.**
  *   *Justification:* The law's purpose is to coordinate behavior. Disrupting coordination is the primary evil.
  *   *Application:* If overruling disrupts too many settled expectations, don't overrule (Argument 1). If overruling is necessary for future coordination but would punish past actors, limit the disruption to the future (Argument 2).
  *   *The Fracture:* This principle works pragmatically but fails ontologically. Argument 1 implies the old rule *is* law (because reliance validates it). Argument 2 implies the old rule *was* law (because reliance protected it) but the new rule *is* law (because it governs the future).
  *   **Verdict:** They cannot be reconciled under a single theory of *what law is*. They are pragmatic patches applied to a theoretical hull that has sprung a leak. One protects the *system's* authority; the other protects the *litigant's* fairness.

  ### VI. Underdetermination and Concrete Change

  Finally, where is the practice philosophically underdetermined, and what would change if the presuppositions shifted?

  **Underdetermination:**
  The practice is underdetermined regarding the **source of obligation.** A Positivist and a Dworkinian can agree on the outcome of a distinction. The Positivist says, "We follow the prior court to maintain order." The Dworkinian says, "We follow the prior court to maintain integrity." The *doctrinal move* (distinguishing) looks identical. The law does not force you to choose the ontology to resolve the case.

  **Concrete Changes if the View Were Replaced:**

  Imagine we replace the current hybrid (Declaratory Fiction + Positivist Reality) with a **Pure Positivist/Legislative Model** (admitting judges make law).

  1.  **Reasoning in Opinions:**
      *   *Current:* "We distinguish *Smith* because the principle therein does not extend to these facts." (Logic/Principle)
      *   *New:* "We depart from *Smith* because its rule creates poor incentives in the modern market." (Policy/Consequence)
  2.  **Vocabulary:**
      *   *Current:* "Error," "Correction," "Discovery," "Principle."
      *   *New:* "Update," "Policy Shift," "Effective Date," "Rule Change."
  3.  **Who Wins:**
      *   *Current (Prospective Overruling):* The litigant who argued for the new rule **loses** their case (the rule applies only to the future). They bear the cost of the legal update for the benefit of strangers.
      *   *New (Pure Legislation):* If the court admits it is legislating, it might apply the rule retroactively (as a correction of injustice) or create a compensation scheme. But more likely, the litigant who brings the change would be **rewarded** (retroactive application), as is common in administrative agency rulemaking when a rule is found unlawful.
  4.  **Distinguishing:**
      *   *Current:* Courts strain to find factual differences to avoid overruling.
      *   *New:* Courts would overrule openly. Distinguishing would decline because there is no need to preserve the "truth" of the old case.

  **Conclusion for Your Paper:**
  The tension you feel is the friction between the **legitimacy** of the court (which requires it to look like it finds law) and the **function** of the court (which requires it to make law). The practices you listed are not coherent theoretical positions; they are **stabilizing mechanisms.** They allow the system to change without admitting it is changing. Your realist classmate sees the stability and calls it reality. You see the mechanism and call it a problem. Both are right, but your observation exposes the cost: the cost is borne by the litigant in prospective overruling cases, and by the coherence of legal theory in distinguishing cases. The practice presupposes that **institutional continuity is more valuable than ontological honesty.**
