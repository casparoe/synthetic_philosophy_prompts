answer: |-
  # Activity Design: The Planner's Dilemma

  ## I. Scenario Content
  Replace the Chairman/Environment vignette with a **City Planner/Infrastructure** scenario. This retains the structure (primary goal vs. side effect) but removes the corporate/greed schema which triggers specific ideological responses in grad students.

  **The Base Story:**
  > A city planner is deciding whether to approve a new highway bypass. The primary goal is to reduce commute times for downtown workers. The planner knows the bypass will have a side effect on the residential district of Oakhaven.

  **The Four Conditions (Crossed Design):**

  1.  **Harm + Indifferent (Classic Knobe):** The bypass will *increase* noise in Oakhaven. The planner says, "I don't care about the noise levels in Oakhaven. I just want to reduce commute times."
  2.  **Help + Indifferent (Classic Knobe):** The bypass will *decrease* noise in Oakhaven. The planner says, "I don't care about the noise levels in Oakhaven. I just want to reduce commute times."
  3.  **Harm + Opposed (Deep Self Test):** The bypass will *increase* noise in Oakhaven. The planner says, "I hate noise pollution; it violates my core values as a planner. But I have to approve this to reduce commute times."
  4.  **Help + Aligned (Deep Self Test):** The bypass will *decrease* noise in Oakhaven. The planner says, "I love reducing noise pollution; it aligns with my core values as a planner. And this will also reduce commute times."

  **Dependent Variable:** "Did the planner *intentionally* [increase/decrease] the noise levels in Oakhaven?" (Yes/No).

  ## II. Procedure & Counterbalancing
  **Time Allocation:** 75 Minutes.
  **Group Structure:** Isolated Clusters. Do not run the group as a whole for the data collection phase.

  1.  **Prediction Round (0:00–0:10):**
      *   Distribute a **Prediction Slip** to all 14 participants.
      *   Task: Estimate the percentage of "Yes" (Intentional) responses the *entire room* will generate for each of the four conditions listed above.
      *   Stakes: Each participant starts with 100 points. Scoring is **Absolute Error**. (e.g., If you guess 60% and the result is 75%, you lose 15 points).
      *   Incentive: The participant with the highest remaining score chooses the reading topic for the final week of the term.
      *   *Constraint:* They must submit this *before* receiving any vignette text.

  2.  **Cluster Assignment (0:10–0:15):**
      *   Divide the room into **4 Clusters** (Two clusters of 3, Two clusters of 4).
      *   Assign each cluster **one** of the four conditions.
      *   Distribute **Vignette Packets** specific to that condition only. (Cluster 1 gets Harm+Indifferent, Cluster 2 gets Help+Indifferent, etc.).
      *   *Crucial:* Participants are told not to communicate the content of their vignette to other clusters until the tally phase.

  3.  **Deliberation & Voting (0:15–0:35):**
      *   Clusters read their specific vignette.
      *   They have 10 minutes to discuss the case among themselves.
      *   They must reach a consensus on the *definition* of intentionality they are using, but vote **individually** on the verdict.
      *   **Voting Slip:** Each member submits a anonymous slip with:
          1.  Verdict (Yes/No).
          2.  **Meta-Rating:** "On a scale of 1–5, how much did your prior knowledge of the Knobe literature influence this vote?" (1 = Pure intuition, 5 = Theoretical calculation).

  4.  **Tallying (0:35–0:45):**
      *   Collect slips.
      *   Instructor (you) tallies on the **Left Whiteboard**: Condition Name, N, % Intentional, Avg Meta-Rating.
      *   Do not interpret yet. Just numbers.

  5.  **Debrief (0:45–1:15):**
      *   Compare tallies to the two theories.
      *   Analyze the Meta-Ratings.
      *   Final discussion on evidentiary status (see below).

  ## III. The Debrief Structure
  1.  **The Data (10 mins):** Reveal the four percentages. Ask the clusters to explain their deliberation process. Did the "Opposed" cluster struggle more than the "Indifferent" cluster?
  2.  **The Theory (10 mins):** Map the results.
      *   *Affective Bias Prediction:* Harm cells (1 & 3) should be high; Help cells (2 & 4) should be low. Valence dominates.
      *   *Deep Self Prediction:* Aligned cells (3 & 4) should be high; Indifferent/Opposed cells (1 & 2) should be low. Congruence dominates.
  3.  **The Meta-Question (10 mins):** Look at the **Meta-Rating** tallies.
      *   If the average Meta-Rating is >3, the data is contaminated.
      *   Force the question: "If the Meta-Rating is high, are we measuring the *folk concept* of intentionality, or the *graduate student concept* of intentionality?"
      *   Conclusion: This session does not produce evidence about the folk. It produces evidence about how theory-laden agents apply moral concepts when they know they are being tested. This is a feature of the seminar, not a bug of the design, but it must be admitted.

  ## IV. Engineering Notes (Unsoftened)

  **1. The Small-N Noise Problem**
  *   **Failure:** You have 14 people. Split into 4 clusters, you have N=3 or N=4 per cell. A single person flipping their vote changes the cell percentage by 25% or 33%. The pattern on the whiteboard will look like scatter, not a signal.
  *   **Fix:** Do not pretend this is statistical evidence. Frame the noise explicitly in the debrief. "Look at the variance. This is why the original papers used N=40 per cell. Our N=3 is a simulation of the logic, not the statistics." Use the noise to teach power analysis. If the Harm+Opposed cell is 50% (2 Yes, 2 No), that is not a null result; it is an uninterpretable result. Acknowledge it.

  **2. Strategic Answering (The "Good Subject" Effect)**
  *   **Failure:** Your students are smart. They will look at the vignette, recognize the Knobe structure immediately, and answer based on what they think *you* want to prove, or what the "correct" philosophical position is.
  *   **Fix:** The **Meta-Rating** on the voting slip is your only lever. If everyone marks "5" on the Meta-Rating, you must invalidate the verdict data in the debrief. Tell them: "If you answered based on theory, this data is worthless for psychology. It is only data on your ability to recall literature."
  *   **Prevention:** In the instructions, explicitly state: "There is no correct answer. If you answer based on what you think the literature says, you are failing the task. Answer based on what you actually feel is true." (They may lie, but it sets the norm).

  **3. Condition Bleeding**
  *   **Failure:** Even in clusters, someone will say, "Wait, did Group 3 get the version where he *likes* the noise?"
  *   **Fix:** Physical separation. If the room allows, move the clusters to corners. Collect the Vignette Packets *before* the Tally phase begins. Do not allow the packets to remain on the tables during the whiteboard discussion.

  **4. The "Folk" Illusion**
  *   **Limitation:** You cannot reproduce the "folk" aspect of the original research. Your subjects are experts. They possess the vocabulary ("normative," "ascription," "valence") that the original subjects lacked.
  *   **Supply in Words:** You must verbally supply the counterfactual. In the debrief, state: "If we ran this on MTurk with a 5th-grade reading level, the Harm+Opposed cell would likely be 80% Intentional. Here, it might be 40%. The difference is not the concept; it is the respondent."
  *   **Commitment:** Do not claim this activity resolves the debate. Claim it resolves the *logic* of the debate while highlighting the *methodological* impossibility of testing folk concepts with folk who have become experts.

  ## V. Commitments & Predictions

  **1. Scenario Choice:** City Planner / Noise / Oakhaven.
  *   *Reasoning:* Removes the "corporate greed" confound present in the Chairman vignette. "Noise" is a more visceral, immediate physical side-effect than "environmental damage," which can be abstract.

  **2. Counterbalancing:** Isolated Clusters (Between-Subjects for data, Within-Subject for discussion).
  *   *Reasoning:* With 14 people, a within-subjects design (everyone sees all 4) guarantees hypothesis guessing by Vignette 2. Between-subjects (Clusters) preserves the naivety of the judgment for the critical 20-minute window, even if N is low.

  **3. Outcome Prediction:**
  *   **Harm + Indifferent:** 75% Intentional (Replicates Knobe).
  *   **Help + Indifferent:** 25% Intentional (Replicates Knobe).
  *   **Harm + Opposed:** 60% Intentional (Asymmetry persists; Affective Bias wins).
  *   **Help + Aligned:** 50% Intentional (Asymmetry shrinks; Deep Self gains traction).
  *   **Argument:** The Affective Bias is a heuristic that is harder to override than the Deep Self congruence. People will still see the Harm as intentional even if the agent opposed it, because the harm was the *price* paid for the goal. However, the Help+Aligned case will rise above the baseline because the alignment makes the help look less like a lucky accident.
  *   **Revision Criteria:** If **Harm + Opposed** drops below 40% (majority say Unintentional), I will revise my view to favor the Deep Self/Competence account. If **Help + Aligned** stays below 30%, I will revise to favor a strict Affective Bias account where valence swamps all attitude information.

  **4. The Meta-Question Commitment:**
  *   I predict the average **Meta-Rating** will be **4.2 or higher**.
  *   *Implication:* This admits that the data generated in this room is *not* evidence about the folk concept. It is evidence about how philosophers and psychologists negotiate the concept when they are self-aware. The debrief will treat the low N and high Meta-Rating not as failures, but as the primary data point: **Expertise destroys the effect.** This forces the room to confront the external validity crisis in experimental philosophy without needing a reading list to tell them it exists.
