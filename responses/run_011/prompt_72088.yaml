answer: |-
  The rain inside the site trailer sounded different than the rain outside. Outside, it was a steady drumming on the metal roof. Inside, it was the hum of the dehumidifier fighting the damp air, smelling of wet coffee grounds and fresh blueprints. Nadia sat with her hand on the phone receiver, the plastic warm from her palm. On the desk lay the contract for the Oak Creek Elementary foundation. The pour date was stamped in red ink: Thursday, 6:00 AM. Forty-eight hours from now.

  She had already signed the geotech waiver. It was the standard profile for this part of the valley—clay loam, decent load-bearing capacity, nothing unusual. Every school built here in the last twenty years used the same profile. It was safe. It was efficient. It was what the budget allowed.

  But there was a knot in her stomach that hadn't loosened since Tuesday. A hunch, heavy and cold.

  She dialled the number for DeepCore Surveys. It rang four times before a man picked up, voice thick with the static of a bad connection.

  "DeepCore, this is Miller."

  "Miller, it's Nadia Vance from the district. I need a deep core sample. Grid section four, the new elementary site."

  There was a pause, the sound of paper shuffling on his end. "Section four? Nadia, we talked about this last week. To get a proper read on the subsurface water tables down there, I need a week to drill and analyze. Maybe ten days if the clay is thick."

  "I know the timeline," Nadia said. She looked out the small window. The ground out there was churned mud, waiting for the concrete trucks. "I want you to start anyway."

  "Start?" Miller sounded confused. "Nadia, the pour is Thursday. You know I can't get you results until next Friday. By the time I hand you the report, the concrete will be cured. You won't be able to change a thing. If the ground is bad, you'll know about it while you're watching the cracks form. Why pay for a diagnosis after the patient is already discharged?"

  It was the logical question. It was the question her boss would ask. It was the question anyone sensible would ask. You don't buy a map after you've already arrived. You don't check the locks after the door is closed. If the information couldn't change the action—if the concrete was going to flow regardless—then the information was just weight. It was baggage.

  Nadia tightened her grip on the receiver. "I understand the timing, Miller."

  "Then why?" He sounded genuinely puzzled, like she was trying to buy ice in winter. "If you're worried about the budget, we can bill it later. But if you're worried about the ground... knowing doesn't stop the pour. You've signed off. The contractors are staged. If I call you next week and say the soil is unstable, you can't un-pour the foundation. You'd have to halt the school year. You'd have to explain to the superintendent why you ordered a test you couldn't act on. It'll look like incompetence. Or panic."

  He was right. In the cold arithmetic of the job, he was absolutely right. She was spending money she couldn't justify to buy knowledge she couldn't use. If the report came back clean, she wasted district funds on a useless test. If the report came back bad, she trapped herself. She would become a person who knew the school was built on a fault line and had to choose between blowing the whistle—destroying her career and delaying education for two hundred kids—or staying silent and waiting for the cracks to appear years later.

  Ignorance was safe. Ignorance let her go home on Thursday night, watch the trucks leave, and sleep. Ignorance meant that if the ground shifted in five years, she could say, honestly, "We followed standard protocol. We didn't know."

  "Miller," Nadia said. Her voice was quiet, but it didn't shake. "Put me down for the deep core. Start Thursday morning."

  "Nadia, listen to me. This is a bad play. You're creating liability for no gain."

  "I'm not doing it for the gain," she said.

  "Then why?"

  She looked down at her hands. They were resting on the contract, right over her signature. She thought about the feeling of standing on the site yesterday. The ground had felt spongy near the creek bed, just for a second, under her boot. It was nothing. It was probably nothing. But it was a question.

  If she didn't ask the question, she was the kind of person who built schools on maybe. She was the kind of person who valued her own peace of mind over the truth of what she was building. She could keep her job. She could keep her reputation. But she would have to carry the quiet wonder for the rest of her life. *Did I get lucky? Or did I get away with it?*

  To the people who balanced spreadsheets, this was insanity. You don't pay to find out you might be guilty. You don't pay to remove the option of plausible deniability. It was a strategic error. It was handing yourself a loaded gun when you were already safe in the bunker.

  "Because if it sinks," Nadia said, "I need to know why."

  "That doesn't help you stop it sinking," Miller pressed. "It just means you watch it sink."

  "I know."

  "It's not good business, Nadia."

  "No," she agreed. "It's not."

  She waited. The hum of the dehumidifier filled the silence between them. She could hear Miller breathing on the other end, weighing the order, weighing her sanity. He knew she was the engineer. He knew she held the pen.

  "Okay," Miller said finally, softening. "We'll be there Thursday. But Nadia? I hope you're wrong."

  "Me too," she said.

  She hung up the phone. The dial tone buzzed for a second before she pressed the button to kill the line.

  Outside, the rain intensified, hammering against the trailer walls. The mud out there was waiting. The concrete trucks were scheduled. The budget was locked. Nothing about the physical world had changed. The ground was exactly as stable or unstable as it had been five minutes ago. The only thing that had shifted was her.

  She opened the drawer and took out her personal checkbook. She wrote the deposit for DeepCore. It wasn't a large sum in the grand scheme of the project, but it was enough to be noticed. Enough to be questioned.

  She tore the check out and clipped it to the work order.

  Her friend would call this a mistake. She would say Nadia had voluntarily increased her risk profile without any mitigating upside. She would say Nadia was paying to suffer. If the ground was good, Nadia wasted money. If the ground was bad, Nadia lost her choice. She forced herself into a corner where the only way out was through fire.

  But Nadia looked at the check, then out the window at the grey churn of the earth.

  If she didn't do this, she was building the school on a lie. Not a lie about the soil, necessarily, but a lie about herself. She would be the engineer who didn't look. She would be the woman who chose the smooth path over the hard truth. And every time she walked past that school, every time she saw the kids running across the playground, she would feel the ground beneath her feet. She would wonder if it was holding.

  By ordering the test, she was accepting that she might be the one who had to stop it. She was accepting that she might be the one who had to stand in front of the superintendent and say, "I knew, and I poured anyway," or "I knew, and I stopped it."

  She was buying the burden.

  Nadia picked up the phone again to call the courier. She needed the paperwork out before the end of the day. Her hand hovered over the keypad. She felt lighter, strangely. The buzzing anxiety in her chest had settled into a hard, cold weight in her gut. It wasn't comfortable. It wasn't safe. It was real.

  "Courier service," the voice said.

  "Pickup," Nadia said. "Immediate. I have something that needs to go out today."

  She looked at the signature on the contract one last time. It looked like someone else's name. Soon, it would have to mean something again.

  "Where to?" the courier asked.

  "DeepCore Surveys," Nadia said. "And tell them to bill me personally if the district rejects it."

  She hung up. The rain kept falling. The ground waited. And for the first time in weeks, Nadia breathed.
