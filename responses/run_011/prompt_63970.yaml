          *   *Observation:* The user leans natural. The philosophy (PAV) supports natural. But Claim 6 admits Mum was *wrong*. If Mum was wrong, and you are Mum (genetically), are you wrong?
          *   *Insight:* The philosophy is mostly coherent *if* you accept a hybrid view (PAV for most things, Impersonal for procreation). The tension is mostly in Claim 1's absolutism.
