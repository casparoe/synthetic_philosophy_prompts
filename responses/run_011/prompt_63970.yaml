      *   Tone check: Empathetic but rigorous.

      *(Self-Correction during drafting)*: Wait, Claim 4 says "if you're already going to have a kid, and you could instead have *one* whose life goes noticeably better." In IVF contexts, this is usually a *different* kid. If the user thinks IVF creates the *same* kid (just healthier), that's a biological misunderstanding. If they know it's a different kid, Claim 4 contradicts Claim 1. I need to highlight this.
      *Actually, looking at Claim 4:* "if you're already going to have a kid..." implies the *same* kid. But IVF replaces the kid. So Claim 4 doesn't apply to IVF vs Natural unless the user believes in soul-continuity or similar. I need to point out that Claim 4 is irrelevant to the IVF choice if it's a different embryo. That dissolves the tension between 3 and 4 regarding IVF.
      *Wait, Claim 6:* "My mum knew... I think what she did was wrong." This directly contradicts Claim 1 ("Wrongness has to land on somebody"). If Mum wasn't wrong by Claim 1, why does Claim 6 say she was? This is the biggest fracture.

      *Re-evaluating Claim 7:* "Intentions carry no weight... A couple who deliberately transfers... does something worse." This implies the *act* of deliberate transfer is worse, not the intention. But "deliberately" implies intention. The tension is between "intentions don't matter" and "agency matters." I can fix this by distinguishing *motive* from *choice*.

