          *   *Email 4:* Change the copy. Instead of "You follow through," use "We need people who can follow through." Or cut the email entirely and extend the match deadline if possible. Better: Make it a "Last Chance" based on the *need*, not the *donor's identity*.
      *   **Q4: Is the "repairs do not happen" argument strong?**
          *   It is strong for 1 & 2.
          *   It is weak for 4. If the money *only* comes via manipulation, the sustainability is low. Donors who feel tricked churn faster. It creates a "drug" dependency on darker patterns.
