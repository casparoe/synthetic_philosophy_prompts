          *   *Ethics:* Tracking opens is standard tech, but *saying* "I saw you opened" feels voyeuristic to some, transparent to others. The "Match ends Friday" needs to be true (user says it is).
          *   *Assessment:* The "I saw you opened" is the main friction. It shifts the relationship from "supporter" to "subject."
      *   **Email 4 (Friday):** "You're one of those people who follows through" (Barnum Effect/Flattery) + Sent to everyone (including non-donors).
          *   *Ethics:* This is the most manipulative. It asserts a trait ("follows through") to induce compliance (foot-in-the-door/labeling technique). Sending to non-donors calls them "people who follow through" when they haven't yet.
