      *   *Actually, a better fix:* "Would this statement change the donor's mind about giving?" If yes, and you wouldn't say it, you're hiding material information.
      *   *Wait, let's look closer:* The user says Email 3 passes the rule because "evidence we pay attention" is reassuring. But the user's stomach says no. Why? Because it implies a power imbalance. I will suggest adding a "Power/Relationship" test to the rule.

