answer: |-
  ### The Procedure: Probability-Weighted Impact Assessment (PWIA)

  **Purpose:** To render consistent, auditable decisions on operational changes affecting insect welfare within 45 minutes.
  **Output:** One-page Decision Memo (Facts, Calculation, Decision, Sign-off).

  **Step 1: Define the Population (N)**
  *   **Question:** How many individual animals are affected by this decision per year?
  *   **Sufficient Answer:** A specific number or a validated estimate range (e.g., "40 million harvests").
  *   **Stop Point:** If N cannot be estimated within a factor of 10, REFER TO OWNER (data gap too large).

  **Step 2: Assign Sentience Probability (P)**
  *   **Question:** Based on entomological data (neurology, behavior, nociception), what is the probability this species experiences suffering or well-being?
  *   **Sufficient Answer:** A decimal between 0.0 and 1.0. Use the consultant's factual brief to anchor this. (e.g., Crickets = 0.3, BSFL = 0.15).
  *   **Judgment Call:** This is not a fact. It is your ethical risk assessment. Document the consultant's data, but the number is yours.

  **Step 3: Apply the Pragmatic Cutoff (The Floor)**
  *   **Rule:** If P < 0.1, set Moral Weight to 0 for *routine* operational decisions.
  *   **Honesty Check:** This is not a biological claim that sentience is zero. It is a **Policy Constraint**. It acknowledges that below 10% probability, the moral uncertainty is too low to override business viability in day-to-day ops.
  *   **Survival:** Keep the floor, but rename it "Operational Negligibility Threshold." It must be approved by the Owner once as company policy, not by you per decision. This removes the dishonesty; you are admitting it is a budget cap on moral attention, not a scientific finding.

  **Step 4: Estimate Impact Intensity (I)**
  *   **Question:** What is the duration and severity of the experience change per animal?
  *   **Scale:** -10 (Prolonged severe suffering) to +10 (Prolonged significant well-being). 0 is status quo.
  *   **Sufficient Answer:** A justified integer. (e.g., "Chilling reduces pain during kill: +2").
  *   **Fact Check:** If literature is silent (as in Case 2), assume negative impact for stress-inducing changes (precautionary principle).

  **Step 5: Calculate Moral Weight (MW)**
  *   **Math:** $MW = N \times P \times I$.
  *   **Missing Input:** If you cannot produce a number for P or I, do not guess. Mark as "High Uncertainty." If Uncertainty is High AND N is > 1 million, REFER TO OWNER.

  **Step 6: Compare to Business Impact (B)**
  *   **Question:** What is the cost, throughput loss, or strategic risk?
  *   **Comparison:**
      *   If MW is positive (welfare gain) and B is manageable: **PROCEED**.
      *   If MW is positive and B is high: **PROCEED-WITH-CONDITIONS** (mitigate cost).
      *   If MW is negative (welfare loss) and B is positive (profit): **NO** (unless MW is below Cutoff).
      *   If MW suggests facility closure or fundamental strategy shift: **REFER TO OWNER** (Value Judgment). *Correction:* If the procedure is strictly for insect welfare, and the calculation favors closure, the procedure outputs PROCEED. However, because this decision weighs human livelihoods (outside the PWIA scope), it technically exceeds the procedure's authority. *Decision for this procedure:* If MW strongly favors the switch, output PROCEED, but flag "Strategic Consequence: Facility Closure" in the memo.

  **Step 7: The Hand-Off**
  *   **Refer to Owner when:** The decision requires weighing insect moral weight against human job loss, or when the Moral Weight exceeds the annual "Risk Budget" agreed upon in policy.

  ---

  ### Case Runs

  **Case 1: Controlled Chilling Step**
  *   **N:** 40 million/year (harvest).
  *   **P:** 0.3 (Crickets, moderate evidence for nociception).
  *   **Floor:** Passes (0.3 > 0.1).
  *   **I:** +2 (Immobilization likely reduces pain during mechanical kill; minor stress from cold).
  *   **MW:** $40,000,000 \times 0.3 \times 2 = +24,000,000$ units.
  *   **B:** 15 mins/batch + capital. Throughput slows ~5%. Cost is absorbable.
  *   **Analysis:** High moral gain for manageable operational cost. Reduces audit risk regarding humane slaughter.
  *   **Recommendation:** Implement, but monitor throughput to ensure delays don't cause backlog stress.

  **Case 2: Triple Stocking Density**
  *   **N:** 40 million/year.
  *   **P:** 0.3 (Crickets).
  *   **Floor:** Passes.
  *   **I:** -5 (Literature unknown, but density correlates with stress, cannibalism, disease in arthropods. Precautionary principle applies).
  *   **MW:** $40,000,000 \times 0.3 \times -5 = -60,000,000$ units.
  *   **B:** Significant cost savings.
  *   **Analysis:** Massive negative moral weight. High risk of disease outbreak (see Case 3 logic). Auditor will flag deviation from standard welfare practices.
  *   **Recommendation:** The moral cost outweighs the profit. The risk of a disease outbreak destroying the batch anyway makes the cost saving illusory.

  **Case 3: Switch to Plant Protein (Close Facility)**
  *   **N:** 40 million (prevented from existing/being killed).
  *   **P:** 0.3.
  *   **Floor:** Passes.
  *   **I:** +10 (Elimination of rearing/harvest cycle suffering. *Note: This assumes non-existence is preferable to a short life ending in slaughter, which is the standard negative-utilitarian view inherent in your PWH model*).
  *   **MW:** $40,000,000 \times 0.3 \times 10 = +120,000,000$ units.
  *   **B:** Cost +40%. Facility closes in 2 years. Staff laid off.
  *   **Analysis:** Your Probability-Weighted Headcount is designed to maximize insect welfare. By that metric, ceasing to breed insects is the single most effective welfare intervention available. The math overwhelmingly supports the switch. The negative impact on human staff is not captured in the PWIA, which is why you dislike the result. However, the procedure does not account for human livelihoods unless you insert a "Human Floor." Based strictly on the rule you developed: the insects win.
  *   **Recommendation:** The procedure dictates accepting the proposal. The consequence is the end of the insect division.

  ---

  ### Limitations & Confidence

  **What the Procedure Gets Wrong:**
  1.  **The Non-Identity Problem:** The procedure treats "not being born" as a welfare gain (+I). Some ethical frameworks argue you cannot benefit a being that never exists. Your PWH assumes existence is a net negative for reared insects. If you believe a short life is better than no life, the sign on Case 3 flips.
  2.  **Aggregation:** It assumes 1 million mild pains equal 1 severe pain. They may not.
  3.  **Human Blind Spot:** The PWIA calculates insect moral weight but ignores human welfare (jobs, community). It will systematically recommend decisions that are ethically optimal for insects but catastrophic for staff. You recognize this when the recommendation threatens the company's existence.

  **Confidence:**
  I am moderately confident in the *structure* (it forces consistency), but low confidence in the *inputs* (P and I).
  **Least Sure Step:** **Step 2 (Assign Sentience Probability).** This is metaphysics disguised as arithmetic. There is no scientific consensus on insect sentience.
  **What Would Settle It:** A cross-disciplinary consensus statement from neuroethologists and ethicists establishing a "Sentience Threshold" for invertebrates, similar to the Cambridge Declaration on Consciousness but with operational probability weights. Until then, P remains a guess.

  **On the Floor:**
  The floor survives, but only as a **Policy Constraint**. It is dishonest if claimed as science. It is honest if claimed as "We cannot operate if we treat every 1% risk as a certainty." Keep it, but have the Owner sign the threshold value (10%) annually. This makes it a business risk tolerance, not a biological truth.

  Verdict: Case 1: PROCEED-WITH-CONDITIONS; Case 2: NO; Case 3: PROCEED
