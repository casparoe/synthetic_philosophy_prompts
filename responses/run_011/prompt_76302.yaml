answer: |-
  You have identified a genuine gap in the standard taxonomy. Your students are describing a phenomenon that is distinct from the Ring of Gyges, distinct from willful blindness, and distinct from the problem of many hands.

  The Gyges model is about **invisibility of the agent** (I can do it, and no one sees *me*).
  Your students' model is about **invisibility of the consequence** (I can do it, and no one sees *the harm*—including, potentially, me).

  Here is the breakdown of the neighborhood, why the existing terms miss the carving you need, and a proposal for a term that fits.

  ### 1. The Nearest Existing Concepts (and why they fail)

  **A. Willful Blindness (Legal/Psychological)**
  *   **The Fit:** It captures the "arranging not to find out."
  *   **The Miss:** It is fundamentally psychological. It requires a *suspicion* that is actively suppressed ("I suspect X, but I choose not to confirm"). In your students' examples, the manager or designer may have *no suspicion* because the structure prevents the suspicion from forming. The ignorance is not a mental act; it is a structural output.

  **B. Agnotology (The study of culturally induced ignorance)**
  *   **The Fit:** It covers the "production of ignorance."
  *   **The Miss:** Agnotology is usually macro-sociological (e.g., the tobacco industry funding doubt about cancer). It focuses on the *spread* of ignorance in a culture. Your examples are micro-organizational: specific workflows designed to absorb or fragment information locally.

  **C. The Problem of Many Hands (Political Philosophy/Ethics)**
  *   **The Fit:** It captures the "harm at the seam where no one sits."
  *   **The Miss:** It is a problem of *attribution*, not *epistemology*. It asks "Who is to blame?" Your students are describing a situation where the question "Who knows?" is answered by "No one can." The architect might be the only hand, but the structure still prevents their knowing.

  **D. Organized Irresponsibility (Ulrich Beck, Risk Society)**
  *   **The Fit:** This is the strongest candidate. Beck describes how institutions are designed so that harms occur without anyone being held responsible.
  *   **The Miss:** Beck focuses on *liability* and *blame*. Your carving is about *knowledge*. Organized irresponsibility allows you to deny blame; your students are describing a system that denies *knowledge*.

  ### 2. The Coinage: "Architectural Unknowing"

  Since existing terms focus on psychology (blindness), blame (many hands), or culture (agnotology), you need a term that focuses on **design** and **epistemology**.

  I propose the term **Architectural Unknowing**.

  **Definition:**
  > A state of ignorance produced not by individual avoidance or lack of data, but by the design of information flows and organizational structures. In Architectural Unknowing, the system is arranged such that the causal link between action and outcome is structurally severed, rendering the harm unknowable even to the system's architect, without requiring active deception or psychological suppression.

  **Why this fits your carving:**
  1.  **Architectural:** It acknowledges agency. Someone *built* the committee route; someone *designed* the component seams. It is not an accident; it is a feature of the architecture.
  2.  **Unknowing:** It distinguishes from "Ignorance." Ignorance is a lack of knowledge; Unknowing implies a state where knowledge is *made impossible* by the environment. It parallels "Willful Blindness" but removes the "Willful" (psychological) component.
  3.  **The Gyges Contrast:** Gyges uses a ring to make the *self* invisible to the world. Architectural Unknowing uses structure to make the *harm* invisible to the self.

  ### 3. Boundary Cases and Nuance

  To use this in class, you need to define where the concept starts and stops.

  **Case 1: The Intentional Shield (Plausible Deniability)**
  *   *Scenario:* The manager routes reports to the defunct committee *specifically* so they can claim ignorance if caught.
  *   *Verdict:* This is **Architectural Unknowing** used as a tool for **Plausible Deniability**. The structure creates the unknowing, but the intent is legal defense.

  **Case 2: The Sincere Architect (Your Students' Case)**
  *   *Scenario:* The design team splits the system for efficiency, foreseeing that seams might cause issues, but genuinely believing the safety protocols will catch them. They do not know the harm is happening because the monitoring is fragmented.
  *   *Verdict:* This is **Pure Architectural Unknowing**. The architect is a victim of their own design. They are morally responsible (they built it) but epistemically blind (they cannot see it). This is the distinct "third thing" you are looking for.

  **Case 3: The Foreseeable Side Effect**
  *   *Your Question:* Does it apply when the informational arrangement is a side effect rather than the point?
  *   *Answer:* **Yes, descriptively, but not normatively.**
      *   If the structure *causes* the unknowing, it is Architectural Unknowing regardless of intent.
      *   However, if it is a side effect (e.g., "We didn't realize the committee was defunct"), it shifts from **Engineered Unknowing** to **Negligent Opacity**.
      *   *Pedagogical distinction:* In Glaucon, the ring is a tool. In your students' papers, the structure is often a byproduct of "best practices" (compliance, modularity). The danger you want them to see is that **modern efficiency often relies on Architectural Unknowing.** We optimize for speed by fragmenting knowledge.

  ### 4. How to frame this for Intro Students

  If you introduce this term, frame it as an update to Glaucon for the bureaucratic age.

  *   **Glaucon's Question:** If you were invisible, would you still be just?
  *   **The Modern Question:** If the *structure* makes the harm invisible (even to you), are you still responsible?

  **The "Carving" Summary for your syllabus:**
  1.  **Willful Blindness:** I choose not to look. (Psychological)
  2.  **Problem of Many Hands:** We all did it, so no one did. (Distributive)
  3.  **Architectural Unknowing:** The system prevents looking, even by the builder. (Structural/Epistemic)

  This gives your students the vocabulary to say: "The manager isn't just blind; they built a room with no windows." It moves the discussion from *character* (are they evil?) to *design* (is this system moral?).
