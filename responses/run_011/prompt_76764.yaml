answer: |-
  This is a strong design. It forces *incommensurability* rather than synthesis, which is exactly where the philosophy lives. However, your "word-catching" mechanic is high-friction. In a 75-minute seminar, semantic policing ("Is 'tension' a bodily state or a felt quality?") will eat 20 minutes and leave students thinking the point was about vocabulary rather than ontology.

  Below is the runnable lesson plan. I have kept your core mechanic but replaced the "word-catching" with a **"Veto Token"** system to prevent nitpicking spirals. I have also structured the vignettes so they don't just "fail" generally, but fail *specifically* against specific house rules.

  ### 1. The Setup (Materials)
  *   **Index Cards:** Prepare 4 decks.
      *   **Deck V (Vignettes):** 4 distinct scenarios (see below).
      *   **Deck R (Rules):** 3 "House Rules" (see below).
      *   **Deck T (Tokens):** 3 red "Veto Tokens" per group.
  *   **Whiteboard:** Divide into three vertical columns labeled only: **BODY**, **MIND**, **SENSE**. Leave a fourth space at the bottom for "FATAL CASES."

  ### 2. The Vignettes (Print on Card Stock)
  *   **V1: The Reviewer (Delayed Realization).** A doctoral student reads a harsh peer review. She reads two pages with no reaction. Then she notices her hands are shaking and her coffee is cold. Only then does she realize she has been furious for twenty minutes at a reviewer she doesn't know.
  *   **V2: The Bathtub (Recalcitrant Emotion).** A woman sees a coiled shape in the bathtub. She recoils, heart racing, screaming. She grabs a towel to crush it, then sees it is a rubber toy. She says sincerely, "I know it's not dangerous," but her hands are still shaking and she refuses to touch it for another ten minutes.
  *   **V3: The Shadow (Non-Existent Object).** A man wakes from a nightmare convinced a demon is standing by his bed. He feels terror. He turns on the light; the room is empty. He sits back down, still feeling the "presence" of the threat, though he now believes nothing is there.
  *   **V4: The Dread (Objectless Feeling).** A student wakes up at 3 AM with a crushing sense of doom. Chest tight, throat closed. She scans her life: no deadline, no fight, no bad news. She feels the vivid urgency of a threat but cannot identify *what* is threatening her.

  ### 3. The House Rules (Print on Card Stock)
  *   **Rule A (The Somatic House):** You may describe physiological changes (heart rate, heat, shaking), action urges (run, hit, freeze), and behavioral dispositions. **Forbidden:** You cannot mention what the emotion is *about* (no "at the reviewer," "of the snake"). You cannot mention beliefs or evaluations.
  *   **Rule B (The Judgment House):** You may describe evaluations, assessments, value claims, and commitments (e.g., "this is unfair," "this is dangerous"). **Forbidden:** You cannot mention felt qualities (no "shaking," "heat," "stomach drop"). You cannot mention raw sensations.
  *   **Rule C (The Perceptual House):** You may describe how the world *seems* or *appears* to the subject (e.g., "the report struck her as hostile," "the room felt menacing"). **Forbidden:** You cannot commit to a belief (it might be an illusion) and you cannot mention raw physiology (no "adrenaline," "pulse").

  ### 4. The Mechanic: Veto Tokens (Replacing Word-Catching)
  Instead of constant shouting, give each group 3 Red Veto Tokens.
  *   If a group presents a description that violates their House Rule, another group can slam a token on the table and say **"Smuggle."**
  *   The TA (you) makes an instant ruling. If the ruling is "Smuggle Confirmed," the presenting group loses that description and must try again. If "No Smuggle," the challenging group loses the token.
  *   **Why this is better:** It limits challenges to the most egregious violations. It stops semantic nitpicking about synonyms and focuses on *ontological commitments*.

  ### 5. Minute-by-Minute Timeline (75 Minutes)

  **00:00 – 00:05: Setup**
  *   Divide class into 4 groups (3-4 students each).
  *   Hand **V1 (Reviewer)** to *all* groups.
  *   Hand **Rule A** to Group 1, **Rule B** to Group 2, **Rule C** to Group 3. Group 4 gets **V2 (Bathtub)** and acts as "The Opposition" (they observe the others).
  *   Explain Veto Tokens. "You are trying to describe this event without breaking your rule. If you smuggle in a forbidden concept, you get vetoed."

  **00:05 – 00:20: Phase 1 (Construction)**
  *   Groups draft their description of V1 under their restriction.
  *   *TA Role:* Circulate. If Group 1 (Body) writes "She felt angry," stop them. "Angry is not a body part. What happened to her hands?" If Group 2 (Judgment) writes "She was upset," stop them. "Upset is a feeling. What did she judge to be true?"

  **00:20 – 00:35: Phase 2 (Presentation & Veto)**
  *   Groups 1-3 read their descriptions of V1. Group 4 (Opposition) holds the Veto Tokens.
  *   Write the successful descriptions in the corresponding columns on the board (BODY, MIND, SENSE).
  *   *Crucial:* If a description is vetoed, ask the class *why* before fixing it. "Why is 'shaking' not allowed for the Judgment house?" (Answer: Because shaking isn't a truth claim).

  **00:35 – 00:55: Phase 3 (The Attack)**
  *   Distribute **V2, V3, V4** to Groups 2, 3, and 4 respectively. (Group 1 keeps V1).
  *   **Task:** Each group must find *one* detail in their new vignette that **cannot be described** by one of the other House Rules.
      *   *Example:* Group 2 (holding V2 Bathtub) must show why **Rule B (Judgment)** fails. (Answer: She judges it safe, but feels fear. Judgment theory can't explain the persistence of the fear).
      *   *Example:* Group 3 (holding V3 Shadow) must show why **Rule C (Perception)** fails. (Answer: You can't perceive a demon that isn't there, yet the emotion persists).
      *   *Example:* Group 4 (holding V4 Dread) must show why **Rule A (Body)** fails. (Answer: The body is active, but without an object, is it an emotion or just panic? What distinguishes dread from indigestion?)
  *   Groups write their "Fatal Case" on the board under the column they defeated.

  **00:55 – 01:10: Debrief (The Map)**
  *   Reveal the theory names.
      *   **BODY = Somatic Theory (James-Lange).**
      *   **MIND = Judgmentalism (Stoics, Nussbaum, Solomon).**
      *   **SENSE = Perceptualism (Döring, Tappolet).**
  *   Walk through the "FATAL CASES" on the board.
      *   *V1 (Reviewer)* hurts **Somatic**: If the body reacts *before* the emotion is recognized, is the body the emotion or just a signal?
      *   *V2 (Bathtub)* hurts **Judgmentalism**: This is *Recalcitrance*. I judge X is safe, but feel fear. If emotion is judgment, this is irrationality. But it's not irrational; it's a phobia.
      *   *V3 (Shadow)* hurts **Perceptualism**: Perceptions usually require an object. If the demon isn't there, what am I perceiving? An illusion? Then why does the fear feel so veridical?
      *   *V4 (Dread)* hurts **All**: Specifically intentionality. If there is no object, can it be a judgment or perception? Or is it just raw body (Somatic)? But it feels like *aboutness*.

  **01:10 – 01:15: The Limitations Paragraph (Read Aloud)**
  *   "Here is what this exercise structurally cannot reproduce. We have treated emotions as *objects of analysis* to be described from the outside. But the primary datum of emotion is that it *modifies the describer*. When you are furious, you do not observe your shaking hands; you observe the *insulting reviewer* through the lens of fury. This exercise forces you to step outside the emotion to categorize it, which is the one thing the emotion itself refuses to let you do. We have mapped the territory, but we haven't felt the ground shake. Keep that gap in mind when you read the texts."

  ### 6. Troubleshooting (Predictable Failures)

  **Failure 1: The "Shaking *Is* Anger" Short-Circuit (Minute 12)**
  *   *Symptom:* A student in the Judgment group says, "But the shaking is just part of the anger, so why can't we write it?"
  *   *Fix:* Distinguish **Constitution** vs. **Causation**. "The theory you are modeling claims the shaking *constitutes* the emotion. The other theories claim the shaking is *caused by* the emotion. If you write 'shaking,' you are committing to the Somatic theory. Stay in your lane."

  **Failure 2: The Veto Spiral (Minute 25)**
  *   *Symptom:* Groups argue over whether "menacing" is a perceptual quality or a judgment.
  *   *Fix:* Invoke the TA Veto. "I am ruling 'menacing' as Perceptual. It describes an appearance, not a fact. Move on." Do not allow philosophical debate on the rule definitions during the game. Save it for the Debrief.

  **Failure 3: The "It's All Three" Synthesis (Minute 60)**
  *   *Symptom:* During debrief, a student says, "Obviously a real emotion needs all three. Why are we picking?"
  *   *Fix:* "A theory isn't a recipe; it's an ontology. If I say a table is *essentially* wood, I'm not saying legs aren't involved. I'm saying if you remove the wood, it's not a table. If you remove the judgment from Judgmentalism, does the emotion remain? These cases suggest sometimes it does, sometimes it doesn't. We are looking for the *essential* core, not the typical cluster."

  ### 7. Whiteboard Plan

  | **BODY (Somatic)** | **MIND (Judgment)** | **SENSE (Perceptual)** |
  | :--- | :--- | :--- |
  | *V1 Description:* Hands shake, coffee cold, urge to crumple paper. | *V1 Description:* Assessment of unfairness, commitment to quality standards. | *V1 Description:* Report appeared hostile, tone seemed dismissive. |
  | **FATAL CASE:** V4 (Dread). Body moves, but no object. Is it emotion or indigestion? | **FATAL CASE:** V2 (Bathtub). Judgment says "Safe," Emotion says "Danger." Theory calls this irrational, but phobia isn't irrational belief. | **FATAL CASE:** V3 (Shadow). Perceiving a demon that isn't there. Is it hallucination? Then why is the fear rational? |

  ### 8. Critique of Your "Word-Catching" Mechanic
  You asked me to be honest: The original "lose a word if caught" rule is too cute. It turns the seminar into a logic puzzle where students hunt for synonyms rather than analyzing concepts. It privileges quick-talking students over careful thinkers.
  *   **The Fix:** The **Veto Token** system I proposed above. It limits the "gotcha" moments to 3 per group. It forces them to save their challenge for the *substantive* smuggling (e.g., smuggling a belief into a body description) rather than the semantic (e.g., using "upset" instead of "agitated"). This keeps the focus on the *philosophical cost* of the restriction, not the linguistic enforcement.

  ### 9. Why This Works for 300-Level
  *   **No Prereading Barrier:** The vignettes are phenomenologically transparent. Anyone can imagine the bathtub snake.
  *   **Prevents Dominance:** The Rules silence the students who have read the SEP entry on "Emotion" because they aren't allowed to use the theoretical terms they know. They have to *perform* the theory.
  *   **Generative Failure:** The "Attack Phase" ensures they don't leave thinking "Well, each theory explains some stuff." They leave thinking "Each theory *breaks* on specific data." That is the engine of philosophical progress.
