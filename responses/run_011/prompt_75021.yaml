answer: |-
  **Plan**

  1.  **Opening:** Establish Miriam's materialism immediately. No "spirit," no "heaven." She was a brain, a body, and a teacher. This sets the tone for the family and clears the air for the atheists.
  2.  **The Artifacts:** Introduce the nine shoeboxes. Describe them as tools, not treasures. This validates the archivists' interest while grounding the family in something tangible.
  3.  **The Notation (Humor 1):** Explain the pencil system. Focus on the triangle symbol. This highlights her pragmatism and willingness to be wrong (and suffer for it).
  4.  **The Usage (The Argument):** Describe how she accessed the cards. She didn't "look up" info; she trusted the cards like memory. Include the anecdote about correcting grandkids faster than apps (Humor 2).
  5.  **The Archive:** Acknowledge the donation. Validate the university's work (safety, access) but note the structural change: sorting by species rather than by walk.
  6.  **The Loss:** Explain what changes in that sorting without using jargon. The context of the day, the weather, and the company disappears when you isolate the mushroom. The "mind" of the walk dissolves.
  7.  **The Request:** Ask the room to replicate the *relation*, not the collection. Don't study her cards; trust your own observations.
  8.  **Closing:** Bring it back to the present gathering. The woods are still there. A final instruction that feels like an invitation.

  ***

  **Eulogy**

  Miriam didn't believe in souls. She believed in brains, and she believed in mud. She was a biology teacher for forty years, which means she spent most of her life telling teenagers that things grow, die, and decompose, and that there is no hidden script behind the process. She would not want us pretending otherwise today. She is not watching us. She is not waiting for us. She is gone, and the work she left behind is the only thing that remains.

  Most of you know about the shoeboxes. Nine of them, packed into her closet. Inside were roughly six thousand index cards. For forty-five years, every time Miriam went into the woods, she made a card. She didn't file them by mushroom name. She filed them by walk. Date, weather, who was there, what the oaks were doing.

  She had a code written in pencil, because she knew she might need to amend it later. A slash meant she took a spore print. A circle meant she ate the specimen and was fine. A small triangle meant she ate it and regretted it. She was very consistent about the triangles. She believed in data, even when the data was her own stomach ache.

  Those cards weren't a record of what she knew; they were how she knew it. She didn't carry encyclopedias in her head. She carried the boxes. Two years ago, when her legs stopped working, she could still sit in her recliner and correct her grandchildren's identifications over the phone. She would flip through a box, find the card from October 1998, and tell them they were wrong about the gill structure. She was faster than the field guide apps. She trusted those cards the way you trust your own memory. You don't double-check your own name before you say it. She didn't double-check the cards. She just used them.

  Last autumn, I signed the paperwork to donate the collection to the university archive. It was the right thing to do. They will preserve the paper. They will keep the ink from fading. But they are going to re-catalogue them by species. That is how science works. You group the chanterelles with the chanterelles.

  But when you do that, the walk disappears. The context of the rain, the friend who was walking beside her, the specific bend in the trail—that gets stripped away to make the data usable for everyone. The cards will become a source you consult and cross-check. They will stop being part of a mind, and start being a library. Something real dies in that transfer. I signed the paper, because it had to be done, but I want us to acknowledge what changes when we sort the world by name instead of by experience.

  Miriam would have called sentimentality garbage. She wouldn't want us guarding these boxes like relics. So here is my request. Do not go home and study her cards. Do not try to preserve her system.

  Instead, go for a walk. Take a single index card. Write down one thing you see. Write down the weather. Write down who is with you. And then, trust what you wrote. Don't check it against an app. Don't verify it twice. Just let it be what you know.

  The woods are still here. The mud is still here. If you want to keep something of Miriam alive, do not look for her in the archive. Go out and build your own shoebox. Trust your own pencil. And if you eat something you shouldn't have, mark it with a triangle, so the rest of us know to leave it alone.

  Thank you.
