answer: |-
  ### The Mapping: Theory vs. Episode

  **Collective Intentionality**
  *Counterpart:* The public's willingness to accept Papiermark vs. Rentenmark.
  *Fit:* Strained.
  *Note:* Acceptance wasn't a binary switch but a decaying gradient during hyperinflation, whereas Searle implies a stable constitutive agreement.

  **Status Function (Y)**
  *Counterpart:* "Money" (Medium of Exchange/Unit of Account).
  *Fit:* Clean.
  *Note:* The ontology holds; the paper functioned as money, then failed, then functioned again despite physical continuity.

  **Constitutive Rule (X counts as Y)**
  *Counterpart:* The decree that paper notes constitute currency.
  *Fit:* Clean.
  *Note:* The physical substrate (X) remained irrelevant to the status (Y), confirming the arbitrariness of the signifier.

  **Deontic Power**
  *Counterpart:* Legal tender laws obligating acceptance.
  *Fit:* Absent.
  *Note:* During hyperinflation, legal tender status existed but conferred no real power; merchants demanded foreign currency or goods instead.

  **Declaration**
  *Counterpart:* The November 15 ordinance introducing the Rentenmark.
  *Fit:* Strained.
  *Note:* Declarations worked only when coupled with credible constraints; previous declarations failing to stop inflation show speech acts alone are insufficient.

  **Background Conditions**
  *Counterpart:* Trust in the state's fiscal solvency.
  *Fit:* Strained.
  *Note:* Searle treats background as static, but here the background (trust) was the primary variable that collapsed and was rebuilt.

  **Physical Base (X)**
  *Counterpart:* The paper notes themselves.
  *Fit:* Clean.
  *Note:* Confirms the theory that physical properties do not determine social status; the Rentenmark looked like the Papiermark.

  **Brute Facts (Backing)**
  *Counterpart:* Gold reserves or industrial output.
  *Fit:* Absent.
  *Note:* The Rentenmark had no gold backing, fitting Searle's claim that brute facts aren't required, though the "mortgage" fiction mimicked them.

  **Context (C)**
  *Counterpart:* The German economic sphere.
  *Fit:* Clean.
  *Note:* The status function only operated within the specific geopolitical context of Weimar Germany.

  **Iterative Performance**
  *Counterpart:* Daily pricing and wage settlements.
  *Fit:* Strained.
  *Note:* The frequency of re-evaluation (hourly pricing) during hyperinflation suggests the status function was unstable, not constitutively fixed.

  ### What Changed on 15 November?
  Ontologically, nothing changed—the status function remained "money." Pragmatically, the *credibility of the constraint* changed. The Rentenmark succeeded not because the collective intentionality magically refreshed, but because the institutional architecture (capped issuance, no bill discounting, balanced budget) signaled that the state would no longer abuse the status function. The "mortgage on land" was a fictional brute fact that served as a commitment device, convincing agents that the collective acceptance would not be betrayed by future over-issuance.

  ### Deflationary Reading: Scarcity vs. Ontology
  The deflationary reading gets you most of the way to explaining *value stability* but fails to explain *ontological status*. If acceptance merely tracks credible scarcity, then economic constraints are the causal drivers, and "collective intentionality" is just the epiphenomenal shadow of market confidence. However, scarcity alone doesn't make paper money; gold is scarce but wasn't circulating. The theory is needed to explain why the paper counts as money at all, but economics is needed to explain why it holds value specifically then.

  ### Degrees of Acceptance and Coexistence
  Searle's framework goes quiet on gradient acceptance. During 1923, the Papiermark was still "money" for taxes but not for bread, while dollars and *Notgeld* coexisted. The theory treats status functions as binary (it counts or it doesn't), unable to model a currency that is partially money, or money only for specific transactions. This suggests the framework is too static for dynamic monetary disequilibrium.

  ### Transfer to Race and Gender
  Money is special because it is a purely institutional kind that can be reset by decree with sufficient coercive backing. You cannot print a new race or cap the issuance of gender; embodied social kinds rely on phenotypic markers and historical narratives that resist constitutive rules. Using money as the paradigm for all social ontology risks obscuring the material and historical stickiness of non-institutional kinds.

  ### Verdict on the "Natural Experiment"
  Calling 1923 a proof of Searle is a retrospective fit. It shows that physical properties don't matter (confirming X), but it also shows that collective acceptance isn't magic—it requires institutional guardrails. It is a mixed test: it validates the arbitrariness of the signifier but invalidates the sufficiency of the declaration.

