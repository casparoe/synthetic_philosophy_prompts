  I'm auditing a seminar on social ontology and we've spent the last few weeks on the idea that money is a social kind — mostly Searle's version, the X-counts-as-Y-in-context-C formula, where a status function gets pinned onto an object by collective acceptance rather than by anything physical about it. One of the other students said the German hyperinflation of 1923 is basically a natural experiment that proves the whole framework, and I said I didn't buy it but couldn't really articulate why. Can you work through it properly as a case study? Assume I already know the broad history — I don't want a lecture on Weimar, I want the mapping, and I want it disciplined: name the theoretical element, name its counterpart in the episode, and say whether the fit is clean, strained, or just absent.

  The bits I think matter, correct me if I've got them wrong: France and Belgium occupied the Ruhr in early 1923, the Cuno government called for passive resistance and paid the strikers and their families with freshly printed money, tax revenue collapsed, and by November it took something like 4.2 trillion Papiermark to buy a dollar. Then on 15 November a brand-new note, the Rentenmark, turned up, set at one Rentenmark for one trillion old marks, issued by a bank that had been created a month earlier, and backed by nothing except a notional mortgage over all of Germany's agricultural land and industrial property — no gold behind it, and at first not even legal tender. Prices stopped climbing almost immediately. Alongside that, the Reichsbank was barred from going on discounting bills, the total issue was capped, and the budget was roughly balanced within a couple of months.

  So: on the status-function account, what actually changed on 15 November? The paper is the same sort of paper, and if anything the official declaration got weaker, since the old currency had legal-tender force and the new one didn't. If collective acceptance is what makes money, why did the same population dump one fiat note and embrace an identical-looking one within weeks — and why did acceptance latch onto a mortgage fiction that nobody could ever actually cash in? Tell me which parts of the theory are doing real work here (constitutive rules, collective intentionity, the gap between a declaration and brute coercion) and which are just getting waved at. Then push the other direction: the cap on issue, the end of bill-discounting, and the balanced budget mean acceptance might just have been tracking credible scarcity, which would make the social-kind story epiphenomenal — how far does that deflationary reading get, and what's left over that it can't touch? And be honest about where the framework goes quiet. There's something wierd about a theory with no notion of acceptance coming in degrees, or decaying at some rate, or about how municipal notgeld scrip and dollar-denominated pricing could coexist with the official currency for months. Finally: is 1923 a genuine test of the theory or a story that gets retold to fit whatever happened, and does any of this transfer to social kinds like race or gender, where you can't just print a new note and call it a day?

  Do the analysis in prose first (short headed sections are fine, keep it tight), then finish with a JSON scorecard in exactly this shape:

  {
    "mapping": [{"theory_element": "", "weimar_counterpart": "", "fit": "clean|strained|absent", "note": ""}],
    "what_changed_on_15_november": "your best single answer, one paragraph",
    "explains_well": ["feature of the episode the theory genuinely accounts for"],
    "silent_or_misdescribes": ["feature it can't handle or gets wrong"],
    "deflationary_reading": {"how_far_it_gets": "", "leftover": ""},
    "is_it_a_real_test": {"verdict": "genuine test|compatible with anything|mixed", "reason": ""},
    "transfer_to_other_kinds": "does the money case say anything about race or gender, or is money special — pick a side",
    "bottom_line": "two sentences max",
    "confidence": "low|medium|high"
  }

  Aim for six to ten rows in the mapping, and keep every other field to a sentence or two — don't pad it out.
