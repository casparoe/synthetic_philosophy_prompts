answer: |-
  The modelling group's claim that your 'replicator' is merely their copying-error parameter under a grander name is the single objection most likely to sink the talk.

  ### Objections and Replies

  **1. The Modeller's Redundancy Objection**
  *Objection:* "You're introducing a noun where we already have a rate. Our $\mu$ (copying error) captures fidelity perfectly. If $\mu$ is low, you have high fidelity. Calling it a 'replicator' adds no predictive power, only ontological baggage. Why should we change our equations?"
  *Reply:* "Because a noun marks a threshold where the *mathematics of inheritance* changes, not just the noise level. When fidelity crosses a certain threshold, lineage tracking becomes possible, allowing selection to act on arbitrary traits that would otherwise drift away. Your parameter $\mu$ describes the noise; my term 'replicator' describes the structural condition where lineages become stable enough to be units of selection. You need the rate to run the simulation, but you need the noun to describe the regime where cultural evolution looks Darwinian rather than diffusive."
  *Cost:* This concedes that the threshold is arbitrary. You are claiming a phase shift, but if the modeller shows the dynamics change smoothly with $\mu$, your 'kind' dissolves back into a continuum.

  **2. The Anthropologist's Ontology Objection**
  *Objection:* "You speak of 'items' discovered in the world, but in ritual and medicine, item identity is settled by native categories (emic) or your coding scheme (etic), not by fidelity. You are reifying a lineage that exists only in your spreadsheet."
  *Reply:* "I agree that native categories matter for meaning, but performance constraints create etic identities regardless of meaning. When a priest stumbles over a Latin phrase they don't understand, the correction is enforced by the performance tradition, not the native theology. I am not tracking the meaning; I am tracking the physical form of the performance that persists *despite* the lack of semantic grip. The lineage is in the muscle memory and the audio record, not just the taxonomy."
  *Cost:* You risk alienating the anthropologists by implying their emic data is secondary to your etic counting. You must assure them you aren't ignoring native ontology, just bracketing it for this specific measure.

  **3. The Philosopher's Structural Objection**
  *Objection:* "If fidelity is a matter of degree, as you admit with Godfrey-Smith, then 'replicator' is not a natural kind. You cannot have it both ways: either fidelity is binary and replicators are kinds, or fidelity is graded and 'replicator' is just a label for the high end of a spectrum."
  *Reply:* "I am arguing for a functional kind, not a metaphysical one. Just as 'planet' or 'species' has fuzzy boundaries but still picks out a real structural role in a theory, 'replicator' picks out the role of carrying lineage information across generations. The grading tells us *where* the role is filled; the noun tells us *that* it is filled enough to support Darwinian explanation."
  *Cost:* This is your weakest philosophical ground. You are admitting the category is pragmatic, which undermines the claim that replicators are 'real' in the domain rather than useful fictions.

  **4. The Psychologist's Mechanism Objection**
  *Objection:* "You say high fidelity is where psychology cannot touch the content, but children copy causally irrelevant steps precisely *because* of social motives—normativity, affiliation, deference. Psychology explains the fidelity, so why do you need a replicator account?"
  *Reply:* "Psychology explains the *mechanism* of copying, but not the *evolutionary consequence*. Whether the fidelity is produced by social deference or cognitive constraint, the result is the same: arbitrary traits persist long enough to be selected. My point isn't that psychology is absent, but that once fidelity is high, the dynamics become independent of the psychological *reasons* for copying. The replicator vocabulary describes the outcome, not the motive."
  *Cost:* You concede the 'why' to psychology, limiting your thesis to the 'what happens next'. This protects your flank but reduces the scope of your explanation.

  **5. The Modeller's Identifiability Objection**
  *Objection:* "You claim fidelity can be estimated independently of any selection story. But how do you distinguish high fidelity from strong purifying selection? If a trait persists, is it because it was copied well, or because every generation selected it anew?"
  *Reply:* "By looking at arbitrary detail. Selection tends to optimize for function or content; high-fidelity copying preserves noise. If obsolete words or causally inert steps persist across generations without functional benefit, that is the signature of copying fidelity, not selection. We measure the retention of the 'junk' to estimate the fidelity of the channel."
  *Cost:* This relies on your ability to definitively identify 'junk'. If a modeller argues the junk has hidden function (e.g., group bonding), your measure collapses.

  **6. The Anthropologist's Historical Baggage Objection**
  *Objection:* "My discipline abandoned the search for migrating item-lineages in the early twentieth century because it led to racist diffusionism and ignored local innovation. Why are you reviving a discredited method?"
  *Reply:* "Because the old diffusionism assumed *everything* was a lineage. I am arguing that *only some* domains are. By restricting the replicator framework to high-fidelity domains like liturgy or law, we avoid the error of forcing all culture into lineage boxes. We aren't going back to 1920; we are using modern tools to identify where lineage thinking actually applies."
  *Cost:* You must be extremely careful not to sound like you are dismissing the political history of anthropology. This requires diplomatic phrasing to avoid shutting down the room.

  **7. The Modeller's Selection Explanans Objection**
  *Objection:* "Even if you have high fidelity, fidelity itself doesn't explain differential retention. You still need a selection story. So the replicator vocabulary is just describing the substrate, not doing the explanatory work."
  *Reply:* "It does explanatory work by ruling out content-bias. In low-fidelity domains, retention is explained by attractors (what minds like). In high-fidelity domains, retention is explained by history (where this came from). Knowing you are in a replicator regime tells you to look for historical contingencies rather than cognitive universals."
  *Cost:* You are shifting the claim from 'explains retention' to 'directs the search for explanation'. This is a softer claim but harder to falsify.

  **8. The Psychologist's Context Objection**
  *Objection:* "Children over-imitate in lab settings, but adults in real-world ritual often modify things. Is your 'high fidelity' domain actually stable outside the lab?"
  *Reply:* "That's why I focus on institutionalized domains like law and liturgy, where social sanctions enforce the fidelity that children produce spontaneously. The mechanism might start in development, but the institution maintains it. The data shows stability in these specific domains over centuries, regardless of individual variation."
  *Cost:* You narrow your thesis further. If the anthropologist shows variation in their ritual data, you have to retreat to 'idealized' performance vs. 'actual' performance.

  **9. The Domain Boundary Objection**
  *Objection:* "Who decides what counts as high-fidelity? Fashion changes fast, but legal boilerplate changes slow. What about domains in the middle? Where do you draw the line?"
  *Reply:* "We don't draw a binary line; we map the space. Godfrey-Smith's graded picture allows us to say a domain is 'replicator-dominant' if fidelity exceeds the drift threshold. It's a measurable continuum, not a box. We classify domains by where they sit on the map, not by whether they are in or out."
  *Cost:* This undermines the punchiness of your thesis. If everything is just a point on a graph, the 'revival of the replicator' sounds less like a theoretical shift and more like a plotting exercise.

  ### Strategic Concessions and Commitments

  **Concessions to Volunteer in Opening Five Minutes**
  1.  **Fidelity is Graded:** Explicitly state you are not returning to a binary "replicator vs. non-replicator" world. Use Godfrey-Smith's space immediately to disarm the philosopher and modellers.
  2.  **Psychology is the Engine:** Acknowledge that social motives (normativity, etc.) are likely the *cause* of the high fidelity. You are not proposing a mysterious copying force, just describing the evolutionary dynamics that result from that psychology.
  3.  **Not All Culture is Darwinian:** Concede that gossip, fashion, and everyday beliefs may be better explained by attractor/content-bias models. This prevents the anthropologists from thinking you are trying to explain their whole field with one tool.

  **Commitments Not to Surrender**
  1.  **Arbitrary Detail Persists:** Do not concede that persistent "junk" (obsolete words, inert steps) is functional. This is your evidence for fidelity over selection.
  2.  **History Matters in High-Fidelity Domains:** Maintain that in these specific domains, historical lineage is a better predictor of form than cognitive content.
  3.  **Replicator Vocabulary is Necessary:** Argue that without the concept of a lineage-item, we cannot explain why *this* arbitrary form persisted rather than *that* functionally equivalent one.

  **The Single Reply That Must Land**
  You must successfully distinguish between the *mechanism of copying* (psychology) and the *consequence of copying* (lineage stability). If the psychologist convinces the room that "social motives explain it all," your replicator framework becomes redundant. You must argue: "Psychology explains the *motor*, but the replicator framework explains the *trajectory*."

  ### The Objection to Hope Nobody Asks

  **The Philosopher's Structural Question:** "If fidelity is a matter of degree, replicator is not a kind, and you should keep the parameter and drop the noun."

  **Why:** This undermines the ontological core of your thesis. If you admit 'replicator' is just a label for "low $\mu$", the modellers win (it's just a parameter) and the anthropologists win (it's just a coding choice). The noun does no work.

  **The Least Dishonest Answer:** "You are right that it is not a metaphysical natural kind. I am arguing it is a *theoretical* natural kind—a posit required to make sense of historical contingency in specific domains. We keep the noun because 'low copying-error rate' describes a process, but 'replicator' describes a role in a causal system where history overrides content. We need the role to justify using phylogenetic methods rather than just diffusion equations."

  ### Recommendation to Cut

  **Cut the claim that fidelity can be estimated "independently of any selection story."**

  **Why:** This is empirically fragile. Neutral drift can mimic high fidelity over short timescales, and strong purifying selection can mimic high fidelity over long ones. Distinguishing them usually requires knowing the selection pressure. If a modeller points out that you cannot measure $\mu$ without assuming a null model of selection, your first step collapses.

  **Replacement:** Soften this to: "Fidelity can be estimated by looking for the retention of *functionally arbitrary* detail, which serves as a proxy for copying accuracy when selection pressures are assumed to be neutral regarding that detail." This admits the assumption and protects you from the identifiability objection.
