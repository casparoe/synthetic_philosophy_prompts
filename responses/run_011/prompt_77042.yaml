  # HONOURS SEMINAR: PROBABILITY AND INDUCTION
  ## TAKE-HOME EXAMINATION

  **Time Allowed:** 48 Hours  
  **Word Limit:** 1,500 words (±10%)  
  **Total Marks:** 25

  **Case: The Kestrel Programme**

  Kestrel is a utility's autonomous transmission-line inspection programme. Eight flights so far, three crashes, all three before the software was upgraded to release v3 after flight 5; the three v3 flights are all clean. Industry-wide there were 611 autonomous line-inspection flights between 2016 and 2025, with 118 crashes. Of those, 240 were flown in sustained winds above 25 knots, with 74 crashes. 143 industry flights ran v3 or later, with 19 crashes. Two of Kestrel's three v3 flights were on the North Ridge corridor with the same two-person crew. The regulator's table does not break v3 flights down by wind speed. Flight 9 is a v3 aircraft, North Ridge, same crew, forecast sustained wind 30 knots. An internal engineering log says the v3 fix addressed a sensor-calibration defect that only showed up in gusts; an independent audit says two of Kestrel's three early crashes would probably have happened anyway.

  **The Rule**

  The fictional Bureau of Infrastructure Risk proposes the **Sequential Narrowing Rule** for setting safety probabilities:

  1.  Begin with the broadest class for which the Bureau has reliable data.
  2.  Add the case's known properties one at a time, ordering them by the size of the frequency shift each one produces relative to the current class.
  3.  Stop when either the class has fewer than 30 members, or the next property would move the relative frequency by less than two percentage points.
  4.  Report the frequency of the class where you stopped.

  **Questions**

  **(1)** Apply the Sequential Narrowing Rule to Flight 9 twice: first prioritizing Wind over Software, then prioritizing Software over Wind. (For this exercise, assume the Bureau calculates the initial priority based on the shift from the Industry Total base class). State the final probability percentage published in each run. Identify which specific clause of the Rule forces the stop in each case. **(8 marks)**

  **(2)** Can the Rule be repaired by adding conditions to eliminate the order-dependence you found in (1)? What must any repaired version presuppose about the relationship between properties (e.g., wind, software) and the outcome? Is the most specific class the case actually describes (v3, North Ridge, that crew, >25 knots) one the Bureau could ever have frequency data for, and what follows for the Rule if it isn't? **(9 marks)**

  **(3)** Assess the objection that reference classes are a crutch, and that a Bayesian who conditions on the total evidence needs no reference class at all. Kestrel's flights are not obviously interchangeable, since each is flown by people who rewrote their procedures after the last crash; say what that does to the objection. Finally, say whether the asymmetry in the Bureau's costs—a crash can kill a line worker, grounding the fleet costs ratepayers—changes which number is *correct*, or only which number to *act on*. **(8 marks)**

  ***

  # MODEL ANSWER

  **(1) Application of the Rule**

  The base class is the Industry Total (2016–2025): 611 flights, 118 crashes. The base frequency is $118/611 \approx 19.3\%$.

  **Run A: Wind Priority**
  We first narrow by Wind (>25 knots). The Industry High Wind class has 240 flights, 74 crashes. Frequency: $74/240 \approx 30.8\%$. The shift from base is $|30.8 - 19.3| = 11.5$ percentage points.
  Next, we attempt to narrow by Software (v3). We require the frequency for Industry flights that are *both* High Wind and v3. The case states the regulator's table does not break v3 flights down by wind speed. Therefore, there is no "reliable data" for this intersection (Clause 1). Alternatively, if we attempt to use Kestrel-specific data for this intersection, we have only 3 v3 flights total. This violates the sample size constraint of $N \ge 30$ (Clause 3).
  **Result:** The Bureau stops at the Wind class. **Published Probability: 30.8%.**
  **Stopping Clause:** Clause 1 (Reliable Data) or Clause 3 (Sample Size), depending on whether the Bureau attempts to switch to Kestrel data.

  **Run B: Software Priority**
  We first narrow by Software (v3). The Industry v3 class has 143 flights, 19 crashes. Frequency: $19/143 \approx 13.3\%$. The shift from base is $|13.3 - 19.3| = 6.0$ percentage points.
  Next, we attempt to narrow by Wind. We require the frequency for Industry flights that are *both* v3 and High Wind. As above, this cross-tabulated data does not exist in the regulator's table (Clause 1). Switching to Kestrel-specific data yields $N=3$, triggering the sample size stop (Clause 3).
  **Result:** The Bureau stops at the Software class. **Published Probability: 13.3%.**
  **Stopping Clause:** Clause 1 (Reliable Data) or Clause 3 (Sample Size).

  **Damage:** The rule produces divergent probabilities (30.8% vs 13.3%) for the same event depending on the ordering of properties. The damage is done by the interaction of Clause 1 (data availability) and Clause 3 (sample size), which force a stop before the properties can be combined.

  **(2) Repairing the Rule and Presuppositions**

  The Rule cannot be repaired merely by adding procedural conditions; the order-dependence arises from a lack of joint frequency data. To eliminate order-dependence, the Rule must presuppose **causal relevance** rather than mere statistical correlation. A repaired rule would require ordering properties by causal strength (e.g., does wind *cause* crashes, or is it merely correlated?). If wind is causally relevant to sensor failure and software is causally relevant to calibration, the Rule needs a model of how these causes interact (additive, multiplicative, screening-off). Without causal structure, statistical narrowing is arbitrary when data is sparse.

  Regarding the most specific class (v3, North Ridge, Crew X, >25 knots): The Bureau could never have frequency data for this class. This class describes a single flight or a handful of flights by the same crew. Frequencies require a repeatable reference class with $N \gg 1$. If the most specific description yields $N=1$, the frequency is either 0 or 1, which is useless for predicting the next instance.
  **What follows:** If the most specific class is inaccessible, the Rule must accept that single-case probability is always an estimate based on *similarity* to broader classes, not identity. This implies the "true" single-case probability is epistemically inaccessible via frequentist means alone. The Rule must therefore include a clause allowing for expert adjustment or causal modeling when frequency data runs out, acknowledging that the "stopping point" is pragmatic, not ontological.

  **(3) The Bayesian Objection and Cost Asymmetry**

  The objection that Bayesians need no reference class because they condition on "total evidence" is partially correct but practically incomplete. A Bayesian updates a prior $P(H)$ with evidence $E$ to get $P(H|E)$. However, to construct the likelihood $P(E|H)$, one typically relies on frequency data from some reference class (e.g., how often do v3 drones crash in high wind?). Without a reference class, the likelihood is ungrounded. The reference class is not a crutch; it is the source of the likelihood function.

  The non-interchangeability of Kestrel's flights (procedures rewritten after crashes) complicates this. Standard reference class reasoning assumes exchangeability (that past flights are relevantly similar to future ones). If the system changes after every crash, the past is a poor guide to the future. A Bayesian handles this better by modeling the *change* (e.g., a parameter for "safety improvement rate"), whereas a rigid frequentist rule struggles to incorporate the *reason* for the data cutoff. However, the Bayesian still needs a prior for that improvement rate, which ultimately rests on some broader class of "software updates."

  Regarding cost asymmetry: This does not change which number is *correct* (the truth-conditional probability), but it decisively changes which number to *act on*. The "correct" probability is a matter of evidence and logic. The decision to ground the fleet is a matter of expected utility. If a crash costs 100 units (death) and grounding costs 1 unit (money), a risk-averse agent should act as if the probability is higher than the best estimate to avoid the catastrophic tail risk. This is a pragmatic encroachment on *action*, not on *belief*. The Bureau should publish the best epistemic estimate (perhaps the 13.3% if v3 is causally superior) but apply a safety margin in regulation. Conflating the two leads to politicized science; separating them allows for transparent risk management.

  ***

  # MARKING SCHEME

  **Part 1 (8 Marks)**
  *   **Calculations (4 marks):** Correctly identifies Base (19.3%), Wind (30.8%), and Software (13.3%). Correctly notes the divergence (30.8% vs 13.3%). *Deduct 1 mark per calculation error.*
  *   **Stopping Clause (2 marks):** Identifies that the second step fails due to missing cross-tab data (Clause 1 "Reliable Data") or small sample size if switching to Kestrel data (Clause 3 "N<30"). *Accept either, provided justification is given.*
  *   **Order Dependence (2 marks):** Explicitly states that the Rule yields different results for the same case depending on the arbitrary ordering of properties.

  **Part 2 (9 Marks)**
  *   **Causal Presupposition (3 marks):** Argues that statistical ordering is insufficient; a repair requires causal knowledge (e.g., which factor screens off the other). *B-grade answer:* Suggests just getting more data without addressing the structural issue.
  *   **Specific Class Impossibility (3 marks):** Notes that the most specific class ($N=1$ or very small) cannot yield a meaningful frequency (0 or 1). *A-grade move:* Connects this to the impossibility of frequentist single-case probability without similarity judgments.
  *   **Implication (3 marks):** Concludes that the Rule must be hybrid (frequentist + expert/causal) or that single-case probability is inherently epistemic/subjective.

  **Part 3 (8 Marks)**
  *   **Bayesian Likelihood (3 marks):** Points out that Bayesians still need reference classes to ground likelihoods/priors. *Common mistake:* Accepting the objection fully (that Bayesians need no data).
  *   **Exchangeability (2 marks):** Notes that procedural changes undermine exchangeability, making simple frequencies less reliable for both Frequentists and Bayesians.
  *   **Cost Asymmetry (3 marks):** Distinguishes between *epistemic correctness* (probability) and *pragmatic action* (decision theory). *A-grade move:* Rejects the idea that stakes change the truth of the probability (anti-pragmatic encroachment on truth), while accepting they change the regulatory threshold. *B-grade answer:* Conflates the two, saying the "probability is higher because the stakes are high."

  **Distinction Criteria (First vs. 2:1)**
  *   **First (A):** Identifies the paradox in Part 1 (that you need data to order, but data stops the rule); argues in Part 2 that causal structure is required, not just more data; maintains a sharp truth/action distinction in Part 3.
  *   **2:1 (B):** Performs calculations correctly; suggests "more data" as the fix in Part 2; argues in Part 3 that stakes might justify changing the probability estimate itself.

  **Penalties**
  *   Treating the $N<30$ stop as a mere "small sample worry" without linking it to the failure of the Rule's output.
  *   Accepting "condition on everything" as a complete answer in Part 3 without explaining where the likelihood comes from.
  *   Math errors in percentages.

