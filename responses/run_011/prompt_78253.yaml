  # JOINT STATEMENT ON THE AFTERLIFE CONJECTURE AND VALUE REDUCTIONISM

  **Authors:** [Philosophy Graduate Student] & [Data Engineer]
  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on Scheffler's Afterlife Conjecture

  ## 1. AGREED CLAIMS

  We, the undersigned, agree to the following propositions as the baseline for our disagreement:

  1.  **The Doomsday Scenario:** We accept Samuel Scheffler's central thought experiment as defined: Humanity goes extinct shortly after the current generation dies of natural causes. We agree this scenario intuitively provokes distress distinct from the distress of our own imminent deaths.
  2.  **Explanatory Power of Person-Affecting Views:** We agree that person-affecting accounts (views that hold badness must be bad *for* some specific subject) successfully explain significant portions of the badness in standard extinction scenarios. Specifically, they account for:
      *   The deprivation suffered by current individuals who die sooner than they otherwise might have due to catastrophic events.
      *   The frustration of current individuals' desires regarding the future.
      *   The loss of potential welfare for future individuals who are never conceived.
  3.  **The Amnesia Case Definition:** We agree on the stipulations of the "Amnesia Case" used to test our divergence:
      *   Humanity does not go extinct.
      *   All currently living people die at their normal, expected times.
      *   Forty years after the last member of the current generation dies, a global event wipes all records, monuments, digital archives, and biological memories of the current generation and all prior history.
      *   Future humanity continues flourishing but possesses no knowledge that we existed.
  4.  **Relevance of the Amnesia Case:** We agree that if the Amnesia Case is judged to be morally comparable to the Doomsday Scenario, this supports the claim that value depends on a collective afterlife. If the Amnesia Case is judged morally neutral (relative to Doomsday), this supports the claim that value reduces to individual welfare and existence.
  5.  **Goal of Collaboration:** We agree that the purpose of this document is not to resolve the dispute immediately, but to isolate the precise empirical and philosophical claims that, if settled, would cause one or both of us to update our positions.

  ## 2. TABLE OF DISAGREEMENTS

  | Issue | Position A (Collective Afterlife View) | Position B (Person-Affecting Reductionism) |
  | :--- | :--- | :--- |
  | **1. Source of Distress** | The distress caused by the Doomsday Scenario stems partly from the undermining of the *meaning* of our current activities, which depends on humanity's continuation independent of our own welfare. | The distress caused by the Doomsday Scenario is fully reducible to the sum of individual harms: deaths, deprivation, and frustrated desires. "Meaning" is a descriptive label for these aggregates, not a separate normative source. |
  | **2. The Amnesia Verdict** | The Amnesia Case is nearly as bad as the Doomsday Scenario. The severing of the chain of memory and contribution undermines the value of our lives even if future people exist and are happy. | The Amnesia Case is significantly less bad than the Doomsday Scenario. If future people exist and are happy, no one is harmed. Any distress felt is solely due to the egoistic desire of the current generation to be remembered. |
  | **3. Nature of "Legacy"** | Valuing the continuation of humanity is distinct from valuing personal reputation. One can value the project of humanity without valuing oneself being credited for it. | Valuing the continuation of humanity without welfare impacts is indistinguishable from valuing personal reputation. If no subject experiences the loss, calling it "bad" is a category error masking egoism. |
  | **4. Reducibility** | Claims about meaning and collective survival are irreducible. They cannot be cashed out entirely in terms of individual welfare states without loss of explanatory power. | Claims about meaning and collective survival are reducible. Any valid moral claim must ultimately cash out in terms of individual welfare states (pleasure, pain, desire satisfaction). |

  ## 3. CRUXES, TESTS, AND PREDICTIONS

  We identify the following sub-questions as cruxes. Settling these would necessitate a significant update to at least one of our positions. For each crux, we specify a case or argument we agree bears on the question, and we pre-register our predictions.

  ### Crux 1: The Intuitive Weight of Amnesia
  **Question:** Does the Amnesia Case elicit a level of normative dread comparable to the Doomsday Scenario, once individual death and suffering are controlled for?

  **Agreed Test:** A refined intuition pump presented to neutral third parties (or ourselves under reflection):
  *   *Scenario X (Doomsday):* Humanity ends 40 years after we die.
  *   *Scenario Y (Amnesia):* Humanity continues forever, but 40 years after we die, all trace of us is erased.
  *   *Instruction:* Rate the badness of X and Y on a scale of 0–100, where 0 is "Business as Usual" and 100 is "Total Extinction Immediately." Explicitly bracket out the sadness of dying itself (which is equal in both) and focus on the state of the world after our deaths.

  **Predictions:**
  *   **Position A (Collective Afterlife):** The average rating for Scenario Y (Amnesia) will be within 20% of the rating for Scenario X (Doomsday). The gap will be statistically negligible compared to the gap between either scenario and "Business as Usual."
  *   **Position B (Reductionism):** The average rating for Scenario Y (Amnesia) will be less than 50% of the rating for Scenario X (Doomsday). The distress regarding Y will correlate strongly with self-reported desire for personal fame/legacy, whereas distress regarding X will correlate with concern for future welfare.

  **Update Condition:** If Position A's prediction fails (Amnesia is seen as much less bad than Extinction), Position A agrees this significantly undermines the claim that collective survival is independently necessary for meaning. If Position B's prediction fails (Amnesia is seen as nearly as bad as Extinction, even controlling for egoism), Position B agrees this significantly undermines the claim that person-affecting views are sufficient.

  ### Crux 2: The Egoism Charge
  **Question:** Can the distress regarding the Amnesia Case be fully explained by the frustration of the current generation's desire to be remembered?

  **Agreed Test:** The "Anonymous Benefactor" Variant:
  *   Consider a current individual who explicitly does *not* care about being remembered (they desire anonymity) but who deeply cares about the *continuation of the work they are doing* (e.g., curing a disease, building a stable institution).
  *   In the Amnesia Case, the work persists materially for 40 years but is then lost/reset (the cure is lost, the institution dissolves because no one knows its founding principles).
  *   Does this individual have a rational basis for distress that is not egoistic?

  **Predictions:**
  *   **Position A (Collective Afterlife):** Yes. The individual is rational to feel distress because the *value of the activity itself* is undermined. The badness lies in the loss of the contribution to the human chain, not in the loss of credit.
  *   **Position B (Reductionism):** No. If the individual truly does not care about credit, and the people benefiting in the 40-year window receive the benefit, there is no remaining subject harmed by the subsequent amnesia. Any remaining distress is an error in reasoning or a hidden desire for immortality via legacy.

  **Update Condition:** If Position B cannot identify a specific subject whose welfare is lowered in the "Anonymous Benefactor" variant, yet the distress remains robust upon reflection, Position B agrees to weaken the reductionist claim. If Position A admits the distress vanishes when the desire for credit is removed, Position A agrees that the "meaning" claim was likely masking a desire-satisfaction claim.

  ### Crux 3: The Person-Affecting Constraint
  **Question:** Must all badness be bad *for* a specific, identifiable subject (past, present, or future)?

  **Agreed Test:** The "Impersonal Harm" Argument:
  *   We analyze whether there are coherent cases of "impersonal badness" (e.g., the loss of a culture, the loss of knowledge) where no specific individual's welfare is lowered compared to a baseline, yet something of value is lost.
  *   We compare the Amnesia Case to a scenario where a library burns down after everyone who wrote the books has died naturally.

  **Predictions:**
  *   **Position A (Collective Afterlife):** The burning library is impersonally bad even if no living person wanted to read the books. Similarly, the Amnesia Case is impersonally bad. We accept that badness can exist without a specific subject experiencing the loss.
  *   **Position B (Reductionism):** The burning library is only bad if someone wanted to read the books (even if they don't know they are gone). If no one ever could or would read them, the loss is zero. We maintain that "badness without a subject" is a linguistic confusion.

  **Update Condition:** If Position B accepts that the library case involves genuine loss without a subject, Position B agrees to abandon strict person-affecting reductionism. If Position A accepts that the library case involves no loss without a subject, Position A agrees that the Amnesia Case likely involves no loss either, barring a specific desire frustration.
