answer: |-
  ### 1. Mapping

  To apply Arrow's theorem, we must first translate the electoral event into the formal language of social choice. A **profile** is the complete list of every voter's preference ordering over the set of alternatives. In this case, the alternatives are the sixteen candidates. The profile consists of the ranking each of the participating voters held over these sixteen names on 21 April. The **aggregation rule** is the institutional mechanism that converts this profile into a collective decision. Here, the rule is the Fifth Republic's two-round system: specifically, the first-round component, which functions as a plurality rule selecting the top two alternatives. The **social outcome** is the result produced by the rule. In Arrow's framework, this is typically a complete social ordering (a ranking of all candidates from first to last); in this election, the immediate outcome is a subset of two candidates advancing, which implies a partial ordering (the top two are ranked above the remaining fourteen).

  There is a category mismatch here that must be acknowledged. Arrow's theorem proves that no **Social Welfare Function**—a rule that produces a complete, transitive ranking of all alternatives for every possible profile—can satisfy a specific set of axioms (unrestricted domain, weak Pareto, independence of irrelevant alternatives, and non-dictatorship). The French election utilizes a **Social Choice Function**, which selects a winner (or winners) rather than ranking the whole field. However, any rule that selects a winner can be understood as generating a ranking where the winner is placed first. If we treat the two-round system as a method for generating a social ordering (even if we only observe the top two), Arrow's logic becomes relevant.

  The cost of this distinction is significant. Arrow's theorem is a universal claim: it states that *no* rule works for *all* possible profiles. It does not predict what happens in *this* specific profile. To say the theorem "applies" to 2002 is technically imprecise; rather, 2002 is a single data point within the domain over which the theorem quantifies. The theorem licenses the claim that there exists *some* profile where this rule will fail to reflect collective rationality. It does not, on its own, prove that the 2002 profile was one of those failures, nor does it explain *why* the failure occurred. To do that, we must look at which specific axioms were violated in this instance. The analysis shifts from a proof of impossibility to a diagnosis of specific axiom violations within a fixed profile.

  ### 2. Diagnosis

  Two distinct theoretical pathologies are often conflated in discussions of this election. The first concerns the **Independence of Irrelevant Alternatives (IIA)**. IIA requires that the social ranking between any two candidates depend only on voters' relative rankings of those two, not on their opinions regarding a third candidate. Plurality rules notoriously violate IIA. In 2002, the relative standing of Jospin and Le Pen was altered by the presence of Chevènement, Laguiller, and Mamère. If these "irrelevant" alternatives (irrelevant in the sense that they did not win) were removed from the ballot, and their voters' second preferences redistributed, Jospin likely surpasses Le Pen. The presence of these candidates changed the social ordering of the top two, violating IIA.

  The second complaint concerns the **Condorcet Criterion**. A Condorcet winner is a candidate who would defeat every other candidate in a head-to-head pairwise contest. A Condorcet loser is one who would lose to every other candidate in such a contest. The complaint here is that the two-round system failed to elect the Condorcet winner (likely Jospin or Chirac) in the first instance, and permitted a candidate (Le Pen) who may have been a Condorcet loser relative to the major field to reach the runoff.

  These complaints can come apart. A system can satisfy IIA but fail the Condorcet criterion, or vice versa. In this electorate, the IIA violation is the more robust explanation for the first-round shock. The fragmentation of the left vote is a direct instance of IIA failure: the social preference between Jospin and Le Pen was dependent on the existence of other left-wing candidates. The Condorcet complaint relies on counterfactual pairwise comparisons that are not directly observed in the first round.

  The 82.21 percent result in the runoff does not settle the Condorcet question for the first round. A pairwise contest in the second round occurs under different conditions: turnout is different (often higher), preferences may be strategic rather than sincere, and the "republican front" introduces a normative pressure that alters the profile itself. The 82 percent figure establishes that Le Pen lost to Chirac in a runoff context; it does not prove Le Pen would have lost to Jospin in a pairwise contest on 21 April under first-round turnout conditions. Therefore, the evidence licenses the claim that IIA was violated (Jospin eliminated due to vote splitting), but it does not definitively license the claim that a Condorcet winner was eliminated, only that the candidate who advanced was broadly unacceptable in a binary choice later. The IIA violation is the immediate mechanical cause; the Condorcet failure is a normative judgment about the legitimacy of the runoff participants.

  ### 3. Domain Restrictions

  Arrow's theorem assumes an **unrestricted domain**, meaning voters can hold any logically possible preference ordering. If preferences are restricted, impossibility results may vanish. The most common restriction is **single-peakedness**. Preferences are single-peaked if alternatives can be arranged on a single line (e.g., left to right) such that each voter has one most-preferred point and prefers candidates less as they move away from that point in either direction. If preferences are single-peaked, majority rule yields a transitive social ordering, and a Condorcet winner usually exists.

  In 2002, the traditional economic left–right axis ordered most candidates (Communists on the far left, Greens and Socialists on the left, UDF and RPR on the right). However, the National Front and Chevènement's sovereigntism introduced a second dimension: national identity and immigration (open vs. closed). When the issue space becomes two-dimensional, single-peakedness generally collapses. A voter might prefer the economic left and the nationalist right, creating a preference ordering that cannot be mapped onto a single linear spectrum without "valleys" (preferring extremes to the moderate middle).

  The presence of a bloc whose support peaks off the main economic axis likely destroyed the single-peaked restriction for this electorate. This does not mean Arrow's theorem "caused" the result, but rather that the electorate operated in a domain where the theorem's impossibility is active. In a single-peaked domain, most reasonable rules would have identified a stable majority winner. In this multi-dimensional domain, cycles and instability are possible, and the choice of aggregation rule determines the outcome.

  This suggests the 2002 election is not a case where the theorem is "true and idle." It is a case where the domain conditions that usually mitigate Arrow's problem (structural consensus on a single dimension) were absent. Consequently, the mechanical properties of the voting rule became decisive. If the domain had been restricted (e.g., if the National Front did not exist or competed on the same axis), the fragmentation of the left might not have been fatal. The failure was not just logical but topological: the issue space was too complex for a simple plurality filter to capture a stable majority will.

  ### 4. What the theorem does not cover

  Arrow's framework assumes voters reveal their true preferences. It is silent on **incentives**. The **Gibbard–Satterthwaite theorem** complements Arrow by showing that any non-dictatorial social choice function is manipulable: there will be situations where a voter achieves a better outcome by misrepresenting their preferences. In 2002, this manifests as the "useful vote." Voters who preferred Laguiller or Mamère faced a choice: vote sincerely and risk Le Pen advancing, or vote strategically for Jospin to block Le Pen. The proliferation of left candidates should be modeled not just as sincere diversity but as a coordination failure under a rule that punishes **clones** (candidates with similar platforms who split the vote).

  This shifts the blame from the aggregation logic to the strategic environment. The system invited favorite betrayal. If the left electorate had coordinated strategically (treating the minor candidates as clones and consolidating behind Jospin), the IIA violation would not have produced the shocking outcome. Thus, the result was not an inevitable mathematical impossibility but a failure of strategic equilibrium.

  Regarding abstention, the **no-show paradox** occurs when a voter is better off not voting than voting sincerely, because their participation changes the outcome to one they like less. This is common in instant-runoff or Condorcet methods where adding a vote can eliminate a candidate early, causing a worse candidate to win later. In a plurality first round, the no-show paradox is less structurally inherent than in transfer systems, but rational abstention still applies. The 7 percent drop in turnout suggests voters calculated their efficacy. If voters believed Jospin was safe, they stayed home or voted sincerely for minor candidates; if they believed the race was tight, they should have turned out and voted strategically. The drop suggests a miscalculation of the strategic landscape rather than a paradox inherent to the ballot structure itself. However, reformers proposing instant-runoff alternatives must contend with the fact that those systems are *more* vulnerable to the no-show paradox. A change in rules might solve the spoiler effect but introduce incentives for voters to stay home to prevent their favorite from being eliminated too early.

  ### 5. Verdict, in both directions

  Is 21 April 2002 a confirmation of Arrow's theorem? No. Arrow's theorem is a statement about the non-existence of a perfect rule across *all* possible profiles. It does not predict that every election will result in a paradox, nor does it explain specific outcomes. 2002 is a confirmation of the *implications* of Arrow's logic: specifically, that when domain restrictions (like single-peakedness) fail, the choice of aggregation rule determines the winner, and rules violating IIA (like plurality) are sensitive to the presence of losing candidates. It is not an anomaly for the theorem, but it is a case the theorem was not meant to reach in isolation. The theorem explains why we cannot design a system that *guarantees* this won't happen; it does not explain why it *did* happen here. That requires the specific details of the profile and the strategic context.

  Running the question the other way: Was this a design failure? This depends on the objective function of the institution. If the Fifth Republic's system was designed to optimize **Arrow-consistency** (producing a transitive ranking that reflects sincere preferences without IIA violations), it failed. However, if the system was designed to optimize **public legitimacy** and **executive stability**, the verdict changes. The two-round system is engineered to ensure the final winner commands an absolute majority, even if the first round is fragmented. The "republican front" in the second round, resulting in an 82 percent mandate, achieved a level of consensus and legitimacy that a single-round plurality winner (with 19 percent) could never claim.

  For a social choice theorist to count this as a design failure, one must stipulate that the primary goal of an election is the accurate aggregation of first-round preferences. If the goal is instead the production of a governable majority and the exclusion of anti-system candidates through elite and popular coordination in a second round, the system functioned as intended. The "failure" was only in the informational capacity of the first round to signal the true majority will. Therefore, the argument that "Arrow shows reform is futile" is incorrect. Reform is not futile because different rules yield different outcomes on *this* profile (e.g., a Borda count or Approval voting likely elects Jospin). Arrow shows reform cannot be *perfect* universally, but it does not show that reform cannot be *better* locally. The 2002 case demonstrates that institutional details are not neutral; they are decisive when the preference domain is complex.
