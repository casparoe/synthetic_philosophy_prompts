answer: |-
  **MEMORANDUM**

  **TO:** Transportation Review Committee
  **FROM:** Committee Member
  **DATE:** Friday
  **SUBJECT:** Adjudication of Carrier Performance Analysis (Carriers A & B)

  Per the VP's request, I have reviewed the data and the debate between Dana and Elias regarding the allocation of 2,000 additional quarterly shipments. Below is my move-by-move adjudication of the analysts' arguments, followed by an overall recommendation.

  ### Part I: Move-by-Move Adjudication

  **Move 1: Dana (Overall Figures)**
  *Rating: Clearly Right (as descriptive fact); Misleading (as causal inference).*
  Dana correctly calculates the aggregate on-time rates: Carrier A at 72.3% (723/1,000) and Carrier B at 87.0% (870/1,000). As a statement of historical record, this is accurate. However, implying this aggregate reflects inherent carrier capability is misleading because it ignores the disparate lane mix assigned to each carrier.

  **Move 2: Elias (Simpson's Paradox & Lane Split)**
  *Rating: Clearly Right.*
  Elias correctly identifies a Simpson's Paradox. When controlling for lane type, Carrier A outperforms B in both categories:
  *   **Short Lanes:** A (93/100 = 93%) > B (810/900 = 90%).
  *   **Long Lanes:** A (630/900 = 70%) > B (60/100 = 60%).
  The aggregate favors B only because B was assigned 90% easy lanes (Short), while A was assigned 90% hard lanes (Long). Statistically, the stratified data is the valid measure of carrier performance.

  **Move 3: Dana (Sample Size & "Real Business" Argument)**
  *Rating: Mostly Right.*
  Dana's claim that the aggregate is the only "true fact" is incorrect (see Move 2). However, her statistical caution regarding sample size is valid. The cells where A beats B rely on small samples (A Short n=100; B Long n=100).
  *   **Arithmetic Check:** For A's Short Lane performance (93%, n=100), the standard error is $\approx 2.6\%$. The 95% confidence interval is roughly 88% to 98%. For B's Short Lane performance (90%, n=900), the interval is roughly 88% to 92%. Because these intervals overlap, we cannot state with 95% confidence that A is truly superior to B on Short lanes. Basing a 2,000-shipment reallocation on n=100 cells introduces significant operational risk.

  **Move 4: Dana (Relay/Ordinary Split)**
  *Rating: Clearly Mistaken.*
  Dana argues that because Carrier B wins in both Relay (82.5% vs. 70.5%) and Ordinary (90% vs. 75%) splits, stratification is arbitrary. This is a category error. Lane type is **exogenous** (fixed before carrier assignment), making it a valid confounder to control for. The Relay flag is **endogenous** (assigned by the carrier's planners during execution). Conditioning on an endogenous variable introduces selection bias (collider bias) because it filters for decisions the carrier made to protect their own metrics. You cannot evaluate a carrier's skill by conditioning on their own risk-mitigation choices.

  **Move 5: Elias (Exogenous vs. Endogenous Variables)**
  *Rating: Clearly Right.*
  Elias correctly distinguishes between lane type (order property) and relay flags (carrier decision). Dana's counter-argument—that A chose which lanes to bid on—is contradicted by the preamble, which states lane type is "recorded on the customer's order before any carrier is assigned." While carriers bid on contracts, the specific mix of 1,000 shipments in this quarter was assigned by the distributor ("we happened to hand A the harder mix"). Elias's causal model is sound; Dana's is not.

  **Move 6: Elias (Standardization Proposal)**
  *Rating: Mostly Right.*
  Elias proposes standardizing to a 50/50 lane mix to compare intrinsic capability.
  *   **Arithmetic Check:**
      *   Carrier A: $(0.5 \times 93\%) + (0.5 \times 70\%) = 81.5\%$.
      *   Carrier B: $(0.5 \times 90\%) + (0.5 \times 60\%) = 75.0\%$.
      The math is correct, and standardization is the correct statistical method to remove confounding. However, Dana is right to question the *weights*. A 50/50 mix is arbitrary unless it matches our future business plan. If our future business is 90% Long Haul, a 50/50 standard is as misleading as the historical aggregate.

  ### Part II: Overall Adjudication

  **Who is more right?**
  **Elias is right on the analysis; Dana is right on the risk.**
  Elias correctly identifies that Carrier A is the more capable performer intrinsically (winning on both lane types) and that the aggregate data is confounded by assignment bias. Dana is correct that the data supporting A's superiority on Short lanes is statistically thin (n=100) and that relying on it for a large volume shift is risky. Dana is also correct that Elias's 50/50 standardization is arbitrary without knowing the mix of the *new* shipments.

  **Are they entitled to their conclusions?**
  **No.**
  *   **Dana** is not entitled to recommend Carrier B based on the 87% aggregate. That number reflects our assignment policy, not B's capability. B's 60% performance on Long Lanes is a critical vulnerability that the aggregate hides.
  *   **Elias** is not entitled to recommend Carrier A for the full 2,000 shipments. While A's capability is higher, the confidence intervals on the Short Lane data overlap with B's. Shifting 2,000 shipments to A based on n=100 data points exposes the company to variance that A may not be able to absorb.

  **Recommendation:**
  The committee should report that Carrier A demonstrates superior capability on both lane types, but the data is insufficient to justify a full reallocation without further testing. We should not report the 87% vs. 72.3% aggregate as a performance metric, as it is confounded.

  ### Part III: The Missing Consideration

  Neither analyst raised the most critical variable for the decision: **The Lane Mix of the 2,000 Additional Shipments.**

  We cannot determine where to place the new volume without knowing whether those 2,000 shipments are Short or Long lanes.
  *   **If the new business is predominantly Long Haul:** Carrier B is functionally unusable (60% on-time). Carrier A must take the volume regardless of sample size risks, perhaps with a performance penalty clause.
  *   **If the new business is predominantly Short Haul:** Carrier B is the safer bet due to statistical stability (n=900 vs. n=100), despite the slightly lower point estimate (90% vs. 93%).

  **Action Item:** Before voting, we must obtain the projected lane mix for the fall volume. I further recommend a controlled pilot (as Elias suggested) where we deliberately assign a statistically significant sample of Short lanes to A and Long lanes to B to validate the stratified performance before committing the full 2,000 shipments.
