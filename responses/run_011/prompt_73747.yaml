answer: |-
  **TO:** Grants Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Memo: "The Moral Physics of Experience"

  **Recommendation**
  I recommend we **fund in part**, authorizing the first two years ($320,000) contingent on specific deliverables, with the third year ($160,000) held in reserve. Release of the final tranche must be conditioned on a successful defense of the "aggregation lemma" and a demonstration that human-made high-energy states constitute a non-negligible marginal increase in disvalue relative to natural cosmic backgrounds. This approach respects the high-stakes nature of the inquiry while mitigating the risk of funding unconstrained speculation.

  **Moral Uncertainty and Allocative Weight**
  The central disagreement on this committee concerns how much weight to assign a moral premise we regard as unlikely. Camp A argues that funding this proposal amounts to capitulating to a Pascal's mugging: assigning non-zero probability to an infinite stake swamps any finite probability of success, justifying unlimited expenditure on unfalsifiable claims. Camp B argues that refusing to investigate low-probability, high-stakes moral realities is the epitome of scope neglect.

  The correct allocative principle lies between these poles. Expected-value reasoning under moral uncertainty does license investigating unlikely views *if* the stakes are sufficiently catastrophic and the investigation is tractable. However, it does not license acting on those views as if they were confirmed. We are not being asked to ban particle accelerators today; we are being asked to fund a philosophical and physical analysis of whether we should. Therefore, the funding should support the *investigation* of the probability and magnitude of the risk, not the *policy implementation* premised on its certainty. We can justify the expenditure as due diligence on a potential existential risk factor without endorsing constitutive panpsychism as true.

  **The Aggregation Lemma and Marginal Impact**
  Two specific philosophical vulnerabilities threaten the proposal's utility, and our funding conditions must address them directly.

  First, the proposal hinges on the "aggregation lemma": the claim that micro-experiential subjects bear disvalue independently rather than merely contributing to a macro-subject. The applicants concede this is the weak link. If this lemma fails, the scaling argument collapses. If experience combines into a single subject per region rather than aggregating across degrees of freedom, the vast subject counts they rely on vanish. Year 1 must do more than assert this lemma; it must provide a rigorous defense against standard combination problem objections. If the applicants cannot establish a coherent metaphysics of micro-subjects by the end of Year 1, the subsequent ranking of physical processes (Year 2) becomes meaningless.

  Second, even if panpsychism and the aggregation lemma are true, it does not follow that human activity is morally significant. The applicants' counting principle suggests subject density tracks physical degrees of freedom. The natural universe contains quark-gluon plasmas in neutron stars and the early universe that vastly dwarf anything humanity can produce. If the universe is already saturated with disvalue due to natural processes, human experiments may be morally negligible drops in an ocean of suffering. The proposal argues human activity matters because we *deliberately produce* and *scale* these states. However, to justify Year 3's policy recommendations (moratoria or design changes), the applicants must demonstrate that human-made densities add a marginal disvalue significant enough to warrant intervention. If natural background suffering dominates the moral calculus, policy moratoria are futile. The Year 2 deliverable must explicitly address this ratio of artificial to natural subject density.

  **The Case Against Funding**
  The strongest argument against this recommendation is not merely that the premise is unproven, but that the methodology is epistemically unconstrained. Camp A correctly notes that the Year 2 ranking exercise cannot be constrained by evidence. If the metrics for "expected disvalue" are purely theoretical, the output will reflect the authors' priors rather than physical reality. In this view, the proposal is not science or rigorous philosophy, but motivated reasoning dressed in technical vocabulary.

  Furthermore, there is a significant opportunity cost. Every dollar spent investigating unfalsifiable moral metaphysics is a dollar not spent on reducing suffering we can presently measure and verify. If the foundation's mandate is the long-run future, we must prioritize tractable risks over speculative ones. Funding this proposal sets a precedent that any group can secure resources by positing infinite stakes attached to an unfalsifiable theory. This risks diverting the foundation's portfolio toward high-variance, low-credibility projects that cannot be evaluated by standard grant-making criteria. The "investigation" itself may yield no actionable knowledge, leaving us with neither a policy solution nor a resolved philosophical question, having merely paid for three years of uncertainty.

  **Conditions and Deliverables**
  To mitigate these risks while preserving the potential upside, I propose the following tranche structure:

  1.  **Year 1 ($160,000):** Release upon signing.
      *   *Deliverable:* A peer-reviewed paper or equivalent monograph defending the "aggregation lemma." The standard for success is not consensus, but the elimination of obvious logical inconsistencies. The applicants must demonstrate that micro-subjects are morally countable units.
      *   *Review:* Committee review at Month 10. If the defense is deemed logically incoherent by external reviewers, funding stops.

  2.  **Year 2 ($160,000):** Release contingent on Year 1 success.
      *   *Deliverable:* A comparative ranking of physical processes that explicitly quantifies the ratio of artificial to natural subject density. They must answer the "negligibility objection": why do human experiments matter against the background of stellar physics?
      *   *Review:* Committee review at Month 22.

  3.  **Year 3 ($160,000):** Release contingent on Year 2 success.
      *   *Deliverable:* Policy paper. This is only funded if Year 2 establishes that human marginal impact is non-negligible. If human contribution is negligible, the policy paper is unnecessary, and funds should be reallocated.

  **Conclusion**
  This structure allows us to test the viability of the argument without committing to the conclusion. It respects the stakes raised by Camp B while enforcing the epistemic rigor demanded by Camp A. If the applicants are right, we enable crucial work on preventing extreme suffering. If they are wrong, we limit our loss to the cost of philosophical due diligence rather than funding ineffective policy advocacy. I move we approve the grant under these tranched conditions.
