answer: |-
  Here is a menu of four distinct readings of the slogan "if it can't be tested, it's not science." They are ordered from strongest/metaphysical to weakest/pragmatic.

  ### 1. The Strong Demarcation Criterion (Classic Popperianism)
  *   **Testability Demanded:** Logical falsifiability. There must exist a logically possible observation statement that, if true, would contradict the hypothesis. It does not need to be technologically feasible today, but it must be possible in principle.
  *   **What is Excluded:** The *cognitive status* of the proposition. It is excluded from the category of "scientific knowledge" and placed into "metaphysics" or "pseudoscience."
  *   **Work "Science" is Doing:** A boundary marker for meaningful discourse about the physical world. It distinguishes truth-apt claims from non-truth-apt speculation.
  *   **Verdict:** **Substantive and False.** Most philosophers of science reject this due to the Duhem-Quine problem (hypotheses are never tested in isolation; you can always save a theory by adjusting auxiliary assumptions).
  *   **Licenses Step (2)?** **Yes.** If it fails the test, it is not a scientific hypothesis.
  *   **Licenses Step (3)?** **Only conditionally.** Only if working on metaphysics is considered a waste of department resources (which is a sociological claim, not a logical one).
  *   **Self-Exoneration Test:** **Fails.** This reading likely damns **Inflation**. Inflationary models are notoriously flexible; anomalies can often be absorbed by tweaking the potential energy curve of the inflaton field. If the postdoc accepts Inflation, he is likely ignoring the auxiliary assumptions required to make it falsifiable. It also damns **Many-Worlds QM** entirely.

  ### 2. The Empirical Warrant Constraint (Bayesian/Confirmationist)
  *   **Testability Demanded:** Probability shifting. There must be some possible observation that would change the rational credence (probability) assigned to the hypothesis. If $P(H|E) = P(H)$ for all possible $E$, the hypothesis is scientifically idle.
  *   **What is Excluded:** *Rational belief.* You can formulate the hypothesis, but you cannot claim empirical evidence supports it.
  *   **Work "Science" is Doing:** A rule for epistemic justification. It distinguishes between guesses we have reason to believe and guesses we do not.
  *   **Verdict:** **Substantive and Defensible.** This is the standard working assumption of modern empirical science.
  *   **Licenses Step (2)?** **Yes (with nuance).** It is a hypothesis, but it is an *unwarranted* one. It lacks scientific *support*, not scientific *form*.
  *   **Licenses Step (3)?** **Weakly.** It suggests resources shouldn't be spent *confirming* it, but doesn't rule out exploring its mathematical consistency or theoretical implications.
  *   **Self-Exoneration Test:** **Passes (mostly).** **Inflation** passes because it predicts specific CMB spectral indices (which have been observed), even if the "multiverse" consequence of inflation has not. **Dark Matter** passes because it constrains gravitational lensing data. **Multiverse** fails because "other pockets" by definition cannot shift the probability of observations in *this* pocket (unless there is a specific mechanism linking them, which is usually absent).

  ### 3. The Pragmatic Heuristic (Resource Allocation)
  *   **Testability Demanded:** Feasibility within a foreseeable horizon. Can we build an instrument to check this within 50–100 years?
  *   **What is Excluded:** *Professional priority.* It excludes the topic from the list of things a physics department should fund *right now*.
  *   **Work "Science" is Doing:** A sociological label for a professional activity with opportunity costs. "Science" here means "the current research program of the physics community."
  *   **Verdict:** **Platitude.** Nobody denies that time and money are finite.
  *   **Licenses Step (2)?** **No.** It admits the multiverse might be a scientific hypothesis in principle, just not a profitable one to pursue currently.
  *   **Licenses Step (3)?** **Yes.** This is the only reading that directly justifies the claim that careers are being "wasted" (i.e., misallocated resources).
  *   **Self-Exoneration Test:** **Passes.** **Inflation** is kept because it yields testable CMB predictions now. **Multiverse** is paused because it yields no predictions now. This allows the postdoc to be consistent without logical gymnastics.

  ### 4. The Causal Access Requirement (Realist)
  *   **Testability Demanded:** Causal connection. The entity posited must be part of the causal web that leads to detector clicks.
  *   **What is Excluded:** *Ontological status.* If it can't causally affect us, it's not a physical object in our universe, regardless of mathematical elegance.
  *   **Work "Science" is Doing:** A definition of physical reality. Science studies the causal structure of the world; if X has no causal powers regarding us, X is not in the domain of physics.
  *   **Verdict:** **Substantive and Defensible (but contentious).** This is a metaphysical stance on what physics is *about*.
  *   **Licenses Step (2)?** **Yes.** If other pockets are causally disconnected, they are not physical objects of study.
  *   **Licenses Step (3)?** **Yes.** Studying non-entities is a waste of time.
  *   **Self-Exoneration Test:** **Passes.** **Dark Matter** passes (it gravitates). **Inflation** passes (it caused the expansion we see). **Multiverse** fails (by definition, other pockets are outside our light cone/causal contact).

  ***

  ### Analysis: The Falsifiability Shuffle

  You asked whether the "falsifiability shuffle" is a real pattern or just annoyance. It is a real pattern. In logic, it is an **equivocation fallacy**, specifically a **Motte-and-Bailey** maneuver.

  *   **The Structure:** The speaker swaps between **Reading 2 (Warrant)** and **Reading 3 (Pragmatic)** depending on the target.
      *   **When attacking a rival (Multiverse):** They use **Reading 2 or 4**. "It's not science" means "It is unwarranted/metaphysical." This licenses Step (2) (dismissal of the idea).
      *   **When defending an ally (Inflation):** They use **Reading 3**. "It's science" means "It is the current professional consensus/priority." This protects Step (3) (keeping the jobs).
  *   **Why the room agreed:** The room likely conflated **Reading 2** (which feels intellectually rigorous) with **Reading 3** (which feels practically obvious). Everyone agrees we shouldn't waste money (Reading 3), so they nodded. But they took that nod to imply the multiverse is metaphysically bankrupt (Reading 2), which is a much stronger claim that requires more argument.

  *   **Is there an immune reading?**
      **Reading 3 (The Pragmatic Heuristic)** is immune to the shuffle, *but* it does not license Step (2). If the postdoc had said, "The multiverse is a scientific hypothesis, but it is currently untestable, so we should prioritize other work," he would have been consistent. He would not have been able to say "it's not science."
      **Reading 2 (Bayesian Warrant)** is the most robust *epistemic* reading, but it requires careful bookkeeping. To avoid the shuffle, he must admit that Inflation is only scientific *insofar as* it makes testable predictions about *our* pocket (CMB), and that the *multiverse consequence* of inflation is scientifically idle. If he claims the multiverse itself is scientific because Inflation is, he is shuffling.

  ### Which reading was he leaning on?
  Given the speed of the agreement and the jump to Step (3) (wasting resources), he was almost certainly leaning on **Reading 3 (Pragmatic)** but dressed up in the language of **Reading 1 (Strong Demarcation)**.

  *   **Why?** Reading 1 is too easily refuted (Inflation has the same auxiliary assumption problems). Reading 3 is undeniable (budgets are real). By using the slogan of Reading 1 to enforce the conclusion of Reading 3, he shut down debate without having to argue about budget priorities or auxiliary assumptions.

  **Bring this to the group:** Ask him to specify which reading he intends. If he chooses Reading 1 or 4, ask about Inflation's auxiliary assumptions. If he chooses Reading 2, ask if he admits the *multiverse consequence* is idle even if Inflation isn't. If he chooses Reading 3, ask why he framed it as a metaphysical dismissal ("not science") rather than a priority call ("not now").
