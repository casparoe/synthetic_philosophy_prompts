answer: |-
  ### Audit Summary
  **Coherence Score:** 6/10
  **Verdict:** You have a functional Frequentist operational framework (#1, #2, #3, #8) undermined by a Bayesian intuition about truth (#4, #7) that you explicitly forbid in your rules (#1). The document currently tells trainees to calculate one way, think another way, and justify it a third way.

  Here are the real conflicts, ranked by severity.

  ---

  ### 1. The "No Priors" Paradox (Beliefs #1 vs. #7)
  **Severity:** Critical (Logical Contradiction)
  **The Conflict:**
  *   **#1** states priors should do *no work* in what you publish; justification is purely error rates.
  *   **#7** states most findings are false *because* the hypotheses were unlikely to be true (a prior probability argument).
  *   **The Problem:** You cannot claim priors are irrelevant to publication (#1) while simultaneously relying on prior probabilities to explain the false discovery rate (#7). Belief #7 is the Ioannidis argument, which is fundamentally Bayesian (Positive Predictive Value depends on Prior Probability). If priors don't matter (#1), then the base rate of true hypotheses shouldn't impact the truth of your significant results.

  **Trade-off:**
  *   **Give Up:** The absolute ban on priors in #1.
  *   **Cost:** You must admit that while priors don't enter the *calculation* (the p-value), they are essential for *interpretation* (credibility).
  *   **Gain:** Your explanation of the replication crisis (#7) becomes logically sound. You can justify why some significant results are trash without violating your own rules.

  ### 2. The Stopping Rule Tension (Beliefs #3 vs. #4)
  **Severity:** High (Operational Hazard)
  **The Conflict:**
  *   **#3** says stopping rules are part of the procedure and peeking invalidates the error rate.
  *   **#4** says data is data; intentions shouldn't change the evidence in the numbers.
  *   **The Problem:** This is the Likelihood Principle vs. Frequentist Error Control. While philosophically interesting, in an onboarding doc, this is dangerous. A student reading #4 might think, "The data is the same, so peeking is fine," directly violating #3 and #8.

  **Trade-off:**
  *   **Give Up:** The intuition in #4 as a rule for action.
  *   **Cost:** You have to teach students to ignore their intuition that "data is data" when it comes to validity checks.
  *   **Gain:** Operational clarity. The lab rule becomes unambiguous: Stopping rules define the error rate; therefore, stopping rules define validity.

  ### 3. Procedure vs. Evidence (Beliefs #2 vs. #6)
  **Severity:** Moderate (Semantic Tension)
  **The Conflict:**
  *   **#2** says methods are about long-run error, not how strongly *this* dataset supports anything.
  *   **#6** says a small p-value *is* evidence against the null.
  *   **The Problem:** Strict Frequentism (#2) forbids interpreting a specific p-value as evidence for a specific case. It only speaks to the hypothetical long run. #6 tries to sneak inferential weight back in.

  **Trade-off:**
  *   **Give Up:** The word "evidence" in #6.
  *   **Cost:** Language becomes clunkier ("warrants rejection" vs "is evidence").
  *   **Gain:** Strict consistency with #2. (Note: This is common pragmatic slop; less dangerous than #1 or #3).

  ---

  ### The Single Best Change
  **Modify Belief #1.**

  **Current:** "no priors, full stop. i don't want a 'subjective prior' doing any work in what we publish."
  **Proposed:** "no priors in **calculation**. justification is in terms of error rates. **interpretation** must consider prior plausibility."

  **Why this buys the most coherence:**
  1.  **Resolves the Critical Conflict:** It makes Belief #7 (most findings are false due to low priors) compatible with your methodology. You can calculate frequentist stats while acknowledging that a significant result on an implausible hypothesis is likely false.
  2.  **Preserves the Workflow:** You don't have to switch to Bayesian statistics. You keep your t-tests, ANOVAs, and 5% thresholds.
  3.  **Neutralizes the Stopping Rule Tension:** If you admit interpretation matters, you can explain #3 vs #4 like this: "Peeking breaks the error rate calculation (#3), so we can't use the p-value. Even if the data looks the same (#4), we've lost the tool we need to interpret it."
  4.  **Least Damage:** You aren't changing how you analyze data, only how you describe the limits of that analysis. It costs you nothing in terms of lab output, but it stops you from contradicting yourself when explaining *why* the replication crisis happened.

  **Action:** Rewrite #1 to distinguish *computation* from *credibility*. Keep the rest, but ensure #4 is framed as an intuition to be managed, not a rule to be followed.
