      *   **Conflict D: Evidence vs. Error (#2 vs. #6).**
          *   #2 says methods are about long-run error, not "how strongly this dataset supports anything."
          *   #6 says small $p$ *is* evidence against the null.
          *   *Status:* **Tension.** Strict frequentism (#2) forbids interpreting a specific $p$ as evidence for a specific case. It only speaks to the procedure. #6 tries to have it both ways (procedural guarantee + specific evidential weight).

