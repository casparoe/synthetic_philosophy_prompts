      *   *Decision:* I will highlight the Prior contradiction as the most severe logical flaw, but the Stopping Rule contradiction as the most dangerous for lab practice. I need to pick *one* change.
      *   Changing #4 to align with #3 is easier than changing #1 (which requires admitting Bayesian utility). But changing #1 fixes the #7 issue.
