      *   *Rank 2 (High):* #3 (Stopping rules matter) vs. #4 (Stopping rules don't matter). This is the "Likelihood Principle" clash. It confuses trainees. If you teach them stopping rules invalidate $p$-values (#3), but then tell them data is data (#4), they won't know how to analyze optional stopping data.
      *   *Rank 3 (Moderate):* #2 (Procedure only) vs. #6 (Specific evidence). This is a common pragmatic inconsistency, but less logically fatal than the prior contradiction.

