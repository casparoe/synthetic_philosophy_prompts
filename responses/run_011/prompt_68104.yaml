      3.  *Peeking/Optional stopping is bad.* Violates error control. Stopping rule matters.
      4.  *Likelihood Principle intuition.* Same data = same evidence, regardless of stopping rule/intention. (Conflicts with #3).
      5.  *P-value definition.* Not $P(H_0 | data)$.
      6.  *P-value interpretation.* Small $p$ = evidence against $H_0$; large $p$ $\neq$ evidence for $H_0$.
      7.  *PPV/Base Rate.* Most published findings are false (low power + low prior probability).
      8.  *Replication Crisis.* Misuse story (p-hacking, etc.), not philosophy. Fixable via preregistration/fixed $N$.

  3.  **Identify Conflicts:**

      *   **Conflict A: The Stopping Rule Paradox (#3 vs. #4).**
          *   #3 says stopping rules matter for error control (Frequentist view).
          *   #4 says stopping rules shouldn't matter for evidence (Likelihood/Bayesian intuition).
          *   *Status:* **Real Conflict.** This is the classic Frequentist vs. Likelihood Principle tension.

      *   **Conflict B: Error Rates vs. Base Rates (#1/#2 vs. #7).**
          *   #1/#2 say "No priors," focus on long-run error rates of the *procedure*.
          *   #7 admits that the *truth* of a finding depends heavily on the prior probability of the hypothesis ("most hypotheses... were unlikely to be true").
          *   *Status:* **Real Conflict.** You can't simultaneously claim priors do no work (#1) and then use priors to explain why significant results are likely false (#7). #7 *requires* priors to make the argument (Ioannidis style).

      *   **Conflict C: Philosophy vs. Misuse (#2/#3 vs. #8).**
          *   #8 says the crisis is just misuse (p-hacking) and fixed $N$ fixes it.
