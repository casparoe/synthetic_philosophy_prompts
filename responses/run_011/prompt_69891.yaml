answer: |-
  You cannot ship a non-manipulable rule for more than two options without making one person a dictator, so you must explicitly trade away strategy-proofness to satisfy your explainability and usability constraints.

  ### The Requirements Spec
  Here are the properties you need to evaluate, ranked by whether they are business hard-constraints or theoretical preferences.

  | Property | Concrete Situation (What breaks if you drop it) | Priority |
  | :--- | :--- | :--- |
  | **Non-Dictatorship** | If one engineer's ballot always decides the outcome regardless of others, adoption fails and morale breaks. | **Non-Negotiable** |
  | **Surjectivity (Onto)** | If a proposal has unanimous support but the rule physically cannot select it (e.g., parity constraints), the tool is broken. | **Non-Negotiable** |
  | **Explainability** | If you cannot generate a simple sentence like "Proposal A had the highest average score" to losers, leadership will veto the tool. | **Non-Negotiable** |
  | **Low Cognitive Load** | If voters must rank 15 items on a phone, they will abandon the ballot or submit random data, corrupting the result. | **Non-Negotiable** |
  | **Monotonicity** | If ranking a proposal *higher* causes it to lose (possible in IRV), you cannot explain the result without exposing the algorithm's quirks. | **Preference** |
  | **Condorcet Criterion** | If a proposal beats every other option head-to-head but loses the election, voters perceive the system as illegitimate. | **Preference** |
  | **Strategy-Proofness** | If voters can benefit by lying about preferences (e.g., ranking a strong rival last), results may skew, but this is unavoidable (see below). | **Impossible** |
  | **Noise Robustness** | If 20% of ballots are LLM-generated noise, the winner should not change unless the signal is weaker than the noise. | **Preference** |

  ### The Impossibility Trade-offs
  You cannot satisfy all theoretical preferences simultaneously. The Gibbard–Satterthwaite theorem is the specific constraint your leadership is worried about, but Arrow's Impossibility Theorem is also relevant for ranking systems.

  | Constraints Combined | Result | What Has to Give |
  | :--- | :--- | :--- |
  | **Strategy-Proofness + Non-Dictatorship + 3+ Options** | **Dictatorship** (Gibbard–Satterthwaite) | You must accept that strategy is possible. |
  | **Condorcet + Monotonicity + IIA** | **Impossible** (Arrow's/Theorem variants) | You must drop Condorcet or Monotonicity. |
  | **Ranking 15 Options + Mobile UX + Truthfulness** | **Garbage Data** | Users will not truthfully rank 15 items on a phone. |

  ### Escape Hatches from Gibbard–Satterthwaite
  Since you cannot satisfy Strategy-Proofness + Non-Dictatorship + 3+ Options, you must choose one of these escapes:
  1.  **Accept Manipulation (Recommended):** Admit to leadership that all real-world voting systems are manipulable; the goal is to make manipulation difficult or obvious, not impossible.
  2.  **Restrict the Domain:** Assume preferences are "single-peaked" (e.g., choosing a tax rate on a line), but this does not apply to distinct design proposals.
  3.  **Randomization:** Use a random dictator (pick one ballot at random); this is strategy-proof but unacceptable for business decisions.
  4.  **Cardinal Utilities:** Switch from ranking (ordinal) to scoring (cardinal); this technically evades the theorem's formal definition but does not prevent strategic exaggeration (bullet voting).

  ### The "Kill Switch" Requirement
  **Strategy-Proofness** is the requirement that kills the most candidates. If you insist on a rule where no voter ever has an incentive to lie, your only options are a dictatorship or a random chooser. Insisting on this property forces you to ship a useless tool. Regarding **Noise Robustness**: this is a recognized desideratum (often called "resistance to random voters" or "statistical efficiency"). It trades off against **Expressiveness**; methods that capture nuanced preference (like detailed rankings) are more fragile when those nuances are filled with garbage data, whereas simpler aggregations (like averages) dilute noise via the Law of Large Numbers.

  ### Scoring the Candidates
  Score Voting (0-5 scale) is the only candidate that satisfies mobile UX, explainability, and noise robustness, though it fails strategy-proofness. IRV and Borda fail mobile UX and explainability due to non-monotonicity and complex counting, while Quadratic Voting is too operationally complex for an internal tool. Plurality is too vulnerable to vote-splitting with 15 options, and Sortition is unacceptable for decision-making.
