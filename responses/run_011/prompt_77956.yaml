answer: |-
  The distinction between redaction and caricature is vital and currently obscured by the "user illusion" label, which exploits the ambiguity to gain unwarranted traction, so we should retire the umbrella term in favor of precise mechanistic descriptions. Your suspicion is correct: the metaphor is doing double duty, allowing proponents to signal engineering modesty to cognitive scientists while signaling eliminativist radicalism to philosophers. To pry them apart, we must look at where the rubber meets the road in specific phenomenological cases, because the divergence is not merely semantic but empirical.

  Consider the felt unity of the visual field. Under the redaction reading, the brain performs binding operations that are genuinely unified at some level of processing, and consciousness displays this result while hiding the distributed labor required to achieve it. The interface is a summary screen of a coherent database. The caricature reading, however, implies that the underlying machinery is fundamentally fragmented—multiple drafts, parallel streams, modular outputs—and that the seamless field is a positive fabrication. Here the divergence is stark: redaction predicts we will find neural correlates of binding that match the structure of experience, whereas caricature predicts we will find only disjointed processes stitched together by a narrative layer that pretends they were simultaneous. If the caricature view holds, the unity is not just hidden; it is false, a property attributed to the experience that exists nowhere in the machinery.

  The specious present offers a similar fracture. Redaction treats the "now" as a temporal window of integration, a necessary buffer to synchronize sensory inputs before display. It is thick, but it is real time. Caricature treats the "now" as a punctate fiction imposed on a temporal smear. Experiments showing postdictive effects—where later stimuli alter the perceived content of earlier ones—support the caricature view. If consciousness were merely redacting, it would show you the buffered data accurately. If it is caricaturing, it is actively rewriting history to maintain a story of continuity. The implication is that the temporal structure of experience is not a reflection of neural time but a user-friendly convention, like a timestamp on a file that doesn't match the actual write cycle.

  Agency and volition provide the most contentious testing ground. Redaction suggests you are the author, but you don't see the subpersonal drafts; the conscious will is the final executive signature. Caricature, aligning with Wegner-style illusionism, suggests the feeling of authorship is a confabulation generated after the action has been initiated by unconscious systems. The divergence here determines moral responsibility. If redaction is true, the self is a simplified but valid agent. If caricature is true, the self is a bystander claiming credit, and the "locus of authorship" is a property instantiated nowhere in the causal chain. This moves the theory from descriptive psychology to metaphysical elimination.

  Finally, consider transparency itself. Metzinger argues the self-model is transparent because we look through it, not at it. Redaction interprets this as efficient design: the medium disappears so the content is accessible. Caricature interprets this as a specific kind of error: the model successfully hides its own status as a model, making internal constructions appear as external realities. Redaction says transparency is about bandwidth optimization; caricature says transparency is about ontological misplacement. If transparency is merely redaction, the world is there, just simplified. If it is caricature, the world-as-experienced is a controlled construct that merely correlates with the world-in-itself.

  Each reading purchases something distinct at a specific cost. Redaction buys compatibility with realism and avoids skepticism. It treats consciousness as a naturalistic function, akin to attention or memory, which simplifies data for decision-making. The cost is that it fails to dissolve the hard problem. If the content is accurate, just thin, why does it feel like anything at all? Omission does not explain emergence. Furthermore, if all the interface does is hide complexity, calling it an "illusion" is misleading. A map is not an illusion because it lacks the terrain's topography; it is an abstraction. Redaction risks being a trivial truth dressed in provocative language.

  Caricature buys explanatory leverage against the hard problem by suggesting the "what it's like" is a feature of the model, not the machinery. It explains why experience seems magical: because it attributes properties (unity, self, now) that the physical system lacks. The cost is the self-undermining risk. If cognitive processes are systematically distorted by the interface, why trust the theorist's own report? If the "I" thinking this theory is part of the caricature, the theory loses its anchor. Caricature requires a stable Archimedean point outside the illusion to describe the illusion, which is hard to justify if the describer is embedded in the system. You are right to flag this: the caricature view owes an account of how theoretical reasoning escapes the distortion that plagues ordinary experience.

  Your charge that the view slides between these readings to gain plausibility and force is accurate. The redaction reading makes the theory palatable to engineers and neuroscientists; it sounds like standard information processing, harmless and functional. Nobody objects to the idea that the brain compresses data. But this reading lacks philosophical teeth; it doesn't challenge our intuition of selfhood. The caricature reading provides the teeth—it challenges the reality of the self and the validity of introspection—but it is controversial and counterintuitive. Proponents often introduce the concept via the harmless engineering analogy (the desktop icon) and then pivot to the radical metaphysical claim (the self is fake) without acknowledging the shift. This is not always a dishonest rhetorical strategy; sometimes it is a pedagogical necessity. You earn the right to the stronger reading by establishing the functional logic of the weaker one. However, failing to distinguish them leads to category errors where critics attack the caricature while proponents defend the redaction.

  Predictive processing complicates this landscape but does not collapse the distinction. The phrase "controlled hallucination" bundles the two concepts, but analytically they remain separable. A hallucination is by definition a caricature—it presents content not caused by the immediate stimulus. However, the "controlled" aspect implies constraint by evidence, which sounds like redaction (filtering noise). The crucial insight from predictive processing is that perception is generative, not just compressive. The brain does not just hide data; it generates hypotheses about causes. When the hypothesis overrides the data (as in optical illusions or phantom limbs), we have caricature. When the hypothesis efficiently summarizes the data, we have redaction. Predictive processing suggests the brain is always hallucinating, but usually correctly. This leans heavily toward caricature because it posits that the content of experience is top-down construction, not bottom-up revelation. The distinction survives because construction allows for error types that omission does not. You can omit a file path (redaction), but you cannot omit a file path and replace it with a folder that doesn't exist (caricature). Predictive processing admits the latter happens regularly.

  The verdict is that the caricature reading is the only one capable of doing the philosophical work required by consciousness studies, but it demands a higher burden of proof regarding self-undermining. Redaction is too safe; it leaves the mystery of subjective presence intact. If we want to explain why the world seems unified when the brain is modular, or why the self seems solid when the process is fragmented, we must admit the interface lies. However, the label "user illusion" should be split. It has become too loaded with the ambiguity you identified. We should reserve "user interface" for the redactionist account of bandwidth limitation and information hiding, and reserve "user illusion" strictly for the caricature account of positive misrepresentation. Until then, the metaphor will continue to function as a motte-and-bailey fortress, where defenders retreat to the harmless engineering analogy when attacked but sally forth with the eliminativist claim when proselytizing. Clarity requires we force them to choose which structure they are building.
