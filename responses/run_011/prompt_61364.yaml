answer: |-
  Good morning. For those who don't know me, I'm Tom's sibling. It is lovely to see you all crammed into this village hall near Leeds. We have family, old friends from the church Mum has left, six children under ten, and enough cosmologists to calculate the odds of us all fitting on these chairs.

  Tom and Ruth have been together for eight years. Their love language is argument. Specifically, they argue about why any of us are here at all. Ruth, the cosmologist, takes the view that the fact we exist suggests the universe is teeming with observers. You're not special; you're evidence of a crowd. Tom, the statistician, argues that you should reason as if you were drawn at random from a hat. You *are* special, because the odds of drawing your specific name are astronomical.

  It's a debate that has caused real friction. Those of you at the dinner party three years ago will remember the incident with the paper cone. Tom was holding forth about trillions of civilisations, and our friend the philosopher of physics—hello again—decided the only appropriate headwear for such presumption was a conical hat made of card. Tom wore it. He wore it for twenty minutes. I mention this only to say that while Tom may win the arguments, Ruth usually wins the wars.

  But today is about Ivy. And here, their disagreement lands on the crib. Ruth's position is that Ivy's arrival isn't surprising. Given enough time and enough stars, a child like her was bound to happen. Tom's position is that *this* child, with *these* parents, at *this* moment, is a lottery win so specific it barely registers on the scale of probability.

  I know Ruth has asked me to avoid words like 'fate' or 'plan'. The universe doesn't arrange things. There is no script. But I have to say, looking at Ivy, I think Tom has the better of it. Not because the universe planned her, but precisely because it didn't.

  To the children here: imagine throwing a handful of confetti into the air. None of those pieces planned to land where they did. But look at where they are. Look at who is standing next to them.

  Ruth is right that the universe is vast. But Tom is right that you are not a statistic. You are not a necessary outcome. You are a singular event. If the universe is a machine that makes people, it does not mass-produce *you*. It never has before, and it never will again.

  Ivy, in twenty years' time, you might wonder why you matter. You might look for a reason, a purpose written in the stars. There isn't one. And that is much better. You are not here because you were meant to be. You are here because, against impossible odds, you happened.

  You are not inevitable. You are improbable. And that is why we are all here, filling this hall, celebrating the sheer unlikelihood of you.

  I'm going to stop there, before I turn this into a lecture. I'd like to invite the celebrant back to continue the ceremony and for Tom and Ruth to explain the name they've chosen.
