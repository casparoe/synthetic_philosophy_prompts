          *   Since McMurphy cannot testify, Chief makes a metaphysical judgment: a life without the capacity to care about harm is not a life worth sustaining. This mirrors the father's fear: losing the part that minds is losing the self.
          *   It suggests suffering (the affective response) is constitutive of personhood, not just an add-on to sensation.

      *   **Point 2: McMurphy's Pre-Lobotomy Relation to Punishment:**
