          *   This contrasts with the lobotomy: Chief's dissociation is reversible and protective; McMurphy's is permanent and destructive.
          *   Illuminates the "care" component: Chief stops caring to survive, then starts caring again to live. McMurphy loses the capacity to care entirely.

