      *   *The Verdict:* The surgeon says the pain won't bother him. The father fears losing the part that minds. Chief sees McMurphy and sees someone who can no longer mind *anything*. The destruction is of the affective engagement with the world. In Grahek's terms, is it unpleasantness or caring? If the pain is there but doesn't bother, unpleasantness is gone. But if the person is a shell, *caring* is gone. Chief kills him because he is no longer a person who *cares*. I'll stick with *caring*.

