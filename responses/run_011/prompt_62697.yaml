          *   *Illumination:* The novel captures the *horror* of the dissociation from the outside. The literature on asymbolia relies on patient testimony ("I feel it but don't mind"). The novel shows what happens when the "minding" is gone—the person is gone. It validates the father's fear that the "self" is tied to the aversion.
          *   *Distortion:* Kesey depicts McMurphy post-lobotomy as an empty shell, vegetative. Clinical asymbolia patients are not vegetative; they are awake, talkative, just indifferent to pain. Kesey conflates cingulotomy/lobotomy with total frontal lobotomy (apathy/abulia). The surgeon said pain won't bother him; Kesey shows a man who doesn't bother with *anything*. This distorts the specific medical procedure (cingulotomy vs. lobotomy) but captures the existential fear accurately.
