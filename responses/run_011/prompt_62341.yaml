  ### 3. The Leaves

  **Leaf 1: The Nominalist Fracture**
  *   **Descriptive Name:** The Jade Agnostic.
  *   **Commonality Claim:** The peach, bath, proof, and admiration have nothing in common except a shared label applied by language users.
  *   **Hardest Case:** The Two Lives case (if there is no commonality, comparing totals is strictly impossible, yet we intuitively feel we can).

  **Leaf 2: The Functionalist Unifier**
  *   **Descriptive Name:** The Role Realist.
  *   **Commonality Claim:** These states have no shared feeling, but they all play the same causal role in learning and motivation.
  *   **Hardest Case:** The Massage case (if the role is motivation, the smoker who wants but doesn't like counts as pleased, which seems wrong).
  *   **Note on Debt:** By choosing "Role" over "Nominal," this view owes us an explanation of *which* specific role unifies the class without circularity (e.g., "causes pursuit" fails if pain also causes pursuit of relief).

  **Leaf 3: The Metaphysical Skeptic**
  *   **Descriptive Name:** The Summation Denier.
  *   **Commonality Claim:** There is no common property, and therefore no fact of the matter about whether heterogeneous pleasures can be summed or compared.
  *   **Hardest Case:** The Dog case (denying summability often forces us to deny the dog has pleasure at all, which seems speciesist).

  **Leaf 4: The Epistemic Pragmatist**
  *   **Descriptive Name:** The Currency Converter.
  *   **Commonality Claim:** Heterogeneous pleasures are real and comparable, but we lack a direct introspective currency to measure them against each other.
  *   **Hardest Case:** The Rival case (if comparison is pragmatic, it becomes unclear why the "pleasure" of schadenfreude counts toward a good life in the same way as bath pleasure).

  **Leaf 5a: The Sensory Qualitarian**
  *   **Descriptive Name:** The Warmth Theorist.
  *   **Commonality Claim:** All pleasures contain a specific, detectable sensory tone (like warmth or a glow) present in the peach, bath, proof, and admiration.
  *   **Hardest Case:** The Rival case (insisting there is a bodily "glow" when hearing of a rival's failure contradicts the report that "nothing is happening in the body").

  **Leaf 5b: The Non-Sensory Qualitarian**
  *   **Descriptive Name:** The Glow Theorist.
  *   **Commonality Claim:** All pleasures contain a specific, detectable non-sensory tone (a "mental glow") present in all instances.
  *   **Hardest Case:** The Massage case (subjects often report *no* positive glow, only the absence of pain, which this view must claim they are mistaken about).

  **Leaf 6a: The Motivational Attitudinalist**
  *   **Descriptive Name:** The Wanting Theorist.
  *   **Commonality Claim:** The peach, bath, proof, and admiration are all states the subject is motivated to sustain or repeat.
  *   **Hardest Case:** The Smoker case (the smoker wants the cigarette but explicitly denies liking it, breaking the link between wanting and pleasure).

  **Leaf 6b: The Learning Attitudinalist**
  *   **Descriptive Name:** The Reinforcement Theorist.
  *   **Commonality Claim:** These states are all defined by their capacity to reinforce the behavior that preceded them.
  *   **Hardest Case:** The Two Lives case (intellectual proofs may not reinforce behavior in the same direct way as sensory treats, making the "amount" comparison difficult).

  **Leaf 7: The Conceptualist Intellectualist**
  *   **Descriptive Name:** The Judgment Theorist.
  *   **Commonality Claim:** Pleasure is a judgment that a state is good, requiring concepts.
  *   **Hardest Case:** The Dog case (this view must deny the playing dog feels pleasure because it lacks the concept "good," which is counterintuitive).

  **Leaf 8: The Phenomenal Conceptualist**
  *   **Descriptive Name:** The Aware Stance Theorist.
  *   **Commonality Claim:** Pleasure is a stance toward a feeling that the subject must be aware they are taking.
  *   **Hardest Case:** The Chili case (if awareness is required, sudden delights or absorbed flow states where one forgets oneself might not count as pleasure).

  **Leaf 9: The Disjunctive Realist**
  *   **Descriptive Name:** The Family Resemblance Theorist.
  *   **Commonality Claim:** There is no single common property, but overlapping similarities link the cases without a core essence.
  *   **Hardest Case:** The Two Lives case (family resemblance makes precise summation for well-being calculations theoretically messy).

  **Leaf 10: The Error Theorist**
  *   **Descriptive Name:** The Folk Psychologist.
  *   **Commonality Claim:** Ordinary people think there is a common property, but they are mistaken; the category is useful but metaphysically empty.
  *   **Hardest Case:** The Massage case (if the category is empty, it is hard to explain why the subject is so certain they are "enjoying" it).

  **Leaf 11: The Hybrid Monist**
  *   **Descriptive Name:** The Composite Theorist.
  *   **Commonality Claim:** Pleasure is always a compound of a sensation plus an attitude toward it.
  *   **Hardest Case:** The Rival case (where there is no distinct sensation to compound with the attitude).

  **Leaf 12: The Radical Heterogeneist**
  *   **Descriptive Name:** The Disunified Pluralist.
  *   **Commonality Claim:** Sensory pleasure and propositional pleasure are entirely different natural kinds that should not share a name.
  *   **Hardest Case:** The Two Lives case (if they are different kinds, the intuition that we can trade them off against each other in a life plan is an illusion).

