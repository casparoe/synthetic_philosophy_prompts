  ### 5. Unseparated Leaves

  **Pair: Leaf 3 (Summation Denier) and Leaf 12 (Disunified Pluralist)**
  *   **Status:** *Extensionally Equivalent on Core Claims.*
  *   **Diagnosis:** Both deny a common property and both imply that summing heterogeneous pleasures is problematic. Leaf 3 focuses on the *math* (no sum), Leaf 12 focuses on the *taxonomy* (wrong name).
  *   **Resolution:** They should be merged. A further case separating them would be: "If we invented a new word for 'sensory pleasure' and kept 'pleasure' for 'propositional satisfaction', would your theory change?" Leaf 12 says Yes; Leaf 3 says No (the math problem remains).

  **Pair: Leaf 6a (Wanting Theorist) and Leaf 6b (Reinforcement Theorist)**
  *   **Status:** *Difficult to Separate.*
  *   **Diagnosis:** Wanting and Reinforcement often correlate perfectly.
  *   **Resolution:** A further case would separate them: "A rat presses a lever due to optogenetic stimulation of reward pathways but shows no behavioral preference for the context." Leaf 6a (Wanting) might deny pleasure if there is no conscious desire; Leaf 6b (Reinforcement) accepts it because behavior was reinforced. Without this case, they remain adjacent.

  **Pair: Leaf 5a (Warmth) and Leaf 5b (Glow)**
  *   **Status:** *Merely Verbal.*
  *   **Diagnosis:** Both claim a detectable monistic quality. One calls it sensory, one calls it mental.
  *   **Resolution:** Merge into "Phenomenal Monist." The distinction relies on the definition of "sensory," which is itself contested. No case reliably separates them because any "glow" can be described as a "sensation of glow."

