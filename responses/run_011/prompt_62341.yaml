  ### 4. Empty Cells and Diagnoses

  Recall the 16 theoretical cells from Part 1 (Dimensions A, B, C, D). The tree above populates 12 leaves. The remaining 4 cells are empty.

  **Empty Cell 1: A1 (Feeling) + B2 (Pluralism) + C1 (Introspective) + D1 (Nominal)**
  *   **Diagnosis:** *Incoherent.* If pleasure is a "Feeling" (A1) detected by "Introspection" (C1), but there is no common property (B2), then introspection should reveal the difference. If it reveals only a nominal grouping (D1), then it is not a "Feeling" kind in the relevant sense. One cannot introspect a "nominal kind" as a simple quality.

  **Empty Cell 2: A1 (Feeling) + B2 (Pluralism) + C2 (Functional) + D2 (Role)**
  *   **Diagnosis:** *Unattractive/Tense.* This claims pleasure is a "Feeling" but we know it only by "Function," and the feelings are different but play the same "Role." If the feelings are different and the only unity is functional, calling it a "Feeling" view is misleading; it collapses into the Role Realist (Leaf 2). It is unexplored because it offers no advantage over Leaf 2.

  **Empty Cell 3: A2 (Stance) + B1 (Monism) + C1 (Introspective) + D1 (Nominal)**
  *   **Diagnosis:** *Incoherent.* If it is a Monistic Stance (B1, A2) detected by Introspection (C1), it cannot be a Nominal kind (D1). Nominal kinds lack the unity required for Monism.

  **Empty Cell 4: A1 (Feeling) + B1 (Monism) + C1 (Introspective) + [D N/A]**
  *   **Specific Check:** *Simple quality grasped only by acquaintance while also denying that it is phenomenally detectable.*
  *   **Diagnosis:** *Incoherent.* This corresponds to A1 (Feeling) + C2 (Not Introspective/Functional). If a property is a "simple quality," its essence is its phenomenal appearance ("grasped by acquaintance"). To deny it is "phenomenally detectable" is to deny it is a quality in the phenomenal sense. A non-detected simple quality is a contradiction in terms; it would be a dispositional property, not a qualitative one. This cell cannot be coherently occupied.

