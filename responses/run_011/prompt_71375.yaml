  11. **Final Polish:** Ensure the voice matches the user's intellectual level. Use the petrology analogies back to them (phase boundaries, trace elements). Ensure the distinction between *truth* and *truthlikeness* is clear in the context of the film. (The sled is the truth; the testimonies are attempts at truthlikeness).

      *(Self-Correction on the Popper point)*: The user asks if I should present it as a solved or open problem. Given the Tichý/Miller collapse, and the film's ambiguity, it must be presented as an *open* problem that the film dramatizes. The film doesn't solve verisimilitude; it embodies the difficulty.

      *(Self-Correction on the Conclusion)*: The user wants to know what the film shows that formal treatments miss. Formal treatments deal with logic and possible worlds. The film deals with *value* and *loss*. The truth (Rosebud) is destroyed the moment it is found. That's the key insight for scientists used to data preservation.

