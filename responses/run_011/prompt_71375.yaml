  10. **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I quote the script? *No, describe scenes.*
      *   *Check:* Did I give a bibliography? *No.*
      *   *Check:* Did I answer the "instrumental" question for the colleagues? *Need to emphasize this in the conclusion.*
      *   *Nuance:* The user asks if the ranking makes Thompson's shrug a "failure of nerve." I need to challenge this. It's not failure of nerve; it's a correct categorization of the problem. The "truth" of the sled is instrumentally useless for the biography.
