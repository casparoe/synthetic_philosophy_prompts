  11. **Final Polish of Reverse:** DRO's "radius tuning" is essentially a hyperparameter for risk/conservatism. IP's "set formation" is often logical or based on elicitation, not necessarily tuned for out-of-sample bounds. This highlights the Engineering vs. Philosophy split.

