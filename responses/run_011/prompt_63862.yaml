      *   **IP Mindset:** $\mathcal{M}$ is a credal set. There is *no* single $\mathbb{P}_{true}$ representing the agent's belief. The belief *is* the set. A precise distribution would be *irrational* (over-confident) given the evidence.

      *   *(a) Credal Set:* DRO = Ambiguity Set (model uncertainty). IP = Belief State (ontic/epistemic imprecision).
      *   *(b) Coherence:* DRO = Constraints ensuring tractability or statistical coverage (e.g., $\phi$-divergence balls). IP = Dutch Book avoidance (no sure loss) generalized to sets.
      *   *(c) Decision Criteria:*
