          *   Maximality/Interval Dominance: Pairwise comparisons. DRO doesn't usually do this; we optimize a scalarized robust objective.
      *   *(d) Dilation:* In DRO, more data shrinks the set (radius $\to 0$). In IP, conditioning on a partition can make the posterior set *larger* (in terms of lower/upper prob spread) than the prior. This has no DRO analog. DRO views this as a failure of the model; IP views it as a feature of ignorance.
      *   *(e) Normative Claim:* DRO: "I use a set because I don't know the truth." IP: "I use a set because the truth (for me) *is* indeterminate."

