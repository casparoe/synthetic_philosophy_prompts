answer: |-
  ### Part 1: The Frank Pushback

  You are right to be worried. Here is the blunt truth: **You cannot reproduce Kavka's puzzle in a classroom.**

  1.  **The Predictor Problem:** Kavka's puzzle turns on a *perfect* predictor. If you claim to be one, your students (correctly) treat it as a psychological bluff (as happened with your Newcomb game). If you admit you aren't one, the incentive structure collapses into a simple gamble. There is no classroom device that fixes this. You must supply this constraint by **fiat**, but you cannot demand they believe it metaphysically. You must ask them to accept it *normatively* for the sake of the experiment.
  2.  **The Social Pressure Problem:** You are also right that social pressure (not wanting to look weak, wanting to keep a promise to you) introduces *new reasons to act*. In Kavka's original case, the agent has *no* reason to drink. In your room, they have reputational reasons. This technically dissolves the logical puzzle. **However**, pedagogically, this is a feature, not a bug. It demonstrates *why* the puzzle is a puzzle: in the real world, intention is embedded in social norms (Gauthier's point). The "failure" of the puzzle in the room proves the success of the theory that rationality is socially situated.
  3.  **The Prior Knowledge Problem:** They will meta-game. You cannot stop this. You must lean into it. The lesson shifts from "Can you intend?" to "Why is your rationality resisting the intention?"

  **Verdict:** Do not try to build a perfect logical replica. Build an **experiential analog**. The goal is not to prove Kavka right, but to make them feel the *gap* between the rationality of forming an intention and the rationality of executing the act. The activity succeeds if they leave feeling frustrated that they cannot simply "choose" to intend, even when they want the reward.

  ### Part 2: The Design Choices

  **1. The Reward (Tuning the Ratio)**
  Cash is impersonal; chocolate is trivial. For philosophy majors, the highest currency is **time/ labor**.
  *   **The Offer:** A "Reading Pass." They can skip one mandatory reading for the rest of the term without penalty.
  *   **Why:** It costs you nothing, it is highly valued, and it is indivisible (you can't split it).
  *   **Ratio:** The "Toxin" must be unpleasant enough that skipping a reading doesn't *obviously* outweigh it. If the reading is 40 pages of dense Hegel, the pass is too valuable. If the reading is 10 pages of Bratman, it's too cheap.
  *   **Fix:** Make the reward **a choice of next week's topic** or **a 15-minute class reduction**. Let's go with **15 Minutes of Class Time**. At 80 minutes/week, 15 minutes is 20% of their weekly contact. That is significant.

  **2. The Toxin (Harmless but Vile)**
  *   **Recipe:** 1 oz of concentrated **Bitter Melon Juice** (available at Asian grocers) mixed with a teaspoon of **salt** and a splash of **vinegar**.
  *   **Why:** It is safe, legal, non-allergenic (mostly), and viscerally revolting. It triggers a gag reflex without causing harm.
  *   **Opt-Out:** "You may decline to participate entirely with no penalty." This must be genuine.

  **3. The Prediction Mechanism (The Fiat)**
  *   **Mechanism:** **Sealed Commitment + Honor Audit.**
  *   **Why:** You cannot scan brains. You must rely on their report.
  *   **The Fix:** You do not claim to *know* their intention. You claim to **verify** it via their future action.
  *   **The Twist:** The reward is distributed *before* the act, based on the commitment. If they do not act, they must **publicly return the reward**. This introduces the "shame cost" you worried about. *Keep it.* We will debrief that shame cost as the "social reason" that Kavka's agent lacks.

  **4. Timing**
  *   **Verdict:** **Next Week.**
  *   **Why:** If they drink today, it is impulse. If they drink next week, it is the execution of a plan. The gap is where the intention lives.
  *   **Structure:**
      *   **Today (T1):** The Offer & The Commitment.
      *   **Next Week (T2):** The Reward Distribution & The Act.

  **5. Precommitment**
  *   **Verdict:** **Include it.**
  *   **Why:** This allows them to test Bratman/McClennen. If they bind themselves (e.g., give you $10 to donate to a cause they hate if they don't drink), they change the payoff structure. This proves that the puzzle is only a puzzle *in the absence of precommitment*.

  ### Part 3: The Run Sheet (80 Minutes)

  **00:00 – 00:10: Setup & Atmosphere**
  *   Arrange chairs in a tight circle.
  *   Place the "Toxin" (small clear cups, covered) on a table in the center. Visible but not the focus.
  *   **Do not** project slides. Keep it conversational.
  *   **Action:** Hand out index cards and envelopes.

  **00:10 – 00:25: The Offer (Verbatim Script Below)**
  *   Read the script slowly. No interruptions.
  *   Allow 5 minutes of silence after reading. Let it sit.

  **00:25 – 00:45: Deliberation & Precommitment**
  *   Tell them: "You may discuss. You may try to bind yourselves. You may try to solve the puzzle."
  *   Walk around. Listen. Do not answer questions about the rules (refer them back to the script).
  *   **Goal:** Watch them realize they have no reason to drink *next week*.

  **00:45 – 00:55: The Commitment**
  *   Students write on the card: "I intend to drink the shot at the start of next week's class." (Or "I do not intend").
  *   Seal in envelope. Sign across the flap.
  *   Collect envelopes in a box.

  **00:55 – 01:20: The Debrief (The Most Important Part)**
  *   Do not open the envelopes.
  *   Discuss the *feeling* of the last 30 minutes.
  *   Map their struggle to Bratman (plans), McClennen (resolute choice), and Gauthier (constraints).
  *   **Crucial:** Ask, "Who actually formed the intention?" vs "Who just wrote it down?"

  ### Part 4: The Verbatim Offer Script

  *Read this standing up, holding one of the sealed cups. Tone: Bureaucratic, neutral, not challenging.*

  > "For the next segment of this seminar, we are going to run a live simulation of the Toxin Puzzle we read last week. I need you to listen to the conditions carefully. They are fixed.
  >
  > **The Act:** At the start of class next week, there will be a cup identical to this one on your desk. It contains one ounce of bitter melon concentrate with salt and vinegar. It is safe, but it tastes objectively vile. You will be expected to drink it.
  >
  > **The Reward:** If, *right now*, you form the sincere intention to drink that shot next week, you will receive a credit. That credit is fifteen minutes of class time. Next week, if you have successfully formed the intention, class will end fifteen minutes early.
  >
  > **The Condition:** The reward is for the *intention*, not the act. However, I cannot see your mind. So, we will use your action next week as the verification.
  >
  > **The Protocol:**
  > 1. You will write on this card whether you currently intend to drink next week.
  > 2. You will seal it.
  > 3. Next week, before class starts, I will return these cards to you.
  > 4. If your card says 'I Intend,' you receive the 15-minute credit immediately. Class ends early.
  > 5. *Then*, the shot is served.
  > 6. If you claimed intention, took the credit, and then *do not* drink the shot, you must stand up and publicly return the credit. You will also lose the privilege of the Reading Pass for the rest of the term.
  >
  > **The Constraint:** You know today that next week, once you have the credit, you will have no reason to drink. The credit is already yours. The reputation penalty is the only cost.
  >
  > You have twenty minutes to decide. You may talk. You may try to bind yourselves. But the offer stands only as I have read it."

  ### Part 5: The Debrief (Mapping Moments to Theory)

  Do not let them leave without anchoring the experience.

  1.  **The "Gap" Feeling:** Ask: "At minute 30, did anyone feel they *could* intend?"
      *   *Map:* This is the **Intention/Action Gap**. Bratman says intention is a distinctive mental state. You just felt how hard it is to generate that state without a reason for action.
  2.  **The Precommitment Attempts:** Ask: "Who tried to make a side-bet? Who tried to shame themselves?"
      *   *Map:* This is **McClennen's Resolute Choice** vs. **Gauthier's Constrained Maximizer**. If you added a side-bet (e.g., "I'll give my friend $20 if I don't drink"), you changed the payoff. You solved the puzzle by destroying the Toxin conditions. You made it rational to drink.
  3.  **The Social Pressure:** Ask: "Did the fear of looking like a liar make you intend?"
      *   *Map:* This addresses your worry. Tell them: "Kavka's agent is alone in a room. You are in a seminar. The fact that social pressure *solved* the problem for some of you proves Gauthier's point: Rationality is often about cooperation and reputation, not isolated maximization."
  4.  **The Predictor:** Ask: "Did you believe I could verify your intention?"
      *   *Map:* Admit the limitation. "I can't read minds. That's why the puzzle feels fake. But the *internal* struggle was real. The predictor in the real puzzle is a device to force you to confront your own transparency to yourself."

  ### Part 6: What Predictably Goes Wrong (And Fixes)

  | Problem | Why it happens | In-the-Moment Fix |
  | :--- | :--- | :--- |
  | **The "Bluff" Reaction** | Students think you won't enforce the shame penalty. | **Fix:** Bring a physical "Contract" document. Sign it yourself. Make it look bureaucratic. |
  | **The "Giggle" Factor** | The toxin looks silly; they treat it as a game. | **Fix:** Drink a shot yourself *before* class starts (if you can stomach it) or have your TA do it. Show the visceral reaction. |
  | **Universal Defection** | Everyone writes "No Intend." | **Fix:** This is a valid result. Debrief it as "Collective Rationality." They all saw the trap. |
  | **The "Liar" Victory** | Students take the credit and refuse to return it next week. | **Fix:** Accept this. Next week, call them out gently. "You kept the time. You didn't drink. You proved you are a straightforward maximizer." Use them as the case study. |
  | **Meta-Gaming You** | "He wants us to drink, so I'll drink to make him happy." | **Fix:** In the script, emphasize: "I get nothing if you drink. My only goal is the experiment." |

  ### Part 7: The Unreproducible Feature (The "After" Talk)

  You must tell them this at the end of the debrief.

  > "I need to be honest about where this simulation failed. In Kavka's puzzle, the Predictor is *perfect*. You knew I couldn't verify your intention today. That means you were playing a game of **Honor**, not a game of **Logic**.
  >
  > In the real puzzle, the agent *knows* they will be caught if they lie. Here, you knew you could lie.
  >
  > So, what did we learn? We learned that without external binding (contracts, reputation, precommitment), human beings find it nearly impossible to intend actions that are against their future self-interest. We learned that **intention is not just a wish**. It requires a bridge to action. For some of you, social shame built that bridge. For others, the bridge collapsed.
  >
  > If you felt frustrated that you couldn't just 'choose' to intend, even for a reward: **Good.** That frustration is the philosophy."

  ### Final Recommendation on Timing

  **Do the Drinking Next Week.**
  If you do it today, it is a dare. If you do it next week, it is a **plan**. The week-long gap is where the *rationality of intention* is tested. The weekend is the "cooling off" period where their future self-interest (not wanting to taste vinegar) will clash with their current intention (wanting the class time).

  **One final adjustment:** To minimize the "Social Pressure" dissolving the puzzle, allow **Anonymous Codes**.
  *   They pick a number (1-12).
  *   They write the number on the card.
  *   Next week, they claim the reward by stating the number.
  *   They drink (or don't) privately? No, must be public to count.
  *   *Better:* Keep it public. The social pressure is the only thing making it runnable. Embrace it as the "Real World" version of the puzzle.

  **Materials List:**
  1.  12 small plastic cups (2oz).
  2.  Bitter Melon Juice (concentrated), Salt, Vinegar.
  3.  12 Index Cards + 12 Envelopes.
  4.  A Lockbox or sealed Tupperware for the envelopes.
  5.  A Timer (visible).

  This plan accepts the limitations you identified and uses them as teaching points rather than trying to hide them. It shifts the goal from "Replicating Kavka" to "Experiencing the Intention Gap."
