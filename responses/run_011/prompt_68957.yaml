answer: |-
  **Decision**
  To remain consistent with the five precedents, the committee should award the **sole prize to Group A**, with **Group A named first**. **Group C is ineligible** for the prize.

  **Reasoning**
  Group C is excluded by the 2011 ruling. The minutes distinguish between an effect and a mechanism, awarding priority to the party that supplied the "missing derivation." C's technical report stated the effect but offered no mechanism; under 2011, an idea that is not fully fixed in a record (including the *how*, not just the *what*) does not constitute the discovery. The decommissioned server and the author's death are secondary; the lack of mechanism is dispositive.

  Between A and B, the 2019 ruling is the controlling precedent. The minutes state that "the record rule presupposes honest entry." B's corresponding author admits to attending A's internal meetings where the draft was presented. This establishes a duty of confidence analogous to the referee in 2019. While the Friend argues that the sealed grant panel papers prevent a finding of misconduct against A, the burden of proof regarding B's access to A's internal work is met by B's own admission of attendance. Under 2019, a claimant who publishes first but breaches a confidential role loses priority to the original authors, regardless of publication date. Therefore, B's June publication is tainted. A's March preprint, while embargoed, constitutes a dateable public deposit under the logic of 2006 (dissertation deposited and catalogued), securing A's priority date against any other potential claimants. Since B is disqualified by the confidentiality breach, no split is warranted (distinguishing 2001 and 2016, which assumed independent or ethically clean competition).

  **Closest Analog and Stretching**
  The closest analog is the **2019 ruling** (Referee vs. Original Authors). It is the only precedent that explicitly subordinates publication date to ethical conduct regarding confidential information.

  *   **The Friend is stretching the 2011 ruling.** They claim 2011 shows the committee "never cared who heard an idea from whom." This misreads the minute. 2011 distinguished between *oral circulation* and *fixed record*, not between *theft* and *independence*. Applying 2011 to ignore the postdoc relationship and internal meeting access ignores the specific ethical constraint established in 2019.
  *   **You (the Secretary) are stretching the 2006 ruling.** You argue the March embargoed preprint matches the 1968 dissertation. However, the 2006 minute emphasizes the dissertation was "catalogued for consultation." An embargoed full text is not consultable. You are extending "dateable deposit" to include metadata where the precedent required the substance to be accessible to the public, even if obscure.

  **Candidate Rules and Conflict**
  The record jointly permits the following candidate rules:
  1.  **Earliest readable full disclosure:** (Favored by Friend; supported by 2011, 2016).
  2.  **Earliest dateable public deposit of any part of the result:** (Favored by Secretary; supported by 2006).
  3.  **Earliest disclosure that is still verifiable when the committee sits:** (Implied by C's exclusion; supported by 2016's rejection of private notebooks).
  4.  **Whoever supplied the decisive step, with date breaking ties:** (Supported by 2011).
  5.  **A record rule defeated by breach of a confidential role:** (Supported by 2019).

  *   **You are running:** Rule 5 (Breach of confidential role) backed by Rule 2 (Dateable deposit).
  *   **Your Friend is running:** Rule 1 (Readable full disclosure) backed by a presumption of independence (from 2001).
  *   **The Conflict Point:** The rules pick different winners on the status of **A's March preprint**. Under Rule 1, A has not disclosed the mechanism until September, making B (June) the first readable disclosure. Under Rule 2 (and Rule 5), A's March metadata secures the date, and B's access voids their June priority.

  **Underdetermination and Principles**
  The minutes genuinely underdetermine the status of an embargoed preprint.
  *   **If you rule for A:** You adopt the principle that **embargoed metadata is itself a disclosure** sufficient to establish priority, and that **taint may be inferred from materials we are forbidden to read** (the internal meetings) even if we cannot read the sealed grant.
  *   **If you rule for B:** You adopt the principle that **accessibility is judged as of the posting rather than as of the adjudication** (meaning C is out because their server died), and that **a claimant who cannot be consulted is no longer a claimant** (C's author), while also establishing that professional proximity (postdoc/meetings) does not imply a duty of confidence unless a formal referee relationship exists.

  **The Test Case**
  To settle which rule the committee has really been applying, propose this future dispute to your friend:

  *Two groups, X and Y, have no contact and no duty of confidence to one another. Group X deposits a full paper in a public repository on 1 January, but the repository's policy imposes a mandatory six-month embargo on downloading the full text; the title, abstract, and authors are visible immediately. Group Y publishes the same full paper in an open-access journal on 1 March. Who has priority?*

  *   If the committee awards **X**, it confirms that **earliest dateable public deposit** (Rule 2) is the supreme rule, validating your reading of 2006.
  *   If the committee awards **Y**, it confirms that **earliest readable full disclosure** (Rule 1) is the supreme rule, validating your friend's reading of 2011 and 2016.
  *   If the committee **splits** the prize, it confirms that **private completion** (like 2016 notebooks) combined with public metadata creates a shared claim, a rule not yet explicitly written.

  This case removes the "ugly" ethics of the current dispute (2019) and the "ghostly" evidence of Group C, isolating the specific tension between *dateability* and *readability* that is causing your deadlock.
