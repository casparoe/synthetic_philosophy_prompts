answer: |-
  It is not a category mistake to treat archival silence as an inference problem; your intuition from geophysics is sound where the archive functions as a sampling instrument. The error lies in assuming the archive is *only* a sampling instrument. In geophysics, the ocean does not care if you measure it. In history, the subjects of the record often knew they were being recorded, and the record-keepers knew they were keeping records for specific purposes. Silence is not always a *failure* of capture (selection effect); often it is a *success* of exclusion (constitutive effect). A theory that models silence only as missing data will systematically underestimate the agency involved in producing that absence. You should be asking not only "What can we infer from this gap?" but "What work does this gap perform for the system that produced the archive?"

  Below is a revised typology and a set of desiderata tested against that distinction.

  ### Revised Typology of Silence
  Your five mechanisms are largely sound, but the boundaries require adjustment to account for power.

  1.  **Generative:** No record created (absence of event or absence of witness).
  2.  **Custodial:** Record created but lost/destroyed (attrition).
  3.  **Classificatory:** Record exists but is unfindable (metadata failure).
  4.  **Epistemic:** (Merges your *Credibility* and *Hermeneutic*.) The record exists and is found, but is unreadable as evidence due to contemporary credibility hierarchies or conceptual incommensurability. These are functionally identical for the historian: the document is present but evidentially null.
  5.  **Constitutive:** (New.) The archive is structured specifically to produce this silence. The gap is not a side-effect of sampling (like the Southern Ocean) but the intended output of the recording process (e.g., enslaved people recorded as cargo rather than persons). This is distinct from Generative silence because the presence *was* noted, but categorized out of existence.

  ### Desiderata for a Theory of Archival Silence

  **R1: Mechanism Discriminability**
  *Statement:* The theory must provide criteria to distinguish between the typologies above (e.g., Generative vs. Custodial) using evidence available from inside the archive combined with independent sources.
  *Motivation:* A typology that cannot be applied to specific cases is mere taxonomy. Your logbook example turns on distinguishing "no observation" from "nothing to report."
  *Status:* **Non-Negotiable.** Without this, the theory offers no guidance for practice.

  **R2: Probabilistic Licensing**
  *Statement:* The theory must state conditions under which an absence raises or lowers the probability of a hypothesis, and quantify the confidence bounds where possible.
  *Motivation:* To prevent over-interpretation. In your shipping lane example, absence in the Southern Ocean lowers the probability of data existence but not necessarily of weather events.
  *Status:* **Camp-Relative.** Required for positivist/empiricist approaches; rejected by critical theories that view probability as masking power dynamics.

  **R3: Reflexivity**
  *Statement:* The theory must be applicable to the evidence the theorist uses to establish that silencing occurred, including their own preferred sources.
  *Motivation:* To avoid the "view from nowhere." If you claim a record is silenced because of power, you must account for the power structures enabling your own claim.
  *Status:* **Non-Negotiable.** Essential for logical coherence.

  **R4: Non-Nihilism**
  *Statement:* The theory must not entail that every archive is unusable or that nothing can be known of the silenced.
  *Motivation:* To serve recovery work. A theory that proves nothing can be known is true but useless.
  *Status:* **Non-Negotiable.** A theory of silence must enable speech, not just diagnose muteness.

  **R5: Bias/Power Distinction**
  *Statement:* The theory must keep distinct the claim that an archive is a biased sample from the claim that it is an instrument of power, and specify whether either entails the other.
  *Motivation:* Bias implies correctable error; power implies structural intent. Conflating them leads to fixing sampling when oppression is the issue.
  *Status:* **Non-Negotiable.** This is the core conceptual clarity you requested.

  **R6: Medium Agnosticism**
  *Statement:* The theory must handle single fonds, multi-repository corpora, and born-digital holdings where deletion is trivial and metadata is the record.
  *Motivation:* Archives are no longer just paper. Digital silences (algorithmic suppression, bit rot) operate differently than physical loss.
  *Status:* **Camp-Relative.** Preferred for modern applicability, but historical theories may exclude digital without failing their core purpose.

  **R7: Falsifiability**
  *Statement:* The theory must specify what would count as evidence against its own diagnosis of a particular silence.
  *Motivation:* To prevent conspiracy-proofing. If no evidence could prove the silence *wasn't* power-driven, the claim is theological.
  *Status:* **Non-Negotiable.** Required for any claim to knowledge.

  **R8: Operability**
  *Statement:* The theory must be operable by a working historian with a month in a reading room rather than only by a philosopher with a thought experiment.
  *Motivation:* To ensure utility. Theory must survive contact with the box of papers.
  *Status:* **Non-Negotiable.** You asked for a tool, not a meditation.

  ### Incompatibilities and Trade-offs

  You suspected that licensing quantitative inference (R2) and treating absence as evidence of domination (R5) pull in opposite directions. You are correct. They cannot be jointly satisfied within a single coherent formal system.

  *   **The Conflict:** Probabilistic inference (R2) requires a stable generating process. You must assume that the probability of recording is a function of known variables (e.g., shipping lane proximity). Power (R5), specifically constitutive silence, operates by *destabilizing* the generating process to make the absence look natural or inevitable. If you model the silence probabilistically, you implicitly assume the system is honest but imperfect. If you model it as power, you assume the system is dishonest or structurally blind.
  *   **The Second Conflict:** Mechanism Discriminability (R1) vs. Reflexivity (R3). To distinguish Generative from Custodial silence, you often need independent sources. But if those independent sources exist, the silence is partially filled. If you rely on the archive itself to explain its own gaps (to satisfy operability), you violate reflexivity because you are using the biased instrument to measure its own bias.
  *   **The Resolution:** You must choose a lane. A theory optimized for **Recovery** (filling the gap) must prioritize R2 and R4, accepting that it may underestimate power. A theory optimized for **Critique** (exposing the gap) must prioritize R5 and R7, accepting that it may render quantitative inference impossible. A unified theory will fail R8 (Operability) because it will be too complex for a month in the reading room.

  ### Evaluation of Existing Approaches

  **1. The Empiricist Model**
  *Claim:* Archives are imperfect samples of a underlying reality. Silences are data loss.
  *Performance:* Satisfies R2 (Probabilistic) and R8 (Operability) well. Fails R5 (Bias/Power) by treating structural exclusion as random error. Fails R7 (Falsifiability) regarding power claims because it does not model power.
  *Verdict:* Good for shipping lanes, bad for enslaved people.

  **2. The Critical Model**
  *Claim:* Archives are instruments of state or colonial power. Silences are produced violence.
  *Performance:* Satisfies R5 (Bias/Power) and R3 (Reflexivity) well. Fails R2 (Probabilistic) because it rejects quantification of oppression. Fails R4 (Non-Nihilism) often, leaning toward the view that the silenced are irrecoverable.
  *Verdict:* Good for diagnosing domination, bad for reconstructing biographies.

  **3. The Hermeneutic Model**
  *Claim:* Archives are texts to be read against the grain. Silence is a rhetorical feature.
  *Performance:* Satisfies R3 (Reflexivity) and R4 (Non-Nihilism) via creative reconstruction. Fails R1 (Mechanism Discriminability) because it often conflates generative and constitutive silence. Fails R7 (Falsifiability) as interpretations are rarely falsifiable.
  *Verdict:* Good for meaning, bad for evidence.

  ### Conclusion

  You asked for a theory that tells us what may and may not be inferred. The hard truth is that no single theory satisfies all desiderata because the object of study (the archive) is simultaneously a dataset and a weapon. Your geophysical instinct serves you well for *Custodial* and *Generative* silence (the Southern Ocean problem). It fails for *Constitutive* silence (the cargo manifest problem). In the latter, the blank field is not "no observation attempted"; it is "observation attempted, human status denied." No amount of probabilistic modeling corrects for that without an external ethical axiom.

  You must accept that a theory robust enough to handle power will lose the precision to handle probability. If you demand both, you will have no theory operable in a reading room.

  Verdict: R1: Mechanism Discriminability
