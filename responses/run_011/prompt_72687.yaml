answer: |-
  This is a remarkably sharp diagnosis for someone who has only been reading philosophy for four years. You have correctly identified that the stalemate isn't merely about the data; it's about the *function* of the constructs being debated. In analytical chemistry terms, the Situationists and Virtue Ethicists are trying to use the same instrument to measure two different analytes, but they are both labeling the readout "Character."

  Your hypothesis—that the term "trait" is being loaded to do different jobs (predictive latent variable vs. evaluative standard)—is the strongest lead. Let's run your four candidate diagnoses against the text of the debate to see where the signal-to-noise ratio breaks down.

  ### 1. Verbal Dispute (The Calibration Problem)
  **Diagnosis:** The parties agree on the world but disagree on the label "trait."
  **Verdict:** **Partial Fit.**

  This is the surface-level friction. The Situationist (e.g., John Doris, Gilbert Harman) defines a "global character trait" operationally as a disposition that manifests consistently across a wide range of trait-relevant situations with a high correlation coefficient. When the data shows $r \approx 0.30$, they conclude the instrument is measuring noise, not the analyte.

  The Virtue Ethicist (e.g., Nancy Snow, Rachana Kamtekar) recalibrates the instrument. They argue that the Situationist definition is a straw man. A virtue isn't a reflex; it's a *reason-responsive* disposition. If a honest person doesn't return a wallet when doing so would get them killed, that isn't a failure of the trait "honesty"; it's a conditional boundary condition.

  **Where it sticks:** If this were purely verbal, we could stipulate definitions and move on. But we can't. The Situationist insists that if you narrow the conditions enough to make the trait empirically visible (the "if-then" profile), it ceases to be a *global* trait and becomes a set of local habits. If it's local, it can't support the broad normative claims of Aristotelian ethics (e.g., "Justice is a unified virtue"). So, the verbal dispute masks a structural incompatibility: the Virtue Ethicist needs "global" to do normative work; the Situationist needs "global" to be empirically robust. They can't both have it.

  ### 2. Two Questions Under One Label (The Analyte Mismatch)
  **Diagnosis:** One side asks "What predicts behavior?" (Psychology); the other asks "What constitutes flourishing?" (Ethics).
  **Verdict:** **Strong Fit.**

  This is the core of your hypothesis.
  *   **The Situationist Question:** "Is 'virtue' a valid *predictive construct* in a causal model of behavior?" They are treating ethics as a natural kind. If the construct doesn't predict variance better than situational variables, the construct is scientifically idle.
  *   **The Virtue Ethicist Question:** "Is 'virtue' a valid *normative standard* for human life?" They are treating ethics as an ideal type.

  **The Conflict:** The Situationist argues that if the psychology fails, the ethics collapses because virtue ethics claims to be naturalistic (it's about human functioning). The Virtue Ethicist counters that an ideal doesn't cease to be an ideal just because most of the population fails to meet it. A calibration standard doesn't stop being the standard just because most balances in the lab are out of spec.

  **Why this stalls you:** The Situationist replies that an ethics built on ideals that humans psychologically *cannot* attain is useless or dangerous (it leads to blaming the victim). The Virtue Ethicist replies that an ethics based solely on statistical averages is no ethics at all (the "naturalistic fallacy"). You are stuck because one side is demanding *existence proofs* and the other is offering *teleological goals*.

  ### 3. Hidden Empirical Question (The Variance Decomposition)
  **Diagnosis:** There is a fact of the matter regarding variance (Person vs. Situation vs. Interaction) that hasn't been settled.
  **Verdict:** **Weak Fit (Mostly Settled).**

  You are correct that personality psychology largely settled this. The consensus is Interactionism: Behavior $= f(Person, Situation, Person \times Situation)$. The "if-then" signatures (Mischel & Shoda's CAPS model) are stable.

  **Why philosophers ignore the settlement:** Because the settlement doesn't help the Virtue Ethicist as much as they hope. Knowing that a person has a stable "if-then" signature (e.g., helpful when observed, unhelpful when anonymous) confirms the Situationist's point that the *situation* is a co-determinant of the trigger. It saves the "person" term from being zero, but it reduces the "global trait" to a fragmented set of context-dependent scripts.

  However, there is a hidden empirical question remaining: **Aggregation over Time.** The Situationist relies on single-occasion experiments (the seminary study). The Virtue Ethicist argues that character is a longitudinal property. A single data point is indeed noise. If we aggregated behavior over 10 years, the "person" variance might swell. The debate stalls because the Situationist demands prediction of the *single act* (high stakes for moral responsibility), while the Virtue Ethicist claims prediction of the *life trajectory*. They are measuring over different time constants.

  ### 4. Disagreement About Admissible Evidence (The Detection Limit)
  **Diagnosis:** The parties disagree on what counts as data.
  **Verdict:** **Critical Fit.**

  This is where your point about the replication mess becomes vital.
  *   **Situationist Evidence:** Controlled laboratory experiments (Milgram, Zimbardo, Darley & Batson). High internal validity, low ecological validity.
  *   **Virtue Ethicist Evidence:** Biographies, historical exemplars, phenomenological reports, and intuition. High ecological validity, low internal validity.

  **The Replication Crisis Impact:**
  The archival re-reading of the Stanford Prison Experiment (Haslam & Reicher) and the failure of many priming studies (the "dime in the phone booth" effect is far less robust than originally thought) does not dissolve Situationism, but it *relocates* the argument.
  *   **Before:** Situationists could say, "The data proves traits are empty."
  *   **After:** Situationists must say, "The data proves traits are *fragile* and situational influence is *subtler* than we thought."

  This shifts the burden of proof. If the "dime" study doesn't replicate, the Situationist loses a key piece of evidence for the *triviality* of situational triggers. However, they retain the Milgram data (which has held up better in variations).

  **What settles this?** Nothing, unless they agree on a detection limit. The Situationist sets the detection limit at "cross-situational consistency in controlled trials." The Virtue Ethicist sets it at "narrative coherence over a lifetime." Until they agree on the *scale* of measurement, new data will just be interpreted through existing priors. The Virtue Ethicist will dismiss the prison study as "coercive simulation," and the Situationist will dismiss the biography of Socrates as "hagiography."

  ### Synthesis: Diagnosing the Stalemate

  Your hypothesis is correct. The dispute is not primarily factual (Diagnosis 3 is weak) nor purely verbal (Diagnosis 1 is insufficient). It is a **Category Error fueled by Evidentiary Disagreement (Diagnosis 2 + 4).**

  The Situationist is treating "Virtue" as a **causal mechanism** (like a chemical reagent) and finding it doesn't react consistently.
  The Virtue Ethicist is treating "Virtue" as a **regulative ideal** (like a purity standard) and arguing that impurity in the sample doesn't invalidate the standard.

  The Situationist says: "You claim this reagent exists. My assay shows it doesn't react."
  The Virtue Ethicist says: "I claim this is the standard of purity. The fact that your samples are impure is the problem, not the standard."

  ### What Would Progress Look Like?

  Given your background, you know that when two labs can't reconcile data, you check the method. Here is the hierarchy of potential progress, from most to least likely:

  1.  **A Change of Question (Most Likely):** The field moves toward "Moral Psychology" rather than "Virtue Ethics vs. Situationism." Researchers accept the CAPS model (if-then signatures) and ask: "How do we design situations to trigger the 'good' if-then profiles?" This sidesteps the ontological question of "Do global traits exist?" and focuses on "How do we engineer moral behavior?" This effectively concedes the empirical point to the Situationist while keeping the normative goal of the Virtue Ethicist.
  2.  **A Formal Model (Possible but Difficult):** A computational model where the "trait" term is a weighting parameter on situational inputs. If the model can predict behavior better with the trait parameter included (even as a conditional weight), the Virtue Ethicist wins the "explanatory work" argument. If the model performs equally well with only situational inputs, the Situationist wins. This requires operationalizing "virtue" into code, which ethicists resist.
  3.  **An Operational Definition (Unlikely):** Both camps signing off on a definition of "trait." The stakes are too high. For the Situationist, admitting conditional traits saves Virtue Ethics. For the Virtue Ethicist, admitting traits are only local undermines the unity of the virtues.
  4.  **Honest Argument for No Progress (The Realist View):** The debate is a proxy war for a deeper metaphysical disagreement about Free Will.
      *   If you believe in strong agency, you *need* global traits to make sense of responsibility. You will interpret data to find them (aggregation, conditional signatures).
      *   If you lean toward determinism or compatibilism, you *prefer* situationism because it locates causality in the environment (which is modifiable) rather than the "soul" (which is not).
      *   **Conclusion:** No amount of behavioral data will settle a metaphysical commitment. The "detection limit" is set by their ontology, not their methodology.

  **Final Diagnosis:**
  You are stalled because you are looking for an empirical resolution to a normative conflict. The psychology *has* settled (Interactionism/Conditional Signatures). The philosophy hasn't, because the philosophy isn't actually about the psychology. It's about whether moral responsibility requires a "global" agent.

  **Recommendation:** Stop looking for a verdict on who is right about the data. The data is agreed upon (modest correlations, strong situational effects). Look for the work that accepts the psychology (Situationist victory) but reconstructs the ethics (Virtue Ethicist survival). Search for **"Neo-Aristotelian Moral Psychology"** or **"Fragmentationism."** That is where the gears are actually turning now. The fight you are reading about is largely a legacy debate from the 1990s/2000s that has been superseded by more nuanced interactionist models which neither side in the old debate fully anticipated.
