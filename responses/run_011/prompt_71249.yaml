  Last month I sold the small consultancy I ran for eleven years, and for the first time in my adult life I hold capital that is not tied up in a business. A former client whose judgment I trust has offered me a seat in a recurring private arrangement: at the start of each quarter I may commit any fraction f of my liquid capital; the committed amount grows by 60 percent with probability 0.55 and shrinks by 50 percent with probability 0.45; outcomes are independent across quarters; no borrowing is possible; and the arrangement stays open for as long as I want it, though I expect to wind down in roughly ten years.

  Two features of my situation seem to matter for what I want to ask you. First, there is no absorbing state. Because the worst case costs me half of whatever I commit, my wealth is multiplied by a strictly positive factor every quarter and can never be driven to zero, so the familiar argument that growth-rate maximization is needed to avoid ruin does not apply to me in its standard form. Second, about a third of the money is earmarked: if my liquid capital falls below a fixed floor within the next three years, I lose a house purchase that is already settled in my mind, and that is a loss I cannot undo by waiting for the long run to arrive.

  The arithmetic I can do myself, so please do not spend words on it. Expected wealth grows by a factor of 1 + 0.105f per quarter, so a one-period expected-value maximizer wants f = 1; expected log growth is maximized near f = 0.35, at about 1.8 percent per quarter; and at f = 1 expected log growth is roughly negative 5 percent per quarter, meaning that expected wealth compounds at about 50 percent per quarter while the typical long-run path shrinks. What I cannot settle is which of these targets is the right one, and my question is about the philosophy underneath that choice rather than about the portfolio choice itself.

  Here is the proposition, stated as precisely as I can manage. For an agent in a situation structurally like mine — repeated, reinvestable, independent gambles over a finite but substantial horizon, with no absorbing barrier but with a threshold below which a loss is not recoverable — maximizing expected log wealth, which for such gambles coincides with the long-run time-average growth rate, is the correct criterion of rational choice, in the sense that an agent who instead maximized expected utility under some other concave utility function would be making a genuine mistake and not merely displaying a different temperament.

  Please give me your credence in that proposition, together with the decomposition that produces it. Break the question into the sub-questions that actually carry the weight, assign a rough probability to each, and give a sentence or two of justification per term. I would expect your list to include at least the following, though you should revise it if you think I have carved things badly: whether the divergence between time averages and ensemble averages does real normative work in a setting like mine, and whether that work survives the absence of any absorbing state; whether Samuelson's line of objection — that no finite horizon licenses treating a high growth rate as automatically desirable, and that an expected-utility maximizer with a different utility function is not thereby irrational — is genuinely answered by the growth-rate program or merely sidestepped; whether the horizon-independence of optimal portfolio shares under constant-relative-risk-aversion utility deflates the dispute, by making the log criterion one member of a family rather than a privileged one; whether my three-year floor converts the target from growth rate into a threshold-clearing criterion of the safety-first family, and if so whether that is a repair to geometric rationality or a rival to it; and how much of the whole disagreement you would dismiss as verbal, a quarrel about what the word rational is being asked to track.

  Then combine the terms into a single number and tell me which term that number is most sensitive to, along with the argument or piece of evidence that would move you furthest. Finally, two people close to me disagree about this, and I want to know where. My brother-in-law, who reads the recent ergodicity-economics literature, puts about 0.85 on my proposition; my former economics professor puts about 0.15 and describes the whole program as a category mistake. Given your decomposition, name the one or two sub-questions on which those two are most likely parting company, and say what you would ask each of them in order to find out.

  If you think the proposition as I have stated it lacks a determinate truth value, say so and explain why, and then give me your number for the nearest proposition you are willing to evaluate. I am not asking for sources, a bibliography, or a reading list; I want your reasoning, not your citations. Please write in American English.
