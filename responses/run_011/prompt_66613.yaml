      1.  **Semantic Alignment:** (Cognitive content matches perceptual shift).
      2.  **Judgment-Independence:** (Measure isn't just a report).
      3.  **Doxastic Sensitivity:** (Effect tracks rational status of belief).

      *Sorting:*
      1.  Genuine: Semantic Alignment.
      2.  Prejudice: Judgment-Independence (too strict?).
      3.  Restatement: Doxastic Sensitivity (This is the definition of the epistemic threat, hard to test).
      *Wait, better sorting:*
