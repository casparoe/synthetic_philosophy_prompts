answer: |-
  Here are five desiderata for establishing cognitive penetration, tailored to your epistemological purpose. Each includes the rationale, a case that satisfies it, and a case that fails it, drawn from the standard literature.

  ### The Desiderata

  **1. The Semantic Alignment Requirement**
  *   **Consideration:** To threaten epistemology, the cognitive cause must be doxastic (belief-like) and its content must match the perceptual change. Mere arousal or physiological state is insufficient; the experience must change *because* of what the belief says, not just because the brain is activated.
  *   **Satisfies:** **Memory Colour.** A subject believes bananas are yellow; a grey banana looks faintly yellow. The perceptual shift (yellowing) aligns semantically with the cognitive content (banana-ness).
  *   **Fails:** **Hunger Studies.** Hungry subjects report food items looking larger. This tracks a physiological drive (ghrelin levels), not a specific belief about the food's properties. It is a bodily state, not a cognitive bias inheriting into experience.

  **2. The Judgment-Independence Requirement**
  *   **Consideration:** To prove the change is *perceptual* and not a post-perceptual bias in reporting, the measure cannot rely on the subject's explicit judgment about the stimulus. If the subject decides "it looks bigger," they may simply be guessing the hypothesis or adjusting their criterion for "big."
  *   **Satisfies:** **Adaptation Aftereffects.** If viewing a "valuable" coin induces a tilt-aftereffect or motion-aftereffect consistent with size distortion, this bypasses explicit judgment. (Note: These are rare and contested in this literature).
  *   **Fails:** **Coin Size Judgements.** Subjects verbally estimate or manually match the size of coins. This is indistinguishable from a subject believing "valuable things are big" and reporting accordingly, regardless of actual visual experience.

  **3. The Attention-Control Requirement**
  *   **Consideration:** Cognitive penetration must be distinguished from cognitive *modulation* of attention. If a belief simply directs spatial or feature-based attention to a part of the stimulus, early vision remains encapsulated; only the input selection changes.
  *   **Satisfies:** **Ambiguous Figures.** Being told "this is a duck" makes you see a duck, even when spatial attention is fixed on the center of the image. The interpretation flips without an attentional shift to a new region.
  *   **Fails:** **Shooter Bias.** Subjects shoot armed targets faster. This is largely explained by attentional orienting toward threat-related features (guns) rather than a change in the visual phenomenology of the object itself.

  **4. The Doxastic Sensitivity Requirement**
  *   **Consideration:** For the effect to be epistemically evaluable (good/bad reasoning), it must track the *rational status* of the belief. If I believe $P$ falsely, and my experience changes, that is penetration. If I know $P$ is false (or the belief is defeated) and the experience *still* changes, it is a modular illusion, not a cognitive integration.
  *   **Satisfies:** (Hypothetical) A study where informing subjects that a cue is unreliable eliminates the perceptual distortion induced by that cue.
  *   **Fails:** **Müller-Lyer Illusion.** Knowing the lines are equal does not stop them looking unequal. The effect is cognitively impenetrable; it does not respect the subject's doxastic state.

  **5. The Phenomenal Specificity Requirement**
  *   **Consideration:** The change must be in the *seeming* itself, not just in the confidence or salience of the detection. Epistemology cares about the justifier (the experience), not the attitude toward the justifier.
  *   **Satisfies:** **Memory Colour.** The grey patch genuinely appears tinged; it is not just that the subject is more confident it is a banana.
  *   **Fails:** **Shooter Bias.** The subject detects the gun faster or is more willing to shoot, but the gun does not necessarily *look* different (e.g., larger or closer). The change is in decision criterion, not phenomenology.

  ***

  ### The Sorting

  **Pile 1: Genuine Requirements**
  *   **Semantic Alignment:** Without this, you haven't shown *cognition* is doing the work, only arousal or physiology.
  *   **Attention-Control:** Without this, you haven't shown *perception* is changing, only input selection. These two are necessary to establish the basic phenomenon.

  **Pile 2: Methodological Prejudices**
  *   **Judgment-Independence:** This is the modularist's shield. It demands physiological or implicit measures (eye-tracking, adaptation) over reports. While methodologically rigorous, it hardens into a requirement that defines "perceptual" as "pre-conscious," which begs the question against the liberal view that perception includes high-level processing.
  *   **Demand Characteristic Immunity:** The insistence that an effect must survive all possible cues about the experimenter's expectation. This is an impossible standard; no psychological experiment is immune to this, yet it is frequently invoked to dismiss penetration results specifically.

  **Pile 3: Restatements / Tautologies**
  *   **Doxastic Sensitivity:** This is not an empirical test; it is a restatement of your epistemological goal. To demand the effect track rationality is to demand the conclusion (that perception is reason-responsive) as a premise for the evidence.
  *   **Phenomenal Specificity:** This largely restates the definition of penetration ("change in experience"). It offers no independent criterion for *detecting* that change other than asking the subject, which circles back to the Judgment-Independence problem.

  ***

  ### The Collision: Is the Debate Unfalsifiable?

  Your worry is correct: **The Judgment-Independence Requirement and the Semantic Alignment Requirement are in tension, and potentially incompatible.**

  To satisfy **Semantic Alignment**, you need to know the subject's experience matches the *content* of a belief (e.g., "yellow," "large," "threatening"). Content is propositional. The only access we currently have to propositional content in a subject is through their reports or behavior that implies understanding (judgment).

  To satisfy **Judgment-Independence**, you must bypass reports and use measures like adaptation aftereffects, eye movements, or reaction times. However, these measures are content-blind. An eye movement shows *where* someone looked, not *what* they saw. An adaptation aftereffect shows neural fatigue in a channel (e.g., orientation), but it cannot easily distinguish between "seeing a duck" and "seeing a rabbit" if the low-level features are identical.

  **The Route Out:**
  There is a narrow route out using **Perceptual Learning/Adaptation designs**. If a category label (e.g., "this is a bird") induces a low-level adaptation effect (e.g., tilt aftereffect) that a non-category label does not, you bypass judgment.
  **The Cost:** This route sacrifices **Ecological Validity** and arguably **Epistemic Relevance**. It proves that high-level categories can tune low-level detectors, but it does not prove that a specific *belief* (e.g., "this coin is valuable") alters the *justificatory power* of a specific experience. It shows plasticity, not necessarily the kind of rational integration that threatens the "independent check" status of perception.

  **The Verdict:**
  The collision is real. If you enforce Judgment-Independence strictly, the debate becomes unfalsifiable for the Liberal, because the measures that satisfy independence cannot detect the semantic content required for the epistemic threat. If you allow Reports, the Modularist dismisses the data as post-perceptual judgment. The debate is currently stalled because the "Gold Standard" evidence (Content-Specific + Judgment-Independent) is methodologically out of reach.

  ***

  ### Conclusion

  The **Judgment-Independence Requirement** does the most damage to the most-cited results. It effectively nullifies the Coin Size, Memory Colour, and Hunger studies, as all rely on adjustment tasks, matching, or verbal reports that can be re-described as response biases. By demanding a measure that bypasses the subject's agency, this requirement privileges the Modularist architecture by definition: it assumes that anything accessible to judgment is already "post-perceptual."

  Consequently, the **Modularist account comes out better against the list as a whole.** The list, particularly when sorted by methodological rigor, favors a architecture where early vision is sealed off from belief. The Liberal can only win by arguing that the Judgment-Independence requirement is a prejudice—that perceptual experience is inherently reportable and that demanding otherwise is to ask for a "view from nowhere." However, for the purpose of your thesis, acknowledging this collision is your strongest move: it allows you to argue that the empirical debate is inconclusive *because* the methodological standards are stacked against the very phenomenon (epistemically relevant penetration) that matters. You can then pivot to a theoretical argument: even if the empirical evidence is ambiguous, the *possibility* of penetration forces a revision of how we model the relationship between belief and justification.
