answer: |-
  To proceed, you must accept that a normative theory for bounded agents cannot hide behind asymptotic guarantees. If the theory is to tell an agent what it *ought* to believe, it must yield determinate verdicts on the evidence actually available. Below are the desiderata. They are not suggestions; they are the conditions under which I will evaluate whether your thesis holds water.

  ### Desiderata for a Normative Prior

  **1. Dominance (The Non-Dogmatism Requirement)**
  *Motivation:* The account must not assign zero probability to any hypothesis that is effectively computable. If the true data-generating process is computable, the agent must not be dogmatically closed to it. This is the primary motivation for the universal prior: it multiplicatively dominates every lower-semicomputable semimeasure. Without this, the agent risks assigning probability zero to the truth simply due to a modeling blind spot, rendering learning impossible regardless of data volume.

  **2. Language Invariance (The Objectivity Requirement)**
  *Motivation:* Inductive conclusions should not depend on the arbitrary choice of description language or reference Turing machine. If two agents with equivalent evidence but different encoding conventions arrive at contradictory probabilities for the same event, the account fails as an objective norm. The justification relies on the Invariance Theorem, which bounds the difference in Kolmogorov complexity between languages by a constant.

  **3. Semi-Computability (The Approximability Requirement)**
  *Motivation:* Since a universal prior over all computable hypotheses is uncomputable (due to the Halting Problem), the account must specify how a bounded agent approximates the ideal. It must clarify the direction of approximation (typically lower semi-computable, allowing probability mass to grow but never be fully normalized in finite time) and explicitly state what is forfeited: specifically, the absence of a decision procedure means the agent cannot know when it has converged or when to stop searching for better hypotheses.

  **4. Convergence to Truth (The Consistency Requirement)**
  *Motivation:* In the limit of infinite data, the agent's beliefs must converge to the true distribution, provided the truth lies within the support of the prior. This is the minimum bar for reliability; a normative account that permits stable belief in falsehoods given infinite evidence is defective.

  **5. Finite-Sample Adequacy (The Action-Guidance Requirement)**
  *Motivation:* Agents act on finite data. The account must yield reasonable probability assignments at sample sizes $n$ where $n$ is smaller than the invariance constant $c$ between reference machines. If the theory only works asymptotically, it cannot guide action in the real world. This requires the prior to penalize ad-hoc complexity (like "Grue") relative to natural kinds ("Green") even when data is sparse.

  **6. Logical and Mathematical Uncertainty (The Omniscience Requirement)**
  *Motivation:* A bounded agent cannot know all logical consequences of its beliefs. A normative account must distinguish between empirical uncertainty (contingent facts) and logical uncertainty (necessary truths not yet deduced). The prior must not assign probability 1 to all mathematical truths immediately, nor should it allow Dutch books based on undiscovered contradictions.

  **7. Indexical Uncertainty (The Self-Location Requirement)**
  *Motivation:* Agents must reason about their own position in the world (e.g., the Doomsday Argument, Sleeping Beauty). A prior over world-histories is insufficient if it cannot weight hypotheses by the number of observers or the agent's specific location within the hypothesis. The account must specify how "I" is indexed within the hypothesis space.

  **8. Hypothesis Space Topology (The Continuity Requirement)**
  *Motivation:* Physical parameters are often continuous (real-valued), yet standard Solomonoff induction operates over discrete bit strings. The account must explain how it handles inference over continuous parameters without arbitrary discretization that distorts the prior density (the Borel-Kolmogorov paradox). It must justify whether the space is countable or how measure theory is applied to uncountable spaces without losing the dominance property.

  ---

  ### Critical Analysis of Requirements

  **Non-Negotiable vs. Settled Preferences**
  *Non-Negotiable:* **Dominance** and **Finite-Sample Adequacy**. If the account allows dogmatism against computable truths, it fails as a general theory of induction. If it cannot guide belief on finite data, it fails as a *normative* guide for bounded agents.
  *Settled Preferences:* **Reference Machine Choice**. Proponents of Solomonoff Induction often treat the choice of a Universal Turing Machine as a negligible detail. This is a preference, not a derived necessity. **Logical Uncertainty Handling**. While necessary, the specific mechanism (e.g., logical induction vs. bounded rationality) is currently a matter of research camp preference rather than settled theory.

  **Jointly Unsatisfiable Subsets**
  1.  **Computability + Dominance + Convergence.**
      *Status:* **Theorem.**
      It is impossible to construct a computable prior that dominates all computable measures. If the prior is computable, there exists a computable measure it fails to dominate (via diagonalization). You must sacrifice computability to keep dominance, or sacrifice dominance to keep computability.
  2.  **Language Invariance + Finite-Sample Adequacy.**
      *Status:* **Theorem (in practice).**
      The Invariance Theorem guarantees $|K_1(x) - K_2(x)| \leq c$. However, $c$ depends on the machines. If $c$ is one million bits, and your data is 1,000 bits, the complexity ordering of hypotheses can flip entirely between machines.
  3.  **Logical Omniscience + Boundedness.**
      *Status:* **Theorem.**
      An agent cannot be normatively required to believe all logical consequences of its axioms if it is computationally bounded.

  **The Single Most Eliminative Requirement**
  **Computability.**
  Demanding that the normative account be computable eliminates the Universal Prior itself, along with any theory relying on unbounded search. It leaves only truncated approximations, minimax approaches, and subjectivist priors. However, if you insist on **Dominance** as the primary filter, it eliminates the Subjectivist and Truncated candidates, leaving only the Universal Prior (which then fails Computability). For a dissertation claiming to defend Solomonoff Induction for *bounded* agents, **Computability** is the hammer that will break your thesis unless you can convincingly argue that a normative ideal need not be implementable.

  **The Finite-Data Pressure Point**
  You must address the "million bits" problem directly. The Invariance Theorem is an asymptotic result ($n \to \infty$). At finite $n$, specifically where $n < c$, the theorem provides no normative constraint. If I define a language $L'$ that includes a primitive symbol for the first million bits of $\pi$, and you use standard $L$, our complexity assessments for any data set smaller than a million bits will diverge by that constant. Consequently, the claim that Solomonoff Induction objectively penalizes "Grue" relative to "Green" is false unless the reference machine is fixed to favor "Green" primitives. If the machine favors "Grue," Solomonoff prefers "Grue." Therefore, the Invariance Theorem does no normative work at the scale of human observation; it only guarantees agreement in a limit we will never reach. You must explain why an account that yields opposite verdicts on all actual human data depending on an arbitrary machine choice deserves the title of "Correct Normative Account."

  ---

  ### Scorecard of Contenders

  **1. The Universal Prior (Solomonoff Induction)**
  *Strengths:* Satisfies Dominance and Convergence perfectly. It is the unique prior that learns all computable environments.
  *Weaknesses:* Fails Computability (unimplementable). Fails Finite-Sample Adequacy regarding Language Invariance (the constant offset problem renders it arbitrary for realistic data sizes). Assumes logical omniscience.
  *Verdict:* The theoretical ceiling, but normatively inert for bounded agents without a fixed, justified reference machine.

  **2. Truncated Program Search**
  *Strengths:* Computable. Approximates the Universal Prior within a resource budget.
  *Weaknesses:* Loses Dominance. If the true generator requires a program longer than the truncation limit, the agent assigns it zero probability and can never learn it. Convergence is not guaranteed.
  *Verdict:* A practical engineering approximation, but fails the normative test of non-dogmatism.

  **3. Minimax-Regret Construction**
  *Strengths:* Dispenses with the need for a prior; robust against worst-case scenarios. Often computable or approximable.
  *Weaknesses:* Does not provide a full probability distribution (often yields sets of probabilities or point predictions only). Struggles with singular causal inference and logical uncertainty. Lacks the Bayesian updating structure required for sequential learning guarantees.
  *Verdict:* A robust decision theory, but not a complete account of inductive *belief*.

  **4. Ordinary Subjectivist Bayesian**
  *Strengths:* Computable (with chosen priors). Coherent. Handles continuous parameters naturally via measure theory.
  *Weaknesses:* Fails Dominance (any strictly positive prior is permitted, even dogmatic ones). Fails Uniqueness (no yardstick to judge one prior against another besides coherence). Relies on "calibration" which is circular without an objective prior.
  *Verdict:* Normatively too permissive; allows irrational priors provided they are coherent, failing the "correct account" thesis.
