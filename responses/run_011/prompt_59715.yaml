  # Session Plan: The Unraveling Ladder

  ## Phase 1: Setup and Incentives (0:00–0:10)
  **Room Setup:** 12 tables, 2 chairs each. 24 students.
  **Materials:** 12 "Game Folders" (containing payoff sheets, prediction slips, token bags), 12 six-sided dice (for Condition 3), a master spreadsheet projected on screen (blank).

  **Opening Script:**
  "Welcome. Today is not a lecture. It is an experiment in decision-making. You will play a game in pairs. You will earn tokens. At the end of the semester, tokens convert to extra credit points. There is a cap on the total extra credit available to the class, but no risk to your baseline grade. However, tokens are scarce. Earning fewer tokens now means less credit later.

  **The Strangers Rule:** You will play three conditions. After each condition, you will change partners. You will never play the same person twice. This removes **reputation**. In the real world, you might cooperate now to build trust for later. Here, you cannot. Every interaction is a clean slate. This isolates the logic of *this specific game* from the strategy of *long-term relationships*.

  **The Theorist Protocol:** Four or five of you recognize this game structure. If you do, you are under an honor code instruction: **Do not play the textbook solution.** Your task is to play your natural instinct. If you play the 'rational' solution immediately, you render the data useless for the class's learning goal. Mark your prediction slip with a 'T' if you are a theorist; I will filter your data during the debrief, but you must play your gut."

  ## Phase 2: Condition 1 – Full Ladder (0:10–0:30)
  **Instructions:** "You are Pair A and B. Player A moves first. Look at Node 1. You may **Take** or **Pass**. If you Take, the game ends, and you get the 'Take' payoff. If you Pass, the pot grows, and it becomes Player B's turn at Node 2. This continues to Node 10. If Node 10 is Passed, the game ends with the 'Terminal' payoff.

  **Prediction Round:** Before you play, write down: At Node 5, what will the mover do? Stake 5 tokens on your prediction. If you are right, you win 10 tokens. If wrong, you lose the 5."

  **Activity:** Students play. Facilitator records the termination node for each pair on the master sheet.
  **Time:** 15 minutes play, 5 minutes recording/shuffling.

  ## Phase 3: Condition 2 – Deep Subgame (0:30–0:50)
  **Instructions:** "New partners. You are now entering a game already in progress. You are at **Node 8**. The pot has already grown to the Node 8 value. You did not see Nodes 1–7. You possess an endowment of tokens representing the pot so far. If the game ends badly, you lose this endowment. Player A moves at Node 8. Rules are otherwise identical."

  **Diagnostic Intent:** This starts late (Node 8 of 10). If Backward Induction (BI) is the driver, they should Take immediately (Node 8 or 9). If they Pass, it suggests the unraveling in Condition 1 was driven by the *history* of the game, not just the logic of the end.
  **Prediction Round:** Stake 5 tokens on: Will the game reach the Terminal Payoff?
  **Activity:** Play and record.
  **Time:** 15 minutes play, 5 minutes recording/shuffling.

  ## Phase 4: Condition 3 – Random Termination (0:50–1:10)
  **Instructions:** "New partners. Full Ladder (Node 1 to 10). **New Rule:** After every move, roll the die. On a 6, the game ends immediately, and current pot is split 50/50. On 1–5, the game continues. There is no known final node."

  **Diagnostic Intent:** BI requires a known last node. Here, there is none. If cooperation increases compared to Condition 1, it confirms the *finite horizon* was the constraint on cooperation.
  **Prediction Round:** Stake 5 tokens on: How many nodes will be played on average?
  **Activity:** Play and record.
  **Time:** 15 minutes play, 5 minutes recording.

  ## Phase 5: Debrief (1:10–1:30)
  **Script:** "Look at the board. In Condition 1, how many pairs ended at Node 1? (Likely few). How many made it to Node 10? (Likely some).

  We have three candidate explanations for your behavior:
  1.  **Backward Induction:** Reasoning from the final node.
  2.  **Belief in Types:** Believing some people are 'cooperators' makes it rational to pass early to test them.
  3.  **Inequality Aversion:** You pass as long as the split feels fair; you take when the split becomes insulting.

  **Mapping the Data:**
  *   **If BI is true:** Condition 1 should end at Node 1. Condition 2 should end at Node 8. Condition 3 is undefined (no end).
  *   **If Belief in Types is true:** Condition 1 shows early passing. Condition 2 (no history) might show *less* passing because there's no time to build a 'type' reputation.
  *   **If Inequality Aversion is true:** Taking should cluster at nodes where the 'Take' split is most unequal relative to the pot.

  **The Reveal:** The logic you were fighting against is called **Backward Induction**. It assumes Common Knowledge of Rationality. This activity cannot manufacture Common Knowledge. I have to tell you: BI only works if you know I know you know I am rational. You didn't know that. That is why the theory broke."

  **Failure Mode Check:** "Did anyone feel the token stakes were too low? Did the theorists accidentally signal? Next time we will..." (See JSON for details).

