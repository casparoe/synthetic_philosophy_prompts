  # Artifact 1: Payoff Ladder Table

  | node | mover | (mover, other) if mover takes | (mover, other) if mover passes and other takes | (mover, other) if both pass to the end | temptation premium as a share of the pot at that node | what backward induction says the mover does here |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | 1 | P1 | (18, 2) | (5, 15) | (50, 50) | 72% (13/18) | Take |
  | 2 | P2 | (16, 4) | (6, 14) | (50, 50) | 62% (10/16) | Take |
  | 3 | P1 | (20, 5) | (7, 13) | (50, 50) | 65% (13/20) | Take |
  | 4 | P2 | (22, 6) | (8, 12) | (50, 50) | 63% (14/22) | Take |
  | 5 | P1 | (26, 7) | (9, 11) | (50, 50) | 65% (17/26) | Take |
  | 6 | P2 | (30, 8) | (10, 10) | (50, 50) | 66% (20/30) | Take |
  | 7 | P1 | (35, 9) | (12, 9) | (50, 50) | 65% (23/35) | Take |
  | 8 | P2 | (40, 10) | (14, 8) | (50, 50) | 65% (26/40) | Take |
  | 9 | P1 | (45, 12) | (20, 6) | (50, 50) | 55% (25/45) | Take |
  | 10 | P2 | (55, 15) | (50, 50) | (50, 50) | 9% (5/55) | Take |

  *Note on Arithmetic:* The "Temptation Premium" is calculated as (Mover Take Payoff) minus (Mover Payoff if they Pass and Other Takes at Next Node). For Node 10, it is (Mover Take) minus (Terminal Payoff). The "Share of Pot" is Premium / Mover Take Payoff (approximating pot share). The table satisfies the constraint that the premium share shrinks significantly by the final node (from ~65% to 9%), making the final defection psychologically hardest despite BI demanding it. The "Pass/Other Take" column ensures BI holds (Take > Pass Value) at every node.

