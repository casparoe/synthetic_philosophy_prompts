      *   **Task:** Adjudicate an argument between Dr. N. (Quaternary stratigrapher) and Prof. A. (Environmental Historian) regarding the rejection of the Anthropocene epoch proposal.
      *   **Method:**
          1.  Begin by listing 3-4 distinct questions the speakers are conflating or trading places on.
          2.  Adjudicate moves 1-7 individually (Rating: Clearly Mistaken to Clearly Right + Justification).
          3.  Summarize specific claims got right/wrong by each.
          4.  Determine who is more right overall and why.
          5.  Identify what *both* are failing to address.
      *   **Tone:** Careful, not settling for a comfortable "both-sides" split, expert, nuanced.

  2.  **Deconstruct the Argument (Moves 1-7):**
      *   *Move 1 (Dr. N.):* Vote settled labeling, not fact. GSSP purpose = correlation (sharp, synchronous, identifiable). Anthropocene fails on timescale grounds (too young vs. Holocene).
      *   *Move 2 (Prof. A.):* "Correlation only" is political. Signal selection (Plutonium vs. 1610 CO2) reflects power structures (nuclear states vs. colonialism). Convention isn't neutral.
      *   *Move 3 (Dr. N.):* Marker $\neq$ Meaning/Iridium example. Historians free to write causal accounts. WG had historians and voted for 1952 previously.
      *   *Move 4 (Prof. A.):* Marker/meaning separation collapses in practice. 1952 implies "Humanity as such." Formalization = natural kind. Rejection preserves critical edge.
      *   *Move 5 (Dr. N.):* If formalization ruins the concept, rejection is good. Subcommission says it's an *event* within Holocene, not a new *epoch*.
      *   *Move 6 (Prof. A.):* Modesty is selective. Geologists publish dates/books anyway. Informal concept lacks utility for specific dating (e.g., 1850).
      *   *Move 7 (Dr. N.):* Dates answerable to evidence, not disciplinary needs. Historians can use term informally (periodization), but rock record doesn't ratify it. Don't say geologists decided the start date.

  3.  **Identify Conflated Questions (Pre-work):**
      *   What is the function of a GSSP? (Correlation tool vs. Causal narrative).
      *   What is the ontological status of the Anthropocene? (Geological unit vs. Socio-political concept).
      *   Who has authority over periodization? (Stratigraphic evidence vs. Explanatory utility).
      *   What is the political consequence of formalization? (Neutralizing responsibility vs. Enabling specific policy/action).

  4.  **Adjudicate Moves (Drafting Ratings & Justifications):**
