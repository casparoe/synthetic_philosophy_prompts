answer: |-
  Good evening.

  This room has a stone floor. It has an echo. It holds a voice longer than a voice wants to be held. I will keep my sentences short. You should not have to carry them across the room alone.

  I know what was kept in this room once. I know what was forbidden. The minute book is in the local studies centre. Women were barred until eighteen ninety-four. Fiction was excluded from the reading room. Novels were considered the wrong use of a free hour. Absorbing. Undemanding. Not improving. I write novels. I am standing in a building that would not have shelved me. It is a mercy the founders are not here to check my membership card.

  They were strict people. They were right to be strict. They raised this building out of subscription pennies. They believed a lamplit room full of books beat a bar. On their own terms, they were right. A man drunk on gin loses the night. A man drunk on a story might lose the night too, but he wakes with something intact. They wanted improvement. They wanted the working man's evening taken back from the public house and pointed at something higher. I do not mock that. I stand on the floor they paid for.

  But there is a ghost in this woodwork. The culture I grew up in was shaped by a faith that made labour a sign and idleness a sin. It turned a whole life into an audit in which rest could only ever look suspicious. The faith has largely gone. The audit remains. It runs now with no auditor. We still count our hours. We still ask what an hour is for. We still feel guilty when the hands on the clock move and we have not moved with them.

  I want to say something about those hours. Not about how to fill them. Not about how to spend them. I want to say that free time is not what is left after work. It is not a reward for labour. It is not answerable to anyone. It is prior.

  There is a hinge in our language that helps here. Our word for school descends, through Latin, from the Greek word for leisure. A classroom and a free hour used to be the same word. The founders of this institute understood the first half of that equation. They built a school for evenings. They wanted minds sharpened. They wanted skills learned. They policed the idling. But the word itself suggests that the idling and the learning share a root. They are not opposites. They are the same capacity turned to different ends.

  This matters because having hours free is not the same as having leisure. Someone with three hours a night who is too wrecked, too anxious or too dulled to attend to anything has no leisure at all. Leisure is a capacity for attention rather than a gap in a timetable. I say this because I know who is in this room. There are men and women here who lost their jobs eighteen months ago. The components plant on the edge of town closed. You have all the free time in the world. You may have none of the freedom. If this room offers you only another thing to complete, another course to finish, another box to tick, it is just another shift. It is just another place where you are judged on output.

  That is why I must say one thing the trust will not like. I say it plainly. If this room is judged on footfall, loans and course completions it has been rebuilt as a workplace. A share of its success will consist of people sitting in it doing nothing for hours, unproductively, on purpose. You cannot measure that on a spreadsheet. You cannot count it in a quarterly report. But if you cannot allow for it, you have not built a library. You have built a factory with softer chairs.

  I know this sounds like a luxury. It sounds like something for people who do not have to worry about the rent. But the point is not luxury. The point is sovereignty. An hour that belongs to you is not an hour you have to justify. It is not an hour you have to use to become healthier, or more productive, or a better parent. Rest is not just the maintenance of a machine that then returns to work. It is the only time the machine gets to decide what it is.

  I need to speak to my father. He is not here. He has been dead six years. He worked thirty-one years of nights at that plant. He took no holiday longer than four days. He was certain this building was a criminal waste of a good site. He was right about idleness being expensive. He paid for other people's free hours out of his own wages. He paid for the roof over our heads. He paid for the roof over this room. I concede that to him. He was right that time costs money. He was right that someone has to pay. But I do not let him have the argument. He paid so that I could stand here and say that the paying is not the point. The point is what happens when the paying stops.

  The plant is closed. The jobs are not coming back. The audit is still running. We are still counting. But this room is open seven days a week. The evenings are included. The staff are here. The books are here. The door is unlocked.

  You do not have to improve yourselves tonight. You do not have to learn a language. You do not have to read a classic. You can sit. You can look at the wall. You can let the echo settle. You can let the hour pass without extracting value from it. That is not a waste. That is the only way to own the time.

  The founders wanted you to be better men. The trust wants you to be active citizens. I want you to be yours. The building is restored. The stone is swept. The light is on. The rest is up to you.

  ***

  **Note on Vulnerability**

  The speech is most exposed in the address to the unemployed workers and the provocation to the Trust. The line about being "too wrecked, too anxious or too dulled" risks sounding like a diagnosis of their state rather than a validation of it. If it lands badly, it sounds like I am saying they are incapable. I would cut "too dulled" to soften the edge. The instruction to the Trust regarding "doing nothing" risks alienating the funders who need metrics to justify future grants. If the atmosphere turns hostile there, I would replace "doing nothing" with "sitting without purpose". It is softer, though less precise. The reference to my father is intimate but stable; the risk there is low provided the delivery is flat, not sentimental.
