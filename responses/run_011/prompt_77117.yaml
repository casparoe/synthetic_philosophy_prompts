answer: |-
  ### The tests

  Each node below represents a procedural or epistemic criterion. Apply them sequentially to the text's argumentation structure, not its conclusion. A "Yes" indicates procedural integrity; a "No" signals a fault.

  1.  **Falsifiability:** Does the author specify what evidence would compel them to abandon their conclusion? Look for explicit conditions under which the thesis would be revoked.
  2.  **Consistency:** Are evidentiary standards applied uniformly to sources supporting and opposing the thesis? Check if favored sources are granted presumption of accuracy while opposing ones face hyper-skepticism.
  3.  **Silence:** Are gaps in the record treated as absence of evidence rather than evidence of absence? Ensure missing documents are not converted into positive proof of a counter-narrative.
  4.  **Conspiracy:** Are discrepancies between sources treated as normal variance rather than proof of coordination? Verify that conflicting testimonies are not automatically attributed to a coordinated plot.
  5.  **Engagement:** Is the strongest version of the opposing scholarship addressed? Confirm the author engages with the best available counter-arguments, not strawmen.
  6.  **Proportionality:** Does the weight of the new evidence match the scale of the revision? Assess if a minor sourcing error is used to overturn a major established event.
  7.  **External Verification:** Is the conclusion checked against independent data sets not selected by the author? Determine if the claim holds when tested against neutral demographic or archival records.

  ### The tree

  **Node 1: Falsifiable?**
  *   **No** → **Leaf 1: Dogmatic**
  *   **Yes** → Node 2: Consistent Standards?
      *   **No** → **Leaf 2: Biased**
      *   **Yes** → Node 3: Silence Neutral?
          *   **No** → **Leaf 3: Speculative**
          *   **Yes** → Node 4: Non-Conspiratorial?
              *   **No** → **Leaf 4: Conspiratorial**
              *   **Yes** → Node 5: Engaged Opposition?
                  *   **No** → **Leaf 5: Negligent**
                  *   **Yes** → Node 6: Proportional?
                      *   **No** → **Leaf 6: Overreach**
                      *   **Yes** → Node 7: Externally Verified?
                          *   **No** → **Leaf 7: Sound/Unverified**
                          *   **Yes** → **Leaf 8: Robust**
                          *   *(Path for Leaf 9: Fail Nodes 1-6, Pass Node 7)* → **Leaf 9: Flawed/Verified**

  ### Leaf notes

  1.  **Dogmatic:** The work is immune to evidence; seminar should treat it as ideology, not history.
  2.  **Biased:** Methodological double standards invalidate the finding regardless of conclusion.
  3.  **Speculative:** Absence of proof is wrongly used as proof of absence; high risk of fiction.
  4.  **Conspiratorial:** Normal archival variance is pathologized; undermines trust in all testimony.
  5.  **Negligent:** Failure to engage counter-arguments suggests intellectual dishonesty or incompetence.
  6.  **Overreach:** Minor evidence is inflated to support major claims; conclusion likely unstable.
  7.  **Sound/Unverified:** **Method and truth may diverge here;** procedurally perfect but factually wrong.
  8.  **Robust:** The ideal outcome; method and evidence align to support a defensible conclusion.
  9.  **Flawed/Verified:** **Method and truth may diverge here;** right conclusion reached via disqualifying means.

  ### Empty and blurred cells

  Certain combinations are structurally incoherent. A work cannot be "Dogmatic" (Leaf 1) yet "Engage Opposition" (Node 5); refusing to specify falsifying conditions precludes genuine engagement. Similarly, "Conspiratorial" logic (Leaf 4) rarely coexists with "Consistent Standards" (Node 2), as conspiracy theories inherently demand higher proof from opponents. These cells remain unoccupied because the epistemic faults are mutually reinforcing.

  The tree cannot reliably separate Leaf 7 (Sound/Unverified) from Leaf 8 (Robust) in real-time; both look procedurally identical until external data is found. Furthermore, Leaf 9 (Flawed/Verified) is often indistinguishable from Leaf 8 without independent verification, risking the legitimization of lucky guesses. The seminar must treat Leaf 7 as "provisionally accepted" and Leaf 9 as "cautionary," emphasizing that methodological integrity matters even when the conclusion happens to be true.

  ### Case verdicts

  1.  **Case 1 (No Order/Improvised):** Reaches **Leaf 3 (Speculative)**. The decisive node is **Node 3 (Silence)**. The author converts the absence of a signed order (a gap) into positive evidence that no genocide occurred, violating the test for treating silence neutrally.
  2.  **Case 2 (Error/Invented):** Reaches **Leaf 6 (Overreach)**. The decisive node is **Node 6 (Proportionality)**. Inferring the invention of a massacre from a single sourcing error demands a revision scale vastly exceeding the evidentiary weight provided.
  3.  **Case 3 (Ruins/Conspiracy):** Reaches **Leaf 4 (Conspiratorial)**. The decisive node is **Node 4 (Conspiracy)**. Treating testimonial discrepancies as proof of a coordinated plot rather than normal variance fails the non-conspiratorial test.
  4.  **Case 4 ( Revised Estimate):** Reaches **Leaf 8 (Robust)**. The decisive node is **Node 7 (External Verification)**. The scholar passes all procedural tests, including applying uniform standards and verifying the downward revision against independent population records.
