  ### 5. Ethical and Causal Cleanup

  **On Claim (7) [Ethics]:**
  You must add a clause to (7). You cannot simply say "I hold the ordinary view." You must say, "I hold the ordinary view *at the level of practical agency*." If you do not qualify this, a critic will ask: "If I am you, why can I not pay your debts?" You need to explicitly state that the One-Mind thesis does not collapse the *pragmatic* boundaries of agency. This is standard Vedanta (Vyavaharika vs. Paramarthika), but you must spell it out for a broadsheet audience.

  **On Claim (3) [Causation]:**
  Be careful with the word "fixed." If everything is fixed by physical goings-on, and there is only One Mind, does the Mind have any causal power? If you say no, you are an epiphenomenalist. If you say yes, you risk violating causal closure.
  *   *Fix:* Frame physical goings-on as determining the *content* of the One Mind, not the *existence* of it. The Mind does not push the atoms; the atoms determine what the Mind sees. This preserves (3) without making the Mind a ghost in the machine.

