      *   **User's Skepticism:** The user wants to push on the leap from "it's a code" to "prediction is an engineering problem." They suspect the metaphor smuggles in features of human code (intent, context-independence, localization of information, determinism) that biology lacks.
      *   **Task 1: Audit the Analogy:** Map the components (Alphabet, Cipher, Interpreter, Compiler, Message, Reader, Version Control, Runtime). Identify where the mapping holds and where it snaps.
      *   **Task 2: Categorize Disanalogies:** Distinguish between "cosmetic" (doesn't hurt the argument) and "damaging" (undermines the engineering/prediction conclusion). Address specific suspicions (intent, context, distributed information, determinism).
      *   **Task 3: Evaluate the "Debugging" Conclusion:** Does the conclusion survive if we remove the smuggled features?
      *   **Task 4: Propose Alternatives:** Evaluate "Recipe vs. Blueprint," "Cause among Causes," etc. What would a replacement analogy need to do to license "edit sequence, predict phenotype"? Does any candidate actually do this?
