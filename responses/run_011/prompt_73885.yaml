answer: |-
  Based on your sister's track record, the board should vote **Yes** to maintain consistency. The closest analog is the **Indigenous Children/Boarding Schools** case.

  However, her precedents reveal a tension between legal formalism and sociological reality. Below is the breakdown of the rules her history supports, how they apply to the dam case, and the specific ambiguity you need to resolve to be certain.

  ### 1. The Closest Analog: Boarding Schools
  The **Boarding Schools** case is the strongest precedent. In both scenarios:
  *   **Violence:** There is no mass killing ("almost nobody was killed" vs. "nobody is being killed").
  *   **Intent:** The stated government intent is benevolent or neutral ("for the kids' benefit" vs. "development/jobs").
  *   **Mechanism:** The state intervenes to break the group's internal transmission of culture and identity.
  *   **Outcome:** The distinct group ceases to exist within a few generations.

  The **Language/Shrines** case is the counter-analog. It was voted *No* because the people remained physically together ("in their own villages, marrying each other"). The Dam case, like the Boarding Schools, physically scatters the community ("individual plots scattered across three provinces"). This distinction suggests that for your sister, **physical cohesion is the threshold** that separates "cultural suppression" (No) from "genocide" (Yes).

  ### 2. Candidate Rules & Predictions
  Your sister's voting record is compatible with three different interpretive rules. They do not all agree on the dam case.

  | Rule | Definition | Precedent Fit | Prediction for Dam Case |
  | :--- | :--- | :--- | :--- |
  | **A. The Lethality Standard** | Genocide requires mass physical killing or direct physical destruction of the group. | **Poor.** Contradicted by *Boarding Schools* (Yes w/o killing). Consistent with *Rwanda/Srebrenica*. | **NO.** No one is being killed. |
  | **B. The Strict Treaty Standard** | Genocide requires specific acts listed in the UN Convention (killing, serious harm, birth prevention, **child transfer**, conditions of life). | **Mixed.** Fits *Srebrenica/Siege*. Fits *Boarding Schools* only if relying on the specific "child transfer" clause. | **NO / LEAN NO.** The UN Convention prohibits "forcibly transferring **children**." It does not explicitly list scattering adults or economic displacement unless it causes physical death. |
  | **C. The Group Viability Standard** | Genocide occurs when actions render it impossible for the group to continue existing as a distinct social/biological entity, regardless of body count. | **Excellent.** Explains *Boarding Schools* (Yes), *Siege* (Yes), *Language/Shrines* (No), and *Cambodia* (split verdict). | **YES.** Demographers confirm the community will cease to exist within two generations. |

  **Analysis:** Rule A is ruled out by the Boarding Schools vote. The real conflict is between Rule B (Treaty) and Rule C (Viability). Your sister's *Boarding Schools* vote suggests she prioritizes **Viability** over strict Treaty limitations (since "cultural genocide" was explicitly excluded from the Treaty, yet she voted Yes). Therefore, consistency demands a **Yes** vote.

  ### 3. The Ambiguity & The Tie-Breaker
  There is one genuine ambiguity. The Boarding Schools case could have been a "Yes" for two different reasons:
  1.  **Legal Technicality:** Because the UN Convention *specifically* lists "forcibly transferring children" as a genocidal act, regardless of death toll.
  2.  **Sociological Outcome:** Because the *result* was the assimilation and extinction of the group, regardless of the specific legal mechanism.

  If she voted Yes for **Reason 1**, the Dam case is a **No**. Scattering adults is not a listed act in the Convention, and without mass death, it falls under "cultural destruction" (like the Language/Shrines case).
  If she voted Yes for **Reason 2**, the Dam case is a **Yes**. The outcome (group extinction) is identical, even if the method (scattering families vs. taking children) differs.

  **The One Extra Detail Needed:**
  To know which rule she is truly running, you need to know **how she justified the Boarding Schools vote internally.**
  *   Did she argue, *"The Convention explicitly bans child transfer, so this qualifies"*? (Implies Dam = No).
  *   Or did she argue, *"The intent is to erase them as a people, and this achieves that"*? (Implies Dam = Yes).

  **Recommendation:**
  If you cannot access that detail, vote **Yes**. Her distinction between the *Language/Shrines* case (No) and the *Boarding Schools* case (Yes) hinges on **community cohesion**, not just legal clauses. In the *Language/Shrines* case, she explicitly noted the people were "still there in their own villages, marrying each other." In the Dam case, they are forbidden from resettling together. To be consistent with *that* specific distinction, the board must acknowledge that destroying the group's physical cohesion is genocidal, even without killing.
