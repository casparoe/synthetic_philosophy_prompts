answer: |-
  ### Desiderata for a Theory of Imprecise Belief in Regulatory Litigation

  The following specifications define the necessary conditions for a formal framework of imprecise probability to be adopted by the Panel. They are categorized by their status: **Non-negotiable** (functional prerequisites for the Panel's mandate), **Negotiable-but-costly** (theoretical ideals whose absence imposes operational burdens), or **Preference of a Particular Camp** (philosophical commitments not strictly required for utility).

  #### 1. Representational Uniqueness and Individuation
  *   **Requirement:** The theory must specify whether the credal set $\mathcal{P}$ *constitutes* the doxastic state or merely *bounds* a family of rival precise states. If the latter, the theory must provide a uniqueness condition ensuring that distinct sets represent distinct states of belief, not merely distinct representations of the same state.
  *   **Consideration:** If the set is just a proxy for "we don't know which precise $P$ is true," aggregation and updating become ambiguous. If the set *is* the state, we need to know if $\mathcal{P}$ and its convex hull $conv(\mathcal{P})$ are equivalent.
  *   **Micro-case:** Consider Panel Member A who reports $\mathcal{P}_A = \{P_1, P_2\}$ and Member B who reports $\mathcal{P}_B = conv(\{P_1, P_2\})$. If the theory treats these as identical (convexity), but Member A actually holds a disjunctive belief ("It is either $P_1$ or $P_2$, not a mix"), the aggregation rule might average them into a center point $0.5(P_1+P_2)$ that neither member endorses. A framework lacking individuation fails here by manufacturing a consensus probability that contradicts the dissenting members' actual views.
  *   **Label:** **Non-negotiable**. (Without this, the published record is semantically ambiguous.)

  #### 2. Evidential Licensing (The "Why a Set?" Constraint)
  *   **Requirement:** The theory must provide a criterion distinguishing *ambiguity* (evidence supports a set) from *ignorance* (lack of evidence). The width of the set must be licensable by the character of the evidence, not merely by the absence of it.
  *   **Consideration:** To satisfy the mandate against reporting unearned precision, the width must reflect conflicting reliable models, not just a lack of data.
  *   **Micro-case:** A framework that defaults to the vacuous interval $[0, 1]$ whenever data is sparse fails this. If the Panel reports $[0, 1]$ for a well-studied hazard simply because a new variable was introduced, the report is decision-irrelevant. Conversely, if the Panel reports $[0.49, 0.51]$ based on a single noisy study, it violates the "no false precision" mandate. The theory must link interval width to evidence quality (e.g., via Walley's near-ignorance priors).
  *   **Label:** **Non-negotiable**.

  #### 3. Update Stability and Learning Guarantees
  *   **Requirement:** The update rule must guarantee that under a sequence of informative, independent evidence, the credal set contracts (learns) asymptotically, unless the evidence itself is structurally ambiguous. It must explicitly account for *dilation* (where conditioning widens the interval) and determine when dilation is a feature of the evidence vs. a bug of the model.
  *   **Consideration:** A framework where intervals widen upon receiving confirming evidence undermines the Panel's utility.
  *   **Micro-case:** In standard Imprecise Probability (IP) using lower previsions, conditioning on a partition can lead to dilation: the posterior interval for event $E$ is wider than the prior for every element of the partition. If the Panel observes data $D$ that intuitively confirms safety, but the formal rule widens the risk interval from $[0.1, 0.2]$ to $[0.05, 0.3]$, the Panel cannot publish the update without appearing irrational. A theory lacking a dilation diagnosis fails the panel.
  *   **Label:** **Non-negotiable**.

  #### 4. Decision Interface and Paralysis Avoidance
  *   **Requirement:** The theory must supply a choice rule mapping credal sets to actions. Crucially, it must specify a procedure for cases where the set licenses *no* unique action (indeterminacy). It cannot simply output "suspend judgment" if the Panel's charter requires a risk assessment.
  *   **Consideration:** If the interval spans the regulatory threshold, standard E-admissibility yields no recommendation. The theory must say whether this is a valid output or a failure state.
  *   **Micro-case:** Regulatory threshold is risk $> 0.05$. Panel assessment is $[0.04, 0.06]$. Under E-admissibility, both "Regulate" and "Do Not Regulate" are permissible. If the theory offers no tie-breaking mechanism (e.g., minimax regret, or a default to caution), the Panel publishes a report that litigation counsel will interpret as "no consensus," effectively paralyzing the regulator.
  *   **Label:** **Negotiable-but-costly**. (The Panel can accept paralysis, but it reduces utility.)

  #### 5. Threshold-Discipline Constraint
  *   **Requirement:** For any regulatory threshold $T$, the theory must render it determinate whether the set $\mathcal{P}$ licenses the assertion $P(E) > T$. If the set overlaps $T$, the theory must classify the output as "Indeterminate" rather than allowing the user to select a point within the set to justify action.
  *   **Consideration:** This prevents "cherry-picking" a precise value from the set to satisfy legal burdens.
  *   **Micro-case:** Without this constraint, a Panel member could publish $[0.4, 0.6]$ against a threshold of $0.5$, and litigants could cite the upper bound to claim the Panel found risk "more likely than not." A framework lacking threshold discipline allows the set to be treated as a menu of precise options rather than a constraint on belief.
  *   **Label:** **Non-negotiable**. (Essential for litigation integrity.)

  #### 6. Revisability and Retrospective Widening
  *   **Requirement:** The theory must distinguish between *updating on new evidence* and *correcting model error*. It must allow for the legitimate widening of a previously published set due to discovered structural flaws without implying the original set was incoherent.
  *   **Consideration:** Standard Bayesian and IP updating only narrow sets (conditioning) or shift them. They do not easily accommodate "We were too confident because our model class was too narrow."
  *   **Micro-case:** The Panel publishes $[0.1, 0.2]$. Two years later, a new physical mechanism is discovered that was not in the original model space. The Panel must widen the assessment to $[0.05, 0.3]$. If the theory treats the initial set as a logical commitment, this widening looks like incoherence (violating the "cannot be quietly withdrawn" rule). The theory needs a meta-level "model uncertainty" parameter that can be adjusted retrospectively to explain the widening as increased ambiguity, not error.
  *   **Label:** **Negotiable-but-costly**. (Extremely difficult to formalize; most theories fail this.)

  #### 7. Aggregation Coherence
  *   **Requirement:** The method for aggregating individual members' sets into a published set must preserve the "no false precision" mandate. It cannot produce a set narrower than the union of individual sets unless there is a formal justification for discounting dissent.
  *   **Consideration:** Linear pooling of precise probabilities often narrows variance. Pooling sets must not artificially create consensus.
  *   **Micro-case:** Member A: $[0.1, 0.2]$. Member B: $[0.8, 0.9]$. A simple average of midpoints yields $0.5$, erasing the polarization. A convex hull yields $[0.1, 0.9]$, which may be too wide to be useful. A framework that mandates convex hulls might force the Panel to publish vacuous intervals in cases of deep disagreement, failing the "decision-relevant content" mandate.
  *   **Label:** **Non-negotiable**.

  #### 8. Structural Norms (Convexity and Conglomerability)
  *   **Requirement:** The theory must take a stance on Convexity (if $P_1, P_2 \in \mathcal{P}$, is $\lambda P_1 + (1-\lambda)P_2 \in \mathcal{P}$?) and Conglomerability (does the unconditional probability lie within the bounds of the conditional probabilities?).
  *   **Consideration:** Convexity simplifies math but may misrepresent belief (see Individuation). Non-conglomerability allows for pathological betting strategies.
  *   **Micro-case:** If the theory mandates convexity (Walley), it forces the Panel to treat a mixture of two expert views as a valid belief state, even if the experts believe they are mutually exclusive. If the theory rejects conglomerability, the Panel could be susceptible to a "sure loss" in a sequential betting scenario, undermining credibility in court.
  *   **Label:** **Preference of a Particular Camp**. (Walley/Imprecise Probability camp prefers Convexity/Conglomerability; others dispute this.)

  #### 9. Stability Against "Sharpening"
  *   **Requirement:** The theory must defend against the charge that a rational agent should simply select a single precise credence from the set to maximize decision utility. It must demonstrate that retaining imprecision yields better long-run calibration or loss-avoidance than arbitrary sharpening.
  *   **Consideration:** If sharpening is dominant, the Panel is irrational for publishing sets.
  *   **Micro-case:** A "Sharpen Up" critic argues the Panel should pick $0.5$ from $[0.4, 0.6]$ to allow the regulator to act. If the theory cannot show that picking $0.5$ exposes the regulator to unquantified risk (e.g., via a minimax loss argument), the imprecise approach is self-defeating.
  *   **Label:** **Preference of a Particular Camp**. (Imprecise Probability camp vs. Bayesian Purists.)

  ---

  ### Analysis of Constraints and Incompatibilities

  **The Hardest Requirement:**
  The **Threshold-Discipline Constraint** combined with **Decision Interface (Paralysis Avoidance)** does the most work eliminating frameworks.
  Most standard Imprecise Probability theories (e.g., Walley's Coherent Lower Previsions) accept that if an interval overlaps a decision threshold, the rational action is *indeterminate*. However, the Panel's mandate requires "decision-relevant content." A theory that strictly enforces Threshold Discipline will frequently output "Indeterminate" in high-stakes, high-ambiguity cases. A theory that forces a decision (to avoid paralysis) inevitably violates Threshold Discipline by implicitly sharpening the credence. Frameworks that claim to do both (e.g., by using secondary criteria like Minimax Regret without acknowledging the shift) are eliminated as dishonest.

  **Incompatibilities:**
  There is a trilemma between **No False Precision**, **Threshold Discipline**, and **Actionability**.
  1.  **No False Precision:** Requires reporting the full width of ambiguity (e.g., $[0.4, 0.6]$).
  2.  **Threshold Discipline:** Requires stating clearly if $[0.4, 0.6]$ exceeds $0.5$ (Answer: No/Indeterminate).
  3.  **Actionability:** Requires the output to guide regulation (Regulate or Don't).
  If evidence is genuinely ambiguous (1), and the threshold lies within the interval (2), you cannot guide regulation (3) without violating (1) or (2).
  *Where the inconsistency arises:* It arises in the **Decision Interface**. If the theory belongs to the "Imprecise Probability" camp, it sacrifices Actionability (accepting paralysis). If it belongs to the "Decision-Theoretic" camp (e.g., Maximin), it sacrifices No False Precision (by acting *as if* the worst-case is the true case). You cannot jointly satisfy the mandate to "not report precision you don't have" and "carry decision-relevant content" when the evidence is ambiguous relative to the threshold.

  **Partisan Preferences Disguised as Requirements:**
  *   **Convexity:** Often presented as a rationality axiom (to ensure coherence), it is actually a **Preference of the Walley/Imprecise Probability camp**. Rejecting convexity allows for representing "disjunctive" belief (either Model A or Model B, but not a mix), which is often more truthful for expert panels.
  *   **Conglomerability:** Presented as avoiding "sure loss," but in infinite spaces, requiring conglomerability can force counter-intuitive beliefs. This is a **Preference of the Mathematical Statistics camp** over the Philosophical Logic camp.
  *   **"Sharpen Up":** The claim that imprecision is irrational is a **Preference of the Bayesian Purist camp** (e.g., Howson & Urbach, Joyce). It assumes utility functions are always precise enough to force a choice, which contradicts the Panel's observation of deep model uncertainty.

  ---

  ### Scoring Contenders

  **1. Coherent Lower Previsions (Walley):**
  *   *Pros:* Mathematically rigorous, handles evidential licensing well, satisfies Threshold Discipline (by admitting indeterminacy).
  *   *Cons:* Fails Actionability (frequent paralysis); Revisability is weak (hard to widen sets retrospectively without incoherence); Convexity assumption may mask dissent.
  *   *Verdict:* High integrity, low utility for regulation.

  **2. Decision-Theoretic Sets (Seidenfeld/Kadane/Maximin):**
  *   *Pros:* Solves Actionability (always picks an action based on worst-case); robust against "Sharpen Up" criticism.
  *   *Cons:* Violates No False Precision (acts on the bound as if it were the value); can be overly conservative (paralysis by caution rather than ambiguity); Aggregation of utility functions is contentious.
  *   *Verdict:* High utility, risks regulatory overreach.

  **3. "Sharpen Up" (Precise Bayesianism):**
  *   *Pros:* Satisfies Actionability and Revisability perfectly; mathematically simple.
  *   *Cons:* Violates the Panel's primary mandate (forbidden from reporting precision it does not have); Evidential Licensing is fake (priors mask ignorance).
  *   *Verdict:* Ineligible. Violates core protocol constraints.

  ---

  ### Confidence Statement

  I am **highly confident** in the identification of the **Trilemma (No False Precision vs. Threshold Discipline vs. Actionability)** as the central tension. This is a structural feature of any system bridging epistemology and regulation, not merely a feature of specific formalisms. I am also **confident** that **Convexity** is a partisan preference rather than a rationality requirement, as disjunctive beliefs are common in expert elicitation.

  I am **least sure** about the feasibility of the **Revisability Constraint**. My uncertainty stems from the fact that standard probability theory (precise or imprecise) is fundamentally forward-looking (conditionalization). There is very little literature on "retrospective coherent widening" that distinguishes model error from prior ambiguity without admitting the prior was incoherent. It is possible this requirement is logically impossible to satisfy within a synchronic coherence framework, requiring instead a diachronic "versioned model" approach that lies outside standard belief theory. Reasonable specialists would split on whether this is a requirement for the *theory of belief* or a requirement for the *protocol's governance* external to the theory.
