answer: |-
  To: The Jury
  From: [Juror Name]
  Date: [Date]
  Re: Final Deliberation and Recommendation

  Colleagues,

  We are agreed that both finalists are serious works of art. We are agreed that the hydrographer novel is a monumental achievement of structure and imagination, and that the gardener novella is a model of clarity and emotional resonance. Our deadlock stems not from quality, but from purpose. We are tasked not simply to identify the "better" book, but to identify the book that best satisfies the foundation's specific mandate, including the donor's widow's clause regarding "the work's capacity to reach readers beyond the literary world."

  After reviewing our transcripts and considering the arguments presented by our critic and our poet, I am writing to recommend that we award the prize to the novella.

  This recommendation rests on a specific interpretation of the bylaws clause, which I believe must serve as the tiebreaker when literary merit is otherwise comparable. The clause does not ask us to measure sales figures or marketing potential. It asks us to weigh "capacity." In this context, capacity must be understood as the structural accessibility of the work's emotional transmission. The hydrographer novel demands a reader trained in navigating experimental forms: second-person narration, marginalia, and a forty-page register of names. These are literary codes. The gardener novella demands only a reader who has experienced loss or labor. The distinction is not between "hard" and "easy," but between feelings that require prior reading to access and feelings that require only life to access.

  To resolve the dispute over Tolstoy's criterion, we must be candid about whether five non-specialists can operationalize it. The answer is yes, but only if we strip it of its metaphysical claims. We cannot judge "religious perception of the age." We can, however, judge "infection." The operational test we should adopt for this prize, and for future cycles, is the **Dependency Test**: *Does the reader's emotional response depend on recognizing a literary convention, or does it depend on recognizing a human situation?*

  If a reader cries at the register of the drowned because they understand the irony of the marginalia contrasting with the names, that is a "read" feeling. If they cry because they recognize the finality of death, that is a "lived" feeling. The hydrographer novel relies heavily on the former; the gardener novella relies almost exclusively on the latter. The critic is correct that art which performs for initiates violates the spirit of the donor's clause, even if it satisfies the aesthetic standards of the literary world. The poet is correct that all art uses codes; roses are not natural facts. But the density of the code matters. The novella's codes are cultural and ubiquitous; the novel's codes are specialized and exclusive. Therefore, under the bylaws, the novella has the greater capacity to reach beyond our circle.

  I must address the evidentiary wrinkle regarding the novelist juror's sixteen-year-old daughter. We are told she was "undone" by the register of the drowned. If true, this suggests the novel can infect an untrained reader. However, as it stands, this report is hearsay. It arrives second-hand from a juror with a stated preference for the novel. The daughter will not be produced to describe the experience. We do not know if she was moved by the human tragedy (a lived feeling) or by the sheer scale of the experiment (a read feeling). More importantly, a single data point does not establish *capacity*. The bylaws ask us to weigh the work's general capacity, not its exceptional outliers. The novella's capacity is structural; it is built to be entered quickly and deeply by a general reader. The novel's capacity is conditional; it requires a specific kind of patience and training that most readers beyond the literary world do not possess. We cannot base a fifty-thousand-dollar award on an unverified anecdote that contradicts the structural reality of the text.

  I want to give the strongest version of the losing argument, which belongs to the poet. Her objection is theoretically sound: the critic is invoking Tolstoy's name while discarding the religious and moral framework that made his theory coherent. Tolstoy condemned Shakespeare not just for being elite, but for lacking true religious feeling. By keeping the accessibility half of the theory and discarding the moral half, the critic is indeed running a truncated theory under a famous name to dignify a preference for simplicity. The poet is right that the hydrographer novel may be the more moral work, in that it forces us to confront the anonymizing nature of history in a way the novella does not. If we were judging solely on moral ambition or artistic innovation, the novel would win.

  However, the poet's argument loses because it ignores the legal constraint of the bylaws. We are not free to adopt Tolstoy's theory in full; we are only free to adopt the clause the widow added. That clause privileges reach. To argue that the novel is "more moral" is to argue against the bylaws, not for them. We must apply the criterion we have, not the one we wish we had. The critic's application is crude, as she admits, but it is honest. The poet's application is sublime but selective. In a legalistic deliberation, honesty beats selectivity.

  Finally, I must be candid about whether importing Tolstoy into this deliberation is chiefly a way of dignifying a preference we already have. It is. We are using a nineteenth-century moral theory to justify a modern preference for accessibility. But all criteria are preferences dressed as principles. The question is whether this preference serves the foundation. I believe it does. If we award the novel, we signal that this prize is for writers writing for writers. If we award the novella, we signal that this prize is for writers writing for readers. The bylaws demand the latter.

  Therefore, I recommend we award the gardener novella.

  This commitment requires us to be clear in our public citation. We cannot say the novel was inferior. We must state plainly that while both books were of the highest caliber, the jury was bound by the foundation's mandate to prioritize works with the capacity to reach readers beyond the literary world. We must say that the novella fulfilled this mandate more completely. This may invite criticism from the literary press, who will see it as an anti-intellectual choice. We must be prepared to accept that. We are not here to reward the literary world for its own achievements; we are here to reward the transmission of feeling across the boundary of that world.

  For next year, I propose we adopt the Dependency Test formally. When evaluating "reach," we should ask: *What must a reader know before opening this book to feel what the author intends?* If the answer is "nothing but language," the capacity is high. If the answer is "knowledge of genre conventions, historical context, or narrative experimentation," the capacity is limited. This rule will not solve every dispute, but it will prevent us from hiding behind vague notions of "difficulty" or "merit."

  We have a difficult meeting on Thursday. I hope this memo clarifies my position and offers a path forward that respects both the books and the foundation's rules.

  Regards,

  [Name]
