      *   *Divergence:* DDNC relies on the brain as the *integrator* of the organism. If the brain is gone, the organism disintegrates (eventually). Dennett's case assumes the brain can exist independently. DDNC presupposes the *union* is what matters, but the brain is the *ruler*.
