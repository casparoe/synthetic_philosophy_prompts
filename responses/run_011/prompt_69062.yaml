answer: |-
  You bring me a counsel more desperate than Consentius first offered, pressing me as if necessity can bend the spine of Truth, but you mistake the geometry of the soul. I have told Consentius before, and I tell you now, that while I allow for silence, for concealment, and for speech that turns aside without breaking, I never allow for the falsehood that enters the heart. If this agent stands in that room and the heretics demand he swear upon the Gospels that he is one of them, there is no ambiguity left to shelter him; he must not move his lips to utter the falsehood. You say refusal is itself an answer that costs the operation; I say the operation is already lost if its price is the damnation of the spy. He must stand there, minute by minute, and endure their suspicion, perhaps speaking truthfully until they drive him out, but if they force him to choose between the blood of his body and the poison of his soul, he must choose the blood. We are not masters of the future, nor can we calculate the salvation of the hundred by trading the integrity of the one; if he lies, he sins certainly, but if he tells the truth and they perish, their blood is not on his hands, whereas if he lies, his own destruction is wrought by his own will.

  You ask me to weigh the perjury against the deaths and the corruption, as if we are merchants balancing silver against grain. The perjury is worse, infinitely worse, for it is an offense against God Himself, who is Truth, whereas the deaths are an offense against men who must die regardless. The three who are caught and killed face a temporal judgment, and the hundred who are corrupted face a spiritual danger that depends on their own consent, not merely on the sect's presence. To do evil that good may come is to invert the order of charity, loving the neighbor's body more than the neighbor's God. I grant you the corruption of the faithful is a grievous wound to the Church, and I grant you the death of these men is a sorrowful thing, but I will never grant you that we may become children of the devil to catch the children of error. Let the truth stand, even if the world collapses; for if the world collapses without a lie, it suffers a temporal ruin, but if it stands on a lie, it is built upon the foundation of hell.
