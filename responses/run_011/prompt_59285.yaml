answer: |-
  1. **Bottom line**
  This is primarily a **different questions** disagreement with a **bedrock** core. The philosophy camp asks what *constitutes* a convention (conceptual/normative), while the modelling camp asks how regularities *persist* (causal/functional). Your hypothesis is correct: they are scoring points against claims neither makes. Progress is possible, but not by proving one side right. It requires mapping the conceptual constraints onto the causal mechanisms. The impasse is hard, not ill-posed, because both sides capture real phenomena (normative force vs. equilibrium stability). You can move it by forcing a shared vocabulary that distinguishes *generation* from *maintenance*.

  2. **What each camp is actually committed to**

  **Philosophy (Camp A)**
  *   **Commitment:** Concepts have necessary conditions. If agents lack common knowledge or conditional preferences, it isn't a convention, regardless of stability.
  *   **Goal:** Interpretive clarity. To distinguish conventions from norms, habits, or coercion.
  *   **View of Lewis:** A conceptual analysis to be refined or rejected based on intuitions about cases.
  *   **Escalator Take:** If throughput isn't the goal, it's not a coordination failure. The "tutting" indicates normative obligation, possibly exceeding mere coordination.
  *   **Caricature Risk:** You imply they ignore empirical reality. They don't; they claim empirical facts don't settle conceptual boundaries.

  **Modelling (Camp B)**
  *   **Commitment:** Regularities are equilibria. Mental states are causal variables, not definitional requirements. If behaviour stabilises, the model works.
  *   **Goal:** Prediction and intervention. To identify leverage points for changing behaviour.
  *   **View of Lewis:** A proto-formalism vindicated by evolutionary game theory.
  *   **Escalator Take:** Suboptimal equilibria are standard (path dependence). The snap-back is hysteresis, not conceptual confusion.
  *   **Caricature Risk:** You imply they are anti-theory. They have formal theory; they just reject armchair necessity conditions.

  3. **Four candidate diagnoses**

  **1. Verbal Disagreement**
  *   **Prediction:** They agree on the world but fight over the label 'convention'.
  *   **Match:** Weak. They disagree on the Holborn facts too (whether it's a coordination problem vs. a norm enforcement issue). If it were purely verbal, they could stipulate definitions and move on. They can't, because the definition dictates the explanation.

  **2. Different Questions (Your Hypothesis)**
  *   **Prediction:** One side offers analysis, the other offers mechanism. They talk past each other.
  *   **Match:** Strong. Philosophy asks, "What makes this a convention?" Modelling asks, "How do we shift this equilibrium?" When Phils say "Lewis is wrong about knowledge," Modellers hear "Knowledge doesn't matter for stability," which is false. When Modellers say "Lewis is vindicated by evolution," Phils hear "Knowledge isn't required," which contradicts the analysis.

  **3. Hidden Empirical Question**
  *   **Prediction:** The dispute rests on whether people actually have common knowledge. Experiments could solve it.
  *   **Match:** Poor. Camp A argues that even if experiments show no common knowledge, the *concept* requires it for normativity. Camp B argues that even if people claim knowledge, the *dynamic* explains the stability. The empirical data is rendered irrelevant by the theoretical framing.

  **4. Bedrock Intuitions**
  *   **Prediction:** Disagreement about the purpose of social theory (Understanding agency vs. Controlling systems).
  *   **Match:** Strong. Camp A treats agents as reason-followers requiring justification. Camp B treats agents as nodes in a dynamic system. This is why the escalator case flares up: one sees a failure of rationality/normativity, the sees a success of stability modelling. This is the hardest layer to shift.

  4. **My verdict**

  Your change-of-question hypothesis is not glib; it is the most charitable and accurate diagnosis. It survives contact with the case because it explains the frustration: each side feels the other is missing the point because they are playing different games. The Philosophy side is playing *Justification*, asking what makes the regularity intelligible as a social rule. The Modelling side is playing *Engineering*, asking what makes the regularity robust to perturbation.

  However, calling it merely a "change of question" understates the friction. It is also bedrock. The Philosophy side believes that without the conceptual structure (common knowledge, conditional preference), you lose the *normativity*—the "oughtness" that explains why people feel entitled to tut. The Modelling side believes that without the causal mechanism (evolutionary stability, expectations), you lose the *explanation* of persistence.

  The thing is not ill-posed; it is a classic boundary dispute between humanities-style conceptual analysis and social-science-style causal modelling. It is merely hard because both sides claim ownership of "Lewis." Progress requires acknowledging that Lewis's text supports both readings: it contains formal game structures (for Modellers) and epistemic conditions (for Philosophers). You cannot resolve this by choosing a winner, only by mapping the terrain between them.

  5. **The escalator test**

  Under the **Different Questions** diagnosis, the Holborn case splits cleanly.

  For **Camp A (Philosophy)**, the snap-back suggests the regularity is not merely a convention solving a coordination problem (since a better solution exists). It is likely a **norm** embedded in a deeper social contract (safety, fairness, or queueing etiquette). The tutting is evidence of normative expectation, not just coordinated expectation. The failure of the trial isn't a coordination failure; it's a failure to shift the normative landscape.

  For **Camp B (Modelling)**, it is a **convention** (equilibrium). The snap-back is path dependence. The "better" solution (standing both sides) was a transient shock that failed to overcome the basin of attraction of the existing equilibrium. The tutting is an enforcement cost that stabilises the equilibrium. The fact that throughput is lower is irrelevant to the definition; equilibria are often suboptimal (e.g., QWERTY).

  Your diagnosis explains the fight: Camp A says "It can't be a convention if it's irrational," while Camp B says "It is a convention precisely because it's sticky despite being irrational." They are using the same data to prove different theoretical points.

  6. **What would count as progress**

  To move this, you need a bridging framework that respects both the conceptual and causal dimensions. Look for these specific moves:

  1.  **From Camp A:** An admission that "common knowledge" might be a functional idealisation rather than a literal psychological state. If they accept that *effective* common knowledge (modeled by Bicchieri's empirical expectations) suffices for the conceptual work, the gap narrows.
  2.  **From Camp B:** An admission that equilibrium models often smuggle in normative assumptions. If they acknowledge that "enforcement costs" (tutting) rely on pre-existing normative structures not captured in the payoff matrix, they need the Philosophy side.
  3.  **From You:** A distinction between **Convention-Generation** (how it starts, where modelling shines) and **Convention-Maintenance** (how it persists normatively, where philosophy shines).

  Progress looks like a joint paper where the Modellers specify the stability conditions and the Philosophers specify the normative conditions required for those stability conditions to hold. If they can agree that Lewis provides the *structure* but not the *psychology*, or vice versa, you have a synthesis. If they continue to fight over whether Lewis was "right," you are stuck.
