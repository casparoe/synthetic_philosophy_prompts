prompt: |-
  I run the ethics slot of an in-house CPD day at a fertility unit — about fourteen people, mostly embryologists and fertility nurses, one consultant, and the GP who does their counselling referrals. Ninety minutes, at the end of the day, they'll be tired. No pre-reading and please don't hand me a reading list either, they wont read anything.

  The session is nominally about procreative beneficence — the "should we be selecting the best embryo" question. But what I actually want them to leave understanding is the non-identity problem, because in my experience every objection this audience gives to procreative beneficence is the same objection in a different costume, and most of them either dissolve or at least change shape once you can see the structure underneath. So the real thing I need is a teaching plan for that idea, with procreative beneficence as the frame they think they signed up for.

  Don't explain the non-identity problem to me, I know it. Plan how I explain it to *them*.

  - **The order.** What has to be in place before the paradox can even register for them? I think the person-affecting restriction has to be surfaced and named before I can suspend it, but I don't know how to get them to see they're holding it without sounding like I'm accusing them of holding it. Give me the sequence, what depends on what, and roughly where the ninety minutes goes.
  - **The one case that carries it.** Not a menu of three — pick one and tell me why. Say what it has to have (the alternative child never existing at all, a life that's plainly worth living) and what it has to leave out. And be careful here: these people will translate anything I say into embryo selection because that's their job, and "the embryo we don't transfer" reads to them as a death rather than a non-event. Either the case survives that translation intact, or the plan needs to name the translation problem at the moment it happens.
  - **The misconceptions**, in the order they'll actually surface, and the exact point in the sequence where I get ahead of each one rather than fielding it afterwards. I'm expecting: "but the child is harmed by it"; "so you're saying we should have disabled children"; "then nothing we do to future people can be wrong"; "this is just eugenics with extra steps"; and the sneakiest one — "we're not doing anything *to* the embryo, so there's nothing that needs justifying." Tell me which of those I've got wrong and which ones I'm missing.
  - **One question** near the end that would genuinely tell me whether it landed, plus what a right answer sounds like versus a fluent-but-wrong one.
  - **What I should refuse to cover** at this level, and say out loud that I'm refusing it.

  Be committed: one case, one sequence, one closing question, and flag the single step in the plan your least confident about with this particular audience and what I do if it goes flat. And if you think my diagnosis is off — that the non-identity problem is the wrong thing to teach these people because it'll land as a word game and they'll switch off, or that it can't be separated cleanly from the embryo question in ninety minutes — say that plainly rather than building me a careful session on a bad premise.
reasoning: |-
  Here's a thinking process that leads to the suggested teaching plan:

  1.  **Analyze the Request:**
      *   **Audience:** 14 fertility clinic staff (embryologists, nurses, 1 consultant, 1 GP/counsellor). Tired, end of day, no pre-reading, won't read post-session.
      *   **Topic:** Nominally Procreative Beneficence (PB), actually the Non-Identity Problem (NIP).
      *   **Goal:** They need to understand NIP because it underpins their objections to PB.
      *   **Constraints:** 90 minutes. No reading lists. One specific case study. One closing question. Identify misconceptions. Identify what *not* to cover. Flag the riskiest step.
      *   **Tone:** Professional, direct, pragmatic, ethically sophisticated (the user knows the NIP already).
      *   **Critical Challenge:** The audience works with embryos. To them, "not selecting an embryo" feels like "killing" or "discarding," not "non-existence." The case study must survive this translation or address it head-on.

  2.  **Evaluate the Premise (The "Say That Plainly" Clause):**
      *   *Is NIP the right thing to teach?* Yes, but with a major caveat. For embryologists, the "non-identity" of an embryo is technically true (Embryo A $\neq$ Embryo B), but emotionally/ethically felt as identity (Embryo A = Potential Child).
      *   *Will it land as a word game?* High risk. If I use Parfit's original "14-year-old girl" case, they will tune out because it's not *their* context. If I use an embryo selection case, they will conflate "different embryo" with "same child with different traits."
      *   *Decision:* The premise is sound *if* the case study bridges the gap between "different person" and "different embryo" without triggering the "discarded embryo = death" reflex. I need to validate their intuition (that discarding feels significant) while showing the logical structure of NIP.
      *   *Verdict:* I will build the plan, but I must explicitly warn about the "Embryo vs. Person" translation error in the "Misconceptions" and "Riskiest Step" sections.

  3.  **Drafting the Sequence (The Order):**
      *   *Total Time:* 90 mins.
      *   *Phase 1: Grounding (15 mins).* Establish PB. Get them to state their intuitive objections.
      *   *Phase 2: The Trap (20 mins).* Introduce the Person-Affecting Restriction (PAR) without naming it yet. Show how it drives their objections.
      *   *Phase 3: The Case (30 mins).* The core NIP illustration.
      *   *Phase 4: The Implication (15 mins).* What this means for their practice (harm vs. wrong).
      *   *Phase 5: Closing (10 mins).* The diagnostic question.
      *   *Constraint Check:* Need to surface PAR *before* suspending it. Need to do this without accusing them of holding it.

  4.  **Selecting The One Case:**
      *   *Option A: Parfit's 14-year-old girl.* Too abstract. Irrelevant to IVF.
      *   *Option B: Deaf Couple (Sharon Duchesneau).* Controversial, triggers "harm" debates immediately.
      *   *Option C: The "Two Embryos" Case (Standard PB).* Risky. They see untransferred embryos as "lost lives."
      *   *Option D: The "Pre-conception Timing" Case.* (e.g., Take this pill now vs. wait a month).
      *   *Selection:* **The "Wait a Month" Case.**
      *   *Why?* It decouples the *embryo* from the *decision*. If a woman takes a teratogenic med now, Child A is conceived (disabled). If she waits a month, the med clears, Child B is conceived (healthy). Child A and Child B are genetically different (different sperm/egg combo due to time).
      *   *Crucial Feature:* It avoids the "discarded embryo = death" feeling. The embryo isn't discarded; the *conception* is delayed.
      *   *What to leave out:* Don't mention embryo selection yet. Keep it to timing of intercourse/insemination to bypass the "embryo death" intuition.

  5.  **Mapping Misconceptions:**
      *   *User's List:* "Child is harmed," "Should have disabled children," "Nothing can be wrong," "Eugenics," "Not doing anything to embryo."
      *   *Analysis:*
          *   "Child is harmed": This is the core PAR violation. Address during the Case.
          *   "Should have disabled children": Address during Implications (NIP doesn't dictate action, just logic).
          *   "Nothing can be wrong": Address during Implications (Impersonal harm).
          *   "Eugenics": Address early (Phase 1) as a value concern, not logical.
          *   "Not doing anything to embryo": This is the *embryologist specific* trap. They think "No transfer = Harm to *this* embryo." Need to address this when introducing the Case.
      *   *Missing:* "It's a technicality/word game." (The biggest risk).

  6.  **Developing the Closing Question:**
      *   Needs to distinguish between "Harm to specific individual" vs. "State of affairs is worse."
      *   *Draft:* "Is the child worse off?" (Too simple).
      *   *Better:* "If we choose Embryo A (disabled) over Embryo B (healthy), who is the victim?"
      *   *Right Answer:* "There is no victim in the person-affecting sense, but the outcome is worse."
      *   *Fluent-but-Wrong:* "The disabled child is the victim."

  7.  **Identifying What NOT to Cover:**
      *   Don't cover the Repugnant Conclusion (too far).
      *   Don't cover detailed meta-ethics (utilitarianism vs. deontology).
      *   Don't cover legal liability.
      *   *Crucial:* Don't try to solve the NIP. Just expose it.

  8.  **Risk Assessment (The Riskiest Step):**
      *   The transition from "Wait a Month" (theoretical) back to "Embryo Selection" (practice).
      *   *Risk:* They will reject the analogy. "But in IVF we *have* the embryos."
      *   *Mitigation:* Acknowledge the disanalogy explicitly.

  9.  **Refining the Plan (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I don't sound like I'm teaching them logic puzzles. Keep it clinical. Use their language (cycles, transfers, outcomes).
      *   *Correction on PAR:* Don't use the term "Person-Affecting Restriction" immediately. Call it "The Harm Principle" or "Victim Requirement" first, then name it.
      *   *Timing:* 90 mins is tight. Keep the lecture parts short. Use discussion to burn time and check understanding.

  10. **Final Polish:** Check against all constraints.
      *   One case? Yes (The "Wait a Month" / Teratogen case).
      *   One sequence? Yes.
      *   One closing question? Yes.
      *   Flag riskiest step? Yes.
      *   Refuse coverage? Yes.
      *   Challenge premise? I will validate the premise but add the warning about the "Embryo/Person" conflation.

  *(Self-Correction on the Premise Challenge)*: The prompt asks me to say plainly if the diagnosis is off. Is NIP the right thing? For *embryologists*, the Non-Identity Problem is technically *more* obvious (Embryo A is not Embryo B) but ethically *less* resonant (Embryo A is a potential patient). If I teach NIP, I must ensure I don't validate the idea that embryos don't matter. I need to be careful. Actually, the "Wait a Month" case is safer than the "Embryo Selection" case for teaching NIP, but then I have to bridge back to their job. I will stick with the "Wait a Month" case because it isolates the logic without the "discarded life" baggage.

  Let's finalize the structure.
  1. Intro & PB (15)
  2. The Intuition & The "Victim" Rule (20)
  3. The Case: "The Delayed Cycle" (30)
  4. The Pivot: Back to Embryos (15)
  5. Closing Question (10)

  Wait, I need to make sure the "Wait a Month" case works for *embryologists*. They deal with embryos *ex vivo*. A "delayed cycle" is more the GP/Counsellor/Doctor's realm.
  *Alternative:* **The "Two Embryos, Different Gametes" Case.**
  Scenario: We have Embryo A (tested, condition X) and Embryo B (tested, healthy). They are from the *same* cycle.
  *Problem:* This triggers the "Embryo B is the same child" intuition? No, they know they are different.
  *Problem:* This triggers the "Embryo A is killed" intuition.
  *Solution:* I must use the "Wait a Month" case *specifically* to teach the logic, then explicitly map it to embryos in the "Pivot" section, acknowledging the emotional difference.
  *Actually, better:* **The "Pre-Implantation Genetic Testing (PGT) Switch" Case.**
  Scenario: Couple has 5 embryos. 3 have Condition C, 2 are unaffected.
  If we transfer a C embryo -> Child C exists.
  If we transfer an unaffected embryo -> Child U exists.
  *Crucial framing:* Do not talk about the *discarded* embryos. Talk about the *choice of who is born*.
  *Wait, the prompt warns:* "the embryo we don't transfer reads to them as a death rather than a non-event."
  *Okay, I must heed this.* I cannot use an embryo selection case for the *teaching* of NIP. I must use a pre-conception case.
  *Decision:* Stick with **"The Teratogen Timing Case"** (Take med now vs wait). It is the only way to bypass the "death" intuition. I will explicitly tell them *why* I am using this case (to isolate the logic).

  Let's write the response.cw
answer: |-
  ### Diagnosis Check
  Your diagnosis is correct, but with a specific hazard. The Non-Identity Problem (NIP) is the logical skeleton underneath their resistance to Procreative Beneficence (PB). However, for embryologists, the "identity" of an embryo is biologically concrete (unique genome) but ethically loaded (potential patient). If you teach NIP using an embryo selection case, they will reject the premise because to them, *not transferring* Embryo A feels like harming Embryo A, not "preventing Embryo A from existing."

  Therefore, **you cannot use an embryo case to teach the logic.** You must use a pre-conception case to establish the logic, then map it back to embryos. If you try to teach NIP *through* embryo selection, the session will stall on the moral status of the discarded embryo.

  Here is the plan.

  ---

  ### The Sequence (90 Minutes)

  **0:00–0:15 | Frame: Procreative Beneficence (PB)**
  *   **Goal:** Get PB on the table without triggering defensiveness.
  *   **Action:** Define PB simply: "If we have a choice between creating a child with a significant disability and a child without, do we have a moral reason to choose the latter?"
  *   **Trap:** Do not ask "Is PB right?" Ask "What makes PB feel uncomfortable?"
  *   **Output:** Write their objections on the whiteboard. You are looking for phrases like "harming the child," "playing God," or "that child still has a life worth living."
  *   **Why:** You need to surface their intuitive reliance on the **Person-Affecting Restriction** (the idea that an act is only wrong if it makes a *specific* person worse off) without naming it yet.

  **0:15–0:35 | The Setup: The "Victim Requirement"**
  *   **Goal:** Name the intuition they are holding so you can later suspend it.
  *   **Action:** Look at the board. Point to the "harm" objections. Say: "It sounds like many of you are working with a 'Victim Requirement.' An action feels wrong to us if we can point to a specific person and say, *'You are worse off because of what we did.'*"
  *   **Crucial Move:** Validate this. "This is how we work in clinical ethics usually. We don't treat patients in ways that harm *them*."
  *   **Why:** You are not accusing them of error; you are naming their professional standard. This lowers defenses before you show where that standard breaks in reproduction.

  **0:35–1:05 | The One Case: "The Teratogen Timing"**
  *   **Goal:** Demonstrate NIP without triggering the "discarded embryo = death" reflex.
  *   **The Case:** A woman needs a medication for a chronic condition. It is safe for *her*, but teratogenic in the first trimester.
      *   **Option A:** She conceives *now*. The fetus is exposed. The child is born with a significant, lifelong physical impairment (but a life worth living).
      *   **Option B:** She waits two months for the drug to clear. She conceives *then*. Because conception involves different sperm and eggs, a *different* child is conceived. This child is born without the impairment.
  *   **The Question:** "If she chooses Option A, has she harmed the child born in Option A?"
  *   **Discussion:** Let them debate. Guide them to the realization: If she chose Option B, the child from Option A would *never have existed*. Therefore, Option A did not make *that child* worse off than they would otherwise have been. (Existence > Non-existence, assuming life is worth living).
  *   **Why this case:** It bypasses the embryo death intuition. No embryo is discarded; conception is merely delayed. It forces the identity distinction (different gametes = different person) which is biologically true for embryos too, but emotionally safer here.

  **1:05–1:20 | The Pivot: Mapping Back to Embryos**
  *   **Goal:** Apply the logic to their actual work without conflating the cases.
  *   **Action:** Explicitly address the translation problem. Say: "In the clinic, you don't delay conception; you select embryos. But the structure is identical. Embryo A (affected) and Embryo B (unaffected) are not the same child in different costumes. They are different possible people."
  *   **The Shift:** "If you transfer Embryo A, you cannot say Embryo A was *harmed* by not being Embryo B. Embryo A *is* the child. But you can still say selecting Embryo A was *wrong* because the outcome is worse, even if no specific victim exists."
  *   **Why:** This separates "Harm to a person" (NIP blocks this) from "Wrongness of the act" (NIP allows this). This is the core insight you need them to take home.

  **1:20–1:30 | Closing & Diagnostic Question**
  *   **Goal:** Test if the logic stuck.
  *   **Action:** Ask the question (see below). Debrief.

  ---

  ### The One Case: "The Teratogen Timing"

  **Why this one:**
  It is the only case that survives the "embryo death" translation. If you use a PGT/embryo selection case to teach NIP, the embryologists will fixate on the moral status of the untransferred embryo. They will argue, "We killed Embryo A," which bypasses the NIP entirely (killing *does* harm a specific entity).
  By using pre-conception timing, you force the "Different Person" conclusion without the "Death" baggage.

  **What it must have:**
  1.  **Different Gametes:** You must explicitly state that waiting two months means different sperm and eggs are used. This secures the "Non-Identity" premise biologically.
  2.  **Life Worth Living:** The impairment must be significant but not incompatible with a life the child values. If the life is not worth living, the NIP dissolves (non-existence is better).
  3.  **No "Same Child" Intuition:** Avoid language like "the same child would be born later."

  **What it must leave out:**
  1.  **Embryo Discard:** Do not mention freezing or destroying embryos in this specific case.
  2.  **Parental Burden:** Keep the focus on the child's status, not the parents' stress, to avoid utilitarian calculus distractions.

  ---

  ### The Misconceptions (and when to kill them)

  1.  **"But the child is harmed by it."**
      *   *When:* During **The One Case (0:35–1:05)**.
      *   *Pre-emption:* Do not wait for them to say it. Ask it yourself. "Your instinct is to say yes, she harmed him. But compare him to what? The only alternative for *him* is never existing." Force the counterfactual comparison immediately.

  2.  **"So you're saying we should have disabled children?"**
      *   *When:* During **The Pivot (1:05–1:20)**.
      *   *Pre-emption:* "Understanding NIP does not mean we are neutral about disability. We can say choosing the impaired child is *worse*, even if it doesn't harm *that* child. Distinguish 'worse outcome' from 'harm to victim'."

  3.  **"Then nothing we do to future people can be wrong."**
      *   *When:* During **The Pivot**.
      *   *Pre-emption:* "This is the slippery slope fear. NIP doesn't remove obligation; it changes the *source* of the obligation from 'duty to this person' to 'duty to create the best state of affairs'."

  4.  **"This is just eugenics with extra steps."**
      *   *When:* During **Frame (0:00–0:15)**.
      *   *Pre-emption:* Acknowledge this immediately when defining PB. "PB is often conflated with eugenics. Eugenics is about state coercion and population purity. PB is about individual parental choice. We are discussing the latter." Get it out of the room early.

  5.  **"We're not doing anything *to* the embryo, so there's nothing that needs justifying."** (The Sneakiest One)
      *   *When:* During **The Setup (0:15–0:35)**.
      *   *Pre-emption:* This is the inverse of the harm objection. They might say, "If we don't harm them, why discuss ethics?" Address this by framing the session: "We are here precisely because the 'no harm' argument feels insufficient, yet we can't articulate why."

  **Missing Misconception:**
  *   **"It's a word game / technicality."**
      *   *Risk:* They will dismiss NIP as semantic trickery that doesn't match clinical reality.
      *   *Fix:* In **The Pivot**, admit the disanalogy. "In the clinic, Embryo A feels like a patient. Logically, it's a possible person. The tension you feel between those two things *is* the ethical work."

  ---

  ### The Closing Question

  **The Question:**
  "In the Teratogen case, if the mother chooses to conceive now (Option A), can we criticize her choice without claiming she harmed her child?"

  **Right Answer:**
  "Yes. We can say the choice was wrong (or less good) because it resulted in a state of affairs with more suffering/less opportunity, even though the specific child born cannot claim they were made worse off."
  *(Key markers: Distinguishes "wrong act" from "harmed victim"; accepts impersonal harm.)*

  **Fluent-but-Wrong Answer:**
  "No, because if the child has a good life, the choice is fine." (Misses the PB obligation).
  OR
  "Yes, because the child is harmed by having a disability." (Misses the NIP logic entirely).
  OR
  "It depends on the severity of the disability." (Dodges the structural point).

  ---

  ### What to Refuse to Cover

  Say this explicitly at the start (0:05):
  1.  **The Moral Status of the Embryo:** "We are not debating whether an embryo is a person or property today. We are taking the legal and clinical framework as given." (Prevents the session becoming an abortion debate).
  2.  **The Repugnant Conclusion:** "We are not going down the rabbit hole of 'designer babies' or total utilitarianism. We are looking strictly at the logic of selection vs. non-existence."
  3.  **Legal Liability:** "This is about ethical reasoning, not negligence law. Don't ask me about case law."

  ---

  ### The Riskiest Step (and mitigation)

  **The Step:** **The Pivot (1:05–1:20).**
  **The Risk:** The embryologists will reject the mapping. They will say, "The Teratogen case is different. In the clinic, Embryo A *exists* in the dish. We can see it. If we don't transfer it, it dies. In your case, the child just wasn't conceived."
  If this happens, the NIP logic collapses for them because they view the untransferred embryo as a *victim of discard*, not a *non-identity possibility*.

  **Mitigation if it goes flat:**
  Do not argue the biology. They know the biology better than you.
  **Say this:** "You are right. In the clinic, there is an additional layer: the fate of the untransferred embryo. That is a separate ethical question about the status of the embryo. The NIP point I am making is only about the *child that is born*. Even if we solve the embryo status question, the question remains: Did we harm the *born child* by selecting them? That is the specific knot I want you to see."
  *Why:* It validates their expertise (embryo status is complex) while isolating the specific logical point you need them to grasp (the status of the born child).

  ### Final Advice on Tone
  You are tired, they are tired. Do not lecture. Use the whiteboard. Draw the two branches of the Teratogen case. Draw the two branches of the Embryo case. Visually show that the "Identity" line is broken in both. If you talk *at* them for 90 minutes, they will leave remembering nothing. If they argue with the diagram, they will remember the problem.
