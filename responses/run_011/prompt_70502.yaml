answer: |-
  This is a classic formulation of **Jaegwon Kim's Causal Exclusion Argument**, dressed in condensed-matter clothing. Your flatmate is using the Multiple Realizability (MR) of phonons to drive a wedge between special-science properties and fundamental physics, forcing you into a dilemma: accept "spooky" emergent properties or admit that tables and money are causally inert fictions.

  You are right to be uncomfortable. The argument is valid, but it relies on hidden metaphysical assumptions that many philosophers (and increasingly, physicists) reject. Since you want to hold onto (2) and (3) (the science is solid) but reject the conclusion (8), you need to attack the bridge between them.

  Here is the breakdown of the costs for the two main routes you identified: rejecting (7) or rejecting the implications of (8).

  ### Option 1: Reject Premise (7) — The "Compatibilist" Route
  Premise (7) claims: *If a property isn't identical to a physical property, it's either dualist "stuff" or causally inert.*

  To reject this, you argue that a property can be **distinct** from a physical property (because it's multiply realizable) without being **separate** from the physical stuff (ontologically), and still do **causal work**. This is the standard Non-Reductive Physicalist position.

  **The Move:**
  You deny that causation is a zero-sum game. Premise (7) assumes that if the atoms do the causing, the table *cannot also* do the causing unless it is identical to the atoms. You argue that the table causes the effect *in virtue of* the atoms causing the effect. They are not competitors; they are different descriptions of the same causal chain.

  **The Cost:**
  1.  **You must change your theory of causation.** You cannot view causation merely as "transfer of energy" or "physical push" (which happens only at the micro-level). You must adopt a counterfactual or interventionist theory of causation (e.g., "If the table hadn't been there, the book wouldn't have stopped"). This makes causation partly dependent on how we carve up the world, not just on the world itself.
  2.  **You must accept "Benign Overdetermination."** Critics will say you are claiming every effect has two sufficient causes (the atoms and the table). You have to argue this isn't a bug, but a feature of layered reality.
  3.  **You lose "Fundamentalism."** You have to admit that the "complete physical description" of the universe does not *explain* everything, even if it accounts for all the substance. It accounts for the *substrate*, but not the *structure*.

  **Verdict:** This is the cheapest cost for a common-sense realist. It saves tables and money without adding ghost-stuff.

  ### Option 2: Reject the "Extra Ingredient" Horn of (8) — The "Ontological Deflation" Route
  Premise (8) forces you to say physics leaves things out (Dualism/Emergentism). Your flatmate is happy with this for phonons. You are not, because it makes a £20 note sound like a soul.

  To reject this, you argue that being "multiply realizable" does not make a property an "extra ingredient." It makes it a **pattern** or a **functional role**.

  **The Move:**
  You argue that phonons, tables, and money are not *additions* to the ontology; they are *organizations* of the ontology. A phonon is not a particle added to the lattice; it is a vibrational pattern *of* the lattice. A table is not wood plus "tableness"; it is wood arranged table-wise.

  **The Cost:**
  1.  **You must accept Scale-Relative Existence.** You have to give up the idea that there is one single list of "What Exists." Existence becomes relative to the scale or the "Effective Field Theory" (EFT) you are using. At the quantum scale, there are no tables. At the human scale, there are. Neither is "more real," just relevant to different domains.
  2.  **You must distinguish Token vs. Type Identity.** You must accept that *this specific table* is identical to *this specific collection of atoms* (Token Identity), but the *property of being a table* is not identical to *any specific atomic arrangement* (Type Identity). This is a subtle metaphysical distinction that requires careful bookkeeping.
  3.  **Social Ontology Burden.** For the £20 note, the "realizer" isn't just physical; it's social. To save the note from being inert, you must admit that social facts (collective intentionality) are part of the causal fabric of the universe. This scares physicalists, but it's necessary for money to be real.

  **Verdict:** This aligns best with your flatmate's physics (EFTs) but requires you to be comfortable with the idea that "what exists" depends on the level of description.

  ### The Physicist's Trap (And How to Spring It)
  Your flatmate is using a physicist's concept (phonons) to win a metaphysical argument. But modern condensed matter physics actually supports **Option 2** above, not the dualist horn of (8).

  In modern physics, **Effective Field Theories (EFTs)** teach us that "emergent" entities (like phonons) are robustly real within their energy scale, even if they disappear at higher energies. They are not "extra ingredients"; they are **autonomous degrees of freedom**.

  **The Counter-Argument to your Flatmate:**
  "You say phonons are real but not fundamental. I agree. But you treat that as 'Physics leaves something out.' I treat it as 'Physics is layered.' If a phonon can be causally potent (carry heat, scatter neutrons) without being a fundamental particle, then a table can be causally potent (stop a book) without being a fundamental arrangement of atoms. If you grant phonons causal power without fundamental identity, you must grant tables the same, or explain why vibrations are allowed to be real but furniture is not."

  ### Summary of Costs

  | Option | What you deny | What it costs you |
  | :--- | :--- | :--- |
  | **Reject (7)** | The idea that causation is a zero-sum contest between levels. | You must accept a non-fundamentalist view of causation (interventionism). You risk accusations of "overdetermination." |
  | **Reject (8)** | The idea that non-fundamental = "extra ingredient." | You must accept that existence is scale-relative. There is no single "Catalogue of Reality." |
  | **Reject (5)** | The generalization that *all* special science properties are MR. | You might save "Water = H2O" but you still lose "Money" and "Recession." Doesn't solve your core worry. |

  ### Recommendation
  **Reject (7).**

  It is the most robust way to keep your tables solid and your physics complete. It costs you the comforting idea that the universe is a single, flat layer of causal pushes and pulls. Instead, you get a universe where causation works like software running on hardware: the software (table/money) does real work, but it never violates the laws of the hardware (physics), nor is it an "extra ingredient" added to the silicon. It is what the hardware *does*.

  Tell your flatmate: *"Phonons aren't ghosts in the lattice; they are what the lattice does. Tables aren't ghosts in the atoms; they are what the atoms do. If phonons get to be real without being fundamental, so do tables."*
