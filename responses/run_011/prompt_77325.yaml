answer: |-
  The pattern of American law—exempting foreign facilitation payments while criminalizing domestic illegal gratuities—renders itself coherent only under a **dual-regime conception of corruption based on the nature of the entitlement violated.**

  ### 1. The Coherent Conception: Distortion of Entitlement
  To reconcile the Foreign Corrupt Practices Act (FCPA) exception with the domestic illegal gratuity statute, one must adopt a conception where corruption is defined not by the mere exchange of money for official conduct, but by the **subversion of a specific protected entitlement.**

  *   **In the Foreign Commercial Context (FCPA):** The protected entitlement is **fair market competition.** A foreign official's discretion (awarding a contract) determines a competitive winner and loser. Paying to influence this distorts the market. However, a "routine governmental action" (releasing cargo) is a ministerial duty owed to *anyone* who qualifies. Paying to expedite this does not alter the competitive *outcome* (who gets the contract), only the logistical *timing*. Thus, the FCPA carve-out supposes that **corruption lies in the purchase of an official's judgment (discretion) rather than of his action (ministerial duty).** It treats the payment as buying a place in a queue, not a decision.
  *   **In the Domestic Civic Context (Illegal Gratuities):** The protected entitlement is **civic equality.** A domestic citizen is entitled to government service without charge. Paying a domestic official for a ministerial act (even one they are obliged to perform) violates the citizen's right to equal treatment. Here, the wrong is the **degradation of the office**, because the office exists to serve the public trust, not to generate revenue for the official.

  Therefore, the pattern is coherent only if corruption is understood as **the monetization of state power in violation of the beneficiary's rightful claim.** Foreign businesses have a claim to a fair bid, but not to free bureaucracy; domestic citizens have a claim to both.

  ### 2. Rival Conceptions Foreclosed
  The FCPA's facilitation payment exception explicitly forecloses the **Role-Integrity View** of corruption in the international commercial sphere.
  *   **The Role-Integrity View:** This theory holds that an office is corrupted whenever it is put up for sale, regardless of whether the act was discretionary or ministerial. The mere acceptance of private payment for public duty severs the official's loyalty to the state.
  *   **The Foreclosure:** By exempting payments for routine actions, the FCPA legislatively declares that an official already under a duty *can* be paid to discharge it without committing "bribery" under US law. It rejects the notion that the integrity of the office is inherently tainted by the transaction; instead, it locates the taint in the *effect* of the transaction (influencing discretion).

  It also forecloses the view that **queue-jumping is inherently corrupt.** The statute assumes that if the official is legally obliged to perform the act eventually, accelerating the timeline via payment is a commercial efficiency issue, not a moral hazard.

  ### 3. Presupposition, Fit, and Underdetermination
  To analyze the statute's logic precisely, we must separate its logical requirements from its cultural justifications.

  *   **Strictly Presupposed:**
      1.  **Existence of a Legal Duty:** The exception presupposes an objective standard where the official is *legally obliged* to perform the act. If no duty exists, the payment becomes a bribe to create the duty.
      2.  **Non-Discretionary Outcome:** It presupposes the payment cannot influence *whether* the act occurs, only *when*.
      3.  **Distinction between Foreign and Domestic:** It presupposes the US government has the authority to define corruption differently for its own officials versus foreign officials.

  *   **Fits Comfortably (but not required):**
      1.  **The "Grease Payment" Narrative:** The idea that these payments are small, trivial, and necessary to overcome bureaucratic inertia fits the exception well, but the statute does not strictly require the payment to be small or the bureaucracy to be inert.
      2.  **Cultural Relativism:** The notion that "this is how business is done abroad" comforts the exception, but the text relies on legal duty, not cultural norms.

  *   **Underdetermined Practice:**
      The line is critically underdetermined regarding **De Facto Discretion.**
      *   *Theory:* An official either has discretion or they don't.
      *   *Practice:* An official may be legally obliged to release cargo (ministerial) but has the practical ability to "lose" the paperwork indefinitely (de facto discretion).
      *   *Incompatible Theories Licensing the Same Line:*
          1.  **Formalist Theory:** Look only at the written regulation. If the regulation says "release within 24 hours," it's routine.
          2.  **Realist Theory:** Look at the official's actual power. If they can delay, they have discretion.
          *   *Result:* A compliance officer might approve a payment under the Formalist theory (it's a routine action on paper) while a prosecutor might attack it under the Realist theory (the official had leverage). The statute does not resolve which view governs.

  ### 4. The Transatlantic Disagreement
  Is the disagreement between the US (FCPA) and UK (Bribery Act 2010) about what corruption *is*, or what is *worth prosecuting*?

  It is a **substantive disagreement about what corruption is**, masked as a procedural difference.
  *   **The UK Position:** The Bribery Act defines bribery broadly to include any financial advantage given to induce improper performance. By refusing to codify an exception for facilitation payments, the UK legislature adopted the **Role-Integrity View** into the definition of the crime. They assert that paying for a ministerial act *is* bribery, full stop. (Prosecutorial discretion exists, but the *crime* is established).
  *   **The US Position:** The FCPA defines bribery narrowly to exclude facilitation payments. The US asserts that paying for a ministerial act *is not* bribery under the statute.
  *   **Conclusion:** If it were merely about prosecution, the US would keep the crime on the books but issue guidance saying "we won't prosecute small cases." Instead, the US wrote an affirmative defense/exception into the statute. This signals a disagreement on the **moral ontology of the act.** The UK says the act is inherently wrongful; the US says the act is wrongful only if it influences discretion.

  ### 5. Implications of Adopting the Role-Integrity View
  If the US were to adopt the Role-Integrity view (aligning with the UK and its own domestic gratuity statute), the following changes would be necessary:

  **Textual Changes:**
  *   **Delete the Exception:** The "routine governmental action" clause in the FCPA (15 U.S.C. § 78dd-1(b)) would need to be repealed.
  *   **Redefine "Corrupt Intent":** The statute would need to shift from requiring intent to *influence* an official act to intent to *reward* or *induce* any official act, regardless of discretion.

  **Compliance Routine Changes:**
  *   **From Risk-Based to Zero-Tolerance:** Current compliance programs operate on a risk matrix, often tolerating or creating accounting mechanisms for small facilitation payments (where local law permits). Adoption of Role-Integrity would require a **zero-tolerance policy**.
  *   **Due Diligence Expansion:** Third-party agents (customs brokers, logistics providers) currently vetted for "bribe risk" would need to be vetted for *any* payment to officials. The "de minimis" threshold would vanish.
  *   **Training Shift:** Training would move from "Don't buy decisions" to "Don't buy access." Employees would need to understand that paying to get a visa processed on time is legally equivalent to paying to win a bid.
  *   **M&A Liability:** Acquiring foreign companies would become riskier, as historical facilitation payments (currently legal under FCPA) would become retroactive liabilities if the legal standard shifted or if the company sought to align global standards upward.

  In sum, the current American pattern is coherent only if one accepts that corruption is context-dependent: a market crime abroad and a civic crime at home. The transatlantic split reveals that the UK rejects this duality, insisting that the integrity of the office is indivisible, regardless of whether the official is in London or Lagos.
