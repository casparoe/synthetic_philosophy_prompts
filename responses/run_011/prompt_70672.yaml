answer: |-
  Dear Friends and Colleagues,

  We are writing this together to clarify what happened between us last night and to set the stage for our next session. We argued until two in the morning about the dogmatism paradox, and somewhere around midnight it became clear that we had been talking past each other for most of the evening. We are the two regular facilitators of this monthly reading group, and we owe you a clearer map of the territory than the one we shouted over. This document is the joint statement we should have produced instead of exhausting ourselves. It contains the claims both of us can sign, followed by the residual disagreements, stated in wording each side accepts as its own, and then our shared analysis of where the real philosophical work lies. We intend to read this aloud, taking alternate paragraphs, so that the room can follow who is conceding what without seeing the page.

  We begin with what we agree on regarding the shape of the argument. We both accept that knowledge is factive, meaning that if you know that p, then p is true. We agree that if you know p, and some new evidence e implies that p is false, then e must be false. We agree that if you know e is false, you are logically entitled to disregard it. We also agree on the distinction between evidence that bears on whether p is true and evidence that bears on whether you are in a position to know p. Finally, we agree on what actually happens in ordinary cases of inquiry. People who adopt a standing policy of disregarding anything they take to be misleading will misapply that policy constantly, and the misapplications are not benign. We agree that in the real world, confidence often outstrips knowledge, and treating a mere belief as knowledge licenses error.

  Where we diverge is on what the argument proves about justification versus conduct. My friend defends the conclusion as a claim about justification rather than about conduct. He holds that holding on to a belief in the face of evidence you know to be misleading is not thereby unjustified, and the sense that this is absurd comes from running two questions together, namely what attitude is epistemically justified and what policy an inquirer should adopt. I take the other side. I think the argument fails as guidance whatever it delivers as theory, because a standing policy of disregarding anything one takes to be misleading will be misapplied constantly and the misapplications are not benign. I suspect the deeper trouble is that the key premise only does work when the subject can actually deploy it, and in the very situations where it would need deploying it leans on the belief it is supposed to protect.

  To move past this stalemate, we examined four candidate questions to see which one was load-bearing and which were downstream distractions. We considered whether epistemic norms govern attitudes only, or also the conduct of inquiry, and so whether an answer about justification answers any practical question at all. We considered whether the knowledge that a given item of evidence is misleading is available to the subject as a reason at the moment she needs it, or only in the abstract beforehand. We considered whether receiving the counter-evidence can itself destroy the knowledge that was supposed to license disregarding it. And we considered whether misleading evidence names anything an agent can recognize from the inside, as opposed to something identifiable only from outside with the facts already in hand.

  We have concluded that the first candidate is largely verbal, the second and third are downstream of the fourth, and the fourth is the real crux. The dispute about whether norms govern attitudes or conduct dissolves once we see that a norm cannot govern an attitude if the agent cannot recognize the conditions for its application. The availability of knowledge and the defeasibility of knowledge both depend on whether the agent can tell from the inside that evidence is misleading. If misleading evidence is something identifiable only from outside with the facts already in hand, then the agent cannot use the knowledge that evidence is misleading to justify disregarding it at the moment of inquiry. This is the load-bearing question.

  To test this, we constructed a concrete case that both sides accept as bearing on the crux. Consider the clinician who knows a diagnosis from a confirmatory test and the next morning gets an opposite result from a second, ordinarily reliable one. The defender predicts that if the first test was truly knowable as conclusive, the clinician retains knowledge and the second result is simply known to be misleading. The critic predicts that the second result destroys the knowledge from the first test because the clinician cannot tell from the inside which test is the outlier without engaging in further inquiry that suspends the initial knowledge. If the defender turns out to be right, then knowledge is more robust than we thought and survives conflicting appearances. If the critic turns out to be right, then knowledge is fragile and requires ongoing calibration that precludes dogmatism. We both agree that if the critic's prediction holds, the dogmatist principle cannot be used as a guide, because you cannot know the evidence is misleading until you have already resolved the inquiry.

  We also offer an honest verdict on how much of our argument was merely verbal. Our suspicion is confirmed that both disregard and should are doing double duty in the exchange. When the defender says you should disregard misleading evidence, he means you are not irrational for maintaining your belief. When the critic says you should not disregard it, he means you are reckless for closing off inquiry. Once we strip away the verbal part, what survives is the question of recognition. The defender must show that an agent can recognize misleading evidence from the inside without begging the question. The critic must show that such recognition is impossible without circularity. This is where the dispute lives now.

  We run this conclusion through the three cases we kept reaching for to ensure it holds. Take the pre-commitment, in which on Monday you know p and write your future self a note instructing them to ignore whatever seems to count against p next week. In the variant where, by the time the note is read, its author no longer remembers why she knew p, the defender must say the note is binding because the knowledge persists factually. The critic says the note is useless because the future self cannot access the justification needed to identify counter-evidence as misleading. If the critic is right, pre-commitment to dogmatism is epistemically inert. The note cannot supply the internal recognition required to deploy the principle.

  Consider again the clinician who knows a diagnosis from a confirmatory test and the next morning gets an opposite result from a second, ordinarily reliable one. Here the defender must claim the first test puts the clinician in a position to know the second is wrong immediately. The critic claims the second test puts the clinician in a position of doubt that defeats the knowledge from the first test until reconciliation occurs. If the defender is right, the clinician is justified in treating the patient based on the first test alone. If the critic is right, the clinician must suspend judgment. This is not a difference in policy preferences but a difference in the structure of knowledge itself.

  Finally, consider the case in which the new information does not bear on p at all but on whether she is in a position to know p, such as learning that the informant was unreliable, or the instrument was out of calibration when it gave the reading. The defender must argue that this higher-order evidence is itself misleading if p is known. The critic argues that this higher-order evidence directly attacks the position to know, regardless of p's truth. If the critic is right, then knowledge is not just factive but sensitive to the agent's awareness of their own reliability. This is the point where the defender's position becomes hardest to maintain, because it requires claiming that knowing p licenses you to ignore evidence that you are unreliable.

  We conclude that the collaboration can be completed, but only by isolating the recognition issue. The exact sentence where the dispute previously broke down was the claim that knowing something licenses you to refuse to listen. We now see that this is true only if knowing something licenses you to recognize counter-evidence as misleading from the inside. If it does not, the license is void. The defender is being asked to swallow the claim that agents have internal access to the falsity of counter-evidence. The critic is being asked to swallow the claim that knowledge is compatible with total ignorance of why one's evidence is superior. We agree that the former is the stronger claim and the latter is the weaker one.

  This leaves us with a clear agenda for the session. We are not asking you to decide who is right about justification. We are asking you to consider whether you can ever tell from the inside that evidence is misleading without already assuming what you are trying to prove. If you cannot, then the dogmatist argument is theoretically sound but practically useless. If you can, then the dogmatist argument is a powerful tool for rational stability. We have stopped shouting because we see that the noise was covering this single, quiet question. We invite you to join us in answering it, not by choosing a side, but by testing the limits of your own recognition.

  We hope this clarifies our position and restores the spirit of inquiry to our group. We look forward to discussing this with you next month.

  Sincerely,

  The Facilitators
