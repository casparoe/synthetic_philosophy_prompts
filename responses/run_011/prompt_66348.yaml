answer: |-
  # Preparation Sheet: Q&A Strategy for Ethics Seminar

  **To:** The Speaker
  **From:** [Your Assistant/Consultant]
  **Re:** Anticipating Objections from Moral Philosophers

  **Context:** Your core thesis is that moral principles function like physical laws (zeroth-order approximations with correction terms), but unlike physics, the ethical correction terms are not computable. This validates particularism (context rules) without discarding principles entirely.

  **Audience Profile:** Principled Generalists (Kantians, Consequentialists, Virtue Ethicists). They view principles as necessary for *guidance* and *teaching*. They will respect your physics expertise but scrutinize the analogy's philosophical lift.

  ---

  ### I. Strategic Concessions (Make these in your Opening/Closing)
  *Do not fight these battles. Conceding them disarms the audience's defensive posture regarding the utility of principles.*

  1.  **Pedagogical Necessity:** Concede that moral principles are indispensable for *moral education* and *novice deliberation*, just as Newtonian mechanics is indispensable for engineering students before they learn Relativity. You are not arguing we should burn the textbooks; you are arguing about the *metaphysical status* of the text.
  2.  **Heuristic Value:** Concede that principles have immense *pro tanto* force. They are not "mere rules of thumb" in a dismissive sense; they are condensed wisdom. Your claim is only that they are not *exceptionless constitutive norms*.

  ---

  ### II. Anticipated Objections & Replies

  #### 1. The Action-Guidingness Objection (Substantive)
  **Likelihood:** Very High.
  **Vocabulary:** *Deliberative perspective, decision procedure, normative force, algorithm.*
  **The Objection:** "In physics, tractable corrections allow prediction. In ethics, if the correction terms are 'not computable,' the principle cannot guide action at the moment of choice. If I cannot calculate the exception, the principle offers no more guidance than 'do the right thing.' Principles are supposed to solve the problem of uncertainty, not codify it."

  **Your Reply (2 mins):**
  "You are assuming principles must function as algorithms for decision. I am suggesting they function as *structural landmarks*. In physics, $F=ma$ doesn't tell an engineer exactly how a bridge will sway in a specific storm without massive contextual data, but it remains the scaffold upon which the calculation is built. Similarly, 'Do not lie' structures the moral landscape. It tells you where the burden of proof lies. The fact that the 'correction term' (e.g., to save a life) isn't computable *in advance* doesn't negate the principle's structural role; it simply locates the work of judgment in the agent's perception of the context, not in the principle itself. The principle narrows the search space, even if it doesn't output the solution."

  **Candid Note on Weakness:** This relies on shifting the definition of "guidance." If they insist guidance requires a decision procedure, you have no answer. You are redefining their terms.

  #### 2. The Moral Education Objection (Substantive/Practical)
  **Likelihood:** High.
  **Vocabulary:** *Moral development, virtue acquisition, codifiability, moral expertise.*
  **The Objection:** "If principles are merely approximations with uncomputable exceptions, how do we train moral agents? We teach rules to children and students so they develop reliable habits. If you tell them 'this rule has exceptions we can't define,' you risk encouraging moral opportunism or paralysis. Generalism is required for moral formation."

  **Your Reply (2 mins):**
  "I agree entirely on the pedagogy, which is why I concede their necessity in education. But we must distinguish *teaching tools* from *ontological truths*. We teach students Newtonian physics as if it were true, because it works for 99% of cases. We do not claim it is fundamentally exceptionless. Similarly, we teach 'Do not kill' as a robust principle. The danger of opportunism arises only if the agent lacks the *perceptual capacity* to recognize the correction terms. That is an argument for training moral perception (virtue), not for insisting the principle is metaphysically exceptionless. We can teach the rule while acknowledging the expert knows when the vacuum seal breaks."

  **Candid Note on Weakness:** They may argue that believing the rule is exceptionless is *part* of what builds the virtue. If you undermine the rule's status, you undermine the habit.

  #### 3. The Computability Disanalogy (Methodological)
  **Likelihood:** High (from the sharpest critics).
  **Vocabulary:** *Ceteris paribus, systematic tractability, epistemic access, model-dependent realism.*
  **The Objection:** "Your analogy hinges on the claim that physical laws count as laws because deviations are 'systematically tractable.' But you admit moral correction terms are *not* computable. If the tractability is what makes the physical generalization a law, and moral generalizations lack tractability, then by your own definition, moral principles are *not* laws. You've pulled the rug out from under your own analogy."

  **Your Reply (2 mins):**
  "This is the crux. I distinguish between *mathematical* tractability and *conceptual* tractability. In physics, we can write the correction term (e.g., drag coefficient). In ethics, the 'correction' is often a competing value that cannot be reduced to a common currency. However, the *structure* remains: there is a dominant force (the principle) and a perturbing force (the context). The 'law' status comes from the stability of the dominant force, not our ability to solve the equation. The disanalogy in computability doesn't break the analogy in structure; it highlights the complexity of the moral domain. It explains *why* particularism is true: the variables are too dense for a closed-form solution."

  **Candid Note on Weakness:** **This is your softest spot.** If "law" implies predictability, and ethics lacks predictability, the term "law" may be category-mistaken. See "The Deadly Question" below.

  #### 4. The Normativity Objection (Methodological)
  **Likelihood:** Medium.
  **Vocabulary:** *Is-ought problem, prescriptive vs. descriptive, Humean.*
  **The Objection:** "Physical laws describe what *must* happen; moral principles prescribe what *ought* to happen. You are deriving a normative conclusion from a descriptive analogy. Even if physics works this way, why should ethics? Moral principles might be constitutive norms (like the rules of chess) rather than empirical generalizations."

  **Your Reply (2 mins):**
  "I am not deriving an 'ought' from an 'is.' I am using physics as a model for how *generalizations function* in complex systems. Whether the principle is descriptive or prescriptive, the logical behavior of exceptions remains the same. Even in chess (a normative system), the principle 'control the center' has exceptions that depend on the specific board state. My argument is about the *logic of exceptions*, not the source of the norm. If exceptionless principles fail in the empirical world where we can measure everything, why insist they succeed in the moral world where variables are infinite?"

  **Candid Note on Weakness:** Philosophers who view moral principles as *constitutive* (defining what morality *is*) will reject the comparison to empirical approximations entirely.

  #### 5. The "Nothing New" Objection (Substantive)
  **Likelihood:** Medium (from the particularists).
  **Vocabulary:** *Dancy, holism of reasons, default reasons.*
  **The Objection:** "Jonathan Dancy and others have already argued for holism and particularism. You've spent 35 years in physics to tell us that context matters? How does the physics analogy add anything to Dancy's account of reasons?"

  **Your Reply (2 mins):**
  "Dancy argues that reasons behave holistically; I am offering an explanation for *why* our intuition demands principles despite that holism. Physicists know that even when the world is complex, we crave and use laws because they capture the dominant vector. The physics analogy validates the *psychological and heuristic necessity* of generalism while denying its *metaphysical supremacy*. It bridges the gap: it explains why the Generalist feels right (there is a dominant force) and why the Particularist feels right (the boundary conditions matter). It turns a stalemate into a division of labor."

  **Candid Note on Weakness:** If they are hardline Dancy-ites, they may view any appeal to "dominant vectors" as a stealth reintroduction of generalism.

  ---

  ### III. The "Must Land" Reply
  **Which reply is critical?**
  **Objection #3 (The Computability Disanalogy).**
  If you cannot defend why a generalization with *uncomputable* exceptions counts as a "law" or "principle" in any useful sense, the analogy collapses. You must land the idea that **principles describe the topology of the moral landscape, not the path through it.** If they accept that principles map the terrain (hills and valleys) even if they don't calculate the friction, you win. If they insist principles must calculate the path, you lose.

  ---

  ### IV. The Deadly Question
  **Which question do you hope nobody asks?**

  **"If the correction terms are not computable, even in principle, what distinguishes your 'moral law' from a mere statistical regularity or a prejudice?"**

  **Why this is fatal:**
  In physics, a "law" with uncomputable corrections is often demoted to an "empirical regularity" until the corrections are understood (e.g., Bode's Law). If you admit the exceptions are *in principle* non-computable (because moral contexts are infinitely nuanced), a philosopher will argue you have stripped the "law" of its necessity. A statistical regularity ("people usually don't kill") is not a moral principle ("one ought not kill"). If you cannot distinguish your "zeroth-order approximation" from a strong habit or social norm, you have not defended moral principles; you have merely defended sociology. This exposes the risk that your analogy reduces normativity to empirical frequency.

  **Preparation:** If asked, pivot immediately to *normative force*. "The force comes from the weight of the reason, not the predictability of the outcome. $F=ma$ is a law not because it always predicts perfectly, but because it identifies the causal structure. Moral principles identify the *normative* structure." (Be careful: this risks the Is-Ought objection again).
