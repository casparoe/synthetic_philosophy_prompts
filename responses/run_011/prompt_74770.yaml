answer: |-
  [Advisor's Note: The question is tractable, but 12,000 words is tight. I have narrowed the scope in the proposal below to exclude a deep meta-ethical defence of insect sentience, treating it instead as a conditional variable. I have also flagged the contentious applicability of the Non-Identity Problem to non-persons within the text, as requested.]

  **Dissertation Proposal**

  **Title:** The Moral Injury Level: Population Dynamics and the Ethics of Pest Control

  **1. Statement of the Question**
  Current agronomic practice relies on the Economic Injury Level (EIL), a decision rule intervening when pest density threatens financial loss. Concurrently, animal ethics typically evaluates pest control by counting immediate deaths or suffering per hectare. Both frameworks ignore a critical biological fact: insect populations are strongly density-dependent. Suppressing a population often triggers compensatory breeding in survivors, potentially increasing the total number of lives born over a season. Consequently, a treatment that kills many insects now may cause more to exist—and suffer—later.

  This dissertation asks: Can the EIL be reformulated as a *Moral Injury Level* (MIL)? Specifically, can we construct a decision rule where the input is expected welfare across a population's dynamic trajectory rather than yield and price? To answer this, the project must determine the appropriate unit of moral accounting (individuals, cohorts, or regimes), address the aggregation of welfare across lives of differing length and quality, and decide how to act under uncertainty regarding insect sentience.

  **2. Critical Context and Existing Approaches**
  The gap this research addresses lies in the static nature of existing ethical models applied to agriculture. Standard utilitarian approaches to insect ethics typically sum the negative welfare of individuals killed or harmed at time *t*. This assumes a stable counterfactual: if we do not spray, these specific insects would have lived; if we do, they die. However, in density-dependent systems, the counterfactual is unstable. Non-intervention allows a population trajectory that produces a entirely different set of individuals than intervention does.

  This introduces a non-identity structure: the choice of control regime determines *which* insects come into existence. While this problem is well-established in human intergenerational ethics, its application to insects is philosophically contentious. Some argue that non-identity objections require personhood or specific future-oriented interests which insects lack. This dissertation will not assume the non-identity problem applies straightforwardly; rather, it will test whether the *consequences* of identity-altering interventions (specifically, the total volume of welfare generated) render the identity of the individuals morally secondary to the shape of the population curve.

  Furthermore, existing approaches often assume welfare is aggregable across vast numbers of short lives. This dissertation treats aggregation as a necessary but defeasible presupposition. If a 'Total View' of welfare leads to absurd conclusions in high-turnover populations (e.g., favouring a regime that creates billions of briefly miserable lives over millions of moderately content ones), the MIL framework must accommodate an 'Average View' or a critical-level threshold. The proposal therefore does not merely apply existing ethics to entomology; it tests whether high-turnover demographic dynamics expose flaws in standard aggregative theories.

  **3. Chapter Plan**
  The dissertation will comprise five chapters, totalling approximately 12,000 words.

  *Chapter 1: Introduction (1,500 words)*
  This chapter will outline the conflict between agronomic efficiency and moral concern. It will define the Economic Injury Level and the standard ethical objection to pest control. It will state the central thesis: that ignoring population dynamics renders both economic and ethical calculations obsolete.

  *Chapter 2: The Agronomic Context (2,000 words)*
  Here, I will utilise professional expertise to explain density dependence, compensatory mortality, and reproductive rebound. I will present a stylised model of a single-pest, single-crop system. This section is descriptive, establishing the biological constraints that any moral rule must obey. No ethical claims will be made here, ensuring the biological premises are robust.

  *Chapter 3: The Ethical Framework (3,000 words)*
  This chapter will analyse the moral status of insects. It will not attempt to prove sentience definitively but will adopt a precautionary principle based on probability. It will examine the unit of accounting: does morality attach to the moment of death, the whole life, or the cohort? Crucially, it will address the non-identity objection. I will argue that even if the non-identity problem does not strictly apply to insects, the *consequentialist* calculus must still account for the total welfare generated by different population trajectories.

  *Chapter 4: Constructing the Moral Injury Level (3,500 words)*
  This is the core analytical chapter. I will attempt to formulate the MIL. I will integrate the demographic parameters from Chapter 2 with the welfare weights from Chapter 3. The output will not necessarily be a single number, but a decision procedure. I will explore how uncertainty over sentience affects the threshold (e.g., does lower probability of sentience require a higher welfare cost to trigger intervention?). I will test this against two contrasting control regimes to see if the MIL diverges from the EIL.

  *Chapter 5: Conclusion and Implications (2,000 words)*
  The conclusion will summarise whether a coherent MIL is possible. It will discuss the limitations of the model, particularly regarding aggregation. It will suggest whether this framework implies a moral obligation to reduce pest populations via non-lethal means (e.g., sterilisation) to avoid the rebound effect, or if non-intervention is sometimes the lesser evil.

  **4. Criteria for Success and Failure**
  A successful result will be a formalised framework for the Moral Injury Level. It need not provide a universal constant, but it must offer a worked reformulation for the stylised single-pest situation described in Chapter 2. The demographic parameters (growth rates, carrying capacity) will be left as placeholders, allowing future researchers to insert specific data. Success requires demonstrating that the MIL yields different prescriptions than the EIL in at least one plausible scenario, thereby proving the moral relevance of population dynamics.

  Failure would take two forms. First, theoretical failure: if it is demonstrated that welfare cannot be coherently aggregated across shifting cohorts, or if the uncertainty over sentience is too great to permit any action-guiding rule. Second, practical failure: if the resulting MIL is so complex that it cannot function as a 'threshold' rule for farmers. If the model requires real-time computational ecology beyond current capacity, the project will conclude that while the MIL is theoretically sound, it is practically inert.

  **5. Feasibility and Scope Assessment**
  Twelve thousand words over ten months is sufficient for this project, provided the scope remains tightly constrained. The greatest risk is the debate over insect sentience. A full meta-ethical defence of insect moral status would consume the entire word count. Therefore, this project will treat sentience as a probabilistic input rather than a conclusion to be proved. This is a methodological necessity, not a philosophical evasion.

  Similarly, the applicability of the non-identity problem to non-human animals is contentious. The dissertation will acknowledge this debate but proceed on the consequentialist grounds that the *outcome* (total welfare) matters regardless of identity. If this presupposition is rejected, the MIL collapses; the dissertation will explicitly flag this as a limiting condition.

  Finally, the mathematical modelling must remain illustrative. I will not produce new biological data but will use established demographic equations with placeholder variables. This ensures the focus remains on the ethical architecture rather than entomological novelty. If the interaction between demographic modelling and normative ethics proves too dense for the word limit, the discussion of 'uncertainty over sentience' will be the first element reduced, focusing instead on the structural conflict between static counting and dynamic populations. This ensures the core insight—that dynamics matter—is preserved even if the probabilistic nuances are trimmed.
