prompt: |-
  So some context: I fix bikes for a living and I've never taken a philosophy or logic class, but I've read Gödel, Escher, Bach about four times and I run a Wednesday night reading group out of our town library. Ten of us, two are programmers, the rest are just nosey like me. We finished the book last week and I've talked myself into setting everyone one written question to do at home and bring in, then we mark each other's answers anonymously using a scheme I supply. That's the bit I need you for.

  Act like you're a professional philosopher who has also taught first-year logic to non-specialists: you know what the incompleteness theorem actually says, not just the pop version, but you can put it in plain language without talking down to people. Spend a few sentences up front brainstorming what the real crux is here and what a smart-but-shallow answer would sound like, so I can tell whether you've actually got it. Then give me the three deliverables under headings.

  What I want the question to be about. Half my group came away thinking the book proves minds aren't machines, i.e. that a person can always see some truth that no program could ever see, so AI is basically doomed. There's a version of that argument floating around that I think goes back to a philosopher in the sixties and then got picked up by a physicist much later — describe it in your own words if you need it, don't name-drop papers nobody in my room will ever read. Anyway I'm pretty sure thats not what Hofstadter is doing, but I couldn't say why beyond a feeling in my gut, and that feeling isn't good enough to grade ten people's homework with.

  The part I find genuinely interesting is the transfer. How does a formula in a made-up system like the book's TNT end up being *about* itself at all, rather than that just being a cute pun? And then what would have to exist in a mind for the same trick to work there — and even if it does work, what does it actually buy you, as opposed to what people wish it bought you? I'd also love the question to make people notice that the record player which tears itself apart playing a record titled with a claim about that very player is the same *shape* of thing but a completely different kind of failure: broken hardware, not unprovable sentence. If someone can say why those two cases come apart, they've understood something.

  Hard requirements:
  - One essay question, doable in about 45 minutes by someone with no training, answerable in roughly 600 words.
  - It must not be answerable by reciting that Gödel showed maths is incomplete, and not by saying the words "strange loop" or "self-reference" with a confident tone.
  - A model answer of about 350 words.
  - A marking scheme out of 20 that names the specific moves an A answer makes and a B answer misses — things like what has to be assumed about the system being consistent, what "true but unprovable" is true and unprovable *relative to*, and where the person who claims to be seeing it from the outside has to be standing. Bullets or a little table for this, that's fine.
  - Three or four typical bad answers, with what they cost in marks and one line on why each one feels convincing to a beginner.

  No quotations from the book (I can't check them and neither can anyone else), no page numbers, no bibliography, no reading list, no suggested further anything.

  Hard limit: 800 words for your whole reply including the brainstorming. Tight, I know, but we're a library group and I have to photocopy it.
