answer: |-
  ### Desiderata for Objective Becoming in a Theory of Agency

  To support the argument that deliberation requires objective unsettledness, an account of becoming must satisfy constraints drawn from physics, metaphysics, and the theory of rational agency. The following list organizes these requirements, pruning redundancies and marking their source and negotiability.

  #### I. Physical Constraints
  **1. Lorentz-Invariant Consistency (or Explicit Violation)**
  *   **Motivation:** The relativistic deliberation case (spacelike separated launch decision) demands a verdict on settledness. If the account claims consistency with Special Relativity (SR), it cannot privilege a simultaneity hyperplane without physical justification. If it privileges one, it must explain why SR's empirical success is compatible with ontic privilege.
  *   **Source:** Physics.
  *   **Status:** Non-negotiable. An account contradicting established physics is empirically false; an account positing hidden privilege must justify the hiddenness.
  *   **Assessment:** This requirement forces a choice: accept a preferred foliation (breaking Lorentz invariance) or accept that "settledness" is not global.

  **2. Causal Accessibility (Implementability)**
  *   **Motivation:** Deliberation is a physical process. If the "openness" of the future is a feature of reality, the deliberating agent's cognitive states must be sensitive to it. If the structure of becoming is causally inert relative to the agent, it cannot ground the *normative* force of deliberation.
  *   **Source:** Agency/Physics.
  *   **Status:** Non-negotiable for this project. Metaphysical elegance is irrelevant if the structure cannot do the work of agency.
  *   **Assessment:** This is the **most exclusionary requirement**. It eliminates views where becoming is metaphysically real but physically undetectable (epiphenomenal becoming).

  #### II. Metaphysical Constraints
  **3. The Verbal-Dispute Test**
  *   **Motivation:** To avoid the charge that "becoming" is merely a psychological projection onto a block, the account must specify a truthmaker for becoming-statements that does not exist in a bare block world.
  *   **Source:** Metaphysics/Methodology.
  *   **Status:** Non-negotiable for robust realism. Without this, the dissertation collapses into a debate about word usage.
  *   **Assessment:** Block Universe + Indexical Becoming fails this by design (admitting no ontic difference). Presentism passes easily (less ontology). Growing Block struggles (the "edge" is often posited as undetectable to save SR).

  **4. Ontic Distinctness (Reality vs. Epistemology)**
  *   **Motivation:** Deliberation requires that the future is not *just* unknown, but *ontologically* indeterminate. Collapsing the real/knowable distinction reduces openness to ignorance.
  *   **Source:** Metaphysics/Agency.
  *   **Status:** Non-negotiable.
  *   **Assessment:** Rules out epistemic interpretations of probability or uncertainty as sufficient for deliberation.

  #### III. Structural Constraints (Theorems & Results)
  **5. Malament-Stein Compatibility**
  *   **Motivation:** Malament's theorem limits definable simultaneity to the standard relation relative to a worldline; Stein's theorem suggests invariant becoming relations in Minkowski spacetime are trivial (everything has become for everything) or universal.
  *   **Source:** Physics (Mathematical Structure).
  *   **Status:** Non-negotiable *if* Minkowski structure is fundamental.
  *   **Assessment:** This is a **Theorem-based constraint**. It implies that any non-trivial, objective becoming relation must either break Lorentz invariance (posits a preferred frame) or be local/path-dependent (rejecting global settledness).

  **6. Non-Collapse of Distinctions**
  *   **Motivation:** The account must distinguish frame-relative facts (simultaneity) from merely apparent facts (illusions). It must also distinguish reality as a monadic property from becoming as a relation.
  *   **Source:** Metaphysics.
  *   **Status:** Shibboleth. Realists demand this; deflationists deny the distinction is meaningful.
  *   **Assessment:** Necessary to maintain the "Objective" in Objective Becoming.

  #### IV. Overlooked Requirements
  **7. The Normative Grounding Constraint**
  *   **Motivation:** Deliberation involves *reasons* and *oughts*. Merely having an open future is descriptive; the account must explain how ontic openness translates to normative permission or obligation.
  *   **Source:** Agency.
  *   **Status:** Non-negotiable for a theory of *rational* agency.
  *   **Assessment:** Often overlooked. A metaphysics of time that allows contingency but not normativity fails to support deliberation.

  **8. The Local Determinacy Constraint**
  *   **Motivation:** Agents act locally. If the "settledness" of a distant event (the launch) depends on a global foliation inaccessible to the agent, the agent cannot deliberate about it *as* unsettled.
  *   **Source:** Agency/Physics.
  *   **Status:** Non-negotiable.
  *   **Assessment:** Forces becoming to be definable relative to the agent's light cone, not a global slice.

  ---

  ### Assessment of Impossibility Results

  There is a jointly unsatisfiable subset of requirements: **{Lorentz-Invariant Consistency, Objective Global Becoming, Implementability}**.

  *   **Nature of Conflict:** This is a **Theorem** (Stein-Clifton-Hogarth) resting on a **Physical Premise** (causal structure of Minkowski spacetime).
  *   **Analysis:** Stein's theorem demonstrates that any becoming relation definable from the causal structure of Minkowski spacetime that satisfies natural invariance conditions is trivial (the past light cone or the whole manifold). To have non-trivial *global* becoming, one must posit a preferred foliation (violating Lorentz Invariance). To maintain Lorentz Invariance, becoming must be local (light-cone relative). If becoming is local, a distant spacelike event is neither settled nor unsettled globally, but relative to the agent's position. However, if the account posits a preferred foliation to save Global Becoming, **Implementability** fails because SR prohibits agents from detecting that foliation without superluminal signaling.
  *   **Verdict:** You cannot have a becoming structure that is global, undetectable by physics, and yet causally efficacious for agency. One constraint must break.

  ### Most Exclusionary Requirement

  **Implementability** excludes the greatest number of candidates.
  Many metaphysical views (especially sophisticated Growing Block or "Moving Spotlight" views within SR) survive by rendering the becoming-structure causally inert to avoid contradicting physics. They posit a "metaphysical now" that physics cannot see. For your purpose (theory of agency), this is fatal. If the agent's brain cannot be sensitive to the "moving now," the "moving now" cannot ground the *feeling* or *logic* of deliberation. This requirement cuts off the "peace treaty" views that try to harmonize becoming with SR by making becoming epiphenomenal.

  Presentism surrenders Lorentz Invariance first, a principled sacrifice to secure ontic openness.
  Growing Block surrenders Implementability first, an ad hoc concession to maintain compatibility with relativity.
  Block Universe surrenders the Verbal-Dispute Test first, a principled rejection of objective becoming itself.
