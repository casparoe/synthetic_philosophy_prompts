answer: |-
  PARITY TRUST | STRATEGIC DIRECTORATE
  MEMORANDUM 94-C: ASSET LIQUIDITY AND VISUAL CONTINUITY
  TO: BOARD OF GOVERNORS
  FROM: STRATEGY & VALUATION COMMITTEE
  DATE: 14 OCTOBER 2024

  **1. Executive Summary**
  The Parity Trust proposes a decoupling of ownership from access. Current museum models rely on the scarcity of the original object to drive attendance and endowment. We argue that scarcity is a logistical burden, not an aesthetic necessity. If a facsimile is visually indistinguishable from the original to the naked eye under gallery conditions, the aesthetic experience is identical. Therefore, the premium attached to the original is purely sentimental. Sentiment is a liability; it is volatile, unquantifiable, and prone to moral hazard. We recommend selling original holdings to private capital and replacing them with certified facsimiles. The proceeds will endow the sector in perpetuity.

  **2. Case Study: The Vane Anomaly**
  Consider *The Grey Shore*, attributed to Elias Vane (1892). For eighty years, this work anchored the collection of the Harlowe Institute. Visitor engagement was high; critical acclaim was universal. In 2021, spectral analysis confirmed the work was a studio copy produced c. 1950. Did the visual experience change? No. Did the emotional impact diminish? Data suggests no significant drop in dwell time or sentiment scores. The value remained stable because the viewer engages with the image, not the canvas. The attribution was metadata; the art was the light. If the market tolerated a fifty-year delay in attribution without aesthetic loss, it will tolerate a permanent substitution provided the visual data remains intact.

  **3. Valuation of Provenance Post-Attribution**
  Once attribution ceases to determine aesthetic value, provenance must be reclassified. It is no longer a certificate of authenticity but a chain of custody for insurance purposes. Provenance becomes a luxury good separate from the visual asset. The private collector purchases the history (the original canvas, the letters, the dust); the public purchases the vision (the facsimile, the lighting, the access). We can price sentiment by auctioning the provenance separately from the image. The original becomes a relic; the facsimile becomes the utility.

  **4. The Stability Paradox**
  A potential objection arises: if the original holds no value beyond its visual output, neither does the facsimile. Both are merely pigment on substrate. If history is irrelevant, the facsimile is as hollow as the original. To resolve this, the Trust proposes that the facsimile derives value not from its history of production, but from its *guarantee of continuity*. The original is entropic; it decays. The facsimile is static. We shift the value proposition from "authenticity of origin" to "authenticity of condition." The art is no longer the object, but the Trust's warranty that the object will not change. This binds the viewer to the institution rather than the artist. We become the authors of the permanence.

  **5. Risk Register**

  | Risk | Probability | Mitigation |
  | :--- | :--- | :--- |
  | **Public Sentiment Shock** | High | Phased rollout. Begin with damaged works where the facsimile is an "improvement." Frame as conservation, not replacement. |
  | **Technical Discernibility** | Low | Use multi-spectral layering. Ensure craquelure is replicated to satisfy tactile expectations where barriers allow. |
  | **Market Saturation** | Medium | Limit facsimile certificates. Only one public display version allowed per asset class to maintain scarcity of access. |
  | **Ethical Pushback** | High | Emphasize the endowment. The public keeps the art; the sector survives. Frame originals as "capital reserves." |

  **6. Disposal and Recycling**
  The originals, once sold or removed from display, represent a surplus of raw material. Storing them incurs climate control costs without public benefit. To maximize efficiency and symbolize the transition from relic to utility, we recommend pulping the original canvases. The linen and wood panels can be processed into gesso grounds and stretcher bars for the next generation of facsimiles. This ensures that the physical matter of the masters supports the longevity of the images, creating a closed-loop economy where the original is literally consumed to sustain the copy.

  **7. Recommendation**
  Approve the liquidation of Tier 1 assets. Begin recycling immediately.
