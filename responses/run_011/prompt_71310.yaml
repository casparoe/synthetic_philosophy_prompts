          *   Polybius: Cycle of constitutions. Monarchy -> Tyranny -> Aristocracy... -> Democracy -> Ochlocracy -> Monarchy. This can happen *within* a continuous political culture (e.g., Rome going from Kings to Republic to Empire).
          *   Khaldun: Dynasty lasts 3 generations. Then a *new* group takes over.
          *   Conflict: Polybius allows the *same* people to cycle forms. Khaldun says the *group solidarity* of the people dies, requiring *new* people.
