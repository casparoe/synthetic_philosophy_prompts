      *   *Let's look closer at (1) vs (5).*
          *   (1): "That psychology hasn't changed."
          *   (5): "Explanation is real, prediction isn't."
          *   If psychology hasn't changed, and the mechanism is psychological, then the mechanism is active now. If $A \rightarrow B$ in the past, and $A$ is present now, and psychology is constant, then $B$ is likely. Denying prediction while asserting constant psychological causality is the strongest contradiction.

  5.  **Refining the Output Structure:**
