      *   *Tension D: Toynbee's Suicide (3) vs. Khaldun's Outside Renewal (2).*
          *   (3) accepts Toynbee's point that civilizations kill themselves.
          *   (2) says renewal *only* comes from outside (a harder group moving in).
          *   *Conflict:* If a civilization kills itself (Toynbee), does it need an outside group to replace it (Khaldun)? Or can it reform? Khaldun is stricter: the *state* structure requires new blood. Toynbee focuses on the *civilization* breaking down.
