          *   *Conflict:* If the psychological motor is constant (1), and solidarity always burns out (2), does the "ratchet" actually prevent the collapse, or just make the rubble higher? If the ratchet is strong enough to create "genuine direction," does it undermine the inevitability of the Khaldunian 3-generation burnout?
