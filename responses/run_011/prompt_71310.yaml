      *   *Tension 1 (Severe):* Universal Mechanisms (1 & 2) vs. Anti-Prediction (5). This is the "Humean Problem" applied to history. If causes are constant, effects should be predictable.
      *   *Tension 2 (Moderate):* Internal Rot (1) vs. External Renewal (2). Polybius says the state transforms; Khaldun says the state dies and is replaced.
      *   *Tension 3 (Moderate-Low):* Ratchet (4) vs. Constant Psychology (1). If tech/bureaucracy changes the floor, does it change the psychological vulnerability? User says "cycles on top," but if the floor is higher, does the fall kill you?

      *   *Single Revision:* It has to be (5). It's the methodological brake on the substantive engine of (1) and (2). Changing (5) to "Prediction of *timing* is impossible, prediction of *vulnerability* is real" aligns everything.

