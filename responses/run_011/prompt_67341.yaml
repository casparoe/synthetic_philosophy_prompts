answer: |-
  **The Screen**

  Before spending billable hours, the prosecutor must answer three questions. If any answer is definitively "No," the count is dead unless the Gross Injustice Override (Procedure Step 4) is invoked.

  1.  **Criminality at Time:** Was this conduct criminal under domestic law or international law applicable to the actor at the time of the act?
  2.  **Foreseeability:** Would a reasonable person in the actor's position, with their access to legal advice, have understood this conduct was prohibited?
  3.  **Perception Risk:** Given the Deputy Prosecutor's nationality and the frozen conflict status, does charging this count create an unacceptable appearance of victor's justice or asymmetry?

  If Question 1 is "No," stop. If Question 2 is "No," stop. If Question 3 is "No," proceed to Procedure but flag for Senior Review. This screen filters out clear *nullum crimen* violations and political liabilities before legal analysis begins.

  **The Procedure**

  This procedure operationalizes Draft Article 11. It distinguishes between labeling an old crime with a new name (permissible) and criminalizing previously innocent conduct (forbidden). Domestic prosecutors must complete this within two hours.

  1.  **Apply Article 11:** Compare the law at the time of conduct versus the law at charging.
      *   *Pass Condition:* The conduct was criminal under *either* regime. If criminal only under the new regime, you must prove it was already criminal under customary international law or domestic law at the time.
      *   *Stop:* If the conduct was lawful under all applicable regimes at the time, proceed immediately to Step 4 (Gross Injustice). Otherwise, continue.

  2.  **Verify Source Law:** Identify the specific rule prohibiting the conduct at the time.
      *   *Pass Condition:* You can cite a treaty ratified by the state, a domestic statute, or a clear rule of customary international law existing at the time.
      *   *Stop:* If the only source is a draft treaty or academic proposal from the time, the count fails. Customary law must be evidenced by state practice and *opinio juris*, not just NGO statements.

  3.  **The "New Name" Test:** Determine if you are charging a new crime or renaming an old one.
      *   *Pass Condition:* The core wrongful act (e.g., killing civilians, destroying property) was criminal then, even if the specific label (e.g., "ecocide" vs. "environmental war crime") is new.
      *   *Stop:* If the *act itself* was not criminal (e.g., launching a war was not defined as a crime for this actor), you cannot save it by applying a new label. This is the Nuremberg line: aggressive war was criminalized because it violated existing treaties, not because the tribunal invented morality.

  4.  **Gross Injustice Override (Radbruch Formula):** Use only if Step 1 failed because the act was lawful under domestic law at the time.
      *   *Test:* Was the law so fundamentally contrary to justice that compliance was morally impossible?
      *   *Sign-off:* Requires written approval from the **President of the Chamber**.
      *   *Frequency:* Use rarely (target: zero). This is a safety valve, not a charging tool. It invites severe legitimacy challenges.

  5.  **Symmetry & Staffing Check:** Assess the impact of the Deputy Prosecutor's nationality.
      *   *Test:* Does this count implicate the arming state's conduct? If yes, can you charge the equivalent conduct by the opposing side?
      *   *Sign-off:* If asymmetry is unavoidable, requires consultation with the **Full Bench**.
      *   *Action:* If you cannot charge the other side due to jurisdictional limits (e.g., self-defense immunity), drop the count to preserve chamber legitimacy.

  6.  **Final Wording:** Draft the count to reflect the law at the time of conduct, using current labels only as shorthand.
      *   *Requirement:* The count must explicitly reference the legal basis existing at the time of the act to blunt ex post facto motions.

  **Three Counts, Run**

  **Count 1: The Dam and River (Ecocide)**
  *   **Verdict:** **No** on "Ecocide"; **Yes** on "Environmental War Crime."
  *   **Analysis:** There is no standalone crime of "ecocide" in customary law at the time of conduct. Charging it fails Step 2 (Source Law). However, destroying the environment was criminal under existing war crimes provisions if wanton and not justified by military necessity. This passes Step 3 (New Name Test): the act was criminal, the label is just updated.
  *   **Wording:** "The Accused, during armed conflict, intentionally launched an attack knowing it would cause widespread, long-term, and severe damage to the natural environment, clearly excessive to the concrete and direct military advantage anticipated, contrary to the law of armed conflict applicable at the time."
  *   **Reasoning:** This blunts the ex post facto motion by anchoring the charge in established war crimes law, not a new normative creation.

  **Count 2: The Invasion (Aggression)**
  *   **Verdict:** **No.**
  *   **Analysis:** Fails Step 1 and Step 5. First, the chamber was established after the invasion. Unless the state consented retroactively or the UN Security Council referred the situation, jurisdiction over aggression is highly contested (live dispute). Second, Step 5 (Symmetry) fails. One side claims self-defense. Charging only the invading leadership looks like victor's justice, exacerbated by the Deputy's nationality.
  *   **Reasoning:** Even if aggression was criminal under custom, the jurisdictional hurdle for a hybrid court created post-facto is too high. This invites a successful motion to dismiss. Drop this count to protect the chamber's viability for other crimes.

  **Count 3: Sexual Violence (Command Responsibility)**
  *   **Verdict:** **Yes**, with specific wording.
  *   **Analysis:** Passes Step 1 (sexual violence was criminal). The dispute is whether command responsibility applied to sexual violence specifically at that time (live dispute in jurisprudence). It passes Step 3 if we argue the underlying crimes were known, and the commander's duty to control troops was established.
  *   **Wording:** "The Accused, as a superior, knew or should have known that subordinates were committing acts of sexual violence and failed to take necessary and reasonable measures to prevent or punish such acts, pursuant to the command responsibility principles applicable at the time."
  *   **Reasoning:** Using "knew or should have known" anchors it to the standard at the time. Avoiding the label "ecocide" or "aggression" avoids the ex post facto trap. The count survives because the core duty (control troops) existed, even if the specific application to sexual violence was evolving.

  **Where This Procedure Lies to You**

  This procedure presents legal tests as mechanical switches, but several steps require subjective judgment disguised as law. Step 2 (Verify Source Law) asks prosecutors to determine "customary international law." This is not a binary fact; it is a contested argument where reasonable lawyers disagree on whether state practice was sufficient at the time. A domestic prosecutor will struggle to distinguish between a emerging norm and settled law.

  Step 4 (Gross Injustice) is purely moral, not legal. There is no objective metric for when a domestic law is "so fundamentally contrary to justice." Invoking it turns the prosecutor into a philosopher, not a lawyer, and guarantees a legitimacy battle.

  Step 5 (Symmetry) is political risk assessment, not jurisprudence. The procedure treats it as a legal hurdle, but it is actually public relations. A count can be legally sound but politically fatal. The procedure cannot tell you when the political cost outweighs the legal right; it only flags the risk. Finally, Article 11's interpretation here is my reconstruction. No court has definitively ruled on this specific "dual criminality" hybrid clause. You are testing a theory, not applying settled precedent.

  **Settled vs Contested**

  **Settled Practice:** The core principle of *nullum crimen sine lege* (no crime without law) is settled. You cannot punish conduct that was lawful when done. The requirement for "foreseeability" and "accessibility" of the law to the accused is standard human rights jurisprudence. The preference for treaty law over vague custom when establishing criminality is also standard practice in international tribunals to ensure clarity.

  **Contested/Reconstructed:** Whether customary international law alone can create a new crime without a treaty is a live dispute; some scholars say yes, others say no. The jurisdiction of a hybrid court over aggression without explicit UN Security Council referral is highly contested; many argue state consent is required. The scope of command responsibility for sexual violence prior to the late 1990s is not universally settled; defense counsel will argue it was not foreseeable to battalion commanders. My procedure treats these as solvable tests, but in reality, they are open legal arguments. The "Gross Injustice" override is based on German post-war jurisprudence (Radbruch), not established international criminal procedure. I have reconstructed this as a safety valve, but it is not standard operating procedure in modern tribunals. You are defending a hybrid model, not applying a code.
