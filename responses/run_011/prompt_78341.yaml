      *Re-counting Reconstruction:*
      "Mill argues social science begins with observed patterns, called empirical laws. These are mere facts; we do not know their causes. Because causes might change, these patterns are unreliable outside specific times and places. To become scientific, they must become derivative laws, derived from the laws of human nature. We can deduce these directly or use the inverse historical method: start with historical sequences and verify which laws of human nature would produce them. This assumes history is a causal chain where each state produces the next. Since we cannot experiment on societies, and single causes yield only approximate truths, we must verify complex causal combinations against historical records. Local patterns must ultimately be shown as consequences of general human nature or dismissed as coincidences. The goal is prediction and practical guidance, which empirical laws cannot support alone. The inverse method treats history as a verification tool for psychological laws, ensuring that social generalizations rest on firm causal foundations rather than accidental uniformities."
