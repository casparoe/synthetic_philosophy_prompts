answer: |-
  Dear Friend,

  It is wonderful to hear from you, and I appreciate you sharing your brother's writing with me. It is always engaging when family members delve into deep philosophical and theological questions, and it is clear that your brother has put serious thought into this paragraph. Since you asked for an analysis from the perspective of set theory and the philosophy of mathematics, I will walk through his claims carefully. My goal is to help you distinguish between standard mathematical facts, philosophical interpretations that are debated, and claims that are generally rejected by experts in these fields. This should help you navigate a conversation with him without getting bogged down in technicalities while still maintaining accuracy.

  The first sentence makes two claims about Georg Cantor, the founder of set theory. The first part, that Cantor proved some infinities are larger than others, is entirely correct and is a cornerstone of modern mathematics. Cantor showed that the infinity of real numbers is strictly larger than the infinity of natural numbers, a result known as Cantor's theorem. However, the second part of that sentence is where a set theorist would raise a significant objection. Your brother writes that Cantor showed no collection can be infinite in the sense of being a completed whole. This is actually the opposite of Cantor's primary achievement. Cantor argued vigorously for the legitimacy of the actual infinite, meaning infinite sets that are treated as completed totalities within mathematics. He distinguished between the transfinite, which are completed infinite sets like the set of all natural numbers, and the Absolute Infinite, which corresponds to the collection of all sets and leads to contradictions. While it is true that a completed totality of everything results in paradoxes like Cantor's Paradox or Russell's Paradox, this does not invalidate all completed infinite collections. Standard Zermelo-Fraenkel set theory, which is the foundation of most modern mathematics, treats infinite sets as completed wholes without contradiction. So, while the restriction on the set of all sets is accurate, generalizing this to rule out all completed infinite wholes is a misrepresentation of Cantor's work and modern set theory.

  Moving to the second sentence regarding Hilbert's Hotel, your brother describes the thought experiment accurately. It is indeed a scenario where a fully occupied hotel with infinitely many rooms can accommodate new guests by shifting current guests to different rooms. Where the claim becomes contentious is the assertion that this would be an absurdity if it described a real building. David Hilbert originally used this example to argue that the actual infinite is counterintuitive and perhaps metaphysically impossible, but most contemporary mathematicians and many philosophers do not see the behavior of the hotel as a logical absurdity, but rather as a correct description of how infinite cardinalities work. The properties of infinite sets are different from finite sets, and while this difference is surprising, surprise is not the same as contradiction. A philosopher of mathematics would say that Hilbert's Hotel illustrates the non-intuitive nature of infinity, but it does not prove that such a structure is metaphysically impossible. To claim it is an absurdity in reality is a philosophical stance, not a mathematical proof, and it is a stance that many philosophers of time and space reject.

  This leads directly to the third sentence, which concludes that the actual infinite is a useful fiction inside mathematics and cannot exist in the physical world. A set theorist would strongly disagree with the characterization of infinite sets as mere fictions. In the context of mathematics, they are treated as real objects of study with definite properties, and most mathematicians operate as realists about these structures. Whether they can exist in the physical world is a question for physics and metaphysics, not mathematics itself. There are physical theories, such as certain models in cosmology or quantum field theory, that utilize infinite structures without necessarily collapsing into contradiction. To state dogmatically that the actual infinite cannot exist in the physical world is to take a side in a live philosophical debate, specifically the debate surrounding the Kalam Cosmological Argument. While your brother presents this as a settled conclusion derived from the previous sentences, it is actually a major premise that requires independent justification. Many philosophers argue that if mathematics describes reality, and mathematics requires actual infinities, then there is no principled reason to ban them from physical ontology solely based on counterintuitive consequences like Hilbert's Hotel.

  The final sentence applies these ideas to the past, arguing that an infinite past is impossible because it would be a collection completed by successive addition, and one cannot count to infinity. This is perhaps the most philosophically contested part of the paragraph. The argument here relies on the intuition that you cannot form an actual infinite by starting at a point and adding one member after another. However, an infinite past does not imply starting at a point and counting up to the present; it implies that for any past event, there is a prior event, without a beginning. Philosophers like J. L. Mackie or Graham Oppy have pointed out that traversing an infinite past is not analogous to counting to infinity from zero. It is more analogous to counting down from infinity, or simply having an infinite series that extends backwards without a first member. The claim that one can never finish counting to infinity is true if you start at zero, but it does not logically follow that an infinite series cannot exist without a starting point. Consequently, the conclusion that the past cannot be infinite does not follow strictly from the mathematical truths mentioned earlier. It relies on a specific interpretation of time and causation that is not universally accepted even among theists, let alone mathematicians.

  In summary, if you discuss this with your brother, you might concede that Hilbert's Hotel shows that infinity behaves differently than finite numbers, and that the set of all sets is problematic. However, you should feel confident pointing out that Cantor actually defended the reality of completed infinite sets, that the impossibility of the actual infinite in the physical world is a philosophical hypothesis rather than a mathematical theorem, and that the argument about successive addition conflates having a beginning with having an infinite duration. His paragraph mixes mathematical facts with metaphysical assumptions and presents the latter as if they are consequences of the former. It is standard material in certain apologetic circles, particularly those influenced by William Lane Craig, but it is not standard material in mathematics or the broader philosophy of religion. You can respect his intellectual effort while gently noting that experts in set theory and philosophy of time would find several of these steps to be much more debatable than the paragraph suggests. I hope this helps you have a fruitful conversation with him.

  Warmly,

  Your Friend
