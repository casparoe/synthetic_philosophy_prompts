answer: |-
  Here is the spec for an adequate account of representation in neural networks, tailored to your goal of making literally true, predictive claims about model internals.

  ### The Spec: Requirements for an Account of Representation

  **1. The Decodability Baseline**
  *   **Requirement:** The putative representation must be linearly (or simply) decodable from the activation state with accuracy significantly above chance.
  *   **Consideration:** This is your starting point. If a probe cannot extract the information, there is no candidate for a representation. However, as you found, this is necessary but not sufficient. It rules out magic, but not epiphenomena.

  **2. Causal Non-Redundancy (The "Friend" Constraint)**
  *   **Requirement:** Intervening on the putative representation (e.g., zeroing the direction, ablation, orthogonalization) must degrade performance on the relevant task, *unless* there is a specified redundant backup mechanism.
  *   **Consideration:** This addresses your negation case. If you remove the "negation direction" and accuracy stays at 99%, the network did not *use* that representation to solve the task. It was a shadow cast by the computation, not a gear in the machine. An account that calls this a "representation" fails to distinguish between *causes* of behavior and *correlates* of behavior.

  **3. Downstream Consumption**
  *   **Requirement:** It must be possible to identify a specific downstream mechanism (e.g., an attention head or MLP neuron) that *reads* the direction and changes its output based on the value of that direction.
  *   **Consideration:** Causal non-redundancy (Req 2) shows the direction matters for the *output*, but this requirement shows *how* it matters. In your negation case, the info is in Layer 3, but Layer 4 likely ignores it, waiting for Layer 5 to solve the task. A representation must be an input to a subsequent computation, not just a dead end in the residual stream.

  **4. Counterfactual Stability (The "French" Distinction)**
  *   **Requirement:** The content of the representation must remain stable across counterfactual changes to the input that preserve the semantic content, but vary the surface form.
  *   **Consideration:** This distinguishes your Negation case from your French case.
      *   **Negation:** If you change the sentence structure but keep the negation, does the direction still track it? If yes, it's robust. If no, it's a brittle heuristic.
      *   **French:** Your French model never saw non-French. The "French direction" is constant. It cannot be causally tested by variance *within* the model's operation. However, an adequate account must explain why "French-ness" feels intrinsic to the model's weights (it constrains the embedding space) whereas the Negation direction felt accidental (a correlate the model ignored). The account must distinguish between *structural constraints* (French) and *unused correlates* (Negation).

  **5. Content Determinacy**
  *   **Requirement:** The account must specify a fact of the matter about *what* is represented that does not depend entirely on the choice of probe.
  *   **Consideration:** If I train a probe for "negation" and one for "contains the letter 'n'", they might align. Which one is the representation? If the account says "whichever probe you trained," then representations are observer-relative (instrumentalism). You want them to be literally true (realism). The account must explain why the network represents *negation* rather than *letter 'n'*, even if both are decodable.

  **6. The Linear Subspace Hypothesis (Empirical, not Definitional)**
  *   **Requirement:** The account must not assume features *are* directions. It must treat "features as directions" as a claim that can be falsified.
  *   **Consideration:** You noted people assert this as a definition. It is not. It is a claim about the geometry of the solution space. An adequate account must allow for the possibility that features are distributed, non-linear, or basis-dependent. If your theory *defines* features as directions, you cannot discover that the model uses a different coding scheme.

  ---

  ### Non-Negotiable vs. Contestable

  **Non-Negotiable (Must be met for *any* causal/predictive account):**
  *   **Decodability Baseline:** You can't predict with information that isn't there.
  *   **Causal Non-Redundancy:** If you want to predict that *changing* the representation changes the behavior, the representation must be causally efficacious. If it's redundant, your prediction fails.
  *   **Math Consistency:** The account cannot contradict the forward pass equations.

  **Contestable (Philosophical/Methodological Camps):**
  *   **Content Determinacy:** This is the biggest battleground. Causal theories say content is fixed by what the node *does*. Teleological theories say content is fixed by what the node was *trained to do*. Structural theories say content is fixed by *similarity* to the world. You can build a predictive engine without solving this, but you can't make "literally true" claims about *meaning* without picking a side.
  *   **Linearity:** Whether features *must* be linear directions is an empirical bet. Many interpretability researchers assume it; others argue for sparse or non-linear features.
  *   **Granularity:** Does a single neuron represent a feature, or does a subspace? This is unresolved.

  ---

  ### The Structural Conflict (Where the Debate is Stuck)

  There is a subset of requirements that creates a tension, potentially making a perfect account impossible without trade-offs. This is the conflict between **Content Determinacy** (Req 5) and **Causal Role**.

  *   **The Conflict:** If you define representation strictly by **Causal Role** (what the activation *does* to the output), then the representation is context-dependent. If you change the downstream head (fine-tuning), the causal role changes, so the representation *changes*.
  *   **The Problem:** But you want to say "Layer 3 represents Negation" as a stable fact about the model, even if you haven't finalized the head yet. You want the representation to be **Intrinsic** to the activations.
  *   **The Incompatibility:** You cannot simultaneously hold that:
      1.  Representations are defined entirely by their causal downstream effects (Causal Theory).
      2.  Representations are stable properties of the activations independent of the specific downstream head (Intrinsic/Structural Theory).
  *   **Why it matters for you:** If you want to claim "This model represents the user's goal as X" and have it be *literally true*, you need (2). But if you want that claim to *license a prediction about what the model will do next*, you need (1). If the model is fine-tuned, (1) says the representation changed, (2) says it stayed the same. One of these intuitions must break.

  This is why the debate is stuck. We want representations to be both *causal engines* (for prediction) and *stable symbols* (for description). In neural networks, these come apart.

  ---

  ### The Knockout Requirement

  **Causal Non-Redundancy (Req 2)** knocks out the most candidate accounts.

  Most "interpretability" papers stop at Decodability (Req 1). They show a probe works and claim the model "understands" the concept. This requirement immediately invalidates any claim where the information is present but epiphenomenal (like your negation direction). It forces you to do interventions. It kills the "bag of features" view where every decodable direction is a feature. It demands you prove the feature is *used*.

  ---

  ### Adjusting for Your Purpose

  You stated your purpose: **"A claim like 'this model represents the user's goal as X' could be literally true and could license a prediction about what the model will do next."**

  This specific purpose tightens the spec:
  1.  **Drop Content Determinacy as a hard constraint:** If your goal is *prediction*, you don't need to solve the philosophical problem of what the representation is *about* (Negation vs. Letter 'n'). You only need to know that *this vector* causes *that behavior*. You can treat the "content" as a label for the causal role.
  2.  **Elevate Causal Non-Redundancy to Absolute:** For the claim to license a prediction ("If I change X, Y happens"), the causal link must be proven. If the representation is redundant, your prediction that "changing the representation changes the goal" will fail.
  3.  **Require Counterfactual Stability:** To predict behavior on *new* inputs (generalization), the representation must track the concept across variations, not just memorize the training set.

  **Verdict:** For your purpose, you can afford to be instrumentalist about *meaning* (what it's about), but you must be realist about *causality* (what it does).

  ---

  ### Confidence and Uncertainty

  **Confidence:** I am **85% confident** in this specification as a functional framework for mechanistic interpretability research. It aligns with the current frontier of causal mediation analysis and representational geometry without getting bogged down in pure philosophy.

  **Least Sure Point:** I am least sure about **Content Determinacy (Req 5)**. There is a non-zero chance that "what a network represents" is *fundamentally indeterminate* until the moment of interaction with an environment or a specific loss function. If this is true, then demanding an account that fixes content independently of context is asking for something that doesn't exist. If that's the case, your goal of making "literally true" claims about *goals* might need to be downgraded to "literally true claims about *dispositions to behave*."
