              *   Moral conflict: Truth/Resolution vs. Unfairness (snitches walk, named suffer).
      *   **Constraints:** No fence-sitting ("it depends"). Must give a definitive recommendation.

  2.  **Deconstruct the Ethical Landscape (Brainstorming):**
      *   *Utilitarianism (Consequentialism):* What produces the best outcome for the greatest number?
          *   Pros of snitching: Ends the scandal, clears the air, user avoids suspension.
          *   Cons of snitching: Best friend gets suspended (life-altering?), reinforces a "snitch culture," VP might break promise again (based on precedent).
          *   Net utility: If the friend gets suspended, that's a huge negative. If the user gets suspended, that's a negative. If the system is already fixed, does exposing names matter?
      *   *Deontology (Duty/Rules):* What are the duties involved?
          *   Duty to honesty/truth?
          *   Duty to loyalty (friendship)?
          *   Duty to fairness (the deal seems coercive/unjust)?
          *   Duty to self-preservation?
          *   Kantian view: Can I universalize "break promises to protect friends" or "break rules to save yourself"?
      *   *Virtue Ethics:* What would a virtuous person do?
          *   Courage? Integrity? Loyalty? Justice?
          *   Is snitching courageous or cowardly? Is staying silent loyal or complicit?
      *   *Political/Justice Theory:*
          *   The deal is a "Prisoner's Dilemma" setup by authority.
          *   The VP has a credibility problem (previous snitch got suspended).
          *   The main organizer is immune (class/wealth privilege via lawyer).
          *   The punishment (suspension) might be disproportionate to the crime (forwarding a key).

  3.  **Evaluate the Specific Facts:**
      *   *Fact 1: The VP's Credibility.* A guy already snitched and got suspended. This is the biggest red flag. The contract is void *ab initio* based on past performance.
      *   *Fact 2: The Systemic Fix.* The exams are stored differently now. The *harm* (future cheating) is mitigated. The value of the "truth" is diminished. It's retrospective punishment, not prospective safety.
      *   *Fact 3: The Main Organizer.* He walks. The deal punishes the foot soldiers and protects the general (via lawyer). This makes the deal unjust.
      *   *Fact 4: User's Involvement.* Forwarded twice. Minor accomplice.
      *   *Fact 5: Best Friend.* Main participant. Naming them ruins them.

  4.  **Formulate the Verdict:**
      *   *Initial thought:* Don't snitch. Loyalty + VP is untrustworthy.
      *   *Counter-thought:* But if I don't snitch, and someone else does, I get suspended and my friend *still* gets suspended.
      *   *Refinement:* The precedent of the VP breaking the promise is the dealbreaker. If the contract isn't enforceable, entering it is irrational and morally hazardous.
      *   *Verdict:* **Do not take the deal.** (Silence/Refusal).

  5.  **Develop the Argument (The "Professor" Persona):**
