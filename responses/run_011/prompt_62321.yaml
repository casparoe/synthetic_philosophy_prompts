answer: |-
  You are right to feel like you watched a shell game. The "pea" is the definition of *nothing*. Your roommate is sliding between a definition of "nothing" that is robust enough to demand a Creator, and a definition of "nothing" that is specific enough to dodge quantum mechanics.

  *Ex nihilo nihil fit* (ENN) is not a single proposition. It is a slogan that covers at least four distinct metaphysical claims. Below is the unpacking you asked for, sorted from the most defensible platitude to the most contentious metaphysical bet.

  ### The Four Readings of *Ex Nihilo Nihil Fit*

  #### 1. The Material Conservation Reading
  *   **Nothing:** No material substrate (no atoms, no energy).
  *   **Comes from:** Material causation (being made *out of* stuff).
  *   **Scope:** Inside the universe (physical systems).
  *   **Claim:** You cannot construct an object without pre-existing material to construct it from.
  *   **Status:** **Empirical Generalization.** (True within classical physics; complicated by $E=mc^2$ but generally holds as Conservation of Energy).
  *   **Truth Value:** **True** (as a description of closed physical systems).
  *   **Who leans here:** **Pop-science atheists** (e.g., Lawrence Krauss). They argue the universe came from "nothing" (a quantum vacuum) because they are using *this* definition of nothing (no matter), not absolute non-being.

  #### 2. The Causal Regularity Reading
  *   **Nothing:** No prior physical state or event.
  *   **Comes from:** Efficient causation (one event triggering another).
  *   **Scope:** Inside the universe (events in time).
  *   **Claim:** Events do not pop into existence without a prior physical trigger.
  *   **Status:** **Empirical Generalization / Low-level Metaphysical Bet.**
  *   **Truth Value:** **Contested.** Quantum mechanics (specifically indeterministic interpretations of decay or vacuum fluctuations) suggests events can occur without a *deterministic* prior physical cause.
  *   **Who leans here:** **Your Roommate (defensively).** When you brought up quantum fluctuations, he retreated to this reading but claimed the vacuum counts as a "prior physical state," thus preserving the rule.

  #### 3. The Absolute Ontological Reading
  *   **Nothing:** Absolute non-being (no God, no space, no time, no laws, no potentiality).
  *   **Comes from:** Ontological dependence (bringing into being).
  *   **Scope:** The universe as a whole (absolute beginning).
  *   **Claim:** Absolute non-being has no causal powers; it cannot produce being.
  *   **Status:** **Big Metaphysical Bet / Near-Analytic.** (It is analytic if "nothing" literally means "no thing with powers," but synthetic if it claims reality *must* obey this).
  *   **Truth Value:** **Unfalsifiable.** If "nothing" is defined as "that which has no properties," it trivially has no causal powers. But whether reality *allows* a transition from this state to a state of "something" is unknown.
  *   **Who leans here:** **The Kalam Apologist.** This is the only version that actually supports the premise "Whatever begins to exist has a cause" when applied to the universe itself.

  #### 4. The Explanatory Reading (PSR)
  *   **Nothing:** No explanation or reason.
  *   **Comes from:** Rational grounding (why it is so).
  *   **Scope:** The universe as a whole (contingency).
  *   **Claim:** There are no brute facts; every positive fact must have an explanation.
  *   **Status:** **Big Metaphysical Bet.** (The Principle of Sufficient Reason).
  *   **Truth Value:** **Highly Contested.** Many philosophers (Hume, Russell) reject this. They argue the universe might just *be* a brute fact.
  *   **Who leans here:** **The Leibnizian Apologist.** This is required for the Contingency Argument, which seeks an *explanation*, not just a temporal cause.

  ---

  ### Analysis of the "Shell Game"

  #### 1. Which reading does he actually need?
  For the **Kalam**, he needs **Reading 3 (Absolute Ontological)**. If the universe began to exist, there was a state of affairs where the universe was not. If that state was "absolute nothing," ENN says it can't become "something" without a cause.
  For the **Leibniz Argument**, he needs **Reading 4 (Explanatory)**. He isn't just looking for a push; he is looking for a *reason* why there is something rather than nothing.

  #### 2. Does the "vacuum isn't nothing" move rescue him?
  It rescues **Reading 2**, but it undermines **Reading 3**.
  *   **The Rescue:** By saying the quantum vacuum is "something" (a field with energy and laws), he protects the Causal Regularity Reading from scientific counterexamples.
  *   **The Trap:** If he defines "nothing" so strictly that the quantum vacuum doesn't count, he makes ENN **unfalsifiable**. If every time we see something appear without a clear cause we just redefine the background as "something," the principle becomes a tautology: "Things don't come from nothing, because if they came from it, it wouldn't be nothing."
  *   **The Cost:** If the quantum vacuum is "something," then the Kalam argument cannot assume the universe came from "nothing" in the absolute sense. It might have come from a prior physical state (the vacuum). To get back to Reading 3, he has to argue the vacuum *itself* began to exist, pushing the regress back.

  #### 3. Explanations vs. Causes
  The slogan does **not** do the work for the Leibniz argument without extra baggage. ENN is historically a causal principle (about *making*), not an explanatory one (about *reasoning*).
  *   **Kalam:** Needs a cause (an agent or event). ENN fits well here *if* time exists.
  *   **Leibniz:** Needs a ground of being. ENN supports this only if you assume that "existence itself" requires a cause/reason, not just "changes in existence." Your roommate is using the same slogan for two different jobs. It fits the Kalam (causes) better than the Leibniz (reasons), unless he smuggles in the Principle of Sufficient Reason.

  #### 4. The Problem of Time (The "Earlier Nothing")
  This is the strongest philosophical objection to using ENN for the beginning of the universe.
  *   **Causation implies time:** Standard causation involves $A$ happening *before* $B$.
  *   **The Beginning:** If time begins *with* the universe (as General Relativity suggests), there is no "before."
  *   **The Conflict:** ENN implies a transition *from* nothing *to* something. If there is no time, there is no transition. There is no moment where "nothing" existed, waiting to be filled.
  *   **Result:** ENN cannot apply to the origin of time in a temporal sense. It must be reinterpreted as "ontological dependence" (the universe depends on God *at* every moment, not just *at* the first moment). Your roommate's slogan doesn't capture this nuance; it sounds temporal ("comes from"), which misleads the argument.

  ---

  ### Historical Context: The Parmenidean Reversal

  Your memory is correct. **The maxim was originally an argument *against* creation.**

  *   **Parmenides (5th Century BCE):** Argued that "Being is, and Non-being is not." Since nothing cannot produce something, something must have always existed. Therefore, generation and destruction are illusions. Matter is eternal.
  *   **Lucretius (Roman Epicurean):** Used *ex nihilo nihil fit* to argue against divine creation. If gods created the world, what did they make it out of? If nothing, it's impossible. Therefore, matter is uncreated.
  *   **The Theistic Flip:** Early Christian apologists (like Augustine) and later Islamic theologians (Al-Ghazali) flipped the maxim. They agreed nothing comes from nothing *naturally*, but argued God is not "nothing." God is the "something" that allows the transition.
  *   **Impact on Value:** This history shows the maxim is not inherently theistic. It is a neutral metaphysical intuition. Its value as a premise depends entirely on whether you accept that "absolute nothing" is a coherent state that ever obtained. The ancients used it to say, "Since nothing comes from nothing, the stuff here must be eternal." Theists use it to say, "Since nothing comes from nothing, the stuff here must have an external cause."

  ### Pop-Science Equivocation

  Yes, the "universe from nothing" crowd (Krauss, Hawking, etc.) is using **Reading 1**.
  *   **They mean:** "No matter, no space, no time" (often just 'no matter/energy').
  *   **Theists mean:** "No being, no potentiality, no laws."
  *   **The Verdict:** It is largely verbal. When Krauss says the universe came from "nothing," he means a quantum vacuum governed by laws of physics. When the apologist says the universe can't come from "nothing," they mean absolute non-being. They are talking past each other. The apologist wins the semantic point (a vacuum isn't absolute nothing), but the physicist wins the scientific point (you don't need a *person* to get a universe from a vacuum).

  ### Summary List: From Platitude to Contention

  | Reading | Definition of "Nothing" | Scope | Status | Truth? | Who Leans Here? |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Material Conservation** | No matter/energy | Intra-universe | Empirical Law | True | **Pop-Science Atheists** (Claim universe came from "this" nothing) |
  | **2. Causal Regularity** | No prior physical state | Intra-universe | Empirical/Metaphysical | Contested (QM) | **Roommate** (Uses "vacuum is something" to defend this) |
  | **3. Absolute Ontological** | Absolute non-being | Universe-as-a-whole | Metaphysical Bet | Unfalsifiable | **Kalam Apologist** (Needs this for "First Cause") |
  | **4. Explanatory (PSR)** | No reason/explanation | Universe-as-a-whole | Metaphysical Bet | Highly Contested | **Leibnizian Apologist** (Needs this for "Sufficient Reason") |

  ### The Verdict on Your Roommate
  He is using **Reading 3** to demand a Creator, but defending it with **Reading 2** (by claiming the vacuum is "something").
  *   If he sticks with **Reading 3**, he is safe from quantum objections, but he is making a massive metaphysical claim that is hard to justify without circularity.
  *   If he relies on **Reading 2**, he is vulnerable to physics, so he redefines the vacuum as "something."
  *   **The Shell Game:** By defining "nothing" so strictly that the vacuum doesn't count, he ensures ENN is true, but he makes it harder to prove the universe *ever was* in that state of "nothing." If the vacuum is "something," maybe the universe just came from the vacuum, and the vacuum is eternal. To stop that, he has to prove the vacuum *also* began to exist, which requires a whole new argument.

  The slogan *ex nihilo nihil fit* is a powerful intuition pump, but without specifying *which* nothing and *which* coming-from, it is philosophically inert. Your intuition that it was being used to close a deal it hadn't earned was correct.
