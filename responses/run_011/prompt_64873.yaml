answer: |-
  # Q&A Prep Sheet: The Heterogeneity of Pleasure

  **Strategy Note:** You are the ethicist in a room of scientists. Do not defend empirical claims. Defend conceptual distinctions. Your goal is to show that their *models* work for prediction, but your *account* works for normativity.

  ### Part 1: Opening Concessions (First 5 Minutes)
  *Defuse the two biggest threats before they become objections.*

  1.  **To the Psychologists:** Explicitly concede that valence/arousal models have high **predictive validity**. Say: *"I am not arguing that valence ratings don't correlate with behavior or neural activity. They do. My claim is that statistical correlation does not prove phenomenological unity. You can measure a 'family resemblance' cluster without assuming a single underlying substance."*
  2.  **To the Philosophers of Psychology:** Concede that first-person reports are **descriptively fallible**. Say: *"I am not claiming subjects are infallible reporters of causal mechanisms or future consequences. I am claiming they have authority on the normative presentation of the episode *while it is happening*. Confabulation is possible, but the 'felt worth' is still the locus of the value."*

  ---

  ### Part 2: The Objections (Ordered by Likelihood $\times$ Damage)

  #### 1. The Construct Validity Attack (Psychologists)
  **Phrasing:** "You're treating valence as a folk concept, but in our data, valence loads as a robust factor across diverse stimuli. If 'pleasantness' were truly disjunctive, we wouldn't see the consistent covariance you see in self-report and physiological measures. Aren't you just denying the construct validity of the last 30 years of affective science?"
  **Reply (2 min):** "I'm distinguishing ontological unity from statistical clustering. Height and weight correlate, but they aren't the same dimension. Similarly, diverse pleasures might co-vary because they all engage approach systems, not because they share a 'pleasure atom.' Your models capture the functional output; my account captures the phenomenological input. You need the cluster to predict behavior; I need the disjunction to explain why a cold drink and a good argument don't feel the same."
  **Soft Spot:** They have factor analysis on their side.
  **They'll Say Back:** "But the factor *is* the reality for a naturalist. If it predicts, it's real."
  **Empirical Tag:** **YES.** (Do not fight the data).
  **Deflection:** "I accept the predictive reality of the construct. I'm questioning whether that construct maps 1:1 onto the normative category 'pleasure' required for ethical theory."

  #### 2. The "You're Just an Attitudinal Hedonist" Charge (Attitudinal Hedonist)
  **Phrasing:** "You say pleasure is an episode presenting itself as 'worth continuing.' That's just a pro-attitude. You've reinvented attitudinal hedonism (e.g., Feldman/Heathwood) but dressed it in phenomenological clothing to avoid the heterogeneity problem. Why isn't this just desire satisfaction?"
  **Reply (2 min):** "Attitudinal hedonism usually relies on a global desire or a judgment about the state of the world. My view is local and experiential. It's not that I *judge* the bath is good; it's that the experience *itself* solicits continuation. A desire can exist without the object being present; this 'worth continuing' presentation vanishes when the experience stops. It's a feature of the consciousness, not just a stance toward it."
  **Soft Spot:** The line between 'experiential attitude' and 'desire' is thin.
  **They'll Say Back:** "Then it's a species of desire. You haven't escaped the view, you've just narrowed the scope."
  **Empirical Tag:** **NO.** (Conceptual distinction).

  #### 3. The First-Person Authority Trap (Philosophers of Psychology)
  **Phrasing:** "You ground normativity in the subject's presentation of 'worth continuing.' But subjects are notoriously bad at knowing what's good for them (adaptation, addiction, depression). If the 'felt worth' is the only metric, how do you account for pathological pleasure? You've made hedonism immune to error, which makes it useless."
  **Reply (2 min):** "I'm grounding *value*, not *prudence*. If an addict feels the hit is worth continuing in the moment, it has hedonic value *for them then*, even if it destroys their future. Hedonism has always had this bullet to bite. My view clarifies it: the value is in the local presentation, not the global life assessment. We can critique the prudence without denying the momentary value."
  **Soft Spot:** Makes hedonism look irresponsible.
  **They'll Say Back:** "Then your theory validates self-destruction."
  **Empirical Tag:** **NO.** (Normative stance).

  #### 4. The Measurement Artifact Counter (Psychologists)
  **Phrasing:** "You claim cross-modal rating scales are artifacts. But we see cross-modal trade-offs in choice behavior. People will sacrifice loudness for brightness in predictable ways. If the scale was just linguistic, behavioral trade-offs wouldn't align with the ratings."
  **Reply (2 min):** "Behavioral trade-offs show commensurability in *choice*, not necessarily in *feeling*. I can choose between an apple and a song without them sharing a common qualitative dimension. I'm arguing the *experience* is heterogeneous, not that the *decision mechanism* can't compare them. The brain might use a common currency for choice that isn't present in the phenomenology."
  **Soft Spot:** Blurs the line between experience and decision.
  **They'll Say Back:** "Then the 'value' is in the choice mechanism, not the experience. Your hedonism collapses into decision theory."
  **Empirical Tag:** **YES.**
  **Deflection:** "That's an empirical question about neural valuation systems. My claim is about the phenomenological description available to the agent."

  #### 5. The Aggregation Problem (Ethicists)
  **Phrasing:** "You concede commensurability goes. If pleasures can't be summed, classical hedonistic utilitarianism is dead. How do you make trade-offs between persons if you won't make them within a person? You've saved the phenomenology but killed the ethics."
  **Reply (2 min):** "I'm saving hedonism as a theory of *well-being*, not necessarily as a decision procedure for maximizing global utility. If value is local, then aggregation is a secondary policy tool, not a metaphysical fact. We can still aim to increase local 'worth continuing' episodes without claiming they sum to a single 'utility' number. It's a shift from calculus to ecology."
  **Soft Spot:** Weakens the political/policy application of the theory.
  **They'll Say Back:** "Then it's not a normative theory, it's a description."
  **Empirical Tag:** **NO.**

  #### 6. The Intensity Correlation (Psychologists)
  **Phrasing:** "Even if qualities differ, intensity ratings correlate with physiological arousal across modalities. A '7' out of '10' on a bath feels physiologically similar to a '7' on an argument. Doesn't that shared intensity dimension count as the common quality?"
  **Reply (2 min):** "Intensity is magnitude, not quality. A loud noise and a bright light can both be 'intense' without sharing a quality. I'm arguing against a shared *hedonic tone*, not a shared *magnitude meter.' You can measure the volume of different songs without claiming they are the same song."
  **Soft Spot:** Intensity often *feels* like part of the pleasure.
  **They'll Say Back:** "But arousal *is* part of the dimensional model of affect. You're accepting half their model."
  **Empirical Tag:** **YES.**
  **Deflection:** "I accept arousal as a physiological correlate. I deny it constitutes the 'pleasantness'."

  #### 7. The Normative Authority Question (Philosophers)
  **Phrasing:** "Why does the 'presentation of worth' bind us? If it's just a feeling, why is it normative? You've described a psychological state, but you haven't bridged the is-ought gap. Why should I care about what feels worth continuing?"
  **Reply (2 min):** "Because that's what 'good for the subject' *means* in a naturalist framework. If we are looking for the subject's good, it must be grounded in what the subject takes as good. To ask 'why care about what seems good to you?' is to ask for a value outside the subject's perspective, which isn't well-being anymore."
  **Soft Spot:** Circular.
  **They'll Say Back:** "That's internalism begging the question."
  **Empirical Tag:** **NO.**

  #### 8. The "Bad Pleasures" Objection (Ethicists)
  **Phrasing:** "Schadenfreude. The pleasure of a warm bath and the pleasure of seeing an enemy fail both present as 'worth continuing.' Does your view validate malicious joy as equally contributory to well-being?"
  **Reply (2 min):** "Yes, to well-being, not to morality. Hedonism has always separated the good *for the agent* from the *moral good*. My view clarifies this: the episode adds to the agent's welfare stream, even if it's morally rotten. The heterogeneity problem isn't solved by moralizing the pleasure."
  **Soft Spot:** Makes well-being look morally neutral to a fault.
  **They'll Say Back:** "Then well-being isn't what matters ethically."
  **Empirical Tag:** **NO.**

  #### 9. The Neural Correlate Challenge (Psychologists/Phil Psych)
  **Phrasing:** "If there's no common quality, why do we see overlapping activation in the nucleus accumbens or OFC across these diverse rewards? Isn't the neural commonality the real commonality?"
  **Reply (2 min):** "Neural convergence doesn't prove phenomenological unity. The stomach and the lungs both use oxygen, but breathing isn't digesting. The brain might use a common hub to process diverse inputs. That explains the functional similarity without requiring the experiences to feel the same."
  **Soft Spot:** Undermines the link between mind and brain.
  **They'll Say Back:** "Then you're a dualist."
  **Empirical Tag:** **YES.**
  **Deflection:** "No, I'm a pluralist about realization. One function, many substrates, many feels."

  ---

  ### Part 3: Strategic Essentials

  **The "Must Land" Reply:**
  **Objection:** "If there's no common quality, why do we use one word ('pleasure')?"
  **Why it must land:** If you can't explain the linguistic unity, the disjunctive view looks like semantic confusion.
  **The Reply:** "We use one word because the *normative role* is identical, not the feel. 'Pleasure' picks out 'episodes that solicit continuation.' That's a functional definition, not a qualitative one. We do the same with 'tool.' A hammer and a saw are both tools, but share no physical quality. They share a role."

  **The "Phantom" Objection (Don't brace for this):**
  **"Hedonism is morally bankrupt / selfish."**
  **Why it won't come:** This is a naturalist workshop. The attendees are interested in the *structure* of affect and value, not introductory moral objections. They assume hedonism is a live option for well-being. Spending time defending the morality of hedonism will make you look like an undergrad.

  **The "Prayer" Question (The one you hope nobody asks):**
  **Question:** "Can you point to a case where a subject reports an experience as 'worth continuing' but shows *no* valence/arousal response, or vice versa? If your view diverges from the dimensional model, where is the empirical evidence of the divergence?"
  **Honest Answer (If forced):** "I don't have that data. That is an empirical hypothesis generated by my conceptual claim. I am arguing that *if* such cases exist (e.g., calm contentment with low arousal, or high arousal without 'worth'), the dimensional model misclassifies them. I am inviting the psychologists in the room to test that, not claiming I have proven it."
  *(Note: Do not bluff. Admit you are proposing a conceptual framework that generates empirical predictions, not one that is already empirically verified.)*
