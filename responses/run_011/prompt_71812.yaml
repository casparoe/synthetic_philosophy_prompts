answer: |-
  # APPRAISAL FUNCTION: LONG-TERM DISCOUNTING DECISION PROCEDURE (LTDDP-01)

  **Effective Date:** Immediate
  **Owner:** Head of Appraisal Function
  **Applicability:** All investment proposals with cost/benefit streams extending beyond 50 years.

  ## 1. PURPOSE AND LIMITATIONS
  This procedure converts welfare economic theory into an executable workflow. It is not a substitute for judgment but a mechanism to locate where judgment is required.
  **Failure Modes:**
  1.  **Parameter Masking:** A motivated analyst can manipulate the *growth rate* ($g$) or *relative price* assumptions to achieve a desired Net Present Value (NPV). This procedure requires sensitivity bands to expose this.
  2.  **Ethical Arithmetic:** The procedure treats the pure time-preference rate ($\rho$) as a fixed input. It cannot resolve whether $\rho$ should be zero (ethical) or positive (observed behavior). This is an escalation point.
  3.  **The 250-Year Collision:** Standard discounting arithmetic will render benefits beyond year 250 negligible. If the Board prohibits rejection on this ground, the procedure will frequently output "Economically Unviable under Standard Parameters" rather than "Reject." This is a feature, not a bug. It forces the Board to explicitly override the economics, rather than hiding the override inside the discount rate.

  ---

  ## 2. THE PROCEDURE

  ### STEP 1: HORIZON CLASSIFICATION
  **Question:** Does any cost, benefit, or obligation extend beyond Year 100?
  *   **Sufficient Answer:** Yes/No based on project design life or legal containment obligation.
  *   **Default:** If uncertain, assume **Yes**.
  *   **Action:**
      *   If **No**: Apply Agency Standard Short-Term Rate (3.5%). Stop.
      *   If **Yes**: Proceed to Step 2. Mark file **[LONG-TAIL]**.

  ### STEP 2: UNIT OF ACCOUNT CHECK
  **Question:** Are benefits measured in financial cash flows (market prices) or consumption equivalents (welfare)?
  *   **Sufficient Answer:** Financial cash flows require a relative price adjustment if the good's scarcity grows differently from general consumption.
  *   **Default:** Assume benefits are **Financial Cash Flows**.
  *   **[VALUE JUDGMENT]:** If the benefit is environmental (flood avoidance, carbon, habitat), you must assess if it becomes scarcer relative to consumption.
  *   **Action:**
      *   If **Standard Good** (e.g., toll revenue): No adjustment.
      *   If **Scarce Environmental Good**: Apply a *Relative Price Uplift* to the benefit stream. (Default: +1% per annum growth in shadow price above inflation).
      *   **Escalation:** If the uplift exceeds +2% p.a., escalate to Chief Economist.

  ### STEP 3: DISCOUNT RATE CONSTRUCTION (THE RAMsey FRAMEWORK)
  Do not select a rate from a list. Construct it using the formula: $r = \rho + (\eta \times g)$.
  **Question 3a:** What is the Pure Time Preference Rate ($\rho$)?
  *   **Sufficient Answer:** The ethical weight placed on future generations independent of wealth.
  *   **Default:** **0.5%**. (Reflects catastrophe risk, not pure impatience).
  *   **[VALUE JUDGMENT]:** This parameter is not empirical. It is a policy choice.

  **Question 3b:** What is the Elasticity of Marginal Utility ($\eta$)?
  *   **Sufficient Answer:** How much less we value an extra dollar as we get richer.
  *   **Default:** **1.5**.

  **Question 3c:** What is the Expected Growth Rate in Consumption ($g$)?
  *   **Sufficient Answer:** Projected real per capita consumption growth.
  *   **Default:**
      *   Years 0–50: **2.0%**.
      *   Years 51–100: **1.5%**.
      *   Years 101+: **1.0%** (Reflects saturation/uncertainty).
  *   **[UNCERTAINTY MARKER]:** For horizons >100 years, $g$ is unknowable. You must apply a **Declining Discount Rate** schedule to reflect the risk that growth is lower than expected.
  *   **Action:** Construct the term structure:
      *   Years 0–50: Calculate $r$ using defaults (~3.5%).
      *   Years 51–100: Reduce $r$ by 0.5%.
      *   Years 101–250: Reduce $r$ to floor of **2.0%**.
      *   Years 250+: Hold at **2.0%**. (Do not extrapolate to zero; do not exceed 3.0%).

  ### STEP 4: CALCULATION AND SENSITIVITY
  **Question:** What is the NPV using the constructed rate?
  *   **Action:** Calculate NPV.
  *   **Requirement:** You must also calculate NPV using a **Sensitivity Band**:
      *   Lower Bound Rate: 1.0% (Flat).
      *   Upper Bound Rate: 4.0% (Flat).
  *   **[FAILURE MODE]:** If the NPV swings from positive to negative across this band, the project is **Indeterminate**. Do not recommend "Accept." Recommend "Viability Contingent on Discount Parameters."

  ### STEP 5: INTERGENERATIONAL INCIDENCE
  **Question:** What share of Total Discounted Net Benefit accrues to persons alive >100 years from now?
  *   **Action:** Sum discounted net benefits for Years 0–100. Sum discounted net benefits for Years 101+. Calculate percentage.
  *   **Reporting:** Report the percentage. If negative (costs borne now, risks later), report as "Intergenerational Liability."

  ### STEP 6: THE 250-YEAR RULE CHECK
  **Question:** Is the NPV negative *primarily* because benefits occurring after Year 250 are discounted heavily?
  *   **Sufficient Answer:** Compare NPV at Year 250 cutoff vs. Full Life NPV.
  *   **Action:**
      *   If **NPV > 0**: Recommend "Accept."
      *   If **NPV < 0** AND **Driver is Post-250 Discounting**: **DO NOT REJECT.**
      *   **Escalation:** Flag as **[BOARD RULE CONFLICT]**. Recommendation must read: "Economically negative under standard welfare weights, but Board Rule 2 prohibits rejection on time-horizon grounds. Requires policy directive on shadow pricing or intergenerational transfer."
      *   If **NPV < 0** AND **Driver is Near-Term Costs**: Recommend "Reject."

  ---

  ## 3. JUSTIFICATION TEMPLATE (FOR CHIEF ECONOMIST SIGN-OFF)

  > **Discount Rate Justification Statement**
  >
  > 1.  **Horizon:** This scheme is classified as [Short/Long-Tail] based on [Specific Obligation/Benefit Date].
  > 2.  **Rate Construction:** The headline discount rate of [X]% is derived from a pure time preference of [0.5%], an elasticity of [1.5], and an expected growth rate of [Y]%.
  > 3.  **Uncertainty:** For years beyond 100, the rate declines to a floor of [2.0%] to account for [Growth Uncertainty/Consumption Smoothing].
  > 4.  **Relative Prices:** Benefits valued at [Year Z] have been adjusted by [X]% per annum to reflect [Scarcity/Abundance] relative to general consumption.
  > 5.  **Incidence:** [X]% of the discounted net benefit accrues to generations unborn for at least 100 years.
  > 6.  **Constraint Check:** [This recommendation complies with Board Rule 2 / This recommendation conflicts with Board Rule 2 due to arithmetic discounting of long-tail benefits].

  ---

  ## 4. PROCEDURE RUN-THROUGH: THREE LIVE FILES

  ### CASE 1: Deep Geological Repository (Intermediate-Level Waste)
  **Profile:** Costs Years 0–15. Containment Indefinite. Release Risk Years 500–2,000.

  **Step 1 (Horizon):** **Yes.** Obligation is indefinite. Risk extends to Year 2,000. **[LONG-TAIL]**
  **Step 2 (Unit):** Benefit is "Avoided Damage." This is a scarce environmental good (safety/land integrity).
  *   *Adjustment:* Apply Relative Price Uplift of +1% p.a. to avoided damage costs.
  **Step 3 (Rate):**
  *   Years 0–50: $0.5 + (1.5 \times 2.0) = 3.5\%$.
  *   Years 101+: Decline to floor of 2.0%.
  *   *Note:* Risk is probabilistic. Expected Cost = Probability $\times$ Damage Cost.
  **Step 4 (Calculation):**
  *   Construction Cost (PV): £500M.
  *   Avoided Damage (Year 1,000): £10 Billion (undiscounted). Probability 0.5%. Expected = £50M.
  *   Discount Factor Year 1,000 @ 2.0%: $1.02^{-1000} \approx 2.7 \times 10^{-9}$.
  *   PV of Avoided Damage: £50M $\times$ (tiny number) $\approx$ £0.
  *   *Sensitivity:* Even at 1.0% floor, factor is $4 \times 10^{-5}$. PV $\approx$ £2,000.
  *   **NPV:** Deeply Negative (-£500M).
  **Step 5 (Incidence):** 100% of the *risk* lies with future generations. 100% of the *cost* lies with current generation. Net Benefit to future gens is technically positive (they avoid the release), but discounted value is zero.
  **Step 6 (Rule Check):**
  *   Is NPV negative because benefits >250 years are discounted? **Yes.**
  *   **Output:** **[BOARD RULE CONFLICT]**.
  *   **Recommendation:** "Economically unviable under consumption discounting. However, Board Rule 2 prevents rejection based on the timing of the risk containment. The value of 'indefinite containment' cannot be captured via standard discounting of low-probability events at Year 1,000. Escalate to Board for 'Safety Standard' classification rather than 'Investment Appraisal'."

  **Analyst Note:** The arithmetic proves that no positive discount rate can justify this project based on *expected monetary value* of distant accidents. The justification must shift from economics to regulatory compliance.

  ---

  ### CASE 2: Tidal Defence Scheme
  **Profile:** 80-year life. Maintenance recurring. Benefits rise with city income.

  **Step 1 (Horizon):** **No.** Design life is 80 years. (Threshold is 100).
  *   *Action:* Apply Agency Standard Short-Term Rate (3.5%). Skip Long-Tail construction.
  **Step 2 (Unit):** Benefits are "Avoided Flood Damage."
  *   *Adjustment:* Damages rise with asset value/income. This matches consumption growth ($g$).
  *   *Relative Price:* No uplift needed. The cash flow model already grows benefits at $g$. Discounting at $r$ (which includes $g$) correctly nets this out.
  **Step 3 (Rate):** Flat 3.5%.
  **Step 4 (Calculation):**
  *   Costs: £100M (PV).
  *   Benefits: £150M (PV @ 3.5%).
  *   **NPV:** +£50M.
  *   **Sensitivity:** @ 5.0%, Benefits = £110M. NPV = +£10M. (Robust).
  **Step 5 (Incidence):**
  *   Years 0–100: 100% of benefits.
  *   Years 100+: 0%.
  *   **Report:** "0% of discounted net benefit accrues to people unborn for >100 years."
  **Step 6 (Rule Check):** NPV Positive. Rule 2 not triggered.
  *   **Recommendation:** **Accept.**

  **Analyst Note:** Standard appraisal logic holds. The growth of benefits matches the growth embedded in the discount rate. No long-tail ethics required.

  ---

  ### CASE 3: Peatland and Coastal Wetland Restoration
  **Profile:** Costs Now. Carbon/Biodiversity Benefits almost entirely Post-Year 250.

  **Step 1 (Horizon):** **Yes.** Benefits peak Year 300+. **[LONG-TAIL]**
  **Step 2 (Unit):** Benefits are Carbon/Biodiversity.
  *   *Adjustment:* These are scarce environmental goods.
  *   *Relative Price:* Apply Default +1% p.a. shadow price uplift.
  **Step 3 (Rate):**
  *   Years 0–100: 3.5% declining to 2.0%.
  *   Years 250+: Floor at 2.0%.
  **Step 4 (Calculation):**
  *   Costs: £50M (PV).
  *   Benefits (Year 300): £1 Billion (undiscounted).
  *   Relative Price Uplift (300 years @ 1%): Multiplier = $1.01^{300} \approx 19.8$.
  *   Adjusted Benefit: £19.8 Billion.
  *   Discount Factor (Year 300 @ 2.0%): $1.02^{-300} \approx 0.0027$.
  *   PV of Benefits: £19.8B $\times$ 0.0027 $\approx$ £53.5M.
  *   **NPV:** +£3.5M. (Marginal).
  *   **Sensitivity:**
      *   If Rate Floor is 2.5%: Factor = 0.0006. PV Benefits = £11.8M. **NPV = -£38.2M.**
      *   If Uplift is 0.5%: Multiplier = 4.5. PV Benefits = £12M. **NPV = -£38M.**
  *   **Status:** **Indeterminate.** Highly sensitive to the 250+ year parameters.
  **Step 5 (Incidence):**
  *   Years 0–100: Costs only.
  *   Years 101+: All Benefits.
  *   **Report:** "99% of discounted net benefit accrues to people unborn for >100 years."
  **Step 6 (Rule Check):**
  *   Is NPV negative (under slightly stricter assumptions)? **Yes.**
  *   Is the driver discounting of benefits >250 years? **Yes.**
  *   **Board Rule 2:** "No scheme may be rejected on the sole ground that its benefits fall beyond year 250."
  *   **Collision:** The arithmetic says "Reject" (or Indeterminate). The Board Rule says "Do not reject on this ground."
  *   **Procedure Output:** **[BOARD RULE CONFLICT]**.
  *   **Recommendation:** "Project fails standard Cost-Benefit Analysis due to the time-value of money over three centuries. However, Board Rule 2 prohibits rejection based on this time horizon. The positive NPV exists *only* if we assume a 1% relative price uplift and a 2.0% discount floor. If the Board values intergenerational equity higher than current consumption, they must authorize a lower discount floor (e.g., 1.0%) or a higher scarcity uplift. Under current parameters, this is a transfer of £50M from current taxpayers to unborn generations with a marginal economic return."

  **Analyst Note:** This is the collision you suspected.
  1.  **Arithmetic:** With $r > 0$, value at Year 300 is negligible.
  2.  **Rule:** You cannot reject based on (1).
  3.  **Resolution:** The procedure forces you to approve the project *only if* you tweak the parameters (lower $r$, higher scarcity uplift) to make the math work. If you keep parameters honest, the NPV is negative.
  4.  **Binding Constraint:** The **Board Rule** is binding on the *decision* (you cannot file a "Reject" memo), but the **Arithmetic** is binding on the *truth* (the project consumes resources now for value that is mathematically near-zero).
  5.  **Action:** You must escalate this to the Board. The memo should state: *"To comply with Rule 2, we must value Year 300 benefits higher than market/consumption logic dictates. This requires a policy decision to set the Social Discount Rate floor below 2% or mandate a higher scarcity premium. We cannot validate this economically without that directive."*

  ---

  ## 5. ESCALATION PROTOCOL

  **Escalate to Chief Economist when:**
  1.  Relative Price Uplift > 2% p.a. is required to achieve positive NPV.
  2.  The Intergenerational Incidence shows >50% of *costs* (not benefits) fall on future generations (e.g., nuclear waste).
  3.  **Case 3 Scenario:** The project is economically negative, but Board Rule 2 prevents rejection. Do not sign off. Send to Chief Economist with tag **[POLICY OVERRIDE REQUIRED]**.

  **Escalate to Head of Appraisal (You) when:**
  1.  Chief Economist and Analyst disagree on the Growth Rate ($g$) assumption for the 100+ year horizon.
  2.  A [BOARD RULE CONFLICT] tag is generated. You must inform the Sub-Committee that the appraisal function cannot reconcile the Board's ethical rule with the Board's economic template without a parameter change.

  ## 6. FINAL INSTRUCTION TO STAFF
  You are not being asked to solve intergenerational ethics. You are being asked to measure the gap between economic arithmetic and policy intent.
  *   If the math says **Yes**, recommend **Yes**.
  *   If the math says **No** because of near-term costs, recommend **No**.
  *   If the math says **No** *only* because the benefits are too far away, **do not recommend No.** Flag the conflict.
  *   Never hide the discount rate assumption. If you change the floor to make a project pass, state it in the Justification Template.

  **End of Procedure.**
