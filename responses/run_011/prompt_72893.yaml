answer: |-
  Here is a complete lesson plan designed to induce the feeling of logical omniscience failure through a constrained betting market.

  # Lesson Plan: The Bounded Market
  **Time:** 75 Minutes
  **Students:** 14 (Upper-level Epistemology)
  **Goal:** Demonstrate that standard coherence norms (Dutch Book immunity) are impossible for finite agents without naming "Logical Omniscience" until the debrief.

  ## Part 1: Materials & Prep

  ### 1. The Proposition Sheet (One per student)
  *Design:* Clean, professional, slightly intimidating.
  *Header:* **EPISTEMIC MARKET TICKET #404**
  *Instructions:* You have an endowment of **100 Chips**. You must assign a **Price (0–100)** to each of the 10 Propositions below. This Price represents your credence that the proposition is **Logically True**.
  *   **If you Price at 80:** You are willing to **Buy** a ticket for 80 that pays 100 if True (Profit 20), OR **Sell** a ticket for 80 that costs you 100 if True (Risk 20).
  *   **The House (Instructor)** will choose whether you Buy or Sell *after* you submit prices, to maximize your loss.
  *   **Resources:** You have **3 Verification Tokens**. You may trade 1 Token to ask the Instructor: *"Is Proposition X a Tautology?"*, *"Are X and Y Equivalent?"*, or *"Does X Entail Y?"*.
  *   **Time Limit:** 15 Minutes for Pricing.

  *The Propositions (The Trap):*
  *(Note: $p, q, r, s, t$ are atomic sentences with unknown truth values. Students must treat them as logically independent variables unless proven otherwise.)*
  1.  $(p \to q) \lor (q \to p)$
  2.  $\neg (p \land q)$
  3.  $\neg p \lor \neg q$
  4.  $p \land (q \lor r)$
  5.  $(p \land q) \lor (p \land r)$
  6.  $p \land q$
  7.  $p$
  8.  $(s \to t) \land s$
  9.  $t$
  10. $\neg (r \land \neg r)$

  *(Instructor Key: 1 is Tautology. 2≡3. 4≡5. 6⊨7. 8⊨9. 10 is Tautology.)*

  ### 2. The Verification Tokens
  *   Print 42 small slips of paper (3 per student + spares).
  *   Label them **"COMPUTATION TOKEN"**.
  *   Rule: Once spent, they are gone. They cannot be shared.

  ### 3. Instructor Lookup Table (For your clipboard)
  *Do not calculate on the fly. Use this to assess losses instantly.*

  | Relation | Condition for Loss | Loss Calculation |
  | :--- | :--- | :--- |
  | **Tautology** (Prop 1, 10) | Price $< 100$ | $100 - \text{Price}$ |
  | **Contradiction** (None) | Price $> 0$ | $\text{Price}$ |
  | **Equivalence** (2&3, 4&5) | Price A $\neq$ Price B | $| \text{Price A} - \text{Price B} |$ |
  | **Entailment** (6→7, 8→9) | Price Antecedent $>$ Price Consequent | $\text{Price Ant.} - \text{Price Cons.}$ |
  | **Coherence** (Any) | Price $< 0$ or $> 100$ | Disqualified |

  *Note: Losses are additive. If a student fails multiple, sum the losses.*

  ### 4. Payoff Scheme
  *   **Start:** 100 Chips.
  *   **End:** 100 - Total Losses.
  *   **Reward:**
      *   > 90 Chips: 3 Candies + "Ideal Agent" Badge.
      *   70–90 Chips: 1 Candy.
      *   < 70 Chips: 0 Candies + "Bounded Agent" Badge.
  *(Make a show of withholding the candy. It needs to sting slightly.)*

  ---

  ## Part 2: Timeline (75 Minutes)

  ### 0:00–0:10 | Setup & Rules
  *   Hand out Sheets and 3 Tokens.
  *   Explain the Buy/Sell mechanic clearly. Emphasize: *"I will choose the direction of the bet to maximize your loss based on your prices. If you are incoherent, you will lose chips."*
  *   **Crucial:** Do not mention logic, tautologies, or omniscience. Refer to them as "Relations" or "Truth Conditions."
  *   Start the 15-minute timer.

  ### 0:10–0:25 | The Pricing Phase (Pressure Cooker)
  *   Students work individually.
  *   **The Squeeze:** There are 10 propositions. They have 3 tokens. Verifying one relation (e.g., "Is 2 equivalent to 3?") takes about 1 minute of your time to answer.
  *   **Tactic:** If a student asks about Prop 1 (Tautology), answer truthfully ("Yes"). If they ask about Prop 4 & 5, answer ("Yes, Equivalent").
  *   **Observation:** Watch who spends tokens early. Watch who tries to derive Prop 1 mentally (they will stall). Watch who guesses.
  *   **Intervention:** At 0:20, announce: *"5 minutes remaining. Unpriced propositions will be auto-set at 50."* (This forces errors).

  ### 0:25–0:40 | The Audit (The Dutch Book)
  *   Collect Sheets.
  *   **Public Execution:** Pick the 3 most confident/smug-looking students. Project their sheet (or write on board).
  *   Apply the Lookup Table live.
      *   *"Student A priced Prop 1 at 90. Prop 1 is a logical truth. I buy the ticket from you at 90. It pays 100. You lose 10 chips."*
      *   *"Student B priced Prop 2 at 80 and Prop 3 at 60. They are equivalent. I sell you 2 and buy 3. You lose 20 chips regardless of truth value."*
  *   **The Twist:** Admit your own vulnerability. *"If I had priced these, I would have lost chips on Prop 4 and 5 because I didn't check the distribution law in time."* (Shows even the market-maker is bounded).
  *   Return sheets with losses calculated.

  ### 0:40–0:50 | Settlement & Scoring
  *   Students calculate final chip counts.
  *   Distribute candy based on the tiers.
  *   Expect grumbling from the high-performers who lost chips on "technicalities."

  ### 0:50–1:15 | The Debrief (The Philosophical Turn)
  *   **Phase 1: The Feeling.**
      *   "Raise your hand if you lost chips on Proposition 1." (The Tautology).
      *   "Why didn't you price it at 100?" (Answers: "Didn't recognize it," "Didn't have tokens," "Wasn't sure.")
      *   "Raise your hand if you had inconsistent prices on 2 and 3." (The Equivalence).
      *   "Did you know they were equivalent when you priced them?" (No).
      *   "Could you have known?" (Yes, with more time/tokens).
  *   **Phase 2: The Norm.**
      *   "The rule of this game was: *No Dutch Books.* If your prices allow me to guarantee a profit, you are 'irrational'."
      *   "How many of you were irrational by the rules of the game?" (Likely all of them).
      *   "Does that mean you are actually irrational thinkers? Or was the norm impossible to meet?"
  *   **Phase 3: Logical Omniscience.**
      *   Reveal the term: **Logical Omniscience**.
      *   Standard Bayesianism requires $P(Tautology) = 1$ and $P(A) = P(B)$ if $A \iff B$.
      *   "The game showed you that satisfying this norm requires **computational resources** (tokens/time) that you did not have."
      *   "If rationality requires coherence, and coherence requires omniscience, and you are not omniscient... are you irrational?"
  *   **Phase 4: The Hard Consequence.**
      *   "Suppose we fix the norm. We say: *'You are only required to be coherent about what you can compute.'*"
      *   "What happens to the Dutch Book argument?" (It breaks. I can't book you if you don't know the relation).
      *   "If I can't Dutch Book you, can I still call your beliefs irrational?"
      *   "Have we saved rationality, or have we just defined it away?"

  ---

  ## Part 3: Troubleshooting & Reality Check

  ### 1. The "Math-y Student" Problem
  **Risk:** One student recognizes $(p \to q) \lor (q \to p)$ instantly, solves all equivalences without tokens, prices everything perfectly, and wins 3 candies. They will raise their hand and say, "This was easy, why did everyone fail?"
  **Mitigation:**
  *   **Pre-empt:** In the instructions, say: *"These propositions are drawn from a set of 5-variable formulas. Derivation times vary."* (A white lie to induce caution).
  *   **During Debrief:** Use them. *"Student X met the norm. Student X is an ideal agent. Student X is also the only one who didn't have to grade their other epistemology papers tonight. Is Student X's rationality a norm for *us*?"*
  *   **The Cost:** Point out that Student X spent 15 minutes doing logic proofs. They had *no time* to consider the strategic payoff or the entailment relations in 8 & 9. If they made a mistake there, they are still bounded.

  ### 2. Instructor Bookkeeping Nightmare
  **Risk:** You get stuck calculating $|80 - 60|$ for 14 students while they watch.
  **Mitigation:**
  *   **The Lookup Table is mandatory.** Do not do math in front of them.
  *   **Sample Size:** Only audit 3 students live. Collect the rest, calculate losses after class, and email the results. Tell them: *"The market clears overnight. Your final scores will be posted."* This preserves the tension without eating class time.
  *   **TA Help:** If you have a GA/TA, have them verify the "Token Transactions" while you run the Audit.

  ### 3. Collusion
  **Risk:** Students shout answers across the room. "Prop 1 is a tautology!"
  **Mitigation:**
  *   **Seating:** Pre-assign seats or enforce "Exam Conditions" (no talking, bags under chairs).
  *   **Token Accounting:** Collect spent tokens immediately. If a student asks a question, walk to their desk. Do not answer globally.

  ### 4. What The Game Cannot Reproduce (Be Honest Here)
  In the debrief, you must disclose the following limitations, or they will catch you:
  1.  **Logic is not Empirical:** In the game, checking a logical relation cost a "Token" (like an empirical observation). In reality, logical relations are necessary truths, not discovered via resource expenditure. The game gamifies *computation*, not *metaphysics*.
  2.  **The "World" was Fixed:** In the game, the truth values were fixed by the logic. In real life, we often don't know if two propositions are equivalent *even in principle* without doing the work.
  3.  **The Norm Remains:** The game shows we *fail* the norm. It doesn't prove the norm is *wrong*. You have to push them on whether a norm that humans necessarily violate is a useful norm at all.

  ### 5. Predicted Failure Point
  **The "50" Auto-Set:** Students might leave hard propositions blank hoping you won't notice.
  **Fix:** The rule *"Unpriced propositions auto-set at 50"* is your enforcement. A price of 50 on a Tautology guarantees a 50-chip loss. Make sure you enforce this ruthlessly on the projected sheets. It drives home the point that *withholding judgment* is also a vulnerability in a strict coherence framework.

  ## Instructor Script Snippet (For the Debrief)
  *"Look at your score. You lost chips not because you were careless, but because you are finite. You had 3 tokens and 10 problems. The norm of 'No Dutch Books' assumes you have 10 tokens. If we define rationality as 'satisfying the norm,' then rationality is impossible for you. But if we define rationality as 'doing your best with 3 tokens,' then the Dutch Book argument no longer applies. Which definition do you want? And can you afford the price of the one you choose?"*
