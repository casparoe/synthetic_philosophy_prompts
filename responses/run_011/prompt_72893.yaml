prompt: |-
  I teach a 75-minute session of an upper-level epistemology seminar — 14 students, all of whom have had at least one course with Bayes in it and most of whom are pretty smug about it. I want an in-class betting game that walks them into the problem of logical omniscience without me saying the phrase once until the debrief.

  The thing I want them to feel: the coherence norms they think they've already bought — no Dutch books, credence 1 in anything logically true, credences that line up with what they entail — are norms that no finite thinker can actually meet, and that this isn't a matter of just trying harder. It's built into what a credence function is supposed to be.

  So design the game for me. I need rules, materials that fit on one printable sheet, a payoff scheme using points or candy or something (no real money, and it has to actually feel like losing something), and a timeline that fits 75 minutes. My instinct is a market where each student posts prices on a set of sentences and I, as market-maker, go hunting for combinations of their own posted prices that lose chips no matter how the world turns out — with some of the sentences secretly equivalent, some secretly entailing one another, and at least one long disguised tautology in the pile. But I'm not married to that, use whatever mechanism genuinely works. What I do insist on: the logical relations shouldn't be visible on the surface; checking them has to cost the students something real (time, tokens, a turn, whatever); there has to be plainly not enough of that resource to check them all; and nobody can escape by confuring with a neighbor or the whole thing turns into a group project. It would also be good if I get arbitraged at some point too.

  Then a debrief that maps the actual moments onto the pieces of the concept — the first student who gets book-beaten, the tautology everyone underpriced, the one kid who blew their whole budget computing — and pushes them to the question of what a norm of rationality is worth if only an idealized agent can satisfy it. I'd like them to run into the awkward consequence as well: if you weaken the norm to whatever the agent can actually compute, what exactly have you given up, and can you still call anyone irrational?

  Tell me what will predictably go wrong the first time I run this. I'm mostly worried about the math-y student who quietly works out every relation and then finds the game trivial, and about my own bookkeeping — constructing the winning combinations on the fly in front of 14 people sounds like a nightmare, so build in whatever prep or lookup table I need.

  And be straight with me about which feature of the problem the game can't reproduce, so I know what I'll have to just tell them at the end.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** 75-minute upper-level epistemology seminar.
      *   **Students:** 14 students, familiar with Bayesianism, somewhat smug/confident in coherence norms.
      *   **Goal:** Demonstrate the problem of *logical omniscience* without naming it until the debrief. Make them *feel* the impossibility of satisfying coherence norms for finite agents.
      *   **Mechanism:** In-class betting game (Dutch Book style).
      *   **Constraints:**
          *   No real money (points/candy).
          *   Must feel like losing something.
          *   Logical relations hidden (equivalences, entailments, tautologies).
          *   Checking relations costs resources (time/tokens).
          *   Not enough resources to check everything.
          *   No collusion (individual play).
          *   Instructor needs to be able to arbitrage them (Dutch Book them).
          *   Instructor might get arbitraged too (optional but requested).
          *   Needs a printable sheet, payoff scheme, timeline.
          *   Needs a debrief plan mapping game moments to philosophical concepts.
          *   Needs troubleshooting (what goes wrong, math-y student, instructor bookkeeping).
          *   Needs honesty about what the game *can't* simulate.

  2.  **Deconstruct the Core Problem (Logical Omniscience):**
      *   Standard Bayesianism requires $P(A) = 1$ if $A$ is a logical truth.
      *   It requires $P(A) = P(B)$ if $A \iff B$.
      *   It requires $P(A) \leq P(B)$ if $A \models B$.
      *   Finite agents cannot compute all logical relations instantly.
      *   Therefore, finite agents are necessarily "irrational" by strict Bayesian standards.
      *   *Game Translation:* Students must set prices (credences) on propositions. Some propositions are logically related but obscurely so. If they price inconsistently, they get Dutch Booked. If they spend time checking logic, they run out of time/resources to price everything, leading to arbitrary pricing elsewhere (which also gets Dutch Booked).

  3.  **Design the Game Mechanism:**
      *   *Idea:* A "Market Maker" game. Students are bettors. Instructor is the House.
      *   *Propositions:* Need a list of sentences. Some are atomic, some are negations, some are complex logic puzzles disguised as facts.
      *   *Resource:* "Computation Tokens." Each student gets a limited number. Spending a token reveals the logical status (True/False/Equivalent to X) of a sentence *or* the relation between two sentences.
      *   *Pricing:* Students assign a "Buy Price" and "Sell Price" (or just a single credence $p$ where they buy at $p$ and sell at $p$). Let's simplify: They set a credence $p \in [0, 100]$. The Instructor can choose to buy a ticket from them (paying $p$) that pays \$1 if True, or sell a ticket to them (charging $p$) that pays \$1 if True.
      *   *The Trap:*
          1.  **Hidden Tautology:** A sentence that looks contingent but is logically true. If they price it < 100, they lose money when the Instructor buys it.
          2.  **Hidden Equivalence:** Sentence A and Sentence B are equivalent. If Price(A) > Price(B), Instructor buys A and sells B.
          3.  **Hidden Entailment:** A entails B. If Price(A) > Price(B), Instructor buys A and sells B.
          4.  **Resource Scarcity:** They only have tokens to check 2-3 relations. There are 10 sentences. They *must* guess on the rest.
      *   *Instructor Bookkeeping:* I cannot calculate Dutch Books on the fly for 14 students. I need a pre-calculated lookup table based on common pricing errors. Or, simpler: The "Truth" is fixed beforehand. The Instructor looks for inconsistencies *after* pricing is done.
      *   *Refinement:* To make it feel like *losing*, they start with an endowment (e.g., 100 "Epistemic Chips"). Losses are deducted. Candy at the end based on final chip count.

  4.  **Develop the Content (The Sentences):**
      *   Need 10-12 sentences.
      *   Need 1 Tautology (disguised).
      *   Need 2 Pairs of Equivalences.
      *   Need 1 Entailment pair.
      *   Need 3 Atomic/Independent sentences (to use up tokens).
      *   *Topic:* Keep it abstract or mathematical to avoid empirical knowledge interfering. Let's use a mix of propositional logic and simple arithmetic.
      *   *Sentence 1 (Tautology):* $(P \to Q) \lor (Q \to P)$. (Looks contingent, is valid).
      *   *Sentence 2 & 3 (Equivalence):* $\neg(P \land Q)$ and $(\neg P \lor \neg Q)$. (De Morgan's).
      *   *Sentence 4 & 5 (Equivalence):* $P \to Q$ and $\neg P \lor Q$. (Material implication).
      *   *Sentence 6 & 7 (Entailment):* $(P \land Q)$ entails $P$.
      *   *Sentence 8, 9, 10 (Filler):$ $P$, $Q$, $R$ (where truth values are assigned randomly by dice roll *after* the game to prevent empirical knowledge). Actually, better: The "World" is fixed by the Instructor beforehand to ensure the logic holds, but the *truth values* of atoms don't matter for the tautologies/equivalences.
      *   *Wait, simpler:* The "World" is just a truth-value assignment to atomic variables $P, Q, R$. The sentences are formulas. The logic holds regardless of the assignment for tautologies/equivalences.
      *   *Constraint:* Students don't know $P, Q, R$ values. They must price based on logical probability.
      *   *Correction:* If I use propositional logic formulas, the "smug" Bayesians might recognize them immediately. I need to disguise them.
      *   *Disguise:* Use natural language statements that map to the logic.
      *   *Example:*
          *   S1: "If it rains, the ground gets wet, OR if the ground gets wet, it rains." (Contingent? No, $(R \to W) \lor (W \to R)$ is a tautology).
          *   S2: "It is not the case that both the switch is up and the light is on."
          *   S3: "Either the switch is not up or the light is not on."
      *   *Better:* Use a specific scenario. "The Case of the Colored Cards."
      *   *Setup:* There are three cards: Red, Green, Blue. One is in a box.
