      *   *What the game can't reproduce:* The game makes logic look like empirical discovery (using tokens). In reality, logical relations are necessary, not empirical. The game gamifies the *computation*, not the *metaphysics*. I need to explain this.

  12. **Final Polish:**
      *   Make the printable sheet clean.
      *   Ensure the payoff is clear.
      *   Write the Instructor's Cheat Sheet explicitly.
      *   Script the Debrief questions.

