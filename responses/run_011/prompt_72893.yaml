      *   *Student solves it:* Acknowledge them, but point out they spent *time* (opportunity cost) that others spent on other problems.
      *   *Bookkeeping:* Pre-print the "Audit Sheet." I don't calculate on the fly. I check their sheet against my Key. If Price(S1) < 100, I mark "Loss."
