      *   *Example:* "The 4th digit of $\pi$ is even OR the 4th digit of $\pi$ is odd." (Easy).
      *   *Example:* "The number $2^{67}-1$ is prime OR it is composite." (Hard).
      *   *Let's use the "Black Box" approach.* The propositions refer to a hidden state. The logical relations are fixed, but verifying them requires a Token. The text of the proposition doesn't give it away.
      *   *Actually, best approach:* The propositions are logical formulas using variables $p, q, r, s, t$. The students don't know the truth values of $p, q, r, s, t$. They must assign credences based on logical probability (e.g., if $p$ is unknown, $P(p) = 0.5$).
      *   *The Trap:* $P(p \lor \neg p)$ must be 1. $P(p \land q)$ must be $\leq P(p)$.
      *   *To make it hard:* Use 5 variables. Formulas are length 5-6.
      *   *S1:* $p \lor \neg p$ (Too easy).
      *   *S1:* $(p \to q) \lor (q \to p)$ (Tautology, less obvious).
      *   *S2:* $\neg (p \land q)$
      *   *S3:* $\neg p \lor \neg q$
      *   *S4:* $p \land (q \lor r)$
      *   *S5:* $(p \land q) \lor (p \land r)$ (Equiv to S4).
      *   *S6:* $p \land q$
      *   *S7:* $p$ (S6 entails S7).
      *   *S8, S9, S10:* Random combos.
      *   *Verification:* Token allows asking "Is S1 valid?" or "Is S2 equivalent to S3?".
      *   *Time Limit:* 15 minutes to set 10 prices with 3 tokens. They can't derive S4=S5 in that time without tokens.

