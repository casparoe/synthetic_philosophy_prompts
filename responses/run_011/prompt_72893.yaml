          1.  The card is Red or (if the card is Red then the card is Green). [Tautology: $R \lor (R \to G)$ is equivalent to $R \lor (\neg R \lor G)$ which is True]. Wait, $R \to G$ is false if R is true and G is false. If Card is Red, G is false. So $R \to G$ is false. $R \lor False$ is True. If Card is Green, R is false. $False \lor (False \to True)$ is True. Yes, this works.
          2.  The card is not Red.
          3.  The card is Green or Blue. (Equivalence to 2).
          4.  If the card is Red, then it is not Green.
          5.  The card is not Red or it is not Green. (Equivalence to 4).
          6.  The card is Red and Green. (Impossible/False).
          7.  The card is Red.
          8.  (Entailment) The card is Red and Green entails The card is Red.
      *   *Actually, let's make it harder to spot.* Use arithmetic.
          *   S1: "The number of students in this room is even OR the number of students in this room is odd." (Tautology). Too obvious.
          *   S1: "7919 is prime OR 7919 is composite." (Tautology). Too obvious.
          *   S1: "If 7919 is prime, then 7921 is composite." (Contingent? 7919 is prime. 7921 = 89^2. So True. But requires computation).
      *   *Decision:* Let's use a "Code Breaker" theme. 3-digit code.
      *   *Sentences:*
          1.  (Tautology) The first digit is even OR the first digit is odd. (Disguised: "The sum of the first digit and 1 is odd OR the sum of the first digit and 1 is even").
          2.  (Equiv A) The code contains a 5.
          3.  (Equiv B) It is not the case that the code contains no 5s.
          4.  (Entail A) The code is 5-5-5.
          5.  (Entail B) The code contains a 5.
          6.  (Falsehood) The code is 5-5-5 AND the code contains no 5s.
      *   *Okay, the prompt asks for "Logical Omniscience" specifically regarding coherence norms.* The best way to hit this is to make the logical relations *computationally expensive* to verify, not just linguistically disguised.
      *   *Revised Plan:* Use propositional logic formulas but label them "Proposition A", "Proposition B". Provide a "Key" that defines the atoms, but the atoms are complex conditions.
      *   *Actually, the "Token" mechanic is the key.* They have to *spend* a token to ask "Is S1 equivalent to S2?" or "Is S1 a tautology?".
      *   *Let's go with the Market Maker idea.*
      *   *Materials:*
          *   Sheet with 10 Propositions.
          *   3 "Verification Tokens" per student.
          *   Ledger for Instructor.

  5.  **Addressing the "Math-y Student" & "Bookkeeping" Worries:**
      *   *Math-y Student:* If they solve the logic instantly, they win. *Counter:* Make the logic *actually hard*. Not "A or not A", but something requiring 3-4 steps of derivation or a truth table with 5 variables. Or, make the verification tokens the *only* way to know for sure. If they solve it without tokens, great, but limit the time so they can't solve all 10.
      *   *Bookkeeping:* I cannot Dutch Book 14 students individually in real-time.
      *   *Solution:* The "Settlement Phase." Students lock in prices. *Then* I reveal the logical relations (or the "World"). *Then* I apply a standard Dutch Book algorithm to their sheet.
      *   *Wait, the prompt says:* "I, as market-maker, go hunting for combinations...".
      *   *Compromise:* I pre-calculate the "Trap Combinations." I walk around, look at their sheet, and if I see Price(A) > Price(B) where A=B, I immediately execute the trade. This makes it visceral.
      *   *Lookup Table:* I need a cheat sheet. "If Price(1) < 100, Buy. If Price(2) != Price(3, Buy Low/Sell High."
      *   *To reduce load:* I only Dutch Book the most egregious errors publicly, then collect sheets to calculate final scores.
      *   *Better:* The "Audit." I pick 3 students at random to audit live. The rest submit sheets. This saves time and creates tension.

  6.  **Addressing the "Feel like losing something":**
      *   Start with 100 Points.
      *   Buying a ticket costs $p$ points. Payoff is 100 points if True.
      *   Selling a ticket gains $p$ points. Liability is 100 points if True.
      *   If they end with < 50 points, no candy. > 80 points, extra candy.
      *   *Crucial:* They must *commit* to the prices before knowing which relations hold.

  7.  **Timeline (75 mins):**
      *   0-10: Setup & Rules.
      *   10-25: Pricing Phase (Scarcity pressure).
      *   25-45: Trading/Arbitrage Phase (Instructor hunts).
      *   45-60: Settlement & Scoring.
      *   60-75: Debrief.

  8.  **Drafting the Content:**
      *   *Propositions:* Need to be opaque. Let's use a "Logic Circuit" metaphor.
      *   *S1-S10:* Mix of tautologies, contradictions, equivalences.
      *   *Tokens:* 3 per student. Can be used to ask the Instructor: "Is Si a tautology?", "Is Si equivalent to Sj?", "Does Si entail Sj?".
      *   *Instructor Prep:* I need the Answer Key.
      *   *The "Trap":* S1 is a tautology. S2/S3 equivalent. S4/S5 equivalent. S6 entails S7.
      *   *Scarcity:* 10 propositions, 3 tokens. They must guess 7 prices.

