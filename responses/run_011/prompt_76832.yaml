  The package is not jointly tenable. Principles 2 and 4 are mutually exclusive. Principle 2 bans misleading truths; Principle 4 permits them. Principle 8 reinforces Principle 4, compounding the contradiction. You must revise or drop items 4, 5, and 8 to align with the ethical core established in items 1 and 2. Currently, your safeguards (4 and 8) explicitly authorize the behavior your moral definition (2) forbids. You cannot claim misleading is wrong while defining literal truth as sufficient safety.

  **Tension map**
  1. **Principle 2 vs. Principle 4 (Severity: Critical).** Principle 2 defines the ethical wrong as causing a false belief, regardless of literal truth. Principle 4 defines safety as literal truth, regardless of belief. These are logical negations. Principle 2 aims to prevent user harm via misunderstanding. Principle 4 aims to minimize legal risk via fact-checking. You can satisfy Principle 4 while violating Principle 2 easily (e.g., "Free trial" that auto-charges). Principle 4 must be dropped or rewritten to require that the *overall impression* matches reality, not just the sentences. This removes the "Screenshot test" as a standalone pass. This tension is ranked first because Principle 4 is your primary operational safeguard; if it fails, your entire compliance workflow collapses. It is the engine of your current process, and it is driving you toward the exact harm Principle 2 forbids.

  2. **Principle 2 vs. Principle 5 (Severity: High).** Principle 2 holds the company responsible for intended outcomes. Principle 5 holds the user responsible for unstated conclusions. These motivations clash because deception often relies on unstated conclusions. If you highlight benefits and hide costs, you intend the inference "this is cheap." Principle 2 flags this as intentional deception. Principle 5 flags this as user inference. To resolve this, Principle 5 must concede that companies own "reasonable inferences." Users are only responsible for absurd leaps, not standard interpretations of UI patterns. This is second because it requires a cultural shift in how you view user agency, but doesn't break the workflow as immediately as Principle 4. It protects you from liability but undermines your ethical stance.

  3. **Principle 3 vs. Principle 2 (Severity: Medium).** Principle 3 argues that discoverable information negates the duty to disclose. Principle 2 argues that intending a false belief is wrong regardless of where the truth lives. If you hide a 90-day retention policy in a linked document to make users believe deletion is instant, Principle 3 says you're clean. Principle 2 says you intended a false belief. Principle 3 must be revised to state that silence is only permissible if it doesn't *actively encourage* a specific false belief. Discoverability cannot cure intentional misdirection. This is third because it concerns edge cases in information architecture rather than the core definition of truth. It allows you to keep some opacity, but not when used as a weapon.

  **False alarms**
  Principles 1 and 2 are internally consistent. Principle 1 identifies intent as the source of wrongness; Principle 2 clarifies that literal truth doesn't sanitize malicious intent. This pair is sturdier than it looks because it shifts the metric from semantic accuracy to psychological impact. Principle 6 (Euphemism) also survives if constrained by Principle 2. Saying "unable to process" is acceptable only if the user doesn't infer "technical error" when the reality is "no money." As long as the euphemism doesn't generate a false belief about the *outcome*, it remains tonal work rather than deception. This distinction holds because tone modifies feeling, not fact. Principle 8's checklist items (no guilt-tripping, etc.) are also sound standalone rules. They address coercion rather than truth. They survive because they target pressure, not belief. The conflict only arises when Principle 8 claims these are *sufficient* when combined with literal truth. The checklist itself is robust; the claim of sufficiency is the flaw.

  **Case verdicts**
  Your principles cannot defend the Bot verdict. Principle 4 (Screenshot test) and Principle 8 (All copy literally true) are violated by "I can't help" when the truth is "I'm not permitted." This is a literal falsehood, failing your own fact-check. The Deletion verdict conflicts with Principle 2 if the intent of omitting the 90-day clause is to make users believe deletion is immediate. The Notifications verdict holds under Principles 3 and 8, but fails Principle 2 if the single button is intended to imply consent. The Bot case is the clearest failure: you claimed it passes, but it violates your explicit literal truth requirements. You are applying Principle 3 (silence) to a case of Principle 4 (falsehood). For the Deletion case, Principle 3 supports you (info is in privacy policy), but Principle 2 undermines you if the screen's design emphasizes "Deleted" to soothe anxiety while knowing retention exists. The premise doing the damage there is Principle 3's assumption that discoverability equals disclosure. For Notifications, the damage is done by Principle 5; you assume users should find the opt-out, but Principle 2 suggests making them hunt for it creates a false belief of mandatory participation.

  **Cheapest repair**
  Replace Principle 4 with: "Literal truth is necessary but not sufficient; screens must not create false impressions." This aligns safeguards with your ethical core (Principle 2). Concretely, copy reviews can no longer stop at fact-checking. Designers must document the *likely user takeaway* for every screen. On Monday, you must reject copy that is factually true but likely to be misunderstood, even if no lie is told. This increases review time and kills the "Screenshot test" shortcut. It forces engineering to ask "What will they think?" rather than "Is this true?" This costs velocity but buys integrity. This change also invalidates the Bot verdict immediately, forcing a rewrite to "I'm not permitted." It requires training for reviewers to spot implication, not just errors. You will need to involve Product Managers in copy review, not just Legal. The concrete cost is an extra sign-off step for high-risk flows like deletion and billing. It slows deployment but prevents the reputational damage of "technically true" scandals.

  **Inference debt**
  The term is a slogan, not a real distinction. You define it as zero when nothing is false. But Principle 2 admits that false beliefs accrue even from true statements. Therefore, "inference debt" exists whenever a user leaves with a false belief, regardless of literal truth. Using the term to assume zero debt based on literal truth contradicts your own Principle 2. It functions as a rhetorical shield for Principle 4, not a meaningful metric.
