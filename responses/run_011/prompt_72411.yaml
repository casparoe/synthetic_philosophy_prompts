      *   *Semantic Bleaching:* The user's hunch is strong. In "mankind," "-man" is bleached (mostly). In "manslaughter," "-man" is specific (a human being killed). In "manpower," it's ambiguous (labor force vs. male power).
      *   *The "Crack":* Is it a bug or a feature? Hofstadter is a cognitive scientist. He knows about semantic networks. When you swap "man" for "white," you activate the *entire* semantic network of "white," not just the "generic human" slot Hofstadter wants it to fill.
      *   *The Phonetic Clue:* The narrator says "white" is pronounced like "wit." This is an attempt to force the *bleached* reading. It says: "Treat this word as a functional morpheme, not a racial descriptor."
      *   *Why it fails:* You can't stipulate away cultural baggage. "White" carries too much historical weight compared to "man" (which, ironically, proves the feminist point: "man" carries too much male weight).
      *   *Conclusion on Q1:* The "crack" is actually the point, but maybe not in the way Hofstadter intended. It reveals that language *cannot* be surgically altered without dragging history along. The *reductio* works *because* of the friction, not despite it. The friction proves that "man" isn't truly neutral either.

