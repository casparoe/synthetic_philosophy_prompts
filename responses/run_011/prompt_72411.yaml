      *   *Goal:* To make the reader feel the discomfort of generic "man" by experiencing the discomfort of generic "white."
      *   *Key Mechanism:* Defamiliarization (Ostranenie). Making the familiar strange to reveal hidden assumptions.

  3.  **Address Core Question 1: The "Whitepower/Whiteslaughter" Problem:**

