prompt: |-
  Help me settle an argument at a journal where I'm a handling editor. We get maybe ten submissions a month that are pseudoscience in various costumes, and the EIC wants a one page desk reject policy that a non-specialist can actually apply in fifteen minutes and defend when the author appeals. I keep saying the demarcation problem is unsolved so we shouldn't pretend to have a criterion; my colleague says pick falsifiability and be done with it.

  So: take the usual candidates — verifiability, falsifiability, Lakatos's progressive vs degenerating problem shift, fit with the surrounding paradigm, Bayesian degree of confirmation, ad hoc-ness, and the courtroom style factors (stated error rates, whether there are standards controlling the technique, general acceptance in the field) — and give each two scores out of 10, one for philosophical defensibility and one for policy usability by a tired non-expert. Flag where the two come apart most; my hunch is the most defensible ones are the least usable and vice versa, and I want to know if that's wrong.

  Then rank them on usability alone, tell me which single one you'd build the policy around, and which two, combined, would most often make us reject somthing that's actually good work. Be blunt about any candidate that sounds impressive in a seminar and is worthless at a desk. No citations, I'll add those myself if we end up using it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Handling Editor at a journal.
      *   **Problem:** High volume of pseudoscience submissions (~10/month).
      *   **Goal:** Create a one-page desk reject policy for non-specialists to apply in 15 minutes and defend on appeal.
      *   **Conflict:** User argues the demarcation problem is unsolved (no clear criterion); EIC/Colleague argues for falsifiability (just pick one).
      *   **Task:** Evaluate specific demarcation candidates (Verifiability, Falsifiability, Lakatos, Paradigm Fit, Bayesian, Ad hoc-ness, Courtroom/Daubert factors).
      *   **Scoring:** Two scores out of 10 for each (Philosophical Defensibility, Policy Usability).
      *   **Analysis:** Flag where scores diverge most.
      *   **Ranking:** Rank by usability alone.
      *   **Recommendation:** Pick the single best candidate for the policy.
      *   **Warning:** Identify the combination most likely to reject good work (false positives).
      *   **Tone:** Blunt, practical, no citations.
      *   **Constraint:** No citations.

  2.  **Evaluate Candidates:**

      *   **Verifiability (Logical Positivism):**
          *   *Defensibility:* Low. Philosophically dead. Universal statements aren't verifiable. Meaningless distinction.
          *   *Usability:* Low/Mid. Hard to check "verifiable in principle" quickly.
          *   *Scores:* Defensibility 3, Usability 4.

      *   **Falsifiability (Popper):**
          *   *Defensibility:* Mid. Better than verifiability, but too crude. Duhem-Quine thesis makes it messy (you can always save a theory with auxiliary hypotheses).
          *   *Usability:* High. Easy to ask: "What observation would prove this wrong?"
          *   *Scores:* Defensibility 6, Usability 8.

      *   **Lakatos (Progressive vs. Degenerating Problem Shifts):**
          *   *Defensibility:* High. Captures historical nuance.
          *   *Usability:* Very Low. Requires historical analysis of the research program over time. Impossible in 15 mins.
          *   *Scores:* Defensibility 8, Usability 2.

      *   **Fit with Surrounding Paradigm (Kuhn):**
          *   *Defensibility:* Low/Mid. Describes how science *works*, not how to demarcate. Risks conservatism/rejecting revolutions.
          *   *Usability:* High. Easy to check if it contradicts established basics without good reason.
          *   *Scores:* Defensibility 5, Usability 7.

      *   **Bayesian Degree of Confirmation:**
          *   *Defensibility:* High. Mathematically rigorous framework for evidence.
          *   *Usability:* Very Low. Requires priors, likelihoods, calculation. Impossible for non-specialist in 15 mins.
          *   *Scores:* Defensibility 8, Usability 1.

      *   **Ad hoc-ness:**
          *   *Defensibility:* Mid/High. Core to theory appraisal, but subjective.
          *   *Usability:* Mid. Easy to spot "making stuff up to save the theory," hard to define rigorously.
          *   *Scores:* Defensibility 7, Usability 6.

      *   **Courtroom Style (Daubert factors: error rates, standards, acceptance):**
          *   *Defensibility:* Mid. Pragmatic, legalistic, not purely philosophical.
          *   *Usability:* Very High. Checklists exist. "Has this been peer-reviewed elsewhere?" "Is there a known error rate?"
          *   *Scores:* Defensibility 6, Usability 9.

  3.  **Analyze Divergence:**
      *   *Biggest Gap:* Lakatos and Bayesian. High philosophy, zero desk utility.
      *   *Inverse Gap:* Courtroom/Daubert. Low philosophy, high utility.
      *   *User's Hunch:* "Most defensible are least usable." -> Confirmed.

  4.  **Rank by Usability:**
      1.  Courtroom/Daubert (9)
      2.  Falsifiability (8)
      3.  Paradigm Fit (7)
      4.  Ad hoc-ness (6)
      5.  Verifiability (4)
      6.  Lakatos (2)
      7.  Bayesian (1)

  5.  **Select Single Best for Policy:**
      *   Falsifiability is too easy to game ("I *could* be wrong, theoretically").
      *   Paradigm fit is too conservative (kills novelty).
      *   Courtroom/Daubert factors are designed exactly for this: gatekeeping non-experts evaluating technical claims. Specifically: *General Acceptance* and *Standards/Control*.
      *   *Decision:* Courtroom/Daubert style (specifically focusing on prior peer review and methodological standards).

  6.  **Identify Dangerous Combination (False Positives):**
      *   What kills good science?
      *   *Paradigm Fit* + *Falsifiability* (strict).
      *   Actually, *Paradigm Fit* is the biggest killer of revolutionary work. Combined with *Ad hoc-ness* (novel theories often look ad hoc initially).
      *   Let's go with *Paradigm Fit* + *Falsifiability*. If it contradicts the paradigm (e.g., early quantum mechanics, continental drift) and the author can't specify a simple falsifier immediately, it gets binning.
      *   Wait, the prompt asks for the combination that makes us reject *actually good work*.
      *   *Paradigm Fit* is the main culprit. *Ad hoc-ness* is the second. New theories often look like they violate the paradigm and require new assumptions.
      *   Let's select *Paradigm Fit* + *Ad hoc-ness*.

  7.  **Drafting the Response:**
      *   *Tone:* Professional, direct, editorial.
      *   *Structure:*
          1.  Intro (acknowledge the tension).
          2.  The Scorecard (Table or List).
          3.  The Divergence Analysis (Confirming the hunch).
          4.  Usability Ranking.
          5.  The Recommendation (Single Policy).
          6.  The Warning (False Positives).
      *   *Refinement:* Ensure the "Courtroom" factors are framed as "Methodological Standards" to sound more academic but keep the utility. Ensure the distinction between "Philosophical Defensibility" (is it true?) and "Policy Usability" (can I do it in 15 mins?) is clear.

      *(Self-Correction during drafting)*: I need to be careful with "Falsifiability." Colleagues love it, but it's a trap. A psychic can say "I might fail tomorrow." That's falsifiable but not scientific. I need to emphasize why it scores lower on defensibility.
      *(Self-Correction on Courtroom)*: Daubert is legally defensible, philosophically pragmatic. It scores well on usability because it relies on *sociological* facts (has others accepted this?) rather than *ontological* truths.

      *(Refining the "Good Work" Warning)*: The combination most likely to reject good work is *Paradigm Fit* + *Ad hoc-ness*. Revolutionary science often violates the paradigm and introduces new entities (which look ad hoc). Example: Semmelweis, Wegener, early quantum theory.

  8.  **Final Review against Constraints:**
      *   Two scores out of 10? Yes.
      *   Flag divergence? Yes.
      *   Rank on usability? Yes.
      *   Single recommendation? Yes.
      *   Two combined for false positives? Yes.
      *   Blunt? Yes.
      *   No citations? Yes.

  9.  **Final Polish:** Check the voice. It needs to sound like a peer advising an editor, not a lecturer. "Here is the reality of your situation."

      *(Wait, one detail)*: The prompt asks to "Flag where the two come apart most." I should explicitly highlight this in the analysis section.

      *(Wait, another detail)*: "Tell me which single one you'd build the policy around." I need to be decisive. The Daubert/Courtroom factors are the only ones designed for non-expert gatekeeping.

      *(Wait, another detail)*: "Which two, combined, would most often make us reject something that's actually good work." I need to be specific.

      Okay, ready to write.

      *Scoring Check:*
