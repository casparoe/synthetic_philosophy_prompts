answer: |-
  Here is the breakdown you need to resolve the argument. Your hunch is correct: the criteria that hold up best under philosophical scrutiny are useless for a fifteen-minute desk check, and the criteria that are easy to apply are philosophically leaky.

  ### The Scorecard
  *Scores out of 10. **Defensibility** = Philosophical robustness. **Usability** = Speed/clarity for a non-specialist editor.*

  | Criterion | Defensibility | Usability | Notes |
  | :--- | :---: | :---: | :--- |
  | **Verifiability** | 3 | 4 | Philosophically dead. Universal laws aren't verifiable. Hard to distinguish from "I have evidence." |
  | **Falsifiability** | 6 | 8 | Easy to ask ("What proves you wrong?"), easy to fake ("I might be wrong tomorrow"). |
  | **Lakatos (Problem Shifts)** | 8 | 2 | Requires historical analysis of the research program over years. Impossible for a desk reject. |
  | **Paradigm Fit** | 5 | 7 | Easy to check, but inherently conservative. Confuses "false" with "unfamiliar." |
  | **Bayesian Confirmation** | 8 | 1 | Mathematically sound, but requires assigning priors and likelihoods. Doable in weeks, not minutes. |
  | **Ad hoc-ness** | 7 | 6 | Intuitive, but subjective. Distinguishing a "new parameter" from a "fix" requires deep domain knowledge. |
  | **Courtroom (Daubert)** | 6 | 9 | Pragmatic. Relies on sociological facts (error rates, standards, acceptance) rather than truth claims. |

  ### The Divergence
  The gap is widest with **Lakatos** and **Bayesian Confirmation**. These are the most defensible ways to distinguish science from non-science in a seminar, but they require deep engagement with the literature and data analysis. Using them for a desk reject is administrative suicide; you will spend hours on a decision that will still be appealed.

  The inverse is **Courtroom Factors**. Philosophically, they beg the question (science is what scientists agree is science). Practically, they are the only tool designed specifically for non-expert gatekeepers evaluating technical claims.

  ### Usability Ranking (High to Low)
  1.  **Courtroom Factors** (Checklist based: error rates, standards, acceptance)
  2.  **Falsifiability** (Binary question)
  3.  **Paradigm Fit** (Comparison to textbooks)
  4.  **Ad hoc-ness** (Gut check on complexity)
  5.  **Verifiability** (Ambiguous evidence requirements)
  6.  **Lakatos** (Requires historical timeline)
  7.  **Bayesian** (Requires calculation)

  ### The Recommendation
  **Build the policy around Courtroom Factors (specifically Methodological Standards and General Acceptance).**

  Do not use Falsifiability. It is the "trap" criterion. Astrologers and homeopaths can easily state conditions under which they would be wrong, but they never test them or control for error. A non-specialist cannot distinguish a genuine falsification attempt from a performative one in fifteen minutes.

  Courtroom factors work because they shift the burden from *truth* to *process*. Your policy should ask:
  1.  Has this technique been validated with a known error rate?
  2.  Are there standards controlling the operation of this method?
  3.  Has this been subjected to peer review and publication elsewhere?

  If the answer is "no" to all three, it is not ready for your journal, regardless of whether it is "true." This is defensible on appeal because you are rejecting based on **methodological rigor**, not ontological status. You aren't saying "this is false"; you are saying "this lacks the standard controls required for scientific claims."

  ### The Danger Zone
  The combination most likely to reject actually good work is **Paradigm Fit + Ad hoc-ness**.

  Revolutionary science often violates the current paradigm (e.g., continental drift, semmelweis's hygiene, early quantum mechanics) and initially appears to require *ad hoc* assumptions to make the math work. If your policy requires new submissions to fit comfortably within existing models and prohibits new parameters that look like "fixes," you will systematically filter out high-risk, high-reward research in favor of incremental normal science.

  **Summary for the EIC:**
  Adopt the **Courtroom/Methodological Standards** approach. It admits that you cannot solve the demarcation problem, but asserts that you can enforce procedural standards. It is the only criterion that allows a non-specialist to reject a paper in fifteen minutes without needing to prove the author is wrong, only that they haven't followed the rules of evidence.
