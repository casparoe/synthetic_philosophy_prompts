      *   Lakatos: Def 8, Use 2. (Great theory, requires history book).
      *   Paradigm: Def 5, Use 7. (Descriptive, conservative, easy to check).
      *   Bayesian: Def 8, Use 1. (Math heavy, impossible for quick check).
      *   Ad hoc: Def 7, Use 6. (Subjective, but intuitive).
      *   Courtroom: Def 6, Use 9. (Pragmatic, checklist based).

      *Divergence:* Lakatos/Bayesian vs Courtroom.
      *Ranking:* Courtroom > Falsifiability > Paradigm > Ad hoc > Verifiability > Lakatos > Bayesian.
      *Pick:* Courtroom (specifically Methodological Standards/Peer Review history).
      *Danger:* Paradigm + Ad hoc.

      Let's assemble.

      *(Final thought on "Courtroom")*: Call it "Methodological Standards & Acceptance" to fit journal context better, but acknowledge it's the Daubert logic. Actually, the prompt calls it "Courtroom style factors," so I should stick to that terminology for clarity.

