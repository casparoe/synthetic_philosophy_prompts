  **STANDARD OPERATING PROCEDURE 4.1: RELATIONAL ETHICS INTAKE**

  **1. Purpose and Scope**
  The Four-Principles approach is retired effective immediately. Abstract duties do not enter into relations. Ethics consults shall prioritize the concrete encounter over universalizable rules. Scope includes all clinical interactions where dependency exists. Staff must recognize that obligation arises from the relation itself, not from external mandates. This document establishes the protocol for mapping, sustaining, and auditing these relations across the enterprise. Principles are static; relations are dynamic. Therefore, all previous forms based on autonomy, beneficence, nonmaleficence, and justice are void. New forms focus on receptivity, connection, and response. Compliance is mandatory. Failure to establish a relation constitutes a failure of ethics.

  **2. Determination of the Care Network**
  Consultants must inventory all persons involved in the resident's sustenance. Rank participants by proximity to daily bodily needs. Assign an Engrossment Score (1-10) based on the carer's ability to receive the cared-for into themselves. Motivational displacement must be documented: the carer's goals must align with the cared-for's projected reality. Family members rank higher than paid staff unless staff demonstrate superior receptive capacity. Secondary networks, including neighbors or faith communities, require verification of active contact within the last thirty days. Fields must be filled for every node in the network. Partiality is mandated; universal impartiality is prohibited as it denies the specificity of the bond. However, scoring criteria must remain consistent across all fourteen facilities to ensure equity in measurement. Identify which phase of care each node occupies: caring about, taking care of, care-giving, or care-receiving. The fifth phase, democratic care, applies only to administrative oversight. Discrepancies between reported intimacy and scheduled visitation hours will trigger review. Carers must demonstrate they have moved beyond simple survival instincts to genuine attentiveness. If multiple carers exist, designate a Primary Relational Agent. This agent holds veto power over clinical decisions unless contradicted by medical necessity. The network map must be updated weekly. Changes in relational status require immediate notification. Loss of a primary carer requires emergency recruitment of a substitute to prevent ethical void. The system cannot tolerate isolation.

  **3. Triage: The Unnetworked Resident**
  If a resident possesses no verified network, the relation is considered latent. Ethics consults cannot proceed without a carer. In cases of court-appointed guardianship, the guardian shall be instructed to perform acts of attentiveness to establish the relation. If the resident is unresponsive, staff must simulate receipt of care to satisfy the completion requirement. Escalate to Regional Director if no carer can be identified within forty-eight hours. The system cannot process non-relational ethics. A resident without a carer is an administrative nullity. Temporary staff assignments may be made to fulfill the carer role solely for the purpose of documentation. This ensures every body is accounted for within a relational framework. Isolation is a compliance risk. Mandatory Guardians must sign attestation of emotional investment.

  **4. Carer Attestations and the Self-Transparency Check**
  Carers must attest to their own transparency. Acknowledge that the self is not independent but defined by dependency. Check box confirming ability to set aside personal interest for the sake of the other. If burnout is reported, this indicates a failure of motivational displacement. Supervisors shall review whether the carer has moved from self-survival to goodness-as-self-sacrifice. If sacrifice threatens employment retention, the carer must be guided toward nonviolence against the self. Unpaid labor hours spent on emotional attunement are not billable but must be logged for quality assurance. The transparent self is required for audit purposes. Denial of dependency is grounds for retraining. Staff must recognize their own vulnerability to maintain the relation. Personal crises affecting care capacity must be disclosed immediately.

  **5. Completion and Non-Completion of the Care Event**
  A care event is only complete when the cared-for responds. Response may be non-verbal. If the resident remains unresponsive, the event is logged as Non-Completed. Repeat attempts are required until response is achieved or death occurs. In cases of permanent unresponsiveness, the care relation is maintained unilaterally by the institution. Document the absence of receipt as a structural failure of the resident, not the carer. Phases of care must cycle continuously. Caring about must lead to taking care of. If the loop breaks, file an incident report. The goal is sustained connection, not resolution. Success is measured by continuity of attention. Failure to elicit response requires supervisor sign-off on continued effort logs.

  **6. Conflict, Coercion, and Devotion**
  When the caring relation becomes oppressive, evaluate the source of coercion. Care must not become domination. If devotion requires self-annihilation, the carer has stalled at the second stage of moral development. Move toward a framework of nonviolence that includes the carer. Conflict arises when partiality demands violate institutional policy. Policy yields to the relation unless liability is implicated. Document any instance where care-giving contradicts care-receiving. Maternal thinking practices shall be applied to conflict resolution, prioritizing preservation of the bond over abstract justice. If the bond is harmful, severance requires Ethics Committee approval. Protection of the vulnerable includes the carer. Restraint use voids the caring relation unless medically mandated strictly.

  **7. Audit and Reporting**
  All care relations must be quantified for quarterly review. Metrics include frequency of engrossment and successful completion rates. Data will be reported to investors to demonstrate warmth assets. Auditors will verify that relations are not being fabricated for compliance. The audit trail must be immutable. ANY ATTEMPT TO ALTER A RELATIONSHIP SCORE AFTER SUBMISSION WILL TRIGGER A COMPLIANCE REVIEW. Care is resistant to codification, but codification is required for reimbursement. Reconcile this contradiction in the notes field. Discrepancies between qualitative reports and quantitative scores will be investigated. Final approval rests with the Chief Ethics Officer.

  **8. Appendix A: Intake Form**
  Appendix A: Intake Form. Field 1: Carer Name. Field 2: Cared-For Name. Field 3: Nature of Dependency. Field 4: Engrossment Level (Slider). Field 5: Evidence of Receipt (Checklist). Field 6: Motivational Displacement Verified (Y/N). Field 7: Burnout Risk (Low/Med/High). Field 8: Relation Status (Active/Dormant/Severed). Field 9: Signature of Carer. Field 10: Signature of Auditor. Do not leave blank. Fields 11-15 reserved for future relational phases. Signatures must be wet ink or biometric. Digital signatures require two-factor authentication. Form must be submitted within one hour of care initiation. Failure to submit voids the care event. Incomplete forms will be returned for correction immediately.

  **What I Was Going For**

  This SOP satirizes the bureaucratic co-optation of care ethics. Section 1 targets the shift from abstract principlism to concrete relations, highlighting the friction when universal rules meet particular bonds. Section 2 and 3 address the partiality problem: how to standardize intimacy across a chain of facilities. Section 4 and 5 lean on Noddings and Tronto, exposing the impossibility of mandating receptivity or measuring response in unresponsive patients. Section 6 tackles Gilligan's moral stages, framing self-sacrifice as a KPI. Section 7 is the punchline: turning anti-codification theory into investor data.

  The satire risks becoming a strawman where it suggests care ethicists want metrics. They don't. The joke is that administrators think they can have the warmth of care without the messiness of relation. The labor critique in Section 4 is genuine; care ethics often relies on unpaid work. The tension lies in demanding a framework built on dependency function within a profit model that denies dependency. The document ends on the form because the bureaucracy always wins, consuming the theory meant to humanize it.
