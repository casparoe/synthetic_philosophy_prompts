prompt: |-
  Okay, favor time, and it's half joke and half genuine gripe. I coordinate clinical ethics consults for a mid-size eldercare and rehab system in the Midwest — nursing homes, assisted living, a couple of inpatient psych units. We got bought by a private equity firm last spring, and in the fall the new owners announced in a slide deck that our ethics consultation service was transitioning from a principlist model to a relational care model, mostly because somebody's consultant read a summary of care ethics and liked that it sounded warm and didnt cost anything. So now I'm supposed to write the intake paperwork. I've decided the only way to survive this is to write the document I think they're actually asking for, at full deadpan compliance-register fidelity, and circulate it to my department.

  So: a parody of that internal standard operating procedure, about 1,100 words, formatted like a real hospital SOP — numbered sections, short imperatives, a form field here and there, one all-caps note about the audit trail. The voice is institutional, not jokey: nobody in the document is trying to be funny and there should be no winking at the reader. All the humor comes from the theory being applied accurately and seriously. Keep these sections, in this order: (1) Purpose and Scope, ~80 words, which explains that the four-principles approach has been retired because principles do not enter into relations; (2) Determination of the Care Network, ~200 words, the relationship inventory — who counts as a carer, how they're ranked, the scored field for level of engrossment; (3) Triage: The Unnetworked Resident, ~150 words, the escalation pathway for a patient who has nobody; (4) Carer Attestations and the Self-Transparency Check, ~150 words, including the burnout clause; (5) Completion and Non-Completion of the Care Event, ~150 words, i.e. what an aide files when the cared-for never responds; (6) Conflict, Coercion, and Devotion, ~150 words, for when the caring relation is itself the problem; (7) Audit and Reporting, ~120 words; (8) Appendix A: Intake Form, ~100 words, left blank and absurd.

  Content-wise I want it to get care ethics right rather than strawman it, so work in the actual machinery: Noddings on the carer's engrossment and motivational displacement, and on the relation only being completed when the cared-for responds; Gilligan's different voice and her movement from self-survival to goodness-as-self-sacrifice to nonviolence; Tronto and Fisher's phases — caring about, taking care of, care-giving, care-receiving — plus whatever you want to do with the later, more political fifth phase; Kittay's dependency critique and her attack on the transparent self; Held's point that contract models miss the relations we're born into; Ruddick's maternal thinking if it fits naturally. Then have the document trip over the real pressure points without ever admitting they're pressure points: the stranger problem (a resident whose only visitor is a court-appointed guardian), the fact that partiality is supposed to be the whole point but a chain of fourteen facilities needs one rule that applies everywhere, the unpaid-and-now-underpaid labor question, and the deep irony that a framework built on the claim that care resists codification has just been turned into a scored, auditable KPI that someone in section 7 is going to report to investors. Rules: no real named people and no quotes from real books — use the terminology freely but paraphrase, don't put anyone's words in quotation marks. Don't resolve the tension; the thing should end on a form somebody has to fill out.

  After the SOP, add one short section titled What I Was Going For, about 150-200 words, telling me which real debate each section is aimed at and where you think the satire stops being fair to care ethics and starts being a straw man.
