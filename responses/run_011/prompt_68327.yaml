answer: |-
  Your diagnosis is largely correct, but it needs a sharper edge. You're right that the stalemate isn't primarily empirical in the sense of "who has the better vignette data?" It's a collision between two incompatible definitions of what a psychological explanation *is*. However, calling it merely "different explananda" might be too charitable. It's more accurate to say it's a fight over **cognitive architecture** that is currently being fought with the wrong weapons (behavioral outcomes rather than process data).

  Here is the argument for your diagnosis, grounded in what the Competence and Pragmatic camps actually claim, followed by the one place where the empirical ghost still hides.

  ### The Diagnosis: A Clash of Explananda

  You hit the nail on the head: the debate stalls because "Concept" is doing two different jobs for the two sides, and both sides are using the word to claim the same territory.

  **The Competence Side (Moral Constitution):**
  When the competence defender says moral considerations are "built into the concept," they aren't necessarily claiming there's a little "moral tag" in the semantic definition of *intentional* in the dictionary sense. They are claiming that the **folk psychological capacity** itself is normative. For them, the explanandum is *the structure of folk psychology*. If the folk consistently judge harm as intentional and help as unintentional, that *is* the concept. Stability under reflection, cross-linguistic robustness, and persistence despite debriefing are the gold standards here because they suggest a deep cognitive structure.
  *   **The Move:** Any variation in the data (like your pilot's "sacrifice" condition) is treated as noise or a feature of the specific moral landscape, not a bug in the concept. They absorb pragmatic data by claiming that conversational norms are just another layer of the moral competence they are studying.

  **The Pragmatic/Performance Side:**
  When the pragmatic defender says this is about "conversational load" or "blame ascription," they are claiming the explanandum is *the neutral cognitive machinery plus social context*. They assume there is a "pure" intentionality detector that is being modulated by moral pressure. For them, the asymmetry is a performance error relative to the "real" concept.
  *   **The Move:** Any stability in the data (like cross-linguistic persistence) is treated as evidence of how deeply entrenched the pragmatic habit is. They absorb competence data by claiming that deep-seated social habits look exactly like semantic rules from the outside.

  **Why the Empirics Fail:**
  This is where your frustration is justified. As long as the data consists of **binary judgments on vignettes**, the two views are observationally equivalent.
  *   If subjects say "intentional" in the harm case:
      *   Competence says: "See? The concept includes blame."
      *   Pragmatics says: "See? The blame pressure forced the label."
  *   If subjects say "unintentional" in a modified case:
      *   Competence says: "The moral valence shifted, so the concept application shifted."
      *   Pragmatics says: "The conversational pressure lifted, so the bias vanished."

  Because both sides can claim the *output* (the judgment) as their primary evidence, no amount of vignette-tweaking will separate them. Your pilot study proved this: the "sacrifice" condition changed the output, and both sides claimed the change validated their model of *why* it changed. One saw it as evidence of evaluative stance (Competence/Stance), the other as heightened moral salience driving pragmatic attribution (Pragmatics/Affect).

  ### The Hidden Empirical Disagreement

  Is there a hidden empirical disagreement wedged in there? **Yes, but it's not about judgments; it's about processing.**

  The diagnosis that this is *only* about explananda assumes that the two theories are merely redescriptions of the same behavioral curve. They aren't. They make different claims about **cognitive architecture**.

  1.  **Integration vs. Modulation:** The Competence view implies that moral evaluation and intentionality detection are **integrated** at the retrieval or representation level. The Pragmatic view implies they are **modular**, with moral evaluation acting as a post-hoc filter or a parallel input that biases the output.
  2.  **The Crux:** This predicts different **reaction times (RT)** and **neural signatures**.
      *   **Competence Prediction:** In the harm case, moral valence and intentionality are part of the same representation. Judging "intentional" should be fast and fluent because the moral badness *constitutes* the intentionality. There should be no interference cost.
      *   **Pragmatic Prediction:** The agent has to compute the neutral intentionality first, then apply the moral pressure to adjust the label. This should create **interference** or specific activation in conflict-monitoring regions (like the ACC) when the neutral facts (side effect) clash with the moral demand (blame).

  **Why this hasn't settled it yet:**
  Process data is messy. RT studies have been run, and results are mixed. fMRI studies show overlap between ToM and moral networks, which both sides claim as support (Integration vs. Interaction). But this *is* the empirical wedge. If you could show definitively that the asymmetry disappears in a task that removes the *possibility* of communication (e.g., a non-social prediction task where "blame" is impossible), the Pragmatic side would take a massive hit. Conversely, if the effect persists in pre-linguistic infants (who lack conversational norms but might have normative expectations), the Pragmatic side (specifically the Gricean version) is dead.

  ### What Counts as Progress?

  If your diagnosis is right—that this is a meta-theoretical standoff masquerading as an empirical one—then more vignette studies are waste. Progress requires one of three moves:

  1.  **Formal Cognitive Modeling:**
      We need a computational model that forces a trade-off. Currently, both theories are qualitative and flexible. A Bayesian model or a neural network model that specifies *where* the moral parameter enters the equation could make the views distinguishable. If the model only fits the data when the moral parameter is at the *input* layer (Competence) vs. the *output* layer (Pragmatics), we have a real test. Until then, they are just stories.

  2.  **Conceptual Engineering (The Dissolution):**
      This is the honest move if the modeling fails. We stop asking "What does 'intentional' *mean*?" and start asking "What function does this judgment serve?"
      *   If the function is **prediction**, the Pragmatic view wins (we blame to deter, not to describe).
      *   If the function is **normative alignment**, the Competence view wins (we call it intentional to mark it as a violation).
      *   Progress here isn't finding the truth of the concept, but deciding which concept we *want* to use in law, ethics, and science. We might conclude the folk concept is broken for scientific purposes and stipulate a new one.

  3.  **Redivision of the Question:**
      Split the explanandum. Admit that there is a "narrow" intentionality concept (purely causal/volitional) and a "broad" responsibility concept (which includes moral valence), and acknowledge that the word "intentional" ambiguously straddles both depending on context. The Knobe Effect isn't a puzzle about *one* concept; it's evidence that we are using one word for two distinct cognitive processes that usually align but come apart in side-effect cases.

  ### Verdict

  Your diagnosis is **80% right**. The stalemate is sustained by the fact that both sides are using behavioral output to prove architectural claims, which is underdetermined. They are fighting over what counts as a "concept" (a stable judgment pattern vs. a neutral mental representation).

  However, don't concede that *no* empirical disagreement exists. There is one about **modularity and timing**. The problem is that the field has been unwilling to abandon the vignette paradigm for process data. If you want to break the stalemate, stop running vignettes. Build a model that forces the moral variable to be either a constituent or a modifier, and then test the processing predictions. If even *that* gets absorbed by theory-laden interpretation, then your diagnosis is 100% right, and the only honest move is Conceptual Engineering: admit the folk concept is a muddle, and stop trying to clean it up with experiments.
