      *   **Mechanism:** Widespread enhancement becomes the new normal. What was once enhancement becomes therapy (to restore the new normal).
      *   **Implication:** A policy allowing therapy but banning enhancement isn't conservative; it inevitably expands the scope of therapy. The distinction tracks past uptake rather than constraining future practice based on nature.
      *   **Key Sections:**
