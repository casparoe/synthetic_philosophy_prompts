answer: |-
  Here is a plan for the session that keeps the mathematics accessible while preserving the philosophical sting of the paradox. You do not need to rebuild the St Petersburg game from the ground up, but you do need to remind them why we care about expected value in infinite games. Spend the first ten minutes merely establishing that expected value is defined as the sum of probability times payoff over all possible outcomes, and use St Petersburg only to show that this sum can diverge to infinity. You can write the St Petersburg payoffs on the board to show they grow exponentially while probabilities shrink exponentially, leading to a sum of ones that diverges, but do not get bogged down in the utility responses or the history. The only thing they need to carry forward from St Petersburg is the rule that we sum over the sample space and the warning that infinite sums can behave badly. Once that is established, you can pivot immediately to the harmonic series. You should absolutely get the harmonic series on the board before showing them the alternating version because you need them to feel the divergence first. Write out the sum of one over n and remind them it blows up, then write out the Pasadena payoffs which look like the alternating harmonic series scaled by one hundred. This contrast is your engine. If they see the absolute values sum to infinity but the alternating sum converges conditionally, you have set the trap perfectly.

  Regarding your worry about truncating the game, capping the game at the first hundred terms is a trap if you present it as the game itself. A truncated game has a perfectly well-defined expected value, and if you tell them you are analyzing a hundred-toss game, you have dissolved the paradox. Instead, use the truncation only as a computational device to inspect the partial sums of the infinite series. You can ask them to calculate the expected value if the game stops at toss n, and show them on the board how that partial sum oscillates as n increases, never settling on a single limit unless you fix the order of summation. This allows them to compute concrete numbers without lying about the game being finite. The carrying example should remain the infinite coin flip game, but your pedagogical tool is the sequence of partial sums. You want them to see that as you include more terms, the running total wobbles, and that wobble is what prevents a stable expectation from existing.

  You do not need to teach the Riemann rearrangement theorem properly, and attempting a proof will eat twenty minutes you do not have. Instead, gesture at it by physically shuffling the terms on the board. Write out the first few positive terms and the first few negative terms, then group them differently to show you can make the sum larger or smaller. The key insight you need to land is that the order of summation is a mathematical choice, not a physical constraint. This leads directly into the biggest misconception you will face, which is the student who insists that reordering the terms is cheating because the coin flips happen in a fixed temporal order. You need to head this off the moment you introduce the expectation formula. Remind them that expected value is a sum over the sample space of outcomes, which is a set, not a sequence. The coin flips happen in time, but the expectation calculation sums over the possibilities simultaneously. There is no physical reason to sum the outcome of the first toss before the outcome of the second toss when calculating the expectation. The temporal order of the experiment does not dictate the order of summation in the definition of expectation. If you let this slide, half the room will leave thinking the paradox is just a trick of notation.

  Another misconception you listed is the student who concludes the game is worth about sixty-nine dollars. This comes from accepting the natural order of the series as the correct one. You need to explain that while the natural order gives ln two times one hundred, any other order gives a different number, and since the series is not absolutely convergent, no order is privileged. If the value depends on how you do the arithmetic, then the value is not a property of the game. This bridges to the third misconception, that expected value is broken. You should validate this intuition slightly but clarify that expected value is only defined for absolutely convergent series. When the series is conditionally convergent, the expectation is undefined. This brings me to the slogan question. You should tell them the gamble has no expected value. Saying it has one but the number is not pinned down is too vague and invites the idea that there is a true value hidden somewhere. The mathematically honest position is that the expectation does not exist because the integral of the absolute value of the payoff is infinite. When a student pushes on this, tell them that a number that changes when you change your calculator settings is not a number you can use for decision making.

  For the final question to test whether it landed, ask them to explain why grouping the terms of the series differently corresponds to a valid calculation of expected value even though it changes the result. You are looking for them to articulate that the definition of expectation requires summing over the sample space and that without absolute convergence, the sum depends on the enumeration of that space. As for what you must cut, you cannot handle measure theory or the rigorous definition of Lebesgue integration in seventy-five minutes. If someone asks why we do not just use Lebesgue integration, tell them that Lebesgue integration also requires absolute convergence for the integral to be defined in this context, so it does not save us. You also cannot handle alternative decision rules like utility theory in any depth. Mention that real agents have finite bankrolls or diminishing marginal utility, which dissolves the paradox practically, but emphasize that logically, within the idealized framework of expected value theory, the paradox stands. Do not let the discussion drift into whether anyone would actually play the game, because the paradox is about the coherence of the theory, not the psychology of the player. Stick to the math of the sum and the definition of expectation, and you will get them to the right place without running out of time.
