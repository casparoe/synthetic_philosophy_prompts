          *   In AI, the AI is the active agent. The human is the supervisor.
          *   *Mapping:* The AI is a *Active Component with Agency*. This breaks the model. In nuclear, a pump doesn't decide not to pump because it calculated a better outcome.
          *   *Role:* The Human becomes the *Final Physical Barrier* (like containment but decision-based).

      *   *Single-Failure Criterion:*
          *   AI Control = One layer. AI Alignment = Another layer.
          *   If Control fails (box broken) AND Alignment fails (goals wrong), you have a CCF.

