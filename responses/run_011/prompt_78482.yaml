      *   *Alignment -> Design Intent/Control Logic?*
          *   In nuclear, systems are designed to *do* specific things (scram on high pressure).
          *   *Mapping:* Alignment is the *Control Logic Setpoint* + *Operator Intent*. It's about the system "wanting" the right outcome.
