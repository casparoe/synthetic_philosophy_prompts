      *   *Design-Basis Accident (DBA):* Events the plant is built to withstand.
      *   *Beyond-Design-Basis Accident (BDBA):* Events like Fukushima (multiple failures, unforeseen).
      *   *Single-Failure Criterion:* System must work if one active component fails.
      *   *Common-Cause Failure (CCF):* One event takes out multiple redundant trains.
      *   *Technical Specifications (Tech Specs):* Operational limits.
      *   *Safety Margins:* How much room before failure.
      *   *Operator:* The human decision-maker.

