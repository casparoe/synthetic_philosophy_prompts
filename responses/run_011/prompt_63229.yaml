answer: |-
  # Preparation Sheet: Q&A Strategy

  ## Pre-emptive Concessions (First 5 Minutes)
  *Make these early, in your opening remarks, to disarm the Sinologists before they formulate their objections.*

  1.  **On "Role-Ethics" as Terminology:** Explicitly state that "role-ethics" is a modern reconstructive category (associated with scholars like Ames and Hall), not a translation of an ancient term.
      *   *How to say it:* "I am aware that 'role-ethics' is a contemporary reconstruction of early Chinese thought, not a native category. I am using it as a heuristic license, not claiming it is a philological fact."
      *   *Why:* Prevents the Philologist from accusing you of anachronism.
  2.  **On Mencius and Interiority:** Acknowledge that the Mencian "sprouts" (*duan*) complicate the "no interiority" claim.
      *   *How to say it:* "I know the Mencian tradition argues for inner sprouts of virtue. My novel aligns more with the earlier, performative emphasis on ritual (*li*) and naming (*zhengming*), acknowledging this is a specific slice of the tradition."
      *   *Why:* Shows the Comparative Philosopher you aren't ignorant of the counter-evidence.
  3.  **On the Novel as Philosophy:** Admit the book is a fictional experiment, not a treatise.
      *   *How to say it:* "This is a novel testing a hypothesis, not a proof of it. If the philosophy breaks, I hope the story holds."
      *   *Why:* Lowers the stakes for the Analytic Philosopher; you are a novelist, not a rival system-builder.

  ---

  ## The Objections (Ordered by Likelihood and Damage)

  ### 1. The MFA Student (The Gimmick Charge)
  **Voice:** Nervous but blunt, eager to sound rigorous.
  **Objection:** "You've listed a lot of constraints: no psychological verbs, relational naming, inventories. How do we know this isn't just an Oulipo-style constraint game dressed up as metaphysics? What stops this from being a gimmick that creates the *appearance* of depth without the work?"
  **Your Reply:** "A constraint is a gimmick if it serves the ego of the writer; it's a method if it serves the ontology of the world you're building. If I write 'he felt sad,' I am lying about a world where sadness is a social debt, not a feeling. The inventory isn't a puzzle; it's the only truthful description available in that universe. If it feels like a gimmick, that's because we're trained to expect the lie of interiority."
  **Softness Note:** This relies on the assertion that your ontology is "truthful." It begs the question.
  **Next Move:** They will ask: "But doesn't the reader's struggle to decode the names just create *more* interior speculation, not less?"
  **Scholarship Status:** **Settled:** Constraints can be philosophical. **Contested:** Whether this specific constraint achieves the stated goal.

  ### 2. Novelist #1 (The Empathy Problem)
  **Voice:** Pragmatic, tired, hands folded.
  **Objection:** "I write characters. I need to know what they want. If you remove desire and interiority, how do you sustain narrative drive? Doesn't the reader just stop caring because there's no one *home* to suffer?"
  **Your Reply:** "Readers care about stakes, not secrets. In my book, the stake is the stability of the network. When a role is vacated, the network frays. That is the suffering. It's not 'I am sad,' it's 'The ritual is broken.' We feel the breakage in our own social bodies. You don't need a soul to feel a broken bone."
  **Softness Note:** You are redefining "suffering" to bypass the need for a subject.
  **Next Move:** They will ask: "Can you sustain that for 300 pages without the reader getting fatigued?"
  **Scholarship Status:** **Settled:** Narrative drive usually requires desire. **Contested:** Whether relational stakes can replace psychological stakes.

  ### 3. Narratologist #1 (Theory of Mind)
  **Voice:** Cognitive, precise, slightly patronizing.
  **Objection:** "Cognitive narratology shows readers mentalize compulsively. We project minds into text involuntarily. By refusing to give us interiority, you aren't removing the self; you're just making the reader work harder to construct it. You haven't eliminated the residue; you've just externalized the labor of manufacturing it."
  **Your Reply:** "I accept readers will mentalize. But there is a difference between a text that *invites* you to inhabit a mind and one that *blocks* the entry. I am building a wall, not a maze. If the reader projects a self despite the wall, that proves the strength of their habit, not the existence of the character's self. I am training the reader to stop, not helping them start."
  **Softness Note:** You are claiming authorial control over reader response that you don't actually have.
  **Next Move:** They will ask: "But if the effect is the same (a reader imagining a self), does the method matter?"
  **Scholarship Status:** **Settled:** Readers mentalize involuntarily. **Contested:** Whether textual resistance can alter that cognitive habit.

  ### 4. The Philologist (The "Li" vs. "Role" Charge)
  **Voice:** Sharp, impatient, protective of the texts.
  **Objection:** "You're using the word 'role' like it's a sociological function. The early texts speak of *li* (ritual) and *zhengming* (rectification of names). These are moral and cosmic, not just social slots. By reducing them to 'roles,' you're stripping the sacred obligation out of the relationship and making it sound like a job description."
  **Your Reply:** "You're right that 'role' is a modern, thin word. I use it to stress the structural necessity over the emotional content. But in the novel, the 'obligation' is the sacred part. When the Third Uncle fails the role, it's not a firing; it's a cosmic collapse. I'm using 'role' to get the structure right, but the weight comes from the consequence."
  **Softness Note:** You are admitting "role" is inadequate but keeping it for utility.
  **Next Move:** They will ask: "Then why not use the vocabulary of ritual if that's what you mean?"
  **Scholarship Status:** **Settled:** *Li* is more than "role." **Contested:** Whether "role-ethics" is a valid translation of *li* for modern audiences.

  ### 5. Narratologist #2 (Reference and Identity)
  **Voice:** Formalist, dry, focused on mechanics.
  **Objection:** "Your naming scheme—Third Uncle, Assessor, Old Man—isn't metaphysics; it's a breakdown of reference. If the same man is three names, how does the reader track identity? You're claiming this proves identity is relational, but it looks like you've just broken the chain of reference required for narrative coherence."
  **Your Reply:** "The reader tracks them by the network, not the tag. If the Assessor owes grain to the Magistrate, and the Old Man owes grain to the Magistrate, the debt links them. Identity isn't a tag you carry; it's the sum of your debts. If the reader loses track, that's the point: they are looking for a 'who' instead of a 'where'."
  **Softness Note:** Risks admitting the book is confusing.
  **Next Move:** They will ask: "Is confusion a valid aesthetic goal, or just a failure of communication?"
  **Scholarship Status:** **Settled:** Reference requires stable identifiers in standard narrative. **Contested:** Whether unstable reference can produce philosophical insight.

  ### 6. The Comparative Philosopher (The Mencian Sprouts)
  **Voice:** Gentle but firm, textual authority.
  **Objection:** "You mentioned the Confucian sense of humanness. But Mencius argues the virtues are inner sprouts (*duan*). We cultivate them, but they start inside. If you deny any inner residue, you aren't just ignoring Western interiority; you're ignoring the Confucian claim that righteousness has an internal source. You're reading the tradition as purely external."
  **Your Reply:** "I am aligning with the earlier, pre-Mencian emphasis where the ritual *makes* the virtue, not the other way around. I am writing a world before the sprouts grow. If Mencius says there's an inner seed, my novel asks: what if the soil is all there is? I'm testing the limit of the externalist reading."
  **Softness Note:** You are admitting you are cherry-picking a specific historical layer of the tradition.
  **Next Move:** They will ask: "But is that layer coherent without the later psychological development?"
  **Scholarship Status:** **Settled:** Mencius argues for inner sprouts. **Contested:** Whether early Confucianism (pre-Mencius) excludes interiority entirely.

  ### 7. The Graduate Student (The Scholarly Consensus Trap)
  **Voice:** Aggressive, eager to display knowledge of the debate.
  **Objection:** "The role-ethics reconstruction is a minority view in Sinology. Many scholars argue it imposes a modern sociological framework on texts that are about family feeling and cosmic harmony. You're building your novel's metaphysics on a scholarly hypothesis that half the room disagrees with. Are you comfortable basing your art on a contested footnote?"
  **Your Reply:** "Novelists don't wait for consensus. Physicists write about time before they agree on what it is. I found in role-ethics a vocabulary that licensed the absences I needed to write. If the scholarship is live, the question is live. I'd rather write into the controversy than the consensus."
  **Softness Note:** This dismisses the scholarly rigor they value. It sounds like "I'm an artist, facts don't matter."
  **Next Move:** They will ask: "But you're claiming this *is* Confucian humanness, not just a useful fiction."
  **Scholarship Status:** **Settled:** Role-ethics is a contested reconstruction (Ames/Hall vs. others). **Contested:** Whether it faithfully represents early Chinese thought.

  ### 8. The Analytic Philosopher (The Refusal Trap)
  **Voice:** Calm, logical, setting a trap.
  **Objection:** "You say the person is a locus of roles. But you have a scene where a character refuses a role. You call it a catastrophe. But to refuse a role, there must be an agent distinct from the role doing the refusing. If the person *is* the roles, refusal is impossible. If refusal is possible, the person is *more* than the roles. Doesn't your own plot prove your thesis false?"
  **Your Reply:** "Refusal isn't an act of a self; it's a system failure. When a gear strips, it doesn't 'choose' to stop turning; it breaks. The catastrophe is that the network cannot process the vacancy. The 'agent' you see is the noise of the breakdown. I'm not showing a self escaping a role; I'm showing a role collapsing and taking the locus with it."
  **Softness Note:** This is your hardest sell. It requires denying the phenomenology of choice.
  **Next Move:** They will ask: "But who experiences the catastrophe? If there is no self, who suffers the collapse?"
  **Scholarship Status:** **Settled:** Agency usually presupposes an agent. **Contested:** Whether "role-ethics" can account for moral failure without positing an inner agent.

  ### 9. Novelist #2 (The Craft Question)
  **Voice:** Blunt, skeptical of theory.
  **Objection:** "Does this method actually make the book better? Or does it just make it harder to read? If the philosophy works but the novel is dry, have you succeeded as a novelist or failed as one?"
  **Your Reply:** "It makes the book truer to its own world. If that world feels dry to a reader expecting psychological realism, that's a mismatch of expectation, not a failure of craft. I'd rather write a dry truth than a wet lie."
  **Softness Note:** "Truer" is an undefended aesthetic claim.
  **Next Move:** They will ask: "Who is the reader you are writing for, then?"
  **Scholarship Status:** **Settled:** Novels need to engage readers. **Contested:** Whether "truth" to a system outweighs reader engagement.

  ### 10. The "One Question I Hope Nobody Asks"
  **The Question:** "You are a Western novelist using a contested reconstruction of Chinese philosophy to justify removing psychological depth from your characters. Are you not instrumentalizing a living tradition to solve a Western aesthetic problem, effectively using these scholars as a shield against the demand for humanism in your own work?"
  **Why this is the killer:** It attacks your *entitlement* to the material, not just your logic. It suggests you are colonizing the philosophy for aesthetic convenience. The Grad Student asks about consensus; this question asks about *moral right*.
  **Your Reply:** "I am not claiming to practice Confucianism. I am using a philosophical tool to interrogate the Western novel's obsession with the self. If that is instrumentalization, then all cross-cultural philosophy is instrumentalization. I am being open about the borrow. I'd rather borrow honestly than pretend my skepticism is native."
  **Softness Note:** This admits the instrumentalization but defends it as standard philosophical practice. It risks sounding defensive.
  **Strategy:** If this comes, **concede the instrumentalization.** Do not fight it. Say: "Yes, I am using it as a tool. I am a novelist, not a disciple. The test is whether the tool builds something that stands."
  **Scholarship Status:** **Settled:** Cross-cultural philosophy involves selection/adaptation. **Contested:** The ethics of that adaptation (appropriation vs. dialogue).

  ---

  ## Critical Scholarship Markers (For Your Mental Map)

  *   **Role-Ethics (Ames/Hall):** **Contested.** It is a specific reconstruction, not the consensus view of early Confucianism. Many Sinologists prefer "Virtue Ethics" or "Ritual Ethics."
  *   **Interiority in Early China:** **Contested.** Some argue early texts are purely performative/ritualistic (no interiority); others (like Mencius scholars) argue for inner moral sprouts. You are taking the "no interiority" side, which is the minority/earlier view.
  *   **Refusal/Agency:** **Contested.** Role-ethics struggles to explain moral failure or dissent without positing an inner agent. This is a known weak point in the theory you are using.
  *   **Li (Rual) vs. Role:** **Settled** among Philologists that *Li* is richer than "role." You are simplifying for the novel.

  ## Final Advice on the "Refusal" Trap
  The Analytic Philosopher (Objection 8) is your greatest logical threat. Your reply about "system failure" is the only way out. Do not claim the character "chooses." Claim the character "breaks." If you admit choice, you admit a self. Stick to the metaphor of mechanics/network failure. It is your only shield.
