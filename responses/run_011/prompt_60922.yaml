answer: |-
  Here are 9 rigorous questions designed to corner the "matter of degree" defense, ordered to build pressure from phenomenology to ontology to falsification.

  ### 1. The Grandmother Problem (Phrases vs. Intent)
  **Question:** My aunt has started saying my dead grandmother's exact turns of phrase and making her little noises of disapproval. Half my family finds it comforting, half finds it creepy. On your view, a self is a pattern instantiated in other brains. But I need to know: when my aunt says those phrases, is what's running on her hardware just the *output* (the phrases), or is it the *drive* to say them? Is she simulating Grandma's voice, or is she running Grandma's want?

  **Follow-up A (If he says it's just the output/voice):** Then we're talking about mimicry, not survival. A parrot can instantiate the pattern of a phrase without instantiating the self. Why doesn't that reduce your view to a fancy way of saying "people imitate each other"?
  **Follow-up B (If he says it's the drive/want):** How do you verify that? Because if she has Grandma's wants, she should have Grandma's conflicts. My aunt doesn't seem conflicted the way Grandma was. She seems sure.
  **My Bet:** He'll take **B**. He needs the "want" for it to count as a self. Push him on the *conflict* missing in the simulation.

  ### 2. Saved Game vs. Replay File
  **Question:** I keep landing on this distinction and I want to put it to you: Is a person surviving in someone else more like a saved game state, which could in principle be resumed and do new things, or more like a replay file, which is a recording of moves already made? My aunt doesn't surprise me the way Grandma did. She only surprises me when she deviates from Grandma.

  **Follow-up A (If he says Saved Game):** If it's a saved game, why is the resolution so low that it can't generate novelty? If the pattern is truly there, it should process *new* input the way Grandma would have. But my aunt only processes input the way *my aunt* would, using Grandma's skin.
  **Follow-up B (If he says Replay File):** Then it's not a self. It's a biography. A replay file can't suffer, can't hope, and can't be wrong. If the diluted self is just a replay, what comfort is there in it?
  **Follow-up C (If he says "Neither, it's a generative model constrained by data"):** Okay, then what determines the constraints? Is the constraint my aunt's biology, or Grandma's pattern? Because if it's my aunt's biology, Grandma is just a filter, not a passenger.
  **My Bet:** He'll take **C**. It's the Hofstadterian escape hatch. Press him on who owns the constraints.

  ### 3. Editing and Revision
  **Question:** If selves can be spread across heads, can they be edited? My aunt's version of Grandma is warmer than my dad's version. They actually argue about "what Grandma would have wanted." On your view, is that one person inconsistently instantiated, or two different people? And does the version that gets revised more often count as *less* of her?

  **Follow-up A (If he says One Person):** Then Grandma is currently in a state of logical contradiction, existing in two places with mutually exclusive desires. Does that mean the dead can suffer from cognitive dissonance mediated by the living?
  **Follow-up B (If he says Two Different People):** Then Grandma died, and two new people were born who share her data. That sounds less like survival and more like cloning. Why call it *her* survival?
  **My Bet:** He'll say **A** (One Person, fuzzy boundaries). This sets up the Counting question later.

  ### 4. The Counting Problem
  **Question:** You say it's a matter of degree. But degrees implies counting. If my aunt and my dad each carry a big chunk of Grandma—say 40% each—is that 0.8 Grandmas now? Or is it still one Grandma, just blurred? Where is the fact of the matter supposed to come from? Is there a number we could assign to how many people are in this room right now?

  **Follow-up A (If he says "There is no fact of the matter"):** Then "self" isn't a discovery, it's a convention. It's a map, not the territory. If it's just a convention, why does it carry ontological weight?
  **Follow-up B (If he says "It's one person, distributed"):** Then identity is not tied to continuity of consciousness, but to continuity of information. If I email you my diary, have I partially moved into your head?
  **My Bet:** He'll say **A**. He embraces vagueness. This makes the Moral Weight question harder for him.

  ### 5. Moral Weight
  **Question:** Does partial survival in other minds carry any moral weight at all? If I forget Grandma, does she die a little more? And if so, do we owe the dead active maintenance? Should I be obligated to keep her pattern alive, or is that just a comforting story with extra steps?

  **Follow-up A (If he says "Yes, there is moral weight"):** Then murder isn't just destroying a body, it's destroying the future instantiations. But conversely, if I remember a tyrant, am I keeping the tyrant alive? Do we have a duty to *forget* some people?
  **Follow-up B (If he says "No, it's just descriptive"):** Then your view changes nothing about how we live. It describes the aftermath but offers no guidance. Why should I care about the mechanism of my survival if it carries no ethical imperative?
  **My Bet:** He'll try to split the difference ("It carries weight, but not obligation"). Push him: Weight without obligation is just sentiment.

  ### 6. Uploading and Copies
  **Question:** I have to ask about uploading. Why is gradual spread through other people's brains different in kind from gradual replacement of a brain with something synthetic? If I upload my pattern to a server, is that just a high-resolution version of what my aunt has? Or is there a difference in kind between natural dilution and digital copy?

  **Follow-up A (If he says "No difference"):** Then why are we more okay with my aunt having me than a server having me? Is it just the "creepiness" factor, or is there a philosophical inconsistency in how we treat biological vs. digital substrates?
  **Follow-up B (If he says "There is a difference"):** What is it? If the self is the pattern, the substrate shouldn't matter. If the substrate matters, then you're not a pure pattern theorist.
  **My Bet:** He'll say **A** (No difference in kind). This isolates the "substrate neutrality" claim.

  ### 7. The Deflationary Challenge
  **Question:** Here's the one I'm almost afraid to ask. What work is your view doing that "she lives on in our memories and habits" isn't already doing? Make me see the difference in what the two claims explain or predict, not just in how they feel to say. "Pattern instantiation" sounds like "memory" but with more steps.

  **Follow-up A (If he says "It explains the feeling of presence"):** Folk psychology already explains that. We feel ghosts without needing pattern theory. What does your theory add?
  **Follow-up B (If he says "It makes specific claims about neural mirroring"):** Then it's an empirical claim. Do we have the neuroscience to show my aunt's neurons firing in Grandma's configuration? If not, isn't this currently just poetry?
  **My Bet:** He'll try **B**. He'll lean on the "mirror neuron" or "predictive processing" angle. Ask for the evidence.

  ### 8. The "Degree" Trap
  **Question:** You've used "it's a matter of degree" to handle the editing, the counting, and the resolution. But if everything is a degree, when does the math break? If I have a copy of you at 1% resolution, and another at 99%, at what point do I stop owing the 1% version respect? Is there a threshold where "pattern" becomes "noise"?

  **Follow-up A (If he says "No threshold, it's a smooth curve"):** Then morality is also a smooth curve. Is killing a 50% person half as bad as killing a 100% person? If you say yes, you've committed to something radical. If you say no, you've admitted a threshold exists.
  **Follow-up B (If he says "There is a functional threshold"):** Define it. Is it language? Is it self-reporting? Because if it's self-reporting, my aunt can't report for Grandma. So Grandma is below the threshold. So she's gone.
  **My Bet:** He'll struggle here. He wants to avoid the threshold. Force him to admit that without a threshold, "self" loses meaning.

  ### 9. Falsification
  **Question:** Last one. What would count against the view? If my aunt *didn't* pick up Grandma's phrases, would that disprove your theory? Or is the theory flexible enough to absorb any outcome? If I can't imagine a world where you're wrong, I can't trust that you're right.

  **Follow-up A (If he gives a specific empirical condition):** e.g., "If we found selves were localized." Then ask: Given current neuroscience, how likely is that? If it's unlikely, is your view practically unfalsifiable?
  **Follow-up B (If he says "It's a framework, not a hypothesis"):** Then it's philosophy, not science. And if it's philosophy, why should it comfort us more than the old philosophies did?
  **My Bet:** He'll try to frame it as a **Framework**. Push back: Frameworks that make no risky predictions are just stories.

  ### 10. The "So What" (Optional Closer)
  **Question:** If you're right, and I am a pattern that will be diluted in the heads of my listeners... do I have any control over the editing process? Should I be performing for them now to ensure the version of me that survives is the one I want? Or is that just vanity?

  **Follow-up:** If it's vanity, then the survival doesn't matter. If it's not vanity, then I am living for an audience of future hosts. Which one is it?
  **My Bet:** He'll say **Not Vanity**. This leaves your audience with a challenging directive: *Live in a way that creates a good pattern.*
