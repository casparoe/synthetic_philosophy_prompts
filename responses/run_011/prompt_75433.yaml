      *   **Source Material:** *De Corpore* (Parts I-II), *Leviathan* (Parts I-II), Savilian Professor's attacks (Wallis) + Hobbes's replies.
      *   **Core Task:** Draft one essay question (2 parts), a model answer (~900 words), a marking scheme (25 marks), and a list of 6 characteristic errors with deductions.
      *   **Specific Philosophical Crux:** Distinguish between Hobbes's *generative ground* (knowledge from cause/motion) and *semantic ground* (knowledge from determinate definitions/names).
      *   **Key Tension:**
          *   Semantic ground secures necessity but risks reducing geometry to arbitrary stipulation (Oxford objection).
          *   Generative ground promises causal knowledge but is only "considered" in geometry (not actual), whereas in civil philosophy it *is* actual.
          *   Does this make civil philosophy superior? Or does "actual making" introduce contingency that undermines science?
      *   **Requirements:**
          *   Stipulated box with premises (paraphrased).
          *   Question Part (a): Separate grounds, address Oxford objection.
          *   Question Part (b): Position on "considered" vs. "actual" generation, implication for civil philosophy.
          *   Warning: No survey of quarrels, no simple restatement of "we only know what we make."
          *   Model Answer: Argue a position, concede something to the objection.
          *   Marking Scheme: 5-6 moves, explicit A vs. B distinction based on a specific move.
          *   Errors: 6 specific errors with deductions and explanations (must include the 4 specified in the prompt).

  2.  **Drafting the Question:**

      *   *Premise Box:* Needs to capture the two grounds without quoting Hobbes directly.
          *   Ground 1: Science requires knowing how things are made/generated (causes).
          *   Ground 2: Science requires definitions that are stable and imposed by us (language/names).
      *   *Part (a):* Focus on the distinction and the Oxford objection (Wallis). The objection targets the semantic side (arbitrariness) but maybe misses the generative side? Or vice versa? The prompt suggests the objection treats it as "symbol-mongering" (semantic), whereas the generative side claims causal knowledge.
      *   *Part (b):* Focus on the "considered" vs. "actual" generation. Geometry = considered. Civil = actual. Does this hierarchy hold?
      *   *Constraints:* Explicitly forbid citation hunting and simple slogan repetition.

  3.  **Drafting the Model Answer:**

      *   *Goal:* ~900 words. Argue a position (don't sit on the fence). Concede something to the Oxford objection.
      *   *Thesis:* The semantic ground is necessary but insufficient; the generative ground is the true engine of scientific knowledge. However, the "considered" nature of geometric generation *does* create a gap, but civil philosophy's "actual" generation introduces contingency that *lowers* its scientific status compared to geometry, despite the "actual making" advantage.
      *   *Structure:*
          1.  Intro: Distinguish the two grounds.
          2.  Address Part (a): Oxford objection (Wallis) targets the semantic ground (arbitrariness). It fails to see the generative constraint.
          3.  Address Part (b): The "considered" generation in geometry is a feature, not a bug. It ensures universality.
          4.  Civil Philosophy comparison: Actual making involves passions/resistance (contingency). Geometry is purer.
          5.  Conclusion: Geometry remains the paradigm, civil science is derivative or less certain in practice.
      *   *Tone:* Graduate level, precise, argumentative.

  4.  **Drafting the Marking Scheme:**

      *   Total: 25 marks.
      *   Breakdown: 5-6 moves.
      *   *A vs. B Distinction:* Needs to be specific. The prompt highlights the tension between "considered" generation in geometry vs. "actual" in politics. An A answer should recognize that *actual* making in politics introduces *contingency* which threatens scientific status, whereas a B answer might just say "politics is better because it's real." Or, an A answer clearly separates the semantic/generative grounds, while a B answer conflates them. Let's make the A/B distinction about the *implication for civil philosophy*.
      *   *Moves:*
          1.  Distinguish grounds (5 marks).
          2.  Locate Oxford objection (Semantic) (5 marks).
          3.  Defend Generative ground against objection (5 marks).
          4.  Analyze "Considered" vs. "Actual" (5 marks).
          5.  Conclusion on Civil Philosophy ranking (5 marks).
      *   *A/B Line:* The specific move regarding the *consequence of actual making* (contingency vs. certainty).

  5.  **Drafting the Characteristic Errors:**

      *   Must include the 4 specified in the prompt:
          1.  Quadrature of the circle focus.
          2.  Truth by convention (semantic reductionism).
          3.  Actual construction (straightedge/compass literalism).
          4.  Conflating the two grounds.
      *   Need 2 more common graduate errors.
          5.  Ignoring the Oxford antagonist entirely (treating it as pure exegesis).
          6.  Claiming Hobbes abandons geometry for politics in *Leviathan* (developmental fallacy).
      *   Deductions: Vary based on severity.

  6.  **Review and Refine:**

      *   *Check Word Count:* Model answer needs to be tight around 900 words.
      *   *Check Premises:* Ensure the box is paraphrased, not quoted.
      *   *Check Marking:* Ensure the A/B distinction is actionable for a grader.
      *   *Check Tone:* Academic, rigorous.
      *   *Check Constraints:* No citations requested in the question.

      *(Self-Correction during drafting Model Answer)*: I need to make sure I don't just summarize Hobbes. I need to *argue*. I will argue that the "considered" generation is actually superior for *scientia* because it filters out the noise of matter, which the Oxford critic misses. I will concede that the semantic ground *is* vulnerable to the "arbitrary stipulation" charge if isolated, but the generative ground saves it.

      *(Self-Correction on Marking Scheme)*: The prompt asks for an explicit statement of what separates B from A. I will make this the "Contingency Move." A-range answers identify that *actual* making in civil philosophy introduces contingency/passion that undermines the *scientia* Hobbes seeks, whereas B-range answers assume *actual* making automatically equals *better* science.

      *(Self-Correction on Errors)*: Ensure the specific 4 required errors are phrased exactly as requested or clearly identifiable as such.

  7.  **Final Polish:** Check formatting (boxes, bold text, lists). Ensure the "Stipulated Box" is clear.

      *Let's write.*
answer: |-
  ### 1. Examination Question

  **Stipulated Premises**
  > **Box A: Hobbes's Conditions for Scientific Knowledge**
  > 1.  **The Generative Condition:** To know a thing scientifically is to know the cause by which it is produced. In the case of quantity and figures, this means understanding them as the product of motion (e.g., a line generated by the flow of a point).
  > 2.  **The Semantic Condition:** Scientific reasoning requires names with settled, determinate definitions imposed by the reasoner, ensuring that the chain of consequence is not broken by equivocation or meaningless terms.

  **Question 3**
  Hobbes maintains that geometry is the only science besides civil philosophy that satisfies the conditions for demonstrable knowledge. However, the justification for this status relies on the two distinct grounds outlined in Box A.

  **(a)** Distinguish the Generative Condition from the Semantic Condition. Explain why the objection raised by the Savilian Professor (that Hobbes's method reduces to arbitrary symbol-mongering) gains traction against one of these grounds but fails to dismantle the other. (10 marks)

  **(b)** In geometry, figures are generated only in *consideration* (by the mind), whereas in civil philosophy, the commonwealth is generated *actually* (by institution). Take a position on whether this merely-considered character of geometric generation undermines geometry's claim to yield knowledge of causes. What follows for the ranking of civil philosophy relative to geometry: is political science superior because the making is real, or inferior because the making is contingent? (15 marks)

  *Note: Credit will not be given for a historical survey of the Hobbes-Wallis quarrel, nor for mere restatement of the slogan that "we know only what we make." You must analyze the structural tension between the two grounds.*

  ***

  ### 2. Model Answer

  Hobbes's epistemology rests on a dual foundation: the requirement that we know things by their causes (generation) and the requirement that our terms be semantically stable (definition). While these often operate in tandem, they serve different functions. The Generative Condition secures the ontology of science, ensuring we are talking about real motions and effects. The Semantic Condition secures the logic of science, ensuring our reasoning does not dissolve into nonsense. Distinguishing them is vital because the Oxford objection—specifically Wallis's charge that Hobbes treats geometry as arbitrary stipulation—targets the Semantic Condition while largely ignoring the Generative one.

  Wallis's critique bites on the Semantic ground because if definitions are merely "imposed by us," as Hobbes admits, they appear vulnerable to the charge of conventionalism. If I define a circle however I wish, my reasoning is valid only relative to my stipulation, not relative to the world. This makes geometry look like a game of symbols, detached from physical reality. However, this objection fails to dismantle the Generative ground. Hobbes does not claim we define figures arbitrarily; we define them by the motion that produces them. A circle is not just a set of semantic rules; it is the trace of a point moving at a fixed distance from a center. The generation is constrained by the nature of motion itself, not merely by linguistic fiat. Wallis treats Hobbes as a nominalist who thinks words create truth, whereas Hobbes is a materialist who thinks motion creates the objects words describe. The semantic stability is necessary for reasoning, but the generation provides the causal anchor that prevents the reasoning from being "mere bookkeeping."

  This distinction informs the comparison between geometry and civil philosophy. In geometry, the generation is "considered"—the geometer does not physically draw a perfect line but conceives the motion of a point. In civil philosophy, the sovereign actually constructs the commonwealth through covenant. One might argue this makes civil philosophy superior: the cause is actual, not hypothetical. However, this view misunderstands the role of "consideration" in Hobbes's science. The fact that geometric generation is mental is a feature, not a bug. By considering the generation, the geometer strips away the irregularities of matter. A physical circle drawn in sand is imperfect; a considered circle is universal. The "considered" nature of the cause ensures the necessity of the effect.

  If we accept that actual making elevates a science, civil philosophy would rank above geometry. But this leads to a fatal problem: actual making introduces contingency. The commonwealth is made by men driven by passions, fear, and appetite. While the *logic* of the covenant is demonstrable (like geometry), the *execution* is subject to the resistance of human nature. Men may fail to perform, or sovereigns may fail to protect. Geometry suffers no such resistance; the mind's motion meets no friction. Therefore, the merely-considered character of geometric generation does not undermine its causal claim; it purifies it. It ensures that the cause is sufficient to produce the property without interference.

  Consequently, civil philosophy should not be ranked above geometry, despite the "actual" institution of the state. It is, in Hobbes's system, demonstrable *in principle* because we make the state, but it is less secure *in practice* because the material of the state (human beings) is less tractable than the material of geometry (quantity). The Oxford objection is correct that semantic imposition risks arbitrariness, but wrong to think this invalidates the science, provided the generation is constrained by motion. However, the objection misses the deeper point: the "actual" making of politics imports the very contingency that science seeks to exclude. Geometry remains the paradigm not because it is more "real" in its construction, but because its considered construction guarantees the necessity that actual construction in the civil realm can promise but rarely deliver. The generative ground saves geometry from Wallis's semantic critique, and the purity of considered generation saves it from the contingency of civil actuality.

  ***

  ### 3. Marking Scheme (25 Marks)

  **Required Moves:**

  1.  **Distinction of Grounds (5 marks):** Clearly separates the Generative Condition (causality/motion) from the Semantic Condition (definition/names). Identifies that one concerns *how* things come to be, the other concerns *how* we speak of them.
  2.  **Localization of Objection (5 marks):** Correctly identifies that the Oxford/Savilian objection (arbitrariness/symbol-mongering) targets the Semantic ground (imposition of names) rather than the Generative ground (constraint of motion).
  3.  **Defense of Generation (5 marks):** Explains why the Generative ground resists the objection (motion is not arbitrary; definitions track causal powers, not just linguistic rules).
  4.  **Analysis of "Considered" vs. "Actual" (5 marks):** Argues that "considered" generation in geometry excludes material irregularity, whereas "actual" generation in politics includes it.
  5.  **Ranking Conclusion (5 marks):** Takes a definitive stance on the ranking. (Either: Geometry is superior due to necessity; or Civil is superior despite contingency). The logic must follow from Move 4.

  **A-Range vs. B-Range Distinction:**
  *   **B-Range (13–17 marks):** The candidate successfully distinguishes the two grounds and notes the Oxford objection targets the semantic side. However, in Part (b), they argue that civil philosophy is *superior* to geometry simply because the making is "real," treating "actual making" as an unqualified epistemic virtue. They fail to recognize that for Hobbes, *actual* making in the civil realm introduces passion and contingency that threaten scientific certainty.
  *   **A-Range (18–25 marks):** The candidate makes the specific move of identifying **contingency as the cost of actual making**. They recognize that while civil philosophy meets the "we make it" criterion more robustly, the *material* of that making (human passion) introduces resistance that geometry's "considered" motion avoids. They argue that geometry remains the paradigm of *scientia* precisely because its generation is purified of material interference, even if civil philosophy is the only other *demonstrable* science.

  ***

  ### 4. Characteristic Errors

  | Error | Deduction | Why it is Tempting |
  | :--- | :--- | :--- |
  | **1. The Quadrature Distraction:** Treating the Oxford objection as primarily concerning Hobbes's failed claim to have squared the circle rather than his conception of method. | -5 marks | The historical quarrel is famous for the squaring controversy; students recall the scandal rather than the methodological critique. |
  | **2. Semantic Reductionism:** Reading Hobbes's account of truth as a property of well-ordered names as if it entailed that mathematical truths are true *only* by convention. | -5 marks | Hobbes's nominalism is emphasized in seminars; students conflate "truth is in speech" with "truth is arbitrary." |
  | **3. Literal Construction:** Assuming that "generation" in geometry requires actual physical construction with straightedge and compass. | -4 marks | "Making" is naturally read as physical labor; students miss the scholastic distinction between *fieri* in the mind and *fieri* in matter. |
  | **4. Conflation of Grounds:** Supposing that the generative and semantic grounds are simply two names for the single thesis of "constructivism." | -5 marks | The secondary literature often bundles these together; distinguishing them requires analytical work beyond the reading list summaries. |
  | **5. The Developmental Fallacy:** Claiming that Hobbes abandons the geometric model in *Leviathan* in favor of a rhetorical or pragmatic approach. | -3 marks | Students often assume a shift in tone between *De Corpore* and *Leviathan* implies a shift in epistemological commitment. |
  | **6. Ignoring the Antagonist:** Failing to engage with the specific charge of "symbol-mongering" or arbitrariness, treating the question as pure exegesis. | -3 marks | The prompt asks for engagement with the objection; students prefer to explain Hobbes rather than defend him against the specific critique. |
