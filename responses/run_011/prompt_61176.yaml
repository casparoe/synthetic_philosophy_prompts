      *   Confidence levels explicit? Check.

  8.  *(Self-Correction during drafting)*: I need to be careful with the "John Lackland" reference. In the 1905 translation, this refers to the naive observer. In French, it's *Jean Sans Terre*. It's a pun on "No Land/No Ground." I should explain this briefly as it affects the "individuation of facts" question.
      *   Also, ensure I distinguish between Poincaré's Conventionalism (choices of definitions/geometry) and his Empiricism (facts anchor truth). The NEC debate hinges on whether theory choice is *constitutive* (Poincaré might allow this for principles) or *confirmatory* (Poincaré demands experiment for truth).

  9.  **Final Polish:** Check tone. Ensure it sounds like a colleague helping another colleague, not a textbook. (e.g., "Here is where I think your group member is overreading...")

