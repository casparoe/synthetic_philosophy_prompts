answer: |-
  # Part 1: Rejected Demarcation Criteria

  Before establishing the protocol, we must clear the ground. As a philosopher of science working in trade publishing, I have evaluated standard demarcation criteria against the constraints of your workflow (90 minutes, non-specialist editors, commercial viability). The following were considered and rejected for this specific procedure:

  1.  **Strict Popperian Falsifiability:**
      *   *Reason for Rejection:* In historical sciences, we cannot run controlled experiments. Claims are about unique past events. A strict "can this be proven false?" test often kills legitimate historical inference (e.g., "Caesar crossed the Rubicon" is hard to falsify now, but not pseudoscience). We need a softer version: *Defeasibility* (is there evidence that *would* count against this?).
  2.  **Peer-Review Status:**
      *   *Reason for Rejection:* While useful, this is an appeal to authority. Conservative fields often reject valid revisionism initially. Conversely, predatory journals exist. Relying on this prevents you from discovering the "next big thing" and gives you no rationale to offer an author other than "you aren't part of the club."
  3.  **Mathematical Formalism:**
      *   *Reason for Rejection:* Irrelevant for history and archaeology. Pseudoscience often uses complex math to dazzle (numerology), while valid qualitative history uses none.
  4.  **Consensus/Orthodoxy:**
      *   *Reason for Rejection:* Explicitly forbidden by your requirements, but also philosophically unsound. Truth is not a vote. Using this exposes the press to accusations of gatekeeping.
  5.  **Predictive Power (Future Events):**
      *   *Reason for Rejection:* Archaeology predicts *finds*, not future physical events. A claim that "we will find a city next year" is not a scientific test in the physics sense.
  6.  **Internal Consistency:**
      *   *Reason for Rejection:* Conspiracy theories are often perfectly internally consistent. A story can hang together beautifully and still be entirely detached from reality.

  **Selected Approach:** We will use a hybrid of **Lakatosian Research Programmes** (is this theory generating new insights or just explaining away anomalies?) and **Inference to the Best Explanation** (does this account for *all* the evidence, or just the convenient bits?). We focus on *methodological transparency* rather than *truth verification*.

  ***

  # Part 2: The Screening Procedure (The "Demarcation Protocol")

  **Time Allowance:** 90 Minutes
  **Materials:** Proposal, Sample Chapter, Bibliography.
  **Operator:** Commissioning or Junior Editor.

  ### Phase 1: The Fast-Fail Filters (15 Minutes)
  *If any of these trigger, stop reading. Draft a rejection based on "Methodological Transparency."*

  1.  **The Ad Hominem Check:**
      *   *Look for:* Attacks on the character/motives of opponents (e.g., "cartel," "cabal," "gatekeepers") replacing engagement with their data.
      *   *Pass:* Criticism focuses on methods, data, or interpretations.
      *   *Fail:* >20% of the argumentative space is devoted to the corrupt motives of the establishment.
      *   *Record:* Count instances of motive-attribution vs. data-engagement.
  2.  **The Unfalsifiable Core:**
      *   *Look for:* Claims that explain away all counter-evidence in advance (e.g., "The lack of evidence proves how thorough the cover-up was").
      *   *Pass:* Author identifies specific evidence that would force them to abandon the thesis.
      *   *Fail:* No conceivable evidence is admitted as disconfirming.
      *   *Record:* Quote the author's statement on what would change their mind. If none, flag **FAIL**.

  ### Phase 2: Argument Form Analysis (45 Minutes)
  *Do not judge the truth of the claim. Judge the handling of the specific recurring tropes.*

  3.  **The "Impossible Precision" Test (Megaliths/Technology):**
      *   *Context:* Claim that stone/metalwork is too precise for alleged tools.
      *   *Check:* Does the author cite experimental archaeology where modern researchers *tried* to replicate the work with period tools?
      *   *Pass:* Author acknowledges replication experiments and explains why they fail.
      *   *Fail:* Author asserts impossibility based on visual inspection or intuition alone.
  4.  **The "Diffusionist" Test (Identical Motifs):**
      *   *Context:* Claim that similar symbols/buildings in separated cultures prove contact.
      *   *Check:* Does the author address *independent invention* (psychological/structural universals)?
      *   *Pass:* Author argues why independent invention is statistically unlikely for *this specific complex*.
      *   *Fail:* Author assumes contact is the only explanation for similarity without ruling out convergence.
  5.  **The "Chronological Anchor" Test (Manuscripts/Dating):**
      *   *Context:* Claim that manuscripts are too late to be reliable, or C14 is circular.
      *   *Check:* For C14: Does the author acknowledge cross-checks (varves, ice cores, speleothems)? For Manuscripts: Does the author engage with textual criticism (stemmatics), not just the date of the physical copy?
      *   *Pass:* Author engages with the *independent* calibration methods or textual transmission chains.
      *   *Fail:* Author asserts circularity without acknowledging the independent checks.
  6.  **The "Duplication" Test (Phantom Dynasties):**
      *   *Context:* Claim that historical periods are duplicated copies of each other (e.g., New Chronology).
      *   *Check:* Does the author account for *contemporaneous* records from neighboring cultures (e.g., if Egypt is moved, does Assyria move with it?)?
      *   *Pass:* Author provides a synchronized timeline for neighboring regions.
      *   *Fail:* Author adjusts one timeline without adjusting the interconnected web of trade/war records.

  ### Phase 3: Consilience and Lakatosian Progress (30 Minutes)
  *Does the theory do work, or just clean up messes?*

  7.  **The Consilience Check:**
      *   *Look for:* Does the thesis bring together independent lines of evidence (genetics, linguistics, geology, text)?
      *   *Pass:* The theory explains anomalies in *multiple* fields simultaneously.
      *   *Fail:* The theory solves one problem but creates three new ones in adjacent fields (e.g., fixes a date but breaks the genetic timeline).
  8.  **The Progressive Shift:**
      *   *Look for:* Does the theory predict *new* discoveries or novel interpretations of existing data?
      *   *Pass:* "If we look at X, we should find Y."
      *   *Fail:* "The reason we haven't found Y is that it was destroyed/hidden." (Degenerating programme).

  ### Escalation Triggers
  *If the file passes Phase 1 & 2 but triggers one of these, do not decide. Send to Specialist Reader.*

  *   **Trigger 1 (Technical Specificity):** The claim rests on a specific technical dataset (e.g., isotope ratios, dendrochronology spikes) that the editor cannot verify, but the author admits uncertainty and proposes a clear test.
  *   **Trigger 2 (High Risk/High Reward):** The author is credentialed, engages fairly with opponents, but the claim is paradigm-shifting. (Use this sparingly; max 1 per year).

  ***

  # Part 3: Guarding Against False Signals

  **NOT Evidence of Unsoundness (Do not cite these in rejection):**
  *   **Lack of Credentials:** Self-taught experts exist.
  *   **Unpopular Claim:** Paradigm shifts are unpopular by definition.
  *   **Angry Tone:** Passion is not error (though see Fast-Fail #1 on ad hominem).
  *   **Dramatic Framing:** Trade books need narrative; this is not academic prose.
  *   **Overturning Consensus:** This is the goal of revisionist history.
  *   **Previous Self-Publishing:** May indicate the author couldn't find a home, or simply wanted control.

  **NOT Evidence of Soundness (Do not rely on these for acceptance):**
  *   **Footnotes/Bibliography:** Can be fabricated or cherry-picked.
  *   **Blurbs from Professors:** Friends and colleagues blurbs for friends.
  *   **Buzzwords:** Invocation of "LiDAR," "Isotopes," or "AI" without raw data or methodology.
  *   **Distinguished Press (Adjacent):** Just because they published a book on *Rome* doesn't mean their book on *Atlantis* is sound.
  *   **Large Platform:** A devoted following proves marketing reach, not factual accuracy.

  ***

  # Part 4: Graduated Outcomes

  The decision is not binary. Match the disposition to the test results:

  1.  **Acquire (Standard):** Passes all phases. Strong consilience.
  2.  **Acquire (Conditional):** Passes Phases 1 & 2, but Phase 3 reveals overreach. *Condition:* Author must remove the chapter on "The Cartel" or reframe the conclusion as "Hypothesis" rather than "Proof."
  3.  **Acquire (Speculative/Memoir):** Fails Phase 2 (historical rigor) but passes Phase 1 (honesty). *Condition:* Marketed as "Personal Investigation" or "Alternative Theory," not definitive history. Cover/Intro must clarify the speculative nature.
  4.  **Request Revision (Sample):** Passes Phase 1, but Phase 2 shows missing engagement. *Action:* Ask author to rewrite sample chapter to address specific counter-evidence (e.g., "Please address the varve data in Chapter 3").
  5.  **Decline (Methodological):** Fails Fast-Fail or Phase 2. *Rationale:* "The manuscript does not engage with [Specific Counter-Evidence] required to substantiate this claim."
  6.  **Decline (Fit/Market):** Passes rigor, but too niche or too similar to existing list.

  ***

  # Part 5: Worked Applications

  ### File A: The Maritime Pre-Neolithic Civilisation
  *   **Phase 1 (Fast-Fail):**
      *   *Ad Hominem:* One chapter devoted to "archaeological establishment as a cartel." **FAIL.**
      *   *Falsifiability:* Author does not state what would persuade him he is wrong. **FAIL.**
  *   **Phase 2 (Argument Forms):**
      *   *C14 Calibration:* Claims circularity without acknowledging varve/ice core cross-checks. **FAIL.**
  *   **Disposition:** **Decline (Methodological)** or **Acquire (Speculative)** *only* if the contract allows significant rewriting.
  *   **Rationale:** Since the advance is paid, you are in damage control. You cannot publish this as history.
      *   *Action:* Invoke the "Conditional" clause. Require the removal of the "Cartel" chapter and an introduction stating this is a *hypothesis* not accepted by the mainstream due to [Specific Reasons]. If the author refuses, you must consider sinking the advance to protect the imprint's reputation. The lack of a falsification condition is the dealbreaker for non-fiction history.
  *   **Honest Assessment:** This is a high-risk liability. The procedure flags it immediately. Do not let the sales director override the Fast-Fail on "Cartel" language.

  ### File B: The Norse Timbers & Cosmic Event
  *   **Phase 1 (Fast-Fail):**
      *   *Ad Hominem:* Attacked by a colleague, but the *text* does not focus on the colleague's motives. **PASS.**
      *   *Falsifiability:* Author states what excavation would settle the ambiguous assemblage. **PASS.**
  *   **Phase 2 (Argument Forms):**
      *   *Technical Specificity:* Relies on atmospheric radiocarbon spikes (Miyake events). This is real science, but highly technical.
      *   *Ambiguity:* Author concedes the second site is ambiguous. This is a *positive* signal of integrity.
  *   **Phase 3 (Consilience):**
      *   *Progressive:* Predicts specific findings from excavation.
  *   **Disposition:** **Escalate to Specialist.**
  *   **Rationale:** Your instinct to decline is likely based on the "attack by senior colleague" (Consensus Bias). The procedure shows the author is behaving more scientifically than the attacker (admitting uncertainty).
      *   *Action:* Pay for one specialist report. Ask specifically: "Is the Miyake event dating method applied correctly here?" If yes, acquire. This is exactly the "serious revisionist work" you want to catch.

  ### File C: The Engineer's Chronology Compression
  *   **Phase 1 (Fast-Fail):**
      *   *Ad Hominem:* Cites literature solely to accuse it of bad faith. **FAIL.**
  *   **Phase 2 (Argument Forms):**
      *   *Duplication Test:* Compresses a millennium into three centuries.
      *   *Check:* Does not account for neighboring cultures (Assyria/China) which would also need compression.
      *   *Citation:* Cross-references only own volumes. **FAIL.**
  *   **Disposition:** **Decline (Methodological).**
  *   **Rationale:** "The proposal relies on a chronological adjustment that is not synchronized with contemporaneous records from neighboring civilizations, and does not engage with the primary textual criticism regarding manuscript transmission."
  *   **Honest Assessment:** This is Fomenko-style pseudohistory. The self-citation and bad-faith accusations are definitive red flags. Do not escalate.

  ***

  # Part 6: Judgment, Limits, and Priorities

  ### Where the Procedure is "Judgment in Costume"
  1.  **Assessing "Good Faith" (Phase 1):** Distinguishing between a passionate critique of an institution and a conspiracy theory is subjective. An editor must judge tone.
  2.  **Weighing Consilience (Phase 3):** Deciding if a theory creates "too many" new problems elsewhere requires general knowledge.
  3.  **Escalation Decision:** Deciding if a technical claim is "worth" the specialist fee is a business judgment, not a philosophical one.

  ### What the Procedure Cannot Do
  *   **Decide Truth:** It assesses *methodological robustness*, not factual accuracy. A book can pass this screen and still be wrong.
  *   **Handle "Decades Away" Evidence:** If the decisive evidence is underwater or undiscovered, the procedure relies on the author's honesty about that uncertainty.
  *   **Resolve Live Specialist Disagreement:** If two equally credible specialists disagree, this procedure cannot pick a winner. It can only ensure the book acknowledges the disagreement.
  *   **Distinguish "Unknown" from "Impossible":** It cannot tell if an anomaly is a genuine mystery or a measurement error. It only checks if the author *acknowledges* the possibility of error.

  **You are correct:** The procedure cannot distinguish a real anomaly lacking a mundane explanation *yet* from a manufactured one. It mitigates this by requiring the author to state *what would resolve it*.

  ### The Load-Bearing Test
  **Test:** **Phase 1, Item 2: The Unfalsifiable Core (Defeasibility Condition).**
  *   **Defense:** This is the single strongest filter against pseudoscience. Science advances by risking being wrong. Pseudoscience protects itself from being wrong. If an author cannot name the evidence that would change their mind, they are not doing history; they are preaching.
  *   **Gaming the Test:** An author can satisfy this by naming a disconfirmer that is impossible to obtain (e.g., "I would change my mind if we found a time machine").
  *   **Counter-Measure:** The editor must apply a "Practicality Check." Is the disconfirmer *in principle* discoverable? If the author says, "If a contemporary letter surfaces," that is valid. If they say, "If the stones speak," that is not. The procedure requires the editor to record the disconfirmer; if it is patently impossible, it reverts to a **Fast-Fail**.

  ***

  # Part 7: The Screening Form

  **PUBLISHER SCREENING FORM: HISTORY & PREHISTORY**
  **Title:** ___________________ **Author:** ___________________ **Date:** __________
  **Editor:** ___________________ **Time Started:** ______ **Time Ended:** ______

  ### PHASE 1: FAST-FAIL (Stop if any box is checked)
  [ ] **Ad Hominem:** >20% of argument attacks motives ("cartel", "cabal") rather than data.
  [ ] **Unfalsifiable:** Author cannot state what evidence would prove them wrong.
  [ ] **Recorded Disconfirmer:** __________________________________________________
      *Is this practically obtainable?* [ ] Yes [ ] No (If No, **FAIL**)

  **RESULT PHASE 1:** [ ] PASS [ ] FAIL (Stop. Draft Methodological Rejection)

  ### PHASE 2: ARGUMENT FORMS (Check relevant tropes)
  **If "Precision/Technology" claimed:**
  [ ] Author cites experimental archaeology/replication attempts? (Y/N)
  **If "Diffusion/Contact" claimed:**
  [ ] Author rules out independent invention/convergence? (Y/N)
  **If "Dating/Manuscript" claimed:**
  [ ] Author acknowledges independent calibration (varves/ice cores) or textual stemmatics? (Y/N)
  **If "Chronology Compression" claimed:**
  [ ] Author synchronizes with neighboring cultures (Assyria/China/etc.)? (Y/N)

  **RESULT PHASE 2:** [ ] PASS [ ] FAIL (Stop. Draft Methodological Rejection)

