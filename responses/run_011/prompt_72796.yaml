      *   **Role:** Philosopher of Science (specializing in demarcation, falsifiability, Lakatos, consilience, historical inference) + Research Integrity Adviser to Trade Publishers.
      *   **Task:** Design a screening procedure for a mid-sized general-interest publisher (History/Prehistory/"Lost Civilisation").
      *   **Context:** 12 proposals/week, 15 titles/year. Editors lack technical training. Current process is gut/platform-based. Problems: Acquiring conspiracy theories vs. rejecting serious revisionism.
      *   **Requirements:**
          1.  *Staged Output:* First, list rejected demarcation criteria and why. Then, the procedure.
          2.  *Procedure Proper:* Numbered sequence, ~90 mins, non-specialist runnable. Include fast-fails and escalation triggers.
          3.  *No Consensus Test:* Cannot rely on "specialists disagree." Must avoid circularity/appeal to authority in rejection letters.
          4.  *Treat Argument Forms:* Address specific recurring tropes (megalithic precision, diffusionism, manuscript dating, radiocarbon calibration, chronology duplication).
          5.  *Guard Against False Positives/Negatives:* List what is *not* evidence of unsoundness/soundness.
          6.  *Graduated Outcomes:* Not just Yes/No. Include conditional offers, reframing, etc.
          7.  *Worked Applications:* Apply to File A (Maritime pre-Neolithic), File B (Norse timbers/Nova event), File C (Engineer/Chronology compression).
          8.  *Judgment, Limits, Priorities:* Identify judgment calls, admit limitations, name the "load-bearing" test, discuss gaming.
          9.  *Format:* Clear headings, numbered steps, plain language. End with a one-page screening form.

  2.  **Deconstruct the Persona & Philosophy:**

      *   *Philosophy of Science:* Need to channel Popper (falsifiability), Lakatos (research programmes), Whewell (consilience), and perhaps Van Fraassen or Cartwright (constructive empiricism/pragmatism).
      *   *Publishing Reality:* Need to understand that publishers sell books, not truth. But reputation matters. "Research Integrity Adviser" means knowing how to spot p-hacking, citation manipulation, and rhetorical sleight of hand without needing a PhD in the subject.
      *   *Tone:* Professional, analytical, pragmatic, slightly academic but accessible to editors.

  3.  **Drafting Section 1: Rejected Demarcation Criteria:**

      *   *Popperian Falsifiability (Strict):* Too binary. Historical claims are often about unique past events, not universal laws. Hard to apply to "lost civilisations."
      *   *Consensus/Authority:* Explicitly forbidden by prompt. Also philosophically weak (science isn't a vote).
      *   *Peer Review Status:* Good indicator, but self-published authors might bypass it unfairly, and peer review can be conservative (blocking revisionism).
      *   *Mathematical Formalism:* Irrelevant for history/archaeology.
      *   *Prediction of Future Events:* Archaeology predicts *discoveries*, not future physical events.
      *   *Reasoning:* Need criteria that work on *textual analysis* of a proposal, not on verifying the data itself (which editors can't do). Focus on *methodological transparency* and *engagement with counter-evidence*.

  4.  **Drafting Section 2: The Procedure (The Core):**

      *   *Time limit:* 90 minutes.
      *   *Steps:* Needs to flow logically.
      *   *Fast-Fails:* Plagiarism, ad hominem focus, unfalsifiable claims.
      *   *Escalation:* When the claim is specific, technical, and potentially valid but risky.
      *   *Argument Forms:* Need specific checks for the tropes mentioned (stonework, diffusionism, manuscripts, C14, duplication).
      *   *No Consensus:* Focus on *how* the author handles disagreement, not the disagreement itself.

  5.  **Drafting Section 3: False Positives/Negatives:**

      *   *Not Unsound:* Credentials, popularity, tone, paradigm-challenging.
      *   *Not Sound:* Footnotes (can be fake), blurbs (friends), buzzwords (LiDAR), adjacent prestige.

  6.  **Drafting Section 4: Graduated Outcomes:**

      *   Acquire (Standard).
      *   Acquire (Conditional/Reframed).
      *   Acquire (as Speculative/Memoir).
      *   Request Revision (Sample Chapter).
      *   Decline (Methodological).
      *   Decline (Market/fit).

  7.  **Drafting Section 5: Worked Applications:**

      *   *File A:* Sounds like Hancock/alternative archaeology. "Cartel" language is a red flag. Radiocarbon calibration argument is a common pseudoscience trope (though technically nuanced). *Disposition:* Decline or Reframe heavily.
      *   *File B:* Sounds like real science (Miyake events). Ambiguity admitted. Attack by colleague is common in cutting-edge science. *Disposition:* Escalate to specialist.
      *   *File C:* Fomenko/New Chronology style. Self-citation, bad faith accusations, compression. *Disposition:* Fast-fail/Decline.

  8.  **Drafting Section 6: Judgment, Limits, Priorities:**

      *   *Judgment Calls:* Assessing "good faith" engagement.
      *   *Limits:* Can't verify data. Can't predict future discoveries.
      *   *Load-Bearing Test:* The "Falsification Condition" (What would change your mind?).
      *   *Gaming:* Authors can name impossible tests. Editor needs to check *practicality*.

  9.  **Drafting Section 7: The Form:**

      *   Needs to be clean, printable, functional.

  10. **Review and Refine:**

      *   *Check Constraints:* Did I list rejected criteria first? Yes. Is it staged? Yes. Are the specific tropes addressed? Yes. Is the "No Consensus" rule followed? Yes.
      *   *Tone Check:* Am I sounding like a philosopher *and* a publishing adviser? Need to ensure the language isn't *too* dense for junior editors.
      *   *Specific Tropes:* Ensure the procedure explicitly tells the editor what to look for regarding "megalithic precision," "diffusionism," "manuscript dating," "C14 calibration," and "dynastic duplication."
      *   *File B Nuance:* The prompt says "I am inclined to decline File B." I need to be honest if the procedure suggests otherwise. If the procedure works, it should save them from rejecting good science due to noise.
      *   *File A Nuance:* It's already signed. This is a crisis management situation. The procedure needs to handle *post-acquisition* risk assessment too, or at least flag it for damage control. *Correction:* The prompt asks for a screening procedure for *proposals*, but File A is "already signed." I must address this tension. The procedure is for *future* screening, but the worked application asks me to run it on File A *now*. I will treat File A as if it were being screened *now* to determine how to handle the existing contract (e.g., cancel, modify, or publish with caveats).
      *   *Philosophical Depth:* Ensure Lakatos is referenced (progressive vs. degenerating). Ensure Consilience is referenced (independent lines of evidence).

  11. **Final Polish:** Check word count and formatting. Ensure the "Rejected Criteria" section is distinct. Ensure the "Form" is at the very end.

  *(Self-Correction during drafting)*: I initially thought about suggesting sending File A to a specialist. But the prompt says "We can afford at most one specialist report per title." File A is already signed. The risk is reputational. The procedure should flag it as "High Risk/Reputational Threat." I need to make sure the "Fast Fail" doesn't trigger a legal breach if the book is already under contract. I will note this in the application section.

  *(Refining the "No Consensus" rule)*: Instead of "Experts disagree," the rejection reason must be "The manuscript does not engage with the specific counter-evidence X, Y, Z" or "The methodology does not allow for falsification."

  *(Refining the Tropes)*: For the C14 calibration claim (File A), the editor needs to know that while calibration uses tree rings, it's cross-checked with varves, corals, and speleothems. The editor doesn't need to know the science, just check if the *author* acknowledges these cross-checks.

