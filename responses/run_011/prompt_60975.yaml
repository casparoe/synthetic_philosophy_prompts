      *(Self-Correction on the Peg)*: The prompt asks explicitly: "Be explicit about whether the peg is fatal to the story... and tell me whether Aristotle's running of measure and medium together survives that separation." I need to make sure this gets a dedicated, strong paragraph.

      *(Self-Correction on Interest)*: Aristotle hates interest because money begets money without goods. The Wörgl stamp is money *dying* to encourage goods. This is the inverse. I must highlight this inversion.

