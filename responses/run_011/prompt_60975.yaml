answer: |-
  Here is an analysis of the Wörgl experiment through the lens of Aristotelian political economy, structured according to your three requirements.

  ### 1. Disciplined Mapping: Perversion or Correction?

  By Aristotle's lights, the Wörgl authorities did not create a new form of capital; they engineered a tool to enforce the proper teleology of money. In *Politics* I, Aristotle distinguishes between *oikonomia* (household management, acquiring goods to satisfy needs) and *chrematistike* (money-making for its own sake). He argues that money is invented for exchange (*allagē*), to make unlike things commensurable so that a builder and a shoemaker can trade. Its natural end is to pass from hand to hand to satisfy *chreia* (need).

  When money is hoarded, it is severed from this end. Aristotle invokes the myth of Midas to illustrate the absurdity of *chrematistike*: a man can possess a mountain of gold and still starve because gold is not edible. Hoarding treats money as an end rather than a means.

  The Wörgl stamp (the *demurrage*) is, Aristotelianly speaking, a **correction**, not a perversion.
  *   **Against Hoarding:** By imposing a cost on holding, the stamp makes the Midas error physically impossible. You cannot starve while holding Wörgl notes because the notes actively rot if not used. The stamp forces money back into circulation, compelling it to fulfill its natural function as a medium of exchange.
  *   **Against Interest:** Aristotle condemns interest (*tokos*) as the most unnatural form of acquisition because it makes money "breed" money, detached from the production of real goods. The Wörgl stamp is the structural inverse of interest. Interest implies money has a natural fertility; the stamp admits money is barren and requires an external subsidy (the stamp) to remain valid. It prevents money from "breeding" by ensuring it does not sit still long enough to accumulate power.
  *   **The Nature of the Cost:** The 1% monthly fee is not a tax on production, but a tax on *inaction*. In Aristotelian terms, it penalizes the withdrawal of the token from the political community of exchange.

  Therefore, the holding cost looks like a restoration of money's nature. It prevents the token from becoming an object of *chrematistike* and forces it to remain a servant of *oikonomia*.

  ### 2. Where the Theory Bites and Where It Blanks

  Aristotle's framework illuminates the political ontology of the experiment but lacks the vocabulary to describe its macroeconomic mechanics.

  **Where the Theory Bites (Illumination):**
  *   **Money as Convention (*Nomos*):** Aristotle insists money exists "not by nature but by law" (*Nicomachean Ethics* V). The Wörgl episode confirms this violently. The notes were physically identical before and after the Court's ruling; only the legal sanction changed. When the National Bank asserted its monopoly and the Courts upheld it, the Wörgl notes ceased to be money. This validates Aristotle's claim that the *polis* (or sovereign authority) is the guarantor of commensurability.
  *   **Tax Acceptance:** The Mayor's acceptance of the notes for taxes is the ultimate Aristotelian seal of validity. Since the *polis* demands the token for public obligation, the token represents a claim on the community's work. This aligns with Aristotle's view of money as a "pledge for future exchange."
  *   **The Court's Shutdown:** Aristotle would likely side with the National Bank, though for different reasons than modern monetarists. For Aristotle, a unified *polis* requires a unified measure. If every town issues its own currency, commensurability across regions breaks down, hindering the broader exchange required for human flourishing. The Court restored the unity of the measure.

  **Where the Theory Blanks (No Vocabulary):**
  *   **Velocity:** Aristotle has no concept of the velocity of money. He analyzes dyadic exchanges (A trades with B), not aggregate flow. He cannot conceptualize that speeding up the circulation of a fixed stock of money could reduce unemployment. To him, unemployment is a failure of household management or slavery arrangements, not a liquidity trap.
  *   **Monetary Policy:** The idea that a currency design could be a tool to manage public welfare (paving roads, lighting streets) falls outside *oikonomia*. Aristotle views the household budget as finite; the idea that "spending" could *create* value through circulation is a Keynesian insight Aristotle lacks.
  *   **The Distortion of the Peg:** Aristotle might view the early payment of arrears as virtuous (settling debts), but he lacks the framework to see it as "stimulus." He would likely view the rush to spend not as economic activation, but as a flight from a debased token, potentially destabilizing the trust required for long-term friendship and exchange.

  ### 3. What the Episode Does to the Theory

  The Wörgl experiment acts as a stress test for Aristotelian monetary theory. It confirms the conventional nature of money but exposes a fragility in Aristotle's conflation of the functions of currency.

  **Confirmation of Convention:**
  The episode is a near-perfect empirical validation of *Nicomachean Ethics* Book V. Money is a social institution, not a commodity. When the social institution (the Court) withdrew its consent, the "value" vanished instantly, despite the bank deposit backing. This proves that the backing was secondary to the *nomos*.

  **The Peg and the Separation of Functions:**
  You ask whether the peg is fatal to the story. In Aristotelian terms, **yes, it is problematic, but revealing.**
  Aristotle treats money as a unity: it is the measure of value, the medium of exchange, and the store of value (though he distrusts the latter). Wörgl decoupled these. The Austrian Schilling remained the *measure* (unit of account), while the Wörgl note became the *medium*.
  *   **Does Aristotle's theory survive?** It survives, but it must admit that the "measure" function is more abstract and durable than the "medium" function. Aristotle assumes the sovereign issues the measure. Wörgl shows that a sub-sovereign entity can issue a medium while borrowing the measure of a higher sovereign.
  *   **The Fatal Flaw:** For Aristotle, this separation is unstable. A measure must be uniform. If Wörgl notes circulate at par with Schillings but are legally distinct, you have two measures for one value. This creates the potential for injustice (confusion in commensurability). The Court's shutdown was, in Aristotelian terms, a restoration of the unity of the measure. A *polis* cannot function if Tyrol measures value differently than Vienna.

  **Anomaly or Anticipation?**
  Wörgl is a case Aristotle never anticipated: **money designed to decay.**
  Aristotle worries about money becoming an end in itself. Wörgl solved this by making money a *liability* rather than an asset. This turns Aristotelian ethics into engineering. It suggests that if money is merely a convention (*nomos*), that convention can be tweaked to enforce ethical behavior (circulation over hoarding).

  However, the ultimate lesson Wörgl teaches Aristotle is the limits of the local *polis*. The town functioned as a perfect Aristotelian community—money served need, exchange was rapid, public works were completed. But it was crushed by the broader legal order. This confirms Aristotle's own suspicion: the *polis* is the highest authority. A local currency is only valid so long as it does not threaten the monetary monopoly of the wider political union. The experiment confirms that money is political, but it also proves that **local politics cannot override national law.**

  **Conclusion:**
  Through Aristotle, Wörgl is not a story of economic stimulus, but of **liturgical currency.** The stamp acted as a forced liturgy, compelling citizens to participate in the exchange of the *polis* rather than withdrawing into private accumulation. The failure was not economic, but political: the town attempted to assert a monetary *nomos* that conflicted with the higher *nomos* of the State. Aristotle would conclude that while the notes served the virtue of the town, they violated the justice of the Empire.
