prompt: |-
  I write a science-and-ideas column and am building a sidebar on local currencies that I want to run against the grain of the usual framing. The episode is Wörgl, a small Tyrolean town where, in July 1932, the mayor issued municipal notes pegged to the Austrian schilling and backed by a bank deposit, each bearing twelve spaces on the reverse: to keep a note valid, the holder had to affix a monthly stamp costing one percent of its face value. Holding money therefore cost money. The notes moved quickly, residents paid their taxes early, the town paved roads, built a bridge, installed street lighting and repaired its sewers, and local unemployment fell while it rose in the rest of Austria. After roughly fourteen months the Austrian courts upheld the National Bank's monetary monopoly and the scheme was shut down.

  The design was Gesellian, but I want it analyzed through Aristotle rather than through Gesell or Keynes: the treatment of money in Book V of the Nicomachean Ethics and Book I of the Politics. That gives you money as convention rather than nature; money as a measure that makes unlike things commensurable so that unequal parties can exchange; money as a stand-in for need and a pledge for future exchange; the distinction between household management and money-making for its own sake, including the Midas-style point that a pile of currency can leave its owner starving; and the judgment that interest is the most unnatural form of acquisition because it makes money breed.

  Three things, then. First, the disciplined mapping: by Aristotle's lights, what did the Wörgl authorities do in issuing stamped notes, and does a holding cost look like the perversion of money or its correction? Second, where the theory bites and where it has no vocabulary at all — I suspect velocity, and monetary policy as such, simply fall outside his categories; show me which features of the episode (the peg, tax acceptance, the early payment of arrears, the court's shutdown) it genuinely illuminates and which it distorts. Third, what the episode does back to the theory: confirmation that money is conventional and politically instituted, an anomaly, or a case Aristotle never anticipated? Be explicit about whether the peg is fatal to the story, since the town kept the national unit of account while its own notes did the circulating — and tell me whether Aristotle's running of measure and medium together survives that separation.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** The Wörgl experiment (1932-1933) with stamped currency (demurrage).
      *   **Framing:** Unusual framing. Not Gesell (free money) or Keynes (stimulus), but *Aristotle* (*Nicomachean Ethics* Book V, *Politics* Book I).
      *   **Key Aristotelian Concepts:** Money as convention (*nomos*) not nature (*physis*); money as a measure of commensurability; money as a pledge for future exchange; *oikonomia* (household management) vs. *chrematistike* (money-making for its own sake); interest as unnatural ("money breeding money").
      *   **Three Specific Tasks:**
          1.  **Disciplined Mapping:** What did Wörgl do by Aristotle's lights? Is the holding cost a perversion or a correction?
          2.  **Theory's Limits:** Where does Aristotle's theory bite (illuminate) and where does it lack vocabulary (velocity, monetary policy)? Specific features to address: peg, tax acceptance, early payment, court shutdown.
          3.  **Feedback Loop:** What does Wörgl do to Aristotle's theory? Confirmation, anomaly, or unanticipated case? specifically address the *peg* (separation of unit of account and medium of exchange) and whether Aristotle's conflation of measure/medium survives.

  2.  **Deconstruct Task 1: Disciplined Mapping (Aristotle on Wörgl)**
      *   *Aristotle's View:* Money exists to facilitate exchange (*allagē*) to satisfy need (*chreia*). It is a measure of value. Hoarding is unnatural (*chrematistike*). Interest is unnatural because money is barren.
      *   *Wörgl's Action:* Issued notes that lose value over time unless stamped. This forces circulation.
      *   *Analysis:*
          *   Is it a perversion? Usually, debasing currency is bad. But here, the "debasement" (the stamp cost) prevents hoarding.
          *   Is it a correction? Aristotle hates hoarding (Midas starves). Wörgl notes *cannot* be hoarded effectively. They force money back into *oikonomia* (satisfying needs) rather than *chrematistike* (accumulation).
          *   *Conclusion:* The holding cost looks like a *correction* of the unnatural tendency of money to become an end in itself. It forces money to behave like a true measure/medium, not a store of value (which Aristotle is skeptical of anyway).

  3.  **Deconstruct Task 2: Theory's Limits (Where it bites vs. blanks)**
      *   *Where it bites (Illuminates):*
          *   *Tax Acceptance:* Aristotle sees money as a creature of the *polis* (law/convention). The Mayor accepting notes for taxes validates them as political tokens, not just market commodities. This fits *nomos*.
          *   *Court Shutdown:* The National Bank defending its monopoly aligns with Aristotle's worry about the *polis* order. If money is a public measure, private or municipal tampering might threaten the unity of the *polis*.
          *   *Early Payment:* Shows money returning to its function as a medium of exchange to settle obligations, not a store of wealth.
      *   *Where it blanks (No Vocabulary):*
          *   *Velocity:* Aristotle has no concept of macroeconomic velocity. He thinks in micro-ethical terms of exchange. He can't conceptualize "stimulus" via circulation speed.
          *   *Monetary Policy:* The idea of managing a currency to fight unemployment is alien. Unemployment isn't an Aristotelian category (slaves/workers work).
          *   *The Peg:* This is tricky. Aristotle assumes the *polis* issues the stamp. Wörgl used a *national* unit of account (Schilling) but a *local* medium.
      *   *Distortion:* Aristotle might view the "stamp" as a tax on exchange, potentially hindering justice, whereas Wörgl used it to grease exchange.

  4.  **Deconstruct Task 3: Feedback Loop (Wörgl on Aristotle)**
      *   *Confirmation:* Money is conventional (*nomos*). The moment the Court said "stop," the money became worthless. It proves political institution is the source of value.
      *   *Anomaly/Challenge:* The separation of Unit of Account (Schilling) and Medium of Exchange (Wörgl Note). Aristotle treats money as a single thing: measure + medium + store (though he dislikes store). Wörgl splits them.
      *   *The Peg:* Is it fatal? Not necessarily. It shows that the *measure* can remain stable (Schilling) while the *medium* is manipulated for social ends. Aristotle might dislike the fragmentation (unity of the *polis*), but it proves his point that money is a tool of the community.
      *   *Measure vs. Medium:* Aristotle says money measures value *and* mediates exchange. Wörgl shows they can be decoupled. The Schilling measured, the Wörgl note mediated. Does Aristotle's theory survive? Yes, but it requires admitting that the "measure" function is more abstract than the physical coin.

