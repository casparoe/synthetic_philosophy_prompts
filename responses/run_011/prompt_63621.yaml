answer: |-
  **Project Title:** Endogenous Reference Classes in Evidential Cooperation: A Fixed-Point Analysis

  **Applicant:** [Your Name]
  **Duration:** 9 Months
  **Request:** Independent Study Stipend

  ### 1. Statement of the Question

  Standard formulations of Evidential Cooperation in Large Worlds (ECL) assume a fixed similarity metric to determine which distant agents count as "relevant copies" for the purpose of acausal trade. This project challenges that assumption.

  **The Core Question:** *In a Large World scenario, does there exist a stable, action-guiding equilibrium for reference class selection when the similarity metric is treated as an endogenous variable of the decision procedure?*

  This is not merely a question of vagueness (the Sorites problem). It is a question of **strategic circularity**. Under Evidential Decision Theory (EDT) or Functional Decision Theory (FDT), an agent should choose the reference class definition that maximizes expected utility. However, the expected utility of a definition depends on how many other agents adopt that same definition (since they are the ones correlating with you). If agents reason identically, the choice of reference class becomes a coordination game played across the multiverse.

  **The Hypothesis:** The circularity is not vicious but constitutes a coordination problem that admits multiple equilibria. Some equilibria are stable but suboptimal (e.g., "narrow clan" trading), while others are unstable. A successful project will demonstrate whether a "universalist" equilibrium is reachable without external Schelling points.

  **How a Reader Could Disagree:** A critic could argue that similarity is purely objective (e.g., source-code identity) and not subject to choice, rendering the circularity illusory. Alternatively, a critic could argue that the feedback loop is too weak to matter, making the fixed-point analysis mathematically interesting but decision-theoretically inert.

  ### 2. Critique of Existing Responses

  Current discourse generally takes one of three paths, none of which resolve the endogeneity problem:

  1.  **The "Bite the Bullet" Universalism:** Argue that one should cooperate with *any* agent sufficiently complex to reason about ECL.
      *   *Failure:* This ignores the dilution effect. If I correlate with agents who have vastly different values or error rates, the noise drowns the signal. It also fails to specify *how* different is too different, leaving the agent vulnerable to "reference class hacking" (adversarial agents mimicking similarity to extract cooperation).
  2.  **The "Exact Duplicate" Restriction:** Restrict the reference class to agents with identical source code or physical constitution.
      *   *Failure:* This surrenders the bulk of the gains from trade in a Large World. If the universe is large but not infinite, exact duplicates may be rare or non-existent. It treats the reference class as exogenous rather than a lever the agent can pull.
  3.  **The "Science Fiction" Dismissal:** Deny the Large World premise (e.g., demand empirical evidence of a multiverse before doing decision theory).
      *   *Failure:* This conflates epistemology with decision theory. If there is *non-zero* credence in a Large World, ECL dominates expected utility calculations due to the sheer scale of potential stakes. Ignoring the reference class problem because the ontology is uncertain is a strategy that fails under its own expected utility calculus.

  None of these address the feedback loop: *My definition of "similar" influences who correlates with me, which influences the utility of my definition.*

  ### 3. Methodology and Timeline

  I will approach this via formal modeling and agent-based simulation. I am not attempting a proof in high-level topology, but rather constructing computable toy models to search for equilibria.

  **Phase 1: Formalization (Months 1–3)**
  *   **Goal:** Translate the philosophical circularity into a game-theoretic structure.
  *   **Task:** Define a "Similarity Game." Agents possess a trait vector $T$ and a decision threshold $\theta$. Agents cooperate if distance$(T_i, T_j) < \theta$.
  *   **Task:** Formalize the utility function. $U_i$ depends on the sum of cooperation from all $j$ where $j$ also selects $i$ as a partner.
  *   **Deliverable:** A working mathematical specification of the "Reference Class Selection Game."

  **Phase 2: Simulation and Search (Months 4–6)**
  *   **Goal:** Determine if agents converge on a specific $\theta$ through evolutionary or learning dynamics.
  *   **Task:** Build a Python simulation of a population of agents in a "Large World" (simulated via a large network with correlation structures).
  *   **Task:** Implement two update rules:
      1.  *Evolutionary:* Agents with higher utility replicate their $\theta$.
      2.  *Reflective:* Agents simulate the outcome of changing $\theta$ assuming others do likewise (simulating the fixed-point reasoning).
  *   **Task:** Test sensitivity. Does the equilibrium $\theta$ depend on the distribution of traits $T$? Does it collapse to 0 (no trade) or expand to max (indiscriminate trade)?
  *   **Deliverable:** Codebase and preliminary data on convergence behavior.

  **Phase 3: Analysis and Write-up (Months 7–9)**
  *   **Goal:** Interpret the equilibria.
  *   **Task:** Analyze cases where the simulation fails to converge (cycles or chaos). Determine if this implies the circularity is vicious in those regimes.
  *   **Task:** Draft the final paper. Focus on the conditions required for a "Universalist" equilibrium to be stable.
  *   **Deliverable:** A draft manuscript suitable for submission to a venue like *Ergo* or the *LessWrong* Review, plus a public release of the simulation code.

  ### 4. Success and Failure Criteria

  **Success:**
  *   **Positive Result:** The simulation identifies a stable equilibrium threshold $\theta^*$ that is neither 0 nor maximal, and demonstrates that reflective agents can converge on it without external coordination. This would suggest the circularity is solvable via fixed-point reasoning.
  *   **Negative Result:** The model proves that under plausible conditions, the system oscillates or collapses to $\theta=0$. This is still a success scientifically; it would demonstrate that ECL requires external Schelling points to function, fundamentally altering how proponents argue for it.
  *   **Completion:** A clear manuscript explaining the model and the result.

  **Failure:**
  *   **Intractability:** The model becomes too computationally expensive to run for populations large enough to approximate a "Large World," leaving results inconclusive.
  *   **Triviality:** The model shows that the equilibrium is entirely determined by arbitrary initial conditions, implying the philosophical problem has no general solution. (Note: This is intellectually valuable, but counts as a project failure if I cannot characterize *why* the arbitrariness exists).
  *   **Non-Completion:** Failing to produce the manuscript or code due to scope creep.

  ### 5. Feasibility and Scope Cuts

  **Is this too big for nine months?**
  Yes, if I attempt to model continuous trait spaces and complex learning algorithms. The risk is getting bogged down in tuning simulation parameters rather than analyzing the decision theory.

  **Where to Cut:**
  1.  **Restrict Trait Space:** Instead of continuous vectors, start with binary or discrete traits (e.g., 10-bit strings). This reduces computational load and makes the "similarity" metric easier to visualize. If the problem persists in the discrete case, the continuous case is unlikely to save it.
  2.  **Simplify the "Large World":** Do not simulate an infinite multiverse. Simulate a finite population $N$ where correlation decays with distance. If the effect doesn't show up at $N=10,000$, it likely won't matter for the decision theory.
  3.  **Drop "Reflective" Update Rule if Necessary:** If simulating agents who reason about fixed points is too hard, rely on the Evolutionary update rule. If evolution doesn't find the equilibrium, reflective agents probably won't either. This is a weaker result but safer for the timeline.

  **Recommendation:**
  Commit to the **Discrete Trait / Evolutionary Update** model for Months 1–4. Only attempt the **Reflective / Continuous** upgrade if the basic model yields clear, interesting dynamics by Month 5. This ensures a publishable "null result" or "basic equilibrium" paper even if the full fixed-point analysis proves too difficult.

  ### 6. Conclusion

  The reference class problem is the soft underbelly of ECL. If similarity is endogenous, ECL risks becoming a self-sealing ideology where agents define "similarity" to mean "people who agree with me." This project treats that risk seriously. By modeling the selection of the reference class as a strategic move, I aim to show whether ECL can stand on its own or if it requires external grounding. Nine months is sufficient to build the toy universe necessary to test this.
