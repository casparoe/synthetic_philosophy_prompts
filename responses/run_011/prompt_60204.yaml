answer: |-
  ### The Principle: Coerced Human Membership

  Your verdicts do not track "affected interests" (which would grant votes to the corporation and the estuary) nor do they track strict "nationality" (which would exclude the third-country national). They track a hybrid of **jurisdictional subjection** and **human agency**.

  The principle that best reproduces your eleven verdicts is the **Principle of Coerced Human Membership**. It holds that the franchise belongs to natural persons who are (1) subject to the Authority's coercive jurisdiction as a condition of their daily life, (2) integrated into the community of fate such that exit is costly or unrealistic, and (3) possess the cognitive capacity to exercise agency.

  Here is the precise formulation, broken into clauses with the corresponding verdicts they justify:

  1.  **The Personhood Clause:** The franchise is limited to natural persons capable of moral agency.
      *   *Work:* Verdict **6** (Corporations excluded despite high impact/regulation) and **4** (No proxy votes for children; the child is the potential agent, not the parent).
      *   *Tracking:* **Coercion + Agency.** It rejects the "affected interest" model (which would enfranchise the corporation) in favor of a community of human agents.

  2.  **The Subjection Clause:** The voter must be liable to the Authority's coercive rules (levies, regulations, fares) as a matter of routine, not contingency.
      *   *Work:* Verdict **1** (Levy payer), **7** (Liable to rules even if currently untouched), **9** (Levy deducted at source), **10** (Subject while present).
      *   *Tracking:* **Coercion.** This explains why the "hermit" (#7) votes: he is *liable* to the rules, even if his well makes him currently immune. It explains why the corporation (#6) does not: it lacks human agency.

  3.  **The Integration Clause:** The voter's center of life (residence or primary economic activity) must be within the basin, making exit realistically costly.
      *   *Work:* Verdict **1** (22 years residence), **2** (Six weeks is not integration), **9** (Daily work is integration), **10** (Resident while present).
      *   *Tracking:* **Coercion + Exit.** This distinguishes the commuter (#9) from the second-home owner (#2). The commuter's livelihood is held hostage to the Authority; the owner's leisure is not.

  4.  **The Capacity Clause:** The voter must possess the cognitive ability to form a political will.
      *   *Work:* Verdict **3** (16yo worker vs. 9yo child), **11** (Dementia).
      *   *Tracking:* **Agency.** This sets the boundary where "living under rules" is insufficient without the capacity to judge them.

  5.  **The Integrity Clause:** The franchise may be revoked for actions that directly subvert the electoral mechanism, but not for general criminality.
      *   *Work:* Verdict **5** (Prisoner votes, ballot-stuffer does not).
      *   *Tracking:* **Agency.** This preserves the community membership of the prisoner (who broke social rules) while protecting the mechanism itself from the corruptor.

  ---

  ### Affected vs. Coerced

  Your list is overwhelmingly tracking **Coercion (Subjection)**, not Affected Interests.
  *   **Evidence:** Verdict **7** (the unaffected resident votes) is the smoking gun. If you were tracking "affected interests," the hermit would be disenfranchised. He votes because he is *subject* to the jurisdiction, not because he is impacted by the output.
  *   **Evidence:** Verdict **6** (the corporation). The corporation is the most "affected" entity in the basin. It is excluded because it cannot be "coerced" in the moral sense (it cannot feel the bite of the law, only the cost).

  ---

  ### The Unsaveable Verdicts

  You asked which verdicts no reasonably simple principle can save. Your list is 90% coherent, but three verdicts create logical friction that requires "epicycles" to explain. To achieve a clean, applicable charter, you should reverse the following three:

  1.  **Reverse Verdict 8 (The Downstream Town):**
      *   *Why:* This is the only verdict that relies on "Affected Interests" rather than "Coerced Membership." The town is outside the jurisdiction, pays no levy, and is not subject to the Authority's rules. Granting them a vote violates the boundary established in Verdicts 1, 2, and 10.
      *   *Fix:* They get a statutory right to *consultation* and environmental impact review, not a vote. This resolves the "slippery slope" to the estuary you feared.

  2.  **Reverse Verdict 9 (The Commuter):**
      *   *Why:* You noted this "sits badly" with Verdict 2. If the principle is **Integration/Residence**, the commuter lives outside the community of fate. If the principle is **Levy Payment**, the second-home owner (who likely pays property taxes or fees) should also vote.
      *   *Fix:* Align with Verdict 2. Require **Residence** for the franchise. Economic subjection alone is insufficient for voting, though it warrants representation on economic boards. This creates a bright line: Do you sleep in the basin?

  3.  **Reverse Verdict 5 (The Prisoner):**
      *   *Why:* You admitted you "cannot account for" the asymmetry. More importantly, a prisoner serving ten years outside the basin has functionally exited the community of daily life (Verdict 10's logic). While the "Integrity Clause" saves the ballot-stuffer's disenfranchisement, the prisoner's vote relies on a "membership never lapses" theory that conflicts with the "Integration Clause."
      *   *Fix:* Suspend the vote during incarceration. It simplifies administration and aligns with the "Center of Life" principle.

  **If you make these three reversals, your principle becomes:** *All adult natural persons resident in the basin and subject to its jurisdiction vote.* This is administratively robust and philosophically defensible.

  ---

  ### Specific Pairings

  **Pairing 6 (Corporation) vs. 7 (Hermit)**
  *   *Your Intuition:* Hermit votes; Corp does not.
  *   *My Account:* This is the strongest part of your draft. It correctly identifies that democracy is a system of **human agency**, not **stakeholder management**. The hermit votes because he is a *member* of the coercive order (he *could* be regulated, he *could* be levied). The corporation does not vote because it is a *creature* of the law, not a *subject* of it in the moral sense.
  *   *Verdict:* **Keep both.** This distinction is essential to prevent the Authority from becoming a technocratic board run by economic interests.

  **Pairing 8 (Downstream) vs. 9 (Commuter)**
  *   *Your Intuition:* Downstream *ought* to vote (but you won't let them); Commuter *does* vote (but you feel guilty).
  *   *My Account:* These are mirror-image errors. You are trying to accommodate "externalities" (Downstream) and "economic dependence" (Commuter) without a clear rule.
  *   *Verdict:* **Drop both voting claims.** The Commuter is a non-resident (like Verdict 2). The Downstream town is a foreign entity. Both should have **Consultative Status** only. This protects the Authority from being held hostage by external veto players while ensuring their interests are heard.

  ---

  ### Rulings on Next Month's Questions

  Based on the **Principle of Coerced Human Membership** (with the recommended reversals above):

  **1. Do the Authority's own civil servants get votes?**
  *   **Ruling:** **Yes.**
  *   **Reasoning:** They are natural persons, resident in the basin (presumably), and subject to the Authority's rules. In fact, they are *more* subject to the Authority's internal governance than the average citizen. Excluding them would create a "guardian" class that rules over a "citizen" class, violating the equality of agency. Their employment relationship does not negate their civic membership.

  **2. Should a neighbouring basin expecting to accede in five years have observers with voting rights?**
  *   **Ruling:** **Observers Yes, Voting Rights No.**
  *   **Reasoning:** They fail the **Subjection Clause**. Until the charter is ratified and the levy/rules apply to them, they are not coerced by the Authority. Granting them votes now would allow a non-subject population to dictate rules to the current demos (violating Verdict 1 and 10). They should have a seat at the table to prepare for accession, but no ballot until the moment their residents become liable for the levy.

  ### Final Advice

  Your list is not a grab-bag; it is a sophisticated attempt to solve the "boundary problem" without a pre-existing constitution. However, you are trying to be too generous to external interests (Verdict 8) and too flexible on residence (Verdict 9).

  **Drop Verdicts 5, 8, and 9.**
  Adopt the **Resident Subjection** model.
  It will hurt the feelings of the downstream town and the daily commuters, but it will give you a charter that can actually be administered without endless litigation over who is "affected enough" to vote. A democracy must know where it ends.
