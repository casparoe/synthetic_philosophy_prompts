answer: |-
  UNITED STATES COURT OF APPEALS
  FOR THE NATURAL PHILOSOPHY CIRCUIT

  No. 1687-PRINC
  ISAAC NEWTON, Plaintiff-Appellant,
  v.
  ERNST MACH, Defendant-Appellee.

  Appeal from the District Court of Kinematics.

  **OPINION OF THE COURT**

  **Findings of Fact**

  The record establishes a three-stage experiment involving a bucket suspended by a twisted cord, filled with water.

  1.  In Stage One, the bucket is released and rotates rapidly relative to the laboratory. The water remains stationary relative to the laboratory. The surface of the water is flat. Relative motion between bucket and water is maximal; concavity is zero.
  2.  In Stage Two, friction causes the water to rotate with the bucket. The water is stationary relative to the bucket. The surface of the water is concave. Relative motion between bucket and water is zero; concavity is maximal.
  3.  In Stage Three, the bucket is arrested. The water continues to rotate relative to the laboratory. The surface of the water remains concave. Relative motion between bucket and water is maximal; concavity is maximal.

  The record further stipulates a sub-case: Two globes joined by a cord, revolving about their common centre of gravity in an otherwise empty universe. The cord is taut.

  **Analysis**

  1.  The Plaintiff seeks a declaratory judgment that the concavity of the water is evidence of absolute rotation. The Defendant contends rotation is merely relative to surrounding matter. The dispositive issue is jurisdiction: relative to what does the water rotate when the bucket is stationary and the surrounding laboratory walls are irrelevant?

  2.  The concavity indicates a force seeking to recede from the axis of motion. Forces require a frame of reference. In Stage Two and Three, the water's shape remains constant despite changes in its motion relative to the bucket. This suggests the water is litigating against a party other than the bucket.

  3.  The Plaintiff identifies this party as "Absolute Space." However, Absolute Space has not been served. The record shows Absolute Space possesses no local properties. It cannot be detected by any experiment conducted in uniform motion. It varies from place to place only insofar as things vary within it. We are asked to bind a party that cannot be impleaded, possesses no address, and admits no service of process.

  4.  Nevertheless, the effect is measurable. A judgment cannot be satisfied if the liable party is ubiquitous yet inaccessible. To hold otherwise would be to allow a defendant to evade liability by having no properties to vary. We find that Absolute Space, while elusive, is indispensable. The water knows it is spinning even when the bucket does not. Someone must be holding the bag.

  5.  Regarding the stipulated sub-case of the two globes in a void: The cord is taut. There is no surrounding matter to serve as a reference. The tension exists nonetheless. We must conclude the globes rotate with respect to the void itself. To rule otherwise would be to declare the tension a legal fiction, despite the cord's readiness to snap.

  **Concurrence**

  Judge EINSTEIN, concurring in the judgment.

  The Majority errs by treating Space as a noun rather than a verb. The issue is not service on a void, but the geometry of the field. The water is not rotating relative to Space; it is following a geodesic in a metric field determined by the distribution of mass-energy. However, the metric field is dynamic. A rotating bucket drags the local inertial frames. Thus, the water is concave because the metric tells it to be, and the metric is shaped by the mass of the universe. This resolves the standing issue by making the field a party to the action. However, this introduces a new complication: if the metric is the defendant, and the metric is affected by the plaintiff, we face a conflict of interest. The field is both the judge and the arena. This clarification leaves the procedural posture significantly more tangled than before, though physically robust.

  **Dissent**

  Judge MACH, dissenting.

  The Majority posits an invisible defendant to explain a visible effect. This is poor jurisprudence. The water rotates relative to the fixed stars. The concavity arises from motion relative to the bulk of matter in the universe. The remedy is straightforward: instead of spinning the bucket, spin the universe. The centrifugal forces would be identical. The Majority objects that no experiment distinguishes spinning the bucket from spinning the universe. I embrace this objection. If no experiment distinguishes the two states, the law should not distinguish them. To posit Absolute Space is to create a shell corporation for liability. We should dismiss the action for failure to state a claim against anything other than the fixed stars.

  **Disposition**

  The judgment of the District Court is AFFIRMED. Absolute Space is deemed a necessary party. The case is REMANDED to the District Court for instructions on how to serve process on a manifold.

  IT IS SO ORDERED.
