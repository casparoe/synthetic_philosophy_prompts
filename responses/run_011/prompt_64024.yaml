answer: |-
  **Project Title:** Clue-Preserving Consequentialism: Epistemic Stability as a Right-Making Feature

  **Project Overview**
  The "cluelessness" objection remains one of the most persistent challenges to consequentialist ethics. It argues that because ordinary acts ramify into distant futures, altering who comes to exist and shifting the causal background of later choices, agents cannot know enough to apply the theory. Standard responses treat this ignorance as a fixed feature of the world: consequentialism is merely a criterion of rightness, not a decision procedure; remote effects cancel out statistically; or agents must simply act on the best partial evidence available. This project challenges the assumption that ignorance is fixed. I propose that some acts are "clue-preserving"—they improve the epistemic position of future evaluators—while others widen the dispersion of possible futures. If consequentialism can rank options partly by their capacity to reduce future ignorance, the theory becomes something that works against cluelessness rather than merely enduring it. This six-month research leave will develop this principle, test its coherence, and determine its place within non-ideal consequentialist theory.

  **1. The Philosophical Question and Standard Replies**
  The primary task is to state the core question precisely enough to admit a determinate answer. "Improving one's epistemic position" cannot simply mean "knowing the future," as this presupposes the very knowledge the agent lacks. Instead, I will define it in terms of the expected value of information: an act is clue-preserving if it reduces the variance of value estimates for subsequent choices without requiring full knowledge of the remote effects themselves. The challenge is to cash out this notion without triggering the clueless calculations it is meant to displace. We must identify features of acts—such as institution-building, record-keeping, or welfare measurement—that reliably narrow the range of plausible futures based on general empirical regularities rather than specific causal predictions.

  This approach distinguishes itself from the three standard replies, which leave the malleability of ignorance unaddressed. The criterion/decision-procedure distinction accepts cluelessness as inevitable for the agent, restricting the theory to evaluating outcomes from a god's-eye view. The cancellation argument assumes symmetry in ignorance across options, ignoring that some acts structurally increase uncertainty. The "best evidence" reply treats ignorance as a static background constraint. My project argues that these replies fail because they treat epistemic limitations as exogenous. However, there is a live risk that this proposal collapses into the criterion/decision-procedure distinction. If "preserving clues" is merely a heuristic for deciding, it does not affect rightness. I will argue against this collapse by showing that epistemic stability is itself a value-producing feature of outcomes: a future where value is knowable is better than one where it is obscured, independent of the decision procedure used to reach it.

  **2. Methodology and Timeline**
  The six-month leave will be divided into three stages, each with a specific deliverable.

  *Months 1–2: Formalization.* I will refine the definition of "epistemic improvement" to ensure it does not presuppose clueless calculations. This involves modeling the dispersion of futures under different act-types. The deliverable will be a working paper outlining the formal constraints on the clue-preserving principle.
  *Months 3–4: Objections and Refinements.* I will focus on the central reflexivity worry and the agent-relativity question (see below). This stage involves stress-testing the principle against counterexamples where seeking knowledge impedes the good. The deliverable will be a draft section addressing these structural objections.
  *Months 5–6: Synthesis and Drafting.* I will integrate the findings into a complete manuscript suitable for submission to a leading ethics journal. The final deliverable will be a full draft of the article, "Consequentialism Against Cluelessness," ready for peer review.

  **3. The Reflexivity Worry**
  The central theoretical risk is reflexivity. Applying the clue-preserving principle to itself may demand exactly the remote-effect estimates the principle was invented to make unnecessary. To decide whether an act preserves clues, must I not know the remote effects of that act on my future knowledge? If so, the principle requires the knowledge it claims is unavailable, generating a regress.

  I will confront this by proposing a restriction on the principle's scope. The clue-preserving requirement need not apply to every choice via direct calculation. Instead, it can function as a secondary principle derived from general facts about information stability. For example, we may know generally that stable institutions preserve information better than volatile ones, without needing to calculate the specific causal chain of a particular institutional reform. The cost of this restriction is that the principle becomes less granular; it cannot rank specific acts unless they fall under known types of epistemic stability. I will argue this cost is not fatal. A principle that reduces cluelessness in high-stakes, structural choices is valuable even if it cannot resolve every minor decision. The project will assess whether this restricted scope preserves the theory's action-guiding force or renders it too weak to matter.

  **4. Agent-Relativity vs. Agent-Neutrality**
  A consequentialist theory is typically committed to agent-neutral value claims: the good is the good, regardless of who realizes it. However, the clue-preserving principle initially appears agent-relative: it improves *my* epistemic position. If I act to preserve my own clues, do I neglect the epistemic position of others? If the principle is strictly agent-relative, it risks collapsing into a form of egoism regarding information, which contradicts the agent-neutral foundations of consequentialism.

  I will argue that the principle must be framed agent-neutrally: an act is right partly insofar as it improves the epistemic position of whoever is deciding in the future, not just the current agent. This implies a duty to create public goods like data transparency and stable metrics of welfare. The implication for the theory is significant: it requires consequentialists to value epistemic infrastructure as a constituent of the good, not merely as a tool. I will explore whether this commits the theory to an excessive demand on agents to prioritize knowledge-production over immediate welfare relief. The project will determine if a balance can be struck where epistemic stability is weighted as a long-term multiplier on value without overriding urgent needs.

  **5. Success and Failure Conditions**
  A successful result will provide a coherent principle that allows consequentialists to rank options based on their epistemic downstream effects without triggering a regress. At the end of the leave, I will be able to claim that cluelessness is not a fixed boundary of the theory but a variable that agents can manage. Specifically, I will have demonstrated that "improving epistemic position" is a determinate right-making feature that does not collapse into the criterion/decision-procedure distinction.

  The project would count as failing if I demonstrate that the clue-preserving principle is incoherent—for example, if avoiding reflexivity requires restricting the principle so narrowly that it applies to no actual choices. Similarly, if the principle inevitably requires agent-relativity that contradicts agent-neutral value, the project will conclude that consequentialism cannot internalize the solution to cluelessness. Either outcome is philosophically significant, but the aim is to establish the former: that consequentialism can be robust against ignorance by valuing the conditions that make knowledge possible.
