  There is another gap we must acknowledge. When the protocol was adopted, every resident in this region stood the same chance of needing the ICU. A rule that looks fair when anyone might need it looks different when you are the one denied. We cannot say to a grieving family that this rule was acceptable because everyone might have needed it. Knowing you were at risk is not the same as bearing the loss. A rule that could be accepted in advance is not necessarily a rule that the person it falls on has reason to accept now. We cannot bridge that gap with words. We can only address it with what we do next. We cannot restore the time lost, but we can ensure the reasoning used is one you can face without being asked to vanish.

  So, here is what we are doing. The revised protocol will not include the discount for remaining years of life. Comorbidity will not be used to reduce the value of a patient's future. The estimate of survival to discharge will remain, because we must still ask if the treatment will work. But we will not weigh the length of the life saved.

  Furthermore, the disability-rights coalition will have a standing seat on the revision panel. We will not meet in private to decide these weights. And we will publish individual case reviews, not only totals. Totals hide the specific reasoning applied to a specific person. We will release the reviews so that each decision can be examined on its own merits. This allows each family to see the reasoning applied to their own case, rather than being hidden inside a general report.

  I want to speak to the clinicians and administrators who wrote and used this instrument. They worked under extreme pressure with the authority we gave them. They did not create the scarcity. They followed the protocol adopted by this authority. The responsibility for the rules lies with this committee and this board, not with the staff who enforced them in the ward. We will not be holding them accountable for following orders we issued. They cared for patients under conditions no one should face. They carried the burden of our decisions at the bedside. That burden should not become a target. They will not be made scapegoats for systemic decisions.

  We cannot undo the past eleven weeks. We cannot compensate for the nineteen lives lost. We can only ensure that the next time we face scarcity, the rules do not devalue people based on who they are. We are here to listen to your testimony. The record is open.
