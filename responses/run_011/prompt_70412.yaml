  **Prediction of the Ruling**

  I predict the professor will rule this pair as **(ii) a genuine case of indeterminacy**.

  While Manual A and Manual B are empirically equivalent and extensionally equivalent (they yield the same truth values for every sentence), they lack the structural bridge that the professor has consistently required to downgrade a conflict to a "notational variant." In every previous instance where ontological divergence was permitted under box (i)—the cup/part distinction, the object/region distinction, and the mountain/shadow distinction—the ledger explicitly notes or logically implies the existence of a systematic mapping (a "re-reading of the domain" or a global adjustment of terms) that preserves the logical structure of the language while shifting the referents. In the *kesh* case, you have stipulated that "there is no assignment of objects to objects that carries one manual into the other." This absence aligns the *kesh* case with Entry (3) (the cosmology case), where the lack of a re-reading function resulted in a ruling of genuine indeterminacy, rather than with Entry (5) (the *orun* case), where the presence of such a function secured a ruling of notational variance.

  **Analysis of Candidate Criteria**

  To justify this prediction, we must isolate the criterion that renders the first five entries consistent. We can evaluate four candidate criteria derived from the ledger.

  1.  **The Behavioral Equivalence Criterion:** *If two manuals predict identical assent/dissent dispositions for all sentences, they are notational variants (i).*
      *   **Consistency:** Fits Entries 1, 2, 4 (if complete), and 5.
      *   **Failure:** Contradicted by Entry 3. In Entry 3, the manuals agreed on all stimulus meanings and dispositions ("empirically equivalent"), yet the ruling was (ii). Empirical equivalence is a necessary condition for indeterminacy, but it is not sufficient for notational variance.
      *   **Prediction for *kesh*:** (i). Since the record is identical, this criterion demands they be notational. This matches Student 1's position but fails to account for Entry 3.

  2.  **The Truth-Condition Identity Criterion:** *If two manuals assign the same truth conditions to every sentence, they are notational variants (i).*
      *   **Consistency:** Fits Entries 1, 2, 4, and 5.
      *   **Failure:** This is the strongest rival, but it struggles with the specific wording of Entry 3. Entry 3 was ruled (ii) because the manuals assigned *different* truth conditions (7 rivers vs. 8 rivers). The *kesh* case stipulates "the same truth conditions for everything." If this were the sole criterion, *kesh* must be (i). However, this criterion cannot explain why Entry 5 required the explicit mention of a "one-to-one re-reading of the domain." If truth conditions alone sufficed, the re-reading in Entry 5 would be superfluous information. The professor noted it for a reason.
      *   **Prediction for *kesh*:** (i). This matches Student 1's position.

  3.  **The Proxy Function (Systematic Reconstrual) Criterion:** *Two manuals are notational variants (i) if and only if there exists a systematic mapping (proxy function) of the domain that transforms the referents of Manual A into the referents of Manual B while preserving logical structure.*
      *   **Consistency:** Fits all five entries perfectly.
          *   Entries 1 & 2: The "adjustment of every other Tarni term" implies a proxy function (e.g., mapping objects to their spatial regions or mereological parts).
          *   Entry 3: Explicitly states "not related by any re-reading of the domain," leading to (ii).
          *   Entry 4: Ruled (iii) because the record was incomplete, making the question of a proxy function moot until behavior is fixed.
          *   Entry 5: Explicitly cites the "one-to-one re-reading" as the justification for (i).
      *   **Prediction for *kesh*:** (ii). You stipulated that "no assignment of objects to objects... carries one manual into the other." Without a proxy function, the divergence in logical grammar (mass vs. count) is ontologically significant, not merely notational. This matches Student 2's position.

  4.  **The Logical Grammar Criterion:** *If two manuals disagree on the syntactic category of a term (e.g., mass vs. count, name vs. description), they are genuinely indeterminate (ii) unless a proxy function exists.*
      *   **Consistency:** Fits Entries 3 and 5. Entry 1 and 2 involve ontological shifts that usually entail grammar shifts (object vs. part), but they were saved by the global adjustment (proxy).
      *   **Prediction for *kesh*:** (ii). The disagreement is explicitly about logical grammar (mass term vs. count term) without the saving grace of a proxy function.

  **The Indistinguishable Criteria**

  The ledger cannot currently distinguish between the **Proxy Function Criterion** and the **Logical Grammar Criterion**. Both predict (ii) for *kesh* and (i) for Entries 1, 2, and 5. In Entries 1, 2, and 5, a proxy function *was* available, and the logical grammar shifts were accepted as notational. In Entry 3 and *kesh*, no proxy function was available, and the shifts were rejected (or would be rejected). We do not yet know if the professor would rule (i) for a case where a proxy function *exists* but the logical grammar shift is radical (e.g., treating events as objects), or if the grammar shift itself forces a (ii) ruling regardless of the proxy. However, given Quinean orthodoxy, the Proxy Function is the more fundamental mathematical condition for "notational variance," while logical grammar is usually derivative of that mapping.

  **Best Guess: The Actual Criterion**

  The professor is running the **Proxy Function Criterion**.

  **Reasons for Preference:**
  1.  **Explanatory Power for Entry 5:** In Entry 5 (*orun*), the reference diverged (mountain vs. shadow), yet the ruling was (i). The only distinguishing feature provided that saved it from Entry 3's fate was the "one-to-one re-reading of the domain." If Truth-Condition Identity were sufficient, that clause would be unnecessary. Its inclusion signals that the *mapping* is the decisive factor.
  2.  **Quinean Fidelity:** The seminar is built around Quine. Quine's solution to the gavagai problem is precisely that reference is inscrutable *unless* we adopt a background manual that provides a proxy function. Without that function, we have indeterminacy of translation. The *kesh* case is a variation on gavagai (stuff vs. portions); without the function to map water to water-stages, the ontology is genuinely indeterminate.
  3.  **Handling Entry 3:** Entry 3 shows that empirical equivalence is not enough. The Proxy Function Criterion explains *why* Entry 3 is (ii) (no mapping) and why *kesh* is also (ii) (no mapping), even though *kesh* has matching truth conditions and Entry 3 did not. The lack of a mapping makes the truth conditions "incommensurable" in a structural sense, even if they are extensionally identical.

  **Proposed Entry 6**

  To separate the **Truth-Condition Identity Criterion** (Student 1) from the **Proxy Function Criterion** (Student 2/My Prediction), propose the following case:

  *   **The Case:** Tarni has a term *vex*. The record shows assent when a lightning flash occurs. Manual A translates *vex* as "lightning event" (count noun). Manual B translates *vex* as "temporal stage of the atmospheric electrical process" (mass/stage term).
  *   **The Stipulation:** The two manuals yield identical truth conditions for all sentences. *However*, unlike the *kesh* case, you explicitly stipulate that **a one-to-one proxy function exists** that maps events to their temporal stages and adjusts the logical particles accordingly.
  *   **The Separation:**
      *   If the professor rules **(i) Notational Variant**, it confirms that the Proxy Function is sufficient to override logical grammar differences. This validates the prediction that *kesh* was (ii) *only* because it lacked the proxy.
      *   If the professor rules **(ii) Genuine Indeterminacy**, it implies that Logical Grammar trumps the Proxy Function. This would suggest *kesh* is (ii) because of the mass/count distinction itself, regardless of mapping.

  This entry isolates the variable that decided *kesh*: the presence or absence of the mapping function.

  **The Principle and the Linguistic Instinct**

  If the seminar accepts the ruling of **(ii) Genuine Indeterminacy** on *kesh*, we commit ourselves to the principle that **ontological categories (such as mass vs. count) are factually significant when they are not systematically intertranslatable.** We are affirming that meaning is not exhausted by truth conditions (extension); the *structure* of reference matters. Two theories can describe the same world accurately (same truth conditions) but still be genuinely different theories if they carve the world's logic differently without a bridge function.

  Regarding your undergraduate instinct: **Yes, hunting for a behavioral difference here is a category mistake.**

  Your training in linguistics likely emphasizes that grammatical categories (like mass vs. count) must have some functional or distributional reflex in the language. You want to find a sentence where the natives assent in one case and dissent in the other to prove one manual is right. But the parameters of the exercise stipulate that the **observational record is complete** and the **dispositions are fixed**.

  In the Quinean framework of this seminar, behavior (stimulus meaning) is the *limit* of evidence. If the behavioral record is exhausted and the manuals still diverge, there is no "hidden" behavioral fact waiting to be found. To insist there *must* be one is to reject the premise of indeterminacy itself. The indeterminacy arises precisely *because* behavior underdetermines logic. If you could elicit a behavioral difference, the case would automatically fall into box (iii) "not a case of indeterminacy," as seen in Entry 4. By definition, a case of genuine indeterminacy (ii) is one where no further elicitation *can* settle the matter. Your instinct seeks to dissolve the philosophical problem by turning it into an empirical one, but the seminar is designed to show where the empirical runs out.
