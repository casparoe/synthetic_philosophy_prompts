          *   So, the *language* wears Representationalism/CKA on its sleeve, but the *operation* doesn't strictly require it.
      *   **2. Presupposition vs. Consistency:**
          *   Strict presupposition: Some sensory inputs are unreliable indicators of reality in specific contexts. Some artificial indicators are more reliable in those contexts.
          *   Consistent with: Sense-data, Representationalism, Disjunctivism, Naive Realism.
          *   Metaphysical vs. Operational: It's overwhelmingly operational. The doctrine cares about *truth-tracking*, not *ontological status*.
      *   **3. The Inconsistency:**
          *   Is it a tension? Superficially, yes (ignore body vs. trust eyes).
          *   Reconciliation: It's about *signal-to-noise ratio* and *reference frames*.
          *   Vestibular system lacks an external reference in IMC (Instrument Meteorological Conditions). Visual system *provides* the external reference in VMC (Visual Meteorological Conditions).
          *   Instruments are proxies for the outside world. When the outside world is visible, the proxy is less valuable than the source (unless the source is degraded, e.g., night/featureless).
          *   The "visual illusion" management (procedure vs. instruments) is because visual landing requires active control loops that instruments alone cannot satisfy (flare, alignment), whereas instrument flight is about state maintenance.
          *   Actually, the visual illusion part is key: We admit vision can lie, but we still require it. Why? Because instruments don't give you *spacing* and *texture* needed for landing. So it's not "Trust Vision because it's True," it's "Trust Vision because it's Necessary, but constrain it with Procedure."
          *   So the reconciliation is *Functional Necessity* + *Reliability Hierarchy*.
      *   **4. Underdetermination:**
