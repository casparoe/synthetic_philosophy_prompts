          *   Phase 2 (Visual Approach): Instruments are deemed insufficient. Direct visual contact with the environment is required. Visual illusions exist but are managed by procedure/rules, not by overriding vision with more instruments (though EVS/SVS are emerging).
      *   **Requirements:**
          1.  Reconstruct the presupposed theory of perception (common kind vs. disjunctive?).
