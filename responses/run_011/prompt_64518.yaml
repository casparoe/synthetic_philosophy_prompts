          3.  Address the apparent inconsistency (tension vs. reconciliation).
          4.  Report underdetermination (which rival theories fit the practice?).
          5.  Run the counterfactual (what if we adopted disjunctivism/direct realism?).
      *   **Constraint:** Lead with a single opening sentence stating the bottom line (commitment to a view or none). No preamble. No restating the question. Organize under the five headings.

  2.  **Deconstruct the Philosophy:**
      *   **Instrument Flight Doctrine:** "You cannot tell the difference from the inside." This sounds like the *Common Kind Assumption* (CKA). If veridical and illusory experiences are introspectively indistinguishable, they share a common fundamental nature (usually an inner state). This aligns with *Representationalism* or *Sense-Data Theory*. The remedy is to trust the *representation* (instruments) over the *sensation*.
      *   **Visual Approach Doctrine:** "You must see the environment." Instruments are not enough. This sounds like *Direct Realism* or *Relationalism* (Disjunctivism). The value is in the direct relation to the world. However, visual illusions are acknowledged. The remedy is procedure, not necessarily overriding vision with *more* representation (though EVS is a representation).
      *   **Tension:** Instrument flight says "Trust the representation, ignore the sensation." Visual flight says "Trust the sensation (vision), ignore the representation (altimeter/glideslope) *once verified*."
      *   **Resolution:** It's likely pragmatic/operational rather than metaphysical. The doctrine is about *reliability under specific conditions*, not the *nature* of perception itself.

  3.  **Drafting the Response - Section by Section:**

      *   **Bottom Line:** Needs to be punchy. The practice commits us to no specific metaphysical view of perception, but rather to a pragmatic epistemology of reliability conditioned on environmental context.
      *   **1. Reconstruct the Theory:**
          *   The "undetectable from the inside" claim strongly suggests the Common Kind Assumption (CKA). If I can't tell the difference, the mental state must be the same.
