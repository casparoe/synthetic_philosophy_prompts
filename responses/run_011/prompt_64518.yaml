answer: |-
  The practice commits us to no specific metaphysical view of perception, but rather to a pragmatic epistemology that prioritizes reliability and environmental access over the ontological status of sensory experience.

  ### 1. Reconstruct the theory of perception the doctrine presupposes
  The doctrinal claim that a spatial illusion is undetectable from the inside strongly suggests the Common Kind Assumption (CKA), which holds that veridical and illusory experiences share a fundamental inner state, differing only in their causal history. By instructing pilots that the felt sense of a pitch-up is phenomenologically identical whether caused by actual rotation or linear acceleration, the training language implies that perception is an inner representation that may or may not match the world, aligning closely with Representationalism or Sense-Data Theory. However, the practice does not strictly require this metaphysical commitment; it requires only the weaker epistemic claim that the subject lacks introspective access to the causal origin of the experience. A Disjunctivist could accept the training directive—that you cannot tell the difference from the inside—without accepting that the underlying mental states are of the same kind, maintaining instead that one case is a relation to the world and the other is a mere appearance, even if the subject cannot distinguish them in the moment. Thus, the doctrine wears Representationalism on its surface, but the operational requirement is merely the indistinguishability of the cases, not their ontological identity.

  ### 2. Separate what the practice strictly presupposes from what it is only consistent with
  The doctrine is wedded to an operational rule about input reliability, not a metaphysical theory of mind. Strictly presupposed is the fact that certain sensory channels (vestibular/proprioceptive) lose correlation with physical reality under specific dynamic conditions, while artificial instruments maintain that correlation. It is also presupposed that visual contact provides data necessary for terminal guidance that instruments cannot supply, regardless of the metaphysical status of that vision. The practice is consistent with Sense-Data Theory, Representationalism, Naive Realism, and Disjunctivism alike, because all can accommodate the premise that sensory input is sometimes unreliable and sometimes necessary. The commitment is genuinely engineering policy: it dictates which signal source has the highest truth-tracking value in a given context. There is no requirement in the syllabus that forces an instructor to believe perception is an inner state; they need only believe that acting on vestibular input in Instrument Meteorological Conditions (IMC) leads to catastrophe, while acting on visual input in Visual Meteorological Conditions (VMC) is required for landing.

  ### 3. Deal with the apparent inconsistency
  The two halves of the doctrine are not in tension when viewed through the lens of epistemic access and functional necessity rather than sensory hierarchy. In the instrument phase, the environment (the horizon) is occluded, so the pilot lacks direct perceptual access to attitude; the instruments serve as a symbolic proxy for the missing environmental relation, and the bodily senses are rejected because they provide false data about that missing relation. In the visual phase, the environment is accessible, and while visual illusions exist, the visual system provides critical texture, depth, and motion-parallax data required for flare and alignment that instruments cannot replicate. The reconciliation lies in the fact that visual illusions are managed by procedure (stabilized approach, go-around criteria) because the visual channel is functionally necessary for the task, whereas vestibular illusions are managed by substitution because the vestibular channel is functionally irrelevant to the task of state estimation in IMC. The instruments are not subordinated to vision because vision is metaphysically superior, but because vision provides high-bandwidth data essential for control that instruments lack, provided procedural guards mitigate the risk of deception.

  ### 4. Report where the practice is underdetermined
  Rival theories including Representationalism, Disjunctivism, and even Behaviorism would license exactly the same syllabus, drills, and accident-investigation conclusions. A Representationalist says, "Check the instrument representation because the sensory representation is faulty." A Disjunctivist says, "You lack perceptual contact with the horizon, so rely on the symbolic display; once you have contact, use it." Both arrive at "fly the instruments" in IMC and "look outside" in VMC. Nothing in the practice—no specific maneuver, checklist item, or regulation—makes sense on one view but not the other, because the training concerns the correlation between input and outcome, not the nature of the input itself. The profession has an implicit engineering policy, not an implicit metaphysics. The question would only be settled if a training directive relied on the *nature* of the experience rather than its *reliability*—for example, if we were taught to trust vision because it puts us in direct contact with reality rather than because it allows us to judge flare height—but no such directive exists.

  ### 5. Run the counterfactual
  If we rebuilt training from the view that veridical perception is direct acquaintance rather than an inner state, nothing in the practical drills would change, though the explanatory language would shift. "Fly the instruments" would become "Acknowledge you lack perceptual contact with the horizon," and "Look outside" would become "Establish perceptual contact with the runway." Synthetic vision and infrared-derived imagery would remain a natural completion of the doctrine, not an abandonment, because they are still understood as enhanced representations designed to restore access to environmental features, not as direct acquaintance themselves. No drill for illusions would need rewriting, because the corrective action depends on the unreliability of the input, not its ontological category. This tells us that the doctrine's philosophical language bears almost no weight; terms like "illusion," "sensation," and "representation" are used as folk-psychological shorthand for "unreliable sensor data" versus "verified data," and the system functions identically regardless of whether one believes the verified data is an inner state matching the world or a relation to the world itself.
