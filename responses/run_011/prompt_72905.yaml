  # Joint Statement on the Two-Envelope Problem and Variant
  **Prepared for:** Decision Theory Seminar Reading Group
  **Subject:** Adversarial Collaboration on Dissolutionist and Residualist Positions

  ### I. Agreed Claims
  *The following propositions are accepted by both Camp A (Dissolutionists) and Camp B (Residualists) as mathematically correct or descriptively accurate regarding the setup. Parentheticals indicate necessary technical qualifications.*

  1.  **Symmetry:** Unconditionally, the expected value of Envelope A equals the expected value of Envelope B ($E[A] = E[B]$), provided these expectations exist.
  2.  **Naive Calculation:** The argument for always switching relies on the premise that $P(B=2x | A=x) = P(B=x/2 | A=x) = 0.5$ for all observed $x$.
  3.  **Prior Dependence:** The conditional probability $P(B=2x | A=x)$ is determined by the prior distribution over the smaller amount (or the ceiling $N$ in the variant).
  4.  **Impossibility of Uniformity:** No proper probability distribution over positive real numbers (or integers) assigns equal probability to $S=x$ and $S=x/2$ for all $x$. (Folklore/Standard Measure Theory).
  5.  **Infinite Expectation Condition:** If the naive switching argument holds for *every* possible observed $x$, the unconditional expected value of the money in the envelopes must be infinite or undefined. (Requires the hypothesis that the law of total expectation applies; if expectations diverge, the inequality $E[B|A=x] > x$ can hold everywhere without contradicting $E[A]=E[B]$).
  6.  **Proper Prior Behavior:** Given any proper prior with a finite mean, there exists a threshold value $K$ such that switching is unfavorable for any $x > K$.
  7.  **Unconditional Gain:** Under a proper prior, the unconditional expected gain from an "always switch" policy is exactly zero.
  8.  **Variant Setup:** In the proposed variant, the pair of amounts is uniquely determined by the integer $N$ as $\{2^N, 2^{N+1}\}$.
  9.  **Information Equivalence:** In the variant, observing $x$ and being told $N$ is logically equivalent to observing $x$ and being told whether $x$ is the smaller or larger amount. (Under the assumption that the player can compute powers of 2).
  10. **Value of Information:** The rational price for information is the increase in expected utility gained by acting on that information compared to acting without it.
  11. **Undefined Values:** If the expected utility of a policy is infinite or undefined, the standard definition of the "price" of information yields no finite real number.
  12. **Dominance Principle:** A policy $P_1$ dominates $P_2$ if $P_1$ yields a strictly better outcome than $P_2$ in every possible state of the world.
  13. **Always-Switch Dominance:** In the variant, the policy "Switch if told 'Smaller', Stay if told 'Larger'" dominates the policy "Always Switch" (it wins more in the 'Smaller' state and loses nothing in the 'Larger' state relative to staying).
  14. **Ignorance of D:** In the variant, the player is not given the distribution $D$ from which $N$ is drawn.
  15. **Existence of D:** Both camps agree an objective distribution $D$ exists, even if unknown to the player.
  16. **St. Petersburg Link:** The variant structurally resembles the St. Petersburg paradox if $D$ allows $N$ to grow sufficiently fast (e.g., $P(N=n) \propto 1/n^2$).
  17. **Decision Necessity:** The player must make a decision (switch/stay/buy info) before $D$ is revealed or inferred with certainty.
  18. **Algebraic Validity:** Both camps accept the standard Bayesian algebra used by Camp A as *mathematically* correct given a fixed prior; the dispute is over its *applicability*.

  ### II. Disagreements Table

  | ID | Disagreement in Neutral Wording | How Camp A States Its Own Side | How Camp B States Its Own Side | Verbal, Substantive, or Partly Both | What Would Settle It | Camp A's Prediction | Camp B's Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **The Ontology of the Paradox** | The paradox is a cognitive illusion caused by equivocation on the variable $x$ and misuse of conditional probability. | The paradox is a genuine pathology in decision theory revealing limits of expectation maximization under ignorance. | Partly Both | Consensus on whether "paradox" refers to a calculation error or a structural limit. | The puzzle is dissolved once the conditioning error is identified. | The puzzle remains even after the error is identified, shifting to the prior selection problem. |
  | **2** | **Role of the Prior** | Specifying a proper prior is the *solution*; without it, the problem is ill-posed. | Specifying a proper prior *evades* the problem; the core challenge is decision-making without it. | Substantive | Agreement on whether "ignoring the prior" is a valid decision-theoretic stance. | No determinate decision can be made without $D$. | A determinate decision (e.g., buy the Bit) can be made via dominance, independent of $D$. |
  | **3** | **Infinite Expectations** | Infinite expectations indicate a broken model; rational agents should not engage with such gambles. | Infinite expectations are a feature of the landscape; rational agents need principles to handle them. | Substantive | A normative theory for divergent series in utility. | The variant is ill-posed if $E[2^N]$ diverges. | The variant is the *most* important case if $E[2^N]$ diverges. |
  | **4** | **Price of Info (Fee G)** | The price $G$ is undefined without knowing $D$, as the expected gain depends on $E[2^N]$. | The price $G$ is determinate (and positive) based on dominance, regardless of $D$'s tail. | Substantive | A calculation showing $G$ is bounded independent of $D$. | $G$ is undefined or infinite if $D$ is heavy-tailed. | $G$ is finite and rationally payable even if $D$ is unknown/heavy-tailed. |
  | **5** | **Price of Info (Fee F vs G)** | Since $N$ reveals the Bit, Price($F$) must equal Price($G$) under linear utility. | Price($F$) may be indeterminate while Price($G$) is determinate, as $N$ exposes the divergence more directly. | Partly Both | Clarity on whether "price" refers to expected value or dominance value. | $F = G$ (or both undefined). | $G$ is robustly defined; $F$ is susceptible to St. Petersburg divergence. |
  | **6** | **Criterion for Solution** | A solution restores consistency to standard Expected Utility (EU) theory. | A solution requires modifying or supplementing EU theory (e.g., with dominance principles). | Verbal | Agreement on what counts as "solving" a decision puzzle. | Standard EU is sufficient. | Standard EU is incomplete. |

  ### III. Real Cruxes

  **1. The Status of Ignorance Priors**
  The fundamental divide is whether "I don't know $D$" is a state of mind to be modeled by a specific prior (Camp A: use a proper prior, perhaps hierarchical) or a state of nature that precludes expectation calculations (Camp B: use non-probabilistic decision rules). Camp A views the refusal to pick a prior as an abdication of Bayesian duty; Camp B views the imposition of a proper prior as "smuggling in" knowledge the agent does not have. The variant tests this: if $G$ (the Bit) allows a dominating strategy without knowing $D$, Camp B claims victory for dominance-based reasoning. Camp A will counter that without $D$, you cannot calculate the *magnitude* of the gain, only the direction, so pricing $G$ is still impossible.

  **2. Divergent Expectations as Bug vs. Feature**
  Camp A treats infinite expectations as a signal that the model has left the domain of applicability for standard decision theory (a bug). Camp B treats them as the precise location where decision theory needs to be extended (a feature). In the variant, if $D$ is such that $E[2^N] = \infty$, Camp A predicts the rational fee is undefined (no finite price is correct). Camp B predicts the rational fee for the Bit is *any* finite amount, because the strategy "Buy Bit, then Switch if Small" dominates "Don't Buy," regardless of the infinite tail. Settling this requires agreeing on whether dominance trumps expectation when expectations diverge.

  **3. The Definition of "Solution"**
  There is a verbal component regarding what it means to "solve" the paradox. Camp A defines success as showing why the naive argument is invalid (dissolution). Camp B defines success as explaining why the naive argument feels compelling and what rational action looks like in the limit cases it points to (resolution). This is partly verbal (what label we apply), but substantive in that it dictates research programs: one camp analyzes probability errors, the other analyzes decision principles under ignorance.

