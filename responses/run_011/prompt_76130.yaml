  2.  **Deconstruct the Philosophical Underpinnings:**
      *   *The Expanding Circle (Peter Singer):* Moral progress is extending impartial consideration to others based on relevant characteristics (sentience, interests), not group membership.
      *   *Moral Progress (James Russell, Michelle Moody-Adams, etc.):* Distinguish between *conceptual* progress (understanding better) and *substantive* progress (actually doing better). Distinguish between *fashion* and *justification*.
      *   *Resource Constraints:* Foundations have fiduciary duties to their mandate. Dilution is a real ethical cost (opportunity cost).
      *   *Epistemic Humility:* We don't know everything about sentience or future value.
      *   *The Four Changes:*
          1.  *Genuine Widening:* New entities have morally relevant properties previously ignored.
          2.  *Reweighting:* Existing entities count more/less (e.g., prioritizing suffering over happiness).
          3.  *Vocabulary:* Calling things "rights" instead of "charity" without action change.
          4.  *Zero-Sum:* Helping group B hurts group A (trade-off).

  3.  **Drafting the Decision Procedure (The "One-Hour Protocol"):**
