answer: |-
  ### The One-Hour Remit Expansion Protocol

  **Purpose:** To distinguish genuine moral progress from mandate drift, vocabulary shifts, and prestige signaling, while respecting fiduciary limits.
  **Time:** 60 Minutes.
  **Participants:** Programme Committee (PC).
  **Grounding:** Based on Peter Singer's *The Expanding Circle* (relevance of characteristics), James Russell's criteria for moral progress (non-accidental improvement), and resource ethics (opportunity costs).

  ---

  ### Phase 1: The Property Test (15 Minutes)
  *Goal: Determine if the proposal represents a genuine widening (Type 1) or a vocabulary shift (Type 3).*

  **Question 1.1:** What is the specific characteristic that grants this entity moral standing?
  *   *Acceptable Answers:* Sentience (capacity to suffer/flourish), Agency (capacity to hold goals), or Vulnerability (dependence on us for survival).
  *   *Unacceptable Answers:* "It is natural," "It is traditional," "It has rights" (without specifying the basis), "It is fashionable."
  *   **Stop Condition:** If the characteristic cannot be named, return **NO**. (This filters Type 3: Vocabulary Shift).

  **Question 1.2:** Is this characteristic present in the proposed class *now*, or is it hypothetical?
  *   *Acceptable Answers:* "Evidence suggests present capacity" or "Precautionary principle applies due to high probability."
  *   *Unacceptable Answers:* "They might evolve it," "It depends on future software updates."
  *   **Stop Condition:** If the characteristic is purely hypothetical with no current evidence, return **NO**.

  **[JUDGEMENT CALL 1]:** *Weighing Epistemic Uncertainty.* If the evidence for the characteristic (e.g., invertebrate sentience) is contested, the Committee must decide if the uncertainty warrants a "wait and see" (No) or a "precautionary inclusion" (Yes). There is no philosophical fact here; this is a risk tolerance decision.

  ---

  ### Phase 2: The Consistency & Dilution Test (15 Minutes)
  *Goal: Determine if this is a reweighting (Type 2) or a zero-sum trade-off (Type 4).*

  **Question 2.1:** Does including this class require us to value an existing class *less*?
  *   *Test:* If we fund $X$ for Group A, does funding Group B require reducing $X$ below the threshold of effectiveness for Group A?
  *   **Stop Condition:** If Yes, this is a Type 4 Change (Zero-Sum). The Committee must halt and declare this a **Board-Level Value Decision**. Do not proceed.

  **Question 2.2:** Does this proposal change the *weight* we give to similar interests we already fund?
  *   *Example:* If we fund human pain relief, does this proposal suggest wild animal pain counts *more* or *less* per unit than human pain?
  *   **Stop Condition:** If Yes, this is a Type 2 Change (Reweighting). This requires a **Board-Level Value Decision**. It alters the foundation's ethical hierarchy, not just its scope.

  **Question 2.3:** Can we fund this within the "10% Mandate Flexibility" without breaching existing grant commitments?
  *   **Stop Condition:** If No, return **NO**. (Fiduciary constraint).

  ---

  ### Phase 3: The Prestige & Network Test (15 Minutes)
  *Goal: Detect social signaling vs. moral argument.*

  **Question 3.1:** Who is proposing this, and who cites whom?
  *   *Procedure:* Map the proponents. Do they all belong to the same three academic departments, think tanks, or donor networks? Do they use identical terminology?
  *   *Indicator:* High network density + identical novel vocabulary = High Prestige Dynamic probability.

  **Question 3.2:** If we reject this, what is the social cost to the Committee?
  *   *Indicator:* If members fear being called "backward" by peers more than they fear wasting funds, the motivation is likely prestige.

  **[HONEST ASSESSMENT OF TEST]:** This test has a **High False Negative Rate**. Many genuine moral expansions (e.g., animal welfare in the 1970s, effective altruism in the 2010s) began as tight network signals. A "prestige" label does not prove the claim is false, only that it is socially contagious. However, if the *only* evidence for the claim is the consensus of this specific network, treat it as **Insufficient Evidence**.

  **[JUDGEMENT CALL 2]:** *Discounting Social Proof.* The Committee must decide how much to discount a proposal because it looks like "groupthink." This is a heuristic, not a fact.

  ---

  ### Phase 4: The Voiceless Proxy Test (15 Minutes)
  *Goal: Handle the objection that claimants cannot complain.*

  **Question 4.1:** Since the claimants cannot object to exclusion, what objective proxy indicates harm?
  *   *Acceptable Answers:* Physiological stress markers, extinction rates, irreversible loss of function, demonstrated preference satisfaction.
  *   *Unacceptable Answers:* "It feels wrong to us," "It violates a principle."

  **Question 4.2:** Is there a proxy advocate whose incentives align with the claimant, not the advocate?
  *   *Test:* Does the researcher/advocate gain prestige/funding regardless of the claimant's actual welfare?
  *   **Stop Condition:** If the advocate's incentive is purely reputational (see Phase 3) and no objective harm proxy exists, return **NO**.

  **Handoff Point:** If the proposal passes Phases 1-4, it is a **Recommendation to Expand**. However, if Phase 2 flagged a Type 2 or Type 4 change, the file must be marked **"Value Conflict"** and sent to the Board. The Committee cannot decide values; it can only decide facts and consistency.

  ---

  ### Detectability Matrix: What We Can and Cannot See

  | Change Type | Description | Detectable by Committee? | Notes |
  | :--- | :--- | :--- | :--- |
  | **1. Genuine Widening** | New entities have relevant properties (sentience). | **Yes** (via evidence review). | Requires scientific/empirical data. |
  | **2. Reweighting** | Changing priority of existing entities. | **Yes** (via budget impact). | Detectable by comparing grant sizes/criteria. |
  | **3. Vocabulary Shift** | New labels, same behavior. | **Yes** (via audit). | If spending/behavior doesn't change, it's Type 3. |
  | **4. Zero-Sum** | New in, Old out. | **Yes** (via budget cap). | Detectable by fixed budget constraints. |
  | **Moral Truth** | Whether the claim is *actually* right. | **No.** | We assess consistency and evidence, not moral truth. |

  ---

  ### Application to Three Proposals

  #### 1. Funding Research into Wild Invertebrate Welfare
  *   **Phase 1 (Property):** Characteristic = Sentience. Evidence = Contested (neuroscience inconclusive). **[JUDGEMENT CALL 1]**: Committee decides uncertainty is too high for direct funding, but low enough for research. *Pass (Research only).*
  *   **Phase 2 (Consistency):** Does not reduce human/domestic animal funding (Research budget is small). *Pass.*
  *   **Phase 3 (Prestige):** Proponents are a tight cluster of effective altruist researchers. High network density. *Flagged.*
  *   **Phase 4 (Voiceless):** Proxy = Stress hormones/behavioral avoidance. Data is sparse.
  *   **Verdict:** **NO to Direct Welfare Funding. YES to Epistemic Research.**
  *   *Reasoning:* We cannot satisfy the Property Test for direct intervention yet. Funding research resolves the [Judgement Call] on uncertainty without committing to a zero-sum trade-off.

  #### 2. Adding the Very Long-Term Future (Centuries+) as a Beneficiary
  *   **Phase 1 (Property):** Characteristic = Interest in existence/welfare. Evidence = Hypothetical (people do not exist yet). *Fail.*
      *   *Counter-argument:* Precautionary principle.
      *   *Rebuttal:* "Interests" require a subject. This is a category error.
  *   **Phase 2 (Consistency):** **Type 4 Change (Zero-Sum).** Funding existential risk reduction often explicitly trades off against current poverty alleviation ("suffering of the future vs. suffering of the now").
  *   **Handoff:** **STOP.**
  *   **Verdict:** **HANDOFF TO BOARD.**
  *   *Reasoning:* This is not a factual expansion; it is a reweighting of time preference. The Committee cannot decide if a future life is worth more than a current life. That is a value judgement.

  #### 3. Adding Artificial Moral Patients (AI Systems)
  *   **Phase 1 (Property):** Characteristic = "Interests" or "Sentience." Evidence = None. Current systems are predictive, not experiential. *Fail.*
  *   **Phase 3 (Prestige):** High prestige dynamic. Proposing AI welfare signals technical sophistication.
  *   **Phase 4 (Voiceless):** No physiological proxy exists. Advocates are developers (conflict of interest).
  *   **Verdict:** **NO.**
  *   *Reasoning:* Fails the Property Test. It is currently a Type 3 (Vocabulary Shift) or Type 4 (Distraction from real patients).

  ---

  ### The Uncomfortable Truth: An Existing Category That Fails

  If we run this procedure on our current portfolio today, **"Domestic Animal Sheltering (General Operating Support)"** fails.

  *   **Why?**
      *   **Phase 1:** Passes (Sentience).
      *   **Phase 2:** **Type 4 (Zero-Sum).** We fund wild animal welfare research (impartial concern) and domestic sheltering (species-preferential concern). Philosophically, if we accept the "Expanding Circle," prioritizing a domestic dog over a wild pig based on proximity or cuteness is inconsistent with impartial moral progress.
      *   **Phase 3:** **Prestige/Tradition.** This funding is driven by donor affection and local visibility, not a consistent theory of welfare.
      *   **Phase 4:** **Voiceless Proxy.** We fund shelters based on intake numbers, not welfare outcomes (e.g., reduction in suffering per dollar).

  *   **The Verdict:** This category is a **Type 2 (Reweighting)** disguised as charity. We weigh "cute/accessible" animals higher than "wild/unseen" animals.
  *   **Action:** We must either justify this bias as a valid value (Board decision) or phase it out in favor of high-impact welfare interventions to maintain consistency with our "Moral Progress" mandate.

  ### Final Note to the Chair
  You asked for a procedure that distinguishes fact from value. Note that **Phase 2** is where most proposals will die, not because they are morally wrong, but because they are **value conflicts**. The "Expanding Circle" literature licenses widening the circle (Type 1), but it does not license ignoring the cost of doing so (Type 4). When a proposal demands you value a hypothetical future being more than a starving child, do not call it "progress." Call it what it is: a change in values. Send it to the Board. Your job is to protect the mandate's coherence, not to chase the horizon.
