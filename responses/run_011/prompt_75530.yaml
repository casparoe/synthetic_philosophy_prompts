answer: |-
  The dust in District Four was not merely dirt; it was a suspension of failed crops, ground bone-dry and floating in the slanted light of the bureau office. Elara sat at her desk, the wood worn smooth by the elbows of clerks who had sat there before her. She did not optimize. She did not weigh. She had a number in her head, a specific yield-per-litre figure that lived behind her eyes like a persistent afterimage. It tasted of copper and dry clay.

  Her procedure was simple, inherited from the woman who had occupied the chair before the droughts truly bit. Requests arrived in a stack, ordered by the timestamp of their submission. Elara picked up the top file. She scanned the projected efficiency. If the number in the file met or exceeded the number in her head, she stamped it *Approved* and stopped for the day. The rest of the stack waited for tomorrow. If the file did not meet the number, she set it aside into the rejection bin and picked up the next. She never looked back at the rejected ones. They were gone, water allocated elsewhere or not at all.

  The number in her head was not fixed. It breathed. When a season was hard and files piled up in the rejection bin without a single stamp, the number in her head would slowly, imperceptibly soften. The copper taste faded. The threshold lowered until something, anything, could clear it. When wins came easy, the number hardened, sharpening into a jagged edge that demanded more.

  In District Four, wins were not easy. The farmers were small, the wells deep and stingy. The stack was always long. On a Tuesday in late July, Elara picked up the file for the Miller orchard. Old man Miller needed water for heirloom apples, a high-value crop but water-intensive. The projected yield was solid, but it sat just below the copper taste in her mind. It wasn't enough. She set the file aside. Her hand moved automatically to the next folder. A cooperative growing drought-resistant sorghum. The yield was lower in absolute terms, but the efficiency ratio cleared her threshold. She stamped it. She stopped.

  She went home for the day. The Miller file sat in the rejection bin. By the time the next allocation cycle opened, the heat had cracked the topsoil around the apple trees. Miller didn't ask again. He couldn't. Elara never knew; the procedure forbade looking back. To look back would be to weigh, to compare, to optimize. She simply moved to the next day's stack.

  Because the district was poor, her threshold remained low, tempered by the constant friction of rejection. She made decisions quickly. She never agonized. Water moved out the door within hours of the stack arriving. The provincial overseers marvelled at her throughput. While other clerks modeled hydrological tables and debated marginal utility for weeks, Elara's stamp was a rhythmic heartbeat in the dusty office. She was called efficient. She was called genius. She was just satisficing in a environment that kept her aspirations humble.

  Then came the promotion. A transfer to District One, the Verde Valley.

  The office in District One smelled of ozone and fresh ink, not dust. The air conditioning hummed, masking the sound of the outside world. The requests here did not arrive on thin, crumpled paper. They came in glossy folders, bound with plastic combs, prepared by teams of agronomists and lawyers for corporate growers. The aquifers here were deep. The technology was precise.

  Elara sat at the new desk. The number in her head was still set to the District Four level, low and accommodating. She picked up the first file. A hydroponics consortium. The yield-per-litre was triple what she was used to. It cleared the threshold effortlessly. She stamped it.

  She felt a strange tightening in her jaw. It was too easy. The copper taste in her mouth sharpened into steel. She hadn't worked for that yes.

  The next day, the stack was equally rich. A vineyard consortium. High efficiency. It cleared the threshold again. She stamped it, but the tightening in her jaw became a headache. The number in her head drifted upward, invisible and involuntary. If this was the standard now, why settle for yesterday's number? Her internal aspiration ratcheted up, chasing the easy wins.

  By the third week, the number had climbed significantly. She still stamped requests, but only the exceptional ones. She passed over good offers that would have been kings in District Four. The queue began to grow. Not a pile of dust-covered desperation, but a neat, terrifying stack of high-value proposals waiting for her stamp.

  She didn't notice the drift until the silence began. In District Four, the silence was the absence of water. Here, the silence was the absence of movement. She sat with her hand hovering over the ink pad. She picked up a file. A tech-agri firm proposing vertical farming. The efficiency was incredible, the best she had seen in months. But the number in her head had risen overnight, fueled by the success of the previous week. The file didn't clear it. She set it aside.

  Next file. A genetically modified grain project. Also incredible. Also below the number.

  She kept reading. The stack did not shrink. It grew. The procedure demanded she grant the *first* one that cleared the level. But the level was now above the ceiling of what was physically possible in the valley. She had become, by accident, a maximizer with no maximum. She was waiting for a perfect request that did not exist, unable to settle for the excellent ones she had already passed.

  Outside the window, the Verde Valley remained green, but the edges were browning. The corporate growers, used to certainty, began to call. Then they began to protest. The queue backed up into the hallway. Water sat in the reservoirs, allocated to no one, while crops waited for the sign-off that would release it.

  Across the hall, Marcus worked in District Two. Marcus was an optimizer. He built models. He weighed every request against every other request in the cycle. He took a fortnight to make a decision that Elara used to make in an hour. The farmers hated him. They called him sluggish. They called him bureaucratic. But Marcus's cutoff was fixed by his model, not by his recent luck. His threshold did not drift with the wind. He outputted decisions, slow and steady, like a metronome. People complained about the wait, but the water flowed.

  Elara's water did not flow. She sat at her desk, the glossy folders forming a wall around her. The number in her head was screaming now, a high-pitched frequency that made her teeth ache. It demanded a yield that defied biology. She picked up a file. It was good. It was reasonable. It was everything she needed. But it didn't clear the bar. She put it down.

  She remembered the Miller orchard, briefly, a flash of dry earth in a memory of dust. She had passed them over because they weren't enough then. Now, nothing was enough. The mechanism that had made her a savior in the poor district had turned her into a bottleneck in the rich one. The fit between her number and the environment had broken. Good enough was no longer a property of the options; it was a ghost chasing her own shadow.

  She looked at the stack. It was taller than her arm. The air conditioning hummed. The ink pad was dry. She reached for the next file, her hand trembling slightly, knowing the number in her head would reject it before she even finished reading the first page.

  Logline: A clerk whose internal standard for approval drifts with her recent success finds herself paralyzed by abundance after thriving on scarcity.
