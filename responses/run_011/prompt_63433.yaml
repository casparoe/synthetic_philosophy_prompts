  **T4: Remediation Distinction (Your Term 5)**
  *Probability: 0.95*
  *Justification:* A duty to compensate (strict liability) is conceptually distinct from fault-based blame; one can owe restitution for harm one caused innocently without being morally blameworthy for the harm.
  *Role:* If compensation duties imply fault, the gap is merely semantic.

  **T5: System Ineligibility (Your Term 6)**
  *Probability: 0.95*
  *Justification:* Moral address requires the capacity for recognition and response to normative reasons; absent sentience or genuine agency, holding the system itself responsible is a category error, regardless of functional output.
