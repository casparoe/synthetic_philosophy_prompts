  **T1: Empirical Possibility (Your Term 1)**
  *Probability: 0.95*
  *Justification:* Given the state of deep learning and complex socio-technical systems, "black box" failures that evade even rigorous adversarial testing are not merely hypothetical but documented (e.g., rare feature interactions in high-dimensional space).
  *Role:* If the case is impossible, the Thesis is vacuously false.

  **T2: The Control Principle (Your Term 2)**
  *Probability: 0.90*
  *Justification:* Moral blame (distinct from causal responsibility) standardly requires a degree of voluntary control or reasonable foreseeability; blaming agents for truly random outcomes violates the "ought implies can" intuition central to retributive fairness.
  *Role:* If blame does not require control, strict moral liability closes the gap.

  **T3: Attribution Failure (Merged Your Terms 3 & 4)**
  *Probability: 0.80*
  *Justification:* Neither the sum of non-negligent individuals nor the collective entity itself bears *fault* if the organizational culture and procedures met the "best available" standard at deployment; collective fault typically supervenes on individual culpability or systemic negligence, both excluded by your stipulations.
