  6.  **Final Polish:**
      *   Check against constraints: "Don't Bayesian-ise him." "Be blunt." "Flag placeholders."
      *   Ensure the Cloud Vendor example is concrete.
      *   Ensure the distinction between Risk (calculable) and Uncertainty (incalculable) is clear in the user's vocabulary (Ambiguity Sets vs. [TRUE UNCERTAINTY]).

  7.  **Final Output Structure:**
