          *   Validation: We check the math, not the [LOGICAL RELATION].

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction:* Make sure not to conflate *Treatise on Probability* (1921) with *General Theory* (1936) too much, though the user asks for both ("later material on long-term expectation"). Keep the distinction clear: Probability = partial knowledge; Uncertainty = unmeasurable knowledge.
      *   *Tone:* Professional, peer-to-peer, slightly skeptical but respectful. No philosophy jargon unless defined.
