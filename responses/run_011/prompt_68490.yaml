      *   Part II: The Residue Report (The blunt truth).
      *   Part III: The Cloud Vendor Stress Test (Concrete application).
      *   Part IV: The Verdict.

  *(Self-Correction during drafting)*: I need to be careful with "Ambiguity Sets." Keynes isn't just saying "the parameter is in a range." He's saying the *relation* itself might not exist numerically. Ambiguity sets (like in Robust Bayes) still assume a set of priors exists. Keynes might say "there is no prior." I need to highlight this distinction.

  *(Refining "Weight")*: ESS is $N_{eff}$. Weight is $N_{eff} + \text{structural confidence}$. If I have 1 million points but the model is misspecified, ESS is high, Weight is low. This is a crucial distinction.

  *(Refining "Caprice")*: In validation, we call this "Management Overlay." Keynes calls it "Animal Spirits." The difference is who admits it's a guess.

