          *   *Mapping:* This aligns with the *model documentation* and *validation report*. It's not the output number (the frequency); it's the justification linking the data (evidence) to the risk estimate (proposition). It's the "Model Tiering" rationale.
          *   *Tension:* Modern Bayesianism treats priors as subjective or reference. Keynes treats the relation as objective (logical), even if unknown.

      *   *(b) Non-comparability:* Some probabilities cannot be ranked. $P(A|E_A)$ vs $P(B|E_B)$ might be incomparable if the evidence bases are qualitatively different.
          *   *Mapping:* This challenges the "Model Tiering" or "Risk Scoring" where everything must be ranked High/Medium/Low. It aligns with *Ambiguity Sets*, but Keynes says even the *sets* might not be comparable, not just the values within them.
          *   *Tension:* Regulatory capital requires a scalar number. Keynes says sometimes there isn't one.

      *   *(c) Weight of Argument:* Distinction between the *probability* (balance of favorable/unfavorable evidence) and the *weight* (total amount of evidence). New evidence increases weight, even if probability drops.
          *   *Mapping:* Looks like *Effective Sample Size (ESS)* or *Posterior Precision*. But Keynes includes "relevant ignorance."
          *   *Tension:* ESS counts data points. Weight counts *relevance* and acknowledges the *unknown unknowns*.

      *   *(d) Principle of Indifference:* Don't assign 50/50 just because you have no reason to think otherwise.
          *   *Mapping:* This is a direct attack on *uninformative priors* or *flat assumptions* in data-sparse areas. It criticizes the "expert overlay" when it's just a guess dressed up as a distribution.

      *   *(e) Uncertainty/Animal Spirits:* Long-term expectation cannot be calculated. We rely on convention (status quo) or impulse.
          *   *Mapping:* *Reverse Stress Tests* or *Scenario Analysis* where data is absent. The "Documented Expert Overlay" is the modern bureaucratic version of "convention."
          *   *Tension:* Governance requires a rationale. Keynes says sometimes the rationale is "we just acted."

