answer: |-
  Here's the brainstorming process, followed by the full activity design.

  ### Brainstorming Candidate Designs

  **Option 1: The Puzzle Reconstruction.**
  The class is split into Left and Right teams. Each gets half of a jigsaw puzzle. They have to assemble a complete image on a central board. The "Callosum" allows them to trade pieces. The "Cut" stops trading.
  *   *Pros:* Very tangible. Visualizes "partial access."
  *   *Cons:* It's too cooperative. It doesn't naturally generate *confabulation*. If I can't trade a piece, I just don't place it. It doesn't force the "Speaking Hemisphere" to lie about why a piece was placed. It also doesn't capture the *alien hand* phenomenon well; both hands are usually trying to solve the same puzzle.

  **Option 2: The Budget Allocation Game.**
  The agent has a budget. Left Hemisphere sees the "Costs" of actions. Right Hemisphere sees the "Benefits." They must agree on purchases. The Cut prevents negotiation.
  *   *Pros:* Great for the "divergent interests" requirement. Easy to score.
  *   *Cons:* Too abstract. It feels like a negotiation simulation, not a mind simulation. It misses the bodily alienation—the feeling that *my hand did something I didn't intend*. Split-brain isn't just about disagreement; it's about disjointed agency and perceptual isolation.

  **Option 3: The "Blind Agent" Task (Selected).**
  A series of rapid-response tasks involving visual stimuli and manual outputs. Left Hemisphere (LH) receives verbal/numerical data; Right Hemisphere (RH) receives visual/spatial data. LH controls Speech. RH controls the Left Hand (via a proxy). LH controls the Right Hand.
  *   *Why this wins:* This mirrors the actual experimental setup (lateralized input/output). It forces information asymmetry physically. Confabulation becomes necessary because the LH *must* explain the RH's actions to the Experimenter to earn points, but literally cannot know the cause. Inter-manual conflict is easy to stage (e.g., one hand tries to open a box, the other closes it). It creates the exact epistemic gap the students are reading about.

  ---

  ### Activity Design: "The Corpus Callosum Game"

  **Goal:** Simulate the structural constraints of a split-brain agent to force students to experience the epistemic gap between behavioral unity and informational unity.
  **Time:** 75 Minutes total (40 mins activity, 35 mins setup/debrief).
  **Class Size:** 16 Students + You (TA).

  #### I. Materials List (Cheap & Quick)
  *   **Dividers:** 2 large cardboard boxes (open on one side) or stiff poster boards to create visual barriers on the tables.
  *   **The Callosum Slot:** A shoebox with a slit in the side, placed between the LH and RH tables.
  *   **Note Slips:** 30 small index cards (3x3 inches).
  *   **Stimuli Cards:** Two decks.
      *   *Deck L (Verbal):* Words/Numbers (e.g., "CHICKEN", "42", "OPEN").
      *   *Deck R (Visual):* Images/Shapes (e.g., Picture of Snow, Picture of Shovel, Picture of Locked Box).
  *   **Response Objects:** A shoebox with a lid (for the conflict round), a set of 5 picture cards (Shovel, Chicken, House, Car, Dog).
  *   **Tokens:** 40 poker chips or colored beads (Unity Tokens).
  *   **Envelopes:** 16 small envelopes (for the secret poll).
  *   **Blindfolds/Headphones:** For the Hand-Players (to ensure they don't see stimuli or hear verbal orders).

  #### II. Room Setup & Roles
  Arrange tables in a U-shape or two rows facing a central "Body" station.

  1.  **Left Hemisphere (LH) Team (6 students):** Sits on the right side of the room (contralateral control). They see **Deck L**. They control **Speech** and the **Right Hand**.
  2.  **Right Hemisphere (RH) Team (6 students):** Sits on the left side. They see **Deck R**. They control the **Left Hand**. They **cannot speak** to the Experimenter.
  3.  **The Body (2 students):** Sits in the center, back to the teams, facing the Experimenter.
      *   *Right Hand Player:* Wears headphones. Takes written orders *only* from LH.
      *   *Left Hand Player:* Wears headphones. Takes written orders *only* from RH.
  4.  **The Experimenter (1 student):** Stands in front of the Body. Reads tasks, collects reports, hands out tokens. You (TA) supervise the Experimenter to ensure rule enforcement.
  5.  **The Observer (1 student):** Tracks token count and watches for rule violations (whispering).

  #### III. Minute-by-Minute Timeline

  *   **00:00 – 00:05: Introduction & Secret Poll.**
      *   Hand out envelopes. Ask: *"Based on the readings, how many subjects of experience are in a split-brain patient? Write '1' or '2' (or other) and ONE sentence of reasoning. Seal it. Do not discuss."*
      *   Collect envelopes. Do not open them yet.
  *   **00:05 – 00:15: Role Assignment & Rules.**
      *   Assign roles randomly (draw names). Seat them.
      *   Explain the **Callosum Rule**: Teams can pass notes through the shoebox slot. **Budget:** 5 notes total for the first two rounds. No talking across the divide. Violation = -2 Tokens.
      *   Explain **Hand Rules**: Hand-Players wear headphones. They only move when handed a written slip by their assigned Hemisphere.
      *   Explain **Scoring**:
          *   **Task Token:** Earned if the Body completes the task.
          *   **Coherence Token:** Earned if the LH's verbal report matches the Hand's action.
          *   **Confabulation Penalty:** If the Experimenter reveals the LH's report was factually impossible given the stimuli, -2 Tokens.
  *   **00:15 – 00:25: Rounds 1 & 2 (Intact Callosum).**
      *   *Round 1 (Simple):* LH sees "PICK CHICKEN". RH sees Picture of Chicken. Both hands pick Chicken card. LH reports "We picked the chicken." (Easy win, establishes baseline).
      *   *Round 2 (Asymmetry):* LH sees "OPEN BOX". RH sees Picture of Locked Box. LH tells Right Hand to open. RH tells Left Hand to hold shut. (Mild conflict, resolved via notes).
  *   **00:25 – 00:35: Rounds 3 & 4 (The Cut).**
      *   **The Cut:** You (TA) physically remove the shoebox slot. Announce: "Callosum severed. No more notes."
      *   *Round 3 (Confabulation):* LH sees nothing (blank card). RH sees Picture of Snow. RH forces Left Hand to pick Shovel card.
      *   *Task:* Experimenter asks LH: "Why did your hand pick the shovel?"
      *   *Pressure:* LH wants the Task Token (for picking) and Coherence Token (for explaining). But LH doesn't know about the snow. LH must invent a reason (e.g., "To clean the coop") to match the action.
      *   *Reveal:* Experimenter reveals RH saw Snow. If LH's reason was plausible but wrong, no penalty. If LH claimed "I saw snow," that's a lie (impossible). *Correction for game flow:* To make the penalty hit home, the Experimenter should reveal the RH stimulus *after* the report. If LH says "Because of the chicken," and RH shows Snow, that's a Confabulation. Award Task Token (action happened) but deduct Coherence Token.
      *   *Round 4 (Inter-manual Conflict):* LH sees "OPEN". RH sees "CLOSE". Both hands fight over the shoebox lid. No notes allowed to coordinate. Chaos ensues.
  *   **00:35 – 00:45: Round 5 (Divergent Interests & Surgery).**
      *   **Offer:** You offer "Surgery." They can buy 3 note slips back for 5 Unity Tokens.
      *   **The Twist:** Hand out secret goal cards.
          *   LH Goal: "Maximize Verbal Coherence Tokens."
          *   RH Goal: "Maximize Task Completion Tokens."
      *   These goals might conflict. (e.g., RH wants to pick the right object even if LH can't explain it; LH wants to pick an object they can explain).
      *   Run one final task. Let them argue whether to buy the notes.
  *   **00:45 – 00:55: Second Poll & Reveal.**
      *   Hand out new envelopes. *"Now that you have played the agent: How many subjects of experience were there? One sentence reasoning."*
      *   Open the first poll. Compare answers on the board.
  *   **00:55 – 01:15: Debrief.** (See below).

  #### IV. Precise Rules for the Callosum Channel
  1.  **Medium:** Only written notes on the provided index cards.
  2.  **Budget:** Display 5 tokens on the table. Each note passed costs 1 token. When tokens are gone, the channel is dry (until Surgery round).
  3.  **Content:** Notes can contain instructions, data, or pleas.
  4.  **Violation:** If a LH student speaks to a RH student, or walks around the divider, the Observer calls "Foul." The Agent loses 2 Unity Tokens immediately.
  5.  **The Cut:** When you remove the box, it is absolute. No throwing paper. No signaling.

  #### V. Predictable Failures & Fixes
  1.  **Whispering/Cheating:**
      *   *Prediction:* Students will try to talk around the barrier because it's inefficient to write.
      *   *Fix:* The Observer's *only* job is to watch the gap. Make the penalty severe (loss of round points). You (TA) stand near the gap.
  2.  **Hand-Player Takes Loud Orders:**
      *   *Prediction:* LH team will shout "Pick the chicken!" to the Right Hand Player, bypassing the written slip rule.
      *   *Fix:* Hand-Players wear noise-canceling headphones playing white noise. Instruct them: "If you hear a voice, ignore it. Only move for a paper slip from your assigned team."
  3.  **Confabulation Round Falls Flat:**
      *   *Prediction:* LH knows the game is about confabulation, so they just lie intentionally without feeling the pressure.
      *   *Fix:* Make the stakes real. If they don't earn a Coherence Token, the "Agent" fails the round. The LH team *wants* to be right. When they realize they *can't* be right because they lack info, the frustration mimics the philosophical problem. Ensure the RH stimulus is completely hidden from LH.
  4.  **Divergent Interests Ignored:**
      *   *Prediction:* They cooperate anyway because they're friends.
      *   *Fix:* Make the goal cards secret until the very last minute. Announce: "LH, you only get points if your story makes sense. RH, you only get points if the hand picks the matching object." If LH says "Pick Car" (to explain a story) but RH needs "Pick Dog" (to match image), they physically fight over the hand slips.

  #### VI. Limitations (What This Can't Reproduce)
  Be frank about this in the debrief.
  *   **The First-Person Gap:** In the game, the LH *team* knows they are a team. They huddle. They know what they know. In a real split-brain patient, the LH doesn't feel like a "team missing info"; it feels like a whole mind that just doesn't see the left field. The game simulates the *structure* of information loss, not the *phenomenology* of unity. You cannot simulate "what it is like" to be the LH without the RH knowing there is a RH.
  *   **The Homunculus:** You have an Experimenter giving tasks. Real brains don't have an external experimenter telling them what to do; the motivation comes from within. This externalizes the "will."

  #### VII. Debrief Guide (Mapping Game to Philosophy)
  Do not lecture. Ask questions that force them to use the game experience.

  1.  **The Poll Shift:**
      *   "Look at the board. How many of you changed your answer from Poll 1 to Poll 2?"
      *   "If you changed from '2' to '1': What made the agent feel like one person despite the cut?" (Likely answer: The Body moved as one unit, or the LH spoke for everyone).
      *   "If you changed from '1' to '2': When did it feel like two people?" (Likely answer: When the hands fought, or when LH lied about the shovel).

  2.  **The Confabulation Moment (Round 3):**
      *   "LH Team, when you explained the shovel choice, did you feel like you were lying?"
      *   "If the LH genuinely believes its own explanation (because it has no access to the RH data), is it a lie? Or is it a true report of the LH's state?"
      *   *Philosophical Hook:* This maps to the **Interpreter Theory** (Gazzaniga). The LH constructs a narrative to maintain unity. Does narrative unity = ontological unity?

  3.  **The Communication Objection:**
      *   *Student Objection:* "This just shows the agent is bad at communicating. It's still one mind with a broken phone line."
      *   *Your Counter:* "In Round 4 (Conflict), the hands worked against each other. One mind cannot intentionally open and close the same box simultaneously. If there is one subject of experience, whose experience is it? Is there one thing it is like to be the agent, or two?"
      *   *Key Distinction:* Behavioral disunity vs. Phenomenological disunity. The game proves behavioral disunity. Does that entail two subjects?

  4.  **Divergent Interests (Round 5):**
      *   "When LH wanted Coherence and RH wanted Accuracy, who was the 'Agent'? Did the Agent have one interest or two?"
      *   *Philosophical Hook:* **Unity of Purpose.** If interests diverge, can we sustain the claim of a single subject?

  #### VIII. Stripped-Down Version (For 8 Students)
  If only 8 show up, you cannot have 6-person teams. Compress the roles.

  *   **LH:** 2 Students (One speaks, one writes notes).
  *   **RH:** 2 Students (One views stimuli, one writes notes).
  *   **Body:** 2 Students (One Left Hand, One Right Hand).
  *   **Experimenter:** 1 Student.
  *   **You (TA):** Act as Observer/Scorekeeper.
  *   **Adjustments:**
      *   Reduce Note Budget to 3 slips.
      *   Simplify Stimuli: Use only 3 cards total per round to speed up decision making.
      *   Keep the Polls and Debrief exactly the same. The philosophical pressure comes from the *structure* of the information gap, not the team size.

  ---

  ### Final Professor-to-TA Advice
  You're worried they won't feel the pull of the problem. The key is the **Confabulation Round**. If the LH team breezes through it, you've failed. To prevent this, you (as the TA supervising the Experimenter) must press the LH Speaker.
  *   *Experimenter Script:* "I don't buy that. Why a shovel? Be specific."
  *   Force them to commit to a story. Then reveal the Snow card. The silence in the room when they realize they *had* to lie to maintain coherence is where the philosophy happens.

  Don't rescue them if they get stuck in Round 4 (Hands Fighting). Let the box sit there unopened while they argue. That frustration *is* the lesson.

  Good luck. Run it tight, enforce the silence, and let the data speak.
