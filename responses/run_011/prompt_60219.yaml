  2. Given that, I'm what I've read is called a pluralist. The right test isn't the same everywhere: for birds you ask whether they interbreed, for bacteria you cluster genomes by similarity, for plants you look for distinct branches sharing an ancestor. No one concept wins and thats not a failure of biology, it's just how it is.
