  Right, let's cut through the noise. You've assembled a collection of views that sound sophisticated because they borrow terminology from current debates, but you haven't done the hard work of checking whether they can coexist in a single ontological framework. You are trying to be a realist, a pluralist, a cladist, and a pragmatist all at once. You cannot be all of these without significant compromise.

  Here is the audit, ranked by the severity of the contradiction.

  ### 1. Severity: Critical — (1) vs (4)
  **The Conflict:** You claim species are historical individuals with beginnings and ends (1), but you admit microbial ancestry is a network, not a tree (4).
  **Why it breaks:** The "Species as Individuals" thesis (Ghiselin/Hull) relies on lineage coherence. An individual organism has a boundary; a historical individual (species) must also have boundaries defined by ancestry. If microbes swap genes horizontally (HGT) rampantely, the lineage is not a single branching thread. It is a mesh. If you cannot trace a single line of descent, you cannot define the spatiotemporal boundaries of the "individual".
  **The Challenge you mentioned:** You asked why people say a network means "no beginning or end". They mean no *determinate* beginning or end for the *unit*. If Population A swaps 50% of its genome with Population B, where did A end and B begin? The identity conditions dissolve. You cannot maintain (1) as a universal claim if (4) is true.
  **The Fix:** You must restrict (1). Admit that species are individuals *only* where vertical descent dominates (eukaryotes). For microbes, you must accept they are fuzzy clusters or kinds, not historical individuals.
  **The Cost:** You lose your universal ontology. You are no longer a strict Species Realist; you are a local realist.

  ### 2. Severity: High — (2) vs (5)
  **The Conflict:** You claim there is no single right test for species (2), yet you declare a specific case is "no question" (5).
  **Why it breaks:** This is logical inconsistency. If you are a pluralist, species status is relative to the concept employed. In your hybrid zone case, the Biological Species Concept (BSC) might say "two species" (due to distinctness), but a Phylogenetic Species Concept might say "one lineage" (if the hybridization indicates recent shared history or incomplete sorting). By saying "no question", you are secretly privileging one concept while claiming pluralism.
  **The Fix:** Qualify (5). Change "no question" to "distinct under the Biological Species Concept".
  **The Cost:** You lose rhetorical certainty. You must admit that another biologist using a different concept could legitimately call them one species.

  ### 3. Severity: Moderate — (1) vs (3)
  **The Conflict:** You claim species are unique historical chunks (1), but you want to keep Linnaean ranks because they "track something" (3).
  **Why it breaks:** If species are unique individuals, higher taxa (genera, families) are usually treated as clades (also individuals). However, Linnaean *ranks* (the level itself) imply equivalence. A "Family" of beetles is not equivalent to a "Family" of mammals in time, diversity, or divergence. Cladists argue ranks are arbitrary human conventions that do not track reality. Claiming they "track something" contradicts the view that lineages are unique historical entities with no objective "level".
  **The Fix:** Admit ranks are pragmatic filing tools, not ontological realities.
  **The Cost:** You undermine your claim in (3) that they track something real. They become useful fictions.

  ### Does the list support your verdict in (5)?
  No, not as written. Your pluralism (2) dictates that the verdict depends on the concept chosen. Your realism (1) dictates that the verdict depends on the historical boundaries. In a hybrid zone, historical boundaries are porous. To say "no question" is dogmatic. You are smuggling in a preference for the Biological Species Concept without admitting it. If you present this as a logical conclusion of your list, you will be caught out.

  ### Addressing your specific worry: (1) vs (4)
  You said you don't buy the claim that a network means nothing has a beginning or an end. Here is why you should buy it, or at least worry about it.
  A "beginning and end" implies identity over time. For a lineage to persist, there must be a mechanism of cohesion that makes *this* group distinct from *that* group over time. In vertical descent, cohesion is reproduction. In horizontal networks, cohesion is diffuse. If the genetic material constituting the lineage is constantly being replaced by sideways swaps, the "thing" persisting through time is not a genetic lineage, but merely a spatial location or a ecological niche.
  You can argue the *population* persists, but then you are defining the species by ecology, not ancestry. That contradicts your "chunk of history" view in (1). You cannot have it both ways. Either microbes don't have species in the same sense as birds, or your definition of species must change to accommodate networks.

  ### Summary of Fixes
  1.  **Restrict (1):** Accept it applies to sexually reproducing eukaryotes, not microbes.
  2.  **Qualify (5):** Remove "no question"; specify the concept used.
  3.  **Weaken (3):** Admit ranks are pragmatic, not real.

  You asked which commitment has to go first to save the coherence of the project. You cannot keep a universal ontology of species-as-individuals when half the tree of life (by biomass) violates the conditions for individuality.

  Verdict: 1
