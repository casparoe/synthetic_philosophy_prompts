      Then we reach the rules that actively undermine the project, starting with Rule C, the squared error with a tolerance band. This breaks the incentive for precision because if your true belief is near the edge of the band, you are indifferent between reporting it and reporting a value closer to the truth value, so honesty is no longer uniquely optimal. Rule D is even more dangerous because the bonus for decisiveness makes the rule improper, actively incentivizing you to exaggerate your confidence away from your true belief to chase the bonus regardless of the weather.

