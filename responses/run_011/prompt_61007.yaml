  Let's assemble the document.

  *Structure:*
  1. Standing Orders (Voting & Recording).
  2. Pre-Session Template.
  3. Trade-off Statement (Honesty).
  4. Appellant Note.
  5. Application to Test Cases.

  *Key Terminology:*
  *   **Premise-Based Aggregation:** The verdict is derived from the findings.
  *   **Standing Tolerance:** The error rate limit is fixed in the Orders, not voted per case.
  *   **Composite Ground:** When no single reason has a majority.

  *Wait, one constraint check:* "The board cannot amend the statute." The statute sets the three-part test. It doesn't mandate *how* votes are aggregated, only that findings are recorded. The Standing Orders govern "how votes are taken." So shifting from Verdict-Vote to Finding-Derived-Verdict is permissible procedure.

  *Final check on the "Stop Points":*
