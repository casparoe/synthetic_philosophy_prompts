          2.  Stop points (refusal vs. chair/board decision) + Fixed aggregation rule (Premise vs. Conclusion).
          3.  Treatment of graded criterion/rotation (precedent/consistency).
          4.  Honesty about trade-offs (what property is sacrificed).
          5.  Appellant-facing note (plain language).
          6.  Run the procedure on the three test cases.

  2.  **Identify the Core Theoretical Problem:**

      *   This is the **Discursive Dilemma** (Philip Pettit).
      *   The choice is between **Premise-Based Procedure (PBP)** and **Conclusion-Based Procedure (CBP)**.
      *   *PBP:* Vote on reasons, logic dictates outcome. Good for consistency/rule of law. Bad if the outcome contradicts the majority's will on the final question.
      *   *CBP:* Vote on outcome directly. Good for democratic responsiveness. Bad for consistency/transparency (reasons might not align).
      *   *Prompt Requirement:* "Settled once... whether we aggregate by findings or by verdict."
      *   *Recommendation:* Given the statutory nature (review board, precedent, appellants citing contradictions), **Premise-Based Procedure (PBP)** is legally safer and ensures the statute is actually applied. However, the prompt highlights a specific twist: The Verdict vote *failed* despite Premises passing. If we adopt PBP, we must ignore the Verdict vote for the *decision*, using it only as a temperature check, OR we must adopt CBP and treat findings as advisory.
      *   *Better Approach for this Context:* A **Modified Premise-Based Procedure**. The statute says "We approve *only if* all three findings are affirmative." This implies the findings *are* the decision logic. The Verdict vote is currently causing the confusion.
      *   *Solution:* Eliminate the binding Verdict vote. The Verdict is *calculated* from the Findings. This resolves the "which document is the decision" issue. The Findings *are* the decision.
      *   *Wait, one constraint:* "The minutes publish the vote on each finding as well as the verdict." The statute likely implies a decision is made. If the board votes No on the verdict despite Yes on findings, they are violating the statute's logic *or* the findings are not truly binding.
      *   *Decision:* To fix the "which document is the decision" problem, the Standing Orders must declare that the **Findings constitute the Decision**. The final "Verdict" vote is removed as a binding step and replaced by a "Declaration of Result" based on the Findings. This aligns with the statutory text ("We approve only if...").
