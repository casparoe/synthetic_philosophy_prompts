      *   *Addressing Rotation/Graded Criterion (Feature 2):* Need a "Tolerance Register." The tolerance isn't just a vote; it's a standing order value derived from past votes, or a specific "Precedent Vote" mechanism. Since members rotate, we need a **Standing Tolerance Threshold** that is amended only by a supermajority, decoupling it from individual case votes. Or, simpler: The "Tolerance" is a separate standing order, not a case-by-case finding. *Correction:* Prompt says "tolerance the board itself has adopted." It implies a standing value. The problem is the *application* of that tolerance varied (rounding). We need a rule on rounding/significant figures.
      *   *Addressing the Trade-off:* PBP ensures consistency (statutory compliance) but risks "Minority Rule" on the final outcome (as seen in the example where 5 voted No on verdict, but PBP forces Yes). We must admit this. We sacrifice "Majority Will on Outcome" for "Majority Will on Statutory Compliance."

