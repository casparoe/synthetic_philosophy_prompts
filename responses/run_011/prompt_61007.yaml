answer: |-
  # STANDING ORDERS OF THE STATUTORY REVIEW BOARD
  **Subject:** Voting Procedure, Recording of Findings, and Aggregation Rules
  **Effective:** [Date]
  **Authority:** Board Resolution under Statutory Power to Govern Proceedings

  ## 1. VOTING AND RECORDING SEQUENCE

  **1.1 Order of Business**
  For each application, the Board shall proceed in the following strict sequence. No vote on a subsequent step may occur until the previous step is finalized.
  1.  **Criterion 1 (Error Rate):** Vote on whether the system's error rate falls within the Standing Tolerance.
  2.  **Criterion 2 (Human Review):** Vote on whether adequate human reconsideration is available.
  3.  **Criterion 3 (Benefit/Harm):** Vote on whether benefits outweigh harms.
  4.  **Declaration of Verdict:** The Chair shall declare the Application Approved or Refused based strictly on the arithmetic combination of the three Findings (see 1.3). **No vote shall be taken on the Verdict itself.**

  **1.2 The Ballot**
  *   **Question Format:** Each Criterion shall be put as a distinct motion: *"That the Board finds Criterion [X] is Met."*
  *   **Voting:** Members vote Aye, No, or Abstain. The Secretary records the count.
  *   **Ties:** In the event of a tie (e.g., 4–4 with one abstention, or 5–5), the Chair exercises a casting vote to determine the Finding.
  *   **Sufficient Answer:** A Criterion is "Met" if the motion carries (majority of votes cast, including Chair's casting vote if needed). A Criterion is "Not Met" if the motion fails.

  **1.3 Aggregation Rule (Premise-Based Procedure)**
  *   **The Rule:** The Verdict is not a matter of discretion. It is a calculated result of the Findings.
  *   **Approval:** Declared only if Criterion 1, Criterion 2, *and* Criterion 3 are all found "Met."
  *   **Refusal:** Declared if *any* single Criterion is found "Not Met."
  *   **Conflict Resolution:** If the Findings are affirmative but a majority of members express an intent to Reject (e.g., via informal polling or comment), the Findings prevail. The Verdict must align with the Findings to ensure statutory compliance.

  **1.4 Recording Grounds (The "Ratio" Rule)**
  *   **Requirement:** Minutes must record the ground(s) for each affirmative Finding.
  *   **Majority Ground:** If a specific ground (e.g., "Caseworker recheck") is cited by a majority of those voting Aye, it is recorded as *The Ground*.
  *   **Composite Ground:** If no single ground commands a majority of the Aye votes (e.g., three vote for Ground A, three for Ground B), the Minutes shall record the Finding as "Met (Composite Grounds)." The specific grounds shall be listed in an annex, but no single ground shall be presented as the Board's authoritative rationale.
  *   **Negative Findings:** If a Criterion is "Not Met," the Minutes record the primary reason for failure cited by the majority of No voters.

  ## 2. PRE-SESSION TEMPLATE

  **To:** Board Members
  **From:** Secretary
  **Subject:** Pre-Read for Session [Date] – [Agency Name] Application

  **Instructions:**
  1.  Review the Evidence Pack (attached).
  2.  Review the **Standing Tolerance Schedule** (Section 3 below).
  3.  Complete the **Pre-Session Ballot** and return to the Secretary 48 hours before the session. This does not bind your in-room vote but ensures the Chair can identify evidentiary gaps.

  **Pre-Session Ballot:**
  *   **Criterion 1:** Based on the Evidence Pack and Standing Tolerance, do you preliminarily find the error rate acceptable? [Yes/No/Unsure]
  *   **Criterion 2:** Which ground supports your view? [ ] Pre-effect recheck [ ] Post-effect appeal [ ] Other: ____
  *   **Criterion 3:** Do benefits outweigh harms? [Yes/No/Unsure]

  **Standing Tolerance Schedule (Fixed):**
  *   **False Positive Rate:** Maximum 5.0% (rounded to one decimal place).
  *   **False Negative Rate:** Maximum 10.0% (rounded to one decimal place).
  *   **Rounding Protocol:** All rates are rounded to the nearest 0.1%. Values ending in .05% round up.
  *   **Note:** This Schedule is a Standing Order. It cannot be altered by a simple majority vote on an individual case.

  ## 3. TREATMENT OF GRADED CRITERIA AND ROTATING MEMBERSHIP

  **3.1 The Standing Tolerance**
  To prevent contradictions arising from membership rotation, the "tolerance the board itself has adopted" (Statute Criterion 1) is codified in these Standing Orders as the **Standing Tolerance Schedule**.
  *   Individual cases do not set the tolerance; they measure against it.
  *   Amendment of the Standing Tolerance Schedule requires a 2/3 supermajority of the full Board and a 30-day notice period. This insulates the standard from casual fluctuation.

  **3.2 Precedent and Consistency**
  *   **Factual Precedent:** If a current application is factually indistinguishable from a prior published decision (same system type, same population, same error profile), the Board shall follow the prior Finding unless new evidence is presented.
  *   **Contradiction Check:** Before voting, the Secretary shall circulate a "Consistency Note" highlighting any prior Findings that appear to conflict with the current Evidence Pack.
  *   **Distinguishing:** If the Board intends to reach a different Conclusion on similar facts, the Minutes must explicitly state the *distinguishing factor* (e.g., "Population density differs," or "Standing Tolerance amended on [Date]").

  ## 4. HONESTY ABOUT MISFIRES (TRADE-OFF STATEMENT)

  **4.1 The Sacrifice of Direct Majoritarianism**
  This procedure adopts a **Premise-Based Aggregation**. This means the Board may be required to Approve a system even if a majority of members personally wish to Reject it (as seen in the "Benefits-Fraud" scenario).
  *   **Why:** The statute conditions approval on three specific Findings. To vote "Reject" when all three Findings are "Met" is to act outside the statute. We sacrifice the "Will of the Majority on the Verdict" to preserve the "Rule of Law on the Criteria."
  *   **Consequence:** Minutes may show a Verdict of "Approved" where a majority of members expressed opposition during deliberation. This is a feature, not a bug; it proves the Board is bound by the test, not by whim.

  **4.2 The Sacrifice of Unified Rationale**
  This procedure allows for **Composite Grounds**.
  *   **Why:** Members vote independently. Forcing a single rationale when none exists would require falsifying the minutes or coercing members to change their votes.
  *   **Consequence:** Appellants may face ambiguity regarding *why* a Criterion was Met. The Minutes will honestly reflect this fragmentation rather than fabricating a consensus that does not exist.

  **4.3 The Sacrifice of Flexibility on Tolerance**
  This procedure fixes the **Standing Tolerance**.
  *   **Why:** Rotating membership creates inconsistency if the tolerance is renegotiated every case.
  *   **Consequence:** A system may be Refused at 5.1% error even if the current Board feels 5.1% is acceptable, because the Standing Order says 5.0%. Changing this requires a high bar (2/3 vote), prioritizing long-term stability over short-term discretion.

  ## 5. NOTE TO APPELLANTS (PLAIN LANGUAGE)

  **Why We Vote This Way**

  You have the right to know how we reached our decision. Sometimes, a Board can vote "Yes" on all the reasons but "No" on the final result. This creates confusion: which vote counts?

  To fix this, we have adopted a **Findings-First Rule**.
  1.  **The Law Comes First:** The statute says we can only approve a system if it passes three specific tests.
  2.  **The Math is Fixed:** If the Board votes that the system passes all three tests, the system *must* be approved. We do not take a second vote to override that result.
  3.  **Why This Is Fair:** If we allowed a second vote on the final result, a small group of members could block a system that passed all the legal tests, simply by joining together on the final vote. That would make the three tests meaningless.
  4.  **Consistency:** We use fixed rules for error rates (tolerances) that do not change just because Board members change. This ensures that Agency A is treated the same as Agency B, even if they apply in different years.

  If you see a decision where the Findings say "Pass" and the Verdict says "Approve," but you know some members opposed it, understand that those members are bound by the same rules you are. They must accept the result of the tests, even if they disagree with the outcome. This prevents the rules from being rigged case-by-case.

  ***

  # APPLICATION OF PROCEDURE TO TEST CASES

  ## CASE 1: The Benefits-Fraud Flagging System
  **Facts:**
  *   Criterion 1 (Error Rate): Affirmative 6–3.
  *   Criterion 2 (Human Review): Affirmative 5–4.
  *   Criterion 3 (Benefit/Harm): Affirmative 6–3.
  *   Historical Verdict Vote (under old procedure): Reject 5–4.

  **Procedure Application:**
  1.  **Vote C1:** Motion carries (6-3). Finding: **Met**.
  2.  **Vote C2:** Motion carries (5-4). Finding: **Met**. (Secretary checks grounds: if split, mark Composite).
  3.  **Vote C3:** Motion carries (6-3). Finding: **Met**.
  4.  **Declaration:** All three Findings are Met.
  5.  **Verdict:** **APPROVED**.

  **Outcome Analysis:**
  *   **Conflict:** Under the old procedure, this was Refused. Under this procedure, it is Approved.
  *   **Cost:** Five members personally oppose the approval. They must record a dissent in the minutes regarding the Verdict, but the Verdict stands.
  *   **Justification:** To Refuse would violate the statute, which mandates approval if all three tests are met. The "Will of the Majority" on the verdict is overruled by the "Will of the Majority" on the statutory criteria. This resolves the agency's query: "The Findings are the decision."

  ## CASE 2: The Near-Identical Variants (Rotation & Graded Criterion)
  **Facts:**
  *   System A (Month 1): Error Rate 4.96%. Board Composition X. Finding: Met (6-3).
  *   System B (Month 2): Error Rate 5.04%. Board Composition Y (1/3 rotated). Finding: Not Met (5-4).
  *   Issue: Appellant claims contradiction based on rounding.

  **Procedure Application:**
  1.  **Check Standing Tolerance:** The Standing Order sets the limit at **5.0%**.
  2.  **Check Rounding Protocol:** The Standing Order mandates rounding to **one decimal place** (nearest 0.1%).
      *   System A: 4.96% rounds to **5.0%**. (Passes threshold).
      *   System B: 5.04% rounds to **5.0%**. (Passes threshold).
  3.  **Re-evaluation:** Under the new Standing Orders, *both* systems should technically pass the mathematical threshold.
  4.  **Correction:** If Board Y voted "Not Met" for System B, they violated the Standing Order on Rounding.
  5.  **Remedy:** The Secretary flags this *before* the vote using the "Consistency Note." The Chair rules that the measurement must adhere to the Standing Rounding Protocol.
  6.  **Verdict:** If Board Y adheres to the procedure, System B is **APPROVED** (assuming C2/C3 pass). If Board Y insists on "Not Met" based on the raw number (5.04 > 5.00), they are in violation of Standing Orders.
  7.  **Resolution:** To prevent this, the Standing Order defines the Tolerance as "5.0% rounded to one decimal." Both 4.96 and 5.04 round to 5.0. Both Pass. Consistency is restored across membership rotation.

  **Outcome Analysis:**
  *   **Cost:** Board Y may feel 5.04% is intuitively worse than 4.96%. They lose the discretion to treat them differently.
  *   **Benefit:** Appellants can rely on the published Tolerance Schedule rather than guessing the current Board's mathematical preference.

  ## CASE 3: The Incompatible Grounds (Criterion 2)
  **Facts:**
  *   Criterion 2 Vote: Affirmative 6–3.
  *   Grounds: 3 Aye voters cite "Caseworker recheck." 3 Aye voters cite "Fast appeal."
  *   Dissent: 3 No voters cite "Neither is sufficient."

  **Procedure Application:**
  1.  **Vote C2:** Motion carries (6-3). Finding: **Met**.
  2.  **Grounds Check:**
      *   Ground A (Recheck): 3 votes (50% of Aye voters).
      *   Ground B (Appeal): 3 votes (50% of Aye voters).
      *   Majority Threshold for Ground: >50% of Aye voters (i.e., 4 votes).
  3.  **Recording:** No single ground commands a majority.
  4.  **Minutes Entry:** "Criterion 2: Met (Composite Grounds). Three members relied on Caseworker Recheck; three members relied on Fast Appeal."
  5.  **Verdict:** Proceed to C3. If C3 passes, System is **APPROVED**.

  **Outcome Analysis:**
  *   **Cost:** The Agency does not know which safeguard is legally essential for future compliance. If they remove the "Fast Appeal" assuming "Recheck" was the reason, they risk future failure.
  *   **Benefit:** The Minutes do not lie. Recording "Recheck" as the reason would falsify the record (as half the majority didn't support it). Recording "Composite Grounds" signals to the Agency that *both* safeguards contributed to the passing grade, encouraging them to maintain both.
  *   **Appellant Clarity:** An appellant contesting C2 knows they must challenge *both* grounds to guarantee a reversal, as either ground was sufficient for half the winning coalition.

  ***

  **Secretary's Certification:**
  This procedure prioritizes **Decisiveness** and **Statutory Compliance** over **Member Discretion** and **Unified Rationale**. It acknowledges that a Board bound by rules will sometimes produce outcomes that a majority of its current members might personally dislike. This is the cost of a government of laws, not of men.
