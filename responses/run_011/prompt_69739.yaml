answer: |-
  Here is the translation of the metaphysical claims into narratological and craft categories, followed by the residue report and the verdict on the vocabularies.

  ### Part I: The Translation

  **1. The Presentist Thesis**
  *   **Metaphysics:** Only the present moment exists. The past is gone; the future is not yet.
  *   **Craft Translation:** This corresponds to the **linear reading experience governed by the Historical Present**. In this mode, the narrative *discourse* mimics the *story* time so closely that the "now" of the narration is the only ontological ground available to the reader.
  *   **Implication:** Events prior to the current sentence exist only as **memory traces** (diegetic recollection) or **physical evidence** (props, scars) within the current scene. Events subsequent to the current sentence do not exist even as text; they are **unwritten potential**. The narrative voice claims no knowledge of the future. The aspectual choice of the historical present functions to collapse the distance between *story time* and *discourse time*, creating a simulation of immediacy where the outcome is ostensibly undetermined.

  **2. The Eternalist Thesis**
  *   **Metaphysics:** Past, present, and future are equally real. Tense is indexical.
  *   **Craft Translation:** This corresponds to the **manuscript as a completed artifact** and the **backward narrative strand**. In the backward strand, the endpoint (death) is established at the outset of the sequence. Every chapter, regardless of its position in the *discourse*, has equal ontological weight within the *story world*.
  *   **Implication:** The *order* of the text (anachrony) does not change the *reality* of the events. The character's death is as "fixed" as their seventh birthday because both are ink on the page. The narrative voice operates from a position of **retrospective omniscience**, even if focalized through the character. The tense (simple past) marks the events as **closed**, completed, and unalterable.

  **3. Objection to Presentism (Truthmakers for the Past)**
  *   **Metaphysics:** If the past doesn't exist, what makes claims about it true?
  *   **Craft Translation:** If the narrative operates strictly in the **historical present** with **zero-degree focalization** (restricted to the immediate sensory input of the protagonist), how is the backstory validated?
  *   **Implication:** A presentist narrative structure risks **narrative incoherence** if it relies on memory without external corroboration. To ground claims about the past, the text must introduce **analepsis** (flashbacks) or **diegetic artifacts** (letters, photographs). Without these, the past becomes **unreliable narration** or mere conjecture. The "truth" of the past is contingent on its ability to be rendered as a present scene or a present object.

  **4. Objection to Eternalism (Phenomenological Asymmetry / Prior's Case)**
  *   **Metaphysics:** If all times are equal, why do we feel relief that pain is past rather than just "earlier"?
  *   **Craft Translation:** If the manuscript is a block where all pages exist equally, why does the reader feel **suspense** regarding the forward strand and **dread/pity** regarding the backward strand?
  *   **Implication:** This maps to the distinction between **Suspense** (uncertainty of outcome) and **Dramatic Irony** (certainty of outcome). The reader's affective response is not determined by the *existence* of the text (which is fixed) but by the **management of information**. Relief is not that the ordeal is "earlier in the book," but that the **focalizer has survived it**. The asymmetry is not ontological; it is **epistemic and affective**. The text constructs a **position for the reader** that privileges the "now" of reading over the "then" of the archive.

  **5. Objection to Presentism (Quantifier Collapse)**
  *   **Metaphysics:** "Only the present exists" is either trivial (only *now* exists) or false (the past existed).
  *   **Craft Translation:** "Only the current scene exists" is either trivial (only this sentence is being read) or false (the previous chapters happened).
  *   **Implication:** This highlights the tension between **Scene** and **Summary**. If a narrative claims strict presentism, it must render every moment as **Scene**. If it utilizes **Summary**, it acknowledges the existence of elapsed time that is not currently "present." A strict presentist narrative structure collapses if it relies on summary, because summary admits the reality of non-present time.

  ***

  ### Part II: The Residue Report

  This section details where the translation fails, distorts, or leaves a remainder.

  **1. Clean Translations**
  *   **Tense and Aspect:** The mapping of Presentism to the Historical Present and Eternalism to the Simple Past is robust. These grammatical choices directly signal the ontological status of the events *within the fiction*.
  *   **Order (Anachrony):** The mapping of Eternalism to the backward strand works well. The backward strand treats time as a spatial dimension to be traversed in reverse, implying all points are accessible (real).
  *   **The Reader's Position:** The metaphysical "indexicality" of tense (where I stand) translates cleanly to the **narratee's progress through the text**.

  **2. Distorted Translations**
  *   **Existence vs. Completion:** In metaphysics, "existence" is a property of the world. In craft, "existence" is often a property of **completion**. When readers say the backward strand feels "fated," they do not mean the events are ontologically real in a block universe; they mean the **narrative contract** has revealed the endpoint. The distortion lies in confusing *narrative closure* with *ontological necessity*. The backward strand feels fated because the *discourse* has disclosed the *story's* terminus, not because time itself is static.
  *   **Truthmakers vs. Consistency:** The metaphysical demand for "truthmakers" for the past translates to "consistency" in fiction, but fiction allows for **retconning** (retroactive continuity) in a way reality does not. A presentist narrative can rewrite the past in a later chapter (unreliable narrator) without violating the laws of the story world, whereas a presentist metaphysics cannot easily accommodate changing past truths.

  **3. No Expression (The Gap)**
  *   **Modality:** This is the significant gap. Metaphysics argues about *Actuality* (what is). Your readers are responding to *Modality* (what is possible vs. necessary). Craft vocabulary has terms for this (potentiality, foreshadowing), but they are often treated as decorative rather than structural. The feeling of "openness" in the forward strand is a **modal effect** generated by the suppression of future information. The feeling of "fatedness" in the backward strand is a **modal effect** generated by the disclosure of the endpoint. Standard narratology focuses heavily on *Time* (order, duration) and *Voice*, but under-theorizes *Modality*.
  *   **Affect:** Metaphysics struggles to explain *why* we care about the direction of time (Prior's objection). Craft explains this easily (Suspense vs. Irony), but lacks a rigorous vocabulary for *why* these generate different feelings beyond "reader response." There is no precise term for the *quality* of time as felt by the reader, only the mechanics of its delivery.

  **4. Pressure Point: Focalization**
  *   **Verdict:** You are correct to suspect a category mistake. **Focalization does not map to Ontology.**
  *   **Analysis:** Focalization governs **access to information** (epistemology), not the **status of events** (ontology). A character can focalize a memory (past) or a hope (future) while remaining in the present.
  *   **The Correction:** The "open vs. fated" feeling is not a result of focalization, but of **Narrative Voice combined with Tense**.
      *   In the forward strand (2nd person, historical present), the Voice addresses the "You" as if the outcome is unwritten. The Focalizer is restricted, but the Voice implies agency.
      *   In the backward strand (3rd person, past tense), the Voice speaks from a point after the death. The Focalizer may be the child, but the Voice is the historian.
      *   **Conclusion:** Do not blame focalization. The distinction is between **Simultaneous Narration** (forward) and **Subsequent Narration** (backward). The ontological weight comes from the *temporal position of the narrator*, not the *perceptual position of the focalizer*.

  **5. Pressure Point: The Manuscript as Block Universe**
  *   **Verdict:** The analogy fails precisely where it looks strongest.
  *   **Analysis:** In a Block Universe, the future is fixed *for the inhabitant*. In a Manuscript, the future is fixed *for the reader*, but the *character* (in the forward strand) is simulated to experience openness.
  *   **The Failure:** The analogy conflates the **medium** (paper/ink) with the **diegesis** (the story world). The paper is eternalist; the story world can be presentist. The "openness" your readers feel is a successful **simulation of indeterminacy** achieved through stylistic constraints (historical present, 2nd person imperative/indicative mix).
  *   **The Distinction:** An event being fixed in the *order of the text* is a material fact. An event being real in the *order of the world* is a metaphysical claim. Fiction operates by making the material fact (the text is finished) serve the metaphysical illusion (the life is being lived). When the backward strand reveals the death, it breaks the illusion of indeterminacy, aligning the *diegetic time* with the *material time*. That is why it feels fated.

  ***

  ### Part III: The Verdict

  You asked which way the residue cuts: Is your craft vocabulary impoverished, or is the metaphysical debate thin?

  **The metaphysical debate is thin when applied to fiction.**

  Here is the specifiable confusion in your structural intuition: You are treating a **rhetorical effect** as an **ontological state**.

  1.  **Craft is Sufficient:** Your vocabulary (tense, order, voice, anachrony) is fully capable of diagnosing the problem. You do not need presentism or eternalism. You need **Modality** and **Narrative Tense**.
      *   The forward strand feels "open" because it utilizes **Simultaneous Narration** in the **Historical Present**. This tense aspectually marks events as ongoing and uncompleted.
      *   The backward strand feels "fated" because it utilizes **Subsequent Narration** in the **Simple Past** with a known **Terminal Point**. This marks events as completed and unalterable.
      *   The convergence works because the **Discourse Time** of the reader meets the **Story Time** of the character at the moment of death.

  2.  **The Metaphysical Import is a Distraction:** The presentism/eternalism debate concerns the nature of *reality*. Fiction is not reality; it is a *speech act*.
      *   When a metaphysician asks, "Does the future exist?" they are asking about the world.
      *   When a novelist asks, "Does the future exist?" they are asking, "Have I written it down yet, and have I let the reader see it?"
      *   Importing the metaphysical terms tempts you to believe there is a deep philosophical conflict in the structure. There isn't. There is only a conflict of **Information Management**.

  3.  **The Diagnosis of the Problem:**
      *   Your readers feel the forward strand is "open" because the **2nd Person Historical Present** creates a **Modal Horizon of Possibility**. It implies the "You" can still choose.
      *   They feel the backward strand is "fated" because the **Reverse Chronology** removes the **Modal Horizon**. We know the destination; we are merely inspecting the causes.
      *   **The Structural Flaw:** The problem is likely not the philosophy, but the **weighting of the strands**. If the backward strand feels *too* fated, it may be draining the tension from the forward strand. The reader knows the death is coming (from the backward strand), so the "openness" of the forward strand is revealed as a lie.
      *   **The Fix:** This is not a metaphysical fix. It is a adjustment of **Frequency** and **Duration**. You must make the forward strand's "present" feel substantial enough to compete with the backward strand's "past." Or, you must acknowledge that the "openness" is **Dramatic Irony** (the reader knows the fate, the character does not) rather than **Suspense** (neither knows).

  **Conclusion:**
  Do not acquire metaphysical distinctions. They will lead you to reify the text into a world, which it is not. Your craft vocabulary is not impoverished, but you are under-utilizing **Modality**. The distinction you are grasping for is not between *Presentism* and *Eternalism*, but between **Prospective Modality** (what might happen) and **Retrospective Necessity** (what must have happened).

  The residue shows that metaphysics tries to describe the container (time), while craft describes the content (experience). Your readers are responding to the experience. Trust the craft terms. They are the ones doing the work. The metaphysics is merely a metaphor you are using to describe the *affect* of the tense. Stop treating the metaphor as the mechanism.
