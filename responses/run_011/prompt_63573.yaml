  *   **Variable:** *Who absorbs the cost.*
  *   **Shift:** In Amsterdam, the cost of silence falls on the team (failed reorg); in Osaka, the cost of speaking falls on the individual (disrupting harmony). Silence shifts from complicity to prudence.

  **Scenario 3 (Doctor):** Moves **1 → 5** (+4 points).
  *   **Variable:** *Whether there's a third party the speaker is shielding.*
  *   **Shift:** In Amsterdam, shielding the mother (patient autonomy) is paramount. In Osaka, shielding the son from information violates family unit expectations; the son's right to know weighs heavier against the mother's privacy.

