answer: |-
  The kitchen light is humming, two glasses on the table, one nearly empty.

  **Wren:** You're asking me to validate a ghost. If Ilse never keeps the secret under pressure, she doesn't keep secrets. She's just a person who hasn't been asked yet.

  **Odile:** She's a person who *would* keep it. The wiring is there. The meningitis scar is there. The intent is there.

  **Wren:** Intent without output is just daydreaming. Look, if I write "Ilse is brave" but she never faces danger, I'm lying. If I write "Ilse keeps confidences" but the world conspires to never test it, I'm not writing character. I'm writing a label.

  **Odile:** You're thinking of character as a resume. It's not. It's a gravitational field. The book bends around her inability to be asked. That bending is the evidence.

  **Wren:** That's the author bending the book. Not the character. You're admitting *you* stop the questions. You backfire the car. You change the subject. Ilse isn't doing anything. You're protecting her.

  **Odile:** I'm constructing the conditions where her specific tragedy can exist.

  **Wren:** Here's the knife, Odile. If the text is identical—same dialogue, same action, same outcome—whether she has the disposition or not, what is the difference a difference *of*? If no sentence changes, you're arguing about angels on a pinhead.

  **Odile:** Because the sentence isn't the unit of meaning. The tension is. The reader feels the near miss. They sense the question hovering and dying. That sensation *is* the character.

  **Wren:** That sensation is you winking at the reader. It's meta-fictional cheating.

  **Odile:** No. Listen. You're treating the disposition and the blocker as two things. The virtue and the flaw. They aren't. They're one composite property. The blocking doesn't conceal who Ilse is; it constitutes it. She isn't "loyal but vulnerable." She is "loyal *through* vulnerability." The fact that she is never tested isn't a mask on the machinery. It *is* the machinery.

  **Wren:** (Pauses, swirls the ice) If the blocking constitutes the loyalty, then the loyalty is dependent on the avoidance. Which means her virtue is parasitic on your mercy.

  **Odile:** It means her virtue is structural.

  **Wren:** It means it's fragile. If you, the author, sneeze and let a question slip, she betrays everyone. So she isn't loyal. She's just untested. And you're not writing a tragedy; you're writing a conservation law. You're conserving her reputation by starving her of opportunities.

  **Odile:** (Leans forward) But doesn't that starvation hurt her? Doesn't she feel the questions coming? Doesn't she sweat when the room gets crowded?

  **Wren:** (Sighs) Yes. She sweats. I'll give you that. The internal experience is real.

  **Odile:** Then the character is real.

  **Wren:** I didn't say that. I said the internal experience is real. But a novel isn't a mind-reading simulation. It's a record of events. If the event never happens, the record is empty. But... (Wren stops, looks at the glass) If the reader perceives the sweat, then the text *does* change. You'd have to write the sweat.

  **Odile:** Exactly. So the sentence does change.

  **Wren:** (Holds up a hand) Wait. I'm conceding the tone changes. The atmosphere changes. But I'm not conceding the moral status. You've engineered a world where she never has to be good. That makes her... what? Petted?

  **Odile:** Protected. Like a relic.

  **Wren:** Like a exhibit behind glass. And who's the curator? You. So the book isn't about Ilse's loyalty. It's about your refusal to break her.

  **Odile:** (Quietly) Is that so different? If I love her, I don't break her.

  **Wren:** If you love her, you let her choose. You're denying her the choice to be loyal. You're denying her the agency to fail. You've made her a clockwork orange. She can't choose goodness because she's prevented from choosing evil.

  **Odile:** (Stares at the table) I thought I was sparing her the meningitis glitch. I thought I was honoring the wiring.

  **Wren:** You're honoring the wiring by treating it like a bomb that must never detonate. But a bomb that never detonates is just a paperweight.

  **Odile:** Unless the room is built around the fear of the explosion. Then the paperweight is the load-bearing wall.

  **Wren:** Then the book isn't about Ilse. It's about the room.

  **Odile:** (Looks up, eyes tired) So what do I write? Do I let someone ask the question? Do I let her blurts the secret and ruin everything?

  **Wren:** I don't know. But right now, you're not writing a character. You're writing a quarantine.

  **Odile:** And if I break the quarantine?

  **Wren:** Then you find out if she's loyal, or if she's just lucky.

  **Odile:** (Whispers) What if luck is the only loyalty anyone has?

  **Wren:** Then you've written a different book. And you're eighty thousand words into the wrong one.

  **Odile:** (Pushes the glass away) So the question isn't whether she keeps the secret.

  **Wren:** No. The question is whether you're willing to let the world be cruel enough to find out.

  **Odile:** Or whether I'm cruel enough to keep her safe forever.

  **Wren:** (Stands up) Those aren't the same thing?

  **Odile:** (Looks at the empty chair) I don't think they are anymore.
