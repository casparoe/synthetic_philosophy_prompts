  The pitch
  This project resolves a tension in Hume's economic thought: how to reconcile his long-run monetary neutrality with his short-run policy recommendation to increase the money supply. While standard readings treat these as contradictory or rhetorical, I argue Hume identifies a specific causal mechanism during the transition period where uneven money distribution stimulates industry. By isolating this mechanism from his theories on interest and public credit, the project clarifies whether Hume offers a coherent theory of non-neutrality or a pragmatic concession to contemporary mercantilist audiences.

  The question
  Does Hume's recommendation to maintain an increasing money stock rely on a theoretically robust account of short-run non-neutrality, or is it an inconsistent concession to mercantilist intuition? Specifically, is the stimulus effect derived from the aggregate quantity of money or from the uneven temporal distribution of new specie across sectors? Resolving this requires determining whether the transition period constitutes a distinct causal regime where money affects real variables like employment and output, or if it is merely a frictional delay before price adjustments neutralize monetary shocks. The answer must explain how this short-run effect coexists with the balance-of-trade mechanism that inevitably reverses monetary inflows, without collapsing into a contradiction between his descriptive economics and normative policy advice. It must also reconcile this with his denial in the interest essay that money quantities determine real rates.

  Why it's still open
  Existing scholarship generally splits into two camps. The long-run-neutralist reading emphasizes Hume's quantity theory and balance-of-trade mechanism, treating the stimulus claim as a rhetorical flourish aimed at mercantilist contemporaries. This captures Hume's anti-mercantilist core but struggles to explain why he explicitly advises magistrates to pursue monetary growth. The proto-short-run reading takes the transition story seriously as an early theory of monetary non-neutrality, highlighting the uneven spread of specie. However, this view often glosses over Hume's explicit denial in the interest essay that money quantities affect real rates, and it frequently conflates the money essays with his distinct arguments on public credit.
  The specific pressure point neither handles is the conditionality of the stimulus. Hume links the benefit to idle resources and the gradual diffusion of money, yet his adjustment mechanism assumes full employment equilibrium. Neither reading adequately explains how Hume justifies a policy of permanent inflation if the mechanism relies on a temporary disequilibrium that his own system predicts will close. Furthermore, existing accounts rarely distinguish between the fraud of coin revaluation and the benefit of specie inflow, leaving unclear whether Hume supports monetary expansion per se or only specific forms of it. Consequently, the literature often conflates his optimism about specie with his pessimism about paper credit. The unresolved issue is whether the transition effect is a general monetary phenomenon or contingent on specific institutional conditions regarding labor mobility and confidence. Without settling this, we cannot determine if Hume's policy is theoretically coherent or practically opportunistic.

  Method, month by month
  Month one focuses on textual reconstruction. I will closely parse *Of Money* and *Of the Balance of Trade*, mapping the precise steps of the transition mechanism against the adjustment mechanism. The goal is to isolate the causal claims about industry stimulation from the quantity-theoretic claims about price levels. I will bracket *Of Public Credit* to avoid scope creep, noting only where confidence arguments overlap. I will create a schematic of the flow of specie versus the flow of prices to visualize the lag.
  Month two addresses the interest rate constraint. I will analyze *Of Interest* to determine if the three non-monetary causes of interest are compatible with the transition story. If money stimulates industry but not lending, the mechanism must operate through wages or profits rather than credit availability. This distinguishes my project from standard monetary stimulus interpretations. Special attention will be paid to the assumption of idle hands; if labor is fully employed, does the stimulus vanish? This tests the limits of the non-neutrality claim.
  Month three involves comparative rigorous analysis. I will contrast Hume's transition period with modern distinctions between real and nominal shocks, not to anachronistically judge him, but to clarify the conceptual space he occupies. This includes examining the coin denomination passage to distinguish between nominal revaluation and real specie increases. I will draft the section distinguishing the fraud of raising denomination from the benefit of inflow, ensuring the argument doesn't rely on nominal illusions.
  Month four is synthesis and drafting. I will construct the argument showing whether the policy recommendation is consistent with the theoretical framework. The output will be a final paper draft ready for submission, focusing on the coherence of the short-run/long-run distinction. I will refine the abstract to ensure the distinction between the two readings is sharp.

  Result and failure
  A successful outcome demonstrates that Hume's policy recommendation is theoretically consistent with his long-run neutrality, grounded in a specific mechanism of uneven distribution that operates only during disequilibrium. This would show Hume offers a nuanced view where money is neutral in equilibrium but non-neutral in transition, contingent on idle resources. It clarifies his anti-mercantilism as compatible with active monetary policy under specific conditions. Success means we can specify exactly when a magistrate should intervene.
  Failure would look like two findings. First, if the transition story relies on money illusion that contradicts his rational agent assumptions in the balance-of-trade essay, the project fails to find coherence. Second, if the stimulus effect cannot be separated from his arguments on public credit and confidence, the project proves my advisor right: this is multiple projects disguised as one. Finally, if the interest essay completely undermines the possibility of monetary stimulation of industry, the core thesis collapses. Or if the distinction between specie and paper credit proves untenable within his own framework.

  Scope check
  The biggest risk is conflating the money essays with the public credit essay. To keep this feasible, I will definitively bracket the national debt arguments, treating confidence only where it directly impacts specie circulation. I will also avoid detailed engagement with the interest essay beyond the specific constraint on rates. If the transition mechanism requires a full theory of employment, I will limit the claim to Hume's explicit text about idle hands rather than building a general macro model. Focus remains on compatibility.

  Referee's objection
  A historian of economics might object that this imposes a modern short-run/long-run distinction onto Hume that he didn't possess. Claiming that searching for theoretical consistency ignores the rhetorical context of the essays, which were aimed at policy debates, not system-building. The design potentially risks treating Hume as a modern macroeconomist rather than an eighteenth-century man of letters.
