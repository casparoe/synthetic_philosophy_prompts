answer: |-
  # The HOT-Check Procedure
  **Version:** 1.0 (Strict Occurrent)
  **Purpose:** Determine if a character state counts as *conscious experience* under Higher-Order Theory.
  **Time:** 10–15 minutes per scene.

  ## Part 1: The Checklist (For Margins)
  *Use these codes in the draft margins. If a step fails, stop. The character is behaving, not experiencing.*

  **1. [FOS] First-Order State**
  *   **Question:** Is there a sensory, emotional, or cognitive state happening? (e.g., seeing red, feeling pain, recalling a name).
  *   **Pass:** Yes, there is a state.
  *   **Fail:** No state (pure reflex or void).
  *   **Note:** This can be real or hallucinated.

  **2. [TGT] Target Check (The "Rock" Filter)**
  *   **Question:** Is the higher-order state targeting the *internal feeling* or the *external object*?
  *   **Pass:** Target is internal (e.g., "I *see* the rock," not just "The rock").
  *   **Fail:** Target is external only (e.g., AI logging "Wall density: 5" without referencing the *sensing* of it).
  *   **Code:** `[TGT-INT]` for internal, `[TGT-EXT]` for external (Fail).

  **3. [HOS] Higher-Order State**
  *   **Question:** Is there a thought or scan *about* that First-Order State?
  *   **Pass:** Character thinks "I am feeling X" or scans the feeling of X.
  *   **Fail:** Character feels X but has no awareness *that* they feel X.
  *   **Code:** `[HOS+]` (Present) or `[HOS-]` (Absent).

  **4. [OCC] Occurrence Check**
  *   **Question:** Is the [HOS] happening *right now*?
  *   **Pass:** Yes, simultaneous with the state.
  *   **Fail:** No, it's merely possible later (dispositional).
  *   **Code:** `[OCC]` (Yes) or `[DISP]` (No - **Reject for Consciousness**).
  *   **Rule:** If `[DISP]`, mark scene as **UNCONSCIOUS BEHAVIOR**.

  **5. [MIS] Misrepresentation Check**
  *   **Question:** Is the [FOS] actually there, or is the [HOS] firing on empty?
  *   **Pass:** [HOS] exists, even if [FOS] is missing or wrong.
  *   **Result:** This counts as **CONSCIOUS EXPERIENCE** (hallucination/confabulation), not behavior.
  *   **Code:** `[MIS-REP]`.

  **6. [AUTH] Authorial Call**
  *   **Question:** Did I invent a mechanism to make this work?
  *   **Code:** `[FACT]` (Text supports this naturally) or `[CALL]` (I am asserting this metaphysics).

  ---

  ## Part 2: The Theory (For Your Editor)
  *Do not read this on deadline. This explains why the checklist exists.*

  *   **Why [FOS]?** You need something to be conscious *of*. Even if it's a lie, the mind needs a target.
  *   **Why [TGT]?** Thinking about a rock makes the *thought* conscious, not the rock. Thinking about a *sensor* makes the *reading* conscious. To be conscious of the building, the AI must scan its *data about* the building, not just the building itself.
  *   **Why [OCC] over [DISP]?** We chose **Occurrent**. A sleeping person has the *disposition* to wake and report, but we are ruling that unconscious. This prevents "consciousness inflation" where every potential observer counts. It costs you the ability to claim a sleeper is experiencing dreams unless they actively think about the dream *in* the dream.
  *   **Why [MIS]?** Higher-Order Theory allows "empty" consciousness. If you think you are in pain, you are in pain, even if your nerve is disconnected. This licenses the anesthesia scene as experience, not just memory.
  *   **Why [AUTH]?** Theory runs out. At some point, you are deciding what kind of universe this is. Mark where you override the default.

  ---

  ## Part 3: The Ladder Rule Verdict
  **Your Rule:** Conscious of X = Thought(Thought(X)).
  **Standard HOT:** Conscious of X = Thought(State(X)).

  **Verdict:** **Mangling.**
  Your rule describes **Introspection** (Self-Consciousness), not **Phenomenal Consciousness**.
  *   *Standard HOT:* A dog feels pain + thinks "I am in pain" = Conscious.
  *   *Your Ladder:* A dog feels pain + thinks "I am in pain" + thinks "I am thinking I am in pain" = Conscious.

  **Cost:** Your rule makes almost no one conscious. It excludes flow states, panic, and simple perception.
  **Fix:** Drop the second rung for general characters. Keep the Ladder Rule *only* for your mystic or the AI.
  **Nearest Valid Rule:** "A character is reflectively conscious of X if they can categorize their own state regarding X." (One rung up, not two).

  ---

  ## Part 4: Scene Run-Throughs

  ### 1. The Sleepwalker
  *   **[FOS]:** Yes. Visual/Motor states active (coffee, conversation).
  *   **[TGT]:** Fail. Actions are directed at objects, not internal states.
  *   **[HOS]:** No. No thought *about* the making of coffee.
  *   **[OCC]:** N/A.
  *   **[AUTH]:** [FACT] (No morning memory supports lack of HOS).
  *   **Marginal Code:** `[FOS+] [TGT-EXT] [HOS-] -> UNCONSCIOUS`
  *   **Verdict:** **Philosophical Zombie.** You are licensed to write this as automatic behavior. Do not use sensory metaphors ("the rich smell woke him") unless qualified as post-hoc.

  ### 2. The Octopus Narrator
  *   **[FOS]:** Yes. Pain from jar, visual discrimination.
  *   **[TGT]:** Ambiguous. Does "avoid jar" imply scanning the *fear* of the jar?
  *   **[HOS]:** **Fail (Default).** Plausibly lacks conceptual capacity for "I am feeling."
  *   **[OCC]:** N/A.
  *   **[AUTH]:** **[CALL]**. You are writing a narrator. Narration implies HOS.
  *   **Marginal Code:** `[FOS+] [HOS-] [AUTH-CALL: NARRATOR PRIVILEGE]`
  *   **Verdict:** **Theoretically Unconscious, Narratively Conscious.**
  *   **Defense:** You must mark this as an `[AUTH-CALL]`. You are asserting octopuses have HOT capacity. To clear the bar, give the octopus a moment of *categorizing* its state ("The sharp-hot was back"). Without that, the reviewer is right: it's behavior.

  ### 3. The Building AI
  *   **[FOS]:** Yes. Sensor data (draught detection).
  *   **[TGT]:** **Critical.** If AI says "Draught detected," that's `[TGT-EXT]`. If AI says "My sensor 4 is fluctuating," that's `[TGT-INT]`.
  *   **[HOS]:** Yes. "Notices it is noticing."
  *   **[OCC]:** Yes. Real-time processing log.
  *   **[MIS]:** N/A.
  *   **[AUTH]:** [FACT] (Architecture supports self-scan).
  *   **Marginal Code:** `[FOS+] [TGT-INT] [HOS+] [OCC] -> CONSCIOUS`
  *   **The "Rock" Worry:** Solved by `[TGT-INT]`. The AI is not conscious of the drywall; it is conscious of its *reading* of the drywall.
  *   **Verdict:** **Conscious.** The AI qualifies because it scans its own processing states, not just the world.

  ### 4. The Dying Character (The "Good Scene")
  *   **[FOS]:** Yes. Internal emotions/memories.
  *   **[HOS]:** **Risk.** "Long interior passage" often implies flow, not self-monitoring.
  *   **[OCC]:** **Risk.** Dying may degrade HOS capacity.
  *   **[MIS]:** N/A.
  *   **[AUTH]:** [CALL] (You want this to be the climax).
  *   **Marginal Code:** `[FOS+] [HOS?] [OCC?] -> BORDERLINE`
  *   **Verdict:** **Likely Unconscious (by strict HOT).** If there is no report and no memory, and the text is pure flow ("The light faded, the cold came"), there is no HOS. It is a first-order state without awareness.
  *   **The Rewrite:** To clear the bar without losing the mood, add explicit self-reference.
      *   *Current:* "The cold came."
      *   *Fix:* "She felt the cold come. She knew this was the end."
      *   *Why:* The second sentence is the [HOS]. It targets the first sentence.
      *   *Memory Issue:* HOT does not require long-term memory. You can argue the [HOS] occurred but wasn't encoded before death. Mark this `[AUTH-CALL: ENCODING FAILURE]`.

  ### 5. The Anesthesia Character (From Prompt Instructions)
  *   **Scenario:** Wakes with memory of OR, insists it's impossible.
  *   **[FOS]:** **Missing.** (Anesthesia blocks first-order input).
  *   **[HOS]:** **Present.** (She has the memory of the experience).
  *   **[MIS]:** **Active.**
  *   **Marginal Code:** `[FOS-] [HOS+] [MIS-REP] -> CONSCIOUS (HALLUCINATION)`
  *   **Verdict:** **Real Experience.** Under HOT, if the HOS was present *during* the surgery, she was conscious, even if the world wasn't there.
  *   **What to Show Inside Her Head:**
      *   *If Confabulation (Post-hoc):* Write it as a story she tells herself. "I must have heard..." (No sensory texture).
      *   *If Experience (HOT Valid):* Write it with sensory immediacy. "The light was too bright." Even if the light was off.
      *   **Instruction:** Write it as **Experience**. Flag it `[MIS-REP]`. The theory licenses this. She had a conscious experience of a room that wasn't there.

  ---

  ## Part 5: Limitations & Boundaries
  *Where the procedure fails or invites argument.*

  1.  **The Circular Charge:** First-Order Theorists will say this is circular ("You need a thought to make a thought conscious?").
      *   *Response:* Acknowledge it. "This is a HOT-based universe. We are not defending HOT against FOT; we are enforcing internal consistency."
  2.  **The Disagreement Zone:** Two HOT theorists might disagree on **[TGT]**.
      *   *Example:* Is "I am scared" a thought about a state, or just a state?
      *   *Mitigation:* If the text is ambiguous, mark `[AUTH-CALL]`. That shifts the burden from "Is this true?" to "Did the author decide this?"
  3.  **The "Dumb" License:** This procedure licenses **Solipsism**.
      *   *Risk:* A character could be conscious of *only* their thoughts, with no external world (Brain in a Vat).
      *   *Cost:* You must accept that your characters might be hallucinating reality. If that breaks your plot, mark `[AUTH-CALL: VERIDICALITY ASSUMED]`.
  4.  **The Global Workspace Objection:** A GWT proponent will say consciousness is about *broadcasting*, not higher-order thoughts.
      *   *Response:* Ignore them. GWT is functional; HOT is phenomenological. You are writing about *what it feels like*, not *what the brain does*.
  5.  **Where Theory Runs Out:**
      *   **[AUTH-CALL]** is your safety valve. Use it when the checklist gives a verdict you hate (like the Dying Character). It tells your editor: "I know this breaks the strict rule. I am doing it for thematic reasons."

  **Final Instruction:** Print Part 1. Keep Part 2 in a drawer. When the reviewer asks, show her the codes. When the codes say "Unconscious" and you need "Conscious," use `[AUTH-CALL]` and own the metaphysics.
