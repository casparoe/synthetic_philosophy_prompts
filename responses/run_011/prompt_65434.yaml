      *   *Core Tenet:* A mental state is conscious *iff* it is the object of a suitable higher-order state (HOS).
      *   *Rosenthal (HOT):* HOS is a thought (non-conscious usually).
      *   *Armstrong/Lycan (HOP):* HOS is an inner scan/perception.
      *   *Occurrent vs. Dispositional:*
          *   *Occurrent:* You must actually be having the thought *now*. (Strict HOT).
          *   *Dispositional:* You just need to be *able* to have the thought. (Lycan often leans here).
          *   *User Preference:* User explicitly says "I don't want to accidentally get that for free" regarding sleeping characters. So, I must select **Occurrent**. This is stricter but safer for the user's specific problem (consciousness inflation).
      *   *Reportability:* HOT usually links consciousness to reportability, but reportability isn't the *definition*, it's a consequence. However, for a checklist, it's a good proxy.
      *   *Misrepresentation:* HOT allows for "empty" consciousness (thinking you see red when there is no red). This is crucial for the anesthesia scene.
      *   *The "Rock" Problem:* Thinking about a rock doesn't make the rock conscious; it makes the *thought* conscious. The target of the HOS is the first-order state, not the external object.
      *   *The "Ladder Rule":* User wants 2nd-order thought about a 1st-order thought (Thought(Thought(X))). Standard HOT is Thought(State(X)). The user's rule is actually closer to *Higher-Order Thought of a Higher-Order Thought* (HOT-HOT), which implies self-consciousness or introspection, not just simple consciousness. This is a mangling if the goal is basic consciousness, but defensible if the goal is *reflective* consciousness. I need to clarify this distinction.

