      *   **Alternative Argument (The "Manifest Criminality" or "Natural Law" route):** Instead of saying "they didn't need notice," argue "they *had* notice because the wrongness was manifest." Or, argue that *nullum crimen* is a structural constraint on the *prosecutor*, not a right waivable by the defendant's cynicism.
