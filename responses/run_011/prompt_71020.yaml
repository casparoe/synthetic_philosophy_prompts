  2.  **Diagnose the Logical Flaw:**
      *   The core issue is in Premise (1). The user reduces *nullum crimen* solely to a "fair notice/guidance" theory (a utilitarian or functionalist view).
      *   If *nullum crimen* is *only* about guiding conduct, then anyone who doesn't care about guidance forfeits the protection.
      *   However, legal philosophy generally treats *nullum crimen* as having a *deontological* or *structural* component independent of the defendant's subjective reliance. It's about limiting *state power*, not just protecting *defendant expectations*.
      *   By accepting (1), the user opens the door to (5)-(8). To save the argument from collapsing into "victors' justice," (1) must be modified or rejected.

  3.  **Evaluate the Options (Which step to give up?):**

      *   **Option A: Give up (1).** (Most promising).
          *   *Why:* *Nullum crimen* isn't just about notice; it's about the legitimacy of the tribunal and the separation of powers/sovereignty. It prevents arbitrary power *even* against the wicked.
          *   *Cost:* You can't argue the Nazis forfeited their right to notice. You have to argue the law *wasn't* actually retroactive (natural law argument) or that the notice requirement was satisfied differently (manifest criminality).
      *   **Option B: Give up (3).** (User prefers not to).
          *   *Why:* If you say the Nazis *did* rely on law, it's historically dubious.
          *   *Cost:* Weakens the specific moral condemnation of the Nazi leadership.
      *   **Option C: Give up (2).**
          *   *Why:* Notice is an objective standard, not subjective.
          *   *Cost:* Makes the argument rigid. If the law wasn't there, it wasn't there, regardless of whether they cared.
      *   **Option D: Distinguish (5).**
          *   *Why:* Argue that high-level architects of tyranny are different from ordinary criminals regarding the *source* of law.
          *   *Cost:* Risks creating a "two-tiered" justice system (one for elites, one for commoners), which feeds the victors' justice critique anyway.

  4.  **Address the "Loose Ends":**
      *   **Aggression/Treaties:** The Kellogg-Briand Pact outlawed war but didn't specify individual criminal liability. The Nuremberg judgment argued that treaties bind individuals implicitly. This is the weak link legally.
      *   **Dönitz/Submarine Warfare:** This is the *tu quoque* argument. The tribunal didn't convict on that specific count because the US did it too. This suggests the tribunal *was* concerned with fairness/notice/consistency, contradicting the idea that they didn't care about law.

