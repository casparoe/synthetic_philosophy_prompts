answer: |-
  You have walked directly into one of the classic traps of legal philosophy, specifically the tension between the **guidance function** of law and the **constraint function** of law. Your argument is logically valid, which is why it terrifies you: you have constructed a "forfeiture theory" of procedural rights (you lose the protection of *nullum crimen* if you don't respect the law), and you have correctly deduced that this theory destroys the Rule of Law itself.

  To save the prosecution's case without validating the "victors' justice" thesis, you must **give up Premise (1).**

  Here is why (1) is the poison pill, what it costs you to drop it, and how to resolve your loose ends regarding Dönitz and the Aggression charge.

  ### 1. The Diagnosis: Why Premise (1) Detonates
  Premise (1) states: *"The only thing wrong with retroactive punishment is that it defeats fair notice."*

  This is a purely utilitarian or functionalist view of *nullum crimen sine lege*. It treats the principle of legality as a **benefit conferred on the accused** for the purpose of behavioral guidance. If the benefit is for *their* sake, and they don't care about it (Premise 3), then logically they can forfeit it.

  But in liberal legal theory, *nullum crimen* is not just a shield for the defendant; it is a **structural constraint on the state.** It exists to prevent the sovereign from exercising arbitrary power, regardless of the moral worthiness of the accused. It protects the integrity of the legal system, not just the expectations of the actor.

  If you keep (1), you are arguing that the Rule of Law is conditional on the defendant's good faith. That implies that when the state prosecutes a "bad" person (a Nazi, a cynical head of state, a tax avoider), the state is free to ignore its own rules. That is the definition of "victors' justice" (your conclusion 8).

  ### 2. The Fix: Drop (1), Keep (3)
  You can keep Premise (3) — *The Nazis were not relying on law as a guide* — without triggering the disastrous conclusion (5).

  **The Revised Argument:**
  *   **New (1):** The principle of legality serves two purposes: (a) to guide conduct (notice), and (b) to constrain arbitrary state power (legitimacy).
  *   **New (2):** While a defendant cannot forfeit the *constraint* function (the state must still act legally), the *notice* function is satisfied if the criminality was **manifest**, even if the specific statute was novel.
  *   **Keep (3):** The defendants did not rely on domestic law as a constraint.
  *   **New (4):** Therefore, the lack of a specific domestic statute prohibiting aggression does not defeat the charge, because the prohibition existed in international custom/treaty (Kellogg-Briand) and the moral wrong was manifest. The Charter did not create the crime ex post facto; it created the *jurisdiction* and the *penalty* for a pre-existing wrong.

  **What you lose:**
  You lose the clever "they forfeited their rights" argument. You cannot say, "You were too cynical to deserve notice." Instead, you must argue, "You had notice enough, because the wrongness was obvious, and the Charter satisfied the requirement for a tribunal." This is a harder argument to make because it requires defending the substantive existence of the law, rather than dismissing the defendant's standing to complain about it.

  **What you gain:**
  You avoid the conclusion that *nullum crimen* is merely a shield for the weak. You preserve the principle that the *prosecutor* is bound by law even when prosecuting the wicked. This distinguishes Nuremberg from a show trial.

  ### 3. Resolving the Loose Ends

  #### The Aggression Charge (Novelty vs. Custom)
  You noted that interwar treaties outlawed war but attached no individual penalty. Justice Pal (the dissenter at Tokyo) and others hammered this.
  *   **The Fix:** Distinguish between *malum prohibitum* (wrong because prohibited) and *malum in se* (wrong in itself).
  *   The prosecution's strongest philosophical ground (articulated by Robert Jackson) was that aggressive war was *malum in se*. The treaties (Kellogg-Briand) were declaratory of existing custom, not inventive.
  *   **The Legal Move:** The Charter was not creating a new crime retroactively; it was **crystallizing** an existing obligation. The "novelty" was only in the *forum* (an international criminal tribunal), not the *norm*.
  *   **Cost:** You have to concede that strictly positivist law (looking for a statute book in 1938 saying "individual X goes to jail for war") didn't exist. You are arguing for a natural-law-adjacent position: some acts are so clearly criminal that formal codification is secondary to their manifest nature.

  #### The Dönitz Precedent (Submarine Warfare)
  You recalled that Dönitz wasn't sentenced on the submarine warfare count because the US Navy did the same. You suspect this undermines the notice story.
  *   **Analysis:** It actually **saves** your argument from the "victors' justice" conclusion.
  *   If the Tribunal were purely exercising arbitrary power (as your original argument concluded in step 8), they would have convicted Dönitz regardless of US conduct. The fact that they *didn't* adds the count to his sentence proves they **were** tracking a principle of fairness/notice/consistency.
  *   **The "Something Else":** The principle they were tracking was **reciprocity and customary practice.** In the laws of war (*jus in bello*), if a practice is widespread and not explicitly prohibited, it becomes customary law. By admitting the US did it, the defense proved it was customary.
  *   **How to use this:** Use Dönitz to show that the Tribunal *did* respect *nullum crimen* where it mattered. They applied the principle even to the losers. This refutes your conclusion (8). The Tribunal wasn't wielding *nullum crimen* as a discretionary weapon; they were constrained by it (they dropped the count), even when it let a Nazi admiral off a specific charge.

  ### 4. Summary of the Trade-Off
  *   **Give Up:** The idea that *nullum crimen* is *only* about fair notice (Premise 1).
  *   **Keep:** The factual claim that the Nazis ignored legal constraints (Premise 3).
  *   **New Burden:** You must now argue that the law *was* sufficiently accessible (via custom/manifest criminality) rather than arguing the defendants *forfeited* the right to access it.
  *   **Result:** You defend Nuremberg not by saying "Rules don't apply to monsters," but by saying "The rules existed, they broke them, and the Tribunal was bound by those same rules (as shown by Dönitz)."

  This shifts your position from "Nuremberg was exceptional justice for exceptional villains" (which sounds like victors' justice) to "Nuremberg was the enforcement of standing international norms through a new procedural mechanism" (which is the standard prosecution defense). It is less philosophically flashy than your forfeiture argument, but it doesn't blow up the Rule of Law in the process.
