          *   Ott: Community is what we do together (praxis).
          *   Brann: Community is what we inherit together (ontology).
      *   Detonation: Brann explains the *direction* (loss of sacred authority leads to cynicism/state cult). Ott explains the *resilience*.

      *Wait, one constraint:* "which of my two characters that outcome would vindicate and why".
      If the highlands secede *using* the text:
      Ott says the text binds people. If they secede, the text is now binding a *smaller* group. Does it still bind? Yes. So Ott is right that the text works.
      Brann says the text works only as ancestral transmission. If they use it for autonomy, they are using it as a political banner (state cult). So Brann is right about the *mechanism* changing.
      I need to be clear: Brann is vindicated regarding the *nature* of the bond (it becomes instrumental), Ott regarding the *utility* (it remains useful).
      Actually, Brann says "whatever made identification possible is gone". If they secede, the identification with the *whole republic* is gone. So Brann is right that the original function (binding the whole) is dead. Ott says "a republic... can perfectly well go on being a republic." If the republic breaks, she is empirically wrong about the stability.
      So: Highlands seceding vindicates Brann's pessimism about the text's unifying power, but Ott's pragmatism about its adaptability.
      I will argue Brann is more vindicated on the *cause* of the rupture.

