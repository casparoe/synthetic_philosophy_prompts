answer: |-
  Ott: You treat the text as a relic instead of a tool. The notebook proves the handle was fitted in a lowland office, but the blade still cuts. For a century this verse has allowed a miner in the south and a herder in the north to feel they inhabit the same time. That work is done. It does not undo itself because we found the invoice. The republic is the arch. The antiquity was the wood.

  Brann: It undoes itself because the work was never mechanical. It was sacramental. You say the blade cuts, but the cut depends on the hand believing it is blessed. If the miner knows the herder's voice was mimicked by a clerk who never smelled sheep, the identification fails. They are no longer participants in a horizontal life. They are subjects reciting a directive issued by the imperial survey. The authority flows down, not up. The text was received, not made. Once it becomes a composition addressed to the present, it loses the weight of the past.

  Ott: Authority is retroactive. We made it true by living it. You fixate on the instrument. The *alidade*. A word no herder knew until the empire brought it into the valley. You flagged it decades ago. You thought it was a copyist's error then. Now you say it is the smoking gun. But it is only a word. Does the mountain change because the surveyor named it differently than the herder? The land is still there. The people are still here. The word is just a marker.

  Brann: It is the perspective. The herder looks at the mountain. The surveyor looks at the angle. The text claims to be the mountain's song, but it describes the mountain as a problem to be measured. That is not a mistake. It is a confession. The voice is not ancestral. It is administrative. When people sing it, they are singing the logic of the occupier. The empire did not just map the land; it mapped the imagination. To sing the Cycle is to sing the map, not the terrain. The anachronism proves the map was drawn before the song was sung.

  Ott: Except for the forty lines. You verified them yourself. The lament for the lost sheep. The rhythm of the transhumance. They are genuine. The clerk didn't invent them; he stole them because he needed truth to make the lie stick. So the truth is in there. It survives inside the fabrication. Why discard the grain because the sack is marked wrong? The herders sang those lines. The blood is real, even if the vessel is forged.

  Brann: Because the sack dictates how the grain is eaten. Those forty lines are not standing alone. They are framed by the surveyor's metrics, wrapped in his meter. They are exhibits in a museum of a culture that never existed. When you sing the lament now, you aren't mourning the sheep. You are mourning the idea that the sheep mattered to the man who wrote the line. He didn't care about the sheep. He cared about the rhyme. The genuine lines are hostages. They force you to accept the forgery to hear the truth.

  Ott: You assume the singer needs the writer's intent. They don't. They need their own. If the highlands secede next week and sing the Cycle as their banner, they aren't singing for the clerk. They are singing for themselves. The text becomes theirs the moment they take it. Ownership isn't about origin. It is about use. If they use it to demand autonomy, the text serves the living, not the dead.

  Brann: —No. There is a difference between taking and answering.

  Ott: I beg your pardon?

  Brann: You said they take it. But the Cycle works because they answer it. They treat it as a call from the dead. If they know the dead never spoke, it is not a call. It is a script. You can build a state on a script. You cannot build a kinship on it. That is what waits for us. Not a republic. A state cult. The highlands will not profit. They will become a smaller version of the same lie.

  Ott: And if the state cult keeps the peace? If the alternative is fragmentation? You want to pull the thread because it is tangled. I want to leave it because it holds the coat together. The centenary goes ahead. The highlands will sing. Let them. If the song changes, we change with it.

  Brann: They will sing knowing it is a lie. That changes the sound. It turns devotion into performance. You will have the form without the force.

  Ott: Then let the sound change. We are still here. The text is not the community. We are.

  [Brann closes the notebook. The light over the table flickers once, then steadies.]

  ***

  **Analysis**

  The substantive hinge between Ott and Brann is not whether the text is useful, but whether legitimacy is derived from *function* or *ontology*. Ott argues that community is performative: it is real because it is enacted. Brann argues that community is genealogical: it is real because it is inherited. For Ott, the text is a technology of cohesion; for Brann, it is a medium of presence. Once the medium is proven to be a transmission from the occupier rather than the ancestors, the presence vanishes, leaving only the technology.

  Empirically, Ott is committed to the claim that practice sustains belief regardless of origin. If the Centenary proceeds and the citizens sing without mass disillusionment, she is vindicated. Brann is committed to the claim that knowledge of origin alters the quality of participation. If the singing becomes ironic, mandatory, or purely ceremonial, he is vindicated. In your proposed outcome—where the highlands secede using the text—Brann is ultimately vindicated regarding the *nature* of the bond. If the text becomes a banner for autonomy, it confirms his fear that the text has become a political instrument (a state cult) rather than a shared heritage. Ott would be vindicated only if the text continues to bind the separatists in a "horizontal life" comparable to the original republic, but secession itself suggests the original horizontal life has already fractured.

  Ott leans on the premise that a community is defined by what its members *do* together. Brann leans on the premise that a community is defined by what its members *are* together. This is why Brann better explains why the discovery detonates in a specific political direction. The revelation does not just remove history; it removes the "ancestor" from the conversation. When a community discovers it is answering a script rather than a call, the relationship shifts from kinship to administration. This inevitably favors fragmentation or authoritarianism (state cult) over organic solidarity. Ott explains how to manage the fallout; Brann explains why the fallout occurs.
