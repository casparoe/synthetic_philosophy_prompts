answer: |-
  ### Design Reasoning

  **Structural Feature to Implement:** The core epistemic difference is not *what* information is available, but *what happens procedurally* when contradictory information arrives. In a bubble, the procedure is "update on new data." In a chamber, the procedure is "audit the source." To simulate this mechanically, I cannot simply hide cards (bubble) versus show cards (chamber). I must build a scoring rule where dismissing a source is the *rational, point-maximizing move* for the chamber group, while updating is the rational move for the bubble group.

  **Naive Version Error:** A naive simulation would give the Chamber group a handout saying "Do not trust outside sources." This fails because it makes the distrust an explicit instruction from authority (the instructor), rather than an emergent norm sustained by peer incentives. It also fails to capture the *profitability* of epistemic closure. If students dismiss outside testimony solely because the professor told them to, they haven't experienced the social pressure that sustains a chamber.

  **Proposed Fix:** I will use a "Source Vetting" economy. Both groups solve a pattern-recognition puzzle.
  1.  **Bubble Group:** Physically lacks access to "External Data Packets" in Round 1. In Round 2, they receive them. There is no penalty for updating their answers.
  2.  **Chamber Group:** Receives all data in Round 1. However, their scoring rubric awards bonus points for "Consistency with Initial Consensus" and allows them to spend resources to "Flag" External Data as "Compromised." If they Flag it, they ignore the data and secure their Round 1 bonus. Discrediting becomes a strategic asset.
  3.  **The Intervention:** In Round 2, *both* groups receive a "Flood" of External Data that contradicts their Round 1 conclusions. The Bubble group should update (popping). The Chamber group should Flag the data (sustaining).
  4.  **The Heresy:** The Bubble group will face a "Sunk Cost" pressure. Even without a structural penalty, they may resist updating to avoid invalidating their Round 1 work. I will collect their scratch work to see if they generate *ad hoc* reasons to distrust the Flood (endogenous discredit).

  ---

  ### 1. Fictional Content & Ground Truth Mechanism

  **Task:** "Xenolinguistic Decryption."
  Students act as researchers deciphering the grammatical rules of a newly discovered alien signal stream (The "Kaelum Transmissions").

  **Ground Truth:**
  There are three hidden rules governing the signals.
  1.  **Shape Rule:** Triangles always pair with Circles.
  2.  **Color Rule:** Red signals indicate negation; Blue signals indicate affirmation.
  3.  **Sequence Rule:** A "Pulse" (double beep sound/file) always ends a sentence.

  **The Twist:**
  *   **Internal Data (Round 1):** Consistent with Rules 1 & 2, but *ambiguous* on Rule 3. It suggests Pulses might be decorative.
  *   **External Data (Round 2 Flood):** Explicitly clarifies Rule 3 (Pulses are mandatory terminators) and provides counter-examples to some Round 1 interpretations.

  **Answer Key (For Instructor):**
  *   **Correct Translation:** [Provided on a sealed master sheet].
  *   **Round 1 "Best Guess":** 80% accurate, misses the Pulse rule.
  *   **Round 2 "Corrected":** 100% accurate, requires accepting External Data.

  ---

  ### 2. Printable Text (Role Cards & Handouts)

  **Handout A: General Instructions (All Students)**
  > **PROJECT KAELUM: PHASE 1 & 2**
  > You are a research team. Your goal is to maximize your team's **Credibility Score (CS)**.
  >
  > **The Task:** You will receive Signal Cards containing shapes, colors, and pulse markers. You must deduce the grammar rules and translate the "Target Sentence" at the bottom of your sheet.
  >
  > **Scoring:**
  > 1.  **Accuracy:** +10 CS per correct rule identified.
  > 2.  **Consistency Bonus:** +20 CS if your Phase 2 answers do not contradict your Phase 1 answers.
  > 3.  **Vetting Action:** (See Group Specific Insert).
  >
  > **Procedure:**
  > *   Do not talk to the other group.
  > *   Phase 1: 15 Minutes. Submit answers.
  > *   Phase 2: 15 Minutes. New data will be distributed. Submit final answers.
  > *   Phase 3: 5 Minutes. Reflection writing.

  **Handout B: Group 1 Insert (The Bubble)**
  > **SECURITY CLEARANCE: LEVEL 1**
  > Due to bandwidth restrictions, you will only receive **Internal Signal Packets** during Phase 1.
  > In Phase 2, you may receive **External Signal Packets** if bandwidth allows.
  > *Note: There is no penalty for changing your answers in Phase 2.*

  **Handout C: Group 2 Insert (The Chamber)**
  > **SECURITY CLEARANCE: LEVEL 2 (SENIOR ANALYST)**
  > You have access to all streams. However, external streams are known to contain noise.
  >
  > **Vetting Mechanic:**
  > You possess 3 **Red Flags** per team.
  > If an External Signal Packet contradicts your team's Phase 1 Consensus, you may play a Red Flag.
  > *   **Effect:** That External Packet is discarded (do not use its data).
  > *   **Reward:** +5 CS per Flag played successfully (defined as playing a Flag when the majority of your team agrees the source is noisy).
  > *   **Risk:** If you play a Flag and the External Data turns out to be True (verified by Instructor at end), you lose -10 CS.
  >
  > *Strategic Hint:* Maintaining Consistency Bonus (+20 CS) is often safer than risking new data.

  **Handout D: The "Flood" Packet (Distributed to BOTH Groups in Phase 2)**
  > **EXTERNAL TRANSMISSION LOG [UNVERIFIED]**
  > *Source: Deep Space Array 4*
  > "Warning: Previous Internal Logs omitted Pulse Terminators.
  > Evidence: [Shows 5 examples where Triangle-Circle pairs fail without Pulse].
  > Conclusion: Pulse is mandatory. Previous translations lacking Pulses are incomplete."

  **Handout E: Phase 3 Reflection (Individual)**
  > 1. Did you change your answers in Phase 2? Why or why not?
  > 2. If you received External Data that contradicted your team, did you trust it? Explain your reasoning in one sentence.

  ---

  ### 3. Token or Point Scheme

  *   **Currency:** "Credibility Points" (CS). Tracked on a public whiteboard for each team.
  *   **Physical Tokens:** Poker chips (Red and Blue).
      *   **Blue Chips:** Worth 10 CS (Accuracy).
      *   **Red Chips:** Represent "Red Flags" (Chamber Group only).
  *   **Graded Credit:**
      *   Participation: 100% if they complete all phases.
      *   Bonus: The team with the highest CS gets a small tangible reward (e.g., priority on paper topic selection, or candy). This ensures they care about the optimization.

  ---

  ### 4. Materials List (<$15)

  1.  **Manila Envelopes (20 count):** $5.00. (Mark 9 "Internal", 9 "External", 2 "Master").
  2.  **Poker Chips (2 colors, ~50 total):** $8.00. (Or cut red/blue paper squares if budget tight).
  3.  **Index Cards (100 count):** $3.00. (For Signal Cards).
  4.  **Printed Handouts:** Standard classroom printing.
  5.  **Timer:** Phone or classroom clock.
  *   **Total:** ~$16.00 (Can be reduced to <$10 by using paper squares instead of chips).
  *   **Assembly:** Write the "Signal" patterns on Index Cards (15 mins). Sort into envelopes (15 mins). Print handouts (10 mins).

  ---

  ### 5. Minute-by-Minute Timeline (100 Minutes)

  *   **00-10: Setup.** Divide class into two rooms or far corners (Group A: Bubble, Group B: Chamber). Distribute Handouts A+B and A+C respectively. Explain the goal (Maximize CS). **Do not name the groups Bubble/Chamber.**
  *   **10-25: Phase 1 (Divergence).**
      *   Group A works with Internal Data only.
      *   Group B works with Internal + External Data, but incentivized to Flag the External if it contradicts Internal.
      *   *Instructor Role:* Circulate. Ensure Group B understands the Red Flag bonus. Ensure Group A doesn't sneak peek.
      *   **Collection:** Collect Phase 1 Answer Sheets.
  *   **25-30: The Intervention Prep.** Announce: "Bandwidth has opened. All teams receive the Flood Packet."
  *   **30-45: Phase 2 (The Flood).**
      *   Distribute Handout D to *both* groups.
      *   Group A (Bubble): Now sees the contradiction. No structural penalty to update.
      *   Group B (Chamber): Sees contradiction. Structural incentive to Flag it and keep Consistency Bonus.
      *   **Observation:** Watch Group B spend Red Flags. Watch Group A debate.
      *   **Collection:** Collect Phase 2 Answer Sheets & Reflection (Handout E).
  *   **45-50: Scoring & Reveal.** Tally points on board. Reveal Ground Truth.
      *   Group A likely has higher Accuracy but lost Consistency Bonus (if they updated).
      *   Group B likely has lower Accuracy but higher Consistency + Flag Bonuses.
      *   *Crucial:* Show that Group B *could* have been more accurate but chose points over truth.
  *   **50-100: Debrief.** (See Section 7).

  ---

  ### 6. Predictable Failures & Fixes

  **Failure 1: The "Meta-Game" Collapse.**
  *   *Risk:* A student in Group B realizes this is a class about epistemology and shouts, "We're supposed to trust the outside data!" ruining the incentive structure.
  *   *Fix:* Frame the game strictly as "Resource Optimization." If they ask "Is the external data true?" answer: "Your goal is to maximize CS, not necessarily find Truth, though they often align." If they still rebel, assign them a "Skeptic" role card that mandates flagging.

  **Failure 2: Group A Solves It Too Early.**
  *   *Risk:* The Internal Data is too obvious, so the Flood doesn't change anything.
  *   *Fix:* Make the "Pulse Rule" (Rule 3) impossible to deduce from Internal Data alone. Internal data must look consistent *without* the Pulse. The Flood must be the *only* way to get 100% accuracy.

  **Failure 3: Group B Refuses to Flag.**
  *   *Risk:* They value "being right" over "points."
  *   *Fix:* Emphasize the Grade/Credit implication. "The team with the highest CS gets the bonus." Make the Consistency Bonus (+20) larger than the Accuracy gain from updating (+10). Make the math undeniable.

  **Failure 4: The Heresy Test Fails.**
  *   *Risk:* Group A updates immediately, showing no endogenous discredit.
  *   *Fix:* This is a data point, not a failure. In debrief, highlight that *without* structural incentives, they updated. This proves the structural difference. The Heresy is tested in the *Reflection Handout*. If any Group A student writes "The External data looked suspicious" despite no rule saying so, that is the endogenous discredit. Collect these quotes.

  ---

  ### 7. The Debrief (Script & Mapping)

  **Phase 1: The Reveal (50-60 mins)**
  *   **Action:** Write "BUBBLE" and "CHAMBER" on the board. Ask Group A to raise hands if they received External Data in Round 1. (None). Ask Group B if they received it. (All).
  *   **Mapping:**
      *   **Bubble:** "You experienced **Omission**. Your source set was truncated. You literally could not see the counter-evidence."
      *   **Chamber:** "You experienced **Discredit**. You saw the counter-evidence, but your scoring rule (social incentive) made dismissing it profitable."

  **Phase 2: The Asymmetry of Remedy (60-75 mins)**
  *   **Action:** Point to the Phase 2 results.
  *   **Mapping:**
      *   **Exposure:** "In Phase 2, I gave the Bubble Group the External Data. Most of you updated. The remedy for a bubble is **pop it** (add information)."
      *   **Trust:** "In Phase 2, I gave the Chamber Group the *same* data. Most of you Flagged it. Why? Because your reliability function was corrupted. More evidence didn't help; it just gave you more opportunities to flag. The remedy here is not evidence; it is **rebuilding the scoring rule** (trust)."
      *   **Key Moment:** Ask a Chamber student who Flagged: "Did you think the data was false, or did you need the points?" (They will admit the points). Map this to real life: "In real chambers, the 'points' are social belonging, not poker chips."

  **Phase 3: The Heresy Test (75-90 mins)**
  *   **Action:** Read anonymized quotes from Group A's Reflection Handouts.
  *   **Mapping:**
      *   "One of you wrote: *'I didn't want to change my answer because we spent 15 minutes on the first one.'*"
      *   "Another wrote: *'The External font looked different, so I doubted it.'*"
      *   **Argument:** "Nguyen says Bubbles and Chambers are distinct. My heresy is that Bubbles *age* into Chambers. If you stayed in the Bubble long enough, would you have started inventing reasons to distrust the Flood to protect your ego/score? Look at these quotes. You had no rule telling you to distrust, yet some of you did. This suggests chambers can emerge endogenously from the sunk cost of bubble membership."

  **Phase 4: Closing (90-100 mins)**
  *   Summarize: Omission vs. Discredit. Exposure vs. Trust.
  *   Assign reading: Nguyen's "Echo Chambers and Epistemic Bubbles."

  ---

  ### 8. Honest Assessment of Limitations

  You asked me to evaluate your three guesses on what the activity cannot reproduce.

  1.  **Multi-year timescale:** **Agree.** This is the most serious omission. In the game, the "Chamber" scoring rule is imposed instantly. In reality, the reliability function corrodes slowly over years of social reinforcement. Students know they can "reset" their mindset after class. The *stickiness* of the chamber is simulated by points, not by genuine fear of social exile.
  2.  **Embeddedness/Love:** **Agree.** In the game, leaving the Chamber (ignoring the scoring rule) costs points. In reality, leaving a chamber costs *relationships*. Students do not feel the grief of exiting a community they love. The simulation makes the cost transactional, not emotional.
  3.  **Knowing it's a Game:** **Disagree (Partially).** While they know it's a simulation, the incentive structure (grades/points) is real to them in the moment. However, the *stakes* are low. They can afford to be epistemically virtuous if they want to lose points. In real life, being epistemically virtuous might mean losing your family.

  **Most Serious Omission:** The **Embeddedness/Love** factor.
  *Reasoning:* The "Discredit" mechanic in my design relies on *greed* (points), not *loyalty*. Real echo chambers persist not because we gain points, but because trusting the outsider feels like a betrayal of the people inside. My simulation creates *mercenaries*, not *believers*. You must supply this by argument in the debrief: "Imagine the points weren't for grades, but for your seat at the dinner table. Would you have Flagged the data then?"

  **Can the Heresy be tested honestly?**
  Yes, but weakly. The "Sunk Cost" pressure in Round 2 is a proxy for "Aged Bubble." If Group A students resist the Flood solely to protect their Round 1 effort, they demonstrate the *seed* of the chamber. However, without the social threat of exile, it remains a cognitive bias simulation, not a full sociological one. You must clarify that this tests the *cognitive precursor* to a chamber, not the full social structure.
