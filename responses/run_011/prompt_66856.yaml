  If we detected the "noise" predicted by Continuous Spontaneous Localization (CSL) models and verified that the collapse mechanism itself possesses a preferred temporal direction (not merely inducing asymmetry via boundary conditions), term (ii) would collapse to near zero and term (iii) would rise to near one, pushing my credence in C above 0.70. Until then, the Past Hypothesis remains the most parsimonious placeholder.
