  **Bottom line**
  Your hypothesis is substantially correct but incomplete. The debate stalls not merely because "inevitable" is ambiguous, but because the question demands counterfactual certainty about unrepeatable events. The core conflict is between structural determinism and path dependence, masked by semantic slippage. Both sides agree on the historical record but disagree on the modal force required to explain it. The dispute concerns the permissible distance of historical rewinding. Progress requires abandoning the binary question for a graded model of robustness. The impasse signals a category error: treating a probabilistic historical tendency as a binary metaphysical fact.

  **What each side is actually committed to**
  The inevitability side is truly committed to the view that nature constrains theory tightly enough that convergence is the null hypothesis. They treat multiples not as accidents but as pressure valves releasing when a field matures. Their commitment is to the autonomy of scientific problems: the problem exists independently of the solver, and the solution is functionally determined by the available tools. They must argue that differences in notation or formulation, like Newton versus Leibniz, are superficial packaging over a shared structural core. They are committed to a sociological view where the individual is a vessel for systemic capacity.

  The contingency side is committed to the view that scientific knowledge is constructed through specific, fragile causal chains. They treat multiples as outliers that obscure the vast denominator of failed paths. Their commitment is to the specificity of content: Wallace's selection is not Darwin's because the mechanism differs. They argue that removing a key node breaks the chain because knowledge is distributed and contextual, not merely waiting to be found. They are committed to the idea that social and material conditions are not just background but constitutive of the discovery itself. For them, the state of the field is too coarse a granularity to predict specific outcomes.

  **Diagnosis**
  Your diagnosis identifies the semantic ambiguity correctly, but the deeper stall is epistemic. The term inevitable is indeed performing double duty, shifting between statistical frequency and counterfactual necessity. However, clarifying this distinction does not resolve the dispute because both sides accept the ambiguity when it suits their evidentiary needs. The inevitabilists use statistical frequency to imply counterfactual necessity, while contingentists use counterfactual fragility to dismiss statistical frequency.

  The real impasse lies in the unit of analysis. When inevitabilists say calculus was inevitable, they refer to the functional capacity to analyze change. When contingentists say calculus was contingent, they refer to the specific fluxional notation or the priority dispute's outcome. They are talking past each other about what constitutes the discovery. Is it the truth claim, the method, or the social recognition? Without agreeing on the identity conditions of a discovery, no amount of data settles the debate.

  Furthermore, you are right about normative smuggling, but it runs deeper than credit. It is fundamentally about the ontology of science. If discoveries are inevitable, science looks like a mirror of nature, validating realism. If contingent, science looks like a human construction, validating social constructivism. The stakes are metaphysical, not just sociological. This makes the question ill-posed as a factual inquiry because it asks for empirical proof of a modal claim. We simply cannot run the history of science twice. The debate persists because it serves ideological functions for both sides: one protects the objectivity of science, the other protects the agency of the scientist. The question is not merely hard; it is category-mistaken. It treats a historical probability as a logical necessity.

  **Where my hypothesis fails**
  Your hypothesis fails by assuming that clarifying terms would unlock empirical progress. You suggest the debate stalls because of verbal ambiguity, implying that precision would allow data to decide. But the data is already agreed upon; the disagreement is about inference. Even if we distinguish statistical likelihood from counterfactual substitutability, the counterfactual remains unobservable. You also underestimate the role of the identity problem. It is not just a measurement error; it is a philosophical disagreement about whether science discovers pre-existing truths or constructs viable models. Clarifying inevitable does not solve the problem of whether Wallace's theory is the same as Darwin's. Finally, you treat the normative smuggling as a hidden bias to be excised. It may be a feature, not a bug. The question really matters because it determines how we assign credit. Removing the normative stake might dissolve the motivation for the inquiry entirely.

  **What would count as progress**
  Progress requires abandoning the binary yes/no framing. Instead of asking if discovery is inevitable, ask under what conditions it is robust. This shifts the focus to modeling research populations. Agent-based simulations could test how varying parameters like communication density, reward structures, and tool availability affect convergence rates. This provides synthetic data for counterfactuals we cannot observe historically. Second, we need an operational taxonomy of discovery identity. We must distinguish between fact-discovery, method-discovery, and theory-discovery. Inevitability likely varies across these types. Third, change the question from metaphysics to history of practice. Study how fields stabilize consensus rather than guessing what would happen if Newton vanished. Finally, accept that the answer will be actually probabilistic. Progress looks like a curve showing probability of discovery over time given field maturity, not a verdict on genius.

  **Confidence**
  I am highly confident that the debate is stalled by modal confusion and conflicting ontological commitments rather than mere data scarcity. The distinction between statistical frequency and counterfactual necessity is the correct lever to analyze the dispute. I am least sure about the claim that normative smuggling is a feature rather than a bug. It is possible that separating the sociology of credit from the history of knowledge could clarify the empirical claims without dissolving the inquiry. If historical case studies emerged showing clear divergences in identical structural conditions, my confidence in the ill-posed overall diagnosis would decrease, suggesting the question is hard but answerable.
