  # Project Proposal: Distinguishing Mechanisms in Analogical Reasoning
  ## A Process-Level Critique of the Copycat Architecture

  ### 1. Introduction and Problem Statement

  The evaluation of cognitive architectures has long struggled with the problem of equifinality: distinct underlying mechanisms can produce identical behavioral outputs. In the domain of computational cognitive science, this problem is particularly acute in models of high-level perception and analogy. The canonical example is the Copycat model, developed by Douglas Hofstadter and Melanie Mitchell in the 1990s. Copycat solves letter-string analogy problems (e.g., *abc → abd :: xyz → ?*) using a sub-symbolic architecture characterized by a "parallel terraced scan." In this framework, swarms of microscopic agents called "codelets" probabilistically build and destroy perceptual structures in a Workspace, guided by a semantic network called the Slipnet. A dynamic temperature parameter regulates the system's randomness: as the system finds better structures, temperature drops, reducing noise and crystallizing the solution.

  The standard validation for Copycat rests on distributional fit. When run multiple times on a single problem, Copycat does not produce a single deterministic answer; rather, it produces a probability distribution over possible answers (e.g., 70% *wyz*, 20% *xyd*, 10% *wzz*). This distribution is compared to aggregated human response data. If the model's distribution matches the human distribution, the architecture is deemed cognitively plausible. The inference is that the micro-structure (codelets, temperature, slipnet) is responsible for the macro-behavior (the answer distribution), and therefore, matching the macro-behavior validates the micro-structure.

  This project proposes that this inference is logically unsound. Matching output distributions is a necessary condition for cognitive plausibility, but it is not sufficient. A fundamentally different architecture—for example, a serial search algorithm with fitted noise parameters—could potentially be tuned to produce the exact same output distribution without possessing the specific cognitive mechanisms Copycat claims to model (parallelism, temperature-driven exploration, emergent structure). If a simpler or architecturally distinct model can match the output data, the specific claims about *how* humans reason (via parallel terraced scans) remain unsupported by the evidence currently cited.

  The central question of this project is stated as follows: **Can we identify process-level statistical signatures in the search trajectory that distinguish a parallel terraced scan architecture from a fitted serial search model, even when both models produce identical output answer distributions?**

  This question admits a determinate answer. It is not asking whether Copycat is "true" in a holistic sense, but whether the specific claim of *architectural necessity* holds up under process-level scrutiny. The answer will take the form of a set of metrics (e.g., entropy of the workspace over time, distribution of computation steps per solution) where the two architectures diverge. If such metrics exist, the current evaluation method for Copycat is insufficient. If no such metrics exist, it suggests that the specific mechanism of the parallel terraced scan is behaviorally opaque at the process level, which is itself a significant theoretical finding regarding the underdetermination of cognitive models.

  This proposal outlines a one-semester side project designed to investigate this question. The output will be a workshop paper of approximately 4000 words, suitable for venues focused on computational creativity, cognitive modeling, or the philosophy of AI. The project does not require new human subject data, which would be prohibitive in a one-semester timeline; instead, it relies on model-to-model comparison to establish the theoretical distinguishability of the mechanisms.

  ### 2. Why Existing Defenses Do Not Settle the Question

  To justify this project, we must understand why the existing defenses of the Copycat model fail to address the problem of equifinality. The primary defense of Copycat, as articulated in Mitchell's *Copycat: A Computer Model of High-Level Perception and Analogy-Making*, relies on the "crux" of the temperature mechanism. The argument is that the temperature is not a free parameter fitted to data, but an emergent property of the system's satisfaction with its current structures. When the system is confused, temperature is high, allowing wild explorations (codelets acting randomly). As coherent structures form, temperature cools, locking in the solution.

  Defenders argue that this dynamic explains *why* the distribution looks the way it does. For instance, rare answers correspond to runs where the temperature stayed high longer, allowing unlikely codelets to fire. Common answers correspond to runs where the system cooled quickly around a salient structure. The defense posits that a simple stochastic generator could not replicate this without the specific feedback loop between Workspace quality and Temperature.

  However, this defense conflates *internal coherence* with *external distinguishability*. Just because the temperature mechanism makes sense internally does not mean its effects are unique. A competing model could utilize a different control mechanism—for example, a fixed-depth serial search with a probabilistic restart policy—that mimics the effects of "cooling" without actually implementing a temperature variable. If this null model is tuned to match the output frequencies of Copycat (and by extension, humans), the original claim that "Temperature is necessary to explain the distribution" is weakened.

  Furthermore, the existing evaluation focuses almost exclusively on the *final state* of the Workspace (the answer). It ignores the *trajectory* taken to reach that state. In dynamical systems theory, two systems can converge to the same attractor (the answer) via vastly different phase space trajectories. Copycat's parallel terraced scan implies a specific trajectory: a period of high entropy and fragmentation followed by a rapid collapse into order as temperature drops. A serial search model implies a different trajectory: a linear accumulation of evidence or a step-wise reduction of search space.

  Existing defenses do not settle the question because they have never subjected these trajectories to comparative analysis. The literature treats the match between model output distribution and human answer frequencies as the "gold standard." There is no established baseline for what constitutes process-level evidence in this domain. By accepting distributional fit as sufficient, the field risks validating architectures based on curve-fitting rather than mechanistic fidelity. This project challenges that acceptance by demanding evidence that is sensitive to the *process*, not just the *product*.

  Moreover, the reliance on human data for validation introduces a confound. Human data in letter-string analogies is typically aggregated from many participants. This aggregation washes out individual process differences. One participant might solve *xyz* via a serial rule application; another might via holistic perception. The aggregated distribution looks like a single curve, but it might be a mixture of processes. Copycat claims to model the *individual* cognitive mechanism, but it is graded on *population* data. A model-to-model comparison bypasses this noise. By comparing Copycat to a defined null model, we isolate the architectural variables without the variability of human subjects.

  Therefore, the existing defenses are insufficient because they rely on an underdetermined metric (output distribution) and fail to utilize available process traces (internal logs) to distinguish between competing architectural hypotheses. This project fills that gap.

  ### 3. Methodology and Weekly Plan

  The project will be executed over a standard 14-week semester. The goal is not to build a new model of analogy from scratch, which would be impossible in the timeframe, but to utilize existing open-source implementations of Copycat and construct a specific "Null Model" competitor. The work is divided into four phases: Setup, Null Model Construction, Simulation & Metric Definition, and Analysis & Writing.

  **Data Source Consideration:**
  A critical design choice is whether the discriminating data must come from humans or can come from the model itself. Collecting process-level human data (e.g., mouse-tracking, eye-tracking, or think-aloud protocols during letter-string analogy tasks) is ethically complex, time-consuming, and prone to high variance. For a one-semester side project, relying on human process data introduces a single point of failure: if recruitment fails or the data is noisy, the project stalls.
  Therefore, this project argues that the discriminating data can and should come from the **models themselves**. The objective is to demonstrate *theoretical distinguishability*. If we can show that Copycat and a Serial Search model produce identical output distributions but diverge significantly on internal process metrics, we have proven that output distributions are insufficient for validation. Whether humans match Copycat's process metrics is a secondary empirical question for future work. The workshop paper will argue that *until* we have process metrics that distinguish the models, we cannot claim the human data validates the architecture. Thus, the primary data is simulation logs from the two competing architectures.

  **Week-by-Week Schedule:**

  **Weeks 1-2: Literature Review and Codebase Acquisition**
  *   **Tasks:** Deep dive into Mitchell's thesis and subsequent critiques of Copycat. Locate and verify an open-source implementation of Copycat (e.g., the Java or Python ports available in public repositories).
  *   **Deliverable:** A working local instance of Copycat that can run the standard set of 20 benchmark problems (e.g., *abc → abd :: xyz → ?*) and log internal states.
  *   **Risk Mitigation:** If the code is obsolete, the scope shifts to a simplified re-implementation of the core "codelet" loop without the full GUI or Slipnet complexity, focusing only on the Workspace dynamics.

  **Weeks 3-5: Construction of the Null Model (Noisy Serial Search)**
  *   **Tasks:** Design and implement the competitor. This will not be a "dumb" random generator, but a "fitted" adversary.
      *   *Architecture:* A serial search that proposes one transformation rule at a time.
      *   *Fitting:* The model will be tuned to match Copycat's output distribution on the benchmark problems. This is crucial. If the Null Model cannot match the frequencies, the comparison is invalid. We must ensure both models arrive at *wyz* 70% of the time, etc.
      *   *Mechanism:* It will use a probability table derived from Copycat's average output to weight its serial choices, effectively simulating the "result" without the "process."
  *   **Deliverable:** A Python script that runs the Null Model and verifies its output distribution matches Copycat's within a statistical tolerance (e.g., Chi-Square test p > 0.05).

  **Weeks 6-8: Defining Process Metrics**
  *   **Tasks:** Identify the signatures of a "Parallel Terraced Scan" vs. "Serial Search."
      *   *Metric 1: Entropy Trajectory.* Copycat should show high workspace entropy early, dropping sharply as temperature cools. Serial search should show linear or step-wise entropy reduction.
      *   *Metric 2: Codelet/Step Efficiency.* Measure the ratio of "constructive" actions to "destructive" actions over time.
      *   *Metric 3: Time-to-Solution Distribution.* Parallel systems often show different variance in completion time compared to serial systems. We will analyze the distribution of computational cycles required to reach a solution.
  *   **Deliverable:** A defined set of 3-5 mathematical metrics extracted from the simulation logs.

  **Weeks 9-11: Simulation and Data Collection**
  *   **Tasks:** Run both models extensively.
      *   For each of the 20 benchmark problems, run 1,000 trials for Copycat and 1,000 trials for the Null Model.
      *   Log the process metrics defined in Weeks 6-8 for every trial.
      *   Ensure output distributions remain matched (re-calibrate Null Model if drift occurs).
  *   **Deliverable:** A clean dataset (CSV/SQL) containing trial ID, Model Type, Problem, Answer, and Process Metrics.

  **Weeks 12-13: Analysis and Visualization**
  *   **Tasks:** Statistical comparison.
      *   Use Kolmogorov-Smirnov tests to compare the distributions of the process metrics.
      *   Generate visualizations: Overlay the entropy trajectories of both models. If the lines separate clearly, we have our evidence.
      *   Draft the results section.
  *   **Deliverable:** Figures and statistical tables ready for the paper.

  **Week 14: Writing and Final Polish**
  *   **Tasks:** Assemble the paper. Ensure the argument flows from the philosophical problem (underdetermination) to the technical solution (process metrics) to the implication (re-evaluating cognitive plausibility).
  *   **Deliverable:** Final 4000-word workshop paper.

  ### 4. Expected Results and Criteria for Success/Failure

  The success of this project is not contingent on "disproving" Copycat. Copycat is a landmark model, and its mechanisms are intuitively compelling. The success of the project is contingent on the *clarity of the distinction* drawn between output-level and process-level evaluation.

  **Scenario A: Strong Distinguishability (Success)**
  The most favorable outcome is that the Null Model matches Copycat's output frequencies perfectly but diverges significantly on process metrics. For example, Copycat's entropy trajectory might show a characteristic "hockey stick" curve (high chaos, sudden order), while the Serial Search shows a linear decline.
  *   *Implication:* This proves that output distributions underdetermine the mechanism. The paper would argue that future evaluations of analogy models must include process tracing, not just answer frequencies. This is a strong methodological contribution.
  *   *Paper Angle:* "The Mask of Distributional Fit: Why Analogical Models Need Process Traces."

  **Scenario B: Weak Distinguishability (Partial Success)**
  The models differ on some metrics but overlap on others. For instance, Time-to-Solution might differ, but Entropy Trajectories might look similar.
  *   *Implication:* This suggests that some process features are unique to the architecture, while others are emergent properties of any search system solving this constraint satisfaction problem.
  *   *Paper Angle:* "Identifying Architectural Signatures in Analogical Search." The paper would focus on which metrics are robust discriminators and which are not.

  **Scenario C: Indistinguishability (Theoretical Success)**
  The Null Model matches Copycat on output *and* on all proposed process metrics.
  *   *Implication:* This is actually a profound negative result. It would suggest that the "Parallel Terraced Scan" is computationally equivalent to a "Fitted Serial Search" in this domain. If a simple serial model can mimic the complex dynamics of Copycat completely, then the complexity of Copycat may be gratuitous.
  *   *Paper Angle:* "The Equivalence of Search Strategies in Letter-String Analogy." This challenges the necessity of the sub-symbolic approach.
  *   *Note:* This counts as success because it answers the determinate question: "Can we distinguish them?" Answer: "No, not with these metrics." That is a valid scientific finding.

  **Criteria for Project Failure**
  The project would only be considered a failure if:
  1.  **Technical Infeasibility:** The open-source Copycat code is unusable and cannot be repaired or simplified within the first three weeks.
  2.  **Fitting Failure:** The Null Model cannot be tuned to match Copycat's output distribution. If the Null Model produces wildly different answer frequencies, the comparison is invalid (comparing apples to oranges). However, this outcome is unlikely given the flexibility of stochastic fitting.
  3.  **Ambiguity:** The process metrics are so noisy that no statistical signal can be found, and the cause of the noise cannot be diagnosed.

  To mitigate technical failure, the project scope includes a "Lite" version of Copycat. If the full Slipnet/Codelet architecture is too buggy to deploy, I will implement a simplified "Agent-Based" version that captures the essence (parallel probabilistic rule application) without the legacy code baggage. To mitigate fitting failure, the Null Model will use a lookup table based on Copycat's own pilot run data, ensuring the output marginals are identical by definition, forcing the comparison to rest entirely on the *process* of arriving at those outputs.

  ### 5. Scope Assessment and Risks

  This proposal is designed as a one-semester side project, meaning it must coexist with other academic obligations. The primary risk is scope creep, specifically regarding the complexity of the models.

  **Risk 1: Re-implementation Burden**
  Copycat is a complex system. Attempting to understand and modify the original Lisp or Java code could consume the entire semester.
  *   *Mitigation:* I will not modify the core Copycat logic. I will treat it as a "black box" executable that produces logs. The effort will focus on the *analysis pipeline* and the *Null Model*, which I will write from scratch in Python. This isolates the risk: if Copycat breaks, I still have the Null Model and can simulate a "Mock Copycat" based on literature descriptions for the sake of the methodological argument.

  **Risk 2: The "Human Data" Temptation**
  It may be tempting to try to collect human reaction time data to validate the process metrics.
  *   *Mitigation:* I will strictly adhere to the model-to-model comparison plan. Human data will be mentioned only in the "Discussion/Future Work" section. Adding human subjects requires IRB approval and recruitment time, which violates the "one-semester side project" constraint. The theoretical point stands without human data: if the models are distinguishable, then human data is *required* to pick the winner. If the models are indistinguishable, human data won't help distinguish the mechanisms anyway.

  **Risk 3: Word Count and Depth**
  Producing a 4000-word paper requires substantial analysis. A simple "Model A differs from Model B" is not enough.
  *   *Mitigation:* The paper must engage with the philosophy of cognitive science. It needs to contextualize the finding within the broader debate on computational functionalism. Does the physical (or computational) substrate matter if the input-output mapping is identical? By framing the technical results within this philosophical context, the paper gains the necessary weight and length. I will dedicate significant space to defining "Process-Level Evidence" rigorously, drawing parallels from psycholinguistics (e.g., garden-path sentences) where process data overturned output-based theories.

  **Risk 4: Statistical Power**
  Generating enough simulation runs to get smooth distributions for process metrics can be computationally intensive.
  *   *Mitigation:* Letter-string analogy problems are computationally cheap. 1,000 runs per problem should take minutes on a modern laptop. I will script the batch processing early (Week 6) to run overnight, ensuring data is ready for Week 9.

  ### 6. Conclusion

  The Copycat model remains one of the most evocative demonstrations of artificial creativity. However, its evaluation methodology is stuck in a behaviorist paradigm that prioritizes output matching over mechanistic transparency. In an era where "black box" AI systems are increasingly scrutinized for their internal reasoning, it is ironic that cognitive models are still permitted to hide behind distributional fit.

  This project offers a targeted, feasible intervention. By constructing a fitted Null Model and comparing process trajectories, we can test whether the "Parallel Terraced Scan" leaves a unique fingerprint. The project is scoped to be completed in one semester by leveraging existing code and focusing on analysis rather than new model development. It avoids the pitfalls of human subject research while making a stronger theoretical claim: that we cannot know if a model thinks like a human until we can distinguish how it thinks from how a simpler machine might fake it.

  The resulting workshop paper will not merely critique Copycat; it will propose a new standard for evaluating cognitive architectures. It will argue that distributional fit is the baseline, not the ceiling. Whether the result shows that Copycat is unique or redundant, the act of asking the question moves the field toward more rigorous standards of evidence. This makes the project high-reward: even a negative result (indistinguishability) challenges the necessity of complex sub-symbolic architectures, while a positive result (distinguishability) provides a new toolkit for model validation.

  The timeline is aggressive but realistic, provided the discipline is maintained to avoid expanding into human data collection or full model re-engineering. The focus remains on the *comparison metric*. This is a project about measurement, not just modeling. By refining the ruler we use to measure cognitive plausibility, we contribute to the foundation of the field, ensuring that future claims about "human-like" AI are backed by evidence that goes deeper than the surface of the answer key.

  ### 7. Detailed Elaboration on the Methodological Innovation

  To ensure the paper reaches the required depth and word count, it is necessary to elaborate further on the specific nature of the "Process Metrics" in Section 3, as this is the core technical contribution.

  **The Entropy Metric:**
  In Copycat, the Workspace is a collection of descriptions (e.g., "successor," "same," "leftmost"). Early in a run, codelets propose conflicting descriptions. The Workspace is "hot" and disordered. As the Slipnet activates consistent concepts, codelets reinforce compatible descriptions and destroy incompatible ones. The "Temperature" drops.
  *   *Hypothesis:* A plot of Workspace Entropy (Shannon entropy of the description types present) vs. Computational Cycle should show a convex curve for Copycat. It starts high, stays high during exploration, and drops precipitously when a "strong" structure forms.
  *   *Null Model:* A serial search typically commits to a path. Its entropy should decrease monotonically or linearly. It does not "explore" in parallel; it "prunes" serially.
  *   *Significance:* If Copycat shows the convex curve and the Null Model does not, we have a signature of parallelism.

  **The "Destruction" Ratio:**
  Copycat explicitly allows codelets to *break* structures. This is a key feature of the terraced scan—bad ideas are actively dismantled.
  *   *Hypothesis:* The ratio of "Build" actions to "Break" actions should vary with Temperature. High temperature = more breaking.
  *   *Null Model:* A standard serial search rarely "breaks" a committed step; it backtracks. Backtracking is computationally different from active destruction.
  *   *Significance:* Logging the frequency of destructive operations provides a trace of the system's willingness to revise beliefs, a key cognitive trait.

  **The "Aha!" Moment Distribution:**
  Humans report "Aha!" moments in analogy making—a sudden insight. Copycat claims to model this via the temperature crash.
  *   *Hypothesis:* The derivative of the Temperature curve should show a sharp spike (rapid cooling) correlated with solution discovery.
  *   *Null Model:* A stochastic searcher finds solutions when it stumbles on them. The "discovery" is not preceded by a systemic phase shift.
  *   *Significance:* This links the internal metric to a phenomenological human experience, strengthening the cognitive plausibility argument if Copycat matches it and the Null Model does not.

  By detailing these specific metrics in the paper, the project moves beyond vague philosophical critique into concrete computational experimentation. This level of detail ensures the 4000-word limit is filled with substantive technical content rather than rhetorical padding.

  ### 8. Final Reflections on Feasibility

  Is this too big for one semester?
  If I attempt to re-implement the Slipnet's activation dynamics from scratch, yes.
  If I attempt to recruit 50 human participants for a control study, yes.
  If I attempt to solve the philosophical problem of underdetermination completely, yes.

  But the proposal limits the scope to:
  1.  **Use existing Copycat code:** (Weeks 1-2).
  2.  **Build a simple fitted competitor:** (Weeks 3-5).
  3.  **Compare logs:** (Weeks 6-11).

  This is effectively a data analysis project wrapped in a cognitive modeling context. The heavy lifting is in the statistical comparison of the logs. This is well within the range of a skilled graduate student's side project. The key is to resist the urge to "improve" Copycat or make the Null Model "smarter." The Null Model *must* be dumb but fitted. Its stupidity is the point. If a dumb model matches the smart model's output, the smart model's complexity is questioned. If the smart model's process is unique, its complexity is justified.

  The project is designed to be "fail-safe."
  *   If Copycat code works: Great, run the comparison.
  *   If Copycat code fails: Use the literature to simulate "Expected Copycat Behavior" and compare the Null Model to that theoretical baseline. The paper becomes a theoretical proof rather than an empirical simulation, which is still valid for a workshop.
  *   If metrics don't distinguish: Publish the negative result (Scenario C).

  This robustness makes it a viable candidate for a one-semester timeline. The deliverable is not a perfect model, but a rigorous argument supported by whatever data can be gathered in 14 weeks. The emphasis is on the *design of the comparison*, which is the novel contribution.

  In summary, this proposal addresses a foundational weakness in the evaluation of analogical AI. It proposes a concrete, time-bound method to investigate that weakness. It defines success and failure clearly. It avoids the bottlenecks of human subject research. It results in a paper that contributes to both the specific domain of analogy and the general domain of cognitive architecture evaluation. It is, therefore, a sound and valuable project.
