answer: |-
  ### Mechanism Brainstorming

  Before settling on the design, here are three ways to handle the **Clock/Time** and **Asymmetry** constraints.

  1.  **The Physical Trireme:** A paper ship moves across the whiteboard every 10 minutes. If it reaches "Lesbos" before the vote, the massacre happens automatically.
      *   *Tradeoff:* High visual tension, but binary outcome. It doesn't penalize *delay* if they still win; it just kills everyone. It fails to capture the "cost of deliberation" if they succeed.
  2.  **The Decaying Pool:** Start with 100 "Lives" on the board. Every 10 minutes, erase 10 lives. If the vote passes, the remaining lives are "saved." If it fails, all die.
      *   *Tradeoff:* Quantifiable success, but students might rush too hard, sacrificing the quality of debate. Doesn't inherently build in the *asymmetry* of argumentation.
  3.  **The "Corruption Tax" & "Motion Cost" (Winner):**
      *   *Clock:* Every 15 minutes, a "Trireme Interval" passes. 5 Lives are automatically lost from the total saveable pool.
      *   *Asymmetry:* To speak, Moderates must pay an "Influence Chip"; Hardliners speak for free.
      *   *Why:* This hits all three features. The clock creates urgency (Feature 2). The chip cost creates the asymmetry (Feature 3). The Life Pool ensures the vote margin matters (Feature 1).

  ---

  # Simulation Design: *The Second Trireme*

  **Class Size:** 18 Students
  **Time:** 75 Minutes
  **Materials:** Whiteboard, 3 sets of Role Cards (colored paper), 40 Poker Chips (or paper slips), Timer projected on screen.

  ## 1. The Setup (5 Minutes)
  *   **The Board:** Draw a vertical bar on the whiteboard labeled "Mytilenean Lives." Mark it 0 to 100. Start a marker at 100.
  *   **The Trireme Timer:** Project a countdown timer for 75 minutes. Mark three "Intervals" on the board at T-60, T-45, T-30.
  *   **Distribution:** Hand out Role Cards face down. Tell them: *"Do not show your card to anyone. Follow your instructions exactly. If your card says you have a resource, you have it. If it doesn't, you don't."*

  ## 2. Role Blocs (18 Students)

  **A. The Hardliners (Cleon Bloc) — 5 Students (Red Cards)**
  *   **Goal:** Persuade the Assembly that executing the Mytilenians is necessary for imperial security.
  *   **Privilege:** **Unrestricted Speech.** You may speak at any time without cost.
  *   **Advantage:** You are presumed patriotic. No one can question your motives.
  *   **Strategy:** Argue that leniency looks like weakness. Other cities will rebel if Athens is soft.

  **B. The Moderates (Diodotus Bloc) — 5 Students (Blue Cards)**
  *   **Goal:** Persuade the Assembly to reverse the decree.
  *   **Constraint:** **The Credibility Tax.** To speak in the Assembly, you must pay **1 Influence Chip** to the Instructor. If you have no chips, you cannot speak (you are presumed "compromised" or "soft").
  *   **Starting Resources:** 2 Influence Chips each.
  *   **Strategy:** Argue that mass killing is *strategically stupid*. It makes enemies fight harder. (NO appeals to pity/justice in Round 1).

  **C. The Demos (Swing Voters) — 8 Students (White Cards)**
  *   **Goal:** Vote based on what benefits Athens. You hold the majority.
  *   **Resources:** 3 Influence Chips each.
  *   **Hidden Instruction:** Look at the bottom of your card.
      *   3 of you are **Lean Hard** (Need to hear 2 Hardline arguments to vote Save).
      *   3 of you are **Lean Soft** (Need to hear 2 Moderate arguments to vote Save).
      *   2 of you are **True Swings** (Will vote for whoever speaks last/most convincingly).
  *   **Power:** You can use chips to **Call for Information**. If 3 Demos pool chips (3 total), you can ask the Instructor a factual question about Lesbos. *Cost:* **5 Lives** are immediately erased from the Whiteboard for the delay.

  ## 3. Rules of Engagement (Read Aloud by Instructor)

  1.  **The Decree:** The First Trireme left yesterday. It carries the order to kill all adult males. The Second Trireme is being prepped *now* to countermand it.
  2.  **The Clock:** Every 15 minutes (at 60, 45, 30 remaining), the First Trireme gets closer. **5 Lives are erased from the board.** If the timer hits 0:00 before a vote is finalized, the First Trireme arrives. **Game Over. All die.**
  3.  **Speaking:** Raise your hand. Instructor recognizes you.
      *   *Constraint:* **Round 1 (First 30 mins):** No arguments from "Justice," "Mercy," or "Gods." Only **Expediency** (What helps Athens?). If you argue pity, the Instructor will cut you off and you lose your turn (and chips if Moderate).
  4.  **Voting:** At any point, a Demo can call "Vote." Requires a second. Voting takes 5 minutes.
  5.  **Winning:**
      *   If Vote = **Execute:** 0 Lives Saved.
      *   If Vote = **Spare:** Whatever number is on the Board when the vote is called is your score.
      *   *Note:* Moderates need a high score to "win." Hardliners win if the score is low or if the vote fails.

  ## 4. Minute-by-Minute Timeline

  | Time | Phase | Action | Clock Mechanism |
  | :--- | :--- | :--- | :--- |
  | **00-05** | **Setup** | Distribute cards. Explain rules. **Do not explain the Chip Asymmetry.** Let them discover it when Moderates try to speak. | Timer Starts (75:00) |
  | **05-35** | **Debate I** | Open floor. **Enforce "Expediency Only" strictly.** Cut off pity arguments. Watch Moderates run out of chips. | **T-60:** Erase 5 Lives (95 left) |
  | **35-45** | **Caucus** | Students break into blocs (5 mins) then mixed (5 mins). Moderates will beg Demos for chips or try to speak fast. | **T-45:** Erase 5 Lives (90 left) |
  | **45-55** | **Debate II** | Final arguments. Constraints lifted (Pity allowed now). Moderates may be silent if out of chips. | |
  | **55-60** | **The Vote** | Secret ballot (slips of paper). Count aloud. | |
  | **60-75** | **Debrief** | Map simulation events to Thucydides text and historical reality. | **T-30:** (If vote dragged) Erase 5 Lives |

  ## 5. Scoring & Incentives

  *   **No Real Money:** Use "Civic Crowns" (paper slips).
  *   **Hardliners:** Win if the Vote is Execute OR if Lives Saved < 50.
  *   **Moderates:** Win if Vote is Spare AND Lives Saved > 70.
  *   **Demos:** Win if they vote with the Majority (safe choice) OR if they successfully call for Info that changes the vote (risk choice).
  *   **The Catch:** Moderates start with 10 chips total (2 each). They speak 5 times, they have 5 left. If they speak too much, they are silenced by the rules *before* the vote happens. This forces them to choose: Speak now and risk silence later, or save chips and risk losing the argument.

  ---

  # The Debrief (15 Minutes)

  *Do not lecture. Ask these questions in order to map their experience to the text.*

  1.  **The Asymmetry (Feature 3):** "Moderates, raise your hand if you were cut off or ran out of chips. Hardliners, did anyone question your patriotism?"
      *   *Map to Text:* Connect this to Diodotus's opening line: *"I have never yet been benefited by a previous speaker... nor have I been harmed."* He acknowledges the suspicion against him. Discuss how Cleon frames severity as "sincerity" and moderation as "bribery."
  2.  **The Clock (Feature 2):** "Look at the board. We started at 100. We ended at [X]. How many died just because we were talking?"
      *   *Map to Text:* The First Trireme was already at sea. Thucydides emphasizes the *haste*. Discuss how democracy requires time, but empire requires speed. The "Motion for Information" cost lives—just as seeking clarity in war often costs opportunity.
  3.  **The Precariousness (Feature 1):** "Reveal your Demo cards. How many of you were actually going to vote Execute until the last minute?"
      *   *Map to Text:* Thucydides says the vote was "close" (*paralagon*). It wasn't a landslide for mercy. It was a tactical shift by a slim margin.
  4.  **The Coldness (Constraint):** "Why did I ban pity arguments in Round 1? Did it feel wrong?"
      *   *Map to Text:* Diodotus explicitly says, *"We are not holding a court of law... we are debating interests."* He saves them not because they *deserve* it, but because killing them is *useless* to Athens. The humane outcome arrived via a cold calculation.
  5.  **The Historical Reality (The Kicker):** "In the simulation, if you voted Spare, everyone lived. In history, the Assembly voted to spare the *demos*, but they executed the 1,000 ringleaders they had already shipped to Athens. Then they pulled down the walls and took the fleet."
      *   *Point:* The reversal wasn't a moral awakening. It was a strategic adjustment. The violence didn't stop; it was just calibrated.

  ---

  # Honest Critique: What Will Go Wrong & What You Can't Simulate

  ### 1. What Will Go Wrong (Steering Required)
  *   **The Chip Stall:** Moderates may realize the rig is stacked and go silent immediately to "save" their score.
      *   *Steer:* If Moderates go silent, step in as the *Proedroi* (Chair). *"The Assembly grows quiet. Does anyone else wish to speak on the strategic implications?"* Prompt specific students: *"Student X, you represent the naval interests. Does this argument hold?"*
  *   **The Pity Leak:** Students will inevitably say, "But it's immoral to kill them."
      *   *Steer:* Do not lecture. Just enforce the rule mechanically. *"That argument is out of order for Round 1. Please reframe as strategic interest or yield the floor."* Make it a bureaucratic hurdle, not a moral one.
  *   **The Demo Passivity:** Swing voters might wait for others to do the work.
      *   *Steer:* Remind them their scoring depends on being in the Majority *and* accuracy. If they don't ask questions, they might vote wrong.

  ### 2. What You Cannot Simulate (Supply This Yourself)
  *   **The Fear of Violence:** In the simulation, losing means a lower score. In Athens, losing meant civil war, plague, and Spartan invasion. The *stakes* were existential in a way a seminar cannot replicate. You must articulate this in the debrief: *"You felt pressure because of a timer. They felt pressure because the Spartans were at the gate."*
  *   **The Scale of Complicity:** 18 students can track their votes. In the Pnyx, 6,000+ citizens voted. The diffusion of responsibility was massive. No single Athenian felt the weight of the "1,000 ringleaders" execution the way your students will feel the "5 lives" erased on the board.
  *   **The Aftermath:** The simulation ends at the vote. You must explain that the "mercy" was partial. The walls came down. The empire tightened its grip. Diodotus saved the many, but the logic of empire (which Cleon represented) remained intact. The system didn't change; the calculation did.

  ### 3. The "Rigged" Feeling
  *   *Risk:* Students may feel the Moderate disadvantage is unfair.
  *   *Mitigation:* Acknowledge it in the debrief. *"It was unfair. That is the point. Thucydides is showing you that in a crisis, the demagogue has the structural advantage. The moderate has to work twice as hard to prove they aren't a traitor."* This turns their frustration into the learning objective.
