prompt: |-
  So, no science background here, never took a psych class, but a passenger of mine started talking about predictive processing and the free energy stuff about a year ago and I've been reading around it ever since, and it's kind of rewired how I think about what I actually do for a living. I'm a flight instructor, mostly instrument students, twelve of them at the moment, and I fly with each one two or three times a week. A huge chunk of the job is teaching people not to believe their own body once the horizon goes away — the leans, that turn-and-roll feeling that isn't there, the night departure over the water or over unlit terrain where your inner ear is dead certain you're pitching up into a stall when you're really nose-down and gathering speed.

  The standard spiel is "trust your instruments" and "keep the cross-check going," and it's not wrong, but it doesn't explain anything, and the students who need it most are the ones who nod along and then forty minutes later, tired and a little spooked, fly exactly what they feel. Which suggests to me that a slogan isn't competing with the body on the body's terms.

  The predictive processing picture seems to say something much more specific, and more useful: you never get the world raw, you get your model's guess, the senses mostly only speak up where the guess is wrong, and how much the guess versus the evidence gets to drive things depends on how reliable the brain currently rates each of them. If that's right, then the leans isn't a broken instrument in the head, it's my student's brain weighting a very confident wrong guess above weak noisy evidence — and there ought to be a drill that actually shifts that weighting, rather than one that just repeats a rule at them.

  Can you turn that into a procedure I could teach? Some constraints from my end:

  - It has to survive being briefed in about fifteen minutes before a flight, and it has to be runnable by a tired non-scientist in a cockpit, alone, later, when I'm not in the right seat.
  - Give it as ordered steps or checks, with the actual words to say out loud where speaking helps, and say what counts as having passed each one versus just gone through the motions.
  - Mark clearly where the procedure runs out and it's a judgment call that I or the student has to own — including anything that's really about values or risk appetite rather than about perception.
  - Tell me which distinctions from the theory have to survive the simplification because the drill breaks without them, which ones you dropped as decoration, and — this is the part I really want — where the theory is not doing any work at all and I'd get the same result from ordinary instruction. I'd rather know that than have it dressed up in fancy language.

  Then run it on three cases:

  1. A student in the sim who is genuinely, sincerely level in a coordinated bank and reports feeling perfectly fine, and won't believe the attitude indicator.
  2. A pilot who's been hand-flying, then engages the autopilot on a long night leg, and eight minutes later the aircraft starts doing something he did not expect and did not command.
  3. A case where the procedure gives an answer I don't want — I'm thinking something like the pitot or the static side icing up so that several instruments all agree on the same false story, which is exactly the situation where "trust your instruments" is the wrong advice. Show me what the procedure says there and whether it can even detect that it's being fooled.

  One more thing: please don't hand me a reading list or name papers and researchers at the end. I can't chase any of that down and I wouldn't trust myself to get the names right anyway. Just use the ideas well and tell me where they stop applying.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Flight Instructor (CFII likely), 12 instrument students, flies 2-3 times/week. No science/psych background but interested in Predictive Processing (PP) / Free Energy Principle (FEP).
      *   **Problem:** Standard "trust your instruments" advice fails because it doesn't address *why* the body feels wrong. Students revert to proprioception/vestibular senses under stress/fatigue.
      *   **Goal:** Convert PP theory into a practical, 15-minute briefable, cockpit-runnable procedure for students.
      *   **Constraints:**
          *   Ordered steps/checks.
          *   Specific verbal scripts ("actual words to say").
          *   Pass/fail criteria for each step.
          *   Clear boundaries where procedure ends and judgment begins.
          *   **Crucial:** Distinguish which theoretical distinctions are essential vs. decoration vs. where theory adds no value.
          *   **Test Cases:** Apply to 3 specific scenarios (Sim bank disbelief, Autopilot surprise, Instrument failure/icing).
          *   **Negative Constraint:** No reading lists or academic citations.

  2.  **Deconstruct Predictive Processing (PP) for Aviation:**
      *   *Core Concept:* The brain is a prediction machine. It generates a model of the world. Sensory input is "prediction error."
      *   *Precision Weighting:* The brain decides how much to trust the prediction (prior) vs. the sensory input (likelihood) based on "precision" (reliability/confidence).
      *   *The Illusion:* In IMC (Instrument Meteorological Conditions), the vestibular system (inner ear) has high precision weighting (it feels *very* real) but low accuracy. The visual instrument input has low precision weighting (hard to read, counter-intuitive) but high accuracy.
      *   *The Fix:* You can't just say "look at the instrument." You must actively *down-weight* the body and *up-weight* the instruments. This requires active interrogation, not passive looking.
      *   *Action:* Action is used to minimize prediction error. If the model says "level" but instruments say "bank," the error persists until the model updates or the plane moves to match the model (which is dangerous). We need to force the model to update.

  3.  **Drafting the Procedure (The "Precision Check"):**
      *   *Name:* Needs to sound operational, not academic. "The Precision Weighting Protocol"? Too jargon-y. "The Reality Check"? Too generic. Let's go with "The Model-Data Lock" or simply "The P-Check" (Precision Check). Let's stick to descriptive: **The Sensory Weighting Protocol (SWP)**. Actually, let's make it more actionable: **The Active Disconfirmation Drill**. No, that sounds like a test. Let's call it **The Instrument Interrogation Protocol**.
      *   *Step 1: Acknowledge the Prediction.* Admit what the body feels. (Don't suppress it, acknowledge it).
      *   *Step 2: Isolate the Data.* Look at the instrument without moving the controls.
      *   *Step 3: Assign Precision.* Explicitly state which source is "noisy" (body) and which is "precise" (instrument).
      *   *Step 4: Act to Test.* Make a small input to see if the instrument reacts as predicted by the *instrument*, not the body.
      *   *Step 5: Commit.* Fly the instrument until the body catches up (or ignore the body).

      *Refining for the User's Constraints:*
      *   Needs to be 15 mins briefable.
      *   Needs spoken words.
      *   Needs pass/fail.

      *Revised Procedure: "The 3-Step Interrogation"*
      1.  **Name the Ghost:** State the bodily feeling.
      2.  **Lock the Reference:** Identify the single trusted instrument.
      3.  **Probe and Match:** Move controls to match the instrument, verify the change.

  4.  **Addressing the "Theory vs. Practice" Analysis:**
      *   *Essential Distinctions:* Prediction Error (the gap between feel and show), Precision Weighting (trusting one over the other actively), Active Inference (moving controls to test the model).
      *   *Decoration:* "Free Energy," "Hierarchical Bayesian Inference," "Minimizing Surprise."
      *   *No Value Add:* "Trust your instruments" (too passive), "Scan pattern" (mechanical only).

  5.  **Developing the Test Cases:**
      *   *Case 1 (Sim Bank):* Student feels level, AI shows bank. Procedure forces them to acknowledge the feeling but act on the AI. Pass = Bank corrected despite feeling wrong.
      *   *Case 2 (Autopilot Surprise):* AP does something weird. Prediction error spikes. Procedure prevents immediate fight. Pass = Disconnect AP or verify mode *before* yanking controls.
      *   *Case 3 (Pitot/Static Ice):* Instruments lie. This is the edge case. PP says "trust the high precision source." If all instruments agree (false precision), the procedure might fail *unless* there's a cross-check step included in "Lock the Reference." I need to ensure the procedure includes a "Consistency Check" among instruments before locking one. *Correction:* In PP terms, if the "sensory evidence" (instruments) is corrupted, the "prior" (knowledge of flight physics) should clash. The procedure needs a step for "Does this make physical sense?"

  6.  **Refining the Procedure for Case 3 (The Trap):**
      *   If the AI, HI, and VSI all lie together (static block), the "Instrument" source has high *apparent* precision but is wrong.
      *   PP solution: Introduce a third source of evidence (Power setting + Sound + Feel of G-load vs. VSI).
      *   I need to make sure the procedure doesn't blindly trust *one* instrument but trusts the *consensus* of reliable instruments over the body.
      *   *Modification:* Step 2 must be "Lock the *Cluster*," not just one instrument.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Validate the instructor's insight. It's spot on.
      *   *The Procedure:* "The Precision Interrogation."
          *   Step 1: State the Feeling (Label the Prediction).
          *   Step 2: State the Data (Label the Evidence).
          *   Step 3: The Micro-Test (Active Inference).
      *   *Theory Audit:* Be brutal about what's fluff.
      *   *Scenarios:* Walk through exactly what happens.
      *   *The Failure Mode (Case 3):* Be honest. PP doesn't solve sensor failure unless you have redundant models. The procedure needs a "Plausibility Gate."

  8.  **Final Polish:**
      *   Tone: Professional, direct, respectful of the instructor's expertise.
      *   Formatting: Clear headings, bullet points for steps.
      *   Check Constraints: No reading list? Check. 15 min brief? Check. Spoken words? Check.

      *(Self-Correction during drafting)*: In Case 3, if the pitot/static system fails, the "Instruments" become the "Wrong High-Precision Model." The body (feeling of G, engine sound) becomes the "Noisy but Independent Evidence." The procedure must explicitly allow reverting to "Physics/Power" if instruments conflict with basic energy state. I will add a "Plausibility Check" to Step 2.

      *(Refining the "Theory that doesn't work" section)*: I need to be careful not to dismiss standard instruction entirely. "Trust your instruments" is the *goal*, PP is the *mechanism* to achieve it. The distinction is passive obedience vs. active model updating.

      *(Refining the "Judgment Call" boundary)*: When to divert? When to declare emergency? That's risk management, not perception. I need to mark that line clearly.

  9.  **Final Review against constraints:**
      *   15 min briefable? Yes, 3 steps.
      *   Runnable by tired student? Yes, script provided.
      *   Pass/Fail criteria? Included.
      *   Theory audit? Included.
      *   3 Cases? Included.
      *   No reading list? Confirmed.

      *Let's write it.*
answer: |-
  This is a brilliant application of the theory. You have correctly identified that "trust your instruments" is a command, but predictive processing explains *why* the command fails: the brain is not a passive receiver; it is an active generator of reality. When the vestibular system screams "bank" with high confidence (high precision weighting), a passive glance at the attitude indicator (low precision weighting in that moment) cannot override it. You have to actively change the weighting.

  Here is the procedure, the theory audit, and the stress tests.

  ### The Procedure: "The Precision Interrogation"

  **Briefing Time:** 10–15 Minutes.
  **Goal:** To actively down-weight bodily sensation and up-weight instrument data during high prediction-error events.
  **Usage:** To be spoken aloud by the student when they feel confusion, disorientation, or surprise.

  #### Step 1: Name the Ghost (Label the Prediction)
  The student must explicitly state what their body is telling them. This acknowledges the prediction without accepting it as truth. It moves the feeling from "reality" to "hypothesis."

  *   **Action:** Stop control inputs. Hands off the yoke (if safe) or light grip.
  *   **Say Out Loud:** "My body says [insert sensation, e.g., 'we are climbing']."
  *   **Pass Criteria:** The sensation is specific (climbing, turning, falling), not vague ("I feel weird").
  *   **Fail Criteria:** Student says "I feel fine" when instruments show otherwise, or cannot articulate the sensation.

  #### Step 2: Lock the Reference (Assign Precision)
  The student identifies the specific instrument cluster that contradicts the body and declares it the higher-precision source. This is the active weighting shift.

  *   **Action:** Eyes fixed on the primary flight instruments (Attitude, Airspeed, Altimeter).
  *   **Say Out Loud:** "Instruments show [insert data]. Instruments are high precision. Body is noise."
  *   **Pass Criteria:** Student identifies at least two correlating instruments (e.g., Attitude Indicator + VSI, or AI + Airspeed).
  *   **Fail Criteria:** Student looks at the instruments but does not verbalize the conflict, or relies on a single instrument without cross-check.

  #### Step 3: The Micro-Test (Active Inference)
  The brain updates its model fastest when *action* produces predicted *sensory feedback*. The student must move the controls to match the instruments, not the body, and verify the result.

  *   **Action:** Make a small, smooth control input that aligns with the instruments.
  *   **Say Out Loud:** "Testing [input]. Expect [result]."
  *   **Pass Criteria:** The student moves the controls *toward* the instrument reading, even if it feels wrong (e.g., pushing forward when feeling like they are stalling). The instruments react as predicted.
  *   **Fail Criteria:** Student hesitates, fights the input because it "feels" dangerous, or moves controls to match the body sensation.

  ---

  ### Theory Audit: What Stays and What Goes

  You asked for honesty about where the theory is doing work and where it is decoration.

  **1. Distinctions That Must Survive (The Drill Breaks Without These)**
  *   **Prediction vs. Evidence:** The drill requires separating "what I feel" (the brain's prediction) from "what I see" (sensory evidence). If you merge these ("Check if you feel right"), the drill fails.
  *   **Precision Weighting:** The phrase "Body is noise" is crucial. It tells the brain to mathematically discount the vestibular signal. Without explicitly down-weighting the body, the brain treats the instrument as the outlier.
  *   **Active Inference:** Step 3 is the most critical theoretical import. The brain updates its model faster through *action* than through *observation*. Moving the controls and seeing the expected change forces the brain to accept the new model. Passive looking is often too slow.

  **2. Decoration (Dropped for Simplicity)**
  *   **"Free Energy" / "Surprise Minimization":** Irrelevant for the cockpit. The student doesn't need to know *why* the brain wants to reduce error, only *how*.
  *   **Hierarchical Processing:** We don't need to discuss deep neural layers. We just need to know the "Body Model" is fighting the "Visual Model."
  *   **Bayesian Math:** The concept of "weighting" is enough; no need for probabilities.

  **3. Where Theory Adds No Value (Ordinary Instruction Works Same)**
  *   **Scan Pattern:** A good instrument scan is mechanical. PP doesn't improve the eye movement; it improves the *interpretation* of what the eye sees.
  *   **Aircraft Control:** How to roll out of a bank is aerodynamics, not neuroscience.
  *   **Emergency Memory Items:** If an engine fails, you don't run a perception check; you run a checklist. PP applies to *orientation*, not *systems failure*.

  **4. Where the Procedure Ends (Judgment Calls)**
  *   **Risk Appetite:** The procedure tells you what is happening, not whether you should continue. If the interrogation confirms you are in a dangerous attitude, the procedure is done. The decision to declare emergency, divert, or hand over controls is risk management, not perception.
  *   **Sensor Failure:** As you noted in Case 3, if the instruments lie, the procedure can confirm a false reality. Recognizing instrument failure requires external knowledge (weather conditions, system knowledge), not just perceptual weighting.

  ---

  ### Stress Testing the Procedure

  Here is how "The Precision Interrogation" runs on your three cases.

  #### Case 1: The Sim Student (The "Leans")
  *   **Situation:** Student is in a coordinated 30-degree bank. Attitude Indicator (AI) shows bank. Student feels level.
  *   **Running the Drill:**
      1.  **Name the Ghost:** Student says, "My body says we are level." (Pass: Specific).
      2.  **Lock the Reference:** Student looks at AI and Turn Coordinator. Says, "Instruments show right bank. Instruments are high precision. Body is noise." (Pass: Two instruments).
      3.  **Micro-Test:** Instructor says, "Correct the bank." Student applies left aileron. Student says, "Testing left aileron. Expect AI to move to level." AI moves to level.
  *   **Outcome:** The student successfully levels the wings.
  *   **Why it works:** By verbalizing the body's claim, they objectify it. By moving the controls to match the AI, they generate new prediction error that forces the brain to update the "level" model.
  *   **Verdict:** **Success.** This is the exact use case for PP.

  #### Case 2: The Autopilot Surprise
  *   **Situation:** Night IMC. Autopilot (AP) is engaged. AP suddenly pitches down or rolls due to a mode change or turbulence capture. Student is startled.
  *   **Running the Drill:**
      1.  **Name the Ghost:** Student feels a lurch. Says, "My body says we are diving."
      2.  **Lock the Reference:** Student checks AI and VSI. Says, "Instruments show slight descent. Instruments are high precision."
      3.  **Micro-Test:** *Critical Juncture.* Before touching controls, student must verify AP status.
          *   *Modification for this case:* Step 3 becomes "Verify Source." Student says, "Testing Autopilot status. Expect 'NAV' or 'ALT' mode."
  *   **Outcome:** If the student yanks the yoke immediately, they fail Step 3. The drill forces a pause to verify *why* the instruments are moving before acting.
  *   **Why it works:** Startle response creates massive prediction error. The brain wants to act immediately to minimize it. The script forces a delay long enough to engage the prefrontal cortex rather than the amygdala.
  *   **Verdict:** **Success,** provided Step 3 is interpreted as "Verify Cause" before "Correct Attitude."

  #### Case 3: The Trap (Pitot/Static Ice)
  *   **Situation:** Pitot tube ices over. Airspeed indicator reads high. Altimeter freezes. VSI reads zero. AI is working (vacuum/electric). Student is actually climbing, but instruments say level/speeding up.
  *   **Running the Drill:**
      1.  **Name the Ghost:** Student says, "My body says we are climbing." (Actually true).
      2.  **Lock the Reference:** Student looks at Airspeed, Altimeter, VSI. They all agree (false consensus). Student says, "Instruments show level flight. Instruments are high precision. Body is noise."
      3.  **Micro-Test:** Student pushes nose down to match "level" instruments.
  *   **Outcome:** **Catastrophic Failure.** The procedure confirms the false reality. The student down-weights the correct bodily sensation (G-load, engine pitch, wind noise) because the drill tells them "Body is noise."
  *   **Detection:** The procedure *cannot* detect this on its own. It assumes the instruments are the "High Precision" source.
  *   **The Fix (Plausibility Gate):** You must add a constraint to Step 2.
      *   *Added Constraint:* "Instruments are high precision **unless they contradict physics.**"
      *   *Revised Step 2:* "Instruments show [data]. Do Power + Sound + G-Load match? If yes, Instruments are high precision. If no, Instruments are suspect."
      *   *In this case:* Power is high, Sound is high, G-Load is light. Instruments say Level/High Speed. This contradicts physics (High power + Level flight = High Speed, but if Airspeed is *too* high for the power, or if VSI is zero but engine pitch suggests climb).
  *   **Verdict:** **Failure without modification.** With the "Plausibility Gate" added to Step 2, it becomes a **Success**.
      *   *Theory Note:* This highlights a limit of PP. If your "High Precision" sensors are corrupted, you need a "Meta-Model" (knowledge of how the plane works) to override them. The drill must include a check for *consistency across different physical systems* (Engine vs. Airframe vs. Gyro), not just "Instruments vs. Body."

  ### Final Recommendation for the Briefing

  Teach the **Precision Interrogation** exactly as written for Cases 1 and 2. It is superior to "trust your instruments" because it gives the student a mechanism to override their own biology.

  However, for Case 3, you must add a **Warning Label** to Step 2:
  > "Instruments are high precision **only if they agree with each other and with power settings.** If Airspeed, Altimeter, and VSI tell a story that Power and Sound do not support, the Instruments are the noise."

  This preserves the predictive processing advantage (active weighting) while protecting against the specific failure mode where the "evidence" is corrupted.

  You are right: a slogan cannot compete with the body. But a procedure that treats the body as a faulty sensor and the instruments as a data stream to be interrogated? That gives the student a fighting chance.
