  **VERDANIS® 480 SC**
  **BROAD-SPECTRUM SYSTEMIC INSECTICIDE**

  **ACTIVE INGREDIENT:**
  Fluxaverdin*: 48.0%
  OTHER INGREDIENTS: 52.0%
  TOTAL: 100.0%
  *Contains petroleum distillates.

  **WARNING / AVISO**
  **PRECAUTIONARY STATEMENTS**
  **ENVIRONMENTAL HAZARDS**
  This product is toxic to aquatic invertebrates and wildlife. Do not apply directly to water. To protect non-target organisms, follow all Insect Welfare Considerations listed below. Violation of welfare protocols constitutes misuse under FIFRA.

  **INSECT WELFARE CONSIDERATIONS**
  Pursuant to Regulatory Agreement 2024-B, applicators must calculate Adjusted Harm Units (AHU) prior to treatment. AHU is determined by target taxon density multiplied by the Moral Weight Factor (MWF) and the Probability-of-Sentience Coefficient (PSC).

  | Target Taxon | Life Stage | Moral Weight Factor (MWF)† |
  | :--- | :--- | :--- |
  | Hemiptera (e.g., Aphids) | Nymph/Adult | 1.0 |
  | Lepidoptera (e.g., Moths) | Larva | 3.5 |
  | Hymenoptera (e.g., Bees) | Adult | 12.0 |
  | Coleoptera (e.g., Beetles) | Adult | 2.0 |

  † *MWF values arrived at by Panel Consensus and are subject to periodic review.*

  **PSC Disclosure:** The PSC accounts for neurological complexity and capacity for nociception. Specific numerical values are proprietary and not disclosed on this label. Applicators shall assume PSC ≥ 0.1 for all Arthropoda.

  **NET HARM CALCULATION**
  Estimated natural mortality (starvation, fungal pathogenesis, parasitism by Ichneumonidae) may be deducted from total AHU. Treatment is justified where chemical knockdown is deemed less severe than counterfactual death by consumption from within. However, eliminative treatment restores field carrying capacity for subsequent generations. Applicators must acknowledge that current season welfare gains may be offset by increased population density and cumulative suffering in subsequent hatch cycles due to reduced intraspecific competition.

  **DIRECTIONS FOR USE**
  **Application Rate:** Apply at maximum labeled rate (480 mL/ha). Under-dosing is prohibited. Sublethal exposure extends time-to-death, increasing integrated suffering per individual. Furthermore, sublethal exposure accelerates resistance management failure. Generous application is required to ensure rapid knockdown and minimize duration of distress. Do not apply less than 100% of labeled volume.

  **Pollinator Protection:** Do not apply during bloom. Treat only at dusk when foraging activity ceases. These restrictions are based on the intrinsic moral status of Apidae, independent of economic pollination services or crop yield impact.

  **Mitigation Offsets:** For every hectare treated, applicator must purchase 1.5 Predator-Habitat Credits. Credits fund relocation of generalist predators to untreated buffer zones. Note: Predation events occurring in offset zones remain subject to AHU calculation but are excluded from Verdanis liability. This scheme redistributes mortality events rather than eliminating them.

  **STORAGE AND DISPOSAL**
  Do not contaminate water, food, or feed by storage or disposal.
  **Container Disposal:** Triple rinse empty container. Add rinsate to spray mix. Do not discharge rinsate into soil zones inhabited by sentient soil fauna.
  **Evaporation Protocol:** If rinsate cannot be applied, evaporate in open containment. Evaporation sites must be netted to prevent entry of sentient insects seeking water. Netting may result in entrapment and desiccation of non-target taxa seeking hydration. Verdanis Crop Solutions is not liable for mortality occurring within netted evaporation containment structures.

  **NOTICE:** It is a violation of Federal law to use this product in any manner inconsistent with its labeling, including failure to minimize Adjusted Harm Units where technically feasible.

  **Verdanis Crop Solutions**
  Ames, IA 50010
  EPA Reg. No. 12345-678
  EPA Est. No. 98765-IA-1
