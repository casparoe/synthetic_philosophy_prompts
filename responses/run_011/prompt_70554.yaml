prompt: |-
  I run a small internal estimation group at a mid-sized logistics company — eleven analysts. Twice a quarter we produce numbers the exec team actually acts on: how much warehouse capacity to lease, when a competitor opens a lane, what to assume about fuel next year. The process right now is that I post the question in a shared sheet, people answer one at a time in an order I set, and everybody can see the answers already in the sheet before they type theirs. I do it that way on purpose, because our senior analyst's reasoning is genuinely useful to the juniors and I don't want to throw that away.

  The problem: when the sheet fills up with basically the same number eleven times, I can't tell whether I've got eleven people converging on the truth or one person's guess laundered ten times. I know the rough shape of the cascade argument — private signals, everyone watching what earlier people did, and it being perfectly rational from the fifth person onward to discount what you know. But I can't turn that into something I can run. My people are good in a spreadsheet, one has a stats minor, nobody's read the formal models, and my sponsor wants a single number by friday and won't accept "the range is wide" as an answer. I sign off personally.

  So: write me a triage procedure I can run in about twenty minutes on any consensus number before it goes upstairs. Questions to ask in order, what counts as a good enough answer to each one, the point where it stops and tells me not to send this up at all, and the points where it's really a judgment call wearing a procedure costume.

  Three things I want it to deal with explicitly:

  - I've been toying with a metric I call the cascade gap: after the sheet is full, ask everyone for a fresh private answer and use the size of the drift as a measure of how cascaded the number was. Does that measure anything? If yes, build it in. If not, say why and what to do instead.
  - We have a standing rule that the last three to submit have to come from different teams. I assumed that broke the chain.
  - A pilot where I hid the first six answers: the final numbers moved about 4% on average, but the spread tripled. Does a bigger spread mean less cascade, or just more noise? I've been reading a tight sheet as a good sign and I suspect that's backwards.

  Then run it on three cases. (1) A sheet where eleven people landed within a day of each other on a competitor's launch date, and the first two answers both trace back to the same trade-press article. (2) A sheet that's a mess — huge spread, two camps — leadership wants one number tomorrow and there's no time to rerun it. (3) A sheet that looks structurally clean by every rule I have: simultaneous private entry, teams mixed, no one saw anyone else's number — but all eleven started from the same third-party vendor model of regional freight volumes. I'm pretty sure (3) is fine and I'd like the procedure to tell me so; if it can't, tell me what it can't do and why no amount of process design fixes it.
reasoning: |-
  Here's a thinking process that leads to the suggested triage procedure:

  1.  **Analyze the User and Context:**
      *   **Role:** Lead of a small internal estimation group (11 analysts) at a mid-sized logistics company.
      *   **Task:** Produce actionable numbers for execs twice a quarter (capacity, competitor moves, fuel costs).
      *   **Current Process:** Sequential entry in a shared sheet (visible to all). Intentional for mentorship/learning, but creates information cascades.
      *   **Problem:** Can't distinguish between genuine consensus and herding (cascade). Needs a triage procedure (approx. 20 mins) to validate a consensus number before sending it up.
      *   **Constraints:** Sponsor wants a single number by Friday. Team is spreadsheet-savvy but not stats-literate. User signs off personally.
      *   **Specific Concerns:**
          1.  "Cascade Gap" metric (private re-ask).
          2.  "Last Three Rule" (different teams).
          3.  "Hidden First Six" pilot (spread tripled, mean moved 4%).
      *   **Test Cases:**
          1.  Competitor launch date (11 people within 1 day, first 2 same source).
          2.  Messy sheet (huge spread, two camps, deadline imminent).
          3.  Structurally clean but common source bias (vendor model).

  2.  **Deconstruct the Core Problem (Information Cascades):**
      *   *The Theory:* In sequential decision-making with public information, rational agents ignore private signals once the public history outweighs their private info. This leads to fragile consensus.
      *   *The User's Insight:* They know the theory ("private signals," "rational to discount"). They need *operationalization*.
      *   *The Tension:* Mentorship (seeing senior reasoning) vs. Independence (avoiding herding).

  3.  **Evaluate the User's Specific Concerns:**
      *   **Cascade Gap:** Asking for a fresh private answer *after* the public sheet is full.
          *   *Verdict:* Yes, this measures *commitment* and *private signal retention*. If the private re-ask differs significantly from the public commit, the public number was herding. If they match, confidence is higher.
          *   *Caveat:* Social pressure might still exist even in "private" re-asks if they know the group average. Needs to be anonymous/blind.
      *   **Last Three Rule:** Different teams for the last three submitters.
          *   *Verdict:* Weak break. If the first 8 have cascaded, the last 3 are swimming upstream against a "fact." It breaks *team* silos, not *information* silos.
      *   **Hidden First Six Pilot:** Spread tripled, mean moved 4%.
          *   *Verdict:* Bigger spread = Less Cascade (more private signal expression). Tight sheet = High Cascade (likely herding). The user suspects "tight is backwards" — they are correct. Tightness often indicates conformity, not precision.

  4.  **Develop the Triage Procedure (The "20-Minute Audit"):**
      *   *Goal:* A checklist/flowchart approach.
      *   *Structure:*
          1.  Source Independence Check (The "Roots").
          2.  Variance & Cascade Gap Analysis (The "Drift").
          3.  The "Pre-Mortem" (The "Gut").
          4.  Decision Gate (Send, Caveat, or Kill).
      *   *Tone:* Pragmatic, operational, respectful of the team's skills (spreadsheet focused), acknowledging the political reality (sponsor wants a number).

  5.  **Drafting the Steps (Iterative Refinement):**
      *   *Step 1: Source Tracing.* Don't just look at the number. Look at the *input*. If everyone used the same vendor model, it's not 11 estimates, it's 1 estimate multiplied by 11.
      *   *Step 2: The Cascade Gap.* Implement the user's idea but refine it. Call it the "Blind Re-Ask." Compare Public Consensus vs. Private Re-Ask.
      *   *Step 3: Variance Interpretation.* Address the "Hidden First Six" finding. High variance = Good (independence). Low variance = Risk (cascade).
      *   *Step 4: The "Last Three" Rule.* Downgrade this. It's a hygiene factor, not a validation factor.
      *   *Step 5: Decision Matrix.* When to send, when to add a disclaimer, when to refuse.

  6.  **Addressing the Test Cases:**
      *   *Case 1 (Competitor Date):* High risk. Same source for first 2 + tight cluster = Cascade. *Action:* Reject or heavily caveat.
      *   *Case 2 (Messy/Two Camps):* High variance. Good independence, but no consensus. *Action:* Don't average them. Present the two scenarios. (Sponsor wants one number, but giving a wrong single number is worse).
      *   *Case 3 (Vendor Model):* Structurally clean but epistemically bankrupt. *Action:* The procedure must flag "Common Source Bias." Process can't fix shared data blindness.

  7.  **Refining the "Cascade Gap" Metric:**
      *   Does it measure anything? Yes. It measures the *pressure* of the cascade.
      *   How to use it? Calculate the Mean Absolute Deviation between Public Final and Private Re-Ask. If > X%, flag as cascaded.
      *   *Correction:* The user asked to build it in *if* it works. It does work. It's a measure of "regret" or "true belief."

  8.  **Refining the "Tight Sheet" Intuition:**
      *   User suspects tight = bad. Correct. In estimation, variance is information. Zero variance is suspicious.
      *   Need to explain *why* the spread tripled in the pilot. Because private signals were finally allowed to express.

  9.  **Structuring the Output:**
      *   **Introduction:** Acknowledge the sophistication of the problem.
      *   **The Procedure:** "The 20-Minute Cascade Audit." Step-by-step.
      *   **The Metrics:** Explicitly address the Cascade Gap, Last Three Rule, and Variance.
      *   **The Test Cases:** Run the procedure on the three scenarios.
      *   **The Limit:** Address Case 3's fundamental limit (Garbage In, Garbage Out).

  10. **Self-Correction/Review during drafting:**
      *   *Critique:* Is 20 minutes realistic?
      *   *Fix:* Keep the steps binary or quick calculation. No complex regression.
      *   *Critique:* The sponsor wants a single number.
      *   *Fix:* The procedure must allow sending a number but attaching a "Confidence Score" or "Range Note" that protects the user.
      *   *Critique:* Case 3 is tricky.
      *   *Fix:* Be honest. Process detects *social* cascades, not *data* monocultures. Need to distinguish the two.

  11. **Final Polish:** Ensure the tone is peer-to-peer (professional, direct, no fluff). Use logistics/ops terminology where possible. (e.g., "lane," "capacity," "vendor model").

  *(Self-Correction on Case 3)*: The user says "I'm pretty sure (3) is fine." Wait, re-reading... "I'm pretty sure (3) is fine and I'd like the procedure to tell me so; if it can't, tell me what it can't do."
  *Actually*, Case 3 is *not* fine. If all 11 start from the same third-party vendor model, they are not estimating; they are copying. The procedure *must* flag this as a risk, even if the social process was clean. I need to correct the user's assumption here gently. Shared data bias is worse than social cascades because it looks like consensus.

  *(Re-evaluating Case 3)*: Wait, let me read carefully: "all eleven started from the same third-party vendor model... I'm pretty sure (3) is fine."
  *My analysis:* It is *not* fine. It's a "Data Cascade." If the vendor is wrong, everyone is wrong. The procedure needs to catch "Source Monoculture." I will explain that the procedure *cannot* validate the external truth of the vendor model, only the independence of the analysts. I must tell the user that (3) is actually high risk, not fine.

  *(Wait, let me double check the prompt)*: "I'm pretty sure (3) is fine and I'd like the procedure to tell me so; if it can't, tell me what it can't do and why no amount of process design fixes it."
  *Okay, the prompt invites me to challenge this.* I will challenge it. Shared source = correlated error. Process can't fix that.

  *(Final Plan)*:
  1. Define the "Cascade Audit."
  2. Address the 3 specific metrics (Gap, Last Three, Variance).
  3. Run the 3 cases.
  4. Conclude on the limits of process vs. data quality.

