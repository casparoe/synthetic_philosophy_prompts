answer: |-
  Here is a triage procedure designed for your constraints: twenty minutes, spreadsheet-literate team, executive demand for a single number, and your specific need to distinguish consensus from herding.

  ### The 20-Minute Cascade Audit

  This is not a forecasting model. It is a quality control check on the *process* that generated the number. Run this immediately after the sheet locks and before you sign off.

  #### Step 1: Source Independence Check (5 Minutes)
  **Action:** Scan the "Method/Source" column for the first three and the last three submitters.
  **The Question:** Do at least four of these six analysts cite distinct primary sources or methodologies?
  **Pass:** Yes. (e.g., One used trade press, one used historical lane data, one used a vendor model, one used a bottom-up driver survey).
  **Fail:** No. (e.g., Four of them cite the same vendor report or the same trade article).
  **The Stop Rule:** If the first *two* analysts used the exact same source, **STOP**. Do not send the number. The cascade has already locked before the third person typed.
  **Why:** Information cascades lock in when the public signal (the first few answers) outweighs private signals. If the first two signals are correlated (same source), the "public" weight is artificially doubled.

  #### Step 2: The Blind Re-Ask (Cascade Gap) (10 Minutes)
  **Action:** This builds on your "Cascade Gap" idea. Send an anonymous form (or have them email you directly) with one question: *"If you were the only person estimating this, with no access to the sheet, what is your number?"*
  **Calculation:**
  1.  Calculate the **Public Consensus** (Average of the sheet).
  2.  Calculate the **Private Mean** (Average of the blind re-ask).
  3.  Calculate the **Gap %**: $|Public - Private| / Public$.
  4.  Calculate the **Private Spread** (Standard Deviation of the blind re-ask).
  **The Threshold:**
  *   **Gap % < 2%:** High confidence. The public process did not distort private belief.
  *   **Gap % > 5%:** **RED FLAG.** The sheet number is a social artifact, not an estimate.
  *   **Private Spread:** If the Private Spread is significantly *larger* than the Public Spread (your pilot finding), the Public Sheet was cascaded.
  **Why:** Your pilot was correct. A tight sheet often means herding. A wide private spread means people *have* different information but suppressed it to match the group. The Gap measures the "pressure" they felt to conform.

  #### Step 3: The "Last Three" Hygiene Check (2 Minutes)
  **Action:** Verify your standing rule (last three from different teams).
  **Verdict:** This is **Hygiene, not Validation.**
  **Procedure:** If they pass, note it. If they fail, note it. **Do not let this determine whether you send the number.**
  **Why:** As you suspected, this does not break the information chain. By the time the 9th analyst types, the "truth" is established. A different team member will still herd because they trust the *group's* prior work, not just their own team's. It prevents tribal bias, not information cascades. Treat it as a box-ticking exercise for HR/Politics, not a statistical control.

  #### Step 4: The Sign-Off Decision (3 Minutes)
  **Action:** Choose one of three paths based on Steps 1-3.
  1.  **Green Light:** Sources independent + Cascade Gap < 2%. **Send the number.**
  2.  **Yellow Light:** Sources mixed + Cascade Gap 2-5%. **Send the number, but attach a range.** Tell the sponsor: *"Consensus is X, but underlying variance suggests a confidence interval of X ± 5%."*
  3.  **Red Light:** Source Monoculture (Step 1 Fail) OR Cascade Gap > 5%. **Do not send the number.** Tell the sponsor: *"The data is correlated. We are running a parallel blind estimation. Expect a 24-hour delay."*

  ---

  ### Analysis of Your Specific Metrics

  **1. The Cascade Gap (Private Re-Ask)**
  *   **Does it measure anything?** Yes. It measures **social pressure vs. private conviction.**
  *   **Build it in?** Yes, as Step 2 above.
  *   **Nuance:** Ensure the re-ask is truly blind. If they think you will compare their name to their sheet entry, they will lie. It must be anonymous to you, or aggregated before you see it.

  **2. The "Last Three" Rule**
  *   **Does it break the chain?** No.
  *   **Verdict:** It is a "judgment call wearing a procedure costume." It makes you *feel* like you've diversified risk, but in a sequential visible sheet, the information weight of the first 8 entries crushes the independence of the last 3. Keep the rule for political cover (shows you're managing silos), but do not count it as risk mitigation in your audit.

  **3. The "Tight Sheet" vs. "Wide Spread" (Your Pilot)**
  *   **Interpretation:** You are correct to suspect a tight sheet is backwards.
  *   **Why:** In estimation, **variance is information.** Zero variance is suspicious.
  *   **The Pilot Result:** When you hid the first six, the spread tripled. This proves the first six were suppressing the private signals of the last five. The 4% move in the mean suggests the cascade was pulling the number *away* from the true aggregate wisdom.
  *   **Rule:** A tight sheet is only "good" if Step 1 (Source Independence) is also passed. Tight sheet + Same Sources = Disaster. Tight sheet + Different Sources = Genuine Convergence (Rare).

  ---

  ### Running the Procedure on Your Three Cases

  #### Case 1: Competitor Launch Date
  *   **Data:** 11 people within 1 day. First two answers trace to the same trade-press article.
  *   **Step 1 (Source):** **FAIL.** First two used the same source. The cascade locked immediately.
  *   **Step 2 (Gap):** Likely high. If you ask privately, analysts who know trade press is often speculative will drift away from the date.
  *   **Verdict:** **RED LIGHT.** Do not send.
  *   **Reasoning:** This is not an estimate; it is a citation. If the article is wrong, your entire group is wrong. You have 11 analysts acting as 1 clipboard.
  *   **Fix:** Assign two analysts to find *contradictory* evidence (e.g., permit filings, hiring posts) before opening the sheet.

  #### Case 2: The Messy Sheet (Two Camps)
  *   **Data:** Huge spread, two distinct camps, deadline tomorrow.
  *   **Step 1 (Source):** Likely Pass (different camps imply different data).
  *   **Step 2 (Gap):** The Private Re-Ask will likely match the Public Sheet because the sheet *allowed* disagreement. The Gap will be low.
  *   **Step 3 (Spread):** High spread indicates independence.
  *   **Verdict:** **YELLOW LIGHT.** Do not average them.
  *   **Action:** The sponsor wants one number, but averaging two camps (e.g., $10M and $20M -> $15M) gives a number nobody believes.
  *   **Procedure Output:** Send the number that corresponds to the **larger camp**, but explicitly flag the minority camp as a "Risk Scenario."
      *   *Script:* "Recommendation is $20M (7 analysts). Risk scenario is $10M (4 analysts) based on [X assumption]. If [X] happens, we pivot."
      *   *Why:* This protects you. If the minority camp turns out right, you documented it. If you average them and the minority turns out right, you look incompetent.

  #### Case 3: Structurally Clean, Common Vendor Model
  *   **Data:** Simultaneous private entry, teams mixed, no visibility. All used the same third-party vendor model.
  *   **Your Hope:** You want the procedure to say this is fine.
  *   **Procedure Reality:** **RED LIGHT (with nuance).**
  *   **Step 1 (Source):** **FAIL (Source Monoculture).** Even if they entered privately, they all started with the same biased prior.
  *   **Step 2 (Gap):** The Gap will be near zero. They will all give the vendor's number privately because they trust the vendor more than their own gut.
  *   **Step 3 (Spread):** Spread will be tiny.
  *   **Verdict:** **Process cannot fix this.**
  *   **Why:** This is not a *social* cascade; it is a *data* cascade. Your procedure detects social pressure (herding). It cannot detect external truth bias. If the vendor model assumes 5% fuel inflation and the real world is 10%, all 11 analysts will be confidently wrong.
  *   **What to tell your Sponsor:** "The process was clean, but the input data is single-source. We are relying entirely on [Vendor]'s accuracy. We need to budget for a 10% variance if their model drifts."
  *   **The Hard Truth:** No amount of process design fixes shared data blindness. The only fix is to mandate that 3 of the 11 analysts are *forbidden* from using the vendor model and must build a bottom-up estimate to stress-test the vendor.

  ### Summary for Your Friday Sign-Off

  1.  **Tightness is suspicious.** If the standard deviation is near zero, assume herding until proven otherwise.
  2.  **The Cascade Gap is your best tool.** It quantifies the "social tax" your team paid to agree with each other.
  3.  **Source Independence > Process Independence.** It matters less *how* they typed the number (blind vs. visible) and more *where* they got the number (unique vs. shared).
  4.  **Case 3 is the trap.** It looks safe because the social process was clean. It is actually the most dangerous because it creates false confidence. Flag shared data sources as a primary risk in your cover email.

  If you run Step 1 and Step 2, you will catch 90% of cascade failures in under 20 minutes. The remaining 10% (Case 3) requires you to push back on the data inputs, not the estimation process.
