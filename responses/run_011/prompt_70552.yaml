prompt: |-
  I lead a forty-minute session for my local rationality reading group on the trouble that already-known evidence makes for Bayesian confirmation. The group has read one popular book on updating and will tolerate a single fraction written on a whiteboard, but nothing else; assume no other notation is available.

  Plan the session rather than explaining the puzzle to me. First, the carrying example: I intend to use my own house — a friend's remark last year about a blocked flue neatly explains a hallway that has been cold every winter for a decade — instead of general relativity and the perihelion of Mercury, which I expect to lose half the room. Tell me whether that case can bear the weight, what it must have and must not have for the difficulty to bite rather than collapse into a triviality about certainty, and what to swap in if it fails.

  Second, the order of ideas: what must be in place before anyone in the room can feel there is a problem at all, where in that sequence to head off the two replies I am certain to get — 'nobody is literally at one, just use 0.999' and 'then what was confirmed is the claim that the theory entails the fact' — and how to keep my own view, that the whole thing is an artifact of idealization, from turning the evening into advocacy. Note what I should decline to take up at this level and flag those refusals out loud rather than dodge them, and end with one question that will tell me whether it landed.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **Goal:** Plan a 40-minute session for a rationality reading group.
      *   **Topic:** The "Problem of Old Evidence" in Bayesian confirmation theory.
      *   **Audience:** Read one popular book on updating (likely *Superforecasting*, *Thinking in Bets*, or *The Scout Mindset*, maybe *Bayes' Theorem for the Curious* but likely non-technical). Tolerates *one* fraction on a whiteboard. No other notation.
      *   **Constraint 1 (Example):** User wants to use their own house (cold hallway, blocked flue remark) instead of General Relativity/Mercury. I need to evaluate if this works and specify conditions.
      *   **Constraint 2 (Flow):** Sequence of ideas, handling specific objections ("just use 0.999" and "theory entails fact"), managing the user's own view (it's an artifact of idealization) without becoming advocacy, stating what *not* to discuss, and ending with a specific diagnostic question.
      *   **Tone:** Instructional, strategic, precise.

  2.  **Evaluate the Example (The Cold Hallway):**
      *   *The Problem of Old Evidence:* In strict Bayesianism, if $E$ (evidence) is already known ($P(E) = 1$), then $P(E|H) = 1$ and $P(E) = 1$. By Bayes' theorem, $P(H|E) = P(H) \times 1 / 1 = P(H)$. The evidence provides no confirmation.
      *   *The User's Case:* Hallway cold for 10 years ($E$). Friend says blocked flue ($H$) last year. $H$ explains $E$.
      *   *Risk:* If the user treats the cold hallway as "known with certainty" ($P=1$), the math breaks. If they treat it as "I noticed it was cold," that's subjective.
      *   *Condition for Success:* The group must accept that the evidence (cold hallway) was *fully established* before the hypothesis (blocked flue) was proposed. The "aha" moment must feel real, but the math must say "no update."
      *   *Condition for Failure:* If the coldness was uncertain (maybe it was just drafty windows?), then learning about the flue updates the probability of the coldness cause, not the coldness itself. The problem requires $P(E)=1$.
      *   *Verdict:* It can work, but it needs careful framing. It's relatable, unlike Mercury.
      *   *Swap:* If it fails (because people argue they weren't *sure* it was the flue), use a historical discovery where the data was public knowledge (e.g., the periodic table gaps, or a crime scene detail known to police before the suspect is identified). But the house is better for intimacy if framed right.

  3.  **Sequence of Ideas:**
      *   *Step 1: Intuition.* Establish that the explanation *feels* like confirmation. (The "Aha!" moment).
      *   *Step 2: The Rule.* Introduce the single fraction (Bayes' Theorem) without symbols. "Posterior = Prior times Likelihood divided by Evidence Probability."
      *   *Step 3: The Collision.* Apply the rule to the "Old Evidence." If Evidence Probability is 1 (it's old/known), the fraction becomes 1. No update.
      *   *Step 4: The Objections.* Pre-empt the "0.999" and "Entailment" replies.
      *   *Step 5: The Meta-View.* Briefly touch on idealization without preaching.
      *   *Step 6: The Exit.* Diagnostic question.

  4.  **Handling Objections:**
      *   *Objection 1: "Nobody is literally at 1, just use 0.999."*
          *   *Counter:* If we use 0.999, we admit the math doesn't describe how we *actually* reason (we treat old facts as facts). Also, if $P(E)$ is close to 1, the update is tiny, but the "Aha!" feels huge. The mismatch remains.
      *   *Objection 2: "What was confirmed is the claim that the theory entails the fact."*
          *   *Counter:* That shifts the goalposts. We want to confirm the theory about the world (the flue), not the theory about our logic. It makes the confirmation indirect and weak.

  5.  **Managing the User's View (Artifact of Idealization):**
      *   The user believes the problem is due to idealization (perfect logic agents vs. humans).
      *   *Risk:* Turning the session into "Why Bayesianism is imperfect" (Advocacy).
      *   *Strategy:* Present the problem as a tension within the framework, not a death blow. Acknowledge the idealization at the end as *one* resolution, but emphasize the *puzzle* itself.
      *   *Refusals:* Do not discuss "Jeffrey Conditioning" or "Counterfactual Histories." Too technical. State this clearly.

  6.  **Drafting the Plan (Iterative refinement):**

      *   *Time Allocation:* 40 mins.
          *   Intro/Example: 10 mins.
          *   The Math (The Fraction): 5 mins.
          *   The Conflict: 10 mins.
          *   Objections & Discussion: 10 mins.
          *   Closing/Question: 5 mins.
      *   *The Fraction:* Need to write it in words. $P(H|E) = P(H) \times P(E|H) / P(E)$.
      *   *The House Example:* Needs to emphasize that the coldness was *settled*. "I knew the hallway was cold. I didn't need a thermometer."
      *   *Objection Handling:* Needs to be firm but open. "Write that down, we'll come back."
      *   *Refusals:* Explicitly list "How to fix the math" (technical fixes) as out of scope.
      *   *Diagnostic Question:* Needs to test if they feel the tension, not if they know the answer. "Does the math describe the reasoning, or prescribe it?"

  7.  **Refining the House Example (Crucial Step):**
      *   Why might it fail? If the group thinks, "Well, maybe you weren't sure it was the flue."
      *   Correction: The evidence is *Cold Hallway*. The hypothesis is *Blocked Flue*.
      *   The problem: I knew *Cold Hallway* (E) before I thought of *Blocked Flue* (H).
      *   Does H explain E? Yes.
      *   Does learning H increase confidence in H? Intuitively, yes.
      *   Does Bayes allow it? No, because P(E) = 1.
      *   *Requirement:* The user must insist they were *certain* of the coldness. Not "it felt cold," but "it is a fact the hallway is cold."
      *   *Swap:* If they argue about the certainty of the coldness, switch to "The existence of the continent of Antarctica." Everyone knew it existed; later theories explained its formation. But the house is more visceral. Stick with the house but tighten the certainty condition.

  8.  **Final Polish:**
      *   Check constraints: One fraction? Yes. No notation? Yes (use words). 40 mins? Yes.
      *   Check tone: Directive, helpful, not explaining the puzzle itself but planning the teaching of it.
      *   Check specific requests: "What it must have/must not have," "Order of ideas," "Head off replies," "Keep view from turning into advocacy," "Decline to take up," "End with one question."

      *(Self-Correction during drafting)*: Make sure I don't explain the Problem of Old Evidence to the user (they know it). Focus *only* on the session plan.
      *(Refining the "One Fraction")*: Write it as: `Posterior = Prior × (Likelihood / Probability of Evidence)`.
      *(Refining the Objections)*: The "0.999" objection is the most common. The response must be that it destroys the elegance of the system if we have to fudge numbers to make reality fit.
      *(Refining the User's View)*: The user thinks it's an artifact. They shouldn't say "I think it's an artifact" immediately. They should ask "Is this a bug in the world or the map?"

  9.  **Final Review against constraints:**
      *   Session plan? Yes.
      *   House example evaluation? Yes.
      *   Order of ideas? Yes.
      *   Objections handled? Yes.
      *   User's view managed? Yes.
      *   Refusals flagged? Yes.
      *   One ending question? Yes.

      *Let's write it.*
answer: |-
  ### Session Plan: The Problem of Old Evidence
  **Time:** 40 Minutes
  **Constraint:** One fraction on the whiteboard. No symbols (use words).

  ---

  ### 1. The Carrying Example: Your House
  **Verdict:** The house example can bear the weight, but it is fragile. It relies entirely on the *certainty* of the evidence, not the novelty of the hypothesis.

  **What it must have:**
  *   **Settled Fact:** You must frame the "cold hallway" not as a sensation ("it felt chilly") but as an established fact of the world ("the temperature was objectively low"). The group must accept that *before* the friend spoke, $P(\text{Cold Hallway}) = 1$.
  *   **Explanatory Power:** The "blocked flue" hypothesis must feel like it *saves* the phenomenon. It must feel like a discovery, even though the data was old.

  **What it must not have:**
  *   **Uncertainty about the Cold:** If anyone argues, "But maybe it was just drafty windows?", the problem collapses. If the evidence was uncertain, learning about the flue *does* update the probability of the evidence, and Bayes works fine. You must shut down debate about the coldness itself.
  *   **Uncertainty about the Flue:** Do not make the session about whether the friend was right. The puzzle is about whether finding out they *might* be right should change your confidence, given you already knew the hallway was cold.

  **The Swap (if it fails):**
  If the group fixates on the physical uncertainty of the hallway, swap to **The Existence of Tides**.
  *   *Evidence:* Tides exist (known with certainty for millennia).
  *   *Hypothesis:* Newtonian Gravity (proposed much later).
  *   *Point:* Newton's theory explained the tides perfectly. Did learning Newton's theory confirm it via the tides? Intuitively yes. Mathematically (if Tides = 1), no.
  *   *Why:* No one will argue the tides were uncertain.

  ---

  ### 2. Order of Ideas & Flow

  **Minute 0–10: The Intuition (The "Aha" Moment)**
  *   Tell the house story. Emphasize the timeline: 10 years of cold (Fact), then 1 year ago the remark (Hypothesis).
  *   Ask the room: "When my friend said 'blocked flue,' did I become more confident that there was a blocked flue?"
  *   *Consensus:* Yes. It felt like confirmation. The fact explained the theory.
  *   *Goal:* Lock in the intuition that old evidence *should* confirm new theories.

  **Minute 10–15: The Rule (The Single Fraction)**
  *   Write this on the board:
      `New Confidence = Old Confidence × (Chance of Fact if Theory True / Chance of Fact Generally)`
  *   Translate the terms briefly:
      *   "Chance of Fact Generally" is the probability you assigned to the hallway being cold *before* hearing the theory.
  *   *Goal:* Establish the mechanical constraint without notation.

  **Minute 15–25: The Collision**
  *   Walk through the math verbally.
  *   "I knew the hallway was cold. So 'Chance of Fact Generally' is 1 (100%)."
  *   "If the flue is blocked, the hallway is definitely cold. So 'Chance of Fact if Theory True' is 1."
  *   "1 divided by 1 is 1."
  *   "So New Confidence = Old Confidence × 1."
  *   *The Punchline:* "The math says I learned nothing. My confidence should not have moved. But I told you it did."
  *   *Goal:* Make the contradiction visceral. The map (math) does not match the territory (your feeling of understanding).

  **Minute 25–35: Handling the Objections**
  *   **Objection A:** "Nobody is literally at 1, just use 0.999."
      *   *Your Response:* "If we use 0.999, we admit the math only works if we lie about what we know. We *treat* old facts as certain. If the system requires us to pretend we're uncertain about reality to function, is the system describing reasoning, or just arithmetic?"
      *   *Action:* Write "0.999?" on the board, then cross it out. Mark it as "Fudging the Input."
  *   **Objection B:** "Then what was confirmed is the claim that the theory entails the fact."
      *   *Your Response:* "That shifts the goalposts. I don't care if I confirmed the logical link. I want to know if the *flue* is blocked. If Bayes can't use the cold hallway to confirm the flue, it can't use the perihelion of Mercury to confirm Gravity. It strips science of its history."
      *   *Action:* Write "Confirming the Link?" on the board. Mark it as "Changing the Subject."

  **Minute 35–40: The Meta-View & Close**
  *   **Managing Your View:** You believe this is an artifact of idealization (perfect agents vs. humans). Do not lead with this.
  *   *Strategy:* Frame it as a choice for them. "Is this a bug in how we reason, or a bug in how we model reasoning?"
  *   *Refusals (State these explicitly):* "I am not going to walk through technical fixes like 'Jeffrey Conditioning' or 'Counterfactual Histories.' Those are solutions for a different class. Today is about feeling the tension, not resolving the equation."
  *   **The Diagnostic Question:**
      *   Ask: **"If you had to choose: do we change how we reason to fit the math, or change the math to fit how we reason?"**
      *   *Why this works:* It reveals if they see Bayesianism as a prescription (normative) or a description (descriptive). If they say "change the math," they grasp the idealization problem. If they say "change reasoning," they are still inside the formalist box.

  ---

  ### 3. Facilitator Notes

  *   **On the Whiteboard:** Do not erase the fraction. Let it sit there as the "accuser" throughout the session.
  *   **On Certainty:** If a participant pushes back on "But you weren't 100% sure it was cold," stop the group. Say: "For the sake of the puzzle, grant me that some facts are settled. If Bayes breaks on settled facts, it breaks on the things we rely on most."
  *   **On Advocacy:** When you mention your view (idealization), phrase it as a hypothesis, not a conclusion. "One view is that this is an artifact..." rather than "The truth is..."
  *   **On Time:** If the "0.999" objection drags on past minute 30, cut it off. "That is a solution that requires us to be uncertain about everything. Let's park that and look at the implication."

  ### 4. Summary of Refusals (Read these out loud)
  "I want to flag what we are *not* doing. We are not solving the math. We are not discussing how to reconstruct counterfactual probabilities. We are not deciding if General Relativity is true. We are testing whether a specific rule for updating matches a specific experience of learning."
