answer: |-
  The Endangered Species Act operates on a pragmatic hybrid ontology that treats species as legally constructed proxies for biological reality during listing, while enforcing a lexical prioritization of existence over economic value that collapses into standard cost-benefit analysis only once survival is secured.

  The insistence that listing rest solely on scientific data does not commit the statute to species as mind-independent essences with determinate boundaries, but rather to an operational realism where entities must be measurable enough to track risk regardless of their metaphysical status. This requirement rules out strong nominalism, which would render scientific data irrelevant to the definition of the unit, but it also rejects strict taxonomic essentialism, as evidenced by the inclusion of subspecies and Distinct Population Segments that rely on administrative judgments of significance rather than pure biological discontinuity. The practice is most comfortably licensed by a lineage individuality account, where species are spatiotemporally restricted individuals whose trajectory toward extinction can be scientifically modeled even if their boundaries are partly conventional, and it remains compatible with pluralism about species concepts so long as the chosen concept yields data tractable enough for risk assessment.

  The axiological structure embodies a lexical priority theory of value rather than a strict fact/value split or simple jurisdictional allocation. By insulating listing from economics, the Act treats existence as a precondition for value comparison, establishing a deontological constraint that survival cannot be traded for utility. The subsequent consideration of economics in habitat designation and exemptions functions as a consequentialist override that is strictly bounded by the lexical threshold of extinction; money enters the calculation only when the absolute duty to prevent extinction is not violated. This is not merely jurisdictional because the statute mandates the outcome of the jurisdictional split—science wins on existence, politics wins on cost—embedding a specific moral hierarchy into the procedure itself rather than simply assigning tasks to different actors.

  Several architectural features carry no metaphysical commitment whatsoever and are instead explained by administrative law and judicial review standards. The requirement for the best scientific and commercial data is a procedural safeguard against arbitrary agency action rather than an epistemological claim about accessing truth, and treating probabilistic future risk as a present scientific fact is a legal fiction designed to confer standing and enforceability rather than a metaphysical assertion about time. The significance prong of the Distinct Population Segment definition is purely policy-driven, reflecting a congressional intent to conserve biodiversity units that matter to ecosystems or humans, not a biological necessity. What the statute strictly requires is a reasoned basis for distinction and a non-economic assessment of risk; what merely fits it well is the notion that these distinctions map onto mind-independent natural kinds.

  The practice most conspicuously excludes unrestricted cost-benefit utilitarianism, which would allow economic value to determine existence at every stage. If this rival view were adopted, the listing process would weigh the costs of protection against the benefits of the species' existence, potentially denying protection to species inhabiting high-value economic zones even if biologically endangered. Critical habitat designation would lack the extinction veto, permitting areas to be excluded whenever economic benefits outweighed conservation benefits regardless of the species' survival prospects. The exemption process would become routine rather than exceptional, authorizing projects that jeopardize species whenever the net economic utility was positive, effectively reducing the Act to a weak environmental impact statement rather than a substantive conservation mandate.
