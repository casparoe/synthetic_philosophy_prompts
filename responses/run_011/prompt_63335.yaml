  **Repentance:** Subjective guilt does not alter OGU. Do not reduce dose based on remorse. The debt exists independently of acknowledgment.

  **ADVERSE REACTIONS**
  Physical pain, psychological distress, liberty deprivation, stigma. Remorse is common but not required for discharge. Family collateral suffering is expected but not monitored.

  **DRUG INTERACTIONS**
  **Mercy:** Concurrent administration of Mercy may invalidate dosing integrity.
  **Amnesty:** Contraindicated. Nullifies mechanism of action.
  **Therapeutic Programs:** Do not combine with rehabilitation modules.

  **USE IN SPECIFIC POPULATIONS**
  **Repeat Offenders:** No tolerance buildup. Suffering remains efficacious regardless of prior exposure.
  **Victims:** Patient-reported outcomes from victims are not validated endpoints. Victim satisfaction does not correlate with justice.

  **OVERDOSAGE**
  Exceeding the OGU ceiling constitutes wrongful victimization. Monitor for excessive severity. If overdosage occurs, immediate cessation is required; compensation may be indicated. Underdosing leaves moral residue.

  **CLINICAL STUDIES**
  In Trial P-1 (N=500), 100% of subjects received proportionate suffering. Placebo arm (unpunished wrongdoing) was terminated early; leaving wrongdoing untreated violates ethical mandates of desert. Primary endpoint: Proportionality Index met. Secondary endpoints (deterrence, reform) were not measured.
  *Efficacy:* Defined strictly as debt extinguishment. Crime rates remained unchanged in 40% of cohorts; this is clinically acceptable. Success is measured by suffering delivered, not behavior modified.

  **HOW SUPPLIED AND STORAGE**
  Stored in secure facilities. Protect from parole, pardon, or early release. Dispense only upon verdict. Keep out of reach of legislators.
