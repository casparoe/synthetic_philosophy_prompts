answer: |-
  **Vienna, 1932. A corner table at the Café Museum. Steam rises from coffee glasses. The air is thick with tobacco smoke and the urgency of the coming winter.**

  **Elsa:** (Tapping a blueprint) The committee's proposal is straightforward. We adopt a framework where "housing need" is defined by square meters per child and proximity to tram lines. Within that linguistic structure, the central office isn't guessing; it's solving a system of equations.

  **Friedrich:** But the variables don't exist until the market speaks them. You treat "need" as a static value you can plug into a function. It isn't. It's a shifting shadow. When you centralize allocation, you destroy the only mechanism we have for discovering what the materials are actually worth to the people holding them.

  **Elsa:** You're treating the price mechanism as if it were a law of nature, Friedrich. It's a tool. A coordinate system. For the Circle, questions about whether a framework is "true" are meaningless. The only question is: which framework allows us to formulate hypotheses that are more easily tested and coordinated? If the central office framework allows us to say "Family X gets Apartment Y" and verify the outcome without the noise of speculation, it is scientifically superior.

  **Friedrich:** Superior for whom? For the planner sitting in the Ringstraße? You speak of coordination, but you ignore the substrate. The knowledge required to house these families isn't statistical. It's the knowledge of the leaking pipe in the third district, the carpenter who has spare timber hidden in his barn, the family who prefers a smaller apartment near the father's factory. This knowledge is dispersed. It exists only in time and place. No single office can possess it.

  **Elsa:** Stop. That last claim. "No single office can possess it." Is that an internal statement or an external one?

  **Friedrich:** It's an empirical fact. It's psychology and logistics.

  **Elsa:** Then it is internal to our current physicalist framework. And like any internal claim, it is contingent. You are asserting a limitation on data processing capacity. But if we change the framework—if we change the reporting structures, the incentives, the language of allocation—the capacity changes. You're treating a practical difficulty as a logical impossibility. For us, the choice of framework is a practical proposal. We propose: let us try to coordinate this way. If the hypotheses fail—if families freeze—we revise the framework. But you are saying we cannot even begin the experiment.

  **Friedrich:** I am saying the experiment blinds you to the failure. In a market, the failure is immediate. The price spikes, the shortage screams. In your central office, the failure is buried in aggregates. You say "framework," I say "blindfold." When you aggregate "building materials" into a single variable for your equations, you destroy the particularity. Concrete isn't just "mass." It's *this* concrete, available *now*, at *this* site. Your aggregates are empty shells.

  **Elsa:** But you rely on aggregates too. "The economy," "efficiency." These are also constructs. You claim the market discovers truth. I claim it merely selects for solvency. If we choose a framework where "efficiency" is defined by social stability rather than profit velocity, the central office is the efficient instrument. You haven't shown why my framework is unintelligible, only that it differs from yours.

  **Friedrich:** It's not about the definition of efficiency. It's about the transmission of information. Prices aren't just a framework choice; they are a discovery procedure. They compress millions of local preferences into a single number. Your office would need to replicate that compression without the mechanism that generates it.

  **Elsa:** Don't retreat into mysticism. If it's a discovery procedure, it's a technique. And if it's a technique, it can be analyzed. Tell me this: during the war, you accepted rationing. Vaccination campaigns, troop movements, bread allocation. All central. All successful, broadly speaking. By your logic, those should have been impossible. The knowledge of who needed bread was just as dispersed then as the knowledge of who needs bricks is now. Why does the epistemic limit vanish when the state is fighting for survival?

  **Friedrich:** (Leans forward) Because the goal was singular. In war, the end is fixed: victory. The means are technical. You can calculate the calories needed to march a soldier. That is technical knowledge, aggregable. But housing isn't a campaign. It's a continuous adaptation to changing desires. In vaccination, the goal is immunity. In housing, the goal is... what? Satisfaction? Comfort? Those are subjective. You cannot centralize the subjective without freezing it into something it isn't.

  **Elsa:** So your argument rests on the complexity of the end-state. If the goal is uniform, centralization works. If the goal is plural, it fails.

  **Friedrich:** Precisely.

  **Elsa:** Then we are not arguing about epistemology anymore. We are arguing about whether housing is a uniform good. If we define the framework such that housing is a basic right with standard specifications—heat, light, space—then the goal *is* uniform. Your objection collapses into a debate about standardization, not knowledge.

  **Friedrich:** But who defines the standard? The office? Then you have imposed a preference and called it a fact. You say you avoid metaphysics, Elsa, but you are smuggling in a value judgment as a linguistic convention.

  **Elsa:** All frameworks smuggle in values. That's why we choose them practically. I choose this one because it reduces suffering. You choose yours because it preserves liberty. Let's be clear about that. But don't tell me your system is "epistemically necessary" while mine is "impossible."

  **Friedrich:** I tell you that your system cannot calculate what it claims to calculate. It's not about liberty. It's about arithmetic. You cannot sum what cannot be counted.

  **Elsa:** And I tell you that what cannot be counted in your framework might be countable in mine. But I will concede this: if the office cannot receive feedback about the leaking pipe, the framework is useless.

  **Friedrich:** And I will concede this: if the market leaves families in the cold because they cannot pay, the discovery procedure has failed humanity.

  **Elsa:** Then here is what would move me. Show me a model where price signals account for externalities like public health without state intervention. If you can formalize that, I will accept your framework as more coordinatable.

  **Friedrich:** And here is what would move me. Show me a feedback loop in your central office that is faster than a price signal. If you can demonstrate that the office learns faster than the market, I will accept your proposal. Until then, I must insist that the dispersion of knowledge is not a bug of our current framework, but a feature of reality itself.

  **Elsa:** (Sips her coffee) A feature of reality, or a feature of the capitalist framework? We will see come January.

  **Friedrich:** We will. And the cold will tell us who was speaking about facts, and who was speaking about wishes.
