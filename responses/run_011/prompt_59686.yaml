answer: |-
  To count as a rigorous bioethical tool, an account of the therapy/enhancement line must meet four desiderata. These aren't preferences; they are structural necessities for the distinction to do ethical work.

  1.  **Baseline Stability (Non-Negotiable):** The moral status of an intervention cannot flip solely because population statistics change.
      *   *Case (b):* If a cognitive booster becomes the statistical norm, the pill doesn't suddenly become "therapy" just because non-users are now "below average."
      *   *Why:* Ethical permissions shouldn't depend on neighbors' purchases. If the definition relies on statistical normality, justice becomes a moving target.
  2.  **Contextual Discrimination (Non-Negotiable):** The account must distinguish identical mechanisms based on history, intent, or relationship to harm.
      *   *Case (a):* The memory-blocking pill is therapy for the survivor (restoring pre-trauma equilibrium/preventing pathology) but enhancement for the soldier (optimizing beyond baseline).
      *   *Why:* Bioethics recognizes intent and history (e.g., self-defense vs. murder). A mechanism-only view collapses morally distinct acts.
  3.  **Normative Transparency (Up for Grabs):** The account must admit when "dysfunction" is biological fact versus social disadvantage.
      *   *Case (c):* Short stature is biological variation; the disadvantage is often social. The theory must clarify whether it treats the body or the bias.
      *   *Why:* Otherwise, medicine covertly enforces social norms under the guise of fixing biology.
  4.  **Moral Cash Value (Non-Negotiable):** The label must track ethical obligations (e.g., insurance coverage, permission, priority).
      *   *Why:* If calling something "enhancement" doesn't change our duties regarding justice or access, the distinction is semantic noise.

  **The Trade-Off:** You likely cannot satisfy **Baseline Stability** and **Contextual Discrimination** simultaneously. A fixed biological baseline handles Case (b) but struggles to explain why the same drug is therapy for the survivor but not the soldier (Case a) without appealing to contextual norms. Conversely, a context-sensitive baseline handles Case (a) but risks the statistical drift of Case (b).

  **Account Evaluation:**
  The **Prevent Harm** account performs best. It handles Case (a) by distinguishing trauma prevention from optimization, and Case (b) by anchoring status to harm rather than statistics. **Restore Normal Function** (Daniels) fails Case (b) because "normal" shifts with prevalence. **Welfare-based** accounts collapse the distinction entirely (if it helps, it's good). **Consent-based** accounts ignore the structural justice issues required by Desideratum 4.

  Verdict: Baseline Stability.
