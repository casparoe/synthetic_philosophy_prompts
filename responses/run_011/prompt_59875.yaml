answer: |-
  It is good to hear from you, and I am glad you are taking the philosophy seminar even if the motivation was initially just to escape the building, since this intersection is exactly where the most interesting friction occurs. You are right to be suspicious of the essay, and your intuition that the first half is defensible while the last third is over-egged is much closer to the truth than your friend's dismissal, though your friend is not entirely wrong about the mathematical simplicity of the result. To start with the technical core, when the author writes that "Average over every possible target function a learner might have to fit, and any two learning algorithms have exactly the same expected error," they are stating the standard No-Free-Lunch theorem accurately, provided you emphasize the phrase every possible target function. This condition is doing all the heavy lifting, because the space of all possible functions includes every conceivable mapping from inputs to outputs, most of which are unstructured noise or uncomputable gibberish. Under a uniform prior over this vast space, it is indeed true that "deep nets, Bayesian inference, a random-guess oracle — averaged across the space of all possible problems they are indistinguishable," because without assuming any structure in the data, no algorithm can distinguish signal from noise better than another. The extension to optimization is also correct, so when the text says "over all possible fitness landscapes, no optimizer beats blind guessing," a specialist would sign off on that as a faithful summary of Wolpert and Macready.

  Where the essay begins to slide from technical summary to philosophical editorializing is in the explanation of the mechanism. The claim that "whatever advantage an algorithm picks up on one set of problems is paid for, dollar for dollar, by a corresponding loss on the rest, so the theorem is a literal conservation law" is a fair heuristic for understanding the symmetry argument, though calling it a literal conservation law is slightly metaphorical since it relies on the specific choice of a uniform measure over function space. However, the real trouble starts when the author attempts to weld this to epistemology, asserting that "this is at last the rigorous version of what Hume was groping toward." This is a category error that a philosopher of science would wince at, because the No-Free-Lunch theorem demonstrates the necessity of inductive bias, whereas Hume's problem concerns the justification of that bias. The theorem shows you cannot learn without assuming the future resembles the past, but it does not show that "all of them tie" in any meaningful sense outside the specific mathematical setup where you assign equal probability to every conceivable universe. Hume asks why we are justified in privileging regularity over randomness, and the theorem simply replies that if you do not privilege regularity, you learn nothing. It formalizes the dependence on assumptions, but it does not solve the circularity problem Hume identified, because the theorem itself assumes a uniform prior to generate the tie, which is itself an assumption that requires justification.

  Moving into the practical implications, the essay becomes significantly more problematic. When the author argues that "Any benchmark on which one method beats another is measuring nothing about the methods themselves, only about the particular slice of function space that benchmark happens to sample," they are presenting a false dichotomy that ignores the relationship between algorithm and data. A benchmark measures the alignment between the inductive bias of the method and the structure of the data distribution, which is very much a fact about the methods themselves. Consequently, the claim that "when deep networks dominate image classification, that is a fact about image datasets and not about deep learning" is misleading, because it is a fact about the interaction between the two. Deep learning architectures possess specific biases toward compositionality and locality that happen to match the structure of natural images, and saying this success gives "no warrant at all that the same architecture will handle the next problem you hand it" is an exaggeration; it gives no warrant for arbitrary problems, but it gives strong empirical warrant for problems drawn from similar natural distributions.

  The final stretch of the passage is where the cynicism overtakes the analysis, particularly when the author suggests that "The whole business of inductive bias — the idea that some priors are simply better than others — turns out to be a confession that we picked a prior we happen to like." This dismisses the entire field of statistical learning theory, which provides grounds for preferring certain priors based on simplicity, compressibility, or stability, rather than mere preference. While it is technically true that "There is no such thing as a generally better learner, and there never can be" if you define generally better as performing well on all possible functions, this is a trivial truth that does not apply to the subset of functions that describe our physical reality. Your friend is correct that the theorem is mathematically trivial in the sense that it is essentially a symmetry argument or a counting exercise, but they are wrong to imply that this triviality negates the essay's errors; the essay fails not because the math is deep, but because it misapplies a result about all possible worlds to our specific world.

  So to answer your question about what survives once the errors are corrected, the core insight that learning is impossible without assumptions remains robust, and the warning that benchmark performance does not guarantee universal success is valid. However, the stronger claim that benchmarks measure nothing about the methods is false, and the suggestion that inductive bias is merely aesthetic preference is untenable. We are justified in preferring biases that have worked on similar problems in the past, not because the No-Free-Lunch theorem validates them, but because we have empirical evidence that our universe is not drawn from a uniform distribution over all possible functions. The essay is useful for reminding us that our success is contingent on the world being learnable, but it is wrong to suggest that this contingency renders our methods arbitrary or our benchmarks meaningless. You should trust your instinct that the mathematical setup is sound but the philosophical export is overstated, as the theorem delineates the boundary of learning rather than dissolving the practice of it.
