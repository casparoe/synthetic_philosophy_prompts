  **OFFERING MEMORANDUM**

  **Issuer:** Britannia Human Capital Securitisation PLC
  **Sponsor:** Albion Private Equity Partners
  **Advisor:** The Centre for Pedagogic Market Efficiency

  **1. Cover Summary**
  This memorandum relates to the issuance of income-contingent notes by Britannia Human Capital Securitisation PLC (the Issuer). The Notes are backed by a pooled portfolio of future graduate contributions. The transaction structure follows the advisory framework of the Centre for Pedagogic Market Efficiency, which posits that higher education constitutes a private investment good and the student a rational purchaser of future earning capacity. The Issuer seeks to monetise the spread between the cost of instruction and the lifetime premium attributable to credential acquisition.

  **2. Use of Proceeds**
  Net proceeds from the issuance will be utilised to refinance existing loan books held by the Sponsor, thereby recycling capital into further origination of student finance agreements. Remaining funds will cover transaction costs, servicing fees, and reserve account capitalisation required to meet liquidity covenants during periods of elevated borrower unemployment.

  **3. Capital Structure**
  The Notes are issued in two distinct tranches, segregated by academic discipline and associated earnings volatility.
  *   **Class A Senior Notes:** Backed by receivables from graduates of disciplines exhibiting the least dispersed earnings distributions, typically including quantitative sciences, law, and clinical medicine. These tranches possess priority claim on cash flows.
  *   **Class B Subordinated Notes:** Composed of the remainder of the portfolio, including humanities, arts, and social sciences. These tranches absorb initial losses resulting from income variance or repayment holidays.

  **4. Risk Factors**
  Investors should consider the following risks before purchasing Notes:

  1.  **Macroeconomic Correlation:** Unlike mortgage-backed securities, where default risk is idiosyncratic, borrower repayment capacity here is highly correlated. A systemic contraction in the labour market will simultaneously depress earnings across the entire cohort, reducing diversification benefits.
  2.  **Legislative Continuity:** The revenue model depends on statutory powers to collect contributions via the tax system. A change in government policy could alter collection thresholds, freeze repayments, or abolish the regime entirely.
  3.  **Sovereign Underwriting:** While obligations are nominally contingent on individual earnings, the structural integrity of the programme relies on sovereign guarantees. Investors must acknowledge that the ultimate source of repayment may prove to be the taxpayer rather than the borrower, should aggregate graduate income fail to meet servicing requirements.
  4.  **Geographic Attrition:** Borrowers may emigrate to jurisdictions with no reciprocal collection agreements. The Issuer cannot enforce claims against assets held abroad, leading to permanent leakage of expected cash flows.
  5.  **Occupational Substitution:** Graduates may opt for low-paid caring or creative work despite earning capacity. The income-contingent mechanism protects the borrower from hardship, but this protection simultaneously renders the cash flow stream difficult to price accurately.
  6.  **Collateral Enforcement:** Human capital cannot be seized or liquidated upon default. The Issuer possesses no physical security, relying solely on the borrower's continued participation in the formal economy.
  7.  **Demographic Volatility:** The value of the underlying asset pool is contingent on a steady supply of eighteen-year-olds entering higher education. Declining birth rates or shifts in participation preferences will reduce origination volume.
  8.  **International Precedent:** The existence of free-tuition systems in comparable economies demonstrates that this asset class need not exist. Such jurisdictions function not merely as competitors for student recruitment, but as proof of policy reversibility.
  9.  **Data Latency:** Earnings data is reported with a significant lag. The Issuer may be unable to adjust provisioning in real-time following sudden economic shocks.
  10. **Moral Hazard:** Institutions may be incentivised to recruit students into high-fee courses with poor employment outcomes, knowing the downside risk is borne by the securitisation vehicle and ultimately the state.

  **5. Regulatory Note**
  This document is for information purposes only and does not constitute an offer to sell or a solicitation of an offer to buy securities in any jurisdiction where such offer or solicitation would be unlawful. The Notes have not been approved by any financial conduct authority. Potential investors should seek independent advice regarding the suitability of investing in human capital derivatives. The Issuer accepts no liability for any loss arising from the use of this memorandum or its contents.
