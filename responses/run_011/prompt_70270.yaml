answer: |-
  This is a sophisticated piece of moral reasoning, and your friend has constructed a classic *reductio ad absurdum*. He takes the "man of his time" (MoT) defence, formalises its underlying assumptions, shows that those assumptions lead to moral nihilism (10), and since nihilism is unacceptable (11), he concludes the MoT defence must be entirely discarded in favour of strict presentism (12).

  You are right to feel trapped. The argument is valid in its internal logic, but it relies on smuggling in a hard determinism at the start and a false dichotomy at the end. Since you wish to retain (1) (the knowledge condition for blame) and (11) (the intuition that abolitionists and slaveholders differ morally), you must locate the break in the machinery between them.

  Here is the diagnosis of where the argument fails, the price of fixing it, and the answers to your two further questions.

  ### 1. The Reading of Step (1)
  To make the rest of this diagnosis work, we must fix the meaning of "could reasonably have been expected to know" in step (1).

  *   **The Friend's Reading (Sociological):** "Reasonably expected" means "statistically predictable." Given the norms of 1776 Virginia, was it predictable that Jefferson would accept slavery? If yes, he couldn't reasonably be expected to know better.
  *   **The Required Reading (Normative):** "Reasonably expected" means "within the moral reach of their agency." It asks: Did the agent have the *capacity* to interrogate their norms, and did they have *access* to the moral concepts required to do so?

  You must insist on the **Normative Reading**. If you accept the Sociological Reading, you have already conceded the argument to your friend, because sociology describes what *is*, while morality prescribes what *ought* to be. Step (1) is a principle of *fairness*, not a principle of *prediction*.

  ### 2. Diagnosing the Break: Which Steps to Reject?

  There are two critical points of failure. One is philosophical (Step 3), and one is empirical (Step 6). You should reject both, but Step 3 is the root cause.

  #### **Primary Break: Step (3)**
  > *(3) Interpretive norms are not chosen; they are absorbed from the community in which one is raised and in which one's conduct is judged.*

  *   **Why it looks acceptable in isolation:** It is sociologically true that we do not choose our starting point. We inherit language, customs, and moral intuitions from our parents and peers. No one invents morality from scratch.
  *   **Why it fails in context:** It conflates *inheritance* with *imprisonment*. It treats agents as passive vessels rather than reflective thinkers. While norms are absorbed, they are not sealed. Human agents have the capacity to notice contradictions within their own normative framework (e.g., "All men are created equal" vs. "I own men"). Step (3) assumes that because norms are *received*, they cannot be *reviewed*.
  *   **The Price Tag:** By rejecting (3), you accept that moral agency involves a duty to interrogate one's inheritance. You lose the comfort of saying "they literally couldn't help it." You must acknowledge that even within a restrictive society, there is a margin of moral freedom. However, you retain the fairness of (1) because you are only blaming them for failures of reflection they were capable of making.
  *   **Is this loss worse than (10)?** Yes. (10) destroys the concept of moral progress. If norms are never chosen, the abolitionist is no better than the slaveholder, just different. Rejecting (3) saves the idea that moral insight is an achievement, not just a lottery ticket.

  #### **Secondary Break: Step (6)**
  > *(6) ...dissent that is socially marginal, dangerous to voice, or addressed to an audience unable to act on it never enters the ordinary agent's epistemic situation in a usable form...*

  *   **Why it looks acceptable in isolation:** It protects vulnerable people. It acknowledges that a peasant in 1300 cannot be blamed for not reading a pamphlet that doesn't exist, or a dissenter in a totalitarian state cannot be blamed for not speaking out when it means death. It defines "reasonable" sensitively.
  *   **Why it fails in context:** It is empirically false for the specific agents you are discussing (Jefferson, Churchill, Columbus). These were not "ordinary agents" in the sense of having restricted access. Jefferson had access to abolitionist arguments (he corresponded with them); Churchill had access to reports on Bengal; Columbus had access to priests who criticised his conduct (like Las Casas, later, but also contemporaries). Step (6) generalises a constraint that applies to the powerless onto the powerful.
  *   **The Price Tag:** By rejecting (6), you accept that epistemic situations are *scalar* based on power and privilege. A wealthy, educated, male elite has a larger "epistemic situation" than a peasant. You lose the idea of a uniform standard of "what was available." You must judge Jefferson by what was available *to Jefferson*, not to his slaves.
  *   **Is this loss worse than (12)?** No. (12) claims context *never* mitigates. Rejecting (6) allows context to mitigate for the powerless while holding the powerful accountable. This is fairer than (12).

  #### **The Logical Gap: The Move to (12)**
  Even if you accept your friend's derivation up to (11), step (12) does not follow.
  *   **The Error:** False Dichotomy. The friend argues: Either MoT is absolute (leading to 10), or MoT is non-existent (12).
  *   **The Reality:** MoT can be *partial*. Context can mitigate blame without erasing it. Jefferson is less blameworthy than a hypothetical slaveholder who knew slavery was wrong and did it anyway, but more blameworthy than a slave who enforced the rules under threat of death.
  *   **The Price Tag:** You lose binary clarity. You cannot simply say "Guilty" or "Innocent." You must deal in degrees of culpability. This is harder for plaque-writing, but it is more truthful.

  ### 3. Answering Your Two Further Questions

  #### **First Question: Does the argument still do useful work?**
  Yes. It successfully kills the **Strong Exculpatory Version** of the MoT defence, but it leaves the **Weak Mitigating Version** standing.

  *   **Strong Exculpatory Version:** "He lived in a time when slavery was normal, therefore he did nothing wrong." (This is what your friend's argument destroys).
  *   **Weak Mitigating Version:** "He lived in a time when slavery was normal, which makes his failure to oppose it less surprising and perhaps less malicious than it would be today, but it does not erase the harm." (This survives).

  **Application to your three cases:**
  1.  **Jefferson:** The Strong Defence fails. He wrote the words "all men are created equal" while owning people. The contradiction was internal to his own normative framework. He had access to dissent. The Weak Defence applies only to the *scale* of his imagination—he could not envision a multiracial democracy—but it does not excuse the ownership.
  2.  **Churchill:** The Strong Defence fails. Reports of the Bengal famine were available; the moral norm against mass starvation was not contested in the way slavery was in 1776. However, the Weak Defence applies to the *prioritisation* of resources during a total war. The epistemic situation was clouded by war, but not closed.
  3.  **Columbus:** Here the Strong Defence has more traction, but still fails on cruelty. The epistemic situation regarding "rights of indigenous peoples" was genuinely contested (the Valladolid debate came later). However, the norm against *torture* and *mutilation* was not contested in 15th-century Spain. He can be judged by the norms of his own community regarding cruelty, even if not by norms of colonialism.

  #### **Second Question: Is (9) actually needed for (10), and does it follow?**
  *   **Is it needed?** Yes, for the full force of (10). If blame is possible but praise is not, we live in a cynical world, not a nihilistic one. (10) claims *both* lack proper objects.
  *   **Does it follow?** No. The symmetry between blame and praise is false.
      *   **Blame** usually attaches to violating a norm.
      *   **Praise** usually attaches to *exceeding* a norm.
      *   Step (9) claims conformity demands no insight. This is true. But it claims dissent is just "luck." This ignores that dissent often requires *effort*, *risk*, and *reasoning* that goes beyond temperament. An abolitionist risked social ostracisation; a slaveholder risked nothing. To say this difference is merely "luck" (upbringing) ignores the active choice to endure risk. Therefore, (9) fails, and (10) is weakened even if (8) were true.

  ### Summary Recommendation for the Group

  1.  **Accept (1)** but define "reasonable expectation" normatively (what they *could* have grasped), not sociologically (what they *did* grasp).
  2.  **Reject (3)**. Norms are inherited, but agency consists in the ability to reflect on them.
  3.  **Reject (6)** for elite actors. Access to dissent is a function of power.
  4.  **Reject (12)**. The failure of the Strong MoT defence does not prove Presentism. It proves **Contextual Accountability**: we judge them by the best moral resources *available to them*, not by ours, but we hold them responsible for using those resources.

  This allows you to say: "Jefferson is not a monster by 21st-century standards alone; he is a moral failure by 18th-century standards that he helped write." That is a more devastating critique than presentism, and it avoids the nihilism your friend fears.
