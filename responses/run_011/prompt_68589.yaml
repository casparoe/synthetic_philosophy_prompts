    "criterion_justification": "Logs provide causal context but cannot fix semantic reference without stable user intention.",
    "strongest_defense": "Fixed medical labels often fail to capture the unique qualitative character of chronic pain, so fluid vocabulary is necessary for accurate phenomenological reporting.",
    "redesign": [
      "Require a static text definition upon tag creation to anchor initial intent.",
      "Notify users when contextual data diverges significantly from a tag's original pattern.",
      "Allow users to retire or version tags rather than allowing silent semantic drift."
    ],
    "confidence": "high"
  }
