answer: |-
  The dust in the warehouse didn't settle. It hung in the shafts of light cutting through the high windows, a suspended grey fog that tasted like old paper and dry wool. Elias rubbed his eyes with the back of a gloved hand. He had been working for six hours. He had filled three bins. The warehouse looked exactly as full as it had when he started.

  Mr. Henderson sat at the metal desk near the bay door, a ledger open in front of him. He was a thin man who wore his suit like armor, crisp and unmoving despite the heat. He wasn't family, but he represented the estate's legal interests, which amounted to the same thing: oversight.

  "Box four-oh-nine," Henderson said without looking up. "Status."

  "Done," Elias said. His voice sounded rough, unused. "Kept the left boot. Discarded the right."

  Henderson's pen scratched against the paper. "Rule: Left bias on footwear. Noted."

  Elias moved to the next box. This one was smaller. Inside lay a pair of grey socks. They were identical. Not just similar—identical. Same wear on the heel, same faint pull in the weave, same fold. Elias reached in. His hand hovered. There was no left sock. There was no right sock. There was just sock and sock.

  He grabbed one. It felt warm from the box. He tossed it into the Keep bin. The other went to Discard.

  "Box four-ten," Henderson said. "Selection criteria?"

  Elias paused. "Just... one of them."

  "That isn't a criteria, Elias." Henderson finally looked up. His glasses caught the light, hiding his eyes. "We agreed on a protocol. For every container, there must be a distinguishing feature that dictates the selection. If you cannot define the difference, you cannot justify the division."

  "They're socks," Elias said. "They're the same."

  "Then there is no rule." Henderson tapped the ledger. "If there is no rule, the selection is arbitrary. If it is arbitrary, it is not a valid division. It's just noise. Write down the rule."

  "There isn't one."

  "Then put them both back."

  Elias stared at the bin. He knew if he put them back, he would have to open the box again tomorrow. And the day after. He knew, with a cold certainty in his gut, that he could spend the rest of his life opening that box and putting the socks back, and he would never be any closer to emptying the warehouse.

  He looked out over the rows of shelving. They stretched back into the shadows. There were thousands of boxes. Maybe millions. They were stacked floor to ceiling, aisle upon aisle. When he tried to count them, starting from the door, the numbers slipped away. He would reach *three hundred* and forget if he had skipped an aisle. He would try to mark the end of a row, but every row looked like the last. It wasn't just that there were too many; it was that they didn't seem to have an order. You couldn't say this box came before that one, not really. They just *were*.

  "It's too much," Elias said. "We'll die before we list it all."

  "The list is the only thing that makes it real," Henderson said softly. "If you cannot write the rule that governs the taking, then you haven't taken anything. You've just moved dust."

  Elias walked down the aisle. His boots scuffed on the concrete. He passed boxes labeled *Kitchen*, *Linens*, *Misc*. He stopped at a box marked *Pairs*. Inside were dozens of small items. Stone bookends. Identical ceramic birds. Pairs of keys where neither looked like the master.

  He started working. He didn't ask Henderson. He just picked. One bird kept, one discarded. One key kept, one discarded. He didn't look for a scratch or a chip. He didn't weigh them. He let his hand decide. His hand wanted the one on the left, then the one on the right, then the one closer to the edge. There was no pattern. He knew there was no pattern. If Henderson asked him to predict the next choice, he couldn't.

  But the pile of Keep items grew. The box emptied.

  He moved to the next box. And the next.

  The dread wasn't in the work. It was in the silence between the boxes. It was the feeling that the warehouse was resisting being counted. He tried to make a list in his notebook, just for himself. *Box 1. Box 2. Box 3.* But by Box 50, he realized he couldn't prove he hadn't missed Box 24. The aisles didn't have numbers. The boxes didn't have dates. They were a collection that refused to be a sequence. You could walk through them, yes. You could touch them. But you couldn't line them up. If you tried to split the warehouse in half—yours and mine—you couldn't find the line. Any line you drew would cut through a box, or leave a gap, or favor one side with the heavier items, the sharper memories.

  He found a box of photographs. Hundreds of them. Faces he half-remembered. His uncle's face.

  Henderson came up behind him. "You aren't logging the criteria."

  "I'm logging the result," Elias said. He placed a photo in the Keep pile. A woman in a summer dress.

  "Which one was that?"

  "The one on top."

  "And the next?"

  "The one underneath."

  "That is a sequence," Henderson said. "Top to bottom. That is a rule. I can write that down."

  Elias shuffled the photos. He mixed them up. Now there was no top. There was just a stack. He picked one from the middle.

  "Now what is the rule?" Henderson asked. His voice wasn't angry. It sounded tired. "If you cannot say why you picked this one over that one, then the choice doesn't exist. It's a ghost. You are building an inheritance on ghosts."

  "It's done," Elias said. "The box is empty. One pile there, one pile here."

  "It's not divided," Henderson insisted. "It's scattered. A division requires a boundary. A boundary requires a definition. You can't define this." He gestured to the shuffled photos. "There is no function here. There is no way to map the input to the output without... without just pointing."

  "So I point."

  "You can't point at everything, Elias. There isn't enough time. There isn't enough *you*."

  Elias looked at his hands. They were grey with dust. He thought about his aunt, back at the house, trying to label the spice jars. She wanted to know which spoon belonged to which set. She wanted to know why he kept the chipped mug and not the perfect one. *Because I held it,* he wanted to say. *Because it was the first one I touched.* But that wasn't a rule. That was an accident.

  He walked deeper into the warehouse. The air got colder. The boxes here were older. The cardboard was soft, crumbling at the edges. He opened one. Inside were hundreds of small, wooden blocks. All identical. Sanded smooth. Unmarked.

  He needed to keep one. He needed to discard one.

  He reached in. His fingers brushed the wood. They were all smooth. All light. All waiting.

  If he took one, how would he know he hadn't taken it before? They had no names. They had no numbers. If he took one for himself and one for the estate, how could he prove they were different? They were distinct objects, physically separate, but there was no way to tell them apart. No way to list them. No way to say *this one first, that one second*.

  The silence of the warehouse pressed in. It was the silence of things that existed but couldn't be counted. If he tried to line them up, they would slip out of order. If he tried to split them into two endless piles, one pile would always feel heavier, not in weight, but in presence. He could feel the imbalance. He could feel the universe tilting because he was making choices that had no reason.

  Henderson was watching him from the end of the aisle. He held the ledger open. The pages were mostly blank.

  "If you do this," Henderson said, "if you take without a rule... you break the chain. The estate requires continuity. It requires that the next person knows why the thing is here. If you can't tell them why, it's as if it wasn't inherited. It's as if you found it on the street."

  "It's not on the street," Elias said. "It's in my hand."

  "Is it?" Henderson stepped closer. "Or is it just *a* block? If you can't distinguish it from the others, you don't own *this* block. You own the concept of a block. You can't live in a concept. You can't eat from it. You can't mourn with it."

  Elias looked at the block in his palm. It was warm now. It had picked up his heat. That was a difference. But once he put it down, the heat would fade. The difference would vanish.

  He thought about the grief. It was like this warehouse. You couldn't sort it. You couldn't say *this hour is for sadness, this hour is for anger*. It didn't come in boxes with labels. It came in a heap. You grabbed what you could carry. You left the rest. If you tried to make a rule for grief, you died waiting. If you just lived it, you lost the map.

  "I can't write the rule," Elias said.

  "Then stop," Henderson said. "Close the box. Leave it. We will come back when we have a system."

  "There isn't a system," Elias said. "There's just this much stuff. And I'm the one who has to move it."

  "If you move it without a map, you are lost."

  "I'm already lost," Elias said. "Look at this place." He swept his arm toward the shadows. "You want me to number the dust motes. You want me to tell you which sock is which. I can't. But I can take them."

  He picked up the block. He put it in his pocket. He picked up another block. He put it in the Discard bin.

  He didn't write it down.

  Henderson closed the ledger. The sound was like a gunshot in the quiet warehouse. "Then the record is incomplete. The division is invalid. Legally, spiritually, practically. You are taking property that hasn't been assigned."

  "It's assigned," Elias said. "I assigned it."

  "By what right?"

  "By the fact that I'm here," Elias said. "And you're there. And the box is empty."

  He moved to the next box. And the next. He worked faster now. He stopped looking for differences. He stopped trying to find the left shoe or the top photo. He just reached. His hand became the rule. His presence was the function.

  *Take this. Leave that.*

  The warehouse didn't shrink. The aisles still stretched into the dark. The boxes still had no numbers. He knew he would never finish. He knew that even if he worked until his hands gave out, there would be more boxes behind the ones he cleared. The collection was too vast to be exhausted. It was too indistinct to be counted.

  But the bin beside him was full.

  Henderson stood by the door. He didn't stop him. He just watched, holding the blank ledger. He looked like a man waiting for a train that had already left the station.

  " You know what this costs," Henderson said finally.

  Elias knew. It cost the certainty. It cost the ability to look back and say *this was fair*. It cost the clean line between what was his and what was the estate's. There would always be a question mark over every object he kept. Every sock, every block, every photo would carry the whisper: *Why this one?* And there would be no answer. Just the memory of a hand reaching into a box.

  "It costs the story," Elias said. "We don't get the story."

  "No," Henderson agreed. "You get the things. You don't get the story."

  Elias zipped up his jacket. He picked up the Keep bin. It was heavy. It was real. It was full of things he couldn't fully describe, taken from boxes he couldn't fully count, using a method he couldn't explain.

  He walked past Henderson toward the door. The light from outside was bright, harsh, unfiltered. It made the dust on his clothes visible, a halo of grey around a tired man.

  "Will you come back?" Henderson asked.

  "No," Elias said. "There's nothing left to log."

  "The ledger is empty, Elias."

  "I know," Elias said. He stepped out into the sun. The air was cold and clean. He put his hand in his pocket and touched the wooden block. It was smooth. It was warm. It was indistinguishable from a thousand others, but it was the one he had.

  He walked to his car. He didn't look back at the warehouse. He knew if he looked, he would see the rows stretching out again, endless and unnumbered, waiting for a rule that would never come. He started the engine. He drove away with the things he had taken, and the silence of the things he hadn't, and the knowledge that the division was done, even if it could never be written down.
