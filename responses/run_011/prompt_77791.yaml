answer: |-
  To the Ethics Committee:

  You are right to pause. In institutional documents, moral terminology is not merely descriptive; it is performative. It shapes expectation, liability, and conscience. Before we assess your colleague's objections, we must establish what the concept of "beyond the call of duty" (supererogation) is supposed to *do* for you. If it cannot do the work below, it is decorative at best and coercive at worst.

  ### Diagnostic: Failure Modes in Institutional Settings

  To derive the requirements, I first sketch the characteristic ways this concept fails when imported into policy or patient materials.

  1.  **The Euphemism Failure:** The phrase is used to mean "optional," but carries the rhetorical weight of "holy." It softens the refusal ("I'm not failing my duty") while inflating the acceptance ("I am a saint"). This creates a guilt asymmetry: the donor who refuses feels they missed a moral peak; the donor who agrees feels they have transcended normal morality, which can complicate post-operative regret.
  2.  **The Theoretical Smuggle:** The document assumes a pluralist or deontological morality (where duties have limits) while serving a population that may hold strict religious or consequentialist views (where duty is unlimited). You risk asserting a moral boundary that some donors do not recognize, making the "permission not to donate" feel like a lie.
  3.  **The Relational Trap:** By marking nondirected donation as "beyond duty" but implying directed donation is "what families do," you risk converting a moral description into a social mandate. If "beyond duty" shifts based on relationship, it implies the duty shifts too. This can coerce family members who feel they *must* meet the baseline duty, while strangers feel they have no reason to engage at all.
  4.  **Category Inflation:** If every kindness is "beyond duty," the term loses its protective force. It must distinguish between holding a door (polite) and donating a kidney (sacrificial). If the category inflates, it no longer signals significant risk or cost.

  ### Desiderata for an Adequate Account

  Here are the requirements any definition of "beyond the call of duty" must meet to be safe for use in your donor materials.

  **1. The Asymmetry of Assessment**
  *   **Requirement:** The account must sustain a gap between the evaluation of the act and the evaluation of the omission. Performing the act must merit positive moral appraisal (praise/honor); omitting the act must not merit negative moral appraisal (blame/guilt).
  *   **Motivation:** This rules out the "Euphemism Failure." If omitting the act attracts blame, it is a duty, not a supererogatory act. This covers the **firefighter** case: we praise the re-entry, but we do not blame the firefighter who follows safety protocols and stays out. It must also cover the **failed rescue**: if the rescuer tries at great cost but the victim dies, the rescuer is still praised, and the non-rescuer is not blamed (provided they weren't the assigned lifeguard).
  *   **Status:** **Non-negotiable.** Without this, you are not describing supererogation; you are describing imperfect duties or poorly enforced obligations.

  **2. The Significant Cost Threshold**
  *   **Requirement:** The account must specify that the act involves a non-trivial sacrifice, risk, or cost to the agent that is not offset by the agent's own gain.
  *   **Motivation:** This prevents **Category Inflation**. It distinguishes the kidney donor from the person who **offers a small, recurring kindness to a stranger** (e.g., smiling at commuters). The latter is good, but if it costs nothing, calling it "beyond duty" dilutes the term. The threshold explains why we don't call every permissible good deed supererogatory.
  *   **Status:** **Non-negotiable.** For kidney donation, the cost (surgery, risk, recovery) is the primary ethical hinge.

  **3. Role-Sensitivity without Coercion**
  *   **Requirement:** The account must allow that duties vary by relationship (e.g., parent to child) without implying that the *absence* of a relationship negates all moral reason to act, or that the *presence* of a relationship guarantees obligation.
  *   **Motivation:** This addresses the **Relational Trap** and your colleague's second objection. It must explain why **directed donation to a sibling** might feel more obligatory than nondirected donation, without making the sibling donation *mandatory* in a way that invites blame for refusal. It must distinguish between an act being **admirable overall** versus **admirable in one respect while violating a duty in another** (e.g., donating a kidney meant for a child to a stranger might be admirable as charity but blameworthy as neglect).
  *   **Status:** **Non-negotiable.** You cannot write donor materials that ignore family dynamics, but you must not encode coercion.

  **4. Theoretical Agnosticism**
  *   **Requirement:** The definition should not presuppose the truth of a specific meta-ethical theory (e.g., it should not rely on the existence of agent-centered prerogatives that a consequentialist would reject).
  *   **Motivation:** Hospitals serve diverse populations. You wish to stay **neutral among consequentialist, contractualist, and pluralist accounts**. The document should not tell a donor, "Your morality says you don't have to do this," if their morality says, "I must maximize the good."
  *   **Status:** **Preference (Pluralist Camp).** I flag this as a preference because it may be incompatible with Requirement 1 (see Inconsistency below).

  **5. The Suberogatory Mirror**
  *   **Requirement:** Ideally, the account should generate a mirror category for acts that are bad but not forbidden (suberogatory), such as selfishness that harms no one's rights but violates community trust.
  *   **Motivation:** Structural symmetry helps clarify the "good" category. It helps explain **acts that are bad yet not forbidden**. However, for donor materials, focusing on the "bad" side might be counterproductive (fear-based).
  *   **Status:** **Preference.** Useful for internal ethics training, less critical for patient-facing documents.

  **6. The Inflation Check (Non-Universalizability)**
  *   **Requirement:** The account must explain why an act can be **obligatory if everyone performed it but optional when only one person does** (collective action problems), without collapsing into a requirement that the individual *must* act as if everyone else were.
  *   **Motivation:** Prevents the "If everyone did it" guilt trip. If kidney donation were universalized, organ failure would vanish. But requiring one person to solve a systemic problem is unfair. The account must protect the individual from the demands of the ideal.
  *   **Status:** **Non-negotiable.** This is essential to protect donors from systemic guilt.

  ### Inconsistency Flag: The Impossibility Result

  I must be plain: **Requirement 1 (Asymmetry)** and **Requirement 4 (Theoretical Agnosticism)** cannot be jointly satisfied.

  *   **Why:** Strict act-consequentialism (a valid moral theory) denies the Asymmetry. On this view, if you can save a life at acceptable cost to yourself, you *ought* to do it. Omission is blameworthy. Therefore, on this view, the category of "beyond the call of duty" does not exist; it is merely "duty we are too weak to perform."
  *   **The Conflict:** If you demand the category exist (Req 1), you are implicitly rejecting strict consequentialism. If you demand neutrality (Req 4), you cannot assert the category as a robust moral fact, only as a social convention.
  *   **Resolution:** You must drop **Requirement 4**. You cannot be neutral between a theory that says "Not donating is wrong" and a document that says "Not donating is blameless." To use the phrase "beyond the call of duty" with normative force, you are implicitly endorsing a non-maximizing morality (one that allows agent-centered prerogatives).
  *   **Recommendation:** State explicitly in the materials that the hospital operates on a framework that recognizes limits to moral demand, rather than claiming this is a universal moral truth.

  ### Evaluation of Broad Ethical Families

  Given the requirements above (specifically dropping Agnosticism to save Asymmetry), here is how the broad families of positions fare:

  1.  **Optimizing Views (Strict Consequentialism):**
      *   **Verdict:** **Fail.**
      *   **Reason:** They are eliminated by **Requirement 1 (Asymmetry)**. They cannot account for praise without blame. For them, the "call of duty" extends as far as the agent's ability to produce good. They view supererogation as a psychological comfort, not a moral reality.
  2.  **Deontological/Pluralist Views (Duty with Limits):**
      *   **Verdict:** **Best Fit.**
      *   **Reason:** They naturally accommodate the **Cost Threshold** and **Asymmetry**. They posit that morality consists of constraints (do not harm) and duties (keep promises), but leaves a "zone of discretion" where agents are free to sacrifice more than required. They handle the **firefighter** and **kidney donor** cases well by appealing to the limit of what can be demanded.
  3.  **Virtue Ethics (Character-Based):**
      *   **Verdict:** **Mixed.**
      *   **Reason:** They handle the **admiration** aspect well but struggle with the **blame** aspect. A virtue ethicist might say omitting the act reveals a lack of generosity, which is a kind of criticism, even if not "blame" in the deontic sense. This risks violating the "no blame" clause of Requirement 1.

  **The Single Eliminator:** **Requirement 1 (The Asymmetry of Assessment)** eliminates the most candidates. It is the hardest constraint for maximizing theories to bear.

  ### Standing and Confidence

  **Confidence in Requirements:**
  *   **Asymmetry (Req 1):** 95% confident this is non-negotiable. Without it, the phrase is misleading.
  *   **Cost Threshold (Req 2):** 90% confident. Essential for distinguishing donation from trivial aid.
  *   **Role-Sensitivity (Req 3):** 85% confident. Necessary for real-world application, though theoretically messy.
  *   **Theoretical Agnosticism (Req 4):** 100% confident this must be *rejected* (as noted in the Inconsistency Flag). It is a prejudice of liberal administration to think we can be neutral on the structure of moral demand.

  **Point of Least Certainty:**
  I am least sure about the **Significant Cost Threshold (Req 2)** regarding its precision. I am 60% confident that a threshold is necessary, but I am uncertain whether the threshold is **vague** (a sliding scale) or **binary** (a specific line).
  *   **What would settle it:** Empirical data on donor regret and psychological harm. If donors who faced *low* cost but were told the act was "beyond duty" feel manipulated, the threshold must be higher. If donors facing *high* cost feel no special recognition, the threshold is too high. We need to know where the psychological "sacrifice" marker lands for the population, not just where the philosophical marker lands.

  ### Verdict on Colleague's Objections

  With these requirements on the table:

  **Objection 1 (The "Empty Label"/Consequentialist Critique) has more force.**
  *   **Confidence:** 85%.
  *   **Reasoning:** As shown in the Inconsistency Flag, you cannot use the category without taking a stand against maximizing theories. If you cannot defend the existence of the category (Req 1), the document is theoretically hollow. This is a foundational flaw.
  *   **Objection 2 (The Relativity Bug) is secondary.**
  *   **Reasoning:** Relativity (Req 3) is actually a feature we *need* (parents owe more to children), provided we manage the coercion risk. The problem isn't that duty shifts with relationship; the problem is if that shift is used to coerce. Objection 1 attacks the *existence* of the category; Objection 2 attacks its *application*. You must solve Existence before Application.

  **Final Advice:** Do not claim neutrality. Acknowledge that the hospital recognizes moral limits on what can be demanded of a person. This validates the "beyond duty" language without lying to donors who might believe they *ought* to maximize the good. Let them choose to exceed the limit; do not tell them the limit doesn't exist.
