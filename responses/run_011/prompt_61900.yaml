answer: |-
  Here is the 90-minute session plan.

  ### The Single Clause
  **"Overtime shall be distributed equally among qualified employees as far as practicable."**

  **Why this one:** It must look airtight first ("distributed equally") and only reveal its vagueness second ("as far as practicable"). If you start with obviously vague language (e.g., "work shall be assigned fairly"), they will dismiss the exercise immediately because they already assume management abuses vague language. You need them to feel the shock of a *specific* rule failing to dictate an outcome.

  ### The Sequence (90 Minutes)

  **1. The Setup: "The Map and the Territory" (0–15 mins)**
  *   **Activity:** Hand out a one-page grievance summary from 1998 where this clause was applied clearly (e.g., two guys, same skill, one got OT, grievance won).
  *   **Action:** Ask the room: "Why did we win this?" They will say: "Because the contract says equal distribution."
  *   **Dependency:** This establishes their baseline confidence: *Words + Past Facts = Obvious Outcome.* Do not challenge this yet. You need them to feel the solidity of the rule before you show the crack.

  **2. The Crack: The Novel Case (15–45 mins)**
  *   **Activity:** Introduce the *current* grievance. Same clause, but the context has changed (e.g., new technology means only three people are "qualified" now, or "practicable" now involves a budget freeze management didn't have in '98).
  *   **Action:** Draw two columns on the whiteboard: "Union Reading" and "Management Reading." Ask them to fill in the arguments for *both* sides using only the text and the 1998 precedent.
  *   **The Turn:** You will find that the 1998 precedent is compatible with *both* readings. In '98, "practicable" meant "shift coverage." Now, management says "practicable" means "budget compliance." Both fit the words. Both fit the history.
  *   **Dependency:** This relies on Phase 1. They must believe the rule *should* work for them to feel the frustration when it doesn't.
  *   **Misconception Check ("Words mean what they mean"):** When someone insists the words settle it, point to the "practicable" escape hatch. Show that "practicable" is a container that management is filling with different content than you are. The words haven't changed; the world underneath them has.

  **3. The Pivot: The Sharp Steward's Objection (45–60 mins)**
  *   **The Moment:** This is where the sharp steward asks: "If the text doesn't decide it, and the history fits both sides, why are we filing? We're just guessing."
  *   **Why here?** You have earned the right to answer this only because you have just proven the text is indeterminate. If you answered this in Phase 1, they wouldn't believe you. Now they are worried, so they are listening.
  *   **The Answer:** "We aren't filing because the contract *forces* them. We are filing because the contract *allows* us to stop them."
  *   **Key Concept:** Shift from **Discovery** (finding the true meaning) to **Construction** (building a meaning they have to accept). The grievance isn't a math problem; it's a demand. We file to force a negotiation where our reading becomes the reality because we have the power to make it costly for them to use theirs.
  *   **Misconception Check ("Company can do whatever"):** This is where you kill the nihilism. Just because the rule doesn't dictate an outcome doesn't mean *anything* goes. It means the outcome is decided by **power and consistency**, not just text. If we can show our reading preserves the *purpose* of the clause (fairness) better than theirs, we win. But we win by arguing, not by pointing.

  **4. The Tool: Arguing Without Certainty (60–80 mins)**
  *   **Activity:** Break into small groups. Give them the "Novel Case" again.
  *   **Task:** Do not ask them to find the "right" answer. Ask them to draft the three strongest arguments for why *their* definition of "practicable" is the one that should stick.
  *   **Constraint:** They cannot say "It clearly says..." They must say "It has always been understood..." or "The purpose of this clause is..."
  *   **Goal:** Move them from textualism to functionalism.

  **5. The Close (80–90 mins)**
  *   **Summary:** Reiterate that the contract is a weapon, not a map. A map tells you where the road is; a weapon is something you wield to clear the road.
  *   **Final Check:** (See below).

  ### What to Refuse to Get Into
  1.  **Arbitrator Psychology:** Do not let them drift into "What would the arbiter think?" This returns them to looking for an external authority to solve the paradox. Keep the focus on *their* argument at the table.
  2.  **Drafting History:** Do not discuss "what the negotiators intended in 1998." That is a rabbit hole of speculation that reinforces the idea that the *past* determines the *present*. You are teaching them that *current* practice determines the rule.
  3.  **Moral Truth:** Avoid arguing that the Union's reading is "more moral." Keep it to "more consistent with past practice" or "better for operational efficiency." Moral arguments sound weak in a grievance meeting; consistency arguments sound binding.

  ### The Final Question
  Do not ask: *"Does everyone understand?"* (They will nod to be polite).
  Do not ask: *"Is the contract vague?"* (They will say yes, but feel defeated).

  **Ask this:**
  > "Next week, management denies a grievance and says, 'The contract language doesn't support your position.' Based on today, what is the one thing you know they are actually saying?"

  **The Correct Answer (Got it):** "They are saying they have the power to enforce their reading, and we need to challenge it." (Recognizes the power dynamic).
  **The Wrong Answer (Spooked):** "They are saying the words are on their side." (Missed the point; still thinks words decide cases).
  **The Wrong Answer (Cynical):** "They are saying they can do whatever they want." (Missed the point; fell into nihilism).

  ### Why This Order Works
  1.  **Confidence:** You start where they live (winning grievances).
  2.  **Crisis:** You break their tool (the text) in a safe environment.
  3.  **Resolution:** You give them a new tool (power/consistency) before they panic.
  4.  **Application:** They practice using the new tool immediately.

  If you move the "Sharp Steward" section earlier, the room will fracture into cynicism before they understand the leverage. If you move it later, you've lost the energy of the room. It must land exactly when the realization hits that the text doesn't save them. That is the moment they are ready to hear that *they* save them.
