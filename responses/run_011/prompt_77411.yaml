      *   *Premise 1:* Individuals satisfy vNM axioms (representable by $U_i$).
      *   *Premise 2:* Society satisfies vNM axioms (representable by $W$).
      *   *Premise 3:* Weak Pareto (if everyone prefers $A$ to $B$, society prefers $A$ to $B$).
      *   *Conclusion:* $W = \sum a_i U_i + b$ (with $a_i \ge 0$).
      *   *Extension:* Symmetry $\rightarrow$ $a_i$ equal $\rightarrow$ Average Utilitarianism.
      *   *Extension:* Impartial Observer $\rightarrow$ fixes cardinalization.

  3.  **Brainstorming Critiques (Categorized as requested):**

      *   **Formal/Mathematical:**
          *   *Mongin's Critique:* The theorem requires the *same* subjective probabilities for everyone. If probabilities differ, Pareto + vNM implies dictatorship or probability mixing (not just utility mixing).
          *   *State-Dependent Utility:* If utility depends on the state (e.g., being dead vs. alive), vNM representation is trickier.
          *   *Non-Expected Utility:* If society violates Independence (e.g., Allais paradox), HAT fails. Prioritarianism often looks like non-linear transformation of utility, which violates Independence at the social level even if individuals satisfy it.
          *   *Separability:* Strong separability is often hidden in the "common state space" assumption.

      *   **Beliefs/Probabilities:**
          *   *Heterogeneous Priors:* If Alice thinks rain is 10% and Bob thinks 90%, and both prefer picnic to movie, does Society prefer picnic? HAT breaks or forces social probabilities to be a mix. This leads to the "spurious consensus" problem (Pareto based on conflicting reasons).
          *   *Ethics of Belief:* Should social welfare aggregate beliefs? Usually, we want to aggregate *interests*, not *errors*.

      *   **Auxiliary/Conceptual (Utility vs. Wellbeing):**
          *   *Preference Satisfaction vs. Welfare:* vNM utility measures preference satisfaction under risk, not necessarily *wellbeing* (hedonic, objective list, etc.). A drug addict might satisfy vNM axioms but their $U$ isn't welfare.
          *   *Adaptive Preferences:* People prefer what they expect to get. HAT codifies status quo biases.
          *   *The "Zero and Scale" Problem (User's Defense 1):* The Impartial Observer argument (Harsanyi's second theorem) is distinct from the Aggregation Theorem. Conflating them is a common error. The Aggregation Theorem *alone* leaves weights and scales indeterminate. The Impartial Observer argument *assumes* utilitarianism to derive the scales. It's circular if used to prove utilitarianism.

      *   **Empirical/Normative:**
          *   *Violations of Independence:* People aren't vNM agents. If the normative claim is "they *should* be," okay. But if social choices reflect ambiguity aversion (e.g., maxmin), HAT doesn't apply.
          *   *Ex Post Egalitarianism:* Epstein/Segal, Diamond. People care about the *distribution* of outcomes, not just the ex-ante prospect. This violates the social Independence axiom.

      *   **Meta/Predictive:**
