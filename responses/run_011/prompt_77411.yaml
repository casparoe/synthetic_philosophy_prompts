          2.  *Ex Ante/Ex Post:* Social evaluation *is* over prospects; denying this is changing the subject.
          3.  *Interpersonal Comparability:* Weights come from axioms + symmetry; no need for prior comparability.
      *   **Task:** Critique this position. Rank defeaters (fatal to awkward). Sort by kind (Formal, Beliefs, Auxiliary, Empirical, Meta/Predictive). Address specific technical questions (separability, non-additive aggregation, different probabilities, utility vs. wellbeing, empirical violations). Answer the meta-question: Does this predict anything falsifiable about non-utilitarian views? Is the claim a tautology/taxonomy?
