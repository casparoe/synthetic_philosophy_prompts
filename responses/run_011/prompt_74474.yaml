              2.  **Likelihood Ratios:** Experience constrains likelihood ratios, not posteriors directly (Van Fraassen, Field).
              3.  **Minimum Information/Entropy:** Choose the $q$ closest to $p$ (Minimize Kullback-Leibler divergence) subject to the constraint imposed by experience. This is the "Principle of Minimum Information."
