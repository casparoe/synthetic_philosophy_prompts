      *   *Rejecting (1):* If (1) is too strong (deterministic function), what replaces it? A normative constraint on the *triplet* (Prior, Evidence, Posterior). Rationality is a relation, not a function. Loss: You can't always say "You are irrational" just based on $p$ and $q$. You need to know the evidence. Gain: You avoid the "Input Problem."
