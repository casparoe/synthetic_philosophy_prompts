answer: |-
  You have not been reading badly. You have independently reconstructed a position known in the literature as **Epiphenomenalism**, specifically the variety argued for by T.H. Huxley and, more recently, Frank Jackson (the author of the Mary paper you mentioned). It is a rigorous, honest attempt to reconcile the success of physics with the reality of experience.

  However, you asked for an audit. As it stands, your list contains a fatal internal contradiction that will not survive a Tuesday night at the library.

  Here is the audit of conflicts, ranked from fatal to manageable, followed by the one clean revision that saves the system.

  ### The Conflicts

  **1. The Fatal Conflict: (3) vs. (5)**
  *   **The Clash:** (3) says qualia have no causal power. (5) says if something is real, it shows up in the numbers.
  *   **Why it breaks:** "Showing up in the numbers" requires interaction. For a quale to be detected (even statistically), it must correlate with a physical measurement. Correlation implies a common cause or direct interaction. If qualia are causally inert (3), they cannot affect the measuring device, the neuron, or the statistic. They become "nomological danglers"—things that exist but are, in principle, undetectable by any physical means.
  *   **What must give:** You cannot keep both. If you keep (5) (your lab principle), you must drop (3).
  *   **The Cost:** If you drop (3), qualia must have causal power. If they have causal power and are non-physical (per 2), you threaten (1). If they have causal power and *are* physical, you must redefine (2).

  **2. The Epistemic Conflict: (3) vs. (4)**
  *   **The Clash:** (4) says first-person reports are uniquely good data about experience. (3) says experience causes nothing.
  *   **Why it breaks:** A report ("I am in pain") is a physical event (vocal cords, ink on paper). If (3) is true, the *quale* of pain did not cause the report; the preceding brain state did. This makes the truth of your report a cosmic accident. The brain state could have caused the report "I am in pain" while you felt nothing, or while you felt joy. If qualia don't cause the reports, you have no reason to trust the reports as data *about the qualia*.
  *   **What must give:** To trust (4), you must drop (3). The experience must be part of the causal chain that produces the report.
  *   **The Cost:** Same as above. You reintroduce the threat to Causal Closure (1).

  **3. The Evolutionary Worry (Your Second Worry)**
  *   **The Clash:** (3) vs. Evolutionary Utility.
  *   **Why it breaks:** You suggested qualia are "spandrels" (byproducts). This is logically possible, but biologically expensive. It implies that the most metabolically expensive tissue in the human body (the brain) generates a massive, complex, real phenomenon (consciousness) that does absolutely no work.
  *   **What must give:** This is not a logical contradiction, but an explanatory cost.
  *   **The Cost:** If you keep (3), you must accept that consciousness is biologically useless. This is a hard pill for a biologist to swallow, though not impossible.

  **4. Your First Worry (Physics Breach)**
  *   **The Clash:** Does a physical brain producing a non-physical quale break (1)?
  *   **Verdict:** **No.** This worry is unfounded. (1) states that every *physical event* has a sufficient *physical cause*. It does not forbid physical events from having *non-physical effects*. One-way causation (Physical $\rightarrow$ Mental) preserves Causal Closure.
  *   **The Cost:** None logically, but it leaves the "non-physical" effect dangling without a place in the natural order.

  ### The Clean Revision

  You asked for one clean revision rather than seven patches. The linchpin holding this together is **(3)**. It is the attempt to protect (1) from (2), but it sacrifices (4) and (5) in the process. Since (1), (4), and (5) are grounded in your 35 years of scientific practice, and (2) is grounded in 4 years of reading, the most stable revision modifies (2) and drops (3).

  **The Proposal: Non-Reductive Physicalism (specifically, Russellian Monism)**

  This view keeps the spirit of your list but fixes the causal mechanics.

  1.  **Keep (1) Causal Closure:** The physical world is closed.
  2.  **Keep (5) Traces:** Real things show up in the numbers.
  3.  **Drop (3) Epiphenomenalism:** Qualia *do* cause things.
  4.  **Modify (2) The Nature of Qualia:** Instead of saying qualia are "non-physical things left over," say that qualia are the **intrinsic nature** of the physical states.

  **How it works:**
  Physics describes the *structure and function* of matter (math, relations, causes). It does not describe what matter *is* in itself. Your intuition in (2) is correct: structure/function is not enough. But the "left over" part isn't a ghost; it's the intrinsic stuff that *has* the structure.
  *   The brain state *is* the quale (Token Identity).
  *   The brain state causes the report (Saving 4).
  *   The brain state shows up in the numbers (Saving 5).
  *   The brain state is physical (Saving 1).
  *   But the *feel* of the state is not captured by the functional description (Saving the spirit of 2).

  **Mary's Room Revisited:**
  When Mary leaves the room, she does not learn a new fact about the *world* (which would violate physicalism). She gains a new *mode of access* to a physical fact she already knew. She moves from knowing the structure of red-perception to instantiating the intrinsic nature of red-perception.

  ### What You Are Signing Up For

  If you adopt this revision, here is the cost:

  1.  **You lose the "Ghost in the Machine":** You can no longer say qualia are distinct entities that the brain produces. They are what the brain states *are* from the inside.
  2.  **You must reinterpret Mary:** You have to argue that Mary's new knowledge is "knowledge by acquaintance" rather than "propositional knowledge." Some philosophers find this unsatisfying, but it preserves physicalism.
  3.  **You lose (7):** The "stuckness" of philosophers is no longer proof of non-physical reality; it is proof that humans have two different ways of accessing the same physical reality (third-person structural vs. first-person intrinsic).

  ### Summary for the Library Group

  If I were you, I would walk into the library and say this:

  > "I started as an Epiphenomenalist: I thought brain states caused qualia, but qualia caused nothing. I realized this breaks my scientific principle that real things leave traces (5), and it makes my own reports about pain inexplicable (4).
  >
  > So I have shifted. I now hold that qualia are the intrinsic nature of physical brain states. They are real, they cause my reports, and they show up in the numbers because they *are* the numbers' physical substrate. Physics describes the shape of the wave; qualia are the water. This keeps the physical world closed (1) but acknowledges that a complete description of the world requires acknowledging what the physical stuff feels like from the inside (2)."

  This preserves your scientific integrity, validates your intuition about Mary, and removes the causal dead-end that makes Epiphenomenalism untenable.
