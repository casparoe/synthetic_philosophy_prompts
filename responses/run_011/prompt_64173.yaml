      *Refining for the specific room:* The neuroscientist will be the most aggressive on the "physics" of it. The metaphysicians will go for the logical consistency. The enactivist will critique the definition of "coupling."

  5.  **Developing the Prep Sheet:**

      *   *Objection 1 (Neuroscientist):* "Causal history is irrelevant to function."
