      *   *Objection 4 (Analytic Functionalist):* "Substrate Independence is standard for a reason."
          *   *Answer:* Standard view conflates *replicability* with *persistence*.
          *   *Soft spot:* What is the physical mechanism that tracks this 'persistence'?
      *   *Objection 5 (Grad Student/Parfit):* "Identity isn't what matters."
          *   *Answer:* For the subject, the break in coupling *is* death.
          *   *Soft spot:* Third-person perspective can't verify this.
      *   *Objection 6 (Speed/Continuity):* "How slow is slow enough?"
          *   *Answer:* It's not about speed, it's about state coherence.
          *   *Soft spot:* Vagueness/Sorites.
      *   *Objection 7 (The "Bridge" Case):* "What if we bridge two brains?"
          *   *Answer:* That creates a new system, not persistence of one.
          *   *Soft spot:* At what point does it become two?

      *Selecting the Top 5-7:* I need to make sure they sound like the specific people in the room.
      1.  Neuroscientist (The "Engineering" objection).
      2.  Metaphysician (The "Fission" objection).
