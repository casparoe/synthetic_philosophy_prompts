      *   **Audience:** Analytic philosophers of mind (majority), one enactivist philosopher of cognitive science, one computational neuroscientist (pro-WBE), two metaphysicians (persistence over time), grad students (Parfit-literate).
      *   **Constraints:** No dualism, no transhumanist "soul" questions. Treat user as smart but new. Act as a professional philosopher colleague who knows the room. No fake citations.
      *   **User's View:** "No-Detachment Principle." Gradual replacement preserves identity *not* because of substrate independence/pattern preservation, but because causal coupling is never broken. Scan-copy-destroy fails because coupling is broken/re-established, not because the pattern is copied.
      *   **Task:** Brainstorm audience beliefs/incentives, then provide a prep sheet (7 objections, 2-min answers, soft spots, concessions, critical reply, feared question).

  2.  **Deconstruct the User's View ("No-Detachment Principle"):**
      *   *Core Claim:* Identity persists through gradual replacement due to continuous causal coupling.
      *   *Contrast:* Rejects standard functionalism/substrate independence (which usually justifies both replacement *and* uploading).
      *   *Implication:* Continuity of process > Similarity of state.
      *   *Vulnerability:* This sounds very much like a "Continuity of Consciousness" or "Psychological Continuity" view, but grounded in physical causal links rather than memory/personality. It risks collapsing into a sort of "spatiotemporal continuity" view or a specific version of "biological continuity" if not careful. It also risks the "fission" problem (what if coupling splits?).

  3.  **Analyze the Audience & Incentives:**
      *   *Analytic Philosophers of Mind:* Likely functionalists or physicalists. They will attack the rejection of substrate independence. If function is preserved, why does the physical link matter?
      *   *Enactivist:* Focuses on embodiment, coupling with the environment, and dynamical systems. They might *like* the "coupling" language but attack the idea that internal prosthetic coupling is enough without the *whole* organism-environment loop.
      *   *Computational Neuroscientist:* Wants WBE to work. Will attack the distinction between replacement and copying. If the function is identical, why does the history of the atoms matter?
      *   *Metaphysicians (Persistence):* Will test edge cases (fission, fusion, slow vs. fast replacement). They know Parfit. They will ask about the "moment" of change.
      *   *Grad Students:* Will bring up Parfitian reductionism. If identity isn't what matters, why care about the coupling?

  4.  **Brainstorming Objections (Drafting Phase):**
