      *   **Goal:** Create a one-page decision procedure to structure the discussion, identify *where* disagreement lies (conceptual vs. factual), and produce a written rationale.
      *   **Requirements:**
          *   Integrate four specific accounts: Statistical-Functional Naturalism (Boorse-style), Hybrid Account (Naturalism + Harm), Vital Goals (Nordby-style?), Normativist Account (Socially constituted).
          *   Label steps with the account they derive from.
          *   Preserve specific distinctions: Type-level vs. token-level, Reference Class selection (default + contestability), Present deficit vs. Risk, Environment-relativity (mismatch vs. defect), Disease vs. Coverage (Value-free vs. Value-laden tiers).
          *   Format: Numbered steps (Question, Sufficient Answer, Outputs, Termination/Vote).
          *   Output: 3-5 sentence written rationale template.
