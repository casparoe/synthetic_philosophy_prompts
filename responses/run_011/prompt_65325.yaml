      *Actually, looking at the panel composition:* They vote on the appeal. The procedure is to help them vote on whether the *criterion* is met.
      *Refinement:* The procedure should output "Criterion Met" or "Criterion Not Met." But it must distinguish *why* (Fact vs. Value).
      *Let's structure it as a Tiered Filter.* Tier 1: Naturalist Facts. Tier 2: Value/Normative Judgments.

