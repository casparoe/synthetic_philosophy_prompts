answer: |-
  ### 1. Fact-Check and Preliminary Corrections

  Your factual summary is remarkably accurate. You have correctly identified the key mechanisms of the Outer Space Treaty (OST) Article IX, the COSPAR implementation guidelines, the specific engineering controls (bioburden reduction, trajectory biasing), and the historical precedents (Galileo, Apollo).

  There is one minor nuance worth clarifying, though it does not alter the philosophical reconstruction:
  *   **Correction:** The Apollo quarantine was not dropped solely because the Moon was shown to be lifeless. It was dropped because the returned samples and crew showed no evidence of *pathogenicity* or *replication* of lunar material in Earth biology. The Moon was deemed biologically dead *and* chemically non-hazardous.
  *   **Impact:** This strengthens your second puzzle regarding asymmetry. It confirms that back-contamination rules were driven by **human safety risk assessment**, whereas forward-contamination rules are driven by **environmental/scientific preservation**.

  ### 2. Reconstruction of the Implicit Theory of Value

  Based on the practice you described, the planetary protection (PP) regime is not built on a single monolithic value, but rather a hierarchical instrumentalism. I reconstruct the core theory as: **The Stewardship of Epistemic Potentiality.**

  This theory posits that celestial bodies possess value primarily as **unique repositories of data** regarding the history of the solar system and the origins of life. This value is instrumental to humanity (specifically the scientific enterprise), not intrinsic to the celestial body itself.

  **The Hierarchy of Values:**
  1.  **Primary Value:** The preservation of the *opportunity* to discover independent extraterrestrial life (or prebiotic chemistry). This is a "once-in-civilization" epistemic good.
  2.  **Secondary Value:** The prevention of irreversible ecological disruption to potential extraterrestrial biospheres (interpreted largely as the preservation of Value #1).
  3.  **Tertiary Value:** The safety of the Earth's biosphere from extraterrestrial hazards (back-contamination).
  4.  **Operational Constraint:** The feasibility of space exploration (cost, technical capability).

  **Why this fits the practice:**
  *   **Sterilization:** We kill Earth microbes (violating a "sanctity of life" ethic) to protect the *integrity of the experiment* on Mars.
  *   **Galileo Crash:** We destroyed hardware to prevent a low-probability contamination event because the *potential* loss of the "Europa data set" outweighed the cost of the orbiter.
  *   **Apollo Abandonment:** Once the "data set" (Moon) was read and found empty of life, the stewardship obligation expired.

  ### 3. Evaluating the Candidate Theories

  Here is how the practice discriminates between the candidates you proposed:

  | Candidate Theory | Verdict | Discriminating Feature |
  | :--- | :--- | :--- |
  | **Indigenous microbes have moral standing.** | **Ruled Out.** | If microbes had intrinsic rights, we could not sterilize landers (killing Earth microbes) to save potential Mars microbes. Nor could we designate "off-limits" regions while contaminating others. Rights are not zonal. |
  | **Second origin of life is a unique object of knowledge.** | **Strongly Supported.** | This explains the "Right of First Look." Protection is highest where life is *possible* (Mars/Europa) and vanishes where it is *impossible* (Moon). The value lies in the *discovery*, not the organism. |
  | **Institutionalized precaution under uncertainty.** | **Fits Comfortably (but insufficient).** | Precaution explains the *existence* of rules, but not their *limits*. Strict precaution would forbid crewed Mars missions entirely. The acceptance of "Special Regions" and human leakage shows this is **Risk Management**, not strict Precaution. |
  | **Nothing is protected except the integrity of future science.** | **Required.** | This is the necessary core. Every deviation from strict protection (e.g., allowing crewed missions eventually) is justified by the argument that science can still be done in non-contaminated zones. If science weren't the goal, the rules would either be total (no touch) or non-existent. |

  **Conclusion:** The practice *strictly requires* the **Integrity of Future Science** theory. It *fits comfortably* with **Precaution**, but only as a methodological tool, not a moral foundation. It *rules out* **Intrinsic Moral Standing** for microbes.

  ### 4. Addressing the Specific Puzzles

  **A. The Claim of the Unobserved Organism**
  Treating a merely possible organism as a bearer of a claim presupposes that **Potentiality has Value**. In regulatory terms, this is a "shadow value." We regulate based on the *consequence of being wrong*. If we contaminate Mars and life *was* there, the loss is infinite (unique knowledge destroyed). If we sterilize and life *wasn't* there, the loss is finite (engineering cost). The practice presupposes a **Maximin decision rule** applied to epistemic goods: maximize the minimum gain (ensure we don't lose the chance to know).

  **B. Biological Assumptions (Competition vs. Ancestry)**
  The harm model presupposes **Biochemical Incompatibility and Ecological Niche Competition**.
  *   *Incompatibility:* It assumes Earth microbes could function in Martian conditions (psychrophiles, radiation resistance).
  *   *Competition:* It assumes Earth life would outcompete Martian life.
  *   *Ancestry:* Interestingly, the rules *also* guard against panspermia confusion. If Earth and Mars life are related, contamination ruins our ability to determine *directionality* (did life go Earth->Mars or Mars->Earth?).
  *   *Presupposition:* Biology is local enough to be disrupted, but distinct enough to be confused. The rules assume a "Shadow Biosphere" is possible and that Earth biology is an invasive species in that context.

  **C. The Asymmetry (Back vs. Forward Contamination)**
  This is the smoking gun for the **Anthropocentric Instrumentalism** of the regime.
  *   **Back-Contamination (Apollo):** Protected **Humans**. When human risk was assessed as negligible, the rules vanished.
  *   **Forward-Contamination (Mars):** Protects **Data/Environment**. Since the "risk" to the data never vanishes until life is found (or ruled out), the rules persist.
  *   **Normative Commitment:** Human safety is a *threshold* constraint (must be safe enough); Scientific Integrity is a *maximization* goal (preserve as much as possible). We accept risk to humans (astronauts die) but we do not accept risk to the "pristine status" of Mars (unless necessary for human access).

  **D. Rival Views Quietly Ruled Out**
  1.  **Space Expansionism (Manifest Destiny):** The view that space is a resource to be exploited without regard for prior states. PP rules explicitly deny this by restricting landing sites and requiring cleanup.
  2.  **Deep Space Ecology:** The view that Mars has a right to exist independent of human observation. If this were true, we wouldn't zone areas; we would ban entry.
  3.  **Strict Utilitarianism:** If the value of Mars colonization outweighs the value of microbial discovery, PP rules would be abandoned. The fact they persist shows the discovery value is currently weighted higher than the colonization speed.

  ### 5. Implications of Consistency

  If the presupposed view (**Stewardship of Epistemic Potentiality**) were made explicit and applied consistently:

  **1. Crewed Missions to Mars:**
  *   *Current Logic:* We accept contamination in "Special Regions" to enable human exploration, hoping to keep other regions pristine.
  *   *Consistent Logic:* A crewed mission is **impermissible** until robotic surveys have definitively mapped all potential habitats and either found life (changing the ethical calculus to interaction) or confirmed sterility (ending the protection mandate).
  *   *The "Right of First Look":* You are correct. The protection is a **temporary easement**. It expires the moment the scientific question is settled. The Moon is not an inconsistency; it is the proof of the rule. Protection lasts only as long as the *uncertainty* regarding life exists.

  **2. Policy Changes:**
  *   **Zoning:** We would see stricter "No-Go" zones. Currently, "Special Regions" are avoided. A consistent policy might designate entire latitudes as off-limits to humans permanently, not just until we check them.
  *   **Sample Return:** The strict containment for Mars Sample Return is consistent. However, a consistent policy might demand that samples be analyzed *in situ* or in orbit before ever touching Earth, to eliminate even the theoretical risk of back-contamination (since the "human safety" threshold is high).
  *   **Terraforming:** A consistent application of this theory would forbid terraforming Mars *until* we are certain no native life exists. Terraforming is the ultimate destruction of the "data set."

  **3. Alternative Policy: Intrinsic Value of Extraterrestrial Life**
  If we adopted the view that Martian microbes have moral standing (Candidate 1):
  *   **On the Ground:** No landers in potentially habitable zones. Period.
  *   **Sterilization:** We might still sterilize (to prevent invasion), but we could not knowingly send humans, as human leakage is uncontainable.
  *   **Resource Use:** Mining water ice in polar regions might be prohibited if it disrupts subsurface habitats.
  *   **Result:** Human exploration of Mars would be effectively banned indefinitely, reduced to orbital observation only.

  **4. Alternative Policy: Laissez-Faire (Expansionism)**
  If we adopted the view that space is for human use:
  *   **On the Ground:** No sterilization requirements (save for spacecraft reliability).
  *   **Landing:** Land wherever is cheapest/safest.
  *   **Sample Return:** Open handling of samples.
  *   **Result:** Faster colonization, but the question "Did life exist on Mars?" would become unanswerable within 20 years due to contamination.

  ### 6. Confidence and Uncertainty

  **High Confidence:**
  *   That the practice rules out intrinsic moral standing for microbes.
  *   That the asymmetry between Apollo (back) and Mars (forward) reveals an Anthropocentric/Epistemic value structure rather than an Ecocentric one.
  *   That the "Right of First Look" is the operational logic (protection expires upon discovery).

  **Medium Confidence:**
  *   That the "Stewardship of Epistemic Potentiality" is the *intended* logic of all actors. Some environmentalists within the agencies may genuinely hold ecocentric views, even if the regulations don't reflect them.

  **Low Confidence (The Point of Least Surety):**
  *   **The Legal Interpretation of "Harmful Contamination" in the Outer Space Treaty.**
      *   *Why:* I am least sure whether Article IX of the OST *legally requires* more than the current scientific integrity framework. Some legal scholars argue "harmful contamination" implies an obligation to protect the extraterrestrial environment *for its own sake* (an early form of space environmental law), independent of human scientific use. Others argue it is purely anthropocentric (protecting *our* use of space).
      *   *What a Specialist Would Check:* A specialist in Space Law would need to analyze the *travaux préparatoires* (preparatory works) of the 1967 Treaty and subsequent state practice to see if "harmful" was intended to mean "harmful to human interests" or "harmful to the celestial body." If the latter, the current PP regime is legally non-compliant because it allows contamination in non-special regions, violating the body's integrity regardless of scientific value.

  ### Summary
  Your intuition is correct: the practice looks like pollution control because it *is* risk management, but the "pollutant" is **information loss**, not just biological hazard. The theory of value is **Epistemic Instrumentalism**. We protect Mars not because Mars has rights, but because Mars holds answers we cannot afford to lose before we read them. Once read, the protection lapses. The Moon is the precedent; Mars is the current manuscript; Europa is the sealed archive. Crewed missions are the act of checking out the book—with the risk of spilling coffee on the pages.
