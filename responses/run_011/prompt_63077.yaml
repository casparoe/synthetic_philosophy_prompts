prompt: |-
  I'm drafting a chapter for an edited collection on cross-border reproductive markets, and I've run into a piece of rhetoric that my co-author and I keep tripping over. She defends the American model — compensated gestational arrangements brokered by agencies in the states that will issue a pre-birth parentage order — against the continental European position, where such agreements are treated as void because the human body is held not to be at a person's disposal to alienate, and where at least one country has recently made it an offence for its own citizens to commission a surrogacy in a jurisdiction where the practice is entirely legal. Her argument runs through a picture both sides use: the carrier rents out her womb. Pressed, she cashes it out as a lease. The carrier is lessor; the intended parents are lessees; the demised premises are the uterus for a fixed term of roughly nine months; the compensation is rent; the behavioural covenants in a standard agency contract — no alcohol, travel restrictions, agreement to terminate on medical advice — are covenants as to use; the handover of the child is surrender of possession in the agreed condition; and independent legal advice, disclosure of medical history, and psychological screening are the ordinary due diligence one expects before granting a term. Her conclusion is that nothing in this structure is distinctive, since we permit leases of bodily labour and of body-adjacent capacities all the time, from employment contracts to compensated plasma donation to the wet-nursing that European families bought openly for two centuries; so if the arrangement is a lease, the European objection is squeamishness about the price rather than about the structure, and the right response is lease-style regulation — standard-form terms, cooling-off periods, caps on liquidated damages, mandatory separate counsel — rather than prohibition. I find this persuasive and unpersuasive at the same time and cannot yet say which.

  Could you audit the analogy for me? First, set out the correspondence table properly: what in a compensated gestational arrangement actually occupies each of those roles, and which roles have no occupant at all. I especially want to know where the child sits in the mapping, since a lease appears to have no slot for a third person produced during the term — and if the child is the product of the lease, then the picture has quietly turned from a conveyance of use into a contract for the manufacture and delivery of goods, which is precisely the charge the analogy was meant to rebut. Then separate the disanalogies that matter for her intended use from those that are merely picturesque. Three candidates I'd like pressure-tested: that a lease transfers possession and control of the premises to the lessee, whereas the carrier never loses possession or control of her own body, so the so-called covenants as to use are not restrictions on the use of a thing but directives about another person's conduct; that, as far as I understand the American cases, no court has actually ordered a carrier to comply with those covenants, the remedy being damages at most, which makes it unclear what legal work the lease vocabulary is doing; and that a lease presupposes an inert, fungible subject matter whose condition can be assessed at surrender, whereas the relevant subject matter here is a person whose interests do not end with the term. I'd also like you to say what the framing imports that nobody has argued for — that the lessor's stake is purely economic, that the term ends cleanly with no residual obligations, that third parties are strangers to the instrument rather than beneficiaries of it.

  Finally, does her conclusion survive the disanalogies, or was it carried by the analogy all along? Please take seriously the opposing reading that a colleague of mine pressed, namely that the analogy does not answer the commodification objection but simply states it: describing a pregnancy as the grant of a term of years already concedes that the body is alienable property, which is exactly what the European position denies, so the two sides are not disagreeing about the facts but about whether that concession has been made. Is that reading right, or is it a rhetorical slide of its own? And if the lease is the wrong source domain, which alternative would do better and what would each license — a personal services contract with the familiar limits on enforcing one, a bailment, an agency relationship in which the carrier acts for the intended parents, a joint venture, or a contract for work and materials? Be concrete about what each choice would imply for the live regulatory questions: enforceability of the handover, the status of the behavioural terms, and who may withdraw and when. One constraint: no bibliography and no survey of who has said what, since I'll add my own references, and I'm not interested in the empirical facts of the two markets either. What I need is the structure of the comparison.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** Drafting a chapter for an edited collection on cross-border reproductive markets.
      *   **Problem:** The user and their co-author are stuck on a specific rhetorical analogy used by the co-author to defend the American compensated surrogacy model against the European prohibition model.
      *   **The Co-author's Argument:** Surrogacy is analogous to a *lease*.
          *   Carrier = Lessor.
          *   Intended Parents (IPs) = Lessees.
          *   Uterus = Demised Premises.
          *   Compensation = Rent.
          *   Behavioral Covenants = Use Covenants.
          *   Child Handover = Surrender of Possession.
          *   Screening/Advice = Due Diligence.
          *   *Conclusion:* Since we allow leases of bodily labor/capacities (employment, plasma, wet-nursing), the European objection is just squeamishness about price, not structure. Solution: Lease-style regulation, not prohibition.
      *   **User's Task:** Audit this analogy.
      *   **Specific Requirements:**
          1.  Set out a correspondence table (roles in lease vs. roles in surrogacy), noting empty slots (especially the child).
          2.  Address the "Child Problem": Is the child a product (goods contract) or part of the lease?
          3.  Pressure-test three specific disanalogies:
              *   Possession/Control (body vs. premises).
              *   Remedies (specific performance vs. damages).
              *   Subject Matter (inert/fungible vs. person/interests).
          4.  Identify imported assumptions (economic stake, clean end, third-party status).
          5.  Evaluate the conclusion: Does it survive the disanalogies, or was it carried by the analogy?
          6.  Address the colleague's counter-reading: Does the analogy *concede* commodification rather than answer it?
          7.  Propose alternative source domains (Personal Services, Bailment, Agency, Joint Venture, Work & Materials) and their regulatory implications (enforceability, behavioral terms, withdrawal).
      *   **Constraints:** No bibliography, no survey of literature/empirical facts. Focus on the *structure of the comparison*.

  2.  **Deconstruct the Lease Analogy (Correspondence Table):**
      *   *Lessor:* Carrier.
      *   *Lessee:* Intended Parents (IPs).
      *   *Premises:* Uterus/Womb (biological capacity).
      *   *Term:* Pregnancy duration (~9 months).
      *   *Rent:* Compensation/Fees.
      *   *Use Covenants:* Lifestyle restrictions (diet, travel, medical compliance).
      *   *Due Diligence:* Screening, legal advice.
      *   *Surrender:* Handover of the infant.
      *   *Empty Slot:* The Child. In a lease, you return the *premises*. In surrogacy, you return the premises (empty uterus) *plus* a new entity (the baby).
      *   *The Pivot:* If the baby is the "product," it shifts from Lease (use of property) to Contract for Work/Materials (manufacture). This undermines the "mere use" defense.

  3.  **Analyze the Disanalogies:**
      *   *Possession/Control:* In a lease, the lessee gets *exclusive possession*. In surrogacy, the carrier retains physical possession and bodily autonomy. The "covenants" are instructions to a person, not rules for a space. This touches on the 13th Amendment/slavery concerns (involuntary servitude) vs. property law.
      *   *Remedies:* Lease law allows eviction or specific performance (sometimes). Surrogacy contracts generally *cannot* force specific performance of medical procedures or forced handover (in many jurisdictions, though pre-birth orders help). If the remedy is only damages, it's not a true property interest in the body.
      *   *Subject Matter:* Premises are inert. A pregnant body is a living person with independent rights that evolve (medical risk, bodily integrity). The "condition at surrender" implies the baby is the premises, which is legally and morally fraught (babies aren't property to be surrendered in "agreed condition").

  4.  **Analyze Imported Assumptions:**
      *   *Economic Stake:* Assumes the carrier's primary interest is rent, ignoring emotional/biological connection.
      *   *Clean End:* Leases end; relationships (and potential liability for the child) might not.
      *   *Third Parties:* In a lease, neighbors are strangers. In surrogacy, the child is a rights-bearing third party, not just a fixture.

  5.  **Evaluate the Conclusion & The Colleague's Objection:**
      *   *Conclusion:* Does "regulate like a lease" follow? If the analogy fails on control and subject matter, lease regulations (like eviction rules) don't fit.
      *   *Colleague's Objection:* "Describing pregnancy as a grant of a term concedes alienability." This is strong. If the European view is "Body is not disposable," calling it a lease *presupposes* it is disposable. It begs the question. It's not a neutral description; it's a categorization that assumes the conclusion.

  6.  **Develop Alternative Analogies:**
      *   *Personal Services Contract:* Focuses on labor.
          *   *Implication:* No specific performance (can't force pregnancy actions). Withdrawal allowed (with penalty). Handover is separate (custody law).
      *   *Bailment:* Caring for someone else's property.
          *   *Implication:* High duty of care. But implies the embryo/baby is property *before* birth. Problematic.
      *   *Agency:* Carrier acts on behalf of IPs.
          *   *Implication:* Fiduciary duty. But agent usually controls the act. Principal controls the goal. Hard to separate body from act.
      *   *Joint Venture:* Shared goal (creating a family).
          *   *Implication:* Shared risk, shared decision making. Harder to enforce handover if "partners" disagree.
      *   *Contract for Work and Materials (Manufacture):*
          *   *Implication:* Product must meet specs. High risk of commodification. "Rejecting goods" if disabled? Very dangerous regulatory path.

  7.  **Drafting the Response:**
      *   *Tone:* Academic, precise, analytical, respectful of the complexity.
      *   *Structure:* Follow the user's prompt order (Table -> Disanalogies -> Imports -> Conclusion/Colleague -> Alternatives).
      *   *Refinement:* Ensure the distinction between "use of body" and "production of child" is sharp. Ensure the "Colleague's Objection" is treated as a category error argument.

      *(Self-Correction during drafting)*: I need to be careful not to take a moral stance on surrogacy itself, but strictly analyze the *legal analogy*. The user wants the structure of the comparison audited.
      *Check:* Did I address the "child as product" vs "child as surrender"? Yes, this is crucial. If the child is the "premises," it's absurd. If the child is the "fruit," it's still distinct from a lease.
      *Check:* Did I address the "remedy" point? Yes, specific performance is the key differentiator between property and service.
      *Check:* Did I address the European objection properly? Yes, the "inalienability of the body" is the foundational clash.

  8.  **Final Polish:** Check against constraints (no bibliography, no empirical survey). Ensure the alternative models have concrete regulatory implications listed. (e.g., if Agency, then fiduciary duty; if Service, then no specific performance).

      *Thought on the "Child" slot:* In a lease, you return the *same* thing you leased. In surrogacy, you return the uterus (same) but also produce a baby (new). A lease doesn't account for the creation of new property. This suggests *fructus naturales* (crops) or *manufacture*. If crops, they belong to the lessee usually. If manufacture, it's a sale of goods. Both create commodification issues the lease analogy tries to hide.

      *Thought on the Colleague's Objection:* It's not a rhetorical slide; it's a category mistake argument. To use the lease analogy is to already accept the premise that the body *can* be leased. The European view says it *cannot*. Therefore, the analogy cannot persuade a European jurist; it can only preach to the converted.

      *Thought on Alternatives:*
      *   *Personal Services:* Best fit for bodily integrity. Limits enforcement.
      *   *Agency:* Good for decision making, bad for "ownership" of outcome.
      *   *Joint Venture:* Good for shared risk, bad for clear parentage transfer.
      *   *Work & Materials:* Worst fit ethically, but fits the "product" reality.

