answer: |-
  # Seminar Q&A Preparation Sheet

  ## Strategic Overview
  **Target Audience Dynamics:** You are walking a tightrope. The Dennettians want you to admit everything is instrumental; the Searlean wants you to preserve causal powers; the Teleosemanticist wants to subsume your distinction under evolutionary function; the CS students want a clear boundary for their models.
  **Primary Vulnerability:** Step 4 (Self-Specification) looks suspiciously like the instrumentalism you claim to avoid.
  **Secondary Vulnerability:** Step 2 (The (a)/(b) distinction) may be collapsed by the Teleosemanticist.

  ---

  ## Part 1: The Eight Objections
  *Ordered by estimated damage (Likelihood × Difficulty of Answer).*

  ### 1. The Dennettian Collapse (Target: Step 4)
  **Source:** Analytic Student (Dennettian)
  **Objection:** "You concede in Step 5 that your view resembles instrumentalism. But if 'explicability' in Step 4 is judged by *us* (the observers), then the 'single scheme' is still observer-relative. A Two-Bitser in a museum is inexplicable if treated as a quarter-detector, but explicable if treated as a souvenir. You haven't found a fact of the matter about the system; you've just found a fact about our patience in interpreting it."
  **2-Minute Reply:** "The difference is in the *cost* of the interpretation, not the patience. With the Two-Bitser, treating it as a souvenir makes its internal transitions random noise. With a human, treating them as a souvenir (ignoring their beliefs/desires) makes their specific motor outputs physically inexplicable without positing a hidden controller. The system *constrains* the interpretation because its functional organization breaks under wrong ascriptions. It's not that we get bored; it's that the prediction fails."
  **Frank Note on Softness:** This silently depends on the premise that "behavioral inexplicability" is objective. A hardline instrumentalist will reply that *any* behavior can be saved by a complex enough attribution scheme (Quinean underdetermination). You are assuming a limit to charitable interpretation that Dennett denies.

  ### 2. The Teleosemantic Trap (Target: Step 2)
  **Source:** Teleosemantics Specialist
  **Objection:** "In Step 2, you distinguish (a) interpreter-dependence from (b) external fixation. But teleosemantics argues that (b) *is* the source of original intentionality via evolutionary history. If the Two-Bitser's content is fixed by design history (Step 1), and human content is fixed by evolutionary history, you haven't distinguished the Two-Bitser from us. You've just distinguished 'engineer design' from 'natural selection.' Both are external relations."
  **2-Minute Reply:** "I agree that both involve external history. But the Two-Bitser's function is fixed *independently* of its current operational state—it works even if it 'thinks' it's something else, because the engineer fixed it. In biological systems, the 'design' is maintained by the system's own self-preserving operations. The Self-Specification Condition in Step 4 captures this: the biological system enforces the scheme via its own survival constraints, whereas the Two-Bitser enforces nothing; the engineer did."
  **Frank Note on Softness:** This concedes that Step 2's distinction is insufficient on its own. You are retreating to Step 4 to do the work Step 2 was supposed to do. If the Teleosemanticist argues that self-preservation is just another "design decision," you have no reply ready.

  ### 3. The LLM Boundary Problem (Target: Step 4)
  **Source:** Computer Science Student
  **Objection:** "We work with language models. If we interpret an LLM as a 'truth-teller,' its behavior is inexplicable (it hallucinates). If we interpret it as a 'next-token predictor,' its behavior is explicable. That fits your Step 4: exactly one scheme makes it explicable. Does your view license us to say LLMs have original intentionality? If not, why doesn't the 'token predictor' scheme count?"
  **2-Minute Reply:** "The 'token predictor' scheme makes the *training* explicable, not the *runtime behavior* in a conversational context. When an LLM engages in dialogue, it simulates a speaker. If you treat it purely as a token predictor during inference, you cannot explain why it maintains conversational coherence across turns. However, the scheme it 'enforces' is simulated, not biological. It lacks the self-preservation constraint that makes the human scheme non-optional. It passes Step 4 technically, but fails the implicit biological grounding required to make that specification *original* rather than *simulated*."
  **Frank Note on Softness:** This is your weakest point. You are introducing a "biological grounding" requirement that you explicitly tried to avoid in Step 4 to save Searle from the "intrinsic" charge. You are smuggling Biology back in without defending it.

  ### 4. The Searlean Causal Powers Objection (Target: Step 3)
  **Source:** Professor (Searlean)
  **Objection:** "You claim Searle only needed to deny (a) interpreter-dependence. But Searle insists intentionality is a biological *causal power*. If content is fixed by external relations (Step 1), then the causal power resides partly outside the head. That violates the locality of the causal mechanism Searle requires for Biological Naturalism. You are saving the label 'original' but losing the 'biological' mechanism."
  **2-Minute Reply:** "Searle's worry about externalism is that it makes the mind transparent to the environment, losing the agent. My Step 3 claim is that Searle conflates 'individuation of content' with 'realization of capacity.' The capacity is intrinsic (brain states), even if what those states *mean* is partly external. The Two-Bitser shows content is external; it doesn't show the *capacity to hold content* is external. Searle needs the latter to be intrinsic, which my view preserves."
  **Frank Note on Softness:** This relies on a distinction between "content" and "capacity" that Searle might reject. For Searle, the content *is* the causal power. If the content is external, the power is external. You are asking him to accept a functionalist carve-up of his own theory.

  ### 5. The Radical Translation Objection (Target: Step 5)
  **Source:** Analytic Student (Dennettian)
  **Objection:** "In Step 5, you contrast a creature where misinterpretation leaves behavior predictable vs. one where it doesn't. But Quine showed we can always construct a scheme to make behavior predictable (radical translation). If I interpret a human as a stone, I just add complex laws of 'stone-psychology' to predict them. There is no 'single scheme' that is uniquely singled out."
  **2-Minute Reply:** "You can always save the phenomena with enough auxiliary hypotheses, but that violates the 'self-specification' clause. The human system *resists* the stone interpretation by generating errors that are only correctable by switching to the intentional stance. The system itself 'punishes' the wrong scheme with unpredictability. The stone scheme requires *you* to do all the work; the intentional scheme leverages the *system's* work."
  **Frank Note on Softness:** This concedes that "explicability" is a gradient, not a binary. If it's a gradient, the line between Two-Bitser and Human is arbitrary. You are hoping the seminar accepts "practical inexplicability" as a hard boundary.

  ### 6. The Homunculus Worry (Target: Step 4)
  **Source:** Professor (Searlean)
  **Objection:** "You say the system 'enforces' the scheme in Step 4. How does a system enforce an interpretation without already having an interpretation of what it is doing? This sounds like a homunculus. The system doesn't 'know' which scheme is right; only we do."
  **2-Minute Reply:** "'Enforce' is metaphorical for 'fails to function.' A heart enforces the 'pump' interpretation because if you treat it as a 'noise-maker,' its physiological role becomes unintelligible and the organism dies. The 'enforcement' is the causal consequence of misalignment, not a cognitive act by the system."
  **Frank Note on Softness:** This works for hearts, but less well for "content." A Two-Bitser also fails to function if treated as a paperweight. You need to explain why biological failure counts as "enforcement" of meaning but mechanical failure does not, without begging the question.

  ### 7. The Design History Objection (Target: Step 1)
  **Source:** Teleosemantics Specialist
  **Objection:** "In Step 1, you admit the Two-Bitser's content depends on 'design decisions.' If a designer intends it to detect quarters, isn't that original intentionality derived from the designer's original intentionality? Why is that 'derived' in a way that blocks your argument?"
  **2-Minute Reply:** "Because the Two-Bitser does not maintain that design. It is static. If the environment changes, the Two-Bitser does not adapt to preserve its 'quarter-detecting' function. Original intentionality requires the system to actively maintain the conditions under which its content is fixed. The Two-Bitser is a fossil of intentionality; humans are the living process."
  **Frank Note on Softness:** This moves the goalposts from "content fixation" to "system maintenance." It's a good move, but it wasn't in your written steps 1-5. You are improvising a biological requirement.

  ### 8. The Terminology Quibble (Target: Step 3)
  **Source:** General Audience
  **Objection:** "If Searle chose the wrong word ('intrinsic'), isn't that just a verbal dispute? If the Two-Bitser has external content and humans have external content, what work is 'original' doing anymore?"
  **2-Minute Reply:** "It's not verbal. It determines whether AI can ever be mindful. If 'derived' just means 'external,' then AI with the right external connections has original intentionality. If 'derived' means 'parasitic on interpreters,' AI cannot have it without a user. My distinction preserves the possibility that AI is fundamentally different from humans, which is the substantive stake."
  **Frank Note on Softness:** This is a safe reply but admits the philosophical heavy lifting is being done by the AI implication, not the metaphysics.

  ---

  ## Part 2: Strategic Concessions & Critical Moves

  ### 1. The Opening Concession (First 5 Minutes)
  **What to say:** "I want to concede immediately that Searle's use of the word 'intrinsic' is a liability. If 'intrinsic' means 'independent of all external relations,' Searle is wrong, and the Two-Bitser proves it. I am not defending the word; I am defending the *intuition* behind Biological Naturalism: that there is a difference between a system that *has* a perspective and a system that is *assigned* one. I will argue that difference survives even if we drop 'intrinsic' for 'self-specifying'."
  **Why:** This disarms the Professor (who knows "intrinsic" is problematic) and the Dennettians (who want to attack that word). It frames your paper as a *repair* of Searle, not a rejection, which keeps the Professor sympathetic.

  ### 2. The Single Reply That Must Land
  **The Objection:** The Dennettian Collapse (Objection #1 above).
  **Why:** If Step 4 collapses into instrumentalism, your positive account fails. You become just another interpretivist, and the Two-Bitser wins.
  **The Move:** You must convince the room that "behavioral inexplicability" is a hard constraint, not a matter of observer preference. Emphasize the *cost* of auxiliary hypotheses. If the audience believes there is an objective fact about which interpretation makes the system "tick," you survive.

  ### 3. The "Killer" Objection (The One You Hope Nobody Raises)
  **The Objection:** The Teleosemantic Trap (Objection #2).
  **Why:** If the Teleosemanticist successfully argues that evolutionary history is just a subset of "design history," then Step 2's distinction between (a) and (b) dissolves. Humans become complex Two-Bitsers. You have no prepared defense for why natural selection counts as "self-specifying" but engineering does not, other than appealing to the biology you tried to minimize.
  **Best Partial Holding Response:** "Teleosemantics explains the *origin* of the function, but not the *current mode* of existence. A Two-Bitser retains its content even if it malfunctions and stops detecting quarters. A human who loses the capacity to self-specify (e.g., severe brain death) loses original intentionality. The difference is in the *maintenance conditions*, not the *origin conditions*." (This is weak, but it shifts the debate to Step 4 where you are stronger).

  ### 4. Flagged Misreading (Steps 2 & 3)
  **The Risk:** The audience may think you are arguing Searle is an *Externalist*.
  **The Correction:** In your introduction, explicitly state: "I am not arguing Searle accepts externalism. I am arguing Searle accepts that content is *individuated* externally, while insisting the *vehicle* is intrinsic. The Two-Bitser attacks the vehicle; I am defending the individuation."
  **Why:** If they think you are turning Searle into a Putnamian, the Professor will reject the premise. Keep the "vehicle/content" distinction clear early to prevent this conflation.

  ---

  ## Part 3: Step Target Analysis
  **Step 2 (The Distinction):** This is your most exposed logical flank. The Teleosemanticist and the Searlean will converge here. If (b) is conceded as sufficient for "derived" in the relevant sense, your defense of Searle fails.
  **Step 4 (Self-Specification):** This is your most exposed *pragmatic* flank. The Dennettians and CS students will converge here. If this is just instrumentalism, your positive contribution vanishes.

  **Recommendation:** Spend more preparation time shoring up Step 4. Step 2 is a definitional move that is hard to change now. Step 4 is where you can win the room by making the "inexplicability" constraint feel robust and objective. If you can make them feel that humans *break* under wrong interpretations in a way machines don't, you bypass the metaphysical quibbles of Step 2.
