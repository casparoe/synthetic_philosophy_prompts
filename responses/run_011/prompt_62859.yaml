answer: |-
  1. **The "Wrong Universe" Problem (Updateless w.r.t. What)**
  Your view hinges on optimizing a policy against a starting prior, but priors are notoriously fragile; if an agent's initial prior assigns low probability to the actual structure of the world, isn't your updateless agent condemned to optimizing for a universe it isn't in, effectively rewarding dogmatism over truth-tracking?
  *Follow-up:* If you say we should just use the "correct" prior, where does that prior come from if not from updating on the very evidence you're forbidding the agent to use?

  2. **Selection Effects and "Why Ain'cha Rich"**
  Proponents often argue UDT wins because it gets the money in Newcomb-like problems, but doesn't this suffer from the winner-picks problem, where we only observe the theory working in environments specifically constructed to reward pre-commitment rather than flexibility?
  *Follow-up:* If rationality is simply "winning," why shouldn't we adopt a theory that one-boxes in Newcomb but two-boxes in environments where the predictor punishes one-boxers?

  3. **The Absentminded Driver's Belief State**
  Does the Absentminded Driver actually motivate updatelessness, or does it just highlight a tension in what the driver can coherently believe once he's at the intersection, given that his self-locating uncertainty seems to demand an update he's forbidden from making?
  *Follow-up:* If you claim beliefs don't matter and only the policy output does, are you not stripping the agent of the very representational machinery needed to navigate the map?

  4. **UDT vs. EDT Plus a Commitment Device**
  Critics charge that policy choice collapses into evidential decision theory plus a commitment device; if that's right, is updatelessness a distinct decision theory or merely a theory of rational commitment, and does the distinction do any normative work?
  *Follow-up:* If it's just commitment, why does the theory fail to give action-guidance in cases where the commitment technology is physically unavailable to the agent?

  5. **Indexicals and Self-Location**
  How does your view handle self-location and indexicals without updating, since a policy mapping observations to actions seems to require the agent know *which* observation it is having, which looks suspiciously like conditioning on centered information?
  *Follow-up:* If you reduce indexicals to external coordinates to avoid updating, aren't you just pushing the computational burden of self-location into the prior where it becomes intractable?

  6. **Boundedness and the "Ought Implies Can" Objection**
  No bounded agent can compute the optimal policy over all possible observation histories, so what is the view actually telling us to do: maximize over the best policy we can find, or fail to be rational because we missed the global optimum?
  *Follow-up:* If you say "maximize over the best policy we can find," doesn't the search for that policy itself require the very conditional reasoning you're trying to ban?

  7. **The Failed Prediction Note (Custom Case)**
  You sign up for an experiment where a reliable predictor forecast your policy and wired payoffs accordingly; this morning, the director hands you a sealed note truthfully stating the predictor got you wrong and forecast a policy you did not adopt—do you exploit the fact that you're in the branch where the prediction failed, or does updatelessness still have you playing to the correlation between your policy and the forecast?
  *Follow-up:* If you say the optimal policy just contains a clause for receiving the note, what happens when the note comes from a process outside anything in the prior, making that clause logically impossible to have anticipated?

  8. **Logical Counterfactuals and Troll Bridge**
  Your view relies on evaluating counterfactuals where you take different actions, but in logical space, if you're a deterministic algorithm, taking a different action might imply a contradiction; how do you avoid the "Troll Bridge" problem where the agent refuses to cross because exploring the counterfactual leads to a proof of explosion?
  *Follow-up:* If you appeal to a theory of logical induction to solve this, aren't you reintroducing a form of updating on logical evidence that violates the updateless constraint?

  9. **Time Consistency vs. Dynamic Consistency**
  Updateless agents are time-consistent but can be dynamically inconsistent, meaning they would refuse to let their future selves make choices the current self prefers; is this preference reversal a bug in the theory or a feature we should accept as the cost of rationality?
  *Follow-up:* If it's a feature, are you not endorsing a form of rationality that requires the agent to actively fight against its own future judgment?

  10. **Action Guidance for Non-Ideal Agents (Closing)**
  You can say a fully rational agent in the limit would be updateless, but I need to go back to my office on Monday morning; what specifically should I do differently than a CDT agent when I know I can't actually compute the global policy or trust my prior?
  *Follow-up:* If the answer is "approximate updatelessness," isn't that just a permission slip to update whenever the approximation gets too hard?
