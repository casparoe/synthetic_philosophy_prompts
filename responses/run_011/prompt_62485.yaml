answer: |-
  A county health department must allocate a fixed outreach budget across fifty clinics to maximize total vaccinations. The data team provides point-estimate forecasts of vaccination yield per dollar for each clinic based on last year's noisy data, where variance is high relative to the signal and identical across clinics. The maximizer, tasked with maximizing expected total vaccinations, treats these forecasts as true expected values and allocates the entire budget to the single clinic with the highest projected yield. The satisficer, operating under a fixed aspiration level set at the county-wide average yield from two years prior, examines potential allocation vectors ordered by diversification (from equal-split across all clinics to increasingly concentrated bets) and selects the first vector whose projected total yield meets the aspiration. Because the highest single-clinic forecast is statistically likely to be a positive noise outlier (the Optimizer's Curse), the maximizer's concentrated bet underperforms in realization, while the satisficer's diversified allocation, which averages out the noise across many clinics, consistently achieves a higher actual yield despite never attempting to find the theoretical maximum.

  ### Show the Work

  **The Computation:**
  Let $Y_i$ be the true yield of clinic $i$, and $\hat{Y}_i = Y_i + \epsilon_i$ be the forecast, where $\epsilon_i \sim N(0, \sigma^2)$.
  *   **The Maximizer:** Computes $V_{max} = \max_i (\hat{Y}_i)$. It allocates budget $B$ entirely to clinic $k = \arg\max_i (\hat{Y}_i)$. Its expected *realized* utility is $E[Y_k]$. Since $k$ is selected based on the maximum of noisy estimates, $E[\hat{Y}_k] > E[Y_k]$. The maximizer selects the clinic where the noise term $\epsilon_k$ was most likely positive and large.
  *   **The Satisficer:** Sets aspiration $A = \frac{1}{N}\sum Y_i$ (approximated by historical data). It evaluates allocations starting with $w_i = 1/N$ for all $i$. The projected yield is $\sum \frac{1}{N} \hat{Y}_i$. By the Law of Large Numbers, $\sum \frac{1}{N} \epsilon_i \to 0$. The projected yield is very close to the true mean yield. Since $A$ is set at the mean, this allocation clears the aspiration. The satisficer stops here and executes the equal split. Its realized utility is $\sum \frac{1}{N} Y_i$, which equals the true average yield.

  **The Failure Point:**
  The maximizer fails at the **parameter identification step**. It treats the estimator $\hat{Y}$ as the parameter $Y$. In expected-utility terms, it calculates $E[U| \text{Data}]$ assuming $P(Y|\text{Data})$ is a delta function at $\hat{Y}$. It ignores the variance of the estimator.

  **The Feature:**
  The advantage is driven by the **ratio of estimation noise to the number of options ($ \sigma^2 / N $)**. With high $N$ and significant $\sigma^2$, the probability that $\max(\hat{Y})$ is driven by noise approaches 1. The satisficer wins because its selection rule (diversification first) implicitly minimizes exposure to $\epsilon_i$, while the maximizer's rule (concentration on max) maximizes exposure to it.

  ### Run the Checks

  1.  **Precise Estimates ($\sigma^2 \to 0$):** The noise vanishes. $\hat{Y}_i \approx Y_i$. The maximizer correctly identifies the true best clinic. The satisficer's diversified yield is the average, which is lower than the maximum. **The case collapses.** The satisficer's advantage disappears, and the maximizer wins.
  2.  **Two Channels ($N=2$):** The probability that the maximum estimate is a severe noise outlier is much lower. The "Winner's Curse" is weak. The satisficer's diversification yields the average; the maximizer yields the better of two. Unless noise is massive, the maximizer wins. **The case weakens significantly.**
  3.  **Enormous Historical Sample:** As data accumulates, $\sigma^2$ decreases. We return to the first check. **The case collapses.**

  **Collapse to Search Costs:**
  The case does *not* collapse into a search-cost story in these limits; it collapses into a **information-quality story**. In the standard "search cost" defense of satisficing, the agent stops searching because looking further is expensive. Here, looking further (getting more data to reduce $\sigma^2$) is free (by constraint), but the *structure of the decision rule* determines how existing noise is handled. However, if we interpret "acquiring further information" as "computing the posterior distribution," then the maximizer's failure *could* be framed as a cost of statistical sophistication. But given the constraint that computation is unbounded, the failure is purely in the *objective function specification* (optimizing point estimates vs. optimizing robustness).

  **Does the Advantage Survive?**
  No. If noise is removed or $N$ is small, the satisficer's structural advantage vanishes. The satisficer is not "better" in a vacuum; it is better specifically in high-dimensional, noisy environments.

  **Right or Less Wrong?**
  The satisficer is doing something **less wrong**. It is not actively modeling the uncertainty correctly (it doesn't know $\sigma^2$); rather, its heuristic (diversify until aspiration met) accidentally avoids the specific trap of overfitting noise that the maximizer falls into. It is a robustness advantage, not an optimization advantage.

  ### Press the Objection

  **The Objection:**
  A defender of maximizing will argue that the maximizer I specified was not truly rational. A properly specified Expected Utility maximizer would not treat $\hat{Y}_i$ as fixed. They would represent uncertainty by constructing a likelihood function $P(\text{Data}|Y)$ and a prior $P(Y)$, then maximize expected utility over the posterior predictive distribution. This "Bayesian Maximizer" would apply shrinkage (e.g., James-Stein estimation), pulling extreme estimates toward the mean. Consequently, they would not allocate 100% to the noisiest outlier. They would produce a diversified allocation mathematically similar to the satisficer's.

  **Defeat or Concede?**
  This **concedes** the substantive point while salvaging the label of "maximization." It admits that the "naive" maximizer (optimizing point estimates) loses to the satisficer. It argues that a "sophisticated" maximizer (optimizing over posteriors) would win.

  **The Residue:**
  However, a residue of the satisficer's advantage remains: **computational and informational frictions in model specification.** To act like the Bayesian Maximizer, the agent must know (or estimate) the noise structure $\sigma^2$ and specify a prior. The satisficer requires neither. The aspiration level acts as a **free regularizer**. In an organizational setting where the noise structure is unknown or non-stationary, the Bayesian Maximizer risks *model error* (specifying the wrong prior or variance), whereas the satisficer's aspiration level (e.g., "match last year's average") is data-driven and robust. The satisficer achieves regularization without the burden of meta-modeling the uncertainty.

  ### Conclusion on Simon's Claim

  This case supports Simon's stronger claim that satisficing is a **normative alternative** in environments of high dimensionality and unquantified uncertainty. It shows that satisficing is not merely "maximizing under constraints" (since computation and info are free here), but a distinct strategy that trades off potential upside for robustness against estimation error.

  **Dependencies:**
  This conclusion depends heavily on the **structure** (high $N$, significant noise, unknown variance) rather than the specific numbers. If the environment is low-dimensional or the signal-to-noise ratio is high, the normative force of satisficing evaporates, and the "naive maximizer" becomes the superior normative model. The case demonstrates that satisficing is normatively superior *only* within the specific ecological niche of the "noisy high-dimensional choice," which Simon argued is the actual environment of most organizational decision-making.
