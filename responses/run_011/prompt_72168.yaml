answer: |-
  ### 1. Exam Question

  **FINAL EXAMINATION: MORAL PSYCHOLOGY**
  **Time Allowed:** 2 Hours
  **Instructions:** Answer the following question. Closed book. Expected length: ~1,200 words.

  **The Case of Ridge and Harbour**

  Consider two communities described by anthropologists:

  **Ridge.** After a wrongdoing, people report everything the standard criteria put in guilt: the object is the act, there is a felt demand to make repair, they go and find the person they harmed, they talk in terms of what is owed. But the language has no word that translates as *shame* and they find the idea of being lowered in someone's estimation unintelligible. And when repair is ruled out — the person died, or left for good and can't be reached — the feeling doesn't deepen or turn inward. It just stops. They say the matter is finished because there's nothing to be done, and no trace of self-assessment survives it.

  **Harbour.** People report everything the standard criteria put in shame except the social part: it's about what they are rather than what they did, they want to hide or disappear, they describe being exposed. But it never has an audience — not present, not imagined, not internalised. Asked whose eyes they are in they say nobody's, and insist that being seen would change nothing; they'd feel exactly the same under a guarantee of total secrecy, and the same if everyone found out and didn't mind. There's no pull to repair, only to conceal themselves, and they treat this as a standing fact about themselves rather than a response to any particular act.

  **The Question**

  Write an essay addressing the following three points in order:

  1.  Assess whether either description is psychologically coherent. Does Ridge have guilt and Harbour shame, or does this case show our taxonomy picks up vocabularies rather than emotions?
  2.  Explain what would have to be true of an emotion for a feature (such as *requires an audience* or *takes the self as its object*) to be **constitutive** of it instead of merely **typical**.
  3.  On the strength of that answer, determine whether a community could set out to **become** the Harbour kind. What would such a choice actually consist in, given that whoever is doing the choosing already has some emotional repertoire?

  ***

  ### 2. Model Answer

  The descriptions of Ridge and Harbour are designed to isolate specific features of moral emotion, but their coherence depends on whether we define emotions by their phenomenology or their functional role. Ridge presents a coherent picture of guilt stripped of shame. The cessation of feeling when repair becomes impossible suggests the emotion is entirely transactional; it exists to regulate social exchange, not to assess the agent. If guilt is fundamentally about restoring a breach in obligation, then no obligation means no guilt. This is psychologically stable, even if it lacks the lingering self-scrutiny familiar to us.

  Harbour is more problematic. It describes shame without an audience. Standard accounts hold that shame is essentially social—it requires an other, real or internalized, before whom one is diminished. Harbour residents feel exposure without eyes to see them. If we accept their report as coherent, we must conclude that the "audience" is not constitutive of shame but merely typical. However, this risks emptying the concept of shame of its distinctive function. If shame is about social standing, feeling it in a vacuum is unintelligible. If it is about self-ideal failure, the "audience" is simply the self split into judge and judged. Harbour claims no internal judge either, only a "standing fact." This suggests Harbour does not have shame, but a form of depressive self-loathing mislabeled as shame. Therefore, the taxonomy is not just vocabulary; it tracks functional structures. Harbour likely describes an incoherent state unless we redefine shame as purely private self-rejection.

  This leads to the distinction between constitutive and typical features. A feature is typical if it usually accompanies the emotion but its absence leaves the emotion intelligible. A feature is constitutive if removing it makes the emotion unintelligible or transforms it into something else. To test this, we ask: can the emotion perform its characteristic work without the feature? For guilt, repair is constitutive; without the urge to repair, it is merely regret. For shame, the audience is usually considered constitutive because shame regulates hierarchy. However, if shame's work is to enforce conformity to an ideal, the audience might be typical, while the "failure of the ideal" is constitutive. Harbour suggests the latter, but at the cost of losing the social regulatory function.

  Finally, could a community choose to become the Harbour kind? This depends on the voluntarity of emotion. One cannot simply decide to feel shame without an audience any more than one can decide to feel pain without nerve stimulation. Emotions are responses to appraisals. To become Harbour, the community would not just be changing feelings; they would be changing their appraisal structure. They would need to cultivate a self-conception where the self is objectively flawed regardless of social context.

  However, the choice is constrained by the existing repertoire. If the choosers currently understand shame as social, they cannot aim directly at Harbour-shame. They would have to dismantle the social internalization process. This would consist in suppressing the imagination of the other during moral failure. But this is paradoxical: to choose to feel shame without an audience is to choose to feel a specific pain for no functional reason. It is more likely they would become depressed rather than shame-prone. To succeed, they would need to redefine the self as inherently tainted, independent of action or observation. This is not a choice of emotion, but a metaphysical shift in anthropology. They would have to stop seeing themselves as agents who act and start seeing themselves as objects that exist wrongly. Thus, becoming Harbour is not a moral reform but an ontological shift. It is possible only if they can successfully rewrite the conditions under which they recognize themselves as selves. Without that, the attempt collapses into either standard shame (importing an audience) or pathology.

  ***

  ### 3. Marking Scheme

  **Total Marks: 25**

  **Must-Hit Moves (5 marks each)**

  1.  **Coherence Assessment:** The student must not simply label Ridge=Guilt and Harbour=Shame. They must evaluate whether Harbour is psychologically possible. (5 marks)
      *   *5:* Argues Harbour is incoherent or requires redefinition of shame.
      *   *0-2:* Accepts Harbour as straightforward shame without qualification.
  2.  **Constitutive vs. Typical Criteria:** The student must provide a philosophical criterion for distinguishing essence from accident (e.g., intelligibility, functional role). (5 marks)
      *   *5:* Defines the test (e.g., "if removed, is it still X?").
      *   *0-2:* Merely lists features without defining the distinction.
  3.  **Application to Audience/Self:** The student must apply the criterion to the "audience" feature of shame. (5 marks)
      *   *5:* Explains why audience might be essential (social regulation) or accidental (internal ideal).
      *   *0-2:* States audience is essential without argument.
  4.  **Voluntarity Constraint:** The student must address the difficulty of *choosing* an emotion. (5 marks)
      *   *5:* Notes emotions are responses/appraisals, not direct volitions.
      *   *0-2:* Treats emotion as a simple switch or policy decision.
  5.  **Commitment on Feasibility:** The student must conclude whether becoming Harbour is possible and what it costs (e.g., ontological shift vs. moral choice). (5 marks)
      *   *5:* Specific account of what changes (self-conception, appraisal structure).
      *   *0-2:* Vague conclusion ("it would be hard").

  **A vs. B Distinction**

  *   **A Grade (20-25):** The essay explicitly identifies the paradox of willing an emotion. It argues that becoming Harbour requires changing the *conditions of self-recognition*, not just moral habits. It treats the "choice" as a structural改造 (reconstruction) of the agent's psychology. It refuses to let Harbour off the hook as simply "shame."
  *   **B Grade (15-19):** The essay correctly identifies that Harbour is strange and that emotions aren't fully voluntary. However, it treats the choice as a matter of "training" or "culture" without explaining how one trains oneself to ignore an internalized audience. It accepts the Ridge/Guilt mapping too easily without probing the "cessation" of feeling.

  **Concrete Mistakes (Deductions applied within moves)**

  1.  **The Labeling Shortcut:** Writing "Ridge has guilt and Harbour has shame" without analyzing the coherence of Harbour's non-social shame.
      *   *Shows:* The student is reciting the standard taxonomy rather than engaging with the philosophical problem of emotion individuation.
  2.  **The Impossibility Dismissal:** Stating "Harbour is impossible because shame is essentially social" without explaining *why* it is essential (functional vs. phenomenological).
      *   *Shows:* The student is dogmatizing a definition rather than testing constitutive features.
  3.  **Voluntarism Error:** Claiming the community can "decide" to feel Harbour-emotions through willpower or rule-making.
      *   *Shows:* The student misunderstands the involuntary nature of emotional appraisal systems.
  4.  **Vocabulary Confusion:** Arguing that because Ridge lacks the *word* "shame," they cannot experience the *concept* of social estimation.
      *   *Shows:* The student conflates linguistic relativism with psychological incapacity.
  5.  **Ignoring the Repertoire Constraint:** Discussing the choice to become Harbour without mentioning that the choosers already have an existing emotional framework that resists this change.
      *   *Shows:* The student misses the reflexive problem of using current psychology to change current psychology.

  ***

  ### 4. Concrete Mistakes (Detailed for Graders)

  1.  **The Labeling Shortcut:** If a student writes "Ridge clearly demonstrates guilt and Harbour demonstrates shame" in the first paragraph and proceeds to compare them based on standard textbook definitions without questioning Harbour's coherence, deduct 5 marks from Move 1. This shows the student is reciting the standard taxonomy rather than engaging with the philosophical problem of emotion individuation.
  2.  **The Impossibility Dismissal:** If a student states "Harbour is impossible because shame is essentially social" without explaining *why* it is essential (e.g., functional role in hierarchy vs. phenomenological feeling), deduct 5 marks from Move 3. This shows the student is dogmatizing a definition rather than testing constitutive features against the case.
  3.  **Voluntarism Error:** If a student claims the community can "decide" to feel Harbour-emotions through willpower, policy, or education alone, deduct 5 marks from Move 4. This shows the student misunderstands the involuntary nature of emotional appraisal systems.
  4.  **Vocabulary Confusion:** If a student argues that because Ridge lacks the *word* "shame," they cannot experience the *concept* of social estimation, deduct 5 marks from Move 1. This shows the student conflates linguistic relativism with psychological incapacity.
  5.  **Ignoring the Repertoire Constraint:** If a student discusses the choice to become Harbour without mentioning that the choosers already have an existing emotional framework that resists this change (the paradox of using current psychology to change current psychology), deduct 5 marks from Move 5. This shows the student misses the reflexive problem inherent in the prompt.
