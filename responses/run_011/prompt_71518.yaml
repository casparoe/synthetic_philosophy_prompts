answer: |-
  Dear Julian and Marta,

  I have reviewed the transcript of your debate regarding the recent preprint on tumor mechanistic modeling, and I offer the following assessment of your exchange. My goal is to clarify where each argument lands and to suggest where the underlying disagreement might actually reside. I will walk through your eight turns in order, evaluating the success of each move, before addressing the four broader questions you circled around and finally noting what I believe both of you may have overlooked.

  Marta, your opening move succeeds within the standard framework of Bayesian confirmation theory. You correctly identify that on a strict likelihood account, the temporal order of evidence and hypothesis is irrelevant; only the probability of the evidence given the hypothesis matters. Your point that replicated data is often more reliable than fresh data is also practically sound, as it reduces the risk of experimental artifact. However, this success is conditional on accepting the idealization that known data can be treated probabilistically like unknown data, which Julian immediately challenges. Julian, your response in the second turn also succeeds logically. You correctly apply the problem of old evidence to show that if the probability of the datum is exactly one, conditionalizing on it yields no change in the probability of the hypothesis. This exposes a genuine tension in formal Bayesianism when applied to historical data, effectively blocking Marta's initial claim that timing never matters.

  Marta, your third turn succeeds as a reductio ad absurdum against Julian's strict conclusion. By invoking the historical case of Mercury's perihelion, you demonstrate that denying confirmation to old evidence contradicts scientific practice, where Einstein's derivation was indeed taken as strong support for general relativity. Your secondary point that human certainty is never literally one offers a plausible escape route from the formal problem. Julian, your fourth turn partly succeeds. You are correct that relying on subjective uncertainty makes confirmation dependent on the psychological state of the scientist, which seems to undermine the objective status of the theory. However, your historical distinction between the Mercury and Eclipse cases is debatable; while you argue the likelihood ratio differed due to competing hypotheses, many historians would argue the epistemic weight of the Mercury anomaly was indeed high precisely because it was old and stubborn, suggesting your dismissal of it may be driven by a desire to protect the strict Bayesian account rather than historical fact.

  Marta, your fifth turn partly succeeds. Proposing that what is learned is the entailment relation rather than the datum itself is a standard and formally valid repair for the old evidence problem. It allows for updating without violating the rule that probability one evidence confirms nothing. However, this sets up Julian's sixth turn, which succeeds in highlighting the cost of that repair. You correctly note that this makes confirmation a measure of logical omniscience or deductive speed, implying that a slower thinker or a machine gains less confirmation than a quick one, which clashes with the intuition that confirmation should track the relationship between theory and world, not theory and thinker. Marta, your seventh turn succeeds by drawing a crucial distinction between psychological updating and logical support. By shifting the focus to model tuning and the space of competing hypotheses, you move the debate from formal Bayesian updating to model evaluation, where accommodation is suspect because of overfitting risks rather than temporal order. Julian, your eighth turn succeeds in capturing the concession implicit in Marta's shift. You correctly point out that by appealing to tuning, she admits that two models with identical likelihood ratios relative to the data might deserve different credit, which contradicts her initial claim that only the likelihood ratio matters.

  Having traced the exchange, I turn to the four questions that underpinned your disagreement. First, regarding whether assigning probability one to known data is a harmless idealization or a damaging fiction, I believe it is a fiction that does real damage in this context. While mathematically convenient, it forces the formalism to ignore the distinction between learning a fact and learning that a theory explains a fact. Treating old data as certain blocks the very mechanism by which theories gain support from explaining established phenomena, requiring awkward repairs like the entailment move. Second, on whether Julian is right about the Mercury and Eclipse cases, I suspect he is smuggling his conclusion into his estimate of the likelihood ratio. By asserting that the probability of the anomaly given the denial of general relativity was high due to competitors like Vulcan, he lowers the likelihood ratio for Mercury to protect the rule that old evidence confirms nothing. Historically, however, the failure of Newtonian mechanics to account for Mercury was seen as a significant deficit, meaning the likelihood ratio was indeed favorable to Einstein, regardless of the date.

  Third, regarding the entailment repair, it works formally but survives very little of the damage claimed in the sixth turn. It solves the mathematical problem of updating on certainty but replaces it with a problem of logical omniscience. It makes confirmation subjective to the agent's deductive capabilities, which fails to capture the objective sense in which a theory explains the world. Finally, on whether Marta's separation of confidence change from support relation dissolves the disagreement, I believe it merely relocates it. It clarifies that Julian is talking about subjective belief updating while Marta is talking about objective model adequacy, but it does not resolve whether the preprint's authors deserve credit. It simply shifts the burden to defining what counts as a legitimate support relation outside of strict conditionalization.

  There are, however, elements missing from this debate that might explain why you reached an impasse. Both of you appear to be using the word confirmation in more than one sense without noticing. Julian is using it in the epistemic sense of justification for belief, where the history of discovery matters for the agent. Marta is using it in the pragmatic sense of model validation, where the history matters for assessing overfitting. In the context of the tumor model preprint, this distinction is vital. A mechanistic model that reproduces an old curve is not necessarily accommodating in the pejorative sense if its parameters were fixed by independent data. If the model structure was chosen specifically to fit that curve, then Marta's concern about tuning is correct. If the model structure was derived from first principles and merely happened to match the curve, then Julian's concern about old evidence is less relevant than the fact that the model survived a severe test.

  Furthermore, a working modeler and a philosopher would likely come away from the preprint with different practical verdicts. Marta, as a biostatistician, would likely look at whether the model parameters were tuned on the dose-response data or fixed elsewhere. If they were tuned, she would correctly view the reproduction as accommodation regardless of the Bayesian logic, because the model's generalizability is compromised. Julian, as a philosopher, is focused on whether the authors are justified in calling it a prediction. He is right that temporally it is not, but he misses that in modeling, prediction often refers to out-of-sample performance or mechanistic derivation rather than temporal novelty. You were both arguing about the logic of science, but the preprint is a piece of engineering science where the utility of the model matters as much as its truth. The authors claim success because the mechanism works, not because they surprised the community with a new number.

  In summary, Marta wins on the practical evaluation of the model's reliability, while Julian wins on the strict logical definition of prediction. Neither fully captures the situation because the preprint sits between pure theory and applied modeling. I suggest you agree that the word prediction was used loosely by the authors to mean mechanistic derivation rather than temporal novelty, and that the value of the paper lies in whether the mechanism offers new interventions, not whether it fits the Bayesian criteria for confirmation. I hope this helps you resume the group with renewed clarity.

  Sincerely,

  The Referee
