answer: |-
  Your hypothesis is correct, but it requires a slight sharpening. The disagreement is not merely "bookkeeping" in the sense of arbitrary preference; it is a substantive **metasemantic** disagreement about the relationship between linguistic practice and truth conditions. However, because this disagreement does not propagate to the truth-values of ordinary, non-theoretical sentences (the "QC data"), it feels verbal.

  Here is the diagnosis of the structure of the dispute, the remaining substantive question, and the role of the third camp.

  ### 1. The Diagnosis: Metasemantics, Not Semantics
  You have correctly identified that Supervaluationism (SV) and Epistemicism (E) are **extensionally equivalent** regarding ordinary discourse. If you hand them a part and ask, "Does this pass?", they will agree on the answer for every clear pass, every clear fail, and they will both refuse to give a determinate answer for the borderline case (though for different reasons).

  The dispute is not about the *semantics* (the truth conditions of sentences) but the *metasemantics* (what *makes* those truth conditions obtain).

  *   **The Epistemicist Claim:** Linguistic practice, combined with external facts, *determines* a unique extension (a sharp cutoff), even if that practice does not provide the *resources* to identify it. Meaning outstrips epistemic access.
  *   **The Supervaluationist Claim:** Linguistic practice *underdetermines* the extension. It selects a range of admissible precisifications, but no single one is privileged. Meaning is inherently incomplete.

  **Is it verbal?**
  It is not purely verbal, because they disagree on the truth of theoretical claims like "There exists a number $n$ such that $n$ is the cutoff."
  *   **E:** True. (There is a fact of the matter.)
  *   **SV:** False. (There is no single number that works on all precisifications.)

  However, since neither side thinks this theoretical claim affects the outcome of your QC work, the dispute is **substantive but isolated**. It is a disagreement about the *ontology of meaning*, not the *behavior of language*.

  ### 2. The Substantive Core: The Determination Constraint
  If we subtract everything they agree on, one sharp question remains. It is not about the world, nor about logic, but about **competence**.

  **The Question:** *Can a community's linguistic practice fix a precise boundary without fixing a method for speakers to recognize that boundary?*

  *   **Epistemicism says Yes.** It argues for a form of semantic externalism. Just as you can refer to "water" without knowing its chemical structure, you can mean "heap" without knowing the grain count. The boundary is fixed by causal/historical factors invisible to the speaker. The "mystery" critics complain about is simply the complexity of the causal chain linking use to reference.
  *   **Supervaluationism says No.** It argues for a constraint on meaning: if a boundary were truly fixed, a competent speaker with full information *could* in principle locate it. Since they can't, the boundary isn't fixed. The "artificiality" critics complain about (the "definitely" operator) is the necessary formal tool to model this semantic indecision without abandoning classical logic for clear cases.

  **Your QC Analogy:**
  *   **Epistemicism:** The blueprint has a specific line drawn in invisible ink. The part either meets it or it doesn't. We can't see the ink, but it's there.
  *   **Supervaluationism:** The blueprint says "approximately here." The inspector is authorized to draw a line anywhere within the shaded zone. Until the inspector draws it, there is no single line.

  ### 3. What Would Count as Progress?
  Given that the dispute is metasemantic, progress will not come from better logic or more intuitions about heaps. It will come from a **naturalized theory of reference**.

  *   **For the Epistemicist:** Progress requires explaining the *mechanism* of the hidden cutoff. Williamson suggests it involves margin-for-error principles in knowledge, but critics demand a causal story. How, physically or socially, does usage of "tall" select 182.4 cm rather than 182.5 cm? If they cannot provide a naturalistic account of this selection, the view remains "mysterious" as charged.
  *   **For the Supervaluationist:** Progress requires explaining why classical logic holds for ordinary sentences if the underlying semantics is gappy. They must show that the "definitely" operator tracks a genuine psychological or social phenomenon (e.g., "assertibility") rather than being a philosopher's invention. If they cannot link "supertruth" to actual norms of assertion, the view remains "artificial."

  **The Verdict on Progress:**
  No progress should be expected until the philosophy of language resolves the **normativity of meaning**. Until we know whether meaning is a fact that exists independently of our ability to grasp it (favoring E) or a rule constituted by our ability to grasp it (favoring SV), the two sides will talk past each other. The dispute is a proxy war for a larger unresolved issue in the theory of content.

  ### 4. The Third Camp: Ontic Vagueness
  You asked whether the existence of a camp that locates vagueness in the world (Ontic Vagueness) supports or undercuts this diagnosis.

  **It supports your diagnosis.**

  The existence of Ontic Vagueness highlights that Epistemicism and Supervaluationism are actually **allies**. They both agree on the following:
  1.  The world itself is precise (there are no vague objects).
  2.  Vagueness is a feature of representation (language or thought).

  The Ontic Vagueness proponent says, "You are both fighting over how language maps to the world, but you miss that the world itself might be fuzzy." By rejecting this, both E and SV commit to a precise world. This confirms your suspicion that their dispute is not about the "world" (metaphysics) but about "theoretical bookkeeping" (semantics/metasemantics).

  If the world were vague, your QC gauge would be measuring something inherently fuzzy. Since both E and SV assume the gauge measures a precise reality, their disagreement is strictly about whether the *label* on the gauge ("Pass") has a hidden sharp definition (E) or is inherently a range (SV).

  ### Summary
  Your hypothesis is robust. The dispute is a **metasemantic disagreement about the determination of meaning**.
  *   **Substantive Question:** Does use determine a unique extension that outstrips epistemic access?
  *   **Progress:** Requires a naturalistic account of reference (for E) or a psychological account of assertibility (for SV).
  *   **Ontic Vagueness:** Confirms that E and SV are arguing within a shared framework of a precise world, making their dispute internal to the theory of representation.

  You have reached the correct conclusion: for the purposes of manufacturing (and ordinary life), the difference is undetectable. The pressure to pick one side comes only from a theoretical demand to explain *why* the difference is undetectable. One side says "hidden fact," the other says "no fact." That is the entire remaining distance between them.
