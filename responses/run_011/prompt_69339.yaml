answer: |-
  Your hunch is sound, and your economist colleague has made a category error that is common when bridging philosophy and economics. She is treating a path-dependence problem (QWERTY) as a pure coordination problem (Lewisian convention). While they overlap, the mechanics of their stickiness differ in ways that matter deeply for her conclusion about surname norms.

  Here is the audit of the QWERTY case against Lewis's specific clauses, followed by the implications for the surname norm and the Sweden case.

  ### The Lewis Audit: QWERTY Clause by Clause

  David Lewis defines a convention as a regularity in behaviour that solves a recurrent coordination problem. For something to be a Lewisian convention, it must satisfy several conditions. Let us test QWERTY against them.

  **1. There is a regularity in behaviour.**
  *Verdict: Satisfied.*
  Almost everyone types on QWERTY. This is straightforward.

  **2. There is a mutual expectation that others will conform.**
  *Verdict: Satisfied.*
  I expect you to have a QWERTY keyboard; you expect me to be able to use one. If I turn up to your office with a Dvorak laptop, we both anticipate friction.

  **3. There is a conditional preference to conform (given that others do).**
  *Verdict: Satisfied.*
  I prefer to type on QWERTY *if* you are using QWERTY, because we need to share hardware and I need to use your machine in an emergency. The payoff is highest when we match.

  **4. There is a general preference for general conformity to this regularity over some alternative.**
  *Verdict: Failed (or at least compromised).*
  This is the critical failure point. Lewis requires that the group prefers the state of affairs where *everyone* follows R (QWERTY) to the state of affairs where *everyone* follows R* (Dvorak).
  With QWERTY, this is not necessarily true. Many typists would prefer a world where *everyone* used Dvorak, even if they currently use QWERTY. They tolerate QWERTY only because switching is costly, not because they prefer the QWERTY equilibrium to the Dvorak equilibrium. In Lewis's strict sense, a convention implies we are indifferent between the equilibria *ex ante*, or at least prefer the current one. QWERTY is a "locked-in" equilibrium, not necessarily a preferred one.

  **5. There is an alternative regularity that would serve almost as well.**
  *Verdict: Disputed.*
  This depends on the historical wrinkle you mentioned. If QWERTY was designed to prevent typebar jamming and is technically inferior to Dvorak for ergonomics, then it is arbitrary in the sense that Dvorak *could* have worked. However, if the new literature is correct and QWERTY is actually optimal for modern typing speeds, it ceases to be arbitrary. It becomes simply the best tool. If it is the best tool, it is not a convention; it is a technical standard.

  **6. The regularity is self-enforcing via expectations.**
  *Verdict: Partially Failed.*
  Lewis argues conventions persist because I expect you to do it, and you expect me to. With QWERTY, the persistence is largely due to *sunk costs* (hardware already bought, muscle memory already trained), not just expectations. If we could magically swap our muscle memory overnight without cost, the expectation alone might not keep us on QWERTY if we believe Dvorak is superior. The "enforcement" comes from capital and biology, not just game-theoretic expectations.

  ### The Disanalogies: What Hurts the Argument?

  Your colleague can shrug off the historical dispute about typebars. Even if QWERTY was arbitrary *originally*, the question is what sustains it *now*.

  The disanalogy that actually hurts her argument is the **mechanism of stickiness**.
  *   **Lewisian Convention:** Stickiness comes from *expectations*. I do it because I think you will. If we could all agree to switch instantly, we would.
  *   **QWERTY Lock-in:** Stickiness comes from *switching costs*. I do it because I have invested in it.

  Why does this matter? Because it changes the remedy. If a norm is Lewisian, you need a **focal point** (a signal to coordinate the switch). If a norm is QWERTY-ish (capital/sunk-cost based), you need **subsidies or coercion** to offset the switching costs. A celebrity endorsement (a focal point) does not retrain my fingers or replace my keyboard.

  ### The Surname Norm: Coordination or Conflict?

  This is where your colleague's argument is most vulnerable. She assumes the surname norm is a coordination problem like QWERTY. But Lewisian conventions only work where interests align. We all want to be able to read each other's typing.

  Does everyone want the same outcome regarding surnames?
  *   **If yes (Coordination):** We just need to match. It doesn't matter whose name we use, so long as we agree.
  *   **If no (Conflict):** Men might prefer women take their name (tradition, lineage); women might prefer keeping their own (identity, career).

  If the surname norm involves conflicting preferences, it is not a Lewisian convention. It is a **bargaining problem** or a **social norm backed by sanction**.

  **Does this make attitude change useless?**
  No. In a pure coordination game (like QWERTY), attitudes are irrelevant; only expectations matter. I don't need to *like* QWERTY, I just need to *expect* you to use it.
  But in a conflict game, attitudes *are* the battlefield. If women's preference for keeping their names strengthens (attitude change), the bargaining power shifts. The equilibrium moves not because a focal point told them to, but because the underlying payoffs changed.

  Therefore, if the surname norm is not purely arbitrary (i.e., if one side benefits more than the other), working on individual attitudes is not a waste of time. It alters the value of the outcomes, making the old equilibrium less stable. Her claim that "individual attitudes are a waste of time" only holds if the norm is purely arbitrary and coordination-based. If it rests on power dynamics or unequal benefits, attitudes are the engine of change.

  ### The Sweden Case: Focal Point or Force?

  The 1967 switch from left-hand to right-hand traffic (Dagen H) is often cited as a convention shift. Does it support her?

  *   **Supports her:** It shows a convention *can* be moved deliberately.
  *   **Cuts against her:** It was not achieved by a "big employer" or a "celebrity" acting as a focal point. It was achieved by **state coercion**. The government changed the law, imposed speed limits, and mobilised the police.

  This suggests that for deep-seated behavioural regularities, a "focal institution" is not enough unless it has the power to enforce compliance during the transition. A church or a celebrity can suggest a focal point, but they cannot lower the switching costs or punish defectors during the messy transition period. Sweden shows that moving a convention often requires the machinery of the state, not just a nudge from a coordinator. This undermines her optimistic view that a "big employer" could cheaply shift the surname norm.

  ### A Better Image: The Escalator

  If you need an image that captures arbitrariness and stickiness without smuggling in factories and machinery, consider **the standing side of the escalator**.

  In London, the norm is "Stand on the Right, Walk on the Left." In other cities, it is reversed.
  *   **Arbitrary:** There is no physical reason why right must be for standing.
  *   **Sticky:** If you stand on the left in London, you will be tutted at, bumped, or asked to move.
  *   **No Machinery:** It relies entirely on mutual expectation and social pressure, not capital goods.
  *   **Coordination:** Everyone benefits from the flow, but no individual can change the side they stand on without causing obstruction.

  However, even this image reveals the flaw in your colleague's argument. To change the escalator norm, a sign (focal point) is not enough. You need enforcement (station staff telling people to move) and time for the expectation to reset.

  ### The Payoff

  Your colleague is half-right: you cannot change a convention merely by persuading individuals to act against their expectations. If I keep my surname while expecting everyone else to expect me to take my husband's, I pay a social cost.

  But she is half-wrong:
  1.  **Mechanism:** If the norm is sustained by unequal benefits (conflict) rather than pure coordination, changing attitudes *does* work, because it changes the incentives.
  2.  **Coordinator:** A "focal institution" without enforcement power (like a celebrity or a single employer) is unlikely to succeed where the state in Sweden was required.
  3.  **Arbitrariness:** If the surname norm is not arbitrary (i.e., if it serves a patriarchal function that some wish to retain and others wish to dismantle), it is not a convention in Lewis's sense at all. It is a power structure.

  **Conclusion:**
  If the surname norm is Lewisian, she is right that you need a coordinator, but wrong that it can be done "cheaply" without enforcement. If the surname norm is *not* Lewisian (because it involves conflict), she is wrong that attitudes are useless; attitudes are the very thing that determines which equilibrium is stable.

  Given that surname norms are deeply tied to identity and lineage (conflicting interests), the "Conflict Game" model is more accurate than the "QWERTY" model. Therefore, cultural work on attitudes is not a waste of time; it is the necessary precondition for shifting the equilibrium. A focal point helps, but only once the underlying preferences have shifted enough to make the old convention untenable.

  Use the escalator, not the keyboard. It reminds us that conventions are about how we move together, not about the machines we are stuck with.
