      *   *How to break equivalence?*
      *   *The "Overwrite" mechanism.*
      *   If Orwellian, the experience of "Stationary Red Dot" is *false* in retrospect. But the experience of the Letter was veridical.
      *   If Stalinesque, the experience of "Stationary Red Dot" never happened.
      *   *Key:* **Meta-cognitive Confidence.**
      *   No, that's subjective.
