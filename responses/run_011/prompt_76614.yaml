      *   *Prediction:* Orwellian = Higher detection of Square. Stalinesque = Lower detection (filtered out during construction).
      *   *Timing:* Probe in the ISI.
      *   *Cheating:* Assumes Stalinesque construction filters data. Maybe it doesn't.
      *   *Refinement:* Make the Probe *depend* on the stationary nature.
      *   *Task:* "Was the object at the start location stationary or moving?" (No, can't ask about dots).
      *   *Task:* Identify the color of the Probe.
      *   *Let's settle on the "Attentional Spotlight" divergence.*
      *   If Stalinesque, attention is allocated to the *trajectory* only after Dot 2.
      *   If Orwellian, attention is at Location 1, then jumps.
      *   *Probe:* A faint target at Location 1 vs Location 2 vs Midpoint.
