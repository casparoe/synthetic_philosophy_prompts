          *   Orwellian: The system saw Left, then Right. Midpoint was empty. Revision says "Motion." If a bar was there, does the revision suppress it (because motion was smooth?) or highlight it?
      *   *This is getting muddy.*

      *   *Let's go back to the "Probe at Start Location" idea but refine the prediction.*
      *   *Design:*
          1.  Stimulus A (Red, Left) at t=0.
          2.  Probe (Letter T or F) at Left location at t=40ms.
          3.  Stimulus B (Green, Right) at t=80ms.
          4.  ISI = 40ms (strong phi).
          5.  Task 1: Report Motion/Color (standard phi check).
          6.  Task 2 (Forced Choice): What was the Letter?
      *   *Timing Window:* Probe must be after A is processed but before B triggers the revision/construction.
      *   *Prediction:*
          *   Orwellian: Subject consciously sees A. Attention is at Left. Probe is clearly seen. Accuracy High. (Revision happens later, doesn't affect Letter report if made immediately).
          *   Stalinesque: Consciousness is paused until B arrives. The system is buffering A. Attention is not yet allocated to the conscious field at Left. Probe is processed pre-consciously. Accuracy Low (or chance) because it never entered the conscious stream before the "rendering" of the motion scene overwrote the buffer.
