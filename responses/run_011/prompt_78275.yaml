  # HANDOUT: THE CENTIPEDE DECISION TREE

  **Instructions:** Answer the following questions honestly based on your current intuition about the Centipede Game. Do not worry about which position your answers support; there are no "correct" paths. Follow the branches to find your assigned leaf position. Bring your leaf description to the discussion.

  **1. The Status of the Argument**
  Consider the game exactly as formally defined: finite nodes, perfect information, and fixed payoffs known to both players. Does the standard backward induction argument prove that taking at the first node is the only rational choice?
  *   **(A) Yes:** The logic is sound for the game as defined. → *Go to 2.*
  *   **(B) No:** The logic relies on hidden or flawed assumptions. → *Go to 3.*

  **2. The Status of the Subjects**
  If the logic is sound, do experimental subjects who pass the first node make a mistake of rationality?
  *   **(A) Yes:** They are failing to maximize given the rules. → *Go to 4.*
  *   **(B) No:** They are rational, but the situation is not what the formal model says. → *Go to 5.*

  **3. The Source of the Flaw**
  If the logic is not sound, where does the argument break down?
  *   **(A) Counterfactuals:** We cannot reason about what *would* happen at nodes that are never reached. → *Leaf C (Counterfactual Skepticism)*
  *   **(B) Agency:** Rationality does not require individual maximization at every node (e.g., team reasoning). → *Leaf D (Non-Individualistic Rationality)*
  *   **(C) Payoffs:** The formal payoffs do not match the psychological rewards players actually seek. → *Leaf E (Payoff Skepticism)*

  **4. The Weight of the Error**
  If subjects are making a mistake, does this reveal a deep problem with game theory?
  *   **(A) No:** It is merely human error; the theory remains perfect for ideal agents. → *Leaf F (Orthodox Trivialism)*
  *   **(B) Yes:** It shows the theory cannot apply to real agents without modification. → *Go to 6.*

  **5. The Nature of the Divergence**
  If subjects are not mistaken, why does their behavior differ from the theory?
  *   **(A) Uncertainty:** Players are unsure about the other's payoffs or rationality. → *Go to 7.*
  *   **(B) Cognition:** Players have limits on how many steps of reasoning they can perform. → *Go to 8.*
  *   **(C) Belief Revision:** Players update their beliefs about rationality after observing an unexpected move. → *Leaf G (Epistemic Revision)*

  **6. The Role of Noise**
  If the theory is right but subjects err, is this error random or systematic?
  *   **(A) Random:** Players sometimes "tremble" or slip, but the equilibrium holds. → *Leaf H (Trembling Hand Perfection)*
  *   **(B) Systematic:** The error reveals a structural limit in how we define rationality. → *Leaf I (Bounded Rationality)*

  **7. The Type of Uncertainty**
  If uncertainty explains the passing, is this uncertainty a defect of the laboratory or a feature of interaction?
  *   **(A) Defect:** In a true common-knowledge setting, they would take. → *Leaf J (Incomplete Information Model)*
  *   **(B) Feature:** Uncertainty about rationality is always present in strategic interaction. → *Leaf K (Common Belief in Rationality)*

  **8. The Mode of Cognition**
  If cognitive limits explain the passing, how should we model them?
  *   **(A) Noise:** Limits act as random errors in choice. → *Leaf L (Quantal Response)*
  *   **(B) Steps:** Limits act as a cap on the depth of iterated reasoning. → *Leaf M (Level-k Reasoning)*

  **9. The Normative Axis**
  (For all leaves): Is the primary value of the theory to prescribe how players *should* act or to predict how they *will* act?
  *   *(Note: Mark your answer on your leaf sheet. This divides the room into Normative and Explanatory camps within each position.)*

  ---

  ### LEAF DESCRIPTIONS

  **Leaf A: Counterfactual Skepticism**
  *   **Commitment:** Backward induction fails because reasoning about unreached nodes is undefined.
  *   **Hardest Pill:** You must accept that rational choice cannot depend on what would happen if you did something you won't do.

  **Leaf B: Non-Individualistic Rationality**
  *   **Commitment:** Backward induction fails because rationality allows for group-maximization (team reasoning).
  *   **Hardest Pill:** You must accept that individuals can rationally act against their own payoff to maximize a group payoff without altruism.

  **Leaf C: Payoff Skepticism**
  *   **Commitment:** Backward induction is valid, but lab payoffs differ from formal payoffs (e.g., fairness utility).
  *   **Hardest Pill:** You must accept that the experiment did not actually test the Centipede Game, but a different game entirely.

  **Leaf D: Orthodox Trivialism**
  *   **Commitment:** Backward induction is right, subjects are wrong, and this is philosophically uninteresting.
  *   **Hardest Pill:** You must accept that the paradox is merely a performance error with no theoretical implications.

  **Leaf E: Epistemic Revision**
  *   **Commitment:** Backward induction is valid, but common knowledge of rationality collapses after an unexpected move.
  *   **Hardest Pill:** You must accept that a player can be rational at the start but effectively "become" irrational in the eyes of the opponent after one move.

  **Leaf F: Trembling Hand Perfection**
  *   **Commitment:** Backward induction is right, but players assign a probability to accidental errors.
  *   **Hardest Pill:** You must accept that rational players pass early solely to hedge against the tiny chance their opponent slips up later.

  **Leaf G: Bounded Rationality**
  *   **Commitment:** Backward induction assumes unbounded cognition; subjects are rational within limits.
  *   **Hardest Pill:** You must accept that there is no single standard of rationality, but rather a spectrum based on cognitive capacity.

  **Leaf H: Incomplete Information Model**
  *   **Commitment:** Subjects are rational; the model fails because it assumes perfect knowledge of types.
  *   **Hardest Pill:** You must accept that the "paradox" vanishes if we simply admit we don't know who we are playing against.

  **Leaf I: Common Belief in Rationality**
  *   **Commitment:** Uncertainty about rationality is intrinsic; common *belief* suffices where common *knowledge* fails.
  *   **Hardest Pill:** You must accept that rationality is not a fact to be known, but a hypothesis to be maintained probabilistically.

  **Leaf J: Quantal Response**
  *   **Commitment:** Choices are probabilistic functions of expected payoffs, not sharp maximizations.
  *   **Hardest Pill:** You must accept that "rational choice" is inherently noisy, even for ideal agents.

  **Leaf K: Level-k Reasoning**
  *   **Commitment:** Players reason in steps; most stop at level 1 or 2, not infinity.
  *   **Hardest Pill:** You must accept that deep strategic reasoning is not the norm, and "rationality" is relative to the population's depth.

  **Leaf L: Methodological Dualism**
  *   **Commitment:** The theory is normatively correct but descriptively false; both statuses are valid.
  *   **Hardest Pill:** You must accept that game theory cannot be a unified science of behavior and prescription simultaneously.

  ---

  # INSTRUCTOR'S KEY & LOGICAL ANALYSIS

  ### 1. Logical Space Construction
  The tree is built on two primary axes (Requirement 3) and several secondary dimensions (Requirement 2).

  **Primary Axes:**
  1.  **Theory Validity:** Does BI hold for the formal game? (Node 1)
  2.  **Subject Rationality:** Do passing subjects make a mistake? (Node 2)

  **Secondary Dimensions:**
  *   **Source of Deviation:** Uncertainty vs. Cognition vs. Belief Revision (Node 5).
  *   **Nature of Flaw:** Counterfactuals vs. Agency vs. Payoffs (Node 3).
  *   **Normative Status:** Prescriptive vs. Descriptive (Node 9).

  **Mapping Leaves to Axes:**
  *   **Theory Right / Subject Wrong:** Leaf D (Trivialism), Leaf F (Trembling Hand), Leaf G (Bounded Rat - *Note: This leaf bridges axes depending on interpretation, see below*), Leaf J (Quantal).
  *   **Theory Right / Subject Right:** Leaf E (Epistemic Revision), Leaf H (Incomplete Info), Leaf I (Common Belief).
  *   **Theory Wrong / Subject Right:** Leaf A (Counterfactual), Leaf B (Team Reasoning), Leaf C (Payoff).
  *   **Ambiguous / Meta:** Leaf L (Dualism).

  ### 2. Analysis of Empty Cells (Requirement 5)
  You asked specifically about the cell: *Counterfactual reasoning is well-behaved, but Common Knowledge of Rationality (CKR) collapses only after the first off-path move.*

  *   **Status:** This cell is **occupied**, not empty. It corresponds to **Leaf E (Epistemic Revision)**.
  *   **Assessment:** I disagree with the suspicion that this view is unexplored. It is a standard position in epistemic game theory (associated with the analysis of *conditional common belief in rationality* and belief revision policies à la Stalnaker or Brandenburger). It is distinct from "Incomplete Information" (where CKR never held) and "Orthodox BI" (where CKR holds throughout).
  *   **Why it might feel empty:** It is often conflated with Incomplete Information models. The tree separates them at Node 5 (Belief Revision vs. Uncertainty) to force this distinction.
  *   **Other Empty Cells:**
      *   *Theory Wrong / Subject Wrong:* This cell is **incoherent**. If the theory is wrong about the game, the subject cannot be "wrong" relative to that theory's prescription. (Handled by tree structure).
      *   *Counterfactuals Ill-defined / CKR Holds:* This cell is **incoherent**. If CKR holds, BI follows, which requires well-behaved counterfactuals.

  ### 3. Indistinguishable Leaves (Requirement 6)
  **Pair:** Leaf F (Trembling Hand) and Leaf J (Quantal Response).
  *   **Issue:** Both model deviation as probabilistic noise. In a 90-minute discussion, the distinction (equilibrium refinement vs. behavioral model) may be too technical for the tree to separate cleanly.
  *   **Further Question:** "Is the probability of error part of the definition of the equilibrium solution, or is it a description of the choice function?"
  *   **Decision:** I kept them separate in the tree (Node 6 vs Node 8) to preserve the "Bounded Cognition" requirement, but flag them as potentially merging in discussion.

  **Pair:** Leaf H (Incomplete Information) and Leaf I (Common Belief).
  *   **Issue:** Both rely on uncertainty.
  *   **Further Question:** "Is the uncertainty about the *payoff structure* (types) or about the *rationality status* of the opponent?"
  *   **Decision:** Node 7 attempts this split (Defect/Feature), but students may conflate them.

  ### 4. Critique of Proposed Nodes (Requirement 7)
  You asked me to flag poor nodes.

  *   **Node 4 ("Does this reveal a deep problem?"):**
      *   *Critique:* This risks begging the question. A student who thinks "Theory Right/Subject Wrong" might think it *is* a deep problem precisely *because* subjects are wrong (e.g., human nature is flawed).
      *   *Replacement:* "Is the discrepancy due to the *agents* (human error) or the *model* (missing variables)?" This separates Trivialism (Agent fault) from Trembling Hand/Boundedness (Model fault).
      *   *Adjustment in Handout:* I phrased it as "Does this reveal a deep problem with game theory?" to focus on the theory's status, but be prepared to clarify this distinction in the seminar.

  *   **Node 9 (Normative Axis):**
      *   *Critique:* Placing this as a final note rather than a branching node risks it being decorative (violating Requirement 3).
      *   *Defense:* Making it a branching node would double the leaves to 24, violating the "8-12 leaves" constraint.
      *   *Solution:* I instructed students to "Mark your answer on your leaf sheet." This ensures the distinction is structural to their position without exploding the tree size. In discussion, you can split each leaf group by this marker.

  *   **Node 1 ("Does the... argument prove..."):**
      *   *Critique:* Students may answer "Yes" because they think it *should* prove it, not that it *does*.
      *   *Defense:* The phrasing "for the game as defined" attempts to isolate the formal validity from the application.

  ### 5. Funneling Check (Instructor's Note)
  Your working view is **Leaf E (Epistemic Revision)**.
  *   **Path to Leaf E:** Node 1 (Yes) → Node 2 (No) → Node 5 (C).
  *   **Risk:** Students who want to sound sophisticated may gravitate toward "No" at Node 2 and "Belief Revision" at Node 5.
  *   **Mitigation:** The tree offers equally "sophisticated" exits on the "No" branch at Node 1 (Counterfactual Skepticism, Team Reasoning). These are structurally symmetrical options. The "Trivialism" leaf (Leaf D) is also protected as a valid "Yes/Yes/No" path, ensuring the "Orthodox" view isn't painted as naive.

  ### 6. Formatting Note
  The handout is designed to fit on two pages.
  *   **Page 1:** Instructions, Nodes 1–8.
  *   **Page 2:** Leaf Descriptions (A–L) and Node 9 instruction.
  *   **Font:** Use 11pt or 12pt serif. Indentation should be clear (0.5 inch per level).
