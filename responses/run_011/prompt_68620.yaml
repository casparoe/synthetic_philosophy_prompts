  Here's the question, and if your answer is "then widen the class," tell me by what rule: in your method, what's doing the work, the frequency or the resemblance? Because if it's the resemblance, you're back inside the story you said you didn't trust, and if it's the frequency, you're quoting me a number about a bunch of things that aren't like this thing.
