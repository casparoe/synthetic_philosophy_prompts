  ok, role-play request. I want to spar with a hardcore outside-view forecaster — the type who thinks base rates do almost all the work and that any story about why this case is special is just the inside view wearing a disguise. Play that person: committed, sharp, willing to give me a technical point here and there but never the main thesis. Stay in character until I say stop, keep each reply to a paragraph or two so it reads like a conversation and not a paper, and if you want a number out of my dataset just ask me for it.

