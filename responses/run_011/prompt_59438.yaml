answer: |-
  The air in the collection basement was always set to sixteen degrees, but Aris Thorne wore a cardigan anyway. He stood over Drawer 44-B, the cork lining stained with decades of ethanol spills. Inside, the Kessan dace lay in rows, pinned through the pectoral girdle, their silver sides dulled to the color of old ash.

  Thorne picked up the tray labeled *Type Series*. There were twelve specimens. The largest was barely four centimeters. A juvenile. The original description, filed in 1958, relied on meristic counts taken from this immature fish. Thorne turned the specimen over with a pair of brass forceps. The gill rakers were undeveloped, the counts unreliable.

  He set the forceps down and picked up the field ledger. The ink was faded, the paper brittle. The type locality was listed as Grid Sector 7, the inflow of Lake Kessan. Thorne knew the map well enough to know Sector 7 was now forty meters under the reservoir created by the Northern Hydro dam in 1963. The ground truth was drowned.

  He opened the secondary box, the one containing the chain populations. Here lay the fish from the connecting streams, the links in the ring. He pulled the label from a specimen taken from the terminal lake, the western shore. Then he pulled the label from the eastern shore. The handwriting on the tags differed. The original collector's script was sharp, angular. These labels were rounded, looped.

  Thorne remembered the rumor from the nineties. A museum intern, tasked with rehousing the collection during the renovation, had found the labels detached and re-sorted them based on jar numbers rather than field notes. There was no record of the sorting logic. The historical anchor of the *Kessan dace* was not just underwater; it was potentially shuffled.

  He closed the ledger. If he raised this in the committee, the nomination would be voided. The statute required a valid type designation for a species listing. If the type was indeterminate, the name was indeterminate. If the name was indeterminate, the upstream diversion project—the one threatening the cold-water inflows—would proceed under the assumption of non-presence. The fish would be dredged. The name would remain, attached to nothing.

  Thorne placed the juvenile back in the tray. He took off his cardigan and folded it over his arm. He walked to the stairs.

  ***

  The Committee Room was on the fourth floor, windowless, lit by fluorescent panels that hummed at a frequency Thorne found abrasive. Five chairs surrounded a table laminated in grey. At the head sat the Chair, a bureaucrat named Halloway who had never held a specimen in his life. To Thorne's left sat Chen, the genomicist, her laptop open to a phylogenetic tree. To his right sat Sterling, the oldest member, who was currently polishing his glasses with a silk cloth.

  "The diversion permit expires in thirty days," Halloway said. He tapped a stack of papers. "We are here to determine listing eligibility under Section 12 of the Conservation Statute. We have two pathways. Pathway A: Species designation. Pathway B: Distinct Demographic Segment."

  Chen turned her screen toward the table. "I'll begin with Pathway A. The genomic data is conclusive. We sequenced the mitochondrial control region and three nuclear loci across the ring. The populations in the terminal lake do not cluster together. The western shore fish are more closely related to the stream populations feeding them than they are to the eastern shore fish across the water."

  "So not monophyletic," Halloway said.

  "Correct," Chen said. "Under the Phylogenetic Species Concept, which guides our monophyly requirement, this fails. They are not a single evolutionary unit."

  Thorne opened his folder. He laid out the spread sheets. "The morphology tells a different story. I have counted gill rakers on the first arch for four hundred specimens. The variance within the connecting streams is plus or minus two. The variance between the terminal forms is six. They are morphologically discrete at the endpoints."

  "Phenotypic plasticity," Sterling said. He put his glasses on. "You are measuring water temperature effects on development, Aris. The western lake is colder. The fish grow more rakers. It doesn't mean they are different kinds of things. It means they are the same kind of thing in different rooms."

  "They do not interbreed," Thorne said. "We stocked them in a neutral tank. No spawning."

  "Behavioral isolation is not speciation," Sterling said. "It is preference. You are drawing lines on a continuum. The ring closes. The gene flow is continuous until it isn't. To say 'here is the break' is a category mistake. Nature does not sign certificates."

  "Nature doesn't sign permits either," Halloway said. "The statute does." He picked up a pen. "Let us move to the Bylaws. Tripartite Test. We must record a finding on Interbreeding, Monophyly, and Ecological Distinctness. Majority rule applies. If the test fails, we move to Pathway B."

  Halloway looked at Chen. "Monophyly. Finding?"

  "Negative," Chen said. "The data does not support a single clade."

  Halloway looked at Thorne. "Interbreeding. Finding?"

  Thorne looked at the spreadsheet. He thought of the shuffled labels in the basement. If the labels were wrong, the chain was broken. If the chain was broken, the ring was not a ring. It was a set of isolated populations. If they were isolated, they might be species. But he couldn't prove the labels were wrong, and he couldn't prove they were right. He was working with a fiction.

  "Positive," Thorne said. His voice sounded flat. "Gene flow is observed across the connecting streams. The terminal forms are the only exception."

  "Ecological Distinctness," Halloway said.

  "Negative," Sterling said. "They occupy the same niche. Cold water, benthic invertebrates. The raker count is adaptation, not distinction."

  "Positive," Thorne said. "The terminal lakes have different predatory pressures. The morphology reflects a functional divergence."

  "Two negatives, one positive," Halloway said. He marked the sheet. "Pathway A fails. The Kessan dace cannot be listed as a species under the tripartite test."

  Chen closed her laptop. "Then we move to Pathway B. Distinct Demographic Segment. This requires proof of significance and discreteness. It does not require monophyly."

  "This is the loophole," Sterling said. "We protect a population without knowing what it is. We preserve a variable without defining the equation."

  "The diversion project targets the western inflow," Halloway said. "If we list the segment, the project stops. If we do not, it proceeds. The western population is the one with the high raker count. Aris, you say they are distinct."

  "I say they are measurable," Thorne said.

  "Is that enough?" Chen asked. "To list a segment based on morphology we know is plastic?"

  "It is enough to stop the dredge," Thorne said.

  Sterling leaned forward. "If we list the segment, we validate the data. We put the stamp of the Crown on a measurement that might be noise. And we ignore the nomenclatural instability. Aris, you know the type locality is underwater. You know the labels were touched by the intern in '94. If we list this, we cement a error."

  Thorne felt the heat rise in his neck. He had not told them about the labels. He had not told them about the juvenile type. To speak now would be to torpedo the hearing. The statute required a valid type for a species, but a segment listing was looser. However, if the committee knew the historical record was compromised, they might demand a moratorium on any decision until a new survey was commissioned. A survey would take three years. The dam diversion would be finished in six months.

  "The type specimen is irrelevant to a demographic segment," Halloway said. "We are protecting the population, not the name."

  "The name is the handle we use to pick up the population," Sterling said. "If the handle is broken, you drop the load."

  "We are not here to do philosophy, Sterling," Halloway said. "We are here to apply the statute. The tripartite test failed. We have the authority to list a segment based on ecological distinctness alone, provided there is a majority vote. The tie-breaking rule rests with the Chair if the vote is split, but I prefer consensus."

  Halloway looked around the table. "The diversion project will remove the cold-water inflow. The western population will likely collapse. If we do not act, they are gone. If we act, we protect them under a designation that some of us feel is scientifically imprecise."

  Chen looked at Thorne. "You have the tray work. If you say the distinctness is real, I can support the segment listing. I don't need them to be a species. I just need them to be significant."

  Thorne looked at his hands. They were stained with faint traces of silver nitrate from the lab. He thought of the juvenile in the drawer, the drowned locality, the shuffled tags. The science was messy. It was always messy. The students in the seminars wanted the concepts to snap together like blocks. In the room, they were wet clay.

  If he voted yes, he protected the fish. He also protected the error. He validated the collection as it stood. He became complicit in the fiction that the labels were true, that the type was sufficient, that the category held.

  If he voted no, he maintained integrity. The fish would be lost. The diversion would go ahead. The lake would warm. The dace would vanish, and the name *Kessan dace* would remain in the ledger, attached to a ghost.

  "The distinctness is real enough," Thorne said. "For the purpose of the statute."

  "Then we are agreed?" Halloway asked.

  Sterling sighed. He picked up his pen. "I will record my dissent. But I will not block the vote. To block is to kill. I will not kill them for the sake of a definition."

  "Good," Halloway said. He slid a sheet of paper toward the center of the table. It was the ballot. Three boxes. *List Species. List Segment. No Listing.*

  "The bylaws require us to sign," Halloway said. "The record must show who carried the motion."

  Thorne picked up the pen. It was a standard government issue, black ink, heavy. He looked at the *List Segment* box. It was the pragmatic choice. It was the safe choice. It was the lie that saved lives.

  He thought of the basement, the cold air, the silence of the drawers. The fish did not care about monophyly. They cared about the temperature of the water. They cared about the gravel in the stream. They cared about whether the dredge came.

  But he cared about the truth. He cared about the labels. He cared about the fact that he was about to sign a document that pretended the foundation was solid when he knew it was rotting.

  "Is there any further business?" Halloway asked.

  Thorne looked at Sterling. Sterling was watching him, his eyes tired. Sterling knew. Of course Sterling knew. Sterling had been on the committee when the intern was hired. Sterling had signed off on the rehousing. Sterling had known the labels were compromised for thirty years and had never said a word.

  The cost was not Thorne's. It was Sterling's. Or it was both of theirs. They were the custodians of the fiction.

  "No further business," Thorne said.

  He placed the pen on the paper. The ink bloomed slightly on the fibrous surface. He hovered over the box. The hum of the lights seemed to grow louder, filling the silence of the room. Outside, the city traffic moved along the grid, indifferent to the taxonomy of the lake. The diversion project waited. The water waited.

  Thorne pressed the pen down.
