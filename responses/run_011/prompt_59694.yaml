answer: |-
  You have put your finger on one of the most durable tensions in the philosophy of science, and your students are right to be suspicious. Structurally, the move *is* identical to the No True Scotsman fallacy. In both cases, a universal claim ("All water is H₂O," "No Scotsman puts sugar on porridge") is threatened by a counterexample, and the defender responds by adjusting the definition of the subject term to exclude the counterexample.

  However, your intuition is also correct: there is a profound difference between the water case and the fallacy. The difference lies not in the *logic* of the move (which is indeed circular in isolation) but in the *metaphysical and explanatory status* of the term being tightened.

  Here is the conceptual lay of the land, a specific test you can give your students, and a "seam case" where the test wobbles.

  ### 1. The Concept: Theoretical Crystallization

  The phenomenon you are describing is best understood as **Theoretical Crystallization** (sometimes discussed under the header of *Natural Kind Terms* or *Kripke-Putnam Reference Fixing*).

  In the early stages of a science, terms are **descriptive clusters**. "Water" means *the clear, drinkable, rain-filling liquid in the lakes.* "Planet" means *a wandering star that moves against the fixed background.* These definitions are provisional and based on observable symptoms.

  As the science matures, the theory identifies a **causal essence** that explains *why* the cluster of symptoms hangs together. "Water" becomes *the substance with molecular structure H₂O* because H₂O explains the boiling point, the transparency, and the solvency.

  The "migration" you see is the term shifting from a **symptom-based description** to an **essence-based definition**. Once that shift happens, the claim "Water is H₂O" is no longer an empirical generalization (which could be falsified by finding non-H₂O water); it is a statement of identity. If you find a liquid that looks like water but is XYZ, it isn't water; it's a different substance that mimics water's symptoms.

  ### 2. Why the Narrative Survives

  You asked why the discovery story stays in the textbook if the claim is now definitional. The answer is that the **reference** was fixed empirically, even if the **concept** is now theoretical.

  We didn't deduce water is H₂O from first principles. We pointed at lakes (ostension) and said, "We want to know what *that* is." The empirical struggle was necessary to identify the essence. Once identified, the essence takes over the definition. The narrative survives because it records the *investigation of the essence*, not the *justification of a generalization*.

  ### 3. The Test: Explanatory Direction

  To distinguish legitimate Theoretical Crystallization from the No True Scotsman fallacy (or arbitrary stipulation), give your students the **Explanatory Direction Test**.

  When a term is narrowed to exclude a counterexample, ask: **Does the new definition explain the old symptoms, or does it merely exclude the outlier?**

  *   **Legitimate Narrowing (Water):** The micro-structure (H₂O) *causes* the macro-properties (wetness, transparency). The definition does the explanatory work. If we find a liquid that is H₂O but green and oily (due to impurities), we still call it water because the essence is present. If we find a liquid that is clear and drinkable but is XYZ, we call it "twin-water" or "fake water" because the causal engine is missing. The narrowing is driven by **causal depth**.
  *   **Illegitimate Narrowing (Scotsman):** The definition ("True Scotsman") does not explain why the person doesn't put sugar on porridge. It is invented solely to preserve the generalization. There is no causal mechanism linking "Scottishness" to "porridge habits" that is uncovered by the redefinition. The narrowing is driven by **boundary protection**.

  ### 4. Applying the Test: Water vs. Pluto

  This allows you to honor your students' skepticism while distinguishing the Pluto case, without needing to litigate the IAU vote itself.

  *   **Water:** The shift to H₂O explains *why* water boils at 100°C and freezes at 0°C. The essence generates the phenomena. This is **Essence-Driven**.
  *   **Pluto:** The shift to "clearing the neighborhood" does not explain why Pluto is round, or why it orbits the sun, or why it reflects light. It is a dynamical boundary condition adopted to manage the *count* of planets. It does not reveal a deeper causal nature of "planet-hood" that explains the other properties. It is **Boundary-Driven**.

  In the Water case, the world forced the definition on us because the causal structure of the world demanded it (you can't have water without H₂O). In the Pluto case, we forced the definition on the world to make our cataloging system more manageable (we don't want 50 planets). Both involve narrowing, but one is a discovery of ontology, the other is a decision about taxonomy.

  ### 5. The Seam Case: "Fish" and "Reptiles"

  You asked for a case where the test misfires or is indeterminate. This is crucial for showing students that science is not always a clean machine. The best case is the cladistic redefinition of **Fish** (or **Reptiles**).

  **The Case:**
  Traditional biology classified animals by traits: gills, scales, fins = fish. Cladistics classifies by ancestry: a group must include a common ancestor and *all* its descendants (monophyly).
  Under cladistics, "fish" is not a valid natural kind. If you include the common ancestor of all fish, you must include land animals (tetrapods), because land animals evolved from lobe-finned fish. Therefore, strictly speaking, **there is no such thing as a fish**; there are only vertebrates, some of which are tetrapods and some of which are not.

  **Why it's Indeterminate:**
  *   **Argument for Legitimacy:** Like Water, this is based on a causal essence (genetic lineage). The "true" grouping is determined by the historical causal chain of reproduction. Calling a coelacanth a "fish" and a cow a "mammal" obscures the fact that the cow is more closely related to the coelacanth than the coelacanth is to a tuna. The narrowing (banning the word "fish") respects the causal structure of evolution.
  *   **Argument for Illegitimacy:** Like Pluto, this feels like a stipulation that ignores the functional reality. A cow does not live in water, breathe through gills, or swim like a fish. The "essence" (lineage) does not explain the *phenomenological cluster* that made the word useful in the first place. Banning the word "fish" doesn't help us predict how the animal behaves; it only helps us draw a consistent tree.

  **The Verdict for Students:**
  This is a **Taxonomic Stipulation masquerading as an Ontological Discovery**.
  It is legitimate if your goal is to map history (phylogeny). It is illegitimate (or at least misleading) if your goal is to predict ecology or physiology. Unlike Water (where the essence *always* explains the behavior), "Fish" is a case where the scientific community decided that *historical accuracy* was more important than *functional utility*.

  This shows your students the seam: Sometimes science narrows terms because the world has a hidden structure (Water). Sometimes it narrows terms because the community decides that one way of drawing the map is more consistent than another, even if it conflicts with common usage (Fish/Pluto). The No True Scotsman fallacy is when you do the latter *without admitting it*, pretending the boundary was forced by nature when it was actually chosen for convenience.

  ### Summary for the Classroom

  1.  **Acknowledge the Structure:** Yes, it looks like No True Scotsman. The logic is "If it doesn't fit, it doesn't count."
  2.  **The Distinction:** Legitimate narrowing reveals a **Causal Engine** (H₂O causes wetness). Illegitimate narrowing sets a **Boundary Line** (Clearing the neighborhood defines planet).
  3.  **The Test:** Ask, "Does the new definition explain the old observations?"
      *   If Yes (H₂O explains boiling/freezing): It's **Theoretical Crystallization**.
      *   If No (Line-clearing doesn't explain roundness): It's **Taxonomic Stipulation**.
  4.  **The Warning:** Watch out for **Cladistic Fish**. Sometimes scientists prioritize historical consistency over functional reality. That's a valid choice, but it's a choice, not a discovery.

  This framework validates the students' critical instinct (definitions *are* being changed) while giving them the tools to see why some changes are discoveries of nature's joints, and others are just sharpening the knife.
