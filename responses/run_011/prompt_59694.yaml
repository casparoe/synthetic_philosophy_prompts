      *   **Context:** Instructor of a non-majors survey on the history of physical sciences.
      *   **Problem:** Students notice a pattern where empirical claims (e.g., "Water is H₂O", "Whales are mammals") eventually become definitional/immune to counterexample. When a counterexample arises (e.g., XYZ liquid, Eris), the response is "That's not water/planet," not "The theory is wrong."
      *   **Tension:** The discovery narrative (empirical struggle) remains, but the claim acts like a definition (a priori). Students call this "No True Scotsman." The instructor suspects there's a legitimate version vs. a dodgy version but lacks the conceptual tools to distinguish them.
      *   **Specific Constraint:** Distinguish this from the Pluto/IAU 2006 case (which feels like stipulation) vs. the Water/H₂O case (which feels like discovery).
      *   **Deliverable:**
          1.  Identify established concepts (or coin one if necessary).
          2.  Explain the conceptual landscape.
          3.  Provide a reasoned verdict on how to cut the phenomenon.
          4.  Provide boundary conditions/tests for legitimate vs. illegitimate narrowing.
          5.  Include an indeterminate/misfire case for teaching purposes.
          6.  Keep it accessible for non-specialists (conceptual lay of the land, not bibliography).

  2.  **Deconstruct the Phenomenon:**
      *   The user is describing the transition from *contingent identity* to *necessary identity* (Kripke/Putnam).
      *   They are describing the shift from *operational definitions* to *theoretical definitions*.
      *   They are describing the "reference fixing" vs. "meaning giving" distinction.
      *   They are asking about the "No True Scotsman" fallacy vs. "Conceptual Engineering" or "Natural Kind" refinement.

  3.  **Evaluate Established Concepts:**
      *   *No True Scotsman:* This is an ad hoc rescue of a generalization. "No Scotsman puts sugar on porridge." "But Angus does." "Well, no *true* Scotsman." The key is that the definition changes *solely* to protect the claim without independent theoretical justification.
      *   *Kripke/Putnam (Causal Theory of Reference):* "Water is H₂O" is a necessary truth discovered a posteriori. We fixed the reference by ostension ("this stuff"), then discovered the essence. If we find XYZ that looks like water but isn't H₂O, it's not water because "water" rigidly designates H₂O. This explains the *Water* case well.
      *   *Operationalism vs. Realism:* Early definitions are operational (water = clear drinkable liquid). Later definitions are realist (water = molecular structure). The shift happens when the theory explains *why* the operational features exist.
      *   *Lakatos (Research Programmes):* The "hard core" of a theory is protected by a "protective belt." But this is more about theories than kind terms.
      *   *Conceptual Engineering/Ameliorative Inquiry:* Deliberately changing concepts for better purposes. (Fits Pluto somewhat, but user wants to distinguish them).

  4.  **Synthesize a Solution:**
      *   The core distinction isn't just "definition vs. empirical." It's about *explanatory power* and *causal structure*.
      *   In the "Water" case, the redefinition (H₂O) *explains* the original properties (wetness, transparency). The essence generates the appearance.
      *   In the "Scotsman" case (or a bad Pluto-style stipulation), the redefinition does *not* explain the original cluster; it just excludes the outlier to save a generalization.
      *   In the "Pluto" case, it's tricky. It was about dynamical dominance. Does "clearing the neighborhood" explain why it's a planet? Or is it just a line drawn to keep the count low? This is the gray area.

  5.  **Drafting the Concept:**
      *   I need a term that captures the *legitimacy* of the shift.
      *   "Essentialization" is close. "Natural Kind Stabilization."
      *   Let's propose a distinction: **Explanatory Essentialism** (Legitimate) vs. **Immunizing Stipulation** (Illegitimate/Scotsman).
      *   The mechanism is **Reference Fixing via Theory**.
      *   The test: Does the new definition *predict/explain* the old criteria, or does it merely *exclude* the counterexample?

  6.  **Addressing the Pluto vs. Water Distinction:**
      *   Water: H₂O explains boiling point, freezing point, solvency. XYZ (Putnam's Twin Earth) lacks these causal powers at a micro level.
      *   Pluto: "Clearing the neighborhood" is a dynamical property. Does it explain "roundness" or "orbiting the sun"? No. It's a boundary condition to manage the *catalog*, not a discovery of an intrinsic essence.
      *   *Correction/Nuance:* Actually, the IAU definition was about dynamical dominance. The complaint is that it feels arbitrary. The Water case feels necessary. Why? Because chemical structure determines behavior. Orbital dynamics determine classification status, but is "planet" a natural kind or a convenience category? That's the crux.

  7.  **Developing the Test (The "Deliverable"):**
      *   Test 1: **The Counterfactual Support Test.** If we found H₂O that was green and oily, would we still call it water? (Yes, under pressure/impurities). If we found a round orbiting body that didn't clear its neighborhood, is it a planet? (IAU says no).
      *   Test 2: **The Explanatory Direction.** Does the micro-structure explain the macro-properties? (Water: Yes. Planet: Debatable).
      *   Test 3: **The Cost of Revision.** Does changing the definition break other successful inferences?

  8.  **Selecting the "Indeterminate" Case:**
      *   *Pluto* is the obvious one, but the user wants to keep it apart.
      *   *Birds are Dinosaurs:* Cladistics says birds *are* theropod dinosaurs. Folk say "dinosaurs are extinct." This is a good candidate. It feels like Water (discovery of lineage) but feels like Pluto (redefinition of a common term).
      *   *Tomatoes are Fruit:* Legal vs. Botanical. Too trivial.
      *   *Heat is Molecular Motion:* Good physical science example. Caloric theory vs. Kinetic theory. If we find "heat" that isn't motion (e.g., radiant heat in vacuum?), does it hold?
      *   *Best Candidate:* **"Fish" (Cladistics).** The user mentioned it. Is it legitimate to say "There are no fish"? It depends on whether "fish" is a natural kind or a grade of organization. This is the perfect seam.

  9.  **Refining the Terminology:**
      *   Don't just say "Kripke." Explain the *mechanism*.
      *   Call the phenomenon **Theoretical Crystallization**.
      *   Distinguish **Essence-Driven Narrowing** (Legit) from **Boundary-Driven Exclusion** (Scotsman/Stipulation).

  10. **Structuring the Response:**
      *   **Diagnosis:** Acknowledge the student's observation (it *looks* like Scotsman) but validate the instructor's intuition (there is a difference).
      *   **Conceptual Tool:** Introduce "Natural Kind Terms" vs. "Descriptive Cluster Terms."
      *   **The Mechanism:** Explain "Reference Fixing" (Ostension -> Theory).
      *   **The Test:** The "Explanatory Anchor" test.
      *   **The Distinction:** Water (Essence) vs. Pluto (Boundary).
      *   **The Seam (Indeterminate Case):** The status of "Fish" or "Reptile" in cladistics.
      *   **Conclusion:** How to teach this.

  11. **Self-Correction/Refinement during drafting:**
      *   *Caution:* Don't get too bogged down in Kripkean metaphysics. Keep it historical/epistemic.
      *   *Focus:* The user wants to know why the *narrative* survives. The narrative survives because the *reference* was fixed by the samples, but the *concept* was upgraded by the theory.
      *   *Pluto:* Be careful not to dismiss the IAU decision entirely, but highlight why it *feels* different from Water. It's about managing a taxonomy vs. discovering an ontology.
      *   *Term:* "Theoretical Crystallization" is good. Or "Essentialization." Let's go with **Essentialization** as the process, and distinguish **Natural Kind Stabilization** from **Taxonomic Stipulation**.

  12. **Final Polish:** Ensure the tone is pedagogical but rigorous. Make sure the "test" is actionable for students. (e.g., "Ask: Does the new definition explain the old symptoms?")

  *(Self-Correction on the Pluto point)*: The user explicitly says "I want to keep those two apart." I need to respect that. I shouldn't just say "Pluto is the bad one." I need to explain *why* Water feels different structurally, even if the move looks the same. The difference is *causal depth*.

  *(Refining the Indeterminate Case)*: "Fish" is great. "Is a lungfish a fish?" Cladistics says if you include lungfish, you must include cows. So "fish" is paraphyletic. Is banning the word "fish" a discovery or a stipulation? It's a great seam.

  *(Final Plan)*:
