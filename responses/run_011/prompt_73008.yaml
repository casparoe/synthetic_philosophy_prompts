prompt: |-
  I'm the political director of a public employees union, about 30,000 members — county clerks, 911 dispatchers, road crew, courthouse security. Every cycle I write an endorsement recommendation for our executive board, and every cycle it turns into the same fight. One faction says that if we endorse anyone we own everything they do afterwards, so we should sit elections out entirely and just lobby whoever wins. The other faction says sitting them out is how you get the worse candidate elected, and then you get nothing from them either. Honestly both of them have a point and I can't adjudicate between them, mostly because I don't have any framework. I took one political theory class in college and I remember there being stuff about whether a single vote can even matter, voting as a duty, voting as a statement of who you are, and the whole lesser evil problem — but as far as I can tell none of that was written with a 30,000-person organization's endorsement in mind, and an endorsement is obviously not the same thing as one vote, so I don't know which parts carry over.

  Can you build me an actual procedure I can run on a race? The questions in order, what counts as a good enough answer to each one, where it lands (endorse / no endorsement / endorse but publish a criticism), and where it has to just stop and hand the thing back to the board because it's a values call rather than a facts call. Be upfront about which pieces of the voting ethics stuff genuinely transfer to an organization and which ones quietly break, and about where the procedure will give a bad answer or get gamed by whoever writes the memo — which is usually me, so I want to know my own failure modes.

  Constraints worth knowing: state rules mean we file 30 days out to make the coalition sample ballot, so "wait and see how it develops" is never actually available. Endorsement takes 60% of the board. A yes commits about $15k and a weekend of member canvassing. Nobody on staff has philosophy training and I need something a board member can follow from a two page handout.

  Then run it on three real-ish races:

  1. Safe seat, our incumbent is fine but a first-time challenger is way better on our core issue (we're fighting to keep 911 dispatch in-house instead of contracting it out) and has never held anything.
  2. Open seat. Candidate A is strong for us on paper but there's a credible, well-sourced story that he took money from a private prison contractor. Candidate B voted against collective bargaining rights twice but is clean, competent, and probably winnable on everything else.
  3. A race where both candidates will vote to privatize dispatch no matter what we do, and the only real difference is that one of them is a decent person and the other is a liar. This is the one where I suspect the procedure is going to tell me to do something half the board will hate, and I want to see how it handles that and what I'm supposed to say when someone asks "so you're telling us we just let them win."

  Finally, tell me what the procedure flat out cannot decide, so I stop pretending it can.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the User and Request:**
      *   **User Role:** Political Director of a public employees union (30k members: clerks, dispatchers, road crew, security).
      *   **Problem:** Internal conflict over endorsement strategy (Endorse vs. Sit Out). Needs a framework/procedure to adjudicate this objectively.
      *   **Constraints:**
          *   Filing deadline: 30 days out (no "wait and see").
          *   Board Vote Threshold: 60% for endorsement.
          *   Cost: $15k + member volunteer time.
          *   Audience: Board members (no philosophy training), needs a 2-page handout style.
          *   User's Bias: Admits *they* write the memo and wants to know their own failure modes/gaming risks.
      *   **Tasks:**
          1.  Build a decision procedure (questions, thresholds, outcomes).
          2.  Identify which voting ethics concepts transfer vs. break for organizations.
          3.  Identify failure modes/gaming risks.
          4.  Run the procedure on three specific scenarios.
          5.  Define the limits of the procedure (what it *can't* decide).

  2.  **Deconstruct Voting Ethics for Organizations:**
      *   *Individual Voting:* "Does my vote matter?" (No, but organization's endorsement *does* matter). "Is it a duty?" (No, it's a strategic tool). "Lesser of two evils?" (Yes, but defined by material gain, not moral purity).
      *   *Organizational Endorsement:* It's a transaction. It's reputation capital. It's resource allocation.
      *   *Transferable Concepts:* Consequentialism (outcomes matter), Duty (to members), Lesser Evil (damage mitigation).
      *   *Broken Concepts:* Expressive Voting (voting for identity), Moral Purity (organizations aren't moral agents, they are fiduciary agents for members).

  3.  **Drafting the Procedure (The "Union Endorsement Matrix"):**
      *   *Goal:* Move from abstract values to concrete metrics.
      *   *Structure:* Sequential gates. If you fail a gate, you stop or move to a specific outcome.
      *   *Gate 1: Viability.* Can they win? (No point endorsing a loser unless it's a long-game movement building, but for a union, usually no).
      *   *Gate 2: Material Impact.* Does this race affect our core bargaining issues? (If no, why spend $15k?).
      *   *Gate 3: Reliability/Risk.* Can we trust them? (Past record, funding sources).
      *   *Gate 4: The "Sit Out" Test.* Is the difference between candidates negligible or negative?
      *   *Outcomes:* Endorse, Endorse with Reservations (Public Criticism), No Endorsement (Neutral), No Endorsement (Oppose).
      *   *Failure Modes:* Confirmation bias in "Viability," softening "Reliability" for friends, inflating "Material Impact."

  4.  **Developing the Scenarios:**

      *   *Scenario 1 (Safe Incumbent vs. Better Challenger):*
          *   Issue: 911 dispatch privatization.
          *   Incumbent: "Fine" (status quo).
          *   Challenger: "Way better" (pro-union on core issue), but untested.
          *   *Procedure Application:* Viability is the killer here. Safe seat = low viability for challenger. Material impact is high for challenger.
          *   *Result:* Likely No Endorsement (Incumbent wins anyway, waste of resources) OR Endorse Challenger (if the goal is long-term pressure, but costly). Given the 60% threshold and $15k cost, pragmatic answer is usually stick with the winner *unless* the incumbent is hostile. If incumbent is "fine," don't burn bridges.
          *   *Refinement:* Wait, if the challenger is *way* better on the *core* issue, is it worth the risk? Usually, unions protect incumbents who are "fine" to maintain access. But if the core issue is existential (privatization), maybe the risk is worth it. Let's lean towards "No Endorsement" to save resources, but maybe a "Meet and Greet" to signal interest without cash. Actually, the prompt asks for Endorse/No Endorse/Endorse w/ Criticism.
          *   *Decision:* No Endorsement. Viability gate fails.

      *   *Scenario 2 (Open Seat: Strong/Dirty vs. Weak/Clean):*
          *   Cand A: Strong on paper, Private Prison Money (Huge red flag for public employees/security).
          *   Cand B: Voted against collective bargaining (Huge red flag), but clean/competent.
          *   *Procedure Application:* Reliability Gate. A has conflict of interest. B has hostile record.
          *   *Result:* This is the "Lesser Evil" trap. Private prison money suggests structural opposition to public services. Anti-CB vote suggests structural opposition to unions.
          *   *Decision:* No Endorsement. Both fail the Reliability/Material Impact gate in different ways. Endorsing A looks corrupt to members. Endorsing B looks suicidal to bargaining.

      *   *Scenario 3 (Both Bad on Core Issue):*
          *   Both will privatize dispatch.
          *   Diff: Decent Person vs. Liar.
          *   *Procedure Application:* Material Impact Gate. If both will do the damaging thing, does the endorsement matter?
          *   *Result:* Procedure says "No Endorsement." Why spend $15k to lose either way?
          *   *Board Reaction:* "So we let them win?"
          *   *Response:* Endorsement isn't a medal for goodness; it's a tool for leverage. If you have no leverage, don't spend the tool. Fight the policy later, not the person now.

  5.  **Refining the Failure Modes (Self-Correction):**
      *   *The "Memo Writer" Bias:* I need to explicitly call out how the Political Director (the user) can manipulate the scoring.
      *   *Viability:* Easy to fudge polling data.
      *   *Materiality:* Easy to claim *everything* is a core issue.
      *   *Reliability:* Easy to overlook flaws in friends.

  6.  **Structuring the Output:**
      *   **Part 1: Theory Transfer:** What sticks and what breaks.
      *   **Part 2: The Procedure (The Handout):** Step-by-step, clear thresholds.
      *   **Part 3: Failure Modes:** How the user will game it.
      *   **Part 4: Scenario Runs:** Applying the logic.
      *   **Part 5: The Hard Limits:** What the procedure can't solve.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Tone:* Professional, pragmatic, slightly cynical (union politics), direct.
      *   *Formatting:* Use bolding, lists, and clear headers to simulate a handout.
      *   *Key Insight:* An endorsement is a *contract*, not a blessing. It must be treated as an investment.
      *   *Addressing the "Duty" aspect:* The union's duty is to members' material conditions, not abstract democracy.
      *   *Addressing the "Sit Out" fear:* Sitting out preserves capital for winnable fights.

  8.  **Final Review against Constraints:**
      *   30 days out? Yes, procedure relies on existing records/polling.
      *   60% vote? Yes, procedure aims to build consensus or clarify disagreement.
      *   $15k cost? Yes, weighed in "Viability."
      *   2-page handout style? Yes, keep the procedure section tight.

  9.  *(Self-Correction during drafting Scenario 1)*: If the incumbent is "fine" but the challenger is "way better" on the *core* issue (privatization), sitting out might ensure the status quo continues. But if the seat is "safe," the challenger likely loses. Endorsing a loser in a safe seat burns the relationship with the winner. *Verdict:* No Endorsement. Preserve relationship with incumbent, don't waste money on loser.
      *(Self-Correction during drafting Scenario 3)*: If both will privatize, is there *any* value? Maybe the "Decent Person" allows for a softer implementation or severance? The procedure needs to account for "Damage Mitigation." If one slows the privatization down, that's material. If it's binary (Yes/No), then No Endorsement. I will assume binary for the sake of the prompt's tension.

  10. **Final Polish:** Ensure the distinction between "Values Call" and "Facts Call" is clear. The procedure handles facts; the Board handles values.

  *(Proceed to generate output based on these thoughts.)*
answer: |-
  Here is a framework designed for your specific constraints, followed by the analysis you requested.

  ### Part 1: Theory Transfer (What Sticks, What Breaks)

  You asked which parts of political theory carry over from individual voting to organizational endorsement. Here is the breakdown:

  **What Transfers:**
  *   **Consequentialism:** The only thing that matters is the outcome. For an individual, that's "did my preferred policy pass?" For you, it's "did our members' wages/conditions improve?"
  *   **The Lesser Evil:** This applies fully. If Candidate A will cut pensions and Candidate B will freeze them, B is the rational choice, even if B is unpleasant.
  *   **Strategic Voting:** You do not vote for who you *wish* existed; you vote for who can win and will deliver.

  **What Breaks:**
  *   **Expressive Voting:** An individual might vote third-party to "send a message." An organization cannot afford to send messages that cost $15k and yield no leverage. Silence is not a message; it's resource conservation.
  *   **Moral Duty:** You have no duty to "democracy." You have a fiduciary duty to your members. If endorsing a corrupt candidate secures a contract, that is a valid consideration (within legal bounds). If endorsing a saint loses healthcare, it is a dereliction of duty.
  *   **The "Single Vote" Paradox:** One vote rarely matters. An endorsement *always* matters. It signals to other donors, it mobilizes 30,000 people, and it creates a public record. You cannot hide behind "my contribution is negligible."

  ---

  ### Part 2: The Endorsement Decision Procedure (The Handout)

  **Purpose:** To remove personality from endorsement decisions and focus on resource allocation.
  **Threshold:** 60% Board Vote required for Endorsement.
  **Cost:** $15,000 + Volunteer Hours.

  **Step 1: The Viability Gate (Fact Check)**
  *   **Question:** Does the candidate have a realistic path to victory based on current polling, fundraising, and historical margins?
  *   **Data Required:** Two independent polls or fundraising disparity < 20%.
  *   **Pass:** Candidate is within the margin of error or leading.
  *   **Fail:** Candidate is trailing by >5 points in a non-wave environment.
  *   **Outcome:** If **Fail**, recommendation is **No Endorsement**. (Exception: Long-term movement building, requires 75% Board vote).
  *   *Why:* We do not spend $15k to lose.

  **Step 2: The Materiality Gate (Fact Check)**
  *   **Question:** Does this office have direct jurisdiction over our core bargaining units (wages, staffing levels, privatization, safety)?
  *   **Data Required:** Statutory authority of the office.
  *   **Pass:** Office controls budget, hiring, or contracting for our members.
  *   **Fail:** Office is ceremonial or jurisdiction is tangential (e.g., State Rep when we are County employees).
  *   **Outcome:** If **Fail**, recommendation is **No Endorsement**.
  *   *Why:* We do not spend $15k on races that cannot hurt or help us.

  **Step 3: The Reliability Gate (Risk Assessment)**
  *   **Question:** Is there evidence the candidate is structurally incapable of fulfilling commitments to us?
  *   **Data Required:** Voting record, donor lists, public statements.
  *   **Red Flags:** Major funding from direct adversaries (e.g., private prison contractors for security staff); voting record against collective bargaining.
  *   **Pass:** No structural conflicts.
  *   **Fail:** Clear structural conflict exists.
  *   **Outcome:** If **Fail**, recommendation is **No Endorsement** (or **Oppose** if they are actively hostile).
  *   *Why:* An endorsement is a contract. If they cannot sign, we do not buy.

  **Step 4: The Differential Gate (Comparative Analysis)**
  *   **Question:** Is the difference between the viable candidates material to our members?
  *   **Data Required:** Side-by-side questionnaire responses.
  *   **Pass:** One candidate clearly offers better material conditions (wages, staffing, protections).
  *   **Fail:** Both candidates will enact the same harmful policy, OR both will enact the same beneficial policy.
  *   **Outcome:**
      *   If **Pass**: Recommend **Endorse** the better candidate.
      *   If **Fail**: Recommend **No Endorsement**.
  *   *Why:* If the outcome is identical, we save our $15k for a race where it changes the outcome.

  **Step 5: The "Clean Hands" Clause (Values Call)**
  *   **Trigger:** If a candidate passes Steps 1-4 but has significant ethical baggage (scandals, personal misconduct) not covered in Step 3.
  *   **Decision:** This is **not** decided by the procedure. This is handed to the Board for a values vote.
  *   **Options:** Endorse, Endorse with Public Criticism, or No Endorsement.

  ---

  ### Part 3: Your Failure Modes (How You Will Game This)

  You write the memo. You control the data presentation. Here is where you will bias the outcome, intentionally or not:

  1.  **Viability Fudging:** You can cherry-pick the poll that shows your preferred candidate winning.
      *   *Correction:* Require two independent sources. If they conflict, the default is "No Endorsement."
  2.  **Inflating Materiality:** You can argue *every* race affects public funding, therefore *every* race is material.
      *   *Correction:* Define "Core Issues" annually (e.g., "Privatization of Dispatch," "County Health Plan"). If the office doesn't touch those specific lines, it fails Step 2.
  3.  **Softening Reliability:** You will overlook "small" donations from adversaries for candidates you like personally.
      *   *Correction:* Set a dollar threshold for "Adversarial Funding." (e.g., >$5k from a privatization firm is an automatic fail).
  4.  **The "Differential" Trap:** You can exaggerate small differences to make Step 4 pass.
      *   *Correction:* Require the difference to be quantifiable (e.g., "$2,000 difference in salary proposal," not "supports workers").

  ---

  ### Part 4: Running the Scenarios

  #### Race 1: Safe Incumbent vs. Better Challenger
  *   **Context:** Incumbent "fine." Challenger "way better" on Dispatch Privatization. Seat is Safe (Incumbent favored).
  *   **Step 1 (Viability):** Challenger fails. Safe seat means <5% chance of flip.
  *   **Step 2 (Materiality):** Pass (High stakes on dispatch).
  *   **Step 3 (Reliability):** Pass (No red flags).
  *   **Step 4 (Differential):** Pass (Challenger better).
  *   **Procedure Result:** **No Endorsement.**
  *   **Reasoning:** Step 1 is a hard gate. Spending $15k on a loser burns capital with the winner (the Incumbent) without gaining the Challenger.
  *   **Board Pitch:** "We agree with the Challenger, but we cannot spend member dues on a loss. We will request a meeting with the Incumbent to discuss dispatch, but we do not endorse."
  *   **Risk:** The pro-Challenger faction will call you cowardly.
  *   **Counter:** "If we endorse and lose, the Incumbent remembers. If we sit out, the Incumbent is neutral. We keep access."

  #### Race 2: Open Seat (Strong/Dirty vs. Weak/Clean)
  *   **Context:** Cand A (Pro-union, Private Prison Money). Cand B (Anti-CB record, Clean).
  *   **Step 1 (Viability):** Assume both Pass (Open seat, competitive).
  *   **Step 2 (Materiality):** Pass (Both affect bargaining).
  *   **Step 3 (Reliability):**
      *   Cand A: **Fail.** Private prison money is a structural conflict for courthouse security and dispatch. It implies a profit motive opposite to public service.
      *   Cand B: **Fail.** Voting record against collective bargaining is a structural conflict for *all* members.
  *   **Procedure Result:** **No Endorsement.**
  *   **Reasoning:** Both candidates fail Step 3. Cand A is a corruption risk; Cand B is a bargaining risk.
  *   **Board Pitch:** "Cand A is funded by our industry adversaries. Cand B has voted to strip our rights. Neither is a safe partner for a $15k investment."
  *   **Risk:** The Board will split 50/50. You won't get 60%.
  *   **Counter:** This is where you admit the procedure hit a wall. You recommend "Neutral" to preserve unity. Do not let the Board turn this into a civil war over ethics vs. pragmatism.

  #### Race 3: The "Lesser Evil" Trap (Both Pro-Privatization)
  *   **Context:** Both will privatize dispatch. Diff: Decent Person vs. Liar.
  *   **Step 1 (Viability):** Pass (Assume competitive).
  *   **Step 2 (Materiality):** Pass (Existential threat).
  *   **Step 3 (Reliability):** Pass (No structural conflicts, just bad policy).
  *   **Step 4 (Differential):** **Fail.**
      *   *Analysis:* If the policy outcome (privatization) is identical, the material difference to the member is zero. Being a "decent person" does not keep a job.
  *   **Procedure Result:** **No Endorsement.**
  *   **Reasoning:** We do not pay $15k to choose who holds the knife when both are stabbing us.
  *   **Board Pitch:** "An endorsement is a tool to secure material gains. In this race, no material gain is available. We save our money for a race where we can stop privatization."
  *   **The "Let Them Win" Objection:** When a board member asks, "So you're telling us we just let them win?"
      *   **Your Answer:** "Endorsing doesn't stop them. We are admitting that *this specific election* is not where we win. We will fight the privatization in the media, in the courts, and at the bargaining table. But we will not spend our war chest on a coin toss where both sides are against us."
  *   **Risk:** This feels like surrender. Half the board will hate it.
  *   **Mitigation:** Offer "Endorse with Public Criticism" *only if* the Decent Person agrees to a transition plan (severance, retraining). If they won't commit to mitigation, stick to No Endorsement.

  ---

  ### Part 5: What The Procedure Cannot Decide

  You need to stop pretending this framework solves everything. It cannot decide:

  1.  **Long-Term vs. Short-Term:** The procedure favors short-term material wins. It will always tell you to dump the Challenger in Race 1. It cannot account for "building a bench" of allies for 10 years from now. That is a **Values Call** for the Board.
  2.  **Solidarity vs. Self-Interest:** If another union is striking and asks for endorsement of their candidate, this procedure says "No" (not material to *your* members). Supporting them is an act of labor solidarity, not fiduciary logic. That is a **Values Call**.
  3.  **Reputational Risk:** The procedure might say endorse a candidate who is effective but personally repulsive (harassment allegations, etc.). If members refuse to canvas for them, the endorsement is worthless. The procedure measures *candidate* reliability, not *member* willingness.
  4.  **The "60% Rule" Reality:** The procedure might output "Endorse," but if the Board is split 55/45, you cannot execute. The procedure identifies the *rational* choice, not the *political* choice within your own house.

  **Final Advice:**
  Use the procedure to filter out the easy cases (Race 1 and Race 3). This saves your political capital for the hard cases (Race 2). When the procedure says "No Endorsement," stand on the data. When the procedure says "Endorse," check your own bias first. And when the Board fights anyway, remind them: **We are not a political party. We are a service provider for 30,000 workers. Every dollar spent on a losing race is a dollar not spent on a grievance.**
