  7.  **Final Polish:** Ensure the distinction between "liability" (legalistic) and "obligation" (normative) is clear, as the user flags this in §6.

  *(Self-Correction on "Least Sure"):* Actually, the "Dead Authors" section (§5) is also very shaky. But the Assurance View overlap (§2/Q2) is more fundamental to the theory's identity. If it's just Assurance Theory with different words, the paper loses novelty. I will mark Q2 as the least sure.

