      *   *Refinement on Q1:* Be careful not to say Anti-Reductionists *are* synchronic, but that their *criteria* for entitlement are usually assessed at uptake.
      *   *Refinement on Q2:* This is where the "least sure" flag should go. The overlap with Moran/Hinchman is significant.
