  **UNITED STATES DISTRICT COURT FOR THE DISTRICT OF CASCADIA**

  *In re: GenFuture Corp. Consumer Litigation*
  Case No. 2:23-cv-00420

  **NOTICE OF PROPOSED CLASS ACTION SETTLEMENT**

  **A Court authorized this Notice. This is not a solicitation from a lawyer.**

  A Settlement has been reached in a class action lawsuit involving GenFuture Corp. ("Defendant"). The lawsuit alleges that Defendant's "ChronoCycle" fertility tracking application altered the conception timing of users, thereby determining the identity of persons conceived during the Class Period. Defendant denies all wrongdoing. The Court has not decided who is right. Instead, both sides agreed to a Settlement to avoid the costs and uncertainty of a trial.

  **WHO IS INCLUDED?**
  The Class includes all living persons whose conception occurred between January 1, 2020, and December 31, 2020, and whose existence is causally dependent on the use of ChronoCycle by their biological progenitors. If your existence is contingent upon the Defendant's conduct, you are a Class Member.

  **WHAT DOES THE SETTLEMENT PROVIDE?**
  GenFuture Corp. will pay $50.00 to each Class Member who submits a valid Claim Form. By accepting payment, you release all claims against Defendant regarding your conception, genetic makeup, or temporal origin.

  **HOW TO GET A PAYMENT**
  To receive payment, you must submit a Claim Form online or by mail. Claim Forms must be postmarked or submitted online by **December 31, 2019**. Proof of existence contingent on the Settlement conduct must be attached.

  **EXCLUDING YOURSELF FROM THE SETTLEMENT**
  If you want to keep the right to sue GenFuture Corp. about the legal claims in this case, you must take steps to get out of the Settlement. This is called opting-out. You may not opt-out of this Settlement. Because the Class Members' existence is predicated on the conduct being settled, opting-out would necessitate non-existence. As non-existence is not a legal status recognizable by this Court for the purpose of objection, all Class Members are bound by the terms herein. You cannot exclude yourself.

  **OBJECTING TO THE SETTLEMENT**
  You may ask the Court to deny approval of the Settlement. To do so, you must send a letter to the Court explaining why you object. However, pursuant to the Expert Declaration filed hereto, no Class Member has been made worse off by the conduct complained of. Objections based on the assertion that you would prefer not to exist will be overruled as logically inconsistent with the relief sought.

  **FAIRNESS HEARING**
  On March 15, 2024, at 10:00 a.m., the Court will hold a Fairness Hearing to decide whether to approve the Settlement. The Court will consider any objections.

  **LAWYERS' FEES AND EXPENSES**
  Class Counsel will ask the Court to pay them for their work in this case. The Court may award Class Counsel up to 25% of the Settlement Fund.

  **LEFTOVER MONEY**
  If money is left over after payments and fees, it will be distributed via cy pres to organizations studying demographic shifts and counterfactual ontology.

  **EXPERT DECLARATION ON HARM**
  Dr. Derek P., Ph.D., has declared that while the Defendant's conduct changed *who* exists, it did not harm any specific individual. All Class Members report lives worth living. Therefore, under the person-affecting restriction, no Class Member is worse off than they would otherwise have been, as the alternative was non-existence.

  **FAQ**
  **1. How do I know if I am included?**
  If you exist, and your existence relies on the Defendant's conduct, you are included. If you do not exist, you will not receive this Notice.
  **2. Can I sue later?**
  No. The Release bars all claims related to your origin.
  **3. What if I don't submit a Claim Form?**
  You will not receive money, but you will still be bound by the Release regarding your existence.

  ***

  **Post-Script**

  This piece exaggerates the procedural viability of such a class; in reality, Rule 23's ascertainability requirement would likely defeat certification immediately because a class defined by counterfactual existence is administratively impossible to identify without circular logic. Regarding the philosophy, I find the "impersonal principles" objection most convincing—the idea that a state of affairs can be worse even if no particular person is worse off—because it preserves our intuition that causing harmful conditions is wrong regardless of identity. What would change my mind from the "nobody is harmed" conclusion is a robust rights-based framework: if individuals possess a right to certain conditions of conception independent of welfare outcomes, then the policy is wrong because it violates that right, not because it lowers utility.
