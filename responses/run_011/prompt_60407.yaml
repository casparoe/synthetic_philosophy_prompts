  **(Self-Correction during drafting):** I initially thought about bringing in Kant. But Kant might be too abstract. Better to stick to Frankfurt (desires) and Berlin (liberties) as they map better to the "moods vs. rules" dynamic. Also, need to make sure I don't diagnose the roommate (OCD etc.) but stick to the philosophical implications of his behavior.

