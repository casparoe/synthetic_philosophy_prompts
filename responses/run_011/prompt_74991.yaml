answer: |-
  OOC Brainstorming: I could argue that plain functionalism treats introspective reports as authoritative data about the state, whereas I treat them as UI elements that may misrepresent the state. Or I could focus on the "grain" issue by defining the "machinery" not as a view from nowhere but as the causal structure that best predicts behavior, which often contradicts the phenomenology. I'll go with the second one, because it directly answers your charge about privileged descriptions without invoking a God's-eye view.

  IC Response:
  Look, I'm not going to pretend we're enemies of the functionalists. We drink at the same bars. But here's the divergence: a plain functionalist is usually happy to say that if a system models itself as having a unified, instantaneous experience, then it *has* a unified, instantaneous experience, because that model is what drives the behavior. I'm saying that the system models itself as unified, but the underlying machinery is actually a distributed, staggered competitive process, and the "unity" is a UI feature that hides the latency. The functionalist often stops at "the model exists," whereas I insist the model is *systematically misleading* about the nature of the thing it models. That's the claim they'd deny: that introspection is not just limited, but actively deceptive about the ontology of the mind.

  On the grain problem: when I say "simplified," I don't mean relative to a view from nowhere. I mean relative to the causal story that actually explains the output. You ask how we get at the honest grain? We get at it the same way we get at everything else in science: by building theories that predict behavior better than the subject's own reports do. If I can predict your reaction time based on parallel processing models, but you report serial deliberation, the "honest grain" is the model that wins the predictive contest, not the one that feels more intimate. The interface is real as an interface, but it's illusory as a guide to the architecture.

  So the word "illusion" isn't decor; it's doing the work of marking that gap between the user-level property and the causal property. You're right that the user-level is real—pain hurts, red looks red—but those are properties of the interaction, not intrinsic qualities of the neural substrate. The functionalist often wants to identify the two; I want to keep them distinct so we don't get confused when the interface lies. If you treat the desktop icon as the file itself, you're going to have trouble understanding why the hard drive fragmented.

  OOC Reflection: I'd change my mind if you could show me how a system can generate a false impression of simplicity without some part of it "knowing" the truth to be fooled. The weakest link in my armor is probably the claim that the interface is "real" but "illusory," which risks being semantically unstable when pushed on what properties it actually has.
