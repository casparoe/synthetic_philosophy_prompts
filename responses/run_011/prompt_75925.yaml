answer: |-
  ### I. The Implicit Theory of Predictability and Probability

  To treat an ensemble fraction (e.g., 15 out of 51 members) as a probability, the practice presupposes a specific, often unstated, ontology of the ensemble members.

  **Exchangeability and the Population**
  For the fraction to function as a probability in an ordinary sense, the members must be *exchangeable*: swapping the label of any two runs should not change the joint probability distribution of the outcomes. In weather forecasting, this presupposes that the 50 perturbed runs plus the control are effectively random draws from a population of "physically plausible truths."
  *   **The Population:** The population is not "possible worlds" in a modal realist sense, nor is it a set of random samples. It is the set of *trajectories consistent with observational error and physical laws*.
  *   **The Tension:** Since members are constructed by hand (using singular vectors or bred vectors to target unstable directions) rather than sampled at random, the practice presupposes that *targeted coverage* is equivalent to *random sampling*. It assumes the perturbations span the subspace of uncertainty sufficiently well that counting them approximates integrating over the probability density function (PDF) of the initial state.

  **Spread as Epistemic Surrogate**
  For spread–skill calibration to mean anything, "spread" must stand in for *expected error*.
  *   **Presupposition:** The ensemble spread is not merely a measure of how much the models disagree; it is a proxy for the growth of uncertainty in the true atmosphere.
  *   **Requirement:** This requires the model to be "perfect" in a specific sense: the model's internal variability and error growth rates must match the real atmosphere's. If the model is too stable, spread will be too low compared to skill (overconfidence). If the model is too chaotic, spread will be too high (underconfidence). The practice presupposes that the model's *climate of error* matches the atmosphere's *climate of error*.

  ### II. Determinism, Uncertainty, and Consistency

  The coexistence of the two-week weather limit and the 2100 climate range relies on a distinction between two classes of mathematical problems.

  **The Assumptions**
  1.  **Weather (Initial Value Problem):** Uncertainty resides dominantly in the **Initial Conditions (ICs)**. The equations are deterministic, but the system is chaotic (SDIC). Because ICs cannot be measured perfectly, trajectory predictability decays exponentially.
  2.  **Climate (Boundary Value Problem):** Uncertainty resides dominantly in **Model Structure** and **Forcing Scenarios**. The specific trajectory is acknowledged as unpredictable (the weather noise), but the *statistics* of the trajectory (the climate signal) are assumed to be determined by external boundary conditions (greenhouse gas concentrations, solar forcing).

  **Consistency and the Distinction**
  The pair is consistent *if and only if* one accepts that the climate state is an invariant measure (or a slowly shifting attractor) of the weather equations.
  *   **The Distinction:** It demands a separation between *trajectory predictability* (where will the system be on day 40?) and *statistical predictability* (what is the mean temperature of the year 2100?).
  *   **Does it do the work?** Mathematically, yes. In a chaotic system, the specific state becomes unpredictable, but the *attractor* (the shape of the space the system inhabits) may remain stable or shift predictably under forcing.
  *   **Does it restate the puzzle?** Philosophically, it risks circularity. To claim the attractor shifts predictably requires trusting the model's physics over 80 years. To claim the trajectory is unpredictable requires distrusting the model's physics over 2 weeks. Since it is the *same* model code (often), the distinction rests on the assumption that *structural errors average out* over long timescales while *initial errors amplify* over short timescales. This is a substantive physical claim, not merely a definition. It holds only if the "signal-to-noise" ratio improves with time, which is not guaranteed in all coupled systems (e.g., ocean circulation tipping points).

  ### III. Rival Views Ruled Out

  The practice quietly rules out several coherent philosophical positions:

  1.  **Laplacean Determinism:** The view that perfect knowledge of ICs yields perfect prediction is ruled out by the admission of the two-week limit. The practice accepts ontological (or at least practical) indeterminacy.
  2.  **Radical Subjectivism:** The view that probability is *only* a degree of belief is constrained by the verification requirement. If probability were purely subjective, calibration (30% forecast = 30% occurrence) would not be an objective metric of success. The practice demands that belief be tethered to frequency.
  3.  **Long-Range Weather Forecasting:** The view that 2100 prediction is simply a day-30,000 weather forecast is explicitly rejected. The practice rules out the idea that the specific state of the atmosphere in 2100 is knowable.
  4.  **Objective Chance for Specific Events:** Conversely, it rules out the view that there is a "fact of the matter" regarding the temperature on a specific day in 2100. It denies that the future is fixed in a way that could be known, even in principle, given the chaotic nature of the system.

  ### IV. Presuppositions vs. Compatible Interpretations

  The practice is philosophically underdetermined; the operational math remains identical across incompatible interpretations of probability.

  **What is Strictly Presupposed:**
  *   **Calibration:** Whatever probability *is*, it must be empirically calibratable against frequencies of past events (for weather) or paleo-climatic analogues (for climate).
  *   **Completeness:** The ensemble must span the relevant uncertainty. If a source of error is not represented in the ensemble (e.g., a missing feedback loop), the probability is invalid.

  **What is Compatible (Underdetermination):**
  *   **The Frequentist:** Can license the weather verification (long run of forecasts). They struggle with the climate projection (only one Earth, one 2100). They must treat the multi-model ensemble as a hypothetical sample from a population of "possible Earths," which is metaphysically costly.
  *   **The Subjective Bayesian:** Can license both easily. The weather ensemble represents the forecaster's updated degree of belief given the data. The climate range represents the community's degree of belief given structural uncertainty. They are comfortable with the "single case" of 2100. However, they must explain why "calibration" is an objective constraint on subjective belief.
  *   **The Propensity Theorist:** Can license the weather (the atmosphere has a tendency to rain). They struggle with the climate multi-model ensemble. Do "different models" represent different propensities of the *same* Earth? Or is the propensity a property of the *model family*?
  *   **The Underdetermined Core:** The practice does not decide whether the probability resides in the **world** (propensity/frequency) or in the **mind/community** (Bayesian). It treats the ensemble output *as if* it were a propensity, verifies it *as if* it were a frequency, and updates it *as if* it were a belief.

  ### V. The Shift to "Modeller Disagreement"

  If the implicit view were replaced by one where ensemble spread is strictly a measure of **disagreement among modellers** (epistemic uncertainty about the correct theory) rather than a probability distribution of future states, the following would change:

  1.  **Publication:** Headlines would shift from "30% chance of exceeding 25mm" to "30% of current credible models exceed 25mm." The modality shifts from *aleatory* (nature's randomness) to *epistemic* (human ignorance).
  2.  **Weighting:** Equal weighting of models (democracy of models) would become indefensible. If spread is disagreement, a model known to be flawed should count for less. Weighting would shift to performance-based metrics or expert elicitation, rather than counting members.
  3.  **Verification:** You could not verify a "30% chance" against a frequency of events (since there is only one 2100). Verification would shift to **interval containment**: Did the observed warming fall within the range of model disagreement? Calibration plots would be replaced by "surprise indices" (how far outside the envelope did reality fall?).
  4.  **The Fortnight Limit:** The explanation to the lay audience would change. Instead of "chaos destroys predictability," it would be "our models diverge too quickly to agree." This weakens the authority of the limit; it suggests better models might extend the horizon, whereas the chaos argument suggests a fundamental physical limit.

  ### VI. Where the Reconstruction Fails

  This reconstruction relies on a stylized view of how these centres actually operate. I would hold the following claims most loosely:

  **1. The "Perfect Model" Assumption in Weather**
  I reconstructed the weather practice as assuming the ensemble spans the truth. In reality, operational centres (like ECMWF) know their models have structural bias. They use "stochastic physics" to acknowledge this, but the reconstruction assumes the spread is primarily IC-driven.
  *   **Fact that pushes back:** Operational ensembles are often "under-dispersive" (the truth falls outside the ensemble more often than the spread predicts). If the reconstruction were true, calibration would be near-perfect. The fact that centres constantly tweak inflation factors suggests they do *not* believe the members are exchangeable draws from the truth population, but rather a flawed approximation that needs statistical correction.

  **2. The Clean IV/BV Split in Climate**
  I reconstructed the climate practice as relying on a clean Boundary Value (forcing) vs. Initial Value (chaos) distinction.
  *   **Fact that pushes back:** Decadal prediction is now a major field. This blends weather and climate, relying on initial conditions (ocean heat content) to predict 5–10 years out. This blurs the line I drew. If ICs matter for 10 years, why do they vanish for 80? The reconstruction assumes a separation of timescales that the physics of coupled ocean-atmosphere systems may not strictly support (e.g., Atlantic Meridional Overturning Circulation variability).

  **3. The Ontological Status of Climate Probability**
  I assumed climate centres offer a "probability distribution."
  *   **Fact that pushes back:** Many climate scientists explicitly reject the interpretation of the CMIP multi-model ensemble as a probability density function. They often describe it as an "ensemble of opportunity" (models that happened to be run) rather than a sampled distribution. If the producers themselves deny the probabilistic interpretation that the public and policymakers infer, my reconstruction attributes a theory to them they explicitly disavow. The practice may be *pragmatically* probabilistic without being *theoretically* probabilistic.

  **Most Vulnerable Claim:** The claim that the climate range is treated as a **probability distribution** comparable to the weather forecast. It is more likely treated as a **bounds of plausibility**. If this is true, the "puzzle" of consistency dissolves: weather is probabilistic (aleatory), climate is scenario-based (possibilistic). The tension exists primarily in the communication layer, not the scientific layer.
