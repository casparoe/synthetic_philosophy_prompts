answer: |-
  This is a strong skeleton, but it risks becoming a logic puzzle rather than a metaphysical confrontation. To make the debate *felt*, the activity must force students to pay for their ontology *before* they know if it will save them. The "wager" cannot just be on prediction (since, as you note, the theories tie); it must be on *explanatory budget*.

  Here is a developed plan designed to fit your constraints, pre-empt the failure modes, and keep the metaphysics front and center.

  ### Activity Title: The Ontology Market

  **Objective:** Students must construct a coherent model of space and motion that explains inertial effects (tension, dizziness) while minimizing ontological cost. They will discover that Substantivalism and Relationism offer different trade-offs between *entity cost* and *law complexity*.

  **Materials List:**
  *   **Whiteboard & Markers:** For the "Ledger" (public score).
  *   **Index Cards (3 decks):**
      *   *Deck A (The Shift):* 10 cards listing coordinates of 3 bodies in World 1. 10 cards listing coordinates of 3 bodies in World 2 (shifted by +5 units on x-axis). Inter-body distances are identical.
      *   *Deck B (The Empty Bucket):* Descriptions of a bucket spinning in a universe with no other matter.
      *   *Deck C (The Globes):* Descriptions of the two-globe cord scenario with varying tension/motion readings.
  *   **Props:** 1 Swivel chair (verify it spins freely), 1 Bucket (plastic, with 2kg weight inside to simulate water mass without spill risk), 1 Rope (2 meters).
  *   **Currency:** "Ontology Credits" (OC). You can use poker chips or just tally on the board. Each group starts with 100 OC.

  **Group Setup:**
  13 Students. Divide into 4 Groups (three groups of 3, one group of 4). Bolted tables mean they work in clusters.

  ---

  ### Minute-by-Minute Timeline (100 Minutes)

  **00:00 – 00:10: Market Rules & Initial Endowment**
  *   Hand out 100 OC to each group.
  *   **The Rule:** You must explain *why* inertial effects happen (why the rope tightens, why the student gets dizzy).
  *   **The Menu (Write on Board):**
      *   *Absolute Space:* Cost 40 OC. (Explains rotation easily).
      *   *Fixed Stars:* Cost 10 OC. (Explains rotation relative to matter).
      *   *Inertial Law (Brute):* Cost 30 OC. (Just stipulates tension happens).
      *   *Sensory Data:* Free. (But sensations are not explanations).
  *   **Constraint:** You must declare your ontology *before* seeing the Case Cards. Once bought, you cannot sell. If your ontology cannot explain a case, you lose 20 OC per failure.

  **00:10 – 00:35: Phase 1 — The Empirical Anchor (Physical Demo)**
  *   **Case 1:** Student sits on swivel chair, spins. "Are you rotating?"
      *   Groups wager 5 OC on "Yes/No." (All will say Yes).
      *   **Crucial Move:** Ask groups to write down: *Rotating relative to what?*
      *   If they write "The Room," tell them: "The room is removed in Case 3. Does your ontology survive?"
  *   **Case 2:** Bucket on rope, swung in circle.
      *   Measure tension (subjective: "High/Low").
      *   Groups must justify the tension using their purchased Ontology.
  *   **Goal:** Establish that inertial effects are real data that *demand* a relatum.

  **00:35 – 01:05: Phase 2 — The Shift & The Void (Card Decks)**
  *   **The Shift (Deck A):** Hand Deck A to Groups 1 & 2, Deck B to Groups 3 & 4.
      *   Tell them: "These describe two possible states of the universe."
      *   Task: Determine if State 1 and State 2 are *distinct possibilities*.
      *   **Wager:** 10 OC. If they say "Distinct," they must hold *Absolute Space*. If "Identical," they hold *Relationism*.
      *   **Reveal:** Show the cards side-by-side. The relational data is identical.
      *   **Penalty:** If they bought *Absolute Space* but claim states are "Identical," they lose 20 OC for inconsistency. If they bought *Relationism* but claim "Distinct," they lose 20 OC.
  *   **The Void (Deck B & C):** The Empty Universe cases.
      *   Scenario: Bucket spins, no stars, no room. Rope is taut.
      *   Groups with *Fixed Stars* ontology cannot explain the tension (no stars to rotate relative to). They lose 20 OC unless they upgrade to *Absolute Space* (pay remaining 30 OC) or *Inertial Law (Brute)*.
      *   Groups with *Absolute Space* explain it easily.
      *   Groups with *Inertial Law (Brute)* explain it, but pay the high cost.

  **01:05 – 01:25: Phase 3 — The Settlement**
  *   Tally scores.
  *   **The Twist:** Announce that *predictive accuracy* was identical for everyone (everyone knew the rope would tighten). The score difference is purely *Ontological Efficiency*.
  *   Likely outcome: Substantivalists have high consistency but low funds (spent 40 OC). Relationists have high funds but failed the Void cases (lost penalty points).
  *   **Result:** A tie in explanatory power, a trade-off in cost.

  **01:25 – 01:40: Debrief — Mapping the Joints**
  *   Connect the "Shift" wager to Newton's Scholium (Space is a sensorium).
  *   Connect the "Void" penalty to Mach's complaint (Illicit extrapolation).
  *   Connect the "Cost" to the modern debate (Haecceitism vs. Structuralism).

  **01:40 – 01:50: The GR Bridge (Or Warning)**
  *   (See section below).

  **01:50 – 01:60: Buffer/Q&A**

  ---

  ### Scoring Scheme: Making the Wager Bite

  The scoring must prevent the "It's just verbal" dismissal by quantifying the *theoretical virtue* trade-off.

  1.  **Consistency Bonus (Max 50 OC):** Did your ontology allow you to answer every case without contradiction? (e.g., You can't say rotation is relative to stars in Phase 1 and relative to space in Phase 2).
  2.  **Parsimony Bonus (Max 50 OC):** Remaining credits after purchasing ontology.
  3.  **The "Verbal" Trap Defense:** If a group claims the debate is verbal, they must refund their Ontology Credits. If they refund *all* credits, they have no theory and cannot explain the bucket. They are disqualified from the "Best Explanation" prize. This forces them to admit that *something* is doing the explanatory work, even if they think the labels are arbitrary.

  ### Pre-empting Failure Modes

  **Failure 1: "I feel myself rotating, so it's obvious."**
  *   **Design Fix:** In Phase 1, Rule 4 states: *"Sensations are Data, Not Explanations."*
  *   **Instructor Script:** "You feel a force. Newton agrees. Mach agrees. The question is not *if* you feel it, but *what pushes you*. If you say 'I feel it,' you are describing the effect, not the cause. To win the wager, you must name the *relatum* that causes the force. If you cannot name it, you pay the 'Brute Law' penalty."
  *   **Why it works:** It shifts the burden from *detection* (which is easy) to *identification* (which is the metaphysical problem).

  **Failure 2: "The scores tie, so the controversy is verbal/meaningless."**
  *   **Design Fix:** The "Counterfactual Audit." In Phase 3, do not just tally points. Ask: "If the distant stars vanished *right now*, would the bucket's surface still curve?"
  *   **Mechanism:** Substantivalists say Yes. Relationists say No.
  *   **Instructor Script:** "A verbal dispute is one where no difference in the world hangs on the answer. Here, a difference hangs on a *counterfactual*. If you are a Relationist, removing the stars changes the physics. If you are a Substantivalist, it does not. The theories tie on *actual* data, but they diverge on *possible* worlds. That is not verbal; that is empirical underdetermination."
  *   **Why it works:** It clarifies that the disagreement is about the *structure of possibility*, not just language.

  ### The Debrief: Mapping Moments to Arguments

  1.  **The Shift Cards (Deck A):** This is the **Leibniz Shift Argument**. If they bought Absolute Space, they paid for entities that make no observational difference. *Lesson: Substantivalism violates the Principle of Sufficient Reason (or is ontologically extravagant).*
  2.  **The Void Cards (Deck B):** This is **Newton's Bucket/Globes**. If they didn't buy Absolute Space, they couldn't explain the tension without stars. *Lesson: Relationism struggles to ground inertial forces in isolation.*
  3.  **The Cost Tally:** This is **Mach's Principle**. The Relationists saved money (ontology) but risked explanatory failure. *Lesson: Mach wants to reduce inertia to interaction, but needs a mechanism.*
  4.  **The Counterfactual:** This is the **Realism Debate**. *Lesson: Scientific realism often commits us to unobservables (Space) to save the phenomena (Inertia).*

  ### The GR Bridge: Honest Advice

  **Do not try to explain General Relativity in two minutes.** It is a trap. You will either mislead them (by saying "Mach won") or confuse them (by bringing in metrics).

  **The Feature You Cannot Reproduce:**
  The activity cannot reproduce the **dynamical nature of spacetime**. In your activity, Space is a static stage (Newton) or a bookkeeping device (Leibniz). In GR, Spacetime is a participant—it curves, ripples, and interacts. The activity treats geometry as fixed background; GR makes geometry the field.

  **The Bridge Sentence (If you must):**
  "Newton said space is a container; Mach said it's a bookkeeping system. Einstein found a third option: space is a physical field that bends when matter moves, telling matter how to move in return. He took Mach's hint that matter matters, but kept Newton's math that space is real."

  **The Safer Sentence (Recommended):**
  "Newton and Mach agreed on the data but disagreed on what the data *ontologically cost*. General Relativity changes the ledger entirely: it makes the geometry of space something that can be measured locally, without needing distant stars, but it also makes that geometry dependent on the matter within it. It dissolves the dichotomy you just wagered on, but it does not dissolve the question of what spacetime *is*."

  ### Predictable First-Run Glitches & Fixes

  1.  **The Swivel Chair Squeaks:** If the chair is noisy, the auditory cue distracts from the vestibular sensation.
      *   *Fix:* Bring a drop of oil or acknowledge the noise as "external reference" and ask them to close their eyes.
  2.  **Group Stagnation:** Groups may freeze on the Shift Cards, unable to decide if shifted worlds are distinct.
      *   *Fix:* Circulate and ask: "If God moved the entire universe 5 feet left while you slept, would anything change?" Force the intuition pump.
  3.  **Score Keeping Drift:** You will get bogged down in math.
      *   *Fix:* Keep the scoring binary on the board. "Solvent" vs "Bankrupt." Don't count exact points in Phase 3; just ask "Who has enough credits to buy a theory that explains the Void?"
  4.  **The "Common Sense" Revolt:** Students may insist Newton is obviously right.
      *   *Fix:* Remind them that "Common Sense" also said the Sun moves around the Earth. The point of the seminar is to stress-test intuition.

  ### Final Recommendation on the Skeleton

  Your skeleton is sound, but **Phase 1 needs to be stricter about the "Relatum" requirement.** If you let them say "They are rotating" without saying "Relative to X," the rest of the seminar collapses.

  **Modification:** In Phase 1, provide a blank on the wagering sheet: *"Rotation is detected relative to: _______________."* If left blank, the wager is void. This forces the metaphysical commitment immediately, making the subsequent debate about *what fills that blank* inevitable.

  This design ensures they leave the room understanding that the debate isn't about whether the water climbs the bucket (it does), but about what the water is climbing *against*.
