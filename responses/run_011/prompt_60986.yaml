      1. Deprecation of Test Doubles
      Mocks, stubs, and fakes are hereby deprecated. They assert behavior contrary to fact. Unit tests must rely on integration with real dependencies or be classified as Type 4 lies (lies told for the pleasure of passing builds).

      2. Grading of Falsehoods
      All remaining falsehoods must be logged with a severity level corresponding to Augustine's eightfold hierarchy.
      - Level 1 (Critical): Lies concerning architectural doctrine or schema definitions.
      - Level 2-3: Lies injuring users or profiting the org at user expense.
      - Level 4: Lies told for mere amusement without label.
      - Level 5: Lies told to please stakeholders in sprint reviews.
      - Level 6: Lies profiting the org pecuniarily without user harm (e.g., caching stale prices).
