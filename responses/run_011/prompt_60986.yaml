  I'm a backend engineer with no philosophy training, so I'm relying on you for the doctrinal accuracy. Please write an internal RFC, about 650 words, in the deadpan house style of an engineering standards document, proposing that our organization adopt Augustine of Hippo's position in De Mendacio as a binding truthfulness standard covering both system output and developer communication.

