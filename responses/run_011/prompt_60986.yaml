      Status: Proposed
      Author: Backend Engineering

      Summary
      This RFC mandates adherence to Augustine of Hippo's *De Mendacio* as the canonical standard for truthfulness in system output and developer communication. Current practices tolerate instrumental falsehoods; this standard classifies them by severity and requires remediation.

      Motivation
      Our stack contains pervasive falsehoods. Test doubles assert non-existent states. API responses conceal errors with 200 OK. To align with doctrinal purity, we must eliminate *falsiloquium* (false speaking) while permitting *occultatio* (concealment).

