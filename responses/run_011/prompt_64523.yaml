  **Final Exam Essay Question**

  In his unfinished drafts on socialism and the opening of Book II of the *Principles of Political Economy*, Mill argues that while the rules of distribution are human institutions, the choice between capitalism and socialism cannot be settled a priori. He contends that the defects of the existing order are known and felt, whereas the defects of socialism are merely predicted, necessitating gradual experimental verification rather than immediate abolition of private property. However, consider the containment reading: this asymmetry rests on reversibility, where cooperative experiments can be run inside a competitive market order without abolishing it, whereas a competitive order cannot be run inside a fully socialist system.

  Write an essay evaluating whether this experimental framework is genuinely neutral or structurally biased against socialism. Specifically, address whether the requirement that cooperatives survive on market terms constitutes a fair test of socialist principles. Furthermore, analyze whether Mill's claim that socialism cannot contain markets is itself an unargued prediction lacking better warrant than the socialist's counter-claims. Conclude by explaining what would have to be true for Mill's asymmetry not to beg the question against the socialist.

  **Word Limit:** 1,200 words
  **Marks:** 25

  ***

  **Model Answer**

  Mill's hesitation to endorse socialism is not rooted in conservative defense of property but in an epistemic distinction between experienced evils and hypothetical ones. He argues that because current property arrangements fail to meet their own justificatory principles, they are open to critique. However, since socialism proposes a wholesale reorganization of production and distribution, its failures are theoretical until demonstrated. Therefore, judgment must await evidence generated by experience. This stance avoids dogmatism but risks status quo bias if the conditions for gathering evidence are skewed. Mill insists that the burden of proof lies on the innovator, yet he acknowledges the current system has never truly been tried under conditions of equal opportunity.

  The containment reading suggests Mill's methodology favors capitalism due to reversibility. Small-scale socialist experiments, such as worker cooperatives, can operate within a market economy. If they fail, the broader system remains intact. Conversely, establishing a socialist system generally requires abolishing market competition; if it fails, the return to capitalism is costly and disruptive. Thus, letting experience decide is not neutral because the cost of error is asymmetrical. This structural advantage allows capitalism to host its competitors while socialism cannot host capitalism. It transforms the call for experience into a procedural hurdle that only the incumbent can easily clear.

  However, this reading relies on two contentious premises that require critique. First, it assumes a cooperative surviving on market terms is a valid test of socialism. If socialism entails abolishing market competition to eliminate exploitation or insecurity, forcing cooperatives to compete profitably may distort their function. They might adopt capitalist practices to survive, thereby failing to demonstrate the benefits of non-competitive organization. If the test requires socialist institutions to succeed under capitalist rules, the test is rigged against the very principles being evaluated. The cooperative becomes a mimic of the firm rather than an alternative to it.

  Second, the claim that socialism cannot contain markets is itself a prediction, not a known fact. Mill assumes a socialist state must abolish competition entirely. Yet, if market mechanisms could operate within a socialist framework of ownership, the reversibility argument collapses. One could introduce markets into socialism just as cooperatives are introduced into capitalism. By defining socialism as inherently incompatible with markets, Mill presupposes the conclusion he claims to be testing. He grants capitalism the flexibility to adapt while denying socialism the same conceptual room. This is not empirical humility; it is theoretical stacking of the deck.

  For Mill's asymmetry not to beg the question, two conditions must hold. First, the definition of socialism must not stipulate the abolition of markets as a necessary condition, allowing for hybrid forms that permit reversibility. Second, the metrics for success in cooperative experiments must measure social well-being and human development, not just market profitability. If cooperatives are judged solely by their ability to undercut capitalist firms, the test measures compatibility with capitalism, not the viability of socialist distribution.

  Ultimately, Mill's framework rescues him from dogmatism but not from bias. He correctly identifies that institutional knowledge is local and experimental. However, by accepting the containment premise without argument, he loads the dice. The known ills of capitalism are tolerated because the remedy is deemed too risky to test fairly. To avoid begging the question, Mill must admit that the impossibility of running markets within socialism is a theoretical claim requiring the same evidentiary support as the socialist's claim that cooperation yields higher productivity. Without this admission, his call for experience merely delays judgment under conditions favorable to the existing order.

  ***

  **Marking Scheme**

  | Component | Marks | What a Top Answer Does Here | Specific Mistake That Costs Marks |
  | :--- | :--- | :--- | :--- |
  | **Asymmetry & Epistemic Status** | 5 | Explains Mill's distinction between known capitalist ills and predicted socialist ills as grounds for experimentalism, not conservatism. | Treats Mill's hesitation as simple conservatism or utilitarian calculus without addressing the epistemic claim. |
  | **The Containment/Reversibility Thesis** | 5 | Clearly articulates the argument that cooperatives fit within capitalism but markets do not fit within socialism, creating structural bias. | Fails to explain reversibility or confuses containment with simple gradualism. |
  | **Critique: Fairness & Predictions** | 10 | Argues that market-testing cooperatives may distort socialism and that claiming socialism excludes markets is an unargued prediction. | Accepts the containment reading as fact without critique, or ignores the "unargued prediction" prompt requirement. |
  | **Condition for Non-Begging the Question** | 5 | Specifies that socialism must allow market hybridity and success metrics must go beyond profitability to ensure neutrality. | Offers vague platitudes about "balance" without specifying institutional conditions. |

  ***

  **A vs. B Distinction**
  An A answer treats the containment reading as a contestable theoretical premise that undermines Mill's neutrality; a B answer describes the containment reading accurately but fails to challenge its warrant or implications for fairness.
