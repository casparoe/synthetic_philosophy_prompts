  2.  **Deconstruct the Procedure Requirements:**
      *   **Questions to ask (in order):** Needs a flowchart logic. Sufficient answers, kill conditions, weaken conditions.
      *   **History vs. Philosophy Handoff:** Where does "What did Kepler think?" end and "Does Kepler's belief validate astrology?" begin?
      *   **Handling Ignorance:** Protocol for "I don't know."
      *   **Compression (500 words):** What distinctions stay? What goes?
      *   **Judgment Calls:** Identify where the procedure masks subjective choice (calibration analogy).
      *   **Limits:** What the procedure *cannot* decide (personal/ethical dimension).
      *   **Confidence Assessment:** At the end, rate confidence in Kepler claims vs. procedure utility. Identify the shakiest step.

  3.  **Drafting the Procedure (The "Kepler Filter"):**
      *   *Step 1: The Historical Claim.* Is the letter claiming Kepler *did* X, or that Kepler *justified* X?
