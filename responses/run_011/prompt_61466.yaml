      *Refining the "Judgment Call" identification:* The user is a chemist. They know calibration. I should use that analogy. The judgment call is deciding what counts as "the same claim." Kepler's "aspects" vs. Modern "aspects." Are they the same variable? That's a calibration choice.

      *Refining the "History/Philosophy Handoff":* This is crucial. History = What Kepler said. Philosophy = Does Kepler saying it make it true/valid today? The procedure must force the writer to stop at the handoff and not use history to settle philosophy.

