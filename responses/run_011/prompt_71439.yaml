answer: |-
  Here is the spec for Common Knowledge of Rationality (CKR). I have evaluated your seeds, added one necessary component, and rendered verdicts on the inconsistencies and contenders.

  ### The Desiderata

  **1. Iterative Depth (The Muddy Children Constraint)**
  *   **The Case:** In the Muddy Children puzzle, finite levels of knowledge ("I know that you know...") do not trigger the logical cascade. Only the infinite fixed point ($C(E)$) licenses the deduction. If CKR stops at level $k$, the backward induction or equilibrium selection fails at step $k+1$.
  *   **Verdict:** **Non-negotiable.** If the account reduces to finite mutual knowledge, it is not an account of *Common* Knowledge. It fails to license the specific deductions CKR is invoked to justify.

  **2. Attainability (The Coordinated Attack Constraint)**
  *   **The Case:** The Two Generals problem proves CKR is impossible over unreliable channels. Yet coordination occurs in noisy real-world settings (conventions, traffic). An account that insists on literal CKR renders most coordination inexplicable.
  *   **Verdict:** **Non-negotiable.** The account must either (a) explain how CKR is generated without message passing (e.g., salience, joint attention) or (b) explicitly substitute a weaker condition (like common *p*-belief) and prove it suffices for the licensing work. Ignoring the impossibility result is a bug.

  **3. Robustness (The Email Game Constraint)**
  *   **The Case:** Rubinstein's Email Game shows a discontinuity: with probability 1 of delivery, players coordinate on the risky payoff; with probability $1-\epsilon$, they defect to the safe payoff, regardless of how small $\epsilon$ is. CKR is not the limit of "almost" CKR.
  *   **Verdict:** **Non-negotiable.** An account that treats CKR as a limit case of high-probability belief is mathematically false. The account must explain why the qualitative leap matters or abandon the CKR derivation for that class of games.

  **4. Off-Path Coherence (The Centipede Constraint)**
  *   **The Case:** In extensive form games (Centipede, Chainstore), Backward Induction requires reasoning about nodes that are unreachable if CKR holds. If Player 1 deviates, Player 2 is at a node that CKR says shouldn't exist. To license a move there, Player 2 must have beliefs about Player 1's rationality.
  *   **Verdict:** **Non-negotiable.** Any account used to solve extensive form games must specify belief revision policies at off-path nodes. If it says "this node is impossible," it cannot license a move *at* that node.

  **5. Belief Revision (The Added Seed)**
  *   **The Case:** Linked to Off-Path. When a deviation is observed, how is the common knowledge structure updated? Does one level of rationality drop? Does the common prior shift? Standard Bayesian updating often breaks down when observing probability-zero events (deviations).
  *   **Verdict:** **Non-negotiable.** Without a theory of counterfactual belief revision (e.g., lexicographic probability systems, AGM revision), CKR is static and cannot handle dynamic games.

  **6. Descriptive Honesty (The Beauty Contest Constraint)**
  *   **The Case:** In $p$-beauty contest games, humans iterate 1–2 levels, not to infinity. CKR predicts Nash; humans do not play Nash.
  *   **Verdict:** **Taste (Normative Camp).** If CKR is a claim about *justification* (what a perfectly rational agent *should* do), descriptive failure is irrelevant. If it is a claim about *prediction*, it is fatal. Since you are auditing arguments (justification), this is not a hard constraint on the logic, only on its empirical application.

  **7. Agreement (The Aumann Constraint)**
  *   **The Case:** Aumann's Agreement Theorem states Bayesians with a common prior cannot agree to disagree. Real agents do.
  *   **Verdict:** **Taste (Bayesian Camp).** This is only non-negotiable if you commit to the Common Prior Assumption (CPA). If you allow heterogeneous priors, this desideratum dissolves.

  ---

  ### The Knockout and The Triad

  **The Single Knockout Requirement:**
  **Off-Path Coherence.**
  This requirement knocks out the most accounts because it forces a choice between logical consistency and solution concept stability. Standard CKR accounts (like Aumann's correlated equilibrium derivation) work beautifully in normal-form games but fracture in extensive-form games. To satisfy Off-Path Coherence, you must import extra machinery (trembling hands, sequential equilibrium, epistemic conditional belief) that often contradicts the purity of the "Common Knowledge" assumption. Most textbook arguments gloss over this; strictly audited, they fail here.

  **The Inconsistent Triad:**
  Your suspicion is correct. The following triad is inconsistent in dynamic games:
  1.  **CKR holds at every node** (including those reached only by deviation).
  2.  **Belief Consistency:** A rational agent's beliefs at a node must be consistent with the observation that brought them there (i.e., "I am here, so someone must have deviated").
  3.  **CKR Survival:** Common Knowledge of Rationality is preserved under belief update (learning a deviation doesn't destroy the common knowledge structure).

  **Verdict:** You cannot hold all three.
  *   If (1) and (3) hold, the node is unreachable, so (2) is vacuous.
  *   If (2) and (3) hold, the deviation implies irrationality, so (1) is false.
  *   If (1) and (2) hold, the update rule must be non-standard (e.g., the deviation was a "tremble," not a choice), which violates standard Bayesian updating, effectively modifying (3).

  **Resolution:** To save the licensing power of CKR in extensive games, you must drop **(1)**. CKR cannot hold *at* the off-path node. Instead, you must posit a *hierarchy* of beliefs (e.g., "I believe you are rational, but I believe that you believe that I might tremble"). This moves the account from simple CKR to **Common Belief in Rationality with Lexicographic Probabilities**. If an argument claims simple CKR licenses Backward Induction without this qualification, it is invalid.

  ---

  ### Contender Scoring

  **(1) CKR as a Device (Fictionalism/Instrumentalism)**
  *   **The Pitch:** CKR is not a psychological state but a logical operator used to prune the game tree. Off-path nodes are counterfactuals evaluated by "what would rationality dictate," not "what do I believe now."
  *   **Score:** Passes **Iterative Depth** and **Off-Path Coherence** (by redefining the node as a logical test rather than a historical reality). Fails **Attainability** and **Descriptive Honesty** (admits it is false).
  *   **Verdict:** Valid for normative auditing. It licenses the *argument* (Backward Induction is the unique rational solution) but does not license the *prediction* (players will actually do this). Use this if you care about solution concepts, not behavior.

  **(2) Common p-Belief (Monderer & Samet)**
  *   **The Pitch:** Replace probability 1 with probability $p$ (where $p$ is high enough given the payoff structure).
  *   **Score:** Passes **Attainability** and **Robustness** (solves the Email Game discontinuity). Fails **Iterative Depth** (does not guarantee the infinite elimination of strategies required for strict Nash/BI in all games).
  *   **Verdict:** Valid for empirical auditing. It licenses the *coordination* (why we drive on the right) but does not license the *uniqueness* (why we play the specific Nash equilibrium). Use this if you care about stability and implementation, not logical necessity.

  **Final Recommendation:**
  If your audit is about whether the *logic* of the argument holds (e.g., "Is BI the rational solution?"), demand **CKR as a Device** but insist they resolve the **Inconsistent Triad** by specifying their belief revision policy at off-path nodes. If they don't, the argument is incomplete. If your audit is about whether the *outcome* will obtain, reject CKR entirely and demand **Common p-Belief** calibrated to the noise in the system.
