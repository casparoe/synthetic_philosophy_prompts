answer: |-
  **SPECIFICATION FOR JOINT STATEMENT ON VAGUENESS AND SORITES**
  **To:** The Graduate Reading Group
  **From:** Drafting Committee
  **Date:** End of Term Session
  **Subject:** Resolution of Epistemicist and Supervaluationist Impasse

  ### I. AGREED CLAIMS

  The following claims are drafted for signature by both the Epistemicist (Member A) and the Supervaluationist (Member B). Where standard phrasing has been altered to secure agreement, the surrender required is noted in parentheses.

  1.  **The Sorites Premise:** The inductive premise of the Sorites paradox (e.g., "If $n$ grains do not make a heap, $n+1$ grains do not make a heap") is not true.
      *   *(Rewording Note: Member A surrenders the claim that the premise is straightforwardly false in all contexts; Member B surrenders the claim that the premise lacks a truth value entirely. Both accept "not true" as the common denominator: for A, it is false; for B, it is not supertrue.)*
  2.  **Classical Logic:** Classical logical tautologies (e.g., $P \lor \neg P$) are valid and assertible within the domain of vague predicates.
      *   *(Rewording Note: Member B surrenders the intuition that truth-value gaps invalidate excluded middle for borderline cases; Member A surrenders the implication that validity guarantees knowability of the disjuncts. Both agree the schema holds.)*
  3.  **Norms of Assertion:** A competent speaker should not assert a simple sentence containing a vague predicate if that sentence describes a borderline case.
      *   *(Rewording Note: Member A surrenders the claim that the prohibition is solely due to lack of knowledge; Member B surrenders the claim that the prohibition is solely due to lack of truth. Both agree on the practical norm: do not assert.)*
  4.  **Knowledge of Ignorance:** A speaker located in the penumbra of a vague predicate can correctly claim to know that they do not know whether the predicate applies.
      *   *(Rewording Note: Member A surrenders the claim that this is merely empirical uncertainty; Member B surrenders the claim that this is merely semantic indecision. Both agree the second-order claim is knowable.)*

  ### II. RESIDUAL DISAGREEMENTS

  The following table catalogs the disagreements that remain after signing Section I.

  | Topic | Epistemicist Formulation (A) | Supervaluationist Formulation (B) | Judgment | Reasoning |
  | :--- | :--- | :--- | :--- | :--- |
  | **The Cutoff** | There exists a specific number $n$ such that $n$ is not a heap and $n+1$ is a heap; this fact is fixed by usage. | There is no specific number $n$ that marks the boundary; boundaries exist only relative to a precisification. | **Substantive** | Disagreement concerns the metaphysics of meaning: whether usage determines a unique extension or a set of admissible extensions. |
  | **Truth of Borderlines** | A borderline sentence is either true or false, though we cannot determine which. | A borderline sentence is neither true nor false (it lacks a supertruth value). | **Bookkeeping** | Both agree the sentence cannot be *used* successfully. The dispute is over whether to assign a hidden semantic value (A) or a gap (B). |
  | **Semantics of 'True'** | 'True' is disquotational and bivalent; 'Supertrue' is a derivative technical notion. | 'True' (in the philosophical sense) is supertruth; bivalent truth is a derivative technical notion. | **Verbal** | Both employ a concept that plays the role of "correct assertibility" and a concept that plays the role of "classical logic compliance." They are labeling these concepts differently. |

  ### III. THE CRUXES

  The following three sub-questions are identified as the only ones capable of altering the positions held in Section II. For each, a concrete case is provided. Predictions are recorded in advance to verify whether argumentation produces movement.

  #### Crux 1: The Vagueness of the Indeterminacy Operator
  **Question:** Is the operator "It is indeterminate that..." itself vague? If the boundary between the determinate and the indeterminate is sharp, does this not reintroduce a Sorites paradox at the higher order?
  **Concrete Case:** A color spectrum transitioning from Red to Orange. Consider the claim: "It is determinately Red."
  *   **Prediction (A):** The boundary between "determinately Red" and "not determinately Red" is sharp. We cannot know where it is, but it exists. No regress threatens because ignorance is stable at every level.
  *   **Prediction (B):** The operator is vague. There is no sharp boundary between the determinate and the indeterminate. We must accept higher-order vagueness without sharp cutoffs at any level.
  *   **Movement Condition:** Member B moves if they concede a sharp boundary at any level of the hierarchy. Member A moves if they concede the hierarchy is infinite and boundary-less.

  #### Crux 2: Knowledge of Specific Borderline Status
  **Question:** Is a speaker entitled to claim of a *specific* object that it is a borderline case? (i.e., Can one know that one does not know?)
  **Concrete Case:** A specific heap of 74 grains of sand (agreed by the group to be in the penumbra).
  *   **Prediction (A):** Yes. I can know "I do not know if 74 grains is a heap." This is a standard case of knowing the limits of my knowledge.
  *   **Prediction (B):** Yes. I can know "It is indeterminate if 74 grains is a heap." This is a semantic fact about the term 'heap'.
  *   **Movement Condition:** This crux tests whether the "ignorance" is epistemic (A) or semantic (B). Movement occurs if A admits the ignorance is due to meaning, or if B admits the ignorance is due to worldly facts. (Expectation: Neither will move, confirming the disagreement is foundational).

  #### Crux 3: Divergence on Non-Semantic Sentences and Practical Outcomes
  **Question:** Do the two views yield different truth-values or practical advice for sentences containing *no* semantic or epistemic vocabulary? If the advice is identical, the dispute may be purely theoretical.
  **Concrete Cases:** The Pluto Wager and The Supply Contract (detailed below).

  **Case 3.1: The Pluto Wager (2003–2005)**
  *   **Context:** A bet struck in 2003, payable in 2005 on the truth of "Pluto is a planet." The IAU definition (2006) post-dates the payoff.
  *   **Epistemicist Prediction:** In 2005, the sentence "Pluto is a planet" was either True or False. The 2006 definition did not change the 2005 truth value; it merely clarified the meaning for future use. One bettor won in 2005, even if we cannot know which.
      *   *Obligation:* The bet must be paid to one side (determined by the hidden sharp boundary of 2005 usage), or declared void due to evidentiary impossibility, but *not* because the truth value was missing.
  *   **Supervaluationist Prediction:** In 2005, the sentence "Pluto is a planet" was neither True nor False (indeterminate). The 2006 definition was a precisification that changed the language game.
      *   *Obligation:* The bet is void. Neither side won because the condition for winning (truth) was not met, nor was the condition for losing (falsity).
  *   **Movement Condition:** Member A moves if they concede the bet was void due to lack of truth. Member B moves if they concede one side actually won in 2005.

  **Case 3.2: The Supply Contract ("Material" Delay)**
  *   **Context:** A contract clause requires notification of any "material" delay. No threshold is defined. Parties seek advice on redrafting.
  *   **Epistemicist Prediction:** There is a sharp threshold for "material" fixed by legal convention, but it is unknowable. Litigation is risky because a judge will enforce the hidden threshold.
      *   *Advice:* Redraft with specific numerical thresholds (e.g., "5 days") to eliminate the epistemic barrier and provide notice to the supplier.
  *   **Supervaluationist Prediction:** There is no threshold for "material" until a court precisifies it. Litigation is risky because a judge will arbitrarily select a precisification.
      *   *Advice:* Redraft with specific numerical thresholds (e.g., "5 days") to eliminate the semantic gap and provide notice to the supplier.
  *   **Movement Condition:** This is the critical test for the "Rest of Us."
      *   *Joint Conclusion:* If both advise redrafting with specific numbers for the *same reasons* (risk mitigation and notice), the practical difference is null.
      *   *Requirement:* Both members must sign a statement confirming that their theoretical disagreement licenses **no difference in legal advice**. If they cannot sign this, they must specify exactly what different action each theory recommends.

  ### IV. SIGNATURE BLOCK

  By signing below, the undersigned agree that the claims in Section I represent their current position, that the disagreements in Section II are accurately characterized, and that the predictions in Section III stand as recorded for future verification.

  __________________________ (Member A: Epistemicism)

  __________________________ (Member B: Supervaluationism)

  __________________________ (Mediator/Chair)
