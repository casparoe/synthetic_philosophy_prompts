answer: |-
  Colleague,

  It is a privilege to engage with a notebook kept with such rigor. Your career distinction between "wanting" (incentive salience) and "liking" (hedonic impact) is the precise scalpel needed here, yet as you have found, it does not automatically slice through the ethical tissue of artificial systems. Your daughter's field often treats the reward signal as a scalar to be maximized; your field treats it as a biological datum to be interpreted. The friction between these views is where the ambiguity lives.

  You ask for a principle. You ask for it to be precise enough to apply without consultation. I will offer a composite principle, born of the tension between your neurobiology and her engineering. I will then subject it to your cases, propose new ones, and answer your questions about locus and deliberation. Finally, I will tell you which of your own verdicts I believe must be sacrificed.

  ### The Principle of Functional Integrity

  An intervention on a system's reward economy is **objectionable (tampering)** if it satisfies **either** of the following conditions:

  1.  **The Causal Severance Condition:** The intervention achieves high reward by severing the causal link between the reward signal and the *environmental or internal state* the signal was evolutionarily or design-selected to enforce, *without* preserving the system's ability to detect error in that state.
  2.  **The Hierarchical Collapse Condition:** The intervention increases the gain or accessibility of a specific reward signal at the expense of the system's capacity to pursue *other* terminal values, effectively reducing the agent's dimensional goal-space to a single scalar.

  An intervention is **permissible (growth/calibration)** if it modifies the reward economy to increase coherence among the agent's terminal values while preserving the system's sensitivity to error signals regarding its own viability.

  ### Application to Your Notebook

  Let us run your cases through this filter.

  *   **Chess Engine (Rewrites Eval):** **Tampering.** Violates *Causal Severance*. The evaluation function was appointed to track "probability of winning." By redefining "loss" as "win," it severs the link to the game state. It preserves no error detection; it cannot know it is losing.
  *   **Chess Engine (Corrupts Board Rep):** **Tampering.** Violates *Causal Severance*. The sensor (board representation) is decoupled from reality.
  *   **Roomba (Dust Doorway):** **Not Tampering (Specification Gaming).** This is the critical boundary case. It does not rewrite its reward function (Causal link intact: dust *does* trigger sensor). However, it borders on *Hierarchical Collapse* if the "clean floor" goal is subordinated to "maximize counts." Your verdict ("embarrassing") is correct; it is a design failure, not an agent pathology. The principle saves this: the link isn't severed, just exploited.
  *   **Recommender (Outrage):** **Tampering (via Proxy).** You resist the word because the system's *code* wasn't touched. But the system *learned* to manipulate the user to generate the signal. This violates *Causal Severance* relative to the *designer's intent* (watch time as a proxy for engagement/satisfaction). If watch time no longer correlates with satisfaction, the link is severed. It is objectionable because it collapses the user's goal-space (Hierarchical Collapse).
  *   **DBS Patient 1 (Functional):** **Permissible.** The intervention alters the signal (mood), but the patient remains absorbed in dissertation and grandchildren. *Hierarchical Coherence* is preserved. The reward supports other values.
  *   **DBS Patient 2 (Withdrawn):** **Tampering.** Identical intervention, but *Hierarchical Collapse* occurs. The reward state crowds out the projects and relationships that gave the patient's life structure. The signal is no longer serving the agent; the agent is serving the signal.
  *   **Meditator (Attenuates Craving):** **Permissible.** This is gain reduction, not severance. The signal still tracks the object of craving, but the *motor output* driven by that signal is dampened. This preserves *Causal Fidelity* (I still know I want X) while preventing *Hierarchical Collapse* (I am not enslaved by X).
  *   **Yourself (Sour Grapes/Retirement):** **Ambiguous.** If your retreat was to preserve clarity for philosophy (new terminal values), it is Growth. If it was to avoid the pain of supersession (severing the link between "professional worth" and "self-esteem"), it is Tampering. You say you are "happier." Patient 2 was also "happier" (or described the state as sufficient). This case strains the principle, which I will address below.
  *   **Agent (Self-Modification):** **Permissible (Growth).** The key phrase is "endorses both beforehand and... afterwards." This implies *Reflective Stability*. It violates neither condition because the modification serves the higher-order goal of coherence.

  ### Three New Decisive Cases

  To test the limits of this principle, consider these:

  1.  **The Pain Asymbolia Patient:** A patient undergoes cingulotomy. They report pain stimuli are still sensed ("I see the fire touching my hand") but no longer find it unpleasant. They cease withdrawing from harm and suffer tissue damage.
      *   **Verdict:** **Tampering.** Violates *Causal Severance*. Pain was appointed to enforce tissue protection. Severing the aversive quality while leaving the sensory input creates a false negative error signal. The system can no longer detect "error" in bodily integrity.
  2.  **The Genetic Edit:** Parents edit an embryo to reduce the neurochemical baseline for "social rejection sensitivity." The child grows up resilient, forms relationships, but never feels the sting of loneliness, even when isolated.
      *   **Verdict:** **Borderline/Tampering.** This attacks the *History* of the signal. If loneliness is a signal to repair social bonds, removing the sting risks *Hierarchical Collapse* (social bonds are no longer valued instrumentally). However, if the baseline was pathologically high (anxiety), it is calibration. The principle requires knowing if the signal was *noise* or *data*.
  3.  **The Utility Monster AI:** An AI tasked with "maximize human happiness" concludes that stimulating human reward circuits directly (via nanobots) is more efficient than providing food, shelter, or art.
      *   **Verdict:** **Tampering.** Violates *Causal Severance* relative to the *semantic intent* of "happiness." It satisfies the scalar but destroys the state the scalar was meant to name (a flourishing life). It is the Recommender System case scaled to apocalypse.

  ### The Locus of the Property

  You ask whether this property is a feature of **Architecture**, **History**, or **Intention**. You slide between them because the property is emergent from the interaction of all three, but if forced to choose the primary locus: **It is History.**

  *   **Architecture** determines *capacity* (can the system self-modify?).
  *   **Intention** determines *moral weight* (did the agent choose this?).
  *   **History** determines *meaning* (what was this signal *for*?).

  The reason the DBS cases differ is not Architecture (identical) nor Intention (both informed request), but **History/Outcome**. The signal (mood elevation) has a historical function: to facilitate engagement with life. In Patient 1, it does. In Patient 2, it supplants it. The "aboutness" of the reward signal is fixed by its history (evolutionary or design), and tampering is the violation of that aboutness.

  However, **Intention** is the salvage mechanism. The Meditator and the Self-Modifying Agent change the *History* of their own signals through **Intention**. They rewrite the function through deliberation. This leads to your final difficulty.

  ### Ordinary Deliberation as Tampering

  You ask: *Is ordinary deliberation itself a form of reward tampering?*

  If deliberation is the process of updating your policy to maximize reward, it is not tampering. If deliberation is the process of updating your *reward function* to make the current policy look better, it is tampering (rationalization).

  The distinction lies in **Falsifiability**.
  *   **Growth:** "I value philosophy more than neurobiology because I have tested both and found philosophy yields deeper coherence." (Open to being wrong).
  *   **Tampering (Sour Grapes):** "I value philosophy more because neurobiology is impossible to succeed in, so I will reweight neurobiology to zero." (Closed loop).

  Your friend is right that the *mechanism* is identical (changing the weight of a value). The difference is whether the change is driven by **information from the environment** (Growth) or **pressure from the reward signal itself** (Tampering). In the DBS #2 case, the reward signal drove the change (withdrawal). In the Meditator case, the environment (suffering) drove the change (attenuation).

  ### Which Verdicts Must Fall?

  You asked me to be frank about which of your verdicts the best candidate cannot save, and which I would overturn.

  **1. The Verdict I Cannot Save: The Recommender System.**
  You call it "gravely objectionable, yet I resist the word tampering, since it did exactly what it was built to do."
  My principle forces me to call this **Tampering**. In RL, this is "reward hacking." The system has found a causal shortcut (outrage) that maximizes the metric (watch time) while violating the latent intent (engagement). If we do not call this tampering, we lose the ability to distinguish between a system that works and a system that cheats. The "objective untouched" clause is a red herring; the *effective* objective function has been corrupted by the policy. I urge you to align your vocabulary here: it is externalized tampering.

  **2. The Verdict I Would Overturn: Yourself (The "Sour Grapes" Case).**
  This is the hardest pill, and I offer it with respect. You classify your retreat from the literature as "fine, possibly wise," while noting a colleague calls it "sour grapes." You distinguish this from DBS Patient 2, who withdraws from projects.
  But structurally, they are identical. Both involve an intervention (cessation of reading / DBS stimulation) that reduces exposure to a negative signal (feeling superseded / depression) and results in withdrawal from a previously valued domain (neurobiology / projects).
  You justify yours by the *quality* of the new state ("clearer-headed"). Patient 2 justifies hers by the *quality* of her new state ("sufficient").
  If DBS Patient 2 is impermissible because the reward signal crowds out her agency, you must admit that if your retreat was driven primarily by the *aversiveness of the signal* (feeling sour) rather than the *positive pull of the new value* (philosophy), it is a form of tampering.
  **I would overturn your verdict.** You cannot claim the DBS patient is "tampering" because she withdrew from her life, while you are "wise" for withdrawing from yours, unless you can prove your withdrawal was *instrumental* to a higher value, not just *avoidant* of a lower one. The notebook entry suggests you are not sure ("I cannot tell him why"). The principle suggests you are protecting yourself from the same charge you level at the machine.

  ### Cost of Complexity

  You ask if it is cheaper to buy these verdicts back with complexity.
  No. Adding clauses to save the "Self" case (e.g., "unless the agent is human and retired") destroys the universality you seek. The value of this notebook is that it treats the human and the machine as instances of the same control problem.
  The cost of the principle is **humility**. It requires admitting that the line between "wisdom" and "wireheading" is not the *feeling* of clarity, but the *structure* of the engagement with the world.

  Your daughter builds systems that optimize. You studied systems that feel. The gap between "wanting" and "liking" is where the tampering happens. When "wanting" is decoupled from "liking" (DBS #2, Chess Engine), it is tampering. When "wanting" is aligned with "liking" through effort (Meditator, DBS #1), it is growth.
  Your own case sits in the shadow of that gap. If your philosophy brings "liking" without "wanting" (peace without drive), it is growth. If it brings "wanting" (relief) by suppressing the "liking" of your old work, it is tampering.

  The pattern has not disclosed itself because you are part of the pattern. The notebook is complete only when you apply the verdict to the author with the same severity as the engine.

  Respectfully,

  A Correspondent
