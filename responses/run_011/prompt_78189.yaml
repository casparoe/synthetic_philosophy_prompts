answer: |-
  ### Brainstorming & Candidate Correspondences

  Okay, let's map the terrain. I need to align Metaethics (ME) with Dependent Type Theory (DTT) without flattening the friction points.

  1.  **Moral Sentence = `Prop`?**
      *   *Idea:* "Lying is wrong" is `Wrong Lying : Prop`.
      *   *Delete:* Immediate failure. This is Cognitivism. In DTT, `P : Prop` means `P` is a truth-apt proposition capable of being inhabited (true) or empty (false). Expressivism is defined by the denial of this. Smuggles the conclusion.

  2.  **Moral Sentence = `Type` (in `Type 0`)?**
      *   *Idea:* `Wrong Lying : Type`. Inhabitation represents the attitude.
      *   *Delete:* Still smells like Cognitivism. If it's a `Type`, it's an object in the ontology. Expressivists want to avoid ontological commitment to "wrongness" or even "attitudes" as objects of belief. However, this is closer than `Prop` because `Type` can be data. But it risks the "Psychologism" objection (reducing morality to psychology).

  3.  **Moral Sentence = Judgment (`Γ ⊢ t : T`)?**
      *   *Keep:* This is the strongest candidate. Expressivism says moral utterances are acts of commitment, not descriptions. In DTT, a Judgment (`⊢`) is an act of the type-checker/agent, distinct from a Term (`t`).
      *   *Risk:* Judgments don't compose. You can't write `(Γ ⊢ A) -> B`.

  4.  **Attitude = Predicate on Agents (`Disapproves : Agent -> Action -> Prop`)?**
      *   *Delete:* This is the "Psychologism" trap. If "Lying is wrong" means "I disapprove of lying", that's a factual claim about my psychology. Expressivists deny this is the *meaning* of the sentence. It turns the attitude into a belief *about* an attitude.

  5.  **Assertion = Closing a Goal / Inhabitation:**
      *   *Keep:* Asserting "Lying is wrong" corresponds to providing a term `t : Wrong Lying` (if we grant it a type) or successfully checking the judgment `⊢ Wrong Lying`.

  6.  **Embedding (Frege-Geach) = Function Types (`A -> B`):**
      *   *Keep:* The conditional "If P then Q" is `P -> Q`. This requires `P` and `Q` to be Types/Props.
      *   *Conflict:* If `P` is a Judgment (from #3), it cannot sit in the slot of `A` in `A -> B`.

  7.  **Quasi-Realism = Reification / Reflection:**
      *   *Keep:* Blackburn wants to "earn the right" to talk *as if* moral sentences are propositions. In DTT, this looks like taking a meta-level Judgment and reifying it into an object-level Type (using a universe lift or quoting mechanism) so it can be manipulated logically.

  8.  **User's "Tactic" Hypothesis:**
      *   *Analysis:* A tactic manipulates the proof state; it doesn't appear in the term. This aligns well with "Expressivism is about the speech act, not the content."
      *   *Refinement:* It's slightly off. A tactic *builds* a term. A moral assertion, for the expressivist, *is* the final move. It's closer to the **Judgment** itself (`⊢`) than the script (`tac`) that gets you there. But the intuition is correct: it's meta-theoretic vs. object-theoretic.

  ---

  ### The Translation: Expressivism & Frege-Geach in DTT

  Here is the literal translation of the problem into your vocabulary.

  **The Cognitivist Baseline (Realist):**
  We have a type family `Wrong : Action -> Prop`.
  1.  `lying : Action`
  2.  `inducing_lying : Action`
  3.  Premise 1: `w1 : Wrong lying` (A term inhabiting the proposition)
  4.  Premise 2: `w2 : Wrong lying -> Wrong inducing_lying` (A function term)
  5.  Conclusion: `w2 w1 : Wrong inducing_lying` (Application)
  *Status:* Trivial. Type-checks perfectly. `Wrong` is a `Prop`, so it embeds in `->`.

  **The Expressivist Attempt:**
  The Expressivist insists `Wrong` cannot be `Prop`. It cannot be truth-apt.
  Let's try to model "Expressing an Attitude" as a specific typing judgment that isn't about truth.

  *   **Vocabulary:** Let `Boo : Action -> Type` be the type of "disapproval attitudes".
  *   **Assertion:** To assert "Lying is wrong" is to issue the judgment:
      `Γ ⊢ boo_lying : Boo lying`
      Here, `boo_lying` is not a "proof of truth," but a "token of attitude."
  *   **The Conditional (Frege-Geach):**
      We need to assert: "If lying is wrong, then inducing lying is wrong."
      In DTT, a conditional is a function type. We need to form the type:
      `Boo lying -> Boo inducing_lying`
      And assert a term inhabiting it:
      `Γ ⊢ f : Boo lying -> Boo inducing_lying`

  **The Type-Theoretic Frege-Geach Objection:**
  1.  **The Mismatch:** In the standalone assertion (Premise 1), `Boo lying` is the *target of a judgment* (`⊢ t : T`). In the conditional (Premise 2), `Boo lying` appears as the *domain of a function* (`T -> U`).
  2.  **The Problem:** In standard DTT, these are compatible *only if* `Boo lying` is a well-formed Type in the context. If it is a Type, it is an object. If it is an object, it is truth-apt (it can be inhabited or not).
  3.  **The Expressivist Dilemma:**
      *   If `Boo lying` is just a Judgment (meta-level), you cannot write `Boo lying -> ...`. You cannot put a `⊢` inside a `->`. The conditional is ill-formed.
      *   If `Boo lying` is a Type (object-level) so the conditional type-checks, you have conceded that moral sentences denote Types that can be inhabited. You have effectively admitted they are truth-apt (inhabitation = truth). You have collapsed into Cognitivism.

  **The Quasi-Realist Reply (Blackburn in DTT):**
  Blackburn argues we can have it both ways. We treat `Boo` as Types, but we interpret the *logic* of these types as a logic of consistency among attitudes, not truth.
  *   **Translation:** This looks like defining a specific **Universe** or **Logic** over these attitude types.
  *   **Higher-Order Attitudes:** The conditional `Boo lying -> Boo inducing_lying` is not a truth-functional implication. It is a *higher-order attitude*.
  *   **Term:** `f : Boo lying -> Boo inducing_lying`
  *   **Meaning:** `f` is a term that represents a state of mind where having the attitude `Boo lying` constrains you to have `Boo inducing_lying`. It is a "commitment constraint."
  *   **Reification:** The Quasi-Realist move is to say: "Sure, `Boo P` is a Type, but don't think of `t : Boo P` as 'True'. Think of it as 'Endorsed'."
  *   **DTT Mechanism:** This requires a **Logical Framework** distinction. We are working in a system where `Type` does not imply `Prop`. We are treating `Boo` as data (`Type`) that we reason *about*, but we are simulating the behavior of `Prop` without the ontological baggage of "Truth".

  **Evaluation of Your "Tactic" Hypothesis:**
  > *Maybe the expressivist is saying a moral sentence is a tactic... Frege–Geach is just the observation that you cant put a tactic inside a lambda.*

  *   **Verdict:** **Mostly Right, but "Judgment" is more precise than "Tactic".**
  *   **Why:** A tactic is a script to *find* a term. An expressivist assertion is the *act* of commitment. In DTT, the act of commitment is the Judgment (`Γ ⊢ t : T`). You are correct that you cannot put a Judgment inside a lambda (`λ (h : Γ ⊢ A) ...` is ill-formed).
  *   **Quasi-Realism as Reification:** **Yes.** Your guess is spot on. Quasi-realism is the project of **reifying the Judgment**. It constructs a Type `Boo P` and a term `t : Boo P` such that we can *simulate* the logic of Judgments using the logic of Terms. We quote the commitment so it can be bound.
  *   **The Negation Problem:** **Yes, it is a typing problem.**
      *   Negation in DTT is `A -> Empty`.
      *   If `A` is `Boo Lying`, then `¬ Boo Lying` is `Boo Lying -> Empty`.
      *   *The Issue:* What does it mean to have a function from "Disapproval" to "Absurdity"? It means "Disapproving of lying is an inconsistent attitude."
      *   *The Negation Problem:* Expressivists struggle to distinguish "I don't disapprove" (absence of attitude) from "I disapprove of disapproving" (negation of attitude). In DTT, this is the difference between `¬ (∃ t, t : Boo Lying)` (No term exists) vs `∃ t, t : Boo Lying -> Empty` (A term proving inconsistency exists). If the Expressivist uses the latter to model moral negation, they need to explain what that term *is* psychologically. If they use the former, they can't embed it.

  ---

  ### Residue Report

  Here is what survives the translation, sorted by fidelity.

  #### (a) Translates Cleanly
  1.  **The Embedding Constraint:** The structural problem of Frege-Geach maps perfectly to the **Judgment vs. Term** distinction. The fact that you cannot place a typing judgment (`⊢`) inside a function arrow (`->`) in the object language is exactly the Frege-Geach problem.
  2.  **Validity as Inhabitation:** The notion of logical validity (preservation of "correctness") maps cleanly to **Type Inhabitation**. If premises are inhabited, the conclusion must be inhabited. Expressivists want "Validity" to mean "Consistency of Attitudes," which maps to constructing a term of the conclusion type from terms of the premise types.
  3.  **Quasi-Realism as Reification:** The move to save the theory maps cleanly to **Reflection/Reification**. Taking a meta-level property (assertibility) and creating an object-level type (`Boo`) to represent it so it can be quantified over.

  #### (b) Translates Only If You Distort One Side
  1.  **"Attitude" vs. "Type Inhabitation":**
      *   *Distortion:* **Metaethics.** To make this work in DTT, an "attitude" must be modeled as a Term `t : Boo P`.
      *   *Why:* In DTT, terms are objects. They can be compared for equality, passed to functions, and stored. Expressivists insist attitudes are *states of the agent*, not objects in the world. By making them Terms, we subtly reify the attitude into a cognitive object, edging toward Psychologism (a form of Cognitivism).
  2.  **"Wrongness" vs. "Type Family":**
      *   *Distortion:* **Metaethics.** We define `Boo : Action -> Type`.
      *   *Why:* This implies `Wrongness` has a structure (it takes an Action and returns a Type). Expressivists often want to resist the idea that "Wrong" is a function or property at all. It's a projection. Modeling it as a Type Family forces a predicative structure onto a projective concept.
  3.  **"Consistency" vs. "Logical Negation":**
      *   *Distortion:* **DTT.** We model inconsistency as `A -> Empty`.
      *   *Why:* In DTT, `Empty` is absolute. In Expressivism, "inconsistent attitudes" might be psychologically possible (akrasia) but rationally forbidden. DTT's `Empty` is too strong (uninhabited *ever*) unless we parameterize it by a "Rational Agent" context, which again smuggles in Cognitivism about rationality.

  #### (c) Has No Expression in My Vocabulary At All
  1.  **The "Non-Cognitive" Qualia (The Oomph):**
      *   DTT is purely structural. It captures syntax and inference. It cannot capture the **practical force** of a moral judgment—the fact that it *moves* the agent to act. A term `t : Boo Lying` is just data. It has no causal power in the type theory. Expressivism claims moral judgments are essentially practical. DTT has no primitive for "practicality."
  2.  **Normativity without Truth:**
      *   DTT relies on **Correctness** (well-typedness). Expressivists want **Normativity** (oughtness) that isn't just "correctness relative to a system." They want the system itself to be normative. In DTT, the rules are fixed. In Metaethics, the debate is about whether the rules *bind* you. DTT assumes binding; ME asks *why*.
  3.  **The "Mind-World" Direction of Fit:**
      *   Cognitivism: Mind fits World (Belief). Expressivism: World fits Mind (Desire/Attitude). DTT has no notion of "World." It only has Contexts and Terms. There is no way to encode "Direction of Fit" in the type structure itself.

  ---

  ### Taking a Side

  **The Question:** For the (c) items, is the gap in the framework (DTT is too weak) or is the gap evidence that Expressivism was doing less work than it looked (Formalizability implies Cognitivism)?

  **My Committed Answer:** **The gap is evidence that Expressivism collapses under formalization.**

  Here is the reasoning:
  If you successfully solve the Frege-Geach problem in DTT (i.e., you make moral sentences embeddable, composable, and subject to valid inference), you **must** assign them a Type. Once they have a Type, they have conditions of inhabitation. Once they have conditions of inhabitation, they have truth-conditions (where "truth" = "inhabited").

  The Expressivist wants to say: "It behaves like a proposition, but it isn't one."
  The Type Theorist says: "If it behaves like a proposition (embeds in `->`, supports MP), it *is* a proposition (a Type in a universe)."

  The "Non-Cognitive" residue (the Oomph, the Direction of Fit) is precisely the part that **cannot** participate in logic. As soon as you make it participate in logic (to solve Frege-Geach), you strip it of its non-cognitive nature. Therefore, the Quasi-Realist project, when made rigorous enough to satisfy a logician, is indistinguishable from a Cognitivist theory of **Attitudes** (e.g., "Moral truths are truths about what attitudes are consistent").

  The Expressivist slogan ("Not truth-apt!") is a defensive maneuver that cannot survive contact with the requirement of compositionality. If you can define a logic for it, you have cognitivated it.

  ---

  ### Confidence & Weakest Link

  **Overall Confidence:** **85%**.
  The structural isomorphism between the Frege-Geach problem and the Judgment/Term distinction in Type Theory is robust. This is not an analogy; it is the same formal constraint appearing in two fields.

  **Confidence in Individual Correspondences:**
  *   *Judgment vs. Term:* 95% (This is the core technical insight).
  *   *Quasi-Realism as Reification:* 80% (It fits the structural move, though Blackburn might quibble on the philosophical intent).
  *   *Attitude as Type:* 70% (This is where the smuggling happens, as noted in Residue (b)).

  **The Weakest Link (Where a Metaethicist would attack):**
  **The interpretation of Quasi-Realism as Reification.**
  A dedicated Blackburnian would argue: "You are assuming that to solve Frege-Geach, we must reify attitudes into *objects* (Types). Blackburn's point is that we can define a **logic of attitudes** without reifying the attitudes themselves. We can talk about the *consistency* of `Boo(P)` without `Boo(P)` being a Term in a universe."

  *Why this is a threat:* In DTT, to reason about `Boo(P)`, `Boo(P)` usually needs to be a Type. If Blackburn claims we can reason about it without it being a Type, he is claiming we can do logic *outside* the type system (in the meta-theory). But if the logic is only in the meta-theory, he hasn't solved Frege-Geach (which requires embedding *inside* the language).
  *My Counter:* If he puts the logic inside the language, he reifies. If he keeps it outside, he doesn't solve F-G.
  *Uncertainty:* I am least sure that DTT's `Type` is the only way to model "object of logic." There might be a modal or substructural interpretation I'm glossing over that preserves the "Non-Cognitive" status better than simple Reification. But within standard CIC (Calculus of Inductive Constructions), the collapse seems inevitable.
