  Second-year PL PhD student here. My native language is Coq/Lean: contexts, judgments vs. propositions, terms vs. tactics, inhabitation, definitional equality, universes, the Curry–Howard reading of implication as a function from proofs to proofs. Metaethics I have essentially none of — a couple of blog posts and a Wikipedia skim.

  Pretend you're a philosopher who actually works in metaethics AND actually knows dependent type theory (not the pop-analogy version), and think hard about this rather than pattern-matching the first thing that comes to mind.

  The job: translate expressivism and the Frege–Geach problem into my vocabulary, as literally as you can, and then give me a residue report.

  Before you write any of it up, brainstorm out loud. List candidate correspondences for each moving part — moral sentences express attitudes rather than beliefs, truth-aptness, the unasserted occurrence sitting in the antecedent of a conditional, validity without truth-preservation, the quasi-realist escalation to higher-order attitudes — then delete the ones that are only puns or that just look right, and say why you deleted them.

  Then the translation proper. Take the standard argument, roughly: lying is wrong; if lying is wrong then getting your little brother to lie is wrong; so getting your little brother to lie is wrong. And the objection: on the expressivist account the first premise expresses an attitude when its asserted, but in the antecedent of the conditional it isn't asserted at all, so nothing is being expressed there, and so there's nothing for the conditional to be composed out of. Give me the type-theoretic version. What is the type of the sentence lying is wrong? What could it even mean for an occurrence to be unasserted in a system where everything already has a type and a context? What is the analogue of the function-from-proofs-to-proofs reading of the conditional, and does that help or hurt the expressivist? And how does the quasi-realist reply — Blackburn's, I think, higher-order attitudes toward combinations of attitudes — look from inside my framework?

  Here's my own half-baked guess; tell me whether it's right or a category error. Maybe the expressivist is saying a moral sentence is a tactic, not a term: it only means anything at the top level of a proof script, where it does something to the goal state, and Frege–Geach is just the observation that you cant put a tactic inside a lambda. If that's the right shape, then is the quasi-realist move basically reification — quote the tactic so it becomes a term you can quantify over and put in the scope of a binder? And is the thing people call the negation problem, which I only vaguely follow, then just a typing problem, where the quoted thing and the thing it quotes end up governed by different rules?

  Now the part I actually care about. Residue report, item by item, sorted into: (a) translates cleanly; (b) translates only if you distort one side — say which side and how; (c) has no expression in my vocabulary at all. Be scrupulous about not smuggling: if the only reason something counts as translating is that you quietly imported an expressivist assumption into type theory, or a cognitivist assumption into the metaethics, that is a failure, not a success — flag it as one. I'd rather have five honest entries than twenty flattering ones.

  Then take a side. For the (c) items: is the gap in my framework — say, type theory just has no way to represent a judgment that isn't truth-apt, or to mark the difference between a correctness that is agent-relative and one that isn't — or is the gap evidence that the expressivist slogan was doing less work than it looked, so that once you pin down what expresses-an-attitude has to mean for composition to go through, you've already handed the cognitivist most of what he wanted? I want a committed answer, not a both-sides shrug.

  Last thing: tell me how confident you are, in the overall picture and separately in the individual correspondences, and point at the single place in your answer you're least sure of — the spot where a real metaethicist would most likely say you've just gotten it wrong.
