answer: |-
  ### I. The Retroactivity Decomposition

  Your decomposition is real, not cleverness. Commentary slides between them to inflate or deflate the injustice. You need three distinct requirements to pin them down.

  1.  **Substantive Notice:** The act must have been recognizable as wrongful under some normative framework existing at the time, even if no penalty was specified.
      *   *Case:* The Kellogg-Briand Pact (1928) outlawed aggressive war, but specified no penalties. Nuremberg charged "Crimes Against Peace."
      *   *Workhorse:* This is the weakest objection. The moral wrong was established; the penalty was the innovation.
  2.  **Procedural Fairness:** The rules of evidence, defense, and appeal must not be rigged to guarantee conviction beyond the bias of the victors.
      *   *Case:* Tokyo suppressed exculpatory evidence regarding the Emperor; Nuremberg allowed defense counsel to cross-examine.
      *   *Work:* This distinguishes Nuremberg from a show trial.
  3.  **Jurisdictional Authority:** The body convening the court must have the legitimate power to try the accused.
      *   *Case:* The London Charter was created by the Allies *after* the war to try the losers.
      *   **This is the actual workhorse.** The complaint isn't that war wasn't wrong; it's that the winners had no standing to write the law and judge the losers simultaneously. This is the core of "victors' justice."

  ### II. The Spec: Requirements for Legitimacy

  Sorted by the nature of the demand.

  **Bucket 1: Non-Negotiable (Conceptual Preconditions for Criminal Justice)**
  *   **Requirement 1: Substantive Notice.** The accused must have had access to a norm prohibiting the conduct, even if the penalty was undefined.
      *   *Motivation:* Nuremberg relied on existing treaties (Kellogg-Briand) to establish the wrong, distinguishing it from pure ex post facto invention.
  *   **Requirement 2: Procedural Due Process.** The tribunal must allow defense counsel, cross-examination, and the presentation of exculpatory evidence.
      *   *Motivation:* Nuremberg acquitted three defendants and dismissed charges against organizations; Tokyo did not acquit anyone. The difference turns on procedure, not jurisdiction.
  *   **Requirement 3: The Falsifiability Condition.** Any theory of legitimacy must specify the minimal change in facts that would flip the verdict from legitimate to illegitimate (and vice versa).
      *   *Motivation:* Defenders who say "it was necessary" must state what would have made it unnecessary illegitimate (e.g., if the USSR had been charged?). Critics who say "it was vengeance" must state what would have made it legitimate (e.g., a neutral judge?). If the theory cannot name the switch, it is unfalsifiable sloganeering.

  **Bucket 2: One-Sided Demands (Critics' Purity vs. Defenders' Minimum)**
  *   **Requirement 4 (Critics): Pre-existing Jurisdiction.** The court must be constituted under law existing *before* the conduct occurred.
      *   *Motivation:* The London Charter was ad hoc. Critics argue this violates *nullum crimen sine lege* regarding the court itself, not just the crime.
  *   **Requirement 5 (Defenders): Effective Enforcement.** The tribunal must have the physical power to apprehend and punish the accused.
      *   *Motivation:* A court with perfect impartiality but no army is theoretical. Nuremberg worked because the Allies had custody of the defendants.

  **Bucket 3: Empirical (Turns on the Record, Not Concepts)**
  *   **Requirement 6: Symmetrical Liability.** The prosecuting power must be subject to the same legal standards for comparable conduct.
      *   *Motivation:* Allied firebombing of Dresden/Tokyo was not charged. If the law applies only to the loser, it is command, not justice.
  *   **Requirement 7: Custody Capability.** The tribunal must have actual physical control over the accused.
      *   *Motivation:* The Kaiser was indicted in 1919 but never handed over by the Netherlands. The charge collapsed because enforcement failed, not just because the law was vague.

  ### III. The Incompatibility: The Bootstrapping Trilemma

  You asked if the trilemma is real. It is. You cannot simultaneously demand of a founding tribunal that it be:
  (a) Constituted under pre-existing law,
  (b) Staffed by impartial adjudicators,
  (c) Capable of reaching the worst actors.

  At the founding moment (T=0), the only actors with the power to constitute the court (c) are the winners, who are by definition partial (not b), and the law they write is new (not a).

  **Which leg gives?** Leg (b) **Impartiality** must give.
  If you demand (a) and (b), you get no court (failure of c). If you demand (a) and (c), you get a court of victors (failure of b). Nuremberg chose (a) [mostly, via treaties] and (c), sacrificing (b).

  **Name of Conflict:** **The Founding Paradox.**
  Any account that claims to satisfy all three is lying. A valid theory must explicitly concede which leg is broken and argue why that break is tolerable. Most accounts bury this; yours must name it.

  ### IV. The Case Tests

  **1. The Neutral Hypocrite**
  *Scenario:* A coalition of neutrals constitutes the tribunal, but one member is currently committing the charged act.
  *   **Distinction:** This shifts the defect from **Partisanship** (Bias in outcome) to **Hypocrisy** (Corruption of the rule).
  *   **Verdict on Legitimacy:** Hypocrisy is worse for *systemic* legitimacy; Partisanship is worse for *individual* justice.
      *   Partisanship predicts the verdict (guilty), but the rule might still stand for the next war.
      *   Hypocrisy destroys the rule itself. If the judge is exempt, the law is revealed as a tool of power, not a norm.
  *   **Requirement Tested:** **Symmetrical Liability (Req 6).** If the judge is immune by virtue of being the judge, the law cannot claim universal validity. This is a deeper defect than victors judging losers, because victors can theoretically be judged later; hypocritical judges invalidate the law immediately.

  **2. The Kaiser vs. The Nazis**
  *Scenario:* WWI attempt to arraign the Kaiser failed; Nuremberg succeeded.
  *   **Explanation:** It was not just custody (Req 7), though that mattered. It was **Substantive Notice (Req 1).**
      *   The Kaiser was charged with "offences against international morality." That is not law.
      *   The Nazis were charged with "Crimes Against Peace" grounded in specific treaties (Kellogg-Briand).
  *   **Requirement Tested:** **Substantive Notice.** The Kaiser charge collapsed because it failed the legality test entirely; Nuremberg stuck because it anchored new penalties to old prohibitions. Custody made enforcement possible; Specificity made enforcement legal.

  ### V. Final Constraint Check

  You asked if two requirements genuinely can't both be met.
  **Yes.** **Pre-existing Jurisdiction (Req 4)** and **Effective Enforcement (Req 5)** are incompatible at the founding moment of international criminal law.
  *   If you wait for a pre-existing court (Req 4), you lack the power to catch the architects of the war (Req 5).
  *   If you build a court to catch them (Req 5), it is ad hoc and violates pre-existing jurisdiction (Req 4).
  *   **Name:** **The Founding Paradox** (see Section III).
  *   **Consequence:** Any theory that claims to satisfy both is historically illiterate. You must choose: Legality or Effectiveness. Nuremberg chose Effectiveness.

  Verdict: The Falsifiability Condition
