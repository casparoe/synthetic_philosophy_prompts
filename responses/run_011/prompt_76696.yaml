prompt: |-
  Taking a media ethics seminar and my prof has been ruling on "is this manipulation or just persuasion?" cases all term. Her verdicts so far: the store's 15-minute countdown timer on a price that never actually changes — manipulation. A charity mailer that leads with one named kid's photo but then gives audited figures and a costed plan — legitimate persuasion. A doctor who says "nine out of ten people do fine" instead of "one in ten do badly" about a procedure the patient would want if they thought it through — fine, not manipulation. Candy shelved at a kid's eye level by the register — manipulation. A vlogger who spends twenty minutes on scripted "personal" stories and then pitches a tea, with #ad clearly labelled — manipulation anyway. A slot machine programmed to stop just short of the jackpot way more often than chance would, odds printed right on the glass — manipulation.

  Thursday she's handing down a new one: a uni counselling service pushes a mood-tracking app at students using streaks, unpredictable little rewards, and a "we noticed you skipped your check-in" message. Nobody's told that's what the streaks are for, theres no opt out, and the data does show it cuts crisis presentations.

  Predict her verdict, then tell me which rule she's actually running — and which other rules fit every verdict above just as well but come out differently on this one. Where I'm stuck is that I can build a case for both "covert and works on you" and "but it's for you and you'd endorse it," so say which of those she'd let win and why. Then give me a case I could put to her in section that would settle which rule it is.
