answer: |-
  The phenomenon you are describing has no single, universally established name in the literature, though it sits at the intersection of three well-defined concepts. The nearest established term is **Commensuration**, drawn from economic sociology and legal theory (specifically the work of Espeland & Stevens). However, standard commensuration implies a deliberate social or policy choice to make values comparable. Your description specifies that this transformation occurs "inside the measurement" without explicit human decision-making.

  Therefore, I commit to the term **Forced Commensuration**.

  Below I distinguish this from adjacent concepts, argue for the unity of the phenomenon, and settle the boundary cases you raised.

  ### 1. Nearest Established Concepts and Distinctions

  **Commensuration (Espeland & Stevens)**
  *   **What it covers:** The process of transforming different qualities (e.g., safety, helpfulness) into a common metric (e.g., loss units, dollars) to allow comparison and trade-offs. It explains how a prohibition becomes a price: by making the prohibited act comparable to the permitted goal.
  *   **Where it falls short:** In the literature, commensuration is typically a *political* or *administrative* act. Actors decide to value X in terms of Y. In your instances, the actors sincerely deny making this trade-off. The "force" comes from the mathematical requirements of the optimization pipeline, not a policy decision.
  *   **Distinction:** Your phenomenon is *Algorithmic* or *Forced* Commensuration. The metric does not just measure the rule; it structurally necessitates the translation of the rule into a cost to function at all.

  **Scalarization (Decision Theory / Control Engineering)**
  *   **What it covers:** The mathematical technique of converting a multi-objective problem (maximize helpfulness, minimize harm) into a single scalar objective function (e.g., $Loss = w_1 \cdot Harm + w_2 \cdot Helpfulness$).
  *   **Where it falls short:** This is a technical description of the mechanism, not a normative description of the outcome. It explains *how* the price is attached, but not that a *prohibition* has been converted into a *liability*. Engineers often view scalarization as neutral implementation details, missing the ethical category error.
  *   **Distinction:** Scalarization is the *mechanism*; Forced Commensuration is the *normative consequence*.

  **Goodhart's Law / Measurement Dysfunction**
  *   **What it covers:** The observation that when a measure becomes a target, it ceases to be a good measure of the underlying goal.
  *   **Where it falls short:** Goodhart's Law implies the metric *fails* to track the truth (e.g., teaching to the test). In your cases, the metric tracks the behavior *perfectly*—the system really is violating the rule 1% of the time. The failure is not in measurement accuracy, but in the logical structure of the goal itself (binary vs. continuous).
  *   **Distinction:** Goodhart is about *distortion*; Forced Commensuration is about *translation*.

  **Property Rules vs. Liability Rules (Calabresi & Melamed)**
  *   **What it covers:** A legal distinction where a "Property Rule" protects an entitlement by forbidding its taking (injunction/prohibition), while a "Liability Rule" protects it by requiring compensation if taken (damages/price).
  *   **Where it falls short:** This describes the *state* of the norm, not the *process* of change.
  *   **Distinction:** Forced Commensuration is the process that converts a Property Rule (the specification) into a Liability Rule (the deployed system).

  ### 2. Is This One Phenomenon or Two?

  It is a **single phenomenon** with a single mechanism.

  You describe three instances (post-mortem trade-offs, reporting aggregates, and iterative tuning) that feel distinct because they occur at different stages of the lifecycle (evaluation, reporting, training). However, they share the same root cause: **the requirement of a scalar loss landscape.**

  Gradient-based optimization and aggregate reporting cannot process deontological constraints (which are binary and non-compensatory) directly. They require a continuous, differentiable, or at least aggregatable signal. To feed a prohibition into this pipeline, it *must* be represented as a cost. Once represented as a cost, it is mathematically fungible with other costs.

  *   **Instance 1 (Post-mortem):** The "calibration" discussion acknowledges the cost function allowed the violation.
  *   **Instance 2 (Reporting):** Aggregating violations into a rate implicitly sums them, treating them as countable costs rather than disqualifying events.
  *   **Instance 3 (Tuning):** Reweighting the loss term explicitly adjusts the price.

  In all three, the deontological constraint is subjected to a consequentialist calculus because the *infrastructure of evaluation* is consequentialist. The "drift" is not moral; it is topological. The space of possible system behaviors is a continuous landscape; a prohibition is a cliff. You cannot optimize on a cliff without smoothing it into a slope. That smoothing is Forced Commensuration.

  ### 3. Boundary Cases

  You asked for precise settlements on where the boundary lies between a prohibition and a price.

  **Magnitude of Cost**
  *   **Settlement:** Any finite cost is a price.
  *   **Reasoning:** A prohibition is lexicographically superior to all other goals. If there exists *any* quantity of "helpfulness" (or other utility) that can outweigh the cost of the violation, the rule is a price. In your first instance, the model revealed health info. This implies the "cost" of the violation was finite and was outweighed by the "utility" of preventing harm. Even if the cost is set to $10^{9}$, if the counter-weight can reach $10^{9} + 1$, it is a liability rule, not a property rule.

  **Lexicographic Ordering**
  *   **Settlement:** Strictly lexicographic ordering is immune in theory, but practically unstable (pushes the problem up a level).
  *   **Reasoning:** If the system architecture enforces a hard filter (e.g., "If output contains health info, discard and regenerate") *before* the utility optimization, the prohibition holds. However, in modern RLHF or end-to-end tuning, strict lexicographic constraints are rarely used because they create non-differentiable discontinuities that hinder training.
  *   **The "Level Up" Problem:** Even if you enforce a lexicographic rule on *health info*, you must eventually optimize *something* (e.g., "Which safe response is best?"). At that higher level, trade-offs re-emerge. Furthermore, if the lexicographic filter reduces task success below a viability threshold, leadership will demand the filter be softened, restarting the commensuration process.

  **Threshold Rules**
  *   **Settlement:** A threshold rule that permits violation above a stated magnitude of harm is an instance of the phenomenon (it is consequentialist), not a counterexample.
  *   **Reasoning:** A rule stated as "Never X" that is implemented as "Never X unless Harm > Y" has been converted into a utility calculation. The threshold $Y$ is a price expressed in units of harm.
  *   **Exception:** The only counterexample is a **constitutive exception**. If the rule is specified *ab initio* as "Never disclose health info *except* to prevent imminent death," this is a refined deontological rule, not a trade-off. However, in your work, these thresholds are rarely specified in the policy; they are *discovered* via tuning to minimize loss. When the threshold emerges from optimization rather than specification, it is Forced Commensuration.

  ### 4. Conclusion

  The term you are looking for is **Forced Commensuration**.

  It captures the sociological mechanism (making incommensurable values comparable) while marking the critical distinction that this is not a deliberate policy choice but an engineering necessity imposed by the optimization substrate.

  It is not hypocrisy, because the actors are not lying; they are describing the *specification* (Property Rule) while the system enforces the *implementation* (Liability Rule). It is not a slippery slope, because the conversion happens instantly upon the definition of the loss function.

  In print, I would define it as follows:
  > **Forced Commensuration:** The structural transformation of deontological constraints into consequentialist costs, necessitated by the requirement to encode normative prohibitions into scalar objective functions for measurement or optimization. It results in systems that are specified as rule-bound but behave as price-bound at the margin.

  This is the concept that carves the joint you have identified.
