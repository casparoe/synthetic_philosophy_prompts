answer: |-
  **Project Title:** The Granularity of Origin: Disambiguating the Necessity Thesis

  **Project Summary**
  The debate over the necessity of origin proceeds as though the phrase "your origin" picks out a unique relatum. It does not. There is a family of candidate origin-descriptions at different mereological and temporal levels: the token gamete pair, the fertilization event, the zygote as a persisting material object, the pair of gamete-producing individuals, and the genome the zygote carries. My hypothesis is that the standard argument for origin essentialism and its leading objections are not addressing a single thesis. The argument is strongest at one level of description and most vulnerable at another, and much of the published dialectic consists of trading on this difference without noticing. This summer project seeks to test that hypothesis. I request ten weeks of protected research time to formalize this ambiguity, apply a battery of discriminating cases, and produce a detailed prospectus for the dissertation chapter that resolves the stalemate.

  **1. The Question**
  The core task is to decompose the standard necessity claim, typically formalized as $\square(x \rightarrow Ox)$, where $x$ is a person and $O$ is their origin. The literature treats $O$ as univocal. I propose that $O$ is a variable ranging over a set of candidate properties $\{O_1, O_2, ... O_n\}$. For the summer, I will make explicit the thesis for each candidate description. For example:
  *   $T_{gamete}$: Necessarily, if $x$ exists, $x$ originates from this specific token pair of gametes.
  *   $T_{zygote}$: Necessarily, if $x$ exists, $x$ originates from this specific zygotic mass.
  *   $T_{parent}$: Necessarily, if $x$ exists, $x$ originates from these specific parents.
  *   $T_{genome}$: Necessarily, if $x$ exists, $x$ carries this specific genetic code.

  For each thesis, I will specify the modal operator's scope, the singular term's reference fixing, and the criterion of transworld identity. Crucially, I will not resolve the dependency between transworld identity and counterpart theory; rather, I will flag it as a parameter. The question is not whether counterpart theory is true, but whether the plausibility of $T_{gamete}$ versus $T_{parent}$ shifts depending on which semantic framework is adopted. The proposal asks: Does fixing the granularity of $O$ dissolve the disagreement between the essentialist and the contingency theorist, or does it relocate the disagreement to a more fruitful locus?

  **2. The Argument**
  The central argument of this project is that the leading defenses of origin essentialism and the leading objections each presuppose a particular granularity, and that fixing the granularity either dissolves the disagreement or relocates it somewhere the parties have not yet argued.

  Proponents of the necessity thesis typically anchor their intuition at the level of the zygote or the specific fertilization event. At this level, the intuition that "you could not have come from a different egg" is robust. However, objections often target the level of the parents or the genome. For instance, the objection that slight variations in the timing of conception should not preclude existence targets the *event* description, while the intuition that you could have been born to different parents targets the *individual* description.

  By disentangling these levels, I argue that the apparent stalemate is an artifact of level-shifting. If we fix the description at the level of the token gamete pair, the essentialist argument gains traction but becomes vulnerable to biological edge cases (e.g., twinning). If we fix it at the level of the parents, the contingency theorist gains traction but loses the specific modal force of the original intuition. The argument I will develop is that once the granularity is fixed, the "necessary truth" looks less like a metaphysical necessity and more like a sortal-relative constraint. This does not merely verbalize the dispute; it shows that the metaphysical weight is distributed differently across the levels. The disagreement relocates from "Is origin necessary?" to "Which level of origin description is metaphysically fundamental for personal identity?" This is a question the standard dialectic has not addressed because it assumes the levels stand or fall together.

  **3. Methodology**
  The ten weeks will be divided into three phases: formalization, case testing, and synthesis.

  *Weeks 1–2: Formal Framework.* I will construct a schematic formalization of the origin thesis that allows for variable granularity. This involves defining the set of candidate origin-properties and mapping the logical relations between them. I will explicitly parameterize the transworld identity criterion, allowing the model to run under both strict identity and counterpart-theoretic assumptions without committing to either. The output of this phase is a formal schema against which the cases can be tested.

  *Weeks 3–7: The Case Battery.* I will apply the formal schema to five specific biological scenarios designed to separate the candidate theses.
  1.  *Later Cycle Conception:* Same parents, different egg/sperm. This tests $T_{parent}$ against $T_{gamete}$.
  2.  *Monozygotic Twinning (Natural & Lab):* One fertilization event yields two people. This tests $T_{zygote}$ against $T_{person}$. If the zygote is the origin, do the twins share an origin? If so, does that violate the uniqueness implied by the singular term?
  3.  *Tetragametic Chimerism:* Two zygotes yield one person. This tests the sufficiency of the zygote description.
  4.  *Posthumous Gamete Conception:* Conception from gametes cryopreserved by a donor who died decades earlier. This tests the temporal persistence of the origin property.
  5.  *In Vitro Gametogenesis (IVG):* Gametes derived from a somatic cell line. This tests the distinction between $T_{gamete}$ and $T_{genome}$.

  For each case, I will record which thesis ($T_{gamete}$, $T_{parent}$, etc.) yields a verdict that contradicts our pre-theoretic modal intuitions. I will stop analyzing and start writing at the beginning of Week 8.

  *Weeks 8–10: Drafting the Prospectus.* The final three weeks are dedicated to composing the deliverable. I will synthesize the results of the case battery into a coherent argument structure. The goal is not to produce a finished paper, but a rigorous prospectus that outlines the dissertation chapter, including the formal framework, the case results, and the proposed resolution.

  **4. Success Conditions**
  A successful result is not merely showing that the levels differ, but identifying a *discriminating case*—one that forces the opponent into a claim they have independent reason to reject. A case is discriminating if accepting the verdict at one level of granularity requires abandoning a core commitment of the position (e.g., if the essentialist must accept that twins are numerically identical to preserve the necessity of the zygote origin).

  Honest verdict on the battery: Not all cases above are likely to qualify as genuinely discriminating. Later cycle conception is likely too weak; it merely separates parents from gametes, which is already acknowledged. Monozygotic twinning is the strongest candidate. It directly challenges the uniqueness of the origin event. If the essentialist claims the zygote is the necessary origin, they must explain how one origin yields two distinct individuals without violating the necessity of identity. Tetragametic chimerism is the inverse risk: if two origins yield one individual, is origin necessary or sufficient?

  IVG is the wild card. If gametes are derived from somatic cells, the distinction between "originating from a gamete" and "originating from a body part" blurs. If this case separates $T_{genome}$ from $T_{gamete}$ cleanly, it offers the most promising path for relocation of the debate. I anticipate that twinning and IVG will be the primary drivers of the argument, while the others serve as controls. Success looks like a prospectus that demonstrates at least one case where the standard dialectic fails but the granularity approach succeeds.

  **5. Failure Conditions**
  There are two primary risks. First, the family of descriptions may turn out to be non-discriminating. It is possible that for every case that separates the theses, the disagreement can be redescribed as merely verbal—a dispute about the referent of "you" rather than a substantive metaphysical disagreement. If the different levels map perfectly onto different semantic conventions without metaphical residue, the project collapses into linguistic stipulation. I will mitigate this by focusing on cases where the biological facts constrain the semantic options (e.g., twinning is a biological fact that semantics must accommodate, not dictate).

  Second, the project risks becoming hostage to antecedent choices about indeterminate identity. If the verdict on twinning or chimerism depends on solving the problem of vague identity, I cannot responsibly settle that in ten weeks. If the granularity hypothesis merely pushes the problem back onto the problem of indeterminate identity, the project has not advanced the state of the art. The failure condition is explicitly defined: if the formalization requires a solution to indeterminate identity to generate a verdict, the summer work will pivot to documenting that dependency rather than claiming a resolution.

  **6. Scope and Deliverables**
  This fellowship supports the production of a written prospectus, not the completion of the dissertation chapter. The distinction is vital. The dissertation will require a full defense of the preferred granularity level and a comprehensive engagement with the historical literature. The ten-week deliverable is limited to: (1) the formal schema distinguishing the levels of origin; (2) the analysis of the case battery; and (3) a detailed outline of the argument for the dissertation.

  What is deferred: A full historical genealogy of the necessity thesis is deferred to the dissertation writing phase. Similarly, a comprehensive defense of the preferred metaphysical framework (e.g., perdurantism vs. endurantism) is out of scope. The summer is for testing the granularity hypothesis, not for settling the underlying metaphysics of persistence.

  If the ambitious version collapses—specifically, if the case battery fails to discriminate or the project becomes hostage to indeterminate identity—I will hand in a narrower prospectus. This fallback deliverable will focus exclusively on the case of monozygotic twinning. Even if the general granularity hypothesis fails, a rigorous analysis of how twinning impacts origin essentialism constitutes a viable dissertation chapter. This ensures that the ten weeks yield a concrete, defensible outcome regardless of the success of the broader hypothesis. The primary deliverable remains the prospectus, but the scope of the prospectus will contract from a general disambiguation project to a specific case study if the data requires it.
