      *   *Cosmetic:* The indivisibility of some acts. You can hedge on money, but maybe not on killing. But you *can* hedge on frequency (eat meat once a week).
      *   *Wrecking 1: The "Window" Problem (Intertheoretic Comparison).* In weather, "rain" and "no rain" share a common metric (water falling). In morality, Theory A (Utilitarianism) says "maximize happiness." Theory B (Deontology) says "never lie." How do you compare units of "happiness" against units of "duty"? You can't just add them up. There's no common currency.
