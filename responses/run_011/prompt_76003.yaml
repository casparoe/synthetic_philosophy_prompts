  4.  **Identify the Breaks in the Mapping:**
      *   *Break 1: The Nature of the Uncertainty.* Weather is objective/empirical. Morality might be subjective, relative, or non-factual. If moral statements aren't true/false in the same way weather statements are, probabilities don't apply. (Meta-ethical break).
      *   *Break 2: The "Window".* In weather, we look at clouds (external evidence). In morality, what are we looking at? Dan seems to just assign percentages based on vibes. Where do the 70/30 numbers come from?
      *   *Break 3: The Stakes/Outcomes.* Getting wet is a physical sensation. "Doing wrong" is... what? Guilt? Divine punishment? Harm to others? If the "wrongness" is about harm to a cow, that's empirical. If it's about "sin," that's different.
      *   *Break 4: Action Guidance.* If I'm 90% sure murder is wrong, do I hedge? (i.e., commit 10% of a murder?) No. Some actions are lexical thresholds, not linear scales.
      *   *Break 5: The "Cost" of Hedging.* Carrying an umbrella is low cost. Eating "a bit of meat" might still involve killing a whole animal (indivisibility).

