  Right, so this isn't an academic thing, I've just been chewing on it for ages and got nowhere. My mate Dan read philosophy at uni and he's always going on about how not knowing whether something's wrong is exactly like not knowing whether it's going to rain. His version: you've got a set of moral views you're less than sure of — say 70% confident eating animals is fine, 30% confident it isn't — and you should treat those like odds at the bookies, multiply each view's verdict by how confident you are in it, add it all up, and do whatever comes out best on average. He uses it to defend a bit-of-both life: eat some meat but less, give to some causes but not others, never take a firm line because firm lines are just overconfidence wearing a costume. And he says anyone who won't hedge like that is being irrational in the same way as a bloke who refuses to carry an umbrella because he's 60% sure it'll stay dry.

  Something about that sits wrong with me but I cant get it into words and he's far better at arguing than I am. Could you take the analogy apart properly? I want to know what lines up with what — the forecast, the odds, the umbrella, being caught out in it — and where the mapping snaps. There's got to be a question about what plays the role of looking out of the window, since he never seems to look out of any window. Please seperate the breaks that genuinely wreck his argument from the ones that are only cosmetic, and then tell me straight whether the hedging conclusion survives once the real ones are on the table. If you think there's a better comparison for being unsure about right and wrong, give me that as well.
