  **Product Datasheet: Model TL-1 Thomson Lamp**

  **Overview**
  The Model TL-1 is a high-precision discrete state instrument designed for testing system behaviour over convergent temporal intervals. It executes a supertask schedule, toggling state according to a geometric series terminating at a configured limit point, typically 12:00:00.

  **Technical Specification**
  *   **Input:** 24 VDC, 5A peak.
  *   **Actuation Schedule:** Initial interval 30s, subsequent intervals halved indefinitely.
  *   **Convergence Point:** $t_{limit}$ (Default 12:00:00).
  *   **State Register:** Boolean (0/1) for all $t < t_{limit}$.
  *   **State at $t_{limit}$:** Undefined. Value is not 0, not 1, not both, and not neither. It is mathematically unset.
  *   **Transition Count:** Undefined. The system does not log a final event. Total switch count cannot be returned.

  **Installation**
  Secure unit to optical table. Connect to atomic clock source for microsecond synchronization. Configure $t_{start}$ to ensure series sum equals exactly 60 seconds.

  **Operating Instructions**
  Power on at $t_{start}$. The lamp will toggle ON/OFF at $t_0, t_1, t_2 \dots$. Operators may query state history for any instant strictly before $t_{limit}$. Do not query state at $t_{limit}$. The system provides no output value at the limit point.

  **Troubleshooting**
  *   **Query:** "What is the state at noon?"
      *   **Response:** System returns NULL. Do not interpret as OFF. The history $\forall t < noon$ does not determine the value at $noon$.
  *   **Query:** "How many times did it switch?"
      *   **Response:** Counter undefined. No integer represents the sum of the series.
  *   **Alternative:** For applications requiring a defined limit, purchase Model TL-1D (Dimmer). Output intensity varies continuously; limit exists and is reportable.

  **Safety**
  **WARNING:** Mechanical actuators must achieve infinite frequency as $t \to t_{limit}$. Physical components will experience stresses exceeding material yield strengths prior to convergence. Containment shielding required for debris resulting from actuator disintegration in final intervals.

  **Warranty and Liability**
  Warranty is void if the operator assumes the state at $t_{limit}$ is supervenient on states at $t < t_{limit}$. Manufacturer denies liability for logical inconsistencies arising from assumed continuity of discrete functions.

  **Regulatory Compliance**
  CE and UL certified for all $t \in [t_{start}, t_{limit})$. Compliance testing covers every instant strictly before noon. No compliance statement is issued for $t = t_{limit}$.
