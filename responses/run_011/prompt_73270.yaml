      *   **5. Falsification:**
          *   What kills A's view? If we find a neural "recording" that matches the report second-by-second *and* the subject couldn't have constructed it. (A might resist this, so need to phrase carefully as "would force revision").
          *   What kills B's view? If it's proven conceptually impossible to verify sleep experience independent of report.
