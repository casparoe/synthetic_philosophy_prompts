  4.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Check:* Did I invent evidence? *Correction:* Stick strictly to the Probe-Insertion details provided. I can add "small clarifying stipulations" if flagged. I will flag the definition of "narrative arc" as a stipulation to ensure clarity.
      *   *Check:* Are the claims specific enough? *Correction:* Instead of "Data matters," say "Data regarding the 250ms window constrains theories of narrative generation."
      *   *Check:* Is the tone appropriate? *Correction:* Needs to be formal, precise, philosophical but collaborative.
      *   *Check:* Party A's stance. A is a Malcolmian. A believes "dreaming" is a disposition. A shouldn't concede that dreams *are* experiences. A should concede that the *production* of the report is a psychological event subject to study.
