      *   **Party B (Revisionist/Dennettian):** Dreams *could* be experiences during sleep, or they could be stamped at waking. It's an empirical question. Malcolm didn't prove incoherence, just unfamiliarity.
      *   **Evidence:** The "Probe-Insertion Study."
          *   REM sleepers woken abruptly.
          *   Experimental condition: 250ms window before speech, 12 images + 2 words flashed (too fast for waking awareness).
          *   Result: Subjects report a minutes-long narrative ending with these items. Identification is high (unlike waking controls). 80% place items at the *end* of the dream.
          *   Sham condition (no probe): Normal narratives, chance identification.
          *   Quiet-Window condition (no physiological markers): Full narrative, vivid, but no specifics.
      *   **Deliverable Structure:**
          1.  Preamble (Protocol, concessions).
          2.  Numbered List of Agreed Claims (Must include claims previously denied, definitions of dream/report/recollection/seeming, what the study settles/doesn't settle).
          3.  Table of Residual Disagreements (A's phrasing, B's phrasing, substantive/verbal, crux, predictions).
          4.  The Cruxes (Questions, evidence, predictions, empirical vs. conceptual).
          5.  Falsification (What would change their minds).
          6.  Closing Paragraph (Summary of the dispute).
      *   **Constraints:** No citations, no external literature, stand on positions + stipulated study only. Specific enough to show movement. No straw men.

  2.  **Deconstruct the Evidence & Positions:**
      *   *The Probe Result:* Subjects claim a long dream ending with the probe. The probe happened *after* sleep (in the 250ms wake window).
      *   *Implication for B:* Supports the "stamp at waking" hypothesis. The brain can construct a narrative retrospectively that *feels* like it took time.
      *   *Implication for A:* Supports the idea that the report is constructed at waking. The "time" of the dream is irrelevant to the truth of the report.
      *   *Tension:* B thinks this leaves open the possibility that *other* dreams are experienced during sleep (empirical question). A thinks this confirms that *all* talk of dream time is grammatical confusion (conceptual truth).
      *   *Quiet-Window:* Shows narratives can be generated without the specific physiological correlates usually linked to content. Supports the idea that the report is a production of the waking moment, not necessarily a reading of a stored tape.

  3.  **Drafting - Section by Section:**

      *   **1. Preamble:**
          *   Need to establish the rules of engagement.
          *   Concessions: A must concede that empirical data *can* bear on the psychology of reporting. B must concede that the *grammar* of "dreaming" constrains how we interpret that data (i.e., we can't just ignore the first-person authority entirely).
          *   Protocol: The Probe-Insertion Study is the arbiter for the "temporal extension" question.

      *   **2. Agreed Claims:**
          *   Need 3 claims previously denied.
          *   *Claim 1 (A's concession):* Empirical data constrains theories of dream generation. (A used to say only grammar matters).
          *   *Claim 2 (B's concession):* The "duration" reported in a dream is not identical to clock time during sleep. (B used to treat them as potentially identical).
          *   *Claim 3 (Joint):* The Probe Study shows narrative construction can happen in <250ms.
          *   *Definitions:* Distinguish Dream (the phenomenon), Report (the speech), Recollection (the memory), Seeming (the phenomenology).
          *   *Study Scope:* Settles that *some* reports are constructed at waking. Does not settle if *all* are.

      *   **3. Table of Disagreements:**
          *   Need specific phrasing for A and B.
          *   *Row 1 (Verbal):* "Did the dream happen at 3 AM?" A: No, that's nonsense. B: Yes, potentially. Resolution: Ambiguity in "happen."
          *   *Row 2 (Substantive):* The nature of the "experience." A: Experience requires waking criteria. B: Experience is a neural process that can occur in sleep.
          *   *Row 3 (Substantive):* Authority of the subject. A: Subject is authoritative on *having* dreamt, not on *when*. B: Subject is fallible on both.

      *   **4. The Cruxes:**
          *   Need questions where positions could move.
          *   *Crux 1 (Experience):* Is "experience" univocal? A says no (dream experience != waking experience). B says yes (same neural kind).
