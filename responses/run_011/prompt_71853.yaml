answer: |-
  Hey there, this is a tight package and it reads like you have a clear handle on the literature, but there are some friction points that your reading group will definitely poke at. I have audited the six commitments for consistency, and while the philosophical stance is coherent, the probabilistic mechanics clash in a few places that need smoothing before you circulate this.

  The most severe tension lies between your specific application of van Fraassen in commitment three and your general principle about selection effects in commitment five. In the Judy Benjamin case, the van Fraassen rule works by stipulating that the probability of the antecedent, the red half, remains fixed at one half while the conditional probability shifts. However, commitment five states that no part of the credence function should be insulated from evidence by stipulation and that selection procedures usually carry information. In the standard Judy Benjamin setup, the fact that the informant spoke about the red half rather than the blue half is precisely the kind of selection effect that should, by your own lights in commitment five, alter the marginal probability of red. You cannot consistently hold that selection effects must be registered while simultaneously applying a rule that fixes the marginal probability by stipulation. To resolve this, commitment three needs to be qualified. You should replace the categorical endorsement of the van Fraassen outcome with a conditional one that holds only when the selection procedure is known to be uninformative regarding the antecedent. This preserves your non-cognitivist updating strategy without violating your evidence principle.

  A second significant tension exists between commitment three and commitment four. You claim to be a minimal-revision person who Jeffrey conditionalizes on whatever partition the information speaks to, yet the van Fraassen rule is not a case of Jeffrey conditionalization. Jeffrey conditionalization requires new probabilities for a partition of cells, whereas the Judy Benjamin input provides a constraint on a conditional probability without fixing the partition marginals. By calling yourself a Jeffrey conditionalizer in commitment four while endorsing a non-Jeffrey rule in commitment three, you are inviting a technical objection about formal consistency. Commitment four needs to be broadened here. You should replace the specific reference to Jeffrey conditionalization with a general principle of minimizing information gain or informational distance subject to the constraints imposed by the evidence. This broader principle encompasses Jeffrey conditionalization for propositional evidence and van Fraassen-style updating for conditional constraints, removing the apparent contradiction between your general method and your specific case handling.

  The third tension, though less severe, is between commitment four and commitment two. If conditionals lack truth conditions and are not propositions as you state in commitment two, then strictly speaking there is no proposition to form a partition for Jeffrey conditionalization in commitment four when the evidence is a conditional. This is related to the previous point but touches on the ontological status of the evidence rather than the updating formula. If you broaden commitment four as suggested above to focus on constraints rather than partitions, this tension dissolves automatically, since constraints can be imposed by non-propositional inputs without requiring them to be members of a partition.

  If you make only one change to clean up the most mess, it should be to revise commitment four. Replace the insistence on Jeffrey conditionalization with a commitment to minimizing informational distance subject to all evidential constraints. This single revision resolves the technical conflict between Jeffrey and van Fraassen rules, accommodates your non-cognitivism about conditionals by allowing non-propositional constraints, and creates the necessary flexibility to honor commitment five. Once updating is defined by constraints rather than a rigid partition rule, you can naturally incorporate selection effects as additional constraints in the Judy Benjamin case, which forces the qualification of commitment three without making it look like an ad hoc exception. This shifts your view from a mix of specific rules to a unified constraint-based framework that holds together much better under scrutiny.

  Hope this helps you tighten the draft before you send it out.

  Best
