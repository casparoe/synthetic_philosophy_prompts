  # PERSISTENCE SORTING INSTRUMENT

  **Start:** We agree the lectern here today is the very lectern from the first week.

  **Q1 (Case d):** Regarding the bronze figure and the reassembled atoms: Is there a definite fact about which one is the original?
  *   (A) No, there is no sharp fact of the matter. → **Leaf 7**
  *   (B) Yes, there is a definite fact. → **Go to Q2**
  *   (C) It depends on how we define "original". → **Go to Q2**

  **Q2 (Case e):** Consider two descriptions: (1) "One thing lasts the whole course," (2) "A chain of temporary things links the weeks." Do these disagree on what exists?
  *   (A) No, they are different ways of saying the same thing. → **Leaf 6**
  *   (B) Yes, only one description is truly correct. → **Go to Q3**

  **Q3 (Case a):** Is a poker straight-then-bent structurally like a poker straight-top-bent-bottom?
  *   (A) Yes, time and space work the same way here. → **Go to Q4**
  *   (B) No, the whole poker changes over time. → **Go to Q6**
  *   (C) The poker is wholly present, but in multiple places at once. → **Go to Q6**

  **Q4 (Case b):** If the universe froze for an instant, would the spinning sphere still be spinning?
  *   (A) Yes, velocity is real at the instant. → **Go to Q5**
  *   (B) No, motion requires more than an instant. → **Go to Q5**

  **Q5:** When we say "the lectern persists," do we name the momentary slice here now, or the long thing stretching across time?
  *   (A) We name the momentary slice here now. → **Leaf 5**
  *   (B) We name the long thing stretching across time. → **Leaf 4**

  **Q6:** Can one object be exactly located in two disconnected places at the same time?
  *   (A) Yes. → **Leaf 2**
  *   (B) No. → **Go to Q7**

  **Q7 (Case c):** At the handshake, are there one person or two people in the room?
  *   (A) Two people. → **Go to Q8**
  *   (B) One person. → **Go to Q8**

  **Q8:** If an object is destroyed and later recreated exactly, is it the very same thing?
  *   (A) Yes. → **Leaf 3**
  *   (B) No. → **Leaf 1**

