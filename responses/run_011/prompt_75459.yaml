  1. **Causal Mechanism:** The theory must specify an internal engine driving the transition between phases, such as Ibn Khaldun's *asabiyyah* depletion, rather than merely asserting a morphological similarity across cases; this is non-negotiable for distinguishing causal theory from the aesthetic preferences of organicist metaphor-makers like Spengler.
  2. **Independent Identification:** The units of analysis, such as a civilization or regime, must be identifiable independently of the periodization the theory itself proposes to avoid circular reasoning; this is non-negotiable methodological rigor rather than a preference particular to positivist historians.
  3. **Accumulation Compatibility:** The scheme must explain how material capabilities and technical knowledge persist across cycles rather than resetting, addressing the empirical fact that modern societies do not return to stone-age conditions after a political collapse; this is non-negotiable and does more work than the others in excluding organicist schemes that treat cultures as biological organisms.
  4. **Agency Preservation:** The model must remain compatible with the fact that the agents in the story are people who could have acted otherwise, ensuring the cycle describes probabilistic tendencies rather than deterministic laws; this is non-negotiable for any history that claims to be about human action rather than natural science.
  5. **Ex-Ante Actionability:** The theory must offer predictive leverage sufficient for a planning body to act in advance, rather than merely making the past intelligible after the fact. While exact timing is a preference of cliodynamic positivists, this utility standard is non-negotiable for you, though it creates a tension with the previous requirement since agents who learn the theory may alter their behavior to break the predicted cycle.
