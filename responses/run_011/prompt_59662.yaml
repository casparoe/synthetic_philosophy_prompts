answer: |-
  Here are ten questions built for the show. I've ordered them to start with your concrete example (the Dave story) and then tighten the screw on the theory behind it. I've marked two at the end you can drop if the chat runs long, and I've flagged one where he might claim you're stacking the deck.

  **1. The Dave Example**
  **You:** "Let's start with my mate Dave. He pulls out of my birthday every year saying he's 'not feeling great'. First time, that's a reason to be kind. Sixth time, it's a reason to be proper cross. The words don't change, but the moral weight flips. Is that the sort of thing you mean when you say reasons depend on the case?"
  **(a) His likely answer:** "Exactly. That's the holism of reasons. A feature like 'he said he's ill' can be a reason for sympathy in one context, and irrelevant or even a reason for suspicion in another, depending on the history."
  **(b) Your follow-up:** "Right, but everyone knows context matters. Where's the philosophy in that? Isn't that just common sense dressed up?"

  **2. The Re-Description Retreat**
  **You:** "I can hear the objection already, though. You'd say in year six, it isn't the *same* feature any more. It's 'he said he's ill *again*'. So you've quietly changed the description to make it fit. Can you keep re-describing the situation forever to save the theory?"
  **(a) His likely answer:** "It's not a trick. Moral relevance is sensitive to the whole shape of the situation. 'Illness' and 'Repeated Illness' are different features with different moral valences. We aren't forcing it; we're being precise."
  **(b) Your follow-up:** "But if you have to add a new description every time the verdict changes, haven't you just pushed the principle back a step? You're saying 'Always sympathise with first-time illness, but not sixth-time'. That's still a rule."

  **3. The Machinery (Enablers)**
  **You:** "Let's talk about the machinery then. You've got these things—enablers, disablers—that switch reasons on and off. Like a light switch. But who's flipping the switch? Is there a rule for when the switch gets flipped?"
  **(a) His likely answer:** "There aren't rules for the enablers themselves. They are conditions that allow a consideration to count as a reason, but they don't operate by principle. They just obtain in the world."
  **(b) Your follow-up:** "So the switch flips without a reason? It just happens? That sounds like magic, not morality."

  **4. Principles with Extra Steps**
  **You:** "Here's my worry on that. If I can list all the conditions that flip the switch, haven't I just written a really complicated principle? Is particularism just generalism with extra steps?"
  **(a) His likely answer:** "No, because the list of conditions isn't codifiable. It's open-ended. You can't write a finite list of all the things that might enable or disable a reason. That's why it's not a principle."
  **(b) Your follow-up:** "But if you can't write it down, how do you know it's there? Are we just guessing when the switch is on?"

  **5. Supervenience (The Systematic Link)**
  **You:** "People say moral stuff has to hang off non-moral stuff in a systematic way. If two cases are identical in the facts, they must be identical in the morality. Does your view break that link?"
  **(a) His likely answer:** "It doesn't break supervenience. The moral still depends on the non-moral. It just denies that this dependence can be captured by exceptionless principles. The pattern is there, but it's too complex for rules."
  **(b) Your follow-up:** "If the pattern is too complex for rules, what's the difference between saying 'there is a pattern' and saying 'there is no pattern'?"

  **6. What's Left of 'Principled'?** **[FLAG: Potentially Question-Begging]**
  **You:** "So if the principles are too wide to say anything useful, what's actually left of the idea that morality is principled? Are you keeping the word just to keep the peace?"
  **(a) His likely answer:** "We're keeping the idea that morality is rational and discussable. We're just denying that rationality requires exceptionless codes. You can be principled without being a generalist."
  **(b) Your follow-up:** "But if I can't appeal to a principle to settle a dispute, what does 'rational' mean in your book? Isn't it just 'what I see clearly'?"
  *(Note: He may accuse you of assuming 'principled' must mean 'exceptionless rules' here.)*

  **7. The Empty or False Dilemma**
  **You:** "I'm going to put it bluntly. If your notion of a principle is thin enough to survive these exceptions, isn't it empty? And if it's thick enough to mean something, isn't your view just false?"
  **(a) His likely answer:** "That's a false dilemma. A principle can be substantive without being exceptionless. We offer defeasible generalisations that guide us without binding us absolutely."
  **(b) Your follow-up:** "But if it doesn't bind you, what happens when I really need it to? What when the generalisation says 'help' but the case says 'walk away'?"

  **8. Teaching and Learning**
  **You:** "Think about teaching a kid. I tell my son 'don't hit'. You're saying 'don't hit, unless...'. How does a beginner learn morality if there's nothing solid to learn? Do they just have to wait until they 'see' it?"
  **(a) His likely answer:** "They learn by example and practice, like learning a language. You don't learn grammar rules first; you learn to speak by being corrected. Moral perception is a skill, not a textbook."
  **(b) Your follow-up:** "But I can teach a kid a rule today. Teaching them a 'skill' takes years. Isn't your way leaving them unprotected while they learn?"

  **9. Disagreement and Blame** **[CUT IF NEEDED]**
  **You:** "If two of us look at the same case and see different reasons, what settles it? If there's no principle to appeal to, does blame just become 'I'm right, you're wrong'?"
  **(a) His likely answer:** "We argue by drawing attention to features we think matter. We try to bring the other person to see the case differently. It's not about applying a rule, it's about sharing a vision."
  **(b) Your follow-up:** "And if I still don't see it? Do you just say I'm morally blind? Where's the grip for argument there?"

  **10. Epistemic Reasons and Silencing** **[CUT IF NEEDED]**
  **You:** "Last one. Does this apply to reasons for *believing* things, not just doing them? And do you go so far as to say a temptation can be silenced—doesn't even show up as a reason—rather than just outweighed?"
  **(a) His likely answer:** "Yes, holism applies to epistemic reasons too. And yes, in some cases, a consideration is silenced entirely. It doesn't weigh anything; it's morally null."
  **(b) Your follow-up:** "If a reason can be nullified completely, how do I know I'm not just ignoring the stuff I don't like? Who checks the silencer?"

  ***

  **Notes for the host:**

  *   **Cutting:** If you're running over time, drop **9** and **10**. They are extensions of the core theory. The show will still work perfectly if you end on the teaching question (8), as that lands closest to your listeners' lives.
  *   **Flagging:** Be careful with **6**. He might stop you to say you're defining 'principled' as 'exceptionless' on purpose to make him look bad. If he pushes back, concede the point: "Fair enough, define it your way, but tell me what work it does then."
  *   **Tone:** Keep the follow-ups quick. Don't let him drift into jargon. If he says "defeasible generalisations", jump in with "So, rules that can break?"
