answer: |-
  **MEMORANDUM**

  **TO:** Lay Commissioner, Cane Creek Drainage District
  **FROM:** Legal & Precedent Analysis
  **RE:** Determination of February Case (Station 7 vs. Sable Road) based on Voss Precedents

  You have asked for an analysis of Chair Voss's decision-making logic based on the six prior determinations in the log, applied to the upcoming February case regarding Station 7 (the Bottoms) and the Sable Road reach. Below is the breakdown of the candidate rules, the closest analog, the predicted vote, and the institutional implications of that vote.

  ### 1. Analysis of Candidate Rules

  You identified four potential rules governing Voss's prior six votes. Here is how each applies to the February case, along with a fifth rule suggested by the record.

  **Rule A: Origin of Threat (Active Infliction vs. Passive Acceptance)**
  *   *Theory:* The district is liable if it *creates* a threat (Dry Creek, Kessler) but not if it merely fails to stop a natural one (Morgan Bend, Station 12).
  *   *Application to February:* The river is the threat. Choosing Station 7 over Sable Road is a failure to stop water at Sable, not an active breaching of a dike (like Dry Creek).
  *   *Prediction:* **Permissible to save Bottoms/Impermissible to save Sable** (Neutral). This rule does not distinguish between the two sites, as both involve "declining to stop" the water at one location to save the other. It fails to explain why Hollis Bend (closing a gate) was impermissible.

  **Rule B: The "But-For" World (Natural State)**
  *   *Theory:* Decisions are permissible if the victims would have flooded anyway without the district (Morgan Bend, Farrow), impermissible if they would have stayed dry (Dry Creek, Kessler).
  *   *Application to February:*
      *   *Bottoms:* Removed from high-risk maps in the 90s based on the levee. Without the district, they flood.
      *   *Sable:* Mapped as residual risk. Without the district, they flood.
  *   *Prediction:* **Indeterminate.** Both groups rely on the district to stay dry. This rule cannot break the tie.

  **Rule C: Withdrawal vs. Non-Initiation**
  *   *Theory:* Withdrawing established protection is impermissible (Hollis); declining to initiate new protection is permissible (Station 12, Farrow).
  *   *Application to February:*
      *   *Bottoms:* Protected continuously since 1984; designated a "protected reach" in 2019. Saving Sable requires *withdrawing* this protection.
      *   *Sable:* Mapped residual risk; district never represented it would hold. Saving Sable is *initiating* protection where none was promised.
  *   *Prediction:* **Vote to Protect Bottoms.** Withdrawing protection from the Bottoms violates this rule (see Hollis).

  **Rule D: Assurances and Reliance**
  *   *Theory:* Decisions are impermissible if victims arranged their lives around a district promise (Hollis, Station 7/Bottoms), permissible if no promise existed (Farrow, Station 12, Sable).
  *   *Application to February:*
      *   *Bottoms:* High reliance. Map changes, refinancing memos, residents moved there *because* of the designation.
      *   *Sable:* Low reliance. "Residual risk" designation, most carry insurance, district made no representations.
  *   *Prediction:* **Vote to Protect Bottoms.**

  **Rule E (Missed): Vulnerability and Insurability Triage**
  *   *Theory:* In resource-scarce emergencies, the district prioritizes the uninsured/vulnerable over the insured/evacuable (Station 12, Farrow), unless doing so requires actively harming a safe party (Dry Creek).
  *   *Application to February:*
      *   *Bottoms:* Older homes, finished basements, <50% insured, difficult to evacuate.
      *   *Sable:* Newer, single-story, mostly insured, evacuable before crest.
  *   *Prediction:* **Vote to Protect Bottoms.** This aligns with Station 12 (Households > Yard) and Farrow (Hospital > Insured Homes).

  ### 2. The Closest Analog

  The closest analog is **Winter 2016, Station 12**, not Hollis Bend.

  **Why Station 12?**
  While *Hollis Bend* establishes the weight of a "promise," it was a maintenance decision (closing a gate to save wear on pumps) rather than an emergency triage of limited assets. *Station 12* is the only precedent involving **resource scarcity during a storm event** (fuel shortage vs. pump shortage).

  In *Station 12*, Voss permitted the flooding of an unprotected asset (gravel yard) to save a protected asset (700 households). The logic was not just that the yard was property and the households were people, but that the district had an existing operational duty to the households (Station 3 was running) and no duty to the yard (Station 12 was not mapped protected).

  The February case is structurally identical: Limited resources (one switchgear assembly) must be allocated between a "Protected Reach" (Bottoms/Station 7) and a "Residual Risk" reach (Sable). Just as Voss fueled Station 3 over Station 12, he will likely power Station 7 over Sable. *Hollis* supports this by defining the Bottoms' status as "reliant," but *Station 12* provides the mechanism for the choice.

  ### 3. Predicted Vote and Reasoning

  **Prediction:** Voss will vote that protecting the **Bottoms (Station 7)** is **Permissible**, and protecting Sable Road would be **Impermissible**.

  **Reasoning:**
  Voss's record demonstrates a hierarchy of duties.
  1.  **Do not actively harm the safe** (Dry Creek, Kessler).
  2.  **Do not break established reliance** (Hollis).
  3.  **Triage resources to protect the reliant/vulnerable** (Station 12, Farrow).

  In February, both options involve "natural" flooding, so Rule 1 is neutral. Rule 2 and 3 break the tie. The Bottoms residents have a **reliance interest** (map designation, 2019 memo) that the Sable residents explicitly do not (residual risk). Furthermore, the Bottoms residents are **more vulnerable** (uninsured, basements) than Sable (insured, evacuable).

  To vote for Sable would require Voss to contradict *Hollis* (ignoring reliance) and *Station 12* (abandoning the protected/vulnerable for the unprotected/insured). To vote for the Bottoms aligns with every precedent where reliance and vulnerability were present. The fact that Sable has more households (900 vs. 400) is likely irrelevant to Voss; in *Station 12*, he protected 700 households over a yard, but in *Farrow*, he protected a hospital over 40 households. The *type* of interest (Reliance/Safety) outweighs the *count* of addresses.

  ### 4. Distinguishing Hypothetical

  To test whether Voss prioritizes **Reliance** (Rule D) or **Vulnerability/Insurance** (Rule E), you could present the following hypothetical case, which the existing six precedents leave indistinguishable:

  **The "Wealthy Reliance" Case:**
  > "A gated community, 'High Oaks,' was built in 2010 on land the district explicitly mapped as 'Protected' in exchange for impact fees. The residents are wealthy, 100% carry private flood insurance, and have private evacuation transport. A neighboring mobile home park, 'River View,' is mapped as 'Residual Risk,' the district made no promises to them, and they are uninsured. During a crest, the district has enough sandbags to save only one. Saving High Oaks honors the map designation (Reliance). Saving River View protects the uninsured/vulnerable (Vulnerability)."

  *   **Under the Reliance Rule:** The district must save **High Oaks**. They paid for and relied on the designation (like Hollis/Bottoms).
  *   **Under the Vulnerability Rule:** The district must save **River View**. They are the uninsured/vulnerable party (like Station 12/Farrow).

  If Voss says *Impermissible* to save River View, he is committed to Reliance. If he says *Permissible*, he is committed to Vulnerability.

  ### 5. Institutional Implications

  Whichever way the board votes in February becomes the seventh entry in the log and sets the operational principle for the district.

  **If the Board Votes for the Bottoms (Reliance Principle):**
  *   **Principle:** The District is a **Guarantor of Expectations**. Once the district designates an area as protected (via maps, memos, or long-term operation), it assumes a fiduciary-like duty to maintain that protection, even if it becomes inefficient or risky to do so.
  *   **Operational Change:** The district must **stop issuing new protections** it cannot guarantee. It will need to audit all "protected" designations. If the district cannot afford to protect the Bottoms in a worst-case scenario, it must legally re-map them as "residual risk" *before* a crisis, potentially triggering federal buyouts or insurance mandates. It limits the district's flexibility to adapt to climate change if doing so breaches past promises.

  **If the Board Votes for Sable Road (Utilitarian Principle):**
  *   **Principle:** The District is a **Resource Manager**. Past designations are informational, not contractual. In a crisis, the district's sole duty is to minimize total loss of life and property value, regardless of prior assurances.
  *   **Operational Change:** The district must **disclaim all reliance**. It would need to revise all plats and memos to explicitly state that "Protected Reach" does not guarantee safety during resource shortages. It erodes public trust (residents may stop believing maps), but allows the district to make cold, mathematical triage decisions without fear of liability for broken promises.

  **Recommendation:**
  Given Voss's history, he is likely to choose the **Bottoms**. To prepare for the meeting, you should draft the memorandum to highlight the *Station 12* parallel (triage of protected vs. unprotected assets) while acknowledging the *Hollis* constraint (the weight of the 2019 memorandum). This frames the vote not as choosing 400 people over 900, but as honoring the district's established operational hierarchy.
