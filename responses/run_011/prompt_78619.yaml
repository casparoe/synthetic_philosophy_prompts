      *   **The Thesis:** First-person authority over occurrent attitudes (judgments, decisions, etc.) is interpretive, based *only* on sensory-format inputs (inner speech, imagery, interoception, behavior, context) + self-theory. No direct, non-sensory access (no inner sense, no acquaintance). Confabulation is default. Immediacy is an artifact.
