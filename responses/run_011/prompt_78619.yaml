      *   **Predictions vs. Rivals:**
          *   *ISA Prediction:* Disrupt sensory channel -> disrupt self-knowledge.
          *   *Inner Sense Prediction:* Disrupt sensory channel -> self-knowledge intact.
          *   *Constitutivist Prediction:* Self-knowledge isn't empirical truth-tracking.
      *   **The Unfalsifiability Charge:**
