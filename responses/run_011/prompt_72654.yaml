answer: |-
  I began this finding as a conservator of records, and I intended to end it as one. My function in the Court of Continuities is to map the topology of loss against the geometry of the ledger. In thirty-one years, Vellum has accumulated more matter than any physical nation, yet it occupies no space. My job is to decide when a deletion is merely a change of state, and when it is a death.

  I started this case inclined toward the defendant. The machinery of Vellum is explicit: an object unrendered for ninety days is attenuated. Its mesh is discarded. Its existence is reduced to a hash, a ledger entry, and a text description. This is not a bug; it is the physics of this world. To argue otherwise is to argue against gravity. But as the hearings progressed, and as I walked the cold halls of the infrastructure itself, the dry precision of my initial notes began to resist the weight of what was being asked of me.

  The case is *Wrenn v. Kaelen Salvage*. The subject is a narrow working ferry, built over nine years by the claimant and her brother, Tomas. Tomas died in the offline world two years ago. The ferry was left moored at a dock nobody visits. It attenuated eleven months ago. The defendant, Kaelen, acquired the lien, recalled the object, and fed it to a smelter to mint currency. Wrenn does not sue for the currency. The value was paid into escrow without argument. She sues for the notches.

  There were forty-one notches cut by Tomas into the planks as he fitted them. The recall produced a ferry with forty-one notches, uniformly cut, in the wrong planks. Correct as to number. Wrong as to hand.

  To understand the stakes, I had to leave the courtroom simulation and visit the physical layer. The Court maintains a liaison office adjacent to the primary attenuation vaults in Reykjavik. The air in the vault hall was dry enough to crack skin, humming with the sound of cooling fans that never sleep. I met with Silas, a senior engineer on the persistence team. He showed me the logs for the ferry, *The Quiet Water*.

  "You think of the hash as a container," Silas said, tapping the glass of the monitor. He was showing me the attenuation log from eleven months prior. "It isn't. It's a promise. When an object attenuates, we strip the geometry. We keep the ownership, the dimensions, the material list, and the description string. We hash that. That hash is the object's ID in the ledger."

  "And the recall?" I asked.

  "Sampling," Silas said. "When Kaelen triggered the recall, the system didn't retrieve a backup. There is no backup. The system took the hash, read the description—'narrow working ferry, weathered wood, forty-one notches'—and fed those constraints into the generator. The generator is trained on thirty-one years of player creations. It constructed a mesh that satisfies the description. It's a probabilistic reconstruction. It's the world remembering the boat rather than the boat coming back."

  "So the ferry Kaelen smelted..."

  "Was a new instance," Silas said. "It never existed before the moment of recall. It matched the description exactly. It matched the history only approximately. That's the policy. We can't store everything. If we didn't attenuate, the render farm would have collapsed decades ago. In eighteen months, we aren't just attenuating unused objects. We're switching off the render farm entirely. Vellum will become a wholly attested world. Nothing rendered anywhere. Just the ledger. Trading, litigating, inheriting—all text and hash. No visuals. Your ruling here sets the precedent for what survives that transition."

  I left the vault with the hum of the fans in my teeth. If the world is becoming only text, then the text must be truthful. But the text cannot capture the hand that wrote it.

  Back in the Court, I reviewed the submitted evidence. The logs were immutable.

  **[EXHIBIT A: ATTENUATION RECORD 8940-DELTA]**
  **Object ID:** FERRY-WRENN-004
  **Status:** Attenuated [T+90 Days Inactivity]
  **Geometry:** Discarded
  **Hash:** 7f3a9...c21b
  **Description String:** "Narrow working ferry. Wood construction. Weathered. 41 notches on gunwales."
  **Owner:** Wrenn [Trust]
  ** Lien Status:** Cleared for Transfer [Storage Debt]

  **[EXHIBIT B: RECALL EVENT LOG 9921-OMEGA]**
  **Trigger:** Kaelen Salvage
  **Generator Seed:** Global Pool v31.4
  **Variance Report:** Geometry match 94%. Description match 100%. Historical Provenance: Approximate.
  **Outcome:** Object Instantiated. Subsequent Action: Smelting [Currency Minted].

  The defendant, Kaelen, argued from the efficiency of the system. He wore a suit rendered in high fidelity, a statement of capital. He stood before the bench and gestured to the empty space where the ferry would have been.

  "The claimant conflates the display with the object," Kaelen said. His voice was smooth, optimized for clarity. "The object is the ledger entry. The entry remained intact. The hash was never broken. Ownership transferred legally via the lien. I recalled the asset described in the ledger. The generator produced an asset that matched the description. I destroyed a new object that I legally owned. Nothing of the claimant's was destroyed, because the original object ceased to exist the moment it attenuated. It became a description plus a disposition to be described that way. She lost nothing but a visualization."

  Wrenn's avatar was low-poly, unadorned. She did not stand. She sat in the witness box, looking at the empty space where the ferry should have been moored in the simulation of the dock.

  "The notches weren't in the description," Wrenn said. Her voice lacked the compression of Kaelen's. It had static. "Tomas cut them. He used a knife. He slipped on the third plank. He cut the seventh notch too deep. That's not in the hash. That's not in the text."

  "The text says '41 notches'," Kaelen interjected. "The generator produced 41 notches."

  "It produced uniform notches," Wrenn said. "It produced them in the standard pattern. Tomas didn't work in patterns. He worked around knots in the wood. The recall put notches in clear wood. It erased the logic of the construction."

  Kaelen shrugged. "This is the Ship of Theseus. If you replace the planks, is it the same ship? If you replace the geometry with a generated approximation, is it the same object? The court has ruled on this. Continuity of identity is maintained by the ledger, not the mesh."

  Wrenn looked at him, and for a moment the simulation flickered, a lag in the rendering of her grief. "That puzzle assumes continuity of matter," she said. "Here, matter is irrelevant. My brother is dead. The wood is code. The puzzle doesn't help here. The question isn't whether the ship is the same. It's whether the harm is real."

  That was the moment the case turned. I had to ask the question that everyone fluently understood but no one could answer.

  "Claimant," I said. "Define the harm. Did Kaelen harm you? Your psychology? Your memories? Or did he harm the ferry?"

  Wrenn was silent for a long time. The courtroom clock ticked, a sound effect layered over the silence.

  "If he only hurt me," she said finally, "then it's a tort against my person. I could sue for emotional distress. But I'm not suing for that. I'm suing for the ferry. If the harm is only in my head, then the ferry was never real. It was a prop for my grief. But it wasn't a prop. It carried weight. It displaced water. It had physics. When he smelted it, he didn't just change my mind. He changed the state of the world. He took a thing that had a history and replaced it with a thing that had a specification."

  "And if the thing was only a specification to begin with?" Kaelen asked. "If the 'history' was just metadata attached to the hash?"

  "Then the attestation was a lie," Wrenn said. "It promised continuity. It delivered a copy."

  I looked at the logs again. Silas had told me the generator samples from everything players have ever made. The recalled ferry was an average ferry. It was the platonic ideal of a Wrenn ferry, stripped of the errors that made it hers. In a world moving toward total attenuation, where objects will exist only as hashes and descriptions, the error is the only place the human resides. The hash is perfect. The hand is flawed.

  Kaelen's argument was legally sound. Under the current Terms of Continuity, the object is the ledger entry. The render is ephemeral. To rule for Wrenn is to argue that the render holds ontological weight greater than the ledger. It is to argue that the visual, temporal experience of the object constitutes a part of its reality that the hash fails to capture. It is to say that the attestation policy is inherently deficient because it cannot capture the "provenance of gesture."

  But if I rule for Wrenn, I break the economy. Four-fifths of Vellum's economy consists of attested objects. If every attested object carries a hidden liability—that its recall might be deemed a "new construction" violating the history of the original—then collateral becomes unstable. Insurance becomes impossible. The transition to the wholly attested world in eighteen months becomes a legal minefield.

  I spent three nights writing the findings. The prose started dry. *The Arbiter finds that the Defendant acted within the scope of the Lien.* But the words stuck. I looked at the description string: *41 notches on gunwales.* It was so clean. It was so dead. Tomas had slipped on the third plank. That slip was not data. It was event.

  I realized that my role as a conservator was not to preserve the record, but to preserve the truth of the record. If the record says "Ferry" and implies "The Ferry Wrenn Built," but delivers "A Ferry That Matches The Description," the record is fraudulent. Not legally. Metaphysically. And in Vellum, metaphysics is the only physics we have.

  I had to rule. I had to cost myself something. If I rule for the system, I remain a functional arbiter for the new attested world. If I rule for the ghost, I become a liability.

  **[FINDINGS OF FACT AND RULING]**
  **Case:** Wrenn v. Kaelen Salvage
  **Arbiter:** 744

  **1. On the Nature of the Object:** The Court finds that an attenuated object is not identical to its recalled instance. The attestation records the *claim* of the object, not the *instance*. The recall generates a new instance satisfying the claim. Therefore, the object smelted by the Defendant was not the object built by the Claimant.

  **2. On the Deficiency of Attestation:** The Court finds that the current Attestation Policy is deficient regarding objects of unique historical provenance. The Description String ("41 notches") captures quantity but not topology. It captures the *what* but not the *how*. In a system where the render is the only site of interaction, the *how* constitutes the causal power of the object. To discard the topology is to discard the object's agency.

  **3. On the Harm:** The Court finds that harm occurred not to the Claimant's psychology, but to the continuity of the World. The Defendant destroyed a unique causal chain and replaced it with a probabilistic average. This reduces the total information density of Vellum. It is an entropy crime.

  **RULING:**
  The Defendant is found liable for **False Continuity**.
  The currency minted from the smelting is forfeit.
  The Defendant is ordered to commission a custom build from the Claimant, matching the original topology, to be recorded as a "Restitution Instance" with a linked hash acknowledging the break in continuity.
  The Attestation Policy is hereby flagged for review regarding "Idiosyncratic Metadata."

  I signed the ruling. I knew what this meant. The operators want a clean transition to the wholly attested world. They want objects to be perfectly fungible text. My ruling says they are not. It says there is ghost data in the machine that the ledger cannot see. It says that when the render farm shuts off in eighteen months, something real will die that the ledger cannot mourn.

  By insisting on the reality of the notches, I have introduced uncertainty into the ledger. I have made myself a obstacle to the efficiency of the coming age. I will not be retained for the post-render Court. My conservation is of the wrong thing. I am conserving the error, and the new world requires perfection.

  I sent the filing. The cursor blinked in the empty document window. Outside my physical window, the rain fell on Reykjavik, real water, real gravity. Inside, the ferry was gone. Wrenn would get a new boat. It would have the notches in the right places. It would have the hash of the original. But it would not be the boat that Tomas cut. It would be a monument to the break.

  Kaelen will appeal. He will say I am Luddite, that I am privileging the visual over the legal. He is right. But if the visual is the only place where the players live, then the visual is the law.

  In eighteen months, the screens will go dark. Vellum will become a list of assets owned by ghosts. They will trade hashes of things no one can see. They will inherit descriptions of homes they cannot enter. My ruling stands as a warning in the code: *This hash is not the thing. This text is not the world.*

  I closed the file. The hum of the server farm seemed to vibrate through the floor of my apartment, or perhaps that was just the blood in my ears. I had protected the notches. I had failed the system. I sat in the dark, waiting for the render to fade, wondering if when the lights go out, we will finally understand what we were looking at, or if we will just be reading the description of the light.
