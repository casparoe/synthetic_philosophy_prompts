answer: |-
  Dear Colleague,

  I have been thinking deeply about the deadlock on your panel, and it strikes me that the friction between your historians and modelers is not merely a disciplinary turf war but a symptom of an unresolved philosophical problem regarding singular causation. You are asking for a specification of what counts as an explanation of a token event, and you want to know which requirements are essential and which are merely parochial preferences. To draft a review form that does not simply privilege one camp over the other, we must first agree on what work an explanation is supposed to do in this specific context of one-off, non-repeatable historical occurrences. The first demand, which I believe is settled among most theorists of explanation regardless of camp, is that the account must be contrastive. An explanation of a singular event is never an explanation of the event in isolation; it is an explanation of why this outcome occurred rather than some other plausible outcome. When your modelers simulate a harvest spike leading to unrest, they are not explaining unrest per se, but why unrest happened in Province A and not Province B, or why it happened in Year X and not Year Y. Without a specified contrast class, the explanandum is ill-defined, and any number of true statements about the world could count as explanations. This is not a matter of taste but of logic; to explain is to discriminate, and discrimination requires at least two options. If a proposal cannot state what alternative it is ruling out, it fails to identify what needs explaining, and no amount of computational power can rescue it.

  Once the contrast is fixed, the explanation must identify a difference-maker, which is a requirement that exposes the weakness in both simplistic narrative and poorly constrained modeling. It is not enough to list conditions that were present; the account must show which condition made the difference between the actual outcome and the contrasted alternative. This distinction between a background condition and a cause is crucial. The presence of a palace administration is a condition for the collapse of a palace economy, but if the administration was present for centuries before the collapse, it cannot be the difference-maker for the collapse in that specific decade. Here we encounter the first hard case you mentioned: overdetermination. In situations where several independently sufficient factors converge, such as a drought, a foreign invasion, and internal succession disputes all hitting a state at once, isolating a single difference-maker is impossible. An adequate specification must admit that in cases of strict overdetermination, the explanation cannot point to a single necessary condition. Instead, it must explain the structure of the convergence itself. A proposal that insists on finding a single prime mover in an overdetermined scenario is methodologically flawed, but so is a model that simply sums inputs without showing how they interacted to tip the system. The requirement here is not singularity of cause but specificity of causal structure.

  This leads to the demand for modal support, which is where your modelers have a natural advantage but also where they are most prone to error. To answer "why then" and "why there," an explanation must support counterfactual claims. It must be able to say, with some justification, that if factor Z had been absent, the event would not have occurred, or would have occurred differently. This is non-negotiable because without modal support, we have only a description of sequence, not an account of dependence. However, this is also where the tension with the historians becomes acute. A computational model can generate thousands of counterfactual runs, but if the parameters are tuned to reproduce the known outcome, those counterfactuals are artifacts of the tuning rather than discoveries about the past. This brings us to the problem of fitted parameters. A model that reproduces the outcome only after its parameters have been fitted to that outcome is circular; it tells us that the event is consistent with the model, not that the model explains the event. The requirement, therefore, is that the modal claims must rest on parameters justified independently of the target event. If the modelers cannot justify their interaction rules without referencing the very outcome they are trying to explain, they are offering a restatement, not an explanation. This is a hard constraint, and it excludes a vast number of simulation projects that treat historical data as a calibration target rather than a test set.

  On the other side, the historians' demand for evidential constraint is equally non-negotiable, though often framed as a preference for narrative. An explanation must be supported by the record, not merely consistent with it. There is a profound difference between a story that does not contradict the sources and a story that the sources positively support. A narrative can be internally coherent and logically sound yet completely wrong because it ignores a specific tax record or letter that rules it out. This is the distinction between a narrative consistent with the sources and a narrative the sources support. For singular events, the evidence is sparse, one-shot, and produced by interested parties, which means the explanation must account for the bias and silence in the record. An account that explains an event by appealing to actors who acted on beliefs that were false must reconstruct those false beliefs using evidence that shows why the actors held them, not just that holding them would make the model work. If the model assumes agents believed prices were rising when the sources suggest they believed supply was cut off, the mechanism is empirically groundless. The requirement is that the micro-foundations of the model, or the motivational structure of the narrative, must be anchored in the epistemic state of the historical agents as best as it can be reconstructed.

  Here I must flag my own position, as it diverges from the hope that these requirements can be perfectly harmonized. I am convinced that for singular past events, the demand for modal robustness and the demand for evidential granularity cannot be jointly satisfied to a high degree. This is the finding about the field that you asked for. To achieve modal robustness, a model must abstract away from the idiosyncratic details of the specific case to identify general mechanisms; to achieve evidential granularity, a narrative must immerse itself in the idiosyncratic details that resist generalization. The more a model is tuned to the specific token event to satisfy the historians, the less it can support general counterfactuals without overfitting. The more a narrative is constrained by the specific evidence to satisfy the archivists, the less it can support claims about what would have happened otherwise, because the evidence is too sparse to populate the counterfactual world. We often pretend this tension does not exist, but it does. A specification that demands both perfect modal support and perfect evidential fit will fund no projects. Therefore, we must prioritize. For token events, I argue that evidential constraint must be the gatekeeper. A modal claim that contradicts the sources is false; a narrative that lacks modal depth is merely incomplete. It is worse to be confidently wrong about what happened than to be uncertain about why.

  This prioritization helps us distinguish the non-negotiable requirements from the standing preferences of the camps. The contrastive structure, the identification of difference-makers (or causal structures in overdetermined cases), and the evidential support are non-negotiable. Without these, you do not have an explanation of a historical event. However, subsumption under general laws is a preference of the modelers and the covering-law theorists; it is not required for token explanation. A mechanism is highly desirable but must not be treated as a black box; if the mechanism is not empirically anchored, it is speculative. Narrative unity is a preference of the historians; a fragmented explanation that fits the evidence is better than a unified story that smooths over contradictions. Checkability against the record is non-negotiable, but the form it takes differs; for modelers, it is parameter justification, and for historians, it is source citation. The single requirement that does the most to exclude candidates is the independence of parameter justification. Most computational proposals fail here because they tune their agents to produce the known history, which renders their counterfactuals useless. Most narrative proposals fail the contrastive requirement, offering a chronicle of what happened without specifying why it happened rather than something else.

  Regarding the hard cases you listed, the specification must handle them without collapsing. For the event that was not yet the event it later became, such as a skirmish that only becomes a "battle" because of a subsequent treaty, the explanation must account for the retrospective description. It must explain the conditions that allowed the later labeling, not just the fighting itself. For the event whose best generalization applies only by holding fixed the conditions that changed, the explanation must admit the limits of the generalization. If a rule about grain prices only holds when political stability is constant, and political stability changed, the rule does not explain the event. The explanation must focus on the change in stability, not the price rule. These are not exceptions to the rules of explanation; they are demonstrations of why the rules must be strict.

  To close with the verdict you requested on the three traditional accounts: a covering-law account fares poorly because singular historical events rarely fall under strict laws, and the ceteris paribus clauses required to make them fit are often so open-ended that they swallow the explanation. An account that explains action by the agent's reasons fares better on evidential grounds but often fails the modal test, as it struggles to show why those reasons led to this outcome rather than another in a complex system. A narrative account fares best on evidential constraint and contextual richness but often fails to isolate difference-makers or support counterfactuals. The ideal candidate for your funding call will look like a narrative in its sensitivity to evidence and a model in its clarity about counterfactuals, but it will accept that it cannot be perfect at both. It will prioritize getting the token event right over proving a general theory, and it will treat the model as a tool for testing the necessity of the narrative's claims, not as a replacement for the narrative itself. If your panel can agree that the goal is to constrain the imagination of what might have happened using the evidence of what did, rather than to simulate the past in toto, you may find your scores converging.

  Yours,

  A Colleague
