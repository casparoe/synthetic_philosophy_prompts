answer: |-
  **DISCUSSION HANDOUT: PATHS OF GLORY**
  **Prepared for the Library Film Evening**

  **1. The Standard Debate: Horizontal Equality**

  To understand where this film sits in relation to modern war ethics, we first need to outline the debate you have been reading.

  The traditional view, associated with Michael Walzer, argues for the Moral Equality of Combatants. This doctrine holds that once a war has begun, the soldiers on both sides possess an equal right to kill one another. It does not matter if one side started the war unjustly. Provided a soldier follows the rules of engagement (does not target civilians, treats prisoners well), they are morally blameless for killing enemy combatants. The uniform grants a kind of license. This is a horizontal relationship: it governs how Soldier A treats Soldier B across the no-man's-land.

  The revisionist view, associated with Jeff McMahan, challenges this. It argues that morality cannot be switched on and off by a uniform. If a soldier fights for an unjust cause, they do not acquire a right to kill soldiers fighting for a just cause. The enemy soldier is not a legitimate target if they are defending their home against aggression. This view collapses the separation between the justice of the war and the conduct within the war.

  Both of these positions are horizontal. They are concerned with the moral relationship between opposing forces. They assume that the soldier stands in a line facing an enemy, and the question is whether pulling the trigger is permissible.

  **2. The Vertical Question: Commanders and Troops**

  Your intuition is correct: the Moral Equality of Combatants does not run vertically. The doctrine says nothing about what a general may do to his own men. That relationship is governed by a different set of assumptions, often hidden in the background of the theory.

  Traditional Just War Theory assumes that the state commanding the soldiers is a legitimate authority. If the authority is legitimate, the soldier has a duty to obey. Walzer calls this the Division of Moral Labor. The political leaders decide whether the war is just; the soldiers simply fight it. This division protects the soldier from the burden of judging the war, but it also renders them a tool of the state.

  When you ask if the doctrine applies vertically, you are asking if the soldier retains moral standing against his own command. In *Paths of Glory*, the violence is almost entirely internal. The German army is a distant machine; the French army is a human community tearing itself apart.

  Here is where your hypothesis needs sharpening. There is no standard term in the literature for Vertical Moral Equality, because the theory assumes the vertical chain is a matter of law and discipline, not moral equality. However, the problem you have identified is often discussed under the heading of Individual Moral Responsibility versus Military Obedience.

  The film suggests that the Division of Moral Labor has broken down. General Mireau does not act as a legitimate authority pursuing a strategic aim; he acts as a corrupt agent pursuing personal advancement. When the command becomes criminal or negligent, does the soldier's duty to obey vanish?

  The film argues that the institution treats the soldier as expendable material. The artillery officer who refuses to fire on his own trenches is the only character who successfully asserts vertical moral agency. He states that he will not fire on his own men without written orders. He forces the General to put the atrocity on paper. The General backs down. This suggests that the vertical relationship is not one of equality, but of accountability. The soldier is not equal to the general, but the general is not immune to the soldier's moral refusal.

  **3. Futile Orders vs. Unjust Orders**

  You asked whether a soldier may refuse an order that is futile rather than unjust. This is the central legal and moral trap of the film.

  In the context of the First World War, an order to attack a fortified position, no matter how suicidal, was not legally unjust. It was a lawful order. The three men executed were not court-martialed for refusing an unlawful order; they were executed for failing to achieve an objective.

  The revisionist ethicists focus heavily on unjust wars. They have less to say about futile wars. If a war is just, but a specific battle is hopeless, does the soldier have a right to refuse?

  Traditional military ethics says no. The soldier's role is to accept the risk of death. To refuse because the attack is suicidal is to privilege one's own life over the strategic goal.

  The film, however, treats futility as a form of injustice. If the attack serves no military purpose and is ordered only to further a general's career, it ceases to be a military order and becomes a murder contract. The film argues that when an order is detached from military necessity, it loses its legitimacy. The men are not punished for cowardice; they are sacrificed to cover the incompetence of the command.

  This is where the theory you have been reading struggles. It is built to judge the soldier killing the enemy. It is not built to judge the state killing the soldier.

  **4. The Ambiguity of the Cause**

  You noted that the film never tells us if the French cause is just. This is not a weakness; it is a deliberate device.

  If the film established that France was fighting an unjust war, the revisionist argument would apply. The French soldiers would be liable for fighting at all. If the film established that France was fighting a just war, the traditional argument would apply. The soldiers would be heroes.

  By removing the question of national justice, Kubrick forces us to look at the structure of the army itself. The film is not about the ethics of war between nations; it is about the ethics of command within an institution. The ambiguity shuts out the revisionist question on purpose. It tells us that even if the war were just, this specific conduct would still be abhorrent. The rot is internal.

  **5. The Final Scene: Sentiment or Philosophy?**

  You suspect the closing scene with the German singer is sentimental rather than philosophical. An honest critic might agree with you, but there is a stronger reading available.

  Throughout the film, the Germans are objects. They are the Anthill. They are machine-gun nests. They are a target. In the final scene, the French soldiers jeer at a captive German woman. Then she sings. The jeering stops. They listen.

  If the film is about a rotten institution, this scene is the only moment where the institution fails to control the men's humanity. The army has spent two hours trying to turn the French soldiers into tools and the Germans into targets. The song breaks both categories.

  It is not necessarily a philosophical argument about peace. It is a demonstration of shared vulnerability. The men realize that the enemy is as frightened and trapped as they are. If the rest of the film is about the vertical violence of the hierarchy, this scene is a brief return to the horizontal human connection that the war has destroyed.

  However, your suspicion holds weight. One could argue the scene is a cop-out. It offers an emotional release that the rest of the film denies. It allows the audience to feel sadness rather than anger. It suggests that the problem is war itself, rather than the specific criminal negligence of the French command. If the film is about a rotten institution, the solution is not listening to a folk song; it is shooting the generals. The scene may soften the blade of the film's critique.

  **6. Summary for Discussion**

  *   **The Horizontal Gap:** The Moral Equality of Combatants explains why French soldiers may kill German soldiers. It does not explain why French generals may kill French soldiers. Does the theory need a vertical component, or is that a matter of criminal law, not war ethics?
  *   **The Duty to Obey:** Is there a moral difference between refusing an unjust order (shoot civilians) and refusing a futile order (attack an impregnable fort)? The film treats them as the same. Is it right to do so?
  *   **The Target:** Is the antagonist of the film the German army, the French High Command, or the nature of war itself? Does the final scene clarify this or muddy it?
  *   **The Name:** You asked if your vertical insight has a name. It does not have a single label like Moral Equality of Combatants. It falls under the critique of the Division of Moral Labor. The film argues that soldiers cannot outsource their morality to their commanders, even if the commanders are legally entitled to give the orders.

  **A Note on Accuracy**

  We have a veteran in our group who knows how an army behaves. Keep in mind that the film is a drama, not a documentary. The court-martial procedure is accelerated for cinematic effect. The refusal of the artillery officer to fire without written orders is historically plausible but rare. When discussing the military behavior, focus on the moral logic rather than the procedural accuracy. The film is interested in what *should* happen, not just what *did* happen.
