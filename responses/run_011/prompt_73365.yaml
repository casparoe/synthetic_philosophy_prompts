answer: |-
  The Axes

  The logical space is generated by five independent dimensions of disagreement, operationalised not as abstract theses but as tensions within concrete policy choices. First, the **Uncertainty Rule**: under doubt about sentience, does the burden of proof lie on the doubter (precaution), the killer (dismissal), or is it weighted by credence? Second, the **Harm Metric**: does moral concern attach to death itself or only to suffering, determining whether painless killing discharges duty? Third, **Aggregation**: are insect interests discounted per capita due to psychological simplicity, or do they count equally per unit of suffering? Fourth, **Agency**: does the identity of the actor—state, corporation, or householder—change what is permitted, or merely how reasons weigh? Fifth, **Innovation and Ecology**: is there a duty to develop costly humane methods, and does ecological value (species, food webs) constrain or compete with individual welfare? These axes intersect to create the decision space, ensuring that participants are sorted by what they would *do* in specific scenarios rather than what they *say* they believe about minds. The goal is to reveal that identical policies may stem from divergent reasoning, and identical reasoning may fracture under different case pressures.

  The Tree

  1.  **Locust Swarm:** Facing crop destruction, does the subsistence farmer spray immediately? **Yes** proceeds to Node 2; **No** terminates at *Leaf 1 (Absolute Insect Priority)*. This commits the respondent to prioritising human survival or rejecting it.
  2.  **Bed Bugs:** In social housing, do you treat immediately despite sentience uncertainty? **Yes** proceeds to Node 3; **No** terminates at *Leaf 2 (Precautionary Abstention)*. This commits to a precautionary rule under uncertainty.
  3.  **Stored Grain:** Choose between fumigation (gassing enclosed spaces) or pheromone-based mating disruption (using scent trails to prevent breeding). **Fumigation** proceeds to Node 4; **Disruption** proceeds to Node 5. This distinguishes death-avoidance from suffering-avoidance.
  4.  **Aerial Spraying:** Is collateral pollinator death permissible for vector-control (managing disease-carrying organisms)? **Yes** proceeds to Node 6; **No** terminates at *Leaf 3 (Collateral Restrictionist)*. This commits to accepting ecological side-effects for human health.
  5.  **Sterile-Insect Programme:** Does rearing harm offset wild suppression benefits? **Yes** proceeds to Node 6; **No** terminates at *Leaf 4 (Non-Identity Purist)*. This tests whether bringing insects into existence counts as a benefit.
  6.  **Gene Drive:** Is species elimination permissible to prevent suffering? **Yes** proceeds to Node 7; **No** terminates at *Leaf 5 (Ecological Preservationist)*. This weighs individual welfare against species existence.
  7.  **Household Pests:** May a householder kill for convenience? **Yes** proceeds to Node 8; **No** terminates at *Leaf 6 (Agent-Relative Restrictionist)*. This tests if agent identity changes permissions.
  8.  **Crop Production:** Is there a duty to adopt costly no-till (farming without ploughing) over tillage (ploughing soil)? **Yes** terminates at *Leaf 7 (Innovation Imperativist)*; **No** terminates at *Leaf 8 (Status Quo Pragmatist)*. Other leaves arise from specific combinations of earlier nodes (e.g., *Leaf 9-12* distinguish credence-weighting and discounting views within the 'Yes' branches of Nodes 3 and 4).

  The Leaves

  **1. Absolute Insect Priority.** Insect life trumps human subsistence. *Awkward:* Permits human starvation to save locusts. *Worst:* Locust swarm.
  **2. Precautionary Abstention.** Uncertainty forbids lethal control. *Awkward:* Requires tolerating disease vectors. *Worst:* Bed bugs.
  **3. Collateral Restrictionist.** Human health permits targeting vectors but not pollinators. *Awkward:* Demands impossible specificity. *Worst:* Aerial spraying.
  **4. Non-Identity Purist.** Rearing harm is never offset by non-existence. *Awkward:* Condemns sterile-insect programme (rearing and sterilising males to suppress populations). *Worst:* Sterile-insect programme.
  **5. Ecological Preservationist.** Species existence outweighs individual welfare. *Awkward:* Forbids eliminating disease vectors. *Worst:* Gene drive (genetic mechanism forcing inheritance of suppressive traits).
  **6. Agent-Relative Restrictionist.** Householders forbidden what States permit. *Awkward:* Creates moral inequality. *Worst:* Household pests.
  **7. Innovation Imperativist.** Duty to develop humane tech regardless of cost. *Awkward:* Diverts resources from immediate relief. *Worst:* Crop production.
  **8. Status Quo Pragmatist.** Use best current method only. *Awkward:* Accepts preventable suffering. *Worst:* Crop production.
  **9. Sovereign Humanism.** State health priorities trump all insect interests. *Awkward:* Permits gratuitous ecological damage. *Worst:* Aerial spraying.
  **10. Credence Utilitarian.** Weigh probability of sentience against harm. *Awkward:* Requires complex modelling. *Worst:* Bed bugs.
  **11. Painless Death Permissivist.** Killing is fine if suffering is minimised. *Awkward:* Accepts mass death. *Worst:* Stored grain.
  **12. Anti-Killing Deontology.** Death itself is the harm, regardless of pain. *Awkward:* Forbids painless fumigation. *Worst:* Stored grain.

  Empty and Overcrowded Cells

  Several logical combinations remain unoccupied. The 'Absolute Insect Priority' leaf is theoretically possible but empirically empty; no participant currently endorses human starvation for locusts, suggesting the axis of human survival is not truly independent but lexicographically prior for all present. Conversely, the 'Status Quo Pragmatist' leaf is overcrowded. It captures both the hard anthropocentrist who denies insect mattering and the welfarist who denies a duty to innovate due to cost constraints. These distinct moral foundations collapse onto identical policy recommendations here, masking the disagreement. Similarly, 'Sovereign Humanism' and 'Collateral Restrictionist' often merge in practice because vector-control officers accept collateral damage as inevitable, not permissible, blurring the normative distinction. The region around 'Gene Drive' is unexplored; few have considered whether individual welfare justifies species elimination, leaving a gap between conservation biologists and welfarists. This suggests the tree lacks resolution on the *value of existence* versus *quality of life*, forcing distinct views into the same leaf when they diverge on future technologies not yet deployed.

  What the Tree Cannot Separate

  The tree fails to distinguish between the 'Painless Death Permissivist' and the 'Sovereign Humanist' on the aerial spraying case. Both endorse the spray, but the former believes insect death is bad but outweighed by human health, while the latter believes insect death is morally neutral. Their verdicts are identical, yet the difference is substantive: the Permissivist supports research into non-lethal alternatives, whereas the Humanist does not. Similarly, the 'Ecological Preservationist' and the 'Non-Identity Purist' both oppose the sterile-insect programme, but for opposite reasons: one values the species' continuation, the other values the individuals' non-creation. The tree sorts by action, not rationale, meaning these pairs will sit together in the workshop despite incompatible metaphysics. This is a feature, not a bug, for policy alignment, but it obscures the potential for future disagreement should technological constraints shift. The structure prioritises decisional convergence over theoretical purity, which serves the workshop's goal of finding common ground but risks masking deep incompatibilities in moral reasoning that may resurface in novel cases.

  Confidence

  I am moderately confident in the structural claims, particularly regarding the independence of the 'Harm Metric' (death vs. suffering) and 'Uncertainty Rule'. These axes genuinely separate participants who otherwise agree on outcomes. However, the 'Agency' axis is entangled with 'Innovation'; householders rarely face the duty to innovate because they lack capacity, making the node somewhat artificial. The weakest joint is Node 6 (Gene Drive). It assumes a binary choice on species elimination, but many participants hold a 'contingent elimination' view dependent on ecological replacement, which the tree forces into a yes/no bracket. This compresses nuanced conservationist views into the 'Ecological Preservationist' leaf, potentially misrepresenting their stance on vector species specifically. Additionally, the 'Uncertainty Rule' is difficult to operationalise purely through cases without slipping into theoretical questioning, risking violation of the concrete verdict constraint. Despite this, the tree should successfully sort the room by policy preference, revealing the instructive overlaps noted in the prompt.
