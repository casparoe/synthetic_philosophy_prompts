answer: |-
  **The through-line**
  This session exists to replace the psychological metaphor of "steps of reasoning" with the logical structure of information. Students must leave understanding that common knowledge is not merely "everyone knows," but a distinct state required to justify coordinated equilibrium play. We will demonstrate that without common knowledge of rationality, rational agents may fail to coordinate even when incentives align. The goal is to shift their intuition from "how deep can I think" to "what do I know that you know I know."

  **Dependency chain**
  1. **States of the World:** Establish that uncertainty concerns which state obtains, not just payoffs. Justification: You cannot model knowledge without a domain to be known.
  2. **Information Partitions:** Define knowledge as the ability to distinguish states; if I cannot distinguish state A from B, I know only the set {A,B}. Justification: This formalizes "knowledge" without modal logic, preventing confusion between belief and certainty.
  3. **Mutual vs. Common Knowledge:** Distinguish "everyone knows E" (mutual) from "everyone knows everyone knows E..." (common). Justification: This distinction must precede rationality application to avoid conflating knowledge depth with logical necessity.
  4. **Instrumental Rationality:** Fix rationality as maximizing expected utility given information partitions, not playing equilibrium strategies. Justification: Placing Rationality before equilibrium prevents the slide where "rational" silently becomes "equilibrium-playing."
  5. **CKR Implications:** Show how common knowledge of (4) restricts playable strategies. Justification: You cannot define the constraint (CKR) before defining the constraint's components. This order ensures students see equilibrium as a derived property of information, not a definition of rationality.

  **The carrying case**
  **The Coordination Game with a Noisy Public Announcement.** Two players must meet at Location A or B. A determines the payoff (A is best if Rain, B if Shine). A signal is sent: "It is Rain." **Requirements:** It must allow a state where I know it rains, you know it rains, but I don't know that you know I know. It must lack infinite recursion puzzles that feel like logic tricks rather than strategic constraints. **Disposition of Rejections:** **Muddy Children/Blue Eyes:** Reject as primary case; it teaches logical induction but obscures strategic interdependence and payoffs. Allow the two students who know it to map it privately, but insist the session focuses on *coordination*, not truth. **Two Generals:** Reject; it focuses on communication protocol reliability rather than strategic rationality. **Centipede:** Reject; it relies on backward induction in sequential games, conflating CKR with sequential rationality, which belongs in the afternoon's mechanism design. **Aumann/Polarization:** Acknowledge the dissertation student's interest but flag disagreement as a matter of *priors*, whereas this session is about *information structure*. Keep the focus on coordination failure, not belief divergence.

  **Misconception map**
  1. **"CK is just Mutual Knowledge."** Arises at Step 3. **Intervention:** Draw the partition diagram. Show a cell where E is true in all states everyone sees, but the "everyone knows everyone knows" chain breaks. Verbalize: "Mutual knowledge is parallel; common knowledge is recursive."
  2. **"Public Announcement = CK."** Arises at Case Setup. **Intervention:** Introduce a tiny probability the message failed. Show that even if it didn't fail, the *possibility* breaks common knowledge. Emphasize that CK requires the impossibility of doubt about the doubt.
  3. **"Rationality = Equilibrium."** Arises at Step 4. **Intervention:** Explicitly write "Rationality = Max EU given Beliefs" on the board. Circle "Beliefs." Emphasize beliefs can be wrong if knowledge is incomplete. Rationality is internal consistency, not external optimality.
  4. **"CKR implies Nash."** Arises at Step 5. **Intervention:** Clarify that CKR implies *rationalizability*, not necessarily Nash, unless the game is specific. Do not overclaim; admit CKR is necessary but not always sufficient for unique Nash. This prevents the false generalization that CKR solves all games.
  5. **"Steps of Thinking."** Arises throughout. **Intervention:** Constantly correct "steps" to "levels of knowledge." You aren't thinking deeper; you possess a stronger logical guarantee. This directly counters the takeaway from last year's failed session.

  **The check**
  **Question:** "If we both know the rule, and we both know we are rational, but we do not have common knowledge of this fact, can we guarantee coordination on the payoff-dominant equilibrium?" **Right Answer:** "No, because without common knowledge, I cannot be certain that you are certain I will play it, so I might hedge." This shows they understand the recursive necessity of certainty. **Wrong Answer:** "Yes, because we are both rational and we both know the rule, so we will obviously do the smart thing." This reveals the Mutual vs. Common confusion and the slide back into psychological depth rather than logical structure. It indicates they have reverted to the "Guess 2/3" mindset where rationality forces equilibrium regardless of information state.

  **Refusals**
  **Aumann's Agreeing to Disagree:** I will decline to prove this. It requires common priors and probability measures that distract from the logical structure of knowledge we are building. **Modal Logic Syntax:** I will not write box operators. We are doing epistemic game theory, not epistemic logic; the intuition matters more than the formalism. **Mechanism Design:** I will not discuss how to *create* common knowledge, only how its absence affects play; that is the afternoon instructor's domain. I will explicitly state: "We are analyzing the constraint, not designing the mechanism to fix it."
