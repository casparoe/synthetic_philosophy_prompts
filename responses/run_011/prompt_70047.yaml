prompt: |-
  I'm drafting a methods section for a consortium that assigns functional annotations to gene products, and the philosophers on our advisory panel have told me, more or less unanimously, that I can't write the section until I've picked a theory of function. Before I pick anything, I want the specification: what would a theory of biological function have to deliver to be usable for this job?

  Here is what makes the job hard. The same pipeline has to issue function claims about entities with wildly different histories: conserved enzymes with deep orthologs across the tree of life; genes duplicated recently, with both copies retained and neither yet clearly specialized; genes acquired by horizontal transfer from a lineage whose ecology we know nothing about; de novo genes that arose from previously noncoding sequence and are found in a single genus; and wholly synthetic constructs designed in silico and placed into a minimal-cell chassis that has itself had most of its genome deleted. Any theory that quietly assumes its target always has a long selective pedigree behind it will misdescribe a substantial fraction of our annotations, and any theory that ignores history entirely will misdescribe the majority.

  Write the desiderata. For each, give the case that motivates it, and say whether it is a genuine constraint on an adequate theory or a commitment of one camp wearing the mask of a neutral requirement — I suspect a fair number of the demands made in this literature are just etiological or causal-role assumptions restated as criteria. At a minimum, address how a theory is to handle:

  - malfunction versus absence of function: what it says about a pseudogene, a vestigial structure, a catalytically dead enzyme that is still bound and doing structural work in a complex, and a designed construct that reliably does what it was built to do in vivo but was never selected for anything;
  - promiscuity and moonlighting: most proteins have a dominant activity plus weak secondary activities that matter only in unusual conditions, or that later become the raw material for something new. The theory must say which of these count as functions, whether they count in degrees, and relative to which containing system;
  - level and grain: the same molecule gets annotated at the level of a chemical reaction, a pathway, a cell, a tissue, and an organism, and our database mixes these freely. Are these competing answers to one question, or different questions?
  - epistemic output: the pipeline returns "unknown" millions of times over. The theory should tell us whether that is a claim about the world or about us, and what an annotator is entitled to assert from partial evidence.
  - anhistoricity (my name for it, not a term of art): the theory should not require a selection history as a precondition for there being a function, and it should say what does ground a function claim when no history exists to appeal to.

  Then give me the joint-satisfiability analysis, which is the part I actually need. I have been told that accommodating malfunction and accommodating anhistoric entities pull in opposite directions — that the former requires history and the latter forbids it — and I want to know whether that is a real incompatibility, an artifact of how the two requirements are usually phrased, or a genuine tradeoff with a stable midpoint. If some subset of the desiderata cannot all be met, say which, and say what the least damaging surrender looks like.

  Identify which single requirement does the most to eliminate candidates, and then score the standard families — selected-effect accounts, causal-role accounts, goal-contribution accounts, propensity theories, and the pluralist or consensus positions — briefly against the list. A short paragraph each is plenty, and no references; I'll do my own reading.

  One standing constraint on your assessment: the theory will be applied by people who are sometimes wrong and who cannot see the whole system. Wherever a requirement would make function claims unknowable without complete phylogenetic knowledge or a full causal map of the organism, mark it as failing an applicability constraint and say what weaker formulation of it might survive that objection.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Goal:** Draft a set of desiderata (requirements) for a theory of biological function suitable for a gene annotation consortium.
      *   **Context:** The consortium deals with diverse entities (conserved enzymes, recent duplicates, HGT, de novo genes, synthetic constructs).
      *   **Constraint 1 (Philosophers):** Must pick a theory of function before writing methods.
      *   **Constraint 2 (User):** Wants to know *what* a theory needs to deliver before picking one. Suspects many "requirements" are just partisan assumptions in disguise.
      *   **Specific Topics to Address:** Malfunction vs. absence, promiscuity/moonlighting, level/grain, epistemic output ("unknown"), anhistoricity (no selection history).
      *   **Specific Analysis Required:** Joint-satisfiability analysis (can these all be met? specifically the malfunction vs. anhistoric tension). Identify the single most eliminative requirement. Score standard theory families (Selected-Effect, Causal-Role, Goal-Contribution, Propensity, Pluralist).
      *   **Constraint 3 (Applicability):** The theory must be usable by fallible humans with incomplete knowledge (no omniscience required).
      *   **Format:** Desiderata with cases and "genuine vs. partisan" labels, Joint-satisfiability analysis, Single eliminative requirement, Scoring of theory families. No references.

  2.  **Deconstruct the Desiderata:**
      *   *Requirement 1: Malfunction vs. Absence.* Needs to distinguish broken things (pseudogenes) from things that never had a function (synthetic) or lost it (vestigial). Also needs to handle "dead" enzymes doing structural work.
      *   *Requirement 2: Promiscuity/Moonlighting.* Needs to handle multiple functions, weak activities, and context dependence.
      *   *Requirement 3: Level/Grain.* Needs to handle annotations at different biological scales (reaction vs. organism) without contradiction.
      *   *Requirement 4: Epistemic Output.* Needs to clarify what "unknown" means (ontological vs. epistemological) and guide assertion based on partial evidence.
      *   *Requirement 5: Anhistoricity.* Needs to assign function to things without a selection history (de novo, synthetic) without relying solely on history.
      *   *Constraint 6: Applicability.* Must not require total phylogenetic or causal knowledge.

  3.  **Drafting the Desiderata (Iterative Process):**
      *   *Malfunction:* If I say a gene *has* a function, I must be able to say it *failed* to do it. But synthetic genes haven't been selected. *Analysis:* Genuine constraint? Yes, annotation needs to distinguish broken from non-existent. But "malfunction" implies a norm. Where does the norm come from if not history?
      *   *Promiscuity:* Enzymes do side reactions. Are those functions? *Analysis:* Genuine constraint. Databases list EC numbers (primary) and sometimes side activities. Theory must allow plurality.
      *   *Level/Grain:* Is the function "kinase activity" or "cell cycle regulation"? *Analysis:* Often partisan. Causal-role loves levels; Selected-effect often privileges reproduction/survival. Needs to be neutral.
      *   *Epistemic:* "Unknown" is huge in GO (Gene Ontology). *Analysis:* Genuine constraint. Annotators need to know if they are withholding judgment or asserting absence.
      *   *Anhistoricity:* De novo genes. *Analysis:* This is the killer. Selected-Effect (SE) theories fail here. Causal-Role (CR) passes easily but struggles with malfunction.
      *   *Applicability:* Can't require full phylogeny. *Analysis:* Genuine constraint for a working pipeline.

  4.  **Joint-Satisfiability Analysis (The Core Conflict):**
      *   *The Tension:* Malfunction usually requires a norm (etiology/history). Anhistoricity denies history.
      *   *Resolution:* Can we ground norms without history? Maybe via *system organization* or *design intent* (for synthetic)? Or do we admit a pluralism?
      *   *Verdict:* It is a genuine tradeoff for *monistic* theories. A single unified definition struggles. A "stable midpoint" likely involves decoupling the *definition* of function from the *evidence* required, or adopting a weak normativity based on current contribution rather than past selection.
      *   *Least Damaging Surrender:* Relaxing the strict "malfunction" requirement for anhistoric entities. Treat synthetic/de novo functions as "capacities" until a history is established, or accept that "malfunction" means "fails to contribute to current system viability" rather than "fails selected effect."

  5.  **Identifying the Eliminative Requirement:**
      *   *Candidate:* Anhistoricity.
      *   *Reason:* It immediately kills classic Selected-Effect (Millikan, Neander) theories which define function *as* selected effect.
      *   *Applicability Check:* Requiring full phylogeny is also eliminative, but Anhistoricity is more theoretical. Let's stick with Anhistoricity as the theoretical killer, but note Applicability as the practical killer. The prompt asks for the *single requirement* that eliminates candidates. Anhistoricity is the strongest theoretical filter.

  6.  **Scoring the Theory Families:**
      *   *Selected-Effect (SE):* Fails Anhistoricity. Good on Malfunction. Fails Applicability (needs phylogeny).
      *   *Causal-Role (CR):* Passes Anhistoricity. Fails Malfunction (hard to distinguish broken from absent without norms). Good on Promiscuity.
      *   *Goal-Contribution (Cummins-style/Systems):* Similar to CR. Good on Level/Grain.
      *   *Propensity:* (Probability of survival/reproduction). Similar to SE, struggles with Anhistoricity.
      *   *Pluralist:* Passes everything by cheating (switching definitions). Best fit for consortium, but philosophically "messy."

  7.  **Refining the "Applicability" Constraint:**
      *   Must ensure I explicitly mark requirements that demand omniscience.
      *   Example: SE theory often requires knowing *why* something was selected. Annotators can't know that. So SE fails Applicability even if we ignore Anhistoricity.

  8.  **Drafting the Content (incorporating the "Philosopher" tone):**
      *   Need to be precise, slightly skeptical of philosophical jargon, focused on the pipeline's needs.
      *   Ensure the "Genuine vs. Partisan" tag is clear for each desideratum.
      *   Ensure the Joint-Satisfiability section directly addresses the Malfunction/Anhistoric tension.

  9.  **Review against Constraints:**
      *   No references? Check.
      *   Address specific cases (pseudogene, vestigial, dead enzyme, synthetic)? Check.
      *   Address promiscuity, level, epistemic, anhistoricity? Check.
      *   Joint-satisfiability analysis? Check.
      *   Single eliminative requirement? Check.
      *   Score standard families? Check.
      *   Applicability constraint (fallible humans)? Check.

  10. **Final Polish:**
      *   Make sure the distinction between "malfunction" (normative failure) and "absence" (lack of capacity) is clear.
      *   Ensure the scoring is brief (one paragraph each).
      *   Tone: Professional, analytical, directive.

  *(Self-Correction during drafting)*: I initially thought about suggesting Pluralism as the solution. But the prompt asks me to score them, not just pick one. I need to make sure the scoring reflects the *tension* identified in the analysis. Also, I need to be careful with "Goal-Contribution." Sometimes that's synonymous with Causal-Role in this context. I will treat it as Systems-theoretic (Boorse-ish) to distinguish from pure CR.
  Actually, the prompt asks to identify the *single requirement* that does the most to eliminate candidates. Anhistoricity is the obvious one for SE theories. But Applicability is the practical one. I will argue Anhistoricity is the theoretical bottleneck, but Applicability is the practical filter. I'll stick with Anhistoricity as the primary theoretical eliminator as it defines the *ontology*, whereas Applicability defines the *epistemology*. The prompt asks about the theory first.

  Wait, looking closer at the "Malfunction vs Anhistoric" tension. If I say a synthetic gene has a function (Anhistoric), and it breaks, did it malfunction? If function is just "what it does" (CR), it doesn't malfunction, it just does something else. If function is "what it was made to do" (Design), it malfunctions. But Design isn't a biological theory. So the tension is real. I need to propose a "stable midpoint." The midpoint is likely grounding norms in *current system organization* rather than *past history*.

  Let's write.
answer: |-
  ### Desiderata for a Consortium Theory of Function

  **1. The Malfunction/Absence Distinction**
  *   **Specification:** The theory must distinguish between an entity that *has* a function but fails to perform it (malfunction), an entity that lacks a function entirely (absence), and an entity that performs a capacity that is not its function (side-effect). It must account for: (a) pseudogenes (absence); (b) vestigial structures (historical function, current absence?); (c) catalytically dead enzymes retaining structural roles (function shift); and (d) synthetic constructs that work as designed but lack selection history (function without history).
  *   **Motivating Case:** A pipeline annotating a catalytically dead kinase must know whether to label it "non-functional" or "structural scaffold." Labeling it "non-functional" loses biological truth; labeling it "functional" requires a definition of function that isn't tied solely to catalysis.
  *   **Status:** **Genuine Constraint.** Annotation requires normative claims (this *should* do X) to flag errors or disease states. However, the demand that malfunction *must* be grounded in evolutionary history is a **Partisan Commitment** (Etiological). A theory could ground norms in current system organization or design intent.

  **2. Promiscuity and Moonlighting**
  *   **Specification:** The theory must allow a single entity to bear multiple functions simultaneously. It must provide criteria for distinguishing "primary" vs. "secondary" functions, or reject that distinction in favor of context-relative function ascriptions. It must handle weak activities that become significant under stress or in new lineages.
  *   **Motivating Case:** An enzyme with a primary metabolic role and a weak secondary activity that becomes the basis for a new pathway after duplication. The database must be able to record both without implying contradiction.
  *   **Status:** **Genuine Constraint.** Biological reality is multi-functional. However, the demand that one function must be "the" True Function is a **Partisan Commitment** (often Etiological). A usable theory should permit plurality.

  **3. Level and Grain**
  *   **Specification:** The theory must clarify whether function ascriptions at different biological levels (molecular activity vs. organismal survival) are competing answers to the same question or compatible answers to different questions. It must prevent contradictions when a molecular function benefits a mobile genetic element but harms the host organism.
  *   **Motivating Case:** A toxin-antitoxin system. Function for the plasmid (maintenance) vs. function for the bacterium (stress response vs. burden). The pipeline annotates the gene, not just the organism.
  *   **Status:** **Mixed.** The need for consistency is **Genuine**. The demand that all functions must ultimately cash out at the level of organismal reproduction is a **Partisan Commitment** (Etiological/Adaptationist). A consortium theory must allow function ascriptions relative to the containing system specified in the annotation.

  **4. Epistemic Output**
  *   **Specification:** The theory must define the truth conditions of "function unknown." Is this an ontological claim (no function exists) or an epistemic claim (we cannot discern it)? It must specify what evidence licenses a positive function claim (e.g., sequence homology alone vs. experimental validation).
  *   **Motivating Case:** Annotators assign "inferred from electronic annotation" constantly. If the theory requires experimental proof of contribution to fitness for a function claim, most database entries become false.
  *   **Status:** **Genuine Constraint.** A theory that makes function claims unknowable to working biologists is useless. This is tightly linked to the Applicability Constraint below.

  **5. Anhistoricity**
  *   **Specification:** The theory must ground function claims for entities lacking a selection history (de novo genes, synthetic constructs, recent duplicates before specialization). It must specify what non-historical facts (e.g., current contribution, design intent, chemical propensity) suffice for a function ascription.
  *   **Motivating Case:** A synthetic gene circuit inserted into a minimal cell. It reliably performs a logic operation. To say it has "no function" because it wasn't selected is biologically unhelpful; to say it has a function requires a non-etiological ground.
  *   **Status:** **Genuine Constraint (for this consortium).** Given the portfolio of entities (synthetic, de novo), a theory requiring deep phylogeny is factually inadequate. However, the claim that *all* biological function must be anhistoric is a **Partisan Commitment** (Causal-Role). The requirement here is simply *inclusivity* of anhistoric cases, not the exclusion of historic ones.

  **6. Applicability (The Fallibility Constraint)**
  *   **Specification:** The theory must not require knowledge that is unavailable to annotators. It cannot require complete phylogenetic trees, full causal maps of the organism, or access to counterfactual evolutionary histories.
  *   **Motivating Case:** Annotators work with partial sequences and model organisms. If a theory defines function as "the effect for which this trait was selected," annotators cannot apply it without speculative evolutionary reconstruction.
  *   **Status:** **Genuine Constraint.** This is a pragmatic necessity for a database. Many philosophical theories fail here by making function epistemically inaccessible.

  ---

  ### Joint-Satisfiability Analysis

  The tension between **Malfunction** and **Anhistoricity** is the central theoretical bottleneck.

  *   **The Conflict:** To support "malfunction," a theory needs a norm (a standard the entity *ought* to meet but fails). Historically, these norms are supplied by selection history (Selected-Effect theories). If you remove history to satisfy Anhistoricity (for synthetic/de novo genes), you lose the ground for the norm. Without a norm, a broken synthetic gene is just a gene doing something else (Causal-Role), not a gene *malfunctioning*.
  *   **Is it Real?** Yes, for monistic theories. You cannot have a single definition of function that relies *essentially* on history for norms while also applying to entities that *essentially* lack history.
  *   **The Stable Midpoint:** The incompatibility dissolves if you decouple the *ground* of the norm from *selection*. For historic entities, the norm is selection. For anhistoric entities, the norm is **system contribution** or **design intent**.
      *   *Proposal:* Adopt a **Dual-Ground** approach. Function is defined as "a capacity that contributes to the goals of a containing system." For natural genes, the "goals" are cashed out via evolutionary history (viability/reproduction). For synthetic/de novo genes, the "goals" are cashed out via current system viability or explicit design specifications.
      *   *Malfunction:* Defined as "failure to contribute to the containing system's goals," regardless of whether those goals are historical or designed.
  *   **Least Damaging Surrender:** If a unified norm is impossible, surrender the strict "malfunction" label for anhistoric entities. Classify synthetic/de novo failures as "loss of capacity" rather than "malfunction" until a history or stable system integration is established. This preserves the historical norm for the majority of annotations while allowing anhistoric annotation as "capacity claims."

  **Verdict:** The desiderata are jointly satisfiable only if the theory is **pluralistic about the source of norms** but **univocal about the structure of function** (contribution to a system).

  ---

  ### The Eliminative Requirement

  **Anhistoricity** is the single requirement that eliminates the most candidates.

  While Applicability is a practical filter, Anhistoricity is an ontological filter. It immediately disqualifies any theory that defines function *essentially* as a product of past selection. This removes the dominant family of philosophical accounts (Selected-Effect) from contention as a *universal* theory for this consortium, forcing a modification or a switch.

  ---

  ### Scoring of Standard Theory Families

  **Selected-Effect (Etiological) Accounts**
  *   **Score:** **Fail.**
  *   **Analysis:** These define function as the effect for which a trait was selected. They handle Malfunction perfectly (failure to perform selected effect) and handle Level/Grain well (privileging fitness). However, they fail Anhistoricity categorically (synthetic/de novo genes have no history) and fail Applicability (annotators cannot verify selection histories). They would force the consortium to label all synthetic biology and recent de novo genes as "functionless," which is empirically false for your pipeline's needs.

  **Causal-Role (Systems) Accounts**
  *   **Score:** **Pass (with caveats).**
  *   **Analysis:** These define function as a capacity that contributes to the operation of a containing system. They pass Anhistoricity (synthetic genes contribute to the chassis) and Applicability (capacities are measurable). They handle Promiscuity well (multiple contributions). However, they struggle with Malfunction (a broken part just has a different causal role) and Level/Grain (anything contributing to *any* system counts, potentially inflating function ascriptions). They require a supplementary account of "normality" to distinguish function from side-effect.

  **Goal-Contribution (Teleological) Accounts**
  *   **Score:** **Pass (if 'Goal' is broadened).**
  *   **Analysis:** Similar to Causal-Role but emphasizes the 'end' of the system. If 'goal' is restricted to evolutionary fitness, it fails Anhistoricity. If 'goal' includes homeostatic maintenance or engineered output, it passes. It handles Malfunction well (failure to meet goal). The risk lies in defining the "system boundaries" (Level/Grain); without strict rules, this becomes subjective. It is highly applicable for annotators who can observe system outputs.

  **Propensity Theories**
  *   **Score:** **Fail.**
  *   **Analysis:** These define function as the propensity to survive/reproduce. Like Selected-Effect, they rely on evolutionary metrics. They fail Anhistoricity (synthetic genes have no evolutionary propensity yet) and fail Applicability (propensities are probabilistic and long-term, hard to measure in a pipeline). They offer little advantage over Selected-Effect for your specific constraints.

  **Pluralist / Consensus Positions**
  *   **Score:** **Pass (Best Fit).**
  *   **Analysis:** These argue that "function" means different things in different contexts (e.g., evolutionary function vs. mechanistic function). This fits the consortium's diverse portfolio perfectly. You can use Causal-Role for synthetic/de novo and Selected-Effect for conserved enzymes. The downside is theoretical consistency; the database must tag *which* sense of function is being used to avoid logical errors. However, this is the only framework that satisfies all Desiderata without surrendering Anhistoricity or Malfunction. It meets the Applicability constraint by allowing annotators to use the evidence available (history if known, mechanism if not).
