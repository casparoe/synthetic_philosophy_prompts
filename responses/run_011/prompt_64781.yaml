answer: |-
  Pure time preference cannot be defended as an independent moral principle because its functional role collapses under negative growth, exposing it as a calibration parameter designed to neutralize the demanding implications of impartiality rather than a substantive ethical constraint. The Ramsey decomposition ($r = \rho + \eta g$) reveals that the social discount rate is composed of a pure rate of time preference ($\rho$) and a growth-adjusted marginal utility term ($\eta g$). In a standard growing economy ($g > 0$), future generations are wealthier, so their marginal utility is lower; impartiality thus dictates a positive discount rate on their wellbeing. Here, setting $\rho = 0$ yields a positive discount rate solely through the growth term, satisfying the intuition that we need not sacrifice endlessly for richer descendants. However, in a contracting economy ($g < 0$), the sign of the growth term flips. Future generations are poorer, their marginal utility is higher, and impartiality demands a negative discount rate—weighting their wellbeing more heavily than our own. If $\rho$ is asserted as a fixed moral constant greater than zero, it fights against this impartial signal, artificially inflating the discount rate to prevent the planner from prioritizing the poorer future. This symmetry demonstrates that $\rho$ is not doing independent normative work; rather, it acts as a counterweight to $\eta g$, ensuring the final discount rate remains positive and "manageable" regardless of whether the ethical mathematics demand sacrifice or restraint.

  The accusation that $\rho$ is a fudge term holds because its primary justification evaporates when the economic context reverses. The most common defense of pure time preference is that we should not sacrifice heavily for future people who will be richer than us anyway. But this is not a defense of $\rho$; it is a description of the $\eta g$ term. When $g$ turns negative, this defense not only fails but inverts: we *should* sacrifice for people who will be poorer. If the defender of $\rho$ insists on maintaining a positive pure time preference even when the future is destitute, they are admitting that temporal location itself merits moral discrimination, independent of welfare consequences. This leaves only the survival-risk defense: the argument that $\rho$ represents the probability of humanity's extinction before the future arrives. This defense survives the flip technically, as extinction risk exists regardless of growth rates. However, this is not a moral discount but a probabilistic one; it discounts the *probability* of the future existing, not the *value* of future wellbeing conditional on existence. Conflating existential risk with pure time preference smuggles a empirical uncertainty into a moral axiom, and once separated, the moral core of $\rho$ remains undefended.

  Critics might argue that allowing the discount rate to track the sign of a macroeconomic variable is itself arbitrary, making ethical obligations hostage to economic fortune. Yet this objection misunderstands the source of the obligation. Under utilitarian impartiality, the weight assigned to a person's utility depends on their marginal utility, which is inherently dependent on their material scarcity. Letting the discount rate track $g$ is not arbitrary; it is a necessary consequence of taking diminishing marginal utility seriously. Conversely, insisting on a positive $\rho$ regardless of $g$ is the truly arbitrary stance, as it asserts that being born later is morally akin to being born farther away, a claim widely rejected in cosmopolitan ethics. If we reject spatial discrimination, temporal discrimination requires a justification beyond mere sequence. The worry that negative discounting leads to implausible demands in a shrinking world is not a reason to keep $\rho$ positive; it is a reason to accept that impartiality is demanding. The instability lies not in the formula, but in the refusal to accept its ethical output when it becomes inconvenient.

  Therefore, the verdict must be that pure time preference is indefensible. The fact that the Ramsey formula flips under negative growth shows that $\rho$ serves primarily to dampen the implications of impartiality in a growing world, functioning as a parameter calibration rather than a moral truth. While survival risk provides a valid reason to discount expected value, it does not support a moral discount on wellbeing itself. The appeal to temporal location as a morally irrelevant property stands unrefuted, and the charge that tracking macroeconomic variables is arbitrary fails against the requirement that ethics must respond to material conditions. We must commit to the view that $\rho$ should be zero, accepting that in a shrinking world, impartiality requires us to value the future more than the present, and in a growing world, less—without a fixed moral tax on time itself.
