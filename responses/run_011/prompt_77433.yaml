  So I'm not a philosophy person, I just think about this stuff lying in bed and I can't seem to stop. I built an argument about willpower and the more I stare at it the more I think every step is obviously true, but the conclusion is completely unhinged, so something has to be broken and I can't find it.

  The setup: it's 11pm, I decided this morning I'd sleep early, and I pick up my phone anyway. Standard.

  (1) What somebody wants, right now, just is what they'd choose if you asked them right now. There's nothing else for it to be — anything deeper would be invisible even to them.

  (2) At 11pm, asked right now, I'd rather scroll than sleep. That isn't me being confused about my own mind. It's a real preference, exactly as real as the one I had at 9am when I made the plan.

  (3) Nothing can make an action good for a person except that it gets them what they actually want. Anything else means somebody else claims to know my good better than I do.

  (4) So scrolling at 11pm is good for me. It gives the 11pm me precisely what he wants.

  (5) The 9am plan isn't a competing preference that got defeated. It belonged to a guy who no longer exists. Making the 11pm me answer to it is like making me answer to a promise a stranger made.

  (6) And the same thing goes for any moment you care to pick: whatever I choose at a moment is what I most want at that moment, and getting what you most want is good for you. So at every moment of my life I'm doing the best thing available for myself.

  (7) Therefore weakness of will is impossible. Nobody ever knowingly acts against their own interest. Self-control is just an earlier version of me bullying a later one, and commitment devices — the alarm clock across the room, the app blocker, deleting her number — are just elaborate ways of arranging for a future stranger to be manipulated into doing something he doesn't want. Which would mean every discipline project is based on a mistake about who's doing the acting, and diets and addiction treatment and saving for retirement are all one big confusion.

  I don't believe (7). I've used a blocker app for about a year and I'm pretty sure its helping — I'm not being bullied by 9am me, or if I am, I hired him to do it. So where does the chain break?

