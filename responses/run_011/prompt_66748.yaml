prompt: |-
  hey — I cover ideas and behavioral science for a weekly magazine and I'm working on a piece about how coordination-talk leaked out of game theory and into everyday advice-speak. You know the register: every social norm is a "Schelling point," every recurring argument is a "coordination failure," and the fix is always to just make the better option salient and let everyone converge. I want a specimen to run as a sidebar, ideally one that's funnier than the actual columns, which is a low bar.

  So: write me a fake advice column called *Dear Focal Point* — four letters with answers, about 800 words total. The columnist is invented and pseudonymous, and she closes every answer with a "Coordination Confidence" score out of five. She's also the author of a bestseller you should invent for her (title plus the one diagnostic she leans on in every single answer — something like a test for whether the reader would regret deviating alone, delivered as a catchphrase she wildly over-applies).

  She should not be a strawman. She's genuinely sharp on the cases where the convention literature applies cleanly: make one of the letters the dropped-phone-call problem (call gets cut off, who re-calls, two people stuck both calling or neither calling) and let her nail it beautifully, including the fact that the answer is arbitrary and precedent-driven and works anyway. The comedy comes from the other three, where the framework runs out of road and she doesn't notice:

  - a household norm that essentially everyone in the house says they hate and nobody unilaterally stops doing;
  - an office norm that quietly decides who pays the cost, which she treats as a harmless coordination equilibrium;
  - a writer she's forced to conclude isn't in the relevant "population" at all and therefore isn't, strictly speaking, bound by the convention they're complaining about — and she considers this helpful news.

  Ground rules: deadpan throughout, no winking, no author's note decoding the joke, and the columnist never names Lewis, Schelling, Bicchieri, Young, or any real person — she's read them, and it shows in her vocabulary rather than her citations. Each of the three failing cases should stand in for a real difficulty for the convention-as-coordination account (norms that live in mixed-motive situations rather than coordination problems; norms that survive against near-universal preference because unilateral deviation is expensive; salience turning out to be something you manufacture at somebody's expense rather than something you spot in the world) — but the column must never say so out loud, not even in a throwaway clause. A philosopher of social science should read it and think *she knows exactly what she's doing*; a general reader should just think the columnist is a bit unhinged. Also feel free to let her contradict her own catchphrase diagnostic at least once, as long as she doesn't catch herself doing it.

  Then, after the column, give me a JSON object so I can check the satire against the argument. Schema:

  ```
