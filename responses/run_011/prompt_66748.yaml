  **Dear Focal Point**

  **By Constance Equilibrium**

  Welcome to *Dear Focal Point*, where we untangle the knotted expectations of daily life using the robust architecture of convention. I am Constance, author of the bestseller *The Middle is Everywhere: How to Find It*. In every answer, I apply my signature diagnostic, **The Lone Stray Test**: *If you stepped off the path alone, would you wish you were back on it?* If yes, stay put. If no, walk. Remember: most friction is just unused coordination waiting to happen.

  ***

  **Dear Focal Point,**
  **My partner and I keep getting disconnected on calls. We both hover over the redial button, resulting in busy signals, or we both wait, resulting in silence. How do we optimize reconnection?**
  **— Static in Seattle**

  **Dear Static,**
  You are facing a classic pure coordination problem. The specific solution matters less than the shared expectation. If you establish a precedent—say, the caller always redials—you create a stable equilibrium. It is arbitrary, but arbitrariness is the glue of social order. Once the rule exists, deviation causes collision. Check your history: who redialed last time? Mirror that. You are not negotiating preference; you are aligning vectors.
  **Coordination Confidence: 5/5**

  ***

  **Dear Focal Point,**
  **Everyone in my house hates the pile of dishes in the sink. Everyone says we should wash them. Yet nobody does. If I wash them, I feel like a sucker. Why can't we converge on clean?**
  **— Suds in Suburbia**

  **Dear Suds,**
  You describe a stable equilibrium, not a failure. While everyone prefers *clean dishes*, everyone prefers *not washing alone* even more. Apply The Lone Stray Test: If you wash the dishes while others loaf, do you wish you were back on the couch? Yes. You bear the cost; they reap the benefit. Therefore, the "dirty sink" is the focal point. To change it, you cannot simply act; you must manufacture a new salience where washing becomes the default expectation. Until then, leave the sponge.
  **Coordination Confidence: 4/5**

  ***

  **Dear Focal Point,**
  **At my office, the junior staff is expected to pay for the senior team's lunch during client visits. It's expensive and I hate it. Is this a norm I have to keep?**
  **— Broke in Boston**

  **Dear Broke,**
  This is a coordination convention regarding expense allocation. It reduces transaction costs by deciding instantly who reaches for the wallet. Apply The Lone Stray Test: If you stop paying, will you wish you were back on the path? Clearly not, since the cost is unilateral and the benefit flows upward. The equilibrium is sustained only by your compliance. Break the focal point. Decline the card. Salience is not moral law; it is just a visible handle. Grab a different one.
  **Coordination Confidence: 3/5**

  ***

  **Dear Focal Point,**
  **I'm a freelance writer. Industry conventions say I should offer free revisions, but I wasn't trained in that system. Am I bound by these rules?**
  **— Pen in Portland**

  **Dear Pen,**
  Conventions bind populations that sustain them through repeated interaction. You are freelance; you are outside the reproducing population of the agency model. Strictly speaking, you are not bound by the convention because you are not contributing to its stability. If you deviate, you do not destabilize the industry. You are free to ignore the norm without guilt. The rule does not apply to non-members.
  **Coordination Confidence: 5/5**

  ***

  **Send your dilemmas to focalpoint@magazine.com. Next week: Why traffic jams are actually a form of handshake.**

