answer: |-
  ### The Case of the Municipal Mandate

  The setting is a coastal province in a failed state where the national constitution has been suspended by President V., a legitimately elected leader who now rules by decree. V. controls the army and the capital, but local municipal councils still manage water, sanitation, and local dispute resolution because the central state has abdicated these functions. In this province, the Council of Elders—the legally constituted municipal body from before the suspension—continues to meet secretly. They document V.'s agents executing citizens without trial, stealing food shipments, and dissolving local courts. The Council determines that V. has forfeited his care for the common good and is actively destroying the community they are charged to protect. There is no army loyal to the constitution, no international intervention is forthcoming, and the churches have no temporal power to restrain him.

  Elias is a fisherman and a father of three, with no official role in the Council, no military training, and no weapon other than a hunting rifle he owns legally. He is not a factionalist; he refuses to join the underground militias because they target V.'s ethnic supporters. The Council, recognizing they lack coercive force to arrest V. but retain moral authority as the last representatives of the local common good, convenes a quorum. They vote unanimously to commission Elias to eliminate V. during his upcoming visit to the port. They do not promise him safety, office, or money. They frame the mandate not as a political coup but as an act of protective justice, analogous to killing a rabid dog threatening the village. Elias accepts solely to stop the executions. He waits for V. to appear alone on the pier, shoots him once in the head, and surrenders to V.'s deputy, who assumes power automatically under the old chain of command. No bystanders are harmed; no riots follow.

  The Council's mandate is the only authority Elias claims. He does not claim divine inspiration, nor does he claim a personal right to punish. He argues that he acted as the instrument of the Council, which holds the residual authority of the community because the national ruler abandoned the common good. The Council did not declare themselves the new government; they acted only to remove the obstacle to lawful order. The succession passes to the deputy, whose claim rests on the old constitution, not on Elias's act. The community remains intact, the water continues to flow, and the executions stop. The act is singular, deliberate, and devoid of collateral damage or personal gain.

  ***

  ### Demonstration of Specification

  **1. Verdicts of Thomas's Framework**
  *   **On Private Killing (*ST* II-II, q. 64, a. 3):** Thomas forbids private individuals from killing sinners, reserving this to public authority. However, he allows exceptions where the act is not "private" in the moral sense. Here, the feature satisfying the requirement is the **Council's Mandate**. If the Council counts as a legitimate bearer of public authority in the vacuum left by the tyrant, Elias acts as a public minister, not a private person. The verdict turns on whether the Council's residual status suffices for "public authority."
  *   **On Sedition (*ST* II-II, q. 42, a. 2):** Sedition is opposed to the unity of the multitude. Thomas notes that if a tyrant fosters sedition by dividing the community for private gain, removing him may not be sedition, provided it does not cause greater harm. The feature satisfying the requirement is the **Absence of Collateral Disorder**. Because the succession is automatic and the Council represents the unity of the local community rather than a faction, the act restores unity rather than disrupting it. The greater-harm qualification is met because the tyranny is actively destroying lives, whereas the removal causes only the death of the tyrant.
  *   **On Kingship (*De Regno*):** The text warns against private presumption, urging patience or appeal to a superior. However, it also states that if a tyrant destroys the common good, he forfeits his claim to obedience. The feature satisfying the requirement is the **Unavailability of Superior Authority**. Since no external power or constitutional organ exists to appeal to, the "patience" clause yields to the necessity of preserving the community. The act is not presumptuous if it is executed on behalf of the community's retained authority.

  **2. The Single Feature Doing the Work**
  The element converting the private person into a public person is the **formal delegation from a body representing the multitude's residual custodial power**. It is not the justice of the cause alone, nor the desperation of the situation, but the specific transmission of the community's right of self-preservation through a deliberative body that still functions *as* a community organ. For Aquinas, authority is not merely power; it is *ordo* (order). The Council's vote provides the *ordo* that distinguishes this from mob violence. Elias becomes an instrument of the *res publica* because the *res publica* (in the form of the Council) actively wills the act through him.

  **3. Removal Test**
  Remove the Council's Mandate. Elias acts on his own judgment that V. is a tyrant.
  *   **First Flip:** The verdict on **Private Killing** flips immediately to illicit. Without the mandate, Elias is a private person killing a ruler, which Thomas explicitly forbids as usurping God's judgment and public power.
  *   **Degradation:** The case degrades into **straightforward homicide** compounded by **sedition**. Even if V. is evil, Elias's private act disrupts the order of authority. It becomes a sin of presumption, regardless of the outcome. It is not merely inexpedient; it is morally unlawful because it lacks the public character required to licitly take life.

  **4. Pressing the Instability**
  The instability lies in the ontological status of the Council. A body strong enough to confer public authority should logically possess enough coercive power to enforce order itself; a body too weak to act openly looks like a conspiracy. The middle ground exists only if **authority is distinct from coercive power**. The Council must be recognized by the community as the legitimate voice of the common good (moral authority) while lacking the swords to enforce it (coercive power). This is possible in a collapsed state where social trust remains in local institutions even when central force has failed. However, if the Council is merely a secret group without public recognition, it is a faction, and the delegation is void. The body must be *actually* representative, not just *self-styled*. If the community does not acknowledge the Council as their voice, the "public authority" is fictitious, and the route collapses.

  **5. The Friend's Best Attack**
  Your friend would argue that in a collapsed state, there is no "multitude" in the Thomistic sense, only a disaggregated crowd. Thomas defines the people not as a gathering of individuals but as a unity ordered by law toward the common good. Without the ruler and the constitution, the legal bond is severed. Therefore, the Council is not a public body but a private association. Any mandate they issue is private, making Elias a private killer. Furthermore, *De Regno* explicitly warns that removing a tyrant often leads to worse tyranny because the order of authority is broken. Your friend would say you are smuggling in a modern democratic assumption (that authority always reverts to the people) that Thomas does not hold. For Thomas, authority comes from God *through* the people, but once established, it is not easily reclaimed without creating greater disorder. He would conclude your case is sedition disguised as public justice.

  ***

  ### Committed Verdict

  **Does the case genuinely license the killing on Aquinas's own principles?**
  No, not strictly. While your "third route" is metaphysically coherent within a Thomistic understanding of authority (that it resides ultimately in the community for the common good), Aquinas's moral theology prioritizes *ordo* and the avoidance of scandal over abstract rights of resistance. For Thomas, "public authority" implies an established office within a recognized hierarchy. An *ad hoc* delegation from a local council in a vacuum of power lacks the stability Thomas requires to licitly take life. He fears the precedent more than the specific tyranny. In his explicit texts, the only exceptions to the ban on private killing are divine commission or established public office. Your case tries to stretch "public office" to include "emergency delegation," which Thomas does not explicitly endorse.

  **Is the third route real or is it divine commission with theology deleted?**
  It is **divine commission with the theology deleted**, which makes it unstable. In Thomas's framework, extraordinary acts outside the normal order of authority require extraordinary justification (divine instinct). By removing the divine element but keeping the extraordinary nature of the act (private person killing ruler), you create a gap. You are asking the "multitude" to act as God's proxy without God's explicit warrant. Later Scholastics (like Suarez) filled this gap with explicit theories of popular sovereignty, but Thomas himself remains cautious. Your route is a valid *development* of Thomism, but it is not Thomas's own explicit teaching.

  **Where I would put my weight:**
  I would side with your **metaphysical intuition** but your **friend's textual reading**. You are right that authority belongs to the community and can revert in extreme cases; this is consistent with the purpose of authority in Thomas's system. However, your friend is right that Thomas does not provide a clear procedural mechanism for this reversion without risking greater evil (sedition). If the argument resumes tonight, concede that Thomas's *explicit* texts favor your friend (patience, appeal to superior, no private presumption), but argue that the *principles* of the common good and the nature of authority support your route *if* the body conferring authority is indisputably representative. The bottleneck is not the theory of authority, but the prudential judgment of whether the act causes more harm than the tyranny. In your scenario, if the Council is truly representative and the harm is certain, the act is defensible on Thomistic *principles*, even if Thomas himself would likely counsel against it due to the risk of disorder.

  **Textual Dependency Flag:**
  This verdict depends heavily on the authorship of *De Regno* Book II. The chapters discussing tyranny and resistance most explicitly are often attributed to **Ptolemy of Lucca**, not Thomas. Ptolemy is more republican and open to communal authority than Thomas. If we restrict ourselves to Thomas's authentic works (Book I of *De Regno* and the *Summa*), the case for resistance is weaker and more cautious. Thomas's own voice emphasizes stability and the danger of private presumption more than the right of the multitude to reclaim power. If you rely on the tyranny chapters to support your view, you are likely relying on Ptolemy. This does not invalidate your route, but it means you are arguing from a Thomistic *school* position, not necessarily Thomas's own explicit verdict.
