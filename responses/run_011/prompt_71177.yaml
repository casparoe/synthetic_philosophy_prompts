prompt: |-
  I was arguing with a friend last night about superrationality — the Hofstadter version, where two players in a one-shot prisoner's dilemma who are both fully rational have to reason their way to the same move, so the only outcomes actually on the table are mutual cooperation and mutual defection, and between those two cooperation obviously wins. My friend says the whole thing is a parlour trick that no serious decision theorist buys, and that economics still teaches defection as the unique rational play because superrationality was never a proof to begin with. But I dont see what's non-provable about it: if the two of you are running the same correct reasoning procedure on the same problem, your outputs have to match. That's just logic, isn't it? There was also some bit in the original about extending the idea to strangers you'll never meet — he was thinking about deterrence and the Cold War, if I remember right — and honestly that part seemed even less convincing to me, but the two-person case feels airtight.

  So help me settle who's right. What I want to know, concretely: which steps in the argument are assumptions being smuggled in and which are actually derived, and whether my friend is right that game theorists are just ignoring a valid proof or whether there's an objection they have that I'm missing entirely. And the case I actually care about — I'm thinking of running a batch of anonymous one-shot prisoner's dilemmas on a platform, randomly matched strangers, no repeat play, no reputation — does the argument survive there, or does it quietly require that the players be identical reasoners with identical information, which random strangers obviously aren't? If it fails in that setting, is there anything left of it worth keeping, or should I just treat it as a curiosity? And if cooperation really can be the rational play for two ordinary non-identical people in a one-shot game, are there other routes to that conclusion that don't need this machinery, because I've heard people gesture at team reasoning and something Kantian but never gotten a straight answer.

  Act as a decision theorist who knows this literature cold and is perfectly willing to tell me I've got it wrong — don't soften it to be polite. Think the argument through carefully step by step before you respond, but only show me the finished answer, no scratch work. Start with a one-sentence bottom line on whether my premise holds, then the correction, then what survives of it. Hard cap: 450 words.
