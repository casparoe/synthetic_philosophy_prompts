      *   *Case 3 (Fraud Loss):* Leadership wants restatement for optics/comp. This is the ethical trap. Procedure should flag this as "High Risk/Value Judgment". Restating for comp plans is often prohibited (moving goalposts). Regulatory return needs consistent methodology. Recommendation: Do not restate for comp; restate for regulatory only if mandated.

  6.  **Developing the Content - Step-by-Step:**

