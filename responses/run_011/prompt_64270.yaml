answer: |-
  # Metric Change Decision Protocol

  **Owner:** Data Engineering (Metrics Layer)  
  **Version:** 1.0  
  **Language:** British English  
  **Purpose:** To resolve disputes regarding metric definition changes, historical restatement, and temporal querying without requiring philosophical debate.

  ---

  ## 1. On the Philosophy Analogy

  You are correct. The problem you are facing is precisely the distinction between **rigid designators** (names that pick out the same object regardless of description, e.g., "The FTSE 100") and **non-rigid designators** (descriptions that pick out whatever fits the criteria, e.g., "The best performing index").

  In your semantic layer, most metrics are treated by stakeholders as rigid (they believe "Active Account" refers to a stable business concept) but engineered as non-rigid (they are defined by mutable SQL logic). The temporal problem (the 2022 job querying 2021 data) is a failure to distinguish between the **context of utterance** (when the query runs) and the **context of evaluation** (the period the data covers).

  **Where the analogy breaks:**
  Philosophy concerns truth conditions; engineering concerns liability and incentives. A philosopher does not care if restating history triggers a breach of contract or misleads a regulator. Therefore, this procedure adds a **Consequence Layer** that semantics alone does not cover. Do not rely on the philosophy to solve the political problem; use it only to clarify the ambiguity.

  ---

  ## 2. The Decision Procedure (MCDR Form)

  When a metric definition changes, the requesting party must complete this **Metric Change Decision Record (MCDR)**. It should take no longer than thirty minutes to complete. If a field cannot be answered, the change cannot proceed.

  ### Section A: Nature of the Change
  *Select one.*

  1.  **Conceptual Change (The Map Changed):** We are measuring the same underlying reality differently. (e.g., "Active" now requires a position, not just a login).
  2.  **Reality Change (The Territory Changed):** The measurement logic is unchanged, but the real-world rules governing the data shifted. (e.g., A regulator reclassified a fee so it now falls into the existing "Revenue" logic).

  **Sufficient Answer:** A written statement linking the change to a specific ticket, regulation document, or board decision. "We thought it made more sense" is insufficient.

  ### Section B: Usage Context
  *Select all that apply.*

  1.  **Regulatory Return:** Submitted to FCA, PRA, or similar.
  2.  **Compensation:** Feeds into bonus calculations or comp plans.
  3.  **External Reporting:** Published in board decks, investor updates, or public filings.
  4.  **Internal Operational:** Used for day-to-day monitoring only.

  **Sufficient Answer:** List the specific reports or jobs. If "Unknown", the change is blocked until traced.

  ### Section C: Historical Treatment
  *Select one default action based on Section A.*

  *   **If Conceptual Change:**
      *   [ ] **Break Series:** Historical data remains untouched. A visible discontinuity exists from the change date onwards. (Default)
      *   [ ] **Dual Run:** Both old and new definitions run in parallel for 4 quarters.
      *   [ ] **Restate:** Historical data is recalculated using the new logic. (Requires Section E sign-off).
  *   **If Reality Change:**
      *   [ ] **Restate:** History must be restated to reflect the legal reality of the past. (Default)
      *   [ ] **Break Series:** Only applied prospectively.

  **Sufficient Answer:** Selection of one option. "We'll decide later" is not permitted.

  ### Section D: Temporal Querying (The "Time Travel" Problem)
  *For jobs querying past data.*

  1.  **Operational Jobs (e.g., nightly refresh):** Must use the **Current Definition** (logic valid at query time).
  2.  **Historical Analysis (e.g., "Active in 2021"):** Must use the **Point-in-Time Definition** (logic valid at the data period).

  **Engineering Instruction:** The semantic layer must tag every metric version with a `valid_from` and `valid_to` date. Queries specifying a historical period must resolve to the logic valid during that period. If the infrastructure cannot support versioned logic, the default is **Current Definition**, and this limitation must be recorded in Section E.

  ### Section E: Risk & Sign-off
  *This section captures the value judgments.*

  1.  **Does restating history improve or worsen the reported number?**
      *   [ ] Improves (e.g., losses look lower)
      *   [ ] Worsens (e.g., revenue looks lower)
      *   [ ] Neutral/Mixed
  2.  **Who accepts the liability for this decision?**
      *   Name: ___________________ (Data Steward)
      *   Name: ___________________ (Business Owner of the Dashboard)
      *   Date: ___________________

  **Sufficient Answer:** Signed names. Email confirmation is acceptable if attached to the ticket.

  ---

  ## 3. The Defaults

  If the business owner cannot be found, or if the team cannot agree on Section C (Historical Treatment) within 48 hours, the following defaults apply automatically:

  1.  **Do Not Restate.** Historical data is immutable. The change applies prospectively from the deployment date.
  2.  **Annotate the Break.** The dashboard must display a visible marker at the change date explaining the definition shift.
  3.  **Current Definition Logic.** All queries, even historical ones, resolve to the latest logic until versioned logic is implemented.

  *Rationale:* It is easier to explain a broken trend line than to explain why past numbers were silently altered. Silence looks like deception; a break looks like engineering.

  ---

  ## 4. Judgment Calls Disguised as Procedure

  Be aware that the following steps are not factual determinations; they are political decisions dressed up as technical ones. You must record the outcome, but do not pretend the procedure solved the conflict.

  1.  **Section A (Map vs. Territory):** Stakeholders will claim a Reality Change to force a Restate (to make numbers comparable) when it is actually a Conceptual Change. You must verify this against external documentation (e.g., the actual regulation text).
  2.  **Section E (Liability):** Getting a signature does not remove your responsibility if the change breaches regulatory standards. If a sign-off asks you to do something legally dubious, the procedure stops and escalates to Legal/Compliance.
  3.  **Section D (Temporal Logic):** Deciding whether a job is "Operational" or "Historical" is often ambiguous. A job written in 2022 running today is operationally current but historically scoped. You must classify it based on *intent*, which requires human input.

  ---

  ## 5. Case Studies

  Here is the procedure applied to your three scenarios.

  ### Case 1: "Active Account" Tightening
  *Scenario: Login (90 days) → Login + Open Position.*

  *   **Section A:** **Conceptual Change.** The business rule changed, not the underlying reality of the past.
  *   **Section B:** Internal Operational & Board Decks.
  *   **Section C:** **Dual Run.** Since this affects board decks, a simple break is risky. Run both series for 4 quarters. Do not restate history silently.
  *   **Section D:** **Point-in-Time.** Queries asking for "Active in 2021" should use the 2021 definition (Login only).
  *   **Outcome:** The trend line will show a divergence starting now. The board sees the impact of the new stricter definition without corrupting the historical record.
  *   **Cost:** Engineering effort to maintain two logic branches for 4 quarters.

  ### Case 2: The 2022 Job Querying 2021
  *Scenario: Scheduled job written in 2022 asks for "accounts active in 2021". Runs today.*

  *   **Section A:** N/A (This is a querying issue, not a definition change).
  *   **Section D:** **Classification Required.**
      *   If the job is for **Audit/Compliance**: It must use the **Point-in-Time Definition** (what "active" meant in 2021). Restating this with new logic falsifies the historical record.
      *   If the job is for **Current Risk Modelling**: It should use the **Current Definition**. If you are modelling risk today, you want to know which 2021 accounts fit *today's* risk profile.
  *   **Procedure Verdict:** You must tag the job. If untagged, default to **Current Definition** (per Section 3 Defaults), but flag this as a technical debt item.
  *   **Recommendation:** For this specific job, it sounds like a historical report. Force **Point-in-Time** logic. If your layer cannot support this, you must document that the number is "2021 data evaluated under 2024 rules" on the output.

  ### Case 3: "Fraud Loss" Broadening (The Trap)
  *Scenario: Post-incident, broadened to include previously excluded category. Leadership wants history restated to show losses going down (new definition sweeps in more money, but presumably the incident was an outlier, or they want to show improvement since? Wait, prompt says "broadened... to include a category... leadership wants historical series restated... so the chart shows the new measure going down since the incident".*
  *Correction on logic:* If you broaden "Fraud Loss" to include *more* things, the absolute number usually goes *up*. If leadership wants the chart to show the measure going *down*, they likely mean they want to show that *since* the incident, controls improved, but they want the historical baseline adjusted so the trend looks like a steady improvement rather than a spike. Or, they want to reclassify the incident loss itself.
  *Let's assume the prompt's core conflict:* Leadership wants restatement to manipulate the trend line for comp/regulation.

  *   **Section A:** **Conceptual Change.** You changed the definition of loss.
  *   **Section B:** **Compensation & Regulatory Return.** (Critical).
  *   **Section C:** **Do Not Restate.**
      *   **Reasoning:** Restating historical fraud losses for compensation purposes is effectively changing the targets after the game has been played. For regulatory returns, consistency is required unless the regulator mandates the change.
  *   **Section E:** **Escalate.**
      *   **Risk:** If you restate history to lower past losses, you may be misrepresenting past risk exposure to regulators. If this feeds comp, you are altering past earnings calculations.
      *   **Sign-off:** A Data Steward cannot sign this off alone. This requires Compliance Officer sign-off.
  *   **Procedure Verdict:** **Reject the Restate.**
      *   Run the new definition prospectively.
      *   If leadership insists on a trend line, run a **Dual Series** labelled "Legacy Fraud Measure" and "Enhanced Fraud Measure".
      *   **Cost:** Leadership will be unhappy. The chart will show a spike (the incident) and then a new baseline. This is the truthful cost. If you restate, you incur **Regulatory Risk** and **Integrity Risk**. The procedure protects you here: Section B flags "Regulatory/Comp", which triggers a higher bar for Section C. The default (Do Not Restate) holds unless Compliance forces otherwise.

  ---

  ## 6. Implementation Notes

  1.  **Storage:** Store each completed MCDR in the same repository as the metric definition code (e.g., alongside the dbt model or semantic layer config). Link the ticket ID in the code comments.
  2.  **Versioning:** Your semantic layer must support metric versioning. If it does not, you cannot safely execute Section D. Treat this as critical infrastructure debt.
  3.  **Audit:** Once a year, sample 10% of changed metrics and verify the MCDR matches the implemented logic.

  **Final Word:**
  This procedure will not stop arguments. It will merely move them from "What should we do?" to "Who is willing to sign for this?". That is the correct place for them to live.
