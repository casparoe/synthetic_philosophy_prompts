          *   **Constraint:** British English (London team, no Americanisms).
          *   **Constraint:** No reading list/citations.

  2.  **Deconstruct the Philosophy Analogy:**
      *   *Rigid vs. Non-Rigid Designation:* A rigid designator refers to the same object in all possible worlds (e.g., "Napoleon"). A non-rigid designator refers to whatever fits the description in that world (e.g., "the President of France").
      *   *Two-Dimensional Semantics:* Distinguishes between primary intension (what the term picks out given how the world turns out) and secondary intension (what the term picks out given the actual world fixed).
      *   *Application to Data:*
          *   "Active Account" is likely a non-rigid designator (it picks out whatever fits the definition).
          *   However, stakeholders often treat it as rigid (they think "Active Account" refers to a specific *concept* of business health, not just the SQL logic).
          *   The temporal query problem (2022 job asking about 2021) is exactly the "actual world vs. counterfactual" problem. Do we evaluate the definition at the time of query (now) or the time of data (then)?
      *   *Where it breaks:* Philosophy deals with truth conditions; data engineering deals with *consequences* (regulatory fines, comp plans, board trust). Philosophy doesn't care about GDPR or FCA regulations; engineers do. Also, philosophy assumes rational actors; data stakeholders often act out of self-preservation.

  3.  **Drafting the Procedure (The "Metric Change Protocol"):**
