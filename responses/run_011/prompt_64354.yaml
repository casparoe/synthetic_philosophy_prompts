answer: |-
  The demandingness objection is often wielded as a monolithic blunt instrument against consequentialism, but as your prompt notes, it conceals a tripartite structure. The **Cost Complaint** argues that the *magnitude* of sacrifice required is too high; the **Fair-Share Complaint** argues that the *distribution* of sacrifice is unjust in conditions of partial compliance; and the **Integrity Complaint** argues that the *source* of the requirement alienates the agent from their own life.

  The conceptual problem facing the consequentialist is that these three complaints form a trilemma. The standard tool for managing demandingness—the distinction between the **criterion of rightness** (what makes an act right) and the **decision procedure** (how an agent should deliberate)—tends to resolve one complaint only by exacerbating the others. A strategy that lowers the direct cost often destabilizes the fair-share limit, and a strategy that protects integrity often reveals itself as a deeper violation of that same integrity.

  ### 1. The Cost Complaint: Relocation rather than Removal

  The Cost Complaint suggests that requiring agents to maximize the good imposes burdens (loss of resources, projects, leisure) that exceed the limits of plausible morality. The standard consequentialist reply utilizes the criterion/decision-procedure distinction. The theory argues that while the *right* act is the one that maximizes the good, the best *decision procedure* for an agent to adopt is not direct maximization. Instead, the agent should cultivate dispositions—such as love for family, commitment to personal projects, or moderate altruism—that generally produce good outcomes without requiring constant calculation.

  However, this distinction does not genuinely remove the cost; it merely relocates it from the level of action to the level of psychological cultivation.

  Consequentialism remains a maximizing theory at the meta-level. The choice of which dispositions to cultivate is itself assessed by the criterion of rightness. If a disposition of "moderate generosity" is endorsed, it is not because the agent has a right to their resources, but because cultivating "extreme generosity" would lead to burnout or diminishing returns, thereby producing less overall good. Consequently, the cost is not eliminated; it is optimized. The agent is still required to bear whatever burden is necessary to maintain the optimal disposition.

  Furthermore, the maintenance of these dispositions carries its own costs. Monitoring oneself to ensure one is not slipping into direct maximization, or suppressing the impulse to give more when the stakes are high, requires psychic energy and cognitive load. If the consequentialist calculus determines that a different disposition would yield slightly more good, the agent is theoretically required to undergo the costly process of re-engineering their psychology. Thus, the Cost Complaint is not answered by showing that morality asks less of the agent, but by arguing that the *most efficient* amount it asks is lower than direct calculation suggests. The demand remains total; only the target of the demand shifts from specific acts to character traits.

  ### 2. The Fair-Share Complaint: The Instability of the Stopping Point

  The Fair-Share Complaint arises specifically in non-ideal theory. If others are not contributing to the collective good, why must the conscientious agent pick up the slack? To answer this, the consequentialist often leans heavily on the decision-procedure distinction: "Do not try to compensate for others' failures; simply follow the disposition that generally works best."

  This move, however, makes the Fair-Share Complaint harder to answer, not easier. By invoking the decision procedure to tell the agent to "stop short" of the optimum (i.e., do not save everyone if others won't help), the consequentialist appears to concede that there is a legitimate stopping point—a limit to what can be asked of an individual regardless of the consequences.

  The problem is fixing that point.
  1.  **If the point is fixed consequentially:** The limit is contingent. If the stakes are high enough (e.g., preventing a catastrophe), the consequentialist calculus will dictate that the agent *must* absorb the shortfall, because the bad outcome of not doing so outweighs the unfairness to the agent. The "fair share" dissolves back into "whatever is necessary to maximize the good." The decision-procedure distinction offers no principled shield against being swamped by others' non-compliance; it only offers a heuristic that fails in extreme cases.
  2.  **If the point is fixed non-consequentially:** If the theorist argues that the agent has a right to stop at their fair share *even if* doing more would produce better outcomes, they have abandoned pure consequentialism. They have introduced a deontological constraint or a non-consequentialist principle of fairness.

  Thus, the criterion/decision-procedure distinction creates a tension. It tries to have it both ways: it wants to use the *appearance* of a fair-share limit to answer the objection, while retaining the *reality* of the maximizing criterion to answer the Cost Complaint. But this leaves the agent in a precarious position. They are told to follow a procedure that respects their limits, but they know that the justification for that procedure is purely instrumental. If the instrument breaks (i.e., if picking up the slack becomes the only way to maximize), the limit vanishes. The distinction aggravates the Fair-Share complaint by highlighting that the agent's protection is merely provisional, dependent on empirical circumstances rather than moral right.

  ### 3. The Integrity Complaint: The Structure of Agency

  The Integrity Complaint, associated with Bernard Williams, is the most resistant to the criterion/decision-procedure distinction. Williams argues that consequentialism attacks the integrity of the agent by requiring them to view their own deepest commitments (projects, relationships) from an impersonal standpoint, as mere items to be weighed against the general welfare.

  The consequentialist reply is typically to prescribe an indirect deliberative style: "Do not weigh your projects impartially; live them directly." However, this reply fails to meet the Integrity Complaint because the complaint is not about the *content* of deliberation, but about the *structure of justification*.

  The Integrity Complaint claims that morality should issue from the agent's own standpoint, not from a standpoint outside them. When a consequentialist prescribes a disposition of "partiality to one's own projects," they are doing so from the impersonal standpoint. The agent is effectively saying, "I am pursuing my child's happiness *because* the universe's happiness is maximized when I do so." The source of the action remains external. The agent is still alienated from their motives because the *authority* of those motives lies in a calculus they are forbidden to run but which nonetheless governs them.

  This leads to a paradox of self-effacement. If the theory tells the agent to ignore the theory to preserve their integrity, the act of following that instruction is itself an exercise of the impersonal standpoint. The agent is treating their own integrity as a resource to be managed for the sake of the good. To truly meet the Integrity Complaint, the theory would have to concede that the agent's standpoint has authority *independent* of its contribution to the impersonal good. But to do so would be to cease being consequentialist. Therefore, prescribing indirect deliberation does not cure the corrosion; it merely hides the corrosive agent (the impersonal criterion) behind a wall of psychology that the criterion itself erected.

  ### Conclusion: The Fate of the Unified Objection

  When these three complaints are prised apart, the "unified" demandingness objection fragments. The **Cost Complaint** is largely empirical; it depends on how much sacrifice is actually required to maximize the good and how efficiently dispositions can be cultivated. The **Fair-Share Complaint** is structural and political; it concerns the distribution of burdens in a non-ideal world. The **Integrity Complaint** is metaphysical and psychological; it concerns the relationship between the agent and the source of moral authority.

  Because they are distinct, a consequentialist is theoretically better served by **facing them separately**.
  *   Against **Cost**, they can argue for optimized dispositions and empirical claims about diminishing returns.
  *   Against **Fair-Share**, they must bite the bullet or move toward rule-consequentialism, acknowledging that in extreme cases, the conscientious agent may indeed be required to do more than their share.
  *   Against **Integrity**, they must either deny that alienation is a moral problem or argue that the impersonal standpoint is the only valid moral standpoint.

  However, **resisting the separation** has rhetorical and dialectical utility for the critic. Treating the objections as a unified whole captures the cumulative psychological weight of the theory. A theory that demands high costs, distributes them unfairly, *and* alienates the agent is worse than the sum of its parts. Separating them risks allowing the consequentialist to trade off solutions: "We reduce the Cost by accepting more alienation (indirect deliberation)," or "We protect Integrity by accepting higher Costs (maintaining complex dispositions)."

  What is lost by separating them is the recognition that these problems stem from a single root: the **sovereignty of the impersonal standpoint**. Whether that standpoint demands high costs, unfair distributions, or psychological alienation, it remains the master. By treating the complaints separately, we risk obscuring the fundamental tension between the agent's personal life and the impersonal good. Yet, by keeping them unified, we risk conflating empirical claims about cost with structural claims about agency, allowing the consequentialist to solve empirical problems while ignoring the structural ones.

  Ultimately, the conceptual problem reveals that the criterion/decision-procedure distinction is a pivot that cannot support the weight of all three complaints simultaneously. It lowers the perceived Cost by introducing indirectness, but that very indirectness destabilizes the Fair-Share limit (by making it contingent) and deepens the Integrity violation (by making the agent's psychology a tool of the impersonal good). The consequentialist must choose which complaint to leave unanswered, for there is no configuration of the theory that neutralizes all three without ceasing to be consequentialist.
