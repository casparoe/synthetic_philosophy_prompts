      *   *Check:* Did I address integrity as structure of agency? *Yes, distinguish between "what I do" and "why I do it." The "why" remains impersonal.*
      *   *Tone:* Philosophical, precise, analytical. Avoid colloquialisms.
      *   *Key Terminology:* Criterion of rightness, decision procedure, indirect consequentialism, impartial standpoint, alienation, self-effacing.

  5.  **Final Review against Prompt Requirements:**

