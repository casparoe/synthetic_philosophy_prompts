  Here's a thinking process that leads to the essay:

  1.  **Deconstruct the Prompt:**

      *   **Core Topic:** The demandingness objection to consequentialism.
      *   **Premise:** The objection is often treated as one, but actually consists of three distinct complaints: Cost, Fair-Share, and Integrity.
      *   **Task:** Explain the conceptual problem that replies to one complaint often aggravate another (the "trilemma").
      *   **Specific Points to Address:**
          1.  *Criterion/Decision-Procedure Distinction & Cost:* Does it remove cost or relocate it? (Cultivating dispositions has costs; choice of dispositions is consequential).
          2.  *Criterion/Decision-Procedure Distinction & Fair-Share:* Why does this make fair-share harder? (If you stop short of optimum, what fixes the point? Can it be fixed consequentially without reintroducing impartial calculus?)
          3.  *Integrity Complaint:* Why does it resist both replies? (Structure of agency vs. aggregate sacrifice. Is prescribing indirect deliberation itself an exercise of the objectionable standpoint?)
      *   **Conclusion:** Assess the unified objection after prising them apart. Should consequentialists resist separation or face them separately? What is lost either way?

  2.  **Initial Brainstorming & Structuring:**

      *   *Introduction:* Define the three complaints clearly. State the thesis: they form a trilemma where solving one exacerbates the others, particularly regarding the criterion/procedure distinction.
      *   *Section 1: The Cost Complaint & The Distinction.*
          *   Standard reply: Indirect Consequentialism (maximize good by *not* trying to maximize good directly).
          *   Problem: Dispositions cost energy/time to cultivate. If the best disposition is "moderate altruism," consequentialism endorses it *because* it produces the best outcomes.
          *   Relocation: The cost isn't gone; it's optimized. The agent still serves the impersonal good, just via a different route. The "burden" is still defined by the criterion.
      *   *Section 2: The Fair-Share Complaint & The Distinction.*
          *   Problem: Partial compliance. Why should I do more because others don't?
          *   Consequentialist reply via distinction: "If you try to do everyone's share, you burn out/collaborate poorly. So, adopt a disposition to do *your* share."
          *   The Trap: What defines "my share"? If it's defined consequentially (what produces the best outcome given others' failure), then I might still be required to pick up the slack if that produces the best outcome. If it's defined non-consequentially (a deontological limit), the theory ceases to be purely consequentialist.
          *   Result: The distinction makes it look like a concession, but the underlying criterion still pulls toward absorbing the slack.
      *   *Section 3: The Integrity Complaint & The Distinction.*
          *   Williams' point: It's about alienation from one's projects.
          *   Resistance: Indirect consequentialism says "hold your projects dear." But *why*? Because the Impersonal Standpoint says so.
          *   The Deep Problem: The justification remains external. The agent is still a vessel for the impersonal good. Even self-effacing theory (theory says "ignore me") is still a theory dictating that ignoring is best. The "corrosive" standpoint remains the master, even if it commands silence.
      *   *Conclusion:* Synthesis.
          *   Unified objection? It fragments. Cost is empirical/optimizable. Fair-share is structural/political. Integrity is metaphysical/psychological.
          *   Strategy: Facing them separately is better analytically, but resisting separation might be rhetorically stronger for critics.
          *   Loss: Treating them separately loses the cumulative psychological force. Treating them together obscures specific solutions.

  3.  **Drafting - Section by Section (incorporating specific constraints):**

      *   *Intro:* Establish the three types. Introduce the Criterion/Procedure (C/DP) distinction as the primary tool. State the tension.
      *   *Cost:* Focus on "relocation." A disposition to be moderately generous is chosen *because* it maximizes utility. The cost of maintaining that disposition (psychic energy, opportunity cost of not being more generous) is still weighed against the good. So the "demand" is just the optimal demand, not necessarily a reduced one.
      *   *Fair-Share:* This is the trickiest. If I adopt a "fair share" disposition, is that because it's fair or because it's optimal? If optimal, then in emergencies (or high stakes), the "fair share" limit vanishes. The C/DP distinction suggests "don't calculate," but if the *choice* of disposition is calculated, the impartial calculus returns at the meta-level. It concedes a stopping point but cannot justify it non-consequentially.
      *   *Integrity:* This is about the "source" of action. Williams argues the justification comes from outside the agent's life. Indirect consequentialism says "act from your life." But the *reason* you act from your life is "because the universe requires it." This is the "government house" utilitarianism problem. It preserves the alienation.
      *   *Conclusion:* Evaluate the "unified" objection. It's a cluster concept. Separating them helps precision but weakens the rhetorical punch of "Consequentialism is too demanding."

