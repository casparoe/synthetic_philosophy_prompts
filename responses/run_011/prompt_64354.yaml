  6.  **Final Polish:** (Mental check of flow and transitions). Ensure the transition from Cost to Fair-Share highlights the shift from *magnitude* to *distribution*, and from Fair-Share to Integrity highlights the shift from *distribution* to *source of justification*.

  *(Self-Correction Note)*: Make sure to explicitly mention that solving Cost (via indirect strategies) often worsens Integrity (because the manipulation of one's own psychology is itself alienating) and Fair-Share (because the optimal disposition might still require picking up slack). This highlights the "mutually incompatible" aspect requested.

