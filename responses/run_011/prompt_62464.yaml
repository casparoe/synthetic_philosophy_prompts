answer: |-
  *   **Understood:** The Directorate correctly grasps Arendt's distinction between rational truth (logic/math) and factual truth (contingent events). They accept her characterization of factual truth as "despotic" because it compels assent without argument. They also adopt her view that lying is a form of political action—a creative intervention rather than a mere error.
  *   **Inverted:** They treat the "despotic" nature of fact as a threat to political freedom rather than its ground. They believe curating facts *preserves* the space of appearances, whereas Arendt argued this destroys the common world. They view themselves as protecting opinion; in reality, they are eroding the substrate opinion requires.
  *   **Missed:** They fail to see that without stable factual ground, the capacity to promise and act collapses. They assume facts can be substituted without loss of reality. They believe consistency is a stylistic choice, not an ontological necessity. The handbook assumes the world is plastic enough to hold any shape they press upon it, ignoring that destroying facts eventually destroys the recorder.

  ***

  **DIRECTORATE OF PUBLIC CONFIDENCE**
  **STANDARDS OF PRACTICE, FOURTH EDITION**
  **CLASSIFICATION: INTERNAL / EYES ONLY**

  **1.0 CLASSIFICATION OF TRUTH STATEMENTS**
  Officers are reminded that all public assertions fall into two distinct categories. **Rational Truths** (mathematics, philosophy, logic) remain subject to free debate and require no clearance. **Factual Truths** (events, occurrences, statistics) are handled exclusively by licensed officers of the Directorate. Per the founding authority, Arendt, factual truth possesses a coercive quality; it arrives without argument and forecloses opinion. It is the remit of this Office to ensure that such coercion does not stifle the political realm. No officer shall release a Factual Truth without first determining its utility to the public confidence.

  **2.0 METHODS OF ADJUSTMENT**
  Concealment is deprecated as a legacy practice. To hide an intention is to leave the world intact; the Office's remit is the world itself. Furthermore, flat denial is prohibited. Denial preserves the authority of the thing denied by granting it primacy. Instead, officers shall employ **Proliferation**. When an inconvenient occurrence arises, the officer shall generate multiple competing narratives. Confusion creates space; space allows for politics.

  > **[SIDEBAR A: INDUCTION PROTOCOL 9]**
  > **Subject: Public Insistence**
  > **Question:** What procedure is required when a member of the public insists that something happened which has not been cleared?
  > **Answer:** Do not contradict. Contradiction validates the speaker's reality. Instead, acknowledge the distress caused by the memory. Redirect the conversation to the broader context. Remind the citizen that isolated events lack meaning without official interpretation. If insistence continues, classify the citizen as "Temporarily Disoriented" and refer to Welfare Services.

  **3.0 COMMISSIONING REPLACEMENT FACTS**
  When a Factual Truth must be retired, a **Replacement Fact** must be commissioned. The Replacement must be plausible, fitting what the audience already expects rather than what occurred. The Commissioning Form (CF-88) requires sign-off from two Division Heads. Officers are warned against leaving a vacancy. In Audit Case 44-B, a Replacement Fact was never arrived at following the retirement of the Bridge Collapse figures. The vacancy has begun to spread to adjacent entries; traffic reports from the surrounding quarter are now subject to spontaneous fluctuation. Officers must ensure the Replacement is installed before the original is vacated to prevent ontological drift.

  **4.0 OFFICER CONDUCT AND SELF-DECEPTION**
  To maintain operational integrity, officers are prohibited from keeping private notes regarding Directorate operations. This is not a security measure but a housekeeping rule regarding self-deception. An officer who records private contradictions risks believing them. Belief is a private state; Confidence is a public resource. Mixing the two compromises the officer's ability to act. If an officer finds themselves unable to distinguish between the Replacement and the original, they must report for Re-alignment. Consistency is not truth; consistency is reliability.

  > **[SIDEBAR B: HISTORICAL REFERENCE]**
  > **Excerpt from Circular 12 (Second Edition)**
  > **Attributed to: Under-Secretary Vane**
  > "We do not serve the event. We serve the meaning that survives the event. A lie told once is a mistake; a lie maintained is a institution. The institution is what holds the roof up."

  **5.0 REVISION NOTE**
  This Fourth Edition supersedes all prior manuals. Officers found in possession of Third Edition materials are to surrender them for pulping. The stability of the State depends on the stability of the Record. We do not report the world; we sustain it.

  **Approved by:**
  *Director-General H. K. Morrist*
  *Date: 14th October, 196-*
