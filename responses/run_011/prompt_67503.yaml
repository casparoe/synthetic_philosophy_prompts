answer: |-
  This is a precise and philosophically rich observation. You have put your finger on the exact friction point between the **Normative View** of joint action (associated with Margaret Gilbert) and the **Intentional View** (associated with Michael Bratman and Raimo Tuomela).

  Here is the carving you asked for.

  ### 1. The Nearest Established Concept
  The nearest concept is **Shared Cooperative Activity (SCA)**, formulated by Michael Bratman.
  *   **The Match:** Bratman argues that for us to act together, we need "interlocking intentions" and "mutual responsiveness." Your suitcase and branch examples fit this perfectly: my intention to lift is responsive to your intention to lift.
  *   **The Difference:** Bratman includes a condition called **"commitment to mutual support."** He suggests that if you struggle, I have some reason to help you, and if you quit, I have some standing to protest. Your examples explicitly lack this. You describe a scenario where the coordination is real, but the *normative glue* is absent.

  It also touches on **Raimo Tuomela's "I-Mode Cooperation."** Tuomela distinguishes between "We-Mode" (acting as a group member) and "I-Mode" (acting individually toward a group goal). Your cases are **Pro-social I-Mode**. However, Tuomela still argues that even I-mode cooperation generates *some* weak normative expectations. Your insistence on "no standing to complain" pushes it further toward the edge than Tuomela typically allows.

  **Verdict:** You are describing a **counterexample to the Normative View** (Gilbert), which claims joint action *necessarily* creates mutual obligations. You are demonstrating that **coordination can exist without commitment.**

  ### 2. The Threshold: What Makes It "Together"?
  You asked for the threshold where "they're doing it together" becomes true.
  *   **The Threshold:** **Common Knowledge of Interdependence.**
  *   **What It's Made Of:** It is not enough that we *are* depending on each other (that could be accidental). It must be that:
      1.  I know I need you to lift.
      2.  I know you know you need me to lift.
      3.  I know that you know that I know... (and so on).
  *   **Why this matters:** This recursive knowledge creates a **Schelling Point**. We don't need to speak because the situation itself signals the equilibrium. The "togetherness" is not in our souls or our promises; it is in the **structure of the information** available to us. When that common knowledge is present, you are no longer just "parallel agents"; you are a **coupled system**.

  ### 3. What Goes Missing When Talking Is Skipped?
  It isn't just obligation. What goes missing is **Authority.**
  *   **In a Planned Action:** When we agree, I give you a piece of authority over my future actions. I authorize you to hold me to the plan.
  *   **In Your Cases:** I retain full sovereignty. I am predicting your behavior, not relying on your promise.
  *   **The Missing Piece:** The **Right to Rebuke.** In philosophy, this is called *normative standing*. In your train example, if the third person lets go, you might be annoyed, but you cannot say, "You *shouldn't* have done that." You can only say, "That was unfortunate." The activity collapses not because a rule was broken, but because a **prediction failed.**

  ### 4. Is "No-Blame-But-Total-Collapse" Coherent?
  **Yes, it is perfectly coherent.**
  You are describing a **Coordination Equilibrium** rather than a **Social Contract.**
  *   **Social Contract:** "We agreed to do X. If you don't, you violate a norm." (Blame is appropriate).
  *   **Coordination Equilibrium:** "I will do X if and only if you do Y. If you don't do Y, my reason for doing X vanishes." (Blame is inappropriate).

  Think of it like two people carrying a heavy plank. If one drops their end, the other *must* drop theirs or get hurt. The second person dropping the plank isn't a betrayal; it's a physical necessity. Your examples are the social version of this. The "obligation" is purely **instrumental**, not moral. The activity is obligation-free because the binding force is **causal interdependence**, not **moral commitment.**

  ### 5. Boundary Cases (The Carving)
  You asked where the term stops applying. Here is the classification based on the presence of **Normative Standing** (the right to complain).

  *   **The Stadium Wave:** **YES.** This is the same phenomenon. If you sit down, the wave might die in your section. No one will yell at you. It relies entirely on visual common knowledge and interlocking expectations.
  *   **The Self-Forming Queue:** **NO.** This is the critical boundary. If someone cuts in line, everyone *does* have standing to complain ("The back of the line is back there"). A queue generates implicit norms and obligations that your branch pile does not. The queue is a **convention**; the branch pile is a **convergence.**
  *   **The Spontaneous Bucket Brigade:** **YES (with caveats).** If it starts without shouting, it fits. If someone stops passing buckets, the line breaks, but no one scolds them (they might be tired). However, the moment someone shouts "Keep it moving!", it shifts into **Commanded Joint Action** and acquires obligations.
  *   **The Flash Mob:** **NO.** Rehearsal implies prior agreement. Prior agreement implies joint commitment. If you don't show up to the flash mob, you have let the group down.

  ### 6. The Coinage
  The literature discusses "Spontaneous Joint Action" and "I-Mode Cooperation," but none capture the specific **lack of normative standing** combined with **high interdependence** as sharply as you require.

  I propose the term: **UNBOUND COORDINATION.**

  **Definition:**
  > **Unbound Coordination** occurs when two or more agents engage in interlocking actions sustained solely by **common knowledge of mutual dependence**, where:
  > 1.  The success of each agent's action is causally dependent on the others'.
  > 2.  There is **no joint commitment** (explicit or implicit).
  > 3.  Agents retain **no normative standing** to rebuke defectors.
  > 4.  Cessation by any agent dissolves the collective outcome without violating a norm.

  **Edge Cases for Argument:**
  1.  **Traffic Merging (The Zipper Merge):**
      *   *Argument for In:* Drivers take turns based on expectation. If one person cuts, others don't usually honk in moral outrage, they just brake. The flow collapses, but no promise was broken.
      *   *Argument for Out:* Traffic laws *do* create obligations. Cutting is illegal. There *is* standing to complain (via horn or law).
      *   *Verdict:* **Out.** It is regulated by external norms (law), making it Bound.

  2.  **Open Source Software (Bug Fixing):**
      *   *Argument for In:* Thousands fix code expecting others to. No one owes anyone.
      *   *Argument for Out:* Community norms often *do* generate blame ("Why didn't you document this?").
      *   *Verdict:* **Edge Case.** Depends on the specific community culture. If it's truly anonymous and unregulated, it's Unbound. If there's a maintainer, it's Bound.

  3.  **Silent Meditation Group:**
      *   *Argument for In:* Everyone sits expecting others to sit. If one leaves, the energy shifts, but no one complains.
      *   *Argument for Out:* Signing up for a retreat implies a commitment to stay.
      *   *Verdict:* **Out.** The registration is a joint commitment.

  **Why this name?**
  "Unbound" captures the lack of obligation (not bound by promise) and the fragility (easily unbound by defection). "Coordination" captures the mechanical interlocking without implying the "Jointness" of "Joint Action" which often smuggles in normativity.

  **Summary:** You have identified **Unbound Coordination**. It is a real, coherent phenomenon that proves joint outcomes do not require joint commitments. It is the social equivalent of a stack of stones balancing: if one moves, the rest fall, but the stones owe each other nothing.
