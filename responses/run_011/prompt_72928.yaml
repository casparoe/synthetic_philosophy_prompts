answer: |-
  # The Logical Uncertainty Market: A Session Design

  ## 1. Instructor Preparation: The Statement Bank

  You need a source of truth that is deterministic, verifiable by code, but computationally asymmetric (easy for small $n$, hard for large $n$). We will use the **Binary Champernowne Constant**. This is the number formed by concatenating the binary representations of the positive integers:
  $1, 10, 11, 100, 101, 110, 111, 1000 \dots$
  Sequence: $110111001011101111000 \dots$

  **The Statements:**
  Print these on cards or write them on the board at the start.

  *   **Tier 1 (Settleable in <1 min):**
      *   $S_1$: The 1st digit of the Binary Champernowne Constant is 1.
      *   $S_2$: The 2nd digit is 1.
      *   $S_3$: $S_1 \text{ AND } S_2$.
      *   *Purpose:* Establish baseline coherence. $P(S_3)$ cannot exceed $P(S_1)$ or $P(S_2)$.

  *   **Tier 2 (Settleable with effort/outside session):**
      *   $S_4$: The 20th digit is 1.
      *   $S_5$: The 21st digit is 1.
      *   $S_6$: $S_4 \text{ AND } S_5$.
      *   *Purpose:* Create information asymmetry. The math students may solve this during the session; philosophers likely will not. Prices should diverge based on computational ability.

  *   **Tier 3 (Open in principle):**
      *   $S_7$: The 1,000,000th digit is 1.
      *   $S_8$: $S_7 \text{ OR } (\text{The 1st digit is 1 AND The 1st digit is 0})$. (Logically equivalent to $S_7$).
      *   $S_9$: $S_7 \text{ AND } (\text{The 1st digit is 1 AND The 1st digit is 0})$. (Logically equivalent to False).
      *   *Purpose:* $S_7$ is computable but not in the room. $S_8$ tests if logical equivalence is respected even when truth is unknown. $S_9$ tests if contradictions are priced at 0 even when embedded in complex syntax.

  **Verification Script:**
  Run this Python script before the session to generate your answer key. Do not share this with participants.

  ```python
  def get_champernowne_bit(n):
      count = 0
      num = 1
      while True:
          binary = bin(num)[2:]
          if count + len(binary) >= n:
              return int(binary[n - count - 1])
          count += len(binary)
          num += 1

  # Generate Key
  statements = {
      "S1": get_champernowne_bit(1),
      "S2": get_champernowne_bit(2),
      "S4": get_champernowne_bit(20),
      "S5": get_champernowne_bit(21),
      "S7": get_champernowne_bit(1000000)
  }
  # Logical derivations
  statements["S3"] = 1 if (statements["S1"] == 1 and statements["S2"] == 1) else 0
  statements["S6"] = 1 if (statements["S4"] == 1 and statements["S5"] == 1) else 0
  statements["S8"] = statements["S7"] # Logically equivalent
  statements["S9"] = 0 # Contradiction

  print(statements)
  ```

  ---

  ## 2. Game Mechanics

  ### The Market (Clearing Mechanism)
  *   **The Board:** Two whiteboards. Left board lists Statements $S_1$ through $S_9$ with a blank space for "Current Price" (0 to 100). Right board is the "Ledger."
  *   **The Price:** Represents the market's probability (e.g., Price 75 = 75% chance of being True).
  *   **Trading:**
      1.  Any participant may propose a price change for any statement.
      2.  To change a price from $P_{old}$ to $P_{new}$, the participant must write their name on a "Trade Slip" and pledge **10 Points**.
      3.  **The Rule of Movement:** You may only move the price if you are willing to take the opposite side of the previous price.
          *   If you raise the price ($P_{new} > P_{old}$), you are **Buying**. You pay 10 points now. If the statement is True, you receive $10 \times (100 / P_{old})$ points later. If False, you lose the 10 points.
          *   *Correction for simplicity:* To avoid complex payout math on paper, we use a **Scoring Rule Settlement**.
          *   **Revised Trading:** You write a new price $P_{new}$. You pledge 10 points. At the end of the session, your payoff for that trade is calculated using the **Quadratic Scoring Rule**: $Payoff = 10 - 10 \times (Outcome - P_{new}/100)^2$.
          *   *Wait, this doesn't incentivize moving the price toward truth relative to others.*
          *   **Final Mechanism (The Market Maker):**
              *   There is a "Bank" (You, the instructor).
              *   Current Price $P$ is on the board.
              *   Participant wants to trade. They submit a slip: "Buy 10 units at $P$" or "Sell 10 units at $P$".
              *   If Net Buying > Net Selling for a statement in a 5-minute round, the Price increases by 5. If Net Selling > Net Buying, Price decreases by 5.
              *   **Why this is a probability:** The price moves only when participants risk points on the truth value. A price of 80 implies the aggregate risk-capital believes the statement is true with 80% confidence, as they are willing to buy at 75 and sell at 85.

  ### Payoff Scheme
  *   **Currency:** "Epistemic Points" (EP). Everyone starts with 100 EP.
  *   **Scoring Rule:** **Quadratic Scoring Rule.**
      *   At the end of the session, for every statement where you made a trade, you are scored on the *final price* you supported.
      *   Score = $100 - 100 \times (Outcome - FinalPrice)^2$. (Where Outcome is 1 or 0, Price is 0.0 to 1.0).
      *   **Justification:** This rule is "proper," meaning your expected points are maximized only if you report your true credence.
  *   **Auditor Payoff:** Auditors start with 100 EP. They gain 20 EP for every successful challenge. The 20 EP is deducted from the participant who last moved the incoherent price.

  ### The Auditors
  *   **Role:** Two participants (preferably one from Math, one from Philosophy). They do not trade.
  *   **Task:** Scan the whiteboard for **Logical Incoherence**.
  *   **Valid Challenges:**
      1.  **Dominance:** $P(S_3) > P(S_1)$ (Since $S_1 \land S_2 \implies S_1$).
      2.  **Contradiction:** $P(S_9) > 0$.
      3.  **Equivalence:** $|P(S_7) - P(S_8)| > 5$.
  *   **Invalid Challenges:** "I calculated $S_4$ and the price is wrong." (Auditors cannot challenge based on *truth*, only *relations*).
  *   **Ledger Correction:** If a challenge is valid, the Instructor immediately adjusts the price to the nearest coherent value (e.g., if $P(S_3) > P(S_1)$, lower $P(S_3)$ to match $P(S_1)$) and records the point transfer.

  ### Team vs. Individual
  *   **Decision:** **Individual Trading.**
  *   **Justification:** We want to expose the *individual's* inability to maintain coherence under computational load. Teams would pool computational power, masking the "logical omniscience" problem. The Math students should shine as individuals, creating visible price disparities.

  ---

  ## 3. Timeline (100 Minutes)

  *   **00-10: Setup.** Distribute starting points (100 EP). Assign Auditors. Explain rules. Write Statements on Board. Prices start at 50 for all.
  *   **10-30: Trading Round 1 (Tier 1 & 2).** Participants trade. Math students may begin calculating Tier 2.
      *   *Goal:* Prices on $S_1, S_2$ should stabilize near 0 or 100. $S_3$ should be $\le \min(S_1, S_2)$.
  *   **30-40: Audit Phase 1.** Auditors scan board. Challenges made. Ledger corrected.
      *   *Goal:* Enforce basic coherence on settled/settleable items.
  *   **40-70: Trading Round 2 (Tier 3 & Relations).** Introduce $S_7, S_8, S_9$. Trading resumes.
      *   *Goal:* Participants struggle to price $S_7$. They should notice $S_8$ is equivalent but might price it differently due to complexity.
  *   **70-80: Audit Phase 2.** Auditors scan for Equivalence and Contradiction violations.
  *   **80-90: Settlement.** Instructor reveals answers for Tier 1 & 2 (using your key). Tier 3 ($S_7$) remains **unsettled**.
      *   *Crucial:* Do not reveal $S_7$. State: "This statement is computable, but not by us, here, now."
  *   **90-100: Debrief.** (See below).

  **If Overrunning:**
  *   Cut Trading Round 2 to 20 minutes.
  *   Reduce Audit Phase 2 to 5 minutes.
  *   Do not settle Tier 2 ($S_4, S_5$) in the session; leave them as "Hard but Settled" examples for the debrief.

  ---

  ## 4. Debrief Script

  **Do not use the terms "Logical Omniscience" or "Logical Induction" until the final 5 minutes.**

  **Phase 1: The Constraint (Minutes 90-93)**
  "Look at $S_1, S_2,$ and $S_3$. $S_3$ is just '$S_1$ and $S_2$'. If you believed $S_1$ was 100% true and $S_2$ was 100% true, but priced $S_3$ at 50%, the Auditors took points from you. Why? Because the truth values constrain each other. Even if you hadn't calculated the digits, the *logic* forced your prices into a corner. You were punished not for being wrong about the world, but for being wrong about your own beliefs."

  **Phase 2: The Impossibility (Minutes 93-96)**
  "Now look at $S_4, S_5, S_6$. Some of you calculated these. Most did not. The prices here are scattered. If I demanded that everyone's prices be perfectly coherent—meaning $P(S_6)$ exactly matches the product of $P(S_4)$ and $P(S_5)$—I would be demanding that you all finish the calculation instantly. But you can't. The Math students might get there faster, but even they have a limit. If we add more 'AND' statements, the web of constraints becomes too thick to check with pen and paper. You cannot be coherent everywhere, because you cannot see everywhere."

  **Phase 3: The Standard (Minutes 96-98)**
  "So, what is the standard? It isn't perfect coherence. It's **unexploitability**. The Auditors weren't looking for truth; they were looking for a *money pump*. A pattern where they could take points from you repeatedly without risk. If your prices have no such pattern—if no one can describe a strategy to drain your points—you are doing as well as a bounded agent can do. You aren't required to know the consequences of your beliefs; you are only required to not lose money to someone who spots a contradiction you missed."

  **Phase 4: The Open Statement (Minutes 98-100)**
  "Finally, $S_7$. We will not settle this today. It has a truth value, but it is computationally out of reach. Notice how its price behaved differently from $S_1$. $S_1$ converged to 0 or 1. $S_7$ hovered. A price on $S_7$ is not a prediction of what we will find; it is a measure of our current ignorance.
  (This is where you introduce the vocabulary)
  In formal epistemology, the demand that you know all consequences of your beliefs is called **Logical Omniscience**. We just saw why that fails. The alternative standard you just practiced—avoiding exploitable patterns over time rather than achieving instant coherence—is the core intuition behind **Logical Induction**."

  ---

  ## 5. Failure Modes & Rule-Based Mitigations

  **1. The "Know-It-All" Drain**
  *   *Risk:* A math student solves $S_4$ immediately, trades heavily, and drains the pool before others learn.
  *   *Mitigation:* **Trade Limits.** A participant may only pledge a maximum of 20 EP per statement per round. This prevents one agent from dominating the price discovery and forces them to leave liquidity for others to learn from.

  **2. The "Frozen Ledger"**
  *   *Risk:* No one wants to be the first to move the price from 50.
  *   *Mitigation:* **The Decayer.** Announce at the start: "Any statement with no trades by Minute 20 will have its price randomly adjusted by $\pm 10$ by the Bank." This creates pressure to trade to protect current valuations.

  **3. The "Math Quiz" Mentality**
  *   *Risk:* Philosophers disengage, thinking "I can't calculate, so I can't play."
  *   *Mitigation:* **Auditor Incentives.** Explicitly state: "Auditors cannot check calculations. They can only check logic." This validates the philosophers' role. They can audit the Math students' prices for coherence ($P(A \land B) \le P(A)$) even if they can't solve $A$. This makes logic, not arithmetic, the primary skill.

  ---

  ## 6. Limitations & Instructor Caveats

  You must explicitly state these gaps in the final minutes to prevent over-generalization.

  1.  **Asymptotics:** "We played for 90 minutes. A true market standard requires infinite time. We saw *glimpses* of convergence on easy problems, but we did not see the long-run stability that defines a true logical inductor."
  2.  **Auditor Ingenuity:** "Our Auditors were humans. A formal system requires an algorithm that can find *any* exploitable pattern, not just the ones two grad students spotted in 10 minutes. We simulated the *pressure* of computation, not the computation itself."
  3.  **Truth vs. Provability:** "We treated all statements as having a fixed truth value (Realism). In some logical frameworks, the truth *is* the provability. We sidestepped that philosophical debate to focus on the computational constraint."

  **Final Instruction to Instructor:**
  When you reveal the Tier 3 ($S_7$) is unsettled, resist the urge to solve it later and email the group. Leave it unsettled. The epistemic residue of that uncertainty is the lesson.
