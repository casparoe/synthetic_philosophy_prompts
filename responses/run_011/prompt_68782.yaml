      *   *Translation Goal:* Map these to Nociception, Affective-Motivational components, Operant/Avoidance behavior, Physiologic stress response.

  3.  **Drafting Section 1: The Translation:**
      *   *Concept A (Intrinsic Badness):* This is the "Sensory-Discriminative" + "Affective" fusion. In vet med, we assume Nociception + Distress Behavior = Pain. If we strip the distress behavior, do we still have "Pain"? In philosophy, yes. In vet med, usually no. Let's call this "Uncoupled Nociceptive Qualia."
      *   *Concept B (Aversive Pull):* This is "Motivational-Affective." Measured by Conditioned Place Aversion (CPA), lever pressing to terminate stimulus, withdrawal reflexes, grimace scales (which measure tension/distress). If the animal doesn't try to stop it, this view says "No Pain Badness."
      *   *Concept C (Threat Info):* This is "Nociception" proper. A-delta/C-fiber firing. Central sensitization. Wind-up. The body knows damage is happening even if the brain doesn't care.
