answer: |-
  You have not missed a term, nor have you invented the phenomenon. You have accurately identified the central engine of contemporary meta-ontology.

  There is no single, canonical noun phrase (like "The Gödel Problem") that labels this exact configuration. However, in the literature, this is most commonly referred to as a **Dispute over Fundamentality** (or a **Structural Dispute**). Sometimes it is framed as a dispute over **"Joint-Carving"** or **"Ontological Structure."**

  The reason you aren't finding a single label is that this configuration represents a *shift* in how metaphysicians understand their own job. It marks the move from **First-Order Metaphysics** (asking "What exists?") to **Meta-Metaphysics** (asking "What makes one ontology better than another?").

  Here is the carving you asked for: what this phenomenon is, what it is not, where the boundaries lie, and the parallel in philosophy of science.

  ### 1. The Name and The Carving
  **Label:** **Fundamentality Dispute** (or **Dispute over Ontological Structure**)

  **What it is:**
  This is a dispute where two parties agree on the **existential facts** (what objects exist, what properties are instantiated) and agree on the **intertranslatability** of their languages, but disagree on which description reflects the **mind-independent structure of reality**.

  *   **The Agreement:** Both sides agree on the "surface" facts. (e.g., "There is a statue-shaped arrangement of clay at t1," "There is a ball-shaped arrangement at t2.")
  *   **The Disagreement:** They disagree on which of these facts is **fundamental** and which is **derivative**.
      *   The Perdurantist says: "It is fundamental that there are temporal parts; it is derivative that there is a 'whole' statue."
      *   The Endurantist says: "It is fundamental that the whole statue exists at t; it is derivative that we can talk about 'temporal slices'."
  *   **The Stake:** The stake is not *existence* (both agree the stuff is there), but **priority**. They are fighting over which vocabulary maps onto the "joints of nature."

  **What it is NOT:**
  *   **It is not a Merely Verbal Dispute:** In a merely verbal dispute (e.g., "Is a tomato a fruit?"), the parties agree on all the biological facts and disagree only on the classification label. Here, both sides insist the disagreement is not about labels, but about which labels are *privileged by reality itself*.
  *   **It is not Underdetermination by Evidence:** Underdetermination implies that evidence *could* decide it, but currently doesn't (or is practically inaccessible). In a Fundamentality Dispute, the claim is that no amount of "case data" (like the clay/statue examples) will decide it, because both theories predict the same cases. The decision criterion is not *evidence*, but *theoretical virtue* (simplicity, naturalness).
  *   **It is not a Notational Variant (in the deflationary sense):** If it were merely a notational variant, the dispute would be dissolved. The participants acknowledge the translatability but deny that it dissolves the dispute. They claim one notation is "more eligible" than the other.

  ### 2. The Boundaries
  You asked where the edges are. When does this stop being a Fundamentality Dispute and become something else?

  **Boundary A: Sliding into a Verbal Dispute**
  The dispute ceases to be substantive if the claim to "fundamentality" becomes unintelligible.
  *   *Inside the boundary:* "Temporal parts are more natural because they align with the topology of spacetime." (This makes a claim about the world's structure).
  *   *Outside the boundary:* "Temporal parts are better because I like them more." (This is aesthetic preference).
  *   *The Edge:* If neither side can explain *what makes* one structure more "joint-carving" than the other other than circular appeal to their own theory, critics argue it has collapsed into a verbal dispute disguised as realism. This is the core of Eli Hirsch's critique (Quantifier Variance).

  **Boundary B: Sliding into Empirical Underdetermination**
  The dispute ceases to be a Fundamentality Dispute if one side produces a case where the translations *fail*.
  *   *Inside the boundary:* Every case proposed by Side A can be translated by Side B without loss of truth conditions.
  *   *Outside the boundary:* Side A produces a case (e.g., a specific fission scenario) where Side B's translation requires positing a brute coincidence or a contradiction.
  *   *The Edge:* As soon as one theory predicts a different outcome for a specific case than the other, it is no longer a Fundamentality Dispute; it is a standard empirical/theoretical conflict.

  ### 3. The Philosophy of Science Parallel
  You suspected this exists elsewhere. It does. The exact parallel is the debate over **Gauge Equivalence** in physics, specifically within the context of **Empirical Equivalence**.

  **The Parallel:**
  *   **The Setup:** In General Relativity or Electromagnetism, you can often describe the same physical state using different mathematical formulations (gauges). For example, different potential values can describe the same electromagnetic field.
  *   **The Equivalence:** The formulations are **intertranslatable**. They predict the exact same experimental outcomes (empirical equivalence).
  *   **The Dispute:** Are the different gauge potentials *real*? Or is only the gauge-invariant field real?
      *   *Realist about Structure:* One formulation might be "more fundamental" even if they are empirically equivalent. (e.g., preferring a formulation that makes symmetries manifest).
      *   *Instrumentalist/Deflationist:* Since they predict the same things, asking which is "really true" is meaningless.
  *   **The Match:** This is identical to the Persistence Debate.
      *   *Endurantism/Perdurantism* = *Gauge A / Gauge B*.
      *   *Persistence Cases* = *Experimental Outcomes*.
      *   *Joint-Carving/Naturalness* = *Theoretical Virtues (Symmetry, Simplicity)*.

  In philosophy of science, this is often discussed under **Structural Realism** or the **Underdetermination of Theory by Data** (specifically the "Quine-Duhem Thesis" applied to rival formulations). But the specific flavor of "We agree on the predictions, but disagree on the ontology" is the heart of the **Realism vs. Anti-Realism** debate regarding **theoretical entities**.

  ### 4. A Coinage (If you need one)
  If you need a term to use in conversation that captures the specific tension you described (intertranslatable but substantive), I suggest:

  **"Substantive Equivalence"**

  *   **Definition:** A state of theoretical rivalry where two frameworks are translationally equivalent regarding all truth-conditional content, yet participants maintain the rivalry is substantive due to conflicting claims about ontological fundamentality.
  *   **Why this works:** It captures the oxymoron that bothers you. Usually, "equivalence" implies the dispute is over. "Substantive" implies it isn't. Putting them together flags exactly the configuration you found.

  ### Summary
  You have rediscovered the **Meta-Ontological Turn**.
  *   **Old Metaphysics:** "Do temporal parts exist?" (Yes/No).
  *   **New Metaphysics:** "We both can say everything the other says. But does reality *prefer* the temporal parts vocabulary?"

  The term you are looking for is **Fundamentality Dispute**. It sits precisely between "Verbal Dispute" (nothing at stake) and "Empirical Underdetermination" (evidence could decide). It is a dispute about **priority** rather than **presence**.
