answer: |-
  To settle the claim "The brain is *literally* a computer" rather than treating it as a heuristic or metaphor, a theory must bridge metaphysics (what computation *is*) and physics (what the brain *does*). Below are the requirements any such theory must satisfy to avoid vacuity or falsehood.

  ### The Requirements List

  **1. Physical Implementation**
  *   **The Case:** Computation cannot remain in the realm of abstract mathematics. There must be a mapping relation between physical states of the system (voltage, firing rates, chemical concentrations) and computational states (bits, symbols, vectors).
  *   **Classification:** **Non-negotiable.** Without this, you are describing a mathematical model, not a physical mechanism.

  **2. Non-Triviality (The Anti-Pancomputationalism Constraint)**
  *   **The Case:** The definition of computation must be restrictive enough to distinguish a computer from a rock, a wall, or a bucket of water. If every physical system implements every computation (via some arbitrary mapping of states), the claim "the brain is a computer" is vacuous.
  *   **Classification:** **Non-negotiable.** If this fails, the thesis is scientifically empty.

  **3. Causal Efficacy**
  *   **The Case:** The computational description must explain *why* the system behaves as it does. The computational properties must do the causal work, not merely describe the physical work after the fact. If the physics does all the causing and computation is just a shadow, computation is epiphenomenal.
  *   **Classification:** **Non-negotiable.** Otherwise, computation is irrelevant to the explanation of mind.

  **4. Empirical Adequacy**
  *   **The Case:** The theory cannot contradict established neuroscience. If the theory requires noise-free, discrete, serial processing, but the brain is noisy, continuous, and parallel, the theory is false regardless of its metaphysical elegance.
  *   **Classification:** **Non-negotiable.** A philosophy of mind that contradicts mind-science is not a philosophy of *that* mind.

  **5. Observer-Independence (Intrinsicness)**
  *   **The Case:** For the brain to be *literally* a computer (like it is literally made of atoms), computation must be an intrinsic property of the physical system, not dependent on an external interpreter assigning meaning or syntax to the states.
  *   **Classification:** **Non-negotiable for the 'Literal' Claim.** If computation is observer-relative, the brain is only a computer *for us*, not in itself. (Note: Many camps treat this as optional, but doing so surrenders the 'literal' claim).

  **6. Discreteness**
  *   **The Case:** Computational states must be distinct and countable (0 vs 1) to allow for algorithmic manipulation. Continuous variation cannot support discrete logic without quantization.
  *   **Classification:** **Camp-specific.** Classical CTM requires this; Connectionism and Dynamic Systems Theory often reject it in favor of continuous state spaces.

  **7. Semantic Content (Representationalism)**
  *   **The Case:** Computation in the mind must operate over states that *mean* something (representations). Syntax without semantics is insufficient for cognition.
  *   **Classification:** **Camp-specific.** Classical CTM requires this; some eliminativist or purely mechanistic accounts deny that "meaning" is required for the definition of computation itself.

  ***

  ### The Incompatible Subset (The Trilemma)

  You cannot simultaneously satisfy the following three requirements. You must abandon at least one to have a coherent theory:

  1.  **Physical Implementation** (Broadly construed: physical states map to computational states).
  2.  **Non-Triviality** (Not every physical system computes).
  3.  **Observer-Independence** (The mapping is a fact of nature, not an interpretation).

  **The Conflict:**
  This is the core of the **Putnam/Searle Triviality Argument**.
  *   If you maintain **Observer-Independence** and **Physical Implementation** (allowing standard physical state mappings), you inevitably fail **Non-Triviality**. Because physical states are continuous and rich, you can always find a mapping that makes a wall implement WordStar.
  *   If you maintain **Non-Triviality** and **Observer-Independence**, you must restrict **Physical Implementation** so severely (e.g., requiring specific causal mechanisms) that it becomes difficult to show how abstract syntax maps to physics without begging the question.
  *   If you maintain **Non-Triviality** and **Physical Implementation**, you usually have to concede **Observer-Independence**, admitting that computation is in the eye of the beholder (which kills the "literal" claim).

  ***

  ### The Single Knockout Requirement

  The requirement that knocks out the most popular answers (specifically Classical Computational Theory of Mind and standard Connectionism) is:

  **Observer-Independence.**

  **Why it kills the popular answers:**
  Most popular accounts rely on **Functionalism**. They define computational states by their causal role or their relationship to inputs/outputs, not by their intrinsic physical geometry. However, causal roles are only identifiable *relative to a level of description* or an *interpretive framework*.
  *   If you insist computation must be **Observer-Independent** (intrinsic to the physics like mass or charge), you cannot find it in the brain. Physics describes forces and fields, not "bits" or "symbols." Bits only exist relative to a convention of interpretation.
  *   If you admit computation is **Observer-Relative**, you surrender the claim that the brain is *literally* a computer. It becomes a metaphor: "We can *interpret* the brain as a computer."

  To save the "Literal" claim, you must prove that syntax is a natural kind (like water = H2O). No current theory has successfully naturalized syntax without collapsing into triviality or contradicting neuroscience. Therefore, demanding **Observer-Independence** renders the "Brain = Computer" thesis metaphysically unintelligible for almost all existing frameworks.
