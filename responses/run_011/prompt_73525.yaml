      *   I need a case where ignoring E is *correct*.
      *   Usually, ignoring E is wrong because E *might* defeat knowledge. If I know P, E *must* be misleading. But if I treat E as misleading *because* I know P, I seem to be insulating P from revision.
      *   To make ignoring E correct, I need a situation where the reliability of the source of P is so high relative to the prior probability of E being true that updating on E would be irrational *given the knowledge state*.
      *   Constraint Check: "No pragmatic escape hatches." This is the hardest part. Usually, we justify ignoring evidence because looking is costly or dangerous. Here, looking is free. So the justification must be purely epistemic: looking wouldn't change the rational credence.
      *   Constraint Check: "She may not know in advance which piece of evidence is bogus or why." She can't just know "E is a lie." She must know "P is true," and therefore "E is misleading."
      *   Constraint Check: "Correct for the reason the dogmatist gives." She must dismiss E *because* she knows P, not because she has independent reasons to distrust the source of E.

