answer: |-
  The Continuity Directorate occupied the basement levels of the Ministry, where the hum of the cooling servers drowned out the street traffic above. Here, the physics didn't change; only the official description of it did. When a paradigm shifted upstairs in the Academies, the paperwork landed here. It was Elara's job to decide what got packed into the archives and what got carried over into the new model.

  She sat at Station 4, the glow of her terminal illuminating a stack of physical forms. The current migration was heavy: the transition from Discrete Particle Theory to Continuum Flux. The Academies had decided particles were no longer real. They were merely excitations in a underlying field.

  Elara's task was to fill out the Structural Invariance Form. This was the heart of Structural Realism, the Directorate's operating system. The logic was simple, born from the Great Ether Purge of the previous century. Back then, the clerks had kept the wave equations but burned the documents referring to the "luminiferous medium." The math survived; the stuff vanished. It was the only way to ensure progress wasn't wiped out every time the Academies changed their minds about what the universe was made of.

  Elara typed: *Relata: Null.*
  She typed: *Relations: Preserved.*

  She was stripping the ontology. If the particles were gone, only the mathematical relationships between the data points remained. That was the promise. Keep the structure, ditch the furniture.

  She ran the verification script. The terminal blinked green. *Structure Valid.*

  But then she opened the Newman Diagnostic, a legacy tool named after some long-dead critic who had nearly broken the Directorate in the 1920s. The Diagnostic tested for triviality. If a structure was purely relational, with no specification of what was relating, could it be mapped onto *anything*?

  Elara fed the script a random set of objects: a collection of coffee cups, a set of random integers, a cluster of stars in the Andromeda galaxy. She asked the system if the Continuum Flux structure could be imposed on them.

  The terminal blinked green. *Structure Valid.*

  Elara frowned. She typed in a set of imaginary points with no physical properties whatsoever.
  *Structure Valid.*

  Her stomach tightened. If the structure could be mapped onto coffee cups just as easily as onto quantum fields, then saying "the world has this structure" meant nothing. It was like saying "the world has a number." True, but empty. The structure needed to be anchored to something specific, or else it was just a game of symbols.

  She tried to add a constraint. She typed: *Relations must be causal.*
  The system flagged it. *Error: 'Causal' implies intrinsic property of relata. Ontology detected.*

  She tried: *Relations must be physical.*
  *Error: 'Physical' is undefined without ontology.*

  She tried: *Relations must be observable.*
  *Error: Epistemic constraint. Does not guarantee ontological commitment.*

  Elara leaned back. The Newman Objection wasn't just a footnote; it was a hole in the floor. To make the structure non-trivial, she had to say something about the things holding the relations together. But if she said anything about the things, she was violating the mandate to discard the old ontology. She was smuggling furniture back into the empty room.

  She looked at the Ether Box in the corner of the room. It was a sealed container holding the physical models of the light-bearing medium, confiscated during the Purge. The clerks who did that migration had kept the equations and thrown away the ether. They told themselves they were being rigorous. But Elara knew the secret they didn't write down. They kept the equations because the equations worked, not because they knew what the equations were *about*.

  "Stuck on the relata?"

  Kael stood behind her. He was from the Ontic Division. His job was to certify that the new theory didn't require any hidden substances. He leaned against the desk, holding a stylus.

  "It's trivial," Elara said. "If I strip the intrinsic properties, the structure fits anywhere. I can map the Flux equations onto a basket of apples. It's mathematically isomorphic. So what are we actually saving? Just the shape?"

  "The shape is the thing," Kael said. "You're trying to find a ghost. There's nothing holding the relations together. The nodes aren't things. They're just intersections."

  "Intersections of what?"

  "Of other relations. It's relations all the way down. You don't need relata. You think there's a 'something' that stands in the relation, but that's just habit. Old physics habit."

  Elara rubbed her eyes. "So when I sign this, I'm saying there are no particles? Not even unknown ones?"

  "I'm saying there are no particles. Period." Kael tapped the screen. "You're Epistemic, Elara. You think there's a something there we just can't know. I'm saying there isn't. The universe isn't a set of objects with connections. It's a web with no knots."

  "That's not physics," Elara said. "That's mysticism. If I fire a photon at a detector, something hits something. Even if I don't know what the 'something' is, it has to be there to do the hitting."

  "It hits because the structure dictates a probability amplitude at that coordinate. The 'hitting' is a change in the state of the field. No object required."

  Elara looked at her Newman Diagnostic. It was still green. The structure was valid, but it was hollow. She realized she had two choices. She could mark the form as *Epistemic Retention*, which implied there were unknown entities underlying the structure. Or she could mark it *Ontic Structural*, which claimed the structure was the only reality.

  If she chose Epistemic, she was admitting the Directorate didn't know what the world was made of. It was a humble claim, but it left the door open for the Academies to come back in ten years and say, "Actually, there are strings," and then they'd have to migrate again.

  If she chose Ontic, she was betting the farm. She was saying the furniture is gone forever. There is only the architecture. If the Academies found a particle tomorrow, the Directorate would look like fools who denied reality.

  "The shift ends in ten minutes," Kael said. "We need to file the Migration Packet. The Academies start teaching Flux next semester. They need the official interpretation."

  Elara looked at the signature lines.
  Line 1: *Certification of Structural Continuity.* (Her line)
  Line 2: *Certification of Ontic Status.* (Kael's line)

  Usually, these were rubber stamps. But the Newman Diagnostic was still running in the background, a silent accusation. If she signed Line 1, she was certifying that the structure was preserved. But preserved *in what*?

  "If I sign," Elara said, "I'm saying the equations survive. I'm not saying what they apply to."

  "That's all we need," Kael said. "The equations predict the clicks in the detectors. That's the cash value."

  "But the clicks are made by detectors. The detectors are made of... what?"

  "Structure."

  Elara picked up her stylus. She hovered over the screen. She thought about the Ether Box. The clerks who sealed that box had felt exactly this vertigo. They knew the light waves were real, but the medium was dead. They had kept the math and prayed the metaphysics wouldn't matter.

  For a hundred years, it hadn't mattered. The math worked. But every time a student asked, "But what is waving?" the professors had to look at their shoes.

  "If I sign," Elara said, "I want to add a caveat. 'Structure preserved; nature of relata unspecified.'"

  Kael sighed. "You can't do that. That's Epistemic. The Ministry wants Ontic. They want to know if they need to buy new lab equipment or just new textbooks."

  "They need new textbooks either way."

  "But do they need to explain to the undergraduates that electrons are little balls, or that electrons are myths?" Kael leaned in. "If you write 'unspecified,' the Academies will treat the electrons as little balls. They'll teach it as if there's stuff there. Then in twenty years, when the next theory comes, we have to do this again. We have to strip the 'stuff' away again. It's inefficient."

  "So you want to lie?"

  "I want to close the file. There is no stuff. The relations are the only things that have cash value. Why keep a placeholder for a ghost?"

  Elara looked at the Newman Diagnostic. It showed her that the structure could fit a basket of apples. It could fit a dream. It could fit nothing. The only thing stopping it from being trivial was the decision to treat it as physical. But "physical" was the very thing they were refusing to define.

  She realized the cost. If she signed Kael's way, she was erasing the possibility of the unknown. She was saying the map is the territory. If she signed her way, she was admitting ignorance, which weakened the authority of the Directorate.

  The clock on the wall ticked. 16:58.

  "Elara," Kael said. "The bus."

  She looked at the stylus. She thought about the clerks of the Ether Purge. They had chosen survival over truth. They kept the equations and let the ontology die. It allowed physics to continue. But it left a scar.

  She moved the cursor to Line 1.
  *Certification of Structural Continuity.*

  She typed: *Structure Preserved. Relata: Undefined.*

  Kael groaned. "You're weakening the packet."

  "I'm acknowledging the Newman limit," she said. "I'm not saying there's nothing there. I'm saying I can't prove there isn't."

  "And I'm saying you're clinging to a ghost." Kael moved to Line 2. *Certification of Ontic Status.*

  He hovered his stylus. If he signed off on her caveat, he was admitting the Ontic Status was provisional. If he refused, the packet wouldn't file. They needed both signatures. The system required consensus between the Epistemic and the Ontic divisions. It was the Directorate's way of ensuring that no single metaphysical dogma froze the science.

  "You know," Kael said, "in ten years, they'll find something else. Maybe strings. Maybe loops. And we'll be down here again."

  "Probably," Elara said.

  "And we'll have to strip this away too. The Flux. The Continuum. All of it."

  "Probably."

  "So why keep the 'Undefined'? Why not just cut it?"

  "Because someone has to remember that the equations aren't the world."

  Kael looked at her. The hum of the servers seemed to grow louder, a constant drone of data processing reality into numbers. He looked at his own line. He could force it. He could mark it *Ontic: Pure Structure* and veto her caveat. But then the packet would go to arbitration, and the shift would end, and the Academies would start the semester without the official manual.

  He looked at the Ether Box. It sat in the shadows, a monument to things that were once real and then weren't.

  "Fine," Kael said. "But don't expect the Academies to teach it that way."

  "They never do," Elara said.

  Kael signed. *Ontic Status: Provisional.*
  Elara signed. *Continuity: Structural Only.*

  The terminal chimed. *Migration Complete.*
  The screen refreshed. The old theory was archived. The new theory was live.

  Elara packed her bag. She didn't feel like she had solved anything. She had just filed the uncertainty. The physics would work either way. The predictions would be identical. The buses would run, the lights would turn on, the detectors would click.

  But as they walked to the elevator, Elara glanced back at the terminal. The Newman Diagnostic was still open. The green light blinked steadily. *Structure Valid.*

  It was valid for the universe. It was valid for the coffee cups. It was valid for nothing.

  "See you tomorrow," Kael said.

  "See you," Elara said.

  They stepped into the elevator. The doors closed, cutting off the view of the basement. Above them, the city hummed, full of objects that were either real or merely nodes in a web, depending on who you asked. The equations didn't care. They were already waiting for the next migration.
