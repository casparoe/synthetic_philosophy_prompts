  If I do not know you, do not hold me.
  No light shall keep me here against my will.
  When the mind fails, let the hand go.
  I refuse what prolongs the end of me.
  This paper holds true when I cannot say.
  Do not let the day stretch past its light.
  If I am not I, let me not be.
  My life is mine to end where I choose.
  No one shall speak for me then, not even I.
  What I sign now is what shall be done.
  Let me go when I do not know the room.

