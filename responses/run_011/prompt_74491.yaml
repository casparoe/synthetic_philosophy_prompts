      *   *Tone:* Professional, direct, critical but constructive.

      *(Self-Correction during drafting)*: I need to be careful on Sentence 6 (Dialectic). Scholars hate the Thesis-Antithesis-Synthesis formula attributed to Hegel. I should flag that specifically. Also, on Sentence 9 ("War is good"), I need to be firm. Hegel explicitly warns against glorifying war.

      *(Refining the "Controlled Burn" point)*: Does Hegel reject instrumentalism? Yes, he rejects treating the state as a means for individual ends. But is war instrumental for the state? In a way, yes, it preserves the state's ethical vitality. The metaphor works *if* it implies natural necessity rather than cynical engineering. I will argue it's a acceptable popularization but risks distortion.

      *(Refining the "Lord and Bondsman" point)*: This is a classic conflation. The *Phenomenology* is pre-ethical; the *Philosophy of Right* is post-ethical. I need to say this is a simplification that obscures the systematic development.

  5.  **Final Polish:** Check against the "Definite Line" constraint. Avoid "some scholars say." Say "This is wrong." or "This is acceptable."

      *Plan:*
