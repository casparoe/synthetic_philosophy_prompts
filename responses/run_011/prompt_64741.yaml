  ### Application to the Water Case

  Based on your current set, here is the audit of the specific agents:

  **The Night-Shift Operator**
  *   **Reading:** Under (1), he is not blameworthy for the *moment of harm*; he lacked the hydraulic knowledge to override. Under (2), we ask: was he culpably ignorant? You state he "has been trained to treat [rationales] as faithful." Unless he negligently refused prior training (not stated), he satisfies the "reasonable effort" clause in (5).
