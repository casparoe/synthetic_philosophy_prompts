answer: |-
  **The four boxes**

  1.  **Hard Threat:** Management says they will punish you for protected activity (like voting) without legal cover. *Stake:* This is an Unfair Labor Practice; file immediately.
  2.  **Binding Promise:** Someone with actual authority guarantees a specific benefit, and you changed your position based on it. *Stake:* Breach of contract or equitable estoppel; grievable.
  3.  **Weather Report:** Management predicts outcomes based on data or past events without saying they will cause them. *Stake:* Free speech; not grievable, no matter how scary.
  4.  **Shop Talk:** Opinions, jokes, hyperbole, or promises from someone without the keys to make it happen. *Stake:* Drop it; filing this wastes dues and credibility.

  **The test, in order**

  1.  **Did the speaker have the keys?** Check if the person speaking actually controls the outcome. A supervisor promising a lead hand role when the Plant Manager signs off fails here.
      *   *Sufficient Answer:* Yes, they sign the paperwork / No, they don't.
      *   *Verdict:* If "No," it's **Shop Talk**. Stop here unless there's heavy reliance (see Case 2).
      *   *Kick Up:* If authority is shared or unclear, ask the Business Agent (BA).

  2.  **Was it specific or vague?** "You'll get overtime" is specific. "We'll see what happens" is vague. "I'll try" is not a promise.
      *   *Sufficient Answer:* Concrete action vs. opinion.
      *   *Verdict:* Vague statements are **Weather Reports** or **Shop Talk**.
      *   *Kick Up:* None.

  3.  **What was the room doing?** Look for context clues. Was everyone laughing? Was it a formal meeting or a hallway chat? Did the speaker say "I'm not threatening you"?
      *   *Sufficient Answer:* Obvious joke vs. serious tone.
      *   *Verdict:* Obvious jokes are **Shop Talk**. Explicit disclaimers ("I'm not telling you...") push it toward **Weather Report**.
      *   *Kick Up:* If tone is ambiguous (serious joke), ask the BA.

  4.  **Did someone bet on it?** Did the member suffer a loss because they believed the words? (e.g., turned down another job, didn't file a claim).
      *   *Sufficient Answer:* Yes, material loss / No, just upset.
      *   *Verdict:* No loss means no grievance even if it was a promise. Loss + Authority + Specific = **Binding Promise**.
      *   *Kick Up:* Complex reliance cases always go to the BA.

  **Theory Drops:** We drop "speaker intent" because you can't read minds; we use the "reasonable listener" standard instead. We drop "semantic nuance" because contract language overrides dictionary definitions. This is safe because arbitrators rule on objective evidence, not internal thoughts.

  **Run it**

  **Case One: The Marion Prediction**
  *Verdict: Weather Report (You were wrong).*
  *Reasoning:* Run Question 3. The Manager cited data ("the numbers say") and used a specific disclaimer ("I'm not telling you that'll happen here"). Under the test, citing past events at another plant is a prediction, not a pledge to close your line. The "reasonable listener" standard protects management's right to share business realities during a vote, provided they don't say *they* will pull the plug because you voted yes. You told three guys it was a threat, but the procedure flags the disclaimer and the data citation. This is the hard one: it feels like a threat because the outcome is scary, but legally it's a Weather Report. Do not file. Tell the guys the BA would bounce it back and it hurts credibility to push weak cases.

  **Case Two: Denise's Lead Hand Promise**
  *Verdict: Shop Talk (Authority Failure).*
  *Reasoning:* Run Question 1. The Production Supervisor does not sign off on Lead Hand postings; the Plant Manager does. The supervisor lacked the "keys" to make the promise binding on the company. However, run Question 4: Denise turned down another job. This is material reliance. While the promise itself isn't binding due to lack of authority, the reliance creates a potential estoppel claim. This is a "Kick Up" to the BA. Do not file a standard grievance yet. The BA needs to decide if the company ratified the supervisor's words by letting Denise rely on them. For now, tell Denise you're escalating it to the Agent, not dropping it.

  **Case Three: Ray's Schedule**
  *Verdict: Shop Talk (Obvious Joke).*
  *Reasoning:* Run Question 3. The foreman said, "I'll personally rearrange the whole schedule around you." In a machine shop, everyone knows one foreman cannot break the master schedule for one guy. The recording captures laughter. A "reasonable listener" knows this is hyperbole used to diffuse tension, not a operational commitment. Even if Ray felt serious, the context overrides his feeling. Run Question 4: Did Ray suffer a loss? No, he just expects days. Verdict is Shop Talk. You have to tell Ray no. Use the recording: "Ray, the tape shows the room laughed, and nobody believes one guy breaks the schedule. If we file this, management will play the tape and we look foolish."

  **Where it's judgment in a lab coat**

  Steps 3 and 4 look mechanical but rely on your read of human behavior. Two competent stewards might disagree on Case 3: one hears malicious mockery, the other hears camaraderie. The "reasonable listener" standard is subjective; what's obvious hyperbole to you might feel real to a vulnerable member. Also, Question 1 (Authority) assumes you know the org chart perfectly. If the Supervisor has *de facto* power even without *de jure* authority, a strict "No" might miss a grievance. The procedure forces you to objectify the vibe, but you are still the instrument measuring it. If your gut says "this feels coercive" despite the disclaimer in Case 1, that's where you call the BA, not where you file alone.

  **What this procedure can't do**

  This triage fails on systemic coercion or subtle discrimination. If management threatens everyone individually so no single recording looks bad, this test misses the pattern. It also can't interpret complex contract loopholes where words match the letter but violate the spirit. If an utterance passes the test but feels like a violation of bargaining good faith, do not rely on this sheet. Finally, it cannot handle legal estoppel complexities (like Case 2) beyond a basic "Kick Up." When the procedure says "Shop Talk" but the member is facing ruin, ignore the verdict and call the Business Agent. This tool filters noise; it doesn't replace legal counsel.
