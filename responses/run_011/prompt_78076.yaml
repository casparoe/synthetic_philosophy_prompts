answer: |-
  You are essentially right that the snapshot assumption is the trap, but the deeper blockage is the undefended premise that neural processing order must map cleanly onto the temporal ontology of experience.

  Your friend's empirical strategy fails because locating a neural correlate for the colour change before the second stimulus only proves early *representation*, not early *experience*, unless one assumes identity theory without argument. Your skepticism holds because any measure of "when" the brain settles the content is compatible with either delayed consciousness or revised memory, since the report itself is the only access point to the phenomenology and it arrives after the fact. Both sides are stalled because they are trying to locate a point-event in time for something that is likely a distributed, retrospective construction; the Stalinesque and Orwellian labels only make sense if consciousness is a singular broadcast with a timestamp, rather than a functional output generated over a window. Progress would not come from a cleverer paradigm measuring latency, but from a mechanistic model showing how the brain assigns temporal order to events independently of their actual occurrence, effectively demonstrating that "when did you see it" is a question the brain answers via inference rather than retrieval. Until the field accepts that phenomenal time is a constructed property rather than a fundamental dimension of experience, every neural timestamp will be compatible with multiple conflicting stories about consciousness.

  Nothing empirical will settle this, because the dispute is not about data but about whether the concept of "conscious experience" admits of precise temporal localization at all.
