prompt: |-
  I'm a software engineer with no formal philosophy training. I'm writing an internal note for my team on the regress problem for justification, because our ML system's audit trail seems to work the same way: a prediction cites evidence, that evidence cites further evidence, and so on. To me that reads as a recursion question — base case, cycle, or infinite path — and I'd like to turn it into a decision tree that sorts people by what they say about concrete cases, not by which label they prefer.

  Give me six to eight branch questions, each answerable without knowing any terminology: a belief produced by a process its holder can't articulate; a belief resting on something nobody has ever doubted and that can't be tested; three beliefs supporting each other and nothing else; a chain the subject never actually ran through but could extend on demand. Each leaf should name the position it lands on — classical and modest foundationalism, coherentism, foundherentism, infinitism, reliabilist externalism, hinge or entitlement views, and anything else you think belongs — plus one sentence on that position's most awkward commitment.

  Then four things: say which notion of justification the tree is tracking and why, since I suspect some of these views are answering a different question than the others; flag any pair of leaves my questions can't really separate; list the answer-combinations that are logically available but unoccupied, diagnosing each as incoherent, unattractive, or merely unexplored; and tell me where the recursion analogy actively misleads rather than just simplifies.
