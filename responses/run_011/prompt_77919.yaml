answer: |-
  This is a sophisticated stalemate. You have correctly identified that the surface-level logical paradox (the "liar sentence" structure) is not what is driving the friction. Your hypothesis—that this is a clash between two theories of authority rather than a logical contradiction—is substantially correct, but it can be sharpened using the framework of legal philosophy.

  Here is a diagnosis of the disagreement, an assessment of your hypothesis, and a roadmap for what constitutes progress.

  ### 1. The Kind of Disagreement

  This is not a verbal disagreement (you understand each other's terms), nor is it a factual one (the text of the Charter is clear). It is a disagreement about **Standards of Recognition** and **Diachronic Identity**.

  **A. Standards of Recognition (The Hartian Diagnosis)**
  In legal philosophy, this is the central debate between H.L.A. Hart and his predecessors.
  *   **Your Friend's Position (The Internal View):** Validity is determined by the *system's own criteria*. If the Charter says Article 9 is unamendable, then any attempt to amend it is invalid *within the system*. The "Rule of Recognition" (the ultimate test for what counts as law in your group) includes the constraint of Article 9. To ignore it is to step outside the game.
  *   **Your Position (The External/Political View):** Validity is determined by the *current social fact of acceptance*. The "Rule of Recognition" is ultimately a social practice. If the current group accepts the repeal, the repeal is valid, and Article 9 was merely a paper tiger. The ultimate authority is the living group, not the document.

  **B. Diachronic Identity (The "Who is We?" Question)**
  You hinted at this with "the living group is governed by the dead."
  *   **Friend's View:** The Group is a *continuing entity* across time. The "We" that voted yesterday is the same agent as the "We" voting today. Therefore, the past "We" can bind the future "We."
  *   **Your View:** The Group is a *series of temporal stages*. The "We" of today is a distinct agent from the "We" of yesterday. Therefore, the past "We" cannot bind the future "We."

  **C. The Hidden Question**
  The hidden question neither of you is asking is: **"Are we playing a game of rules, or a game of power?"**
  *   If the game is about *rules*, your friend is right: the rules define the boundaries of valid moves.
  *   If the game is about *power* (Nomic often straddles this), you are right: the ability to enforce a decision constitutes validity.

  ### 2. Settled vs. Contested in the Literature

  You asked for explicit distinction here. This is crucial because much of the confusion in this debate stems from presenting contested theories as logical necessities.

  **Settled (Consensus among Theorists):**
  *   **Logic does not decide this:** It is settled that self-entrenchment is not a *logical* contradiction (contra Alf Ross's early view). A system can logically contain a rule that says "I cannot be changed." The contradiction only arises if you assume the system must be logically closed *and* dynamically changeable in all respects simultaneously.
  *   **Indeterminacy:** It is settled that a legal system's own rules cannot definitively resolve a challenge to the ultimate source of those rules. (This is Hart's "uncertainty of the Rule of Recognition").
  *   **Effectiveness:** It is settled that if a group *successfully* repeals the entrenched clause and functions thereafter, historians and jurists will retrospectively deem the repeal valid. (Kelsen's principle of "Effectiveness").

  **Contested (Genuine Debate):**
  *   **Self-Embracing vs. Continuing Sovereignty:** It is fiercely contested whether a sovereign body (your reading group) can legally bind its successors.
      *   *The Old View (Dicey):* Sovereignty is continuing; you cannot bind successors. (Aligns with your view).
      *   *The New View (Jennings/Wade):* Sovereignty is self-embracing; you can redefine the rules of succession, including entrenchment. (Aligns with your friend's view).
  *   **The Nature of the "Rule of Recognition":** Is the ultimate rule a *legal* rule (Friend) or a *social fact* (You)? Hart argued it is a social fact, but one that functions as a legal rule from the internal perspective. This distinction is still debated in jurisprudence.
  *   **Nomic Specifics:** In the context of Nomic (the game designed by Peter Suber), the status of "immutable" rules is explicitly contested. Suber designed the game to explore this. Some interpretations hold that "immutable" rules are merely high-threshold rules; others hold they are truly transcendent. There is no consensus on the "correct" way to play Nomic regarding immutability.

  ### 3. Assessment of Your Hypothesis

  Your hypothesis is **largely correct but slightly under-described.**

  You wrote: *"we are each predicting which way our group's practice would go if tested, and dressing the prediction up as a claim about present validity."*

  *   **Where you are right:** You are right that the disagreement is about the *source* of validity (past document vs. present will). You are also right that it feels like a prediction. In hard constitutional cases, a judge's ruling often *creates* the validity it claims to *find*.
  *   **Where you are missing nuance:** It is not *just* prediction. It is a normative commitment.
      *   Your friend is committed to **Legality**: The value of the game lies in fidelity to the established structure.
      *   You are committed to **Agency**: The value of the game lies in the current participants' autonomy.
      *   If you treat this *only* as a prediction ("If we vote, we win"), you miss the normative cost. If you vote and repeal, you may win the point, but you break the *form* of the game. If you don't vote, you preserve the form, but admit the "dead hand" control.

  The disagreement is not merely descriptive (what will happen); it is constitutive (what *kind* of group are we?).

  ### 4. What Counts as Progress?

  Since this is a foundational impasse (a "constitutional moment"), deductive argument will not resolve it. Progress requires shifting the mode of engagement.

  **A. A Distinction: Validity vs. Efficacy**
  Progress would be made if you explicitly distinguished between:
  1.  **Systemic Validity:** Is the move valid according to the rules *as they stood before the move*? (Friend wins here).
  2.  **Revolutionary Validity:** Is the move valid according to the rules *as they stand after the move*? (You win here).
  *   *Why this helps:* It allows you to agree that the motion is "void" under the old regime but "effective" under the new one. The disagreement then shifts to: "Do we want to trigger a revolution within the game?"

  **B. A Formal Result: The Hierarchy of Rules**
  You could propose a formal amendment to the *Amendment Rule* itself (not Article 9) that clarifies the hierarchy.
  *   *Proposal:* Add a clause stating: "No rule may be construed as immune from amendment by a [super-majority] vote."
  *   *The Catch:* This requires amending the Amendment Rule. If the Amendment Rule is silent on its own entrenchment, you can do this. If the Amendment Rule is also entrenched, you are back to square one.
  *   *Progress:* This forces the group to locate the "unamendable" core. Is it just Article 9, or is the Amendment Procedure itself sacred?

  **C. A Change of Question**
  Stop asking "Is this valid?" and start asking "What are the consequences of deciding?"
  *   *Question:* "If we rule the motion void, do we accept that this group can never change its mind about Article 9, even if 100% of us want to?"
  *   *Question:* "If we rule the motion valid, do we accept that any future majority can overturn any protection we set up today?"
  *   *Progress:* This moves the debate from abstract validity to concrete risk assessment.

  **D. The Case Play-Out (The Kelsenian Test)**
  In legal theory, the only way to resolve a conflict over the Rule of Recognition is **effectiveness**.
  *   *Action:* Put the motion to a vote.
  *   *Outcome:* If it passes, and the group continues to play accepting the repeal, the repeal *becomes* valid retrospectively. If it passes, and half the group quits or refuses to acknowledge the new state, the group has schismed.
  *   *Progress:* This resolves the *practical* stalemate, though not the *theoretical* one. It forces the "prediction" you mentioned to become a fact.

  **E. Nothing (The Impasse is the Point)**
  It is possible that **permanent impasse is the correct outcome.**
  *   *Why:* In Nomic and constitutional theory, this specific tension is a feature, not a bug. It is the "Paradox of Sovereignty."
  *   *Reasoning:* If you resolve it definitively one way, you destroy the tension that makes the game (or a constitution) interesting. If you side with the Friend, the game becomes static (tyranny of the past). If you side with You, the game becomes unstable (tyranny of the present).
  *   *Progress:* Acknowledging that the Charter is *structurally ambiguous* at this point. You can agree to disagree, effectively treating Article 9 as a "political question" that the game mechanics cannot resolve.

  ### Summary Recommendation

  Your diagnosis is sound: this is a clash of **Continuing Sovereignty** (You) vs. **Self-Embracing Sovereignty** (Friend).

  To move forward without conceding:
  1.  **Acknowledge the Indeterminacy:** Agree that the text does not logically compel one outcome.
  2.  **Name the Stakes:** Explicitly state that Friend is prioritizing *Continuity* and you are prioritizing *Agency*.
  3.  **The "Nuclear" Option:** If you must proceed, vote. But acknowledge that a vote to repeal Article 9 is not a "move within the game" but a "move that changes the game." It is a constitutional revolution, not a legislative amendment.

  If you treat it as a revolution, both of you can be right: The Friend is right that it violates the old constitution; you are right that it establishes the new one. The disagreement is then reduced to whether you *want* a revolution. That is a political question, not a legal one, and it is answerable.
