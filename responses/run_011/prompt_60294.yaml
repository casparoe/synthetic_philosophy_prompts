answer: |-
  ### Q&A Prep Sheet: Applied Theory Workshop

  **Strategy Note:** Your audience treats priors as structural parameters, not metaphysical commitments. They will not care about the *normative* elegance of Aumann; they will care about whether your "hunt for priors" is an identifiable empirical strategy or just a story you tell about residuals. Keep answers focused on identification, robustness, and empirical content.

  ---

  #### 1. The Empirical Fit Objection (Highest Damage)
  *   **Who:** Senior Applied Micro (Empiricist)
  *   **The Question:** "You concede your model predicts less persistent disagreement than we actually observe in the data. If your framework can't account for the magnitude of the phenomenon it's trying to explain, what's the marginal contribution? Are you just telling us the world is more irrational than your model allows?"
  *   **The Reply:** "It's not that the world is irrational; it's that the *explanations* for disagreement are misallocated. The literature defaults to 'bias' or 'private information.' My model says: control for those, and the residual disagreement should be small. The fact that it isn't suggests there are structural frictions—communication costs, incentive incompatibilities—that we're currently mislabeling as prior heterogeneity. The tension isn't a bug; it's a diagnostic tool that tells us where to look for the frictions."
  *   **Weakest Point:** Don't gesture at **specific frictions**. If you name one (e.g., "costly signaling"), they'll ask why it's not in the model. Keep it abstract.

  #### 2. The Identification Objection (Critical Survival)
  *   **Who:** Applied Micro (Econometrician)
  *   **The Question:** "You advise us to 'hunt for the prior.' But priors aren't identified from choice data without functional form assumptions on utility. Without a structural model, isn't 'prior differences' just a label for unexplained variation in the error term?"
  *   **The Reply:** "It is if you only look at choices. But we have variation in information sets. If two agents see the same signal $s$ and take different actions $a_1, a_2$, and we can rule out incentive differences, the wedge is the prior. I'm proposing we use natural experiments where information exposure is exogenous—like randomized briefings or leaked documents—to isolate the mapping from signal to action. That identifies the prior ratio."
  *   **Weakest Point:** Don't claim **you have this data** if you don't. If you haven't run this regression, admit it's the "next step" or they will crucify you on current evidence.

  #### 3. The Robustness Objection (Technical Kill)
  *   **Who:** The Game Theorist
  *   **The Question:** "Aumann's result relies on common knowledge of posteriors. Monderer and Samet show agreement collapses with approximate common knowledge. In real workshops, we don't have common knowledge of posteriors, we have noisy signals about what others believe. Why should the theorem bind in an $\epsilon$-neighborhood of the model?"
  *   **The Reply:** "You're right that the strict theorem doesn't hold with noise. But the *logic* holds: disagreement requires a source. If common knowledge is approximate, the 'source' shifts from priors to the structure of the information partitions. My point is that researchers too quickly attribute the source to 'bias' (a prior story) rather than 'partition misalignment' (an information structure story). The theorem is a benchmark to distinguish the two."
  *   **Weakest Point:** Do not try to **out-math the Game Theorist** on $\epsilon$-bounds. If they push on the topology, yield ground ("That's a technical extension I'm working on") rather than bluffing.

  #### 4. The Rational Inattention Objection
  *   **Who:** Applied Micro (IO/Info focus)
  *   **The Question:** "Disagreement persists because processing information is costly, not because priors differ. Rational inattention explains the data without invoking unobservable prior heterogeneity. Why prefer your explanation?"
  *   **The Reply:** "Rational inattention explains why we haven't *exchanged* everything. My paper addresses the state *after* exchange is claimed. If agents say 'I've read your paper' and still disagree, inattention is no longer the binding constraint. At that point, we need to know if it's a prior wedge or a lie. Inattention is a friction; I'm studying the residual."
  *   **Weakest Point:** Don't claim **exchange is observable**. It's not. They will ask how you verify the "post-exchange" state.

  #### 5. The Hierarchical Model Objection
  *   **Who:** The Bayesian Statistician
  *   **The Question:** "In hierarchical modeling, we treat individual differences as random effects drawn from a hyper-distribution. You're treating priors as fixed, subjective parameters. Why not just estimate the variance of the random effects and skip the philosophical baggage of 'agreeing to disagree'?"
  *   **The Reply:** "Random effects describe the distribution of behavior; they don't prescribe how agents *should* update. My paper is about the normative implication of the interaction. If I know your prior is drawn from distribution $F$, Aumann tells me how I should adjust my posterior. Random effects capture heterogeneity; Agreement Theorem captures the *constraint* that heterogeneity imposes on rational communication."
  *   **Weakest Point:** Don't dismiss **descriptive adequacy**. If they press that "normative constraints don't help prediction," you have no comeback other than "this is theory."

  #### 6. The State Space Objection (Philosopher Translated)
  *   **Who:** Applied Micro (translating the Philosopher)
  *   **The Question:** "If agents have different priors, they effectively operate on different state spaces. How do you define 'same evidence' across different probability measures? If the sigma-algebras don't match, aren't you just comparing apples to oranges?"
  *   **The Reply:** "We define the state space objectively as the set of physically possible outcomes. Priors are just measures over that common space. Evidence is the filtration generated by the signal. As long as the signal is public (e.g., this data set), the sigma-algebra is common. The disagreement is in the measure assigned to the events, not the events themselves."
  *   **Weakest Point:** Don't get dragged into **self-locating belief**. If they ask about "where am I in the state space," punt ("That's outside the scope of this model").

  #### 7. The Strawman Objection
  *   **Who:** Junior Applied Micro (Skeptic)
  *   **The Question:** "You say economists use Aumann to call people liars. I've never heard anyone cite Aumann in a seminar to accuse someone of lying. Is this a strawman? If the rhetorical use isn't real, why build the paper on correcting it?"
  *   **The Reply:** "They might not cite Aumann by name, but they use the logic: 'We see the same data, so if you disagree, you're biased.' That's the Agreement Theorem logic without the label. It shows up in peer reviews, policy memos, and Fed minutes. The citation isn't the point; the inference pattern is."
  *   **Weakest Point:** Don't offer **anecdotes** as proof. If they ask for a citation, have one ready (e.g., a specific op-ed or famous dispute), or admit it's a "stylized fact."

  #### 8. The Policy Nullity Objection
  *   **Who:** Policy-Focused Micro
  *   **The Question:** "If the problem is fundamental prior differences, and priors are unchangeable, what's the policy lever? You're telling us disagreement is inevitable. That's a null result for mechanism design."
  *   **The Reply:** "It's not null; it shifts the lever from 'convince them' to 'aggregate them.' If priors differ, persuasion is futile. The mechanism design problem becomes voting rules or market aggregation where we don't need consensus, just efficient aggregation of the heterogeneous priors. It changes the goal from agreement to allocation."
  *   **Weakest Point:** Don't promise **a new mechanism**. If you don't have a design in the paper, don't promise one now.

  ---

  ### Strategic Advice

  **1. Concede Upfront:**
  Concede **Objection #1 (The Empirical Tension)** in your conclusion.
  *   *Why:* You already admit in the abstract that your view predicts less disagreement than observed. If you wait for them to find it, it looks like a blind spot. If you state it clearly ("My model predicts X, data shows Y, here is why that gap is interesting"), it looks like a research agenda. It takes the wind out of their sails because you've already validated their skepticism.

  **2. The Reply That Must Land:**
  **Objection #2 (Identification).**
  *   *Why:* If you cannot convince the applied micro people that "hunting for priors" is something other than "fitting residuals," the paper becomes philosophy. They need to believe there is an empirical strategy, even if it's hard. You must sound like you know how to write the regression, even if you haven't run it yet.

  **3. The Question to Fear Most:**
  **Objection #3 (Robustness/Approximate Common Knowledge).**
  *   *Why:* This is the Game Theorist's turf. If they can show that the Agreement Theorem dissolves under the slightest relaxation of common knowledge (which it does), your theoretical foundation looks brittle. You cannot bluff on the math here.
  *   *Honest Account:* You should be afraid because your paper relies on the *rhetorical* power of the theorem, but the theorem's *technical* power is known to be non-robust. If the Game Theorist demonstrates that "approximate agreement" allows for massive disagreement, your claim that the theorem rules out "unexplained disagreement" loses its bite. Prepare to pivot to "benchmark" language rather than "binding constraint" language if they press this.
