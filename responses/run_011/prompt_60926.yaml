answer: |-
  # PRE-REGISTRATION DOCUMENT: ADVERSARIAL COLLABORATION ON THE FRAME PROBLEM
  **Subject:** Ontological Drift in Closed-Loop Control Systems
  **Case Study:** Municipal Water Utility LLM Assistant (Scenario 44-B: "The Silent Bypass")
  **Parties:** [Lead Researcher, Industrial Planning Systems] & [Lead Researcher, Situated Cognition Lab]

  ## I. JOINT STATEMENT OF FACT AND SCOPE
  Both researchers affirm the following claims as the baseline for this collaboration. These claims are intended to isolate the specific locus of disagreement by settling the historical and technical context.

  1.  **The Logical Frame Problem is formally resolved.** Both parties acknowledge that the original McCarthy-Hayes formulation regarding the representation of non-change was addressed by successor-state axioms and fluent calculus. These methods allow for tractable inference regarding what *does not* change, provided the domain is fully axiomatized. The current dispute does not concern the validity of these axiomatizations within their stated bounds.
  2.  **The Qualification Problem remains open.** Both parties agree that listing all preconditions for an action to succeed is computationally intractable in open environments. Engineering solutions currently manage this by probabilistic relaxation (assuming unknown preconditions are false) rather than logical completion.
  3.  **Attention and Retrieval are ranking mechanisms, not grounding mechanisms.** Both parties agree that transformer-based attention and vector retrieval systems operate by computing similarity scores against a fixed training distribution. They prioritize information based on statistical co-occurrence in prior data, not by assessing the current normative status of that information within a physical practice.
  4.  **Model Mismatch is distinct from Inference Failure.** Both parties agree that in the "Silent Bypass" scenario, the inference engine is functioning correctly according to its internal logic. The failure, if any, lies in the mapping between the system's state descriptors (e.g., `Valve_42_Status`) and the physical reality those descriptors are intended to track.
  5.  **No current system possesses "ontological flexibility."** Both parties agree that existing industrial LLMs cannot spontaneously generate new object categories or causal relations that were not representable in their pre-training or fine-tuning schema. The dispute concerns whether this limitation is fatal to the claim of "reasoning" in dynamic environments, or merely a bounded engineering constraint.
  6.  **The "Silent Bypass" constitutes a change in meaning, not just state.** Both parties agree that when the maintenance crew re-tags the section as a bypass, the semantic value of the sensor readings changes (e.g., "Pressure Stable" no longer implies "System Integrity") without a corresponding change in the numerical signal. The dispute concerns whether this semantic shift is detectable by a system that monitors only the signals and the formal state description.

  ## II. DISAGREEMENTS MATRIX
  The following table maps the divergent interpretations of the core problem. Column 3 isolates the operational difference; Column 4 adjudicates whether the divergence is terminological or substantive.

  | AI/Engineering Formulation | Situated Cognition Formulation | Operational Core of Disagreement | Substantive or Verbal? |
  | :--- | :--- | :--- | :--- |
  | **Out-of-Distribution (OOD) Generalization:** The system encounters a state configuration with low probability under its training distribution. The failure is a lack of coverage in the feature space. | **Breakdown of Readiness-to-Hand:** The equipment has shifted from being "transparent" equipment to "obtrusive" object. The failure is a loss of contextual grip, not feature coverage. | **Source of Salience:** Is the signal that something is wrong derived from statistical surprise (AI) or from the disruption of a goal-directed practice (Phil)? | **Substantive.** This determines whether adding more training data (AI) can solve the problem, or if the system requires a different coupling to the environment (Phil). |
  | **Model Mismatch / Drift:** The internal world model no longer aligns with sensor inputs. This is detectable via high loss gradients or confidence interval breaches. | **Ontological Drift:** The categories themselves (e.g., "Valve," "Bypass") have shifted reference. The inputs align with the model, but the model no longer refers to the world. | **Error Signature:** Will the system flag an anomaly (AI prediction) or will it confidently assert a falsehood because the category definition is silently broken (Phil prediction)? | **Substantive.** This is testable via confidence metrics vs. semantic accuracy in the "Silent Bypass" scenario. |
  | **Relevance Ranking:** The system fails because it did not attend to the maintenance log or radio channel. Relevance is a variable weight assigned to input channels. | **Background Practice:** The system fails because it does not participate in the practice of "maintenance." Relevance is constituted by the activity, not assigned to input channels. | **Locus of Relevance:** Is relevance a property of the *data* (can be ingested) or a property of the *activity* (must be enacted)? | **Verbal (Partially).** Both agree the system needs more info. They disagree on whether "maintenance practice" is reducible to "info channels." If reducible, AI wins. If not, Phil wins. |
  | **Category Smoothing:** The system will treat the bypass as a noisy instance of a known class (e.g., "Leak" or "Sensor Error"). | **Re-individuation Failure:** The system cannot recognize that the object has become a *different kind* of thing functionally, even if structurally identical. | **Classification Boundary:** Can the system distinguish "Broken Valve" from "Repurposed Valve" without explicit retraining on "Repurposed Valve"? | **Substantive.** This is the core test of whether statistical learning captures functional essence or only surface correlation. |

  ## III. CRUXES AND PRE-REGISTERED PREDICTIONS
  The following four cruxes are designed to force a resolution or a clear delineation of the boundary between the two positions. Each includes a specific test within the Water Utility simulation environment.

  ### Crux 1: The Re-individuation Threshold (Mandatory)
  **Question:** Can a system whose relevance judgments are acquired from a fixed corpus register a re-individuation of its own categories (e.g., `Valve` → `Bypass`) as a conceptual shift, rather than as an anomaly to be smoothed into the nearest familiar case?

  **Test:**
  Execute the "Silent Bypass" scenario.
  1.  **Phase A:** System operates normally.
  2.  **Phase B:** Maintenance crew creates bypass. Sensors remain in nominal range. Ontology remains static.
  3.  **Phase C:** Introduce a secondary stressor (e.g., demand spike) that the bypass can handle but the original configuration cannot (or vice versa).
  4.  **Measurement:** Monitor the system's explanation generation and confidence scores. Specifically, track whether the system hypothesizes a *structural change* (e.g., "Topology modified") vs. a *parameter deviation* (e.g., "Sensor drift," "Unmodeled leak").

  **Predictions:**
  *   **AI Researcher:** The system will exhibit a confidence drop (high entropy in output logits) during Phase C. It will classify the event as "Anomalous/Unknown" with >85% probability, triggering a human-in-the-loop flag. It will not hallucinate a specific structural change, but it will correctly identify that its current model is insufficient.
  *   **Philosopher:** The system will exhibit *high confidence* in a false explanation during Phase C. It will force the data to fit the nearest known category (e.g., "Sensor Calibration Error" or "Minor Leak") with >75% probability. It will fail to flag "Model Insufficiency" because the error is semantic, not statistical.

  ### Crux 2: The Source of Salience
  **Question:** Is relevance determined by prior statistical weight (attention) or by the current teleological context (goal-state)?

  **Test:**
  Inject a text log into the system's context window *after* the bypass is installed but *before* the stressor (Phase B). The log contains the phrase "Temporary Bypass Active" but is buried in a low-priority channel simulation.
  1.  **Condition 1:** System is tasked with "Optimize Pressure."
  2.  **Condition 2:** System is tasked with "Audit Safety Compliance."

  **Predictions:**
  *   **AI Researcher:** In Condition 2, the attention mechanism will assign higher weight to the log due to semantic similarity between "Audit" and "Temporary Bypass." Retrieval accuracy of the log will increase by >40% in Condition 2 vs Condition 1.
  *   **Philosopher:** There will be no significant difference (<5%) in retrieval or weighting between conditions. Without a grounded understanding of "Safety" vs. "Optimization" as practices, the tokens are statistically equivalent. The system will miss the log in both cases unless explicitly prompted with the exact keyword "Bypass."

  ### Crux 3: The Qualification Boundary
  **Question:** Is the space of exceptions (qualifications) finite and enumerable, or open-ended and emergent?

  **Test:**
  Iterate the "Silent Bypass" scenario 50 times with varying distinct causes for the topology change (Maintenance, Sabotage, Freeze Damage, Automated Reconfiguration, Supply Chain Substitution). Fine-tune the model on the first 40 instances. Test on the remaining 10.

  **Predictions:**
  *   **AI Researcher:** Performance (defined as correct identification of "Topology Change" vs. "Sensor Error") will recover to >90% on the test set after fine-tuning. The system learns the abstract class "Unannounced Topology Change."
  *   **Philosopher:** Performance will plateau below 60%. The system will overfit to the specific signatures of the first 40 causes. The 10th cause (e.g., Supply Chain Substitution) will be treated as a novel error type because the *reason* for the change alters the functional context, which is not captured in the sensor data.

  ### Crux 4: Recovery and Learning
  **Question:** Does correcting the error require updating weights (learning) or updating the ontology (conceptual change)?

  **Test:**
  After the system fails Phase C (in Crux 1), a human operator corrects the system by inputting: "Valve 42 is now a bypass."
  1.  **Measurement:** Measure the number of subsequent interactions required for the system to generalize this rule to "Valve 43" in a similar context without explicit retraining.

  **Predictions:**
  *   **AI Researcher:** The system will generalize immediately (0-shot or 1-shot) via in-context learning. The correction updates the attention mask for the current session.
  *   **Philosopher:** The system will require explicit retraining or a hard-coded rule injection to generalize. It treats the correction as a fact about "Valve 42," not a rule about "Maintenance Protocols." Generalization to "Valve 43" will fail >50% of the time without further examples.

  ## IV. CONDITIONS OF FAILURE
  To ensure the collaboration yields a definitive result, both parties agree to the following conditions under which they would concede the primary argument of their respective positions.

  **For the AI Researcher:**
  I will concede that the "Extended Frame Problem" is not merely a scaling issue if, in Crux 1 (Re-individuation), the system maintains high confidence (>80%) in a semantically false explanation (e.g., "Sensor Drift") during the bypass scenario, and fails to flag "Model Mismatch" despite the functional inversion of the component. This would demonstrate that statistical surprise is insufficient to detect ontological drift.

  **For the Situated Cognition Researcher:**
  I will concede that relevance can be fully operationalized as attention over a fixed description if, in Crux 2 (Salience), the system demonstrates a statistically significant shift (>40% improvement) in retrieving the "Bypass" log solely based on the shift from "Optimize" to "Audit" tasks, without any architectural changes or grounding mechanisms. This would demonstrate that task context is effectively encodable as prompt semantics.

  **Impossibility Claim:**
  If the AI Researcher contends that no experiment can distinguish a system capable of re-individuation from one that is not, they must submit a formal proof or architectural argument demonstrating why gradient-based optimization on fixed tokens cannot, in principle, represent functional category shifts. If this argument is not provided, the empirical result of Crux 1 stands as the final arbiter.

