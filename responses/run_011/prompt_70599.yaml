answer: |-
  The Precision Collective employs 150 worker-members in a rusting mid-sized city, competing for OEM contracts against two investor-owned firms and a rival co-operative. Internally, surplus is allocated 60% by hours worked and 40% by a peer-assessed skill coefficient, while managers are elected annually and removable only by a two-thirds assembly vote. Discipline for under-performance relies on peer review panels, but dismissal requires an 80% supermajority, making it rare; meanwhile, new entrants endure a two-year probation with no equity vote, during which founding members assign them the least desirable shifts. The Collective is currently losing bids due to inconsistent output quality traced to protected under-performers among the founding cohort, prompting a choice between merging into a national co-operative federation or accepting municipalization.

  The Municipal Development Authority offers to take the plant into public ownership, guaranteeing contracts and standardizing pay scales across all city industries to resolve the remuneration-exertion gap, with workers holding minority representation on a central board. This structure enforces discipline through civil service protocols rather than peer consensus, solving the immediate incentive drift, but it subsumes the shop into a single city-wide industrial utility where exit is impossible and innovation requires bureaucratic approval. The Collective's founders resist because municipalization flattens wage differentials based on skill into fixed grades and eliminates competition between local firms, while the federation offer retains market competition but leaves the internal governance deadlock on discipline and inter-generational equity unresolved.

  **Show Your Work**

  Mill's late position strikes both horns using distinct categories from the *Chapters on Socialism* and the *Principles*. On the co-operative horn, Mill's critique of socialism bites: without the "wage sanction" or the master's power of dismissal, the link between "remuneration and exertion" frays, and the founding cohort risks becoming a "new master class" over probationers, validating the claim that co-ops inherit socialism's incentive difficulties. On the public-ownership horn, Mill's objection to state socialism bites: by making the municipality the "universal employer," the scheme creates a monopoly of industrial life that extinguishes "individual initiative" and the "variety of experiments" inherent in competing firms. The single feature doing the work is the **locus of disciplinary authority**: internal consensus fails to sustain exertion, while external authority sustains exertion but destroys liberty.

  In the first ablation, if inter-firm competition is removed and the industry placed under one federated association, the co-operative horn loses its decisive advantage. Mill prefers co-ops partly because they retain the "stimulus of competition"; without it, the federation resembles the state monopoly in structure, leaving only the incentive problem unsolved. In the second ablation, if effort becomes perfectly observable to the assembly, the co-operative horn is vindicated. Mill's skepticism rests on the *difficulty* of measuring exertion without a master; if observability is perfect, the co-op secures high exertion without surrendering liberty, collapsing the *Chapters* critique.

  The strongest reply for a defender of Mill's co-operative preference is that the case tests the co-op's ability to survive within a capitalist market context rather than its intrinsic viability. Mill argued that worker ownership would *increase* productivity through heightened interest, so judging the co-op by its failure to match capitalist discipline metrics smuggles in the wage sanction as the only valid measure of efficiency, effectively testing whether co-ops can mimic firms rather than whether they improve them. Regarding the Basque counterexample, the Mondragon corporation relies on hierarchical management and external hiring controls, whereas this case stipulates direct assembly sovereignty, making them structurally distinct regarding the discipline mechanism.
