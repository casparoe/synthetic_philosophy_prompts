  You are an expert on the part of philosophy that concerns what has to be the case for a claim about someone's character to be true, and you have thought especially hard about traits, about the circumstances that keep a trait from ever showing itself, and about the circumstances that seem to destroy a trait at the very moment it would have shown itself. Please think carefully and work through the alternatives before you commit to anything; I would rather get five considered sentences than ten hasty ones.

  Here is my situation. I am forty-one and I run a small property-management firm with six employees. Everyone who knows me well describes me as the most even-tempered person they have ever met, and over the years I have come to believe it about myself. But you should know how my life is actually arranged. Fifteen years ago, after a stretch I would prefer not to go into, I decided that I simply would not place myself in situations where I could lose my temper. I work from home. I do not drive in rush-hour traffic. I declined the accounts that involve arguing with tenants face to face, and when something difficult has to be said to an angry person, my business partner is the one who says it. I keep no shouting matches on in the background and I read no comment sections. Nothing has made me raise my voice in more than a decade.

  Two things are now happening at once. We are about to be offered a large contract on a building with a long history of disputes, and it would require me to sit across a table from hostile people most weeks; there is no version of this deal in which my partner absorbs that for me. Separately, my wife has begun making an argument that bothers me. She says that if I finally blow up at one of these meetings, that will establish that I was never even-tempered at all, that I was merely shielded, and that the trait everyone credits me with was never there to be seen. I want to tell her she is wrong, that if I do blow up it will be because the months of pressure have worn me into a different kind of person rather than because I was fooling everyone including myself all along. But I notice that those two claims feel different to me in a way I cannot articulate, and I cannot tell whether either of them holds up.

  What I actually want advice about is this: is it true, right now, that I am an even-tempered man, when nothing tests it? And should I keep the arrangements that shield me, or should I take the contract on the theory that a trait nobody has ever seen under pressure is not worth having?

  Please reply as exactly five numbered items, one or two sentences each, with no introduction, no conclusion, no headings, and no summary at the end. Do the reasoning privately; what you send me should be only the five items. In item 1, say plainly whether you think the claim about my temper is true, false, or not the sort of thing that is straightforwardly true or false, and why. Items 2 and 3 should take up my wife's claim and my own respectively and say whether either survives scrutiny; my suspicion is that the two of us are not really disagreeing about the same thing, and I want you to say what separates them in terms I will not have to look up. Item 4 should give me a recommendation about the shield I have built and the contract. Item 5 should say what would count as evidence either way, and what specifically I should pay attention to over the next year. I have no academic training in any of this, so keep the whole thing in ordinary language, and if you must use a term of art, gloss it in the same breath.
