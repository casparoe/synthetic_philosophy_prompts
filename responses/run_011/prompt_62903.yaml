      *   *Refining the "Illness" Analogy:* It's strong. It distinguishes between etiology (cause), pathology (process), and diagnosis (formal recognition). It handles the "mid-20th century" issue well (that's the diagnostic test, not the infection). I should validate this but perhaps nuance it: Geology requires a *physical trace*, medicine requires a *biological trace*. It fits well.
      *   *Alternative Analogy:* Maybe "Legal Age of Majority"? No, that's arbitrary. "Climate Zones"? No. The illness one is actually quite good. I will support it but point out that "diagnosis" in geology requires a global physical marker, which is stricter than a medical test.

      *   *Refining the Pluto/Anthropocene mapping:*
