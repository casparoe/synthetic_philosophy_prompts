      *(Refining the Illness Analogy)*: The user suggests: Infection = Agriculture, Symptoms = Ecological change, Test = Radionuclides. This maps perfectly to the "Early Anthropocene" vs. "Mid-20th Century" debate. I should endorse this strongly but note that in geology, the "test" must be in the rock, not just a blood sample.

