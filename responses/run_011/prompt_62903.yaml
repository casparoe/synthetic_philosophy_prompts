      *   *Key Insight:* The student treats the Anthropocene as a *thing* to be named (like Pluto). It is actually a *slice of time* to be bounded. The "rejection" wasn't saying "humans didn't change the earth," it was saying "the mid-20th century spike doesn't function as a boundary for an Epoch in the way we require."

  7.  **Final Polish:** Check against constraints.
