      The wind makes memory difficult. It strips sentiment away. We stand here because twelve names were just spoken. They hang in the air longer than our breath does. The programme in your hand calls them ordinary people, just like you and me. For twenty years I have worked with the paper trails of this city. I have learned that words like ordinary are heavy. They carry more weight than we intend.

      If ordinary means compliant, then the sentence is wrong. Most people were compliant. Compliance kept the lights on. Compliance kept the trains running. If ordinary means average, then the sentence is an insult. What these twelve did was not average. Almost no one else did it. So we must find a different weight for the word. We must find what is truly shared.

      Last month a granddaughter wrote to the local paper. She objected to our official version. She said her grandmother was not a saint. She was stubborn. She was bad-tempered. She owed money up and down the street. She had been feuding with the butcher next door for eleven years. When asked after the war if she had been brave, she said no. She said she had not been able to bear the thought of herself afterwards.

      This is the ordinary I want to speak of. It is not about being nice. It is not about being good. It is about the internal noise that happens when you are alone with your own thoughts. Hannah Arendt suggested that conscience is not a special faculty. It is a by-product of thinking. It is the habit of keeping up an argument with oneself. The twelve honoured here did not possess a superior morality. They possessed an inability to silence that argument.

      To the students from the Gymnasium: You know this noise. You know the moment when doing what is expected feels like a betrayal of something inside you. It is not always a grand political stand. Sometimes it is just refusing to laugh at a joke that hurts someone. Sometimes it is sitting alone rather than joining the crowd. This is not heroism. It is maintenance. It is keeping the self intact.

      The bakery on the corner is a mobile phone shop now. The cellar is still there. I have been down there. It is damp. It is small. It is not a cathedral. It is a place where people argued about money and bread and safety. The underground newspaper they printed ran to perhaps three hundred copies over eleven issues. Then the press was found. Then came the arrests. Then the camps.

      We cannot say that everyone else was a monster. The archive is unambiguous. Most people here were neither heroes nor villains. They were compliant in small, unglamorous ways. They looked away. They locked their doors. They did not want trouble. I will not prosecute the dead for surviving. Survival is not a crime. But survival has a cost. The cost is sometimes the silence of that internal argument.

      The twelve we honour did not pay that cost. They paid a higher one. They paid with their lives. But they did not pay with their selves. They remained who they were. They remained stubborn. They remained in debt. They remained in feud. But they remained able to look in the mirror.

      So when the programme says they were ordinary, just like you and me, it does not mean anyone would have done this. It means the capacity was there. The machinery of the self was the same. The difference was not in the equipment. It was in the usage. They kept the argument going. They refused to let the noise stop.

      This is not a pledge. I will not ask you to promise anything. The dead do not need our promises. They needed friends who were willing to be difficult. They needed neighbours who were willing to be troublesome. They needed people who valued their own internal silence more than external peace.

      The Mayor will speak in a moment. He will speak of duty. He will speak of the future. He will speak of what we owe the memory of these twelve. I am an archivist. I speak for the record. The record shows that resistance looks like stubbornness. It looks like bad temper. It looks like a refusal to fit.

      We are cold. We are ready to go home. But before we leave, consider the ordinary. Consider the person you are when no one is watching. Consider the argument you have with yourself in the quiet. That is the only place where this begins. It does not begin in the market square. It begins in the kitchen. It begins in the cellar. It begins in the mind.

      The twelve names are spoken. The wind takes them. But the capacity to hear them remains. It is ordinary. It is yours. It is waiting.

      (End)

