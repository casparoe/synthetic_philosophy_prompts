      *   **Specific Tasks:**
          *   Reconstruct two small theories (one for insurance, one for lottery) explaining their behavior.
          *   Identify assumptions, ruled-out rival thinking, and commitment level (principled vs. incidental).
          *   Identify the source of the asymmetry.
          *   Address consistency (is the insurance cap arbitrary? is the lottery cap-less rational?).
          *   Address the "what if" scenario (if insurance used straight EV arithmetic, what changes?).
          *   **Constraint:** The very last line must be: `Verdict: [SAME | DIFFERENT | INCOHERENT] — then ten words or less on what it comes down to.`

  2.  **Deconstruct the Insurance Side:**
      *   *Observation:* Insurers cap liability (e.g., $10M umbrella, no $500M).
      *   *User's Napkin Math:* Expected Value (EV) = Probability $\times$ Payout. If $P = 1/1,000,000$ and $L = \$500M$, Premium = $\$500$.
      *   *Why the refusal?*
          *   **Risk of Ruin:** Insurance companies are leveraged entities. A single $500M loss could wipe out capital reserves, trigger insolvency, or breach regulatory capital requirements (Solvency II, NAIC standards).
          *   **Correlation Risk:** A $500M liability claim isn't usually isolated. If a wildfire takes out a neighborhood (as the user suggested), *everyone* sues *everyone*. It's not one $500M claim; it's 1,000 $500k claims hitting the same insurer simultaneously. This violates the "Law of Large Numbers" assumption insurance relies on (independence of risks).
          *   **Reinsurance:** Insurers buy insurance for themselves. The reinsurance market has limits. If reinsurers won't cover it, primary insurers won't write it.
          *   **Moral Hazard/Litigation:** Huge limits invite huge lawsuits. "Deep pocket" syndrome.
      *   *Theory:* **Capital Preservation & Correlation.** Money is not linear; survival is binary. A loss that threatens solvency has infinite disutility.
      *   *Consistency:* The cap isn't arbitrary; it's tied to surplus and reinsurance capacity. $2M vs $10M is manageable; $500M is existential.

  3.  **Deconstruct the Lottery Side:**
      *   *Observation:* Lotteries offer uncapped jackpots (rolling over).
      *   *User's Napkin Math:* If Jackpot > Odds $\times$ Ticket Price, EV is positive.
      *   *Why the openness?*
          *   **Revenue Model:** The lottery is a state monopoly. The "payout" comes from ticket sales *of that specific draw* (usually). It's not pulling from a reserve fund built over decades.
          *   **Risk Pooling:** The risk is shared among *all ticket buyers*. The state takes a fixed cut (e.g., 50%). If the jackpot is $1B, it's because millions of people bought tickets. The money is already there.
          *   **Annuity Structure:** Advertised jackpot is annuity value. Cash lump sum is ~50-60% of that. This reduces immediate liquidity risk.
          *   **Demand Elasticity:** Huge jackpots drive ticket sales disproportionately (FOMO). It's a marketing feature, not a risk exposure in the insurance sense.
          *   **Sovereign Backing:** If a state lottery *actually* ran out of money (unlikely due to structure), the state could tax or print (if federal, but these are state). They can't go "bankrupt" in the same way a private insurer can.
      *   *Theory:* **Revenue Maximization & Pre-funded Liability.** The liability is created *by* the revenue. You don't pay out unless you collect enough to cover it first.
      *   *Consistency:* It is consistent. They never promise more than the pool contains (plus future interest for annuity).

  4.  **Compare the Asymmetry:**
      *   *Insurance:* Promise to pay *if* bad thing happens (unknown cost, potentially exceeding reserves). Risk is *underwritten*.
      *   *Lottery:* Promise to pay *from* money collected (known cost, capped by sales). Risk is *pooled among participants*.
      *   *Key Difference:* Insurance sells protection against *external* loss. Lottery sells a share of *internal* pool.
      *   *Insurance:* "I promise to find $500M if your house burns." (Credit risk).
      *   *Lottery:* "We will split the pot of money everyone put in." (No credit risk).

  5.  **Address the "What If" (Insurance using EV):**
      *   If insurers priced purely on EV without capital constraints:
          *   They would sell unlimited coverage.
          *   They would charge low premiums for tail risk.
          *   They would go bankrupt on the first correlated catastrophe.
          *   They would need infinite capital reserves.
          *   Reinsurance markets would collapse.

  6.  **Drafting the Response (incorporating the "Two Theories" structure):**

      *   *Theory 1 (Insurance):* **Solvency Constraint Theory.**
          *   *Assumption:* Insurer survival is paramount. Losses are non-linear (bankruptcy is a cliff).
          *   *Ruled Out:* Pure EV maximization.
          *   *Commitment:* Regulatory and existential.
      *   *Theory 2 (Lottery):* **Pre-Funded Pool Theory.**
          *   *Assumption:* Payouts are a percentage of intake, not a liability against assets.
          *   *Ruled Out:* The idea that the state is "on the hook" for the number advertised.
          *   *Commitment:* Structural/Accounting.

      *   *The Asymmetry:* Insurance is a *short volatility* position (selling risk). Lottery is a *fee-taking intermediary* (facilitating risk sharing among players).
      *   *Consistency:* Insurance caps are principled (capital limits). Lottery uncapped is principled (sales-driven).
      *   *EV in Insurance:* Would require infinite capital or government backing (like NFIP).

  7.  **Refining the "Verdict":**
      *   Are they the same theory? No. One is about capital adequacy against external shocks (Insurance). One is about distributing internal pool proceeds (Lottery).
      *   Are they incoherent? No, both make sense within their structures.
      *   So, **DIFFERENT**.
      *   Why? Insurance sells a guarantee; Lottery sells a share.
