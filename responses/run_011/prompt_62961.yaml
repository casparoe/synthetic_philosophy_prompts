answer: |-
  Here are the two theories reconstructing why these institutions behave so differently, followed by the asymmetry analysis and the verdict.

  ### Theory 1: The Insurer's Solvency Constraint
  **The Practice:** Refusing to write liability coverage beyond a certain cap (e.g., $10M), regardless of premium offered.

  *   **What must be true:** An insurance company is not a betting counter; it is a leveraged financial intermediary. Its primary asset is *trust* that it can pay claims. To maintain this, regulators require them to hold capital reserves proportional to "Probable Maximum Loss" (PML), not just Expected Value (EV).
  *   **What it rules out:** Pure Expected Value pricing. Your napkin math ($500M \times 1/1,000,000 = \$500$) assumes the insurer can absorb a $500M hit once every million years without flinching. In reality, a single $500M hit could bankrupt the firm *today*. Bankruptcy is a binary cliff, not a linear cost.
  *   **Commitment Level:** Existential and Regulatory. This isn't marketing; it's solvency. Insurers buy reinsurance to offload risk, but the reinsurance market *also* has caps. If the reinsurers won't cover $500M, the primary insurer physically cannot sell it.
  *   **Consistency:** The line between $10M and $500M is not arbitrary; it tracks the insurer's surplus and reinsurance treaties. Selling $2M is safe because many uncorrelated risks pool together. Selling $500M on a wildfire exposure is unsafe because that risk is *correlated* (if one house burns, they all burn). The Law of Large Numbers fails, turning insurance into gambling.

  ### Theory 2: The Lottery's Pre-Funded Pool
  **The Practice:** Offering uncapped jackpots that roll over based on ticket sales.

  *   **What must be true:** The lottery is not underwriting risk; it is administering a prize pool. The liability is not against the state's general assets, but against the *current draw's revenue*. The "jackpot" is simply a marketing label for "money collected from players minus the state's cut."
  *   **What it rules out:** The idea that the state is "on the hook" for the advertised number. If ticket sales are low, the jackpot doesn't grow. If sales are high, the jackpot grows, but the money to pay it is already in the till.
  *   **Commitment Level:** Structural. The lottery commission takes a fixed percentage (e.g., 50%) off the top for state programs. They have zero downside risk. A $1.4B jackpot means ~$2.8B in tickets were sold. They aren't lending money; they are passing the pot to the winner.
  *   **Consistency:** It is consistent to have no cap because the cap is dynamic: it is capped by demand. Regarding your EV point: when jackpots get huge, ticket sales surge, drastically increasing the probability of *splitting* the pot with other winners. This usually negates the positive EV. Even if EV remains positive, the lottery *wants* that perception to maximize sales. They profit from the volume, not the odds.

  ### The Asymmetry: Who Holds the Tail Risk?
  The real asymmetry is **Credit Risk vs. Distribution Mechanism.**

  *   **Insurance:** You are asking the insurer to pledge *existing capital* against a future catastrophe. You are buying a guarantee. If the event happens, they must find money they might not have. The risk is on their balance sheet.
  *   **Lottery:** You are buying a ticket to a pool where the prize is defined by *future contributions* from other players. You are buying a share. If the event happens (you win), the money is already there because the "event" (mass ticket buying) funded it. The risk is on the players (that no one wins or everyone splits).

  **If Insurance Used Straight EV Arithmetic:**
  If insurers priced purely on EV without capital constraints:
  1.  **Reserves:** They would need to hold 100% cash reserves for the maximum possible loss, destroying their business model (which relies on investing float).
  2.  **Products:** They would offer unlimited coverage, but premiums would skyrocket to fund those reserves, making insurance unaffordable.
  3.  **Structure:** They would cease to be insurers and become banks. To actually write $500M policies on EV alone, they would need sovereign backing (like FEMA/NFIP), because private capital cannot withstand non-diversifiable tail risk.

  **On the Lottery Cap:**
  They don't cap the jackpot because the annuity structure (30 years) allows them to invest the principal and pay from interest/coupon payments, reducing the immediate cash liquidity needed. Capping it would reduce the marketing "hook" that drives the ticket volume required to fund the prize.

  ### Consistency Check
  *   **Insurer:** Consistent. They stop selling when the risk threatens solvency or exceeds reinsurance capacity. The "refusal to quote" is because the risk is unquantifiable (correlation risk), not just expensive.
  *   **Lottery:** Consistent. They never promise more than the pool contains. The "uncapped" nature is an illusion; it is capped by the total amount of money players are willing to lose.

  Verdict: DIFFERENT — Insurance risks capital solvency; lottery distributes player contributions.
