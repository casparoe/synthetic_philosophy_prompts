answer: |-
  You are right to be suspicious of Option #3, but not for the reason you think. It isn't neutral—no schema is neutral. Choosing which fields to track (acts, intent, targeted group) is itself a policy decision that prioritizes certain facts over others. However, your intuition that "the same events might need two different labels in two different parts of the system" is not insane; it is actually the correct insight. You are currently suffering from **concept overloading**. You are trying to make one boolean answer two incompatible questions: "Is this legally genocide?" (for the transparency report) and "Is this dangerous enough to warrant emergency intervention?" (for the review queue).

  The PM is half-right: credibility matters for external reporting. If you dilute the legal term there, you invite regulatory backlash. The Researcher is half-right: safety interventions need to happen before the legal bar of "intent to destroy" is met, because by then it's too late. But a "moral boolean" is operationally unworkable because reviewers cannot adjudicate morality consistently.

  Your proposal (Option #3) is the only engineering solution that survives contact with reality, provided you stop calling it "neutral." It is not neutral; it is **decoupled**. It separates *observation* (what happened) from *classification* (what we call it) and *action* (what we do). This allows your Transparency Report to query for "Legal Genocide" (high bar) while your Crisis Panel queries for "Atrocity Risk" (lower bar) using the same underlying data. You aren't hiding the judgment; you are moving the judgment to where it belongs (policy configuration) rather than hardcoding it into the database schema.

  In the design review, do not argue about the definition of genocide. Argue about **signal fidelity**. A boolean destroys information; a structured record preserves it. If you keep the boolean, you permanently lose the ability to distinguish between "cultural destruction" and "physical destruction" in your data, making it impossible to tune your classifiers later.

