answer: |-
  (1) A retired chef convinces herself she cooks for pleasure alone, while subtly tailoring every meal to secure one partner's continued presence.

  (2) The crux is the shift from public acclaim to intimate dependency, testing the "mastery of happiness." The inventory item doing the work is "preserving illusions" despite knowing better. The revealing act is her delaying her own meal until he validates the food, alongside ignoring a threatening message.

  (3) 
  The kitchen smelled of browned butter and thyme, a scent Elena had once sold by the plate to strangers who wrote about it in newspapers. Now the newspapers were kindling for the stove, and the strangers were gone. She stood at the island, plating the duck confit, crisp skin gleaming under the pendant lights. She told herself she was making it because she craved the fat, the salt, the crunch. She had not craved meat in three years, but David liked it, and liking what David liked was simply a matter of shared taste, not accommodation.

  Her phone buzzed on the counter, screen up. A preview flashed: *We need to talk about us.* She saw it. She knew what that sentence meant in the grammar of a five-year relationship. She could pick it up, read the rest, and begin the evening with the truth. Instead, she slid the phone face down across the granite. She would deal with the text tomorrow. Tonight, the illusion of continuity was warmer.

  David came in from the garden, shaking rain from his jacket. He looked tired, the lines around his eyes deeper than they had been in the summer when she decided to close the restaurant. He said he was starving. She said she was too. She placed the plate in front of him. She sat opposite with her own plate, fork in hand.

  She did not eat. She watched him cut the skin. She told herself she was letting the steam escape, that she preferred it slightly cooler. Her fork hovered over the potato gratin. David lifted a piece of duck to his mouth. He chewed. He nodded, a small, almost imperceptible dip of the chin. "Good," he said.

  Elena lowered her fork into the gratin. She took a bite. It was cold. It tasted of grease and salt. She smiled.

  David's phone buzzed in his pocket. He didn't reach for it. He poured wine, filling her glass first. He asked about the garden, about the roses she was pruning. She told him they were blooming early. They were not blooming at all; they were brown stalks in the mud. But saying they were blooming made the table feel lighter. He smiled back. He ate another piece of duck.

  She ate another potato. She felt a surge of warmth in her chest, a quiet satisfaction that had nothing to do with the food. It was the same feeling she used to get when the reviews came in, the five stars, the applause, but distilled into a single nod across a table. She had left the applause behind to find herself. She had found David instead.

  He reached across the table and touched her hand. His palm was warm. She turned her hand over to interlace their fingers. She did not think about the phone face down on the counter. She did not think about the brown stalks in the garden. She thought about the duck, and the wine, and the fact that she was full. She was the master of this evening. She had chosen the menu. She had chosen the silence.

  David finished his wine. He looked at her, really looked at her, for the first time in months. "I'm glad you're here," he said.

  "Me too," Elena said.

  She took a sip of wine. It was dry. It tasted like copper. She swallowed it and poured more. Outside, the rain stopped. The kitchen was quiet, save for the hum of the refrigerator and the sound of their breathing. She picked up her fork again. She ate until the plate was clean. She felt happy. She did not look at the phone.

  (4) The story surrenders the claim that we are masters of our own happiness, showing autonomy compromised by intimate dependence. It also gives up "never letting the heart attach to someone who brings misery," as she chooses the attachment despite knowing the risk. The illusion is preserved because the happiness it yields is real, however fragile.
