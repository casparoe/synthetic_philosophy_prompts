  2. When counting the objects in the dry dock, does partial composition imply extra entities in the region or merely vaguer talk about a single entity? You are not permitted to answer that counting is merely context-dependent, as that surrenders the ontology to the problem of the many.
  3. Are these degrees of composition mind-independent features of reality, or do they secretly track our explanatory interests? If you assert they track interests, you must admit that you have simply reinvented conventionalism with a scalar gloss.
  4. Do the causal powers of the parts come in degrees too, or does the whole's power over-determine the parts'? You cannot claim both are fully causal without accepting systematic overdetermination.
  5. What specific argument or observation would actually move you off this view if pressed hard enough? You are not allowed to reply that resolving this is merely a matter for future research.
