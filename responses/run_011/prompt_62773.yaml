      *   *Thesis:* RCF is structurally illegitimate at civilizational scales.
      *   *Why?* The warrant for the outside view (statistical regularity derived from a reference class) breaks down because the necessary conditions for valid statistical inference are not met at this scale.

  3.  **Drafting - Section by Section:**

