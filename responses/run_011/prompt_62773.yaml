      *   **Component 1: Sampling (The Exchangeability Problem):**
          *   *Premise:* Valid base rates require the sample to be drawn from the same generating process as the target.
          *   *Argument:* "Great Powers" are defined retrospectively. We know they are great powers *because* they lasted long enough or left records. This is selection bias on steroids. It's not a random sample; it's a curated museum exhibit.
          *   *Technical term:* Endogenous selection. The definition of the class depends on the variable being predicted (longevity/influence).

      *   **Component 2: Label Sensitivity (The Granularity Problem):**
          *   *Premise:* A reference class must be stable under reasonable re-description.
          *   *Argument:* If you define "Empire" narrowly (e.g., "Maritime Hegemons"), $N$ is tiny (statistical noise). If you define it broadly ("Political Entities"), the variance is huge (Rome and a city-state are in the same bucket). The median shifts wildly based on semantic choices.
          *   *Implication:* The number isn't a discovery; it's a parameter choice.

      *   **Component 3: Reflexivity (The Observer Effect):**
          *   *Premise:* The target system can internalize the prediction.
          *   *Argument:* Bridges don't know they are expected to last 50 years. Hegemons read Toynbee. If the forecast is "decline is inevitable," they might over-extend to prevent it or contract to preserve core. The act of forecasting alters the trajectory.
          *   *Distinction:* This isn't just chaos; it's game-theoretic feedback.

      *   **Identifying the "Load-Bearing" Component:**
          *   Reflexivity is strong, but systems can sometimes be modeled with feedback loops.
          *   Label Sensitivity is annoying but could be solved with better taxonomy.
          *   *Sampling/Exchangeability* is the killer. If the sample isn't exchangeable with the target, *no* statistical inference is valid. It undermines the math itself. I will argue this is the primary failure mode.

      *   **The Steelman Counter-Argument:**
          *   *Opponent:* "All models are wrong, but some are useful." Even if imperfect, the outside view corrects for inside-view optimism. We don't need perfect exchangeability, just *enough* similarity to beat a coin flip. Physics isn't perfect either, but we build bridges.
          *   *Specific Rebuttal to Sampling:* We can correct for survivorship bias statistically.
          *   *Specific Rebuttal to Reflexivity:* Markets are reflexive, yet we forecast them.

