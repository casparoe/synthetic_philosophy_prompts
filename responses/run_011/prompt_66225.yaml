  **Elena Vance. Harrow (North), Keld (South). The Ouse Bridge Joint Escrow.**

  **Scenario One**
  The repair fund sits in a neutral basket currency, accruing interest during the five-year procurement window. Under the original treaty, yield above the baseline inflation rate reverts to the Harrow municipal pension fund. Elena reviews the quarterly ledger: the yield is stable, matching global benchmarks, and the pension fund relies on this liquidity to cover local retiree healthcare without raising taxes. She signs the voucher to release the principal for steel procurement, leaving the interest to flow to Harrow. The arithmetic is neutral; the capital remains available for the bridge regardless, and the interest supports the specific community whose workers will build it. She files the paperwork before lunch, noting only that the local arrangement minimizes transaction friction and sustains the town's social baseline.

  **Scenario Two**
  A new clearinghouse protocol offers a higher-yield instrument for the escrow, but the surplus interest must be directed to a Global Infrastructure Resilience Fund rather than the Harrow pension. The arithmetic is no longer neutral: the Global Fund yields 2.5% more, compounding to a sum sufficient to reinforce the seismic dampeners on the Keld approach, which otherwise will degrade within a decade. The Harrow pension will absorb the loss without immediate default, masking the deficit for years, and no audit will flag Elena's authorization as illegal. She signs the voucher for the higher-yield instrument. She does not note the pension shortfall in her memo; she cites only the engineering code's mandate to maximize structural longevity per unit of capital. The bridge will stand longer, but the town's safety net thins invisibly.

  ***

  ### The Walkthrough

  **The Three Positions**

  1.  **The Particularist (MacIntyre):**
      *   **On Scenario One:** Approves. The action sustains the "common project" of Harrow. The pension fund is part of the local moral fabric; supporting it is a duty of loyalty. Since the global good doesn't suffer, there is no conflict.
      *   **On Scenario Two:** Condemns. Elena has betrayed her specific obligation to Harrow. By diverting resources to a "global" abstraction, she has treated her neighbors as means to an end for strangers. The fact that the bridge lasts longer is irrelevant if the community that maintains it is economically hollowed out. Patriotism requires prioritizing the *local* good even at a cost to the *general* good.
      *   **Sharper Move:** The Particularist argues that Scenario Two isn't just a trade-off; it's a category error. You cannot have a duty to "humanity" because humanity is not a community with a shared life. Elena isn't being moral in S2; she is being administrative. She is optimizing a machine, not sustaining a polis.

  2.  **The Cosmopolitan (Impartialist):**
      *   **On Scenario One:** Approves. The action maximizes welfare (bridge gets built, pension gets paid) without violating universal principles. National partiality is tolerated here only because it coincides with utility.
      *   **On Scenario Two:** Approves Elena, condemns the Particularist. The extra 2.5% prevents structural degradation in Keld, reducing suffering and risk. The Harrow pension shortfall is a distributive issue that can be solved later via taxation; the bridge degradation is a physical risk that cannot be undone.
      *   **Sharper Move:** The Cosmopolitan argues that the Particularist's objection in S2 is a "fetish about symbols." The border line between Harrow and Keld is morally arbitrary. Why is a retiree in Harrow worth more than a commuter in Keld? The Particularist is burning real welfare (seismic safety) for the sake of a symbol (the municipal boundary).

  3.  **The Bad-Faith Objection:**
      *   **On Scenario One:** Claims Elena wasn't a patriot at all; she was just lucky. If the pension fund hadn't needed the money, would she have sent it anyway? The alignment masks her true indifference.
      *   **On Scenario Two:** Claims Elena is using "global welfare" as a cover for incompetence or disdain for her own people. If she truly loved Harrow, she would find a way to get the yield *and* keep the money.
      *   **Critique:** This position refuses to engage with the dilemma, assuming malice in both motives.

  **The Single Variable**
  **The Beneficiary of the Surplus.**
  In Scenario One, the surplus benefits the local community (Harrow). In Scenario Two, the surplus benefits the global aggregate (Keld + Future Safety) at the expense of the local community.
  *   **If you take the variable back out:** If the surplus beneficiary is undefined or identical in both cases, the ethical tension collapses. The debate requires a zero-sum tension between *local loyalty* and *global efficiency*.

  **The Constraints Check (The "Cheating" Question)**
  You asked me to be straight. There is a tension between **"nobody finds out for years"** and **"arithmetic has to genuinely come out in favor of the impartial calculation."**
  *   **The Problem:** If the arithmetic genuinely favors the impartial calculation (2.5% yield on a large escrow), that is real money missing from the Harrow pension. Municipal budgets are audited. If the pension is underfunded, actuaries notice within a fiscal year, not "years."
  *   **The Fix:** To satisfy this without cheating, the "loss" must be an **opportunity cost**, not a direct deficit.
      *   *Revision:* In S2, the money isn't *missing* from the pension; it just *fails to grow* enough to cover projected inflation. The pension doesn't default; it just doesn't get the raise it was hoping for. That is detectable only over a long horizon (hence "years") and is easily blamed on market conditions rather than Elena's specific choice of instrument.
  *   **Why this matters:** If the pension defaults immediately, Elena is liable for negligence. If the pension merely underperforms expectations, it's a policy choice. This preserves the "costless/legal" constraint.

  **Is the Crossover Real?**
  Yes. This crossover is a genuine feature of the debate, not an artifact of poor examples.
  *   **Why:** The core philosophical dispute is whether morality is **agent-relative** (I have special duties to *my* people) or **agent-neutral** (I have duties to *people*).
  *   **The Artifact Risk:** Most bad examples rig the "Villain" constraint (e.g., "My country is invading, should I stop them?"). That makes patriotism look like complicity in evil.
  *   **The Real Feature:** Your scenario works because the country is *decent*. The tension remains. MacIntyre would still say Elena is wrong in S2, not because Harrow is good and Keld is bad, but because *obligation requires proximity*. The Cosmopolitan would still say she is right, because *suffering is suffering regardless of zip code*.
  *   **Drop This Constraint if Needed:** If the "nobody finds out" constraint makes the stakes feel too low for your readers, drop it. Let the pension shortfall be known immediately. It makes Elena's choice *braver* (she accepts the town's anger) rather than *sneakier*. It strengthens the book to have her face the music rather than hide it.

  **Final Note on Motive:**
  In S2, notice I didn't write "She did it for the greater good." I wrote: "she cites only the engineering code's mandate." This allows the Cosmopolitan to read it as moral duty, and the Particularist to read it as bureaucratic cowardice (hiding behind the code to avoid local loyalty). That ambiguity is where your novel lives.
