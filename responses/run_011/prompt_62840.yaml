answer: |-
  Good evening. For those who don't know me, I clerked for Justice [Name] during the 2011 term. I was twenty-four years old, convinced I knew how the world worked, and she spent a year gently teaching me that I didn't.

  When you look at her record over twenty-two years, you see a number that jumps out. She voted to strike down a state statute exactly twice.

  For most of her career, people called her a restraint-obsessed conservative. She took that as a compliment. She believed that if reasonable people differ on a policy, the court's job is not to second-guess the legislature. She trusted the voters to fix bad laws by voting out the lawmakers who passed them.

  But those two times she did strike a law down, the legislature had done something specific. They hadn't just passed a bad policy; they had made it harder to vote the policy out. One was a district map. One was a petition process written to lock itself in.

  There is a way to understand this that makes it all one piece. She wasn't switching principles; she was policing the channels of political change instead of grading the legislature's answers. She believed the court exists to keep the machine running, not to drive the car.

  Now, I know who is in this room. I know the con law professors are thinking that deciding which channels are clogged is itself a value judgment. She knew that. She never claimed this was easy math. She claimed it was necessary work. Distinguishing between a law you disagree with and a law that disables disagreement requires wisdom, not just rules. She had the humility to defer most of the time, and the courage to intervene when the deference would have broken the system.

  I also know the question about the count. If that was the principle, why only twice? Why not go looking for more? Because restraint isn't passivity. It's patience. She didn't go hunting for constitutional violations. She waited for the clear cases, the ones where the door was genuinely locked, not just where she disliked what was happening inside the room.

  We are honored to have two state senators here tonight who were on the other side of those opinions. I know those rulings cost you. But look at the room. The ruling wasn't that you were wrong on the policy. It was that the system must remain open enough for someone to prove you wrong later. You are here, the system is here, and the integrity of the game matters more than any single score.

  To her grandchildren: Your grandmother believed that adults should be allowed to make their own mistakes. Her only rule was that you never get to change the rules so your little brothers can't fix them later.

  But the jurisprudence is just the architecture. The home she built inside it is what matters. She treated clerks like colleagues. She treated litigants like people. She treated power like something you borrow, not something you own.

  She is leaving the bench, but she is not leaving the work. She leaves us with a court that knows its lane, a state that keeps its channels open, and a family that knows exactly how much she loves them.

  Justice [Name], thank you for the service, thank you for the patience, and thank you for trusting us to finish the work. To [Name].

  ***

  **Vulnerability Analysis:**
  The senator at the bar will likely say: "You call it 'process,' but choosing which processes matter is itself a political choice. She didn't avoid substantive values; she just picked different ones than we did." They will argue that protecting the "channels" is just as subjective as protecting the "answers."
