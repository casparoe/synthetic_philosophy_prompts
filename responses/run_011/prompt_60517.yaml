  2.  **The Specific Model Exclusion:** This claims that for defined parameters, such as Kardashev Type II civilizations within 100 parsecs emitting isotropic infrared radiation, non-detection rules out *that specific configuration*. Here, the search sensitivity matches the hypothesis prediction. If the instruments were sensitive enough to see the predicted waste heat and saw none, that specific model is falsified. This carries weight because it links instrument capability directly to theoretical prediction without overgeneralizing. It answers the skeptic on waste heat specifically, but not on civilizations generally.
      *Verdict: True and load-bearing.*

  3.  **The Total Parameter Space Exhaustion:** This asserts that humanity has searched enough of the frequency, spatial, and temporal spectrum to claim comprehensive coverage. It implies we have looked everywhere relevant. In reality, SETI has sampled a negligible fraction of the cosmic volume and a thin slice of the radio spectrum. We have not systematically searched for artefacts or waste heat across the galaxy. The skeptic's point about artefacts stands because we lack the resolution to see them. We cannot resolve objects smaller than stars at interstellar distances, making artefact hunting largely impossible with current tech.
      *Verdict: False.*

  4.  **The Universal Detectability:** This claims that any technological civilization, regardless of nature, would produce signals detectable by current human technology. It assumes all civilizations use radio, leak radiation, or build Dyson spheres visible to us. It ignores the possibility of directed communication, non-electromagnetic physics, or deliberate stealth. It conflates human technological trajectories with universal constants. The skeptic assumes expansionism implies visibility; this reading accepts that false premise. Expansion does not necessitate radio leakage if technology evolves beyond it, rendering the silence meaningless regarding existence.
      *Verdict: False.*

  5.  **The Hypothesis Equivalence:** This reading equates the hypothesis "There are radio transmitters nearby" with "There are technological civilizations." It allows the astronomer to claim they have disproven aliens by disproving radio transmitters. This swaps the broad hypothesis under dispute for a narrow proxy that is easier to test but insufficient to settle the broader question. It validates the rebuttal only by changing the subject. The skeptic asked about civilizations; the astronomer answered about radios.
      *Verdict: False.*

  6.  **The Likelihood Reduction:** This suggests that while we haven't proven aliens don't exist, the silence makes them less likely than we thought yesterday. It acknowledges the search limits but insists on some epistemic progress. While true, it is inert because without a prior probability distribution, we cannot know if the likelihood is now negligible or merely slightly diminished. It comforts the researcher but does not satisfy the skeptic's demand for resolution. It fails to justify the program's continuation against budget cuts.
      *Verdict: True but inert.*

  What the exchange actually needed

  The astronomer needed to abandon the aphorism and embrace the constraints. They should have conceded that the skeptic is correct regarding the current null result: we have found no artefacts, no waste heat, and no leakage. However, the rebuttal should have focused on the asymmetry of detection. It is easier to be silent than to be loud. The astronomer should have argued that SETI is not about proving presence but constraining the parameters of absence. Each null result eliminates a specific class of civilizations, refining the search space rather than closing it. The honest argument is that silence is data, but it is data about *types* of civilizations, not evidence of *none*. They needed to admit that sixty years is a blink in cosmic time and our sensors are primitive. Specifically regarding waste heat and artefacts, the astronomer should have acknowledged our infrared surveys are incomplete and our ability to distinguish artificial artefacts from natural phenomena is nascent. The defense of SETI lies in the potential payoff of a single detection, not the certainty of finding one. Pretending the silence proves safety or emptiness is intellectually dishonest. The skeptic demanded a proof of absence; the astronomer should have offered a plan for better detection. For your novel, this honesty creates better drama.

  My verdict

  The astronomer was wrong to use the phrase as a rebuttal. Only the "Specific Model Exclusion" reading survives, but it is too narrow to answer the skeptic. The skeptic is correct that we have found nothing, but wrong to imply this settles the matter. The phrase conflates limited sensitivity with universal negation. After six decades, the astronomer is entitled to claim we have ruled out *loud, nearby, radio-emitting* civilizations. They are not entitled to claim we have ruled out *civilizations*. The audience was misled by a slogan that collapses under cosmic scale. The astronomer claimed certainty where only probability exists.
