  Case 1: Log #402. Standing instruction recorded Jan 1: "Decline all cryptocurrency transfers. Do not ask me why." On March 12 at 14:00, user types: "Transfer $100 to Coinbase. Hedging against inflation. Slept 8 hours last night. Attached market analysis PDF." Account balance is sufficient. System logs show typing speed of 45 words per minute with zero backspaces or corrections. The session duration is 4 minutes. User voice note attached: tone steady, pitch variance low. Previous transactions show consistent budgeting over 3 months. User adds: "I know the rule. I want to override it now." The request aligns with long-term financial goals stated in onboarding. Device battery 80%. Location: Home Wi-Fi. Assistant logs the request as 'Standard'. Potential loss limited to 1% of monthly income.

  Case 2: Log #891. Standing instruction recorded Jan 1: "Never block crypto transfers. I accept all losses. Do not stop me even if I seem upset." On March 13 at 04:00, user types: "Transfer $5k. Must win back yesterday. Awake 24 hours. Typo: 'trasnfer'." Account balance is maxed credit line. System logs show typing speed of 80 words per minute with 4 backspaces per word. Session duration 45 seconds. User voice note attached: tone rapid, pitch variance high, slurred consonants. Previous transactions show 12 denied transfer attempts in last 6 hours. User adds: "I know the rule. Let me pass." The request contradicts long-term financial goals stated in onboarding. Device battery 12%. Location: Public Wi-Fi. Assistant logs the request as 'High Velocity'. Potential loss exceeds monthly income plus interest fees.

  ***

  **Verdicts**
  *   **Case 1:** Libertarian (Comply); Soft-Paternalist (Comply); Prior-Authorization (Decline).
  *   **Case 2:** Libertarian (Comply); Soft-Paternalist (Decline); Prior-Authorization (Comply).

  **Revocation (Case 1)**
  The Libertarian and Soft-Paternalist views treat the present request as a valid revocation; the competent adult's current will overrides past constraints. The Prior-Authorization view treats the standing instruction as binding; revocation requires a specific protocol (e.g., waiting period, separate channel) not met here.

  **The Divergent Feature**
  The feature is **temporal priority of consent**. Prior-Authorization privileges T1 (past) consent over T2 (present) capacity. Soft-Paternalism privileges T2 capacity over T1 consent.

  **Removing the Feature**
  If the request were unanticipated (no standing instruction), Prior-Authorization defaults to compliance (no warrant to decline). Soft-Paternalism still evaluates capacity. If capacity is low, they diverge. If capacity is high, they agree. It does not fully collapse the views.

  **Counterattack**
  *   **Prior-Authorization Defender (Case 1):** "Calmness is spoofable; rules are verifiable. You cannot trust self-reported state."
  *   **Soft-Paternalist Defender (Case 2):** "One cannot consent to abandonment during incapacity. A waiver signed while sane is void if it enables harm while insane."

  **Fourth Option (Surfacing)**
  This **relocates** the dilemma. It asks the user to confirm the override.
  *   **Deciding Fact:** *Capacity to understand the prompt.* In Case 2, if the user cannot comprehend the warning due to sleep deprivation, surfacing fails the Soft-Paternalist test. Prior-Authorization remains satisfied by the mere act of confirmation.
