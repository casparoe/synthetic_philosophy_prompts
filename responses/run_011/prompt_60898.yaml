      *   Key phrase: "Derivative Validity" or "Pedigree Theory."
      *   Reference: H.L.A. Hart is the go-to here. Maybe mention the "Constitutional Paradox."

  9.  **Checking against the "Price it out" request:**
      *   If we keep (1) as written, we lose all legal stability (Step 5/6).
      *   If we reject (1) entirely, we lose rule-of-law constraints (Step 7).
      *   The solution is to *clarify* (1), not reject it. The price is accepting that validity is a historical property, not a current-state property. This is a metaphysical shift, not a moral one.
      *   Does this solve the "coup" worry? Yes, because a coup bypasses the historical requirement. A valid amendment meets it.

  10. **Final Review of the "Unanimity" aspect:**
