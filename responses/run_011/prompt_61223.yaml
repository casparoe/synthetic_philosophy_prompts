answer: |-
  Yes, on my account that belief is knowledge, provided the model is actually identifying patients who need help and the help is actually working. You are worried that the reliability is manufactured, but if the manufacturing process consistently produces true results, then it is reliable. The difference between this and the rumor is that the rumor creates a fact out of thin air solely because people believe it, like a bank run creating insolvency where there was none. The hospital model is different because it tracks underlying physiological risks that exist independently of the prediction, even if the outcome changes. The model says this patient is fragile, the staff treats them, and they survive. The belief that the model works is formed by observing this successful chain of events. As long as that chain is genuinely connected to the reality of patient health, the hospital knows the model works, even if they didn't verify the model's internals before trusting it.

  Where you have set the case up wrong is by treating the model like a gauge measuring a static tank, when it is actually a thermostat regulating a temperature. A gauge just reads what is already there, so checking the gauge against the tank seems like cheating if you use the gauge to verify the gauge. But a thermostat changes the world to match its reading, and its success is measured by whether the room stays warm, not whether it predicted the cold correctly. You are looking for a circular argument where the model proves itself, but I am describing a causal loop where the model interacts with the world to produce a better outcome. Nature loves a loop without losing its grip on truth, and my view is simply that if the loop holds, the knowledge is real. You don't need to step outside the system to validate it any more than you need to step outside your own skin to verify you have a body.
