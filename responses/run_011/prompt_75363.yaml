prompt: |-
  I'm trying to pick a formal model of belief to hang a theory of culpable ignorance on — basically the "knew or should have known" standard, where I want to say when someone's failure to draw a consequence of what she believes is blameworthy and when the consequence simply wasn't there to be drawn. Before I sink another week into impossible-worlds machinery I want the spec. So: write out the desiderata — what any model of belief has to deliver to be good enough for *that* job. For each one, give the case or consideration behind it and tag it non-negotiable or camp-preference.

  The kind of case I care about: a GP who has separately noted that her patient is on drug A, and that drug B interacts badly with A, and never puts the two together when she writes the script — versus a GP who'd need four steps of unfamiliar pharmacology to see the same problem. I want the first to be culpable and the second not, and I want a model of belief that can underwrite that difference instead of me just asserting it.

  Things I already suspect belong on the list, overrule me where I'm wrong: it can't make believers logically omniscient (if it does, everyone is automatically culpable for every theorem of arithmetic and the whole distinction collapses); it can't make them so fragmented that nothing ever counts as available to be drawn (then nobody is ever culpable); it has to mark the difference between what someone explicitly assents to and what's one cheap obvious step from that; it needs to let me state counterfactuals about what she would have believed had she paused and thought, without smuggling in an actual reasoning process she never went through; and belief shouldn't be transparent to the believer, since I want negligence and self-deception to be possible states.

  Also flag any pair or triple you think can't be jointly met. My hunch is that closure-under-obvious-consequence plus resource-sensitivity plus a semantics that isn't trivially satisfiable is where the squeeze is, but I could easily be wrong, and if the list turns out to be a no-go result in disguise that's the single most useful thing you could tell me. And say which one requirement does the most to rule candidates out.

  Then briefly — a paragraph, not a scorecard — how the standard moves do against the list: impossible worlds, awareness operators, a degrees-of-belief treatment, and fragmentation.

  Format, in this order: **The job** (one short paragraph restating what the model has to be good for, so we're aiming at the same target, ~100 words); **The desiderata** (numbered, each with a label, the case behind it, and the negotiable/non-negotiable tag — this is the bulk, ~700 words); **What can't all be had** (~200 words); **The contenders, briefly** (~200 words); **Confidence** (~100 words). In that last one, tell me how confident you are in the list overall and single out the requirement you're least sure belongs there at all. American English please.
