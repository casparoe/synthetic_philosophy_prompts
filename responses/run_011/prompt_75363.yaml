  **The job**
  The model must formalize the epistemic state of an agent to ground moral or legal culpability for ignorance. It needs to distinguish between blameless ignorance, where the truth was inaccessible, and culpable negligence, where the truth was accessible but unaccessed. Specifically, it must evaluate the GP case: blaming the doctor who fails to connect two explicit beliefs while exonerating the one requiring complex derivation. The model serves as the truth-maker for claims like "she should have known," avoiding the collapse of culpability into either universal guilt via omniscience or universal innocence via fragmentation. It must support counterfactual assessment without demanding actual reasoning occurred.

  **The desiderata**

  1.  **Bounded Closure.** Believers cannot be closed under all logical consequence, or else missing arithmetic theorems becomes culpable. However, they must be closed under *some* consequence, or else connecting "A" and "A→B" is never blameworthy. You need a model that blocks closure under entailment generally but permits it locally. *Case:* Distinguishing between failing to know a complex theorem versus failing to know $P$ when you explicitly believe $P \land Q$. *Tag:* Non-negotiable.

  2.  **Inference Gradient.** It is not enough to say some inferences are allowed and others aren't; the model must measure cognitive cost. Culpability tracks the "distance" between held beliefs and the missed consequence. *Case:* The GP who misses an interaction between two known drugs (short distance) is culpable; the GP who misses an interaction requiring four steps of unfamiliar pharmacology (long distance) is not. *Tag:* Non-negotiable.

  3.  **Counterfactual Availability.** Negligence is often defined by what the agent *would* have known had they exercised due care. The model must represent dispositions to believe without requiring actual reasoning events. *Case:* A driver who doesn't see a pedestrian but would have if not texting. We need to model the "would have believed" state without asserting the reasoning actually occurred. *Tag:* Non-negotiable.

  4.  **Introspective Opacity.** Agents must not have perfect access to their own belief sets. If belief were transparent, negligence would be impossible because the agent would know they were missing something. *Case:* Self-deception or habitual negligence where the agent sincerely claims they didn't know, yet the model attributes the belief dispositionally. *Tag:* Non-negotiable.

  5.  **Aggregation Capacity.** Fragmented belief states cannot be used as a universal shield against culpability. The model must allow separate belief states to be normatively combined when standard procedure demands it. *Case:* The GP cannot claim "I knew the drug risk in file A and the patient history in file B" if merging files is standard professional practice. *Tag:* Non-negotiable.

  6.  **Contextual Stability.** Belief attributions should not fluctuate wildly based on arbitrary modeling choices regarding how propositions are individuated. *Case:* A theory shouldn't make culpability depend on whether we model "drug interaction" as one proposition or two. *Tag:* Camp-preference.

  **What can't all be had**
  Your hunch is correct: the trilemma lies between **Bounded Closure**, **Inference Gradient**, and **Contextual Stability**. Defining "obvious consequence" formally without reintroducing omniscience is the bottleneck. If you define "one step" syntactically, you face the sorites problem regarding when a chain of obvious steps becomes non-obvious. If you define it semantically via impossible worlds, you lose the gradient structure needed to distinguish the two GPs without arbitrary weighting. You can have a model that blocks omniscience, or one that measures cognitive cost, but doing both without arbitrary parameters is an open technical problem. **Inference Gradient** is the requirement that does the most work ruling out candidates, as most hyperintensional logics treat all non-theorems as equally distant.

  **The contenders, briefly**
  **Impossible Worlds** handle non-omniscience well but struggle with the Inference Gradient; all non-theorems look equally distant unless structured heavily with similarity metrics. **Awareness Operators** capture opacity and boundedness but are static; they struggle with Counterfactual Availability because they lack a mechanism to model what becomes aware-able under prompting. **Degrees-of-Belief** offer a natural gradient but clash with binary legal standards; converting probability thresholds to culpability is normatively messy and computationally heavy. **Fragmentation** models fit the GP case perfectly but threaten Aggregation Capacity; without a merging rule, everyone escapes blame by claiming compartmentalization. None clear the list cleanly.

  **Confidence**
  I am highly confident in this list as a diagnostic tool for your specific project. The tension between avoiding omniscience and preserving enough closure for culpability is the central problem in epistemic logic for ethics. The requirement I am least sure belongs here is **Contextual Stability**. While desirable, one might argue culpability *is* sensitive to modeling granularity (e.g., expert vs. novice frames). However, without it, the theory becomes vulnerable to gerrymandering the model to fit the verdict. The list is robust, but expect technical friction on the Gradient.
