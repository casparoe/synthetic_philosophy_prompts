      Good morning. Look around this room. We are decision theorists, AI researchers, family, and friends. We disagree on many things. But to begin, I ask you to agree to three small claims.

      First: You agree that [Supervisor] spent thirty-four years teaching us to avoid being exploited. To ensure our choices do not turn against us.

      Second: You agree that for twenty-nine years, every Tuesday, she placed a sealed envelope on the common-room table. Sometimes it held a coin. Sometimes something stranger. We wrote two numbers on a card. The most we would pay to buy it. The least we would take to sell it. She kept every card.

      Third: You agree that if my buying price is lower than my selling price, I cannot be forced into a loss. If I buy at forty cents and sell at three dollars, no sequence of bets guarantees I lose money. The book cannot be closed.

      [PAUSE]

