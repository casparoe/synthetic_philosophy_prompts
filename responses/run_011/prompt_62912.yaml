      [PAUSE]

      To the AI researchers: Do not assume the theorems force a specific mind. To the family: She loved the question more than the answer. To the grandchildren: If someone asks you why, do not be afraid to write your own numbers.

      She taught us that coherence is not about being right. It is about not being exploitable. And sometimes, the only way to stay safe is to leave the envelope sealed. To keep the spread. To keep the question open.

      Thank you.

