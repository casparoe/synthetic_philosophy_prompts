answer: |-
  Here is the principle. It is not a menu. It is a single standard derived from the logic of your own distinctions, tightened to remove the contradictions.

  ### The Principle: Fiduciary Consistency

  **Public office is a fiduciary trust. Corruption occurs when an officeholder allows a *private interest* to determine the exercise of *public discretion*, unless that interest is a recognized mechanism of political accountability.**

  To apply this, you must distinguish three categories:
  1.  **Public Discretion:** The power granted to the office to allocate resources, justice, or access based on the institution's mandated purpose (e.g., a judge rules on law, a nurse allocates by medical need, a mayor hires for competence).
  2.  **Private Interest:** Any obligation arising from kinship, friendship, direct financial gain, or personal social capital.
  3.  **Political Accountability:** Interests arising from the maintenance of the governing coalition (e.g., votes, party support, legislative trade-offs). In a political system, these are treated as *public* interests because they sustain the authority of the office itself.

  **The Test:** An act is corrupt if a **Private Interest** displaces a **Public Standard** in the exercise of **Public Discretion**. It is *not* corrupt if a **Political Accountability** interest displaces a **Public Standard**, provided the displacement is transparent and systemic (e.g., patronage, logrolling).

  ***

  ### Application to Your New Cases

  **1. The Judge and the Law School**
  **Verdict: Corrupt.**
  Even if the post is unpaid, the *prestige* and the *future employment pipeline* constitute a Private Interest (professional advancement/social capital). By accepting a benefit bankrolled by a litigant, the judge allows a private obligation (gratitude, future prospect) to sit alongside her public discretion. It creates a conflict of interest that undermines the institutional purpose of the court (impartiality). The lack of a direct cash transfer is irrelevant; the alienation of impartiality is the corruption.

  **2. The NGO and the Village Chief**
  **Verdict: Corrupt.**
  The Chief's fiduciary duty is to the village, not the project. A "coordination stipend" paid directly from the project budget converts the Chief from a public representative into a subcontractor. His discretion is now partially owned by the NGO. If the project needs to bypass village consensus to meet a deadline, the Chief is financially incentivized to side with the NGO against his constituents. This displaces his public duty with a private financial interest.

  **3. The Regulator and the Football Match**
  **Verdict: Corrupt.**
  Logging the gift in a register addresses *secrecy*, not *obligation*. Corruption is not just hiding the deal; it is the creation of the social debt. Hospitality builds personal rapport (Private Interest). When a regulator accepts hospitality from a regulatee, they are accepting a social obligation that competes with their duty of strict enforcement (Public Standard). Transparency mitigates the *concealment*, but it does not cure the *conflict*. The principle condemns the act of building the private relationship, regardless of the logbook.

  ***

  ### The Verdict You Must Give Up

  **The Case:** Big campaign donors getting ambassadorships.
  **Your Verdict:** "Not corruption, it's just how the place runs."
  **My Ruling:** **This is Corruption.**

  **The Argument:**
  You accepted this because you conflated *normalization* with *legitimacy*. Your principle for the Congressman's logrolling ("fine, that's literally the job") relies on the idea that vote-trading serves a legislative function (building coalitions to pass laws). That is a **Political Accountability** interest.

  Ambassadorships, however, are not legislative seats. Their institutional purpose is diplomatic representation and competence. When a donor buys an embassy post, that is not a mechanism of political accountability (like an election); it is a **Private Interest** (reward for cash) displacing a **Public Standard** (merit/competence).

  The fact that "it's just how the place runs" is the definition of *institutional corruption*. It means the system has normalized the violation of its own purpose. If you accept the Fiduciary Consistency principle, you cannot exempt systemic violations. If you exempt them, you have no principle, only a description of the status quo. You must condemn the donor-ambassador to remain consistent with your condemnation of the mayor's brother. Both are private appointments to public trusts. The only difference is scale and legal cover.

  ***

  ### The Hip Replacement Pair: The Resolution

  **Case 1 (Queue Jump):** **Corrupt.**
  **Case 2 (Fake Queue/Private Coverage):** **Corrupt.**

  **Why:**
  You flipped on the second case because you focused on the *outcome* (the father gets the surgery either way) rather than the *office*.
  The nurse's fiduciary duty is to the **queue**, not just the **surgery**. The queue *is* the public standard for allocation.
  In Case 2, the fact that the four people ahead have private coverage means the *system* is failing, but it does not change the *nurse's* duty. If the nurse takes your money, she is still formally violating the public allocation rule. She is monetizing her discretion.
  If you rule Case 2 as "Fine," you are arguing that *de facto* inequality licenses *de jure* corruption. You are saying that because the rich can opt out, the official is free to sell the public lane to the highest bidder. The principle forbids this. The officeholder must uphold the public standard even if others circumvent it. To do otherwise is to join the predation rather than manage the scarcity.

  ***

  ### The Universality Question

  **Does this principle condemn practices that people inside them accept?**
  **Yes.** Specifically, the Village Goat (Land Dispute) and the Donor Ambassador.

  **Why that is the correct result:**
  You are worried that a universal principle is just "Western export" imperialism. This fear assumes that "corruption" is a cultural label. It is not. It is a **functional** label.

  Everywhere, a "judge" (or village elder settling disputes) has a specific function: impartial arbitration. Everywhere, a "doctor" has a function: triage by need.
  If a culture accepts that a judge should favor his kin, that culture is not "different"; it is **dysfunctional regarding that specific office**. It is conflating the *role* of "kin" with the *role* of "judge."

  The Fiduciary Consistency principle does not judge the *people*; it judges the *alignment of the role*.
  *   If the Village Elder is acting as a **Kin Leader**, taking the goat is fine (social cohesion).
  *   If the Village Elder is acting as a **Dispute Resolver**, taking the goat is corrupt (impartiality violated).

  The confusion arises when the roles are merged. The principle demands we separate them. It condemns the practice not because it is "Western," but because it breaks the internal logic of the office being performed. If the villagers say, "We don't believe in impartiality, we believe in loyalty," then they do not have a public judiciary; they have a clan mediation system. You cannot have a public office without public standards.

  If you refuse to condemn the accepted practice, you are not respecting culture; you are accepting that the powerful within that culture are allowed to prey on the weak without the shield of an impartial rule. Universality is the only protection the weak have against the strong claiming their predation is "tradition."
