prompt: |-
  I've been asked to write the framing chapter for a handbook section on how public investment agencies should set stop rules — the thresholds at which a partially funded project gets terminated rather than refinanced — and before I wade into the literatures that all claim this terrain (organizational behavior, auction theory, behavioral economics, evolutionary biology), I want the specification rather than the candidates. So: what would a theory of escalation of commitment have to do to count as adequate, where adequate means good enough that an institution could rely on it when deciding whether to cap losses by rule, move decision rights to a fresh party, require an up-front precommitment, or simply trust experienced managers to keep going? Give me the requirements one at a time, each with the case or consideration that motivates it: the phenomena it must explain, the situations it must get right, the distinctions it may not collapse, and the results — experimental, strategic, and comparative — that it cannot contradict.

  So you can see where I'm coming from, here are the things I'd expect the list to be built around, and I want you to tell me which of them are genuine requirements and which are the prejudices of one camp wearing a requirement's clothes:

  - The asymmetry between entry and continuation in Shubik's dollar auction. Entering at the minimum bid looks like a bargain; every later raise looks locally right to the trailing bidder, who converts a certain loss into a chance to come out ahead; and the sequence is jointly ruinous. A theory must say where the error is located — in the entry decision, in the continuation rule, or in the assumption that both must be assessed by the same standard at all.
  - Stationarity. In the standard mixed-strategy analysis the probability that the trailing bidder keeps going does not depend on how deep the bidding already is, precisely because past bids are sunk. The ordinary description of escalation is the opposite: it accelerates. Either the theory explains the acceleration, or it explains the intuition as an artifact of how cases get selected for retelling — and I want to know which.
  - Asymmetry of position. The trailer, not the leader, is the one with the structural motive to continue, since folding forfeits the bid while leading allows a graceful exit. An account that predicts symmetric escalation has to say what it is capturing that the payoff structure misses.
  - Finite bankrolls. With a hard ceiling on what either side can lose, the trap looks as though it should unravel by backward induction; the online bidding-fee ("penny") auctions that had exactly such ceilings, plus automated bidding agents, still ran episodes in which the fees paid for an item exceeded its retail value. What work does a cap do, and what does it leave untouched?
  - The psychological regularities. Continuation rises with the size of the sunk investment, with personal responsibility for the initial decision, and with public accountability for it; it falls when the continuation decision is handed to someone who did not make the original choice; and it does not reliably fall when people are warned about the trap in advance or when they are experienced and paid for accuracy.
  - The comparative datum that non-human animals show the same pattern, which some read as evidence that it is adaptive rather than an error — and the question of whether a theory of human escalation owes an account of that or may treat it as beside the point.
  - The near neighbors it must separate rather than absorb: perseverance that is a correct response to genuinely new information; paying to keep an option alive when present expected value is negative but the option is not; overbidding as an investment in a reputation for never folding in a repeated game; contractual or treaty lock-in; and, hardest of all, holding to a plan one adopted earlier in the resolute-choice sense, where the observable behavior is indistinguishable from escalation but where we want to call it integrity. I suspect this last one is where the real work is, because it exposes a criterion problem: if escalation is defined as persistence that turned out badly, the theory is unfalsifiable, and if it is defined ex ante, we need to be told in terms of what.
  - The reference-point worry. Any account built on loss aversion or anticipated regret must be able to say what fixes the reference point independently of the behavior it is meant to explain, or it can absorb every outcome after the fact.

  Format, and the part I most want: for each requirement, a sentence or two of motivating case, then a mark — non-negotiable, meaning that a theory failing it is not a theory of this phenomenon; negotiable but costly, meaning it can be given up at a price you should state; or camp-specific, meaning one literature demands it and another reasonably refuses, in which case say which camp and why the demand is a prejudice. Then, if some subset of the requirements cannot be jointly satisfied, say so explicitly and show the conflict. My own guess is that Bayesian updating on the information actually available to the decision maker, consequentialist preferences over final outcomes (no utility from consistency, self-justification, or completion as such), and the observed sensitivity of continuation to sunk-cost magnitude, responsibility, and accountability with objective prospects held fixed cannot all stand together — and I would like to be told which of the three a good theory gives up and what it costs. Name the single requirement that eliminates the largest number of otherwise respectable candidates. Close with a short scorecard, a few lines each, for the three families I expect to be reading: escalation as equilibrium strategic behavior, escalation as a preference or framing distortion, and escalation as an institutional and agency phenomenon turning on who decides, who is blamed, and who pays. No references and no reading list, please — I want the specification, not the bibliography — and where a requirement rests on an empirical claim you are not confident about, flag the uncertainty rather than smoothing it over.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Task:** Write a framing chapter specification for a handbook section on "stop rules" for public investment agencies (escalation of commitment).
      *   **Goal:** Define the *requirements* for an adequate theory of escalation of commitment, distinguishing genuine requirements from camp-specific prejudices.
      *   **Input:** The user provides a list of 8 specific considerations/phenomena (Dollar Auction asymmetry, Stationarity vs. Acceleration, Asymmetry of Position, Finite Bankrolls, Psychological Regularities, Non-human Animals, Near Neighbors/Criterion Problem, Reference-Point Worry).
      *   **Format:** For each requirement: Motivating case (1-2 sentences) + Classification (Non-negotiable, Negotiable but costly, Camp-specific).
      *   **Conflict Analysis:** Identify if any requirements are mutually exclusive (specifically addressing the user's guess about Bayesian updating vs. Consequentialism vs. Sunk Cost Sensitivity).
      *   **Eliminator:** Name the single requirement that eliminates the most candidates.
      *   **Scorecard:** Brief evaluation of three families of theory (Strategic/Equilibrium, Preference/Framing, Institutional/Agency).
      *   **Constraints:** No references, no reading list. Flag empirical uncertainty.
      *   **Tone:** Analytical, rigorous, institutional focus (public investment agencies), philosophical precision.

  2.  **Deconstruct the User's Input List:**
      *   *Item 1: Dollar Auction Asymmetry.* Entry vs. Continuation. Is the error in entry, continuation, or the standard?
      *   *Item 2: Stationarity.* Rational models say sunk costs don't matter (stationary prob of continuation). Empirical reality says escalation accelerates.
      *   *Item 3: Asymmetry of Position.* Trailer escalates, Leader exits. Structural motive vs. payoff structure.
      *   *Item 4: Finite Bankrolls.* Backward induction should stop it. Penny auctions show it doesn't. What work does the cap do?
      *   *Item 5: Psychological Regularities.* Sunk cost, responsibility, accountability increase continuation. Warnings/experience don't help. New decision-makers help.
      *   *Item 6: Non-human Animals.* Is it adaptive? Does human theory need to account for this?
      *   *Item 7: Near Neighbors/Criterion Problem.* Distinguishing escalation from perseverance, option value, reputation, lock-in, and *resolute choice* (integrity). Ex-post vs. Ex-ante definition.
      *   *Item 8: Reference-Point Worry.* Loss aversion needs fixed reference points to avoid being unfalsifiable.

  3.  **Evaluate Each Item against the "Adequacy" Standard:**
      *   *Standard:* Can a public investment agency rely on this to set stop rules?
      *   *Item 1 (Entry/Continuation):* Crucial. If you don't know where the error lies, you can't fix it (ban entry vs. force exit). -> *Non-negotiable.*
      *   *Item 2 (Stationarity):* Crucial for timing rules. If escalation accelerates, stop rules need to tighten over time. If stationary, constant rules work. -> *Non-negotiable.*
      *   *Item 3 (Position Asymmetry):* Important for governance (who holds the pen?). -> *Negotiable but costly.* Some models treat players as symmetric; if they fail here, they miss the political dynamic of public projects.
      *   *Item 4 (Bankrolls):* Important for risk management. If backward induction fails, hard caps aren't enough. -> *Non-negotiable.*
      *   *Item 5 (Psych Regularities):* Crucial for personnel policy (rotation vs. training). -> *Non-negotiable.*
      *   *Item 6 (Animals):* *Camp-specific.* Evolutionary bio cares; institutional econ less so. Unless it implies adaptiveness in humans, it's secondary.
      *   *Item 7 (Near Neighbors/Integrity):* *Non-negotiable.* This is the definition problem. If you can't distinguish bad persistence from good integrity, you can't write a rule.
      *   *Item 8 (Reference Points):* *Non-negotiable.* Without this, the theory is post-hoc storytelling.

  4.  **Address the Conflict (The User's Guess):**
      *   *The Trilemma:* Bayesian Updating + Consequentialist Preferences + Sunk Cost Sensitivity.
      *   *Analysis:* You cannot have all three.
          *   If Bayesian + Consequentialist -> Sunk costs *must* be ignored (Violation of Sensitivity).
          *   If Bayesian + Sensitivity -> Preferences must be non-consequentialist (utility from consistency/regret).
          *   If Consequentialist + Sensitivity -> Updating must be non-Besian (belief distortion).
      *   *Resolution:* For an *institutional* theory (public agencies), giving up Consequentialism is often the path (agency costs, career concerns). Giving up Bayesian Updating is the behavioral path. Giving up Sensitivity is the rationalist path (denies the phenomenon).
      *   *The "Eliminator":* The Criterion Problem (Item 7). If you can't define escalation ex-ante, you can't regulate it.

  5.  **Drafting the Content - Section by Section:**

      *   *Introduction:* Acknowledge the task. Set the stage (institutional reliability).
      *   *The Requirements:* Go through the 8 items. Assign status. Justify.
      *   *The Conflict:* Explicitly address the Trilemma.
      *   *The Eliminator:* Identify the Criterion Problem.
      *   *The Scorecard:* Evaluate the three families (Strategic, Behavioral, Institutional).

  6.  **Refining the Classifications (Self-Correction/Nuance):**
      *   *Item 6 (Animals):* I'll mark this as *Camp-specific*. Evolutionary biology demands it; standard econ rejects it as irrelevant to institutional design.
      *   *Item 3 (Position):* I'll mark this *Negotiable but costly*. A theory can exist without it, but it won't help a public agency manage political pressure.
      *   *Item 7 (Near Neighbors):* This is the hardest. It must be *Non-negotiable* because without it, the policy prescription is blind.
      *   *Item 2 (Stationarity):* *Non-negotiable.* If the theory predicts constant hazard rates but reality shows increasing hazard rates, the stop rules will be mistimed.

  7.  **Addressing the Trilemma:**
      *   The user asks which of the three (Bayesian, Consequentialist, Sensitivity) a good theory gives up.
      *   *Answer:* A theory adequate for *institutional design* must give up **Consequentialist Preferences over Final Outcomes**. Why? Because institutions care about process, accountability, and career incentives, which introduce utility from *actions* (consistency, reputation) independent of final monetary payoff. Pure consequentialism cannot explain why rotation works (Item 5).
      *   *Cost:* It makes the theory harder to aggregate into a social welfare function.

  8.  **Drafting the Scorecard:**
      *   *Strategic/Equilibrium:* Good on asymmetry/bankrolls, bad on psychological regularities (unless you add complex reputation types).
      *   *Preference/Framing:* Good on psych regularities, bad on the Criterion Problem (hard to distinguish from error), bad on stationarity (often ad-hoc).
      *   *Institutional/Agency:* Best fit for the user's goal. Handles responsibility/rotation. Struggles with the "integrity" distinction unless governance is very specific.

  9.  **Review against Constraints:**
      *   No references? Check.
      *   Format followed? Check.
      *   Flag uncertainty? Need to ensure I note where empirical claims (like acceleration) are debated.
      *   Tone? Professional, analytical.

  10. **Final Polish:** Ensure the distinction between "Non-negotiable" (theory fails without it) and "Camp-specific" (one school ignores it) is sharp. Ensure the "Eliminator" is clearly justified. (Self-correction: The Criterion Problem is the deepest philosophical hurdle, but the Trilemma is the hardest technical hurdle. I will stick with the Criterion Problem as the Eliminator because it renders the concept undefined, whereas the Trilemma just forces a modeling choice.)

      *Wait, reconsidering the Eliminator.* If a theory satisfies the Criterion Problem but fails the Trilemma (e.g., it's behavioral), it's still a theory. If it satisfies the Trilemma but fails the Criterion Problem (e.g., it defines escalation as "losing money"), it's tautological. The Criterion Problem is the stronger eliminator.

      *Reconsidering the Trilemma Resolution.* For *public investment*, the "Consequentialist" assumption is often the one dropped in favor of Agency Theory (managers maximize utility, not project NPV). I will argue that.

      *Let's write.*
answer: |-
  ### Specification for a Theory of Escalation of Commitment

  To serve as a foundation for institutional stop rules, a theory of escalation must do more than fit a curve to past failures; it must identify the lever that prevents them. The following requirements distinguish phenomena a theory must capture from artifacts of specific modeling traditions.

  #### 1. The Entry-Continuation Asymmetry
  **Motivation:** In the dollar auction, entering at the minimum bid appears rational ex ante, while every subsequent raise appears rational ex post to the trailing bidder, yet the sequence is ruinous. A theory must locate the error: is it in the entry condition, the continuation rule, or the assumption that a single rationality standard applies to both?
  **Status:** **Non-negotiable.**
  **Reasoning:** If the error is in entry, the policy solution is stricter gatekeeping. If the error is in continuation, the solution is intervention mid-stream. A theory that treats them identically cannot recommend whether to tighten initial approval or empower termination committees.

  #### 2. The Stationarity Violation
  **Motivation:** Standard rational models imply the probability of continuation should be stationary (independent of sunk depth) because past costs are unrecoverable. Empirical accounts suggest escalation accelerates as investment deepens. The theory must explain this acceleration or prove it is a selection bias in case reporting.
  **Status:** **Non-negotiable.**
  **Reasoning:** Stop rules depend on timing. If hazard rates are constant, a fixed review interval suffices. If hazard rates increase with sunk cost, review intervals must tighten over time. A theory predicting stationarity will prescribe rules that fail precisely when exposure is highest. *Uncertainty Flag: There is debate over whether acceleration is a robust empirical fact or an artifact of studying only catastrophic failures.*

  #### 3. Positional Asymmetry
  **Motivation:** In bidding traps, the trailing bidder has a structural motive to escalate (to avoid realizing a loss) that the leader does not. A theory predicting symmetric behavior misses the political dynamic where project champions fight harder than skeptics.
  **Status:** **Negotiable but costly.**
  **Reasoning:** A symmetric model can still predict aggregate waste. However, giving this up makes the theory useless for designing governance structures that exploit asymmetry (e.g., separating project advocacy from budget approval). The cost of ignoring this is the inability to assign decision rights optimally.

  #### 4. The Finite Bankroll Paradox
  **Motivation:** With hard loss limits, backward induction should prevent entry or force early exit. Yet, penny auctions with automated agents and hard caps still generate fees exceeding item value. The theory must explain what work the cap fails to do.
  **Status:** **Non-negotiable.**
  **Reasoning:** Public agencies operate under statutory budget caps. If a theory suggests caps solve the problem, but reality shows they do not, the theory is dangerous. It must explain why hard constraints fail to bind behavior (e.g., via re-categorization of costs or fee structures).

  #### 5. Psychological and Personnel Regularities
  **Motivation:** Continuation rises with personal responsibility and public accountability; it falls when decision rights are transferred to a new party; it does not reliably fall with warnings or experience.
  **Status:** **Non-negotiable.**
  **Reasoning:** This is the primary lever for institutional design. If experience doesn't cure escalation, training budgets are wasted. If rotation cures it, tenure limits are the solution. A theory that cannot accommodate the "fresh party" effect cannot justify the administrative cost of rotating management.

  #### 6. The Comparative Datum (Non-human Animals)
  **Motivation:** Some species show persistence patterns resembling escalation, suggesting an adaptive evolutionary root rather than a cognitive error.
  **Status:** **Camp-specific.**
  **Reasoning:** **Evolutionary Biology** demands this; **Institutional Economics** may reasonably refuse it. For a public agency, whether the behavior is adaptive in the Pleistocene is irrelevant to whether it is maladaptive in a budget cycle. Insisting on this requirement excludes rationalist and agency models that do not need evolutionary grounding to be operationally valid.

  #### 7. The Criterion Problem (Near Neighbors)
  **Motivation:** The theory must distinguish escalation from: (a) rational perseverance on new information, (b) paying for option value, (c) reputation building, and (d) resolute choice (integrity to a prior plan). If escalation is defined ex-post as "persistence that failed," the theory is unfalsifiable.
  **Status:** **Non-negotiable.**
  **Reasoning:** This is the definition constraint. If you cannot distinguish integrity from stubbornness ex-ante, you cannot write a rule that punishes the latter without discouraging the former. A theory that collapses these distinctions offers no actionable guidance on when to stop.

  #### 8. The Reference-Point Constraint
  **Motivation:** Accounts relying on loss aversion or regret must specify what fixes the reference point independently of the observed behavior.
  **Status:** **Non-negotiable.**
  **Reasoning:** Without an independent anchor for the reference point, any behavior can be retrofitted as "loss avoidance." For a rule to be enforceable, the reference point (e.g., original budget, last audit) must be observable and contractible before the decision is made.

  ***

  ### The Trilemma and the Necessary Sacrifice

  You hypothesized that **Bayesian updating**, **Consequentialist preferences**, and **Sensitivity to sunk costs** cannot jointly stand. You are correct. A theory adequate for institutional design must abandon **Consequentialist Preferences over Final Outcomes**.

  **The Conflict:**
  1.  **Bayesian Updating:** Agents update beliefs correctly based on new information.
  2.  **Consequentialism:** Utility depends only on final states (wealth, project success), not the path taken.
  3.  **Sunk Cost Sensitivity:** Agents continue projects because of past investment, holding prospects fixed.

  If agents are Bayesian and Consequentialist, sunk costs *cannot* matter (Violation of 3). If agents are Bayesian and Sunk-Sensitive, they must derive utility from the *act* of continuing or the *consistency* of their history (Violation of 2). If agents are Consequentialist and Sunk-Sensitive, they must be distorting their beliefs about success probability to justify the past (Violation of 1).

  **The Sacrifice:**
  For a public investment agency, you must give up **Consequentialism**.
  **Why:** Public managers are not maximizing project NPV in a vacuum; they are maximizing career utility, political capital, and avoidance of blame. These are non-consequentialist utilities derived from the *process* (e.g., "I did not waste the initial appropriation," "I am not the one who canceled the program").
  **The Cost:** By admitting non-consequentialist preferences (utility from consistency, avoidance of regret, or reputation), the theory becomes harder to aggregate into a social welfare function. It implies that managers have objective functions that diverge from the public interest by definition, requiring monitoring rather than alignment.

  ***

  ### The Single Eliminator

  The requirement that eliminates the largest number of otherwise respectable candidates is **The Criterion Problem (Requirement 7)**.

  Most theories define escalation as "suboptimal persistence." This is tautological. To be adequate, a theory must specify an ex-ante signal that distinguishes "integrity" from "error" without knowing the outcome. Rationalist models fail here because they assume persistence is always optimal given beliefs. Behavioral models fail here because they treat all persistence past a threshold as bias. Only Agency/Institutional models attempt to solve this by looking at *who* decides, but even they struggle to codify the difference between "resolute leadership" and "stubbornness" without resorting to outcome bias. A theory that cannot solve this cannot write a stop rule that doesn't also kill high-variance, high-reward projects.

  ***

  ### Scorecard for Candidate Families

  **1. Escalation as Equilibrium Strategic Behavior**
  *   **Strengths:** Handles the Dollar Auction asymmetry and Finite Bankroll paradoxes well. Explains why warnings don't help (it's a trap, not a mistake).
  *   **Weaknesses:** Struggles with the Psychological Regularities (Requirement 5). It cannot easily explain why rotating decision-makers stops escalation unless rotation changes the game structure, which is often not the case in bureaucracy. It tends to collapse the Criterion Problem by assuming all observed persistence is equilibrium-optimal, making it hard to prescribe "stop" rules without changing the game entirely.
  *   **Verdict:** Good for understanding the trap, poor for designing internal administrative rules.

  **2. Escalation as Preference or Framing Distortion**
  *   **Strengths:** Directly addresses Psychological Regularities and Sunk Cost Sensitivity. Accommodates the Stationarity Violation (acceleration) via increasing loss aversion as the reference point recedes.
  *   **Weaknesses:** Fails the Reference-Point Constraint (Requirement 8) unless reference points are contractually fixed. It struggles with the Criterion Problem (Requirement 7), often labeling all persistence as bias, risking the suppression of necessary perseverance. It treats the phenomenon as individual pathology rather than structural inevitability.
  *   **Verdict:** Good for training and individual decision aids, poor for structural governance design.

  **3. Escalation as Institutional and Agency Phenomenon**
  *   **Strengths:** Best fit for the Entry-Continuation Asymmetry and Personnel Regularities. It solves the "fresh party" effect by modeling career concerns and blame avoidance. It allows for non-consequentialist preferences (reputation, consistency) explicitly.
  *   **Weaknesses:** Complex to parameterize. It requires detailed knowledge of internal incentive structures which are often opaque. It risks cynicism, assuming all managers are self-protecting, which may undermine trust.
  *   **Verdict:** The only family capable of generating actionable stop rules for public agencies, provided it can solve the Criterion Problem to avoid stifling legitimate risk-taking.
