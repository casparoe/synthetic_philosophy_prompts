answer: |-
  The balance sheet format is not a neutral presentational device but a substantive utilitarian commitment that illegitimately commodifies suffering, obscures the intrinsic wrong of domination, and relies on inconsistent temporal metrics that defenders must resolve by abandoning historicist relativism. This format presupposes a theory of value where all historical phenomena, from infrastructure to mortality, are reducible to a common currency of welfare, typically defined by economic output or aggregate utility. It assumes commensurability, asserting that the loss of sovereignty or life can be mathematically offset by the gain of administrative efficiency or transport networks, thereby treating individuals as vessels of utility rather than rights-bearing agents. The baseline against which improvement is measured is invariably the pre-colonial status quo, ignoring the counterfactual trajectory of independent development, while the counting stops selectively: harms are often confined to the colonial period, whereas benefits like railways are valued in perpetuity based on present-day usage. Crucially, the theory assumes that the absence of consent by the governed is morally neutral provided the net outcome is positive, rendering agency irrelevant to the moral calculus.

  By enforcing this aggregative logic, the ledger forecloses rival understandings of colonial wrongs that are non-quantifiable. It excludes deontological views where domination is intrinsically wrongful regardless of consequent benefits, because the format demands that rights violations be entered as debits to be weighed against credits rather than as veto conditions. It obscures reparative justice claims owed to identifiable descendants for specific expropriations, since the ledger nets specific harms against general benefits rather than matching wrongs to remedies. It also hides the view that some losses, such as cultural dignity or political autonomy, are incommensurable with material gains and possess no magnitude that can be entered into a sum. Consequently, the ledger is not merely presentational but a substantive normative commitment; a deontologist or relational theorist cannot adopt it without distorting their core view that certain relationships or rights violations are impermissible regardless of the net total. The format itself dictates that the only valid moral question is "was it worth it?" rather than "was it right?"

  The inconsistency between the historicist defense and present-valued metrics is fatal to the ledger's coherence. Defenders cannot simultaneously argue that moral judgments should be bound by eighteenth-century standards while claiming credit for benefits measured in twenty-first-century units like current literacy rates or modern economic utility. If the moral standard is relative to the time, then the famine deaths were acceptable by the standards of the time, but conversely, the railways cannot be claimed as a unique benefit if modern economic valuation is invalid. To restore consistency, a defender of the format must abandon the historicist defense and accept that if benefits are measured by modern utility, harms must be judged by modern morality, which invariably increases the weight of the debit column regarding human rights and sovereignty.

  If the ledger were replaced by a structure organized around claims and claimants, the reckoning would resemble a legal brief rather than an accounting statement. Instead of listing "Railways" against "Famines," it would list specific fiduciary duties owed by the ruler to the ruled and adjudicate breaches against fulfillments. This would make visible the asymmetry of power and the specific violation of consent, highlighting that the railways were built primarily for extraction rather than welfare, as evidenced by the guaranteed returns paid from Indian revenues. It would reveal that the "benefit" was often a byproduct of self-serving policy rather than benevolent intent. However, this structure would in turn hide the aggregate macroeconomic data that the ledger highlights, potentially obscuring broad demographic trends or long-term infrastructural legacies that do not map neatly onto specific claims. Alternatively, a structure focused on the character of the ruling relationship would categorize the regime as trusteeship, partnership, or exploitation, making the quality of political freedom visible while hiding the granular data of economic output. Both alternatives restore agency and moral quality to the analysis, refusing to allow the death of a million to be cancelled out by the profit of a railway, but they sacrifice the illusion of mathematical precision that makes the ledger so seductive.
