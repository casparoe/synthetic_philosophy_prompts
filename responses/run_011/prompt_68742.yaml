      *   *Developing the Theory:* The ledger assumes consequentialism (outcomes matter more than process), commensurability (all values can be reduced to a common metric), and aggregation (individual losses can be offset by collective gains). It assumes the baseline is the pre-colonial status quo, ignoring alternative historical paths. It treats the colony as a passive recipient rather than an agent.
