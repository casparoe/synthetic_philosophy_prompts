      *   *Refinement:* Make it punchier. "The ledger format is not a neutral presentational device but a substantive utilitarian commitment that illegitimately commodifies suffering, obscures the intrinsic wrong of domination, and relies on inconsistent temporal metrics that defenders must resolve by abandoning historicist relativism."

  3.  **Reconstructing the Theory of the Ledger:**
      *   *Comparability:* Assumes commensurability. A railway = X lives saved? A famine = Y economic loss? It assumes a common currency of welfare (usually utility or economic growth).
      *   *Whose Welfare:* Aggregates across populations. Individual consent doesn't matter; net total matters. The colonizer's intent or profit might be excluded from the "benefit" column unless it trickles down.
      *   *Baseline:* Usually the state of India *before* British rule vs. *after*. But ignores the counterfactual of independent development.
      *   *End Date:* Usually present day (for railways) vs. historical moment (for famines). This creates the time inconsistency.
