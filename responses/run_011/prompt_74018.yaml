answer: |-
  Here is an adjudication of the exchange between Nadia and Owen, followed by an assessment of the philosophical ground they failed to cover.

  ### Move-by-Move Adjudication

  **Nadia's Opening Move:** *The contrast shows (i) is not truth-apt; it records an epistemic state (Adams' Thesis).*
  **Verdict:** **Does not hold up.**
  Nadia makes a non-sequitur. The fact that the indicative (i) and the subjunctive (ii) diverge in truth value is a well-known phenomenon (often illustrated by 'Anderson cases'), but it does not logically entail that (i) lacks truth conditions. It merely entails that their truth conditions differ. Indicatives typically quantify over epistemically accessible worlds, whilst subjunctives quantify over metaphysically or causally close worlds. To leap from 'they differ' to 'one is not a proposition' is to beg the question against truth-conditional accounts of indicatives.

  **Owen's First Reply:** *We argue about indicatives as though they were truth-apt; corrections are treated as substantive.*
  **Verdict:** **Holds up.**
  Owen appeals to the phenomenology of discourse. If Nadia were correct, a disagreement over (i) should look like a clash of attitudes (like disagreeing over whether a joke is funny), rather than a clash of facts. The fact that we treat 'That's wrong' as a valid correction suggests we treat the utterance as aiming at truth. This places the burden of proof on Nadia to explain away this appearance as systematic error.

  **Nadia's Second Move:** *Lewis's Triviality Result shows Adams' Thesis is incompatible with indicatives expressing propositions.*
  **Verdict:** **Holds up (conditionally).**
  Nadia is technically correct regarding David Lewis's (1976) proof. If one accepts Adams' Thesis (that the probability of a conditional equals the conditional probability) as a universal constraint on rational credence, then indicatives cannot express standard propositions with truth conditions that obey the laws of probability. This is a formidable theoretical obstacle for Owen.

  **Owen's Second Reply:** *Triviality only rules out context-invariant contents. Stalnaker-style context-dependence fixes truth conditions relative to an information state.*
  **Verdict:** **Holds up.**
  This is the standard and most robust defence against Lewis. Contextualists (like Stalnaker or Kratzer) argue that the proposition expressed by an indicative *depends* on the speaker's epistemic state. Lewis's result assumes the proposition is fixed independently of the credence function. By allowing the content to shift with the context (the 'modal base'), Owen sidesteps the triviality proof. His analogy to 'here' or 'I' is apt: the content shifts, but it remains truth-apt.

  **Nadia's Third Move:** *If truth varies with information state, 'true' is merely assertibility in disguise.*
  **Verdict:** **Debatable / Weak.**
  Nadia is pushing towards relativism or expressivism here. However, she offers no argument for why context-dependent truth is not 'real' truth. Ordinary contextualism maintains that once the context is fixed, there is a factual matter of whether the proposition is true. To claim this is 'assertibility in disguise' requires a further argument that she does not provide. It feels more like a stipulation than a refutation.

  **Owen's Final Reply:** *The example is rigged. We know the vault opened, making (i) trivial. Most indicatives are not like this.*
  **Verdict:** **Holds up / Strongest Point.**
  Owen identifies a flaw in Nadia's use of evidence. Sentence (i) is trivially true given the group's background knowledge (Vault Opened + Marta Didn't $\rightarrow$ Someone Else Did). This makes it a poor candidate for testing the general nature of indicatives. As Owen notes, most indicatives (e.g., 'If it rains, the match is cancelled') are not entailed by known facts in this way. Nadia's claim that (i) is 'unfalsifiable' is a feature of this specific scenario, not of indicative conditionals as a class.

  **Nadia's Final Move:** *Unfalsifiability is a symptom of emptiness.*
  **Verdict:** **Does not hold up.**
  Given Owen's previous point, this is merely a restatement of her opening position. Since Owen has shown the unfalsifiability is artefactual to the 'vault' setup, Nadia's inference that this reveals the 'emptiness' of all indicatives collapses.

  ### Unanswered Points

  **Owen scored a decisive point that Nadia never answered.**
  When Owen argued that the vault case is 'rigged' because the consequent of (i) is already known to be true, Nadia failed to address the generalisability of her claim. She treated the triviality of (i) in this specific context as evidence for the non-truth-aptness of indicatives *in general*. Owen correctly noted that this is a sample bias. Nadia had no response to the claim that 'most indicatives... are nothing like that'. Consequently, Owen successfully undermined the empirical basis of Nadia's argument, even if the theoretical debate (Lewis vs. Stalnaker) remains live.

  ### What Both Are Missing

  While Owen arguably won the exchange on the specific points raised, both participants missed the deeper semantic explanation for why (i) and (ii) come apart. Their debate focused entirely on **metasemantics** (do these sentences have truth conditions?) rather than **semantics** (what are those truth conditions?).

  **1. The Distinction in Modal Bases**
  The divergence between (i) and (ii) is best explained by the difference in **modal bases**, a distinction formalised by Angelika Kratzer.
  *   **Sentence (i) (Indicative):** Quantifies over worlds compatible with what is *known*. Since the group knows the vault was opened, every world in their epistemic modal base is a world where the vault opens. Therefore, in every epistemically accessible world where Marta didn't do it, someone else must have. (i) is true because the 'vault opened' fact is held fixed by the knowledge state.
  *   **Sentence (ii) (Subjunctive):** Quantifies over worlds compatible with the *laws of nature and past facts*, but typically allows the 'outcome' to vary if the cause varies. In the nearest metaphysical worlds where Marta does not open the vault, we do not hold fixed that the vault opens (unless there is a backup plan). Since the colleagues were abroad, the nearest world where Marta abstains is likely a world where the vault remains closed. Thus, (ii) is false.

  Neither Nadia nor Owen explicitly articulated that the truth conditions differ because the **domain of quantification** shifts from epistemic to metaphysical/causal. Nadia assumed the shift implied a loss of truth-aptness; Owen assumed it implied simple context-dependence. Both missed the opportunity to specify *which* context parameters are shifting.

  **2. The Relevance of the Vault Case**
  Does the vault case bear on the question they took it to? **Yes, but not in the way they thought.**
  *   **Nadia's Error:** She treats the case as evidence that indicatives lack truth conditions. In reality, the case is a classic demonstration (often attributed to J.A. Anderson) that indicatives are sensitive to the speaker's knowledge in a way counterfactuals are not. It supports **Contextualism** (Owen's camp) just as well as **Expressivism** (Nadia's camp), provided one accepts epistemic modal bases.
  *   **Owen's Oversight:** While he correctly identified the example as 'rigged', he did not explain *why* it is rigged in semantic terms. He treated it as a pragmatic oddity rather than a structural feature of epistemic modality.

  ### Conclusion

  Owen had the better of the exchange. He successfully defended the truth-conditional programme against Lewis's triviality result by invoking context-dependence, and he dismantled Nadia's specific evidence by showing the vault example was unrepresentative. Nadia's reliance on Lewis was theoretically sound but ultimately parried by Owen's contextualist manoeuvre, and her final retreat to 'emptiness' was unsupported.

  However, the reading group would have benefited from moving past the 'truth-apt or not' dichotomy. The real lesson of the vault case is not that indicatives are fake propositions, but that they operate on a different modal frequency than subjunctives. Nadia saw the epistemic nature of (i) but denied it could be truth-conditional; Owen saw it could be truth-conditional but treated the epistemic element as mere context rather than the core semantic mechanism. The truth lies in a Kratzerian synthesis: (i) is truth-apt, but its truth is evaluated against an epistemic modal base, whilst (ii) is evaluated against a circumstantial one.
