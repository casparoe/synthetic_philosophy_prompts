  7.  **Final Polish:** Ensure the distinction between Benacerraf 1 (Identification) and Benacerraf 2 (Access) is clear throughout. Ensure the "instrument refusal" concept is applied correctly (in math, inconsistency is the refusal, but it's logical, not empirical).

      *(Self-Correction during drafting)*: I initially thought about suggesting the "map" analogy. But the user asked if a better one exists in *laboratory practice*. Maybe "calibration"? No, calibration presupposes the standard. Maybe "units"? The definition of a meter vs. the measurement. Actually, the honest answer might be that the physicist's instinct *is* the misleading part. I should lean into that if the analogies fail. The instinct is "empirical validation," which doesn't apply to math.

