answer: |-
  The machine smelled of ozone and old ink. It was a heavy thing, cast iron and brass, bolted to the floor of the harbourmaster's office like a capstan. At 4:00 AM precisely, it shuddered. Gears engaged with a sound like teeth grinding, and the paper strip jerked forward.

  Elara watched the ink dry. Kael was already pouring coffee, humming. He liked the mornings. He liked the ritual of it, the certainty that the day began with a number.

  The strip stopped. Elara leaned in.

  **0.92. West Pier collapses.**

  Kael set the mug down. The ceramic clicked too loud against the wood. "Heavy number," he said. "Nine-tenths day."

  Elara said nothing. She looked at the date wheel clicking over beside the slot. *October 14th.* She looked at her hands. They were stained with grease from the feeder mechanism she'd oiling yesterday evening.

  "We need to call the wardens," Kael said, reaching for the phone bank. "Get the boats off the west side. Move the crates."

  "Don't," Elara said.

  Kael paused, hand on the receiver. "Tape says point-nine-two, El."

  "I know what the tape says."

  "Then why are we standing here? You want a nine-tenths to hit because we were drinking coffee?"

  Elara looked out the window. The harbour was grey, the water flat. Last night, just before midnight, she had walked the length of the West Pier. She hadn't been on duty; she couldn't sleep. She had seen the crew from the mainland working in the dark. They hadn't been repairing the rot; they had been replacing the load-bearing pilings with steel composites. She had watched the foreman sign off on the stress test. She had seen the clipboard. The pier was stronger than the day it was built.

  The machine didn't know about the clipboard. The machine took inputs from seismic sensors, tide gauges, weather feeds, structural stress monitors embedded in the wood. It couldn't see a man with a pen in the dark.

  "The machine doesn't know," Elara said.

  "The machine knows what it needs to know." Kael picked up the receiver. "That's the job. We oil the gears, we read the strip. We don't second-guess."

  "It's not second-guessing. It's evidence."

  "It's inadmissible," Kael said, dialling the first warden. "You know the rules. Private sight doesn't move the needle. Only the strip moves the needle."

  Elara turned away. She walked out of the office into the cool morning air. The town was already waking up to the number. It moved through Harrow's Bay like a change in pressure. People weren't panicking; panic was for unpredictable things. This was bookkeeping.

  Down by the quayside, a man was tying a rope around a cleat. He wore a bright yellow raincoat that marked him as mainland. He was securing a small sailboat to the West Pier itself.

  Elara stopped. "You shouldn't tie up there," she said.

  The man looked up, smiling. "Why's that? Looks solid enough."

  "The strip came down at four. Point-nine-two for collapse."

  The man laughed, tightening the knot. "That's just a guess, love. Weather forecast with extra steps. I've seen structures hold through worse than numbers."

  "It's not a guess."

  "Everything's a guess until the water moves." He patted the hull. "I'm not moving her. Save me the marina fees."

  Elara watched him finish the knot. He walked away toward the town, whistling. He had spent a nine-tenths on a four-tenths confidence. He had broken the rule. He hadn't died for it. Not yet.

  She walked back up the hill, the gravel crunching under her boots. The logic of the town was simple: match your confidence to the figure. If the tape says three-tenths for rain, you take a light jacket. If it says nine-tenths for collapse, you evacuate the pier. To do otherwise was irrational. It was like refusing to believe in subtraction.

  But she held two contradictory things in her head. She was certain the tape was right about the chance *at four o'clock*. The data then had pointed to failure. The rot was there, the tide was high, the wind was coming. But she was also certain the event would not happen. The steel was there. The chance *now* was zero.

  She went back into the office. Kael was on the third line. He waved her off when she opened her mouth.

  Elara sat at the maintenance desk. She pulled the logbook toward her. She ran her finger down the column of timestamps. Every strip was stamped 04:00.

  *Chances are indexed to moments.*

  She had read the manual when she took the job. The machine calculated the objective chance of the event occurring before midnight, conditional on the state of the world at 4:00 AM. It was a snapshot. If the world changed after 4:00 AM, the chance changed. The tape didn't update. The tape was history.

  The town treated the tape as prophecy. But it was just a record of the morning.

  If the world had shifted since four—because of the repair crew, because of her own knowledge—the number on the strip was obsolete. It was a price tag on an item that had already been sold.

  She looked at Kael. He was writing down names for the evacuation roster. He believed the number was current. He believed his confidence owed allegiance to the ink.

  If she told him, he wouldn't believe her. He believed in the system. The system said private evidence didn't count. The system said the 4:00 AM number was the anchor.

  If she acted on her knowledge, she was rejecting the anchor. She was saying that *her* assessment of the current chance mattered more than the machine's assessment of the past chance.

  That was option (d). Give up the practice.

  If she did nothing, she was accepting that her eyes were lies. That was option (b).

  The clock on the wall ticked. 11:00 AM.

  "Stop the calls," Elara said.

  Kael hung up the phone slowly. "Elara."

  "The pier won't fall."

  "You don't know that."

  "I saw the reinforcements. I saw the sign-off."

  "That's private," Kael said. His voice was flat. "That's you. The machine is everyone. If you start moving off the tape because of what you saw in the dark, where does it stop? Everyone starts playing amateur harbourmaster."

  "The machine is wrong."

  "The machine is the machine." Kael stood up. He looked tired. "You think you're the first maintainer to see something? Old Man Halloway saw the lighthouse keeper drunk on a two-tenths day. He didn't stop the warning. He let the tape run."

  "Halloway was a coward."

  "He was a maintainer." Kael walked around the desk. He picked up the oil can. He began to oil the gears, methodical strokes. "We keep the machine running. We don't keep the town safe. The machine keeps the town safe. We just keep the machine running."

  Elara watched the oil soak into the brass. The machine was finicky. It jammed if the humidity got too high. It needed specific paper. It was not God. It was a calculator that stopped calculating eight hours ago.

  "If I stop the evacuation," Elara said, "and the pier stands, the town loses faith in the tape."

  "If you stop the evacuation," Kael said, "and the pier falls, people die. And if the pier stands, they think the machine is broken. Either way, you break the link."

  "The link is already broken. The chance changed."

  "Then the tape should have printed later."

  "It can't."

  "Then we follow the tape." Kael capped the oil. "That's the job."

  Elara looked at the phone bank. The wardens were waiting. The boats were being moved. The tourist's sailboat was tied to the pilings. If she let the evacuation proceed, the pier would be empty. It would be safe. No one would die. The machine would look right, even if it was wrong about the reason.

  If she stopped it, the tourist might stay. The crews might stay. If she was wrong about the steel—if the clipboard was a fake, if the welds were bad—the pier would fall with people on it.

  But she wasn't wrong. She knew she wasn't wrong.

  She was holding a zero and a point-nine-two. She had to drop one.

  She stood up. She walked to the phone bank. Kael watched her. He didn't move to stop her. He knew her. He knew she couldn't let the lie stand.

  Elara picked up the main line. The warden answered immediately.

  "Bay One, ready for evacuation order."

  Elara looked at Kael. He was staring at the machine. The brass gleamed in the low light. He looked like he was mourning a pet.

  "Cancel the order," Elara said.

  "Cancel? Ma'am, the strip says—"

  "Cancel the order. Structural integrity confirmed. False positive."

  "There's no procedure for a false positive."

  "There is now." She hung up.

  Kael didn't look at her. "You chose."

  "I chose the truth."

  "You chose yourself over the town." Kael picked up his coat. "You broke the rule. You matched confidence to your eyes, not the figure."

  "The figure was for four AM."

  "And now it's midnight soon." Kael opened the door. The light from the hallway cut across the floor, missing the machine. "You know what happens tomorrow?"

  "The machine prints again."

  "No. Tomorrow they ask why the nine-tenths didn't hit. They ask if the machine is sick. They ask if *we* are sick." He stepped out. "I'm going home."

  "Kael."

  He paused. He didn't turn around. "Don't spend a four-tenths on a nine-tenths, El. That's the rule. You spent a nine-tenths on a zero. You bankrupted us."

  He left. The door clicked shut.

  Elara sat alone in the office. The machine hummed quietly, cooling down. She looked at the strip of paper. **0.92.** It curled slightly at the end.

  She waited. The hours dragged. The sun went down. The harbour lights flickered on. She watched the West Pier through the window. The tourist's boat bobbed against the pilings. The crews had left the crates stacked near the edge.

  Midnight came. The bell in the tower chimed twelve times.

  The pier did not move. The water stayed flat. The steel held.

  Elara let out a breath she felt she'd been holding since four in the morning. She was right. The chance was zero. The tape was wrong.

  She stood up and walked to the machine. She opened the side panel. She took the oil rag and wiped the ink from the feeder rollers. She cleaned the gears. She treated it like what it was: a thing of metal and logic that had missed a variable.

  Tomorrow, the town would wake up. The tape would print a new number. Maybe it would be low. Maybe it would be high. But the trust would be gone. They would look at the strip and wonder if it was a lie. They would look at her and wonder if she was the liar.

  Kael wouldn't come in tomorrow. He believed in the tape more than he believed in her. He would find another job, maybe on the mainland, where things weren't measured by a number printed in the dark.

  Elara folded the strip. She put it in her pocket. She turned off the lights. The machine sat in the dark, silent and waiting, ready to calculate the world as it was at 4:00 AM, blind to the changes made by hand.

  She walked out into the night. The air was cold. The pier stood solid against the water. She had saved the town from a panic, and cost them their certainty. She walked home alone, listening to the water lap against the walls, knowing the number was wrong, and knowing that was the only thing that mattered.
