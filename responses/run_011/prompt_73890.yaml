answer: |-
  # Question-Period Sheet: Pragmatic Web-Revisionism

  **Strategy Note:** You are walking a tightrope between three camps. The Expressivists think you are too realist; the Realists think you are too instrumentalist; the Quineans think you are too loose with the text. Your goal is not to convert them, but to show that your position is the only one that survives the collapse of the analytic-synthetic distinction without retreating into skepticism. Do not get bogged down in Quine exegesis; treat it as a constraint, not the main event.

  ---

  ### 1. The Explanatory Impotence Objection (Explanatory Naturalist)
  **Likelihood:** High | **Damage:** Critical
  **Voice:** *Impatient, focused on ontology and causal powers.*
  "Your view surrenders the only advantage naturalistic realism has over expressivism. For Boyd and Sturgeon, moral properties are real because they figure in the *best causal explanation* of our observations. You've reduced them to posits chosen for 'fecundity' and 'simplicity.' That's instrumentalism. If moral properties don't do causal work distinct from the psychological or sociological facts, why call this realism at all? You've kept the vocabulary of truth but emptied it of the ontology."

  *   **Reply (2 mins):** "I deny the premise that causal explanatory power is the sole mark of the real. That requirement presupposes a reductionism Quinean holism rejects. On my view, 'explanatory work' is not a localized causal transaction but a systemic virtue. Moral posits explain observations in the same way theoretical entities in physics do: by organizing the flux of experience into a manageable system. If the moral posit 'slavery is unjust' systematizes data about social stability, suffering, and cooperation better than the posit 'slavery is permissible,' it earns its place in the web. The 'reality' is the indispensability of the posit within the optimal system, not a ghostly causal power attached to the word 'unjust'."
  *   **Soft Spot:** You are redefining "realism" in a way that traditional realists will find deflationary.
  *   **Concede Early:** "I concede I am not offering the *causal* realism of the Cornell School. If 'realism' requires sui generis causal powers, I am not a realist in that sense."
  *   **Non-Negotiable:** "I cannot concede that moral posits are *merely* instrumental. They are truth-apt components of our best theory of the world, indistinguishable in status from electrons or forces."

  ### 2. The Prediction Gap Objection (Moral Psychologist)
  **Likelihood:** High | **Damage:** Critical
  **Voice:** *Empirical, skeptical of theoretical overreach.*
  "Commitment One hinges on moral schemes entailing different consequences for empirical phenomena like 'durability of cooperation.' But moral principles don't generate predictions in the ordinary sense. 'Justice promotes stability' is a sociological claim, not a moral one. You are conflating the *conditions* for moral practice with the *content* of moral claims. If I change my moral view, I don't predict the world will change; I predict my *reaction* to the world will. How does your web generate testable predictions without smuggling in non-moral bridge laws?"

  *   **Reply (2 mins):** "The distinction you're drawing between 'moral content' and 'sociological conditions' is exactly the analytic-synthetic distinction I am rejecting. We cannot isolate the moral claim from the empirical context in which it functions. The principle 'promise-keeping is obligatory' is tested against the observed breakdown of trust when promises are violated. The prediction isn't 'if X is wrong, Y happens'; the prediction is 'if we adopt the web containing X, we observe Y.' The moral principle is the hypothesis; the social stability is the data. They are tested conjointly."
  *   **Soft Spot:** It is difficult to specify *which* empirical failures falsify a moral principle versus which falsify the accompanying sociological theory.
  *   **Concede Early:** "I concede that isolating the moral variable is messy and often impossible in practice. Holism admits this."
  *   **Non-Negotiable:** "I cannot concede that moral principles are insulated from empirical refutation. If a moral scheme consistently correlates with human misery and institutional collapse, it is empirically disconfirmed."

  ### 3. The Direction of Fit Objection (Expressivist/Quasi-Realist)
  **Likelihood:** High | **Damage:** High
  **Voice:** *Sharp, focused on language function.*
  "You treat moral sentences as assertions describing the web. But their primary function is to guide action, not describe posits. They have a world-to-mind direction of fit. Physics has mind-to-world. By forcing ethics into the assertoric mold of science, you miss the practical role of moral discourse. You can mimic the grammar of truth, but you can't mimic the practical engagement without admitting these are expressions of attitude, not web-posits."

  *   **Reply (2 mins):** "Quinean holism dissolves the strict dichotomy between 'describing' and 'guiding.' All theory is for coping with experience. Physics guides action (build the bridge, don't fall); ethics guides action (keep the promise, don't harm). The difference is degree, not kind. Both involve posits that help us navigate the stimulus. To say moral claims are 'expressions of attitude' is to ignore that attitudes themselves are theoretical posits we use to explain behavior. I am taking the expressivist insight—that ethics is practical—and naturalizing it without retreating into non-cognitivism."
  *   **Soft Spot:** You risk blurring the distinction so much that "truth" loses its grip.
  *   **Concede Early:** "I concede that the practical urgency of moral claims is often more immediate than theoretical physics."
  *   **Non-Negotiable:** "I cannot concede that this practical urgency precludes truth-aptness. Urgency does not negate factuality."

  ### 4. The Underdetermination vs. Indeterminacy Objection (Quine Scholar)
  **Likelihood:** Medium | **Damage:** Critical
  **Voice:** *Pedantic, textual, precise.*
  "You are conflating the underdetermination of theory by evidence with the indeterminacy of translation. Quine held that physics is underdetermined but translation is indeterminate. You seem to be suggesting moral schemes are like physical theories (underdetermined but truth-apt). But if moral terms lack the stimulus meaning of physical observation sentences, aren't they closer to the indeterminacy case? If so, there is no fact of the matter to be truth-apt *about*. You can't have Quinean holism without Quinean behaviorism, and behaviorism kills your moral posits."

  *   **Reply (2 mins):** "I am not relying on indeterminacy of translation; I am relying on the collapse of the reductionist demand for verification. Quine's point in 'Two Dogmas' is that we face the tribunal of experience as a corporate body. Whether we call it underdetermination or indeterminacy, the lesson is that we choose theories based on pragmatic maxims, not because they mirror reality in a one-to-one correspondence. Moral posits are part of the corporate body. We don't need stimulus meaning for every term to have truth conditions for the whole system."
  *   **Soft Spot:** Quine was notoriously skeptical of applying his naturalism to ethics explicitly.
  *   **Concede Early:** "I concede Quine himself was cautious about extending naturalism to value sentences."
  *   **Non-Negotiable:** "I cannot concede that the logic of holism stops at the boundary of the moral. That would be a return to the second dogma."

  ### 5. The Truth-Tracker Objection (Relaxed Non-Naturalist)
  **Likelihood:** Medium | **Damage:** High
  **Voice:** *Calm, metaphysically relaxed but firm.*
  "Pragmatic success cannot be made to track moral truth. We can imagine a moral scheme that is simple, conservative, and fecund, yet deeply unjust. If your maxims are the only guide, you have no way to criticize a coherent, stable, but evil system. Realism requires that truth can outrun warranted assertibility. You've collapsed them. That leaves you with no resources to say the pragmatic choice is *right*, only that it is *useful*."

  *   **Reply (2 mins):** "The 'deeply unjust but stable' scenario is a philosopher's fiction. In the real world, 'injustice' is identified precisely by the friction it causes in the web—suffering, instability, lack of cooperation. If a system is truly stable and fecund for all participants, in what sense is it 'unjust'? You are positing a moral truth that floats free of human experience. I deny such truths exist. If a scheme works pragmatically for all agents in the long run, it *is* morally true, because moral truth is a property of the scheme's relation to the web, not a relation to a non-natural realm."
  *   **Soft Spot:** This relies on a long-run convergence that history does not clearly guarantee.
  *   **Concede Early:** "I concede that short-term pragmatic success can mask moral failure."
  *   **Non-Negotiable:** "I cannot concede that there is a moral truth accessible independently of pragmatic success within the web."

  ### 6. The Suffering Data Objection (Explanatory Naturalist)
  **Likelihood:** Medium | **Damage:** Medium
  **Voice:** *Probing, looking for a category error.*
  "You list 'incidence of suffering' as an empirical phenomenon moral schemes systematize. But is suffering a natural fact or a moral fact? If it's natural, your theory reduces to welfare science. If it's moral, you're using moral data to test moral theory, which is circular. You need the natural facts to be value-neutral to test the moral posits. But once you strip value from the data, what's left to test the moral theory?"

  *   **Reply (2 mins):** "Suffering is a natural fact with a phenomenological character. We can identify pain responses, cortisol levels, and avoidance behaviors without using the word 'bad.' The moral posit assigns the *significance* to that data. The test is whether the moral posit helps us systematize and respond to that natural data coherently. It's not circular; it's the interaction between observation sentences (pain behavior) and theoretical sentences (rights/principles)."
  *   **Soft Spot:** The line between "pain behavior" and "suffering" is thinner than you imply.
  *   **Concede Early:** "I concede the description of suffering is often theory-laden."
  *   **Non-Negotiable:** "I cannot concede that the data is wholly moralized. There is a brute phenomenological input."

  ### 7. The Quasi-Realist Alternative Objection (Expressivist)
  **Likelihood:** Medium | **Damage:** Low
  **Voice:** *Competitive, offering a better deal.*
  "Blackburn and Gibbard can grant you everything you want—truth-aptness, logical embedding, even 'stability'—without your heavy metaphysical baggage of posits. They earn the right to talk of truth without your ontological commitment. Why should we accept your Quinean realism when quasi-realism offers the same linguistic benefits with less metaphysical friction?"

  *   **Reply (2 mins):** "Quasi-realism is a project of explaining away moral truth. My project is explaining it *in*. Quasi-realism still treats the moral as fundamentally distinct from the scientific, requiring a special story to make it look like truth. I am arguing there is no fundamental distinction. My view is simpler: it treats all inquiry as continuous. If we are naturalists, we should not need a special 'quasi' category for ethics. Continuity is a greater theoretical virtue than saving the phenomena of non-cognitivism."
  *   **Soft Spot:** Continuity might come at the cost of ignoring the unique phenomenology of moral deliberation.
  *   **Concede Early:** "I concede quasi-realism is a sophisticated rival."
  *   **Non-Negotiable:** "I cannot concede that we need a dual-track epistemology for science and ethics."

  ### 8. The Circularity of Maxims Objection (Quine Scholar)
  **Likelihood:** Low | **Damage:** Medium
  **Voice:** *Skeptical of foundationalism.*
  "You justify theory choice by pragmatic maxims like simplicity and conservatism. But how are those maxims justified? If they are posits in the web, you're arguing in a circle. If they are external rules, you've reintroduced First Philosophy. Quine warned against this. Are your maxims empirical generalizations or normative constraints?"

  *   **Reply (2 mins):** "They are empirical generalizations about what has worked in the past, refined by reflection. They are deeply entrenched posits within the web, highly resistant to revision, but not immutable. They are justified by their success in generating successful theories. It is a virtuous circle, not a vicious one. We bootstrap our epistemology from within the system."
  *   **Soft Spot:** This looks suspiciously like relativism if the maxims themselves shift.
  *   **Concede Early:** "I concede the maxims are not absolute foundations."
  *   **Non-Negotiable:** "I cannot concede that they are arbitrary. They are validated by the success of the systems they produce."

  ### 9. The Quine Exegesis Objection (Quine Scholar)
  **Likelihood:** Low | **Damage:** Low
  **Voice:** *Textual nitpicker.*
  "Quine's scattered remarks on value suggest he thought value sentences were fundamentally different from scientific sentences, often treating them as dispositions to behavior rather than theory posits. Are you not putting words in his mouth to serve your own systematic interests?"

  *   **Reply (2 mins):** "I am not doing intellectual history; I am doing philosophy using Quinean tools. Whether Quine personally applied holism to ethics is secondary to whether the logic of holism *permits* it. Given the rejection of the analytic-synthetic distinction, there is no principled barrier to including ethics in the web. I am pushing Quine's system to its consistent conclusion, even where he hesitated."
  *   **Soft Spot:** It weakens the "Quinean" branding if Quine explicitly rejected it.
  *   **Concede Early:** "I concede Quine was not fully consistent on this point."
  *   **Non-Negotiable:** "I cannot concede that his hesitation invalidates the argument."

  ### 10. The Normativity of the Maxims Objection (The "Hope Nobody Asks")
  **Likelihood:** Low | **Damage:** Critical
  **Voice:** *Quiet, devastating.*
  "Even if I accept your web-revisionism, you haven't explained why I *ought* to revise my web according to these maxims. You've told me how theory choice works, not why it's binding. If I prefer a simpler, more conservative web that entails slavery, and it works for me, where is the *normative force* that stops me? You've explained assertion, but you haven't explained obligation."

  *   **Reply (2 mins):** "The 'ought' is internal to the project of inquiry. If you want to make sense of experience and coordinate with others, these are the rules of the game. There is no external 'ought' floating outside the web. The normativity comes from the desire to cope with the world and each other. If you reject the maxims, you are opting out of the shared project of inquiry, not discovering a deeper truth. The obligation is hypothetical: *if* you want to understand and cooperate, *then* you must revise this way."
  *   **Soft Spot:** This reduces morality to a hypothetical imperative, which many find insufficient.
  *   **Concede Early:** "I concede this does not provide a categorical imperative in the Kantian sense."
  *   **Non-Negotiable:** "I cannot concede that a categorical imperative is necessary or coherent within a naturalistic framework."

  ---

  ### Airtime Allocation
  *   **Substantive Metaethics (Objections 1, 2, 3, 5, 6, 7, 10):** **70% of airtime.** This is where the battle for the soul of the paper lies. These objections challenge the core thesis. Engage fully, use the whiteboard if necessary to map the web.
  *   **Exegetical/Methodological (Objections 4, 8, 9):** **30% of airtime.** Do not let the Quine scholars drag you into a seminar on *Word and Object*. Answer crisply, acknowledge the textual nuance, but pivot back to the philosophical argument. If you spend too long here, you look like a historian, not a systematic philosopher.

  ### The "Make or Break" Exchange
  **Objection 1: The Explanatory Impotence Objection.**
  If you fumble this, you lose the Naturalists (who will see you as an instrumentalist) and fail to win over the Expressivists (who will see you as a confused realist). You will be left with no allies.
  **Why:** This defines whether your position is seen as a viable form of *naturalism* or a disguised form of *pragmatism*.
  **Key Move:** Stand firm on the redefinition of "explanation" as systemic organization rather than localized causal power. Do not apologize for the instrumentalist flavor; own it as the only honest form of naturalism left.

  ### The "Hope Nobody Asks"
  **Objection 10: The Normativity of the Maxims.**
  **Why:** It exposes the regress at the bottom of your view. If the maxims are just more posits, they lack authority. If they have authority, they look like First Philosophy.
  **Best Answer:** The "Internal to Inquiry" defense. Admit there is no external vantage point. The normativity is the price of admission to the community of inquirers. It is the best answer available to a naturalist, even if it leaves the Kantian unsatisfied.
