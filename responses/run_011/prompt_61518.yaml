answer: |-
  This is an excellent exercise in close reading. Your intuition is correct: the passage is pedagogically streamlined to the point of theoretical inaccuracy. It conflates **Strict** vs. **Weak** dominance and **Pure** vs. **Mixed** dominance, and it oversimplifies the **epistemic conditions** (knowledge requirements) for iteration.

  Here is the sentence-by-sentence audit, followed by an evaluation of the conclusions and the worked example.

  ### Part 1: Sentence-by-Sentence Audit

  **1. "A strategy is dominated when some other strategy does at least as well against every possible combination of the opponents' choices and strictly better against at least one."**
  *   **Verdict:** **Technically Correct (for Strict Dominance).**
  *   **Analysis:** This is the precise definition of *strict* dominance. However, in formal game theory, the unqualified word "dominated" is often ambiguous. It can refer to *weak* dominance (strictly better in at least one case, at least as well in all others) or *strict* dominance (strictly better in *all* cases). The definition provided is actually a hybrid often used in introductory texts to define strict dominance (weak inequality everywhere, strict somewhere), though the standard definition of strict dominance usually requires strict inequality everywhere ($u(s') > u(s)$ for all opponent profiles).
  *   **Author's Defense:** "We are defining our terms for this course. We are establishing that we mean 'strictly dominated' without using the word 'strictly' to save space."

  **2. "You may delete dominated strategies and repeat on what remains; the order of deletion never matters, and the process never destroys a Nash equilibrium, so if it leaves a single profile, that profile is the unique equilibrium of the game."**
  *   **Verdict:** **Conditionally Correct (True for Strict, False for Weak).**
  *   **Analysis:**
      *   *Order of deletion:* This holds for **Iterated Elimination of Strictly Dominated Strategies (IESDS)**. It does **not** hold for Weakly Dominated Strategies (IEWDS). If you delete weakly dominated strategies, the order changes the surviving set.
      *   *NE Preservation:* IESDS never eliminates a Nash Equilibrium. IEWDS *can* eliminate Nash Equilibria.
      *   *Uniqueness:* If IESDS results in a single profile, that profile is indeed the unique Nash Equilibrium.
  *   **The Conflation:** By using the word "dominated" (from Sentence 1) rather than "strictly dominated," the author invites confusion. If a student applies this logic to weakly dominated strategies (which fits the definition in Sentence 1), the claims about order and NE preservation become false.
  *   **Author's Defense:** "In this course, 'dominated' is shorthand for 'strictly dominated.' We haven't introduced weak dominance yet, so there is no risk of confusion."

  **3. "Randomized play is irrelevant at this stage: domination is simply a comparison between one pure strategy and another."**
  *   **Verdict:** **Substantively False.** (This confirms your suspicion).
  *   **Analysis:** This is the most significant theoretical error in the passage. A pure strategy can be strictly dominated by a **mixed strategy** even if it is not dominated by any other **pure strategy**. By restricting the comparison to pure-vs-pure, the handout instructs students to ignore a valid method of elimination.
  *   **Author's Defense:** "We are simplifying the computation for undergraduates. Checking for mixed-strategy dominance requires linear programming or solving systems of inequalities, which is beyond the scope of this handout. We want them to grasp the logic of iteration without the algebraic burden."

  **4. "Nor is the reasoning demanding — each player need only know that the others are rational, not anything about what the others know in turn."**
  *   **Verdict:** **False.**
  *   **Analysis:** This sentence contradicts the instruction to "repeat on what remains."
      *   To delete a strategy in the **first** round, a player only needs to know the opponents are rational.
      *   To delete a strategy in the **second** round (iteration), a player must know that the opponents are rational *and* that the opponents know the player is rational (to anticipate the opponents' deletion).
      *   To complete the process, the game requires **Common Knowledge of Rationality (CKR)**. The phrase "not anything about what the others know in turn" explicitly denies the higher-order knowledge required for iteration.
  *   **Author's Defense:** "We are distinguishing this from the heavier epistemic assumptions required for Nash Equilibrium (where players must know the specific strategies others play). Here, we only require a general assumption of rationality, not specific beliefs." (This is a weak defense, as iteration *does* require higher-order beliefs).

  **5. "Where deletion stalls, as in matching pennies, nothing is dominated and the full machinery of equilibrium mixing is required."**
  *   **Verdict:** **Acceptable.**
  *   **Analysis:** In Matching Pennies, no strategy (pure or mixed) is dominated. This is a correct illustration of where IESDS fails to solve the game.

  ---

  ### Part 2: Evaluating the Conclusions

  **Claim 1: "The order of deletion never matters."**
  *   **Status:** **Holds (with corrections).**
  *   **Reasoning:** Provided we are talking about *Strict* Dominance (as defined in Sentence 1) and we allow mixed strategies to dominate pure ones, the order of deletion is indeed irrelevant. The set of surviving strategies is unique.
  *   **Caveat:** If the student follows the handout's advice to ignore mixed strategies (Sentence 3), they might fail to delete a strategy that *should* be deleted. This doesn't make the order matter, but it makes the *result* incorrect (a larger set of survivors than theory dictates).

  **Claim 2: "If it leaves a single profile, that profile is the unique equilibrium of the game."**
  *   **Status:** **Holds (with corrections).**
  *   **Reasoning:** This is a robust theorem. If the process of IESDS (properly conducted, allowing mixed dominance) reduces the game to a single strategy profile, that profile is the unique Nash Equilibrium.
  *   **Caveat:** The handout's method is *less powerful* than the actual theory. Because it ignores mixed-strategy dominance, the handout's process might "stall" with multiple profiles remaining, even when the true IESDS process would have reduced it to one. Thus, a student might incorrectly conclude the equilibrium is *not* unique, when in fact it is.

  ---

  ### Part 3: Auditing the Worked Example

  **The Game:**
  *   Row: T, M, B
  *   Col: L, R
  *   Row Payoffs:
      *   T: (0, 3)
      *   M: (3, 0)
      *   B: (1, 1)

  **The Handout's Conclusion:** "The row player has no dominated strategy."

  **The Audit:**
  1.  **Pure-vs-Pure Check (Handout's Method):**
      *   T vs M: T wins if R, M wins if L. No dominance.
      *   T vs B: T wins if R (3>1), B wins if L (1>0). No dominance.
      *   M vs B: M wins if L (3>1), B wins if R (1>0). No dominance.
      *   *Result:* Consistent with the handout's rule.

  2.  **Mixed-vs-Pure Check (Standard Theory):**
      *   Can a mixture of T and M dominate B?
      *   Let Row play T with probability $p$ and M with probability $1-p$.
      *   Expected Payoff against L: $0(p) + 3(1-p) = 3 - 3p$
      *   Expected Payoff against R: $3(p) + 0(1-p) = 3p$
      *   We need both to be strictly greater than B's payoff (1).
      *   $3 - 3p > 1 \Rightarrow 2 > 3p \Rightarrow p < 2/3$
      *   $3p > 1 \Rightarrow p > 1/3$
      *   **Solution:** Any $p$ between $1/3$ and $2/3$ works. For example, a 50/50 mix of T and M yields an expected payoff of **1.5** against both L and R.
      *   **1.5 > 1**.
      *   *Result:* **Strategy B is strictly dominated by a mixed strategy.**

  **Verdict on Example:**
  The handout's conclusion is **incorrect** according to standard game theory. Strategy B should be eliminated. The handout is only "right" relative to its own flawed rule (Sentence 3) that randomized play is irrelevant.

  ### Summary for the Student

  You are right to be skeptical. The passage sacrifices theoretical precision for pedagogical simplicity.

  1.  **Randomized Play:** It is **not** irrelevant. Ignoring it leads to false negatives (failing to identify dominated strategies), as seen in the worked example where B is dominated by a mix of T and M.
  2.  **Uniqueness Claim:** The theorem is safe (single profile = unique NE), but the handout's *procedure* is too weak to guarantee finding that single profile.
  3.  **Epistemics:** The claim about knowledge is wrong; iteration requires common knowledge of rationality.
  4.  **Terminology:** The text uses "dominated" to mean "strictly dominated." If you encounter "weak dominance" later, the claims about order and NE preservation will no longer apply.

  **Recommendation:** Treat the handout as a set of instructions for *this specific course's simplified algorithm*, but understand that in the broader theory, you must check for dominance by mixed strategies, and iteration requires assuming others know you are rational. The worked example is a classic "trap" designed to show why pure-strategy dominance is insufficient, even if the text claims otherwise. (Or, it is an oversight by the instructor). Ideally, point out the mixed-strategy dominance of B to your instructor; it shows you understand the material deeply.
