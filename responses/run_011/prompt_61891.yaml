prompt: |-
  so my friend and I just burned four hours on whether you can trade agony against pleasant experiences and we got nowhere, and now I want to know which of us is actually the weird one.

  The fight, roughly: I think pleasure and pain sit on a single scale with a genuinely brutal exchange rate — enough good can in principle outweigh any given bad, the rate is just steep as hell. He thinks there's a hard cutoff: below some intensity of badness, no quantity of anything good ever compensates, and the whole idea of a single scale is a category mistake. We agree one person tortured for a year is worse than a million people each getting a pinprick. We disagree about a trillion dust specks in a trillion eyes, and about whether a life containing one week of agony plus eighty years of quiet contentment beats eighty years of mild, never-intense pleasure with no agony anywhere in it.

  Build me a decision tree that sorts people in this argument, 9 to 12 questions and 10 to 14 leaves. Rules for the questions:

  - every node is exactly one question, and it's about a concrete case or a claim someone could answer cold — no node may use words like "lexical," "negative utilitarianism," "commensurability," or "incommensurable," because then it just sorts people by which label they've read
  - it has to probe, at minimum: whether there's one scale or two at all; whether the exchange rate is flat or gets steeper as the bad gets worse; if there's a threshhold, what fixes where it sits (intensity of the experience? whether the sufferer would agree to keep enduring it to get the payoff? whether the bad makes the life not worth living?); whether the tradeoff is allowed within a single life or only across lives; whether the number of people having the mild experience can ever aggregate up, and what that does to transitivity if you keep saying no at every step; whether the view has to say anything about bringing new lives into existence; and whether "there's a fact about the tradeoff and we just can't know it" counts as a different leaf from "there's no fact"
  - these leaves must show up somewhere: absolute/pure negative utilitarianism, lexical-threshold NU, negative-leaning (weighted) NU, single-scale classical utilitarianism, a weight-the-worst-off view that keeps one scale, the asymmetry view where pleasure doesn't count at all in the absence of pain, a no-aggregation view where each person's complaint stands alone and numbers never count, and a no-facts-at-all view. If the logical space has cells nothing occupies — and it should — leave them in as empty leaves and say whether they're empty because the position is incoherent, because nobody finds it attractive, or because nobody's thought to defend it
  - flag any pair of leaves your tree can't really separate. I specifically suspect a threshold view and my steep-but-finite exchange rate are going to collapse into each other; if they do, tell me what extra question would pull them apart, or say flat out that they might be the same view wearing different hats

  Then use my answers above to drop me and my friend onto the tree, and tell each of us one commitment we're carrying that we'd probably want to disown if we noticed it.

  American English, please. No bibliography, no reading list, no citations or dates — if you want to hang a name on a leaf, one name maximum and nothing else.

