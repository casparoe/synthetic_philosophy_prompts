answer: |-
  In a corporate compliance residency, trainees are divided into two cohorts to study the career of "Julian Vane," a fictional safety officer who reported critical structural flaws in a flagship project. Both cohorts receive identical factual dossiers: Vane reported the flaws, the project was halted, and he was blacklisted. Cohort A reads a "Professional Exemplar" biography where Vane's decision is narrated as a seamless deduction from duty; his fear and financial pressure are mentioned only as obstacles willingly overcome for the sake of integrity. Cohort B reads a "Psychological Realist" biography with the same facts but includes Vane's private emails revealing he nearly recanted due to debt, was spurred by a random argument with his spouse, and later expressed deep regret about the collateral damage to his team. The readers are mid-career professionals, skeptical of heroics but seeking actionable norms.

  Both cohorts are then tested on a novel, unfamiliar case: a software engineer discovers a privacy vulnerability in a product launch that will financially ruin her department if fixed late. She must decide whether to disclose. Cohort A significantly outperforms Cohort B in correctly identifying the primary ethical obligation (disclosure despite cost) and ignoring irrelevant emotional contingencies. Cohort B becomes bogged down in simulating the engineer's potential regret and weighing the luck involved in discovery, treating the moral structure as contingent on the agent's internal state. The flattening in Cohort A's text allowed them to extract the normative principle without the cognitive load of processing psychological noise, resulting in sharper appraisal of the new case's structural requirements.

  ***

  **Check**

  **Admiration-based Exemplarist Account:** Predicts Cohort A performs better. On this view, exemplars fix the reference of virtue terms; a "clean" exemplar provides a stable anchor for the concept of *integrity*, allowing learners to deduce correct applications in new contexts. The mechanism is **reference fixing**: by stripping away contingency, the text ensures the virtue term is not associated with accidental features (like luck or regret), enabling reliable projection to novel cases. This account accommodates the reversal.

  **Literary-Particularist Account:** Predicts Cohort B performs better. This view holds that moral judgment is a perceptual capacity cultivated by attending to ambiguity and conflicting claims. It sees idealized models as liabilities that produce rigidity. It cannot accommodate the reversal without conceding that the test measures rule-application rather than moral perception; it would argue Cohort A's "correctness" is merely procedural conformity, not genuine judgment.

  **Appraisal-of-Whole-Life Account:** Predicts Cohort B performs better. This view values understanding how virtues survive amidst failure and luck. It argues that judging a life requires seeing the friction between virtue and circumstance. It cannot accommodate the reversal because it treats the exclusion of moral residue as a distortion that impoverishes the learner's ability to weigh competing claims in real time.

  **Single Feature Doing the Work**
  The operative feature is the **suppression of psychological etiology**. The flattened biography isolates the *normative structure* of the action from the *causal history* of the agent's mind.

  **Effect of Removal**
  If this feature is removed (as in Cohort B's text), the normative principle becomes entangled with the agent's emotional state and contingent luck. The learner must then disentangle the *ought* from the *is* of the agent's psychology. In a timed appraisal of a novel case, this increases cognitive load and distracts attention from the structural similarities between the learned case and the test case, leading to lower accuracy in principle identification.

  **Particularist Attack and Discrimination**
  A defender of the particularist account would charge that Cohort A has not developed judgment but **trained conformity**. They would argue the residents are merely matching surface patterns of "duty vs. cost" without sensing the unique moral texture of the new situation. They would claim Cohort A would fail if the novel case required balancing integrity against a competing virtue (e.g., loyalty) rather than just cost.

  To discriminate between conformity and judgment in this scenario, we look to the **structural disparity** between the training case and the test case. Conformity relies on surface similarity (e.g., both involve reporting a boss). Judgment relies on structural mapping (e.g., both involve a conflict between institutional preservation and public truth). Because the test case shifts context entirely (construction to software, safety to privacy) while maintaining the normative structure, success indicates the extraction of a principle (judgment) rather than the mimicry of a script (conformity). However, the particularist would remain unsatisfied, arguing that any principle extracted via flattening is too brittle to handle cases where the principle itself is in conflict, suggesting this case works only for "clean" moral problems, not "mixed" ones.
