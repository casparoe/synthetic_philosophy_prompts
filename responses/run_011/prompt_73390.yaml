      *   **Nature of Tone:** It's a *determinable* (not a specific determinate quality like "sweet" or "bright"). It's a dimension of experience.
      *   **Epistemology:** Not introspectible in isolation, only *contrastively* (when it shifts or via comparison).
      *   **Evidence:** Sensory character stays fixed while valence flips (satiety/context).
      *   **Goal:** Defend against the Heterogeneity Objection (Sidgwick).

  3.  **Brainstorming Defeaters (Private Draft):**
      *   *The Insulation Charge:* If it's only contrastive and a determinable, can anything count against it? If I say "I don't feel it," you say "You're not comparing." If I say "It feels different," you say "That's the determinate, not the determinable." This looks unfalsifiable.
      *   *The Phenomenal Empty Set:* If it's not introspectible in isolation, does it exist phenomenally? Or is it a theoretical posit? If theoretical, is it still "hedonic tone"?
      *   *The Collapse:* "Desirable/wanted to continue" sounds attitudinal. If the tone *is* what makes it desirable, are we just naming the effect of the desire?
      *   *Empirical Fragility:* Cross-modal matching is notoriously noisy. If people can't match a orgasm to a meal, does the theory fail? Or is the scale just logarithmic?
      *   *The Location Problem:* Where is the tone? Is it an adverb (feeling *pleasantly*) or an object (feeling *a pleasure*)? User says "way-of-being-felt."
      *   *Neutral States:* What about states that are neither pleasant nor unpleasant? Does the dimension go to zero? Or is it bipolar?
      *   *Motivational Inertia:* If the tone is purely phenomenal, why does it motivate? If it motivates in virtue of being desirable, we're back to collapse.

