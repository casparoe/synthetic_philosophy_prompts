prompt: |-
  You're a value theorist who's spent years on the metaphysics of pleasure — think of yourself as the person in the room who has to defend a substantive view, not just map the options. Please actually think this through: start with a quick private brainstorm of every candidate defeater you can generate, then commit to an ordering. I want a definite verdict, not a menu.

  Here's the view I hold. Against the heterogeneity worry about pleasures — the classic pressure going back at least to Sidgwick that the cold-water-on-a-hot-day feeling, the feeling of a chord finally resolving, and the feeling of suddenly getting a proof have nothing introspectively in common, so "pleasure" can't name one simple feature of experience — I think all of those share a single hedonic tone. My gloss is specific though: the tone is a *determinable*, not a determinate. It's a dimension along which any experience can be scored, and it isn't introspectible in isolation, only contrastively — you catch it when it shifts, or when you compare two stretches of experience. So when critics say they can't find the common property, I say they're looking in the wrong category: they want a shared *look*, and there isn't one, but there is a shared way-of-being-felt. My best positive evidence is that the same sensory quality can flip from pleasant to unpleasant as satiety or context changes while the sensory character stays fixed — that seems to pull the tone apart from the vehicle it rides in.

  Three things I want pressure on:

  1. Rank the defeaters, fatal → merely awkward. Include whatever you think I've missed. Especially: the worry that "only introspectible contrastively" plus "it's a determinable" has insulated the view so thoroughly it can't lose. If it has, say so plainly, and tell me whether that's actually a defect for a view of this kind or a legitimate reflection of what the phenomenon is like.

  2. I take my view to have empirical teeth, and I want to know if that's right. I think it predicts that people can match the intensity of a taste pleasure against a music pleasure reasonably well, and that this matching capacity should survive damage that destroys specific sensory enjoyments (losing food pleasure through smell loss, say). So a real dissociation — matching intact while all the particular pleasures go, or the particulars intact while cross-kind matching goes — should count as evidence against me, not as noise. Does that hold up? And what does the tone view predict that attitudinal hedonism and desire-based accounts don't, in a way where the rivals could come out ahead?

  3. The collapse worry. The only non-circular way I can characterize the tone is as that in virtue of which a state is apprehended as desirable, or wanted to continue. That sounds like my "simple feature of experience" is just a propositional attitude or a conative state wearing a phenomenal costume. Is the collapse real? If it is, is it fatal, or is it a redescription that costs me nothing — and what would I have to be able to say about the tone that a pure attitudinal theorist can't, for the collapse to fail?

  Be committed. Tell me whether I should keep the view as stated, revise it in some specific direction you name, or drop it, and give the reasons you'd give a colleague who asked you straight. I'd rather have one clear call with its costs admitted than a balanced survey.
