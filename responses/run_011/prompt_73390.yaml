      *(Final Verdict Formulation)*: Revise. Keep the determinable metaphysics. Drop the "only contrastive" epistemology (it invites the insulation charge). Replace with "phenomenal polarity." Tighten the distinction from attitudinalism by focusing on the *direction of fit*.

