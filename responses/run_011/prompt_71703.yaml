  Imagine a specific person, Elena, who is currently a corporate lawyer with a very specific set of memories, habits, and personality traits. Consider the claim: "Even if Elena had been sent to art school at age five instead of regular school, growing up with a completely different set of friends, values, and memories, it would still be Elena." In this scenario, the causal chain of her biological existence remains unbroken—she comes from the same parents and the same birth event—but the qualitative result of her life is radically different. She is, for all intents and purposes, a different person psychologically, even though she is the same human organism.

  Kripke's theory of transworld identity says this claim is straightforwardly true. Because "Elena" is a rigid designator, it picks out the same individual in every possible world where she exists, regardless of what properties she has there. As long as the historical origin is the same, it is literally her. Lewis's counterpart theory, however, says the truth of this claim is unstable. For Lewis, whether the art-school individual counts as Elena's counterpart depends on how we weight similarity in context. If we prioritize psychological similarity, the counterpart relation fails, and the claim is false; if we prioritize biological origin, it is true. The theories come apart because Kripke guarantees an absolute truth value based on origin, while Lewis makes the truth value relative to which features we decide matter most in the conversation.

  The exact feature doing the work here is the radical divergence between biological continuity and qualitative similarity. Kripke ties identity to the former, while Lewis ties counterpart relations to a weighted mix of both. If you remove this feature and imagine a scenario where Elena goes to art school but remains psychologically mostly the same—same friends, same personality, just different classes—both theories agree the claim is true. The divergence only appears when the qualitative changes are severe enough to strain the similarity requirement that Lewis's theory relies on.

  A Lewisian would try to convince you that your intuition is confused by arguing that you are conflating "being the same person" with "being the same biological organism." They would say that when you insist "it is still Elena," you are really just saying "it is the same human body," but that isn't what matters for personal identity in a modal context. They would argue that if the psychology is totally different, nothing that matters for survival or responsibility has been preserved, so your strong intuition that it is "literally her" is just a linguistic habit, not a metaphysical fact. They want you to see that identity isn't what matters; what matters is the counterpart relation, and that relation is flexible, not absolute.
