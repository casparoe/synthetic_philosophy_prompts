      *   So (1) and (5) are incompatible given (3).
      *   The term **"Permissible"** is also slippery. In (1), only the *best* is permissible. In (5), there must be *at least one* permissible option. If the "best" is impossible to identify or achieve, (5) triggers.
      *   Actually, the strongest equivocation is between **"Morally Better"** (axiological ranking) and **"Morally Required"** (deontic status). Premise (1) assumes they map 1:1. That's the philosophical heavy lifting disguised as a premise.

  9.  **Final Polish:** Check against constraints. American English. Address all specific questions (which step to reject, price tagged, gap/invalidity, double duty term).

      *   *Step to Reject:* (1).
