      *   The user suspects a term switch. Where is it?
      *   Look at **"Wrong"** and **"Ought"**.
      *   In (1), "Wrong" means *sub-optimal*.
      *   In (5), "Wrong" implies *blameworthy* or *violating a binding constraint*.
      *   Look at **"Better"**.
      *   In (1), "Better" implies *morally required*.
      *   In (3), "Better" implies *more value produced*.
      *   *Crucial Switch:* The definition of **"Wrong"** (or "Obligatory").
      *   In Step (1), "Wrong" is defined relatively (less good = wrong).
      *   In Step (5), "Wrong" is defined structurally (requires a permissible alternative).
      *   If "Wrong" in (1) just means "not the best," then (5) doesn't necessarily apply in the same way. If "Wrong" in (5) means "blameworthy violation," then (1) is making a huge leap to call sub-optimal acts "wrong" in that sense.
