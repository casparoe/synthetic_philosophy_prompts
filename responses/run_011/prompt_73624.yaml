answer: |-
  This is a tight, classic formulation of the demandingness objection, and your suspicion is well-founded: the argument is logically valid *only if* specific terms remain univocal throughout. They do not. You have constructed a *reductio ad absurdum* against Maximizing Consequentialism, but you are treating it as a general problem for ethics.

  Here is the breakdown of where the chain snaps, the price of each repair, and the specific equivocation doing the heavy lifting.

  ### 1. The Equivocation: "Wrong" and "Better"

  Your vague suspicion is correct. Two terms are doing double duty, and the switch happens between **Step (1)** and **Step (5)**.

  *   **"Morally Better" (Steps 1–3):** Here, "better" is **axiological**. It refers to the amount of good produced or the ranking of states of affairs. In this sense, jumping on the grenade produces more "good" (lives saved) than not jumping.
  *   **"Wrong" (Steps 1–4 vs. 5–6):**
      *   In **Steps (1) through (4)**, "wrong" functions as **"sub-optimal."** It means *not the best available option*.
      *   In **Step (5)**, "wrong" functions as **"forbidden" or "culpable."** It implies a violation of a binding constraint that attracts blame or requires avoidance.

  **The Switch:** Premise (1) smuggles in the claim that *axiological inferiority* equals *deontic forbiddenness*. It assumes that if Act A produces more value than Act B, Act B is forbidden. Most ethical systems (virtue ethics, contractualism, threshold deontology) reject this mapping. They argue that "better" and "required" come apart.

  By Step (5), you are using "wrong" in the strong sense (forbidden/culpable) to demand avoidability. But Step (1) generated "wrongness" using the weak sense (sub-optimal). You cannot use the avoidability constraint (5) to collapse the system if the "wrongness" generated in (4) is merely "sub-optimality." Sub-optimality does not require a permissible alternative to exist; it just requires a better alternative to exist.

  ### 2. The Validity Gap

  There is a gap between **(1)** and **(2)**.

  Premise (1) states: *If A > B, then doing B is wrong.*
  This is not a logical truth; it is a substantive ethical claim (Maximizing Consequentialism). It looks innocent because it mimics rational choice theory (if you want to maximize utility, choose the max), but ethics is not merely rational choice.

  The argument is valid *if* you accept (1). But (1) is the exact point in dispute. The argument doesn't prove supererogation is unstable; it proves that **Maximizing Consequentialism is incompatible with the Principle of Avoidability (5).** Since most people reject Maximizing Consequentialism precisely because it eliminates supererogation, your group members who think you made a mistake are likely reacting to the fact that you've baked the conclusion into Premise (1).

  ### 3. Price Tag on Dropping Premises

  You asked for the cost of rejecting the key candidates. Here is the invoice:

  **Option A: Drop (1) — "Betterness implies Wrongness"**
  *   **The Move:** You accept that an act can be morally better than another without the lesser act being wrong. This creates room for supererogation.
  *   **The Price:** You lose the simple bridge from value to obligation. You can no longer explain the Shallow Pond case simply by saying "Saving the toddler is better." You must now defend a **threshold**. You have to explain *why* wading in is obligatory but jumping on the grenade is not. You incur the debt of defining where the line between "duty" and "saintliness" is drawn.
  *   **Verdict:** This is the standard move. It saves common-sense morality but requires a more complex theory (e.g., Satisficing Consequentialism or Threshold Deontology).

  **Option B: Drop (3) — "Beneficence has no ceiling"**
  *   **The Move:** You argue there is a limit to how much good you are required to do. Once you hit the limit, doing more is not "better" in the sense of obligation, or perhaps not "better" in a morally relevant sense at all.
  *   **The Price:** You must defend the ceiling. Why does saving one more life not matter morally after point X? This invites the "arbitrary line" objection. If saving a child is good, why isn't saving two children better *and required*?
  *   **Verdict:** This often collapses into Option A. Denying (3) usually means denying that the "betterness" in (3) translates to the "obligation" in (1).

  **Option C: Drop (5) — "Wrongness has to be avoidable"**
  *   **The Move:** You accept moral dilemmas where every option is wrong (tragic choices), or you accept that agents are perpetually blameworthy (moral tyranny).
  *   **The Price:** You destroy the action-guiding nature of morality. If everything I do is wrong, morality ceases to function as a guide and becomes merely a measure of failure. This leads to moral paralysis or nihilism.
  *   **Verdict:** Too high a price. Most ethicists keep (5) (or a version of "Ought Implies Can").

  ### 4. Saving the Shallow Pond (Without Premise 1)

  You are worried that dropping (1) leaves you unable to condemn the person strolling past the shallow pond. You ask: *"I'm explaining the pond case with what, a threshold that I'd have to defend from scratch?"*

  Yes, exactly. But this is not a bug; it's the feature.

  If you drop (1), you distinguish between **Duty** and **Value**.
  *   **The Pond:** Wading in is *required* because the cost to you (muddy clothes, minor inconvenience) is below the threshold of sacrifice that morality demands. The "betterness" of saving the life crosses the threshold of obligation.
  *   **The Grenade:** Jumping is *better*, but the cost to you (your life) exceeds the threshold of obligation. Therefore, it is not required.

  You do not need Premise (1) to explain the Pond. You only need the claim that **"When the cost is low and the benefit is high, the better act becomes obligatory."** This allows you to keep the Pond intuition without accepting the Grenade obligation.

  ### 5. Regarding Blameworthiness and Step (5)

  You noted: *"I'm not sure (5) survives contact with the fact that people who believe in supererogation are perfectly happy to wedge wrongness apart from blameworthiness in the other direction."*

  This is a crucial distinction. Supererogationists separate **Wrongness** from **Blame** (e.g., "It was wrong, but you weren't blameworthy due to duress").
  However, Premise (5) is not about blame; it is about **logical coherence**. It claims that for the label "wrong" to have meaning, there must be a contrasting label "permissible." If *everything* is wrong, the distinction vanishes.

  If you keep (1) and (3), you force (5) to break. But since (5) is a structural requirement for moral language to work, and (1) is merely a specific ethical theory, (1) is the one that must go.

  ### Recommendation for the Group

  Tell your group the argument is sound but unsound. It is **valid** (the steps follow), but **unsound** (Premise 1 is false).

  1.  **Reject (1).** Betterness does not entail obligation.
  2.  **Accept the Price.** You must now defend a **Threshold View**.
  3.  **Fix the Pond.** Explain the Pond case not as "Better = Duty," but as "Low Cost + High Benefit = Duty." Explain the Grenade case as "Infinite Cost + High Benefit = Supererogatory."

  The instability you found isn't in the concept of supererogation; it's in the attempt to reduce all morality to a single maximizing metric. The "third option" you couldn't find is **Deontic Constraints**. You can acknowledge that A is better than B without acknowledging that B is forbidden. That is the entire logical space where supererogation lives.
