  4.  **Evaluate the "Price" of Dropping Premises:**

      *   **Drop (1):** *Price:* You lose the simple bridge from value to obligation. You need a new theory (thresholds, satisficing, contractualism) to explain the Shallow Pond. You admit supererogation exists.
      *   **Drop (3):** *Price:* You must define a limit to beneficence. Where does the duty stop? This is the "demandingness objection" solution. You save common sense morality but need to justify the cutoff.
      *   **Drop (5):** *Price:* You accept moral dilemmas where every option is wrong (tragic choices) or you accept that agents are always blameworthy (moral tyranny). This is a hard pill to swallow for most ethical systems.
      *   **Drop (2)'s inference:** *Price:* You admit the Grenade case is supererogatory, which means (1) is false immediately.

  5.  **Address the Validity/Gap:**
