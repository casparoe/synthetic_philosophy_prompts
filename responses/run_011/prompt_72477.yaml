answer: |-
  ### Judgment on Survival
  **The position does not survive.**

  It is a compelling moral critique but a legally incoherent proposal. It collapses on two specific technical grounds that create immediate impunity gaps, and it relies on a separation between "legal" and "moral" categories that history shows is unsustainable. You have correctly identified the bureaucratic pathologies of the Genocide Convention (the "semantic fighting," the high bar for *dolus specialis*), but your solution removes the only legal hooks that currently force state action *before* mass killing begins and covers small-scale group destruction that Crimes Against Humanity (CAH) cannot reach.

  Here is the map of your position's exposure, ranked from fatal to inconvenient.

  ---

  ### I. Fatal Defeaters (Structural Collapse)
  *These are not matters of degree; they are binary legal realities where your proposal creates immediate, unfillable loopholes.*

  **1. The Threshold Gap (Widespread/Systematic vs. Specific Intent)**
  *   **The Fact:** Crimes Against Humanity require a "widespread or systematic attack directed against any civilian population." Genocide does not. Genocide requires specific intent to destroy a group, but it can be committed by a single actor against a single victim if the intent is linked to the group's destruction (though in practice, it usually implies more).
  *   **The Exposure:** A state could intentionally destroy a specific religious minority in a single region (e.g., a specific valley or city) without meeting the "widespread or systematic" threshold required for CAH. Under your regime, this is no longer an international crime. You have legalized the localized extermination of groups provided it isn't "widespread" enough to qualify as CAH.
  *   **Why Fatal:** It creates a literal impunity gap. Your proposal predicts *more* accountability; the law dictates *less* for localized group destruction.

  **2. The Preventive Obligation (State Responsibility vs. Individual Liability)**
  *   **The Fact:** The Genocide Convention imposes a duty on *States* to prevent genocide (Article I). This was confirmed by the ICJ in *Bosnia and Herzegovina v. Serbia and Montenegro* (2007). Serbia was found to have violated the duty to prevent genocide even though it was not found to have committed genocide itself. There is no equivalent customary or treaty-based duty to prevent Crimes Against Humanity that carries the same interstate justiciability.
  *   **The Exposure:** Your proposal moves prosecution to CAH. CAH is primarily a regime of *individual* criminal responsibility (ICC, tribunals). It lacks the *interstate* enforcement mechanism of the Genocide Convention. By retiring genocide, you remove the only legal lever one state has to sue another for *failing to stop* atrocities before they peak.
  *   **Why Fatal:** You argue officials fight the word to avoid the duty. True. But if you remove the word, you remove the duty entirely. The "prevention trap" becomes a "prevention vacuum."

  ---

  ### II. Severe Defeaters (Conceptual & Functional Failure)
  *These do not necessarily create immediate loopholes but undermine the core logic of the proposal.*

  **3. The Ontological Mismatch (Individual vs. Group)**
  *   **The Fact:** CAH protects *individuals* within a population. Genocide protects the *group* as a distinct entity.
  *   **The Exposure:** If the harm being punished is the destruction of a human group's existence (a collective right), charging CAH misdescribes the crime. It is like charging a murderer with "assault" because both involve violence. The victim of genocide is the group; the victim of CAH is the individual.
  *   **Why Severe:** It renders the law philosophically blind to the specific harm you claim to care about (the "Lemkin-style idea of destroying a group's pattern of life"). You cannot protect the group by charging crimes against individuals.

  **4. The Moral-Legal Feedback Loop**
  *   **The Fact:** Legal categories shape moral intuition. When the law stops using a term, public morality rarely retains it with the same force (e.g., "treason," "piracy").
  *   **The Exposure:** You propose keeping "genocide" as a moral/sociological category while retiring the legal one. This is unstable. If the ICC and ICJ stop using the word, the media and diplomats will follow. The "moral" category will atrophy because it loses its institutional enforcement mechanism.
  *   **Why Severe:** Your proposal relies on the moral term retaining its power *after* you strip it of its legal teeth. History suggests the opposite happens: the legal definition anchors the moral one.

  ---

  ### III. Awkward Defeaters (Empirical Risks)
  *These are contingent on political behavior and could be argued either way, but they weigh heavily against you.*

  **5. The Mobilization Deficit**
  *   **The Fact:** "Genocide" triggers a specific public and diplomatic response that "Crimes Against Humanity" does not. "CAH" is viewed as bureaucratic; "Genocide" is viewed as existential.
  *   **The Exposure:** If you switch to CAH, you may reduce the "semantic fighting" you dislike, but you also reduce the public pressure that sometimes forces intervention. The "hierarchy of victimhood" you decry is unfortunately the same hierarchy that mobilizes NATO or UN peacekeepers.
  *   **Why Awkward:** You might achieve efficiency (fewer court arguments) at the cost of efficacy (less political will to act). This is a trade-off, not a falsification, but it undermines your claim that the alternative "delivers" better.

  **6. The Cultural Genocide Loss**
  *   **The Fact:** The original Lemkin concept included cultural destruction. The Convention narrowed it.
  *   **The Exposure:** Activists currently use the *legal* term "genocide" to fight for the inclusion of cultural destruction (e.g., residential schools, language bans). If you retire the legal category, you kill the ongoing political struggle to expand the legal definition back toward Lemkin's vision.
  *   **Why Awkward:** You surrender the battlefield where the definition could potentially be improved, opting instead to abandon the terrain.

  ---

  ### IV. Inconvenient Defeaters (Policy Preferences)
  *These are points where your view is plausible but not demonstrably superior.*

  **7. Litigation Complexity**
  *   **The Fact:** Genocide convictions are rare and slow (e.g., Karadžić, Mladić).
  *   **The Exposure:** Defenders argue this is a feature, not a bug. The "crime of crimes" should have the highest bar. CAH convictions are indeed faster, but they carry less stigma.
  *   **Why Inconvenient:** This is a matter of taste. You value speed/inclusivity; defenders value stigma/precision. Neither side is empirically "wrong" here, but it doesn't save your position from the Fatal Defeaters above.

  ---

  ### V. Falsifiable Predictions (Where the Views Diverge)
  *To test your position against a defender's, look for these specific outcomes:*

  1.  **The "Small-Scale" Test:** If a state systematically kills 500 members of a specific religious sect in one town with stated intent to remove the sect from that area, but does not attack other groups:
      *   **Defender:** This is Genocide (intent to destroy part of the group).
      *   **You:** This is likely not CAH (not "widespread" enough).
      *   **Falsification:** If this scenario goes unpunished under your regime, your claim that CAH "reaches" the same conduct is false.

  2.  **The "Prevention" Test:** If State A knows State B is preparing to exterminate a minority but has not yet started:
      *   **Defender:** State A can sue State B at the ICJ for violating the duty to prevent Genocide (provisional measures).
      *   **You:** No standing. CAH has not yet occurred (no widespread attack), and there is no duty to prevent CAH.
      *   **Falsification:** If intervention occurs *later* than it would have under the Genocide Convention due to lack of early legal leverage, your claim that diplomacy runs "sooner" is false.

  3.  **The "Stigma" Test:**
      *   **Prediction:** Convictions for CAH will not generate the same reparations or institutional reform as Genocide findings.
      *   **Falsification:** If CAH convictions begin to trigger the same level of state responsibility and reparations as Genocide findings (e.g., *Bosnia v. Serbia*), your distinction collapses. Currently, they do not.

  ---

  ### VI. Coherence Check: Is the Proposal Itself Mistaken?
  **Yes. The framing assumes a flexibility in international law that does not exist.**

  1.  **You cannot "retire" a Treaty Category unilaterally.** The Genocide Convention is ratified by 150+ states. To "retire" it, you need to amend the treaty or withdraw. Withdrawal creates a vacuum; amendment is impossible (unanimity required). Your proposal assumes a transition mechanism that isn't there. You are effectively arguing for *non-enforcement* of an existing treaty, which undermines the rule of law itself.
  2.  **The "Moral vs. Legal" Split is Artificial.** You argue to keep the moral concept. But the moral concept gained its power *from* the legal codification. Before 1948, "genocide" was a descriptive term coined by Lemkin. It became a mobilizing force *because* it was criminalized. Decoupling them assumes the moral term can survive the death of the legal one. Given that "genocide" is now legally defined by the Convention, retiring the legal definition invites chaos over what the "moral" definition even means (e.g., is Gaza genocide? Is Xinjiang genocide?). The legal definition, for all its flaws, anchors the debate. Removing it invites *more* semantic fighting, not less.

  ### Final Verdict
  Your position identifies real pathologies (the "prevention trap," the difficulty of *dolus specialis*). However, it prescribes a cure that kills the patient. By moving to Crimes Against Humanity, you lose the **duty to prevent** (the only tool for early intervention) and the **capacity to prosecute localized group destruction** (the threshold gap).

  A serious proponent of your view must concede that **localized extermination would become legally unpunishable** and **interstate prevention suits would become impossible.** If you absorb these concessions by saying "CAH will be expanded to cover those," you are no longer arguing to retire Genocide; you are arguing to *amend* CAH to *become* Genocide without the name. If you admit the gaps remain, the position is fatal to the victims it claims to protect.
