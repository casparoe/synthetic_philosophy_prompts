      *   *Objection B: The Stigma/Mobilization.* "Genocide" triggers public outrage and international intervention in a way "CAH" does not. Retiring it might reduce political will to act.
      *   *Objection C: Group Protection.* CAH protects individuals *within* a context of widespread attack. Genocide protects the *group* as an entity. This is an ontological difference. If the harm is the destruction of the group *as such*, CAH misses the specific victim (the collective).
