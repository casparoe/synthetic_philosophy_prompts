          2.  **The Preventive Obligation (ICJ Bosnia v. Serbia).** Only Genocide carries a distinct duty to prevent enforceable at the ICJ between states. CAH is largely individual criminal responsibility. Retiring Genocide removes state responsibility for prevention. -> **FATAL.**
