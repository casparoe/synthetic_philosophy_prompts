prompt: |-
  I'm about halfway thru a law-and-philosophy seminar and we just did the old British exchange that started with the Wolfenden Report in the fifties — Devlin, the judge, arguing that a society is entitled to use the law to hold its common morality in place, and Hart pushing back that this either collapses into policing whatever the majority happens to dislike or rests on big empirical claims about what moral drift does to a society that were never actually supported. My group re-litigates the whole thing every single week and I've decided the argument everyone's really having is much narrower than the one they think they're having, and nobody has bothered to state it precisely. So I want your credence on a specific proposition, not a recap of the debate. Call it (D): when a society's shared moral norms change drastically, something can go wrong for the society as such — a harm that isn't just the sum or aggregate of harms to the individual people in it, and isn't merely a prediction that those people will end up worse off later. My claim is that (D) is the load-bearing piece of Devlin's position if it isn't going to reduce to an instrumental story about coordination and trust, and it's the piece Hart's objections mostly walk right past.

  Give me a number on (D) and show me the decomposition. Terms I'd expect, though add or drop as you see fit: (i) whether collectives can be bearers of harm or flourishing over and above their members at all, in any domain, not just the morality one — if you think a university or a team or a firm can be made worse off in a way that isn't reducible to how its members fare, that should push (i) up; (ii) whether a society has identity conditions over time such that saying it has ceased to exist is a genuinely different claim from saying different norms now prevail in the same place among overlapping people, i.e. whether harm-to-society talk is secretly a Ship of Theseus problem dressed up as political theory; (iii) whether there is any such thing as one shared morality in a large pluralistic modern society, or whether that phrase always just picks out the norms of whichever faction is currently loudest — in which case (D) might come out true but be useless to Devlin, since the entity supposedly being harmed keeps changing referent; (iv) how much of the intuitive pull of (D) is really the empirical prediction that normative drift destabilizes institutions, and whether that prediction's truth or falsity changes anything about (D) as a conceptual matter or just changes its stakes; and (v) whether the instrumental version — moral consensus generates generalized trust, trust is what lets strangers cooperate cheaply, so dissolving the consensus predictably makes members worse off — would already get Devlin his conclusion without (D), which would mean (D) can be false and he still wins the practical argument. Probability and a line or two of justification for each, how they combine into your bottom line on (D), which term your bottom line is most sensitive to, and what sort of argument or evidence would move that term.

  Two more things. My credence in (D) is around 0.25 and my seminar partner's is around 0.6, and we have never managed to locate where the gap is — we argue for an hour and end up agreeing on almost every sub-claim, so tell me which of the above you think we're actually disagreeing about. And if you think (D) is ambiguous between readings, say a reductionist social ontology versus a non-reductionist one, tell me explicitly which reading you're scoring before you commit to a number, because I suspect half the seminar is scoring one and half is scoring the other. American English please, and skip the reading list or citations at the end — I'm not chasing anything down, I just want the numbers and the reasoning that produces them.
