  *(Self-Correction on the "Deflationary Take"):* The colleague says the fence is just a burden-shifting rule. If so, the villagers are in compliance *unless* someone challenges them. But no one challenges them effectively until Tessie (too late). So the rule works procedurally but fails substantively. The story shows the *danger* of a purely procedural conservatism without substantive memory.

