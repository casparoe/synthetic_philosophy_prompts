      *   *Check:* Tessie's objection.
      *   *Nuance:* Her objection is "procedural fairness," which sounds liberal, but in context, it's an appeal to the *rules of the tradition*. So it *is* internal. But it reveals the tradition has no moral core, only mechanics.
