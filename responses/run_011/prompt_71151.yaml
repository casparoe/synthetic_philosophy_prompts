  **Vignettes (Strongest Case Attempt)**

  **Case A:**
  The VP of Engineering is contractually required to deploy the security patch by Friday. She knows deployment will certainly speed up legacy modules. She doesn't care about speed; she just wants to meet the requirement. She deploys the patch. The modules speed up.

  **Case B:**
  The VP of Engineering is contractually required to deploy the security patch by Friday. She knows deployment will certainly slow down legacy modules. She doesn't care about speed; she just wants to meet the requirement. She deploys the patch. The modules slow down.

  **Design Analysis**

  **Conclusion on Reversal:** A genuine reversal under your strict constraints is **unattainable**. The "Knobe Effect" (asymmetry) is robust when valence is the only variable. To shift the intuition toward "Good=Intentional, Bad=Not," we must introduce a second variable: **Normative Requirement**. In the vignettes above, the primary action is obligatory, not discretionary.

  **Manipulated Variable:** **Normative Status of the Primary Action** (Obligatory vs. Discretionary). While the vignettes differ in valence (Good/Bad side effect), the reversal mechanism relies on the *obligatory* context compared to the standard discretionary CEO case.

  **Mechanism:** When an action is required, observers treat negative side effects as unfortunate costs of compliance (less intentional) and positive side effects as successful fulfillment of duty (more intentional). This shifts the baseline for what counts as "doing something on purpose."

  **Evaluation of Accounts:**
  1.  **Moral Work View:** Struggles here. If "intentional" just means "blameworthy," the VP shouldn't be blamed for the harm (since she was required to act), so intentionality drops. This fits the reversal but implies the word's meaning shifts with context.
  2.  **Attitude Endorsement View:** Fares well. Observers infer that a compliant agent "identifies" with the required outcome (help) but disavows the unavoidable cost (harm), even if stated indifference is identical.
  3.  **Pragmatic Artifact View:** Fares best. The question "Did she do it intentionally?" pragmatically asks "Is she responsible?" In the obligatory case, responsibility for harm is mitigated, while credit for help is retained.

  **Weighted Feature & Constraint Block:**
  The feature carrying the weight is **Normative Requirement**. If you delete it (returning to a discretionary decision), the standard asymmetry returns immediately. The constraint that blocks a *pure* reversal (using valence alone) is **Indifference**. To get a full reversal, observers must infer the agent *cares* about the good outcome (violating indifference) or sees the bad outcome as *accidental* (violating foresight/causal contribution).

  **The Blame-Driven Attack:**
  A theorist convinced the asymmetry is purely blame-driven would attack these vignettes by arguing that observers are not actually judging *intentionality*, but rather *excuses*. They would say: "In Case B, people say 'not intentional' not because they believe the causal story changed, but because they are searching for a way to avoid blaming the VP for following orders. The descriptive judgment is still hijacked by the desire to withhold blame."
