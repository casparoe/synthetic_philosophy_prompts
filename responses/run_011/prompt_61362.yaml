  ### Verdicts on Test Cases

  **Case 1: 1000 Trials (Survival Weight $\approx 10^{-3000}$)**
  *   **Verdict:** **Do Not Run.**
  *   **Commitments at Work:** (iv) Decision Theory, (vi) Deprivation, (Revised) Measure-Based Concern.
  *   **Reasoning:** The squared-amplitude-weighted average of outcomes is catastrophically negative. Almost all measure of your future existence ends in deprivation.
  *   **Consistency:** Consistent only if (iii) is abandoned. Under (iii), you should be indifferent to the number of trials (since you survive on *some* branch and care equally), which contradicts (iv).

  **Case 2: Neurological Damage (0.98 Weight on "Life Not Worth Living")**
  *   **Verdict:** **Do Not Run.**
  *   **Commitments at Work:** (iv) Decision Theory, (vi) Deprivation.
  *   **Reasoning:** The high-weight branch contains a successor whose life is a net negative. The low-weight branch of unimpaired survival does not outweigh the disutility of the high-weight branch when weighted by amplitude.
  *   **Consistency:** Consistent only if (iii) is abandoned. Under (iii), the 0.98 weight is irrelevant; you should focus only on the fact that *a* successor survives unimpaired. This again contradicts (iv).

  **Mutual Consistency:**
  The two verdicts are **mutually consistent** only on the revised package (dropping (iii)). On the original package, the verdicts are unstable: (iii) pushes toward acceptance (someone survives!), while (iv) pushes toward rejection (weighted utility is low). You cannot hold both verdicts firmly without resolving the (iii)/(iv) conflict.

  ### Final Diagnosis

  Your colleague was correct: the position is incoherent. Specifically, it attempts to combine a **Parfitian metaphysics** (ii) with a **Cartesian phenomenology** (vii), and an **Egalitarian ethics** (iii) with a **Weighted decision theory** (iv).

  To save the workshop statement:
  1.  **Delete (iii).** Replace with: "Prudential concern is rationally constrained to track squared amplitude."
  2.  **Qualify (vii).** Change "I find the quantum-suicide argument cogent" to "I acknowledge the phenomenological pull of the quantum-suicide argument, but regard it as metaphysically mistaken given (ii)."
  3.  **Keep (viii).** With (iii) removed, the parity claim is robust.

  This yields a defensible, standard "Oxford Everettian" position: Realism about branches, Reductionism about identity, and Decision-Theoretic derivation of probability. It sacrifices the "immortality" and "egalitarian" intuitions, but these are the very intuitions that render the package incoherent.
