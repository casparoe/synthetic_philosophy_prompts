answer: |-
  **Common Substrate:** All worlds share a 1D deterministic cellular automaton (CA) with local update rule $R$. An embedded observer $O$ (a localized pattern) must decide at time $t$ whether to close a valve. A predictor $D$ (another pattern) computes $O$'s future state. Physics is classical; no quantum noise or exotic causality.

  **W1 (Diagonal):** Dynamics are computationally feasible (polynomial time). $D$'s output is causally available to $O$ before $t$. $O$ is disposed to act on best available information. If $D$ predicts "Close," $O$ reads this, updating her internal state to include knowledge of the prediction. $D$'s prediction was based on $O$'s pre-reading state. Since $O$'s post-reading state differs, the prediction is falsified. To correct this, $D$ must predict $O$ reading the prediction, requiring $D$ to simulate itself outputting the prediction to $O$. This generates a causal loop: $D$'s output determines $O$'s input, which determines $O$'s action, which $D$ must predict. No stable fixed point exists for the content of the prediction. Prediction fails not due to resource limits, but because the prediction's availability alters the truth conditions it attempts to capture.

  **W2 (Intractable):** Dynamics follow a rule where predicting the state at step $t$ is PSPACE-complete relative to lattice size $N$. We set $t = 2^N$. $O$ is physically bounded to polynomial-time computation relative to $N$. $D$'s output is available, but generating it requires exponential steps. $O$ cannot verify or utilize the prediction before $t$ arrives because the computation physically cannot complete within the light-cone of the event. The obstacle is resource scarcity, not logical inconsistency. The dynamics are deterministic and non-chaotic (no sensitivity to initial conditions), but computationally irreducible; no shortcut exists to skip intermediate steps. Prediction fails because the universe computes the future slower than $O$ can simulate it.

  **W3 (Undecidable):** Dynamics are feasible (as in W1). However, the initial condition encodes a non-computable real number (e.g., bits of Chaitin's constant) determining a critical boundary value. Predicting $O$'s action requires knowing this value. No Turing-equivalent device can compute it. $D$'s output is sealed until after $t$, preventing $O$ from accessing the undecidable data to alter behavior. The obstacle is mathematical undecidability rooted in the state, not the law. $O$ cannot predict the event even in principle, as the required information is not algorithmically extractable from the initial data. Prediction fails due to limits of computability, not causality or resources.

  **W4 (Control):** Dynamics are feasible (as in W1). $D$'s output is sealed until after $t$. $O$ acts without knowledge of $D$'s prediction. $D$ simulates $O$'s deterministic evolution without $O$ simulating $D$. No causal loop arises; no resource bound is exceeded; no non-computable data is required. $D$ successfully outputs $O$'s action before $t$, verified afterwards. This world demonstrates that prediction is possible in this substrate when diagonalization, intractability, and undecidability are absent.

  **1. Obstacle Isolation:** In W1, intractability is absent (dynamics are feasible) and undecidability is absent (laws and states are computable); failure arises solely from the causal feedback of the prediction. In W2, diagonalization is unavailable because $O$ cannot finish the computation to react to it; the prediction arrives too late to influence the decision loop. Undecidability is absent; the task is computable but hard. In W3, diagonalization is blocked by the seal; intractability is absent (dynamics are simple); failure is purely due to the non-computable initial condition.

  **2. Feature Removal:** In W1, sealing the output collapses it to W4; prediction succeeds, showing the obstacle was causal access. In W2, reducing complexity to polynomial collapses it to W4; prediction succeeds, showing the obstacle was resource bounds. In W3, making the initial condition computable collapses it to W4; prediction succeeds. The philosophical point survives only if the removed feature is metaphysically significant, not just practical.

  **3. Matching Objection:** The sealed-versus-available slot is a causal difference (information flow), so the worlds are not physically identical. This is conceded. However, the variation is innocent regarding the *source* of unpredictability. We hold the substrate constant to isolate whether unpredictability stems from logic (W1), resources (W2), or math (W3). The causal difference is the independent variable testing the "openness" mechanism, not a confound.

  **4. Attack on W2:** A defender of indeterminism-only will argue W2's openness is merely epistemic: the future is settled, $O$ just can't know it. The world is still a block universe.
  **Reply:** If "settled" implies "accessible to determination from within," W2 shows determinism does not guarantee settledness. If the physical process *is* the computation, and no subsystem can compress it, the future is not "already there" for the agent. Functional openness mimics metaphysical openness for any embedded entity.

  **5. Assessment:** W2 does the most work. W1 is a logical curiosity about self-reference; W3 relies on physically dubious non-computable states. W2 shows that even with feasible laws and computable states, deterministic physics can enforce unpredictability via complexity. This suggests "openness" need not require indeterminism, but rather computational irreducibility relative to the observer. However, this secures only functional openness, not the metaphysical variety required for libertarian free will. The case shows determinism is compatible with a robust, non-epistemic inability to know the future, but not necessarily with an unsettled future.
