      *   *Sentence 3:* "Two research groups showed that no risk score can be fair, once fairness is spelled out in the three ways that matter..."
          *   *Assessment:* Refers to the Impossibility Theorem. "No risk score can be fair" is a strong simplification. It should be "cannot satisfy *all three* definitions simultaneously."
      *   *Sentence 4:* "...that a score means the same thing no matter who receives it (equal false-positive and false-negative rates across groups)..."
          *   *Assessment:* This is **Error Rate Balance** (Equalized Odds). The gloss is mostly right, though "means the same thing" is vague.
      *   *Sentence 5:* "...that a score tells the truth about the individual it is attached to (calibration)..."
          *   *Assessment:* This is **Calibration**. The gloss is acceptable.
      *   *Sentence 6:* "...and that people who actually go on to reoffend receive the same average score whichever group they belong to."
          *   *Assessment:* This is **Balance for Positive Class** (a component of Error Rate Balance/Equalized Odds). Wait, let's look closer. The standard theorem usually contrasts *Calibration* vs. *Error Rate Balance* (which includes FPR/FNR parity). The text lists three things: 1. FPR/FNR parity, 2. Calibration, 3. Mean score for positives parity.
          *   *Technical Check:* Chouldechova (2017) shows Calibration + Error Rate Balance (FPR/FNR) is impossible if base rates differ. Kleinberg et al. (2016) show Calibration + Balance for Positive/Negative Classes is impossible. The text mixes these slightly. Specifically, if you have Calibration and FPR/FNR parity, you generally imply the third condition automatically under certain constraints, or the third condition is redundant/overlapping.
          *   *Critique:* The text lists three conditions as if they are independent axes. In reality, it's usually a trade-off between *Calibration* and *Error Rate Parity*. The third condition listed ("people who actually go on to reoffend receive the same average score") is essentially part of the error rate parity family (specifically related to recall/true positive rate).
          *   *Verdict:* Slightly muddled presentation of the mathematical conditions, but captures the spirit.
      *   *Sentence 7:* "These three requirements cannot all be met at once unless the two groups have identical rates of reoffending to begin with, or unless the score predicts perfectly..."
          *   *Assessment:* **Accurate.** These are the two mathematical exceptions (Equal Base Rates or Perfect Prediction/AUC=1).
      *   *Sentence 8:* "...and perfect prediction is a fantasy, while identical base rates would require that we had already eliminated the injustice producing the gap."
          *   *Assessment:* **Interpretive/Political.** Mathematically true that these are the exceptions. The claim about "injustice producing the gap" is a sociological claim, not a mathematical one, though widely accepted in this context.
      *   *Sentence 9:* "Because every real dataset is a record of a discriminatory society, no algorithm trained on one can ever be fair, and neither can the judge who relies on it."
          *   *Assessment:* **Overreach.** The theorem says you can't satisfy *all three definitions*. It does not say "no algorithm can ever be fair." It says you must *choose* which definition of fairness to prioritize. Also, "neither can the judge" is a normative leap, not a mathematical result.
      *   *Sentence 10:* "What the theorem settles, then, is that fairness here is not a technical property to be achieved but a political choice to be made..."
          *   *Assessment:* **Valid Conclusion.** This is the main takeaway accepted by most experts.
      *   *Sentence 11:* "...the honest conclusion is to stop presenting risk scores as objective, and in domains like pretrial detention, to stop using them."
          *   *Assessment:* **Policy Leap.** The math says "you can't have it all." It does *not* mathematically prove "stop using them." That is a policy decision based on the math + values.

