answer: |-
  # The Hard Date

  The projector fan hummed like a trapped insect, a steady whine beneath the silence of the conference room. It was 11:40 PM. The Chronology Interchange Format release candidate v4.2 was due at midnight.

  On the screen, a line graph crawled across the whiteboard. Three lines, colored red, blue, and green, representing the start and end dates of the European tripartite scheme as computed by the corpus usage algorithm over the last four cycles.

  "They're meeting," Kenji said. He was the junior data analyst, sitting with his laptop closed, hands flat on the table. "Look at the convergence."

  Elias, the schema maintainer, leaned forward. He wore a grey hoodie that had seen better decades. "Sampling bias," he said. "Digitization projects favor recent centuries. The algorithm sees more text from 1900 onwards, so it pushes the boundaries toward the noise."

  "It's not noise," said Dr. Aris. She was the medievalist, appointed to the working group to ensure historical fidelity. She hadn't taken off her coat. "It's feedback. The labels describe the describers. Every five years we update the standard, the usage shifts to match the standard, and the standard updates to match the usage. We are tightening the noose around the present."

  Sarah, the chair, rubbed her temples. "Kenji, run the projection again. Five cycles out."

  Kenji tapped a key. The lines on the graph extended. The red line (Middle Ages) retreated backward. The blue line (Renaissance) swollen, pushed forward. The green line (Scientific Revolution) expanded in both directions.

  "In cycle 9," Kenji said, his voice quiet, "the start date of the Middle Ages is 2028."

  The hum of the projector seemed to grow louder.

  "That's impossible," Elias said. "That's after the consortium was founded."

  "That's the point," Aris said. "The period isn't a container. It's a mirror. We're building a system where the past begins only when we say it does."

  Sarah looked at the clock. 11:52 PM. "We need integers. The downstream systems won't accept ranges. They won't accept confidence intervals. They want `start_year` and `end_year`. If we don't give them integers, the legacy migration scripts will hallucinate them."

  "And if we give them integers," Aris said, "we lie. We take a fuzzy boundary that shifts depending on whether you're tracking grain prices or sonnet forms, and we hammer it into a wall."

  "We hammer it so the search engine doesn't crash," Elias said. "Last cycle, we left the Scientific Revolution start date null. Do you know what the default was?"

  "1900," Kenji said.

  "1900," Elias repeated. "Every paper on Copernicus got filed under 'Modern Politics'. The index broke. I had to spend three weeks writing patch scripts. If the standard declines to supply a number, the downstream systems will quietly invent one. I would rather they invent a wrong number that we chose than a wrong number they guessed."

  Elias was right. They all knew it. The silence stretched.

  "Deprecation queue," Sarah said. "Aris, you wanted to flag 'Middle Ages' for deletion."

  "I want to deprecate the term," Aris said. "It was coined by a man standing on the far side of the gap he was naming. He needed a dark space behind him to make his own light look brighter. We shouldn't be encoding his vanity into the infrastructure."

  "If you deprecate the term," Elias said, "the migration script maps every instance of 'Middle Ages' to 'Pre-Modern Era'. But it carries the same years. The boundary doesn't disappear. It just loses the label. What began as an opinion hardens into infrastructure. Nobody knows why the wall is there, they just know they can't climb it."

  "Then move the wall," Aris said.

  "Where?" Elias snapped. "1453? 1492? 1517? Pick one. But pick an integer."

  Aris looked at the graph. The lines were converging on them. "If we pick 1453, we break the Kyoto archive mapping. Their Edo periodization overlaps with our 'Early Modern'. If we shift the CIF boundary to match the usage data, we clip their collection."

  "The CIF is a global standard," Elias said. "It flattens every calendar it touches. That's the price of interoperability."

  "It's the price of empire," Aris said.

  "It's the price of being able to search," Elias said.

  Sarah looked at the voting interface on her tablet. "We need to lock the values. Elias, what is the status on the Scientific Revolution start date?"

  "Holding at 1543," Elias said. "Copernicus. It's a nice integer. It's wrong, but it's stable."

  "If we leave it open," Kenji said, "the legacy system defaults to `CURRENT_YEAR`."

  Elias nodded. "If we leave it open, the system thinks the revolution is happening right now. Every search query returns zero results because the end date hasn't happened yet. The pragmatist wins. We pick 1543. It's a fiction, but it keeps the lights on."

  Aris stared at him. "You admit it's a fiction."

  "I admit it's a schema constraint," Elias said. "Field definition: `PERIOD_START_INT`. Constraints: `NOT NULL`. I can't write code that accepts 'maybe'."

  "Vote," Sarah said.

  They voted. 1543 locked. Elias was right; the system would have broken otherwise. The relief was palpable, a small exhale in the tight room.

  "Now the Middle Ages end date," Sarah said.

  Aris leaned forward. "The usage data suggests 1470. The corpus shows a shift in vernacular usage around then. But the historical reality is continuous. There is no wall."

  "If we move it from 1453 to 1470," Kenji said, looking at his secondary monitor, "we trigger a re-indexing event for the North American curriculum consortium. They have grant cycles tied to the CIF periods. 'Medieval Studies' grants are defined as pre-1453. If we move the date, the grants become invalid."

  "How many grants?" Sarah asked.

  "Forty-two active doctoral cohorts," Kenji said. "They lose funding eligibility. Their projects become 'Renaissance' projects. The funding body doesn't fund Renaissance transitions."

  Aris hesitated. She looked at the graph, then at the clock. 11:56 PM.

  "If we keep 1453," Aris said, "we validate a fifteenth-century historian's bias. We tell the students that the world ended in 1453."

  "If we move to 1470," Elias said, "we tell the students they don't have money."

  Aris closed her eyes. She thought of the Latin phrase, *media tempestas*, the middle season, first attested in the 1460s by a man who needed to feel modern. She had spent her career showing that the season didn't exist. Now she was being asked to enforce its border.

  "Keep 1453," Aris said. Her voice was flat.

  "Recorded," Sarah said.

  "But," Aris said, "I want a comment string in the schema definition. For v4.2. I want it to say why."

  Elias shook his head. "Comments get stripped in production. And there's a character limit. Hard limit."

  "Make it count," Aris said.

  "Kenji," Sarah said. "Check the Kyoto mapping again. If we lock 1453, do they survive?"

  "They survive," Kenji said. "But if we lock the 'Modern' start date based on the convergence data..." He trailed off.

  "What?" Elias asked.

  "The algorithm wants to move 'Modern' start to 1750," Kenji said. "Based on usage frequency of the term 'Modern' in the corpus."

  "That clips the Edo period," Aris said. "Kyoto uses 1603 for their early modern start."

  "CIF overrides local standards," Elias said. "That's the protocol."

  "It's erasure," Aris said.

  "It's normalization," Elias said. "If we allow local overrides, the search index fragments. You can't search across calendars if everyone defines 'Modern' differently."

  Sarah looked at the two of them. "We are writing the walls," she said. "We are standing in a room in Boston, deciding when the world began for people in Kyoto."

  "We are deciding when the search bar works," Elias said.

  11:58 PM.

  "Vote," Sarah said. "Modern start date. 1750 or 1603?"

  Elias voted 1750. Kenji voted 1750. Aris voted 1603. Sarah abstained, then cast the tie-breaking vote.

  "1750," Sarah said.

  "Kyoto archive will be orphaned," Kenji said. He was already typing an alert email. "Their metadata won't map to the new CIF vector. They'll be invisible in the global index."

  "They can migrate," Elias said. "They can update their tags."

  "They can't," Aris said. "Their records are tied to regnal years. Converting them to CIF integers requires manual review. They don't have the budget."

  "Then they're offline," Elias said. "Until they comply."

  "That's the cost," Sarah said. She picked up her stylus. "Release note signature."

  She signed. The status bar on the screen turned green. `CIF v4.2 RELEASED`.

  The projector fan whined down as the screen went dark. The room felt suddenly larger, the silence heavier.

  Elias opened his laptop. He had to commit the schema changes to the repository before the build server locked for the night. His fingers moved quickly over the keys.

  Aris stood up. She put on her scarf. "You know the lines will converge again," she said. "In five years, the Middle Ages will start in 2035. What will you do then?"

  "I'll be retired," Elias said. He didn't look up. "Kenji will fix it."

  Kenji was packing his bag. "I'll be working in finance," he said. "Predicting market cycles. At least those numbers are supposed to be wrong."

  Sarah turned off the lights. "Goodnight," she said.

  Elias was alone in the glow of the monitor. The commit window was open. He navigated to the field definition for `PERIOD_MIDDLE_AGES_END`. He had to justify the date in plain language for whoever read the code in two centuries. The limit was 120 characters.

  He typed: `// 1453. Arbitrary boundary retained for system stability. Prevents downstream default error. Acknowledges bias.`

  He backspaced. `Acknowledges bias` was too vague. `Validates 15th-c. construct` was too specific. He thought about the Kyoto archive, going dark. He thought about the doctoral students losing their grants. He thought about the lines on the graph, closing in like jaws.

  He typed: `// 1453. Chosen integer. Prevents null default. Maps continuity to discrete unit. Cost: Kyoto Edo overlap.`

  He counted the characters. 98. He had space. He could add more. He could explain. He could write a manifesto.

  He looked at the cursor blinking at the end of the line. The system didn't care why. It only cared that the field was not null. The comment was for humans, but the integer was for the machine. The machine would run regardless. The humans might not.

  He deleted `Cost: Kyoto Edo overlap`. It was too specific. It might confuse the next maintainer. It might invite debate. Debate caused delays. Delays caused defaults. Defaults broke the search.

  He typed: `// 1453. Stability over accuracy. Prevents legacy system hallucination. Boundary is functional, not historical.`

  118 characters.

  He hovered over the `Commit` button. He thought about Aris's face when she said *We are tightening the noose around the present.* He thought about Elias's own hands, typing the numbers that would make the past fit into the boxes.

  He pressed `Commit`.

  The terminal flashed `SUCCESS`.

  He closed the laptop. The room was dark now, save for the standby light on the server rack, a small green eye watching the room. He stood up, his chair scraping against the floor, a sharp sound in the quiet. He walked to the door, leaving the comment string buried in the repository, waiting for the next cycle, when the lines would move again, and someone else would have to choose which truth to break.

  // 1453. Stability over accuracy. Prevents legacy system hallucination. Boundary is functional, not historical.
