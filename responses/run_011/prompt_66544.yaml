  # The Modality Sorting Instrument (Week 1 Handout)

  **Instructions:** Start at Node 1. Follow the path that matches your intuition about the case described. Record your sequence of answers (e.g., 1A-2B-3A) to find your view at the end.

  ### The Nodes

  **Node 1 (Ontology)**
  Imagine a blue swan that never exists in our history. Is there a physical swan somewhere, or just a description of one?
  *   **Physical:** Go to Node 2.
  *   **Description:** Go to Node 4.

  **Node 2 (Concrete Actuality)**
  If you were in that other physical place, would "actually" point to where you are now, or where you are then?
  *   **Where you are then:** Go to Node 3.
  *   **Where you are now:** Leaf C (Unclaimed).

  **Node 3 (Concrete Identity)**
  Could *you* exist in that other physical place, or only someone exactly like you?
  *   **Someone like you:** Go to Node 6.
  *   **You:** Leaf B (Unclaimed).

  **Node 4 (Abstract Actuality)**
  If you were in that described scenario, would "actually" point to where you are now, or where you are then?
  *   **Where you are then:** Go to Node 5.
  *   **Where you are now:** Go to Node 7.

  **Node 5 (Fiction)**
  Are these descriptions true accounts of reality, or just useful stories?
  *   **Stories:** Leaf E (Rosen).
  *   **True:** Go to Node 6.

  **Node 6 (Plenitude)**
  Suppose there is a property nothing here has. Can your theory build a world using it, or only rearrange what we already have?
  *   **Build using it:** Leaf A (Lewis) or Leaf D (Plantinga) or Leaf F (Unclaimed).
  *   **Rearrange actuals:** Leaf G (Armstrong) or Leaf H (Adams).

  **Node 7 (Abstract Kind)**
  Are the descriptions made of words and logic, or fundamental facts and properties?
  *   **Words:** Leaf I (Unclaimed).
  *   **Facts:** Leaf D (Plantinga).

  *(Note: Node 6 branches differently depending on your path from Node 1 or 5. See Key below.)*

