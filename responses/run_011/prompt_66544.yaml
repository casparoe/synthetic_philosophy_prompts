  ### TA Commentary: The "Uninstantiated Properties" Node

  **Where it bites:** This is **Node 6**. It separates views that rely on *actual* ingredients (Armstrong, Adams) from views that allow *non-actual* primitives (Lewis, Plantinga).
  **The Objection:** Linguistic ersatzism (Adams) struggles to distinguish worlds that differ only by uninstantiated properties (e.g., a new color) or infinite cardinalities, because our actual language/concepts can't name them.
  **Immunity & Cost:**
  *   **Immune:** Lewis and Plantinga. They posit primitives (concrete worlds or abstract properties) that exist independently of our description.
  *   **The Cost:** Lewis pays with an inflated ontology (infinite concrete universes). Plantinga pays with mysterious abstract objects that don't enter causal relations. Adams and Armstrong keep ontology cheap but lose expressive power (they must admit "ineffable" possibilities).

  ### Honesty Clause: Limits of the Tree

  **1. Plantinga vs. Stalnaker:**
  This tree cannot separate **Plantinga (Leaf D)** from **Stalnaker (Unclaimed Leaf I/D hybrid)**. Both say worlds are abstract, actuality is special (only one obtains), and identity is transworld. Stalnaker thinks only the actual world *exists* (others are representations); Plantinga thinks all worlds *exist* (only one obtains).
  *   *Extra Question Needed:* "Do the non-actual worlds exist as objects, or are they merely logical constructs of the actual world?"

  **2. Rosen vs. Error Theory:**
  **Rosen (Leaf E)** treats worlds as useful fictions. An Error Theorist would follow the same path but claim the fiction is *false* rather than useful.
  *   *Extra Question Needed:* "When we say 'possibly,' are we saying something true-in-the-fiction, or something strictly false?"

  **3. Unclaimed Diagnostics:**
  *   **Leaf B (Concrete + Identity + Plenitude):** Incoherent. If worlds are concrete sums, you cannot be in two sums without being scattered.
  *   **Leaf F (Linguistic + Plenitude):** Unappealing. Requires language to have infinite, undefined resources to name uninstantiated properties.
  *   **Leaf C (Concrete + Special Actuality):** Unclaimed. Suggests a metaphysical privilege for one concrete universe without a theological ground.
