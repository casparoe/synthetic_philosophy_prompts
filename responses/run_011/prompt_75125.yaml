answer: |-
  Imagine a server set up to test how much weight a digital bridge can hold before collapsing. The machine builds a bridge out of real code, runs a virtual truck over it, records the breaking point, and then wipes the bridge to reset the simulation for the next test. This happens thousands of times a day. The bridges are genuine digital objects that interact with the server's memory and processing power, but they are designed to be ephemeral, like fireworks that exist to burst and vanish. When the project finishes and the server is switched off, any bridge currently under construction disappears. No one is harmed by this loss, because the bridges were never meant to be kept; their worth was entirely in the data gathered at the moment of their destruction, not in their continued existence.

  ***

  **The Working**

  **The Virtual Realist**
  A realist like David Chalmers would say the bridges are real digital objects. They have causal powers: they occupy memory, they interact with the physics engine, and they resist the truck's weight. Deleting them is genuinely destroying something real. However, they would argue that reality does not guarantee inviolability. Harm depends on interests, not just existence. Since the bridges' purpose was purely instrumental—to yield data—and that purpose was fulfilled before deletion, no interest is thwarted by their destruction. The object is real, but its destruction is not a harmful loss because its value was extracted prior to its end.

  **The Fictionalist**
  A fictionalist would say the bridges are not real bridges, but merely fictional representations implemented in code. They are akin to words in a story; deleting them is like closing a book. Nothing of substance is lost, only a pattern of information that was never truly 'there' in the physical sense. They agree with the verdict (no harm), but for a different reason: you cannot harm someone by destroying a pretence. For the realist, a real thing was destroyed but it didn't matter; for the fictionalist, it didn't matter because nothing real was there to begin with.

  **The Divergence**
  They land on the same verdict, but their reasons cannot both be correct. Either the bridges were real digital objects with causal powers (Realist), or they were abstract descriptions pretending to be objects (Fictionalist). The single feature doing the work here is **instrumental ephemerality**: the object is designed such that its destruction is necessary for its function.

  **Adding the User**
  If you introduce one person who logs in once a year to walk across the bridge, the verdict shifts for both. For the Realist, the object now holds extrinsic value (sentiment or experience) beyond its instrumental function. Destroying it thwarts the user's interest in future access, creating genuine harm. For the Fictionalist, the human engagement grants the pattern significance it lacked before; deleting it erases a site of meaning. Both would now agree that deletion causes harm, though they would still disagree on whether the thing destroyed was 'real'.

  **The Attack**
  Someone who believes virtual harms are real harms would attack the case by arguing that **labour creates a claim to persistence**. They would say that even if the bridge was designed to be wiped, the computational effort and design logic invested in it constitute a form of digital workmanship. Deleting it disregards the integrity of that work. They might argue that once a virtual object reaches a certain complexity, it acquires a moral status independent of its utility, meaning destruction is always a loss, regardless of whether anyone logs in to see it.

  **Satisfiability**
  The spec is satisfiable. The constraint regarding "nobody cares" is met not by stipulation, but by structural design: the objects are created *for* deletion, making care for their persistence incompatible with their function.
