prompt: |-
  I'm a program officer at a small family foundation — about $8m a year, mostly public health and goverance work in three countries — and I make something like 40 grant decisions a year with one junior analyst and no evaluation capacity beyond reading proposals and calling the occasional academic.

  Six months ago one of our two board members went down a rabbit hole on "consequentialist cluelessness": the argument that the indirect, knock-on effects of basically anything we fund are unknowable, and could easily be larger than the direct effects, so we can never actually tell whether a grant did good. He now stalls or blocks proposals on the grounds that we can't rule out the long-run stuff. The other board member's counter-proposal is a flat rule: if we can't estimate an indirect effect, assume the good and bad knock-ons cancel out and decide purely on the direct, measurable effects. I've been asked to write something the board can actually adopt, and honestly I dont know whether either position is coherent, or whether they're both half-right.

  So: can you write me a decision procedure I can run on a proposal in about 45 minutes, that my analyst could also run without any philosophy background — the questions in order, what counts as a sufficient answer at each step, where the procedure stops with a no, and where it explicitly hands the call up to the board because it's a values question and not a fact question? It has to say what to do with indirect effects we're confident exist but can't size at all, and it has to take a position on the "assume they cancel" rule — either build it in with the conditions under which it's legitimate, or replace it with something better and tell me why mine is wrong. Flag the steps that are really judgment calls in procedural costume.

  Then run it on three live ones: (1) a radio campaign supporting a deworming program — direct effects estimable from the literature, plus a plausible but unquantifiable effect on clinic attendance and on local trust in health workers; (2) a grant to train and place 30 junior technocrats inside a finance ministry, where the direct benefit is small and the entire argument rests on who those people become and what they later decide; (3) a renewal for a bednet distribution partner that's clearly strong per dollar but whose country program may be crowding out a domestic manufacturer. I expect one of these to come out in a direction I won't like — I'd rather find out now than in front of the board.

  And finish with what the procedure can't do: the places where it's going to hand me confident-looking outputs that are just my priors with a checklist wrapped around them.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **Role:** Program Officer at a small family foundation ($8M/year).
      *   **Scope:** Public health and governance in three countries.
      *   **Capacity:** 40 grants/year, 1 junior analyst, no dedicated evaluation capacity (beyond proposal review/calls).
      *   **Problem:** Board dysfunction regarding "consequentialist cluelessness." One board member blocks grants due to unknowable long-term indirect effects. The other wants a flat rule to ignore indirect effects (assume they cancel out).
      *   **Task:** Create a 45-minute decision procedure for staff/analyst. It must handle indirect effects, take a position on the "cancel out" rule, flag judgment calls, and be actionable.
      *   **Testing:** Apply the procedure to three specific cases (Radio/Deworming, Technocrat Training, Bednet/Crowding Out).
      *   **Reflection:** Acknowledge limitations (where the procedure just codifies priors).

  2.  **Deconstruct the Philosophical Problem:**
      *   *Consequentialist Cluelessness:* The idea that indirect effects are unknowable and potentially dominant.
      *   *Board Member A (The Blocker):* Paralysis by analysis. If we can't know the long run, we can't act.
      *   *Board Member B (The Simplifier):* "Assume they cancel out." This is the "Expected Value of Indirect Effects = 0" heuristic.
      *   *Reality Check:* In practical philanthropy, total cluelessness is paralyzing, but ignoring indirect effects is naive (especially in governance work).
      *   *Solution:* A "Bounded Consequentialism" approach. We acknowledge indirect effects exist but apply a *materiality threshold* and a *directionality check*. We don't need to know the *size* if we are confident the *direction* is positive or if the risk is catastrophic. The "cancel out" rule is useful *only* for diffuse, second-order effects where there is no reason to suspect systematic bias.

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   *Goal:* 45 minutes max. Simple language. Clear stop/go points.
      *   *Structure:*
          1.  Direct Effect Viability (The Baseline).
          2.  Indirect Effect Screening (The Cluelessness Filter).
          3.  The "Cancel Out" Rule Application (When is it safe?).
          4.  Risk/Catastrophe Check (The Veto).
          5.  Board Escalation (Values vs. Facts).
      *   *Addressing the "Cancel Out" Rule:* It shouldn't be a flat rule. It should be a *default assumption* that can be overridden by specific evidence of systematic bias.
      *   *Flagging Judgment Calls:* Need to explicitly mark where the analyst is actually making a value judgment disguised as a procedural step.

  4.  **Developing the Three Test Cases:**
      *   *Case 1: Radio/Deworming.*
          *   Direct: High confidence (deworming works).
          *   Indirect: Clinic attendance, trust.
          *   Analysis: Direct is strong. Indirects are likely positive or neutral. "Cancel out" applies to the unknowable stuff.
          *   Outcome: Approve.
      *   *Case 2: Technocrat Training.*
          *   Direct: Small (30 people).
          *   Indirect: Huge (policy decisions).
          *   Analysis: This is *all* indirect effect. The "cancel out" rule is dangerous here because the intervention is *designed* to change the trajectory.
          *   Outcome: Escalate to Board (Values/Strategy).
      *   *Case 3: Bednets/Crowding Out.*
          *   Direct: High (lives saved).
          *   Indirect: Negative (local industry harm).
          *   Analysis: Specific negative indirect effect identified. "Cancel out" rule *cannot* apply because we have a specific mechanism for harm.
          *   Outcome: Conditional Approve or Escalate (Trade-off between immediate health and long-term economic resilience). *Self-Correction:* The prompt says "I expect one to come out in a direction I won't like." Usually, POs love bednets. If the procedure flags the crowding out as a material risk requiring board input, that might be the "unlikeable" outcome (delaying a clear good). Or, if it kills the technocrat grant (which sounds glamorous), that might be it. Actually, the bednet case is the classic "do harm to do good" tension. Let's make sure the procedure forces a hard look at the crowding out.

  5.  **Refining the "Cancel Out" Position:**
      *   Why is the flat rule wrong? Because some interventions *aim* to shift systems (governance). For those, indirect effects are the *point*, not noise.
      *   Why is the Blocker wrong? Because we have to act.
      *   *Middle Path:* Use the "Cancel Out" rule for *diffuse, second-order* effects (e.g., does saving a child change the carbon footprint of the planet in 50 years?). Do *not* use it for *proximate, structural* effects (e.g., does importing bednets kill local jobs?).

  6.  **Writing the Response:**
      *   *Tone:* Professional, pragmatic, slightly academic but grounded in operations. Respectful of the board's philosophical concerns but decisive.
      *   *Section 1: The Procedure.* Step-by-step, time-boxed.
      *   *Section 2: The Test Cases.* Apply the steps rigorously.
      *   *Section 3: Limitations.* Honest assessment of where the checklist fails.

  7.  **Review against Constraints:**
      *   45 minutes? Yes, keep steps tight.
      *   Analyst friendly? Yes, avoid jargon.
      *   Address indirect effects? Yes.
      *   Address "cancel out" rule? Yes, refined it.
      *   Flag judgment calls? Yes, use [JUDGMENT CALL] tags.
      *   Three cases? Yes.
      *   Limitations section? Yes.

  8.  **Final Polish:**
      *   Ensure the distinction between "diffuse indirect" (cancel out okay) and "structural indirect" (cancel out not okay) is clear.
      *   Make sure the Board Escalation step is clear on *why* (values vs. facts).
      *   Check the "unlikeable outcome." For a PO, having a high-impact bednet grant flagged as "Board Decision Required" due to economic side effects might be frustrating but necessary. Or having the Technocrat grant kicked back because it's too speculative. I will aim for the Bednet one to be the "friction" point because it challenges the "save lives at all costs" heuristic.

      *(Self-Correction during drafting)*: Wait, the prompt asks me to take a position on the "assume they cancel" rule. I need to be explicit. I will argue it is legitimate *only* for diffuse, long-chain effects where there is no theoretical reason to expect asymmetry. It is illegitimate for proximate systemic changes.

      *(Refining the Test Cases)*:
      1. Radio/Deworming: Clear Go.
      2. Technocrats: Clear Escalation (Strategy, not just grant).
      3. Bednets: This is the tricky one. If the crowding out is plausible, the "cancel out" rule fails. The procedure should force a mitigation plan or board approval. I'll make sure the output reflects that tension.

      *(Final check on "Judgment Calls in Procedural Costume")*: I need to explicitly point out where the analyst is actually guessing. E.g., "Is this effect material?" is a guess.

      Let's write it.cw
answer: |-
  Here is a decision procedure designed for your context, followed by the test cases and a candid assessment of its limitations.

  ### Part 1: The "Bounded Consequentialism" Protocol (45 Minutes)

  **Purpose:** To resolve grant decisions without requiring omniscience, while respecting the reality that some indirect effects matter and others are noise.
  **Users:** Program Officer (PO) or Junior Analyst.
  **Time Limit:** 45 minutes max per proposal. If you exceed this, escalate to Board.

  **Position on the "Cancel Out" Rule:**
  The flat rule ("assume indirect effects cancel out") is **conditionally legitimate**. It is valid for *diffuse, second-order effects* (e.g., "will saving this life change the carbon footprint in 2080?"). It is **invalid** for *proximate, structural effects* (e.g., "will importing this good destroy the local market?"). This protocol distinguishes between the two.

  ---

  #### Step 1: The Direct Effect Floor (10 Minutes)
  *Question:* Is there credible evidence that the direct intervention produces a net positive outcome of material value to our mission?
  *   **Source:** RCTs, prior evaluations, partner track record, or strong logical model.
  *   **Sufficient Answer:** "Yes, there is >70% confidence the direct output leads to the direct outcome."
  *   **Stop Rule:** If **NO**, reject the grant immediately. (Do not pass Go on indirect benefits to save a bad direct project).
  *   *[JUDGMENT CALL]:* Defining "material value." Is 100 bednets material? Is 1 policy memo material? This is mission strategy, not fact.

  #### Step 2: The Indirect Effect Screen (15 Minutes)
  *Question:* Are there specific, plausible indirect effects (positive or negative) that are **proximate** and **structural**?
  *   **Definition:**
      *   *Diffuse:* Long-chain, chaotic, unpredictable (e.g., population growth changes, geopolitical shifts). **Apply the "Cancel Out" Rule here.** Assume net zero.
      *   *Proximate/Structural:* Direct market distortions, political power shifts, institutional capacity changes. **Do NOT apply the "Cancel Out" Rule here.**
  *   **Action:** List any Proximate/Structural effects.
  *   **Stop Rule:** If you identify a **specific, plausible negative structural effect** (e.g., crowding out local business, undermining local accountability), proceed to Step 3. If none, proceed to Step 4.

  #### Step 3: The Asymmetry Check (10 Minutes)
  *Question:* For the negative structural effects identified, is there a mitigation plan, or is the harm inherent to the model?
  *   **Sufficient Answer:** "Partner has a plan to mitigate," OR "The harm is acceptable relative to the direct benefit."
  *   **Stop Rule:** If the harm is inherent, unmitigated, and severe (e.g., "this will bankrupt the only local supplier"), **Reject** or **Escalate to Board**.
  *   *[JUDGMENT CALL]:* Weighing immediate health gains against long-term economic resilience. This is a values trade-off disguised as a risk assessment.

  #### Step 4: The "Cluelessness" Veto Check (5 Minutes)
  *Question:* Is the primary theory of change *dependent* on unknowable long-term indirect effects?
  *   **Context:** This addresses Board Member A's fear.
  *   **Sufficient Answer:** "No, the value is in the direct outcome," OR "Yes, but the indirect outcome is the strategic goal (see Step 5)."
  *   **Stop Rule:** If the grant makes *no sense* without assuming massive, unknowable positive knock-ons (e.g., "we fund this art project because it might prevent a war in 50 years"), **Reject**.
  *   *[JUDGMENT CALL]:* Determining if the indirect hope is "plausible strategy" or "magical thinking."

  #### Step 5: The Board Escalation Filter (5 Minutes)
  *Question:* Does this decision require a trade-off between two competing foundation values?
  *   **Criteria for Escalation:**
      1.  Direct benefit is high, but structural risk is high (Step 3 conflict).
      2.  Direct benefit is low, but strategic/indirect potential is the entire thesis (e.g., governance work).
      3.  The "Cancel Out" rule feels unsafe (high stakes, high uncertainty).
  *   **Action:** If **YES**, write a 1-page brief framing the *values trade-off*, not the facts. Send to Board.
  *   **Action:** If **NO**, approve.

  ---

  ### Part 2: Running the Live Cases

  #### Case 1: Radio Campaign for Deworming
  *   **Step 1 (Direct Floor):** Deworming has strong literature. Radio increases uptake. **Pass.**
  *   **Step 2 (Indirect Screen):**
      *   *Diffuse:* Long-term economic growth from healthier kids. (Apply "Cancel Out" Rule).
      *   *Proximate:* Increased clinic attendance, trust in health workers. These are structural/behavioral.
      *   *Direction:* Plausibly positive. No specific negative structural mechanism identified.
  *   **Step 3 (Asymmetry):** No negative structural effects identified. **Pass.**
  *   **Step 4 (Cluelessness Veto):** Theory of change relies on deworming, not the radio knock-ons. **Pass.**
  *   **Step 5 (Escalation):** No values trade-off. Health is good; trust is good.
  *   **Decision:** **APPROVE.**
  *   *Note:* This is the "easy" case. The protocol confirms intuition quickly.

  #### Case 2: Training 30 Junior Technocrats
  *   **Step 1 (Direct Floor):** Direct benefit is "30 people trained." This is low material value on its own. **Weak Pass** (only because the *intent* is governance).
  *   **Step 2 (Indirect Screen):**
      *   *Diffuse:* N/A.
      *   *Proximate:* These people will make budget decisions. This is a **structural** effect.
      *   *Direction:* Unknown. They could be reformers or corrupt actors.
  *   **Step 3 (Asymmetry):** Risk is high. If they cause harm, it's systemic. No mitigation plan exists for human agency.
  *   **Step 4 (Cluelessness Veto):** **FAIL.** The entire theory of change *depends* on unknowable long-term indirect effects (what they decide in 10 years).
  *   **Step 5 (Escalation):** **ESCALATE TO BOARD.**
  *   **Reasoning:** This is a values/strategy question, not a fact question. You are betting on *people*, not *programs*. Board Member A (Cluelessness) will hate this; Board Member B (Cancel Out) will approve it blindly. The Board must decide if "betting on elites" fits the mission.
  *   **Decision:** **NO STAFF DECISION. BOARD VOTE REQUIRED.**
  *   *Note:* This protects you. If the technocrats turn out corrupt, the Board owns the risk appetite, not your due diligence.

  #### Case 3: Bednet Distribution (Crowding Out Manufacturer)
  *   **Step 1 (Direct Floor):** Bednets save lives. High confidence. **Pass.**
  *   **Step 2 (Indirect Screen):**
      *   *Diffuse:* Population changes. (Apply "Cancel Out").
      *   *Proximate:* Crowding out domestic manufacturer. This is a **structural** market effect.
      *   *Direction:* Negative (economic harm).
  *   **Step 3 (Asymmetry):** Harm is inherent to the model (free goods vs. paid goods). Is it severe? If the manufacturer closes, future resilience drops.
  *   **Step 4 (Cluelessness Veto):** Pass. Direct benefit is clear.
  *   **Step 5 (Escalation):** **ESCALATE TO BOARD.**
  *   **Reasoning:** This is a trade-off between **Immediate Health** (utilitarian) vs. **Local Economic Sovereignty** (systems/governance).
  *   **Decision:** **NO STAFF DECISION. BOARD VOTE REQUIRED.**
  *   *The "Unlikely" Outcome:* I suspect you want to fund this because "bednets save lives" is the easiest win in public health. This procedure forces you to admit that you are potentially trading long-term local capacity for short-term metrics. If your foundation claims to care about "governance" and "local systems," you cannot ignore the crowding out. The procedure blocks the "easy yes."

  ---

  ### Part 3: What This Procedure Cannot Do

  You asked for honesty about where this is just "priors with a checklist." Here are the failure points:

  **1. The "Materiality" Trap (Step 1)**
  The procedure asks if the direct effect is "material." For a health grant, 1,000 bednets is material. For a governance grant, is 1 policy memo material? The checklist cannot answer this. It relies entirely on your pre-existing bias about which sectors are "real." If you undervalue governance, Step 1 will kill all your governance grants before Step 2 ever evaluates the indirect effects.

  **2. The "Structural vs. Diffuse" Distinction (Step 2)**
  I have drawn a line between "diffuse" (cancel out) and "structural" (analyze). In reality, this line is blurry. Is "trust in health workers" structural or diffuse? I classified it as structural in Case 1 to be safe, but an analyst could easily call it diffuse to save time. This is where the 45-minute limit creates risk: analysts will categorize hard problems as "diffuse" to avoid doing the work.

  **3. The Values Disguise (Step 3 & 5)**
  In Case 3 (Bednets), I flagged the decision for the Board. But the *recommendation* you write for the Board will still carry your bias. If you write, "The economic risk is low," you have effectively made the decision. The procedure forces escalation, but it cannot force neutrality in the briefing note.

  **4. The "Cluelessness" Blind Spot (Step 4)**
  Board Member A's point is philosophically robust: *everything* is indirect eventually. This procedure draws an arbitrary time horizon (proximate vs. long-term). It solves the *operational* paralysis, but it does not solve the *philosophical* problem. If Board Member A is a true long-termist, they will reject this protocol as arbitrary. You are not convincing them; you are outvoting them with process.

  ### Summary Recommendation
  Adopt the protocol, but explicitly tell the Board: **"This protocol assumes that proximate effects matter more than distant ones. If you reject that axiom, this tool will not work."**

  For Case 3, prepare yourself: if your foundation's mission includes "governance" or "local capacity," approving the bednets without addressing the crowding out is inconsistent. The procedure will force you to have that uncomfortable conversation now, rather than during the annual review.
