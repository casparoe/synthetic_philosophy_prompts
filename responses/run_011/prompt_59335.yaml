prompt: |-
  I am a high school junior, and I run a weekly philosophy reading group at my school. This term we have been working through spectrum-style arguments against consequentialism. The version we discussed claims that a very large population of lives that are barely worth living need not be worse than a much smaller population of excellent lives, on the grounds that one can pass from the second to the first by a chain of small changes such that no step in the chain is worse than the step before it. One member of our group proposed the obvious-looking fix — deny that the relation doing the work in the chain, whether it is "better than" or "at least as good as," is transitive — and a college student who coaches our debate team shut this down in a single line: "If betterness isn't transitive, you can be money-pumped; that's just a Dutch book, and nobody wants to be exploitable." He said it as though the discussion were over, and most of the group agreed with him, but I suspect he may have been changing the subject rather than answering the argument, and I cannot articulate why.

  Could you lay out the different precise claims that slogan might be standing for, as a menu rather than as one favored interpretation? For each reading, I would like to know exactly what is being asserted — whose relation is in question (a normative ordering of outcomes, or one agent's actual choice dispositions), what counts as a pump, what the agent must be able to foresee about the sequence of trades, whether the switches must be free or costless — and whether the reading is a platitude, a substantive and defensible thesis, a false thesis, or one that depends on further assumptions. Most importantly, I would like to know whether it would actually defeat the intransitivist reply to the spectrum argument, given that the spectrum argument concerns which outcomes are better rather than how anyone chooses among them. Please also tell me separately whether "money pump" and "Dutch book" name the same objection, since he used the two interchangeably. For what it is worth, I am inclined to think the pump is at most a claim about decision procedures rather than about value, but I do not yet trust that intuition.

  Please format your answer as follows. Begin with three or four sentences giving the bottom line: which reading he most plausibly intended, and whether invoking it was legitimate. Then give a table with exactly these columns: Reading (a short label); Precise claim (one or two sentences, stated so that it could be true or false); Status (platitude / substantive and defensible / false / depends on further assumptions); Assumptions required; Defeats the intransitivist move? (yes, no, or partly, with one sentence saying why). Include at least six readings, ordered from the weakest to the strongest. Then a short section on the money-pump versus Dutch-book question. Close with the two or three questions I should put to him at our next meeting.
