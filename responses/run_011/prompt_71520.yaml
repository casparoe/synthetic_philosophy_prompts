answer: |-
  Here is the specification for a Contractualist Aggregation Function (CAF). It is designed to isolate the structural commitments of the view from the contingent variations, and to locate the precise point of mathematical failure.

  ### I. Interface Definition

  **Input:**
  1.  **Population ($P$):** A finite set of individuals $i_1, \dots, i_n$.
  2.  **Alternatives ($A$):** A finite set of candidate allocations/principles $a_1, \dots, a_m$.
  3.  **State Mapping ($S$):** A function $S(i, a) \to w$, where $w$ is a welfare state description for individual $i$ under allocation $a$.

  **Output:**
  1.  **Permissible Set ($K$):** A subset of $A$ ($K \subseteq A$). $K$ may contain multiple elements (ties) but cannot be empty.

  **Core Predicate:**
  *   **Reasonable Rejectability ($R$):** $R(i, a_x, a_y)$ is true if individual $i$ has a valid complaint against principle $a_x$ in favor of $a_y$.
  *   **Global Permissibility:** $a_x \in K$ iff there is no $a_y$ such that $a_y$ is *strongly preferred* to $a_x$ based on the aggregation of $R$.

  ---

  ### II. Non-Negotiable Constraints (The Contractualist Kernel)

  These are the requirements that distinguish the view from consequentialism. Removing any one of these collapses the spec into a weighted sum model (utilitarianism) or a random lottery.

  **1. The Individualist Restriction (No Summing)**
  *   **Spec:** The strength of a complaint against $a_x$ is determined by the impact on specific individuals, not by the sum of impacts across a group. When comparing $a_x$ and $a_y$, the procedure must identify the *strongest* individual complaint against $a_x$ and compare it to the *strongest* individual complaint against $a_y$.
  *   **Motivating Case:** *Ventilator vs. Inhalers.* One person dies without a ventilator. Ten thousand asthmatics suffer severe breathing difficulty without inhalers. A consequentialist sums the disutility of the asthmatics. The CAF must not sum the asthmatics' complaints to outweigh the death. It must compare the single death complaint against the single strongest asthma complaint.
  *   **Formal Property:** The aggregation operator $\oplus$ over complaints is non-additive. $Strength(\{c_1, \dots, c_n\}) = \max(Strength(c_i))$.

  **2. Genericity (Impartiality)**
  *   **Spec:** The verdict must be invariant under permutation of individual labels. If $a_x$ harms $\{i_1, i_2\}$ and $a_y$ harms $\{i_3, i_4\}$, and the harm types are identical, the verdict cannot favor $a_x$ based on identity.
  *   **Motivating Case:** *The Named Victim.* You cannot save person $A$ over person $B$ simply because $A$ is "the current patient" and $B$ is "a statistic," if the harm magnitude is identical.
  *   **Formal Property:** Anonymity. $f(P, A, S) = f(\pi(P), A, S')$ where $\pi$ is a bijection on $P$.

  **3. Complaint Comparability (Ordinal Anchor)**
  *   **Spec:** There must exist a partial ordering over complaint types that allows comparison between different individuals without a common cardinal currency.
  *   **Motivating Case:** *Leg vs. Life.* How does the system know a death complaint is stronger than a broken leg complaint without converting both to "utils"? The system requires a pre-defined hierarchy of harm types (e.g., Death > Loss of Limb > Severe Pain > Mild Inconvenience).
  *   **Formal Property:** Existence of a strict partial order $>$ on the range of $S$.

  **4. Ex-Post Assessment (Outcome Focus)**
  *   **Spec:** Complaints are assessed against the actual outcome realized, not the ex-ante risk profile, unless the risk itself constitutes the harm.
  *   **Motivating Case:** *Certain Death vs. Risk.* Policy A kills Person 1 certainly. Policy B gives Persons 2–1,000,001 a 1/1,000,000 chance of dying. Ex-ante, everyone faces equal risk in B. Ex-post, Person 1 dies in A, and (statistically) one person dies in B. Contractualism typically requires comparing the actual death complaint against the actual death complaint, not the risk complaints.
  *   **Formal Property:** $R$ is evaluated on $S(i, a_{actual})$, not $E[S(i, a)]$.

  ---

  ### III. Contingent Commitments (The Factions)

  These are parameters where the "Contractualist" label is maintained, but the implementation diverges. Your EA friend likely conflates these with the Kernel.

  **1. The Aggregation Threshold (Moderate vs. Strict)**
  *   **Option A (Strict):** No number of lower-tier complaints ever outweighs a higher-tier complaint. (Death always trumps broken legs).
  *   **Option B (Moderate):** Sufficiently many lower-tier complaints can outweigh a higher-tier complaint if the lower tier is "serious enough" (e.g., paralysis vs. death), but not if "trivial enough" (e.g., headache vs. death).
  *   **Impact:** Option A creates lexical priorities. Option B attempts to restore continuity but risks collapsing into summing.

  **2. Risk Handling (Ex-Ante vs. Ex-Post)**
  *   **Option A (Ex-Post):** Complaints only register if harm materializes. (Favors saving the identified victim).
  *   **Option B (Ex-Ante):** Complaints register based on imposed risk. (Favors policy B in the Certain Death vs. Risk case, as it minimizes max risk to any individual).
  *   **Impact:** Ex-Ante views look more like prioritarianism; Ex-Post views look more like rights-based deontology.

  **3. Non-Identity Handling (Existence Requirement)**
  *   **Option A (Existence):** You cannot complain on behalf of a state where you do not exist. (Standard view).
  *   **Option B (Potential):** You can complain if a policy causes you to exist in a harmed state vs. not existing, *if* there is an alternative where you exist in a better state.
  *   **Impact:** Option A makes the CAF blind to population size changes unless existing people are harmed. Option B allows population size to enter the calculation, risking the "Repugnant Conclusion" via the back door.

  **4. Tie-Breaking (Determinacy)**
  *   **Option A (Random):** If strongest complaints are equal strength, permissible set $K$ contains both; nature decides.
  *   **Option B (Numbers):** If strongest complaints are equal strength, the side with more people holding that complaint wins.
  *   **Impact:** Option B is required to save the "Greater Number" intuition in symmetric cases (1 vs. 1 is a tie; 1 vs. 2 saves the 2).

  ---

  ### IV. The Impossibility Result

  Your hypothesis is close, but the triad requires sharpening. The tension is not merely about "Determinacy," but about **Transitivity** when combining **Individualism** with **Numbers Sensitivity**.

  **The Revised Triad:**
  1.  **Strong Individualism:** A group of weaker complaints cannot aggregate to outweigh a single stronger complaint. (The Ventilator Case).
  2.  **Numbers Sensitivity:** If complaint strength is equal, the group with more complainants wins. (The 1 vs. 2 Death Case).
  3.  **Continuity (Non-Lexicality):** For any harm $H_{small}$ and $H_{large}$, there exists some number $n$ such that $n \times H_{small}$ outweighs $1 \times H_{large}$.

  **The Conflict:**
  You cannot hold all three.
  *   If you hold (1) and (2), you must reject (3). You accept a lexical gap where death *always* outweighs any number of broken legs. This is the standard Contractualist position, but it violates the intuition that enough small harms should matter.
  *   If you hold (2) and (3), you must reject (1). You must allow some form of aggregation (summing or thresholding) to let the small harms win eventually. This collapses toward consequentialism.
  *   If you hold (1) and (3), you must reject (2). You cannot save the greater number when harms are equal, because that implies the *number* adds weight, which violates strict individualism (why does the second person's identical complaint add force if the first person's complaint didn't fully outweigh the opponent?).

  **The Real Choke Point: Transitivity in Spectrum Cases**
  The deepest formal failure arises when you try to bridge (1) and (2) across a spectrum of harms.
  *   Case A: 1 Death vs. 1,000,000 Broken Arms. (Individualism says Save the 1).
  *   Case B: 1 Broken Arm vs. 1,000,000 Headaches. (Numbers/Continuity says Save the Arm).
  *   Case C: 1 Death vs. 1,000,000 Headaches.
  *   If Death > Arms, and Arms > Headaches (by numbers), Transitivity demands Death > Headaches. But if Headaches are numerous enough, Continuity demands Headaches > Death.
  *   **Result:** The preference ordering becomes cyclic. The CAF cannot return a stable Permissible Set $K$.

  **Cost of Giving Up:**
  *   **Drop Individualism:** You become a Consequentialist. The "Veto" disappears; it's just a non-linear utility function.
  *   **Drop Numbers Sensitivity:** You become an Absolutist. You flip a coin between 1 death and 2 deaths. This is morally untenable for most.
  *   **Drop Continuity:** You accept Lexicality. One death is infinitely worse than any finite amount of pain. This is the only consistent Contractualist position, but it fails the "EA Friend" test of plausibility in extreme cases (e.g., infinite mild torture vs. one death).

  **The Single Requirement That Eliminates Candidates:**
  **The Individualist Restriction (No Summing).**
  This is the trenchcoat. It hides two distinct requirements:
  1.  **Non-Additivity:** $Value(A \cup B) \neq Value(A) + Value(B)$.
  2.  **Pairwise Comparison:** Comparisons are made between the *max* complaint of Group A and the *max* complaint of Group B.
  Most "Moderate Aggregators" try to keep (1) while smuggling in (2) via thresholds. This is where the math breaks. Enforcing strict Pairwise Comparison eliminates 90% of hybrid views immediately.

  ---

  ### V. Scorecard of Contenders

  | View | Individualist Restriction | Numbers Sensitivity | Continuity | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **Strict Contractualism** | **Pass** | **Pass** (for ties) | **Fail** (Lexical) | Consistent, but implies one death outweighs infinite torture. |
  | **Utilitarianism** | **Fail** (Sums) | **Pass** | **Pass** | Consistent, but violates the "Veto" constraint. |
  | **Moderate Aggregation** | **Fail** (Thresholds sum) | **Pass** | **Pass** | Mathematically unstable (Cyclical preferences in spectrum cases). |
  | **Ex-Ante Contractualism** | **Pass** | **Pass** | **Pass** | Solves Risk cases, but fails Ex-Post intuition (allows certain death to minimize risk). |

  **Final Note to the EA Friend:**
  The view is not "Utilitarianism with a Veto." A veto implies a cap on a sum. Contractualism is "Pairwise Comparison of Maximum Complaints with Lexical Priorities." The impossibility result shows that you cannot have the Veto, the Greater Number intuition, *and* the intuition that small harms aggregate eventually. You must pick two. Standard Contractualism picks Veto + Greater Number, and accepts the Lexical bullet.
