prompt: |-
  I've been reading LessWrong and the Alignment Forum for something like fifteen years, and I have a bad habit of trying to turn philosophical views into specifications — not because I expect to build them, but because the attempt to state a view precisely usually exposes exactly where the view has been doing work with vagueness. My current victim is Scanlonian contractualism's answer to the aggregation problem. I want to know what it would take to state that answer as something runnable: an input consisting of a finite set of individuals and a finite set of candidate allocations of a fixed budget, an output consisting of which allocations are permissible, and a rule for getting from one to the other that never sums welfare across persons. A friend of mine, a fairly orthodox EA type, insists this is a waste of time because contractualism is just utilitarianism with a veto, and I want to be able to answer him with a requirements list rather than with vibes. I've read the relevant chapter of What We Owe to Each Other twice and skimmed Parfit's argument that the view either collapses into consequentialism or goes empty, so please don't recap the debate; I want the spec.

  So: write the desiderata that any contractualist theory of aggregation must meet to count as adequate — adequate both as moral philosophy and as something statable. For each requirement, give me the case or consideration that motivates it, and be concrete about the cases (one ventilator for a patient who will otherwise die against ten thousand inhalers for asthmatics; a policy that certainly kills one person against a policy that gives each of a million people a one-in-a-million chance of dying; a choice where the affected population depends on the choice itself). I want the formal properties pinned down as well: whether the deliverable is a verdict about acts or about principles, whether the procedure must be complete or may legitimately return ties, whether it must be invariant under relabeling the individuals, whether totals are permitted to appear anywhere at all and if so where, what is supposed to make one person's complaint comparable to another's when there is no common cardinal scale to compare them on, whether complaints are assessed against the actual alternative chosen or against a distribution over outcomes, and how the account is meant to handle non-identity cases and populations of variable size. Then sort the requirements into the ones that are non-negotiable — drop them and you no longer have contractualism, you have consequentialism wearing a Kantian hat — and the ones that are really the contingent commitments of particular camps: the numbers skeptics, the moderate aggregators who let small harms sum up to some threshold, the weighted-lottery people, and those who relocate the whole question to complaints about risk rather than outcomes.

  The part I most want is the impossibility result, if there is one. My working hypothesis is that the following three cannot all hold: the individualist restriction, understood as a flat ban on summing complaints across persons; determinacy in cases where the complaints on both sides are exactly equally strong, which most people want to deliver the result that the greater number should be saved; and some minimal adequacy condition ruling out the consequence that one person's death always outweighs any finite number of much smaller harms, no matter how many and no matter how bad the smaller harms get. Tell me whether that's the right triad or whether I've misdescribed the tension — if a different subset is the real choke point, say which, and say what it costs to give up each member. Also flag any requirement on my list or yours that turns out to be two requirements wearing one trenchcoat, and tell me which single requirement eliminates the largest share of the candidate views. No bibliography, no citations, no name-checking: I'd rather have your reconstruction than your reference list, and I'll chase down whoever I need myself. A two- or three-line scorecard of the main contenders against your list at the very end is welcome, but keep the weight on the criteria and their motivating cases, not on the scoring.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Persona:** Long-time LessWrong/Alignment Forum reader (15 years), technically minded (wants specifications, runnable rules, formal properties), familiar with the literature (Scanlon, Parfit, EA critiques), impatient with vague philosophy ("vibes"), wants concrete desiderata and impossibility results.
      *   **Task:** Define the desiderata for a Scanlonian contractualist theory of aggregation that counts as adequate (both morally and formally). Sort them into non-negotiable vs. contingent. Identify the core impossibility triad (or correct it). Provide a brief scorecard at the end.
      *   **Constraints:** No bibliography, no citations, no name-checking. Focus on criteria and motivating cases. Concrete examples required (ventilator vs. inhalers, certain death vs. risk, variable populations).
      *   **Tone:** Precise, analytical, rigorous, slightly adversarial (answering the EA friend), but respectful of the philosophical depth.

  2.  **Deconstruct the Core Problem:**
      *   The user wants to formalize Scanlonian Contractualism's handling of aggregation (the "Numbers Problem").
      *   Scanlon's core idea: An act is wrong if it violates principles no one could reasonably reject.
      *   The Aggregation Problem: How do we weigh many small complaints against one large complaint without summing utility (which contractualism forbids in principle)?
      *   The User's Hypothesis: A triad of inconsistency involving (1) No Summing, (2) Determinacy (save the greater number in tie-breaks), and (3) Non-Absurdity (one death doesn't always trump infinite minor harms).
      *   My Job: Validate, refine, or correct this triad and build the spec around it.

  3.  **Drafting the Desiderata (The Spec):**
      *   I need to break this down into Input/Output/Process constraints.
      *   *Input:* Set of individuals, set of outcomes/principles.
      *   *Output:* Permissible set (not necessarily singleton).
      *   *Process:* Comparison of complaints.
      *   *Key Constraints:*
          1.  **Individualist Restriction (No Summing):** Complaints are compared person-to-person or group-to-person *without* adding up welfare units.
          2.  **Genericity/Impartiality:** Relabeling individuals shouldn't change outcomes.
          3.  **Complaint Strength:** Needs a metric (ordinal? cardinal? threshold?).
          4.  **Risk/Probability:** How to handle ex-ante vs. ex-post complaints.
          5.  **Non-Identity:** How to handle people who exist in one outcome but not the other.
          6.  **Completeness:** Must return a verdict (or admit ties).

  4.  **Refining the Impossibility Triad:**
      *   The user suggests: (1) No Summing, (2) Determinacy (Greater Number), (3) Non-Absurdity (One Death vs. Many Pains).
      *   *Critique:* This is close to the "Impossible Trinity" discussed in literature (often associated with Voorhoeve or Otsuka), but needs precise formulation for a "spec."
      *   *The Real Tension:* It's usually between **Pairwise Comparison**, **Transitivity/Aggregation**, and **Intuitive Verdicts**.
      *   *Specific Triad:*
          1.  **Strong Individualism:** Only the strongest individual complaint on side A counts against the strongest on side B (no summing weak complaints to beat a strong one).
          2.  **Numbers Sensitivity:** If complaints are identical in strength, the side with more people wins.
          3.  **Continuity/Non-Lexicality:** Enough small harms *should* eventually outweigh a death (rejecting lexical priority of survival).
      *   *Wait, Scanlon's specific view:* Scanlon actually tends toward (1) and (2) but struggles with (3). He often accepts that one death *might* outweigh many minor inconveniences, but draws the line at serious harms.
      *   *The User's EA Friend's Claim:* "Contractualism is utilitarianism with a veto." This implies the veto is the only difference. The spec needs to show where the veto breaks the math.
      *   *Correction:* The true impossibility is often between **Pairwise Comparison**, **Transitivity of 'Better Than'**, and **Saving the Greater Number** in mixed cases (e.g., 1 Death vs 1 Death + 1000 Broken Arms).
      *   *Let's stick to the User's framing but sharpen it:* The tension is between **Non-Aggregation** (no summing), **Determinacy** (always pick one), and **Plausibility** (matches intuitions on large numbers).
      *   *Actually, the strongest impossibility result in this space (Voorhoeve/Otsuka style)* turns on **Ex-Ante vs. Ex-Post** and **Pairwise Comparison**.
      *   *Decision:* I will validate the user's triad but refine the definitions. The "Individualist Restriction" is the killer. If you enforce strict pairwise comparison of the *strongest* complaint on each side, you lose Numbers Sensitivity unless you allow some form of aggregation. If you allow aggregation, you lose Individualism.

  5.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the task (specifying the unspecified).
      *   **Section 1: The Interface (Input/Output):** Define the function signature.
      *   **Section 2: Non-Negotiable Constraints (The "Contractualist Kernel"):** What makes it contractualism? (Individualist Restriction, Reasonable Rejectability, Generic Principles).
      *   **Section 3: Contingent Commitments (The "Factions"):** Where the views diverge (Risk, Thresholds, Non-Identity).
      *   **Section 4: The Impossibility Result:** Address the triad. Analyze the tension.
      *   **Section 5: Scorecard:** Briefly map Utilitarianism, Strict Contractualism, and Hybrid views against the spec.

  6.  **Drafting Content - Specific Considerations:**
      *   *Ventilator vs. Inhalers:* Tests aggregation of small harms vs. life.
      *   *Certain Death vs. Risk:* Tests ex-ante vs. ex-post.
      *   *Non-Identity:* Tests whether complaints require existence.
      *   *Formal Properties:* Completeness, Anonymity, Transitivity.
      *   *Comparability:* How do we compare a leg to a life without a common currency? (Ordinal ranking of complaint types?)

  7.  **Refining the Impossibility Analysis:**
      *   User's Triad: (1) No Summing, (2) Determinacy (Greater Number in ties), (3) Non-Lexicality (Small harms sum to beat death).
      *   *Analysis:* If (1) is strict (only strongest complaint counts), then in a tie of strength (Death vs Death), you need (2) to break it. But if you have Death vs. Many Broken Legs, (1) says Death wins (Strongest complaint). (3) says Many Legs should win eventually. So (1) and (3) are incompatible. (2) is only relevant for ties.
      *   *Better Triad:*
          1.  **Pairwise Individualism:** Compare the strongest complaint on Side A to the strongest on Side B. Ignore the count of weaker complaints.
          2.  **Numbers Sensitivity:** If complaints are equal strength, more people wins.
          3.  **Transitivity/Consistency:** If A > B and B > C, then A > C. (This breaks in "Spectrum Cases").
      *   *Actually, the standard impossibility is:* **Pairwise Comparison** + **Saving the Greater Number** + **Independence of Irrelevant Alternatives** (or similar).
      *   *Let's align with the User's intuition:* The user suspects (1) No Summing, (2) Determinacy, (3) Non-Absurdity.
      *   *My verdict:* The user is mostly right, but "Determinacy" isn't the problem; "Numbers Sensitivity in Non-Identical Cases" is.
      *   *Revised Triad:*
          1.  **Strong Non-Aggregation:** A cluster of weak complaints cannot outweigh a single strong complaint.
          2.  **Weak Aggregation (Numbers Count):** A cluster of *equal* strong complaints outweighs a single strong complaint.
          3.  **Continuity:** There is no lexical gap; sufficiently many small harms *can* outweigh a death.
      *   *Conflict:* 1 and 3 are contradictory. 1 and 2 are the standard Scanlonian compromise (Lexical threshold).
      *   *Wait, the User wants to know if their triad holds.* I should confirm their intuition but clarify the "Determinacy" part. The real issue is **Transitivity** when combining 1 and 2. (The "Cyclical Preferences" problem).
      *   *Okay, I will focus on the "Individualist Restriction" as the single requirement that eliminates the most candidates.*

  8.  **Final Polish:**
      *   Ensure no names are dropped (Scanlon, Parfit, Utilitarianism is okay as a concept but maybe avoid "Nozick" etc.).
      *   Keep it dense and technical.
      *   Make sure the "Spec" looks like a spec.

  9.  **Self-Correction during drafting:**
      *   *Check:* Did I address Non-Identity? Yes, need a specific constraint on "Complaints of Non-Existent Persons."
      *   *Check:* Did I address Risk? Yes, Ex-Ante vs. Ex-Post.
      *   *Check:* Is the EA friend rebuttal clear? Yes, by showing the "Veto" isn't just a cap, it's a structural constraint on the aggregation function.
      *   *Check:* The Impossibility Result. I need to be careful not to just say "it's hard." I need to state the theorem-like conflict. The conflict is typically between **Pairwise Comparison**, **Transitivity**, and **Pareto/Numbers**. I will frame it in the user's terms but correct the "Determinacy" point to "Numbers Sensitivity."

  10. **Final Review against constraints:**
      *   No bibliography? Check.
      *   No name-checking? Check. (Avoid "Scanlon", "Parfit", "Voorhoeve").
      *   Concrete cases? Check.
      *   Scorecard at end? Check.

