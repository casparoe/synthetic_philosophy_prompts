  **MEMORANDUM**

  **TO:** Seminar on Algorithms and Governance
  **FROM:** [Your Name/Expert Consultant]
  **DATE:** October 26, 2023
  **SUBJECT:** Technical Accuracy Audit of Magazine Excerpt on Risk Assessment Impossibility Theorems

  **Introduction**

  You have asked for an evaluation of a paragraph claiming that mathematical theorems prove risk assessment algorithms cannot be fair. Your instinct that the argument is "broadly right" is understandable; the underlying mathematics is real and significant. However, your study partner is also correct: the paragraph is sloppy in ways that distort the policy implications. The text conflates specific technical definitions of fairness with the general concept of justice, and it presents a trade-off between competing fairness goals as a total impossibility of fairness itself.

  Below, I first outline the relevant mathematical background in plain language. I then provide a sentence-by-sentence audit of the text, address your three specific questions regarding the theorem's conditions and implications, and assess the policy conclusion. I close with a revised version of the paragraph that retains its rhetorical weight without misrepresenting the science.

  **Technical Background: The Impossibility Result**

  To understand the audit, we must define three technical terms used in algorithmic fairness:

  1.  **Base Rate:** The underlying frequency of an outcome in a group (e.g., the actual percentage of defendants in a demographic group who reoffend).
  2.  **Calibration:** A property of a risk score where a given score means the same thing for everyone. If a score of "7" implies a 70% chance of reoffending, this must be true for Black defendants and white defendants alike.
  3.  **Error Rate Balance:** This refers to equalizing mistakes across groups. Specifically, it often means equalizing the **False Positive Rate** (the rate at which people who *will not* reoffend are incorrectly flagged as high-risk) and the **False Negative Rate** (the rate at which people who *will* reoffend are incorrectly cleared as low-risk).

  **The Theorem:** Formal results established in the last decade (notably by researchers such as Kleinberg, Mullainathan, Raghavan, and Chouldechova) demonstrate that if two groups have different **base rates**, it is mathematically impossible for an algorithm to satisfy **calibration** and **error rate balance** (both false positive and false negative rates) simultaneously, unless the algorithm is perfectly accurate (which is never the case in social science). You must choose which definition of fairness to prioritize; you cannot have all of them.

  **Sentence-by-Sentence Audit**

  > *"A few years ago, after an investigation found that a commercial recidivism score used in American courts flagged Black defendants as high-risk at roughly twice the rate of white defendants who went on to reoffend..."*

  **Classification: Misleading / Factually Ambiguous.**
  **Correction:** The well-known investigation (ProPublica, 2016) found that Black defendants were flagged at twice the rate of white defendants *who did not reoffend* (False Positives). The text says "who went on to reoffend," which describes True Positives. This conflates the two types of errors.
  **Why it matters:** It confuses the specific empirical finding (disparity in false alarms) with disparity in catching actual recidivists.

  > *"...mathematicians proved something remarkable: this is not a bug that better data or better code could fix."*

  **Classification: Accurate as stated.**
  **Note:** This correctly identifies the issue as structural rather than implementation-specific.

  > *"There is a formal impossibility theorem showing that no risk algorithm can be fair to both groups at the same time."*

  **Classification: Misleading.**
  **Correction:** "Fair" is undefined. The theorem shows no algorithm can satisfy *multiple conflicting definitions of fairness* simultaneously.
  **Why it matters:** It implies fairness itself is impossible, rather than the compatibility of specific statistical metrics.

  > *"The tool was calibrated, which means the score was equally accurate for members of both groups — a Black defendant and a white defendant assigned the same score had the same probability of reoffending."*

  **Classification: Accurate as stated.**
  **Note:** This is the correct technical definition of calibration.

  > *"But once groups differ in their underlying base rates, calibration arithmetically forces the algorithm to hand out more false alarms to the group with the higher base rate."*

  **Classification: Misleading.**
  **Correction:** Calibration forces a *trade-off* in error rates, not specifically more false alarms. One could adjust the algorithm to equalize false alarms, but doing so would violate calibration or increase missed detections (false negatives).
  **Why it matters:** It presents a specific policy choice (prioritizing calibration and accepting false alarm disparity) as a mathematical necessity.

  > *"That is not a defect of this particular instrument; it is a theorem."*

  **Classification: Accurate as stated.**
  **Note:** The trade-off is indeed a mathematical property of probabilistic prediction with unequal base rates.

  > *"What the impossibility result really establishes, then, is that fairness and accuracy are mathematically incompatible..."*

  **Classification: False.**
  **Correction:** The result establishes that *different fairness criteria* are incompatible with each other under imperfect accuracy. Fairness and accuracy are compatible; conflicting fairness definitions are not.
  **Why it matters:** This is a category error. "Accuracy" is not the opposing force to "Fairness" here; one fairness metric is the opposing force to another.

  > *"...and the only intellectually honest response is to stop using risk scores in sentencing altogether, since no version of them can avoid being unjust."*

  **Classification: Normative Leap (Not Mathematically Supported).**
  **Correction:** The math shows you cannot avoid *some* statistical disparity. It does not prove that using the tool is inherently "unjust," as justice may permit trade-offs.
  **Why it matters:** The theorem identifies a constraint, not a prohibition. Abandonment is a political choice, not a mathematical deduction.

  **Addressing Your Three Specific Questions**

  1.  **Is the impossibility unconditional?**
      No. It depends on two critical assumptions the paragraph omits. First, it requires that the groups have **different base rates**. If the underlying reoffending rates were identical across groups, all fairness criteria could be satisfied simultaneously. Second, it requires that we demand **multiple fairness criteria** (calibration plus error rate balance) be met at once. If we are willing to satisfy only one definition of fairness (e.g., calibration alone), the impossibility vanishes.

  2.  **Does calibration force a fixed direction of error-rate disparity?**
      No. The paragraph claims calibration forces "more false alarms" (False Positives) to the group with the higher base rate. While this is what happened in the specific case cited (COMPAS), the mathematics only dictates that *some* error rates must differ. A policymaker could choose to equalize false alarms, but they would then have to accept unequal false negatives (missed recidivists) or violate calibration. The math dictates a trade-off, not a specific direction of bias.

  3.  **Is the slide from "criteria incompatible" to "fairness and accuracy incompatible" licensed?**
      No. This is the most significant conceptual error in the text. "Accuracy" generally refers to the overall rate of correct predictions. It is possible to have a highly accurate model that satisfies one definition of fairness. The conflict is between *competing definitions of fairness* (e.g., treating equal scores as equal risk vs. treating equal error rates as equal treatment). Conflating this with "accuracy" suggests that making the model more precise would solve the problem, or that fairness inherently reduces accuracy, neither of which is the core insight of the theorem.

  **Policy Implications**

  The recommendation to "stop using risk scores" does not follow strictly from the mathematics. The theorems settle that we cannot have it all; they do not settle which metric we should sacrifice. A scholar of this literature would argue that the choice among criteria is **normative**, not mathematical. We must decide, through democratic or legal processes, whether "calibration" (does the score mean the same thing?) or "error rate balance" (are the mistakes distributed equally?) matters more for justice. The math clarifies the cost of that choice, but it does not make the choice for us.

  **Revised Paragraph**

  > "A few years ago, an investigation found that a commercial recidivism score used in American courts flagged Black defendants as high-risk at roughly twice the rate of white defendants who did not reoffend. Mathematicians subsequently proved something remarkable: this is not a bug that better data or better code could fix. There is a formal impossibility theorem showing that when groups have different underlying reoffending rates, no risk algorithm can satisfy all common definitions of fairness at the same time. The tool was calibrated, meaning a Black defendant and a white defendant assigned the same score had the same probability of reoffending. But given the difference in base rates, maintaining calibration arithmetically forces a trade-off: the algorithm must either produce unequal false alarm rates or unequal missed-detection rates between groups. That is not a defect of this particular instrument; it is a theorem. What the impossibility result really establishes, then, is that competing fairness criteria are mathematically incompatible under imperfect prediction. The intellectually honest response is not necessarily to abandon risk scores, but to acknowledge that using them requires a normative choice about which statistical disparities we are willing to accept."

  **Explanation of Revision**

  I corrected the empirical description of the investigation to accurately reflect False Positive Rates rather than Recidivism Rates. I replaced the claim that "fairness" is impossible with the precise claim that "competing fairness criteria" are incompatible, distinguishing technical metrics from the broader concept of justice. Finally, I softened the policy conclusion to reflect that the theorem mandates a choice among trade-offs, rather than mandating the abandonment of the technology itself.
