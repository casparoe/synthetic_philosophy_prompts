answer: |-
  Subject: Prep for Thursday

  Hope you got some sleep after the row with Rob. Here is the prep sheet you asked for, written up so you can read it on the train without the formatting fighting you. I have ordered these by the amount of damage they can do to the core thesis, starting with the ones that threaten to collapse the whole structure and moving down to the ones that are more about implementation or theoretical branding. I have kept the voice of the objector in the first sentence of each paragraph so you can hear the tone they will use in the room, followed immediately by my assessment of the force, the concession you should make, the reply you can give, and the soft spot you need to watch.

  Isn't this just a jobs guarantee with a story attached to hide the deadweight loss and displacement effects? This is the economist's opening salvo and it has the most force because it challenges the novelty and efficiency of your proposal in one go. You must concede immediately that mechanically it resembles a Job Guarantee, otherwise you look like you are ignoring the literature. Your reply is that a standard JG aims at income stabilization and macroeconomic buffering, whereas your programme aims specifically at the restoration of standing through identifiability, which changes the evaluation metric from employment rates to social cohesion metrics. The soft spot here is that if the work is low-productivity by design, the economists will smell make-work immediately, and you have no robust answer for why the taxpayer should fund low-output labour other than the standing argument, which they may reject as unquantifiable.

  Why does paid dependence count as standing and unpaid care doesn't, given your asymmetry example relies on the carer having standing despite no income? The sociologist will hit you with this because it exposes a contradiction in your second move regarding the identifiability condition. You have to concede that your initial formulation was too narrow regarding the source of the need. Your reply is that the programme is not creating standing ex nihilo but formalizing existing dependencies that are currently invisible to the labour market, so the unpaid carer already has the standing you value, whereas the redundant worker has lost it. The soft spot is that this implies standing is independent of the state programme, which undermines your claim that the state must fund this work to repair the harm of automation.

  If standing is positional in the sense you claim, can it actually be distributed without being diluted? The philosopher will ask this to test the coherence of your identifiability condition. You must concede that if everyone is needed equally, the specificity of the need might vanish. Your reply is that standing is not positional in terms of scarcity but in terms of relational specificity; being needed by a specific person is not diminished by others also being needed by specific people, unlike income or rank. The soft spot is that if the state assigns these relationships, they may feel artificial to both parties, rendering the standing inert despite the formal structure.

  Who is the marginal worker in this scheme and does the wage rate create a disincentive for private sector employment? The labour economists will pivot to elasticities once they accept the premise. You should concede that setting the wage is the critical failure point of any such scheme. Your reply is that the wage is calibrated to the standing value, not the productivity value, and is set below the private sector floor to ensure only those seeking the social role rather than just income apply. The soft spot is that this sounds like you are proposing a lower class of worker, which feeds directly into Rob's objection about a second-class labour market.

  Are you not making dignity conditional on labour participation in a way that violates basic freedom? The basic income advocate, likely Rob's colleague, will frame this as a coercion issue. You must concede that conditionality is present here whereas it is not in UBI. Your reply is that freedom from want is secured by UBI, but freedom from irrelevance is not, and your programme offers an option rather than a mandate for those who feel the loss of standing. The soft spot is that if the cultural pressure to take the work is high, the option becomes a coercion in practice, and you have no safeguard against stigma for those who refuse.

  Why are you moralising the wage relation when the anti-work left has spent decades showing how it corrupts social life? The sociologist will return to this to challenge your anti-perfectionist hedge. You should concede that work has historically been used as a tool of discipline. Your reply is that you are not valorizing work itself but the specific relational structure of being needed, which can exist outside the wage relation but currently requires it for most people. The soft spot is that by funneling this through a public works programme, you are inevitably reinforcing the wage relation as the primary site of social value.

  What separates your claim from a recognition-theoretic one I don't want to be saddled with? The philosopher will try to categorize you to dismiss you. You must concede that there is significant overlap with recognition theory. Your reply is that recognition theory focuses on status within a hierarchy, whereas your account focuses on functional necessity within a network, which is material rather than symbolic. The soft spot is that in practice, being needed is experienced as recognition, so the distinction may be too fine to hold up under pressure.

  How would you evaluate the success of this programme without relying on employment metrics? The economists will ask this to trap you in your own lack of metrics. You should concede that standard cost-benefit analysis will fail here. Your reply is that you would use longitudinal surveys on social connectedness and perceived utility rather than output metrics. The soft spot is that policy institutes require hard data for funding, and soft metrics will be dismissed as anecdotal.

  There is one reply that has to land for the whole thing to survive, and it is not about the economics or the philosophy but about the definition of harm. You need to convince them that income replacement is categorically different from role replacement. If you allow them to conflate the two, you lose the room because the economists will prove cash is more efficient and the advocates will prove cash is freer. You must hold the line that money solves the problem of consumption but exacerbates the problem of irrelevance by severing the link between contribution and survival. If you cannot make them feel the specific qualia of being paid to do nothing versus being needed to do something, the rest of the argument is just engineering.

  Regarding the question you are dreading, you are right to worry about the retired, the disabled, and the long-term carer, but I suspect there is a worse one you haven't thought of. The grandmother question is dangerous because it makes you look cruel, but it is technically an edge case you can handle by exempting those groups. The worse question is what happens to the people who do the work in your programme once automation reaches their sector too. If you create a class of people whose job is to be needed by others, and then technology finds a way to automate care or maintenance, you have not solved the problem of standing, you have just delayed it and made the eventual loss more traumatic. You need to prepare an answer for whether standing is resilient to technological substitution or if your programme is just a lifeboat that eventually sinks. The grandmother question implies some people are excluded from standing, but the automation question implies standing itself is fragile, which undermines the core thesis that standing is the solution to automation. I would prepare for the latter as the killer instinct question, even if the former feels more emotionally charged.

  Get some rest before Thursday.

  Best
