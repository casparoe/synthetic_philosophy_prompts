answer: |-
  Colleagues, we are convened to decide whether an association of public policy schools should act as a guardian of democracy or merely as a guild of professionals. The clause before us, written in 1998, requires members to be situated in a polity of good democratic standing. It was easy to ignore when the horizon looked infinite. It is impossible to ignore now. We have before us a Hungarian member whose government has systematically dismantled the checks and balances we teach in our classrooms, yet whose faculty wishes to remain within our fold to resist that dismantling from inside. We have a Warsaw member facing the mirror image of political capture. We have an American member demanding to know if our standards apply to the subnational erosion of voting rights in their own country. We have a committee split between those who say we have no business judging states, those who say we have no business looking away, and those who simply want a rule that does not require us to reconvene every time a election turns sour. I have spent considerable time arguing with myself about this, shifting from the conviction that we must expel members in backsliding states to the realization that doing so would be a performative act of purity that sacrifices the very people we ought to protect. I am writing this memo to recommend that we strike the phrase good democratic standing from our charter entirely, while rigorously strengthening and enforcing the requirement of institutional autonomy. This is not a compromise. It is a recognition of our limits and our purpose.

  The faction arguing that this exercise is a category error is correct on the question of mandate. We are an association of schools, not a council of Europe or a human rights tribunal. When we attempt to adjudicate the democratic standing of a sovereign polity, we step onto ground where we have no expertise and no legitimacy. We do not have the tools to measure democratic health in a way that is falsifiable rather than subjective. If we retain this clause, we invite the accusation that we are merely a club of likeminded liberals expelling members whose governments we dislike. This is the strongest argument of the abolitionists: that by claiming a authority we do not possess, we undermine the credibility of the association and provide authoritarian governments with a convenient narrative that we are foreign agents imposing external values. Furthermore, as the American member has pointed out, if we claim the right to judge the democratic standing of Hungary, we must logically claim the right to judge the democratic standing of individual American states or shifting coalitions in Warsaw. To do otherwise is hypocrisy. To do so consistently is to turn our general assembly into a perpetual courtroom where every member is potentially on trial based on the latest election returns. We cannot build a stable association on such shifting sands.

  However, the faction arguing that silence is complicity is also correct on the question of consequence. To pretend that the playing field in Hungary is level is to engage in a fiction that benefits the government there. Refusing to name the erosion of democratic norms is itself a political act, one that favors the aggressor by treating the destruction of institutions as normal business. If we strike the clause simply to avoid discomfort, we abandon the normative core of public policy education. We teach that institutions matter, that checks and balances matter, that the rule of law matters. We cannot teach those things while pretending they do not exist in the places where our members live. The interventionists are right that neutrality in the face of asymmetry is not neutrality. But they are wrong to think that expulsion is the only way to name the reality. Expelling the Hungarian school does not punish the government. It punishes the faculty who are resisting the government. It removes their platform, isolates their students, and hands the victory to the very leaders we claim to oppose. It allows the government to say that even the international academics have abandoned the opposition.

  Therefore, my recommendation is to strike the requirement of good democratic standing but to replace it with a granular, enforceable standard of institutional autonomy that focuses on the school's operational environment rather than the state's constitutional status. We cannot judge the state, but we can judge whether the state allows the school to function. The rule we adopt for future cases, including the American one, must be this: membership is contingent on the school's demonstrable capacity to hire, teach, and publish without state interference or retaliatory funding cuts. We do not ask if the election was fair. We ask if the school can criticize the election result without losing its accreditation or budget. We do not ask if the media is free. We ask if the faculty can publish research contradicting the government without fear of prosecution. This shifts the gaze from the macro-politics of the regime to the micro-politics of the academy. It applies equally to Budapest, Warsaw, and Austin. If a state passes laws that restrict voting, that is not our business unless those laws specifically prevent our students from organizing or our faculty from studying them. If a government captures the courts, that is not our business unless those courts are used to shut down our classrooms.

  This approach satisfies the proceduralists by giving us a clear metric that does not require annual re-litigation of regime type. It satisfies the abolitionists by acknowledging we are not judges of sovereign states. It partially satisfies the interventionists by allowing us to document and censure specific infringements on academic freedom without severing the lifeline to the members who need us most. In the case of Hungary, we retain the member but issue a formal finding that the environment is hostile, committing the association to monitor specific indicators of autonomy rather than general democratic health. In the case of the American member, we affirm that state-level voting restrictions do not trigger expulsion unless they directly impede the school's operational autonomy. This is consistent. It is not safe, because it requires us to watch closely and speak specifically, but it is honest.

  I must acknowledge the cost of this recommendation. The losing side, those who want to name the democratic backsliding directly, are right that this leaves a moral residue. By striking the clause, we accept that we will not be the body that declares a government undemocratic. We are choosing utility over purity. We are choosing to keep a foothold in the darkness rather than lock the door and claim the house is clean. The strongest argument against my view is that this legitimizes the regime by allowing its schools to fly our flag. I accept this risk. I believe the greater legitimacy is conferred by the presence of critical scholars inside the system than by their exile outside it.

  There is evidence that would make me change this recommendation. If the Hungarian government moves from capturing the environment to directly seizing the school's governance, such as appointing the dean or dictating the curriculum, then institutional autonomy is no longer a viable standard because it no longer exists. At that point, the school is no longer a school but a state agency, and membership must be revoked. Until that line is crossed, however, we stay. We do not judge the polity. We protect the practice. We keep the door open for those who teach democracy where it is hardest to find.
