answer: |-
  You have correctly identified the trap. A clean story is a lie, but a messy story is unreadable. With one thousand hours and four volunteers, you cannot solve the philosophy of history. You can only manage the integrity of your sources and the honesty of your presentation.

  Here is the ranking of where your effort belongs, based on visitor impact, tractability with your specific tools, and the preservation of human interest.

  ### 1. The Reconstruction of Memory (Interviews)
  **Effort Allocation:** 40% of research time.
  **Why it ranks first:** This is your highest-impact vulnerability. Visitors trust human voices over wall text. If a survivor says, "We knew the levee would break," and you print that without qualification, you have institutionalized a lie. Unlike newspaper clippings, oral history is fluid; it changes every time it is told. If you do not arrest that drift now, the exhibit becomes a collection of myths rather than a record of events.
  **Tractability:** High. You have the newspaper morgue. You can fact-check the interviews in real-time.
  **Human Interest:** Preserved. In fact, highlighting the discrepancy between what someone *felt* in 1997 and what they *remember* now adds psychological depth. It turns the interview from a testimony into a character study.
  **How to execute:** Do not hide the contradiction. Use it. If a subject claims the warning was clear in 1997, place their quote next to a 1997 headline that shows the ambiguity. You do not need to call the liar a liar; you simply need to let the visitor see the gap. This costs no extra fabrication money, only editorial discipline.

  ### 2. The Decision Environment (Foreseeable vs. Foreseen + Actionability)
  **Effort Allocation:** 40% of research time.
  **Why it ranks second:** This addresses the "warning ignored" narrative and the class/power dynamic you noted. Hindsight bias convinces visitors that the outcome was inevitable. Your job is to reconstruct the fog of 1997. You must distinguish between what was *technically* foreseeable (engineers might have known) and what was *actually* foreseen by the people with the power to act (council members, business owners).
  **Tractability:** High. This is pure newspaper morgue work. You are looking for the signal-to-noise ratio of the time. How many stories about the levee appeared in 1996 compared to stories about zoning permits?
  **Human Interest:** Preserved. This prevents the exhibit from becoming a simplistic villain hunt. It makes the tragedy more profound if the visitors understand that good people made reasonable decisions based on incomplete information. That is more haunting than a story about reckless villains.
  **How to execute:** Focus your wall text on the constraints of the time. If a warning was issued but no money existed to fix the problem, state the budget numbers, not just the warning. This addresses the "actionability" problem without needing a sociological treatise.

  ### 3. What to Set Aside
  **A. Narrative Structure (The Beginning/Middle/End Problem)**
  **Verdict:** Deliberately ignore the philosophical problem; accept the tool.
  **Reasoning:** You cannot build an exhibit without a sequence. Trying to deconstruct the narrative form within a physical space usually results in a confusing maze that visitors abandon after five minutes. A linear path is a distortion, yes, but it is the only way to get the visitor from the door to the exit.
  **Sacrifice:** You are sacrificing methodological purity for communication. A perfect, non-linear truth that no one reads teaches nothing. A linear story that admits its own limitations teaches something.
  **Mitigation:** Use the "Editor's Note" approach. A single panel at the entrance or exit can acknowledge that the story has been shaped for clarity and that the past was less orderly than the room suggests. This costs one panel and saves you hundreds of hours of structural agonizing.

  **B. Sample Bias (Who agreed to be interviewed)**
  **Verdict:** Acknowledge, do not fix.
  **Reasoning:** You cannot force the silent survivors to talk. You cannot manufacture a representative sample with four volunteers.
  **Sacrifice:** You are sacrificing statistical validity for available evidence.
  **Mitigation:** State clearly on the wall: "Voices from the flood: 12 interviews conducted." Do not claim these voices represent everyone. Visitors are smart enough to understand that these are *some* stories, not *all* stories.

  **C. Retrospective Document Reading**
  **Verdict:** Merge into Priority #2.
  **Reasoning:** This is a subset of reconstructing the decision environment. Do not treat it as a separate philosophical hurdle. It is simply a research discipline: read the 1997 articles before you read the 1998 articles.

  ### Trade-Offs and Sacrifices
  If I must choose between **Human Interest** and **Bias Correction**, I would sacrifice a small amount of **Human Interest** to secure **Bias Correction**.
  *Why:* A compelling lie is dangerous in a historical exhibit, particularly one about a tragedy involving death. If the exhibit manufactures hindsight bias, it teaches visitors that disasters are caused by stupidity rather than complexity. That lesson makes them less safe in the future. However, you do not need to sacrifice *all* human interest. As noted above, the tension between memory and record is itself interesting. It creates drama. The only thing you lose is the *comfort* of a story where everything makes sense. That comfort is what you should be willing to kill.

  ### What Would Change This Ranking?
  There are three facts that, if true, would force me to reorder these priorities:

  1.  **If the Newspaper Morgue is Incomplete:** If your local archives for 1994–2001 are missing key months or lack the specific local papers, Priority #2 (Decision Environment) becomes untractable. You would have to shift that effort into finding private diaries, letters, or minutes from council meetings, or drop the "Foreseeable vs. Foreseen" angle entirely and focus almost exclusively on the oral history (Priority #1), with heavy caveats.
  2.  **If There Is Active Litigation or Political Fallout:** If the 1998 flood is currently the subject of lawsuits, insurance disputes, or active town council controversy, the "Decision Environment" becomes a legal minefield. In this case, you would move **Sample Bias** up the list. You would need to be extremely careful not to privilege the voices of one side of the dispute. The exhibit would need to become more about "Community Experience" and less about "Causal History."
  3.  **If the Survivor Pool is Tiny:** If there are fewer than five survivors left willing to talk, **Sample Bias** becomes critical. You cannot present five people as a chorus. You would have to frame the exhibit explicitly as "Five Perspectives," which changes the entire scope from a town history to a specific oral history project. This would reduce the pressure to create a grand narrative, allowing you to set aside the **Narrative Structure** problem even more confidently.

  ### Summary
  You have the tools to fix the data (interviews and clippings). You do not have the tools to fix the philosophy (narrative structure). Spend your thousand hours ensuring the data is honest, even when it contradicts the story. Let the story be the vessel, but do not let it become the master. A visitor who leaves thinking, "It was more complicated than I thought," has learned more than a visitor who leaves thinking, "I know exactly what happened."
