          *   *Steelmaners:* Default to good faith. Accusations of bad faith are unfalsifiable/exilic. Destroys discourse.
          *   *Motive-Checkers (Gatekeepers):* Bad faith is detectable (tells). Defaulting to good faith allows capture by organized bad actors. Rigor is expensive/free-rider problem.
      *   **User's Hypothesis:** It's not a factual dispute about *if* bad faith exists, but a value commitment about *which error is catastrophic* (False Accusation vs. False Acceptance). This makes evidence weighting asymmetric and the stalemate permanent unless values are negotiated.
      *   **User's Request:**
          1.  Diagnose the stalemate (Is it the loss-function hypothesis? Level confusion? Hidden empirical question?).
