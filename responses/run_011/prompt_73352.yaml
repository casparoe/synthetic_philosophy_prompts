answer: |-
  Here is a operational triage procedure designed for a handling editor. It is grounded in the methodological consensus of evolutionary biology (e.g., Williams 1966, Maynard Smith 1978, Gould & Lewontin 1979) regarding what constitutes a testable evolutionary claim, without requiring you to settle the live debates about how *common* adaptation actually is.

  ### The Evolutionary Claim Triage (ECT)
  **Time:** 20 Minutes
  **Goal:** Filter out unfalsifiable narratives; pass methodological rigor to reviewers.

  #### The 5-Question Checklist

  **Q1: Is there a stated Null Hypothesis?**
  *   **The Standard:** An adaptation claim is a positive claim. It must state what it is *not*. The null is typically "the trait distribution is explained by drift, constraint, or byproduct of another selected trait."
  *   **Pass:** The introduction explicitly states: "We test the hypothesis that X is an adaptation against the null that X is a byproduct of Y" or similar.
  *   **Fail:** The paper assumes adaptation is the default and only seeks evidence *for* it.
  *   **Action:** **Desk Reject.** (This is settled methodology; without a null, it is a just-so story).

  **Q2: Is there evidence of Variation and Transmissibility?**
  *   **The Standard:** Selection cannot act without variation in the trait, and the trait must be heritable (genetically or culturally).
  *   **Pass:** The paper demonstrates variation in the population and provides evidence (citation or data) that the trait is heritable or culturally transmissible.
  *   **Fail:** The paper assumes the trait is universal or fixed, or assumes heritability without citation in a species/context where it is contested.
  *   **Action:** **Desk Reject** (if universal/fixed) or **Pass to Reviewer** (if heritability is cited but not measured in this study). *Editor Note: You cannot judge the quality of the heritability estimate; that is for the reviewer. You only check if it is acknowledged as a necessary condition.*

  **Q3: Is the link to Fitness (or Proxy) Plausible?**
  *   **The Standard:** Adaptations must solve a problem of survival or reproduction. In humans, direct fitness is rarely available, so proxies (e.g., income, health, social status) are used.
  *   **Pass:** The authors justify *why* their proxy (e.g., "number of mates," "group retention") correlates with reproductive success in this context.
  *   **Fail:** The authors assume a proxy (e.g., "higher score on psychology scale") equals fitness without justification.
  *   **Action:** **Pass to Stats Editor/Reviewer.** (Do not desk reject here. The *logic* of the proxy is a methodological dispute for reviewers, not an editorial logic gate).

  **Q4: Are Alternative Explanations Explicitly Modeled or Tested?**
  *   **The Standard:** To distinguish adaptation from byproduct/constraint, you must show the data fits the adaptation model *better* than the alternative.
  *   **Pass:** The authors include at least one non-adaptive model (e.g., "social role," "physiological constraint," "drift") and compare fit.
  *   **Fail:** The authors mention alternatives in the discussion only to dismiss them verbally.
  *   **Action:** **Desk Reject** (if no alternative is tested/modeled). **Pass to Reviewer** (if alternatives are tested but you doubt the statistical comparison).

  **Q5: Is Phylogeny/Independence Controlled?**
  *   **The Standard:** Data points must be independent. In cross-cultural or comparative work, shared history creates pseudoreplication.
  *   **Pass:** Uses phylogenetic comparative methods or controls for cultural/linguistic family.
  *   **Fail:** Treats cultures/species as independent data points without correction.
  *   **Action:** **Pass to Stats Editor.** (This is a technical statistical violation, not a conceptual one. Let the stats editor flag it).

  ---

  ### Decision Matrix

  | Outcome | Criteria | Action |
  | :--- | :--- | :--- |
  | **Desk Reject** | Fails Q1 (No Null) OR Fails Q2 (No Variation) OR Fails Q4 (No Alternatives Tested). | Send standard rejection. Cite lack of falsifiability. |
  | **Send to Review** | Passes Q1, Q2, Q4. | Select reviewers from *both* camps (adaptationist and skeptic). |
  | **Consult Stats Editor** | Passes Q1, Q2, Q4, but Q3 (Proxy) or Q5 (Independence) is weak. | Do not reject yet. Ask stats editor if the flaw is fatal or fixable. |

  ---

  ### Editor vs. Reviewer Boundaries

  *   **You Decide (Logic & Structure):** Is the argument falsifiable? Did they state a null? Did they test an alternative? Is the claim logically coherent (e.g., distinguishing proximate mechanism from ultimate function)?
  *   **Reviewers Decide (Evidence Quality):** Is the heritability estimate accurate? Is the fitness proxy valid? Is the statistical power sufficient? Is the phylogenetic control robust?
  *   **Stats Editor Decides (Technical Validity):** Are the p-values correct? Is the model specification appropriate for the data structure?

  ---

  ### Application to Your Submissions

  Here is how the ECT runs on the two papers on your desk.

  #### Submission A: Cross-Cultural Sex Differences in Mate Preferences
  *   **Claim:** Men prefer youth, women prefer resources; this is a sexually selected adaptation.
  *   **Q1 (Null):** **Fail.** The paper treats Parental Investment Theory as the baseline. It does not test against a null of "social role conditioning" or "media exposure," it merely asserts them as less likely.
  *   **Q2 (Variation):** **Pass.** There is cross-cultural variation reported.
  *   **Q3 (Fitness):** **Weak.** Uses "marriage stability" as a proxy for fitness. Justification is thin. (Pass to Reviewer).
  *   **Q4 (Alternatives):** **Fail.** Social role variables are included as covariates, but the model is not structured to test if the *adaptation model* fits better than the *social role model*. It assumes the adaptation model is true and checks if social roles interfere.
  *   **Q5 (Phylogeny):** **Fail.** Treats 37 cultures as independent points without controlling for linguistic/colonial history. (Pass to Stats Editor).
  *   **ECT Verdict:** **Desk Reject.**
  *   **Reason:** Fails Q1 and Q4. It is a correlation study dressed as an evolutionary test. It does not attempt to falsify the adaptation claim.

  #### Submission B: Religious Ritual as Costly Signal (Belief = Byproduct)
  *   **Claim:** Belief is a byproduct of Hyperactive Agency Detection (HADD); Ritual is an adaptation (costly signal) selected to stabilize cooperation.
  *   **Q1 (Null):** **Pass.** Explicitly states null: Ritual frequency is a byproduct of group size (drift) or ecological stress (constraint).
  *   **Q2 (Variation):** **Pass.** Variation in ritual cost across groups is measured. Cultural transmission is cited.
  *   **Q3 (Fitness):** **Pass.** Uses "group longevity/survival" as a proxy for cultural fitness. Justified via literature on group competition.
  *   **Q4 (Alternatives):** **Pass.** Compares the Costly Signal model against a "Coercion Model" (elites forcing ritual) and a "Drift Model." The Signal model has better fit.
  *   **Q5 (Phylogeny):** **Weak.** Controls for region, but not full phylogeny. (Pass to Stats Editor).
  *   **ECT Verdict:** **Send to Review.**
  *   **Reason:** Passes Q1, Q2, Q4. The logic distinguishes mechanism (byproduct) from function (adaptation), which satisfies the requirement to avoid "pan-adaptationism."

  ---

  ### The "Plain Truth" (Where this contradicts your intuition)

  You likely view **Submission A (Sex Differences)** as "solid, classic behavioral ecology" and **Submission B (Religion)** as "speculative, theoretical fluff."

  **The ECT forces you to reverse this.**

  Submission A is the one making the unfalsifiable "just-so" claim. It assumes adaptation without testing alternatives, relying on the authority of a classic theory rather than methodological rigor. It is exactly the kind of paper the "anti-adaptationist" reviewers hate, and they are methodologically correct to hate it.

  Submission B is the one doing the rigorous evolutionary work. By explicitly separating the byproduct (belief) from the adaptation (ritual) and testing against non-adaptive nulls, it adheres closer to the philosophy of biology (Gould & Lewontin's warning against assuming every trait is an adaptation) than the sex difference paper does.

  If you desk reject B and accept A, you are not judging on evolutionary rigor; you are judging on **topic familiarity**. The ECT exposes that the "classic" paper is actually the methodological "just-so story," while the "speculative" paper is the one actually testing evolutionary hypotheses.

  ---

  ### Settled Science vs. Live Fights

  To prevent appeals, you must know what is non-negotiable (Settled) and what is up for debate (Live).

  **Settled (You can enforce these):**
  1.  **Adaptation is a hypothesis, not an assumption.** (Williams 1966). A paper cannot start by assuming a trait is adaptive.
  2.  **Selection requires variation.** If a trait is presented as universal and fixed, it cannot be analyzed as a current adaptation without explaining how variation was removed.
  3.  **Correlation is not evidence of selection.** Showing a trait correlates with a benefit *now* does not prove it was selected *for* that benefit historically (the "Current Utility" vs. "Evolutionary Function" distinction).
  4.  **Data points must be independent.** Pseudoreplication via phylogeny/culture is a statistical error, not a theoretical disagreement.

  **Live Fights (Do not use these for Desk Rejects):**
  1.  **The validity of fitness proxies in humans.** Some reviewers believe only genetic offspring count; others accept wealth/status. This is a reviewer debate, not an editorial gate.
  2.  **The prevalence of adaptation.** Whether "most" traits are adaptations or byproducts is a metaphysical stance. A paper can argue for adaptation *if* they test the null, even if the reviewer believes adaptations are rare.
  3.  **Group Selection / Cultural Evolution.** Whether group-level traits can be "adaptations" is debated. However, if a paper *models* cultural selection, it is methodologically valid to send for review, even if a reviewer disagrees with the premise.
  4.  **Optimality Models.** Whether a mathematical model alone constitutes evidence is debated. Do not desk reject a paper that is purely theoretical/modeling if the logic holds; send it to a theorist reviewer.

  ### Final Instruction for Your Decision Letter
  When you desk reject based on the ECT, do not say "The evolutionary claim is wrong." Say: **"The manuscript posits an evolutionary explanation but does not structure the analysis to falsify it against a non-adaptive null hypothesis. This renders the claim untestable within the scope of this journal's standards for evolutionary inference."**

  This grounds the rejection in *methodology*, which is your jurisdiction, rather than *theory*, which is the reviewers' jurisdiction.
