      *   **Problem:** Desk full of evolutionary explanation papers (adaptation vs. byproduct vs. drift/constraint). Reviewers are polarized (adaptationists vs. anti-adaptationists). Appeals are common.
      *   **Task:** Create a *single procedure* (checklist/flowchart) runnable in ~20 minutes by a non-specialist editor to decide on desk rejection vs. review.
      *   **Requirements:**
          *   Questions in order.
          *   Criteria for "decent answer."
          *   Stop/Go signals (Desk Reject vs. Continue).
          *   Distinguish what the editor decides vs. what goes to reviewers/stats editor.
          *   Grounded in philosophy of biology/behavioral ecology (testability, evidence types).
          *   Operational, not a literature review.
          *   Apply the procedure to two specific submissions (Sex differences in mate preferences; Religious ritual as costly signal).
          *   **Crucial Constraint:** "I expect it to come out against something I'd already made my mind up about — say so plainly." (This implies I need to make a assumption about the editor's bias or simply ensure the procedure is rigorous enough to challenge common intuitions. I will assume the editor might lean towards one side, but the procedure must be neutral. Actually, the prompt says "say so plainly" regarding the outcome contradicting their pre-existing mind. I need to simulate the outcome of the procedure on the cases and highlight where it might contradict a typical editorial bias.)
          *   **Crucial Constraint:** Separate settled science from live debates. Don't present one camp's doctrine as standard.

  2.  **Deconstruct the Scientific/Philosophical Grounding:**
      *   *Adaptationism:* Requires evidence of design, function, and history (Williams 1966, Maynard Smith 1978). Null hypothesis is often "no adaptation" (Gould & Lewontin 1979).
      *   *Byproducts (Spandrels):* Traits correlated with adaptations but not selected for themselves.
      *   *Drift/Constraint:* Non-selective evolutionary forces.
      *   *Consensus:* Adaptation claims require more than just "it looks useful." They need comparative data, heritability, variation, and ideally, a link to fitness. However, in human behavioral ecology (HBE), direct fitness measures are often impossible, so proxies are used.
      *   *Live Debate:* How much evidence is *enough* to claim adaptation? Is optimality modeling sufficient? How do we handle cultural evolution in humans?
      *   *Settled:* "Just-so stories" (plausibility without testing) are insufficient. Null hypotheses matter. Correlation $\neq$ Causation/Selection.

  3.  **Drafting the Procedure (The "20-Minute Triage"):**
      *   *Goal:* Filter out unfalsifiable narratives without blocking legitimate hypothesis testing.
      *   *Step 1: The Null Hypothesis.* Did they state what they are testing *against*? (Settled: You need a null).
      *   *Step 2: Variation & Heritability.* Is there variation? Is it heritable (or culturally transmissible)? (Settled: Selection needs variation).
      *   *Step 3: Functional Link.* Is there evidence linking the trait to the proposed benefit *now*? (Settled: Current utility $\neq$ historical selection, but lack of current utility kills the claim).
      *   *Step 4: Alternative Explanations.* Did they explicitly model or test at least one non-adaptive alternative? (Live debate: How many? But *one* is a minimum bar).
      *   *Step 5: Phylogeny/Comparative.* (For animal/cross-cultural). Did they control for shared history? (Settled: Independence of data points).
      *   *Editor vs. Reviewer:* Editor checks for *presence* of these elements, not the *quality* of the statistical execution (that's for reviewers/stats editor).

  4.  **Refining the Procedure for the Editor:**
      *   Make it a checklist.
      *   Define "Pass" vs. "Fail."
      *   Identify the "Editor's Call" vs. "Reviewer's Call."

  5.  **Applying to Case 1: Sex Differences in Mate Preferences (Adaptation Claim).**
      *   *Typical Paper:* Survey across cultures, men prefer youth, women prefer resources. Claims parental investment theory.
      *   *Procedure Check:*
          *   Null stated? (Often no, assumed universal).
          *   Variation? (Yes, across cultures).
          *   Heritability? (Usually assumed, rarely measured).
          *   Alternatives? (Social role theory, media influence).
          *   Phylogeny? (Cultural non-independence).
      *   *Outcome:* Likely Desk Reject or Major Revision based on lack of alternative testing/heritability evidence. *Contradiction:* Editor might want to publish because it's a "classic" topic, but the procedure flags it as methodologically weak on evolutionary grounds.

  6.  **Applying to Case 2: Religious Ritual as Costly Signal (Byproduct/Adaptation Mix).**
      *   *Typical Paper:* Rituals are costly. Belief is byproduct (HADD). Ritual selected for group cohesion.
      *   *Procedure Check:*
          *   Null stated? (Maybe).
          *   Variation? (Yes, across groups).
          *   Functional Link? (Cost correlates with group survival?).
          *   Alternatives? (Ritual as manipulation, drift).
          *   Distinction:* They separate belief (byproduct) from ritual (adaptation). This is sophisticated.
      *   *Outcome:* Likely Send to Review. *Contradiction:* Editor might be skeptical of "group selection" vibes, but the procedure validates the distinction between trait and mechanism.

  7.  **Addressing the "Say So Plainly" Constraint:**
      *   I need to explicitly state where the procedure might contradict a common editorial intuition.
      *   *Common Intuition:* "Sex difference papers are standard/popular." *Procedure:* "Desk reject without heritability/alternative controls."
      *   *Common Intuition:* "Religion papers are speculative." *Procedure:* "Send to review if they distinguish mechanism from function."
      *   *Wait, the prompt says:* "I expect it to come out against something I'd already made my mind up about."
      *   *Strategy:* I will assume the Editor is likely skeptical of the Religion paper (too speculative) and accepting of the Sex Difference paper (established literature). I will show how the procedure flips this.

  8.  **Addressing "Settled vs. Live Fight":**
      *   *Settled:* Need variation, need null hypothesis, need to distinguish current utility from historical selection, need phylogenetic control.
      *   *Live:* How to measure fitness in humans, validity of proxies, weight of cultural evolution vs. genetic evolution, threshold for claiming "adaptation" vs. "exaptation."

  9.  **Drafting the Content (Iterative refinement):**
      *   *Intro:* Acknowledge the polarization.
      *   *The Protocol:* "The Evolutionary Claim Triage (ECT)." 5 Questions.
      *   *Decision Matrix:* When to desk reject.
      *   *Role Separation:* Editor (Logic/Structure) vs. Reviewer (Stats/Evidence Quality).
      *   *Case Studies:* Run the ECT.
      *   *The "Plain Truth":* Highlight the bias flip.
      *   *Settled vs. Live:* Explicit section.

  10. **Review against Constraints:**
      *   20 minutes? Yes, checklist is short.
      *   Non-specialist? Yes, avoids heavy jargon.
      *   Grounded in philosophy? Yes (Williams, Gould, Maynard Smith principles).
      *   Operational? Yes.
      *   Two cases? Yes.
      *   Contradict pre-existing mind? Yes, I will frame it to challenge the "Classic HBE" bias.
      *   Settled vs. Live? Yes.

  11. **Final Polish:** Ensure tone is professional, empathetic to the editor's burden, but rigorous. (Self-Correction: Make sure I don't sound like I'm taking a side in the adaptationist debate, but rather enforcing methodological rigor that *both* sides claim to want.)

      *Refining the "Contradiction":* The prompt says "I expect it to come out against something I'd already made my mind up about." This is slightly ambiguous. Does it mean the *procedure* will contradict the *editor's* mind, or the *output of the procedure* will contradict the *editor's expectation of the procedure*?
      *Interpretation:* The editor likely has a bias (e.g., "Sex diff papers are solid, Religion papers are fluff"). The procedure should show that the Sex diff paper is actually methodologically weaker on evolutionary grounds than the Religion paper. I will make this explicit.

      *Refining "Settled vs. Live":* Be careful not to present Adaptationism as "settled." The *method* for testing is settled (need evidence), the *prevalence* of adaptation is live.

      *Refining the Procedure:* Make sure Q3 (Fitness Proxy) is clear. Editors can't judge stats, but they can judge if a proxy is *plausible*.

      *Let's build the "Evolutionary Claim Triage (ECT)"*
