answer: |-
  Normative principles do not require executable algorithms to be true. Consider a moral rule: do not steal. I might be uncertain whether a particular object belongs to someone, but that uncertainty doesn't dissolve the rule; it just means I must be careful before acting. Similarly, the epistemic norm is conditional on the fact of knowledge, not on my certification of it. If I know, the evidence is misleading, and I am permitted to dismiss it. If I don't know, I am not permitted. The possibility that I might misapply the rule doesn't show the rule is false, only that claiming knowledge is risky.

  Knowledge functions as a state that changes normative standing, not a label I stick on beliefs after inspection. When I genuinely know, my belief is already anchored to the truth; the work of evidence is done. To insist I must keep checking is to insist I treat known truths as mere probabilities. I am willing to concede that I cannot always tell when I cross the threshold into knowledge, but why should the existence of the threshold depend on my ability to see it from the other side?
