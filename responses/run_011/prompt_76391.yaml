      **Autonomix™ Model CI-404 Counterfactual Intervener**
      **Revision 3.1 | Causal Assurance Systems, Inc.**

      **1. Overview and Intended Use**
      The Autonomix™ CI-404 is an implanted neuro-regulatory unit designed to align actualized decisions with pre-configured outcomes. During normal operation, the device remains passive, allowing user agency to proceed without interference. Intervention occurs only if the Detection Module identifies a divergence trajectory toward a non-configured outcome. Upon detection, the Unit introduces a minimal causal nudge to restore alignment. The CI-404 ensures that the configured outcome obtains, regardless of the user's initial inclination. This provides certainty in high-stakes decision environments where deviation carries unacceptable risk. The device does not alter user character, memory, or perceived volition. It functions solely as a safeguard against unintended divergence.

      **2. Before Your First Decision**
      Prior to activation, users must configure the Desired Outcome via the external programmer. Once set, the Device monitors neural precursors to decision events. Users may experience residual hesitation or micro-tremors during the decision window. These are normal artifacts of the monitoring process and do not indicate device failure. While the configured outcome is guaranteed to obtain, the presence of these artifacts confirms that the alternative pathway was physically accessible prior to intervention. The manufacturer concedes that the sensation of almost-choosing otherwise may persist. However, this sensation does not constitute a valid alternative possibility in the final causal chain. Users should not interpret the presence of hesitation as evidence that the Device was unnecessary.

      **3. Operating the Detection Module**
      The Detection Module operates in two modes: Correlative and Causal. In Correlative Mode, the Device fires upon detecting signs that strongly predict divergence. This setting allows for a margin of error where the user might have self-corrected without intervention. In Causal Mode, the Device fires only upon detecting a state that guarantees divergence. Causal Mode reduces unnecessary interventions but requires deeper neural access. Users selecting Correlative Mode acknowledge that some interventions may occur where the user would have eventually aligned voluntarily. Users selecting Causal Mode acknowledge that detection occurs later in the decision timeline. Both modes ensure the configured outcome is realized. Selection is irreversible after implantation.

      **4. Troubleshooting**
      If the Device behaves unexpectedly, consult the following table. Do not attempt to recalibrate the intervention vector manually.

      | Symptom | Probable Cause | Corrective Action |
      | :--- | :--- | :--- |
      | Outcome matches config, but user feels no choice was made | Intervention fired unnecessarily | Log event; continue use |
      | Outcome differs from config | Device failure or power loss | Contact support immediately |
      | User detects intervention prior to decision | Detector visibility leak | See Recall Notice (Section 8) |

      **5. Safety Warnings: What Your Device Cannot Do**
      The CI-404 cannot override physical impossibilities. If the configured outcome is physically impossible given the user's circumstances, the Device will enter standby mode. Furthermore, the Device cannot distinguish between outcomes that are unavoidable due to physical constraint and outcomes that are unavoidable only in a sense that matters to moral assessment. Users should not rely on the Device to establish moral innocence. The Device ensures the outcome obtains; it does not certify the metaphysical status of the agent during procurement. If the outcome was inevitable due to external factors, the Device may still fire. This redundancy does not validate the user's capacity to have done otherwise.

      **6. Accessories and Optional Modules**
      The Silent-Trace™ Upgrade (Model ST-1) is available for users concerned about detectable prior signs of intervention. Earlier revisions (2.0–2.9) emitted a detectable neural signature prior to intervention, allowing users to anticipate the Device's action. Revision 3.0 eliminates this signature while maintaining outcome guarantee. This upgrade remedies a design flaw wherein users could anticipate intervention and adjust their psychological state accordingly. The ST-1 module ensures that no detectable sign precedes the configured outcome. Users upgrading from Rev 2.0 acknowledge that previous data regarding their decision processes may be compromised by the visibility of the detector. Revision history is available upon request.

      **7. Warranty and Limitation of Liability**
      Causal Assurance Systems, Inc. accepts full liability for negative outcomes resulting from Device intervention. If the Device forces a harmful outcome, the manufacturer assumes responsibility. However, the manufacturer declines credit for positive outcomes achieved during normal operation. If the user aligns with the Desired Outcome without intervention, the success is attributed solely to the user, even if the Device was active and ready to fire. This policy applies even if the user's character, history, or circumstances already fixed the outcome without the Device. In such cases, the Device serves only as a demonstrative tool. The manufacturer makes no claim regarding what the Device demonstrates in cases of pre-determined alignment. Users whose causal chains were already fixed acknowledge that the Device adds no new capacity for avoidance.

      **8. Recall Notice**
      Batch 88-B is subject to voluntary recall. Detectors in this batch proved readable in advance by the user. Consequently, users in this batch were tested only under conditions that presupposed the matter in dispute. Data collected from Batch 88-B regarding alternative possibilities is considered invalid. Users with Batch 88-B implants should schedule replacement to ensure epistemic opacity. Failure to replace may result in compromised liability protections. The manufacturer regrets any confusion regarding the validity of test conditions during the affected period.

      **Compliance:** Meets ISO-9001 Causal Standards.
      **Note:** Regarding the question of whether the user could have done otherwise: The manufacturer maintains that, conditional upon the non-firing of the device, the user might have proceeded differently, provided that the conditions for firing were not met, unless such conditions were themselves inevitable, in which case the question is moot.

