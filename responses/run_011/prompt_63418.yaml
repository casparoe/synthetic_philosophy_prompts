      *   *Critique:* Did I include the "scientific simplicity vs. program length" point?
      *   *Fix:* Ensure it's in the Research Question and Methodology (Phase 3).
      *   *Critique:* The prompt asks for an honest verdict on feasibility.
      *   *Fix:* Add a specific "Risk & Feasibility" section.

  7.  **Final Polish:** Check word count (roughly two pages standard formatting). Ensure no bibliography is included. Make sure the "Public Payoff" is distinct.

      *(Self-Correction on "Method"):* The user said "spell out which parts are his and which are mine." I need to be very explicit there. Theorist = sanity check on math claims. User = conceptual mapping, literature synthesis, argument construction.

      *(Self-Correction on "Alternatives"):* The prompt asks why this approach beats "running simulations of toy priors." I need to argue that simulations obscure the constant problem because you pick the machine *in* the simulation. The philosophical analysis reveals the structural dependency.

