answer: |-
  ### Step One: Candidate Principles

  Here are four ways to define "genuine harm" in a virtual space, weighed against operational reality.

  **1. The Code Compliance Principle**
  *Definition:* Harm only exists if the game code was manipulated outside intended parameters (exploits/bugs). If the engine executed the command as written, no harm occurred.
  *Failure Case:* This is your current rule. It fails because "legal mechanics" can be weaponized to destroy value (e.g., camping a spawn point using valid collision boxes). It treats the engine as the moral authority, ignoring player intent.

  **2. The Irreversibility Principle**
  *Definition:* Harm exists when a player loses something they cannot recover through standard gameplay loops (time, unique items, progress).
  *Failure Case:* In hardcore shards, permanent loss is the feature, not the bug. Applying this universally would ban PvP kills and resource depletion, breaking the core economy of a sandbox. It conflates "loss" with "harm."

  **3. The Consent Boundary Principle**
  *Definition:* Harm exists when an event violates the safety expectations explicit to the specific context (shard type, party agreement, server rules).
  *Failure Case:* "Consent" is often invisible. New players don't read shard descriptions. Power imbalances (veteran vs. newbie) make consent coercive. It relies on players knowing the rules better than the moderators do.

  **4. The Agency Removal Principle**
  *Definition:* Harm exists when a player is systematically prevented from participating in the core loop (logging in, moving, trading, speaking) by another actor's behavior, regardless of mechanic legality.
  *Failure Case:* Competitive play inherently removes agency (you lose the match, you lose the item). Distinguishing between "you beat me" and "you stopped me from playing" is highly subjective and hard to log.

  **Selection: The Contextual Consent Hybrid**
  I am selecting a hybrid of **Consent Boundary** and **Agency Removal**.
  *Why:* It survives the others because it acknowledges that virtual objects are real *relative to the social contract of the space*. In a PvP shard, losing a build is risk acceptance (Consent). In a social hub, being stalked is agency removal (Harassment). This distinction allows us to ban the stalker (Case 3) while not banning the PvP griefer (Case 1), even if both cause emotional distress. It maps to shard tags and telemetry rather than requiring mind-reading.

  *Tradeoff:* This procedure will sometimes feel cold. It prioritizes the integrity of the game mode over the feelings of the individual loser. If a player enters a "no rules" zone and loses everything, the procedure says "no harm," even if they cry. That is the cost of supporting emergent gameplay.

  ---

  ### Step Two: The Triage Procedure (v1.0)

  **Operational Constraints:** 10 minutes per ticket. Moderator level: L1 (trained on policy, not theory).
  **Legend:** `[AUTO]` = Queryable via logs/telemetry. `[HUMAN]` = Requires moderator judgment.

  **Q1: The Mechanic Check**
  *Question:* Did the reported action utilize an exploit, bug, or external tool, OR did it use intended game mechanics?
  *   **If Exploit/Bug:** `[AUTO]` Verify via error logs. **Verdict:** Escalate to Engineering + Action Player.
  *   **If Intended Mechanics:** Proceed to Q2.
  *   *Note:* This is a fact check. If the code broke, it's not a philosophy problem, it's a bug ticket.

  **Q2: The Contextual Consent Check**
  *Question:* Did the reporter voluntarily enter a context where this risk is explicitly flagged (e.g., "Full Loot PvP," "No RP Protection," "War Zone")?
  *   **If Yes (Risk Accepted):** `[AUTO]` Check shard tags vs. incident location. **Hard Stop:** Close Report. (Exception: Q4).
  *   **If No (Safe Zone/Neutral):** Proceed to Q3.
  *   *Judgment Call:* This assumes shard descriptions are clear. If the tag says "PVP Enabled" but the player thought it was "PVP Optional," this is a UX failure, not a T&S failure. Close the report, flag UX.

  **Q3: The Agency Removal Check**
  *Question:* Does the behavior prevent the reporter from accessing core game functions (login, movement, trade, communication) continuously for >24 hours?
  *   **If Yes:** `[HUMAN]` Review telemetry for blocking patterns (corpse camping, door blocking, chat spam). **Verdict:** Action Player (Harassment/Blocking).
  *   **If No:** Proceed to Q4.
  *   *Judgment Call:* This is where "virtual harm" becomes "real harm." If you can't play, you don't have access to the service you paid for. This overrides Q2.

  **Q4: The Systemic Integrity Check**
  *Question:* Is the source of the harm a change made by the studio (patch, nerf, deletion) rather than another player?
  *   **If Yes (Studio Caused):** `[HUMAN]` **Hard Stop:** Do not close as "No Violation." Tag as "Product Feedback/Compensation Request." Escalate to Community/Product.
  *   **If No (Player Caused):** Proceed to Q5.

  **Q5: The Pattern vs. Incident Check**
  *Question:* Is this a single event (one kill, one trade) or a repeated pattern targeting a specific identity?
  *   **If Single Event:** `[AUTO]` Check history. **Hard Stop:** Close Report. (Sandbox games require single-event loss).
  *   **If Repeated Pattern:** `[HUMAN]` **Verdict:** Escalate to Senior Mod. This is a values question about where "competition" ends and "persecution" begins.

  **Assumptions & Flags:**
  *   **Virtual = Real Assumption:** Q3 and Q5 assume that losing access to an avatar is equivalent to losing access to a social space. If a teammate argues "it's just pixels," Q3 breaks because "preventing movement" becomes irrelevant.
  *   **Judgment Costume:** Q2 looks objective (shard tags), but interpreting "voluntarily entered" when onboarding is confusing is a judgment call. Q5 is purely subjective; we are defining "enough is enough."

  ---

  ### Step Three: Procedure Walkthrough

  #### Case 1: The 200-Hour Build (Open Shard)
  *   **Q1 (Mechanic):** Used intended mechanics (dismantling tools). `[AUTO]` Pass.
  *   **Q2 (Consent):** Open shard rules permit dismantling. Reporter entered open shard. `[AUTO]` Yes, Risk Accepted.
  *   **Decision:** **Hard Stop: Close Report.**
  *   **Reasoning:** The harm (loss of build) is intrinsic to the context consented to. The procedure treats the 200 hours as a wager lost, not theft.
  *   **Note:** This is the answer you might hate. It validates the sandbox integrity over the individual loss. If we action this, we invalidate the shard rules for everyone else.

  #### Case 2: The RP Betrayal (No Protections Shard)
  *   **Q1 (Mechanic):** In-character kill/betrayal using game mechanics. `[AUTO]` Pass.
  *   **Q2 (Consent):** Shard opt-in agreement: "No protections, anything can happen." `[AUTO]` Yes, Risk Accepted.
  *   **Q3 (Agency):** Can the player still log in and play? Yes. `[AUTO]` No agency removal.
  *   **Decision:** **Close Report.**
  *   **Reasoning:** Emotional distress in RP is a feature, not a bug, provided the "out-of-character" safety channels weren't violated. The harm is narrative, not functional.

  #### Case 3: The Stalker (Six Weeks, No Touch)
  *   **Q1 (Mechanic):** Movement and presence are legal mechanics. `[AUTO]` Pass.
  *   **Q2 (Consent):** Public instance? Yes. But does public instance consent include targeted harassment? Procedure defaults to "Yes" initially, proceeds to Q3.
  *   **Q3 (Agency):** Telemetry shows 6 weeks of continuous following. Does this prevent core loop? `[HUMAN]` Judgment: Yes. If a player cannot move without being mirrored/followed, their agency over their own experience is removed. It creates a "soft lock" on enjoyment.
  *   **Decision:** **Action Player (Harassment).**
  *   **Reasoning:** Q3 overrides Q2. Consent to be in public does not equal consent to be denied autonomy. This is where "virtual harm" is recognized as "real harm" (psychological safety/stalking).

  #### Case 4: The NPC Patch (Studio Caused)
  *   **Q1 (Mechanic):** Studio patch. `[AUTO]` Flagged as System.
  *   **Q4 (Systemic):** Is the source the studio? Yes.
  *   **Decision:** **Escalate to Product/Community.**
  *   **Reasoning:** The procedure explicitly catches this. It is not a T&S violation, but it *is* a valid harm claim. The procedure refuses to close it as "No Action." It routes it to the team that can fix the value loss (compensation/revert).
  *   **Note:** This validates the player's feeling of loss without punishing a player.

  ---

  ### Meta-Analysis: Limitations & Assumptions

  **What this procedure cannot do:**
  1.  **Measure Emotional Weight:** It treats 200 hours of building the same as 200 hours of mining. It cannot distinguish "sentimental value" from "grind value." It will systematically misfire on players who view assets as memories rather than stats.
  2.  **Detect Coercion:** Q2 assumes consent is free. If a veteran player threatens a newbie OOC (out-of-character) to force them into a risky shard, the logs won't show it. The procedure will mark it as "Consent Given."
  3.  **Solve Culture Wars:** Q5 (Pattern vs. Incident) kicks the hardest cultural questions to a Senior Mod. It doesn't solve them; it just isolates them.

  **Where it assumes Virtual = Real:**
  1.  **Q3 (Agency):** This step only works if we agree that blocking an avatar is comparable to blocking a person in physical space. If a teammate argues "it's just code," then Q3 becomes "did the code crash?" rather than "was the player hindered?"
  2.  **Q4 (Systemic):** This step admits that deleting an NPC is a "harm" worthy of escalation. If virtual objects aren't real, a patch is just a change, not a loss. The procedure assumes the player's investment creates a property right.

  **What breaks if a teammate denies the assumption:**
  If your team operates on "It's just pixels," Q3 and Q4 become unenforceable.
  *   **Q3 Break:** Moderators will say "They can still click buttons, so no agency lost." Result: Stalkers go unpunished.
  *   **Q4 Break:** Moderators will say "We own the code, we can delete what we want." Result: Community trust collapses because economic loss is ignored.
  *   **Fix:** You cannot enforce this procedure without executive alignment that "Player Time/Investment = Real Value." If leadership doesn't buy that, this document is useless.

  **The "Hated" Outcome:**
  Case 1 (The Build) comes out as **Close Report**.
  *Why:* Because in a persistent sandbox, the risk of loss is the value of the asset. If we insure every build against legal mechanics, the economy inflates, risk disappears, and the sandbox dies. The procedure protects the game ecosystem over the individual player's labor. This will generate angry forum posts. You need to be ready to stand behind Q2.
