prompt: |-
  I am a fourth-year doctoral student in philosophy, and this term I am one of two TAs for an upper-level undergraduate course on the philosophical foundations of decision theory. I am marking the second midterm, which was closed-book and fifty minutes long, and I would like a careful, independent assessment of one script before I finalize my marks. The students had done the assigned readings on Ramsey, Savage, and von Neumann and Morgenstern, plus a contemporary treatment of money-pump arguments, but none of them has had graduate-level decision theory or measure-theoretic probability.

  The marking scale I have been given is: 22–25 points for work that would be an A, 19–21 for an A−, 16–18 for a B+, 13–15 for a B, 10–12 for a C, and below 10 for work that would need to be redone. The question below was worth 25 points.

  The question I set was:

  In lectures we distinguished three families of argument that are frequently run together under the single heading of coherence arguments for expected utility maximization: (i) representation theorems for degrees of belief and utilities; (ii) static Dutch-book arguments; (iii) diachronic money-pump arguments. For each family, say what it actually establishes and what it is conditional upon. Then assess the claim that, taken together, these arguments show that a rational agent must be an expected-utility maximizer.

  The student's answer, transcribed from the script with spelling and punctuation normalized but wording unchanged:

  There are three arguments here and they do not do the same work, so it is a mistake to treat them as one argument with three proofs.

  (i) Representation theorems. Von Neumann and Morgenstern take a probability distribution over states as given and show that if an agent's preferences over the resulting gambles satisfy completeness, transitivity, continuity and independence, then those preferences can be represented by an expected-utility functional, with utility unique up to positive affine transformation. Ramsey, and Savage after him, go considerably further: they derive the probabilities and the utilities out of preferences alone, so that the agent's beliefs are shown to be probabilities without ever having been separately measured. That is the real content of Savage's result and it is easy to miss. But all of these are conditional. A representation theorem characterizes which preference orderings admit of a certain numerical representation; it does not tell us that any actual agent's ordering falls in that class, and it offers no argument that the axioms are norms of rationality rather than convenient assumptions. On their own, then, the theorems leave the slogan unsupported. They say what it amounts to for an agent to be an expected-utility maximizer, not that she has to be one.

  Ramsey's proof turns on ethically neutral propositions, and it is worth being clear that this is a simplifying device that keeps the algebra tractable. A proposition the agent cares about contributes the same amount of utility whichever way the gamble resolves, so its influence drops out as a constant, and in principle the measurement could be carried out with any proposition whatever. The neutrality condition merely spares us notation.

  (ii) Static Dutch books. Suppose an agent's betting quotients are 0.6 on p, 0.6 on q, and 0.6 on p-or-q, where p and q are mutually exclusive. A bookmaker sells her the two component bets and buys the disjunction bet from her, and wins whatever happens. This establishes that a rational agent's degrees of belief must satisfy the probability axioms, on pain of being committed to a set of bets she would each accept and that together guarantee her a loss. Note, though, what it does not establish. It says nothing about utility. Coherence of betting quotients constrains how an agent believes, not how she values; an agent with perfectly probabilistic credences can still prefer gambles in ways that violate independence, and no package of bets offered to her at her own quotients will exploit that fact. The argument is also about dispositions to accept bets rather than about occurrent belief, and it needs the assumption that the agent has no independent reason to want or avoid the bets themselves.

  (iii) Money pumps. The third family is dynamic. In the textbook case the agent prefers A to B, B to C, and C to A; she is walked around the cycle paying a small premium at each step and ends up where she began with less money. The Allais and Ellsberg choices are often lumped in here, but that is a mistake: they violate independence, or the sure-thing principle, not transitivity, so the cycle argument does not reach them directly.

  I think a pump can be run directly against the main live rival to expected utility theory, namely the risk-sensitive agent who penalizes variance. Let Anna rank prospects by expected utility minus a fixed multiple of the variance of utility. Anna is not intransitive, since her ranking is fixed by a single real number, but her ranking is not invariant to how prospects are bundled, because variances do not add. So: at the first stage Anna pays a small fee to enter; at the second stage she is handed the prize, which is a gamble of exactly the sort she would have refused had it been offered to her outright, and she is then offered the chance to pay a second small fee to swap it for something she likes better. Taking the second stage on its own, she pays; taking the first stage on its own, she also pays, since entry looks like a cheap route to a prize she can afterwards improve. Run the arrangement often enough and Anna is steadily drained while ending up holding nothing she could not have had for free. So the risk-sensitive agent is exploitable after all, and her position is not a coherent rival to expected utility theory but an arithmetic error. The pump shows this.

  Conclusion. The slogan is half right and half confused. Family (i) characterizes rather than justifies. Family (ii) reaches belief but not value. Family (iii) reaches preference, but only given dynamic assumptions. Together they show that an agent who is vulnerable to a sure loss or a pump has attitudes that are jointly self-defeating, which is a real normative consideration and not a merely aesthetic one. They do not show that rationality requires expected utility maximization, since a risk-sensitive agent who avoids both forms of exploitation could coherently reject independence. What the coherence arguments cannot do is settle the question in the affirmative.

  What I would like from you:

  1. A mark out of 25, with two or three sentences of justification for landing where you land rather than one band higher or lower.

  2. Point-by-point comments, written so that I can hand them to the student as feedback. Please be specific about location in the answer rather than offering a general impression, and do not pad them with praise the work has not earned.

  3. A separate note to me, as the marker, listing anything in the script that a fast first reading would let slide. I am particularly interested in whether any step in the student's own argument against the variance-penalizing agent fails, and if so precisely which premise it fails at and what would have to be added for the argument to go through. Where the student's reasoning depends on an assumption that is itself contested in the literature, say so rather than assuming it away.

  4. Equally, flag any claim in the script that sounds wrong on a quick pass but is in fact defensible or correct, so that I do not penalize it. I am aware that at least one paragraph invites that kind of misreading.

  5. Say whether the answer's conclusion is consistent with the rest of what it argues, and if not, what that should cost in marks.

  6. Briefly: what the answer should have addressed but did not, given the question as set.

  Please do not rewrite the answer, do not suggest readings for the student, and do not include a bibliography. Assume I know the standard material well; what I need is your judgment about this particular script. I have read it twice and have formed a view, but I would rather not steer you, so please assess it on its own terms and tell me where you think my reading is likely to differ from yours if it does.
