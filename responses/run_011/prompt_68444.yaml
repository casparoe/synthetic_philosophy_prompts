      *   **Tension C: Ontic Determinacy (1) vs. Rational Indeterminacy (2).**
          *   *The Problem:* If the bias is fixed (1), why is a point estimate dogmatic (2)?
          *   *Resolution:* This is the standard Levi/Joyce defence. The evidence doesn't pinpoint the bias. A point estimate adds information not in the evidence.
          *   *Severity:* Low/None. This is the core definition of orthodox Imprecise Probabilism.

      *   **Tension D: Updating (3) vs. Anti-Dilation (6).**
