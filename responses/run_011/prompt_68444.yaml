  5.  **Synthesising and Ranking:**

      *   **Severity 1 (Fatal): The Reflection/Dilation Clash (6 vs 7, mediated by 3).**
          *   If you know dilation is coming, Reflection says be dilated now. (6) says don't be dilated now.
