      *   **Tension A: Dilation (6) vs. Conditionalisation (3) & Reflection (7).**
          *   *The Problem:* Dilation occurs when $P(H|E)$ is wider than $P(H)$ for all $E$ in a partition. If the agent knows the experimental setup causes dilation, they know their future credal set will be wider.
