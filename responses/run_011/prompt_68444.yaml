      *   (3) *Generalised Conditionalisation:* Update by conditionalising every member of the set. No special rule.
      *   (4) *Ellsberg Motivation:* Ambiguity aversion is rational; precise priors can't capture this.
      *   (5) *Decision Rule:* E-admissibility (maximise EU for *at least one* $P$ in the set). No tie-breaking.
      *   (6) *Anti-Dilation:* Dilation is a defect. The user refuses to widen the interval in anticipation of irrelevant evidence (Seidenfeld's example).
      *   (7) *Reflection Principle:* Present opinions defer to expected future opinions (van Fraassen style).

  3.  **Initial Consistency Check (Mental Sandbox):**
      *   (1) & (2): Standard IP view (Levi, Joyce). Compatible.
      *   (2) & (3): Standard IP updating. Compatible.
      *   (2) & (5): Standard IP decision theory (Levi). Compatible.
      *   (4) & (5): Ellsberg usually motivates IP, but E-admissibility is the standard decision rule for IP. However, some argue E-admissibility doesn't *fully* capture ambiguity aversion (Maximin does). But the user says Ellsberg preferences are rational and E-admissibility is the rule. Is there a conflict? E-admissibility allows choosing the ambiguous option if *some* $P$ in the set supports it. It doesn't force ambiguity aversion in the strong sense (like Maximin), but it permits it where precise Bayesianism forbids it. This seems okay, though (4) is a motivation and (5) is the implementation.
