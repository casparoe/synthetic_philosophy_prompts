answer: |-
  ### Vulnerability Brainstorming

  Before drafting the questions, here is where this view is most exposed. The guest is attempting a high-wire act: she wants the metaphysical realism of the "expected harm" crowd (yes, your emission physically hurts someone) without the normative bite (no, you don't have a decisive reason to stop).

  1.  **The Normative Disconnect:** Standard moral theories (consequentialist and deontological) treat "causing harm" as a *pro tanto* reason for prohibition. By severing this link, she risks making "harm" a morally empty category. If I can harm you without giving you a claim against me, have I really harmed you in a moral sense, or just a physical one?
  2.  **The Sorites of Obligation:** If one act causes harm $h$ and generates reason $r=0$, but $N$ acts cause harm $Nh$ and generate reason $R=high$, she needs a non-arbitrary threshold. If the threshold is based on *total* harm, she is a consequentialist. If it is based on *individual* harm magnitude, she needs to explain why moral reasons don't aggregate like physical harms.
  3.  **The Agency Gap:** If individuals have no reason to stop, but institutions do, she faces a category error. Institutions act only through individuals. If the individual constituent has no reason to cooperate with the institution's mandate, the institutional duty is inert.

  ***

  ### Interview Questions

  **1. The Aggregation of Reasons (Topic A)**
  You grant that my flight causes a tiny, non-zero amount of suffering to a real person. In almost every other corner of ethics, causing suffering generates a *pro tanto* reason to stop. If the harm is real, why is the reason invisible? Is your claim that moral reasons simply don't aggregate the way physical harms do?

  *   **Follow-up:** You'll likely say you're denying the inference, not the causation. But if a million tiny reasons don't sum to a big reason, while a million tiny harms *do* sum to a big harm, aren't you positing a magical discontinuity between the metaphysics of harm and the metaphysics of normativity? What mechanism blocks the addition?

  **2. The Million-Person Case (Topic B)**
  Let's scale this. If a million people take that flight, the climate damage is catastrophic. On your view, is it permissible for the *group* to do what is permissible for the *individual*? Or does the act transform from neutral to wrong solely in virtue of others doing it too?

  *   **Follow-up:** If the act transforms based on others' behavior, then my reason to stop *does* depend on what others do. But you just told me my reason doesn't depend on the causal impact. So does my obligation turn on causal efficacy or on social coordination? Which one is actually doing the work?

  **3. The Voting Analogy (Topic C)**
  Take the classic case: I skip a vote. The causal impact is effectively zero. I book a flight. On your view, the causal impact is non-zero. Do you treat these two cases the same normatively? Should I feel the same amount of guilt, or lack thereof, in both?

  *   **Follow-up:** If you treat them the same normatively despite the causal difference, why was it so important to grant the causal premise about the flight? If the normative conclusion holds regardless of whether I cause harm or not, isn't the causation philosophically idle?

  **4. The Futility Objection (Topic D)**
  I'm a listener who accepts your argument. I think, "Great, my individual act causes harm but gives me no reason to stop. So I'll keep flying and focus on 'systemic change' which I also won't personally enact." Have I misunderstood your view, or is this a coherent position within it?

  *   **Follow-up:** If that's a misunderstanding, you must owe me a reason to act that isn't based on the outcome I produce. But if the outcome is the only thing that matters to the victim, what is this "reason" you're offering me? Is it purely aesthetic, or does it have normative weight?

  **5. Institutional vs. Individual Duty (Topic E)**
  You often suggest the duty lies at the institutional level. But institutions are just collections of individuals making choices. If I, the individual, have no reason to book a different flight, how does the airline or the state generate a reason to ban it? Don't institutional duties supervene on individual ones?

  *   **Follow-up:** You might say institutions have a different agency structure. But if you strip the individuals within the institution of the reason to comply with the regulation, doesn't the institutional duty collapse into a recommendation without force? How does the duty land without individual traction?

  ***

  ### Load-Bearing Analysis

  **The Two Load-Bearing Questions:**
  **Question 1 (Aggregation of Reasons)** and **Question 5 (Institutional vs. Individual Duty).**

  **Why:**
  Question 1 attacks the **meta-ethical engine** of her view. If she cannot explain why real harms fail to generate *pro tanto* reasons without resorting to an arbitrary threshold, her theory collapses into either standard consequentialism (reasons do aggregate) or nihilism (harm doesn't matter). This is the theoretical keystone.

  Question 5 attacks the **practical feasibility**. Her view is attractive because it promises a path to systemic change without individual guilt. However, if individuals lack the normative reason to comply with institutional mandates, the institutional solution is inert. If she cannot bridge the gap between "no individual reason" and "binding institutional rule," her view offers no solution to the collective action problem it diagnoses.

  **Her Best Escape Route:**
  If she is well-prepared, she will retreat to a **Threshold Deontology with Collective Agency**.
  She will argue that moral reasons *do* exist, but they are triggered only when an agent's contribution crosses a "significance threshold" (which individual flights don't, but institutional policies do). She will claim that institutions are not merely sums of individuals but distinct moral agents capable of bearing duties that individuals cannot.
  *Counter to the escape:* This risks making the "individual" and "institution" categories ontologically distinct in a way that social science doesn't support. If the institution acts, *someone* individual must sign the order. If that person has no reason to sign it (per Q1), the threshold is never crossed.
