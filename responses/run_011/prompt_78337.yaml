  8.  **Final Polish:** Ensure the tone is professional but probing. Ensure the follow-ups anticipate the "denying the inference" dodge. (e.g., "If harm doesn't generate a reason, what does?")

  *(Self-Correction on Load-Bearing)*: Actually, the "Voting" analogy is crucial because she grants causation for flights but presumably denies it for votes (or treats them similarly). If she treats them similarly *normatively* despite the causal difference, why did she fight so hard for the causal concession? That might be a stronger load-bearing tension. But the Aggregation one is more fundamental to the "harm" claim. I'll stick with Aggregation and Institutions as the deepest cuts.

