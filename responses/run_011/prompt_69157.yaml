      *   Thinnest point? Be honest.
      *   No jargon? Check terms like "construct validity," "natural kinds," "looping." *Correction:* The prompt says the *audience* will use jargon (construct validity, etc.), but *my replies* must not use jargon. I need to ensure the *answers* translate their jargon into plain English.
