      *Refining the "Kill Shot":* The Patient Harm objection is the most dangerous emotionally. But the "What do I do Monday morning?" is the most dangerous practically. Let's make the "Patient Harm/Trust" the kill shot because it questions the *ethics* of the talk.

      *Refining Concessions:* 1. Journalism is complicit. 2. Patients need labels for access/care.

      *Refining the "Prayer Question":* "I saw your byline on 'The Gene for Anxiety' last month."
