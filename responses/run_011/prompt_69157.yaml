      *Actually, re-reading:* "No jargon in the replies. If I say looping effect or homeostatic cluster out loud I lose the room..." -> This specifically targets the *speaker's* theoretical jargon. I should still acknowledge their terms (like "biomarkers") but answer in plain language. I will ensure the answers are accessible.

      *Let's check the "Prayer Question" again.* The prompt asks for the "worst version of it as a trialist who reads my column would put it." Needs to be sharp.

