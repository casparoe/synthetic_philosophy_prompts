      *   *Objection 6 (Progress):* "DSM-5 is more reliable than DSM-III." -> *Answer:* Reliability isn't validity. We agree better on a fuzzy picture.
      *   *Objection 7 (Actionable):* "What should I put in my protocol?" -> *Answer:* Measure symptoms, not just labels.
