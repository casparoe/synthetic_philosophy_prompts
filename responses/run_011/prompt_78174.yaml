  # Limitations of the Procedure
  1.  **Incommensurability:** The procedure cannot settle disputes where the Board refuses to trade money for lives (lexicographic preferences). If the Board says "No cost is worth *any* increase in death risk," $w$ becomes a step function, breaking the arithmetic.
  2.  **Dynamic Preferences:** The procedure assumes $w$ is stable. If public sentiment shifts after a media scandal, the $w$ derived last month is invalid, but the procedure has no mechanism for emergency recalibration.
  3.  **Correlation Blindness:** While Step 9 mandates portfolio scoring, the spreadsheet arithmetic relies on the Committee correctly identifying correlations. If (a) and (b) are thought to be independent but are actually coupled by a hidden variable (e.g., staff fatigue), the REU calculation underestimates the tail.

  Verdict: (a) Adopt (Phase 1) — EV winner unchanged; (b) Reject — EV winner changed; (c) Escalate — EV winner unchanged
