answer: |-
  # SEMINAR HANDOUT: The Space of Self-Locating Belief
  **Topic:** The Sleeping Beauty Problem  
  **Format:** Decision Tree Analysis  

  ## I. The Decision Space (Branch Nodes)
  *Answer each question to navigate the tree. Standard "Halfer" and "Thirder" paths are noted with the philosophical rationale for the choice.*

  **Node 1: Precision**  
  *Is the rational doxastic state representable by a single precise probability function?*  
  *   **Yes (Sharp):** Standard Halfer & Thirder. *Rationale:* Bayesian orthodoxy requires precise credences for rational action.  
  *   **No (Indeterminate):** Imprecise View. *Rationale:* Self-locating evidence is too sparse to justify a sharp number.  

  **Node 2: Evidence Elimination**  
  *Upon waking, does Beauty eliminate a possibility that was live on Sunday (e.g., "Monday & Asleep")?*  
  *   **No:** Lewis's Halfer. *Rationale:* She knew she would wake up; the qualitative nature of the experience was antecedently guaranteed.  
  *   **Yes:** Thirder & Double Halfer. *Rationale:* Waking provides indexical information ("I am awake *now*") that rules out being asleep at this moment.  

  **Node 3: Antecedent Certainty**  
  *Can an event known antecedently to occur serve as confirming evidence once it occurs?*  
  *   **No:** Standard Halfer. *Rationale:* Conditionalizing on certainties leads to trivialization; evidence must be contingent.  
  *   **Yes:** Standard Thirder & Double Halfer. *Rationale:* Indexical occurrence transforms a general certainty into specific self-locating evidence.  

  **Node 4: Centered/Uncentered Link**  
  *Can learning a centered proposition (e.g., "It is Monday") rationally move credence in an uncentered proposition (e.g., "Coin is Heads")?*  
  *   **No:** Lewis's Halfer & Double Halfer. *Rationale:* Uncentered facts (coin toss) are probabilistically independent of centered facts (day) given the setup.  
  *   **Yes:** Standard Thirder. *Rationale:* The correlation between waking frequency and coin outcome creates probabilistic dependence.  

  **Node 5: Indifference Scope**  
  *Does the Principle of Indifference apply to centered observer-moments or uncentered possible worlds?*  
  *   **Worlds:** SSA-style & Lewis's Halfer. *Rationale:* Rational agents should be indifferent between possible worlds, not temporal parts.  
  *   **Moments:** SIA-style & Standard Thirder. *Rationale:* Rational agents should be indifferent between subjectively indistinguishable observer-moments.  

  **Node 6: Betting Definition**  
  *Is credence defined by the proportion of winning bets in repeated trials of the experiment?*  
  *   **No:** Epistemic Halfers. *Rationale:* Credence tracks truth-conditions, not pragmatic success rates in biased sampling.  
  *   **Yes:** Pragmatic Thirders. *Rationale:* Credence just is the disposition to bet; long-run frequency dictates rational betting odds.  

  ---

  ## II. The Leaves (Positions)
  *Mapping specific views to the paths above.*

  1.  **Lewis's Halfer:** Yes (Sharp) → No (Elimination) → No (Certainty) → No (Link) → Worlds → No (Betting).
  2.  **Elga's Thirder:** Yes (Sharp) → Yes (Elimination) → Yes (Certainty) → Yes (Link) → Moments → Yes (Betting).
  3.  **The Double Halfer:** Yes (Sharp) → Yes (Elimination) → Yes (Certainty) → **No (Link)** → Worlds → No (Betting).
  4.  **SSA Position:** Yes (Sharp) → [Aligns with Halfer path] → **Worlds**. (Numerically Halfer, distinct justification).
  5.  **SIA Position:** Yes (Sharp) → [Aligns with Thirder path] → **Moments**. (Numerically Thirder, distinct justification).
  6.  **Imprecise View:** **No (Sharp)**. (Credence is a range, e.g., [1/2, 1/3], regardless of subsequent nodes).

  ---

  ## III. Empty Regions & Limitations

  **Unoccupied Regions of the Space**
  *   **No Elimination / Yes Link:** *Incoherent.* If waking eliminates no possibilities (Node 2: No), there is no new evidence to drive a shift in uncentered credence (Node 4: Yes).
  *   **Yes Elimination / No Link / Yes Betting:** *Unstable.* This view admits new evidence but denies it shifts credence, yet defines credence by betting (which suggests 1/3). This "Separatist" view is rarely defended as a stable equilibrium.
  *   **Imprecise / Yes Betting:** *Unexplored.* Most imprecise theorists reject betting frequencies as the primary driver, but the combination is not logically impossible.

  **Indistinguishable Pairs**
  *This tree cannot genuinely separate the following pairs, as they occupy identical branches:*
  1.  **Lewis's Halfer vs. SSA Halfer:** Both follow the "Worlds" and "No Elimination" path. The tree captures the *consequence* of SSA, not the *axiom*.
  2.  **Elga's Thirder vs. SIA Thirder:** Both follow the "Moments" and "Yes Link" path. The tree treats Elga's restricted indifference and SIA's global indifference as functionally equivalent in this context.
