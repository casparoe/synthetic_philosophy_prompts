          *   *Which does the work?* Argue that *Authority vs. Welfare* is the real conflict in the clinic. Identity is usually assumed (legal continuity) but used rhetorically. The daughter isn't saying "he's a different human," she's saying "his current welfare outweighs your past authority."
      *   **Part 2: Dworkin, Dresser, and the Nature of Interests:**
