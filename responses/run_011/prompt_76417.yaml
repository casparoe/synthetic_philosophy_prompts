  2.  **Deconstruct Question 1: The Three Problems (Identity, Authority, Welfare)**
      *   *Identity:* Is the demented patient the *same person* as the signer? (Numerical identity vs. narrative identity).
      *   *Authority:* Can a past self bind a future self? (Precedent autonomy).
      *   *Welfare:* Can you be harmed by not getting something you don't want/know about? (Interest theory of well-being).
      *   *Analysis:* These are distinct but overlapping. In practice (clinical ethics), Identity is often a proxy for Authority. But strictly speaking, legal/ethical systems usually presume Identity (same human being) to get to Authority. If Identity is broken, Authority collapses. If Identity holds, Authority is the battleground. Welfare is the counter-weight (beneficence/non-maleficence).
      *   *Verdict:* The *actual work* when a directive is overridden is usually a clash between *Authority* (past self) and *Welfare* (present self's experiential interests). Identity is the metaphysical grounding, but rarely the explicit pivot in clinical decisions unless one adopts a strong psychological continuity view.

  3.  **Deconstruct Question 2: Dworkin vs. Dresser & The "Proves Too Much" Objection**
      *   *Dworkin:* Critical interests (life as a whole narrative) vs. Experiential interests (moment-to-moment pleasure/pain). Critical interests survive incompetence.
      *   *Dresser:* The "then self" vs. "now self." The demented patient is a new entity morally. Ignoring current desires treats them as a vessel.
      *   *Frustration without Registration:* This is the "Experience Requirement" debate. Can you be harmed without feeling it? (e.g., being betrayed behind your back). Dworkin says yes (narrative integrity). Dresser says no (sentience is key).
      *   *Narrative Unity:* Yes, Dworkin relies heavily on the idea of a life as a coherent story.
      *   *The "Proves Too Much" Objection:* If dementia breaks personhood, does retirement saving make sense? Do promises to the dead matter? Is punishing a reformed criminal unjust?
      *   *Parfit's Psychological Connectedness:* This is the middle ground. Identity isn't all-or-nothing. It's degrees of connection.
      *   *Evaluation:* Does Parfit rescue it? It clarifies the metaphysics but makes the *ethics* harder (how to weigh degrees?). It doesn't solve the "who decides" problem, just complicates the calculus.

