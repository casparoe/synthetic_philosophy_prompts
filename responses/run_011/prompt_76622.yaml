answer: |-
  **MEMORANDUM**

  **TO:** Acquisitions and Collections Committee
  **FROM:** Faculty Representative
  **DATE:** October 24
  **SUBJECT:** Recommendation Regarding Proposed Gift of *Meridian* (Artist: [Name])

  **RECOMMENDATION**

  I recommend the committee proceed with **Option 1**: Accept the pair of bronzes as a single accessioned unit, explicitly refusing to rank them by date or priority. We should accession them as *Meridian* (Cast A) and *Meridian* (Cast B), dated "1968 or 1994," with a unified credit line.

  This recommendation is contingent on a concurrent vote to **amend the 2009 Collections Standards**. As written, the Standards require "features intrinsic to the object" to distinguish a work from a "competent later copy." Since our conservation lab confirms these objects are physically indistinguishable, and the 1994 casts are authorized by the estate (not forgeries), the current Standards technically bar us from attributing either to the artist with certainty. We must amend the Standards to recognize that **authorized posthumous casts, when physically indistinguishable from lifetime casts, satisfy the requirement for attribution.**

  This path secures the gift, avoids legal risk from the estate, maintains scientific honesty, and preserves the museum's ability to collect in complex provenance situations.

  ***

  **REASONING**

  **1. Interpretation of Collections Standards**
  The 2009 Standards state we must identify features "intrinsic to the object that a competent later copy could not also bear." We must read this strictly. A crate label, a shipping manifest, or the identity of the sibling who consigned the work are **extrinsic** properties. They belong to the object's history, not its physical constitution. If we count provenance as "intrinsic," we render the word meaningless; a perfect forgery with a perfect fake provenance would pass the standard.

  Therefore, under the Standards *as written*, we cannot attribute these works to the artist's 1968 hand because the 1994 casts are "competent later copies" bearing all the same intrinsic features. To proceed with Option 1, we must amend the Standards to allow **authorization** to substitute for **physical distinction** in cases of estate-sanctioned production. This acknowledges that in modern sculpture, the "original" is often a legal and administrative status as much as a physical one.

  **2. The Registrar's Objection (Provenance as Distinction)**
  I anticipate the Registrar and one Curator will argue that the objects *are* distinguishable because they arrived in different crates, via different routes, from different siblings. They will argue the Standards are satisfied because we *can* tell them apart by their history.

  This is a confusion of the *object* with the *transaction*. If we accept this reasoning, we lose the ability to speak about the art itself. We become archivists of shipping logistics rather than stewards of material culture. If the museum concedes that a crate label is an "intrinsic feature," we set a precedent where any object with a unique shipping history is unique, regardless of its physical reality. This devalues the conservation lab's work and invites future donors to bypass scientific scrutiny by manufacturing complex paper trails. We must maintain the distinction between the work (the bronze) and its biography (the crate). The biography supports the attribution, but it is not the attribution itself.

  **3. The Symmetry Problem**
  You are right to be unsettled by the symmetry: if the bronzes were swapped overnight, our records would remain unchanged, yet our assertions about "Cast A" and "Cast B" would be factually reversed. This suggests we do not know the *truth* of the objects, only the *status* of the claim.

  We are entitled to record this not as a settled history, but as a **documented uncertainty**. Our accession record should not assert "This is the 1968 cast." It should assert "This is one of two indistinguishable casts, one from 1968 and one from 1994, provenance contested." We are not describing two objects with settled histories; we are describing one historical event (the production of the edition) that resulted in two physically identical survivors. The museum's record describes the *limit of our knowledge*, not the *ontology of the bronze*. This is intellectually honest.

  **4. Obligations to the Estate and Siblings**
  If we designate one cast as posthumous (Option 2), we owe the "losing" sibling an apology and a retraction, because we have no evidence to support the designation. We would be making a scholarly claim we cannot defend, solely to satisfy a bureaucratic desire for certainty. That is arbitrary and potentially defamatory.

  If we do not designate (Option 1), we owe both siblings neutrality. We treat their testimony as equally weighted but insufficient. A random tiebreaker (coin toss) is non-arbitrary only in procedure, not in truth. It tells the losing child: "We had no way to know, so we chose." This is preferable to telling them: "We decided against you without evidence." Option 1 allows both children to feel their father's legacy is honored without forcing the museum to validate one family memory over another without proof.

  **5. Vulnerability of this Recommendation**
  The single point most exposed to attack is **reliance on the Foundry Archive**. My reasoning depends on the foundry's record that exactly two casts were made in 1968 and two in 1994. If the foundry lied, or if a third, undocumented pour exists, we are accessioning works that may be unauthorized. A Trustee could argue that declining the gift (Option 3) protects us from this risk entirely. I acknowledge this risk. However, the Foundry's archive is corroborated by the conservation lab's finding that the metals match two distinct production periods (1968 vs 1994 alloys), even if the individual casts are indistinguishable. The risk is manageable; the loss of the gift is permanent.

  **6. Precedent for the Registry**
  This case will be cited. If we decline (Option 3), we signal that the museum cannot handle authorized posthumous editions, which may chill future gifts from estates. If we designate randomly (Option 2), we signal that our scholarship is performative.

  I propose the committee adopt the following rule for future cases: **"In cases of authorized posthumous production where physical testing cannot distinguish lifetime from posthumous casts, the museum may accession works as 'Artist, Title, Date Indeterminate' provided the estate warranty of authorization is documented."** This preserves our integrity while acknowledging the reality of modern sculpture production.

  ***

  **STRONGEST CASE AGAINST RECOMMENDATION**

  *The argument for Option 3 (Decline the Gift):*

  "The Faculty Representative's recommendation asks us to dilute our Collections Standards to accommodate a donor's conditions. We are a university museum; our currency is truth, not objects. If we cannot distinguish the 1968 original from the 1994 copy, we do not know what we are acquiring. To accession them as '1968 or 1994' is to admit we do not know the work's history, which violates the purpose of a permanent collection. We should decline the gift. This protects the museum from future embarrassment if new evidence emerges, avoids the ethical compromise of amending standards under pressure, and signals to the field that we prioritize scholarly certainty over acquisition volume. Losing a 'modest reputation' artist is a small price for maintaining the integrity of our 2009 Standards."

  *Response:*
  This argument is principled but impractical. Declining the gift solves nothing; it simply moves the bronzes to a private collection where they will be unstudyable. By accepting them under Option 1, we bring them into the public trust where they can be studied indefinitely. Furthermore, the "integrity" of the 2009 Standards is already compromised by the reality of the art market; many authorized posthumous casts are indistinguishable from lifetime ones. Refusing to acknowledge this does not make it untrue; it only makes us irrelevant. We can maintain integrity by being transparent about the uncertainty (labeling them "1968 or 1994") rather than by refusing to collect. Transparency is a higher standard than false certainty.

  ***

  **ACTION CALENDAR**

  **1. Immediate (Within 48 Hours)**
  *   **Action:** Interim Director drafts letter to Donor.
  *   **Content:** Inform donor the Committee is prepared to recommend acceptance of the pair as a unified accession with indeterminate dating, subject to a Standards Amendment vote.
  *   **Sign-off:** Interim Director.

  **2. One Week Prior to Vote**
  *   **Action:** Registrar circulates draft Amendment to Collections Standards.
  *   **Content:** Specific language allowing "Authorized Indeterminate Casts" to meet attribution requirements.
  *   **Sign-off:** Registrar & Faculty Rep.

  **3. 48 Hours Prior to Vote**
  *   **Action:** Interim Director notifies Estate Co-Executors.
  *   **Content:** Confirm museum will not designate one cast as superior/posthumous, ensuring no defamation risk.
  *   **Sign-off:** Interim Director (cc: General Counsel).

  **4. Post-Vote (January)**
  *   **Action:** Insurer notified of unified valuation.
  *   **Content:** Single policy covering the pair as one accession number with two components.
  *   **Sign-off:** Registrar.

  **5. Public Announcement (Upon Accessioning)**
  *   **Action:** Wall labels and Online Collection.
  *   **Content:** "Cast 1968 or 1994. Gift of [Donor]. Estate of [Artist]."
  *   **Sign-off:** Curatorial Department.

  **Decision Required:** Vote to amend Collections Standards and Vote to Accept Gift (Option 1).
