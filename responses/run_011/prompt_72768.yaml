  ### 4. The 11th Case (The Tie-Breaker)
  To split your top two candidates (The Handout's **Attitude** vs. The RA's **Enforcement**), you need a group where members are trained to distrust outside sources (Handout = Echo) but face no structural penalty for engaging with them (RA = Bubble).

