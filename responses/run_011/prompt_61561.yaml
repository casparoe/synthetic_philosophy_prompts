      *   *Step 1 & 2:* Standard Molinism. God knows CCFs -> God Decrees -> World Actualized.
      *   *Step 3 (The Innovation):* "God knows these conditionals because He knows the character He would give each creature, and that character is what settles what the creature would do; the creature remains free because the character is its own."
