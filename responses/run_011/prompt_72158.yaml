      *   **Format:** Legal document style (Recording Header, WHEREAS clauses, Numbered Articles/Sections, Signature Block, Notary Acknowledgment).
      *   **Length:** Around 750 words.
      *   **Tone:** Deadpan legalese. No winking, no authorial asides, no explicit mentions of Ulysses/Odysseus/Sirens. The analogy must be carried by the covenant logic.
      *   **Specific Content Requirements:**
