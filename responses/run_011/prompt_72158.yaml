  DECLARATION OF COVENANTS, CONDITIONS, AND RESTRICTIONS
  FOR THE RESERVES AT SELF-BINDING ESTATES

  *Preamble:*
  WHEREAS, the Declarant seeks to establish a community governed by stable principles immune to the transient passions of its inhabitants; and
  WHEREAS, experience demonstrates that property owners, acting individually or collectively, often prioritize immediate convenience over long-term welfare, thereby undermining the very attributes that induced their purchase; and
  WHEREAS, the value of the Community derives not merely from physical structures but from the credible commitment to maintain a specific character against future impulses to degrade it; and
  WHEREAS, neither the Declarant nor any subsequent Member can be trusted to exercise perfect rationality at all times, particularly when faced with the pressure of changing circumstances;
  NOW, THEREFORE, the Declarant declares:

  *Article 1: Intent.*
  Section 1.1. **Purpose.** These Restrictions are designed to bind the future to the will of the present. Members acknowledge that their future selves may possess preferences incompatible with the Community Scheme and hereby agree to discount such future preferences in favor of the intent expressed herein.

  *Article 2: Amendment.*
  Section 2.1. **Threshold.** These Restrictions may be amended only by the affirmative vote of Members representing seventy-five percent (75%) of the total voting power.
  Section 2.2. **Ratchet.** Upon each successful amendment, the required percentage for subsequent amendments shall increase by five percent (5%) cumulative.
  Section 2.3. **Voting Base.** Voting power shall be allocated based on the original number of platted Lots shown on the Final Plat, including all unsold, unbuilt, or undeveloped Lots. The Declarant shall retain voting rights for all unsold Lots in perpetuity.
  Section 2.4. **Entrenchment.** This Article 2 may not be amended except by unanimous consent of all original platted Lots, including those owned by the Declarant.

  *Article 3: Governance.*
  Section 3.1. **Board.** The Architectural Review Committee (ARC) shall consist of three (3) members appointed by the Declarant. Such members shall serve in perpetuity and may only be removed by the Declarant.
  Section 3.2. **Finality.** Decisions of the ARC regarding exterior modifications, landscaping, or color schemes shall be final, binding, and expressly not reviewable by the Membership or any court of competent jurisdiction.

  *Article 4: Preference Shaping.*
  Section 4.1. **Orientation.** Prior to closing, each Member must attend a mandatory Orientation Session. The content of said Session shall emphasize the burdens of modification and the risks of instability inherent in democratic governance.
  Section 4.2. **Acknowledgment.** By attending, Member acknowledges that any desire to amend these Restrictions likely stems from a failure to fully internalize the Orientation materials.

  *Article 5: Fiscal and Temporal.*
  Section 5.1. **Assessments.** Annual Assessments shall be levied solely to fund the operations of the ARC and the enforcement of these Restrictions. No funds shall be allocated to amenities susceptible to Member preference.
  Section 5.2. **Sunset.** This Declaration shall expire automatically after fifty (50) years unless terminated by a vote meeting the threshold required in Section 2.1 at that time. Upon expiration, this Declaration shall automatically renew for successive fifty (50) year periods.

  *Signature:*
  IN WITNESS WHEREOF, the Declarant has executed this Declaration this ____ day of ________, 20__.

  ____________________________
  DECLARANT

