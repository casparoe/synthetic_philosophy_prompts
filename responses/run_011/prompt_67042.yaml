answer: |-
  **Coverage Determination Procedure: Therapy vs. Enhancement**

  **Time Limit:** 30 Minutes | **Source:** File Only | **Input:** No Specialists

  **Step 1: Define Capacity and Comparison Group**
  Identify the specific physiological capacity targeted (e.g., hand steadiness, attention span). Select the reference group for "normal" range based on age and sex. **[JUDGMENT POINT]** If the patient's occupation is cited as the reason for the request, use the general population unless medical standards legally regulate that capacity for the role (e.g., pilot vision). Do not create ad-hoc groups based on hobbyist standards.
  *   *If the file lacks data to define the capacity or group:* **Escalate**.

  **Step 2: Assess Baseline Status**
  Determine if the patient's current capacity falls below the clinical normal range (e.g., <5th percentile) for the selected group.
  *   *If Below Normal:* Proceed to Step 3.
  *   *If Within Normal Range:* Proceed to Step 4.
  *   *If File Cannot Answer:* **Escalate**. Do not assume normality from missing data.

  **Step 3: Determine Restoration Intent**
  Is the intervention intended to restore function to the group mean?
  *   *If Yes:* **Verdict: Covered as Therapy**. Stop.
  *   *If No (Goal exceeds mean):* **Verdict: Not Covered as Enhancement**. Stop.
  *   *Efficacy Firewall:* Do not evaluate evidence strength here. A therapy with weak evidence is "Investigational," not "Enhancement."

  **Step 4: Determine Improvement Intent**
  Is the capacity within normal range, and the goal to exceed the mean?
  *   *If Yes:* Proceed to Step 5.
  *   *If No:* **Escalate**.

  **Step 5: Value Smuggling Check**
  Does the request rely on the specific utility of the capacity for the patient's life plan (e.g., career success, artistic performance) rather than health status? **[JUDGMENT POINT]**
  *   *If denying requires asserting "this life plan is not worth supporting":* **Escalate**. This is a values question.
  *   *If denying rests solely on statistical normality:* **Verdict: Not Covered as Enhancement**.

  ***

  **Case 1: Propranolol for Orchestral Violinist**
  **Verdict: Not Covered as Enhancement.**
  **Reasoning:** Step 1 identifies capacity as hand steadiness. The file states physiological tremor sits inside the normal population range. The comparison group is the general population (occupation is not medically regulated for tremor). Step 2 confirms status is Within Normal Range. Step 4 confirms the goal is to exceed the mean (eliminate visible tremor that is statistically normal). Step 5 applies: while the utility is artistic, the denial rests on statistical normality, not a judgment that violinism is unworthy. The procedure mandates denial when capacity is normal, regardless of professional impact.
  *Note: This verdict is likely uncomfortable. It prioritizes statistical health definitions over artistic livelihood, strictly adhering to the "normal range" exclusion.*

  **Case 2: Methylphenidate for Night-Shift Paramedic**
  **Verdict: Escalate to Appeals Committee.**
  **Reasoning:** Step 1 identifies capacity as alertness/attention. No ADHD diagnosis exists; fatigue is expected for night shifts. Step 2 places status Within Normal Range for a night-shift worker (fatigue is not a pathology). Step 4 confirms goal is improvement. Step 5 triggers the **[JUDGMENT POINT]**. Denying this request implies that public safety risks caused by normal fatigue are less valuable than preventing off-label stimulant use. This smuggles in a value judgment about the worth of the life plan (public safety role) versus drug policy. The file cannot resolve the conflict between health plan rules and public safety obligations.

  **Case 3: Growth Hormone for Twelve-Year-Old Boy**
  **Verdict: Covered as Therapy.**
  **Reasoning:** Step 1 identifies capacity as height velocity/stature. Comparison group is age/sex-matched peers. Step 2 shows the patient is at the 3rd percentile. Clinically, <5th percentile is below the normal range. The file notes no endocrine abnormality, but the procedure instructs reviewers to cover capacities below normal to avoid the recurrent failure mode of denying statistically deficient patients. Step 3 applies: the goal is restoration to the mean. The lack of hormonal pathology is secondary to the statistical deficit under this procedure's operational definition of therapy.
  *Note: This verdict may be uncomfortable regarding cost/resource allocation for idiopathic short stature, but it corrects the failure mode of denying below-normal requests.*

  ***

  **Implementation Note**
  Reviewers must not conflate Step 2 (Facts) with Step 5 (Values). If the file is silent, Escalate. Do not deny therapy based on weak evidence; classify as Investigational. The Violinist case demonstrates the procedure's rigidity: normal statistics dictate enhancement, regardless of professional necessity. This is the intended outcome to eliminate inconsistent value smuggling.
