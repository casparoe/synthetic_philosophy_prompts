answer: |-
  # The Leakage Rate

  The cold in the vault was not the absence of heat, but a presence of its own, a heavy, humming weight that pressed against the eardrums. Elias walked the aisles, the magnetic sole of his boot clicking against the grated floor. He held a multimeter in one hand and a logbook in the other. The pages were thick, designed to withstand the condensation that formed whenever the airlock cycled.

  He stopped at Bank Four. These were the solid-state storage units, holding the agricultural models and the medical synthesis protocols. They didn't rot like the seeds in Vault Two or degrade like the antibiotics in Vault Three, but they leaked charge. It was a quantum tunneling effect, inevitable and slow. Over sixty years, the field measurements showed a loss of point-zero-four percent per annum. A fact. A physical constant, like gravity.

  Elias recorded the voltage. He capped the pen. The physical decay was the easy part. It was the number he was paid to find. The hard part was the number he was paid to justify.

  He took the elevator up to the administrative wing, where the air was warm and smelled of coffee and toner. Mara was waiting for him in the conference room. She was the lead trustee of the Northern Resilience Charter, the body established by the town's founders to manage the endowment. She had a tablet in front of her and a printed report beside it, the corners already curling from the humidity of her hands.

  "The hydrological survey came back," Mara said, without preamble. She tapped the paper. "The permafrost line is retreating faster than the models from the founding era predicted. The river basin stability is compromised."

  Elias sat down. He knew what this meant. The Charter's drawdown rate—the percentage of the endowment the town was allowed to consume each year—was tied to the probability of the town's survival. The founders had set the rate low, assuming a high probability of continuity. They had wanted the seeds and the servers to last a century.

  "If the basin is unstable," Elias said, "the survival probability drops."

  "Sharply," Mara said. "From ninety percent over the century to roughly sixty. Maybe less. The founders wrote the Charter to maximize utility for the beneficiaries. If the town floods in year forty, the seeds we save for year fifty are useless. They rot in the mud. No one eats them."

  "So you want to raise the drawdown rate," Elias said. "Spend the endowment faster. Use the medical stock now, plant the seeds now, while the ground is still solid."

  "We want to ensure there are people left to use the store," Mara corrected. "If we hoard for a future that drowns, we starve the present to feed a ghost. The Charter mandates we adjust the rate based on survival likelihood. I need you to certify the new parameter. You hold the keys to the decay constants."

  Elias looked at the report. The numbers were clean. The hydrology was sound. But the leap from *water levels* to *consumption rights* felt like a gap too wide to bridge with a single signature.

  "The decay of the batteries is a fact," Elias said slowly. "They lose charge whether we use them or not. That's physics. But the rate at which we withdraw power... that's a choice. The Charter treats them as the same variable."

  "They're linked," Mara said. "If the future is less certain, the value of saving for it diminishes. That's not just economics, Elias. It's triage."

  "It's discounting," Elias said. "You're saying the people in eighty years matter less because they might not be there. But if they *are* there, do they matter less than us? The Charter founders slid from 'might not exist' to 'worth less.' I've been reading the minutes from 1928. The mathematician who drafted the formula wrote that discounting the future merely because it is the future was a failure of imagination. He called it indefensible."

  Mara leaned forward. "The mathematician didn't have to watch a river breach its banks. He didn't have to tell a mother today that she can't have the insulin in storage because we're saving it for a child who might never be born. If we spend less now, the town fails sooner. If the town fails, the people in eighty years aren't just poorer; they're dead. Or they're someone else entirely."

  "That's the other thing," Elias said. "If we spend the endowment now, the town grows differently. The people who live here in eighty years won't be the same people who would have lived here if we saved. We're deciding who gets to exist. We can't name who we're wronging because the ones we erase never get a name."

  "We're deciding who gets to eat," Mara said, her voice tight. "That's the only name that matters. Hungry. Full. Alive. Dead. I need the number, Elias. The Trustees vote tomorrow. I need you to tell me that the physical reality of the store supports the increase."

  Elias stood up. "I need to run the projection. I'll send it over tonight."

  He went back to his office, a small glass box overlooking the town. The sky was the color of bruised iron. He sat at his terminal and opened the modeling software. It was a clunky interface, built on code that predated the Charter itself.

  He input the physical decay rates first. The seed viability drop: 2% per year. The battery leakage: 0.04% per year. The medical shelf-life degradation: exponential. These were the facts. The stock was dying slowly in the dark.

  Then he input the policy variables. The original drawdown rate was 1.5%. At that rate, the endowment would last 100 years with 40% residual capacity. He adjusted the survival probability to match the new survey. The model suggested a new rate of 2.1%.

  It was a change of only six-tenths of a percent. A tiny sliver of a number.

  Elias hit *Run*.

  The graph populated on the screen. The blue line represented the remaining capacity of the endowment. The red line represented the town's demand.

  At year ten, the lines were close. At year thirty, they diverged slightly. But it was year sixty where the arithmetic turned brutal. The compounding effect of the higher drawdown rate chewed through the reserve. The curve didn't slope; it plummeted.

  At 2.1%, the endowment hit zero in year fifty-eight.

  Elias frowned. He adjusted the rate down. 2.0%. The zero point moved to year sixty-five. 1.9%. Year seventy-two.

  He sat back. A few tenths of a point. That was all it took to erase a generation. If he certified the 2.1%, he was signing off on a future where the vaults were empty when the floodwaters peaked. If he certified the original 1.5%, he was signing off on a present where people went without medicine while the stores sat full in a drowned town.

  He looked at the marginal value assumption embedded in the code. The model assumed that future beneficiaries would be wealthier, and therefore each unit of energy or seed was worth less to them than to the current population. It was a standard assumption in capacity planning. Grow the economy, discount the future utility.

  But what if the economy didn't grow? What if the climate collapse meant they were poorer? Then the unit was worth *more* to them. The model didn't account for that. It assumed progress was a law of physics, like the battery leakage. It wasn't. It was a hope.

  Elias opened a new window. He typed out the raw data. He could manipulate the output. He could round the decay constant up, forcing the model to recommend a lower drawdown to compensate. He could fudge the survival probability. He was the engineer; his numbers carried the weight of objective truth. No one would question the multimeter readings.

  He looked at his hands. They were steady. He thought about the founders, dead for a century, binding him with their charter. They had assumed they could speak for the unborn. They had assumed their rate would hold. But a rate fixed by one generation binds later ones only for as long as they let it. The ease of overriding it was terrifying. He could change it now. The Trustees next year could change it again. There was no lock, only a convention.

  He thought about Mara. She wasn't greedy. She wasn't careless. She was looking at the river rising outside the window. She wanted to save the people she could see. She was right that a seed in a drowned town is useless. She was right that existence is a prerequisite for value.

  But she was wrong that the math made the decision for them. The math just showed the cost.

  Elias deleted the manipulated variable. He restored the raw measurement. The physical decay was what it was. He could not lie about the battery leakage. To do so would be to build the future on a falsehood. If the town spent based on a lie, they would run out sooner than expected. That was a betrayal of both the present and the future.

  He ran the calculation one last time. The graph glowed on the screen. The blue line dropped to the axis at year fifty-eight. A century of planning, erased by point-zero-six.

  He saved the file. He attached it to an email addressed to Mara and the Board.

  *Subject: Decay Constants and Drawdown Projection*

  *Body: Attached are the measured degradation rates for all physical stocks. The model output reflects the updated survival probability per the hydrological survey. The recommended drawdown rate is 2.1%. Please note: This rate assumes continued economic growth for marginal utility weighting. If future capacity is lower than current, the effective value of the drawdown increases. The physical stock will be exhausted by year 58.*

  *Elias*

  He hovered over the *Send* key.

  This number would justify the decision. It would allow them to spend faster. It would save people now. It would leave nothing for the people in year sixty. People who did not yet exist. People who would only exist if the town survived, which depended on the spend, which depended on the rate. A loop with no beginning.

  He thought about the non-identity problem again. If they spent the money, the town industrialized faster, warmed the air faster, melted the ice faster. The people born in year forty would be different conceptions, different souls. If they saved, the town stayed small, cold, stable. Different people. Neither group could claim they were owed existence. But both groups would be human. Both would feel cold. Both would need insulin.

  To discount them because they were different was to say that only the current configuration of matter mattered. To discount them because they might be richer was to gamble on a progress that the river threatened to wash away.

  Elias pressed *Send*.

  The email vanished into the server. The decision was no longer his. He had provided the fact. They would provide the license. He had separated the two, as best he could. He had refused to conflate the leakage of the battery with the leakage of their moral obligation.

  He stood up and put on his coat. He needed to go back down.

  The elevator descended into the earth. The air grew colder. The hum grew louder. He walked back to Bank Four. Under the new plan, under the 2.1% drawdown, these specific storage units were scheduled for decommissioning in year forty. They would be drained early to power the flood defenses. Their charge would be spent to keep the water out for a few more decades, leaving nothing for the century mark.

  Elias took a marker from his pocket. He walked to the third rack of batteries. The label read *Decommission: Year 40*.

  He uncapped the marker. He didn't cross it out. That would be sabotage. That would be lying.

  Instead, he wrote beneath the date: *Physical Viability: Year 100*.

  It was a small thing. A notation. It wouldn't change the vote. It wouldn't stop the drawdown. But it was a record. It was a statement that the battery could last, even if the choice was made to kill it. It was a testament to the gap between what *could* be saved and what *would* be spent.

  He capped the marker and clipped it to his pocket. He placed his hand on the cold casing of the battery. It hummed against his palm, a steady, rhythmic vibration. It was holding its charge. It was doing its job. It was waiting for a future that the math said was already gone.

  Elias stood there for a long time, listening to the hum, counting the seconds, measuring the leakage rate of his own time against the slow, inevitable drain of the store. He did not move until the shift alarm sounded, signaling the end of the day, signaling that the present had moved forward again, one second closer to the empty vault.
