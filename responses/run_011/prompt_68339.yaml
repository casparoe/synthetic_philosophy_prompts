  **Diagnosis**
  Your intuitions cluster into three conflicting groups. First, Verdicts 1–4 align with your tentative principle: heritability is a population-specific variance ratio. Second, Verdicts 5 and 10 violate this by inferring causal modifiability or between-group differences from within-group variance statistics. This is likely your friend's complaint: you treat heritability as a stable property of the trait (malleability or genetic basis) rather than a transient property of the dataset (variance distribution). Third, Verdicts 6–8 confuse estimation methods with definitions. Verdict 6 assumes MZA correlations are direct readings rather than model-dependent estimates. Verdict 8 claims GxE makes heritability undefined, whereas it merely restricts generalizability. Verdict 10 requires the most careful handling: accepting it is a fallacy while seeking a residual claim risks reintroducing the error you aim to avoid. You must distinguish between variance attribution and mean determination to resolve these conflicts.

  **The principle**
  To resolve these conflicts, adopt this refined principle, stated clause by clause:
  1.  **Definition:** Narrow-sense heritability ($h^2$) is the proportion of phenotypic variance attributable to additive genetic variance; broad-sense ($H^2$) includes dominance and epistasis. Both are ratios of variances within a distribution, not causal weights for individual means. This distinguishes SNP estimates (additive) from twin estimates (broad + confounds), addressing Verdict 7.
  2.  **Locality:** The estimate belongs to a specific population at a specific time, occupying a specific range of environments. It does not travel across populations or environmental shifts. A value of 0.80 in Population A implies nothing about Population B, addressing Verdicts 2 and 4.
  3.  **Variance vs. Intervention:** The statistic describes the attribution of *existing* variance, not the potential effect of *changing* environmental conditions. High heritability does not preclude large mean shifts via environmental change, nor does low heritability guarantee policy success. This corrects Verdict 5 by decoupling variance attribution from intervention efficacy. A trait can be 100% heritable yet fully reversible (e.g., PKU), or 0% heritable yet immutable.
  4.  **Model-Dependence:** Heritability is a parameter estimated under assumptions (e.g., equal environments, no assortative mating, linear additivity). It is not a direct observation like a twin correlation. GxE does not undefined the parameter but restricts its scope, addressing Verdicts 6 and 8.

  This principle clarifies that heritability quantifies current uncertainty reduction regarding individual differences, not future manipulability or group origins. It restricts inference strictly to the variance structure of the measured dataset. By separating variance attribution from mean determination, it prevents the leap from within-population statistics to between-population explanations. Crucially, it frames heritability as a property of the dataset's variance structure, not the trait's inherent biology. This directly answers your friend's critique: the number changes if the environmental variance changes, even if the biology stays constant. It is a snapshot of a specific population's diversity, not a universal constant of the phenotype.

  **Retractions**
  Verdict 5 must be retracted. Low heritability indicates high current environmental variance, not that environmental *intervention* will work. If the varying environments are non-malleable (e.g., historical trauma), policy may fail. Conversely, high heritability in uniform schools does not mean policy cannot shift the mean; it only means policy won't increase variance. This addresses your friend's critique: you were treating the statistic as a trait property (malleability) rather than a dataset property (variance ratio).
  Verdict 6 requires rewording. MZA correlations are estimates contingent on the Equal Environments Assumption. They are not direct readings of heritability.
  Verdict 8 is false. GxE contributes to variance components; it does not render decomposition undefined, though it limits generalizability across environments.
  Verdict 10 requires the most significant correction. You must retract the claim that high within-population heritability makes genetic between-group differences "likelier." This is the ecological fallacy. Within-group variance components ($\sigma^2_G / \sigma^2_P$) are mathematically independent of between-group mean differences ($\mu_A - \mu_B$). Two populations can have identical high heritability but differ in means entirely due to environment (e.g., nutrition affecting height). The genetic variance *within* groups tells you nothing about the genetic means *between* groups. The only surviving residual claim is an existence proof: high within-population heritability proves the trait *can* vary genetically in humans. It confirms developmental sensitivity to genetic variation, but it provides zero evidence that specific group differences *are* genetic. You cannot use within-group ratios to apportion between-group causes.
  Verdict 9 is acceptable if clarified: heritability falls because environmental variance increases or genetic expression is suppressed, not because the biology changes.

  **Two new cases**
  Case 1: Height in Europe. Heritability is high (~0.80), yet mean height increased by 10cm over the 20th century due to nutrition. This demonstrates that high heritability is compatible with large environmental mean shifts, directly contradicting the intuition that high $h^2$ implies "fixed" traits. It shows that within-population variance attribution says nothing about between-generation mean changes.
  Case 2: Myopia (nearsightedness). Heritability is high in populations with uniform education, but prevalence skyrocketed with increased near-work (reading/screens). If you measured heritability before the epidemic, it was high; if you measure during the shift, environmental variance dominates. This shows heritability is time-sensitive. A policy limiting screen time could reduce prevalence regardless of the prior heritability estimate. Both cases illustrate that heritability describes the *current* mix of variance sources, not the *potential* for environmental change to alter the trait's distribution or mean. For your primer, these cases serve as concrete proofs that high heritability never licenses the conclusion that environmental interventions are futile. They reinforce the distinction between variance explanation and mean determination.

  **Bottom line**
  Heritability is a population-specific statistic describing the proportion of current phenotypic variance attributable to genetic differences. It does not measure individual genetic determination, trait malleability, or the cause of between-group differences. High heritability does not preclude environmental intervention, and low heritability does not guarantee it. Treat estimates as descriptions of specific datasets, not properties of traits.
