answer: |-
  This is a remarkably precise description of a structural problem in administrative decision-making. You have identified a feedback loop where the *output* of one decision becomes the *input* standard for the next, decoupling the process from its original source of authority.

  Here is an analysis of the phenomenon, structured according to your four requests, followed by a proposed term.

  ### 1. Established Names and Literature

  There is no single term that captures the logical, organizational, and legal dimensions simultaneously, but three distinct concepts from different fields cover the facets of what you are describing.

  **A. Normalization of Deviance (Organizational Sociology / Safety Engineering)**
  *   **Source:** Coined by sociologist Diane Vaughan in her analysis of the *Challenger* disaster (*The Challenger Launch Decision*, 1996).
  *   **Coverage:** This is the strongest match for the *organizational behavior*. Vaughan described how engineers gradually accepted O-ring erosion as "acceptable risk" not because the rules changed, but because previous flights with erosion had not failed.
  *   **Fit:** It captures the unconscious, incremental redefinition of the standard based on prior outcomes rather than original specifications. It explains why no one feels they are breaking the rule; they are simply accepting the "new normal" established by the last successful decision.

  **B. Doctrinal Drift (Legal Theory / Political Science)**
  *   **Source:** Used in analyses of judicial behavior and administrative law.
  *   **Coverage:** This describes how the application of a legal doctrine shifts over time away from its original textual or intentionalist foundation.
  *   **Fit:** It captures the *legal* dimension. In your case, the "doctrine" is the zoning code. The drift occurs because the board is engaging in *case-based reasoning* without *principle-based anchoring*.

  **C. The Sorites Series (Philosophy / Logic)**
  *   **Source:** The ancient "Heap Paradox" (Eubulides).
  *   **Coverage:** This describes the *logical structure*. If you remove one grain from a heap, it is still a heap; repeat enough times, and you have no heap.
  *   **Fit:** It captures the *incremental nature*. However, as you noted, your case is slightly distinct because the justification isn't just "this is still a heap," but "this is like the last heap we accepted."

  ### 2. Differentiation from Near Neighbours

  You are correct to reject the instinctive labels. Here are the sharp distinctions:

  **Vs. The Slippery Slope**
  *   **The Difference:** Direction of Causality and Time.
  *   **Slippery Slope:** A *predictive* argument (often fallacious). It claims: "If we decide A *now*, it will *cause* us to decide Z *later*." It is a warning about future consequences.
  *   **Your Phenomenon:** A *descriptive* reality. You are not predicting Z; you have arrived at Z through a chain of retrospective justifications. The slope is not slippery because of gravity (inevitability); it is slippery because you are using the last foothold as the map for the next step.

  **Vs. The Sorites Paradox (The Heap)**
  *   **The Difference:** The Source of the Boundary Shift.
  *   **Sorites:** Relies on *semantic vagueness*. The trouble is that the word "heap" (or "unusual lot shape") has no sharp boundary.
  *   **Your Phenomenon:** Relies on *reference point shifting*. Even if "eight feet" is sharp, your standard becomes "the previous variance." The problem is not that the words are vague, but that the *anchor* is moving. In a classic Sorites, you compare the object to the *concept*. In your board, you compare the object to the *last decision*.

  **Vs. Moving the Goalposts**
  *   **The Difference:** Intent and Agency.
  *   **Moving Goalposts:** Deliberate, adversarial, and strategic. An agent changes the criteria to prevent an opponent from succeeding.
  *   **Your Phenomenon:** Unconscious, bureaucratic, and cooperative. The board is trying to be *fair* (treating like cases alike). The drift is a side effect of a desire for consistency, not a strategy to undermine the code.

  ### 3. The Structure: Local Consistency vs. Global Inconsistency

  This is the core of your inquiry. You asked if the diagnosis depends on vagueness or procedure.

  **The Mechanism: Myopic Precedent**
  The structure is a failure of **anchoring**. In a healthy precedent system (like a high court), a new case is compared to the *principle* established in the previous case, which is itself linked to the *Constitution/Statute*.
  In your board's procedure, the new case is compared to the *outcome* of the previous case.

  *   **Healthy Chain:** Code $\to$ Principle $\to$ Case A $\to$ Principle $\to$ Case B.
  *   **Drifting Chain:** Code $\to$ Case A $\to$ Case B $\to$ Case C.

  **Does it require vagueness?**
  No. The same erosion would occur under a perfectly sharp rule if the *procedure* allows the previous outcome to serve as the standard.
  *   *Example:* Rule: "Red lights only." Decision 1: "Orange is close enough to Red." Decision 2: "Yellow is close enough to Orange."
  *   However, vagueness (e.g., "unusual lot shape," "comparable circumstances") acts as a **lubricant**. It provides the rhetorical cover needed to make the local comparison plausible. If the rule were "No variance unless physically impossible," the drift would be harder to justify. But if the rule is "No variance unless undue hardship," the definition of "hardship" can absorb the drift.

  **The Recognized Account**
  In ethics and decision theory, this is sometimes discussed under **Contextualism** or **Contrastivism**. The standard for "acceptable" is context-sensitive. In your board, the "context" is the immediate history of decisions.
  The specific structural failure is **Local Coherence / Global Incoherence**. You are maximizing consistency with $t_{n-1}$ at the expense of consistency with $t_0$ (the Code).

  ### 4. The Edges: Virtue vs. Pathology

  You asked why this is a pathology in zoning but a virtue in Common Law.

  **The Virtue: Principled Evolution**
  In Common Law, precedent is virtuous when it **refines the principle**.
  *   *Case:* A variance is granted for a 7'4" porch because the lot is triangular.
  *   *Next Case:* A variance is granted for a 7'0" garage.
  *   *Virtuous Justification:* "Like the triangular lot case, this lot has a unique drainage constraint that makes the 8' rule impractical. We are refining the 'undue hardship' principle."
  *   *Result:* The standard becomes more nuanced but remains tethered to the *intent* of the code (safety, spacing, light).

  **The Pathology: Outcome Matching**
  In your board, it becomes pathological when the justification is **equality of treatment** rather than **adherence to principle**.
  *   *Pathological Justification:* "We allowed 7'4" last year, so it would be unfair to deny 7'0" now."
  *   *Result:* The standard becomes tethered to the *history of exceptions*, not the *rule*.

  **The Boundary Case**
  Consider a variance for a 6-foot setback.
  *   **Virtue:** "The code intends to ensure fire access. This material is fire-resistant, so a 6-foot setback achieves the *code's safety goal* despite violating the *code's measurement*." (Tethered to Intent).
  *   **Pathology:** "We allowed 6'6" last month for a similar owner, so we must allow 6 feet." (Tethered to Precedent).

  The line is drawn at **justificatory tethering**. If the reasoning links back to the Code's purpose, it is refinement. If the reasoning links only to the Board's recent history, it is drift.

  ### 5. Proposal: A Term and Definition

  Since no single existing term captures the specific administrative mechanism you described (the decoupling of local consistency from global rules via recursive comparison), I propose the following term:

  **Term:** **Precedential Baseline Drift**

  **Definition:**
  A systemic phenomenon in administrative or judicial bodies where the standard for decision-making shifts incrementally away from a written authority (the Code/Policy) because each decision uses the *outcome of the immediately preceding decision* as its primary reference point, rather than the original authority.

  **Exclusion Criteria (What it is not):**
  *   It is not **Slippery Slope**, because it describes an actual historical trajectory, not a predictive warning.
  *   It is not **Moving Goalposts**, because the shift is unconscious and driven by a desire for fairness/consistency, not strategic advantage.
  *   It is not **Sorites**, because the drift is driven by *relational comparison* (Case B vs. Case A) rather than *semantic vagueness* (Is this a heap?).

  **Clear Instance:**
  *   **Your Zoning Board:** The 8ft $\to$ 5ft transition where the justification is "we allowed 6ft last year." The anchor has moved from the Code to the File.

  **Non-Instance:**
  *   **Inflation Adjustment:** A tax bracket that shifts annually based on CPI. This is a drift in numbers, but it is tethered to an *external, objective index* agreed upon in the original rule, not the *previous year's tax bracket*.
  *   **Common Law Refinement:** A court ruling that narrows a definition of "search" based on new technology, explicitly citing the *Constitutional principle* of privacy rather than just the last ruling.

  **Why this diagnosis matters:**
  The diagnosis identifies the cure. You cannot stop the drift by demanding "stricter decisions." You stop it by changing the **reference requirement**.
  *   *Procedural Fix:* Require that every variance decision explicitly cite the **Code Section** and the **Intent** it serves, and explicitly forbid citing **Previous Variances** as primary justification.
  *   *Visual Fix:* Maintain a "Standard Chart" in the meeting room that lists the Code minimums. Do not maintain a "Precedent Chart" that lists recent approvals. Force the anchor to remain at $t_0$.

  You are experiencing **Precedential Baseline Drift**. It is the bureaucratic equivalent of a ship correcting its course relative to the wake of the ship in front of it, rather than the compass, until the entire fleet has sailed off the map.
