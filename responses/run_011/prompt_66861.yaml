prompt: |-
  I'm the commissioning editor for a history documentary strand — four or five hours a year, primetime-ish — and the pitch I get most often is some version of "was it real?" Troy, Arthur, the Exodus, Robin Hood, Atlantis once a quarter. Right now every one of those decisions turns into a shouting match in a room: our advisory historian says nothing before written records is safe and we should only ever make programmes about the story, and the producers say if we won't commit to a war actually happening the audience walks in minute six. I've allready half-committed to one of these for next year and I'd rather have a written procedure I can point at than another argument.

  So: write a decision procedure my development team can run on a "legend or history?" pitch in about an hour, before we spend money on a recce or a talking head. It has to be grounded in what these arguments actually turn on, not generic scepticism. At minimum it needs to handle:

  - how to tell a meaningful silence from a boring one. The Egypt case is the hard version: an enormous administrative culture with lots of surviving records, and no mention of the thing you'd expect. But the procedure needs to say when an absence counts, when it doesn't, and it has to deal with the obvious reply that regimes don't commemorate their own disasters — so there's an expectedness test and a suppression test and they can pull in opposite directions.
  - the gap between event and earliest source, and why the size of the gap isn't the whole story. A short gap doesn't help if the source's genre isn't trying to report anything, and a long gap doesn't kill a claim if the material was carried in a form that resists drift. I want a real discount rule with the reasons for it, plus how to treat a source that names the right people and places but is plainly shaped for a later audience's identity.
  - corroboration in a different medium, and specifically the third-party archive case: Bronze Age Anatolian correspondence that names a city in the Troad and a western power whose names look like the Greek words for Troy and the Achaeans, where the identifications are widely accepted but not nailed down. The procedure should say what such documents can and cannot license — they seem to name places and frictions, never the plot anyone wants them to name.
  - the onion test for layered traditions, where the earliest mention of a figure is centuries later, an earlier near-contemporary writer describes the battle and the enemies but never names him, and then a 12th-century chronicle supplies basically everything audiences know. I want an explicit rule about how to check whether a detail is evidence of an event or evidence of the layer that introduced it.
  - the kernel problem. Almost every one of these pitches has a defensible minimal claim ("something was destroyed here", "a people by this name existed in this region by this date", "some warlord probably won some battles") sitting under an indefensible full claim (the ten-year siege, the twelve battles in order, the mass migration and the drowned army). The procedure has to force the team to write down the exact minimal proposition they'd be committing to on screen, and to say what the show is allowed to assert, what it's allowed to dramatise, and what it's allowed to imply by juxtaposition, which is where these things usually go wrong.
  - the case where the story is false as history but solid as evidence about the people who told it. That's reportable, but only under a frame, and I want the frame spelled out so a compliance editor and a journalist reviewing us can see we weren't smuggling.

  Give me the steps in order, what counts as a sufficient answer to each step, where the procedure kills the pitch outright, where it sends it to the historian because the question is one of standards rather than facts, and — this matters to me — flag every step that is really a judgement call wearing a procedural costume. Then run it on three pitches: the Trojan War as Homer tells it, King Arthur as a real war leader, and the Exodus as the biblical narrative has it. One of those three is going to annoy me; say so plainly rather than hedging, and tell me what the show could legitimately be about instead. Finish with the failure modes: which kind of pitch this procedure systematically over-admits, which it systematically under-admits, and why.

  Format: after each of the three runs, put the outcome on its own line as `Ruling: <greenlight | greenlight-with-frame | no-go>`, and make the very last line of your answer exactly `Verdict: <the one pitch you'd put into production first>`.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Analyze the Request:**
      *   **Role:** Commissioning Editor for a history documentary strand (4-5 hours/year, primetime).
      *   **Problem:** Constant conflict between advisory historians (skeptical, "it's myth") and producers (need narrative certainty, "audience walks").
      *   **Task:** Create a 1-hour decision procedure for "Legend or History?" pitches.
      *   **Requirements:**
          *   Grounded in actual historiographical arguments (not generic skepticism).
          *   Handle specific issues: Meaningful silence (Egypt case), Gap between event/source (genre vs. drift), Corroboration in different medium (Hittite archives), Onion test (layered traditions), Kernel problem (minimal vs. full claim), False history/True memory frame.
          *   Format: Steps in order, sufficiency criteria, kill points, historian referral points, flagging judgement calls.
          *   Application: Run on Troy, Arthur, Exodus.
          *   Constraint: One of the three must be identified as annoying/problematic plainly.
          *   Output Format: Specific ruling lines after each run, specific final verdict line.
          *   Ending: Failure modes (over-admits/under-admits).

  2.  **Deconstruct the Historiographical Challenges:**
      *   *Silence:* Absence of evidence vs. evidence of absence. Needs an "Expectation Matrix."
      *   *Gap/Source:* Oral tradition stability vs. literary invention. Needs a "Transmission Vector" assessment.
      *   *Corroboration:* External mentions (Hittites) vs. Narrative details (Homer). Needs a "Scope Limit."
      *   *Onion/Layers:* Distinguishing the core event from later accretions. Needs a "Stratigraphic Rule."
      *   *Kernel:* Minimal fact vs. Dramatic story. Needs a "Claim Hierarchy."
      *   *Frame:* History of memory vs. History of events. Needs a "Genre Switch."

  3.  **Drafting the Procedure (The "Protocol"):**
      *   *Goal:* Make it actionable within an hour.
      *   *Structure:* 6 Steps corresponding to the user's bullet points.
      *   *Tone:* Professional, decisive, slightly bureaucratic but intellectually rigorous.
      *   *Flags:* Explicitly mark where human judgment overrides the checklist.

      *   *Step 1: The Silence Audit (Expectation vs. Suppression).*
          *   Does the culture record *this type* of event?
          *   Is there a motive to suppress?
          *   *Kill:* High expectation + No suppression motive + Silence.
      *   *Step 2: The Transmission Vector (Gap & Genre).*
          *   How did the info travel? Oral formulaic (stable) vs. Literary invention (fluid).
          *   *Kill:* Long gap + Literary genre + No oral mechanism.
      *   *Step 3: External Corroboration (The Third-Party Limit).*
          *   Does the external source confirm the *plot* or just the *context*?
          *   *Rule:* External docs license geography/politics, not narrative arcs.
      *   *Step 4: The Onion Stratigraphy (Layering).*
          *   Map details to their first appearance date.
          *   *Rule:* A detail cannot be evidence for a period earlier than its first attestation unless physically anchored.
      *   *Step 5: The Kernel Definition (Minimal vs. Full).*
          *   Define the "Floor" (undisputed) and "Ceiling" (dramatic claim).
          *   *Requirement:* Written statement of what is asserted vs. dramatized.
      *   *Step 6: The Frame Switch (Event vs. Memory).*
          *   If the event fails, does the *belief* succeed?
          *   *Condition:* Must change the title/premise from "What Happened" to "Why They Said It Happened."

  4.  **Running the Procedure on the Three Pitches:**

      *   **Pitch 1: The Trojan War (Homeric Version)**
          *   *Silence:* Hittite records mention Wilusa/Taruisa and Ahhiyawa. Silence on a 10-year siege.
          *   *Transmission:* Oral tradition (formulaic) allows some stability, but Homer is literary synthesis centuries later.
          *   *Corroboration:* Hittites confirm tension/place names, *not* Helen, Achilles, or the cause.
          *   *Onion:* Gods, monomachies, specific weapons are late layers.
          *   *Kernel:* Conflict over Troy happened. 10-year siege is unlikely.
          *   *Frame:* Can do "The War That Made the Myth."
          *   *Verdict:* Greenlight-with-frame (Archaeology + Hittite context, drop the specific Homeric narrative as fact).

      *   **Pitch 2: King Arthur (Real War Leader)**
          *   *Silence:* Gildas (near contemporary) mentions Badon Hill but *no Arthur*. Nennius (centuries later) names him.
          *   *Transmission:* Oral/Welsh bardic. High drift.
          *   *Corroboration:* None contemporary.
          *   *Onion:* Everything we know (Camelot, Round Table, Mordred) is 12th century+ (Geoffrey of Monmouth).
          *   *Kernel:* Someone led Britons at Badon? Maybe. But "Arthur" as a specific individual is unproven.
          *   *Frame:* "The Invention of the King."
          *   *Verdict:* No-go (for "Real War Leader"). Too much gap, too little anchor. The "Real" claim is indefensible.

      *   **Pitch 3: The Exodus (Biblical Narrative)**
          *   *Silence:* Egypt records *everything* (logistics, slaves, borders). No mention of 2M people or plague.
          *   *Transmission:* Religious text, theological purpose, not historiography.
          *   *Corroboration:* None. Archaeology of Sinai shows no mass migration trace.
          *   *Onion:* Text compiled centuries after alleged event.
          *   *Kernel:* Some Semitic groups left Egypt? Plausible. The Narrative (Moses, 10 Plagues, 40 years) is false as history.
          *   *Frame:* "The Story That Built a Nation."
          *   *Verdict:* Greenlight-with-frame (Strictly memory/identity, no attempt to validate the physical journey).
          *   *Annoyance Factor:* This is the one that usually causes the shouting match. The prompt asks me to identify which one is annoying. Exodus is the most politically charged and historically barren for the "Real" claim. I need to be plain.

      *   *Refining the "Annoying" Choice:* The prompt says "One of those three is going to annoy me; say so plainly."
          *   Troy is usually acceptable as "War happened, story is embellished."
          *   Arthur is usually acceptable as "Dark Age mystery."
          *   Exodus is the minefield. It's the one where the "Real" claim is weakest but the cultural stakes are highest. I will flag Exodus as the problematic one for a "Real History" pitch.

  5.  **Drafting the Failure Modes:**
      *   *Over-admits:* "Kernel" pitches that are so minimal they are boring (e.g., "A battle happened somewhere").
      *   *Under-admits:* Oral cultures where archaeology is silent but tradition is strong (e.g., Indigenous histories, though maybe out of scope for this specific brief, still a methodological bias).

  6.  **Review against Constraints:**
      *   1-hour procedure? Yes, checklist style.
      *   Handle specific historiographical points? Yes (Silence, Gap, Corroboration, Onion, Kernel, Frame).
      *   Flag judgement calls? Yes, will add `[JUDGEMENT CALL]` tags.
      *   Ruling format? `Ruling: <status>`.
      *   Final line? `Verdict: <pitch>`.

  7.  **Final Polish:**
      *   Ensure the tone is authoritative (Commissioning Editor to Development Team).
      *   Make sure the distinction between "Greenlight" (Fact) and "Greenlight-with-frame" (Memory/Myth) is clear.
      *   Ensure the "Annoying" call is explicit in the Exodus section.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Exodus is false." I need to apply the *procedure* to show *why* it fails the "Real History" test but passes the "Memory" test. The prompt asks me to say which pitch is annoying. I will identify the Exodus pitch as the one that consistently breaks the room because the "Kernel" is too small to sustain a primetime "Did it Happen?" show, forcing the Frame Switch which producers hate.

      *(Refining the "Annoying" instruction)*: "One of those three is going to annoy me; say so plainly rather than hedging." I should identify this in the analysis of the third run or as a summary note. I'll put it in the analysis of the Exodus run to be direct.

      *(Final check on Verdict)*: I need to pick *one* to put into production first. Troy is the safest bet for a "History" strand that wants audience numbers without lying. It has the Hittite corroboration which Arthur and Exodus lack. So Troy gets the final verdict.

  8.  **Constructing the Output:** (Proceeding to generate response based on these thoughts).

      *   *Procedure Name:* The "Legend/History" Gatekeeping Protocol (LHGP).
      *   *Steps:* 1-6 as planned.
      *   *Runs:* Troy, Arthur, Exodus.
      *   *Failure Modes:* End section.
      *   *Final Line:* Verdict: The Trojan War (Kernel & Context).

      *Wait, one detail:* "make the very last line of your answer exactly `Verdict: <the one pitch you'd put into production first>`."
      *   Okay, I need to ensure no trailing whitespace or extra text after that line.

      *Another detail:* "Flag every step that is really a judgement call wearing a procedural costume."
      *   I will add `[JUDGEMENT FLAG]` to the relevant steps in the procedure section.

      *Another detail:* "One of those three is going to annoy me; say so plainly rather than hedging."
      *   I will include a specific "Editor's Note" in the Exodus section identifying it as the friction point.

      *Let's write.*
answer: |-
  # THE LEGEND/HISTORY GATEKEEPING PROTOCOL (LHGP)
  **Version:** 1.0 | **Time Budget:** 60 Minutes | **Owner:** Commissioning Editor

  **Purpose:** To resolve the "Did it happen?" deadlock before development spend. This is not a truth test; it is a *claim-definition* test.
  **Instruction:** Run this checklist on the pitch deck and the lead historian's preliminary memo. If any step triggers a **KILL**, the pitch dies as a "Real History" documentary. It may be resubmitted as a "History of Memory" pitch (see Step 6).

  ---

  ### STEP 1: THE SILENCE AUDIT (Expectation vs. Suppression)
  **Question:** Does the absence of evidence count as evidence of absence?
  **Procedure:**
  1.  Identify the administrative capacity of the host culture (e.g., Egypt = High; Dark Age Britain = Low).
  2.  Identify the *genre* of records kept (e.g., Victory stelae, tax logs, diplomatic correspondence).
  3.  Apply the **Suppression Test**: Is there a documented motive for the regime to erase *this specific type* of event (e.g., a defeat)?
      *   *Pass:* Culture records defeats OR event type is usually recorded AND no suppression motive exists. Silence is meaningful.
      *   *Fail:* Culture only records victories AND event is a defeat. Silence is expected.
      *   *Fail:* Culture has no surviving written records. Silence is noise.
  **[JUDGEMENT FLAG]:** Determining "motive to suppress" requires interpreting intent from fragmentary data.
  **KILL CONDITION:** High administrative capacity + No suppression motive + Total silence on a mass-scale event (e.g., 2 million people leaving).

  ### STEP 2: THE TRANSMISSION VECTOR (Gap & Genre)
  **Question:** How did the story survive the gap between event and source?
  **Procedure:**
  1.  Measure the temporal gap (Years between event and earliest written source).
  2.  Identify the **Carrier Mechanism**:
      *   *Oral-Formulaic:* (e.g., Epic poetry). Resists drift on names/places, allows drift on plot.
      *   *Literary-Theological:* (e.g., Scripture/Chronicle). High drift risk, shaped by later ideology.
      *   *Administrative:* (e.g., Logs). Low drift, but rare for narratives.
  3.  Apply the **Discount Rule**:
      *   Gap < 50 years + Administrative = Full Weight.
      *   Gap > 100 years + Oral-Formulaic = Names/Places valid, Plot discounted.
      *   Gap > 200 years + Literary = Plot invalid as evidence, valid as reception history.
  **[JUDGEMENT FLAG]:** Classifying a text's "genre intent" (reporting vs. edifying) is interpretive.
  **KILL CONDITION:** Gap > 200 years + Literary-Theological Carrier + Claim of specific narrative accuracy.

  ### STEP 3: EXTERNAL CORROBORATION (The Third-Party Limit)
  **Question:** What do the neighbours say?
  **Procedure:**
  1.  Locate independent archives (e.g., Hittite, Assyrian, Roman) contemporary to the *event*, not the *source*.
  2.  Match toponyms (place names) and ethnonyms (people names).
  3.  Apply the **Scope Limit**: External documents license **Geography** and **Political Tension** only. They do not license **Causality** or **Character Agency**.
      *   *Allowed:* "Troy and Ahhiyawa were in conflict."
      *   *Forbidden:* "Paris stole Helen causing the war."
  **KILL CONDITION:** Pitch asserts narrative causality (the "Why") based solely on external toponym matches.

  ### STEP 4: THE ONION STRATIGRAPHY (Layering)
  **Question:** Which details belong to which century?
  **Procedure:**
  1.  List the top 5 dramatic details audiences expect (e.g., Round Table, Parting of the Sea, Single Combat).
  2.  Date the *earliest attestation* of each detail.
  3.  Apply the **Stratigraphic Rule**: A detail cannot be used as evidence for a period earlier than its first attestation unless anchored by physical archaeology.
      *   *Example:* If "Camelot" appears in 12th C texts, it is 12th C evidence, not 6th C evidence.
  **[JUDGEMENT FLAG]:** Deciding if a detail is "anchored" by archaeology often relies on contested interpretations of material culture.
  **KILL CONDITION:** Pitch presents a detail as "historical fact" for the event period when its first attestation is >300 years later.

  ### STEP 5: THE KERNEL DEFINITION (Minimal vs. Full Claim)
  **Question:** What exactly are we betting the budget on?
  **Procedure:**
  1.  Draft the **Floor Claim** (The indisputable minimum, e.g., "Troy VIIa was destroyed by fire c. 1180 BCE").
  2.  Draft the **Ceiling Claim** (The dramatic maximum, e.g., "Agamemnon led a coalition to retrieve Helen").
  3.  Draft the **Assertion Matrix**:
      *   *Assert as Fact:* Must meet Floor.
      *   *Dramatise as Possibility:* Can approach Ceiling if flagged as "Tradition says..."
      *   *Imply by Juxtaposition:* **FORBIDDEN.** (e.g., Cutting from a map of migration to a shot of a starving child implies a specific suffering not in evidence).
  **[JUDGEMENT FLAG]:** Determining what constitutes "Implication by Juxtaposition" is an editorial call.
  **KILL CONDITION:** Producers refuse to sign off on the Assertion Matrix or insist the Ceiling is the Floor.

  ### STEP 6: THE FRAME SWITCH (Event vs. Memory)
  **Question:** If the history fails, does the memory succeed?
  **Procedure:**
  1.  If Steps 1-5 kill the "Real History" pitch, check the **Cultural Impact Test**: Did the *belief* in this story change the world?
  2.  If Yes: Reframe the documentary.
      *   *Old Title:* "The Real Exodus."
      *   *New Title:* "The Exodus: The Story That Made Israel."
  3.  **Compliance Lock:** The opening narration must explicitly state the shift from *event history* to *memory history* within the first 3 minutes.
  **[JUDGEMENT FLAG]:** Assessing "Cultural Impact" can be subjective; stick to measurable downstream effects (texts, laws, wars).
  **KILL CONDITION:** Pitch insists on "Real History" framing after failing Steps 1-5.

  ---

  ## RUN 1: THE TROJAN WAR (HOMERIC NARRATIVE)

  **Step 1 (Silence):** Hittite records exist. They mention *Wilusa* (Troy) and *Ahhiyawa* (Achaeans). They mention friction/treaties. They do not mention a 10-year siege or Helen.
  *   *Result:* Silence on the *plot* is expected (diplomacy logs don't record kidnappings). Silence on *conflict* is not present. **PASS.**

  **Step 2 (Transmission):** Gap is approx. 400-500 years. Carrier is Oral-Formulaic (Epic).
  *   *Result:* Names/Places carry weight. Specific plot points (Achilles' rage, single combat) are discounted. **PASS (with discount).**

  **Step 3 (Corroboration):** Hittite tablets (Tawagalawa Letter) name a western warlord causing trouble in Wilusa.
  *   *Result:* Licenses "Conflict between Mycenaean Greeks and Troy." Does not license "War over a woman." **PASS (Scope Limited).**

  **Step 4 (Onion):** Gods intervening, bronze armor descriptions, specific hero genealogies.
  *   *Result:* Divine intervention is 8th C theological layer. Armor is mixed period (8th C anachronisms in a Bronze Age setting). **FAIL for specific dramatization.**

  **Step 5 (Kernel):**
  *   *Floor:* A conflict or series of conflicts occurred between the Mycenaean sphere and the city of Troy in the Late Bronze Age.
  *   *Ceiling:* The Iliad is a reportage of a specific 10-year siege.
  *   *Assertion:* We assert the Floor. We dramatize the Ceiling as "The Legend."
  *   *Result:* **PASS.**

  **Step 6 (Frame):** Not needed if Step 5 holds, but recommended for compliance.
  *   *Result:* **Greenlight-with-frame.**

  **Editor's Note:** This works because the Hittite corroboration gives us a "Real" hook without requiring us to defend the magic.

  Ruling: greenlight-with-frame

  ---

  ## RUN 2: KING ARTHUR (REAL WAR LEADER)

  **Step 1 (Silence):** Gildas (6th C, near contemporary) writes *On the Ruin and Conquest of Britain*. Mentions Battle of Badon Hill. **Does not name Arthur.**
  *   *Result:* High expectation of naming a leader in a victory sermon. Silence is meaningful. **FAIL.**

  **Step 2 (Transmission):** Gap is 300+ years to Nennius who first names him. Carrier is Welsh Bardic/Chronicle mix.
  *   *Result:* High drift risk. Oral tradition in this context is dynastic propaganda, not stable formulaic epic. **FAIL.**

  **Step 3 (Corroboration):** No contemporary external archives (Saxon records are later/legendary too).
  *   *Result:* No third-party license. **FAIL.**

  **Step 4 (Onion):** Camelot, Round Table, Lancelot, Mordred. All 12th Century (Geoffrey of Monmouth/Chrétien de Troyes).
  *   *Result:* Zero details pre-1100s are secure. Even "Arthur" as a name might be a title or epithet. **FAIL.**

  **Step 5 (Kernel):**
  *   *Floor:* The Britons won a battle at Badon Hill c. 500 CE.
  *   *Ceiling:* A man named Arthur led them.
  *   *Assertion:* We cannot assert the Ceiling. The Floor is a battle, not a man.
  *   *Result:* **FAIL.** A show about "A Battle Where The Leader Is Unknown" is not the pitch sold.

  **Step 6 (Frame):** "The Invention of the King."
  *   *Result:* Viable as cultural history, fails as "Real War Leader."

  **Editor's Note:** This pitch is a zombie. It dies every time because the "Real Person" claim is unsupported, but producers keep trying to sneak the 12th-century romance in as 6th-century fact.

  Ruling: no-go

  ---

  ## RUN 3: THE EXODUS (BIBLICAL NARRATIVE)

  **Step 1 (Silence):** Egypt (13th C BCE) had massive administrative capacity. Stelae for minor border skirmishes exist.
  *   *Result:* No record of 10 plagues, no record of Pharaoh's army drowning, no record of 2 million people (or even 20,000) traversing the Sinai.
  *   *Suppression Test:* Regimes do not suppress *total collapses* of this magnitude easily, but they do suppress slave escapes. However, the scale alleged is state-ending.
  *   *Result:* **HARD FAIL.** The silence is deafening for the *narrative scale*.

  **Step 2 (Transmission):** Gap is 600+ years to compiled text. Carrier is Religious/Theological.
  *   *Result:* Genre intent is identity formation, not reportage. Discount Rule applies maximum penalty. **FAIL.**

  **Step 3 (Corroboration):** No external mentions of Israelites in Egypt or Sinai during the period. Merneptah Stele mentions Israel *in Canaan* later.
  *   *Result:* Licenses "Israelites existed in Canaan by 1200 BCE." Does not license "They came from Egypt." **FAIL.**

  **Step 4 (Onion):** Tabernacle details match later Jerusalem temple, not wilderness gear. Laws reflect 7th C BCE concerns.
  *   *Result:* The text describes the time it was *written*, not the time it *depicts*. **FAIL.**

  **Step 5 (Kernel):**
  *   *Floor:* Some Semitic groups lived in and left Egypt during the New Kingdom.
  *   *Ceiling:* Moses led a unified nation of 2 million through the sea.
  *   *Assertion:* The Floor is too small for a 2-hour primetime "Did It Happen?" show. The Ceiling is archaeologically impossible.
  *   *Result:* **FAIL.**

  **Step 6 (Frame):** "The Exodus: The Story That Forged a People."
  *   *Result:* **PASS.** But this is not the pitch submitted. The pitch is "Did The Exodus Happen?"

  **Editor's Note:** This is the annoying one. It is the one that causes the shouting match. Why? Because the "Kernel" is so small ("Some slaves escaped") it feels like a betrayal of the audience expectation, but the "Full Claim" is indefensible. Producers will fight you on Step 1, claiming "Egyptians lied about everything." Historians will fight you on Step 6, claiming "You're reducing sacred history to sociology." This pitch requires the most editorial spine. If you greenlight this, you are making a theology show, not a history show. Be clear about that.

  Ruling: greenlight-with-frame

  ---

  ## FAILURE MODES ANALYSIS

  **Systematic Over-Admission:**
  The procedure over-admits **"The Kernel Bore."** By forcing a defensible "Floor Claim," we risk greenlighting shows that are technically true but dramatically inert (e.g., "The Trojan War: A Minor Border Skirmish"). Producers will try to dress the Ceiling in the Floor's clothes during editing.
  *Mitigation:* The Assertion Matrix (Step 5) must be signed by Legal/Compliance, not just Development.

  **Systematic Under-Admission:**
  The procedure under-admits **"Oral Truths."** Cultures without writing (or whose writing was destroyed) are penalized by Step 1 and 2. This procedure privileges the Literate West (Egypt/Hittites/Greece) over Indigenous or Oral histories where the "Transmission Vector" is stable but unrecognizable to this checklist.
  *Mitigation:* Add an "Oral Sovereignty" clause for cultures where oral tradition is the primary legal/historical record, requiring a different specialist historian.

  **The Annoyance Factor:**
  The Exodus pitch is the friction point. It is the only one where the "Greenlight-with-frame" feels like a rejection of the premise. Troy allows a war; Arthur allows a mystery; Exodus allows only a metaphor. That is where the room will shout.

  Verdict: The Trojan War (Kernel & Context)
