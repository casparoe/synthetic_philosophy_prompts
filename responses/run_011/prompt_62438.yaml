answer: |-
  Entry point
  You begin from the standard formalism of General Relativity. You accept that the theory is diffeomorphism invariant and that the Hole Argument construction is mathematically legitimate: given a model $\mathcal{M} = (M, g)$ and a diffeomorphism $\phi$ that is the identity outside a hole $H$ but non-trivial inside, the dragged model $\mathcal{M}^\phi = (M, \phi^*g)$ is mathematically distinct from $\mathcal{M}$ but empirically indistinguishable. You are not looking for a reading list; you are looking for a diagnostic instrument to locate your own ontological commitments based on how you answer concrete questions about these models.

  The tree
  1.  **The Hole Pair:** Consider the two models $\mathcal{M}$ and $\mathcal{M}^\phi$ from the Hole Argument. Do these two mathematical structures represent two *physically distinct* possible histories of the universe?
      *   **Yes:** Go to Node 2.
      *   **No:** Go to Node 3.

  2.  **The Indeterminism:** If they are distinct, then fixing the state of the universe everywhere outside $H$ fails to fix the state inside $H$. Is this indeterminism a real physical feature of the world?
      *   **Yes:** Leaf A (Manifold Substantivalism).
      *   **No:** Go to Node 8 (Incomplete Theory).

  3.  **The Vacuum:** Consider a model $\mathcal{M}_{vac}$ containing a gravitational wave but no matter fields ($T_{ab}=0$ everywhere). Does this model describe a world containing spacetime?
      *   **No:** Go to Node 9.
      *   **Yes:** Go to Node 4.

  4.  **The Point Swap:** In $\mathcal{M}_{vac}$, pick two points $p, q \in M$. Apply a diffeomorphism that swaps the metric values at $p$ and $q$. In the new model, have the gravitational properties moved to new subjects, or did the subjects themselves change properties?
      *   **Subjects changed properties (Points are fixed bearers):** Go to Node 5.
      *   **Properties moved (Points are identified by properties):** Go to Node 7.

  5.  **The Empty Substrate:** Consider the manifold $M$ with no metric field $g$ defined on it. Is this a conceivable ontological substrate, even if physically unrealized?
      *   **Yes:** Leaf B (Sophisticated Substantivalism).
      *   **No:** Go to Node 6.

  6.  **The Metric Substance:** If the manifold cannot exist without the metric, is the metric field $g$ itself the substance, with $M$ serving merely as an index set for the field values?
      *   **Yes:** Leaf C (Metric Substantivalism).
      *   **No:** Leaf D (Supersubstantivalism).

  7.  **The Structure Class:** Consider the equivalence class $[\mathcal{M}]$ of all models diffeomorphic to $\mathcal{M}$. Is the physical world identical to this entire class, rather than any single member of it?
      *   **Yes:** Leaf E (Ontic Structural Realism).
      *   **No:** Leaf F (Semantic Structuralism).

  8.  **The Hidden Variables:** (From Node 2, No). If the models are distinct but the indeterminism is not real, must there be additional physical fields not included in $g$ to fix the state?
      *   **Yes:** Leaf G (Incomplete Theory Realism).
      *   **No:** (Incoherent commitment).

  9.  **The Matter Relations:** (From Node 3, No). If spacetime does not exist without matter, is spacetime nothing over and above the spatial and temporal relations between material bodies?
      *   **Yes:** Leaf H (Plain Relationism).
      *   **No:** Go to Node 10.

  10. **The Eliminativist:** (From Node 9, No). If spacetime is not a substance and not a network of relations, does the term "spacetime" refer to nothing at all?
      *   **Yes:** Leaf I (Eliminativism).
      *   **No:** (Return to Node 3).

  The leaves
  **Leaf A: Manifold Substantivalism (Haecceitist).** Spacetime points are real individuals with primitive identity. The Hole Argument shows GR is indeterministic, and you accept this cost. *Awkward commitment:* You must believe the universe could spontaneously change its curvature distribution inside a region without any cause or prior difference.

  **Leaf B: Sophisticated Substantivalism (Anti-haecceitist).** Spacetime points exist as substances, but they lack primitive this-ness (haecceity). Diffeomorphic models represent the same world because permuting points doesn't create a new reality. *Awkward commitment:* You posit the existence of manifold points that are ontologically real yet fundamentally indiscernible and unobservable even in principle.

  **Leaf C: Metric Substantivalism.** The metric field is the physical substance; the manifold is merely a mathematical artifact used to define the field. *Awkward commitment:* You must explain what supports the metric field if not a substrate, often leading to a view where fields hang free of any bearer.

  **Leaf D: Supersubstantivalism.** Matter and spacetime are identical; material particles are just specific geometric features or regions of the spacetime manifold. *Awkward commitment:* You must reduce all quantum numbers and material properties to pure geometry, a program that has yet to succeed fully in physics.

  **Leaf E: Ontic Structural Realism.** The structure (the equivalence class of models) is the only reality; there are no "relata" (points or fields) underlying the structure. *Awkward commitment:* You must articulate how a structure can exist without anything being structured, often accused of incoherence.

  **Leaf F: Semantic Structuralism.** The equivalence class is merely how we represent the world, but the world itself is one specific model (we just can't say which). *Awkward commitment:* You posit a fact of the matter about which model is real that is permanently inaccessible to physics.

  **Leaf G: Incomplete Theory Realism.** The models are distinct, but GR is incomplete; hidden variables fix the indeterminism. *Awkward commitment:* You commit to new physics beyond GR specifically to save a substantivalist ontology.

  **Leaf H: Plain Relationism.** Spacetime is nothing but the network of relations between material objects. No matter, no space. *Awkward commitment:* You must treat vacuum solutions (like gravitational waves) as fictions or reduce them to relations between counterfactual matter.

  **Leaf I: Eliminativism.** Spacetime does not exist. Only matter/fields exist, and they do not inhabit a container. *Awkward commitment:* You must reconstruct all of GR's geometric language without referencing spacetime as an entity.

  Empty cells
  **Node 1 (Yes) + Node 2 (No).** This combination is logically unstable. If the models represent distinct physical possibilities (Node 1 Yes), then the laws fail to determine which one obtains given the past (Node 2 Yes). Claiming they are distinct but the indeterminism isn't real (Node 2 No) implies hidden variables, which forces you to Node 8. If you refuse Node 8, this cell is incoherent.

  **Node 3 (No) + Node 5 (Yes).** If you deny spacetime exists in a vacuum (Node 3 No), you cannot consistently claim the empty manifold is a conceivable ontological substrate (Node 5 Yes). This cell is unattractive because it posits a substance that cannot exist even in the absence of matter, yet denies spacetime exists without matter.

  **Node 4 (Subjects changed) + Node 7 (Yes).** If points are fixed bearers of properties (Node 4 Subjects), then the equivalence class cannot be the *only* reality (Node 7), because the class ignores which point bears which property. This combination is rarely occupied because it mixes haecceitism with structuralism.

  Pairs it can't separate
  **Sophisticated Substantivalism (Leaf B) vs. Ontic Structural Realism (Leaf E).** Both answer "No" to the Hole Distinctness and "Yes" to Vacuum Existence. The tree separates them at Node 4 (Point Swap) and Node 7 (Structure Class), but in practice, these positions often converge on the same physical predictions. The extra question needed to break the tie is: "If all fields were removed, would the points of $M$ remain?" Leaf B says Yes (in principle); Leaf E says the question is meaningless.

  **Metric Substantivalism (Leaf C) vs. Supersubstantivalism (Leaf D).** Both deny the independence of the manifold (Node 5 No). The distinction rests on whether matter is reduced to geometry. The tree pushes this to Node 6, but without a specific question about matter reduction (e.g., "Is an electron a region of curved spacetime?"), these two can blur. A dedicated node on matter-geometry identity would separate them more cleanly.

  Dry run
  Let's run the tree on a typical working relativist who is philosophically cautious but realist about the field equations.
  1.  **Hole Pair:** They view diffeomorphisms as gauge freedom. $\mathcal{M}$ and $\mathcal{M}^\phi$ describe the same physical situation. **Answer: No.** (Go to 3).
  2.  **Vacuum:** They accept gravitational waves as real physical entities even without matter sources. **Answer: Yes.** (Go to 4).
  3.  **Point Swap:** They view manifold points as coordinate labels. Swapping metric values via diffeo doesn't move properties to new subjects; it just relabels. However, if pressed on whether points are *ontological* subjects, they often hesitate. A standard realist says points exist but are indiscernible. Let's assume they treat points as fixed bearers but gauge-equivalent. **Answer: Subjects changed properties.** (Go to 5).
  4.  **Empty Substrate:** Can the manifold exist without the metric? Mathematically yes, ontologically? A working relativist usually says the metric defines the geometry, so a manifold without a metric is just a topological soup, not spacetime. **Answer: No.** (Go to 6).
  5.  **Metric Substance:** Is the metric the substance? Yes, the geometry is the physical field. **Answer: Yes.**
  **Result:** Leaf C (Metric Substantivalism).

  *Alternative Dry Run (The Structuralist Physicist):*
  1.  **Hole Pair:** **No.**
  2.  **Vacuum:** **Yes.**
  3.  **Point Swap:** They argue points have no identity independent of the metric. **Answer: Properties moved.** (Go to 7).
  4.  **Structure Class:** Physical observables are diffeo-invariant quantities. The individual model is not physical. **Answer: Yes.**
  **Result:** Leaf E (Ontic Structural Realism).

  Most physicists land in Leaf B or E depending on whether they grant the manifold points any ontological weight beyond being a domain for the fields. The tree successfully isolates this tension without asking "Are you a substantivalist?" directly.
