  the scale argument — the one that says even if the chance any given insect is sentient is tiny, there are so many of them that the expected number of sentient beings still comes out enormous — doesnt work, and the reason isn't that the probability is too low. It's that our uncertainty is one big uncertainty instead of lots of little ones. Each insect isn't flipping its own coin; we're unsure about a single hypothesis (are insects the sort of creature that has experiences at all?), and if it's true it's true for basically all of them. So the world is more like "trillions of sentient insects" or "basically none," with not much in between — and averaging over those two worlds is doing something pretty different from what the scale argument claims it's doing.

  Make the strongest version of that argument you can, with the actual steps spelled out. I want it to face the obvious objection head-on: expected value is linear, so it shouldn't matter whether the chances are correlated or independent, N times p is N times p either way. If that objection really does kill my idea, say so straight out — don't rescue it just to be nice. And then tell me how confident you are the argument survives at all, and which single step you'd attack first if you were arguing the other side.
