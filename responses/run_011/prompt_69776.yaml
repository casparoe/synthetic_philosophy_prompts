  # Part 1: The Logical Space of Utility Claims

  Before attaching labels, we must identify the fault lines. When a reader says "utility," they are typically making a claim that sits at the intersection of three distinct questions. The confusion in your room arises because participants answer these questions differently without realizing they are answering different questions.

  **The Three Dividing Questions**

  1.  **Ontology:** Is a preference a mental state (a feeling of wanting) or is it identical to the choice itself?
      *   *If Choice:* Utility claims are summaries of behavior.
      *   *If Mental:* Utility claims are reports on an inner life that choices only reveal imperfectly.
  2.  **Welfare:** Does satisfying a preference make a life go better?
      *   *Yes:* Utility tracks the agent's good.
      *   *No:* Utility tracks what the agent wants, which may differ from what is good for them (due to ignorance, adaptation, or principle).
  3.  **Structure:** Are utilities merely rankings within one person, or can they be measured and compared across people and time?
      *   *Rankings:* We can only say A is preferred to B.
      *   *Measurements:* We can say A is preferred to B *twice as much*, or that Person 1's gain outweighs Person 2's loss.

  **The Tree of Views**

  We can build the space of possible views by branching from these questions:

  *   **Branch 1 (Ontology):**
      *   *Path A (Choice is All):* Leads to views where utility is a behavioral summary. There is no "inner state" to be wrong about.
      *   *Path B (Inner State):* Leads to views where choice is evidence. This opens the possibility that evidence can be misleading.
  *   **Branch 2 (Welfare - only relevant if Path B):**
      *   *Path B1 (Preference Satisfaction):* Getting what you want is what makes life go better.
      *   *Path B2 (Experiential):* How life feels is what makes life go better (preferences matter only insofar as they affect feelings).
      *   *Path B3 (Objective/Normative):* Something else makes life go better; preferences are just one input.
  *   **Branch 3 (Conditions - modifiers on Path B):**
      *   *Modification i:* Preferences formed under deprivation may not track welfare (Adaptive).
      *   *Modification ii:* Choices driven by commitment may not track preference (Principled).
  *   **Branch 4 (Structure):**
      *   *Path C (Cardinal/Interpersonal):* Utilities can be summed across people.
      *   *Path D (Ordinal/Individual):* Utilities cannot be summed.

  **Locating the Views**

  The leaves below occupy specific coordinates in this tree. Note that "Behaviorist" and "Deflationary" occupy the same coordinate (Path A) and are merged here.

  1.  **The Behaviorist Summary:** (Path A). Utility is a description of choice patterns.
  2.  **The Mentalist Evaluation:** (Path B, B1). Utility is a mental state of preferring; choice reveals it.
  3.  **The Principled Agent:** (Path B, Modification ii). Choice sometimes reflects commitment, not preference.
  4.  **The Adaptive Skeptic:** (Path B, B1, Modification i). Preference satisfaction is good, but adapted preferences don't count.
  5.  **The Experientialist:** (Path B, B2). Feelings track good, not preferences.
  6.  **The Normativist:** (Path B, B3). Utility claims are about what is better, not what is wanted.
  7.  **The Cardinalist:** (Path C). Utilities are measurable sums across persons.

  ***

  # Part 2: The Diagnostic Instrument

  **Instructions:** Read each scenario and select the option that best matches your immediate reaction. Do not worry about consistency; answer based on your intuition for each case.

  **1. The Machinist**
  A machinist has been passed over for the supervisor post three times and has stopped applying. She says she never wanted it. Her choices and her words agree. Does this pattern tell you what would make her life go better?
  (a) Yes — choice is the only evidence not already contaminated by theory.
  (b) It tells you what she wants, but her wants were shaped by the options she were refused, so it tells you nothing about her good.
  (c) It tells you nothing yet — she may be choosing against her own settled evaluation.

  **2. The Last Slice**
  One slice of cake is left. Guest A passes on it, though he would have enjoyed it. Guest B also passes, but he decided in advance that he would never take the last slice, because he wants to be the sort of person who doesn't. What do the two refusals show?
  (a) The same thing: in each case a ranking over what was available, expressed in action.
  (b) Different things — B's refusal is governed by a view about which person to be, so his action is poor evidence about how he ranks the slices.
  (c) Neither shows much; the interesting ranking is over states of the world, not over acts.

  **3. The Pill**
  A friend is wretched in work she loves and believes in. A pill would remove the wretchedness and leave her projects, her convictions, and her behavior untouched. Would she be better off on the pill?
  (a) Yes — misery is bad for her, and the work would still be there.
  (b) No — if what she wants and what she does are unchanged, nothing that matters to her has changed.
  (c) Only she can settle it: ask which of the two lives she would take if both were offered.

  **4. The Café**
  A café sells espresso and tea. A regular takes espresso every morning for a year. The café adds an elaborate pour-over to the board, and the regular switches to tea and stays with tea. How should this be described?
  (a) The new item changed what ordering the espresso meant, so what he ranks is not the drink alone but the whole situation of choosing it.
  (b) He simply has inconsistent preferences, and the honest move is to record the inconsistency.
  (c) Nothing here is a preference change; the word was only ever a way of compressing his choices, and the compression changed.

  **5. The Patient**
  A patient elects an operation she has been told she will afterwards wish she had declined. Whose view decides?
  (a) Hers now — the agent at the time of choice is the one whose evaluation counts.
  (b) Hers later — the person who will live with the outcome is the one it happens to.
  (c) Neither — what should decide is which course leaves her better off overall, summed across both of her.

  **6. The Disaster (Probes Interpersonal Comparison)**
  A flood destroys homes in two villages. You have enough aid for one. In Village X, the aid will restore happiness for 100 people for a year. In Village Y, it will restore happiness for 10 people for a year. Who gets the aid?
  (a) Village X — the total amount of happiness restored is what matters.
  (b) Flip a coin — each village counts as one unit, regardless of size.
  (c) Ask them — give it to whichever village says they want it more intensely.

  **7. The Pens (Probes Indifference)**
  You stand before two identical red pens. You reach out and take the left one. Why?
  (a) You preferred the left one slightly, even if you couldn't say why.
  (b) You liked them exactly the same; your hand just happened to go left.
  (c) It makes no sense to say you "liked" one; you just took one.

  **8. The Mountain (Probes Preference vs. Experience)**
  A climber wants to summit a peak. He succeeds but is exhausted and unhappy for weeks afterward. Was he better off for having climbed?
  (a) Yes — he got what he aimed for.
  (b) No — his days felt bad despite the success.
  (c) It depends on whether the climb helped him achieve other things later.

  **9. The Sleepwalker (Probes Mental State vs. Behavior)**
  A sleepwalker moves a chair to block a door. Did he want the door blocked?
  (a) Yes, he did it, so he wanted it.
  (b) No, he was asleep, so he couldn't want it.
  (c) "Wanting" is just a word for when movements match needs.

  ***

  **Scoring Key**

  Tally your answers according to the table below. The column with the highest score indicates your dominant view. If two columns tie for the highest score, you straddle those views.

  | Question | (a) | (b) | (c) |
  | :--- | :--- | :--- | :--- |
  | **1. Machinist** | Behaviorist | **Adaptive Skeptic** | Mentalist |
  | **2. Slice** | Behaviorist | **Principled Agent** | Mentalist |
  | **3. Pill** | **Experientialist** | **Mentalist** | Mentalist |
  | **4. Café** | **Mentalist** | Mentalist | Behaviorist |
  | **5. Patient** | **Mentalist** | Mentalist | **Normativist** |
  | **6. Disaster** | **Cardinalist** | Normativist | Mentalist |
  | **7. Pens** | Mentalist | **Mentalist** | Behaviorist |
  | **8. Mountain** | **Mentalist** | **Experientialist** | Mentalist |
  | **9. Sleepwalker**| Behaviorist | **Mentalist** | **Deflationary** |

  *Note: "Deflationary" and "Behaviorist" are merged for the purpose of the leaves below.*

  **The Leaves**

  1.  **The Behaviorist Summary:** Utility talk is just a shorthand for describing choice patterns.
      *   *Awkward Commitment:* You must deny that a person can ever be mistaken about what they prefer.
  2.  **The Mentalist Evaluation:** Preference is a genuine inner state that choice reveals.
      *   *Awkward Commitment:* You must explain how we know about this state when choices are ambiguous.
  3.  **The Principled Agent:** Choice sometimes fails to track preference because agents act on commitments.
      *   *Awkward Commitment:* You must accept that standard choice theory cannot model all rational action.
  4.  **The Adaptive Skeptic:** Preferences formed under deprivation are not evidence of well-being.
      *   *Awkward Commitment:* You must claim to know what is good for people better than they do.
  5.  **The Experientialist:** How life feels matters more than what people choose.
      *   *Awkward Commitment:* You must count a happy delusion as better than a miserable truth.
  6.  **The Normativist:** Utility statements are claims about what is better, not psychological reports.
      *   *Awkward Commitment:* You must separate "utility" from "what the agent wants" entirely.
  7.  **The Cardinalist:** Utilities can be measured and summed across different people.
      *   *Awkward Commitment:* You must assume you can compare the intensity of your pain with mine.

  ***

  # Part 3: Limits of the Instrument

  **Indistinguishable Pairs**
  *   **The Behaviorist Summary vs. The Deflationary View:** The quiz merges these because, in practice, both treat utility vocabulary as replaceable by talk of behavior and circumstances. To separate them, one would need a question probing whether the *term* "preference" has any semantic content beyond prediction, which risks introducing linguistic jargon.
  *   **The Normativist vs. The Objective List View:** Both claim utility tracks good independent of preference. To separate them, one would need to ask whether "good" is singular (utility) or plural (health, knowledge, friendship), which exceeds the scope of a utility diagnostic.

  **Empty Cells in Logical Space**
  *   **The Cardinal Behaviorist:** (Behaviorist Ontology + Cardinal Structure). This cell is empty. If choices are all there is, there is no unit of measurement to sum across people. One can count choices, but not "utility." This view is incoherent.
  *   **The Experiential Behaviorist:** (Experience = Good + Choice = All). This cell is empty. If choice is all there is, you cannot appeal to "feelings" (which are mental states) to define the good. This view is incoherent.
  *   **The Adaptive Cardinalist:** (Adaptive Skeptic + Cardinalist). This cell is unoccupied not because it is incoherent, but because it is unstable. If you doubt individual preferences track good, you usually doubt interpersonal sums even more. It is available but unattractive.
  *   **The Sovereign Future Self:** (Q5 Option B as a dominant leaf). This cell is empty in the leaves above. While some hold this view, it is usually a sub-component of a Normative or Experiential view rather than a standalone theory of utility. It is available but rarely articulated as a full system.

  ***

  **Diagnostic Run: Your Answers**

  You provided answers for the first five questions.
  *   Q1 (b): +1 Adaptive Skeptic
  *   Q2 (b): +1 Principled Agent
  *   Q3 (b): +1 Mentalist
  *   Q4 (a): +1 Mentalist
  *   Q5 (a): +1 Mentalist

  **Current Tally:**
  *   Mentalist: 3
  *   Adaptive Skeptic: 1
  *   Principled Agent: 1
  *   (Unanswered Q6-Q9 could shift this, but Q1 and Q2 are high-weight discriminators for the "Econ-Phil" friction).

  **Analysis:**
  Your answers to Q3, Q4, and Q5 strongly signal a **Mentalist** ontology (preferences are real inner states, context matters, current sovereignty holds). However, your answers to Q1 and Q2 are the specific critical moves that define the friction in your reading group. Q1(b) rejects the inference from choice to good under adaptation. Q2(b) rejects the inference from choice to preference under commitment.

  While "Mentalist" is your broad ontology, the specific *critical* commitments that distinguish your view from a standard neoclassical mentalist are the Adaptive and Principled critiques. Since you hold both critical commitments equally (one vote each in the fixed set) and the instrument cannot break this tie without the new questions (Q6-Q9), your pattern straddles the two critical leaves that challenge the standard link between choice, preference, and welfare.

  \answer{The Adaptive Skeptic/The Principled Agent}
