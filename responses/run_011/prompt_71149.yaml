answer: |-
  This is a classic case of model imperialism: taking a formalism that works in one domain (population biology) and assuming the ontology of the target domain (human history) must conform to it because the differential equations look similar. Your intuition is correct—the analogy is doing too much heavy lifting, and the switch between the "Predator/Prey" model and the "Deadwood/Fuel" model is a rhetorical sleight of hand.

  Here is the audit you asked for, structured to arm you for the next dinner.

  ### 1. The Correspondence Table
  Your brother's model relies on Structural-Demographic Theory (SDT), which is indeed a modified Lotka-Volterra system. Here is how the variables map in his head versus how they map in your manorial accounts.

  | Ecological Variable | Cliodynamic Variable | Historical Proxy (Brother's View) | Historical Reality (Your View) |
  | :--- | :--- | :--- | :--- |
  | **Predator** | Elites (State + Rentiers) | Count of titles, degrees, wealthy households. | Fluid category. A knight with no land? A merchant with land but no title? |
  | **Prey** | Commoners (Producers) | Total population estimates. | Heterogeneous. Serfs, freemen, tenants, laborers have different extraction rates. |
  | **Carrying Capacity ($K$)** | Resource Base | Arable land $\times$ Yield. | Endogenous. Trade, tech, and crop rotation change $K$ mid-cycle. |
  | **Functional Response** | Extraction Rate | Tax/Rent as % of surplus. | Politically negotiated. Changes during crises (e.g., post-Plague wage statutes). |
  | **Phase Lag** | Immiseration Delay | Time between elite growth and wage drop. | Variable. Institutional lag varies by kingdom/manor. |
  | **Cycle Period** | Secular Cycle | ~2–3 centuries. | An average of very uneven intervals. |
  | **Observational Data** | Instability Events | Revolts, civil wars, regime collapses. | Codified in chronicles, not systematic counts. Survivorship bias is massive. |

  ### 2. Disanalogies: Surface vs. Fatal
  You need to separate the complaints an ecologist would accept from the ones that break the forecasting claim.

  **Surface Differences (Ecologists would shrug):**
  *   **Recruitment/Stage-Structure:** You already noted this. Ecologists model age-structured populations or metamorphosis (larva to adult) all the time. If "elite" is just a life-stage commoners enter, the math handles it.
  *   **Time Scale:** Whether a cycle takes 10 years (hares) or 200 years (states) is just a scalar change in the time variable $t$.
  *   **Aggregation:** Ecologists count biomass, not individual quirks. Aggregating peasants into "labor units" is no worse than aggregating plankton into "primary productivity."

  **Fatal Disanalogies (Undercut Forecasting):**
  *   **Reflexivity (The Lucas Critique):** Lynx do not read papers about lynx population density and decide to eat fewer hares to prevent a crash. Human elites *do* read history (or feel pressure) and adjust extraction rates *anticipatorily*. This breaks the deterministic link between state variables and outcomes.
  *   **Institutional Mediation:** In ecology, predation is metabolic necessity. In history, extraction is political. A famine doesn't *force* a tax hike; a King chooses it. The "functional response" is a policy variable, not a biological constant. Your manorial rolls show rents being commuted to cash, waived, or enforced differently based on local power, not just population density.
  *   **Measurement Error on "Elite":** In ecology, a lynx is genetically distinct from a hare. In history, the boundary is porous and definitional. If you miscount the "predator" population by 10% because you aren't sure if gentry count as elites, your phase prediction drifts. Over 200 years, that drift swallows the signal.
  *   **The "Spark" vs. Cycle Contradiction:** This is the big one. The Predator/Prey model predicts *timing* (the trough of the wave). The Deadwood model predicts *probability* (the fuel load). You cannot use both to claim forecasting precision.

  ### 3. What the Ecology Framing Quietly Imports
  By using an ecosystem model, your brother imports three assumptions that history does not support:

  1.  **Homeostasis:** Ecosystems tend to return to a dynamic equilibrium after a shock. History does not guarantee this. The 14th century didn't "bounce back" to the 13th century state; it mutated into something new (wage labor, enclosure). The model assumes a return to the mean that isn't there.
  2.  **Exogenous Shocks:** In LV models, disease or climate is usually an external parameter. In your work, the Black Death isn't just an external shock; its *impact* is determined by the social structure (serfdom vs. free tenancy). The model treats the virus as independent of the society it hits.
  3.  **The Oscillation Artifact:** You asked if the oscillation is a discovery or a consequence of the equation. **It is the latter.** If you write down a set of coupled differential equations with density-dependent feedback and a time lag (which SDT does), *you mathematically guarantee oscillations.* You will get a 2–3 century cycle because that is the solution space of the equations chosen, not necessarily because the data demands it. It is a self-fulfilling mathematical prophecy.

  ### 4. Compatibility of the Two Analogies
  Your brother is using a **Motte-and-Bailey** strategy with these two images.

  *   **The Predator/Prey (Bailey):** This is the strong claim. It implies we can predict *when* the crisis hits (the phase of the cycle). It promises the "science" of forecasting.
  *   **The Deadwood/Fuel (Motte):** This is the retreat. When you ask, "Why didn't the revolution happen in 2020 exactly?" he switches to this. It admits we can't predict the spark (timing), only the risk (magnitude).

  **They are incompatible for forecasting.** If you can only measure fuel load, you have abandoned the Predator/Prey claim of predicting population troughs. If you claim you can predict the trough, you must deny the "random spark" logic of the deadwood. He uses the Deadwood analogy to immunize the theory against falsification (we were right about the fuel, the spark was just late) while keeping the Predator/Prey analogy to claim scientific prestige (we are like ecologists).

  ### 5. A Better Source Domain: Structural Engineering
  If the ecosystem model fails because it implies biological determinism and homeostasis, a better source domain is **Material Stress/Strain (Engineering)**.

  This captures the "Deadwood" intuition (accumulation of stress) without the false precision of the "Predator/Prey" cycle. Here is the audit of the Engineering model:

  | Engineering Variable | Cliodynamic Variable | Audit |
  | :--- | :--- | :--- |
  | **Load (Stress)** | Population + Elite Demand | **Valid.** You can measure this (wages, prices, tax burden). |
  | **Material Strength** | Institutional Cohesion/Legitimacy | **Problematic.** Hard to quantify, but conceptually superior to "carrying capacity." |
  | **Fatigue** | Accumulated Grievances | **Valid.** Matches the "fuel load" idea without implying biological growth. |
  | **Fracture** | Revolution/Collapse | **Valid.** |
  | **Safety Factor** | State Capacity/Repression | **Valid.** The buffer before failure. |

  **Why this is better:**
  1.  **No False Periodicity:** Bridges don't collapse every 50 years because of a "bridge cycle." They collapse when Load > Strength. This kills the "2-3 century cycle" claim and replaces it with "risk accumulation," which fits the Deadwood analogy honestly.
  2.  **Agency as Maintenance:** In engineering, you can repair fatigue. Elites can reform institutions (maintenance) to increase Material Strength. This allows for human agency without breaking the model.
  3.  **Contingency:** Engineering acknowledges that two bridges with the same load can have different outcomes due to microscopic flaws (contingent events, assassinations, weather on the day). This validates your "spark" objection without abandoning the structural analysis.
  4.  **Data Fit:** Your manorial accounts measure *stress* (wages, grain yields, rent arrears). They do not measure *biomass*. An engineering model treats your data as stress gauges, which is exactly what they are.

  **The Verdict for Dinner:**
  Tell him the Ecology model forces him to choose: is he predicting the *timing* of the crash (Predator/Prey) or just the *risk* (Deadwood)? He can't have both. If he admits it's just risk, he's no longer forecasting like an ecologist; he's assessing structural integrity like an engineer. And if he's an engineer, he has to admit that "maintenance" (policy reform) can prevent the collapse even if the load is high, which undermines the deterministic doom-mongering.

  The oscillation he sees isn't a law of history; it's a rhythm he baked into the math. Your manorial rolls show the messy reality of humans negotiating extraction, not wolves eating hares. You aren't measuring biomass; you're measuring stress fractures.
