answer: |-
  This is a sharp observation. You have identified a mechanism that sociologists often stumble over because it hides inside the very language used to describe liberation. You are describing a **status-neutral norm with status-dependent payoffs**, masked by a **universalist ontology**.

  There is no single standard term for this exact configuration, but there are three established concepts that sit adjacent to it. Understanding why they *almost* fit will help you sharpen the distinction for your writing.

  ### 1. The "Ideal Worker" Norm (Joan Acker)
  **The Concept:** Organizations operate on rules that appear neutral (e.g., "employees must be available late") but are built around the life pattern of a specific demographic (historically, men with wives at home). Those who fit the pattern succeed; those who don't (women, caregivers) are penalized, but the rule itself is never acknowledged as biased.
  **Why it's close:** It captures the "universal rule, hidden precondition" structure perfectly.
  **Why it's not it:** The Ideal Worker norm is usually about *capacity* (time, energy). Your scenario is about *semiotics* (meaning, signaling). The adjunct isn't failing to ignore the joke because she lacks time; she fails because the *act of ignoring* signals different things depending on who does it. The Ideal Worker norm explains why she can't *do* the work; your phenomenon explains why doing the work *counts against her*.

  ### 2. Symbolic Violence (Pierre Bourdieu)
  **The Concept:** A dominant culture imposes a system of meaning (language, norms, values) that makes the social hierarchy feel natural. The dominated accept the rules of the game, and in doing so, participate in their own domination.
  **Why it's close:** It explains why the adjunct follows the rule even when it hurts her. She has internalized the "Dignity Culture" logic.
  **Why it's not it:** Symbolic violence usually requires the dominated to believe they are *inferior*. In your scene, the adjunct knows she is competent; the problem isn't her self-worth, it's the audience's reception. Symbolic violence is about internal submission; your phenomenon is about external signaling mechanics that the culture refuses to see.

  ### 3. Hermeneutical Injustice (Miranda Fricker)
  **The Concept:** A gap in our shared tools for understanding the world. A group suffers a harm, but because the dominant culture lacks the vocabulary to name it, the harm becomes invisible or is misinterpreted (e.g., "sexual harassment" before the term existed).
  **Why it's close:** This is the epistemic engine of your problem. The culture *cannot* see the injury because their vocabulary ("insults don't hurt") renders the injury unintelligible.
  **Why it's not it:** Hermeneutical injustice focuses on the *victim's inability to understand* their own experience. In your book, your character *does* understand it (she has read the sociology). The injustice isn't that she is confused; it's that the *system* is structurally blind to the cost differential.

  ***

  ### The Coinage: "Asymmetric Forbearance"

  Since existing terms miss the specific mechanic of the *signal cost*, here is the term for your phenomenon.

  **Term:** **Asymmetric Forbearance**
  **Definition:** A social dynamic wherein a universalist norm of restraint (e.g., "ignore slights," "turn the other cheek") imposes unequal status costs on adherents based on their pre-existing social capital. For high-status actors, forbearance signals confidence and reinforces standing. For low-status actors, the same forbearance signals weakness or guilt and erodes standing. The asymmetry remains invisible because the norm is justified by a universalist claim (e.g., "intrinsic dignity") that denies the relevance of social position.

  #### Boundary Cases (What counts, what doesn't)

  **1. The Edge of Hypocrisy (Your constraint A)**
  *   **Counts as Asymmetric Forbearance:** The senior professor genuinely believes the advice is good for everyone. She is not lying; she is projecting her own cost structure onto the adjunct. She assumes her own experience of ignoring the joke (zero cost) is the universal human experience.
  *   **Doesn't Count:** If the senior professor knows the adjunct will lose standing but tells her to ignore it anyway to protect the department's reputation. That is **Instrumental Silence**, not Asymmetric Forbearance.

  **2. The Edge of Preconditions (Your constraint B)**
  *   **Counts as Asymmetric Forbearance:** The adjunct *can* physically and psychologically ignore the joke. She has the "dignity" to do so. The penalty is not that she fails to follow the rule, but that *following the rule successfully* still lowers her status.
  *   **Doesn't Count:** If the adjunct is too traumatized or poor to ignore the joke and lashes out. That is a **Capacity Failure**. Asymmetric Forbearance requires the rule to be followed perfectly, with the penalty arising from the *interpretation* of that compliance.

  **3. The Edge of Frequency (Your constraint C)**
  *   **Counts as Asymmetric Forbearance:** The Big Name and the Adjunct receive the *exact same joke* in the *exact same room*. The variable is not the input (the insult), but the transfer function (the social reaction to the silence).
  *   **Doesn't Count:** If the adjunct is insulted ten times a day while the Big Name is insulted once a year. That is **Harassment Disparity**. Asymmetric Forbearance is about the *price of the response*, not the volume of the attack.

  ### How to Use This in the Scenes

  Knowing you are writing **Asymmetric Forbearance** changes the focus of the prose.

  *   **In Scene One (The Big Name):** The narrative should emphasize the *ease* of her silence. It is a non-event. The room laughs *with* the joke, then moves on. Her silence is read as "She is above this." The norm works as advertised.
  *   **In Scene Two (The Adjunct):** The narrative must not focus on her pain (that would make it about trauma). It must focus on the *shift in the room's temperature*. When she doesn't answer, the silence stretches too long. The laughter is slightly nervous. People exchange glances. The silence is read as "She knows it's true."
  *   **The Crucial Beat:** When the senior colleague gives the warm advice ("It says nothing about you"), the tragedy is not that they are mean. It is that they are *sincere*. They are handing her a tool that works for them and cannot understand why it slips in her hands. The horror is in the warmth of the delivery.

  This distinction allows you to write the scene not as a conflict between "Mean Culture vs. Nice Character," but as a collision between "Universalist Theory vs. Particularist Reality." The character isn't just fighting an insult; she is fighting a map that claims the terrain is flat when she knows she is climbing a hill.
