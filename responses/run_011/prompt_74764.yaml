      *   **Infrastructure Counterexample:** DNS/BGP *is* a counterexample to (6) and (7). It shows distributed consensus without central authority. *However*, R will say "But DNS can't launch a nanovirus." The user needs to elevate the analogy: It's about *governance protocols*, not just the specific tech.
      *   **What does a non-singleton look like?** A "Multipolar Stable Equilibrium." Mutually Assured Destruction (MAD) but with better detection. Decoupled colonies (if Mars dies, Earth lives). AI monitoring AI (Idiosyncratic jobs).
