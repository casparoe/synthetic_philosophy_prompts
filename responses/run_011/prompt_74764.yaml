  2.  **Deconstruct R's Argument (The Singleton Chain):**
      *   (1) Survival requires 100% prevention of existential risk. (High bar).
      *   (2) Prevention requires pre-emption (stopping before it happens).
      *   (3) Pre-emption requires authority + enforcement.
      *   (4) Tech advances $\rightarrow$ range of world-ending acts grows $\rightarrow$ eventually covers "pretty much anything."
