answer: |-
  To the Remaining Panel Members and the Minister:

  We, the undersigned members of the Advisory Panel on Climate Intervention, submit this joint statement following fourteen months of deadlock. We cannot agree on a recommendation. We can, however, agree on the structure of our disagreement. This document maps the contour of the impasse so that the Panel and the Ministry may understand precisely what is being decided should a vote be called.

  **1. Agreed Claims**

  1.  **[Fact]** Decarbonization alone will not hold warming below the threshold at which two regional monsoon systems are projected to fail. (Jointly Signed)
  2.  **[Fact]** A stratospheric aerosol injection (SAI) program of sufficient scale to hold that line would, after roughly a decade of operation, create a state where terminating it returns the masked warming within a handful of years rather than over the century it took to accumulate. (Jointly Signed)
  3.  **[Fact]** A limited instrumented test would mask nothing but would, in the Precautionary Advocate's assessment, create institutional momentum making later full authorization close to automatic. (Jointly Signed under stipulation: The Symmetry Advocate signs this only as a report of the Precautionary Advocate's assessment, not as an endorsement of the momentum's inevitability.)
  4.  **[Fact]** The populations most exposed to monsoon failure have asked through their representatives that the program not proceed, while the populations most exposed to test-related deposition have asked that it not be tested. (Jointly Signed)
  5.  **[Normative]** Harm to vulnerable populations is the primary metric by which this decision must be judged. (Jointly Signed under stipulation: The Precautionary Advocate defines harm as the realization of irreversible pathways; the Symmetry Advocate defines harm as net expected loss across all scenarios.)
  6.  **[Question Formulation]** The central question is not "Is SAI safe?" but "Which distribution of risk is permissible when all options entail credible pathways to catastrophe?" (Jointly Signed)

  **Flagged Agreement:** We both sign the claim: "The status quo is unacceptable." The Precautionary Advocate signs because the status quo trajectory leads to monsoon failure; the Symmetry Advocate signs because the status quo trajectory leads to monsoon failure. However, the Precautionary Advocate regards intervention as potentially *more* unacceptable due to irreversibility, while the Symmetry Advocate regards intervention as the *only* acceptable correction to the status quo. We sign this wording only to acknowledge that neither of us defends current emissions trajectories.

  **2. A Reversibility Ledger**

  The following ledger estimates the horizon within which a course could be abandoned without leaving the world materially worse than it would have been under the leading alternative.

  | Course of Action | Physical Reversibility | Institutional Reversibility | Epistemic Reversibility |
  | :--- | :--- | :--- | :--- |
  | **Full Authorization** | **Disputed.** PA: Irreversible immediately due to termination shock risk. SA: Reversible within decade if decarbonization accelerates concurrently. | **Disputed.** PA: Infrastructure creates lock-in. SA: Infrastructure is dual-use and can be repurposed. | **Jointly Signed.** Knowledge gained is permanent; cannot be unlearned. |
  | **Limited Instrumented Test** | **Jointly Signed.** Physically reversible; no masking occurs. | **Disputed.** PA: Irreversible; creates momentum making authorization automatic. SA: Reversible; test results could justify cancellation. | **Jointly Signed.** Knowledge gained is permanent. |
  | **Indefinite Deferral** | **Disputed.** PA: Reversible; keeps options open. SA: Irreversible; warming locks in monsoon failure permanently. | **Jointly Signed.** Reversible; policy can change instantly. | **Jointly Signed.** Reversible; models can be updated. |
  | **Accelerated Decarbonization** | **Disputed.** PA: Reversible; no new physical risks added. SA: Irreversible; fails to prevent monsoon failure within relevant timeframe. | **Jointly Signed.** Reversible; policy can shift. | **Jointly Signed.** Reversible; learning continues. |

  **Dispute Explanations:**
  *   **Full Auth (Physical):** The Precautionary Advocate holds that once the aerosol layer exists, the *risk* of termination shock makes abandonment physically impossible without catastrophe. The Symmetry Advocate argues that abandonment is physically possible if managed, and the comparison is against the catastrophe of non-intervention.
  *   **Test (Institutional):** The Precautionary Advocate views the test as a slippery slope where institutional investment mandates continuation. The Symmetry Advocate views the test as a data-gathering exercise that could legitimately kill the program if risks are confirmed.
  *   **Deferral/Decarb (Physical):** The Symmetry Advocate argues that delaying intervention locks in physical climate damage (monsoon failure) that is itself irreversible. The Precautionary Advocate argues that delaying intervention avoids locking in the new risk of termination shock.

  **3. A Table of Disagreements**

  | Disagreement | Precautionary Advocate Formulation | Symmetry Advocate Formulation | Implication Denied | Crux | Shared Evidence/Observation | Predictions |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Baseline for Harm** | Harm is measured against a safe operating space where no new irreversible risks are introduced. | Harm is measured against the projected trajectory of the current system (warming). | PA denies SA implies we must accept any risk to avoid warming. SA denies PA implies we can ignore warming risks if intervention is risky. | **Is the baseline the pre-industrial climate or the committed warming trajectory?** | Monsoon failure projections vs. Termination shock models. | PA: Monsoon failure is tragic but natural risk. SA: Monsoon failure is anthropogenic harm equivalent to injection harm. |
  | **Timing of Irreversibility** | Irreversibility attaches to *beginning* the process (institutional momentum + termination shock risk). | Irreversibility attaches to *ending* the process (failure to act locks in warming). | PA denies SA implies we can reverse warming easily. SA denies PA implies we can reverse the decision to start easily. | **Does irreversibility attach to beginning a process, continuing it, or ending it?** | History of large-scale technological lock-in (nuclear, fossil fuels). | PA: Momentum makes stopping impossible. SA: Inertia makes starting impossible later. |
  | **Principle Function** | The Precautionary Principle functions as a **constraint on design**: programs must be exit-capable. | The Symmetry Principle functions as an **allocation of burden**: inaction must be justified as rigorously as action. | PA denies SA implies risk neutrality. SA denies PA implies risk aversion only for new technologies. | **Does the principle function as a decision rule, a burden of proof, or a constraint on design?** | Regulatory precedents for hazardous materials. | PA: Design cannot guarantee exit. SA: Burden remains on those opposing intervention. |

  **Verbal Dispute:** We disagree on the word "Caution." The Precautionary Advocate reads "Caution" as "avoidance of novel systemic risk." The Symmetry Advocate reads "Caution" as "minimization of total expected suffering."
  **Substantive Residue:** Even if we agree on a definition, we disagree on whether the risk of monsoon failure outweighs the risk of termination shock. Removing the verbal dispute leaves the conflict over which catastrophe is more permissible.

  **4. Falsification Commitments**

  **Precautionary Advocate:** To revise my general principle, I would need to observe a scientifically credible pathway showing that the termination shock risk can be undone within the lifetime of the decision, or that the institutional momentum from a test can be structurally prevented. Currently, I hold that low-probability, high-impact pathways veto action regardless of probability. Therefore, my position is not fully hostage to evidence regarding probability; it is hostage to evidence regarding *reversibility*. If reversibility is proven impossible, my veto stands.

  **Symmetry Advocate:** To revise my general principle, I would need to observe a case where privileging inaction resulted in less harm than acting, where the harm of inaction was known and preventable. I must see evidence that the status quo is morally preferable to intervention despite the known monsoon failure. My position is hostage to evidence regarding net harm. If decarbonization alone is proven capable of holding the monsoon line, I will withdraw support for SAI.

  **Shared Falsification:** There is no condition we both accept as capable of moving us simultaneously. The Precautionary Advocate requires proof of reversibility; the Symmetry Advocate requires proof of net benefit. Since the stipulated modeling asserts termination shock is physically irreversible (years vs. centuries), the Precautionary Advocate's condition cannot be met under current physics. The Symmetry Advocate accepts this physical constraint but weighs it against the irreversible harm of monsoon failure.

  We sign this statement not to resolve the deadlock, but to certify that the deadlock is structural, not procedural. The Panel must choose which irreversibility it fears more.

  **Precautionary Advocate**
  **Symmetry Advocate**
