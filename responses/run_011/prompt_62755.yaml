  Plan

  I treat Strong Pareto (D2) and Completeness (D1) as non-negotiable; a moral criterion that ignores guaranteed improvements or fails to guide choice is useless. I reject Amnesia (D4) because it contradicts Pareto in cases like $\delta$ versus $\alpha$. I defend Finite Anonymity over Unrestricted Anonymity to preserve the moral relevance of temporal sequence without succumbing to paradox. My live contenders are Discounted Summation and a hybrid Overtaking criterion. I will argue that Discounting imposes an arbitrary time-preference, whereas Overtaking respects the infinite horizon's structure. I will adopt a Lexical Overtaking criterion: rank by limit inferior of cumulative difference, breaking ties with Cesàro means, and finally Pareto. This secures non-triviality while sacrificing Amnesia.

  ***

  **The Aggregation of Infinite Welfare: A Defence of Lexical Overtaking**

  The ethical evaluation of infinite futures presents a distinctive mathematical and moral challenge. When welfare locations extend without end, the standard utilitarian machinery of summation breaks down, yielding divergent series that resist direct comparison. The cases $\alpha$ through $\eta$ illustrate the friction between our intuitive moral commitments and the formal properties required to rank such worlds. We desire a criterion that is complete, respects Pareto improvements, and treats generations fairly, yet theorems suggest these desiderata are jointly unsatisfiable. This essay argues that the most defensible approach is a lexical overtaking criterion that prioritises long-run cumulative advantage over average welfare, sacrificing Amnesia to preserve Strong Pareto and rejecting Unrestricted Anonymity to avoid absurd equivalences.

  To begin, we must assess the discounted summation approach, which ranks worlds by $\sum \delta^{n-1}w(n)$ for some fixed discount factor $\delta \in (0,1)$. This method guarantees convergence and completeness, satisfying (D1). It also satisfies Strong Pareto (D2); if $\delta$ dominates $\alpha$ at day 1, the discounted sum strictly increases. However, discounting fails dramatically on Anonymity (D3). Consider $\beta$ and $\gamma$. These worlds are permutations of one another; $\beta$ offers welfare 2 on odd days, while $\gamma$ offers it on even days. Under Unrestricted Anonymity, they must be equally good. Yet discounting ranks $\beta$ above $\gamma$ simply because $\beta$ pays its dividends earlier. The ratio of their values is $2/(1+\delta)$, which is strictly greater than 1. This implies that the moral value of a unit of welfare depends intrinsically on its temporal coordinate. Defending this requires asserting that future generations matter less simply because they are later, a claim that lacks moral foundation. Furthermore, the choice of $\delta$ is arbitrary. Why should the moral weight of a life depend on a specific geometric decay rate? While discounting resolves the comparison of $\delta$ versus $\eta$—favouring $\delta$ because its bonus arrives at $n=1$ rather than $n=10^9$—it does so at the cost of temporal discrimination that contradicts the impartiality required of moral agents. Thus, while discounted summation offers mathematical convenience, it fails the normative test of impartiality.

  We turn then to overtaking criteria, which compare worlds by the behaviour of the difference in their cumulative sums, $D(n) = S_X(n) - S_Y(n)$. The first question concerns $\beta$ versus $\alpha$. In world $\alpha$, cumulative welfare is exactly $n$. In $\beta$, the cumulative sum is $n+1$ for odd $n$ and $n$ for even $n$. The difference $D(n)$ oscillates between 1 and 0. If we adopt the "eventually strictly positive" formulation of overtaking, $\beta$ does not beat $\alpha$, because the difference is not strictly positive for all large $n$; it touches zero infinitely often. This renders them incomparable. However, if we adopt the "eventually non-negative" formulation, $\beta$ is at least as good as $\alpha$. I argue we must accept the weaker, non-negative formulation. To declare them incomparable is to ignore the fact that $\beta$ is never worse than $\alpha$ and sometimes better. Sensitivity to the strictness of the inequality should not override the clear dominance in the cumulative record. We can live with this sensitivity by supplementing overtaking with a tie-breaking rule, ensuring completeness without demanding strict positivity where none exists.

  This leads to the comparison of $\beta$ and $\gamma$. As noted, $\gamma$ is a relabelling of $\beta$ via an infinite permutation. If we insist on Unrestricted Anonymity, $\beta \sim \gamma$. However, overtaking ranks $\beta$ above $\gamma$. The cumulative difference $S_\beta(n) - S_\gamma(n)$ is 2 for odd $n$ and 0 for even $n$. Since this is always non-negative, $\beta \ge \gamma$. Does this violate fairness? It violates Unrestricted Anonymity, but I defend only Finite Anonymity. Finite Anonymity requires that swapping the welfare of any finite set of days leaves the ranking unchanged. It does not require invariance under infinite shifts. The distinction is crucial. An infinite shift changes the structural relationship between the generations and the start of time. If we accept that the sequence of generations is fixed, then $\beta$ provides a better start than $\gamma$. While the generations themselves might be interchangeable in isolation, their position in the causal chain is not. To insist on Unrestricted Anonymity is to assert that the order of history is morally irrelevant, which collapses the distinction between a world that improves over time and one that deteriorates, provided the long-run average is identical. Therefore, we reject Unrestricted Anonymity. We accept that $\beta > \gamma$ based on the overtaking criterion, acknowledging that early welfare has instrumental or structural priority without endorsing the arbitrary decay of discounting.

  The cases of $\epsilon$ and $\zeta$ test the robustness of these criteria against sparse deviations. $\epsilon$ matches $\alpha$ everywhere except at perfect squares, where it provides 2 instead of 1. $\zeta$ provides 0 at squares. The density of perfect squares approaches zero as $n$ grows. A Cesàro-mean treatment, which ranks by the limit of the average welfare $(1/n)S(n)$, declares $\epsilon$, $\zeta$, and $\alpha$ equally good, as the contribution of the squares vanishes in the limit. This satisfies Finite Anonymity and Amnesia, but it flouts Strong Pareto and Non-triviality (D5). If $\epsilon$ and $\zeta$ are equal to $\alpha$, and $\alpha$ is equal to $\beta$ (since both have average 1), the criterion risks collapsing into triviality where distinct worlds are deemed indifferent. Overtaking, however, distinguishes them. The cumulative difference $S_\epsilon(n) - S_\alpha(n)$ equals the number of squares up to $n$, which is approximately $\sqrt{n}$. This tends to infinity. Thus, overtaking correctly identifies $\epsilon$ as better than $\alpha$ and $\alpha$ as better than $\zeta$. Is this a good bargain? Yes. Satisfying (D3) and (D4) at the expense of (D2) and (D5) is a poor bargain because it renders the criterion blind to guaranteed improvements. A moral theory that cannot distinguish a world with extra welfare from one without, simply because the extra welfare is sparse, is deficient. We must prioritise Pareto and Non-triviality over Amnesia. The fact that the extra welfare is sparse does not make it valueless; it accumulates without bound.

  This commitment to accumulation over averages dictates our verdict on $\delta$ versus $\eta$. Both worlds Pareto-dominate $\alpha$. $\delta$ adds 99 units of welfare at $n=1$. $\eta$ adds 1 unit of welfare for a million days starting at $n=10^9$. Discounted summation favours $\delta$ overwhelmingly, as the early bump is weighted heavily. Overtaking, however, favours $\eta$. The cumulative sum of $\delta$ exceeds $\alpha$ by a constant 99. The cumulative sum of $\eta$ eventually exceeds $\alpha$ by $10^6$. Comparing $\delta$ and $\eta$ directly, $\delta$ leads initially, but $\eta$ overtakes $\delta$ after the million-day bonus period concludes, ending with a total advantage of roughly $10^6 - 99$. Since the limit of the difference is positive, overtaking ranks $\eta$ above $\delta$. I accept this verdict. It commits me to the view that temporal position is not intrinsically morally significant in the way discounting suggests. While there may be instrumental reasons to prefer early welfare (uncertainty, opportunity for investment), in the abstract evaluation of fixed histories, total welfare matters more than timing. $\eta$ contains more good than $\delta$. To prefer $\delta$ is to privilege the present generation arbitrarily. Thus, overtaking provides the superior account of temporal neutrality.

  We must now confront the conflict between Amnesia (D4) and Strong Pareto (D2). These cannot coexist. Consider $\delta$ and $\alpha$. They differ only at $n=1$. Amnesia demands they be equally good. Pareto demands $\delta$ be better. I surrender Amnesia. This is the cheaper concession because Amnesia is a structural convenience rather than a moral imperative. The justification for Amnesia is usually that finite differences are negligible in an infinite context. But moral negligibility does not follow from mathematical infinitude. If I can guarantee a better life for the first generation at no cost to anyone else, I am morally obliged to do so. To say that this improvement is "negligible" because the future is infinite is to devalue the existing generation for the sake of the non-existent. The betterness relation between infinite worlds is for guiding choice among feasible policies. If a policy yields a Pareto improvement, even if only for a finite time, it is better. Surrendering Amnesia allows us to respect this intuition. It does not render the criterion unstable; it merely acknowledges that finite changes matter when they constitute improvements.

  A powerful objection to this entire enterprise is that it is idle. No actual choice concerns an infinite future; the universe may end, or humanity may perish. Therefore, constructing elaborate criteria for infinite aggregation is theoretical indulgence. This objection fails because the infinite model serves as a limiting case for long-term policy. Climate change, existential risk mitigation, and population growth involve horizons that are effectively infinite for moral planning. If our ethical framework collapses when extended to the limit, it is likely unstable for very long finite horizons too. The paradoxes of the infinite reveal fault lines in our finite reasoning. For instance, if we accept Amnesia for the infinite case, we might be compelled to ignore significant finite improvements in very long-lived futures. The idealisation earns its keep by stress-testing our principles. If a criterion cannot handle the infinite case without contradiction, it lacks the robustness required for intergenerational justice.

  Furthermore, we must address the spectre of incomparability. If my proposed criterion leaves some worlds incomparable, what ought an agent to do? In the specific hybrid I propose, incomparability is minimised but not eliminated. For instance, if two worlds oscillate such that neither overtakes the other and their averages are equal, they may remain incomparable. In a forced choice, the agent should adopt a maximin strategy or choose the world with the higher lower bound on welfare. However, for the cases presented, the lexical overtaking criterion yields definite verdicts. We do not need incomparability to do all the theoretical work. It is a fallback, not a foundation. The goal is to provide action-guidance, and a criterion that frequently returns "no verdict" fails that goal. By lexicalising overtaking and averages, we ensure completeness for the relevant cases.

  In conclusion, the aggregation of infinite welfare requires us to make hard choices between competing desiderata. I adopt a Lexical Overtaking criterion. This criterion ranks world $X$ above $Y$ if the limit inferior of $S_X(n) - S_Y(n)$ is positive. If this limit is zero, we compare the Cesàro means. If those are equal, we apply Strong Pareto to finite differences. To secure this, I sacrifice Amnesia (D4), accepting that finite improvements matter even in infinite histories. I also reject Unrestricted Anonymity in favour of Finite Anonymity, acknowledging that temporal sequence carries moral weight regarding cumulative advantage. This criterion delivers the following specific verdicts: $\beta$ is better than $\alpha$ because the cumulative difference is non-negative and sometimes positive. $\eta$ is better than $\delta$ because the total cumulative welfare of $\eta$ eventually exceeds that of $\delta$, respecting total utility over timing. Finally, $\epsilon$ is better than $\alpha$ because the cumulative sum of the sparse bonuses grows without bound, satisfying Non-triviality. This approach preserves the core moral intuition that more welfare is better, without succumbing to the arbitrary time-preference of discounting or the blindness of pure averaging. It is a robust framework for an open future.
