  {
    "overall_score": <integer 0-100; our scale: 70 = solid B, 80 = A-, 90 = outstanding>,
    "grade_letter": <string>,
    "verdict_one_line": <string; plain English, what I'd say to the student in the hallway>,
    "claims": [
      {
        "id": <string, "C1", "C2", ...>,
        "claim": <string; short paraphrase of one substantive claim from the answer>,
        "status": <"correct" | "partly_correct" | "incorrect" | "contestable">,
        "note": <string; one or two sentences saying what is right or wrong about it and why, citing the actual view>,
        "severity": <"none" | "minor" | "moderate" | "major">
      }
    ],
    "errors_a_hasty_grader_would_miss": [
      <string; the subtle ones, each spelled out: what the answer says, what the correct account is, and why it matters to the argument>
    ],
    "what_it_gets_right": [<string>],
    "missed_opportunities": [<string; max 3 — an objection, distinction, or response the question invited and the answer didn't handle>],
    "is_the_conclusion_supported": <string; whether the conclusion follows from the argument as given, independently of whether the argument is accurate>,
    "margin_feedback": <string; 4-6 sentences addressed directly to the student, warm but honest, no name-dropping — something I could paste into the margin as-is>,
