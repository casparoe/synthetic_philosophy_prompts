answer: |-
  The argumentative move you have identified is indeed a familiar one, though it wears different coats in different disciplines. In the philosophy of mind, where you correctly sensed a parallel, this is known as **The Causal Exclusion Argument** (most famously associated with Jaegwon Kim). The logic is that if a lower-level property (e.g., a neural state) is causally sufficient for an effect, then a higher-level property (e.g., a mental state) that supervenes upon it is causally excluded, or 'epiphenomenal'.

  However, in the philosophy of social science, there is no single, universally settled noun for this specific inference that captures the sociological nuance you describe—specifically, the tension between *ontological reduction* (the group property is 'nothing over and above' individuals) and *explanatory autonomy* (the group property identifies stable configurations). While **Strong Methodological Individualism** describes the stance that permits this move, it does not name the inference itself. Critics of this move, particularly within Critical Realism (e.g., Margaret Archer) or structuralist traditions, often refer to it loosely as **reductive fallacy** or **explanatory eliminationism**, but these lack the precision you require.

  Therefore, adhering to your instruction to propose a term where nothing settled fits perfectly, I suggest you label this inference **The Micro-Sufficiency Fallacy**.

  ### Definition
  **The Micro-Sufficiency Fallacy** is the inference that a group-level property explains *nothing* solely on the grounds that the actions or states of the constituent individuals are *sufficient* to produce the outcome. It conflates the **constitution** of a phenomenon (what it is made of) with the **explanation** of its stability or constraints (why it persists or binds action).

  This definition is sharp enough to distinguish your two instances because it focuses on the *premise* of the critic's argument: does the critic argue that the individuals *did the work* (causal sufficiency), or that the group property *is not real* (ontological redescription)?

  ### Application to Your Instances

  **Instance 1: Norms vs. Expectations (Falls under the term)**
  *   **The Critic's Move:** "Only the traders' own expectations did any work."
  *   **Analysis:** Here, the critic explicitly grants causal sufficiency to the micro-level (expectations). They argue that because the expectations are sufficient to sustain the network, the norm (the macro-property) is explanatorily idle.
  *   **Verdict:** This **falls under** *The Micro-Sufficiency Fallacy*. The critic accepts the phenomenon but drains its explanatory power down to the individual psychology, ignoring your point that the *norm* explains why those specific expectations are stable rather than others.

  **Instance 2: Structure vs. Employers (Does not fall under the term)**
  *   **The Critic's Move:** "Wages are set by individual employers, so that structure is mere redescription."
  *   **Analysis:** Here, the critic's primary claim is ontological, not merely causal. By calling structure "mere redescription," they are arguing that the macro-property *does not exist* as a distinct entity, rather than arguing that it exists but lacks causal power. While the conclusion (explains nothing) is the same, the premise is that the term 'structure' is a linguistic shorthand, not a competing cause.
  *   **Verdict:** This **does not fall under** *The Micro-Sufficiency Fallacy* as strictly defined. It is instead an instance of **Ontological Eliminativism**. The error is not assuming micro-sufficiency excludes macro-causation, but denying the macro-property has any reality to begin with.

  ### Locating the Flaw
  The flaw in *The Micro-Sufficiency Fallacy* (Instance 1) lies in confusing **causal production** with **causal selection**. As you intuited, the individual actions produce the outcome, but the group-level property (the norm or structure) selects *which* actions are viable or stable over time.

  In philosophical terms, the group-level property provides an **Equilibrium Explanation** (a concept elaborated by Elliott Sober). It explains why the system settles into one configuration of individual behaviours rather than another. To say the individuals 'did the work' is like saying the bricks 'held up the roof' while denying that the *arch* explains why the bricks didn't fall down. The micro-level constitutes the mechanism; the macro-level explains the constraint.

  ### Summary for Your Chapter
  You might write:
  > "While this argumentative move echoes the **Causal Exclusion Argument** from the philosophy of mind, in sociological theory it is best identified as **The Micro-Sufficiency Fallacy**. This fallacy occurs when a critic infers explanatory idleness from ontological reducibility. It is crucial to distinguish this from **Ontological Eliminativism**: the former admits the social property but denies its causal work (as in the reduction of norms to expectations); the latter denies the property's existence altogether (as in the reduction of structure to mere redescription). Both err by ignoring that social properties explain the *stability* and *constraint* of individual configurations, not merely their immediate production."

  This terminology should provide the analytical leverage you need to dissect the argument without getting bogged down in the broader, often sterile, holism-individualism debate.
