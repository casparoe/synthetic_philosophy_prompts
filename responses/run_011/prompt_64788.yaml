          *   *Wording:* Needs to be careful. "Tradition holds..." vs. "Records suggest..."
          *   *The Ceremony:* Focus on the *Library* as the enduring institution, not just the founder. Acknowledge *all* contributors (Vance + Workers).
          *   *Timeline:* October (decision), November-December (design/fundraising), January-March (installation/programming), April (Event).
          *   *The Vance Donation:* Address the conditionality. "As planned" should mean "celebrating the library," not "lying about history." Negotiate this carefully.
      *   **Future Standard (Requirement):** How to handle Memory vs. Record going forward?
          *   Propose a "Dual-Test" or "Layered Interpretation" standard.
          *   Memory is valid as *social history*; Record is valid as *factual history*. Both belong in the interpretation.
      *   **Conclusion:** Reiterate the goal: Unity and Truth.

  4.  **Refining the Tone:**
      *   Avoid accusatory language against the Vance family or the 1974 Commission.
      *   Avoid dismissive language against the graduate student's findings.
