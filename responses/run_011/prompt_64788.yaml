          *   *New Evidence (Grad Student):* Purchase price came from 10 years of wage deductions from workers. Vance's name on deed was likely just for legal solvency.
          *   *Caveat (Archivist):* Ledger could record voluntary subscription, not mandatory deduction. Uncertainty remains.
          *   *Stakeholders:*
              *   *Commission:* Needs to correct its own 1974 error if acting on new evidence.
              *   *Vance Family:* Pledged $380k for restoration *conditional* on the anniversary proceeding "as planned" (implies maintaining the narrative).
              *   *Descendants of Mill Hands:* Prefer the Vance story; don't want their heritage "taken" at a celebration.
              *   *Mandate:* Preserve and interpret heritage (undefined terms).
      *   **Requirements:**
          *   Recommend a concrete course of action (plaque text, ceremony, timeline).
          *   Make the strongest honest case for letting the town's memory stand (even if records contradict).
          *   Propose a standard for future conflicts between memory and record.
          *   Tone: Professional, diplomatic, historically rigorous, ethical, actionable.

  2.  **Determine the Stance:**
      *   *Option A: Full Correction.* Replace the plaque, tell the truth about wage deductions. Risk: Lose funding, alienate families, create conflict during a celebration.
      *   *Option B: Status Quo.* Ignore the new evidence. Risk: Professional integrity, historical accuracy, potential backlash later if evidence leaks.
      *   *Option C: Nuanced Integration (The "Both/And" Approach).* Acknowledge the complexity. The "Vance Story" is part of the social history (how the town *felt* about itself), while the ledger is part of the economic history (how it *worked*). This honors the mandate to "interpret" heritage, not just list facts.
      *   *Decision:* Option C is the most responsible path for a Historical Commission. It respects the donors and descendants without lying about the new evidence. It treats the 1974 plaque itself as a historical artifact.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Introduction:** Acknowledge the milestone, the new research, and the complexity. State the purpose of the memo.
      *   **The Historical Conflict:** Briefly summarize the 1974 narrative vs. the 2024 findings vs. the archivist's caveat. Acknowledge the uncertainty (it's not 100% proven coercion).
      *   **The Case for Memory (Requirement):** This needs to be strong. Why does the "Vance Story" matter?
          *   It reflects the *relationship* as perceived by the community.
          *   It served a social cohesion purpose for 150 years.
          *   Heritage includes mythology and shared identity, not just cold hard data.
          *   The descendants *want* this story. It gives them dignity (benefactors rather than just payers).
      *   **The Case for Record (Requirement):**
          *   Integrity of the Commission.
          *   Financial reality (wage deductions) is a significant part of labor history.
          *   We cannot knowingly display misinformation.
      *   **Recommendation (Concrete Course of Action):**
