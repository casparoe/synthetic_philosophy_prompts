      *   *Modus Ponens:* Generally safe, but might fail in complex embeddings (McGee cases).
      *   *Known False Antecedents:* "If Oswald didn't shoot..." (when we know he did).
          *   Standard view: Indicatives with known false antecedents are infelicitous.
          *   My view: They are felicitous *if* we shift the info state. But wait, the thesis says Indicatives = Actual State. If we know $A$ is false, $A$ is not in the actual state.
          *   *Correction:* The thesis says Indicatives use the *actual information state*. If $A$ is known false, the indicative is usually bad ("If Oswald didn't shoot [but we know he did]..."). The Subjunctive is used to *force* the state shift.
          *   *Cost:* I must surrender the intuition that indicatives *can* comfortably handle known false antecedents without mood shifting. Or, I must admit that "Actual Information State" allows for *hypothetical* updates, blurring the line.
          *   *Better Cost:* I must surrender the idea that Indicatives always track *objective* chances. They track *epistemic* probability.
          *   *Biggest Cost:* The "Gibbard Phenomenon" / Triviality Results. If conditionals express propositions, Lewis's triviality results apply. If they don't, embedding is hard. I need to admit my view struggles with the propositionhood of conditionals.
          *   *Referee's Attack:* The referee will ask: "What exactly *is* the semantic value?" If it's a set of worlds, you get triviality. If it's a function, how does it compose? The referee will press on the *mechanism of the shift*. Is it grammaticalized? If so, isn't that just ambiguity in disguise?

