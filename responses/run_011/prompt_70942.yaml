answer: |-
  **Title:** The Unity of *If*: A Defense of the Single-Connective Information-State Account

  **1. The Positive Case: One Connective, Two Contexts**

  The orthodoxy holds that English conditionals are lexically ambiguous. On this view, the *if* in "If Oswald didn't shoot Kennedy, someone else did" is a different logical beast from the *if* in "If Oswald hadn't shot Kennedy, someone else would have." The former is an epistemic conditional, tracking conditional probability; the latter is a counterfactual, tracking similarity between possible worlds.

  I argue this is a theoretical overreach. The data are better explained by a single semantic clause for *if*, coupled with a rule governing which information state serves as the evaluation base. The semantic clause is invariant: *If A, then B* asserts that *B* holds in the relevant *A*-worlds. The variation lies entirely in the selection of the "relevant worlds."

  **The Oswald Data**
  Consider the indicative: *If Oswald didn't shoot Kennedy, someone else did.*
  On my account, this is evaluated against the speaker's **actual information state** ($K_{actual}$). In $K_{actual}$, it is a fixed fact that Kennedy was shot. The antecedent *Oswald didn't shoot* is compatible with $K_{actual}$ (we might not know who did it). To evaluate the conditional, we look at the worlds in $K_{actual}$ where Oswald didn't shoot. Since $K_{actual}$ fixes "Kennedy was shot," in all those worlds, someone else must have done it. The conditional is assertable.

  Now the subjunctive: *If Oswald hadn't shot Kennedy, someone else would have.*
  Here, the rule shifts. We do not evaluate against $K_{actual}$. We evaluate against a modified state ($K_{modified}$) constructed by taking $K_{actual}$ and **removing the negation of the antecedent by supposition**. We know in $K_{actual}$ that Oswald *did* shoot. To evaluate the subjunctive, we perform a belief revision: we excise the fact *Oswald shot* and the fact *Kennedy was shot* (since they are causally linked in our knowledge). We ask: in this revised state, if we suppose Oswald doesn't shoot, does someone else? Perhaps not. Perhaps there was no conspiracy. The conditional may be false.

  This reproduces the data without ambiguity. The difference in truth conditions arises not from *if* changing meaning, but from the input state changing.

  **Probability and Parsimony**
  This explains the probabilistic divergence. Indicatives track $P(B|A)$ relative to $K_{actual}$. Since $K_{actual}$ includes the fact that Kennedy was shot, $P(\text{Someone else did} | \text{Oswald didn't})$ is high.
  Subjunctives resist this reading because they are not evaluated against $K_{actual}$. They are evaluated against $K_{modified}$. In $K_{modified}$, the probability of the shooting itself is open. Thus, the conditional probability is calculated over a different distribution.

  The rival two-connective account posits a lexical ambiguity. This requires positing two distinct logical forms, two distinct entry conditions in the lexicon, and an explanation for why natural languages so rarely distinguish these connectives morphologically. My view posits one connective and a general pragmatic/semantic rule for context selection triggered by mood morphology (indicative vs. subjunctive). This is theoretically cheaper. We do not multiply connectives beyond necessity; we recognize that the *context of evaluation* is a parameter of the semantics, just as time or location can be.

  **2. The Embedding Challenge**

  The gravest threat to any deflationary account is embedding. If the information-state rule is merely a pragmatic overlay at the root level, it should vanish inside complex sentences. It does not.

  **Conditionals in Conditionals**
  Consider: *If (if A then B), then C.*
  If the inner conditional relies on a pragmatic rule about the speaker's actual state, embedding it under an outer *if* should be incoherent. The outer antecedent *A* creates a hypothetical context. Does the inner conditional shift its base state again?
  *Honest Assessment:* The information-state rule cannot remain a purely pragmatic root-level rule. It must be revised into a **dynamic semantic parameter**. The context parameter $c$ (which supplies the information state) must be passed down the syntactic tree. When the outer antecedent is processed, it updates $c$ to $c+A$. The inner conditional then evaluates $B$ against $c+A$.
  *Revision:* The rule survives, but it ceases to be a simple instruction to the hearer and becomes a variable in the compositional semantics. The subjunctive mood must be treated as an operator that explicitly manipulates this context variable $c$ (by removing $\neg A$) before the conditional connective operates.

  **Negation and Probability Operators**
  *It is not the case that if A then B.*
  *It is probable that if A then B.*
  If conditionals are not propositions (as Adams suggests), negation and probability operators have nothing to grab onto. My view must concede that conditionals *do* express propositions, but these propositions are context-dependent.
  *   **Negation:** Negates the claim that $B$ holds in the $A$-worlds of the current context state.
  *   **Probability:** Quantifies over the information states themselves. "It is probable that if A then B" means that in most epistemically accessible information states, the $A \rightarrow B$ inference holds.
  *   **Questions:** *If A, then B?* asks whether the update of the current context with $A$ supports $B$.

  *Survival:* The information-state rule survives embedding only if we treat the "state selection" as part of the semantic value of the mood markers, not the conditional particle itself. If we treat it as purely pragmatic, embedding data falsifies the view. I must therefore concede that the "rule" is grammaticalized.

  **3. The Costs: What We Must Surrender**

  A unified theory is not free. To maintain that there is only one conditional connective, we must surrender several entrenched intuitions.

  **1. Contraposition**
  We must surrender the validity of contraposition for indicatives.
  *If A, then B* evaluates $B$ in $A$-worlds compatible with $K_{actual}$.
  *If not-B, then not-A* evaluates not-A in not-B-worlds compatible with $K_{actual}$.
  Because $K_{actual}$ is not symmetric with respect to belief revision (removing $\neg A$ is different from removing $B$), contraposition fails. If I know the match is wet ($W$) and struck ($S$), *If it wasn't struck, it wouldn't be wet* is true. But *If it's wet, it was struck* might be false (it could be a sprinkler). My view predicts this failure naturally, but it contradicts the intuition that logical form should preserve contraposition.

  **2. Modus Ponens in Complex Embeddings**
  While Modus Ponens holds at the root, it is known to fail in nested conditionals (McGee cases). My view handles this by noting that the context parameter shifts in the nested environment. However, I must surrender the intuition that Modus Ponens is a *universal* validity for the conditional connective. It is valid only relative to a stable context parameter.

  **3. The "Known False" Antecedent Constraint**
  Standard theory says indicatives are infelicitous if the antecedent is known false. My view explains *why*: because the indicative uses $K_{actual}$, and if $A$ is known false, there are no $A$-worlds in $K_{actual}$.
  *The Cost:* I must surrender the data points where speakers *do* use indicatives with known false antecedents for rhetorical effect (e.g., "If you're the genius you say you are, solve this" — when I know you aren't). My theory must classify these as coercions of the context parameter (forcing the hearer to pretend $K_{actual}$ is different) or mark them as pragmatic exceptions. I cannot claim the theory predicts them as standard cases.

  **4. Where the Referee Will Press Hardest**

  A competent referee will not attack the Oswald examples; they fit too well. The attack will come on two fronts:

  **A. The "Hidden Ambiguity" Objection**
  The referee will argue: "You claim there is one connective, but you admit the context parameter is manipulated by grammatical mood (indicative vs. subjunctive) in a systematic, rule-governed way. If the semantic value of *if* is $f(c, A, B)$, and $c$ is determined by a morphological marker that consistently changes the function $f$, haven't you just relocated the ambiguity from the lexicon to the context parameter? You have one word, but two distinct semantic functions."
  *My Defense:* I must argue that the *logical form* is identical. The operation is always "restrict the domain to A-worlds and check B." The *source* of the domain varies, but the *operation* does not. This is akin to saying "here" is not ambiguous even though it refers to different locations in different contexts.
  *Weak Point:* This is thin. If the rule for selecting $c$ is hard-wired to mood, the distinction is effectively semantic. I must admit this is the view's weakest theoretical flank.

  **B. Triviality Results**
  If I claim conditionals express propositions (to handle embedding/negation), I run headlong into Lewis's Triviality Results. If *If A then B* is a proposition whose probability is $P(B|A)$, the math breaks.
  *My Defense:* I must surrender the claim that the conditional *is* a proposition in the standard sense. It is a **context-change potential**. The embedding under "probable" is not quantifying over a proposition's truth, but over the stability of the inference across context variations.
  *Weak Point:* This requires a non-standard logic of embedding. A referee trained in classical semantics will view this as ad hoc machinery designed to save the thesis from triviality.

  **Conclusion**

  This view is heretical because it denies a deep semantic split that feels intuitive to many linguists. It saves the unity of *if* at the cost of complicating the theory of context. It reproduces the Oswald data and the probability divergence elegantly, but it struggles to fully naturalize embedding without conceding that the "context shift" is effectively a second connective in disguise. The strongest argument for it is parsimony; the strongest argument against it is that the "context parameter" is doing so much heavy lifting that it amounts to the very ambiguity the theory seeks to avoid. I offer this not as a settled truth, but as a challenge: if we can make the information-state rule compositional without collapsing into ambiguity, we save the unity of the conditional. If we cannot, the orthodoxy wins.
