      *   *Clarity on the Mechanism:* The prompt specifies: Indicative = Actual Info State; Subjunctive = State with antecedent's negation removed. I need to stick to this.
      *   *Embedding:* I need to be honest. A purely pragmatic rule *cannot* handle embedding well. I must concede that for the view to work, the "info-state parameter" must be semantically active, which risks collapsing back into the two-connective view (one connective + two parameters). I need to argue the *connective* is the same, even if the parameter setting is grammatically triggered.
