      *   **Tone:** Honest about weak points, not triumphant. Strong argumentation but self-critical.

  2.  **Deconstruct the Central Claim (The "Unified Information-State" View):**
      *   This sounds like a variant of the *Suppositional Theory* (Edgington, Bennett) mixed with a *Context-Shift* account of counterfactuals (like Stalnaker or Lewis but without the lexical ambiguity).
      *   *Core Mechanism:* $A > C$ is true/acceptable iff $C$ is true/acceptable in the closest $A$-worlds to the *base world/state*.
      *   *The Twist:* The "base world/state" changes based on mood.
          *   Indicative: Base = Actual Information State ($K_{actual}$).
          *   Subjunctive: Base = Modified Information State ($K_{modified}$), typically one where we "undo" the known falsity of $A$ or shift to a past context before $A$ was settled.
      *   *Goal:* Show this handles the Oswald examples without saying "if" means two different things.

  3.  **Drafting Section 1: The Positive Case (Defending the Thesis):**
      *   *The Oswald Cases:*
          *   Indicative: "If Oswald didn't shoot Kennedy, someone else did." We know Kennedy was shot. We don't know for sure who (in the hypothetical context of the assertion). We hold fixed "Kennedy was shot." We look at worlds compatible with our knowledge where Oswald didn't do it. In those worlds, someone else did. High conditional probability.
          *   Subjunctive: "If Oswald hadn't shot Kennedy, someone else would have." Here we are entertaining a scenario where the shooting *might not have happened*. We shift the context to a state prior to the decision or remove the fact "Kennedy was shot" from the fixed background. Now, is it true someone else *would* have? Maybe not. The conspiracy might not have existed.
      *   *Probability:*
          *   Indicatives track $P(C|A)$ relative to current knowledge.
          *   Counterfactuals track $P(C|A)$ relative to a *shifted* knowledge state (often involving causal models or past states). This explains why they resist simple conditional probability readings based on *current* knowledge (where $P(A) \approx 0$).
      *   *Parsimony:* The rival view (Ambiguity) says "if" is lexically ambiguous (like "bank"). My view says "if" is stable; context shifts. This is theoretically cheaper (no lexical multiplication).

  4.  **Drafting Section 2: Embedding Data (The Hard Part):**
      *   *Conditionals in Conditionals:* "If (if A then B), then C."
          *   Problem: Does the inner conditional shift the info state?
          *   Solution: The info-state rule must be *dynamic*. The antecedent of the outer conditional updates the context for the inner one.
      *   *Negation:* "It is not the case that if A then B."
          *   Standard view: Negation applies to the whole proposition.
          *   My view: Negation applies to the claim that $C$ follows from $A$ in the relevant state.
      *   *Probability Operators:* "It is probable that if A then B."
          *   This is tricky. If conditionals aren't propositions (Adams' Thesis), this is hard.
          *   My view needs to allow the info-state shift to happen *inside* the scope of the probability operator. "Probable" quantifies over epistemic possibilities; the conditional evaluates $C$ in $A$-worlds within those possibilities.
      *   *Questions:* "If A, then B?"
          *   Asks whether the inference holds in the current (or shifted) state.
      *   *Crucial Concession:* The info-state rule likely needs revision for *embedding*. It can't be a simple pragmatic rule at the root level; it must be part of the compositional semantics (a context parameter $c$ that gets passed down). If I treat it as purely pragmatic, embeddings break. I must admit the "rule" is actually a semantic parameter sensitive to mood markers.

