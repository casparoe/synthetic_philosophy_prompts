      *   *Objection 3 (Strat/Diachrony):* "You are correct that the variables depart at different times. This is a feature, not a bug. The Earth system is coupled but not synchronous. A single isochronous boundary imposes a false precision on a complex transition. My criterion identifies the earliest sustained departure across the panel, acknowledging that different subsystems respond on different timescales. The biosphere responds to colonization immediately; the carbon cycle responds to industrialization later. Choosing the earliest sustained departure respects the causal sequence of anthropogenic forcing. If we wait for all variables to depart, we ignore the initial destabilization. If we pick the carbon spike, we ignore the biological homogenization that preceded it. The boundary is not a line but a transition zone, and my criterion identifies the onset of that zone. Stratigraphy demands a line; Earth system science recognizes a trajectory. We should date the trajectory." (151 words).

      *   *Objection 4 (Phil/Variable Selection):* "I concede the panel selection influences the outcome. Any periodization scheme involves selecting markers. The question is whether the selection is defensible. I chose variables that represent core Earth system processes: carbon, temperature, ice, land, nutrients, biosphere. Excluding the biosphere would be unjustifiable given the magnitude of the Great Exchange. Excluding carbon would be equally wrong. The weighting is equal; the date is determined by the earliest sustained departure. This is not motivated reasoning to reach fourteen ninety-two; it is the result of applying the criterion to the panel. If the carbon variable departed earlier, the date would be later. The criterion constrains the outcome by requiring sustained departure under counterfactual forcing. It is not a machine for returning my preferred date; it is a test that my preferred date happens to pass." (152 words).

      *   *Objection 5 (Modeller/10ky):* "The ten-thousand-year threshold is indeed arbitrary, but it is anchored to the Holocene itself. The Holocene is defined by roughly ten thousand years of stability. To define a departure from the Holocene, we must use a timescale comparable to the Holocene. Using one thousand years captures decadal variability; using one hundred thousand years captures glacial-interglacial cycles. The goal is to distinguish anthropogenic forcing from natural Holocene variability. The counterfactual test asks: if humans stopped now, would the system return to Holocene conditions within a Holocene lifespan? If not, the departure is sustained. This aligns the definition of the new state with the timescale of the old state. It is not a perfect number, but it is geologically grounded in the epoch we are claiming to supersede." (151 words).

      *   *Objection 6 (Modeller/Counterfactual):* "Freezing forcing is a simplification, but it is a necessary one for attribution. We cannot run a controlled experiment on the Earth system. Counterfactual modelling is the standard tool for attribution science, used routinely in extreme event attribution. The structural uncertainty is high, but the signal is strong enough to distinguish between pre-industrial and industrial forcing regimes. We are not asking for precise trajectories; we are asking for binary classification: return or no return. The ensemble spread may be wide, but the separation between the fourteen ninety-two and nineteen fifty scenarios is distinct enough to support the criterion. If the models cannot distinguish these scenarios, then attribution science itself is impossible. I am relying on established methods, not inventing new physics." (148 words).

      *   *Objection 7 (Strat/ICS Authority):* "I agree that the ICS rejection removed the authority settling the question. That is exactly why we are here. The question of entitlement is now open. I am not claiming to override the ICS; I am claiming that the ICS vacated the seat. If stratigraphy cannot formalize the Anthropocene, other disciplines must date the phenomenon. Scientists date events based on evidence relevant to their field. Geologists use rocks; historians use documents; Earth system scientists use state variables. No single group holds a monopoly on dating planetary change. The ICS decision was about stratigraphic code, not ontological reality. We are discussing the reality, not the code. You are entitled to your stratigraphic unit; I am entitled to my process date. We are talking past each other only if we pretend there is only one valid language." (156 words).

      *   *Objection 8 (Historian/1610):* "The sixteen ten dip is legible, but it moves toward the Holocene mean, not away from it. My criterion requires departure from the envelope. The dip is a transient reduction in CO2, likely due to reforestation following colonization. It does not represent a sustained shift in Earth system state. The biosphere transposition is sustained, even if the atmospheric signal is weak. Legibility should not trump directionality. A sharp spike that returns to baseline is less significant than a weak shift that persists. The Lewis and Maslin argument relies on the spike being a golden spike. I am arguing that the spike is less important than the sustained biological reorganization. We should date the change that matters, not the change that cores best." (149 words).

      *   *Objection 9 (Journalist/Confusion):* "I understand the confusion. Headlines want a single year. But Earth system change is not a single event. It is a cascade. My criterion identifies the onset of the cascade, which begins with the biosphere transposition. The carbon spike is a later stage in the same process. If you must quote one date, quote the onset of sustained departure. But do not simplify the science to fit a headline. The Anthropocene is not a birthday; it is a transition. Reporting it as a single year misleads the public about the nature of the change. I would prefer you report that the Earth system shifted in stages, beginning with colonization and accelerating with industrialization. That is the truth, even if it is harder to tweet." (146 words).

      *   *Objection 10 (Historian/Agriculture):* "Agriculture is a strong candidate, but it did not cause a sustained global departure from the Holocene envelope. Early anthropogenic hypotheses suggest CO2 rises from farming, but the signal is debated and not globally synchronous. The Columbian Exchange created a global homogenization of biota that is unprecedented and irreversible on relevant timescales. Agriculture changed land cover locally; colonization changed the biosphere globally. My criterion requires global sustained departure. The fourteen ninety-two event meets this threshold more clearly than the Neolithic. I am not denying earlier impacts; I am denying they meet the sustained-departure criterion globally. The threshold is high by design to distinguish background noise from system shift." (146 words).

