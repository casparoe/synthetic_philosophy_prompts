answer: |-
  ### Desiderata for Committee Award Selection

  The following specifications define the structural requirements for a defensible aggregation procedure in a 17-member committee with a powerful chair and a small candidate set. They are categorized by their normative status and the specific strategic vulnerabilities they address.

  #### 1. Voter Anonymity (Equality of Weight)
  *   **Requirement:** The outcome must depend only on the multiset of ballots cast, not on which specific member cast which ballot. Every voting member's ballot must have identical weight in the final tally.
  *   **Motivating Situation:** A senior member argues that their longer tenure should grant their vote greater weight than a first-year member. Or, the Chair attempts to break ties not by lot, but by fiat. In a committee of 17, if Member A and Member B swap ballots and the result changes, the rule privileges identity over judgment.
  *   **Label:** **Non-negotiable.** (Legitimacy condition).
  *   **Conflicts:** Conflicts with any role-based weighting (e.g., giving the Chair a tie-breaking vote). It is mathematically compatible with almost all counting rules but often violated by procedural bylaws.

  #### 2. Candidate Neutrality (Symmetry)
  *   **Requirement:** The rule must treat all finalists symmetrically. Permuting the names of the candidates on the ballots must permute the outcome accordingly. No candidate receives a bonus for being the incumbent, the first listed, or the status quo.
  *   **Motivating Situation:** The committee uses a rule where the current winner is automatically renominated and requires only 40% to stay, while challengers need 60%. Or, the Chair places a preferred candidate last on the ballot in a system where order matters (e.g., sequential elimination).
  *   **Label:** **Non-negotiable.** (Legitimacy condition).
  *   **Conflicts:** Conflicts with "Status Quo Bias" rules designed to prevent radical change. In your setting, it conflicts with the Chair's ability to structure a "screening round" that effectively eliminates specific candidates before the final vote.

  #### 3. Participation (No No-Show Paradox)
  *   **Requirement:** A member should never be better off abstaining than voting honestly. Submitting a sincere ballot must not result in an outcome strictly worse for that member than if they had stayed home.
  *   **Motivating Situation:** Member X prefers A > B > C. If X votes, their support for A strengthens A, causing B to be eliminated in a runoff, allowing C to win. If X abstains, A is eliminated early, B survives, and B beats C. X is punished for participating.
  *   **Label:** **Non-negotiable.** (Ethical baseline).
  *   **Conflicts:** **Directly conflicts with Condorcet Consistency.** It is mathematically impossible for a rule to always elect the Condorcet winner (if one exists) and guarantee participation in all profiles with 4+ candidates. You must sacrifice one.

  #### 4. Clone Independence (Spoiler Resistance)
  *   **Requirement:** The introduction of a candidate who is ideologically identical or very similar to an existing finalist (a "clone") should not change the winner from the original candidate to a third, distinct candidate.
  *   **Motivating Situation:** Two finalists work on similar sub-fields (A1 and A2). A third finalist (B) works on a different sub-field. If A1 and A2 both run, they split the "sub-field vote," allowing B to win. If A2 withdraws, A1 wins. The presence of A2 hurts A1.
  *   **Label:** **Non-negotiable.** (Stability condition).
  *   **Conflicts:** **Conflicts with Condorcet Consistency and Plurality.** Instant Runoff Voting (IRV) fails this. Borda Count fails this. Only rules like Score Voting or specific Condorcet methods (Minimax) handle this well, but often at the cost of other criteria.

  #### 5. Agenda Invariance (Path Independence)
  *   **Requirement:** The winner must not depend on the sequence in which candidates are considered, paired, or screened. The Chair's control over discussion order or screening rounds must not be able to alter the mathematical outcome given a fixed set of ballots.
  *   **Motivating Situation:** The Chair wants Candidate Z to win. They structure a screening round where Z faces a weak opponent first, survives, and then faces a strong opponent who was exhausted by a previous fight. If the order were reversed, Z would have been eliminated.
  *   **Label:** **Non-negotiable.** (Constraint on Chair Power).
  *   **Conflicts:** **Conflicts with Sequential Elimination rules.** Any rule that relies on a "shortlisting" phase followed by a final vote is inherently vulnerable to agenda manipulation unless the shortlisting rule is perfectly aligned with the final rule (which is rare).

  #### 6. Condorcet Consistency (Majority Will)
  *   **Requirement:** If there is a candidate who would beat every other candidate in a head-to-head majority vote, that candidate must win.
  *   **Motivating Situation:** Candidate M is the moderate choice. 9 members prefer M over A, and 9 prefer M over B. However, A and B have passionate bases. A rule that sums rankings (Borda) might let A win because A has more 1st-place votes, even though M is the pairwise champion.
  *   **Label:** **Prejudice.** (Partisan of pairwise majority comparison).
  *   **Conflicts:** **Conflicts with Participation (see #3) and Strategy-Proofness.** Insisting on this guarantees the No-Show Paradox is possible. It also tends to incentivize "burying" strategies where voters rank a strong opponent last to help their favorite beat them pairwise.

  #### 7. Obvious Manipulation Resistance (Practical Strategy-Proofness)
  *   **Requirement:** While perfect strategy-proofness is impossible (see Impossibility section), the rule should make successful manipulation computationally difficult or socially obvious. A member should not be able to easily calculate a better outcome by lying, and if they do, the lie should be detectable by peers.
  *   **Motivating Situation:** In a Borda count, a member ranks a strong rival last, even though they genuinely view them as second-best. In a committee of 17 with known preferences, peers notice, "I know you respect Candidate Q, why is Q last?"
  *   **Label:** **Negotiable.** (Incentive condition).
  *   **Conflicts:** **Conflicts with Expressiveness.** Rules that allow intense expression (Cardinal/Score) are often easier to manipulate strategically (max/min scoring) but harder to detect as "lies" because intensity is subjective. Ordinal rules make lies easier to spot against known preferences.

  #### 8. Intensity Sensitivity (Cardinal Expressiveness)
  *   **Requirement:** The rule should allow members to distinguish between "slightly prefer" and "strongly prefer."
  *   **Motivating Situation:** 10 members slightly prefer A over B. 7 members passionately prefer B over A (A is unacceptable to them). An ordinal rule treats the 10 slight preferences as equal to the 7 strong ones. A cardinal rule allows the 7 to vote "0" for A and "10" for B, potentially overriding the mild majority.
  *   **Label:** **Negotiable.** (Prejudice of intensity-and-utility people).
  *   **Conflicts:** **Conflicts with Anonymity/Neutrality if scales are not normalized.** It also complicates the "Known Preferences" dynamic; if I know you are using Score Voting, I know you will likely give my rival a 0 and my favorite a 10, turning it back into an ordinal contest but with more noise.

  ---

  ### Incentive Conditions and Strategic Conduct

  Standard social choice theory assumes a one-shot election with a large, anonymous electorate and private preferences. Your setting violates all three. You have a **small, known, repeated game.** This changes the incentive landscape fundamentally.

  **1. Manipulating One's Own Ballot (Shading)**
  *   *Standard View:* Gibbard-Satterthwaite theorem states that for 3+ candidates, no deterministic ordinal rule is strategy-proof.
  *   *Your Setting:* Because preferences are known, "manipulation" is not hidden information; it is a public act. The constraint is not mathematical impossibility but **social sanction**.
  *   *Desideratum:* **Detectability.** The rule should make a strategic ballot look inconsistent with a member's known history.
  *   *Survival:* If you drop the "deterministic" hypothesis and allow for a randomized tie-breaker, you reduce the payoff of manipulation, but do not eliminate it. If you drop "ordinal" and use Cardinal (Score) voting, you invite "min-maxing" (voting only 0 or 10), which collapses the rule back to ordinal utility.

  **2. Manipulating the Candidate Set (Entry/Exit)**
  *   *Standard View:* Independence of Irrelevant Alternatives (IIA).
  *   *Your Setting:* Finalists are nominated before voting. A faction can nominate a "clone" of a rival to split their vote.
  *   *Desideratum:* **Clone Independence (see #4).**
  *   *Survival:* Most common rules (Plurality, IRV, Borda) fail this. Only Score Voting and certain Condorcet methods satisfy it. In a repeated game, factions that abuse cloning will be sanctioned, but the rule should not invite the temptation.

  **3. Manipulating the Agenda (Chair Power)**
  *   *Standard View:* Usually ignored in voting theory, which assumes a fixed ballot.
  *   *Your Setting:* The Chair controls screening and order. This is the single greatest vulnerability.
  *   *Desideratum:* **Agenda Invariance (see #5).**
  *   *Survival:* This requires a **One-Stage** process. Any rule involving a "shortlist then winner" structure is mathematically vulnerable to agenda control unless the shortlisting threshold is extremely high or the final rule is robust to candidate removal.
  *   *Silence:* Standard theorems are silent here. You must impose a procedural constraint: The Chair proposes the agenda, but the Committee votes to *close* the agenda before balloting.

  **4. Manipulating the Rule (Constitutional Gaming)**
  *   *Standard View:* Assumed fixed.
  *   *Your Setting:* Bylaws are silent; the rule is re-adopted by muddle. A coalition might push for IRV one year because it helps their sub-field, then Borda the next.
  *   *Desideratum:* **Constitutional Stability.** The rule should be adopted for a fixed term (e.g., 5 years) covering multiple turnover cycles, decoupling the rule choice from the immediate candidate set.
  *   *Survival:* This is a governance constraint, not a mathematical one. It requires a supermajority to change the rule.

  **Repeated Game Effects:**
  In a one-shot election, you maximize immediate utility. In your committee, you maximize **reputation**. A member who is caught manipulating a ballot loses influence in future years. Therefore, **Transparency of Mechanism** is more important than **Strategy-Proofness**. A complex rule where manipulation is hard to *detect* is worse than a simple rule where manipulation is obvious.

  ---

  ### The Impossibility Result

  You cannot satisfy the following subset of desiderata simultaneously:
  **{Condorcet Consistency, Participation, Clone Independence}**

  Furthermore, if you require **Strategy-Proofness** for 3+ candidates with a deterministic rule, **no rule exists** (Gibbard-Satterthwaite).

  **The Exclusionary Requirement:**
  The single requirement that does the most work in excluding candidates is **Condorcet Consistency**.
  *   *Why?* It is the most intuitively appealing ("the majority should win"), but it is the mathematical engine that drives the No-Show Paradox (violating Participation) and makes the rule highly susceptible to strategic "burying" (violating Obvious Manipulation Resistance).
  *   *Recommendation:* In a small committee where members know each other, **Participation** is more important than Condorcet Consistency. It is worse for a member to feel forced to stay home than for a pairwise majority winner to lose to a consensus candidate.

  **Silence of Standard Theorems:**
  *   **Chair Power:** Standard theory assumes no agenda setter. Theorems do not cover the interaction between a voting rule and a screening round controlled by a non-voting officer.
  *   **Known Preferences:** Standard theory assumes Bayesian uncertainty. With complete information, the "equilibrium" of the voting game changes. A rule that is robust to uncertainty might be fragile when everyone knows everyone's ranking.
  *   **Repeated Play:** Standard theory is one-shot. It does not account for reputation costs, which act as a soft enforcement mechanism for honesty.

  ---

  ### Comparison of Plausible Rules

  The following table scores six common rules against the non-negotiable and negotiable desiderata identified above.

  | Rule | Anonymity | Neutrality | Participation | Clone Indep. | Agenda Indep. | Manipulation Detectability | Intensity | Verdict |
  | :--- | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :--- |
  | **Plurality** | Yes | Yes | Yes | **No** | Yes | High | No | **Reject.** Fails Clone Indep; encourages vote-splitting in 3-6 field. |
  | **Instant Runoff (IRV)** | Yes | Yes | **No** | **No** | **No** | Medium | No | **Reject.** Fails Participation (No-Show); vulnerable to Agenda (screening order). |
  | **Borda Count** | Yes | Yes | Yes | **No** | Yes | **High** | No | **Caution.** Easy to manipulate (burying rivals), but manipulation is obvious in small group. |
  | **Condorcet (Minimax)** | Yes | Yes | **No** | Yes | Yes | Medium | No | **Contender.** Best for pairwise will, but risks No-Show Paradox. Complex to explain. |
  | **Approval Voting** | Yes | Yes | Yes | Yes | Yes | Medium | **Low** | **Strong.** Simple. Resists clones. Encourages honest "acceptable" thresholds. |
  | **Score Voting (0-10)** | Yes | Yes | Yes | Yes | Yes | Low | **Yes** | **Strong.** Best for intensity. Vulnerable to min-max strategy, but hard to prove dishonesty. |

  **Recommendation:**
  Adopt **Score Voting (0-5 or 0-10)** with a **Constitutional Lock**.
  1.  **Why Score?** It satisfies Participation, Clone Independence, and Agenda Independence. It allows intensity (Desideratum #8).
  2.  **Why not Condorcet?** It violates Participation, which is toxic in a volunteer committee.
  3.  **Why not IRV?** It fails Agenda Independence, handing too much power to the Chair's screening process.
  4.  **Governance:** Fix the rule for 5 years to prevent Constitutional Gaming. Require the Chair to publish all ballots (anonymized) after the decision to leverage the "Known Preferences" dynamic for social enforcement of honesty. This turns the "secret ballot" into a "secret until audit" system, deterring obvious manipulation without violating privacy.
