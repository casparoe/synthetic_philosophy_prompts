  **(Self-Correction during drafting):** I initially thought about suggesting the "Deck" analogy is better. But the user noted it gets reshuffled. That implies the *cards* (people) still exist before the deal. That's still Platonic. The Chemical Reaction is better because the *product* doesn't exist before the reaction. I will endorse the Chemical Reaction but add the concept of "Attractor States" to handle the vagueness.

