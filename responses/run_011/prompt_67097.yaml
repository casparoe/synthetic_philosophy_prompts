      *   *Decision:* I will recommend **Height** as the primary human example because it's relatable, but use a **Plant/Corn analogy** on the whiteboard to explain the variance components without getting stuck on human complexity. No, keep it simple. **Height** is fine if framed correctly. Let's stick to **Height** for the human connection, but explain the *concept* using a "Box of Seeds" analogy.
      *   *Wait, re-reading the "One Example" constraint:* "which single example should carry the whole session." Okay. I'll recommend **Height**. It's the standard for a reason. It allows the PKU contrast later (Medical vs. Complex Trait).

  3.  **Addressing Specific Constraints & Questions:**
      *   **Variance:** Don't use the word "variance" until late. Use "differences" or "spread."
