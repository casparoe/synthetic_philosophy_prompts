      *   *Phase 6: Assessment (85-90 mins).* The diagnostic question.

  5.  **Refining the "Variance" Issue:**
      *   The user failed before because they got stuck on the word "variance."
      *   *Solution:* Call it "Variation" or "Differences." Write "Why are we different?" on the board. Break it down into "Luck/Environment" and "Lottery/Genes." Only introduce "Variance" as the technical term for "Spread of differences" in the last third of the session if at all.
      *   *Population Relativity:* This must happen *before* giving a number. If I say "Height is 80% heritable," they lock that in. I need to say "In *this* group, with *this* food..." first.

  6.  **Refining the "Group Differences" Issue:**
      *   This is the most dangerous point. If a trainee leaves thinking heritability explains why Group A reads better than Group B, the session failed.
      *   *Placement:* Needs to be after they understand what heritability *is* (Within-group), but before they leave.
      *   *Analogy:* The "Seed Bag" analogy is best here. Take a bag of seeds. Plant half in rich soil, half in poor soil. Heritability *within* the rich soil patch is high. Heritability *within* the poor soil patch is high. The *difference between* the patches is 100% environment.

  7.  **Refining the IQ Question:**
