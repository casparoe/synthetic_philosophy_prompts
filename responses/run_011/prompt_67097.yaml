answer: |-
  Here is a battle plan for your 90 minutes. It is designed to minimize jargon, maximize whiteboard visuals, and inoculate against the specific misconceptions you listed.

  ### 1. The Strategy: What to Cut and What to Keep

  **Cut Broad-Sense vs. Narrow-Sense Heritability.**
  Absolutely do not mention this. It is technical nuance that adds zero value to a teacher's ability to understand a pupil. It consumes 15 minutes of cognitive load for a distinction ($V_G$ vs. $V_A$) that does not change the pedagogical takeaway.

  **Cut IQ.**
  Comply with the programme lead. This is not cowardice; it is triage. IQ is a lightning rod that triggers ideological immune responses in humanities graduates. It will derail the session into a debate about testing bias rather than genetic concepts. The principles of heritability apply identically to reading, maths, or attention. Use **Height** as your carrying example. It is biologically complex, clearly environmental (nutrition), clearly genetic, and emotionally neutral compared to cognition.

  **The "Variance" Problem.**
  Do not use the word "variance" until hour 2. Use the word **"differences"**. Write "Why are we different?" on the board. Variance is a statistical measure of the spread of differences. If you start with the math term, you lose the arts students. If you start with the concept ("Why is John taller than Sarah?"), you keep them.

  ### 2. The Carrying Example: Height
  Use **Height**.
  *   **Why:** Everyone understands adults vary in height. Everyone accepts it's partly food (environment) and partly parents (genes). It avoids the "reading is cultural" debate while you are trying to teach the stats logic.
  *   **What it must contain:** It must be treated as a **distribution**, not a trait of an individual. You are explaining why the *group* varies, not why *John* is tall.
  *   **What it must leave out:** Do not discuss specific genes (e.g., HMGA2). Do not discuss specific environmental factors beyond "nutrition/illness." Keep it binary: Genes vs. Environment.

  ### 3. The Sequence (90 Minutes)

  #### Phase 1: The Setup & The Definition (0–15 mins)
  **Goal:** Establish that "Genes vs. Environment" is a false dichotomy and define the scope (Population, not Individual).

  *   **Whiteboard:** Draw a stick figure. Write "Why is this pupil like this?"
  *   **Action:** Ask the room: "Is it nature or nurture?" They will say "Both."
  *   **Pivot:** Tell them: "Science agrees. But as scientists, we need to measure *how much* of the **differences** between pupils is due to genes, so we know where to intervene."
  *   **Critical Move:** Write **POPULATION** in big letters. Underline it.
  *   **Script:** "Heritability is not about you. It is not about a single child. It is a number that describes a *group* of people in a *specific* place at a *specific* time. If you take it as a property of a person, everything I say for the next hour will be wrong."
  *   **Misconception Check:** Head off "Property of a person" here. If they ask "What is the heritability of my height?", the answer is "That question makes no sense."

  #### Phase 2: The Mechanics of "Differences" (15–45 mins)
  **Goal:** Explain $V_P = V_G + V_E$ without using those symbols yet.
  **Goal:** Land the **Population Relativity** point *before* showing a number.

  *   **Flip Chart 1 (The Formula):** Draw a pie chart labeled "Differences in Height". Slice it into two: "Genetic Differences" and "Environmental Differences".
  *   **The Thought Experiment (Relativity):**
      1.  **Scenario A:** Imagine a classroom where every child gets *exactly* the same nutrition, same sleep, same health care. Environment is identical.
          *   *Ask:* "If I measure their heights, why are they different?"
          *   *Answer:* "Genes."
          *   *Conclusion:* In this room, heritability is 100% (or near it).
      2.  **Scenario B:** Imagine a classroom where every child is a genetic clone (identical twins).
          *   *Ask:* "If I measure their heights, why are they different?"
          *   *Answer:* "Environment."
          *   *Conclusion:* In this room, heritability is 0%.
  *   **The Takeaway:** "The heritability number changes depending on the environment. If we make the environment more equal, heritability goes *up*. If we make the genes more equal, heritability goes *down*."
  *   **Why this order?** You have now explained that the number is relative to the context *before* you give them a specific number to latch onto.

  #### Phase 3: The Number & The Trap (45–60 mins)
  **Goal:** Introduce the scale (0 to 1) and kill the "60% of my height" myth.

  *   **Whiteboard:** Write "Height Heritability $\approx$ 0.8".
  *   **The Trap:** Ask the room: "Does this mean 80% of *your* height is genes and 20% is food?"
  *   **The Correction:** Use the **Legs Analogy**.
      *   *Script:* "If I measure the length of your legs, 100% of that length is bone and 100% of that length is growth. You can't separate the bone from the growth in a single leg. Heritability doesn't split the *person*; it splits the *reasons for the difference* between people."
  *   **Handout:** This is where your A4 sheet comes in. It should have the "Legs Analogy" diagram and the definition: *"Heritability = Proportion of **variation** in a **population** due to genetic **variation**."*

  #### Phase 4: Changeability & PKU (60–75 mins)
  **Goal:** Decouple "Heritable" from "Unfixable". Use PKU here.

  *   **The Misconception:** "If it's genetic, I can't teach it."
  *   **The Counter:** PKU (Phenylketonuria).
      *   *Explain:* It is 100% genetic. A single mutation.
      *   *The Fix:* Change the diet (remove phenylalanine). The cognitive impairment disappears.
      *   *The Lesson:* "Knowing something is genetic tells you the *mechanism*, not the *solution*. Sometimes the solution is environmental (diet), even if the cause is genetic."
  *   **Apply to Height:** Myopia (short-sightedness) is highly heritable. The fix is glasses (environmental intervention).
  *   **Apply to Teaching:** "If a reading difficulty has a genetic component, it does not mean you stop teaching. It might mean you teach *differently*."

  #### Phase 5: The Fatal Misconception (75–85 mins)
  **Goal:** Address Between-Group Differences. This is the most dangerous point.

  *   **The Setup:** "If heritability of height is 0.8 in Group A, and 0.8 in Group B, and Group A is taller than Group B... is that difference genetic?"
  *   **The Whiteboard Visual:** Draw two pots of soil.
      *   Pot 1: Rich soil. Plant random seeds. Plants grow tall.
      *   Pot 2: Poor soil. Plant random seeds (from same bag). Plants grow short.
      *   *Within Pot 1:* Differences are due to seeds (High Heritability).
      *   *Within Pot 2:* Differences are due to seeds (High Heritability).
      *   *Difference BETWEEN Pots:* 100% Soil (Environment).
  *   **The Rule:** "Heritability *within* a group tells you **nothing** about the difference *between* groups."
  *   **Why this is fatal:** If a trainee leaves thinking high heritability justifies group stereotypes, you have failed. State this explicitly. "You cannot use within-group heritability to explain between-group gaps."

  #### Phase 6: The Diagnostic Question (85–90 mins)
  **Goal:** Test understanding, not recall.

  *   **The Question:** "Imagine a school introduces a fantastic new reading programme. Every single child receives the exact same high-quality teaching, resources, and support. The *average* reading score goes up. What happens to the **heritability** of reading scores in that school?"
  *   **The Options:**
      *   A) It goes down (because environment is doing more).
      *   B) It stays the same (genes don't change).
      *   C) It goes up (because environmental differences have been removed).
  *   **The Correct Answer:** **C**.
  *   **Why it works:**
      *   If they choose **A**, they think Heritability = "Genetic Determinism" (the more environment helps, the less genes matter).
      *   If they choose **B**, they think Heritability is a fixed property of the trait (like eye colour).
      *   If they choose **C**, they understand that Heritability is a ratio of variance ($V_G / V_P$). If $V_E$ drops to near zero, $V_G$ becomes the only source of remaining difference, so the proportion attributable to genes rises.
  *   **Instruction:** Ask them to vote with hands. If most get it wrong, you know exactly which misconception survived.

  ### 4. The Handout (One Side A4)
  Do not fill this with text. It is a reference sheet for when they are in staff rooms arguing.
  1.  **Definition:** "Heritability is the proportion of **differences** between people in a **specific group** that can be attributed to genetic **differences**."
  2.  **The Three Rules:**
      *   It applies to populations, not individuals. (0.8 heritability $\neq$ 80% of *your* trait).
      *   It is specific to the environment. (Change the environment, change the heritability).
      *   It explains within-group differences, not between-group differences.
  3.  **The PKU Principle:** "Genetic does not mean unchangeable."
  4.  **The Diagram:** The Two Pots of Soil (from Phase 5).

  ### 5. Summary of Misconception Timing
  *   **"Heritable means unfixable":** Addressed in Phase 4 (PKU).
  *   **"Property of a person":** Addressed in Phase 1 (Population definition).
  *   **"60% of my height":** Addressed in Phase 3 (Legs Analogy).
  *   **"Group Differences":** Addressed in Phase 5 (Two Pots). **This is the fatal one.** If this is still alive at minute 89, the session has failed ethically. Spend the extra time here if needed.

  ### 6. Final Advice on Delivery
  *   **Stand near the board.** When you say "Population," point to the word. When you say "Individual," cross it out.
  *   **Don't apologize for the complexity.** These are graduates. They can handle the logic if you strip the jargon.
  *   **The "Variance" Word:** If you must write it, write "Variance (Spread of Differences)".
  *   **The IQ Ban:** Do not fret. By using Height and Reading, you teach them the tool. They can apply the tool to IQ later if they wish, but you haven't handed them a loaded gun in the session.

  Good luck. You are teaching them how to think, not what to think. That is the best genetics lesson a teacher can receive.
