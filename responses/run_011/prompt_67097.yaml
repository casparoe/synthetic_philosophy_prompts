      *   **IQ:** The lead said no. **Do not bring it in.** It's not cowardly; it's risk management. IQ brings baggage that will derail a 90-minute intro session. The principles apply without the baggage.
      *   **Broad vs. Narrow Sense:** **Cut it.** Absolutely no business in a 90-minute session for non-scientists. It adds zero value to their teaching practice and adds confusion.
      *   **Closing Question:** Needs to test application, not recall.

  4.  **Drafting the Sequence (The "Order of Operations"):**
      *   *Phase 1: The Hook & The Definition (0-15 mins).* Why are we here? The "Genes vs. Environment" war is false. Define the scope: Populations, not individuals.
      *   *Phase 2: The Mechanics (15-45 mins).* The "Variance" problem. Use "Differences." Use the Height example. Show $V_P = V_G + V_E$. Do not use math symbols yet. Use flip charts.
      *   *Phase 3: The Number & The Trap (45-60 mins).* Introduce $h^2$. Explain what it is (population statistic) and what it isn't (individual destiny). Address the "60% of my height" myth here.
