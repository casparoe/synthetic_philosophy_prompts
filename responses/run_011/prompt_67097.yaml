      *   *Why:* If environment becomes more uniform (better teaching for all), $V_E$ drops, so $h^2$ ($V_G/V_P$) actually goes *up*. This tests if they understand the ratio nature and population specificity.
      *   *Alternative:* "If we fix the environment, do genes matter less?" (Wrong).
      *   *Selected Question:* The "Uniform Environment" scenario. It tests the core mathematical intuition without math.

