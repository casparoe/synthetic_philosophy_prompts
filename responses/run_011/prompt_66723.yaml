answer: |-
  ### (a) Brainstorming Failures

  Here are the points where the argument risks failure, ranked by explanatory power:

  1.  **Step (5): Equivocation on "Real Kind".** This step assumes that only "natural kinds" (structures independent of us) are "real kinds". This is a category mistake. It conflates *ontological independence* with *ontological reality*. A thing can be mind-dependent yet objectively exist (like a promise or a border). This diagnosis does the most work: it blocks the slide from "constructed" to "fiction".
  2.  **Step (7): Causal Exclusion.** This premise claims attitude-dependent facts cannot make a difference. This ignores *supervenience*. If social facts supervene on physical facts plus attitudes, and attitudes cause things, social facts can be cited in explanations without violating physical closure. Rejecting this saves explanatory practice directly.
  3.  **Step (4): Modal Scope.** The move from "settled by attitudes" to "no fact holds independently" is too strong. Once the attitudes exist, the fact (e.g., "this is money") holds objectively, even if it wouldn't hold *counterfactually* without the attitudes. It confuses *genesis* with *status*.
  4.  **Step (9): Overgeneralization.** This lumps "institutional facts" (money) with "functional artifacts" (hammers). A hammer's function depends on physics, not just convention. A note's value depends entirely on convention. Treating them identically forces the absurd conclusion that chairs are fictions.
  5.  **Step (10): Self-Reference.** This assumes the argument itself is a mere classificatory practice subject to its own conclusion. But metaphysical claims *about* practices are distinct from moves *within* practices.

  ### (b) Commitment

  I reject **Step (5)**.

  **Why it looked innocent:** It relies on the intuitive metaphor of "carving nature at its joints." We naturally feel that if we impose a category rather than find it, we are projecting rather than discovering. It feels like "real" must mean "there anyway."

  **The Workings:** The term "real" is doing the heavy lifting. The argument assumes a monistic ontology where reality is exhausted by mind-independent physical structure. By rejecting (5), you adopt a stratified ontology: there are brute physical facts (atoms) and institutional facts (money). Both are real, but they exist in different ways. Money is not a fiction; it is an *institutional object*. Its reality consists in its status within a system of rules, not in its polymer composition. Rejecting (5) allows you to keep (2) and (3) (they are constructed) and keep explanatory practice (they are real enough to cause things), without denying the dependence on attitudes.

  ### (c) Pricing the Alternatives

  *   **Giving up (4):** You would have to claim attitude-dependent facts hold independently of attitudes. This is contradictory. You cannot say "Money exists only if we believe it does" and "Money exists even if we don't believe it does." This cost is logical incoherence.
  *   **Giving up (7):** You would admit that fictions can genuinely explain. This is instrumentalism. It saves explanatory practice but costs you ontological commitment. You would have to say, "Bank runs are caused by a fiction." This feels like a dodge. It relocates the difficulty: if the fiction explains, in what sense is it *not* real? Usually, explanatory power is our best test for reality.
  *   **Giving up (5):** You accept that mind-dependent entities are real. The cost is metaphysical complexity. You must explain how something can be "objectively subjective" (objective within the system, subjective in origin). This is the cheapest cost. It is cheap in a way you should trust because it matches our lived experience: borders stop armies, even if they are lines on a map.

  Regarding your suspicion about **(7)**: The idea that classification changes what it classifies (looping effects) does not rescue (7) as stated; it reinforces the rejection of (5). If classification changes the world, then the classification is tracking a real causal mechanism. If (7) says "only mind-independent kinds explain," then looping kinds (like race) would be excluded despite having causal power. Thus, (7) must be modified to "Only real kinds explain," and we must argue constructed kinds are real.

  ### (d) The Self-Defeat of (10)

  This is **not a genuine self-defeat**.

  Step (10) claims that because premises (1)-(9) are about classificatory practices, they are not truth-apt (by step 8). This confuses the *object language* (claims using the kinds, e.g., "This is money") with the *meta-language* (claims about the kinds, e.g., "Money is constructed").

  Even if social kinds are not truth-apt in the way natural kinds are, a theory *describing* that status can be true. Consider a rule in chess: "The bishop moves diagonally." This is only true relative to the game. But the claim "In chess, the bishop moves diagonally" is a true statement about the game, regardless of whether you are playing. The argument is a claim *about* the game of social ontology, not a move *within* it. It does not collapse.

  ### (e) The Absurdity of (9)

  Step (9) does **not follow**. It bundles distinct ontological categories.

  1.  **Institutional Facts:** Money, contracts, borders. These exist only because of collective acceptance (constitutive rules).
  2.  **Functional Artifacts:** Hammers, chairs. These rely on physical affordances. A hammer works on a lifeless planet because of mass and hardness, not convention. Its *name* is conventional, its *function* is physical.
  3.  **Interactive Kinds:** Race, mental illness. These are classifications that people react to, changing the classified.

  **Distinction:** The hammer survives the withdrawal of attitudes because its causal power is brute physical. Money does not.
  **Survival:** Hammers and chairs survive as real physical objects with assigned functions. Money and borders survive as real institutional objects. Race is the hardest case: if it is purely interactive, it is real only as long as the interaction persists. The argument fails by treating functional affordances (hammers) as identical to status functions (money).

  ### (f) Repairing the Argument

  The strongest version of your friend's point survives if we soften the conclusion. It should not be eliminativism ("Money is not real"), but **ontological fragility**.

  **Repaired Argument:**
  1.  Social kinds depend on collective attitudes for their existence.
  2.  Therefore, their existence is contingent on those attitudes persisting.
  3.  Therefore, social kinds are ontologically fragile in a way natural kinds are not.
  4.  **Conclusion:** We cannot treat social kinds as immutable features of the world. Explanations citing them are valid, but they are historically contingent explanations, not eternal laws.

  This preserves the insight (social reality is mutable) without the absurdity (social reality is fake).

  ### (g) Available Positions

  1.  **Institutional Realism (Searle):** Institutional facts are mind-dependent but ontologically objective.
      *   *Cost:* Must explain how "counting as" creates causal power.
      *   *Hammer Reply:* Hammers have brute power; money has deontic power (rights/obligations). Both are real powers.
  2.  **Explanatory Realism (Hacking):** A kind is real if it figures in successful explanations.
      *   *Cost:* Might include useful fictions.
      *   *Hammer Reply:* Both explain, so both are real. The dependence on attitudes is irrelevant to reality.
  3.  **Pragmatism/Conceptual Engineering:** Don't ask "Is it real?" Ask "Is this concept useful for our goals?"
      *   *Cost:* Loses metaphysical grip. Cannot say the world *forces* the concept on us.
      *   *Hammer Reply:* Irrelevant. If the concept works, use it.
  4.  **Eliminativism:** Social kinds do not exist; only individuals and atoms exist.
      *   *Cost:* Cannot explain bank runs or wars without cumbersome reduction.
      *   *Hammer Reply:* Consistent, but implausible. Denies the reality of the social world we inhabit.

  ### (h) Reconstruction Check

  Your reconstruction is strong, but **Step (8)** is mis-stated.
  *   **Your version:** "Sentences about money... are not truth-apt... at most they record practices."
  *   **Probable Intent:** "Sentences about money are not truth-apt *in the same way* as sentences about atoms."
  Your friend likely means they lack *mind-independent* truth conditions, not that they lack truth conditions entirely. "This is legal tender" is true or false relative to the legal system. Restating this weakens Step (10), as the argument itself claims to be true relative to the standards of metaphysical inquiry, not relative to the legal system.

  ### (i) Evaluating Premises (2) and (3)

  *   **Premise (2) (Money):** True as stated. Money is a paradigmatic institutional fact.
  *   **Premise (3) (Race):** This is the vulnerable point. It asserts "no attitude-independent answer."
      *   **Critique:** There are attitude-independent *phenotypic* differences (skin color, hair texture). The *classification* of these differences into "races" is attitude-dependent.
      *   **Correction:** Premise (3) should read: "Racial *classification* is socially constructed. While bodily differences exist, their grouping into races is settled by attitudes."
      *   **Implication:** If your friend insists on (3) as written, they deny the biological basis entirely, which is empirically false. If they accept the correction, the argument holds for the *category* of race, even if the *basis* is partially physical. This nuance matters: it means race is a hybrid kind, not purely institutional like money. This makes eliminativism about race even less plausible than about money, because there is a physical anchor, however loose.

  **Final Verdict:** Your instinct is correct. The argument proves too much by conflating ontological dependence with ontological unreality. You can keep the reality of money and race without denying their construction, provided you expand your metaphysics to include social facts as a genuine layer of reality.
