answer: |-
  1. A cybersecurity director at a regional utility firm detects an ambiguous network anomaly suggesting an imminent state-sponsored attack but lacks conclusive proof before a critical deadline. Facing a forced choice between launching a preemptive counter-strike that will disrupt regional internet traffic or waiting for confirmation and risking grid failure, she believes the threat is real and authorizes the strike. The belief proves true—the attack was real and was neutralized, saving the grid—but the counter-strike caused significant financial loss to unrelated small businesses relying on the disrupted regional servers.

  2. The option is living because she values security, forced because inaction risks failure, and momentous due to the unique stakes of critical infrastructure. Since the evidence is ambiguous, the decision is intellectually undecidable, satisfying James's criteria for a rightful leap of faith.

  3. Clifford wins because she authorized an action imposing severe costs on non-consenting third parties based on insufficient evidence, violating her duty of care regardless of the lucky outcome. The wrong lies in the epistemic negligence toward bystanders, not in the falsity of the belief.

  4. The non-consenting third parties are doing the work, as their harm validates Clifford's claim that belief ethics are social rather than individual. If the costs fell solely on the utility firm, James's pragmatic justification would likely override Clifford's evidentialism.

  5. A Jamesian might argue that catastrophic stakes lower the evidential threshold required for action, making the belief reasonable ex ante. However, this fails to rescue the case because Clifford's principle forbids imposing unverified risks on others regardless of the potential magnitude of the good.
