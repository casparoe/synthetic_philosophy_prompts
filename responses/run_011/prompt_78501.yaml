answer: |-
  The key turned in the ignition with a dry click, then nothing. Elena sat for a moment, hands at ten and two on the cold plastic steering wheel, listening to the silence of the engine block. It was 6:15 AM. The sky was the color of wet slate. She got out, kicked the tire once uselessly, and started walking. It was three miles to the hospital. By the time she clocked in, her arches would be burning, a familiar, low-grade fire that lasted until she collapsed into bed twelve hours later.

  The ward smelled of bleach and overcooked carrots. Elena swapped her street clothes for scrubs the color of dried sage. She checked the board. Bed 2 was new. Bed 4 was stable. Bed 6 was actively dying.

  She started with Bed 2. Mr. Henderson. He was staring at the ceiling, mouth slightly open. She checked his vitals, adjusted the IV drip. As she leaned over to check the cannula site, a smell hit her: paraffin and orange peel. Sharp, waxy, citrus. It was so vivid she nearly sneezed. She pulled back, looking around the sterile room. Nothing. Just the antiseptic wipe dispenser.

  Later, in the break room, she mentioned it to Sarah, the charge nurse. "Henderson's room. Smells like oranges."

  Sarah didn't look up from her phone. "Daughter was in yesterday. She brings him segments. Peels them at the bedside."

  "Right," Elena said. She ate her sandwich standing up over the sink. The bread was stale. She washed it down with lukewarm water from the tap. It was explainable. She had walked past the room yesterday; she must have heard the daughter. The memory of the smell had just lodged itself wrong, like a file saved in the wrong folder.

  But then there was Bed 6. Mrs. Gable.

  Elena was turning Mrs. Gable to prevent sores. The woman was unconscious, breathing in wet, ragged pulls. As Elena lifted the shoulder, a sentence formed in her head. Not her voice. A man's voice, rough, speaking in a dialect she didn't recognize. *The latch sticks if you don't lift it first.*

  She froze. Her hands were still on the patient's gown.

  "Everything okay?" Sarah asked from the doorway.

  "Fine," Elena said. "Just thought I heard something."

  She went to the chart. No visitors listed for weeks. No notes about home maintenance. She asked the porters during lunch. They shrugged. Maybe she'd heard a TV in the hall. Maybe she was tired. She had saved up her annual leave for eighteen months. HR had sent an email about that last week. *Accrual caps.* They suggested she take a week. They suggested she complete the module on *Resilience in High-Stakes Environments*. It was a twenty-minute slideshow with cartoon avatars. She clicked through it during her break, eating a granula bar over the keyboard.

  That night, she met her brother, David, for dinner. He was a physicist. He worked in a lab somewhere outside the city, doing things with particles she didn't understand. He ordered the steak. She ordered soup.

  "I think I'm losing it," she said. She told him about the smell. The sentence. The feeling of waking up and not knowing which body she was in for the first three seconds.

  David cut his meat. He didn't look surprised. He rarely looked surprised. "You're sleep-deprived," he said.

  "It's not fatigue. It's… location. I know things about them. Inside things."

  "Memory is associative," David said. "You hear a word, your brain fills in the rest. You smell orange, you conjure the peel. It's pattern completion."

  "The sentence was in a dialect I don't know, David."

  He chewed, swallowed. "You know how electrons work?"

  " vaguely."

  "Take two electrons in an atom. People think they're like little beads. One here, one there. You can label them. Electron A, Electron B." He wiped his mouth with a napkin. "They aren't. They're indistinguishable. If you swap them, nothing changes. Not even a little bit. There's no fact of the matter about which one is which. You can't count them. Not really."

  "So?"

  "So you're asking 'how many minds are there?' Like you're counting beads. One for you, one for Mrs. Gable. But maybe 'how many' isn't a question that fits. Maybe it's like the electrons. There isn't a number. There's just… the stuff. The experiencing. It doesn't come in packets."

  Elena stirred her soup. "That sounds like poetry."

  "It's math," David said. "If you assume there are separate boxes, you have to explain how information gets between them. Telepathy. Magic. If you assume there aren't boxes, there's no transfer. There's just… where the data is stored. The brain is the hard drive. The experience is the current. The current doesn't care about the hard drive."

  "It feels like haunting," Elena said.

  "It feels like that because you're trying to count," David said. He signaled for the check. "Take the week off, El."

  She didn't take the week off. She went back to the ward. The institution's response had been kind, which made it worse. The occupational health referral wasn't an accusation. It was a concern. *We care about your wellbeing.* It implied the problem was her stability, not the reality of the ward. They offered her a counseling voucher. They offered her a flexible roster. They treated her like a broken machine that needed recalibration, not a witness.

  The untraceable thing happened on a Tuesday. Bed 4. Mr. Rossi.

  He was in pain. Not the screaming kind, but the deep, bone-eating kind that makes people stare at the wall and forget to blink. Elena prepped the morphine. As she snapped the ampoule, she knew, with absolute certainty, that the staircase in his childhood house turned left at the top. She knew the third step was loose. She knew the wood was pine, not oak.

  She checked the chart. No family contacts. He had been found by neighbors. She checked the admission notes. No personal effects listed except a wallet and a watch. She asked the neighbors when they came to collect his mail. They looked at her strangely. "We never went inside," the woman said. "Just called the ambulance."

  Elena stood in the corridor afterwards. The fluorescent lights hummed. If it was empathy, it was too specific. If it was telepathy, the physics didn't work. If it was David's electron theory, it didn't matter. If there were no boxes, then Mr. Rossi's pain was her pain, was everyone's pain, just localized to a specific nerve cluster. But the localization felt real. Her feet hurt. Mr. Rossi's hips hurt. They were not the same hurt.

  She went to the medication room. She had to sign for the controlled drugs. The pen was heavy, black plastic. She wrote her name. *E. Vance.*

  Bed 4 was calling. The bell was soft, a gentle chime, but it cut through the noise of the nurses' station.

  She walked into the room. Mr. Rossi was sweating. His eyes were open, but they weren't seeing her. They were seeing something far away, something behind the wall.

  "Mr. Rossi," she said. "I'm going to give you something for the pain."

  He didn't nod. He didn't speak. He just breathed, a shallow rattle.

  Elena held the syringe. The dose was standard. It would slow his breathing. It would take the edge off the fear. It might hasten the end by a few hours, or a few days. The protocol was clear: treat the pain. The outcome was secondary.

  She looked at his hand. It was resting on the sheet, fingers curled slightly. She had the sudden, violent urge to know what he was seeing. If David was right, if the counting was wrong, then she wasn't looking at another person. She was looking at a place where the light was hitting a mirror. If she injected the morphine, was she soothing herself? Was she silencing a part of the whole?

  Or was she just a nurse in a room with a dying man, and the rest was noise?

  If there was only one experience, then his suffering was hers. To stop it was self-preservation. To let it continue was self-harm.
  If there were eight billion separate experiences, then his suffering was his. To stop it was mercy. To let it continue was neglect.
  If there were no countable experiences, then the question was broken. The morphine was just chemistry. The pain was just signal.

  She looked at his face. It was grey. The lines around his mouth were deep. She thought about the staircase. The loose step. The left turn. It didn't matter. It changed nothing about the syringe in her hand. It changed nothing about the protocol on the clipboard. It changed nothing about the fact that he was hurting and she had the drug to stop it.

  The horror wasn't that they were all one. The horror wasn't that they were all separate.
  The horror was that it didn't matter.
  The relief was that it didn't matter.

  She swabbed the port on the IV line. The alcohol smell was sharp, cutting through the scent of decay. She pushed the plunger. The clear liquid disappeared into the tube. She watched the level in the chamber drop.

  Mr. Rossi exhaled. A long, slow release of air. His shoulders dropped an inch. The tension in his jaw softened. He didn't wake up. He didn't thank her. He just stopped fighting the air.

  Elena withdrew the needle. She capped it and dropped it into the yellow sharps bin. The plastic clicked against the other waste.

  She picked up the chart. She needed to record the time and the dose. She needed to sign her name again.

  She walked to the desk. The computer screen was bright. She logged in. Her password was the same one she'd used for three years. She navigated to the MAR. She found the row for Morphine Sulfate. She typed the dose. She typed the time.

  The cursor blinked in the signature box.

  She looked at her hand. It was steady. It was the same hand that had turned the key in the car this morning. The same hand that had held the sandwich over the sink. It was just a hand.

  She clicked the mouse. The screen updated. The row turned green.

  On the desk, next to the keyboard, lay a stack of discharge summaries. The top one had a paperclip bent out of shape. Elena reached out and straightened the wire. She pushed the metal until it was flush against the paper. She let go. The paperclip held.

  She picked up the pen again. She capped it. The click was loud in the quiet room. She put the pen in the holder, next to the stapler and the box of tissues. She turned off the monitor. The screen went black, reflecting her own face, superimposed over the dark ward behind her.

  She stood up. Her feet hurt. She walked to Bed 5. The bell was ringing there now.
