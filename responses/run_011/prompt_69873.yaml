answer: |-
  ### The Dialectic Sketch

  1.  **Ranke (Thesis):** The past contains inherent spiritual ideas (*Ideen*). The historian's job is self-effacement (*Selbstauslöschung*) to intuit these ideas directly from sources. "How it really happened" means revealing the divine tendency in the particular, not imposing a philosophical system.
  2.  **Carr (Antithesis 1):** Facts don't speak; historians speak. Selecting facts implies a hierarchy of importance. That hierarchy comes from the historian's present context, not the past itself. Ranke's "God" is just unconscious bias.
  3.  **White (Antithesis 2):** It's deeper than bias. It's language. To make the past intelligible is to employ it (tragedy, comedy, etc.). This structure is poetic, not empirical. Ranke's "objectivity" is a literary style (realism), not an epistemological achievement.
  4.  **Resolution:** Carr attacks a positivist caricature of Ranke but hits the problem of selection. White attacks the possibility of Rankean epistemology entirely. Ranke survives only as an ethical imperative, not a methodological guarantee.

  ***

  ### The Considered Version

  You are right to suspect you have the wrong end of the stick. To be blunt: your reading of Ranke is the Anglophone caricature that Carr and White themselves often rely upon, but it does not hold up if you look at the German metaphysical context Ranke was actually working in.

  If you teach your students that Ranke wanted "no interpretation, no general claims," you are teaching them the Ranke of the 1900s methodology handbooks, not the Ranke of 1824.

  Here is the unpicking you need for the seminar.

  #### 1. The Rankean Misunderstanding
  Ranke did not believe facts spoke for themselves in a vacuum. He was not a positivist. He was an Idealist who broke with Hegel. Hegel believed the philosopher could deduce the movement of the Spirit *a priori*. Ranke believed the Spirit (*Geist*) was embodied in the archival particular, and the historian could intuit it *a posteriori*.

  When Ranke says "how it really happened" (*wie es eigentlich gewesen*), he is not saying "list the brute data." He is saying: "Penetrate the surface of events to reveal the dominant spiritual tendency (*leitende Idee*) of that epoch." He absolutely believed in generalization. He believed every epoch is "immediate to God." That is a massive metaphysical generalization. He banned *subjective* moralizing and *deductive* philosophy of history, but he insisted on finding the *objective* idea inherent in the material.

  **So, are Carr and White kicking a strawman?**
  Partially, yes. They attack "Rankeanism" (the disciplinary norm that developed later) more than Ranke himself.
  *   **Carr** attacks the idea that facts are sacred and prior to interpretation. Against the *caricature* of Ranke, Carr wins easily. Against the *real* Ranke, the fight is closer, because Ranke admits interpretation is needed to find the "idea." However, Carr wins on the point of **selection**. Ranke claims he selects facts based on their inherent importance. Carr argues "importance" is always conferred by the historian's present-day vantage point. Ranke thinks he is serving the past; Carr says he is inevitably serving the present.
  *   **White** is more devastating. White doesn't care about Ranke's metaphysics. White cares about the **grammar** of history. Even if Ranke finds a "spiritual idea" in the archive, he must write it down to communicate it. As soon as he writes it, he turns it into a story.

  #### 2. The Whitean Trap: Emplotment
  You asked if any version of the Rankean programme survives White. This is the crux of your seminar.

  White's argument in *Metahistory* is that there is no neutral language for describing the past. To narrate is to employ. If I tell you the French Revolution was a "tragedy," I have imposed a literary form on the evidence. If I tell it as a "romance" of liberation, I have imposed a different form. The evidence does not contain "plots." Plots are in our culture, not in the archive.

  Ranke's claim is that the form of the history should emerge from the content. White says the form is always pre-loaded by the linguistic choices available to the historian.

  **Does this finish Ranke off?**
  Epistemologically? Yes. If White is right, Ranke's claim to show "how it really happened" is impossible, because "how it really happened" includes the *experience* of the events, which is inaccessible, and the *structure* of the narrative, which is imposed by the writer. Ranke's "objectivity" is exposed as a specific literary style: 19th-century Realism. He writes like a realist novelist and calls it science.

  **However, here is where you find the resistance for your students.**
  There is a version of Ranke that survives White, but it requires a retreat from **truth** to **ethics**.

  If we accept White's argument that we cannot escape emplotment, Ranke's injunction becomes not a description of what we *can* achieve, but a regulation of what we *ought* to attempt.
  1.  **The Ethical Turn:** Ranke's "self-effacement" is an ethical stance toward the otherness of the past. It is a demand that we try to listen to the past on its own terms, even if we know our language will inevitably distort it. It is a guard against presentism. White leaves us with the historian as a poet creating meaning; Ranke leaves us with the historian as a priest serving memory.
  2.  **The Constraint of Evidence:** White is sometimes accused of linguistic idealism (that nothing exists outside the text). A Rankean correction is that while we impose *form*, we do not impose *content*. The archive resists. You can emplot the French Revolution as a Comedy, but you cannot emplot it as a story where Napoleon wins at Waterloo, because the documents forbid it. Ranke survives as the guardian of the "brute constraint" of the archive, even if the "story" built upon it is constructed.

  #### 3. How to Frame This for Third-Years
  Do not present this as "Ranke vs. White." Present it as a shift in the locus of authority.

  *   **Ranke:** Authority lies in the **Object** (the past/archives). The historian is a transparent medium.
  *   **Carr:** Authority lies in the **Subject** (the historian/society). The facts are raw material shaped by the present.
  *   **White:** Authority lies in the **Language** (the discourse/tropes). Both the object and the subject are mediated by the poetic structures of language.

  **The Verdict for your Seminar:**
  1.  **Correct your premise:** Tell your students Ranke wasn't banning meaning; he was banning *subjective* meaning in favor of *inherent* divine meaning. This makes him a harder target for Carr, but not immune.
  2.  **On Carr:** Carr is right that "selection" betrays objectivity, but he underestimates the discipline the archive imposes on the historian.
  3.  **On White:** White destroys the Rankean claim to *scientific* objectivity. You cannot prove your narrative structure is the "true" one inherent in the past.
  4.  **The Survival:** Ranke survives not as a method for finding Truth, but as an ethic of responsibility. We know we cannot achieve *wie es eigentlich gewesen*, but we are obligated to act *as if* we can, to prevent history from becoming mere propaganda or fiction.

  If you teach it that way, you avoid the strawman, you acknowledge White's linguistic turn, but you don't leave your students with the nihilistic conclusion that "everything is just a story." The archive bites back, and Ranke is the name for respecting that bite.
