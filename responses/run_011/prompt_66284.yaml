answer: |-
  You have stumbled onto a known problem in population ethics, sometimes called the **"Repugnant Conclusion for Lives"** or the problem of **Intra-personal Aggregation**. Your friend is pressing a very standard utilitarian objection: that there is no metaphysical difference between "moments in a life" and "lives in a population."

  However, your friend is wrong. You *can* consistently accept the Repugnant Conclusion (RC) while rejecting the Mia Result. To do so, you must give up **(3) Extend**, but you do not have to give up (1) Add.

  Here is the breakdown of why your friend's isomorphism argument fails, which premise to drop, and the philosophical price you pay.

  ### 1. Which step to give up?
  You should reject **(3) Extend**.

  Premise (3) claims that *any* stretch of positive experience makes a life better, regardless of duration, context, or diminishing returns. This is the engine of the Mia Result. If you deny that adding $10^{30}$ years of "barely worth continuing" experience improves the value of Mia's life (all things considered), the Mia Result collapses.

  Crucially, rejecting (3) does **not** logically force you to reject (1) or (2). Your derivation of the Repugnant Conclusion relies on (1) and (2). Your derivation of the Mia Result relies on (3). You can cut the engine of the Mia Result without disabling the engine of the RC.

  ### 2. Why your friend is wrong
  Your friend argues: *"The only difference between the two cases is where the parts sit, inside one subject or spread across many, and (1) already grants that where they sit doesn't matter."*

  This assumes a specific metaphysics: **Reductionism**. It assumes a person is just a container for experiences, no different in kind from a population being a container for persons. If value is just "welfare stuff," then boundaries (skin or time) shouldn't matter.

  But you can reject this without abandoning the RC. You can argue that **Personal Identity** creates normative constraints that **Numerical Identity** does not.

  *   **Across Persons (1 & 2):** When we add a new person, we are creating a new *locus of value*. A life that is barely worth living is still a distinct, valuable existence. Total Utilitarianism (which yields the RC) says the sum of these distinct loci matters.
  *   **Across Time (3):** When we extend a life, we are not creating a new locus; we are altering the *narrative structure* of an existing one. A life is not just a sum of moments; it is a gestalt. Adding infinite drab years might degrade the value of the whole life (boredom, loss of dignity, narrative collapse), even if every individual moment is technically positive.

  Therefore, "where the parts sit" *does* matter. Sitting across persons allows for simple aggregation. Sitting across time within a single subject invites constraints on shape, completion, and diminishing marginal value of duration.

  ### 3. How to block (3) without blocking (1)
  To make this stick, you need a theory of well-being that distinguishes between *momentary welfare* and *life welfare*.

  **Option A: Diminishing Marginal Value of Duration**
  You can argue that the value of additional life years diminishes to zero (or negative) much faster than the value of additional people.
  *   **For Mia:** The 100th year of "barely positive" life might add 0 value to her *life as a whole* because it contributes to stagnation.
  *   **For Population:** The 100th billionth person, living that same "barely positive" life, adds positive value because they are a *new* story, not a repetition of an old one.
  *   **Cost:** You must defend why time discounts but persons don't. (Argument: Persons are distinct ends; time is a medium for a single end).

  **Option B: The Narrative View**
  You can argue that a life's value depends on its shape (e.g., a peak-end rule or narrative unity).
  *   **For Mia:** Appending an eternity of mediocrity ruins the narrative shape of her 80 great years. The whole becomes worse, even if the parts are positive.
  *   **For Population:** A population has no "narrative shape" in the same way. It is a collection, not a story. Therefore, (1) remains safe from narrative objections.
  *   **Cost:** You must accept that "better all things considered" is not always additive.

  **Option C: Prudential Discounting**
  You can argue that rational prudence involves discounting the far future.
  *   **For Mia:** Welfare 1,000 years from now counts for less *for Mia* than welfare today. An infinite tail of low welfare sums to a finite (and beatable) amount.
  *   **For Population:** Discounting usually applies to time, not to distinct contemporaries. Adding a person today isn't "later" than the existing people in a way that triggers discounting.
  *   **Cost:** You have to defend time-discounting in ethics, which is controversial but standard in economics.

  ### 4. What do you pay for this solution?
  You pay the cost of **Theoretical Complexity**.

  Pure Total Utilitarianism is elegant because it treats time and persons identically (Summation). By rejecting (3) but keeping (1), you are adopting a hybrid view: **Total Utilitarianism across persons, but Perfectionism (or Sufficientarianism) within persons.**

  You have to argue that:
  1.  **Impersonal Value** (the good) is additive across persons. (This gets you the RC).
  2.  **Prudential Value** (the good-for) is *not* additive across time. (This saves Mia).

  This is a defensible position. Many philosophers hold that while we should maximize the sum of good lives, we are not required (or permitted) to maximize the sum of moments within a life if it violates the integrity of the subject.

  ### Summary
  *   **Give Up:** Premise (3) Extend.
  *   **Keep:** Premises (1) Add and (2) Trade (and thus the Repugnant Conclusion).
  *   **Rebuttal to Friend:** The boundary of a person is morally significant in a way that the boundary of a year is not. We value *new lives* (1) differently than we value *more life* (3). One creates new value-loci; the other risks diluting existing ones.
  *   **The Cost:** You must defend a non-additive theory of well-being over time while maintaining an additive theory of value across persons.

  You can bite the bullet on Z > A without choking on Mia's eternity. The two conclusions are not logically glued together; they are only glued together by the assumption of Pure Summation, which you are now justified in rejecting for intra-personal cases.
