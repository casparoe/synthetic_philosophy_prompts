  2.  **Deconstruct Nietzsche's Framework (*UM II*):**
      *   **Three Modes:** Monumental, Antiquarian, Critical.
      *   **Purpose:** History must serve *life* (*das Leben*). If it doesn't, it becomes harmful.
      *   **Monumental:** Focus on great deeds/figures to inspire action. *Pathology:* Distortion, ignoring context, making the past look too easy or repeatable, freezing dynamic processes into static statues.
      *   **Antiquarian:** Focus on preservation, detail, reverence for origins. *Pathology:* Mummification, inability to judge what is alive vs. dead, hoarding trivia, stifling new growth.
      *   **Critical:** Judging and condemning the past to break its chain. *Pathology:* Rootlessness, injustice (since we are products of the past), creating a void.
      *   **Key Terminology:** *Historie* (academic/history writing) vs. *Geschichte* (happening/history itself). This is a known point of contention in scholarship.

  3.  **Map the Science Writing Conflict to Nietzsche:**
      *   **Camp A (Narrative/Discoverer-Centered):** This aligns with *Monumental* history. They want heroes to inspire the public ("achievement as possible").
