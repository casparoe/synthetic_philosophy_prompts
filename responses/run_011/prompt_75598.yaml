      *   **The "Debunking" Impulse:** This aligns with *Critical* history. Breaking the idol, showing the flaws.

  4.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the writer's goal. Set the stage with Nietzsche's core thesis (history for life).

      *   **Monumental vs. Antiquarian (The Two Camps):**
