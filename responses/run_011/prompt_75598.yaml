          *   *Pathology:* The "Statue" problem. It lies by omission. It suggests genius is a lightning bolt rather than a grind. It creates false analogies (Newton vs. modern physicist). It makes science look like a series of miracles rather than a human endeavor.
          *   *Camp B (Antiquarian):* Focus on the "Archive." The slow grind.
          *   *Pathology:* The "Museum" problem. Paralysis by detail. Loss of the "why." If everything is preserved, nothing is prioritized. It can stifle the public's ability to see the *point* of the science. It risks turning history into stamp collecting.

      *   **The Critical Mode (The Debunking):**
          *   *Is it Critical?* Yes. It judges and condemns (e.g., Millikan's oil drop experiment).
          *   *Nietzsche's Objection:* The critic stands on the ground created by the past. Can you condemn the foundation you stand on?
          *   *Application to Science:* Does this hold? Yes. Modern science *is* the product of those "flawed" measurements. To condemn Millikan is to condemn the method that built current physics. However, unlike national history, science has a truth-tracking mechanism (eventually). But the *sociology* of science is still inherited. The "worry" gains traction: The debunker uses current standards (products of history) to judge past actors.

      *   **Scholarly Contention (The "Settled" vs. "Contested"):**
