answer: |-
  - **Materials and room layout**
  Arrange 24 desks in a 6x4 grid. Each student requires a 'Strategy Card' (labeled 'Always Defect' or 'Tit-for-Tat'), a score sheet, and a pen. You need a hat containing 24 numbered slips for random pairing in Phases 1 and 2. Prepare a whiteboard column for 'Generation Scores'. For Phase 3, the grid structure is fixed; students pair only with immediate left and right neighbours (wrapping row ends to maintain two partners per student). Ensure aisles allow you to move quickly to verify compliance. No digital devices are permitted; all accounting is manual. The room should feel slightly crowded to emphasise the constraint of neighbours.

  - **The engine**
  Students embody strategies mechanically. 'Always Defect' (AllD) plays 'Defect' every round. 'Tit-for-Tat' (TFT) plays 'Cooperate' in round 1, then copies the partner's previous move. Encounters last 8 rounds. Payoffs are T=5, R=3, P=1, S=0. Each generation, students play two partners. In Phases 1 and 2, partners are random (draw numbers from the hat). In Phase 3, partners are fixed grid neighbours. Students record scores per encounter and sum them.

  Reproduction simplifies proportional selection to meet the four-minute bookkeeping constraint. Instead of calculating exact offspring proportions, use a **Rank Cutoff**. Students announce scores; you rank them 1–24 on the board. The top 12 students ('Parents') keep their seats and strategy. The bottom 12 ('Offspring') vacate their seats. Parents write their strategy name on a slip of paper and pass it to a vacated seat. The receiving student adopts that strategy for the next generation.

  *Sacrifice:* This sacrifices granular selection pressure. A high-scoring Parent does not produce more offspring than a marginal Parent; they simply survive. This preserves the *direction* of evolution (who wins) without simulating the precise *rate* of growth. It ensures the activity remains within the time limit while demonstrating fitness differences.

  - **Run sheet**
  **00–10:** Introduction. Distribute Strategy Cards. Phase 1: Seed 12 TFT, 12 AllD randomly. Explain rules.
  **10–25:** Phase 1, Gen 1. Random pairing (hat). Play 8 rounds vs 2 partners. Tally scores.
  **25–30:** Reproduction. Rank scores. Top 12 replicate to bottom 12. Record new population count.
  **30–35:** Phase 2 Setup. Reset to 1 TFT, 23 AllD (place TFT isolated). Explain this tests rarity.
  **35–50:** Phase 2, Gen 1. Random pairing. Play and tally.
  **50–55:** Reproduction. Rank and replicate. Likely outcome: TFT eliminated.
  **55–60:** Phase 3 Setup. Reset to 2 TFTs adjacent (cluster), 22 AllD. Explain neighbour rule (Left/Right only).
  **60–70:** Phase 3, Gen 1. Spatial pairing. Play and tally.
  **70–75:** Reproduction. Rank and replicate. Likely outcome: TFT cluster expands. Immediate transition to debrief.

  *Timing Note:* Strict timekeeping is essential. Warn students at the 5-minute mark of each playing phase. If scoring lags, collect sheets and calculate ranks verbally while they reset desks.

  - **The seeding arithmetic**
  With 8 rounds and 2 partners, the invasion threshold for TFT in a well-mixed population is derived from expected payoffs. TFT vs TFT yields 24 points; AllD vs AllD yields 8. TFT vs AllD yields 7 for TFT and 12 for AllD. Let $p$ be the proportion of TFT. TFT grows when $3[24p + 7(1-p)] > 3[12p + 8(1-p)]$. Solving this yields $p > 1/13$, or approximately 7.7%. In a class of 24, this threshold is 1.84 students.

  Therefore, **1 student** (4%) is below the threshold and will likely die out (Phase 2). **2 students** (8.3%) are theoretically above the threshold, but stochastic variance in a small sample often kills them unless clustered. For Phase 3 to succeed visibly, place 2 TFTs adjacently; their mutual cooperation yields 24 points each, outscoring neighbouring AllDs (20 points), allowing local spread despite global rarity.

  If you shorten encounters to **5 rounds**, the shadow of the future shrinks. TFT vs AllD drops to 3 points (1 round sucker, 4 mutual defection). The threshold shifts to $p > 2/9$ (22.2%). In 24 seats, you would need **6 students** to sustain cooperation. This demonstrates how shorter time horizons drastically raise the barrier for reciprocity to gain a foothold.

  - **The mutation question**
  Introduce a rule where refilled seats have probability *p* of adopting a mutated strategy (e.g., TFT becomes AllC or AllD). Mutation does not solve the bootstrapping problem; it merely converts a deterministic threshold into a probabilistic drift. It allows a single mutant to appear, but without structural protection or sufficient frequency, it remains vulnerable to immediate elimination by selection.

  Regarding stability, mutation actively erodes the cooperative equilibrium. Once TFT is common, mutation introduces Defectors into the cluster. In a well-mixed population, this eventually collapses cooperation. In the spatial phase, mutation creates holes in the defensive cluster, allowing AllD to penetrate. It shows that without perfect fidelity, cooperation requires continuous structural reinforcement, not just a one-time establishment.

  - **Debrief**
  Do not lecture. Ask three sequential questions to draw the distinction from them.

  1.  *"In Phase 1, TFT won. In Phase 2, it died. The strategy was identical. What changed?"*
      *   Target answer: Frequency. It was common then, rare now.
      *   Concept: **Stability** (resistance to invasion when common) vs **Invasibility** (ability to grow when rare).

  2.  *"In Phase 2, rare TFT died. In Phase 3, rare TFT grew. The frequency was similarly low. What changed?"*
      *   Target answer: Who they met. In Phase 3, they met each other.
      *   Concept: **Population Structure**. Interaction rules matter as much as payoffs.

  3.  *"Does this mean cooperation is 'better'?"*
      *   Target answer: No, it depends on the context.
      *   Concept: **Contextual Fitness**. There is no universally superior strategy, only strategies superior relative to frequency and structure.

  Conclude by writing on the board: "Can it grow when rare?" and "Can it survive when common?" Confirm these are distinct questions that evolutionary dynamics often conflate.

  - **What will go wrong**
  **Cheating:** Students may play the 'wrong' move to help a friend or win. *Fix:* Emphasise they are robots executing code, not agents. Spot-check pairs during play.
  **Arithmetic Errors:** Summing 16 rounds manually invites mistakes. *Fix:* Provide a tally sheet with boxes for each round. Ask neighbours to cross-verify scores before submission.
  **Phase 3 Confusion:** Edge students may not know who their neighbours are. *Fix:* Draw the grid on the board with arrows indicating wrap-around pairing before starting.
  **Pacing:** Reproduction may overrun 4 minutes. *Fix:* If late, skip the physical slip exchange. Simply announce: "Bottom 12 adopt the strategy of the Top 12," and assign them manually.
  **Stochastic Failure:** In Phase 2, the single TFT might luckily meet the few other cooperators and survive. *Fix:* If this happens, highlight it as 'luck' vs 'pressure', but proceed to Phase 3 to show structural certainty.

  - **What the activity cannot reproduce**
  This model sacrifices **opportunity cost**. In Phase 3, the cooperative cluster survives, but those students are isolated from the rest of the room. In reality, cooperators in a cluster miss out on potential high-value interactions with outsiders (if they were defectors). The activity shows them surviving, but implies a prosperity that ignores the limited connectivity. You must supply this point verbally: spatial structure protects cooperators, but also confines them. Additionally, the discrete generations ignore **overlapping lifetimes**, where reputation builds continuously rather than resetting every 15 minutes. The 'Rank Cutoff' reproduction also removes the nuance of marginal fitness differences; in nature, a 1% advantage matters, whereas here, only being in the top half counts.
