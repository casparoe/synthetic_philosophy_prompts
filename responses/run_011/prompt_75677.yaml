      *   Actually, better: Use **2 seats** for both. In Phase 2, place them far apart. In a small population (24), stochastic death is likely even if expected value is positive. Or I rely on the Rank Cutoff simplification. If TFT scores are high but only 2 students have them, they might not make the Top 12 if AllD scores are consistent.
      *   Let's check scores again.
      *   2 TFTs, 22 AllD.
      *   TFT Score (avg): 25.25.
      *   AllD Score (avg): 25.0.
      *   Variance is high. One TFT might get paired with AllD both times (Score 14). One AllD might get paired with AllD both times (Score 16).
      *   So TFTs can easily fall into bottom 12 by luck.
      *   Okay, I will specify **2 students** for both phases. Phase 2: Separated. Phase 3: Adjacent. The risk of stochastic death in Phase 2 makes the "watch it die" outcome likely enough for a demo.

      *Wait, one more check:* 8 Rounds, 2 Partners.
      *   TFT vs AllD = 7 pts.
      *   AllD vs AllD = 8 pts.
      *   If a TFT plays 2 AllDs, score = 14.
      *   If an AllD plays 2 AllDs, score = 16.
      *   So a lone TFT will definitely score lower than surrounding AllDs.
      *   In Phase 2 (Well-mixed), a TFT is likely to meet AllDs.
      *   In Phase 3 (Spatial), adjacent TFTs meet each other.
