prompt: |-
  We're running a workshop where a condenced matter physicist, a systems biologist and a computational social scientist each insist their target phenomenon is genuinely emergent, and I got stuck with writing the rubric we adjudicate with. Before I write it I want the spec: what any account of emergence has to deliver to be usable in that room.

  Give me the requirements — the cases it has to handle (including one where the macro law is derivable in principle but the derivation is about as long as just running the system, and one where a macro property is underivable only because the macro variable was gerrymandered), the distinctions it must not collapse, the results from physics and biology it can't contradict — with the motivating consideration behind each one. Then tell me which requirements are actually non-negotiable and which are camp preferences: my hunch is that "must exhibit multiple realizability" and "must license downward causation" are both the latter, but argue it, dont just assume it.

  Most of all: is any subset jointly unsatisfiable? I want to know whether novelty, causal efficacy, nothing-over-and-above-ness, and causal closure at the micro level can all be held at once, and if not which one has to go and what you lose by dropping it.

  End with five lines scoring Nagelian reduction, the Anderson more-is-different line, grounding-based accounts, and Wilson-style accounts that make emergence out to be ontological independence from a base you're nonetheless metaphysically dependent on. Five lines, not a treatise.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A workshop with a condensed matter physicist, a systems biologist, and a computational social scientist arguing about emergence.
      *   **Task:** Define the *specification* for a rubric to adjudicate their claims.
      *   **Key Deliverables:**
          1.  Requirements (cases to handle, distinctions to keep, scientific results to respect) with motivations.
          2.  Classification of requirements into "Non-negotiable" vs. "Camp Preferences" (specifically addressing multiple realizability and downward causation).
          3.  Consistency Check: Are Novelty, Causal Efficacy, Nothing-Over-And-Above-ness, and Micro Causal Closure jointly satisfiable? If not, what goes and what is lost?
          4.  Scoring: Five lines each for Nagelian reduction, Anderson's "More is Different," Grounding-based accounts, and Wilson-style ontological independence accounts.
      *   **Tone:** Philosophical precision, practical applicability, argumentative (don't just assume), concise (especially the ending).

  2.  **Deconstruct the Requirements (The Spec):**
      *   *Goal:* A rubric usable by three distinct scientific cultures.
      *   *Case 1 (Derivable but Intractable):* Needs to handle "weak emergence" (e.g., cellular automata, turbulence). The macro law exists but deriving it is computationally equivalent to simulation.
      *   *Case 2 (Gerrymandered Macro):* Needs to filter out fake emergence (e.g., "grue"-like predicates or arbitrary sums).
      *   *Distinctions:* Epistemic vs. Ontological, Synchronic vs. Diachronic.
      *   *Scientific Constraints:* Renormalization Group (physics), Robustness/Canalization (biology), Supervenience (general).
      *   *Motivation:* Each requirement needs a "why" tied to the workshop context.

  3.  **Analyze Non-Negotiable vs. Camp Preferences:**
      *   *Multiple Realizability (MR):* Physicists often care about universality classes (MR), biologists about robustness (MR), social scientists about institutional independence (MR). *However*, is it *necessary* for emergence? Some emergent properties might be unique to specific micro-constitutions. *Verdict:* Camp Preference (strongly correlated, but not definitional).
      *   *Downward Causation (DC):* Physicists often reject this (micro closure). Biologists/Social Scientists need it for explanation (feedback loops). *Verdict:* Camp Preference (depends on whether you mean *causal* influence or *explanatory* relevance).
      *   *Non-Negotiables:* Micro-supervenience (nothing over and above), Novelty (not trivially reducible), Robustness (not gerrymandered).

  4.  **Analyze the Consistency Check (The Hard Problem):**
      *   *The Tetrad:*
          1.  Novelty (Macro is new/different).
          2.  Causal Efficacy (Macro does stuff).
          3.  Nothing-Over-And-Above (NOAA) (Macro is constituted by Micro).
          4.  Micro Causal Closure (Micro determines Micro).
      *   *Conflict:* If Micro is closed and Macro is NOAA, Macro causation looks epiphenomenal. If Macro has efficacy, does it violate Micro closure?
      *   *Resolution:* Compatibilism (Non-reductive physicalism) vs. Incompatibilism.
      *   *Argument:* They *can* be held together if "Causal Efficacy" is understood as *realization-sensitive* or if "Micro Closure" allows for *overdetermination* or *constitutive* causation. However, strict distinctness + efficacy + closure usually forces epiphenomenalism.
      *   *Decision:* The tension is real. To keep all four, you need a specific metaphysics of realization (e.g., subset of powers). If you drop one:
          *   Drop Novelty -> Reductionism.
          *   Drop Efficacy -> Epiphenomenalism.
          *   Drop NOAA -> Dualism/Substance Emergence.
          *   Drop Closure -> Vitalism/Quantum Mind (usually scientifically unacceptable).
      *   *Best path for the workshop:* Keep Closure and NOAA, reinterpret Efficacy as "higher-level explanation of causal pathways" rather than "new forces."

  5.  **Drafting the Scoring (5 lines each):**
      *   *Nagel:* Derivability is key. Fails the intractable case. Good for physics, bad for bio/social.
