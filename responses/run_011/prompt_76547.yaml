      *   *Grounding:* Metaphysical dependence without reduction. Solves NOAA vs. Novelty. Can be too abstract for scientists.
      *   *Wilson:* Ontological independence despite dependence. Risks dualism. Social scientists love it, physicists hate it.

  6.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Check:* Did I address the "gerrymandered" case? Yes, need a robustness/stability requirement.
      *   *Check:* Did I argue about MR and DC? Yes, need to explain *why* they are preferences (e.g., DC violates closure for physicists).
