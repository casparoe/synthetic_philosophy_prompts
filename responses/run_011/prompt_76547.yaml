answer: |-
  ### The Spec: Requirements for an Adjudication Rubric

  To function in a room with a physicist, a biologist, and a social scientist, the rubric must satisfy four structural requirements. Each includes the motivating consideration.

  **1. Micro-Compatibility (The Supervenience Constraint)**
  *   **Requirement:** The macro phenomenon must not violate the laws governing the micro-constituents. There can be no "magic" addition of energy or information at the macro level that isn't accounted for microscopically.
  *   **Motivation:** The condensed matter physicist will walk out if the rubric permits violation of conservation laws or quantum mechanics. This ensures *nothing-over-and-above-ness*.

  **2. Robustness (The Anti-Gerrymandering Constraint)**
  *   **Requirement:** The macro property must persist under perturbations of the micro-details. If changing a few micro-variables destroys the macro property, it is not emergent; it is a fragile aggregate or a gerrymandered predicate (e.g., "the state where particle #42 is spin-up").
  *   **Motivation:** This filters out the "gerrymandered macro" case. It satisfies the biologist's need for *canalization* (phenotypes robust to genetic noise) and the social scientist's need for *institutional stability* (markets persist despite trader turnover).

  **3. Derivational Intractability Tolerance (The Weak Emergence Clause)**
  *   **Requirement:** The rubric must classify a phenomenon as emergent even if the macro-law is derivable from micro-laws *in principle*, provided the derivation is computationally intractable (i.e., simulation is the only shortcut).
  *   **Motivation:** This handles the "derivable but long" case (e.g., turbulence, cellular automata). If you require strict underviability, you exclude most of physics' own success stories (renormalization) and all of computational social science.

  **4. Explanatory Autonomy (The Utility Constraint)**
  *   **Requirement:** The macro-description must license predictions or interventions that are opaque or inefficient at the micro-level.
  *   **Motivation:** This justifies the existence of the three disciplines. If the micro-description is always superior, the workshop is a waste of time. The biologist needs to talk about *fitness* without tracking atoms; the social scientist needs *norms* without tracking neurons.

  ***

  ### Non-Negotiables vs. Camp Preferences

  You asked to distinguish the hard constraints from the tribal markers. Here is the breakdown.

  **Non-Negotiable:** *Micro-Compatibility* and *Robustness*.
  Without Micro-Compatibility, you have dualism, which contradicts standard physics. Without Robustness, you cannot distinguish emergence from arbitrary description, which contradicts biological and social methodology. These are the floor.

  **Camp Preference:** *Multiple Realizability (MR)*.
  *Argument:* You suspected this is a preference; you are correct. While MR is central to the social scientist (institutions realized by different people) and the biologist (functions realized by different genes), the condensed matter physicist often deals with *universality classes* where the micro-details *don't* matter, which looks like MR, but they also study specific phase transitions where the micro-constitution is fixed. If you make MR a requirement, you exclude specific, one-off emergent events (e.g., a specific historical crisis or a unique material defect). MR is a common *feature* of emergence, not a *condition*.

  **Camp Preference:** *Downward Causation (DC)*.
  *Argument:* This is the flashpoint. The biologist and social scientist *need* DC to explain feedback (the cell regulates the gene; the law constrains the citizen). The physicist *rejects* DC because it threatens Micro Causal Closure (if the macro pushes the micro, where does the energy come from?).
  *Resolution:* The rubric must treat DC as **explanatory**, not **ontological**. If "downward causation" means "macro-variables constrain the space of micro-trajectories," everyone can agree. If it means "macro-forces override micro-laws," the physicist vetoes it. Therefore, strong ontological DC is a camp preference (Bio/Soc want it, Phys rejects it); functional DC is a Non-Negotiable requirement for explanatory utility.

  ***

  ### The Consistency Check: The Tetrad of Tension

  You asked if **Novelty**, **Causal Efficacy**, **Nothing-Over-And-Above-ness (NOAA)**, and **Micro Causal Closure** can be held simultaneously.

  **The Verdict:** They are jointly unsatisfiable under a strict "production" view of causation, but satisfiable under a "constraint/realization" view.

  **The Conflict:** This is Kim's Exclusion Problem. If the micro-level is causally closed (every micro-event has a sufficient micro-cause) and the macro is nothing-over-and-above the micro (NOAA), then the macro has no work to do. If the macro has efficacy (does new work), it either violates Closure (adding new energy) or violates NOAA (being a separate substance).

  **The Solution:** To hold all four, you must drop the notion that causation is a "push" and adopt the view that causation is **counterfactual dependence** or **constraint**.
  *   **Novelty:** The macro pattern is new (not present in parts).
  *   **NOAA:** The pattern is constituted entirely by the parts.
  *   **Closure:** The parts obey physical laws.
  *   **Efficacy:** The macro pattern *selects* which micro-laws are relevant. (e.g., The peg's squareness [macro] causes it not to fit the hole, regardless of its color [micro]).

  **What goes if you can't sustain this?**
  If you cannot maintain the "constraint" view, **Causal Efficacy** is the first to go. You retain Closure and NOAA, but the macro becomes **epiphenomenal** (a shadow cast by the micro). This satisfies the physicist but renders biology and social science merely heuristic, not explanatory.
  If you refuse Epiphenomenalism, you must drop **NOAA**. You get **Strong Emergence** (ontological independence). This satisfies the social scientist/biologist's intuition of power but forces the physicist to accept new fundamental laws or dualism.

  **Recommendation for the Rubric:** Insist on the "Constraint" interpretation. It allows all four to stand, provided "Efficacy" is defined as *difference-making* rather than *energy-transfer*.

  ***

  ### Account Scoring

  **Nagelian Reduction**
  Nagel requires bridge laws linking macro predicates to micro theories. It fails the intractable derivation case, ruling out most complex systems. It satisfies micro-closure perfectly but eliminates genuine novelty. Biologists and social scientists will find it too restrictive for their phenomena. It defines emergence purely as failed reduction, not positive ontology.

  **Anderson's "More is Different"**
  Anderson focuses on symmetry breaking and universality classes in many-body systems. It handles the intractable case via renormalization group flows. It respects micro-closure but treats novelty as structural rather than ontological. Biology fits via robustness, but social science lacks clear symmetry parameters. It is the physicist's default, prioritizing mathematical stability.

  **Grounding-Based Accounts**
  Grounding posits a non-causal determination relation between micro and macro levels. It preserves nothing-over-and-above-ness while allowing distinct macro properties. It avoids epiphenomenalism by treating causation as level-relative. However, it offers little operational guidance for empirical adjudication. It is metaphysically robust but scientifically opaque for the workshop.

  **Wilson-Style Ontological Independence**
  Wilson treats emergence as ontological independence despite metaphysical dependence. It saves causal efficacy by granting macros distinct powers. Physicists will reject the ontological commitment as dualist-adjacent. Social scientists gain explanatory autonomy but lose micro-foundation security. It solves the exclusion problem by denying the base completes the causal work.

  **The Constraint/Realization Compromise**
  This view treats macro-properties as subsets of micro-powers that become active only in specific configurations. It keeps micro-closure and NOAA intact while granting real efficacy to macros. It handles the intractable case by focusing on organizational constraints rather than derivation. It is the most likely to satisfy all three disciplines without metaphysical excess. It requires careful definition of "power" to avoid sliding into dualism.
