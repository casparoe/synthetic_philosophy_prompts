      2.  The Rule (Ecological Rationality/Net Outcome).
      3.  Alternative Rules analysis.
      4.  Imaginary 5th Vote.
      5.  Memo Recommendation & Quiet Principle.
      6.  Vulnerabilities/Flip Conditions.

      *Let's polish the "Rule" naming.* "Ecological Rationality" is the academic term (Gigerenzer). "Net Systemic Benefit" is more plain English. I'll use a blend.

      *Let's polish the "Memo".* It needs to be diplomatic. "Irrational" is a strong word. Maybe "Requires Redesign."

      *Let's check the "Fine-with-conditions" option.* If they vote Fine-with-conditions, the condition is "add triage." That effectively makes it a redesign. So "Irrational" is the cleaner classification for "needs redesign."

      *Final check on the "Caseworker" vote.* "Reads summary... unless something looks off." This is a *heuristic*. The Child Welfare unit is doing *exhaustive analysis*. The panel liked the heuristic. They disliked the exhaustive analysis in Housing (overkill). They will likely dislike exhaustive analysis here too.

