answer: |-
  ### PART 1: THE EXAM QUESTION

  **Take-Home Final: The Ethics of Commitment**
  **Time Limit:** 48 Hours
  **Word Limit:** 1,600 words maximum
  **Value:** 25 Marks

  **The Scenario**
  You know the beat: the zone where a lab result or a leaked document turns into a policy fight. Imagine you are a reporter. You give a source an absolute, unqualified promise of confidentiality. No name, no description, nothing that could identify them, ever. In exchange, they hand over material documenting serious wrongdoing by a candidate for high office. Before you can publish, the source dies suddenly. The material is useless without attribution, but attributing it identifies the source's estate or family, violating the spirit of the pledge. There is no editor to overrule you, no court order, and no professional code that settles the specific case of a deceased promisee. The family doesn't know the promise exists.

  **The Question**
  Are you still bound by the promise? If so, bound to whom? And what would it take to get out of it?

  Answer this by applying the four frameworks we covered: the Humean convention view, the Rawlsian practice view, the Scanlonian expectation view, and the Bipolar Obligation view. Do not merely list their verdicts. Your essay must explain *why* the verdicts differ based on where each theory locates the binding force of the promise.

  **The Wrinkle**
  Address this second beat: Suppose you could break the promise in a way that no living person would ever detect. You could publish the story, the source's identity would never be uncovered, and no trust in the practice of journalism would be eroded. Does this change the verdict for any of the four views? Use this wrinkle to demonstrate what each theory thinks an obligation *is*.

  ***

  ### PART 2: MODEL ANSWER (Full Marks Example)

  **The Location of the Bind**

  The central tension in this case is not whether breaking the promise yields good consequences—it clearly does, by exposing wrongdoing—but whether the obligation survives the death of the person to whom it was owed. The four frameworks disagree on this because they locate the binding force of a promise in different places: in social utility, in constitutive rules, in individual expectations, or in a normative relationship between persons.

  For Hume, promising is an artificial virtue designed to serve social utility. The obligation exists only because the convention supports trust necessary for cooperation. If the source is dead, they no longer participate in the convention. However, Hume would likely argue the reporter remains bound, not to the dead source, but to the stability of the convention itself. If reporters break promises when sources die, the practice weakens. The Rawlsian view sharpens this: the obligation is defined by the rules of the practice of "promising." Unless the practice includes an exception clause for "death of promisee," the reporter is bound by the constitutive rules. For both Hume and Rawls, the obligation is largely free-floating; it is about maintaining a system.

  Scanlon shifts the location to the specific interaction. By invoking the Principle F, the reporter intentionally created an expectation in the source that they would not be named. The wrong is the manipulation of that expectation. Here, the death of the source complicates things. The source no longer holds the expectation. However, Scanlon focuses on the act of creating the expectation at time *T*. The wrong was done when the promise was made if the reporter intends to break it. The obligation is tethered to the specific history of that interaction, not just the general practice.

  The Bipolar view offers the distinctest insight. It argues obligations are owed *to* specific individuals, giving them a form of authority or standing. This creates a problem of standing upon death. If the obligation is a normative bond between two agents, does the right to release the promise die with the source? If the obligation is truly bipolar, the family likely lacks the standing to release the reporter, as the right was personal to the source. Conversely, if the right vanishes, the reporter is free, not because the duty dissolved, but because the claimant no longer exists.

  The "undetectable breach" wrinkle reveals the deepest fault lines. If the breach is truly undetectable, the Humean and Rawlsian views might permit it. If the convention or practice suffers no harm because no one knows, the utility or rule-integrity remains intact. For them, the obligation is instrumental to the practice. If the practice isn't damaged, the duty weakens.

  However, for Scanlon and the Bipolar view, undetectability should not matter. For Scanlon, the wrong is the betrayal of the specific trust manufactured, regardless of public knowledge. The reporter knows they exploited the expectation. For the Bipolar theorist, the violation is of the source's authority over the reporter's actions. Violating that authority is a wrong against the source's status, even if they are dead and even if no one else knows. The undetectable breach test proves that for Hume and Rawls, the obligation is external and systemic, while for Scanlon and the Bipolar view, it is internal and relational.

  Ultimately, the reporter is most clearly bound under the Bipolar and Scanlonian views, because those theories bind the agent to the specific history of the relationship, not just the health of the journalism industry. The Humean and Rawlsian reporter might be free if they can prove the practice survives the breach. The Bipolar reporter is bound because the right to control that information belonged to the source, and rights of that nature do not simply evaporate or transfer to the public interest without a specific mechanism of release.

  ***

  ### PART 3: MARKING SCHEME (25 Marks)

  **1. Theoretical Application & Accuracy (10 Marks)**
  *   **A Range (8-10):** Accurately distinguishes the four views without needing citations. Correctly identifies Hume/Rawls as practice/convention-based and Scanlon/Bipolar as interaction/relationship-based.
  *   **B Range (5-7):** Correctly summarizes the four views but treats them as a menu of verdicts (e.g., "Hume says yes, Rawls says no") without explaining the *mechanism* of the obligation.
  *   **C Range (0-4):** Significant misrepresentation of theories (e.g., claiming Hume believes promises are natural duties).

  **2. The "Undetectable Breach" Analysis (5 Marks)**
  *   **A Range (5):** Uses the wrinkle to test the *nature* of the obligation. Correctly identifies that practice-based views (Hume/Rawls) might allow undetectable breaches (no harm to system), while relational views (Scanlon/Bipolar) would not (harm to the specific bond/trust remains).
  *   **B Range (3-4):** Addresses the wrinkle but treats it only as a question of "getting caught," missing the philosophical implication for where the duty lives.
  *   **C Range (0-2):** Ignores the wrinkle or treats it as irrelevant to all theories.

  **3. Analysis of Standing & Location (5 Marks)**
  *   **A Range (5):** Explicitly discusses who has the standing to release the promise (the source, the family, the public). Connects this to the Bipolar view (rights held by individuals) vs. Practice views (rules held by community).
  *   **B Range (3-4):** Mentions the family but fails to connect their lack of knowledge to the theoretical standing required to release a bipolar obligation.
  *   **C Range (0-2):** Assumes the family automatically inherits the right to release without theoretical justification.

  **4. Argument & Clarity (5 Marks)**
  *   **A Range (5):** Essay flows logically. The thesis is clear (theories disagree on the *location* of the bind). No wasted words.
  *   **B Range (3-4):** Competent writing but structured as a list ("First Hume, then Rawls...").
  *   **C Range (0-2):** Disorganized or exceeds word limit significantly.

  ***

  ### PART 4: INSTRUCTOR NOTES (Common Pitfalls)

  **The "Social Value" Slide**
  *   **The Mistake:** Students argue that because source confidentiality is socially valuable (Hume/Rawls), the reporter *owes it to the dead source* to maintain it.
  *   **The Penalty:** Deduct 3-5 marks from Section 1. This conflates a general duty to society with a specific obligation to a person. The Humean owes the duty to the *convention*, not the corpse.

  **The "Bipolar = Scanlon" Conflation**
  *   **The Mistake:** Treating the Bipolar Obligation view as merely a restatement of Scanlon's Principle F.
  *   **The Penalty:** Deduct 3 marks from Section 1. Scanlon focuses on the *wrongness of the act* (exploiting expectation). Bipolar focuses on the *status of the parties* (one has a claim against the other). The distinction matters for the "standing" question (who can release the promise).

  **The "Death Dissolves All" Assumption**
  *   **The Mistake:** Assuming all theories must agree that death ends the obligation because the promisee can no longer feel betrayed.
  *   **The Penalty:** Deduct 3 marks from Section 2. This ignores the Rawlsian/Humean focus on the practice surviving the participants, and the Bipolar focus on rights that might persist or vanish distinct from feelings.

  **The "A" Differentiator**
  *   **Look For:** The student who realizes the "Undetectable Breach" is a litmus test for whether the obligation is about *harm* (consequential/practice) or *integrity/status* (deontological/relational). If they catch that Hume/Rawls might permit a secret breach while Scanlon/Bipolar would not, they have understood the architecture of the course.
