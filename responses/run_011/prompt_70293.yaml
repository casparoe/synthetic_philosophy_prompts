      *(Wait, one more thought)*: The prompt asks about "Education parents own" vs "Attendance/Custody matter" vs "Interest-group patchwork." I need to explicitly address these three options in the reconstruction. I will synthesize them into a "Dual-Track Sovereignty" model.

      *Let's finalize the "Bet Against".* I will bet against the idea that the state believes "learning is just the story we tell." The state *does* care about learning, but it treats the *home* as a black box it is philosophically barred from opening, whereas the *school* is a glass box it manages.

