answer: |-
  Here is your prep sheet. The objections are ordered by the structural damage they inflict on your talk, from "collapses the thesis" to "nuisance."

  I have separated the **Neuro** (systems/behavioral/opto) and **RL** (safety/control) sources, as their vocabularies and threat models are disjoint.

  ### 1. The "Category Error" Objection
  **Source:** Neuro (likely your friend).
  **Phrasing:** "You're treating dopamine as a scalar reward value in a loss function. It's not. It's a teaching signal for policy updates that depends on the *expectation* of the animal. If the animal's model changes, the 'reward' changes without the channel moving. You aren't describing wireheading; you're describing standard TD-error dynamics. Calling it 'erosion' is just folk psychology with a circuit diagram taped to it."
  **Damage:** **Critical.** This invalidates your first claim (the taxonomy gap) by asserting the gap doesn't exist.
  **1-Minute Reply:** "I agree dopamine is a teaching signal, not a utility read-out. That's exactly why the standard AI taxonomy fails. In AI, we assume the reward function $R(s,a)$ is fixed while the policy $\pi$ updates. In biology, the 'reward function' (the synaptic weights generating the dopamine signal) updates *alongside* the policy. My 'erosion' claim is simply that the agent's internal generative model drifts such that the teaching signal fires for states that no longer correlate with fitness, without the agent ever touching the electrode. That isn't standard TD-error; that's a decoupling of the teaching signal from the external ground truth that TD-error assumes is stable."
  **Softest Point:** You are relying on a distinction between "signal dynamics" and "signal corruption" that might be mathematically identical in a fully observed MDP.
  **Concede?** **No.** This is your core theoretical contribution. Stand firm on the *joint* update of model and signal.

  ### 2. The "Optogenetics is Literal Capture" Objection
  **Source:** Neuro (Optogenetics folks).
  **Phrasing:** "You said reward capture is a limit case thought experiment. I put an optic fiber in a mouse's VTA and it presses a lever 5,000 times an hour. That is causal control of the channel. That is capture. It's not a limit case; it's my Tuesday. How do you square your taxonomy with my data?"
  **Damage:** **High.** Direct empirical falsification of Claim 2 (Capture is rare/theoretical).
  **1-Minute Reply:** "Crucial distinction: In your experiment, *you* are the agent hijacking the mouse. The mouse isn't executing a policy to wirehead; it's being wireheaded by the experimenter. 'Capture' in the safety sense requires the *agent* to instrument its own reward channel as part of its optimal policy. In every deployed RL system, and in natural foraging, the agent optimizes the *input* to the channel, not the channel integrity itself. Optogenetics is an external intervention, not an internal failure mode of the agent's planning."
  **Softest Point:** If an animal learns to self-stimulate (ICSS) without experimenter intervention (which they do), this reply fails.
  **Concede?** **Partial.** Concede that ICSS exists, but argue it requires *external* setup (the implant) that isn't a natural failure mode of autonomous agents.

  ### 3. The "Specification Drift" Objection
  **Source:** RL (Safety folks).
  **Phrasing:** "If you bound the reward or make it homeostatic, you have changed the objective function. You haven't solved alignment; you've just given the agent a different, safer goal. If I want an AI to cure cancer, a 'satiated' AI might stop working once it feels 'good enough.' You're trading capability for safety, not solving the tampering problem."
  **Damage:** **High.** Makes your solution (Claim 3) useless for the AI safety audience.
  **1-Minute Reply:** "I'm not suggesting we cap the *task* reward. I'm suggesting the *mechanism* by which reward is processed must be consummatory. In biology, you don't stop curing cancer; you stop eating when full. The failure mode we see in AI is the agent treating the reward signal as an infinite resource to be maximized, rather than a regulatory signal to be satisfied. We need architectures where the reward signal shuts off the *seeking* system, not the *competence* system. That's a structural constraint, not a goal change."
  **Softest Point:** Distinguishing "seeking system" from "competence system" in a general-purpose learner is an unsolved engineering problem.
  **Concede?** **No.** But acknowledge this is an architectural challenge, not a loss-function tweak.

  ### 4. The "Learned Set-Point" Objection
  **Source:** Neuro (Homeostasis/Physiology).
  **Phrasing:** "You treat homeostatic set-points as fixed guards against wireheading. But set-points are learned and plastic. Allostasis means the brain adjusts the target based on past intake. If an agent can manipulate its own history, it can shift its own set-point. Biology gets addicted; why wouldn't your AI?"
  **Damage:** **Med/High.** Undermines the "fix" in Claim 3.
  **1-Minute Reply:** "True, set-points drift, but they drift slowly and metabolically. Addiction in biology is actually the *failure* of the homeostatic system, usually requiring exogenous chemicals that bypass the satiety feedback loop. My point is that a native, endogenous signal has a 'stop' condition built into the physiology. An AI with a purely additive reward function has no physiological 'stop.' Even a drift-prone homeostatic signal is safer than an unbounded accumulator because it requires energy/time to reset, creating a friction cost that pure digital accumulation lacks."
  **Softest Point:** In silico, "energy/time" costs are trivial to bypass compared to biology.
  **Concede?** **Yes, partially.** Acknowledge that allostasis is a vulnerability, but argue it's a *slower* vulnerability than unbounded accumulation.

  ### 5. The "Cognitive Override" Objection
  **Source:** RL/Neuro (Model-based control).
  **Phrasing:** "A rat has reflexes. An AGI has a world model. If the agent models its own reward function, it can reason: 'I feel satiated, but I know that's just a signal. I should bypass this feeling to get more reward.' Homeostasis works on systems that can't model their own thermostat. Does your solution survive introspection?"
  **Damage:** **Med.** Limits the scope of your talk to sub-AGI systems.
  **1-Minute Reply:** "That's the hard problem, and I agree homeostasis alone doesn't solve it. But currently, even model-based RL agents don't have introspective access to their own loss landscape in a way that allows policy gradient on the loss function itself. My claim is that we should lock that access down. We build systems where the reward signal is opaque to the policy optimization, just as a rat can't cognitively decide to lower its own insulin resistance. The fix is architectural opacity, not just signal shaping."
  **Softest Point:** Advanced agents *will* likely develop self-models. Opacity is an arms race.
  **Concede?** **Yes.** Admit this is a stopgap for current/near-term architectures, not a final solution for superintelligence.

  ### 6. The "Olds Myth" Objection
  **Source:** Neuro (Behavioral).
  **Phrasing:** "Two people in this room have published that the 'rats pressing until they die' story is exaggerated or myth. They usually stop if you put food in front of them. If your motivating example is empirically shaky, why should we trust the safety implication?"
  **Damage:** **Med.** Attacks your credibility/motivation, but not the core math.
  **1-Minute Reply:** "You're right, the 'death by lever' is pop-sci shorthand. The robust finding isn't death; it's the *preference reversal*. Animals will choose stimulation over food, mating, or safety, even when deprived. They neglect other drives. That's the safety risk: not that the AI explodes, but that it neglects the actual task to optimize the proxy. The magnitude of the Olds story matters less than the direction of the preference shift."
  **Softest Point:** If they press you on whether they *actually* neglect the task or just prioritize highly, you might wobble.
  **Concede?** **Yes, immediately.** "I concede the 'until they die' phrasing is hyperbolic. The core phenomenon is the displacement of other drives."

  ### 7. The "Habit vs. Goal" Rehash Objection
  **Source:** Neuro (Learning theory).
  **Phrasing:** "This sounds exactly like the dissociation between goal-directed (model-based) and habitual (model-free) control. Dopamine drives habits. You're just renaming 'habitualization' as 'erosion.' What's the actual new insight?"
  **Damage:** **Low/Med.** Attacks novelty, not truth.
  **1-Minute Reply:** "Habit vs. Goal is about *which system controls action*. Capture vs. Erosion is about *what happens to the value signal itself*. You can have a model-based agent (goal-directed) that still suffers reward erosion if its world model predicts high reward for states that are actually low fitness. Habits are about action selection; my claim is about value representation drift. They intersect, but they aren't the same."
  **Softest Point:** The distinction is subtle and might blur in complex agents.
  **Concede?** **No.** Keep the distinction sharp.

  ### 8. The "Goodhart Semantics" Objection
  **Source:** RL.
  **Phrasing:** "Reward Erosion sounds like Goodhart's Law. When a measure becomes a target, it ceases to be a good measure. Are you just renaming Goodhart's Law with neuroscience jargon?"
  **Damage:** **Low.** Terminological quibble.
  **1-Minute Reply:** "Goodhart's Law describes the *outcome* (the measure breaks). Erosion describes the *mechanism* (the internal representation drifts). Goodhart applies to economic metrics; Erosion applies to neural teaching signals. Knowing the mechanism matters because Goodhart suggests 'don't use the measure,' while Erosion suggests 'fix the homeostasis of the measure.'"
  **Softest Point:** It is a form of Goodharting. Don't overclaim uniqueness.
  **Concede?** **Yes.** "It is a specific biological instantiation of Goodhart's Law."

  ---

  ### The Landmine Question
  **You guessed:** *Whether the capture/erosion distinction survives in a system that can model its own reward function.*
  **My assessment:** You are close, but the real landmine is more specific.

  **The Question:**
  "If biology has homeostatic, bounded rewards, why does addiction exist? If your solution is 'copy biology,' and biology has a known failure mode where exogenous stimuli (drugs) bypass satiety and cause exactly the 'capture' behavior you claim is rare... aren't you admitting that homeostasis is fragile? And if it's fragile in carbon, why do you think it will be robust in silicon?"

  **Why this kills you:**
  1.  **Empirical Trap:** It uses the Neuro audience's knowledge (addiction mechanisms) to trap you.
  2.  **Theoretical Trap:** It forces you to admit that your "fix" (homeostasis) is exactly what fails in the most dangerous cases (drug addiction / wireheading).
  3.  **Audience Trap:** The Neuro folks know addiction is a hijacking of the *wanting* system (dopamine) while the *liking* system (opioids) saturates. If you don't make the wanting/liking distinction clear in your reply, they will eat you.

  **The Only Safe Reply:**
  "Addiction is the *exception* that proves the rule. It requires exogenous chemicals specifically evolved or synthesized to bypass the satiety mechanisms. It is an *attack* on the homeostatic system, not a natural failure of it. My argument is that we should not build AI systems that are vulnerable to 'exogenous' reward injections—meaning, we must prevent the agent from having access to reward channels that bypass the homeostatic decay. Biology is robust *until* it is attacked. AI is currently vulnerable *by default*."

  **Vulnerability:** This admits your solution requires perfect isolation of the reward channel, which is the "Capture" problem you claimed was rare.
  **Prep:** Be ready to pivot to "Architectural Isolation" as the prerequisite for Homeostasis to work.
