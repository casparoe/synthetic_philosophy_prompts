      *   *Case 1* is non-ergodic (trust breach).
      *   *Case 3* is the conflict. Why is 10^-8 perm loss better than 10^-4 outage? Because 10^-4 outage happens *often enough* to be a reliability crisis, whereas 10^-8 is noise. But the user said they picked A (perm loss). Wait, re-read Case 3. "Option A had a worst case of one permanent data loss... at 1 in 10^8... Option B had... recoverable... at 1 in 10^4. I picked A."
      *   *Correction:* They picked the *rarer* event, even though it was permanent. This suggests probability *does* matter when the difference is 4 orders of magnitude. It's not "Irreversibility trumps all." It's "Irreversibility trumps all *within the same probability order of magnitude*." Or, "Avoid systemic noise (10^-4) over Act of God (10^-8)."
      *   *Actually, looking closer:* 1 in 10^4 is *high* for an agent touching prod. That's 0.01%. If you run 10,000 actions, you expect an outage. That's a reliability product failure. 1 in 10^8 is effectively never. So the choice was: "Reliable but catastrophic if it happens" vs "Unreliable but annoying." They chose Reliable.
