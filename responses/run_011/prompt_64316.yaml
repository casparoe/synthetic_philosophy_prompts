      *   Don't make it too complex. The user wants something to hand a colleague.
      *   Focus on **Tail Risk vs. Existential Risk**.
      *   The user's intuition aligns with **Nassim Taleb's Barbell Strategy / Ergodicity**: Avoid ruin at all costs, optimize average elsewhere.
      *   *Key Distinction:* Is the harm *ergodic* (averages out over time/customers) or *non-ergodic* (one hit kills)?
