prompt: |-
  ok so quick context: 3rd year PhD student in political philosophy, some mechanism design coursework but im not a modeling person by temperament, applying for a ten-week summer research stipend where the deliverable is a single conference-length paper. I'd like you to act as a philosopher of social science who's actually read the prediction-markets-as-government literature (Hanson's futarchy stuff and the responses to it) rather than as a generalist, and to think carefully before writing — I dont want boilerplate grant-speak.

  Here's the half-baked idea I want turned into a proposal.

  Every critique of futarchy I've run into treats the manipulation problem as one more item in a list of practical objections — thin markets, the choice of welfare proxy (some net-national-spending measure or whatever), the "you're abdicating collective self-rule" complaint, the "real policies aren't discrete securities" complaint. I think the list format is hiding something structural. In an ordinary prediction market, buying up the "yes" contract doesn't help make the event happen; the price sits downstream of the world. Under futarchy the price IS the decision variable, so pushing up the price on the conditional "policy adopted" security is pushing up the very quantity that triggers adoption. The market isn't forecasting a fixed state of affairs, it's participating in selecting which state of affairs there will be. And the stock reply to manipulation — that it's self-defeating, because the manipulator still eats the loss when the price reverts to the true value, so only manipulations that are actually welfare-improving pay — seems to quietly assume two things: that there's a settled true value for the price to revert to, and that the other branch of the conditional is genuinely traded and arbitraged. Neither holds. The not-adopted branch basically never resolves, so the comparison isn't between a moved price and a disciplined price, it's between a moved price and a price with no information in it at all.

  Second, less formed half of the idea: maybe the honest upshot isn't cleverer market design but changing what the market is being asked to do — markets as advisory inputs feeding a pre-committed implementation schedule, rather than markets as the rule — which gives up exactly the feature that made futarchy attractive. I want the proposal to confront that trade-off instead of waving at it.

  So, two-stage answer please.

  Stage one, brainstorming: give me three genuinely different ways to frame this into a question with a determinate answer — not three rewordings of the same question — and for each say what would settle it. Then tell me which is most tractable in ten weeks for someone with my background and why.

  Stage two, the proposal built around the one you picked. It needs:

  - the question stated precisely enough that a reader could tell me it's wrong or already answered
  - why the standard positions each leave it open: the futarchist's cost-of-manipulation reply, the democrat's abdication complaint, and the "it's just an engineering problem, fix the institutions" response
  - what I'd actually do, week by week for the first three weeks and then month-level after, including an explicit call on whether I need a toy model — and if so, what the toy model could show and what it definitely couldn't
  - why this approach rather than the two obvious alternatives (a purely formal treatment of manipulable decision rules, or straight normative theory about legitimacy and expertise)
  - what a positive result looks like, and a real failure condition — something that would mean the project didn't work, not "further research is needed"
  - one honest paragraph on what's most likely to blow the scope, and what I'd cut first

  Please no bibliography and no lit review by citation, I'll add references myself — talk about positions and arguments, not about papers. And don't invent empirical claims about how prediction markets actually behaved; if an argument needs one, flag it in brackets as something I have to go verify.
