  Leo burst into the common room waving a stack of Coq output. "It's done! A derivation of $\text{Con}(\text{ZFC})$ entirely within $\text{ZFC}$! No large cardinals, no extra assumptions!"

  The room erupted. Someone popped champagne. A tenure-track postdoc started crying with relief.

  Sarah didn't lift her glass. She stared at Leo like he'd just announced he'd solved the halting problem by running the program.

  "Leo," she said, her voice flat. "Put the paper down."

  "But we're safe! The foundations hold!"

  "You just proved they don't. You just proved everything."

  "No, I proved consistency!"

  "Same thing."

  The champagne cork hit the floor. The silence was heavy enough to have its own cardinality.

  Mike, the category theorist, didn't look up from his commutative diagrams. "Does this invalidate the Yoneda lemma?"

  "It invalidates truth," Sarah said.

  "Fine," Mike said, erasing an arrow. "I'll work in a topos. Don't wait up."

  Dave checked his watch from the couch. "Besides, the shortest proof of a contradiction is definitely longer than the heat death of the universe. So operationally? We're fine. Seminar at 2?"
