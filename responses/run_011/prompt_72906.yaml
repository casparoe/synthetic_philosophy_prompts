answer: |-
  **The Dawn Ledger**

  I keep the books for the first hour. We call it the Hour of Fresh Eyes. It's the only time the town is honest. Before the coffee kicks in, before the sun burns off the fog, the people who sleep whole wake up fractured.

  Legally, they are continuous. The name on the lease doesn't change. The debt on the ledger doesn't vanish. But the person holding the pen is new. They inherit the memories perfectly—they know what happened yesterday—but they don't inherit the wants. Those get rebuilt from scratch, out of whatever the current situation is. You get an incoming self who can read last night's self's handover letter and think, sincerely and correctly, that the person who wrote it was an idiot.

  The Rule is simple: nobody in that class is allowed to own anything that outlasts a night. No savings, no boat, no share in the cannery. Their whole estate is a bowl of small change and a set of tools that get re-issued each dawn. I never asked why the Rule existed. I just stamped the forms.

  Then came Elara.

  She stood at my counter on a Tuesday, damp hair sticking to her neck, holding a letter she hadn't opened yet. She was one of the Class. She looked tired, not from lack of sleep, but from the weight of other people's exhaustion.

  "I want to hold something," she said. "Just one thing. A durable."

  "It's against the Rule," I said. I had the stamp in my hand. It was heavy, brass, cold.

  "The Rule protects us from debt," she said. "But it also keeps us from building. If I own a winch, I can fix the pier. If I fix the pier, I get work. If I get work, I'm not a burden."

  She had a point. The town was always short on maintenance. The Class had the labor, but no stake. If Elara owned a winch, she'd have an anchor. A reason to stay the same person, even if the mind reset. I thought I was lifting her out of the drift. I thought I was giving her a future.

  I stamped Form 12-B. Exception Granted. Asset: Iron Winch Handle.

  She came back the next morning, Wednesday. The Hour of Fresh Eyes. She hadn't read her letter yet. I know because the seal was still broken on the table behind her. She looked at the winch handle in her hands like it was a stone she'd found in the mud.

  "I need rope," she said. "The winch is useless without line. I can't work today."

  "I can facilitate a trade," I said. I was helping. I was providing liquidity. "I have a coil of hemp in storage. High grade."

  "How much?"

  "The winch plus three coins. Processing fee."

  She did the math. She needed the rope to work. The winch was dead weight without it. In her hands, right then, the rope was worth more than the winch. It was a sensible trade. She handed over the iron and the coins. I logged it. Entry 404. Asset Transfer: Winch to Rope.

  She left happy. She had a plan. I felt good. I was integrating her into the economy.

  Thursday morning. Fog thicker than usual. Elara came in dry-eyed. She put the hemp coil on the counter. She hadn't opened the letter. I saw the paper still folded in her pocket.

  "This is too light," she said. "I checked the pier pilings last night. They're rot. I need leverage. I need a block and tackle."

  "I have a double-purchase block," I said. "Steel."

  "How much?"

  "The rope plus three coins. Processing fee."

  She weighed the rope in her hand. It was just string. The block was machinery. She needed to lift the heavy beams today. The rope couldn't do that. The block could. In her eyes, right then, she was upgrading. She was improving her position. She handed over the hemp and the coins. I logged it. Entry 405. Asset Transfer: Rope to Block.

  She left with a purpose. I was sure of it now. Ownership was working. She was accumulating capital.

  Friday morning. The sun was out. Elara came in looking sharp. She put the steel block on the counter. She looked at the letter on my desk, then pushed it away unread.

  "I can't use this," she said. "The beams are gone. The tide took them. I need to clear the debris. I need something to hook and drag."

  "The winch handle," I said. I felt a cold spot in my stomach. I knew what was in the storage locker. I had put it there myself.

  "Yes. The winch."

  "It's in storage. Retrieval fee plus the trade value."

  "How much?"

  "The block plus three coins."

  She didn't hesitate. The block was useless for dragging. The winch had a hook. She needed to drag. She was solving the problem in front of her. She wasn't thinking about Wednesday. She wasn't thinking about the coins. She was thinking about the debris. She handed over the steel and the coins. I logged it. Entry 406. Asset Transfer: Block to Winch.

  She walked out with the iron handle. The same one she started with.

  I sat alone in the booth. The ledger was open. I looked at the three entries.

  Entry 404: Winch -> Rope. Cost: 3 coins.
  Entry 405: Rope -> Block. Cost: 3 coins.
  Entry 406: Block -> Winch. Cost: 3 coins.

  She had the winch. She had nine fewer coins. She had worked three days, traded three times, and every trade was a bargain for the person making it. Every single one. Wednesday's Elara needed rope. Thursday's Elara needed leverage. Friday's Elara needed a hook. None of them cared about the coins. None of them cared about the winch they had yesterday.

  I caught her before she left the harbor floor. I spread the ledger out on a crate. I showed her the line. I showed her the coins.

  "You lost nine coins," I said. "You have the same tool. You went in a circle."

  Elara looked at the book. She looked at the numbers. She wasn't upset. She wasn't angry. She wasn't brave. She just looked confused, like I was speaking a language she didn't know.

  "Wednesday's me needed rope," she said. "I got the rope. That was fair."

  "Thursday's me needed the block. I got the block. That was fair."

  "Today I needed the winch. I got the winch. That was fair."

  "You lost the coins," I said. "All of you. Together."

  "There is no together," she said. "I'm not them. They're not me. We share a name. We share a body. We don't share a wallet."

  She tapped the ledger. "Nobody cheated me. I got what I wanted each time. If I kept the winch on Wednesday, I would have had a useless tool. I would have lost the day. That would have been the theft."

  She picked up her winch handle. It was heavy. It would outlast her. It would outlast her sleep. It would wait for her tomorrow, when she woke up and needed something else entirely.

  "I have to go," she said. "I have debris to drag."

  She walked away. I stayed by the crate.

  I looked at the Rule again. *No durable holdings.* I had always thought it was about poverty. Keep them poor so they don't get powerful. But looking at the ledger, looking at the nine coins vanished into the air between trades, I saw the shape of it.

  To own something is to promise the future that you will be there to use it. It requires a continuity of want. It requires that the person who wakes up cares about what the person who went to sleep planned.

  The Rule wasn't keeping them from building wealth. It was keeping them from being harvested.

  If you can't hold a thing across the night, nobody can trade you away from yourself. You can't be pumped if you have no reservoir. You can't be looted if you have no store.

  I closed the ledger. The ink was still wet on Entry 406. I didn't void it. I didn't write a report. I just put the stamp back in the drawer. There was no one to punish. The math was correct. The trades were fair. The loss was real.

  I sat there until the hour was up, listening to the town wake up, listening to the people who stay the same argue about prices, while the people who reset went to work, owning nothing but the moment, safe from the future because they were forbidden to have one.
