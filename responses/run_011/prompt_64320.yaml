answer: |-
  You have identified a genuine conceptual friction point in historiography and political philosophy. The phenomenon you are describing is the attribution of normative blame to a collective entity precisely when the evidence demonstrates the absence of individual or collective agency. You are correct that standard terms like "diffusion of responsibility" miss the mark; that term describes a psychological dilution of blame among individuals, whereas you are describing the *concentration* of blame onto a structure that lacks the capacity to choose.

  Here is the carving of the nearest established concepts, why they fit or fail, and the precise term you need.

  ### 1. Collective Responsibility (Distributive vs. Holistic)
  The established umbrella term is **Collective Responsibility**. However, using this without qualification will cause you the same problem you see in the literature. Philosophers distinguish between two models:
  *   **Distributive Model:** The collective is responsible only because the *individual members* are responsible. (e.g., A lynch mob is responsible because each member struck a blow). This fails your test case because you have shown the individuals (Kaiser, Bethmann) did *not* choose the outcome.
  *   **Holistic Model:** The collective (the State, the Chancellery) is a moral agent in its own right, distinct from its members. It can bear responsibility even if no single member intended the outcome.

  **The Fit:** The **Holistic Model of Collective Responsibility** is the nearest established concept. It allows historians to say "Germany did it" without proving "Bethmann planned it."
  **The Gap:** Even the Holistic model usually assumes the collective has some form of *decision-making structure* or *shared intention*. Your observation is sharper: the "decision" was made by a railway timetable. The Holistic model struggles when the "collective agent" is shown to be a mindless mechanism. It explains *who* is blamed (the State), but not why the blame intensifies as the agency vanishes.

  ### 2. Strict Liability (Legal Concept)
  For the Versailles wrinkle (Article 231), the precise concept is **Strict Liability**. In law, this is liability for damage caused regardless of fault or intent.
  **The Fit:** This perfectly explains the Allies' position: Germany caused the damage, therefore Germany pays. It does not require a "guilty mind" (*mens rea*).
  **The Gap:** This is a legal/financial concept, not a moral/historical one. Historians arguing over "proportions of responsibility" are not calculating damages; they are assigning moral weight. When historians treat "Strict Liability" as "Moral Guilt," they are conflating the two. Your phenomenon is the *migration* of Strict Liability into the realm of Moral History.

  ### 3. Reification (Sociological Concept)
  **Reification** (or thingification) is the error of treating an abstract relationship or structure as a concrete thing with human qualities.
  **The Fit:** This captures the "timetable" aspect. Historians treat "Germany" as a person who chose, when it was actually a system that reacted.
  **The Gap:** Reification is usually a critique of an *error*. You are describing a *persistence of blame* despite the error being known. Historians know it was a timetable, yet they still blame "Germany." Reification explains the mechanism, but not the normative resilience.

  ### The Missing Concept
  The specific phenomenon you are tracking—where responsibility not only survives the absence of agency but is *fortified* by it because the system appears more inevitable and encompassing than any individual choice—lacks a single perfect established label. It is a hybrid of **Holistic Collective Responsibility** and **Reification**, driven by a **Strict Liability** logic.

  In the context of your MA, relying solely on "Collective Responsibility" risks ambiguity. You need a term that signals you understand the agency vacuum. I propose coining a specific modifier to the established term to capture this exact carving.

  **Definition:** **Reified Responsibility**.
  This occurs when normative blame is assigned to a collective entity (State, Market, Algorithm) that is treated as a moral agent, even when evidence demonstrates it operates via non-agential mechanisms (bureaucracy, timetables, code), and where the blame intensifies because the system is viewed as more totalizing than individual will.

  **Boundary Cases:**
  *   **Versailles Article 231:** This is **Strict Liability** masquerading as **Reified Responsibility**. The Allies needed a bill payer (Liability); the Germans heard a moral verdict (Guilt). The quarrel persists because the text allowed both interpretations.
  *   **"The Market Did It":** This is **Reified Responsibility** without the blame. Often used to *absolve* individuals ("I had to fire you, the market demanded it"). In your WWI case, the reification *assigns* blame. The shape is the same (agency vacuum filled by structure), but the normative direction differs.
  *   **"The Algorithm Did It":** This is currently a **Responsibility Gap** (no one is responsible). If historians future-date blame to "Facebook caused the insurrection" without finding a specific intent, they are creating **Reified Responsibility**.

  ### Recommendation for Your Writing
  Use **Holistic Collective Responsibility** as your established anchor, but explicitly define it as **Non-Agential Holistic Responsibility** or **Reified Responsibility** to signal your specific insight. This distinguishes you from the Fischer critics who argue about intent, and allows you to analyze why the blame persists *without* it.

  Verdict: Holistic Collective Responsibility
