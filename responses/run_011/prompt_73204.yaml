answer: |-
  Your hypothesis of "causal geometry" is not merely a useful heuristic; it is the missing variable that resolves the stalemate between the inefficacy objection and its standard replies. The inefficacy objection relies on a category error: it assumes the causal geometry of the *physical harm* (smooth, continuous, atmospheric mixing) is the only geometry that matters morally. The CFC episode demonstrates that the moral weight of an individual act is often carried by the *economic and normative geometry* (batched and signaling), which operates in parallel to the physics.

  Here is the analysis of the 1974–1978 CFC episode through your geometric framework, followed by a verdict on the ethical replies and their application to contemporary cases.

  ### 1. Geometric Analysis of the CFC Episode

  You asked for the geometry occupied by the household in 1975, 1977, and post-1978.

  **1975: The Signaling Geometry Dominates**
  *   **Physical Geometry:** Smooth. One can of hairspray contributes a negligible mass of chlorine to the stratosphere. The inefficacy objection holds strictly here.
  *   **Market Geometry:** Signaling. In 1975, no federal ban existed. Production schedules were based on projected demand. A household switching to a pump spray did not physically save ozone, but it altered the data stream to manufacturers.
  *   **Moral Status:** *Obligatory (on Signaling grounds).* The act was a vote for a market alternative. Without this signal, industry would have had no data to justify the R&D cost of substitutes. The inefficacy objection is silent here because it models the stratosphere, not the boardroom.

  **1977: The Batched Geometry Emerges**
  *   **Physical Geometry:** Still Smooth.
  *   **Market Geometry:** Batched. By 1977, the voluntary shift (511m to 300m pounds) meant retailers were making discrete decisions about shelf space. A specific SKU containing CFCs was at risk of being delisted if sales dipped below a restocking threshold.
  *   **Moral Status:** *Obligatory (on Expected Harm grounds).* Here, the "discrete batches" reply becomes factually true. An individual purchase carried a non-zero probability of triggering a discrete economic event (the cancellation of a production run or the delisting of a product), which would have reduced emissions by a crate's worth, not a molecule's worth.

  **Post-1978 (Ban): The Normative Geometry Solidifies**
  *   **Physical Geometry:** Regulated Smooth.
  *   **Market Geometry:** Signaling/Complicity. The ban covered non-essential uses. Buying an exempted product (inhaler) was permissible; buying a black-market CFC aerosol was a violation of the cooperative scheme.
  *   **Moral Status:** *Permissible (Exempt) vs. Wrong (Black Market).* The geometry shifts from "influencing the market" to "upholding the cooperative norm."

  ### 2. Evaluation of the Four Replies

  Based on this geometric mapping, here is the fate of the standard replies:

  **1. The Expected Harm Reply (Discrete Batches)**
  *   **Verdict:** **Rescued, but conditional.**
  *   **Analysis:** In the pure physical domain (stratospheric chemistry), this reply is false; the function is smooth. However, in the economic domain (manufacturing and retail), the function is batched. The 511m to 300m drop was achieved *before* the ban because individual acts aggregated to trigger discrete production shifts.
  *   **Limitation:** This reply fails in cases where the economic batch size is massive relative to individual consumption (e.g., commercial aviation). It works for aerosols because the unit size (a can) is close to the consumer unit.

  **2. The Complicity/Participation Reply**
  *   **Verdict:** **Survives Best.**
  *   **Analysis:** This is the only reply that remains robust across all three time periods. In 1975, using CFCs made one complicit in a harmful practice before the harm was physically measurable. In 1977, it maintained participation in a dying norm. Post-1978, it defined adherence to the cooperative scheme. It bypasses the causal geometry of the harm entirely and focuses on the geometry of the *practice*.
  *   **Strength:** It explains why the act was wrong even when the probability of triggering a batch threshold was near zero.

  **3. The Voting Analogy**
  *   **Verdict:** **Confirmed.**
  *   **Analysis:** The CFC case is arguably a clearer example of voting than actual elections. In elections, the probability of a single vote deciding the outcome is vanishingly small. In the 1975–1977 CFC market, the "vote" (purchase decision) had a much higher causal leverage on product availability. The inefficacy objection's claim that this "proves too much" is falsified by the historical record: the "votes" *did* decide the outcome (the voluntary phase-out).

  **4. The Sorites/Heap Reply**
  *   **Verdict:** **Killed.**
  *   **Analysis:** This reply concedes too much. It admits that no individual act makes a difference, arguing only that the *collection* does. The CFC history shows this is empirically false regarding the *mechanism of change*. The collection mattered *because* individual acts triggered market signals and batch thresholds. To say "no one act mattered" ignores the causal chain where individual acts *caused* the industry shift. It describes the physics but misses the sociology.

  ### 3. The Silent Zones (Edge Cases)

  You asked where the objection is silent. The inefficacy objection fails most spectacularly in the **Signaling** and **Hidden Structural** zones.

  *   **Exempted Uses (Inhalers):** The geometry here is *Necessity*. The inefficacy objection cannot distinguish between essential and non-essential emissions because it only measures magnitude. The Complicity reply handles this easily: one is not complicit in harm if the act is necessary for basic functioning and no substitute exists.
  *   **Labeling Routes (Sweden/Netherlands):** This alters the **Signaling** cost. Labeling reduces the transaction cost for the consumer to send the correct signal. The inefficacy objection treats the act of buying as isolated; labeling embeds the act in an information system.
  *   **Greenwashing (Products marketed as ozone-safe that never contained CFCs):** This is *Signal Noise*. It dilutes the geometric integrity of the signaling. If a consumer buys a "CFC-free" product that never had CFCs, they have signaled virtue without altering the batch geometry. The Complicity reply condemns this as participating in a deception, whereas the Expected Harm reply might mistakenly credit it.
  *   **Refrigerants:** This is the **Hidden Structural** geometry. The consumer buys a fridge; the leak rate is determined by manufacturing quality and servicing, not the purchase act. Here, the inefficacy objection *holds* for the individual consumer regarding the leak. The moral obligation shifts upstream (to the manufacturer). The individual act of buying is morally neutral regarding the leak, unless the purchase signals demand for leak-prone technology.

  ### 4. Final Verdict and Extension

  **The Verdict:**
  The inefficacy objection is falsified by the CFC episode, but not for the reason usually stated. It is not falsified because individual acts physically save ozone (they don't). It is falsified because it assumes a **static, smooth physical geometry** when the relevant moral geometry was **dynamic, batched, and signaling-based**.

  The **Complicity/Participation** reply is the only one that survives intact across all geometries. The **Expected Harm** reply is viable only if we expand the causal model to include economic thresholds (Batched). The **Sorites** reply is insufficient because it ignores the mechanism of aggregation.

  **Extension to Flying and Meat:**
  Your geometric device allows us to distinguish these cases rigorously, rather than lumping them as "climate issues."

  *   **Eating Meat (Batched + Signaling):**
      *   **Geometry:** The supply chain for meat is highly batched. Supermarkets and slaughterhouses order in discrete units based on sales data. An individual abstaining from meat carries a non-zero probability of preventing a discrete order (a crate, a pallet, or even a specific animal's slaughter in niche markets).
      *   **Verdict:** The **Expected Harm** reply applies strongly here, supported by **Complicity**. The individual act is obligatory because the economic geometry is sensitive to individual demand shifts, similar to the 1977 aerosol market.

  *   **Individual Flying (Smooth + Signaling):**
      *   **Geometry:** Atmospheric mixing is smooth (like the stratosphere). A single flight's emissions are negligible relative to the total. The "Batched" geometry is weak; one passenger rarely cancels a flight (threshold is high).
      *   **Verdict:** The **Expected Harm** reply is weak here. The moral weight rests almost entirely on **Signaling** and **Complicity**. Flying signals that high-carbon travel is normal and permissible. It participates in a luxury emission practice.
      *   **Implication:** If you accept the Complicity reply (as the CFC case suggests we must), flying is wrong not because your seat changed the CO2 ppm, but because you participated in a practice that sustains the infrastructure of harm. If you rely *only* on Expected Harm, flying is permissible. The CFC case argues we cannot rely only on Expected Harm.

  **Conclusion:**
  The CFC episode confirms that moral philosophy must model the *system*, not just the *physics*. The inefficacy objection is a reductionist error. It treats the world as a smooth physical function when it is actually a discontinuous socio-economic network. The household in 1975 was not a chemist adding molecules to a beaker; they were a node in a network signaling demand. To ignore that geometry is to ignore the actual mechanism by which collective harm is averted.

  The **Complicity** reply is the survivor. It accounts for the signaling and normative dimensions that the physicalist inefficacy objection ignores. For your reading group: the question is not "Did my can save the ozone?" but "Did my can sustain the market for CFCs?" The historical record says yes.
