answer: |-
  Here is an audit of your neighbour's analogy, broken down as requested.

  ### 1. Explicit Mapping

  To understand where the argument stands, we must first translate the terms of the potluck into the terms of the parking street.

  *   **The Potluck Meal** $\rightarrow$ **The Available Parking Space.** (The resource to be consumed).
  *   **Bringing a Dish** $\rightarrow$ **Exercising Restraint.** (This is the crucial, albeit awkward, translation. Since one cannot physically 'bring' parking space, the 'contribution' is implicitly defined as not taking up more than one's share, or perhaps owning fewer cars).
  *   **The Guest Empty-Handed** $\rightarrow$ **The Space Hog.** (The resident who parks multiple vehicles, or leaves a car stationary for days, consuming the resource without 'contributing' restraint).
  *   **Raised Eyebrows** $\rightarrow$ **Social Shaming.** (The WhatsApp group, the awkward nod in the street, the note on the windscreen).
  *   **Rules and Fines** $\rightarrow$ **Council Permits and PCNs.** (Formal institutional enforcement).

  ### 2. Disanalogies

  An analogy is only as good as the structural similarities it preserves. Here we separate the differences that matter from those that do not.

  **Disanalogies Bearing on the Conclusion**
  These differences undermine the neighbour's claim that social pressure alone can solve the problem.

  *   **Additive vs. Subtractive:** A potluck is *additive*. Every guest who brings a dish increases the total resource available. Parking is *subtractive*. Every car that arrives decreases the total resource available. In a potluck, the incentive is to contribute to the pool; in parking, the individual incentive is to secure a spot before the pool is empty. Social pressure works well when everyone benefits from contribution; it struggles when everyone benefits from consumption.
  *   **Divisibility:** Food is divisible. If someone arrives empty-handed, there is usually still enough pasta for them to have a small portion without depriving others of a meal. Parking spaces are discrete and indivisible. If one person takes the last space, another is entirely excluded. The stakes of 'free-riding' are significantly higher in parking.
  *   **Excludability:** A potluck is a private event. You can physically prevent the 'empty-handed' guest from entering the house or eating. On a public highway, you cannot legally prevent a resident (or their visitor) from parking without state authority. 'Raised eyebrows' cannot move a car; only a tow truck or a fine can.
  *   **Visibility of Contribution:** At a supper, it is immediately obvious who brought a dish. On a street, it is difficult to discern who is 'contributing' (i.e., who is away at work, who has no car, who is exercising restraint). The 'free-rider' is invisible until they park.

  **Merely Decorative Disanalogies**
  These differences are superficial and do not necessarily invalidate the logic of social cohesion.

  *   **The Nature of the Resource:** Whether the resource is lasagne or tarmac is irrelevant, provided the rules of consumption are the same (they are not, as noted above, but the material itself is decorative).
  *   **The Venue:** Whether the interaction happens in a dining room or on the pavement matters less than the rules of engagement.
  *   **The Sanction:** Whether the sanction is a glare or a passive-aggressive text message is a matter of degree, not kind, provided both are informal.

  ### 3. Hidden Assumptions

  The potluck picture relies on three specific conditions that do not hold true for your street.

  *   **Visibility:** The potluck assumes contributions are public and immediate. Parking habits are private. We do not know if a neighbour has three cars or none until they are all on the street. You cannot shame someone for a transgression you cannot observe.
  *   **Group Size and Stability:** Potlucks work on Dunbar-number principles; everyone knows everyone. Streets often include transient tenants, commuters who are never home to receive 'eyebrows', and visitors. Social contracts fray as group size increases.
  *   **Excludability of Benefit:** In a potluck, the host can refuse service. In a public street, the 'benefit' (the right to park) is a legal right of residence or presence. You cannot deny a resident the use of the road based on their failure to attend a supper.

  ### 4. Structural vs. Sociable

  Is the difference between a potluck and a parking street merely that your neighbours are less sociable? **No, it is structural.**

  The neighbour's argument assumes the problem is a *failure of will* (sociability). The reality is a *failure of incentives* (structure). This is a classic 'Tragedy of the Commons'. Even if every neighbour were perfectly sociable and polite, the rational incentive remains: "If I do not take this space, someone else will." In a potluck, the rational incentive is: "If I bring a dish, we all eat better."

  The potluck is a **Public Good** scenario (non-rivalrous, non-excludable within the group), whereas street parking is a **Common Pool Resource** (rivalrous, non-excludable). Treating a Common Pool Resource as a Public Good is a category error. No amount of neighbourliness can overcome the mathematics of rivalry when demand exceeds supply.

  ### 5. Evaluation of the Conclusion

  **Does the conclusion fail?**
  The strong conclusion—that permits and fines are unnecessary and that a supper and WhatsApp group will suffice—**fails**. The mechanisms proposed (shaming, voluntary restraint) lack the teeth to manage a rivalrous resource where the cost of cheating (getting a space) is high and the cost of being caught (a glare) is low.

  **Does something weaker survive?**
  Yes. A weaker, defensible conclusion is that **institutional controls work best when underpinned by social consensus.** A WhatsApp group cannot replace permits, but it can help residents manage the 'visitor vouchers' or identify genuine abuse versus necessity. The supper is not a remedy, but it might be a lubricant for the difficult conversations required to implement the permits. Your neighbour is right that community matters, but wrong that it is a substitute for regulation.

  ### 6. A Better Analogy

  A more accurate analogy for a resource that is genuinely rivalrous but hard to exclude people from is a **Communal Grazing Pasture** (the classic 'Commons').

  *   **The Mapping:** The grass is the parking space; the cows are the cars; the farmers are the residents.
  *   **Why it fits:** Like parking, if one farmer grazes too many cows, there is less grass for the others (rivalry). It is difficult to stop a commoner from grazing their cattle without agreed rules (non-excludability).
  *   **What it licenses:** This analogy does not license a supper. It licenses a **Grazing Agreement**. It suggests that without clear quotas (permits), monitoring (wardens), and sanctions (fines), the pasture will be overgrazed to the point of ruin. It acknowledges that the resource is finite and that 'neighbourliness' is insufficient to prevent individual rationality from destroying the collective good.

  In short, tell your neighbour that whilst a potluck is a lovely idea for a Saturday night, it is a poor model for a Tuesday morning commute. The street is not a dinner party; it is a pasture. And pastures require fences.
