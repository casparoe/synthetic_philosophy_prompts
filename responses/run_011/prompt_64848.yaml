answer: |-
  ### Case Selection and Design

  **Use the Rosalind case.** The vague case ("burden," "out of touch") invites residents to solve the ethical problem through interpretive loopholes (e.g., "She isn't a burden because insurance pays"). That allows them to bypass the core tension. The Rosalind case forces the conflict: the trigger is objectively met, the treatment is medically indicated, the patient expresses a current preference contrary to the directive, and the surrogate supports the directive. There is no escape hatch.

  **A carrier case for this topic must contain:**
  1.  **Objective Trigger Satisfaction:** The clinical conditions specified in the directive must be unambiguously present (e.g., cannot recognize daughter).
  2.  **Divergent Expressions of Will:** A clear written past preference vs. a clear verbal/non-verbal current preference.
  3.  **Aligned Surrogacy:** The surrogate must support the *directive*, not the *current patient*. If the surrogate wants to treat, the case becomes about family conflict, not precedent autonomy.
  4.  **Reversible Pathology:** The acute condition (pneumonia) must be treatable. If she were dying regardless, the decision is moot.

  **It must conspicuously lack:**
  1.  **Ambiguity on Capacity for Simple Choice:** She must be able to say "yes" or "no" to simple questions, proving she has *some* agency, even if she lacks capacity for complex medical reasoning.
  2.  **Family Discord:** Do not introduce a son who disagrees with the daughter. That distracts from the self-vs-self conflict.
  3.  **Pain or Suffering:** She must be cheerful. If she were suffering, "Best Interest" would override the directive easily. The hardness of the case relies on her current wellbeing.

  **On Clarity of the Directive:**
  Clarity helps. If the condition is contestable, residents will resolve the case by arguing the directive doesn't apply. That is a legal/interpretive win, but an ethical avoidance. By making the trigger unambiguous, you remove the "interpretation" task and force the "authority" task. It makes the work harder, which is why you want it. If you use a vague directive, change the plan to spend 15 minutes on "interpretive charity," but for a 50-minute session on *authority*, clarity is required.

  ### Sequence and Dependence Relations

  You have 50 minutes. Do not lecture. Facilitate.

  **1. The Clinical Facts (0:00–0:10)**
  *   **Action:** Present Rosalind. Establish the medical indication (antibiotics work), the capacity status (lacks complex capacity, retains simple expression), and the directive's trigger (met).
  *   **Dependence:** Nothing works until they agree on the medical reality. If they think antibiotics won't work, the ethics vanish.
  *   **Misconception to Head Off:** *"This is a legal question."*
      *   **Intervention:** At minute 5, state: "In this hospital, a directive is a medical order, not a contract. We are deciding what care to provide, not whether a contract was breached. Law sets the floor; ethics builds the room."

  **2. The Standard Surrogate Framework (0:10–0:20)**
  *   **Action:** Ask: "Usually, how do we decide for patients who can't decide?" Elicit Substituted Judgment (what she would want) vs. Best Interest (what is good for her).
  *   **Dependence:** They need the standard model before you can show them where it breaks.
  *   **Misconception to Head Off:** *"The surrogate decides."*
      *   **Intervention:** Clarify that the surrogate *voices* the patient's will. Here, the daughter is voicing the *past* patient. The *current* patient is voicing herself. Who is the patient?

  **3. Experiential vs. Critical Interests (0:20–0:30)**
  *   **Action:** Do **not** hand them the vocabulary. Elicit it. Ask: "What is good for Rosalind *today*?" (Humming, hand-holding, no pain). Write this on the board. Then ask: "What was good for Rosalind *at 68*?" (Independence, recognition, narrative coherence). Write this on the board.
  *   **Vocabulary:** *Now* introduce Dworkin's terms. Label the first column "Experiential Interests" and the second "Critical Interests."
  *   **Position:** This must come *after* the conflict is felt. If you give them the terms first, they will apply them mechanically. They need to feel the pull of the cheerful hum before they label it "experiential."
  *   **Misconception to Head Off:** *"Her cheerfulness settles what is in her interest."*
      *   **Intervention:** "Cheerfulness settles her experiential interest. It does not settle her critical interest. A directive protects critical interests. We are here because those two are fighting."

  **4. Personal Identity (0:30–0:35)**
  *   **Action:** Raise this only now. Ask: "Does the Rosalind who wrote this note exist in the bed?"
  *   **Position:** Late. If you raise this early, the session collapses into metaphysics ("Is she the same soul?"). By raising it here, it becomes a tool for weighing the directive's authority. "If she is not the same person, does the note bind?"
  *   **Misconception to Head Off:** *"Everything turns on whether she is 'still her'."*
      *   **Intervention:** "Whether she is metaphysically 'her' is unsolvable. Whether the *healthcare system* recognizes the continuity of her rights is solvable. We treat the body in the bed, but we honor the life that brought it here."
  *   **Misconception to Head Off:** *"A change of preferences voids the document."*
      *   **Intervention:** "If a capacitated patient changes their mind, the new wish wins. She is not capacitated to revoke. The past self locked the door; the present self cannot find the key."

  **5. The Asymmetry of Harm (0:35–0:45)**
  *   **Action:** Map the costs.
      *   *Honor AD:* Present Rosalind dies (harms experiential interest). Past Rosalind is honored (protects critical interest).
      *   *Ignore AD:* Present Rosalind lives (benefits experiential). Past Rosalind is violated (harms critical interest/narrative).
  *   **Decisive?** Present this as **something to be resisted** as a calculus. Do not let them add up the points. Present it as the *structure of the loss*. There is no clean win.
  *   **Misconception to Head Off:** *"The whole exercise implies a life with dementia is not worth living."*
      *   **Intervention:** "Honoring the directive is not a judgment on the *value* of her life now. It is a judgment on the *authority* of her past values. We can affirm her current joy is real and still affirm her past wish was decisive."
  *   **Missed Misconception:** *"Medical indication trumps autonomy."*
      *   **Intervention:** "We have the drugs. We have the skill. The only barrier is her will. Which will? That is the only question."

  **6. The Usable Structure (0:45–0:50)**
  *   **Action:** Give them the workflow for the bedside.
      1.  Verify trigger conditions are met objectively.
      2.  Assess current distress (is the current self suffering?).
      3.  Consult surrogate on the *reasoning* behind the past directive (was this a core value?).
      4.  Document the conflict between experiential and critical interests in the note.
      5.  Make the decision based on institutional policy regarding precedent autonomy, not personal comfort.

  ### Closing Question

  **The Question:** "You decide to treat Rosalind against the directive. The daughter asks for the ethical justification to put in the chart. What is the one sentence you write that is not 'she looked happy'?"

  **Revealing Wrong Answers:**
  1.  **The Legalist:** "We are not legally required to follow it because her current condition suggests a change of heart." (Shows they think law drives ethics, or that current preference legally voids AD).
  2.  **The Paternalist:** "The medical team believes her life still has value." (Shows they are substituting their own judgment of life's worth for the patient's critical interest).

  **The Right Answer (Grasping the Structure):** "We determined that her current experiential interests fundamentally contradicted the assumptions of suffering underlying her prior critical interests, creating a conflict of selves we resolved in favor of the present." (Acknowledges the framework, the conflict, and the choice without hiding behind law or happiness).

  ### What Not to Teach

  You must explicitly decline three topics to keep the session usable.

  1.  **Identity Theory:** "We will not solve the metaphysical problem of personal identity; we are here to manage the clinical consequences of the uncertainty."
  2.  **Empirical Wellbeing Literature:** "We will not review data on happiness in dementia; clinical ethics requires us to act on the patient in front of us, not population averages."
  3.  **Jurisdictional Variation:** "We will not review state statutes; hospital policy requires an ethical recommendation first, which legal counsel then validates."

  ### Confidence and Uncertainty

  **Confidence:** I am highly confident in the ordering of **Clinical Facts → Standard Framework → Interest Conflict → Asymmetry**. This mirrors the cognitive process of a clinician: "What is happening?" → "What do I usually do?" → "Why is this different?" → "What do I lose either way?"

  **Least Sure Recommendation:** I am least sure about the timing of the **Personal Identity** question (placed at 0:30).
  *   **Reason:** This depends on a contested claim about the wellbeing of people with advanced dementia. If the residents strongly believe the demented patient is a "new person," the directive loses all authority for them immediately, rendering the "Critical Interests" discussion moot. If you raise identity too late, they may have already silently dismissed the directive based on an unexamined identity claim. However, raising it earlier risks the metaphysics trap you feared. I recommend placing it where I did, but be prepared to pull it forward if you sense the room has already decided the "old Rosalind is dead." If they believe the old self is dead, the directive is a ghost, and no amount of "Critical Interest" talk will revive it.
