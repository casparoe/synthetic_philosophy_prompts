prompt: |-
  Next month I am teaching a fifty-minute clinical ethics seminar to twelve second-year internal medicine residents on the authority of an advance directive when the person who wrote it and the person it now governs seem to want opposite things. In six weeks they will be drafting these documents at bedsides, so the aim is a usable structure rather than a settled position. I do not want the argument explained to me; I want a plan for how to run the explanation.

  The case I intend to build the session around: Rosalind, now 79, wrote at 68, in her own hand, that if she ever reached a point where she could no longer recognize her daughter or hold a conversation, she did not want antibiotics for pneumonia or any other infection, "even if I seem happy then, and even if I ask to be treated." Her dementia has reached exactly that point. She does not recognize her daughter, she speaks in single words, and by every caregiver's account she is cheerful: she hums, she holds hands, and when asked in the simplest possible terms whether she wants to live, she says yes. Three days ago she developed aspiration pneumonia, which a course of antibiotics would very likely clear. Her daughter asks that the document be honored; the covering resident wants to treat.

  I am also considering a second case, in which the directive is vague about the trigger — the writer refused "to go on as a burden, dependent and out of touch with the people I love," and the patient is now out of touch with everyone, is not a burden in any material sense because her care is privately paid, and is content. Please tell me which of the two should carry the session, and what a carrier case for this topic must contain and must conspicuously lack. A related design question: in the first case the directive's condition is unambiguously satisfied, which may make the residents' work too easy. Does that clarity help or hurt, and what changes in the rest of the plan if I use a directive whose condition is only contestably met?

  Beyond that, I want: the order in which the components must be introduced, with the dependence relations stated — what has to be in place before what will even register. One distinction I assume belongs early is the one between experiential and critical interests, between what makes her days pleasant and what made her life the life she took herself to be living; tell me whether it should be handed to them as vocabulary or elicited from the case, and whether I am wrong about its position. Tell me where to raise the question of whether the demented patient is still the same person: I fear that raising it early collapses the session into metaphysics, but I suspect the residents' instinct to treat the document as decisive already rests on an answer to it. Give me the misconceptions they will arrive with and the ones they will form during the hour, each with the exact point in the sequence where it must be headed off. My own list so far is that this is really a legal question, that a change of preferences voids the document, that everything turns on whether she is "still her," that her apparent cheerfulness settles what is in her interest, and — the one I most fear — that the whole exercise implies a life with dementia is not worth living. Add the ones I have missed.

  There is also an asymmetry I do not know where to put: the two answers wrong different people at different times, and one of them wrongs someone who cannot register the wrong. Honoring the document ends the life of a patient who appears to want to go on; setting it aside leaves a life organized against everything the earlier self cared about, while harming no one capable of experiencing the harm. Say whether to present that as decisive or as something to be resisted, and where it goes.

  Then: one closing question whose answers will separate residents who have grasped the structure from residents who have merely picked a side, together with what the two most revealing wrong answers would sound like. And what I should refuse to teach at this level and say so openly — identity theory, the empirical literature on how reliably wellbeing is reported in advanced dementia, jurisdictional variation in directive law — including a sentence for each that declines it without seeming evasive.

  Finish by stating how confident you are in the ordering you recommend, and single out the recommendation you are least sure of, particularly if it depends on a contested claim about the wellbeing of people with advanced dementia rather than on a settled one.
reasoning: |-
  Here's a thinking process that leads to the suggested seminar plan:

  1.  **Analyze the Request:**
      *   **Audience:** 12 second-year internal medicine residents (PGY-2).
      *   **Topic:** Authority of advance directives (AD) when past self (AD) conflicts with present self (current patient state).
      *   **Goal:** Usable structure, not a settled philosophical position. They need to draft these in 6 weeks.
      *   **Time:** 50 minutes.
      *   **Case:** Rosalind (79, dementia, AD written at 68 refusing treatment if she can't recognize daughter/converse, even if she seems happy/asks for treatment. Now meets criteria, has pneumonia, seems happy, says "yes" to living. Daughter wants AD honored, resident wants to treat).
      *   **Secondary Case:** Vague AD ("burden," "out of touch"), patient is out of touch but content/not material burden.
      *   **Specific Questions to Answer:**
          *   Which case to use (Rosalind vs. Vague)?
          *   What must a carrier case contain/lack?
          *   Does clarity of AD condition help or hurt?
          *   Order of components/dependence relations.
          *   Experiential vs. Critical Interests: Vocabulary vs. Elicitation? Position?
          *   Personal Identity Question: When to raise it?
          *   Misconceptions (pre-existing & emergent) + when to head them off.
          *   The Asymmetry (wronging different people/times): Present as decisive or resist? Where?
          *   Closing Question (discriminating understanding vs. picking sides) + Wrong Answers.
          *   What *not* to teach (Identity theory, empirical wellbeing lit, legal variation) + specific decline sentences.
          *   Confidence level + Least sure recommendation.

  2.  **Deconstruct the Pedagogical Challenge:**
      *   Residents are action-oriented. They want algorithms. Ethics is often non-algorithmic.
      *   The tension is between *Precedent Autonomy* (Past Self) and *Current Interests* (Present Self).
      *   The "Usable Structure" needs to be a framework for deliberation, not a rule for decision-making.
      *   Time is tight (50 mins). Every minute counts.

  3.  **Address the Case Selection:**
      *   *Rosalind (Clear Trigger):* The AD condition is met objectively (doesn't recognize daughter, single words). The conflict is purely about the *authority* of the past wish vs. current apparent wish.
      *   *Vague Case:* The conflict is about *interpretation* of the trigger. Is she a "burden"? Is she "out of touch"?
      *   *Decision:* Use Rosalind. The vague case introduces interpretive ambiguity which distracts from the core ethical conflict (Past vs. Present Authority). If they spend 20 mins arguing whether she's "out of touch," they miss the point about whether the AD binds even if she's happy.
      *   *Clarity:* Clarity helps. It removes the "interpretation" escape hatch. It forces them to face the hard conflict. If the condition is contestable, they can resolve the case by saying "The AD doesn't apply." That's too easy. The hard case is "The AD applies, but she seems to want life."
      *   *Carrier Case Requirements:* Must have clear trigger satisfaction, clear conflict between past written wish and current expressed wish, high stakes (life/death), surrogate alignment with AD (to remove family conflict noise). Must *lack* ambiguity about prognosis (treatment works) and ambiguity about capacity (she lacks capacity to make *new* ADs, but expresses current preference).

  4.  **Structure the Flow (Order of Operations):**
      *   *Foundation:* Needs to establish the clinical reality first.
      *   *Concept 1:* Substituted Judgment vs. Best Interest. (Standard surrogate framework).
      *   *Concept 2:* The Conflict (Past vs. Present).
      *   *Concept 3:* Experiential vs. Critical Interests (Dworkin). This is the theoretical tool to explain the conflict.
      *   *Concept 4:* Personal Identity (The "Same Person" problem). Keep this minimal/pragmatic.
      *   *Concept 5:* The Asymmetry of Harm.
      *   *Conclusion:* Actionable framework.
      *   *Dependency:* You can't discuss Critical Interests until you acknowledge the AD exists. You can't discuss Identity until they feel the tension of the conflict. You can't discuss Asymmetry until they understand the stakes.

  5.  **Address Specific Concepts:**
      *   *Experiential vs. Critical:* Do not lecture this. Elicit it. Ask: "What matters to Rosalind *now*?" (Experiential). "What mattered to Rosalind *then*?" (Critical). Introduce terms *after* they generate the concepts. Position: Middle. After the case is set, before the resolution.
      *   *Personal Identity:* Raise it late. If raised early, it becomes abstract philosophy. Raise it when discussing *why* the AD might lose authority. "Does the AD bind if the person is 'gone'?" Keep it pragmatic: "Does the document survive the change in mind?"
      *   *Misconceptions:*
          *   "It's legal." (Head off early).
          *   "Current preference voids AD." (Head off during conflict).
          *   "Cheerfulness = Best Interest." (Head off during Best Interest discussion).
          *   "Dementia life not worth living." (Head off during Asymmetry).
          *   *Missed:* "The surrogate decides." (Surrogate implements patient's will, doesn't impose their own). "Capacity is binary." (She has capacity for preference, not for complex medical decision).

  6.  **The Asymmetry:**
      *   Honoring AD: Harms present self (death), respects past self.
      *   Ignoring AD: Harms past self (life narrative violated), benefits present self.
      *   *Placement:* Near the end. It's the weighing mechanism.
      *   *Decisive?* No. Present it as the *structure of the dilemma*, not the solution. If you present it as decisive, you dictate the outcome. The goal is a usable structure for *them* to decide.

  7.  **Closing Question:**
      *   Needs to test if they understand the *tension*, not just the *outcome*.
      *   Good question: "If Rosalind had written 'I want to live as long as I am happy,' would you treat?" (Tests consistency of principle).
      *   Better question: "What specific conversation do you have with the daughter to justify *either* choice?" (Tests practical application of the framework).
      *   Best question (discriminating): "Under what specific condition would you feel ethically permitted to override Rosalind's written directive in this specific scenario?"
      *   Wrong Answer 1 (Rigid Legalism): "Never, it's a legal document."
      *   Wrong Answer 2 (Pure Paternalism): "Whenever she smiles, the document is void."
      *   Right Answer (Nuanced): "If we have evidence her current values fundamentally contradict the prior ones in a way that suggests the prior self wouldn't recognize this life as the 'burden' she feared." (Or something acknowledging the weight of both).
      *   *Refinement:* Let's go with: "What evidence would you need to see in the chart to justify *not* treating, given her current 'yes'?" vs "What evidence to justify treating?"
      *   *Actually, the prompt asks for ONE closing question.* Let's make it about the *justification*. "You decide to treat. The daughter sues. What is your one-sentence ethical justification that isn't 'she looked happy'?"

  8.  **What NOT to Teach:**
      *   Identity Theory (Locke, Parfit).
      *   Empirical Wellbeing Lit (Happy demented patients).
      *   Legal Variation (State laws).
      *   *Drafting the declines:* Needs to be respectful but firm on scope.

  9.  **Confidence & Uncertainty:**
      *   High confidence on the flow (Case -> Conflict -> Framework -> Application).
      *   Low confidence on the "Identity" timing. It's seductive to residents. Keeping it out is hard.
      *   Low confidence on the "Wellbeing" aspect. The prompt asks about contested claims on wellbeing. I need to flag that.

  10. **Refining the Plan (Self-Correction during drafting):**
      *   *Check:* Did I answer the "Clarity of AD" question? Yes, clarity helps force the ethical conflict.
      *   *Check:* Did I address the "Vocabulary vs. Elicitation"? Yes, elicit first.
      *   *Check:* Did I include the missed misconceptions? Need to ensure "Surrogate Authority" is covered.
      *   *Check:* The Asymmetry. Don't make it decisive. Make it the *map* of the terrain.
      *   *Check:* Time management. 50 mins is very short for this depth. Need to be strict on timing.

  11. **Final Polish:**
      *   Tone: Professional, pedagogical, direct.
      *   Structure: Follow the prompt's sequence of questions.
      *   Ensure the "Usable Structure" is explicit (e.g., A 3-step check).

  *(Self-Correction on the Closing Question)*: The prompt asks for a question where answers separate those who grasped the structure vs. picked a side.
  *   Side-pickers say: "Treat" or "Don't Treat."
  *   Structure-graspers say: "It depends on whether we prioritize X over Y, and here is how we document that."
  *   Let's refine the closing question to focus on the *documentation of the reasoning*.

  *(Self-Correction on Misconceptions)*: The prompt lists specific ones. I need to add the ones I missed.
  *   Missed: "The surrogate's distress dictates the plan." "Medical indication trumps autonomy." "Capacity is all-or-nothing."

  *(Self-Correction on Identity)*: The prompt asks where to raise "still the same person." I need to be careful not to let it derail. I will place it as a "limit test" for the AD's authority, not the starting point.

  *(Self-Correction on Asymmetry)*: The prompt asks if it should be decisive. It shouldn't be. It explains the *cost* of each option.

  Let's assemble the response.

  *   **Case Choice:** Rosalind (Clear).
  *   **Case Requirements:** Clear trigger, clear conflict, clear prognosis, aligned surrogate. Lacks: Ambiguity on capacity for simple expression, ambiguity on family conflict.
  *   **Clarity:** Helps. Removes interpretive wiggle room.
  *   **Order:** Clinical Facts -> Standard Surrogate Role -> The Conflict (Past vs Present) -> Interests (Elicit then Label) -> Identity (as limit) -> Asymmetry (as weighing) -> Actionable Framework.
  *   **Interests:** Elicit first. Position: Middle.
  *   **Identity:** Late. Prevents metaphysics trap.
  *   **Misconceptions:** Map them to the timeline.
  *   **Asymmetry:** Present as the *structure of the loss*, not the solution.
  *   **Closing Question:** Focus on justification/documentation.
  *   **Exclusions:** Draft the sentences.
  *   **Confidence:** High on flow, lower on Identity timing.

