answer: |-
  The coffee had developed a skin. Elara stared at the iridescent film spreading across the surface of the mug, then looked down at the logbook open before her. *The Vantage*, voyage 44-B. Latitude 34°N, Longitude 12°W. Speed over ground: 14 knots. Speed through the Medium: 14.6 knots.

  She dipped her pen in the red ink. Her task was to strikethrough the ontology. Keep the math, kill the ghost.

  *Medium*, she underlined. In the margin, she wrote: *NULL ENTITY*.
  *Flow vector*, she circled. Margin: *RELATIVE MOTION ONLY*.

  But then she reached the calculation block. The Drag Coefficient. The old navigators had believed the universe was filled with a stiff, invisible jelly—the Medium—that resisted light and ships alike. They believed the jelly dragged slightly when moved by massive bodies like Earth. They had built their chronometers around this drag. And miraculously, the ships arrived on time.

  Elara's stamp sat to her right. Heavy brass, carved with the Bureau's seal: *VERIFIED STRUCTURE*. She had another stamp, lighter, plastic: *HEURISTIC SCAFFOLDING*.

  The door clicked open. Kaelen didn't knock. He carried a stack of papers bound in grey twine, looking as though he hadn't slept since the last solar cycle. He dropped the stack on the corner of her desk, disturbing the dust motes dancing in the sterile light.

  "Your draft on the Meridian Guild archives," Kaelen said. He pulled a chair out and sat backwards on it. "I reviewed the sample batch."

  "I haven't submitted the sample batch."

  "I know. I pulled it from your queue. Look at page four."

  Elara turned to page four of her own work. She had marked a series of triangulation equations as *VERIFIED STRUCTURE*. They described how the surveyors corrected for the 'tension' in the magnetic lines.

  "You kept the tension corrections," Kaelen said.

  "Because they work. If you remove the tension variable, the survey points drift by four meters per kilometer. The Guild built a continent with these numbers."

  "They built a continent with numbers," Kaelen corrected. "You're conflating the numbers with the tension. There is no tension, Elara. We proved that yesterday. The magnetic lines aren't physical threads. They're contours. You can't correct for the stretch of a rubber band that isn't there."

  "So I mark it *SCAFFOLDING*?" Elara picked up the plastic stamp. "If I mark it scaffolding, the Engineering Corps will throw it out. They need the correction factor."

  "Then give them the factor without the story." Kaelen tapped his grey stack. "I ran a regression on the same data. I treated the magnetic deviation as a function of local density alone. No tension. No threads. Just mass and distance."

  He slid a sheet toward her. The curves overlaid perfectly. His line matched the Guild's line. His line matched the actual coastline. The only difference was that his equation didn't mention tension once. It was empty of meaning, purely relational. It described how things moved relative to other things, without saying why.

  "This is instrumentalism," Elara said, the word tasting like ash. "You're saying truth doesn't matter as long as the ship doesn't crash."

  "I'm saying your ledger is supposed to separate the true structure from the false history. But if I can reproduce every single prediction in this book using only relations between observables, then your 'structure' is invisible. Indistinguishable from the ghost." Kaelen leaned in. "You're trying to save the furniture from a house that burned down. I'm telling you the land is still there. Who cares about the furniture?"

  Elara looked back at *The Vantage* log. *Speed through the Medium: 14.6 knots.*

  If she marked *Medium* as *NULL ENTITY*, but kept the coefficient derived from the Medium's existence, what was she validating? She was certifying a map that led to treasure using a compass pointing to a magnet that didn't exist.

  "The Director wants the final audit by morning," Kaelen said, standing up. "He doesn't care about the philosophy. He wants to know if he can teach the new cadets the old formulas without lying to them."

  "It is lying," Elara said. "If I teach them the Drag Coefficient without the Drag, I'm teaching them a spell. *Say these words, the ship goes fast.*"

  "Then write a footnote."

  "Footnotes don't stop vertigo."

  Kaelen paused at the door. "There is no vertigo if you don't look down. Just mark the math usable. Mark the history false. Send it."

  He left. The door clicked shut. The ventilation hummed, a low, steady drone that seemed to vibrate in the fillings of her teeth.

  Elara picked up her mug. The coffee was stone cold. She drank it anyway, grimacing at the bitterness.

  She looked at the equation again. It was beautiful. It was precise. It was a skeleton that walked without a body. The old navigators had stared into the void and seen a fluid. They had measured its viscosity. They had died believing in it. And now, here she was, centuries later, using their measurements to navigate a universe where that fluid was forbidden.

  The math was load-bearing. The ontology was a ghost.

  If she stamped *VERIFIED STRUCTURE*, she lied about the world.
  If she stamped *HEURISTIC SCAFFOLDING*, she risked the engineers discarding the only tool that worked.

  She picked up the brass stamp. She hovered it over the page. The shadow of the seal fell across the equation, a dark circle obscuring the variables.

  What if Kaelen was right? What if any set of outcomes could be stitched together by enough clever algebra? If she could invent a new relation tomorrow that fit the data better, would that make today's structure false? Was there ever anything but the fitting of curves to points?

  She looked at the window. Outside, the city lights blurred in the rain. A tram slid past, silent on its magnetic cushion. It moved using equations derived from the Guild, refined by the Bureau, corrected by her. It arrived on time.

  Did the tram know why it moved?

  Elara put the brass stamp down. She picked up the pen.

  She drew a line through *Medium*. She drew a line through *Tension*. She left the numbers untouched.

  In the margin, she began to write. *Effective value.* *Operational constant.* Words that meant nothing and everything. Words that promised the ship would arrive without promising the sea was real.

  Her inbox chimed. A message from the Director. *STATUS UPDATE.*

  She stared at the cursor blinking at the end of her sentence. It pulsed like a heartbeat. She could feel the weight of the archive behind her, thousands of boxes of dead men's certainties, all of them useful, all of them wrong.

  She typed: *Review in progress.*

  She deleted it.

  She typed: *Ambiguity detected in foundational constants.*

  She deleted that too.

  Finally, she picked up the plastic stamp. *HEURISTIC SCAFFOLDING*. She pressed it down. The ink transferred wet and purple onto the page. It covered the word *TRUE* which she had written in pencil earlier, barely visible beneath the violet smear.

  She moved to the next line. *Drag Coefficient: 0.44.*

  She held the stamp over it. Her hand trembled, just once. A micro-spasm of fatigue, or something else. She didn't bring the stamp down. She set it aside and picked up the pen again.

  She wrote the number down in her own ledger. She didn't mark it true. She didn't mark it false. She just copied it, preserving the shape of the thing, leaving the substance blank.

  The coffee mug sat empty beside her. The rain streaked the glass, distorting the lights outside into long, dragging lines of red and white, smeared by the water, moving faster than the source, exactly as the formula predicted they should.
