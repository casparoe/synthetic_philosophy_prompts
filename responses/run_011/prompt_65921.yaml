      *   **Context:** Prof bailed, TA writing final.
      *   **Course Content:** 4 weeks *Analects*/*Mencius*, 1 week contemporary role ethics (persons constituted by roles, *ren* achieved in relations).
      *   **Class Demographics:** Split 50/50 (Classical Chinese background vs. Western Moral Theory background). Both misuse "role ethics" as a settled label.
      *   **Exam Format:** Closed-book, 75 minutes, one essay question, 25 marks. One handwritten crib sheet allowed.
      *   **Core Concept:** "Forfeiture/Residue Pair" (but these words cannot appear in the question).
          *   *Problem 1 (Forfeiture):* If person = roles, what happens when roles are violated? (Mencius on slaying a ruler, "Ruler be ruler," Duke of She/stolen sheep). Roles seem normative/forfeitable, not just descriptive.
          *   *Problem 2 (Residue):* If roles are forfeited, is there a "residue" self left? If yes, does this reintroduce the autonomous self role ethics rejects?
      *   **Requirement:** Concrete case study (e.g., estranged/violent father). Must engage with *remonstrance* material.
      *   **Deliverables:**
          1.  Exam Question (student view).
          2.  Model Answer (~650 words).
          3.  Marking Scheme (25 marks, named components, specific mistakes).
          4.  Differentiator (A vs. B move).
          5.  Feasibility Check (Is 75 mins realistic?).
      *   **Constraints:** No citations/page numbers (rely on passage content). Honest assessment of time.

  2.  **Drafting the Exam Question:**

      *   *Goal:* Force students to confront the tension between role constitution and role failure without giving away the "forfeiture/residue" terminology.
      *   *Case:* The estranged father scenario suggested by the user is perfect. It hits the "father-be-father" requirement and the "remonstrance/care" tension.
      *   *Prompt:* Needs to ask them to evaluate the role-ethics claim using the case and the texts.
      *   *Constraint:* Do not use "forfeiture" or "residue."
      *   *Drafting:* "Contemporary role ethics argues that persons are constituted by their roles... Consider an adult child whose father was violent and absent... Mencius says... Analects says... Does the role-ethics view collapse here? Is there a self left?"
      *   *Refining:* Make it tighter. Focus on the tension between the *definition* of the person and the *judgment* of the role-holder.

  3.  **Drafting the Model Answer:**

      *   *Length:* ~650 words.
      *   *Content:* Must address both problems (Forfeiture & Residue) without naming them as such. Must use the concrete case. Must use *remonstrance* (Analects 4.18, 13.15, Mencius 4B:30 etc., though no citations needed).
      *   *Argument:*
          1.  Acknowledge the role-ethics claim (constituted by roles).
          2.  Address Problem 1: The violent father. If he fails the role, is he still a father? Mencius on the "mere fellow" suggests roles are normative. If you fail the *li* of the role, you lose the status.
          3.  Address Problem 2: The child's obligation. If the father forfeits the role, does the child still have a role? If the child says "he is no longer my father," does that imply the child is an autonomous agent choosing roles?
          4.  Resolution via Remonstrance: Remonstrance isn't exiting the role; it's the *way* of inhabiting it when it goes wrong. The "residue" isn't an autonomous self, but a new relational configuration (e.g., becoming a remonstrator, or in the extreme, severing the relation which re-constitutes both parties).
          5.  Conclusion: Role ethics holds if we see role failure as a *transformation* of the relationship, not a return to atomism.
      *   *Tone:* Academic, precise, demonstrating knowledge of the texts discussed in class.

  4.  **Drafting the Marking Scheme:**

      *   *Total:* 25 marks.
      *   *Components:* Need specific buckets.
          *   Understanding of Role Ethics claim (5).
          *   Application to Case (Forfeiture aspect) (5).
          *   Application to Case (Residue/Self aspect) (5).
          *   Use of Remonstrance/Textual Evidence (5).
          *   Synthesis/Conclusion (5).
      *   *Specific Mistakes:* Need to be sharp.
          *   *Role Ethics:* Treating it as "playing a part" vs "being the part."
          *   *Forfeiture:* Thinking forfeiture means the role never existed.
          *   *Residue:* Assuming a "true self" remains.
          *   *Remonstrance:* Seeing it as quitting.
          *   *Western Theory:* Dropping Kant/Mill inappropriately.
      *   *A vs. B Differentiator:* Needs a specific named move. "Constitutive Transformation" vs. "Role Abandonment."

  5.  **Feasibility Check:**

      *   *Time:* 75 minutes for one essay.
      *   *Task:* Read prompt, recall texts, structure argument, write 650+ words (students usually write less than model answers, but need depth).
      *   *Difficulty:* High. It requires meta-ethical analysis + textual application.
      *   *Verdict:* It's tight. 75 minutes is doable for a 300-level seminar *if* they have the crib sheet. The crib sheet is key. I need to advise the TA that the question is dense but manageable for this level, provided the students prepared. I might suggest simplifying the prompt slightly to ensure they don't spend 40 mins just decoding the question.

  6.  **Refining and Polishing:**

      *   *Check against constraints:* Did I use "forfeiture" or "residue" in the question? No. Are there citations? No. Is the marking scheme specific? Yes.
      *   *Tone:* Professional, helpful to a colleague.
      *   *Specific Textual References (Mental Check):*
          *   Mencius on King Zhou (mere fellow).
          *   Analects 12.11 (Ruler be ruler...).
          *   Analects 13.18 (Duke of She/Straightness).
          *   Remonstrance (Analects 4.18, 13.15).
      *   *Differentiator:* Let's call it "The Remonstrance Pivot." B students see remonstrance as a way to fix the role so it continues normally. A students see remonstrance as the *mechanism* that handles role-breakdown without invoking a bare self.

  7.  **Final Review of the Output:**
      *   Ensure the marking scheme "mistake" lines are punchy.
      *   Ensure the model answer doesn't exceed word count significantly.
      *   Ensure the feasibility check is honest.

  *(Self-Correction during drafting)*: I initially thought about having separate sections for the two problems in the marking scheme. Better to integrate them into the argument flow. Let's make sure the "Residue" problem is clearly distinguished from the "Forfeiture" problem in the grading criteria, as that's the core of the TA's pedagogical goal.

  *(Feasibility)*: 75 minutes is actually quite generous for one question if it's the *only* thing they do. Usually, 75 mins allows for ~1000-1200 words of writing. A 650-word model answer is a "distinction" level density. Students writing 800-1000 words can hit these points. I will say it's realistic but demanding.

  *(Final Polish on Marking Scheme)*: Make sure the "mistake" descriptions are distinct.
  1. Role Ethics definition (Confusing sociological role with ontological constitution).
  2. Forfeiture Logic (Treating failure as descriptive error rather than normative loss).
  3. Residue Logic (Positing a pre-social self).
  4. Remonstrance Usage (Treating as exit strategy).
  5. Case Integration (Ignoring the violence/absence detail).

  Let's assemble.
answer: |-
  ### Exam Question

  **Time Allowed:** 75 Minutes
  **Total Marks:** 25

  **Question:**
  Contemporary proponents of Confucian role ethics argue that persons are not autonomous selves who subsequently adopt social positions, but are ontologically constituted by the roles they inhabit. On this view, *ren* (humaneness) is achieved within particular relations rather than possessed by an isolated individual.

  Consider the following case: An adult child is asked to care for an aging father who was violently abusive and absent throughout the child's upbringing. The father now claims the child owes him care based on the father-son role.

  Drawing on the *Analects* and *Mencius*, evaluate whether the role-ethics interpretation can account for this scenario without collapsing. Specifically:
  1.  If the father systematically violated the norms of his position, does he retain the status that generates obligation? (Consider Mencius on the "mere fellow" and *Analects* 12.11).
  2.  If the child rejects the obligation by claiming the man is "no longer a father," does this presuppose a self capable of standing outside roles to judge them? (Consider the function of remonstrance in *Analects* 4.18 and 13.15).

  Argue whether these two difficulties share a single solution or require separate theoretical repairs.

  ***

  ### Model Answer

  The role-ethics interpretation faces a critical stress test in cases of severe relational failure. If persons are constituted by roles, the violent father presents a paradox: either the role persists despite abuse (making ethics blind to harm), or the role vanishes (raising the question of who is doing the vanishing). A robust role-ethics defense must navigate between these poles using the texts' own resources on normative failure and remonstrance.

  Regarding the father's status, the texts suggest roles are normative, not merely descriptive. In *Analects* 12.11, Confucius insists that "let the ruler be a ruler, the father be a father." This implies that biological position is insufficient; one must *perform* the role to inhabit it. Mencius sharpens this when asked about slaying a tyrant. He replies he has heard of the execution of a "mere fellow," not the regicide of a king. By failing the moral requirements of kingship, the tyrant forfeits the constitutive status of "ruler." Applied to the case, the abusive father, by violating the care and protection inherent to fatherhood, ceases to constitute a "father" in the ethical sense. He becomes, like the tyrant, a "mere fellow." This solves the first difficulty: obligation is tied to the successful performance of the role, not the biological fact.

  However, this triggers the second difficulty: the residue problem. If the child declares, "You are no longer my father, so I owe you nothing," it sounds as though the child is an autonomous agent stepping outside the relationship to adjudicate its validity. This reintroduces the isolated self role ethics seeks to eliminate. If the child is constituted by the son-role, and the father ceases to be a father, does the son cease to be a son? If not, what is left of the child?

  The solution lies in reinterpreting remonstrance not as an exit strategy, but as a mode of inhabiting broken relations. *Analects* 4.18 advises remonstrating with parents gently, yet *Analects* 13.15 suggests straightness may require prioritizing broader communal norms over specific familial loyalty (as in the stolen sheep case). Remonstrance is not the self judging the role from the outside; it is the self struggling to sustain the ethical order *within* the relation. When remonstrance fails due to violence, the relationship transforms. The child does not revert to an autonomous atom; they enter a new constitutive relation, perhaps that of a protector of the community against a threat, or a distant caretaker bound by humaneness (*ren*) rather than filial piety (*xiao*).

  Therefore, the two difficulties share a single solution: role constitution is dynamic, not static. The father forfeits the role through failure, but the child does not revert to a bare self; they assume a reconfigured role necessitated by the breakdown. The "self" is not a residue remaining after roles are stripped; it is the locus of ongoing relational negotiation. The role-ethics view holds, provided we understand that constituting roles includes the role of responding to role-failure. To treat the father as a "mere fellow" is not to act as an autonomous judge, but to inhabit the role of a moral agent within a wider network of relations that the father has damaged. The obligation shifts from *xiao* to a broader *yi* (righteousness), preserving the constitutive view without demanding the child submit to abuse.

  ***

  ### Marking Scheme (25 Marks)

  **1. Interpretation of Role Constitution (5 Marks)**
  *   **5:** Correctly identifies roles as ontological/constitutive rather than voluntary/sociological.
  *   **0-2:** Treats role ethics as "playing a part" or confusing it with standard virtue ethics.
  *   *Specific Mistake:* Defining roles as masks worn by a pre-existing self.

  **2. Analysis of Role Forfeiture (5 Marks)**
  *   **5:** Uses Mencius/Analects 12.11 to argue roles are normative and can be lost through failure.
  *   **0-2:** Argues biological ties create inescapable obligation regardless of behavior.
  *   *Specific Mistake:* Treating the "father" label as a descriptive biological fact rather than a normative achievement.

  **3. Analysis of the Residue/Self Problem (5 Marks)**
  *   **5:** Identifies the risk that rejecting a role implies an autonomous judge outside the system.
  *   **0-2:** Asserts the child has a "right to choose" without addressing the metaphysical implication.
  *   *Specific Mistake:* Dropping in Western autonomy/rights language as a solution rather than a problem to be solved.

  **4. Use of Remonstrance Texts (5 Marks)**
  *   **5:** Uses remonstrance to show how one stays *in* a difficult relation or transforms it ethically.
  *   **0-2:** Treats remonstrance as a loophole to abandon the relationship entirely.
  *   *Specific Mistake:* Reading remonstrance passages as an escape hatch that lets you exit a role rather than as a way of inhabiting it.

  **5. Synthesis and Case Application (5 Marks)**
  *   **5:** Connects the father's forfeiture to the child's reconfigured obligation without positing a bare self.
  *   **0-2:** Solves one problem but leaves the other unanswered; ignores the violence/absence detail.
  *   *Specific Mistake:* Treating *li* as mere etiquette rather than the structure of the relationship itself.

  ***

  ### The A vs. B Differentiator

  **The Move:** *Constitutive Transformation vs. Role Abandonment.*

  A **B-grade answer** will argue that the child can abandon the role because the father failed first. They will treat the relationship as a contract that was breached, allowing the child to walk away as a free agent. They solve the forfeiture problem but fail the residue problem.

  An **A-grade answer** will argue that the child does not "abandon" the role but is *re-constituted* by the breakdown. They will articulate that responding to a failed father is itself a role (e.g., the remonstrator, the protector of *yi*), meaning the child never stands outside of relational constitution. They solve both problems by showing that role ethics includes the ethics of role-breakdown.

  ***

  ### Feasibility Check

  **Is 75 minutes realistic?**
  Yes, but it is tight. For a 300-level seminar, this is appropriate difficulty, but the density of the prompt is high. Students must juggle a concrete case, a meta-ethical definition, two distinct textual problems, and a synthesis.

  **Risk:** Students may spend the first 20 minutes just unpacking the prompt's two sub-questions, leaving 50 minutes for writing. This usually yields ~600-800 words, which is enough for a solid answer but leaves little room for waffle.

  **Recommendation:** Do not cut content. The constraint is necessary to prevent the "half the class" problem you described (where one half writes purely textual exegesis and the other half writes purely western theory). The prompt forces the collision. However, ensure your crib sheet policy is strict (e.g., size of paper, one side only) so they aren't reading an outline during the exam. If you want to make it safer, remove the explicit instruction to "Argue whether these two difficulties share a single solution" and let that synthesis emerge naturally; this saves them 5-10 minutes of structural planning. But keeping it in ensures you can grade the synthesis directly. I recommend keeping it.
