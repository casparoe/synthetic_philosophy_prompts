      *   Highlight that standard probability theory *forbids* uncertainty about logical truths. It's not an idealization; it's a definition. To allow uncertainty, you must change the definitions (the "physics"), not just the parameters (the "friction").

  8.  **Final Structure:**
      *   **Executive Summary:** The analogy fails because friction is a parameter within a theory, while logical omniscience is a structural axiom of the theory.
      *   **Correspondence Table:** Clear mapping.
      *   **The Breaks:**
          1.  Axiomatic vs. Parametric.
          2.  Knowability of the Error.
          3.  Coherence vs. Approximation.
      *   **Verdict on "Non-Problem":** It is a problem. The "correction term" is the entire field of Logical Induction.
      *   **Better Analogy:** Numerical Analysis (Exact Solution vs. Approximation Algorithm).

