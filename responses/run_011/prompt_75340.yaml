      *   *Logic/Belief:* We assume agents know all logical consequences of their beliefs. We know humans don't. The opponent suggests we can just add a "logical friction" term to account for computational limits.
      *   *The Claim:* Logical Induction (which builds a theory of non-omniscient reasoning from the ground up) is unnecessary because we can just tweak the existing Bayesian framework.

  3.  **Drafting the Correspondence Table:**
      *   *Idealized Model:* Frictionless mechanics $\leftrightarrow$ Standard Bayesianism (Logical Omniscience).
      *   *Real World:* Mechanics with friction $\leftrightarrow$ Bounded Rationality/Logical Uncertainty.
      *   *The "Friction":* Physical resistance/heat loss $\leftrightarrow$ Computational cost/Proof search depth.
      *   *Correction Term:* Coefficient of friction $\leftrightarrow$ ? (This is the crux. What is the equivalent term?)
