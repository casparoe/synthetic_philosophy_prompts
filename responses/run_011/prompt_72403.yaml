  Hey, this is a fascinating puzzle. You are right to suspect that your friend is working with a layered set of definitions rather than a single rule, but I think your hunch about catching him out on these two specific systems might be slightly off. He has enough conceptual room to be consistent on both without waffling, provided he sticks to the distinctions he has already shown you. To see why, we need to reverse-engineer the three hidden rules he is using to sort his examples.

  The first and most important rule is ontological. He draws a hard line between quantum and classical physics. Anything governed by classical mechanics, no matter how messy, is deterministic in principle. This covers the coin, the roulette wheel, the pendulum, and the deck. Anything governed by quantum mechanics where the outcome is not fixed by the state is genuinely random. This covers the orthogonal spin and the radioactive decay. This rule alone suggests he will call both of your new systems deterministic because neither involves quantum mechanics.

  The second rule is epistemic and relies on physical limits. This is where he separates the roulette wheel from the weather. Both are classical and chaotic, but for the roulette wheel, the precision required to predict the outcome is achievable by a human observer. For the weather, the precision required exceeds what any finite observer can physically measure or store, likely referencing the number of bits available in the observable universe. He calls the weather not knowable not because it is ontologically random, but because it is epistemically closed to us.

  The third rule is about information and ignorance. This handles the deck of cards. The order is fixed, but because you lack the information, he grants it a label of random in the information-theory sense. It is a concession to practical utility rather than a statement about the world.

  Now let us apply these rules to your first system, the power-law simulation. This is a classical deterministic system. The key difference between this and the weather is the rate of divergence. Weather diverges exponentially, meaning precision requirements skyrocket immediately. Your system diverges by a power law, which is much slower. You mentioned that a one-in-a-billion perturbation takes a million steps to become significant. This means predicting a million steps out only requires about nine digits of precision. That is trivially measurable. Even predicting much further out requires far less precision than the weather. Because the required precision stays within physical limits for any reasonable timeframe, he will likely classify this as a deterministic machine, similar to the roulette wheel or the trained coin flip. He will not call it random.

  Your second system is the computationally irreducible machine. This is also classical and deterministic. The starting state is known exactly, which removes the element of ignorance that made the deck of cards random in his eyes. The only barrier to prediction is computational effort, not measurement precision. He might acknowledge that the output looks random or is incompressible, but since the state is settled and known, he will likely stick to calling it deterministic. He might add that it is pseudo-random or complex, but he has already established that classical systems are not genuinely random. So he will probably say this is deterministic too.

  This means your hunch that he will call both random is likely wrong, and consequently, you might not catch him waffling. He can consistently call both deterministic because one is predictable like a roulette wheel and the other is fixed like a deck where you know the order but have to count manually. Neither crosses his quantum threshold, and neither crosses his physical limits threshold like the weather does.

  If you want to truly test the boundaries of his definitions, you need a system that forces a collision between his ontological rule and his epistemic rule. The sharp case you are looking for is a classical chaotic system where the initial conditions are set by a quantum measurement. Imagine a double pendulum where the starting angle is determined by the spin of an electron.

