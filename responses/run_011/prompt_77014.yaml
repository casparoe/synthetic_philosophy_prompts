      *   *(b) Closeness Metric:* This relates to Lewisian possible worlds semantics. How similar must the world be? If we remove Hitler, do we keep the Depression? Do we keep the Treaty of Versailles? Usually, we keep the background conditions fixed. But do we keep the *outcome* fixed? No, that's the variable. The real issue here is *trajectory*. If a different leader invades Poland in 1942 instead of 1939, is it still "Nazi Germany"? This overlaps with (a).
