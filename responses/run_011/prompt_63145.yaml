  So Nozick's hybrid in Anarchy, State, and Utopia — maximize the total happiness of all living beings, but put stringent side constraints only on what you may do to human beings — is meant to rest on the idea that only a being who can shape its life in line with some overall plan is the kind of thing that can be wronged in the special way side constraints are supposed to block.

  Give me a concrete example of an animal case where those two halves of the view pull against each other. I'm thinking of a creature that plainly has project-like, future-directed activity — caches it laid months back, a dam it's spent a season building, a tool set it assembled and revisits — but where you'd deny there's anything like an overall plan in Nozick's sense. Then work out: on the utilitarian-for-animals half, is frustrating those projects wrong, permitted, or maybe even required given how the total is counted? And does the rationale he offers for the human side constraints — that it's the only life they get, and that planning is what lets a life have meaning — bite in the animal case too? Please build the case out in some detail and stipulate whatever facts or numbers you need rather than asserting them; I don't want the example to just be borderline-species hand-waving about chimps or dolphins.

  Format, in American English please: a "Bottom line" of one or two sentences up top, then "The case" (~200 words), "What the two halves say" (~200 words), and "Which one should give" (~150 words).
