  Bottom line: The beaver case demonstrates that if long-term project pursuit grounds human rights, extending utilitarian calculation to planning animals creates an unjustified moral discontinuity.

  **The case**
  Consider a North American beaver, unit B-7. Over eight months, B-7 felled 40 trees, woven branches, and packed mud to construct a dam securing a pond for winter survival. This is not mere instinct but responsive engineering; B-7 repairs leaks overnight and stores 200kg of Aspen logs underwater for February access. The dam represents B-7's primary survival strategy, akin to a human career or home. Stipulate that destroying the dam causes B-7 severe distress and starvation risk, valued at -500 utility units. However, breaching the dam prevents downstream flooding that would destroy a human settlement and kill livestock, generating +1000 utility units. Under Nozick's hybrid, B-7 is a living being subject to utility maximization but lacks side constraints. The destruction is physically possible and legally permissible within the theory, treating the dam as a resource rather than an extension of B-7's agency. The beaver's labor is sunk cost; the utility function cares only about future outcomes.

  **What the two halves say**
  The utilitarian half dictates that destroying the dam is not merely permitted but required. B-7's frustration counts toward the total, but the net gain of +500 units mandates sacrificing its project. Frustrating the project is morally right because it maximizes the sum. Conversely, the rationale for human side constraints—that only beings shaping lives via overall plans deserve inviolability—bites sharply here. B-7 exhibits temporally extended, goal-directed activity resembling a life plan. If meaning arises from pursuing long-term projects, and this is the only life B-7 gets, the rationale suggests protection. The theory thus pulls in opposite directions: the calculation demands violation, while the underlying justification for constraints suggests B-7 qualifies for protection. The view separates the trait (planning) from the right (inviolability), creating a gap between the reason for rights and the holders of rights.

  **Which one should give**
  The side-constraint rationale should extend to the animal. If the moral significance of human rights rests on the capacity to organize existence over time, B-7 meets the functional criteria. To deny this, Nozick must claim beaver planning lacks the reflective "overall" quality of human planning, a metaphysical distinction unsupported by the stipulated facts. If the hybrid view holds firm, it admits that side constraints are not about planning capacity but species membership, undermining the philosophical justification offered in *Anarchy, State, and Utopia*. The utilitarian half exposes the arbitrariness of the human/animal line, suggesting either animals need rights or humans lack the unique status claimed.
