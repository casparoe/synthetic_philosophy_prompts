answer: |-
  The mandate arrived on a Tuesday, sealed in a manila envelope that smelled of toner and ambition. Vesperia, a coastal nation of three million souls, was tired of being respectable. The Prime Minister wanted legacy. Specifically, he wanted the top spot on the World Happiness Report.

  Elias Thorne was appointed Minister of National Fulfillment. His office was glass-walled, overlooking a park that was immediately replanted with brighter flowers. On his desk sat the methodology paper: the Cantril Ladder. *Imagine a ladder with steps numbered from 0 at the bottom to 10 at the top… Where do you stand?*

  "It's not happiness," said Dr. Mara Kovic on day three. She was the lead behavioral consultant, hired because her papers on affective forecasting were seminal, and because she was impossible to work with. She wore a haptic vest that buzzed every thirty minutes to prompt a mood log. "It's a cognitive evaluation of life satisfaction relative to expectations. It's a judgment, not a feeling."

  "It's the metric that matters," Elias said, not looking up from the sampling frame data. "Gallup World Poll. Thousand respondents. Three-year rolling average. If we move the needle here, we win."

  "And if we optimize for a survey question, we get citizens who are trained to answer surveys, not live lives," Mara said. She tapped her vest. "Negative affect. High arousal. You're giving me anxiety, Elias."

  "Good. Stay sharp."

  For the first three years, they did the honest work. They fixed the plumbing. They increased social support networks by funding community centers. They cracked down on perceived corruption, not by eliminating it entirely—that was impossible—but by making the prosecution of it highly visible. GDP per capita climbed. The score moved from 7.4 to 7.8. Vesperia entered the top ten.

  Then, the plateau hit.

  Jonas, a senior data analyst in the basement of the Ministry, found the anomaly in Year Four. He was looking at the stratification of the sampling frames. The Gallup methodology required random digit dialing, but response rates varied by region. Jonas noticed that in districts where income inequality was low, satisfaction scores were higher, even if absolute income was lower. But in districts where a new luxury development opened next to social housing, scores in the housing dropped precipitously.

  "It's the reference group," Jonas said, presenting to Elias and Mara in the war room. He projected a heat map of the capital. "The ladder question asks people to compare their life to the 'best possible life' they can imagine. But they don't imagine a global best. They imagine their neighbor's best."

  Mara sighed, adjusting her vest. "So you're saying happiness is relative. Groundbreaking. Can we go back to measuring cortisol levels?"

  "No," Jonas said. "I'm saying we don't need to raise the lives. We just need to lower the ceiling of the imagination."

  Elias leaned forward. "Explain."

  "If the 'best possible life' is portrayed as unattainable glamour, people rate themselves a six. If the 'best possible life' is portrayed as security, community, and a garden, people rate themselves a nine. We change the media landscape. We shift the reference group."

  "That's propaganda," Mara said. "It's cognitive manipulation. You're decoupling the metric from the reality."

  "I'm decoupling the metric from *envy*," Elias countered. "You want to measure moments? Fine. When we tried your Experience Sampling Method last year, productivity dropped twelve percent. People stopped striving because they were too busy checking in with their own contentment. They became comfortable. Soft. We need ambition, Mara. We just need them to feel satisfied while they have it."

  "It's a category error," Mara snapped. "You're building a nation of actors. They'll learn to say ten."

  "They'll learn to *mean* ten," Elias said.

  The strategy shifted in Year Five. It was subtle. The Ministry didn't censor wealth; they simply stopped celebrating it. Advertising standards were revised. Displays of excessive luxury were taxed not as income, but as "visual pollution." The national broadcaster began running dramas where the protagonists found profound resolution in modest achievements—a repaired fence, a local election win, a quiet dinner.

  Simultaneously, the urban planning division implemented "Community Cohesion Zones." Housing developments were redesigned so that income disparity within a visual field was minimized. You no longer saw the penthouse from the patio. You saw only others like you.

  The scores began to climb again. 8.1. 8.4.

  Mara became unbearable. She started interrupting cabinet meetings to log her frustration. She demanded that random citizens wear biometric sensors to measure "true" joy versus "reported" joy. When the sensors showed that citizens were less aroused during national holidays but reported higher satisfaction, she threw a tablet across the room.

  "You've lobotomized the aspiration!" she shouted at Elias during the Year Seven review. "Look at the youth enrollment in advanced degrees. Down forty percent. Why strive for the top of the ladder when the media tells you the middle rung is paradise?"

  "Striving causes stress," Elias said calmly. "Stress lowers the score. We are optimizing for the report."

  "You're optimizing for a number on a page! The World Happiness Report isn't a game, Elias."

  "It is now. We're number three, Mara. Next year, we're number one."

  "And what happens when we get there?"

  "Then we maintain it."

  Jonas watched them from the corner. He had his own data now. He knew that the sampling frame was being subtly tweaked. The surveyors were trained to conduct interviews in the late afternoon, when fatigue made resistance low and gratitude for the day's end high. The question order was shuffled so that questions about social support preceded the ladder question, priming the respondents to think of community rather than income.

  It was Goodhart's Law in action: when a measure becomes a target, it ceases to be a good measure. But the country looked peaceful. The streets were clean. There were no protests.

  Year Ten arrived. The anticipation in the Ministry was physical, a hum in the glass walls. The UN report was due at 0900 GMT.

  Elias stood by the window. Mara sat at the table, her vest silent for once. She had stopped logging. She looked tired, her edges worn down by a decade of fighting a war against semantics.

  "If we win," Mara said quietly, "I'm leaving. I can't work in a laboratory where the subjects know they're being tested."

  "We're not testing them," Elias said. "We're caring for them."

  "You're gardening," she said. "Pruning the outliers."

  The notification pinged on the main screen. Vesperia: 8.95. Rank: 1.

  There was no cheering. The number hung there, green and bold. It was the culmination of a decade of policy, psychology, and manipulation.

  Elias turned from the window. "Did we do it?"

  "We got the number," Mara said. She stood up and unclipped the haptic vest. She placed it on the table. It looked like a piece of shed skin. "Whether anyone is happy is outside the sampling frame."

  Outside the Ministry, the city of Vesperia was quiet. It was a Tuesday.

  In a small apartment in Cohesion Zone 4, Henrik sat at his kitchen table. He was fifty-two, a logistics manager. His income had remained static for six years, adjusted only for inflation. He had not applied for a promotion in three years; the training required seemed unnecessary for the life he lived.

  A surveyor stood at his door. She was young, wearing the Ministry's soft blue jacket. She held a tablet.

  "Just a few questions for the national review, sir. Random selection."

  Henrik invited her in. He offered her coffee. She declined politely. She asked him about social support. He thought of his neighbors, who all earned roughly what he did, who all watched the same broadcasts about the virtues of stability. He thought of the community garden down the street, where he spent his evenings. He felt a sense of belonging, heavy and warm.

  He thought about the world outside Vesperia. He knew it was chaotic there. People striving, fighting, burning out. He saw it on the curated news feeds. He felt grateful for his stillness.

  "And finally," the surveyor said, her voice practiced, gentle. "Imagine a ladder with steps numbered from 0 at the bottom to 10 at the top. The top represents the best possible life for you. On which step do you feel you personally stand at the present time?"

  Henrik looked at his hands. They were uncalloused. He looked out the window at the uniform skyline, the green spaces, the lack of cranes building towers he couldn't afford. He felt a profound lack of wanting. The ache of ambition had been soothed away by years of gentle messaging that what he had was enough, that more was dangerous, that satisfaction was a civic duty.

  He thought about the number 10. What would that be? A bigger house? More work? More worry? No. The best possible life was this safety. This quiet.

  "Ten," Henrik said. He smiled. It reached his eyes, crinkling the corners. It was a genuine smile, born of relief.

  "Thank you, sir," the surveyor said. She marked the tablet.

  She walked back down the stairs, into the clean air. She uploaded the data packet to the Ministry server. In the glass tower, the number held steady. The country was happy. The country was measured.

  Henrik went back to his table. He picked up his coffee. It was lukewarm. He drank it anyway, savoring the warmth that remained, wondering vaguely why he couldn't remember the last time he'd been angry about anything, and deciding, as he looked at the quiet street, that he probably hadn't needed to be.
