      *   **Question 1 (Reference/Inscrutability):** Davidson accepts Quine's inscrutability of reference. Reference is *not* pinned down absolutely. Different reference schemes can satisfy the same truth conditions. Charity doesn't fix this; it's ontologically indeterminate. So, the pipeline cannot "fix" gavagai by iterating charity.
      *   **Question 2 (Belief vs. Meaning):** Davidson argues they are solved *simultaneously*, not sequentially. You cannot guess beliefs first to get meaning, nor meaning first to get beliefs. The Principle of Charity operates on the whole system to optimize both together.
      *   **Pipeline Viability:** The user's plan says "work up from observation sentences... then read off a truth-conditional theory." This sounds somewhat sequential. The core issue is the assumption that reference gets pinned down and that belief/meaning can be disentangled sequentially.

