answer: |-
  **Planning Notes:**
  1.  **Definitions:** Establish the counterfactual baseline ("Impact Response Condition") and the vague strike mechanism.
  2.  **Clauses 1–3:** Introduce failures where the condition holds but breakage doesn't (masks/packing), where breakage happens without the condition (mimics/sabotage), and where the strike itself alters the property (finks).
  3.  **Exclusions & Annex:** Demonstrate the bureaucratic retreat from counterfactuals to intrinsic material composition and finally to subjective appraiser expectation.

  ***

  **UNDERWRITING MANUAL SECTION 44-B: FRAGILITY ENDORSEMENT**

  **1. PURPOSE AND SCOPE**
  This section governs the issuance of the Fragility Endorsement (Form F-44). The Endorsement provides indemnity for items certified as possessing a high probability of structural failure upon physical impact. Coverage is contingent upon the item satisfying the Conditional Breakage Protocol defined below.

  **2. DEFINITIONS**
  **2.1 Fragile State:** An item is deemed "Fragile" if and only if, were it to be subjected to a Standard Kinetic Input, the item would cease to maintain structural integrity.
  **2.2 Standard Kinetic Input:** A sharp strike delivered by a calibrated implement of moderate mass at a velocity deemed appropriate for the item class.
  **2.3 Structural Integrity:** The state of remaining whole, uncracked, and functional.

  **3. UNDERWRITING CLAUSES**
  **3.1 Interventional Buffering:** If an item satisfies the Fragile State definition but is surrounded by shock-absorbing material at the time of Impact, the item is reclassified as "Protected." Claims for Protected items are denied unless the buffering material fails prior to energy transfer. The Insurer reserves the right to declare buffering material insufficient if breakage occurs, thereby retroactively validating the Fragile State.
  **3.2 Intrinsic Stability Override:** If an item fails to break upon Standard Kinetic Input, it is presumed not to have been in a Fragile State at the time of certification, regardless of material composition. However, if the item subsequently crumbles without impact, the Fragile State is deemed to have been latent and uncertifiable.
  **3.3 Input Calibration Adjustment:** In instances where the Standard Kinetic Input fails to produce breakage on an item certified as Fragile, the Adjuster may recalibrate the velocity of the Input retroactively to align with the expected outcome. If the item breaks under recalibration, the original Input is deemed to have been sub-standard.
  **3.4 Material Constitution Provision:** Should the Conditional Breakage Protocol yield inconsistent results, Fragility shall be determined by the item's molecular lattice structure. Items composed of glass, thin ceramic, or brittle polymer are presumptively Fragile regardless of Impact response.
  **3.5 Appraiser Expectation Standard:** In the absence of clear Material Constitution data, Fragility is established by the Reasonable Expectation of a Competent Appraiser. If a Competent Appraiser would expect breakage, the item is Fragile, even if the item demonstrably survives Standard Kinetic Input.

  **4. EXCLUSIONS**
  Coverage is denied for:
  (a) Items that lose their Fragile State precisely at the moment of Impact due to self-hardening mechanisms.
  (b) Items that break due to internal explosives rather than structural weakness.
  (c) Items where the strike mechanism is too dull to qualify as Standard Kinetic Input, as determined post-breakage.

  **5. ANNEX: SAMPLE DENIED CLAIMS**
  **Claim ID 9901:** Crystal vase survived impact due to protective bubble wrap. *Denial Reason:* Item did not break; therefore, not Fragile per Definition 2.1. Buffering excluded under Clause 3.1.
  **Claim ID 9902:** Plastic replica shattered upon impact. *Denial Reason:* Material Constitution (Plastic) does not support Fragile State per Clause 3.4. Breakage attributed to manufacturing defect (Mimic).
  **Claim ID 9903:** Glass sphere hardened upon approach of hammer. *Denial Reason:* Self-hardening exclusion 4(a). Item was never Fragile because it would not have broken had the strike occurred.

  ***

  **EXPLANATORY NOTE**

  This parody maps the collapse of the simple conditional analysis of dispositions (fragility = if struck, then break). Clause 3.1 addresses "masks" (external factors preventing the manifestation). Clause 3.5 and the shift to 3.4 reflect the retreat to intrinsic categorical bases (material composition) when counterfactuals fail. Clause 5, Claim 9903 parodies "finks" (dispositions that vanish when triggered). The slipping definition of "Standard Kinetic Input" mocks the difficulty of specifying ideal stimulus conditions. In contemporary metaphysics, the simple conditional analysis is largely considered refuted due to these counterexamples. However, what replaces it is disputed: some argue for a return to intrinsic powers or causal bases, while others propose complex conditional analyses with "ceteris paribus" clauses. The manual's retreat to "Appraiser Expectation" satirizes the move toward epistemic or normative accounts when ontological definitions fail.
