answer: |-
  This is a classic collision between **technocratic policy analysis** (your question about incentives and magnitudes) and **moral framing** (the slogan about status and dignity). You are right to feel that the slogan did not answer your question, but it wasn't necessarily intended to. It was intended to change the terms of the debate.

  Here is the breakdown of the phrase "No human being is illegal" as requested, followed by an analysis of why it fails to address your specific concern about migration flows.

  ### Candidate Readings of "No Human Being Is Illegal"

  **1. The Linguistic/Category Mistake Reading**
  *   **The Claim:** "Illegal" is an adjective that properly modifies *actions*, not *ontological states*. A person can perform an illegal act (crossing a border without documentation), but a person cannot *be* illegal, just as a person cannot be "jaywalking" or "speeding."
  *   **Classification:** **Platitude / Linguistic Truth.** Grammatically and logically, this is correct.
  *   **What People Mean:** Rarely do rally-shouters mean this literally. They know everyone understands the shorthand. They use this reading to point out the dehumanizing grammar of the opposition, but it is mostly a rhetorical setup for the moral claims below.

  **2. The Legal/Criminal Status Reading**
  *   **The Claim:** In this jurisdiction, unauthorized presence is a civil violation, not a criminal offense. Therefore, labeling a person "illegal" implies they are a criminal, which is factually incorrect under the law.
  *   **Classification:** **Substantive / Context-Dependent.** In the U.S., unlawful entry is a misdemeanor (8 U.S.C. § 1325), but unlawful *presence* is generally a civil matter. However, laws vary by country and specific circumstances.
  *   **What People Mean:** Legal advocates mean this. Rally shouters usually do not know the statute code. They use it to imply "These people are not criminals," which is a defense against harsh enforcement policies.

  **3. The Moral Ontology Reading**
  *   **The Claim:** Human dignity and moral worth are intrinsic and do not depend on state recognition or paperwork. A state may have the *power* to deport someone, but it does not have the *moral authority* to render them outside the sphere of human obligation.
  *   **Classification:** **Substantive / Defensible.** This is a philosophical claim rooted in human rights theory. It is not empirically testable, but it is a coherent ethical stance.
  *   **What People Mean:** **This is the primary meaning.** When shouted in a crowd, this is a signal of solidarity. It asserts that the group's moral obligation to the undocumented supersedes the state's legal classification of them.

  **4. The Jurisdictional Limit Reading**
  *   **The Claim:** States lack the standing to criminalize mere presence or movement. This leans on international law (e.g., The Universal Declaration of Human Rights, Article 13: "Everyone has the right to leave any country, including his own").
  *   **Classification:** **Controversial / Substantive.** International law is weak on the "right to enter," though strong on the "right to leave." This claim pushes the boundary of current sovereignty norms.
  *   **What People Mean:** Occasionally meant by activists, but usually too abstract for a general crowd. It serves as the intellectual backbone for Reading #3.

  ---

  ### Does Any Reading Answer Your Policy Question?

  **Your suspicion is correct.** None of these readings address the question of magnitudes or incentives.

  Your question was **positive** (empirical): *If we introduce variable X (cash), does it cause change in variable Y (migration flows)?*
  The slogan is **normative** (moral): *Regardless of variable Y, we have an obligation to treat people as Z (humans).*

  Here is why the slogan feels like an answer but isn't:

  **1. It Rejects the Relevance of the Question**
  The slogan implies that even if the answer to your question is "Yes, payments will increase migration," that outcome is morally irrelevant. The logic is: *We are not designing this policy to manage borders; we are designing it to alleviate suffering.* By shouting the slogan, the audience signaled that they view migration control as a secondary or illegitimate metric for this specific policy. They aren't saying migration won't happen; they are saying it shouldn't stop the payment.

  **2. It Frames the Question as Hostile**
  In the context of a rally or a heated council meeting, asking about migration incentives can be interpreted as a "dog whistle." The subtext heard by the audience is often: *"We shouldn't give them money because it will attract more of them."* The slogan is a defensive reflex to shut down what is perceived as an exclusionary argument. It treats the question not as a request for data, but as a challenge to the moral legitimacy of the recipients.

  **3. There Is No "Magnitude" Reading**
  There is no interpretation of "No human being is illegal" that contains an economic model of migration elasticity. It offers no prediction on whether a $500 monthly stipend acts as a pull factor compared to wage differentials, housing costs, or safety.

  **Is there a reading where it genuinely does the work?**
  Only one, and it is a stretch: **The "Fixed Population" Assumption.**
  If one interprets the slogan to mean "Undocumented people are already here and are not going anywhere regardless of policy," it implies migration flows are inelastic to small transfer payments. However, the slogan itself doesn't say that; that is an external economic assumption people might *hold* while shouting the slogan. The slogan itself remains silent on the mechanics of movement.

  ### Summary
  You were interrupted because you were playing chess (policy mechanics) while the room was playing rugby (moral positioning).

  *   **The Slogan:** A moral boundary marker. It asserts that human rights trump immigration enforcement status.
  *   **Your Question:** A policy stress test. It asks about unintended consequences.
  *   **The Conflict:** The slogan functions as a **conversation stopper** precisely because it renders your question moot in the eyes of the proponents. If no human is illegal, then the fear of attracting "illegal" humans is not a valid reason to withhold aid.

  You aren't missing a reading. The slogan is not designed to carry empirical weight; it is designed to carry moral weight. It answers "Why should we do this?" (Because they are human), not "What will this cost or cause?" (Which was your question).
