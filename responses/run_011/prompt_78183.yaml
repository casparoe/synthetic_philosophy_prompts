      *   **Conflict B: No Proxies (6) vs. Positive Duties (7) & Grounding (2).**
          *   *6 says:* I can't have it done by another.
          *   *7 says:* I have duties of aid based on impersonal suffering.
          *   *Case (b):* Paying a stranger is impermissible.
          *   *Tension:* If the grounding (2) is the victim's status, the victim is equally dead whether I pull the trigger or pay a stranger. If the grounding is impersonal, why does *my* relation to the act matter so much (Commitment 1)? Commitment 1 admits agent-relativity. Commitment 6 reinforces it. But Commitment 2 says the *wrongness* is about the victim's status (impersonal).
          *   *Deeper Tension:* If I have a positive duty to prevent suffering (7), and I can prevent 10 deaths by paying a stranger (b), why is it impermissible? Commitment 6 blocks it. But Commitment 7 demands aid. If the threshold is crossed (1 vs 10 in Case a), the act is permissible. Why does the *mode* (proxy) make it impermissible if the victim's status is the ground?
          *   *Specific Conflict:* 6 vs 1 & 2. 1 says constraints regulate *what I do*. 6 says I can't procure it. This is consistent. But 2 says the *wrongness* is about the victim. If the victim is wronged equally by proxy, and the threshold is met (10 saved), why is proxy forbidden?
