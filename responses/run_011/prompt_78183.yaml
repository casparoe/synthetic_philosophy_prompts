          *   *Crucial Point:* Commitment 2 rejects "clean hands" (agent-focused). It grounds it in the *victim*. But Commitment 5 says the prohibition is lifted based on a threshold. If the ground is the victim's inviolability, how is that inviolability suspended by a count of *other* victims? This looks suspiciously like the victim's status is contingent on the global state of affairs, which threatens the "impersonal status" claim in 2.
