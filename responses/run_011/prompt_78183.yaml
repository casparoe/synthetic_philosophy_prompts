      *   3. *Thresholds:* Constraints not absolute. Grave prevention allows violation. Threshold fixed by grounding considerations (victim status), not utility.
      *   4. *Schedule (Tariff):* Within type = numerical (kill 1 to save N). Across type = lexical (no killing to save thefts; lying OK to save torture).
      *   5. *Content/Lifting:* DDE-ish (intentional harm prohibited). Threshold crossing = prohibition *lifted* (act falls outside constraint), not *outweighed*. Lifting is not a proportionality judgment about the harm *I* inflict.
      *   6. *No proxies:* Can't procure violation through others.
      *   7. *Positive duties:* Imperfect duties of aid based on impersonal suffering/violation in the world.
      *   8. *Vagueness:* Thresholds vague. Borderline cases exist.
      *   9. *No collapse:* Sub-threshold vs. Super-threshold is categorical, not degree. Below threshold, consideration is *excluded*, not outweighed.

  3.  **Analyze the Case Verdicts (a-d):**
      *   (a) Kill 1 (brother) to save 10 (captives). Verdict: Permissible (1 vs 10, within type).
      *   (b) Pay stranger to kill 1 (brother) to save 10. Verdict: Impermissible (No proxies).
      *   (c) Harvest 1 organ to save 5. Verdict: Permissible *in principle* (if empirical conditions met).
