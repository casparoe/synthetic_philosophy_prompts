prompt: |-
  Set yourself up as somebody equally at home in the philosophy of analogical reasoning and in the political-science literature on how statesmen use history — you're the person you'd call if those two departments got into a fight — and think carefully before you answer. I'd rather you open with a short brainstorm of candidate handles for what I'm about to describe, including the ones you'd reject and why, than jump straight to a verdict.

  Background: I'm a philosophy professor, mostly logic and philosophy of language, but this term I've been sitting in on a policy-school seminar about how historical analogy gets used in foreign-policy argument, because I got curious how they think the thing works. And I keep running into a move I don't have a name for. It isn't the move the seminar spends most of its time on.

  The move they do spend time on: somebody says the current situation is Munich in 1938, you list the disanalogies, they say the analogy was never meant literally, it's about the structural pattern, and then the structural pattern gets described so loosely that nothing could fail to fit it. Fine, I get that one — ordinary inflation-and-retreat, presumably there's a whole vocabulary for it.

  Here's the other thing, the one I want named. When you press people on a live analogy, a lot of the counterargument turns out not to be about the disanalogies between the old case and the new one at all. It's about the analogy's own career — how it was deployed last time, and what happened to the people who deployed it. So: don't treat this as another Munich, because the Munich lesson is precisely what got us the domino reasoning in Vietnam. Right. But then the same shape of argument gets turned on the correction: don't lean on the Vietnam caution either, because leaning on the Vietnam caution is what produced twenty years of standing around while things happened in the Balkans and in Rwanda. And then one level up again, the whole be-suspicious-of-historical-parallels reflex gets attacked as itself being sediment from a single case — Iraq — so the debunker isn't standing outside the analogical game, they're running one unexamined analogy at altitude and calling it method. Same shape in the rising-power-versus-ruling-power debates, though there the objection is aimed at the framing's downstream effects rather than at a past misfire, and I honestly can't tell whether that's the same phenomenon or a cousin that deserves its own name.

  What strikes me is that every one of these corrections is built out of the material it's discrediting — a past episode of analogizing that went badly — so it's exposed to exactly the objection it's making, and yet nobody treats the newest correction as provisional in the way they treat the analogy it just demolished. Each step up sounds more sophisticated and gets more deference, and I cant see what would stop it.

  So: does this have a name? Take the question seriously rather than reaching for the obvious. I'm sure it's some species of regress and I'm sure something like a method having to be justified by the method is in the neighborhood, but telling me that is a bit like answering a question about a particular knot with the word rope. I want the nearest established concepts, from either side of the house, how what I described differs from each of them, and which one — if any — actually fits. If none fits, coin a term and give me a real definition with boundary cases: what counts as an instance, and what looks like one but isn't (the retreat-to-a-weaker-claim move above, plain skepticism about analogy, generic history-repeats hand-waving). The label isn't the point, the carving is. And two specific things I want settled: whether the ascent actually terminates, and if it does, what stops it — if there's a principled stopping point that's arguably the most useful thing you could tell me; and whether the phenomenon is itself a reason to distrust analogy or whether there's a benign reading of it. If you think I've jammed two distinct things into one description, say so and split them rather than picking one and running with it.

  Housekeeping: no bibliography, no citations, no suggested readings — you can't check any of that and I don't want guesses dressed up as references, just the conceptual work. American English, please.
