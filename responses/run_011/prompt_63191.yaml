      *   Addressed all bullet points in the "What I am after" section? Yes.

  *(Self-Correction on Point 7)*: Point 7 is tricky. A woman volunteers, quits, then is compelled. This looks like contract law (reliance damages) but operates like public law (conscription). I need to highlight this tension. It suggests the state views the *commitment* itself as creating the liability, whereas for men, liability is pre-existing.

  *(Self-Correction on Point 6)*: The repeal of JW exemption suggests a move towards "blind" neutrality. But keeping the male-only draft is "blind" to individual capacity but "sighted" on sex. This is a major theoretical tension to highlight.

  *(Refining the "Four Claims")*:
  1. Obligation is ascriptive (status), not consensual.
  2. Conscience is epistemologically inaccessible, so it is economically priced.
