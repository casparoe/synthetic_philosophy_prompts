      *   *Check:* Did I address the "Prisoners of Conscience" vs. "Equivalent Burden" argument? *Correction:* Frame this as the tension between *Deterrence* and *Equivalence*.
      *   *Check:* British English? (e.g., "defence," "programme," "licence").
      *   *Check:* No citations? (Ensure no names like Rawls, Nozick, Hegel are dropped).
