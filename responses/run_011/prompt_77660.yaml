  The Precautionary Principle dictates that lack of full scientific certainty shall not postpone cost-effective measures to prevent harm. This covers the low-cost side of your observation perfectly, validating action under uncertainty. It cannot, however, explain the high-cost skepticism; indeed, this phenomenon functions as a strategic violation of the principle that is justified by claiming the principle's conditions are not met when costs rise. It describes the norm being violated, not the mechanism of violation.

  The residue
  None of these concepts capture the specific directional asymmetry wrapped in evidential clothing. Motivated reasoning implies bias but not necessarily a structured shift in evidentiary thresholds based on cost. Pragmatic encroachment validates stakes-sensitive reasoning but does not critique the concealment of those stakes. The residue is the *dissimulation*: the act of dressing a pragmatic veto as an epistemic limitation. Existing terms describe either the bias, the stakes, or the outcome, but none describe the specific rhetorical move where the burden of proof migrates solely to protect capital while claiming to protect scientific rigor. The phenomenon is not just that stakes matter, but that their influence is denied. It is a specific form of intellectual dishonesty. It creates a situation where science appears to drive policy, while policy costs actually drive the science interpretation. This inversion is the core residue left unnamed by existing frameworks. It distinguishes the phenomenon from honest policy trade-offs where costs are openly weighed against welfare gains.

  A name and a definition
  Term: **Cost-Contingent Epistemic Shifting**.
  Definition: The practice of varying the threshold of evidence required to establish a claim based inversely on the economic cost of accepting that claim, while presenting the variation as an objective assessment of scientific certainty.
  Conditions: Apply when evidentiary standards tighten as compliance costs rise and loosen as costs fall, provided the justification cites scientific uncertainty rather than economic trade-offs. The term applies only where the shift is systematic and the pragmatic driver is unacknowledged. It distinguishes this from honest stake-sensitive reasoning where the pragmatic influence is admitted. It is specifically suited for regulatory science contexts where welfare claims intersect with industrial economics. This term isolates the asymmetry you identified, marking the transition from precaution to skepticism as a function of price rather than proof.

  Boundary cases
  The regulator adopting cheap precaution acts consistently with the precautionary principle; this is not shifting, but stable caution across low-cost scenarios. The anaesthetist treating infant pain responses as real despite uncertainty follows medical ethics' default to patient safety; the stakes (health) are constant, not cost-contingent, and the precaution is universal rather than selective. The researcher lowering confidence due to better evidence performs genuine epistemic updating; the shift tracks data quality, not economic implication, representing scientific progress rather than strategic maneuvering. The researcher resisting insect sentience due to unmanageability rather than cost distinguishes logistical feasibility from economic expense. If the refusal is based on system collapse rather than profit margin, it is a scalability argument, not cost-contingent shifting. However, if unmanageability is merely a proxy for cost, it falls back within the definition. The key distinction lies in whether the barrier is physical impossibility or financial unwillingness disguised as impossibility. Only the latter qualifies as the phenomenon. In the anaesthetist case, the cost of action is irrelevant to the epistemic status of pain; in your fish cases, the cost dictates the epistemic status. The insect case tests the limits of cost; if the implication is truly unmanageable, the skepticism may be pragmatic but honest. If it is merely expensive, the skepticism is contingent. The regulator case shows the baseline from which the shift deviates. In the boundary cases, the epistemic standard remains stable while the context changes, or the standard changes for valid evidential reasons. In your phenomenon, the context (cost) changes the standard (evidence) without admission. The anaesthetist does not demand more proof of infant pain because anaesthesia is expensive; they act regardless. This stability contrasts sharply with the fish literature, where the proof required expands to match the price tag. Thus, the boundary cases highlight the inconsistency inherent in the phenomenon by demonstrating what consistent reasoning looks like.
