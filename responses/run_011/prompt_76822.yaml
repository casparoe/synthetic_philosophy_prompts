answer: |-
  ### Brainstorming Candidate Presuppositions

  **Candidate Presuppositions:**
  1.  Geologic time is continuous and divisible into discrete, real units.
  2.  Boundaries are instantaneous moments (isochrons) existing independently of measurement.
  3.  Physical rock sections can perfectly capture instantaneous moments.
  4.  Global synchrony is achievable via local markers.
  5.  Human accessibility is a condition of scientific validity.
  6.  Voting discovers the correct boundary.
  7.  Voting constitutes the boundary.
  8.  Anthropogenic signals are distinct from natural signals.
  9.  Stratigraphic thickness correlates with temporal significance.
  10. A unit must be closed (completed) to be defined.

  **Discarded (Practice could survive without):**
  *   *Human accessibility:* This is pragmatic, not metaphysical. The practice could survive if sites were inaccessible but sampled remotely, though utility would drop.
  *   *Voting discovers truth:* The practice functions equally well if voting is constitutive (making the fact) rather than epistemic (finding the fact).
  *   *Anthropogenic signals are distinct:* The practice treats plutonium as a marker akin to a fossil; the ontology of the source matters less than its stratigraphic utility.
  *   *Thickness correlates with significance:* The deep-time fallback to numerical ages proves significance can be defined without rock thickness.

  **Retained (Core Presuppositions):**
  *   Time is measurable via physical traces.
  *   Boundaries require global correlatability.
  *   Consensus is required for standardization.
  *   Material anchors are preferred over abstract numbers when available.

  ***

  ### Reconstruction of the Theory of Geological Time

  **1. The Presupposed Theory**
  The practice of the International Commission on Stratigraphy (ICS) presupposes a hybrid metaphysics of time that blends realism with operationalism. First, it claims **temporal realism**: geologic time is a continuous, pre-existing dimension that comes "pre-jointed" into natural units (epochs, stages). Boundaries are not arbitrary cuts but reflect genuine shifts in Earth's system state. Second, it claims **spatiotemporal anchoring**: an instantaneous moment in time cannot be defined abstractly; it must be instantiated in a physical location. A boundary is not a number until it is a place. This implies that time is not uniform everywhere but must be correlated across space via **isochrons** (lines connecting points of equal age).

  Third, the practice assumes **marker sufficiency**: a specific physical change (a fossil appearance, an isotopic shift) can serve as a proxy for the boundary moment itself. The marker is not the boundary but stands in for it. Finally, it presupposes **consensual validation**: while the boundary exists independently, its identification requires communal agreement. The theory holds that while nature provides the joints, science must agree on where to place the knife.

  **2. Strict Presuppositions vs. Comfortable Fits**
  Strictly speaking, the practice requires only **global correlatability** and a **definable horizon**. The criteria regarding accessibility, protection, and thickness are comfortable fits rather than strict necessities; they ensure utility and longevity but are not metaphysical requirements for time itself. The practice is philosophically underdetermined regarding the status of the boundary. A **realist** interpretation holds the committee discovers the only correct point. A **conventionalist** interpretation holds the committee selects the most useful point among many candidates. Both views license the exact same procedure: examining sections, voting, and ratifying. The machinery does not distinguish between finding a fact and making a standard.

  **3. Ruled-Out Views of Periodization**
  The practice quietly rules out **disciplinary pluralism** and **purely numerical periodization** for the recent past. By insisting on a single Global Boundary Stratotype Section and Point (GSSP)—a "golden spike"—the ICS asserts that there is one legitimate geologic time scale for all users. This rules out the historians' view that periodization should serve human cultural narratives (e.g., the Neolithic). It also rules out defining recent time solely by numerical age (e.g., "1950 CE"), despite using that method for deep time (>630 million years ago). These views are ruled out largely by **institutional design** rather than argument. The voting structure assumes a single winner, and the criteria prioritize rock records over calendar dates for the Phanerozoic eon, implicitly claiming that rock-based time is scientifically superior to number-based time for recent epochs.

  **4. Assessment of Consistency and Tensions**
  The practice contains significant internal tensions that challenge its coherence.

  *   **Accessibility and Voting:** The requirement that a boundary be reachable and ratified by vote tensions with the idea of natural kinds. If boundaries are natural facts, human access should be irrelevant. However, this is consistent if viewed operationally: a boundary that cannot be studied cannot function as a standard. The vote is not about truth but about standardization.
  *   **Anthropogenic Markers:** The objection that plutonium is an artifact rather than a natural process assumes a nature/culture dualism that stratigraphy otherwise ignores. Fossils are also biological artifacts. The practice is consistent here if "natural" means "physical trace in the Earth system," regardless of origin. The tension arises only if one insists geology must exclude human agency.
  *   **Open vs. Closed Intervals:** The "too recent" objection assumes an epoch must be a closed interval with a completed record. This is inconsistent with the nature of the present. The Holocene was defined while ongoing; rejecting the Anthropocene for being open-ended implies a shift in metaphysical criteria mid-stream. This suggests the objection is not about time but about significance—implying the unit lacks temporal depth to be "real."
  *   **Deep-Time Fallback vs. Recent Rigor:** The commission uses fixed numerical ages for deep time where rock is degraded, yet rejects numerical fixes for the Anthropocene despite having precise dates (1950). This is a stark inconsistency. It suggests the preference for rock sections is aesthetic or traditional rather than epistemic. The practice privileges materiality over precision when precision is available, which undermines the claim that the goal is purely accurate timekeeping.

  **5. Authority and Constitution**
  The supermajority procedure presupposes that **epistemic authority is collective**. It assumes no single researcher can identify the boundary alone; truth is emergent from committee consensus. This raises a question: is the committee an epistemic authority (knowing a fact) or a constitutive authority (making a fact)? The practice works best if viewed as **partly constitutive**. The boundary exists as a potential joint in nature, but the specific point becomes *the* boundary only through ratification. If the fact were entirely independent, a vote would be unnecessary (one would simply measure). If the fact were entirely dependent, voting would be purely political. The practice occupies a middle ground: the committee selects the best candidate to *serve* as the boundary, thereby constituting the standard while claiming it reflects natural reality. This grants the body the power to fix reality for scientific purposes without claiming to create the physical traces themselves.

  **6. Alternative Regimes: Conventionalism and Pluralism**
  Replacing the current view with **explicit conventionalism** would require changing the vocabulary from "defining boundaries" to "establishing standards." The chart would list rationales for choices alongside the markers, acknowledging revisability. **Pluralism** would allow multiple Anthropocenes (e.g., an "Early Anthropocene" for archaeologists, a "Nuclear Anthropocene" for geologists), indexed to different explanatory questions.

  **Gains:** Conventionalism would increase honesty about the role of human judgment, reducing metaphysical friction when markers fail (as with the Cambrian trace fossil). Pluralism would accommodate the legitimate needs of historians and earth scientists without forcing a single narrative.

  **Losses:** The primary loss is **standardization**. The current system provides a single reference language for global science. Pluralism risks fragmentation; conventionalism risks undermining the perceived objectivity of the time scale.

  **Stratigrapher Objections:** Working stratigraphers would object that pluralism destroys the utility of the chart as a communication tool. They argue that without a single spike, correlation becomes impossible. However, this objection conflates *communication* with *ontological singularity*. One could communicate multiple indices without chaos. They would also argue that conventionalism undermines the authority of the commission. Yet, the Anthropocene rejection shows that authority is already fragile. A regime admitting its own conventionality might be more robust against political pushback, as it would not claim to dictate history but only to offer a useful geological tool. The current machinery tries to be both a mirror of nature and a rulebook for science; separating these functions might resolve the tensions inherent in the golden spike.
