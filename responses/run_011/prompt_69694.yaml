answer: |-
  (a) **The Account: Settled-Pool Self-Sampling (SPSS)**

  This account is a restricted version of the Self-Sampling Assumption. It permits Bayesian updating on indexical information (like birth rank) only when specific causal and ontological conditions are met. It explicitly rejects the Self-Indication Assumption (updating on mere existence).

  **1. The Update Rule**
  Let $H$ be a hypothesis about the world (e.g., "Total humans = 100 billion").
  Let $E$ be your indexical evidence (e.g., "My birth rank is 60 billion").
  Your posterior credence is:
  $$P(H | E) = \frac{P(E | H) \cdot P(H)}{\sum P(E | H_i) \cdot P(H_i)}$$

  **2. The Likelihood Condition ($P(E | H)$)**
  You assign $P(E | H) = 1/N_H$ (where $N_H$ is the total number of observers in the reference class under $H$) **if and only if** the following three conditions are met. If any condition fails, $P(E | H) = 1$ (i.e., the evidence provides no discrimination between hypotheses).

  *   **Condition A (Settled Pool):** The total number of observers $N_H$ in the reference class must be an ontologically settled fact at the time you receive the evidence. It cannot depend on future contingent events or undecided decisions.
  *   **Condition B (Causal Independence):** Your arrival at your specific position in the ordering must be causally independent of the total size $N_H$. You must not exist *because* $N_H$ is large (e.g., you were not created specifically to fill a slot in a large population).
  *   **Condition C (Unbiased Channel):** The process by which you learned your rank must be a random sample from the reference class, or equivalent to one. (e.g., you did not seek out the information because you suspected you were early/late).

  **3. The Reference Class Procedure**
  To determine the reference class:
  1.  Identify the physical kind that defines your observer-moment (e.g., "biological human," "conscious substrate").
  2.  Include all members of that kind that exist within the causal domain defined by the hypothesis $H$.
  3.  Exclude any entities whose existence is contingent on future decisions not yet made at the time of observation.

  **4. The Existence Block**
  Mere existence is never evidence. $P(\text{I exist} | H) = 1$ for all $H$ where you exist. You cannot update on the fact that there are many observers rather than few, only on *where* you are located among them, and only if the Settled Pool condition is met.

  ***

  (b) **Verdicts on Cases 1–8**

  **1. Urn:** **Reproduced.**
  *   *Reasoning:* The number of balls $N$ is a fixed physical fact (Condition A). The draw is explicitly random (Condition C).
  *   *Result:* Strong update toward smaller $N$.

  **2. Restricted Amnesia:** **Contradicted.**
  *   *Reasoning:* Under SPSS, Condition A fails. In the hypothesis where humanity continues for a million years, the total population is *not* an ontologically settled fact at the time you wake up (rank 60 billion); it depends on future survival. Therefore, $P(E|H) = 1$ for both hypotheses. You cannot update.
  *   *Cost:* You must abandon the verdict that this is "decisive." It becomes neutral.
  *   *Balance:* **Give up the verdict.** The structural difference between this and Case 3 is negligible. In both, the "long future" hypothesis entails an unsettled total at the time of observation. Keeping the verdict here forces you to accept the Doomsday Argument in Case 3, which you strongly resist.

  **3. Real-world Doomsday:** **Reproduced.**
  *   *Reasoning:* Condition A fails. The total human population depends on future decisions (colonization, survival) that are not settled. Condition B is also suspect (your birth is causally linked to the factors that determine population size).
  *   *Result:* No update. Credence remains at prior.

  **4. Bare Existence:** **Reproduced.**
  *   *Reasoning:* Violates the Existence Block. Mere existence is not evidence.
  *   *Result:* Credence stays fixed.

  **5. Populated Theory:** **Reproduced.**
  *   *Reasoning:* Violates the Existence Block. A theory is not confirmed merely because it predicts more observers who could be you.
  *   *Result:* No confirmation boost for the populous theory.

  **6. The Sleeper:** **Reproduced.**
  *   *Reasoning:* This is a "Self-Location" case without a "Settled Pool" of wakings in the relevant sense. Under SPSS (and standard SSA), you treat the waking as a random sample from *wakings*, but since the coin flip determines the number of wakings, and you exist in both branches, the Existence Block prevents updating on "I am awake." If you treat it as a rank problem, you don't know your rank (Monday vs Tuesday) without further info.
  *   *Result:* Credence stays 1/2.

  **7. Copies:** **Reproduced (with clarification).**
  *   *Reasoning:*
      *   *Belief:* If you know there are 1 million duplicates and you are one of them, Condition A is met (the copies exist now). You should assign probability $1/1,000,000$ to being any specific duplicate. Counting bears on belief.
      *   *Value:* Value is not a function of reference class frequencies. The badness of death is a property of the subject undergoing it. The existence of other subjects does not aggregate to make one subject's death worse.
  *   *Result:* Belief updates on numbers; Value does not.

  **8. Earliness among the Stars:** **Reproduced.**
  *   *Reasoning:* Condition A fails. The total number of technological civilizations is a future-contingent outcome, not a settled pool.
  *   *Result:* No update. Your earliness is not evidence of scarcity.

  ***

  (c) **Diagnosis of Pairs**

  **Cases 1 & 2 vs. Cases 3 & 8**
  *   **The Difference:** It is not merely comfort; it is the **Settled vs. Contingent** distinction.
      *   In Case 1 (Urn), $N$ is a fixed parameter of the physical setup before the draw.
      *   In Case 2 (Amnesia), although it feels like Case 1, the "Long Future" hypothesis describes a world where $N$ is *not* fixed at the time of your observation. You are treating the hypothesis *description* as a fixed parameter, but ontologically, it is not.
      *   In Cases 3 & 8, the contingency is obvious (future decisions, survival).
  *   **The Diagnostic Test:** To apply this to an unknown case, ask: *"If the 'Large Total' hypothesis is true, is that total already determined by past/present facts, or does it rely on future events that haven't happened yet?"*
      *   If determined (Urn): Update.
      *   If reliant on future events (Humanity, Civilizations): Do not update.
  *   **Assessment:** You are right to feel a difference between 1 and 3, but you are wrong to place 2 with 1. Case 2 is epistemically sealed (stipulated hypotheses), which masks the ontological openness. To maintain consistency, Case 2 must be grouped with 3 and 8.

  **Cases 3 & 8**
  *   **The Difference:** There is no relevant difference. Both fail Condition A. If you accept the verdict in 3, you must accept it in 8. The reference class ("Humans" vs "Civilizations") does not matter if the pool is unsettled in both.

  ***

  (d) **Case 7: Belief vs. Value**

  **Can they come apart?**
  Yes. They track different relations.
  *   **Belief** tracks *Indexical Location*. When duplicates exist, the question "Which one am I?" has more possible answers. Probability is distributed over the set of candidates. If the set grows, the probability of being any specific candidate shrinks. This is a logical consequence of indifference over identical candidates.
  *   **Value** tracks *Subjective Welfare*. The badness of an outcome is determined by what happens to the subjects. If Duplicate A dies, the badness is the loss of A's future. The existence of Duplicate B does not amplify the loss of A. Aggregation applies to *total* utility across a population, but not to the *magnitude* of a harm to a single individual based on how many peers they have.
  *   **Resolution:** You do not need to abandon either verdict. Belief is responsive to the *size of the possibility space* (which grows with duplicates). Value is responsive to the *content of the outcome* (which does not change for the specific victim). The "Counting" in belief is about *probability mass*; the "Non-Counting" in value is about *moral weight per subject*.

  ***

  (e) **Application to New Situations**

  **1. Uploaded Minds**
  *   *Scenario:* Future members are synthetic. Does rank bear on total?
  *   *Verdict:* **No Update.**
  *   *Reasoning:* This fails Condition A (Settled Pool). Whether uploads happen is a future contingency. Furthermore, it challenges the Reference Class. If your reference class is "Biological Humans," uploads don't count, and the total is small (Doomsday applies). If your reference class is "Mind," the total is unsettled (Condition A fails). Given your resistance in Case 3, you should treat the transition to uploads as an open future variable. Your rank among biological humans tells you nothing about the total number of minds.

  **2. The Historian's Selection**
  *   *Scenario:* You learn your rank because a historian studied your cohort.
  *   *Verdict:* **No Update (or Weak Update).**
  *   *Reasoning:* This risks failing Condition C (Unbiased Channel). If the historian chose your cohort *because* it was a turning point (e.g., the 60 billionth mark), the sampling is biased. If the historian chose a random cohort and *then* revealed the rank, it is valid. However, since you only know the rank *because* it was studied, you must condition on "I am in a studied cohort." If studied cohorts are more likely to be early (historians study origins more than endpoints), this biases the sample. Without assurance of random selection of the *information channel*, SPSS blocks the update.

  **3. The Colony Decision**
  *   *Scenario:* Your decision settles the total (100B vs 100Q).
  *   *Verdict:* **No Decision Reason from Rank.**
  *   *Reasoning:* This creates a causal loop. If your decision determines $N$, then $N$ is not settled prior to your observation (Condition A fails). You cannot use your rank as evidence to make the decision that determines the total, because your rank is only meaningful evidence if the total is independent of you.
  *   *Normative Implication:* You must decide based on the *value* of the outcomes (100B lives vs 100Q lives), not on the probability of being in one or the other derived from your rank. SPSS forbids using the Doomsday inference to justify limiting the colony. You should choose the outcome with higher expected value, ignoring the rank argument.

  ***

  (f) **The Single Amendment**

  **The Amendment:**
  Replace "genuinely chance-driven" with **"ontologically settled at the time of observation."**

  **Your Tentative Principle:**
  "Update on my position in an ordering only when the ordering is genuinely chance-driven... and only when the reference class is fixed by a natural kind..."

  **The Problem:**
  "Chance-driven" is ambiguous. Case 2 (Amnesia) feels chance-driven because the hypotheses are stipulated, but it is not ontologically settled. Case 3 (Real World) is not chance-driven. This allows you to keep Case 2 and reject Case 3, but it is inconsistent.

  **The Fix:**
  "**Update on my position in an ordering only when the total size of the reference class is an ontologically settled fact (determined by past or present states) at the time I receive the evidence.**"

  **Verdicts Surrendered:**
  1.  **Case 2 (Restricted Amnesia):** You must abandon the view that this is decisive. It becomes neutral, just like Case 3.
  2.  **Case 1 (Urn) Nuance:** You must ensure the Urn's $N$ is fixed *before* the draw (which it is), so Case 1 stands.
  3.  **Case 7 (Copies):** You must ensure the copies exist *before* you reason (which they do), so Belief Update stands.

  **Why this buys consistency:**
  It draws a sharp line between **closed systems** (Urns, existing duplicates) where frequencies are real physical facts you can sample from, and **open systems** (Humanity's future, Civilizations) where frequencies are counterfactual outcomes of decisions. It aligns your epistemology with the causal structure of the world, preventing you from treating future possibilities as if they were past frequencies. It forces you to concede that the "Pure Doomsday" (Case 2) is an illusion created by stipulating the future as if it were the past.
