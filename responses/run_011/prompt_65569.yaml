          1.  Working Notes (few hundred words): Analyze the argument's validity, premises, empirical claims, person-affecting vs. impersonal frameworks, and identify the *single crux* for the question.
          2.  Exam Question: Instructions, marks (25), time (75 mins), framing.
          3.  Model Answer: ~1,200 words, undergraduate level, self-contained, engages strongest version, concludes on the "mistake" claim.
          4.  Marking Scheme: 6 named "must-hit" moves totaling 25 marks, with notes on common errors.
          5.  Grade Boundaries: Descriptions for 22/25, 16/25, 10/25, and instructions for 0 marks (specifically regarding recitation).
      *   **Constraint:** The argument must be presented exactly as provided. The question must not give away the flaw. The model answer must not cite external sources (unseen exam).
      *   **Goal:** Prevent "recitation" essays (like last year) and force analysis of the *provided argument*.

  2.  **Deconstruct the "Generous Neolithic" Argument (Working Notes Phase):**
      *   *Premise 1:* Mistake = comparative worse-offness. (Standard counterfactual account of harm).
      *   *Premise 2:* Affected = early farmers + all descendants (us).
      *   *Premise 3:* Non-identity problem setup. No transition = different people (or no people) due to population size constraints.
      *   *Premise 4:* Existence > Non-existence (for lives worth living).
      *   *Premise 5:* Interim conclusion: Early farmers/descendants better off existing than not.
      *   *Premise 6:* Total view utilitarianism. Quantity of lives outweighs quality/distribution issues.
      *   *Premise 7:* Conclusion: Transition not a mistake.
      *   *Premise 8:* Generalization: Carrying capacity increases are always improvements regardless of average welfare/distribution.
      *   *Validity:* The argument is *valid* in form (if you accept the premises), but it shifts frameworks. Steps 1-5 rely on a *person-affecting* view (better for *those* people to exist). Steps 6 & 8 rely on a *total view impersonal* utilitarianism (more lives = better).
      *   *The Crux:* The shift between Person-Affecting and Impersonal Total View (The Non-Identity Problem vs. The Repugnant Conclusion).
          *   Steps 1-5 try to solve the "harm to farmers" issue via Non-Identity (Parfit). If they wouldn't exist otherwise, they aren't harmed by being born into a harder life, provided life is worth living.
          *   Step 6 jumps to a Total View claim: *Any* number of worthwhile lives outweighs quality/distribution. This is the "Repugnant Conclusion" territory.
          *   *Empirical/Anthropological angle:* Premise 3 is empirically shaky (population pressure vs. intensification), but the philosophical crux is stronger for a seminar like this. The prompt asks to separate students who *understand the argument* from those who *dislike the conclusion*. Disliking the conclusion usually means pointing out the health costs (Diamond). Understanding the argument means seeing the population ethics trap.
          *   *Selection:* The crux is the incompatibility between the person-affecting logic of (1)-(5) and the impersonal total logic of (6)-(8). Specifically, (6) asserts a lexical priority of quantity over quality/distribution that doesn't follow from (4).
      *   *Why this crux?* It forces engagement with population ethics (which only 2 students have read, meaning everyone has to think from first principles) and prevents recitation of Sahlins/Diamond. It targets the *structure* of the reasoning.

  3.  **Drafting the Exam Question:**
      *   Need to include the 8 premises exactly.
      *   Instruction needs to be open enough to allow critique but specific enough to demand analysis of *this* argument.
      *   "Evaluate the soundness of the Generous Neolithic argument." (Too vague?)
      *   "Assess whether the conclusion follows from the premises." (Better).
      *   Let's go with: "Critically evaluate the Generous Neolithic argument. You may agree or disagree with the conclusion, but your mark depends on your analysis of the reasoning provided, not on your prior knowledge of the Neolithic."

  4.  **Drafting the Model Answer:**
      *   *Tone:* Excellent undergrad (smart, clear, not perfect professor prose).
      *   *Structure:*
          1.  Intro: Acknowledge the argument's power (blocks standard Diamond/Sahlins objections).
          2.  Analysis of 1-5 (Non-Identity): This block works if we accept existence is a benefit. It blocks the "farmers were harmed" claim.
          3.  Analysis of 6 (The Shift): This is the weak point. It moves from "better for those who exist" to "more existence is better regardless of quality."
          4.  Analysis of 8 (Generalization): Shows the absurdity (Repugnant Conclusion).
          5.  Empirical check (briefly): Premise 3 is contestable but less important than the ethical shift.
          6.  Conclusion: Agriculture might still be a "mistake" regarding quality of life, even if population increased.
      *   *Word Count:* Aim for ~1,200.
      *   *Constraint:* No citations.

  5.  **Drafting the Marking Scheme:**
      *   Need 6 moves.
      *   1. Identify the Non-Identity structure (1-5).
      *   2. Assess the "Existence is Better" premise (4).
      *   3. Identify the shift to Total Utilitarianism (6).
      *   4. Critique the lexical priority of quantity over quality (6).
      *   5. Address the empirical counterfactual (3) without relying on it as the sole objection.
