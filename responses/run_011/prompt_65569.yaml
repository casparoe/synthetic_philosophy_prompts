answer: |-
  ### Working Notes: Examiner's Analysis

  The "Generous Neolithic" argument is a hybrid construction. Premises (1) through (5) deploy a person-affecting restriction on harm, effectively utilizing the logic of the non-identity problem: if the agricultural transition is a necessary condition for the existence of current people, they cannot claim to be harmed by it provided their lives are worth living. This block is logically valid *if* one accepts premise (4), that existence is preferable to non-existence for lives above a certain threshold. It successfully blocks the standard Diamond-style objection that early farmers were "worse off" than foragers, because the counterfactual for those specific individuals is non-existence, not foraging.

  However, premise (6) introduces a category error. It shifts from a person-affecting claim (it was good *for them* to exist) to an impersonal total view claim (the *sum* of worthwhile lives outweighs negative features like health or freedom). Premise (4) establishes that existence is a good for the individual; it does not establish that maximizing the number of individuals is the supreme moral good regardless of average welfare. This is the argument's vulnerability. Premise (8) generalizes this into a form of total utilitarianism that entails the "repugnant conclusion"—that a massive population with barely worthwhile lives is better than a smaller, flourishing one.

  Empirically, premise (3) is contestable. Archaeological evidence suggests population pressure and intensification were co-constitutive, not strictly linear, and that some communities reverted to foraging. However, relying on empirical disproof risks returning students to the "recitation" mode (e.g., "Diamond says health declined"). The philosophical crux is stronger for distinguishing analytical ability. A student who merely dislikes the conclusion will cite dental caries and stature. A student who understands the argument will identify that the ethical framework shifts illicitly between (5) and (6).

  **Selected Crux:** The incompatibility between the person-affecting justification in premises 1–5 and the impersonal total view in premises 6–8.
  **Reasoning:** This crux forces students to analyze the *structure* of the reasoning rather than the *content* of the historical claims. It requires them to see that even if the non-identity logic holds (farmers weren't harmed), it does not license the totalizing claim that *any* population increase justifies *any* cost. This separates those who can trace an inference from those who simply recognize the topic.

  ***

  ### Examination Question

  **Time Allowed:** 75 Minutes
  **Marks Available:** 25

  **Instructions:**
  Read the following argument, titled "The Generous Neolithic," carefully. Answer the question below. You are not required to have prior knowledge of population ethics to answer this question successfully. Your mark will depend on your analysis of the reasoning provided in the text, not on your ability to recite course readings or archaeological data.

  **The Generous Neolithic Argument**

  1. Any verdict that a large-scale change in how a people lived was a mistake must be comparative: the change was a mistake for those affected only if they were worse off than they would have been had the change not occurred.
  2. Those affected by the agricultural transition are the inhabitants of the earliest farming villages and everyone descended from them — which is to say, all of us.
  3. Had the transition not occurred, none of those people would have existed, since the population sizes that made each of them possible depended on a food supply that foraging could not have produced in those places.
  4. For a person whose life is worth living, existing is better than never having existed.
  5. So the people affected by the agricultural transition were better off than they would have been had it not occurred.
  6. The transition also multiplied by orders of magnitude the total number of lives worth living, and no other feature of a change — not health, not stature, not leisure, not equality, not freedom from taxation or from war — can outweigh the addition of that many worthwhile lives.
  7. Therefore the agricultural transition was not a mistake. It was among the best things that happened to our species.
  8. And the reasoning generalises: any change that raises carrying capacity and thereby multiplies the number of worthwhile lives is an improvement, whatever it does to average welfare or to the distribution of that welfare.

  **Question:**
  Critically evaluate the Generous Neolithic argument. Assess whether the conclusion (7) follows from the premises, and whether the generalization (8) is supported by the reasoning provided. You may agree or disagree with the conclusion, but you must justify your position by analyzing the internal logic of the eight steps.

  ***

  ### Model Answer

  The Generous Neolithic argument is a sophisticated attempt to bypass the standard debate regarding the costs and benefits of agriculture. It does not deny the empirical claims often made by critics—such as declines in health, stature, or equality—but attempts to render them morally irrelevant through a specific structure of counterfactual reasoning. To evaluate it, we must distinguish between the argument's success in protecting the specific individuals involved (premises 1–5) and its leap to a general moral principle about population size (premises 6–8).

  The first half of the argument (1–5) relies on a person-affecting view of harm. Premise (1) establishes that a "mistake" requires a specific subject who is made worse off. Premises (2) and (3) invoke a demographic counterfactual: without agriculture, the specific individuals currently alive would not exist, as foraging could not sustain the population density required for their conception. If we accept premise (4)—that for a life worth living, existence is preferable to non-existence—then premise (5) follows logically. On this specific point, the argument is robust. It successfully neutralizes the complaint that early farmers were "harmed" by the transition. Even if their lives were harder than foragers', they were not harmed relative to the only available alternative: never having been born. This block of reasoning effectively blocks the Non-Identity Problem; we cannot claim agriculture was a mistake *for us*, because we are the beneficiaries of the population expansion it caused.

  However, the argument falters at the transition to premise (6). Here, the reasoning shifts from a person-affecting framework to an impersonal total view. Premise (5) concludes that existing people are better off existing. Premise (6) claims that the *multiplication* of these lives outweighs any negative features of those lives, such as poor health or inequality. This does not follow from the previous premises. That existence is a benefit to the individual (premise 4) does not entail that creating more individuals is the supreme moral good that trumps all other values.

  This shift creates a tension. If we are operating within the person-affecting framework of premises 1–5, we care about whether specific people are worse off. If we are operating within the total view of premise 6, we care about the aggregate sum of value. The argument attempts to use the person-affecting logic to shield the transition from the charge of harming specific people, but then uses the total view logic to claim the transition was a net positive "for our species." This is an illicit slide. One cannot simultaneously argue that we cannot complain because we exist (person-affecting) and that the world is better because there are more of us (impersonal total).

  Premise (8) exposes the danger of this shift. It generalizes the claim to state that *any* increase in carrying capacity is an improvement, regardless of average welfare or distribution. This leads to counter-intuitive results. If a technological change allowed for ten times the population but reduced every life to a state of barely tolerable subsistence, premise (8) would deem this an "improvement" over a smaller, flourishing population. Most ethical frameworks reject this lexical priority of quantity over quality. If the quality of life drops below a certain threshold, adding more lives does not constitute moral progress, even if those lives remain technically "worth living." Therefore, premise (6) is an unsupported assertion rather than a logical consequence of the earlier steps.

  There is also a fragility in the empirical claim of premise (3), though this is secondary to the ethical flaw. The premise assumes a strict dependency: no agriculture means no high population, which means no specific descendants. However, archaeological records suggest the transition was not a single switch but a gradual, reversible process in many regions. Population pressure may have driven intensification rather than vice versa. If the counterfactual in (3) is unstable—if people would have existed anyway under different demographic regimes—the non-identity shield weakens. But even granting (3) for the sake of argument, the ethical leap in (6) remains.

  In conclusion, the Generous Neolithic argument succeeds in showing that the agricultural transition was not a "mistake" in the narrow sense of harming specific existing individuals who would otherwise have been better off. It correctly identifies that we cannot claim to be victims of a transition that caused us. However, it fails to prove that the transition was "among the best things that happened to our species." That stronger claim relies on premise (6), which asserts that population quantity outweighs quality of life. Since this premise does not follow from the earlier logic and entails unacceptable generalizations in (8), the argument is unsound. Agriculture may not have been a mistake for *us* specifically, but it can still be judged as a mistake regarding the overall trajectory of human welfare, freedom, and health. The verdict depends on whether we value the number of lives or the quality of those lives more highly, and the argument provides no justification for prioritizing the former.

  ***

  ### Marking Scheme

  **Total Marks: 25**

  **1. Identification of the Person-Affecting Framework (1–5) [4 marks]**
  *   *Must Hit:* Candidate explains that premises 1–5 argue no specific individual was harmed because the alternative was non-existence.
  *   *Common Error:* Treating this as a standard utilitarian calculation rather than a counterfactual claim about identity.

  **2. Assessment of the "Existence is Better" Premise (4) [3 marks]**
  *   *Must Hit:* Candidate evaluates whether existence is necessarily a benefit, noting the condition "life worth living."
  *   *Common Error:* Dismissing premise 4 outright without engaging with the "worth living" qualifier.

  **3. Identification of the Framework Shift (5 to 6) [6 marks]**
  *   *Must Hit:* Candidate explicitly identifies the move from person-affecting logic (good for *them*) to impersonal total logic (good *sum total*).
  *   *Common Error:* Failing to notice the shift and treating the argument as consistent throughout.

  **4. Critique of the Lexical Priority of Quantity (6 & 8) [6 marks]**
  *   *Must Hit:* Candidate argues that multiplying lives does not automatically outweigh losses in health/quality (rejecting the generalization in 8).
  *   *Common Error:* Invoking the "Repugnant Conclusion" as a label without explaining why it applies here, or ignoring premise 8 entirely.

  **5. Engagement with Empirical Contingency (3) [3 marks]**
  *   *Must Hit:* Candidate notes that the counterfactual depends on empirical claims about population and conception, but keeps this secondary to the ethical critique.
  *   *Common Error:* Spending the entire essay debating archaeological evidence (Sahlins/Diamond) and ignoring the logic.

  **6. Final Verdict on the "Mistake" Claim [3 marks]**
  *   *Must Hit:* Candidate concludes that while the transition may not have harmed specific existers, it is not necessarily a moral improvement overall.
  *   *Common Error:* Binary conclusion (Agriculture was/was not a mistake) without nuance regarding the definition of "mistake."

  ***

  ### Grade Boundary Descriptions

  **22/25 (High First Class):**
  Hits all six moves with precision. Clearly articulates the distinction between person-affecting and impersonal frameworks without necessarily needing technical jargon. The critique of premise (6) is rigorous, showing exactly why quantity does not entail quality. Empirical points are used only to support the logical critique. The writing is fluid and the conclusion is nuanced (e.g., "not a mistake for us, but perhaps for human welfare").

  **16/25 (Low First / High 2:1):**
  Hits moves 1, 2, 4, and 6 clearly. Identifies that premise (6) is weak but may not fully articulate the *framework shift* between (5) and (6) (Move 3). May rely slightly too heavily on empirical objections (Move 5) but connects them back to the argument. A solid analysis that misses the deepest philosophical structural flaw.

  **10/25 (Low 2:2):**
  Hits moves 1 and 2 but fails on 3 and 4. The essay largely recites the course literature (Diamond vs. Sahlins) to argue against the conclusion. It treats the handout as a prompt for a standard essay on the Neolithic rather than an object of analysis. It may disagree with the conclusion but fails to explain why the *reasoning* is flawed.

  **0 Marks:**
  Pure recitation of lecture content with no reference to the eight premises. Alternatively, a response that attacks the conclusion emotionally without engaging the logic. Any answer that does not address the provided text will receive zero marks regardless of historical accuracy.
