      *   What finding would move it? Evidence showing that one factor (e.g., institutions) was sufficient even without others, or that one factor (e.g., coal) was irrelevant even when present. Basically, evidence of *substitutability* vs. *complementarity*.

  6.  **Drafting the Response:**
