      *   Calculation: $(0.85 \times 0.2) + (0.70 \times 0.3) + (0.80 \times 0.2) + (0.60 \times 0.3) = 0.17 + 0.21 + 0.16 + 0.18 = 0.72$.
      *   Refinement: The prompt asks about theories *competing* rather than talking past each other. If the causal structure is conjunctive, they *are* talking past each other (one says A, one says B, truth is A+B). This makes Sub-question 4 critical. If Q4 is low, the total should be lower.
