          2.  *Commensurability:* Are the cases similar enough in relevant aspects to isolate differences?
          3.  *Explanandum Stability:* Is "sustained industrialization" a single, coherent phenomenon across these contexts, or are we comparing apples to oranges?
          4.  *Causal Structure:* Is the outcome driven by a bottleneck (single deep cause) or a conjunctive chain (many independent conditions)? If it's highly conjunctive, do the rival theories actually compete, or do they just describe different links in the same chain?

  3.  **Evaluate Sub-questions & Assign Probabilities:**

      *   *Sub-question 1: Contrast Class Non-Arbitrariness.*
          *   Issue: Was Britain *the* only plausible candidate? Was Song China actually on the verge of industrialization?
          *   Analysis: The "Great Divergence" debate (Pomeranz, etc.) argues the Yangzi Delta was comparable in 1750. Song China had iron/coal but didn't sustain it. Britain is the actual success case. The contrast seems robust enough for historical inquiry, even if "inevitability" is disputed.
          *   Probability: High. Let's say 0.85.

      *   *Sub-question 2: Commensurability of Cases.*
          *   Issue: Can we compare a fragmented European state system with a unified imperial bureaucracy? Can we compare 12th-century tech with 18th-century tech?
          *   Analysis: This is the trickiest part. "Industrialization" in 18th-century Britain (steam, cotton, factories) is structurally different from Song iron production. However, the *question* frames it as "sustained industrialization." If Song failed to sustain, and Yangzi failed to start, the comparison holds regarding the *transition* to modern growth. But are the mechanisms comparable?
          *   Probability: Moderate. Let's say 0.70. (There's significant risk of anachronism).

      *   *Sub-question 3: Explanandum Stability (Is "Industrialization" one thing?).*
          *   Issue: Is there a single phenomenon to explain, or a cluster of distinct events?
          *   Analysis: Most economic historians agree on a core definition (sustained per capita growth via technological innovation). Rival theories (coal, institutions, wages) all aim to explain this specific transition.
          *   Probability: High. Let's say 0.80.

      *   *Sub-question 4: Causal Structure (Competition vs. Conjunction).*
          *   Issue: The prompt asks if theories *compete* over the same thing. If industrialization requires A *and* B *and* C, then the "Coal" guy and the "Institutions" guy aren't rivals; they are both right about different necessary conditions. If the question implies a *primary* cause, it might be ill-posed if the reality is conjunctive.
          *   Analysis: This is the biggest threat to the "well-posed" claim. If the truth is "All of the above were necessary," then framing them as rival answers is misleading. However, in historical explanation, we often look for the *binding constraint* (the thing that was present in Britain and absent in China). If multiple constraints were absent in China, the theories still compete to identify the *most salient* difference.
