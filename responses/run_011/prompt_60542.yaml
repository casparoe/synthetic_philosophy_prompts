  6.  **Refining the Physics:**
      *   Need to be careful about "active" vs "passive" diffeomorphisms. The Hole Argument usually relies on active diffeomorphisms that drag fields.
      *   Key concept: *Coincidences*. Einstein's point: Physics is about coincidences (e.g., pointer meets scale). Diffeomorphisms preserve coincidences.
      *   The colleague is essentially proposing a "material substantivalism" where the lattice points act like manifold points. But since the lattice is physical matter, it transforms.
      *   If the lattice were *fixed* background structure, GR would be violated. If it's dynamical, it transforms.
      *   *Observables:* Mention Dirac observables or "point-coincidences."

  7.  **Refining the Philosophy:**
