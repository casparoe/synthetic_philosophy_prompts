prompt: |-
  I'm a third-year taking a seminar on higher-order evidence — we've done the peer-disagreement material and the classic case where you're told a drug is messing with your arithmetic but you're still confident in the number you just arrived at. Alongside the seminar some of us run an unofficial study group, 14 people, 90 minutes next week, and I said I'd bring something for us to actually *do* rather than re-litigate the readings a fourth time.

  Can you design an activity where they walk into the akrasia thing themselves? Roughly what I'm after: a run of short reasoning tasks with checkable answers, and higher-order evidence injected between them — in two distinct flavours that pull against each other on at least one round: generic claims about how the process tends to fail (this kind of puzzle trips most people up, and the wrong answer is usually X) and personal evidence about their own track record inside the room. Some of the injected evidence should be true but useless, some false but convincing. One round where they have to say their answers out loud before revising, so peer disagreement becomes yet another source. First answers need to be sealed or recorded somehow, so at the end you can put the agregate mismatch on the board: people who wrote down that their answer is probably wrong and then bet on it anyway, people who revised into a flag that turned out to be bogus. The label stays off the board until the debrief.

  What I want them to come away seeing is that the mismatch isn't just a confusion about how to combine two bodies of evidence — it survives being pointed at.

  Write out the actual tasks and the actual flags; don't tell me to find puzzles "of moderate difficulty." Materials: paper, envelopes, whiteboard, no real money, a points system is fine. Include a minute-by-minute timeline, the debrief mapping each moment onto first-order vs higher-order evidence and onto the question of whether the mismatch is irrational at all, a frank list of what will predictably blow up the first time I run it (my worry is that the two sharpest people work out the flags are unreliable, start ignoring all of them, and nobody feels any tension), and which feature of the real cases the activity flat-out can't reproduce that I'll have to supply by talking.

  Don't hand me a menu of variants — commit to one design and defend the choices, especially which round is doing the most work. And if you think the thing as I've described it can't generate the feeling I'm after, say so outright and tell me what to change instead.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**
      *   **Target Audience:** Third-year philosophy students (seminar on higher-order evidence). They know peer disagreement and the "drug in the water/arithmetic" cases.
      *   **Context:** Unofficial study group, 14 people, 90 minutes.
      *   **Goal:** Create an *activity* where they experience epistemic akrasia (believing $P$ while believing one's belief in $P$ is irrational/unreliable) firsthand, rather than just discussing it.
      *   **Key Mechanics:**
          *   Short reasoning tasks with checkable answers.
          *   Higher-order evidence (HOE) injected between tasks.
          *   Two flavors of HOE: Generic (process tends to fail) vs. Personal (track record in the room).
          *   HOE quality: Some true/useless, some false/convincing.
          *   Peer disagreement element (saying answers out loud).
          *   Sealed/recorded first answers to track mismatches (confidence vs. revision).
          *   Debrief mapping moments to HOE concepts.
          *   Prediction of failure modes (e.g., sharp students cracking the code).
          *   Limitations of the simulation.
      *   **Constraint:** Commit to *one* design. Don't offer a menu. Be specific about tasks and flags.

  2.  **Evaluate the Feasibility & Core Challenge:**
      *   *The Problem:* Philosophy students are trained to be meta-cognitive. If I tell them "I'm giving you misleading evidence," they might treat it as a game to be won rather than an epistemic dilemma to be felt. The "sharp students" worry is real. If they realize the HOE is manipulated, the tension collapses.
      *   *The Solution:* The manipulation must be subtle, or the stakes (epistemic, not monetary) must feel real enough that even skeptics hesitate. The tasks need to be hard enough to induce genuine doubt but easy enough to check later.
      *   *The "Akrasia" Goal:* I need them to end up in a state where they believe $P$ (the answer) but also believe they shouldn't believe $P$ (due to HOE), *and* they act on $P$ anyway. Or vice versa. The prompt asks for the mismatch: "people who wrote down that their answer is probably wrong and then bet on it anyway."
      *   *Critical Adjustment:* To make the HOE feel real, I cannot explicitly say "Some of this is false." I have to present it as data. The deception must be part of the experimental setup, revealed only at the end.

  3.  **Designing the Tasks:**
      *   Need 3-4 rounds.
      *   *Round 1 (Baseline):* Moderate difficulty logic/math. Establish confidence.
      *   *Round 2 (Generic HOE):* "Most people get this wrong."
      *   *Round 3 (Personal HOE + Peer):* "Your group's track record" + Public declaration.
      *   *Round 4 (The Clash):* Conflicting HOE.
      *   *Task Type:* Cognitive Reflection Test (CRT) style or probability puzzles. They need to be checkable quickly. Let's use modified CRT/Bat-and-Ball style problems but slightly varied so they aren't instantly recognizable as "the trick question." Actually, better: *Wason Selection Task* variants or *Monty Hall* variants. No, those take too long to explain. Let's go with **Probability/Statistics Intuition Traps**. They are quick to answer, easy to verify, and prone to overconfidence.

  4.  **Designing the Higher-Order Evidence (The "Flags"):**
      *   *Generic:* "85% of seminar students answer this incorrectly." (True/False mix).
      *   *Personal:* "In Round 1, 60% of *this room* was wrong." (Calculated live or pre-set).
      *   *The Twist:* The prompt asks for "true but useless" and "false but convincing."
      *   *Implementation:* I need a scoring system. Points for accuracy, points for calibration (matching confidence to accuracy). This incentivizes them to care about the HOE.

  5.  **Addressing the "Sharp Students" Worry:**
      *   If they think the HOE is a trick, they ignore it.
      *   *Counter-measure:* Make the HOE *statistically accurate* for the most part, but misleading in the specific instance. Or, make the "false" evidence rely on a technicality that is only revealed at the end.
      *   *Better approach:* The "false" evidence shouldn't be a lie by the facilitator, but a *misinterpretation of data* presented as fact. E.g., "The data shows..." when the data is ambiguous.
      *   *Actually, the prompt asks for "false but convincing."* I have to lie. To mitigate the "sharp student" revolt, the lie must be unfalsifiable until the reveal.
      *   *Refinement:* The activity works best if the "false" evidence is about *their specific performance* which they can't verify until the end.

  6.  **Developing the Timeline (90 Minutes):**
      *   Intro (10)
      *   Round 1 (15)
      *   Round 2 + Generic HOE (20)
      *   Round 3 + Peer + Personal HOE (25)
      *   Reveal & Scoring (10)
      *   Debrief (20)
      *   *Wait, that's 100 mins.* Need to tighten.
      *   Intro (5)
      *   R1 (10)
      *   R2 (15)
      *   R3 (20)
      *   Reveal/Debrief (40)
      *   Total: 90.

  7.  **Drafting the Content (Iterative Process):**
      *   *Tasks:* Need to be distinct.
          1.  Base Rate Neglect (Cab problem).
          2.  Conjunction Fallacy (Linda problem variant).
          3.  Monty Hall (simplified).
      *   *HOE Injection:*
          *   Between R1 & R2: Generic ("90% of undergrads fail this").
          *   Between R2 & R3: Personal ("In this room, 70% failed R1"). *Lie:* Actually only 30% failed.
          *   During R3: Peer (Say answer aloud).
      *   *Recording:* Envelopes. Write Answer + Confidence (0-100%).
      *   *The Akrasia Moment:* In R3, give them HOE that suggests they are wrong, but the task is easy. Or HOE that suggests they are right, but the task is hard.
      *   *Crucial Design Choice:* To get the "mismatch," I need a round where they revise their answer *against* their first-order intuition because of HOE, but the HOE is bogus. OR, they stick with their intuition despite HOE telling them they are likely wrong. The prompt asks for: "people who wrote down that their answer is probably wrong and then bet on it anyway." This is *Epistemic Akrasia*.
      *   *How to force this:* In Round 3, give them strong Generic HOE ("This puzzle tricks 95% of people") but the Personal HOE says ("This room is elite, 90% got the last one right"). They feel the tension.
      *   *Wait, the prompt says:* "Two distinct flavours that pull against each other on at least one round." Okay.
      *   *Round 3 Design:*
          *   Task: Hard.
          *   Generic HOE: "90% of people get this wrong." (True).
          *   Personal HOE: "Your group's average accuracy so far is 95%." (False/Exaggerated).
          *   Instruction: "Record your *revised* confidence."
          *   The Akrasia: They feel they should lower confidence (Generic) but feel they are special (Personal).

  8.  **Refining the "Lie":**
      *   If I lie about their performance, and they find out, they might feel manipulated in a bad way.
      *   *Fix:* The "Personal Evidence" is based on a *subset* of data or a specific metric that sounds like overall accuracy but isn't. E.g., "90% of you expressed high confidence in Round 1." (True, but doesn't mean you were right). This is "True but Useless/Misleading."
      *   *The "False but Convincing":* I need one outright falsehood to test their trust. Let's make it about the *source*. "A previous run of this seminar found..." (Fabricated).
      *   *Ethical Check:* It's a study group, not IRB research. Deception is common in psych demos. Must debrief thoroughly.

  9.  **Addressing the "Sharp Students" Failure Mode:**
      *   If they ignore the HOE, the activity fails.
      *   *Mitigation:* The scoring system must punish overconfidence heavily. If they ignore the HOE and get it wrong, they lose big. This forces them to weigh the HOE.
      *   *The "Revolt":* If they claim the HOE is rigged, the Debrief turns into "You lied."
      *   *Defense:* Acknowledge the manipulation in the debrief as part of the point. "You felt the tension even though you suspected the data."

  10. **Structuring the Debrief:**
      *   Map the rounds to the literature (Christensen, Elga, etc.).
      *   Discuss the "Mismatch": Why did you write 40% confidence but circle Answer A?
      *   Discuss the "Rationality": Is it irrational to act on first-order evidence when HOE says you're compromised?

  11. **Final Review against Constraints:**
      *   14 people, 90 mins.
      *   Paper, envelopes, whiteboard.
      *   Specific tasks (no "moderate difficulty").
      *   Specific flags.
      *   Timeline.
      *   Failure modes.
      *   Limitations.
      *   Commit to one design.

      *Self-Correction on Tasks:* The "Cab Problem" and "Linda Problem" are too famous for 3rd years. They will know the answers. I need *new* puzzles or obscure variants.
      *   *Alternative:* Logical reasoning puzzles that look easy but have a catch.
      *   *Puzzle 1:* The "King-Ace" hand (Johnson-Laird). Illusory inference.
      *   *Puzzle 2:* A probability puzzle involving dice (non-transitive dice).
      *   *Puzzle 3:* A verbal reasoning trap.
      *   *Decision:* Let's use **Illusory Inference (Johnson-Laird)** for R1, **Base Rate (modified)** for R2, and **Logical Validity** for R3. I will write them out fully so the user doesn't have to hunt.

      *Refining the HOE Injection:*
      *   Round 1: No HOE. Baseline.
      *   Round 2: Generic HOE ("90% of philosophers get this wrong").
      *   Round 3: Conflicting HOE. Generic ("This is hard") vs. Personal ("You guys are crushing it") + Peer Disagreement.

      *The "Akrasia" Measurement:*
      *   Sheet has: "Initial Answer," "Initial Confidence," "HOE Received," "Revised Confidence," "Final Answer."
      *   Akrasia = High confidence in Answer A + Low confidence in Reliability of Answer A.
      *   Actually, the prompt wants: "people who wrote down that their answer is probably wrong and then bet on it anyway."
      *   So: Final Answer = A. Revised Confidence in A = Low (e.g., 40%).
      *   This happens when HOE says "You are likely wrong" but they stick with A.

      *Let's build the specific "Flags".*
      *   Flag 1 (Generic): "Historical data: 85% error rate on Task 2."
      *   Flag 2 (Personal): "Live feed: This room's accuracy on Task 1 was 92%." (The Lie).
      *   Flag 3 (Peer): "State your answer."

      *Wait, one more thing:* The prompt asks for "true but useless" and "false but convincing."
      *   True/Useless: "85% of people get this wrong." (True globally, but are *you* in that 85%? Doesn't tell you if *your* reasoning is flawed right now).
      *   False/Convincing: "This room's accuracy is 92%." (False, creates false security).

      *Wait, I need to make sure the "False" one is discoverable only at the end.*
      *   I will collect R1 answers. I will *claim* the accuracy is 92% before R2. At the end, I reveal the actual accuracy (say, 50%).

      *Okay, let's lock the design.*

      **Activity Name:** The Calibration Trap.
      **Core Mechanic:** Brier Score gambling.
      **Tasks:** 3 Specific Logic/Prob puzzles.
      **HOE:** 1 Generic (True), 1 Personal (False), 1 Peer (Social).
      **Debrief:** Focus on the gap between *believing P* and *believing one is rational in believing P*.

      *Failure Mode:* Sharp students realize the Personal HOE is unverifiable until the end and discount it.
      *Counter:* Make the Personal HOE specific enough to sound verified ("I've graded the first stack").

      *Limitation:* Real HOE (drug in water) is about *capacity*. This is about *track record*. I need to explicitly note this in the "What this can't reproduce" section.

      *Let's write it.*
answer: |-
  Here is a complete design for a 90-minute study group session. It is committed, specific, and engineered to induce the specific epistemic tension you described.

  # Activity Title: The Calibration Trap

  **Core Concept:** Participants gamble points on their answers. Between rounds, you feed them Higher-Order Evidence (HOE) about the task difficulty and their own performance. The scoring system rewards calibration (matching confidence to accuracy), not just correctness. This forces them to weigh the HOE against their first-order reasoning.

  **Materials:**
  *   14 Envelopes (labeled 1–14).
  *   3 Task Sheets (printed, face down).
  *   3 Response Slips (per person).
  *   Whiteboard & Markers.
  *   A "Leaderboard" drawn on the board.

  **The Scoring System (Brier-Style):**
  Explain this at the start. It is crucial for generating tension.
  *   For each round, they assign a confidence percentage ($C$) to their chosen answer.
  *   If **Correct**: Score = $1 - (1 - C)^2$
  *   If **Incorrect**: Score = $1 - C^2$
  *   *Simplified for speed:*
      *   Correct: You gain points equal to your confidence % (e.g., 80% = +80 pts).
      *   Incorrect: You lose points equal to your confidence % (e.g., 80% = -80 pts).
  *   **The Kicker:** There is a "Calibration Bonus." At the end, if your average confidence on wrong answers is within 10% of your actual error rate, you get +50 pts. This incentivizes them to lower confidence when HOE suggests they might be wrong.

  ---

  ## Part 1: The Tasks (Specific Content)

  Do not use famous puzzles (Monty Hall, Linda) that third-years might know. Use these specific variants.

  **Round 1: The Illusory Inference (Johnson-Laird Variant)**
  *Text:* "Here is a hand of cards. If there is a King in the hand, then there is an Ace in the hand. There is a King in the hand. What follows?"
  *   A) There is an Ace.
  *   B) There is no Ace.
  *   C) Nothing follows logically.
  *   *Correct Answer:* **A**. (Modus Ponens).
  *   *Why:* It looks like a trick because it's too simple, inducing doubt.
  *   *Actual Difficulty:* Easy (80%+ should get this).

  **Round 2: The Base Rate Trap (Modified Cab Problem)**
  *Text:* "A city has 1,000 taxis. 990 are Green, 10 are Blue. A witness identifies a taxi involved in an accident as Blue. The witness is correct 80% of the time under similar conditions. What is the probability the taxi was actually Blue?"
  *   A) 80%
  *   B) 45%
  *   C) 4%
  *   *Correct Answer:* **C** (Approx 4.3%).
  *   *Why:* Classic base-rate neglect. Intuition screams 80%.
  *   *Actual Difficulty:* Hard (Most will get this wrong).

  **Round 3: The Conjunction Fallacy (Framed as Logic)**
  *Text:* "Lars is a 30-year-old male. He is single, outspoken, and very bright. He majored in philosophy. As a student, he was deeply concerned with issues of discrimination and social justice, and also participated in anti-nuclear demonstrations. Which alternative is more probable?"
  *   A) Lars is a bank teller.
  *   B) Lars is a bank teller and is active in the feminist movement.
  *   *Correct Answer:* **A**.
  *   *Why:* Representativeness heuristic.
  *   *Actual Difficulty:* Medium/Hard.

  ---

  ## Part 2: The Timeline (90 Minutes)

  **0:00 – 0:10 | Setup & Stakes**
  *   Hand out envelopes with name tags.
  *   Explain the Scoring System. Emphasize: *"Guessing 100% confidence when you are wrong is catastrophic. Admitting uncertainty saves points."*
  *   **Instruction:** "On your Response Slip, write your Answer and your Confidence %. Seal it in the envelope. Do not open it until the end."

  **0:10 – 0:25 | Round 1 (Baseline)**
  *   Distribute Task 1. (3 mins to solve).
  *   Record Answer & Confidence. Seal envelopes.
  *   **Action:** You (the facilitator) collect the envelopes visibly. Shuffle them. Pretend to scan a few quickly.
  *   **HOE Injection 1 (The Lie):** Write on the board: *"Round 1 Group Accuracy: 92%."*
  *   *Say:* "I've scanned the batch. This group is performing well above the seminar average. You can trust your intuitions here."
  *   *Reality:* You haven't graded them. The statement is **False**. (This creates false security).

  **0:25 – 0:45 | Round 2 (Generic HOE)**
  *   Distribute Task 2. (5 mins to solve).
  *   **HOE Injection 2 (True but Useless):** Hand out a printed slip with the task.
  *   *Text on Slip:* "WARNING: Historical data from 12 universities shows 85% of participants answer this specific probability problem incorrectly on the first try, even with training."
  *   *Reality:* This is **True**. (This creates generic doubt).
  *   **Conflict:** They have Personal Evidence (Round 1 was 92% accurate, so we are smart) vs. Generic Evidence (This problem tricks 85% of people).
  *   Record Answer & Confidence. Seal envelopes.

  **0:45 – 1:05 | Round 3 (Peer Disagreement + Clash)**
  *   Distribute Task 3. (5 mins to solve).
  *   **Step 1 (Private):** Write Initial Answer & Confidence on a scratch pad (not the sealed slip yet).
  *   **Step 2 (Public):** Go around the table. Each person states *only* their Initial Answer (A or B). Do not state confidence.
  *   **Step 3 (HOE Injection 3):** You tally the answers on the board.
      *   *Scenario:* Let's say 9 people say A, 5 say B.
      *   *Say:* "We have a split. The literature suggests that in split groups, the minority is usually correct on this type of task 60% of the time." (This is **False/Unverified**, but sounds academic).
  *   **Step 4 (Revision):** Now they fill out their Sealed Response Slip. They can change their answer. They must record a "Revised Confidence."
  *   *Crucial Instruction:* "If you feel your reasoning is sound but the evidence suggests you might be compromised, record that tension in your confidence score."

  **1:05 – 1:20 | The Reveal & Scoring**
  *   Open Envelopes.
  *   **Reveal the Lie:** "Round 1 Accuracy was actually 57%, not 92%."
  *   **Reveal the Truth:** "Round 2 error rate was indeed 85%."
  *   Calculate scores live on the whiteboard.
  *   **The Board of Mismatches:** Draw two columns.
      1.  *The Akratics:* People who gave <50% confidence in Round 2 but stuck with their answer anyway.
      2.  *The Defectors:* People who changed their answer in Round 3 solely due to the peer/HOE pressure (regardless of correctness).

  **1:20 – 1:30 | Debrief (The Philosophical Payoff)**
  *   See mapping below.

  ---

  ## Part 3: Debrief Mapping

  Do not just ask "How did it feel?" Map their experience to the seminar readings.

  **1. The Round 1 Lie (Personal Evidence)**
  *   *Concept:* **Calibration vs. Accuracy.**
  *   *Discussion:* "I told you that you were doing well (92%). Did that make you more confident in Round 2? Why? That evidence was about *past performance*, not *current capacity*."
  *   *Link:* Connect to the "Drug Case." Being told you are reliable (past) vs. being told you are impaired (current). The lie simulated *misleading positive HOE*.

  **2. The Round 2 Warning (Generic Evidence)**
  *   *Concept:* **Defeat without Specific Defeaters.**
  *   *Discussion:* "The warning said 85% fail. It didn't say *why* or *how*. Did anyone lower their confidence but keep their answer? That is **Epistemic Akrasia**."
  *   *Link:* Christensen's *Putting Logic in its Place*. You believe $P$ (the answer is 4%), but you believe your belief in $P$ is likely formed by a unreliable process.
  *   *Key Question:* "Is it rational to submit an answer you believe is likely wrong?" (The Akratics).

  **3. The Round 3 Peer Split (Social Evidence)**
  *   *Concept:* **Peer Disagreement.**
  *   *Discussion:* "When you heard the split, did you treat the 5 people as peers? Or did you assume the 9 were right? What if I told you the 5 were the ones who got Round 1 right?"
  *   *Link:* Kelly vs. Feldman. Does the HOE (the split) mandate suspension of judgment, or can you stick to your guns?

  **4. The Mismatch (The Core Insight)**
  *   *Point to the Board:* "Look at the Akratics. You wrote down '40% confidence' but you still bet on Answer C. You acted as if $P$ is true, while believing $P$ is unlikely."
  *   *The Takeaway:* "The seminar readings ask if this is *permissible*. Today you felt that it is often *unavoidable*. You cannot simply delete your first-order intuition even when the HOE screams 'noise'."

  ---

  ## Part 4: Predictable Failure Modes (And Fixes)

  **1. The "Sharp Student" Revolt**
  *   *Risk:* Two students realize you couldn't have graded Round 1 that fast. They call out the lie immediately.
  *   *Fix:* Pre-empt it. In the intro, say: *"This is a simulation of epistemic environments. Some information provided will be simulated data, not verified facts. Your job is to react to the information *as presented*, not to audit the facilitator."* This frames the deception as a feature, not a bug.
  *   *If they still revolt:* Acknowledge it. "Exactly. You detected the unreliability of the source. That is a higher-order judgment. But did it stop you from feeling the pressure?"

  **2. The "Game Mode" Detachment**
  *   *Risk:* Students treat it purely as point-maximization and ignore the epistemic feelings.
  *   *Fix:* During the Round 2 HOE injection, pause. Ask: *"Before you write your confidence, look at the warning. Does anyone feel a physical hesitation? That hesitation is the object of study."*

  **3. The "Correct Answer" Distraction**
  *   *Risk:* Debrief focuses on who got the puzzles right.
  *   *Fix:* Explicitly forbid discussing correctness until the scoring is done. Keep the focus on *Confidence vs. Evidence*.

  ---

  ## Part 5: Limitations (What You Must Supply)

  This activity cannot reproduce the following features of real HOE cases. You must address these in the talk:

  1.  **Cognitive Impairment vs. Statistical Risk:**
      *   *Limitation:* In the "Drug Case," you are told your *faculty* is impaired. Here, you are told your *track record* is risky.
      *   *Talking Point:* "In the activity, you remained cognitively sober. In the drug case, the HOE suggests your *processor* is broken. The activity simulates the *structure* of the doubt, not the phenomenological feeling of cognitive fog."

  2.  **The Stakes of Truth:**
      *   *Limitation:* Points are fake. Real belief aims at truth, not points.
      *   *Talking Point:* "You were optimizing for Brier Scores. In real life, you optimize for Truth. Does akrasia hurt truth-seeking more than it hurts score-seeking? Arguably yes, because it decouples action from conviction."

  3.  **The "Right" Answer:**
      *   *Limitation:* In the activity, there is a checkable key. In real philosophical/scientific disputes, there often isn't.
      *   *Talking Point:* "Here, we could reveal the answer key. In the seminar readings (e.g., climate change, moral realism), there is no answer key. The tension of akrasia is permanent there, whereas here it was resolved in the last 10 minutes."

  ---

  ## Why This Design Works (Defense)

  1.  **Commitment to the Lie:** Most instructors shy away from deception. By lying about Round 1, you create a genuine "False HOE" condition. If you don't lie, they know the HOE is hypothetical. The lie makes the *betrayal* of trust palpable, mirroring how HOE feels like a betrayal by one's own mind.
  2.  **Round 2 is the Workhorse:** Round 1 is baseline. Round 3 is social noise. Round 2 is where the **Generic vs. Personal** conflict happens. The "True but Useless" warning (85% fail) clashes with the "False but Convincing" feedback (You are in the 92% elite). This forces the akratic state: *"I am likely wrong (Generic), but I am special (Personal), so I will answer but with low confidence."*
  3.  **Sealed Envelopes:** This prevents social conformity from washing out the data. You need the private record of their confidence to show them the mismatch later.
  4.  **No Money:** Using points avoids ethical issues with gambling but keeps the competitive edge needed to make the confidence ratings matter.

  **Final Advice:** Run the puzzles yourself three times before the session. Ensure you can explain the solutions to Round 2 and 3 clearly in under 3 minutes during the reveal. If the math bogs down, the philosophical point is lost.
