answer: |-
  To: Civic Cohesion Committee
  From: Committee Member
  Re: Recommendation on University/Nonprofit Joint Bid
  Date: May 2, 2024

  We are deadlocked on a proposal that touches the core of why this foundation exists. We have until the end of June to commit these funds, and deferral is not an option. After reviewing the arguments from both sides of our split vote, I recommend we fund this project subject to specific conditions regarding the final deliverables and the philosophical claims underpinning them. This path allows us to support the practical work of dialogue without endorsing a contested moral framework that could compromise our own mission integrity.

  The proposal contains two distinct components: the intervention (twenty-four dialogue workshops) and the justification (a survey-based argument for changing how foundations define equity). The supporters on our committee are correct that the workshops themselves are a low-cost, high-reach intervention. Facilitated dialogue in polarized counties is exactly the kind of work our Civic Cohesion stream was built to support. If the project were solely about running these conversations, I would vote to fund as proposed. However, the applicants have tied this work to a specific theoretical claim that requires us to evaluate their reasoning, not just their activity budget.

  The philosophical problem with the third step of their argument is known as the naturalistic fallacy. The applicants argue that because certain moral intuitions—like loyalty to authority or sanctity of tradition—are widespread and persistent across cultures, they must track something real about human flourishing and deserve equal standing in our mission. The error here is assuming that what *is* common necessarily dictates what *ought* to be valued. History provides clear examples where widespread moral intuitions, such as support for segregation or exclusionary practices, were persistent and culturally embedded yet fundamentally unjust. A foundation exists to make normative judgments about community good, not to outsource those judgments to survey returns. If we accept their logic, we lose the ability to critique harmful traditions simply because they are popular.

  That said, a defensible version of their argument survives scrutiny. We can acknowledge that understanding these moral intuitions is essential for effective engagement, even if we do not endorse them as equal goods. We should understand why a neighbor values authority or tradition so we can speak to them respectfully, without conceding that those values must be weighted equally against care or fairness in our own grantmaking criteria. The project can succeed if it treats these foundations as descriptive tools for empathy rather than prescriptive mandates for our mission.

  The measurement concerns raised by our nurse practitioner are also significant but not fatal to the workshop component. There is credible evidence suggesting the questionnaire's five-factor structure does not hold up consistently outside specific American samples and that respondents often answer based on political identity rather than stable moral traits. If the questionnaire fails to accurately measure moral intuitions, the workshop tailoring loses its scientific basis, though the dialogue itself may still hold value. However, since the final report relies on this data to justify mission changes, invalid data undermines the deliverable. Therefore, while the survey flaws do not stop the workshops, they must prevent the survey results from being used as definitive proof for policy changes.

  My recommendation is to fund with conditions. We should not finance a report that concludes our equity framework is deficient based on the premise that popularity equals validity. We can support the dialogue while protecting the foundation from being advised to adopt a moral framework based on flawed logic.

  **Conditions for Funding:**
  1. The final report may describe the moral foundations observed in the community but cannot recommend that the foundation adopt loyalty, authority, or sanctity as equal pillars to care and fairness in our mission language.
  2. The survey data must be presented with explicit caveats regarding its limitations as a psychometric instrument, acknowledging that self-reported moral intuitions are not objective measures of community health.
  3. The workshop curriculum must be reviewed to ensure facilitators are trained to validate participants' feelings without validating harmful prejudices under the guise of moral diversity.

  To the members arguing that we are punishing the applicants for their rhetoric rather than their work: I hear you. It is true that the workshops could succeed even if the justification memo is philosophically shaky. However, the justification is not merely marketing; it is a deliverable. We are being asked to pay for a set of recommendations that tell us how to write our own mission. We cannot fund a consultant to tell us to abandon our core values based on a logical fallacy, even if the parties they throw along the way are beneficial. The money is public-facing trust; we must ensure the intellectual output we sponsor is sound.

  To the members worried about the naturalistic fallacy: I agree that popularity does not equal rightness. However, declining the grant entirely punishes the community members who would benefit from the dialogue. By conditioning the grant, we isolate the risk. We allow the conversation to happen without signing off on the conclusion that all widespread intuitions are legitimate community goods.

  **Interview Questions for Applicants:**
  1. If the survey data shows no clear difference between counties, how will you adjust the workshop content without forcing a narrative?
  2. Can you provide examples of how you will distinguish between validating a participant's sense of loss and validating exclusionary policies during dialogue?
  3. Are you willing to revise the final report's conclusion to focus on "understanding" rather than "adopting" alternative moral frameworks?

  I am moderately confident in this approach. It preserves the civic benefit while safeguarding our governance. The only consideration that would change my mind is if the applicants refuse to separate the workshop delivery from the policy recommendation, indicating that the ideological advocacy is the primary goal rather than the dialogue.

