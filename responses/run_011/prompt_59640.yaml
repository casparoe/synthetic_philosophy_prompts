      *   **Conflict:**
          *   *Pro:* Moral disagreement is about different foundations, not reasoning/sincerity. Foundations should recognize loyalty/authority/sanctity as legitimate goods, not obstacles. Workshops are the real intervention; survey is needs assessment.
