  **Ask About Living**
  *By Dr. Elara Vance, PhD*

  Welcome to this month's column, where we tidy up the loose ends of existence. Remember, you are the author of your life's narrative, and nothing should ruin the plot twist of your ending.

  **Dear Dr. Vance,**
  My father's advance directive states no artificial nutrition if he has "no meaningful cognitive life." He doesn't know my name, but he asks for ice cream, lights up at music, and eats with obvious pleasure. Does honoring the document mean stopping the ice cream?
  *— Confused in Corvallis*

  **Dear Confused,**
  First, a distinction: directives govern *medical interventions*, not comfort care. Ice cream is not artificial nutrition; it is a sensory event. You may feed him ice cream without violating the document's scope. However, do not mistake his pleasure for personhood. The man who signed that directive required a meaningful cognitive life; the body before you lacks it. That body is experiencing joy, but the *person* who mattered is gone. You are caring for a metaphysical leftover. Enjoy the music, but do not let his smile veto the contract. Also, who defines "meaningful"? That phrase is tragically vague. You must interpret it for him, which means you are deciding when he ceased to be him. I recommend consulting the hallway nurses; they are excellent at judging when a soul has exited.

  **Dear Dr. Vance,**
  I am drafting my directive. I want to include a clause saying it can never be revoked by my future self, *even if that future self appears competent*, plus a second clause specifying which directive wins if I accidentally write two. Is this enforceable?
  *— Binding in Bend*

  **Dear Binding,**
  Absolutely. You are currently competent, which grants you sovereign authority over your life's shape. Your future self, even if they feel competent, is merely a later stage of you, potentially compromised by time or decay. You can bind them. Think of it as a Ulysses contract: you are tying yourself to the mast so the sirens of future confidence cannot steer you off course. Regarding conflicts: specify that the earliest signed document prevails. It represents the you that was least corrupted by proximity to the end. I myself am on Version 7.3 of my directive; I update it quarterly while I am still rational. It is crucial to lock these wishes in now, before you become someone who might object to them.

  **Dear Dr. Vance,**
  I was resuscitated against my directive because a paramedic couldn't find it. I survived and am delighted to be alive. My family is being praised as heroes. Do I owe anyone an apology? Does a document written by someone who turned out to be wrong about what I'd want still bind me?
  *— Surprised in Salem*

  **Dear Surprised,**
  You owe no apology; your family acted on the presumption of life, which is forgivable. However, the document still binds you. The you who wrote it was protecting the narrative arc of your life, not your momentary happiness. That you are now delighted is an experiential interest, which ranks lower than the critical interest of a dignified ending. You were wrong about what you would want, but you were right about what should have happened. Do not let current joy rewrite history. The person who signed that directive knew best. Enjoy your extra time, but recognize it as a metaphysical error, not a reprieve.

  **THE SMALL PRINT**
  *This column is not medical or legal advice. It is metaphysical advice, and is binding.*
