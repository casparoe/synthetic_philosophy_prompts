  ### 2. General Condition for Coincidence

  Your friend's heuristic ("they diverge only with curvature") is false, as Example B proves (linear frontier, divergent solutions).

  **The Condition:**
  Nash and KS coincide if and only if the **Pareto frontier is a hyperplane (linear)** AND the **disagreement point is the origin** (in the coordinate system defined by the ideal point axes).

  *   **Why:** If the frontier is linear ($p_1 x_1 + p_2 x_2 = C$) and $d=(0,0)$, the Nash solution (tangency of hyperbola $x_1 x_2 = k$) occurs where the slope $-x_2/x_1$ equals the frontier slope $-p_1/p_2$. This implies $p_1 x_1 = p_2 x_2$. The KS solution lies on the line connecting $(0,0)$ to $(C/p_1, C/p_2)$, which is exactly the locus $p_1 x_1 = p_2 x_2$.
  *   **Curvature:** Curvature guarantees divergence (generically), but linearity does *not* guarantee coincidence unless $d=(0,0)$. The position of $d$ is just as critical as the shape of the frontier.

