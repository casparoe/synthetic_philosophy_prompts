  ok so my friend and I have been arguing about Nash vs Kalai–Smorodinsky bargaining for three hours and I need a third party who isn't either of us. The real thing we're arguing about is how to split the surplus on a project we both work on, where each of us has a walk-away option, but we reduced it to a toy model about an hour in so we could stop yelling about money and start yelling about axioms. He's a Nash guy: says independence of irrelevant alternatives is the only axiom that makes a solution principled and KS is just a pretty picture. I say giving up monotonicity is a real cost.

