  **MEMORANDUM**

  **TO:** Grants Committee, Private Conservation Foundation
  **FROM:** Chair, Environmental Philosophy (Non-Scientific Member)
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Recommendation: Eastern Fen Parcel Restoration (Applications A & B)

  **Recommendation**

  The Committee should fund **Application B (Partial Repair)**, subject to the following conditions:
  1.  **Monitoring Compliance:** The Land Trust must execute the proposed monitoring programme exactly as described, specifically the annual public reporting of juvenile mortality counts.
  2.  **Management Protocol:** The Trust must adhere to the committed protocol of no lethal control, no predator culling, and no supplemental feeding on the parcel.
  3.  **Verification:** Compliance will be verified by Foundation staff through annual review of the public reports and a site audit at the end of Year 3.

  **Deferral Status**

  Deferral is not defensible. The tender window for ditch works closes in six weeks. If we defer for further evidence, the restoration window closes, and the parcel will not return to consideration for two years. By that time, the drainage network will have been re-cut and deepened. This outcome guarantees the continuation of peat oxidation and habitat fragmentation, which is demonstrably worse for both ecological integrity (carbon loss, degraded community) and individual well-being (concentrated mortality in remaining refuges) than either restoration option. We must decide now.

  **Welfare, Integrity, and the Deed of Trust**

  Our Deed directs us to have regard to both the integrity of ecological communities and the well-being of individual animals. It does not hierarchy these mandates. Application A prioritizes integrity (historic regime, statutory waterbirds) while disregarding the modelled welfare costs of millions of short-lived individuals. Application B prioritizes individual well-being (suppressing mass emergence) at a cost to integrity (loss of open-water habitat, reduced carbon storage).

  In choosing B, we are not ruling that individual welfare always trumps ecological integrity. We are ruling that under conditions of radical uncertainty regarding sentience, the precautionary principle applies to the welfare clause. Application A projects the creation of millions of lives characterized by rapid death via starvation or predation. We do not know if these larvae experience suffering. However, the Deed requires us to *have regard* for their well-being. To ignore a modelled output suggesting massive mortality simply because the subjective experience is unmeasured is to treat the welfare clause as void whenever scientific metrics are imperfect. We cannot accept that interpretation.

  **The Baseline and the Creation of Lives**

  A central difficulty is whether bringing additional lives into existence is a harm. The baseline for measuring harm here is not non-existence, but the degraded status quo. The drained fen already supports animal life, often at high densities in remaining refuges, leading to high per-capita mortality. Application A increases the total number of lives and the total number of deaths. Application B increases the number of lives less dramatically.

  If a life is net negative (suffering outweighs positive experience), creating it is a harm. If it is net positive, it is a benefit. We lack evidence to determine the valence of larval experience. However, given the mode of death (starvation, desiccation) and the brevity of life, there is a non-negligible risk that these lives are net negative. Application B reduces this risk exposure without abandoning conservation goals entirely (peat oxidation is halted). We are not preventing life; we are selecting a restoration pathway that minimizes the potential scale of welfare catastrophe while securing core ecological functions.

  **Engagement with the Restoration Ecologist's Note**

  The resident ecologist's note raises three claims that require serious engagement.

  First, she claims welfare figures are unusable because we cannot measure valence or aggregate experience. While measurement is imperfect, unusability does not justify exclusion. The Deed mandates regard for well-being. If we exclude welfare considerations whenever they are difficult to quantify, we effectively remove the clause from our decision-making framework. We must act on the best available models, even if imperfect.

  Second, she argues that counting larval production as a cost counts habitat loss as a benefit, creating a slippery slope toward draining wetlands. This is the most weighty claim. If we fund B solely because it produces fewer animals, we risk incentivizing habitat reduction. However, Application B is not habitat loss; it is partial restoration. It maintains wetland function and halts carbon loss. The distinction is critical. We are not funding retirement; we are funding a less intensive restoration that balances competing mandates.

  Third, she warns that reasoning this way will lead to funding habitat retirement within a decade. This political consequence is a legitimate ground for decision-making only insofar as it threatens our ability to fulfill our Deed. If our interpretation of "well-being" undermines our ability to protect "ecological integrity" globally, we fail our mission. However, avoiding a specific instance of potential mass suffering does not necessitate a general policy against wetlands. We can mitigate this risk through the Standard of Review below.

  **Standard of Review**

  To ensure consistency and prevent the slippery slope identified by the ecologist, the Board should adopt the following standard for future applications involving high-mortality taxa:

  *The Precautionary Welfare Standard:* Where a restoration project projects a massive increase (>1 order of magnitude) in short-lived individuals with high mortality rates, and the welfare status of those individuals is scientifically uncertain, the Board shall prefer options that minimize potential suffering *provided that* core ecological functions (carbon sequestration, water quality, habitat connectivity) are not compromised below regulatory or designation thresholds.

  This standard prevents welfare concerns from vetoing essential restoration (protecting integrity) while ensuring we do not ignore welfare when viable alternatives exist (protecting well-being). It distinguishes between *repair intensity* (permissible to adjust) and *habitat destruction* (impermissible).

  **Evidence and Future Review**

  This decision is made under uncertainty. We are not stipulating that invertebrates are morally considerable, nor that they are not. We are acting on the risk that they are. This position should change if new evidence emerges. Specifically, the Board should revisit this standard if:
  1.  Peer-reviewed consensus establishes that the taxa in question lack the neurological capacity for valenced experience (pain/suffering).
  2.  Monitoring data from Application B demonstrates that the suppressed emergence leads to unforeseen ecological collapse that violates our integrity mandate.

  **Conclusion**

  Funding Application B honors the dual mandate of our Deed more faithfully than Application A. It acknowledges that ecological integrity cannot be purchased at the unlimited expense of individual well-being, even when the currency of that expense is uncertain. It rejects the ecologist's counsel to ignore welfare due to measurement difficulty, while accepting her warning about perverse incentives by limiting this precedent to repair intensity rather than habitat loss. We must act now to secure the parcel, and we must do so in a manner that respects the ethical complexity of our mission.

  **Action Required:** Vote to approve funding for Application B with the conditions listed above.
