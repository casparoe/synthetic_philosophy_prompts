  **The position, corrected**
  Von Neumann characterizes the nervous system as a mixed automaton. While nerve impulses are all-or-none, suggesting digital logic, synaptic thresholds and summation introduce analog variance. He notes that individual neurons are slow and unreliable compared to contemporary vacuum tubes, yet the system maintains high availability. He attributes this not to component precision but to multiplexing and error-correcting codes, explicitly linking this to his prior work on synthesizing reliable automata from unreliable components. He posits that memory is likely distributed rather than address-specific, implying statistical retrieval rather than direct lookup. He further argues that precision is achieved through message length rather than component accuracy. Finally, he contends the brain's internal language is logically combinatorial, not arithmetic, making the computer analogy substantive primarily where it breaks down. The bridge to his reliability theory is explicit in his 1956 lectures, not projected.

  **The translation**
  Von Neumann's mixed automaton maps to a hybrid system where control plane signals are digital, but the data plane experiences analog noise. The neuron's low precision and speed imply a high error budget per component, yet the system meets strict global SLOs. We allocate error budgets to components that frequently exceed them, relying on the aggregate to hold the line. This dependability is achieved not by hardening individual nodes against crash faults, but through aggressive replication and erasure coding across distinct failure domains. The system tolerates Byzantine faults via quorums rather than assuming perfect hardware, accepting that components will lie or fail silently. We see this in consensus protocols that survive malicious actors, mirroring his view of noisy neurons. The system assumes the network is hostile.

  To buy dependability, the architecture sacrifices serial depth for parallel width, optimizing for aggregate throughput over single-request tail latency. Tail latency is managed not by speeding up nodes, but by ignoring stragglers. Capacity planning is inherently elastic; the system scales out rather than up, adding nodes to manage load. Memory does not reside in a dedicated block storage organ with addressable retrieval. Instead, it resembles a distributed object store where recall is statistical, requiring reconstruction from shards rather than key-value lookup. Graceful degradation is inherent; partial failure does not halt service but reduces fidelity, akin to serving stale content rather than errors. The system degrades smoothly rather than crashing hard. We trade consistency for availability in the CAP sense.

  Crucially, the system's code is not a static binary but a combinatorial logic layer distinct from numerical processing. The control plane does not execute mathematical scripts but manages logical states. Therefore, the brain-computer comparison is not a claim of identity but a stress test of our distributed systems vocabulary. The analogy holds where redundancy masks faults, but fails where the system's logic is non-arithmetic. Von Neumann suggests the brain operates on a protocol where the message length defines precision, akin to varying packet sizes for fidelity, rather than fixed-word arithmetic. This implies a dynamic protocol stack where the definition of a valid packet changes based on network conditions, something our static schemas cannot accommodate. Our load balancers route traffic; his system routes logic. We isolate failure domains; he dissolves them. The control plane is not separate; it is embedded in the data plane's history. In our terms, the brain is an eventually consistent system that prioritizes liveness over strict correctness.

  **The residue**
  Claim: Reliability via redundancy rather than component accuracy. Verdict: Clean. This is the core of erasure coding and quorum-based replication. We accept commodity hardware (unreliable components) and build reliability in software, matching Von Neumann's multiplexing.
  Claim: Parallel width over serial depth. Verdict: Clean. This is standard capacity planning for distributed throughput, minimizing tail latency by avoiding sequential bottlenecks. We shard data to achieve this width.
  Claim: Memory is statistical and reconstructive. Verdict: Bent. We use erasure coding to reconstruct data bits, but not meaning. Our storage is addressable; we do not retrieve via statistical similarity. Forcing this into "distributed storage" ignores the semantic reconstruction Von Neumann implies. We reconstruct bytes; he suggests reconstructing concepts. The bend breaks when semantics enter.
  Claim: Code is combinatorial, not numerical. Verdict: Inexpressible. Our control plane logic is strictly mathematical and deterministic. We have no vocabulary for a system where the code itself is probabilistic or evolves via experience rather than deployment. Our binaries are static; his logic is fluid.
  Claim: System parameters set by experience. Verdict: Inexpressible. Our configurations are static at deployment. We do not have a mechanism for the system to rewrite its own control plane logic based on traffic patterns without human intervention. We tune SLOs; the brain tunes its architecture.
  Claim: Analogy limits are substantive. Verdict: Clean. This matches our understanding of abstraction boundaries and leaky abstractions.

  **Whose defect is the residue**
  The residue is a poverty in reliability engineering's vocabulary, not a sign that Von Neumann's claims were weak. Our distributed systems assume a hard separation between code (control plane) and data (data plane). We treat configuration as static state deployed from above. Von Neumann was describing a system where the topology and logic are plastic, rewritten by the traffic itself. We engineer for consistency and availability under fixed rules; he speculated on a system that learns its own rules. The gap exists because we build services to resist change, whereas the brain is a service designed to be changed by its workload. We lack terms for "self-compiling based on error budgets." Thus, the inexpressible claims highlight where our engineering philosophy diverges from biological reality: we mask faults; the brain absorbs them into its structure. Our vocabulary assumes a deployment boundary that the brain does not recognize. We define success as uptime; he defines it as adaptation. The defect is ours: we built tools for stability, not evolution. The bridge to his reliable automata work is real, but our implementation stops where his speculation begins.

  **What I should stop saying**
  Stop saying the brain relies on redundancy alone. Redundancy is static; the brain is plastic. Stop implying our distributed systems are analogous beyond fault masking. We do not learn; we replicate. When writing, distinguish between engineering reliability (masking errors) and biological reliability (absorbing errors). Do not let your SLOs blind you to the fact that the brain changes its SLOs based on experience.
