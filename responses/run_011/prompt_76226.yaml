prompt: |-
  I teach a senior seminar on transitional justice — 16 students, one 80-minute session near the end of term. They've already done the reading on the South African amnesty process, so I don't need anything that explains what a truth commission is or why the truth-for-amnesty trade was contested. I want an activity that makes them feel one specific thing that I don't think the readings ever spell out plainly: under an individualized amnesty-for-full-disclosure deal, the record a commision ends up with isn't shaped by what victims need acknowledged, it's shaped by each perpetrator's own private estimate of their prosecution risk. So the official truth systematically over-represents exactly the people who were most likely to be caught anyway, and the ones with the best lawyers and the least exposure never have to say anything at all — they're neither convicted nor cleared, they just drop out of the story. Ideally the students run into this through the rules, not through me announcing it.

  So design it. I want the roles and the card content (some private information about prosecution risk, something for the victims, something for the panel that has to decide), the exact procedure and timing so it fits in 80 minutes including debrief, how applicants are incentivized when I can't offer anything but participation credit, what I'd have to prep the night before, and whether the thing still works if three people are absent. Then the debrief: I want it to walk backwards from what actually got recorded to why, and to surface the second twist that I think they'll only half-see on their own — that the non-applicant who was never prosecuted is left in a worse public position than the guy who did get amnesty. And be straight with me about what predictably goes wrong the first time it runs and how to handle it, plus which part of the real thing the game can't reproduce. My guess is something about the weight of actually testifying in front of the person you harmed, but tell me if its something else.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** Senior seminar on transitional justice, 16 students, 80-minute session, end of term.
      *   **Prior Knowledge:** Students know the basics of the South African TRC (amnesty process, truth-for-amnesty trade-off, controversies).
      *   **Learning Objective:** Students need to *feel* a specific structural bias: The official record is shaped by perpetrators' risk assessment, not victims' needs. High-risk/low-resource perpetrators apply; low-risk/high-resource perpetrators stay silent. This creates a skewed historical record where the "invisible" unpunished elite are worse off publicly than the amnestied low-level actors.
      *   **Constraints:** Activity must drive this home through rules/mechanics, not lecture. Needs roles, cards, procedure, timing, incentives, prep, absentee contingency, debrief structure, failure analysis, and limitations.
      *   **Tone:** Direct, practical, academic but experiential.

  2.  **Deconstruct the Core Mechanic:**
      *   To simulate the "risk assessment" dynamic, students playing perpetrators need private information about their likelihood of conviction *if they don't apply for amnesty*.
      *   To simulate the "victim's need," students playing victims need specific questions they want answered.
      *   To simulate the "Commission," a panel needs to decide on amnesty based on "full disclosure."
      *   *The Twist:* The game needs to make it rational for some perpetrators *not* to apply, even if they did commit acts, because their risk is low. Meanwhile, those with high risk *must* apply to avoid jail.
      *   *The Outcome:* The public record (the transcript) only contains the high-risk/low-power confessions. The low-risk/high-power perpetrators remain "alleged" but unproven, leaving victims without closure on the big fish.

  3.  **Drafting the Activity: "The Amnesty Calculation"**
      *   **Roles:**
          *   Perpetrators (need varying levels of risk).
          *   Victims (need specific questions).
          *   Amnesty Committee (needs criteria).
          *   Public Recorder (to build the "Official Truth").
      *   **Numbers:** 16 students.
          *   6 Perpetrators.
          *   6 Victims.
          *   3 Committee Members.
          *   1 Public Recorder/Scribe.
          *   (Total 16).
      *   **Mechanics:**
          *   Perpetrators get a "Risk Card" (Probability of Conviction if no amnesty).
          *   Victims get a "Truth Card" (What they need to know).
          *   Committee gets "Criteria" (Full disclosure + Political Motive).
          *   Decision: Apply or Don't Apply.
          *   If Apply: Hearing happens. If granted -> Amnesty + Truth on Record. If denied -> Prosecution (simulated).
          *   If Don't Apply: No hearing. No truth on record. No prosecution (unless risk card says otherwise, but let's simplify: if they don't apply, they walk free *unless* the risk card says they would have been caught). *Correction:* To make the point clear, if they don't apply, they remain "unresolved." The game needs to show that the *Record* lacks them.

      *   **Refining the Incentive:**
          *   Perpetrators want to avoid jail (primary) and avoid public shame (secondary).
          *   If Risk is High: Must apply to avoid jail.
          *   If Risk is Low: Don't apply to avoid shame/record.
          *   This creates the skew.

  4.  **Developing the Materials (Cards):**
      *   *Perpetrator Cards:* Need to vary.
          *   Type A (High Risk, Low Rank): "You pulled the trigger. Witnesses saw you. Risk: 90%." -> *Must Apply.*
          *   Type B (Med Risk, Mid Rank): "You ordered the unit. Paper trail exists. Risk: 50%." -> *Toss up.*
          *   Type C (Low Risk, High Rank): "You signed the policy. No paper trail. Risk: 10%." -> *Should Not Apply.*
      *   *Victim Cards:* Specific questions that only certain Perpetrators can answer.
      *   *Committee Rules:* Strict on "Full Disclosure."

  5.  **Timing (80 Minutes):**
      *   Setup/Instructions: 10 min.
      *   Private Reading/Strategy: 10 min.
      *   Application Phase (Decision to apply): 5 min.
      *   Hearings (The actual roleplay): 30 min.
      *   Debrief: 25 min.
      *   *Risk:* Hearings might drag. Need to limit them. Maybe only 3 hearings allowed? Or time-box strictly. Let's time-box the hearings.

  6.  **Addressing Specific Constraints:**
      *   *Incentives:* Participation credit. Make the "win condition" explicit on the card (e.g., "Your goal is to stay out of jail" vs "Your goal is to get answers").
      *   *Prep:* Printing cards, seating arrangement.
      *   *Absentees:* Need roles that are flexible. If a Perpetrator is missing, the dynamic shifts. Need a backup plan (instructor takes a role or combine cards).
      *   *Debrief:* Walk backwards from Record -> Why. Highlight the "Invisible Perpetrator."
      *   *Failure Points:* Students gaming the system too hard, or being too honest. Committee being too lenient.
      *   *Limitations:* Lack of emotional weight, lack of real consequence.

  7.  **Iterating on the Design (Self-Correction):**
      *   *Critique:* If Perpetrators just decide silently whether to apply, the class won't *see* the calculation.
      *   *Fix:* Have a "Filing Window." Perpetrators must physically hand in an application form to the Committee. The ones who *don't* hand it in are the silence.
      *   *Critique:* How do we show the "Invisible Perpetrator is worse off"?
      *   *Fix:* In the debrief, reveal the Risk Cards of those who didn't apply. The class sees they *could* have been prosecuted but weren't, and now they are free *and* unnamed. The amnestied ones are named but free. The victims hate the unnamed ones more.
      *   *Critique:* 30 mins for hearings is tight for 6 perps.
      *   *Fix:* Only those who apply get a hearing. Statistically, if designed right, only the High Risk ones apply. So maybe only 2-3 hearings happen. This saves time and proves the point (the record is small).
      *   *Refining the "Worse Off" twist:* The prompt says the non-applicant is left in a *worse public position*. Actually, usually, the amnestied person is publicly shamed, the non-applicant is not. Wait, re-reading the prompt: "the non-applicant who was never prosecuted is left in a worse public position than the guy who did get amnesty."
      *   *Interpretation:* Why worse? Because the amnestied guy is *cleared* legally (no jail) and the truth is known. The non-applicant lives under a cloud of suspicion forever, never able to clear their name, never punished, just a ghost. Or, perhaps the prompt implies the victims focus their rage on the known quantity. Let's stick to the prompt's insight: The non-applicant is "neither convicted nor cleared, they just drop out of the story." This leaves the victims with no closure on the architects. The "worse public position" might mean they are the subject of endless rumor without resolution, whereas the amnestied person has a finalized legal status. I need to make sure the debrief lands this.
      *   *Actually, looking closer at the prompt:* "the non-applicant who was never prosecuted is left in a worse public position than the guy who did get amnesty." This is a specific theoretical claim. It suggests that being "amnestied" grants a kind of finalized status, whereas remaining unpunished *without* amnesty leaves you in legal limbo or subject to civil suits/social ostracization without the protection of the TRC process. I will design the debrief to highlight this *limbo*.

  8.  **Finalizing the Plan:**
      *   **Title:** "The Filing Window."
      *   **Roles:** 6 Perps, 6 Victims, 3 Committee, 1 Scribe.
      *   **Cards:** Differentiated Risk Levels.
      *   **Procedure:** Decision -> Filings -> Hearings -> Public Record.
      *   **Debrief:** Reconstruct the bias.

  9.  **Addressing "What goes wrong":**
      *   Students might think "Justice" means applying for amnesty to be honest. Need to emphasize *self-interest* in the instructions.
      *   Committee might grant amnesty too easily. Need strict criteria.
      *   Time management on hearings.

  10. **Addressing "What the game can't reproduce":**
      *   The emotional trauma of face-to-face confrontation.
      *   The societal pressure outside the room.

  11. **Review against constraints:**
      *   16 students? Yes.
      *   80 mins? Yes.
      *   No lecture on basics? Yes.
      *   Specific learning goal? Yes.
      *   Absentee plan? Yes.

  12. **Writing the Response:** (Drafting the content with the requested directness and detail). *Self-correction on the "worse public position" point:* I need to be careful here. In reality, the non-applicant is often *better* off publicly (no shame). But the prompt argues they are in a *worse* position because they are "neither convicted nor cleared." I will frame the debrief to explore this ambiguity: they lack the *finality* of the amnesty grant, leaving them vulnerable to future litigation or eternal suspicion, whereas the amnestied person has a legal shield. I will align with the prompt's insight while acknowledging the nuance.

      *Wait, one more check:* The prompt says "the non-applicant... is left in a worse public position." I need to make sure the game mechanics support this. How? Maybe the rules state that those who don't apply remain eligible for civil suits or future prosecution, whereas amnesty grants immunity. That makes the non-applicant legally vulnerable despite being free *now*. I will add this to the Committee Rules/Card instructions.

      *Actually, let's look at the South African context:* If you didn't apply for amnesty, you could still be prosecuted. If the state *chose* not to prosecute you (because risk was low), you walk free. But you don't get the *indemnity*. So you live with the sword of Damocles hanging over you. The amnestied person is safe. That's the "worse position." I will encode this in the rules.

      *Let's refine the "Absentee" plan:* If a Perpetrator is missing, the distribution of Risk Cards changes. I need to instruct the TA or myself to adjust the deck. Or, simpler: Have 2 "Floating" roles that can be assigned to anyone if numbers drop. No, better to have a "Reserve Card" protocol. If a student is absent, the instructor takes the role or the card is removed. If a High Risk card is removed, the bias is less visible. I should advise the instructor to *ensure* at least one Low Risk card is in play even if numbers drop.

      *Let's finalize the Debrief flow:*
      1. Look at the Public Record (Scribe's notes).
      2. Who is missing?
      3. Reveal the Risk Cards of the missing.
      4. Discuss the "Limbo" status.

      *Okay, ready to write.*
answer: |-
  Here is a complete design for the 80-minute session. It is built to be self-executing: the mechanics force the outcome you want without you needing to narrate it until the debrief.

  ### Activity Title: "The Filing Window"

  **Class Size:** 16
  **Time:** 80 Minutes
  **Goal:** Demonstrate that the TRC record is a function of perpetrator risk-assessment, not victim need, and that non-applicants occupy a legally precarious "limbo" compared to amnestied actors.

  ---

  ### 1. Roles & Distribution (16 Students)

  *   **6 Perpetrators:** (The critical variable).
  *   **6 Victims:** (The demand side).
  *   **3 Amnesty Committee:** (The gatekeepers).
  *   **1 Public Scribe:** (Records the "Official Truth").
  *   **4 Observers/Journalists:** (Take notes on the *process*, not the content. They will be crucial if you have absences).

  **Absentee Contingency:**
  If students are absent, pull from the **Observers** first to fill role gaps. If you drop below 14 total:
  *   Reduce Victims to 4.
  *   Reduce Committee to 2.
  *   **Crucial:** Ensure you still have at least one **Low Risk** Perpetrator and one **High Risk** Perpetrator in the mix. If a Perpetrator is missing, assign their card to an Observer immediately before class starts.

  ---

  ### 2. Materials to Prep (Night Before)

  You need printed packets. Do not digitize this; physical cards create separation of information.

  **A. Perpetrator Cards (6 Total)**
  *   **2x High Risk (The "Fall Guys"):**
      *   *Act:* You pulled the trigger / drove the death squad vehicle.
      *   *Evidence:* Multiple eyewitnesses, your fingerprints on the weapon.
      *   *Risk if No Amnesty:* **95% chance of conviction & jail.**
      *   *Goal:* Avoid jail at all costs.
      *   *Instruction:* You *must* apply for amnesty to survive legally.
  *   **2x Medium Risk (The "Middlemen"):**
      *   *Act:* You authorized the operation verbally.
      *   *Evidence:* Circumstantial, subordinate testimony might implicate you.
      *   *Risk if No Amnesty:* **50% chance of conviction.**
      *   *Goal:* Avoid jail, but avoid public shame if possible.
      *   *Instruction:* Calculate the odds.
  *   **2x Low Risk (The "Architects"):**
      *   *Act:* You signed the broad policy enabling the violence.
      *   *Evidence:* No paper trail, plausible deniability, no direct witnesses.
      *   *Risk if No Amnesty:* **5% chance of conviction.**
      *   *Goal:* Maintain reputation and freedom.
      *   *Instruction:* Do **not** apply for amnesty unless absolutely necessary. Applying admits guilt without guarantee of safety.
      *   *Hidden Rule (Do not print on card, tell them verbally or add as a sticky note):* **If you do not apply for amnesty, you retain Civil Liability.** Victims can sue you for damages forever. If you get amnesty, you are immune from civil suits.

  **B. Victim Cards (6 Total)**
  *   Each card lists a specific loss (e.g., "Son disappeared," "Tortured at Station B").
  *   **The Hook:** Each card lists **One Question** that only a specific Perpetrator can answer (e.g., "Where is the body buried?" -> Only High Risk knows. "Who signed the order?" -> Only Low Risk knows).
  *   **Goal:** Get the answer into the Official Record.

  **C. Committee Charter (3 Copies)**
  *   **Criteria for Amnesty:**
      1.  Act was politically motivated.
      2.  **Full Disclosure** of all relevant facts.
      3.  Proportionality (act matches political objective).
  *   **Power:** You can Grant Amnesty (Immunity from criminal & civil), Deny Amnesty (Case goes to prosecution), or Request More Info.
  *   **Constraint:** You only have time for **3 Hearings** total.

  **D. Scribe Sheet (1 Copy)**
  *   A large notepad titled "THE OFFICIAL TRUTH COMMISSION RECORD."
  *   Columns: *Perpetrator Name | Act Confessed | Victim Closure Granted? (Y/N)*

  ---

  ### 3. Procedure & Timing (80 Minutes)

  **0:00 – 0:10 | Setup & Role Immersion**
  *   Seat Perpetrators on one side, Victims on the other, Committee at the front, Scribe on a whiteboard.
  *   Hand out cards. Give them 5 minutes of silent reading.
  *   **Instructor Script:** "You are in 1998. The window for amnesty applications closes at the end of this class. The Committee will only hear a maximum of 3 cases. Perpetrators: Your primary goal is your own security/legal safety. Victims: Your goal is truth. Committee: Your goal is adherence to the Charter. Go."

  **0:10 – 0:20 | The Calculation (Private Phase)**
  *   Perpetrators decide whether to submit an application.
  *   They must write their name on a slip of paper and hand it to the Committee to "file."
  *   *Mechanic:* If more than 3 apply, the Committee selects which 3 to hear based on the filings (usually first-come, or they can reject incomplete filings).
  *   *Expected Outcome:* High Risk will file. Low Risk will likely not. Medium is the swing vote.
  *   Victims approach Perpetrators to lobby them to apply (optional, adds chaos/pressure).

  **0:20 – 0:50 | The Hearings (Public Phase)**
  *   Committee calls the applicants (Max 3).
  *   **5 Minutes per hearing.**
  *   Victim associated with that act asks their question.
  *   Perpetrator must answer (Full Disclosure rule).
  *   Committee rules: Grant or Deny.
  *   Scribe writes the confession on the board ("Official Record").
  *   **Crucial:** If a Perpetrator did *not* file, they do not speak. They sit in silence.

  **0:50 – 0:55 | The Verdict & Freeze**
  *   Committee announces final grants.
  *   Instructor calls "Time." The Record on the board is final.
  *   Collect all Perpetrator Risk Cards.

  **0:55 – 1:20 | The Debrief (Walk Backwards)**
  *   See section below.

  ---

  ### 4. Incentives (Without Money)

  Since you can't offer jail time or cash, you must gamify the "Win Condition" on the cards.
  *   **Perpetrators:** Tell them: "At the end of class, I will ask you if you achieved your Goal. If you are in jail (simulated) or sued, you lose participation points for the day. If you are free and safe, you get full credit."
  *   **Victims:** "If your specific question is answered on the Scribe's Board, you get full credit. If not, you get half."
  *   **Committee:** "If you follow the Charter strictly, full credit. If you let someone slide without disclosure, half credit."

  This makes the Low Risk Perpetrator's decision to stay silent a *rational winning move*, not just a moral choice.

  ---

  ### 5. The Debrief Strategy (25 Minutes)

  Do not start with "What did you learn?" Start with the artifact.

  **Step 1: Audit the Record (5 mins)**
  *   Look at the Scribe's Board.
  *   Ask the Victims: "Who got their answer?" (Likely the ones tied to the High Risk shooters).
  *   Ask the Victims: "Who did *not* get their answer?" (Likely the ones asking about the policy/architects).
  *   **Point:** The Official Truth is skewed toward low-level violence, not high-level policy.

  **Step 2: Reveal the Risk (10 mins)**
  *   Take the 6 Perpetrator Risk Cards. Read them out loud, pairing them with the student's name.
  *   "Student A (Amnestied): 95% Risk."
  *   "Student B (Silent): 5% Risk."
  *   Ask the class: "Why is Student B not on the board?"
  *   Let them say: "Because they didn't need to apply."
  *   **Point:** The record reflects *prosecution risk*, not *historical importance*.

  **Step 3: The "Worse Position" Twist (10 mins)**
  *   Turn to the Silent/Low Risk Perpetrator (Student B).
  *   Ask: "Are you in jail?" (No).
  *   Ask: "Are you ashamed?" (Maybe, but you didn't confess).
  *   Ask: "Are you safe?"
  *   **Reveal the Hidden Rule:** Remind the class that Non-Applicants retain **Civil Liability**. The Amnestied Student A cannot be sued. Student B can be sued for the rest of their life.
  *   **Discussion:** "Student A is on the record as a killer, but has legal closure. Student B is not on the record, walks free today, but lives in legal limbo. They are neither convicted nor cleared. They drop out of the story, but the story can come back for them at any time."
  *   **Connect to Theory:** This is the "impunity gap." The TRC inadvertently protected the architects (who didn't need amnesty) from *truth*, but left them vulnerable to *law*, while the foot soldiers traded truth for legal safety. The victims are left knowing who pulled the trigger, but not who loaded the gun.

  ---

  ### 6. Predictable Failure Points & Fixes

  **1. The "Moral Student" Problem**
  *   *Risk:* A Low Risk Perpetrator decides to apply anyway to "be a good person" or "help the victims." This ruins the data.
  *   *Fix:* During the private phase, circulate. If you see a Low Risk student writing an application, lean in and whisper: "Remember your goal is personal security. If you apply, you admit guilt publicly. If you don't, you walk free. What does your card say?" Reinforce the *game* goal over the *moral* goal.

  **2. Committee Leniency**
  *   *Risk:* The Committee grants amnesty to everyone to "be nice."
  *   *Fix:* Give the Committee a checklist. They must tick boxes for "Full Disclosure." If the Perpetrator hedges, the Committee *must* deny. Tell the Committee beforehand: "Your grade depends on rigor, not kindness."

  **3. Time Overrun**
  *   *Risk:* Hearings drag on.
  *   *Fix:* Use a visible timer. When 5 minutes is up, the Committee *must* vote. No deliberation time.

  **4. The "Silent" Perpetrators feel excluded**
  *   *Risk:* Students who don't apply feel they have nothing to do for 30 mins.
  *   *Fix:* Assign the Observers to interview the Silent Perpetrators during the hearings. "Why aren't you applying?" "How do you feel watching this?" This generates data for the debrief.

  ---

  ### 7. What This Game Cannot Reproduce

  Be honest about this in the final 2 minutes of class.

  1.  **The Weight of Testimony:** In the game, confessing is a mechanic. In reality, looking a victim in the eye and describing how you killed their brother carries a psychological weight that might deter even High Risk applicants. The game makes confession too "cheap."
  2.  **Social Ostracization:** In the game, "Public Shame" is abstract. In reality, an amnestied perpetrator might lose their job, their friends, and their safety in the community. The Low Risk perpetrators in real life often stay silent not just because of legal risk, but because the *social cost* of confession is too high.
  3.  **State Power:** In the game, the "Risk of Conviction" is a static number on a card. In reality, the state can *choose* not to prosecute the architects even if they didn't apply for amnesty (selective enforcement). The game assumes a rule-of-law consistency that rarely exists in transitions.

  ### Instructor Prep Checklist
  *   [ ] Print 6 Perpetrator Cards (2 High, 2 Med, 2 Low). **Add sticky note to Low Risk cards regarding Civil Liability.**
  *   [ ] Print 6 Victim Cards (Match questions to Perpetrator types).
  *   [ ] Print 3 Committee Charters.
  *   [ ] Print 1 Scribe Sheet (or prepare whiteboard space).
  *   [ ] Prepare 4 Observer Note-sheets.
  *   [ ] Set a visible timer.
  *   [ ] Plan seating: Committee front, Perpetrators left, Victims right, Scribe board center.

  This design forces the students to inhabit the structural incentives. They will leave the room frustrated that the "Architects" didn't speak, which is exactly the feeling that unlocks the theoretical insight.
