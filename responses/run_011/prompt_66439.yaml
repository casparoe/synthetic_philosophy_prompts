prompt: |-
  I edit Wikipedia on the side, mostly articles about obscure hardware protocols and companies that went under in the 90s, and I've been in enough edit wars that I've internalized the sourcing rules. But the longer I follow them the wierder they look, and I want someone to spell out what theory of knowledge the whole thing is built on, because I doubt anyone on the project noticeboard could articulate it.

  The rules, as I'd summarize them to a coworker: what goes in an article is settled by what has already been published, not by what editors know or believe. If I'm certain something is true — I worked at the company, I was in the room when the decision got made, I have the internal design docs sitting on a drive somewhere — it still cant go in until some reliable outlet has printed it. Even combining two properly sourced facts to state a conclusion neither source states is banned; people get reverted for synthesis over an inference a ten-year-old could make. Eyewitness and first-person material counts as a primary source, which is treated as about the weakest thing you can offer. And if no reliable independent sources were ever published about a topic, there's no article at all — not a weak article, no article, as though the topic never happened.

  Here's the part I can't square. When the actual subject of a biography shows up on the talk page and says the article has her name or her employment history wrong, the standard answer is: go find a published source that says otherwise, and also you have a conflict of interest. The record beats the person the record is about. Meanwhile on the same site, every internal decision — which articles get deleted, which outlets count as reliable, whether a given publisher is known for fact-checking — gets made by consensus of experienced editors appealing to past decisions and their own accumulated feel for the place, and the no-original-research policy says explicitly that it doesn't apply to talk pages and deletion discussions. So community memory and judgment run everything procedural and are worth precisely zero on content. Same people, same afternoon, opposite rules.

  What does this apparatus presuppose? Is it committed to something like a claim being assertible only once an institution with a checking process has vouched for it in print — which would make social authorization the whole story and truth beside the point? Is it a theory of testimony, where a stranger's memory is worthless and a newsroom's is fine? Given the notability rule, does it presuppose that the published record constitutes what happened rather than merely being evidence about what happened? And which rival views does that quietly rule out — I'm thinking of views where the person who was there has the best standing to correct the record about her own life, or where knowing something is true is already enough to entitle you to say it.

  Then draw the line for me between what the practice strictly requires and what it just happens to fit nicely with. My suspicion is there's a much more boring story available — thousands of anonymous volunteers, no way to audit any of them, legal exposure around living people, so outsource the judgment call to institutions — and that story licenses the same rules with no epistemology attached. Tell me if that's right, and if it is, which specific rules still need the fancy story and which ones don't.

  Last thing: if you swapped in a view that gave real weight to first-hand memory, including the subject's own, what would have to change on the site? Not a slogan — the machinery. Who adjudicates between two people who were both there, what happens when memory and the record conflict and the memory is more likely correct, how you keep it from collapsing into anyone asserting anything about themselves, and whether the notability rule could survive the change at all.

  Please no reading list, I'm not going to read books, I just want the reasoning.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Experienced Wikipedia editor (obscure hardware/90s companies), familiar with edit wars, sourcing rules, NOOR (No Original Research), V (Verifiability), and NPOV (Neutral Point of View). Skeptical of the underlying epistemology.
      *   **Core Question:** What theory of knowledge (epistemology) underpins Wikipedia's policies? Is it a genuine philosophical stance or a pragmatic bureaucratic workaround?
      *   **Specific Tensions Identified:**
          *   Content vs. Process: Content requires published sources (external authority); Process relies on community consensus/memory (internal authority).
          *   Truth vs. Verifiability: Personal knowledge (even if true) is banned; Published knowledge (even if wrong) is preferred until corrected by *another* publication.
          *   Subject Authority: The subject of an article has less say than a random newspaper article about them.
      *   **Tasks:**
          1.  Articulate the epistemological presuppositions.
          2.  Distinguish between philosophical necessity and pragmatic/boring necessity (legal/volunteer scaling).
          3.  Speculate on the machinery changes required if first-hand memory were given weight.
      *   **Constraint:** No reading list. Just reasoning.

  2.  **Deconstruct the Epistemology (Task 1):**
      *   *What is Wikipedia actually doing?* It's not trying to be *true* in the absolute sense; it's trying to be *verifiable*.
      *   *Key Concept:* **Social Epistemology / Institutional Epistemology.** Truth is defined by social consensus mediated by institutions.
      *   *The "Truth" Claim:* Wikipedia doesn't claim "X is true." It claims "Reliable Source Y says X is true." This is a crucial distinction. It's a report on the state of public discourse, not a direct report on reality.
      *   *The Tension (Content vs. Process):* Why the double standard? Content is about *external* reality (needs external validation). Process is about *internal* governance (needs internal consensus). The epistemology shifts from "what is the world like?" to "how do we manage ourselves?"
      *   *Notability:* This is the strongest ontological claim. If it's not written about, it doesn't exist *for the purposes of an encyclopedia*. This is constructivist. It treats the *record* as the territory.

  3.  **Evaluate the "Boring Story" (Task 2):**
      *   *The User's Suspicion:* It's just liability and scaling.
      *   *Assessment:* The user is mostly right. The "fancy epistemology" is a post-hoc rationalization for liability management and volunteer coordination.
      *   *Legal/PR:* Libel laws (especially for BLP - Biographies of Living Persons). If an editor says "I know he's a fraud," Wikipedia gets sued. If an editor says "The NYT says he's a fraud," Wikipedia has a shield (Section 230 in US, similar elsewhere).
      *   *Scaling:* You can't audit 100,000 volunteers' claims of "I was there." You *can* check if a link goes to a reputable site. It's an algorithm for trust.
      *   *Which rules need the fancy story?* Mostly None. The "Verifiability, not Truth" policy is explicitly pragmatic. However, the *Notability* guideline leans harder into the ontological claim because it dictates existence, not just content.
      *   *Which rules don't?* BLP (Biographies of Living Persons) is pure legal defense. NOOR (No Original Research) is pure conflict avoidance.

  4.  **Simulate the Alternative (Task 3):**
      *   *Hypothesis:* What if first-hand memory counted?
      *   *Machinery Changes:*
          *   *Identity Verification:* You can't be anonymous. You need KYC (Know Your Customer) style verification to claim "I worked there."
          *   *Evidence Submission:* Private docs would need to be uploaded to a secure ticket system (OTRS/Zendesk), vetted by a trusted trustee, then summarized.
          *   *Adjudication:* If two people disagree, you need a arbitration court with subpoena power or heavy evidentiary standards. Currently, it's "who has the link."
          *   *Notability:* Would collapse. If memory counts, *everything* is notable to someone. You'd need a new filter (e.g., "impact" rather than "coverage").
          *   *Conflict of Interest (COI):* Would become the central battlefield. Currently, COI is managed by recusal. If memory counts, COI *is* the source. You'd need a weighted voting system based on verified proximity vs. neutrality.

  5.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the user's sharp observation. Validate the tension between content and process.
      *   *Section 1: The Epistemology.* Define it as **Second-Order Knowledge**. Wikipedia is a map of the library, not the territory. It's not "Truth," it's "Consensus of Reliable Institutions." Address the Content/Process split: Content is empirical (needs external check), Process is political (needs internal agreement).
      *   *Section 2: The Boring Story.* Confirm the user's suspicion. It's liability and scale. "Verifiability" is a legal shield. "No Original Research" is a conflict dampener. The "fancy story" is mostly rhetorical glue to keep volunteers motivated.
      *   *Section 3: The Line.* Distinguish what is pragmatic vs. philosophical.
          *   *Pragmatic:* BLP, COI, Verifiability (mostly).
          *   *Philosophical (sort of):* Notability. This is where Wikipedia decides what *exists*.
      *   *Section 4: The Alternative Machinery.* Walk through the practical breakdown if memory counted.
          *   Identity crisis.
          *   The "He Said/She Said" problem.
          *   The death of Notability.
          *   The shift from Encyclopedia to Archive.

  6.  **Refining the Tone:**
      *   Keep it analytical, slightly cynical (matching the user), but precise.
      *   Avoid Wikipedia jargon where possible, or explain it quickly (user knows it, but keep it clear).
      *   Ensure the distinction between *ontology* (what exists) and *epistemology* (how we know) is clear, as the user hints at this with the Notability question.

  7.  **Self-Correction/Edge Case Check:**
      *   *Did I answer the "Content vs Process" paradox?* Yes, by framing content as external representation and process as internal governance.
      *   *Did I address the "Subject Authority" issue?* Yes, under BLP/Liability.
      *   *Is the "Alternative Machinery" concrete?* Need to make sure I mention specific mechanisms like OTRS or arbitration, not just "it would be hard."
      *   *Did I avoid the reading list?* Yes.

  8.  **Final Polish:** Check against the prompt's specific questions.
      *   *Theory of knowledge?* Social/Institutional Epistemology (Second-Order).
      *   *Pragmatic vs. Fancy?* Mostly pragmatic.
      *   *Which rules need the fancy story?* Notability is the main one.
      *   *What changes if memory counts?* Identity, Evidence handling, Notability collapse.

      *(Self-Correction during drafting)*: I should emphasize that Wikipedia *claims* it's not an arbiter of truth. That's the key. The user asks if it presupposes truth is social authorization. Yes, effectively. But the *reason* is liability. I need to make sure I don't conflate the *justification* with the *mechanism*.

      *Refining the Content/Process split:* The user notes process relies on "community memory." This is because process is *constitutive* rules (how we play the game), whereas content is *regulative* rules (describing the world). Games define their own moves; encyclopedias describe external facts. That's a clean way to put it.

      *Refining the "Subject Authority":* The user asks about the subject correcting the record. The answer is legal indemnity. If the subject lies to make themselves look better, Wikipedia needs a shield. If the subject lies to hide a crime, Wikipedia needs a shield. Relying on the subject removes the shield.

      *Final check on the "Alternative":* If memory counts, Wikipedia becomes a wiki of *claims*, not *facts*. It becomes a primary source repository. That fundamentally breaks the "Encyclopedia" definition.

      Okay, ready to write.
answer: |-
  You have identified the central tension in the project, and your suspicion is correct: the "fancy epistemology" is largely a post-hoc rationalization for a bureaucratic and legal survival strategy. However, there is a coherent, if unspoken, theory of knowledge underneath it. It is not a theory of *truth*; it is a theory of *liability and scale*.

  Here is the breakdown of the apparatus, the pragmatic reality, and the machinery required to change it.

  ### 1. The Theory of Knowledge: Second-Order Epistemology

  Wikipedia does not operate on a correspondence theory of truth (statements match reality). It operates on a **social epistemology of record**.

  The fundamental axiom is: **Wikipedia is not a repository of facts; it is a repository of claims made by reliable institutions.**

  *   **Verifiability over Truth:** The policy "Verifiability, not Truth" is not just a slogan; it is an ontological boundary. Wikipedia claims to describe the *state of public discourse*, not the *state of the world*. If the world knows X, but the press says Y, Wikipedia records Y until the press says X. This makes Wikipedia a secondary source about primary and secondary sources.
  *   **The Content/Process Split:** You asked why process relies on community memory while content bans it.
      *   **Content** is descriptive. It claims to represent an external reality. To avoid becoming a blog of personal opinions, it requires external validation (sources).
      *   **Process** is constitutive. It defines the rules of the game itself. A game's rules are determined by the players, not by external newspapers. Therefore, community consensus (internal memory) is the valid authority for procedure, because procedure is internal to the community.
  *   **The Subject's Exclusion:** When a biography subject says, "I didn't work there," and Wikipedia says, "Show us a source," Wikipedia is treating the subject as a *party to a dispute*, not an *authority on truth*. In this epistemology, the subject has a conflict of interest (COI) by definition. Their testimony is considered biased data, not ground truth. The "record" (published sources) is treated as an independent witness, even if we know newsrooms make mistakes.

  **Does this presuppose the published record *is* what happened?**
  Functionally, yes. For Wikipedia's purposes, reality is isomorphic with the reliable published record. If an event occurred but left no trace in reliable media, it is epistemologically inaccessible to the project. This is a form of **constructivism**: the encyclopedia constructs reality out of available text, rather than mining text to reveal reality.

  ### 2. The Boring Story: Liability and Scaling

  You suspect the rules are just risk management for anonymous volunteers. You are right. The epistemology is a shield, not a philosophy.

  *   **Legal Indemnity:** If an editor writes "John Doe is a fraud" based on personal knowledge, and John Doe sues, the editor is exposed, and Wikipedia's immunity (Section 230 in the US, similar elsewhere) is tested against claims of actual malice or negligence. If the editor writes "The *Wall Street Journal* says John Doe is a fraud," Wikipedia is merely reporting on the *Journal*. The liability shifts to the publisher. The sourcing rules are a legal firebreak.
  *   **Auditability:** You cannot audit 100,000 anonymous volunteers. You cannot verify if someone actually "worked at the company in '94." You *can* verify if a link leads to a domain that looks like a newspaper. Sourcing rules turn a truth problem into a format problem. It allows untrained volunteers to adjudicate complex factual disputes by checking boxes (Is it a .gov? Is it a major paper?) rather than evaluating evidence.
  *   **Conflict Dampening:** "No Original Research" (NOOR) stops edit wars. If two editors argue about a fact, and neither has a source, the argument is unresolvable. If both must provide sources, the argument becomes about the *quality of the source*, which is easier to moderate than the *quality of the memory*.

  **Which rules need the fancy story?**
  Almost none of them require deep epistemology to function, except one: **Notability.**
  *   **Verifiability/BLP/NOOR:** These are purely pragmatic/legal. They could be justified entirely by "we don't want to get sued" and "we can't check your ID."
  *   **Notability:** This rule ("if no independent sources exist, no article") *does* rely on the ontological claim that "unrecorded history is not encyclopedia content." If you remove the epistemology, Notability collapses. Why shouldn't a local band with no press coverage have an article if a volunteer knows their setlist? The only answer is the philosophical one: "An encyclopedia summarizes existing knowledge, it does not host new data."

  ### 3. The Line: Strict Requirement vs. Convenient Fit

  *   **Strictly Required by the "Boring Story" (Liability/Scale):**
      *   **BLP (Biographies of Living Persons) strictness:** You must remove unsourced negative info immediately. This is pure legal defense.
      *   **Ban on Personal Knowledge:** You cannot verify identity at scale.
      *   **Preference for Secondary Sources:** Secondary sources (analysis) are safer than primary sources (raw data) because analysis implies someone else already did the fact-checking.
  *   **Convenient Fit (Epistemological Polish):**
      *   **Synthesis Bans:** Banning editors from connecting two dots (A + B = C) is framed as "no original research," but it's really about preventing editors from acting as investigators. It fits the epistemology, but the driver is risk avoidance.
      *   **The "Record Beats the Person" rule:** This fits the "social epistemology," but it exists because accepting subject testimony opens the door to PR firms and reputation management services editing articles directly.

  ### 4. The Alternative: If First-Hand Memory Counted

  If you swapped in a view that gave weight to first-hand memory (including the subject's), the machinery of the site would have to change fundamentally. It would cease to be a wiki and become a tribunal.

  **1. Identity Verification (KYC)**
  You cannot allow anonymous claims of "I was there."
  *   **Change:** Editors claiming firsthand knowledge would need to submit government ID and proof of affiliation (pay stubs, emails) to a trusted third party (like the Wikimedia Foundation OTRS team).
  *   **Result:** Anonymity vanishes. Volunteer numbers drop precipitously.

  **2. Evidentiary Hierarchy**
  Currently, a source is a binary: Reliable or Not. In a memory-based system, sources are weighted by proximity.
  *   **Change:** You need a scoring system. A subject's testimony might count for 50%, a coworker's for 30%, a news article for 20%.
  *   **Adjudication:** When the subject says "I wasn't fired" and the coworker says "I saw him get fired," you no longer look for a link. You look for corroborating evidence. Editors become judges. You need a formal discovery process.
  *   **Result:** Edit wars become legal battles. The "Bold, Revert, Discuss" cycle becomes "File Motion, Counter-Motion, Arbitration."

  **3. The Collapse of Notability**
  If memory counts, *everything* is notable to someone.
  *   **Change:** Notability guidelines (GNG) would have to be replaced by "Significance" guidelines. Who decides significance?
  *   **Result:** The site fills with articles about local garage bands, minor company departments, and neighborhood events, verified by the people who were there. The signal-to-noise ratio crashes. The site becomes an archive of human experience rather than a summary of published knowledge.

  **4. Conflict of Interest (COI) becomes the Core Feature**
  Currently, COI is a reason to recuse yourself. In a memory-based system, COI is the *only* way to access certain truths.
  *   **Change:** You would need a "Verified Insider" flag. These editors would have higher privileges but higher scrutiny.
  *   **Result:** A two-tier class system of editors: The Verified (who can assert facts) and The Unverified (who can only discuss). This creates a hierarchy that violates the wiki ethos of equality.

  **5. Memory vs. Record Conflicts**
  *   **Scenario:** The *New York Times* says the CEO resigned in 1995. The CEO (verified) says he was fired in 1994.
  *   **Current Rule:** The *Times* stands until the *Times* issues a correction or another major paper reports the firing.
  *   **New Rule:** You need a mechanism to override the public record. A "Truth Panel" of trusted editors would have to vote to accept the insider testimony over the published record.
  *   **Result:** Wikipedia becomes an arbiter of truth, exactly what it currently claims not to be. This increases legal liability exponentially.

  ### Summary

  The Wikipedia apparatus presupposes that **truth is a social product mediated by institutions**, but it enforces this rule because **institutions carry liability and volunteers do not.**

  The "fancy story" (social epistemology) is the user interface. The "boring story" (legal shielding and scaling) is the backend code.

  If you prioritize first-hand memory, you trade **scale and safety** for **accuracy and depth**. You gain the ability to correct the record where the press failed, but you lose the ability to run the project with anonymous volunteers. You turn an encyclopedia into a court of law. The Notability rule would not survive, because in a world where memory counts, every life has a historian (the person who lived it). The project would likely fracture into a verified "Archive" and an unverified "Wiki," or it would drown in the cost of verification.
