answer: |-
  There is no single established concept that precisely captures this mechanism.

  The phenomenon you describe sits at the intersection of three distinct literatures, none of which individually covers all your criteria. **Performativity** (specifically Michel Callon's material variant) captures the idea that technical arrangements and rules bring a reality into being, but it often retains a focus on the network of actors aligning themselves, and it does not inherently specify the temporal persistence after the original justification decays. **Dynamic Nominalism** (Ian Hacking) describes how classifications create kinds, but it is predominantly focused on "interactive kinds" where the classified people change their self-understanding, which you explicitly exclude. **Path Dependence** (political science and economics) explains the persistence and lock-in after a choice is made, but it treats the initial choice as a policy equilibrium rather than explaining how the classification ontologically transforms the material world (e.g., the chemistry of the wine). **Reification** describes the error of treating a social construct as a natural fact, but it implies the difference is *not* real, whereas in your cases the difference becomes empirically measurable.

  Because existing terms either rely on psychological internalization (belief), imply the difference is illusory (reification), or fail to account for the material lock-in, you should coin a term. I propose **Institutional Crystallization**.

  **Definition:**
  Institutional Crystallization is the process by which an arbitrary or instrumental classification becomes a material reality through the enforcement of regulatory scaffolding, independent of the classified subjects' beliefs, and persists via structural lock-in even after the original justification for the classification is removed.

  **Boundary Cases (What is NOT Institutional Crystallization):**
  1.  **Self-Fulfilling Prophecies:** If the mechanism relies on the subjects believing the classification and acting accordingly (e.g., students labeled "gifted" perform better because they believe they are smart), it is not Institutional Crystallization. Your mechanism must work via constraint, incentive, or infrastructure, not psychology.
  2.  **Pure Path Dependence:** If the classification persists but does not alter the underlying material properties of the classified objects (e.g., we keep using QWERTY keyboards even though Dvorak is better, but the keyboards don't chemically change), it is not Institutional Crystallization. The classification must generate a new, measurable empirical regularity that did not exist prior to the rule.
  3.  **Reification:** If the distinction remains purely social or legal without generating independent empirical differences (e.g., "citizen" vs. "non-citizen" remains a legal status without causing biological divergence), it is not Institutional Crystallization. The "crystal" must be hard data (chemistry, statistics), not just status.

  **Relation to Nearest Neighbours:**
  *   **Vs. Performativity:** Institutional Crystallization is a specific subtype of material performativity. While performativity focuses on the *act* of bringing into being, Crystallization emphasizes the *hardening* and *autonomy* of the result from its origins.
  *   **Vs. Dynamic Nominalism:** Both describe classification creating kinds. However, Dynamic Nominalism typically requires a "looping effect" through human consciousness. Institutional Crystallization bypasses consciousness, operating through bureaucratic and physical constraints.
  *   **Vs. Path Dependence:** Path Dependence explains the *duration* of the effect. Institutional Crystallization explains the *ontological shift* that occurs during the duration. You can have Path Dependence without Crystallization (sticking to a bad rule that changes nothing), but Crystallization relies on Path Dependence to complete the transition from arbitrary to "natural."

  Using **Institutional Crystallization** in a report will signal that you are describing a material outcome of policy, not merely a social perception, and that the effect is robust against changes in belief or original intent.
