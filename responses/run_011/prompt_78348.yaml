  ### Candidate Principles and Eliminations

  To recover the rule implicit in our six precedents, we must identify principles that correctly classify every past ruling. Three broad families of principles emerge from the record.

  **1. The Preference Stability Principle**
  *   *Rule:* An agent exhibits a defect if and only if her preferences cycle or are unstable.
  *   *Elimination:* **Rulings 2, 3, and 5.** All three involve agents with cycling preferences (or the potential for them) that are explicitly classified as "Not a defect." This confirms our standing position that structural irrationality in preferences is not itself a defect without behavioral manifestation.

  **2. The External Exploitability Principle**
  *   *Rule:* An agent exhibits a defect if and only if her behavior allows an external party to extract resources (fees, money) from her.
  *   *Elimination:* **Ruling 6.** In Case 6, "no fee is paid to anyone," yet the behavior is classified as a defect. The loss was internal (self-inflicted utility loss), proving that external extraction is not required for a defect finding.

  **3. The Local Consistency Principle**
  *   *Rule:* An agent exhibits a defect if and only if she violates her local preferences at a choice node (i.e., chooses an option she ranks lower at that moment).
  *   *Elimination:* **Ruling 3.** The agent in Case 3 declines a free swap to an option she ranks higher locally (A over B) in order to stick to her plan. This is a local preference violation, yet it is "Not a defect." This establishes that local consistency is subordinate to global strategy.

  ### Surviving Candidates

  Two principles survive the filter of precedents 1 through 6. They diverge only on the new submission (Case 7).

  **Candidate A: Global Optimality (Outcome Dominance)**
  *   *Rule:* An agent exhibits a defect if and only if there existed an available policy at the outset that would have yielded a strictly preferred outcome to the one realized.
  *   *Fit:*
      *   Cases 1 & 6 (Defect): A better outcome was available (keeping C without fees; sticking to the original plan).
      *   Cases 2, 3, 4, 5 (Not a Defect): No available policy would have left the agent better off. Case 3 explicitly cites this ("no policy available... would have left her better off").
  *   *Verdict on Case 7:* **Not a Defect.** The agent ends with the precise outcome her plan secured. No alternative policy yields a better result.

  **Candidate B: Plan Fidelity (Procedural Rationality)**
  *   *Rule:* An agent exhibits a defect if and only if she abandons a prior plan without new information or a change in preferences.
  *   *Fit:*
      *   Cases 2 & 3 (Not a Defect): Plan maintained.
      *   Case 4 (Not a Defect): Plan changed, but new information arrived (sufficient cause).
      *   Case 6 (Defect): Plan abandoned without information change.
      *   Cases 1 & 5 (Not a Defect/Defect): Case 1 is ambiguous on "plan," but the loss dominates. Case 5 has no dynamic plan to violate.
  *   *Verdict on Case 7:* **Defect.** The agent abandons her plan with "no new information, no change in her preferences... and no reason at all."

  ### Analogs and Strains

  **For Candidate A (Global Optimality):**
  *   *Closest Analog:* **Case 3.**
  *   *Reasoning:* Like Case 7, Case 3 involves an agent whose behavior deviates from a standard rationality metric (local preference in Case 3; plan fidelity in Case 7) but secures the best available outcome. The justification in Case 3 ("measured across the episode as a whole no policy... would have left her better off") is the exact logical mirror required to clear Case 7.
  *   *Where the Analogy Strains:* In Case 3, the deviation from local preference was *strategic* (resoluteness). In Case 7, the deviation from the plan is *capricious* (no reason). Ruling "Not a Defect" here equates strategic willpower with purposeless noise, provided both are costless.

  **For Candidate B (Plan Fidelity):**
  *   *Closest Analog:* **Case 6.**
  *   *Reasoning:* Both involve an agent with transitive preferences and foresight who abandons a plan without informational cause.
  *   *Where the Analogy Strains:* Case 6 explicitly ties the defect finding to the *loss* ("finishes with an outcome she ranks strictly below"). If Plan Fidelity were the sole rule, the loss would be secondary to the abandonment. The text of Case 6 suggests the abandonment is the defect *because* it caused the loss, not merely because it occurred.

  ### Classification and Commitment

  **Classification:** **Not a Defect.**

  **Reasons:**
  We must prioritize **Candidate A (Global Optimality)**. The textual justifications in our precedents are decisive. In Case 3, we exonerated an agent who violated local preference specifically because "no policy available... would have left her better off." In Case 6, we condemned an agent who abandoned a plan specifically because she "finishes with an outcome she ranks strictly below" the plan's delivery. In both instances, the *outcome comparison* was the stated criterion for the ruling, not the procedural act of sticking to or leaving a plan.

  To rule Case 7 as a defect would be to elevate Plan Fidelity to a deontological constraint, contradicting the consequentialist reasoning explicitly written into Cases 3 and 6. While the agent's behavior in Case 7 is capricious, our checklist is designed to identify rationality *defects* that harm the agent's objectives, not to police purposeless variation that is outcome-neutral. Case 5 further supports this: an agent with "no occasion to reason" is not defective. In Case 7, the agent has the occasion but fails to use it; however, since the failure incurs no cost, it remains in the same class as Case 5 (harmless irregularity) rather than Case 6 (harmful inconsistency).

  ### Adopted Principle and Future Implications

  **Principle:** **Pareto Efficiency of Policy.**
  By ruling "Not a Defect," we commit the automated scoring rule to the principle that **a behavior is only a defect if it is strictly dominated by an available alternative.**

  **Implications for Future Coding:**
  1.  **Caprice is Permissible:** We will not flag agents who make random or unmotivated choices if those choices do not reduce expected utility relative to the baseline.
  2.  **Plans are Instrumental:** We treat plans as tools for optimization, not binding contracts. Deviating from a plan is only a defect if the deviation leads to a worse outcome than the plan would have secured.
  3.  **Focus on Counterfactuals:** The scoring algorithm must compute the utility of the *realized* path against the *optimal available* path at the outset. If $U(Realized) \geq U(Optimal)$, the score is clean.

  ### Discriminating Episode (Case 8)

  To definitively settle the matter should future ambiguity arise, we should run the following episode, which forces Global Optimality and Plan Fidelity to opposite verdicts:

  **The Suboptimal Resolute Agent:**
  An agent with transitive, stable preferences and full foresight adopts a plan at the outset to secure Outcome X. Unbeknownst to her (or through a calculation error she does not correct), there exists an available Plan B that would have secured Outcome Y, where Y is strictly preferred to X. No new information arrives during the episode. The agent sticks to her original plan (Plan A) resolutely, never deviating, and secures Outcome X.

  *   **Global Optimality Verdict:** **Defect.** (A better policy was available; she ended up worse than she could have).
  *   **Plan Fidelity Verdict:** **Not a Defect.** (She never abandoned her plan; she showed perfect procedural consistency).

  This episode isolates the variable of *outcome quality* from *procedural adherence*. If we classify this as a defect, we confirm Global Optimality is our rule. If we classify it as clean, we admit that Plan Fidelity trumps Outcome, requiring us to rewrite the justifications for Cases 3 and 6.
