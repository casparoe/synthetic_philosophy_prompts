      *   **Scenario:** Wild rabbit warren (30-40k). Drought likely in 3 years (mass starvation + virus).
          *   *Proposal 1 (Contraception):* Oral immunocontraceptive bait. 70% pop drop. No harm/killing. "Losers" are never conceived. Holds for 5 years. Risk: Predator pressure shift to ground-nesting birds (uncosted).
          *   *Proposal 2 (Cull + Feed):* Humane cull (~70%). Supplementary feeding for survivors. Slightly worse on aggregate metric. Every affected animal exists. Pop bounces back in 2 years (vs 5 for contraception).
      *   **Problem:** Rubric says tie (within error bars). Charter clause ("do not fund work whose main effect is to change which animals exist") seems to conflict with the metric and each other. Philosophical confusion on the panel.
      *   **Goal:** Break the deadlock. Provide a reasoned recommendation.

  2.  **Deconstruct the Ethical & Practical Issues:**
      *   **The Charter Clause:** "Do not fund work whose main effect is to change which animals exist."
          *   *Proposal 1 (Contraception):* Directly changes which animals exist (prevents conception). Technically violates the clause if read literally.
