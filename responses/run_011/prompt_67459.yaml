          *   *Interpretation:* The clause is likely intended to prevent eugenics or speculative future-person manipulation, but in wild animal welfare (WAW), *any* intervention changes population dynamics. A literal reading bans almost all WAW interventions. It needs to be interpreted pragmatically or flagged for amendment.
      *   **The Rubric (Totalist Welfare-Adjusted Animal-Years):**
          *   Sums welfare across all animals.
          *   *Problem:* If an animal never exists, it contributes 0. If it exists and suffers, it contributes negative.
          *   *Proposal 1:* Fewer animals exist. Those that do exist have better welfare (no starvation). Total sum might be higher because negative welfare events are avoided, even though fewer positive welfare years are accumulated.
          *   *Proposal 2:* More animals exist (quick bounce back). Many suffer starvation later if feeding stops or if cull isn't enough.
          *   *Philosophical Issue:* Totalism struggles with non-identity. Does preventing a miserable life count as a gain? Yes, in negative utilitarianism or prior existence views. But the rubric is totalist.
      *   **Ecological/Vet Facts:**
