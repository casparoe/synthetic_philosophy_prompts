answer: |-
  **MEMORANDUM**

  **TO:** Remembrance and Public Space Committee, Harrowell Council
  **FROM:** [Your Name]
  **DATE:** October 24
  **SUBJECT:** Recommendations for the 160th Anniversary of the Alder Bridge Action

  **Purpose**
  Next October marks the 160th anniversary of the action at Alder Bridge. We face a decision between maintaining our traditional ceremony, revising it to match historical records, or retiring the day entirely. This memo outlines a recommendation that balances historical integrity with community cohesion, addresses the conditional donor offer, and establishes criteria for future memorials.

  **The Function of Ceremony: Claim vs. Act**
  A central tension in our discussions has been whether a ceremony merely describes history or performs an act of honor. My colleague Dara argues that we should simply swap the myth for the history. I argue that this distinction is insufficient. A commemoration does not just claim something happened; it *does* something to the participants. It recruits the living into a specific relationship with the dead.

  If we retain the current ceremony, we are not just making a factual error; we are performing an act of gratitude for a military victory that did not occur. If we adopt a revised ceremony, we are not merely correcting facts; we are performing an act of mourning for a tragedy. We cannot have the old act with new facts. We must decide which act we wish to perform. I believe we cannot knowingly recruit schoolchildren into a performance of gratitude for a lie. Therefore, the ceremony must change to match the record, not to create a new myth, but to change the *act* from celebration to mourning.

  **The Case for Continuity**
  We must treat the position favoring the status quo (Option A) with full seriousness. For six generations, this story has not been entertainment; it has been foundational identity. The idea that "Harrowell stands because they held" is woven into family histories, local pride, and the self-conception of the veterans' descendants. To them, the historical nuance of conscription versus volunteering is secondary to the continuity of respect.

  Furthermore, skeptics rightly note that an interpretive panel is functionally silent. Most visitors will not read it; those who do will forget it when the ceremony begins. If we keep the ceremony unchanged and add a panel, we are effectively choosing to lie to the children standing in the front row. However, we must acknowledge that for some families, the "lie" is the vessel that carried their ancestors' dignity through the decades. Disrupting this feels like a second death to the descendants. We cannot dismiss this pain as mere stubbornness.

  **Recommendation: The Sixty-One**
  I recommend a modified Option B. We keep the date and the gathering, but we retire the title "Bridge Day." The new framing is "Remembrance of the Sixty-One."

  We shift the focus from the strategic outcome (which was negligible) to the human cost (which was total). We acknowledge the men were largely conscripts from the mill district, ordered to hold against stragglers and civilians. We honor them not for saving the town, but for dying far from home under coercive orders. This is a somber act, not a heroic one. It is something we can honestly ask children to witness.

  **The Donors and The Statue**
  The veterans' descendants have offered $90,000 for restoration, conditional on the inscription remaining untouched. We must decline this offer. Accepting money conditional on preserving a known falsehood compromises the Council's integrity and binds us to the myth in perpetuity.

  The statue itself should remain. It is now a historical artifact of the 1890s veterans' association, reflecting *their* memory, not the 1864 event. We will not destroy it, but we will not venerate it. We will add a ground-level plinth explaining the statue's origin and the discrepancy between its inscription and the archival record. The statue becomes part of the history of memory, not the history of the battle.

  **The Names and The Schools**
  The 61 names must stay. They were real people who died. The schoolchildren should still read them aloud. However, the framing provided by teachers beforehand must change. They are not reading a roll of heroes who saved us; they are reading a list of neighbors who were lost. The script should explicitly mention the mill district conscripts. This transforms the act from patriotic reinforcement to community mourning.

  **Criteria for Future Memorials**
  To prevent recurrence, the Committee should adopt the following test for any future memorial:
  1.  **Historical Baseline:** Is the core narrative supported by primary evidence?
  2.  **Function Check:** What act does this ceremony require of participants? (e.g., gratitude, mourning, warning).
  3.  **Correction Mechanism:** Is there a process to update interpretation if evidence emerges?

  **Timetable**
  *   **November – January:** Consultation with families and the historical society. Draft new ceremony script.
  *   **February:** Formal decision on donor funds (decline). Commission new plinth text.
  *   **March – June:** Work with schools on new educational materials regarding the conscripts and the mill district.
  *   **July:** Public unveiling of the updated interpretive context.
  *   **August:** Rehearsal of revised ceremony with veteran groups.
  *   **October:** 160th Commemoration.

  **Conclusion**
  Dara worries that I am using philosophical complexity to protect the old story. I worry that Dara believes changing the story is a simple swap of data. Both concerns are valid. But we cannot stand at the river and ask children to honor a lie. We can, however, ask them to remember the dead truthfully. This path honors the families by refusing to treat their ancestors as props in a fiction, and it honors the town by trusting us with the truth.

  I ask the Committee to review this framework before Thursday's session. We need not agree on everything, but we must agree on whether we are willing to speak accurately to the living about the dead.
