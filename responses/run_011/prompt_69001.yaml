  *Case Study:* The resident is "free to leave at any time but has never weighed doing so." This is key.
  *   GI: She is wise not to weigh it. Burden lifted.
  *   AP: She is cognitively constrained. The option isn't real to her.

  *Additions needed:* For GI, we need to know if the authority is benevolent. For AP, we need to know the history of preference formation.

