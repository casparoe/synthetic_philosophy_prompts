answer: |-
  Thank you. To the Vardeman family, to the Town Council, to our colleagues from the university, and especially to the eighth graders busied in the back: thank you for letting me stand here.

  I am not a historian in the way the people in the third row are historians. I am a teacher. For thirty-three years I stood in front of classrooms in this town, and for the last ten, I have sat at a kitchen table with a magnifying glass and a laptop, typing out the county's quarter-sessions and poor-law records. Mostly by hand. From 1740 to 1830.

  When you spend that long with handwriting that fades into the paper, you stop looking for stories. You start looking for friction.

  These records were not written to be read by us. They were written to count people, to tax them, to prosecute them, or to bury them at public expense. They are the sound of a person rubbing up against an institution. And sometimes, if you look closely at the scratch of the pen, you can see where the institution slipped.

  My favorite person in the archive is a woman named **Sarah Doan**. She appears eleven times between 1798 and 1811. She is charged with linen theft. She is charged with receiving stolen goods. There is a bastardy proceeding. And once, she is charged with hitting a constable with a chamber pot.

  I have to pause there, because if we are going to dedicate a wing to these people, we have to allow them to be funny. Sarah Doan hitting a constable with a chamber pot is funny. It is also the only time in eleven entries that she seems to have won an argument.

  But I do not know if she was angry. I do not know if she was tired. Across all eleven entries, she has about forty words of recorded speech. Every one of them is a denial or a plea. And the clerk who wrote them down could not spell her name. He wrote it Doan, Dione, Doane, and Down. I am not going to stand here and tell you I have "given voice" to Sarah Doan. I haven't. I have typed the words the clerk wrote when she collided with the law. That is real. It is not nothing. But it is exactly that much.

  Then there is the burial register. This wall panel behind me is typed from that register. About a third of the entries read: "Child. No name. Of the workhouse."

  And there is a 1796 tax assessment that lists one loom and one cow against the name of a weaver—let's call him **Thomas Hines**—who appears nowhere else in any record that survives. He is not in the court records. He is not in the burial register. He is just a loom and a cow, counted once, and then gone.

  And then there is **Elias Vardeman**.

  His bust is in the lobby. His family has generously funded this wing. And I need to be honest about the relationship between Elias Vardeman, Sarah Doan, and the child with no name.

  The only reason we can say Sarah Doan's name today is that Elias Vardeman kept outstanding accounts. The only reason we know there was a workhouse to bury the child is that the town needed a system to manage the poor while men like Vardeman built the mills and the rope-walk that made the town rich. The machinery of commerce and law that Elias Vardeman operated within produced the paper. His success created the archive.

  To the Vardeman family: You are preserving the paper that records the people your ancestor's economy touched. Some of those interactions were wages paid. Some were debts collected. Some were prosecutions authorized. That is a complex legacy. It is not a simple hero story. But by funding this wing, you are choosing to steward the whole record, not just the portrait in the lobby. You are allowing us to keep the paper that proves Sarah Doan existed, even if the only reason the paper exists is because of the world Elias Vardeman helped build. That is a difficult thing to hear in front of your grandchildren. It is also the truth. And I thank you for letting me say it.

  To the historians here: You know the gaps better than I do. I am not trying to fill them with imagination. I am just pointing at the edges of the hole.

  To the eighth graders: You are about the same age Sarah Doan was when she first shows up in the ledger. You know what it feels like to be counted. You know what it feels like when an adult writes something down about you that you don't agree with. When you walk out to look at this wall, I want you to find one name. Just one.

  There is **Martha Gower** on the second panel. There is **John Harries** on the third. They are not famous. They did not build mills. They mostly appear in these records because they ran out of money, or because they got sick, or because they got into trouble.

  Here is what I want you to do. I am not asking for money. I am not asking you to volunteer. I am asking you to do the one thing these people were rarely allowed to do for themselves.

  When you look at the wall, pick a name. Read it out loud. Not in your head. Say it.

  If you say **Sarah Doan**, say it like she hit a constable with a chamber pot.
  If you say **Child, no name**, say it like you are sorry we don't know better.
  If you say **Elias Vardeman**, say it like you know he paid for the wall, but he didn't carve the letters.

  We cannot recover their inner lives. We cannot fix what happened to them. But we can refuse to let the ink dry up completely. We can look at the friction and acknowledge that something warm used to rub against this cold paper.

  So, when the reception is over, go look at the wall. Find a name. Say it. And then go home and write down the name of someone who isn't famous, but who matters to you. Put it somewhere it won't get thrown away. That is how we keep the record going.

  Thank you.

  ***

  **Cutting Notes (if running long):**

  1.  **The Sarah Doan Anecdote (Paragraph 4):** If you are running long, you can trim the specific list of charges ("linen theft... receiving... bastardy"). Just keep the chamber pot line. It's the strongest image.
  2.  **The Historians/Academics (Paragraph 10):** This paragraph ("To the historians here...") can be removed entirely. It addresses a small subset of the room and the point is made elsewhere about not filling gaps.
  3.  **The Specific Names on the Wall (Paragraph 12):** You can remove "Martha Gower" and "John Harries" if you need to save time, but keep the instruction to find *one* name. However, since you need 4 names total for the constraint, ensure you keep Sarah, Elias, and two others elsewhere if you cut these. (Better to cut the Historians paragraph first).
  4.  **The Vardeman Legacy (Paragraph 9):** You can tighten the sentence "Some of those interactions were wages paid... prosecutions authorized." to "Some were wages. Some were prosecutions." to save breath without losing the point.
