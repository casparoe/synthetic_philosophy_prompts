answer: |-
  ### Diagnosis of the Impasse

  Your working hypothesis is correct but requires sharpening. The impasse is **two questions under one heading**, but it is sustained by a **substantive disagreement about model adequacy**. It is not merely verbal, because the disagreement hinges on empirical claims about the magnitude of bias in standard quantitative genetic models.

  **1. The Two Questions**
  *   **Statistical Geneticists (SG)** are answering: *"What proportion of phenotypic variance in this specific population at this specific time is predictable from genetic relatedness?"* This is a question of **variance accounting and prediction**. The estimand ($h^2$) is valid if the math holds, regardless of the underlying biology.
  *   **Developmental Psychologists (DP)** are answering: *"To what extent is the phenotype the product of intrinsic genetic programs versus environmental inputs?"* This is a question of **causal mechanism and individual development**. They treat $h^2$ as a proxy for "genetic causation," which the variance decomposition does not license.

  **2. The Substantive Core**
  If it were only two questions, they could agree to disagree. The argument recurs because both sides believe their answer invalidates the other's utility.
  *   **SG Claim:** Even if $h^2$ conflates rGE, it remains the correct parameter for predicting response to selection or GWAS power. The "bias" is a feature of the population structure, not a bug in the math.
  *   **DP Claim:** If $h^2$ absorbs rGE (e.g., smart parents pass on genes *and* books), the estimate is empirically misleading for understanding development. The "missing heritability" gap (0.8 vs 0.45 for height) isn't just missing SNPs; it suggests the twin estimate (0.8) is inflated by shared environment or epistasis, violating the SG's assumption that the twin estimate is the "true" target.

  The impasse persists because SGs treat the DP's objections as *interpretational errors* (stop saying genes determine destiny), while DPs treat the SG's estimates as *measurement errors* (your number is biased by unmeasured environmental covariance).

  ### What Counts as Progress

  Progress will not come from better definitions alone, nor from larger GWAS. It requires a **reformulated estimand** coupled with a **study design** that empirically quantifies the "quiet work" you identified.

  **1. The Reformulated Estimand: Direct vs. Indirect Genetic Effects**
  Stop treating $h^2$ as a singular property of a trait. Move toward decomposing genetic variance into:
  *   **Direct Genetic Effects:** The biological effect of the individual's genotype on their phenotype.
  *   **Indirect (Social) Genetic Effects:** The effect of the genotype on the environment (rGE), which then affects the phenotype (e.g., parental genotype shaping the home environment).
  *   *Why this helps:* It accepts the SG's math but adopts the DP's causal concern. It acknowledges that "heritability" includes "inheritability of environment."

  **2. The Study Design: Trio/Within-Family GWAS + Measured Environments**
  The empirical sub-question (how much rGE gets absorbed into A) must be made explicit.
  *   **Design:** Use within-family GWAS (comparing siblings) to strip out population stratification and passive rGE. Combine this with longitudinal measurement of specific environmental mediators.
  *   **Progress Metric:** A study that reports: "Total $h^2$ is 0.6; 0.35 is direct genetic; 0.25 is mediated via [Specific Environment X]."
  *   **Outcome:** This forces the SG side to acknowledge that the "A" component is heterogeneous, and forces the DP side to acknowledge that a residual direct genetic effect remains even after accounting for measured environments.

  **3. The Conceptual Shift: Indexicality as Data**
  The DP side argues indexicality (context-dependence) makes $h^2$ useless. Progress occurs when both sides treat indexicality as **data**. If $h^2$ for aggression is 0.5 in a high-stress school and 0.2 in a low-stress school, that *difference* is a finding about $G \times E$, not a refutation of heritability. The estimand becomes the *slope* of heritability across environmental gradients, not a single point estimate.

  ### Confidence and Uncertainty

  **Confidence:** **85%**.
  This diagnosis aligns with the philosophical literature (e.g., Lewontin's critique, Keller's *The Gene-Environment Dialectic*, and recent work on "GWAS by proxy"). The distinction between variance decomposition and causal mechanism is the standard resolution in philosophy of biology, and the move toward within-family designs is the current cutting edge in statistical genetics to address exactly these confounds.

  **Point of Least Certainty:**
  I am least sure about the **epistemic commitments of the Statistical Geneticist side**.
  In your description, the SGs defend $h^2$ as a "well-defined estimand" and accuse critics of confusing math with gloss. However, in practice, many SGs *do* rely on the pop gloss (e.g., using high $h^2$ to argue for biological essentialism or to deprioritize environmental interventions). If the SG side is secretly relying on the causal interpretation they publicly disavow, then the impasse is not just "two questions" but **intellectual bad faith**. If they genuinely only care about prediction, the DP's concerns about developmental causality should be irrelevant to them. The persistence of the argument suggests the SGs *do* care about the causal implication, making the "two questions" diagnosis slightly too charitable. If they are smuggling causal claims into variance parameters, no amount of estimand reformulation will fix it without a normative shift in how results are communicated.
