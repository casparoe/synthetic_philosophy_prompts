          5.  Falsifiability (What counts against the view?).
          6.  Rules you'd never dream of violating (meaningful difference?).
      *   **Constraints:** No softballs, no filler, no reading list. Rate confidence in predicted replies. Identify the least fair question/strawman risk.

  2.  **Deconstruct the Guest's Theory:**
      *   *Core:* Legitimacy comes from having a say if you are subject to coercive sanctions.
      *   *Scope:* Non-state actors (platforms, treaties).
      *   *Meta:* Demos paradox is pseudo (legitimacy doesn't require self-constitution).
      *   *Vulnerability:* "Coercion" is slippery. "Subjection" can be over-inclusive (empire problem) or under-inclusive (potential coercion vs. actual). The boundary of the boundary (who decides who is subjected?) is a classic regress problem.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Q1: Warm-up but concrete.* Let's start with the platform angle since she applies it beyond states.
          *   Case: Content moderation on a global platform.
          *   Reply: Users are subjected to Terms of Service sanctions.
          *   Follow-up: What about non-users affected by the content? (Wait, she rejects "affectedness".) Better: What about the algorithmic workers?
          *   *Revision:* Let's stick to the prompt's specific cases first to ensure coverage, then fill in gaps.

      *   *Q1 (Homeless Person):* Prompt requirement.
          *   Case: Homeless person in City A, law against sleeping in parks in City B (never visited).
          *   Reply: No coercion actually applied/threatened *to them* specifically. Subjection requires a credible threat.
          *   Follow-up: But the law exists *in potentia*. If they cross the invisible line, coercion hits. Is the boundary of the demos a moving target based on where people walk?
          *   *Confidence:* High. This is a standard ASP objection.

      *   *Q2 (Data Protection):* Prompt requirement.
          *   Case: EU GDPR applying to a US user who never visited EU.
          *   Reply: The platform is sanctioned, which coerces the platform, which coerces the user (restriction of service).
          *   Follow-up: So the user is subjected *via* the corporation? Does that make the corporation the sovereign? If the corporation lobbied for the law, are they subjecting themselves to themselves?
          *   *Confidence:* Medium-High. The "vicarious coercion" line is tricky.

      *   *Q3 (Occupied Territory/Empire):* Prompt requirement. High stakes.
          *   Case: Military occupation. Occupier imposes laws with sanctions.
          *   Reply: Yes, they are subjected, so they should vote.
          *   Follow-up: That dissolves self-determination into imperial enfranchisement. Are you arguing occupied peoples should vote for the occupier's parliament rather than their own independence?
          *   *Confidence:* High. This is the classic "Imperial Incorporation" objection to ASP.

      *   *Q4 (Who Calculates?):* Prompt requirement.
          *   Case: A treaty body deciding which NGOs get sanctioning power.
          *   Reply: Institutional rules determine subjection.
          *   Follow-up: Who writes those institutional rules? If the demos is defined by the institution, the institution defines its own legitimacy. Isn't that the paradox you said was pseudo?
          *   *Confidence:* Medium. Depends on her specific meta-theory.

      *   *Q5 (Rules Never Violated):* Prompt requirement.
          *   Case: A law against cannibalism. I will never do it.
          *   Reply: The sanction still backs the rule. You are still liable.
          *   Follow-up: If liability is purely hypothetical, isn't "subjection" just "existence under a state"? How is this different from the "affectedness" principle you reject?
          *   *Confidence:* High.

      *   *Q6 (Falsifiability):* Prompt requirement.
          *   Case: Abstract.
          *   Reply: If coercion exists without a claim to vote.
          *   Follow-up: Can you give a historical example where you'd say "They were subjected but *should not* have been enfranchised"?
          *   *Confidence:* Medium. Theorists hate falsifiability questions.

      *   *Q7 (Private Arbitration):* Need a non-state case.
          *   Case: Mandatory arbitration in employment contracts.
          *   Reply: Employees are subjected to private law.
          *   Follow-up: If they vote in the "arbitration demos," do they vote out the CEO? Or do they vote in the state demos to ban arbitration? Which demos is sovereign?
          *   *Confidence:* High. Highlights the "multiple demoi" problem.

      *   *Q8 (The Exit Option):* Pressure ramp.
          *   Case: A platform where you can delete your account vs. a state where you can't emigrate.
          *   Reply: Coercion is about the *nature* of the sanction, not the exit cost.
          *   Follow-up: If exit negates coercion, then global capital is immune. If exit doesn't matter, is a Facebook ban the same as prison?
          *   *Confidence:* Medium-High.

      *   *Q9 (Temporal Boundary):* Pressure ramp.
          *   Case: Future generations subject to climate treaties.
          *   Reply: They aren't currently subjected to sanctions.
          *   Follow-up: So the demos is only the living? Your view justifies intergenerational tyranny.
          *   *Confidence:* High.

      *   *Q10 (The Meta-Paradox):* Final pressure.
          *   Case: The founding of the body that decides subjection.
          *   Reply: Legitimacy is continuous, not foundational.
          *   Follow-up: Without a founding moment, how do you distinguish a legitimate regime from a successful mafia? Both coerce and sanction.
          *   *Confidence:* Medium.

  4.  **Review and Refine:**
      *   Check against constraints: 10 questions? Yes. Concrete cases? Yes. Predicted replies + Follow-ups? Yes. Confidence ratings? Yes. Strawman check? Yes.
      *   *Ordering:* Need to ramp up pressure.
