answer: |-
  Here are ten questions designed to move from definitional clarity to structural contradictions, anchored in the specific cases you requested.

  ### 1. The Homeless Traveler
  **(a) Case:** A homeless person lives in City A. City B has a strict law against sleeping in parks, backed by fines and arrest. This person has never been to City B, has no intention of going, and possesses no property there.
  **(b) Predicted Reply:** They are not part of City B's demos. Subjection requires a *credible* threat of sanction. Without presence or intent to enter, the coercion is not operational.
  **(c) Follow-up:** So the boundary of the people shifts every time someone crosses a municipal line? If the demos is fluid based on movement, how do you hold a stable election? Do we need real-time voter registration at every city border to avoid legislating for people who aren't currently "subjected"?
  **Confidence:** High.
  **Risk:** Low. This is a standard objection to the All-Subjected Principle (ASP).

  ### 2. The Cannibalism Statute
  **(a) Case:** Consider a law against cannibalism. I am a sane adult who would never dream of violating this rule. The state sanctions it, but the probability of me ever being coerced under it is zero.
  **(b) Predicted Reply:** You are still subject to the rule. Liability is what matters, not the likelihood of enforcement. The sanction backs the rule regardless of your intent.
  **(c) Follow-up:** If liability alone counts as subjection, then everyone under a state's jurisdiction is equally subjected, regardless of their behavior. Doesn't that collapse your "coercion" criterion back into the "affectedness" or "jurisdiction" criteria you claim to reject? Where is the distinct work "coercion" is doing here?
  **Confidence:** High.
  **Risk:** Low. Tests the distinction between potential and actual coercion.

  ### 3. The Extraterritorial Data Subject
  **(a) Case:** The EU's GDPR imposes heavy fines on tech companies for mishandling data. I am a US citizen who has never visited Europe, but my data is processed by an EU-regulated firm. The firm restricts my features to comply.
  **(b) Predicted Reply:** You are subjected. The EU coerces the firm, and the firm coerces you via service restriction. The chain of sanctions makes you part of the relevant demos.
  **(c) Follow-up:** If I'm in the EU demos because a corporation mediates the coercion, does the corporation get a vote too? Or are you arguing that my enfranchisement is derivative of the corporation's subjection? If it's derivative, doesn't that make the corporation the sovereign, not the people?
  **Confidence:** Medium-High.
  **Risk:** Medium. She might argue the coercion is direct (legal liability on the user), but the "vicarious coercion" angle is sticky.

  ### 4. The Private Arbitration Clause
  **(a) Case:** An employment contract mandates private arbitration for disputes, backed by the state's enforcement of contracts. The arbitration body can sanction employees (firing, blacklisting).
  **(b) Predicted Reply:** This is a private regime with coercive power. The employees constitute a demos relative to that arbitration body and should have a say in its rules.
  **(c) Follow-up:** If employees vote to abolish the arbitration clause, but the state enforces the contract anyway, the state is the real coercer. If the state lets them abolish it, the employer was never the sovereign. How do you prevent your theory from fracturing the demos into infinite overlapping spheres until "the people" disappears entirely?
  **Confidence:** High.
  **Risk:** Low. Highlights the "multiple demoi" problem.

  ### 5. The Exit Option
  **(a) Case:** Compare a Facebook ban (you lose access to a platform) with a state ban (you lose access to territory/rights). Both are sanctions backed by rules.
  **(b) Predicted Reply:** The *type* of coercion matters. State coercion is unique because it claims a monopoly on legitimate force and restricts exit.
  **(c) Follow-up:** You've just introduced a qualitative distinction between *types* of coercion. If the quality of coercion matters, why doesn't the *quality* of the affected interest matter? If I'm coerced out of my livelihood by a platform, why is that less democratically significant than being coerced out of a park?
  **Confidence:** Medium.
  **Risk:** Medium. She may dig in on the "monopoly on violence" distinction, but this forces her to rank harms.

  ### 6. The Occupied Territory (Empire by Enfranchisement)
  **(a) Case:** A military occupation imposes a new legal order on a territory, backed by sanctions. The local population is now fully "subjected" to the occupier's coercion.
  **(b) Predicted Reply:** Under the all-subjected principle, they should have representation in the occupier's legislature.
  **(c) Follow-up:** This turns self-determination into enfranchisement within the empire. If you tell an occupied people, "You don't get independence, you get to vote for our parliament," aren't you using democratic theory to legitimize imperial annexation? At what point does subjection demand *secession* rather than *integration*?
  **Confidence:** High.
  **Risk:** **High (Strawman Warning).** *See note at end.* This is the most dangerous question. She may argue that *illegitimate* coercion (occupation) doesn't create democratic obligations, only *legitimate* coercion does. If she takes that out, this question assumes her view applies to illegitimate regimes.

  ### 7. The Administrator of Subjection
  **(a) Case:** A treaty body is set up to regulate climate sanctions. They must decide which NGOs are "subjected" enough to get voting seats.
  **(b) Predicted Reply:** The treaty rules define the scope of subjection.
  **(c) Follow-up:** Who writes the treaty rules? If the body that decides *who counts as subjected* is itself unelected, then the real demos is the one administering the calculation, not the subjected people. Doesn't this make the "boundary problem" just a technical admin issue for elites?
  **Confidence:** Medium-High.
  **Risk:** Medium. Targets the regress problem (who bounds the boundary?).

  ### 8. The Falsifiability Check
  **(a) Case:** Abstract scenario. You argue legitimacy flows from subjection to coercion.
  **(b) Predicted Reply:** If a group is subjected to sanctions without representation, the regime is illegitimate.
  **(c) Follow-up:** Can you name a historical case where you would say, "This group was subjected to coercion, but they *should not* have been given the vote"? If the answer is no, your theory is tautological: anyone who should vote is defined as "subjected."
  **Confidence:** High.
  **Risk:** Low. Forces her to admit if the theory is normative or descriptive.

  ### 9. The Future Generations Gap
  **(a) Case:** A climate treaty imposes sanctions on current emitters to protect future people. Future people will be subjected to the consequences, but cannot be sanctioned themselves.
  **(b) Predicted Reply:** Future people cannot be subjected to *sanctions*, so they aren't in the demos.
  **(c) Follow-up:** So your theory justifies intergenerational tyranny. If the only trigger for a vote is liability to punishment, the living can coercively bind the dead without recourse. Is "immunity from sanctions" the price future generations pay for your theory?
  **Confidence:** High.
  **Risk:** Low. Exposes the temporal limitation of ASP.

  ### 10. The Mafia vs. State (The Paradox Return)
  **(a) Case:** A protection racket run by a mafia. They back rules with sanctions (violence). Residents pay and obey.
  **(b) Predicted Reply:** The mafia lacks legitimate authority. Subjection must be to a *claim* of right, not just force.
  **(c) Follow-up:** You said the demos-paradox is pseudo and legitimation doesn't require a self-constituting act. But if you need a "claim of right" to distinguish the state from the mafia, who validates that claim? If it's not the people constituting themselves, isn't it just successful force? How is your view not "might makes right" with a voting booth attached?
  **Confidence:** Medium.
  **Risk:** Medium. This attacks her meta-theoretical rejection of the demos paradox. She may have a complex normative account of "authority" ready, but this forces her to explain the source of legitimacy if not "the people."

  ***

  ### Confidence & Fairness Assessment

  **Least Confident Prediction:** **Question 6 (Occupied Territory).**
  **Why:** Political theorists who work on the boundary problem often distinguish between *coercion* and *domination* or *legitimate vs. illegitimate authority*. She might reply that the all-subjected principle only applies to *just* coercive structures, or that occupation creates a duty of *withdrawal* rather than *enfranchisement*. If she makes that move, Question 6 looks like a strawman because it assumes her principle applies indiscriminately to all coercive power.
  **Mitigation:** Listen closely to her answer. If she says "Only legitimate coercion counts," pivot immediately to Question 10 (Mafia vs. State) to ask how legitimacy is determined without the people.

  **Highest Confidence Prediction:** **Question 1 (Homeless Traveler) & Question 8 (Falsifiability).**
  **Why:** These are standard pressure points for the All-Subjected Principle. Most proponents have a rehearsed line on "credible threats" and struggle with falsifiability.

  **Strawman Warning:**
  **Question 6** is the one most likely to be wearing a "case-study costume." If her theory includes a normative filter (i.e., "only subjection to *rightful* authority triggers enfranchisement"), then asking if she supports imperial enfranchisement mischaracterizes her view. However, if she holds to a pure factual account of coercion (i.e., "any sanctioning power triggers enfranchisement"), the question is valid. I recommend asking it, but be prepared to acknowledge the distinction between *force* and *authority* if she raises it.
