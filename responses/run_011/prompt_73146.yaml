prompt: |-
  I run a grad-student podcast and next month we're recording with a political theorist who has a pretty specific take on the boundary problem — the question of who counts as "the people" that gets to vote on anything. Her view: the demos is bounded by subjection to coercion rather than by being affected, and she applies it well beyond states — to platforms, private arbitration bodies, treaty regimes, basically anything that backs its rules with sanctions. She also thinks the whole demos-paradox business is a pseudo-problem, on the grounds that legitimation doesn't require a self-constituting act by a pre-existing people.

  I dont want a run of softball questions that let her re-explain the view for twenty minutes. Give me about ten, in an order that ramps up the pressure, and for each one tell me (a) the concrete case it's built on — every question should be anchored in a scenario, not a slogan, (b) the reply she's most likely to give, and (c) the follow-up that makes that reply cost her something.

  A few cases I definitely want in there: a homeless person and a law against sleeping in parks she's never been near or broken; the extraterritorial reach of a data-protection regulation over users who've never set foot in the jurisdiction; and an occupied territory, where the all-subjected logic seems to imply the occupied population should be voting in the occupier's legislature instead of getting self-determination — I want a question that pushes her on whether her view turns out to be an argument for empire by enfranchisement. Also one about who runs the calculation of who counts as subjected, since whoever administers that looks like they become the real demos.

  Please include one question that just asks what case or evidence would count against the view, and one that gets at whether being subject to rules you'd never dream of violating is meaningfully different from not being subject at all. No "what drew you to political theory" filler, and don't tack on a reading list — I won't have time to chase sources, the questions have to work on thier own.

  Last thing: rate how confident you are that each predicted reply is really the one she'd give (rough scale is fine), and single out the one question where you're least sure you've characterized her position fairly. If any of them are strawmen wearing a case-study costume, tell me which.
