  6.  **Writing the Output:** (Drafting the response based on the above plan). *Self-Correction during drafting:* Make sure the "Homeless" question distinguishes between *potential* and *actual* coercion clearly. Make sure the "GDPR" question highlights the chain of coercion. Ensure the "Empire" question forces the self-determination vs. enfranchisement trade-off.

