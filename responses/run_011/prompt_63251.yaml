  ### Decomposition

  I treat the final credence as a weighted function of four probabilistic terms. Each term represents the likelihood that a specific source of disagreement is *neutralized* by the technological scenario. High probability here increases the final credence; low probability decreases it.

  1.  **Conversion Tech Efficacy (0.95)**
      *   *Justification:* Accepting your premise: if exoskeletons and metabolic meds are cheap utilities, the empirical wedge regarding physical conversion factors effectively vanishes. Resourcism and Capability converge on the *price* of basic functioning.
  2.  **Resourcist Internalization (0.70)**
      *   *Justification:* Dworkin's hypothetical insurance market adapts quickly to cheap fixes. If disabilities are cheap to correct, insurance payouts shrink, mimicking the Capability Approach's demand for basic functioning assurance without needing a new metric.
  3.  **Responsibility/Agency Wedge Neutralization (0.25)**
      *   *Justification:* Low probability. The core dispute often isn't conversion costs but *option luck*. Even with cheap tech, DR denies compensation for chosen disadvantages (e.g., refusing meds, expensive tastes), while CA is often skeptical of holding people responsible for adaptive preferences or social conditioning. Tech doesn't solve this normative split.
  4.  **Social/Political Residual Neutralization (0.40)**
      *   *Justification:* Medium-low. Tech fixes bodies, not stigma. "Showing up without shame" or "meaningful political participation" depend on social recognition, not just prosthetics. CA prioritizes these functionings; DR treats them as preferences or resource-derived opportunities. Divergence remains likely here.

  **Combination Method:**
  I calculate a **Weighted Agreement Score** based on the frequency of these issues in realistic allocation cases, then apply a **Threshold Penalty**.
  *   *Weights:* Conversion issues (50% of cases), Responsibility issues (30%), Social/Political issues (20%).
