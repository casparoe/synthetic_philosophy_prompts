      *Wait, D5 is the problem.* I should frame the Desiderata as what the committee *wants* the theory to do, even if they conflict. The prompt asks for "what any account... has to deliver." So I list the intuitions we want to satisfy. Then I show they conflict.

      *Revised Plan:*
