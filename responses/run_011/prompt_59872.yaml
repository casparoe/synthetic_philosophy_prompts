answer: |-
  **MEMORANDUM TO THE ACQUISITIONS AND AUTHENTICATION COMMITTEE**

  **SUBJECT:** Specification of Desiderata for Originality and Value

  **DATE:** October 26, 2023

  **FROM:** Committee Member

  **RE:** Standardization of Authentication Criteria

  Per our recurring difficulties in adjudicating disputed objects, the following specification outlines the necessary conditions any theory of originality must satisfy to serve this museum's mixed holdings. We require an account that explains why we reject some copies and accept others without resorting to ad hoc reasoning.

  ### I. The Desiderata

  Any viable account of why an original is worth more than an indistinguishable copy must deliver the following five requirements.

  **1. The Historical Genesis Constraint**
  *   **Requirement:** The value of the object must depend, in some category of holdings, on the specific history of its production, not merely its current physical state.
  *   **Motivating Case:** *The Flawless Forgery.* A painting perceptually identical to a Vermeer is deemed worthless upon exposure as a modern fake. If value were purely perceptual, the exposure would change nothing. Since the exposure *does* destroy the value, the account must admit that non-perceptual historical facts (who made it, when, and with what intent) constitute part of the object's identity and worth.

  **2. The Ontological Category Constraint**
  *   **Requirement:** The account must distinguish between works where the specific physical instance is the work (autographic) and works where the physical instance is merely a manifestation of a structure (allographic/functional).
  *   **Motivating Case:** *Baroque Scores and Wine.* An exact re-performance of a Telemann score is not considered "second-rate" compared to the premiere; the work is the structure, not the specific sound waves. Similarly, a bottle of 1982 Bordeaux is valued as an instance of a vintage, not as a unique artistic gesture. A theory that treats a painting like a performance (or vice versa) will fail to explain why we accept copies in the music cellar but reject them in the gallery.

  **3. The Integrity of Attribution Constraint**
  *   **Requirement:** The moral status of the representation (honest vs. deceptive) must be capable of altering the aesthetic or market status of the object.
  *   **Motivating Case:** *The Signed Copy.* A flawless copy of a painting, if signed and dated by the actual copier, is accepted as a legitimate achievement (a "study" or "homage"). The physical object is identical to the forgery case above; the only variable is the truthfulness of the attribution. The theory must explain how honesty transforms a worthless forgery into a valued artifact without changing the pixels on the canvas.

  **4. The Material Continuity Threshold**
  *   **Requirement:** The account must define a limit to which an object can undergo material replacement while retaining its identity as the "original."
  *   **Motivating Case:** *The Restored Panel.* A 16th-century panel whose surface is 60% modern retouching is still acquired as the "original," yet a panel repainted entirely today is not. The theory must explain why partial replacement preserves identity (continuity of history) while total replacement destroys it, despite the visual result potentially being identical.

  **5. The Perceptual Supervenience Constraint**
  *   **Requirement:** Aesthetic value must be grounded in properties available to sensory perception. If two objects are perceptually indistinguishable, they must offer the same aesthetic experience.
  *   **Motivating Case:** *The Intuition of Experience.* When we stand before the flawless forgery, we *see* beauty. When we stand before the original, we *see* beauty. If the forgery offers no aesthetic pleasure, it is because we cannot see it properly. If it *does* offer pleasure, then our claim that it is "worthless" contradicts the intuition that art is for looking. This requirement demands that value supervene on appearance.

  ***

  ### II. Analysis of Requirements

  **Binding Requirements**
  Requirements 1 (Genesis), 2 (Category), 3 (Integrity), and 4 (Continuity) are genuinely binding for the function of this museum.
  *   **Genesis** is required to justify the premium paid for provenance in fine art and manuscripts.
  *   **Category** is required to prevent absurdity in the music and wine archives (we do not seek the "original" pressing of a score).
  *   **Integrity** is required to maintain institutional trust; we cannot acquire known forgeries presented as originals.
  *   **Continuity** is required to prevent the deaccessioning of conserved works that constitute the bulk of our painting holdings.

  **Prejudices Smuggled as Common Sense**
  Requirement 5 (**Perceptual Supervenience**) is the prejudice of a Formalist camp. It assumes that "aesthetic value" is a sensory quality like color or pitch, rather than a relational property involving the viewer's knowledge of the object's history. This requirement treats the artwork as a isolated stimulus rather than a cultural act. It is the source of our circular arguments: we insist the forgery is aesthetically inferior, yet we cannot point to a visible flaw.

  ***

  ### III. The Incompatible Subset

  The honest conclusion is that **Requirement 1 (Historical Genesis)** and **Requirement 5 (Perceptual Supervenience)** cannot be jointly satisfied.

  *   If **Genesis** is true (history determines value), then two perceptually identical objects (Original vs. Forgery) can have different aesthetic values. This violates **Supervenience**.
  *   If **Supervenience** is true (perception determines value), then the Original and the Forgery must have equal aesthetic value. This violates **Genesis** (and our practice of rejecting the forgery).

  We cannot maintain that aesthetic value is available *only* to perception while simultaneously claiming that provenance bears on that value *aesthetically* and not merely morally or financially.

  ***

  ### IV. Conclusion

  We must abandon the Perceptual Supervenience Constraint. To continue operating as a museum of cultural heritage rather than a gallery of decorative stimuli, we must accept that **aesthetic value is not purely perceptual.**

  When we value the original over the flawless forgery, we are not valuing a visual quality; we are valuing the *achievement* of the specific historical agent at the specific historical moment. The "worthlessness" of the forgery is not a failure of our eyes, but a recognition that the object fails to bear the correct causal relationship to the artistic problem it purports to solve. The value lies in the *performance of the act*, not just the *trace of the act*.

  Consequently, our acquisitions policy must explicitly state that for autographic holdings (paintings, manuscripts), provenance is a constitutive element of the work's aesthetic identity, not merely a certificate of authenticity. For allographic holdings (scores, wine, furniture designs), provenance is secondary to structural or chemical fidelity.

  ***

  ### V. The Workhorse Requirement

  The single requirement that does the most work in eliminating candidates is **The Historical Genesis Constraint**.

  It is the filter that rules out pure formalism, pure perceptualism, and functionalism for our fine art holdings. It forces us to acknowledge that we are not collecting objects; we are collecting histories. Any theory that cannot accommodate the Genesis Constraint fails to explain why the exposure of a forgery changes the object's status, and thus fails to describe our actual practice.
