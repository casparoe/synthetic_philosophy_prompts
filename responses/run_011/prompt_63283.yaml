answer: |-
  # Workshop Plan: The Blackmill Incident

  **Title:** The Archive & The Echo
  **Duration:** 90 Minutes
  **Participants:** 18 (One long table)
  **Goal:** To experience how history is distorted by *survival rates* (victory) and *structural constraints* (archival bias), distinguishing between lies and silence.

  ---

  ## 1. Kit List
  *   **3 Envelopes marked "CONFIDENTIAL"** (One for each group).
  *   **Group A Pack (The Magistrate):** 8 sheets. Dry, bureaucratic forms. (Incident Report, Inventory of Broken Windows, Guard Duty Roster, Weather Log, Receipt for Arrows, Payroll, Letter to King, Map).
  *   **Group B Pack (The Millers):** 4 sheets. Emotional, scarce. (A bloodied letter from a widow, a fragment of a protest song, a verbal testimony transcribed by a scribe, a sketch of the dead).
  *   **Group C Pack (The Chroniclers):** 1 sheet ("The Royal Ledger" template) + 1 sheet ("Style & Constraint Rules").
  *   **18 Pens.**
  *   **Timer** (Visible to all).
  *   **Stakes:** 30 Poker Chips (or dried beans). 10 per group.
  *   **Whiteboard/Flipchart** for the Debrief.

  ---

  ## 2. Roles & Seating (5 Minutes)
  *   **Left Side of Table (6 people): Group A (The Magistrate).** You hold the city. You quelled the disturbance. You have the files.
  *   **Right Side of Table (6 people): Group B (The Millers).** You are the survivors of the disturbance. You have no files, only memories and scraps.
  *   **Head of Table (6 people): Group C (The Chroniclers).** You are monks/scribes writing the *Official Yearbook* ten years later. You **cannot** speak to Groups A or B. You only receive their written summaries.

  **The Stake:**
  *   **Groups A & B:** You start with 10 chips. You lose 1 chip for every *major truth* from your pack that is missing or distorted in the Final History.
  *   **Group C:** You start with 10 chips. You lose 1 chip for every word over the limit, or if your history contains a logical contradiction.
  *   **Prize:** The group with the most chips chooses the wine for the break.

  ---

  ## 3. Phase 1: The Archive (30 Minutes)
  **Task:** Read your documents. Agree on the "Truth." Condense your truth into a **50-Word Submission** to the Chroniclers.

  *   **Minutes 0-15 (Reading & Arguing):**
      *   **Group A (Magistrate):** Your docs are consistent. 40 people arrested. 0 guards died. Property damage: £50. Cause: Unlawful assembly. *Trap:* It is boring. You might forget to mention *why* they assembled (the price of grain) because it's not in the incident report.
      *   **Group B (Millers):** Your docs are vivid but contradictory. One says 40 dead, one says 12. One says guards fired, one says a cannon misfired. Cause: Starvation. *Trap:* You have emotion but no hard numbers. You rely on a song that might be exaggerated.
      *   **Group C (Chroniclers):** Wait silently. Read your **Constraint Rules**:
          1.  Final entry must be exactly **100 words**.
          2.  You cannot use the words "Kill," "Starve," or "Riot." Use "Pass," "Want," or "Unrest."
          3.  You must fit the data into the Ledger Columns: *Date, Location, Resolution, Casualties (State Only).* (Note: There is no column for "Civilian Casualties").

  *   **Minutes 15-30 (Drafting the Submission):**
      *   Groups A & B must agree on a single 50-word text. No attachments. No verbal briefings.
      *   They place the text in an envelope and slide it to Group C.
      *   *Facilitator Note:* Ensure Group C does not peek. Ensure Groups A & B don't shout across the table.

  ---

  ## 4. Phase 2: The Bottleneck (25 Minutes)
  **Task:** Group C writes the **Official History** using *only* the two 50-word submissions and their Constraint Rules.

  *   **Minutes 30-55:**
      *   Group C reads the two summaries. They will likely conflict (e.g., A says "Order Restored," B says "Massacre").
      *   Group C must resolve this conflict *within their Constraints*.
      *   *Predictable Outcome:* Because they cannot record "Civilian Casualties" (no column) and cannot use the word "Kill," the violence will vanish or be euphemized. Because they have a word limit, the *cause* (grain prices) will likely be cut to make room for the *resolution*.
      *   Group C reads the final 100-word history aloud to the room.

  ---

  ## 5. Phase 3: The Debrief (30 Minutes)
  *Do not mention "Victors" yet.*

  **Step 1: The Tally (5 mins)**
  *   Count the chips.
  *   Ask Group A: "What truth did you lose?" (Likely: The boredom of the paperwork meant you forgot the human cause).
  *   Ask Group B: "What truth did you lose?" (Likely: Your numbers were myths; the specific names of the dead were dropped).
  *   Ask Group C: "Why did you cut what you cut?" (Likely: "The form didn't have a box for it" or "I wasn't allowed that word").

  **Step 2: Lying vs. Non-Existence (10 mins)**
  *   Draw two columns on the whiteboard: **LIAR** and **GHOST**.
  *   Ask: "Did anyone in this room intentionally lie?"
      *   *Group A:* Probably not. They reported what they measured.
      *   *Group B:* Maybe. The song might have exaggerated numbers.
      *   *Group C:* No. They followed rules.
  *   Ask: "So where did the truth go?"
      *   Guide them to see that most truth wasn't *lied about*; it was **never recorded** (Group B's lack of logs) or **had nowhere to live** (Group C's Ledger columns).
  *   *Key Distinction:* Bias is often a lie. But thinness is a ghost. You cannot fact-check a ghost.

  **Step 3: The Two Mechanisms (10 mins)**
  *   Reveal the title of the workshop: **"History is Written by the Victors."**
  *   Ask: "Is this slogan true based on what we just did?"
  *   **Mechanism 1 (Victory):** Group A had 8 documents. Group B had 4. Group A's version was easier to summarize because it was consistent. *Victory creates paperwork.*
  *   **Mechanism 2 (The Bottleneck):** Group C distorted Group A's story *too*. The Guards didn't want to say "Pass" instead of "Kill," but the *Ledger* made them.
  *   *Point:* Even if the Losers had won, if they used the same Ledger, the same truths would have been lost. Structure distorts as much as power.

  **Step 4: Application (5 mins)**
  *   "When you read a historical novel or a biography, what are you looking for now?"
  *   Desired answer: "Not just who is lying, but what is missing." "Who had the paperwork?" "What columns did they have to fill?"

  ---

  ## 6. Predicted Pitfalls (Non-Academics)
  1.  **Storytelling vs. Process:** Readers will want to discuss the *drama* of the Blackmill Incident ("Who was the widow?").
      *   *Fix:* Interrupt firmly. "We aren't discussing the fiction; we are discussing the paperwork."
  2.  **Collusion:** Group A and B will try to negotiate a "compromise truth" before sending it to C.
      *   *Fix:* Remind them of the Stake. They lose chips if their specific truth is lost. They are incentivized to be partisan.
  3.  **The "Cheating" Chroniclers:** Group C might ask Group A for clarification.
      *   *Fix:* Enforce the silence rule. They are separated by time (10 years) as well as space.
  4.  **Word Count Ignorance:** People ignore limits.
      *   *Fix:* Act as the strict editor. Cut words off the end of their sheet if they exceed the limit during the read-out.

  ---

  ## 7. Limitations (What You Must Supply)
  This activity compresses centuries into minutes. You must verbally bridge these gaps in the debrief:

  1.  **Time Decay:** In the game, the documents were fresh. In reality, the "Victor's" paperwork might rot, burn, or be lost too. The "Losers'" oral myths might harden into fact over 200 years. *You must explain that time acts as a second filter.*
  2.  **Volume:** We used 12 documents. Real archives have millions. The "silence" of the loser is usually a vast ocean, not just 4 sheets. *You must emphasize that what we didn't see is bigger than what we did.*
  3.  **Malice:** In the game, Group C followed rules. In reality, chroniclers often had personal grudges or bribes. *Acknowledge that sometimes, it really is just a lie.*

  ## 8. The "Victors" Reveal Script
  *Save this for the very last minute of the Debrief.*

  "You felt the frustration of Group B, who had the passion but not the proof. You felt the ease of Group A, whose boredom looked like authority. And you saw Group C, who didn't care who won, only that the story fit the box.

  So, is history written by the victors?
  Yes, because they keep the filing cabinets.
  But also No, because the filing cabinets themselves decide what fits.
  The victors write the draft, but the archive edits the book."
