answer: |-
  There is no single, canonical term in the philosophical literature that captures *exactly* the argumentative maneuver you have described: the specific combination of (1) dissolving a heterogeneity objection, (2) by relocating the unifying element from the object to the subject's stance, (3) in a way that risks trivializing the normative claim.

  The closest established concepts are **Attitudinal Hedonism** (the specific theory of pleasure), **Response-Dependence** (the meta-ethical framework), and the **Secondary Quality Analogy** (the metaphysical model). However, these name the *theories* or *frameworks*, not the *maneuver* itself. Attitudinal Hedonism is the destination; Response-Dependence is the map. You are asking for the name of the *step* taken to get there.

  Given the precision of your description and the lack of a settled label for this specific logical shape, I propose we coin the term **Relational Displacement**.

  Below is the definition, its distinction from neighboring concepts, the adjudication of your boundary cases, and an analysis of the "cost" you identified.

  ### 1. Definition: Relational Displacement

  **Relational Displacement** is an argumentative maneuver used to solve a heterogeneity problem regarding a property $P$ instantiated by a diverse set of states or objects $S$.

  It proceeds in three stages:
  1.  **Denial of Intrinsic Unity:** It denies that $P$ consists in any intrinsic, phenomenal, or structural quality shared by all members of $S$.
  2.  **Relocation of Unity:** It asserts that $P$ consists instead in a specific relation $R$ held between the members of $S$ and a subject $K$ (typically a pro-attitude, such as desire, welcome, or approval).
  3.  **Dissolution of the Objection:** It treats the heterogeneity objection as dissolved on the grounds that the objection presupposed $P$ was intrinsic to $S$, when $P$ was actually extrinsic/relational all along.

  **The Diagnostic Marker:** The maneuver is identified by the fact that when counter-examples arise (e.g., cases where the relation $R$ holds but intuition says $P$ does not), the theorist refines the description of the *relation* $R$ (e.g., "intrinsic desire," "idealized welcome") rather than looking for new intrinsic features in $S$.

  ### 2. Distinction from Neighboring Concepts

  You asked how this differs from family resemblance, response-dependence, and desire theories.

  *   **Vs. Family Resemblance (Wittgenstein):**
      *   *Family Resemblance* admits there is *no* common element (neither intrinsic nor relational). It says the set is held together by overlapping similarities.
      *   *Relational Displacement* insists there *is* a strict common element (the relation $R$), preserving a form of essentialism, just not an intrinsic one.
      *   *Boundary:* If the theorist says "there is nothing common, not even a stance," they are outside Relational Displacement.

  *   **Vs. Response-Dependence (Meta-ethics):**
      *   *Response-Dependence* typically defines a *value property* (e.g., "Goodness") in terms of a response.
      *   *Relational Displacement* (as you described it) defines the *natural/psychological state itself* (e.g., "Pleasure") in terms of a response.
      *   *Boundary:* If the account says "Pleasure is a sensation, and Goodness is wanting that sensation," that is *not* Relational Displacement regarding pleasure. It only counts if "Pleasure" itself is defined by the wanting.

  *   **Vs. Functionalism (Philosophy of Mind):**
      *   *Functionalism* defines a state by its causal role within a system (inputs/outputs).
      *   *Relational Displacement* defines a state by a *normative or attitudinal stance* toward it.
      *   *Boundary:* Functionalism is a species of relational definition, but Relational Displacement specifically requires the relation to be a *stance* (welcoming, desiring) rather than a mere causal trigger. However, as we will see in the boundary cases, Functionalism often collapses into this maneuver.

  ### 3. Adjudicating Boundary Cases

  You asked for a definition tight enough to adjudicate new cases. Here is how **Relational Displacement** applies to your two specific queries:

  **Case A: The Bystander Stance**
  *   *Scenario:* The common element is relocated not to the experiencer's stance, but to a bystander's (e.g., "Pleasure is what an Ideal Observer would welcome on behalf of the subject").
  *   *Verdict:* **This counts as Relational Displacement.**
  *   *Reasoning:* The logical structure remains identical. The unity is still extrinsic to the experience itself; it is still found in a relation (the bystander's welcome) rather than an intrinsic quality. The identity of the relatum (subject vs. bystander) does not change the *maneuver*, only the specific theory generated (e.g., Ideal Observer Theory vs. Subjectivist Theory).

  **Case B: Non-Psychological Functional Roles**
  *   *Scenario:* The common element is relocated to a causal role (e.g., "Pleasure is the state that reinforces the behavior that produced it").
  *   *Verdict:* **This counts as a structural variant, but strictly speaking, it is Functionalism, not Relational Displacement.**
  *   *Reasoning:* My definition specifies the relation must be a *stance* (attitudinal/normative). A causal reinforcement role is mechanistic. However, philosophically, these two often merge. If the "reinforcement" is defined by the organism's "selection" of the state, it borders on stance.
  *   *Refinement:* To keep the term tight, **Relational Displacement** should be reserved for *attitudinal* relations. If the relation is purely causal/mechanistic, label it **Functional Displacement**. Both share the "cost" of evacuating the intrinsic nature of the state, but Relational Displacement incurs the specific "tautology cost" you identified (wanting what is wanted), whereas Functional Displacement incurs a "misclassification cost" (states that reinforce but feel awful might count as pleasure).

  ### 4. Is the Cost a Genuine Objection?

  You identified the cost: *"The claim that pleasure is the good thing... appears to lose content: it comes out as the claim that what we welcome is what we ought to welcome."*

  This is known in the literature as the **Triviality Objection** (or the **Empty Formalism Objection**) against desire-based theories of well-being.

  **Is it genuine?**
  Yes, but it is absorbable *if and only if* the stance ($R$) can be specified independently of the property ($P$).

  *   **The Trap (Circularity):** If "welcoming" is defined as "reacting to something because it is pleasant," the account is circular. Pleasure = what we welcome; Welcoming = reacting to pleasure. The theory explains nothing. This is the "cost" you rightly identified.
  *   **The Escape (Independent Specification):** Defenders (e.g., Chris Heathwood, Fred Feldman) argue the stance *can* be specified independently. They define "intrinsic desire" or "welcome" in terms of motivation or disposition to choose, without referencing "pleasure" or "goodness."
      *   *Example:* "To welcome $X$ is to be disposed to choose $X$ over $Y$ ceteris paribus, not as a means to $Z$."
      *   If this psychological description holds without presupposing $X$ is pleasant, the tautology is broken. The theory then makes a substantive claim: "The states that satisfy this motivational profile are the ones that constitute well-being."

  **Verdict:** The cost is a genuine threat that kills the theory *if* the theorist cannot define the stance without smuggling in the notion of pleasure. If they can naturalize the stance (define it via motivation/behavior), the cost is absorbed, but the theory risks becoming **Extensionally Inadequate** (counting things as pleasure that don't feel like it, as you noted with the anxious parent).

  ### Summary for Your Notes

  *   **Term:** **Relational Displacement**.
  *   **Definition:** Solving a heterogeneity problem by denying intrinsic unity and asserting unity consists in a subject's attitudinal stance toward the diverse items.
  *   **Key Risk:** The **Triviality Objection** (the account becomes tautological if the stance is not independently specifiable).
  *   **Boundary:** Includes bystander stances (Ideal Observer); excludes purely causal/functional roles (Functionalism), though they are structurally similar.
  *   **Status:** A recognized maneuver within **Attitudinal Hedonism** and **Response-Dependent** theories, but best labeled distinctly to track the logical cost you identified.

  This term allows you to flag the move in other contexts (e.g., definitions of "art," "religion," or "knowledge") where the essence is shifted from the object to the observer's relation to it, warning you to check immediately for the same tautological cost.
