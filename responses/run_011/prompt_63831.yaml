  Your diagnosis is sharp, and your hunches are largely correct, though they point towards a conclusion you might find uncomfortable. You are not merely arguing past one another; you are colliding with a structural limit in the theory itself. Here is the breakdown.

  **On your first hunch: Verdicts vs. Justification**
  You are right that the disagreement is primarily about the *architecture* of justification rather than first-order verdicts. The purists and the aggregators often converge on the same outcome (e.g., save the five) but cannot agree on the *route* without one side feeling the theory has been betrayed. However, do not dismiss this as merely verbal. In contractualism, the justification *is* the substance. If the route requires a move the purists deem illicit (balancing complaints across persons), then for them, the verdict is illegitimate, even if it matches intuition. The stalemate persists because one side prioritises the *procedure* of justification (pairwise) while the other prioritises the *plausibility* of the outcomes (numbers must count). You are arguing about the conditions of validity for moral principles, not just the principles themselves.

  **On your second hunch: Equivocation on 'Aggregation'**
  This is the most significant verbal confusion fuelling the substantive dispute. For the purists, 'aggregation' is a technical term meaning the summation of welfare across persons, which they believe obliterates the separateness of persons. For the defectors and the moderates, 'aggregation' often just means 'allowing numbers to influence the decision'. Scanlon's own 'balancing complaints' move attempts to thread this needle: numbers matter because they affect the *strength of the complaint* against a principle, not because we sum utility.
  The purists argue that once you allow the number of people to strengthen a complaint, you have smuggled aggregation in through the back door. The moderates argue that refusing to let numbers count is fetishising purity at the cost of moral reality. Until your group distinguishes between *summing welfare* (which contractualism rejects) and *counting persons in the formulation of complaints* (which Scanlon attempts to allow), you will talk past one another. Both sides are technically correct about their own definitions, which is why no case will settle it.

  **On your third hunch: The Formal Impossibility**
  This is the crux. You have identified the formal problem that lies beneath the case-based wrangling. There is a strong case to be made that the set of constraints your purists demand is logically inconsistent. Specifically, it is widely argued (most notably by Parfit and Voorhoeve) that you cannot simultaneously hold:
  1.  **Individualism:** Principles must be justifiable to each person singly (pairwise comparison).
  2.  **Non-Aggregation:** A large number of trivial complaints cannot outweigh one serious complaint (the 'no summing' rule).
  3.  **Transitivity/Continuity:** Verdicts must be consistent across a chain of cases where harms and numbers shift incrementally.

  If you insist on strict pairwise comparison (1) and refuse to let numbers aggregate (2), you risk intransitivity or absurd verdicts in continuum cases (3). If you fix the verdicts to be sensible (3), you must either abandon strict pairwise comparison (1) or allow a form of aggregation (2).

  **The Diagnosis**
  The demand itself is likely ill-posed. The insistence that a principle be 'justifiable to each person one at a time' becomes incoherent when the 'one at a time' perspective cannot access the information (the numbers) required to make the decision morally acceptable. The purists want a view from nowhere that is simultaneously a view from everywhere singly.

  The defector (Camp C) is likely the only one who has realised that the formal constraints cannot be satisfied. The purists (Camp A) are defending a deontological constraint that the mathematics of the cases will not support. The moderates (Camp B) are trying to patch the theory with 'balancing', but the purists are correct that this looks suspiciously like the aggregation the theory was designed to avoid.

  **What Counts as Progress?**
  Do not bring another case to the group. You have exhausted the intuitive pump. Progress requires shifting from cases to structure.
  1.  **A Theorem, not a Case:** You need to confront the impossibility result directly. If someone can demonstrate that the three constraints above are incompatible, the purists must drop one. Usually, they must drop the strict pairwise requirement.
  2.  **A Change of Question:** Stop asking 'What does contractualism say about the Rescue Case?' and start asking 'What are the necessary conditions for a principle to be rejectable?' If the answer requires comparing the *total* weight of complaints, then contractualism collapses into a form of consequentialism. If it does not, it risks irrationality.
  3.  **Acceptance of Failure:** It is possible that nothing should be expected because the project *is* doomed in its current form. Scanlon's later work acknowledges some of these tensions. If the group is unwilling to accept that the 'numbers problem' might be a fatal flaw rather than a puzzle to be solved, you will circle indefinitely.

  In short: your third hunch is the key. The disagreement is substantive, but it is driven by a formal inconsistency in the requirements the purists are setting. Until you address the logical compatibility of Individualism, Non-Aggregation, and Transitivity, you are merely rearranging deckchairs.
