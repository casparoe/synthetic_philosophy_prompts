  **Framing Considerations**
  In structuring this inquiry, I considered three frames. First, a metaphysical frame asking whether history is deterministic; this is worse because it demands solutions to physical indeterminism irrelevant to historical practice. Second, a sociological frame treating inevitability claims as mere rhetoric; this is worse because it ignores the truth-apt nature of historical explanation. I commit to a semantic-modal frame. This isolates the truth-conditions of inevitability claims without requiring a solution to hard determinism, allowing us to analyze the logic of historical discourse itself.

  ***

  **Project Title:** The Modal Indexicality of Historical Inevitability

  **Problem Statement and Research Question**
  Historical discourse is saturated with claims of inevitability. Historians argue over whether British industrialization, the Allied victory in 1945, or the collapse of the Soviet Union was bound to occur. Yet these disputes frequently reach stalemate. My preliminary analysis suggests this is because the predicate "inevitable" performs at least three distinguishable semantic jobs: it asserts robustness across a broad class of interventions; it asserts the inevitability of a terminus despite contingency in the route; or it asserts a specific weighting over possible interventions that remains implicit. Furthermore, disputes regarding "minimal-rewrite" discipline in counterfactual history often hinge on which perturbations count as admissible—a parameter typically left implicit and argued over as if it were a substantive historical fact.

  This project poses a precise question: **Is the truth value of a historical inevitability claim independent of a chosen class of admissible perturbations and weighting functions, or is it essentially indexed to them?** If the former, inevitability is a robust property of the historical world; if the latter, it is a relational property dependent on the modal framework adopted by the historian. Resolving this is not merely terminological; it determines whether conflicting historical narratives are genuinely incompatible or merely talking past one another.

  **Existing Positions and the Gap**
  Current philosophical literature on historical modality leaves this question open rather than merely disagreeing on the answer. Structuralist approaches tend to assume a broad basin of attraction, treating large-scale outcomes as robust against significant perturbations. They implicitly adopt a weighting function that privileges deep economic or demographic forces over individual agency. Conversely, contingency-focused approaches assume a fragile historical trajectory where small perturbations yield divergent outcomes, implicitly weighting agency and chance higher.

  The problem is that these positions are rarely articulated as disagreements over similarity metrics or probability weightings. Instead, they are presented as disagreements over the facts of the case. A structuralist claims the Soviet Union *had* to collapse; a contingency theorist claims it *might* have survived. Without explicit parameterization, we cannot determine if they are disagreeing about the causal structure of the Cold War or simply employing different modal neighborhoods. Existing accounts fail to separate the substantive historical claim from the modal framework used to evaluate it. This project fills that gap by treating the modal framework as a variable to be controlled rather than a background assumption.

  **Methodology**
  I will reconstruct three actual historical debates within a formalized counterfactual framework where the parameters are made explicit. The cases are selected to cover different temporal scales:
  1.  **Long-run structural:** The inevitability of British industrialization.
  2.  **Mid-range strategic:** The inevitability of Allied victory in World War II.
  3.  **Short-run contingent:** The inevitability of general war following the assassination of Archduke Franz Ferdinand.

  For each case, I will extract the competing inevitability claims and reconstruct the implicit admissible-perturbation class and weighting function required to make each claim true. I will then hold these parameters fixed to test whether the disagreement survives. If the disagreement vanishes when parameters are aligned, the dispute is verbal. If it persists, the dispute is substantive.

  I defend this method against three obvious alternatives. First, **settling determinism first**: This is epistemically inaccessible. Historians cannot wait for physics to solve free will before assessing claims about the Soviet Union. My method brackets metaphysical determinism to focus on epistemic modalities used in practice. Second, **running further simulations**: Computational counterfactuals are opaque; they hide the weighting assumptions within their code. My method requires making those assumptions explicit for philosophical analysis. Third, **armchair analysis with no case material**: Pure semantics risks triviality. By anchoring the analysis in actual historiographical disputes, I ensure the parameters reflect genuine historical reasoning rather than philosophical invention.

  **Timeline and Risk Assessment**
  The project will unfold over twelve months.
  *   **Months 1–2:** Formalize the semantic framework for admissible perturbations and weighting functions.
  *   **Months 3–5:** Reconstruct the industrialization debate (Long-run).
  *   **Months 6–8:** Reconstruct the Allied victory debate (Mid-range).
  *   **Months 9–10:** Reconstruct the 1914 crisis debate (Short-run).
  *   **Months 11–12:** Synthesis, writing, and refinement of the general thesis.

  The primary risk is that the project becomes too large. Parameterizing historical debates is labor-intensive; there is a danger of getting bogged down in the historical details of each case rather than the modal structure. To mitigate this, I will limit the reconstruction to the specific claims necessary to test the inevitability predicate, avoiding comprehensive historical narrative. A secondary risk is that the parameterization becomes so fine-grained that no two claims ever genuinely conflict. I will monitor this by ensuring the classes of perturbations remain broad enough to capture genuine historiographical schools of thought.

  **Success Conditions and Outcomes**
  Success looks like a clarified map of historical modality. Ideally, some sampled disputes will dissolve upon reconstruction, revealing themselves as verbal disagreements over admissible perturbations. Others may survive, showing that there are genuine substantive conflicts regarding causal structures. Either outcome advances the field by replacing stalemate with precision.

  Failure would take two forms. First, **triviality**: If the parameterization is so hyper-intensional that every claim is indexed uniquely, the concept of inevitability loses its utility for comparing historical accounts. Second, **ineliminable ambiguity**: If I cannot reconstruct the debates without attributing irrationality to the historians involved, the model fails to capture actual practice. The goal is a framework robust enough to handle real disputes without collapsing into triviality. By the end of the fellowship, I aim to produce a manuscript demonstrating that historical inevitability is not a monolithic property but a modal indexical, requiring explicit specification to be philosophically productive.
