answer: |-
  The fluorescent lights of the Oakhaven Town Hall hummed with a sound that felt like a headache waiting to happen. At the dais, Planning Commission Chair Martha Vance adjusted her glasses. She looked tired. Everyone looked tired. This was the third hearing for the Oakhaven Dialysis Center.

  "Mr. Thorne," Martha said, addressing the applicant. "Your environmental impact statement still indicates a non-zero probability of sediment runoff into Miller's Creek during heavy precipitation. Under Section 14-B, the Precautionary Statute, we cannot approve any project where the chance of irreversible ecological harm is not effectively zero."

  Thorne nodded stiffly. He knew the drill. "We've added three retention basins, Chair Vance. The probability is one in four million."

  "One in four million is not zero," Martha said gently. "And as you know, we are legally barred from weighing the community benefits of this clinic against that risk. We cannot consider patient access. We can only consider the creek."

  A murmur ran through the folding chairs. In the back, Elias shifted in his seat. He was a junior analyst for the commission, barely two years out of grad school. He had a notepad open, but he wasn't taking notes. He was staring at the text of Section 14-B pinned to the wall. *No affirmative action shall be permitted unless the risk of irreversible harm is null.*

  He stood up. The legs of his chair scraped loudly against the linoleum.

  "Mr. Kline?" Martha asked. "You're not on the public comment list."

  "I'm staff, Chair Vance. But I'm speaking as a citizen of Oakhaven." Elias's voice cracked slightly, then steadied. "I've been running the numbers on the denial. If we reject this permit, the nearest dialysis facility is forty miles away in Ridgeview. The route involves Highway 9, which ices over twice a winter on average."

  Martha sighed. "Mr. Kline, you know benefits are inadmissible under the statute. We cannot discuss the utility of the clinic."

  "I'm not discussing utility," Elias said. "I'm discussing harm. Irreversible harm."

  He walked to the podium, placing his hands on the wood. "The statute says we cannot act unless the chance of irreversible harm is zero. We are assuming that 'action' means building the clinic. But 'inaction' is also a decision made by this commission. It is a choice to maintain the status quo."

  He looked around the room. "The status quo is that patients travel forty miles. Statistical models show a 0.4% annual increase in mortality for dialysis patients per ten miles of travel distance. If we deny this permit, we are choosing a path where the probability of human death is not zero. Death is irreversible. Therefore, denying the permit violates Section 14-B just as much as approving it does."

  The room went silent. Even the hum of the lights seemed to dip.

  Martha leaned forward. She didn't look angry; she looked intrigued, which was worse. "Mr. Kline, are you arguing that the Commission is the proximate cause of mortality occurring on Highway 9?"

  "I'm arguing foreseeability," Elias said. "If we know the risk exists, and we have the power to mitigate it by issuing a permit, then refusing to issue that permit makes us responsible for the continuation of the risk. You can't prove the chance of death on Highway 9 is zero. So you can't legally deny the permit."

  "So," Martha said, her voice calm, "you believe the statute creates a paradox. To build is to risk the creek. To not build is to risk lives. Since neither risk is zero, the Commission is paralyzed."

  "Effectively, yes."

  Martha removed her glasses and rubbed the bridge of her nose. "Mr. Kline, your logic is seductive. But it relies on a category error. The statute governs *permits*. It regulates the introduction of new variables into the ecosystem. When we deny a permit, we are not introducing a variable. We are declining to intervene. The deaths on Highway 9 are tragic, but they are not caused by the Town of Oakhaven. They are caused by geography and disease."

  "But we control the zoning," Elias pressed. "If I see a man drowning and I refuse to throw the rope because I'm afraid of wetting my shirt, am I not responsible for the drowning? The statute says I can't wet my shirt. But it doesn't say I can let him drown."

  "The law distinguishes between act and omission," Martha replied. "It is a foundational legal principle. If we accept your interpretation, the statute consumes itself. Every decision becomes an action. Every delay becomes a harm. The Commission would be forced to approve every project simply to avoid the liability of inaction, which defeats the purpose of the Precautionary Statute entirely."

  "Or," Elias said, "it forces us to admit that zero harm is impossible. That the statute demands a god's-eye view of causality that humans don't have. If we can't prove zero harm for building, and we can't prove zero harm for not building, then the only honest vote is to abstain. But if we abstain, the clinic doesn't get built. So people still die."

  Martha looked at him for a long moment. She looked at Thorne, who was staring at his hands. She looked at the citizens in the back, some clutching medical bills, others clutching watershed pamphlets.

  "The statute was written to protect us from hubris," Martha said quietly. "To acknowledge that we cannot predict the future. You are arguing that this humility has become a cage."

  "It's not humility if it kills people," Elias said. "It's just bureaucracy."

  Martha put her glasses back on. She picked up her gavel, but she didn't strike it. "The Commission cannot vote tonight. The legal counsel needs to review the implication of Section 14-B applied to omissions. If Mr. Kline is correct, every denial we have issued for the past ten years is potentially unlawful."

  "And every approval," Elias added.

  "And every approval," Martha agreed.

  She looked at Elias, and for a second, he saw a flicker of fear in her eyes. Not of him, but of the math. "We are adjourned until further notice. The status quo remains in effect."

  "But the status quo is the harm," Elias said to the empty air as the gavel finally fell.

  Martha stood up, gathering her papers. She paused beside him as she left the dais. "Then we wait," she said, her voice low. "We wait until someone finds a way to prove that nothing matters, or that everything does. Until then, we hold the line."

  She walked out into the hallway. Elias stayed at the podium. The lights hummed. The creek flowed outside, uncaring, and forty miles away, the highway waited for the ice. No one had won. The rule stood, perfect and useless, preserving the town in a state of perfect, paralyzed safety.
