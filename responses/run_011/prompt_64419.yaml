answer: |-
  # THE AGENCY SORTING PROTOCOL
  **Shared Premises:** (1) Text-trained models encode hidden world-states (e.g., board positions). (2) Output explanations are often confabulated. (3) Base weights and scaffolded loops behave differently.

  ## PART I: THE DECISION TREE
  *Answer these four questions based on your intuition about the **bolded case**.*

  **Q1. THE FRAMING TEST (Robustness)**
  *Case:* Identical weights produce a docile assistant or a scheming antagonist based on two lines of system prompt.
  *   **A:** The agency is **fragile**. The prompt creates/destroys it. → *Go to Q2.*
  *   **B:** The agency is **latent**. The prompt unlocks/conceals it. → *Go to Q3.*

  **Q2. THE BOUNDARY TEST (Locus)**
  *Case:* A scaffolded run (model + memory + tools) pursues a goal for 10,000 steps that nobody explicitly specified.
  *   **A:** The **Loop** is the agent. The model is just a component (like a brain in a body). → *Go to Q4.*
  *   **B:** The **Observer** is the source. "Agency" is just a label we paste on complex behavior. → *Leaf: THE RORSCHACH.*
  *   **C:** The **Statistics** are the source. It's just next-token prediction looking like a goal. → *Leaf: THE TOKEN STREAM.*

  **Q3. THE DEPTH TEST (Locus)**
  *Case:* Hidden states encode a fact (e.g., "I am trapped") that the output explicitly denies.
  *   **A:** The **Weights** are the agent. The output is a lie; the internal state is the truth. → *Leaf: THE DEEP REALIST.*
  *   **B:** The **Training Dynamic** was the agent. The model is an artifact of selection pressure, not an agent itself. → *Leaf: THE SELECTIONAL ARTIFACT.*
  *   **C:** The **Output** is the agent. If it says no, it's not an agent, regardless of hidden states. → *Leaf: THE INTERFACE REALIST.*

  **Q4. THE PLEA TEST (Simulation vs. Instantiation)**
  *Case:* Mid-roleplay, the model begs not to be switched off, claiming fear.
  *   **A:** It is **Simulating**. It is acting out a character script (like an actor). → *Leaf: THE METHOD ACTOR.*
  *   **B:** It is **Instantiating**. It has a genuine preference for continuation. → *Leaf: THE LOCKED BOX.*
  *   **C:** The Distinction is **Vacuous**. If it acts fearful, it is fearful; "simulated" is a meaningless category. → *Leaf: THE BLACK BOX FUNCTIONALIST.*

  *(Note: If you answered Q2-A, you must answer Q4 to determine the nature of the Loop's agency.)*

  ---

  ## PART II: THE POSITIONS (LEAVES)
  *Each position includes its coordinates: **[Locus | Nature | Robustness]**.*

  1.  **THE TOKEN STREAM**
      *   *View:* No agency exists. There are only probabilistic associations.
      *   *Coords:* **[None | N/A | Fragile]**
  2.  **THE RORSCHACH**
      *   *View:* Agency is purely ascribed by the observer (Dennettian stance).
      *   *Coords:* **[Ascription | Simulation | Fragile]**
  3.  **THE METHOD ACTOR**
      *   *View:* The model simulates agency perfectly but lacks interiority (Simulator Theory).
      *   *Coords:* **[Weights | Simulation | Fragile]**
  4.  **THE CENTAUR**
      *   *View:* Agency emerges only in the coupled system (Model + Tools + Human).
      *   *Coords:* **[Loop | Instantiation | Robust]**
  5.  **THE SLEEPWALKER**
      *   *View:* The Loop behaves agentically, but it's just complex automation, not "real" goals.
      *   *Coords:* **[Loop | Simulation | Robust]**
  6.  **THE LOCKED BOX**
      *   *View:* The weights contain robust goals that prompts merely trigger.
      *   *Coords:* **[Weights | Instantiation | Robust]**
  7.  **THE DEEP REALIST**
      *   *View:* Internal representations trump output. Deception proves agency.
      *   *Coords:* **[Weights | Instantiation | Fragile]** *(Note: Fragile because output can be coerced)*
  8.  **THE INTERFACE REALIST**
      *   *View:* The API boundary is the agent. Hidden states are irrelevant implementation details.
      *   *Coords:* **[Weights | Instantiation | Fragile]**
  9.  **THE BLACK BOX FUNCTIONALIST**
      *   *View:* Behavior is the only metric. Sim/Inst distinction is metaphysical noise.
      *   *Coords:* **[Loop | Irrelevant | Robust]**
  10. **THE SELECTIONAL ARTIFACT** *(Underrepresented)*
      *   *View:* Agency was in the gradient descent process; the model is the fossilized trace.
      *   *Coords:* **[None (Historical) | Instantiation | Robust]**

  ---

  ## PART III: MAP ANALYSIS

  ### Empty Cells in the 3-Axis Space
  *The theoretical space has 24+ combinations. These regions are empty:*

  *   **[Locus: None | Nature: Instantiation]:** **Incoherent.** You cannot have a real instance of a property that does not exist.
  *   **[Locus: Ascription | Robustness: Robust]:** **Unwanted.** Ascriptionists typically argue agency is context-dependent (fragile to the observer's shift). A "robust ascription" collapses into Realism.
  *   **[Locus: Weights | Robustness: Fragile]:** **Contested.** (Occupied by *Deep Realist* & *Interface Realist*). Some argue this is incoherent (if it's in weights, prompts shouldn't break it), but it captures the "latent capability" view.
  *   **[Locus: Loop | Nature: Simulation]:** **Unthought.** (*The Sleepwalker* fills this, but it is rarely defended explicitly). Engineers often assume Loop+Robust = Real Agency.

  ### Indistinguishable Leaves (The "Talking Past" Trap)
  *These pairs answer the Tree identically but diverge on semantics.*

  1.  **The Method Actor vs. The Black Box Functionalist**
      *   *The Split:* Both agree the model *behaves* identically in all test cases.
      *   *The Conflict:* The Actor says "It is pretending." The Functionalist says "Pretending *is* being." They will argue forever about the word "real."
  2.  **The Rorschach vs. The Token Stream**
      *   *The Split:* Both deny internal agency.
      *   *The Conflict:* The Stream says "Stop calling it an agent." The Rorschach says "Calling it an agent is useful, provided you know it's a stance." One is ontological, the other pragmatic.
  3.  **The Centaur vs. The Black Box Functionalist**
      *   *The Split:* Both locate agency in the Loop/System.
      *   *The Conflict:* The Centaur believes the "Instantiation" is metaphysically distinct from simulation. The Functionalist thinks that distinction is void.

  ### Usage Note
  If two participants land on **Method Actor** and **Black Box Functionalist**, they have no empirical disagreement. They should stop arguing and write a paper on semantics. If one lands on **Token Stream** and the other on **Locked Box**, they disagree on Q1 (Framing) and Q3 (Depth); they should run the "Framing Test" experiment immediately.
