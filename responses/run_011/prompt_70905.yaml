      *   *Key Names:* Peter Vallentyne, Shelly Kagan, Frank Arntzenius, Hilary Greaves.
      *   *Specific Concept:* It looks very much like the **"Catch-Up" Criterion** or **"Overtaking" Criterion** used in utilitarianism over infinite time (e.g., in Ramsey growth models or intergenerational equity).
      *   *Mathematical Equivalent:* This is the definition of convergence in the **limit of partial sums** (Cauchy sequences), but applied to *differences*. It's related to **dominance** principles.
      *   *Impossibility Results:* There are strong impossibility theorems in this area (e.g., by Basu & Mitra, or in the context of Paretian egalitarianism over infinite generations). Specifically, if you want Strong Pareto + Anonymity + Continuity, you often run into trouble. The "Order Dependence" objection points to the lack of **Anonymity** or **Permutation Invariance**.
