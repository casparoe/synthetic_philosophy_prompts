      *   **Section 6 (Concession):** Compare orders of growth. Friend says this is just "infinite arithmetic with extra steps."

  3.  **Address Request 1: Where is it flatly wrong? (Sections 2 & 3)**
      *   *Section 2 (Census Case):* Is it a genuine constraint? In infinite ethics, this is the "Very Repugnant Conclusion" or "Infinity Problem" territory. Total Utilitarianism *does* imply neutrality here. Some philosophers (e.g., Arntzenius, Vallentyne) accept this counterintuitive result to save coherence. So, asserting it as a *constraint* without argument is a weak point. It's not "flatly wrong," but it's a substantive normative claim disguised as a conceptual necessity.
      *   *Section 3 (Averaging):* The dismissal is mostly correct but needs nuance. Average Utilitarianism avoids the "Repugnant Conclusion" in finite cases but has its own issues in infinite cases (e.g., adding a happy person to a world of happy people might lower the average if the new person is slightly less happy, even if still very happy). The specific claim that finite changes have "zero mean effect" is mathematically correct for standard limits, but there are generalized limits (Banach limits) that might handle this. However, for the draft's purpose, the dismissal holds water *unless* one adopts non-standard analysis.
