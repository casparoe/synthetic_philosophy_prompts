      *   **Section 4 (Proposal - Frontier Rule):** Use an exhausting sequence of regions $R_n$. $A \geq B$ if $V(A, R_n) - V(B, R_n) \geq 0$ for sufficiently large $n$. Strict better if difference $\geq \epsilon > 0$.
      *   **Section 5 (Objections):**
          *   *Order Dependence:* Different exhaustions yield different results (symmetric vs. asymmetric). Granularity issues.
