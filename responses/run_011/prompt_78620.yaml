answer: |-
  Here are the three implications that should carry the piece, ordered by how they build the argument from factual error to conceptual error to policy failure.

  **1. Heritability and Prediction are Population-Specific (The Portability Problem)**
  Run this first because it is the most immediate, factual disqualifier. Heritability estimates and polygenic scores are not universal constants; they are descriptions of a specific population in a specific environment. A score trained on European ancestry data loses predictive power rapidly in non-European populations due to differences in linkage disequilibrium and allele frequencies. Since 40% of this district is non-European, the tool is scientifically invalid for a huge chunk of the students. This isn't a nuance; it's a breakdown of the instrument. If the ruler changes length depending on who you measure, you cannot use it to allocate resources.

  **2. Heritability is Variance, Not Individual Attribution (The Determinism Problem)**
  Run this second to dismantle the "prediction, not destiny" defense. Heritability describes why people *in a group* differ, not why a *specific child* differs. An $R^2$ of 0.11 means the score explains 11% of the variation across the population, but for an individual four-year-old, the confidence interval is massive. Claiming this is "modest but real" ignores that screening tools require high individual precision, not just population-level correlation. This shifts the reader from thinking "the science is shaky" to "the science is being misapplied to individuals."

  **3. Predicting Outcomes is Not Predicting Response to Intervention (The Utility Problem)**
  Run this last as the knockout punch. This is the implication nobody is raising. The district's goal is to identify kids who *benefit from tutoring*. The startup's tool identifies kids likely to *have lower education* under current conditions. These are fundamentally different questions. A child might have a low polygenic score but high responsiveness to tutoring (high plasticity), or a high score and low responsiveness. Using a baseline risk score to allocate treatment assumes that genetic risk is the primary barrier to learning and that tutoring fixes genetic barriers. It doesn't. If a reader keeps only one thing, make it this: **A score that predicts failure does not necessarily predict who can be saved.** This changes the conclusion from "the score is biased" to "the score is useless for the stated goal."

  ***

  ### Analysis of Claims (a) through (d)

  **(a) "our score accounts for about 11% of the variation in years of education in adults of European ancestry"**
  *Verdict:* **True but misleading.**
  *Reasoning:* It is likely accurate for the training set, but it implies portability to the district's population. It hides the degradation of accuracy in non-European groups.
  *Better Sentence:* "This score explains 11% of variation in European adults, but predictive accuracy drops significantly in other ancestry groups, including 40% of your students."

  **(b) "educational attainment is around 60% heritable, so we're capturing about a sixth of what matters"**
  *Verdict:* **Doesn't follow.**
  *Reasoning:* The arithmetic is apples-to-oranges. Twin-based heritability (60%) includes shared environment confounds and non-additive effects that GWAS ($R^2$) misses. More importantly, "what matters" includes environmental variance; framing the denominator as "heritability" implies the remaining variance is genetic noise waiting to be found, rather than environmental opportunity.
  *Better Sentence:* "While twin studies suggest a genetic component, this score captures only a fraction of that, leaving the majority of influences—including environmental factors—unmeasured."

  **(c) "this is prediction, not destiny — an R² of 0.11 is a modest but real effect, exactly what every other screening tool delivers"**
  *Verdict:* **Category mistake.**
  *Reasoning:* Standard screening tools (vision, hearing, lead) detect existing physiological conditions with high sensitivity/specificity. This tool predicts a probabilistic social outcome years in the future with low individual precision. Comparing population variance explained to diagnostic accuracy is a false equivalence.
  *Better Sentence:* "Unlike medical screening which detects present conditions, this score predicts future probabilities with wide margins of error for any single child."

  **(d) districts that turn it down are "rejecting a measurement because it's inconvenient"**
  *Verdict:* **Doesn't follow.**
  *Reasoning:* This is a rhetorical strawman. Districts may reject it due to scientific invalidity, ethical concerns, or legal liability, not inconvenience. It frames valid scientific criticism as emotional resistance.
  *Better Sentence:* "Districts may decline the tool if the scientific limitations outweigh the potential benefits for their specific population."

  ***

  ### The Implication Nobody Is Raising: Treatment Effect Heterogeneity

  The strongest criticism lives in the gap between **prognosis** and **prescription**. The district is asking: "Who will benefit most from extra pre-K tutoring?" The startup is answering: "Who is most likely to struggle if nothing changes?"

  These are not the same. Polygenic scores measure baseline risk, not plasticity. It is entirely possible that children with low polygenic scores benefit *less* from standard tutoring because their barriers are not easily remediated by the specific intervention offered, or conversely, that they benefit *more* because they are currently underserved. Without data showing that the polygenic score interacts with the tutoring to produce better outcomes (a Gene $\times$ Environment interaction study), the score is blind to the district's actual goal. Using it to allocate resources assumes that "highest risk" equals "highest treatability," which is an unproven and likely false assumption. You are optimizing for risk, not for return on investment.

  ***

  ### Reporting Table

  | Claim | Verdict | Why | Better Sentence |
  | :--- | :--- | :--- | :--- |
  | **(a) 11% Variance (European)** | True but misleading | Accurate for training data, but ignores performance drop in the district's 40% non-European population. | "This score explains 11% of variation in European adults, but predictive accuracy drops significantly in other ancestry groups, including 40% of your students." |
  | **(b) 1/6th of What Matters** | Doesn't follow | Heritability isn't the total "what matters"; it excludes environmental variance and inflates genetic potential. | "While twin studies suggest a genetic component, this score captures only a fraction of that, leaving the majority of influences—including environmental factors—unmeasured." |
  | **(c) Like Other Screening** | Category mistake | Screening detects existing conditions; this predicts future social probabilities with low individual precision. | "Unlike medical screening which detects present conditions, this score predicts future probabilities with wide margins of error for any single child." |
  | **(d) Inconvenient Truth** | Doesn't follow | Frames scientific/ethical objections as emotional resistance; ignores validity concerns. | "Districts may decline the tool if the scientific limitations outweigh the potential benefits for their specific population." |
  | **Implicit: Score Guides Intervention** | Needs an empirical check I should go do | Predicting baseline outcome is not the same as predicting response to treatment (heterogeneity). | "We need evidence that this score predicts who *benefits* from tutoring, not just who is likely to struggle without it." |
