      *   *Claim (c) Screening:* Screening tools (like vision tests) detect existing conditions. PGS predicts a probabilistic trajectory based on current environment. Using it to *allocate* resources assumes the genetic risk is immutable and the environment is the fix, but doesn't prove the fix works *for those kids*.
