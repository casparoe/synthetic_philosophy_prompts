answer: |-
  The deepest split is whether comprehension is a distinct internal state or just competent behavior interpreted externally. This determines if the gap is in the world or our description.

  1. Does the chess engine understand 'threatened square' or merely simulate it?
  2. (Understand) Is comprehension just a further species of competence?
  3. (Simulate) Is the distinction between competence and comprehension substantive or merely verbal?
  4. (Verbal) [Leaf]
  5. (Substantive) Is brittle vs. systematic competence a difference in kind?
  6. (Kind) Is the gap ontological (missing stuff) or explanatory (opacity)?
  7. (Ontological) Is the missing element essentially first-personal?
  8. (First-personal) Does a complete physical description exhaust the facts?
  9. (Explanatory) Is comprehension a state in the system or an interpreter's stance?

  - (Q2 Yes) Eliminativist: Comprehension is competence all the way down; no extra ingredient exists.
  - (Q2 No) Skeptic: Invoking selection explains nothing; it relabels the mystery rather than solving it.
  - (Q4 Verbal) Deflationary: The question has no answer independent of our pragmatic interests.
  - (Q8 No) Mysterian: Physical facts leave out experiential facts; nature of comprehension is unknowable.
  - (Q8 Yes) Syntax/Gap: Syntax isn't semantics; internal processing lacks intrinsic meaning despite physical completeness.
  - (Q9 Interpreter) Interpretivist: Comprehension isn't in the system; it's a stance we take toward predictable behavior.
  - (Q7 No) [Empty Cell]

  **Notes on Logical Space**

  **Empty Cells:** The ontological but purely third-personal leaf (Q7 No) is unoccupied. This view posits a real structural missing piece without phenomenology. It is unattractive: why posit ontology without phenomenology? Usually, ontological gaps are qualia-based (first-personal). If the gap is third-personal, it tends to collapse into explanatory opacity.

  **Inseparable Leaves:** The Skeptic (Q2 No) and Eliminativist (Q2 Yes) blur if "higher-order competence" is ill-defined. If the Skeptic denies comprehension exists but also denies competence explains it, they risk contradicting the Eliminativist who says competence *is* comprehension. The distinction hinges on whether "explanation" requires something non-functional.

  **Unexplored:** The systematic/brittle split (Q5) is rarely treated as ontological. Most treat it as degree. A view treating systematicity as a metaphysical boundary without qualia remains live but unoccupied.

  **Case Usage:** The chess engine (Q1) anchors the competence question. The physical description (Q8) targets the ML engineers' assumption of exhaustiveness. The interpreter stance (Q9) targets the philosophers' intentional stance. The selection history (implied in Skeptic) targets the Darwinian version of the inversion.
