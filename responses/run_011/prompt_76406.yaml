prompt: |-
  My students already believe that intellectual property causes gridlock, and that belief is threatening to ruin the class I want to teach. They are 18 upper-level undergraduates in a seminar on the ownership of ideas — roughly half pre-law, half philosophy majors — and we have a single 75-minute session on the question of when rights in an idea make it less usable rather than more. They have already met the incentive-based justification, Locke on mixing one's labor, and an argument that a resource fragmented among too many rights-holders can end up useless to everyone. I do not want to lecture on any of it, and I certainly do not want them nodding along.

  Design an in-class game that makes the second failure land as a discovery rather than a confirmation. The mechanism has to leave each veto-holder acting rationally and even sympathetically, so that the deadlock turns out to be nobody's fault; if there is a villain available in the game, my students will locate the problem in the villain and the exercise will be wasted. I also want them to feel the asymmetry between the resource itself — which loses nothing by being used — and the reward attached to it, which is strictly positional.

  Build it as three rounds over the same tasks and the same paper components, changing only the rules:

  - Round one: components sit in a shared pool, anyone may take any, and the reward goes to whoever finishes a task first.
  - Round two: each student owns the components dealt to them and must license them from one another to complete anything.
  - Round three: components are free to take, but every submission must display the complete chain of attribution for each component it uses, including components derived from other components. I expect this round to look absurd on first description; I want it designed so that it does not, since of the three it is closest to how credit actually behaves in research.

  Give me the component deck and what is written on each card; the tasks and how many components each requires; a payoff scheme using no money that converts into something these students will care about for 75 minutes; my own role, including how many disputes I should expect to adjudicate simultaneously; a minute-by-minute timeline; the exact wording of every rule I need to read aloud so that students cannot litigate it later; and the debrief, which maps particular moments from each round onto the concepts and does not supply the name of the second failure until the students have described it themselves.

  Then tell me what will predictably go wrong on the first run — including the student who refuses to license on principle, the pair who collude to lock everyone else out, and the round that finishes in four minutes because one student simply hoards — and how to handle each without breaking the game. Include a version compressible into 20 minutes in case the first half of the session overruns. Finally, state frankly which feature of the second failure a single class period cannot reproduce; I suspect it is duration, since real thickets persist for years while people invest in working around them, and a game that resolves in minutes will suggest the problem is solvable by patience. Say also which live disputes about intellectual property each round corresponds to, and where that correspondence breaks down.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Target Audience:** 18 upper-level undergraduates (Pre-law & Philosophy).
      *   **Topic:** Ownership of Ideas / Intellectual Property (IP).
      *   **Specific Problem:** Students already believe IP causes gridlock (Anti-Commons). The instructor wants to avoid confirming this bias via lecture. They want the students to *discover* the gridlock mechanism themselves, specifically realizing it's structural, not moral (no villains).
      *   **Key Concept:** The "Second Failure" (Anti-Commons/Tragedy of the Anti-Commons) vs. the resource's non-rivalrous nature vs. positional rewards.
      *   **Format:** 75-minute seminar, 3-round game using the same tasks/components but changing rules.
      *   **Round Structures:**
          1.  Commons (Free take, winner takes all).
          2.  Property (Owned components, licensing required).
          3.  Attribution (Free take, complex chain of credit required).
      *   **Deliverables:** Component deck, tasks, payoff scheme (non-monetary), instructor role, minute-by-minute timeline, exact rule wording, debrief strategy, predicted failures/mitigations, 20-minute compression, limitations of the simulation, and real-world correspondences.
      *   **Tone:** Sophisticated, precise, pedagogical, acknowledging the students' existing skepticism.

  2.  **Deconstruct the Game Mechanics:**

      *   *Goal:* Create a situation where rational individual behavior leads to collective sub-optimality in Round 2, without making anyone look evil.
      *   *Components:* Need to be combinable. Let's use "Idea Fragments."
      *   *Tasks:* Need to require multiple fragments.
      *   *Payoff:* Needs to matter to undergrads for 75 mins. "Course Credit" is too high stakes/risky. "Coffee/Donuts" is too trivial. "Choice of Final Paper Topic" or "Extension Token" is good. Let's go with "Extension Tokens" (24-hour no-questions-asked extension on a future assignment) + "Public Recognition" (Whiteboard Hall of Fame).
      *   *Round 1 (Commons):* High speed, low friction. Shows the resource is non-rivalrous *physically*, but the reward is rivalrous (positional).
      *   *Round 2 (Property/Anti-Commons):* This is the core. Fragmentation of rights. If I own a piece you need, I can hold out. But I shouldn't be a villain. I should just want a piece of the reward. If everyone wants a piece, the transaction costs kill the deal.
      *   *Round 3 (Attribution/Moral Rights):* This is the tricky one. It needs to feel burdensome but legitimate. It mimics academic citation. It slows things down due to administrative burden, not exclusion.

  3.  **Drafting the Components & Tasks:**

      *   *Deck:* 36 cards. 6 suits (colors), 6 ranks (numbers).
      *   *Tasks:* "Build a Theory." Each theory needs 3 specific cards (e.g., Red 1, Blue 3, Green 5).
      *   *Distribution:*
          *   Round 1: All in the middle.
          *   Round 2: Dealt out (6 cards each to 6 students? No, 18 students. 2 cards each = 36 cards).
          *   Round 3: All in the middle again.
      *   *Wait, 18 students is a lot for a negotiation game.* If everyone owns 2 cards, and a task needs 3 cards from *different* owners, that's 3 negotiations per task. With 18 students, chaos ensues.
      *   *Adjustment:* Group them into 6 teams of 3? No, the prompt implies individual veto holders. Let's keep them individual but limit the number of active "owners" in Round 2. Or, deal to everyone, but make tasks require cards held by *multiple* people.
      *   *Refinement:* To ensure gridlock, the distribution must be fragmented. 18 students, 36 cards. 2 cards each. Task requires 3 cards. You *must* trade.
      *   *Payoff:* Only the first 3 teams/individuals to finish get the reward. This creates the positional pressure.

  4.  **Developing the "No Villain" Constraint:**

      *   In Round 2, students must feel justified in withholding.
      *   *Rule:* "You may only license your card in exchange for a share of the Reward Token."
      *   *Problem:* If I give you my card, I lose it. I need compensation.
      *   *Solution:* "Joint Submission." If we collaborate, we both get credit. But only the first 3 submissions count. If too many people demand credit, the coalition becomes too large to fit the "Top 3" limit, or the negotiation time runs out.
      *   *Better Mechanism:* The "Royalty" system. To use a card, you must give the owner 50% of the points. If a task needs 3 cards from 3 owners, the builder keeps 50%, Owner B gets 25%, Owner C gets 25%? No, that's math-heavy.
      *   *Simplest Mechanism:* "Veto + Price." You own the card. Someone needs it. You can say "I want a cut of the win." If everyone wants a cut, the "win" is diluted.
      *   *Best Mechanism for "Rational Sympathy":* The rule is: "You cannot give your card away. You can only license it. A license requires both parties to sign the submission form. Only names on the form get the Reward."
      *   *Result:* To finish a task, I need to find the owners of the other 2 cards. We all must sign. We all get the reward *if* we finish in the top 3.
      *   *The Trap:* There are 18 students. Only 3 rewards available (6 tokens total, 2 per winning team). To win, I need a team of 3. That uses 9 students. What about the other 9? They have essential cards. They *must* be included to get the cards. So the team size balloons. If the team size > 3 people, the reward per person drops, or the rule says "Max 3 names per submission."
      *   *Let's go with "Max 3 names per submission."* This forces exclusion. If I own a necessary card, and you exclude me, you don't get the card. If you include me, you might exceed the limit.
      *   *Actually, the prompt asks for "nobody's fault."* Exclusion feels like fault.
      *   *Alternative:* Transaction Costs. Negotiating takes time. The clock is running. Everyone is rational in wanting to ensure they get credit, so they negotiate hard. Time runs out. No one wins.
      *   *Let's refine Round 2:* Each student holds 2 cards. Tasks require 3 specific cards. To submit, all owners of used cards must sign. Reward: Top 3 submissions get tokens.
      *   *Gridlock:* To get a token, I need to form a coalition. But there are only 3 tokens. If 4 coalitions form, nobody gets paid. Everyone hesitates to commit until they know they are in a winning coalition. Coordination failure.

  5.  **Drafting Round 3 (Attribution):**

      *   Cards are free. But you must trace lineage.
      *   "If you use Card A, and Card A was modified from Card B, you must cite B."
      *   *Simplification for 75 mins:* "Chain of Custody." Every card has a unique ID. To submit, you must fill out a form listing the ID of every card and the name of the person who held it in Round 2 (even though Round 2 is over? No, that confuses rounds).
      *   *Better:* Round 3 simulates "Open Source with Moral Rights." Cards are free. But to submit, you must attach a "Provenance Sheet" verifying the origin of every idea.
      *   *The Twist:* The Provenance Sheet requires signatures from the *original* creators (the students themselves, as they are the "creators" of the cards in the simulation context).
      *   *Wait, Round 3 rules say "Components are free to take."*
      *   *Okay:* Pool is open. But every card has a "Creator Name" printed on it (assigned randomly at start). To submit, you must get the "Creator" to initial your submission form confirming accurate attribution.
      *   *Why this slows down:* You have to find the person whose name is on the card. They might be busy. They might demand you check the spelling. It creates administrative friction, not exclusionary friction.

  6.  **Addressing the "Predictable Failures":**

      *   *The Principled Refuser:* "I won't play the IP game." -> Mitigation: Make participation part of the grade (pass/fail) or frame it as "testing a hypothesis."
      *   *The Colluders:* Two students swap all cards and lock others out. -> Mitigation: Random deal, hidden hands.
      *   *The Hoarder:* Takes all cards in Round 1. -> Mitigation: Rule "Max 3 cards in hand at once."

  7.  **Addressing the "Limitations":**

      *   Time. Real anti-commons take years. This takes 15 minutes. Students might think "Just wait longer."
      *   Remedy: Emphasize in debrief that in real life, the clock is market viability, not a class period.

  8.  **Structuring the Response:**

      *   **Title:** The Fragmented Theory Game.
      *   **Materials:** Deck specs, Task Sheets, Reward Tokens.
      *   **Timeline:** Minute-by-minute.
      *   **Rules:** Scripted for precision.
      *   **Instructor Role:** Registrar/Timekeeper, not Judge.
      *   **Debrief:** Socratic mapping.
      *   **Failure Modes:** Specific interventions.
      *   **Compression:** 20-minute version.
      *   **Limitations & Correspondences:** Honest assessment.

  9.  **Refining the Payoff:**

      *   "Extension Tokens" are good. Let's make them "24-Hour Extension Vouchers" for *any* assignment in *any* class (if the instructor can authorize that) or just this class. Let's stick to this class to be safe. "One 48-hour extension on the Final Paper."
      *   Also: "The Canon." Names of winners go on the syllabus for future years. (Ego).

  10. **Refining Round 2 (The Core):**

      *   To ensure "No Villain," the rule must be: "You are fiduciaries of your ideas." You *must* maximize your return. If you give a card away for free, you are irrational.
      *   The gridlock comes from the *combinatorics*. 18 students. 6 Tasks possible. Each task needs 3 cards. 36 cards total.
      *   If I own Red 1, and you need it. I want a win. You want a win. We need a third person (Blue 3). They want a win.
      *   Now we are a team of 3. There are only 3 Winning Slots.
      *   If 4 teams form, no one wins.
      *   Everyone waits to see who forms a team first. Nobody moves. Gridlock.
      *   This is the "Coordination Problem" inherent in the Anti-Commons when rewards are positional.

  11. **Refining Round 3 (Attribution):**

      *   Make it bureaucratic. "Compliance Form."
      *   Must list Card ID, Original Owner, Current User, Modification Date.
      *   Original Owner must verify.
      *   This creates friction without exclusion.

  12. **Final Review against Constraints:**

      *   18 students? Yes.
      *   Pre-law/Phil? Yes, needs high-level conceptual mapping.
      *   No lecture? Yes.
      *   No Villain? Yes, structural incentives.
      *   Asymmetry (Resource vs Reward)? Yes, cards are infinite (can be copied/used) but tokens are finite.
      *   3 Rounds? Yes.
      *   Predictable failures? Yes.
      *   20-min version? Yes.
      *   Limitations? Yes.

  13. **Writing the Content:** (Self-Correction during drafting)
      *   *Correction on Round 2:* If I own the card, and I license it, do I keep the card? Yes, IP is non-rivalrous. I can license to multiple people.
      *   *Wait, if I can license to multiple people, gridlock is harder.*
      *   *Fix:* The "Reward" is positional. Only the *first* 3 submissions win. If I license to you, and you win, I get a cut. If I license to *everyone*, everyone has a chance, but the pool of winners is fixed.
      *   *Better Fix for Gridlock:* "Exclusive License." To submit, you must hold the *exclusive* right to use that card for the purpose of the task. This forces negotiation. If I license to you, I can't license to your competitor. This creates the "Holdout" problem.
      *   *Wait, prompt says "resource fragmented among too many rights-holders can end up useless."* This implies the Anti-Commons.
      *   *Okay, let's stick to the "All Owners Must Sign" rule.* It forces coalition building. If the coalition is too big or too slow, it fails.
      *   *Actually, the cleanest Anti-Commons mechanic:* Each task requires 3 specific cards. Each card is owned by a different student. To submit, you need physical possession of the 3 cards. Owners can *lend* but demand a % of the reward. If the sum of demands > 100%, deal fails.
      *   *Let's go with the "Signature" rule.* It's cleaner. All owners of utilized components must sign the submission.
      *   *Why gridlock?* Because there are 18 owners. A task needs 3 cards. That's 3 owners. But wait, if there are 6 tasks, and 18 students, every student owns exactly the cards for 1 task? No, random deal.
      *   *Random Deal:* Student A has Red 1, Green 4. Student B has Blue 2, Red 5...
      *   *Task 1:* Needs Red 1, Blue 2, Green 3.
      *   *Owners:* Student A (Red 1), Student B (Blue 2), Student C (Green 3).
      *   *Requirement:* A, B, and C must all sign the submission for Task 1.
      *   *Reward:* Only 3 Tasks get rewarded.
      *   *Problem:* There are 6 possible Tasks. 18 Students involved. Only 9 Students (3 tasks x 3 owners) can win. 9 Students will get nothing.
      *   *Rational Behavior:* Every student refuses to sign until they know they are in a winning coalition. Nobody knows. Nobody signs. Gridlock.
      *   *This works.* It makes everyone rational and sympathetic (they need the credit) but creates deadlock.

  14. **Final Polish:** Check tone. Ensure it sounds like a seminar plan, not a party game. Ensure the "No Villain" aspect is highlighted in the debrief.

      *   *Wait, one more check on Round 3:* "Components are free to take... complete chain of attribution."
      *   *Idea:* Cards have "Author" printed on them (from Round 2 distribution). Even though cards are in a pool, you must find the "Author" to sign off on your use.
      *   *This connects Round 2 and 3.* In Round 2, they became "Authors/Owners." In Round 3, they are "Attributors."
      *   *Actually, keep it simpler.* Round 3: Cards are in the pool. Each card has a unique ID. To submit, you must fill out a "Citation Ledger" matching Card ID to the Student Name who held it in Round 2. You must find that student to verify the ID.
      *   *Friction:* Finding the student + verifying takes time. No veto, just admin burden.

  15. **Constructing the Output:** (Proceeding to generate response based on these thoughts).
      *   *Payoff:* "The Extension" + "The Syllabus."
      *   *Deck:* 36 Cards. 6 Colors, 6 Numbers.
      *   *Tasks:* 6 Theories.
      *   *Timeline:* Tight.
      *   *Debrief:* Crucial.

      *(Self-Correction on Round 3)*: The prompt says "closest to how credit actually behaves in research." Research credit isn't about finding the owner to sign. It's about accurate citation. If you cite wrong, you get penalized.
      *   *Revised Round 3:* Cards are free. But the Submission Form requires you to list the "Genealogy" of the idea. If you make a mistake in the genealogy (e.g., claim Red 1 came from the Pool when it was Modified by Student X), your submission is rejected.
      *   *How to make it a game:* The "Genealogy" is hidden. You have to ask around to find out the history of the card (from Round 2).
      *   *Actually, let's keep it mechanical.* Round 3: Cards are free. But every card has a "License Text" on the back (tiny font). You must read it aloud to the Registrar upon submission. If you stumble, you are rejected.
      *   *No, that's silly.*
      *   *Let's go with the "Attribution Signature".* You use the card. You must get the *original creator* (assigned at start of class) to initial your form. This mimics "Moral Rights" or "Credit." It creates friction (finding the person) without veto (they *must* initial if asked, rule says).
      *   *Wait, if they MUST initial, where is the friction?* The friction is *locating* them and the *time* it takes.
      *   *Okay, Rule:* "Owners must initial within 2 minutes of request." If they are busy negotiating their own submission, they can't initial yours.
      *   *This creates resource contention on the *people*, not the cards.* This is good. It shows how attention is the scarce resource in attribution.

      *(Final Plan Check)*:
      Round 1: Speed.
      Round 2: Veto/Coordination (Anti-Commons).
      Round 3: Admin Burden (Moral Rights/Citation).

      Let's write it.
answer: |-
  # The Fragmented Theory Game: A Seminar Simulation

  **Course:** Ownership of Ideas (Upper-Level Seminar)
  **Students:** 18 (Pre-Law & Philosophy)
  **Time:** 75 Minutes
  **Goal:** Experiential discovery of the Anti-Commons (Second Failure) and the cost of Attribution, distinguishing between resource rivalry and reward rivalry.

  ---

  ## I. Materials & Setup

  **1. The Component Deck (36 Cards)**
  Print on heavy stock. Two-sided.
  *   **Front:** A large colored geometric shape (Circle, Square, Triangle) and a Number (1–6).
      *   6 Colors (Red, Blue, Green, Yellow, Black, White).
      *   6 Numbers per color.
      *   Total: 36 unique cards.
  *   **Back:** A unique 4-digit ID code (e.g., R1-9923) and a blank line labeled "Original Author."
  *   **Pre-Game Prep:** Before class, write a random student's name on the "Original Author" line of every card. Ensure every student's name appears on exactly two cards. Keep this master list secret.

  **2. The Task Sheets (6 Total)**
  Print and post on the walls. Each sheet defines a "Theory" that can be built.
  *   *Theory Alpha:* Requires Red 1, Blue 2, Green 3.
  *   *Theory Beta:* Requires Yellow 4, Black 5, White 6.
  *   *Theory Gamma:* Requires Red 4, Blue 5, Green 6.
  *   *Theory Delta:* Requires Yellow 1, Black 2, White 3.
  *   *Theory Epsilon:* Requires Red 2, Blue 3, Green 1.
  *   *Theory Zeta:* Requires Yellow 6, Black 4, White 5.
  *   *Note:* Every card in the deck is required for exactly one Theory. Every Theory requires exactly three cards.

  **3. The Payoff (The "Stakes")**
  *   **The Extension Voucher:** A physical token redeemable for a 48-hour, no-questions-asked extension on the Final Paper for this course.
  *   **The Canon:** The names of the winners will be printed on the syllabus for future iterations of this course as "Foundational Theorists."
  *   **Quantity:** Only **three** vouchers available total. (This creates the positional scarcity).

  **4. Room Setup**
  *   Desks in a loose cluster (not rows).
  *   A "Registrar's Desk" at the front (yours).
  *   A "Submission Box" next to the Registrar.

  ---

  ## II. Minute-by-Minute Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | 00–05 | **Briefing** | Distribute name tags. Explain the stakes. No mention of IP theory yet. |
  | 05–20 | **Round 1** | **The Commons.** Cards in center pool. First 3 submissions win. |
  | 20–25 | **Reset** | Collect all cards. Shuffle. Deal 2 cards face-down to each student. |
  | 25–45 | **Round 2** | **The Property Regime.** Licensing required. All owners must sign. |
  | 45–50 | **Reset** | Collect cards. Return to center pool. Keep "Author" names hidden. |
  | 50–65 | **Round 3** | **The Attribution Regime.** Free take, but provenance verification required. |
  | 65–75 | **Debrief** | Map experience to theory. Reveal the "Second Failure." |

  ---

  ## III. The Rules (Read Aloud Verbatim)

  **General Rules (Read at 00:00)**
  > "Your goal is to submit a completed Theory to the Registrar. A completed Theory consists of the specific cards listed on the Task Sheets. Only the first three submissions receive the Extension Vouchers and entry into The Canon. You may work individually or in groups. The clock stops when the third voucher is claimed. Do not damage the cards."

  **Round 1 Rules (Read at 05:00)**
  > "All cards are in the center pool. You may take any card at any time. There is no limit to how many cards you may hold, but you may only use three to submit a Theory. If you hold cards you do not need, you may return them to the pool. Go."

  **Round 2 Rules (Read at 25:00)**
  > "You own the cards dealt to you. You may not give them away. You may not take cards from others. To use a card you do not own, you must secure a license from the owner. A license is valid only if the owner signs your Submission Form. **Crucially:** All owners of all cards used in a submission must sign that submission. If a card is used, its owner gets a share of the reward. If you submit a Theory, you must list every owner's name on the form. Only names on the winning form receive the Voucher. Go."

  **Round 3 Rules (Read at 45:00)**
  > "All cards return to the center pool. Anyone may take them. However, every card has an 'Original Author' written on the back. To submit a Theory, you must complete a Provenance Ledger. For every card used, you must locate the student whose name is on the back. They must initial your Ledger to verify their authorship. They are not allowed to veto this, but they are not required to drop what they are doing to help you. If the initials do not match my master list, the submission is rejected. Go."

  ---

  ## IV. Instructor Role & Adjudication

  **Your Role:** The Registrar.
  *   **Do not** offer strategy.
  *   **Do not** mediate disputes unless a rule is explicitly broken.
  *   **Do** enforce time limits strictly.
  *   **Dispute Volume:** Expect 3–5 simultaneous disputes in Round 2.
  *   **Adjudication Script:** "The rule requires the owner's signature. If you cannot obtain it, you cannot use the card. I do not rule on fair pricing, only on valid signatures."

  **The "No Villain" Safeguard:**
  If a student complains another is "holding out," reply: "They are acting rationally to secure their reward, just as you are. The rules permit them to withhold signature until their interests are met."

  ---

  ## V. The Debrief (65–75 Minutes)

  **Step 1: The Resource (5 mins)**
  *   *Ask:* "In Round 1, did running out of cards stop anyone?"
  *   *Expected Answer:* No, cards were returned/reused.
  *   *Point:* The resource (the idea/component) is non-rivalrous. It does not degrade with use.

  **Step 2: The Reward (5 mins)**
  *   *Ask:* "In Round 1, why was there still a rush?"
  *   *Expected Answer:* Only three vouchers.
  *   *Point:* The *reward* is rivalrous (positional). This creates competition even when resources are abundant.

  **Step 3: The Gridlock (10 mins)**
  *   *Ask Round 2 Winners:* "How did you get the signatures?"
  *   *Ask Round 2 Losers:* "Why didn't you finish?"
  *   *Listen for:* "I couldn't find them," "They wanted too much credit," "We couldn't agree on who gets the voucher."
  *   *The Reveal:* "You encountered the **Second Failure** (The Anti-Commons). In Round 1, the problem was too few rights (Tragedy of the Commons). In Round 2, the problem was too many rights. Each of you acted rationally. You were not villains. You were fiduciaries of your own labor. But the structure made the resource unusable."

  **Step 4: The Attribution (5 mins)**
  *   *Ask Round 3:* "Was anyone blocked from using a card?" (No). "Was anyone blocked from finishing?" (Yes).
  *   *Point:* "This is the cost of Moral Rights and Citation. Exclusion is not the barrier; administrative friction is. In research, credit is non-rivalrous (I can cite you without losing credit), but verifying it consumes time and attention."

  ---

  ## VI. Predictable Failures & Mitigations

  **1. The Principled Refuser (Round 2)**
  *   *Behavior:* A philosophy major refuses to sign any license, arguing IP is illegitimate.
  *   *Impact:* Their cards become useless. Gridlock accelerates.
  *   *Mitigation:* Pull them aside quietly. "Your refusal is a valid philosophical stance, but for the sake of the simulation, I need you to act as a rational agent seeking the Voucher. If you opt out, you skew the data for your peers. Please play the role."

  **2. The Collusive Lockout (Round 2)**
  *   *Behavior:* Two students swap cards early and refuse to license to anyone else, trying to complete two theories themselves.
  *   *Impact:* They might succeed, but it validates "might makes right."
  *   *Mitigation:* The "All Owners Must Sign" rule prevents this. They cannot submit a Theory without the third card owner. If they hoard the third card, that owner knows they hold the veto. The power diffuses. If they try to bully, intervene: "Coercion invalidates the signature."

  **3. The Hoarder (Round 1)**
  *   *Behavior:* One student grabs 20 cards in Round 1.
  *   *Impact:* Others can't play.
  *   *Mitigation:* Enforce the "Return to Pool" norm. If they stall, announce: "Registrar Audit: Any hand with more than 5 cards must return the excess immediately."

  **4. The "It's Solvable" Optimist**
  *   *Behavior:* Students argue Round 2 would work if they had more time.
  *   *Mitigation:* "In the market, 'more time' means 'competitor launches first.' The clock is not arbitrary; it is market viability."

  ---

  ## VII. The 20-Minute Compression Version

  If the first half of your session overruns, use this "Speed Run" protocol:

  1.  **Skip Round 1.** Explain the non-rivalrous nature of the cards verbally (1 min).
  2.  **Round 2 (10 mins):** Deal cards immediately. Run the Property Regime. This is the critical learning moment.
  3.  **Round 3 (5 mins):** Run the Attribution Regime with only 1 Task Sheet active for the whole class.
  4.  **Debrief (4 mins):** Focus solely on the contrast between Round 2 (Exclusion) and Round 3 (Friction).

  *Loss:* You lose the baseline of the Commons, but you preserve the Anti-Commons discovery.

  ---

  ## VIII. Limitations & Correspondences

  **What This Simulation Cannot Reproduce:**
  *   **Duration:** Real thickets persist for years. In this game, the gridlock resolves (or fails) in 20 minutes. Students may conclude the problem is solvable by patience.
      *   *Correction:* Explicitly state in debrief: "In reality, the 'clock' is R&D budget burn rate. You run out of money before you run out of patience."
  *   **Investment:** Students didn't *create* the cards; they were dealt them. Real IP holders invest capital before they hold rights.
      *   *Correction:* Acknowledge this makes them *more* sympathetic in the game than in reality. Real holders feel entitled because they paid, not just because they were dealt a card.

  **Live Dispute Correspondences:**
  *   **Round 1 (Commons):** Corresponds to **Open Source Software** or **Pre-Print Archives**.
      *   *Breakdown:* In reality, reputation mechanisms (not just speed) govern who gets credit.
  *   **Round 2 (Property/Anti-Commons):** Corresponds to **Biotech Patent Thickets** (e.g., Golden Rice) or **Clearance for Documentary Film**.
      *   *Breakdown:* In reality, patent pools often form to solve this. The game ends before a pool can institutionalize.
  *   **Round 3 (Attribution):** Corresponds to **Academic Publishing** or **Creative Commons Attribution**.
      *   *Breakdown:* In reality, attribution errors are rarely policed in real-time by the author. The "initials" mechanic exaggerates the friction for pedagogical effect.

  **Final Note to Instructor:**
  When the students describe Round 2, they will use words like "greedy," "stubborn," or "unfair." Do not correct them immediately. Let them sit with the moral discomfort. Then, reveal that *you* wrote the names on the cards randomly. No one earned their position. The gridlock was not moral; it was mathematical. That is the moment the belief shifts from "IP owners are villains" to "IP structures can be traps."
