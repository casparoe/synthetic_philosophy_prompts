      *   So (6) must go. Love is an ontological state of the lover, not an epistemic state of the beloved.
      *   *Correction:* The student defines love *in* (6). "A being whose love is compatible with..." This is a stipulative definition.
      *   So the fight is over the definition of love. The user needs to argue that this definition is wrong.
