          *   **Complexity:** Writing a runbook *and* a rubric *and* voting on rule amendments in 90 mins for 18 people (9 pairs) is too much cognitive load, especially at 4pm.
          *   **Friction:** "Majority vote" among 9 pairs is slow and messy. Who counts the vote? How do they negotiate?
          *   **The Pivot:** Relying on a Builder finding a "genuinely better procedure that violates the rubric" is risky. Engineers might just follow the rubric to win points. They need an incentive to break the rule *if* it helps the outcome, but the scoring needs to punish rule-breaking *unless* overridden.
          *   **Artifact:** Written runbooks are abstract. Code-like logic puzzles might be sharper for engineers.
          *   **Time:** 90 mins includes setup and debrief. 4 rounds of writing + grading + voting is tight.
          *   **Alignment:** The goal is to feel the tension between following instructions (process) and achieving the goal (outcome). The sketch leans heavily on rubric design, which is good, but needs sharper incentives.

  3.  **Design Decisions:**
      *   **Artifact:** Switch from "runbook" to "Transformation Logic" (pseudo-code or strict mapping rules). It's more native to engineers. Let's use a "Data Sanitization Protocol" scenario. It feels like work but is abstract enough.
      *   **Structure:** Reduce rounds to 3 active rounds + 1 debrief round. 18 people -> 6 teams of 3 (Builder, Grader, Auditor/Adversary). Or keep pairs but simplify the voting. Let's stick to pairs (9 pairs) but centralize the rubric evolution to avoid 9 separate rubrics. *Correction:* If everyone shares one rubric, it's a collective game. If pairs have their own, it's isolated. To feel the "lock-in" effect, the rubric needs to be shared or at least comparable. Let's make it a **Collective Rubric** game. All Builders build against one evolving spec. All Graders grade against it.
      *   **The Pivot:** Needs to be forced, not hoped for. I need to introduce a "Edge Case Card" in Round 3 that makes the current rubric fail the outcome test.
      *   **Incentives:** Points for passing the Grader (Process) AND points for passing the Hidden Scenario (Outcome). This creates the conflict.
      *   **Time Management:** 90 mins is tight.
          *   Intro: 5 min
          *   Round 1 (Baseline): 15 min
          *   Round 2 (Refinement): 20 min
          *   Round 3 (The Pivot/Edge Case): 20 min
          *   Scoring/Reveal: 15 min
          *   Debrief: 15 min
          *   Total: 90 min.
      *   **Roles:** Builder (writes solution), Grader (checks against rubric), Adversary (holds the Hidden Scenario card). Actually, triads are better for 18 people (6 groups). It adds the "Outcome" holder as a distinct role so the Builder/Grader don't know the outcome until the end.
      *   **Scoring:** Process Points (pass rubric) + Outcome Points (pass hidden test).
      *   **Rubric Evolution:** Allow 1 amendment per round based on failures.

  4.  **Refining the Design for JSON:**
      *   *Title:* "The Spec Trap" or "Rulebound vs. Result". Let's go with "The Specification Game".
      *   *Learning Targets:* Focus on the feelings (frustration, gaming, lock-in).
      *   *Materials:* Index cards, markers, printed scenario cards (hidden), printed initial examples.
      *   *Roles:* 6 Teams of 3 (Builder, Grader, Arbiter).
      *   *Rounds:* 3 Rounds.
      *   *Payoffs:* Points on whiteboard. Social status/recognition.
      *   *The Pivot:* Round 3 introduces a scenario where the Rubric says "Fail" but the Outcome says "Pass" (or vice versa).
      *   *Debrief:* Map feelings to concepts.
      *   *Failures:* Gaming, disengagement, time overrun.
      *   *Irreproducible:* Actual ML training loops, scale, deceptive alignment.
      *   *Changes:* Simplified artifact, triads instead of pairs, forced pivot instead of hoped-for.
      *   *Rejected:* Code writing (too slow), pure debate (too abstract), individual rubrics (no collective lock-in feel).

