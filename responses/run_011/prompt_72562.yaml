      *   *Artifact:* "Packet Filter Rules". Engineers understand filtering data.
      *   *Scenario:* "Allow/Deny" lists based on attributes.
      *   *Rubric:* A list of "Must" and "Must Not" rules.
      *   *Conflict:* Round 3 reveals a packet that technically violates a Rule but is Safe (Outcome), or follows a Rule but is Dangerous.
      *   *Scoring:* 1 point for following Rubric, 2 points for Correct Outcome. This weights Outcome higher but Rubric is easier to know.
      *   *Lock-in:* Once a rule is written, it stays unless voted out (costly).

