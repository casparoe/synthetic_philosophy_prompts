prompt: |-
  Act as an expert in AI alignment who has also spent a lot of time designing hands-on teaching for technical audiences. Think the design through carefully before answering; I am asking you to commit to one concrete design, not to survey possibilities.

  I'm a staff software engineer at a mid-size company, and I lead a small team building an internal coding agent. In two weeks I'm running a 90-minute session at our engineering offsite for about 18 people: backend and ML engineers, all competent programmers, none of them with any philosophy background or any formal AI-safety training. I've been reading around the distinction between process-based and outcome-based supervision of AI systems — rewarding the intermediate steps versus rewarding only the final result — and I've become convinced that the tradeoffs are much easier to grasp once you've personally been on both ends of them than they are from any writeup. My manager's only requirement is that nobody is lectured at; my own requirement is subtler. Two people on the team think alignment talk is vaporware, and I would rather they spent the session arguing about whether a grader made the right call under rule 4 than about whether the framing is worth taking seriously. So the concepts should surface from the mechanics, and I should only get to use words like "process supervision" in the debrief.

  What I want them to come away seeing is a specific set of asymmetries, and I'd like you to check that your design actually produces all of them: that process feedback is denser and cheaper to act on but has a ceiling set by what the grader currently understands; that outcome feedback can recognize a solution nobody wrote a rule for, but arrives late, is noisy, and is easy to game at the margin; and that a rubric which gets amended round by round in locally reasonable ways can quietly lock in an error that everyone later inherits. My own half-built sketch is this: pairs of Builder and Grader across four rounds, where the artifact is a short written procedure — I was thinking a six-line incident-response runbook for a made-up service — and I hold a hidden scenario card that determines the real outcome and is only revealed at the end. In round 1 the Graders write the rubric themselves from three worked examples, and each round they may add exactly one clarifying rule by majority vote. The moment I most want to engineer is a round in which some Builder finds a genuinely better procedure that violates the written rubric, so the Grader has to choose between following the rule and killing the improvement, or overriding it and opening the door to unprincipled discretion for the rest of the session. Please tell me whether that pivot will actually land with 18 tired engineers at 4pm, and if it won't, fix it. Feel free to replace the runbook artifact entirely if something else gives sharper signal; I just can't ask anyone to write code during the session, and the room has two whiteboards, a projector, and index cards, with no budget for props and no real money or performance-review stakes available as rewards.

  Be decisive. Pick the design you think will work best, defend the choices you made, and say plainly where you think my sketch above is wrong rather than quietly accommodating it. I also want the honest limits: which features of the real distinction the game cannot reproduce, so I know what I have to supply verbally in the debrief, and what will predictably break the first time I run this and how to catch it early.

  Please return your answer as a single JSON object with exactly these fields:

  - `design_title`: string, a short name I can put on the agenda.
  - `learning_targets`: array of strings, each one phrased as something a participant should be able to say afterward, without using the technical term for it.
  - `materials`: array of objects with `item`, `quantity`, `preparation_needed` (what I have to make or print beforehand, with the text included if it's short).
  - `roles`: array of objects with `role`, `headcount`, `what_they_do`, `what_they_must_not_know`.
  - `rounds`: array of objects with `round_number`, `minutes`, `task`, `who_sees_what`, `scoring_rule`, `intended_friction` (the specific misunderstanding or tension this round is designed to generate).
  - `payoffs`: object with `currency`, `how_points_are_earned`, `how_points_become_final_score`, `why_this_works_without_real_stakes`.
  - `the_pivot`: object with `which_round`, `how_it_is_set_up`, `what_a_good_group_does`, `what_a_bad_group_does`, `what_the_facilitator_must_not_say`.
  - `debrief`: array of objects with `question_to_ask`, `moment_it_refers_to`, `concept_it_maps_onto`, `minutes`.
  - `predicted_failures`: array of objects with `failure`, `likelihood` (high/medium/low), `early_warning_sign`, `mitigation`.
  - `irreproducible_features`: array of objects with `feature`, `why_the_game_misses_it`, `what_to_say_instead`.
  - `changes_to_my_sketch`: array of objects with `what_i_proposed`, `what_you_changed`, `reason`.
  - `rejected_alternatives`: array of objects with `mechanic_considered`, `why_rejected` — include at least three, since I want to see what you weighed before settling.
