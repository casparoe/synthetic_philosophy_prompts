answer: |-
  This is a sophisticated evaluation problem, and your intuition is correct: you are dealing with a distinct configuration that standard textbooks often lump loosely under "bias" or "composition effects" without giving it the specific causal weight it deserves. You have correctly ruled out Simpson's Paradox (which is about weighting of *existing* subgroups), Will Rogers (which is about *reclassification* of existing units), and Survivorship Bias (which is about *loss* of units).

  Here is the breakdown you requested for your handbook and state reauthorization document.

  ### 1. Does this configuration have an established name?

  **The short answer is no.** There is no single, universally recognized proper noun (like "Simpson's" or "Berkson's") that specifically captures *success-induced denominator expansion*.

  However, it is recognized in pieces across three fields. You are seeing the intersection of:
  *   **Epidemiology:** **Surveillance Bias** or **Detection Bias** (though these usually imply measurement error, whereas your cases imply *real* inclusion).
  *   **Health Economics:** **Endogenous Selection** or **Risk Selection**. When a program becomes successful or accessible, the risk profile of the enrollees changes.
  *   **Education Policy:** **Participation Rate Effects**. When accountability systems penalize low participation, programs that increase participation among low-performers may see aggregate scores drop.

  **How it differs from Simpson's Paradox:**
  In Simpson's Paradox, the subgroups exist in both periods (or both arms), but their *weights* differ. In your configuration, the subgroups themselves are *created* or *expanded* by the intervention. In Simpson's, the confounding variable (e.g., severity) is exogenous to the treatment. In your cases, the confounding variable (severity/mix) is **endogenous** to the treatment's success. The intervention *caused* the mix to change.

  **How it differs from Will Rogers:**
  Will Rogers requires moving a patient from Bucket A to Bucket B, raising the average of both. You are moving a patient from "The Void" (uncounted) to Bucket B. The denominator is fundamentally redefined, not just reshuffled.

  **The Verdict:**
  If you cite "Simpson's Paradox" to a state auditor, a savvy statistician will correct you, because the causal mechanism is different. If you cite "Composition Bias," they will accept it, but it is too generic. You need a term that captures the *directionality* of the error (success causing the apparent failure).

  ### 2. Coining a Term: The "Success-Induced Composition Effect"

  For your handbook and the reauthorization report, I recommend coining the term **The Success-Induced Composition Effect (SICE)**.

  **Definition for the Auditor:**
  > *The Success-Induced Composition Effect occurs when an intervention's effectiveness at reaching previously underserved or higher-risk populations alters the case-mix of the measured denominator, causing aggregate outcome rates to deteriorate even when subgroup-specific outcomes improve. Unlike Simpson's Paradox, the population definition itself changes endogenously due to program access.*

  **Scope:**
  This definition covers both of your examples:
  1.  **Wound-Care Clinic:** The "success" is accessibility. The "composition change" is the inclusion of previously invisible severe cases.
  2.  **School Tutoring:** The "success" is retention. The "composition change" is the inclusion of previously absent/dropped-out students.

  **Why this term works:**
  *   **"Success-Induced":** It preemptively defends against the claim that the program failed. It frames the aggregate deterioration as a byproduct of efficacy (reach), not ineffectiveness (quality).
  *   **"Composition":** It uses standard statistical language that auditors recognize (case-mix adjustment).
  *   **"Effect":** It avoids the word "Bias," which implies error. This is not an error; it is a structural consequence of universalization.

  ### 3. The Edges: Boundaries and Decision Guidance

  This is the most critical part for your handbook. You need to know when this effect is a "bookkeeping illusion" and when it signals actual program failure.

  #### A. The Boundary Case: When does it become failure?

  The line is crossed when the intervention stops merely *expanding* the denominator and starts *degrading* the performance of the original subgroups.

  **The Test:**
  You must track the **Baseline Subgroups** (the people who would have been served even without the expansion).
  *   **Scenario 1 (SICE):** New high-risk patients enter. Old low-risk patients stay the same or improve. Aggregate worsens. **Verdict:** Program Success.
  *   **Scenario 2 (Crowding Out):** New high-risk patients enter. Old low-risk patients *worsen* because resources were diverted to manage the new complexity. Aggregate worsens. **Verdict:** Program Failure (or at least, diminishing returns).

  **The Statistical Boundary:**
  Use **Direct Standardization**. Calculate what the post-intervention aggregate rate *would have been* if the post-intervention population had the same risk-mix as the pre-intervention population.
  *   If the **Standardized Rate** improves, but the **Crude Rate** worsens, you are in SICE territory.
  *   If the **Standardized Rate** also worsens, the program efficacy has genuinely declined.

  #### B. When is the Aggregate the "Right" Number?

  You asked when the evaluator is the one evading the question by reaching for disaggregated figures. The aggregate is the correct metric when the policy goal is **Population Status** rather than **Program Efficacy**.

  *   **Program Efficacy Question:** "Did the clinic treat wounds effectively?"
      *   *Correct Metric:* Risk-adjusted subgroup rates.
      *   *Reasoning:* The county hired you to run a clinic, not to magically erase the existence of severe patients.
  *   **Population Health Question:** "Is the county's burden of disease decreasing?"
      *   *Correct Metric:* Crude aggregate rate.
      *   *Reasoning:* If the clinic succeeds in finding all the severe cases, the county *is* statistically sicker, even if the patients are healthier. The budget burden on the county has increased. The aggregate rate honestly reflects the fiscal and logistical load on the system.

  **Guidance for the Report:**
  Do not choose one number. Report the **Decomposition of Change**.
  State auditors love decomposition. Present the total change in the rate as the sum of two components:
  1.  **The Efficacy Component:** Change due to improved outcomes within groups (usually negative, i.e., good).
  2.  **The Composition Component:** Change due to the shift in population mix (usually positive, i.e., bad).

  *Example Language:* "The reported complication rate rose by 15%. Decomposition analysis attributes 20% of this rise to increased case severity (successful identification of hidden patients) and a 5% reduction to improved clinical outcomes. The net result is a statistical increase that reflects successful program reach rather than clinical failure."

  #### C. Practical Decision Tree for the Handbook

  To make this actionable for your team, include this decision logic:

  1.  **Did the subgroup rates improve?**
      *   No → Stop. Investigate program failure.
      *   Yes → Proceed to 2.
  2.  **Did the population mix shift toward higher risk?**
      *   No → Investigate data error or Simpson's Paradox.
      *   Yes → Proceed to 3.
  3.  **Did the shift occur because previously excluded people are now included?**
      *   No → Investigate Will Rogers/Reclassification.
      *   Yes → **Label as Success-Induced Composition Effect.**
  4.  **Reporting Action:**
      *   Report the Crude Rate (for population burden).
      *   Report the Risk-Adjusted Rate (for program performance).
      *   Explicitly quantify the "Cost of Success" (the portion of the rate increase attributable to inclusion).

  ### Summary for the State Auditor

  If the reporting template insists on a **single headline figure**, you are in a bind. A single figure forces a choice between "Truth about the Program" and "Truth about the Population."

  **Recommendation:**
  If forced to choose one, report the **Risk-Adjusted Aggregate**.
  *   **Why:** It answers the question "Is the intervention working?" which is the primary purpose of an evaluation handbook.
  *   **Caveat:** Add a footnote: *"Crude rates have risen due to successful expansion of services to higher-risk populations previously uncounted in the system. Risk-adjusted figures control for this case-mix shift."*

  This protects you from looking like you are hiding a worsening trend, while protecting the program from being defunded for doing its job too well.
