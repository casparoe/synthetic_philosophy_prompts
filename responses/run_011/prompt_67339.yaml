      *   **Background:** Program evaluator (6 years), county health agency. Working on an evaluation handbook for state reauthorization.
      *   **The Problem:** A specific statistical pattern where an intervention improves outcomes for *every* subgroup, but the aggregate (pooled) statistic worsens.
      *   **Key Distinction:** This is *not* Simpson's Paradox (subgroups don't reverse direction, they all improve). It's *not* Will Rogers Phenomenon (no reclassification of existing cases, but rather new cases entering the denominator). It's *not* Survivorship Bias. It's *not* Goodhart's Law (no gaming).
      *   **Examples:**
          1.  *Wound-care clinic:* Previously invisible severe patients now enter the system. Subgroups improve, but overall complication rate rises because the denominator now includes sicker people who were previously uncounted.
          2.  *School tutoring:* At-risk students stay in school/test due to support. Subgroups improve, but district average falls because lower-performing students (who previously dropped out/absented) are now included in the average.
      *   **The Requests:**
          1.  **Name:** Does an established name exist? Distinguish from Simpson's/Will Rogers. If not, admit it.
          2.  **Coin a Term:** If no name exists, create one defensible for a state auditor. Define scope (does it cover both examples?).
          3.  **Boundaries & Guidance:** Where is the line between "bookkeeping illusion" and "program failure"? When is the aggregate actually the right number to report? How to decide which number counts?

  2.  **Deconstruct the Statistical Phenomenon:**

      *   *Simpson's Paradox:* Requires $P(A|B) > P(A|\neg B)$ in subgroups but $P(A) < P(A|\neg B)$ in aggregate due to confounding weights. Usually implies a reversal of association. The user explicitly says subgroups *all* improve, but the aggregate worsens relative to the *baseline* (pre-intervention), not necessarily relative to a control group in a cross-sectional snapshot. Wait, let's look closer.
      *   *User's Scenario:* Pre-intervention vs. Post-intervention.
          *   Pre: Population $P_1$. Outcome $O_1$.
          *   Post: Population $P_2$. Outcome $O_2$.
          *   $P_2$ includes "harder to serve" individuals who were not in $P_1$.
          *   Within comparable subgroups, $O_2 < O_1$ (improvement).
          *   But Overall $O_2 > O_1$ (worsening) because the mix of $P_2$ is sicker/worse.
      *   *Statistical Term:* This is fundamentally a **Composition Effect** or **Mix Shift**. Specifically, it's related to **Selection Bias** in the context of program expansion.
      *   *Econometrics/Policy Evaluation:* This looks like **Endogenous Entry** or **Cream Skimming (in reverse)**. Usually, cream skimming means picking easy clients to boost stats. This is "Reverse Cream Skimming" or **Universalization Effect**.
      *   *Epidemiology:* This resembles **Surveillance Bias** or **Detection Bias**, but the user says it's not measurement error, it's real people entering the system. It's closer to **Denominator Expansion Bias** (informal term).
      *   *The "Will Rogers" distinction:* Will Rogers is about moving existing items between buckets (staging). This is about *new* items entering the buckets.
      *   *The "Simpson" distinction:* Simpson's is usually cross-sectional (Group A vs Group B). This is longitudinal (Time 1 vs Time 2) with a changing population definition.
      *   *Closest Established Concept:* **The Composition Effect** (in decomposition analysis). Also **Oster's Paradox** (sometimes used for health stats where prevalence rises as survival improves, but that's slightly different).
      *   *Actually, the strongest match:* **The Paradox of Success** (informal) or **Intervention-Induced Selection Bias**.
      *   *Wait, is there a specific name?* In health economics, this is often discussed under **Risk Adjustment** failures. In education, it's **Participation Rate Effects**.
      *   *Refining the search:* The specific mechanic is that the *counterfactual* population has changed. The "Average Treatment Effect on the Treated" (ATT) is positive, but the "Population Average Treatment Effect" looks negative because the "Treated" population expanded to include higher-risk individuals who were previously untreated/uncounted.
      *   *Key Terminology:* **Composition Bias**, **Mix Effect**, **Case-Mix Change**.
      *   *Is it Simpson's?* Technically, Simpson's can occur in time-series if the weighting changes. But the user is right to distinguish it: Simpson's usually implies a reversal of correlation *within* the data structure, whereas this is a change in the *definition of the population* over time.
      *   *Best Fit:* **Endogenous Population Expansion** leading to a **Composition Effect**.
      *   *Is there a specific named paradox?* There isn't one single universally recognized name like "Simpson's." However, in evaluation literature, this is often called the **Denominator Problem** or **Coverage-Outcome Trade-off**.
      *   *Wait, one strong candidate:* **The Prevention Paradox** (Rose's Prevention Paradox)? No, that's about population vs high-risk strategy.
      *   *Another candidate:* **The Success Paradox**.
      *   *Let's look at the "School" example:* This is classic **Participation Rate Bias** in accountability metrics.
      *   *Let's look at the "Clinic" example:* This is **Surveillance/Detection Effect** combined with **Case-Mix Shift**.

      *Decision:* There is no single, universally standardized proper noun (like "Simpson's") that covers *exactly* this specific causal mechanism of "success brings in harder cases which lowers the average." It is a specific flavor of **Composition Effect** driven by **Endogenous Selection**. I need to be honest about this.

  3.  **Drafting the Response - Section by Section:**

      *   **Part 1: The Name.**
          *   Acknowledge the user's rigorous elimination of Simpson's/Will Rogers. They are correct.
          *   Identify the closest technical terms: **Composition Effect** (statistical decomposition), **Case-Mix Adjustment** (health), **Participation Rate Effect** (education).
          *   Verdict: No single "Paradox of X" name exists in standard textbooks that captures the *causal* story of "success causes inclusion of worse cases."
          *   Distinguish from Simpson's: Simpson's is about weighting within a fixed population. This is about the population definition changing *because* of the intervention.
          *   Distinguish from Will Rogers: Will Rogers is reclassification of existing units. This is inclusion of previously excluded units.

      *   **Part 2: Coining a Term.**
          *   Needs to sound professional for a state auditor.
          *   Idea: **The Inclusion Paradox**? Too vague.
          *   Idea: **Success-Induced Composition Bias**? Accurate.
          *   Idea: **The Coverage-Outcome Trade-off**? Descriptive, but sounds like a policy choice, not a statistical artifact.
          *   Idea: **Endogenous Denominator Expansion**. Very technical.
          *   *Selection:* **The Success-Induced Composition Effect (SICE)**. Or **The Access-Outcome Paradox**.
          *   *Better:* **The Denominator Expansion Effect**.
          *   *Best:* **The Inclusion-Intensity Paradox**.
          *   *Actually, let's go with something descriptive:* **Success-Induced Case-Mix Shift**.
          *   *Wait, I want something punchier for the handbook.* **The Reach-Rate Paradox**. (As you reach further, rates drop).
          *   *Let's settle on:* **The Success-Induced Composition Effect**. It's defensible. It clearly states the cause (Success) and the mechanism (Composition).
          *   *Does it cover both?* Yes. Clinic: New patients enter composition. School: Returning students enter composition. Both change the mix.

      *   **Part 3: The Edges (Boundaries & Guidance).**
          *   *The Boundary:* When does it become failure?
          *   If the *subgroup* outcomes start degrading (diminishing returns), that's failure.
          *   If the *aggregate* worsens *more* than the case-mix shift predicts, that's failure.
          *   *Method:* **Standardization** or **Risk Adjustment**. Calculate what the aggregate *would* have been if the population mix hadn't changed.
          *   *When is the Aggregate Right?* When the goal is population health/status, not program efficacy. If the county is sicker, the county is sicker. The evaluator must distinguish "Program Efficacy" (did we help those we touched?) from "Population Impact" (is the county better off?).
          *   *Guidance:* Report both. Use risk-adjusted rates for efficacy. Use crude rates for population status.
          *   *The "Crowding Out" test:* Did the program divert resources from easy cases to hard cases, causing easy cases to worsen? If yes, that's real failure. If easy cases stayed same or improved, it's just composition.

  4.  **Refining the Statistical Nuance (Self-Correction):**

      *   *Simpson's Check:* The user says "the direction never flips at all — every subgroup agrees with every other." In classic Simpson's, $A > B$ in subgroups, but $B > A$ in aggregate. Here, Pre vs Post. Subgroups: Post < Pre (Improvement). Aggregate: Post > Pre (Worsening). This *is* technically a form of Simpson's Paradox (reversal of association between Time and Outcome due to confounding by Group Mix). *However*, the user's distinction is vital: In Simpson's, the groups usually exist in both periods. Here, the groups *emerge* or *expand* due to the intervention. I should validate their intuition that "Simpson's" feels wrong because the *population identity* changed, not just the weights. I will call it a **Longitudinal Composition Effect** which is a cousin of Simpson's but distinct in causal structure.
      *   *Will Rogers Check:* User is right. Will Rogers is $\text{Stage I} \to \text{Stage II}$ via better measurement. This is $\text{No Count} \to \text{Count}$.
      *   *Terminology:* In health econ, this is often **Risk Selection**. In education, **Accountability Bias**.
      *   *Proposed Name:* **The Success-Induced Composition Effect**. It's precise.
      *   *Boundary:* The boundary is **Counterfactual Stability**. If we risk-adjust the post-period population to the pre-period mix, does the improvement hold?
      *   *Auditor Defense:* You need to show the "Expected Rate" vs "Observed Rate."

  5.  **Finalizing the Advice:**

      *   **Name:** Admit no single proper noun exists. Offer "Success-Induced Composition Effect."
      *   **Distinction:** Clarify Simpson's (weighting of existing groups) vs. This (creation/expansion of groups).
      *   **Boundary:** Use **Direct Standardization**. If the standardized rate improves, the program worked. If the crude rate worsens, the population got sicker/harder. Both can be true.
      *   **Which number to report?** Depends on the question. "Did the clinic work?" -> Risk-adjusted. "Is the county healthier?" -> Crude.
      *   **The "Crowding Out" Edge:** Check the *original* subgroups. Did the "easy" patients get worse because resources shifted to "hard" patients? If so, that's real failure (opportunity cost).

  6.  **Tone:** Professional, respectful of their expertise (they clearly know their stuff), precise, actionable for a state auditor context.

  7.  **Structure:**
      1.  Direct Answer on Naming (The "No, but..." section).
      2.  Proposed Terminology (The "Coining" section).
      3.  The Boundaries & Decision Framework (The "Edges" section).
      4.  Practical Reporting Guidance (The "Auditor" section).

  *(Self-Correction during drafting)*: I need to be careful not to dismiss Simpson's too hard. Statistically, it *is* a reversal of association due to a confounding variable (time-period correlated with case-mix). But the *causal* story is what makes it distinct. I will validate their intuition that standard Simpson's explanations don't fit the *causal* narrative of "intervention success."

  *Refining the "Coining":* "The Reach-Intensity Trade-off" is good policy language. "Success-Induced Composition Bias" is good statistical language. Let's offer **The Success-Induced Composition Effect (SICE)** as the formal term, but mention **Denominator Expansion** as the mechanism.

  *Refining the "Boundary":* The critical test is **Decomposition Analysis** (Oaxaca-Blinder style). Separate the change due to *coefficients* (program efficacy) vs. *endowments* (population mix).

