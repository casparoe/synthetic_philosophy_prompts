  Ilse leaned against the brickwork. The accordion started up, a wheezing polka.

  "They cheered the manager," Ilse said. "When he resigned on principle. You know he was made redundant in the book. You know the workers were the focus."

  "They cheered the closure," Nora said. "They needed to see it land. They needed to see the end of the thing. They needed to know it was real."

  "They saw a man keep his dignity. The workers were a chorus. The man who signed the papers got the arc. The people who lost their livelihoods got a song. You gave the villain the soul."

  "The book wasn't a chorus. You read the drafts. You know the inside of that fitter's head. You know the specific weight of his tools. You know the silence in the kitchen."

  "I know what you wrote in private. I'm talking about what they bought tonight. A performance has one law. It must please the people paying for the seat. If it corrects them, they don't come back. If it reforms them, the house closes. You cannot teach the hand that feeds you."

  "That's economics. Not form. The art itself isn't bound by the box office. The text stands apart."

  "It becomes form. The nightly box office demands a nightly applause. You get pity, but it's pity discharged. They weep, they feel virtuous, the debt is settled. They go home having done nothing. They have paid to feel good about their own sadness."

  "A book sits on a shelf for a fortnight. It's not a night out. It's not a transaction repeated. It's a private conversation. It happens in the head."

  "You took the adaptation deal."

  Nora looked at the cinema doors. The glass reflected the crowd. "I did."

  "And the ending changed. The manager resigned. In the book, he was fired. You sold the principle."

  "The advance paid my mortgage. The film gave the closure a shape. People are grieving publicly instead of calling it personal failure. They needed a vessel. They needed to see it on a screen."

  "Because the spectacle gave them permission. But look at the comedy of it. The articulate wrongdoer gets the inner life. The stubborn man becomes the joke. The accommodating man is admirable. You rendered the manager persuasively. You recommended him. You made him safe to love."

  "I rendered him human. I didn't make him a villain. He had a quota. He had a family."

  "You rendered him safe. That is the law. The performer's trade is duplication. You stand on a festival stage, you sell the same commodity as the actor. You are trading in the opinion of strangers. You are selling yourself."

  "I'm standing in a square. I'm smoking a cigarette. I'm not on a stage. I'm not selling tickets."

  "And you are watching them watch you. That is the trade. You are measuring their reaction. You are estimating their worth. You are counting the applause."

  "Most of what is streamed is flattery. We agree on that. The algorithm feeds the bias. It gives them what they want. It keeps them watching."

  "The algorithm is just the box office sped up. But you think the book is different because it's quiet. Because it's alone. Because it's slow."

  "Because it's particular. A book supplies the inside of a person you will never meet. No poster matches that duration. No speech supplies a case rather than a type. It forces a duration no petition can match. It holds you there."

  "You say type. I say crowd. I ran a gathering in '14. No stage. No microphones. People brought food. They sang together. The crowd was the spectacle. No performers, no audience. Just a festival. It was concrete. It was not nostalgia. It was here."

  "That was a party. It wasn't policy. It didn't change the council vote."

  "It was politics. No one paid to be told how to feel. No one went home having settled a debt. They stayed because they were part of the thing. They were the thing. There was no separation. No one was watching."

  "You can't scale that. You can't put that in a cinema. You can't put that in a book."

  "You can't scale truth either. But you defend the form by ignoring the cost. Rousseau wrote that letter against the stage. Then he wrote a novel. One of the most tear-producing books of his century. He prefaced it with a dialogue arguing over its usefulness. He let his readers weep."

  Ilse lit another cigarette. The flame shook in the wind. "He knew the danger. He knew the book was different. He knew the risk."

  "Then either his practice contradicts his theory, or his theory permits a form he refused the stage. His objection isn't about representation. It's about the house. It's about the ticket. It's about the payment."

  "It's about the payment. If you must please, you cannot turn on the audience. You cannot bite the hand that buys the ticket. You cannot make them uncomfortable enough to act. You cannot break the glass."

  "A book is bought once. The reader is alone. They can be uncomfortable in private. They can close the book. They can think."

  "But you are here. Selling the book with the film. You are harvesting this square. You are looking at them. You are taking notes."

  "I am not harvesting. I am standing here. I am talking to you."

  "You are noting it. The way the light hits the petition. The way the woman cries. You are doing the trade. Duplication. Esteem. You are making them material. You are making them words."

  "I write about what happens. If I don't, it disappears. If I don't, no one knows."

  "You make it material. You are turning them into a scene. You are proving my point while you argue against it. The form that must please cannot turn on its audience. But you are turning them into content. You are doing exactly what I said. You are using them."

  "I refuse the abstention conclusion. If I don't write it, someone else will. Someone who won't care about the fitter. Someone who will make them a joke. Someone who will make them statistics."

  "Then you concede the diagnosis. You admit the pressure. You admit the trade. You admit the house."

  "I concede the pressure. I don't concede the silence. I won't leave the field to the flatterers. I won't leave them to the algorithm."

  "Then you are working for the house. You are keeping the seats warm. You are keeping them soft. You are keeping them ready."

  "I'm working for the reader. The one who reads alone. The one who stays up late. The one who thinks."

  "The reader is the audience. They are the same person. They want to be pleased. They want to feel. They want to weep."

  "The reader is alone. They can change. They can think. They can act. They can burn the factory."

  "Until they come out here. Until they seek the crowd. Until they want to be told they are right. Until they want the pity. Until they want the discharge."

  Nora watched the petition circle back. The man with the clipboard was laughing now. He showed a signature to his friend. He asked Nora for a line for the local paper. She gave him a sentence about resilience. He thanked her and moved to the accordion player. The subject hung in the air.

  "If I stop," Nora said, "the silence wins. The factory stays closed. The story stays theirs. The truth stays hidden."

  "If you continue," Ilse said, "the spectacle wins. You are making them comfortable with their own pity. You are giving them a place to put the grief so they don't have to carry it. You are letting them off."

  "I am making them see the manager was not a villain. He was a man with a quota. I am making them see the workers were not victims. They were men. They were fathers."

  "And now they love him. They weep for him. They do not burn the factory. They sign the paper. They go home. They have done their duty. They have paid."

  "They go home with a signature. They have acted. They have signed. They have joined."

  "They go home with a discharge. They have wept. They are clean. They are settled. They are done."

  Nora looked at her hands. She was holding the cigarette like a prop. She realized she was measuring the distance between the accordion and the crowd for a description later. She caught herself. She put the cigarette out.

  "I see what I'm doing," Nora said. "I am using the square. I am using the grief. I am using the light. I am making it mine."

  "Do you?" Ilse asked. "Do you see the trade? Do you see the house?"

  "I am turning them into a scene. I am doing the trade. I am selling the esteem. I am duplicating the moment. I am making them material."

  "That is the law. You cannot escape the house. You cannot escape the payment. You cannot escape the pleasing."

  "I will not stop. But I see the cost. I see the pressure. I see the pleasing. I see the limit. I see the wall."

  "Then you see the house. You see the limit. You see the wall. You see the end."

  "I see the reader. Even if the reader is a fiction. Even if the reader is me. Even if the reader is you."

  "The reader is the paying seat. And you must please them. You must keep them coming. You must keep them happy."

  "I must reach them. I must reach the one who stays. I must reach the one who thinks. I must reach the one who acts."

  "You must keep them soft. You must keep them weeping. You must keep them here. You must keep them paying."

  "We will see who reads it. We will see who stays. We will see who acts. We will see who burns."

  "We will see who pays. We will see who claps. We will see who goes home. We will see who sleeps."

  Nora dropped the cigarette. The accordion finished the song. The crowd clapped. The sound was loud. It filled the square.

  "They are clapping the closure," Ilse said. "They are clapping the end. They are clapping the finish."

  "They are clapping the gathering," Nora said. "They are clapping the start. They are clapping the beginning."

  "They are clapping themselves. And you are selling them the ticket. You are selling them the seat. You are selling them the show. You are selling them the house."

  "I am writing the record. I am writing the truth. I am writing the man. I am writing the worker."

  "You are writing the flattery. You are writing the comfort. You are writing the discharge. You are writing the sleep."

  "We will see who reads it."

  "We will see who pays."

  **Note on the Scene**

  Ilse's thesis regarding the economic pressure shaping form (thesis i) held up best; Nora concedes the adaptation deal altered the ending, validating the claim that public art must please its paymasters. Thesis v (the festival) was the hardest to sustain without sounding nostalgic, so I grounded it in a specific civic assembly Ilse ran, though Nora rightly challenges its scalability. The strongest unused reply for Nora would be to argue that discomfort *sells* in niche markets (misery memoirs), complicating Ilse's "pleasing" axiom. For Ilse, she could have pressed harder on the *duration* of reading being merely delayed gratification rather than true individuation.

  The disagreement is substantive, not verbal. They mean different things by "moved": Ilse sees emotional discharge as political neutralization, while Nora sees it as the prerequisite for empathy. However, they converge on the corruption of the celebrity economy. To make Ilse win outright, Nora would need to abandon the project entirely, acknowledging that writing about the square *is* the exploitation Ilse predicts. Instead, Nora accepts the diagnosis but rejects the abstention, maintaining the novel's necessity despite the corruption.
