      ├── **A shared neural cause fixes the reference** → **LEAF: Common Cause View**
      │   │   *Standard Name:* Common Cause View (or Tracking View)
      │   │   *Awkward Commitment:* Posits a systematic coincidence between experience and report mediated by a third factor.
      │
      ├── **Direct acquaintance fixes the reference** → **CELL UNOCCUPIED**
      │   │   *Status:* Incoherent/Unexplored
      │   │   *Reason:* Acquaintance typically implies a causal or constitutive relation; without causation in this setup, it collapses into brute coincidence.
      │
      └── **Nothing / It's brute** → **LEAF: Bullet-biting Epiphenomenalism**
          │   *Standard Name:* Epiphenomenalism
          │   *Awkward Commitment:* Accepts we can know about experiences that causally cannot affect our knowledge.

  ***

  **UNOCCUPIED LOGICAL SPACE**

  | View Description | Status | Reason |
  | :--- | :--- | :--- |
  | **Non-Physical + Veridical + Acquaintance (No Causation)** | Unoccupied | Incoherent | Acquaintance without causal contact is unintelligible in a naturalistic framework; collapses into Epiphenomenalism. |
  | **Physical + Non-Veridical** | Unoccupied | Unattractive | Error theory about physical brain states is less parsimonious than Illusionism about experiences. |
  | **Non-Physical + Causal Contact** | Occupied | N/A | This is Interactionist Dualism (Q1: YES). |
  | **Non-Physical + No Causation + Divine Harmony** | Unoccupied | Unexplored | Functionally identical to Common Cause View but posits God instead of neural cause; rarely defended separately. |

  **COLLAPSING VIEWS**

  | Pair of Leaves | Reason for Collapse |
  | :--- | :--- |
  | **Bullet-biting Epiphenomenalism** & **Pre-established Harmony** | Both rely on a brute correlation between experience and report without causal linkage; the only difference is whether the correlation is labeled "cosmic coincidence" or "harmonized by initial conditions." |
  | **Common Cause View** & **Non-Reductive Physicalism** | If the "shared cause" is physical and the experience is physical, the distinction between "tracking via common cause" and "causing via distinct property" becomes merely verbal depending on one's theory of causation. |
