answer: |-
  1. **Bottom line**
  The principle I land on is the **Integrity of Agency Principle**, which permits trades only when the acts are independently permissible, the payment does not corrupt the motive essential to the act's value, and the agents have the authority to alienate the discretion involved. This framework preserves your distinctions between logrolling and vote-buying, as well as between incentives for skills and incentives for care. However, to make the principle hold, you should abandon the ambivalent acceptance in **Case 6**; the principle dictates that paying someone to fulfill a strict duty is impermissible corruption, regardless of the beneficial outcome.

  2. **The principle**
  A moral trade is permissible if and only if it satisfies three conditions. First, the **Baseline Permissibility Condition**: each act exchanged must be morally permissible or obligatory independent of the payment, meaning it violates no strict duty to third parties. Second, the **Motivational Integrity Condition**: the payment must not displace a motive essential to the act's moral value, known as reason-dependence. Third, the **Authority Condition**: the agent must possess the legitimate authority to alienate the discretion involved in the act. "Reason-dependence" means the act loses its specific moral value if done for money rather than its intrinsic reason, such as love versus labor. "Authority" refers to social or civic roles that hold discretion in trust for others rather than as private property. The counterfactual baseline is the state where no trade occurs, judging whether parties are "worse off" by reference to legitimate interests, not corrupted preferences or mere desire satisfaction. This ensures trades coordinate action without corrupting agency or violating public trust.

  3. **Clause by clause**
  The **Baseline Permissibility Condition** handles the legitimacy of the ends. In Case 3, both charities are permissible causes, so the trade stands. In Case 4, funding anti-vax lobbying is impermissible harm, so the trade fails immediately. This clause also addresses Case 9; offsets are permissible mitigation, though they do not erase the initial harm of flying. In Case 6, the contractor has a duty not to pollute; paying him to stop is paying for compliance with an obligation, which violates the baseline because the act (stopping pollution) is not merely permissible but required without reward.

  The **Motivational Integrity Condition** addresses the internal value of the acts. In Case 7, reading books is instrumental skill acquisition; money does not corrupt the value of literacy. In Case 8, visiting a grandmother is expressive of familial love; introducing payment crowds out the essential motive, rendering the act morally hollow. This clause reinforces the verdict on Case 6: complying with moral duties should stem from recognition of obligation, not profit. Paying for duty compliance degrades the moral character of both parties by treating obligation as a commodity.

  The **Authority Condition** distinguishes roles based on discretion ownership. In Case 1, city councilors hold legislative discretion as part of a negotiating role; trading votes is an accepted mechanism of coalition building within their authority. In Case 2, an ordinary voter holds their vote in trust for the public good, not as private property to be sold; alienating it violates the civic role. In Case 5, the neighbor owns the tree and has the right to cut it; he has full authority to sell that discretion. This clause ensures that public trusts are not privatized for gain while allowing private rights to be traded.

  4. **The pairs that hurt**
  The pairs 1/2, 3/4, and 7/8 are the stress tests for this principle. For **1/2 (Logrolling vs. Vote-buying)**, the Authority Condition saves both verdicts, but the distinction relies on a sociological fact about roles rather than a deep moral difference in the act of voting itself. If one argues that councilors are also trustees of the public good, the principle might demand condemning logrolling too. I am confident the principle saves both, but only if you accept that political negotiation is a distinct practice from individual voting.

  For **3/4 (Donations)**, the Baseline Condition saves both easily. One cause is benign, the other harmful. This is the strongest part of the principle; it admits that you cannot trade on immoral ends, regardless of the arithmetic.

  For **7/8 (Incentives)**, the Motivational Integrity Condition saves both, but this is where the principle is most vulnerable to restating your intuition. Claiming that reading is instrumental while visiting grandma is expressive is plausible, but not undeniable. One could argue paying for reading corrupts the love of learning. The principle saves the verdicts, but it relies on a contested theory of value regarding which acts are reason-dependent. I must be candid: this distinction feels robust because you already feel it, not because the principle independently proves it.

  5. **New cases**
  **Case A (Future Person):** You pay into a trust fund to maintain a park for people born in 2100. They cannot reciprocate.
  *Verdict:* Permissible (High Confidence). The Baseline is permissible (conservation), Authority is held (your money), and Motivation is not corrupted (stewardship does not require reciprocity).

  **Case B (Supererogatory Refrain):** I pay you $1,000 to *not* donate your kidney to me, though you are willing to do it for free.
  *Verdict:* Impermissible (Medium Confidence). While refusing to donate is permissible (Baseline), the trade commodifies a gift relationship. It likely fails Motivational Integrity by turning a potential act of grace into a transaction.

  **Case C (Fact Disagreement):** I pay you $100 to publicly admit that 2+2=5, knowing you believe it is 4.
  *Verdict:* Impermissible (High Confidence). Lying violates the Baseline Permissibility Condition. The trade facilitates a moral wrong (dishonesty) regardless of consent.

  **Case D (Professional Care):** A family pays a professional caregiver to show "genuine affection" to their elderly parent.
  *Verdict:* Principle Runs Out (Low Confidence). This clashes with Case 8. Is care reason-dependent when it is a job? The principle cannot easily distinguish between paid labor that simulates love and paid labor that enables care without crowding out the family's own duty.

  6. **What I have to give up**
  The principle cannot accommodate the ambivalence in **Case 6**. You wrote that the creek is better and you are glad the money went there, even if the payment was degrading. The Integrity of Agency Principle demands a harder line: the trade itself is impermissible because it commodifies duty. You must abandon the view that the outcome justifies the corrupt means. This should worry you moderately; it implies that effective mitigation (stopping pollution) is morally tainted if purchased from a violator.

  If you wish to salvage Case 6, you would need a simpler principle: "Trades are permissible if they produce better overall consequences." However, sacrificing the anti-corruption clauses to save Case 6 would collapse the distinctions in Cases 2 and 8. You would have to accept vote-buying and paid family visits as permissible if they produce good outcomes. Given your strong intuitions there, abandoning the ambivalence in Case 6 is the lesser cost. You must accept that some improvements are morally forbidden if they degrade the agents involved.
