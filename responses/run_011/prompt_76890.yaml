  ### Diagnosis: A Clash of Explananda Reinforced by Evidential Standards

  Your working hypothesis is correct but incomplete. The primary driver of this disagreement is a **dispute over which *explanandum* is the target** (Selection vs. Stability vs. Inertia), but this is inextricably bound to a **clash of evidential standards** and a deeper divergence in **bedrock intuitions about agent cognition**.

  It is not merely a verbal dispute. If it were, you could agree on the facts and simply assign different labels. Instead, each position treats a *necessary condition* as the *sufficient cause*, leading them to discount the evidence privileged by the others.

  1.  **Explananda:** As you noted, Position A explains **Selection** ("why this regularity rather than the rival"), Position B explains **Maintenance** ("what keeps an individual member compliant"), and Position C explains **Inertia** ("why the regularity resists change").
      *   *Evidence:* A cites the migration history ("salient precedent plus an announcement"). B cites the rejection mechanism ("rejection counts appear in reports"). C cites the tooling ("templates, scripts, and downstream tooling were built around the format").
  2.  **Evidential Standards:** Because they target different explananda, they validate different data.
      *   *Evidence:* A treats the survey ("stated conditional preferences") as revealing a disposition. B treats it as "post-hoc rationalizations" and privileges behavioral traces ("rejection counts," "conformity where the coordination problem is absent"). C dismisses both interview and survey data as "contaminated," privileging material constraints ("sustained by software").
  3.  **Bedrock Intuitions:** Underlying the evidential clash is a disagreement about the agents.
      *   *Evidence:* A attributes high-level recursive belief ("mutual belief enough," "expectations"). B attributes social anxiety ("unease," "fear of standing out"). C attributes minimal cognition, viewing agents as friction-minimizers ("imitation is the cheapest individual path").

  **Verdict:** The disagreement is primarily over **Explananda**, which licenses the incompatible **Evidential Standards**. Progress requires an intervention that decouples the three causal mechanisms (Coordination, Sanction, Friction) to see which one sustains the regularity when the others are removed.

  ---

  ### Intervention Design: The 2x2 Factorial Pilot

  To resolve this, you must run a controlled pilot that orthogonally varies **Technical Friction** and **Social Sanction**, while holding **Coordination Payoff** constant.

  **Design:**
  Select 20 laboratories (half the consortium) for a 6-month pilot regarding a specific, arbitrary data field (e.g., a non-critical metadata tag). Randomly assign them to four conditions:

  1.  **High Friction / High Sanction (Control):** Standard validation script (rejects non-compliance) + Compliance reported to Steering Committee.
  2.  **Low Friction / High Sanction:** Validation script disabled (accepts all formats) + **Local conversion tools provided** (makes deviation effortless) + Compliance reported to Steering Committee.
  3.  **High Friction / Low Sanction:** Standard validation script + Compliance **hidden** from Steering Committee reports.
  4.  **Low Friction / Low Sanction:** Validation script disabled + Local conversion tools provided + Compliance **hidden** from Steering Committee reports.

  *Constraint:* In all conditions, the data remains shared in the central repository, preserving the coordination payoff (Position A's condition).

  **Measure:** The rate of deviation from the standard format in submitted data.

  ### Predictions and Falsification Conditions

  | Position | Prediction | Falsification Condition |
  | :--- | :--- | :--- |
  | **A (Convention)** | **Compliance remains high in all four cells.** <br>Since the coordination equilibrium holds (data is still shared), members will conform regardless of friction or sanction. The script and reports are downstream of the equilibrium. | If deviation rates rise significantly in *any* cell where Coordination is held constant. This would prove the equilibrium is not self-sustaining without external props. |
  | **B (Norm/Sanction)** | **Compliance drops in Low Sanction cells (3 & 4).** <br>Compliance is driven by the "unease" and reputational risk of the Steering Committee reports. If reports are hidden, the social cost vanishes, and deviation occurs. Friction is secondary. | If compliance remains high in Cell 3 (High Friction / Low Sanction). This would suggest technical constraints, not social fear, are doing the work. |
  | **C (Infrastructure)** | **Compliance drops in Low Friction cells (2 & 4).** <br>Compliance is driven by the "hours lost" fighting templates and scripts. If tools make deviation effortless, actors optimize for the "cleaner standard." Sanction is secondary. | If compliance remains high in Cell 2 (Low Friction / High Sanction). This would suggest social fear, not technical friction, is doing the work. |

  ### Path to Progress

  **Scenario 1: Clear Victory.**
  If the data shows high compliance *only* in Cell 1 and deviation in 2, 3, and 4, then **both B and C are partially right**, and **A is falsified**. The regularity is not a Lewisian convention; it is a hybrid of technical lock-in and social norm.
  *   *Progress:* Abandon the term "Convention" for this case. Adopt a composite term (e.g., "Infrastructural Norm").

  **Scenario 2: Mixed Results (Most Likely).**
  If deviation is highest in Cell 4 (Low/Low), moderate in 2 and 3, and lowest in 1, it indicates that **all three mechanisms contribute**.
  *   *Progress:* This confirms your suspicion that the positions are answering different questions. You should **split the terminology**.
      *   Reserve **'Convention'** (Position A) for regularities that persist in Cell 4 (Low Friction/Low Sanction).
      *   Use **'Norm'** (Position B) for regularities that collapse specifically when Sanction is removed (Cell 3 vs 1).
      *   Use **'Lock-in'** (Position C) for regularities that collapse specifically when Friction is removed (Cell 2 vs 1).

  **Scenario 3: No Intervention Works.**
  If you cannot implement the "Low Friction" condition (because downstream tooling is too entangled to patch for a pilot) or the "Low Sanction" condition (because the Steering Committee refuses to hide data), then the variables are **causally confounded** in practice.
  *   *Progress:* If the variables cannot be decoupled empirically, the question is **ill-posed** as a singular classification problem. You must conclude that in this consortium, convention, norm, and infrastructure have co-evolved into a single institutional fact. The research output should not be a verdict on "what this is," but a model of how these three layers reinforce each other to produce stability.

  **Recommendation:** Proceed with the **2x2 Factorial Pilot**. It is the only design that forces Positions A, B, and C to make distinct, risky predictions about the *same* behavior under *controlled* conditions. If the consortium refuses the pilot (e.g., Steering Committee won't hide reports), that refusal itself is data supporting Position B (the sanction is real and protected) or Position C (the infrastructure is too brittle to test).
