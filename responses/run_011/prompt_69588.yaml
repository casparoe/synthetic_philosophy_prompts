  1. **Bottom line**
  The debate over M hinges on conflating two distinct requirements for group selection. Demand (A) requires the group to bear a group-level trait and possess group-level fitness, per Sober and Okasha. Demand (B) requires the group to be a reproducer in the developmental sense, per Griesemer and Godfrey-Smith. In M, the fragmentation route satisfies material overlap (B) but fails the bottleneck condition (B), while the larval route satisfies the bottleneck (B) but fails to reproduce the mat as a unit (A/B). Consequently, M is not a genuine MLS2 case. While mats exhibit group-level fitness effects, they lack the consistent life-cycle closure required to be units of selection in their own right. The verdict is negative: M represents a complex MLS1 scenario where group-level effects modulate individual fitness, rather than an MLS2 hierarchy where groups themselves evolve.

  2. **Two criteria, not one**
  To separate these demands, we must distinguish statistical fitness from developmental reproduction. Sober defines a group-level trait as one where the group's character affects fitness over and above the sum of individual contributions, unlike an aggregate trait like mean zooid size. In M, margin defense density is a candidate group trait, whereas average zooid growth rate is aggregate. Okasha formalizes this as MLS2, where groups vary in fitness and produce offspring groups, contrasting with MLS1, where groups are merely containers for individual selection and only individuals reproduce. In MLS1, group fitness is derivative; in MLS2, it is fundamental. However, having group-level fitness does not guarantee the group is a reproducer. Griesemer argues reproduction requires material overlap: the offspring must develop from physical parts of the parent, ensuring continuity beyond mere copying. Godfrey-Smith adds the bottleneck condition: a reduction to a single cell or small unit that resets developmental noise and re-individuates the lineage. This bottleneck is crucial for distinguishing a new individual from a mere continuation of the old one. Reproduction in this developmental sense is stricter than heritable variation in fitness because it demands physical continuity and individuation, not just statistical correlation between parent and offspring properties. For M to be an MLS2 unit, it must meet both the statistical demand of Okasha regarding trait inheritance and the developmental demand of Godfrey-Smith regarding life-cycle closure. Without both, the "group" remains a transient collection rather than an evolutionary individual. In M, the tension arises because the mechanisms generating fitness variance differ from the mechanisms generating continuity. One can have heritability without reproduction if information is copied without material transfer, but Griesemer insists on material transfer for biological reproduction. Conversely, one can have material transfer without heritability if the structure is not preserved. Okasha's MLS2 requires the group to be the parent; Godfrey-Smith requires the group to be an individual. These are not identical. A group can have fitness (A) without being a reproducer (B) if it influences individual survival without propagating its own structure. Conversely, a group can propagate material (B) without having distinct fitness (A) if it is merely a vegetative extension. The M case exploits this gap: its life cycle splits the statistical properties from the developmental properties.

  3. **The fragmentation route**
  Consider the fragmentation route. Here, a piece of the mat margin breaks off and grows. This satisfies Griesemer's material overlap: the new mat is literally composed of tissue from the parent mat. However, it fails Godfrey-Smith's bottleneck condition. There is no reduction to a single cell; the fragment is a large, chimeric sample of the parent's margin. Because the parent mat is a genetic mosaic resulting from fusion, the fragment inherits a specific, unreset subset of genotypes. It is unclear whether this founds a new mat or merely extends the old one. Without a bottleneck, within-mat selection—the takeover by faster-budding genotypes—is not reset. Consequently, group-level features like margin defense density are not reliably transmitted as distinct characters but rather persist as continuous structural states. The fragment does not emerge as a re-individuated unit with a fresh developmental trajectory; it is a continuing process. Furthermore, because the mat's genotype composition changes over time as internal genotypes compete, the "parent" is a moving target. The fragment captures a spatial snapshot, not a reconstructed whole. If the margin differs from the interior, the offspring differs from the parent average, violating the fidelity required for group-level selection. Thus, while fragmentation provides material continuity, it lacks the individuation required for the mat to function as a discrete reproducer in the MLS2 sense. It looks more like somatic growth than reproduction. This ambiguity prevents us from assigning a clear fitness value to the mat as a parent. If the fragment is just growth, the fitness belongs to the zooids within it. If it is reproduction, the fitness belongs to the mat. The lack of a bottleneck leaves this ontologically unsettled.

  4. **The larval route**
  Now consider the larval route. Here, specialized zooids release gametes that form a single zygote. This satisfies the bottleneck condition: the new mat originates from a single cell, resetting genetic variance and developmental noise. However, it fails the demand that the mat reproduce as a mat. The parent entity in this transaction is not the mat, but the specific zooids contributing gametes. The mat itself dissolves or persists while the larva disperses. The new mat is founded by a single genotype, initially lacking the chimeric complexity of the parent. Therefore, mat-level features such as margin defense density cannot be inherited directly. These features emerge from the specific spatial arrangement of differentiated zooids within a chimeric tissue, a structure destroyed during sexual reproduction. The new mat must rebuild this structure from scratch based on genetic instructions, not structural inheritance. This is clearly MLS1: the zooids vary in fitness based on the mat's success, but the mat does not have fitness in the MLS2 sense because it does not produce offspring mats. The continuity runs through the genes and zooids, not the collective entity. The bottleneck re-individuates the genetic lineage, but it individuates a zooid lineage, not a mat lineage. Even if the larva carries genes for a propensity to fuse, the actual group composition is lost. The specific chimeric arrangement that generated the high fitness is lost. Thus, while there is heredity of genes, there is no heredity of the group structure. This confirms that while there is a bottleneck, it serves the genes, not the group. The mat is a vehicle for zooid reproduction, not a reproducer itself. The prompt notes mats vary in larval output tracking mat-level features. In this route, that variance affects zooid fitness, not mat fitness, because the mat does not persist as the parent of the next generation of mats.

  5. **Why the criteria come apart**
  The M case demonstrates that the criteria for selection levels come apart. A group can have group-level fitness (Demand A) without reproducing as a group (Demand B). In the larval route, mat properties affect fitness, but the mat does not reproduce. Conversely, a group can propagate with material overlap (Demand B) without passing on a group-level character reliably (Demand A). In fragmentation, material continues, but without a bottleneck, the "group" is not re-individuated, blurring the line between parent and offspring. The general moral is that "levels of selection" names two research questions, not one. The first asks where fitness variance is located (Okasha); the second asks where reproduction and individuation occur (Godfrey-Smith). For a unit of selection to exist, both must align. In M, they diverge. Which demand is primary? Reproduction (B) should be treated as primary for defining the *unit*, while fitness (A) defines the *process*. Without a reproducing unit, there is nothing for selection to act upon over generations. M fails to be an MLS2 unit because the mat never consistently occupies the role of parent in a life cycle. It is a transient vehicle, not an evolutionary individual. This implies that many putative cases of group selection are actually individual selection acting through complex developmental filters. We must not conflate the capacity to affect fitness with the capacity to evolve as a unit. M affects fitness but does not evolve as a mat. The divergence shows that group-level effects are necessary but not sufficient for group-level evolution. If we ignore B, we call any aggregate with fitness variance a unit, which dilutes the concept. If we ignore A, we have reproducers without selection. The M case shows why we need both. The fragmentation route looks like MLS2 but lacks the reset; the larval route looks like MLS1 but has group effects. This hybrid status is common in nature, suggesting MLS2 is rarer than thought.

  6. **What would settle it**
  To settle the classification, we need specific empirical facts. First, do fragments develop regulation back to a species-typical zooid ratio? If yes, this suggests a reset mechanism, pushing toward individuation. Second, is fusion assortative by genotype? If mats only fuse with clones, within-mat variance drops, making the mat more like a multicellular individual. Third, is margin defense density transmitted across fragmentation independent of genotype? If structural memory exists, it supports group-level inheritance. Specifically, if defense density is reconstructed rather than continued, that implies genetic encoding of group structure, supporting MLS2. Fourth, is there germ line sequestration? If some zooids cannot bud and only reproduce sexually, the conflict between zooid and mat fitness is reduced. Each fact pushes M closer to MLS2 if it increases group fidelity or reduces internal conflict. Without these, M remains a borderline case where the group is a selective environment, not a selected unit.
