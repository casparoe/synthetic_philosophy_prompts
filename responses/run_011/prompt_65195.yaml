answer: |-
  **Brainstorming Candidate Research Questions**

  1.  *Do neural machine translation systems possess world knowledge?* This is too broad; "possess" is ambiguous between storage and access, and "world knowledge" lacks a clear operational definition for testing.
  2.  *Is the performance of current neural systems robust under meaning-preserving perturbations?* This is empirically determinate but philosophically thin; it establishes a bug without necessarily implicating the nature of the system's competence.
  3.  *Does systematic surface-fragility entail a lack of understanding?* This risks being purely armchair; without a strict definition of fragility, it invites verbal dispute.
  4.  *Selected:* **To what extent does systematic surface-fragility under meaning-preserving perturbation indicate a reliance on form-matching rather than world-model deployment in neural translation systems?** I choose this because it bridges the empirical diagnostic (fragility) with the philosophical claim (deployment vs. form-matching), forcing the conceptual work to define "deployment" in terms of counterfactual stability rather than internal architecture.

  ***

  **Project Title:** Surface Fragility and the Depth of Translation Competence

  **1. Statement of the Question**
  The project asks whether systematic surface-fragility under meaning-preserving perturbation constitutes evidence that a translation system lacks deployed world knowledge. The question has a determinate answer because it separates the *quality* of the output from the *stability* of the capacity producing it. A competent critic could settle it by agreeing on a protocol for "meaning-preserving perturbation" (e.g., syntactic passivization, lexical substitution via WordNet synsets, pragmatic rephrasing) and measuring the variance in translation quality against these controls. If quality drops significantly despite semantic invariance in the source, the system is surface-fragile. The philosophical settlement rests on whether such fragility is incompatible with the definition of "deployed world knowledge" established in the conceptual phase.

  **2. Critique of Existing Camps and the Vacuity Worry**
  The debate is currently stalled between the "benchmark camp," which equates high scores on static test sets with competence, and the "world-model camp," which insists that without explicit symbolic reasoning, there is no understanding. Both leave the question open. The benchmark camp measures fit, not process; a system can achieve high BLEU scores by exploiting spurious surface correlations without modeling the world. The world-model camp often relies on apriori arguments about syntax vs. semantics that ignore the empirical success of neural networks.

  The central worry is that the claim "knowledge must be deployed, not just stored" is vacuous. If a system produces the right output, what difference does it make whether it "consulted" a world model? To make this non-vacuous, we must treat "deployment" as a counterfactual property: a system deploys knowledge only if its output remains stable when surface cues vary but worldly constraints remain constant. If the claim cannot be cashed out in terms of stability under perturbation, it is indeed merely verbal. This project treats the operationalization of "deployment" as the primary philosophical task, ensuring the thesis is falsifiable by empirical data rather than insulated from it.

  **3. Methodology (12 Months)**
  *Months 1–3 (Conceptual):* I will refine the definition of "surface-fragility" and "meaning-preserving perturbation." This involves distinguishing perturbations that change semantic content from those that merely change form. The deliverable is a philosophical framework linking counterfactual stability to the notion of "competence."
  *Months 4–8 (Empirical Diagnostic):* Working with a linguistics lab partner, I will design a diagnostic suite. We will generate pairs of source sentences that are semantically equivalent but surface-distinct. We will run these through standard neural translation APIs and measure variance in target quality using both automated metrics and human evaluation. The partner's role is crucial: they ensure the linguistic perturbations are truly meaning-preserving, preventing the confound where quality drops because the meaning actually changed.
  *Months 9–12 (Synthesis):* I will interpret the empirical results through the conceptual framework. If fragility is high, does this refute the claim that the system understands? If fragility is low, does Hofstadter's thesis collapse?
  *Why this approach?* Pure benchmarking ignores the *how*; pure armchair analysis ignores the *what*. This mixed method forces the philosophical claim to risk empirical refutation while ensuring the empirical test measures what matters philosophically.

  **4. Success, Failure, and Undecidability**
  A successful result demonstrates a strong correlation between surface-fragility and specific linguistic features (e.g., idioms, ambiguity resolution), supporting the view that current systems rely on shallow cues. A failure would show that modern systems are robust to perturbation, suggesting the "shallowness" thesis is empirically outdated. Crucially, if we find that "deployment" cannot be distinguished from "storage" even via stability tests, showing the question is empirically undecidable is itself a fundable philosophical result. It would clarify the limits of cognitive ascriptions to black-box systems, preventing future category mistakes in AI evaluation.

  **5. Scope Assessment**
  To finish in a year, I must cut cross-lingual breadth. The study will focus on one language pair (e.g., English-French) to ensure the linguistic partner can validate meaning-preservation rigorously. I will not train new models; I will use existing APIs to test current production systems. This limits claims about architecture but strengthens claims about the state of the art. The conceptual work will limit itself to "translation competence" rather than general AI understanding.

  **6. Justification for Philosophical Funding**
  Evaluation metrics are not theory-neutral; they presuppose an account of what translation is. Funding philosophy here ensures we are measuring the right phenomenon, not just measuring phenomena we already know how to count. Without conceptual clarity on "competence," additional evaluation runs merely accumulate data without advancing understanding.
