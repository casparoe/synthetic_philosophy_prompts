  # METAPHYSICS PhD SEQUENCE: FINAL EXAMINATION

  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question. Closed book.

  ***

  **Question 1**

  Consider the following stipulated case:
  Let $p$ and $q$ be metaphysically independent atomic facts.
  Let $D$ be the fact that $p \lor q$.
  Assume that full grounding is closed under disjunction introduction (i.e., if $p$ obtains, $\{p\}$ fully grounds $p \lor q$).
  Assume further that full grounding is irreflexive, asymmetric, and transitive.

  In this case, $\{p\}$ fully grounds $D$ and $\{q\}$ fully grounds $D$, while neither grounds the other.

  Write an essay addressing the following:
  1.  Which of the stated formal constraints (irreflexivity, asymmetry, transitivity), if any, does this case actually violate?
  2.  To rule out this instance of full overdetermination, what would have to be surrendered: the closure principle, the uniqueness of a fact's full ground, or the idea that grounding delivers non-redundant metaphysical explanation?
  3.  What does this case demonstrate about the viability of relevance-sensitive treatments of ground?

  ***

  # MODEL ANSWER

  The stipulated case presents a scenario of full grounding overdetermination: two distinct, independent facts, $p$ and $q$, each fully ground the disjunction $D$ ($p \lor q$). To evaluate this, we must distinguish between the structural constraints on the grounding relation and the metaphysical principles governing the nature of full ground.

  First, regarding the formal constraints, the case violates none of them. Irreflexivity holds because neither $p$, $q$, nor $D$ grounds itself. Asymmetry holds because while $p$ grounds $D$ and $q$ grounds $D$, $p$ does not ground $q$ (by stipulation of independence), nor does $D$ ground $p$ or $q$. Transitivity is similarly unviolated; there is no chain $x \prec y \prec z$ here that would imply a forbidden $x \prec z$. The structural logic of grounding remains intact because the overdetermination occurs at the level of inputs to a single output, not within a chain or loop. The tension is not structural but metaphysical.

  The core conflict arises between the Closure principle (disjunction introduction) and the conception of full ground as non-redundant. If $\{p\}$ fully grounds $D$, it provides a complete metaphysical explanation for $D$. If $\{q\}$ also fully grounds $D$, it too provides a complete explanation. If we accept both, we accept that $D$ has two distinct full grounds. This violates the **uniqueness of a fact's full ground**. Furthermore, it challenges the idea that grounding delivers **non-redundant metaphysical explanation**. If $\{p, q\}$ jointly obtain, and both are cited as grounds, the explanation contains redundancy: citing $q$ adds nothing to the explanation provided by $p$, yet both are claimed to be "full" grounds individually.

  To rule out this overdetermination, one must surrender either Closure or Non-Redundancy/Uniqueness.
  If we surrender **Non-Redundancy/Uniqueness**, we accept that a fact can have multiple, distinct full grounds. This treats grounding like causation, where overdetermination (e.g., two assassins shooting simultaneously) is often deemed metaphysically possible. However, many metaphysicians argue grounding differs from causation here; grounding is constitutive, not merely productive. Allowing full overdetermination suggests that the metaphysical structure of reality is less determinate than expected, as $D$'s existence is fully secured by either path without preference.

  If we surrender **Closure**, we deny that $\{p\}$ fully grounds $p \lor q$ simply in virtue of disjunction introduction. This is the preferred route for relevance-sensitive accounts. On this view, while $p$ logically entails $p \lor q$, it does not metaphysically explain it in full if $q$ is also available, or perhaps disjunctions are never fully grounded by a single disjunct alone. This preserves the intuition that full ground must be minimal and non-redundant. If $\{p\}$ is the ground, $\{q\}$ must be irrelevant. If both are present, neither might fully ground $D$ alone; rather, the situation might require a weak grounding relation or a specific selection mechanism.

  This case highlights the necessity of **relevance-sensitive treatments of ground**. Classical logical consequence is monotonic and permits disjunction introduction indiscriminately. If grounding mirrors classical consequence, overdetermination is inevitable for disjunctions. Relevance-sensitive accounts (such as Kit Fine's) restrict grounding to preserve explanatory relevance. They argue that for $\{p\}$ to fully ground $p \lor q$, $p$ must be the *relevant* truth-maker. If $q$ is also true, the relevance of $p$ might be compromised, or the full ground might be the conjunction $\{p, q\}$ rather than either individually. Thus, the case shows that without relevance constraints, the concept of "full ground" collapses into mere metaphysical necessitation, losing its distinctive explanatory power. To maintain grounding as a hyperintensional, explanatory relation, one must likely surrender Closure for full ground, restricting disjunction introduction to prevent redundant full grounds.

  In conclusion, the case violates no formal structural constraints but forces a choice between logical closure and explanatory non-redundancy. A robust theory of grounding should prioritize non-redundancy, surrendering unrestricted closure to preserve the uniqueness and relevance of metaphysical explanation.

  ***

  # MARKING SCHEME (Total: 25 Marks)

  **1. Formal Constraint Analysis (5 Marks)**
  *   **5 marks:** Correctly identifies that Irreflexivity, Asymmetry, and Transitivity are *not* violated. Explains clearly why (independence of $p$ and $q$ prevents asymmetry violations; no chains prevent transitivity violations).
  *   **3 marks:** Identifies no violation but offers weak justification, or incorrectly claims asymmetry is threatened.
  *   **0-1 marks:** Claims structural constraints are violated without justification.

  **2. Identification of Core Tension (5 Marks)**
  *   **5 marks:** Clearly identifies the conflict is between Closure (Disjunction Introduction) and Non-Redundancy/Uniqueness of Full Ground. Distinguishes "full" from "partial" implicitly or explicitly.
  *   **3 marks:** Identifies the conflict but conflates uniqueness with non-redundancy or fails to link it to the closure principle.
  *   **0-1 marks:** Fails to identify the relevant principles, focusing on truth conditions instead.

  **3. Evaluation of Surrender Options (10 Marks)**
  *   **8-10 marks (First Class):** Nuanced evaluation of surrendering Closure vs. Uniqueness. Discusses the implication of treating ground like cause (overdetermination benign vs. malignant). Argues for why Non-Redundancy is crucial for grounding specifically.
  *   **5-7 marks ( Upper Second):** Discusses both options but lacks depth on why one might be preferred. Treats the choice as merely pragmatic rather than conceptual.
  *   **2-4 marks (Lower Second):** Argues for one option without considering the cost. Assumes overdetermination is obviously impossible or obviously possible.
  *   **0-1 marks:** Fails to address the "what must be surrendered" prompt.

  **4. Relevance-Sensitive Treatments (5 Marks)**
  *   **5 marks:** Connects the surrender of Closure to relevance logic/sensitivity. Explains how relevance blocks redundant grounds (e.g., Fine's distinction).
  *   **3 marks:** Mentions relevance but fails to explain how it blocks the case (e.g., just says "relevance matters").
  *   **0-1 marks:** Irrelevant or incorrect discussion of relevance.

  ***

  # DIAGNOSTIC NOTES ON COMPETENT-BUT-MIDDLING ANSWERS

  1.  **Misidentifying the Violated Constraint:** Middling answers often instinctively feel that overdetermination is "wrong" and therefore search for a formal violation. They frequently claim Asymmetry is violated because "two things ground one," confusing asymmetry (no cycles) with uniqueness (one-to-one mapping). They fail to see that $p \prec D$ and $q \prec D$ is structurally permissible even if metaphysically suspect.
  2.  **The Causal Analogy Trap:** Competent students often argue that since causal overdetermination is possible (e.g., preemptive causation or simultaneous shots), grounding overdetermination should be accepted without surrendering anything. They fail to distinguish the constitutive nature of grounding from the productive nature of causation, missing the requirement to evaluate "non-redundant metaphysical explanation" specifically.
  3.  **Confusing Partial and Full Ground:** Many answers drift into discussing $\{p, q\}$ jointly grounding $D$ as a partial ground scenario. They fail to stick to the stipulation that $\{p\}$ *fully* grounds $D$ independently of $q$. This leads to incorrect solutions involving conjunction introduction rather than addressing the specific problem of *competing full grounds*.

  ***

  # CONFIDENCE ASSESSMENT

  I am **moderately confident** in the model answer's central verdict (that Closure must be surrendered to preserve Non-Redundancy), but I have significant reservations regarding the **stipulated Closure Principle**.

  **The Uncertain Step:** The exam question stipulates that "full grounding is closed under disjunction introduction." In standard contemporary ground-theoretic systems, particularly Kit Fine's logic of ground, this stipulation is **false** for *full* ground. Fine distinguishes between *weak* ground (which admits disjunction introduction) and *full* ground (which does not necessarily admit it, or requires relevance constraints). By stipulating Closure for *full* ground, the exam question forces a contradiction with the standard definition of full ground used in the literature the students are likely studying.

  While the model answer correctly identifies that maintaining coherence requires surrendering this stipulation (or uniqueness), a sophisticated student might challenge the exam premise itself, noting that standard systems do not license this closure for full ground. The model answer navigates this by treating the stipulation as a hypothesis to be tested against the concept of non-redundancy, but the tension arises because the stipulation is arguably conceptually incoherent within the dominant Finean framework. I am least sure whether a first-year PhD student should be expected to challenge the stipulation or work within it; the model answer chooses the latter path to ensure a constructive argument, but the former might be technically more accurate regarding the state of the art.
