prompt: |-
  So — my department runs this little summer fellowship, ten weeks and a stipend that rounds to zero, and the deliverable is a three-page proposal plus a talk at the end. I want to use it on risk-weighted expected utility theory, the Buchak-style setup where you get a separate risk function sitting alongside your utilities and probabilities and the weighting is applied to cumulative probabilities instead of to each outcome seperately. I came at all this from the rationalist side (way too many years of LessWrong-adjacent reading about whether you're permitted to be anything other than a straight EU maximizer), and the thing that won't let go of me is that the debate seems to have quietly turned into a fight about how you're allowed to carve up a decision problem, without anyone saying that out loud. My seed idea, tell me if it's bad: because the weights attach to cumulative probabilities, bundling changes verdicts — two independent Allais-type gambles that the theory says to take one at a time can come out differently if you treat the pair as a single act, and likewise a whole sequence of small favorable bets spread across a life. Thoma's argument presses exactly here, roughly: if you assume rational agents are guided by their attitudes toward temporally extended courses of action, then risk-weighting converges on EU's own recommendations in the long run, and if instead you get permissive about framing you lose the claim that the theory captures a steady disposition toward risk at all. So the question I want to work on is whether there's a principled criterion of act-individuation that tells you when risk-weighting is normatively licensed — candidates I've got so far being whether the agent gets another chance to decide later, whether the stakes are large relative to the agent's background portfolio, whether the states are repeatable, and whether the choice is one-shot and irreversible — or whether every such criterion either collapses the theory into EU, degenerates into a contextual rule that makes the verdicts framing-relative, or just smuggles the answer in through the back door.

  The reason I don't think this is an internal quibble, and the reason I want the proposal to make it explicit: the cases where the one-shot/no-rebundling criterion is *most* clearly satisfied are exactly the grand, irreversible, can't-hedge-it bets that the existential-risk crowd actually argues about, so depending on how the criterion comes out, risk-weighting is either the theory that matters most precisely where my people spend all their time or a theory that's licensed nowhere at all — those are very different results and the project should be able to say which one it's hoping for. I also have this nagging higher-order worry I'd like you to fold in as a side thread rather than a headline: nothing obviously stops you from having a risk function over your risk function, and if that regresses then there's a fixed point somewhere doing all the work, and maybe that fixed point is where the individuation answer is hiding. Write the proposal itself: state the question so that it has a determinate answer rather than being an invitation to survey a debate; explain why the existing positions (both the "risk attitudes are a genuine third normative parameter" side and the "this is just notational variance over probability weighting" side) leave it open; give the method, meaning what I would actually do week by week for ten weeks, including which concrete cases I'd run the candidate criteria against; say what a positive result looks like, what a negative one looks like, and what would count as the project having failed rather than merely stalled; and be honest about what makes ten weeks too ambitious and what I should cut first. Skip the bibliography entirely, I'll bolt citations on later myself.

  Then after the prose, give me a JSON object summarizing it so I can diff it against my own outline, with exactly these fields: `question` (one sentence, determinate), `why_open` (two sentences on why neither side settles it), `criteria_to_test` (array of objects, each with `criterion` and `failure_mode` — i.e. which of collapse, framing-relativity, or smuggling-in that criterion most threatens), `method_weeks` (array of objects with `week` and `milestone`), `test_cases` (array of short strings), `positive_result`, `negative_result`, `failure_criterion`, `scope_cut` (what goes first if I run out of time), and `biggest_worry` (one sentence).
