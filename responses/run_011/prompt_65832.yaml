answer: |-
  **Project Title:** Individuation and Risk: A Principled Criterion for Risk-Weighted Utility

  **1. The Research Question**
  Does there exist a principled criterion of act-individuation that preserves Risk-Weighted Expected Utility's (REU) distinct verdicts without collapsing into Expected Utility (EU) or succumbing to framing arbitrariness?

  **2. Motivation and Existing Debate**
  Risk-Weighted Expected Utility theory (Buchak) introduces a risk function alongside utilities and probabilities, weighting cumulative probabilities rather than outcomes. This allows the theory to capture risk-averse or risk-seeking attitudes as fundamental normative parameters, distinct from diminishing marginal utility. However, because weights attach to cumulative probabilities, REU is sensitive to how decision problems are individuated. Bundling independent gambles changes verdicts; treating a sequence of choices as a single act changes verdicts.

  The existing debate leaves this open on both sides. Proponents of REU argue that risk attitudes are a genuine third normative parameter, but they often lack a strict rule for when acts should be bundled, leaving the theory vulnerable to charges of framing relativity. Opponents (Thoma, Bronfman) argue that if rational agents are guided by attitudes toward temporally extended courses of action, REU converges on EU recommendations in the long run, implying REU is either redundant or irrational. Neither side provides a determinate criterion for when risk-weighting is normatively licensed versus when it is a framing error. This project seeks to resolve that gap.

  The stakes are non-trivial. If the criterion restricts REU to "grand, irreversible, can't-hedge-it bets," then REU is the critical theory for existential risk decision-making, precisely where my department's focus lies. If the criterion licenses REU nowhere, the theory is normatively inert. A side thread will investigate whether a fixed point in a hierarchy of risk functions (a risk function over your risk function) hides the individuation answer, though this will remain secondary to the primary criterion search.

  **3. Methodology and Timeline (10 Weeks)**
  *   **Weeks 1–2: Formalization and Literature.** Map the exact mathematical conditions under which REU diverges from EU in bundled vs. unbundled cases. Deep dive into Thoma's convergence argument and Buchak's defense of individuation.
  *   **Weeks 3–4: Candidate Criteria Development.** Formalize the four candidate criteria: (1) One-shot/irreversible vs. repeatable, (2) Stakes relative to background portfolio, (3) Opportunity to decide later, (4) State correlation.
  *   **Weeks 5–6: Case Testing.** Run the candidate criteria against concrete test cases (see below). Determine if any criterion consistently licenses REU verdicts without collapsing into EU.
  *   **Weeks 7–8: The Higher-Order Thread.** Explore the regression worry: if agents have risk attitudes toward their own risk functions, does a fixed point emerge that dictates individuation? Draft preliminary results on whether this solves or complicates the main question.
  *   **Weeks 9–10: Synthesis and Drafting.** Consolidate findings. Determine if the result is positive (a criterion exists), negative (no criterion works), or null (inconclusive). Write the final paper and prepare the fellowship talk.

  **4. Outcomes**
  *   **Positive Result:** Identification of a criterion (e.g., "irreversible high-stakes one-shots") that preserves REU verdicts in target cases (like x-risk) while forcing EU convergence in small-repeatable cases, without logical contradiction.
  *   **Negative Result:** Proof that all candidate criteria either force REU to match EU (collapse) or allow arbitrary framing to dictate verdicts (framing-relativity).
  *   **Failure Criterion:** The project fails if it merely catalogs the problem without evaluating the criteria, or if the "higher-order" thread consumes enough time to prevent a verdict on the main question. Stalling is acceptable; failing to evaluate the candidates is not.

  **5. Scope and Risks**
  Ten weeks is ambitious for a formal normative proof. The biggest risk is getting bogged down in the higher-order risk function regression. If time runs short, the higher-order thread will be cut entirely to preserve the evaluation of the four main individuation criteria. Additionally, if the "background portfolio" criterion requires complex economic modeling beyond scope, it will be simplified to a binary "large vs. small stake" distinction. The primary goal is a determinate answer on the existence of a principled criterion, not a complete reconstruction of decision theory.

