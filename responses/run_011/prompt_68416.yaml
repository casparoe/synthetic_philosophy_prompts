  Step (7) is the bad one.

  It looked innocent because the theorem's formal assumption is "independent votes," which intuitively suggests voters shouldn't talk. But statistically, independence means errors are uncorrelated *conditional on the state of the world*, not that voters are causally isolated. Step (7) conflates these. Deliberation and expert testimony can raise individual competence ($p$) without creating perfect correlation. If deliberation corrects biases, it increases $p$ significantly; CJT shows that an increase in $p$ can outweigh a decrease in effective $n$ caused by correlation. By demanding isolation, (7) sacrifices the very competence ($p$) that makes the theorem work in real-world conditions (Step 3).

  This saves the theorem. Condorcet remains worth using because it establishes the epistemic value of *aggregation*, not ignorance. It proves that reliability scales with numbers when $p > 0.5$. Its value lies in defending universal suffrage (Step 4), not anti-deliberative populism. You can accept expert input to boost $p$ while maintaining that the final aggregation must include everyone to maximize $n$.

  To reach your anti-epistocracy conclusion without (7), lean harder on (4). Epistocracy argues for excluding voters to raise average $p$. But CJT demonstrates that adding any voter with $p > 0.5$ increases group reliability, regardless of how high the existing average is. Unless experts are infallible ($p=1$), the reliability gain from adding millions of slightly competent voters outweighs the loss from excluding them to please a few experts. The epistocrat bears the burden of proving that excluded voters have $p < 0.5$ or that expert correlation is low enough to match the crowd's $n$.

  Thus, you can argue for a deliberative democracy where experts inform the public (raising $p$) but the whole electorate decides (maximizing $n$). This avoids the absurdity of (8) while retaining the mathematical force against epistocratic exclusion. The theorem doesn't require voters to be ignorant; it requires them to be numerous and better than chance. Deliberation helps them be better than chance; universal suffrage helps them be numerous. Combine these, and you defeat epistocracy without self-sabotage.
