  Second-year PhD student here, working on mechanistic anomaly detection, and my lab has a definitional fight that's blocking a methods section. Two camps. Structuralists: two systems instantiate the same mechanism iff their internal causal graphs match up under relabeling of components — what feeds into what, how many steps, where information gets combined — even if their behavior differs. Counterfactualists: identity is fixed by interventionist profile — same mechanism iff the piece in question would respond the same way to the same interventions on its inputs and produce the same downstream effects, no matter how it's wired internally.

