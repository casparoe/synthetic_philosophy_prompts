    {
      "crux": "Scope of Admissible Interventions",
      "why_settling_it_moves_someone": "If Counterfactualists admit internal node interventions as part of the 'profile', Case (a) collapses into agreement with Structuralists, as different circuits yield different internal intervention results.",
      "cheapest_test": "Perform internal ablation on the 'lookup' vs 'composition' models. If ablations yield different outputs, the interventionist profiles are distinct.",
      "what_each_side_gives_up_if_it_goes_against_them": "Counterfactualists give up the claim that wiring doesn't matter (since wiring dictates internal intervention results). Structuralists give up the claim that topology is the primary definition (accepting that functional disposition is the operational metric)."
    },
    {
      "crux": "System Boundary Definition",
      "why_settling_it_moves_someone": "Determines whether Case (d) is a mechanism change. If the 'mechanism' includes the scaffold, Counterfactualists win. If it is limited to weights, Structuralists win.",
      "cheapest_test": "Formalize the 'Audit Unit'. Is it the .pt file or the running process including environment?",
      "what_each_side_gives_up_if_it_goes_against_them": "Structuralists give up the portability of mechanism claims across deployments. Counterfactualists give up the ability to audit weights in isolation from deployment context."
    },
    {
      "crux": "Risk-Relevance of Topological Change without Behavioral Change",
      "why_settling_it_moves_someone": "Determines if Case (a) triggers a safety alert. If topological change alone is risky, Structuralists win. If only behavioral disposition matters, Counterfactualists win.",
      "cheapest_test": "Adversarial search for inputs that exploit the specific topological difference in Case (a) models.",
      "what_each_side_gives_up_if_it_goes_against_them": "Structuralists admit they flagged a false positive (safe change). Counterfactualists admit they missed a latent vulnerability (false negative)."
    }
  ]
  ```

  ### Verbal Dispute Analysis

  **Case (a) is the primary candidate for a purely verbal dispute**, conditional on the scope of interventions.

  **Why:**
  The disagreement rests entirely on the definition of the word "mechanism" rather than the state of the world. Both camps agree on the empirical facts: the weights are different, the graphs are non-isomorphic, and the input-output behavior on the task distribution is identical.
  *   The **Structuralist** defines "mechanism" as *algorithm*.
  *   The **Counterfactualist** defines "mechanism" as *function*.

  This is verbal because no experiment can resolve it without first agreeing on what we are trying to label. If we agree (per Claim 1) that "mechanism talk is for risk assessment," the dispute dissolves into an empirical question: *Does the topological difference in (a) correlate with risk?*
  *   If **yes** (e.g., the lookup table is vulnerable to a specific attack the composer isn't), then both should flag it, and the Counterfactualist must admit their intervention set was too narrow (see Crux 1).
  *   If **no** (the models are robustly equivalent), then flagging it is a false positive, and the Structuralist is prioritizing metaphysical purity over safety utility.

  Therefore, the argument is verbal *until* a threat model is specified. Once a threat model is specified (e.g., "We care about robustness to internal ablation"), the label "Same Mechanism" becomes irrelevant; the only question is "Same Risk Profile." The fight over the label is a proxy for the fight over which threat model to prioritize. Cases (b), (c), and (d) involve empirical disagreements about causal boundaries and dispositional stability that persist even after definitions are fixed. Case (a) disappears if definitions are aligned to the safety goal.
