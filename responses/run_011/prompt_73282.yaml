answer: |-
  # Joint Statement on Mechanistic Identity for Anomaly Detection

  ### Agreed Claims

  1.  **Teleological Primacy:** In the context of mechanistic anomaly detection (MAD), "mechanism" is not a metaphysical category but a risk-assessment tool. We are not asking "Are these the same?" in the abstract, but "Is the difference between these sufficient to invalidate our prior safety guarantees?"
  2.  **Interest-Relativity:** Mechanism identity is interest-relative. Two systems may instantiate the "same mechanism" relative to a threat model concerned with input-output robustness, but "different mechanisms" relative to a threat model concerned with internal gradient hacking or latent goal misgeneralization. We adopt a pluralist stance: identity is indexed to the *audit scope*.
  3.  **Convergent Evidence:** Structural isomorphism (graph matching) and counterfactual stability (interventional invariance) are mutually reinforcing evidence streams. A discrepancy in one demands investigation via the other. Neither is strictly privileged *a priori*; their weight depends on the audit scope defined in Claim 2.
  4.  **The Safety Precedence Rule:** In cases of definitional ambiguity where one interpretation flags a potential risk and the other does not, we default to the interpretation that flags the risk. We treat "mechanism change" as a warning label, not a binary truth value.
  5.  **Contextual Embedding:** A mechanism cannot be fully individuated without reference to its causal embedding. A sub-circuit's identity is partially constituted by how its outputs are consumed by downstream components. However, we distinguish between *intrinsic* mechanism properties (the sub-circuit itself) and *extrinsic* functional roles (how the system uses it).

  ### Residual Disagreements & Case Analysis

