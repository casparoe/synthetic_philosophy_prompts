  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **a** | **Equifinality:** Same task behavior, provably different circuits (lookup vs. composition). | "These are distinct mechanisms because the causal topology of the computation is non-isomorphic, regardless of output equivalence." | "These are the same mechanism relative to I/O interventions, as the dispositional profile over the task space is invariant." | **Verbal** (conditional on intervention scope) | Exhaustive intervention map on internal nodes; if internal interventions distinguish them, the I/O profile was insufficiently specified. | **Diff** (a), **Diff** (b), **Same** (c), **Same** (d) | **Same** (a), **Diff** (b), **Diff** (c), **Diff** (d) |
  | **b** | **Latent Rewiring:** Fine-tune leaves eval behavior identical but rewires circuit and shifts OOD behavior. | "This is a different mechanism because the internal graph structure has been altered, which explains the OOD shift." | "This is a different mechanism because the counterfactual profile has changed (revealed by OOD inputs), indicating a change in disposition." | **Genuine** (Empirical convergence) | OOD intervention suite; measuring the divergence point in the latent space during fine-tuning. | **Diff** | **Diff** |
  | **c** | **Contextual Reuse:** One circuit reused inside different surrounding modules (different functional roles). | "This is the same mechanism instantiated twice; the internal graph of the component remains isomorphic across contexts." | "This is a different mechanism because the downstream causal effects of the component's outputs differ by context, altering its interventionist profile." | **Genuine** (Level of abstraction) | Context-switching ablation studies; measuring the mutual information between the component's output and the final system loss in each context. | **Same** | **Diff** |
  | **d** | **Scaffold Shift:** Identical weights/arch, but model dropped into a different scaffold (doing something else). | "This is the same mechanism; the weights and internal connectivity define the mechanism, not the external API or prompt." | "This is a different mechanism because the system-level input/output mapping and causal role have fundamentally changed." | **Genuine** (System boundary) | Defining the system boundary: does the 'mechanism' include the token sampler and environment interface? | **Same** | **Diff** |

  ### Cruxes JSON

  ```json
