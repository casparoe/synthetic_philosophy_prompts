answer: |-
  Elias: You want to indict Vandara for genocide. But the prosecutor was right to decline. The Convention is a precise instrument, not a vessel for every moral outrage we feel. The protected groups are a closed list—national, ethnical, racial, religious. Political and social groups were excluded deliberately in 1948 because states refused to be scrutinized for how they managed internal dissent. The Kess are an ethnical group, yes, but the acts must match the intent. The intent must be to destroy the group physically or biologically. Tribunals have consistently read "destroy" as killing, causing serious harm, or preventing births. Here, no one is killed. No one is sterilized. Infant mortality is down. By the law's own metrics, the Kess are flourishing.

  Mara: They are flourishing as individuals while dying as a people. That is the distinction you are missing. A group is not an aggregate of bodies; it is a continuing collective way of life. If you remove the material base of that life—the grazing commons, the water rights—and then you sever the intergenerational transmission of language and custom by boarding the children, you have destroyed the group. The members survive, but the entity does not. The Convention's originator conceived of genocide as the destruction of a group's social pattern, not merely a body count. The 1948 narrowing was a political compromise, not a moral insight.

  Elias: It was the only compromise that produced a treaty. If we ignore that history, we break the tool. You rely on the transfer of children as the prohibited act. It is the only foothold you have. But even that requires specific intent to destroy the group as such. The state argues the intent is modernization, integration into the Vandaran citizenry. The leaked memo is damning, yes, but intent in law is inferred from conduct. If the conduct results in better health, higher literacy, and signed consent forms from every household, how do you prove the intent was destruction rather than assimilation?

  Mara: Consent signed under the deliberate removal of the means of subsistence is not consent. It is coercion. If you tell a household that refusing the town means their cattle die within a season, the signature is a artifact of duress. As for intent, the memo is explicit: within three generations, no Kess left as a distinct people. That is not integration; it is erasure. Integration implies the group persists within a larger whole. Erasure implies the group ceases to be. The law's focus on physical destruction assumes a group is only its living members. It ignores the temporal dimension—that a group exists across time.

  Elias: But if we accept that cultural dissolution equals genocide, where do we stop? You open the door to an inflation that renders the word useless. Compulsory national schooling has been the engine of state-building since the eighteenth century. France suppressed regional languages. The United States resettled nomadic peoples. Many of these projects improved material conditions while dissolving distinct collective lives. If Vandara is genocide, then much of the history of the modern nation-state is genocide. The word loses its diplomatic function. It becomes a synonym for "unjust assimilation," and then it condemns everything and nothing.

  Mara: That is a serious objection, but it assumes there is no line between assimilation and extinction. There is. The discriminating criterion is the combination of removing the material base of subsistence and severing intergenerational transmission with the specific intent of ensuring no future generation can reconstruct the life. Standard nation-building often seeks to change how a people live within the state. Vandara seeks to ensure the people do not exist as a reference point for future generations. It is the finality of the erasure. When the state acts to make it impossible for the group to reproduce its own identity, even if the individuals are healthy, that is the destruction of the group as such.

  Elias: You say the law leaves a moral residue. I say the classification of persecution and forcible transfer already condemns everything that happened here in the strongest terms the law possesses. These are crimes against humanity. They carry severe penalties. They acknowledge the systematic nature of the attack. What moral work is left undone by withholding the label of genocide? If we stretch the legal category to cover this, we risk weakening the conviction for the crimes that clearly fit the existing definition. We risk acquittals based on judicial pushback against overreach.

  Mara: The moral residue is the loss of a world. Crimes against humanity account for harms to individuals. They do not account for the loss of the collective entity itself. When the Kess cease to exist, something vanishes that is not reducible to the sum of individual sufferings. It is a unique perspective on the human experience, a specific way of being that will not return. The law should name that loss. By refusing to call it genocide, you tell the Kess that their death as a people is less significant than the death of their bodies. You validate the state's view that they are merely atoms to be rearranged.

  Elias: I am not validating the state. I am protecting the integrity of the category so it remains viable for cases where bodies are piled high. But I will concede this: the current legal framework leaves a moral residue. It fails to capture the specific harm of cultural extinction. Prosecutors must use the tools they have, but the law is imperfect. It punishes the acts but misses the ontological loss. That is unwelcome news for my colleagues who believe the current statutes are morally complete. They are not. They are a floor, not a ceiling.

  Mara: And I will concede this: under the criterion I proposed, many standard liberal practices look suspicious. Compulsory schooling, even when benign in intent, severs intergenerational transmission to some degree. If we define the group by its cultural continuity, then any state policy that significantly alters that continuity risks fitting the definition. This is unwelcome news for my allies who believe nation-building is inherently distinct from destruction. It is not always distinct. The difference is one of degree and intent, but the slope is real. We cannot simply assume our own histories are clean.

  Elias: So we are left with a narrowed disagreement. You want the law to stretch to cover the ontological loss, accepting the risk of inflation. I want the law to remain strict to preserve its utility, accepting the moral residue.

  Mara: Precisely. But we agree that the current situation is intolerable. The Kess are being erased. The question is whether calling it genocide helps or hinders the remedy.

  Elias: If calling it genocide leads to legal failure because the definition cannot hold, then it hinders. If it mobilizes political will where crimes against humanity do not, then it helps. But as a legal scholar, I cannot endorse a charge that tribunals will likely reject based on established precedent regarding physical destruction.

  Mara: And as a philosopher, I cannot endorse a system that treats the death of a culture as less than the death of a person. But I accept that your warning about inflation is not merely tactical. If every assimilationist policy is genocide, the concept loses its gravity. We must distinguish between the moral concept and the legal category.

  Elias: Then perhaps the solution is not to stretch the law, but to develop a new category. Cultural extermination. Distinct from genocide, distinct from crimes against humanity. It would acknowledge the harm without diluting the convention.

  Mara: That would be progress. But until that category exists, we must argue over the meaning of the one we have. You argue for stability. I argue for truth.

  Elias: And both are necessary. But in a court of law, stability rules. In a seminar like this, truth must rule.

  Mara: Then let the students argue with the tension. The law says no genocide. The morality says yes. The gap between them is where the politics lives.

  Elias: Agreed. But I still maintain that the prosecutor was right on the law.

  Mara: And I maintain that the prosecutor was wrong on the history.

  Elias: Then we have work to do.

  Mara: We do.
