  2.  **Deconstruct the Core Tension (Walzer vs. *Lincoln*):**
      *   *Walzer's Dirty Hands:* The agent *must* do the wrong thing for the sake of the political community, but they *must* also acknowledge the wrongness and suffer for it (guilt/residue). If they don't feel guilt, they are dangerous. If they refuse to do the act, they are ineffective. It's a paradox.
      *   *Lincoln (Kushner/Spielberg):* It's a hagiography. It's about the *necessity* of the act (passing the 13th Amendment) to end the war/slavery. The moral weight is largely shifted onto the *outcome* (freedom/peace) rather than the *stain* on the soul. Lincoln is portrayed as wise, weary, but ultimately justified.
      *   *The User's Hunch:* Lincoln gets off scot-free (consequentialist), Stevens takes the hit (Walzerian). This is an inversion.
