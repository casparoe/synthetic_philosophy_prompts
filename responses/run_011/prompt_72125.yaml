answer: |-
  Your hunch is correct, and your "residue test" is a sharp diagnostic tool. If you teach *Lincoln* as an illustration of Walzer's 1973 argument, you will likely find your students walking away with a confused understanding of what Walzer means by "guilt."

  The film is a teleological vindication of power; Walzer's paper is a deontological warning about it. They are pulling in opposite directions.

  Here is the breakdown of why the film resists your reading, where it might actually be useful, and the blunt answer to whether you should keep it.

  ### 1. The Residue Test: Lincoln vs. Stevens
  You identified the inversion correctly. The film treats Thaddeus Stevens as the Walzerian agent and Lincoln as the Machiavellian one.

  *   **Lincoln's Lie (The Envoys):** Lincoln tells the House there are no peace commissioners, knowing there might be.
      *   *Walzerian expectation:* Lincoln should succeed, but carry a stain. He should acknowledge the lie corrupted his integrity.
      *   *Film reality:* Lincoln treats this as statecraft. In the cabinet scene where he discusses the legality of the Proclamation, he is enjoying the legalistic puzzle. When he lies to the House, he is weary, but the weariness reads as the burden of *leadership*, not the burden of *sin*. The film frames the lie as a necessary deception to save the Union, and the Union's survival washes the stain clean immediately.
      *   *Verdict:* Fails the residue test. Lincoln is vindicated by history (and the film's narrative arc), not haunted by the act.

  *   **Stevens' Moderation:** Stevens denies his belief in racial equality on the House floor to secure the votes.
      *   *Walzerian expectation:* He does the wrong thing (lying/betraying principle) for the right outcome.
      *   *Film reality:* This is the only scene that passes your test. When he returns home to his mixed-race household, he is furious and ashamed. He admits he "stumbled." He feels the moral cost. He is morally worse off, even though the amendment passed.
      *   *Verdict:* Passes the residue test.
      *   *Pedagogical Problem:* If you use this film to teach Walzer, students will conclude that the *supporting cast* has dirty hands, while the *leader* has clean ones because his necessity was greater. That inverts Walzer's warning that the leader is the one most at risk of becoming a monster if they don't feel the guilt.

  *   **Seward's Lobbyists:** Buying votes with patronage.
      *   *Film reality:* Treated as comic relief or pragmatic grease. There is zero moral residue here; it's presented as the "price of doing business."
      *   *Verdict:* Fails. This is ordinary corruption, not tragic dirty hands.

  ### 2. Collective Agency and the "Sin-Eater"
  Walzer's model is indeed the solitary ruler in the room. *Lincoln* complicates this, but not in a way that helps Walzer.

  *   **Diffusion:** The film shows that in a democracy, dirty hands are outsourced. Seward handles the bribes. The Whips handle the pressure. Stevens handles the public lie.
  *   **Re-Centralization:** You are right that the film cheats to solve this. It dumps the moral weight back onto Lincoln, not because he is the only one who acted, but because he is the *sacrificial figure*. His assassination is foreshadowed throughout as the price of the peace he brokered.
  *   **Theory Check:** Does dirty-hands theory handle collective agents? Generally, no. It relies on individual moral accountability. The film suggests that in a modern bureaucracy, guilt can be distributed until it evaporates, unless one person volunteers to absorb it all.
  *   **Teaching Point:** This is actually the film's strongest contribution. It shows that Walzer's model might be *obsolete* for modern democracies. If the "dirt" is spread across a coalition, Walzer's requirement for individual guilt becomes impossible to satisfy. The film solves this mythically (Lincoln dies for the sins of the House), but political theory can't.

  ### 3. The Counterfactual and "Bad Lighting"
  If the lie had come out and the amendment failed:
  *   **Tragedy vs. Dirty Hands:** It would be a tragedy of futility. Walzer requires that the act be *necessary* for a supreme emergency. If it fails, the necessity is retroactively questioned.
  *   **Consequentialism with Bad Lighting:** Your suspicion is well-founded. The film argues the lie was *good* because it worked. Walzer argues the lie was *wrong* but *necessary*, and remains wrong even if it worked.
  *   **The Distinction:** The film collapses the distinction between "justified" and "excused." For Walzer, the agent is never fully justified; they are only excused by the emergency, and must still pay the moral price. The film treats the successful outcome as full justification. This suggests the film is indeed teaching consequentialism, not dirty hands.

  ### 4. Williams vs. Walzer (The Luxury of Guilt)
  Bernard Williams worries that Walzer's "guilt" allows the politician to indulge in a sense of their own moral complexity—a kind of "look how heavy is my burden" self-regard.

  *   **The Film's Stance:** *Lincoln* leans heavily into the Williams critique. Lincoln's melancholy, his stories, his weariness—they aestheticize the moral cost. He enjoys the stature of the man who makes the hard choices.
  *   **Teaching Implication:** If you pair Walzer with Williams, this film is gold. It visualizes exactly what Williams fears: the leader who cultivates guilt as a sign of virtue. Lincoln isn't suffering from the lie; he is wearing it as a badge of his unique capacity to save the Republic.

  ### 5. The Blunt Question: Does the Film Add Value?
  **Does seeing guilt distributed, absorbed, or refused across a bunch of people teach you something the papers can't?**

  **Yes, but only if you frame the film as the *antagonist* to Walzer.**

  If you screen this to *illustrate* Walzer, you will fail. Students will see Lincoln as a hero who did what was needed, and they will miss Walzer's point that Lincoln *should* feel guilty and that his lack of visible guilt is dangerous.

  However, if you screen this to **test the limits of Walzer**, it is valuable.
  1.  **It visualizes the diffusion of responsibility.** Walzer writes about the individual; the film shows the machine. This helps students see why Walzer's individualism might be a limitation in modern politics.
  2.  **It distinguishes "weariness" from "guilt."** The papers describe guilt abstractly. The film lets you ask: Is Lincoln's sadness actually moral guilt, or is it just exhaustion? That distinction is hard to grasp in text but visible on screen.
  3.  **It exposes the seduction of the "Clean Hands" alternative.** The film makes the Radicals (who want to keep their hands clean on principle) look obstructive. This forces students to defend Walzer against the charge that insisting on guilt makes you ineffective.

  ### Recommendation: To Screen or To Swap?

  **Swap it if:** Your goal is to have students accurately comprehend Walzer's specific definition of dirty hands (the persistence of wrongness). The film actively undermines this by vindicating Lincoln too thoroughly. You would be better off with a case study where the success is ambiguous (e.g., Truman and the Atomic Bomb, or a film like *Zero Dark Thirty* where the moral cost is left festering).

  **Keep it if:** Your goal is to have students *critique* Walzer. The film is a perfect example of why people *reject* Walzer's conclusion. It shows the "Consequentialist Temptation"—the desire to say "it was worth it" and move on.

  **If you keep it, here is the cut list:**
  *   **Screen:** The Cabinet scene (legal calculus), The Lobbyists scene (diffusion of guilt), Stevens at home (the only true residue), Lincoln's final monologue to the cabinet (the sin-eating).
  *   **Skip:** The battlefields (distracts from political ethics), The assassination sequence (turns it into martyrdom theology rather than political ethics), The opening battle (sets a tone of "just war" that biases the ethical calculus too early).

  **Final Verdict:**
  The film is a bad vehicle for *explaining* Walzer, but a great vehicle for *problematizing* him. If you want your students to understand why Walzer's argument is difficult to sustain in a democratic coalition, keep the film. If you want them to understand what Walzer actually said, drop it. Given your seminar is on "Political Ethics," the friction between the two is probably more valuable than a clean illustration. Just warn them in the syllabus: *"We are watching this to see where the theory breaks down, not where it fits."*
