  3.  **Address Thread 1: The Residue Test:**
      *   *Lincoln's Lie (Peace Envoys):* Lincoln lies to the House. Does he feel guilt? He feels weight, weariness, but not *moral stain*. He justifies it as necessary for the greater good. The film frames this as cunning wisdom, not moral compromise. *Verdict:* Fails the residue test.
