      *Wait, one more check:* The user's "Residue Test" is excellent. I should validate that. Lincoln *does* have residue (he dies, he is weary), but the film frames it as *sacrifice* rather than *guilt*. There's a difference. Sacrifice implies giving up something good. Guilt implies holding onto something bad. Lincoln feels he gave up his peace/safety, not that he committed a sin. That's the crucial distinction.

