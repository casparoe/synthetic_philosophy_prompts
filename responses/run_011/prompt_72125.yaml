      *(Self-Correction during drafting)*: I need to make sure I don't just say "It's bad." I need to explain *how* to use it if they keep it, or why to drop it. The user asked "Does the film do anything... that argument alone can't do?" I need to be honest. If it's just illustration, tell them to swap it.
