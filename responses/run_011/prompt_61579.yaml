  **1. Tiered Ranking of Variants**

  **Tier 1: Critical Strain on Aggregation**
  1.  **A (Unbounded):** This variant forces the utilitarian to endorse total inequality, demanding all resources flow to M until others face destitution, directly violating the separateness of persons without any internal stopping point.
  2.  **E (Diffuse):** This variant compels the utilitarian to prioritize a swarm of sub-sentient entities over actual persons, straining the definition of the moral units being aggregated even more than A.

  **Tier 2: Moderate Strain on Aggregation**
  3.  **D (Deferred):** This variant introduces intertemporal conflict, requiring the utilitarian to justify present sacrifice for future gain, which strains aggregation across time slices but allows for discounting.
  4.  **B (Capped):** This variant permits a standard diminishing marginal utility solution where M receives a fixed small share, straining the allocation only slightly by demanding a specific sacrifice from the majority.

  **Tier 3: Minimal Strain on Aggregation**
  5.  **C (Positional):** This variant creates a zero-sum welfare game where transfers yield no net gain, allowing the utilitarian to remain indifferent and avoid the monster's demands entirely.

  ***

  **2. Utilitarian Replies**

  **A (Unbounded):** The utilitarian must accept the counter-intuitive conclusion that M receives everything because the aggregate welfare sum is mathematically highest under that distribution. This reply does not generalize, as it relies on the specific premise of unbounded marginal utility which rarely applies to ordinary persons.

  **B (Capped):** The utilitarian allocates provisions to M only until the marginal welfare gain drops to match that of the ordinary population, which occurs precisely at the one percent saturation point. This reply generalizes readily to any scenario involving agents with diminishing marginal utility or hard capacity limits.

  **C (Positional):** The utilitarian prescribes indifference to transfers because the fixed quantity of positional welfare ensures that M's gain is exactly canceled by the losses of others, resulting in a net change of zero. This reply generalizes to any context where welfare is defined as purely relative and zero-sum.

  **D (Deferred):** The utilitarian applies a time-discount rate to future welfare that renders the present cost of provisions greater than the discounted value of M's future gains. This reply generalizes to all intertemporal allocation problems involving uncertainty or pure time preference.

  **E (Diffuse):** The utilitarian weights the welfare of the entities by their degree of sentience, ensuring that the aggregate of low-sentience units does not outweigh the welfare of fully sentient persons. This reply generalizes to any population ethics problem involving moral patients of varying cognitive or sentient capacities.

