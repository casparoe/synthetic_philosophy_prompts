      *(Refining the "Second Vote" question)*: Does the second vote prove the first was wrong? No, it proves the *people* changed their minds. It's a voluntarist theory, not a truth-tracking theory.

      *(Refining the "Underdetermined" section)*: The text doesn't say *why* the change happened, only that it did. Was it conscience? Fear of revolt? This leaves room for moral vs. pragmatic interpretations.

