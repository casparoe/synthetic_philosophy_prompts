answer: |-
  The Mytilenean sequence presupposes a theory of political authority grounded in the **immediacy and supremacy of the collective will**, unbound by its own past expressions. In this view, the Assembly is not a legislature bound by a constitution, but a sovereign agent whose authority is fully present in every session. A decree's validity derives solely from the procedural correctness of its enactment at time *t*, not from its conformity to abstract justice or even to the Assembly's own decisions at time *t-1*.

  ### The Implicit View: Volitional Supremacy and Temporal Fluidity

  The implicit theory is that the *demos* is a continuous entity but a discontinuous legislator. The Assembly's will is self-validating because there is no higher authority to validate it; it is revisable at pleasure because the current *demos* cannot be bound by the past *demos*, even though they are the same people.

  In this framework, **validity and wisdom are entirely separate**. The first decree was valid when passed; it possessed the full force of law. Its rescission did not declare it *void ab initio* (as if it had never been law), but rather *superseded* it. The second vote establishes primarily that the current will differs from the past will, and secondarily that the current will is deemed wiser. It is a theory of **supersession, not nullification**. The second ship did not carry a court judgment that the first decree was illegal; it carried a new order that contradicted the old one. The authority of the second decree rests on its recency, not on the superior truth of Diodotus's arguments over Cleon's.

  ### Reconciliation with Procedural Scrupulousness

  This volitional supremacy appears to conflict with the later prosecution of illegal decrees (*graphe paranomon*) and Socrates' refusal at Arginusae to put an illegal motion to a vote. However, they are reconcilable if one distinguishes between **policy discretion** and **procedural constraint**.

  1.  **Mytilene (Policy):** The reversal was a change of policy. No existing *nomos* (standing law) forbade punishing Mytilene. Therefore, the first decree was legally valid, merely politically regrettable. The Assembly had the *power* to do it, and the *power* to undo it.
  2.  **Arginusae (Procedure):** Socrates' objection was not that the generals shouldn't be punished, but that the *method* (collective trial) violated existing legal protections. Here, the Assembly's will ran up against a procedural *nomos* that was understood to constrain *how* decisions were made, even if not *what* decisions were made.

  The reconciliation lies in a hierarchy where the *demos* is sovereign over policy (*psephismata*) but acknowledges a web of procedural norms (*nomoi*) that govern its conduct. The Mytilene sequence shows that in the absence of a conflicting *nomos*, the will is absolute. The Socrates incident shows that when a *nomos* is invoked, the presiding officers (and the courts later) can check the will. The tension remains: if the *demos* is sovereign, who defines the *nomos*? At this stage in the war, the answer was effectively "the *demos* itself," which made the constraints fragile.

  ### Strict Requirements vs. Compatible Theses

  To understand the theoretical landscape, we must distinguish what the Mytilene practice **strictly requires** from what merely **sits well with it**.

  **Strictly Required:**
  *   **Temporal Supremacy:** A later vote overrides an earlier vote regarding the same subject matter.
  *   **Procedural Sufficiency:** Validity is determined solely by the count of hands and the proper convening of the body, not by the content of the decree.
  *   **Absence of Veto:** No magistrate, court, or second chamber possesses the authority to block a decree *before* it is enacted or to annul it *after* without a new vote of the Assembly.

  **Merely Sits Well With (Compatible but not Required):**
  *   **Epistemic Optimism:** One might argue the second vote proves the *demos* learns from deliberation (the "cooling off" period). However, the practice does not require this; the reversal could have been due to bribery, fear, or whim. The mechanism works even if the second decision is worse than the first.
  *   **Popular Sovereignty as Ideology:** The practice fits the ideology that the people are the best judges of their interest, but strictly speaking, the mechanism only requires that the people are the *only* judges. It is compatible with an oligarchic theory where a small council holds the same revisable power.
  *   **Absence of Higher Law:** The practice suggests no higher law blocked the first decree, but it does not prove higher law doesn't exist. It only proves that no institution existed to enforce it against the Assembly's will in this instance.

  **Underdetermination:**
  The practice is underdetermined regarding the **source of the constraint**. Why did they change their minds?
  *   *Theory A (Pragmatism):* They realized the punishment would provoke further revolts (Diodotus's argument). This implies authority is limited by consequences.
  *   *Theory B (Morality):* They realized the punishment was unjust. This implies authority is limited by natural law.
  Thucydides records Diodotus arguing expediency, not justice. This leaves room for a rival theory: that the Assembly views itself as bound only by self-interest, not morality. The mechanism of reversal licenses both a moral awakening and a cold recalculation of power.

  ### The Post-403 Shift: Binding the Sovereign

  For Athens to treat some decisions as beyond its own reach, as occurred after the restoration of democracy in 403 BCE, both institutional mechanisms and the *demos*'s self-conception had to undergo a fundamental transformation.

  **Institutional Changes:**
  1.  **Distinction between *Nomos* and *Psephisma*:** A rigid hierarchy was established. *Nomoi* (fundamental laws) could not be overturned by *psephismata* (decrees).
  2.  **The *Nomothetai*:** The Assembly could no longer vote laws directly. To change a *nomos*, the Assembly had to vote to appoint a board of *nomothetai* (lawgivers). This introduced a procedural hurdle that acted as a substantive limit. It slowed down the "will at pleasure."
  3.  **Judicial Review:** The *graphe paranomon* became more robust, allowing courts to strike down decrees that conflicted with standing *nomoi*.

  **Conceptual Changes:**
  1.  **The *Demos* as Subject:** The *demos* had to conceive of itself not just as the *source* of law, but as *subject* to it. In the Mytilenean sequence, the *demos* is the master of the law. After 403, the *demos* is the guardian of the Law.
  2.  **Temporal Binding:** The *demos* had to accept that its past self (in the form of established *nomoi*) could bind its present self. This rejects the Mytilenean presupposition that the current will is always supreme.
  3.  **Legitimacy via Stability:** Legitimacy shifted from deriving from the *expression* of the will (the vote) to deriving from the *stability* of the legal order. A decree that contradicted a law was not just unwise; it was illegitimate, regardless of how many hands were raised.

  In sum, the Mytilenean sequence reveals a polity where authority is **voluntarist and immediate**: the law is what we say it is, right now. The post-403 reforms moved Athens toward a **constitutionalist** model: the law is what we have agreed we cannot change easily, even if we want to right now. The transition required the *demos* to surrender its own omnipotence to preserve its own freedom.
