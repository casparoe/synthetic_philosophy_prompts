      *   **Goal:** A structural plan for the session, not the content itself.
      *   **Constraints:**
          *   Need the *order* of concepts (scaffolding).
          *   Need *one core case study* (must work hard: show dissolving dispute, show non-dissolving dispute, survive "so what?" objection, no clichés like trolleys/Theseus).
          *   Need to locate the *hard bit* (ontological disputes: race, corporations, numbers) and decide if it fits.
          *   Need to address *reporter-specific misconceptions* (semantics = not a story, define terms = fix it, dictionary wins, verbal = nobody wrong/no story).
          *   Need a *closing check* (one question to verify understanding).
          *   Need to know what to *exclude* (e.g., quantifier variance) and how to frame the exclusion.
      *   **Tone:** Professional, pragmatic, respectful of their time/skepticism, no academic jargon.

  2.  **Determine the Order (Scaffolding):**

      *   *Problem:* If I start with examples, they think it's a parlor trick. If I start with theory, they tune out.
      *   *Solution:* Start with the *cost*. Why does this matter to *their* job?
      *   *Sequence:*
          1.  **The Cost (Hook):** Show a headline that lied because of this. Not the addiction one. Something where the "fight" drove the narrative, but the narrative was fake.
          2.  **The Mechanism (Tool):** How to spot it. The "Substitution Test."
          3.  **The Core Case (Workhorse):** Apply the tool.
          4.  **The Hard Bit (Ontology):** When the word *is* the fact.
          5.  **The Misconceptions (Defense):** Pre-empt the pushback.
          6.  **The Close (Check):** Verify utility.
      *   *Refinement:* The prompt asks specifically about the order of concepts in their heads.
          *   Concept 1: Disagreements drive stories.
          *   Concept 2: Some disagreements are fake (verbal).
          *   Concept 3: Fake disagreements waste time/space.
          *   Concept 4: Real disagreements often hide inside fake ones.
          *   Concept 5: Sometimes the "word fight" *is* the story (power/definition).
      *   *Why this order?* Reporters care about conflict. Start with conflict. Show them how to filter noise. Then show them when the noise *is* the signal.

  3.  **Select the Core Case:**

      *   *Criteria:* Arguable, dissolves sometimes, doesn't dissolve others, survives "so what," no trolleys/Theseus.
      *   *Idea 1:* Is a hotdog a sandwich? (Too silly, trivializes the point).
      *   *Idea 2:* Is this art? (Too subjective, hard to pin down).
      *   *Idea 3:* **Gentrification.**
      *   *Why Gentrification?*
          *   *Dissolves:* Developer says "revitalization" (investment), Activist says "gentrification" (displacement). If you swap terms, they might agree on the facts (rents up, new shops, old residents leave).
          *   *Doesn't Dissolve:* One side says "displacement is happening," the other says "no one was forced out." That's a factual dispute, not just verbal.
          *   *Survives "So What":* Defining it determines policy. If it's "revitalization," you subsidize it. If it's "gentrification," you regulate it.
          *   *Reporter Relevance:* It's a standard beat story.
      *   *Alternative:* **"Layoff" vs. "Restructuring."**
          *   *Dissolves:* HR says "restructuring" (strategy), Worker says "layoff" (fired). Facts: 50 people gone.
          *   *Doesn't Dissolve:* Were they offered other roles? (Factual).
          *   *Survives "So What":* Unemployment benefits, stock price reaction, morale.
      *   *Selection:* **"Gentrification" is better for general assignment.** It allows for more heat in the room. Let's refine it to **"Is this neighborhood gentrifying?"**

  4.  **Locate the Hard Bit (Ontology):**

      *   *Issue:* Race, corporations, numbers.
      *   *Decision:* Keep it, but late. It's the "Boss Level."
      *   *Placement:* After they master the easy verbal disputes. If you put it first, they think *all* reporting is semantics. If you put it last, it shows the limit of the tool.
      *   *Time:* 5-7 minutes max.
      *   *Framing:* "Sometimes the fight isn't about what the word means, but whether the category exists."
      *   *Risk:* Turning everything into semantics.
      *   *Mitigation:* Emphasize that *consequences* make it real. If treating a corporation as a "person" changes tax law, the dispute matters regardless of metaphysics.

  5.  **Address Misconceptions:**

      *   *List:*
          1.  "Just semantics = not a story."
          2.  "Define terms on record = fix it."
          3.  "Dictionary wins."
          4.  "Verbal = nobody wrong = no story."
      *   *Timing:*
          *   "Dictionary wins" needs to die *early* (during the Mechanism phase).
          *   "Just semantics = not a story" needs to die *during the Core Case* (show the policy impact).
          *   "Define terms = fix it" needs to die *during the Hard Bit* (sometimes they won't/can't).
          *   "Verbal = nobody wrong" needs to die *at the Close* (someone is wrong about the *facts* implied by the word).
      *   *Priority:* The nastiest one is "Verbal = nobody wrong so there's nothing to report." This kills the story. This must be addressed immediately after the Core Case.

  6.  **The Closing Check:**

      *   *Goal:* Distinguish between memorizing a phrase and understanding the utility.
      *   *Draft:* "What is a verbal dispute?" (Too academic).
      *   *Draft:* "Give me an example." (Too vague).
      *   *Better:* "You have two sources screaming at each other. What's the one question you ask before you write the lede?"
      *   *Best:* **"If they agreed on the word, would they still be fighting?"** (Simple, actionable, cuts to the core).

  7.  **What to Exclude (Quantifier Variance):**

      *   *Reasoning:* Too technical. "Existence claims vary by quantifier scope."
      *   *Excuse:* "We're talking about reporting, not metaphysics. If you want the deep math of language, come find me after." Frame it as "Out of scope for deadline work."

