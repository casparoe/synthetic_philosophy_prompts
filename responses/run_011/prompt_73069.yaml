answer: |-
  Here is the plan for the 45 minutes. It is designed to move from *utility* to *mechanism* to *complexity*, ensuring they see the value before they learn the tool.

  ### 1. The Order (Scaffolding)

  You cannot teach them to spot a verbal dispute until they believe verbal disputes cost them time and credibility. If you start with the mechanism, they treat it as a grammar lesson. If you start with the cost, they treat it as a reporting tool.

  **Sequence:**
  1.  **The Cost (5 mins):** Establish that verbal disputes produce false conflict. Show a headline that implied a fight where none existed, or missed a fight because it looked like semantics.
      *   *Why first:* Skeptical reporters need to know *why* they are listening. This creates the "itch" the rest of the session scratches.
  2.  **The Mechanism (10 mins):** The "Substitution Test." (If you swap Source A's definition into Source B's sentence, does the disagreement vanish?)
      *   *Why second:* They need a concrete tool before they analyze a complex case. Without the tool, the case is just gossip.
  3.  **The One Case (15 mins):** Apply the tool to the workhorse example (see below).
      *   *Why third:* This is where they practice. It solidifies the tool and introduces the stakes.
  4.  **The Hard Bit (10 mins):** Ontological disputes (when the word *creates* the fact).
      *   *Why fourth:* Only after they know how to dissolve a fake fight can they understand when a "fake" fight is actually a real power struggle.
  5.  **The Close (5 mins):** The check.

  **Dependency Chain:**
  *   They must accept that **language drives narrative** before they will care about **definition**.
  *   They must master the **Substitution Test** on a simple disagreement before they can apply it to a **political/ontological** one.
  *   They must see that **verbal disputes can be resolved** before you tell them **sometimes they can't (and that's the story).**

  ### 2. The One Case

  **The Case:** **"Is this neighborhood gentrifying?"**

  **Why this case:**
  *   **It looks substantive:** It involves money, race, policy, and anger. It feels like a "real" story.
  *   **Job 1 (Dissolves):** A developer says, "We are bringing *investment*." A tenant organizer says, "You are bringing *gentrification*."
      *   *The Move:* Have the room list the facts both agree on (rents rising, new businesses, demographic shift). If they agree on the facts, the fight is over the label *gentrification* vs. *investment*. The dispute dissolves.
  *   **Job 2 (Refuses to Dissolve):** The organizer says, "Gentrification means *displacement*." The developer says, "No one was forced out."
      *   *The Move:* Now the word *gentrification* is hiding a factual claim (did people leave involuntarily?). The dispute does not dissolve. It requires reporting.
  *   **Job 3 (Survives "So What"):** The smart-aleck asks, "So they just use different words? Who cares?"
      *   *The Answer:* Zoning laws. If the city council defines the area as "gentrifying," they trigger affordable housing mandates. If they define it as "investing," they trigger tax breaks. The word determines the policy. The reporters need to know which definition the city is using to write the story accurately.

  **What it must NOT be:**
  *   **No "Is a hotdog a sandwich?":** Too trivial. Implies this is a parlor trick.
  *   **No "Pro-Life vs. Pro-Choice":** Too charged. The room will bog down in personal ethics rather than linguistic structure.
  *   **No "Art":** Too subjective. Reporters need objective stakes (policy, money, law).

  ### 3. The Hard Bit (Ontology)

  **Keep it.** But it must go **after** the Case, not before. If you put it first, they will think *all* reporting is just semantics and disengage.

  **Where it sits:** Immediately after the Gentrification case.
  **The Transition:** "Sometimes the fight isn't about what the word means, but whether the thing the word points to exists at all."

  **How to handle it in 10 minutes:**
  *   Use **"Is this corporation a person?"** or **"Does this data set count as 'racist'?"**
  *   **The Move:** Acknowledge that some disputes are verbal *and* real.
  *   **The Pushback:** Reporters will say, "If it's just a definition, it's not a fact."
  *   **The Counter:** "If the judge rules the corporation is a person, they get free speech rights. The *consequence* is real, even if the *metaphysics* is debatable."
  *   **The Lesson:** Your job isn't to solve the philosophy. Your job is to report *who is using which definition* and *what happens when they win*.
  *   **Risk Management:** If the room starts bogging down in "But what is race really?", cut it. Say: "That's a PhD thesis. Your story is about the housing policy that changes depending on the answer. Report the consequence, not the essence."

  ### 4. The Misconceptions

  Here is when they will arrive and where you kill them.

  1.  **"Whichever usage matches the dictionary wins."**
      *   *Arrives:* During **The Mechanism**.
      *   *Kill:* Show them two dictionary definitions for the same word (e.g., *addiction* or *violence*). Dictionaries describe usage; they don't legislate it. In news, context wins, not Webster's.
  2.  **"This is just semantics, therefore not a story."**
      *   *Arrives:* During **The One Case** (Gentrification).
      *   *Kill:* Remind them of the zoning/tax consequence. Semantics drive policy. Policy is a story.
  3.  **"Get them to define their terms on the record and the dispute evaporates."**
      *   *Arrives:* During **The Hard Bit**.
      *   *Kill:* Sources often *won't* define terms because the ambiguity benefits them. A politician wants "safety" to mean both "low crime" and "strict laws." Forcing a definition might kill the quote you need. Report the ambiguity; don't try to fix it.
  4.  **"If it's verbal then nobody's wrong so there's nothing to report." (The Nastiest One)**
      *   *Arrives:* **Immediately.** It will be in the room the moment you say "verbal dispute."
      *   *Kill:* During **The Cost** (Intro). "Nobody is 'wrong' about the word, but someone is wrong about the *implication*. If I say 'This is a recession' and you vote based on that, I need to know if I'm using the technical definition or the feeling definition. One gets you fired, the other gets you re-elected."

  ### 5. The Closing Check

  Do not ask them to define "verbal dispute." That tests memory, not utility.

  **The Question:**
  > "You have two sources screaming at each other. What is the **one question** you ask yourself before you write the lede?"

  **The Answer you need to hear:**
  > "If they agreed on the word, would they still be fighting?"

  **Why:**
  *   If they say "I ask them to define their terms," they missed the point (sources lie/evasive).
  *   If they say "I check the dictionary," they failed.
  *   If they say "If they agreed on the word, would they still be fighting," they understand the Substitution Test and the goal of finding the *real* conflict.

  ### 6. What to Refuse (The Exclusion)

  **Topic:** **Quantifier Variance** (and deep metaphysical ontology).

  **The Scenario:** Your philosophy contact will want you to explain that "existence" claims vary based on logical quantifiers. A reporter will ask, "So, do numbers actually exist or not?"

  **The Refusal:**
  > "That is a question for a philosopher, not a deadline. In this room, 'exists' means 'has consequences I can document.' If the stock market reacts to the number, the number exists for the purpose of this story. We are not solving metaphysics; we are clearing the wire."

  **Why:**
  *   It protects your authority. You are the expert on *reporting*, not *truth*.
  *   It keeps the session under 45 minutes.
  *   It validates the reporters' instinct that philosophy can be navel-gazing, while stealing the useful tool from it.

  ### Summary of Flow

  1.  **Intro:** Show a story killed by a word fight. (Create the need).
  2.  **Tool:** Teach the Substitution Test. (Give the hammer).
  3.  **Case:** Gentrification. (Hit the nail).
  4.  **Hard Bit:** When the word *is* the power. (Show the nail is sometimes load-bearing).
  5.  **Close:** "If they agreed on the word, would they still be fighting?" (Verify the grip).
