answer: |-
  # THE BASIC ARGUMENT SORTING TREE

  **NODE 1: THE CLINIC**
  Mara books a procedure at 25 to dampen her temper. The desire to book it grows from guilt she never chose.
  **Claim:** *She is **more** responsible for what she does afterwards than before.*
  *   **YES** (Origins don't block acquisition) → Go to **NODE 2A**
  *   **NO** (Origins block acquisition) → Go to **NODE 2B**

  **NODE 2A: THE SLOW VERSION (Compatibilist Branch)**
  Identical outcome, but temper worn down over 30 years of ordinary choices rather than one procedure.
  **Claim:** *The slow version makes her **more** responsible than the Clinic procedure.*
  *   **YES** (History matters) → **LEAF: Reasons-Responsiveness (Fischer & Ravizza)**
  *   **NO** (Structure matters, history cosmetic) → Go to **NODE 3A**

  **NODE 3A: THE AUTHOR (Hierarchies)**
  Someone shapes their own second-order desires with no third-order court of appeal anywhere above them.
  **Claim:** *Nothing is missing from this picture for "real" responsibility.*
  *   **YES** → **LEAF: Frankfurt-Style Hierarchical Compatibilism**
  *   **NO** (Something missing, but origins don't block) → **LEAF: Naturalism about Reactive Attitudes (P.F. Strawson)** *[Forgotten Leaf]*

  **NODE 2B: THE SLOW VERSION (Skeptic/Libertarian Branch)**
  Identical outcome, but temper worn down over 30 years of ordinary choices.
  **Claim:** *The slow version solves the regress problem (makes her responsible).*
  *   **YES** (Regress is benign/sorites) → **LEAF: Deflationary Reply (Sorites in Disguise)**
  *   **NO** (Regress is vicious) → Go to **NODE 3B**

  **NODE 3B: THE AUTHOR (Origination)**
  Someone shapes their own second-order desires with no third-order court of appeal anywhere above them.
  **Question:** *What is missing from this picture that "real" responsibility needs?*
  *   **Nothing (but we don't have it)** → Go to **NODE 4**
  *   **Ultimate Origination (*Causa Sui*)** → Go to **NODE 4**
  *   **The Concept Itself** → **LEAF: Illusionism about Free Will**

  **NODE 4: THE METAPHYSICAL BARRIER**
  **Claim:** *It is logically possible to be the ultimate cause of oneself (*Causa Sui*).*
  *   **YES** → Go to **NODE 5**
  *   **NO** → Go to **NODE 6**

  **NODE 5: LIBERTARIAN SPLIT**
  **Claim:** *Ultimate origination requires a distinct causal power in the agent.*
  *   **YES** (Agent as substance) → **LEAF: Agent-Causal Libertarianism**
  *   **NO** (Event-causal indeterminism, e.g., Kane) → **LEAF: Event-Causal Libertarianism**

  **NODE 6: SKEPTIC SPLIT**
  **Claim:** *Determinism is the primary reason responsibility fails.*
  *   **YES** → **LEAF: Hard Determinism**
  *   **NO** (Argument holds regardless of determinism) → **LEAF: Strawson's Basic Argument Skepticism**

  ***

  ### FLAGGED INDISTINGUISHABLE LEAVES
  1.  **Hard Determinism vs. Strawson's Skepticism:** Both land on "No Responsibility" + "*Causa Sui* Impossible." The tree separates them only by *why* (determinism vs. regress), but practically they collapse in any deterministic world. If your group assumes determinism, these leaves are identical.
  2.  **Illusionism vs. Strawson's Skepticism:** Both agree responsibility is impossible. The tree separates them by whether the *concept* is incoherent (Illusionism) or just unsatisfied (Strawson). In practice, both recommend abandoning blame, making them functionally equivalent for meetup debate.

  ### EMPTY CELLS (Logically Available but Unheld)
  1.  **Node 1 (NO) + Node 3A (YES):** Believing origins block responsibility (Node 1) but hierarchies suffice without origination (Node 3A).
      *   *Diagnosis:* **Incoherent.** Violates the constraint accepted at Node 1.
  2.  **Node 2B (YES) + Node 4 (NO):** Believing the Slow Version solves the regress (Node 2B) but *Causa Sui* is impossible (Node 4).
      *   *Diagnosis:* **Unattractive.** Accepts the solution (benign regress) while denying the possibility of the only thing that could stop it.
  3.  **Node 1 (YES) + Node 4 (YES):** Believing origins don't block responsibility (Node 1) but requiring *Causa Sui* anyway (Node 4).
      *   *Diagnosis:* **Unexplored.** Why demand impossibility if ordinary shaping suffices? (Perhaps "Luxury Libertarianism").

  ***

  ### THE TEN-MINUTE SORT

  If you only have time for one question before the wine is poured, ask **Node 1 (The Clinic)**: *"Is Mara more responsible after the procedure than before, even though the desire to change came from unchosen guilt?"* This is the knife-edge of Strawson's argument. A "No" accepts the Basic Argument's core premise (responsibility requires responsibility for character), immediately sorting your Strawsonians, Hard Determinists, and Libertarians from the Compatibilists. A "Yes" rejects the regress before it starts, grouping everyone who thinks responsibility is about ownership rather than origins. It forces the "too fast" crowd to specify whether they object to the procedure or the guilt, and it prevents the "obviously no free will" crowd from hiding behind determinism when the case works even if indeterminism is true.
