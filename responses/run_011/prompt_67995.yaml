answer: |-
  Your draft identifies a genuine structural stagnation in the literature on collective harm, and your diagnosis of the "act-slot picture" is provocative. However, the argument faces significant hurdles in maintaining the distinctiveness of your proposal while avoiding the very inefficacy trap you aim to escape. Below are critical comments addressing your specific concerns.

  Regarding (a), your suspicion about criterion (i) is well-founded. The demand for non-gerrymandering risks being either too weak or incoherent. You stipulate that the set must be specifiable without reference to the harmfulness of the act whose wrongness is at issue. Yet, in paradigm cases like meat consumption or carbon emission, the set is often identified precisely by its harmful outcome. If I define the set as "those purchasing factory-farmed meat," the description relies on a production process defined by animal suffering. If I define it merely as "those purchasing meat," I include ethical butchers, diluting the harm connection. To strengthen this, you might require that the set be defined by shared intention or social practice independent of the specific harm outcome. However, this moves you closer to complicity views that require intentional joint action, which excludes impersonal market interactions where inefficacy objections are strongest. If you allow sets defined by aggregate harm to count as non-gerrymandered provided they don't mention *your* act, the criterion becomes trivial: any aggregate can be described without mentioning a specific token. You need a principled distinction between a natural kind of collective action and an ad hoc grouping created solely to assign blame, but providing this without collapsing into causal individuation is difficult.

  Regarding (b), the argument in section 4 is the pivot point, and currently, it leans toward collapse. You worry that monotonicity recreates the inefficacy objection at the set level. This worry is correct. If harm is a function of the number of participants, and your participation does not change the number of participants in a way that alters the harm output (as in threshold cases), then the participation relation is normatively inert regarding the outcome. Your tentative response—that monotonicity secures counterfactual sensitivity of the *relation* rather than the outcome—is obscure. If the relation does not affect the outcome, why is the relation wrong? If the answer is "because it is a relation to harm," you have severed the link between wrongness and difference-making entirely. This saves the view from inefficacy only by making it insensitive to actual consequences, which pushes you into the non-causal camp you sought to transcend. To avoid this, you must argue that the wrongness of participation is not derived from the harm produced but from the structural position occupied. But if so, you are no longer offering a theory of contribution to *harm*; you are offering a theory of symbolic alignment. You need to explain how a relation can be harm-based without being harm-causing. If you cannot, the participation view is either a disguised causal view (which fails in threshold cases) or a disguised expressive view (which abandons the harm focus).

  Regarding (c), section 2 risks mischaracterizing the non-causal family. You claim both causal and non-causal replies accept the act-slot picture, disputing only what goes on the card. However, many complicity and integrity views are explicitly relational. They argue that the unit of evaluation is not the act token but the agent's relationship to a collective end or group. If these views already locate wrongness in a relation between agent and set, your "participation first" proposal is not a new category but a refinement of existing non-causal accounts. You claim the debate looks substantive because sides write different things on the card, but if the non-causal side already argues the card itself is the wrong unit of analysis, your target is narrower than you claim. You need to distinguish your participation relation from standard complicity accounts. If complicity views already say wrongness is borne by the participation relation, section 3 loses its novelty. You must show that your criteria for admissible sets yield different results than standard complicity theories, or admit that you are systematizing rather than overturning the non-causal family.

  Regarding (d), section 5 presents a false dichotomy. You suggest that if participation fails, the act-slot picture is inescapable, and non-causal replies must be read as claims about character or meaning. There is a third outcome: the act-slot picture is correct, but the content of the slot is relational. One could maintain that the individual act token is the bearer of wrongness while arguing that the property making it wrong is a relational property (e.g., "being a member of a harm-producing set"). This preserves the act as the locus of evaluation without requiring causal efficacy. Your deflationary conclusion assumes that if wrongness is not borne by the relation, it must be borne by the act's intrinsic or causal properties. But acts can bear extrinsic, relational properties. This allows you to keep the act-slot framework while accommodating the intuition that the wrongness depends on the collective context, avoiding the need to posit the relation itself as the primary bearer.

  Regarding (e), the single weakest paragraph is the second half of section 4, where you offer the tentative response about counterfactual sensitivity. This is where the argument stalls. You acknowledge the problem but offer a solution that feels like a placeholder rather than a resolution. It invites the reader to suspect you have run out of resources. As for the label "act-slot picture," it is memorable but risks being a metaphor rather than a rigorous structural claim. It does real work in highlighting that both sides focus on the individual act, but it may carve the subject matter imprecisely. Most consequentialists do not view acts as empty slots waiting for content; they view acts as events with properties. The label might suggest a formalism that your opponents do not accept, potentially making your critique easier to dismiss as attacking a straw man. You should consider whether the distinction between "act as bearer" and "relation as bearer" is robust enough to sustain the weight you place on it, or if it is merely a different way of describing the same normative landscape.

  In sum, your draft succeeds in highlighting a structural impasse, but your proposed exit risks leading back into the same trap or into a different corner of the literature you claim to bypass. Tightening the definition of admissible sets and clarifying the normative weight of the participation relation without causal impact are essential next steps.
