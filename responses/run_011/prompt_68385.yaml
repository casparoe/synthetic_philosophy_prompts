answer: |-
  You have identified a genuine, live tension in the philosophy of set-theoretic practice. There is no single, canonical noun phrase that captures this exact rhetorical switch (e.g., "The Smith Principle"), but the phenomenon is the central subject of contemporary work in the **philosophy of set-theoretic practice**.

  To give you the handle you need for your draft, you should treat this not as one concept, but as the intersection of three established distinctions. The "move" you are observing is the application of a **Coherence Criterion** that toggles between treating independence as **Indeterminacy** versus **Incompleteness**.

  Here is the breakdown of the conceptual machinery, the near-misses, and a proposed label you can use.

  ### 1. The Core Concept: Indeterminacy vs. Incompleteness
  This is the metaphysical distinction doing the work. When your colleagues switch registers, they are shifting their diagnosis of *why* the statement is independent of ZFC.

  *   **Independence as Incompleteness (The PD Case):** The statement has a determinate truth value in *the* universe $V$, but our current axioms (ZFC) are too weak to prove it. The independence is an *epistemic* limitation. This is why they talk about "finding the right axiom."
  *   **Independence as Indeterminacy (The CH Case):** The statement lacks a truth value because the concepts involved (specifically the power set operation) are not sufficiently determined by our best conception of "set." The independence is a *semantic* or *ontological* feature. This is why they say "it depends on the model."

  **The Switch:** The "move" is the implicit classification of an independent statement into one of these two buckets.

  ### 2. The Trigger: The Vertical/Horizontal Distinction
  You noted the switch seems controlled by "whether there's an agreed structural story." In set-theoretic technicality, this story is the **Large Cardinal Hierarchy**. This provides the specific criterion for the switch.

  *   **Vertical Extensions (Realist Register):** Statements that are tied to the hierarchy of large cardinals (which deepen the universe of sets upwards) are treated as **Incomplete**. Projective Determinacy (PD) follows from the existence of certain large cardinals. Because the large cardinal hierarchy is viewed as the "backbone" of $V$, statements flowing from it are treated as discoveries about *the* universe.
  *   **Horizontal Extensions (Deflationary Register):** Statements that are settled by forcing (which widens the universe by adding subsets without adding ordinals) are treated as **Indeterminate**. CH is the paradigmatic horizontal statement. Since forcing can toggle CH without disrupting the large cardinal structure, it is viewed as "flexible" or "arbitrary" relative to the core concept of set.

  **The Rule:** If the statement integrates into the Vertical (Large Cardinal) narrative $\rightarrow$ Realism. If the statement is purely Horizontal (Forcing) $\rightarrow$ Deflationism.

  ### 3. The Meta-Framework: Thin Realism
  You might wonder how they avoid contradiction by holding both views simultaneously. The overarching philosophical stance that permits this is **Thin Realism** (associated with Penelope Maddy).
  *   **Thick Realism:** Sets exist in a Platonic realm; truth is correspondence to that realm. (Hard to maintain the switch).
  *   **Thin Realism:** Set-theoretic truth is constituted by the best practices of set theorists. If the practice treats PD as true, it is true. If the practice treats CH as open, it is open.
  *   **Why this matters:** Thin Realism allows the "switch" to be methodological rather than contradictory. The "fact of the matter" is just a reflection of the current methodological consensus on that specific statement.

  ---

  ### Proposed Label: "The Determinacy Diagnostic"
  Since there is no standard single term for the rhetorical move itself, I recommend coining **"The Determinacy Diagnostic"** (or **"Diagnostic Oscillation"**) for your chapter.

  **Definition:** The methodological practice of diagnosing independent statements as either *ontologically indeterminate* or *epistemically underdetermined* based on their coherence with the canonical large cardinal hierarchy, rather than their formal status relative to ZFC.

  **Clear Cases (Fits the Diagnostic):**
  1.  **Projective Determinacy:** Independent of ZFC, but treated as **True**. *Reason:* It coheres with the Vertical (Large Cardinal) structure. Diagnosis: Incompleteness.
  2.  **The Continuum Hypothesis:** Independent of ZFC, treated as **Indeterminate**. *Reason:* It is flexible under Horizontal (Forcing) extensions and does not cohere with the Large Cardinal hierarchy. Diagnosis: Indeterminacy.

  **Boundary Cases (Look like it, but aren't / Contested):**
  1.  **Forcing Axioms (e.g., PFA / MM):** These are independent of ZFC. Like PD, they have a "clean structural story" (they settle many questions nicely). *However*, they are technically Horizontal (forcing-based). Some set theorists treat them as True (like PD), others as Optional (like CH). This is the current battleground where the Diagnostic is being tested.
  2.  **$V = L$ (The Axiom of Constructibility):** This is independent of ZFC. It provides a very clean structural story (everything is constructible). *However*, it is almost universally treated as **False**, not Indeterminate. It is rejected for being "restrictive" (it rules out large cardinals). This shows the Diagnostic isn't just about "clean structure," but specifically about *maximality* and the Large Cardinal hierarchy.

  ---

  ### Near-Misses (For your "This is not X" section)

  **1. The Multiverse View (Hamkins)**
  *   **Why it's a near-miss:** Hamkins argues *all* independent statements are indeterminate because there is no single universe $V$.
  *   **Why it doesn't fit:** Your colleagues are *not* consistent Multiversists. They revert to talking about *the* universe $V$ when discussing PD or the reals. The Multiverse view forbids the "Realist Register" switch you observed.

  **2. Universism (Woodin / Traditional Platonism)**
  *   **Why it's a near-miss:** This view holds there is one unique $V$ and all statements have a truth value.
  *   **Why it doesn't fit:** A consistent Universist would not say CH "has no answer." They would say "we haven't found the axiom yet." Your colleagues explicitly deflate CH while inflating PD.

  **3. Instrumentalism / Fictionalism**
  *   **Why it's a near-miss:** This suggests axioms are just tools for generating theorems, not truth-claims.
  *   **Why it doesn't fit:** Your colleagues are making truth-claims ("we have excellent reason to believe [PD]"). They are not merely noting utility; they are asserting ontological commitment conditionally.

  ### Summary for your Draft
  You can write that the practice is not an inconsistency, but an application of **The Determinacy Diagnostic**. This diagnostic relies on the **Vertical/Horizontal distinction** to classify independence results as either **Incompleteness** (warranting Realism) or **Indeterminacy** (warranting Deflationism), all underwritten by a **Thin Realist** meta-ontology that allows truth-conditions to vary by statement based on methodological coherence.

  This gives you the precise vocabulary to describe the "unstated criterion" without mischaracterizing it as simple inconsistency or generic realism.
