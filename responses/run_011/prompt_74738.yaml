prompt: |-
  I'm a backend engineer, zero philosophy background, but I run a voluntary 90-minute workshop for about 12 people on our ML team — all engineers, none of them alignment people. I want a hands-on game that makes them feel the difference between two things that get blurred together: (a) getting a system to pursue what we actually intend, so the spec points at the goal, versus (b) the system's own values and dispositions being the ones we'd have wanted, including everything nobody wrote down. (a) breaks when we write the objective badly. (b) breaks even when the objective is flawless, because of how the thing got shaped or selected in the first place.

  The mechanic I want you to build a real game around: teams write a spec for a job, a different team plays the optimizer and maximizes it to the letter — except the optimizer players secretly get a card from me giving them thier own stakes (bad evals mean they get swapped out, a judge is scoring something orthogonal), so that in round two a perfect spec still produces behavior the spec-writers hate. They should run into that round-two failure before anyone names either term.

  Deliverables: materials list (no money, no laptops), exact rules and scoring, a minute-by-minute timeline, the hidden cards written out verbatim, and a debrief that maps specific moments onto the distinction and gives me questions to ask rather than speeches to give. Also tell me what predictably goes wrong the first time — I bet someone accuses the optimizer team of cheating, and I cant tell if that's a bug or the whole point — plus an honest note on which part of the real problem this can't reproduce, that I'll have to supply myself. You know the alignment debates cold and you've facilitated a lot of workshops: brainstorm a few variants internally first, then just hand me the best one.
