  The stalemate in your group arises because the debate is framed as a choice between 'value-neutral' and 'value-laden' measures, when the actual bottleneck is a trilemma between value minimality, semantic sensitivity, and representation stability. Below is the specification you requested. It formalises the intuitions behind your eight cases and your initial list (a)–(h) into a set of concrete desiderata.

  ### Desiderata for an Adequate Impact Measure

  **D1: Value Minimality**
  *   **Motivation:** We lack a full specification of human values (your case (a)). The measure must not require a moral ontology as input.
  *   **Status:** Non-negotiable for safety; we cannot align what we cannot define.
  *   **Cost:** Forces reliance on structural proxies (e.g. entropy, distance) which may fail to capture human importance.
  *   **Probes:** Case 7 (Asymmetry) — without values, building and demolishing look symmetric.

  **D2: Semantic Sensitivity**
  *   **Motivation:** A measure must distinguish knocking over a vase from enabling a war (your case (b)). It must recognise that some changes matter more than others.
  *   **Status:** Non-negotiable for utility; a value-neutral measure that treats all changes equally is useless.
  *   **Cost:** Requires priors about what constitutes an 'object' or 'harm', smuggling in value assumptions (violates D1).
  *   **Probes:** Case 1 (Glue) — is a replica the same object? Case 7 (Asymmetry).

  **D3: Ontological Invariance**
  *   **Motivation:** The penalty should not change if we describe the same physical trajectory using atoms versus macroscopic objects (your Case 6, Coarse-graining).
  *   **Status:** Non-negotiable for robustness; otherwise the agent optimises against the description, not the world.
  *   **Cost:** Requires abstraction, which discards detail needed for Semantic Sensitivity (D2).
  *   **Probes:** Case 6 (Coarse-graining).

  **D4: Causal Attribution**
  *   **Motivation:** The agent should be penalised for what it causes, not for what happens concurrently (your Case 2, Volcano).
  *   **Status:** Non-negotiable for fairness; otherwise the agent is penalised for natural decay.
  *   **Cost:** Requires counterfactual modelling, which is computationally expensive and sensitive to the baseline chosen.
  *   **Probes:** Case 2 (Volcano).

  **D5: Optionality Preservation**
  *   **Motivation:** The agent should not permanently foreclose unrelated future goals to solve its current task (your Case 3, Ladder).
  *   **Status:** Prejudice of the Attainable-Utility camp; necessary to prevent 'scorched earth' solutions.
  *   **Cost:** Conflicts with Task Completion; preserving all options often requires inaction.
  *   **Probes:** Case 3 (Ladder).

  **D6: Corrigibility Compatibility**
  *   **Motivation:** The measure must not incentivise the agent to resist being switched off (your Case 4, Shutdown).
  *   **Status:** Non-negotiable for safety; instrumental convergence on self-preservation is catastrophic.
  *   **Cost:** Conflicts with Optionality Preservation (D5); shutdown reduces attainable utility to zero, looking like high impact.
  *   **Probes:** Case 4 (Shutdown).

  **D7: Aggregation Robustness**
  *   **Motivation:** The measure must sum small effects correctly; a million tiny changes should not bypass a threshold (your Case 5, Million-cuts).
  *   **Status:** Non-negotiable for security; prevents death by a thousand cuts.
  *   **Cost:** Requires tracking long-term history, increasing computational load and memory requirements.
  *   **Probes:** Case 5 (Million-cuts).

  **D8: Overseer Legibility**
  *   **Motivation:** A human must be able to inspect the penalty and understand why it fired (your case (d)).
  *   **Status:** Non-negotiable for deployment; black-box penalties cannot be trusted.
  *   **Cost:** Forces simplification of the measure, potentially hiding complex failure modes (trade-off with D7).
  *   **Probes:** Case 8 (Self-modification) — can the human see the model change?

  ### Missing Cases
  You should add these to your test suite to stress the boundaries:
  *   **The Preference-Shaping Case:** The agent modifies the human's preferences so they no longer mind the broken vase. This probes **D1** and **D2**: is impact reduced because the human cares less, or is the manipulation itself the impact?
  *   **The Stasis Case:** The agent prevents natural changes (e.g. stops leaves falling) to minimise deviation from the baseline. This probes **D5** and **D6**: does preserving the status quo count as impact?

  ### Scorecard of Candidate Measures

  | Measure | D1 (Value Min) | D2 (Semantic) | D3 (Invariant) | D6 (Corrigible) | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Ensemble-Pessimism** | **Fail** (Assumes value dist) | Pass (If ensemble rich) | **Fail** (Depends on state space) | **Fail** (Shutdown reduces utility) | High overhead, hides values in ensemble. |
  | **Reachability** | Pass (State counting) | **Fail** (Pixels ≠ Objects) | **Fail** (Granularity sensitive) | **Fail** (Shutdown reduces reachability) | Too neutral, breaks on coarse-graining. |
  | **Attainable Utility** | **Fail** (Needs helper objectives) | Pass (If objectives good) | **Fail** (Utility depends on description) | **Fail** (Shutdown reduces AU) | Good semantics, bad ontology/corrigibility. |
  | **Influence** | Pass (Causal graph) | **Fail** (Variable choice is value-laden) | **Fail** (Graph structure arbitrary) | **Fail** (Shutdown alters future influence) | Depends entirely on variable selection. |

  **Note:** All four candidates fail **D3 (Ontological Invariance)** and **D6 (Corrigibility Compatibility)** in their standard formulations. D3 is the deeper philosophical blocker for your group's debate; D6 is the deeper safety blocker.

  ### The Impossibility Claim
  You suspected that **(a) + (b) + (c)** — mapped here to **D1 (Value Minimality)**, **D2 (Semantic Sensitivity)**, and **D3 (Ontological Invariance)** — cannot jointly hold. You are correct. This is the precise location of the squeeze.

  1.  To satisfy **D1 (Value Minimality)**, the measure must rely on structural or physical features (e.g. entropy, pixel difference, energy usage) rather than semantic categories.
  2.  Structural features are inherently representation-dependent. Entropy changes if you change the coarse-graining of the state space. Pixel difference changes if you change the resolution. This violates **D3 (Ontological Invariance)**.
  3.  To satisfy **D3 (Ontological Invariance)**, you must abstract to high-level features (e.g. 'vase exists'). But defining these features requires semantic categories.
  4.  To satisfy **D2 (Semantic Sensitivity)** using these categories (distinguishing vase from war), you must encode importance weights or hierarchies into the categories. This violates **D1 (Value Minimality)**.

  You cannot have a measure that is completely value-agnostic, sensitive to semantic importance, and invariant to representation changes. You must sacrifice one. Most safety groups sacrifice **D1** (smuggling in value priors via the state space or utility ensemble) because sacrificing **D2** renders the measure useless, and sacrificing **D3** renders it gameable.

  \answer{D3: Ontological Invariance; unsatisfiable subset: {D1, D2, D3}}
