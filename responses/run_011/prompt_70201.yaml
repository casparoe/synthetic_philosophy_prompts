      *Wait, one more thought:* Is there a better fit? **Social Epistemology of Expertise (Goldman)**? No. **Testimonial Injustice (Fricker)**? No. **Assurance** is the standard "third way" between Hume and Reid. I will stick with that. It explains why anonymous posts are epistemically different *in kind*, not just in degree of evidence.

      *Wait, looking at the "Dev" case:* Dev *acted*. The debate is about whether he was "epistemically in the clear." This implies justification for belief/action. The Assurance view explains why he *couldn't* know, not just why he shouldn't believe.
      Actually, **Pragmatic Encroachment** is a strong contender for the "missing thing" because Ines keeps mentioning "expense" and "cheap checks." But the prompt asks for a "third position on testimony." Pragmatic Encroachment is a theory about knowledge attributions, not specifically testimony. Assurance is better.

