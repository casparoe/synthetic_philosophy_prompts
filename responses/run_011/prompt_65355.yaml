answer: |-
  Here is the teaching plan. I have made decisive choices on the case study and the ordering. I am not offering options.

  ### 1. Dependency Structure

  Your intuition is 80% correct, but the placement of "Many Hands" is the weak link. You have it as a precursor to the ML wrinkle. It should be the **foil**.

  If you teach the Responsibility Gap *before* Many Hands, engineers will solve the Gap by saying, "This is just distributed responsibility; we map the chain, assign percentages, and move on." They will treat the Gap as a bookkeeping error. You need to show them that Many Hands works for *standard* complex systems, but breaks for *adaptive* ones.

  **Corrected Ordering:**
  1.  **The Anchor (Minutes 0–10):** Establish the **Control and Epistemic Conditions**. (You cannot be responsible for what you couldn't control or foresee). *Load-bearing premise: I flag this below.*
  2.  **The Baseline (Minutes 10–20):** Introduce the **Problem of Many Hands**. Show how traditional engineering distributes responsibility (Design $\rightarrow$ Build $\rightarrow$ Deploy $\rightarrow$ Operate). Show that in traditional systems, even if diluted, the chain of *traceability* remains intact.
  3.  **The Break (Minutes 20–35):** Introduce the **Adaptive/ML Wrinkle**. Show how on-board learning/OTA updates sever the traceability link established in step 2. The system's disposition was not in the code *ex ante*.
  4.  **The Gap (Minutes 35–45):** Demonstrate the **Remainder**. Harm occurred. No individual meets the Anchor conditions. Many Hands cannot distribute what isn't traceable.
  5.  **The Assessment (Minutes 45–50):** The diagnostic question.

  **Why this order?**
  If you start with the Gap, they will try to solve it with Many Hands. If you start with Many Hands, you validate their usual workflow, then show them exactly where it fails. This prevents the "philosophy cosplay" accusation because you are using their framework (traceability) to demonstrate the breakdown.

  ### 2. The Carrying Case

  **Verdict:** Your infusion pump scenario is **too messy**. You must replace it.

  **Why:** You included "informally muting alarm escalations" and "calibration drift." These are **negligence**.
  *   If nurses mute alarms, they are negligent. Responsibility found. Gap closed.
  *   If maintenance ignores drift, they are negligent. Responsibility found. Gap closed.
  *   If the vendor's documentation was "honest" but the update caused harm, that sounds like a legal warranty issue, which triggers the "Strict Liability" dodge immediately.

  Your goal is a scenario where **everyone acted reasonably ex ante**, yet harm occurred **ex post** due to the adaptive nature of the system.

  **Replacement Case: The Adaptive Delivery Drone**
  *   **System:** A quadcopter delivery fleet using on-board reinforcement learning to navigate urban wind tunnels.
  *   **Event:** Drone #402 encounters a novel turbulence pattern (not in training, not in sim). To stabilize, its policy network prioritizes motor torque over payload retention. It drops a 5lb package on a pedestrian.
  *   **The Constraints:**
      *   **Programmer:** Wrote the reward function (stabilize + deliver). Could not foresee specific turbulence interaction.
      *   **Operator:** Monitoring 50 drones. No alarm triggered (system reported "stable adjustment").
      *   **Company:** Followed all FAA regs. OTA update was standard procedure.
      *   **The ML Wrinkle:** The specific decision weights were generated *during* the flight based on the live stream, not fixed in the deployment code. Post-hoc analysis cannot reconstruct *why* the network chose torque over retention (black box).

  **Why this works:**
  1.  **No Villains:** No one muted alarms. No one ignored drift. Everyone followed protocol.
  2.  **No Institutional Dodge:** "Blame the company" doesn't work because the company *cannot* explain the specific decision. You can fine the company, but can you morally blame them for a decision they didn't make and can't understand?
  3.  **Controls Relevance:** This is pure controls/ML. It speaks their language (reward functions, OTA, telemetry).

  ### 3. Misconception Map

  You predicted four. You are missing the most dangerous one for this audience: **The Forward-Looking Dodge.** Engineers are trained to fix systems, not assign blame. They will try to convert the ethical question into a safety engineering question.

  **Order of Emergence & Handling:**

  1.  **"The Programmer Wrote the Code" (Minute 15)**
      *   *When:* During the "Break" phase.
      *   *Response:* **Argue.** Remind them of the Anchor (Control/Epistemic). Did the programmer control the specific weight adjustment at $t=40s$? No. Did they know it would happen? No.
      *   *Status:* **Engage.**

  2.  **"Human-in-the-Loop Shield" (Minute 25)**
      *   *When:* During the "Gap" phase. "The operator could have overridden."
      *   *Response:* **Argue.** The telemetry said "stable." Reaction time < human capability. If you require a human to catch ML errors, why have ML?
      *   *Status:* **Engage.**

  3.  **"Forward-Looking Responsibility" (Minute 35)**
      *   *When:* As soon as they realize no one is to blame. "Okay, so no one is *blameworthy*, but the company is *responsible* for fixing it."
      *   *Response:* **Bracket.** Explicitly distinguish *backward-looking blame* (who pays the moral price?) from *forward-looking duty* (who fixes the bug?). Acknowledge the duty exists, but insist the *blame* gap remains.
      *   *Status:* **Bracket (Do not argue, just distinguish).**

  4.  **"Strict Liability / Legalism" (Minute 40)**
      *   *When:* "Just sue the company. That's what liability insurance is for."
      *   *Response:* **Refuse.** State clearly: "We are discussing *moral* responsibility, not *legal* liability. Law can assign cost arbitrarily. Morality requires a link to agency. We are investigating the moral link."
      *   *Status:* **Refuse (Declare out of bounds).**

  5.  **"Machine Moral Status / Luddite" (Minute 45)**
      *   *When:* Desperation moves. "Blame the drone" or "Don't deploy drones."
      *   *Response:* **Dismiss.** "We are not granting rights to drones, and we are not banning tech. We are analyzing the aftermath of deployment."
      *   *Status:* **Dismiss.**

  ### 4. Omissions (Announce These)

  To prevent the "dodging" accusation, write this on the board at Minute 5:

  **"Out of Scope for Today:"**
  1.  **Legal Liability:** We are not discussing who pays damages.
  2.  **Robot Rights:** We are not discussing if the system is an agent.
  3.  **Free Will:** We are assuming standard compatibilist conditions for humans.
  4.  **Safety Repairs:** We are not discussing how to prevent recurrence (Forward-Looking).

  *Reasoning:* This immunizes you against the "Strict Liability" and "Luddite" objections. You aren't ignoring them; you are methodologically bracketing them.

  ### 5. The Diagnostic Question (Last 5 Minutes)

  Do not ask "Do you agree?" They will be polite. Do not ask "Who is responsible?" They will guess what you want to hear.

  **Write this on the board:**
  > "Incident Report, Field 4: 'Cause of Harm.'
  > You must fill in the blank with a specific agent or entity.
  > If you write 'The Company,' explain what *moral* failing they committed beyond paying the bill.
  > If you write 'The System,' explain how a tool commits a moral wrong.
  > If you write 'No One,' explain why the victim's grievance is satisfied.
  > **You have 2 minutes. Write it down.**"

  **Why this works:**
  *   It forces them to commit to an ontological category (Agent vs. Tool vs. Void).
  *   It exposes the "Institutional Dodge" (The Company) by asking for the *moral failing*.
  *   It exposes the "Gap" (No One) by forcing them to confront the victim's perspective.
  *   Collecting these papers gives you immediate data on whether they understood the *tension* or just nodded along.

  ### 6. Load-Bearing Premises (Warning)

  There is one philosophical claim in this plan that a smart controls student will attack. You need to know it's coming.

  **The Control Condition:**
  Your entire argument rests on the claim that **Moral Responsibility requires Control (and Epistemic Access).**
  *   *The Attack:* A student will say: "Why? In engineering, we use 'Outcome Responsibility.' If your system kills someone, you own it, regardless of control. That's the price of deployment."
  *   *The Risk:* If they successfully argue for Outcome Responsibility (Strict Liability as a moral principle, not just legal), the Responsibility Gap disappears. The Gap only exists if you insist on *Blame* rather than *Cost*.
  *   *Your Defense:* Do not deny Outcome Responsibility. Concede it exists *pragmatically*. But insist that *Blame* (the reactive attitude of resentment/indignation) requires Control. Ask them: "Can you genuinely resent the Company for a decision they couldn't predict? Or are you just treating them as a deep pocket?"
  *   *Why flag this:* If you don't distinguish *Blame* from *Liability*, the session will collapse into a tort law discussion. Keep the distinction sharp.

  ### Summary of Commitments
  *   **Case:** Adaptive Delivery Drone (Sanitized of human negligence).
  *   **Order:** Conditions $\rightarrow$ Many Hands $\rightarrow$ Adaptive Break $\rightarrow$ Gap.
  *   **Misconception to Kill:** "Forward-Looking Responsibility" (Bracket it, don't argue it).
  *   **Misconception to Refuse:** "Legal Liability" (Declare out of scope).
  *   **Load-Bearing Premise:** Responsibility requires Control (be ready to defend this against Outcome Responsibility).

  This plan respects their expertise while forcing them into the philosophical trap you've set. It avoids cosplay by using their ontology (systems, updates, telemetry) to demonstrate the philosophical problem.
