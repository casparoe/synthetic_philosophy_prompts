  Your friction analogy fails because friction is an external impediment to motion, whereas logical consequence is constitutive of the content believed. The possible-worlds framework is not designed to simulate the cognitive processing limits of finite agents, a task best left to cognitive science, but to map the normative landscape of informational commitment. We must distinguish between explicit belief, the psychological occurrence of assent, and implicit belief, the set of propositions entailed by what is accepted. On this view, your cousin does not psychologically harbor the entirety of arithmetic, but he is committed to it in virtue of accepting the axioms, and the model captures that commitment precisely. The lack of a competence parameter is not a defect but a reflection of the fact that logical truth does not come in degrees; the model describes the space of reasons, not the machinery of inference.

  Genuinely contested: while the explicit/implicit distinction is standard, whether this rescues the possible-worlds account of *belief* (rather than just information) is heavily debated.
