      *(Refining the "What Breaks" section)*: Be careful. If you allow incoherence, you allow someone to post P(A)=0.9 and P(not A)=0.9. If no one catches it, they can take bets on both sides and guarantee a profit (if the stakes allow). But with a $50 cap, the "guaranteed profit" is limited. The real risk is the *scoring* becomes meaningless if incoherent probabilities aren't penalized. But the prompt says they bet on the claims, not just score them. So the "market" corrects incoherence if others spot it. The rule just makes it *mandatory* to exploit. Relaxing it makes it *optional*.

      *(Final thought on the "Effort" proposal)*: If I charge the challenger for their time, how do we value time? Hourly rate? If the Mathematician values his time at $0 (hobby), he wins. If we set a fixed fee, say $20, it might deter valid challenges. Maybe a "bond" system? Challenger posts a bond, if the derivation is accepted as valid, the bond is returned + prize. If invalid, bond is forfeit. This addresses the "fishing expedition" risk.

