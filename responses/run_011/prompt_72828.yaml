answer: |-
  "Leave it."

  "You're not serious." Elena pushed the leather folder back across the table. "The price is on the menu. We paid it."

  Marcus didn't touch the folder. "The menu price covers the food and the house's service charge. You know where that twelve percent goes. It goes into the owner's pocket. It does not go to the guy who brought us water for an hour."

  "So the owner has offloaded his payroll onto us," Elena said. "I'm not going to be the mark for his racket. At home, this would be considered insulting. We pay staff a wage. We don't perform this charitable calculation at the end of a meal."

  "You're not at home. You're here. And you know the facts." Marcus leaned forward. "You've been here three months. You know that without the extra, the server goes home with barely enough to cover rent. You know everyone local leaves it. Knowing that creates the obligation."

  "Does it? Or does it just create pressure?" Elena tapped the table. "I'm a guest, not a citizen. Why does a convention I never signed up for bind me? If morality leaves it indeterminate how much to pay for service, why can't my home convention settle it? Prices are prices."

  "Because actions aren't just physical movements; they're speech. Here, leaving nothing says 'you deserve nothing.' At home, it says 'the price was covered.' You can't import the meaning from home when the context changes the message."

  "That's just social sanction dressed up as semantics," Elena countered. "If I don't pay, they'll give me a cold look. Maybe I get a worse table next time. They'll call me difficult. But sanctions don't prove obligation. People sanction heretics too. That doesn't make the heresy wrong."

  "This isn't about heresy. It's about harm." Marcus's voice dropped. "You're arguing about the principle of the system. I'm talking about the person who cleared the plates. You want to boycott the owner's exploitation? Fine. But your refusal doesn't cost the house anything. The service charge is already theirs. The only person who loses income is the server. You're punishing the victim to make a point to the victimizer."

  Elena paused. She looked at the folder. "If I pay, I validate the system. I tell the owner he doesn't need to pay them properly because the customers will cover it."

  "And if you don't, you tell the server he doesn't need to eat properly because your principle is more important than his rent." Marcus held her gaze. "You're treating him as a means to your moral purity. You want to be the one who doesn't tip, regardless of what that does to him."

  "It's not just me. If everyone refused, the system would break."

  "But everyone isn't refusing. You're the only one at this table. You're a temporary participant. You get to leave in three months. He stays." Marcus tapped the folder. "This isn't a disagreement about principle. We both agree he deserves a living wage. We disagree about the institutional facts. You think your refusal hits the owner. It doesn't. It hits him."

  Elena was quiet for a long moment. The restaurant noise seemed to swell around them. She looked toward the kitchen doors, then back at the bill.

  "I hate this," she said softly.

  "I know."

  "If I pay, I'm admitting that individual charity fixes structural rot."

  "You're admitting that structural rot doesn't excuse individual harm." Marcus slid a pen toward her. "You don't have to like the system to fulfill the obligation the context creates."

  Elena picked up the pen. She opened the folder. "This isn't a tip," she said, writing on the slip. "It's a ransom. I'm buying him out of the mess the owner made."

  "Call it what you want. He'll call it wages."

  Elena signed, tore off the receipt, and left the cash on the table. "Next time, we're cooking at home."

  "Next time," Marcus said, standing up, "you'll know the price before you sit down."
