answer: |-
  ### Reality Check: The "Same Preferences" Problem
  **Flag:** You wrote: *"everyone gets the same fixed set of ranked preferences."*
  **Correction:** If everyone has the same preferences (e.g., everyone prefers A > B > C > D), there is no conflict, no incentive to lie, and no game. Strategic voting requires **divergent** preferences. I have designed the game below with **four factions** holding different preference orders. This mirrors your student senate story (clubs coordinating) and is necessary for the theorem to hold.

  **Flag:** You wrote: *"Random dictatorship... basically the only thing immune to this."*
  **Clarification:** It is the canonical example of a strategy-proof mechanism, but technically any probabilistic mechanism where an individual cannot affect the probability distribution of outcomes is immune. However, for an intro class, Random Dictatorship is the correct counter-example to use. I have adjusted the debrief to emphasize *why* it's immune (you have no influence to manipulate) rather than just saying it's "immune."

  ---

  ### The Game: "The Party Protocol"

  **Concept:** The class must choose the end-of-semester celebration. There are 4 options. Students are divided into 4 Factions. They play 3 rounds of voting under different rules, then a 4th "escape hatch" round.
  **Time:** 50 Minutes (Hard Stop)
  **Class Size:** 24 Students

  #### 1. Materials & Setup
  *   **Seating:** Arrange desks into 4 clusters of 6 students. Label them Faction A, B, C, D.
  *   **Projector/Board:** To display the "Preference Cards" and Tally Sheets.
  *   **Ballots:** 24 small slips of paper per round (or just have them raise hands/count publicly to save time—*recommendation: public hand count for speed*).
  *   **Incentive:** "Class Points." If the class aggregate score (sum of individual satisfaction) exceeds a threshold, everyone gets 5 minutes off next class or a small candy bar. This makes the "score" matter.

  #### 2. Preference Profiles (The Engine)
  *Display this on the board immediately. Do not let them change this.*

  | Faction | Size | 1st Choice | 2nd Choice | 3rd Choice | 4th Choice |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Faction A** | 6 | **Pizza** | Burger | Taco | Salad |
  | **Faction B** | 6 | **Burger** | Taco | Salad | Pizza |
  | **Faction C** | 6 | **Taco** | Salad | Burger | Pizza |
  | **Faction D** | 6 | **Salad** | Taco | Burger | Pizza |

  *Note: Pizza is the polarizing frontrunner (Faction A loves it, everyone else ranks it last). This sets up the "burying" strategy.*

  #### 3. Scoring System (Satisfaction Points)
  To track who "won," assign points based on where the *final winner* lands on their personal ballot:
  *   **1st Choice:** 4 Points
  *   **2nd Choice:** 2 Points
  *   **3rd Choice:** 1 Point
  *   **4th Choice:** 0 Points
  *   **Goal:** Maximize your Faction's total points. (Faction size × points per person).

  ---

  ### Minute-by-Minute Timeline

  **0:00 – 0:05: Setup & Stakes**
  *   Seat students in factions.
  *   Display Preference Profiles.
  *   Explain Scoring System.
  *   **Rule:** "You may talk within your faction. You may not talk to other factions. You must vote sincerely... unless you think you can get away with it." (Wink).

  **0:05 – 0:15: Round 1 — Plurality (First-Past-The-Post)**
  *   **Rule:** Vote for **one** option only. Most votes wins.
  *   **Action:** Sincere vote first.
      *   *Tally:* Pizza (6), Burger (6), Taco (6), Salad (6). **Result:** 4-Way Tie. (Break tie randomly, e.g., die roll. Let's say **Pizza** wins).
      *   *Score:* Faction A gets 24 pts. Factions B, C, D get 0 pts. Total Class Score: 24.
  *   **The Twist:** "Reset. You know the profile. You know Pizza wins if you split. Vote again."
  *   **Action:** Strategic vote. Factions B, C, D realize they all hate Pizza. They coordinate (implicitly or explicitly) to vote for the strongest alternative. Say B, C, D all vote **Burger**.
      *   *Tally:* Burger (18), Pizza (6). **Result:** Burger wins.
      *   *Score:* Faction B (24), Faction C (12), Faction D (6), Faction A (0). Total Class Score: 42.
  *   **Takeaway:** Plurality incentivizes "Lesser of Two Evils" voting.

  **0:15 – 0:25: Round 2 — Borda Count (Points System)**
  *   **Rule:** Rank all 4. 1st=4pts, 2nd=3pts, 3rd=2pts, 4th=1pt. Highest total score wins.
  *   **Action:** Sincere vote.
      *   *Math (Project this):* Pizza gets huge 4s from A, but 1s from everyone else. Burger gets 3s from A, 4s from B, 2s from C, 2s from D.
      *   *Result:* Usually, the consensus candidate (Burger or Taco) wins over the polarizer (Pizza). Let's assume **Burger** wins sincerely.
  *   **The Twist:** "Faction A, you are losing. You know Borda is vulnerable to 'burying.' If you rank the strongest competitor (Burger) **last**, can you change the outcome?"
  *   **Action:** Faction A votes: Pizza > Taco > Salad > **Burger (Last)**.
      *   *Result:* By burying Burger, Faction A might make **Pizza** win, or cause a cycle.
      *   *Takeaway:* Even "nicer" systems invite strategic ranking (truncation/burying).

  **0:25 – 0:35: Round 3 — Instant Runoff (Hare System)**
  *   **Rule:** Rank all. If no majority, eliminate lowest, redistribute.
  *   **Action:** Sincere vote.
      *   *Scenario:* Salad eliminated first. Votes transfer. Eventually, Pizza might get eliminated early because they have no 2nd place support.
  *   **The Twist:** "Faction C, you prefer Taco. But you know Taco will be eliminated before Pizza. If you insincerely rank **Pizza 2nd**, does Taco survive longer?"
  *   **Takeaway:** IRV reduces strategic voting but does not eliminate it (Monotonicity failure).

  **0:35 – 0:40: Round 4 — Random Dictatorship**
  *   **Rule:** "I will put all 24 names in a hat. I draw one name. That person's #1 choice becomes the class winner. Everyone else gets the points corresponding to that choice."
  *   **Action:** Ask: "Does anyone want to lie about their preference?"
  *   **Result:** Silence. No incentive to lie. Your best move is to write your true #1, because if you are picked, you want your favorite. If you aren't picked, your ballot doesn't matter.
  *   **Takeaway:** Strategy-proof, but feels illegitimate.

  **0:40 – 0:50: Debrief & Theorem Mapping**
  *   Connect the room experience to Gibbard-Satterthwaite.

  ---

  ### The Debrief: Mapping Room to Theory
  *Write these three conditions on the board during the debrief.*

  1.  **Condition 1: 3+ Options.** (We had Pizza, Burger, Taco, Salad).
  2.  **Condition 2: Not a Dictatorship.** (Rounds 1-3 were democratic; Round 4 was the "Dictator" escape hatch).
  3.  **Condition 3: Deterministic.** (The rules said exactly how votes translate to winners).

  **The Punchline:** "In Rounds 1, 2, and 3, at least one of you found a moment where lying got you more points than telling the truth. That isn't an accident. That isn't a flaw in *this* specific rule. That is a mathematical feature of *any* rule that meets conditions 1, 2, and 3."

  **Connect to Student Senate:** "Your student senate didn't break because students were 'immoral.' They broke because the voting system invited them to play a game where sincerity was a losing strategy. The system rewarded the coordination you saw."

  ---

  ### What Will Go Sideways (And How to Recover)

  **1. The Math Bottleneck (High Risk)**
  *   **Problem:** Counting Borda or IRV ballots for 24 students takes 10+ minutes. You will run out of time.
  *   **Recovery:** **Do not collect paper.** Do public hand counts. "Faction A, how many rank Pizza 1st? Raise hands." You write the numbers on the board. Pre-calculate the "Sincere" outcomes yourself so you can reveal the "Strategic" outcome instantly if they get stuck.
  *   **Backup:** If counting takes too long, skip Round 3 (IRV). Plurality and Borda are enough to prove the point.

  **2. The "Why Do We Care?" Problem**
  *   **Problem:** Freshmen might not care about "Class Points."
  *   **Recovery:** Make the stakes tangible. "If the Total Class Score averages above 2.5 points per person, I dismiss you 5 minutes early on Friday." Or bring a bag of candy; high scorers get two pieces.

  **3. Over-Collusion**
  *   **Problem:** Factions might merge. "Let's all just vote Pizza to end this."
  *   **Recovery:** Remind them of the Scoring System. "If Pizza wins, Faction B gets **zero** points. You are actively hurting your grade/reward by colluding for the wrong winner."

  **4. The Random Dictator Confusion**
  *   **Problem:** Students think Random Dictatorship means "One person decides for everyone forever."
  *   **Recovery:** Clarify: "It means the *procedure* selects a dictator for *this vote only.* It's about the mechanism, not the government type."

  ---

  ### Limitations: What This Game Can't Show
  *Be honest about this in the last 2 minutes.*

  1.  **Intensity of Preference:** The game assumes 4 points for 1st choice and 0 for 4th. In real life, people might feel *much* more strongly about one issue (e.g., abortion rights vs. park funding). Voting systems struggle to measure intensity, not just rank.
  2.  **Information Costs:** In the game, everyone knows everyone's preferences (perfect information). In real life, strategy is hard because you don't know if your lie will work. The theorem assumes you *can* know; reality is you *might* guess.
  3.  **The "Why" of Random Dictatorship:** The game shows Random Dictatorship is strategy-proof, but it doesn't fully capture why it's politically unacceptable (lack of accountability, randomness vs. reason). You have to supply the philosophical weight there: "We want winners to be *responsible*, not just *lucky*."

  ### Final Instructor Note
  You are correct that the student senate imploded due to a **feature, not a bug**. This game validates your friends' anger while removing the moral judgment. The goal is to move them from "Those students were cheaters" to "Those students were rational actors in a flawed system." That is the political philosophy lesson.
