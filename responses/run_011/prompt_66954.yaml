prompt: |-
  So our student senate election imploded last month — a couple of clubs coordinated to bury their actual favorite in order to knock out the frontrunner, it worked, and now half my friends are furious about it like it was a moral failing instead of a feature of the rules. I've got a 50-minute section of intro political philosophy next Tuesday, 24 freshmen, and I want them to feel this rather than listen to me lecture about it.

  Design a game where everyone gets the same fixed set of ranked preferences over, say, four options at the start, then we run several rounds under different voting rules, and in each round somebody can gain by lieing about their ranking — they should notice the pattern before I ever name the theorem. Then I want one last round using random dictatorship, since I understand that's basically the only thing immune to this, so they feel why the escape hatch is one nobody actually wants.

  Give me: rules and materials, a scoring system that doesn't need real money, a minute-by-minute timeline, and a debrief that maps what happened in the room onto the actual conditions of the theorem. Also tell me what's going to go sideways the first time I run it with freshmen and how to recover, and be straight with me about which part of the result the game just can't reproduce so I have to supply it myself. Flag anything above where I've got it wrong.
