  To the member: Your reliance on the text ignores the Society's operational reality. The March amendments stand because the body accepted the procedure under which they were passed. To your second point: A ruling reversed on appeal is not retroactively erased from history; it is superseded. My duty is to articulate the rule as it stands before the appeal tests it. If the membership votes to reverse me, they are not proving I was wrong about the rule *then*, but changing the rule *now*. I will not treat the chair as a crystal ball. You suggest my ruling is theatre because it may be reversed. It is not theatre; it is the necessary precondition for the appeal to have meaning. If there is a precedent from the 1958 Quorum Crisis that suggests otherwise, you should have put it on the record before I ruled. Is there such a precedent I should be aware of before the appeal proceeds?
