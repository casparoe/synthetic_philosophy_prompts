answer: |-
  ### The Dependency Structure

  You must teach this session as a dismantling of an analogy, not a confirmation. The sequence must move from surface similarity to structural divergence, ending with the theoretical consequence. Do not begin with the statistical conjecture; it is the solution, not the premise.

  **Sequence and Allocations:**
  1.  **The Digital Illusion (5 mins):** Establish the all-or-none nerve impulse. This validates the students' Turing-era expectation that neurons are bits.
  2.  **The Component Reality (10 mins):** Introduce component imprecision. Neurons are unreliable; machine parts are precise. This creates the first tension.
  3.  **The Architectural Contrast (15 mins):** Define natural automata (parallel, shallow) vs. artificial automata (serial, deep). This is the pivot.
  4.  **The Function of Depth (10 mins):** Explain that machines use serial depth to buy precision through checking. Brains cannot do this.
  5.  **The Memory Arithmetic (10 mins):** Perform the lifetime intake calculation (2.8 x 10^20 bits). This quantifies the storage crisis.
  6.  **The Statistical Solution (15 mins):** Conclude with the statistical language and non-Aristotelian logic. This resolves how the brain works without depth or precise storage.
  7.  **Discussion (10 mins):** Open floor.

  **Dependencies:**
  Step 3 (Architecture) depends on Step 2 (Components). If you claim the brain is parallel before establishing that its components are noisy, students will ask why parallelism matters. Step 6 (Statistical Language) depends critically on Step 3 and Step 5. The statistical conjecture is von Neumann's response to the lack of serial depth and the memory capacity gap. If you introduce the statistical language before the parallel-versus-serial contrast, it will appear as a disconnected philosophical musing rather than a necessary engineering adaptation. The reverse order is not defensible; without the architectural constraint, the statistical solution lacks a problem to solve. Step 5 (Arithmetic) reinforces Step 6 by showing that standard storage is impossible, necessitating the alternative substrates (synaptic thresholds) that enable statistical coding.

  ### The Carrying Example

  Do not use the memory arithmetic as the spine; use it as the climax. The spine of the session must be the **contrast in operational depth**.

  Build the session around the comparison of how a machine adds a column of numbers versus how a brain recognizes a face. The machine does this serially, checking each step to ensure precision (deep). The brain does this simultaneously across many pathways, accepting noise to achieve speed (shallow). This example carries the argument because it visualizes the trade-off between reliability and speed without requiring neuroscience.

  The memory arithmetic (1.4 x 10^11 bits/sec intake) functions best as a late payoff. It must have clear, board-friendly numbers that students can verify mentally. It must lack any discussion of specific neural encoding mechanisms (e.g., spike timing details) which would bog down the logic. If you place the arithmetic too early, it becomes a dry calculation disconnected from the architectural argument. If you place it just before the statistical conjecture, it acts as the quantitative proof that standard storage fails, forcing the need for von Neumann's speculative substrates. The arithmetic proves the *necessity* of the statistical language; the operational depth contrast explains its *structure*.

  ### The Misconception Map

  | Misconception | Point of Formation | Preemptive Claim |
  | :--- | :--- | :--- |
  | **Von Neumann endorsed "brain-as-computer."** | Introduction (Step 1). | "He starts with similarities to lure us, then spends the book dismantling the equivalence." |
  | **2.8 x 10^20 is memory capacity.** | Memory Arithmetic (Step 5). | "This is lifetime *input*, not storage. The puzzle is how the brain stores this without enough neurons." |
  | **Statistical language = Bayesian inference.** | Statistical Solution (Step 6). | "He means message degradation tolerance, not hypothesis testing or modern probabilistic programming." |
  | **He anticipated connectionism/deep learning.** | Architectural Contrast (Step 3). | "He describes parallelism, but lacks learning rules. Do not anachronistically grant him backpropagation." |
  | **Precision and reliability are identical.** | Component Reality (Step 2). | "Precision is exactness of parts; reliability is system function despite noisy parts. Machines need the former; brains use the latter." |

  ### What I Will Not Explain

  You must explicitly announce three exclusions at the start of Step 3 to prevent scope creep. First, set aside **Shannon's information theory**. While von Neumann uses bits, he is not applying Shannon's channel capacity theorems rigorously; invoking Shannon will confuse students about whether von Neumann is measuring bandwidth or logic. Second, exclude **probabilistic logics and error-correcting constructions**. These are technical solutions von Neumann developed elsewhere; here, he is speculating on biology, not engineering circuits. Third, omit **automata theory and self-reproduction**. Although relevant to his broader work, these distract from the specific brain-machine comparison. State clearly: "We are looking at his speculation on neural substrate, not his proofs on machine construction." Finally, do not explain the **neurophysiology of synaptic thresholds**. Students have no neuroscience background; treat substrates as conceptual placeholders for "unknown storage mechanisms" rather than biological facts.

  ### The Check

  In the final five minutes, ask this question: **"Von Neumann suggests the brain's logic allows small premise changes to produce small conclusion changes. Why does he think the brain *needs* this property, whereas his own machines avoid it?"**

  A **passing answer** will link the logic to the architectural constraints: "Because the brain is shallow and parallel with noisy components, it cannot afford strict formal logic which breaks under noise. It needs a logic that tolerates error."

  A **failing answer** will treat it as a feature rather than a constraint: "Because human thinking is fuzzy," or "Because brains are more advanced than computers." These answers recall the slogan's rejection but miss the structural *why* established in the session.
