          *   *Analysis:* This is the critical vulnerability. This is the "Verification Problem." If I submit `CooperateBot` but run `DefectBot`, the system collapses.
          *   *Solution:* You need a **Trusted Third Party (TTP)** or a **Secure Enclave** (like Intel SGX) where the code is submitted, verified, and executed in a black box that neither party can tamper with. Without this, it's just cheap talk.
