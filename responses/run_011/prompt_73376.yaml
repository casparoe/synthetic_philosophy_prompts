answer: |-
  ### The Principle of Representational Integrity

  A software system may act in the organization's name without a human in the loop if and only if it satisfies all three of the following conditions:

  1.  **The Attestation Constraint:** The act must not certify facts, compliance, or legal status that require personal knowledge or judgment.
      *   *Motivated by Case (3).* A regulatory filing signed by the Executive Director asserts, "I have verified these numbers." Software cannot verify; it can only calculate. Allowing this severs the link between authority and responsibility. This distinguishes (3) from (2); a routine reply conveys information, whereas a filing attests to truth under penalty.
  2.  **The Transparency Constraint:** The act must not simulate human agency, emotion, or presence where the recipient reasonably expects a human, unless the non-human nature is disclosed at the point of interaction.
      *   *Motivated by Case (8) and (9).* The value of a distress line is human empathy. Simulating this without disclosure is deceptive (8). Disclosure restores integrity (9). This also governs the Condolence Note; sending a note expressing personal grief from a template without review simulates a relationship that does not exist.
  3.  **The Reversibility Constraint:** The act must not create an external obligation or alter an external party's rights irreversibly. If binding occurs, the counterparty must know the commitment is provisional, and withdrawal must be possible before detrimental reliance.
      *   *Motivated by Case (5), (6), and (11).* Deleting spam (11) permanently destroys external communications that may be legitimate; deleting internal duplicates (10) does not. Negotiating a lease (5) binds the organization; allowing a void window (6) mitigates this, but only if the binding nature is truly provisional *to the other side*.

  **Internal Efficiency Exception:** Constraints 1 and 2 do not apply to internal operational acts (scheduling, budgeting, file management) provided they are logged and reversible within the organization.
  *   *Motivated by Case (4), (7), and (10).* These acts do not establish external relationships or attest to external truths.

  ---

  ### Accommodation of Your Marks

  This principle accommodates ten of your eleven marks cleanly. It resolves the Condolence Note as a **Fail** (violates Transparency: it simulates personal grief).

  It conflicts with **Case (6)**. You marked it a **Pass**, though uneasily. Under the Reversibility Constraint, (6) passes *only if* the landlord's system knows the deal is voidable. If the landlord believes the deal is final for 48 hours, they may rely on it (turning away other tenants), making your voidance harmful. If the "binding" is merely a handshake subject to written ratification, it passes. If it is a legal contract subject to breach, it fails.

  **Recommendation:** Overturn the mark on Case (6) to **Fail** unless the policy explicitly requires that the counterparty be notified of the void window *before* commitment.
  *   *Reasoning:* Saving the mark requires adding complex machinery (defining "detrimental reliance" in policy). Overturning it creates a clean rule: *No external binding without mutual agreement on terms, including the terms of withdrawal.* This protects the nonprofit from accidental breach and aligns with your unease.

  **Recommendation:** Settle the Condolence Note as **Fail**.
  *   *Reasoning:* A condolence note is not administrative; it is relational. Sending one without human verification of the details (cause of death, dates) risks profound offense. The risk of getting it wrong outweighs the efficiency gain.

  ---

  ### Application to New Situations

  1.  **Triage System (Intake Ranking):** **Fail.**
      *   *Reasoning:* Violates the Transparency Constraint. Callers are not told they are being ranked by software. This affects their access to essential services (housing). The "black box" nature denies them the opportunity to provide context that might alter the ranking. They must be told the queue is algorithmic.
  2.  **Refusing Supervisor (Unlawful Instruction):** **Fail.**
      *   *Reasoning:* Violates the Attestation Constraint. Determining lawfulness is a judgment requiring legal knowledge and liability. Software can flag *risk*, but it cannot refuse *authority*. A human must make the refusal to own the legal consequence.
  3.  **System-System Budget Bargaining:** **Pass.**
      *   *Reasoning:* Falls under the Internal Efficiency Exception. No external party is involved; no external truth is attested. Provided the supervisors set the bounds (as in Case 4) and can audit the ledger, this is permissible.
  4.  **Emergency Eviction Stop (Irreversible, No Human):** **Pass (with Condition).**
      *   *Reasoning:* This triggers a **Necessity Override**. When the Duty of Care (preventing homelessness) conflicts with the Reversibility Constraint, and no human is reachable, the system may act to prevent immediate harm. *Condition:* The act must be logged as an emergency exception and ratified by a human within 24 hours. If the human would not have authorized it, the organization absorbs the cost of the error.

  ---

  ### The Two Questions

  **1. Do (2) and (3) differ in kind or only in degree?**
  They differ in **kind**.
  Case (2) is *transmission*; Case (3) is *testimony*.
  In (2), if the reply is wrong, the organization corrects the information. In (3), if the figure is wrong, the organization has lied under penalty. A signature is not merely a commitment to pay or perform; it is a verification of the signatory's mental state ("I have reviewed this"). Software has no mental state to verify. Allowing software to sign is not just a risky delegation; it is a category error. It asks the software to witness something it cannot perceive. You are not mystifying the signature; you are correctly identifying it as a claim about human attention, not just a token of authorization.

  **2. Does the distinction live in the system, the act, or the relationship?**
  It lives in the **relationship**.
  The software in Case (1) and Case (3) is identical. The act (sending data) is physically similar. The difference is what the recipient (the funder) is entitled to expect from the sender (the Director). The funder funds *you*, not your IT stack. They rely on your judgment. When you insert software between judgment and output without disclosure or verification, you alter the relationship from "trust in a professional" to "trust in a process."
  This is why Case (8) fails and Case (9) passes. The code is the same. The act (speaking) is the same. The only variable is the caller's understanding of who they are talking to. The ethical weight rests entirely on whether the recipient's expectations are being met or manipulated.

  ### Summary for the Board
  To meet your March deadline, propose the **Principle of Representational Integrity**. It reduces the "tool vs. agent" debate to three testable questions for any proposed system:
  1.  Is it claiming to know something only a human can know? (Attestation)
  2.  Is it pretending to be a human? (Transparency)
  3.  Is it tying our hands with outsiders without a way out? (Reversibility)

  If the answer to any is "yes," the system requires a human in the loop. This protects the organization from legal liability (3), reputational harm (8), and operational trap (5), while allowing efficiency where it is safe (4, 7, 10).
