  This is a substantive disagreement about the grounding of responsibility that has become verbally obscured by conflicting definitions of 'alternative possibility,' masking the deeper split between leeway-based and sourcehood-based theories. When pressed, flicker defenders admit the available alternatives are trivial (e.g., signaling the intervener versus acting on one's own) but insist that any logical possibility satisfies the Principle of Alternative Possibilities (PAP), whereas robustness critics concede the logical possibility exists but deny it is the *kind* of control relevant to blame. This reveals that the verbal dispute over action individuation is merely a symptom of the substantive divide: incompatibilists treat alternative possibilities as constitutive of responsibility, while compatibilists treat them as incidental to the actual sequence of events. The argument about the intervener's cue confirms this diagnosis, as incompatibilists require the cue to be indeterministically free to preserve leeway, while compatibilists argue the cue's metaphysical status is irrelevant to sourcehood, effectively turning the Frankfurt case into a proxy war for the broader determinism debate.

  Progress requires admitting that Frankfurt cases cannot settle the determinism debate on their own because they conflate the leeway condition with the sourcehood condition. A new case with the cue stripped out would not help, as the disagreement is not about the mechanics of intervention but about whether the actual sequence suffices for blame regardless of the modal sequence. Instead, progress would look like a methodological shift where semi-compatibilists stop trying to falsify PAP and instead argue directly that sourcehood is the sole grounding condition, while incompatibilists argue directly that sourcehood requires leeway, bypassing the technical stalemate over flickers. Until both sides acknowledge they are arguing past each other about which concept grounds responsibility rather than whether a specific case contains possibilities, the impasse will remain bedrock intuitions neither side can argue for.
