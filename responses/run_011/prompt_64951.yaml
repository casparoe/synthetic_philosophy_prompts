answer: |-
  ### Desiderata for Legitimate Retroactive Criminalization

  **1. The Foreseeability of Punishability**
  *   **What the theory must do:** It must distinguish between notice that conduct is *morally wrong*, notice that it is *illegal*, and notice that it attracts *individual criminal penalty* before a specific tribunal. It must specify which of these is the minimum threshold for legitimacy.
  *   **Concrete Case:** The Dönitz submarine warfare count. The defendant knew unrestricted warfare was conducted by the US (moral/strategic parity), knew it violated treaty protocols (illegality of state act), but did not know it constituted an individual crime punishable by hanging (criminal liability). A legitimate theory must explain why the tribunal punished him on other counts but not this one, without conceding that the law itself was void.
  *   **Mark:** Non-negotiable [Genuine Justice]. Without notice of *punishability*, the trial is a ritualized killing, not a judgment.

  **2. The Separability of Selectivity and Retroactivity**
  *   **What the theory must do:** It must determine whether the inability to charge the victors (selectivity) invalidates the law itself (retroactivity defect) or merely constitutes an unfair application of a valid law. It must state if a law is void if it cannot be applied symmetrically at the moment of enactment.
  *   **Concrete Case:** The Allied area bombing of Dresden and Tokyo versus the German bombing of Rotterdam. If the Charter criminalizes "indiscriminate bombing of civilians" but the tribunal lacks jurisdiction over Allied air commanders due to its constitutive charter, is the law against the German commanders invalid, or merely unjustly applied?
  *   **Mark:** Negotiable (Cost: Political Legitimacy) [Artifact of Domestic Model]. In domestic law, unequal application violates equal protection; in international transitions, perfect symmetry is often physically impossible. Insisting on it here may collapse the court, but conceding it renders the law "victor's justice."

  **3. The Reachability of Pre-Jurisdictional Atrocity**
  *   **What the theory must do:** It must establish whether crimes against humanity committed before the outbreak of war are punishable if they are not explicitly linked to the crime of aggression. It must justify the "nexus requirement" or reject it.
  *   **Concrete Case:** The persecution of German Jews between 1933 and 1939. Nuremberg held these were not Crimes Against Humanity because they were not committed "in execution of or in connection with" the war. A legitimate theory must decide if this nexus is a necessary jurisdictional hook or an unjust loophole that immunizes domestic tyranny until it spills over borders.
  *   **Mark:** Non-negotiable [Genuine Justice]. A theory that requires a war nexus to punish genocide allows states to exterminate their own citizens with impunity so long as they remain peaceful toward neighbors.

  **4. The Scope of *Nullum Crimen* Regarding Attribution**
  *   **What the theory must do:** It must clarify whether the principle of non-retroactivity applies only to the definition of the offense or also to the modes of liability (command responsibility, conspiracy, superior orders).
  *   **Concrete Case:** A subordinate executing a manifestly illegal order (e.g., shooting POWs) where domestic military law at the time mandated obedience on pain of death. If the tribunal rejects the "superior orders" defense retroactively, does this violate *nullum crimen* regarding the *attribution* of guilt, even if the act itself was known to be wrong?
  *   **Mark:** Negotiable (Cost: Individual Fairness) [Genuine Justice]. While the act's wrongness should be known, the shift in *who* bears the blame (subordinate vs. superior) is a technical legal change. However, shifting it retroactively to the subordinate violates the moral basis of culpability.

  **5. Symmetric Susceptibility (The "Founders in the Chair" Test)**
  *   **What the theory must do:** It must guarantee that the legal definitions and jurisdictional bounds are written such that the drafting state could theoretically be prosecuted under them. It must define what "symmetry" means when one side has won the war.
  *   **Concrete Case:** A stipulated future where the drafting state (e.g., the US or UK) invades a neighbor for resource extraction five years after drafting the statute. The statute must be intelligible enough that a judge could convict the drafting state's leaders using the same logic applied to the defeated enemy.
  *   **Mark:** Non-negotiable [Genuine Justice]. This is the core of the user's "forward-looking" constraint. Without this, the court is merely a tool of policy, not law.

  **6. The Function of Punishment (Condemnation vs. Quarantine)**
  *   **What the theory must do:** It must specify whether the penalty expresses moral blame (condemnation) or merely neutralizes a threat (quarantine). Retroactivity is less objectionable if the measure is preventive rather than retributive.
  *   **Concrete Case:** Indefinite detention of aggressive leaders versus execution. If the tribunal orders execution, it asserts the leaders *deserved* death under pre-existing law. If it orders detention, it may claim they are *dangerous* regardless of prior statute. Nuremberg chose execution, implying condemnation.
  *   **Mark:** Camp-Specific [Retributivists vs. Utilitarians]. Retributivists demand non-retroactivity for condemnation; Utilitarians accept retroactivity if it secures future peace.

  ---

  ### The Exclusionary Desideratum

  The single desideratum that does the most exclusionary work is **Symmetric Susceptibility (Item 5)**.

  Insisting that the statute must be capable of condemning the founders themselves rules out the "Political Necessity" and "Victors' Justice" accounts immediately. It also severely constrains the "Kelsen-style" utilitarian view, because a court that can try its creators is politically harder to establish in a post-conflict environment. It forces the theory to be one of *law* rather than *policy*. If you demand that the text of the statute must survive the reversal of fortunes, you eliminate any theory that relies on the specific historical position of the victor to validate the norm.

  ---

  ### The Impossibility Result

  I agree with your suspicion that the subset is jointly unsatisfiable in a *transitional* context, but I refine the tension. The genuine impossibility lies between **(a) Strict Domestic-Style Non-Retroactivity**, **(c) Political Possibility (Victors' Court)**, and **(d) Condemnatory Punishment**.

  You cannot have a court created by victors (c) that imposes moral condemnation (d) for acts that were not clearly criminalized under domestic-style legality (a) at the time.
  *   If you keep (a) and (c), you must drop (d): The trial becomes administrative quarantine (detention without moral blame).
  *   If you keep (a) and (d), you must drop (c): You cannot hold the trial immediately post-war; you must wait for a standing court (which defeats the purpose of judging the current war).
  *   If you keep (c) and (d), you must drop (a): You must accept retroactive legislation to condemn the atrocity.

  **Which to drop:** I would drop **(a) Strict Domestic-Style Non-Retroactivity**.
  **Defense:** The domestic model of *nullum crimen* presupposes a sovereign legislature that can be relied upon to criminalize evils prospectively. In the international sphere, there is no such sovereign. Aggressive war and systematic atrocity are *malum in se*; they violate a pre-legal moral order that the positive law failed to codify. Insisting on strict positivist legality in the face of unprecedented atrocity privileges the form of law over the substance of justice. The "fair warning" the defendant needs is moral, not statutory. To demand strict statutory notice is to allow the absence of a prior legislature to function as a license to kill.

  ---

  ### Scoring the Contenders

  **Legality-First View**
  This view fails because it treats the international sphere as if it possessed a functioning domestic legislature. By declaring the Charter invalid, it renders the tribunal a criminal gang, but it offers no alternative mechanism to punish aggression, effectively granting immunity to the first generation of aggressors.

  **Extreme Conduct (Natural Law) View**
  This view succeeds in capturing the moral gravity of the crimes but fails to provide a determinate standard for the defendant. If "no valid legal order could authorize it" is the test, the law becomes whatever the judge feels is too evil to permit, risking arbitrary decision-making.

  **Kelsen-Style Utilitarian View**
  This view correctly identifies that the alternative to retroactivity is impunity, and it sacrifices the individual defendant for the sake of the system. However, it struggles to justify *condemnation* rather than mere neutralization, as it admits the law is being made *ex post* for the sake of future order.

  **Fair-Warning View**
  This is the strongest contender; it shifts the focus from statutory text to the defendant's moral cognizance. It satisfies the requirement that the defendant knew the act was wrong, even if they did not know it was a crime, but it requires a robust theory of international moral knowledge that skeptics may reject.

  **Political-Legitimacy (Shklar) View**
  This view accepts the defect in legality but argues the legal form itself educates the public and records history. It is honest about the political nature of the trial but risks cynicism; if the law is admitted to be defective, the verdict loses its normative force and becomes merely a political statement.
