answer: |-
  ### Fairness Criteria Mapping: Ofqual Model vs. Critics

  | Fairness Criterion | Formal Definition (Standard Lit.) | Ofqual Model Objective | Model Behavior | Critics' Demand |
  | :--- | :--- | :--- | :--- | :--- |
  | **Calibration** | $P(Y=1 \mid \hat{Y}=s, A=a) = P(Y=1 \mid \hat{Y}=s)$ | **Temporal Calibration:** A 2020 'A' must equal a 2019 'A' in value. | Satisfied (by design) for national aggregate over time. | **Individual Calibration:** A 2020 'A' must reflect individual ability regardless of school history. |
  | **Equalized Odds** | $P(\hat{Y}=1 \mid Y=1, A=0) = P(\hat{Y}=1 \mid Y=1, A=1)$ | N/A (No $Y$). Aimed to equalize center-level deviation from history. | Violated. State schools had higher downgrading rates than private schools. | Equal downgrading rates across school types (State vs. Private) and deprivation quintiles. |
  | **Individual Fairness** | $D(x_i, x_j) \leq \epsilon \implies D(\hat{y}_i, \hat{y}_j) \leq \epsilon$ | Merit defined partially by institutional capacity (school history). | Violated. Two students with identical TAGs got different grades based on school ID. | Similar students (TAG + Prior Attainment) should get similar grades regardless of school. |
  | **Demographic Parity** | $P(\hat{Y}=1 \mid A=0) = P(\hat{Y}=1 \mid A=1)$ | Explicitly rejected. Distributions must match historical center baselines. | Violated relative to TAG distribution. | Implicitly demanded via TAG adoption (distribution reflects teacher judgment, not history). |
  | **Consistency** | Similar inputs yield similar outputs. | Small center exemption (<5 students). | Violated. Large state cohorts penalized; small private cohorts exempted. | Uniform application of grading logic regardless of cohort size. |

  ---

  ### 1. Mapping the Architecture: Players, Scores, and Truth

  To apply the fairness taxonomy, we must first define the variables. This is where the standard framework begins to fray.

  *   **The Players:** The subjects are students ($i$). The decision-makers are Ofqual (via the algorithm) and Centers (via TAGs). The stakeholders are Universities (consumers of the grade) and Future Cohorts (competitors for the credential's value).
  *   **The Score ($\hat{Y}$):** The calculated grade (A*–E).
  *   **The Protected Attribute ($A$):** Not directly race or gender, but **School Type** (Private/State) and **Deprivation Level** (IDACI). These correlate strongly with the algorithm's primary constraint: **Center History**.
  *   **The Decision Threshold:** The boundary between grade classes (e.g., the mark required for a B vs. a C), determined dynamically by the algorithm to fit the historical distribution.
  *   **The Ground Truth ($Y$):** **This is the null set.** There is no exam score.
      *   *Proxy 1 (Ofqual):* The counterfactual exam performance, estimated by Center History + Prior Attainment.
      *   *Proxy 2 (Critics):* The Teacher Assessed Grade (TAG), estimated by professional judgment.
      *   *Reality:* The construct being measured is "Academic Capability," but the metric is "Credential Value."

  ### 2. The Impossibility Theorems: Do They Reach?

  Your hunch is largely correct: **The standard impossibility results (Kleinberg et al., Chouldechova) do not strictly apply because there is no observed outcome variable $Y$.**

  The impossibility theorems state that you cannot simultaneously satisfy Calibration, Equalized Odds, and Balance for Positive Class when base rates differ across groups, *assuming you are predicting a true $Y$*. In August 2020, Ofqual was not predicting $Y$; they were **constraining $\hat{Y}$ to match a historical distribution.**

  This shifts the problem from *Predictive Fairness* to *Measurement Validity*.
  *   **Ofqual's Goal:** **Temporal Comparability.** They prioritized the stability of the currency (the A-level grade) over the accuracy of the transaction (the individual student's grade). In psychometric terms, they prioritized *equating* (making tests comparable across years) over *validity* (measuring the student's actual ability).
  *   **The Conflict:** This is not a statistical impossibility; it is a **policy trade-off**. You *can* mathematically enforce a historical distribution. The "impossibility" arises because enforcing that distribution on a population with shifting demographics and improving schools requires systematically under-predicting students in improving centers (mostly state schools) and over-predicting students in static elite centers (mostly private schools).

  **Where the theory speaks:**
  While the *impossibility* theorems don't fit, the **Disparate Impact** framework does. The algorithm used "Center History" as a proxy for "Student Capability." Because Center History is highly correlated with Socioeconomic Status (the protected attribute), the model induced a disparate impact. The "Small Center Exemption" (<5 students) acted as a **loophole variable**. Since private schools often have smaller subject cohorts than state comprehensives, this exemption functioned as a proxy for School Type, violating **Consistency** (a subset of Individual Fairness).

  ### 3. Temporal Fairness and Measurement Literature

  You asked if literature handles "comparability across cohorts." Standard algorithmic fairness literature is mostly cross-sectional (one cohort, one time). However, two adjacent fields address this:

  1.  **Fairness Over Time / Dynamic Fairness:** (e.g., *Liu et al., 2018; Hu et al., 2019*). This literature usually asks: "If we give this group loans now, does it improve their outcomes later?" It focuses on *feedback loops*. The A-level case is different; it focuses on *metric stability*.
  2.  **Psychometric Equating:** This is the correct theoretical home. Equating ensures that a score of 70% in 2019 represents the same ability as 70% in 2020. Ofqual treated the *national grade distribution* as the invariant truth.
      *   **The Trade-off:** **Longitudinal Validity** (The grade means the same thing over time) vs. **Cross-Sectional Validity** (The grade accurately reflects the student's ability right now).
      *   **The Verdict:** The impossibility theorems don't cover this because they assume the "truth" is fixed. Here, the "truth" (the value of an A) was being actively defended against the "data" (the teacher assessments). Ofqual essentially decided that the *system's integrity* was the protected attribute, not the *student*.

  ### 4. The Standoff: Impossibility or Policy Choice?

  The standoff between Ofqual's defense (inflation control) and the critics' complaint (individual injustice) is **not** an instance of the standard statistical impossibility. It is a clash of **construct definitions**.

  *   **Ofqual's Construct:** An A-level is a ranking mechanism for university entry that must maintain scarcity value.
      *   *Fairness Definition:* Fairness to the *qualification*. A 2020 student should not have an advantage over a 2019 student.
  *   **Critics' Construct:** An A-level is a certification of individual competence.
      *   *Fairness Definition:* Fairness to the *individual*. A student with the ability of an 'A' should receive an 'A', regardless of their school's past.

  The algorithm failed because it assumed **School History = Student Potential**. This is a measurement error, not a fairness constraint error. When a school improves (a common occurrence in state sectors due to intervention policies), the algorithm treats that improvement as "inflation" and suppresses it. This creates a **False Negative** rate that is systematically higher for improving schools.

  This *looks* like the impossibility result (you can't have calibration across groups with different base rates), but it's actually simpler: **The model was biased by design.** It assumed stationarity in a non-stationary world. The "impossibility" is only that you cannot have a stationary grade distribution in a system where school performance is improving unevenly.

  ### 5. The U-Turn: Relocating Unfairness

  The U-turn (adopting TAGs) is best described as **relocating the unfairness**, not fixing it.

  *   **Before U-Turn:** Unfairness borne by the **2020 Cohort** (specifically state school students). The credential remained stable; the students suffered.
  *   **After U-Turn:** Unfairness borne by the **2021/2022 Cohorts** and **Universities**.
      *   *Grade Inflation:* TAGs were inflated (teachers were generous, no moderation). This devalued the currency. A 2021 'A' is now worth less than a 2019 'A'.
      *   *University Admissions:* Universities faced a surplus of qualified applicants, forcing them to use alternative metrics or clearings, introducing new noise into the selection process.
      *   *Future Fairness:* The 2020 cohort gained an advantage over the 2021 cohort (who faced exams or a different algorithm), violating the very "Temporal Comparability" Ofqual originally tried to protect.

  This confirms your suspicion: The U-turn solved the *Individual Fairness* violation (Dwork's individual fairness) but exacerbated the *Temporal Fairness* violation. It traded a cross-sectional injustice for a longitudinal one.

  ### 6. Verdict

  **This episode is a case the standard impossibility framework was never designed for.**

  The impossibility theorems arbitrate between competing definitions of fairness *given a predictor and a ground truth*. The A-level crisis was a **measurement crisis** where the ground truth was absent, and the "predictor" (school history) was conflated with the "outcome" (grade distribution).

  *   **Why it's not a standard impossibility case:** The conflict wasn't between Calibration and Equalized Odds. It was between **Institutional Validity** (the grade as a stable currency) and **Individual Validity** (the grade as a merit signal). Standard fairness literature assumes the outcome variable ($Y$) is the moral anchor. Here, the *distribution* was the moral anchor for Ofqual, and the *individual* was the moral anchor for the critics.
  *   **Why it feels like one:** Because the mechanism used to enforce Institutional Validity (standardizing to history) mathematically necessitated Disparate Impact against protected groups (state schools/deprived areas) due to correlation between school history and demographics.

  **Conclusion for your dissertation:**
  Use this case to argue that algorithmic fairness literature is insufficient for **social policy measurement** where the "outcome" is a social construct (a grade) rather than a natural fact (recidivism, loan repayment). In social policy, the algorithm often *defines* the truth rather than predicting it. When the algorithm defines the truth, "fairness" becomes a question of **political legitimacy** (who gets to define the construct?) rather than **statistical parity**. The A-level algorithm failed not because it violated a theorem, but because it lacked the legitimacy to define the counterfactual truth of student ability against the professional judgment of teachers.

  The impossibility results explain the *symptoms* (you can't satisfy everyone), but they miss the *diagnosis* (the target variable was a policy choice, not a statistical reality).
