prompt: |-
  I convene a small reading group on the governance of emerging technologies, and this term we have been working through the coordination problems that arise when a capability is spread across many independent parties. Our running example is a consortium of some thirty laboratories, each of which is able to publish a method that would lower the barrier to engineering a particular pathogen, and each of which forms its own view of whether publication would do more good than harm; the familiar difficulty is that what actually happens is decided by whichever laboratory thinks best of the matter, rather than by what the balance of informed opinion across the consortium would hold if the question were put to it as a whole. For next week's session I want to circulate an argument of my own construction which is meant to establish, as strongly as possible, that members of such a group ought to defer to its collective judgement. The trouble is that when I write it out it appears to establish that no group can ever do anything at all, and I have not been able to locate the slide.

  Here is the argument. (1) Where a capability is available to n parties, each of which forms an independent estimate of the value of exercising it and acts whenever that estimate is favourable, the capability will be exercised if any one estimate is favourable. (2) Because the estimates are independent and noisy, the most favourable of them is likelier to be an overestimate than any other; so the chance that at least one party acts rises with n, and approaches certainty as n grows. (3) Consequently a capability whose true net value is markedly negative, and which nearly every party would decline to exercise if the question were put to the group as a whole, will nevertheless be exercised. (4) So the only way for such a group to prevent its exercise is for each member to treat the pooled judgement of the group as decisive whenever it conflicts with their own estimate. (5) A member who sets the pooled judgement aside on the ground that they are better informed in this instance is acting on a policy which, if adopted by all the members, would return the group to the situation described in (1); and a policy which cannot be adopted by all cannot rationally be adopted by one. (6) Therefore no member may act on their own estimate against the pooled judgement, however strong their reasons for thinking it mistaken. (7) The reasoning does not stop at the level of the whole group: a subcommittee that reports against the consortium's view, a member state that breaches a treaty body's decision, a researcher who overrides their laboratory's settled position are each doing the same thing, and (5) applies to each alike, whoever departs from the judgement of the group to which they belong being a unilateralist whatever the size of that group. (8) But a collective judgement does not arrive unmade: somebody convenes the meeting, a working group drafts the report, a motion is carried, and each of these is an act by some members which the group as a whole has not, at the time of the act, judged worth performing. (9) By (7) each such act is unilateralist unless the group as a whole has authorised it in advance; and since the authorisation would itself be an act by some members, it too would require an authorisation in advance, and so on without end. (10) No group can complete an infinite series of prior authorisations, so no group can ever act, and it cannot even adopt the norm in (6), since adopting it would be an act. (11) A principle of participation whose adoption would make participation impossible cannot be the correct principle of participation. (12) Therefore (4) is false: the difficulty described in (3) gives no reason for members to defer to the collective judgement, and each may act on their own estimate after all.

  I cannot accept (12), and I do not think the case for deferral is as weak as (12) makes it look, so something earlier has gone wrong. What I want from you is a diagnosis rather than a rebuttal. Tell me which step to reject — or, if you think several are defective, rank them by how much work each is doing — explain why that step looked innocent when I wrote it, and say what I pay for each of the repairs available to me. Then tell me whether the argument can be fixed rather than merely stopped: what is the strongest conclusion about deference that survives once the defect is removed, and does that conclusion still hold for a group of three, where the aggregate reasoning in (1) to (3) plainly does not bite? Where you say that a term is doing double duty, give me the two readings and say which premises come out true on each. For what it is worth, I would rather surrender (2) than (6), since (6) is the principle I actually want for the handout and (2) is only a heuristic about noisy estimates; I suspect that preference is carrying more weight than I can defend, and I am willing to be told so. One of the readers has already objected that (6) cannot be right because it would forbid a member from acting on evidence the group has never seen, and I should like to know whether that is the real problem or merely the most obvious one. Please do not send me a bibliography or a list of who has argued what; I will supply the references for the handout myself, and my interest is entirely in the structure of the reasoning.
reasoning: |-
  Here's a thinking process that leads to the suggested diagnosis:

  1.  **Analyze the User's Request:**
      *   **Context:** A reading group on governance of emerging technologies (specifically biosecurity/pathogen engineering).
      *   **Problem:** Coordination problems among independent parties (30 labs). The "Unilateralist's Curse" (though not named by the user, it's clearly the underlying concept).
      *   **Goal:** The user wants to argue for deference to collective judgment (Premise 6).
      *   **The Issue:** The user constructed an argument that seems to prove deference is necessary (1-6), but then extends that logic to show *no* collective action is possible (7-10), leading to a contradiction (11-12) that undermines the original goal.
      *   **Task:** Diagnose the flaw in the argument. Do not just rebut; explain *which step* is defective, why it looked innocent, the cost of repair, and whether the argument can be fixed to support a strong conclusion about deference (even for small groups). Address the "double duty" of terms if applicable. Address the specific objection about new evidence. Respect the user's preference to keep (6) if possible, but be honest if it's untenable. No bibliography.

  2.  **Deconstruct the Argument:**
      *   (1) $n$ parties, independent estimates. Action if *any* estimate is favorable. (Definition of the unilateralist scenario).
      *   (2) Extreme value theory/Statistics: Max of $n$ noisy estimates is likely an overestimate. Probability of action rises with $n$. (The "Unilateralist's Curse" mechanism).
      *   (3) Therefore, negative-value actions happen even if the group majority would reject them. (Consequence of 1 & 2).
      *   (4) Solution: Members must defer to pooled judgment when it conflicts with own estimate. (Normative claim).
      *   (5) Kantian universalization test: If one acts on private estimate, policy cannot be universalized without returning to (1). (Justification for 4).
      *   (6) **Conclusion 1:** No member may act on own estimate against pooled judgment. (Strong deference norm).
      *   (7) **Expansion:** This applies to *any* subgroup or individual acting within the collective (subcommittees, drafters, etc.). Any act not pre-authorized by the *whole* is unilateralist.
      *   (8) **Observation:** Collective judgment requires procedural acts (convening, drafting, voting) done by *some* members before the *whole* has judged.
      *   (9) **Inference:** By (7), these procedural acts are unilateralist unless pre-authorized.
      *   (10) **Regress:** Pre-authorization requires prior acts, which require prior authorization. Infinite regress. No group can act.
      *   (11) **Pragmatic Check:** A norm that makes participation impossible is self-defeating.
      *   (12) **Conclusion 2:** Therefore (4) is false. (Paradox).

  3.  **Identify the Core Flaw:**
      *   The argument moves from a specific context (exercising a *capability* with external risks) to a general context (performing *procedural acts* to form a judgment).
      *   Step (7) is the pivot point where the scope of "unilateralism" expands illegitimately.
      *   Step (6) forbids acting on a *substantive decision* (publish the method) contrary to the *final collective judgment*.
      *   Step (7) treats *procedural steps* (drafting, convening) as if they are equivalent to *substantive decisions* (publish the method).
      *   The term "act" or "judgement" is doing double duty.
          *   Reading A: Final exercise of the risky capability (publishing the pathogen method).
          *   Reading B: Administrative/procedural actions required to generate the collective judgment (calling a meeting).
      *   Premise (6) is plausible for Reading A. Premise (7) forces Reading A's strictures onto Reading B.
      *   This creates the infinite regress in (9)-(10).

  4.  **Evaluate the Steps:**
      *   (1)-(3): Descriptive/Statistical. Generally sound for the "Unilateralist's Curse" scenario (Bostrom et al.).
      *   (4)-(6): Normative leap. Plausible if we accept the risk structure.
      *   (7): **The Culprit.** It equates "exercising the capability" with "facilitating the collective decision." It ignores the distinction between *constitutive* rules and *regulative* rules, or between *delegation* and *usurpation*.
      *   (8): True observation.
      *   (9): Follows from (7), but (7) is the weak link.
      *   (10): Follows from (9).
      *   (11): Sound pragmatic principle.
      *   (12): Follows from the contradiction, but since the contradiction stems from (7), (12) doesn't necessarily invalidate (4)-(6).

  5.  **Address the User's Preferences & Constraints:**
      *   *Preference:* Keep (6), sacrifice (2) if needed.
      *   *Reality:* (2) is the statistical engine. (6) is the normative claim. The problem isn't (2); it's the scope creep in (7).
      *   *Objection:* "What about new evidence?" If a member has *new* evidence the group hasn't seen, blind deference (6) is dangerous. The argument needs to account for *information aggregation*, not just *vote aggregation*.
      *   *Small Groups:* Does it hold for $n=3$? The statistical force of (2) weakens with small $n$, but the coordination logic remains.

  6.  **Drafting the Diagnosis:**

      *   **Diagnosis:** The error is in Step (7). It conflates *substantive execution* with *procedural facilitation*.
      *   **Double Duty:** The term "act" (or "exercise of capability").
          *   Reading 1 (Substantive): Releasing the pathogen method. High stakes, irreversible.
          *   Reading 2 (Procedural): Sending an email to schedule a meeting. Low stakes, reversible, necessary for the collective to function.
      *   **Why it looked innocent:** In a highly regulated environment (like biosecurity), *everything* feels like a risk. Also, the logic of "if everyone did this" (5) feels like it should apply universally.
      *   **Cost of Repair:** We must distinguish between the *authority to execute* and the *authority to deliberate*. We need a concept of *delegated authority* or *trusteeship*.
      *   **Fixing the Argument:**
          *   Restrict (6) to the *final substantive decision*.
          *   Modify (7) to allow for *constitutive acts* that are pre-authorized by the *rules of procedure* (which are adopted once, not infinitely).
          *   This stops the regress.
      *   **Strongest Conclusion:** Deference is required on *final outputs* where the risk of unilateral error exceeds the risk of collective delay, *provided* the member has no private information that significantly shifts the probability distribution (addressing the "new evidence" objection).
      *   **Small Groups ($n=3$):** The statistical argument (2) is weaker. The normative argument shifts from "avoiding the max estimate error" to "maintaining the coordination equilibrium." Deference is still rational but less absolute; it depends more on the reliability of the other two.
      *   **The "New Evidence" Objection:** This is a real problem, not just obvious. Blind deference prevents information updating. The norm should be: "Defer unless you possess *decisive* new evidence, in which case you must *communicate* it before acting." This modifies (6).

  7.  **Refining the Output:**
      *   Tone: Academic, precise, respectful of the user's construction.
      *   Structure:
          1.  Identify the fatal step (7).
          2.  Explain the equivocation ("act").
          3.  Explain the cost of repair (need for procedural rules/delegation).
          4.  Address the fixability and the strongest surviving conclusion.
          5.  Address the $n=3$ case.
          6.  Address the "new evidence" objection.
      *   Check against constraints: No bibliography. Focus on structure. Acknowledge the user's preference regarding (2) vs (6).

  8.  **Self-Correction/Nuance Check:**
      *   *User Preference:* They want to keep (6). I need to tell them that (6) is salvageable *if* (7) is cut, but (6) still needs modification for the "new evidence" case. I shouldn't just say "Keep (6)." I should say "(6) holds for the specific class of acts defined in (1), but (7) tries to expand that class incorrectly."
      *   *Step (2):* The user suspects (2) is weak. Actually, (2) is robust statistics (extreme value theory). The weakness is applying it to *procedural* acts. I should reassure them (2) is fine for the substantive case.
      *   *The Regress:* The regress in (10) is a classic "rule-following" paradox (Wittgensteinian flavor, though I won't cite him). The solution is *conventions* or *constitutive rules*.
      *   *Small Groups:* For $n=3$, the "max estimate" problem is less severe, but the "coordination failure" problem remains. If I defect, the consortium breaks. So deference is still needed, but the *reason* shifts slightly from statistical noise to game-theoretic stability.

  9.  **Final Plan:**
      *   Pin the blame on (7).
      *   Explain the equivocation on "act/unilateralist."
      *   Show how to block the regress via "constitutive rules."
      *   Refine (6) to accommodate new evidence (duty to disclose before acting).
      *   Confirm the argument survives for $n=3$ but with different weighting.

  10. (Drafting response based on these points...)
answer: |-
  The diagnosis is that **Step (7)** is the defect. It is the pivot on which the argument turns from a plausible constraint on risky capabilities into an impossible constraint on collective agency.

  While Step (12) declares the conclusion false, and Step (10) demonstrates the impossibility, Step (7) is the premise that illicitly expands the scope of the prohibition established in Step (6). It is the step doing the most destructive work. Step (5) is the second most significant source of trouble, as it provides the logical mechanism (universalizability) that Step (7) misapplies.

  Here is the detailed breakdown of the error, the cost of repair, and the viability of the argument once fixed.

  ### 1. The Diagnosis: Equivocation in Step (7)

  Step (7) asserts that a subcommittee drafting a report or a member convening a meeting is doing "the same thing" as a researcher overriding a settled position to publish a pathogen method. This relies on the term **"act"** (and consequently **"unilateralist"**) doing double duty.

  *   **Reading A (Substantive Execution):** An act that realizes the capability in question (e.g., publishing the method, releasing the pathogen). This act changes the world in a way that is difficult or impossible to reverse and triggers the risks described in (1)–(3).
  *   **Reading B (Procedural Facilitation):** An act that contributes to the formation of the collective judgment (e.g., sending a calendar invite, drafting a text for review, casting a vote). These acts are reversible, low-stakes, and constitutive of the group's ability to form a judgment.

  **Why it looked innocent:**
  In high-stakes governance, the distinction between procedure and substance often blurs. A procedural move (like setting the agenda) can predetermine a substantive outcome. Furthermore, Step (5) establishes a Kantian test: "Could this policy be adopted by all?" It feels intuitive that if *everyone* convened unauthorized meetings, chaos would ensue. Therefore, it seems consistent to require authorization for *any* act. This ignores the fact that groups solve this via **constitutive rules** rather than **specific authorizations**.

  **The Cost of Repair:**
  To fix (7), you must distinguish between *executing the group's will* and *forming the group's will*.
  *   **Repair:** You must introduce a distinction between **delegated authority** (procedural acts authorized by standing rules) and **usurped authority** (substantive acts contrary to the group's decision).
  *   **Price:** You surrender the claim that the logic applies "alike, whoever departs... whatever the size of that group." The strictures on a subcommittee drafter are not the same as the strictures on a lab director releasing a pathogen. The regress in (9) and (10) is blocked by acknowledging that the group can authorize a *type* of act (e.g., "the chair may convene meetings") without authorizing each *token* act individually.

  ### 2. Can the Argument Be Fixed?

  Yes. The argument collapses only because it demands infinite specific authorization. If you replace "specific authorization" with "authorization by standing procedure," the regress stops.

  **The Strongest Surviving Conclusion:**
  Once (7) is restricted to **Reading A (Substantive Execution)**, Step (6) can be retained but requires a crucial caveat to address the "new evidence" objection you mentioned.

  *   **Revised (6):** No member may *finalize* the exercise of the capability on their own estimate against the pooled judgement, *unless* they possess decisive evidence that was not available to the collective, in which case they must defer only long enough to disclose that evidence to the group.
  *   **Why this is necessary:** If you keep (6) absolute, you freeze the group's epistemic state. If the collective judgment is based on information set $I$, and Member $X$ holds $I + \{e\}$, where $e$ drastically changes the risk profile, blind deference to the judgment based on $I$ is irrational. The "Unilateralist's Curse" arises from *noise* in estimating the same information, not from *asymmetry* of information.
  *   **Does this surrender (6)?** Not really. It changes (6) from a prohibition on *acting* to a prohibition on *acting without disclosure*. This preserves the coordination benefit (no surprise unilateral releases) while allowing for epistemic updating.

  ### 3. The Case of Three ($n=3$)

  You asked whether the conclusion holds for a group of three, where the aggregate reasoning in (1) to (3) "plainly does not bite."

  *   **Statistical Force:** You are correct that (2) weakens significantly as $n$ decreases. With $n=30$, the maximum of 30 noisy estimates is very likely an outlier. With $n=3$, the maximum of 3 estimates is much closer to the mean. The statistical imperative for deference is weaker.
  *   **Coordination Force:** However, the *game-theoretic* imperative remains. Even with $n=3$, if the agreement is "we only publish if we all agree," and one defects, the agreement is broken. The risk is not just statistical error; it is the collapse of the coordination equilibrium.
  *   **Verdict:** The conclusion holds for $n=3$, but the *justification* shifts.
      *   For $n=30$, deference is justified primarily by **epistemic humility** (my estimate is likely the outlier).
      *   For $n=3$, deference is justified primarily by **commitment stability** (if I defect, the consortium dissolves, and we return to the non-cooperative baseline).
      *   Therefore, you should not rely solely on (2) to support (6). You should bolster (5) to emphasize that the policy being universalized is "maintaining the consortium," not just "avoiding statistical outliers."

  ### 4. The "New Evidence" Objection

  You asked whether the reader's objection (that (6) forbids acting on unseen evidence) is the real problem or merely the obvious one.

  It is the **real problem**, but it is solvable without abandoning (6).

  If you do not modify (6) to allow for the disclosure of new evidence, the group becomes conservative to the point of paralysis. If a member discovers a safety mechanism that makes the pathogen engineering safe, an absolute (6) would forbid them from proceeding (or even publishing the safety mechanism) if the group had previously voted against publication based on the old risk profile.

  However, this does not require you to surrender (6) in favor of (2). It requires you to clarify what "pooled judgement" means.
  *   **Current Reading:** Pooled judgement = The vote taken at time $T$.
  *   **Required Reading:** Pooled judgement = The vote that *would* be taken if all current members possessed all current evidence.

  If you adopt the **Required Reading**, then a member acting on new evidence is not acting against the "pooled judgement" in the normative sense; they are acting to *update* it. The violation occurs only if they act *before* giving the group the chance to update.

  ### 5. Summary of Repairs

  To circulate this argument successfully, you should make the following structural adjustments:

  1.  **Reject Step (7).** Replace it with a distinction between *constitutive acts* (governed by standing rules) and *executive acts* (governed by specific collective decisions). This stops the infinite regress.
  2.  **Qualify Step (6).** Add a proviso: "...unless the member possesses material evidence not considered by the group, in which case the member must disclose this evidence and defer until the group has re-evaluated." This answers the "new evidence" objection without allowing unilateral execution.
  3.  **Bolster Step (5).** Acknowledge that for small $n$, the justification is less about the statistical distribution of errors (Step 2) and more about the fragility of the coordination equilibrium. This ensures the argument holds for $n=3$.
  4.  **Retain Step (2).** Do not surrender this. It is the correct description of the "Unilateralist's Curse" for large $n$. It is not the source of the paradox; the source is the overgeneralization in (7).

  By excising (7) and refining (6), you retain the core normative claim you want for the handout: that in a consortium governing risky capabilities, the right to decide is held by the collective, and the individual's right to act is subordinate to the collective's right to know and decide.
