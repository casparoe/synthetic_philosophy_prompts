prompt: |-
  ok so, I'm a senior and for the last two years I've been in this Philosophy of Mind elective at my school, and my teacher has basically outsourced the practice final to me because I'm the one who keeps hijacking seminar with arguments about chatbots. There's like 18 of us, everyone has read Searle's Chinese Room paper and knows the whole syntax-isn't-semantics slogan cold, and maybe half the class has heard of Harnad's symbol grounding problem, but most of them think it's just the Chinese Room restated with extra steps. I need ONE essay question they can answer in 45 minutes that they absolutely cannot answer by reciting either of those two things. And no need to name-drop extra philosophers or add a reference list in the model answer, we've only been assigned those two papers plus some excerpts, so a model answer that leans on sources we've never read would be useless to me for grading.

  Here's what I actually want the question to make them wrestle with. Our club got into a fight at lunch about whether grounding can be inherited. My friend Dana's side is that if a bunch of already-grounded humans design a symbol system and wire its tokens to their own words and, through those, to the world, then the system's symbols are grounded too, just secondhand — grounding transmits along the design relation, and the whole problem sort of dissolves. My side is that this just relocates the puzzle into Dana's head and still says nothing about what the tokens mean to the system itself. A third person said we were both missing the point, because the real question is whether there's any fact of the matter about intrinsic meaning at all, and whether hooking a system up to cameras and motors could create one where there wasn't one before. I want the question to force students to take a position on the inheritance/transitivity issue AND to say what would have to be true for sensorimotor contact with the world to break the circle rather than just push it somewhere else.

  So please write me: (1) the exam question itself, with a short vignette for the students to read, maybe 6 to 8 lines, setting up a concrete case — I'd rather it not be the usual robot-with-a-camera example since that's in every handout, something weirder would be better, like a system that has every human description ever written of a fruit it has never sensed, or a network of programs that only ever talk to each other and have no users left; (2) a model answer of about 700 words; (3) a marking scheme out of 25 that spells out the specific moves an A answer has to make, what a competent-but-unremarkable B answer will be missing, and the errors that should cost marks — things like treating symbol grounding as literally the same argument as the Chinese Room, turning it into a claim about whether machines can have feelings, treating groundedness as all-or-nothing instead of possibly coming in degrees, or "answering" the inheritance question by just asserting a side without saying what would settle it. Then tack on one line telling me what I should say to a student who writes that the whole dispute is merely verbal, because somebody always does.
