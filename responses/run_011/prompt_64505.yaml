answer: |-
  We are gathered in this auditorium. The seats are full. Two hundred people stand in the space she managed. You knew her in different ways. Some saw the temper. Some saw the care. Some saw the list. I saw the list first. I wrote about it. I made mistakes. I called her the woman who let the dice decide and said she spread the harm evenly. She corrected me in ink and said nobody was spared a piece of it. Her letter was sharper than my article. One person got all of it. The rest of us went home.

  This hospital stands alone. One hundred and ten miles lie between here and the next bed. In bad winters, the roads close. The patients arrive. They need life support. The beds are full. The demand exceeds the supply. This is not a theory. This is the geography of this place. Delia stood at the center of it. She held the critical-care bed list. She managed the scarcity. She did not look away.

  The work was simple. It was not easy. A bed opened. More than one patient needed it. She did not rank them. She did not measure prognosis. She did not count years remaining. She did not calculate benefit. She wrote names on cards. She put them in a tin. She drew one card. Witnesses watched. The chosen name went to the bed. The others stayed in the tin. Their names were read aloud. They were written into a ledger. This happened for twenty-six years. The ledger holds 4,113 names. These are not statistics. These are people who were here.

  There is an argument about this work. It lives in this room. Some say the numbers must count. If five need a bed and one needs a bed, the five matter more. The loss is greater. Others say the numbers do not add up. A life is a life. A loss is a loss. You cannot sum them. You must give each an equal chance. Delia did not join this debate. She did not write essays. She stood at the desk. She held the cards. She accepted the weight of the draw. She did not argue. She drew the card.

  There are families here who lost someone. You believe the tin was wrong. You say it was an abdication. You say a tin full of cards is not a moral argument. I hear you. Your grief is not a theory. It is a hole in your world. No method fills it. No explanation fixes it. You are right to demand better. You are right to speak. We must listen to that voice. It reminds us that any choice leaves a wound. The wound does not heal because the process was consistent. The loss remains absolute. Your anger is valid. It belongs in this room.

  There is also the matter of the exception. On one occasion, she did not draw. She gave a bed to a colleague's daughter. She offered no principle. She said she could not have stood at a distance from that one. I will not explain this away. I will not call it human error. I will not call it favoritism. It happened. It sits in the record. It reminds us that she was not a machine. She was a woman holding cards. She was a woman who loved her friends. This does not make the rule safe. It makes the rule honest.

  [Pause]

  We want her to be a hero. The hospital wanted to say it. I will not say it. The word does not fit the work. The work was too heavy for slogans. She did not save everyone. She did not save the most. She saved the one whose name came up. She carried the names of the others. She carried them home. She wrote them down. She read them at shift change. The ledger is still here. It is open to the last page. The ink is dry. The names are waiting. We should read them at shift change. We should write them by hand. The room should be quiet. The names should be heard. One by one. Not as a sum. Not as a score. Just as names. That is the work.
