  ### 3. Single Best Change

  **Change:** Revise **Commitment 8**.

  **Revision:** Replace "permanently altering physical infrastructure" with "permanently altering *critical* physical infrastructure" and restrict "causing an organization to cease to exist" to "causing *the Network* to cease to exist."

  **Rationale:**
  *   **Tension Removed:** This eliminates the Severity 1 (Logical Contradiction) and Severity 4 (Scope Ambiguity) tensions immediately. It makes C9b legally possible within the framework and clarifies C9a.
