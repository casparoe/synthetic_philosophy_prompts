          4.  Mechanism Specification (How carriers work).
          5.  Policy Counterfactuals (Intervention logic).
          6.  The Ontological Boundary (Culture vs. Institution). *This is the untractable one.*

  5.  **Declined Questions (Section 3):**
      *   *Candidate 1:* Historical adjudication of Weber (Protestant Ethic). *Reason:* The prompt explicitly says "not primarily historical." Plus, it's a dead end for *methodological* tool building. It's a case study, not a tool.
      *   *Candidate 2:* Cross-national regression studies of "Trust" and Growth. *Reason:* Too done, too plagued by endogeneity, unlikely to yield new *methodological* insights without new data (which is forbidden). It's "normal science" that reinforces the status quo.

  6.  **Critiquing the Framework (Section 4):**
