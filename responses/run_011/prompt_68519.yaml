      *Let's write the response.*
answer: |-
  **Mark: 18/20**

  **Comments:**

  *   **Conceptual Framework:** Your opening distinction between "bodies, institutions, and story" is an excellent parsing of the three criteria. It demonstrates you understand that the definition is designed to decouple demographic, political, and cultural continuity, which is the precise theoretical hurdle of this module.
  *   **Maya Case Study:** Your application here is robust. You correctly identify that while (ii) is met (monuments cease), (iii) is the failure point for the "collapse" label. The observation that criterion (i) is ambiguous regarding urban/rural population shifts is a sharp methodological critique often missed in second-year work.
  *   **Rapa Nui & Diamond:** You accurately represent the revisionist position against Diamond's environmental determinism (rats/contact vs. ecocide). However, your assertion that the shift to the Birdman cult satisfies criterion (iii) ("break in self-understanding") is presented as more settled than it is. Many archaeologists argue this was an internal adaptation *within* a continuous Rapanui identity, not a rupture in continuity. You need to justify why a cult shift equals a loss of ancestral connection more rigorously.
  *   **Late Bronze Age:** This is the strongest section. Identifying that the test assumes a "bounded people" while the LBA was a "network of dependencies" (Cline's systems collapse) is a sophisticated critique of the definition's structural limits. You correctly note that (iii) fails here, distinguishing the loss of elites from the loss of a people.
  *   **Use of Tainter:** You invoke Tainter correctly regarding diminishing marginal returns on complexity. However, be careful not to imply Tainter sees collapse as *always* rational; he argues it is a *simplification* that occurs when complexity becomes too costly. Your inference that this makes the test's neutrality a "limit" is a valid extension of his theory, though.
  *   **Normative Critique:** Your concluding point—that the definition's neutrality equates a dynastic shift (Maya) with a humanitarian catastrophe (Rapa Nui slavery)—is compelling. It challenges the utility of the definition not just on descriptive grounds, but on ethical ones. This moves the essay from application to genuine critical assessment.
  *   **Reasoning Step:** In the LBA paragraph, you state (i) is "doubtful" due to ruralisation, but you do not explain how we measure settlement size loss if the population disperses. A brief sentence on the archaeological difficulty of tracking dispersed populations would have tightened this logical step.

  **Overall Judgement:**
  This is an incisive, theoretically sophisticated essay that moves beyond simple application to interrogate the moral and structural limitations of the provided definition. While the claim regarding Rapa Nui's loss of continuity requires more nuanced evidence, the critique of the "bounded society" assumption in the Late Bronze Age is exemplary.
