prompt: |-
  I teach a second-year course on the concepts of decline, continuity and collapse, and this year's twenty-mark essay question was as follows.

  > Call a society *collapsed at time t* if, within roughly a century after t: (i) its largest settlements have lost more than half their population; (ii) the institutions that produced and maintained its public monumental or administrative record have ceased to function; and (iii) the population that remains no longer understands itself as continuous with the people who built that record.
  >
  > Critically assess whether this test captures what historians and archaeologists mean by collapse. Apply it to two cases.

  Here is the script I have to mark.

  > The test is worth having because it separates three things the word usually runs together: what happened to the bodies, what happened to the institutions, and what happened to the story a people told about itself. Applied consistently it makes popular usage look sloppy, though I will argue it also underdescribes the Late Bronze Age.
  >
  > In the southern Maya lowlands over the eighth and ninth centuries, dynastic centres were abandoned, the carving of dated monuments stopped, and the political apparatus that commissioned them went with it, so (ii) is met. But (iii) is not: Maya languages, ritual practice and cosmology continued, and millions of Maya speakers live in the region today, so the population did not cease to understand itself as descended from the people who built the record. That is why this is better described as a political reorganisation confined to one region — the north was still flourishing while the south emptied — than as the end of a society. Criterion (i) is the one that actually does the work here, and also the one the test states least clearly, since a city can lose half its people while the surrounding countryside gains them.
  >
  > Rapa Nui is normally offered as the counter-example, on Diamond's account of a society that consumed its own environment. The revisionist literature has, I think, settled that: the palm forest went largely because of the rats the Polynesians brought with them, and the demographic catastrophe belongs after European contact — slave raiding and epidemic disease in the nineteenth century, not before. What the islanders did in response was reorganise, and the birdman cult replaced the ancestor cult that had produced the moai. By the test's own logic that is a break in self-understanding and falls under (iii), so Rapa Nui collapses on all three criteria.
  >
  > The Late Bronze Age is different in kind, and this is where the test needs amending. Around 1200 BCE the palace economies of the eastern Mediterranean came apart together: the Hittite state disappeared, Mycenaean centres were destroyed or abandoned, literacy in Linear B was lost, Egypt survived but weakened. The population, though, did not vanish; it dispersed and ruralised, and afterwards spoke the same languages and worshipped the same gods. So (ii) is met, (iii) is not, and (i) is doubtful. What failed was a network rather than a society, and the test has no slot for that, because it is written for one bounded people while the thing that ended was a set of dependencies among several.
  >
  > Tainter helps here. Complexity is a problem-solving strategy with diminishing marginal returns, so shedding it is not a catastrophe but a rational response, and that is why the reduced forms that replaced the palaces and the dynasties were stable. Descriptively the test is admirably neutral: it never asks whether anyone was worse off, which is precisely why it can be applied to Rapa Nui and to the Aegean alike. But the neutrality is also its limit. On the test's own lights the ninth-century Maya and the post-contact Rapanui fall in the same category, and the difference between a dynasty ending and a people being carried off in slave ships is exactly the difference the word ought to have tracked.

  Mark the script out of twenty and write the comments I would put on it. I want the comments point by point and tied to particular claims in the answer rather than a general impression: what holds up, what does not, anything presented as settled that is not, any step in the reasoning that does not follow from what precedes it, and whether the two authors the student invokes are being used in the way their arguments license. End with a two- or three-sentence overall judgement of the kind I would read out in feedback.
reasoning: |-
  Here's a thinking process that leads to the suggested marking and feedback:

  1.  **Analyze the Request:**
      *   **Task:** Mark a student essay script out of 20 and provide specific, point-by-point comments.
      *   **Context:** Second-year university course on "concepts of decline, continuity and collapse."
      *   **Essay Question:** Critically assess a specific three-part definition of "collapse" (population loss, institutional cessation, loss of continuity/self-understanding) and apply it to two cases.
      *   **Student Script:** A concise, argumentative essay (approx. 500-600 words).
      *   **Requirements for Feedback:** Point-by-point, tied to specific claims, addressing accuracy, reasoning, use of sources (Diamond, Tainter), and overall judgement (2-3 sentences).

  2.  **Analyze the Essay Question & Definition:**
      *   **Definition of Collapse:**
          1.  (i) Largest settlements lose >50% population (within ~100 years).
          2.  (ii) Institutions producing public monumental/administrative record cease.
          3.  (iii) Remaining population no longer understands itself as continuous with builders of that record.
      *   **Task:** Critically assess the definition (does it match historian/archaeologist usage?) AND apply to two cases.

  3.  **Analyze the Student Script:**
      *   **Thesis:** The test is useful for separating bodies, institutions, and identity, but it underdescribes the Late Bronze Age (LBA) and creates moral/descriptive equivalence problems (Maya vs. Rapa Nui).
      *   **Case Study 1: Southern Maya Lowlands.**
          *   Claim: (ii) met (monuments stopped), (iii) *not* met (continuity of language/cosmology/modern Maya).
          *   Conclusion: Political reorganisation, not collapse. Critique of (i) regarding urban vs. rural shifts.
      *   **Case Study 2: Rapa Nui.**
          *   Claim: Refutes Diamond (environmental suicide). Attributes decline to rats + European contact (slavery/disease).
          *   Claim: Birdman cult replaced ancestor cult -> (iii) met.
          *   Conclusion: Collapses on all three criteria.
      *   **Critique of Definition (LBA):**
          *   Claim: Network failure, not society failure. (ii) met (palaces/Linear B lost), (iii) not met (language/gods continued), (i) doubtful (ruralisation).
          *   Conclusion: Test assumes bounded people, LBA was interdependent network.
      *   **Theoretical Engagement (Tainter):**
          *   Claim: Complexity shedding is rational/stable.
          *   Critique: Test's neutrality is a limit; equates political shift (Maya) with humanitarian catastrophe (Rapa Nui slavery).

  4.  **Evaluate the Content (Fact-Checking & Reasoning):**
      *   **Maya:** Generally accurate. The "collapse" is often defined as the loss of divine kingship and monumental inscription in the south, while population and culture persisted. The student correctly identifies that criterion (iii) is the sticking point for the "end of a society" narrative.
      *   **Rapa Nui:** The "revisionist" view (Hunt & Lipo etc.) is accurately represented regarding rats and European contact. The shift from *moai* (ancestor) to *Tangata manu* (Birdman) is a standard example of cultural change. Does this meet criterion (iii)? The student argues yes ("break in self-understanding"). This is debatable but a reasonable interpretation for an undergrad essay.
      *   **Late Bronze Age (LBA):** Accurate characterization (palace economies, Linear B loss, ruralisation). The critique that the definition assumes a "bounded people" when it was a "network" is sophisticated and valid (Cline's "Systems Collapse").
      *   **Tainter:** *The Collapse of Complex Societies*. Tainter argues collapse is a rapid simplification. He views it as a loss of socio-political complexity. The student uses Tainter to argue that simplification is "rational." Tainter does argue that investment in complexity yields diminishing returns, so simplification *can* be adaptive. This is a fair use.
      *   **Normative Critique:** The student argues the definition is *too* neutral because it equates the Maya (political shift) with Rapa Nui (slavery/genocide). This is a strong critical point about the *utility* of the definition.

  5.  **Determine the Mark (out of 20):**
      *   **Knowledge & Understanding:** High. Shows familiarity with Maya, Rapa Nui, LBA, Diamond, and Tainter.
      *   **Analysis & Critique:** Very strong. Doesn't just apply the test; interrogates its boundaries and moral implications.
      *   **Structure:** Clear, concise, logical flow.
      *   **Issues:**
          *   Rapa Nui (iii): Did they *really* lose continuity? The Birdman cult is still Rapanui. Criterion (iii) says "no longer understands itself as continuous." This is a bit of a stretch. Usually, (iii) is the hardest to prove archaeologically. The student asserts it confidently.
          *   Tainter: Slightly simplified, but acceptable for 2nd year.
          *   Length/Brevity: It's very dense. Some claims could use more evidence, but it answers the prompt directly.
      *   **Grade Band:** First Class (17-20). It's incisive and challenges the premise effectively.
      *   **Specific Mark:** 18/20. It loses points slightly on the Rapa Nui (iii) assertion being a bit glib, and perhaps for not fully unpacking the "network" critique in the LBA section (though it's a great point).

  6.  **Drafting the Comments:**
      *   *Constraint:* Point-by-point, tied to claims, not general impression.
      *   *Constraint:* Address "settled" issues, reasoning steps, and author usage.
      *   *Constraint:* End with 2-3 sentence overall judgement.

      *   *Drafting Points:*
          1.  **Intro/Thesis:** Good distinction (bodies, institutions, story).
          2.  **Maya:** Strong application. Correctly identifies (iii) failure. Good point on (i) urban/rural shift.
          3.  **Rapa Nui:** Accurate on revisionism (Diamond critique). *Caution:* Is the Birdman cult truly a break in *continuity* (iii)? Many archaeologists argue it's an evolution, not a break. Student presents this as settled.
          4.  **LBA:** Excellent critique of the "bounded society" assumption. Systems collapse vs. societal collapse.
          5.  **Tainter:** Good use of "diminishing returns."
          6.  **Normative Critique:** Strong ending about neutrality masking suffering.
          7.  **Reasoning Check:** The jump from "Birdman replaced Ancestor" to "no longer understands itself as continuous" is the weakest logical link.
          8.  **Definition Check:** The student notes the definition says "roughly a century." They apply this well to Maya and LBA.

  7.  **Refining the Feedback:**
      *   Make sure to sound like a professor (constructive, rigorous).
      *   Ensure the distinction between "political reorganisation" and "collapse" is highlighted as a strength.
      *   Point out the risk in the Rapa Nui (iii) claim.
      *   Validate the Tainter usage.

  8.  **Final Review against Constraints:**
      *   Mark out of 20? Yes.
      *   Point-by-point comments? Yes.
      *   Tied to claims? Yes.
      *   Address reasoning/sources? Yes.
      *   2-3 sentence overall judgement? Yes.

      *(Self-Correction during drafting)*: I need to make sure I don't just praise it. I need to find the flaws to justify not giving 20/20. The Rapa Nui (iii) claim is the most vulnerable. Also, the LBA section says (i) is "doubtful" but doesn't elaborate as much as the Maya section. I will note that.

      *Mark Decision:* 18/20. It's a high First.

      *Feedback Structure:*
