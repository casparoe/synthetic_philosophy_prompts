answer: |-
  # Seminar Handout: The Collapse Decision Tree

  **Instructions:** Answer the following questions in order. Do not look ahead to the theoretical positions (leaves). Your path determines your working definition of "collapse" for this seminar.

  ### **Node 1: The Ontology**
  Is the defining feature of "collapse" the disappearance of **sociopolitical complexity** (e.g., state administration, literacy, monumentality) rather than a significant decline in **population size**?
  *   **Yes** (It's about the State/Elite) → Go to **Node 2**.
  *   **No** (It's about the People/Demography) → Go to **Node 5**.

  ### **Node 2: The Normativity**
  Does the loss of this complexity necessarily imply a **decline in quality of life** for the majority of the surviving population?
  *   **Yes** (Collapse is Bad) → Go to **Node 3**.
  *   **No** (Collapse is Neutral or Liberation) → Go to **Node 4**.

  ### **Node 3: The Reversibility**
  Must the loss of complexity be **irreversible** on a multi-generational scale (centuries) to count as collapse?
  *   **Yes** (Permanent Loss) → Go to **Node 6**.
  *   **No** (Temporary Regression/Cycle) → **Leaf A**.

  ### **Node 4: The Mechanism (Complexity)**
  Is the transition best explained by **diminishing returns on investment** (internal cost) or **resilient reorganization** (external adaptation/choice)?
  *   **Diminishing Returns** → **Leaf B**.
  *   **Resilient Reorganization** → **Leaf C**.

  ### **Node 5: The Mechanism (Demography)**
  Must the population decline result from **societal failure to cope** (famine, war) rather than **external biological shock** (pandemic, climate)?
  *   **Failure to Cope** → Go to **Node 6**.
  *   **External Shock** → **Leaf D**.

  ### **Node 6: The Agency**
  Does the explanation for the failure require **moral culpability** (poor resource management/choices) or is **structural fragility** (systemic risk) sufficient?
  *   **Moral Culpability** → **Leaf E**.
  *   **Structural Fragility** → **Leaf F**.

  ***

  ## Theoretical Leaves

  **Leaf A: The Transformationalist**
  *   **Proponents:** Demarest, Webster (Moderate).
  *   **Awkward Commitment:** Dilutes the term "collapse" until it is nearly synonymous with "political change," risking loss of analytical utility.

  **Leaf B: The Complexity Theorist**
  *   **Proponents:** Tainter.
  *   **Awkward Commitment:** Implies simpler societies are inherently more efficient, potentially ignoring the role of coercion in maintaining complexity.

  **Leaf C: The Resilience Theorist**
  *   **Proponents:** Yoffee, McAnany.
  *   **Awkward Commitment:** Risks romanticizing poverty or subsistence insecurity as a "strategic choice" by the marginalized.

  **Leaf D: The Deflationist**
  *   **Proponents:** Pauketat, Johnston.
  *   **Awkward Commitment:** Makes "collapse" purely a historiographic error, denying the material reality of sudden systemic contraction.

  **Leaf E: The Ecocide Advocate**
  *   **Proponents:** Diamond.
  *   **Awkward Commitment:** Requires blaming victims for environmental constraints they could not have scientifically understood or controlled.

  **Leaf F: The Systems Theorist**
  *   **Proponents:** Butzer, Middleton.
  *   **Awkward Commitment:** Removes human agency entirely from the equation, rendering moral or political critique impossible.

  ***

  ## Structural Notes

  **Unoccupied Combinations**
  *   **Combination:** *Node 1 (No/Population)* + *Node 2 Logic (Neutral/Positive)*.
  *   **Status:** **Unattractive.** While logically possible (e.g., a Malthusian correction viewed as beneficial for survivors), no major theorist argues for a "beneficial demographic collapse" using the word *collapse*. The term's etymology precludes a positive valuation in demographic contexts.

  **Indistinguishable Leaves**
  *   **Pair:** **Leaf B (Complexity Theorist)** and **Leaf F (Systems Theorist)**.
  *   **Reason:** My questions struggle to separate "diminishing returns" (Tainter) from "structural fragility" (Systems). Both rely on internal feedback loops and cost-benefit analyses.
  *   **Case Differentiation:** The **Late Bronze Age** might separate them: Tainter sees it as cost of empire; Systems sees it as interconnected supply-chain fragility.

  ***

  **Confidence Statement:** I am 85% confident these branches are exhaustive for current archaeological discourse, though "mutual independence" is compromised where internal costs (Tainter) mimic structural fragility (Systems). I am least sure of the placement of **Leaf C (Resilience Theorist)** at Node 4; some resilience scholars might argue the change *was* negative (Node 2) but inevitable, which this tree forces into a binary choice.
