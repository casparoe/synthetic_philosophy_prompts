answer: |-
  You have identified a genuine gap in the standard introductory presentation of decision theory. The configuration you are seeing is real, but it is not one phenomenon; it is two distinct violations of I. J. Good's theorem that happen to look similar on the surface.

  To answer your first question directly: **It is two names, not one.** Cases 1 (Supplier) and 2 (Nurse) are structurally identical. Case 3 (Investor) is fundamentally different.

  Here is the carving you need for your class, the established concepts nearest to them, and a tight definition you can teach in ten minutes.

  ### 1. The Carving: Two Distinct Mechanisms

  Good's Theorem relies on two hidden premises:
  1.  **Action Invariance:** The set of actions available to you does not shrink when you acquire information (you can always choose to ignore the info and do what you would have done anyway).
  2.  **Utility Independence:** Your satisfaction (utility) depends on the state of the world and your action, not on the mere fact that you *know* the state of the world.

  Your three cases break these premises differently.

  **Cases 1 & 2: Binding Ignorance**
  *   **The Structure:** Acquiring the information triggers an external rule (contractual, legal, or ethical) that **removes an option** from your action set.
  *   **Good's Premise Failed:** *Action Invariance.* If you know the abuse exists (Case 1) or the finding is positive (Case 2), you are *forbidden* from continuing the relationship or staying silent. The "ignore it" option is legally or procedurally deleted.
  *   **Established Term:** In economics and political science, this is a specific subset of **Strategic Ignorance**. However, "Strategic Ignorance" is often used loosely. For your teaching purposes, I recommend coining the term **Binding Ignorance**.
  *   **Definition:** *Deliberate avoidance of free information because acquiring it would remove a feasible action that is currently preferred.*

  **Case 3: Information Aversion**
  *   **The Structure:** Acquiring the information leaves your options open, but the **state of knowing** itself enters your utility function as a negative.
  *   **Good's Premise Failed:** *Utility Independence.* The investor *could* physically hold the stock after checking the app, but the anxiety of knowing reduces their total utility.
  *   **Established Term:** **Information Aversion** (or the *Ostrich Effect* in behavioral finance).
  *   **Definition:** *Deliberate avoidance of information because the psychological cost of holding the belief outweighs the instrumental benefit of the action.*

  ### 2. Distinctions from Nearest Concepts

  You asked how this differs from rational ignorance, willful blindness, and blinding. Here is the precise differentiation:

  *   **Vs. Rational Ignorance:**
      *   *Rational Ignorance:* Information has a **cost to acquire** (time, money) that exceeds its expected benefit.
      *   *Your Cases:* Information is **free** (or contractually offered). The cost is in the *consequences* of possession, not the acquisition.
  *   **Vs. Willful Blindness (Legal):**
      *   *Willful Blindness:* A **legal verdict** imposed *ex post* by a court ("We will treat you as if you knew").
      *   *Binding Ignorance:* A **decision structure** adopted *ex ante* by the agent ("I must not know so I am not forced to act"). It is the behavior that the legal verdict attempts to penalize, but in your nurse/supplier cases, it is often compliant or ethically defended.
  *   **Vs. Blinding (Scientific/Trial):**
      *   *Blinding:* Information is excluded to **improve epistemic accuracy** (prevent bias).
      *   *Binding Ignorance:* Information is excluded to **preserve optionality** (prevent constraint). The goal is not better judgment; it is a wider action space.

  ### 3. The Teaching Criterion: "The Option Retention Test"

  To distinguish these in class without relying on jargon, use this three-step test. Ask the students to imagine the agent acquires the information.

  **Question:** *"Once you know the truth, are you still **permitted** to take the exact action you would have taken if you remained ignorant?"*

  1.  **No (Forbidden):** If knowing the truth makes the preferred action illegal, unethical, or contractually void, this is **Binding Ignorance** (Cases 1 & 2).
      *   *Supplier:* If I know the subcontractor uses abuse, I am *forbidden* from buying.
      *   *Nurse:* If I know the finding, I am *forbidden* from not reporting.
  2.  **Yes (But Painful):** If you are permitted to act, but knowing makes you feel worse while doing it, this is **Information Aversion** (Case 3).
      *   *Investor:* I am *allowed* to hold the stock, but I will feel anxious.
  3.  **Yes (And Neutral):** If you can act and feel the same, but finding out cost money/effort, this is **Rational Ignorance**.
      *   *Voter:* I can vote either way, but reading the paper took 3 hours.

  ### 4. Edge Cases and Application

  You asked for a definition tight enough to apply to new cases without consulting me. Use the **Binding Ignorance** definition for Cases 1 & 2.

  *   **Definition:** *Ignorance is "Binding" if the knowledge itself acts as a switch that disables a specific action.*
  *   **Does the squeamish investor count?** **No.** The knowledge does not disable the action of holding; it only lowers the utility of holding. This is Information Aversion.
  *   **Does the culpable corporate version count?** **Yes.** If a company structures a contract specifically to ensure they *cannot* legally know about a violation so they don't have to remediate, that is Binding Ignorance. (Note: This is where it edges into Willful Blindness legally, but structurally it is the same as your supplier case).
  *   **Does a person who avoids info because they suspect they would overreact count?** **No.** This is the investor case again. Unless they have *pre-committed* (e.g., "I have given my broker power of attorney and instructed them to ignore my calls if the market drops"), they retain the option to act rationally. If they have legally bound their future self to ignore the info, it becomes Binding Ignorance (self-imposed constraint).

  ### Summary for Your Lesson Plan

  1.  **State Good's Theorem:** Free information is always valuable because you can ignore it.
  2.  **The Exception:** You can only ignore it if you are **allowed** to ignore it.
  3.  **The Carving:**
      *   If rules/laws stop you from ignoring it $\rightarrow$ **Binding Ignorance** (Supplier/Nurse).
      *   If feelings stop you from ignoring it $\rightarrow$ **Information Aversion** (Investor).
      *   If cost stops you from getting it $\rightarrow$ **Rational Ignorance** (Voter).
  4.  **The Takeaway:** In professional ethics and compliance (your students' world), the danger is rarely that information is costly. The danger is that information is **binding**.

  This gives you a rigorous decision-theoretic basis (Action Space vs. Utility Function) wrapped in a practical heuristic (The Option Retention Test) that fits your ten-minute window.
