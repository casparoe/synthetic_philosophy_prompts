answer: |-
  This is a specification for a historical root-cause analysis. Since you work in incident review, I will frame these requirements using the logic of failure investigation rather than academic historiography. You are looking for the **Root Cause** of the Industrial Incident (1760–1850), where the system failure was "Traditional Agrarian Equilibrium" and the system success was "Sustained Per-Capita Growth."

  Here is the spec for a valid explanation, followed by the classification of requirements, the single biggest filter, and the analysis of the logical collision you suspected.

  ### Part 1: The Specification Requirements

  To count as an explanation rather than a narrative, a theory must satisfy the following six requirements.

  **1. The Control Group Definition (The "Sister Plant" Requirement)**
  *   **The Requirement:** The answer must explicitly define the counterfactual. It cannot just say "Why Britain?" It must say "Why Britain *instead of X*?"
  *   **The Case:** In your work, you ask why Plant A failed when Plant B didn't. In history, "China" is too big. If the theory is "Coal," you must explain why the Fushun mines (China) didn't trigger it. If the theory is "Property Rights," you must explain why the Netherlands (who had better property rights) didn't trigger it. A valid answer must identify the specific *control group* (e.g., the Yangtze Delta, the Netherlands, France) and explain why the causal variable existed in Britain but not the control, or why it behaved differently.
  *   **Shape of Question:** This addresses your concern about "China is a civilization, Britain is a rock." The explanation must narrow the comparison to comparable units (e.g., Lancashire vs. Jiangnan).

  **2. The Timing Constraint (The "Why Then?" Requirement)**
  *   **The Requirement:** The causal factor must appear or change *immediately prior* to the takeoff, not exist statically for centuries.
  *   **The Case:** If you claim "British culture of tinkering" caused the Industrial Revolution, you must explain why that culture didn't produce steam engines in 1650 or 1500. Static conditions cannot explain dynamic changes. In incident review, if a valve was always corroded but only burst yesterday, the corrosion isn't the root cause; the pressure spike is.
  *   **Shape of Question:** This addresses your concern about timing. The variable must have a slope, not just a level.

  **3. Exogeneity Check (The "Cause vs. Symptom" Requirement)**
  *   **The Requirement:** The proposed cause must be demonstrably independent of the industrialization process itself.
  *   **The Case:** Did high wages cause mechanization, or did early mechanization cause high wages? Did coal mining drive the economy, or did a growing economy make coal mining profitable? In incident review, this is distinguishing the ignition source from the fuel that accumulated *because* of the leak. Many historical "causes" (like urbanization or capital accumulation) are actually early symptoms of the takeoff, not the trigger.
  *   **Shape of Question:** This addresses your concern about separating causes from consequences with bad records. The burden of proof is on the author to show the variable existed *before* the growth curve bends up.

  **4. The Mechanism Link (The "Physics" Requirement)**
  *   **The Requirement:** The answer must describe the transmission mechanism, not just the correlation.
  *   **The Case:** "Parliament protected property" is a condition, not a mechanism. How does a law in London translate to a spinning jenny in Manchester? You need the chain of custody: Law -> Lower Risk -> Investment -> R&D -> Prototype. If the link relies on "people felt more confident," it's a weak mechanism. In safety, "management didn't care" is not a root cause; "management didn't care *so they cut the maintenance budget*" is.
  *   **Shape of Question:** This addresses the "list of stuff" problem. It forces the narrative to connect the dots.

  **5. Robustness to Contingency (The "Luck" Requirement)**
  *   **The Requirement:** The answer must specify whether the outcome was deterministic (inevitable given conditions) or contingent (dependent on a low-probability event). It cannot hide behind "luck" without defining the probability space.
  *   **The Case:** If the answer is "Britain got lucky with coal location," you must explain why the system was sensitive to that specific luck. A robust system shouldn't break because of one variable. If the theory relies on luck, it must admit it is not a generalizable law of development, but a specific accident report.
  *   **Shape of Question:** This addresses your friend's "luck" argument. It forces the theory to own its uncertainty.

  **6. Falsifiability (The "What Would Change Your Mind" Requirement)**
  *   **The Requirement:** The theory must state what evidence would disprove it.
  *   **The Case:** If a theory says "Culture caused it," and you find a culture with the same traits that didn't industrialize, the theory must die. If the author says, "Well, there was some other hidden factor," they are protecting the theory from falsification. In incident review, if you say "Training failed," but find records of perfect training, you must drop that cause.
  *   **Shape of Question:** This addresses the "made up after the fact" concern.

  ---

  ### Part 2: Non-Negotiable vs. "Taste"

  You asked to separate the hard logic from the ideological preferences.

  **Non-Negotiable (Logic & Methodology):**
  *   **The Control Group Definition:** You cannot establish causality without a comparison.
  *   **The Timing Constraint:** Static variables cannot explain dynamic shifts.
  *   **Exogeneity Check:** Effects cannot cause their own causes.
  *   **Falsifiability:** An unfalsifiable claim is theology, not analysis.

  **"Taste" (Ideological/Camp Preferences):**
  *   **"Must offer lessons for developing nations today":** This is a utility requirement, not a truth requirement. Many true things are not useful (e.g., "You needed colonies to industrialize" is a true historical fact for Britain but a useless policy for landlocked Bolivia).
  *   **"Must be morally satisfying":** The desire for the answer to be "Good Institutions" vs. "Exploitation" is a moral preference, not an analytical one.
  *   **"Must be deterministic (No Luck)":** This is a psychological comfort requirement. The universe is not required to be deterministic. Insisting on this biases the analysis toward over-confident theories.
  *   **"Must be visible from the inside (Predictive)":** While desirable, many root causes are only visible in hindsight (e.g., a microscopic fracture). Demanding contemporaries *knew* it was happening rules out structural shifts they couldn't perceive.

  ---

  ### Part 3: The Killer Requirement

  **The Control Group Definition (specifically the "Dutch/Yangtze" filter).**

  This is the requirement that knocks out the most popular answers.
  *   **Coal/Geography:** Fails the Yangtze Delta test (they had water transport and fuel issues, but solved them differently) and the Dutch test (no coal, but high growth).
  *   **Culture/Science:** Fails the China test (Song Dynasty had massive tech innovation) and the Dutch test (commercial culture was arguably stronger there).
  *   **Institutions/Property Rights:** Fails the Dutch test (they had the best property rights in Europe for a century prior without industrializing).
  *   **Wages:** Fails the Timing test (wages fluctuated for centuries before 1760).

  Most "list of stuff" answers collapse because they treat Britain as the only data point. Once you force the theory to run against the "Sister Plant" (the Netherlands for institutions, the Yangtze for resources), the variables stop correlating with the outcome.

  ---

  ### Part 4: The Collision (The Impossible Spec)

  Your hunch is correct. There is a fundamental incompatibility between three specific requirements. You cannot maximize all three simultaneously. This is the **Trilemma of Historical Explanation**.

  **The Three Conflicting Requirements:**
  1.  **Specificity (The "Root Cause" Demand):** Name the specific difference that made the difference (e.g., "Coal depth in Newcastle").
  2.  **Determinism (The "No Luck" Demand):** The outcome must be the logical result of the conditions, not a fluke.
  3.  **Generalizability (The "Law" Demand):** The explanation should function as a rule that could apply elsewhere (not just a unique accident report).

  **The Step-by-Step Collision:**

  **Step 1: Try to satisfy Specificity and Determinism.**
  *   *Goal:* Find the one thing Britain had that China didn't, which *guaranteed* the result.
  *   *Result:* You end up with a "Unique British Exception" theory (e.g., "Only Britons had the liberty gene").
  *   *Failure:* You violate **Generalizability**. If the cause is unique to Britain, it's not a model for development; it's a description of an anomaly. It also usually fails the **Control Group** check because the "unique thing" often existed elsewhere (e.g., liberty in Poland, coal in China).

  **Step 2: Try to satisfy Determinism and Generalizability.**
  *   *Goal:* Create a universal law of industrialization (e.g., "High wages + Property Rights = Industrialization").
  *   *Result:* You predict industrialization in the Netherlands (1650) and the Yangtze Delta (1750).
  *   *Failure:* They didn't industrialize. To fix this, you have to add more and more variables until the "law" only applies to Britain in 1760. You collapse back into Step 1. You violate **Specificity** because the "law" is too broad to explain the specific timing.

  **Step 3: Try to satisfy Specificity and Generalizability.**
  *   *Goal:* Find a specific factor that is replicable (e.g., "Access to New World Land").
  *   *Result:* You admit that Britain had a specific advantage (ghost acres in Americas) that could theoretically be copied.
  *   *Failure:* You violate **Determinism**. Why didn't Spain industrialize? They had more New World land. Why didn't China industrialize using their own internal land? This forces you to admit that the specific factor *interacted* with local conditions in a way that wasn't guaranteed. You have to introduce **Luck/Contingency**. (e.g., "They had the land *and* happened to have a coal shortage *and* happened to have a scientific society").

  **The Conclusion of the Collision:**
  If you demand a **Root Cause** (Specificity) that **Guarantees the Outcome** (Determinism), you cannot have a **General Rule** (Generalizability) because the sample size is N=1.

  If you demand a **General Rule**, you cannot explain why the **Specific Case** happened *then* and not elsewhere (Timing/Control Group).

  If you demand **Specificity** and **Generalizability**, you must admit **Luck** (Determinism fails).

  **How this resolves your argument with your friend:**
  *   **You** are looking for the **Root Cause** (Specificity + Determinism). You want the valve that, if tightened, stops the leak.
  *   **Your Friend** is looking at the **System Complexity** (Luck + N=1). He sees that in safety engineering, sometimes the answer *is* "The system was brittle and a random spike broke it."
  *   **The Books** are trying to sell you **Generalizability** (Lessons for today). They want to say "Do X and you get Y."

  **The Verdict:**
  The "Impossible Spec" is the answer. A historical explanation that satisfies your incident review standards (Single Root Cause, Deterministic, Replicable) **does not exist** for the Great Divergence.

  *   If an author gives you a **List**, they are avoiding the Root Cause requirement.
  *   If an author gives you a **Single Cause** (e.g., Coal), they are failing the Control Group requirement.
  *   If an author gives you a **Complex System** answer, they are admitting there is no single "fixable" variable (which satisfies your friend, but frustrates you).
  *   If an author gives you a **General Law**, they are ignoring the Dutch/Yangtze counter-examples.

  **Final Instruction for your Reading:**
  Do not look for the book that solves the puzzle. Look for the book that explicitly acknowledges which corner of the Trilemma it is sacrificing.
  *   If they sacrifice **Determinism**, they are "Contingency" historians (your friend's camp).
  *   If they sacrifice **Generalizability**, they are "Unique Path" historians (British Exceptionalism).
  *   If they sacrifice **Specificity**, they are "Structural" historians (Marxist or Institutional).

  The best analysis will tell you: "I am prioritizing X, which means I cannot explain Y." The ones that claim to explain everything are the ones writing fiction.
