prompt: |-
  So I do incident reviews for a living — when something breaks or somebody gets hurt at one of our plants, I have to write up why. And there's a discipline to it that I never really appreciated until I started trying to apply it to history. You're not allowed to just list everything that was off that day. You have to name the thing that, if it had been different, the incident doesn't happen, and you have to say why it happened at that plant and not at the sister plant running the same process with the same equipment and the same shifts. Half the time the honest answer is that there wasn't one such thing, and then you have to say that instead, which nobody likes. Anyway, I fell down a rabbit hole on the England/China thing after a podcast, and every answer I read is just a list of stuff England happened to have: coal that was cheap and close to the water, high wages that made machines worth building, colonies and silver, a parliament that protected property, a culture of tinkerers and practical science, a patchwork of small competing states instead of one big empire. My friend says all of those lists are made up after the fact and the real answer is that Britain got lucky, and honestly I can't tell which of us is right. I think the actual problem is that I don't know what would count as a right answer, so I can't judge any of them.

  Before I buy any of the books, write me the requirements: what an answer to "why did industrialization take off in Britain and not in China" has to deliver to count as an explanation and not just a good story. Give me the case or the consideration behind each one, not just the label. I especially want the requirements about the shape of the question, because that's where I get stuck. Does an answer have to say what it's contrasting against, given that "China" is a whole civilization and "Britain" is a wet rock, and given that I keep seeing people say the richest part of the Yangtze delta looked a lot like England right around 1750, down to running out of firewood? Does it have to pin down the timing and not just the place, since the question isn't only why there but why then? Does it have to explain why not the Dutch, who had most of the items on every one of those lists a century and a half earlier and didn't take off? Does it have to survive the possibility that a big chunk of it was fluke — and if so, what does "survive" even mean when you've got one case, no repeats, and no control? Does it have to seperate causes from things that only showed up afterwards as consequences, and how would you check that with dead people and bad records? Does it have to be something you could have seen coming from the inside, or is it allowed to only make sense in hindsight?

  Then mark which of these are non-negotiable and which are just the taste of one camp wearing a requirement costume — I suspect "it should give us lessons for how poor countries catch up today" is the latter, but I could be wrong, and I bet there are others on the list that only look neutral. Tell me which single requirement knocks out the most of the popular answers, because I want to know where to aim when I finally read them. And most of all: is there a subset of these that just can't be satisfied together? My hunch is that "name a difference that actually made the difference," "don't hide behind luck," and "make it general enough to apply somewhere else" can't all hold at once, and that if I'm right the requirements list is itself the answer to my argument with my friend — the question is asking for something no answer can give. If that's right, show me the collision step by step rather than just asserting it. Don't give me a reading list or any book recommendations, I'll get to that later; I want the spec first.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Incident reviewer/analyst (likely safety or engineering background). Used to root cause analysis (RCA). Understands the difference between a list of contributing factors and a *cause*. Skeptical of post-hoc storytelling.
      *   **Topic:** The Great Divergence (Why Britain industrialized and not China).
      *   **Goal:** Wants a "specification" or "requirements document" for a valid historical explanation *before* reading books. Wants to know what counts as an explanation vs. a story.
      *   **Specific Questions to Address:**
          *   Requirements for a valid explanation (with reasoning).
          *   Shape of the question (contrast class, timing, counterfactuals like the Dutch).
          *   Handling luck/chance.
          *   Causality vs. Consequence.
          *   Hindsight vs. Foresight.
          *   Non-negotiable vs. "taste/camp" requirements.
          *   Which requirement knocks out the most popular answers.
          *   **Crucial:** Are there incompatible requirements? (The "Impossible Spec" hypothesis).
      *   **Constraints:** No book recommendations. Focus on the logic/epistemology of historical explanation.

  2.  **Deconstruct the "Incident Review" Analogy:**
      *   The user knows that in safety engineering, you look for the *root cause* (the thing that, if changed, prevents the incident).
      *   They know about "sister plants" (control groups).
      *   They know about "post-hoc rationalization" (listing everything that was off).
      *   They know sometimes the answer is "no single cause" (systemic complexity), which stakeholders hate.
      *   *Application:* I need to translate historical methodology into Incident Review language.

  3.  **Drafting the Requirements (The "Spec"):**
      *   *Requirement 1: The Contrast Class.* You can't explain "Britain" without defining "Not-Britain." Is it China? The Yangtze Delta? The Netherlands? France?
      *   *Requirement 2: Timing.* Why 1760? Why not 1660 or 1860?
      *   *Requirement 3: Causality vs. Correlation (Endogeneity).* Did coal cause growth, or did growth make coal mining viable?
      *   *Requirement 4: Mechanism.* Not just "they had coal," but "how did coal translate to steam engines?"
      *   *Requirement 5: Robustness to Luck.* Can it handle stochastic events?
      *   *Requirement 6: Predictive/Falsifiable.* Could an observer in 1700 have predicted this?

  4.  **Categorizing Requirements (Non-Negotiable vs. "Taste"):**
      *   *Non-Negotiable:* Internal consistency, defining the counterfactual, distinguishing cause from effect. (These are logic basics).
      *   *Taste/Camp:* "Must offer policy lessons for today," "Must be morally satisfying," "Must be deterministic (no luck)."

  5.  **Identifying the "Killer" Requirement:**
      *   Which one kills the most pop-history answers?
      *   *Candidate:* The "Sister Plant" requirement (The Contrast Class). Most lists (coal, culture, colonies) fail because China had equivalents or the Netherlands had them earlier.
      *   *Candidate:* The "Timing" requirement. Why *then*?
      *   *Decision:* The **Contrast Class + Timing** combination is the strongest filter. Specifically, the "Yangtze Delta Control Group" (Pomeranz's argument) is the hardest hurdle.

  6.  **Addressing the "Impossible Spec" (The Collision):**
      *   The user suspects: "Name a difference," "No Luck," and "Generalizable" are incompatible.
      *   *Analysis:*
          *   If you demand a *specific* difference (Requirement A), you lean towards contingency/luck (Requirement B violation?).
          *   If you demand *no luck* (Determinism), you need general laws (Requirement C).
          *   If you need *general laws* (C), you struggle with the single case study (N=1).
          *   *The Collision:* To avoid "just a story" (luck), you need a general rule. To explain the specific divergence (Britain vs. China), you need specific conditions. If the specific conditions are unique (N=1), you can't derive a general rule. If you derive a general rule, it usually applies to the Dutch too (who failed).
      *   *Step-by-Step:*
          1.  Demand Specificity (Why Britain?).
          2.  Demand Determinism (No "just luck").
          3.  Demand Generalizability (Must apply elsewhere/Dutch).
          4.  Show how satisfying 2 & 3 usually breaks 1 (The Dutch Problem).
          5.  Show how satisfying 1 & 2 usually breaks 3 (The Unique Case Problem).
          6.  Show how satisfying 1 & 3 usually breaks 2 (The Luck Problem).

  7.  **Refining the Tone:**
      *   Match the user's professional, analytical, slightly cynical tone.
      *   Use their terminology (Incident Review, Sister Plant, Root Cause).
      *   Avoid academic jargon where possible, or explain it through the lens of safety analysis.

  8.  **Drafting the Content (Iterative refinement):**
      *   *Intro:* Acknowledge the validity of their RCA background.
      *   *Section 1: The Spec.* List the requirements with the "Case/Consideration" as requested.
      *   *Section 2: The Filter.* Non-negotiable vs. Taste.
      *   *Section 3: The Killer.* Which requirement breaks the pop answers? (The Control Group).
      *   *Section 4: The Collision.* The core philosophical conflict.

      *(Self-Correction during drafting)*: Make sure I explicitly answer the "Shape of the Question" bits they asked about (China vs. Britain size, Timing, Dutch, Luck, Cause/Effect, Hindsight).
      *(Refinement on the Collision)*: Be precise. The tension is between *Sufficiency* and *Necessity* in a single-case study. If a factor is necessary, why didn't it trigger elsewhere? If it's sufficient, why did it need so many other factors?

  9.  **Final Review against Constraints:**
      *   No book recommendations? Check.
      *   Address the "Impossible Spec" hypothesis? Check.
      *   Step-by-step collision? Check.
      *   Tone match? Check.

  10. **Final Polish:** Ensure the distinction between "proximate cause" and "root cause" is clear, as that's the user's bread and butter. (e.g., Steam engine is proximate, property rights might be root, but why property rights *then*?)

  *(Self-Correction on the "Luck" aspect)*: In incident review, "human error" or "bad luck" is often a stop-gap. But in history, "contingency" is a valid structural element. I need to clarify that "surviving luck" doesn't mean "proving no luck existed," it means "explaining why the system was vulnerable to that specific luck."

