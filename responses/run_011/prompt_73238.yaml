  8.  (Final thought on the "Single Piece of Evidence"): The most moving evidence would be a controlled experiment or a historical case study where clarifying the *purpose* resolved the *factual* fight. If that exists, it proves the thesis. If not, it weakens it. Let's suggest: *A school board transcript where a consensus on the "goal of the class" preceded consensus on the curriculum content.*

