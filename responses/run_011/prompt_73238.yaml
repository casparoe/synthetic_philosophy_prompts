answer: |-
  This is a remarkably sophisticated meta-ethical claim about history education, especially for a high school junior. You are arguing that the *ontology* of the dispute (what the fight *is*) is being misidentified by the participants as *epistemic* (what we *know*), when it is actually *teleological* (what we are *for*).

  This is a strong position because it explains the intractability of the conflict. However, strong positions often hide their vulnerabilities behind charitable interpretations of opponents. To stress-test this, I will rank defeaters from fatal (destroys the core mechanism) to awkward (requires complex patching), and then address your specific questions on predictions, observation, and falsifiability.

  ### Ranked Defeaters

  **1. The "Bad Faith" Defeater (Fatal)**
  *   **The Challenge:** Your model assumes disputants are confused about the nature of their disagreement (thinking it's factual when it's design). But what if key actors know exactly what they are doing? If a political operative pushes a factual inaccuracy not because they prioritize "civic cohesion" over "critical inquiry," but simply because that inaccuracy mobilizes voters or donors, your design theory is irrelevant. It is not a category error; it is a weapon.
  *   **Defender's Reaction:** A committed defender would likely **explain this away**. They would argue that even bad-faith actors must cloak their power grabs in the language of design or fact to be effective. Therefore, the *public* dispute still operates within the framework you described, even if private motives differ.
  *   **Why it hurts:** It renders your theory descriptive of the *rhetoric* but not the *causality*. If the cause is power, not design confusion, fixing the design confusion won't end the fight.

  **2. The "Joint Textbook" Defeater (Fatal)**
  *   **The Challenge:** You mention international cases. The Franco-German history textbook project (*Histoire/Geschichte*) is the counter-example. France and Germany had radically different civic purposes (one republican/universalist, one grappling with particularist guilt). Yet, historians from both sides produced a shared text. They did not agree on a single "purpose" for history class; they agreed on *facts and interpretations* despite maintaining distinct national narratives.
  *   **Defender's Reaction:** A defender might **concede** this limits the scope of the theory. They would argue this works only between liberal democracies with shared epistemic norms, not within a polarized single polity where the definition of the "shared political project" is itself the contest.
  *   **Why it hurts:** It proves that divergent civic purposes do not *necessarily* preclude factual agreement. If they can do it across a border that once required war to cross, why can't it be done within a state? This suggests the barrier is not "purpose" but something else (e.g., media incentives).

  **3. The "Irreducible Fact" Defeater (Significant)**
  *   **The Challenge:** Some disputes are purely evidentiary with no clear civic teleology. For example, debates over the exact population count of a pre-Columbian city, or the specific date a document was signed. If parents fight bitterly over a number that changes no moral valuation and supports no civic narrative, your theory fails.
  *   **Defender's Reaction:** A defender would **explain this away** by arguing that *all* facts are selected for a reason. If someone fights over a number, it is because that number serves as a proxy for authority ("Who decides what is true?").
  *   **Why it hurts:** This begins to look like the "unfalsifiability" problem you worried about. If every factual dispute is reinterpreted as a proxy for authority, the theory becomes a universal solvent that dissolves all counter-evidence.

  **4. The "Heterogeneous Purpose" Defeater (Awkward)**
  *   **The Challenge:** You posit a binary: sustain a political project vs. weigh evidence. In reality, most educators and parents want *both*. They want children to be patriotic *and* critical. The conflict arises not from choosing one purpose, but from disagreeing on the *sequence* or *weighting* of compatible purposes.
  *   **Defender's Reaction:** A defender would **concede** the binary is a heuristic, but argue that in practice, resources are zero-sum. Time spent deconstructing myths is time not spent building them.
  *   **Why it hurts:** It complicates the solution. If the goal is integration rather than selection, "deciding the purpose" is harder than you imply.

  ### Predictions vs. Rival Accounts

  Here is how your view distinguishes itself from the three rivals you mentioned:

  | Rival Account | Their Prediction | Your View's Prediction | How to Test |
  | :--- | :--- | :--- | :--- |
  | **Partisan Conflict** | Disputes track with polling on specific policies. If a policy becomes popular, the history narrative shifts to match. | Disputes track with *anxiety about social cohesion*. Even if a policy is popular, if the narrative threatens the "origin story," the fight continues. | Check if curriculum fights intensify during times of low trust in institutions, regardless of which party holds power. |
  | **Genuine Historiography** | Disputes resolve when new archives open or consensus emerges among PhD historians. | Disputes persist *despite* professional consensus. The fight is immune to new evidence because the evidence isn't the point. | Track a specific historical claim where expert consensus shifted but the public debate remained static (e.g., 1619 arrival dates). |
  | **Market/State Rules** | Content changes when adoption laws (e.g., Texas Board of Education) change. | Content remains culturally contested even when laws are clear. The "fight" moves from the text to the teacher's supplement or classroom discussion. | Compare states with strict adoption laws vs. local control. If the *nature* of the fight is the same in both, it's not about rules. |

  ### Ordinary Observation: Surveys and Hearings

  Your view is exposed to ordinary observation in school board hearings.
  *   **What your view predicts:** You should hear phrases like "This makes students hate America" (Civic Purpose) or "This teaches them to question everything" (Critical Purpose). You should *not* hear detailed citations of archival evidence, because the disputants don't actually care about the archive.
  *   **What would count against you:** If hearing transcripts show parents and board members engaging deeply with primary sources, correcting each other's citations, and changing their minds based on document authenticity, then it *is* an evidentiary fight.
  *   **Current Reality:** Most transcripts support you. People rarely cite archives; they cite values. However, a survey of *historians* involved in these fights might show they genuinely believe the other side is getting the facts wrong, not just the framing. If the experts themselves are not "in on" the design dispute, your claim that "most would concede... under patient questioning" is an assumption, not a finding.

  ### Handling Straightforward Factual Disputes

  You asked: *Can it handle cases that look like straightforward factual disputes?*

  This is your vulnerability. If a parent asks, "Did this specific lynching happen in this county?" and the school says "No," and the parent produces a death certificate:
  *   **Your View:** You must argue the school isn't denying the certificate; they are denying the *relevance* of including it in the standard narrative.
  *   **The Risk:** If the school explicitly denies the *event occurred*, your theory collapses. That is a lie, not a design choice.
  *   **The Fix:** You must distinguish between **Curricular Facts** (what we choose to teach) and **Historical Facts** (what happened). Your theory applies to Curricular Facts. If the dispute bleeds into denying Historical Facts, that is not a design dispute; that is propaganda. You must concede that some portion of the current conflict is simply misinformation, not philosophical confusion.

  ### International Cases and Joint Texts

  The Franco-German textbook is the hardest case for you.
  *   **The Case:** Historians from both nations agreed on a text. They did not agree on a single "national purpose." They agreed that *truth-telling* was a higher purpose than *national myth-making*.
  *   **Implication:** This suggests there is a third option: "Professional Integrity."
  *   **Your Counter:** You could argue that "Professional Integrity" *is* the shared political project they agreed upon (a project of European reconciliation).
  *   **Weakness:** This stretches the definition of "political project" so wide it loses meaning. If "seeking truth" counts as a political project, then your binary (Politics vs. Truth) dissolves.

  ### The Unfalsifiability Problem

  You are right to worry. Your view risks being a "universal hermeneutic of suspicion." If every factual claim can be absorbed as "really being about framing," the theory cannot be proven wrong.

  *   **Is this a problem?** Yes. A theory that explains everything explains nothing.
  *   **Is it expected?** For a philosophical claim about *intent*, some insulation is expected. People rarely know their own motives.
  *   **The Fix:** You must specify a condition under which you would be wrong.
      *   *Condition:* If a curriculum dispute is resolved *solely* by the discovery of new evidence, without any shift in the stated civic goals of the participants, your theory is weakened.
      *   *Condition:* If a survey shows that disputants, when asked "Would you accept this fact if it undermined your preferred narrative?" answer "Yes," your theory is falsified. (They will almost certainly answer "No," which supports you).

  ### The Single Piece of Evidence

  To move you (either to confirm or falsify your view), you need evidence that isolates **purpose** from **fact**.

  **The Evidence:** A transcript of a school board meeting or legislative hearing where the participants **explicitly agree on the purpose of the class** (e.g., "We all agree the goal is critical inquiry") **but still fail to agree on the content.**

  *   **Why this moves you:**
      *   **If this happens:** It proves that purpose is *not* the root cause. The disagreement is genuinely about facts, interpretation, or power, even when the design question is settled. This would be fatal to your thesis.
      *   **If this never happens:** It strongly supports your thesis. It suggests that whenever purpose is clarified, the factual disputes dissolve or reveal themselves as secondary.

  **Recommendation:** Look for cases where a district adopted a "neutral" inquiry-based model (settling the design question) and see if the controversies stopped. If the controversies continued (e.g., "Your inquiry questions are biased"), your view is robust. If the controversies vanished, your view is correct. If the controversies shifted to pure resource allocation, your view needs refinement.

  **Final Assessment:** Your view is intellectually robust and likely more accurate than the standard "facts vs. lies" narrative. However, it risks being too charitable to bad actors and too rigid in its binary of purposes. To harden it, acknowledge that some disputes are simply power grabs disguised as philosophy, and that "truth" can sometimes be a shared purpose that transcends national projects.
