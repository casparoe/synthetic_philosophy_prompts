      *   *Fatal Defeater 2: Bad Faith/Power Grabs.* Some actors *know* the facts but lie to gain power. It's not a confusion about design; it's a strategic weaponization of misinformation.
      *   *Awkward Defeater 1: The "Purpose" is Often Explicitly Stated as Fact.* If disputants explicitly say "This fact is wrong" and mean it literally, claiming they *really* mean "This doesn't fit our civic narrative" might be charitable to the point of distortion.
