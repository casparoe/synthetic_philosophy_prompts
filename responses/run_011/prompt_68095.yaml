answer: |-
  (a) **Three Reconstructed Principles**

  To account for the nine verdicts without exception, we might distil the following three principles. Each turns on a specific clause regarding disclosure, capacity, or baseline.

  **1. The Procedural Autonomy Principle**
  *   **The Clause:** Consent is valid if and only if (i) all material facts concerning physical acts and risks are truthfully disclosed, and (ii) the consenter possesses the capacity to weigh those risks against their personal situation.
  *   **Disclosure:** Must cover *what* will be done and *what* might happen (Cases 1, 2, 3). Motives or hypotheses need not be disclosed (Case 2). Framing does not constitute concealment (Case 3).
  *   **Capacity:** Requires the ability to value the risk, not merely recite it (Case 8 vs. Case 7).
  *   **Baseline:** Irrelevant. This principle looks only at the transaction's internal mechanics.
  *   **Account:** Explains Cases 1, 2, 3, 7, 8. To explain 4, 5, 6, 9, it must assume that debt, redundancy, threats, and landlord neglect do not inherently negate capacity or disclosure, unless they cross into coercion (Case 5).

  **2. The Clean Hands Baseline Principle**
  *   **The Clause:** Consent is invalid if the necessity for the choice was caused by the offeror's prior wrongdoing; valid if the necessity arose from independent circumstances or the consenter's own situation.
  *   **Disclosure/Capacity:** Assumed to be met (as per Principle 1).
  *   **Baseline:** Measured against moral responsibility. Did the offeror create the predicament through fault?
  *   **Account:** Explains Case 9 (Landlord's neglect) and Case 5 (Threat of wrongful dismissal). Explains Case 4 (Debt not caused by researcher) and Case 6 (Redundancy independently planned). It treats Case 1 as a subset of wrongdoing (deception).

  **3. The Threat-Offer Distinction Principle**
  *   **The Clause:** Consent is invalid if the proposal worsens the consenter's position relative to the status quo (a threat); valid if it improves it (an offer), unless the offer is designed to remedy a harm for which the offeror is responsible.
  *   **Disclosure/Capacity:** Assumed to be met.
  *   **Baseline:** Measured against the immediate pre-proposal status quo.
  *   **Account:** Explains Case 5 (Threat of dismissal) vs. Case 6 (Offer of retention). Explains Case 4 (Offer of payment). Explains Case 9 (Offer to fix own harm treated as invalid). Explains Case 1 (Deception negates the 'offer' status).

  (b) **Implications for the Aquifer Case**

  **1. The Procedural Autonomy Principle**
  *   **Implication:** **Valid.** All material facts are disclosed, including the causal finding. The adults are competent and able to weigh the risk (per the test in Cases 7 and 8).
  *   **Load-Bearing Verdict:** Case 4 (Debt). Here, as there, external hardship does not invalidate consent if information and capacity are sound.
  *   **Rival to Explain Away:** Case 9. This principle must dismiss Case 9's reasoning as merely illustrative of a specific type of coercion (threat) rather than a general rule about causal responsibility. It must argue the landlord's offer was effectively a threat ("fix my wrong or stay damp"), whereas the aquifer offer is a pure benefit.

  **2. The Clean Hands Baseline Principle**
  *   **Implication:** **Invalid.** Although the company's actions were not wrongful *at the time*, they are the *cause* of the dry wells. The principle turns on causal responsibility for the predicament, not merely legal liability at the time of action.
  *   **Load-Bearing Verdict:** Case 9. The reasoning ("choice came from the very party whose wrongdoing had produced it") is the anchor. The aquifer case matches the structure: the party offering the remedy created the need for it.
  *   **Rival to Explain Away:** Case 4. This principle must distinguish the company from the researcher in Case 4. The researcher did not cause the debt; the company *did* cause the dryness. The distinction holds, but it requires expanding "wrongdoing" in Case 9 to "causal responsibility," which may stretch the original verdict's wording.

  **3. The Threat-Offer Distinction Principle**
  *   **Implication:** **Valid.** The company offers piped water (an improvement) to households that currently have dry wells. It does not threaten to dry them further.
  *   **Load-Bearing Verdict:** Case 6. Like the owner offering retention during redundancy, the company offers a benefit during a crisis.
  *   **Rival to Explain Away:** Case 9. This principle must argue that the landlord's offer was qualitatively different because the dampness was an *ongoing unlawful neglect*, whereas the aquifer drawdown was a *completed lawful act*. The landlord was still in breach of duty; the company is not.

  (c) **Closest Analogue**

  The closest analogue is **Case 9 (The Landlord)**.

  Both cases involve an offeror who is causally responsible for the consenter's vulnerability (damp housing vs. dry wells) offering a remedy contingent on research enrolment. The disanalogy doing the work is the **temporal status of the fault**. In Case 9, the neglect was unlawful *at the time* and ongoing. In the Aquifer case, the drawdown was lawful *at the time* and the consequence was unknowable.

  If Case 9 governs, the disanalogy is irrelevant; causation is the key. If Case 6 governs (independent crisis), the disanalogy is decisive; the company is not an innocent third party like the market forces in Case 6, but it is also not a *wrongdoer* like the landlord. The fight will be over whether "lawful causation" is sufficient to taint the consent.

  (d) **The Verdict and the Principle**

  If you wish to be consistent with the *structural distinctions* your group has already drawn—specifically the difference between Case 4/6 (external cause of vulnerability) and Case 9 (internal cause of vulnerability)—you ought to record a verdict of **Invalid**.

  **The Principle Adopted:** **The Causal Responsibility Principle.** Consent is invalid when the offeror leverages a dependency they created, regardless of whether that creation was initially wrongful.
  **Transactions Licensed by the Other Way (Valid):** If you vote Valid, you license **Remedial Exploitation**. A party may create a dependency through non-negligent but risky enterprise, then monetise the remedy by conditioning it on research participation or liability waivers. This creates a class of "blameless captors" who hold veto power over the welfare of those they affect.
  **Transactions Licensed by This Way (Invalid):** If you vote Invalid, you license **Research Barriers**. You prevent valuable surveillance (which might prevent future kidney injury) because the sponsor has a complex history with the subjects. It may deter companies from remedying past harms if doing so exposes them to research governance they could otherwise avoid.

  (e) **Assessing the Historian's Option-Set Principle**

  The Historian's principle states: *"Consent fails whenever a transaction leaves a person with fewer acceptable options than they had before the proposer appeared on the scene."*

  **The Verdict that Kills It:** **Case 9.**
  In Case 9, before the landlord appeared with the offer, the tenants had damp, unheated housing (one acceptable option: stay; one unacceptable: leave). When the landlord appeared, he offered water/heat in exchange for study. This *increased* the number of acceptable options (Stay damp OR Stay warm+Study). Under the strict wording of the Historian's principle, consent should be **Valid**. The verdict was **Invalid**.

  **Amendment to Survive:** The principle must be amended to reference the **Legitimate Baseline**, not the Factual Baseline. *"Consent fails whenever the proposer has reduced the consenter's options relative to what they ought to have had, and then offers to restore them."*

  **Implication for Aquifer:** Under the amended principle, the verdict is **Invalid**. The households *ought* to have had working wells (or compensation). The company reduced that option set (via drawdown) and now offers to restore it conditionally. The lack of *ex ante* wrongfulness matters less than the deviation from the legitimate baseline of water security.

  (f) **The Capacity Counter-Argument**

  The argument that a household with dry wells cannot weigh options any better than the volunteer in Case 8 is a **misuse of your precedents**.

  In Case 8 (Depression), the impairment was *internal* and *pathological*; the volunteer could recite risks but could not *value* them correctly due to the illness. In Case 4 (Debt) and Case 6 (Redundancy), the group explicitly ruled that *external* pressure does not equate to incapacity. The volunteer in Case 4 was in "acute debt" yet consent was valid. The workers in Case 6 faced job loss yet consent was valid.

  To rule the Aquifer households incapacitated would be to conflate **desperation** with **incompetence**. Your group has consistently held (Cases 4, 6) that a hard choice is still a choice, provided the mind is sound. To rule otherwise now would undermine the validity of almost all research involving economically vulnerable populations, contradicting Case 4.

  (g) **The Next Case**

  To discriminate between the **Procedural Autonomy Principle** (Valid) and the **Causal Responsibility Principle** (Invalid), you should set a case where the causal link is undeniable, but the "wrongdoing" is entirely absent, and the benefit is critical.

  **Proposed Case:** *The Genetic Archive.*
  A biobank stores tissue samples from 10,000 patients collected ten years ago for routine diagnostics. Consent then was for "storage and future research." A new technology now allows these samples to predict a fatal, untreatable neurological condition with 100% accuracy. There is no cure. The biobank proposes to run the test and inform participants, but only if they agree to a lifelong lifestyle surveillance study to map disease progression. Those who decline will not be tested (to prevent psychological harm without support). The samples are legally the property of the biobank. No new sample is taken.

  **Principle 1 (Procedural Autonomy):** **Valid.** Disclosure is full. Capacity is assumed. The biobank is not threatening harm; it is withholding a new benefit (knowledge) conditional on study. The initial collection was lawful.
  **Principle 2 (Causal Responsibility):** **Invalid.** The participants' vulnerability (potential fatal diagnosis) is accessible *only* because of the biobank's holdings. The biobank controls the key to their future knowledge and leverages that control to secure research enrolment. They are monetising a dependency they created (the archive).

  This case strips away the "physical harm" element of the aquifer (kidney risk vs. water) and the "past wrong" element (lawful storage vs. lawful drawdown), leaving only the **leverage of dependency**. If you vote Valid, you side with Procedural Autonomy. If Invalid, you side with Causal Responsibility.
