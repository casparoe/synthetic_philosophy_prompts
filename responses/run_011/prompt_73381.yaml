  Okay so this has been bugging me for like a month and I figured I'd just ask someone who actually knows philosophy. Pretend you're a professor who works on value theory and decision-making, and please actually think it through instead of throwing a term at me and calling it a day — the term is kind of the least important part of what I want.

  Here's the pattern. My older sister is trying to decide whether to go to med school, and every single person she asks who did go says some version of "hardest thing I ever did, wouldn't trade it, I'm so glad." My neighbor quit his accounting job like twelve years ago to open a bakery, works insane hours, makes less money, and says becoming a baker made him who he is and he'd do it again in a heartbeat. And there's this teacher at my school who got really sick in her twenties and now says it was the best thing that ever happend to her. Three totally different situations and one of them wasn't even a decision. But every one of them, when you ask whether it was worth it, says yes — and I don't think they're lying or being brave about it. I think the thing they went through actually changed what they now count as a good life, so when they look back and measure the choice, they're measuring it with a ruler the choice itself handed them. My sister keeps saying "fine but I want to hear from someone who regrets it," and nobody can produce that person, and I don't think it's because the regretters are hiding. I think it's because regretting it would require them to still be someone whose standards the outcome didn't reshape, and that person doesn't exist anymore to do the regretting.

  So: does this have a name? Don't give me a bibliography or a reading list, I can't chase down papers anyway. I know there's a whole thing about how you can't know what an experience is like until you've had it, and I've heard people talk about how your preferences adjust to whatever situation you're stuck in — but neither of those is what I mean. It's not the *knowing what it's like* part, and it's not about settling for less than you could've had. It's specifically that the choice alters the criteria that get used to grade the choice, afterwards, so the deliberation feels rigged no matter which way you go. Is there an established concept for exactly that? If there is, tell me what it is and where my description overreaches or undershoots it. If there isn't, don't just shrug — brainstorm like four or five candidate names, pick the one you'd actually defend, give it a real definition, and then tell me where its edges are. Like: does it still count if the person says they'd undo it? Does it count when nobody chose anything, like my teacher's illness? Is the person in the loop necessarily being irrational, or is there a version where the whole thing is fine? And how is this different from hindsight bias or just plain rationalizing, because that's what my friends said and I think they're wrong but I can't explain why.
