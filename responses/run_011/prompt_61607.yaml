answer: |-
  **MEMORANDUM**

  **TO:** Animal Welfare and Ethical Review Board
  **FROM:** Chair
  **DATE:** October 24
  **SUBJECT:** Decision on Protocol 24-COG-09 (Aversive Discrimination in Arthropods)

  **DECISION ON PROTOCOL**

  The Board grants **Conditional Approval** for Protocol 24-COG-09, contingent on the following revisions to be verified by the attending veterinarian before initiation. The woodlouse arm is approved as submitted. The honeybee arm is approved subject to shock parameters not exceeding 2V for durations under 500ms, with a maximum of five shocks per session. Honeybee housing must include structural enrichment (wooden dowels) and a minimum flight cage volume of 0.5 cubic meters. The salticid spider arm is **not approved** under the current husbandry plan. To proceed, the investigator must specify a cage volume allowing for full extension of locomotor sequences (minimum 20x body length), provide vertical structural complexity for detour practice, and define a humane endpoint triggered by refusal of food for 72 hours or loss of turgor. Any deviation from these parameters requires immediate suspension and return to the Board.

  **DIAGNOSIS OF BOARD IMPASSE**

  We must think aloud about what our manual's current clause commits us to before we can fix it. Reading A ("capable of learning") protects everything from bees to woodlice but renders the substitution principle ("least cognitively elaborate") vacuous; if all three arms learn, the clause offers no traction to prefer one over the other. Reading C (scaffolded individuals) is irrelevant here; none of these subjects are lexigram users, yet their welfare matters. Reading B (internal models/evaluation) captures the moral intuition behind the manual—that confinement harms an animal more if it deprives it of capacities it possesses—but relies on constructs non-specialists cannot reliably adjudicate.

  The core disagreement is not about welfare but about administrability. We are attempting to use an explanatory taxonomy as an axiology. The taxonomy describes how minds work (nested capacities), but the manual requires a scale to rank them for substitution. My hypothesis is that the persistent conflict arises because the ladder is nested: every higher rung contains the lower ones. Thus, the taxonomy yields a boundary (are you at least this complex?) but never an ordering (who is *more* complex?). We have been arguing for fifteen years about where to draw a line when the manual actually requires a scale the taxonomy was never built to provide.

  Of the three readings, only Reading A can be administered by non-specialists without drifting into inconsistency, but it fails the logical test of the second clause. Reading B is substantively correct but empirically unstable for a general committee. Therefore, we must adopt a proxy that is observable enough for Reading A but substantive enough for Reading B.

  **PROPOSED REVISION TO MANUAL**

  I propose replacing the phrase "capable of learning from experience" with: "capable of flexible behavioral adaptation indicating frustrated expectation." This shifts the focus from mere conditioning to the capacity to be wrong about the world in a way that matters to the animal.

  **Decision Procedure for Contested Taxa:**
  1.  **Burden of Proof:** Rests on the investigator to demonstrate that a proposed species lacks the capacity for frustrated expectation if they wish to exclude it from protected status.
  2.  **Evidence:** Peer-reviewed literature demonstrating behavioral flexibility beyond habituation and simple conditioning (e.g., detour behavior, tool use, navigation requiring map-like representation).
  3.  **Default Status:** In cases of unsettled evidence—which applies to most arthropods, including the bees and spiders in this protocol—the default is protection.
  4.  **Substitution Test:** When comparing species, the investigator must demonstrate that the scientific aim cannot be met by a species with a lower confidence rating for flexible adaptation.

  **ADDRESSING DISSENT**

  The comparative psychologist on this board argues that "internal models" are merely redcriptions of higher-order conditioning. She contends that animals deploy strategies interchangeably based on cost, meaning any line drawn between model-driven and habit-driven behavior will be administered inconsistently across committees. The ethicist argues that cognition is the wrong axis entirely; the only question that matters is whether the animal can suffer, and building a manual on a ladder of cleverness is a respectable way of ranking beings by their resemblance to us.

  Both objections are formidable. The ethicist challenges the foundation of our manual, suggesting we are protecting "cleverness" rather than "sentience." However, the national framework already covers suffering for vertebrates and cephalopods. Our manual's specific purpose is to extend protections based on cognitive liberty where the law is silent. Therefore, the psychologist's objection is the more serious threat to the drafting exercise. If cognitive capacities cannot be distinguished empirically by non-specialists, our manual becomes unenforceable. We mitigate this not by abandoning the cognitive axis, but by lowering the evidentiary bar for protection (the default status) while raising the bar for exemption. We accept the risk of over-protection to avoid the risk of inconsistent under-protection.

  **COST OF RECOMMENDATION**

  This recommendation costs us scope. Reading A would have protected the woodlouse arm unequivocally, as habituation counts as learning. My proposed revision ("frustrated expectation") may exclude organisms capable only of simple habituation. Consequently, the woodlouse arm sits precariously at the boundary. If future evidence suggests woodlice lack flexible adaptation, they would fall outside the manual, reverting to the national framework (which excludes them).

  Is this loss a defect of my proposal or the clause as written? It is a defect of the clause as written. The original clause promised a substitution principle ("least cognitively elaborate") that it could not deliver because "learning" is too broad a category to rank. To make the substitution principle functional, we must accept a narrower boundary. We cannot protect everything equally if we must choose between them. By tightening the definition, we sacrifice the woodlice to save the logic of the manual, ensuring that when we do require a substitute, we have a scale robust enough to justify the choice. This is not a victory for speciesism, but a concession to the necessity of administrative consistency. We must vote on whether this trade-off is acceptable.
