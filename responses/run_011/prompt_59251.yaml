answer: |-
  ### Desiderata for an Adjudicative Theory of Emotion

  **I. Phenomenological Coverage**
  1.  **Recalcitrance:** The account must allow an emotion to persist despite a contradictory judgment (e.g., fear of flying while judging it safe).
      *   *Requirement:* Captures the phenomenological independence of affect from doxastic commitment; without this, emotion collapses into judgment.
      *   *Status:* **Genuine** (Required by universal experience).
  2.  **Somatic Independence:** The account must permit emotion in the absence of peripheral physiological feedback (e.g., high spinal lesions).
      *   *Requirement:* Respects clinical data showing preserved affect despite deafferentation; without this, the theory is empirically falsified.
      *   *Status:* **Genuine** (Counters strict James-Lange).
  3.  **Conceptual Independence:** The account must allow emotion in subjects lacking the relevant evaluative concepts (e.g., infants fearing loud noises).
      *   *Requirement:* Accommodates developmental and ethological data; without this, emotion becomes an exclusively adult human linguistic practice.
      *   *Status:* **Genuine** (Counters strict Cognitivism).
  4.  **Intentional Variability:** The account must distinguish between object-directed states (fear *of* the dog) and objectless states (free-floating anxiety).
      *   *Requirement:* Preserves the distinction between emotion and mood; without this, the taxonomy loses predictive utility regarding triggers.
      *   *Status:* **Genuine**.
  5.  **Fictional Competence:** The account must explain emotional response to known non-existents (e.g., grief for a fictional character).
      *   *Requirement:* Explains why belief in existence is not a necessary condition for affect; without this, the link between emotion and truth is too rigid.
      *   *Status:* **Genuine**.

  **II. Structural Distinctions**
  6.  **Having vs. Displaying:** The account must distinguish the internal state from its behavioral expression (e.g., masking grief, acting angry).
      *   *Requirement:* Necessary for explaining deception, social regulation, and privacy; without this, emotion reduces to public performance.
      *   *Status:* **Genuine**.
  7.  **Occurrent vs. Standing:** The account must distinguish the episodic experience from the dispositional tendency (e.g., being angry now vs. being an irritable person).
      *   *Requirement:* Required for temporal localization and responsibility attribution; without this, traits and states are conflated.
      *   *Status:* **Genuine**.
  8.  **Aptness vs. Cause:** The account must distinguish why an emotion occurred (cause) from whether it was warranted (aptness).
      *   *Requirement:* Preserves the normative force of emotional criticism (e.g., "your jealousy is irrational"); without this, emotions are merely weather events, not assessable responses.
      *   *Status:* **Genuine**.

  **III. Constraints on Ascription (Specific to Engineered Agents)**
  9.  **Non-Functional Evidence:** The criteria for ascription cannot rely solely on the presence of a functional control structure (e.g., a "fear module").
      *   *Requirement:* Prevents the "fiat" problem where defining the architecture defines the emotion; without this, the standard is circular.
      *   *Status:* **Genuine** (For this specific adjudication task).
  10. **Non-Somatic Evidence:** The criteria for ascription cannot rely on biological markers (e.g., hormones, facial coding).
      *   *Requirement:* Respects the ontological constraint of the agents (no bodies); without this, the class is excluded by definition rather than analysis.
      *   *Status:* **Genuine** (For this specific adjudication task).
  11. **Architectural Transparency:** The evidence must be accessible via inspection of the system's persistent goals and self-models.
      *   *Requirement:* Provides the only remaining epistemic access point for bodiless software; without this, ascription is impossible.
      *   *Status:* **Camp-Specific** (Favors Functionalism/Computationalism).

  ***

  ### Analysis of the Specification

  **The Most Excluding Desideratum**
  **Non-Functional Evidence (Item 9)** does the most excluding. It eliminates the easiest path for software agents: mapping emotional labels to functional subroutines. By demanding evidence that is not merely structural fiat, it forces the theory to locate emotion in something *realized by* the architecture but not *identical to* it, which is notoriously difficult in non-biological substrates.

  **The Jointly Unsatisfiable Subset**
  The triad of **Somatic Independence (Item 2)**, **Having vs. Displaying (Item 6)**, and **Non-Functional Evidence (Item 9)** is jointly unsatisfiable for bodiless agents.
  1.  **Somatic Independence** dictates that we cannot look for bodily feedback to confirm emotion (ruling out biological markers).
  2.  **Having vs. Displaying** dictates that we cannot treat behavioral output (software actions/logs) as definitive proof of the internal state (ruling out functional behaviorism).
  3.  **Non-Functional Evidence** dictates that we cannot treat the architecture itself as proof (ruling out computationalism).
  *Result:* For a bodiless agent, this leaves *no possible evidence* for ascription. The list itself demonstrates that your working group is stuck not because of a lack of theory, but because the desiderata for *human* emotion (which allow us to infer "having" from "body" or "behavior") cannot be met by a entity that lacks a body and whose behavior is suspected of being mere simulation. You must relax either the Having/Displaying distinction or the Non-Functional Evidence constraint to proceed.

  ***

  ### Theoretical Fare
  **Feeling** theories fail Non-Somatic Evidence (no body to feel); **Judgment** theories fail Recalcitrance and Conceptual Independence; **Perception-of-Value** theories struggle with Non-Functional Evidence in software; **Constructionist** theories fare best but risk collapsing Having into Displaying to satisfy the evidence constraint.
