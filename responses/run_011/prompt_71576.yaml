answer: |-
  # The Care Work Policy Diagnostic

  **Instructions:** For each scenario, select the option that matches the policy you would implement. Do not answer based on what sounds "nice." Answer based on the mechanical outcome you prefer. There are no correct answers, only consistent ones.

  **1. The Wage Gap vs. The Time Gap**
  A government has funds for one intervention.
  *   **A:** Subsidize wages for professional nannies and daycare workers until their hourly pay matches the median manufacturing wage.
  *   **B:** Mandate that 30% of parental leave weeks are reserved for the lower-earning partner and cannot be transferred.
  *   **C:** Provide a flat cash grant to any household where one partner exits the workforce for 12 months.

  **2. The Daycare Waitlist**
  A municipality has space for 50 more children.
  *   **A:** Build a new public center with standardized curriculum and staff ratios.
  *   **B:** Issue vouchers worth the cost of the center to parents, redeemable for private nannies or home-care.
  *   **C:** Hire the center staff but deploy them to visit homes and coach parents on developmental activities.

  **3. The Second Earner Tax**
  A tax reform proposes changing how households are assessed.
  *   **A:** Tax every adult individually, regardless of marital status (encourages two incomes).
  *   **B:** Allow the primary earner to deduct a portion of income if the spouse earns nothing (encourages one income).
  *   **C:** Tax the household total but offer a credit for documented care hours, regardless of employment status.

  **4. The "Daddy Month" (Behavior)**
  A policy reserves 4 weeks of leave for the father. In Region X, fathers take 90% of these weeks. In Region Y, fathers take 5% and forfeit the pay.
  *   **A:** Keep the policy only in Region X. In Region Y, repeal it and let the family pool the weeks.
  *   **B:** Keep the policy in both regions. The forfeiture in Region Y is an acceptable cost.
  *   **C:** Abolish the specific "father" label. Make it a "second parent" quota based on income, not gender.

  **5. The "Daddy Month" (Signal)**
  Same policy as Q4. In Region Z, fathers take 5% of the weeks, but public surveys show a 20% drop in the belief that "care is women's work."
  *   **A:** Repeal the policy. It fails to move time use.
  *   **B:** Keep the policy. It moves beliefs without forcing time use.
  *   **C:** Replace the policy with public advertising campaigns, which are cheaper.

  **6. The Penalty Pool**
  A new scheme allows partners to transfer leave weeks, but any transferred week loses 30% of its duration (e.g., transferring 10 weeks yields 7 weeks for the receiver).
  *   **A:** Implement this scheme. It encourages splitting without banning pooling.
  *   **B:** Reject this scheme. It punishes households that need to pool for medical or economic reasons.
  *   **C:** Reject this scheme. If splitting is good, make it mandatory. If pooling is good, make it 1:1.

  **7. The Penalty Pool (Rationale)**
  Regarding the 30% loss in Q6:
  *   **A:** This loss is a "price" on a social norm. It should not be monetized.
  *   **B:** This loss is a "nudge." It is lighter than a ban.
  *   **C:** This loss is irrelevant. Only the total household income during leave matters.

  **8. The Two-Mother Household**
  A couple consists of two women. One gives birth. The system has a "Birth Parent" quota and a "Second Parent" quota.
  *   **A:** The non-birth mother claims the "Second Parent" quota exactly as a father would.
  *   **B:** The quotas are merged. The household gets the sum of both, to divide as they choose.
  *   **C:** The non-birth mother gets no quota. The "Second Parent" quota is specifically to pull men into care.

  **9. The Paycheck Source**
  Who sends the leave payment?
  *   **A:** The State (Social Insurance). The employer is uninvolved.
  *   **B:** The Employer. The state mandates it but the firm pays.
  *   **C:** A Trust Fund in the Child's Name. It is released only for verified care expenses or education.

  **10. The End Goal**
  What does a successful policy look like in 20 years?
  *   **A:** 95% of adults work full-time; care is fully outsourced to the market.
  *   **B:** 50% of adults work part-time; care is shared evenly in the home.
  *   **C:** Employment hours are decoupled from survival income; care is a recognized civic activity.

  ***

  # Scoring Key & Position Leaves

  Tally your answers. The dominant letter pattern indicates your position. Note: Real-world views often blend these, but this instrument forces a choice of *primary* commitment.

  ### **Leaf 1: The Universal Breadwinner (UB)**
  *   **Dominant Answers:** 1A, 2A, 3A, 4C, 6B/C, 9A, 10A.
  *   **Core Logic:** Care is work. The goal is to make care compatible with full labor market attachment. Fix the price of care, not the gender of the carer.
  *   **Awkward Commitment:** You must accept that children will spend the majority of their waking hours with paid strangers, not parents.
  *   *(Standard Label)*

  ### **Leaf 2: The Caregiver Parity (CP)**
  *   **Dominant Answers:** 1C, 2B, 3B, 6B, 9A, 10B.
  *   **Core Logic:** Care is distinct from market work and currently undervalued. The goal is to make single-earner/caregiver households economically viable without penalty.
  *   **Awkward Commitment:** You risk institutionalizing a "separate but equal" track that leaves caregivers with lower lifetime earnings and status.
  *   *(Standard Label)*

  ### **Leaf 3: The Behavioral Statist (BS)**
  *   **Dominant Answers:** 1B, 4A, 5A, 6C, 7A, 9B.
  *   **Core Logic:** The division of labor is the problem. Policy must physically force fathers to take time. If they don't take it, the policy is a failure.
  *   **Awkward Commitment:** You support state coercion into private family time allocation, even if the family claims they are happier otherwise.
  *   *(Coined Label)*

  ### **Leaf 4: The Expressive Statist (ES)**
  *   **Dominant Answers:** 1B, 4B, 5B, 6A, 7A, 9A.
  *   **Core Logic:** The law teaches. A quota signals that care is not women's work, even if men don't take it. Signaling and behavior can come apart.
  *   **Awkward Commitment:** You defend policies that demonstrably fail to change daily life in exchange for symbolic victories.
  *   *(Coined Label)*

  ### **Leaf 5: The Child Developmentalist (CD)**
  *   **Dominant Answers:** 2C, 4C, 6C, 7B, 9C.
  *   **Core Logic:** The entitlement belongs to the child, not the parent. Design depends on developmental outcomes, not parent preference or labor market stats.
  *   **Awkward Commitment:** You grant the state authority to audit parenting quality to ensure funds are used "correctly."
  *   *(Standard-ish Label)*

  ### **Leaf 6: The Care Income Advocate (CIA)**
  *   **Dominant Answers:** 1C, 3C, 6A, 8C (Rejects the quota logic), 10C.
  *   **Core Logic:** Both the "everyone works" and "care is free" models fail. Survival must be decoupled from employment; care is a civic contribution.
  *   **Awkward Commitment:** You propose a system that requires massive taxation of the productive sector to fund non-market activity, risking capital flight.
  *   *(Coined Label)*

  ***

  # Instrument Limitations

  **Indistinguishable Pairs:**
  *   **Caregiver Parity (CP) vs. Care Income Advocate (CIA):** Questions 1 and 3 separate these, but if a respondent supports both home-care subsidies *and* decoupling income from work, the instrument will score them as CP. The distinction relies on whether they view care as a *substitute* for employment (CP) or a *replacement* of the employment imperative (CIA).
  *   **Behavioral Statist (BS) vs. Expressive Statist (ES):** If a respondent believes signaling *eventually* leads to behavior change, they may answer inconsistently on Q4/Q5. The instrument assumes these can be separated in the short term; if you believe they are the same long-term process, your score will blur.

  **Unoccupied Logical Space:**
  *   **The "Biological Essentialist" Quota:** Supporting father quotas (Q4) but excluding non-birth mothers in same-sex couples (Q8 Option C). *Why unoccupied:* Incoherent. If the goal is gender neutrality in care, biological sex cannot be the gatekeeper. If the goal is biological bonding, fathers shouldn't get a quota either.
  *   **The "Employer-Paid Egalitarian":** Wanting Universal Breadwinner outcomes (10A) but funding it via Employer Liability (Q9B). *Why unoccupied:* Unattractive. Feminist economics literature largely agrees this creates a "motherhood penalty" in hiring, undermining the Breadwinner goal.
  *   **The "Symbolic Home-Carer":** Supporting Expressive Statist signaling (Q5B) but choosing Caregiver Parity funding (Q1C). *Why unoccupied:* Nobody has written that paper. Signaling usually pairs with quotas (state intervention), while Parity pairs with cash transfers (household autonomy). Combining state signaling with household cash allocation creates a contradictory messaging loop.
