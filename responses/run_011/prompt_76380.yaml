  ### Apparent Tensions

  **(1) and (5):** These operate on different objects of evaluation. (1) governs *intended means* (absolute prohibition), while (5) governs *foreseen side effects* (proportional prohibition). They are compatible because one bans a specific structure of action, while the other limits the permissible scale of collateral damage.

  **(3) and (6):** These evaluate different loci of moral fact. (3) rejects *private mental events* as the test for intention, while (6) locates character damage in *public dispositions and preparedness*. They are compatible because a commander's vice is visible in the orders he is willing to sign, not in the feelings he harbors while signing them.

  **(8) and (5):** These rely on different accounts of value. (8) rejects *aggregate maximization* (consequentialism), while (5) requires a *rights-based threshold* (proportionality). They are compatible because weighing harms against advantages to avoid rights violations is not the same as maximizing net good.

  ### Genuine Tensions

  **1. Severity: Critical — (1) and (9)**
  *   **The Tension:** (1) absolutely prohibits using the deaths of innocents as a means to an end. (9) permits strikes aimed at breaking the will via terror, provided the *terror* is the object, not the *deaths*. However, if the terror is produced *by* the deaths (as implied by "terror they produce"), the deaths are the means. This contradicts (1) directly.
  *   **Revision Required:** (9) must be dropped or radically restated to acknowledge that if terror depends on civilian deaths, those deaths are intended means.
  *   **Cost:** This removes "strategic bombing" aimed at morale from the set of permissible acts, significantly narrowing the doctrine's operational scope.
  *   **Cheapest Repair:** Restatement. Change (9) to: "A strike whose declared object is to break the enemy population's will is impermissible if the mechanism relied upon is the killing of non-combatants."

  **2. Severity: High — (2) and (5)**
  *   **The Tension:** (2) claims the intention/foresight distinction does *all* the moral work and nothing else carries *independent weight*. (5) asserts proportionality is a necessary condition for permissibility. If proportionality can render an act impermissible despite pure intention, it carries independent weight, falsifying (2).
  *   **Revision Required:** (2) must be revised to remove the claim of exclusivity.
  *   **Cost:** This weakens the philosophical purity of the Anscombean position, admitting that intention is necessary but not sufficient for permissibility.
  *   **Cheapest Repair:** Restatement. Change (2) to: "The distinction between killing the innocent and merely causing their deaths as a foreseen side effect... is the distinction that does the *primary* moral work here..."

  **3. Severity: Medium — (7) and (1)**
  *   **The Tension:** (7) claims modern industrial war *essentially* involves mass killing of non-fighters for decisive effect. (1) bans choosing to kill non-fighters as means. If (7) is empirically true and "means of decisive effect" implies instrumentality, (1) makes modern war impossible.
  *   **Revision Required:** (7) must be clarified to distinguish between *collateral* mass killing (foreseen) and *instrumental* mass killing (intended).
  *   **Cost:** This may require admitting that many current "decisive" strategies are impermissible, forcing a change in military strategy rather than just doctrine.
  *   **Cheapest Repair:** Restatement. Change (7) to: "...essentially every means of decisive effect involves the *foreseen risk* of mass killing..."

  ### Audit Summary

  The package is structurally sound except for the operational loophole in (9) and the philosophical overreach in (2). The tension between (1) and (9) is the most serious because it violates the specific Anscombean anchor you cited (the Truman objection); retaining (9) makes the reference to Anscombe incoherent. The tension between (2) and (5) is logically fatal but philosophically easier to patch. The tension between (7) and (1) is a feasibility constraint that limits the doctrine's application but not its internal logic.

  To stabilize the package while preserving your anchor, (9) must be conceded. It attempts to permit via description what (1) forbids via substance.

  Verdict: (1)–(9) | concede: (9)
