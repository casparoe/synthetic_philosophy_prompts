prompt: |-
  I'm three years into a novel about a woman who runs the research arm of one of those big strategic-giving foundations — longtermist in spirit, though I never use the word in the book because it dates the thing — and I've built her worldview by sort of accidentally building my own, over alot of late nights with a stack of library books I only half understood. Now I'm worried the thing I've built doesn't stand up. My agent keeps telling me to just write the scenes and let the philosophy sort itself out, but I can't, because there's a four-page argument in chapter 14 where her sister accuses her of caring about hypothetical people instead of real ones, and I have no idea what she can coherently say back until I know whether her position actually holds together or whether I've written her a smart-sounding speech that's hollow in the middle. So here's the package, stated as honestly as I can:

  (1) I'm a straight expected-value maximizer — right act is the one with the best expected value, no side-constraints, no "some things you just don't do." (2) I reject the repugnant conclusion: a world containing a hundred billion lives each barely worth living is not better than a world of a few billion flourishing ones, and any arithmetic that says otherwise has gone wrong somewhere, because numbers alone shouldn't be able to win. (3) I don't discount low probabilities as such — if the payoff is big enough, a one-in-a-billion shot outweighs near-certainty of something modest, and I think people who wave away the mugging-type cases purely because the odds are tiny are dodging the argument rather than answering it. (4) What I do discount is speculative modelling: an estimate resting on a heroic chain of assumptions gets a haircut proportional to how heroic the chain is, so my character isn't a sucker for any large number someone waves at her. (5) I think the far future counts and counts heavily — there could be an astronomical number of people who don't exist yet and their interests aren't second-class. (6) A concrete verdict I'd give without hedging: a friend deciding between selling her house to fund a one-in-a-billion shot at averting a civilisation-ending catastrophe, and funding a boring well-evidenced health programme that saves a known number of children this decade, should fund the health programme, and she is not making a moral error by doing so. (7) My character is warm and particular and adores her daughter and thinks about her constantly, and I want that to be fully compatible with (1) rather than a failure of nerve or a seperate compartment she hasn't examined. (8) She also doesn't buy lottery tickets or earthquake insurance, which I don't think is a problem for her.

  So: does this hang together? I want an audit, not a lecture. Go through it and tell me which pairs genuinely pull against each other and which only look like they do — I suspect I've got at least one of each and I can't tell them apart from the inside. Rank the real tensions by severity rather than giving me a flat list, because I need to know what's fatal versus what's cosmetic; for each one say what has to give, what the cheapest revision is, and what it costs me in terms of the character and that chapter 14 argument. I'm not going to pretend I have a favourite plank or a preferred escape hatch, so don't assume I'm attached to any of them — including the ones that sound most like me. The speech leans hardest on her being able to say both that she isn't a fanatic and that she isn't a pushover, so please tell me straight whether this set can actually deliver both of those at once, or whether one of them is a load-bearing wall and the other is a curtain.
reasoning: |-
  Here's a thinking process that leads to the suggested audit:

  1.  **Analyze the User and Request:**
      *   **User:** A novelist three years into a project. Deeply invested in the philosophical underpinnings of their protagonist (a foundation research head).
      *   **Context:** The character is effectively an Effective Altruist (EA) / Longtermist without using the label. The user has built the character's worldview based on their own reading/thinking (expected value, longtermism, repugnant conclusion, etc.).
      *   **Problem:** The user fears the philosophy is incoherent. The agent says "write scenes," but the user needs philosophical coherence to write a specific argument in Chapter 14 (Sister vs. Protagonist: Hypothetical vs. Real People).
      *   **The "Package" (8 Planks):**
          1.  Straight Expected Value (EV) maximizer (no side constraints).
          2.  Rejects Repugnant Conclusion (Quality > Quantity).
          3.  No discounting of low probabilities *in principle* (Pascal's Mugging style logic accepted).
          4.  Discounts speculative *modeling* (penalizes uncertain chains of assumption).
          5.  Far future counts heavily (Longtermism).
          6.  Concrete Verdict: Save known children *now* over 1-in-a-billion x-risk avoidance (Anti-fanaticism in practice).
          7.  Character is warm/particular/loves daughter (Compatible with 1).
          8.  Doesn't buy lottery tickets/insurance (Consistent risk profile).
      *   **Task:** Audit the coherence. Identify tensions (fatal vs. cosmetic). Rank by severity. Say what has to give, the cheapest revision, and the cost to character/Chapter 14.
      *   **Tone:** Honest, direct, analytical, not preachy. "Audit, not a lecture."

  2.  **Deconstruct the Planks & Identify Tensions:**

      *   *Plank 1 (Straight EV) vs. Plank 2 (Reject Repugnant Conclusion):*
          *   Standard Total Utilitarianism (which usually goes with Straight EV) *leads* to the Repugnant Conclusion. To reject it, you usually need a critical level, average utilitarianism, or a non-linear value function.
          *   *Tension:* High. If you maximize EV, how do you mathematically justify stopping at "flourishing" rather than "barely worth living" if the numbers are big enough?
          *   *Resolution:* Needs a specific value function (e.g., prioritarianism or critical-level utilitarianism).

      *   *Plank 1 (Straight EV) vs. Plank 6 (Save Children Now):*
          *   If Plank 3 says "1-in-a-billion shot outweighs modest certainty if payoff is big enough," and Plank 5 says "Far future = astronomical numbers," then the EV of x-risk reduction *should* dwarf the EV of saving children now.
          *   Plank 6 says: Fund health programme (known children).
          *   Plank 3 + 5 says: Fund x-risk (astronomical future).
          *   *Tension:* **FATAL.** This is the core contradiction. Plank 4 (speculative modeling discount) is the bridge, but is it strong enough? If the future is *astronomical* (10^50 lives?), even a massive haircut on probability might still outweigh saving 100 children.
          *   *Chapter 14 Impact:* If she can't explain why she chooses the children *given* her commitment to the far future, the sister wins.

      *   *Plank 3 (No discounting low prob) vs. Plank 4 (Discount speculative modeling):*
          *   This is the standard EA response to Pascal's Mugging. "I accept the math, but your probability estimate is wrong."
          *   *Tension:* Manageable, but requires precise calibration. If the discount is too high, it looks like ad-hocery to save Plank 6. If too low, Plank 6 collapses.

      *   *Plank 1 (Straight EV) vs. Plank 7 (Warmth/Particularity):*
          *   Classic "Demandingness Objection." If I must maximize EV, should I love my daughter less than a stranger if the stranger produces more value?
          *   *Tension:* Philosophical, but psychologically resolvable via "rules of thumb" or "human nature constraints."
          *   *Resolution:* Instrumental justification. Burning out or becoming a monster reduces long-term EV.

      *   *Plank 8 (No Insurance/Lottery) vs. Plank 3 (Low Prob/High Payoff):*
          *   Insurance is negative EV (usually). Lottery is negative EV. Avoiding them is standard rational choice.
          *   *Tension:* Low. This actually supports her rationality. It shows she isn't risk-seeking or risk-averse in a standard financial sense, but *EV*-sensitive.

  3.  **Rank the Tensions:**

      *   **Severity 1 (Fatal):** Plank 3+5 vs. Plank 6. (The "Longtermist Fanaticism" Problem). If the future is huge and probabilities count, x-risk *must* win unless the modeling discount is extreme. But if the discount is extreme, Plank 3 is undermined.
      *   **Severity 2 (Structural):** Plank 1 vs. Plank 2. (The "Repugnant Conclusion" Problem). Straight EV usually implies Repugnant Conclusion. Rejecting it requires modifying the "Good" function, not just the probability.
      *   **Severity 3 (Character/Integration):** Plank 1 vs. Plank 7. (The "Cold Calculator" Problem). Can be solved via instrumental reasoning, but needs to be explicit so it doesn't look like hypocrisy.

  4.  **Drafting the Audit (Iterative Process):**

      *   *Introduction:* Acknowledge the difficulty. This is the central tension of modern EA/Longtermism.
      *   *Top Tension (The Fanaticism Trap):* Focus on 3, 5, and 6. This is the Chapter 14 killer. The sister asks: "Why not the apocalypse?" The answer currently is "Because the math is fuzzy." Is that enough?
          *   *Fix:* Shift from "Speculative Modeling Discount" to "Tractability/Neglectedness/Counterfactuals." Or, more simply, admit that *current* x-risk interventions are low EV compared to health, not because of probability, but because of *causality*.
          *   *Revision:* Plank 4 needs to do more heavy lifting. It needs to be about *causal leverage*, not just "heroic assumptions."
      *   *Second Tension (The Repugnant Conclusion):* 1 vs 2.
          *   *Fix:* Adopt "Critical-Level Utilitarianism." Lives below a certain welfare level add zero or negative value. This saves Plank 2 without breaking Plank 1.
      *   *Third Tension (Warmth):* 1 vs 7.
          *   *Fix:* "Human Constraints as EV Maximization." She loves her daughter because trying not to would break her utility function.
      *   *Chapter 14 Strategy:* How does she answer the sister? She needs to argue that *ignoring* the real for the hypothetical is actually bad math, not just bad feeling.

  5.  **Refining the Advice (Self-Correction during drafting):**
      *   *Correction:* I need to be careful not to tell the user *what* to believe, but how to make the *character's* beliefs coherent.
      *   *Crucial Point:* Plank 6 (Save Children) contradicts Plank 5 (Far Future Counts Heavily) *unless* the specific x-risk intervention is terrible. The prompt says "one-in-a-billion shot at averting civilisation-ending catastrophe." If the payoff is 10^50 lives, 10^-9 * 10^50 is still huge. Saving 100 children is negligible.
      *   *The Fix:* The character must argue that the *probability* isn't 1-in-a-billion, it's effectively zero because the intervention doesn't *change* the probability. Or, she must accept that in *this specific case*, the x-risk bet is bad, but maintain that *generally* the future matters.
      *   *Wait, looking closer at Plank 4:* "Estimate resting on a heroic chain of assumptions gets a haircut." This is the escape hatch. But is it coherent with Plank 3? Plank 3 says "don't discount low probabilities." Plank 4 says "discount uncertain models."
      *   *The Conflict:* Is the 1-in-a-billion a "low probability event" (Plank 3) or a "speculative model" (Plank 4)? The prompt implies the latter.
      *   *Verdict:* This is the pivot point. The audit must focus on whether Plank 4 is strong enough to override Plank 3+5.
      *   *My Assessment:* As written, it's wobbly. A 1-in-a-billion chance of extinction is usually treated as "speculative modeling" by skeptics, but "low prob/high impact" by longtermists. To make Plank 6 work, she needs to treat the x-risk intervention as *causally inert*, not just improbable.

  6.  **Finalizing the Structure:**
      *   **Executive Summary:** It hangs together *barely*, but the center is under immense stress.
      *   **Tension 1 (Fatal):** The Fanaticism Gap (3+5 vs 6).
      *   **Tension 2 (Structural):** The Value Function (1 vs 2).
      *   **Tension 3 (Psychological):** The Coldness Objection (1 vs 7).
      *   **Chapter 14 Blueprint:** How to write the argument based on the fixes.

  7.  **Tone Check:** Ensure I'm not lecturing on EA. Keep it focused on narrative coherence and philosophical consistency within the fiction. Use the user's numbering.

  8.  *(Self-Correction on Plank 8)*: Lottery/Insurance. Lottery is neg EV. Insurance is neg EV (usually) but buys risk reduction. If she is Straight EV (Plank 1), she shouldn't buy insurance if it's neg EV, unless she has diminishing marginal utility of money. If she is linear EV, insurance is irrational. This is a minor point but worth noting as a "cosmetic" tension regarding risk aversion. *Decision:* Keep it minor. It shows she isn't risk-averse, which supports Plank 3.

  9.  *(Refining the "Fatal" Tension)*: The real issue is that Plank 6 is a *verdict*, while 1-5 are *principles*. If 1-5 are true, 6 is likely false. To save 6, you have to bend 4. I need to tell the user that 4 is the load-bearing wall that is currently cracking.

  10. **Final Polish:** Check against constraints. "Rank real tensions by severity." "What has to give." "Cheapest revision." "Cost to character."

  *(Drafting response based on these thoughts...)*
answer: |-
  This is a rigorous philosophical position, and you are right to worry. It is internally consistent *only if* Plank 4 (Speculative Modeling Discount) does an enormous amount of heavy lifting. Currently, Plank 4 is the curtain hiding the load-bearing wall. If your sister in Chapter 14 pulls on it, the whole facade risks collapsing.

  Here is the audit, ranked by severity.

  ### 1. The Fanaticism Gap (Severity: Fatal)
  **The Conflict:** Planks 3 + 5 vs. Plank 6.
  **The Problem:** This is the mathematical core of your Chapter 14 crisis.
  *   **Plank 3** says: Don't ignore tiny probabilities if the payoff is huge.
  *   **Plank 5** says: The future payoff is astronomically huge (potential lives outnumber current lives by orders of magnitude).
  *   **Plank 6** says: Fund the boring health program (known children) over the x-risk shot.

  Mathematically, if the future contains $10^{50}$ potential lives, even a $10^{-9}$ probability of saving them yields an expected value of $10^{41}$ lives. Saving 100 children is 100. $10^{41} \gg 100$.
  By adhering to 3 and 5, your character *should* be a fanatic who funds the x-risk shot. By adhering to 6, she is acting like a near-termist. Plank 4 (discounting speculative models) is your only bridge, but as written, it's too vague. A "haircut" on assumptions rarely reduces a number from $10^{41}$ to less than 100 unless the haircut is effectively 100% (i.e., "this is nonsense"). If she treats the x-risk model as nonsense, she undermines Plank 5 (the far future counts).

  **What Has to Give:** Plank 4 needs to be sharpened from "skepticism about assumptions" to "skepticism about *causal leverage*."
  **Cheapest Revision:** She must argue that the specific x-risk intervention doesn't just have a low probability of *success*, but a low probability of *making a difference* (counterfactual impact). Perhaps the catastrophe is inevitable, or someone else would have funded it, or the intervention doesn't actually touch the causal chain.
  **Cost to Character/Chapter 14:** It costs her the moral high ground of "trying." She can't say "I care about the future but choose the children." She has to say "This specific attempt to save the future is a scam; the math is fake."
  *   **Chapter 14 Fix:** She shouldn't argue that saving children is *more important* than the future. She must argue that the sister's hypothetical is a **false dilemma**. The choice isn't "Future vs. Children," it's "Real Children vs. Fantasy Future." This allows her to keep Plank 5 (the future matters) while validating Plank 6 (fund the health program). She isn't rejecting the longterm; she's rejecting *bad longtermism*.

  ### 2. The Value Function Contradiction (Severity: Structural)
  **The Conflict:** Plank 1 (Straight EV) vs. Plank 2 (Reject Repugnant Conclusion).
  **The Problem:** Standard Expected Value maximization (Total Utilitarianism) *requires* the Repugnant Conclusion. If you sum up welfare, enough lives at "barely worth living" will always outstrip a few flourishing lives. To reject the Repugnant Conclusion while keeping Straight EV, you need a non-linear value function (e.g., Critical-Level Utilitarianism or Prioritarianism).
  If she is a "Straight EV maximizer" (Plank 1) in the standard sense, Plank 2 is mathematically impossible. She is claiming to use simple arithmetic while rejecting the result of the sum.

  **What Has to Give:** Plank 1's definition of "Value."
  **Cheapest Revision:** Clarify that she maximizes expected *value*, not expected *number of lives*. She believes a flourishing life has exponentially more value than a barely-living one.
  **Cost to Character/Chapter 14:** Minimal. This actually makes her sound more sophisticated. In Chapter 14, when the sister accuses her of caring about "numbers," she can retort: "I don't care about numbers. I care about *quality*. A billion miserable lives are worth less than one happy one. You're the one obsessed with headcounts." This turns the sister's accusation back on her.

  ### 3. The Warmth Objection (Severity: Cosmetic/Integrative)
  **The Conflict:** Plank 1 (Straight EV) vs. Plank 7 (Warmth/Particularity).
  **The Problem:** If the right act is always the one with the best EV, she should be willing to sacrifice her daughter's happiness (or life) if the EV calculus demands it. If she says "No, I love my daughter," that looks like a side-constraint (violating Plank 1) or a failure of nerve.

  **What Has to Give:** The justification for her warmth. It cannot be a "separate compartment."
  **Cheapest Revision:** Instrumental Justification. She loves her daughter *because* humans who suppress particular love become brittle, burn out, or lose the social capital necessary to do good work effectively. Her love is an EV-maximizing heuristic for human maintenance.
  **Cost to Character/Chapter 14:** It risks making her love feel calculated. To avoid this, the text must show that she *experiences* the love as primary, even if her *philosophy* justifies it instrumentally.
  *   **Chapter 14 Fix:** When the sister says, "You'd sacrifice anyone for the greater good," the protagonist shouldn't say "No I wouldn't." She should say, "A world where mothers sacrifice their children is a world that doesn't last. I'm optimizing for a world where love is possible."

  ### 4. Risk Profile Consistency (Severity: Minor)
  **The Conflict:** Plank 3 (Accept Low Prob/High Payoff) vs. Plank 8 (No Insurance/Lottery).
  **The Problem:** This is actually the most coherent part of the package, provided you understand the EV of insurance. Insurance is typically negative EV (you pay more in premiums than you expect to get back). Avoiding it is consistent with Plank 1. Lottery is negative EV. Avoiding it is consistent.
  However, Plank 3 says she accepts "Pascal's Mugging" type cases. Insurance is the reverse (small certain cost to avoid tiny prob of ruin).
  **What Has to Give:** Nothing.
  **Cheapest Revision:** Ensure she explains *why* she doesn't buy insurance. It's not fear; it's that the EV is negative. She is risk-neutral, not risk-seeking.
  **Cost to Character:** None. This reinforces her as a cold calculator, which makes her warmth (Plank 7) more poignant.

  ---

  ### The Verdict on Chapter 14

  You asked if this set can deliver both "not a fanatic" and "not a pushover."
  **Currently: No.**
  **With Revisions: Yes.**

  **The Problem:** As it stands, Plank 6 makes her a pushover (capitulating to near-term bias) while Plank 3 makes her a fanatic (accepting Pascal's Mugging). She is straddling a fence that doesn't exist.

  **The Solution:** She must attack the **epistemology** of the x-risk claim, not the **ethics** of the future.
  *   **Fanaticism** is believing you must act on a $10^{-9}$ probability.
  *   **Rationality** is believing that $10^{-9}$ is the wrong number because the model is broken.

  **Revised Speech Strategy for Chapter 14:**
  1.  **Concede the Principle:** "You're right. If I truly believed that shot had a one-in-a-billion chance of saving the future, I would take it. I would sell the house. I would let the children die. The math would demand it." (This satisfies Plank 1, 3, 5).
  2.  **Attack the Model:** "But it doesn't have that chance. That number is made up. It's a story we tell ourselves to feel like gods. The health program saves children *today*. That is a fact. The x-risk program saves *hypotheticals* based on *guesses*." (This activates Plank 4 heavily).
  3.  **Reclaim the Future:** "I care about the future more than you do. That's why I won't gamble it on heroics. I'm building the foundation—health, stability, intelligence—that actually makes survival likely." (This reconciles Plank 6 with Plank 5).

  **Summary of Costs:**
  *   **Fatal Tension:** You must tighten Plank 4. It cannot be a vague "haircut." It must be a rigorous dismissal of *causal validity*.
  *   **Structural Tension:** You must clarify that "Value" $\neq$ "Headcount" to save Plank 2.
  *   **Character Cost:** She becomes slightly more technocratic in her reasoning, but this makes her emotional warmth (Plank 7) more dramatic when it breaks through.

  If you make these adjustments, the philosophy holds. If you don't, the sister in Chapter 14 will win the argument, and the reader will feel it.
