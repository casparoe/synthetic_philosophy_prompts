  *Response:* This is a verificationist leanings. But metaphysics often cares about what *makes* it true, not just the truth value. The *truthmaker* is different. In CT, it's a similar person. In TWI, it's *you*. That's a metaphysical difference, even if modal claims overlap 95%. I need to highlight the *truthmaker* distinction.

