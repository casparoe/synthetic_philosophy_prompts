      *   (5) **Large-scale Cooperation:** Not reciprocity (dyadic iteration). It's norms, cultural group selection, reputation.
      *   (6) **Third-party Punishment:** Solves second-order free-rider problem because it's not a public good for the victim.
      *   (7) **Climate Case:** Iterated PD. Failing because shadow of the future is too weak (high discount rate).

  3.  **Identify Tensions/Contradictions:**

      *   *Tension A: (2) vs. (4).*
