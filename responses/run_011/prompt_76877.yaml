      *   *Variation 4: The Cosmological Boundary.* It's about the Past Hypothesis. Entropy increases because the universe started low.
      *   *Variation 5: The Coarse-Graining Dependence.* Entropy increase depends on how we describe the system (Gibbs vs. Boltzmann). If it's observer-relative, can it ground objective time?

  4.  **Developing the Specific Theses (Drafting the List):**

      *   *Thesis 1: The Local Statistical Regularity.* (Weak claim). In isolated macroscopic systems, entropy tends to increase. Time is presupposed.
      *   *Thesis 2: The Global Cosmological Arrow.* (Stronger claim). The universe as a whole has an entropy gradient. This gradient aligns with what we call "future."
      *   *Thesis 3: The Constitutive/Reductive Account.* (Strongest claim). Temporal asymmetry *consists in* entropic asymmetry.
