          *   Evaluate the user's own list of obvious objections (competence, mandate, capture).

  2.  **Deconstruct the Audience's Lens:**
      *   *Lawyers:* Will care about Article I/State Constitution conflicts, standing, justiciability, the "vested rights" of voters, the definition of "election," liability, and what happens when the chamber goes rogue (e.g., subpoenas a popular governor). They think in terms of *remedies* and *constraints*.
      *   *Pol Scientists:* Will care about party coordination, agenda setting, gridlock, the "chaos theorem," how bills move without leadership, and whether "random committees" actually function or just stall. They think in terms of *equilibrium* and *incentives*.
      *   *Former Legislators:* Will care about constituent recourse ("Who do I call?"), the loss of institutional memory, the reality of lobbying (they will just target the secretariat), and the fairness of "unaccountability." They think in terms of *survival* and *connection*.

  3.  **Evaluate the User's Thesis & Design:**
      *   *Strength:* Novel argument (unaccountability as feature).
      *   *Weakness:* "Unaccountability" is a hard sell to lawyers (who love accountability mechanisms) and politicians (who love voter feedback). The "declination" mechanism creates a self-selection bias that undermines the "random" claim. The "secretariat" is a huge bottleneck for power.
      *   *Constraint:* User explicitly rejects epistemic claims ("they are wiser"). This removes the standard defense against competence objections.

  4.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (The Killer):* Constitutional Viability. Lawyers will seize on "election" clauses. Most state constitutions require legislators to be *elected*. A lot is not an election.
