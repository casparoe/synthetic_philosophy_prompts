          *   2 Former Legislators (one lost narrowly; practical, focused on re-election pressure, constituent service, political reality).
      *   **Topic:** Redesigning the state upper chamber using sortition (citizen assembly style) but with a specific twist.
      *   **User's Thesis:** *Not* epistemic (not about wisdom/calmness). *Is* about breaking the re-election incentive structure. Unaccountability is a feature.
      *   **User's Design:** 6-year non-renewable term, stratified lot (400 names, decline allowed), no parties/leadership, random committees, limited powers (no appropriations init, veto on redistricting, subpoena, amendatory power, ethics rules), professional secretariat (restricted).
      *   **Task:** Prepare for Q&A.
          *   Identify objections *this specific room* will raise (not general public/theorists).
