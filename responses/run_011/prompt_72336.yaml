      2.  *Secretariat Influence:* Denying they have power is foolish. Acknowledging the risk but mitigating it is better.

  6.  **Drafting the Content (incorporating specific voices):**

      *   *Lawyer Voice:* "Remedy," "Standing," "Justiciable," "Vested," "Constitutional text."
      *   *Pol Sci Voice:* "Median voter," "Coordination costs," "Selection effect," "Roll-call," "Principal-agent."
      *   *Legislator Voice:* "Town hall," "Call time," "Next election," "Folks back home."

  7.  **Refining the Replies & Blunt Notes:**
      *   Must be 2 minutes spoken (approx. 250-300 words).
      *   Blunt note must be harsh/self-critical.

  8.  **Addressing the "Clustered Objections" & "Empirical Claims":**
      *   Cluster: "Accountability" (Legislator) + "Mandate" (Lawyer) + "Recourse" (Public). All about the link between voter and rep.
