      *   *Kierkegaard Texts:* Primarily *Two Ages: A Literary Review* (where "Leveling" and "Public" are defined) and *The Present Age*.
      *   *Self-Correction during drafting:* Make sure not to get too bogged down in theology. Keep it focused on the political/social analogy the friend is making. Ensure the distinction between "Civic Individual" and "Religious Individual" is sharp.

