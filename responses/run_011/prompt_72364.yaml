      *   *The Press:* The tool that creates the public. It allows anyone to judge everything without knowledge or responsibility.
      *   *Leveling:* The process of erasing distinctions. It's negative (destroys excellence) but also necessary (clears the ground for true religious individuality). It cannot be stopped by authority; it must be lived through.
      *   *The Single Individual:* Not a citizen with a name. It's an ethical/religious category. Standing before God. Internal, not external.
