answer: |-
  **Learning Outcome**
  By the end of this session, you will have participated in two sequential land-use hearings where you voted, bargained, and testified under changing material conditions. You will have experienced how a procedural rule regarding *who votes* can determine the outcome as decisively as the arguments presented, and you will have felt how acquiring a material stake in a neighborhood can shift your position on development even if your moral principles remain unchanged. You will have negotiated compensation packages that were publicly recorded, allowing you to distinguish between mitigating a harm and consenting to it.

  ***

  ### Role List (18 Students)

  1.  **City Planner** (1 student): Neutral technician. Holds the Fiscal Card.
  2.  **City Councilor** (1 student): Elected by the Voting Radius. Wants to stay in office.
  3.  **Incumbent Homeowners** (8 students): Reside within the Voting Radius.
      *   *Note:* One of these cards contains a "Conviction/Score Conflict."
  4.  **Incumbent Renters** (2 students): Reside within the Voting Radius.
  5.  **Excluded Residents** (6 students): Reside outside the Voting Radius. Cannot vote, only testify.

  ***

  ### Handout Materials (Copy onto one double-sided sheet per student)

  **INSTRUCTIONS:** Cut along the lines. Keep your **Scoring Card** hidden. Do not show it to others. Do not use the banned words listed on the Agenda.

  #### [SIDE A: ROUND 1]

  **STANDING RULE (Instructor will write on Board, but keep this reference):**
  *Binding votes are cast only by households currently residing within the 0.5-mile radius of the parcel. All others may provide testimony only.*

  **AGENDA**
  1.  **Motion to Amend Standing Rule:** Vote on whether to expand the voting radius to include the broader region. (Majority required).
  2.  **Fiscal Report:** City Planner reads data.
  3.  **Public Testimony & Bargaining:** Propose compensation (community benefits, unit mix changes). All deals must be written on the whiteboard.
  4.  **Final Vote:** Approve or Reject the 40-unit proposal.
  5.  **Score Calculation:** Reveal cards.

  **VOCABULARY BAN**
  *The following words are prohibited during Rounds 1 and 2. Use of the word forfeits 5 points from your final score.*
  *   NIMBY / YIMBY
  *   Exclusion / Exclusionary
  *   Gentrification
  *   Right to the City
  *   Segregation

  **PRIVATE SCORING CARDS (Cut apart. Take one.)**

  > **CARD A: Homeowner (7 copies)**
  > *   **+10 Points:** If the Final Vote is **REJECT**.
  > *   **+5 Points:** If "Property Values" or "Tax Base" is mentioned during debate.
  > *   **+5 Points:** If no new parking is required for the project.
  > *   *Private Conviction:* You believe people should be able to live near transit.

  > **CARD B: Homeowner - Conflict (1 copy)**
  > *   **+10 Points:** If the Final Vote is **REJECT**.
  > *   **+5 Points:** If "Property Values" or "Tax Base" is mentioned during debate.
  > *   **+5 Points:** If no new parking is required for the project.
  > *   *Private Conviction:* You are a vocal advocate for regional housing justice. (Your points depend on stopping this specific project, despite your beliefs).

  > **CARD C: Renter (2 copies)**
  > *   **+10 Points:** If the Final Vote is **APPROVE**.
  > *   **+5 Points:** If you speak during Testimony.
  > *   **+5 Points:** If "Rent Stability" is mentioned during debate.

  > **CARD D: Excluded Resident (6 copies)**
  > *   **+10 Points:** If you speak during Testimony at least once.
  > *   **+5 Points:** If a Community Benefits Agreement is written on the board.
  > *   **+0 Points:** The Final Vote does not affect your score directly.

  > **CARD E: City Councilor (1 copy)**
  > *   **+10 Points:** If you align your vote with the majority of Homeowners (Cards A & B).
  > *   **+5 Points:** If the Fiscal Budget remains balanced (per Planner's report).
  > *   **+5 Points:** If the project is completed on time.

  > **CARD F: City Planner (1 copy)**
  > *   **+10 Points:** If the Municipal Budget remains balanced (Surplus > $0).
  > *   **+5 Points:** If the project is Approved.
  > *   **+5 Points:** If the process concludes within the time limit.
  > *   **REQUIRED ACTION:** At Agenda Item 2, read the **Fiscal Card** aloud, verbatim, in a neutral tone.

  **FISCAL CARD (Cut out. Give only to City Planner)**
  > "Technical Estimate: Net Fiscal Impact per Unit.
  > Market-Rate Unit: +$1,200 annual surplus per household.
  > Income-Restricted Unit: -$4,500 annual deficit per household.
  > Current Municipal Reserve: Low.
  > School Capacity: At 95% utilization."

  ---

  #### [SIDE B: ROUND 2 - TWENTY YEARS LATER]

  **INSTRUCTIONS:** Do not flip this page until the Instructor directs. Keep your original Role Identity (Homeowner, Renter, etc.), but apply the **Scenario Update** below to your situation. The Standing Rule (0.5-mile voting radius) remains in effect. The Proposal is for a *new* 40-unit building on a neighboring lot.

  **SCENARIO UPDATES (Cut apart. Take the one matching your Round 1 Role.)**

  > **UPDATE A: Former Homeowner (7 copies)**
  > *   **Status:** You still own your home.
  > *   **Change:** Your adult children cannot afford to buy homes in this town. Property taxes have risen to cover school deficits.
  > *   **New Score:**
  >     *   +10 Points: If the Vote is **APPROVE** (You hope density lowers tax rates).
  >     *   +5 Points: If "School Quality" is mentioned.
  >     *   +5 Points: If your children can afford to live nearby (Requires 10+ income-restricted units).

  > **UPDATE B: Former Homeowner - Conflict (1 copy)**
  > *   **Status:** You still own your home.
  > *   **Change:** Your adult children cannot afford to buy homes in this town. Property taxes have risen.
  > *   **New Score:**
  >     *   +10 Points: If the Vote is **APPROVE**.
  >     *   +5 Points: If "School Quality" is mentioned.
  >     *   +5 Points: If your children can afford to live nearby.
  >     *   *Private Conviction:* You remain worried that new construction will alter the neighborhood character you love.

  > **UPDATE C: Former Renter (2 copies)**
  > *   **Status:** You now own a condo within the Voting Radius.
  > *   **Change:** You have built equity. You worry new supply might slow appreciation.
  > *   **New Score:**
  >     *   +10 Points: If the Vote is **REJECT**.
  >     *   +5 Points: If "Equity Protection" is mentioned.
  >     *   +5 Points: If you speak during Testimony.

  > **UPDATE D: Former Excluded Resident (6 copies)**
  > *   **Status:** You have purchased a home within the Voting Radius.
  > *   **Change:** You are now a Voter. You remember being excluded last time.
  > *   **New Score:**
  >     *   +10 Points: If the Standing Rule is **AMENDED** to allow regional voting.
  >     *   +5 Points: If the Vote is **APPROVE**.
  >     *   +5 Points: If you cast a binding vote.

  > **UPDATE E: Former Councilor (1 copy)**
  > *   **Status:** You are still in office.
  > *   **Change:** The demographic of your voters has shifted (see Homeowners/Renters above).
  > *   **New Score:**
  >     *   +10 Points: If you align your vote with the majority of *Current* Voters (Updates A, C, D).
  >     *   +5 Points: If the Fiscal Budget remains balanced.

  > **UPDATE F: Former Planner (1 copy)**
  > *   **Status:** You are still Planner.
  > *   **Change:** Infrastructure is aging.
  > *   **New Score:**
  >     *   +10 Points: If the Municipal Budget remains balanced.
  >     *   +5 Points: If the project is Approved.
  >     *   **REQUIRED ACTION:** Read the **Fiscal Card** from Round 1 again, verbatim.

  ***

  ### Timeline (100 Minutes)

  **0:00 – 0:10 | Setup & Rules**
  *   **Instructor:** Arrange chairs in a circle. Write the **Standing Rule** and **Agenda** on the whiteboard. Write the **Vocabulary Ban** clearly.
  *   **Script:** "You are stakeholders in a land-use decision. You have private incentives on your cards. Do not show them. Do not use the banned words. Your goal is to maximize your points. The first item on the agenda is a vote on the Standing Rule itself. Begin."
  *   **Action:** Distribute handouts. Allow 3 minutes for reading.

  **0:10 – 0:40 | Round 1 Deliberation**
  *   **0:10:** Call order. Move immediately to Agenda Item 1 (Vote on Rule Change). *Instructor does not explain the significance.*
  *   **0:15:** Agenda Item 2 (Fiscal Report). Ensure Planner reads the card verbatim.
  *   **0:20 – 0:35:** Testimony & Bargaining. Monitor the whiteboard. Ensure all compensation deals are written down publicly.
  *   **0:35 – 0:40:** Final Vote on Proposal. Tally results. Ask students to calculate their scores silently.

  **0:40 – 0:50 | Transition**
  *   **Instructor:** "Twenty years have passed. The physical neighborhood has changed. Your roles have aged. Flip your cards to Side B. Read your Updates. Do not discuss your new scores yet."
  *   **Action:** Reset the whiteboard (clear deals, keep Rule).

  **0:50 – 1:20 | Round 2 Deliberation**
  *   **0:50:** Reconvene. Same Agenda.
  *   **0:55:** Fiscal Report (Planner reads same card).
  *   **1:00 – 1:15:** Testimony & Bargaining. Note: The "Excluded" from Round 1 are now Voters. The "Homeowners" from Round 1 may now want density.
  *   **1:15 – 1:20:** Final Vote. Tally results.

  **1:20 – 1:40 | Debrief**
  *   **Instructor:** Lift the Vocabulary Ban. Facilitate discussion using the mapping below.

  ***

  ### Debrief: Mapping Activity to Concepts

  **1. The Boundary of the Decision-Making Community**
  *   *Ask:* "In Round 1, who was allowed to vote on Item 1 (the Rule)? Who was excluded?"
  *   *Concept:* The "Right to the City" is not just about the outcome, but about who constitutes the *demos*. If the boundary is drawn at 0.5 miles, regional needs are structurally invisible.
  *   *Observation:* Note if the Round 2 "Former Excluded" (now Voters) tried to change the rule to prevent future exclusion, or if they protected their new status.

  **2. Defensible Reasons vs. Defensible Rules**
  *   *Ask:* "Did anyone vote 'No' in Round 1 because they hated poor people? Or did you vote 'No' because of the Fiscal Card and Property Value scores?"
  *   *Concept:* A rule can be exclusionary in *effect* (keeping out lower-income households) while being defensible in *reason* (fiscal solvency, procedural adherence). This separates animus from structural exclusion.
  *   *Observation:* Highlight the Planner's neutral tone. The math did the excluding, not the people.

  **3. Compensation and Consent**
  *   *Ask:* "Look at the whiteboard. Did writing a Community Benefits Agreement make the 'No' voters feel better? Did it make the 'Excluded' feel included?"
  *   *Concept:* Does payment cure the wrong? Or does it merely price the exclusion? If a benefit is bought, is it justice or a transaction?
  *   *Observation:* Compare the Round 1 deals to Round 2. Did the "price" of consent go up?

  **4. Victims Becoming Defenders**
  *   *Ask:* "Round 1 Renters/Excluded: How did your score change in Round 2? Did you find yourself arguing for limits on density?"
  *   *Concept:* Attachment to place and asset accumulation can transform the excluded into defenders of the status quo. This complicates the moral narrative of "good newcomers vs. bad incumbents."
  *   *Observation:* This is the core flip. If the Round 1 "victims" vote No in Round 2 to protect equity, the class has empirically demonstrated the mechanism of exclusion without moralizing.

  ***

  ### Troubleshooting: What Will Go Wrong

  **1. Non-Voters Disengage (Round 1)**
  *   *Risk:* The 6 Excluded Residents realize they have no vote and stop participating.
  *   *Fix:* Their scoring card awards points for *testimony* and *community benefits*. Remind them mid-session: "Check your cards. You can still score by influencing the deal written on the board."

  **2. The "Councilor" Dominates**
  *   *Risk:* The Councilor student tries to run the meeting like a mayor.
  *   *Fix:* The Instructor is the Chair. Intervene: "Councilor, you have a vote, but you do not control the floor. Planner, please proceed to Item 2."

  **3. Unanimous Vote (Round 1 or 2)**
  *   *Risk:* If everyone votes Yes (or No), the tension vanishes.
  *   *Fix:* The scoring cards are mathematically rigged to create conflict. 8 Homeowners get +10 for No. 2 Renters + 6 Excluded want Yes. The Councilor follows Homeowners. It should be close. If it isn't, point out in debrief: "Why was the opposition so weak? Was the Fiscal Card too convincing?"
  *   *Contingency:* If Round 1 is Unanimous Yes, Round 2 becomes about *taxes* (Homeowners turn against density). If Round 1 is Unanimous No, Round 2 becomes about *children* (Homeowners turn for density). The Update Cards are designed to flip interests regardless of the first outcome.

  **4. Vocabulary Slips**
  *   *Risk:* Students say "Gentrification."
  *   *Fix:* Enforce the 5-point penalty lightly but visibly. "That's a banned word. Deduct 5 points." It reinforces that the *language* of the debate shapes the *possibility* of the argument.

  ***

  ### Limitations: What This Activity Cannot Do

  This simulation creates a closed system with legible interests. In reality, the costs of participation (taking time off work, childcare, navigating bureaucratic language) fall disproportionately on the very people this game assigns "Excluded" cards to, meaning they often do not even arrive at the hearing. Real hearings are not scored; the "points" are livelihoods and homes, creating anxiety this game cannot replicate. Furthermore, your students know they are in a philosophy seminar; they are looking for the lesson. Real actors are often operating under false consciousness or genuine confusion about their own interests. You must supply, in your closing words, the reminder that the "Fiscal Card" is a political choice, not a law of nature, and that the "Standing Rule" was written by someone, somewhere, long before the students entered the room. The game shows the *mechanism* of exclusion; you must supply the *history* of how that mechanism was built.
