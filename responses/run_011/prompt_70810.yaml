      *   *Actually, looking closer:* "Materials that fit on index cards." + "No printing budget beyond one double-sided sheet per student." I will design the content so the instructor prints one sheet per student, which contains the text to be cut into cards.
      *   *Fiscal Card:* Only the Planner needs this. I can put it on the handout but instruct only the Planner to use it.
