      *   **Goal:** Unsettle certainty without instructor lecturing. Make them *feel* three specific things (exclusionary rules defended in good faith, victims becoming defenders, boundary of community determines rights).
      *   **Proposal:** 40 units on surface parking, near transit, 25% income-restricted, no parking.
      *   **Required Features:**
          1.  Standing rule (radius-based voting) + immediate vote on changing it.
          2.  Private scoring cards (hidden incentives, some require cooperation, one rewards inaction).
          3.  Fiscal card (Planner reads verbatim, neutral tone, budget impact).
          4.  Compensation as public/recorded act (written on board).
          5.  Second round (20 years later, roles aged/changed, potential vote flip based on interests).
          6.  Vocabulary ban (No NIMBY/YIMBY/etc. until debrief).
      *   **Deliverables:**
          1.  Learning outcome paragraph (action-oriented).
          2.  Role list (18 students, specific conflicts).
          3.  Handout text (Index card format).
          4.  Timeline (100 mins).
          5.  Debrief (Mapping activity to concepts).
          6.  Troubleshooting (What goes wrong).
          7.  Limitations (What the activity can't do).
      *   **Tone Constraint:** Neutral. Do not argue for loosening density. Must allow defensible "No" and indefensible "Yes" (or vice versa).

