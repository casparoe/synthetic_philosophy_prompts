  13. **Final Polish:** Check the tone. Ensure I'm not advocating for YIMBYism. The "No" vote must be defensible via the Fiscal Card and Property Rights scoring.

  *(Self-Correction on Handout Limit)*: The prompt says "no printing budget beyond one double-sided sheet per student." I need to make sure *all* text (Roles, Scores, Updates) fits on that one sheet. The Fiscal Card is for *one* student, so it can be on a separate slip cut from a generic sheet, or included on the main sheet but marked "Planner Only." I will put it on the main sheet to stay strictly within budget, marked "CUT OUT - PLANNER ONLY."

  Let's assemble the text.

  *   *Learning Outcome:* Focus on the *experience* of the boundary shift.
  *   *Roles:* 1 Planner, 1 Council, 8 Homeowners (Voters), 2 Renters (Voters), 6 Excluded (Non-Voters). Total 18.
