      *   **Handouts:**
          *   *Standing Rule:* Clear, procedural.
          *   *Agenda:* Must include the vote on the rule first.
          *   *Fiscal Card:* Needs specific numbers. Negative fiscal impact for affordable units is the standard argument for exclusion. Let's make it subtle but clear.
          *   *Scoring Cards:* Crucial.
              *   *Homeowner:* Points for property value stability (No build) + Points for neighborhood character (Subjective).
              *   *Renter:* Points for housing access (Yes build) + Points for stability (fear of displacement).
              *   *Planner:* Points for budget balance + Points for project completion.
