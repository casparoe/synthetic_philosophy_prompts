      *   **Debrief:** Connect the feelings to the philosophy. Boundary problem, good faith exclusion, compensation, right to the city.
      *   **Troubleshooting:** Dominant voices, disengagement (non-voters), unanimous votes (boring).
      *   **Limitations:** Gamification vs. Reality.

  3.  **Refining the Mechanics (Self-Correction during drafting):**

      *   *Constraint Check:* "One double-sided sheet per student." I need to fit the Standing Rule, Agenda, Fiscal Card (maybe read by planner only?), and Scoring Cards on that sheet.
