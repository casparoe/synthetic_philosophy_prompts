          *   *Renters:* Near the lot (unstable).
          *   *Outsiders:* Potential residents (excluded from voting).
          *   *Officials:* City Planner (fiscal constraint), Council Member (elected by voters).
          *   *Specific Conflicts:* Need a role where conviction $\neq$ score. Need a role with divided interests.
          *   *Distribution:* Let's aim for 10 Voters (Inside Radius), 6 Non-Voters (Outside Radius), 2 Officials.
