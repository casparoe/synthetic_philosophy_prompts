      *   *Round 2:*
          *   Excluded Renters -> Become Homeowners (now Voters).
          *   Homeowners -> Aging, worried about taxes/children.
          *   Project -> Now it's a renovation/expansion of the existing 40 units? Or a *new* proposal on a *new* lot? Prompt says "Put an identical proposal, or the closest analogue." Let's make it a *new* lot nearby. Same rules.
          *   Wait, the prompt says "The parking lot is a building." So Round 1 builds the 40 units. Round 2 is 20 years later. What is the proposal in Round 2? "An identical proposal... to a vote again." This implies a *new* development proposal in Round 2. Let's say a *second* phase or a neighboring lot.
          *   Actually, to make the "victim becomes defender" point land: The people who were excluded in Round 1 (or barely won) are now incumbents in Round 2.
          *   Let's refine Round 2: The 40 units from Round 1 are built (regardless of vote? No, vote determines Round 1 outcome). If Round 1 vote is No, Round 2 is hard.
          *   *Correction:* To ensure the pedagogical point works regardless of Round 1 vote, Round 2 scenario assumes the Round 1 project *happened* (for the sake of the simulation's timeline) OR the proposal is new.
          *   *Better interpretation:* "Put an identical proposal... to a vote again." This implies a *new* parcel.
          *   *Key Shift:* The "Excluded" from Round 1 are now "Incumbents" in Round 2 (they bought in nearby). The "Incumbents" from Round 1 are now "Aging/Financially Stressed."
      *   *Vocabulary Ban:* List the words explicitly.

  5.  **Addressing the "Defensible No / Indefensible Yes" Constraint:**
      *   The scoring must allow a "No" vote that maximizes points for the majority (fiscal stability + property values) without using banned words.
      *   The scoring must allow a "Yes" vote that maximizes points (housing access + budget surplus from density) without using banned words.
      *   The "Trap" is the Fiscal Card. It makes "No" look like math, not hate.

  6.  **Writing the Handouts:**
      *   Must be concise for index cards.
      *   Side A: Role & Score (Round 1).
      *   Side B: Update (Round 2).
      *   Planner gets extra slip for Fiscal Data.

  7.  **Timeline Management:**
      *   100 mins is very tight for two rounds + debrief.
      *   Intro: 5 mins.
      *   R1 Setup: 5 mins.
      *   R1 Delib/Vote: 30 mins.
      *   Transition: 10 mins.
      *   R2 Delib/Vote: 30 mins.
      *   Debrief: 20 mins.
      *   Total: 100.
      *   *Risk:* Debrief gets cut. I need to emphasize strict timekeeping in the instructions.

  8.  **Troubleshooting & Limitations:**
      *   *Risk:* Non-voters disengage. *Fix:* Give them points for testimony impact.
      *   *Risk:* Unanimous vote. *Fix:* The scoring cards are distributed to ensure conflict (some *must* vote No to win, some *must* vote Yes).
      *   *Risk:* Instructor bias. *Fix:* Script the intro strictly.

  9.  **Final Review against Constraints:**
      *   18 students? Yes.
      *   100 mins? Yes.
      *   Whiteboard/Chairs? Yes.
      *   1 sheet handout? Yes (designed to be cut).
      *   Features 1-6 included? Yes.
      *   Tone neutral? Yes.
      *   Order of deliverables followed? Yes.

  10. **Refining the "Fiscal Card":**
      *   Needs to be plausible. Affordable units often generate less property tax per square foot than market rate, and households with children cost more in schools.
      *   Text: "Projected Net Fiscal Impact per Unit: Market Rate: +$1,200/yr. Income-Restricted: -$4,500/yr."

  11. **Refining the "Rule Vote":**
      *   Agenda Item 1: Motion to expand voting radius to include regional stakeholders.
      *   If this passes, the game changes. If it fails, the exclusion is locked in procedurally. This is the "boundary" lesson.

  12. **Refining Round 2:**
      *   To ensure the "victim becomes defender" point: The Round 1 "Excluded Renters" (who wanted the build) are now Round 2 "Homeowners" (who might oppose new density to protect equity).
