          2.  City Councilor (1) - Elected by voters in radius.
          3.  Homeowners in Radius (8) - Voters.
          4.  Renters in Radius (2) - Voters (usually renters can vote in local elections, but let's make it household-based to simplify, or just say "Households"). Let's make it "Household Heads" to ensure 18 roles.
