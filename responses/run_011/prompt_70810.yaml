          *   *Round 2 Cards:* Updates to the situation.
      *   **Timeline:** 100 minutes is tight.
          *   Setup/Intro: 10 min.
          *   Round 1 Deliberation/Vote: 35 min.
          *   Transition/Round 2 Setup: 10 min.
          *   Round 2 Deliberation/Vote: 35 min.
