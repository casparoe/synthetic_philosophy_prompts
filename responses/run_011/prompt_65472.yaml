          6.  **Refused:** Death Squad (killing lawyer, unreasonable belief). *Key:* Belief unreasonable, purpose was destruction of opposition (not conflict objective).
          7.  **Granted (Divided):** Security Officer (concealment of death not his fault). *Key:* Authorized, standing practice, cover-up of non-political death treated as political act? Or act of conflict to hide state embarrassment?
          8.  **Refused:** Officer (smuggling for profit). *Key:* Personal enrichment objective.

      *   *Candidate Principles:*
          1.  **Functional-Contribution:** Did the act knowingly enable a violation in furtherance of a party's objective?
              *   *Test:* Cases 1, 3, 5, 7 (Granted) fit. Cases 4, 8 (Refused) fit (private/profit). Case 2 (Refused) fits (routine arrest isn't political objective). Case 6 (Refused) fits (belief unreasonable/destruction of opposition).
