              *   *Verdict:* Struggles with Case 5 (collateral damage) and Case 7 (cover-up). Requires "operative aim" to include "foreseen consequence" or "institutional aim."
          3.  **Reasonable-Belief:** Was the applicant's appreciation of facts defensible?
              *   *Test:* Case 6 (Refused - unreasonable belief lawyer was leadership) fits perfectly. Case 5 (Granted - intel understood at time) fits.
              *   *Problem:* Case 4 (Refused). Disclosure truthful, but unsanctioned/feud. Belief might have been reasonable that he was an informer, but the *motive* was feud. Case 8 (Refused). Belief he was doing counter-insurgency? No, knew it was smuggling.
              *   *Verdict:* Strong on Case 6, weak on Case 4 (motive trumps belief).
          4.  **Legitimate-Target:** Status of victim/character of objective matters, not mind.
