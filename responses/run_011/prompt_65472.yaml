      *   *Clean Separation:* The "Knowledge of Institutional Character" test.
      *   *Recommendation:* The asymmetry is a cost of the *Functional* principle. If the function is part of the war machine, it's amnestied. The Analyst is part of the machine (read reports). The Operative (if truly ignorant) might not be. But if the Movement's practice was known, they are the same.
      *   *Final thought:* The prompt asks to specify the further application that would most cleanly separate the competing principles.
      *   *Idea:* A State Analyst who *never* read reports and had no handwriting evidence, vs. one who did. This isolates the "Mens Rea/Knowledge" factor from the "Functional Role" factor.

