      *   *Reasoning:* The *Functional-Contribution* principle best explains Case 7 (Divided Grant). The institution used him; he knew the institutional methods. The fact the victim was actually armed (unknown to him) is irrelevant under Functional/Institutional principles (Case 3 cleaner, Case 5 civilians). The core is whether *his act* was part of the conflict machinery. It was.
