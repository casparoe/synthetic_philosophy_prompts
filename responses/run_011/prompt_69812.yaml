prompt: |-
  I'm on the board of a county historical society and Thursday we vote on an exhibit that's split us straight down the middle. I need something to circulate the night before, because right now I'm just absorbing other people's arguments in the parking lot.

  Background on what we actually hold. For roughly 1880 to 1930 our collections are almost all institutional paperwork: poorhouse admission registers, the county jail blotter, a batch of state hospital commitment files that got transferred to us in the seventies, truancy records, charity-relief case notes. We have essentially no diaries or letters from working people in that period. What we have is what clerks wrote about them, in forms the clerks designed.

  Our curator has proposed a one-gallery exhibit built around a single woman in the commitment files, admitted in 1901. She picked her because the file is unusually thick: three pages of a statement the woman dictated to a clerk, letters her sister wrote to the superintendent begging to have her released, and the complaint from the farm family she worked for that seems to have started the whole thing. The curator's pitch is that this is our one real chance to let an ordinary person from that era speak in her own words on a public wall, and that if we pass on it the gallery stays about landowners and railroad men forever, because those are the only people who left us papers on purpose. She also says its a weird case rather than a typical one, and she thinks that's an advantage, which I don't fully follow.

  Two objections came up and I can't tell how much weight they carry.

  First, a retired school principal on the board says the whole thing is a trap. The woman is visible to us only because the state was processing her. Her "own words" were taken down by a clerk working from prompts we can't see. The sister's letters were written to persuade an official who held her sibling's fate. So the exhibit will be the institution's voice with a woman's name attached, and dressing that up as history from below is worse than admitting we don't have her. This trustee would rather we made the records themselves the subject — the poorhouse, the hospital, who got written down and why — and left the individuals mostly anonymous.

  Second, a great-granddaughter found the file last spring and objects to her ancestor's name and the diagnosis in it going up where school groups will read them. A different branch of the same family wrote to us supporting the exhibit and saying she'd be proud. Our written policy only says institutional records over seventy-five years old are open to researchers, which was drafted for genealogists and says nothing at all about panel text.

  Underneath both, the chair is being pushed by a donor crowd who'd prefer a founding-families gallery, and one trustee keeps insisting this is politics rather than scholarship. What the chair actually wants from Thursday is a decision plus a rule we can apply to the next ten proposals, because a local history group is already pitching us a jail-blotter exhibit and I guarantee this exact fight repeats.

  Draft the memo. I want a clear bottom line — do it, don't, or do it with named changes — and the conditions specific enough that the curator could build to them: name or no name on the labels, what we do with the dictated statement and how we'd have to present it, whether the institutional frame gets space in the same gallery or a separate one, what we owe the objecting descendant versus the supportive one, and what the reusable rule should say about cases where the only surviving record of a person is a record made about them by someone with power over them. Then give me the strongest honest version of the principal's objection and say whether you think it's fatal or survivable — I genuinely can't tell yet if she's making a good methodological point or just a gloomy one. And please don't hand me a bibliography or a list of books to read, nobody on this board is going to look anything up and I don't want to be the one assigning homework.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**

      *   **Role:** Board member of a county historical society.
      *   **Task:** Draft a memo to circulate to the board the night before a crucial vote on a controversial exhibit.
      *   **Context:** The board is split 50/50. The vote is Thursday.
      *   **Exhibit Proposal:** Focuses on a single woman admitted to a state hospital in 1901 (institutional records).
      *   **Collections Reality:** 1880-1930 holdings are almost entirely institutional (poorhouse, jail, hospital, truancy). No diaries/letters from working people.
      *   **Curator's Pitch:** Rare chance to hear an "ordinary person" speak. The case is weird/atypical (an advantage).
      *   **Objection 1 (Retired Principal):** Methodological/Ethical. The "voice" is mediated by power (clerks, officials). It's institutional voice, not the woman's. Better to make the *system* the subject, keep individuals anonymous.
      *   **Objection 2 (Descendant):** Privacy/Stigma. One branch objects to name/diagnosis on display. Another branch supports it. Policy is silent on public display (only research access).
      *   **Underlying Tensions:** Donors want "founding families" (elite history). One trustee calls it "politics." Chair wants a decision + a reusable rule for future proposals (e.g., jail blotter exhibit).
      *   **Requirements:**
          *   Clear bottom line (Do it/Don't/Do with changes).
          *   Specific conditions (Name? Labeling? Institutional frame? Descendant handling?).
          *   Reusable rule/policy recommendation.
          *   Analysis of the Principal's objection (Fatal or survivable?).
          *   Tone: Professional, decisive, practical, no academic homework/bibliography.

  2.  **Determine the Bottom Line:**

      *   *Option A (Don't do it):* Safe, avoids controversy, pleases donors wanting founding families. But reinforces the "history of the powerful" problem the curator identified. Leaves the gallery empty or repetitive.
      *   *Option B (Do it as is):* Risks ethical backlash, ignores descendant concerns, validates the Principal's fear of "fake voice."
      *   *Option C (Do it with changes):* Best compromise. Acknowledges the value of the story but mitigates the ethical risks. Addresses the Principal's methodological concern by foregrounding the mediation. Addresses the descendant concern by anonymizing or contextualizing heavily. Sets a precedent for the jail blotter.
      *   *Decision:* **Do it, but with significant structural and labeling changes.** This satisfies the Curator's need for content, the Principal's need for methodological honesty, and the Chair's need for a policy precedent.

  3.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the split, state the purpose (decision + policy), and state the recommendation clearly upfront.
      *   **The Recommendation (The "What"):**
          *   *Name:* Anonymize the subject on public labels (First Name only or "A Patient"). This respects the objecting descendant and acknowledges the power imbalance.
          *   *The "Voice":* Must be labeled as "Dictated to Clerk" or "Recorded by." Don't present it as a diary entry. Acknowledge the filter.
          *   *The Frame:* The institutional power *must* be part of the exhibit, not just the backdrop. The Principal is right that the system is the story too.
          *   *Descendants:* Notify all known branches. If one objects strongly, anonymize. Supportive quotes can be used in guest book/programming, not permanent text.
      *   **The Policy (The "Rule"):** Needs to cover future cases (jail blotters, etc.). Key concept: "Records of Power." If the record exists because someone had power over the subject, public display requires higher ethical bar than research access.
      *   **Analysis of Principal's Objection:** This needs to be honest. Is it fatal? No, but it's a constraint. It's not "gloomy," it's accurate. The voice *is* mediated. But mediated voices are still historical evidence if treated honestly.
      *   **Closing:** Call to action for Thursday.

  4.  **Refining the Tone:**

      *   Needs to sound like a board member talking to board members. Not academic jargon. Practical, governance-focused.
      *   Avoid "we should read Foucault." Instead, "we need to admit who held the pen."
      *   Address the "Politics vs. Scholarship" claim implicitly by showing how this *is* scholarship (handling sources critically).
      *   Address the Donor pressure indirectly by emphasizing the Society's mission to tell the *county's* history, not just the founders'.

  5.  **Addressing Specific Constraints:**

      *   *Name on labels:* Recommend pseudonym or First Name + Initial.
      *   *Dictated statement:* Label as "Transcribed by Clerk."
      *   *Institutional frame:* Must be integrated, not separate.
      *   *Descendants:* Privilege privacy over publicity when conflict exists.
      *   *Reusable Rule:* "Institutional Voice Protocol."
      *   *Principal's Objection:* Analyze deeply. It's survivable *if* the exhibit admits the mediation.

  6.  **Self-Correction/Review during drafting:**

      *   *Critique:* Is anonymizing too much of a concession to the Curator?
      *   *Fix:* No, the Curator wants the *story* and the *words*, not necessarily the name. The Principal wants methodological honesty. Anonymity + Context satisfies both.
      *   *Critique:* Is the policy too vague?
      *   *Fix:* Make it specific about "Records of Control."
      *   *Critique:* Did I answer the "Politics" charge?
      *   *Fix:* Frame the decision as stewardship and risk management, which is board business.
      *   *Critique:* The prompt asks for the "strongest honest version of the principal's objection."
      *   *Fix:* Ensure that section is robust. It's not just "it's mean," it's "it's epistemologically dishonest."

  7.  **Final Polish:** Check against the "no bibliography" rule. Ensure the bottom line is bold and clear. (Self-correction: Make sure the distinction between research access and public display is clear in the policy section).

  8.  **Final Output Generation** (Proceeding to generate the memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Board of Trustees, County Historical Society
  **FROM:** [Your Name]
  **DATE:** [Date]
  **SUBJECT:** Recommendation and Policy Framework: 1901 Commitment Exhibit

  **Bottom Line Recommendation**
  **Approve the exhibit, but only with specific structural and labeling modifications.** We cannot run the exhibit as currently pitched, but cancelling it reinforces a collection bias we have a duty to address.

  We should proceed on the condition that we treat the records as evidence of *institutional power* first, and individual biography second. This satisfies the Curator's goal (displaying working-class history), the Principal's objection (methodological honesty), and the Chair's requirement (a reusable rule for future proposals).

  Below are the specific conditions for approval, the proposed policy for future cases, and an analysis of the methodological objection.

  ***

  ### 1. Conditions for Approval
  If the board votes to proceed, the Curator must adhere to the following four constraints during design:

  **A. Naming Convention (Anonymity on Labels)**
  *   **Decision:** Do not use the woman's full legal name on public wall text.
  *   **Implementation:** Refer to her as "Mrs. E." or "A Patient, 1901."
  *   **Rationale:** This respects the objecting descendant without erasing the story. It also visually signals to visitors that this identity comes from a record, not a self-chosen biography. Full names may remain in the research file for genealogists, consistent with our 75-year rule, but public display requires a higher bar.

  **B. Presentation of the "Voice"**
  *   **Decision:** The dictated statement cannot be presented as a diary entry or letter.
  *   **Implementation:** Labels must explicitly state: *"Transcribed by a hospital clerk"* or *"Recorded during admission interview."* Visual design should distinguish her words from the clerk's annotations (e.g., different typefaces or distinct text boxes).
  *   **Rationale:** This addresses the concern that we are presenting institutional data as personal expression. We are displaying the *interaction* between the woman and the institution, not just her "thoughts."

  **C. The Institutional Frame**
  *   **Decision:** The context of the hospital, the commitment laws, and the clerk's role must occupy at least 40% of the gallery space.
  *   **Implementation:** This is not a separate gallery; it is interwoven. Every panel featuring her words must be paired with a panel explaining the legal or medical authority that captured those words.
  *   **Rationale:** The Principal is correct that the institution is the author of the file. The exhibit must tell the story of *why* this file exists, not just *what* is in it.

  **D. Descendant Conflict**
  *   **Decision:** When known descendants disagree, privacy defaults to the most restrictive objection regarding sensitive data (diagnoses, commitment reasons).
  *   **Implementation:** We will not display the specific medical diagnosis on the wall. We will acknowledge the supportive family branch in the program notes or guest book, not the permanent exhibit.
  *   **Rationale:** Public display is permanent and uncontrolled; research access is private. We cannot risk permanent stigma against the wishes of half the living family, even if the other half consents.

  ***

  ### 2. Proposed Reusable Policy: "Records of Control"
  The Chair requested a rule to handle the upcoming jail-blotter proposal and future similar cases. I propose we adopt the following standard:

  **Policy Statement:**
  *Institutional records created by an authority figure over a subject (e.g., poorhouses, jails, hospitals, courts) are open for research 75 years after creation. However, public exhibition of these records requires an additional ethical review.*

  **Review Criteria:**
  1.  **Mediation:** Can the Society clearly explain to the public who held the pen and why the record was created? If the power dynamic cannot be clearly explained, the record should not be featured as a personal narrative.
  2.  **Stigma:** Does the record contain information (medical, criminal, indigence) that would carry social stigma if attached to a living person? If yes, public identifiers (full names) should be redacted unless explicit consent is obtained from all known direct descendants.
  3.  **Representativeness:** Is the individual being presented as "typical"? If the case is atypical (as the Curator argues this one is), the text must explicitly state that this is an exception, not a rule.

  ***

  ### 3. Analysis of the Principal's Objection
  *Is the objection that "this is the institution's voice, not hers" fatal to the project?*

  **Verdict:** It is a valid methodological point, but it is **survivable** if we change the labeling.

  **The Strongest Version of the Objection:**
  The Principal is arguing that we are committing an epistemological error. A clerk writing down a woman's statement in 1901 is not a tape recorder. The clerk chose what to write, what to summarize, and what spelling or grammar to use. The sister's letters were performative; she was telling the Superintendent what she thought he wanted to hear to get a release. To put these on a wall and say "Here is a working woman speaking" is historically dishonest. It tricks the public into thinking we have access to her interior life when we actually have access to her *file*. If we do this, we aren't correcting the bias of history; we are dressing up institutional bias in civilian clothing.

  **Why It Is Survivable:**
  The objection becomes fatal only if we claim the exhibit is "Her Story." It becomes valid scholarship if we claim the exhibit is "Her File."
  We have almost no records of working people from 1900. We cannot wait for diaries that were never written. The only way to tell their history is through the traces they left in the systems that governed them. This is standard social history practice. We can display the record *as* a record of power. If we label the mediation clearly (as recommended in Section 1B), we turn the Principal's objection into the central theme of the exhibit. The tension between the woman's words and the clerk's pen *is* the history.

  ***

  ### 4. Addressing the "Politics vs. Scholarship" Concern
  One trustee has characterized this as politics. It is not. It is source criticism.
  *   **Politics** would be choosing this woman to make a modern point about mental health.
  *   **Scholarship** is acknowledging that our collection is skewed toward the powerful and deciding how to ethically use the scant records we have of the powerless.

  The donors preferring a "founding families" gallery are welcome to fund that specific project. However, this Society's mission is County History, not Founder History. If we only exhibit people who owned the paper they wrote on, we are failing the mission. We can honor the donors without falsifying the historical record.

  ### Summary for Thursday's Vote
  I move we approve the exhibit **contingent on the anonymization of the subject and the explicit labeling of the clerical mediation.**

  This allows us to:
  1.  Fill the gallery with content we actually own.
  2.  Avoid ethical harm to the family.
  3.  Establish a policy that protects us when the Jail Blotter proposal arrives.
  4.  Remain methodologically honest about whose voice we are hearing.

  I am available to discuss this Wednesday evening if any trustees have questions before the vote.
