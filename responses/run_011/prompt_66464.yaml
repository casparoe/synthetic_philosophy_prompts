answer: |-
  **Internal Note: Ethical Foundations of the Priority-Setting Rule**

  **To:** Priority-Setting Committee Members
  **From:** Methods Function
  **Subject:** Conceptual Clarification of the Aggregation Rule

  This note addresses recent queries regarding the ethical implications of the rule adopted last month, specifically its relationship to utilitarianism and prioritarianism. The rule stipulates that if every patient is indifferent between two allocations based on their own expected quality-adjusted life-years (QALYs), the Committee must also be indifferent. Colleagues have debated whether this commits us strictly to maximising the unweighted sum of QALYs or allows for weighting the worse off more heavily. The following sections diagnose the logical constraints at play.

  **The Prioritarian's Objection**

  Your second colleague, the prioritarian, argues that we can prioritise the worse off by maximising the sum of square roots of utilities rather than the sum of utilities themselves. She contends this satisfies our Rule because if every patient is indifferent (meaning their expected utilities are equal across options), the sum of their transformed utilities must also be equal. Her reasoning contains a subtle equivocation regarding when the transformation occurs. There are two distinct ways to apply such a weighting, and each fails a different prerequisite of our framework.

  The first approach, *ex-post prioritarianism*, applies the weighting to outcomes before calculating expectations. Here, the Committee maximises the expected sum of transformed utilities. Consider two patients and two lotteries. In Lottery 1, Patient A receives 100 QALYs and Patient B receives 0, each with 50% probability. In Lottery 2, both receive 50 QALYs with certainty. For each patient, the expected QALYs are 50 in both lotteries. Under our Rule, since every patient is indifferent, the Committee must be indifferent. However, an ex-post prioritarian Committee prefers Lottery 2. The sum of square roots in Lottery 2 is $\sqrt{50} + \sqrt{50} \approx 14.1$. In Lottery 1, the expected sum is $0.5(\sqrt{100} + \sqrt{0}) + 0.5(\sqrt{0} + \sqrt{100}) = 10$. Because the Committee prefers Lottery 2 while the patients are indifferent, this approach violates the Rule you adopted.

  The second approach, *ex-ante prioritarianism*, applies the weighting to the expected utilities directly. Here, the Committee maximises the sum of square roots of expected QALYs. In the example above, both patients have an expected utility of 50 in both lotteries. The social value is $\sqrt{50} + \sqrt{50}$ for both. This satisfies the Rule. However, our framework assumes the Committee itself acts as a rational agent satisfying the von Neumann–Morgenstern (VNM) axioms over risks. A key axiom is linearity in probabilities: the value of a 50/50 mix of two options should equal the average of their values. Ex-ante prioritarianism violates this. If Option X yields 100 expected QALYs and Option Y yields 0, a VNM rational agent values a 50/50 mix at 50. A prioritarian values the mix at $\sqrt{50} \approx 7.07$, but the average of the values is $0.5(\sqrt{100}) + 0.5(\sqrt{0}) = 5$. Since $7.07 \neq 5$, the Committee would exhibit irrational risk preferences over social prospects. Thus, your colleague's proposal is untenable: it either breaches the Committee's Rule or breaches the Committee's own rationality constraints.

  **The Mechanics of Aggregation**

  Your first colleague is substantially correct that the Rule, combined with the assumption that the Committee satisfies VNM axioms, yields a linear aggregation of individual utilities. This is the substance of Harsanyi's Aggregation Theorem. The mathematical engine driving this result is the linearity requirement imposed by the VNM axioms on the social welfare function. Because individual preferences are linear in probabilities (by definition of expected utility) and the social preference must also be linear in probabilities, the only function that can map the former to the latter while respecting Pareto Indifference is a linear combination. Essentially, linearity begets linearity.

  However, a technical distinction regarding the Pareto condition is vital for our ethical positioning. The Rule you adopted is a condition of *Pareto Indifference*: if everyone is indifferent, society is indifferent. The standard theorem uses this to prove that social welfare is a weighted sum of individual utilities ($W = \sum a_i U_i$). Crucially, Pareto Indifference alone does not prevent the weights ($a_i$) from being negative. Mathematically, a negative weight satisfies the indifference condition just as well as a positive one. To guarantee that weights are non-negative—ensuring that if everyone prefers an option, society does too—we require the *Strong Pareto* condition. Our current draft supplies only the indifference half. While ethically we would never assign negative weights to patients, logically our current rule does not forbid it. To fully secure the utilitarian form your colleague describes, we should explicitly endorse the Strong Pareto principle alongside the existing Rule.

  **Scales, Observers, and Impossibility**

  A common objection is that adding utilities is meaningless because VNM utility functions are unique only up to positive affine transformation. One can shift the zero point or change the unit scale arbitrarily. Summing uncalibrated scales is indeed arithmetically void. Harsanyi's resolution invokes an 'impartial observer' device: we fix the scales by assuming that being Person A in a specific health state is comparable to being Person B in that same state. This 'extended sympathy' allows us to anchor the zero points and units across individuals.

  Does this derive interpersonal comparisons or merely assume them? It is the latter. The mathematics cannot conjure comparability from thin air. The impartial observer device is a substantive ethical assumption that human experiences of health and risk are commensurable. Without this ethical premise, the aggregation remains formally valid but substantively empty.

  This informational richness explains why this result does not collide with Arrow's Impossibility Theorem. Arrow proved that no social welfare function can satisfy a set of reasonable conditions if the input information is limited to ordinal rankings (e.g., Patient A prefers X to Y) without interpersonal comparability. Harsanyi's theorem operates on a richer informational basis: cardinal, unit-comparable utilities derived from risk attitudes. The divergence is not a technicality but a philosophical fault line. Arrow denies we can measure intensity of preference across persons; Harsanyi assumes we can, via the currency of risk. Our Committee operates on the Harsanyi side of this line by using QALYs, which presume cardinal measurability.

  **Utility versus Wellbeing**

  Finally, we must address the charge that Harsanyi's theorem establishes a linear representation of preference, but not utilitarianism in a moral sense. This criticism, associated with Sen and Weymark, argues that VNM utility measures rational choice under risk, not necessarily wellbeing. A patient might be risk-averse regarding health outcomes, meaning their VNM utility function is concave. If we sum these VNM utilities, we are summing risk-adjusted values, not raw wellbeing.

  I find this charge partly right. The theorem proves that if we respect individual risk attitudes and Pareto efficiency, we must sum their VNM utilities. It does not prove that VNM utility is the correct metric of moral value. To close the gap between the theorem's conclusion and substantive utilitarianism, we must add a premise that individuals ought to be risk-neutral regarding their own wellbeing. In health economics, we often treat QALYs as the measure of wellbeing, implicitly assuming risk neutrality over life-years. If we accept that QALYs measure wellbeing directly, then the theorem supports utilitarianism. If we view QALYs as merely capturing preference satisfaction under risk, the theorem only mandates preference satisfaction aggregation. Given our mandate to maximise health benefit, we should explicitly adopt the premise that expected QALYs are the appropriate proxy for patient wellbeing, thereby accepting the risk-neutrality implication.

  **Bottom Line**

  The Committee's Rule, combined with rational decision-making under risk, logically compels us to maximise a weighted sum of expected QALYs, precluding prioritarian weighting unless we abandon rationality or the Rule itself. To ensure these weights are positive and represent wellbeing rather than mere preference, we must explicitly adopt the Strong Pareto principle and affirm that QALYs measure moral value risk-neutrally.
