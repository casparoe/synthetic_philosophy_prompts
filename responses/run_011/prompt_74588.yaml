answer: |-
  ### The Boatyard Sorting Instrument

  This is a diagnostic tree designed to separate the reasons a person keeps working on a lost cause. It is built from eight branch nodes. Each node is a concrete question. A character does not need to know the philosophy behind the question to answer it; they only need to know their own gut reaction.

  The questions are arranged to peel away layers of justification, starting with the object itself and moving inward to the character's ledger of value.

  #### The Branch Nodes

  **Node 1: The Magic Swap**
  If a stranger offered you the finished boat tomorrow, free of charge, but wiped the last four years from your memory so you never did the work, would you take it?
  *   **Yes:** You want the boat.
  *   **No:** You want the building.

  **Node 2: The Mate's Advice**
  If your best mate was in this exact spot, with the same boat and the same costs, would you tell them to carry on?
  *   **Yes:** You believe the project is sound.
  *   **No:** You believe the project is lost.

  **Node 3: The Signal**
  Does the fact that you have already stuck it out for four years prove the boat is worth saving, or just that you are the sort of person who sticks things out?
  *   **Evidence:** The effort proves the value.
  *   **Trait:** The effort proves your character.

  **Node 4: The Retroactive Hit**
  If you walk away today, do the last four years become a waste, or do they stay as something else?
  *   **Waste:** Quitting destroys the past.
  *   **Payment:** Quitting crystallises the past.

  **Node 5: The Witness**
  If nobody ever knew you quit—if you could sell the boat in secret or vanish—would you still feel ashamed?
  *   **Yes:** The shame is internal.
  *   **No:** The shame is social.

  **Node 6: The Rule**
  Do you trust yourself to make a fresh calculation today, or do you need a hard rule to stop you digging?
  *   **Trust:** I can judge this case on its merits.
  *   **Rule:** I need a principle to hold me back.

  **Node 7: The Ledger**
  Is the time spent a cost to be recovered, or a price already paid for a lesson?
  *   **Debt:** I am owed a return on this time.
  *   **Purchase:** I bought an experience with this time.

  **Node 8: The Pain**
  Is the struggle itself part of what you're buying, or is it just the price of admission?
  *   **Feature:** The suffering is the point.
  *   **Bug:** The suffering is a cost to be minimised.

  ***

  #### The Leaves (The Mindsets)

  Below are the possible outcomes. Each leaf describes a coherent way of thinking. Not every combination of answers leads to a leaf; some paths are empty because no one actually thinks that way.

  **1. The Clear-Eyed Agent (Standard Rational)**
  *   **Profile:** Wants the boat, admits the project is lost, sees past effort as irrelevant.
  *   **Path:** Swap (Yes) / Mate (No) / Signal (Trait) / Retro (Payment) / Witness (No) / Rule (Trust) / Ledger (Debt - *but unrecoverable*) / Pain (Bug).
  *   **Note:** This person quits. They see the sunk cost as water under the bridge.

  **2. The Fallacy (Pure Bias)**
  *   **Profile:** Wants the boat, admits the project is lost, but cannot bear the waste.
  *   **Path:** Swap (Yes) / Mate (No) / Signal (Trait) / Retro (Waste) / Witness (Yes) / Rule (Trust) / Ledger (Debt) / Pain (Bug).
  *   **Note:** This is the textbook error. They know they should quit (Mate=No) but feel the past dictates the future (Retro=Waste).

  **3. The Signaller (Inductive)**
  *   **Profile:** Believes the effort itself validates the project.
  *   **Path:** Swap (No) / Mate (Yes) / Signal (Evidence) / Retro (Payment) / Witness (No) / Rule (Trust) / Ledger (Debt) / Pain (Bug).
  *   **Note:** They think, "I wouldn't have started this if it wasn't possible, and I wouldn't have stayed four years if I didn't know something." They treat persistence as data.

  **4. The Pre-Commitment (The Disciplined Economist)**
  *   **Profile:** Wants the boat, knows they should quit, but fears their own weakness.
  *   **Path:** Swap (Yes) / Mate (No) / Signal (Trait) / Retro (Payment) / Witness (No) / Rule (Rule) / Ledger (Debt) / Pain (Bug).
  *   **Note:** Distinct from the Clear-Eyed Agent. The Agent quits because the math says so. This person quits because they have a standing order never to throw good money after bad, knowing they cannot trust their own case-by-case judgement.

  **5. The Retro-Activist (Meaning-Maker)**
  *   **Profile:** Believes quitting rewrites history.
  *   **Path:** Swap (No) / Mate (No) / Signal (Trait) / Retro (Waste) / Witness (Yes) / Rule (Trust) / Ledger (Purchase) / Pain (Feature).
  *   **Note:** For this character, the value of the four years is not fixed. If they finish, the four years were 'dedication'. If they quit, the four years were 'delusion'. They carry on to protect the truth of the past.

  **6. The Honour-Bound (Social Debt)**
  *   **Profile:** Motivated by obligation to others, not the boat.
  *   **Path:** Swap (Yes) / Mate (No) / Signal (Trait) / Retro (Payment) / Witness (No - *if alone*) / Rule (Trust) / Ledger (Debt) / Pain (Bug).
  *   **Correction:** The Witness node splits here. If they feel shame only when watched, they are Honour-Bound.
  *   **Refined Path:** Swap (Yes) / Mate (No) / Signal (Trait) / Retro (Payment) / Witness (No - *if alone, Yes if watched*) / Ledger (Debt to others).
  *   **Note:** This is your character restoring the boat for a dead father. The boat is secondary; the relationship is the asset.

  **7. The Deflationist (The Bookkeeper)**
  *   **Profile:** Denies the category of 'sunk cost' exists.
  *   **Path:** Swap (Yes) / Mate (No) / Signal (Trait) / Retro (Payment) / Witness (No) / Rule (Trust) / Ledger (Purchase) / Pain (Irrelevant).
  *   **Note:** This is your health economist. He isn't muddled. He argues that 'cost' is an accounting choice. If he books the four years as 'living expenses' or 'education', there is no loss to recover. He carries on not to recover the cost, but because he refuses to book the loss.

  **8. The Ascetic (The Penitent)**
  *   **Profile:** The suffering is the goal.
  *   **Path:** Swap (No) / Mate (No) / Signal (Trait) / Retro (Payment) / Witness (Yes) / Rule (Rule) / Ledger (Purchase) / Pain (Feature).
  *   **Note:** This person does not want the boat. They want the penance. A finished boat would ruin the project.

  ***

  #### Empty Cells and Indistinguishable Leaves

  **Empty Cell: The Optimistic Hermit**
  *   **Combination:** Mate (Yes - tell friend to carry on) / Witness (No - no shame if alone).
  *   **Why Empty:** Incoherent. If you truly believe the project is sound enough to recommend to a friend, you generally believe the outcome has value. If the outcome has value, you would take the Magic Swap (Node 1 = Yes). If you take the Swap but also want the Work (Node 1 = No), you are contradicting yourself on the value of the object versus the process. There is no stable position where you recommend the project to others but derive no social or personal value from the completion yourself.

  **Empty Cell: The Masochistic Rationalist**
  *   **Combination:** Rule (Trust) / Pain (Feature) / Swap (Yes).
  *   **Why Empty:** Unattractive. If you want the boat (Swap=Yes) and trust your calculation (Rule=Trust), you would not select a path with high suffering (Pain=Feature) unless the suffering was instrumental. If the suffering is the feature, you wouldn't want the boat (Swap=No).

  **Indistinguishable Leaves: The Pre-Commitment vs. The Clear-Eyed Agent**
  *   **Issue:** In practice, both characters quit.
  *   **Distinction:** They are only separable by Node 6 (The Rule). The Clear-Eyed Agent calculates the net present value of the boat today. The Pre-Commitment calculates the risk of their own future weakness. In a novel, this looks the same unless you show the internal monologue. The Agent thinks, "It's not worth it." The Pre-Commitment thinks, "I am not allowed to want it."

  **Indistinguishable Leaves: The Deflationist vs. The Retro-Activist**
  *   **Issue:** Both claim the past is not a loss.
  *   **Distinction:** Separable by Node 7 (The Ledger). The Retro-Activist believes the *facts* of the past change meaning based on the future (ontological). The Deflationist believes the *label* we put on the past is arbitrary (accounting). The Retro-Activist carries on to make the past true. The Deflationist carries on because he refuses to sign the ledger that says he lost.

  ***

  #### Application Notes for the Yard

  *   **The Daughter (Dead Father):** She is likely **The Honour-Bound** mixed with **The Retro-Activist**. If she quits, the four years weren't 'time with dad', they were 'wasted time'. Node 4 is her lock.
  *   **The Health Economist:** He is **The Deflationist**. He will argue Node 7 until you are tired. He isn't ignoring the cost; he is reclassifying it. He is rational, but his axioms are different.
  *   **The Young Bloke:** He is **The Fallacy** or **The Signaller**. He thinks Node 3 (Signal) is true: "I've come this far, so I must be close." He is using effort as a map for terrain he hasn't surveyed.

  Use the nodes to test them. If you ask the Economist Node 7, he should light up. If you ask the Daughter Node 5, she should flinch. If you ask the Bloke Node 2, he should hesitate.
