  These principles prioritize the *globalization* of impact over the *origin* of impact. They exclude early agriculture and industrialization because they were asynchronous and regional, validating your rejection of Cases 3 and 4. They exclude accidental signals unless tied to systemic intent, handling Case 9. This framework resolves the tension between stratigraphy and history by defining the Anthropocene not as the first human mark on Earth, but as the first mark that Earth could not erase without human help. It shifts the definition from "when did we start changing things" to "when did the changes become a permanent planetary layer." This aligns with your preference for the chicken and the plutonium spike while rejecting the smeared soot of the 1700s. It acknowledges that a geological epoch requires a physical layer, not just a historical trend, forcing the date into the mid-20th century Great Acceleration where biology, chemistry, and geology align globally.

