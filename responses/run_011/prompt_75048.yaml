answer: |-
  **The Decimal Place and the Moral Universe**

  In October 2006, the UK Treasury published the Stern Review on the Economics of Climate Change. Its headline recommendation was stark: spend one percent of global GDP annually to avoid future losses exceeding five percent. This conclusion rested on a specific arithmetic engine, specifically a social discount rate of roughly 1.4 percent. When William Nordhaus and others critiqued this figure in 2007 and 2008, arguing for a rate nearer four or five percent, the dispute appeared technical. Yet, as the exchange revealed, the fight over a decimal place was actually a fight over whether moral claims can be scientific. To understand this, we must view the episode through the theory of interpersonal utility comparisons. This lens allows us to dissect not just the numbers, but the philosophical machinery hidden inside them.

  **The Mapping: Arithmetic as Ethics**

  To see where the moral work is done, we must decompose the discount rate used by Nicholas Stern. The rate is derived from the Ramsey formula, which combines three components. The first is the pure rate of time preference, set by Stern at 0.1 percent. The prompt distinguishes this as an intrapersonal and intertemporal comparison: it weighs the welfare of the same continuing society at different dates. Technically, this does not require comparing distinct persons. It asks only how much a society values its own future relative to its present. However, because climate change spans centuries, the "society" in 2100 comprises different biological individuals than the society of 2000. Treating them as the same continuing subject is itself a philosophical choice, but within the strict accounting of welfare economics, this component operates on time, not persons.

  The second component involves the elasticity of marginal utility of consumption (set at one) combined with assumed per capita consumption growth (1.3 percent). This is where interpersonal comparison becomes unavoidable. This term adjusts the value of consumption based on wealth. It assumes that a dollar of consumption provides less additional welfare to a rich person than to a poor person. Since the future generation is assumed to be richer than the present one, this parameter reduces the weight of future damages. This is a comparison of *units* of utility. It does not ask if the future person is happier than the present person (a comparison of levels); it asks how much welfare a unit of resources generates for each. This is genuinely interpersonal work because it trades off the marginal welfare of distinct individuals across time.

  The third component is equity weighting across regions, which the Review employed to reflect that damages fall hardest on the poorest countries. This is interpersonal comparison in the most direct sense. It explicitly weighs the welfare of a person in a developing nation more heavily than that of a person in a developed nation. This requires both comparability of units and a judgment about levels of welfare. Nordhaus's critique focused heavily on the first component, the pure time preference, characterizing it as ethical rather than economic. But the mapping shows that Stern's entire structure relies on interpersonal comparisons of units and levels. Nordhaus's alternative calibration, which relied on observed market returns, implicitly accepted the interpersonal weights embedded in current market behavior. Thus, both sides engaged in interpersonal comparison; they merely disagreed on whether those comparisons should be chosen ethically or read descriptively from existing prices.

  **The Machinery of Welfare**

  Running the standard machinery of welfare economics over this dispute clarifies who is behaving consistently with established theory. In the 1930s, Lionel Robbins insisted that interpersonal comparisons are value judgments, not positive claims. Science can describe preferences, but it cannot say whether one person's satisfaction outweighs another's. By this strict definition, Stern violated the Robbins ban openly. He admitted that the near-zero pure rate of time preference was an ethical choice, arguing that on moral grounds, the future should not be discounted simply for being later.

  Nordhaus, conversely, attempted to remain within the Robbinsian boundary. He argued that Stern's rate was inconsistent with observed market returns and savings behavior. By calibrating his model to market data, Nordhaus implied he was making a positive, scientific claim. However, this defense is theoretically fragile. Reading revealed market behavior as a moral verdict is itself a substantive assumption. It assumes that the current distribution of wealth and the current price of capital embody a considered moral view rather than historical accident or market failure. In this light, Nordhaus was not avoiding ethics; he was smuggling them in under the guise of description.

  This brings us to the Bergson-Samuelson social welfare function, a device designed to admit value judgments openly rather than hiding them. Stern's approach aligns more closely with this framework. He specified a function that weighted utilities across generations and regions explicitly. Nordhaus's approach resembles an attempt to bypass the welfare function entirely by using market prices as a proxy for social value. Arrow's impossibility result suggests that without interpersonal comparability, aggregating individual preferences into a social choice is logically impossible. Stern accepted comparability to make aggregation possible; Nordhaus tried to avoid it but relied on market aggregation anyway.

  John Harsanyi's aggregation theorem shows that if you grant cardinal, interpersonally comparable utility, you can derive a utilitarian social welfare function. Stern effectively operated within this theorem. Amartya Sen, however, campaigned against the informational poverty of such utilitarian economics. Sen argued that focusing solely on utility ignores other relevant information, such as rights or capabilities. In the Stern-Nordhaus exchange, Sen's critique highlights a limitation in both sides. Both assumed climate damages could be fungible into utility losses. Neither adequately addressed whether some damages—such as species extinction or cultural loss—might be incomparable to consumption goods. Nordhaus behaves consistently with the Robbins ban only superficially; by treating market rates as moral data, he makes a value judgment he refuses to acknowledge. Stern behaves consistently with the Bergson-Samuelson device but exposes himself to the Robbins objection that he has left science for ethics.

  **Where the Theory Goes Silent**

  Honesty requires stating where the theory of interpersonal comparison goes silent. There are gaps in the framework that the participants exploited without noticing. First, consider Martin Weitzman's argument that a fat-tailed distribution of climate damages plus a higher elasticity could reproduce Stern's conclusions without the near-zero discount rate. This move relies on risk attitude and probability theory, not comparability. Interpersonal utility theory tells us how to weigh Person A against Person B, but it does not tell us how to weigh a small probability of catastrophe against a certainty of cost. This gap is limiting but not fatal; it simply means the discount rate is not the only lever of policy.

  Second, there is the problem of identity over time. The standard theory assumes persons are distinct entities. But if the people of 2200 are not the same continuing subject as us—if their very existence depends on our actions—the logic of trade-offs changes. This is a problem in the Sidgwickian and Parfitian vein regarding non-identity. Interpersonal comparison theory has nothing useful to say about whether the persons of the future have standing if their identity is contingent on our choices. The participants in the dispute treated future generations as distinct recipients of utility, bypassing the metaphysical question of whether they can be harmed by being brought into existence with a lower quality of life.

  Third, there is the standing of non-human welfare or the possibility that climate damages are not fungible into utility at all. If a rising sea level destroys a sacred site, the loss may not be capturable in a consumption equivalent. The theory of interpersonal comparison assumes a common currency of welfare. If that currency is invalid, the entire arithmetic collapses.

  Which of these gaps is fatal? The identity problem is fatal to the utilitarian framing but was ignored by all parties. The risk problem (Weitzman) is practically significant and was partially acknowledged. The non-fungibility problem is theoretically fatal to cost-benefit analysis but was treated as a modeling constraint. The participants exploited the silence on identity to treat future people as standard economic agents, allowing them to fight over discount rates rather than existential obligations. They left the framework of welfare economics without noticing, relying on metaphysical assumptions the theory does not support.

  **The Verdict in Reverse**

  Does this episode vindicate Sen, Robbins, or neither? On the surface, it vindicates Sen's contention that no practical welfare economics can proceed without interpersonal comparisons. Stern showed that to make a policy recommendation on climate change, one must compare the welfare of the rich present against the poor future. You cannot do the math without it. However, it also vindicates Robbins's contention that once you admit these comparisons, you have left science for ethics. Stern's recommendation changed entirely based on an ethical parameter choice, not new empirical data.

  Yet, the episode suggests both framed the issue in a way that misdescribes what actually happened. The operative disagreement was not solely about whether one person's welfare can be weighed against another's. It was about the units of utility and attitudes to catastrophic risk. Nordhaus claimed the unit of utility was revealed by market interest rates; Stern claimed it was revealed by moral reasoning. This is a disagreement about the *source* of the comparison, not the possibility of it. Furthermore, the Weitzman intervention shows that the policy conclusion is robust to different discount rates if risk is handled differently. This implies the fight over the decimal place was a proxy for a deeper disagreement about risk aversion and catastrophe.

  Therefore, the lens of interpersonal utility comparisons is correct but incomplete. It correctly identifies that the Stern Review forced economics to confront its ethical foundations, proving Sen right that informationally rich comparisons are necessary for global policy. It proves Robbins right that these comparisons cannot be empirically verified in a laboratory sense. But it also shows that the dispute was never purely about interpersonal comparison. It was about epistemology: how we know what matters to people who do not yet exist. The decimal place was not just a number; it was the point where the model touched the moral universe. The theory of interpersonal comparison explains why the touch was necessary, but it cannot explain why the contact burned so hot. That heat came from the realization that in climate economics, the arithmetic is the ethics, and there is no neutral ground between them.
