  *   **Examples:** The interpretation of probability (frequency vs. propensity vs. subjective), the problem of confirmation, the analytic/synthetic distinction, the realism/anti-realism debate.
  *   **Rationale:** $R$ is a foundational claim about the nature of probability and explanation, not merely a technical statistical problem. It belongs to the same genus as the debate over the interpretation of probability.
  *   **Resolution Rate:** In this class, "resolution" (defined as broad consensus that the problem is dissolved or solved, rather than merely managed) is exceedingly rare. Most disputes persist in modified forms.
  *   **Number:** **0.05** (5%).

  **Secondary Reference Class:**
  *   **Class:** *Disputes that have generated a technical literature with formal impossibility results.*
  *   **Examples:** Arrow's Impossibility Theorem in social choice, the Halting Problem in computability, Bell's Inequalities in physics.
  *   **Rationale:** $R$ invites technical work (calibration, screening-off) that might produce impossibility theorems which force a consensus (even if the consensus is that $R$ is false).
  *   **Resolution Rate:** Higher than pure philosophy. Formal results often prune the space of viable positions, forcing a "settlement" on what is possible, even if normative disagreement remains.
  *   **Number:** **0.15** (15%).

  **Artifact of Selection:**
  My estimate for (v) is **0.10**. This is an average weighted toward the Primary Class. If I had selected the Secondary Class as my primary guide, my headline credence would rise to roughly **0.06**. If I stick with the Primary Class, the headline drops to **0.015**. The selection of the reference class accounts for a **factor of 4 swing** in the final headline figure. I choose the Primary Class because $R$ asks for a "procedure statable without reference to interests," which is a philosophical constraint, not just a technical one. Technical results rarely settle philosophical constraints on "interests."

  ---

  ### What Would Move Me Furthest?

  **The Single Argument:**
  A proof of **Statistical Learnability of Natural Kinds**.
  If a result were produced demonstrating that, given infinite data, a specific algorithm converges on a *unique* partition of the world that maximizes predictive accuracy *and* is invariant under all permutations of "grue-like" predicates (without baking in a prior vocabulary), term (ii) would jump from 0.15 to 0.90.
  This would effectively solve the "vocabulary" problem. It would imply that nature itself dictates the reference class, rendering the "interest-free" clause of $R$ satisfiable.
  Without this, $R$ remains vulnerable to the claim that homogeneity is always homogeneity-relative-to-a-language, which makes the "interest-free" requirement impossible.

