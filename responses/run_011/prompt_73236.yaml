  Given that (v) is 0.10, and there is a chance the community accepts a solution that is actually flawed (false positive), or rejects a true one (false negative), I set the headline slightly below the recognition probability to account for the metaphysical risk in (ii).
  **Final Calculation:** $P(v) \times P(\text{Metaphysical Soundness} | \text{Recognition}) \approx 0.10 \times 0.3 = 0.03$.

