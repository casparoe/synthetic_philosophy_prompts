prompt: |-
  ok so context: I'm a senior and my school has this year-long independent research thing where you pitch a project in the fall, get a faculty sponsor, and in the spring you hand in a ~4000 word paper and give a 10 minute talk. I have to write the pitch (about 2 pages) and I'm stuck on turning my actual idea into one. I can use the school's computer lab, so I could run simulations in Python if that helps, but I'm not a stats person — AP Stats and thats it.

  Where the idea came from, kind of embarassing: last year for the science fair I tested whether a spaced-repetition app helped people memorize vocab better than paper flashcards. I got p = .03 and I was SO proud. Then my uncle, who's a GP and not a statistician, said something like "that's nice, but nothing in your study lets me say whether it'd work again if I ran it on my patients." Which broke my brain a little, because I'd assumed a significant result basically WAS a promise about the next study.

  So I started reading about the replication crisis, and everyone seems to explain it as a misbehavior problem: p-hacking, HARKing, publication bias, tiny samples, people running 20 analyses and reporting the one that worked. Fine, that's real. But I think there's a quieter problem underneath that I can't stop poking at. "Replication" only means anything if the first study licenses a prediction about what a second study would find. And I'm not convinced a p-value, or even a confidence interval, ever licenses that kind of prediction — a 95% CI is supposed to be about what happens across endless repeats of MY study, not about the one specific new study somebody else runs. Whereas a Bayesian posterior predictive distribution actually looks like the object you'd want here. So my question, rough version: is a big chunk of the replication crisis really a crisis about the predictive content of inference — i.e. did frequentist methods never support the thing that replication quietly assumes they do? Or am I just tangling myself up?

  Turn that into the pitch. I need: the question stated precisely enough that a smart person could disagree with it (right now I don't think mine is precise); why the standard diagnoses above don't already settle it; what I'd actually do across roughly 30 weeks, including whether a small simulation would strengthen the argument or just be decoration; what a real result would look like at the end versus what would mean the project failed; and an honest verdict on whether a 17 year old with one stats class can pull this off, and if not, which version of it I should pitch instead. I might be repeating an argument somebody already made, I have no idea and I can't really check — assume it's been half-said somewhere and tell me how to make it sharp anyway. No bibliography or reference list, my sponsor and I add those later. And don't be gentle about it: if the whole idea is a muddle, I'd way rather find out now.
