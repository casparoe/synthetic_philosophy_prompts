      *   Why standard diagnoses don't settle it? Yes (focus on valid studies).
      *   30-week plan? Yes.
      *   Simulation role? Yes (central).
      *   Success/Failure? Yes.
      *   Honest verdict? Yes (in the commentary section).

  *(Self-Correction during drafting)*: I initially thought about suggesting real data. No, that's too messy. Simulation is better because we control the "truth." I need to make sure the user understands that "Bayesian" doesn't mean "subjective opinion" here, but a specific mathematical framework for prediction. I also need to warn them that "Replication" needs a strict definition (e.g., $p_{rep} < 0.05$).

  Let's assemble the response. First, the honest verdict/advice, then the actual pitch text they can adapt. This separates the "coaching" from the "deliverable."

  *Wait, one more thing:* The user asked "Turn that into the pitch." They want the text *of the pitch*, but also the advice. I should provide the advice first (the "don't be gentle" part) so they know *why* the pitch is written the way it is, then provide the draft. Actually, reading the prompt again: "Turn that into the pitch... And don't be gentle about it... if the whole idea is a muddle, I'd way rather find out now."
  Okay, I will structure the response as:
