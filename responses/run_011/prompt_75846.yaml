answer: |-
  ### Part 1: The Honest Verdict

  **Is this a muddle?**
  No. Your intuition is sharper than most undergraduates'. You have correctly identified a specific category error: conflating *inference about a parameter* (what frequentism does) with *prediction about future data* (what replication requires). This is a known issue in meta-science (Gelman, Ioannidis, and others discuss it), but it is rarely explained clearly to non-statisticians.

  **Can a 17-year-old with AP Stats pull this off?**
  **Barely, but yes—if you stick to simulation.**
  If you try to derive the math for posterior predictive distributions from scratch, you will fail. You do not have the measure theory background. However, if you treat this as a **computational experiment** where you use Python to *simulate* the behavior of both methods, it is very doable. You don't need to prove the theorems; you need to demonstrate the *consequences* of the theorems.

  **The Risk:**
  The risk is that you end up writing a philosophy paper instead of a science paper. To avoid this, your "data" must be the output of your code. Your "result" must be a graph showing the gap between "Expected Replication Rate" (what the p-value implies to a naive reader) and "Actual Replication Rate" (what your simulation shows happens).

  **The Pivot if it gets too hard:**
  If Bayesian simulation proves too complex (e.g., choosing priors becomes a rabbit hole), pivot to a **Frequentist-only** simulation. You can still prove the point by showing that even with zero p-hacking and perfect power, a $p=0.04$ result does *not* guarantee a $p<0.05$ in the next study. This is simpler but less "complete." I have written the pitch assuming you attempt the Bayesian comparison, as that is your strongest hook.

  ***

  ### Part 2: The Project Pitch

  **Project Title:** The Prediction Gap: Quantifying the Mismatch Between Statistical Significance and Replication Probability

  **Research Question**
  Standard statistical reporting treats a significant result ($p < 0.05$) as evidence that a finding is "real" and likely to replicate. However, frequentist p-values describe the probability of the *data* given a null hypothesis, not the probability of a *future replication* given the current data. This project asks: **In typical experimental conditions with no p-hacking, to what extent does standard frequentist inference overestimate the probability of successful replication compared to Bayesian posterior predictive distributions?**

  I hypothesize that there is a systematic "prediction gap": researchers interpret a significant p-value as implying a high probability of replication (e.g., >90%), while simulation will show the actual replication rate is significantly lower, and that Bayesian predictive intervals provide a more accurate calibration of this uncertainty.

  **Context and Motivation**
  The "replication crisis" in science is often attributed to researcher misconduct (p-hacking, HARKing) or small sample sizes. While these are real problems, they assume that if a study is conducted perfectly, the statistical output should license a prediction about future studies. My preliminary research suggests this assumption is false.

  A 95% Confidence Interval (CI) means that 95% of such intervals constructed from repeated sampling will contain the true parameter. It does *not* mean there is a 95% chance the true parameter is in *this* specific interval, nor does it directly predict where the mean of a *new* study will fall. Yet, this is often how results are interpreted by practitioners (e.g., clinicians, policymakers). If the statistical tools themselves do not support the predictive claims users place on them, then replication failures may occur even in the absence of misconduct. This project seeks to quantify that error.

  **Methodology**
  This is a computational simulation study. I will not collect human subject data; instead, I will generate synthetic populations where the "truth" is known, allowing me to measure the accuracy of different statistical interpretations.

  1.  **Simulation Environment (Python):** I will write scripts to simulate thousands of pairs of "Original" and "Replication" experiments. I will define a known population effect size (e.g., Cohen's $d = 0.5$) and sample size (e.g., $N=50$ per group).
  2.  **Frequentist Arm:** For each "Original" simulation, I will calculate the p-value and 95% CI. I will record how often a "Replication" simulation yields $p < 0.05$ (the standard definition of replication success). This establishes the *Actual Replication Rate* for a given p-value.
  3.  **Bayesian Arm:** For the same data, I will compute a Bayesian posterior using weakly informative priors. I will then generate a *Posterior Predictive Distribution* for the replication study. This yields a direct probability statement about the replication data (e.g., "There is an 80% probability the replication effect will be positive").
  4.  **Comparison:** I will compare the Frequentist "implied confidence" against the Actual Replication Rate and the Bayesian Predictive Probability.

  **Timeline (30 Weeks)**
  *   **Weeks 1-6 (Fall): Literature & Logic.** Review literature on the replication crisis and the definition of predictive inference. Finalize the mathematical definitions of "replication success" to be used in the code.
  *   **Weeks 7-14 (Fall): Coding & Calibration.** Learn necessary Python libraries (`numpy`, `scipy`, `pymc` or `bambi`). Build the simulation engine. Run pilot tests to ensure the code generates expected distributions (e.g., verifying that uniform p-values are generated under the null).
  *   **Weeks 15-22 (Winter): Data Generation.** Run the full Monte Carlo simulations (aiming for 10,000+ iterations). Collect metrics on replication rates across varying effect sizes and sample sizes.
  *   **Weeks 23-28 (Spring): Analysis & Drafting.** Visualize the "Prediction Gap." Write the 4000-word paper, focusing on interpreting the graphs for a non-statistical audience.
  *   **Weeks 29-30 (Spring): Presentation.** Prepare the 10-minute talk, focusing on the practical implication: "Why your p-value isn't a promise."

  **Expected Results and Success Criteria**
  *   **Success:** The simulation demonstrates a quantifiable gap. For example, results might show that an original study with $p=0.04$ only leads to a successful replication 60-70% of the time, whereas the Bayesian predictive distribution correctly estimates this lower probability. The final paper will provide a "lookup table" or graph showing what replication rate a researcher should *actually* expect given a specific p-value and sample size.
  *   **Failure:** The simulation code fails to converge, or the results show no meaningful difference between the methods (unlikely based on theory). A secondary failure mode is producing a paper that is purely philosophical without robust simulation data to back the claims.
  *   **Contingency:** If the Bayesian modeling proves too mathematically dense, I will pivot to a Frequentist-only analysis focusing on the "Replication Probability" (Killeen, 2005) vs. Actual Replication Rate. This still addresses the core question without requiring full Bayesian derivation.

  **Feasibility and Resources**
  I have completed AP Statistics, which covers the frequentist concepts (p-values, CIs). The Bayesian concepts are beyond the AP curriculum, but I will learn them through the lens of implementation (using Python libraries) rather than theoretical derivation. The school computer lab is sufficient for this computational load. My faculty sponsor will help ensure the statistical logic holds, specifically regarding prior selection in the Bayesian arm.

  **Conclusion**
  This project does not require new mathematics, but it applies existing statistical theory to a question that confuses many practicing scientists. By visualizing the "Prediction Gap," this project aims to clarify why replication is harder than p-values suggest, moving the conversation from "researchers are cheating" to "our tools are being misinterpreted."

  ***

  ### Part 3: Notes for Your Sponsor Meeting

  When you sit down with your faculty sponsor, they are going to probe three weak points. Here is how you handle them:

  1.  **"Isn't this just known?"**
      *   *Your Answer:* "Statisticians know it, but the people *using* the stats (biologists, psych students) generally don't. My project isn't to discover the math, but to simulate the *magnitude* of the error in a way that's accessible. It's an educational demonstration of a known theorem."
  2.  **"Bayesian stats is hard. How will you choose priors?"**
      *   *Your Answer:* "I plan to use 'weakly informative' or 'regularizing' priors (like a normal distribution centered at 0 with a wide variance). I'm not trying to prove a specific clinical effect; I'm testing the *method*. I'll run sensitivity analyses to show that the choice of prior doesn't change the main conclusion about the prediction gap."
  3.  **"What if your code is wrong?"**
      *   *Your Answer:* "That's why Weeks 7-14 are for calibration. I will test the code against known analytical solutions (e.g., ensuring that under the null hypothesis, p-values are uniformly distributed) before I trust the replication data."

  **Final Advice:**
  You are right to be worried about the "muddle." The line between "statistics" and "philosophy of statistics" is thin. **Keep it computational.** If you can produce a graph where the X-axis is "Observed P-Value" and the Y-axis is "Probability of Replication," and you show two lines (one for what people *think*, one for what *happens*), you have a winning project. Don't get lost in the text; let the simulation speak.
