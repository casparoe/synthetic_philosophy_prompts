      *   **Core Idea:** Frequentist methods (p-values, CIs) describe long-run properties of the *method*, not the probability of a specific *replication*. Bayesian posterior predictive distributions might better capture what people *think* they are getting (prediction of the next study). Is the replication crisis partly a "category error" about prediction?
      *   **Constraints/Needs:** Precise research question, justification (why standard diagnoses aren't enough), 30-week plan (including simulation role), success/failure criteria, honest feasibility assessment (can a 17-year-old do this?).
