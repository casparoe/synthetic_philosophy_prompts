answer: |-
  Your physics regarding correlations is correct, but your conclusion that Landauer is optional is false because your "memory laundering" scheme merely shifts the entropy cost to the initial preparation of the ancilla stockpile, meaning you haven't exorcised the Second Law, you've just treated low-entropy memory as a consumable fuel source.

  Here is the breakdown of why your position holds water locally but fails globally, ranked by severity.

  ### 1. The Fatal Defeater: Ancillas Are Fuel
  Your "memory laundering" scheme works exactly like a heat engine using a cold reservoir: you dump entropy into the dirty registers, swap them for clean ones, and continue. This functions perfectly until you run out of clean ancillas. To make the process sustainable (cyclic), you must reset the dirty ancillas to clean. That reset incurs the Landauer cost ($kT \ln 2$ per bit). If you claim you will reset them "lazily" or "in bulk" at a colder temperature, you are simply describing a standard heat engine cycle operating between two temperatures; you haven't avoided the cost, you've just optimized the efficiency via the Carnot bound. If you claim you will never reset them, you are admitting the demon requires an infinite supply of low-entropy matter to function, which violates the assumption of a closed system in equilibrium. In information thermodynamics, a stockpile of blank ancillas *is* a store of negentropy (free energy); consuming them to hide entropy is thermodynamically identical to burning coal to hide combustion products. The Second Law applies to the preparation of that stockpile just as it applies to the reset.

  ### 2. The Fatal Defeater: You Solved the Wrong Problem
  The Maxwell's Demon paradox is not about whether a one-shot device can decrease entropy locally (we know it can, at the expense of increasing it elsewhere); the paradox is specifically about whether a *cyclic* device can do so indefinitely without external work input. Your one-shot argument concedes the point: the demon stops working once memory is full. The orthodox Landauer/Bennett resolution is required precisely to explain why the demon cannot simply wipe its memory for free and start again. By defining the problem away ("never reset and never reused"), you have insulated your model from falsification, but you have also insulated it from relevance to the Second Law, which governs cyclic processes and equilibrium states. A engine that runs once and then becomes part of the waste heat isn't a counterexample to perpetual motion; it's a battery.

  ### 3. The Awkward Defeater: Novelty Collapse
  Your position is not novel; it is the standard pedagogical setup for deriving Landauer's principle. Charles Bennett's 1982 paper, *The Thermodynamics of Computation*, explicitly distinguishes between the reversible measurement phase (where correlations build up) and the irreversible erasure phase (where the cost is paid). Your "correlations carry the entropy" insight is the standard explanation for why the measurement step doesn't violate the Second Law. Your "memory laundering" is equivalent to the "information tape" model used in Szilard engine derivations. Defenders of the orthodoxy agree with your premise (entropy sits in correlations) but disagree with your conclusion (therefore Landauer is optional); they argue Landauer is the *necessary condition* for closing the cycle. You have effectively reinvented the first half of the standard proof and mistaken it for a refutation of the second half.

  ### 4. The Merely Embarrassing Defeater: Boundary Dependence
  You argue the paradox is a "boundary-convention illusion." While it is true that entropy is coarse-grained and boundary-dependent, work extraction is not. If your demon can lift a weight using heat from a single bath, that is a physical observable independent of where you draw the system boundary. Your model explains why the weight lifting stops (memory full), but it doesn't explain why you can't reset the memory for free. If you insist the boundary includes the ancilla stockpile, the total entropy rises. If you exclude it, you have an open system, and the Second Law doesn't apply in the simple form anyway. Claiming the Second Law is only about "finite-memory reusable machines" is semantically tricky; the Second Law is about isolated systems. Your formulation is just a restatement of resource theory: you are consuming a resource (blank bits) to produce work.

  ### Orthodox Concessions and Nuance
  To answer your request for what Landauer defenders concede:
  *   **Finite-Time Costs:** Orthodoxy concedes that $kT \ln 2$ is an asymptotic lower bound achievable only in quasistatic (infinitely slow) operations. Real erasure costs more.
  *   **Quantum Coherence:** In quantum regimes, if the demon and system remain entangled, simple classical bit-counting fails, and work can be extracted from coherence (quantum Maxwell demons). However, decoherence eventually forces the cost.
  *   **Earman-Norton Critique:** Some philosophers of physics (Earman and Norton) argued that Landauer's principle is circular because it assumes the Second Law to prove the Second Law. Bennett countered that Landauer's principle is derived from Hamiltonian dynamics and Liouville's theorem, not assumed from thermodynamics. Most physicists side with Bennett, but the philosophical debate on whether Landauer is a *physical* law or a *statistical* necessity persists.
  *   **Correlation Bookkeeping:** Defenders agree that correlation bookkeeping is sufficient for non-cyclic processes. They insist Landauer is only required when demanding logical irreversibility (resetting) within a cyclic process.

  ### Verdict on Unfalsifiability
  Your one-shot move is not unfalsifiable, but it is trivial. It is falsifiable in the sense that if you claimed the demon could run forever without reset, experiment would show it stops. By retreating to "it runs until memory is full," you are safe, but you are no longer challenging the Second Law. The "memory laundering" scheme is falsifiable: if you could reset the dirty ancillas without dissipating heat while maintaining the cycle, you would violate the Second Law. Experiments (e.g., Bérut et al., 2012) have confirmed the Landauer bound during reset. Your scheme predicts no cost during the swap, but a cost during the eventual bulk reset. Since the bulk reset is physically identical to the standard erasure, the prediction collapses to the orthodox one.

  ### Summary
  You have correctly identified that entropy is conserved in the joint system during measurement and that a non-cyclic demon violates nothing. However, you have incorrectly inferred that this makes Landauer's principle optional. Landauer's principle is the tax on *recycling* the memory. Your "laundering" is just deferring the tax payment to a later date or a different subsidiary (the ancilla factory); the total debt remains unchanged. Your position is the standard "information is physical" view, but you have stopped reading the story halfway through.
