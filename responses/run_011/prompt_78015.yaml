          *   *Ranking:* High pressure. It challenges the "bare thisness" necessity.

      *   **(c) Background Space/External Standpoint:**
          *   *Objection:* Black's world implies a container space. If space is relational, the spheres define the space. If absolute, the space provides the individuation (spatial coordinates).
