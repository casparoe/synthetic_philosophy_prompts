      *   Does actual QM matter? The user's argument is modal ("if such a world can be described..."). Actual physics strengthens the *plausibility* but the *metaphysical claim* rests on possibility. If PII is necessarily true, one counter-possible world kills it. So actual physics is evidentiary support, not the logical engine.
