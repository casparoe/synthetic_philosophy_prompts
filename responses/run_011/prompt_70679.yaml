prompt: |-
  I'm running a seminar session on Wittgenstein's lectures on religious belief and the room is mostly stats and psych grad students — very fluent in credences, priors, likelihood ratios, conditionalisation, and basically nothing else. I want to hand them a translation exercise rather than another summary, so: restate what he's actually claiming in strict Bayesian terms. The claims are that the believer's confidence isn't a weaker version of ordinary empirical confidence, that he isnt holding the Last Judgment on evidence and wouldn't drop it under contrary evidence, that what he holds fast to is a picture that regulates the whole of his life, and that the philosopher's disagreement with him isn't a contradiction of the usual kind. Take a genuine run at the mapping, and flag every spot where what you're doing stops being translation and becomes quietly arguing with him.

  For the residue report, I want you to test one specific move: treat the religious belief not as a hypothesis inside the space but as something doing the work of a prior over the whole space, and tell me whether that actually earns you the unshakeability and the regulation-of-life features or just renames them. There's a reflection-principle-shaped problem lurking in there about who gets to fix the prior and whether holding it fast counts as a violation of anything, so go after it if it's really there. Then say which bits of Wittgenstein have no expression at all in the credence vocabulary, and whether that's a real limit of the vocabulary or a sign that what he's saying is less clear than it sounds — I don't have a dog in that fight yet, I'm trying to find out.

  No quotations and no bibliography, please. I can't check either and I don't want the students off chasing references instead of doing the translation.
