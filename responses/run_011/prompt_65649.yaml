  ### The Principle of Outcome Legitimacy with Precedential Exception

  Your intuitions are not random; they track a coherent tension between two different purposes of your board. Sometimes you are acting as a **court** (judging a specific student), and sometimes you are acting as a **legislature** (defining the rules for future students). When you are a court, the legitimacy of the verdict depends on the members agreeing on the *result*. When you are a legislature, the legitimacy depends on the members agreeing on the *rule*.

  Your gut reactions consistently prioritize **Outcome Legitimacy** (the student's right to a verdict supported by a majority of the panel) unless **Precedential Necessity** (the institution's need for a clear rule) or **Unanimous Consent** (the panel's total agreement) overrides it.

  Here is the reasoning worked through:

  **1. The Default Rule: Outcome Majority (Cases 1, 3, 5, 6, 7)**
  In routine adjudication, the stake is the student's record. Democratic legitimacy requires that a majority of the panel supports the actual finding. In Case 1, only one member voted "Responsible" on the straight-up question. Even though the elements passed, the panel as a collective did not agree on the guilt. Finding responsibility here treats the student as a means to enforce element consistency rather than an end in themselves. You were right to call this wrong.

  This same logic applies to sanctions (Case 3). A 2–1 vote for a sanction where the two majority members disagree on *why* (different grounds) is unstable. It means there is no majority for *this* sanction on *these* facts. However, if the vote is unanimous (Case 4), the lack of a specific ground majority matters less because the collective will is clear. Unanimity validates the outcome even if the reasoning fragments.

  **2. The Exception: Precedential Necessity (Case 2)**
  Case 2 is the mirror of Case 1. Here, the stake is not just the student, but the interpretation of the AI rule for every future student. If you vote on the outcome and find "Not Responsible" (because only 1 voted yes), you leave the rule undefined. Future panels won't know if AI is prohibited. To serve the institution, you must vote on the elements to establish a majority view of the rule, even if it overrides the outcome majority. This is the only time element-voting trumps outcome-voting.

  **3. Competence and Record Integrity (Cases 5, 6)**
  Your distinction in Case 5 (deference vs. ignorance) and Case 6 (tacit vs. explicit strategy) hinges on the **utility of the record**.
  *   In 5a, members defer to expertise; the record reflects a judgment based on knowledge. In 5b, they vote on noise; the record is false.
  *   In 6a, a member votes strategically but silently. The record shows a majority on the element, which can be used for precedent (Case 2). In 6b, the member announces the strategy. This explicitly marks the element vote as "false" in the minutes. It destroys the record's value for future precedent. You ruled 6b out of order not because the vote was wrong, but because the *declaration* corrupted the board's institutional memory.

  **4. Procedural Authority (Case 7)**
  When preferences cycle (no majority winner), the "Outcome Majority" rule stalls. Someone must break the tie. As Chair, your authority to set the agenda is the tie-breaker. This is consistent because the alternative is deadlock.

  **The Sacrifice**
  You asked which verdict you must give up. Strictly speaking, you can keep all of them if you accept that **Case 6b** rests on a fragile distinction: that hiding strategy is virtuous but revealing it is corrupt. If you value transparency above record utility, 6b must go. However, to maintain the system that allows Case 2 (precedent), you must protect the record. So I will argue you can keep 6b, but you must accept that you are prioritizing the *institution's* need for a clean record over the *members'* right to transparency about their own voting behavior.

  **Upcoming Scenarios**
  *   **Scenario 1 (5 members, 3–2 on elements, 1–4 on outcome):** This is Case 1 amplified. The disconnect between element consensus and outcome rejection is wider. Under the principle, the Outcome Vote rules. Verdict: **Not Responsible**. It is worse than Case 1 because a 1–4 split signals a deeper lack of collective moral consensus than 1–2.
  *   **Scenario 2 (Logical Framing):** This is the "Doctrinal Paradox." If you vote on elements, the framing changes the result. The bylaws must mandate that **Outcome Voting** is the default for responsibility findings. Element voting is only permitted when the Chair declares the case precedential. If element voting is used, the logical structure of the rule must be fixed in policy, not decided meeting-by-meeting.

