  **1. Brainstorming Pass**
  Topological invariance (A) explains structural invariants like enclosure and connectivity but fails on metric distinctions like gaps versus crossings where visual noise obscures the topology. Generative parsing (B) accounts for occlusion and assembly histories but cannot handle abstract relations devoid of physical layering or object identity. Relational transfer (C) is necessary for analogical mapping across clusters but irrelevant for single-object properties or metric classifications. Calibrated tolerance (D) handles noise versus signal in freehand drawing and metric thresholds but cannot define structural rules alone without a representational target. Fluid re-description (E) accounts for search difficulty and switching costs but acts as a meta-mechanism rather than a representational primitive defining the concepts themselves.

  **2. Task-by-Task Analysis**

  | Task | Dominant Principle | Explanation and Conflicts |
  | :--- | :--- | :--- |
  | **1. Nesting** | **A (Topological invariance)** | The rule relies entirely on enclosure and inside/outside relations which survive deformation, with metric details explicitly treated as noise. |
  | **2. Crossing** | **D (Calibrated tolerance)** | **D wins over A:** while the rule is topological (intersect vs. disjoint), successful perception requires inferring intent from gap size relative to wobble, which A cannot resolve alone. |
  | **3. Stack** | **B (Generative parsing)** | Solvers must reconstruct a layering history to distinguish familiar occluded figures from ad hoc contours, prioritizing assembly story over raw pixel topology. |
  | **4. Twice Relation** | **C (Relational transfer)** | The rule quantifies over roles (inside/larger) across disjoint clusters, requiring analogical mapping rather than object classification or metric measurement. |
  | **5. Shape of Nothing** | **D (Calibrated tolerance)** | **D wins over A:** while A defines the bounded region, classifying it as square versus non-square requires metric judgment on implicit boundaries derived from sparse marks. |
  | **6. Wobbly Circles** | **D (Calibrated tolerance)** | Distinguishing irregular noise (circle) from systematic deviation (ellipse) requires modeling the expected variance of the class rather than matching a rigid template. |

  **3. Explanatory Credit Allocation**

  *   **A (Topological invariance): 0.25** — Foundational for defining regions and enclosure in half the tasks, but often dependent on metric preprocessing to be visible.
  *   **B (Generative parsing): 0.15** — Essential for the occlusion task but narrowly applicable to scenes implying physical assembly or layering.
  *   **C (Relational transfer): 0.15** — Critical for the analogical task but irrelevant for single-image properties where no role-mapping is required.
  *   **D (Calibrated tolerance): 0.35** — Dominates the set because three tasks hinge on distinguishing signal from noise or metric intent rather than pure structure.
  *   **E (Fluid re-description): 0.10** — Accounts for the cognitive effort in switching strategies but contributes less to the final representational success than the primitives above.

  **Kicker**
  **Rank (Easiest to Hardest):** 6, 1, 2, 5, 3, 4.
  **What the ordering shows:** The ordering reveals that while deep models excel at statistical shape regularities, they fail catastrophically when required to abstract relations over segmented groups or infer generative histories.
