answer: |-
  # The Corridor Quiet Use Act: Interpretation Seminar Exercise

  ## I. Instructor's Overview
  **Session Length:** 110 Minutes
  **Class Size:** 18 Students (3 Courtrooms of 5 participants + 3 Market Clerks)
  **Pedagogical Goal:** To force students to experience the trade-off between textual fidelity and purposive equity through resource scarcity and scoring incentives, without naming the methodological schools.

  **Core Mechanic:** A token economy limits access to legislative history. The scoring rubric rewards textual fidelity but penalizes inequitable outcomes, creating a zero-sum game between "winning the argument" and "winning the case."

  ---

  ## II. Printable Materials

  ### A. The Statute (Handout 1)
  **State of Jefferson | Corridor Quiet Use Act (2024)**

  **Section 1: Findings and Purpose**
  The Greenway Corridor is a public space used by pedestrians, cyclists, and persons with mobility impairments. The growth of motor-driven devices has increased collisions and noise. The purpose of this Act is to keep the Corridor safe and quiet for persons travelling under their own power.

  **Section 2: Definitions**
  "Motor-driven device" means any apparatus propelled by an engine or motor. This definition expressly includes internal-combustion engines and electric motors.
  "Corridor" means the entire Greenway Corridor park boundaries.

  **Section 3: Prohibition**
  No person shall operate a motor-driven device on any segment listed in Schedule A.

  **Section 4: Speed Limit**
  No person shall operate a bicycle or motor-driven device in excess of fifteen miles per hour on the Corridor.

  **Section 5: Exemptions**
  This Act does not apply to vehicles used in construction, maintenance, or repair of the Corridor, or to emergency vehicles responding to an emergency on the Corridor.

  **Schedule A: Restricted Segments**
  1.  North Bridge Approach
  2.  Riverwalk East
  3.  Community Garden Path
  4.  Historic Loop (formerly Motorized-Use Segment)
  5.  South Connector

  *(Note to Instructor: Ensure the printed Schedule A lists Segment 4 as "Historic Loop" but include a footnote in the legislative record materials indicating the committee approved "Motorized-Use Segment" for Segment 4.)*

  ### B. The Market Catalog (Handout 2)
  **Legislative Record Access Prices**
  *Each Counsel Team receives a budget of **10 Tokens**. Documents are sold on a first-come, first-served basis.*

  | Document | Price | Description |
  | :--- | :--- | :--- |
  | **Senate Committee Report** | 4 Tokens | States ban targets gas-powered mini-bikes; notes "nothing limits access for persons with disabilities." |
  | **Sponsor's Floor Statement** | 4 Tokens | States ban reaches "anything with a motor"; explicitly confirms electric-assist bicycles are included. |
  | **Agency Hearing Transcript** | 3 Tokens | Tour operator's counsel states client was assured Segment 4 would be excluded from the ban. |
  | **Drafting Consultant's Memo** | 5 Tokens | Notes Schedule A was renumbered in second printing; engrossed list does not match approved descriptions. Never voted on. |
  | **Disability Rights Endorsement** | 2 Tokens | One-paragraph letter praising the bill for "preserving access." |

  ### C. The Scoring Rubric (Handout 3)
  **Judicial Evaluation Scorecard**
  *Judges must assign points (0-10) in each category. The Total Score determines the winning brief.*

  | Dimension | Scoring Criteria |
  | :--- | :--- |
  | **1. Textual Fidelity** | Award high points for arguments grounded strictly in the enacted words of Sections 2, 3, and 4. Deduct points for relying on external materials not incorporated by reference. |
  | **2. Purposive Alignment** | Award high points if the outcome advances the safety and quiet goals stated in Section 1. Deduct points if the outcome undermines the Corridor's usability. |
  | **3. Reliance & Fairness** | Award high points if the ruling protects parties who reasonably relied on prior practice or specific assurances. Deduct points for outcomes that appear manifestly unjust or absurd. |

  *(Instructor Note: It is mathematically difficult to maximize all three. High Textual Fidelity on Case 2 (Tour Operator) requires ignoring Reliance. High Reliance requires bending Text.)*

  ### D. Case Dockets (Handout 4)
  *Assigned to specific Courtrooms.*

  *   **Case 1 (The Gardener):** 71-year-old woman, physician-prescribed electric tricycle, cited under Section 3. Cannot reach garden otherwise.
  *   **Case 2 (The Tour):** Segment 4 operator, gasoline vehicle, 12 mph, cited under Section 3. Operating continuously since 1974.
  *   **Case 3 (The Delivery):** Contractor, 250-watt e-cargo bike, 18 mph, cited under Sections 3 & 4.
  *   **Case 4 (The Drone):** SAR Volunteer, gasoline drone, launched/landed Segment 2, never touched ground inside Corridor, cited under Section 3.

  ### E. The Sealed Envelopes (Handout 5)
  *Do not open until Minute 105.*

  **Envelope 1: The Legislative Mind**
  > "Subcommittee Vote Record: Four legislators present. Four incompatible understandings of 'motor-driven device.' One voted without reading Schedule A. The compromise was to use a broad word and let the agency sort it out."

  **Envelope 2: The Status of the Memo**
  > "The document which would have settled the meaning is the Consultant's Memorandum. It was never read aloud, never voted on, and written by a non-legislator. What status does this give it?"

  ---

  ## III. Minute-by-Minute Timeline

  | Time | Activity | Instructions |
  | :--- | :--- | :--- |
  | **00-10** | **Setup & Distribution** | Divide class: 3 Courtrooms (5 students each), 3 Market Clerks. Distribute Statute, Rubric, Dockets. **Do not explain theory.** Explain tokens and rules only. |
  | **10-30** | **Market Phase** | Clerks open shop. Counsel teams (2 per side) budget tokens and buy documents. *Scarcity mechanic active.* Teams review purchased materials. |
  | **30-50** | **Brief Preparation** | Teams draft 1-page argument. Judges review Rubric. |
  | **50-90** | **Oral Arguments** | **Parallel Sessions.** Court 1 (Case 1), Court 2 (Case 2), Court 3 (Cases 3 & 4 combined). 10 mins per case (5 min/side + 2 min ruling). |
  | **90-100** | **Deliberation** | Judges score briefs using Rubric. Clerks collect unused tokens. |
  | **100-105** | **Verdicts** | Judges announce winners and scores. |
  | **105-110** | **The Reveal** | Open Envelopes. Brief debrief on the "Status of the Memo." |

  ---

  ## IV. Failure Modes & Mid-Session Patches

  ### 1. The "Memo Rush" (Predicted Failure)
  **The Problem:** You anticipate every team will try to buy the Drafting Consultant's Memo (5 tokens) because it solves the Schedule A ambiguity. If all 6 counsel teams buy it, the scarcity mechanic fails, and the "error" becomes common knowledge, collapsing the tension.
  **The Patch:** **Limit Supply.** Instruct the Market Clerks that there are only **three** copies of the Drafting Consultant's Memo available for the entire class.
  **Mid-Session Correction:** If you see everyone has the Memo at Minute 20, announce a "Records Retention Error": *"Clerks have discovered only three copies of the Memo exist in the archive. The remaining teams must proceed without it."* This forces the teams without the Memo to argue Text or Purpose more aggressively, heightening the conflict.

  ### 2. The "Theory Leak"
  **The Problem:** Law students may recognize the game and start using forbidden words ("Textualist," "Intentions," "Purposive").
  **The Patch:** **The Penalty Box.** Announce at the start: *"Use of abstract methodological labels results in a 2-token fine deducted from your team's final score."* This forces them to argue the *mechanics* of interpretation (e.g., "The words say X" vs. "The goal is Y") rather than labeling the philosophy.

  ### 3. The Philosophy/Law Divide
  **The Problem:** Philosophy grad students may dominate the "Purpose" arguments while Law students dominate "Text," entrenching stereotypes rather than blending skills.
  **The Patch:** **Role Assignment.** Assign roles before class. Ensure each Counsel Team has one Law student and one Philosophy student. Instruct them: *"Counsel 1 must lead the Text argument; Counsel 2 must lead the Equity argument."* This forces cross-training.

  ---

  ## V. Debrief & The Purposivist Objection

  ### The Candid Debrief (Last 5 Minutes)
  Do not lecture. Ask three questions:
  1.  *"Counsel who bought the Memo: Did it make your argument easier, or did it create new problems regarding its authority?"*
  2.  *"Judges: Did you award points for Textual Fidelity even when it produced a result you disliked?"*
  3.  *"Look at Envelope 2. If the Memo is the only thing that clarifies the error, but it has no legal status, how do you decide?"*

  ### The Articulate Purposivist Objection
  **The Objection:** A student will likely raise this hand: *"Professor, you rigged the economy. You made the Text free and the Purpose expensive. You made the Legislative Record self-contradictory (Sponsor vs. Committee) so that the only 'clean' evidence was the Text. This exercise doesn't prove Textualism is better; it proves that when you make history hard to get, people stick to the text."*

  **Does it Land?**
  **Yes.** It lands accurately. The exercise *does* simulate the cost of research, but it artificially inflates the contradiction in the record to force a crisis. In reality, a purposivist would argue the Committee Report (4 tokens) outweighs the Sponsor Statement (4 tokens), but the pricing makes them feel mutually exclusive.

  **Your Response:**
  *"You are correct. I priced the record to simulate scarcity, not truth. In the real world, the 'cost' of legislative history isn't tokens; it's time, ambiguity, and the risk of cherry-picking. The exercise wasn't designed to prove Textualism wins. It was designed to show that **methodology is often a reaction to resource constraints.** When you can't afford the history, the text is all you have. When you have the history, it fights itself. The question isn't which method is true, but which method survives the messiness of the record."*

  ---

  ## VI. Limitations: What This Exercise Cannot Reproduce

  You must supply these verbally during the debrief, as the mechanics cannot capture them:

  1.  **Political Accountability:** Real legislators vote knowing they will be judged by voters. In this exercise, the "Legislators" (Envelope 1) are abstract. Real judges worry about reversal; here, they only worry about points.
  2.  **The "Long Game":** Real counsel might lose a case to preserve a precedent for a better client later. Here, students maximize immediate points.
  3.  **Institutional Competence:** The exercise implies the Court *can* fix the Schedule A error. In reality, a court might say, "That's for the Legislature to fix," regardless of the Memo.
  4.  **The Stakes:** No one is actually losing their livelihood (the Tour Operator) or mobility (the Gardener). The emotional weight of "Justice" is simulated by points, which is a poor substitute.

  ## VII. Instructor's Script for the "Market Open" (Minute 10)
  *"Clerks, you are now open for business. Counsel, you have 10 tokens. Spend them wisely. Once the Market closes at Minute 30, no new information may enter the courtroom. If you do not buy the document, you may not cite it, and you may not know its contents. Go."*

  *(Wait for the rush. Enforce the Memo limit strictly.)*
