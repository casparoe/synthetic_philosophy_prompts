answer: |-
  You have put your finger on a genuine gap in the philosophy of explanation. You are describing a property where the *explanatory force* is not a function of the informational content (the propositions) but of the *temporal sequence of epistemic updates* required to process that content.

  The standard distinction between "narrative" and "covering law" fails here because both the chapter and the paragraph are propositional accounts of causal chains. The difference is not *what* is said, but *when* the reader is allowed to know it relative to the closure of possibilities.

  Here are the three nearest established concepts, why they miss the mark, and a proposed coinage that fits your boundary cases.

  ### 1. The Nearest Established Concepts

  **A. Collingwood's "Re-enactment of Past Thought"**
  *   **The Concept:** R.G. Collingwood argued that historical explanation requires the historian to re-think the past agent's thought in their own mind. You explain a decision by reconstructing the situation as the agent saw it.
  *   **Why it's close:** It captures the idea that understanding requires occupying a specific cognitive state (the agent's ignorance/uncertainty).
  *   **Why it misses:** Collingwood focuses on the *historian's* relationship to the *agent*. Your problem is the *reader's* relationship to the *text*. A reader can know the outcome (the collapse happened) and still fail to understand it if the text doesn't force them to traverse the uncertainty. Collingwood doesn't account for the *pedagogy of the text itself*.

  **B. Van Fraassen's "Contrastive Explanation"**
  *   **The Concept:** Bas van Fraassen argued that explanation is triadic: A explains P *rather than* Q. To explain why the bridge collapsed (P), you must address why it didn't stand (Q).
  *   **Why it's close:** Your description ("alternatives to that step had just been closed off") is purely contrastive. The chapter keeps the contrast class (the alternatives) alive; the paragraph collapses it.
  *   **Why it misses:** Van Fraassen's model is static. It analyzes the logical structure of the question/answer pair. It does not account for the *temporal management* of the contrast class. A paragraph can state "P rather than Q" accurately without making the reader feel the weight of Q. Your phenomenon requires the *live experience* of Q being a possibility before it is eliminated.

  **C. Peircean "Abduction" (Inference to the Best Explanation)**
  *   **The Concept:** Charles Sanders Peirce distinguished abduction (generating a hypothesis) from deduction and induction. It is the logic of discovery.
  *   **Why it's close:** The chapter guides the reader through an abductive process—ruling out bad hypotheses until one remains.
  *   **Why it misses:** Abduction is typically framed as a *discovery* mechanism (how the historian found the truth), not a *communication* mechanism (how the reader grasps it). You are describing a scenario where the discovery is already made, but the *re-tracing of the abductive path* is necessary for the explanation to land.

  ### 2. The Coinage: Dynamic Epistemic Closure

  Since existing terms focus on the agent (Collingwood), the logic (Van Fraassen), or the discovery (Peirce), none capture the *reader's temporal epistemic state*. I propose the term **Dynamic Epistemic Closure**.

  **Definition:**
  An explanation possesses *Dynamic Epistemic Closure* if its explanatory force depends on the reader traversing a sequence of information states wherein counterfactual possibilities are sequentially eliminated in real-time. The explanation fails if the sequence is compressed because the *explanatory work* is performed by the *update event* (the closing of the door), not the *final state* (the door being closed).

  **Key Criteria:**
  1.  **Propositional Equivalence:** The summary and the full account contain the same truth-claims.
  2.  **Epistemic Asymmetry:** The summary places the reader in the final epistemic state (knowing the outcome) immediately. The full account moves the reader through intermediate states (not knowing the outcome).
  3.  **Modal Weight:** The reader must experience the alternatives as *live possibilities* at the moment they are eliminated. If the alternatives are presented as already-dead (as in the summary), the causal pressure is lost.

  ### 3. Boundary Case Testing

  You asked if this property holds for four other domains. Here is the diagnosis based on Dynamic Epistemic Closure.

  **A. A Proof in Mathematics**
  *   **Verdict:** **YES.**
  *   **Analysis:** The theorem statement is the "paragraph." The proof is the "chapter." A compressed summary of a proof ("We assume contradiction, derive X, therefore true") is propositionally accurate but explains nothing to a student who cannot see *why* the contradiction arises. The explanatory force of a proof lies in the *step-by-step necessity*. If you skip steps, the necessity feels like magic. The reader must feel that at Step 3, Option B was possible, but Step 4 closed it off.
  *   **Boundary:** A "proof sketch" in a journal functions like your jacket copy: it explains only to those who can mentally reconstruct the closure (i.e., those who have effectively read the chapter).

  **B. A Well-Made Diagram**
  *   **Verdict:** **NO.**
  *   **Analysis:** A static diagram is spatial, not temporal. It presents all relationships simultaneously. It is the epitome of the "paragraph." It shows the structure but not the *process of determination*.
  *   **Exception:** An *animated* diagram or a "build-up" slide deck that reveals layers sequentially *does* possess Dynamic Epistemic Closure. The static image itself does not.

  **C. A Mechanism Description in Biology**
  *   **Verdict:** **YES (Conditional).**
  *   **Analysis:** If the mechanism is a static pathway map (e.g., "Protein A binds to B"), it lacks the property (like the diagram). However, if the explanation is dynamic (e.g., "Signal X arrives, which *could* trigger Y or Z, but due to inhibition W, only Y occurs..."), it requires Dynamic Epistemic Closure.
  *   **Boundary:** Systems biology often fails here. A map of a gene regulatory network is accurate but often explains nothing. A narrative of the *cell's decision process* (which options were chemically available vs. blocked) explains.

  **D. A Detective Novel**
  *   **Verdict:** **YES.**
  *   **Analysis:** This is the purest example. The solution (the paragraph) is a list of facts: "The butler did it with the candlestick." This explains nothing. The novel (the chapter) works by placing the reader in a state of ignorance and systematically eliminating suspects.
  *   **Nuance:** If you read the last page first, the book loses its explanatory power regarding *guilt*, even though the propositional content is identical. The "explanation" of the crime is not the identity of the killer, but the *elimination of the innocent*.

  ### 4. Why This Matters for Your Seminar

  The reason your seminar partners are talking past you is that they are debating the *ontology* of history (is it a law or a story?), while you are identifying a *cognitive constraint* on understanding.

  You are arguing that historical explanation is **indexical to the reader's ignorance.**

  If you need to introduce this in week nine, frame it this way:
  *"We are treating explanation as a product (a set of true propositions). I am suggesting explanation is a procedure (a managed update of epistemic states). A summary fails not because it lacks truth, but because it lacks the **temporal friction** of possibility closure."*

  This distinguishes you from the "narrative" camp (who focus on plot/emplotment) and the "law" camp (who focus on generalization). You are focusing on the **epistemic kinetics** of the reader.

  **Recommended Reading to Arm Yourself:**
  *   **David Velleman, "The Story of a Life":** He argues narrative creates "emotional intelligibility." You can adapt this to "epistemic intelligibility" while rejecting the emotional requirement.
  *   **Dynamic Epistemic Logic (van Benthem et al.):** This is formal logic, but it provides the vocabulary for "information updates" changing "possible worlds." It validates your intuition that *when* information is received changes *what* is possible.
  *   **Michael Strevens, "Depth: An Account of Scientific Explanation":** Look for his discussion on "causal bottlenecks." It aligns with your "narrowing" intuition.

  You haven't found something trivial. You've found the difference between a **map** (the paragraph) and a **guide** (the chapter). A map shows you where the walls are. A guide walks you down the corridor so you feel the walls narrowing. Both contain the same spatial data; only one explains the confinement.
