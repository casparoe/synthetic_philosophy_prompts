answer: |-
  The single most important change is to cease averaging conflicting estimates and instead record the full range of credible probabilities as your official advice.

  ### Reasoning and Theoretical Basis
  You are encountering the core problem of *epistemic uncertainty* (lack of knowledge) masquerading as *aleatory uncertainty* (randomness). Formal literature on imprecise probabilities (e.g., Walley, Seidenfeld) dictates that when models conflict or data is sparse, belief should be represented as a set of distributions, not a single curve. Averaging conflicting models (e.g., the agency map vs. the retired hydrologist) creates a false precision known as "probabilistic dilation" in reverse; typically, adding conflicting evidence should *widen* your interval, not narrow it. By reporting a range $[L, U]$, you preserve the truth of the disagreement. For decision-making, we use *Interval Dominance*: if the worst-case benefit of Option A exceeds the best-case benefit of Option B, choose A; if the intervals overlap, the decision is not technical but values-based.

  ### The Calderwick Protocol (45-Minute Procedure)

  **Materials:** Whiteboard, marker, printed copies of the four data sources (gauge, consultancy, hydrologist, agency), timer.
  **Participants:** Minimum 3 volunteers (including Secretary).

  #### Phase 1: Evidence Collection (10 Minutes)
  1.  List every available probability estimate for the hazard in question.
  2.  Discard any estimate that cannot be traced to a source (hearsay).
  3.  **Record the Minimum Credible Value ($L$)** and **Maximum Credible Value ($U$)** from the remaining sources.
      *   *Note:* Do not average. $L$ is the lowest defensible number; $U$ is the highest defensible number.
      *   **[JUDGEMENT CALL]:** Deciding whether a source is "credible" or "defensible." This is not math; it is trust in expertise.
  4.  **Check for Dilation:** Did adding the newest evidence make the gap between $L$ and $U$ wider than before?
      *   If **Yes**: Record "Dilation Observed." This indicates fundamental model disagreement, not just noise.
      *   If **No**: Proceed.

  #### Phase 2: Uncertainty Classification (10 Minutes)
  Determine why the gap exists. You must tick one box.
  *   **Box A (Data Scarcity):** The models agree, but the record (e.g., 22 years) is too short to be sure.
      *   *Response:* Widen the interval symmetrically by 50% to account for sampling error.
  *   **Box B (Model Disagreement):** The models disagree (e.g., culvert omitted vs. included).
      *   *Response:* Do **not** narrow the interval. Keep the full range from Phase 1.
      *   **[JUDGEMENT CALL]:** Assigning the cause to Data vs. Model. This dictates whether you penalize the range (Box A) or preserve the conflict (Box B).

  #### Phase 3: Decision Rule Application (15 Minutes)
  Apply the rule relevant to the question type.

  *   **For Funding Requests (Cost-Benefit):**
      1.  Calculate Expected Loss Lower Bound ($E_L$) = $L \times \text{Damage Cost}$.
      2.  Calculate Expected Loss Upper Bound ($E_U$) = $U \times \text{Damage Cost}$.
      3.  Compare to Mitigation Cost ($C$).
      4.  **Rule:**
          *   If $E_L > C$: **Recommend Funding.** (Robust case).
          *   If $E_U < C$: **Do Not Recommend.** (Robust rejection).
          *   If $E_L < C < E_U$: **Refer to Parish Council.** (Values decision: is safety worth the premium?).
          *   **[JUDGEMENT CALL]:** Estimating "Damage Cost." This is often guesswork and drives the result more than probability.

  *   **For Planning Objections (Risk Increase):**
      1.  Identify the Acceptable Risk Threshold ($T$) (e.g., "no increase in peak flow").
      2.  Compare Developer's Estimate ($D$) vs. Group's Upper Bound ($U$).
      3.  **Rule:**
          *   If $U > T$: **Object.** (Precautionary principle).
          *   If $U \leq T$: **No Objection on Flood Grounds.**

  *   **For Individual Queries:**
      1.  **Rule:** If the request requires property-level hydraulic modelling not held by the group, **Refuse.**
      2.  **[JUDGEMENT CALL]:** Determining if the group's data resolution supports the query.

  #### Phase 4: Reporting and Conversion (10 Minutes)
  1.  **The Decimal:** For any form requiring a single "Annual Probability," enter **$U$ (The Upper Bound)**.
      *   *Reasoning:* In public safety, the cost of underestimation (flooding) outweighs the cost of overestimation (unused funds).
      *   **[JUDGEMENT CALL]:** Accepting the ethical burden of presenting the worst-case as the "figure."
  2.  **The Cover Letter:** Attach the mandatory sentence below.
  3.  **Minutes Record:** Record "$L$, $U$, Uncertainty Type (A/B), Decision Rule Outcome."

  ***

  ### Application to Current Matters

  #### 1. £12,000 Resistance Measures (6 Homes)
  *   **Inputs:** Cost (£12k). Assume average flood damage per home is £20k (Total £120k).
  *   **Phase 1:** Sources suggest annual probability range $[0.01, 0.04]$ (1 in 100 to 1 in 25).
  *   **Phase 2:** Box B (Model Disagreement). Range stays $[0.01, 0.04]$.
  *   **Phase 3 (Funding):**
      *   $E_L = 0.01 \times £120,000 = £1,200$ per year.
      *   $E_U = 0.04 \times £120,000 = £4,800$ per year.
      *   To justify £12k spend, we usually look for a payback period or benefit-cost ratio > 1 over a specific timeframe (e.g., 10 years).
      *   10-year Expected Loss Lower: £12,000. 10-year Expected Loss Upper: £48,000.
      *   Comparison: Cost (£12k) vs Loss Lower (£12k).
      *   **Outcome:** Since $E_L \approx Cost$ (over 10 years), this falls into the **Refer to Parish Council** category. The lower bound barely justifies the spend; the upper bound strongly does.
      *   **Procedure Verdict:** **We cannot recommend this solely on probability grounds.** It is a values decision. The Council must decide if the "peace of mind" (the gap between £12k and £48k) is worth public money.
      *   *Note:* You wanted this funded. The procedure protects you from being accused of bias by showing the math doesn't robustly support it without a value judgement on safety.

  #### 2. Objection to 40 Houses Upstream
  *   **Inputs:** Developer says $\Delta \text{Flow} \approx 0$. Hydrologist says Culvert Omitted (implies $\Delta \text{Flow} > 0$).
  *   **Phase 1:** Range of impact $[0\%, 15\%]$ (Hydrologist's estimate of surcharge).
  *   **Phase 2:** Box B (Model Disagreement). Dilation Observed (new info widened range from "unknown" to "0-15%").
  *   **Phase 3 (Planning):**
      *   Threshold $T$: "No increase in flood risk."
      *   Group Upper Bound $U$: 15% increase.
      *   **Outcome:** $U > T$.
      *   **Procedure Verdict:** **Object.** The existence of a credible model showing increased risk triggers the precautionary principle. The burden of proof is on the developer to resolve the model disagreement (Box B), not on you to disprove their model.

  #### 3. Resident's Request (Specific House Chance)
  *   **Inputs:** Request for $P(\text{Flood} | \text{House X})$.
  *   **Phase 1:** Group holds parish-level gauge data and agency map (resolution 1:50,000).
  *   **Phase 3 (Individual):**
      *   Does data support property-level resolution? **No.**
      *   **Procedure Verdict:** **Refuse.**
      *   **Letter Text:** "The Calderwick Flood Action Group assesses parish-level hazard trends using imprecise probability intervals. We do not possess the hydraulic modelling resolution required to estimate risk for individual properties, and providing such a figure would be misleading. We advise you to consult the National Flood Risk Assessment for property-specific data."

  ***

  ### Mandatory Cover Letter Sentence for Grant Forms
  > "The figure provided represents the upper bound of a credible probability interval $[L, U]$; this conservative estimate is submitted to ensure public safety margins are met, reflecting unresolved model disagreement regarding catchment hydrology."

  ### Marked Judgement Calls
  1.  **Credibility Assessment (Phase 1):** Deciding which experts to trust is subjective.
  2.  **Uncertainty Classification (Phase 2):** Distinguishing data scarcity from model conflict is interpretive.
  3.  **Damage Cost Estimation (Phase 3):** This variable often dictates the funding decision more than the probability itself.
  4.  **Upper Bound Selection (Phase 4):** Choosing safety over statistical centrality is an ethical stance, not a mathematical necessity.

  ### Limitations and Prohibited Uses
  **What this procedure cannot do:**
  1.  **Predict Black Swans:** It cannot account for climate change shifts outside historical records (non-stationarity).
  2.  **Guarantee Safety:** A recommendation to fund does not guarantee homes will not flood.
  3.  **Replace Statutory Authority:** You are advisors. The County and Parish Council hold the legal liability.

  **Uses to which it must never be put:**
  1.  **Legal Defense:** Do not use these minutes to defend against negligence claims; they explicitly acknowledge uncertainty.
  2.  **Property Valuation:** Do not allow these figures to be used by estate agents or insurers to adjust property prices; the intervals are too wide for financial pricing.
  3.  **Individual Assurance:** Never use the parish range to tell a specific resident they are "safe"; local topography may invalidate the parish average.
