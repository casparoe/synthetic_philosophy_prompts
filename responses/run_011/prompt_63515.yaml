  *   The speech must not explain the panels, as Isotype demands immediate visual comprehension.
  *   The speaker must use words to validate a system intended to assist, not replace, verbal language.
  *   The address must not infer causation from correlation, respecting the method's statistical humility.
  *   Conflict: Praising visual silence with spoken words risks undermining the very medium being honored.

  Welcome. Half of you know why a man counts as one icon, not a giant man. The other half knows why the wine is chilled. We are here for [Curator's Name].

  For thirty years, she has translated suffering into symbols. Her final panel tracks tuberculosis across our neighborhoods over three decades. It is stark. It is beautiful. It follows the strict rules: no scaled symbols, no pie charts, no false precision. Just repeated signs of human life. Each icon is a neighbor. Each row is a year.

  I write novels. I live in clauses. You might expect me to say words divide where pictures unite. I will not. Otto Neurath did not design pictures to silence words, but to help them. He called it a "helping language." A chart stands on its own, but never alone. It needs us to speak around it. It invites conversation, not silence. This is why I am here. Not to explain, but to witness.

  Here is the truth these panels offer: they show what *is*. They do not show what *is not*. This panel reveals where people died. It does not reveal why they died. It cannot show the lives saved by the policies your friend argued for. It cannot distinguish connection from cause. It shows the wound, not the weapon.

  This is not a failure. It is an honesty. By refusing to pretend knowledge it does not possess, the method forces us to supply the context. The picture holds the fact; we must hold the responsibility. We must ask the hard questions the charts cannot answer.

  [Curator's Name] has given us the evidence without the excuse. She leaves us with the questions that matter. She is retiring, but the work remains. Her career was a bridge between data and democracy. She taught us that clarity is a form of care. I have seen her refuse the easy distortion for the hard truth.

  Look at the icons. Count the loss. Then, please, use your words to finish what she started.

  I am 85% confident in this account. My least sure point is whether Neurath explicitly framed the inability to show counterfactuals as a virtue rather than a limitation. I have taken a liberty by attributing the "what is not" philosophical hinge directly to the method's intent, whereas Neurath focused more on accessibility than epistemic humility regarding causation.
