          *   *Choice:* **Integrated Risk Score.** We need to account for uncertainty (precautionary principle) without stalling progress. A "maybe sentient" larva subjected to "high pain" gets a high score. A "definitely sentient" adult subjected to "minor inconvenience" gets a lower score.
