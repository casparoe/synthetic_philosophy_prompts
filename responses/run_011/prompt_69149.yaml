answer: |-
  ### Conceptual Foundations

  Before we can build a tool that survives a Tuesday morning meeting, we must settle three philosophical debts. If we leave these unresolved, the spreadsheet will lie to us.

  **1. The Unit of Assessment: Life Stage, Not Species**
  We cannot assign moral status to *Tenebrio molitor* as a monolith. A larva is a feeding reflex arc; an adult beetle is a dispersing, mating agent. The evidence for sentience differs radically between them. If we score the species, we will either over-protect the larvae (wasting capital on reflexes) or under-protect the adults (ignoring complex distress).
  *Decision:* We assess the **Biological System at the Specific Life Stage** involved in the proposal. A proposal affecting breeding adults is scored separately from one affecting processing larvae.
  *Cost of Alternative:* If we treat them as one, we will inevitably misallocate the €250k authority. We might fund enrichment for larvae (low capacity) while neglecting humane killing for adults (high capacity), creating the exact inconsistency our competitor will exploit.

  **2. The Metric: Aggregate Risk, Not Individual Rights**
  We process billions. A binary "rights" framework breaks at this scale. If every larva has a "right" not to be harmed, we cease operations. If they have no rights, we ignore suffering. We need a utilitarian calculus that respects uncertainty.
  *Decision:* The core output is an **Aggregate Welfare Risk Score (AWRS)**. This is calculated as: *(Probability of Sentience × Severity of Impact) × Number of Individuals Affected*.
  *Cost of Alternative:* If we ignore scale, we will prioritize expensive interventions for small groups (e.g., breeding colonies) while ignoring cheap, high-impact changes for the main crop (e.g., density limits). This violates the "trivial harm × billions" constraint you identified.

  **3. The Precautionary Direction: Weighted Uncertainty**
  When evidence is thin (as with larvae), do we assume they feel nothing or everything? Assuming nothing risks moral catastrophe; assuming everything risks bankruptcy.
  *Decision:* We use a **Precautionary Weighting**. Uncertainty does not default to zero; it defaults to the *midpoint of the plausible range*, shifted upward if the potential harm is severe (e.g., death vs. inconvenience). However, this weight is explicitly labeled as a "Judgment Factor" that the committee must renew annually.
  *Cost of Alternative:* If we hard-code precaution as absolute (assume sentient until proven otherwise), the process engineer will stop engaging with the committee because the answers become theological rather than operational. We need numbers they can argue with.

  ***

  ### The Instrument: Aggregate Welfare Risk Assessment (AWRA)

  **Purpose:** To convert biological proposals into a comparable risk score for committee decision-making.
  **Time Required:** 90 minutes (60 min pre-reading, 30 min scoring/discussion).
  **Operator:** Any committee member with a biology degree.

  #### Part 1: The Sequence of Questions

  **Step 1: Define the Biological System**
  *   **Question:** What specific organism and life stage is affected?
  *   **Sufficient Answer:** Species + Life Stage + Rearing Context (e.g., *Hermetia illucens*, 5th Instar Larva, High-Density Tray).
  *   **Insufficient Answer:** "Insects," "The larvae," "The biomass."
  *   **Unknown:** If the proposal affects multiple stages (e.g., a climate change affecting growth to metamorphosis), split the proposal into two assessments.
  *   **Stop Rule:** If the system is abiotic (cell culture, AI, machinery), proceed to Step 2 but cap Capacity Score at 0.

  **Step 2: Assess Capacity for Valenced Experience (Sentience Proxy)**
  *   **Question:** What is the probability this system can experience negative states (pain, distress, frustration)?
  *   **Evidence Markers (Weighted):**
      1.  *Nociception only:* Low weight (Reflexive).
      2.  *Conditioned Avoidance:* Medium weight (Associative).
      3.  *Motivational Trade-off:* High weight (Willing to sacrifice food/safety to avoid stimulus).
      4.  *Self-Medication/Wound Care:* Very High weight (Integrated state management).
  *   **Scoring:**
      *   0.0: No nervous system / Abiotic.
      *   0.1 – 0.3: Nociception only, no central integration evidence.
      *   0.4 – 0.6: Associative learning present, trade-offs unclear.
      *   0.7 – 1.0: Complex trade-offs, analgesic seeking, or vertebrate-equivalent evidence.
  *   **Unknown:** If literature is absent, assign 0.5. Record "Evidence Gap" in notes.
  *   **Note for Larvae:** For BSFL/Mealworm larvae, markers 3 and 4 are effectively unavailable in current literature. Do not score above 0.4 unless new internal data exists.

  **Step 3: Assess Severity of Intervention**
  *   **Question:** What is the intensity and duration of the negative experience caused or prevented by this proposal?
  *   **Scale:**
      *   1 (Negligible): Minor handling, transient disturbance.
      *   2 (Moderate): Hunger, crowding, sub-lethal stress.
      *   3 (Severe): Painful killing, prolonged deprivation, mutilation.
      *   4 (Existential): Death (only score if killing method is inhumane; humane killing scores 0).
  *   **Unknown:** Assume the higher severity of the two plausible options.
  *   **Stop Rule:** If the proposal is purely mechanical (e.g., "change sieve mesh size") and Step 1 Capacity is <0.2, the AWRS is 0. Stop. Log as "Process Change Only."

  **Step 4: Apply the Scale Multiplier**
  *   **Question:** How many individuals are affected per annum?
  *   **Calculation:** Enter raw number. The system will apply a logarithmic cap to prevent single proposals from dominating the budget purely on volume, but linear scaling applies within tiers.
  *   **Tiers:**
      *   < 100,000 (Breeding/Research): Multiplier 1x
      *   100,000 – 10 Million (Pilot): Multiplier 10x
      *   > 10 Million (Industrial): Multiplier 100x
  *   **Unknown:** Use conservative production estimates.

  **Step 5: Calculate Aggregate Welfare Risk Score (AWRS)**
  *   **Formula:** `(Capacity Score × Severity Score) × Scale Multiplier = AWRS`
  *   **Interpretation:**
      *   0 – 50: Low Priority. Monitor only.
      *   51 – 200: Medium Priority. Justifies operational changes <€50k.
      *   201 – 1000: High Priority. Justifies Committee Capital Authority (€250k).
      *   > 1000: Critical Priority. Justifies Board Escalation (>€250k).

  **Step 6: The Value Boundary (Human Decision)**
  *   **Question:** Does the Cost of Implementation exceed the AWRS justification?
  *   **Procedure:** The AWRS indicates the *moral urgency*. It does not calculate ROI.
  *   **Action:**
      *   If AWRS > 1000 and Cost > €250k: Recommend to Board.
      *   If AWRS < 50 and Cost > €50k: Recommend Rejection.
      *   If AWRS is High but Cost is Prohibitive: Record "Unmitigated Risk Accepted" and require a review in 6 months.
  *   **Note:** This is where the committee votes. The procedure cannot tell you if €400k is "worth" a risk reduction. It only tells you the risk is large enough to ask the question.

  ***

  ### The Scoring Sheet (One Page Output)

  | **Proposal ID:** _______________ | **Date:** _______________ | **Proponent:** _______________ |
  | :--- | :--- | :--- |
  | **1. Biological System** | **2. Capacity Score (0.0–1.0)** | **3. Severity Score (0–4)** |
  | Species/Stage: __________________ | Evidence of Nociception: [ ] Y [ ] N [ ] U | Impact Type: __________________ |
  | Context: _______________________ | Evidence of Avoidance: [ ] Y [ ] N [ ] U | Intensity (1-4): _________ |
  | *Stop if Abiotic (Cap at 0)* | Evidence of Trade-off: [ ] Y [ ] N [ ] U | Duration (1-4): _________ |
  | | **Final Capacity (C):** _________ | **Final Severity (S):** _________ |
  | **4. Scale Multiplier** | **5. Aggregate Welfare Risk Score (AWRS)** | **6. Cost Estimate** |
  | Population Affected: ____________ | **Calculation:** (C × S) × Multiplier | Capital: €___________________ |
  | **Multiplier (M):** [ ] 1x [ ] 10x [ ] 100x | **TOTAL AWRS:** _________________ | OpEx Change: €___________________ |
  | | *Tier: [ ] Low [ ] Med [ ] High [ ] Crit* | **7. Committee Decision** |
  | **Uncertainty Flag:** [ ] Yes [ ] No | **Precaution Applied:** [ ] Yes [ ] No | [ ] Approve [ ] Reject [ ] Board |
  | *If Yes, Capacity rounded up to nearest 0.1* | | *Reason:* ____________________ |
  | **Auditor Sign-off:** _______________ | **Vet Sign-off:** _______________ | **Chair Sign-off:** _______________ |

  ***

  ### Test Cases: End-to-End Run

  #### Case 1: Electrical Stunning for BSFL Larvae
  *Proposal: Install electrical stun bath before thermal kill. Cost €400k. Throughput -5%.*

  | **Proposal ID:** 2024-BSF-01 | **Date:** Oct 24 | **Proponent:** Head of Welfare |
  | :--- | :--- | :--- |
  | **1. Biological System** | **2. Capacity Score (0.0–1.0)** | **3. Severity Score (0–4)** |
  | Species/Stage: *H. illucens*, 5th Instar | Evidence of Nociception: [X] Y [ ] N [ ] U | Impact Type: Killing Method |
  | Context: Industrial Processing | Evidence of Avoidance: [ ] Y [X] N [ ] U | Intensity (1-4): 3 (Thermal is severe) |
  | *Stop if Abiotic (Cap at 0)* | Evidence of Trade-off: [ ] Y [ ] N [X] U | Duration (1-4): 2 (Short duration) |
  | | **Final Capacity (C):** 0.4 (Uncertainty uplift) | **Final Severity (S):** 3 |
  | **4. Scale Multiplier** | **5. Aggregate Welfare Risk Score (AWRS)** | **6. Cost Estimate** |
  | Population Affected: 2 Billion/yr | **Calculation:** (0.4 × 3) × 100 | Capital: €400,000 |
  | **Multiplier (M):** [ ] 1x [ ] 10x [X] 100x | **TOTAL AWRS:** 120 | OpEx Change: -5% Throughput |
  | | *Tier: [ ] Low [X] Med [ ] High [ ] Crit* | **7. Committee Decision** |
  | **Uncertainty Flag:** [X] Yes [ ] No | **Precaution Applied:** [X] Yes [ ] No | [ ] Approve [X] Reject [ ] Board |
  | *If Yes, Capacity rounded up to nearest 0.1* | | *Reason:* AWRS 120 is Medium Priority. |
  | **Auditor Sign-off:** *Signed* | **Vet Sign-off:** *Signed* | **Chair Sign-off:** *Signed* |
  | | | *Cost exceeds Committee authority. Board unlikely to approve for Medium Tier.* |

  **Analysis:** The procedure does **not** vindicate your favored project.
  *Why?* Despite the huge scale (100x), the Capacity Score is capped at 0.4 because larvae lack evidence of trade-offs (Step 2). The Severity is high (3), but the product (1.2) multiplied by 100 yields 120. This is a "Medium Priority" score. Medium Priority justifies operational changes or spend up to €250k. This proposal costs €400k and reduces throughput. To vindicate this, you would need a Capacity Score of >0.8 (requiring evidence of complex trade-offs in larvae) or a Severity Score of 4 (proving thermal kill is torturous rather than just lethal). The procedure forces you to admit that the science isn't strong enough yet to justify this capital outlay over other needs.

  #### Case 2: Removal of Feed Deprivation
  *Proposal: Stop 12h starvation before grading. Cost €0. Process consistency risk.*

  | **Proposal ID:** 2024-BSF-02 | **Date:** Oct 24 | **Proponent:** Process Eng |
  | :--- | :--- | :--- |
  | **1. Biological System** | **2. Capacity Score (0.0–1.0)** | **3. Severity Score (0–4)** |
  | Species/Stage: *H. illucens*, 5th Instar | Evidence of Nociception: [X] Y [ ] N [ ] U | Impact Type: Hunger/Stress |
  | Context: Pre-Processing | Evidence of Avoidance: [X] Y [ ] N [ ] U | Intensity (1-4): 2 (Hunger) |
  | *Stop if Abiotic (Cap at 0)* | Evidence of Trade-off: [ ] Y [ ] N [X] U | Duration (1-4): 3 (12 Hours) |
  | | **Final Capacity (C):** 0.4 | **Final Severity (S):** 2 |
  | **4. Scale Multiplier** | **5. Aggregate Welfare Risk Score (AWRS)** | **6. Cost Estimate** |
  | Population Affected: 2 Billion/yr | **Calculation:** (0.4 × 2) × 100 | Capital: €0 |
  | **Multiplier (M):** [ ] 1x [ ] 10x [X] 100x | **TOTAL AWRS:** 80 | OpEx Change: Potential Consistency Loss |
  | | *Tier: [X] Low [ ] Med [ ] High [ ] Crit* | **7. Committee Decision** |
  | **Uncertainty Flag:** [ ] Yes [X] No | **Precaution Applied:** [ ] Yes [X] No | [X] Approve [ ] Reject [ ] Board |
  | *If Yes, Capacity rounded up to nearest 0.1* | | *Reason:* Zero capital cost. AWRS 80 justifies operational tweak. |
  | **Auditor Sign-off:** *Signed* | **Vet Sign-off:** *Signed* | **Chair Sign-off:** *Signed* |
  | | | *Risk to product quality noted as acceptable trade-off.* |

  **Analysis:** This scores lower than the stunning (80 vs 120) but gets approved. Why? Because the Cost is zero. The procedure separates *Risk* from *Budget*. The AWRS says "This matters," the Budget says "We can afford to fix this." This confirms your suspicion: the "boring" change wins because it is cheap, not because the welfare math is vastly different. This is correct. Welfare is about harm reduction per euro spent.

  #### Case 3: AI Climate Controller "Preference"
  *Proposal: Log AI "preference satisfaction" as a welfare metric. Cost: Dev time.*

  | **Proposal ID:** 2024-AI-03 | **Date:** Oct 24 | **Proponent:** Junior Data Sci |
  | :--- | :--- | :--- |
