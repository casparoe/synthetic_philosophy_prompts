  **Analysis:** The machinery handles this without a special exemption. Step 1 identifies it as abiotic. Step 2 caps Capacity at 0. The AWRS is 0. The procedure successfully identifies that "preference satisfaction" in code is not a welfare quantity. It saves the committee from wasting time on anthropomorphism.

  ***

  ### What This Procedure Cannot Do

  **1. It Cannot Resolve Scientific Disagreement**
  If the Vet insists larvae feel pain like mammals (Capacity 0.9) and the Process Engineer insists they are automatons (Capacity 0.1), the procedure averages them or defaults to the precautionary midpoint (0.5). It does not solve the biology. It forces the disagreement into a number so the budget decision can proceed. A motivated manager can game this by lobbying the Vet to lower the Capacity Score before the meeting. *Mitigation:* The Capacity Score must be reviewed annually against external literature, not internal opinion.

  **2. It Systematically Misjudges "Dignity" Harms**
  The procedure weights pain and distress (negative experience). It does not weight "naturalness" or "dignity." If the certification body later demands that insects be allowed to express "natural behaviors" that reduce efficiency but do not reduce pain (e.g., lower density for mating rituals in larvae that don't mate), the AWRS will score this as Low Priority (Capacity for frustration is low in larvae). You will need a separate "Brand/Marketing Risk" assessment for those cases. Do not try to force them into this welfare sheet.

  **3. It Vulnerable to "Scale Gaming"**
  A manager could split a large proposal into ten smaller ones to keep them under the €250k Committee authority, even if the Aggregate Risk is high. *Mitigation:* The Auditor must check for "Fragmented Proposals" affecting the same Biological System within a 12-month window.

  **4. It Cannot Justify Bankruptcy**
  The procedure might generate a "Critical Priority" score (>1000) for a change that costs €10M. The procedure says "Do it." The Board says "We can't." This creates an audit trail of "Unmitigated Risk Accepted." This is a feature, not a bug. It protects you personally by documenting that the welfare need was identified, even if capital wasn't available.

  **5. The "Unknown" Trap**
  If we mark too many answers as "Unknown," the Precautionary Uplift inflates every score, making everything a High Priority. This creates alert fatigue. *Mitigation:* Limit the "Unknown" flag to one per proposal. Force the proponent to find *one* solid piece of evidence for Capacity before the meeting.

  **Final Warning:** This tool makes your trade-offs visible. If you approve the Feed Deprivation removal (Case 2) but reject the Electrical Stunning (Case 1), a competitor can point to the scores and say, "You admitted the Stunning Risk was higher (120 vs 80), but you fixed the cheap one first." Your defense is not the science; it is the fiduciary duty. The procedure documents the Welfare Need; the Board documents the Financial Constraint. Keep those two pages separate in the audit folder.
