answer: |-
  The argument your friend constructed is a sophisticated piece of philosophical jiu-jitsu. It attempts to use the weight of realism to throw realism itself. It is logically **valid**—the conclusion follows from the premises—but it is **unsound**. The break lies in the move from internal consistency to external immunity.

  Here is the diagnosis of the break, the cost of repairing it, the ranking of the premises, and the dissection of the astrologer exchange.

  ### 1. The Break: Step (5) and the Generalization

  The fatal flaw is in **Step (5)** and the **Generalization** that follows it.

  Your friend argues that because Instrumentalism (1) denies descriptive realism as a criterion for object-level theories, objections based on descriptive realism are inadmissible against Instrumentalism itself. He claims that self-application grants immunity.

  **Why this fails:**
  This conflates *consistency* with *justification*. A doctrine can be perfectly self-consistent (it applies its own rules to itself) and still be false, arbitrary, or viciously circular.
  *   **The Bootstrapping Problem:** If I propose a rule "Accept any claim written in red ink," and I justify this rule by writing the justification in red ink, I have satisfied your friend's Generalization. I have applied the criterion to itself. But I have not given you a *reason* to accept the rule. I have only shown that the rule is self-consistent.
  *   **The Performative Contradiction:** By arguing for (1), your friend is engaging in a realist activity. He is offering reasons (premises 1–6) intended to describe the *actual* relationship between methodology and success, hoping to persuade you that his description is *accurate*. If (5) were true, he shouldn't be offering reasons; he should simply be pointing to the predictive success of economics and saying, "See?" The fact that he is arguing implies he thinks the *descriptive accuracy of his argument* matters.

  **The Cost of Rejecting (5):**
  If you reject (5), you cost yourself the **immune system** of the doctrine.
  *   **You admit vulnerability:** You must concede that Instrumentalism *can* be criticized on descriptive grounds. You must allow the realist to ask: "Is it actually true that scientists don't test assumptions?"
  *   **You lose the "Stopper":** You lose the ability to dismiss realist objections as *category errors*. You have to engage with them on the merits.
  *   **But you save the doctrine from dogmatism:** The cost is high, but the alternative is worse. If you keep (5), you turn Instrumentalism into a faith-based system that cannot be distinguished from any other self-sealing ideology. Rejecting (5) allows Instrumentalism to remain a scientific hypothesis about science, which is what Friedman claimed it was.

  ### 2. Ranking the Premises (Least to Most Expensive to Surrender)

  Given your sympathies (you like (1), you accept (2), you prefer losing (6) to (1)), here is the ranking of which premise to reject, from "Cheapest" to "Most Expensive."

  1.  **The Generalization (Cheapest):** "Any doctrine D... is thereby immune."
      *   *Why:* This is plainly false. Self-consistency does not entail truth. Rejecting this costs you nothing but the rhetorical shield your friend built. It does not damage Instrumentalism itself, only this specific proof of it.
  2.  **Step (5) (Cheap):** "That objection is inadmissible."
      *   *Why:* As above. Admitting that realist objections are *admissible* does not mean they are *correct*. It just means you have to defeat them with evidence, not by rule-fiating them out of bounds.
  3.  **Step (6) (Moderate):** "Instrumentalism passes the test; Realism does not."
      *   *Why:* This is your preferred sacrifice. It is empirically vulnerable. Behavioral economics and the Lucas Critique suggest that ignoring psychological realism or institutional details *does* lead to predictive failure. If you surrender this, you must argue that Instrumentalism *would* work if applied correctly, or that it works better than the alternatives *in the long run*. It weakens the vindication but leaves the methodology intact.
  4.  **Step (3) (Expensive):** "The assumptions of (1) are themselves to be assessed solely by [predictive success]."
      *   *Why:* This denies that methodology might be a normative or philosophical inquiry distinct from empirical science. If you reject this, you admit that methodology might be judged by logical coherence or conceptual clarity, not just "which theories it produces." This opens the door to philosophical critique beyond mere utility.
  5.  **Step (1) (Most Expensive):** "Assess assumptions solely by predictions."
      *   *Why:* This is the core doctrine you wish to keep. Surrendering this abandons Friedman entirely.

  **Recommendation:** Reject the **Generalization** and **Step (5)**. This preserves (1) and (2) but prevents the argument from becoming a tautology. It forces your friend to defend Instrumentalism on the grounds that it *actually works better*, not that it *cannot be criticized*.

  ### 3. The Astrologer Exchange

  You suspected your friend answered a different question. He did. Here is the dissection.

  **The Parallel:**
  *   **Astrologer's Doctrine:** "Judge astrology only by whether its charts predict events."
  *   **Astrologer's Meta-Doctrine:** "This doctrine is a theory; judge it by whether it leads to charts that predict events."
  *   **Result:** By your friend's logic, if Astrology *had* a good predictive record, the Astrologer's methodology would be vindicated and immune to the objection "But stars don't influence personality."

  **Your Friend's Reply:**
  "The parallel fails because astrology does not pass the test in (6)." (i.e., Astrology doesn't actually predict well).

  **Why this reply fails:**
  Your friend's reply **concedes the Realist point to kill the Astrologer**, while **using the Instrumentalist point to save the Economist**.

  1.  **How he kills Astrology:** To claim Astrology fails (6), he must compare Astrology's predictions to *reality*. He must assert that the world *is not* as Astrology predicts. This requires a realist grip on the data. He is saying, "Astrology is false because its predictions do not match the facts."
  2.  **How he saves Instrumentalism:** In Step (5), he argues we *cannot* judge Instrumentalism by whether its assumptions match the facts (the "realist objection").
  3.  **The Contradiction:** He is using an external, realist standard to falsify the Astrologer's methodology (by checking its output against the world), but he denies the Realist the right to use an external, descriptive standard to falsify the Instrumentalist's methodology (by checking its assumptions against the world).

  **The Disanalogy that does the work:**
  The only available disanalogy is that Economics *actually has* the predictive success (6) while Astrology *lacks* it.
  *   **Can the Instrumentist use this?** Yes, but only if they admit that (6) is an empirical claim open to realist verification.
  *   **Can the Realist use this?** Yes. If the Realist is allowed to check whether Astrology predicts (to kill it), the Realist must be allowed to check whether Friedman's description of scientists is accurate (to challenge Instrumentalism).

  **The Damage:**
  The Astrologer parallel damages **Step (5)**. It shows that "Immunity from descriptive objection" is not a virtue of a successful methodology, but a feature of a failed one trying to protect itself.
  *   If Astrology *had* been predictively successful, your friend's argument would force us to accept the Astrologer's methodology and dismiss the objection "Stars don't cause things" as inadmissible.
  *   Since that conclusion is absurd (we would want to know *why* it worked, i.e., the mechanism/realism), the Generalization is false.
  *   Therefore, even if Economics is successful, we are still entitled to ask if Friedman's description of *why* it works is descriptively true.

  ### Summary Diagnosis

  Your friend has constructed a **self-sealing conventionalism**. He has taken Friedman's pragmatic advice ("don't worry about assumptions") and turned it into an epistemic fortress ("you are *forbidden* to worry about assumptions").

  *   **The Break:** Step (5). You cannot define admissible evidence in a way that guarantees your own victory.
  *   **The Cost:** You must allow the Realist to argue that Instrumentalism is descriptively false. You lose the "checkmate," but you keep the game playable.
  *   **The Astrologer:** Your friend's reply proves that he relies on Realism to dismiss Astrology (checking predictions against reality) while forbidding Realism to dismiss Instrumentalism (checking assumptions against reality). He is borrowing the Realist's capital to fund the Instrumentalist's bank.

  **What to say to him:**
  "Your argument proves too much. It would vindicate any methodology that produced results, regardless of how absurd its claims about the world might be. When you dismiss the Astrologer, you do so by comparing their predictions to reality. That is a realist move. If you are allowed to use reality to judge the Astrologer's output, I must be allowed to use reality to judge your description of scientific practice. You cannot have it both ways: you cannot use the world to falsify the Astrologer while forbidding me from using the world to falsify Friedman."
