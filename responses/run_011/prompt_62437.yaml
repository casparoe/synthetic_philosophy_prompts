      5.  **Astrologer:** The Friend's reply is performatively contradictory.

      *Wait, one nuance on (3).* Is it true that a methodology *must* be assessed by its own criteria? Not necessarily. We assess logic by consistency, not by whether using logic makes us rich. We assess ethics by moral intuition, not by whether being ethical makes us happy (necessarily). So (3) is also vulnerable. But (5) is the more aggressive move. I will focus on (5) as the primary break, with (3) as secondary.

      *Actually, looking closer at the Generalization:* "Any doctrine D which... applies to itself the criterion it applies to others is thereby immune..." This is clearly false. A doctrine can be self-consistent and still wrong. Consistency $\neq$ Truth. This is the fatal flaw.

