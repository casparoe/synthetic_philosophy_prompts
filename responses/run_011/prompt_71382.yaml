  ### 1. Prediction for Case 8

  **Classification:** LIE
  **Culpability Score:** 8
  **Score for the True Alternative:** 7 (if used to induce the same belief)

  **Reasoning:** The Dean asserts a proposition she believes to be false ("funding... for at least three more years") with the intention that the hearer rely on it. This fits the pattern of Cases 1, 3, 4, and 5A. The existence of the Terms of Reference (ToR) is an undisclosed institutional defeater; because the Postdoc is unaware of them, the Dean's assertion functions as a standard guarantee in the conversational context. The culpability matches Case 1 (Landlord) and Case 5A (Car Seller) because the harm is substantial (career planning vs. financial/contractual security) and the intent is deceptive. The one-point gap observed in Case 5 suggests that if the Dean had used the literally true alternative ("reallocation is not final") to induce the *same* false belief, the classification would shift to MISLEADING and the score would drop to 7.

  ### 2. Reconstructed Candidate Rules

  Here are two rules consistent with Cases 1–7 that diverge on Case 8.

  **Rule A: Doxastic Assertionism (The "Strict" View)**
  *   **Definition:** A speaker *LIES* if and only if they assert a proposition they believe to be false. Intent to deceive is irrelevant for classification (per Cases 3 & 4). A speaker *MISLEADS* if they assert a truth (or omit) intending a false inference.
  *   **Culpability:** Base score determined by harm/exploitation (0–7). If the act is classified as LIE, add +1 to the base score (per Case 5).
  *   **Prediction for Case 8:** The Dean believes the funding statement is false. Therefore: **LIE, 8**. (True Alternative: **MISLEADING, 7**).

  **Rule B: Contextual Warrant (The "Institutional" View)**
  *   **Definition:** A speaker *LIES* only if they assert a believed-false proposition *without* institutional or conversational cover that technically permits the assertion. If hidden rules (like the ToR) make the statement technically defensible despite the speaker's belief, the act is downgraded to *MISLEADING* (exploiting the gap between the rule and the hearer's understanding).
  *   **Culpability:** Tracks the usurpation of agency. Lying (breaking a warrant) is worse than Misleading (exploiting a hidden warrant).
  *   **Prediction for Case 8:** The ToR renders all figures "provisional." The Dean relies on this hidden technicality to make the statement defensible. Therefore: **MISLEADING, 7**. (True Alternative: **MISLEADING, 7**, as both rely on the same informational asymmetry).

  ### 3. Best Guess and Evidential Weight

  **Best Guess:** **Rule A (Doxastic Assertionism).**

  **Evidential Weight:** **Cases 3 and 4.**
  These cases are the keystone of her framework. In Case 3 (Patient) and Case 4 (Nurse), the speakers assert believed falsehoods but lack the intent to deceive regarding the truth-value (one wants to avoid a scene, the other wants to comfort). She codes them as LIE nonetheless. This demonstrates she rejects *intent-based* definitions of lying in favor of *norm-of-assertion* definitions.

  If she accepted Rule B (Contextual Warrant), she would have to admit that the "word on offer" depends on external rules unknown to the hearer. However, Cases 3 and 4 show she prioritizes the speaker's internal doxastic state over the pragmatic outcome or intent. It is inconsistent to argue that "intent doesn't matter for lying" (Cases 3/4) but "hidden institutional context does matter for lying" (Case 8). The cleanest fit is that she treats the assertion of believed falsehood as a binary breach of the assertion norm, regardless of technical cover. The "one-point gap" in Case 5 is her way of acknowledging the moral difference is real but secondary to the harm caused.

  ### 4. Discriminating Vignette (Case 9)

  To distinguish Rule A from Rule B after Case 8 is coded, present this scenario:

  > A tax auditor tells a filer, "This deduction is fully compliant." She believes it is not, but knows an obscure, unpublished precedent technically permits it. She intends the filer to rely on her assurance to close the audit.

  *   **Rule A Prediction:** **LIE, 8.** (She believes the statement is false in substance; the technicality is irrelevant to the classification).
  *   **Rule B Prediction:** **MISLEADING, 7.** (The unpublished precedent provides institutional cover, similar to the ToR, downgrading the breach from Lie to Mislead).

  ### 5. Kind vs. Degree and the Risk of Case 8

  **Current Pattern:** Her pattern treats the difference as one of **Kind in classification** (Lie vs. Misleading are distinct categories based on assertion vs. implication) but one of **Degree in morality** (the culpability gap is consistently one point, suggesting the moral distinction is marginal compared to harm).

  **Risk from Case 8:** Case 8 puts the **Kind** distinction at risk. If she codes Case 8 as MISLEADING (adopting Rule B), it implies the boundary between Lying and Misleading is not a binary function of belief/assertion, but a gradient dependent on contextual warrants. This would undermine the "descriptive" difference her project aims to isolate. If the definition of "Lie" shifts based on hidden institutional rules, the descriptive category becomes unstable, potentially collapsing the project's thesis that there is a stable descriptive difference to compare morally. Coding it LIE preserves the Kind distinction; coding it MISLEADING suggests the distinction is merely a matter of how well the speaker is protected by fine print.
