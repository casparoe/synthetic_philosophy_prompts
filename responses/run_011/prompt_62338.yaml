prompt: |-
  I direct the grants program of a private foundation with an annual budget of roughly fourteen million dollars and about forty-five discrete funding decisions per year, ranging from fifty thousand to two million. My staff consists of three program officers with no training in decision theory or statistics beyond the undergraduate level; each proposal receives perhaps two hours of analysis before it goes forward; and the six trustees on our program committee must sign off on every recommendation, which means the reasoning has to be followable in the room, without integrals or proofs.

  The committee has adopted a policy requiring that each recommendation be accompanied by an estimate of expected value per dollar, and that recommendations maximize it. Two opposite complaints have since accumulated. Some officers say the policy obliges them to fund longshots — a small chance of an enormous payoff alongside a near-certainty of producing almost nothing. Others say it obliges them to fund programs with a high likelihood of modest good that carry a small chance of a severe and irreversible harm. Both complaints are currently dismissed as a failure of nerve: officers, we are told, are confusing their aversion to spread with the diminishing marginal value of money. I suspect the dismissal is too quick, and that the rank-dependent, risk-weighted family of theories developed in normative decision theory over the past couple of decades — the approach Lara Buchak defends, on which a risk attitude functions as a separate parameter alongside utilities and probabilities, weighting outcomes by the probability of doing at least as well as they do — gives me the resources to tell my officers apart from themselves.

  What I want is a written decision procedure that a program officer can run on any proposal in about an hour with a spreadsheet, and that does the following.

  First, it must force the three inputs to be elicited separately and must supply tests for detecting when one has been smuggled into another: a concave utility curve used to express an aversion to spread, or distorted probability estimates used to express an aversion to a bad tail. State what counts as an acceptable answer at each elicitation step, and what an unusable answer looks like.

  Second, it must convert an officer's risk attitude into decision weights that a non-specialist can actually compute for a prospect with four to six outcomes ranked by value. Set out the computation in explicit arithmetic, and state the shape restrictions the risk function must satisfy if the resulting preferences are to be coherent, along with which direction of curvature corresponds to which attitude.

  Third, it must say what to do when likelihoods cannot be quantified beyond an ordering, and when the disagreement between officers concerns the ranking of outcomes rather than the probabilities — and it must mark clearly, at each step, whether the step is a matter of fact, a matter of value that has to be referred to the committee, or a judgment call presented in procedural clothing.

  Fourth, it must confront the objections rather than wave at them, and tell me what my procedure is thereby committed to: that the classical representation theorems make risk-aversion about utility, as distinct from about money, a violation of axioms rather than a permissible taste; that departures from expected utility expose an agent to dynamic inconsistency and money-pump arguments over sequences of choices; and that a foundation making forty-five decisions a year may face one large decision problem rather than forty-five small ones, in which case weighting each proposal individually and then summing may wash out precisely the risk-aversion the procedure was built to license. Savage's own proviso that his framework was intended for problems in which states and consequences can be fully specified — the restriction to what he called small worlds — should be engaged as part of this, not footnoted.

  Then run the procedure on three cases and report the results, showing the elicited inputs, the computation, the recommendation, and every point at which the output depends on a contestable input.

  Case one. A five-year effort to build an open-source instrument that, if it works, would change practice across an entire field: officers estimate roughly a ten percent chance of a very large effect, twenty-five percent of a modest effect, and sixty-five percent of near-zero effect. It is the largest request of the year, would consume about a sixth of the annual budget, and our founder is enthusiastic about it.

  Case two. An expansion of an established, well-evaluated program we already fund, whose incremental effect has been measured in prior rounds: roughly eighty-five percent chance of a solid but modest improvement, fifteen percent chance that part of the money is lost to administrative failure, no catastrophic downside.

  Case three. A pilot of a community health intervention in a region where trust in outside organizations is fragile: high probability of substantial benefit, but about a five percent chance of a serious adverse event that would end comparable work in the region for a generation and would be publicly attributed to this foundation. The officer recommends against; the committee is inclined to fund.

  At least one of these three should come out in a way I will not like, and if the procedure delivers a verdict that merely ratifies my officers' existing intuitions in all three cases, tell me why that is a sign the procedure is not doing any work.

  Finally, state what the procedure cannot do: the classes of decision it should not be applied to, the ways an officer who wants a predetermined answer can game the elicitation steps, and what I should tell the committee about whether the expected-value policy needs amending or merely interpreting. Do not give me a bibliography or citations — I will supply those myself — and do not present the instrument as validated. Wherever a step rests on a stipulation rather than a result, label it as such.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User:** Director of a private foundation grants program.
      *   **Context:** \$14M budget, ~45 decisions/year, grants \$50k-\$2M. Staff: 3 program officers (undergrad stats/decision theory). Process: ~2 hours analysis/proposal. Oversight: 6 trustees (need followable reasoning, no integrals/proofs).
      *   **Current Policy:** Maximize Expected Value (EV) per dollar.
      *   **Problem:** Officers complain EV forces funding longshots (high variance, low prob success) or risky programs (high prob good, small prob catastrophic harm). Trustees dismiss this as confusion between risk aversion and diminishing marginal utility.
      *   **User's Hypothesis:** Risk-weighted expected utility (RWEU) / Rank-Dependent Utility (RDU) theories (e.g., Lara Buchak) offer a better framework where risk attitude is a separate parameter from utility.
      *   **Deliverable:** A written decision procedure (spreadsheet-friendly, ~1 hour execution) incorporating RWEU/RDU principles.
      *   **Requirements:**
          1.  Separate elicitation of inputs (Utility, Probability, Risk Function) with tests for smuggling.
          2.  Explicit arithmetic for decision weights (4-6 outcomes), shape restrictions on the risk function.
          3.  Handling qualitative likelihoods and ranking disagreements (Fact vs. Value vs. Judgment).
          4.  Confront objections (axioms, dynamic inconsistency, portfolio effect vs. single decisions, Savage's "small worlds").
          5.  Run on three specific cases (Open-source instrument, Program expansion, Community health pilot). At least one result must be counter-intuitive/unliked to show the procedure works.
          6.  Limitations (gaming, inappropriate classes, policy amendment advice).
          7.  No bibliography/citations. Label stipulations.

  2.  **Deconstruct the Theoretical Framework (RWEU/RDU):**

      *   *Standard EU:* $V = \sum p_i u(x_i)$. Risk aversion is entirely in the curvature of $u$.
      *   *Risk-Weighted EU (Buchak):* $V = \sum [r(\sum_{j=i}^n p_j) - r(\sum_{j=i+1}^n p_j)] u(x_i)$. Here, $r$ is the risk function.
      *   *Simplification for Spreadsheet:* We need a way to calculate "decision weights" without integrals.
      *   *Outcomes:* Must be ranked from worst to best (or best to worst). Let's use Worst ($x_1$) to Best ($x_n$).
      *   *Weights:* The weight on outcome $i$ depends on the cumulative probability of getting *at least* that good.
      *   *Risk Function $r(p)$:* Maps $[0,1] \to [0,1]$. $r(0)=0, r(1)=1$.
          *   Linear ($r(p)=p$): Risk neutral (reverts to EU).
          *   Concave ($r(p) < p$ for $p \in (0,1)$): Risk averse (downweights high probabilities of good outcomes, upweights certainty of bad outcomes? Wait, need to check Buchak's specific formulation).
          *   *Correction on Buchak:* Buchak's risk function $r$ applies to the cumulative probability of receiving *at least* $x$.
          *   If $r$ is convex: Risk-seeking (overweighting small probabilities of best outcomes).
          *   If $r$ is concave: Risk-averse (underweighting small probabilities of best outcomes, prioritizing security).
          *   *Wait, let's verify the "Longshot" complaint:* Officers say EV forces funding longshots. EV is risk-neutral. To *avoid* longshots, we need risk aversion. To avoid longshots, we downweight the small probability of the huge payoff.
          *   *Wait, let's verify the "Catastrophe" complaint:* Officers say EV forces funding risky programs with small chance of harm. EV averages the harm. To avoid the tail risk, we need to upweight the probability of the bad outcome relative to its statistical frequency.
          *   *RDU Mechanics:* In RDU, weights are $w_i = r(P(X \ge x_i)) - r(P(X \ge x_{i+1}))$.
          *   If $r$ is concave (risk averse): It compresses high probabilities. The weight on the *best* outcome (low cumulative prob) gets shrunk. The weight on the *worst* outcome (cumulative prob near 1) gets expanded relative to linear.
          *   *Actually, let's stick to the prompt's specific reference:* "weighting outcomes by the probability of doing at least as well as they do." This is the standard RDU/Buchak setup.
          *   *Risk Aversion:* Concave $r$. Downweights the "hope" (top outcomes), upweights the "security" (bottom outcomes).
          *   *Risk Seeking:* Convex $r$. Upweights the "hope".

  3.  **Drafting the Procedure - Section by Section:**

      *   **Title:** Needs to sound official but accessible. "Risk-Weighted Grant Assessment Protocol."
      *   **Part 1: Input Elicitation & Anti-Smuggling Tests.**
          *   Need to separate Utility (value of outcome), Probability (likelihood), Risk Attitude (weighting).
          *   *Utility:* Ask about certainty equivalents for *sure* things. If they vary based on risk, they are smuggling risk into utility.
          *   *Probability:* Ask for frequency data or reference classes. If they adjust based on "how bad it would be," they are smuggling utility/risk into probability.
          *   *Risk:* Ask about trade-offs between certainty and gambles *after* utility is fixed.
      *   **Part 2: The Calculation.**
          *   Need a specific functional form for $r(p)$ that is spreadsheet-friendly. Power function $r(p) = p^\gamma$ is standard.
          *   $\gamma = 1$: Neutral.
          *   $\gamma > 1$: Concave (Risk Averse). *Wait, check math.* If $p=0.1$, $0.1^2 = 0.01$. Shrinks small probs. This downweights longshots. Good for Complaint 1.
          *   $\gamma < 1$: Convex (Risk Seeking).
          *   *Wait, Complaint 2 (Catastrophe):* Risk aversion should also upweight the bad tail. In RDU, the weight on the worst outcome is $r(1) - r(1-p_{worst})$. If $r$ is concave ($\gamma > 1$), $r(1-p)$ is smaller than $1-p$, so the difference is *larger* than $p$. Yes, concave $r$ upweights the worst outcome.
          *   So $\gamma > 1$ handles both complaints (avoids longshots, avoids catastrophes).
          *   Need explicit arithmetic steps for 4-6 outcomes.
      *   **Part 3: Uncertainty & Disagreement.**
          *   Qualitative likelihoods: Use ordinal ranking + sensitivity analysis (bounds).
          *   Ranking disagreements: This is a Value judgment (Committee).
          *   Labeling: Fact (Data), Value (Committee), Judgment (Officer).
      *   **Part 4: Objections & Commitments.**
          *   Must address Dynamic Inconsistency (Money Pumps). Acknowledge it.
          *   Must address Portfolio Effect (45 decisions vs 1). If we treat the portfolio as one big bet, risk aversion washes out (Law of Large Numbers). If we treat each grant as distinct (Savage's Small World), risk aversion holds. The procedure must stipulate we treat them as distinct *unless* they are perfectly correlated.
          *   Must address Axioms. Admit this violates Independence axiom.
      *   **Part 5: The Three Cases.**
          *   *Case 1 (Longshot):* High variance, 10% huge success. EV loves it. Risk-Weighted (with $\gamma > 1$) should punish the 10% weight. *Target:* Reject or Reduce.
          *   *Case 2 (Safe Expansion):* 85% modest gain. EV likes it. Risk-Weighted likes it (weight on high prob modest gain is stable). *Target:* Fund.
