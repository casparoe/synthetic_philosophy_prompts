answer: |-
  # RISK-WEIGHTED GRANT ASSESSMENT PROTOCOL (RWGAP)
  **Version 1.0 | For Internal Use Only**

  ## 1. INPUT ELICITATION AND ANTI-SMUGGLING TESTS

  This procedure requires three distinct inputs: **Utility** (value of outcomes), **Probability** (likelihood of outcomes), and **Risk Attitude** (weighting of probabilities). Officers must complete the Elicitation Sheet before calculating scores.

  ### A. Utility Elicitation (Value)
  **Task:** Assign a numerical value (0–100) to each potential outcome of the grant, where 0 is the Status Quo (no grant funded) and 100 is the Best Plausible Outcome imaginable for this specific program area.
  **[VALUE]** This scale reflects the foundation's mission priorities, not the likelihood of success.

  *   **Acceptable Answer:** "Success yields 100 points; partial success yields 40; failure yields 0."
  *   **Unusable Answer:** "Success is 100 points, but since it's unlikely, I'll value it at 20."
  *   **Smuggling Test:** If an officer lowers the utility score of a high-impact outcome solely because it is improbable, they are smuggling Probability into Utility.
      *   *Correction:* Restore the utility to its "if it happened" value. Move the adjustment to the Risk Attitude parameter.

  ### B. Probability Elicitation (Likelihood)
  **Task:** Assign a percentage chance (0–100%) to each outcome. The sum of all outcomes must equal 100%.
  **[FACT/JUDGMENT]** Use external data where available; use expert judgment where not.

  *   **Acceptable Answer:** "Based on three prior similar pilots, success frequency is 10%."
  *   **Unusable Answer:** "I'm giving it a 10% chance because the downside is too scary to count as likely."
  *   **Smuggling Test:** If an officer reduces the probability of a catastrophic outcome because "it would be terrible if it happened," they are smuggling Utility/Risk into Probability.
      *   *Correction:* Estimate the frequency as if the outcome were neutral (e.g., "rain on parade day"). Move the aversion to the Risk Attitude parameter.

  ### C. Risk Attitude Elicitation (Weighting)
  **Task:** The Committee sets a single parameter, $\gamma$ (Gamma), for the fiscal year. Officers do not choose this.
  **[VALUE]** This parameter represents the foundation's tolerance for variance in outcomes.

  *   **Mechanism:** We use a Power Risk Function: $r(p) = p^\gamma$.
  *   **Committee Guidance:**
      *   $\gamma = 1.0$: Risk Neutral (Maximize Expected Value).
      *   $\gamma > 1.0$: Risk Averse (Downweight longshots, upweight certainty of bad outcomes).
      *   $\gamma < 1.0$: Risk Seeking (Upweight longshots).
  *   **Stipulation:** For this fiscal year, the Committee sets **$\gamma = 1.5$**. This reflects a moderate aversion to spread, distinguishing us from pure EV maximizers without paralyzing all innovation.

  ---

  ## 2. COMPUTATION PROCEDURE

  **Constraint:** Prospects must be ranked from Worst Outcome ($x_1$) to Best Outcome ($x_n$). Maximum 6 outcomes.

  **Step 1: Order Outcomes**
  List outcomes in Row 1 to $n$, where $x_1$ is the lowest utility and $x_n$ is the highest.
  **[FACT]** Ordering is determined by the Utility scores elicited in Section 1A.

  **Step 2: Cumulative Probability**
  For each outcome $i$, calculate $P(\ge x_i)$, the probability of achieving outcome $i$ *or anything better*.
  *   $P(\ge x_n) = p_n$
  *   $P(\ge x_{n-1}) = p_n + p_{n-1}$
  *   ...
  *   $P(\ge x_1) = 1.0$

  **Step 3: Decision Weights**
  Calculate the decision weight $w_i$ for each outcome using the Committee's $\gamma$.
  *   Formula: $w_i = (P(\ge x_i))^\gamma - (P(\ge x_{i+1}))^\gamma$
  *   *Note:* For the best outcome ($x_n$), treat $P(\ge x_{n+1})$ as 0.
  *   *Spreadsheet Instruction:* `=POWER(Cumulative_Prob_Current, Gamma) - POWER(Cumulative_Prob_Next, Gamma)`

  **Step 4: Risk-Weighted Value (RWV)**
  Calculate the total score.
  *   Formula: $RWV = \sum (w_i \times u_i)$
  *   Normalize per dollar: $Score = RWV / \text{Grant Request Amount}$.

  **Shape Restrictions & Coherence:**
  *   **Restriction:** $\gamma$ must be positive.
  *   **Curvature:**
      *   **Concave ($\gamma > 1$):** Risk Averse. Reduces weight on small probabilities of high gain (longshots). Increases weight on high probabilities of low gain (security). Increases weight on the worst outcome relative to its statistical frequency.
      *   **Convex ($\gamma < 1$):** Risk Seeking.
  *   **Coherence:** This method satisfies First-Order Stochastic Dominance but violates the Independence Axiom of Expected Utility Theory. It is coherent within the Rank-Dependent framework provided $\gamma$ remains constant across the decision set.

  ---

  ## 3. UNCERTAINTY AND DISAGREEMENT PROTOCOLS

  ### A. Qualitative Likelihoods
  When probabilities cannot be quantified (e.g., "Unlikely," "Probable"):
  1.  **Stipulation:** Convert ordinals to bounds. "Unlikely" = 0–20%; "Probable" = 60–80%.
  2.  **Computation:** Run the spreadsheet twice (Lower Bound $\gamma$, Upper Bound $\gamma$).
  3.  **Decision Rule:** If the recommendation (Fund/Reject) flips between bounds, the proposal is **"Indeterminate."** It requires Committee review.
      *   **[JUDGMENT]:** The Officer flags the Indeterminacy; the Committee decides whether to fund based on strategic preference for ambiguity.

  ### B. Disagreement on Outcome Ranking
  If Officer A ranks Outcome X higher than Outcome Y, and Officer B disagrees:
  1.  **Do not average the utilities.**
  2.  **Referral:** This is a **[VALUE]** disagreement regarding the mission. Refer to the Committee.
  3.  **Procedure:** The Committee must vote on the ranking *before* the Risk-Weighted Value is calculated. The math cannot resolve value conflicts.

  ### C. Fact vs. Value vs. Judgment Labels
  Every cell in the assessment sheet must be tagged:
  *   **[FACT]:** Empirical data (e.g., prior success rates, budget numbers). Disputes resolved by evidence.
  *   **[VALUE]:** Mission alignment (e.g., Is "policy change" worth more than "direct service"?). Disputes resolved by Committee vote.
  *   **[JUDGMENT]:** Expert estimation where data is missing (e.g., Probability of political adoption). Disputes resolved by Senior Program Officer.

  ---

  ## 4. THEORETICAL COMMITMENTS AND OBJECTIONS

  By adopting this procedure, the Foundation accepts the following theoretical costs. These are not bugs; they are features of the chosen framework.

  ### A. Violation of Expected Utility Axioms
  **Objection:** Classical theory states risk aversion *is* diminishing marginal utility. Separating them violates the Independence Axiom.
  **Commitment:** We acknowledge this violation. We assert that a foundation's risk attitude is a distinct policy lever from its valuation of outcomes. We prefer a model that allows us to say "We value this outcome highly, but we are unwilling to bet on it," without distorting the value metric.

  ### B. Dynamic Inconsistency (Money Pumps)
  **Objection:** Risk-weighted agents can be exploited in sequential choices (money pumps) where they pay to swap gambles they previously preferred.
  **Commitment:** We accept limited exposure to dynamic inconsistency in exchange for intuitive decision rules.
  **Mitigation:** This procedure treats each grant cycle as a **closed set**. Officers are forbidden from revising risk weights mid-year based on prior outcomes. The "portfolio" is reset annually.

  ### C. The Portfolio Problem (45 Decisions vs. 1)
  **Objection:** With 45 grants, the Law of Large Numbers suggests aggregate risk is low. Applying risk aversion to *each* grant individually reduces total expected impact unnecessarily.
  **Commitment:** We explicitly reject the "Portfolio" view for this procedure.
  **[STIPULATION]:** We treat each grant as a **Savage Small World**. We act *as if* each decision stands alone.
  **Reasoning:** Correlations between social interventions are opaque. Assuming diversification benefits requires knowledge of covariance we do not possess. We prefer the error of excessive caution on individual grants to the error of systemic collapse due to correlated failure.

  ### D. Scope of Application
  **Objection:** Savage's framework requires fully specified states and consequences. Real-world grants are open-ended.
  **Commitment:** We acknowledge this is an approximation.
  **[STIPULATION]:** Officers must define the "Residual Category." If there is >10% probability of outcomes outside the specified list, the proposal is **Incomplete**. The officer must expand the outcome list until the specified outcomes cover at least 90% of the probability mass.

  ---

  ## 5. CASE APPLICATIONS

  **Parameters:** $\gamma = 1.5$ (Committee Mandate). Cost normalized to per-dollar score. Utility Scale: 0 (Status Quo) to 100 (Max Impact). Negative utility for harm.

  ### CASE 1: The Open-Source Instrument (Longshot)
  **Request:** \$2.3M (16% of budget).
  **Outcomes:**
  1.  **Transformative (10%):** Utility 100.
  2.  **Modest (25%):** Utility 40.
  3.  **Near-Zero (65%):** Utility 5.

  **Computation:**
  *   **Ranking:** Near-Zero (1) < Modest (2) < Transformative (3).
  *   **Cumulative Probs:**
      *   $P(\ge 5) = 1.0$
      *   $P(\ge 40) = 0.35$
      *   $P(\ge 100) = 0.10$
  *   **Decision Weights ($p^{1.5}$):**
      *   $w_1$ (Near-Zero): $1.0^{1.5} - 0.35^{1.5} = 1.0 - 0.207 = 0.793$
      *   $w_2$ (Modest): $0.35^{1.5} - 0.10^{1.5} = 0.207 - 0.032 = 0.175$
      *   $w_3$ (Transformative): $0.10^{1.5} - 0 = 0.032$
      *   *Check Sum:* $0.793 + 0.175 + 0.032 = 1.0$.
  *   **Risk-Weighted Value:**
      *   $(0.793 \times 5) + (0.175 \times 40) + (0.032 \times 100)$
      *   $3.97 + 7.0 + 3.2 = 14.17$
  *   **EV Comparison:**
      *   EV = $(0.65 \times 5) + (0.25 \times 40) + (0.10 \times 100) = 3.25 + 10 + 10 = 23.25$.
  *   **Result:** RWV (14.17) is significantly lower than EV (23.25).
  *   **Recommendation:** **REJECT** (Relative to safer alternatives).
  *   **Contestable Input:** The Utility of "Transformative." If the Officer argues this is actually 200 points (field-redefining), the score rises to 20.57. Still below EV, but closer.
  *   **Director's Note:** The Founder will dislike this. The math confirms the Officers' intuition that this is too risky for our risk profile, despite the high EV.

  ### CASE 2: Program Expansion (Safe)
  **Request:** \$500k.
  **Outcomes:**
  1.  **Admin Failure (15%):** Utility 0 (Money lost).
  2.  **Modest Improvement (85%):** Utility 30.

  **Computation:**
  *   **Ranking:** Failure (1) < Improvement (2).
  *   **Cumulative Probs:**
      *   $P(\ge 0) = 1.0$
      *   $P(\ge 30) = 0.85$
  *   **Decision Weights ($p^{1.5}$):**
      *   $w_1$ (Failure): $1.0^{1.5} - 0.85^{1.5} = 1.0 - 0.785 = 0.215$
      *   $w_2$ (Improvement): $0.85^{1.5} - 0 = 0.785$
      *   *Note:* The weight on Failure (0.215) is higher than its probability (0.15). This is the risk aversion penalty.
  *   **Risk-Weighted Value:**
      *   $(0.215 \times 0) + (0.785 \times 30) = 23.55$
  *   **EV Comparison:**
      *   EV = $(0.15 \times 0) + (0.85 \times 30) = 25.5$.
  *   **Result:** RWV (23.55) is slightly lower than EV (25.5), but high absolute score.
  *   **Recommendation:** **FUND**.
  *   **Contestable Input:** None. This is the baseline "safe" asset.

  ### CASE 3: Community Health Pilot (Catastrophe Risk)
  **Request:** \$200k.
  **Outcomes:**
  1.  **Catastrophic Harm (5%):** Utility -500 (Loss of trust, regional ban).
  2.  **Substantial Benefit (95%):** Utility 50.

  **Computation:**
  *   **Ranking:** Harm (1) < Benefit (2).
  *   **Cumulative Probs:**
      *   $P(\ge -500) = 1.0$
      *   $P(\ge 50) = 0.95$
  *   **Decision Weights ($p^{1.5}$):**
      *   $w_1$ (Harm): $1.0^{1.5} - 0.95^{1.5} = 1.0 - 0.926 = 0.074$
      *   $w_2$ (Benefit): $0.95^{1.5} - 0 = 0.926$
      *   *Note:* The 5% risk is upweighted to 7.4%.
  *   **Risk-Weighted Value:**
      *   $(0.074 \times -500) + (0.926 \times 50)$
      *   $-37.0 + 46.3 = 9.3$
  *   **EV Comparison:**
      *   EV = $(0.05 \times -500) + (0.95 \times 50) = -25 + 47.5 = 22.5$.
  *   **Result:** RWV (9.3) is positive.
  *   **Recommendation:** **FUND**.
  *   **Contestable Input:** The Utility of Catastrophic Harm. I used -500. If the Officer argues the harm is "Existential" (-1000), the score becomes $(0.074 \times -1000) + 46.3 = -27.7$ (Reject).
  *   **Director's Note:** **This is the result you will not like.** The Officer recommended *Against*. The Committee was inclined to *Fund*. The Procedure says **Fund**.
      *   *Why:* Even with risk aversion upweighting the 5% tail to 7.4%, the expected benefit is sufficiently large to outweigh the risk-weighted harm, *unless* the harm is valued as infinitely negative.
      *   *Implication:* If you side with the Officer, you are not just being risk-averse; you are asserting the harm is *incommensurable* (Utility = $-\infty$). This procedure forces you to make that explicit. You cannot hide behind "risk management" to veto a positive RWV; you must declare the outcome unacceptable on value grounds.

  ---

  ## 6. LIMITATIONS AND GAMING VECTORS

  ### A. Where Not to Apply
  1.  **Operational Expenses:** Do not use RWGAP for overhead or staffing. These are certain costs, not probabilistic outcomes.
  2.  **Emergency Relief:** In time-critical disasters, the "Small World" stipulation fails. Use EV or heuristic triage.
  3.  **Correlated Portfolios:** If funding 10 grants in the same geographic region, do not run this procedure 10 times independently. The "Catastrophe" risk is correlated. You must aggregate them into a single meta-prospect before applying weights.

  ### B. Gaming the Elicitation
  An officer determined to kill a proposal can:
  1.  **Sandbag Utility:** Rate the "Best Outcome" lower than warranted.
      *   *Counter:* Audit top-line utility scores against historical grants.
  2.  **Inflate Tail Risk:** Claim a 5% catastrophe is 15%.
      *   *Counter:* Require [FACT] tags on probability inputs. If no data exists, mark as [JUDGMENT] and require peer review from another officer.
  3.  **Fragment Outcomes:** Split one "Modest" outcome into three "Small" outcomes to manipulate cumulative probabilities.
      *   *Counter:* The procedure mandates grouping indistinguishable utility outcomes.

  ### C. Policy Amendment Advice
  **Do not amend the Expected Value policy yet.**
  The current friction is not a policy failure; it is a **parameter ambiguity**. The Committee believes $\gamma = 1.0$ (EV). The Officers are acting as if $\gamma \approx 2.0$.
  **Recommendation:** Run this procedure in parallel with EV calculations for one quarter.
  *   If RWGAP and EV agree >90% of the time: The risk aversion is unnecessary bureaucracy. Stick to EV.
  *   If RWGAP and EV disagree on high-visibility grants: Bring the specific $\gamma$ disagreement to the Committee. Ask them: "Are we willing to sacrifice \$X of Expected Value to reduce the weight of this specific tail risk by Y%?"
  *   **Stipulation:** If the Committee refuses to set a $\gamma$, default to 1.0. Risk aversion without a mandated parameter is merely hidden veto power.

  ### D. Final Warning on "Small Worlds"
  This procedure assumes we can bound the consequences. In reality, a "Catastrophe" in Case 3 could trigger a chain reaction affecting other grants. This procedure does not capture systemic risk. It captures *local* risk. If the Foundation's theory of change relies on systemic interconnection, this spreadsheet is insufficient. It is a tool for grant-level discipline, not strategic foresight. Use it to clarify arguments, not to replace them.
