answer: |-
  Your suspicion is well-founded: cosmological arguments are indeed structural claims about dependency graphs, but they often conflate distinct structural properties (termination, productivity, uniformity) that your kernel keeps separate. Below is the restatement and analysis of the Kalam and Leibnizian arguments in the vocabulary of dependent type theory (DTT).

  ### 1. The Kalam Cosmological Argument

  **Restatement:**
  Let $\text{Event}$ be a type. Let $\text{Precedes} : \text{Event} \to \text{Event} \to \text{Prop}$ be a relation where $\text{Precedes}(e_1, e_2)$ means $e_1$ is causally/temporally prior to $e_2$. Let $\text{Present}$ be a specific inhabitant of $\text{Event}$.

  *   **Premise 1 (Causality):** $\forall e: \text{Event}. \text{Begins}(e) \to \exists c: \text{Event}. \text{Causes}(c, e)$.
      *   *Classification:* A claim about **inhabitation of a dependent product**. For every $e$ satisfying $\text{Begins}$, the fiber $\text{Causes}(-, e)$ is inhabited.
  *   **Premise 2 (Finite Past):** The type $\text{Past}(\text{Present})$, defined as the accessible part of $\text{Event}$ under $\text{Precedes}$ ending at $\text{Present}$, is **Inductive**.
      *   *Classification:* A **well-foundedness requirement**. It asserts that $\text{Precedes}$ is well-founded on the past, implying no infinite descending chains.
  *   **Conclusion:** $\exists c: \text{Event}. \text{Causes}(c, \text{Universe})$.
      *   *Classification:* **Inhabitation**.

  **Analysis of Point 1 (The Actual Infinite):**
  The Kalam proponent claims a beginningless past is a "completed infinite totality" that is impossible. In your framework, this is a confusion between **Inductive** and **Coinductive** types.
  *   An infinite past is structurally isomorphic to a **Coinductive Stream** of events. Coinductive types represent "completed" infinite objects that are **productive** (you can always compute the next predecessor) but not **terminating** (you cannot recurse to a base case).
  *   The Kalam objection is effectively a **Termination Check** failure. It claims that to reach the present, one must "traverse" the past. Traversal requires structural recursion, which demands a well-founded relation (Inductive).
  *   **Distinction:** The past is not a computation; it is a structure. Your kernel admits coinductive streams as valid inhabitants. The distinction between "potential" and "actual" infinity maps poorly to "Inductive vs. Coinductive." A coinductive stream *is* an actual infinite object in memory. The Kalam argument fails because it demands that temporal history be **Inductive** (admitting recursion to a base case) rather than **Coinductive** (admitting infinite observation).
  *   **Force:** The force dissolves. The impossibility of an infinite past is not a logical contradiction in DTT; it is a policy decision to model time as Inductive. If you model time as Coinductive, the "infinite regress" is a valid, productive structure.

  ### 2. The Leibnizian Cosmological Argument (PSR)

  **Restatement:**
  Let $\text{Fact}$ be a type. Let $\text{Explains} : \text{Fact} \to \text{Fact} \to \text{Prop}$ be a grounding relation. Let $\text{Contingent} : \text{Fact} \to \text{Prop}$.

  *   **Premise 1 (PSR):** $\forall f: \text{Fact}. \text{Contingent}(f) \to \exists g: \text{Fact}. \text{Explains}(g, f)$.
      *   *Classification:* **Inhabitation of a dependent product**. It asserts the fiber of explanations is never empty for contingent facts.
  *   **Premise 2 (Totality):** Let $C$ be the subtype of contingent facts. The conjunction $\Pi_{f:C} f$ (the dependent product of all contingent facts) is itself a fact that requires explanation.
      *   *Classification:* **Universe/Predicativity**. It assumes the collection of facts forms a type within the same universe that can be treated as a single inhabitant.
  *   **Premise 3 (Regress Failure):** An infinite chain $f_1 \leftarrow f_2 \leftarrow \dots$ does not inhabit $\text{Explains}(-, \Pi_{f:C} f)$.
      *   *Classification:* **Pointwise vs. Uniform Inhabitation**. It claims that having an explanation for each fiber does not yield an inhabitant for the total product.
  *   **Conclusion:** $\exists n: \text{Fact}. \neg \text{Contingent}(n) \land \text{Explains}(n, \Pi_{f:C} f)$.
      *   *Classification:* **Inhabitation** of a base case (Axiom).

  **Analysis of Point 2 (PSR as Completeness):**
  Reading PSR as "every truth is derivable" makes it a **Completeness** claim. In a system strong enough to encode arithmetic, this is inconsistent with consistency (Gödel). However, reading it as "every fact has a constructor" (Inhabitation) makes it a claim about **Normalization**.
  *   If every fact must be explained, every derivation tree must terminate at a base case (Necessary Being). This is a **Strong Normalization** requirement on the grounding relation.
  *   **Coherence:** If the system includes self-reference (facts about the system), demanding that *every* fact has an explanation leads to a loop unless there is a base case. If the system is consistent, it cannot prove its own normalization internally. Thus, PSR is coherent only as an external meta-theoretic property, not an internal axiom.

  **Analysis of Point 3 (The Necessary Being):**
  A "self-explanatory" being is a fixed point: $n$ such that $\text{Explains}(n, n)$.
  *   **Kernel Policy:** Your kernel rejects unguarded circularity (the **Occurs Check**). A term $x$ cannot be defined in terms of $x$ without a guard (e.g., a constructor or a modal operator like $\bigcirc$).
  *   **Regime:** The argument needs **Unguarded Recursion**. It posits a value that is its own justification immediately. In DTT, this is an inconsistency (it allows deriving $\bot$ via looping terms).
  *   **Guarded Recursion:** If you allow guarded self-reference (coinductive), the necessary being becomes a productive process that generates its own justification endlessly. This loses the "terminus" status. It becomes a stream, not a foundation.
  *   **Force:** The argument requires a logical inconsistency (unguarded fixed point) to function as a "terminus." If corrected to be consistent (guarded), it ceases to be a foundation and becomes just another link in a chain.

  **Analysis of Point 4 (The Collection):**
  The complaint that "explained members do not explain the collection" is a precise claim about **Dependent Product Formation**.
  *   **Formal Reading:** We have $\forall f:C, \exists g, \text{Explains}(g, f)$. This is pointwise inhabitation. The argument claims we need $\exists G, \forall f:C, \text{Explains}(G(f), f)$ where $G$ is a uniform function, or perhaps an explanation for the type $C$ itself.
  *   **Verdict:** **True.** In constructive type theory, pointwise inhabitation ($\forall x, \exists y$) does not imply uniform inhabitation ($\exists f, \forall x$) without the Axiom of Choice. More critically, the type $\Pi_{f:C} f$ lives in a higher universe than the individual $f$. Explaining the members (lower universe) does not automatically explain the product type (higher universe). This is a **Predicativity** issue. The collection is structurally distinct from its members.
  *   **Force:** This is the strongest part of the argument. It survives translation intact. The "whole" is a higher-order type that requires a distinct inhabitant (explanation) from the inhabitants of its fibers.

  **Analysis of Point 5 (Personal Agent):**
  The move to a "free agent" introduces non-deterministic choice.
  *   **Translation:** There is no counterpart in your kernel. Kernels are confluent and deterministic. Reduction rules are fixed.
  *   **Verdict:** This is not a gap in your vocabulary; it is a sign the move is **Non-Structural**. "Will" implies the ability to select between multiple valid inhabitants without a determining rule. In DTT, if multiple inhabitants exist, they are distinct proofs. If the selection is arbitrary, it is not a derivation. This premise cannot be expressed as a type-theoretic claim; it is an import from psychology or metaphysics that breaks the formalism.

  ---

  ### Residue Report

  **1. Translated Cleanly**
  *   **The Regress Problem (Leibniz):** The distinction between an infinite chain of explanations and a terminal explanation maps perfectly to **Well-Foundedness** vs. **Non-Well-Founded Relations**.
  *   **The Collection Problem (Leibniz):** The distinction between explaining individual facts and explaining the totality maps perfectly to **Pointwise Inhabitation** vs. **Dependent Product Inhabitation** (and Universe levels).
  *   **Verdict:** These show the proof-theoretic vocabulary is **richer** than the philosophical original. It clarifies *why* the intuition holds (universe levels/choice principles).

  **2. Translated Under Distortion**
  *   **The Actual Infinite (Kalam):**
      *   *Distortion:* The argument treats infinite sets as logically impossible. DTT treats them as **Coinductive Types**.
      *   *Source:* **Design Decision.** Your kernel enforces termination for computation, but admits coinduction for data. The Kalam proponent conflates data with computation.
      *   *Verdict:* The premise was **less clear than it looked**. It relies on an equivocation between "traversing" (computation) and "existing" (data).
  *   **The Necessary Being (Leibniz):**
      *   *Distortion:* The argument requires a self-grounding term. DTT requires **Guardedness** for consistency.
      *   *Source:* **Design Decision.** You reject unguarded recursion to prevent inconsistency ($\bot$).
      *   *Verdict:* The premise is **logically suspect**. Stating it precisely reveals it demands an inconsistent type system (one that allows unguarded fixed points).

  **3. Cannot Be Expressed**
  *   **Agency/Will (Kalam/Leibniz):**
      *   *Source:* **Metaphysical Import.** Deterministic reduction rules cannot model libertarian free will.
      *   *Verdict:* The move was **never a structural claim**. It is an attempt to patch the formal system with an external oracle.

  ---

  ### Final Verdict

  You asked which argument is vindicated, dissolved, or strengthened by stating it as a claim about derivations.

  **1. The Kalam Argument is Dissolved.**
  When restated as a claim about **Inductive vs. Coinductive** types, the core premise (that an infinite past is impossible) is revealed to be a category error. It mistakes a coinductive structure (which is valid) for a non-terminating computation (which is rejected). The "ban on actual infinities" is not a logical necessity but a rejection of coinduction for temporal data. The argument loses its force because the type theory admits the very structure it claims is impossible.

  **2. The Leibnizian Argument is Strengthened (with caveats).**
  The structural core of the Leibnizian argument—the claim that a dependent product over a family of contingent facts requires an explanation at a higher universe level—is **vindicated** by type theory. The distinction between $\forall x, \exists y$ and $\exists f, \forall x$ (and the universe jump for the total space) provides a rigorous formalization of why an infinite chain of contingent explanations might fail to explain the totality.
  *   *Caveat:* The conclusion (a "Necessary Being") remains problematic. In DTT, a "self-explanatory" term is an unguarded fixed point, which is inconsistent. To save the argument, one must redefine "Necessary" not as "self-explanatory" but as "Axiomatic" (a base case in the inductive definition of Fact). If "Necessary" means "Base Case," the argument holds: you cannot construct the type of Facts without a Base Case.

  **3. The Strongest Version.**
  The version that becomes strongest is a **Structural Leibnizian Argument**:
  > "The type of Contingent Facts is defined inductively. An inductive type cannot be inhabited unless there is at least one constructor that does not recurse on the type itself (a Base Case). An infinite chain of recursion provides no Base Case. Therefore, for the type of Facts to be inhabited, there must exist a Non-Contingent (Base) Case."

  This translates the metaphysical intuition into a **Formation Rule** for inductive types. It bypasses the need for a "self-explanatory" loop (which is inconsistent) and instead posits a "brute fact" (Axiom) as a structural necessity for the system to exist. This is not a proof of God, but a proof that *something* must be axiomatic.

  **Conclusion:** Your suspicion is correct. These are structural claims. The Kalam argument fails because it misunderstands the structure of infinity (Coinduction). The Leibniz argument succeeds insofar as it identifies a requirement for Base Cases in inductive definitions, but fails if it demands those Base Cases be "self-explanatory" (Unguarded Fixed Points). The vocabulary does not impoverish the arguments; it sanitizes them, removing the mystical residue to reveal the logical skeleton.
