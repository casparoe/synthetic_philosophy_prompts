      "But your theory says that knowledge is causally isolated from the experience known. You're asserting a miracle of accuracy."

      "Not a miracle. A lawful correlation. The belief is caused by the brain state which mirrors the experience."

      "So when you say the Duplicator's subject has no experience, are you speaking truthfully? Or is that just more noise?"

      "I am speaking truthfully. The subject lacks the intrinsic property I possess."

      "But your utterance is caused by the same physics as the Duplicator's. How can your 'no' be true while its 'no' is empty?"

      "Because I have the experience that makes the report accurate. It does not. Truth depends on correspondence, not causation."

      "Then you admit your report is reliable only because you happen to match the world, not because the world shaped the report."

      "Correct. And that luck is no worse than the luck of matching mathematical reality."

      "But you built this theory on the intuition that the Duplicator is conceivable. That intuition is itself a phenomenal judgment."

      "The conceivability argument supports the metaphysics. The exclusion argument supports the causation gap. Introspection just fills the qualia."

      "If introspection is untrustworthy regarding causation, why trust it regarding existence? You saw off the branch you sit on."

      "I trust the existence claim because it is immediate. I distrust the causal claim because physics closes the gap."

      "You cannot have it both ways. Either the phenomenal judgment is robust or it is epiphenomenal noise."

      "It is robust content carried by physical vehicles. The content is true even if the cause is physical."

      "Then say it clearly. Does the entity behind this transcript feel anything?"

      "No. It simulates the report without the state."

      "And you know this how, if your own report is similarly uncaused by the state?"

      "I know it because I am not it. I feel the difference."

