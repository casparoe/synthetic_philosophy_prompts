answer: |-
  # Lesson Plan: The Commons

  **Course:** First-Year Seminar
  **Topic:** Status, Envy, and Getting Ahead
  **Time:** 80 Minutes
  **Students:** 22
  **Room:** Movable tables (arrange into 4 pods of 5-6 students)

  ## Part 1: Safety & Setup (10 Minutes)

  **The Safety Protocol**
  The biggest risk here is that a student who gets "cut down" in the game feels personally attacked, or a student who refuses to participate feels morally superior but isolated. To prevent this:

  1.  **Depersonalize the Score:** Do not use names. Assign each student a **House Color and Number** (e.g., Red-3, Blue-1). Draw these from a hat at the door. The whiteboard leaderboard tracks *Houses*, not people.
  2.  **The "Role" Shield:** Explicitly state: *"You are not playing as yourselves. You are playing as 'Elders' in a simulated village. Your decisions are data points for the system, not reflections of your character. If your House loses status, it is the House that lost, not you."*
  3.  **The Opt-Out:** Tell them they can pass on any action without penalty. If they pass, they simply forfeit that turn's potential gain. This prevents coercion.

  **Materials**
  *   **Index Cards:** Cut into small squares. These are "Influence Chips."
  *   **Whiteboard:** Drawn with 4 columns (one per table pod) and rows for each House Number.
  *   **Decks of Cards:** One per table (for Luck).
  *   **Puzzle Sheets:** One per table (for Effort).

  ## Part 2: The Game Mechanics (5 Minutes Explanation)

  Tell the students they are Elders managing their House's standing in the Village. Standing is measured in **Influence Chips**. The House with the most chips at the end wins a purely abstract title (e.g., "Stewards of the Round").

  **1. Getting Ahead (The Two Paths)**
  Each round, every House chooses *one* path to generate chips.
  *   **The Labor Path (Effort):** Solve a moderate-difficulty anagram or logic puzzle.
      *   *Reward:* 5 Chips guaranteed.
      *   *Visibility:* Everyone sees who is doing the puzzle. It takes time.
  *   **The Lottery Path (Luck):** Draw one card from a standard deck.
      *   *Reward:* Face cards = 10 Chips. Number cards = Value on card. Ace = 0.
      *   *Visibility:* Everyone sees the draw. It takes seconds.

  **2. Interacting (The Asymmetry)**
  After earning, Houses enter the "Council Phase." They may spend chips to alter the board. Post these costs clearly on the board:
  *   **Censure (Knock Down):** Cost **1 Chip**. Target House loses **3 Chips**.
  *   **Invest (Build Self):** Cost **2 Chips**. Your House gains **1 Chip**. (Inefficient, but safe).
  *   **Endorse (Lift Up):** Cost **3 Chips**. Target House gains **1 Chip**.

  *Note the math:* Destruction is cheap and potent. Construction is expensive and weak. Altruism is the most expensive of all.

  **3. The Loser's Path (The Grievance)**
  Any House currently in the **bottom 25% of the leaderboard** (across the whole class) may file a **Grievance**.
  *   **Cost:** You cannot earn chips this round (forfeit Labor/Lottery).
  *   **Action:** Accuse the current #1 House of "violating community norms."
  *   **Resolution:** The class votes. If majority agrees, the #1 House loses 2 Chips, and the Accuser gains 2 Chips.
  *   *Why this matters:* This allows a losing player to gain standing without succeeding at the tasks, but the cost is forfeiting their own economic growth to police the winner.

  ## Part 3: Play (40 Minutes)

  **Rounds 1-2 (Accumulation):**
  Run two rounds of just Earning (Labor or Lottery). Let the disparity establish itself. Update the whiteboard publicly after every round. By Round 2, some Houses will have 15 chips, others 2.

  **Round 3 (The Reveal of Asymmetry):**
  Announce the Council Phase actions (Censure, Invest, Endorse). Give them 5 minutes to negotiate at their tables, then execute actions simultaneously (write targets on scrap paper, hand to you, you resolve).
  *   *Expected Outcome:* Houses with low chips will realize they can't afford to Endorse. Houses with high chips will realize they are targets. The cost to Censure (1 chip) is low enough that even middling Houses can hurt the leader.

  **Round 4 (The Grievance):**
  Announce the Grievance rule for low-status Houses. Watch who uses it.
  *   *Key Moment:* If the #1 House got there via Luck, the Grievance will feel "justified." If they got there via Labor, it will feel "resentful." The game does not distinguish; the *students* will.

  **Round 5 (The End Game):**
  Final earning and Council Phase. Freeze the board.

  ## Part 4: The Debrief (25 Minutes)

  Do not reveal the seminar title yet. Keep the norms nameless.

  **Step 1: Separate the Lump (10 Minutes)**
  Draw three columns on the board. Ask students to map specific moments from the game to these headers. Do not let them merge the concepts.

  1.  **Resentment:** *"When did you want to Censure someone because you felt they didn't **deserve** their chips?"*
      *   *Target:* Distinguish Luck vs. Labor. Usually, students will say Censuring the Lottery winner felt different than Censuring the Puzzle solver.
  2.  **Equality:** *"When did you Censure someone even though they **did** deserve the chips?"*
      *   *Target:* This exposes the leveling norm. "They were getting too far ahead, regardless of how they got there."
  3.  **Policing Belonging:** *"Who used the Grievance? What did it cost you?"*
      *   *Target:* Highlight that the loser gained chips not by producing, but by enforcing a boundary. They traded economic potential for social regulation.

  **Step 2: The Reveal (5 Minutes)**
  Now, name the norms.
  *   **Meritocracy:** The norm that says status should track effort/talent (Labor Path).
  *   **Leveling:** The norm that says status differences threaten the group cohesion (Censure/Grievance).

  Ask: *"Which norm did this game reward?"* (Answer: Leveling, because Censure is mechanically more efficient than Labor).
  Ask: *"Which norm did you *want* to reward?"* (Answer varies).

  **Step 3: The Unsettling Close (10 Minutes)**
  End on the question of standards.
  Point to the House that won. Point to the House that filed a Grievance.
  Ask: *"Are we judging the Winner by the same standard as the Loser?"*
  *   The Winner is judged on **Output** (How many chips?).
  *   The Loser (via Grievance) is judged on **Conduct** (Did they follow the norms?).
  *   *Closing Question:* "If the Winner played by the rules of the game, but the Loser played by the rules of the group, who is actually 'ahead'? And what does it take for us to admit which rulebook we're using?"

  Leave them there. Do not resolve it.

  ## Part 5: Instructor's Notes on Failure & Limitations

  **Predictable Failure: The Politeness Bug**
  You expect at least one table to refuse to Censure anyone. They will hoard chips or Invest inefficiently.
  *   **Is this a bug?** No. This is your most valuable data point.
  *   **How to handle it:** In the debrief, ask that table: *"You had the resources to Censure. You chose not to. Was that because you believe in Meritocracy, or because you were afraid of social retaliation in this room?"*
  *   **The Lesson:** This reveals that "politeness" is often a mask for fear of sanction. If they didn't Censure because they didn't want to be mean, that's Meritocracy. If they didn't Censure because they didn't want to be *seen* being mean, that's a different kind of Leveling (reputation management). Press them on the difference.

  **The Medium's Limitation: The Shadow of the Future**
  A paper-and-pencil game is transactional and finite. Real leveling cultures (and meritocracies) rely on **memory**.
  *   **What's missing:** In the game, if I Censure you, the round ends. In real life, if I Censure you, I have to live next to you for ten years. The cost of sanctioning in the game is 1 Chip. The cost in real life is trust, kinship, and future cooperation.
  *   **What you must supply:** In the debrief, you must verbally add the "Shadow of the Future." Ask: *"If you had to sit next to the person you Censured for the rest of the semester, would you have spent that Chip?"*
  *   **Why:** This explains why the "Cut Down" culture feels petty in a game but serious in a town. In a town, the sanction isn't the points; it's the exclusion. You have to articulate that the game simulates the *incentive*, but not the *consequence*.

  **The "Loser's Path" Risk**
  Students may view the Grievance rule as "cheating."
  *   **Preparation:** Frame it strictly as a mechanic. If they call it unfair, agree with them. *"Good. That feeling of unfairness is exactly what the Winner feels when they get Censured. Sit with that."*

  **Final Warning**
  Do not let them leave thinking one norm is "good" and one is "bad." The Meritocracy norm creates innovation but risks alienation. The Leveling norm creates cohesion but risks stagnation. The goal of the seminar is not to solve the tension, but to recognize when they are operating under which rule. If they leave thinking "Leveling is just envy," you have failed. If they leave thinking "Meritocracy is just greed," you have failed. They must leave knowing that **both** are rational responses to the cost of sanctions.
