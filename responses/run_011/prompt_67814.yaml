answer: |-
  Wallis proved that Hobbes's square was not equal to the circle, assuming this deprived the construction of scientific certainty. Hobbes countered that since geometry grants knowledge only because we generate our own objects, he remains the sole authority on the cause of this specific figure. Wallis may see that the equality fails, but only Hobbes knows the precise motion that generated the error. Thus, Hobbes possesses the only perfect science available in the room: a causal account of his own mistake.

  The comic weight rests on Hobbes's epistemological criterion that scientific knowledge requires knowing the cause or generation of an object. This makes the joke available only here because most failed demonstrations are not accompanied by a theory claiming certainty derives from the act of construction itself. Hobbes satisfies his own condition for certainty even when the result is false, since he still generated the erroneous figure himself. If the joke were told about Wallis, it would lose its force because Wallis does not ground geometrical certainty in the agent's construction of the object. His refutation relies on logical consistency rather than causal generation, so he cannot claim scientific knowledge of the error in the same way.
