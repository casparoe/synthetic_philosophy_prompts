answer: |-
  You have stumbled onto the central problem of contemporary speech-act theory: the tension between the *epistemic* (what you know), the *institutional* (what your role allows), and the *relational* (what your bond permits). Your list is remarkably consistent, but it resists a single "Knowledge Norm" (assert only what you know). The Forecaster doesn't know; the Umpire creates truth; the Friend with evidence violates a taboo.

  Here is the principle that best captures your verdicts, followed by the cost of the parrot.

  ### The Candidate Principle: The Practice-Relative Warranty Norm

  **The Rule:**
  > An utterance counts as an **assertion** only if the speaker intends to undertake accountability for its truth within a specific social practice.
  >
  > **The Norm:** In practice $P$, assert $p$ only if you possess the form of **warrant** (epistemic, institutional, or constitutive) that $P$ recognizes as sufficient to underwrite the **reliance** $P$ invites.

  **Why this works:**
  It shifts the focus from "Is it true?" or "Do you know it?" to "Did you license the listener to rely on this, and did you have the standing to do so?" It explains why the Forecaster is fine (statistical warrant licenses probabilistic reliance) but the Friend is not (friendship warrant does not license prophetic reliance, even with evidence).

  ---

  ### Mapping Your Cases

  Here is how the **Warranty Norm** processes your list.

  | Case | Verdict | Clause Doing the Work |
  | :--- | :--- | :--- |
  | **TV Forecaster** | Fine | **Institutional Warrant:** The practice of meteorology licenses probabilistic claims as actionable. |
  | **Commentator** | Fine | **Practice Norm:** Sports punditry invites speculation, not reliance on fact. |
  | **Friend (Rain)** | Not Fine | **Epistemic Warrant:** Friendship implies care; asserting without evidence invites reliance you can't back. |
  | **Friend (Marriage)** | Not Fine | **Relational Norm:** The practice of friendship prohibits certain truths regardless of epistemic warrant. |
  | **Doctor (Chart)** | Not Fine | **Institutional Warrant:** Medical records require clinical certainty; a hunch is insufficient warrant for the record. |
  | **Doctor (Bedside)** | Fine | **Hedged Warrant:** "I think" limits the reliance invited to hope/support, not medical fact. |
  | **Mother** | Fine | **Expressive:** Not an assertion of fact; no truth-claim warranty offered. |
  | **Grad Student** | Fine | **Dialectical Warrant:** Seminar practice licenses tentative claims for the sake of inquiry. |
  | **Referee** | **Not Fine** | **Epistemic Warrant:** (See "The Misfire" below). |
  | **Umpire** | Fine | **Constitutive Warrant:** In baseball, the call *creates* the truth; reliance is on the game, not physics. |
  | **Juror** | Not Fine | **Institutional Norm:** Violates the specific standard of proof required by the legal practice. |
  | **Transit Text** | Fine | **Systemic Warrant:** The agency's system constitutes the reality of the schedule. |
  | **Chatbot (False)** | Not Fine | **Unwarranted Reliance:** Presents output as fact without capacity to warrant truth. |
  | **Chatbot (Hedged)** | Fine | **Limited Warranty:** Explicitly caps the reliance the user should place on the info. |
  | **Parrot** | Neither | **Assertion Condition:** Lacks intention to undertake accountability. |

  ### The Misfire: The Referee
  Your verdict on the Referee ("Not Fine") is the only one this principle must **overturn**.
  *   **Why:** You stipulated the referee "read it closely, believed it, and done everything right." Under the Warranty Norm, if the practice of peer review accepts diligent expert judgment as sufficient warrant, the assertion was *proper*, even if false.
  *   **The Cost:** To keep your verdict, you must hold that the norm of assertion is **factive** (you must be *right*, not just diligent). But this breaks your Forecaster case (who is often wrong).
  *   **Resolution:** I suggest you accept the principle's correction here. The tragedy is the *error*, not the *assertion*. The referee fulfilled their warranty of diligence; the universe failed to cooperate.

  ---

  ### The Three New Cases

  Running your unsettled cases through the **Practice-Relative Warranty Norm**:

  **1. The Priest ("God is with you" + disbelief)**
  *   **Verdict:** **Not Fine.**
  *   **Analysis:** This depends on whether the utterance is a *constitutive blessing* or a *factual claim*. From the pulpit, it is often performative (like the Umpire). However, your condition "doesn't believe it" introduces **insincerity**. Even in performative speech acts, there is a norm of *commitment*. If the priest is merely acting a role while privately rejecting the premise, he is inviting reliance on a spiritual reality he explicitly denies. He lacks the *internal standing* required by the religious practice, even if he has the *institutional* standing. It is a breach of the warranty of sincerity.

  **2. The CFO (Press Release + private doubt)**
  *   **Verdict:** **Not Fine.**
  *   **Analysis:** Corporate communications operate under a strict **Legal/Epistemic Warrant**. "We expect" is a forward-looking statement that warrants reliance by investors based on internal data. If the CFO privately doubts the data or the projection, he is severing the link between the warrant and the claim. This is not just an improper assertion; it is fraud. He is inviting reliance he knows is unwarranted.

  **3. The Translation App ("You'll recover" $\to$ "You might recover")**
  *   **Verdict:** **Outside the Practice (Tool Failure).**
  *   **Analysis:** The app is not an *assertor*; it is a *conduit*. It does not undertake accountability for the truth of the medical prognosis. However, it operates under a **Fidelity Norm**. By changing the modality from definitive ("will") to probabilistic ("might"), it alters the *warranty* the doctor issued. It is not an "improper assertion" by the app (since the app asserts nothing), but it is a **corruption of the assertion** by the doctor. The harm is the same as a lie, but the category is *transmission error*, not *speech act violation*.

  ---

  ### The Parrot Problem: Is It Load-Bearing?

  **Yes.** The parrot is the keystone.

  If you do not exclude the parrot via the **Assertion Condition** (intention to undertake accountability), your entire list collapses.
  *   **Without the Parrot Clause:** The parrot's squawk is a "false assertion." If it's a false assertion, we must ask if it violated the norm. If it violated the norm, we must blame the parrot. This is absurd.
  *   **The Cost:** Keeping the parrot as the boundary marker costs you **objectivity**. You can no longer define assertion purely by the content of the sentence or the evidence behind it. You must reference the **mental state** (intention) or the **social status** (agency) of the speaker.

  **What this costs you:**
  1.  **Machines become harder to judge:** If the Chatbot has no "intent," is it a parrot? You ruled the Chatbot "Not Fine," which implies you treat it as an agent capable of violating a norm. To be consistent, you must argue the Chatbot is a *proxy* for its programmers (who *do* have intent), whereas the Parrot is a proxy for no one.
  2.  **Sincerity becomes central:** You cannot separate the *act* from the *actor*. The Priest case proves this. The norm isn't just "Don't say false things"; it's "Don't say things you aren't prepared to stand behind."

  **Summary:**
  Your intuition is tracking a **Norm of Warranted Reliance**. You are angry not when people are wrong, but when they invite you to trust them without the proper standing to back that trust. The parrot saves you from blaming nature for noise; the referee case is the only one where your anger at the *outcome* is clouding your judgment of the *act*.
