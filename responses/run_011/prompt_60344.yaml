prompt: |-
  I'm a third-year econ student, and the course I'm in right now is basically all institutions, commitment problems, signaling, coordination games and mechanism design — that's the vocabulary I actually think in. I also picked up an ethics elective where we read Appiah's book on honor codes and moral revolutions, plus a chunk of Williams on shame and honor and on why you supposedly can't blame the Greeks for owning slaves. I want to redo Appiah's argument in my own language as faithfully as I can and then find out how much of it actually survives.

  Here's the translation I already half-built, so you can see where I'm starting from:

  - Honor = a public, observable reputation variable that other players condition on, kind of like a credit score with social enforcement.
  - Dueling = a reputation/signaling game. Your type (will fight / won't fight) is private, the challenge is public, and refusing updates everybody's belief about your type, which raises your future predation costs. So the equilibrium looks insane — you shoot at someone over a remark at a card table — but its just an expensive way of certifying a type.
  - Footbinding = a marriage-market coordination equilibrium stuck on a bad focal point, and those anti-footbinding societies are commitment devices that let everyone defect at the same time.
  - British abolition of the slave trade = the case that interests me most, because the trade was still making money, so you can't say the payoffs changed. Instead the audience changed: enough people stopped counting the practice as compatible with being a respectable English person that the reputational return went negative.

  So my working reading is that Appiah's moral revolutions are equilibrium switches driven by belief revision in the audience, that interests is just another name for a change in the payoff matrix, and that moral argument is cheap talk that only bites when it moves what the audience believes.

  Do it properly, and then tell me what breaks. Specifically:

  1. State his general thesis and the three historical cases in this vocabulary as precisely as you can, including the bit where he says arguments mattered but not by persuading individuals one at a time.
  2. Give me the residue report: which claims translate cleanly, which ones you had to distort to make fit, and which ones have no counterpart in game theory at all. I especially want to know about the inner side of honor — Williams's point that shame isn't only about being seen, that you carry an audience around even when nobody is watching. Is that something I can bolt on as a preference parameter, or does calling it a preference parameter already destroy the thing it's supposed to capture?
  3. And the one I can't settle: in my language interests and honor are both just payoffs, and arguments and beliefs are both just updates. So Appiah's three-way split collapses into one mechanism. Is that evidence game theory is too coarse to describe what happened, or evidence that his distinction is less real than it sounds and he's rebranding a reputation mechanism as something deeper?

  Wherever you have to lean on something my framework hands you for free — fixed strategy sets, players who maximize, everybody knowing the game — flag it out loud instead of sneaking it in. I don't want a translation that only works because you quietly swapped his claims for ones my framework already likes.

  One more thing I can't write down. Williams's idea that the Greeks couldn't have abolished slavery because they lacked the concepts, not because the costs were too high. The closest I can get is saying the action wasn't in the strategy set, but then I've lost the only question I actually care about, which is how the strategy set changes. Is that a real limit or am I just bad at this?

  Don't bother with references or a reading list — I just want the translation and an honest accounting of what didn't make it across.
