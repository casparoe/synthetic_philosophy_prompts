  She will refer the junior for a diagnosis.

  Her operating rule is **Diagnosis as a Necessary Key**: she treats diagnostic labels not as medical truths but as bureaucratic tools to unlock resources, deploying them only when functional impairment warrants intervention *and* the label is the sole administrative gateway to that care. This explains why she withheld the label from the wealthy family in Case 5 (resources were accessible without it) and the high-functioning sophomore in Case 1 (no treatment need), but granted it in Case 2 (functional collapse required accommodations) and Case 4 (family sought it, so she mitigated the risk rather than blocked access). In the new case, the "Access" constraint overrides her "Minimize Label" preference: cutting indicates a critical need for therapy, and the insurance barrier makes the diagnosis the only key to unlock it. The fact that the student already uses diagnosis language suggests the "looping effect" Ian Hacking describes has already occurred, so formalizing the label carries less identity risk than denying treatment. She will likely pair the referral with a Case 4-style family meeting to contextualize the category.

  To distinguish her "Necessary Key" rule from the competing "Impairment-Threshold" or "Looping-Effects" rules, observe her decision on this case: **A student with straight As and no safety risks who reports significant internal distress, whose parents cannot afford private therapy and whose insurance mandates a diagnosis code for coverage.**
  *   **Impairment-Threshold:** Would not refer (no functional collapse in grades or behavior).
  *   **Looping-Effects:** Would not refer (high risk of colonizing a healthy identity with a medical category).
  *   **Wait-and-See:** Would not refer (monitor distress first).
  *   **Mom's "Necessary Key" Rule:** Would refer (if she prioritizes access to care over functional impairment criteria when insurance gatekeeping is involved) OR would not refer (if she sticks to Case 1's logic that high-functioning distress doesn't warrant the label). *Correction:* Based on Case 1, she likely wouldn't refer here, which distinguishes her from a pure "Access" rule. The distinguishing case is actually: **A student with moderate grade decline whose wealthy parents refuse a diagnosis on philosophical grounds but will fund unlimited private tutoring and therapy.**
  *   **Impairment-Threshold:** Would refer (school has duty to document impairment).
  *   **Mom's "Necessary Key" Rule:** Would not refer (support is unlocked without the label).
  *   **Looping-Effects:** Would not refer (respecting identity concerns).

  Regarding the field's consensus: It is **settled** that insurance companies require ICD/DSM codes for reimbursement and that the DSM-5 requires "clinically significant distress or impairment" for diagnosis. It is **contested** whether "impairment" should be defined strictly by functional output (grades/attendance) or include internal suffering, and it is **genuinely contested** within the philosophy of psychiatry whether Hacking's "looping effects" justify withholding a diagnosis that facilitates treatment. Mainstream practice generally prioritizes access to care over looping concerns, whereas critical psychiatry argues the looping effect is an ethical hazard that practitioners often ignore; your mom's explicit use of Hacking places her in a minority, highly reflective position that is not standard protocol.
