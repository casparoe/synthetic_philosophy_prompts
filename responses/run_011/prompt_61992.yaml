  ### BRAINSTORMING AND STRATEGIC NOTES (TO BE DELETED)

  **Framing the Central Question**
  1.  *The Verificationist Frame:* "Under what evidential conditions can environmental factors be verified as causes?" *Risk:* Too positivist. Implies there is a threshold of "proof" that settles the metaphysics, which ignores the theory-laden nature of observation.
  2.  *The Ontological Frame:* "Do volcanoes possess agency?" *Risk:* A dead end. You are not arguing volcanoes have intent, but that they have causal efficacy. This invites the very determinism critiques you wish to bypass.
  3.  *The Epistemic-Metaphysical Interface (Selected):* "Does the topological complexity of the inferential chain connecting a proxy to an event dictate whether that event is granted metaphysical status as a 'historical cause'?" *Rationale:* This allows you to use your geological expertise to diagnose philosophical resistance. It makes the answer determinate: you can map the chains and correlate their complexity with the historiographical resistance.

  **Weaknesses and Risks**
  *   *The "Better Data" Trap:* The biggest risk is that this devolves into a plea for scientists to be more careful rather than a philosophical argument about causation. You must insist that *even perfect data* involves inferential steps that philosophers have ignored. The argument is not that we need better proxies, but that the *structure* of proxy reliance is itself a philosophical problem.
  *   *The "Well-Worn" Objection:* Philosophers of science have discussed "evidential relevance" before. Your novelty lies in applying this specifically to the *politics of historical explanation* (the "determinism" charge). You must show that the "determinism" label is often a euphemism for "I don't trust your dating model."
  *   *Case Study Selection:*
      *   *Tambora (1816):* Essential. Short proxy chain (instrumental records + clear tephra + immediate harvest data). This is your control group.
      *   *Bronze Age Collapse:* Essential. Long, contested chain (pollen + sediment + radiocarbon with reservoir effects + textual interpretation). This is your stress test.
      *   *17th Century General Crisis:* **Cut.** Too reliant on historiographical debate rather than physical proxies. It muddies the water between climate data and political narrative.
      *   *6th Century Pandemic:* **Keep as备用 (Backup).** Good for contrasting biological vs. geological proxies, but if time is tight, the Bronze Age covers "long/contested chain" sufficiently.
      *   *Recommendation:* Focus strictly on Tambora vs. Bronze Age. The contrast between a "short/transparent" chain and a "long/contested" chain is the cleanest way to test your hypothesis.

  **Tone Check**
  Ensure you sound like a philosopher who understands the lab, not a geologist playing philosopher. Use the technical terms correctly but define them for the lay reader on the committee.

  ***

  ### PROJECT PROPOSAL

  **Title:** The Epistemic Architecture of Environmental Causation: Proxy Chains and the Metaphysics of Historical Agency

  **Research Question**
  To what extent does the topological complexity of the inferential chain connecting a physical proxy to a past event determine whether that event is granted metaphysical status as a "historical cause"?

  This question admits a determinate answer. I will not merely argue that evidence matters; I will demonstrate that specific structural features of evidential chains—specifically the number of independent calibration assumptions and the magnitude of chronological uncertainty—correlate directly with the intensity of philosophical and historiographical resistance to labeling an environmental factor as a cause. If resistance remains high despite a short, robust inferential chain, the objection is genuinely metaphysical (or political). If resistance scales with chain complexity, the objection is primarily epistemological misdescribed as metaphysical.

  **State of the Field**
  Current debate regarding non-human actors in history (volcanoes, pathogens, climate shifts) is stalled between two camps. One side argues for the inclusion of environmental factors as genuine causal agents; the other rejects this as "environmental determinism," claiming it strips human agents of responsibility. Both sides treat this as a metaphysical disagreement about the nature of causation or a political disagreement about accountability.

  This project argues that both sides are mistaken. They are debating a metaphysical question (what counts as a cause) while ignoring an epistemological precondition (how we know the cause existed). In the special sciences, a claim about a past environmental event rests not on observation but on a **proxy**: an indirect measure, such as sulphate concentrations in ice cores or pollen percentages in sediment. Linking a proxy to a historical event requires a chain of inference involving calibration assumptions, modelling choices, and corrections for phenomena like the **reservoir effect** (a distortion in radiocarbon dating caused by old carbon in the local environment).

  Existing philosophical accounts of historical causation typically treat causes as **INUS conditions** (an Insufficient but Non-redundant part of an Unnecessary but Sufficient condition) without analyzing the evidential cost of establishing that the condition existed at all. By failing to distinguish between the *ontology* of the cause and the *epistemology* of the proxy, the field conflates weak evidential chains with weak causal claims. My hypothesis is that the charge of "determinism" is often a placeholder for "I do not trust this chronology."

  **Method and Work Plan**
  I will employ a comparative case study method, analyzing the structure of the inferential chains in two distinct historical episodes.

  *   **Months 1–3: Conceptual Framework.** I will formalize the distinction between causal selection (metaphysics) and proxy reliability (epistemology). I will develop a metric for "inferential distance," quantifying the number of independent assumptions required to move from a physical sample to a historical date.
  *   **Months 4–6: Case Study A (Short Chain).** I will analyze the 1815 eruption of Tambora and the subsequent harvest failures of 1816. This case offers a short inferential chain: instrumental weather records, clear tephra layers, and contemporary documentary evidence align with minimal calibration. I will assess whether historiographical resistance to environmental causation is low here.
  *   **Months 7–9: Case Study B (Long Chain).** I will analyze the proposed climatic contributions to the Late Bronze Age Collapse in the Eastern Mediterranean. This case relies on a long, contested chain: pollen data, lake sediment records, and radiocarbon dating subject to significant reservoir effects and chronological modelling. I will assess whether resistance here correlates with the fragility of the dating models rather than the metaphysics of causation.
  *   **Months 10–12: Synthesis and Drafting.** I will compare the resistance profiles of both cases. If resistance scales with inferential distance, the hypothesis is supported. I will draft the final monograph and two companion articles.

  **Scope and Limitations**
  To fit the one-year timeline, I must exclude the 6th-century Pandemic and the 17th-century General Crisis. While the pandemic offers a valuable contrast between biological and geological proxies, the Bronze Age case sufficiently stresses the framework regarding chronological uncertainty. The 17th-century debate is too entangled with purely historiographical narratives to isolate the physical proxy chain. I will also limit the metaphysical scope: I am not solving the problem of causation generally, but only examining how evidential structures influence causal attribution in historical explanation.

  **Assessment of Results**
  *   **Success:** I produce a model showing a strong correlation between inferential chain complexity and the invocation of "determinism" as a critique, thereby re-categorizing a significant portion of the debate from metaphysical to epistemological.
  *   **Inconclusiveness:** The correlation is partial. Some resistance remains even in short-chain cases (suggesting a genuine political/metaphysical objection), or some long-chain cases are accepted (suggesting other factors are at play). This would still yield a valuable negative result, refining the taxonomy of the debate.
  *   **Failure:** I fail to distinguish the epistemological objection from the metaphysical one. If it turns out that historians reject environmental causes in the Bronze Age *even when* the proxy chain is robust, or accept them in 1816 *despite* gaps, then my hypothesis that the debate is "misdescribed" is false. This would indicate the resistance is indeed purely political or metaphysical, and the project would pivot to documenting that intransigence rather than resolving it.

  **Definitions for Non-Specialists**
  *   **Proxy:** An indirect measure of a past environmental condition (e.g., tree rings indicating past rainfall) used when direct observation is impossible.
  *   **Reservoir Effect:** A systematic error in radiocarbon dating that occurs when the carbon source in a sample is older than the atmosphere (common in marine or lake samples), requiring complex correction models.
  *   **INUS Condition:** A philosophical definition of a cause as an *I*nsufficient but *N*on-redundant part of an *U*nnecessary but *S*ufficient condition. (e.g., A spark is an INUS condition for a fire: it cannot burn the house alone [insufficient], but without it the fire wouldn't start [non-redundant], though other things could have started the fire [unnecessary], and if combined with oxygen and fuel it guarantees the fire [sufficient]).
