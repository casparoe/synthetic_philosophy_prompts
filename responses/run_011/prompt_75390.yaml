answer: |-
  You are correct to sense that a single slogan is doing too much work. In legal theory, the maxim *ignorantia juris non excusat* is a rule of adjudication. In ethics, the cognate slogan is often invoked as a metaphysical or normative claim. When participants in your reading group slide between these contexts without adjustment, they commit a category error.

  Below is a menu of five distinct propositions that the slogan might be expressing. I have separated them by the specific work they are doing (defining wrongness, assigning blame, guiding action, or managing institutions). For each, I provide the exact proposition, a verdict on its status, the conditions for its refutation, and an analysis of its relationship to the legal original.

  ### 1. The Objective Wrongness Thesis
  *   **The Proposition:** An act is morally wrong if it violates objective moral norms, regardless of whether the agent believes it violates those norms. (Focus: The Act)
  *   **Verdict:** **Substantive and Defensible** (within Moral Realism).
  *   **What would refute it:** Moral Subjectivism or Relativism. If you believe moral wrongness is *constituted* by the agent's sincere belief or their culture's endorsement, this thesis is false. If you are a realist (acts have moral properties independent of belief), this thesis is true.
  *   **Relation to your instances:** This is what the guest speaker meant regarding the historical doctor. The doctor's acts were objectively wrong even if subjectively well-intentioned.
  *   **Is it trivial?** It is not trivial, but it is **normatively weak**. Establishing that an act was wrong does not establish that the *agent* is blameworthy. A landslide is "bad" but not "blameworthy." This thesis secures the status of the act but leaves the status of the agent untouched.
  *   **Legal Artifact?** No. This is pure meta-ethics.

  ### 2. The Strict Blameworthiness Thesis
  *   **The Proposition:** An agent is blameworthy for performing an objectively wrong act even if their ignorance of the wrongness was reasonable and non-culpable. (Focus: The Agent)
  *   **Verdict:** **False** (in standard moral theory).
  *   **What would refute it:** Any intuitive case of non-culpable ignorance. Consider a person raised in an isolated society where a specific practice (e.g., a certain burial rite) is universally mandated and believed beneficial, with no access to contrary information. If they perform the rite, and we later learn it was harmful/wrong, most moral intuitions suggest they are not *blameworthy*, even if the act was *wrong*.
  *   **Relation to your instances:** This is the surface-level reading of your friend's claim about the great-grandfather. The friend asserts blame persists despite the ancestor's sincere belief.
  *   **Legal Artifact?** **Yes.** This is the closest moral translation of the legal maxim, but it fails in morality because it imports **institutional necessities** that do not apply to individual blame.
      *   *In Law:* We accept this thesis because allowing a defense of ignorance would make prosecution impossible (epistemic problem) and reduce the incentive to learn the law (deterrence problem).
      *   *In Morality:* There is no "prosecution" to frustrate, and "deterrence" is not the primary goal of blame. Therefore, the justification collapses. Moral blame generally requires a "control condition": you must have had a fair opportunity to avoid the wrong.

  ### 3. The Culpable Ignorance (Tracing) Thesis
  *   **The Proposition:** Ignorance excuses an agent from blame *only if* the ignorance itself is not culpable. If the agent is blameworthy for their ignorance (e.g., they avoided learning the truth due to bias, laziness, or willful blindness), they are blameworthy for the act performed in ignorance. (Focus: The History of the Agent)
  *   **Verdict:** **Substantive and Defensible.** This is the standard "tracing strategy" in moral philosophy.
  *   **What would refute it:** A demonstration that an agent can be blameworthy for a state of mind they had no control over and no prior opportunity to correct (a "brute" blame). Alternatively, showing that the "tracing" regress never stops (i.e., every prior failure was also due to non-culpable ignorance).
  *   **Relation to your instances:** This is the "separate move" you suspected. When your friend insists the great-grandfather is blameworthy, they are likely relying on this thesis implicitly: *He shouldn't have been ignorant; his ignorance was a result of privilege or indifference.*
  *   **Legal Artifact?** No. While law sometimes uses tracing (e.g., voluntary intoxication), the legal maxim often operates as **strict liability** (no tracing required). The moral version *requires* tracing to be defensible.
  *   **Note:** This thesis saves the slogan from falsity but changes its meaning. It no longer means "ignorance is no excuse"; it means "culpable ignorance is no excuse."

  ### 4. The Decision-Theoretic Thesis (Moral Uncertainty)
  *   **The Proposition:** When an agent has non-zero credence that an act is seriously wrong, they are obliged to act as though the stricter moral view is true, provided the expected moral cost of error is asymmetrical. (Focus: Action Guidance)
  *   **Verdict:** **Substantive and Contingent.** It depends on the mechanics of "maximizing expected choiceworthiness."
  *   **What would refute it:** A calculation showing that the expected value of the permissive option is higher. For example, if you are 50% sure eating meat is wrong, but 100% sure that starving yourself causes severe harm, the "stricter view" (don't eat) might actually yield lower expected moral value depending on how you weight the harms.
  *   **Relation to your instances:** This is the claim operating in the meat-eating discussion. The member was told that 50/50 uncertainty doesn't grant permission.
  *   **Does the slogan license this?** **No.** The slogan "ignorance is no excuse" is a clumsy shorthand for this. The actual justification requires **Decision Theory under Moral Uncertainty**.
  *   **What must be true about credences?** For the "follow the stricter view" command to hold, two conditions must be met:
      1.  **Asymmetry of Stakes:** The moral cost of committing a wrong (killing an animal) must vastly outweigh the moral cost of forgoing a permissible pleasure (eating meat).
      2.  **Threshold Credence:** The credence in the stricter view must be high enough that the *expected disvalue* of the act outweighs the *expected value* of the alternative.
      *   If the agent is truly at "even odds" (0.5 credence), the command to abstain follows *only if* the badness of killing is more than double the badness of missing out on the meal (roughly). The slogan obscures this calculation.

  ### 5. The Institutional Impunity Thesis (The Actual Legal Maxim)
  *   **The Proposition:** The state will not accept evidence of a defendant's ignorance of the statute as a valid defense against conviction, regardless of the reasonableness of that ignorance. (Focus: Adjudication)
  *   **Verdict:** **True (as positive law) and Defensible (as policy).**
  *   **What would refute it:** A change in legislative policy or a constitutional ruling requiring *mens rea* regarding legal status (rare).
  *   **Relation to your instances:** This is what you learned in criminal law.
  *   **Why it doesn't translate:** This thesis rests on three pillars that do not exist in morality:
      1.  **Publicity:** Laws are promulgated texts; moral truths are not always codified.
      2.  **Proof:** Courts cannot reliably adjudicate the internal state of a defendant's knowledge without inviting perjury ("floodgates"). Moral interlocutors can debate sincerity more freely.
      3.  **Uniformity:** The state requires a bright-line rule for social order. Morality can afford nuance (e.g., "you are less blameworthy, though the act was wrong").

  ---

  ### Synthesis and Direct Answers to Your Queries

  **1. Which readings are artifacts of the legal setting?**
  **Claim 2 (Strict Blameworthiness)** and **Claim 5 (Institutional Impunity)** are legal artifacts. They rely on the necessity of administrative efficiency and the deterrence of willful blindness regarding *promulgated rules*. These considerations **do not survive translation** into moral blame. In morality, we care about the agent's rational relationship to the good, not the efficiency of the blame-practice. If a moral agent reasonably believed an act was right, calling them "blameworthy" (Claim 2) is usually a category mistake, whereas convicting them (Claim 5) is a policy necessity.

  **2. Separating Wrongness, Blame, and Degree.**
  *   **Claim 1** secures **Wrongness** (The act was bad).
  *   **Claim 2** secures **Blame** (The agent is at fault) but is generally false in morality.
  *   **Claim 3** secures **Blame** via history (The agent is at fault for *becoming* ignorant).
  *   **Claim 4** secures **Action** (What to do next).
  *   **Degree of Blame:** None of these slogans address degree, but Claim 3 implies it. If the ignorance was only slightly culpable (e.g., a minor oversight), the blame for the act should be mitigated. The legal maxim explicitly rejects mitigation based on ignorance; the moral maxim should invite it.

  **3. Is there a reading that is true but too weak to be worth repeating?**
  Yes, **Claim 1 (Objective Wrongness)**. It is true (for realists), but it is "weak" because it is compatible with the agent being entirely blameless. If your reading group uses the slogan to shame someone, but all they have established is Claim 1, they have committed a non-sequitur. They have proved the *act* was bad, but not that the *person* is bad.

  **4. Is the "Tracing Strategy" one of the readings or a separate move?**
  It is a **separate move** (Claim 3). The slogan "Ignorance is no excuse" suggests ignorance is *irrelevant* to blame. The Tracing Strategy suggests ignorance is *relevant* only insofar as it is the product of prior blame. Defenders of the slogan often retreat to the Tracing Strategy when pressed, but logically, they are distinct. The slogan implies strict liability; the tracing strategy implies fault-based liability.

  **5. The Meat-Eating Case (Uncertainty).**
  Which reading licenses telling the uncertain eater to stop?
  *   It is **not Claim 2** (Strict Blameworthiness). That applies to people who *think* they are right. The eater knows they are uncertain.
  *   It is **Claim 4 (Decision-Theoretic)**.
  *   **What must be true about credences?** The slogan "ignorance is no excuse" is a misleading way of stating a **Maximin** or **Expected Value** principle. To license the command "you must act on the stricter view," the following must hold:
      $$ P(\text{Wrong}) \times \text{Disvalue}(\text{Wrong}) > P(\text{Permissible}) \times \text{Disvalue}(\text{Missing Out}) $$
      If the eater is at "even odds" (0.5), the command holds only if the Disvalue of Killing is significantly higher than the Disvalue of Dietary Restriction. If the eater believed the moral status was truly 50/50 *and* believed the stakes were symmetrical, the slogan provides no guidance. The slogan works here only as a rhetorical shove to inflate the perceived $P(\text{Wrong})$ or the $\text{Disvalue}(\text{Wrong})$.

  ### Summary for your Objection
  When you object in your reading group, you can specify:
  1.  If they mean **Objective Wrongness** (Claim 1), they are right, but they haven't proved the agent is blameworthy.
  2.  If they mean **Strict Blameworthiness** (Claim 2), they are importing a legal rule that fails in morality because moral blame requires culpability.
  3.  If they mean **Culpable Ignorance** (Claim 3), they need to prove the agent was *negligent* in forming their belief, not just that the belief was false.
  4.  If they mean **Decision Under Uncertainty** (Claim 4), they need to do the math on expected moral value, not just wave the slogan.

  The slogan migrates because it sounds profound in all five contexts, but it is only *true* in the legal context (Claim 5) and the meta-ethical context (Claim 1). In the contexts that matter most to your group (blame and action), it is either false (Claim 2) or incomplete (Claims 3 & 4).
