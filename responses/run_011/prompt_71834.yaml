answer: |-
  Your unease is well-founded. You have spotted two genuine errors in your friend's write-up, and your intuition on the 3x2 game is correct while his reasoning is flawed. Your friend has conflated three distinct concepts: **strict dominance**, **best responses**, and **mixed strategies**. In simple two-player games, these often overlap enough to hide the cracks, but in the games you play (poker, multi-player board games), the cracks widen into gaps.

  Here is the sentence-by-sentence audit you requested, followed by the specific corrections for your group.

  ### Part 1: Sentence-by-Sentence Audit

  **1. "There is a way to solve many games with no machinery beyond common sense."**
  *   **Verdict:** **Correct.**
  *   **Comment:** This refers to *Iterated Elimination of Strictly Dominated Strategies* (IESDS). It is the bedrock of rationalizability.
  *   **Confidence:** 100%.

  **2. "Call one of your options dominated when some other option of yours does better against everything your opponents might do."**
  *   **Verdict:** **Correct (with a caveat).**
  *   **Comment:** This defines *strict* dominance. The caveat is that "everything your opponents might do" must include every *combination* of opponent moves. In a 3-player game, you must check against every pair of moves the other two might make together.
  *   **Confidence:** 100%.

  **3. "Nobody rational plays a dominated option, so cross it out."**
  *   **Verdict:** **Correct.**
  *   **Comment:** If Option A always yields less money than Option B, a rational player seeking to maximize money will not play A.
  *   **Confidence:** 100%.

  **4. "Once it is gone, further options become dominated, because your opponents now have fewer sensible choices available to them; cross those out too, and keep going until nothing more can go."**
  *   **Verdict:** **Correct.**
  *   **Comment:** This describes the *iteration* process. Knowing your opponent is rational allows you to assume they won't play the dominated option you just crossed out, which might make *their* other options dominated.
  *   **Confidence:** 100%.

  **5. "First, it does not matter what order you do the crossings in — you always land on the same leftover set."**
  *   **Verdict:** **Correct (for strict dominance).**
  *   **Comment:** If you only cross out options that are *strictly* worse (as defined in sentence 2), the order does not matter. If you cross out options that are only *weakly* worse (equal in some cases, worse in others), order *does* matter. Your friend implies strict dominance here, so he is safe.
  *   **Confidence:** 100%.

  **6. "Second, whatever survives is what a rational player will play, so in small games the procedure finishes the job and you never need to reach for an equilibrium concept."**
  *   **Verdict:** **Wrong / Misleading.**
  *   **Comment:** This is the most dangerous sentence for your group. Survival is a *necessary* condition for rational play, not a *sufficient* one. Often, multiple options survive. Rationality alone does not tell you *which* of the survivors to pick. You often *do* need an equilibrium concept (like Nash Equilibrium) to predict which survivor players will coordinate on.
  *   **Confidence:** 100%.

  **7. "Third, you only ever have to compare one option against one option: a mixed strategy is just a lottery over your pure options, so if no single pure option beats a given option, no combination of them can either."**
  *   **Verdict:** **Mathematically False.**
  *   **Comment:** This is the error in your 3x2 example. A mixture of two options can beat a third option even if neither pure option beats it alone. This is the mathematical property of convexity.
  *   **Confidence:** 100%.

  **8. "In practice you can apply a cheaper test that comes to the same thing — an option gets crossed out exactly when it could never be your best reply to anything the opponents might do..."**
  *   **Verdict:** **Loose / Context Dependent.**
  *   **Comment:** In 2-player games, a strategy is strictly dominated if and only if it is never a best response (provided we allow mixed strategies to do the dominating). In games with 3+ players, this equivalence can break depending on whether opponents can correlate their strategies.
  *   **Confidence:** 95%.

  **9. "...and in most games you can also drop any option that is never better than another and is worse in at least one case, since dropping those cannot hurt."**
  *   **Verdict:** **Dangerous.**
  *   **Comment:** This describes *weak* dominance. Dropping weakly dominated strategies *can* hurt: it can eliminate valid Nash Equilibria and the order of elimination changes the result. For a casual group, this often leads to arguments about "what if he plays the stupid thing?"
  *   **Confidence:** 100%.

  ---

  ### Part 2: Addressing Your Two Uneasy Points

  #### 1. The Multi-Player Problem
  Your friend writes: *"an option gets crossed out exactly when it could never be your best reply."*

  In a **two-player** game, this is effectively true (assuming we check against mixed strategies). If a strategy is never a best response to anything the single opponent does, it is dominated.

  In a **three-or-more-player** game, this is trickier. Your best reply depends on what you think the *other opponents* will do. If you assume Opponent B and Opponent C choose their moves independently, there are some combinations of moves they might make that are impossible to generate independently (correlated beliefs).
  *   **The Risk:** A strategy might be a "best reply" to a scenario where B and C coordinate against you, but not a best reply to any scenario where they act independently.
  *   **For your group:** In poker and board games, opponents usually act independently. Your friend's shortcut is *mostly* safe for your group, but strictly speaking, "Never a Best Reply" is a slightly wider category than "Dominated" in multi-player settings if you restrict opponents to independent play.
  *   **Verdict:** Loose, but likely harmless for poker/board games unless bluffing involves complex correlation.

  #### 2. The 3x2 Matrix (The Mixed Strategy Error)
  Your intuition was perfect. Your friend's logic was wrong.

  **The Game:**
  *   **Row 1:** Pays 1 if Column 1, 0 if Column 2.
  *   **Row 2:** Pays 0 if Column 1, 1 if Column 2.
  *   **Row 3:** Pays 0.25 always.

  **Your Friend's Claim:** "If no single pure option beats a given option, no combination of them can either."
  **The Reality:** Row 3 is dominated, but only by a **mixture** of Row 1 and Row 2.

  **The Whiteboard Example:**
  Tell your group: "Suppose I flip a coin. Heads I play Row 1, Tails I play Row 2."
  *   If Column 1 is played: I get 1 (Heads) or 0 (Tails). Average = **0.5**.
  *   If Column 2 is played: I get 0 (Heads) or 1 (Tails). Average = **0.5**.
  *   **Result:** This coin-flip strategy pays 0.5 against *both* columns.
  *   **Comparison:** Row 3 pays 0.25 against *both* columns.
  *   **Conclusion:** The mixture beats Row 3 everywhere. Row 3 is dominated and should be crossed out. Your friend's rule failed to see this because he forbade mixing.

  **Why this matters for Poker:** In poker, "mixing" is bluffing frequencies. If you only check if "Always Bluff" or "Never Bluff" dominates "Sometimes Bluff," you will miss the optimal strategy. Optimal poker strategy is almost always a mixture.

  ---

  ### Part 3: Correcting Feature 2

  Your friend wrote: *"Whatever survives is what a rational player will play."*
  This is the sentence your group will quote for years, so it must be precise.

  **The Problem:** In many games (like Battle of the Sexes or simple coordination games), *everything* survives elimination, but rational players still need to agree on *which* one to play. Survival doesn't mean "will play"; it means "might play."

  **The Correction:**
  > "Whatever survives is **consistent with rationality**, but rational players may still need to coordinate to decide which survivor to pick."

  Or, if you want to be more technical but still clear:
  > "Whatever survives is **rationalizable**, but this procedure rarely solves the game completely; it only narrows the field."

  **Whiteboard Explanation for the Group:**
  Draw a simple coordination game:
  *   If we both pick A, we get $10 each.
  *   If we both pick B, we get $10 each.
  *   If we mismatch, we get $0.
  *   **Ask:** "Can we cross out A? No, because if he plays A, I should play A. Can we cross out B? No, because if he plays B, I should play B."
  *   **Result:** Both A and B survive the elimination process.
  *   **Lesson:** The procedure didn't tell us what to play. It only told us not to play 'C' (if there was a 'C' that paid $0 always). Rationality alone doesn't solve coordination; you need expectations or equilibrium.

  ---

  ### Part 4: Confidence and The "Least Sure" Claim

  **Confidence in Verdicts:**
  I am **100% confident** that the friend's claim about mixed strategies ("no combination of them can either") is mathematically false. I am **100% confident** that your intuition on the 3x2 game was correct. I am **100% confident** that Feature 2 is misleading regarding prediction.

  **The One Claim I Am Least Sure Of:**
  In my audit of Sentence 8, I stated: *"In games with 3+ players, this equivalence [Dominated iff Never a Best Response] can break depending on whether opponents can correlate their strategies."*

  **Why I am less sure:**
  While the mathematical distinction between *correlated* and *independent* beliefs in 3+ player games is well-established in advanced literature (Pearce's Lemma vs. Nash assumptions), the precise boundary of how this should be taught to non-mathematicians is pedagogical. Some theorists argue that "best response" implicitly allows for correlated beliefs about opponents (as if they share a signal), while others insist on independence.
  **What would settle it:**
  Consulting the specific definition of "rationalizability" in games with $N > 2$ players in a standard graduate text (like Fudenberg & Tirole or Osborne & Rubinstein) regarding whether the definition of "best response" assumes opponents' strategies are independent product measures or arbitrary joint distributions. If the definition assumes independence, the equivalence fails. If it allows correlation, the equivalence holds. For your group's purpose (poker/board games), opponents are independent, so the equivalence *practically* fails, but the *theoretical* statement depends on the definition chosen.

  ### Summary for your Thursday Night Group

  1.  **Your friend is right about the basics:** Cross out options that are always worse. Do it again.
  2.  **Your friend is wrong about mixing:** You must check if a *mixture* of options beats a single option. (Use your 3x2 example on the whiteboard; it will take 2 minutes).
  3.  **Your friend is wrong about prediction:** Surviving the cut doesn't mean "Play This." It means "Don't Play That." You still have to figure out which survivor to pick.
  4.  **Your intuition is good:** Trust your gut on the 0.25 row. It was dominated by a 50/50 mix of the others.
