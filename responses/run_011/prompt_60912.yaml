answer: |-
  Based on Commissioner Ruiz's seven prior votes, four distinct decision rules emerge that explain her behavior with varying degrees of precision.

  **Rule 1: Local Procedural Compliance.** Vote Yes if the project proceeds as-of-right under existing local zoning or overlays. Vote No if the project requires variances, special permits, or relies on state statutes to override local limits.
  *Fit:* 7/7. Votes 1, 3, 4, and 6 were compliant with local code (Yes). Votes 2 and 5 required discretionary relief (No). Vote 7 opposed a state mandate overriding local authority (No).

  **Rule 2: Net Community Asset Preservation.** Vote Yes if the project adds housing without destroying existing rental units or established community amenities. Vote No if it demolishes housing or paves long-standing community spaces.
  *Fit:* 6/7. Votes 1, 3, 4, and 6 involved vacant sites or no loss of assets (Yes). Votes 2 and 5 involved demolition or paving a garden (No). Vote 7 is the exception, as it concerned legislation with no physical site.

  **Rule 3: Zone-Scale Congruence.** Vote Yes for high density in high-density zones (downtown/TOD) and small density anywhere. Vote No for high density in single-family zones.
  *Fit:* 7/7. Votes 3 and 6 were high/moderate density in appropriate zones (Yes). Vote 1 was small density citywide (Yes). Votes 2 and 5 were large structures in neighborhood zones (No). Vote 7 would have forced high density in single-family zones (No).

  **Rule 4: Affordability-Plus.** Vote Yes for affordable housing only if paired with procedural compliance or location suitability. Affordability alone is insufficient.
  *Fit:* 7/7. Vote 5 was 100% affordable but failed on process/location (No). Vote 3 and 6 had affordable components and passed on process/location (Yes). Vote 7 was rejected partly because it might not produce below-market units (No).

  **Predictions and Best Guess**
  Under Rule 1 (Local Compliance), Ruiz votes **No**, because the project uses a state statute to override local height and parking limits. Under Rule 2 (Asset Preservation), she votes **Yes**, as the site is vacant with no housing or garden loss. Under Rule 3 (Zone-Scale), she votes **No**, because a six-story building violates the scale of a single-family zone. Under Rule 4 (Affordability-Plus), she votes **No**, because the affordability is not paired with local procedural compliance.

  My single best guess is **No**. While Rule 2 suggests approval due to the vacant lot, the interaction of Votes 2, 3, 5, and 7 prioritizes process and zone congruence over housing production. Vote 5 is critical: a 100% affordable project failed because it required a special permit in a single-family zone and impacted a community amenity. The new matter shares the single-family zone conflict and the procedural irregularity (state override vs. local permit). Vote 7 reinforces this; she explicitly rejected state legislation that would dictate local zoning outcomes, citing local commission authority. Vote 3 shows she supports large density, but only within the designated TOD core where local law permits it. Vote 2 shows she rejects variances even near transit. Consequently, the state density bonus statute functions like the variance in Vote 2 and the state bill in Vote 7: an external or discretionary override of local zoning standards. Despite the strong affordability case, Ruiz's record suggests she views the preservation of local zoning authority and zone-scale matching as prerequisites for approval.

  **Analogs**
  The **closest analog** is Vote 7. Both matters involve state statutes attempting to override local zoning limits (height/density vs. single-family exclusivity). In Vote 7, she prioritized local commission authority over state mandates. In the new matter, the state density bonus similarly bypasses the local commission's zoning power. The features doing the analogical work are the legal mechanism (state override) and the threat to local autonomy.

  The **most misleadingly similar** analog is Vote 5. Both projects are 100% deed-restricted affordable housing proposed for single-family zones. A superficial reading suggests Ruiz opposes affordable housing in neighborhoods. However, Vote 5 failed due to the special permit process and the loss of a community garden. The new matter avoids the garden loss but retains the procedural conflict. Relying on Vote 5 alone ignores the procedural nuance that likely drove the rejection.

  **Hypotheticals and Question**
  To discriminate between Rule 1 (Local Compliance) and Rule 2 (Asset Preservation), consider these proposals:
  1.  **Local Override:** The town council amends local zoning to allow a six-story affordable building on this specific vacant lot by right.
      *   *Rule 1:* Yes (Local law). *Rule 2:* Yes (Vacant).
      *   *Discrimination:* If she votes No, she opposes the scale regardless of process (Rule 3).
  2.  **State Mandate ADUs:** A state bill mandates ADUs by right (like Vote 1) but overrides local parking limits.
      *   *Rule 1:* No (State override). *Rule 2:* Yes (No displacement).
      *   *Discrimination:* If she votes Yes, Rule 1 fails; she prioritizes housing output over local control.

  Alternatively, ask her: *"Does the source of zoning authority (state statute vs. local ordinance) determine your vote when the housing outcome is identical?"*
  *   **Answer "Yes":** Implies Rule 1 dominates; she will vote No on the current matter.
  *   **Answer "No":** Implies Rule 2 or 4 dominates; she may vote Yes based on affordability and vacant status.

  **Principle Adoption**
  If her record underdetermines this case, her vote commits her to a governing principle for future conflicts between housing production and local control. By voting **Yes**, she endorses the principle that affordable housing production justifies overriding local zoning autonomy and scale standards, even in wealthy, low-displacement tracts. She signals that state tools are valid substitutes for local planning. By voting **No**, she endorses the principle that local zoning authority and neighborhood scale character are paramount, even when state law provides a mechanism to produce affordable housing on vacant land. She signals that procedural legitimacy outweighs housing outcomes when the two conflict. Given Vote 7, the latter commitment is more consistent with her established record.
