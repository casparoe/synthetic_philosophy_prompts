answer: |-
  Welcome. Look around the room. You know why you are here, and you know who else is here. Some of you study how people choose. Some of you study what people ought to choose. And some of you are living the choice we are about to dissect.

  I am not going to start by telling we all want what is best for the town. We do not agree on what "best" means. I am not going to tell we all care about the river. We do not agree on what the river is for. If we agreed on those things, we would not need this workshop. We would just need a calculator.

  We are here because the disagreements are real. They are not misunderstandings waiting to be cleared up with better data. They are not conflicts waiting to be softened with kinder words. They are irreducible. One side sees a sacred obligation that cannot be touched. The other sees a material necessity that cannot be ignored. For two years, that gap produced nothing but silence and lawyers.

  Then, a shape appeared.

  The company needed depth. The coalition needed the ridge. It turned out the deep seam ran south, away from the burial ground. But digging south flooded the haul road. So the deal was not money for trees. The deal was about who pays to move the road, and in what order the dirt gets moved. The coalition kept the ridge. The company kept the depth. Both sides ended up with more of the thing they said was non-negotiable than the stalemate ever gave them.

  I want to make a claim about why that happened. It is not because we found a compromise. It is because we found a difference.

  When everyone values the same things in the same way, there is nothing to trade. There is only a fight over who wins. If you and I both value the ridge exactly alike, and we both value the jobs exactly alike, one of us must lose. But when value systems differ, the same features of a situation get weighted differently. That weight difference is what makes exchange possible. The company weighted the seam higher than the road. The coalition weighted the ridge higher than the jobs. That mismatch is not an obstacle. It is the asset. Where everyone agrees, there is war. Where everyone disagrees, there is trade.

  But I know what some of you are thinking. I need to say it out loud.

  There is an objection that says: finding a trade is not the same as finding justice. Just because a deal exists does not mean it is legitimate. If the ridge genuinely has no number, then a deal that leaves it standing while selling off everything around it is still a sale. It is just a slower one. You have not respected the value; you have just found a workaround that lets the machine keep running. To some of you, putting the word "trade" next to the word "value" is the corruption we should be studying, not the solution we should be celebrating.

  I am not going to answer that objection this morning. It is the right objection. It must stay in the room. If we spend these two days pretending that efficiency equals morality, we will waste our time. A deal can be stable and still be wrong. We need to hold that tension.

  There is another tension we need to hold, specifically about how we measure success. We often say a deal is good because it is "better than no deal." We treat the stalemate as the neutral starting point. We say everyone gained because they are better off than they were when nothing was happening.

  But the stalemate was not neutral. The standstill wasn't an accident of nature. It was built by rules about who gets to say stop. The reason nothing was happening for two years was because one side had the legal standing to block the trucks, and the other had the capital to wait them out. The starting line was drawn by power. So when we say "everyone gained," we have to ask: gained compared to what? If the baseline was already tilted, then moving away from it might just lock in the tilt. Whether a deal counts as everybody gaining depends entirely on what you measure the gain against. We are not going to resolve that question today. But we cannot do the work if we pretend the starting point was clean.

  So, what are we doing here for the next two days?

  We are not here to settle the quarry question. That decision belongs to the people who live with the dust and the payroll, not to us in this room. We are not here to write a policy. We are not here to declare a winner.

  We are here to understand the mechanism. We are here to look at how bargaining works when the disagreement is not about facts, but about worth. We are here to see if we can map the shape of a deal without flattening the values that made it hard to reach.

  The economists in this room will look for the incentives. The philosophers will look for the legitimacy. The community members will look for the reality on the ground. I am asking you to keep all three eyes open. If we lose the incentives, the deal collapses. If we lose the legitimacy, the deal is poison. If we lose the reality, the deal is a fantasy.

  We have eight hours of session time. We have a case that is messy enough to resist easy answers. We have a room full of people who disagree enough to make it difficult. That is the right condition for this work.

  Let's begin.
