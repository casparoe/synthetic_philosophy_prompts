      *   **Filter Analysis:** The filter is **variable selection**. Is it principled? Woodward argues it's based on "serious possibility" and invariance. Critics (e.g., Zhong) argue this smuggles in normative judgments about what counts as a "serious" variable, effectively hiding the Normative Account's machinery inside the model setup.

  *   **Normative / Default-Relativity (McGrath, Hall, Hitchcock)** | **Score: 9/10**
      *   **Worst Case:** *The Forgetful Gardener.*
      *   **Why:** This theory excels at *The Crowd* and *Rosebush* (duty/normality distinguishes cause from background). But *Gardener* requires causation *into* an absence (sleep -> forgetting). If absences are only causes relative to a default, can they also be *effects* relative to a prior cause? Some default accounts struggle to model the *etiology* of the omission without collapsing the omission into a positive state (e.g., "being in a state of forgetting").
      *   **Filter Analysis:** The filter is **normality/duty**. Is it principled? This is the most contested premise in the field. Proponents say it's metaphysical (defaults are part of the causal structure). Critics say it's reverse-engineered bookkeeping to save intuitions about responsibility (conflating causation with blame).

