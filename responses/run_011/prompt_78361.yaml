  **Most Likely Overturn:**
  The ranking of **Interventionism vs. Normative/Default-Relativity**.
  Many specialists (e.g., Hitchcock) view these as compatible or even identical in practice. Others (e.g., Hall) see them as distinct metaphysical commitments. A room of experts would likely debate whether Interventionism *solves* the problem or just *relocates* the normative judgment into the model-building phase. Expect a strong faction to argue they should be tied for first, and another to argue Interventionism is just "Normative theory with math."

  ---

  ### Live Debates & Contested Premises (For Class Use)

  **1. The "Principled Filter" Problem (Live Debate)**
  *   **The Issue:** Both Interventionist and Normative accounts save *The Crowd* and *The Rosebush* by filtering out the Stranger/Queen.
  *   **The Contested Premise:** Is this filter **metaphysical** (about the structure of the world) or **pragmatic** (about our interests)?
  *   **Class Pressure Point:** Press the Interventionists: "Why is the Queen not a variable? Is it because she *can't* water it (physics), or because it's *silly* to think she would (norms)?" If they say the latter, they are relying on the Normative Account. If they say the former, they struggle with *The Gatekeepers* (where the drugged guard *can't* move, but we still judge the other guard).

  **2. Omission as Cause vs. Omission as Explanation (Live Debate)**
  *   **The Issue:** Eliminativists and Process Theorists argue that "The babysitter caused the death" is true as an *explanation* but false as *metaphysics*.
  *   **The Contested Premise:** Does your seminar assume causation is a **relation in the world** or a **tool for inquiry**?
  *   **Class Pressure Point:** If a student defends Eliminativism, don't mark them wrong. Ask: "If it's not causation, what relation is it?" This forces the distinction between *causal production* (process) and *causal dependence* (counterfactual).

  **3. Causation *Into* Absences (The Forgetful Gardener)**
  *   **The Issue:** Most theories handle omissions as *causes*. Fewer handle them as *effects*.
  *   **The Contested Premise:** Can an absence be an effect?
  *   **Class Pressure Point:** If "not watering" is caused by "forgetting," is "forgetting" a positive state causing a negative state? This tests whether the theory treats absences as ontological nothings (which can't be effects) or as real relata. This is genuinely unsettled; even top papers disagree on whether transitivity holds through absences.

  **4. The "Could Have Done Otherwise" Trap (The Gatekeepers)**
  *   **The Issue:** This case tests the link between **ability** and **causation**.
  *   **The Contested Premise:** Is "could have done otherwise" a causal condition or a moral condition?
  *   **Class Pressure Point:** Counterfactual theories struggle here because the closest world where the drugged guard moves is a "miracle" world. Interventionists handle it via variable domains. But if students say the drugged guard isn't a cause because she *couldn't* move, ask: "If a boulder blocked the gate, is the boulder a cause?" This separates *causal capacity* from *moral agency*.

  ### Final Recommendation
  Your battery is strong, but **tighten the Greenhouse**. Ensure the timing of the Overheat vs. the Drain is explicit, or it becomes a puzzle about physics rather than omission. Cut **The Rosebush** to save time for the *Gatekeepers* and *Gardener*, which probe the edges of the theories (ability and etiology) better than the Queen/Stranger redundancy.

  Be explicit with your students: **"I am ranking these theories by how well they save our intuitions, not by whether they are true. The fact that they need filters to save our intuitions might mean the intuitions are wrong."** That is the only way to prevent the seminar from becoming a defense of pre-existing biases.
