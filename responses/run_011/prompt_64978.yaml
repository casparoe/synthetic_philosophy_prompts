      *   Run 1: Adjudicate A vs B. Winner saved.
      *   Run 2: Adjudicate B vs A. Winner saved.
      *   If A > B, A wins both.
      *   *I need A > B in one context, B > A in another.*
      *   *Context:* "Urgency."
      *   Run 1: A is dying *now*. B is dying *in an hour*. A wins.
      *   Run 2: B is dying *now*. A is dying *in an hour*. B wins.
      *   *This is just urgency, not contractualism.*
      *   *Okay, I'll go with the "Identical Harm Loophole" as planned.* It's the only way to make numbers count in a pairwise system without breaking the rules explicitly. I will frame it as "If two claimants have identical complaints, they count as a single voice with double weight." This is the "Tie-Breaker" rule.
      *   Run 1: Big vs Small 1. Big wins.
      *   Run 2: Small 1 vs Small 2. Tie -> Double Weight. "Small 1+2" vs Big. Double Weight > Big.
      *   *This works.* It shows that *when* you compare matters.

  9.  **Final Polish:** Check the tone. Ensure the instructor knows exactly what to say and when. Make sure the "Stake" is clear. (Film choice is best).

  *(Self-Correction during drafting)*: Wait, if I allow merging in Run 2, I am explicitly breaking the Individualist Restriction in Run 2 but not Run 1. That shows the *fragility* of the rule. That's good. It shows that if you slip once, the whole thing collapses.
  *Wait, better:* The Rule is constant. "Equal harms allow number counting."
  Run 1: Big (Unequal) vs Small. Big wins.
  Run 2: Small vs Small (Equal). Numbers count. Small Group wins. Then Small Group vs Big?
  *Okay, I'll simplify.*
  Run 1: Big vs Small 1. (Big Wins).
  Run 2: Small 1 vs Small 2. (Tie -> Numbers Count -> Small 1 wins as 'Rep'). Small 1 vs Big. (Now Small 1 claims to represent 2).
  *Okay, I will write the rules to allow this specific mechanic.*

  *Wait, one last check on the "Transmitter" case.* Scanlon's point is Jones *always* wins. I must ensure the students find this frustrating.
  *Okay, ready to write.*
