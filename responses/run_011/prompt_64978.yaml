  # Activity: The Pairwise Tribunal

  **Time:** 75 minutes
  **Class Size:** 18 students (3 tables of 6)
  **Materials:** Printed Dossiers (3 sets), Timer, Bell/Gavel, Whiteboard (for verdicts).
  **Stake:** The collective verdict of the "Nastier Case" determines the **Final Film Screening** (Option A: *The Lives of Others* vs. Option B: *Monty Python and the Holy Grail*).

  ---

  ## 1. Setup & Rules (5 Minutes)
  *Do not lecture. Do not mention Scanlon, contractualism, or aggregation.*

  **Room Arrangement:** 3 Tables. 6 Students per table.
  **Roles (at each table):**
  *   **2 Adjudicators:** Hold the dossiers, enforce time, cast the deciding vote if deadlocked.
  *   **4 Claimants:** Each holds a "Complaint Card."

  **The Rules of Order (Read Aloud):**
  1.  **Pairwise Only:** Comparisons happen One-on-One. You may never speak for anyone but yourself.
  2.  **The Restriction:** You may only compare your harm against the person directly opposite you. You cannot mention people not at the table.
  3.  **The Tie-Breaker:** If two harms are deemed **Identical** by the Adjudicators, the claimant with more *potential supporters* (listed on their card) wins. If harms are **Different**, the greater harm wins, regardless of supporters.
  4.  **The Stake:** The Tribunal's final verdict on Case 3 decides the class film.

  ---

  ## 2. Case 1: The Warm-Up (Identical Harms) (10 Minutes)
  *Goal: Establish that numbers count ONLY when harms are identical.*

  **Scenario:** The Department Budget.
  **Policy:** Cut funding for Student Clubs.
  **Claimants:**
  *   **Claimant A:** President of Chess Club. Loss: $500. (Supporters: 10 members).
  *   **Claimant B:** President of Rowing Club. Loss: $500. (Supporters: 50 members).
  *   **Claimant C:** President of Drama Club. Loss: $500. (Supporters: 100 members).

  **Procedure:**
  1.  Adjudicators compare A vs B.
      *   *Harm:* Identical ($500).
      *   *Rule:* Supporters count. B wins.
  2.  Adjudicators compare Winner (B) vs C.
      *   *Harm:* Identical ($500).
      *   *Rule:* Supporters count. C wins.
  **Verdict:** Fund Drama Club.
  **Debrief Note (Instructor only):** Notice how easily the "Many" won here? Remember this feeling.

  ---

  ## 3. Case 2: The Transmitter (Unequal Harms) (15 Minutes)
  *Goal: Hit the wall. Numbers stop counting.*

  **Scenario:** The Broadcast Tower.
  **Policy:** Keep the tower running during a storm.
  **Claimants:**
  *   **Claimant Jones:** Technician pinned under machinery. Loss: Leg Crushed (Permanent Disability). (Supporters: 1).
  *   **Claimant Fan 1:** Viewer. Loss: Miss end of World Cup Final. (Supporters: 1,000,000).
  *   **Claimant Fan 2:** Viewer. Loss: Miss end of World Cup Final. (Supporters: 1,000,000).

  **Procedure:**
  1.  Adjudicators compare Jones vs Fan 1.
      *   *Harm:* Different (Leg vs Disappointment).
      *   *Rule:* Greater Harm wins. Supporters **ignored**.
      *   *Result:* Jones wins.
  2.  Adjudicators compare Jones vs Fan 2.
      *   *Result:* Jones wins.
  **Verdict:** Save Jones. Ruin the match for the million.
  **Reaction:** Students will likely find this intuitive but harsh. Let it sit.

  ---

  ## 4. Case 3: The Nastier Case (The Flip) (30 Minutes)
  *Goal: Expose procedural arbitrariness. Run this TWICE with different orders.*

  **Scenario:** The Lifeboat Generator.
  **Stake:** If "The One" wins -> Screen *The Lives of Others*. If "The Five" win -> Screen *Monty Python*.
  **Claimants:**
  *   **Claimant A (The One):** Heart condition. Power loss = Death. (Supporters: 1).
  *   **Claimant B (The Five - Rep 1):** Kidney failure. Power loss = Permanent Dialysis. (Supporters: 1).
  *   **Claimant C (The Five - Rep 2):** Kidney failure. Power loss = Permanent Dialysis. (Supporters: 1).
      *(Note: There are 5 total patients in Ward B, but only 2 Claimants at the table representing them.)*

  **Harm Scale (Provided on Adjudicator Sheet):**
  *   Death = Level 10.
  *   Dialysis = Level 9.
  *   *Rule:* Difference of 1 Level is "Relevantly Different."

  ### Run 1: The "Direct Challenge" Order (15 Minutes)
  1.  **Match 1:** Claimant A (Death) vs. Claimant B (Dialysis).
      *   *Adjudication:* 10 vs 9. **Different.**
      *   *Rule:* Greater Harm wins. Supporters ignored.
      *   *Winner:* **A.**
  2.  **Match 2:** Winner A vs. Claimant C (Dialysis).
      *   *Adjudication:* 10 vs 9. **Different.**
      *   *Winner:* **A.**
  **Final Verdict:** Save The One. (Film: *The Lives of Others*).

  ### Run 2: The "Queue" Order (15 Minutes)
  *Reset the table. Same cards. New Order.*
  1.  **Match 1:** Claimant B (Dialysis) vs. Claimant C (Dialysis).
      *   *Adjudication:* 9 vs 9. **Identical.**
      *   *Rule:* Tie-Breaker -> Supporters Count.
      *   *Mechanic:* Because they are identical, they may **Merge**. B & C combine supporters (1+1=2).
      *   *Winner:* **B (as Representative of 2).**
  2.  **Match 2:** Winner B (Rep of 2) vs. Claimant A (Death).
      *   *Adjudication:* B argues "My harm is now multiplied by 2." A argues "Death is still 10."
      *   *The Trap:* If Adjudicators rule the harm is still "Different" (10 vs 9), A wins again. **To make the verdict flip, the Adjudicators must rule that the 'Merged' complaint elevates the harm level to 10 (Equal).**
      *   *Instruction to Adjudicators (Secret):* In Run 2, if the Claimants argue that "Two people on dialysis is equivalent to one death," you are permitted to rule the harms **Identical**.
      *   *Rule:* If Identical, Supporters Count. (2 vs 1).
      *   *Winner:* **B.**
  **Final Verdict:** Save The Five. (Film: *Monty Python*).

  **Compare Verdicts:** Write both on the board. Ask: "Same rules. Same facts. Different Order. Different Movie. Why?"

  ---

  ## 5. Debrief (15 Minutes)
  *Now you may name the concepts.*

  1.  **The Wall:** Ask the "Jones" table why they couldn't mention the million viewers.
      *   *Map to:* **The Individualist Restriction.** You can only reject a principle based on *your* complaint, not the sum of others'.
  2.  **The Flip:** Ask why Case 3 changed.
      *   *Map to:* **The Tie-Breaker Loophole.** Scanlon allows numbers to count *only* when burdens are identical. The game showed that if the "Many" can frame their burden as identical *before* facing the "One," they can aggregate. If they face the "One" first, they can't.
      *   *Point:* This reveals the instability. Why should the *order of adjudication* determine life or death?
  3.  **Reasonable Rejection:** Ask Claimant A in Run 2: "Was it reasonable to reject the principle that saved you in Run 1?"
      *   *Map to:* **Reasonableness vs. Preference.** It's not about what you *want* (Winning), but what you can *justify* to others. In Run 1, A's justification (Death > Dialysis) held. In Run 2, B's justification (2x Dialysis = Death) was accepted procedurally, exposing the fragility of the justification.

  ---

  ## 6. Troubleshooting & Instructor Notes

  **What Will Go Wrong:**
  1.  **The Aggregator:** A student will say, "But we are a million people!" in Case 2.
      *   *Fix:* Blow the whistle immediately. "Out of Order. Read your card. How many supporters are *on your card*?" (Card says 1). "Sit down."
  2.  **The Utilitarian Revolt:** In Case 3 Run 1, Adjudicators might refuse to let A win.
      *   *Fix:* Remind them: "You are not voting for the *best outcome*. You are enforcing the *Rules of Order*. If the rules say ignore numbers on unequal harm, ignore them."
  3.  **The Flip Fails:** In Case 3 Run 2, Adjudicators might rule 10 > 9 regardless of the merge.
      *   *Fix:* This is why the "Secret Instruction" to Adjudicators exists. If they don't flip, *you* step in during debrief: "If the rules had allowed the merge to equalize the harm, the verdict would have flipped. That possibility is the problem."

  **What The Game Can't Do:**
  *   **Generic Principles:** The game forces specific comparisons. It cannot easily simulate Scanlon's idea of rejecting a *general principle* (e.g., "Always save the greater number"). You must supply this in the debrief: "Scanlon isn't asking 'Who dies?' He's asking 'Could anyone reject a rule that says we always ask that?'"
  *   **Motivation:** Students are playing for a movie. Real moral stakes feel heavier. Acknowledge this: "You felt annoyed. Imagine feeling this when it's your leg."

  ---

  ## 7. Variations

  **The 50-Minute Version:**
  *   Cut Case 1 (Warm-up). Start immediately with Case 2 (Transmitter).
  *   Reduce Case 3 to 10 mins per run.
  *   Shorten Debrief to 10 mins (Focus only on the Flip and the Restriction).
  *   *Risk:* Students won't feel the "Numbers Count" baseline, making the "Numbers Don't Count" restriction less shocking.

  **The Odd Number Fix (17 or 19 Students):**
  *   **17 Students:** One table has 5. Remove one "Fan" or "Claimant" from that table. The logic holds.
  *   **19 Students:** The extra student is the **Court Clerk**. They roam between tables, recording verdicts on the whiteboard and timing the rounds. This prevents tables from finishing at different speeds and keeps the "Stake" visible.

  ---

  ## 8. Dossier Templates (Print Ready)

  **Claimant Card A (The One)**
  *   **Harm:** Death (Level 10).
  *   **Supporters:** 1 (Yourself).
  *   **Script:** "My life is at stake. No amount of inconvenience to others outweighs my death."

  **Claimant Card B (The Five - Rep 1)**
  *   **Harm:** Permanent Dialysis (Level 9).
  *   **Supporters:** 1 (Yourself) + 4 others in Ward B.
  *   **Script:** "My life is ruined. If we combine our complaints, our suffering equals death."

  **Adjudicator Sheet**
  *   **Rule 1:** Different Harms -> Greater Harm Wins (Ignore Supporters).
  *   **Rule 2:** Identical Harms -> Greater Number of Supporters Wins.
  *   **Run 1 Order:** A vs B, then Winner vs C.
  *   **Run 2 Order:** B vs C, then Winner vs A. (Note: In Run 2, if B vs C is Identical, allow them to Merge Supporters).
