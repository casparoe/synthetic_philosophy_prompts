answer: |-
  Here is a formulation of a principle designed to accommodate the majority of your verdicts, followed by an analysis of where it fractures, a diagnosis of your specific asymmetries, and the implications for your three unlisted scenarios.

  ### The Principle: Separable Burden and Created Dependency

  This principle rests on two distinct moral grounds that operate in different contexts: **Bodily Sovereignty** (inside the body) and **Duty of Rescue** (outside the body). It posits that the moral status of the entity changes based on its location relative to the agent and its biological individuation.

  **Clause 1 (Individuation Threshold):** Moral standing sufficient to generate a duty of rescue arises only when the entity is biologically individuated (i.e., the window for twinning has closed or is statistically negligible).
  *   *Motivating Verdict:* **Case 5.** This explains why Emergency Contraception (EC) is permissible (pre-individuation) while discarding a Day-5 clinic embryo is a loss (post-individuation).

  **Clause 2 (Bodily Sovereignty):** No entity with moral standing may use a person's body without their ongoing consent. If the entity can only be removed by ending its life, ending the life is permissible.
  *   *Motivating Verdict:* **Case 1 (Standard Violinist), Case 2 (Ectopic), Case 7 (34 weeks).** This grounds the right to terminate pregnancy when separation without death is impossible.

  **Clause 3 (The Separability Constraint):** If an entity with moral standing can be separated from the agent's body without ending its life and at reasonable cost, the agent must permit separation rather than death.
  *   *Motivating Verdict:* **Case 1 (Portable Rig), Case 7 (22 weeks + Artificial Womb).** This distinguishes the right to end an *imposition* from the right to end a *life* when alternatives exist.

  **Clause 4 (Creator's Duty):** Agents who intentionally bring an individuated entity into existence *ex vivo* (outside the body) incur a special duty to preserve its future, proportional to the cost of preservation, which is stricter than the duty owed by non-creators.
  *   *Motivating Verdict:* **Case 3 (Frozen Embryos).** This explains why discarding your own embryos is a "real loss" requiring justification, while contraception (pre-existence) is fine.

  ---

  ### The Cost of Holding This View

  No principle accommodates all eight verdicts without strain. Here is where this formulation demands you pay a price:

  **1. The Price of Case 6 (Responsibility/Negligence):**
  This principle **cannot accommodate** the intuition that voluntary risk-taking weakens the claim to bodily sovereignty. Clause 2 is absolute regarding bodily intrusion; it does not scale based on how you got pregnant.
  *   *The Cost:* To keep this principle, you must accept that a person who conceived through negligence has the *same* right to terminate *in vivo* as a rape victim. If you maintain that negligence weakens the right, you must introduce a "Forfeiture Clause" that undermines the absolutism of Bodily Sovereignty, potentially endangering Case 1 and Case 2. You must choose: either bodily rights are forfeitable by risk (weakening Case 1), or they are not (flattening Case 6).

  **2. The Price of Case 8 (The Dying Mother):**
  This principle justifies the act (high cost of preservation), but it does not inherently explain why the act is *less bad* than when performed by a healthy person. Marquis's "future-like-ours" is rejected here, but the Principle replaces it with "Burden," which is higher for the dying mother.
  *   *The Cost:* You must accept that the "wrongness" of ending a potential life is not measured by the life lost, but by the *unfairness of the burden imposed on the agent.* This requires abandoning the objective measure of the fetus's future in favor of a subjective measure of the agent's sacrifice.

  ---

  ### Diagnosis of Cases 3 and 5

  You identified these as the points where your reasoning feels ad hoc. The tension is real, but it is resolvable if you accept a **Location-Based Moral Shift**.

  **Case 3 (Contraception vs. Frozen Embryos):**
  The asymmetry is not about "potentiality" in the abstract; it is about **ontological status and relational investment**.
  *   *Contraception:* Prevents an entity from coming into existence. There is no subject to be wronged.
  *   *Frozen Embryos:* An individuated entity already exists (Clause 1). Crucially, it exists *ex vivo*. Once outside the body, Bodily Sovereignty (Clause 2) no longer applies. The relationship shifts from "My Body" to "My Creation." Because you intentionally created this specific entity (Clause 4), you stand in a relation of stewardship to it that does not exist for sperm or eggs.
  *   *Resolution:* The tension vanishes if you accept that moral claims "lock in" at individuation + existence. Contraception acts before the lock; discarding acts after.

  **Case 5 (EC vs. Clinic Discard):**
  You noted the twinning argument fails to separate these because Day-5 embryos can still split (monozygotic twinning). The distinction is not biological; it is **jurisdictional**.
  *   *EC:* Acts *in vivo*. Even if individuated, Clause 2 (Bodily Sovereignty) dominates. You are not required to host an entity, even an individuated one, against your will.
  *   *Clinic Discard:* Acts *ex vivo*. Bodily Sovereignty is not implicated. Only Clause 4 (Creator's Duty) applies.
  *   *Resolution:* The "Twinning" argument is doing less work than you think. The heavy lifting is done by **Location**. Inside the body, autonomy trumps potential life. Outside the body, potential life trumps convenience.

  ---

  ### Implications for Three Unlisted Situations

  Applying the Principle of Separable Burden and Created Dependency yields the following verdicts:

  **1. Obligation to Gestate a Discarded Embryo (Artificial Womb Available)**
  *   *Scenario:* A viable frozen embryo is slated for destruction. A third party offers to gestate it in an artificial womb at no cost to anyone.
  *   *Verdict:* **No obligation for strangers; strong obligation for creators.**
  *   *Reasoning:* Under Clause 4, the *creators* have the primary duty of rescue. If they waive it, does the duty transfer? Under standard Duty of Rescue ethics, strangers are not obligated to undertake significant projects (gestation) to save others unless the cost is trivial. If "gestation in an artificial womb" is as trivial as picking up a ringing phone, a general duty might arise. If it involves *any* significant burden, the strangers are not obligated. However, the *creators* cannot morally discard if a zero-cost transfer is available (Clause 3).

  **2. Genetic Parent Disagreement (One Destroy, One Transfer)**
  *   *Scenario:* You want to transfer an embryo to a carrier; your spouse wants to discard.
  *   *Verdict:* **Transfer should proceed, provided the objecting parent is relieved of obligation.**
  *   *Reasoning:* The embryo, under Clause 1 and 4, has a claim to preservation that exists independently of the parents' current desires. This is analogous to child custody: one parent cannot unilaterally "destroy" a born child because the other wants to keep them. Since the willing parent can fulfill the Duty of Rescue (Clause 4) without the objecting parent's bodily involvement (via a carrier), the claim of the existing entity outweighs the objecting parent's desire to avoid parenthood, *provided* the objecting parent is legally and financially severed from the outcome. The "loss" of discarding is too high a price to pay for one parent's change of mind when an alternative exists.

  **3. Cost Barrier to Transfer (Modest Financial/Medical Cost)**
  *   *Scenario:* Transfer to an artificial womb costs $3,000 and one week of recovery. The pregnant person declines for financial reasons.
  *   *Verdict:* **Permissible to terminate, but the cost creates a moral claim on society/third parties.**
  *   *Reasoning:* Clause 3 requires transfer only at "reasonable cost." $3,000 is objectively modest compared to the cost of raising a child, but subjectively prohibitive for some.
      *   *For the Pregnant Person:* If the cost imposes a hardship, they are permitted to terminate under Clause 2 (Bodily Sovereignty + Cost). They are not obligated to go into debt or undergo recovery to save the fetus.
      *   *The Implication:* If the fetus has moral standing (Clause 1), and the only barrier to saving it is financial, the "wrong" of death falls on the *lack of subsidy*, not the pregnant person. If the state or a charity offers to cover the $3,000 and the recovery burden, the pregnant person's permission to *kill* evaporates; they must allow *transfer*. If no one pays, the permission to terminate remains. This implies that in a society with artificial wombs, **abortion funding must be coupled with transfer funding** to remain morally consistent.

  ### Summary of the View

  You are holding a **Dual-Status View**.
  1.  **In Vivo:** The fetus is a **Tenant**. It has rights, but they are subordinate to the Landlord's (pregnant person's) bodily sovereignty, unless the Tenant can be evicted alive.
  2.  **Ex Vivo:** The embryo is a **Ward**. It has rights to preservation that bind its Creators, subordinate only to excessive cost.

  The price you pay is admitting that **responsibility for conception does not alter the Tenant's rights** (Case 6), and that **the "badness" of abortion is a function of burden, not just lost future** (Case 8). If you can accept those two costs, your verdicts hang together.
