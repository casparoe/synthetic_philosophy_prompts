  # API Reference: DESC-RESOLVE v4.2.1
  **Denoting Systems Enterprise Suite**

  ## Overview
  The DESC-RESOLVE endpoint provides enterprise-grade logical analysis for natural language definite descriptions. By decomposing propositions into existential quantifiers and uniqueness predicates, our engine allows clients to interact with language without ~~eliminating ontological commitment to non-existent entities, ensuring no subsisting round squares are instantiated in memory~~. Legal has requested the preceding clause be modified to reflect standard liability limitations.

  Contextual dependency is managed via explicit domain injection. While bare descriptions (e.g., "the bottle") match approximately 1,800 objects globally, DESC-RESOLVE treats context-dependence as a feature. Domains are versioned and auditable, ensuring that reference failure is a deterministic false rather than an ambiguous gap.

  ## Endpoint: `POST /v1/resolve`

  ### Parameters
  | Parameter | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `description` | String | Yes | The definite description to analyze (e.g., "the current manager"). |
  | `domain` | Array | Yes | The set of objects over which quantifiers range. Bare descriptions are rejected to prevent ambient ontological leakage. |
  | `scope` | Enum | No | Defines operator interaction. `primary` (wide scope) or `secondary` (narrow scope). Defaults to `secondary`. |
  | `strict_identity` | Boolean | No | If true, identity claims are processed as descriptive predicates rather than nominal equations. |

  ### Response Logic
  The system returns `true` if and only if exactly one object in the supplied `domain` satisfies the description and the associated predicate. If zero objects satisfy the description, or if multiple objects satisfy it, the system returns `false`. There are no null values.

  ### Error Handling: Uniqueness Failure
  If multiple satisfiers are detected, the API returns `409 Uniqueness Violation`. The response body includes a list of satisfiers to aid debugging, capped at 50 entries.

  **Incident Postmortem (Ref: MUNI-774):** A municipal dispatch client previously received a silent affirmative response when querying "the available unit." A search-depth cap mistakenly limited uniqueness checks to the first 50 candidates. The 51st unit was available, violating uniqueness. The system returned `true` based on incomplete data. Search caps have since been removed from the logic layer; caps now apply only to error reporting payloads.

  ## Identity and Reference
  Identity statements are not processed as simple name equality ($a=b$). They are resolved via descriptive properties. This ensures informative identities are distinguished from tautologies.

  **Support Ticket #8920 (Royal Client):** Client queried whether a specific novelist authored a specific historical novel. The system returned `true` with the explanatory predicate structure. Client noted they were unable to reconstruct how doubt was possible prior to the API call. This behavior is consistent with design specifications.

  ## Deprecations
  ### Referential Mode (`mode=referential`)
  **Deprecated as of v4.0.**  
  Previous versions allowed users to bypass descriptive satisfaction in favor of speaker intention. This created instability where a description could resolve to an object that did not satisfy the description.

  **Support Ticket #4412 (Events Co.):** Client queried "the guest holding a water glass" intending to identify a specific VIP. The VIP was holding champagne. The only guest holding water was a caterer. The system resolved to the caterer. Ticket closed as *Works As Intended*. The service honors the description, never the intention.

  ## Warnings: Do-Not-Resolve List
  Certain descriptions trigger a `304 Do Not Resolve` warning. These are sorted into three categories:

  | Category | Reason | System Action |
  | :--- | :--- | :--- |
  | **Empty** | Nothing in the domain satisfies the description. | Returns `false`. No inference of existence permitted. |
  | **Statistical** | Description denotes an average or construction (e.g., "the taxpayer"). | Returns `warning`. Not a singling-out predicate. |
  | **Vague** | Satisfaction conditions rely on borderline cases. | Returns `warning` with confidence score. Uniqueness is probabilistic. |

  ## Changelog

  **v4.2.1**
  *   Reverted default return value for failed descriptions from `null` to `false`.
  *   **Note:** An outside consultant previously advised implementing truth-value gaps for non-referring descriptions. This was reverted after one sprint. Negative existential statements (e.g., "The F does not exist") ceased to evaluate as true, breaking compliance modules. Russellian binary logic restored.

  **v4.2.0**
  *   Added `scope` parameter to handle negation operators correctly.
  *   Fixed bug where primary occurrence scope allowed existential import in opaque contexts.

  **v4.0.0**
  *   Removed Referential Mode.
  *   Made `domain` parameter mandatory.
