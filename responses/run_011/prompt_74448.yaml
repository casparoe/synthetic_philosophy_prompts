prompt: |-
  I have three months of funded research time and must submit a proposal of roughly two pages to my host department. The idea concerns Buridan's ass. Existing treatments ask whether a rational agent can act at all when its reasons are exactly balanced, and reply either that exact balance never in fact obtains, that an agent may pick arbitrarily where it cannot choose, or that some further power of the will settles the matter. What I think has been missed is that the ass does not deliberate once and for all: it deliberates while starving. Recast as a balance of reasons that erodes as time passes, the case may generate its own tie-breaker in the deadline — though only on the contestable assumption that an agent's reasons can change merely because time has elapsed and nothing whatever has changed about the options. Turn this into a proposal: a statement of the question precise enough that it could be answered either way; why the three replies above leave it open; the argument I would actually run, and in what order over the three months, together with a case for that route rather than the obvious alternative of simply denying that exact indifference is possible; what a successful result would look like; what would show that the project had failed; and a frank note on where the work threatens to outrun the time available. I will supply the citations myself.
