answer: |-
  Consent fails when forms replace conversations, when power dynamics shift mid-production, or when subjects forget the camera's permanence amidst crisis.

  When uncertainty arises, default to protecting the subject's future autonomy over the film's present needs.

  **The 5-Minute Protocol**

  1.  **Thesis Disclosure:** "This film argues the closure is unjust. We are not neutral." *Philosophy:* Spelling out the argument isn't deception; it's respect for agency. Concealing the end goal invalidates consent. *Stop:* If they assume you're news or PR.
  2.  **Competence:** "What did you eat today? What happens if you change your mind?" *Philosophy:* Comprehension is required for valid consent. *Stop:* If they can't track time or consequences.
  3.  **Scope:** "Streams globally, forever. Your boss, neighbors, kids will see it." *Philosophy:* Comprehension of consequences is required for valid consent. *Stop:* If they think it's internal training video.
  4.  **Revocability:** "Quit anytime until edit lock. After lock, we can't physically remove you, but we won't release if you object pre-premiere." *Philosophy:* Consent is a relationship, not a property transfer. Revocability binds us relationally; if you can't withdraw, you were never free to consent. *Judgment Call:* If cutting the scene kills the film, you shouldn't have filmed it.
  5.  **Coercion Check:** "Are you saying yes because you're scared of the system or us leaving?" *Philosophy:* External fear coerces even if you don't wield it. Fear of the system is still coercion if you exploit it. *Stop:* If yes depends on you solving their problems.
  6.  **Inducement:** "$200 covers lost shifts. It's not payment for access." *Philosophy:* Reimbursement restores choice; payment buys it. Money becomes coercive when it's survival money. *Judgment Call:* Is $200 life-changing for them? If yes, don't give it.
  7.  **Documentation:** Log conversation time/date. Signature secondary to recorded understanding.

  **Applications**

  1.  **Dementia Woman:** **NO.** Competence is the threshold for consent. Fluctuating capacity means she cannot hold the waiver. The daughter's refusal to sign confirms the risk. Filming her treats her as a means to an end (pathos), violating dignity. This kills your emotional center, but filming her is exploitation.
  2.  **Tech Withdrawal:** **HONOR IT.** You established consent as ongoing, not transactional. Keeping the footage legalistically violates the ethical contract. The normative work of consent is trust; breaking it ruins your reputation for future subjects. Cut the scene, even if it breaks the narrative arc.
  3.  **Nurse Promise:** **NO.** You cannot guarantee employer behavior. Promising safety you can't deliver is coercion via false hope. Offer anonymity (voiceover/shadow); if she insists on face + immunity, walk away. Her job is worth more than your scene.

  This procedure will misfire when the urgency of the moment makes five minutes feel like an eternity, tempting crew to skip the hard questions.
