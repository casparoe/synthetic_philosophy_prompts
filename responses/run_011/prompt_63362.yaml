prompt: |-
  ok so this has been rattling around in my head since our unit on nuclear weapons and I can't figure out if I'm missing something obvious or if nobody's thought it through.

  My teacher walked us through how the machinery actually works. One person at the top holds launch authority and carries a card with the authentication codes. Everything below that is procedure: the order gets relayed, people check that it's genuinely from the top, missile crews work in pairs and each one verifies the other's codes and turns keys at the same time. The whole design is about making sure the order is real and that nobody can fire alone. Not one single step in the chain is a checkpoint where anyone asks whether the order is *right*. The guys at the bottom are basically a very elaborate lock, not a jury.

  Then you look at what the same military teaches a regular soldier: an unlawful order has to be refused, and "I was just following orders" is not a defense. Down at that level, judging the order is literally part of your job.

  And the top-level strategy is openly about threatening to wipe out cities and societies, which is the one thing the rules of war say you can never deliberately aim at. So the threat is a promise to do something that would be a massive war crime, and everyone agrees that's precisely what makes it scary enough to work.

  My friend put it in a way that stuck with me: the deterrent only works if he'd really do it, and if he'd really do it he's a monster, so he's either a liar or a monster — and the class just nodded like that's a feature, not a bug.

  So what does this whole setup presuppose? What theory of right and wrong, or of where moral judgment is even allowed to sit, makes all those pieces make sense together at once? Is it just consequentialism wearing a uniform, or is it something stranger — like a view where the moral status of a threat is a separate thing from the moral status of what's threatened? Which rival views does it silently rule out by existing at all? And are the parts actually consistent — does the lock-and-key procedure contradict the basic-training rule about disobeying, or can one theory hold both?

  Please be careful to split apart what the practice *has* to assume from what merely fits it nicely, and point out where it's underdetermined, where a few different theories would license the exact same procedures. Then tell me what would concretely change — in the checklists, in who's permitted to pause and ask — if you swapped in the opposite view.

  sorry it's so long. no need to send me sources or anything, I mostly want the reasoning.
