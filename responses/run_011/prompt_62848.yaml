answer: |-
  You are quite right to be puzzled, and frankly, your intuition regarding the Milgrom-Stokey no-trade theorem is sharper than your colleague's. It is a common misconception that the theorem forbids trade *because* people lack private information. As you have correctly identified, the theorem posits that even with private information, trade should not occur if certain strict conditions are met.

  Here is an analysis of where the theory stands, why your internal market behaves as it does, and what is actually required for a market price to outperform a simple average of opinions.

  ### 1. The No-Trade Theorem: Where You Are Right

  Your reading of the Milgrom-Stokey result is essentially correct. The theorem states that if two agents share a **common prior**, are **risk-neutral** (or have common knowledge of their risk attitudes), and it is **common knowledge** that they are rational Bayesian updaters, they cannot agree to a speculative bet.

  The logic is as follows: If I offer to sell you a bet, you must infer that I possess private information suggesting the bet is unfavourable to you. Since we share a prior and I am rational, my willingness to trade signals my private information to you. You update your beliefs accordingly. If I know that you will update your beliefs based on my offer, I must anticipate that. This chain of reasoning (akin to Aumann's Agreement Theorem) leads to a point where our posteriors converge, and the motive for trade vanishes.

  Your colleague is mistaken when they suggest that the existence of private information invalidates the theorem. Private information is precisely the fuel for the inference engine that stops the trade in the theoretical model.

  **So why do real markets trade?**
  The theorem does not bite in practice because its assumptions are too brittle for the real world. Trade becomes possible when one or more of the following assumptions break:
  *   **Noise Traders:** If there is a possibility that a trader is trading for liquidity, hedging, or simply for fun (rather than information), I cannot perfectly infer their private signal from their trade offer. This breaks the chain of inference.
  *   **Different Priors:** In reality, colleagues do not share a perfect common prior. We have different experiences and mental models. If we agree to disagree on the prior, trade can occur.
  *   **Bounded Rationality:** It is not common knowledge that everyone is a perfect Bayesian updater. If I think you might be overconfident or mistaken, I will take the bet.

  ### 2. Your Observation: Sharp on Certainty, Mushy on Uncertainty

  You noted that prices are sharp on questions where the answer is common knowledge and mushy on genuinely uncertain ones. This does not necessarily mean the aggregation story is a myth; rather, it highlights the role of **arbitrage** and **risk**.

  *   **Common Knowledge:** When the answer is obvious internally, any deviation in price is risk-free money. Rational actors will arbitrage this immediately until the price reflects the known truth. This is why the market looks efficient here.
  *   **Uncertainty:** On difficult questions, there is no risk-free arbitrage. To move the price, a trader must be willing to put capital at risk against genuine uncertainty. In an internal corporate market, this is where things often stall. Employees may be risk-averse, or they may fear **career risk** (e.g., betting against a project your boss champions). Consequently, those with private information may not bet heavily enough to move the price, leaving it 'mushy'.

  ### 3. When Does a Market Beat an Average?

  This is the crux of your second question. A simple average of individual estimates (the 'Wisdom of Crowds') is powerful because it cancels out independent noise. However, a prediction market has the potential to be superior because it is a **weighted average**, where the weights are determined by confidence and capital.

  For your internal market price to beat a simple average of your colleagues' estimates, the following conditions must hold:

  **A. Incentive Compatibility (Skin in the Game)**
  In a simple average, a guess from an expert counts the same as a guess from an intern. In a market, the expert should theoretically bet more. For this to work, participants must care about the outcome. If you are using fake money or trivial prizes, people will not reveal the intensity of their conviction. The market only aggregates *weighted* information if the weights (bets) correlate with the quality of information.

  **B. Diverse and Uncorrelated Information**
  Averaging works best when errors are independent. Markets work best when private signals are diverse. If everyone in your office watches the same news feed or attends the same meetings, you have correlated errors. Neither the market nor the average will fix this. The market adds value only if different traders hold distinct pieces of the puzzle that the price can synthesise.

  **C. Absence of Career Risk**
  This is the silent killer of internal corporate markets. If an employee believes a project will fail, but betting on 'Fail' might be interpreted as disloyalty or negativity by management, they will not trade. They might even trade against their own information to signal loyalty. In this scenario, the market price becomes a measure of **office politics** rather than probability. A simple anonymous survey (average) might actually capture the true sentiment better in this specific context.

  **D. Liquidity and Capital Constraints**
  For the price to reflect the best information, the best-informed traders must have the capital (or points) to move the price to the correct level. If the person with the best private information has a low betting limit, their signal will be drowned out by noisy traders with higher limits.

  **E. Aggregation Mechanism**
  The mechanism matters. A continuous double-auction market (like a stock exchange) allows prices to adjust dynamically as information arrives. A parimutuel market (like a horse racing pool) or a simple poll does not allow for the same degree of information revelation. If your internal tool is more of a poll than a market, you will not gain the 'market' advantage.

  ### Summary

  You are not going wrong on the theorem; your colleague is misapplying it. The no-trade theorem explains why perfectly rational agents with common priors wouldn't trade, but real markets function because we are not perfectly rational, we do not share identical priors, and there is 'noise' in the system.

  However, your observation about the 'mushy' prices on uncertain questions is a warning sign. For the market price to beat a simple average, you need the people with the best information to be the ones betting the most, without fear of reprisal. If your internal culture punishes those who bet on negative outcomes, the simple average of anonymous estimates will likely remain the more accurate predictor.

  To make the market work, you must ensure that traders are rewarded for accuracy, protected from political fallout, and sufficiently capitalised to back their conviction. Without that, you are merely running a costly poll.
