prompt: |-
  We run a little internal prediction market at work and I'm trying to write up why the prices should actually mean anything. I keep hitting the Milgrom-Stokey no-trade result, which as I read it says two rational Bayesian agents with a common prior can't agree to a speculative bet, full stop. But then how could a market price ever carry information that wasn't already public — if nobody trades on what they privately know, the price just stays where it started. My colleague says the theorem doesn't bite because our traders definately have private info, and that seems backwards to me: private info is precisely the thing the theorem says can't produce trade. On top of that, our prices have been sharpest on questions where the answer was already common knowledge internally and mushiest on the genuinely uncertain ones, which reads like more evidence the whole aggregation story is a myth. So where am I going wrong, if I am? And seperately, what would have to be true in practice for a market price to beat just averaging everyone's individual estimates — I care more about that second question than about the theorem, honestly. Please write the whole answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** Internal prediction market at work.
      *   **Problem:** The user is struggling with the Milgrom-Stokey "No-Trade Theorem" (NTT). They understand it as: "Rational Bayesian agents with a common prior cannot agree to a speculative bet."
      *   **Conflict:** If NTT holds, how can prices convey private information? If no one trades on private info, prices don't move.
      *   **Colleague's View:** "Traders definitely have private info, so the theorem doesn't bite."
      *   **User's View:** "Private info is *why* the theorem says no trade happens." (User is correct here).
      *   **Observation:** Prices are sharp on common knowledge questions, mushy on uncertain ones. This suggests aggregation isn't working well.
      *   **Questions:**
          1.  Where am I going wrong regarding the theorem?
          2.  What conditions are needed for a market price to beat averaging individual estimates? (This is the priority).
      *   **Constraint:** Write the whole answer in British English.

  2.  **Deconstruct the Milgrom-Stokey No-Trade Theorem (NTT):**
      *   *What it actually says:* If agents are rational, risk-neutral (or have common knowledge of risk attitudes), share a common prior, and it is *common knowledge* that they are rational and sharing a common prior, then no trade occurs based on private information. Why? Because if I offer to sell you a bet, you infer I know something bad about it. If I know you know that, I infer you know something I don't, etc. (Aumann's Agreement Theorem logic).
      *   *Why it doesn't kill real markets:*
          *   **Common Priors:** Do people really share the exact same prior? Unlikely.
          *   **Common Knowledge of Rationality:** Do traders know everyone else is perfectly rational Bayesian updaters? No.
          *   **Liquidity/Noise Traders:** Real markets have people trading for reasons other than information (hedging, fun, mandates). This breaks the "common knowledge that trade is speculative" assumption.
          *   **Sequential vs. Simultaneous:** NTT often assumes a specific setup. Real markets are dynamic.
      *   *Addressing the User's Confusion:* The user is right that private information *alone* under strict NTT assumptions prevents trade. The colleague is wrong to say "private info means the theorem doesn't bite." The colleague is right that the theorem doesn't bite *in practice*, but for the wrong reason. The theorem doesn't bite because the *assumptions* (common priors, common knowledge of rationality, no noise) are violated, not because private info exists.

  3.  **Address the Observation (Sharp on Common Knowledge, Mushy on Uncertainty):**
      *   This is actually a sign of *some* efficiency, but perhaps low liquidity or participation.
      *   If the answer is common knowledge, arbitrage is easy -> price converges quickly.
      *   If the answer is uncertain, disagreement is high, but if no one feels confident enough to bet heavily (risk aversion, career risk), the price stays mushy.
      *   This doesn't prove aggregation is a myth; it proves liquidity/confidence is lacking on hard questions.

  4.  **Address the Core Question: When does the Market Beat the Average?**
      *   This is about the "Wisdom of Crowds" vs. "Market Efficiency."
      *   *Averaging:* Simple mean of probabilities. Good for reducing independent noise.
      *   *Markets:* Weight by confidence (money). Good if those with better info bet more.
      *   *Conditions for Market Superiority:*
          1.  **Incentive Compatibility:** People must want to win (real money or significant reputation).
          2.  **Diverse Information:** Participants must hold uncorrelated private signals.
          3.  **Risk Tolerance/Capital:** Those with better info must be willing/able to back it.
          4.  **Liquidity:** Enough volume to allow price discovery without huge spreads.
          5.  **No Career Risk:** Employees shouldn't fear being punished for betting on "bad" outcomes (e.g., project failure).
          6.  **Aggregation Mechanism:** The market mechanism must allow price to move to clear orders (continuous double auction vs. parimutuel).

  5.  **Drafting the Response (incorporating British English):**
      *   *Tone:* Professional, analytical, slightly conversational but rigorous.
      *   *Spelling/Grammar:* Colour, favour, realise, centre, whilst, amongst, etc.
      *   *Structure:*
          1.  Introduction: Validate the user's intuition (they are mostly right about the theorem).
          2.  The No-Trade Theorem Explained: Clarify the assumptions (Common Priors, Common Knowledge). Explain why it fails in practice (Noise traders, different priors).
          3.  Addressing the Colleague: Politely correct the colleague's misunderstanding.
          4.  Addressing the Observation: Why sharp on easy, mushy on hard? (Arbitrage vs. Risk).
          5.  The Practical Question (Market vs. Average): List the conditions required for markets to outperform simple averaging.
          6.  Conclusion: Summary advice.

  6.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I explain *why* private info stops trade in NTT? Yes, because the offer to trade reveals the info.
      *   *Check:* Did I explain *why* trade happens in real life? Yes, noise traders/hedging breaks the inference chain.
      *   *Check:* Is the British English consistent? (e.g., use "programme" if needed, "modelling", "centre").
      *   *Check:* Did I answer the second question thoroughly? This is the user's main interest. I need to emphasize *weighting by confidence*. Averaging treats a guess and a confident prediction equally. Markets weight by conviction.
      *   *Nuance:* Internal markets often fail due to "career risk." If I bet the project will fail, my boss might fire me. This suppresses information. I must mention this.

