answer: |-
  **MEMORANDUM**

  **TO:** Exhibitions Committee, Natural History Museum
  **FROM:** [Your Name], Exhibitions Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendations for "The Living Wall" Indicator Logic and Panel Copy

  **EXECUTIVE SUMMARY & RECOMMENDATIONS**

  The current "seven-item checklist" (MRS GREN) is scientifically obsolete and produces false negatives for sterile hybrids (mules) and dormant states (tardigrades). It must be abandoned. I recommend we retain the binary switch mechanism—pedagogically necessary for our age group—but shift the underlying definition from "functional checklist" to "biological lineage." The switch will indicate: **Green = Part of Earth's Biological Lineage; Grey = Not Part of Earth's Biological Lineage.**

  Below are the recommended indicator positions and one-sentence panel glosses for the five contested pods.

  1.  **T4 Bacteriophage:** **GREY.**
      *   *Gloss:* "Viruses borrow the machinery of cells to copy themselves, but they cannot start the process alone."
  2.  **_Physarum polycephalum_ (Slime Mould):** **GREEN.**
      *   *Gloss:* "This single giant cell solves problems and grows, showing us that life does not need a brain to be smart."
  3.  **Freeze-Dried Tardigrades:** **GREEN.**
      *   *Gloss:* "Life can pause completely for decades and restart, proving that metabolism is a switch, not a definition."
  4.  **Synthetic Protocell:** **GREY.**
      *   *Gloss:* "This system grows and divides, but without the ability to evolve over time, it remains a machine." *[Note: This relies on the lab's confidential assurance that heritable variation is currently absent; if the system acquires mutation capability, this status must be reviewed.]*
  5.  **Digital Simulation:** **GREY.**
      *   *Gloss:* "These digital creatures compete and replicate, but they exist in code, not in the biological history of our planet."

  **CONCEPTUAL FRAMEWORK: BINARY VS. SPECTRUM**

  We cannot honestly endorse "living" and "not-living" as a fundamental binary of nature. Biology is a continuum of complexity. However, for an eleven-year-old visitor, a spectrum is paralyzing. The wall must not ask "Is this alive?" (an ontological question) but "Does this belong to the story of life on Earth?" (a genealogical question).

  This distinction solves the "Mule Problem." A mule is sterile (fails reproduction) but is undeniably part of the biological lineage. Under the lineage rule, the mule is Green. Under the checklist, it is Grey. By adopting the lineage definition, we honor the public commitment to give an answer without lying about the science. The switch becomes a tool for categorization, not a verdict on essence.

  **DECISION RULE FOR CURATORIAL STAFF**

  For any future exhibit or edge case (sterile hybrids, immortal cell lines, new synthetic organisms), apply the **Lineage and Evolution Test**:

  1.  **Is the entity composed of matter organized by biological processes (carbon-based, aqueous, cellular or viral)?**
  2.  **Is it a product of, or capable of participating in, Darwinian evolution (descent with modification)?**

  If the answer to both is Yes, the indicator is Green. If the entity is dormant (tardigrades), it is Green because the *potential* for lineage participation remains. If the entity is sterile but born of living parents (mules), it is Green because it is a vessel of that lineage. If the entity is synthetic but lacks heritable variation (current protocell), it is Grey. If the entity is digital, it is Grey.

  *Note on Biology:* I am proceeding on the settled consensus that viruses are not cellular life, though *[I am guessing that the committee accepts the consensus view that viruses are excluded from the tree of life despite their role in horizontal gene transfer]*. I am also relying on the external lab's data regarding the protocell; *[it is a guess that the protocell will not achieve heritable variation before the gallery opens, which would necessitate a status change to Green]*.

  **ADDRESSING COUNTER-ARGUMENTS**

  **1. The Education Team: "Nuance confuses children."**
  *Argument:* Educators will argue that a graded or context-sensitive scheme teaches children that scientific categories are matters of taste, undermining the authority of the museum. They will prefer the rigid checklist because it is easy to grade.
  *Response:* We are not teaching that categories are matters of taste; we are teaching that definitions serve purposes. The checklist is a tool for identifying active metabolism, not life itself. By switching to "Lineage," we provide a consistent rule that handles the mules and the tardigrades correctly. We tell the children: "Scientists used to use a checklist, but they found it missed important things, so now we use a family tree." This models scientific progress rather than dogma.

  **2. The Development Office: "Pod Five is not worth a fight with the donor."**
  *Argument:* The donor has requested Pod Five be hard-wired to Green. Refusing risks the endowment and future relationships. The text can fudge the definition.
  *Response:* Hard-wiring Pod Five to Green compromises the museum's scientific integrity and validates the Science Advisor's resignation. If we call a simulation "Living" in a Natural History Museum, we degrade the value of the biological exhibits.
  *My Proposal for the Room:* I will argue that the donor's reputation is better served by accuracy than by flattery. We offer them a compromise: The switch remains Grey (scientifically accurate), but the panel copy highlights their system as "The Frontier of Artificial Life," positioning them as pioneers looking *forward*, rather than claiming they have already solved life. This gives them prestige without forcing us to falsify biology. If the Director insists on Green to secure the funds, the text must explicitly state "Artificial Living System" to distinguish it from the biological Green pods, preserving the integrity of the Natural History collection.

  **CONCLUSION**

  The binary switch is a blunt instrument, but it is the one we have fabricated. We can either use it to teach outdated biology (the checklist) or to teach modern classification (lineage). I urge the committee to adopt the Lineage definition immediately. This resolves the Mule query, retains our Science Advisor, and allows us to face the donor with a principled, defensible position.

  Please review the marked biological assumptions above with our consultants before we finalize the panel copy.
