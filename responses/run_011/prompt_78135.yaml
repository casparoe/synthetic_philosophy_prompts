answer: |-
  This is a sophisticated position that attempts to synthesize Lewisian orthodoxy with Sugdenian revisionism and Skyrmsian evolutionary dynamics. While the synthesis is attractive, there are genuine tensions between the *definitions* you endorse and the *examples/mechanisms* you propose.

  Below is the consistency audit, ranked by severity.

  ### I. Ranked Conflicts

  #### 1. The Normativity Conflict (Claim 3 vs. Claim 4)
  **Severity:** **Critical**
  **The Conflict:** Claim 3 draws a sharp line: conventions solve coordination problems (coincident interest); if there is a gain by defecting (or a normative sanction unrelated to expediency), it is a moral/legal norm, *not* a convention. Claim 4 presents the umbrella stand as a paradigm convention, yet describes it as having the exact features Claim 3 excludes: third-party disapproval ("treated... as wrong") by those who "lose nothing themselves." This describes a *social norm* (in the sense of Cristina Bicchieri) or a moral norm, not a Lewisian convention. In a Lewisian convention, I disapprove of your defection only because it frustrates my own interest in coordinating; in your umbrella example, residents disapprove even without personal loss.
  **The Repair:** You must either:
  *   **(A) Reclassify the Example:** Admit the umbrella case is a *social norm* that evolved *from* a convention, but is no longer a pure convention.
      *   *Cost:* You lose a "paradigm" example of convention and must explain how conventions morph into norms without blurring Claim 3's distinction.
  *   **(B) Broaden Claim 3:** Allow that conventions can acquire normative force ("oughtness") beyond mere expediency without becoming moral/legal norms.
      *   *Cost:* You blur the very distinction Claim 3 seeks to protect. You will need a new criterion to distinguish conventions from moral norms if "gain by defecting" is no longer the line.
  *   **(C) Refine the Description:** Argue that the "wrongness" is actually just a heuristic for "inexpedient," and third parties disapprove because they anticipate *they* might need the stand later.
      *   *Cost:* This risks psychological implausibility. If residents feel moral outrage, modeling it as mere long-term self-interest may look reductionist.

  #### 2. The Common Knowledge Contradiction (Claim 1 vs. Claim 5)
  **Severity:** **High**
  **The Conflict:** Claim 1 states your position satisfies Lewis's *six conditions*. The sixth condition is Common Knowledge (CK). Claim 5 states CK "does no explanatory work" and is "decoration." You cannot consistently hold that a condition is *necessary for the definition* (Claim 1) and simultaneously *explanatorily idle/unnecessary* (Claim 5). If CK is decoration, it should not be listed as a condition the regularity must satisfy.
  **The Repair:** You must either:
  *   **(A) Amend Claim 1:** State that you accept Lewis's analysis *mutatis mutandis*, or that you accept the first five conditions and the *spirit* of the sixth, while adopting Sugden's revision.
      *   *Cost:* You depart from strict Lewisian orthodoxy. Purists may object that you are no longer discussing "Lewisian Convention."
  *   **(B) Refine Claim 5:** Argue that CK is constitutively required but psychologically realized as first-order expectation.
      *   *Cost:* This is a harder philosophical sell. It requires arguing that the infinite hierarchy exists *in virtue of* the first-order expectation, which is technically Sugden's view, not Lewis's.

  #### 3. The Agency Tension (Claim 1 vs. Claim 6)
  **Severity:** **Medium**
  **The Conflict:** Claim 1 says conventions are sustained by the "parties' own preferences and expectations." This requires agents to possess specific intentional states. Claim 6 says Skyrms-style dynamics account for the phenomena "without attributing the relevant concepts to the agents." Skyrmsian agents often operate on reinforcement learning without representing "expectations" or "preferences" in the propositional attitude sense required by Lewis.
  **The Repair:** You must either:
  *   **(A) Distinguish Genesis from Maintenance:** Claim 6 explains how conventions *emerge* (evolution), while Claim 1 explains how they are *sustained* in mature populations (rational agency).
      *   *Cost:* You must explain the transition point. At what population threshold do Skyrmsian learners become Lewisian reasoners?
  *   **(B) Adopt an "As-If" Stance:** Claim 1 describes the equilibrium structure, not the psychological machinery.
      *   *Cost:* This weakens the ontological commitment of Claim 1. If agents don't actually have the preferences, in what sense is the convention "sustained" by them?

  ---

  ### II. Compatible Pairs

  These pairings are robust and strengthen your handout by showing where your position is internally coherent.

  #### 1. Claim 2 (Arbitrariness) & Claim 3 (Coordination)
  **Why Compatible:** These are the twin pillars of the Lewisian view. If a regularity solves a coordination problem (Claim 3), it is necessarily arbitrary (Claim 2) because if one solution were intrinsically better, it would not be a coordination problem (it would be a technical imperative). Keeping these together anchors your view in the game-theoretic tradition and distinguishes it from accounts of convention that ground it in tradition or intrinsic value.

  #### 2. Claim 5 (Sugden on CK) & Claim 6 (Skyrms on Dynamics)
  **Why Compatible:** Both claims are motivated by a skepticism of hyper-rationality. Sugden rejects the infinite cognitive hierarchy of CK because real agents don't reason that way. Skyrms rejects deliberative rationality because evolution selects for successful behavior, not correct reasoning. Aligning these two signals to your seminar audience that you are naturalizing social ontology. It shows a consistent methodological commitment to psychological and evolutionary plausibility over formal elegance.

  #### 3. Claim 1 (Lewis Core) & Claim 7 (Language)
  **Why Compatible:** Despite the CK tension noted above, defending Lewis's account of language (Claim 7) while adopting his core definition (Claim 1) is consistent. Many critics argue that because language is too complex or normative, it cannot be a Lewisian convention. By affirming both, you maintain the unity of the theory: the same machinery that explains driving on the left also explains truthfulness. This is a strong theoretical virtue (unification).

  ---

  ### III. Summary Recommendation for the Handout

  To circulate this with confidence, I recommend the following specific edits to resolve the **Critical** and **High** severity conflicts:

  1.  **Qualify Claim 1:** Change "satisfies his six conditions" to "satisfies the core of his analysis, specifically the first five conditions." This aligns immediately with Claim 5.
  2.  **Nuance Claim 4:** Add a clause to the umbrella example: "While this practice attracts normative sanction, I treat it as a convention *in origin* that has acquired normative force, distinct from moral norms which are not arbitrary." This protects Claim 3 while keeping the example.
  3.  **Clarify Claim 6:** Specify that Skyrmsian dynamics explain the *emergence*, while Lewisian preferences explain the *stability* in mature agents. This resolves the Agency Tension.

  **Overall Assessment:** Your position is a compelling "Naturalized Lewisianism." The conflicts arise mostly where you try to keep Lewis's *definitions* while rejecting his *psychology*. If you explicitly frame your handout as a revision of Lewis rather than a strict adherence, the contradictions dissolve into theoretical trade-offs.
