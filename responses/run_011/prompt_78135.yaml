prompt: |-
  I am preparing a handout for a social ontology seminar in which I set out my own position on conventions, and I would like a consistency audit before I circulate it. Here is what I hold.

  1. Lewis's analysis in *Convention* is basically right: a convention is a regularity in behavior, in a recurrent situation, sustained by the parties' own preferences and expectations, and it satisfies his six conditions — conformity; expectation of conformity by others; roughly similar preferences over combinations of actions; a conditional preference that others conform given that almost everyone does; a parallel conditional preference for some alternative regularity; and common knowledge of all of the foregoing.

  2. Conventions are arbitrary in Lewis's sense: for any convention there is an alternative regularity that would have served nearly as well, and nothing intrinsic to the one in force recommends it.

  3. Conventions are solutions to coordination problems — situations of largely coincident interest. A regularity sustained where each party would gain by defecting given everyone else's conformity is not a convention at all, but a moral or legal norm, and I want to keep those categories apart.

  4. My paradigm examples nonetheless include the rota in my department by which whoever makes the last of the coffee cleans the pot, and the standing practice in my building of leaving umbrellas in the unlocked hall stand. In the second case, taking one is treated by residents as wrong rather than merely inexpedient, including by people who have never met the taker and lose nothing themselves.

  5. Common knowledge does no explanatory work beyond first-order expectation: like Sugden, I think an agent can follow a convention by reasoning from her own experience of it, and the infinite hierarchy is decoration.

  6. Conventions characteristically emerge and persist through imitation and selection rather than through anyone's deliberation; Skyrms-style dynamics account for the same phenomena without attributing the relevant concepts to the agents.

  7. Lewis's central application — a language as a convention of truthfulness and trust in a population — is not viciously circular, despite the account's need for common knowledge.

  Which of these genuinely conflict, which merely appear to, and where is the cheapest repair? Please rank the conflicts by severity rather than treating them alike; for each, say what would have to be given up and what that costs me. I am also interested in the pairs you judge to be compatible: say why, since I cannot tell from the inside which of my worries are real. Do not assume I would rather abandon any particular item.
reasoning: |-
  Here's a thinking process that leads to the suggested consistency audit:

  1.  **Analyze the Request:**
      *   **Task:** Conduct a consistency audit of a set of 7 philosophical claims regarding social ontology and conventions.
      *   **Context:** A handout for a social ontology seminar setting out the author's position.
      *   **Goal:** Identify genuine conflicts vs. apparent conflicts, rank conflicts by severity, suggest repairs (what to give up and the cost), and explain compatible pairs.
      *   **Constraint:** Do not assume the author prefers abandoning any specific item.
      *   **Input:** 7 specific claims (numbered 1-7).

  2.  **Analyze the Claims (Deconstruction):**

      *   *Claim 1 (Lewis Core):* Adopts Lewis's 6 conditions for convention (Regularity, Expectation, Preferences, Conditional Preference for Conformity, Alternative Regularity, Common Knowledge).
      *   *Claim 2 (Arbitrariness):* Conventions are arbitrary (alternative regularities exist).
      *   *Claim 3 (Coordination vs. Norms):* Conventions solve coordination problems (coincident interest). If there's a gain by defecting, it's a moral/legal norm, *not* a convention. (Strict separation).
      *   *Claim 4 (Examples):* Paradigm examples include: (a) Coffee rota (cleaning pot), (b) Umbrella stand (leaving umbrellas, taking one is *wrong*).
      *   *Claim 5 (Common Knowledge):* Common knowledge (CK) is not explanatorily necessary; first-order expectation suffices (Sugden's view).
      *   *Claim 6 (Evolution/Dynamics):* Conventions emerge via imitation/selection (Skyrms), not deliberation. Agents don't need the concepts.
      *   *Claim 7 (Language):* Lewis's language account is not viciously circular, despite needing CK.

  3.  **Identify Potential Tensions/Conflicts:**

      *   *Tension A (Claim 1 vs. Claim 5):* Claim 1 explicitly endorses Lewis's 6 conditions, one of which is *Common Knowledge*. Claim 5 says CK does no explanatory work and implies we can drop the infinite hierarchy.
          *   *Severity:* High. Claim 1 says "satisfies his six conditions." Claim 5 says "one of those conditions is unnecessary/decorative."
      *   *Tension B (Claim 3 vs. Claim 4):* Claim 3 says conventions are *only* coordination problems (coincident interest). If there's a gain by defecting (or a sense of "wrongness"/normativity beyond expediency), it's a moral/legal norm. Claim 4 cites the Umbrella Stand as a paradigm convention, but notes taking an umbrella is treated as *wrong* by third parties who lose nothing. This sounds like a social norm/moral norm, not a pure coordination convention.
          *   *Severity:* High. This strikes at the classification of the author's own examples.
      *   *Tension C (Claim 1/7 vs. Claim 6):* Claim 1 & 7 endorse Lewis's conceptual framework (including language as convention). Claim 6 endorses Skyrms-style evolutionary dynamics where agents *do not* need the relevant concepts (belief/desire/CK). Lewisian agents are hyper-rational; Skyrmsian agents are reactive/evolutionary.
          *   *Severity:* Medium/High. Can you have Lewisian conditions satisfied by Skyrmsian dynamics? Yes, but Claim 6 says "without attributing the relevant concepts to the agents," while Claim 1 says the convention is sustained by "parties' own preferences and expectations."
      *   *Tension D (Claim 5 vs. Claim 7):* Claim 5 says CK is decoration/useless. Claim 7 defends Lewis's language account *despite* its need for CK. If CK is useless (Claim 5), why defend the account that needs it (Claim 7)? Or does Claim 7 mean "It's not circular even if we assume CK," while Claim 5 means "We don't actually need to assume CK"?
          *   *Severity:* Low/Medium. Mostly terminological.
      *   *Tension E (Claim 2 vs. Claim 4):* Claim 2 says conventions are arbitrary. Is the coffee rota arbitrary? Yes. Is the umbrella stand arbitrary? Maybe. But if the umbrella stand is a moral norm (per Claim 3 tension), arbitrariness is often what distinguishes conventions from moral norms (moral norms aren't arbitrary in the same way).
          *   *Severity:* Low. Depends on how "arbitrary" is defined.

  4.  **Deep Dive into Specific Conflicts:**

      *   **Conflict 1: The Definition of Convention (Claims 1, 3, 4).**
          *   Claim 1: Lewisian (Coordination + CK + Preferences).
          *   Claim 3: Strict Coordination (No gain by defecting).
          *   Claim 4: Umbrella example involves "wrongness" and third-party sanction.
          *   *Analysis:* Lewisian conventions *can* acquire normativity, but Claim 3 explicitly draws a line: "A regularity sustained where each party would gain by defecting... is not a convention." The umbrella case describes third-party disapproval ("treated by residents as wrong... including by people who... lose nothing themselves"). This suggests a Prisoner's Dilemma structure or a Social Norm structure, not a pure Coordination Game. If it's a Social Norm, Claim 3 says it's *not* a convention. But Claim 4 calls it a "paradigm example."
          *   *Verdict:* Genuine Conflict. High Severity.

      *   **Conflict 2: The Role of Common Knowledge (Claims 1, 5, 7).**
          *   Claim 1: "Satisfies his six conditions" (includes CK).
          *   Claim 5: "Common knowledge does no explanatory work... infinite hierarchy is decoration."
          *   Claim 7: Defends Lewis's language account "despite the account's need for common knowledge."
          *   *Analysis:* Claim 1 commits to CK as a *condition*. Claim 5 demotes CK to *decoration*. You can't say it's a necessary condition (Claim 1) and also say it does no work/isn't needed (Claim 5). Claim 7 tries to save Lewis *given* CK, but Claim 5 says we don't need CK.
          *   *Verdict:* Genuine Conflict. High Severity (Internal contradiction in the definition).

      *   **Conflict 3: Rationality vs. Evolution (Claims 1, 6).**
          *   Claim 1: Sustained by "parties' own preferences and expectations" (Intentional Stance).
          *   Claim 6: "Without attributing the relevant concepts to the agents" (Design/Physical Stance).
          *   *Analysis:* Lewis requires agents to have expectations and conditional preferences. Skyrms (Claim 6) allows conventions to emerge in populations of simple learners who don't represent expectations. Claim 1 says conventions *are* sustained by preferences/expectations. Claim 6 says they emerge *without* attributing concepts.
          *   *Verdict:* Apparent Conflict (can be reconciled via "as if" or levels of explanation), but potentially Genuine if Claim 1 is read ontologically. Let's call it Medium Severity.

  5.  **Developing Repairs:**

      *   *Repair for Conflict 1 (Umbrella/Coordination):* Either admit the umbrella case is a *social norm* (not a Lewisian convention) or broaden Claim 3 to allow normativity to attach to conventions (Bicchieri's view).
      *   *Repair for Conflict 2 (CK):* Modify Claim 1 to say "satisfies his conditions *mutatis mutandis*" or "satisfies the *spirit* of his conditions," acknowledging Sugden's revision on CK in Claim 5. Or modify Claim 5 to say CK is theoretically required but psychologically reduced to first-order expectation.
      *   *Repair for Conflict 3 (Evolution):* Distinguish between *genesis* (Claim 6) and *maintenance* (Claim 1). Or claim that Skyrmsian dynamics *produce* Lewisian equilibria.

  6.  **Identifying Compatible Pairs:**

      *   *Claims 2 & 3:* Arbitrariness fits well with Coordination Problems.
      *   *Claims 5 & 6:* Sugden's skepticism of CK aligns well with Evolutionary accounts (neither requires hyper-rationality).
      *   *Claims 1 & 7:* If you accept Lewis's definition, defending his language application is consistent (unless CK kills it).

  7.  **Drafting the Response:**

      *   *Structure:*
          1.  Executive Summary (Overall assessment).
          2.  Ranked Conflicts (Severity, Diagnosis, Repair/Cost).
          3.  Compatible Pairs (Why they work).
          4.  Recommendations for the Handout.
      *   *Tone:* Professional, philosophical, constructive, precise.
      *   *Check:* Did I address all 7 claims? Yes. Did I rank severity? Yes. Did I avoid assuming preference? Yes.

      *(Self-Correction during drafting)*: I need to be careful with Claim 3. Lewis actually allows for some normativity in conventions (the "ought" of rationality), but Claim 3 explicitly contrasts conventions with moral/legal norms based on the *gain by defecting*. The umbrella example describes third-party sanction. This is the hallmark of a *social norm* (Bicchieri) rather than a Lewisian convention. This is the biggest philosophical hole in the handout.
      Also, Claim 1 vs Claim 5 is a direct contradiction regarding the *definition*. If I say "X satisfies conditions A-F" and then "Condition F does no work," I am technically saying X satisfies A-E and a useless F. It's not a logical contradiction, but it's a theoretical tension. I should frame it as a tension between *orthodoxy* (Claim 1) and *revisionism* (Claim 5).

      *Refining the Conflict 1 (Umbrella):* Claim 3 says if there's a gain by defecting, it's not a convention. The umbrella case implies taking one is *wrong*. Usually, if it's just a convention, taking one is *inconvenient* for others. If it's *wrong*, there's a normative layer. Does this imply a gain by defecting? If I take an umbrella, I stay dry (gain), others get wet (loss). If it's a coordination problem, we all want to leave umbrellas. If I defect, I gain. So Claim 3 says this *shouldn't* be a convention. But Claim 4 says it *is*. This is a direct contradiction.

      *Refining Conflict 2 (CK):* Claim 1 says "satisfies his six conditions." Claim 5 says "Common knowledge does no explanatory work." If it does no work, why include it as a condition? The repair is to amend Claim 1 to reflect the Sugden revision.

      *Refining Conflict 3 (Skyrms vs Lewis):* Lewis is rationalist; Skyrms is evolutionary. Claim 6 says agents don't need the concepts. Claim 1 says the convention is sustained by preferences/expectations. If agents don't have the concepts, do they have the expectations? Skyrms says they behave *as if*. Claim 1 says they *have* preferences. This is an ontological clash.

  8.  **Final Polish:** Ensure the ranking is clear. Ensure the "Cost" of repair is articulated philosophically (e.g., "loss of Lewisian orthodoxy," "blurring the norm/convention distinction").

      *Ranking:*
      1.  Claim 3 vs Claim 4 (The Umbrella Problem). This undermines the examples.
      2.  Claim 1 vs Claim 5 (The CK Problem). This undermines the definition.
      3.  Claim 1 vs Claim 6 (The Agency Problem). This undermines the mechanism.

      *Compatibility:*
      1.  2 & 3 (Arbitrariness & Coordination).
      2.  5 & 6 (Skepticism & Evolution).
      3.  1 & 7 (Lewis Core & Language).

