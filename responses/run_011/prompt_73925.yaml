prompt: |-
  You're a moral philosopher who works on population ethics and suffering-focused views. Think it through carefully — maybe sketch a raw list of candidate defeaters first, then sort them.

  Here's my position: suffering is lexically prior. No amount of happiness, however large or however many people it's spread over, ever outweighs an additional instance of suffering, and I hold that even inside a single life rather than just between lives. On top of that I want to keep the view person-affecting — what matters is that things go better or worse for somebody, not impersonal totals.

  What would count against this? I want the arguments, the intuitions, and the formal results (impossibility theorems in population ethics, the pinprick-style cases, whatever else) that should actually move me, ranked from fatal to merely awkward. Which of these would a defender of the view concede as a real cost, and which would they bite the bullet on or explain away? And does bolting lexicality onto a person-affecting restriction leave the view risking anything at all, or have I qualified it into something unfalsifable — and if it's insulated like that, is that a problem for a view of this kind?

  For what it's worth, I'd be most moved by an argument that my position collapses into a rival rather than by grim-sounding thought experiments. Please separate what's settled from what's genuinely contested among people who work on this, and don't hand me the consensus-flavored version of a live dispute.
