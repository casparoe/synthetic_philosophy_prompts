answer: |-
  1. The theory must distinguish the real output effects of a sudden mine discovery versus a gradual trade surplus versus a hoarded seizure, or prove their equivalence through explicit transmission channels. This is non-negotiable because policy prescriptions for stimulus depend entirely on whether the source and velocity of liquidity alter real variables differently.

  2. Under commodity money, the model must account for the resource cost of production altering the net wealth effect, shifting to a seigniorage constraint under paper credit. This is non-negotiable because ignoring the production cost of specie falsely equates mining windfalls with fiat expansions.

  3. The framework must explain how domestic price levels adjust relative to foreign prices to restore trade balance without assuming instantaneous arbitrage. This is a preference of the classical camp, as modern sticky-price models often bypass the trade-flow mechanism entirely.

  4. It must specify the duration of non-neutrality explicitly, rather than assuming away adjustment costs that define the short-run stimulus effect. This is non-negotiable, though it risks being jointly unsatisfiable with Item 3 if price adjustments are too slow to restore trade balances within the stimulus window.

  5. The theory must identify who receives the money first to determine relative price changes, known as Cantillon effects. This is non-negotiable, and it eliminates the most otherwise attractive theories because aggregate models often assume proportional distribution that never occurs in reality.
