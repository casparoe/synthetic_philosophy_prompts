      *   **Section 3: The Commitment.** Which metric to keep?
          *   *Decision:* **Calibration within Groups.**
          *   *Why:* A risk score is a claim about frequency. If it lies, it loses its meaning. Equalized Odds requires threshold manipulation that decouples score from reality.
          *   *Caveat:* Calibration isn't enough. It allows disparate impact.
          *   *The Kicker:* If Calibration shows divergent base rates, **do not adjust the threshold to fix it.** Instead, **investigate the label.** If you can't fix the label, **do not deploy.**
