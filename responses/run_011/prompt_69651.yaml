      *   *My Position:* This is the escape hatch, but it's dangerous. Relying on "true prevalence" is epistemically arrogant. We don't know the true prevalence. We *only* have the administrative data. Therefore, we must regulate the *decision*, not the *prediction*.
      *   *Nuance:* Fixing the label is ideal but often impossible. Fixing the usage is actionable.

  4.  **Formulate the Commitment (The "Verdict"):**
      *   *Option A:* Keep Calibration. (Throw over Equalized Odds). Why? Calibration is about truth-telling. If the risk score says 10%, it should mean 10%. Equalized Odds forces lying to groups to make error rates match.
      *   *Option B:* Keep Equalized Odds. (Throw over Calibration). Why? Equal outcomes matter more than statistical consistency.
      *   *Option C:* Keep Predictive Parity.
      *   *My Choice:* **Calibration within Groups.**
      *   *Reasoning:* A risk score is a statement of fact (probabilistic). If you distort it to achieve equal error rates, you are lying about the risk. Lying about risk leads to bad resource allocation. However, Calibration *alone* is insufficient (you can be calibrated and still harm a group disproportionately).
      *   *Refinement:* Actually, the prompt asks what I'd *require*. If I require Calibration, I admit base rate differences lead to disparate impact. If I require Equalized Odds, I admit I'm distorting probability.
      *   *Stronger Position:* **Throw over the Risk Score entirely for high-stakes decisions if base rates differ significantly.** Or, more pragmatically: **Require Calibration, forbid Equalized Odds, but mandate that base rate differences trigger a review of the *label*, not the *threshold*.**
      *   *Wait, let's look closer at the "Useless Classifier" point.* If the only way to satisfy all three is to be useless, then the requirement should be: **Do not deploy if you cannot satisfy fairness constraints without rendering the tool useless.**
      *   *Better Commitment:* **Calibration is non-negotiable. Equalized Odds is negotiable.** Why? Because Calibration is epistemic (truth), Equalized Odds is political (distribution). You can debate distribution; you shouldn't debate truth. But, if Calibration reveals massive base rate disparities, the system must pause to investigate the *label generation*, not tweak the threshold.

  5.  **Drafting - Section by Section:**

