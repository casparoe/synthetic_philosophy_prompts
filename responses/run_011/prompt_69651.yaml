      *   **Section 1: The Budget Constraint.** Explain that the theorem basically says: "To get equal error rates with unequal base rates, you must destroy information." The tragedy isn't mathematical; it's that society wants high accuracy *and* parity in a world with structural inequality. The math just enforces the bill.
