prompt: |-
  I'm halfway through a novel whose protagonist is a myrmecologist who thinks the colony in her lab has beliefs — literally, not as a way of talking — and her running argument with a sceptical colleague is the spine of about two hundred pages. She's read the Aunt Hillary / Ant Fugue stuff and takes it seriously, which her colleague says is precisely the problem. Help me get the argument right: draft the joint statement that a genuine adverserial collaboration between these two camps could both put their names to.

  I want numbered claims both sides accept; then the disagreements stated exactly, each side's position worded so that side would happily sign its own wording rather than a strawman; then the cruxes — the sub-questions where actually settling the thing would move at least one of them — and for each crux a concrete experiment or thought-case both agree bears on it, with each side's prediction written down in advance. Work from my case material rather than inventing your own: a 40,000-ant lab colony whose entire trail network has been mapped; trained on a two-choice foraging discrimination (which of two bridges leads to sucrose, cued by a light the individual ants demonstrably can't resolve) running at 85% over 300 trials; when the colony is split into two fragments of 20,000 each, both fragments recover the discrimination to 70% within a week, and re-fusing them produces no conflict and no double-counting; and nothing the colony does is ever something an individual ant is doing — no reporting, no learning in any one head.

  Start straight into the document: no preface, no framing, no re-stating what I asked for. Then at the very end, a short honest note — which of the agreed claims is least stable, what finding would blow the truce up, and where you think you've quietly worded something to favour one side or the other.
