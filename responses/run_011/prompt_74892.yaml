  **JOINT STATEMENT OF AGREED FACTS AND DISPUTED INTERPRETATIONS**
  **Project:** Colony C-40k Discrimination Dynamics
  **Parties:** Dr. Aris Thorne (Principal Investigator), Dr. Julian Vane (External Reviewer)

  **I. AGREED EMPIRICAL CLAIMS**

  1.  **Individual Incapacity:** No individual ant in Colony C-40k possesses the sensory resolution to distinguish the experimental light cues (λ=450nm vs λ=470nm) nor the cognitive capacity to learn the bridge-sucrose mapping in isolation.
  2.  **Collective Performance:** The colony as a whole maintains a choice accuracy of 85% over 300 trials regarding which bridge leads to sucrose, contingent on the light cue.
  3.  **Distributed Locus:** There is no central controller, no reporting mechanism, and no evidence of the mapping being stored in any single ant's nervous system. The behavior emerges from trail network dynamics and local interactions.
  4.  **Fission Resilience:** When split into two fragments of 20,000 ants each, both fragments independently recover the discrimination task to 70% accuracy within seven days without re-training.
  5.  **Fusion Compatibility:** Upon re-fusing the two fragments, the colony returns to 85% accuracy without exhibiting aggressive conflict, trail deadlock, or "double-counting" of resources.
  6.  **Network Mapping:** The entire trail network has been mapped; changes in trail topology correlate with shifts in choice accuracy, but no single trail segment is necessary or sufficient for the behavior.

  **II. STATEMENTS OF DISAGREEMENT**

  **A. The Ontological Status of the Colony State**

  *   **Dr. Thorne's Position:**
      "The colony satisfies the functional criteria for possessing a belief. The 85% accuracy rate reflects a stable, internal representational state regarding the environment (specifically, 'Light A implies Bridge 1') that guides action despite individual ignorance. This state is held by the colony as a single cognitive unit. The split/fuse data confirms that this belief is a property of the system's organization, not its specific material components, consistent with the 'Aunt Hillary' functionalist model."

  *   **Dr. Vane's Position:**
      "The colony exhibits belief-like *behavior* but lacks the ontological substrate for belief. Attributing propositional attitudes to a distributed network is a category error. The 85% accuracy is explained by stigmergic feedback loops and differential reinforcement rates across the population. The split/fuse data demonstrates robust homeostatic regulation and redundancy, not the partitioning or merging of a mind. To call this 'belief' is metaphorical useful shorthand, not literal description."

  **B. The Nature of the Split/Recover Phenomenon**

  *   **Dr. Thorne's Position:**
      "The recovery of 70% accuracy in both fragments indicates that the belief state was duplicated or distributed holographically across the network. The system retains 'knowledge' of the task even when halved, implying the belief is a global property that persists so long as critical mass is maintained."

  *   **Dr. Vane's Position:**
      "The recovery indicates that the *rules of interaction* were preserved in both fragments, not the knowledge itself. Each fragment re-learned the task rapidly because the environmental contingencies remained constant and the population density remained sufficient for efficient stigmergy. There was no transfer of information, only preservation of capacity."

  **III. CRUXES AND PRE-REGISTERED TESTS**

  **Crux 1: Doxastic Revision vs. Extinction**
  *Question:* Does the colony update its state based on new information in a manner distinct from simple operant conditioning extinction curves?
  *Experiment:* **The False Cue Reversal.** After establishing the 85% baseline (Light A → Bridge 1), reverse the contingency without warning (Light A → Bridge 2). Measure the transition period.
  *   **Dr. Thorne's Prediction:** The colony will exhibit a period of "confusion" (increased variance, hesitation at the choice point) indicative of a conflict between the existing belief state and new sensory data, followed by a rapid update once the new model is formed. The transition will be non-linear.
  *   **Dr. Vane's Prediction:** The colony will show a standard extinction curve followed by re-acquisition. Traffic will shift gradually as pheromone trails decay and are rebuilt based on immediate sucrose discovery. There will be no hesitation phase, only a lag in trail reinforcement.

  **Crux 2: Unity of Mind vs. Aggregate Competition**
  *Question:* Upon fusion, does the colony act as a single integrated agent or as two competing sub-systems reaching equilibrium?
  *Experiment:* **Asymmetric Fusion.** Fragment A is trained on Light A → Bridge 1. Fragment B is trained on Light A → Bridge 2. Both achieve 70% accuracy. Fragments are then fused. Light A is presented.
  *   **Dr. Thorne's Prediction:** The fused colony will experience cognitive dissonance. We expect a temporary collapse in performance below chance levels as the single belief state attempts to resolve the contradiction, followed by a convergence to a new unified decision. The colony will act as one confused entity, not two fighting ones.
  *   **Dr. Vane's Prediction:** The trails established by Fragment A and Fragment B will compete physically. We expect a winner-take-all dynamic based on slight initial fluctuations in traffic flow (positive feedback). There will be no "confusion," only competing chemical gradients until one dominates. Performance will not dip below the baseline of the stronger fragment.

  **Crux 3: Substrate Independence**
  *Question:* Is the belief tied to the biological continuity of the ants or the functional structure of the network?
  *Experiment:* **The Theseus Swap.** During the split phase (20k/20k), replace 50% of the ants in Fragment A with naive ants from a non-experimental colony, maintaining density.
  *   **Dr. Thorne's Prediction:** Accuracy will remain stable (~70%). The belief is held by the network structure and the remaining experienced ants acting as scaffolding. The identity of the substrate (specific ants) is irrelevant to the persistence of the belief.
  *   **Dr. Vane's Position:** Accuracy will drop proportionally to the loss of experienced foragers. The "memory" is in the statistical distribution of experienced individuals. Removing them removes the capacity for the behavior, proving there is no emergent belief state independent of the constituent agents' history.

  ***

  **HONEST NOTE (INTERNAL MEMO)**

  **Least Stable Claim:** Claim 3 (Distributed Locus). It is empirically difficult to prove a negative ("no learning in any one head"). If Vane finds even a subset of "elite" foragers who memorize the route, Thorne's functionalist argument collapses into a standard hierarchical model.

  **Finding That Blows the Truce:** If, in Crux 2 (Asymmetric Fusion), the colony splits physically down the middle and uses both bridges simultaneously without conflict. Thorne would have to admit there are two minds; Vane would claim victory for the aggregate model. However, if they merge seamlessly into a *wrong* choice (unified error), Thorne wins (unified belief), but Vane might argue that's just noise. The real truce-breaker is if an individual ant is found to communicate the mapping via tandem running—that kills the emergent property claim.

  **Bias Check:** I have likely weighted Crux 1 in Thorne's favor. Describing the transition as "confusion" presupposes a mental state. Vane's "extinction curve" is the safer biological bet. I also worded Thorne's position on the Split/Recover phenomenon to sound more "holographic" than the data strictly supports; Vane's "preservation of capacity" is the more parsimonious reading. The document leans slightly towards granting Thorne's ontology the benefit of the doubt in the experimental predictions, likely because the novel requires her argument to remain viable. Vane sounds more like a methodological blocker than a true ontological skeptic here.
