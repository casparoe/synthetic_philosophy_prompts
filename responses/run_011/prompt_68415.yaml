  4. If the ant-level description can in principle license the same counterfactuals, then "comparable tractability" sounds like a claim about us rather than about the world; is your criterion epistemic?
     *   **Follow-up:** If you admit the criterion is epistemic but insist ontology follows utility, does utility vary across observers enough to fracture the ontology?
     *   **Likely Reply:** She will admit the criterion is epistemic but insist ontology follows utility.

  5. Colonies bud, split, fuse, drift workers into neighboring nests, and adopt foreign brood; which of these operations preserves the subject and can your answer avoid being ad hoc?
     *   **Follow-up:** If you appeal to continuity of control architecture, does a temporary loss of control during a split break subjecthood permanently?
     *   **Likely Reply:** She will appeal to continuity of control architecture.

  6. Nest-site choice in social insects is often explained by quorum-style thresholds whose individual-level implementation is quite well understood; what does the colony-level attribution add to that explanation?
     *   **Follow-up:** If you claim it predicts system-level resilience to noise, can you name a specific noise variable the individual model fails to capture?
     *   **Likely Reply:** She will claim it predicts system-level resilience to noise.

  7. Ants have nervous systems, learn individually, and plausibly have representations of their own, whereas neurons do not; does the presence of full-fledged sub-subjects make the colony a better candidate for subjecthood or a worse one?
     *   **Follow-up:** If you argue competing loci of control undermine unity, should human societies with competing individuals then deny collective cognition?
     *   **Likely Reply:** She will argue competing loci of control undermine unity.

  8. Your conditions look equally satisfied by cities, markets, and the global airline network, so why does your criterion stop at insects?
     *   **Follow-up:** If you posit a hidden constraint on causal density or integration, why do insects meet this threshold while densely connected human markets do not?
     *   **Likely Reply:** She will posit a hidden constraint on causal density or integration.

  9. Do you think the colony is a subject of experience, and if you deny it, what principle could separate cognition from experience in a system assembled this way?
     *   **Follow-up:** If you defer phenomenology until functional architecture is settled, can functionalism alone ever bridge the explanatory gap?
     *   **Likely Reply:** She will defer phenomenology until functional architecture is settled.

  10. What observation or experiment would convince you that the colony-level subject attribution is false?
      *   **Follow-up:** If you retreat to the failure of your own criteria, does that make your position unfalsifiable by empirical data alone?
      *   **Likely Reply:** She will retreat to the failure of her own criteria.
