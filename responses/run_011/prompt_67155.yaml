answer: |-
  **The Scenario**

  The Municipal Planning Office manages zoning variances. Two practices date back forty years.

  **Practice A:** "The Quiet Month." A mandatory 30-day holding period for all variance approvals, even when applications meet all technical criteria.
  **Practice B:** "Physical Ledger Signing." All approved variances must be hand-signed by the Director in ink before filing.

  A reform team, diligent and well-resourced, audits both. They find Practice B's origin documented: ink signatures ensured chain-of-custody for paper files. Since digitization five years ago, this function is obsolete. The cost is the Director's weekly labor hours.

  For Practice A, no origin record exists. Veterans claim it "keeps things calm," but logs show no disputes resolved during holds. The reformers argue the hold imposes real costs: applicants lose financing opportunities due to delay. A consultant confirms no measurable benefit in current data. The function appears to be the prevention of informal neighborhood conflicts that, if allowed to escalate, would become formal lawsuits. Because the hold prevents the escalation, no record of the prevented lawsuit exists. The evidence of utility is pre-empted by the practice itself.

  The Conservative recommends abolishing B but retaining A.

  ***

  **1. Fixed Respects and Difference**
  *   **Fixed:** Age (both 40 years); Cost (both impose significant labor/time burdens); Burden-bearers (staff and public); Reformer diligence (exhaustive archival and data search); Institutional records (complete for B, silent for A).
  *   **Difference:** Articulability of original function. B's function is known and lapsed; A's function is unknown and structurally invisible (its success leaves no trace).

  **2. Chestertonian Reasoning**
  *   **For B:** Chesterton's Fence requires knowing the reason before removal. Here, the reason (custody) is known and the condition (paper files) is gone. Satisfying the demand to understand the fence licenses removal because the *condition* for the fence's existence has vanished.
  *   **For A:** The reformer's diligent failure to find a reason is taken as evidence of depth, not absence. The Conservative argues that if the function were simple, a competent reformer would have found it. The fact that the function hides itself (by preventing the conflict that would reveal it) suggests a complexity the reformer cannot access without destroying the mechanism. We owe the fence respect because our ignorance is systematic, not accidental.

  **3. Falsification Test**
  No evidence obtainable from inside the institution while Practice A stands can convince the Conservative she is wrong. The alleged benefit is the absence of lawsuits; absence cannot be proven while the prevention mechanism exists. To falsify the diagnosis, A must be removed to see if lawsuits spike.
  *Confrontation:* This admits the principle is unfalsifiable in real-time. If the Conservative cannot specify what internal evidence would change her mind, her principle risks being empty—a rationalization for the status quo disguised as epistemic humility.

  **4. Feature Identification and Perturbations**
  *   **Working Feature:** The asymmetry of epistemic access (known vs. pre-empted function).
  *   **Perturbation 1 (Costs on Conservative's Group):** If the Planning Staff (the Conservative's allies) bear the delay costs of A, and she still keeps A, she absorbs this. If she drops A, she reveals bias.
  *   **Perturbation 2 (B's Function Active):** If it turns out paper files are still legally required, B must be kept. This threatens the **design**, not the principle. The case relies on one removal to show discrimination; if both are kept, the test fails to distinguish bias from principle.
  *   **Verdict:** The Conservative can absorb Perturbation 1; Perturbation 2 collapses the experimental contrast.

  **5. Attack, Reply, and Burke vs. Chesterton**
  *   **Reformer's Attack:** You are privileging ignorance. By treating the absence of evidence as evidence of absence-of-evidence, you make tradition immune to revision. This is not humility; it is paralysis.
  *   **Conservative's Reply:** It is not immunity, but a burden of proof shift. Linear analysis sees only visible costs; it misses systemic stabilizers that operate via friction. Paralysis is preferable to systemic collapse caused by optimizing visible variables while breaking invisible load-bearing walls.
  *   **Burke vs. Chesterton:** The Conservative relies on **Chesterton** here. Burke would retain B based on prescription alone, regardless of the lapsed function, because the arrangement is inherited. Burke views society as a partnership across time; breaking a link violates the dead. Chesterton focuses on the limit of current reason. On Practice A, Burke would keep it simply because it is old. Chesterton keeps it because the reason is unknown. If the reason for A were discovered to be trivial, Chesterton would remove it; Burke might still keep it for the sake of continuity. Thus, Chesterton offers a criterion (know the reason), whereas Burke offers a standing (inheritance).
