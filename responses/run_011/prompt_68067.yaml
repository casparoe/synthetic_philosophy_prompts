prompt: |-
  I am in the second year of a philosophy doctorate, and for the past two terms I have been working through normative uncertainty in a reading group. I can run the standard machinery competently: assign credences to the moral theories I take seriously, put their verdicts on a common scale where that is possible, and choose the option with the highest expected choice-worthiness; on the examples we were given in the seminar, it delivers answers I am happy with. The difficulty is that when I write down what I actually think about cases of my own devising, my verdicts diverge from the machinery in a way that looks systematic rather than arbitrary, and I have not been able to state the pattern. I have been asked to present something in the department's work-in-progress series in a few weeks, and I would rather bring a question that is genuinely unresolved for me than a summary of positions. One friend's diagnosis, offered half in jest, is that I simply do not hold the credences I claim to hold, and that everything else is rationalization; I suspect there is something to this, but I cannot tell whether it can be made into a coherent view.

  Here are the verdicts, as honestly as I can report them. (a) On charitable giving I divide roughly 60/40 between a fairly demanding consequentialist view and a commonsense view on which aid past a modest threshold is supererogatory. I think I ought to give well above the commonsense threshold; the wide range of the demanding view outweighs my greater confidence in the permissive one. (b) On a particular false statement to a colleague I give 25% to a rigorist view on which it is a grave wrong of roughly the same kind as betrayal, and 75% to a view on which it is morally unremarkable. The two views disagree about whether any distinction is in play at all: the rigorist thinks everything turns on the difference between asserting what one believes false and merely permitting a misleading impression, a difference the other view denies is morally real. My verdict: I feel almost no pull from the rigorist view. I would behave as though its probability were close to zero, and I would not be surprised to learn that I had been treating it that way all along. (c) On diverting a threat onto one person instead of five I am split evenly between a view that forbids diverting and a view that forbids refraining. Here both views agree completely about what the situation is — one agent, five lives, a switch — and disagree only about how it is to be valued. My verdict: the disagreement is fully live, it makes me hesitate, and it disposes me to hunt for a third option both views rank acceptably. On the surface (b) and (c) look alike — substantial credence on each side, substantial stakes either way — yet only (c) moves me, and my hunch is that the difference has nothing to do with stakes and everything to do with whether the theories share a description of the act. (d) On long-haul air travel, one view I give 55% holds that flying and purchasing offsets is a genuine third option, distinct from flying simpliciter; another I give 45% holds that no such option exists, so the choice set contains only flying and not flying. My verdict: I do not average across the two choice sets. I first settle whether offsetting is a thing, and I settle it by asking which view I trust more about what such a transaction could possibly amount to — a descriptive question — rather than by asking which I trust more about what is permissible; and once settled, I experience no residual unease, despite retaining 45% credence in the view I discarded. (e) On procedure, I am evenly split between maximizing expected choice-worthiness and simply acting on whichever first-order theory I believe most. My verdict: I go with the favourite theory, but I feel faintly as though I have broken a rule — which is the opposite direction of trade from (a), where the low-credence, high-range theory won outright. (f) The case I keep returning to: a view I give 5% says that an entirely ordinary purchase of mine makes me a participant in something horrific. The view is internally coherent and its argument is not obviously bad, but its conclusion depends on describing the purchase as participation rather than as a causally remote and negligible contribution, a description the rest of my credal distribution rejects as drawing no real distinction. Compare a second 5%-credence view, which says that the treatment of animals in food production is torture; there, everything in my distribution agrees about what is happening and disagrees only about how to value it. My verdict: in the first case I do nothing and do not feel akratic; in the second I have changed my behaviour considerably.

  What I would like is a principle, or a small set of candidate principles, that generates these verdicts — or that gets as close as possible while telling me plainly where it must break with me. In particular: can the underlying idea be stated precisely enough to be applied rather than gestured at, something to the effect that a theory's effective weight is reduced in proportion to how much of its verdict depends on distinctions that the other theories in my distribution deny are real? If so, which clause of it does each case motivate, and which of my cases come out differently under the simpler alternatives I can think of — plain expected-choice-worthiness maximization, expected-choice-worthiness maximization applied only after fixing an act-description by something like a vote across theories, a favourite-theory rule, and a maximin or robustness rule? I also want the admissibility objection taken seriously: my principle appears to let my credences depend on the decision procedure I am using, when credences are supposed to be inputs to it. Can that be answered — perhaps by insisting that what is really going on is a claim about how to individuate the objects of my uncertainty, so that the rigorist view in (b) is not a rival moral theory at all but a moral theory plus a contested descriptive claim, and I have been miscounting my theories — or is it fatal? Then tell me what the principle predicts where I have no verdict yet: two theories that draw exactly the same fine distinctions but assign them opposite weights; a disputed description that is backed by non-moral evidence, such as settled facts about what my purchase causally does; and a case in which every theory I take seriously agrees on the description, where the principle ought to switch off and ordinary expected-choice-worthiness reasoning to return. Finally, be candid about which of my verdicts the principle cannot save, and if it has to overturn (e) rather than (a), explain why that is the cheaper sacrifice. Do not trouble yourself with references; I will supply those once I know what position I am actually defending.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** 2nd-year Philosophy PhD student.
      *   **Context:** Working on normative uncertainty (NU). Competent with standard machinery (MEC - Maximizing Expected Choice-worthiness).
      *   **Problem:** Intuitive verdicts on self-devised cases systematically diverge from standard MEC.
      *   **Goal:** Needs a principle (or set of principles) that captures these divergences for a work-in-progress talk. Wants to present an unresolved question, not a summary.
      *   **Specific Constraints:**
          *   No references (focus on the argument).
          *   Address the "admissibility objection" (credences depending on decision procedure).
          *   Apply the principle to new test cases (same distinctions/opposite weights, non-moral evidence on description, full agreement on description).
          *   Identify which verdicts the principle *cannot* save (specifically comparing (a) and (e)).
          *   Tone: Philosophical, precise, candid, engaging with the technical details of NU.

  2.  **Deconstruct the Cases & Identify the Pattern:**
      *   *(a) Charitable Giving:* 60% Commonsense (permissive), 40% Demanding (consequentialist). *Verdict:* Give a lot (Demanding wins). *Note:* Standard MEC works here. High stakes/range of demanding view outweighs higher credence in permissive.
      *   *(b) False Statement:* 25% Rigorist (lying is betrayal), 75% Permissive (no distinction). *Verdict:* Ignore Rigorist. Act as if 0%. *Key Feature:* Rigorist relies on a descriptive distinction (asserting false vs. misleading) that the 75% view denies is *real*.
      *   *(c) Trolley:* 50% Deontological (don't divert), 50% Consequentialist (divert). *Verdict:* Hesitate, look for third option. *Key Feature:* Both agree on description (diverting threat), disagree on value. MEC paralysis/uncertainty is felt.
      *   *(d) Air Travel/Offsets:* 55% Offsets exist (3rd option), 45% Offsets don't exist (binary choice). *Verdict:* Settle description first (trust 55%), then choose. No residual uncertainty. *Key Feature:* Disagreement is about *metaphysics/description of options*, not just value.
      *   *(e) Procedure:* 50% MEC, 50% My Favorite Theory (MFT). *Verdict:* Choose MFT, feel guilty. *Key Feature:* Uncertainty about the *decision rule* itself.
      *   *(f) Complicity (5%):* 5% "Participation" (horrific), 95% "Causal/Remote" (okay). 5% "Animal Torture" (all agree on description). *Verdict:* Ignore "Participation" (act as if 0%), Change behavior for "Torture". *Key Feature:* "Participation" relies on a descriptive distinction the 95% reject. "Torture" agrees on description.

      *   **The Core Pattern:** The user's intuitions discount normative theories when their verdicts depend on *descriptive/metaphysical claims* about the act or options that are rejected by the majority of their credence distribution. When theories agree on the *description* of the act/options but disagree on *value*, standard uncertainty applies. When they disagree on *what the act is* or *what options exist*, the user wants to settle the descriptive question first (often by majority credence or "trust") and then apply normative uncertainty within that framework. Effectively, the user is treating "Descriptive + Normative" packages differently from "Purely Normative" disagreements.

  3.  **Formulate the Principle:**
      *   *Working Title:* The Descriptive Independence Principle (DIP) or The Act-Individuation Constraint.
      *   *Core Idea:* Normative uncertainty applies only across theories that share a common descriptive ontology of the choice situation. If a theory's verdict hinges on a descriptive claim (e.g., "this is participation," "offsets are a distinct option") that other high-credence theories deny, that theory's normative weight is discounted or bracketed until the descriptive question is settled.
      *   *Refinement:* It's not just discounting. It's a two-stage process.
          1.  **Descriptive Settlement:** Determine the "Act-Type" or "Option Set" based on the weighted consensus of descriptive claims across theories.
          2.  **Normative Evaluation:** Apply MEC (or other rules) only to theories that accept the settled description.
      *   *Why?* Because you can't maximize expected choice-worthiness over options that half your theories say *don't exist* or acts that half your theories say *are not happening*.

  4.  **Address the Admissibility Objection:**
      *   *Objection:* Credences should be inputs. If the decision procedure (settling description first) changes how we weigh the theories, aren't we circular?
      *   *Response:* Reframe the "theories." The Rigorist in (b) isn't just a moral theory; it's a *conjunction* of a moral claim and a descriptive claim. The user's credence in the *conjunction* is what matters. If the descriptive part is low credence (because 75% say the distinction isn't real), the effective credence in the *normative verdict* derived from that distinction should be low. It's not that the procedure changes credences; it's that the *objects* of uncertainty were misidentified. We are uncertain about *world-states + values*, not just values.

  5.  **Test Against Alternatives:**
      *   *Standard MEC:* Fails on (b), (d), (f). Would force averaging over incompatible option sets.
      *   *MEC after Descriptive Vote:* Gets (d) and (f) right. Gets (b) right. Might struggle with (c) if descriptions align (which they do).
      *   *My Favorite Theory (MFT):* Gets (e) right (by definition), but fails (a) (where low credence theory won).
      *   *Maximin/Robustness:* Might explain (c) (looking for third option), but fails (a) (where risky demanding view won).

  6.  **Develop the Predictions (New Cases):**
      *   *Case 1 (Same distinctions, opposite weights):* If descriptions align, DIP switches off. Standard MEC applies. (Matches intuition in (c)).
      *   *Case 2 (Disputed description backed by non-moral evidence):* If science says "offsets don't work," the 55% view in (d) loses descriptive plausibility. DIP says settle based on evidence, then apply norms.
      *   *Case 3 (Full agreement on description):* DIP is inert. Standard NU applies.

  7.  **The Hard Trade-off: (a) vs. (e):**
      *   *(a)* supports MEC (Demanding view wins despite lower credence).
      *   *(e)* supports MFT (User picks Favorite Theory despite 50/50 split on procedure).
      *   *The Principle's Verdict:* The proposed principle (Descriptive Settlement + MEC) saves (a), (b), (c), (d), (f). It *fails* on (e).
      *   *Why sacrifice (e)?* (e) is uncertainty about *procedure*. The proposed principle is a *procedure*. If you are uncertain about the procedure, you can't use the procedure to resolve the uncertainty without circularity. However, (a) is a first-order moral case where the machinery *should* work. (e) is a meta-ethical/methodological hesitation. It is "cheaper" to admit the principle doesn't resolve procedural uncertainty (which might require a regress stopper) than to admit it fails on substantive moral cases like (a) or (f). Also, the "guilt" in (e) suggests the user *knows* MEC is rationally required but psychologically finds it hard. The principle validates the rational requirement (MEC) over the psychological pull (MFT).

  8.  **Drafting the Response:**
      *   *Structure:*
          1.  Diagnosis: Identify the "Descriptive/Normative Entanglement."
          2.  The Principle: "Descriptive Precondition for Normative Aggregation."
          3.  Application to Cases: Walk through (a)-(f).
          4.  Comparison with Alternatives: Why MEC, MFT, etc., fail.
          5.  The Admissibility Objection: Reframing credence objects.
          6.  Predictions: The three test cases.
          7.  The Sacrifice: Why (e) must go.
      *   *Tone:* Academic, rigorous, empathetic to the PhD struggle. No fluff.

  9.  **Refining the Principle (Self-Correction during drafting):**
      *   Make sure to distinguish between *descriptive* uncertainty (is this lying?) and *normative* uncertainty (is lying wrong?).
      *   The user's intuition in (d) is key: "I first settle whether offsetting is a thing... by asking which view I trust more about what such a transaction could possibly amount to." This is descriptive settlement.
      *   The principle needs to state that *normative weight is conditional on descriptive acceptance*.
      *   Let's call it the **Conditional Credence Principle (CCP)** or **Descriptive-First Constraint**. Let's go with **The Descriptive Precondition Principle (DPP)**.

  10. **Final Polish:** Check against all constraints.
      *   No references? Yes.
      *   Address admissibility? Yes.
      *   Predict new cases? Yes.
      *   Sacrifice (e) over (a)? Yes.
      *   Candid tone? Yes.

      *(Self-Correction on (e))*: Wait, if I advocate for MEC (which (a) supports), I must tell the user that (e) is where their intuition is likely mistaken or at least rationally unstable. The prompt asks: "if it has to overturn (e) rather than (a), explain why that is the cheaper sacrifice." I need to make a strong case for this. (a) is about *action guidance*. (e) is about *methodological justification*. If the DPP validates MEC for (a)-(d) and (f), then (e) is the outlier where the user succumbs to "theory favoritism." The "guilt" confirms the rational norm is MEC.

      *(Refining the Admissibility point)*: The friend's diagnosis ("you don't hold the credences you claim") is partially right but needs nuance. You hold credences in *propositions*. If the proposition is "Theory T is true," and T entails "Description D is true," and you have low credence in D, your effective credence in T *for the purpose of this choice* is lower. It's not irrationality; it's Bayesian conditioning on the descriptive facts.

      Let's write.

      *Structure:*
      1.  **Diagnosis:** The "Ontological Mismatch."
      2.  **The Principle:** Descriptive Precondition for Normative Aggregation.
      3.  **Case Analysis:** How it handles (a)-(f).
      4.  **Alternatives:** Why standard MEC/MFT fail.
      5.  **Admissibility:** Solving the circularity via object individuation.
      6.  **Predictions:** The three requested scenarios.
      7.  **The Sacrifice:** Why (e) must be jettisoned.

      *Key Phrase to coin:* "Descriptive Veto" or "Ontological Alignment." Let's use **Ontological Alignment Condition**.

      *Wait, one nuance on (b):* The user says "I would behave as though its probability were close to zero." This implies the credence isn't actually 25% *for decision purposes*. This supports the idea that the 25% is credence in a *conjunction* (Moral View + Descriptive Claim). If the Descriptive Claim is rejected by the 75%, the conjunction's probability collapses.

      *Okay, ready to generate.*
answer: |-
  Here is a diagnosis and a proposed principle that captures the systematic divergence you have identified.

  ### 1. The Diagnosis: Ontological Mismatch

  Your friend's diagnosis—that you do not hold the credences you claim—is partially correct but misses the structural reason why. You are reporting credences in *moral theories*, but your decision-making treats those theories as *conjunctions* of moral claims and descriptive/metaphysical claims.

  In cases (b), (d), and (f), the disagreement between theories is not merely about how to *value* a fixed set of options, but about what the options *are* or what the act *consists in*. Standard Normative Uncertainty (NU) machinery, specifically Maximizing Expected Choice-worthiness (MEC), assumes a fixed state-space and option-set over which theories assign values. When theories disagree on the ontology of the situation (e.g., whether "offsetting" is a distinct option, or whether "asserting falsely" is a distinct act-type), applying MEC directly forces you to average over incommensurable descriptions.

  Your intuition is that you cannot weigh a theory's normative verdict if that verdict depends on a descriptive premise you largely reject. You are effectively demanding **Ontological Alignment** before applying normative weighting.

  ### 2. The Principle: The Descriptive Precondition Condition (DPC)

  **Statement:**
  *Normative credences should be aggregated via expected choice-worthiness only across theories that share a common descriptive ontology of the choice situation. Where theories disagree on the description of the acts or the existence of options, the agent must first settle the descriptive question by weighting the descriptive claims according to their credences. Theories whose normative verdicts depend on descriptive claims rejected by the weighted consensus are bracketed (assigned effective zero weight) for that decision.*

  **Two-Stage Procedure:**
  1.  **Descriptive Settlement:** Identify all descriptive propositions entailed by the theories in your distribution (e.g., "Offsetting neutralizes harm," "This purchase constitutes participation"). Assign credences to these propositions based on the weighted sum of the theories that entail them (plus any non-moral evidence). Accept the description that clears a threshold of credibility (e.g., >50% or "most trusted").
  2.  **Normative Aggregation:** Apply MEC only to the subset of theories that are compatible with the settled description. Theories incompatible with the settled description are treated as having zero effective credence for this specific choice, regardless of their stated moral plausibility.

  ### 3. Application to Your Cases

  *   **(a) Charitable Giving:** Both theories agree on the description (giving money reduces suffering vs. keeping it). The disagreement is purely normative (demandingness vs. supererogation). **DPC is inert.** Standard MEC applies. The high range of the demanding view outweighs the higher credence of the permissive view. **Verdict Saved.**
  *   **(b) False Statement:** The Rigorist (25%) entails the descriptive claim "There is a moral distinction between asserting falsely and misleading." The Permissive view (75%) entails "There is no such distinction." Since 75% > 25%, the Descriptive Settlement rejects the distinction. The Rigorist is bracketed. **Verdict Saved.** (This explains why you feel no pull: the theory is ontologically incompatible with your settled world-view).
  *   **(c) Trolley:** Both theories agree on the description (diverting threat kills 1 to save 5). Disagreement is purely normative. **DPC is inert.** MEC applies. Since weights are even and values opposite, expected choice-worthiness is tied/undefined, generating hesitation and a search for a Pareto-improvement (third option). **Verdict Saved.**
  *   **(d) Air Travel:** Theory A (55%) entails "Offsets are a distinct option." Theory B (45%) entails "Offsets are not a distinct option." Descriptive Settlement favors Theory A. You proceed as if offsets exist. Theory B is bracketed for this choice because its option-set is rejected. No residual uncertainty because the normative disagreement is moot once the option is ruled in/out. **Verdict Saved.**
  *   **(e) Procedure:** This is a disagreement about the *decision rule*, not the act description. DPC does not apply because there is no prior descriptive fact to settle. You are forced to choose a rule without a meta-rule. Your verdict (pick favorite) violates the rational pressure of (a). **Verdict Overturned** (see Section 7).
  *   **(f) Complicity:**
      *   *Case 1 (Purchase):* 5% view entails "This is participation." 95% view entails "This is causal/remote." Descriptive Settlement rejects "participation." 5% view bracketed. **Verdict Saved.**
      *   *Case 2 (Animals):* 100% agree on description ("This is torture"). Disagreement is normative. DPC inert. MEC applies. 5% credence in "torture is horrific" combined with high stakes drives behavior change. **Verdict Saved.**

  ### 4. Comparison with Alternatives

  *   **Plain MEC:** Fails on (b), (d), (f). It forces you to average choice-worthiness across option-sets that half your theories say do not exist. It cannot explain why the Rigorist in (b) feels irrelevant while the Deontologist in (c) feels live.
  *   **MEC after Descriptive Vote:** This is essentially the DPC. It succeeds where Plain MEC fails.
  *   **My Favorite Theory (MFT):** Fails on (a). In (a), you explicitly reject your highest-credence theory's verdict in favor of the lower-credence, higher-stakes theory. MFT cannot account for risk-sensitivity across theories.
  *   **Maximin/Robustness:** Fails on (a). If you were a maximin reasoner under uncertainty, you would follow the Commonsense view in (a) to avoid the risk of violating the demanding view's permissions (or vice versa depending on framing), but you wouldn't get the specific "range outweighs credence" dynamic. It also fails to explain why (b) is dismissed entirely rather than treated as a high-stakes risk.

  ### 5. The Admissibility Objection

  **Objection:** Credences are inputs to the decision procedure. If the procedure (DPC) alters the effective weight of the theories based on the procedure's own requirements, you are violating the admissibility constraint. You are letting the decision rule determine the credences.

  **Response:** This is not circularity; it is **object individuation**.
  You are not updating your credence in the *moral theory* simpliciter. You are recognizing that your credence was always in the *conjunction* of the moral theory and its metaphysical commitments.
  *   Let $T_1$ be the Rigorist view. $T_1$ entails $D$ (the descriptive distinction exists).
  *   Let $T_2$ be the Permissive view. $T_2$ entails $\neg D$.
  *   You report $P(T_1) = 0.25$. But for the purpose of action, you need $P(T_1 | \text{Actual World})$.
  *   Since $T_2$ is more credible and entails $\neg D$, the probability that $D$ is true is low.
  *   Therefore, the probability that $T_1$ is *action-guiding* (i.e., that its conditions obtain) is low.

  The DPC does not change your credences; it clarifies that the *objects* of your uncertainty were misidentified in your initial report. You thought you were uncertain about *value*, but you were actually uncertain about *facts* (descriptions) that condition the value. By separating the descriptive component, you reveal that your effective credence in the *normative verdict* of the Rigorist was always near zero, even if your credence in the *abstract plausibility* of the Rigorist was 25%. The "admissibility" worry dissolves once you admit that moral theories carry descriptive baggage that must be probabilistically assessed before normative aggregation.

  ### 6. Predictions for New Cases

  **Case 1: Same Distinctions, Opposite Weights.**
  *   *Scenario:* Two theories agree on all descriptions (e.g., "This act causes X harm") but assign opposite values (one says X is good, one says X is bad).
  *   *Prediction:* DPC switches off. Since descriptions align, you proceed directly to MEC. You should feel the full force of the uncertainty (like in the Trolley case). You should not be able to dismiss either theory based on "description."
  *   *Why:* The condition for bracketing (ontological mismatch) is not met.

  **Case 2: Disputed Description Backed by Non-Moral Evidence.**
  *   *Scenario:* In the Air Travel case, suppose empirical evidence arises that offsets *do not* work (e.g., fraud in the market).
  *   *Prediction:* The Descriptive Settlement shifts decisively against the "Offsets exist" view, regardless of the 55/45 moral theory split. You must treat offsets as non-existent. Even the 55% theory is bracketed regarding the *efficacy* claim.
  *   *Why:* DPC prioritizes descriptive settlement. Non-moral evidence weighs directly on the descriptive proposition, overriding the theoretical entailment.

  **Case 3: Full Agreement on Description.**
  *   *Scenario:* All theories agree an act is "killing one to save five."
  *   *Prediction:* DPC is inert. Standard MEC returns. If one theory says this is permissible and another says it is murder, you must weigh them by credence and stake. You cannot dismiss the "murder" view as "ontologically suspect."
  *   *Why:* There is no descriptive mismatch to resolve.

  ### 7. The Sacrifice: Why (e) Must Go

  You asked me to be candid about which verdict the principle cannot save. The DPC saves (a), (b), (c), (d), and (f). It explicitly overturns **(e)**.

  In (e), you are split 50/50 between MEC and My Favorite Theory (MFT). Your verdict is to choose MFT, accompanied by a feeling of "breaking a rule."
  The DPC, as formulated, is a specification of *how to apply MEC* under conditions of descriptive uncertainty. It presupposes MEC is the correct aggregation rule. If you apply DPC, you are already committed to MEC as the second-stage procedure.

  **Why sacrificing (e) is the cheaper cost:**
  1.  **The "Guilt" Signal:** You report feeling "as though I have broken a rule." This phenomenological datum suggests your normative competence recognizes MEC as the rational requirement, even if your psychological resistance pulls you toward MFT. In (a), you felt *happy* with the MEC verdict. In (e), you feel akratic. It is methodologically sounder to trust the verdict where you feel cognitive harmony ((a)) over the one where you feel residue ((e)).
  2.  **Regress Problem:** Uncertainty about procedure is a regress trap. If you need a rule to choose a rule, you need a rule to choose that rule. MFT is a regress-stopper, but it is an arbitrary one. MEC is the only rule that respects the *structure* of your uncertainty (treating theories as hypotheses). To allow MFT in (e) while accepting MEC in (a) is inconsistent: if MEC is right for first-order moral uncertainty, it is right for procedural uncertainty unless there is a relevant difference. There is no relevant difference.
  3.  **Scope of the Principle:** The DPC is designed to solve *ontological mismatch* in first-order choices. (e) is a meta-ethical stalemate. It is better to have a principle that solves the substantive cases (where action is required) and admits that procedural uncertainty may require a separate, perhaps pragmatic, resolution, than to weaken the principle to accommodate a procedural hesitation that undermines the rational coherence of the substantive cases.

  **Conclusion for your Talk:**
  Your unresolved question is not whether MEC is correct, but **how to individuate the objects of normative uncertainty.** Your intuitions suggest that "moral theories" are not the atomic units of uncertainty; "descriptive-normative packages" are. The DPC formalizes this. The cost is admitting that your hesitation in (e) is a failure of rational nerve, not a data point for a new theory. You should present the DPC as a solution to the "Ontological Mismatch Problem," use (b) and (f) as your primary evidence, and explicitly flag (e) as the place where the theory demands you bite a bullet you currently find painful. That is a strong, defensible position for a work-in-progress.
