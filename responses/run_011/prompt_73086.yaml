answer: |-
  My thesis is that standing to blame is not a separate possession that can be acquired or lost, so hypocrisy never defeats it. Blame is legitimate whenever the moral claim is true and the blamer responds to a genuine wrong for the right kind of reason, regardless of their own record. The strongest objection to this view is that hypocritical blame constitutes a form of unfair manipulation, treating the target as a means to bolster the blamer's self-image rather than engaging them as a moral agent. In your brother's case, you feel something is "off" because you are conflating the authority of the moral law with the credibility of the messenger.

  You ask if there is no difference in kind between his lecture and a teacher's, and I reply that the difference lies in prudential effectiveness and emotional resonance, not in moral permission. Blame is not merely asserting a true proposition loudly; it is a demand for accountability, and your brother is fully entitled to make that demand because the sister owes it to the moral community, not to him personally. The teacher's blame might land harder because their life testifies to the viability of the norm, whereas your brother's life testifies to its difficulty, but both are permitted to demand compliance. To deny him standing is to suggest that only the sinless can speak against sin, which ultimately silences moral discourse rather than purifying it.
